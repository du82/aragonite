5 100.0 63.27 59.18 29.93 onetimeauth7 54.85 32.67 56.73 57.68 100.0 40.16 59.71 35.51 pwhash_argon2i 33.55 7.83 54.59 48.62 100.0 35.65 56.24 23.58 pwhash_argon2id 34.2 8.25 56.19 50.58 100.0 35.69 58.47 23.2 pwhash_scrypt 48.95 12.08 58.7 42.76 100.0 44.77 65.75 25.38 pwhash_scrypt_ll 48.33 12.87 59.23 42.54 100.0 44.57 66.02 25.52 randombytes 60.79 24.91 73.75 68.91 100.0 47.43 76.69 42.17 scalarmult 68.74 20.26 69.25 51.67 100.0 43.26 72.77 30.28 scalarmult2 67.57 25.68 72.97 50.38 100.0 41.94 80.5 28.28 scalarmult5 63.56 12.17 71.6 55.31 100.0 44.59 74.73 33.27 scalarmult6 62.56 12.19 70.3 54.95 100.0 42.47 69.93 34.82 scalarmult7 63.78 11.96 69.79 54.34 100.0 44.03 72.6 32.58 scalarmult8 62.61 18.24 67.83 54.28 100.0 42.45 71.44 32.5 scalarmult_ed25519 61.73 15.05 71.44 53.44 100.0 42.32 73.14 32.38 scalarmult_ristretto255 62.49 14.45 70.45 52.42 100.0 41.73 74.41 30.68 secretbox 51.36 26.89 70.09 65.26 100.0 43.96 58.01 33.08 secretbox2 29.99 15.22 28.95 32.76 100.0 24.68 29.18 15.22 secretbox7 51.9 16.02 55.52 56.37 100.0 37.45 58.1 31.02 secretbox8 53.14 38.03 56.43 58.82 100.0 39.44 58.66 34.84 secretbox_easy 55.1 23.9 56.36 57.67 100.0 37.83 64.6 46.08 secretbox_easy2 66.65 24.02 56.55 56.52 100.0 46.69 54.22 48.52 secretstream_xchacha20poly1305 89.79 31.7 96.58 100.0 FAIL 63.66 95.61 55.95 shorthash 44.2 34.98 54.44 62.63 100.0 42.32 45.39 32.94 siphashx24 51.06 34.89 48.23 64.54 100.0 36.88 43.26 35.6 sodium_utils 42.92 25.94 49.19 68.04 100.0 32.74 49.97 28.03 stream 55.44 17.01 62.42 45.77 100.0 37.0 66.03 26.29 stream2 54.48 20.16 62.28 42.64 100.0 35.7 65.33 24.53 stream3 49.07 47.22 69.44 51.85 100.0 52.78 64.81 31.48 stream4 49.1 24.55 74.73 55.96 100.0 49.46 51.62 27.08 verify1 39.32 14.05 45.45 38.39 100.0 28.03 53.47 22.78 xchacha20 78.6 26.12 90.47 72.59 FAIL 54.69 100.0 42.07 Download more readable results as a PDF file here: WebAssembly benchmark If speed is your primary concern, choosing WAVM should be a no brainer. On the other hand, Wasmer’s ecosystem is second to none, already providing excellent libraries for many programming languages and applications (PostgreSQL!) and a well-designed package system. Wasmtime can generate debugging information, ready to use with LLVM. This makes it a great choice for development. And Lucet was designed to run multiple instances on the same thread. To do so, it provides a way for an application to pause (yield), so that it can be resumed later by the host. That feature seems to be missing from other runtimes."
