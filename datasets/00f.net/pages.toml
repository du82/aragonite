["https://00f.net/2019/10/22/updated-webassembly-benchmark"]
title = "Updated WebAssembly benchmark using libsodium |  Frank DENIS random thoughts."
full_description = "WebAssembly runtimes keep improving every day and quite a few things have changed since the last time I benchmarked WebAssembly runtimes using libsodium. So maybe now is a good time for a new run. People suggested that wasm-opt from binaryen should be run before compiling WebAssembly code. This step was thus added. This benchmark can be reproduced using the dist-build/wasm32-wasi.sh --bench command from libsodium 1.0.18-stable. Compared runtimes: WAVM 2019-10-21 (default configuration) Lucet 0.3.0 (with –opt-level 2) Wasmtime 0.2.0 (with optimizations turned on) Wasmer 0.8.0 and 0.9.0 (Singlepass/Cranelift/LLVM backends) Results: WAVM beats everything else, hands down. Wasmer’s singlepass backend compiles quickly, but, as expected, is consistently way slower than other backends and runtimes. Even though Wasmtime, Lucet and Wasmer/Cranelift use the same code generator (Cranelift), their performance is not identical. Wasmtime is the slowest, followed by Lucet neck-to-neck with Wasmer. Different versions of Cranelift and different WASI implementations may explain the difference. I was expecting Wasmer with its LLVM backend to perform the same as WAVM, also based on LLVM. Before version 0.9, Wasmer was noticeably slower, but they quickly found and addressed the issue. It’s now pretty close to WAVM, although the latter remains the fastest runtime to date. WAVM is not only a speed daemon, but it is also the most featureful implementation yet, fully supporting WebAssembly 1.0, WASI, and more extensions than any other runtime (SIMD, threads, reference types, exceptions, sign extension, multiple memories…) It is also quite portable, and comes with an extensive C and C++ API to be easily embedded in other projects. Its development pace is also quite impressive. Test lucet native wasmer wasmer-llvm wasmer-singlepass wasmer09-llvm wasmtime wavm aead_chacha20poly1305 50.68 17.66 52.68 57.74 100.0 34.52 56.84 25.01 aead_chacha20poly13052 51.9 21.27 56.76 58.7 