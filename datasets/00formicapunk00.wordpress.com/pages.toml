description = "I had this issue preventing me to start a call, which happened on two different browsers. It turned out that the pulseaudio service was hung, and no audio devices were available for the browser to use. In that case it makes sense to check: if pulseaudio is running systemctl status --user pulseaudio if pulseaudio is…"
full_description = "“Forever loading” error with Jitsi and Google Meet On September 9, 2022 By Manu I had this issue preventing me to start a call, which happened on two different browsers. It turned out that the pulseaudio service was hung, and no audio devices were available for the browser to use. In that case it makes sense to check: if pulseaudio is running systemctl status --user pulseaudio if pulseaudio is running, that you have a list from input (sources) and output (sinks) audio devices in the Gnome Desktop Settings. You can also check from the command line with pactl list sources pactl list sinks __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67b23ac6ab934', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b23ac6ab966', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading... Related audiofloss"
