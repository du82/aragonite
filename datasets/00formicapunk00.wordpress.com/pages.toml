title = "Spinning wheel never ending while joining a video call (Google Meet) on Linux – formicapunk"
description = "On a Fedora 41 Laptop I had the following issue: when joining a Google Meet video call in a browser, the spinning wheel which indicates progress was spinning and spinning … and the call would never start. Turns out that the sound subsystem was a bit damaged. The pactl set of commands was not returning…"
full_description = "Spinning wheel never ending while joining a video call (Google Meet) on Linux On December 2, 2024 By Manu On a Fedora 41 Laptop I had the following issue: when joining a Google Meet video call in a browser, the spinning wheel which indicates progress was spinning and spinning … and the call would never start. Turns out that the sound subsystem was a bit damaged. The pactl set of commands was not returning anything. $ pactl info ..... => hanging On a well working system it should return the status of the configured sound subsystem. $ pactl info ... Server Name: PulseAudio (on PipeWire 0.3.65) ... Default Sink: alsa_output.pci-0000_00_1f.3.analog-stereo Default Source: alsa_input.usb-Logitech_Logitech_G_PRO_X_2_Gaming_Headset_0000000000000000-00.mono-fallback This is understandable, if the web browser is not able to get the default input and output audio device, it waits for one to be ready, but this never happens, so joining the call is forever hanging. The solution for me was simply to restart the pipewire service in the user systemd session. $ systemctl --user restart pipewire.service Even with this, on a Fedora 41 system, pactl command would still hang. Then I changed the backend from PipeWire to PulseAudio following the Fedora wiki and video calls were working again. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67b23912176b2', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b2391217715', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading... Related audiofedora"
