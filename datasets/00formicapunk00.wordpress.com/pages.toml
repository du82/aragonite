full_description = "Displaying CSV, OpenOffice Calc and Excel files in the console On April 24, 2023 By Manu There are multiple ways to do so, this is the one I use, with: ssconvert, the spreadsheet converter coming from the gnumeric package w3m, an text mode www browser with excellent tables support The command I am using is thus: ssconvert --export-type=Gnumeric_html:xhtml path_to_file.ods fd://1 | w3m -T text/html -dump The URI fd://1 simply means that the converted output is dumped to standart output. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67b23904c5a60', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b23904c5a8e', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading... Related"
