["https://00formicapunk00.wordpress.com/2023/07/13/debian-11-to-debian-12-bookworm-upgrade-report"]
title = "Debian 11 to Debian 12 (Bookworm) Upgrade Report – formicapunk"
description = "Laptop + Workstation My workstation was initially installed with Debian 8 back in the day, so I might have carried a lot of configuration cruft. Indeed. I followed the recommended upgrades documentation (apt upgrade --without-new-pkgs followed by apt full-upgrade). And when executing apt full-upgrade I had the following error: Preparing to unpack .../71-python3-numpy_1%3a1.24.2-1_amd64.deb ... Unpacking…"
full_description = '''Debian 11 to Debian 12 (Bookworm) Upgrade Report On July 13, 2023 By Manu Laptop + Workstation My workstation was initially installed with Debian 8 back in the day, so I might have carried a lot of configuration cruft. Indeed. I followed the recommended upgrades documentation (apt upgrade --without-new-pkgs followed by apt full-upgrade). And when executing apt full-upgrade I had the following error: Preparing to unpack .../71-python3-numpy_1%3a1.24.2-1_amd64.deb ... Unpacking python3-numpy (1:1.24.2-1) over (1:1.19.5-1) ... dpkg: error processing archive /tmp/apt-dpkg-install-ibI85v/71-python3-numpy_1%3a1.24.2-1_amd64.deb (--unpack): trying to overwrite '/usr/bin/f2py', which is also in package python-numpy 1:1.16.5-5 Deleting the python-numpy package and resuming the upgrade with apt --fix-broken install followed by apt full-upgrade allowed the upgrade to complete successfully. This was already metioned in a Debian bug report and would have been avoided if I had purged the locally obsolete packages after upgrading to Debian 11. On laptop and workstation, after the upgrade, for unclear reasons, the gnome3 user extensions were disabled. I reenabled the extensions manually with gsettings set org.gnome.shell disable-user-extensions false Finally podman, had a major upgrade from 3 to 4, and a backward-incompatible configuration change. If a custom configuration file was in place in /etc/containers/storage.conf to override the default storage options, you need now to add the following stanza [storage] runroot="/run/containers/storage" graphRoot="/var/lib/containers/storage" in that file. Otherwise you’ll get the error Failed to obtain podman configuration: runroot must be set when running any podman command. This was discussed upstream. Cloud server (VM) Everything worked flawlessly, nothing to report. Conclusion Again a great Debian release, very happy that I could update three systems with ten thousands of packages with so little fuss. For my small home server running RHEL 8 (with the no cost sub) I will do a reinstall on newer hardware. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67b23905ac459', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b23905ac4a6', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading... Related debianfloss'''
