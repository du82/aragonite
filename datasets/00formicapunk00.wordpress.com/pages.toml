full_description = "OpenShift vs. AWS product mapping On September 1, 2022September 1, 2022 By Manu If you know the Amazon Web Services portfolio, and you are interested in OpenShift or the OKD OpenShift community distribution, this is a table of corresponding technologies. OpenShift is Red Hat’s Kubernetes distribution: it is basically the upstream Kubernetes delivered with monitoring, logging, CI/CD, underlying OS, tested upgrade paths not found with a manual kubernetes.io kubeadm install. AWS OpenShift OpenShift upstream project Cloud Trail Kubernetes API Server audit log Kubernetes Cloud Watch OpenShift Monitoring Prometheus AWS Artifact Compliance Operator OpenSCAP AWS Trusted Advisor Insights AWS Marketplace OpenShift Operator Hub AWS Identity and Access Management (IAM) Red Hat SSO Keycloack AWS Elastisc Beanstalk OpenShift Source2Image (S2I) Source2Image (S2I) AWS S3 ODF Rados Gateway Rook RGW AWS Elastic Bloc Storage ODF Rados Block Device Rook RBD AWS Elastic File System ODF Ceph FS Rook CephFS Amazon Simple Notification Service OpenShift Streams for Apache Kafka Apache Kafka Amazon Guard Duty API Server audit log review, ACS Runtime detection Stackrox Amazon Inspector Quay.io container scanner, ACS Vulnerability Assessment Clair, Stackrox AWS Lambda Openshift Serverless* Knative AWS Key Management System could be done with Hashicorp Vault Vault AWS WAF NGINX Ingress Controller Operator with ModSecurity NGINX ModSecurity Amazon Elasticache Redis Enterprise Operator Redis, memcached as alternative AWS Relational Database Service Crunchy Data Operator PostgreSQL * OpenShift Serverless requires the application to be packaged as a container, something AWS Lamda does not require. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67b23ac181a3b', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b23ac181a78', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading... Related flossopenshift"
