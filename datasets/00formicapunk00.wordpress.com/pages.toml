title = "Moving blog from blogger.com to wordpress.com – formicapunk"
description = "I switched from blogger.com the Google Blog platform to the hosted wordpress.com of Automaticc, the Wordpress blog engine main authors. I thus gain: markdown formatting when writing blog entries, finally ! running on a opensource core, that I can move locally to my own server if I ever want to fiddle with MySQL and PHP.…"
full_description = "Moving blog from blogger.com to wordpress.com On August 29, 2022August 29, 2022 By Manu I switched from blogger.com the Google Blog platform to the hosted wordpress.com of Automaticc, the WordPress blog engine main authors. I thus gain: markdown formatting when writing blog entries, finally ! running on a opensource core, that I can move locally to my own server if I ever want to fiddle with MySQL and PHP. I lose: free CNAME redirect using my own domain name a bit of advertising-free space. The blog at wordpress.com has a prominent header indicating I am using the free plan, but I am OK so far with that. What stays the same: Blogger and WordPress.com offer both tag-based RSS feed exports, so I decided to keep for Debian Planet a feed containing only the posts related to free, libre and opensource software. I was not ready to make the jump to a self hosted static blog generator, as I still wanted to have the possibility to comment, without me having to host the comment subsystem. On the personal side, I also intend to pause twitter activity, as I notice current microblogging platforms tend to mostly contain flame wars, self promotion, or shared links I could find anyway with a good feed reader. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67b23abb38d7a', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b23abb38dab', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading... Related floss"
