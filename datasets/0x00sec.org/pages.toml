title = "How to easily deploy a TOR hidden service - Anonymity - 0x00sec - The Home of the Hacker"
description = "Hi fellas,  I found an interesting docker image on Docker Hub, dedicated to TOR hidden service deployement. The README is self explainatory and worth a try. 😉  https://hub.docker.com/r/goldy/tor-hidden-service/  Take your chance to create the new silk road 😛  Best,  Nitrax"
full_description = "How to easily deploy a TOR hidden service Anonymity torservice, websec Nitrax August 9, 2017, 11:54am 1 Hi fellas, I found an interesting docker image on Docker Hub, dedicated to TOR hidden service deployement. The README is self explainatory and worth a try. https://hub.docker.com/r/goldy/tor-hidden-service/ Take your chance to create the new silk road Best, Nitrax 10 Likes afiskon August 11, 2017, 3:14pm 2 Hm… frankly I’m not convinced that you need Docker to solve such a simple task. For instance, on Arch Linux it’s as simple as: Install nginx or any service you need to hide: sudo pacman -S nginx sudo systemctl enable nginx sudo systemctl start nginx Install tor: sudo pacman -S tor torsocks Modify /etc/tor/torrc: HiddenServiceDir /var/lib/tor/hidden_service/ HiddenServicePort 80 127.0.0.1:80 # optional: one more service HiddenServicePort 22 127.0.0.1:22 Start tor service automatically: sudo systemctl enable tor sudo systemctl start tor Don’t forget to backup /var/lib/tor/hidden_service/ 7 Likes IntenseFrank December 1, 2023, 10:44pm 3 Thank you for this. Good read 6601 (6601) December 19, 2023, 12:16pm 4 Why would you need Docker for Tor hidden service? I think it adds only complexity, rendering it more insecure, than it would be with a normal hidden service. ghostInc January 1, 2024, 2:18pm 5 Thanks for the writeup. For those that are in the know like this. Those that don’t ask why d8rh8r January 3, 2024, 1:16am 6 Yep…I’ll take that bullet… Hit me with the why. I can see how the convenience of spinning this up and destroying at will could be super handy but what am I missing that “those who know” know… ?"
