["https://0x00sec.org/t/do-duplicate-bug-bounty-reports-have-any-value/36099"]
title = "Do duplicate bug bounty reports have any value? - Bug Bounty - 0x00sec - The Home of the Hacker"
description = "Hey I got a quick newbie question for y’alls: I’ve recently taken up bug bounties (even for programmes or assets that are not eligible for payment) and found vulnerabilities in assets that have been previously discovered by other security engineers. Like for example, I found a reflective XSS vulnerability on one organisation’s website, and another critical bug for another organisation. But another researcher beat me to it 😢  Like the title of this thread suggests, do duplicate reports where ..."
full_description = "Do duplicate bug bounty reports have any value? Bug Bounty discussion LambdaCalculus (Aleksey) July 24, 2023, 3:06pm 1 Hey I got a quick newbie question for y’alls: I’ve recently taken up bug bounties (even for programmes or assets that are not eligible for payment) and found vulnerabilities in assets that have been previously discovered by other security engineers. Like for example, I found a reflective XSS vulnerability on one organisation’s website, and another critical bug for another organisation. But another researcher beat me to it Like the title of this thread suggests, do duplicate reports where I have discovered vulnerabilities on assets that have been previously discovered by others? Could this be valuable for personal growth, or for contributing to the community in making life harder for malicious hackers? Sorry if this is a silly question. I am a newbie and eager to hear your thoughts and opinions! BrBr.Prime (BrBr.Prime) July 24, 2023, 3:17pm 2 seems to me that if the report is truly a duplicate, then you’re on the right track… you have a legit submission, someone beat you to it. I guess the next question I’d ask… are they taking into account “how” you got to the answer. you might submit a method that is different than the original ticket. That does require them to review the ticket and your methods. 3 Likes LambdaCalculus (Aleksey) July 24, 2023, 3:21pm 3 seems to me that if the report is truly a duplicate, then you’re on the right track… you have a legit submission, someone beat you to it. yeah lol at least I’m not submitting low quality reports I do write proof-of-concepts in Python for demonstrating the existence of a bug (like, for example, using Python’s requests module to make HTTP requests with the payload in them & then inspecting the returned HTML for evidence of the payload). idk if other folk do that, from my experience reading disclosed reports, it’s not that common (but that’s just my casual experience ). vict0ni August 7, 2023, 7:38am 4 Dupes are definitely valuable, especially when you’re starting out. Except for the fact that it’s a validation that you’re on the right track, as @BrBr.Prime said, it’s also good to add to your portfolio. Regardless of the payout, you found a bug in a real-world system that affects real people! You can definitely do a writeup on these findings to show your growth and knowledge, As long as you don’t hunt for money exclusively, a bug is a bug 1 Like LambdaCalculus (Aleksey) July 19, 2024, 3:33pm 5 Yeah, thanks for the protips (and sorry that it took forever for me to reply :p). I haven’t logged in for a while cos irl stuff but I still want to contribute to this forum; 0x00sec has both a friendly community with high-quality content"
