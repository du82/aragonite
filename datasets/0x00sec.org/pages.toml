full_description = "Black hat hacking begineer to elite (complete guide) Questions Beginner Guides hacking asmodeus001 (asmodeus) June 11, 2024, 11:29am 1 Hello group of elite ,script and white black what ever you wanna say to yourself. I am a begineer to hacking and i am really curious about it . I want to learn from scratch and give me some great guide and your experiences which i must follow so I can become a elite hacker in upcoming 2-3 years. Give me your whole years of experiences , mistakes and whatever which is necessary for me or you didn’t follow at your beginning of hacking career. 2 Likes david_beckham (david beckham) July 25, 2024, 5:53pm 2 did you receive any help? let’s help each other. Saima_Khan (Saima Khan) July 26, 2024, 6:13am 3 Hi this is me i want to this black hat hat course hacking arador (arador) August 9, 2024, 4:51pm 4 I’d like to,where to text you? helptaker August 20, 2024, 10:12am 5 Do teach me as well, please! I wanna learn Black Hat hacking. I want to start by hacking a cartoon show (not to ruin it for others but because it has been done by others before and it must be easy). The show is called Miraculous Ladybug and ZAG/MiraculousCorp owns it. Dwarf Animation Studios animates it. I will NOT leak the show for others. It’s just because it is easy. Please teach me! Contact me at “calmeries” on discord! Sarah_Phillips (Strugglebread ) November 17, 2024, 7:02pm 6 I started learning how to hack in 2017, starting with coding in HTML. Now I’m a savvy and skilled script kiddie, if I’m going to be honest but I’m very much savvy and skilled in my craft. It’s a long journey to embark on with a lot of challenges along the way, but if you’re truly serious about hacking, you should have started on your own by now. Along the way will you find peers and if you’re lucky, a mentor to guide you along the way, making the process a bit easier since you will start having a strong bearing on your journey. It’s a very intriguing field and lots of fun especially if you know what you’re doing and follow the thread lines. Be it white, grey, red or black hat, you’re sure in for one heel of a ride filled with ups and downs. You can find me on discord @bigcat010. Only serious minded greenhorns will be nurtured. You will come to find out that in our field, no one is ready to waste valuable time and resources on unmotivated wannabes. Ciao 1 Like wizard December 9, 2024, 8:48am 7 I sincerely hope such low quality shitposts would get obliterated and shitposters irreversibly banned Sarah_Phillips (Strugglebread ) December 15, 2024, 7:43pm 8 I’m looking to build a team for CTF challenges and hopefully participate in online CTF contests starting next year. Hit me up on discord. My info is in my previous reply. I’m open to taking on noobs as well, just as long as you take it seriously and don’t play about my valuable time. 1 Like"
