title = "Are you really anonymous? - Anonymity - 0x00sec - The Home of the Hacker"
description = "Do you think that switching to your browser’s private browsing mode or incognito mode will make you anonymous? Then click:  https://www.nothingprivate.ml/  Don’t actually use your real name 🙂  A cool little proof of concept, awareness-raising project"
full_description = "jackspirou/clientjs Device information and digital fingerprinting written in pure JavaScript. - jackspirou/clientjs Are you really anonymous? Anonymity RYUZ4KI November 14, 2018, 11:38pm 1 Do you think that switching to your browser’s private browsing mode or incognito mode will make you anonymous? Then click: https://www.nothingprivate.ml/ Don’t actually use your real name A cool little proof of concept, awareness-raising project 5 Likes foxmulderx (Fox Mulder) November 15, 2018, 12:13am 2 Yep I am anoymous. 5 Likes Archangel9 (Archangel / R0gu3) November 15, 2018, 3:37am 3 @RYUZ4KI @foxmulderx Cool Project! Also in addition to whatever service/VPN you use to go anonymous, you can also use different search engines while inside private browsing (incognito) mode, for example: https://duckduckgo.com/ or any type of search engine that allows additional security measures to be taken (while staying anonymous and secure). -Archangel pry0cc (Leader & Offsec Engineer & Forum Daddy) November 15, 2018, 1:02pm 4 I just used a VPN + Changed my User agent and that was enough to fool it. 4 Likes Leeky November 15, 2018, 4:30pm 6 Interesting and cool project! Reminds me of https://amiunique.org/ but with actually showing the tracking in action. I would argue though that normally there isn’t any claim for Incognito mode to make you anonymous Where Chrome only says what it’s meant for on their help page “When you browse privately, other people who use the device won’t see your activity.” (https://support.google.com/chrome/answer/7440301) Firefox even declares that it’s not in the slightest meant for that “Important: Private Browsing doesn’t make you anonymous on the Internet. Your Internet service provider, employer, or the sites themselves can still track what pages you visit. Private Browsing also doesn’t protect you from keyloggers or spyware that may be installed on your computer.” (https://support.mozilla.org/en-US/kb/private-browsing-use-firefox-without-history) Although it would be interesting to test how Brave competes considering its ability for incognito/private mode to use tor. (https://brave.com/tor-tabs-beta) 1 Like Rain November 15, 2018, 5:39pm 7 Slightly off-topic, but isn’t anonymity less binary than it was in the past? Say, dependent on the resources of your attacker? I think past busts of hackers who did many things to be anonymous illustrate the ability of dedicated state-level actors. After learning about time-based attacks (identifying users based off of the times they access resources tied with their identity), I wondered if there is a way to achieve “true” anonymity, or even sufficient anonymity to dissuade attackers that fit an “average” threat model. It seems to me that as humans we cannot be so thorough as to never overlook a crucial factor. 1 Like anon1115000 November 15, 2018, 7:28pm 8 Well anonymity, as with many things in life, is a spectrum. Short of not having a birth cert and ever having held gainful employment, someone knows who you are and what you’re doing. I was reading a book a few weeks back about anonymity and a comparison was made that for the regular Joe Schmoe in the street, full state-level anonymity shouldn’t matter just add to the noise. However if you’re trying to evade Mossad, no level of browser extensions and browsing safety is gonna help. They gon’ gitcha,… and probably kill ya. I might do a post on threat models, shit fascinates me. 4 Likes Techno_Forg (Zain) November 15, 2018, 8:17pm 9 To answer the question in the title… no. XD 1 Like Rain November 16, 2018, 3:15pm 10 I’d like that. I was just speaking about how important it is to understand your threat model when securing a system (physical or digital). fxbg (sunjester) November 16, 2018, 7:54pm 11 I always thought that the incognito mode was just to keep your gf from seeing your porn history. 6 Likes Techno_Forg (Zain) November 17, 2018, 4:13pm 13 Or other questionable activities… and we all know what I mean… xD pry0cc (Leader & Offsec Engineer & Forum Daddy) November 19, 2018, 8:29am 14 Watching Doja cat on YouTube? @REal0day ScripsterOx December 3, 2018, 1:46am 15 Huh, I thought DuckDuckGo running through Firefox would be safe, suppose I will have to start running a VPN on my browser. ScripsterOx December 3, 2018, 1:50am 16 Uses this Javascript tool to obtain your browsers finger print GitHub jackspirou/clientjs Device information and digital fingerprinting written in pure JavaScript. - jackspirou/clientjs 2 Likes Techno_Forg (Zain) December 4, 2018, 12:51pm 18 Interesting share. I looked at it briefly and it looks well done. Thank you for sharing! ~Cheers! –Techno Forg– Pylot (Pylot) December 6, 2018, 8:24pm 19 I have addons that ban tracking, im safe! 1 Like binshift2 (bin shift) December 6, 2018, 8:51pm 20 I know you are being funny. Check out https://panopticlick.eff.org/ I have most of EFF tools installed. I even tried noscript, but that kills everything, even JS in 0x00Sec site. But nice test. This tests for tracking, and fingerprinting, pretty nice results 1 Like Rain December 7, 2018, 4:42pm 21 What a well-named service! I approve. 3 Likes system (system) Closed December 14, 2018, 11:38pm 22 This topic was automatically closed after 30 days. New replies are no longer allowed."
