full_description = "Malware development from beginer to expert Malware tutorial, python, networking, programming, hacking blc_chef (Abram_ITsupport) January 1, 2024, 9:28am 1 Accompanying video on YouTube for this below lecture. check now and please subscribe and like the video NOTE: hey friends last year i quit my job, now am a full time freelancer and IT security teacher This my take on malware development were we are going to develop from a prototype already out there to a something much more powerful If you a cybersecurity professional, a pen tester, red teamer,having the skills to write undetectable malware is great and very rewarding. Pros tend to use tools like metasploit, LordPE, shelter, veil, amitarge and others to accomplish given tasks but their is always a high possibility of getting caught by SOC team av solutions and that is not good. Another reason to write your FUD malware from scratch is to eliminate the need for Metasploit, since it can handle only one connection at a time. Whereas, during red teaming we always needed a CnC Server solution that can handle and control all the target machines together just like a botnet. So in these series were are going to begin our journey of learning malware development at the same time applying software engineering principles, cryptography, forensics, networking and obfuscation from the basic principles to the most in the wild. OUR ROAD MAP OUT OF ORDER Simple malware (prototype) Basics of software engineering Choosing a software methodology to follow Rewriting our malware from scratch digital forensics basics Basics of penetration testing Basics of red teaming Basics of cryptography window system programming Networking programming Driver and kernel programming Adding rootkit features to our product Shall add others to the mix as needed Prerequisites Python programming skills (soon videos will be available) C/C++ programming skills FUNCTIONALITY OF OUR PROTOTYPE whoami function pwd function ls function move/ copy function delete file function download file function upload file function one thing to avoid is executing most of the commands via command shell Win API, reason being that it becomes easier for endpoint monitoring tools to detect anomalies and find out that it’s a suspicious binary even though we can evade anti-virus software easily. But still we should write this code, because you never know when you might need to execute shell commands or execute powershell/vbs/batch scripts remotely, and secondly, it is the easiest to start with as a beginner when learning malware development. 10 Likes c0z (Impetus Omnia Omnem Impetum) January 7, 2024, 5:23am 2 There’s the sak1to-shell that has the very basics for C2 communication via the C programming language that you can use as a base during your video series. blc_chef (Abram_ITsupport) January 7, 2024, 8:58pm 3 Thanks bro am glad let me checkout 1 Like d8rh8r January 12, 2024, 1:22pm 4 When does the next vid drop my friend? 1 Like blc_chef (Abram_ITsupport) January 16, 2024, 8:48pm 5 today am dropping the next five videos my friend 1 Like Heisenbug (Heisenbug) March 22, 2024, 8:51am 7 thanks for the video bro cipherpodliq (Cipher Podliq) March 25, 2024, 12:20pm 8 amazing , please stick to the series and make them unique and practical as possible :DDDD Kaiju (chan) March 26, 2024, 4:44pm 9 Can you please share more delivery methods? looks like is very hard this days system (system) Closed May 2, 2024, 1:28am 10 This topic was automatically closed after 121 days. New replies are no longer allowed."
