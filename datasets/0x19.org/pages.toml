title = "Home"
full_description = '''The gist: I am a hobbyist sysadmin, aspiring systems programmer, free software advocate, improving (arguable) technical writer, and a generally private person who actively participates in cycling, calisthenics, and cooking. {Latent,Expired,Revived} interests include permaculture, music production, podcasting, brewing (coffee and beer alike), lockpicking, bushcraft, speedcubing, and so on and so forth. Computing History My first experience with a computer was when I was very young. My mother purchased a (probably overpriced) windows machine. It was a Dell Dimension. This computer is still in my possession despite it's non-functionality caused by decades of storage in buildings lacking any form of climate control. This machine was not and is not influential or integral in any way. Many blurred years later were the obligatory Mircosoft sponsored classes at school. In these classes American youth are brainwashed into learning exclusively how to click the buttons on the screen in such a way to become an award winning office drone. Almost of all the compulsory content from these classes has left my mind. At some point, the school offered an HTML course and the students who hadn't yet selected an elective (me) were automatically placed into this class. Nothing of value was gained save for the concept of hexadecimal numbers and numbers with a base other than 10. At some point, my mother gave me a cheap, underpowered netbook as my first "personal PC". This netbook came preinstalled windows and a whopping 32 gigabytes of disk space. Anyone who has attempted to use windows on limited hardware will know the suffering; when the first update is forced upon the user, the computer is rendered entirely unusable. After research and deliberation, Linux was the clear solution. I chose Mint because it was advertised as "baby's first distro" and "familiar to windows refugees". All of these points remain agreeable even after the unresolvable apt induced dependency hell the poor Mint installation was damned to. After looking around at some neofetch logos on various forums, Fedora was my next choice. Someone told me it was like RHEL so the choice was further solidified. Studying Fedora and RHEL was the catalyst to computer competence. Systemd, Firewalld, Apache, manual package management, desktop ricing, "command line only" challenges, vim, LaTeX, pandoc, failing horribly at C++, building web servers, and web dev practice were all common themes. Fedora turned me into a real sysadmin. As with most Linux fans, curiosity takes over. Every distro is an opportunity for learning but distros aren't all there is. The Linux distro that truly refined my skillset was Gentoo. The operating system that solidified my confidence was FreeBSD. They say that Linux was created by PC users trying to use UNIX and that BSD was created by UNIX users trying to use a PC. I don't think I was ever really a PC user. Categorizing myself is difficult. To say that mainframe UNIX was my first real computing environment might be closer to the truth. Sysadmin Skills Operating Systems (most to least skilled): RHEL/Fedora FreeBSD OpenBSD Server Software (no particular order): pf firewalld Apache OpenBSD HTTPD SSH Mariadb And all else that is implied by the above. Web Dev Langs (most to least skilled): HTML/CSS (yes, I know it's markup) PHP JavaScript SQL Proof of work: A thousand aborted projects And the webshit sprinkled throughout here Systems and Related Programming Langs (most to least skilled): POSIX shell (this is called "bash" for the hylics among us) POSIX C R TeX Common Lisp Proof of work: A thousand more abandoned projects And the non-webshit sprinkled throughout here'''
