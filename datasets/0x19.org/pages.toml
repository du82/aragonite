title = "Picoblog"
full_description = '''Read via the RSS feedRead Online: browse tagsThe name 'picoblog' is a parody of the concept of microblogging. See The post about picoblog for more information about picoblogging. Source code here Indefinite Hiatus[permalink][rss]I am (and have been) taking a break from computers in general over the last few months. I am alive and well, dear friends. The bulk of the "irl bullshit" has passed. Over the last few months, I have been practicing shooting, lifting, and focusing on optimizing my sleep. I have also been fixing more cars and diesel engines lately which, as of late, has been more rewarding than computers. I am still running 100% open source software despite the dissatisfaction I experience while being at computers. 0x19 will likely remain partially abandoned until I find inspiration again. I feel like I have done everything that is possible already and computers have stopped bringing me any joy. The only remotely computer related project I am interested in is figuring out how to create a text based (or vn) game using my {vivid,haunting,dread inducing,bizarre,immersive} dreams (that I am still too lazy to record) as an inspiration for the story. This, however, is largely a pipe dream. I am neither creative nor artistic which adequately explains the dream scrying in an attempt to levy the ineffable. My philosophy as of late is simple: "do better every day", "let people fail", "it's not your job to fix the world, it's your job to defend yourself", "maintain your paradigm", "maintain your morals", "don't get stuck", "don't be a crab in a bucket", and "just because you feel constant lethargy, malaise, and anhedonia doesn't mean that you can submit to letting yourself rot." We are so fucking back, it's not even funny. 2025-02-15 04:12:54 #0x19 Gun as the ceremonial Sword[permalink][rss]I have vague memories of reading about how the sword must actually be a bladed implement because the various spirits of the earth and demons will be unresponsive to a pistol. The purpose of the sword is to cut and to criticize. So long as the magical weapon is not a shotgun, gun seems viable. If lead is the issue, real silver bullets do exist. Copper bullets also do exist. Depleted uranium rounds are federally illegal but they would also qualify as "a pure metal that is a higher tier than lead and thus not influenced by the spirits" in this context. 2024-11-30 05:07:23 #magic Coming Down[permalink][rss]Lost Dog Street Band, "Coming Down," featuring Thirteen Strings and a Two Dollar Bill // Take Away - Youtube link to a live recording (because I require that SOVL) The same song on bandcamp, for purchase At first, I didn't think this was a very good song. Upon listening more closely, it was incredibly moving. This version has an evolving chorus which was incredibly compelling to me. The change of a single word entirely drives the decline from dopesick and desperate to delirious and withdrawing. Upon the first iteration of the chorus: And in my dreams, there's a needle and spoon, And there's a pair of dice, a loaded gun, maybe me and you And you're sawing on a fiddle and I'm wondering which to choose Everything's so complicated now I am coming down Upon further iterations: And in my dreams, there's a needle and spoon, And there's a pair of dice, a loaded gun, maybe me and you And you're sawing on a fiddle and I'm wondering which to shoot Everything's so complicated now I am coming down 2024-11-21 02:36:52 #music Heart Attack Gun[permalink][rss]The CIA's Scariest Weapon - a link to a youtube video about the CIA heart attack gun Where do I buy one? /s stay strapped, boys 2024-11-18 03:34:59 #cia Misanthropy[permalink][rss]My misanthropy levels have reached an all time high. Do right by others. Speak only the truth. Hold onto your paradigm and do not allow others to lead you into delusion. Be charitable when possible. Strive towards self sufficiency. Do all of these things and you still get screwed over. I am not mad. I am not feeling vindictive. We are living in a low trust world with high trust morality. I am increasingly weary of moochers, freeloaders, and manipulators. They always seem to go ballistic as soon as you stop catering to their every whinging whim. 2024-11-17 17:39:59 #furak 0x19 "Musical year-in-review"[permalink][rss]I am wanting to write a post about the music albums I listened to this year. There aren't many (6) so I don't think it will be worth the effort of re-listening in order to write a competent review. The last 3 years have been filled with silence and the occasional podcast to stimulate my brain. I try to listen to whole albums. Listen 1 is new information, listen 2 is a deeper listening, listen 3 is for enjoyment, and on listen 4+ the track skipping begins. When I find myself skipping tracks I stop listening to the album because there is no new information to be gleaned. At listen 5+ the music becomes annoying and, frustratingly, loathsome. The ability to listen to music constantly no matter the context is an entirely foreign concept. I do not understand how others accomplish this feat while maintaining sanity. For me, it's silence. 2024-11-07 12:14:19 #music Wireless keyboard[permalink][rss]Added a usbc -> usba adapter and a wireless USB keyboard to the android based shitposting stack. > More peripherals! Then I will be happy! Really, I find myself spending more time AFK and touch screen keyboards are too inaccurate and slow to reliably record ideas with a half life of 5 seconds. 2024-11-03 17:51:31 #hardware DIY nutritional slop[permalink][rss]I remember when soylent launched. Although it is posible to power a human using exclusively industrial chemicals, the state of California will never be happy about it. DIY nutrient slop also exists. Many recipes exist and can be found at www.completefoods.co I am currently thinking about the possibility of a potato based diet supplemented with vitamin tablets, minerals, and amino acids. 2024-11-03 14:41:27 #food Pigeons Have magnets in their brains[permalink][rss]Pigeons have magnets in their brains I only have worms in mine 2024-11-03 02:32:19 #systemshock Protonmail + Proton bridge + Mutt[permalink][rss]I don't think I ever actually wrote something about this. I need to write a post about this. The only reason I didn't is because I didn't want to mess with the Linuxulator on FreeBSD and, later, because I didn't want to attempt to build Proton bridge from source. On linux, it seems to work file. I might try to build it again on {free,open}bsd to try to remember what the issue was. 2024-10-31 02:04:44 #mail Unused ports[permalink][rss]Here are a list of ports <1024 that are not associated with any service: 8 10 12 14 16 24 26 30 32 34 35 36 40 59 60 72 75 100 114 116 120 121 122 124 125 127 128 130 131 132 133 134 136 140 141 142 144 145 146 147 148 149 150 154 155 157 159 160 166 167 168 171 172 173 174 175 176 181 182 183 184 185 186 187 188 189 190 192 193 195 196 197 198 200 203 205 207 208 211 212 214 215 216 217 219 221 222 223 224 242 243 244 245 246 247 248 256 257 258 260 261 263 265 266 267 268 269 270 271 272 273 274 275 276 277 278 279 281 282 283 284 285 286 287 288 289 290 291 292 293 294 295 296 297 298 299 301 302 303 304 305 306 307 309 310 313 314 315 316 317 321 322 324 325 326 327 328 329 330 331 332 333 334 335 336 337 338 339 340 341 342 343 344 345 346 347 348 349 352 353 354 355 357 358 359 360 361 362 363 364 365 367 368 373 374 375 377 378 379 380 381 382 385 386 390 391 392 393 394 395 396 397 398 400 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 419 420 421 422 423 424 425 426 428 429 430 431 432 435 436 437 438 439 440 441 442 446 447 448 449 450 451 452 453 454 455 456 457 458 459 460 461 462 463 466 467 469 470 471 472 473 474 492 493 494 495 496 498 499 501 503 505 506 507 508 509 511 516 519 522 523 527 528 529 534 535 536 537 538 539 541 549 551 552 553 555 557 558 559 562 565 566 567 568 569 570 571 572 573 574 575 576 577 578 579 580 581 582 583 584 586 588 589 590 592 594 595 596 597 598 599 600 602 603 605 606 607 608 609 610 611 612 613 614 615 616 617 618 619 620 621 622 624 626 627 628 629 630 632 633 634 637 638 640 642 644 645 649 650 652 656 658 659 661 662 663 664 665 667 668 669 670 671 672 673 675 676 677 678 679 680 681 682 683 685 686 687 689 692 693 696 697 699 703 704 707 708 709 710 713 714 715 716 717 718 719 720 721 722 723 724 725 726 727 728 729 730 731 732 733 734 735 736 737 738 739 740 741 742 743 744 745 746 747 748 755 756 757 758 759 761 762 763 764 765 766 767 768 769 770 771 772 773 774 775 776 777 778 779 780 781 784 785 786 787 788 789 790 791 792 793 794 795 796 797 798 799 801 803 804 805 806 807 809 810 811 812 813 814 815 816 817 818 819 820 821 822 823 824 825 826 827 828 834 835 836 837 838 839 840 841 842 844 845 846 849 850 851 852 854 855 856 857 858 859 863 864 865 866 867 868 869 870 871 872 874 875 876 877 878 879 880 881 882 883 884 885 886 887 889 890 891 892 893 894 895 896 899 900 901 904 905 906 907 908 909 910 911 912 913 914 915 916 917 918 919 920 921 922 923 924 925 926 927 928 929 930 931 932 933 934 935 936 937 938 939 940 941 942 943 944 945 946 947 948 949 950 951 952 954 955 956 957 958 959 960 961 962 963 964 965 966 967 968 969 970 971 972 973 974 975 976 977 978 979 980 982 983 984 985 986 996 997 998 999 1000 1001 1002 1003 1004 1005 1006 1007 1008 1009 1021 1022 1023 1023 1024 1080 1109 1194 Methodology: 1. get a list of ports from /etc/services 2. get a list of ports from https://en.wikipedia.org/wiki/List_of_TCP_and_UDP_port_numbers 3. use seq to make a list of numbers from 0 to 1024 4. $ cat seq-nums services wiki | sort -n | uniq -u 2024-10-30 02:18:15 #ports Thinking about starting a new webring - "The infrastructure webring"[permalink][rss]Rubber duck debugging except the duck is vim. A title change might be in order. Possibly "'Roll-Your-Own' Webring". Possible requirements: - real hardware or vps, rented or owned - proof of domain ownership (a bs dns record would work) - proof you have root on the server (I can't figure this one out) - 1 year of site activity (so you are already invested) - tell the OS and why you chose it - describe the server stack and why you chose it - include any additional daemons running on the system Considering: - badges (for lack of a better term) - for founders (this will be contested) - for each daemon you are running beyond httpd (ie gopher, tor, i2pd, email, xmpp, etc) - for custom code (ie "Custom SSG" or "Custom server side scripts") - for custom daemons you wrote yourself (ie custom finger, gopher, httpd, etc) - git managed - can't^won't self host git because a git forge is useless without other users - probably gitlab - no actual server code included in the repo, only member site data (debatable) If not badges, at least create a data field specifically for various services. Badges would create an arbitrary sense of accomplishment and encourage users to host more things in the hopes that their websites do not end up in the equivalent of neocities graveyard. 2024-10-29 15:47:14 #webring .sql vs .sqlite3[permalink][rss]I am now storing a .sql file instead of the actual sqlite3 database. Makefile rules to dump/resilver the database have been added. This should be nicer to git. 2024-10-29 15:36:14 #picoblog #sql #git Re: corded conversion [permalink][rss] V: 18 AH: 5 Wh: 90 A: ??? The problem: figure out maximum discharge amps. Potential solutions include: splice in a multimeter, run the drill until the battery dies and do math. My initial solution was to take apart the battery pack to see if the cells indicate anything. They were all soldered together inside of an internal plastic housing. I did not want to destroy this battery because it is still functional. "What's Inside Tool Batteries? Milwaukee FLEX DeWalt Makita Snap-On [18650 21700 ??]" - youtube channel that did exactly what I just tried to do spreadsheet with many battery specs included (change /pub to pub?output=ods to download it) The power supply should provide: V: 18 A: 20 W: 360 It would be wise to have the option to slowly titrate up the amperage to avoid an electrical fire. I'm sure I'm not the first person to do this.2024-10-27 23:28:18 #tools #electrical #tools #electrical Battery powered tools[permalink][rss]Certain cordless power tools do not have an official option to replace the battery with a cable. The ability to do this effectively turns the tool into a corded tool. I might look into building custom power supplies for said tools. This could probably be accomplished with commodity hardware and a couple of cheap, sacrificial Chinese bootleg batteries. An inline circuit breaker would be extremely useful to prevent repeated trips to the breaker box. No other useful features immediately come to mind. 2024-10-27 18:23:02 #tools #electrical #tools #electrical Tags Page[permalink][rss]I forgot to link to the tagmap page. I might change the font scaling to be 100+(percent of tags that are this tag)%. 2024-10-26 12:20:18 #picoblog #picoblog I'm Thinking[permalink][rss]MIKU MIKU OOO EEE OOO 2024-10-26 12:03:45 #shitpost #miku #shitpost #miku Driving[permalink][rss]Behold, the solution to the American public transportation issue: Hi-Rail vehicles. Hydraulic rams, steering lockout, and some system to do data transfer between the ECU to automatically set a speed entirely solves my disdain for and disillusionment in relation to driving without forcing me into a crowded box with the dredges of American society. A more optimal solution would be passenger trains with a ticket cost at ~$0.15/mile (comparable to gasoline prices in an efficient car) so that overcrowding does not occur. At these prices, only the most sleep deprived would actually consider it. This will never happen. I will continue to pray for the pipe dream of Hi-Rail automated highways. 2024-10-24 12:35:13 #transportation #train #car #transportation #train #car My book will be titled[permalink][rss]"Multiphasic sleep cycles and lucid dream states: a stimulant induced approach" 2024-10-23 13:10:35 #sleep #dreams #shitpost #sleep #dreams #shitpost Use Case?[permalink][rss]Not everything must have a use case. We are allowed to have fun things. 2024-10-20 23:11:50 #bassi #picoblog #bassi #picoblog Makefile duct tape[permalink][rss]Using a makefile to write new posts. I'm almost surprised my checks to kill the script if the SAPI != "cli" even works with this many layers of scripts calling scripts calling scripts. Makefile: new: php -r 'include "sqlite.php"; new_post();' 2024-10-20 21:34:03 #picoblog #makefile #php #picoblog #makefile #php Switched from csv to sqlite[permalink][rss]I wanted to keep it as simple as possible bit I realized I only had two choices: write clean code that does not scale or buckle and use a real database. Descent. Delusion even. I am not having fun with PDO.2024-10-15 02:39:00 #picoblog #picoblog Asset test[permalink][rss]Currently, I am typing the entire html that will'''
