title = "Exploit Mitigation Techniques - Part 2 -  Stack Canaries"
description = """
Preface

Hey there! After quite some time the second part will be finally published :) !
Sorry for the delay, real life can be overwhelming..

Last time I have introduced this series by covering Data Execution Prevention (DEP). Today we're dealing with the next big technique. As the title already suggests it"""
full_description = '''Exploitation Exploit Mitigation Techniques - Part 2 - Stack Canaries Published 4 May 2020 18 min read By 0x434b PrefaceHey there! After quite some time the second part will be finally published :) !Sorry for the delay, real life can be overwhelming..Last time I have introduced this series by covering Data Execution Prevention (DEP). Today we're dealing with the next big technique. As the title already suggests it will be about stack canaries. The format will be similar to last time.First we will dealing with a basic introduction to the approach, directly followed by a basic exploitation part.REMARK: The following is the result of a self study and might contain faulty information. If you find any let me know. Thanks!RequirementsSome spare minutesA basic understanding of what causes memory corruptionsThe will to ask or look up unknown terms yourselfSome ASM/C knowledgeBasic format string bugsHow linking processes/libraries works (GOT)Stack Canaries / Stack Cookies (SC)Basic DesignTo prevent corrupted buffers during program runtime another technique besides data execution prevention called stack canaries was proposed and finally implemented as a counter measure against the emerging threat of buffer corruption exploits. It was adapted early! Patching a single buffer vulnerability in an application is harmless, but even within one program the causes of a simple patched buffer size might cause harm to other areas. On top of that the amount of programs running with legacy code and system rights over their needs is considerable large. Overall this patch driven nature of software development in combination with the usage of type unsafe languages like C/C++ makes such buffer problems still reappear too frequently. Instead of trying to fix the problem at source level, which patching tries to, canaries try to fix the problem at hand: the stack structure.The basic methodology is to place a filler word, the canary, between local variables or buffer contents in general and the return address. This is done for every* (*if the right compiler flag is chosen) function called, not just once for some oblivious main function. So an overwriting of multiple canary values is often required during an exploit. A basic scheme is shown below: Process Address Process Address Space Space +---------------------+ +---------------------+ | | | | 0xFFFF | Top of stack | 0xFFFF | Top of stack | + | | + | | | +---------------------+ | +---------------------+ | | malicious code <-----+ | | malicious code | | +---------------------+ | | +---------------------+ | | | | | | | | | | | | | | | | | | | | | | +---------------------| | | +---------------------| | | return address | | | | return address | | +---------------------+ | | +---------------------| stack | | saved EBP +-----+ stack | | saved EBP | growth | +---------------------+ growth | +---------------------+ | | local variables | | | stack canary | | +---------------------+ | +---------------------+ | | | | | local variables | | | buffer | | +---------------------+ | | | | | | | | | | | buffer | | +---------------------+ | | | | | | | | | | | | | +---------------------+ | | | | | | v | | v | | 0x0000 | | 0x0000 | | +---------------------+ +---------------------+ Note: This is only a basic overview. detailed low-level views can slightly differ Remark: Retake on base pointers in case you forgot!The canary can consist of different metrics. Random or terminator values are the commonly used ones in the end. When reaching (close to) a return instruction during code execution the integrity of the canary is checked first to evaluate if it was changed. If no alteration is found, execution resumes normally. If a tampered with canary value is detected program execution is terminated immediately, since it indicates a malicious intent. A user controlled input is often the cause for this :P . The most simple case for this scenario is a basic stack smashing attack, where the amount of bytes written to a buffer exceeds the buffer size. Pairing that with a system call that does not do any bounds checking results in overwriting the canary value.The first implementation of stack canaries on Linux based systems appeared in 1997 with the publication of StackGuard, which came as a set of patches for the GNU Compiler Collection (GCC).Terminator CanariesLet's just take this sample code snipped for clarification:int main(int argv, char **argc) { int var1; char buf[80]; int var2; strcpy(buf,argc[1]); print(buf); exit(0); } As the name terminator suggests once it is reached during an attempted overwrite it should stop the overwriting. An example value for this is 0x000aff0d.The 0x00 will stop strcpy() and we won’t be able to alter the return address.If gets() were used instead of strcpy() to read into a buffer, we would be able to write 0x00, but 0x0a would stop it. That is how these terminator values work on a basic level.In general we can say that a terminator canary contains NULL(0x00), CR (0x0d), LF (0x0a) and EOF (0xff). Such a combination of these four 2-byte characters should terminate most string operations, rendering the overflow attempt harmless.Random CanariesRandom canaries on the other hand do not try to stop string operations.They want to make it exceedingly difficult for attackers to find the right value so a process is terminated once tampering is detected.The random value is taken from /dev/urandom if available, and created by hashing the time of day if /dev/urandom is not supported.This randomness is sufficient to prevent most prediction attempts.Closer look at canary implementationsLet's take a quick peek at the current canary implementation of the most recent glibc 2.26 libc-start.c: /* Set up the stack checker's canary. */ uintptr_t stack_chk_guard = _dl_setup_stack_chk_guard (_dl_random); [...] __stack_chk_guard = stack_chk_guard; The _dl_setup_stack_chk_guard function is looking like this:static inline uintptr_t __attribute__ ((always_inline)) _dl_setup_stack_chk_guard (void *dl_random) { union { uintptr_t num; unsigned char bytes[sizeof (uintptr_t)]; } ret = { 0 }; # __stack_chk_guard becomes a terminator canary if (dl_random == NULL) { ret.bytes[sizeof (ret) - 1] = 255; ret.bytes[sizeof (ret) - 2] = '\n'; } # __stack_chk_guard will be a random canary else { memcpy (ret.bytes, dl_random, sizeof (ret)); #if BYTE_ORDER == LITTLE_ENDIAN ret.num &= ~(uintptr_t) 0xff; #elif BYTE_ORDER == BIG_ENDIAN ret.num &= ~((uintptr_t) 0xff << (8 * (sizeof (ret) - 1))); #else # error "BYTE_ORDER unknown" #endif } return ret.num; } What's interesting here is that we can see the basic design choices mentioned earlier!_dl_setup_stack_chk_guard() allows to create all the canary types.If dl_random is null, __stack_chk_guard will be a terminator canary, otherwise random canary.LimitationsThis technique is exposed to several weaknesses.One is namely static canary values that are easily found out using brute force or by simply repeatedly guessing... Using random or terminator values instead migrated this flaw early on. This hardens the security implications, but an adversary may still circumvent this technique. When finding a way to extract the canary value from the memory space of an application during runtime it is possible to bypass canary protected applications. Alternatively if a terminator canary like 0x000aff0d is used we cannot write past it with common string operations, but it is possible to write to memory up until to the canary. This effectively allows to gain full control of the frame pointer. If this is possible, as well as having the possibility to write to a memory region like the stack or heap, we can bend the frame pointer to point to terminator_canary+shellcode_address in memory. This allows us to return to injected shell code.Another bypass is possible through a technique called structured exception handler exploitation (SEH exploit). It makes use of the fact that stack canaries modify function pro- and epilogue for canary verification purposes. If a buffer on stack or heap is overwritten during runtime, and the fault is noticed before the execution of the copy/write function returns, an exception is raised. The exception is passed to a local exception handler that again passes it to the correct system specific exception handler to handle the fault. Changing said exception handler to point to user controlled input like shell code makes it return to that. This bypasses any canary check and execution of any provided malicious input is accomplished.Note: Structured exception handlers are Windows specific!Note2: These limitations do not represent all possibilities for how to bypass canaries!PoC 1 - GOT overwrite to bypass canaries# ASLR is still disabled for now: echo 0 | sudo tee /proc/sys/kernel/randomize_va_spaceThe vulnerable programLet's consider this small program:#include <stdlib.h> #include <unistd.h> #include <stdio.h> #include <string.h> int target; void vuln() { char buffer[512]; fgets(buffer, sizeof(buffer), stdin); printf(buffer); printf("Welcome 0x00sec to Stack Canaries\n"); strdup(buffer); return 0; } int main(int argc, char **argv) { vuln(); } For our PoC we don't need much, hence the program is quite small. All it does is it takes some input via fgets() and prints it with printf(). For some dubious reason strdup() is present here too ;)Note: The strdup(s) function returns a pointer to a new string which is a duplicate of the string s. Let's compile it with gcc -fno-pie -fstack-protector-all -m32 -o vuln vuln.c and check if I didn't lie about the enabled exploit mitigations:gef➤ checksec [+] checksec for '/0x00sec/Canary/binary/vuln' Canary : Yes → value: 0xd41a2e00 NX : Yes PIE : No Fortify : No RelRO : Partial gef➤ Data execution prevention (NX) as well as canaries are fully enabled. For the sake of usability gef and other gdb enhancements can already display the current canary value. Alternatively if stack canaries are present we always have the __stack_chk_fail symbol, which we can search for:$ readelf -s ./vuln | grep __stack_chk_fail 5: 00000000 0 FUNC GLOBAL DEFAULT UND __stack_chk_fail@GLIBC_2.4 (3) 58: 00000000 0 FUNC GLOBAL DEFAULT UND __stack_chk_fail@@GLIBC_2 Brief look at the disassemblygef➤ disassemble main Dump of assembler code for function main: 0x080485ef <+0>: lea ecx,[esp+0x4] 0x080485f3 <+4>: and esp,0xfffffff0 0x080485f6 <+7>: push DWORD PTR [ecx-0x4] 0x080485f9 <+10>: push ebp 0x080485fa <+11>: mov ebp,esp 0x080485fc <+13>: push ecx 0x080485fd <+14>: sub esp,0x24 0x08048600 <+17>: mov eax,ecx 0x08048602 <+19>: mov edx,DWORD PTR [eax] 0x08048604 <+21>: mov DWORD PTR [ebp-0x1c],edx 0x08048607 <+24>: mov eax,DWORD PTR [eax+0x4] 0x0804860a <+27>: mov DWORD PTR [ebp-0x20],eax 0x0804860d <+30>: mov eax,gs:0x14 ; canary right here 0x08048613 <+36>: mov DWORD PTR [ebp-0xc],eax 0x08048616 <+39>: xor eax,eax ; at this point we can inspect the canary in gdb as well 0x08048618 <+41>: call 0x8048576 <vuln> ; vuln() function call 0x0804861d <+46>: mov eax,0x0 0x08048622 <+51>: mov ecx,DWORD PTR [ebp-0xc] 0x08048625 <+54>: xor ecx,DWORD PTR gs:0x14 ; canary check routine is started 0x0804862c <+61>: je 0x8048633 <main+68> 0x0804862e <+63>: call 0x8048410 <__stack_chk_fail@plt> ; canary fault handler if check fails 0x08048633 <+68>: add esp,0x24 0x08048636 <+71>: pop ecx 0x08048637 <+72>: pop ebp 0x08048638 <+73>: lea esp,[ecx-0x4] 0x0804863b <+76>: ret End of assembler dump. gef➤ disassemble vuln Dump of assembler code for function vuln: 0x08048576 <+0>: push ebp 0x08048577 <+1>: mov ebp,esp 0x08048579 <+3>: sub esp,0x218 0x0804857f <+9>: mov eax,gs:0x14 ; canary right here 0x08048585 <+15>: mov DWORD PTR [ebp-0xc],eax 0x08048588 <+18>: xor eax,eax 0x0804858a <+20>: mov eax,ds:0x804a040 0x0804858f <+25>: sub esp,0x4 0x08048592 <+28>: push eax 0x08048593 <+29>: push 0x200 0x08048598 <+34>: lea eax,[ebp-0x20c] 0x0804859e <+40>: push eax 0x0804859f <+41>: call 0x8048400 <fgets@plt> ; fgets routine to fetch user input 0x080485a4 <+46>: add esp,0x10 0x080485a7 <+49>: sub esp,0xc 0x080485aa <+52>: lea eax,[ebp-0x20c] 0x080485b0 <+58>: push eax ; user input is pushed as argument for printf 0x080485b1 <+59>: call 0x80483d0 <printf@plt> ; printf routine call 0x080485b6 <+64>: add esp,0x10 0x080485b9 <+67>: sub esp,0xc 0x080485bc <+70>: push 0x80486e4 ; string is pushed as argument for puts 0x080485c1 <+75>: call 0x8048420 <puts@plt> ; puts routine call 0x080485c6 <+80>: add esp,0x10 0x080485c9 <+83>: sub esp,0xc 0x080485cc <+86>: lea eax,[ebp-0x20c] 0x080485d2 <+92>: push eax ; buffer contents pushed as argument to strdup 0x080485d3 <+93>: call 0x80483f0 <strdup@plt> ; strdup routine call 0x080485d8 <+98>: add esp,0x10 0x080485db <+101>: nop 0x080485dc <+102>: mov eax,DWORD PTR [ebp-0xc] 0x080485df <+105>: xor eax,DWORD PTR gs:0x14 ; canary check routine is started 0x080485e6 <+112>: je 0x80485ed <vuln+119> 0x080485e8 <+114>: call 0x8048410 <__stack_chk_fail@plt> ; canary fault handler if check fails 0x080485ed <+119>: leave 0x080485ee <+120>: ret End of assembler dump. gef➤ So nothing out of the ordinary so far. I did not strip the binary and everything we would expect is at the correct place. Additionally, the canary initialization and checks are nicely observable! Furthermore, it is shown that the canary check is done in every called function, not just in the main() function of the program.Recap Format String attacksThe following exploit makes use of a format string bug. Hence I will quickly recap the basics here. Mostly used in conjunction with printf(). If we have control over what printf() is gonna print, let's say the contents of a user controlled buf[64] then we can use the following format parameters as input to manipulate the output!Parameters* Meaning Passed as -------------------------------------------------------------------------- %d decimal (int) value %u unsigned decimal (unsigned int) value %x hexadecimal (unsigned int) value %s string ((const) (unsigned) char*) reference %n number of bytes written so far, (*int) reference *Note: Only most relevant format paramters displayed If we pass n %08x. to printf() it instructs the function to retrieve n parameters from the stack and display them as 8-digit padded hexadecimal numbers. This can be used to view memory at any location if done right, or even write a wanted amount of bytes (with %n) to a certain address in memory!If you feel you need to brush up on it by a lot take a look at this format string write-up from picoCTF.Canary bypassWe will take a closer look at overwriting the Global Offset Table (GOT)!This is possible because we don't have a fully enabled RelRO:Partial RELRO:the ELF sections are reordered so that the ELF internal data sections (.got, .dtors, etc.) precede the program's data sections (.data and .bss)non-PLT GOT is read-onlyGOT is still writableFull RELRO:supports all the features of partial RELROthe entire GOT is also (re)mapped as read-onlyIf you're struggling with the whole Global Offset Table mess I stron'''
