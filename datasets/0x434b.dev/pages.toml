full_description = '''General Dissecting and exploiting ELF files Published 4 May 2020 27 min read By 0x434b PrefaceHi folks!For quite some time there was no article from my side.Life kept me busy with all sorts of things, but here is a little something until some cooler project emerges :) . This article will focus on explaining the ELF file format.While this may seem like a really boring and very theory heavy research topic I actually had a lot of fun during my time digging through the available literature and trying things out on my own.This topic offers a huge amount of information, and I am by no means an expert since the following chapters are all knowledge obtained through self studies.I'll try to keep it short and precise and convey my message in a fun way with practical examples. That said let's dive right into the table of contents!The article will be split into the following parts:General informationThe ELF file format dissected2.1. a practical exampleA behavior study on the file size on x64MiscFinal conclusionRequired skillsBasic understanding of C, assembly, unix systemsAbout half an hour of timeGeneral informationSo first of all why would you and I want to bother learning a specified file format that was adopted as a system default in UNIX systems almost 20 years ago? “If you know the enemy and know yourself, you need not fear the result of a hundred battles. If you know yourself but not the enemy, for every victory gained you will also suffer a defeat. If you know neither the enemy nor yourself, you will succumb in every battle.” - Sun Tzu You might think what the hell am I talking about and why would I include this quote here? You hopefully will realize what I realized when digging into this topic more and more and hence my reasoning here. To me having this quote is no sign of being fancy and feeling superior. I just realized that even after quite some time it always comes back to this: "You know nothing"! And I want to change that to get to at least the level of "You know something" ;) .So if you want to dive into reverse engineering/binary exploitation in UNIX flavored systems you will have to study the internals of such a system. And one essential part of these are ELF files, since they are used for executables, shared libraries, object files, core-dump files, and even the kernel boot image!So is this article only for people interested in reverse engineering?No! If you're a curious mind or wanting to learn more about UNIX flavored systems in general you're at the right place (I hope..)! With that being said let's directly jump into the beefy part of this article.The ELF file format dissectedNote: I will not and cannot present every detail of the ELF file format in this article. The topic is a true rabbit hole and I really suggest doing your own research and reading. I will add several sources at the end of this that helped me greatly! I recommend continuing from there if you got interested.Let's start with a general layout on how a typical ELF file is structured: Linking View Execution View +-----------------+ +-----------------+ | ELF header | | ELF header | +-----------------+ +-----------------+ | Program header | | Program header | | table (opt.) | | table | +-----------------+ +-----------------+ | Section 1 | | | +-----------------+ | Segment 1 | | ... | | | +-----------------+ +-----------------+ | Section n | | | +-----------------+ | Segment 2 | | ... | | | +-----------------+ +-----------------+ | ... | | ... | +-----------------+ +-----------------+ | Section header | | Section header | | table | | table (opt.) | +-----------------+ +-----------------+ As you can see an ELF file has at least 2 headers that are always present.* ELF header (ELF32_Ehdr/ELF64_Ehdr) and the program header (Elf32_Phdr/struct Elf64_Phdr struct), or * ELF header (ELF32_Ehdr/ELF64_Ehdr) and the section header (Elf32_Shdr/struct Elf64_Shdr struct) -> Elf32 and Elf64 are each representing the architecture either being x86 or x64. The two different views can be roughly distinguished by the following definitions:The linking view is divided into sections and is used when linking of a library and program takes place. The sections contain information about object files like data, instructions, debugging information, symbols or relocation information.The execution view is divided into segments and is as the name suggests used during program execution. The segments go hand in hand with the program header table as shown later.Let's take a closer look at the core elements. I'll be focusing on x64 from now on, but for x86 this can be done analogously. Mostly the used and allocated space for structures differ between these two architectures.The ELF headerFirst of all we do have the ELF header that is 64 bytes big on 64-bit machines and defined as follows:[...] /* 64-bit ELF base types. */ typedef __u64 Elf64_Addr; /* 8 byte (unsigned) */ typedef __u16 Elf64_Half; /* 2 byte (unsigned) */ typedef __s16 Elf64_SHalf; /* 8 byte (signed) */ typedef __u64 Elf64_Off; /* 8 byte (unsigned) */ typedef __s32 Elf64_Sword; /* 4 byte (signed) */ typedef __u32 Elf64_Word; /* 4 byte (signed) */ typedef __u64 Elf64_Xword; /* 8 byte (unsigned) */ typedef __s64 Elf64_Sxword; /* 8 byte (signed) */ [...] #define EI_NIDENT 16 typedef struct elf64_hdr { unsigned char e_ident[EI_NIDENT]; /* ELF "magic number" */ Elf64_Half e_type; /* Object file type */ Elf64_Half e_machine; /* Architecture */ Elf64_Word e_version; /* Object file version */ Elf64_Addr e_entry; /* Entry point virtual address */ Elf64_Off e_phoff; /* Program header table file offset */ Elf64_Off e_shoff; /* Section header table file offset */ Elf64_Word e_flags; /* Processor-specific flags */ Elf64_Half e_ehsize; /* ELF header size in bytes */ Elf64_Half e_phentsize; /* Program header table entry size */ Elf64_Half e_phnum; /* Program header table entry count */ Elf64_Half e_shentsize; /* Section header table entry size */ Elf64_Half e_shnum; /* Section header table entry count */ Elf64_Half e_shstrndx; /* Section header string table index */ } Elf64_Ehdr; [...] The header structure is not difficult to grasp. It always holds all the information as some kind of road map for the binary within the very first bytes of the file.Just from these information we can already conclude a lot of information about the binary.Let's quickly go through the non address/size ones:e_ident: initial magic bytes that provide an answer for the OS on how to interpret and decode the files contents.e_type: identifies the file type. e.g: an executable or shared object file, ...e_machine: specifies the required architecture for a file. e.g: x86-64, ARM, MIPS, ...e_version: usually set to 1The next values all specify certain offset, size, address values for the section header and program header values which we will discuss next. I'll come back to these ELF header fields in due time.The program header(s)A program header describes segments within a binary and are necessary for program loading.These segments (1 or more) are understood by the kernel during load time and describe the memory layout of an executable on disk and how it should translate to memory.Since it helps in creating a process image a program header table becomes mandatory for executable files, but is optional for relocatable and shared object files (Linking View vs Execution View).Program headers do not exit in relocatable objects because these *.o files are meant to be linked into an executable but not meant to be loaded directly into memory!The program header structure is specified as follows:[...] typedef struct elf64_phdr { Elf64_Word p_type; /* Segment type */ Elf64_Word p_flags; /* Segment flags */ Elf64_Off p_offset; /* Segment file offset */ Elf64_Addr p_vaddr; /* Segment virtual address */ Elf64_Addr p_paddr; /* Segment physical address */ Elf64_Xword p_filesz; /* Segment size in file */ Elf64_Xword p_memsz; /* Segment size in memory */ Elf64_Xword p_align; /* Segment alignment, file & memory */ } Elf64_Phdr; [...] p_type: identifies the type of the segment. e.g.: loadable segment, dynamic linking tables, ...p_flags: specifies the attributes/permissions of the current segment. e.g.: 0x3 for R+W permissionsp_offset: contains the offset of the segment from the beginning of the filep_vaddr: contains the virtual address of the segment in memoryp_paddr: reserved for systems with physical addressingp_filesz: contains the size of the file image of the segmentp_memsz: contains the size of the memory image of the segmentp_align: some alignment bytes with the power of 2Since a program can have multiple program segments there are n program headers within a binary.The ELF header gives us all the information about where those are and how many of them exist:e_phoff: Points to the start of the program header tablee_phentsize: Contains the size of one program header table entry.e_phnum: Contains the number of entries in the program header table.Note: We can easily calculate the size of the program header by doing e_phentsize * e_phnumThere are about 5 very common program headers that I will introduce now:PT_LOADAn executable will always have at least one of these. It's describing a loadable segment that is mapped into memory upon loading it.If we take a dynamically linked ELF executable we generally have 2 of these segments right away:one for the text segment (program code)another one for the data segment for global vars, and other dynamic linking informationThese are going to be mapped into memory with a memory alignment specified by p_align.PT_DYNAMICOnce again let's take the example of a dynamically linked ELF executable, but this time it contains necessary information for the dynamic linker.If that's the case this segment is present and contains tagged values and pointers for e.g.:shared libraries that are linkedaddress/location of the GOTinformation about relocation entriesPT_NOTEThis segment is rather vendor/system specific as it can contain extra information.Other programs can use these fields to check for conformance or compatibility for example.This segment can hold any amount of entries.Each of the entries are an array of 4-byte words with the processor specific endianess in mind.PT_INTERPThis segment contains the location and size to a null terminated string that describes the program loader.This is typically the dynamic linker.For example in my local /bin/ls such a PT_INTERP segment can be found at the offset 0x238 and has the size 0x1c$ hd -n 28 -s 568 /bin/ls 00000238 2f 6c 69 62 36 34 2f 6c 64 2d 6c 69 6e 75 78 2d |/lib64/ld-linux-| 00000248 78 38 36 2d 36 34 2e 73 6f 2e 32 00 |x86-64.so.2.| 00000254 PT_PHDRThis one holds the location and size of the program header table itself.The Section header(s)As shown earlier a program header contains segments that are necessary for program execution.Each of these segments hold either code or data that is divided into sections.So in short a section header table references the location and size of these sections and is mainly used for linking/debugging purposes.Section headers are not needed for correct program execution whereas program headers are!That's the case because section headers don't map any memory layout for the binary.So you can happily strip away a section header from a binary and it still will execute just fine, but debugging/reversing will be more difficult.When taking a closer look at sections it appears each can hold code or data, for example program data, such as global variables, or dynamic linking information thatis necessary for the linker.This makes clear why not having them in a binary makes the debugging process more difficult.A section header is defined as follows:[...] typedef struct elf64_shdr { Elf64_Word sh_name; /* Section name, index in string table */ Elf64_Word sh_type; /* Type of section */ Elf64_Xword sh_flags; /* Miscellaneous section attributes */ Elf64_Addr sh_addr; /* Section virtual addr at execution */ Elf64_Off sh_offset; /* Section file offset */ Elf64_Xword sh_size; /* Size of section in bytes */ Elf64_Word sh_link; /* Index of another section */ Elf64_Word sh_info; /* Additional section information */ Elf64_Xword sh_addralign; /* Section alignment */ Elf64_Xword sh_entsize; /* Entry size if section holds table */ } Elf64_Shdr; [...] The structure is very similar to the program header one, so I will only point out these fields that are different.sh_name: An offset to a string in the .shstrtab section that represents the name of this sectionsh_link: Points to another sectionsh_info: Contains extra information about the section. Interpretation depends on section typesh_entsize: Contains the size of each entry, for sections that contain fixed-size entries. Otherwise, this field contains zero.Once again let's quickly walk through the most common sections and what they are for!.textThis section is a code section that contains the programs code instructions..rodataThis one contains read-only data for example strings from code like this printf("Wassup 0x00sec?\n");.Moreover since it contains read-only data it must reside in a read only segment of the binary..pltThe procedure linkage table (PLT) contains information for the dynamic linker to be able to call functions from used shared libraries..dataThis section resides in the data segment and contains data such as initialized global variables..bssThis section is similar to .data just with the fact that it contains uninitialized global data..got.pltThe global offset table (GOT) works together with the PLT to dynamically resolve and access imported shared library functions.This one is often attacked in GOT-overwrite exploits..dynsymThis sections contains information about dynamic symbols imported from shared libraries e.g. printf from libc.These are dynamically loaded at runtime..dynstr.dynstr contains the string table for dynamic symbols that are each null terminated..rel.*Any relocation section has information about certain parts of a binary that need to be adjusted/modified by the linker or at runtime..hashThis one contains a hash table with the purpose of being able to loop up symbols..symtabThe .symtab section contains all symbols from .dynsym as well as local symbols for the executable such as global vars, or local functions with type ElfN_Sym..symtab is not loaded into memory because it is not necessary for runtime. It's mainly for debugging and linking purposes..strtab.strtab contains the symbol string table that is references by an entry within ElfN_Sym structs..shstrtab.shstrtab contains the section header string table that is used to resolve names for each section.More precise in here are the string values for the sh_name field from the section header struct.They can be accessed via an index/offset added on the sh_offset of this section..ctors/.dtorsThe .ctors (constructors) and .dtors (destructors) sections contain function pointers to initialization and finalization code that is to be executed before and after the actual mai'''
