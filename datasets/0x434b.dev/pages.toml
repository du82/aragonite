QKSd61KAS2BeymU7BxYzylVffzuAO0Z2pQ2ZFAF6Tsk7LP4OpNs0auULHSarOeYBWiJks3S 4LC2K11UukvQKPz7BW3UoGrgW0aoF8L9GtSrtCJKqHL5phBq9oGia5vkfqAz7XmiRnRJsZW+kUQo pIP2klClRne3CHPaSR/50SzjgwlsvpcFbj+htyjf02JWyXmbav4saiO2xIi0rs2/3tA2FrNkcS35 imdmHPBuj68rizpdsfO+zhR4g1nJmH6hWt6XSo8y3rzUSH8DHMeS4QZIAAA=Initial AnalysisThe file command reveals that it is a 32-bit ELF binary that is not stripped.$ file bomb bomb: ELF 32-bit LSB executable, Intel 80386, version 1 (SYSV), dynamically linked, interpreter /lib/ld-linux.so.2, for GNU/Linux 2.6.15, BuildID[sha1]=e6a360ee322cefe6f3bb6110b5b587bc891d08fe, not stripped First runWhen first running the binary we can directly see that it is a multi stage binary consisting of 4 phases. It looks like only when we are able to figure out all 4 phases we will solve the challengeSo let's start one by oneAnalysis phase 1 - YellowWhen selecting the yellow option in the main menu we're prompted for a password. So I loaded the whole thing into BinaryNinja and took a look at the yellow routine.As yellow_preflight shows, this subroutine reads 10 bytes (0xa) user input from stdin via fgets and stores it into something BinaryNinja labeled as buffer. Afterwards, the input is compared byte for byte against a "fixed" sequence. So we can just convert the hex values to ASCII as all seven of them are in valid ASCII range.res = '' for i, v in enumerate([0x38, 0x34, 0x33, 0x37, 0x31, 0x30, 0x36, 0x35]): res += ''.join(chr(v)) print(res) 84371065That's that!Analysis Phase 2 - GreenSo next up to the green phase. Same routine again. We're prompted for a password once again.Let's dive back into BinaryNinja again.So basically the green_preflight one again uses fgets to prompt for user input from stdin again. At most 0x14 bytes. However, only the first 0x8 bytes are taken into consideration in the call to strncmp against a hardcoded value. As dcaotdae is already 0x8 bytes in length we can just use this one as a password without having to care about filling the remaining free bytes in the user controlled input buffer...That said, when using dcaotdae as a password it is getting accepted but the decision is overriden by good old NOIZEV so we did not solve that one yet..So what did we overlook?When double checking the responsible assembly we notice that whatever is returned by the strncmp operation (stored in EAX!) is undergoing the test eax, eax before deciding where to jump.In case of us using dcaotdae as the password the strncmp is returning 0 since:The strcmp() and strncmp() functions return an integer less than, equal to, or greater than zero if s1 (or the first n bytes thereof) is found, respectively, to be less than, to match, or begreater than s2.The directly following test eax, eax, which is doing a bitwise and on the two provided arguments and sets register flags accordingly:TEST sets the zero flag, ZF, when the result of the AND operation is zero. If two operands are equal, their bitwise AND is zero when both are zero. TEST also sets the sign flag, SF, when the most significant bit is set in the result, and the parity flag,PF, when the number of set bits is even.As test eax, eax == test 0, 0 == 0 & 0 which according to basic boolean logic is also 0. As a result the ZERO flag is set. Hence the jne 0x804998e is not taken and instead the control flow is redirected to 0x8049946, which is responsible for us still being stuck on the green phase.call strncmp ; set eax==0 if match, else to 1 test eax, eax ; set ZF==1 if eax==0, else ZF==0 jne 0x804998e ; jump to 0x803998e if ZF==0So the game plan is to take the jump to 0x804998e by forcing the strncmp to return != 0 right?Wrong! So what is the deal here? Turns out us providing dcaotdae as the password is partially correct. To understand how to solve this properly we need to look very closely at what is responsible for re-engaging the 'fuse' and how local variables are setup on a function stack frame. Right now our situation looks like this:Let's backtrack! Assuming we're still providing dcaotdae as the password, control flow would be redirected to this basic block:At this point the following happens:mov eax, [ebp-0x8] ; eax=1 and eax, 1 ; yields eax=1 test eax, eax ; doesn't set any flag sete al ; al=0 because it sets the byte in the operand to 1 if ZF is set, otherwise sets the operand to 0. movzx eax, al ; eax=0 mov [ebp-0x8], eax ; [ebp-0x8]=0 [...] mov eax, [ebp-0x8] ; eax=0 and eax, 0x1 ; and 0,1 --> eax=0 test eax, eax ; 0 & 0 --> ZF set sete al ; al=1, because ZF=1 movzx eax, al ; eax=1 mov [ebp-0x8], eax ; re-set [ebp-0x8]=1So in this situation both eax and [ebp-0x8] are set to 1. The next direct jump to 0x804999a leads here:mov eax, [ebp-0x8] ; eax=1 (still) test eax, eax ; ZF=0 jne 0x80499ad ; goto 0x80499adAnd with that we would return to the main menu and get another chance with the green fuse still in place. So how do we solve this?The answer lies within how local function variables are set up and that the provided user input via the fgets call is able to corrupt the value st'''
