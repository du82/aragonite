.] Welcome to the Poly Bomb. Three levels to solve and you get a key at the completion of each level. Good Luck... Good Job with Phase One on to the next Wow you solved phase two??? On to the next Woot You solved the binary bomb Tick...Tick...Tick... [...] [some ASCII ART HERE] [...] H0Tf00D:< %d %d %d %d %d %d Key problem contact ctf-owner@isis.poly.edu ;*2$" BinaryBomb:( GCC: (Ubuntu/Linaro 4.7.3-1ubuntu1) 4.7.3 .symtab .strtab .shstrtab [...] So at the beginning we seem to have some function strings which might get called. We already can assume that we have to deal with different read/print and input compare functions. Another function which stands out is int tolower(int c), which casts every input to lowercase. Next the output gives us a rough idea what we are dealing with here. Similar to the write-up before we have some kind of bomb defuse scenario with a total of 3 phases.Note: I intentionally omitted the ASCII art since its not of major importance and would not help us reverse the binary.Following this we have some weird and shady looking strings we might wanna keep in mind for the next steps. Last but not least we also have some binary internal strings like the symbol table or string table.Second assessmentAfter the first recon phase we have a rough idea what we are dealing with here. Let's fire up our favorite tool for disassembly and take a look at the binary. Time for some fun in depth analysis! Since we still have all the debugging symbols we can easily navigate through the binary:We can clearly see that we have 3 phases almost always with a preceding call to readLine(), which will ask for our input to solve the respective phase. If we manage to finish all phases win() gets called.In the beginning, a function named sphinx is called though..Since I omitted the ASCII art before I will just solve the riddle of the sphinx. This function prepares the ASCII art which is shown to us in the beginning (I omitted that part in the strings output).So let's start with analyzing all the 3 phases :)Phase 1This one is pretty straight forward, we see that IDA recognizes at offset change a string literal: "BinaryBomb:(", which is loaded into [ebp+s1] and then into eax. This is repeated 6 times.Each time the string is loaded into eax an offset (0 <= offset <= 5) is added to access the the first 6 elements in the string to change them to the shown hex values, which conveniently for us, IDA already converted into ASCII characters automatically. So the original "BinaryBomb:(" string is changed to "=bJd{cBomb:(" via a byte by byte access.Phase 2So let's directly dive into phase 2! Here the call to readline() got moved into the phase instead of preceeding it in the main function.After reading the user input and set [ebp-0x74] to 0 as it is serving as a loop counter to do 8 iterations:0x08048931 cmp [ebp-0x74], 7 0x08048935 jle loc_80488c8But what does the code in the loop body do? We can see a lot of mov(zx/sx) operations, some arithmetic right shift (sar), someinteger division(idiv), as well as a bunch of additions(add). So let's examine the more interesting parts.0x080488d0 movzx eax, byte [eax] 0x080488d3 mov ecx, eax This basically takes the first byte of our input and saves it in ecx!0x080488eb sar edx,0x1f ; 0x1f = 31 This here does a right shift of 31 bits on edx. This will always zero out the edx register. Let's take a look at the next interesting operation0x080488e3 mov ebx, dword [modulus] ; ebx is set to 10 here ... 0x080488ee idiv ebx The idiv operation looks harmless but it might be a little confusing what it actually does!idiv <ebx> eax = eax / <ebx> edx = edx % <ebx>So eax holds the quotient and edx will hold the remainder after this operation. With this in mind the following line may make more sense now0x080488f0 mov eax, edx 0x080488f2 add eax, ecxNow eax holds the remainder of the integer division, while ecx is holding one byte of the input we provided and did the integer division on. Now we're adding these and storing the result back in eax. How can we interpret this? Basically what we are are doing here is some kind of shift/encryption of the input. Recall that we enter this loop 8 times. So we're changing 8 bytes of our input! Let's briefly look at what happens after we finish looping!So we're comparing our shifted input to something at hard coded that is stored at offset s1. As we can already see, IDA resolves the offset to the string "H0Tf00D:<". If our "encrypted" input matches this string we will have solved phase2! The used algorithm can be easily ported to a python script:flag = "" inp = "ABCDEFGH" mod = 0xa ctr = 0 while(ctr < 7): flag += chr(ord(inp[ctr]) % mod + ord(inp[ctr])) ctr += 1 print(flag) FHJLNFH So how do we get the flag?2 possibilities come to mind right away.First: try to map every input to the appropriate output by using dynamic analysis methodsSecond: Look at the done mathematical operations and reverse their order starting with the hard coded result as the starting point.Third, just take a dumb brute force approach as the used algorithm is very very lightweightmod = 0xa flag = "H0Tf00D:<" inp = "" for k in range(0, 8): for i in range(0, 127): j = i + i%mod if chr(j) == flag[k]: inp += chr(i) break print(inp + "<") B'M`'';1<So why am I manually appending "<"? Look at the length of this string. It has a length of 9, but we're only looping 8 times! So we already have a part of our flag before even starting! "<" will always be the last character of the flag! Phase 3So as always let's take a look at the last phase for this binary!At first glance phase 3 might not look much more difficult compared to phase 2. If we look closer we can see another function call this time around though: sanitize(). Also we can identify 2 separate loop constructs. Let's take a quick peak at the sanitize function first:Keep in mind that another readline() function call was executed before entering phase 3! Anyhow, in here strlen is used to get the length of our provided input. When returning len(input) is stored in eax. ebx was set to 0 before the call to strlen. So it seems like we're entering the loop as many times as our input is long! The next basic block just checks whether the current input byte is != 0x20 (SPACE). When this is not the case we enter the third bigger block in the loop. This one casts the current input byte to lowercase and stores the result back in the input buffer!As a conclusion we can note that no matter what we input for phase 3 it will always be converted to a lower case representation. We can focus on providing lower case input then anyway! Back in phase 3 there is another call to strlen() for our now lower case input. It gets pushed to [ebp-0x10] and then compared to 0x4!0x080489a4 mov dword [ebp-0x10], eax 0x080489a7 cmp dword [ebp-0x10], 0x4 We can conclude another thing now. Our input has to have a length > 4, because if its <= 4 we jump right to explode_bomb(). Next [ebp-0x14] and eax are set to 0! The former is used as a loop counter, while the latte'''
