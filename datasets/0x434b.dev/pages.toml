title = "Breaking the D-Link DIR3060 Firmware Encryption - Static analysis of the decryption routine - Part 2.2"
description = "Welcome back to part 2.2 of this series! If you have not yet checked out part 1 or part 2.1, please do so first as they highlight important reconnaissance steps as well as the first half of the disassembly analysis! Let's recall the current functionality we've encountered based"
full_description = '''Hardware Breaking the D-Link DIR3060 Firmware Encryption - Static analysis of the decryption routine - Part 2.2 Published 15 Jul 2020 30 min read By 0x434b Welcome back to part 2.2 of this series! If you have not yet checked out part 1 or part 2.1, please do so first as they highlight important reconnaissance steps as well as the first half of the disassembly analysis! Let's recall the current functionality we've encountered based on the developed source code:#include <arpa/inet.h> #include <errno.h> #include <fcntl.h> #include <openssl/aes.h> #include <openssl/pem.h> #include <openssl/rsa.h> #include <stddef.h> #include <stdio.h> #include <stdlib.h> #include <string.h> #include <sys/mman.h> #include <sys/stat.h> #include <sys/types.h> #include <unistd.h> static RSA *grsa_struct = NULL; static unsigned char iv[] = {0x98, 0xC9, 0xD8, 0xF0, 0x13, 0x3D, 0x06, 0x95, 0xE2, 0xA7, 0x09, 0xC8, 0xB6, 0x96, 0x82, 0xD4}; static unsigned char aes_in[] = {0xC8, 0xD3, 0x2F, 0x40, 0x9C, 0xAC, 0xB3, 0x47, 0xC8, 0xD2, 0x6F, 0xDC, 0xB9, 0x09, 0x0B, 0x3C}; static unsigned char aes_key[] = {0x35, 0x87, 0x90, 0x03, 0x45, 0x19, 0xF8, 0xC8, 0x23, 0x5D, 0xB6, 0x49, 0x28, 0x39, 0xA7, 0x3F}; unsigned char out[] = {0x30, 0x31, 0x32, 0x33, 0x34, 0x35, 0x36, 0x37, 0x38, 0x39, 0x41, 0x42, 0x43, 0x44, 0x45, 0x46}; int check_cert(char *pem, void *n) { OPENSSL_add_all_algorithms_noconf(); FILE *pem_fd = fopen(pem, "r"); if (pem_fd != NULL) { RSA *lrsa_struct[2]; *lrsa_struct = RSA_new(); if (!PEM_read_RSAPublicKey(pem_fd, lrsa_struct, NULL, n)) { RSA_free(*lrsa_struct); puts("Read RSA private key failed, maybe the password is incorrect."); } else { grsa_struct = *lrsa_struct; } fclose(pem_fd); } if (grsa_struct != NULL) { return 0; } else { return -1; } } int aes_cbc_encrypt(size_t length, unsigned char *key) { AES_KEY dec_key; AES_set_decrypt_key(aes_key, sizeof(aes_key) * 8, &dec_key); AES_cbc_encrypt(aes_in, key, length, &dec_key, iv, AES_DECRYPT); return 0; } int call_aes_cbc_encrypt(unsigned char *key) { aes_cbc_encrypt(0x10, key); return 0; } int actual_decryption(char *sourceFile, char *tmpDecPath, unsigned char *key) { int ret_val = -1; size_t st_blocks = -1; struct stat statStruct; int fd = -1; int fd2 = -1; void *ROM = 0; int *RWMEM; off_t seek_off; unsigned char buf_68[68]; int st; memset(&buf_68, 0, 0x40); memset(&statStruct, 0, 0x90); st = stat(sourceFile, &statStruct); if (st == 0) { fd = open(sourceFile, O_RDONLY); st_blocks = statStruct.st_blocks; if (((-1 < fd) && (ROM = mmap(0, statStruct.st_blocks, 1, MAP_SHARED, fd, 0), ROM != 0)) && (fd2 = open(tmpDecPath, O_RDWR | O_NOCTTY, 0x180), -1 < fd2)) { seek_off = lseek(fd2, statStruct.st_blocks - 1, 0); if (seek_off == statStruct.st_blocks - 1) { write(fd2, 0, 1); close(fd2); fd2 = open(tmpDecPath, O_RDWR | O_NOCTTY, 0x180); RWMEM = mmap(0, statStruct.st_blocks, PROT_EXEC | PROT_WRITE, MAP_SHARED, fd2, 0); if (RWMEM != NULL) { ret_val = 0; } } } } puts("EOF part 2.1!\n"); return ret_val; } int decrypt_firmware(int argc, char **argv) { int ret; unsigned char key[] = {0x30, 0x31, 0x32, 0x33, 0x34, 0x35, 0x36, 0x37, 0x38, 0x39, 0x41, 0x42, 0x43, 0x44, 0x45, 0x46}; char *ppem = "/tmp/public.pem"; int loopCtr = 0; if (argc < 2) { printf("%s <sourceFile>\r\n", argv[0]); ret = -1; } else { if (2 < argc) { ppem = (char *)argv[2]; } int cc = check_cert(ppem, (void *)0); if (cc == 0) { call_aes_cbc_encrypt((unsigned char *)&key); printf("key: "); while (loopCtr < 0x10) { printf("%02X", *(key + loopCtr) & 0xff); loopCtr += 1; } puts("\r"); ret = actual_decryption((char *)argv[1], "/tmp/.firmware.orig", (unsigned char *)&key); if (ret == 0) { unlink(argv[1]); rename("/tmp/.firmware.orig", argv[1]); } RSA_free(grsa_struct); } else { ret = -1; } } return ret; } int encrypt_firmware(int argc, char **argv) { return 0; } int main(int argc, char **argv) { int ret; char *str_f = strstr(*argv, "decrypt"); if (str_f != NULL) { ret = decrypt_firmware(argc, argv); } else { ret = encrypt_firmware(argc, argv); } return ret; }We left of right after the setup stuff:The last thing we analyzed was re-mapping the file located at /tmp/.firmware.orig back into memory with some minor adjustments to file permissions. Again if the mapping fails we'll take a non-wanted path, so we will ignore that in the analysis again. So in case of success the still mapped sourceFile is being prepared as a function argument to a function called check_magic:First decryption related code after all the file prep work earliercheck_magiccheck_magic is pretty straightforward. It takes a mapped memory (at least read-only permissions) segment as an argument and calls int memcmp(mapped_sourceFile, "SHRS", 4) to check whether the first 4 bytes in the binary correspond to "SHRS" (0x53485253). According to the return value of memcmp, which is stored in $v0, sltiu $v0, 1 sets the return value of this function as follows:If $v0 == 0 (== full match) → $v0 = 1Else $v0 = 0The disassembly graph earlier shows that if the return value of check_magic is != 0 the branch to magic_succ is taken (bnez $v0, magic_succ). This little function serves as a sanity check and first confirmation that an encrypted image starts with a valid header. We already saw this string earlier in the hex dump in part 1. So, this part at least clears up the confusion about this seemingly non-random string. It was indeed non-random after all! The snippet below again confirms the presence of "SHRS" in an encrypted image file.> hd DIR_882_FW120B06.BIN -n 16 00000000 53 48 52 53 00 d1 d9 a6 00 d1 d9 b0 67 c6 69 73 |SHRS........g.is| 00000010 0x53 0x48 0x52 0x53 == "SHRS"So, once we pass this check and are back in the actual_decryption function, control flow continues here:The first two chunks that lead up two a call to uint32_t htonl(uint32_t hostlong) are best explained with an example. Once again, we're using the header of an encrypted firmware sample:$v0: ↓ 00000000: 5348 5253 00d1 d9a6 00d1 d9b0 67c6 6973 SHRS........g.is 00000010: 51ff 4aec 29cd baab f2fb e346 fda7 4d06 Q.J.)......F..M. [...] lwl $v1 11($v0): ↓ 00000000: 5348 5253 00d1 d9a6 00d1 d9b0 67c6 6973 SHRS........g.is 00000010: 51ff 4aec 29cd baab f2fb e346 fda7 4d06 Q.J.)......F..M. [...] --> $v1 = b0d9 move $a0, $v1 --> $a0 = b0d9 XXXX lwr $a0, 8($v0): ↓ 00000000: 5348 5253 00d1 d9a6 00d1 d9b0 67c6 6973 SHRS........g.is 00000010: 51ff 4aec 29cd baab f2fb e346 fda7 4d06 Q.J.)......F..M. [...] --> $a0 = b0d9 d100 nop move $v0, $a0 --> $v0 = b0d9 d100 move $a0, $v0 --> $a0 = b0d9 d100 htonl(b0d9 d100)In MIPS, we need this pair of lwl, lwr instructions for unaligned memory access. Basically, you're providing the lwl instruction with the address of the most significant byte of an unaligned memory location. It will automatically put the corresponding bytes into the upper bytes of the destination register ($v1/$a0 respectively). lwr works analogously, with the only difference being that the picked bytes are put in the lower bytes of the destination register. The results are combined by merging both byte values (so these instructions can be used in either order!).# datalen_2 int.from_bytes(b'\xb0\xd9\xd1\x00', byteorder='little', signed=False) 13752752 # Alternatively, we can use the socket package from socket import htonl htonl(0xb0d9d100) 13752752 # datalen_1 int.from_bytes(b'\xa6\xd9\xd1\x00', byteorder='little', signed=False) 13752742Both return values are saved on the stack (0x128+datalen_2($sp) / 0x128+datalen_1($sp)). The question remains what are they used for and why are there two almost identical values (\xb0\xd9\xd1\x00 vs. \xa6\xd9\xd1\x00). Neither of those two seem to be the full length of the encrypted firmware binary:> wc -c DIR_882_FW120B06.BIN 13759047 DIR_882_FW120B06.BIN > wc -c DIR_882_FW120B06.BIN | cut -d' ' -f1 | xargs printf '0x%x\n' 0xd1f247Their purpose will become clear soon, as one of these values is used right away! After this fun memory access magic, a function call to calcSha512Digest is being prepared with 3 arguments: calcSha512Digest(mapped_sourceFile + 0x6dc, datalen_2, buf). calcSha512DigestAs the name already gives away, this function calculates a SHA512 message digest. Based on the function arguments, this invocation will use the mapped encrypted firmware at offset 0x6dc, with length datalen_2, which we just calculated earlier in the htonl part! When taking this offset into account could datalen_2 = total size - offset?> # total size - offset - datalen_2 > pcalc 0xd1f247 - 0x6dc - 0xd1d9b0 4532 0x11b4 0y1000110110100' # Clearly not..The provided buffer variable is used to store the hash result memory. The function itself just uses the SHA512 library functions. If you look a bit more closely you'll notice that this holy trinity of SHA512_Init, SHA512_Update, and SHA512_Final all belong to OpenSSL and are taken from libcrypto which we found in the strings output in part 1!Right after exiting calcSha512Digest the basic block continues with setting up another memcmp to compare the just calculated hash digest to an expected value:This value is hard-coded in the encrypted binary (which is still mapped as RO into memory at this point) at offset 0x9C. The third supplied argument to the int memcmp(const void *s1, const void *s2, size_t n) call is again the size and as expected, has to be 0x40 bytes as SHA512 returns a 512 bit digest (== 64 bytes == 0x40 bytes). We can easily extract said value from our encrypted firmware:> pcalc 0x40 64 0x40 0y1000000 > pcalc 0x9c 156 0x9c 0y10011100 > hd DIR_882_FW120B06.BIN -s 0x9c -n 64 0000009c 68 bf e5 30 a0 49 b9 e8 5d a0 bb 81 71 87 05 cd |h..0.I..]...q...| 000000ac 70 25 18 f2 8f af d6 21 35 05 31 7e fd af 60 56 |p%.....!5.1~..`V| 000000bc d8 ed e7 71 6c 39 d1 68 0d a7 13 f4 04 41 87 58 |...ql9.h.....A.X| 000000cc e9 97 36 73 99 78 8b 01 10 ee 12 d6 b6 3b 69 ec |..6s.x.......;i.| 000000dc > hd DIR_882_FW120B06.BIN -s 0x9c -n 64 -e '156/1 "%x" "\n"' | cut -d$'\n' -f2 68bfe530a049b9e85da0bb8171875cd702518f28fafd621355317efdaf6056d8ede7716c39d168da713f44418758e997367399788b110ee12d6b63b69ec If there is a mismatch, control flow is, as usual, redirected to an early exit. However, in case of success control is redirected to the part I renamed as hash1_succ (memcmp returns (in $v0) 0 on an exact match, which is followed by a branching beqz $v0, hash1_succ instruction).The first part in hash1_succ sets up another call to aes_cbc_encrypt with five arguments:arg1 ($a0): mapped source File + 0x6dcarg2 ($a1): datalen_2arg3 ($a2): decryption key (still the one from the debug printf to stdout earlier)arg4 ($a3): IVEC (same as before)arg5 (on stack): mapped file at /tmp/ locationWe already covered earlier what this function does. However, instead of calculating the decryption key with size 0x40 a large chunk of memory from the mapped and encrypted firmware is being used with the decryption key. This can only mean one thing: This code block is responsible for decrypting the whole thing!So, after aes_cbc_encrypt returns we basically have access to the fully decrypted firmware already. Directly afterwards, there is another call to calcSha512Digest:This time with our suspected freshly decrypted firmware, datalen_1, and a buffer as the arguments. The result of the SHA512 operation is compared against an expected value at encrypted_firmware + 0x5c. Once again, we're talking about a 64 byte value here: > hd DIR_882_FW120B06.BIN -s 0x5c -n 64 -e '92/1 "%x" "\n"' | cut -d$'\n' -f2 1657d3b7d77c9e11ec721dfb87a25b18ec538285b98439b6b4dd85def0283d36ebeaad09d71b0ba3e2640e8c54ceb32eb0e8f721d73aaad14d5f7e872Checksum for the decrypted firmwareAnalogous to other memcmp operations earlier, another beqz $v0, hash2_succ redirects control flow based on the result. We've seen this multiple times by now, so we're directly taking a look at the wanted branching result.I'll be pretty quick about this one. We have yet another function call where a SHA512 message digest is calculated. This time, the only difference being that the digest is calculated over the entire decrypted firmware image concatenated with the decryption key. And as always, the result is compared against a hard-coded value in the encrypted firmware at offset 0x1c:> hd DIR_882_FW120B06.BIN -s 0x1c -n 64 -e '92/1 "%x" "\n"' | cut -d$'\n' -f2 fda74d6a466e6adbfc49d13f3f7d112986b2a351de9085b783f74d3a2a255ab813cfb2a177ab29946066ebc2589882748e3541ee2514442e8d68e466e2cBefore quickly moving onto the next part denoted as hash3_succ let's recap what datalen_1 and datalen_2 are used for!Analysis of the datalen variables:Just earlier, we saw the two variables used almost interchangeably. The invested reader might have already figured it out. But the one call to aes_cbc_encrypt earlier gave away that datalen_2 at offset 0x8 - 0x12 corresponds op the length of the decrypted firmware binary. At the end of this series we will be able to decrypt these firmware samples just fine so here is a little foreshadowing with a decrypted sample:# datalen_2 > hd DIR_882_FW120B06.BIN -n 4 -s 0x8 00000008 00 d1 d9 b0 |....| 0000000c > wc -c decrypted_DIR_882_FW120B06.BIN | cut -d' ' -f1 | xargs printf '%x\n' d1d9b0But what about datalen_1 at offset 0x4 - 0x8?# datalen_1 > hd DIR_882_FW120B06.BIN -s 0x4 -n 4 00000004 00 d1 d9 a6 |....| 00000008# datalen_1 int.from_bytes(b'\xb0\xd9\xd1\x00', byteorder='little') 13752742It's almost identical in size compared to datalen_2 with only a difference of 10 bytes. However, as it is smaller, it cannot be the size of the decrypted payload. We also already ruled out that it is the size of the encrypted firmware image before. So, what is it?Let's backtrack! Right after, a call to aes_cbc_encrypt the datalen_1 is used to calculate two SHA512 message digests over the decrypted firmware image, once without the decryption key put in the cipher and once with it in there. That does not seem to be any helpful... So, what about the missing 10 bytes (difference between these two length variables) that are disregarded in the hash calculation?> hd decrypted_DIR_882_FW120B06.BIN -s 0xd1d9a6 00d1d9a6 00 00 00 00 00 00 00 00 00 00 |..........| 00d1d9b0Last 10 bytes in the decrypted firmwareWhen seeking to datalen_1 and getting the hex dump until EOF, we can see that it is just NULL bytes! So, these 10 bytes cannot be some kind of check sum or any other relevant metadata. If you look very close at the addresses, you can see that the decrypted firmware ends at 0x1d9b0. What's so special about this address? Turns out it's not the address that is special but the properties of it:> pcalc 0xd1d9b0 % 16 0 0x0 0y016 byte alignment matters!Now, why is a 16 byte alignment needed in the first place? The answer is in the disassembly, where datalen_2 is used with the call to aes_cbc_encrypt! As the RFC for AES_CBC_ENCRYPT for IPSec nicely states: 2.4. Block Size and Padding The AES uses a block size of sixteen octets (128 bits). Padding is required by the AES to maintain a 16-octet (128-bit) blocksize. Padding MUST be added, [...], such that the dat'''
