["https://0x434b.dev/an-introduction-to-address-space-layout-randomization-aslr-in-linux"]
title = "Exploit Mitigation Techniques - Part 3 - Address Space Layout Randomization (ASLR)"
description = """
Preface

Hey there!
I'm finally ready to present you the third installment of the series exploit mitigation techniques. The last two times we talked about Data Execution Prevention and Stack Canaries. Today I want to talk about Address Space Layout Randomization or ASLR in short. Format wise the article will"""
full_description = '''Exploitation Exploit Mitigation Techniques - Part 3 - Address Space Layout Randomization (ASLR) Published 4 May 2020 27 min read By 0x434b PrefaceHey there!I'm finally ready to present you the third installment of the series exploit mitigation techniques. The last two times we talked about Data Execution Prevention and Stack Canaries. Today I want to talk about Address Space Layout Randomization or ASLR in short. Format wise the article will be structured the following way:Introduction to the techniqueCurrent implementation detailsWeaknessesPoC on how to bypass ASLRConclusionDisclaimer: The following is the result of a self study and might contain faulty information. If you find any let me know. Thanks!RequirementsA bunch of spare minutesA basic understanding of what causes memory corruptions/information leaksThe will to ask or look up unknown terms yourselfASM/C knowledgex64 exploitation basicsreturn oriented programming basicsknowledge from my previous 2 installmentsAddress Space Layout RandomizationBasic DesignWith DEP and canaries in place adversaries could not easily execute arbitrary inserted code in memory anymore. Memory pages, where buffer contents reside are marked non executable and the canary value prevents a simple overwrite of any return statement within a function. A problem that was still present and exploited was that executed processes had a static address mapping.That made it easy to find addresses of library functions or the run binary itself in memory. Ultimately leading to a successful arc injection attack without much effort.As a result address space layout randomization (ASLR) emerged to bring another security parameter to the table to deny adversaries easily guessable memory locations. The idea is to place objects randomly in the virtual address space causing a non trivial problem to solve for an attacker, which is the ability to execute placed malicious code at will. A very tl;dr version of ASLR would be that a random offset value is added to the base address during process creation to independently change all three areas of a process's address space, consisting of an executable, mapped and stacked area. In short the most exploited areas: the stack, the heap and the libraries are mapped randomly in memory to prevent abuse.Linux offers three different ASLR modes which are displayed below:Linux ASLR can be configured through setting a value in /proc/sys/kernel/randomize_va_space. Three types of flags are available 0 – No randomization. Everything is static. 1 – Conservative randomization. Shared libraries, stack, mmap(), VDSO and heap are randomized. 2 – Full randomization. In addition to elements listed in the previous point, memory managed through brk() is also randomized. Note: "VDSO" (virtual dynamic shared object) is a small shared library that the kernel automatically maps into the address space of all user-space applications.Note 2: mmap() creates a new mapping in the virtual address space of the calling process.Note 3: brk() and sbrk() change the location of the program break, which defines the end of the process's data segment.Beyond that Linux systems offer position independent executables (PIE) binaries, which harden ASLR even more. PIE is an additional address space randomization technique that compiles and links executables to be fully position independent. The result is that binaries compiled that way have their code segment, their global offset table (GOT) and their procedure linkage table (PLT) placed at random locations within virtual memory each time the application is executed as well, leaving no more static locations. Process Virtual Memory Mapping First execution Second Execution Third Execution + +------------------+ +------------------+ +------------------+ | | | | | | | | | | +------------------+ | | | +------------------+ | executable | | | | | executable | | | +------------------+ | | | +------------------+ | executable | | +------------------+ | | | | | | | | | +------------------+ | | | +------------------+ | | | | | | | +------------------+ | | | | heap | | | | +------------------+ | | | heap | | | | +------------------+ | | | | heap | | | +------------------+ | | | | | | | | +------------------+ | | | | Memory address | | libraries | | | +------------------+ growth direction | | | | | | libraries | | +------------------+ | | | | | | | +------------------+ +------------------+ | | | | libraries | | | | | | | | | | | | | +------------------+ | | | | | | | +------------------+ | | | +------------------+ | | | | | | | | Stack | | +------------------+ | Stack | | | | | | | | | | | | Stack | | | +------------------+ | | | +------------------+ | | | | | | | | | | +------------------+ | | | | | | | | | | | v +------------------+ +------------------+ +------------------+ Here you can see a simple overview on how a process can behave in memory after three successive executionsPIE detourLet's talk about total position independency for a moment! To make a PIE binary work correctly we have to consider that there needs to be a way for the loader to resolve symbols at runtime. As the address of the symbol in memory is not a part of the main binary anymore the loader adds a level of indirection in the procedure linkage table (PLT). Instead of calling, lets say puts() directly, the .plt section of the binary contains a special entry that points to the loader. The loader then has to resolve the actual address of the function. Once it has done that it updates an entry in the Global Offset Table (GOT). Subsequent calls to the same routine are made by jumps from the GOT entry.Trivia: The Linux command line program file detects PIE files as dynamic shared objects (DSO) instead of the usual ELF file.PIE must be viewed as an addition to ASLR, since it would not do any good if there was no ASLR in the first place. That said since a PIE binary and all of its dependencies are loaded into random locations within virtual memory each time the application is executed return oriented programming (ROP) attacks are much more difficult to execute reliably.Okay back to the main topic about ASLR! Linux based operating systems got a default ASLR implementation since kernel version 2.6.12, which was released in 2005, but got a set of patches to increase security by the PaX project later on. But already in 2001 PaX published the first design and implementation of ASLR. Only years later in 2014 with the release of kernel version 3.14 the possibility to enable kernel address space layout randomization (kASLR) was given, which has the same goal as ASLR, only with the idea in mind to randomize the kernel code location in memory when the system boots. Since kernel version 4.12 kASLR is enabled by default. The effectiveness of kASLR has been questioned quite a few times already and a variety of drawbacks are publicly known as of today. Nevertheless it adds a further hardening to the system and should not be dismissed that easily. I have added some references at the end for anyone interested in kASLR exploitation :) .Side note: Windows machines on the other hand have ASLR and kASLR enabled by default since the launch of Windows Vista in 2006 and work similar, but due to the differences in system design nuances of differences exist and cannot be covered in this paper but looked up in a detailed analysis issued by the CERT Institute.This makes clear that (k)ASLR and PIE solely rely on keeping the altered memory space secret to be effective.ASLR implementation - Diving into the Linux kernelWhat would a research article look like if we didn't dig into the implementations ;) . The kernel is huge and truly a work of geniuses, as a result I will and can just scratch on the surface of the implementations for this article. This enables us to focus on the relevant parts and keep the article a reasonable length. Again remember, this will be all Linux specific, so please keep that in mind :) .Note: We will mostly take a look at the current x86 implementation. Comparing the following to the other implementations is another topic!Randomizing a memory addressSo first of all how does the system get a randomized memory address in the available/valid address range? Luckily the kernel code is open source and (mostly :D ) documented! Let's take a look at the /drivers/char/random.c kernel file that exactly handles our needs:/** * randomize_page - Generate a random, page aligned address * @start: The smallest acceptable address the caller will take. * @range: The size of the area, starting at @start, within which the * random address must fall. * * If @start + @range would overflow, @range is capped. * * NOTE: Historical use of randomize_range, which this replaces, presumed that * @start was already page aligned. We now align it regardless. * * Return: A page aligned address within [start, start + range). On error, * @start is returned. */ unsigned long randomize_page(unsigned long start, unsigned long range) { if (!PAGE_ALIGNED(start)) { range -= PAGE_ALIGN(start) - start; start = PAGE_ALIGN(start); } if (start > ULONG_MAX - range) range = ULONG_MAX - start; range >>= PAGE_SHIFT; if (range == 0) return start; return start + (get_random_long() % range << PAGE_SHIFT); } Essentially what happens here is that in order to generate a random address randomize_page() takes two arguments: a start address and a range argument.After some initial page alignment magic what it ultimately comes down to is that it uses the get_random_long() function and applies a modulo to get a number between the supplied 'start' address within the offered 'range' value.ELF binary loadingIf the kernel is instructed to load an ELF binary a routine called load_elf_binary() is invoked. This one is located in /fs/binfmt_elf.c. Here a multitude of things happen. Lets take a quick look at these parts, which are responsible for the initialization of pointers memory, like the code, data and stack section.static int load_elf_binary(struct linux_binprm *bprm) { [...] if (!(current->personality & ADDR_NO_RANDOMIZE) && randomize_va_space) current->flags |= PF_RANDOMIZE; [...] /* Do this so that we can load the interpreter, if need be. We will change some of these later */ retval = setup_arg_pages(bprm, randomize_stack_top(STACK_TOP), executable_stack); [...] /* N.B. passed_fileno might not be initialized? */ current->mm->end_code = end_code; current->mm->start_code = start_code; current->mm->start_data = start_data; current->mm->end_data = end_data; current->mm->start_stack = bprm->p; if ((current->flags & PF_RANDOMIZE) && (randomize_va_space > 1)) { current->mm->brk = current->mm->start_brk = arch_randomize_brk(current->mm); #ifdef compat_brk_randomized current->brk_randomized = 1; We can see that if the randomize_va_space variable is higher than 1, and the PF_RANDOMIZE flag is set, the base address of brk() is randomized with the arch_randomize_brk() function. Furthermore the top of the stack gets some randomization treatment as well!brk() randomizationRecall: brk() changes the location of the program break, which defines the end of the process's data segment (i.e., the program breakis the first location after the end of the uninitialized data segment). Increasing the program break has the effect of allocating memory tothe process; decreasing the break de-allocates memory.The x86 implementation of the randomize_brk() function is located in /arch/x86/kernel/process.c:unsigned long arch_randomize_brk(struct mm_struct *mm) { return randomize_page(mm->brk, 0x02000000); } It randomizes the given address space by providing the current address with an additional range argument of 0x02000000 using the former randomize_page() routine!Stack randomizationThe stack randomization is started in the /fs/binfmt_elf.c as well. In particular in the load_elf_binary() we talked above already!static int load_elf_binary(struct linux_binprm *bprm) { [...] /* Do this so that we can load the interpreter, if need be. We will change some of these later */ retval = setup_arg_pages(bprm, randomize_stack_top(STACK_TOP), executable_stack); [...] In the end we have 2 components we have to take a look at here. First the setup_arg_pages() and then randomize_stack_top(). Let's start with the latter, since it's needed as a function argument for setup_arg_pages():[...] #ifndef STACK_RND_MASK #define STACK_RND_MASK (0x7ff >> (PAGE_SHIFT - 12)) /* 8MB of VA */ #endif static unsigned long randomize_stack_top(unsigned long stack_top) { unsigned long random_variable = 0; if (current->flags & PF_RANDOMIZE) { random_variable = get_random_long(); random_variable &= STACK_RND_MASK; random_variable <<= PAGE_SHIFT; } #ifdef CONFIG_STACK_GROWSUP return PAGE_ALIGN(stack_top) + random_variable; #else return PAGE_ALIGN(stack_top) - random_variable; #endif [...] } It takes the top of the stack as an address and returns a page aligned version of that address +/- some random variable. This random variable is obtained by calling get_random_long() and doing once again some further randomization by doing a bit-wise AND (&=) assignment with a defined STACK_RND_MASK and an additional left shift AND (<<=) assignment with a variable PAGE_SHIFT.Okay that was not all for the stack as we outlined just earlier.. The actual stack randomization will take place in /fs/exec.c and more specifically in the setup_arg_pages() routine:[...] /* * Finalizes the stack vm_area_struct. The flags and permissions are updated, * the stack is optionally relocated, and some extra space is added. */ int setup_arg_pages(struct linux_binprm *bprm, unsigned long stack_top, int executable_stack) [...] #ifdef CONFIG_STACK_GROWSUP /* Limit stack size */ stack_base = rlimit_max(RLIMIT_STACK); if (stack_base > STACK_SIZE_MAX) stack_base = STACK_SIZE_MAX; /* Add space for stack randomization. */ stack_base += (STACK_RND_MASK << PAGE_SHIFT); /* Make sure we didn't let the argument array grow too large. */ if (vma->vm_end - vma->vm_start > stack_base) return -ENOMEM; stack_base = PAGE_ALIGN(stack_top - stack_base); stack_shift = vma->vm_start - stack_base; mm->arg_start = bprm->p - stack_shift; bprm->p = vma->vm_end - stack_shift; #else stack_top = arch_align_stack(stack_top); stack_top = PAGE_ALIGN(stack_top); if (unlikely(stack_top < mmap_min_addr) || unlikely(vma->vm_end - vma->vm_start >= stack_top - mmap_min_addr)) return -ENOMEM; stack_shift = vma->vm_end - stack_top; bprm->p -= stack_shift; mm->arg_start = bprm->p; #endif [...] If the stack segment does not grow upwards, the kernel will use arch_align_stack() to pass the stack top address, which was an argument of the current function we are looking at. Then it will align the returned value and continue further stack setup. The alignment procedure again can be found back in /arch/x86/kernel/process.cunsigned long arch_align_stack(unsigned long sp) { if (!(current->personality & ADDR_NO_RANDOMIZE) && randomize_va_space) sp -= get_random_int() % 8192; return sp & ~0xf; } If the currently executed task has '''
