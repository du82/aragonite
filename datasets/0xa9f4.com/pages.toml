Entanglement When a pair of entangled partials are created they create a unique configuration of the universe."""
full_description = "Entanglement Is Space Only 2022.12.14 2022.12.14 286 2 mins Entanglement, Space Only Relations, and Black Hole Information Are entangled partials connected in space but not time, and if so is that how information escapes the event horizon of a black hole? Entanglement When a pair of entangled partials are created they create a unique configuration of the universe. In most configurations we experience information is carried though space-time as excitations of some field, higgs, electro magnetic, etc; but entangled partials seems to propagate information though space only and not time. We see this in the instantaneous nature of “spooky action at a distance” as well as the apparent back propagation of information thought time seen in the delayed choice quantum erasure experiments. What ever the relation that holds entangled partials together it seems to be one that interacts with spae but not time. Black Holes One interpretation of why escape is impossible from a black hole is that the the stretching of space to infinity stops the passage of time, and it is this stoppage of time that makes black holes a perfect trap. Hawking Radiation But black holes are not a perfect trap. If a pair of victual particles is instantiated at the event horizon, it is possible that one falls into the black hole and the other escapes into the universe. This results in the black hole loosing mass leading to it’s eventual evaporation. But these virtual particles are brought in to existence entangled, with one ending up inside and one outside the black hole. If entanglement is a cupping in space but not time, might it be possible that entangled partial inside the black hole can freely communicate information out to its sibling as their communicate is not trapped by stopped time? Author: Jonathan Moore Link: :///posts/entanglement-is-space-only/"
