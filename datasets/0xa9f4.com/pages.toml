full_description = "Penkesu 2024.11.3 2024.11.7 1134 6 mins I often find myself sitting and waiting for one thing or another. In these interstitial moments, I succumb to the impulse to consume ‘content.’ Instead, I would much rather be creating, but I find the device at hand, my phone, is designed only for consumption. Read More » Ai Is Not a Simulation 2023.11.22 2023.11.22 375 2 mins I was having a conversation with a group of AI researchers, and we eventually turned to the topic of whether AI is a simulation of human intelligence. I believe this view is incorrect and potentially dangerous. I think it’s more accurate to view our goal in AI as creating systems that are at least as capable as humans, though they will most likely operate very differently. Read More » LLMs Spring 2023 2023.4.23 2023.4.25 1557 8 mins LLMs and AI (Spring 2023) On March 14, 2023, GPT-4 was released, and the world entered a new era. Following this, there has been a frenzy of development in the AI space, with LLMs (Large Language Models) such as Alpaca, Bard, and many others. Read More » Memory Management 2023.2.26 2023.3.5 2558 13 mins Memory Management Colang intends to achieve high throughput and low latency using two strategies: static typing and dispatch, and efficient memory management. In this post we will review common approaches to memory management. The post is background for a later post describing memory management Colang. Read More » Why Colang 2023.2.26 2023.3.5 557 3 mins Why Colang There is a gap in the current popular progrmming languages. Most services are still written in high level languages from the 90’s. These languages were designed based on lessons and assumptions about computing thirty yeas ago. There is currently lots of innovation in programming language design, Rust, Swift, Kotlin, and Go have see lots of growth and are supported by large corporations. Read More »"
