description = '''19 Jun 2022 | Reading time: ~6 min HackTheBox - Paper [Easy] #CVE-2019-17671, #CVE-2021-3560, #Linux, #authorization-bypass, #credentials-reuse, #polkit-privesc, #rocket.chat, #wordpress Table of contents Resolution summary Improved skills Used tools Information Gathering Enumeration Port 80 - HTTP (Apache httpd 2.4.37 ((centos) OpenSSL/1.1.1k mod_fcgid/2.3.9)) office.paper - (wordpress 5.2.3) chat.office.paper (discovered exploiting Unauthenticated View Private/Draft Posts) Exploitation WordPress <= 5.2.3 - Unauthenticated View Private/Draft Posts (CVE-2019-17671) Exploiting recyclops features Privilege Escalation Local enumeration Polkit Privilege Escalation (CVE-2021-3560) Trophy Resolution summary A server response from the HTTP web server discloses a DNS that points to a Wordpress blog vulnerable to Unauthenticated View Private/Draft Posts (CVE-2019-17671) Exploiting the vulnerability we are able to leak restricted data, containing a secret registration token for RocketChat that allows us to create a custom user and access a restricted chat On RocketChat it is possible to exploit some insecure functionalities of a custom bot in order to leaks recyclops credentials and reuse them to access the machine as dwight The machine is vulnerable to Polkit Privilege Escalation (CVE-2021-3560). It is possible to create a custom sudoer account and thus escalate to root. Improved skills Enumeration and exploitations of leaked secrets Exploiting Wordpress known vulnerabilities Abusing intended features lacking of security controls Exploitation of Polkit Privilege Escalation Used tools nmap gobuster wpscan linpeas.sh Information Gathering Scanned all TCP ports: ┌──(kali㉿kali)-[~/CTFs/HTB/B2R/Paper] └─$ sudo nmap -sS -p- 10.10.11.143 -v -oN scan/all-tcp-ports.txt [sudo] password for kali: Starting Nmap 7.92 ( https://nmap.org ) at 2022-05-07 17:24 EDT Initiating Ping Scan at 17:24 Scanning 10.10.11.143 [4 ports] ... PORT STATE SERVICE 22/tcp open ssh 80/tcp ope