description = '''20 Aug 2022 | Reading time: ~15 min HackTheBox - Timelapse [Easy] #.pfx-files, #LAPS, #Windows, #anonymous-smb, #cracking-pfx-files, #cracking-zip-files, #credentials-in-LAPS, #credentials-in-history, #weak-credentials Table of contents Resolution summary Improved skills Used tools Information Gathering Enumeration Port 139 & Port 445 - NetBios & SMB Extract .crt and .key files from .pfx file: Port 389 & Port 636 - LDAP Port 88 - Kerberos Exploitation Login using leaked keys Privilege Escalation Local enumeration as legacyy Login as svc_deploy using leaked credentials Local enumeration as svc_deploy: Trophy Resolution summary Accessing a public SMB share through a null session it was possible to discover a crypted zip containing a .pfx file Cracking the .pfx file it was possible to obtain Legacyy’s private key and certificate, providing a low privilege access to the box using winrm Local enumeration allowed to discover svc_deploy’s credentials inside the powershell history file svc_deploy was able to access credentials contained inside LAPS (Local Administrator Password Solution), discovering the Administrator password Improved skills Manage and decrypt .pfx files Enumerating LAPS (Local Administrator Password Solution) Used tools nmap smbmap zip2john pfx2john john openssl evil-winrm Information Gathering Scanned all TCP ports: ┌──(kali㉿kali)-[~/CTFs/HTB/B2R/Timelaps] └─$ sudo nmap -sS -p- 10.10.11.152 -v -oN scan/all-tcp-ports.txt ... Not shown: 65520 filtered tcp ports (no-response) PORT STATE SERVICE 53/tcp open domain 88/tcp open kerberos-sec 135/tcp open msrpc 139/tcp open netbios-ssn 389/tcp open ldap 445/tcp open microsoft-ds 464/tcp open kpasswd5 593/tcp open http-rpc-epmap 636/tcp open ldapssl 5986/tcp open wsmans 9389/tcp open adws 49667/tcp open unknown 49673/tcp open unknown 49674/tcp open unknown 49696/tcp open unknown Read data files from: /usr/bin/../share/nmap Nmap done: 1 IP address (1 host up) scanned in 156.31 seconds Raw packets 