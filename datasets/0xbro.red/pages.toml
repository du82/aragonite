ss of an involved party to address it. Delays (not exceeding 15 days) to the disclosure date can be agreed upon following a fix to give customers time to install the appropriate patches. In respect of the researcher and the time invested, the affected party is strongly encouraged to appropriately acknowledge and give credit to the reporter who submitted the issue. If you have any questions about this policy, please contact me."
