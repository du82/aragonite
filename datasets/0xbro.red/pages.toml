description = "04 Sep 2022 | Reading time: ~15 min HackTheBox - Noter [Medium] #CKEditor, #Linux, #MySQL, #MySQL-privesc, #RCE, #UDF-privesc, #authentication-bypass, #code-review, #command-injection, #flask, #flask-session-cookie-bruteforce, #hardcoded-credentials, #insecure-credentials, #md-to-pdf, #python-coding, #user-enumeration"
full_description = '''.time { text-align: center; margin-top: 30px; font-family: 'Open Sans', sans-serif; font-weight: 300; font-style: normal; } 04 Sep 2022 | Reading time: ~15 min HackTheBox - Noter [Medium] #CKEditor, #Linux, #MySQL, #MySQL-privesc, #RCE, #UDF-privesc, #authentication-bypass, #code-review, #command-injection, #flask, #flask-session-cookie-bruteforce, #hardcoded-credentials, #insecure-credentials, #md-to-pdf, #python-coding, #user-enumeration Table of contents Resolution summary Improved skills Used tools Information Gathering Enumeration Port 21 - FTP (vsftpd 3.0.3) Port 5000 - HTTP (Werkzeug httpd 2.0.2 (Python 3.8.10)) Stored XSS vulnerability (CVE-2021-33829): User Enumeration Exploitation Brute-forcing secret key used to generate cookies: Enumerate secret notes Accessed FTP using leaked credentials Arbitrary Code Injection Privilege Escalation Local enumeration MySQL 4.x/5.0 (Linux) - User-Defined Function (UDF) Dynamic Library (2) Trophy Resolution summary The web application used different error messages when trying to login with existing users, allowing to enumerate usernames and discover blue. The session cookie provided to authenticated users was signed using a weak secret. It was possible to bruteforce it and sign arbitrary cookie, impersonating any existing user (blue) Enumerating blue’s notes it was possible to discover its credentials and access FTP. Inside its notes it was also possible to discover the ftp_admin user Inside FTP a documents containing password policy was discovered and it was possible to guess ftp_admin credentials. Accessing FTP as ftp_admin it was possible to discover two backups of the web application. Code review allowed to identify some command injection vulnerabilities contained within the /export_note_remote and /export_note_local/<string:id>, allowing to execute arbitrary commands and obtain a shell as svc Using hardcoded credentials from the backup files it was possible to access MySQL with high privileges a