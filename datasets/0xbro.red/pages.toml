full_description = '''.time { text-align: center; margin-top: 30px; font-family: 'Open Sans', sans-serif; font-weight: 300; font-style: normal; } 02 Jun 2022 | Reading time: ~10 min HackTheBox - AdmirerToo [Hard] #Adminer #CVE-2020-35476 #CVE-2021-21311 #CVE-2021-25294 #CVE-2021-32749 #Linux #OpenCats #OpenTSDB #RCE #SSRF #authentication-bypass #credentials-reuse #exploit-chain #fail2ban #hardcoded-credentials #insecure-DB-grants #insecure-credentials #php-deserialization #port-forwarding #whois-spoofing #B2R #Hard Table of contents Resolution summary Improved skills Used tools Information Gathering Enumeration Port 80 - HTTP (Apache httpd 2.4.38 ((Debian))) db.admirer-gallery.htb (Adminer 4.7.8) Exploitation Adminer 4.7.8 Server Side Request Forgery - CVE-2021-21311 OpenTSDB 2.4.0 Remote Code Execution - CVE-2020-35476 Known vulnerability for OpenTSDB 2.4.0: Lateral Movement to jennifer Local enumeration Privilege Escalation Local Enumeration Port 8080 - HTTP Enumerated other services OpenCATS PHP Object Injection to Arbitrary File Write - CVE-2021-25294 RCE vulnerability in mailing action using mailutils (mail-whois) Trophy Resolution summary Web server enumeration allows to identify admirer-gallery.htb and subdomain enumeration allows to identify db.admirer-gallery.htb db.admirer-gallery.htb is vulnerable to Server Side Request Forgery (CVE-2021-21311) and allows to scan and retrieve information from internal services, including OpenTSDB running on port 4242 OpenTSDB 2.4.0 is vulnerable to Remote Code Execution (CVE-2020-35476) but PoC does not work as it is, so further enumeration through service API is required to make it work and obtain a shell as opentsdb Local enumeration reveals old MySQL credentials inside a configuration file that can be reused to escalate to jennifer Local service enumeration reveals a local port 8080 that can be forwarded remotely using ssh and runs a version of OpenCats vulnerable to PHP Object Injection (CVE-2021-25294) Local enumeration reveals other MySQL credentials that can be used to access opencats DB Opencat login form cannot be bypassed and admin’s credentials extracted from the user table cannot be cracked, however cats user has full grants on cats_dev DB, allowing to overwrite admin credentials and login. Local enuemration reveals that fail2ban is installed on the machine and is vulnerable to Remote Code Execution (CVE-2021-32749) PHP Code Injection and fail2ban Remote Code Execution can be chained together in order to write an arbitrary whois.conf and trick the server into using our machine as whois server. Once contacted, a script can be sent able to trigger the RCE in fail2ban during the sending of the notification emails. Improved skills Exploit SSRF to enumerate and attack internal servers Chain multiple vulnerabilities Used tools nmap gobuster Public PoC ssh (port forwarding) phpggc nc Information Gathering Scanned all TCP ports: $ sudo nmap -p- admirertoo.htb -sS -oN scan/all-tcp-ports.txt -v PORT STATE SERVICE 22/tcp open ssh 80/tcp open http 4242/tcp filtered vrml-multi-use 16010/tcp filtered unknown 16030/tcp filtered unknown Enumerated open TCP ports: ┌──(kali㉿kali)-[~/CTFs/HTB/B2R/AdmirerToo] └─$ sudo nmap -p22,80,4242,16010,16030 admirertoo.htb -sT -sV -sC -oN scan/open-tcp-ports.txt Starting Nmap 7.92 ( https://nmap.org ) at 2022-04-23 11:01 EDT Nmap scan report for admirertoo.htb (10.10.11.137) Host is up (0.036s latency). PORT STATE SERVICE VERSION 22/tcp open ssh OpenSSH 7.9p1 Debian 10+deb10u2 (protocol 2.0) | ssh-hostkey: | 2048 99:33:47:e6:5f:1f:2e:fd:45:a4:ee:6b:78:fb:c0:e4 (RSA) | 256 4b:28:53:64:92:57:84:77:5f:8d:bf:af:d5:22:e1:10 (ECDSA) |_ 256 71:ee:8e:e5:98:ab:08:43:3b:86:29:57:23:26:e9:10 (ED25519) 80/tcp open http Apache httpd 2.4.38 ((Debian)) |_http-title: Admirer |_http-server-header: Apache/2.4.38 (Debian) 4242/tcp closed vrml-multi-use 16010/tcp filtered unknown 16030/tcp filtered unknown Service Info: OS: Linux; CPE: cpe:/o:linux:linux_kernel Service d