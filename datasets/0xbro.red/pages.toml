["https://0xbro.red/disclosures/disclosed-vulnerabilities/digital-private-vault"]
title = "Digital Private Vault (APK) | 0xbro"
description = "A summary/assay for the article"
full_description = '''.time { text-align: center; margin-top: 30px; font-family: 'Open Sans', sans-serif; font-weight: 300; font-style: normal; } 29 Jun 2023 | Reading time: ~10 min Digital Private Vault (APK) Subverting an (in)secure Android vault #android #digital-private-vault This article presents the analysis of Digital Private Vault Android application, highlighting some bad practices and vulnerabilities in the product that can be exploited to completely subvert the purpose of the vault, finally exposing the secrets stored inside it. Product details Application Digital Private Vault Official website www.digitalprivatevault.com Company Techuz Version 1.6 Downloads 10K+ Package com.techuz.privatevault Min. Android version 5.0 (API level 21) Table of contents Introduction Information gathering AndroidManifest.xml Internal folder structure Vulnerabilities Cleartext storage of sensitive information Cleartext transmission of sensitive information Sensitive data leakage in log files Premium feature unlock (insecure authorization) Arbitrary file interaction using an exported content provider Other general misconfiguration Conclusion Disclosure Timeline Introduction It is well known that Google Play does not verify applications uploaded to the store, making it quite common to run into apps that are supposed to ensure user security and privacy, but actually do anything but that. Some of these applications even have to be purchased or require the user to pay for the full version. While I was looking for some of these applications, I came across Digital Private Vault. Quoting the official description of the application: Digital Private Vault is a simple yet smart private photo vault app that allows you to hide all your personal data in one place. […] Digital Private Vault will work as your vault app for your Android phone and tablet that safeguards your personal data. Among the most important features, Digital Private Vault allows its users to store their images, videos, and notes inside multiple private areas, each one protected with a common 4-digit PIN (mmmmh…) and a folder-specific password. It is also important to notice that some features are currently broken because the back-end server (52.15.243.62) has been compromised at some point in the past 1 but never repaired: $ mongo 52.15.243.62 MongoDB shell version v6.0.1 connecting to: mongodb://52.15.243.62:27017/test?compressors=disabled&gssapiServiceName=mongodb Implicit session: session { "id" : UUID("0b3b883d-448b-4246-bd95-6b4b060a4c16") } MongoDB server version: 4.0.12 ... > show dbs; READ__ME_TO_RECOVER_YOUR_DATA 0.000GB admin 0.000GB angularfullstack 0.000GB config 0.000GB > use READ__ME_TO_RECOVER_YOUR_DATA switched to db READ__ME_TO_RECOVER_YOUR_DATA > show collections; README > db.README.find() { "_id" : ObjectId("6488e1bdcfa44d6e4a22abf2"), "content" : "All your data was backed up. You need to email us at rambler+1rhcl@onionmail.org to recover your data. (more information: go to https://cutt.ly/recdb1) ALLWAYS CHECK YOUR SPAM FOLDER! OR YOU MAY MISS OUR MAILS If you dont answer we will leak and expose all your data and in 48hs delete it forever from our server." } Information gathering The application has been tested using a rooted Android 10 emulator (read How to set up an Android Penetration Testing Lab from scratch 2 for more details about the configuration). .\sdkmanager.bat --install "system-images;android-29;google_apis;x86" .\avdmanager.bat --verbose create avd --force --name "generic_api29_google_apis_emulator" --package "system-images;android-29;google_apis;x86" --tag "google_apis" --abi "x86" .\emulator.exe -avd generic_28 To get a quick overview of the application, we scanned the APK with MobSF 3, which reported the following high-level summary with lots of other details: By decompiling the application with jadx-gui 4 we noticed that the source code was not obfuscated at all, helping us a lot with the analysis. AndroidManifest.xml From the AndroidManifest.xml file we can extract some very interesting information (detected also with MobSF). The application uses clear-text traffic: <application android:theme="@style/AppTheme" ... android:name="com.techuz.privatevault.PrivateVaultApp" android:allowBackup="false" ... android:usesCleartextTraffic="true" ... > MobSF finding There are two components explicitly exported 5: <provider android:name="com.techuz.privatevault.widget.ContentProviders.MyFileContentProvider" android:enabled="true" android:exported="true" android:authorities="com.techuz.privatevault"/> ... <activity android:name="com.facebook.CustomTabActivity" android:exported="true"> <intent-filter> <action android:name="android.intent.action.VIEW"/> <category android:name="android.intent.category.DEFAULT"/> <category android:name="android.intent.category.BROWSABLE"/> <data android:scheme="fbconnect" android:host="cct.com.techuz.privatevault"/> </intent-filter> </activity> MobSF finding There is one component implicity exported 6: <receiver android:name="com.techuz.privatevault.service.MyBroadcastReceiver"> <intent-filter> <action android:name="serviceEnds"/> </intent-filter> </receiver> MobSF finding Internal folder structure The initial folder structure immediately after installing the application is as follows: generic_x86:/ # ls -al /data/data/com.techuz.privatevault/ total 44 drwx------ 4 u0_a155 u0_a155 4096 2023-06-13 14:34 . drwxrwx--x 182 system system 8192 2023-06-13 14:34 .. drwxrws--x 2 u0_a155 u0_a155_cache 4096 2023-06-13 14:34 cache drwxrws--x 2 u0_a155 u0_a155_cache 4096 2023-06-13 14:34 code_cache lrwxrwxrwx 1 root root 70 2023-06-13 14:34 lib -> /data/app/com.techuz.privatevault-m5oxNSMIZSbq3NXMMvdXFg==/lib/x86 generic_x86:/data/data/com.techuz.privatevault # find . ./cache ./code_cache ./lib After starting the application for the first time and setting up email and pin, the folder structure becomes the one below: generic_x86:/ # ls -al /data/data/com.techuz.privatevault/ total 68 drwx------ 7 u0_a155 u0_a155 4096 2023-06-13 14:36 . drwxrwx--x 182 system system 8192 2023-06-13 14:34 .. drwxrws--x 2 u0_a155 u0_a155_cache 4096 2023-06-13 14:34 cache drwxrws--x 2 u0_a155 u0_a155_cache 4096 2023-06-13 14:34 code_cache drwxrwx--x 2 u0_a155 u0_a155 4096 2023-06-13 14:36 databases drwxrwx--x 3 u0_a155 u0_a155 4096 2023-06-13 14:36 files lrwxrwxrwx 1 root root 70 2023-06-13 14:34 lib -> /data/app/com.techuz.privatevault-m5oxNSMIZSbq3NXMMvdXFg==/lib/x86 drwxrwx--x 2 u0_a155 u0_a155 4096 2023-06-13 14:36 shared_prefs generic_x86:/data/data/com.techuz.privatevault # find . ./cache ./code_cache ./lib ./files ./files/.com.google.firebase.crashlytics ./files/.com.google.firebase.crashlytics/log-files ./files/.com.google.firebase.crashlytics/log-files/crashlytics-userlog-648862BF028B0001300D8713FF69C011.temp ./files/.com.google.firebase.crashlytics/report-persistence ./files/.com.google.firebase.crashlytics/report-persistence/sessions ./files/.com.google.firebase.crashlytics/report-persistence/sessions/648862BF028B0001300D8713FF69C011 ./files/.com.google.firebase.crashlytics/report-persistence/sessions/648862BF028B0001300D8713FF69C011/report ./files/.com.google.firebase.crashlytics/report-persistence/sessions/648862BF028B0001300D8713FF69C011/start-time ./files/.com.google.firebase.crashlytics/com.crashlytics.settings.json ./files/generatefid.lock ./files/PersistedInstallation.W0RFRkFVTFRd+MTo1Nzk3OTA4MDI0ODM6YW5kcm9pZDozMGNkMjJjMTU4MDVjNDRlY2M5ZDQ2.json ./shared_prefs ./shared_prefs/com.facebook.sdk.appEventPreferences.xml ./shared_prefs/com.google.android.gms.measurement.prefs.xml ./shared_prefs/com.google.firebase.crashlytics.xml ./shared_prefs/FirebaseAppHeartBeat.xml ./shared_prefs/com.techuz.privatevault_preferences.xml ./shared_prefs/PV.xml ./databases ./databases/com.google.android.datatransport.events ./databases/com.google.android.datatransport.events-journal ./databases/google_app_measurement_local.db ./databases/google_app_measurement_local.db-journal Vulnerabilities Cleartext storage of sensitive information The product stores sensitive information in cleartext within a resource that might be accessible to another control sphere. The first thing I did after setting up the vault was search for hardcoded secrets inside the application folder. In our case, the PIN, the personal email, and the password were good candidates, so I started grepping for those, discovering that they are stored as they are, without any encryption or protection. The user’s email, as well as the PIN, are stored within /shared_prefs/PV.xml: generic_x86:/data/data/com.techuz.privatevault # grep -r "1234" . ./shared_prefs/PV.xml: <string name="PASSCODE">1234</string> generic_x86:/data/data/com.techuz.privatevault # grep -r "0xbro.red" . ./shared_prefs/PV.xml: <string name="PV_EMAIL">0xbro.red@yopmail.com</string> generic_x86:/data/data/com.techuz.privatevault # cat ./shared_prefs/PV.xml <?xml version='1.0' encoding='utf-8' standalone='yes' ?> <map> <string name="PV_EMAIL">0xbro.red@yopmail.com</string> <string name="PASSCODE">1234</string> </map> Album’s passwords, instead, are stored inside an SQLite database: generic_x86:/data/data/com.techuz.privatevault # grep -r "s3cr3t!" . Binary file ./databases/MyDBName.db matches 1|generic_x86:/data/data/com.techuz.privatevault # sqlite3 ./databases/MyDBName.db SQLite version 3.22.0 2018-12-19 01:30:22 Enter ".help" for usage hints. sqlite> .tables Files SubDirectory android_metadata Notes sqlite> select * from SubDirectory; 1|1|Secret Album|/data/user/0/com.techuz.privatevault/app_privateVault/images/Secret Album|s3cr3t! After finding out how the application saved pins and passwords, I wondered how “secret” pictures and notes were saved. I imported an image into an album, created a new note, and started searching in the same way as I did before. The folder structure now looks like this: generic_x86:/data/data/com.techuz.privatevault # ls -al total 92 drwx------ 10 u0_a156 u0_a156 4096 2023-06-13 14:58 . drwxrwx--x 182 system system 8192 2023-06-13 14:41 .. drwxrwx--x 4 u0_a156 u0_a156 4096 2023-06-13 14:58 app_privateVault drwxrwx--x 2 u0_a156 u0_a156 4096 2023-06-13 14:43 app_textures drwx------ 3 u0_a156 u0_a156 4096 2023-06-13 14:43 app_webview drwxrws--x 5 u0_a156 u0_a156_cache 4096 2023-06-13 14:58 cache drwxrws--x 2 u0_a156 u0_a156_cache 4096 2023-06-13 14:41 code_cache drwxrwx--x 2 u0_a156 u0_a156 4096 2023-06-13 14:58 databases drwxrwx--x 3 u0_a156 u0_a156 4096 2023-06-13 14:43 files lrwxrwxrwx 1 root root 70 2023-06-13 14:41 lib -> /data/app/com.techuz.privatevault-9Z6nlf_ZcpzYg8akloQUYQ==/lib/x86 drwxrwx--x 2 u0_a156 u0_a156 4096 2023-06-13 16:11 shared_prefs Photos and videos imported inside the vault are simply stored within app_privateVault without any kind of protection: generic_x86:/data/data/com.techuz.privatevault # find app_privateVault/ app_privateVault/ app_privateVault/images app_privateVault/images/Secret Album app_privateVault/images/Secret Album/1686661132501.jpg app_privateVault/images/Secret Album/1686661147557.jpg app_privateVault/images/Secret Album/1686661447174.jpg app_privateVault/videos Notes, on the other hand, are saved in the same SQLite file (MyDBName.db) where we found album passwords: 1|generic_x86:/data/data/com.techuz.privatevault # grep -r secret . Binary file ./databases/MyDBName.db matches 1|generic_x86:/data/data/com.techuz.privatevault # sqlite3 ./databases/MyDBName.db SQLite version 3.22.0 2018-12-19 01:30:22 Enter ".help" for usage hints. sqlite> select * from notes; 1|Find me if you can.|This is a secret notes that should not be read by anyone|2023-06-13 03:57:17 PM Looking at the strings.xml file, you can also find some hardcoded API key: $ cat privateVault/res/values/strings.xml ... <string name="google_api_key">AIzaSyDth7hjwe8p-redacted-</string> <string name="google_app_id">1:579790802483:android:30cd22c15805c44ecc9d46</string> <string name="google_crash_reporting_api_key">AIzaSyDth7hjwe8p-redacted-</string> <string name="google_storage_bucket">digital-private-vault.appspot.com</string> ... Cleartext transmission of sensitive information The product transmits sensitive or security-critical data in cleartext in a communication channel that can be sniffed by unauthorized actors. The application allows users to get forgotten PINs or passwords through their email. That information, however, is communicated to the server using an unencrypted channel (as for all other communications to the server), exposing them to third parties. The application first checks that the email is the same as the one used by the user during registration (stored locally inside shared_prefs/PV.xml): private boolean inputValidation(String email) { if (email.isEmpty()) { this.et_email.setError("Email is required"); this.et_email.requestFocus(); return false; } else if (!Patterns.EMAIL_ADDRESS.matcher(email).matches()) { this.et_email.setError("Invalid email"); this.et_email.requestFocus(); return false; } else if (Utility.getStringPreference(this, Constants.PREF_KEY_EMAIL, "").equals(email)) { return true; } else { Toast.makeText(this, "Entered email does not match to registered email", 0).show(); return false; } } Then it sends the HTTP POST request to the server (52.15.243.62:3000) containing the private information within the body: public void callForgotPasswordApi(String email) { showProgressDialog(this); APIService client = getClient(Constants.BASE_URL); HashMap hashMap = new HashMap(); hashMap.put("email", email); if (this.albumName != null && this.albumPasscode != null) { Log.d("AlbumName", "********** AlbumName : " + this.albumName + " **************************"); Log.d("Passcode", "********** Passcode : " + this.albumPasscode + " **************************"); hashMap.put("album_name", this.albumName); hashMap.put("passcode", this.albumPasscode); hashMap.put("device_name", Utility.getDeviceName()); hashMap.put("device_os", "Android"); try { hashMap.put("app_version", getPackageManager().getPackageInfo(getPackageName(), 0).versionName); } catch (PackageManager.NameNotFoundException e) { e.printStackTrace(); } Log.e("", "device_name:" + Utility.getDeviceName()); try { Log.e("", "app_version:" + getPackageManager().getPackageInfo(getPackageName(), 0).versionName); } catch (PackageManager.NameNotFoundException unused) { } } else { String string = getSharedPreferences(Constants.NOTIFICATION_CHANNEL_ID, 0).getString("PASSCODE", ""); Log.d("Passcode", "********** Passcode : " + string + " **************************"); hashMap.put("passcode", string); hashMap.put("device_name", Utility.getDeviceName()); hashMap.put("device_os", "Android"); try { hashMap.put("app_version", getPackageManager().getPackageInfo(getPackageName(), 0).versionName); } catch (PackageManager.NameNotFoundException e2) { e2.printStackTrace(); } Log.e("", "device_name:" + Utility.getDeviceName()); try { Log.e("", "app_version:" + getPackageManager().getPackageInfo(getPackageName(), 0).versionName); } catch (PackageManager.NameNotFoundException '''
