description = "Or in Russian; Позор Российскому руководству! Цензура это полный бред."
full_description = "Russia, shame on you! Censorship is lame. 2018-04-19 20:13:35 +0200 - Written by Mikal Villa Or in Russian; Позор Российскому руководству! Цензура это полный бред. NOTE: In the bottom, this text is translated into Russian by orignal from I2Pd. Thanks to him. I barely knows a word Russian myself. Before, I kind of respected you, as the gov. - But now you totally lost me. Anyway, I’m deeply invovled in the I2P project these days. And saw a way to help poor russian citicens reaching Telegram even their government is totally fucked up. Long live the internet! To answer Russia’s block on Telegram, I introduce you the I2P Telegram bundle. It’s for non technical people it’s using the I2P router to create a hidden tunnel outside of the Russia’s answer of the great wall of China. Here is a screenshot of the first working bundle I put up: For impationt people like me, please remember that I2P isn’t exactly the same as the Tor project which you might have heard about. I2P handles the bootstrap way somewhat much more desentralised, and therefore uses longer time to bootstrap the first run you do - or if it’s a long time since last time. In general, the more your i2pd process run, the better and more stable it will be. A common thing to see in a such case is shown in the picture bellow. If you get that, please note it’s then a perfect time to take a cup of tea, caffe or a weed joint. Going the China way isn’t the option, can’t stop saying that.. Anyway, for more technical interested people, it’s just a simple bat script that launches a pre configured i2pd daemon to run in background - while it also launches the Telegram portable binary, which is preconfigured to use the SOCKSv5 proxy that the i2pd daemon will provide. No more magic than that. I2P Telegram Bundle v0.1alpha Meeh’s mirror: https://furu1.censorship.help/I2P-Telegram/ Dropbox Mirror: https://www.dropbox.com/sh/wf4o39xtnzpv2uq/AAB3guCOeORX48Vf9jCSXvesa?dl=0 Google Drive Mirror: https://drive.google.com/open?id=1XsIEQaTj0Qnh3OFCSUx8UdbAPV8n5-gb Github Mirror: https://github.com/mikalv/UnblockTelegramInRussia/releases/tag/v0.1a ——– Russian translation ——— Позор Российскому руководству! Цензура это полный бред. Ранее, я относился к вам с уважением, как к правительству. Но не в данном случае. Я занимаюсь I2P давно и серьезно. И вижу способ помочь бедным россиянам с доступом в телеграм, несмотря на действия правительства в этом направлении. Они вполне могут меня заказать, ну и что? Настоящая долгая жизнь - это Интернет. В ответ на блокировку Телеграма, я хочу предложить сборку Телеграма с I2P, для обычных пользователей. Объясняя на пальцах, здесь создается скрытый тоннель через I2P за пределы российского аналога “Золотого щита” (Великий китайский файрвол. - прим.пер.). Как это выглядит на практике: Для нетерпеливых людей, типа меня, запомните: I2P это ни разу не Tor. I2P стартует с более децентрализованной сети, и потому требует больше времени на запуск в первый раз. Однако, чем дольше i2pd работает, тем лучше и стабильнее становится доступ. Как правило, вы увидите у себя примерно то что на картинке ниже. Если это так, то у вас есть возможность сходить выпить чашечку чая или кофе. Не устаю повторять, что попытка идти китайским путем - не лучшее решение. Для понимающих людей, технически - это простой батник, запускаюший сконфигурированный i2pd демон в фоновом режиме, а затем, и Телеграм, с заданным настройками для работы через SOCKSv5 прокси, обеспечиваемый i2pd. Короче говоря - никакой магии. I2P Telegram Bundle v0.1alpha Meeh’s mirror: https://furu1.censorship.help/I2P-Telegram/ Dropbox Mirror: https://www.dropbox.com/sh/wf4o39xtnzpv2uq/AAB3guCOeORX48Vf9jCSXvesa?dl=0 Google Drive Mirror: https://drive.google.com/open?id=1XsIEQaTj0Qnh3OFCSUx8UdbAPV8n5-gb Github Mirror: https://github.com/mikalv/UnblockTelegramInRussia/releases/tag/v0.1a Tags: crypto-and-math Updated: April 19, 2018 Previous Next"
