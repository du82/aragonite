["https://0xeb.net/2019/03/daenerys-ida-pro-and-ghidra-interoperability-framework"]
title = "Daenerys: IDA Pro and Ghidra interoperability framework | Shortjump!"
description = "Ghidra has only been released for a short while and the RCE community started adopting it (scripts, tutorials, articles, etc.) really quick. Since Ghidra is free and open-source (coming soon™), I e…"
full_description = "Daenerys: IDA Pro and Ghidra interoperability framework March 18, 2019 elias Ghidra, Reverse Engineering Ghidra has only been released for a short while and the RCE community started adopting it (scripts, tutorials, articles, etc.) really quick. Since Ghidra is free and open-source (coming soon™), I expect a torrent of contributions in the form of tools, plugins and scripts. I think it is important not to create a schism between IDA users and new Ghidra users because that will not benefit the RCE community. For that reason, I think it would be cool to have a simple way to seamlessly run scripts between the two SRE frameworks. Today I introduce the Daenerys framework that lets you run IDA scripts in Ghidra and vice versa. Since I am a long term IDA user, it is easier for me to start writing the IDA-to-Ghidra adapters first. As time goes by, I will become more familiar with Ghidra’s APIs and will be able to write the adapters that let users run Ghidra scripts seamlessly in IDA as well. If you have watched the Game of Thrones show, you are perhaps familiar with Daenerys Targaryen (aka “The mother of dragons”). I chose her name for this project because IDA’s logo is represented by a certain medieval lady and Ghidra by a dragon (some say from the GodZilla lore / King Ghidorah). Having the Daenerys framework’s logo as a lady and a dragon standing on equal footing represents a harmonious relationship between the two. If you are a graphics designers, I would appreciate it if you can create a logo for the framework better than the one I found using Bing.com’s public domain image search. The Daenerys framework is still in its infancy and your contributions/suggestions are welcome. Finally, I hope the RCE community continues to strive and becomes more accessible to everyone interested in the field. Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related"
