title = "About | Shortjump!"
description = "Hi there, My name is Elias Bachaalany, hence the @0xeb nickname which is also the opcode for the short jump instruction on the Intel x86 architecture. I also go by the nickname lallousx86. It is ap…"
full_description = "About Hi there, My name is Elias Bachaalany, hence the @0xeb nickname which is also the opcode for the short jump instruction on the Intel x86 architecture. I also go by the nickname lallousx86. It is apparent now that I really like the Intel x86 assembly language, it was my first low level language, after learning Pascal and C. I am a long time IDA Pro user and an ex-employee of Hex-Rays. You can see some of my blog posts at hexblog.com. I am the founder of PassingTheKnowledge, a one man self-publishing company. So far, I have co-authored two books: Practical Reverse Engineering The Antivirus Hacker’s Handbook …and published my first book “Batchography: The Art of Batch files Programming” with PassingTheKnowledge as a minimal viable product. As it turned out, the book was more than a prototype and I am very proud and happy with it. I am positive and excited to work on more books and self-publishing them in the future. All the articles on this site cannot be distributed, printed, modified or copied without prior permission from the author. Stay tuned!"
