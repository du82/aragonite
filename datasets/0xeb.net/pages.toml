description = "The Lichking challenge I created this challenge for the Blizzard 2017 CTF competition that took place on 11/05/2017 in the eSports Arena in Santa Ana, Orange County, CA. ( After the CTF event was o…"
full_description = 'Blizzard CTF 2017 – The LichKing Reverse Engineering challenge walkthrough February 15, 2018September 14, 2018 elias Uncategorizedblizzard, challenge, ctf, idapython, king The Lichking challenge Challenge demo. Click on the picture to enlarge it. I created this challenge for the Blizzard 2017 CTF competition that took place on 11/05/2017 in the eSports Arena in Santa Ana, Orange County, CA. (https://ctftime.org/event/487). After the CTF event was over, I decided to release it to public and see who can crack it. This challenge is inspired by the picture password login feature from Windows 8. When you run the challenge, you will be presented with a picture. Your goal is guess what are the 4 secret coordinates (hidden spots) in the picture that you should be clicking using the correct sequence. Once guessed correctly, a congratulatory message box is displayed. If you fail to guess the right 4 points coordinates, then you will see an error message. This is a pure reverse engineering puzzle and therefore you won’t find any obfuscation or anti-debugging/reverse engineering tricks whatsoever. In the challenge, I left a bunch of hints to make it easy for others to solve the puzzle. Nonetheless, taking the brute-force approach leads to uncovering the hidden message, however this is not the proper solution I am expecting from participants. Table of contents How to use Challenge goals Getting started Inspecting the managed code Inspecting the native code Coordinate verification algorithm Understanding the hashing function Detecting the hidden spots in the picture Guessing the right points sequence Challenge goals revisited Other solutions How to use Download the challenge from here Unzip and run BlizzardLichKing.exe There are 4 hidden spots in the image Click on the image 4 times at random locations (click sequence makes a big difference) If you find the correct sequence you will get a nice message congratulating you Note: You might need to download the Visual Studio C++ 2017 redistributable package from here. Challenge goals When the challenge was released, I provided 5 questions that can be answered as you make progress: What’s the general idea about the challenge and how it works behind the scene? What are the approximate locations / coordinates and their proper sequence that lead to successfully unscrambling the hidden message? If you were given another binary with different coordinates and secret message, can you generically crack it (or at least with little efforts and manual intervention)? Any cool stuff you appreciated in the challenge or any other things that were not directly obvious? Did you find any Easter eggs or hints in the binary? Important note: revealing the hidden message without giving the coordinate sequence is an acceptable solution but not the preferred one. Walkthrough I am aware that there are multiple ways to approach and solve this challenge, however I will show you the solution that fulfills all of the 5 challenge goals above. Getting started My favorite tools for most RE tasks is IDA Pro. Let’s load the binary in IDA and see what we get: IDA detected two possible ways to load the file: .NET assembly file PE64 file From this we can conclude that this is a mixed mode C++ program. It contains both managed (MSIL) and native code. In a mixed mode program, the .NET managed code executes first, therefore let’s load the file as a .NET assembly and see what we get: Unless you are a .NET IL assembly language expert, it is better to use one of the free .NET decompilers (such as Telerik’s JustDecompile or dnSpy for instance). Inspecting the managed code In this section, we will take a look at the decompiled C# code. Let’s find the main() function in the decompiled output of dnSpy by expanding the “{}-” node and then the “<Module>” node where the main function is found: internal static int main(string[] args) { <Module>.FreeConsole(); MyForm frm = new MyForm(); int i = 0; if (0 < args.Length) { do { if (args[i] == "WhereAmI") { frm.ShowCoords = true; } else if (args[i] == "ShowItToMe") { frm.ShowFirstPoint = true; } else if (args[i] == "Cred1ts") { MessageBox.Show("This challenge has been created by Elias Bachaalany @0xeb!"); } i++; } while (i < args.Length); } Application.Run(frm); return 0; } From the code above, we learn that there are 3 secret command line arguments: WhereAmI, ShowItToMe and Cred1ts. Let’s now dive into the MyForm code and see how the ShowCoords and ShowFirstPoint boolean member variables are used. The ShowCoords variable seems to display the mouse coordinates in the form’s title. This is useful for precision clicking / remembering the exact coordinates where you clicked as you debug the code: private void pictureBox1_MouseMove(object sender, MouseEventArgs e) { if (this.ShowCoords) { this.Text = string.Format("{0} - {1} {2}", this.Title, e.X, e.Y); } } Let’s inspect the executable’s managed resources (also using dnSpy) and in particular the embedded picture (in order to extract its dimensions): After saving the picture and looking at its header, we can tell that it is a JPEG picture. Open it and inspect its dimensions (using your favorite picture viewer): WIDTH = 851 HEIGHT = 541 Going back to the main() function, the ShowFirstPoint variable is used inside a timer callback. When timer_1 elapses and when ShowFirstPoint is specified, one hard-coded coordinate is queued into the m_points list: private int CX0 = 543; private int CY0 = 175; private void timer1_Tick(object sender, EventArgs e) { if (this.ShowFirstPoint) { this.ShowFirstPoint = false; Point item = new Point(this.CX0, this.CY0); this.m_points.Add(item); } ... } Is it safe to assume that CX0 and CY0 are valid first coordinates? For now yes, since we had to guess the secret argument ShowFirstPoint, which apparently serves as a hint to help the reverse engineer. Who else queues coordinates in the list? private void pictureBox1_MouseUp(object sender, MouseEventArgs e) { if (!this.timer2.Enabled) { Point this2 = new Point(e.X, e.Y); this.m_points.Add(this2); } } When the user clicks on the picture, the MouseUp event does not immediately check for the validity of the coordinate. Instead, it just queues the point coordinates. Let’s take a look at the remaining code in the timer1 handler: private void timer1_Tick(object sender, EventArgs e) { if (this.ShowFirstPoint) { ... } else if (this.m_points.Count != 0) { Point pt = this.m_points[0]; this.m_points.RemoveAt(0); if (this.m_coll.Count == 0) { int v; if (Math.Sqrt(Math.Pow((double)Math.Abs(this.CX0 - pt.X), 2.0) + Math.Pow((double)Math.Abs(this.CY0 - pt.Y), 2.0)) < 25.0) { v = 1; } else { v = 0; } this.b_pass1 = (v != 0); } this.pictureBox1.CreateGraphics().DrawEllipse(Pens.Red, pt.X - 25, pt.Y - 25, 50, 50); ulong e2 = (ulong)((ulong)((long)(pt.X + 1981)) << 32); ulong encoded_pt = (ulong)(((long)(pt.Y + 17) | (long)e2) ^ -6148914692668172971L); this.m_coll.Add(encoded_pt); if (this.m_coll.Count == 4) { this.timer2.Enabled = true; this.timer1.Enabled = false; } } } We can see that timer1 checks to see if there are queued points, then it: Dequeues a point Checks if the m_coll list was still empty If it is empty, the code checks the distance between the first point clicked against the hard-coded initial coordinate (CX0, CY0). If the distance is within 25 pixels range, then b_pass1 is set to true. If (CX0, CY0) is the center of the circle, then any point within a 25 pixel radius passes the check. So the first correct coordinate is around the circle with radius R=25 and center C(543, 175) Draws an ellipse with width=height=50 having the x and y coordinates of the upper-left corner of the ellipse 25 pixels away from the clicked point. Because width and height are equal, DrawEllipse() draws a circle. The drawn circle’s center is at (x, y) If the point (x,y) is a correct coordinate, then many more points around it are also valid. In theory, the total valid points would be equal to the area of the circle: 3.14 * 25^2 == 1962.5 possible correct coordinates for each point. Encodes the (x, y) into a 64-bit number. This encoding is used to create extra work for the reverse engineer. Coordinate encoding as a 64-bits number follows this formula:unsigned __int64 encoded_pt = (((pt.X + 1981) << 32L) | (pt.Y + 17)) ^ 0xAAAAAAAA55555555i64 When 4 points are collected and encoded, the first timer (timer1) is disabled and the second timer (timer2) is enabled This is a nice technique to make the coordinate checks code a bit asynchronous and out of order. This forces the reverse engineer to look elsewhere in order to understand how the coordinates checks work. What we learned so far: Coordinates are collected into a list and de-queued from a timer callback The timer callback draws a circle with its center set to the clicked coordinates Each coordinate (up to 4) is encoded and queued as a single 64-bit integer into another list (m_coll) Let’s now see how m_coll is used and how the remaining 3 points are checked: private unsafe void timer2_Tick(object sender, EventArgs e) { this.timer2.Enabled = false; if (this.b_pass1) { StringBuilder s = new StringBuilder(); int i = 0; int c = this.m_coll.Count; if (0 < c) { do { s.AppendFormat("{0:X16}", this.m_coll[i]); i++; } while (i < c); } byte* this2 = s.ToString(); if (this2 != null) { this2 = (ulong)RuntimeHelpers.OffsetToStringData + this2; } char* wch = this2; string hidden_message = new string(<Module>.native_verify(wch)); if (hidden_message.Length != 0) { MessageBox.Show(hidden_message.Replace("@", "\r"), "Congratulations!"); goto IL_AA; } } MessageBox.Show("Sorry, invalid sequence, please try again!"); IL_AA: this.m_coll.Clear(); this.b_pass1 = false; this.pictureBox1.Refresh(); this.timer1.Enabled = true; } Timer2 callback checks to see if b_pass1 is true and if not, it immediately displays a message saying that the clicked coordinates are wrong. Now we can confirm that indeed, the first point (CX0, CY0) is the correct first point. If the first coordinate is correct (whether set using the command line hint or guessed correctly), then all the coordinates are serialized into a string in hexadecimal form and then passed to a native method called native_verify. The native verification function returns a Unicode string on success or an empty string on failure. This concludes our investigation in the managed code part. The next step is to locate and reverse engineer the native function native_verify. Inspecting the native code In the first part of this walk-through, we mentioned that we can disassemble the program in two different ways. Let us disassemble the file once more but this time let’s select the “Portable Executable for AMD64 (PE)” file loader. The next step is to locate the entry point of the native function native_verify. Using dnSpy, we can click on the native_verify function which is called from the timer2 callback to get the metadata associated with this function: // Token: 0x06000051 RID: 81 RVA: 0x000017FC File Offset: 0x00000BFC [SuppressUnmanagedCodeSecurity] [MethodImpl(MethodImplOptions.Unmanaged | MethodImplOptions.PreserveSig)] internal unsafe static extern char* native_verify(char*); We can then use the “File Offset” value given by dnSpy and use IDA’s “Jump/Jump to file offset” menu item to locate the native_verify entrypoint: .text:00000001400017FC ; WCHAR *__fastcall native_verify(wchar_t *encoded_coords) .text:00000001400017FC native_verify proc near .text:00000001400017FC ; DATA XREF: .pdata:ExceptionDir↓o .text:00000001400017FC .text:00000001400017FC lpWideCharStr= qword ptr -58h .text:00000001400017FC cchWideChar= dword ptr -50h .text:00000001400017FC var_48= dword ptr -48h .text:00000001400017FC num= qword ptr -40h .text:00000001400017FC buf= byte ptr -38h .text:00000001400017FC var_10= qword ptr -10h .text:00000001400017FC var_8= byte ptr -8 .text:00000001400017FC .text:00000001400017FC ; __unwind { // __GSHandlerCheck .text:00000001400017FC 4C 8B DC mov r11, rsp .text:00000001400017FF 49 89 5B 10 mov [r11+10h], rbx .text:0000000140001803 49 89 6B 18 mov [r11+18h], rbp .text:0000000140001807 49 89 73 20 mov [r11+20h], rsi .text:000000014000180B 57 push rdi .text:000000014000180C 48 83 EC 70 sub rsp, 70h .text:0000000140001810 48 8B 05 31 EF 09 00 mov rax, cs:__security_cookie .text:0000000140001817 48 33 C4 xor rax, rsp .text:000000014000181A 48 89 44 24 68 mov [rsp+78h+var_10], rax .text:000000014000181F 33 C0 xor eax, eax .text:0000000140001821 48 8B D9 mov rbx, rcx .text:0000000140001824 33 D2 xor edx, edx; Val .text:0000000140001826 89 44 24 30 mov [rsp+78h+var_48], eax .text:000000014000182A 49 8D 4B C8 lea rcx, [r11-38h]; Dst .text:000000014000182E 44 8D 40 22 lea r8d, [rax+22h]; Size .text:0000000140001832 E8 6B 1D 00 00 call j_memset .text:0000000140001832 .text:0000000140001837 48 8D 7C 24 30 lea rdi, [rsp+78h+var_48] .text:000000014000183C BE 04 00 00 00 mov esi, 4 .text:0000000140001841 48 8D 2D B8 E7 FF FF lea rbp, cs:140000000h .text:0000000140001841 .text:0000000140001848 .text:0000000140001848 loc_140001848: .text:0000000140001848 ; CODE XREF: native_verify+113↓j .text:0000000140001848 41 B8 10 00 00 00 mov r8d, 16; MaxCount .text:000000014000184E 48 8D 4C 24 40 lea rcx, [rsp+78h+buf]; Dst .text:0000000140001853 48 8B D3 mov rdx, rbx; Src .text:0000000140001856 E8 E5 37 00 00 call sub_140005040 .text:0000000140001856 .text:000000014000185B 4C 8D 44 24 38 lea r8, [rsp+78h+num] .text:0000000140001860 48 8D 15 31 57 00 00 lea rdx, Format; "%llx" .text:0000000140001867 48 8D 4C 24 40 lea rcx, [rsp+78h+buf]; Src .text:000000014000186C E8 CB 01 00 00 call sub_140001A3C After scrolling a bit in the function, I observed various calls leading to function pointers with no apparent indications on how those pointers get initialized. These function pointers could be part of the native code or they could be function pointers in the managed code. (Function calls) Let’s take the function sub_140005040 for example which is called from 0x0000000140001856: .nep:0000000140005040 sub_140005040 proc near .nep:0000000140005040 ; CODE XREF: native_verify+5A↑p .nep:0000000140005040 EB 08 jmp short loc_14000504A .nep:0000000140005040 .nep:0000000140005042 0F 0B ud2 .nep:0000000140005042 .nep:0000000140005044 FF 25 BE B6 09 00 jmp cs:qword_1400A0708 .nep:000000014000504A .nep:000000014000504A loc_14000504A: .nep:000000014000504A ; CODE XREF: sub_140005040↑j .nep:000000014000504A FF 25 C0 B6 09 00 jmp cs:qword_1400A0710 .nep:000000014000504A .nep:000000014000504A sub_140005040 endp .data:00000001400A0708 06 00 00 06 00 00 00 00 qword_1400A0708 dq 6000006h .data:00000001400A0710 06 00 00 06 00 00 00 00 qword_1400A0710 dq 6000006h That stub function jumps into qword_1400A0710 which has the value 0x6000006. This value is the function token id. We can search for that function in dnSpy: // Token: 0x06000006 RID: 6 RVA: 0x000017E4 File Offset: 0x00000BE4 internal unsafe static int wcsncpy_s<17>($ArrayType$$$BY0BB@_W* _Destination, char* _Source, ul'
