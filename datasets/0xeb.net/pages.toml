title = "Using Z3 with IDA to simplify arithmetic operations in functions | Shortjump!"
description = "I have been meaning to learn about SMT based program analysis for a long time and recently I started learning about the topic. There are so many frameworks, articles and tutorials out there that I …"
full_description = "Using Z3 with IDA to simplify arithmetic operations in functions March 5, 2018 elias IDAPython, Reverse Engineering, Z3 I have been meaning to learn about SMT based program analysis for a long time and recently I started learning about the topic. There are so many frameworks, articles and tutorials out there that I shall explore as time goes by. Since I am still learning, I do not claim that the following material is rocket science or advanced by any means, instead, it is very basic and should be approachable enough by absolute beginners to Z3 (a theorem prover from Microsoft Research). All I know so far comes from reading Dennis Yurichev‘s e-book “Quick introduction into SAT/SMT solvers and symbolic execution” in addition to the Z3Py introductory material by Eric (https://github.com/ericpony/z3py-tutorial). In last week’s blog post, I illustrated how to write a basic emulator to evaluate a function’s return value without running it. In today’s blog post, I am going to show how to convert thousands of arithmetic operations from x86 assembly code into simplified Z3 expressions. Introduction Quick Z3 Primer Converting the assembly listing to a Z3 expression Introduction The test program is similar to last week’s test program, where it has a table of 12 challenge functions that get called from the main function. Each challenge function was randomly generated so it contains a random sequence of add/sub/dec/inc instructions that work with the eax/ebx/ecx/edx registers (and immediate values). Here’s a snippet of the first challenge function (at 0x401000): //------------------------------------------------------------------------- uint32_t challenge_1(uint32_t c1, uint32_t c2, uint32_t c3, uint32_t c4) // 1953 operation(s) { uint32_t result; __asm { pushad mov eax, [c1] mov edx, [c2] mov ecx, [c3] mov ebx, [c4] sub eax, ebx inc ebx sub ebx, ecx sub ecx, 0x852e4867 add ebx, ebx inc ecx add eax, edx add ecx, ebx sub ecx, ebx inc ecx sub ebx, edx add eax, 0x7a20f9e6 add ebx, 0xaa5a1584 add edx, edx sub ebx, 0x1ca0a567 sub eax, 0xf94f7d8c inc ecx inc eax add edx, eax sub ebx, edx inc ebx sub edx, 0xd68a9fa7 inc ebx inc eax inc eax . . ...1000+ instructions later... . sub ebx, edx inc eax sub ebx, edx sub ecx, eax add eax, ebx add ecx, 0xd2cb013d add ecx, 0xda9d6a2e add edx, eax sub edx, 0x25ebd85d add ebx, ebx add ebx, 0x936e2259 inc eax add eax, ecx add ebx, 0xc0c1aa inc ebx add edx, 0x921ee6d5 add edx, edx add ecx, eax add ecx, eax inc ebx sub ebx, edx add ebx, eax inc ebx sub eax, 0xd9d2f9c2 add edx, eax inc ecx add ecx, 0xad2e6bb0 add ecx, eax sub ecx, ebx add ebx, eax sub ecx, 0xe2786d0c add eax, ebx add eax, ecx add eax, edx mov dword ptr [result], eax popad } return result; } The disassembly listing of the function above is going to look similar, so instead of showing the disassembly, I am going to show you the output of the Hex-Rays decompiler: [skip] int __cdecl challenge_1(unsigned int c1, unsigned int c2, unsigned int c3, unsigned int c4) { unsigned int v4; // edx unsigned int v5; // ebx unsigned int v6; // ecx unsigned int v7; // eax int v8; // ecx int v9; // eax int v10; // edx int v11; // ebx int v12; // ecx int v13; // eax int v14; // ebx int v15; // edx int v16; // eax int v17; // ebx int v18; // ecx int v19; // edx int v20; // ecx int v21; // edx int v22; // eax int v23; // ebx int v24; // edx int v25; // eax int v26; // ecx int v27; // edx int v28; // ecx int v29; // edx int v30; // eax int v31; // ebx int v32; // ecx int v33; // eax int v34; // edx int v35; // ecx int v36; // ebx int v37; // edx int v38; // ecx int v39; // eax int v40; // ebx int v41; // ecx int v42; // eax int v43; // edx int v44; // ebx int v45; // ebx int v46; // edx int v47; // ecx int v48; // eax int v49; // edx int v50; // ebx int v51; // eax int v52; // edx int v53; // ebx int v54; // eax int v55; // edx int v56; // ecx int v57; // ecx int v58; // eax int v59; // edx int v60; // eax int v61; // ebx int v62; // eax int v63; //