title = "May | 2017 | Shortjump!"
description = "Reversing engineering, programming and what not…"
full_description = "Introducing Ganxo v0.1 Alpha – An open source API hooking framework May 30, 2017 elias Uncategorized Hello, Today I release the first Alpha version of Ganxo (pronounced as “Gun Show” or “Gan Chou”), an open source API hooking framework. In Catalan, Ganxo means “hook”, thus the framework’s name. Writing an API hooking framework was always on my to do list. I started developing Ganxo back in April 2016 and after two weeks of development during my free time, I got busy with other things and abandoned my efforts. My initial goals were to accomplish the following before going public with it: Support x86 and x64 hooking Write a more extensive test suite Fully document it This past weekend, I decided to release Ganxo even though I have not met all my goals. As of today, Ganxo works on MS Windows and supports x86 API hooking. The groundwork is laid down and it should be easy to add x64 bits hooking support on Windows or even just port it to other operating systems. Feel free to clone the code from here and start using it today. Stay tuned, I plan more features in the coming future! While at it, check out my Batchography book! 3 Comments"
