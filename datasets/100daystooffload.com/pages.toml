title = "100 Days To Offload"
description = "Can you publish 100 posts on your blog in a year?"
full_description = "The whole point of #100DaysToOffload is to challenge you to publish 100 posts on your personal blog in a year. Posts don’t need to be long-form, deep, meaningful, or even that well written. If there are spelling and grammar mistakes, or even if there’s no real point to the post, so what? What’s important is that you’re writing about the things you want to write about. Your posts could be how-to guides, or links to another post you have found interesting. They could include your own thoughts about that post, or a response to it. It could be a simple update about what you have done that day. Tell us about your dog, your cat, your fish tank, or whatever hobbies you have. Someone will find it interesting. Just. Write. Guidelines There are some simple and reasonable guidelines if you want to take part in #100DaysToOffload: This needs to be done on a personal blog, not a corporate blog. If you don’t have a personal blog, you can sign up for a free one at Bear Blog. There is no specific start date. Your 100 posts can start or end whenever you want them to, they just need to be completed within 365 days. Publish 100 new posts in the space of a year. There are no limits to what you can post about – write about whatever interests you. Once you have published an article, don’t forget to post a link on your social media with the hashtag #100DaysToOffload. Get your friends involved! Finding Other Participants It’s important to ensure you include the #100DaysToOffload hashtag in all your posts. This is so they’re included in social media channels and get the visibility they deserve from the other people taking part. The links below will take you to the #100DaysToOffload hashtag feeds for various social sites so you can discover other people taking part. If there is a social feed missing, please let me know. Twitter Mastodon Write.As Facebook Bluesky 🎉 Hall of fame 🎉 This section of the site is reserved for those very special people who have completed #100DaysT