full_description = '''For your questions regarding the General Data Protection Regulation we have created this specific FAQ: GDPR / DSGVO FAQ Before sending me an email about your login not working, please try every login method (click on the facebook button, the twitter and the google button). 90% of account login issues happen because users thought that they used a different login method. You probably have to unlock your result by completing the anti-cheat-test. At the top of the page your should see 'notifications', clicking on it you will be able to participate in an anti-cheat-test. WPM-calculation is based on the following calculation: 5 keystrokes equal 1 WPM, if you don't believe me, check Wikipedia about Words per minute :) Every key you hit on the keyboard to type a letter is one keystroke. The calculation also considers if you have to type uppercase letters or language specific letters who need 2 keystrokes to be typed (for example "A"). For example "quick" needs 5 keystrokes whereas "America" needs 8 keystrokes. If you have a slow computer or doing a lot of things simultaneously on your computer, the 60-second timer might be slowed down. This might result in a situation were you instead of having 60 seconds, you actually have 70 seconds to type. The server detects this as a cheat attempt (even though it might just be a slow computer or something related to this) and doesn't save the score in this case. You can fix this by closing all of your running programs and every tab in your browser. If you receive a result over 120 WPM you have to unlock it with an anti-cheat-test. Click on the speech bubble at the top of the site to check for notifications. If you would like to help translate 10FastFingers into your language, please take a look at the translation page: For translations please take a look at the translation page After you fullfilled the requirements for the achievement, please give it up to 5 minutes for the achievement to be unlocked. If it still doesn't show up, please make sure javascript is activated on your profile page and reload the page.'''
