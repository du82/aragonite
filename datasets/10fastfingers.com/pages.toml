["https://10fastfingers.com/gdpr"]
title = "GDPR - 10FastFingers.com"
full_description = '''This page will inform you about everything related to GDPR on 10FastFingers. Which data we save, for what reason each data piece is saved, how you can remove your data etc. If you have a question about something that is not covered here, please don't hesitate to contact me via email: [email protected] All the data we save is used for site operation, for example, if you logged in via email, we will store your email and a hashed version of your password (so even we can't see the password but you are still able to login with it). If you logged in via Facebook, we will store your facebook user id. We generally store your email address to give you the ability to convert your account from Google/Twitter/Facebook to one that uses your email+password (in case you won't to delete your social network account but still have access to your 10FastFingers account) and also to send you important system emails (password recovery for example). Here is a list of the data we store: To access your specific data, please login to your account, click on the "settings" page and navigate to the "Your Data" section or click this link after you have logged in. If you want to delete all your data from our server, just login to your account, go to the settings page and click "delete account". Please keep in mind that we can't restore your account once its deleted.'''
