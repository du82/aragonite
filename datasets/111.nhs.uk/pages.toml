full_description = "111 online Get help for your symptoms 111 online If you think you need medical help right now, 111 online can tell you what to do next. I want to get: help for my symptoms or injury dental help mental health help a prescription or medicines information help with an existing medical condition Other ways to contact 111 if you have a hearing problem or need help in other languages See more NHS services Find out how to access a range of NHS services, such as: GP appointment booking managing hospital referrals COVID-19 vaccinations Find out about other NHS services on NHS.UK Waiting for a 111 callback? The 111 callback service might be busy. Get information about 111 callbacks How 111 online works 111 online will not give you a diagnosis, but we will direct you to the best place to get help for your symptoms. We cannot: issue fit notes - you need to contact your GP surgery make or cancel appointments for you in other parts of the NHS Read about how 111 online works in detail NHS 111 online is available in England only. Get help in: Northern Ireland Scotland Wales Get medical help I want to get: help for my symptoms or injury dental help mental health help a prescription or medicines information help with an existing medical condition Other ways to contact 111 if you have a hearing problem or need help in other languages See more NHS services Find out how to access a range of NHS services, such as: GP appointment booking managing hospital referrals COVID-19 vaccinations Find out about other NHS services on NHS.UK Waiting for a 111 callback? The 111 callback service might be busy. Get information about 111 callbacks How 111 online works 111 online will not give you a diagnosis, but we will direct you to the best place to get help for your symptoms. We cannot: issue fit notes - you need to contact your GP surgery make or cancel appointments for you in other parts of the NHS Read about how 111 online works in detail NHS 111 online is available in England 