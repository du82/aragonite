["https://111.nhs.uk/Help/Browsers"]
title = "How to upgrade your web browser - NHS 111"
full_description = "How to upgrade your web browser You should upgrade your web browser (the software you use to access the internet) if it’s out of date. Upgrading to a newer browser will mean: your computer will be more secure and less likely to be attacked it’ll be faster to browse the internet you’ll see more features on many websites How to upgrade Choose a browser from the list below and follow the instructions for installing it. For any computer (Windows, Mac, Linux) You can use: Google Chrome Mozilla Firefox For Apple Macs You can use Safari. For older Apple Mac devices you can use Chrome or Mozilla Firefox to bring them up to date. For Windows 10 and 11 You can use Microsoft Edge. For Windows 7 and Windows 8 You can use Chrome or Mozilla Firefox. For mobile devices You can: get help from Apple to update your iOS devices check your settings for system updates for Android devices"
year_published = 2025
