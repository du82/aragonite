["https://111.nhs.uk/triage/check-your-symptoms"]
title = "Check your symptoms - NHS 111"
full_description = "111 online Check your symptoms If you're worried about a symptom, answer some questions and we will tell you what to do next. Depending on your symptoms, we might advise you to: call 999 or go to A&E in an emergency go to an urgent treatment centre see an evening and weekend (out-of-hours) GP book a callback from a nurse get urgent specialist support, for dental or mental health problems contact your own GP surgery see a pharmacist for help with a minor illness look after yourself at home Start now Call 111 instead if you: need help for a child under 5 have complex problems caused by an existing medical condition have a care plan from your doctor for your current health problem need to get end-of-life care Other ways to contact 111 if you have a hearing problem or need help in other languages"
