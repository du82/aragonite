tic or private use (for any use other than by the patient, or their carer) is outside of the clinical safety case that governs its use. Examples of this would be, but not excluded to, use by a third party call handler or use within a care setting. References to ‘the NHS’ mean ‘the NHS in England’ unless otherwise stated. Service descriptions, entitlements and costs refer to services in England and arrangements may differ elsewhere in the UK. We cannot guarantee uninterrupted access to the website, or the sites to which it links. We accept no responsibility for any damage arising from the unavailability of this website or the information it contains. This website contains links to other sites. We are not responsible for the content of any third party website and a link to another site in no way constitutes NHS England’s endorsement of the contents therein. You may link to our home page, provided you do so in a way that is fair and legal and does not damage our reputation or take advantage of it. You must not establish a link in such a way as to suggest any form of association, approval or endorsement on our part. We reserve the right to withdraw linking permission without notice. If you submit personal information to us through this website, it will be used in accordance with our privacy policy. We do not guarantee that this website will be secure or free from bugs or viruses. You are responsible for configuring your information technology, computer programmes and platform to access our site. You should use your own virus protection software. You must not misuse this website by knowingly introducing viruses, trojans, worms, logic bombs or other material that is malicious or technologically harmful. You must not attempt to gain unauthorised access to our site, the server on which this website is stored, or any server, computer or database connected to this website. You must not attack this website via a denial-of-service attack or a distributed denial-of service attack. By breaching this provision, you would commit a criminal offence under the Computer Misuse Act 1990. We will report any such breach to the relevant law enforcement authorities and we will co-operate with those authorities by disclosing your identity to them. In the event of such a breach, your right to use this website will cease immediately. General We aim to ensure that the information published on this website is accurate and consistent with current knowledge and practice in the NHS. However, medical knowledge and practice are constantly evolving and this site may not reflect the latest knowledge or practice. This website is written on the basis of likely general scenarios. Individual cases may require specific advice that cannot be addressed through this website. Accordingly, this website is provided for information only. It is not intended to replace a consultation with an appropriately qualified health professional. You should not ignore any professional medical advice on the basis of this website. We cannot guarantee that information provided by us through this website will meet your health or medical requirements. If you are concerned about your health, please contact a health professional such as your GP or call NHS 111 by dialling 111 from any landline or mobile phone free of charge. Deaf people can use text relay to call 18001 111. We only provide this website for domestic and private use. You agree not to use this website for any commercial or business purposes, or for any other purpose outside personal and domestic use. You acknowledge and agree that NHS England will not be responsible for any injury, loss, or damage (whether direct or indirect and including loss of profit, loss of business, business interruption, or loss of business opportunity) arising out of, or relating to the misuse of (including use outside that permitted by these terms), or inappropriate reliance on the contents or advice contained within the NHS 111 online website, except to 