["https://111.nhs.uk/Help/Accessibility"]
title = "Accessibility Statement - NHS 111"
full_description = "Accessibility statement for NHS 111 online This accessibility statement applies to NHS 111 online, run by NHS England. NHS England is committed to making its website accessible, in accordance with the Public Sector Bodies (Websites and Mobile Applications) (No. 2) Accessibility Regulations 2018 (the ‘accessibility regulations’). NHS 111 online is designed to be used by as many people as possible. We use clear and simple language suitable for people with a reading age of between 9 and 12 years. The website can be used on most web browsers. You should be able to: change colours, contrast levels and fonts zoom in up to at least 300% and still see all the content access using just a keyboard navigate using speech recognition software read using a screen reader, including JAWS, NVDA and VoiceOver You can get more advice from AbilityNet about how to make your computer or mobile phone easier to use if you have accessibility needs. Compliance statement This website is partially compliant with the Web Content Accessibility Guidelines version 2.1 AA standard, due to the non-compliances listed below. Non-accessible content The content below is non-accessible due to non-compliance with the accessibility regulations. consistent use of error validation alerting for screen readers - fails WCAG 2.1 section 3.3.1 (Error identification) How to get information about NHS 111 in an accessible format NHS 111 online is part of the wider NHS 111 service supporting urgent and emergency care, and you can access care in different ways. Information about NHS 111 is available in different formats like large print, easy read, audio recording or British Sign Language (BSL) or you can contact enquiries@nhsdigital.nhs.uk. Feedback and reporting accessibility problems with NHS 111 online We continually test the website with real users and make improvements as soon as we can. We encourage feedback from users of the service. If you find any problems not listed on this page or you think we're not meeting accessibility requirements, let us know using our contact details. Contact details You can use the following email: enquiries@nhsdigital.nhs.uk to get in touch or send us your feedback. Enforcement procedure The Equality and Human Rights Commission (EHRC) is responsible for enforcing the accessibility regulations. If you're not happy with how we respond to your complaint, contact the Equality Advisory and Support Service (EASS). Preparation of this accessibility statement This statement was prepared on 22 July 2020. It was last updated on 2 October 2024."
year_published = 2025
clearnet = "https://111.nhs.uk/Help/Accessibility"
