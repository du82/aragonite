["https://11ty.dev/blog/review-2024"]
title = "Eleventy, 2024 in Review — Eleventy"
description = "An Eleventy blog post published on January 2025."
full_description = "Blog Eleventy, 2024 in ReviewVersions Stable 3.0.0 Canary 3.0.1-alpha.4 Toggle Menu Get StartedCommand Line UsageDebug Mode Starter Projects Migrating to Eleventy LearnGlossary Tutorials CommonJS vs. ESM Performance 11ty Bundle CommunityCode of Conduct Blog Firehose Leaderboards 11ty Conference Eleventy Meetup ProjectsAdd CSS, JS, Fonts LayoutsLayout Chaining CollectionsCollections API Create Pages From Data PaginationPagination Navigation Content Dates Permalinks Virtual Templates Internationalization (i18n) Programmatic API Quick Tips Common Pitfalls Deployment & HostingUsing a CMS Using DataConfigure your Templates Eleventy Supplied Data Data CascadeFront Matter DataCustom Front Matter Template & Directory Data Files Global Data Files Data Deep Merge Config Global Data Computed Data Validate Data Environment Variables JavaScript Data Files Custom Data File Formats ConfigurationConfiguration Shapes Passthrough File Copy Ignore Files Filtersurl slugify log get*CollectionItem inputPathToUrl ShortcodesgetBundle getBundleFileUrl Preprocessors Custom Tags Events Transforms Watch and ServeEleventy Dev Server Browsersync Vite Memoize Template LanguagesHTML MarkdownMDX WebC JavaScriptJSX TypeScript Nunjucks Liquid Handlebars Mustache EJS HAML Pug Custom PluginsOfficial PluginsImage Fetch <is-land> Render Internationalization (i18n) RSS Upgrade Helper Syntax Highlighting InputPath to URL Navigation HTML <base> Bundle Id Attribute Directory Output Inclusive Language Community Plugins Retired Plugins API ServicesScreenshots OpenGraph Image IndieWeb Avatar Generator Image Hosting Image Sparklines Release History Advanced Compare ×4000 file build Eleventy 1.93s Astro 22.90s Breadcrumbs: Community Blog Eleventy, 2024 in Review 2025 January 08 zachleat 📢 Subscribe to the Eleventy News Feed Highlights It was a huge year for 11ty. The top three highlights have been: In October, Eleventy 3.0 stable shipped with so many new features, notably unlocking the optional use of ESM in your Eleventy projects. In September, 11ty Joined Font Awesome and it’s been a wildly productive and beautiful partnership! If you’re interested, we talked about it on Podcast Awesome. In May, we ran the 11ty Conference and it was an incredible success! You can read an organizer’s retrospective on my personal blog. All of the conference videos are on YouTube. Alongside the conference, we launched a limited time Merch store and an Email Newsletter. Honorable mentions to Eleventy on Wikipedia and Eleventy in use at The Louvre Museum (among others). Metrics I’ve started a little spreadsheet of data points from the 11ty ecosystem. I started doing this in early 2024 so some of the data is a bit incomplete (but noted below). Cumulative Metric 2023 2024 Change npm Downloads 7,585,613 10,711,017 41.20% GitHub dependents 69,632 79,563 12.49% GitHub Stars 15,569 17,460 12.14% 11ty-community Sites 1,018 1,175 15.42% Mastodon Friends 3,565 4,217 18.28% Bluesky Friends 99 2,344 2267.67% YouTube Subscribers 1,880 2,498 32.87% Discord Members 3,093 3,253 5.17% LinkedIn Super Professional Network 265 737 178.11% Newsletter Subscribers 268 1607 499.62% incomplete manual data measured on Jan 31 or Feb 26, 2024 Year over Year Metric 2023 2024 Change npm Downloads 2,915,939 3,125,404 7.18% GitHub Issues Closed 519 695 33.91% GitHub Pull Requests Closed 197 326 65.48% New on the Docs JSX, MDX, and TypeScript already due for an update with upcoming TypeScript support in Node.js! Migrate from WordPress to Eleventy Image plugin refactor Virtual Templates You can subscribe to the 11ty.dev docs feed. Releases In addition to Eleventy v3 stable, we also shipped major releases for a variety of ecosystem plugins and utilities: @11ty/import v1.0 is a new CLI to import content (as static files) from various sources. Can import your WordPress site statically (with images/videos/etc) in a single command. @11ty/create v1.0 is a new CLI to create new files in a cross-platform-friendly way. Eleventy Fetch v5.0 using platform-native fetch() Eleventy Base Blog v9.0 using Eleventy v3 Eleventy Image v6.0 technically this was released in 2025 but we’re counting it since we released v5.0 and v4.0 in 2024. Eleventy RSS Plugin v2.0 Eleventy Dev Server v2.0 (bundled with Eleventy v3) Eleventy Bundle Plugin v3.0 (and v2.0) Eleventy Vite Plugin v5.0 shipped by Kilian Finger ×13 major releases, ×102 releases total Thank You! 2024 would not have been possible without our community and supporters. To everyone that has built something with Eleventy: thank you! To everyone that has answered a question about Eleventy: on the Discord, on social media, in GitHub issues or discussion, at your local meetup or coffee shop: thank you! To everyone that has shared or talked about Eleventy on social media: thank you! To everyone that attended the 11ty Conference earlier this year: thank you! Thank you to CloudCannon friends David Large, Olivia Nicholson, and Mike Neumegen for their contributions in organizing and running the conference! To everyone that dropped a few nice words of appreciation: thank you! To everyone that has supported us: thank you! Thank you to new Font Awesome friends Dave Gandy and Travis Chase! Thank you to Bob Monsour! (of 11tybundle.dev fame) Thank you to Kilian Finger for their contributions to the Eleventy Vite plugin! Thank you to Peter deHaan and Raphael Höser for contributions on GitHub! Thank you to Cory Dransfeldt, Stephanie Eckles, Ben Myers, Sia Karamalegos, Shiv Jha-Mathur, Dan Leatherman, Evan Sheehan, Cassey Lottman, Thomas Michael Semmler for contributions on the 11ty Meetup and our Discord server! Read more blog posts: Next: Eleventy Super Professional Linkedin Certification Previous: Help Eleventy by filling out Survey Awesome!"
