title = "Eleventy Documentation — Eleventy"
description = "A docs page for Eleventy, a simpler static site generator."
full_description = "Blog Eleventy, 2024 in ReviewVersions Stable 3.0.0 Canary 3.0.1-alpha.4 Toggle Menu Get StartedCommand Line UsageDebug Mode Starter Projects Migrating to Eleventy LearnGlossary Tutorials CommonJS vs. ESM Performance 11ty Bundle CommunityCode of Conduct Blog Firehose Leaderboards 11ty Conference Eleventy Meetup ProjectsAdd CSS, JS, Fonts LayoutsLayout Chaining CollectionsCollections API Create Pages From Data PaginationPagination Navigation Content Dates Permalinks Virtual Templates Internationalization (i18n) Programmatic API Quick Tips Common Pitfalls Deployment & HostingUsing a CMS Using DataConfigure your Templates Eleventy Supplied Data Data CascadeFront Matter DataCustom Front Matter Template & Directory Data Files Global Data Files Data Deep Merge Config Global Data Computed Data Validate Data Environment Variables JavaScript Data Files Custom Data File Formats ConfigurationConfiguration Shapes Passthrough File Copy Ignore Files Filtersurl slugify log get*CollectionItem inputPathToUrl ShortcodesgetBundle getBundleFileUrl Preprocessors Custom Tags Events Transforms Watch and ServeEleventy Dev Server Browsersync Vite Memoize Template LanguagesHTML MarkdownMDX WebC JavaScriptJSX TypeScript Nunjucks Liquid Handlebars Mustache EJS HAML Pug Custom PluginsOfficial PluginsImage Fetch <is-land> Render Internationalization (i18n) RSS Upgrade Helper Syntax Highlighting InputPath to URL Navigation HTML <base> Bundle Id Attribute Directory Output Inclusive Language Community Plugins Retired Plugins API ServicesScreenshots OpenGraph Image IndieWeb Avatar Generator Image Hosting Image Sparklines Release History Advanced Compare npm install Eleventy 5.81s Gatsby 43.36s Accessibility Statement The Eleventy project recognizes that Accessibility is an incredibly important baseline to developing inclusive and quality software. On Eleventy web properties specifically, we aim to meet WCAG 2.1 AA standards and to support our development community to do the same. If you’ve encountered an issue with our web site—accessibility or otherwise—please let us know! The best way to do this is filing a new GitHub issue on the 11ty-website repository. We are also available on Mastodon at eleventy or feel free to contact zachleat directly. Our Eleventy Leaderboards encourage best practices on sites that were Built with Eleventy through performance and accessibility auditing (via Lighthouse and axe) but automated auditing systems are only a starting point. It’s very important that we take responsibility for the code we publish and deliver and strive to correct accessibility issues with the same veracity as a full service outage. Accessibility Resources The A11Y Project (their website is Built with Eleventy!), including their incredible Accessibility Checklist GOV.UK Service Manual: Understanding WCAG 2.1 WebAIM’s WCAG 2 Checklist W3C Web Accessibility Initiative: How to Meet WCAG (Quick Reference) Microsoft’s Inclusive Design Initiative Tools Automated Auditing axe Lighthouse (uses axe) webhint pa11y WAVE by WebAIM Accessibility Insights tenon.io (Paid) Compatibility Tests Accessibility Support, screen reader compatibility tables PowerMapper Assistive Technology Compatibility Tests People to Follow One of the best ways to immerse yourself in the accessibility development community is to follow the experts. Many of these folks are participants in the Eleventy community too! Marcy Sutton Scott O’Hara Adrian Roselli Sara Soueidan Eric Bailey Marco Zehe Dave Rupert Karl Groves Heydon Pickering and you? (Edit this page on GitHub) Organizations to Follow The Paciello Group deque"
