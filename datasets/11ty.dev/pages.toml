 aren’t relying on run-time services that are out of your control but you can assess the risk-reward of this scenario yourself. (Definitely self-host for business use cases) Eleventy API Explorer This is a website to show sample results from the official Eleventy API services. List of API Services Screenshots: Returns a screenshot image from a URL. OpenGraph Image: Returns the OpenGraph image from a URL. IndieWeb Avatar: Returns an avatar representing a URL. Generator Image: Returns the site generator’s logo that was used to build a site at given URL. Hosting Image: Returns the hosting provider’s logo that was used to host a site at given URL. Sparklines: Returns a Sparkline image given a set of numbers. From the Community + Add yours! API Services: Screenshots OpenGraph Image IndieWeb Avatar Generator Image Hosting Image Sparklines"
