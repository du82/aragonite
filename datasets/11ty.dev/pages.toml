title = "11ty is joining Font Awesome — Eleventy"
description = "An Eleventy blog post published on September 2024."
full_description = "Blog Eleventy, 2024 in ReviewVersions Stable 3.0.0 Canary 3.0.1-alpha.4 Toggle Menu Get StartedCommand Line UsageDebug Mode Starter Projects Migrating to Eleventy LearnGlossary Tutorials CommonJS vs. ESM Performance 11ty Bundle CommunityCode of Conduct Blog Firehose Leaderboards 11ty Conference Eleventy Meetup ProjectsAdd CSS, JS, Fonts LayoutsLayout Chaining CollectionsCollections API Create Pages From Data PaginationPagination Navigation Content Dates Permalinks Virtual Templates Internationalization (i18n) Programmatic API Quick Tips Common Pitfalls Deployment & HostingUsing a CMS Using DataConfigure your Templates Eleventy Supplied Data Data CascadeFront Matter DataCustom Front Matter Template & Directory Data Files Global Data Files Data Deep Merge Config Global Data Computed Data Validate Data Environment Variables JavaScript Data Files Custom Data File Formats ConfigurationConfiguration Shapes Passthrough File Copy Ignore Files Filtersurl slugify log get*CollectionItem inputPathToUrl ShortcodesgetBundle getBundleFileUrl Preprocessors Custom Tags Events Transforms Watch and ServeEleventy Dev Server Browsersync Vite Memoize Template LanguagesHTML MarkdownMDX WebC JavaScriptJSX TypeScript Nunjucks Liquid Handlebars Mustache EJS HAML Pug Custom PluginsOfficial PluginsImage Fetch <is-land> Render Internationalization (i18n) RSS Upgrade Helper Syntax Highlighting InputPath to URL Navigation HTML <base> Bundle Id Attribute Directory Output Inclusive Language Community Plugins Retired Plugins API ServicesScreenshots OpenGraph Image IndieWeb Avatar Generator Image Hosting Image Sparklines Release History Advanced Compare ×4000 file build Eleventy 1.93s Gatsby 29.05s Breadcrumbs: Community Blog 11ty is joining Font Awesome 2024 September 12 zachleat 📢 Subscribe to the Eleventy News Feed Today—I’m delighted to announce that 11ty is joining the excellent team at Font Awesome. Read more on Blog Awesome: Eleventy joins Font Awesome. You’re probably already familiar with the folks at Font Awesome. Maybe you’ve used their excellent open source icon library. Perhaps you’ve used the newly minted open source web components library Web Awesome (a.k.a. Shoelace). But surely you remember one of the legendary promo videos from their wildly successful Kickstarter campaigns. What does this mean for Eleventy? No action is required by folks using and building with Eleventy. We will continue to help you build fast web sites (with fast build times!) and we will continue to develop and maintain the open source project as before! We’ve had a lot of great discussions about best practices for sustainable open source with the Font Awesome folks in the past few months and they have a well established record of maintaining open source projects—as evidenced by the path already paved by Cory Laviska with Shoelace and Web Awesome (October 2022). We’re excited that Eleventy is going to play a deeper role in the Awesome ecosystem and believe that this partnership will extend the life expectancy of the project well beyond our original ten-year goal! What’s Next? Eleventy recently shipped our first 3.0 beta release and the stable release is currently classified as imminently shippable—stay tuned for that very soon! I’m happy to answer any questions you might have (about this news or anything else about Eleventy)—just send me a message on Mastodon! Read more blog posts: Next: Eleventy v3.0.0 is now available! Previous: Eleventy v3.0.0-beta.1 now available"
