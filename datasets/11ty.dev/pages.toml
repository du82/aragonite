title = "The Stability of Eleventy — Eleventy"
description = "An Eleventy blog post published on April 2023."
full_description = "Blog Eleventy, 2024 in ReviewVersions Stable 3.0.0 Canary 3.0.1-alpha.4 Toggle Menu Get StartedCommand Line UsageDebug Mode Starter Projects Migrating to Eleventy LearnGlossary Tutorials CommonJS vs. ESM Performance 11ty Bundle CommunityCode of Conduct Blog Firehose Leaderboards 11ty Conference Eleventy Meetup ProjectsAdd CSS, JS, Fonts LayoutsLayout Chaining CollectionsCollections API Create Pages From Data PaginationPagination Navigation Content Dates Permalinks Virtual Templates Internationalization (i18n) Programmatic API Quick Tips Common Pitfalls Deployment & HostingUsing a CMS Using DataConfigure your Templates Eleventy Supplied Data Data CascadeFront Matter DataCustom Front Matter Template & Directory Data Files Global Data Files Data Deep Merge Config Global Data Computed Data Validate Data Environment Variables JavaScript Data Files Custom Data File Formats ConfigurationConfiguration Shapes Passthrough File Copy Ignore Files Filtersurl slugify log get*CollectionItem inputPathToUrl ShortcodesgetBundle getBundleFileUrl Preprocessors Custom Tags Events Transforms Watch and ServeEleventy Dev Server Browsersync Vite Memoize Template LanguagesHTML MarkdownMDX WebC JavaScriptJSX TypeScript Nunjucks Liquid Handlebars Mustache EJS HAML Pug Custom PluginsOfficial PluginsImage Fetch <is-land> Render Internationalization (i18n) RSS Upgrade Helper Syntax Highlighting InputPath to URL Navigation HTML <base> Bundle Id Attribute Directory Output Inclusive Language Community Plugins Retired Plugins API ServicesScreenshots OpenGraph Image IndieWeb Avatar Generator Image Hosting Image Sparklines Release History Advanced Compare ×4000 file build Eleventy 1.93s Astro 22.90s Breadcrumbs: Community Blog The Stability of Eleventy 2023 April 05 zachleat 📢 Subscribe to the Eleventy News Feed In The Need for Speed: Why Eleventy Leaves Bundlers Behind, we discussed the stability of Eleventy. “Stability is kind of a hard thing to sell, but our track record of being a five or six-year-old project now and really delivering value to folks over those five or six years speaks for itself,” he added. And Eleventy is stable. At time of writing, we’ve shipped 56 releases dating back December 2017 and only two of those releases have had Eleventy-specific breaking changes. Eric Bailey touched on his experience with Eleventy on the a11yproject.com project. a11yproject.com launched with version 1.0.0 of Eleventy. […] It's been a little under three years and I haven't had to make any adjustments to its dependencies, and it can still install and run from a cold start with no complications. When I update the site to use version 2.0.0 I'll actually be removing dependencies, and not adding more. […] That's rare and special.—Eric Bailey But how best can we communicate and demonstrate stability? In the following video we tackle this complex question with two scenarios: What happens when you return to an old project and want to get it up and running again without making any changes? Here we take our 6 Minute Blog from Scratch code and see how far back we can take the Eleventy version. What happens when you return to an old project and want to upgrade it to the latest versions of your dependencies? Here we take our Eleventy Base Blog starter project (currently at v8) and revert the application code to older and older versions to see if they will run with the latest version of Eleventy (v2.0.1). See how it went: Play Video Watch on YouTube Read more blog posts: Next: Six Million npm Downloads! Previous: The Need for Speed: Why Eleventy Leaves Bundlers Behind"
