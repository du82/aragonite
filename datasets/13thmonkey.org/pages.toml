["https://13thmonkey.org/Artdraw/index.html"]
title = "13thmonkey.org : Artdraw"
full_description = "Artdraw is a easy to use yet very powerfull library for the creation of fully anti-aliased images. It is completely vector based and thus has no floodfill nor bitmap operations like weird filters etc. They might be added later as an appendage to it but it isnt part of the initial specification. The basic set of drawing primitives supported in Artdraw are the ones found in many graphical languages such as Adobe's PostScript extended with alpha blending, powerfull fill and clipping methods and bitmap fill patterns. Drawing bitmaps like photo's is integrated in Artdraw but maybe a bit different than one is used to in other libraries as it logically integrates as `yet another' fill methods on the vector based drawing operations. This has the advantage that all other operations normally done on vectors are possible on bitmaps too like gradual transparency and clipping to name a few. A programmer using the Artdraw library is more or less instructing the library in a graphic language with primitives like moveto, lineto, curveto and fill. Very complex and diverse images can be constructed using these simple primitives alone. This relieves the artist / programmer of a lot of administrational tasks as found in other drawing libraries and is as extra benefit far less error-prone. Artdraw currently consists of the selfcontained library and a few regression test programs to check the basic functionalities of the library. Artdraw consists of 100% my own code and only needs to link to libz and libm as found on all machines nowadays or at least obtainable for them. Libz isn't strictly nessisary if you drop out the png image loading. Artdraw has been developped on a range of machines running NetBSD but also runs and compiles fine on other BSDs and Linux. Last time i checked it also ran fine on Sun's Solaris but has been quite some time ago regretfully. Under Linux you will have to use the BSD/Posix make sometimes installed as `pmake' or `bmake' due to gmake being non posix. Currently Artdraw is nearly finished for its 1st release. Its now very suitable for the creation of PNGs in programs and webpages. The example images show that most desired features are operational now so most complex images are ready to be drawn!"
year_published = 2025
clearnet = "https://13thmonkey.org/Artdraw/index.html"
tags = ["artdraw"]
language = "en"
internal-references = ["none"]
external-references = ["hacktic.nl", "wwwhome.cs.utwente.nl"]

["https://13thmonkey.org/~boris/jgame/index.html"]
title = "JGame: a Java/Flash game engine for 2D games"
full_description = 'What is JGame? JGame is an open source 2D game engine that makes multiplatform development easier. It runs on the Java JRE 1.3+ platform with optional OpenGL (JOGL) enhancements, the J2ME (MIDP2.0/CLDC1.1) mobile platform, and the Android (2.1+) platform. There is also a Flash (Actionscript 3) version. JGame features sprites with automatic animation and collision detection, a tile-based background with easy sprite-tile interaction facilities, sound, game state, persistent storage, and game options. Games are programmed at a fixed "virtual" resolution, but can be scaled to any screen resolution. The engine provides an enhanced graphics API, with a fallback to simpler and more efficient graphics on J2ME and plain JRE. A patched version of the JBox2D physics engine that runs on all platforms has now been included. Fundraiser: I am trying to collect 100 euros for covering the cost of the hardware for the Android version. Currently received: 94.56 euros. You can help with a donation of as little as 1 euro. Pay using Paypal or creditcard (no paypal account needed!). Pay using phone or SMS (some countries only, not available in USA). Download / Run Download JGame 3.6 (20120810) as tar.gz (28Mb) or as ZIP (28Mb). The package comes with all the docs and games. Or use this mirror: tar.gz or zip, or the sourceforge download mirror. Older versions are available in the archive section. Download JGame 3.6.2 beta (source only) as ZIP Download JGame Flash 1.0 (20110430) as Zip (3.6Mb) or view the README. Browse through the games: Applet page J2ME MIDlet page tmtg.net: the best games for all platforms, including new arrivals. Try the (prototype) online action game generator Documentation View the docs online: Setting up JGame with Eclipse Tutorial README - intro and install instructions Manual - general concepts and troubleshooting Changelog Javadoc License (BSD) The Box2D documentation (API is very similar to JBox2D) Also try: the JGame tutorial by Jeff Friesen. Note: he assumes the JGame 1.x API. In JGame 2.X, the initialisation API has changed. In JGame 3.X, some classes and methods are replaced. And: Set up and use JGame in NetBeans, a JGame tutorial by Techfleck. Contact For problems or bugs, mail me at schooten@cs.utwente.nl or check out the forums hosted at How to get Java Macos X comes with Java 1.4+ onboard. For Unix or Windows, we advise you to download the newest Oracle Java (either Java 6.29 or Java 7), or OpenJDK. If you want to compile stuff, make sure you get the JDK (development kit). If you only want to run games, get the JRE (runtime environment). See the Readme for info on other Java platforms (Android, J2ME). Get Oracle Java 7 JDK or JRE Get OpenJDK here Example code So, what does the code of a JGame game look like? Nebula Alpha source (87 lines) - a minimal but complete game using the JGame base classes Space Run source (64 lines) - a minimal but complete game using the StdGame class Matrix Miner source (226 lines) - a more complex game with tiles and using StdGame and Std objects. More code examples are found in: the JGame tutorial.'
