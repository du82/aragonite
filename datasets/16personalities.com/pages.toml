full_description = "Personality Types Analysts Architect INTJ-A / INTJ-T Imaginative and strategic thinkers, with a plan for everything. Logician INTP-A / INTP-T Innovative inventors with an unquenchable thirst for knowledge. Commander ENTJ-A / ENTJ-T Bold, imaginative and strong-willed leaders, always finding a way – or making one. Debater ENTP-A / ENTP-T Smart and curious thinkers who cannot resist an intellectual challenge. Diplomats Advocate INFJ-A / INFJ-T Quiet and mystical, yet very inspiring and tireless idealists. Mediator INFP-A / INFP-T Poetic, kind and altruistic people, always eager to help a good cause. Protagonist ENFJ-A / ENFJ-T Charismatic and inspiring leaders, able to mesmerize their listeners. Campaigner ENFP-A / ENFP-T Enthusiastic, creative and sociable free spirits, who can always find a reason to smile. Sentinels Logistician ISTJ-A / ISTJ-T Practical and fact-minded individuals, whose reliability cannot be doubted. Defender ISFJ-A / ISFJ-T Very dedicated and warm protectors, always ready to defend their loved ones. Executive ESTJ-A / ESTJ-T Excellent administrators, unsurpassed at managing things – or people. Consul ESFJ-A / ESFJ-T Extraordinarily caring, social and popular people, always eager to help. Explorers Virtuoso ISTP-A / ISTP-T Bold and practical experimenters, masters of all kinds of tools. Adventurer ISFP-A / ISFP-T Flexible and charming artists, always ready to explore and experience something new. Entrepreneur ESTP-A / ESTP-T Smart, energetic and very perceptive people, who truly enjoy living on the edge. Entertainer ESFP-A / ESFP-T Spontaneous, energetic and enthusiastic people – life is never boring around them."
