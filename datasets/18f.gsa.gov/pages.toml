["https://18f.gsa.gov/work-with-us"]
title = "18F: Digital service delivery | Work with us"
description = "Looking for U.S. government information and services?"
full_description = "Work with us As federal employees, 18F shares your dedication to serving the American public. Transform the way you work Because 87% of large government IT projects don't succeed, public sector approaches need to adjust. 18F believes projects have the best chance for success when agency leaders and staff are closely involved in developing the solutions they need. Our team of experts: Listen to understand your mission, goals and applicable rules or regulations. Evaluate the landscape to help you navigate the technology and product decisions. Prototype ideas to ensure they are viable for your context. Then, we draw from our expertise to create an actionable strategy. Together, we create the best outcomes for your mission and the people you serve. Tech that adapts and grows with your needs 18F engagements are designed to end. Since we’re part of the federal government, we don’t have a vested interest in extending engagements unnecessarily or selling you things you don’t need. Instead, we involve your team in creating solutions and ensure they have everything they need to maintain and improve systems long after we’re gone. Choose the path that’s best for your mission and your users We don’t offer one-size-fits-all solutions. Instead, we work with you to design the right path for your organization and make sure that you feel confident about each step. We believe in “demos not memos,” so everything we do is intended to be a step toward working software. Some software projects are the right size and shape for 18F to build with you; others will require you to hire an outside vendor. We can help you to understand what kind of project you have, and if you need a vendor, to hire one that can respond to your changing needs and deliver working software to you on a regular basis. Service offerings 18F teams consist of highly-qualified designers, engineers, product managers, and procurement specialists. In each engagement, we take the time to understand your mission and the challenges you confront. Then, we draw from our expertise to create practical solutions to deliver the best outcomes for you and the people you serve and set you up for success over time. In each engagement, we take the time to understand your mission and the challenges you confront. We draw from our deep well of technical expertise in these areas to deliver the best solution for you and your unique challenges: Digital strategy and modernization. Leveraging the latest technologies to transform federal services, making them more accessible and efficient for all. User experience design. Crafting digital services with empathy and precision to ensure inclusivity and clarity for users from all walks of life. Acquisition help. Using lightweight methods to hire software development teams that use modern approaches to incrementally build digital products centered around user needs. IDEA compliance and advancement. Not only meeting the requirements of the 21st Century IDEA but also pioneering beyond them to set new benchmarks for digital service delivery. Content architecture and governance. Structuring information architecture to facilitate intuitive navigation and robust governance across digital platforms. Visual design and branding. Establishing a visual identity that fosters trust and reflects the government’s dedication to serving the public. Usability research and data-driven assessments. Conducting comprehensive research to understand public needs, employing data to enhance the quality and effectiveness of services. Some of our typical offerings include: Strategy Development The first step toward success starts with a viable strategy. 18F strategy development teams help you wrangle complex service problems and develop a plan to achieve your goals. To create your strategy, we assemble a team with the right expertise to help you get a hold of your challenge. We draw on our experience and technical skills to develop a strategy based on rigorous research. We prototype solutions and test them with your stakeholders and users. These steps will help ensure that the strategy we recommend is viable and will satisfy both user needs and business goals, so you feel confident about each step. Vendor Acquisition Support Some software projects are the right size and shape for 18F to build with you; others will require you to hire an outside vendor. We can help you hire a vendor that can respond to your changing needs and deliver working software to you on a regular basis. We’ll help you issue and manage a procurement, from RFI to post-award. Website Modernization Your website is the primary channel for the public to learn about and interact with your agency. By partnering with 18F, you can better understand how and why people use your website, and use that understanding to serve them more effectively. 18F partners gain access to a specialized team focused on the nuances of customer experience. With us, you will be able to prototype new services, implement improvements, and get the tools and coaching to manage your new site. Digital Service Transformation Research, prototype, launch, and manage your digital products from start to finish. Get support and coaching on how to continually improve on your success. 18F helps you understand what your users need, then design, build, and support the right systems to help you excel at serving them. We’ll work with you to ensure you can maintain and grow services over time. Get hands-on support to modernize your approach to customer experience and technical management. As you build and run your projects, we coach you on how to use 18F’s methods to build a solid foundation for continued growth and success. To take the next step, email us at inquiries18F@gsa.gov and tell us what your needs are. Browse our guides We want agencies to be able to do the work themselves. Here is a free guide that helps. De-risking Guide Browse our guides Read related case studies Read short project summaries demonstrating how we’ve helped some of the largest federal agencies. Rethinking how the FEC provides data, instructions, and legal resources to the public. Implementing the Digital Accountability and Transparency Act with the Department of the Treasury. Read our case studies"
year_published = 2025
clearnet = "https://18f.gsa.gov/work-with-us"
