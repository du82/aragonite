full_description = "Our work See how we’ve helped agencies deliver value to the American people. Since 2014, 18F has worked with federal, state, and local agencies to improve the user experience of government. Get in touch to talk about how we can work together. Get in touch Case studies U.S. Forest Service Make land permits available online Using prototypes and modular contracting to help the Forest Service buy and develop an online permitting system. Alaska Department of Health and Social Services Modernize access to healthcare Introducing modern digital methods to the State of Alaska’s eligibility system modernization project. Department of Justice Transform the process for civil rights complaints Developing a user-friendly online submission experience for the civil rights complaint portal. U.S. Tax Court Make it easier to resolve tax disputes Developing a new petition and document-filing experience for taxpayers without lawyers, and a better case management workflow for Tax Court employees. Department of the Treasury Implementing a government-wide law Implementing the Digital Accountability and Transparency Act with one of the largest government-wide agile projects ever undertaken. Department of State Redesign an essential tool Combining our technical expertise with USKPA's program knowledge to improve the tracking of rough diamonds. “ 18F’s philosophy to build everything openly by default has been a key success factor in our ability to build credibility with the external stakeholders who have been critical of us previously. More importantly, this way of building facilitates innovation in an eco-centric manner as opposed to just within the government or a few entities. —Christina Ho, Former Deputy Assistant Secretary Office of Accounting Policy & Financial Transparency, Department of the Treasury Some agencies we’ve worked with U.S. Air Force U.S. Army U.S. Marine Corps U.S. Navy U.S. Forest Service Centers for Medicare and Medicaid Services Consumer Financial P