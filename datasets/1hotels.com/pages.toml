 favor and stop by our sustainable pop-ups. Do More Gather Our social spaces are designed to adapt nimbly to just about any event—intimate ceremony, work, all-out celebration, and more—with turnkey planning and curated seasonal menus by Chef Jonathan Waxman. View Our Spaces Offers View all ENDS March 19 Sleep Central Park Winter Solstice Up to 30% off your stay $30 dining credit Flexible cancellation Sleep Central Park Thanksgiving Parade View View of The Macy's Day Parade Sleep Central Park Give Green, Get Green Up to 30% off your stay and $30 hotel credit Sleep Central Park Rest & Refresh Up to 30% off your stay and daily smoothie Sleep Taste Central Park Sleep Suite Up to 30% off your stay and Jams Credit Sleep Central Park Free to Park, Free to Explore Up to 30% off your stay and parking Sleep Central Park Relax and Stroll Enjoy hassle-free travel with a Joolz Aer+ Stroller or Carrycot rental during your stay. Sleep Taste Central Park 1 Right Way to Start the Day Up to 30% off your stay and daily $60 breakfast credit Sleep Do Taste Central Park Be Well At 1 Up to 30% off your stay and Personal Training Session Nature is Home in Central Park Geography Climate Flora Fauna Natural Attractions Sustainability Geography Central Park was one of the first American parks designed and developed by landscape architects. Spanning 843 acres, its terrain ranges from flat grassy fields and slight slopes to luscious groves and rocky ravines. Close Climate Central Park winters tend to be snowy, windy and cold, followed by a brisk spring with fresh blossoms and warm sunlight. Warm, humid summers transition into crisp, vibrant autumns that allure so many people around the world. Temperatures typically vary from 28°F to 85°F, rarely falling below 15°F or above 92°F, lending an ideal setting for those who love to experience the passing of the seasons. Close Flora Stroll through canopies of Flowering Dogwood, Northern Red Oak, Pin Oak, Black Walnut, American Elm, and American Sycamore—all of which are native to New York. Gorgeous species such as Bloodroot, Common Yarrow, Cardinal Flower, Mayapple, Eastern Redbud, and Staghorn Sumac bloom and burst with vibrancy in the spring and summer. Close Fauna Central Park is home to diverse woodland fauna, from squirrels and chipmunks to over 300 species of birds. Keep an eye out for owls, woodpeckers, ducks, and red-tail hawks. In the warmer months, you might be lucky enough to catch a glimpse of soaring blue jays, sparrows, or goldfinches in the sky and sunbathing turtles in the water. Close Natural Attractions In addition to the park itself, the “Great Trees” of Central Park are some of the most beautiful hidden gems of the city. From blossoming Yoshino Cherry Trees on the reservoir’s east side to the grove of American Elms that drape over Central Park’s Literary Walk, there’s no shortage of natural beauty in this part of the city. Stroll over to The Cop Cot near the 6th Avenue Entrance to see the largest wooden structure in Central Park, perched atop a small hill that boasts spectacular views of the park and city skyline. Or opt to gaze at rippling reflections of the skyline in the 20-acre Central Park Lake, the perfect spot for birdwatching or strolling in the sunlight. Close Sustainability Central Park is often referred to as “The Green Heart of the Big Apple.” The incredible trees in and around the park work to purify and renew the air outside the concrete jungle, filter the rainwater, and combat the urban heat island effect. With growing sustainable initiatives such as waste management systems, water recovery systems, leaf composting, and expanding recycling infrastructure, New York City remains inspired and motivated to protect this world-famous biodiverse space. Close Follow your favorite moments @1hotel.centralpark #1hotelcentralpark https://www.instagram.com/1hotel.centralpark/ https://www.tiktok.com/@1hotels?lang=en https://www.facebook.com/1hotelcentralpark/ Photo by: biasiqueira, Captions r