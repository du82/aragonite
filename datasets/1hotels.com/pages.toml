["https://1hotels.com/privacy-policy"]
title = "Privacy Policy - 1 Hotel"
description = "We are committed to respecting the privacy of all users. This Privacy Statement informs you of the information we collect from you, & how it's used & shared."
full_description = '''Privacy Policy SH GROUP'S COMMITMENT TO PRIVACY Effective Date/Last Updated: March 1, 2023 Your privacy is important to SH Group Operations, L.L.C. and its affiliates ("SH Group," “us,” “we,” “our”), including 1 Hotels, Baccarat Hotels & Resorts, Treehouse Hotels, and SH Collection. To better protect your privacy, we are providing information explaining our information practices (in both an online and offline context). This Privacy Policy describes how we gather and use Personal Information of visitors of our websites, guests at our hotels, and anyone who applies for a job with us. “Personal Information” means information that uniquely identifies, relates to, describes, or is reasonably capable of being associated with or linked to an individual. It is important that you read this Privacy Policy together with any other privacy notice or fair processing notice we may provide on specific occasions (for example, when you visit our spas) when we are collecting or processing Personal Information about you so that you are fully aware of how and why we are using your data. This Privacy Policy supplements the other notices and is not intended to override them. By accessing our website or otherwise using our services, you acknowledge that you have read, understood, and agree to the practices as described in this Privacy Policy. This Privacy Policy is provided in a layered format, so you can click through to the specific areas set out below: 1. The Personal Data we collect about you 2. Collection of Personal Information From Children 3. How we obtain your Personal Data and Other Data 4. How we use your Personal Data and Other Data 5. Disclosure of Personal Data and Other Data 6. How we keep your Personal Data secure 7. How long we retain your Personal Data for 8. International transfers of your Personal Data CHANGES TO THIS PRIVACY POLICY AND YOUR PERSONAL Information If we make material changes to how we treat our users' and guests’ Personal Information, we will notify you by e-mail to the primary e-mail address specified in your account and/or possibly through a notice on our websites’ home pages. The date the Privacy Policy was last revised is identified at the top of the page. You are responsible for ensuring we have an up-to-date active and deliverable e-mail address for you, and for periodically visiting our websites and this Privacy Policy to check for any changes. Occasionally, at our discretion, we may include or offer third-party products or services on our websites. These third-party sites have separate and independent privacy policies. We therefore have no responsibility or liability for the content and activities of these linked sites. We urge you to read the privacy policies of other websites before submitting any information to those websites. THE PERSONAL DATA WE COLLECT ABOUT YOU SH Group, 1 Hotels, Baccarat Hotels & Resorts, Treehouse Hotels, The Jeremy Hotel and Princeville Resort collects the following types of Personal Information in both an online and offline context, when providing you with our products and services and when you apply for a job with us: Name Gender Postal address Telephone number Email address Credit and debit card number or other payment data Financial Information in limited circumstances such as residential services Language preference Date and place of birth Nationality, passport, visa or other government-issued identification data Important dates, such as birthdays, anniversaries and special occasions Travel itinerary, tour group or activity data Prior guest stays, or interactions, goods and services purchased, special service and amenity requests Geolocation information Social media account ID, profile photo and other data publicly available Surveillance information, such as facial references and thermal images, digital images and video and audio data via security or surveillance cameras located in public areas, such as hallways and lobbies, in our properties Guest preferences and personalized data such as your interests, activities, hobbies, food and beverage choices, services and amenities of which you advise us or which we learn about during your visit. When you apply for a job with us, we also collect Personal Information including: Your resume or CV, cover letter, previous and/or relevant work experience or other experience, education, transcripts, or other information you provide to us in support of an application and/or the application and recruitment process; Information from interviews you may have, if any; Details of the type of employment you are looking for, current and/or desired salary and other terms relating to compensation and benefits packages, and job preferences; Details of how you heard about the position you are applying for; Any sensitive and/or demographic information obtained during the hiring process such as Social Security number, gender, information about your citizenship and/or nationality, medical or health information, and/or your racial or ethnic origin; Reference information and/or information received from background checks (as applicable), including information provided by third parties; Information relating to any previous applications you may have submitted to SH Group and/or any previous employment history with SH Group; Information about your educational and professional background from publicly available sources that we believe is relevant to your application or a potential future application (e.g., your LinkedIn profile); MERCHANDISE PURCHASES To make purchases through our website, you submit your name, payment card information, and billing address. All payment card information is provided directly to our third-party service provider, Shopify. We may keep a record of your purchases. COLLECTION OF PERSONAL DATA FROM CHILDREN Our websites are not intended for children under 18 years of age. No one under age 18 may provide any information to or on our websites. We do not knowingly collect Personal Information from children under 18. If you are under 18, do not use or provide any information on our websites or on or through any of its features, use any of the interactive or public comment features of the websites or provide any information about yourself to us, including your name, address, telephone number, e-mail address or any user name you may use. If we learn we have collected or received Personal Information from a child under 18 without verification of parental consent, we will delete that information. If you believe we might have any information from or about a child under 18, please contact us at [email protected]. HOW WE OBTAIN YOUR PERSONAL INFORMATION AND OTHER DATA We collect your Personal Information in a variety of ways: Online Services. Personal Information is collected through online services either directly or through an affiliate booking website. Reservation Process Check out process for electronic folio receipts Purchase goods or services through the website or ecommerce website hosted by Shopify Communication via email Digital and thermal image capture Connect or post to social media related to the properties Participate in a survey, contest or promotional offer Property Visits. Personal Information is collected when guests visit our properties or use on property services and outlets Restaurants Concierge services Health clubs Spas When you apply for a job with us Offline Interactions. Personal Information is collected when individuals attend promotional events that we host or in which we participate, or when you provide your Personal Information to facilitate an event. Reservations and Customer Service Centers. Personal Information is collected when you make a reservation over the phone, communicate with us by email, fax or contact customer service. These communications may be recorded for purposes of quality assurance and training. Other Sources. Personal Information is also collected from other sources, such as public databases, joint marketing partners and other third parties. Internet-Connected Devices. Personal Details collected from internet-connected devices available in our properties. For example, a smart assistant device may be available for your use and to tailor your accommodations and experience. “Other Data” are data that generally do not reveal your specific identity or do not directly relate to an individual. To the extent Other Data reveal your specific identity or relate to an individual, we will treat Other Data as Personal Information. Other Data includes: Browser and device data App usage data Data collected through cookies, pixel tags and other technologies Demographic data and other data provided by you Aggregated data WE COLLECT OTHER DATA IN A VARIETY OF WAYS Your browser or device. We collect certain data through your browser or automatically through your device, such as your Media Access Control (MAC) address, computer type (Windows or Macintosh), screen resolution, operating system name and version, device manufacturer and model, language, internet browser type and version and the name and version of the Online Services (such as the Apps) you are using. We use this data to ensure that the Online Services function properly Cookies. We collect certain data from cookies, which are pieces of data stored directly on the computer or mobile device that you are using. Cookies allow us to collect data such as browser type, time spent on the Online Services, pages visited, referring URL, language preferences, and other aggregated traffic data. We use the data for security purposes, to facilitate navigation, to display data more effectively, to collect statistical data, to personalize your experience while using the Online Services and to recognize your computer to assist your use of the Online Services. We also gather statistical data about use of the Online Services to continually improve design and functionality, understand how they are used and assist us with resolving questions. Pixel Tags and Other Similar Technologies. We collect data from pixel tags (also known as web beacons and clear GIFs), which are used with some Online Services to, among other things, track the actions of users of the Online Services (including email recipients), measure the success of our marketing campaigns and compile statistics about usage of the Online Services. Analytics. We collect data through Google Analytics and Adobe Analytics, which use cookies and technologies to collect and analyze data about use of the Services. These services collect data regarding the use of other websites, apps and online resources. You can learn about Google’s practices by going to https://policies.google.com/technologies/partner-sites and opt out by downloading the Google Analytics opt out browser add-on, available at https://tools.google.com/dlpage/gaoptout.You can learn more about Adobe and opt out by visiting http://www.adobe.com/privacy/opt-out.html. Your IP Address. We collect your IP address, a number that is automatically assigned to the computer that you are using by your Internet Service Provider (ISP). An IP address is identified and logged automatically in our server log files when a user accesses the Online Services, along with the time of the visit and the pages that were visited. We use IP addresses to calculate usage levels, diagnose server problems and administer the Online Services. We also may derive your approximate location from your IP address. Aggregated Data. We may aggregate data that we have collected, and this aggregated data will not personally identify you or any other user. HOW WE USE YOUR PERSONAL Information AND OTHER DATA We use Personal Information and Other Data to provide you with goods and Services, to develop new offerings and to protect SH Group, 1 Hotels, Baccarat Hotels & Resorts, Treehouse Hotels, The Jeremy Hotel and Princeville Resort and our guests as detailed below. In some instances, we will request that you provide Personal Information or Other Data to us directly. If you do not provide the data that we request, or prohibit us from collecting such data, we may not be able to provide the requested Services. We will let you know if this is ever the case. We use Personal Information and Other Data for the following purposes: To facilitate reservations, payment, send administrative information, confirmations or prearrival messages, to assist you with meetings and events and to provide you with other information about the area and the property at which you are scheduled to visit. To support our electronic receipt program. When you provide an email address in making a reservation, we use that email address to send you a copy of your bill. If you make a reservation for another person using your email address, that person's bill will be emailed to you, as well. Personalize the Services according to your Personal Preferences. We use Personal Information and Other Data to personalize the Services and improve your experiences, including when you contact our reservations center, visit one of our properties or use the Online Services, to customize your experience according to your Personal Preferences and present offers tailored to your Personal Preferences. To enroll you in and facilitate our loyalty program. To fulfill orders you place on our website. Communicate with you about goods and services according to your Personal Preferences. We use Personal Information and Other Data to send you marketing communications and promotional offers, as well as periodic customer satisfaction, market research or quality assurance surveys. Sweepstakes, activities, events and promotions. We use Personal Information and Other Data to allow you to participate in sweepstakes, contests and other promotions and to administer these activities. Some of these activities have additional rules and may contain additional information about how we use and disclose your Personal Information. We suggest that you read any such rules carefully. For data analysis, audits, public health and societal wellbeing security and fraud monitoring and prevention (including with the use of closed-circuit television, card keys, and other security systems). For developing new goods and services, enhancing, improving or modifying our Services, identifying usage trends, determining the effectiveness of our promotional campaigns and operating and expanding our business activities. We use credit card data or other payment data for invoicing purposes. If you apply for a job with us, we will also use Personal Information for the following purposes: To process your job application, to verify the information you have provided in your application, to communicate with you regarding your application, to answer your questions regarding the application process and to confirm your eligibility for a position. We may also save your information for future job openings within SH Group. To conduct interviews. To perform background and reference checks, with your con'''
year_published = 2025
