title = "Riverhouse 2 BR Hotel Suite - 1 Hotel Brooklyn Bridge"
description = "Welcome to your 2,000 square foot, 2 bedroom retreat. With two king bedrooms, thoughtful touches bring nature and comfort to your suite."
full_description = "Floorplan247 360 Tour247 Gallery247 Riverhouse Welcome to your 2,000 square foot, 2 bedroom retreat. With two king bedrooms, thoughtful touches bring nature and comfort to your suite, like a carved stone soaking tub, curated minibar with house-made cocktail recipes and original artwork from local artisans. Best of all, the suite includes amazing perks: Nightly turndown service (upon request) Priority seating at our restaurants and bars (based upon availability) Complimentary mini bar snacks and refreshing non-alcoholic beverages $100 Hotel credit per stay Complimentary 50-minute deep tissue massage at Bamford Wellness Spa Daily breakfast for two ($50 credit) Early check-in and late check-out (based upon availability) Priority Audi experience (based upon availability) Average Size: 2000 sq.ft. | 185 sq.m. Panoramic Views 2 King Beds 4 People Separate Rain Shower Separate Living Room Floor to Ceiling Windows High Floor Accessible Details Suite Perks Book This Room Check In Wednesday 5 Mar, ▼ Check Out Thursday 6 Mar, ▼ Check Availability All Rooms Include Pet Friendly Free WiFi LCD 55 Television Keetsa Mattress Cotton Bedding Filtered Water Taps Coffee Machine Bamford Bath Products Soft Cotton Robes Cotton Slippers Yoga Mat Digital Newspapers 1 Hotels Mobile App Hairdryer Full-length Mirror HEPA Air Filters In-Room Greenery Smoke Free The Bed The Riverhouse features two king bed rooms and a room with two double beds. All beds have been made with the comfortable, all-natural elements of custom organic cotton mattresses by Keetsa, sustainably sourced linens, and corrugated leather headboards. The Bathroom Refresh with a triple-filtered rain shower and chiseled stone tub with Bamford amenities surrounded by Natal mahogany and marble. Relax in your cotton-knit towels, robe, and socks. Living Space Furnishings, of a wood and stone dining table for ten and leather sofa, bring nature into your space. See Dumbo on your two bicycles. Stream content from your device on the 55-inch television. Brooklyn Made Inspired by nature. Made in Brooklyn. Many of the design details in your room are by local artisans, from the “crate” inspired, open-slatted wood closets, to the cloud of lampshades grown from mushroom mycelium that span the ceiling of the Riverhouse suite. Explore Offers View all Offers ENDS March 20 Sleep Brooklyn Bridge Winter Solstice Up to 30% off your stay $30 Dining Credit Bamford Wellness Spa treatment discount Flexible cancellation Sleep Brooklyn Bridge Give Green, Get Green Up to 40% off your stay & $30 hotel credit Sleep Brooklyn Bridge 1 Right Way To Start The Day Fuel your day with a $50 breakfast credit Sleep Brooklyn Bridge Sleep Suite Enjoy a $100 Food and Beverage credit Sleep Brooklyn Bridge Starlit Sleepover Children’s tent set up Galaxy Star Projector in-room Freshly baked cookies and milk Family-Friendly Movie and Popcorn & Candy Sleep Brooklyn Bridge Home at 1 Enjoy a $100 food and beverage credit plus a $50 daily breakfast credit Sleep Brooklyn Bridge Relax & Stroll Enjoy hassle-free travel with a Joolz Aer+ Stroller or Carrycot rental during your stay. Sleep Brooklyn Bridge Relax at Bamford Wellness Spa Decompress with a $100 Credit to Bamford Wellness Spa Other Rooms You May Like Floorplan156 Liberty Studio Suite Gallery156 Liberty Studio Suite Liberty Studio Suite Skyline View King Bed 4 People Rain Shower Only Living Area Sofa Bed Floor to Ceiling Windows Suite Perks Average Size: 456 sq.ft. | 42 sq.m. View Details Liberty Studio Suite Floorplan159 Bridge Studio Suite 360 Tour159 Bridge Studio Suite Gallery159 Bridge Studio Suite Bridge Studio Suite Bridge View King Bed 4 People Rain Shower Only Sofa Bed Living Area Floor to Ceiling Windows Suite Perks Average Size: 480 sq.ft. | 44 sq.m. View Details Bridge Studio Suite 360 Tour246 Skyline 1 Bedroom Suite Gallery246 Skyline 1 Bedroom Suite Skyline 1 Bedroom Suite Skyline View King Bed 4 People Separate Rain Shower Living Area Sofa Bed Accessible Details Suite Perks Average Size: 560 sq.ft. | 52 sq.m. View Details Skyline 1 Bedroom Suite Hotel Policies CANCELLATION POLICY GUARANTEED RESERVATION EARLY ARRIVAL/LATE DEPARTURE TAXES & FEES PET POLICY FREQUENTLY ASKED QUESTIONS CANCELLATION POLICY CANCELLATION POLICY Pay Now Rates: Non-refundable, fully pre-paid. You will not receive a refund on these rates, even with 24 hours notice or more of cancellation. Pay Later Rates: Pay Later reservations require a 1 night deposit taken at time of booking for all suites. For any cancellations on Pay Later Rates for standard guestrooms, notice by 12pm on the day before arrival is required to avoid fee. 72 hours notice is required on Specialty Units, including Neighboring/Connecting Rooms and Liberty Studio Suite, Bridge Studio Suite, and Skyline 1 Bedroom Suite categories. 7 days notice required on reservations for the Riverhouse Suite. GUARANTEED RESERVATION GUARANTEED RESERVATION Reservations must be guaranteed by a major credit card when you book. Blackout dates are subject to their own rules. For security purposes, please provide a valid government or state-issued photo ID at check-in. To cover incidentals, we’ll hold $250/day on your credit card. Know there is a smoking fee of $350/room and $500/suite. EARLY ARRIVAL/LATE DEPARTURE EARLY ARRIVAL/LATE DEPARTURE Check in time is after 4:00 pm and check out time is 12:00 pm. Book an early flight? Want to sleep in? We’ll do our very best to accommodate you – just let us know in advance. If we can’t, we’ll gladly stow your luggage safely and securely, until you’re ready to move on. There is an early departure fee of one night’s stay plus tax. Late check-out fees apply after 12pm. TAXES & FEES TAXES & FEES Standard New York City taxes are applied to all reservations. A daily $45 amenity fee per room, exclusive of tax, is applied at the time of check-in. This fee is separate from your room rate and offers unique amenities including: Audi e-tron house car service Mind and Movement fitness and wellness experiences Nature-inspired programming and events Lobby Farmstand with fresh seasonal fruit Pet beds for our four-legged guests PET POLICY PET POLICY Your pet is welcome here! Just add them to your reservation when you book online, or reach out to us to let us know they'll be joining you. If your room gets dirty, a $250 cleaning fee will be added at the end of your stay. Please familiarize yourself with the house rules. FREQUENTLY ASKED QUESTIONS FREQUENTLY ASKED QUESTIONS Looking for more information about 1 Hotel Brooklyn Bridge? Visit our Frequently Asked Questions page for all of the answers."
