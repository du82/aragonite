sments and environmental sanitation tax are applied to all reservations. Daily housekeeping is included in room rates. PETS PETS Unfortunately, pets are not allowed. Service animals are always welcome. To book a stay with your service animal, please contact our reservations team by phone at 855.268.2681 (US) or +52 624.689.0600 (Mexico). SMOKING SMOKING 1 Homes Cabo is a smoke-free property. Smoking in homes will incur a fee of $400 USD per home. RULES OF OPERATION RULES OF OPERATION To ensure the safety of all guests and residents and provide a quiet relaxing atmosphere, please review our rules of operation. GENERAL GENERAL Reception is staffed 24 hours a day, seven days a week. Check-in starts at 3pm, and check-out time is 12pm. Daily housekeeping service is included in room rates. All homes offer private bathrooms. No minimum length of stay is required (exceptions may apply for select dates). FREQUENTLY ASKED QUESTIONS FREQUENTLY ASKED QUESTIONS Looking for more information about 1 Hotel Cabo? Visit our Frequently Asked Questions page for all of the answers.'
