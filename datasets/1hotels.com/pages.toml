["https://1hotels.com/accessibility"]
title = "Accessibility - 1 Hotel"
description = "Our website and hotels are designed for everyone. We want everyone who visits to feel welcome and find the experience accessible and rewarding."
full_description = "Accessibility Our website and hotels are designed for everyone. Website Accessibility What are we doing? To help us make the 1 Hotels website a positive place for everyone, we've been using the Web Content Accessibility Guidelines (WCAG) 2.1. These guidelines explain how to make web content more accessible for people with disabilities, and user friendly for everyone. The guidelines have three levels of accessibility (A, AA and AAA). We’ve chosen Level AA as the target for the 1 Hotels website. How are we doing it? We've worked hard on the 1 Hotels website and believe we've achieved our goal of Level AA accessibility. We monitor the website regularly to maintain this, but if you do find any problems, please get in touch. Let us know what you think. If you enjoyed using the 1 Hotels website, or if you had trouble with any part of it, please get in touch. We'd like to hear from you in any of the following ways: Call Us: 833.623.0111 Message Us: 1hotels.com/contact-us Our hotels are places for everyone Hotel Accessibility North America Brooklyn Bridge Central Park Hanalei Bay Nashville San Francisco Seattle South Beach Toronto West Hollywood Europe Copenhagen Mayfair Asia Pacific Melbourne"
