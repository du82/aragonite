full_description = '''Contact 1 Hotel Brooklyn Bridge Planning an upcoming trip to New York City? We’d love to help you make the most of your time. Feel free to contact us to make a reservation at 1 Hotel Brooklyn Bridge, update an existing hotel reservation, or accommodate any special requests. Simply fill out the contact form below or call us. Reservations: 833.625.6111 | Hotel: 347.696.2500 | Fax: 347.696.2599 <div class="antibot-no-js antibot-message antibot-message-warning">You must have JavaScript enabled to use this form.</div> Let's start a conversation All information marked with an * is required Choose a property - Select -Brand/OtherBrooklyn BridgeCaboCentral ParkCopenhagenHaitang BayHanalei BayMayfairMelbourneNashvilleSan FranciscoSeattleSouth BeachTorontoWest Hollywood First Name Last Name Email Phone Number Reason for contact - Select -ReservationsGuest Services & ConciergeMeetings & EventsMedia & PartnershipsCareersOther Reason for contact - Select -DevelopmentMedia & PartnershipsCareersOther Reason for contact - Select -ReservationsGuest Services & ConciergeOther Reason for contact - Select -ReservationsGuest Services & ConciergeMeetings & EventsMedia & PartnershipsCareersResidencesOther Thank you for your interest in a career with 1 Hotels. Please visit careers.shhotelsandresorts.com to learn more about our company, culture, benefits, and opportunities. How can we assist you? Leave this field blank Media Contacts Elizabeth Traub Managing Partner EJ Media Group[email protected]646.701.7042 Brad Zeifman Principal S H A D O W[email protected]212.972.0277 Hotel Policies CANCELLATION POLICY GUARANTEED RESERVATION EARLY ARRIVAL/LATE DEPARTURE TAXES & FEES PET POLICY FREQUENTLY ASKED QUESTIONS CANCELLATION POLICY CANCELLATION POLICY Pay Now Rates: Non-refundable, fully pre-paid. You will not receive a refund on these rates, even with 24 hours notice or more of cancellation. Pay Later Rates: Pay Later reservations require a 1 night deposit taken at time of booking for all suites. For any cancellations on Pay Later Rates for standard guestrooms, notice by 12pm on the day before arrival is required to avoid fee. 72 hours notice is required on Specialty Units, including Neighboring/Connecting Rooms and Liberty Studio Suite, Bridge Studio Suite, and Skyline 1 Bedroom Suite categories. 7 days notice required on reservations for the Riverhouse Suite. GUARANTEED RESERVATION GUARANTEED RESERVATION Reservations must be guaranteed by a major credit card when you book. Blackout dates are subject to their own rules. For security purposes, please provide a valid government or state-issued photo ID at check-in. To cover incidentals, we’ll hold $250/day on your credit card. Know there is a smoking fee of $350/room and $500/suite. EARLY ARRIVAL/LATE DEPARTURE EARLY ARRIVAL/LATE DEPARTURE Check in time is after 4:00 pm and check out time is 12:00 pm. Book an early flight? Want to sleep in? We’ll do our very best to accommodate you – just let us know in advance. If we can’t, we’ll gladly stow your luggage safely and securely, until you’re ready to move on. There is an early departure fee of one night’s stay plus tax. Late check-out fees apply after 12pm. TAXES & FEES TAXES & FEES Standard New York City taxes are applied to all reservations. A daily $45 amenity fee per room, exclusive of tax, is applied at the time of check-in. This fee is separate from your room rate and offers unique amenities including: Audi e-tron house car service Mind and Movement fitness and wellness experiences Nature-inspired programming and events Lobby Farmstand with fresh seasonal fruit Pet beds for our four-legged guests PET POLICY PET POLICY Your pet is welcome here! Just add them to your reservation when you book online, or reach out to us to let us know they'll be joining you. If your room gets dirty, a $250 cleaning fee will be added at the end of your stay. Please familiarize yourself with the house rules. FREQUENTLY ASKED QUESTIONS FREQUENTLY ASKED QUESTIONS Looking for more information about 1 Hotel Brooklyn Bridge? Visit our Frequently Asked Questions page for all of the answers. Legend Our Location 1 Hotel Brooklyn Bridge 60 Furman Street Brooklyn, NY 11201 Get Directions Located at Pier 1 on Brooklyn Bridge Park, just south of the iconic bridge in the Brooklyn Heights neighborhood and minutes from downtown Manhattan. Our Locations Locations marked with an * are sprouting soon North America Cabo Cabo San Lucas, Mexico Central Park New York City, NY Hanalei Bay Kauai, HI Nashville Nashville, TN San Francisco San Francisco, CA Seattle Seattle, WA South Beach Miami Beach, FL Toronto Toronto, Canada West Hollywood West Hollywood, CA Europe Copenhagen Copenhagen, Denmark Mayfair London, UK Asia Pacific Haitang Bay Sanya, China Melbourne Melbourne, Australia'''
