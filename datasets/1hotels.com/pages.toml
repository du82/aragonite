full_description = 'MISSION BY 1 HOTELS TERMS & CONDITIONS PLEASE READ THESE TERMS AND CONDITIONS CAREFULLY. By accessing or using the Mission by 1 Hotels Loyalty Program (“Loyalty Program”), you agree to be bound by all the terms described herein or incorporated by reference. If you do not agree to all the terms, do not participate in the Loyalty Program. These Terms and Conditions (“Terms”) apply to your participation as a member in the Loyalty Program, which is operated by SH Group Hotels & Residences, U.S., LLC (“SH”). SH may change the Loyalty Program rules, conditions, benefits, or awards pertaining to the Loyalty Program at any time without notice. Awards and associated benefits may be subject to taxes. Any required disclosure and tax liability is your sole responsibility. Participation in the Loyalty Program, the awarding and redemption of Loyalty Program offers are void where prohibited by law, and are subject to applicable government regulations. These Terms may only be modified in writing by SH. PLEASE NOTE: THESE TERMS CONTAIN AN AGREEMENT BY YOU TO RESOLVE DISPUTES ARISING FROM THESE TERMS OR YOUR PARTICIPATION IN THE LOYALTY PROGRAM THROUGH BINDING ARBITRATION ON AN INDIVIDUAL BASIS. PLEASE REVIEW THE ARBITRATION AGREEMENT BELOW SINCE YOU ARE GIVING UP CERTAIN RIGHTS, SUCH AS THE RIGHT TO A JURY TRIAL AND THE RIGHT TO SUE SH IN A CLASS ACTION LAWSUIT. 1. Eligibility. The Loyalty Program is free and available to any individual who is at or above the age of majority in his or her jurisdiction and resides in a jurisdiction which legally permits participation in the Loyalty Program. The Loyalty Program is not available to residents of Cuba, Iran, North Korea, Sudan, Syria, or the Crimea region of Ukraine. In order to enroll in the Loyalty Program, you must (i) provide valid and accurate personal information when enrolling and (ii) not have previously been terminated from any loyalty program by SH. Participants are only eligible to have one membership account. Joint accounts are not permitted. 2. Participating Properties. The following properties managed by SH participate in the Loyalty Program: 1 Hotel Brooklyn Bridge, 1 Hotel Central Park, 1 Hotel Hanalei Bay, 1 Hotel Mayfair, 1 Hotel Nashville, 1 Hotel San Francisco, 1 Hotel South Beach, 1 Hotel Toronto, and 1 Hotel West Hollywood (“Participating Property(ies)”) SH reserves the right to add or remove Participating Properties at any time in its sole discretion and without any liability or obligation to you. 3. Enrollment. Subject to the eligibility requirements set forth in Section 1 of these Terms, you may apply to the Loyalty Program by fully and accurately completing an application on the Loyalty Program website or at a Participating Property. Every application must include your current email address. SH reserves the right to deny membership in the Loyalty Program to any applicant in its sole discretion and without written notice. 4. Assignment of Membership Account and Membership Number. After applying to the Loyalty Program, a membership account will be opened, and a membership number will be assigned to you. Upon receiving your membership number, you become a member eligible to earn Points. 5. Duplicate Accounts. You may not have more than one Loyalty Program membership account at any time. If more than one membership number is assigned to you, you will only receive Points or Rewards for one membership account. Duplicate membership accounts are subject to cancellation in SH’s sole discretion. Duplicate membership accounts must be combined into a single membership account with one membership number and one points and rewards balance, and you are responsible for requesting account combination through the online form on the Loyalty Program’s website. Membership accounts cannot be combined in person at Participating Properties, through the Loyalty Program mobile application, or through other booking channels. Some account details may take up to three (3) days to post to a newly combined membership account. 6. Personal Profile. Information provided by you will be maintained in a personal preference profile (“Account Profile”) with your membership account. All information provided by you in your Account Profile must be valid and accurate and must be kept current. Credit card information included in your Account Profile will be used by Participating Properties to guarantee your stay and to pay for any stay and other charges, unless you provide a different credit card when you make a reservation, at check-in or at check-out. You may change your credit card authorization for future transactions in your Account Profile on the Loyalty Program website or you may contact Member Support at [email protected]. You can review your points and rewards balance and transaction history and update personal details and preferences in your Account Profile. Your membership number or user name and password are required to access the Loyalty Program website. 7. Use of Personal Information Collected in Application. The personal information you provide SH when completing the Loyalty Program application and redeeming Points and Give Back Rewards (defined below) is collected and otherwise handled in accordance with SH’s Privacy Statement, available at https://www.shhotelsandresorts.com/privacy-policy. Your provision of accurate information is necessary for SH to properly administer the Loyalty Program and provide each member with opportunities to maximize their membership benefits. By enrolling, you also consent to the transfer of your personal information to countries where our information processing facilities, business operations and hotels are located, including the United States and other countries where data protection laws may differ from those of your home country. 8. Loyalty Program Membership Benefits. 8.1 Member Rates. Loyalty Program members may receive an exclusive, preferred rate ("Mission Rate") when booking rooms through the Participating Properties’ or SH’s website or call center. The Mission Rate is only available at Participating Properties, and advanced reservations are required. The Mission Rate offers a discount of at least two percent (2%) off the Participating Property’s lowest applicable available public rates for non-premium rooms. The Mission Rate must be booked using the appropriate member rate category. The Mission Rate does not apply to groups of eight (8) or more guest rooms. The Mission Rate may not be combined with other select promotions, offers or discounts, and is not valid for existing reservations or groups. The Mission Rate does not apply to qualified transient rates such as government rates, negotiated rates, AAA rates, travel agent rates, or the Senior Discount rate. 8.2 Membership Tier Benefits. Members enjoy the benefits described below according to their Membership Tier*. In order to receive the Hotel Credit benefit, you must book your stay through your Loyalty Program account online and select the Hotel Credit rate plan specific to your Membership Tier. You will not receive the Hotel Credit if it is not selected during the reservation process. Earn 1 Point per $1 (USD) of Qualifying Charges* Exclusive Benefits Earn 5,000Points Annually* Earn 50,000Points Annually* Earn 75,000Points Annually* Birthday & Anniversary Surprises Exclusive Offers & Experiences First-to-Book Opportunities Complimentary Room Upgrade (Upon Availability) Complimentary Personal Training Sessions (Per Year) Hotel Credit (Per Stay) $15 $15 $100 Guaranteed Late Check-Out 1pm 1pm 2pm Give Back | Self Love Rewards 1% 2% 3% 4% * Membership Points are awarded based on the Qualifying Charges incurred by the Member at participating properties. SH reserves the right to modify the number of Membership Points awarded per dollar of Qualifying Charges incurred. Please see full Terms & Conditions for details on the number of points earned per dollar. Once you have reached a certain Membership Tier, you may keep such status for the remainder of the twelve-month period (as calculated starting from the date of your enrollment in the Loyalty Program) and for the subsequent twelve-month period. Earned points are reset to zero points on the first day of each twelve-month period, as calculated starting from the date of your enrollment in the Loyalty Program. ** Must book specific Mission tier-based rate to receive credit. Give Back Rewards. Members earn Give Back Rewards on Qualifying Charges accrued on a Qualifying Stay at a Qualifying Rate (defined below). Give Back Rewards may be redeemed for SH experiences or contributed to one of SH’s renewable energy partners, as described in more detail on the Loyalty Program website. 8.3 Earning Opportunities at Participating Properties. As a member, you will earn: (a) One Point for each U.S. dollar, or the local currency equivalent, that is incurred and paid by you for your room (excluding taxes and allowances). Points earned toward Membership Tier levels will be awarded after room charges are paid in full. (b) Give Back Rewards on a percentage of each U.S. dollar, or the local currency equivalent, that is incurred and paid on Qualifying Charges at Participating Properties. Give Back Rewards will be awarded up to thirty (30) days after checkout and your stay is validated. The Give Back Reward percentages are below, and are subject to change: Membership Tier Give Back Reward Percentage Seed 1% Give Back Rewards Root 2% Give Back Rewards Branch 3% Give Back Rewards Bloom 4% Give Back Rewards 8.4 Membership Tiers. Your Membership Tier is determined by the number of Points you earn annually (as calculated starting from the date of your enrollment in the Loyalty Program), subject to exclusions set forth herein. Any advancements in Membership Tier will occur on the fifth day of the month following the month in which your Point total reaches the minimum amount required for the next Membership Tier. Once you have reached a certain Membership Tier, you may keep such status for the remainder of the twelve month period (as calculated starting from the date of your enrollment in the Loyalty Program) and for the subsequent twelve month period (“Subsequent 12 Months”), even if you earn fewer than the required number of points to maintain such Membership Tier during the Subsequent 12 Months. Solely for the purpose of calculating your Membership Tier status, your earned points are re-set to zero points on the first day of each twelve month period, as calculated starting from the date of your enrollment in the Loyalty Program. Membership Tier Points Seed 0 - 4,999 Points Root 5,000 - 49,999 Points Branch 50,000 - 74,999 Points Bloom 75,000+ Points 8.5 Qualifying Charges. Qualifying Charges are incurred during a stay in a guest room, excluding all Non-Qualifying Charges (defined below), at a Participating Property by you and up to two (2) additional guest rooms. 8.6 Non-Qualifying Charges. Non-Qualifying Charges, which do not qualify for Give Back Rewards, include (but are not limited to) any complimentary services, Points redemption awards, promotional awards or any other fees or charges including, without limitation: (A) charges for banquets, meetings or other functions; (B) other fees paid including, without limitation, parking, business center, retail stores, and other third-party services; and (C) room rate related taxes, service charges, gratuities, fees (e.g., late cancellation fee or no-show fees), mandatory or automatic charges (e.g., resort charges) and other applicable charges. 8.7 Qualifying Stays. A “Stay" means all consecutive nights you register for and stay at any Participating Property for which the room is billed and paid for by you or a company or other person who has arranged payment for your stay that is not associated with a convention or group meeting. A “Qualifying Stay” is a stay of one or more consecutive nights at the same Participating Property, where you : (A) provide your membership number at the time of reservation or at check-in; (B) pay a Qualifying Rate; and (C) stay in one of the reserved guest rooms. If you check out of a guest room and then check back into a guest room at the same Participating Property within twenty-four (24) hours, it will count as a single stay for purposes of calculating Stays. You may only earn Give Back Rewards for up to three (3) guest rooms during any Qualifying Stay and only if you stay in one of the reserved guest rooms and pay a Qualifying Rate. A Qualifying Stay earns credit towards Give Back Rewards pursuant to these Terms. You cannot earn or receive benefits at multiple Participating Properties for the same Stay date(s). Only one member per guest room can earn Give Back Rewards. If there is more than one member staying in the same guest room, the member who pays the Qualifying Charges will be the only member who receives Give Back Rewards. 8.8 Qualifying Rates. A “Qualifying Rate” is the rate you pay for a Stay in a guest room at a Participating Property that qualifies to earn Give Back Rewards. Qualifying Rates must be booked directly on the Participating Property or SH’s website or through the Participating Property’s call center without application of a discount code, travel agent code, or special negotiated rate code. These include Standard and Premium Retail rates and Advance Purchase rates. The Mission Rate is a Qualifying Rate. Unless otherwise set forth herein, you will receive Give Back Rewards benefits only during Stays with Qualifying Rates. 8.9 Non-Qualifying Rates. A “Non-Qualifying Rate” is a rate you pay for a Stay in a guest room at a Participating Property which does not qualify to earn Give Back Rewards. Rates are Non-Qualifying if they are booked using any of the following methods or under the following circumstances: (a) Through a tour operator, online travel channel or other third-party channel including, without limitation, expedia.com, hotwire.com, priceline.com, orbitz.com, booking.com, and travelocity.com; (b) At a group rate as part of an event, meeting, conference or organized tour; (c) At a tour operator, wholesaler, or crew room rate, travel industry rates and organized tours or package bookings; (d) The guest room was complimentary; (e) A voucher or third-party award; or (f) Through a special government rate, negotiated rate, consortia rate, or special travel agency rate. 9. Points and Give Back Rewards Terms. 9.1 Points and Give Back Rewards Subject to Terms. The accumulation of Points and Give Back Rewards is subject to these Terms. You are responsible for reading these Terms, newsletters, and account statements in order to understand your rights, responsibilities, and status in the Loyalty Program, as well as the structure for earning Points and Give Back Rewards. 9.2 Credit for Stays Completed Prior to Enrollment: Points and Give Back Rewards may be earned for Qualifying Stays with a check-out date within thirty (30) days prior to your enrollment in the Loyalty Program. If cr'
