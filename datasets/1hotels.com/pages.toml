["https://1hotels.com/cabo/faq"]
title = "FAQ - 1 Homes Cabo"
description = "Find answers to frequently asked questions about 1 Homes Cabo, our amenities, policies, and more!"
full_description = '''Frequently Asked Questions General Do you allow smoking, or do you have designated smoking areas? 1 Homes Cabo is a smoke-free property. Smoking is prohibited in the units or common areas, except for certain designated areas and the beach. Do you have a House Car service? House Car service is currently unavailable at 1 Homes Cabo. Is there a restaurant on the property? Currently, we have a Food Truck at the Beach Club and a Grab and Go (Coffee and retail shop) in the lobby area. However, our sister property, Hacienda Beach Club and Residences houses the Hacienda Cocina & Cantina restaurant by the Hunan Group, and they provide Residence Service. Are photography and videography allowed? Due to the nature of the property, professional photography and videography are not permitted, except for pre-arranged and authorized events by management. For more information, please get in touch with the Guest Services department. Do you have an official app? We currently do not have an official app. However, our Guest Services team is available 24/7 to assist with any requests. What languages are spoken by the hotel staff? Primarily, Spanish and English. However, we have staff members who speak other languages such as French and Italian. Do you have air conditioning? Yes, all residences, villas, and certain consumption areas and common areas have air conditioning. What is the best way to contact the hotel? You can call the hotel at +52 (624) 689 0600 (Residential Complex) or by emailing [email protected]. Safety and Health Is it safe to swim at the beach? "El Medano" beach is the most popular and tourist-friendly beach in all of Los Cabos, located next to the Cabo San Lucas Marina. It offers multiple recreational activities for all ages and is very safe for swimming. Our staff constantly monitors the sea's status through the port captaincy and official reports, and they will provide you with information for your safety. Is it safe to walk around the city and the beach? Los Cabos is one of the safest tourist destinations in Mexico. In addition, 1 Homes Cabo is located in the heart of Cabo San Lucas, next to the Marina, where recreational activities occur for all ages. It is close to the city center and all the daytime and nighttime activities. Loyalty Do you have loyalty programs? Currently, there is no loyalty program for 1 Homes Cabo. Does the Mission by SH loyalty program apply? Currently, the program is only available in the hotels. Amenities What is the cost of wireless internet (Wi-Fi) access? Wi-Fi access is complimentary for our guests. Residences and villas have their passwords, which will be provided at check-in. What is the Wi-Fi speed in the units? The average speed is approximately 150 Mbps. What amenities does the property offer? : We offer two pools (Residential and Beach Pool), monthly activations, complimentary Wi-Fi, Farmstand, Fieldhouse (cardio and weights), Pickleball court, water activity equipment including kayaks, stand-up paddleboards, boogie boards, snorkeling equipment, Kids Club, Fitness Center, and access to spa wet areas (subject to availability) sponsored by Hacienda Beach Club and Residences. We also offer fitness classes at both properties. What are the Field House hours? 24/7 What equipment is available? Specialized cardio machines and dumbbell weights. What are the hours of the Hacienda Fitness Center? 7am to 7pm. What equipment is available in the Hacienda Fitness Center? We have a well-equipped gym, including dumbbell weights, weight bars, Smith machine, cardio machines, and multifunctional machines, among others. Do you have a Kids Club on the property? The Kids Club service is provided by our sister property, Hacienda Beach Club and Residences. What is the minimum age to attend the Kids Club? 4 years. What are the Kids Club hours? 9 am to 5 pm. What is the minimum age to use the water equipment? 18 years. An adult must accompany those under 18 at all times. What are the hours for kayak and paddleboard activities? Kayak and paddleboard activities are available from 7 am to 4:30 pm. Do you have a Business Center? We do not offer this service. However, our Guest Services team can assist with any requests. Concierge Is transportation included? Transportation to any destination comes at an additional cost. Please get in touch with Guest Services to inquire about various options that meet your needs. What transportation options are available? here are various transportation options, including private transport services. Taxis are available 24/7 outside the property. You can also schedule UBER rides through the app and reserve rental cars. How can I schedule transportation services? Most transportation services can be scheduled through Guest Services. Taxis can also be arranged through the Valet/Bellboy in the lobby (both at 1 Homes and Hacienda). UBER can be scheduled individually through your smartphone. Where and how can I be picked up by UBER? When requesting a UBER, if "1 Homes Cabo" is not listed in your app, select and position the location icon at "Hacienda Cocina and Cantina." Once your ride is confirmed, please provide the driver's name, license plates, and car model to the Guest Services team to notify and grant the driver access. What payment methods do transportation services accept? Private transportation is charged to the room (with some exceptions). Rental cars are paid directly to the provider with a credit card. For taxis, the most efficient and practical payment method is cash. However, our Valet department may be able to arrange taxis that accept credit card payments (subject to availability). Payments to apps like UBER are subject to the options provided by the app. Can I send or receive packages to or from the hotel Yes, in the case of receiving packages, they should be addressed specifically to the person who will receive them and must be registered at the Lobby with the following address: Paseo de La Marina 4732, Col. El Medano, 23453 | Cabo San Lucas, B.C.S., Mexico. For sending packages, our Guest Services team can provide you with options and assistance for your convenience. What is the best way to contact Guest Services? You can contact Guest Services through the following means: +52 (624) 689 0600 (Residential Complex) Cell | +52 (624) 184 1175 (Guest Services #1) +52 (624) 184 1152 (Guest Services #2) Email address | [email protected] What food delivery options are available? We offer in-residence service by Hacienda Cocina y Cantina, available 24/7. Various restaurants also offer delivery services, and there are food delivery apps such as Uber Eats, Rappy, and Didi. For more information, please consult Guest Services. How can I schedule grocery services? A: Grocery services can be scheduled directly with our Guest Services department. You can find their contact information below: +52 (624) 689 0600 (Residential Complex) Cell | +52 (624) 184 1175 (Guest Services #1) +52 (624) 184 1152 (Guest Services #2) Email address | [email protected] If you provided your email address and/or phone number when making your reservation, our Guest Services department will contact you to provide information about the services we offer and coordinate preparations for your arrival. How can I schedule services for chef, tequila, or mezcal tastings and cooking classes? All services above can be scheduled directly with our Guest Services department. You can find their contact information below: +52 (624) 689 0600 (Residential Complex) Cell | +52 (624) 184 1175 (Guest Services #1) +52 (624) 184 1152 (Guest Services #2) Email address | [email protected] If you provided your email address and/or phone number when making your reservation, our Guest Services department will contact you to provide information about the services we offer and coordinate preparations for your arrival. About Cabo What's the weather like in Cabo San Lucas? Cabo San Lucas has an arid Gulf Coast desert climate, averaging over 350 days a year of sunshine. The weather is hot all year, with lower temperatures from December through April (average daily high temperature below 81°F). The summer months, July through September, average a daily high temperature above 89°F. The hurricane season lasts from June to November, with August and September bringing the greatest chance of rain. What is the difference between Cabo San Lucas and San José del Cabo? Only a few decades ago, Cabo San Lucas was just a quaint fishing village, but it has undergone significant growth to become the vibrant destination it is today, drawing tourists from around the world. While fishing remains a key part of Cabo's appeal, you'll now find world-class bars, restaurants, water sports and entertainment destinations. Cabo San Lucas also offers stunning marine beauty. Scuba diving is a popular way to experience the waters, as is whale watching in winter. San Jose del Cabo is the political seat of Los Cabos.Though smaller than Cabo San Lucas, its growth has spread outside the city center, leaving the downtown’s charm intact. With quaint cobblestone streets, jacaranda trees, an 18th-century church, and unique markets and art galleries, a stroll through this historical town will take you back to old Mexico. Where can I get a map of Cabo San Lucas? You can find maps here. Any of the car rental locations at the airport and various tourist information spots throughout downtown Cabo will also offer printed maps. Can I drive to Cabo? Yes. You can rent a car directly at the San Jose del Cabo airport upon arrival and drive to Cabo. 1 Hotel & Homes is about 30 miles away. What differentiates Cabo from Cozumel, Cancun, and other destinations in Mexico? One of the main differences is the geographical location. Cancun on Mexico's east coast is tucked between the Gulf of Mexico and the Caribbean Sea, while Cabo on the west coast sits at the tip of the Baja Peninsula, where the Pacific Ocean meets the Gulf of California. Cabo is also differentiated by its deep blue ocean, stunning rock formations and a cooler, dryer desert climate. Is Cabo San Lucas safe? The US State Department recommends exercising increased caution in all of Mexico but currently has no travel restrictions in Baja California Sur. You can view the latest information here. Can I drink tap water in Cabo? 1 Homes has triple filtered water, which is safe to drink. Outside the property, we recommend drinking only purified water. What are the best restaurants in Cabo? Some of the best restaurants are within walking distance of 1 Homes, including Hacienda Cocina y Cantina, La Lupita (best tacos in town), SUR Beach House for breakfast, Bar Esquina for dinner, and Nick San for sushi lovers. Where are the best places to dive in Cabo? The best diving in Cabo is just in our “front yard” around the Pelican Rock and Land’s End. For more adventurous divers, there are day trips to Cabo Pulmo, a beautiful National Marine Park. And if you want to venture into the deep blue, Gordo Banks in the corridor is also a favorite spot for deep diving. Where's the best fishing in Cabo? Depending on what type of fish you are looking to catch, the best fishing is just off the coast towards San Jose or on the Pacific side towards the old lighthouse. If you’re looking especially for tuna, you will have to head out about two hours towards a spot called The Golden Gate. Where are the best golf courses in Cabo San Lucas? Four of Cabo's 16 golf courses were ranked among the World’s 100 Best Courses (U.S. excluded) by Golf Digest in 2018: Querencia, Quivira, The Dunes at Diamante, and the Ocean Course at Cabo del Sol. Courses in Los Cabos can be grouped into three basic categories: public, private, and playable with some restrictions. Cabo del Sol’s Ocean and Desert Courses, Cabo Real, Cabo San Lucas Country Club, Campestre, Palmilla, Puerto Los Cabos, and Vidanta are all open to the public. How can I see The Arch in Cabo San Lucas? The best way to see The Arch is to take a water taxi from Cabo Marina, just steps away from 1 Homes. They'll take you all the way to The Arch, where you can take a a picture with Cabo’s landmark in the background. What are the best things to do in Cabo San Lucas? The best things to do in Cabo are diving, fishing, golfing, surfing, dining, enjoying the beach, swimming in the ocean, and exploring the beauty of the Baja desert, in no particular order. Our concierge team is here to help recommend some of their favorite experiences. What is Cabo San Lucas like in winter? Winter in Cabo is the perfect time to visit. The temperatures are not too hot, and the water is beautiful. Winter is also the time of year when humpback whales visit Cabo to give birth, so from December through mid-April you can watch the spectacular mammals breaching in front of our beautiful 1 Homes. What is the best time of year to visit Cabo San Lucas? You'll find the best weather between October and May, but any time of year in Cabo is beautiful. Is Cabo San Lucas a good place to vacation with kids? Yes! There are many activities tailored for families with kids, including some of our own here at 1 Homes. What are the best beaches in Cabo San Lucas? Medano Beach located just in front of 1 Hotel & Homes Cabo is the best and only year-round swimmable beach in Cabo. Where's the best nightlife in Cabo San Lucas? Around the Marina, walking distance from 1 Homes, you'll find Cabo's famed nightlife destinations including Mandala, The Nowhere Bar, and El Squid Roe. What's Cabo like during spring break? With its beautiful weather, many activities, and famed nightlife, Cabo is a popular spring break destination for families and students alike.'''
