description = "Overlooking Green Park, 1 Hotel Mayfair’s eco-conscious, modern design echos its nature-inspired, sustainable mission, by bringing the outdoors in."
full_description = "1 Hotel Mayfair London, UK 3 Berkeley Street Get Directions Welcome to your London retreat, nestled in the heart of London's iconic Mayfair district surrounded by the vibrant natural beauty of numerous Royal Parks and the unparalleled history of world-renowned museums, galleries, and theatres. Our sustainable sanctuary echoes the tale of a stunning cityscape uniquely graced by nature's boundless wonder. Steps from Green Park Pet Friendly Electric Audi House Car Sustainable Cuisine Cocktail Bar In-Room Wellness Gym & Classes Sustainable Gatherings At 1 With Nature 1 Hotel Mayfair, just steps from London’s iconic Green Park, was built and refurbished from two existing buildings and reimagined to reduce CO2 emissions and accelerate sustainable practices throughout our operations. In addition to our live green walls, 1 Hotel Mayfair features 1,300 individual plants, shrubs and trees throughout its verdant grounds. Drinking Sustainably Each room features filtered water taps, with recycled wine-into-water bottles in every room. No thank you, single-use plastics. At 1 Hotel Mayfair, we also use an efficient irrigation system to nourish our exterior living walls, using the building’s roof area rainwater. View Rooms Good Energy Is Clean Energy 1 Hotel Mayfair is equipped with state-of-the-art energy-efficient heating and cooling systems, as well as occupancy sensors that adjust lighting and airflow systems based on whether guests are present in the room. Soft, integrated lighting enriches the serenity of each guest room. Peace of Mind We provide locally sourced, sustainable bed linens and non-toxic, organic mattresses, so you and the earth can sleep soundly. View Rooms Wandering Respectfully Explore the city emission-free in our fully electric Audi e-tron, or take a walk through the surrounding verdant spaces including Green Park, St James' Park, and Hyde Park. Explore tagline In Partnership with Robi Walters Mindfulness Suite Discover the essence of Mayfair as mindfulness, art, and sound converge in a captivating suite takeover by renowned London-based artist Robi Walters. Discover the experience Wellness At 1 Hotel Mayfair, our experiences are designed to nurture mind, body, and spirit—starting with holistic wellness at Bamford Wellness Spa, personalized workouts and Mind & Movement programming at The Field House. Stay Well Fur-Family Friendly We would never ask you to leave your furry (or not furry) friend behind! As a pet friendly hotel, your pup is always welcome at 1 Hotel Mayfair. Pet Friendly Rooms & Suites King Interior View King Bed 2 People Rain Shower View Details King Queen City View Queen Bed 2 People Rain Shower View Details Queen Lounge King City View King Bed 2 People Rain Shower View Details Lounge King Two Small Doubles City View 2 Small Double Beds 2 People Rain Shower View Details Two Small Doubles Two Queens City View 2 Queen Beds 4 People Rain Shower View Details Two Queens Skyline King Skyline View King Bed 2 People Rain Shower View Details Skyline King Skyline Terrace King Skyline View King Bed 2 People Rain Shower View Details Skyline Terrace King Junior Suite City View King Bed 2 People Rain Shower View Details Junior Suite Skyline Junior Suite Skyline View Super King Bed 2 People Rain Shower View Details Skyline Junior Suite Skyline One Bedroom Suite Skyline View Super King Bed 2 People Separate Rain Shower & Tub View Details Skyline One Bedroom Suite Skyline One Bedroom Terrace Suite Skyline View 2 People King Bed Rain Shower View Details Skyline One Bedroom Terrace Suite Garden Terrace Suite Skyline View Emperor Bed 2 People Separate Rain Shower View Details Garden Terrace Suite Piccadilly Greenhouse Suite Skyline London & Piccadilly Street Views Emperor Bed 2 People Separate Rain Shower View Details Piccadilly Greenhouse Suite Dover Terrace Suite Skyline London & Piccadilly Street Views Emperor Bed 2 People Separate Rain Shower View Details Dover Terrace Suite Green Park Penthouse Skyl