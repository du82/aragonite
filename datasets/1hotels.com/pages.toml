full_description = "Frequently Asked Questions General Do you allow smoking on property? In the rooms? No, we do not allow smoking in rooms or on property. Do you allow photography and videography? Professional photography and videography are not permitted in public spaces or outlets. However, for event spaces that have been booked, photography and videography is permitted. At this time the hotel cannot accommodate requests for personal or private photo shoots. For commercial photoshoot inquiries, please visit our Film & Photo Shoots page. Can I send a package to the hotel? Yes, please address it to the individual, followed by our Hotel address: 60 Furman St, Brooklyn, NY 11201 Do you have a mobile app? We do! The 1 Hotels app can be downloaded from the App Store or Google Play Store. What languages are spoken by staff at the hotel? English, French, Italian, Spanish, Portuguese, Tagalog, Mandarin. Does your hotel have air conditioning? Yes, all guest rooms and public spaces have both central air conditioning and heating. What is the best way to contact the hotel? You can reach the hotel at 347-696-2500 I have a media or influencer request. Whom do I contact? Please send any media requests to [email protected] and influencer requests to [email protected]. Health & Safety What are your cleaning practices and amenities? Our property will continue to be sanitized using hospital-grade, EPA-approved agents and activated oxygen spray bottles. Our kitchen staff maintains rigorous cleaning processes and our management team has undergone ServSafe® certification, ensuring enhanced safety training and educational materials. What steps are you taking to practice safety at the hotel? All team members undergo temperature scans upon entrance to our sustainable sanctuaries, and hand sanitizer is available in all public and team spaces. High-touch points such as furniture, door handles, and elevators are sanitized multiple times per day, and we continue to encourage social distancing to ensure everyone’s comfort and safety. In addition, we request that all individuals, guests and team members alike, adhere to local guidelines in regards to masks. To further protect you and the planet, we continue to offer contactless guest services including mobile keys, television controls, menu ordering and payment, service requests, concierge support, front desk text messaging, and check out (service availability may vary by property and stay dates). Download the 1 Hotels mobile app from the App Store or Google Play Store. Is onsite COVID-19 testing available? We do not offer onsite testing but can arrange for a healthcare professional to come to the hotel. Is proof of vaccination required? As per government guidelines, we do not require proof of vaccination. Am I allowed to travel to 1 Hotel Brooklyn Bridge? Yes, see the latest vaccine requirements here. Loyalty Do you have a loyalty program? Yes, when you join MISSION by SH, you’ll be reducing your carbon footprint every time you visit one of our hotels. Redeem your rewards to offset the climate impact of your stay by funding projects like forestation, renewable energy production, and land conservation efforts that reduce greenhouse gas emissions. Where can I learn more about MISSION by SH? You can learn more about MISSION by SH here. How do I join MISSION by SH? Sign up to join MISSION by SH by filling out this form. Sustainability Is the hotel LEED certified? Yes, 1 Hotel Brooklyn Bridge is LEED Gold Certified. What are the hotels sustainable practices? Good energy is clean energy. Your home away from home is equipped with efficient energy systems that feature low-energy LED light bulbs, and smart heating and cooling. We also purchase carbon offsets to reduce our operational footprint. To top things off, we operate a rainwater reclamation system on our rooftop that sends water down to irrigate the waterfront park. Experience local elements. Over half of our hotel is made from regional and reclaimed materials, including original heart pine beams from the former Domino Sugar Factory in Brooklyn that now act as tables in our lobby and benches on each guest room floor. Drink up. Each guest room in our hotel features a water tap built into the wall equipped with a water filtration system to provide our guests with high-quality drinking water. Our in-room cups and carafes are made from recycled wine bottles, to discourage guests from using single-use water bottles, especially plastic. Winding down should come naturally. We sustainably sourced linens and non-toxic, eco-friendly mattresses that are healthy for both you and the environment. Indulge guilt-free. The ingredients used in The Osprey, Harriet's, Neighbors and in-room dining are organic and sustainably sourced from local purveyors. Travel with care. Explore the city emission free with our Audi e-tron electric vehicles, hop on a bike and cruise down the redesigned historic waterfront, or trek over the Brooklyn Bridge. Does the hotel have a towel or linen refuse program? Absolutely. We change over the linens in guest rooms every third day, or when requested. As a best practice, we do not change towels that are hanging up. Does the hotel have a food waste reduction program? Yes, we are part of the zero-waste initiative program by FoodPrint Group that we are extremely proud of. In fact, 1 Hotel Central Park is part of the pilot group of this program. Does the hotel have water-efficient faucets, toilets, or showers? Yes, we have water-efficient faucets, toilets and showers in all of our guest rooms. Does the hotel have a towel or linen refuse program? Absolutely. We change over the linens in guest rooms every third day, or when requested. As a best practice, we do not change towels that are hanging up. Does the hotel have a recycling program? Yes, we are part of the zero-waste initiative program by FoodPrint Group that we are extremely proud of. In fact, 1 Hotel Central Park is part of the pilot group of this program. Does the hotel have a food waste reduction program? Yes we do! Does the hotel have a soap or toiletry donation program? No, we do not. Transportation / Directions What is your address? 60 Furman St Brooklyn, NY 11201 How much is parking? Valet parking is available at the following rates: Up to 3 hours $40.00 Up to 6 hours $50.00 Max to 24 hours $85.00 Electric vehicle parking available *Tax is not included. BOOK YOUR PARKING AHEAD OF YOUR STAY How far will the Audi e-tron house car take me? We’re happy to offer our Audi e-tron house car service for rides within a three-mile radius of the hotel. The house car is available on a first-come basis during select hours. To explore destinations beyond this radius, we invite you to reserve the fully electric Audi e-tron for a test-drive for up to two hours once during your stay. To learn more, click here. Where is the closest bike rental? The closest option for Brooklyn Bridge bike rentals is the conveniently located Citi Bike station at Old Fulton St. How do I get to the hotel? Forms of transportation are Uber, taxi, subway or bus. What is the closest airport? LGA - 10 miles away EWR - 16 miles away JFK - 18 miles away How can I arrange transportation from the airport? How much will it cost? You may contact our concierge for transportation arrangement and pricing at [email protected]. Reservations I booked on a website other than the hotel website and need to change my reservation. How do I do this? Please contact the 3rd party company that you made the reservation through. We are happy to assist as well please call in house reservations at 833.625.6111 and we will be able to assist you right away. Please have your confirmation handy. Can someone else pay for my reservation? Can I pay for someone else's reservation? If guests are booking on behalf of someone else, they must contact the hotel directly to arrange for third party billing. What is your guarantee/deposit policy? Reservations must be guaranteed by a major credit card when you book. Blackout dates are subject to their own rules. What is your cancellation policy? Pay Now rates are non-refundable, full pre-paid and non-transferrable. Pay Later rates require a cancellation notice 72 hours prior to date of arrival in order to avoid a penalty of one night's stay. Unless otherwise noted on confirmation, please let us know if you have to cancel 72 hours before arrival to avoid penalty. If you just don’t show up, we’ll have to charge one night’s stay. For the Riverhouse Suite, please let us know if you have to cancel 7 days before arrival to avoid penalty. If you just don’t show up, we’ll have to charge two night’s stay. What does the amenity fee include? Mind and Movement, offering a variety of fitness and wellness experiences Unlimited local calls Audi e-tron house car drop-off service (based on availability, within three-miles radius) Access to rooftop pool What are the check-in and check-out times? Check in is at 4pm and checkout is at 12pm. Can I check-in early? Book an early flight? We’ll do our very best to accommodate you - just let us know in advance. If we can’t, we’ll gladly stow your luggage safely and securely, until you’re ready to move on. There is a late departure fee of one night’s stay plus tax. Can I get late check-out? Want to sleep in? We’ll do our very best to accommodate you - just let us know in advance. If we can’t, we’ll gladly stow your luggage safely and securely, until you’re ready to move on. There is a late departure fee of one night’s stay plus tax. Can I store my luggage before check-in or after check-out? We'll gladly stow your luggage safely and securely, until you're ready to move on. Is my ID/passport required at check-in? For security purposes, please provide a valid government or state-issued photo ID at check-in. What is the minimum age to check in to a room? You must be 18+ to book a room. Do you have an early departure fee? The early departure fee will be one night room and tax for the day you are departing. Is breakfast included? Breakfast is included with our breakfast package reservations, otherwise breakfast is not included but can be enjoyed at The Osprey restaurant or through in-room dining at an additional cost. What forms of payment are accepted to pay for my room? Credit Cards must be presented upon check and must be the same credit card used to make the reservation. If guests are booking on behalf of someone else, they must contact the hotel directly to arrange for third party billing. I have questions about my hotel bill. Whom do I contact? Please contact our hotel directly at 347.696.2500 and our accounting team will be more than happy to connect you with our accounting department. Does the hotel require a deposit for incidentals? Our front office team will take an incidental hold per day of $250 during check-in. How can the incidental deposit be made? To cover incidentals, we’ll hold $250/day on your credit card and we’ll authorize additional funds as needed based on your additional incidental charges. When will the incidental deposit be returned to my debit or credit card? After the bill has been settled during checkout, it will take 5-7 business days to see the amount reflected back into your account for any unused amount. How much money does the hotel authorize on my debit or credit card at check-in? The hotel will authorize the incidental hold of $250 per night as well as any other remaining amount for the grand total not taken from the initial deposit. Rooms Do you have accessible rooms? Yes, we have rooms that are equipped with larger doors for wheelchair access and handrails in the shower/tub and toilet. Do you have rooms with views? Yes, Brooklyn Bridge and Manhattan skyline views are available. Do you have rooms with a balcony or terrace? We have rooms available with floor-to-ceiling windows that open, but do not have balconies or terraces in any of our rooms. Do you have rooms with two beds? Yes, we have rooms with two queen beds. Do you have rooms that have a bathtub? Yes, we have guest rooms with bathtubs. If you are interested in guaranteeing a room with a bathtub, please contact our Front Desk team directly. Pets Are pets allowed? Are there restrictions for types, breeds, or size? 1 Hotel Brooklyn Bridge welcomes all four-legged furry travelers up to 40lbs max per room. This means that whether it is 1 pet or 2 pets, the combined max weight is 40lbs. Please note, if your room gets dirty, a $250 cleaning fee will be added at the end of your stay. Is there an area for pets? We don't have a designated area for pets, but we will gladly recommend Brooklyn Bridge Park. Do you have pet-free rooms for those with allergies? No, we do not have pet-free rooms. Do you have pet-sitting or dog-walking services? No, we do not have pet sitting or dog walking services. However, we can have our concierge team assist with locating services nearby. Are there pet stores nearby? Yes, our concierge team can assist with providing store locations. Are there pet-friendly restaurants nearby? Yes, there are pet-friendly restaurants nearby, our concierge team can help with recommendations. Amenities How much do you charge for high-speed/wifi internet access? WiFi internet access is complimentary for hotel guests. Do you have a fitness center? What equipment does it offer? What are its hours? Yes, The Field House is located on the 2nd Floor and open 24hrs daily. It offers a wide range of equipment including treadmills, ellipticals, floor equipment, dumbbells, bikes and more. Do you offer personal training or group fitness classes? Yes, we offer personal training and group fitness classes. Find out more here. Do you have a business center? While we do not have a business center, guests can access our spacious lounge to work from any time of day. To request information about booking meeting room spaces, please click here. Do you have a pool? What are its hours? Yes, we have a rooftop pool. Please note that the pool is currently closed for the season. For more information, click here. Do you have a spa? What are its hours? Yes, our Bamford Wellness Spa is located on Floor -1 and is open Monday, 9am - 6pm Tuesday - Thursday, 9am - 7pm Friday - Sunday, 9am - 8pm To view our menu and make an appointment, click here. Can I visit the pool if I’m not a hotel guest? Unfortunately, our pools are only available to hotel guests and residents. Do you have a kids club? No, we do not have a kids club. Do you offer currency exchange? No, we do not offer currency exchange. Do you have a gift shop? Yes, our retail offerings are available in the lobby, where you can find a little 1 Hotel to take with you. Do you offer laundry or dry-cleaning services? Yes, we offer laundry & dry cleaning services. Concierge I want assistance planning my trip to 1 Hotel Brooklyn Bridge. How do I contact the hotel? You can reach out to our concierge team by phone at 347.696.2500 (ask for the concierge department) or directly by email - [email protected] D"
