full_description = "1 Hotel South Beach Miami Beach, FL 2341 Collins Avenue Get Directions Your South Beach sanctuary, set along a pristine, 600-foot stretch of shoreline, with translucent, ocean blues in constant view. Beachfront LEED Silver Pet Friendly Electric Audi House Car Sustainable Cuisine Rooftop Bar 4 Pools Bamford Wellness Spa Gym & Classes Seedlings Kids Club Sustainable Gatherings Goodthings Shop Good Energy Is Clean Energy Optimized for energy efficiency and powered by green systems, including low-energy LED lighting and smart temperature control. At 1 with Nature A sustainable sanctuary designed with locally sourced and repurposed materials, including Beetle Kill Pine wood, regional coral stone, salvaged wood from Alaska, and fallen trees from the South American rainforest. DRINKING SUSTAINABLY Each room is equipped with water filtration in every faucet and recycled wine-into-water glasses. No thank you, single-use plastics. PEACE OF MIND Locally sourced, sustainable bed linens and non-toxic, organic mattresses, so you and the earth can sleep soundly. WANDERING RESPECTFULLY Explore the city emission-free in our fully electric Audi Q8 e-tron, ride beach cruisers, or wander the white sands to take in the best of nature. Explore EMERGING EXPLORERS Seedlings at 1 Hotel South Beach seeks to nurture nature’s next great explorers with engaging and fun experiences that celebrate the natural environment. Grow With Us 1 Less Thing Overpacked? Simply leave a piece of clothing (or two) under this block to get your pre-loved threads into the hands of those in need through our local charity partner, Miami Rescue Mission. 1 HOTEL SOUTH BEACH AWARDED A MICHELIN KEY We're honored to be recognized by the MICHELIN Guide with a MICHELIN Key distinguishing hotels offering the world's most outstanding experiences. Learn More WELLNESS At 1 Hotel South Beach, our experiences are designed to nurture mind, body, and spirit, including holistic treatments at Bamford Wellness Sp