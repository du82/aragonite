["https://1hotels.com/our-story"]
title = "Our Story - 1 Hotels"
description = "Discover the story of 1 Hotels, our sustainable retreats, our vision, and how nature and nurture are 1 with how we are leading hospitality forward."
full_description = '''Our Story Our sanctuaries serve as both catalysts and comfort, offering exquisite escapes, invigorating adventures, and profound wellness expeditions guided by the intuition in your soul and the hum of the natural world. A World That Is 1 Step into our sustainable retreats as we open the doors to a world where the desire for rest and adventure exists in harmony. Where routines are forgotten, rhythms are honored, and rituals are born. Where nature and nurture are 1, and you're free to drift away. "I wanted to capture the beauty of nature in a hotel and commit to safeguarding it as best as I can, a responsibility that I believe we all share. It's 1 world. But 1 is more than a hotel, it's a philosophy and a platform for change." Barry Sternlicht, Chairman, Starwood Capital Group Nature Is Our True North We allow nature to guide our journey, breathe life into our vision, inspire us to place intuition before expectation, and continuously realign us with our sustainability keystones. 1 is more than a hotel, it’s a platform for substantiative change, and our channels take many forms. From global programs, partnerships, conversations, and mindsets, we aspire to transform an industry that relies on the prosperity of the planet and its people. Explore Tune In We’re surrounded by the systems of the natural world that, when left untouched, know exactly how to self-balance, self-regulate, self-cleanse, and restore harmony. When you escape to our sanctuaries, you’re welcome to surrender to nature and tap into your innate ability to give your mind, body, and soul exactly what they need. Surrender to Serenity Live Local Beyond our deliberate designs, every sight you see and bite you take is infused with the beauty and bounty of nature. Our distinguished chefs craft culinary adventures utilizing herbs from our on-site gardens, produce from our neighboring farms, and inspiration from cultural influences to nourish your needs while taking you on a subliminal tour of the world around you. Begin Your Culinary Adventure JOIN OUR MISSION Our cause-driven loyalty program, MISSION, not only aims to fight the climate crisis but strives to deepen your connection with the natural world—the heart of our purpose at 1 Hotels. As a MISSION member, every time you escape to our sanctuaries, you cultivate exclusive rewards that allow you to offset the climate impact of your stay through carbon offset projects involving forest and river conservation, wind projects, and sustainable agroforestry. Learn More LET NATURE BE YOUR GUIDE With the 1 Hotels App, you’ll have everything you need for the perfect stay at your fingertips. With just a few taps, you can view and edit your preferences, browse your benefits, dream about your upcoming adventures, explore your itineraries, discover the stories of our sanctuaries, access mobile check-in, and so much more. Download for Apple Download for Android Mindful Moments Small Details Lead to Big Change Thoughtfulness lies in every corner. Welcome to a world where sustainability and natural comforts exist in harmony. 1 Less Thing We invite guests to leave gently used clothing items behind, and we donate them to a local charity to give them a second life. Out With Plastic, In With The Wood Our room keys come in 5 different types of recycled wood. Mindful Moments Are Everywhere The shower timers in our rooms are a gentle reminder that just a few minutes saved can add up to make a big difference. Back to the Tap We provide clean, filtered water along with recycled glass carafes and glasses to encourage guests to refill and drink up. Hang in There, It's a Good One Our hangers are made from 100% post consumer recycled materials. They're full of stories, too. Write On In an effort to be paper-smart, you'll find a reclaimed chalkboard in your room for notes & doodles. The Market, Right Here At 1 Find deliciously ripe, just-picked seasonal fruits and vegetables at our lobby farm stand. Straight from regional farms, direct to you. Green Feels Good Our hotels are home to thousands of different plants. Dogs (And Cats) Are Family Too We would never ask you to leave your furry (or not furry) friend behind! Four-legged guests are welcome at our sustainable sanctuaries, and our concierge teams can help with recommendations for the best dog parks, pet shops, grooming salons, and more. Please see specific hotel pet policies for details. Naturally Fresh Every room features custom 1 Hotels bath products in collaboration with Bamford, made with the highest quality organic ingredients and infused with the brand's signature blend of geranium, lavender, peppermint, and tonka to cleanse and refresh both body and mind. Portable OMMM All our guest rooms have yoga mats, available for your use in or outside of the hotel. Rock On We've swapped the usual plastic privacy sign with a little touch of nature to let us know when you're ready. Travel with Care We’re pleased to introduce the official electric vehicle of 1 Hotels, the fully electric Audi Q8 e-tron. Guests are welcome to enjoy the Audi Experience to sustainably be whisked around the local area and even test drive it at a time that works for you. Learn More Mind & Movement We understand the importance of taking care of your mind, body, and spirit. Our hotels have teamed up with premiere training services to create state-of-the-art gyms and provide fitness classes and personal training. Seedlings Our Seedlings Basecamps and programs nurture nature's next great explorers with experiences that are healthy, active, educational, and fun. Full Moon With the full moon comes the changing of the tides, cosmos, and energy. To respect the rise of each full moon, we host a celebration at every hotel. Dark Sky One night every month, we turn the lights down low for a candlelit evening in the lobby, raising awareness of global brightening. Fully Electric Audi Adventures Through London’s Storied Streets Explore the iconic sights and hidden corners of London with a thoughtfully curated journey in our... Continue Reading Fully Electric Audi Adventures Through London’s Storied Streets Honoring Black History Through Nature & Craft Get to know some of the talented and dynamic BIPOC partners across our sanctuaries as they share... Continue Reading Honoring Black History Through Nature & Craft The Art of Seasonality: Chef Josh Bosen’s Inspired Approach to Melbourne Dining Discover how Chef Josh Bosen plans to redefine dining at 1 Hotel Melbourne, blending creativity... Continue Reading The Art of Seasonality: Chef Josh Bosen’s Inspired Approach to Melbourne Dining Rethink Your Drink: Lyre’s on the Craft of Alcohol-Free Indulgence Explore the world of non-alcoholic spirits, embrace mindful drinking, and enjoy a sustainable twist... Continue Reading Rethink Your Drink: Lyre’s on the Craft of Alcohol-Free Indulgence New Year, New Horizons: Chef Michael Solomonov’s Tips for Travel, Wellness, and Culinary Adventures in 2025 A Fresh Take on Balance, Flavor, and Exploration for the Year Ahead. Continue Reading New Year, New Horizons: Chef Michael Solomonov’s Tips for Travel, Wellness, and Culinary Adventures in 2025'''
