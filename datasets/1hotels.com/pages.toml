description = "Take in sweeping views of the Manhattan skyline from the rooftop deck with a plunge pool at 1 Hotel Brooklyn Bridge."
full_description = "Rooftop Pool Take in sweeping views of the Manhattan skyline from our rooftop pool deck. The rooftop pool is currently closed for the season. THE POOL DECK Lounge poolside with skyline views of the Brooklyn Bridge and handcrafted cocktails and bites, then cool off with a dip in our plunge pool. Lounge chairs at the pool are exclusively for hotel guests, subject to availability. Pool Rules Lounge chairs at the pool are exclusively for registered hotel guests, subject to availability. Please note, the following apply to all guests using the rooftop pool: -Lounge chairs are on a first-come, first-serve basis (for up to 2 hours) -Two lounge chairs per room (must be a registered hotel guest) -No children after 5pm -No pets permitted on pool deck -No professional photography (iPhone only) -No Smoking -Swimsuits must be worn on the deck and in the pool -Eating and drinking is permitted only in designated areas Sky Swim Lounge Experience poolside luxury with our all new Sky Swim Lounge tables, which provide all guests the opportunity to take a dip in our rooftop pool. Nestled just below the pool deck, these elegantly crafted Sky Swim Lounge tables are an exclusive oasis, where you can bask in the sun, sip on refreshing beverages, and indulge in delectable bites served right to your table. Please note, minimum F&B spends apply. Sky Swim Lounge tables are located just below the pool deck. Chaise lounges on the pool deck are exclusively reserved for hotel guests. Sky Swim Lounge tables are for adults only, 21+. BOOK YOUR TABLE"
