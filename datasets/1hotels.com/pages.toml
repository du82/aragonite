full_description = '''Neighborhood Guide We've curated a neighborhood guide outlining local attractions and activities like sustainable shopping, parks, restaurants, entertainment and more - so you can know what it's truly like to live local. Legend Our Location 1 Hotel Brooklyn Bridge 60 Furman Street Brooklyn, NY 11201 Get Directions Located at Pier 1 on Brooklyn Bridge Park, just south of the iconic bridge in the Brooklyn Heights neighborhood and minutes from downtown Manhattan. Show All Activities & Tours Arts & Culture Doing Good Entertainment Family Nature Pets Activities & Tours Jane's Carousel Jane's Carousel is a classic 3-row machine with 48 exquisitely carved horses and two superb chariots. It was created in 1922, the heyday of the American Carousel, by the Philadelphia Toboggan Company (P.T.C.) Designated as PTC. No. 61, it was originally installed in Idora Park in Youngstown, Ohio, then a prosperous steel-making city. Learn More Learn more about Jane's Carousel Governor's Island Governors Island is a 172 acre island in the heart of New York Harbor. It’s only 800 yards from Lower Manhattan, and even closer to Brooklyn. It is a world unto itself, unique and full of promise. Learn More Learn more about Governor's Island Brooklyn War Memorial This granite and limestone memorial in Brooklyn’s Cadman Plaza is dedicated to the more than 300,000 "heroic men and women of the borough of Brooklyn" who served in World War II. Inside are displayed approximately 11,500 names of Brooklyn service members who died during the war. Learn More Learn more about Brooklyn War Memorial Brooklyn Bridge Park Brooklyn Bridge Park is a waterfront park along the East River in New York City. Free to all and open 365 days a year. Learn More Learn more about Brooklyn Bridge Park On The Water Your unforgettable day on the water awaits. Charter this 1930s vintage Wheeler Playmate, one of the last Hemingway class boats still operating today. You and up to 5 friends can sip on summer cocktails and take in the Statue of Liberty, Freedom Tower, and other iconic sights of New York City. This exclusive opportunity is owned and operated by Emmy winning actor Matthew Rhys. Learn More Learn more about On The Water Brooklyn Brewery 79 N 11th St. Brooklyn, NY 11249 Microbrewery with tastings & tours that offer an inside look at the creation process. Microbrewery with tastings & tours that offer an inside look at the creation process. Community involvement is a cornerstone of Brooklyn Brewery. The Stonewall Inn IPA is brewed in support of The Stonewall Inn Gives Back Initiative, and Create Space was launched to highlight LGBTQ+ activists fighting for equal rights around the world. Local groups including the Prospect Park Alliance, Transportation Alternatives, and Brooklyn Museum have received beer from Brooklyn Brewery for their events. Visit Website Learn more about Brooklyn Brewery Billion Oyster Project 640 Craig Rd S, New York, NY 10004 Billion Oyster Project is restoring oyster reefs to New York Harbor in collaboration with New York City communities. The Osprey is proud to be supporting the Billion Oyster Project by recycling consumed oyster shells. Billion Oyster Project restores oyster reefs to New York Harbor in collaboration with New York City communities. Volunteer to help restore NY Harbor, while admiring skyline views from Governors Island. Your day includes training, an overview of Billion Oyster Project’s work, and lunch. Visit Website Learn more about Billion Oyster Project Brooklyn Museum 200 Eastern Pkwy, Brooklyn, NY 11238 Where great art and courageous conversations are catalysts for a more connected, civic, and empathetic world The Brooklyn Museum, housed in a 560,000-square-foot, Beaux-Arts building, is one of the oldest and largest art museums in the country. Visit Website Learn more about Brooklyn Museum Seeds & Weeds 96 South St, New York, NY 10038 Plant-based eatery with views of the Brooklyn Bridge A seasonally driven plant-based eat