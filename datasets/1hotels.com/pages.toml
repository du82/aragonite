ds 2 Queen Beds 8 People View Details Connecting Makana Penthouse & Ocean View Two Queen Upcoming happenings View All Wed 5 Mar Hanalei Bay Princeville Makai Golf Course Golf Daily Wed 5 Mar Hanalei Bay Albizia Jungle Gym Daily Wed 5 Mar Hanalei Bay 4th Floor CORAL PHOTOGRAPHY Daily Wed 5 Mar Hanalei Bay Additional Fee Private Experiences By Appointment Wed 5 Mar Hanalei Bay Meet at Anatomy Sunrise Flow Days vary Wed 5 Mar Hanalei Bay Beach Activities Hale Coral Reef Talk: Guardians of the Ocean Monday, Wednesday & Friday Wed 5 Mar Hanalei Bay Hala (8th floor) Vinyasa Flow Wednesday Wed 5 Mar Hanalei Bay Porte Cochere Guided Hike Beginner Monday, Wednesday & Friday Wed 5 Mar Hanalei Bay Vitality Kauaʻi Weekly on Monday, Tuesday, Wednesday, Thursday, Friday, and Saturday Wed 5 Mar Hanalei Bay Neighbors Surf Legend Bill Hamilton POV 5th & 19th Wednesday Taste Nourish your mind and body with fresh, local, and sustainable farm-to-table cuisine, showcasing ingredients from our on-site organic garden apiary, neighboring farms, and local fishers. Our six restaurants and bars tell extraordinary stories of land, sea, and history through seasonal cuisine sourced primarily from Kauaʻi and its neighboring islands. From organic smoothies and fresh-pressed juices to an extensive list of spirits, sake, biodynamic wine, and more—relax and refuel in a way that’s regenerative for both you and the planet. Explore Do Discover the best version of yourself at one of the world’s premier wellness sanctuaries through personalized programming that encompasses fitness, nutrition, and 360-degree well-being. Immerse yourself in the enchantment of Kauaʻi’s North Shore through abundant activities all within the footprint of the resort. Kayak through the Wailua River, hike to the awe-inspiring peaks of Hanalei, ground yourself in the Haleleʻa Forest Reserve, and discover the depths of the breathtaking beauty of the Nāpali Coast. Discover Gather Gather and connect in one of the world’s most stunning settings in flexible spaces that flow effortlessly from social to private, indoor to out. With everything you need for your business function, wedding celebration, or social gathering, each of our unique event spaces inspires brilliant ideas and genuine connections. Amplified by innovative technologies, turnkey event planning, custom farm-fresh menus, panoramic oceanfront views, and luminous natural light—our event spaces offer the perfect setting for you to watch your vision bloom. Explore Sleep 1 Hotel Hanalei Bay features 252 rooms, including 51 suites. Thoughtful touches bring nature into each space through reclaimed teak furniture, sustainable rattan accents, luscious greenery, and organic cotton linens. Wake up with the warm tropical breeze on your face as you take in panoramic views of the lush gardens, soaring mountains, or sparkling waters of Hanalei Bay through your wide-open windows. View Rooms Offers & Experiences View all ENDS April 01 Sleep Hanalei Bay Aloha Kauaʻi Up to 30% off Up to $500"
