full_description = "Floorplan154 Gallery154 Dumbo 2 Beds Welcome to your Dumbo retreat. Experience Brooklyn up close with large floor-to-ceiling windows that open to let nature in, and locally-made furnishings including open crate closets, corrugated leather headboards and wood flooring. Take in natural light with views overlooking the local DUMBO neighborhood. Average Size: 325 sq.ft. | 30 sq.m. City View 4 People 2 Double Beds Rain Shower Only Floor to Ceiling Windows Accessible Details Book This Room Check In Wednesday 5 Mar, ▼ Check Out Thursday 6 Mar, ▼ Check Availability All Rooms Include Pet Friendly Free WiFi LCD 55 Television Keetsa Mattress Cotton Bedding Filtered Water Taps Coffee Machine Bamford Bath Products Soft Cotton Robes Cotton Slippers Yoga Mat Digital Newspapers 1 Hotels Mobile App Hairdryer Full-length Mirror HEPA Air Filters In-Room Greenery Smoke Free The Bed Your double beds have been made with the comfortable, all-natural elements: custom organic cotton mattress by Keetsa, sustainably sourced linens, and corrugated leather headboards. The Bathroom Refresh with a triple-filtered rain shower and Bamford amenities surrounded by Natal mahogany, glass and marble. Relax in your cotton-knit towels, robe, and socks. Seating Area Furnishings, of a porous stone-look table made of composite wood and leather ball pouf, bring nature into your space. Stream content from your device on the LCD 55-inch smart television. Brooklyn Made Inspired by nature. Made in Brooklyn. Many of the design details in your room are by local artisans, from the “crate” inspired, open-slatted wood closets, to the Fresnel glass light fixtures. Explore Offers View all Offers ENDS March 20 Sleep Brooklyn Bridge Winter Solstice Up to 30% off your stay $30 Dining Credit Bamford Wellness Spa treatment discount Flexible cancellation Sleep Brooklyn Bridge Give Green, Get Green Up to 40% off your stay & $30 hotel credit Sleep Brooklyn Bridge 1 Right Way To Start The Day Fuel your day wi