full_description = 'Gallery680 Three Bedroom Ocean View Home - Baja Collection Your three-bedroom, three-and-a-half-bathroom retreat features a spacious living/dining room, an open kitchen, and a private terrace with stunning views of Medano Beach and Land’s End. Baja Collection homes feature unique furnishings and decor inspired by the region. Average Size: 3473 sq.ft. | 322 sq.m. Beds Vary 7 People Separate Rain Shower Ocean View Book This Room Check In Wednesday 5 Mar, ▼ Check Out Thursday 6 Mar, ▼ Check Availability All Rooms Include Free WiFi 55"+ HDTV Washer & Dryer Bluetooth Speaker Filtered Water Nespresso Machine Keetsa Mattress Cotton Bedding Soft Cotton Robes Cotton Slippers Yoga Mat Custom Bath Products 1 Hotels Mobile App Relax Discover a modern and sophisticated retreat in the heart of Cabo. Designed in the classic Mexican hacienda style but stripped down to their essence, homes feature pure forms, timber, local stone finishes, and tonal walls and ceilings of hand-applied stucco. Spacious bedrooms offer plush beds with organic cotton sheets, 55" HDTVs, and large windows or terraces framing iconic views. Reconnect Bring family or friends together, surrounded by the beauty of Baja. Expansive living/dining rooms adjoin full kitchens and open to oversized terraces with sweeping views. The outdoors is also brought in, with repurposed materials, raw textures, living plants, and abundant natural light. Refresh Slip into your standalone custom-crafted wood and stone bathtub or step into your rainshower, with filtered water and 1 Hotels bath products made from naturally derived ingredients. Then wrap yourself in an organic cotton towel and get cozy with our soft cotton robe and slippers. Refuel Refuel on your schedule with seasonal, locally-sourced, vibrant fare delivered to your home 24 hours a day. Explore Offers View all Offers Sleep Cabo Sleep Suite Up to 40% Off Your Stay + $50 Dining Credit Sleep Cabo Be Well at 1 Palo Santo Smudge Stick + Daily Smoothie 