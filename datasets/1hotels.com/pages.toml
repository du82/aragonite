full_description = "Gallery Filter by Location Any LocationBrooklyn BridgeCaboCentral ParkCopenhagenHaitang BayHanalei BayMayfairMelbourneNashvilleSan FranciscoSeattleSouth BeachTorontoWest Hollywood Category CategorySleepTasteDoGatherOther Load More Your Favorite Moments @1hotels #1hotels https://www.instagram.com/1hotels/ https://www.facebook.com/login/?next=https%3A//www.facebook.com/1hotels/ Photo by: this_bird_set_free, Captions reads: 🤎 this_bird_set_free Photo by: josemelgarejo.us, Captions reads: 📸🎥🎞️ Shooting CINEMATIC ENGAGEMENTS is part planning and part flow. 👇 🫶🏽A ton of work to bring a great concept to life and to get all three of us — myself the photographer my couple emotionally on board with what we’re about to create. 🌉Here’s a few snapshots of the engagement session we brought to life at the 1hotel.bklynbridge in the heart of DUMBO BROOKLYN. I may share more from this shoot, but here’s a preview with some shots I’m truly proud of. 🤓I used an adapted camera with a special lens to get some of these effects as well as my own presets based on vintage film stock. Incredibly empowering to see a concept and vision come together. 🌅📸 🛑Choose your adventure - the next post should be : josemelgarejo.us Photo by: jabbarlewis, Captions reads: NYC I LOVE YOU!!! jabbarlewis Photo by: letsnomnom_, Captions reads: savoring the simple pleasures of slow mornings ✨ waking up to waffles, the crunch of a freshly baked croissant, and a good book — topped off with stunning view of the bay bridge ☺️ 1hotel.sanfrancisco Terrene.SF #1hotelSF #TerreneSF #1Hotels #sponsored letsnomnom_ Photo by: kathrinsmirke, Captions reads: Enjoyed a wonderfully relaxing spa day at bamford within the breathtaking 1hotel.hanaleibay 🌺🧖‍♀️ kathrinsmirke Photo by: bradyhousestudios, Captions reads: A quite moment after the ceremony for shared breath + exchanging personal vows under this magical tree at the 1hotel.hanaleibay #kauai bradyhousestudios Photo by: aubestlife, Captions reads: Happy Earth Day! 🌍 Today, let's take a moment to appreciate the stunning natural beauty that surrounds us here in Hawaii. From the crystal clear waters of our beaches to the lush greenery of our forests, we are so lucky to call this place home. Let's do our part to protect and preserve it for generations to come. 🌈🌺🩵🏝️🌊🌱🌏 Small actions can make a big difference, et's commit to adopting sustainable practices in our daily lives. Whether it's using a reusable water bottle, choosing to walk or bike instead of drive, or supporting local businesses that prioritize the environment, we can all do our part to reduce our impact on the planet. #earthday2023 #alaskaairlines #iflyalaska #alaskacarelines #1hotel alaskaair 1hotel.hanaleibay aubestlife Photo by: sheepadood.levi, Captions reads: Me and Moms had the BEST night and I can’t wait to tell you all about it!! Soaking up the views this morning from my home for the weekend 🌥️ 1hotel.bklynbridge 🐾 sheepadood.levi Photo by: pixiprol, Captions reads: 1 Hotel West Hollywood 🌅 • • • 1hotel.weho #losangeles #1hotel #california #room #hotelroom #1hotelwesthollywood #westhollywood #hollywood #1hotelweho #traveladdict #luxury #instamood #traveladdict #losangeles_city #socal #voyaged #voyage #businesstrip #traveling #interiordesign #luxury #upscale #5star #sustainable #sustainableluxury #environment #californialove #hotelroom #hotellover #cozy #sunrise #pool #swimmingpool pixiprol Photo by: kimiaskravings, Captions reads: Baycation’s all I ever wanted ✨ kimiaskravings"
