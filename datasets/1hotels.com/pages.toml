["https://1hotels.com/brooklyn-bridge/hotel-rooms/bridge-studio-suite"]
title = "Studio Hotel Suite With Brooklyn Bridge View - 1 Hotels"
description = "Welcome to your retreat overlooking the Brooklyn Bridge. Thoughtful touches bring nature inside with a large sliding window, coffee table, and leather chairs."
full_description = "Floorplan159 360 Tour159 Gallery159 Bridge Studio Suite Welcome to your retreat overlooking the Brooklyn Bridge. Thoughtful touches bring nature inside with a large sliding window, spalted maple coffee table, and leather strap-upholstered chairs. Make the most of your stay with nightly turndown service (upon request) and priority seating at The Osprey, Neighbors, and Harriet's (based upon availability). Average Size: 480 sq.ft. | 44 sq.m. Bridge View King Bed 4 People Rain Shower Only Sofa Bed Living Area Floor to Ceiling Windows Suite Perks Book This Room Check In Wednesday 5 Mar, ▼ Check Out Thursday 6 Mar, ▼ Check Availability All Rooms Include Pet Friendly Free WiFi LCD 55 Television Keetsa Mattress Cotton Bedding Filtered Water Taps Coffee Machine Bamford Bath Products Soft Cotton Robes Cotton Slippers Yoga Mat Digital Newspapers 1 Hotels Mobile App Hairdryer Full-length Mirror HEPA Air Filters In-Room Greenery Smoke Free The Bed Your king bed has been made with the comfortable, all-natural elements of a custom organic cotton mattress by Keetsa, sustainably sourced linens, and a corrugated leather headboard. The Bathroom Refresh with a triple-filtered rain shower and Bamford amenities surrounded by Natal mahogany, glass, and marble. Relax in your cotton-knit towels, robe, and socks. Living Space Furnishings, of a reclaimed wood-block table and leather pull-out queen sofa bed and box-sling chair, bring nature into your space. Stream content from your device on the 55-inch television. Brooklyn Made Inspired by nature. Made in Brooklyn. Many of the design details in your room are by local artisans, from the “crate” inspired, open-slatted wood closets, to the Fresnel glass light fixtures. Explore Offers View all Offers ENDS March 20 Sleep Brooklyn Bridge Winter Solstice Up to 30% off your stay $30 Dining Credit Bamford Wellness Spa treatment discount Flexible cancellation Sleep Brooklyn Bridge Give Green, Get Green Up to 40% off your stay & $30 