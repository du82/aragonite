title = "1 Hotel Hanalei Bay: Luxury Resort & Spa on Kauai, Hawaii"
description = "1 Hotel Hanalei Bay brings a world-class wellness resort hotel and flagship sustainable sanctuary to Kauai's North Shore."
full_description = "1 Hotel Hanalei Bay Golf | Spa | Fitness 5520 Ka Haku Rd Get Directions Welcome to transformative wellness in one of the most stunning spots on earth—your oceanfront sanctuary on Kauaʻi’s North Shore, a protected natural wonder that nourishes body, mind, and soul. Within Wellbeing Beachfront Bamford Wellness Spa Golf LEED Certified Electric Audi House Car Transformative Wellness Cultural Experiences Seedlings Kids Club Tennis & Pickleball Resident Artists Outdoor Pursuits Sustainable Cuisine Pet Friendly Sustainable Gatherings Weddings Goodthings Shop Mind & Movement Swim & Surf A Natural Haven for All Every detail of our sanctuary serves to honor and spotlight Kauaiʻi’s boundless natural wonder, adapting to your day as effortlessly as the setting sun paints the expansive sky. With seven locally-inspired dining venues, transformative wellness experiences, family-centered adventures, a golf course with breathtaking ocean views, two pools with plush beach cabanas, and private access to the glittering Honoiki Beach—enjoy versatile offerings that excite everyone in your group. Transformative Wellness With wellness offerings ranging from spa treatments infused with Hawaiian plant medicine to touchless therapies including hyperbaric oxygen therapy and a technology-enabled meditation pod, ancient healing meets modern modalities to nurture a meaningful balance of body, mind, and spirit. WELCOME WELLNESS Outdoor Pursuits The Kauaʻi landscape is made for exploration, adventure, and being outdoors. Join us for guided hikes, sunset rituals, and many more ways to reconnect with nature. Explore Anatomy Fitness Our gym is designed to offer a spectrum of workouts and group classes, all informed by wellness practitioners and trainers. This 10,000 square foot state-of-the-art fitness facility will have you training with the latest equipment in the game. Explore Cultural Activities With a deeply rooted mission to honor the rich local culture, we invite you to discover the art of lei, ʻukulele lessons, hula dancing, and much more. explore Dive Into Poolside Paradise Whether you’re looking to drift into pure bliss at our cliffside infinity pool or splash the day away with your littles at our family-friendly pool, dive into your day with ease. With full-service private cabanas, switch from sun to shade at our tranquil adult infinity pool and jacuzzi that emulates feelings of floating on top of the waves. Explore Fully Electric Audi e-trons As the Official Electric Vehicle of 1 Hotels, explore the island in sustainable style with the Fully Electric Audi e-tron experience. Explore FUR-FAMILY FRIENDLY Your dogs and cats are always welcome to join us, just be sure to follow all the guidelines and policies of Hawaiʻi’s Department of Agriculture, so no paws get stuck along the way. We also recommend the Field Trip Program offered by Kauai Humane Society. Enjoy the natural beauty of the Garden Island, get your “dog fix,” and give a shelter dog a break from the kennels all at the same time. Feel Like ʻOhana Our team is honored to spread the cultural heritage of Hawaiʻi through warm greetings, friendly service, local tips, knowledge of traditions, itinerary planning, and more. From cultural art activations to helicopter tours, you can always reach out to our team to ask questions, seek advice, plan your stay, and feel like ʻOhana. Frequently Asked Questions We're proud to support surfrider's ocean friendly program Learn more Let Nature Nourish Your Senses Our island oasis is surrounded by an incredible concentration of native plants. Roughly 70% of all plants you see throughout our sanctuary are endemic, indigenous, or Polynesian canoe crops—brought to the island over 1,000 years ago and used to nourish and sustain the first settlers. Now, they work to purify the air, uplift your spirits, provide cultural significance, and blur the lines between interior and exterior around every turn. learn more Reimagine and Restore The construction of 1 Hotel Hanalei Bay was an act of reimagination and respect. Existing atop a protected natural wonder, we felt it was central to preserve and strengthen as much of the existing area as possible. This mindset allowed us to restore 96,000 square feet of habitat using native and adapted vegetation. Now, you can gaze up at flourishing tree canopies featuring native species such as Kukui, which provide critical habitats for birds and other pollinators. learn more Let Water Stewardship Flow Naturally Rainwater is an ever-flowing, abundant resource on The Garden Isle, and our 7,400-gallon rainwater harvesting system puts it to good use. Along with our intentional native plant landscaping, this system allows us to reduce outdoor water consumption by 97%, saving 3.5 million gallons of water per year while irrigating our gardens, naturally. learn more Indulge Guilt-Free and Ocean-Minded Coupled with our mission to support local farmers, fishers, and growers, every one of our dining venues prioritizes the health and prosperity of the oceans. Indulge guilt-free at our island oasis knowing that each restaurant is certified Ocean Friendly by The Surfrider Foundation, recognizing our commitment to avoiding single-use plastics and other wasteful practices while making ocean-minded choices. learn more Good Energy Is Clean Energy Our LEED-certified island oasis is optimized for energy efficiency and powered by green systems, including LED lighting, increased insulation, HVAC systems with energy recovery, and advanced monitoring. Through targeted strategies, this sanctuary is designed to save roughly 20% in annual energy costs. Learn More Wandering Respectfully Explore the island emission-free in our fully electric Audi Q8 e-tron, ride beach cruisers, or wander the golden sands to take in the best of nature. Explore Drinking Sustainably On The Garden Island, rainwater is an abundant natural resource. Our 7,400-gallon rainwater harvesting system allows us to irrigate our gardens naturally, reducing water consumption by 97% (3.5 million gallons per year). Inside, hydrate freely using our high-quality filtered water stations, and shower in peace knowing our highly efficient plumbing systems and low-flow fixtures reduce indoor water consumption. Learn More Winding Down Should Come Naturally We sourced sustainable bed linens and non-toxic, eco-friendly mattresses that are healthy for both you and the environment. Learn More Nurture Seedlings Our Seedlings kids program is designed to nurture your minis and give them exciting opportunities to connect with nature, explore conservation, safeguard Kauaiʻi’s magnificent marine life, and discover the vibrance of Hawai'i's rich culture. Dive into engaging, informative, and family-building fun for both tall and small. EXPLORE Go Full Swing Take your golf game to new heights at the Princeville Makai Golf Course, perched atop sweeping bluffs that overlook the sapphire waters of Hanalei Bay and the mystic peaks of Mount Makana. With grounds that wind through serene lakes, cherished woodlands, and lush tropical gardens, bring the entire family together with a day full of golf, tennis, pickleball, sunset tours, and more. explore Wellness & Membership journey within Introducing Within Wellbeing at 1 Hotel Hanalei Bay - a transformative wellness experience inspired by the belief that holistic wellness grows from within specifically designed with wellness in every element. learn more membership Transcend the conventional boundaries of wellness with a wide range of offerings, including 24/7 access to our state-of-the-art gym, daily classes, fitness assessments, advanced touchless therapies for recovery, and more with our exclusive year-round Within Membership. learn more touchless therapies Holistic wellness is multidimensional, and these self-administered therapies allow you to find the perfect tailored approach for your mind and body. Explore a wide range of modalities—including vibroacoustic, electromagnetic, infrared, light, thermogenic, and compressive therapies—to restore your inner balance and renew your sense of vitality. learn more bamford wellness spa Informed by the calming nature and thoughtful culture of Kaua’i’s North Shore — 18 sustainably designed treatment rooms, with a menu of transformative therapies and rituals that blend ancient Hawaiian techniques with advanced technology, creating an enlightened space for serenity, restoration and holistic, lasting wellness. learn more anatomy fitness Our 8,000 square-foot gym features top-of-the-line equipment designed to target and enhance any area you wish to focus on. Our personalized fitness options are crafted with insights from athletic performance science and strength conditioning. Our team of Body Architects utilizes innovative training methods and sophisticated technical analysis, harnessing the power of the latest sports performance technology to support your individual fitness goals. learn more Vitality Kaua'i Physical health is an integral element of overall well-being. Make the most of your journey and reset through Vitality experiences for transformative results. Learn More Rooms & Suites View All Mountain View King King Bed 2 People Rain Shower Only Work Space View Details Mountain View King Mountain View Two Queen 2 Queen Beds 4 People Rain Shower Only Work Space View Details Mountain View Two Queen Mountain View Terrace King King Bed 2 People Rain Shower Only Terrace View Details Mountain View Terrace King Ocean View King Ocean View King Bed 2 People Rain Shower Only View Details Ocean View King Ocean View Two Queen Ocean View 2 Queen Beds 4 People Rain Shower Only View Details Ocean View Two Queen Ocean View Lounge King Ocean View King Bed 2 People Rain Shower Only View Details Ocean View Lounge King Poolside Terrace Two Queen Pool View 2 Queen Beds 4 People Rain Shower Only View Details Poolside Terrace Two Queen Poolside Terrace King Pool View King Bed 2 People Rain Shower Only View Details Poolside T