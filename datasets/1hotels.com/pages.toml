["https://1hotels.com/brooklyn-bridge/do"]
title = "Things To Do In Brooklyn - 1 Hotel Brooklyn Bridge"
description = "Not sure what to do in Brooklyn during your stay? From events to attractions around Brooklyn Heights and Dumbo, discover all the best things to do in Brooklyn."
full_description = "Do Looking for things to do during your stay? We’ve got your daylife covered. From spa treatments at Bamford Haybarn Spa to art installations around Brooklyn Heights and Dumbo, there are many things to discover during your stay at 1 Hotel Brooklyn Bridge. Bamford Wellness Spa Relax in treatment rooms or our private suite as you rejuvenate with a selection of holistic treatments based on a heartfelt connection with nature and using natural restorative ingredients, as well as services and classes meant to nurture the mind, body and spirit. Named Best Facial in Allure Magazine's April Skincare Directory. Learn More Mind and Movement Recharge at The Field House, our state-of-the-art gym. Stay fit with a one-on-one training session with some of the world's top personal trainers. And get inspired in group classes, complimentary for hotel guests. Learn More Rooftop Pool Lounge poolside with NYC skyline views and handcrafted cocktails and bites, then cool off with a dip in our plunge pool. The pool deck and plunge pool are exclusively for hotel guests. Registered hotel guests must reserve pool seating through the 1 Hotels App, subject to availability and limited to 2.5 hours per guest room per day. HOURS Daily, 7am-7pm View Details Our Neighbors Explore our neighboring local businesses, from yoga studios to hair salons, and experience all DUMBO has to offer. Meet our Neighbors Audi Experience We’re always seeking innovative ways to show you how to live more sustainably. With this in mind, we’re pleased to introduce the Official Electric Vehicle of 1 Hotels, the fully electric Audi Q8 e‑tron. Guests are welcome to enjoy the Audi Experience while taking advantage of the house car or test driving the Audi Q8 e‑tron during your stay. The house car is available on a first-come, first-served basis from the hotel entrance. To test drive, please contact our concierge. HOURS Monday - Wednesday | On Call Upon Request Thursday - Sunday | 10am - 8pm Learn More tagline Travel with Care Audi Excursions Explore the natural beauty and bounty of New York with Audi Excursions. Our fully electric Audi Q8 e-tron house cars will take you on unexpected city adventures to Prospect Park and Oheka Castle. tagline Travel with Care Prospect Park Seek serenity in Prospect Park, getting closer to nature in the heart of Brooklyn. Take the time to relax and restore surrounded by the park’s greenery and serenity. Revel in the park’s beauty through a scenic 3.5-mile horseback riding tour, courtesy of the Prospect Park Alliance. Make your way to the Brooklyn Botanic Garden situated on 52 acres within Prospect Park, boasting a lush oasis of native flora and fauna, a Japanese Garden pond, and so much more. *Audi Q8 e-tron must be reserved 24 hours in advance with concierge. Reserve tagline Travel with Care Long Island's Sparkling Shoreline Escape to Long Island’s sparkling shoreline and coastal charm beginning at the magnificent and historic Oheka Castle. Explore natural beauty and history with a guided tour of the treasured castle and gardens, situated atop a hill on the highest point of Long Island’s Gold Coast. After a breathtaking tour of the estate, top things off with an unforgettable meal at the OHK Bar & Restaurant, basking in the authentic European ambiance. *Audi Q8 e-tron must be reserved 24 hours in advance with concierge. Reserve Upcoming Events View all Wed 5 Mar Brooklyn Bridge Lobby Wellness Wednesdays with Plentea Matcha March 5 Wed 5 Mar Brooklyn Bridge Bamford Wellness Spa Midday Mindfulness Monday-Thursday Wed 5 Mar Brooklyn Bridge The Osprey Sustainable Sips: Oyster Happy Hour Mon-Fri Thu 6 Mar Brooklyn Bridge Social Space, Outdoor Patio Sunrise Yoga Flow Thursdays Fri 7 Mar Brooklyn Bridge Harriet's Lounge Harriet's Night Shift Weekly on Friday and Saturday Sat 8 Mar Brooklyn Bridge Social Space, Outdoor Patio Fitness Flow Saturdays Sat 8 Mar Brooklyn Bridge The Osprey Sounds of Brooklyn Weekly on Saturday Fri 14 Mar Brooklyn Bridge lobby New Season Tarot Readings March 14 & 28 Sat 15 Mar Brooklyn Bridge Blue Wood Aster Rescue Puppy Yoga with Woof Wellness March 15 Fri 21 Mar Brooklyn Bridge Lobby Sustainable Succulents with KINKA March 21 The Screening Room Join us for our weekly Movies at 1 movie nights, or welcome up to 50 guests for private screenings and presentations. Request Information [salon] 718 Looking for a bit of glam for a special event or just a night out? We have partnered with our Brooklyn neighbor, [salon] 718 for in-room hair and makeup services. Book Now Neighborhood Guide We've curated a neighborhood guide outlining local attractions and activities like sustainable shopping, dog parks, restaurants, entertainment and more - so you can know what it's truly like to live local. Discover More Sleep Brooklyn Bridge Relax & Stroll Enjoy hassle-free travel with a Joolz Aer+ Stroller or Carrycot rental during your stay. Sleep Brooklyn Bridge Give Green, Get Green Up to 40% off your stay & $30 hotel credit Sleep Brooklyn Bridge Starlit Sleepover Children’s tent set up Galaxy Star Projector in-room Freshly baked cookies and milk Family-Friendly Movie and Popcorn & Candy Fully Electric Audi Adventures Through London’s Storied Streets Explore the iconic sights and hidden corners of London with a thoughtfully curated journey in our... Continue Reading Fully Electric Audi Adventures Through London’s Storied Streets Honoring Black History Through Nature & Craft Get to know some of the talented and dynamic BIPOC partners across our sanctuaries as they share... Continue Reading Honoring Black History Through Nature & Craft The Art of Seasonality: Chef Josh Bosen’s Inspired Approach to Melbourne Dining Discover how Chef Josh Bosen plans to redefine dining at 1 Hotel Melbourne, blending creativity... Continue Reading The Art of Seasonality: Chef Josh Bosen’s Inspired Approach to Melbourne Dining Rethink Your Drink: Lyre’s on the Craft of Alcohol-Free Indulgence Explore the world of non-alcoholic spirits, embrace mindful drinking, and enjoy a sustainable twist... Continue Reading Rethink Your Drink: Lyre’s on the Craft of Alcohol-Free Indulgence New Year, New Horizons: Chef Michael Solomonov’s Tips for Travel, Wellness, and Culinary Adventures in 2025 A Fresh Take on Balance, Flavor, and Exploration for the Year Ahead. Continue Reading New Year, New Horizons: Chef Michael Solomonov’s Tips for Travel, Wellness, and Culinary Adventures in 2025"
