["https://1hotels.com/sprouting-soon"]
title = "New Properties Sprouting Soon - 1 Hotel"
description = "New 1 Hotels properties are on the horizon. Stay tuned for updates on new developments and destinations."
full_description = '''1 Hotels: Our Growing Brand The newest locations for 1 Hotels mark an exciting chapter for the brand, positioning 1 as an international leader in environmentally-responsible hospitality and innovation. This expansion is the beginning of a global growth plan to bring the brand and its mission to new audiences. 1 Hotel Austin 1 Hotel Austin will be an integral component of an innovative mixed-use project currently under construction at the meeting of Waller Creek and Lady Bird Lake. Upon completion, the property will be the tallest tower in Texas and overlook a verdant gateway to the historic Rainey Street District. Every exterior and interior feature radically reduces the environmental impact and will restore the beauty of nature to a long-neglected creek-side site, conveniently located in the heart of the Lone Star State's cultural, musical, and political capital. 1 Hotel Cabo 1 Hotel & Homes Cabo, developed in partnership with the Questro Grupo, sits on the historic Hacienda site directly on the only year-round swimmable beach and steps from the marina and Cabo’s dining and nightlife district. With unobstructed views of the Land’s End rock formation, the 115-room and 50-home property is a retreat amongst it all, featuring four swimming pools, an organic spa and fitness facilities, two signature restaurants, a juice bar and a stunning rooftop bar. We are currently welcoming guests to 1 Homes Preview Cabo. Explore 1 Hotel Copenhagen With plans to be a fully carbon neutral urban center by 2025, Copenhagen was the natural choice for 1 Hotels' first hotel in Northern Europe. Centrally located in the Danish capital's history heart, by the 17th-century Round Tower and bordering the lively Latin Quarter, is within walking distance of major attractions and boasts sweeping views of the Old Town. Explore 1 Hotel Diriyah Surrounded by ancient architecture, enduring heritage, and boundless ethereal beauty, 1 Hotel Diriyah invites you to experience timeless serenity in the heart of history. Set to open in 2027, this sanctuary will boast nature-centric design elements, five locally inspired restaurants and bars, a world-class spa, and three stunning pools. 1 Hotel & Homes Elounda Hills 1 Hotel & Homes Elounda Hills will be the newest sustainable sanctuary of 1 Hotels, offering an unparalleled luxury hotel experience that honors ancient Mediterranean history and its undeniable influence on the modern world. Situated on the northeast coast of Crete, this Grecian oasis is not only surrounded by the enchanting Elounda Hills and rugged coastline of Mirabello Bay — it’s welcomed by a culture centered around warmth, vitality, and hospitality. 1 Hotel & Homes Melbourne 1 Hotel Melbourne will feature 280 guest rooms, a state-of-the-art wellness center, a 1,000-seat function center, a variety of dining options, and a stunning lobby bar. Situated on the Yarra River, the hotel will provide breathtaking waterfront views and provide access to a 3,500-square-meter public park. Explore 1 Hotel Paris 1 Hotel Paris will be housed in a sustainable and innovative building designed by Kengo Kuma and Associates to serve as a landmark and a "green lung" for the Paris-Rive Gauche neighborhood. The hotel will feature an abundance of greenery as well as a roof terrace, state-of-the-art gym, restaurant, and co-working space. 1 Hotel & Homes San Miguel de Allende With approximately 97 keys and 48 residences, 1 Hotel & Homes San Miguel de Allende is set to become a new cultural icon in this UNESCO World Heritage city. Located just minutes away from the vibrant city center of San Miguel de Allende and perched on an incline with breathtaking views, this sanctuary will offer a profound escape guided by the beauty of its surroundings in the heart of historic Mexico. 1 Hotel Tokyo Set to open in Fall 2025, 1 Hotel Tokyo will bring a serene sanctuary to the vibrant Akasaka district. Anchoring Mori Trust’s Tokyo World Gate Akasaka project, this thoughtfully designed haven will blend biophilic design with the Japanese concept of wabi-sabi, celebrating the beauty of nature and imperfection. With 211 guest rooms, lush greenery throughout, and striking views from the 38th-floor lobby, 1 Hotel Tokyo will offer a peaceful escape in the heart of the city. I wanted to capture the beauty of nature in a hotel and commit to safeguarding it as best I can, a responsibility that I believe we all share. It’s 1 world. tagline Barry Sternlicht, Founder, 1 Hotels'''
year_published = 2025
