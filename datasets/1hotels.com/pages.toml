full_description = 'Gallery3971 Marina View Studio Take in views of the famed Marina Cabo San Lucas from your serene studio featuring a kitchen, spacious bathroom and a private terrace with a plunge pool. Average Size: 905 sq.ft. | 84 sq.m. King Bed 2 People Marina View Plunge Pool Book This Room Check In Wednesday 5 Mar, ▼ Check Out Thursday 6 Mar, ▼ Check Availability All Rooms Include Free WiFi 55"+ HDTV Washer & Dryer Bluetooth Speaker Filtered Water Nespresso Machine Keetsa Mattress Cotton Bedding Soft Cotton Robes Cotton Slippers Yoga Mat Custom Bath Products 1 Hotels Mobile App Explore Offers View all Offers Sleep Cabo Sleep Suite Up to 40% Off Your Stay + $50 Dining Credit Sleep Cabo Be Well at 1 Palo Santo Smudge Stick + Daily Smoothie Sleep Cabo We Are 1 Up to 30% Off Your Stay + $30 Hotel Credit ENDS March 20 Sleep Cabo Winter Solstice Up to 30% off your stay$20 dining credit to Food Truck Flexible cancellation Hotel Policies CANCELLATION / NO SHOW GUARANTEE / DEPOSIT EARLY ARRIVAL / LATE DEPARTURE TAXES & FEES PETS SMOKING RULES OF OPERATION GENERAL FREQUENTLY ASKED QUESTIONS CANCELLATION / NO SHOW CANCELLATION / NO SHOW Pay Now rates are pre-paid and nonrefundable. Pay Later rates must be cancelled 30 days prior to arrival, by 12pm hotel time, to avoid a penalty of the first two nights’ stay plus tax. There are particular dates throughout the year when guarantee and cancellation policies may vary. Exceptions may apply–please see rate rules. GUARANTEE / DEPOSIT GUARANTEE / DEPOSIT A major credit card is required to guarantee your booking. A deposit may be required–please see rate rules. The credit card used for payment must be presented at check-in. For third-party payments, please contact our reservations team at least seven days prior to arrival. EARLY ARRIVAL / LATE DEPARTURE EARLY ARRIVAL / LATE DEPARTURE Check-in time is 3pm and check-out time is 12pm. Book an early flight? Want to sleep in? We’ll do our very best to accommodate you—just let us know