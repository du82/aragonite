["https://1hotels.com/cabo/hotel-rooms/four-bedroom-ocean-view-home-baja-collection-2"]
title = "Four Bedroom Ocean View Home - Baja Collection 2 - 1 Homes Cabo"
description = "Your four-bedroom retreat with a private terrace that offers stunning views of Medano Beach and Land’s End. Baja Collection homes feature unique furnishings and decor inspired by the region."
full_description = 'Gallery674 Four Bedroom Ocean View Home - Baja Collection 2 Your retreat with four bedrooms and three and a half bathrooms features a spacious living and dining room, an open kitchen, and a private terrace with stunning views of Medano Beach and Land’s end. Three king beds and two full beds offer sleeping for up to eight guests. Baja Collection homes feature unique furnishings and decor inspired by the region. Average Size: 3363 sq.ft. | 312 sq.m. 3 King Beds 2 Full Beds 9 People Separate Rain Shower Ocean View Plunge Pool Book This Room Check In Wednesday 5 Mar, ▼ Check Out Thursday 6 Mar, ▼ Check Availability All Rooms Include Free WiFi 55"+ HDTV Washer & Dryer Bluetooth Speaker Filtered Water Nespresso Machine Keetsa Mattress Cotton Bedding Soft Cotton Robes Cotton Slippers Yoga Mat Custom Bath Products 1 Hotels Mobile App Relax Discover a modern and sophisticated retreat in the heart of Cabo. Designed in the classic Mexican hacienda style but stripped down to their essence, homes feature pure forms, timber, local stone finishes, and tonal walls and ceilings of hand-applied stucco. Spacious bedrooms offer plush beds with organic cotton sheets, 55" HDTVs, and large windows or terraces framing iconic views. Reconnect Bring family or friends together, surrounded by the beauty of Baja. Expansive living/dining rooms adjoin full kitchens and open to oversized terraces with sweeping views. The outdoors is also brought in, with repurposed materials, raw textures, living plants, and abundant natural light. Refresh Slip into your standalone custom-crafted wood and stone bathtub or step into your rainshower, with filtered water and 1 Hotels bath products made from naturally derived ingredients. Then wrap yourself in an organic cotton towel and get cozy with our soft cotton robe and slippers. Refuel Refuel on your schedule with seasonal, locally-sourced, vibrant fare delivered to your home 24 hours a day. Explore Offers View all Offers Sleep Cabo Sleep Suite Up to 40% Off Your Stay + $50 Dining Credit Sleep Cabo Be Well at 1 Palo Santo Smudge Stick + Daily Smoothie Sleep Cabo We Are 1 Up to 30% Off Your Stay + $30 Hotel Credit ENDS March 20 Sleep Cabo Winter Solstice Up to 30% off your stay$20 dining credit to Food Truck Flexible cancellation Other Rooms You May Like Gallery679 Three Bedroom Ocean View Home Three Bedroom Ocean View Home Beds Vary 7 People Separate Rain Shower Ocean View Average Size: 3473 sq.ft. | 322 sq.m. View Details Three Bedroom Ocean View Home Gallery681 Two Bedroom Ocean View Home Two Bedroom Ocean View Home Beds Vary 5 People Separate Rain Shower Ocean View Plunge Pool Average Size: 2999 sq.ft. | 278 sq.m. View Details Two Bedroom Ocean View Home Hotel Policies CANCELLATION / NO SHOW GUARANTEE / DEPOSIT EARLY ARRIVAL / LATE DEPARTURE TAXES & FEES PETS SMOKING RULES OF OPERATION GENERAL FREQUENTLY ASKED QUESTIONS CANCELLATION / NO SHOW CANCELLATION / NO SHOW Pay Now rates are pre-paid and nonrefundable. Pay Later rates must be cancelled 30 days prior to arrival, by 12pm hotel time, to avoid a penalty of the first two nights’ stay plus tax. There are particular dates throughout the year when guarantee and cancellation policies may vary. Exceptions may apply–please see rate rules. GUARANTEE / DEPOSIT GUARANTEE / DEPOSIT A major credit card is required to guarantee your booking. A deposit may be required–please see rate rules. The credit card used for payment must be presented at check-in. For third-party payments, please contact our reservations team at least seven days prior to arrival. EARLY ARRIVAL / LATE DEPARTURE EARLY ARRIVAL / LATE DEPARTURE Check-in time is 3pm and check-out time is 12pm. Book an early flight? Want to sleep in? We’ll do our very best to accommodate you—just let us know in advance. If we can’t, we’ll gladly stow your luggage safely and securely, until you’re ready to move on. There is an early departure fee of one night’s stay plus tax. TAXES & FEES TAXES & FEES Standard hotel taxes, tourism assessments and environmental sanitation tax are applied to all reservations. Daily housekeeping is included in room rates. PETS PETS Unfortunately, pets are not allowed. Service animals are always welcome. To book a stay with your service animal, please contact our reservations team by phone at 855.268.2681 (US) or +52 624.689.0600 (Mexico). SMOKING SMOKING 1 Homes Cabo is a smoke-free property. Smoking in homes will incur a fee of $400 USD per home. RULES OF OPERATION RULES OF OPERATION To ensure the safety of all guests and residents and provide a quiet relaxing atmosphere, please review our rules of operation. GENERAL GENERAL Reception is staffed 24 hours a day, seven days a week. Check-in starts at 3pm, and check-out time is 12pm. Daily housekeeping service is included in room rates. All homes offer private bathrooms. No minimum length of stay is required (exceptions may apply for select dates). FREQUENTLY ASKED QUESTIONS FREQUENTLY ASKED QUESTIONS Looking for more information about 1 Hotel Cabo? Visit our Frequently Asked Questions page for all of the answers.'
