35% off your stay $500 wellness credit Do Nashville Weekday Wellness 10% off spa services Monday - Wednesday Do Nashville Doug the Pug Pet Package Custom 1 Hotels pet amenities Nonipup vegan pet products List of pet-friendly spas, parks, restaurants and more around the city Gather Nashville Watch Love Grow Stay in Terrace House Suite Proposal Planning Photographer Private Dinner for Two Breakfast in Bed Couples Spa Treatment Nature is Home in Nashville Geography Climate Flora Fauna Natural Attractions Sustainability Geography Nashville sits along the Cumberland River in the Central Basin of Middle Tennessee, roughly 600 feet above sea level. Famously known as Music City, this charming urban center draws character from the fertile farmlands, lush hills and valleys, and historic homesteads that span for miles in each direction. Close Climate Nashville’s climate is considered subtropical, with hot and humid summer days averaging around 90°F. Spring and fall in the city are warm and pleasant, but prone to thunderstorms — contributing to the average rainfall of nearly 50 inches per year. Nashville winters are somewhat mild, with average temperatures of 30°F and an annual snowfall of 9 inches. Like many of the other cities that house our urban retreats, Nashville puts on a beautiful, gentle display of the passing seasons. Close Flora Nashville’s cityscape is juxtaposed with numerous parks that house gorgeous native plants. In the warmer months, stroll through vibrant groves of Red Maple, Pink Dogwood, Weeping Honeylocust, Sweetbay Magnolia, and Yellowwood Trees. The bright blooms of the Brown Eyed Susan, Tennessee Coneflower, Purple Bergamot, and orange-red Crossvine add a burst of color to Nashville’s urban landscape in the spring and summer months. Close Fauna Surrounded by miles of undeveloped lands and forests, many animal species have made their way into Nashville’s city limits. It’s common to see squirrels, raccoons, opossums, chipmunks, and numerous birds in the city. As you stroll through the parks, watch out for the colorful sights of American Goldfinch, Sparrow, Indigo Bunting, Baltimore Oriole, and Northern Mockingbird. Around the Cumberland River Basin, you might find otters, beavers, skunks, wild hogs, elk, deer, coyotes, bobcats, and even large black bears. The Cumberland River itself is extremely biodiverse, nurturing over 300 species of fish and 125 species of freshwater mussels. Close Natural Attractions Nashville’s 132-acre Centennial Park is home to lush vegetation, beautiful walking trails, the iconic Parthenon, the Sunken Garden, and Lake Watauga. Within the park, the energizing sounds of Music City are replaced with the soothing sounds of nature, making it the perfect setting for a mindful walk, romantic picnic, or family adventure. Just a few miles southwest of Centennial Park, you’ll find Cheekwood Estate & Gardens — 55 acres of land boasting luscious paths, fields of neon wildflowers, and flourishing wildlife. Close Sustainability In recent years, Nashville has made considerable progress toward reducing greenhouse gas emissions. From 2014 to 2017, the city cut emissions by nearly 10% per capita. In early 2022, Nashville formally committed to a goal to reduce greenhouse gas emissions by 80% by 2050 through renewable energy and reforestation initiatives. As the most populous city in Tennessee — and the 21st most populous city in the country — Nashville acknowledges and owns its frontline position in the fight against climate change. Close Your favorite moments @1hotel.nashville #1hotelnashville https://www.instagram.com/1hotel.nashville/ https://www.tiktok.com/@1hotels?lang=en https://www.facebook.com/1HotelNashville/ Photo by: hadmeatnashville, Captions reads: never want sundress season to end 💙☀️ • • boskemper.studio zara astrthelabel abednegoboutique misa_losangeles farmrio bardot szblockprints dolcevita fendi staud.clothing vincecamuto #HadMeAtNASH #sundressszn #sundresses #summerlook #southernlooks #tenne