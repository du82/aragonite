["https://1hotels.com/nashville"]
title = "1 Hotel Nashville: Pet-Friendly Luxury Hotel Nashville"
description = "Located in the heart of downtown Nashville, 1 Hotel Nashville is the city’s first mission-driven, pet-friendly, sustainable luxury hotel."
full_description = "1 Hotel Nashville Nashville, TN 710 Demonbreun Street Get Directions Sustainable luxury in the center of downtown Nashville, where the beauty of nature intertwines with the invigorating energy of city living. LEED Silver Skyline Views Designed By Nature Pet Friendly Electric Audi House Car Sustainable Cuisine Rooftop Bar Bamford Wellness Spa Gym & Classes Sustainable Gatherings AT 1 WITH NATURE When you arrive at 1 Hotel Nashville, you’ll be greeted by 56,000 flourishing plants, all of which grow on our ivy facade, migrating heat from the sidewalks and generating fresh air. The resilience of these plants allows us to avoid fertilizers and other chemical treatments—56,000 wins for nature. DRINKING SUSTAINABLY Each room is equipped with water filtration in every faucet and recycled wine-into-water bottles. No thank you, single-use plastics. PEACE OF MIND We provide locally sourced, sustainable bed linens and non-toxic, organic mattresses, so you and the earth can sleep soundly. WANDERING RESPECTFULLY Explore the city emission-free in our fully electric Audi Q8 e-tron house car, or take a walk and explore South Broadway, live music, museums, and everything in between. Explore EASY CONSERVATION Shower times in every bathroom—a friendly reminder, on behalf of water, to keep your showers to five minutes or less. 1 LESS THING Overpacked? Simply leave a piece of clothing (or two) under this block to get your pre-loved threads into the hands of those in need through our local charity People Loving Nashville. 2024 MICHELIN KEY We are honored to receive a Michelin Key from the MICHELIN Guide. This accolade represent's our team's passion for excellence and dedication to providing unparalleled service for our guests. Learn More Tennessee's Best Hotel Spa 2024 Bamford Wellness Spa at 1 Hotel Nashville is proud to be named Tennessee's Best Hotel Spa in the 2024 World Spa Awards. The World Spa Awards is a global initiative dedicated to celebrating and rewarding 