sh fare and a deep respect for seasonal, organic, and locally sourced ingredients. The hotel also features a signature cocktail bar, Dover Yard, and a lobby café, Neighbours, for anytime get-togethers. Explore Dining Do Recharge with a custom fitness programming at The Field House, unwind and restore at Bamford Wellness Spa, wander the nature of Green Park, St. James’ Park, and Hyde Park, browse through boutiques on Bond Street, and find the West End’s 39 theatres, museums, and galleries just a short stroll away. Do More Gather 1 Hotel Mayfair offers a new way for guests to gather and host, with five interconnected spaces that adapt nimbly to multiple layouts, all with advanced tech, turnkey planning services and custom seasonal menus. View Our Spaces Offers & Experiences View all ENDS March 20 Sleep Mayfair Winter Solstice Up to 30% off your stay £30 F&B credit Extra 30 minutes with any 60-minute Bamford Wellness Spa treatment Flexible cancellation Sleep Taste Mayfair 1 Right Way to Start the Day - Includes Breakfast Up to 30% off your stay Daily breakfast Sleep Mayfair Sleep Suite £100 food & beverage credit Sleep Taste Mayfair Weekend Brunch & Stay Up to 40% off your stay Brunch credit for two (£50/pp) 1pm late check out (Valid for stays on Fri & Sat) Sleep Do Mayfair Relax at Bamford Wellness Spa £100 Bamford Wellness Spa Credit Sleep Mayfair Give Green, Get Green Up to 30% off your stay £30 food and beverage credit or donation Flexible cancellation ENDS April 03 Sleep Mayfair 1 On Us Spend more time at our sustainable sanctuary. Enjoy every third night on us. Sleep Mayfair Starlit Sleepover Up to 40% off best available rates Children’s tent set up Galaxy Star Projector in-room Freshly baked cookies and milk Movie and Popcorn ENDS April 01 Sleep Do Mayfair Mind, Body, HeART with Robi Walters Robi Walter's Chakras Bamford B Silent Sleep Spray Bang & Olfusen Sound Experience Gather Mayfair Memories in Mayfair - Group Offer Enjoy exclusive perks with this seasonal group offer Nature is Home in Mayfair Geography Climate Flora Fauna Natural Attractions Sustainability Geography London, the capital of both England and the UK, includes 1,579 square km (610 sq. mi) of bustling cityscape juxtaposed with thousands of acres of green parks and hundreds of kilometers of flowing water. The magnificent River Thames flows through the middle of the city, offering beautiful sights and playing a central role in its history and economy. Close Climate Mayfair puts on a beautiful show as the seasons change with mild winters, vibrant springs, temperate summers, and amber autumns. The average daytime temperature is 52 °F (11 °C) in January and 65 °F (18 °C) in July. The city is also famous for its dramatic cloudy skies and average annual rainfall of 23 inches (585 mm). Even during the clearest month of the year, July, it’s cloudy over 50% of the time. During its cloudiest month, December, you can expect clouds or overcast over 70% of the time. Close Flora Throughout the city itself, you can expect to cross paths with a wide variety of trees such as mimosas, redwoods, birch trees, London planes, nettle trees, and beyond. In the spring and summertime, you can stroll through fields of bluebells and fresh lavender. In London’s green spaces, you can expect to see long stretches of verdant grasslands, thousands of ancient trees, and vibrant wildflower meadows, providing a lush home for countless pollinator and wildlife species. Close Fauna Don’t be fooled by its urban aesthetic, this city is home to over 5,000 species of wildlife. Strolling through the avenues, you can expect to see a vast array of birds — from peregrine falcons soaring through the air to swans floating through the canal. London’s green spaces are also home to deer, foxes, bats, squirrels, hedgehogs, and many more. Close Natural Attractions Eight Royal Parks cover nearly 40% of the city — Green Park, St. James’ Park, Hyde Park, Bushy Park, Richmond Park, Regent’s Park, Greenwich Park, and Kensington Gardens. 1 Hotel Mayfair is the perfect place to begin exploring these green spaces, as it’s nestled near Green Park, St. James’ Park, and Hyde Park. In addition to the parks, one of London’s greatest natural attractions is the River Thames, which beautifully and effortlessly interrupts its concrete surroundings. Close Sustainability London takes great pride in leading the UK in the fight against climate change with its ambitious goal towards net zero emissions by 2030, and the 2021 Energy Monitoring Report revealed great progress. The Royal Parks charity also launched a Biodiversity Framework in 2021, outlining ways to make the parks healthier and more resilient to climate change, acknowledging the vast benefits these parks provide for both people and wildlife. On top of this, the city maintains one of the greatest green public transportation networks in the world and remains a world leader in green building construction. Close Your Favorite Moments @1hotel.mayfair #1hotelmayfair https://www.instagram.com/1hotel.mayfair/ https://www.tiktok.com/@1hotels?lang=en https://www.facebook.com/1HotelMayfair Photo by: ryocozy_stays, Captions reads: 1 Hotel Central Park 🇺🇸New York, United States 💙Background: My favorite hotel in New York. NYC has many options and I probably still need to try a lot of them, but I feel great whenever I have the chance to come back here. 📍Location: 1 block from the Central Park on the 58th street with the 6th Av. I love that I can wake up in the morning and go for a run in the park without much hassle. You are also a few steps from the multiple high-end stores on the 5th Avenue and the sub is also just 1 block away. 🍴Restaurants: weirdly, I have not tried the hotel restaurant yet! With so many options in NY, this wasn’t a priority yet… My bad, but hopefully next time! 🎖️Service / Property / Other: The staff is great. Maybe I was just lucky, but they always upgrade me when there is availability (which, for me, were 100% of the stays). The property is sustainable: LEED certified, no single-use plastics, and you see all the care in the materials they have chosen for the building. The gym is small, but had everything I needed for a simple workout. #newyork #nyc #1hotelcentralpark #1hotels #nychotels ryocozy_stays Photo by: hectorthesausage, Captions reads: Some snaps from our stay so far at 1hotel.mayfair 🫶🏻 This hotel has absolutely blown us away! The gorgeous room and the super friendly staff, we feel right at home! We had drinks at doveryard.london and then dinner at dovetalelondon which are both within the hotel. Highlight for Lanks was the make your own knickerbocker glory dessert! 🍨 All parts of the hotel are dog friendly and everyone has been super accommodating- he’s had plenty of tickles and far too many treats 🦴 We are all tucked up in our room now and Hecs is snoring 🥰 looking forward to breakfast already 🤭 PR STAY hectorthesausage Photo by: hectorthesausage, Captions reads: Some snaps from our stay so far at 1hotel.mayfair 🫶🏻 This hotel has absolutely blown us away! The gorgeous room and the super friendly staff, we feel right at home! We had drinks at doveryard.london and then dinner at dovetalelondon which are both within the hotel. Highlight for Lanks was the make your own knickerbocker glory dessert! 🍨 All parts of the hotel are dog friendly and everyone has been super accommodating- he’s had plenty of tickles and far too many treats 🦴 We are all tucked up in our room now and Hecs is snoring 🥰 looking forward to breakfast already 🤭 PR STAY hectorthesausage Photo by: hectorthesausage, Captions reads: Some snaps from our stay so far at 1hotel.mayfair 🫶🏻 This hotel has absolutely blown us away! The gorgeous room and the super friendly staff, we feel right at home! We had drinks at doveryard.london and then dinner at dovetalelondon which are both within the hotel. Highlight for Lanks was the make your own knickerbocker glory dessert! 🍨 All parts of the hotel are dog friendly and everyone has been super accommodating- he’s had plenty of tickles and far too many treats 🦴 We are all tucked up in our room now and Hecs is snoring 🥰 looking forward to breakfast already 🤭 PR STAY hectorthesausage Photo by: lisa.pintaud, Captions reads: Saturday mornings 1hotel.mayfair 🤍 . . . . #neutrals #neutralstyle #minimalist #neutralinterior #neutraldecor #londonhotels #fashionblogger lisa.pintaud Photo by: lisa.pintaud, Captions reads: Saturday mornings 1hotel.mayfair 🤍 . . . . #neutrals #neutralstyle #minimalist #neutralinterior #neutraldecor #londonhotels #fashionblogger lisa.pintaud No caption provided stephaniewaxberg Photo by: kellyrosemarks, Captions reads: alo x 1hotel.mayfair saturnreturnsco ✨ there’s nothing more special than guiding a room of people who truly show up to grow and better themselves through honest conversation and vulnerability. Thank you caggiesworld for sharing the mat with me 🤍 kellyrosemarks Photo by: kellyrosemarks, Captions reads: alo x 1hotel.mayfair saturnreturnsco ✨ the"
