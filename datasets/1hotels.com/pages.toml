full_description = "Policies Here’s the need-to-know information, including reservation policies, for your stay at 1 Homes Preview Cabo. Need to know something that’s not listed below? Just reach out! Hotel Policies CANCELLATION / NO SHOW GUARANTEE / DEPOSIT EARLY ARRIVAL / LATE DEPARTURE TAXES & FEES PETS SMOKING RULES OF OPERATION GENERAL FREQUENTLY ASKED QUESTIONS CANCELLATION / NO SHOW CANCELLATION / NO SHOW Pay Now rates are pre-paid and nonrefundable. Pay Later rates must be cancelled 30 days prior to arrival, by 12pm hotel time, to avoid a penalty of the first two nights’ stay plus tax. There are particular dates throughout the year when guarantee and cancellation policies may vary. Exceptions may apply–please see rate rules. GUARANTEE / DEPOSIT GUARANTEE / DEPOSIT A major credit card is required to guarantee your booking. A deposit may be required–please see rate rules. The credit card used for payment must be presented at check-in. For third-party payments, please contact our reservations team at least seven days prior to arrival. EARLY ARRIVAL / LATE DEPARTURE EARLY ARRIVAL / LATE DEPARTURE Check-in time is 3pm and check-out time is 12pm. Book an early flight? Want to sleep in? We’ll do our very best to accommodate you—just let us know in advance. If we can’t, we’ll gladly stow your luggage safely and securely, until you’re ready to move on. There is an early departure fee of one night’s stay plus tax. TAXES & FEES TAXES & FEES Standard hotel taxes, tourism assessments and environmental sanitation tax are applied to all reservations. Daily housekeeping is included in room rates. PETS PETS Unfortunately, pets are not allowed. Service animals are always welcome. To book a stay with your service animal, please contact our reservations team by phone at 855.268.2681 (US) or +52 624.689.0600 (Mexico). SMOKING SMOKING 1 Homes Cabo is a smoke-free property. Smoking in homes will incur a fee of $400 USD per home. RULES OF OPERATION RULES OF OPERATION To ensure the 