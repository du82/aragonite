full_description = '''Contact Us Planning an upcoming trip to Cabo? We’d love to help you make the most of your time. Feel free to contact our resort to make a reservation at 1 Homes Preview Cabo, update an existing reservation, or accommodate any special requests. Simply fill out the contact form below or call us. US: 866.926.3681 | Mexico: +52 624.689.0600 <div class="antibot-no-js antibot-message antibot-message-warning">You must have JavaScript enabled to use this form.</div> Let's start a conversation All information marked with an * is required Choose a property - Select -Brand/OtherBrooklyn BridgeCaboCentral ParkCopenhagenHaitang BayHanalei BayMayfairMelbourneNashvilleSan FranciscoSeattleSouth BeachTorontoWest Hollywood First Name Last Name Email Phone Number Reason for contact - Select -ReservationsGuest Services & ConciergeMeetings & EventsMedia & PartnershipsCareersOther Reason for contact - Select -DevelopmentMedia & PartnershipsCareersOther Reason for contact - Select -ReservationsGuest Services & ConciergeOther Reason for contact - Select -ReservationsGuest Services & ConciergeMeetings & EventsMedia & PartnershipsCareersResidencesOther Thank you for your interest in a career with 1 Hotels. Please visit careers.shhotelsandresorts.com to learn more about our company, culture, benefits, and opportunities. How can we assist you? Leave this field blank Hotel Policies CANCELLATION / NO SHOW GUARANTEE / DEPOSIT EARLY ARRIVAL / LATE DEPARTURE TAXES & FEES PETS SMOKING RULES OF OPERATION GENERAL FREQUENTLY ASKED QUESTIONS CANCELLATION / NO SHOW CANCELLATION / NO SHOW Pay Now rates are pre-paid and nonrefundable. Pay Later rates must be cancelled 30 days prior to arrival, by 12pm hotel time, to avoid a penalty of the first two nights’ stay plus tax. There are particular dates throughout the year when guarantee and cancellation policies may vary. Exceptions may apply–please see rate rules. GUARANTEE / DEPOSIT GUARANTEE / DEPOSIT A major credit card is required to guarantee your booking. A deposit may be required–please see rate rules. The credit card used for payment must be presented at check-in. For third-party payments, please contact our reservations team at least seven days prior to arrival. EARLY ARRIVAL / LATE DEPARTURE EARLY ARRIVAL / LATE DEPARTURE Check-in time is 3pm and check-out time is 12pm. Book an early flight? Want to sleep in? We’ll do our very best to accommodate you—just let us know in advance. If we can’t, we’ll gladly stow your luggage safely and securely, until you’re ready to move on. There is an early departure fee of one night’s stay plus tax. TAXES & FEES TAXES & FEES Standard hotel taxes, tourism assessments and environmental sanitation tax are applied to all reservations. Daily housekeeping is included in room rates. PETS PETS Unfortunately, pets are not allowed. Service animals are always welcome. To book a stay with your service animal, please contact our reservations team by phone at 855.268.2681 (US) or +52 624.689.0600 (Mexico). SMOKING SMOKING 1 Homes Cabo is a smoke-free property. Smoking in homes will incur a fee of $400 USD per home. RULES OF OPERATION RULES OF OPERATION To ensure the safety of all guests and residents and provide a quiet relaxing atmosphere, please review our rules of operation. GENERAL GENERAL Reception is staffed 24 hours a day, seven days a week. Check-in starts at 3pm, and check-out time is 12pm. Daily housekeeping service is included in room rates. All homes offer private bathrooms. No minimum length of stay is required (exceptions may apply for select dates). FREQUENTLY ASKED QUESTIONS FREQUENTLY ASKED QUESTIONS Looking for more information about 1 Hotel Cabo? Visit our Frequently Asked Questions page for all of the answers. Legend Our Location 1 Homes Preview Cabo Paseo de La Marina 4732, Col. El Médano Cabo San Lucas, B.C.S. 23453 Get Directions A retreat in the middle of it all, 1 Homes Preview Cabo is ideally situated on swimmable Medano Beach, adjacent to the famed Marina Cabo San Lucas. Take in direct views of Land's End, where the Sea of Cortez meets the Pacific, and walk to Cabo's best sites and sensations, with downtown Cabo's vibrant daylife, dining, shopping, and nightlife just minutes away. Our Locations Locations marked with an * are sprouting soon North America Brooklyn Bridge Brooklyn, NY Central Park New York City, NY Hanalei Bay Kauai, HI Nashville Nashville, TN San Francisco San Francisco, CA Seattle Seattle, WA South Beach Miami Beach, FL Toronto Toronto, Canada West Hollywood West Hollywood, CA Europe Copenhagen Copenhagen, Denmark Mayfair London, UK Asia Pacific Haitang Bay Sanya, China Melbourne Melbourne, Australia'''
