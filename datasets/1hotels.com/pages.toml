title = "1 Hotel Copenhagen - Luxury Hotel in Copenhagen City Centre"
description = "Discover 1 Hotel Copenhagen, where sustainable design and eco-conscious architecture meet exceptional accommodations for a new luxury stay in the city centre."
full_description = "1 Hotel Copenhagen Sprouting 2025 Krystalgade 22, 1172 Get Directions Welcome to your Copenhagen haven, nestled in the historic heart of the city. Here, adventure awaits right outside our doorstep, inviting you to explore a world where centuries blend seamlessly. Contact Us: [email protected] Designed By Nature Pet Friendly Farm to Table Mind & Movement Sustainable Gatherings Bamford Wellness Spa Cocktail Bar In-Room Wellness Goodthings Shop Gym & Classes At 1 with Nature Discover an oasis where urban charm meets the tranquility of nature, at the intersection of Copenhagen's vibrant Latin Quarter and its historic heart. Our nature-inspired sanctuary invites you to explore the natural beauty and lively spirit of the city from a perfect vantage point. Good Energy is Clean Energy Our sanctuary is optimized for energy efficiency and powered by green systems, including low-energy LED lighting and intelligent temperature controls. Reimagine and Restore This construction of our sanctuary is a project of true reimagination and renovation, minimising waste and emissions throughout the process. We’re salvaging and repurposing existing furniture, fittings, and equipment wherever possible, using low-impact, locally sourced materials for any new construction. 1 Less Thing Overpack and want to give back? Lighten your suitcase and your heart by leaving behind a pre-loved piece of clothing or two, and we’ll give them a new home through our local charity partner. Experience Local Elements From the tiles in the lobby to the wooden elements in each guestroom, 1 Hotel Copenhagen spotlights locally sourced and often recycled materials around every turn. With walls finished using Scandinavian marble paints and naturally pigmented clays, settle in knowing that every detail has been designed with you and the planet in mind. Spotless Drinking In each guest room, you’ll find a dedicated bottle-fill station with high-quality filtered drinking water and low-flow fixtures to effortlessly reduce water usage. All outdoor spaces utilise a drip irrigation system to reduce transpiration and water consumption. Wellness Our state-of-the-art Bamford Wellness Spa and fitness centre were designed to nurture your mind, body, and spirit. Unwind with rejuvenating spa treatments or challenge your body with freestyle workouts, group classes, and 1-on-1 training sessions at The Field House. Stay Well Fur-Family Friendly We would never ask you to leave your precious pets behind! As a pet-friendly hotel, your furry friend is always welcome here—with exciting perks. Pet Friendly Taste Savour locally sourced, seasonal cuisine as eclectic as the city itself at our traditionally inspired restaurant and lobby bar. Relax and refuel on your own schedule with in-room dining or grab a perfectly imperfect piece of fresh produce from the Lobby Farmstand whenever you’re craving a few bites of natural nourishment. Explore Dining Do Embrace daylife, from panoramic views of the city skyline from our rooftop terrace to invigorating sessions in our state-of-the-art fitness centre. Find tranquility in our nature-inspired spa, or embark on an urban adventure, exploring Copenhagen's rich tapestry of parks and museums on bike. Do More Gather From weddings to conferences, our event spaces can naturally adapt to any gathering through bespoke planning services and customisable seasonal menus. With a configurable banquet space alongside multiple meeting rooms, you’ll have everything you need to craft unforgettable memories. View Our Spaces Nature is Home in Copenhagen Geography Climate Flora Fauna Natural Attractions Geography Copenhagen is the largest city in Denmark, located on the islands of Zealand and Amager. The central parts of the city exist on low-lying flat ground, surrounded by preserved ramparts from the 17th century. The quaint coastlines of Amager Beach, the Copenhagen Lakes, and the Øresund Strait beautifully contrast the urban areas. The same can be said about the Nyhavn Harbour, a picturesque destination lined with colourful townhouses, historical ships, and lively cafés. Close Climate With a moderate oceanic climate, Copenhagen experiences long rainy and sometimes snowy winters with an average temperature of around 0°C (32°F). The city boasts pleasantly warm summers with an average temperature of 21°C (69.8°F) and mild springs and autumn in between. Copenhagen is known for its cloudy overcast, giving its unique urban architecture a perfectly moody backdrop. Close Flora Stroll along Copenhagen’s tree-lined streets, showcasing beautiful species such as oak, beech, chestnut, maple, pine, and spruce. In the warmer months, soak up sights of bright flowers including hydrangeas, tulips, roses, lavender, and daisies. Near the waterfronts, enjoy vibrant aquatic plants such as water lilies, vibrant reeds, and algae. Close Fauna Copenhagen is home to a wide range of woodland fauna—squirrels, hedgehogs, rabbits, and an abundance of birds such as sparrows, seagulls, ducks, swans, and robins. On the outskirts of the city, you might catch a glimpse of larger mammals like deer and foxes. Near the city’s surrounding waters, you can find crabs, shrimp, cod, flounder, herring, seals, frogs, toads, and lizards. Close Natural Attractions From the scenic waterfronts of the Copenhagen Lakes and Amager Beach to the luscious groves of Tivoli Gardens, Frederiksberg Gardens, and The King’s Garden, Copenhagen is overflowing with natural beauty and rich history. Plan a picnic or a stroll alongside the lush greenery, bright flower beds, and serene waters that exquisitely interrupt their urban surroundings. The University of Copenhagen also manages a Botanical Garden with greenhouses and outdoor exhibitions full of species from around the world, providing another soothing escape right in the heart of the city. Close Your Favourite Moments @1hotelcopenhagen #1hotelcopenhagen https://www.instagram.com/1hotelcopenhagen/ https://www.tiktok.com/@1hotels?lang=en https://www.facebook.com/1Hotel.copenhagen Photo by: this_bird_set_free, Captions reads: 🤎 this_bird_set_free Photo by: josemelgarejo.us, Captions reads: 📸🎥🎞️ Shooting CINEMATIC ENGAGEMENTS is part planning and part flow. 👇 🫶🏽A ton of work to bring a great concept to life and to get all three of us — myself the photographer my couple emotionally on board with what we’re about to create. 🌉Here’s a few snapshots of the engagement session we brought to life at the 1hotel.bklynbridge in the heart of DUMBO BROOKLYN. I may share more from this shoot, but here’s a preview with some shots I’m truly proud of. 🤓I used an adapted camera with a special lens to get some of these effects as well as my own presets based on vintage film stock. Incredibly empowering to see a concept and vision come together. 🌅📸 🛑Choose your adventure - the next post should be : josemelgarejo.us Photo by: jabbarlewis, Captions reads: NYC I LOVE YOU!!! jabbarlewis Photo by: letsnomnom_, Captions reads: savoring the simple pleasures of slow mornings ✨ waking up to waffles, the crunch of a freshly baked croissant, and a good book — topped off with stunning view of the bay bridge ☺️ 1hotel.sanfrancisco Terrene.SF #1hotelSF #TerreneSF #1Hotels #sponsored letsnomnom_ Photo by: kathrinsmirke, Captions reads: Enjoyed a wonderfully relaxing spa day at bamford within the breathtaking 1hotel.hanaleibay 🌺🧖‍♀️ kathrinsmirke Photo by: bradyhousestudios, Captions reads: A quite moment after the ceremony for shared breath + exchanging personal vows under this magical tree at the 1hotel.hanaleibay #kauai bradyhousestudios Photo by: aubestlife, Captions reads: Happy Earth Day! 🌍 Today, let's take a moment to appreciate the stunning natural beauty that surrounds us here in Hawaii. From the crystal clear waters of our beaches to the lush greenery of our forests, we are so lucky to call this place home. Let's do our part to protect and preserve it for generations to come. 🌈🌺🩵🏝️🌊🌱🌏 Small actions can make a big difference, et's commit to adopting sustainable practices in our daily lives. Whether it's using a reusable water bottle, choosing to walk or bike instead of drive, or supporting local businesses that prioritize the environment, we can all do our part to reduce our impact on the planet. #earthday2023 #alaskaairlines #iflyalaska #alaskacarelines #1hotel alaskaair 1hotel.hanaleibay aubestlife Photo by: sheepadood.levi, Captions reads: Me and Moms had the BEST night and I can’t wait to tell you all about it!! Soaking up the views this morning from my home for the weekend 🌥️ 1hotel.bklynbridge 🐾 sheepadood.levi Photo by: pixiprol, Captions reads: 1 Hotel West Hollywood 🌅 • • • 1hotel.weho #losangeles #1hotel #california #room #hotelroom #1hotelwesthollywood #westhollywood #hollywood #1hotelweho #traveladdict #luxury #instamood #traveladdict #losangeles_city #socal #voyaged #voyage #businesstrip #traveling #interiordesign #luxury #upscale #5star #sustainable #sustainableluxury #environment #californialove #hotelroom #hotellover #cozy #sunrise #pool #swimmingpool pixiprol Photo by: kimiaskravings, Captions reads: Baycation’s all I ever wanted ✨ kimiaskravings Fully Electric Audi Adventures Through London’s Storied Streets Explore the iconic sights and hidden corners of London with a thoughtfully curated journey in our... Continue Reading Fully Electric Audi Adventures Through London’s Storied Streets Honoring Black History Through Nature & Craft Get to know some of the talented and dynamic BIPOC partners across our sanctuaries as they share... Continue Reading Honoring Black History Through Nature & Craft The Art of Seasonality: Chef Josh Bosen’s Inspired Approach to Melbourne Dining Discover how Chef Josh Bosen plans to redefine dining at 1 Hotel Melbourne, blending creativity... Continue Reading The Art of Seasonality: Chef Josh Bosen’s Inspired Approach to Melbourne Dining Rethink Your Drink: Lyre’s on the Craft of Alcohol-Free Indulgence Explore the world of non-alcoholic 