v, Captions reads: RECOMENDACIÓN DE VIERNES: harrietsbk Ya lo había enseñado alguna vez, pero, desde luego, este rooftop es una pasada. Está situado en el 1hotel.bklynbridge (sería un sueño poder pasar una noche en una habitación con esas vistas 😍) justo al lado de la piscina. No es un rooftop de los más baratos en cuanto a precio de bebida / comidas pero si queréis pasar una tarde/noche especial, merece la pena. Ya sabéis, guardad el post y si vais, ¡quiero verlo! 📍harrietsbk at 1hotel.bklynbridge Day 25 #100dayprojectALLinNYC #ny #brooklyn #brooklynbridge #newyork #ig_nycity saritafv Photo by: hellofatmata, Captions reads: Day 27 of 30: Embracing my blonde moments!😍✨ In this countdown, I've embraced spontaneity, going with the flow and sharing memories from my travels. Today, I was reminded that I rocked blonde hair three years ago! Cue the nostalgic trip down memory lane: - LA vacation 1hotels (slides 1 & 5) - Private beach escapade in Manuel Antonio, CR (slides 2 & 3) - Epic girls' night out in Philly Considering these fun times, I'm seriously contemplating bringing the blonde back! 😍 Which style is your vibe? #travelmemories #travelinspiration #travelmotivation #experiencetheextraordinary #litcotravels #travel #blondehair #blondemoments hellofatmata Photo by: jeisonchilatrao, Captions reads: Missing summer already 🫶🏻🔝 >> 1hotel.bklynbridge harrietsbk jeisonchilatrao Photo by: songday_log, Captions reads: pinterest 속에 들어온 것 같은 브루클린 숙소 🌿 songday_log Photo by: songday_log, Captions reads: pinterest 속에 들어온 것 같은 브루클린 숙소 🌿 songday_log"
