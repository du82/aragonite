wer View Details City View Connecting Junior Suite King with Balcony & Two Kings Ocean View One Bedroom Suite with Balcony Ocean View King Bed 3 People Separate Rain Shower View Details Ocean View One Bedroom Suite with Balcony Ocean Front One Bedroom Suite with Balcony Oceanfront King Bed 3 People Separate Rain Shower View Details Ocean Front One Bedroom Suite with Balcony Ocean Front Two Bedroom Suite with Balcony Oceanfront 2 King Beds 4 People Separate Rain Shower View Details Ocean Front Two Bedroom Suite with Balcony The Presidential Suite Oceanfront 2 King Beds 4 People Separate Rain Shower View Details The Presidential Suite Skyline View One Bedroom Home with Balcony Skyline View King Bed 3 People Separate Rain Shower View Details Skyline View One Bedroom Home with Balcony Ocean View One Bedroom Home with Balcony Partial Ocean View King Bed 3 People Separate Rain Shower View Details Ocean View One Bedroom Home with Balcony Ocean View Two Bedroom Home with Balcony Partial Ocean View 2 King Beds 4 People Separate Rain Shower View Details Ocean View Two Bedroom Home with Balcony Ocean View Two Bedroom Penthouse with Balcony Partial Ocean View 2 King Beds 4 People Separate Rain Shower View Details Ocean View Two Bedroom Penthouse with Balcony Ocean View Three Bedroom Home with Balcony Partial Ocean View 2 King & 1 Queen Beds 6 People Separate Rain Shower View Details Ocean View Three Bedroom Home with Balcony Ocean View Three Bedroom Penthouse with Balcony Partial Ocean View 1 King & 2 Queen Beds 6 People Separate Rain Shower View Details Ocean View Three Bedroom Penthouse with Balcony Sky Penthouse Ocean View & Skyline View 2 Full Beds 7 People Separate Rain Shower View Details Sky Penthouse Upcoming Events View all Wed 5 Mar South Beach Tala Beach, Watr, Drift & Pool International Women's Month Cocktails Month of March Wed 5 Mar South Beach Anatomy Dynamic Flow Yoga Mondays & Wednesdays Wed 5 Mar South Beach Daylife by Bike Daily Wed 5 Mar South Beach Watr Champagne and Oysters Wednesdays Thu 6 Mar South Beach Anatomy Metabolic Meltdown Thursdays Thu 6 Mar South Beach Tala Beach Paella & Playa Thursdays Thu 6 Mar South Beach Ocean Terrace Astro Talk: Pisces Season March 6 Thu 6 Mar South Beach Watr at 1 Rooftop Sky Sessions at Watr Thurs - Sat Fri 7 Mar South Beach Tala Beach Acqua de Luxe Beachwear Pop Up Friday - Sunday Fri 7 Mar South Beach Tala Beach Golden Hour at Tala Beach Fridays & Saturdays Taste Enjoy locally sourced, seasonal menus offering a delicious a la carte breakfast menu and buffet spread at Habitat, stunning views and Japanese-inspired cuisine at WATR on the Rooftop, beachside Spanish-inspired shared plates at Tala Beach, plant-based dishes at PLNTHOUSE, poolside dining at Sandbox, coffee and juices at Neighbors, and craft cocktails at our lobby bar, Drift. Explore Dining Do Swim, sun, and reset. Wander 600 feet of soft white sand, lounge all day on a waterside daybed, sip and savor on our rooftop, or recenter at Bamford Wellness Spa. Craving the city? Bike through the neighborhood, and go further into Miami to discover its global mix of cultures and communities. Do More Gather Our event spaces are designed to adapt nimbly to just about any gathering—intimate ceremony, work function, all-out celebration, and more—with turnkey planning and custom menus from our expert culinary team. View Our Spaces Offers & Experiences View all Sleep South Beach Wildfire Relief Up to 30% off your stay $10 donated to GlobalGiving for grant distribution to World Central Kitchen Sleep South Beach Home at 1 Daily Breakfast + Parking Valid for stays from June – October, 2025 Sleep South Beach The Retreat Collection Two to Four Bedroom Luxury Accommodations Sleep South Beach Stay Awhile at 1 $100 Resort Credit + Daily Breakfast + Parking Valid for stays from June – October, 2025 Sleep Taste South Beach Pay Later - Breakfast for Two Daily Breakfast Buffet for Two Sleep South Beach Give Green, Get Green Sleep South Beach Babymoon at 1 Room upgrade when available Adjustable Keep-Cool Pregnancy Pillow by Frida Mom Wave cabana Bamford Spa Treatment ENDS March 20 Sleep South Beach Winter Solstice Up to 30% off your stay $25 dining credit to Tala Beach 10% off at Bamford Wellness Spa Taste South Beach Tala Beach Experience Beach chair and umbrella Complimentary Valet Parking Dining credit to enjoy at Tala Beach Sleep South Beach Relax And Stroll Enjoy hassle-free travel with a Joolz Aer+ Stroller or Carrycot rental during your stay. Nature is Home in South Beach Geography Climate Flora Fauna Natural Attractions Sustainability Geography South Beach sits on a 10-mile-long barrier island between the beautiful Biscayne Bay and the vast Atlantic Ocean. Its position between two bodies of water makes it both a desirable destination and a vulnerable target of extreme weather events. Mostly flat, South Beach is a very vibrant and walkable oasis, covered in lush tropical vegetation as well as bustling city boulevards. Close Climate Miami is characterized by its tropical monsoon climate with hot, humid summers sprinkled with passing thunderstorms contrasted by short, warm, and drier winters. Temperatures typically vary between 62°F to 90°F, rarely dropping below 50°F or peaking above 92°F. With an average rainfall of just over 60 inches, this coastal city typically gets enough rain to get through the hotter months. Close Flora South Beach is home to diverse tropical flora — Beach Sunflowers, Blanket Flowers, Blazing Stars, Coral Honeysuckle, Passion Flower, Powderpuff Mimosa, Scarlet Sage, Hibiscus, Azalea, Saw Palmetto, Sabal Palm, and Southern Live Oak all sprinkle the landscape with bright bursts of colors and natural beauty. Close Fauna Florida is home to some of the most magnificently diverse fauna in the country. On land, you might see squirrels, foxes, deer, raccoons, rabbits, coyotes, and even black bears. Soaring through the air, you might catch sight of hawks, parakeets, orioles, pelicans, sparrows, cardinals, herons, and peafowl. Miami’s waters also sustain a wide range of species including barracuda, dolphins, manatees, tarpon, catfish, bass, nurse sharks, angelfish, stingrays, octopus, crabs, eel, and parrotfish — to name a few. We can’t forget the amphibious creatures that call this marshy wetland home, ranging from alligators, iguanas, and snakes of all kinds to gentle turtles, adaptive chameleons, and tiny geckos. Close Natural Attractions The Miami Beach Botanical Garden is 2.6 acres of urban green space in the heart of South Beach. Featuring Japanese gardens full of gorgeous native plants and wetlands full of winding mangroves, it’s the perfect place to get a closeup of Florida’s rich biodiversity. Roughly 40 minutes north of South Beach, you’ll find Oleta River State Park. With over 1,000 acres of natural refuge and tranquility, you’re free to hike or bike through forested trails or kayak through the river to get closer to nature — and maybe even catch a glimpse of a manatee. About an hour inland is the largest subtropical wilderness refuge in the country: Everglades National Park. It’s overflowing with freshwater prairies, mangrove forests, and hundreds of different species of native flora and fauna. Close Sustainability Immersed in nature wedged between two bodies of water, Miami holds sustainability and resilience close to its heart — prioritizing the protection of its beaches and waterways. The city has its own tree preservation program, innovative solar energy initiatives, stormwater management plans, and plastic-free incentives. The University of Miami has kicked off an inventive project to create a hybrid coral reef off the coast of Miami, creating human-made coral structures that will act as a safe haven for natural coral that’s more resilient to current climate conditions and extreme weather. Close Your Favorite Moments @1hotel.southbeach #1hotelsouthbeach https://www.instagram.com/1hotel.southbeach/ https://www.tiktok.com/@1hotels?lang=en https://www.facebook.com/1hotelsb/ Photo by: gabprincess, Captions reads: waiting on ya gabprincess Photo by: lollofranco, Captions reads: Welcome to Tala beach! tala.beach 1hotel.southbeach auragroupe 🙌🏻❤️ lollofranco Photo by: zupa.photography, Captions reads: Another beautiful sunny day! ☀️🌴🏝 zupa.photography No caption provided eceturkel Photo by: kathrinesorland, Captions reads: En dag til i kulda og så er jeg tilbake her! Juhuu🤍 Ha en fin dag alle😘 #miami kathrinesorland Photo by: evemmld, Captions reads: Melting with the background part 2 🙈🌊 evemmld Photo by: kiana_denae, Captions reads: 🐚 kiana_denae Photo by: malga_mago, Captions reads: Se fossi un hotel, sarei senz'altro il 1 Hotel South Beach. . . . . . . . . #1hotelsouthbeach #1hotel #miami #miamibeach #miamibeachlife #visitmiami #visitmiamibeach #beach #beachlife🌴 #beachlifestyle #beachresort #luxuryhotel #oceanview #oceanfront #turisanda1924 #alpitourworld malga_mago Photo by: alohabyamanda, Captions reads: ready for lounging outdoors in the warmth kinda weather alohabyamanda Photo by: kaylaaamorann, Captions reads: 5 days till miami today and I’m mentally here 💚 are you on spring break/have spring break soon? What are your plans for your week off if you do? kaylaaamorann Fully Electric Audi Adventures Through London’s Storied Streets Explore the iconic sights and hidden corners of London with a thoughtfully curated journey in our... Continue Reading Fully Electric Audi Adventures Through London’s Storied Streets Honoring Black History Through Nature & Craft Get to know some of the talented and dynamic BIPOC partners across our sanctuaries as they share... Continue Reading Honoring Black History Through Nature & Craft The Art of Seasonality: Chef Josh Bosen’s Inspired Approach to Melbourne Dining Discover how Chef Josh Bosen plans to redefine dining at 1 Hotel Melbourne, blending creativity... Continue Reading The Art of Seasonality: Chef Josh Bosen’s Inspired Approach to Melbourne Dining Rethink Your Drink: Lyre’s on the Craft of Alcohol-Free Indulgence Explore the world of non-alcoholic spirits, embrace mindful drinking, and enjoy a sustainable twist... Continue Reading Rethink Your Drink: Lyre’s on the Craft of Alcohol-Free Indulgence New Year, New Horizons: Chef Michael Solomonov’s Tips for Travel, Wellness, and Culinary Adventures in 2025 A Fresh Take on Balance, Flavor, and Exploration for the Year Ahead. Continue Reading New Year, New Horizons: Chef Michael Solomonov’s Tips for Travel, Wellness, and Culinary Adventures in 2025 Legend Our Location 1 Hotel South Beach 2341 Collins Avenue Miami Beach, FL 33139 Get Directions Located on Collins Avenue at the beach, this is your perfect basecamp for all your South Beach adventures. We recommend asking for a taxi with credit card machine before departing the airports. Property Map Find your way around our sustainable sanctuary. Desktop View Mobile View Show All Family Shopping Activities & Tours Arts & Culture Entertainment Nature Wellness Food & D"
