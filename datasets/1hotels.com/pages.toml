["https://1hotels.com/thefieldguide/rethink-your-drink-lyres-on-the-craft-of-alcohol-free-indulgence"]
title = "Rethink Your Drink: Lyre’s on the Craft of Alcohol-Free Indulgence - The Field Guide"
description = "Explore the world of non-alcoholic spirits, embrace mindful drinking, and enjoy a sustainable twist on your favorite beverages with the world's leading non-alcoholic spirits brand."
full_description = '''tagline Sustainability Rethink Your Drink: Lyre’s on the Craft of Alcohol-Free Indulgence Explore the world of non-alcoholic spirits, embrace mindful drinking, and enjoy a sustainable twist on your favorite beverages with the world's leading non-alcoholic spirits brand. Published on: January 14, 2025 Share:Click the link to copy to clipboardLink Copied to Clipboard As more people choose to drink less or embrace non-alcoholic options, the conversation around mindful drinking is flourishing, and Lyre’s Non-Alcoholic Spirit Co. is at the forefront of this cultural shift. Known for their unparalleled ability to recreate iconic flavors without alcohol, Lyre’s offers a no-compromise approach to cocktails, inspiring inclusivity and connection. With a portfolio of over 20 meticulously crafted spirits, Lyre’s blends tradition and innovation, offering bold, sophisticated flavors that perfectly complement our dining and lounge experiences. Their dedication extends beyond the glass, with thoughtful craftsmanship and sustainable practices aligning seamlessly with the ethos of 1 Hotels. "Mindful drinking isn't just about what’s in the glass—it’s about creating moments of connection and intention. Lyre’s allows us to elevate this experience, offering guests bold, sophisticated flavors that feel indulgent yet refreshing. The Pollinator, with its vibrant layers and sustainable ingredients, perfectly captures this ethos.” - Steven Minor, Director of Beverage. Join us as we explore their journey, discover their approach to sustainability, and sip on the Pollinator, a cocktail that’s as refreshing as it is inspiring. Crafting Connection with Lyre’s Non-Alcoholic Spirit Co. Lyre’s offers a wide range of non-alcoholic spirits that taste remarkably like the originals. What inspired the creation of Lyre’s, and how has the brand evolved since its inception? Lyre’s was created to change the way the world drinks by ensuring that anyone, anywhere, can enjoy a premium, non-alcoholic, sophisticated serve—without compromise. From its inception, the brand has aimed to offer an inclusive solution for both those who abstain from alcohol entirely and those who wish to moderate their consumption. Over time, we’ve discovered a key insight: consumers have a repertoire of cocktails they love, and they don’t want to settle for a generic mocktail. For example, a Negroni drinker wants something with the same bold complexity they know and love—not a fruity substitute. Lyre’s solves this by offering a no-compromise proposition, empowering people to enjoy ‘their drink, their way.’ Since our launch, Lyre’s has evolved into the most awarded non-alcoholic spirits company globally, offering a portfolio of over 20 products. We’re proud to be the Official Non-Alcoholic Beverage Partner of Dry January® USA for the third consecutive year, further reinforcing our commitment to mindful drinking. Dry January has become a popular movement worldwide. How has Lyre’s seen this trend influence the way people approach mindful drinking? Dry January has become a cultural phenomenon and the largest dry month on the calendar, surpassing Sober October and Dry July. This year, an estimated 34% of adults in North America (21+) are expected to participate, marking a steady increase from previous years. At Lyre’s, we’ve observed that many participants take a moderation journey after completing a dry month. Rather than abstaining entirely, they begin to reduce the ABV levels in their drinks or swap out full-strength cocktails for non-alcoholic alternatives like Lyre’s. We call these individuals “modern moderators”—vibrant, health-conscious individuals who value connection and sociability while still being mindful of their well-being. Dry January has not only driven demand for non-alcoholic options but has also solidified mindful drinking as a lifestyle choice that extends well beyond the month itself. Your non-alcoholic spirits are known for their complexity and depth. Can you share insights into the craftsmanship behind recreating iconic flavors without alcohol? Crafting Lyre’s non-alcoholic spirits is both an art and a science. Each product begins with an in-depth analysis of the distinct aromas, tastes, and visual cues found in classic spirits. We then source the finest natural essences, extracts, and distillates from around the globe to recreate these profiles with precision. Our proprietary non-alcoholic base liquid serves as the foundation for these intricate blends, resulting in products that are remarkably true to the original styles. Rather than referencing a single brand, we pay homage to the best characteristics across each spirit category, ensuring that every Lyre’s product offers a balanced and authentic experience. Currently, Lyre’s products are crafted across North America, Australia, and the UK, ensuring consistency and quality in every market we serve. Sustainability is at the heart of 1 Hotels. How does Lyre’s integrate sustainable practices into its production, and how does this align with our shared values? Sustainability is at the core of Lyre’s operations, and we’re committed to preserving the planet for future generations. Key initiatives include: Localized Production: We’ve transitioned from a single international production site to manufacturing in every major market, reducing the environmental impact of transportation. Sustainable Sourcing: We prioritize sustainable practices in ingredient sourcing and packaging. Every element of Lyre’s packaging is recyclable, from the lightweight bottles to the labels. Sustainability Lens: All brand programming and initiatives are evaluated through a sustainability lens, ensuring we align with best practices for environmental stewardship. Our dedication to sustainable practices complements the ethos of 1 Hotels, and together, we aim to inspire consumers to make mindful, planet-friendly choices in every aspect of their lives. We’d love to share a sneak peek! Can you provide one of the recipes that will be featured at our properties during Dry January, and tell us what makes it a perfect choice for mindful celebration? The Pollinator 2 oz. Lyre’s Pink London Spirit 3/4 oz. lemon juice, freshly squeezed 1/2 oz. Honey syrup 1 Teaspoon powdered Bee Pollen 2 oz. Lyre’s Classico Sparkling Garnish: lemon twist & edible flower Directions: Add the Pink London Spirit, lemon juice, honey syrup, and bee pollen to a shaker with ice and shake very briefly. Strain into a chilled cocktail coupe and top with Lyre’s Classico Sparkling Garnish with a lemon twist, by expressing the essential oils and top w/ edible flower Master the Mocktail Throughout January, our properties are hosting Mindful Mixology classes in partnership with Lyre’s. These intimate sessions are designed to inspire creativity and connection, allowing guests to craft their own bold, alcohol-free cocktails using Lyre’s award-winning spirits. Whether you're a cocktail connoisseur or new to the zero-proof trend, these classes are your invitation to sip, savor, and celebrate the art of mindful living. Find your nearest 1 Hotels property to join the experience and explore Lyre’s on a deeper level. More Stories We'd Think You'd Enjoy View all stories Fully Electric Audi Adventures Through London’s Storied Streets Explore the iconic sights and hidden corners of London with a thoughtfully curated journey in our... Continue Reading Honoring Black History Through Nature & Craft Get to know some of the talented and dynamic BIPOC partners across our sanctuaries as they share... Continue Reading Our People Sustainability The Art of Seasonality: Chef Josh Bosen’s Inspired Approach to Melbourne Dining Discover how Chef Josh Bosen plans to redefine dining at 1 Hotel Melbourne, blending creativity... Continue Reading'''
