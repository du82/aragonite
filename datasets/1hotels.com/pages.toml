full_description = '''Midday Mindfulness Monday-Thursday | 11am-3pm | Bamford Wellness Spa BOOK NOW Looking for a reason to indulge in some weekday wellness? Join us for a mid-day refresh at Bamford Wellness Spa every Monday through Thursday. Just mention "midday" when booking your treatment and enjoy $25 off any 50 or 80-minute service. Share This Event: Midday Mindfulness Monday-Thursday | 11am-3pm | Bamford Wellness Spa BOOK NOW Looking for a reason to indulge in some weekday wellness? Join us for a mid-day refresh at Bamford Wellness Spa every Monday through Thursday. Just mention "midday" when booking your treatment and enjoy $25 off any 50 or 80-minute service. Share This Event: Your Favorite Moments close x Your Favorite Moments @1hotel.bklynbridge https://www.instagram.com/1hotel.bklynbridge/ https://www.facebook.com/1HotelBrooklynBridge/ Photo by: jatecheshul, Captions reads: Spicy crew right here 🌶️ jatecheshul Photo by: jatecheshul, Captions reads: Spicy crew right here 🌶️ jatecheshul Photo by: jatecheshul, Captions reads: Spicy crew right here 🌶️ jatecheshul Photo by: josemelgarejo.us, Captions reads: 📸🎥🎞️ Shooting CINEMATIC ENGAGEMENTS is part planning and part flow. 👇 🫶🏽A ton of work to bring a great concept to life and to get all three of us — myself the photographer my couple emotionally on board with what we’re about to create. 🌉Here’s a few snapshots of the engagement session we brought to life at the 1hotel.bklynbridge in the heart of DUMBO BROOKLYN. I may share more from this shoot, but here’s a preview with some shots I’m truly proud of. 🤓I used an adapted camera with a special lens to get some of these effects as well as my own presets based on vintage film stock. Incredibly empowering to see a concept and vision come together. 🌅📸 🛑Choose your adventure - the next post should be : josemelgarejo.us Photo by: quintessentially, Captions reads: Seven family-friendly stays in the city that never sleeps ⬇️ 🛎️ Park Hyatt New York, Midtown 🛎️ The Plaza Hotel, Fifth Avenue 🛎️ The Whitby Hotel, Midtown 🛎️ The Ritz-Carlton New York, NoMad 🛎️ 1 Hotel Brooklyn Bridge, Brooklyn 🛎️ The Peninsula New York, Midtown 🛎️ Four Seasons Hotel New York Downtown, Downtown Tap the link in bio to find out more. 📸 1hotel.bklynbridge | theplazahotel | firmdale_hotels | ritzcarltonnewyorknomad #newyork #nyc #usa #familyfriendly #familytravel #hotels #besthotels #luxury #lifestyle #lifestyleconcierge #concierge #membership #noted #quintessentially #quintessentiallytravel quintessentially Photo by: saritafv, Captions reads: RECOMENDACIÓN DE VIERNES: harrietsbk Ya lo había enseñado alguna vez, pero, desde luego, este rooftop es una pasada. Está situado en el 1hotel.bklynbridge (sería un sueño poder pasar una noche en una habitación con esas vistas 😍) justo al lado de la piscina. No es un rooftop de los más baratos en cuanto a precio de bebida / comidas pero si queréis pasar una tarde/noche especial, merece la pena. Ya sabéis, guardad el post y si vais, ¡quiero verlo! 📍harrietsbk at 1hotel.bklynbridge Day 25 #100dayprojectALLinNYC #ny #brooklyn #brooklynbridge #newyork #ig_nycity saritafv Photo by: hellofatmata, Captions reads: Day 27 of 30: Embracing my blonde moments!😍✨ In this countdown, I've embraced spontaneity, going with the flow and sharing memories from my travels. Today, I was reminded that I rocked blonde hair three years ago! Cue the nostalgic trip down memory lane: - LA vacation 1hotels (slides 1 & 5) - Private beach escapade in Manuel Antonio, CR (slides 2 & 3) - Epic girls' night out in Philly Considering these fun times, I'm seriously contemplating bringing the blonde back! 😍 Which style is your vibe? #travelmemories #travelinspiration #travelmotivation #experiencetheextraordinary #litcotravels #travel #blondehair #blondemoments hellofatmata Photo by: jeisonchilatrao, Captions reads: Missing summer already 🫶🏻🔝 >> 1hotel.bklynbridge harrietsbk jeisonchilatrao Photo by: songday_log, Captions reads: pinterest 속에 들어온 것 같은 브루클린