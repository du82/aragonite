["https://1hotels.com/brooklyn-bridge/do/events/wellness-wednesdays-with-plentea-matcha"]
title = "Wellness Wednesdays with Plentea Matcha - 1 Hotel Brooklyn Bridge"
description = "Join us for Wellness Wednesday for complimentary cup of matcha in the lobby. Founder Jessica Cardenas started Plentea Matcha with the intention to expand upon her decade of learnings working with UNICEF and her background in Nutritional Sciences from Cornell. Plentea aims to honor traditional Japanese practices of nourishment through matcha - while contributing to the development of sustainable programs in underserved communities. Since inception, Plentea Matcha has supported the Lower Eastside Girls Club; specifically through nourishment programs, including a rooftop garden where girls ages 8-18 are empowered to plant their own seeds and provided the knowledge and tools to prepare nourishing meals that support their own gut and mental health. Enjoy 20% off on plenteamatcha.com with code: 1Hotels20"
