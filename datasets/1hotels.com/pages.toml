description = "Wellness is part of what makes us 1—and we support whatever it means to get you there—serene balance or adrenaline rush, clean greens or nourishing smoothie."
full_description = "Wellness We believe that wellness starts within—taking the time to tune inward to assess your needs, nourish every facet of your mind, body, and soul, and honor your inherent desire to be at 1 with nature. Wellness is part of what makes us 1, and we support whatever it means to get you there. From serene meditations to adrenaline-filled excursions, clean garden greens to farm-fresh protein, outdoor pursuits to deep scuba dives, we invite you to let go of expectations, reconnect with yourself and nature, and let wellness wash over you. BAMFORD WELLNESS SPA Bamford Wellness Spa sees well-being through a holistic lens, lending individualized treatments centered around a heartfelt connection with nature. Every product and offering is intentionally crafted to nourish your mind, body, and spirit using natural and organic ingredients certified to the highest standard. Through the intuitive hands of our therapists, carry the calming essence of each treatment long after you depart. MIND & MOVEMENT Designed to support your individual goals. From restoring yoga to high-intensity full body workouts, our group fitness classes create a community where guests can sweat, enhance and recover in a positive, welcoming environment. Anatomy The Anatomy approach nurtures a life-enriching community where everyone can sweat, enhance, and recover in a positive, welcoming environment. With proprietary programming rooted in sports performance and the science of strength conditioning, our Anatomy experts have created a health and wellness sanctuary where you can challenge yourself with state-of-the-art weight training and cardio equipment, a diverse range of signature group fitness classes, and personalized training sessions. The Field House Take charge of your day at The Field House, our dynamic gym equipped with state-of-the-art weight training and cardio equipment. Take the time to recharge your mind and body in a way that speaks to you—whether it’s a freestyle workout, a one-on-one training session, or a group class led by our expert coaches, including HIIT, boxing, yoga flow, and more. HigherDose HigherDOSE is a holistic biohacking brand that creates wellness and recovery tools designed to ignite vitality from the inside out. Elevate your wellness experience with cutting-edge devices such as infrared PEMF mats and red light face masks. Add these incredible tools to your spa session or order them to your room at any time to help your body recover and release a healthy DOSE of feel-good chemicals throughout your day. Healthy Dining We’re adding new meaning to the saying “food for thought,” with fresh, local, and sustainable farm-to-table cuisine that nourishes your mind and body. With ingredients sourced straight from our on-site organic gardens and apiaries, neighboring farmers, and local fishers, every bite nurtures wellness from within—without sacrificing the prosperity of the planet. From house-made syrups infused with citrus peels to nutrient-rich meals sourced within a 50-mile radius, our seven restaurants and bars feature dynamic menus that support a lifestyle rooted in health and well-being. Explore Within Wellbeing at 1 Hotel Hanalei Bay Embrace the true meaning of “wellness from within” through Within Wellbeing on the sparkling shores of Hanalei Bay. These four-to-ten-day retreats are meticulously curated to help you surpass your goals and embrace transformational wellness from every angle. Whether you’re seeking self-exploration, peak physical fitness, spiritual restoration, or a revitalized approach to nutrition, we’ll craft a Within Journey that speaks directly to your needs. tagline 1 Hotel Hanalei Bay Within Wellbeing From personalized nourishment plans to thermoregulated beds, every single detail is perfected to achieve optimal balance in the body and mind, revealing tangible results such as better sleep, healthier immunity, increased mental clarity, weight loss, improved physical endurance, decreased tension, and even lowered cholesterol (LDL) levels. Take the time to truly look Within, nurturing your well-being and solidifying healthy habits that persist long after you depart. Wellness Offers Whether it’s a private session with a renowned trainer at one of our state-of-the-art fitness centers or a transcendent and restorative treatment at Bamford Wellness Spa, our holistic wellness offerings aim to nourish every aspect of your mind, body, and soul. Explore Fully Electric Audi Adventures Through London’s Storied Streets Explore the iconic sights and hidden corners of London with a thoughtfully curated journey in our... Continue Reading Fully Electric Audi Adventures Through London’s Storied Streets Honoring Black History Through Nature & Craft Get to know some of the talented and dynamic BIPOC partners across our sanctuaries as they share... Continue Reading Honoring Black History Through Nature & Craft The Art of Seasonality: Chef Josh Bosen’s Inspired Approach to Melbourne Dining Discover how Chef Josh Bosen plans to redefine dining at 1 Hotel Melbourne, blending creativity... Continue Reading The Art of Seasonality: Chef Josh Bosen’s Inspired Approach to Melbourne Dining Rethink Your Drink: Lyre’s on the Craft of Alcohol-Free Indulgence Explore the world of non-alcoholic spirits, embrace mindful drinking, and enjoy a sustainable twist... Continue Reading Rethink Your Drink: Lyre’s on the Craft of Alcohol-Free Indulgence New Year, New Horizons: Chef Michael Solomonov’s Tips for Travel, Wellness, and Culinary Adventures in 2025 A Fresh Take on Balance, Flavor, and Exploration for the Year Ahead. Continue Reading New Year, New Horizons: Chef Michael Solomonov’s Tips for Travel, Wellness, and Culinary Adventures in 2025"
