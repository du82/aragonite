["https://1hotels.com/brooklyn-bridge/gather/weddings"]
title = "Wedding Venues & Planning - 1 Hotel Brooklyn Bridge"
description = "1 Hotel Brooklyn Bridge has the perfect wedding venue and wedding services to start a life with the one you love. Celebrate with us, and watch love grow."
full_description = "Intimate Weddings at 1 Hotel Brooklyn Bridge Weddings mark new beginnings. 1 Hotel Brooklyn Bridge offers the perfect intimate setting to celebrate the start of a life with the one you love. Celebrate with us, and watch love grow. Request Information tagline 1,900 sq. ft. | Up to 150 Guests Blue Wood Aster This 1,900 square foot versatile 1 – 3 room space features floor-to-ceiling windows that open onto the East River waterfront, seamlessly inviting nature into the space. Blue Wood Aster accommodates up to 150 guests. An adjoining social space, Quarry, features a comfortable lounge setting with a built-in bar and private balcony overlooking the park. The city skyline offers the perfect backdrop for cocktails. tagline 5,545 sq. ft. | Up to 300 Guests Meadow Rue Gather by the park. Our 5,545 square-foot Meadow Rue has space to accommodate 300 guests for a plated event. This space can also function as one large room or can be divided into two, for a separate ceremony, cocktail reception or wedding reception. Entry at park level, by Brooklyn Bridge Park. Harriet's Lounge Host your afterparty at Harriet's Lounge, a 2,800 square foot space on the 10th floor boasting expansive views of the Manhattan skyline and Brooklyn Bridge. The Osprey Bright, airy, and boasting floor-to-ceiling windows alongside Brooklyn Bridge Park, The Osprey is the place to host brunch after your special day. Wedding Packages Sprouting Love Cocktail reception, three-course plated dinner, as well as beverage arrangements and a wedding cake. This package also a one-night accommodation for the couple with Brooklyn Bridge or Manhattan skyline views. Blooming Love Cocktail reception with passed canapés and food display stations, three-course plated dinner, as well as beverage arrangements and a wedding cake. This package also a one-night accommodation for the couple with Brooklyn Bridge or Manhattan skyline views. Blossom Love Cocktail reception with passed canapés and food display stations including a raw bar, a three-course plated dinner, as well as beverage arrangements and a wedding cake. Followed by late night snacks. This package also a one-night suite accommodation for the couple with Brooklyn Bridge or Manhattan skyline views. Brooklyn Bridge Services Ingredients First. Then Add Love Our catering menus are designed for the season with local and fresh ingredients to perfectly complement your celebration. Select from a variety of menu options for your cocktail reception, dinner and farewell breakfast. We're raising the bar for creative catering. Elevated Extras We offer special packages and experiences to create a truly memorable wedding weekend. Treat your bridal party to a private yoga session, add a special blessing ceremony for you and your soon-to-be husband or wife, gather your family for a relaxing spa day or say goodbye to your guests with a farewell breakfast. Contact our team to learn more. Honeymoons Make your honeymoon memorable with our luxurious setting and picture-perfect location. Take time to relax and indulge with a treatment at Bamford Spa or get out and explore Brooklyn and New York City together. Planning How can we help you create your dream wedding? Submit a request for a proposal, and share with us the details and budget, as well as your vision. We will respond promptly with answers and options. REQUEST INFORMATION Sustainability Sustainable Design 1 Hotel Brooklyn Bridge's design balances refined elements with a comfortably curated atmosphere, inspired by the creativity and craftsmanship of local artists, builders, chefs, and the surrounding community. All design choices and materials are used purposefully and thoughtfully with an emphasis on using existing structural and reclaimed materials sourced throughout New York. Local Love Our culinary team takes pride in their relationships with the local farmers, purveyors who supply their kitchens with high-quality, sustainably-made products. Farmers across the trip-state area provide us with quality, fresh produce so our guests can savor the seasons while the hotel works to preserve the environment by purchasing locally. Journey to Zero-Waste 1 Hotel Brooklyn Bridge is dedicated to the quest for zero-waste. From locally-sourced, minimally-processed meats and sustainable cocktail programs to upcycling food scraps — we’re continuously reducing our carbon footprint and waste. The property has partnered with Foodprint Group to develop and implement a True Zero Waste program designed to eliminate waste and reduce carbon emissions."
year_published = 2025
