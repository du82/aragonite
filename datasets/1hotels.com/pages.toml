["https://1hotels.com/cookie-policy"]
title = "Our Cookie Policy - 1 Hotel"
description = "This Statement describes the different types of cookies that may be used in connection with 1 Hotels Sites and describes how you can manage cookies."
full_description = '''Cookie Policy SH Group's Statement on the Use of Cookies and Similar Technologies This Statement on the Use of Cookies and Similar Technologies (“Statement”) applies to all websites (each a “Site”) of the hotel brands owned and licensed by SH Group Operations, L.L.C. and its affiliates (“SH Group,” “us,” “we,” “our”), including 1 Hotels & Homes, Baccarat Hotels & Resorts, Treehouse Hotels, and SH Collection (collectively, “SH Group,” “us,” “we,” and “our”). This Statement describes the practices that SH Group follows when collecting information through the use of cookies and similar technologies on our Sites. Please be advised that, to the extent you access any of our Sites from the European Economic Area, any personal information we collect from cookies will be transferred to the United States. Please see our Privacy Policy for more information. We may change this Statement at any time. Please take a look at the "LAST UPDATED" section at the bottom of this page to see when this Statement was last revised. Any changes in this Statement will become effective when we make the revised Statement available on or this Site. If you have comments or questions about this Statement, please contact us at [email protected]. WHAT IS A COOKIE? We use cookies, web beacons, and other tracking technologies when you visit the Site. A cookie is a text file that contains small amounts of data downloaded to your device when you visit a web site. A cookie is sent back to the web site on each subsequent visit or to another web site that recognizes that cookie. Cookies enable a website to recognize your computer, mobile, or other device. As with most other websites, we place cookies on your device to understand more about your visit and help us enhance your experience. You can find more information about cookies at: www.allaboutcookies.org. Web beacons are small graphics on a webpage that monitor your activity when viewing a webpage. COOKIES ON THIS SITE We will use Cookies to: • Remember your user name and password for future visits so that log-in is easier and faster; • Remember your language and other preferences; • Ensure you obtain all requested information; • Provide a safe and secure service for online transactions; • Measure how many people use the Site, and how they use it, so that we can make improvements and keep it running quickly and efficiently; and • Help us and others deliver communications and content to you that are relevant and responsive to your interests and location. There are four different categories of cookies used on our Sites: (1) cookies that are strictly necessary; (2) cookies that record functionality requests; (3) cookies that assist with the performance of our Sites; and (4) advertising cookies. Each purpose is outlined below. STRICTLY NECESSARY COOKIES These cookies are necessary for the Site to function and cannot be switched off in our systems. They are usually only set in response to actions made by you which amount to a request for services, such as setting your privacy preferences, logging in or filling in forms. You can set your browser to block or alert you about these cookies, but some parts of the Site will not then work. These cookies do not store any personally identifiable information. PERFORMANCE COOKIES These cookies gather information about how you use this Site in order to ensure efficient operation of the Site’s functions. For example, they may collect information regarding whether you encountered problems or errors from one of the pages or which pages you visit most often. These cookies do not directly collect information that personally identifies you. When you provide information that identifies yourself, we may use these cookies to provide relevant information on the Site based on your activities and information that you have provided on the Site. TARGETING COOKIES These cookies allow us to count visits and traffic sources so we can measure and improve the performance of our Site. They help us to know which pages are the most and least popular and see how visitors move around the Site. All information these cookies collect is aggregated and therefore anonymous. If you do not allow these cookies we will not know when you have visited our Site, and will not be able to monitor its performance. HOW LONG DO COOKIES LAST, AND HOW DO I MANAGE COOKIES? A cookie can either be a “session” cookie or a “persistent” cookie. Session cookies exist only for so long as you are visiting the applicable website and are typically deleted within thirty (30) minutes or removed when you exit your web browser, whichever is longer. Persistent cookies exist for a set period of time, for example, up to two (2) years. Each time you visit a website that has implemented a persistent cookie, the persistent cookie is renewed and that cookie will remain active until its predetermined expiration date. You can restrict or block cookies that are set by the Site (or any other site on the Internet) by adjusting your browser settings. When you visit our Site, you are notified of the use of cookies and asked to provide your consent for cookies. You can change your consent preferences regarding the use of cookies by accessing your Privacy Preference Center here:Cookie Settings You may visit www.allaboutcookies.org to obtain more information regarding cookies, how to adjust the cookie settings on various browsers, and how to delete cookies from your computer. Find out how to manage cookies on popular browsers below: Google Chrome: Google Chrome Support Microsoft Edge: Microsoft Edge Support Mozilla Firefox: Firefox Support Microsoft Internet Explorer: Internet Explorer Support Please be aware that restricting certain cookies may restrict the functionality or features of the Site. You may not be able to decline or refuse Strictly Necessary Cookies, which are required to make the Site work properly. Last Updated: April 15, 2022 ©2022 SH Group Operations, L.L.C. All Rights Reserved. Cookie Settings'''
year_published = 2025
clearnet = "https://1hotels.com/cookie-policy"
