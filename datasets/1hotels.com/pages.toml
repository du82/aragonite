title = "1 Hotel West Hollywood: Sustainable Luxury Hotel"
description = "Located on Sunset Strip with sweeping views of LA, 1 Hotels is a five-star West Hollywood hotel offering a sustainable, pet-friendly luxury stay."
full_description = "1 Hotel West Hollywood West Hollywood, CA 8490 Sunset Boulevard Get Directions Nestled at the base of the Hollywood Hills with sweeping views from downtown L.A. to Santa Monica, inspired by the sparkling surf, sea, and sun of Southern California, 1 Hotel West Hollywood casts nature in every role. Skyline & Hills Views LEED Silver Designed By Nature Bamford Wellness Spa Sustainable Cuisine Rooftop Bar Pool Sustainable Gatherings Goodthings Shop Pet Friendly Electric Audi House Car Gym & Classes Facegym Supporting Our Community: Wildfire Evacuee Offer We're here for those impacted by the wildfires, welcoming you with reduced rates, waived amenity fees, and complimentary late 1pm check out. And because pets are family too, we welcome our four-legged guests with no pet fee as always. Click below to book, or for extended stays of 7+ nights, please email us at [email protected]. Reserve Now At 1 With Nature A sustainable sanctuary inspired by the sparkling surf, sea, and sun of Southern California. Our local partners at Angel City Lumber helped us recover 75 tons of wood from fallen trees in California to create the design elements that keep your surroundings beautiful, and keep trees out of the waste stream. Good Energy Means Clean Energy One of LA’s most energy-efficient hotels,1 Hotel West Hollywood is LEEDv4 for Existing Buildings Silver Certified, with an Energy Star score of 95. WANDERING RESPECTFULLY Explore the city emission-free in our fully electric Audi Q8 e-tron house car, power your own at one of our charging stations, or stroll West Hollywood—among California’s most walkable cities. Explore DRINKING SUSTAINABLY Each room is equipped with recycled wine-into-water bottles. No thank you, single-use plastics. Explore Peace of Mind We provide locally sourced, sustainable bed linens and non-toxic, organic mattresses, so you and the earth can sleep soundly. View Rooms 1 Less Thing Overpacked? Simply leave a piece of clothing (or two) under this block to get your pre-loved threads into the hands of those in need through our local charity partner, Los Angeles Mission. WELLNESS At 1 Hotel West Hollywood, our experiences are designed to nurture the mind, body, and spirit, including holistic treatments at Bamford Wellness Spa, sessions at Facegym designed specifically to lift and tone the facial muscles, energizing Mind & Movement programming, plus expert personal training at The Field House. STAY WELL Bamford Wellness Spa Bamford Wellness Spa is a spa devoted to nurturing the mind, body and spirit. Our holistic approach is based around a heartfelt connection with nature. In the intuitive hands of our therapists, the effect of each treatment will be felt long after you depart. HAVE A SPA DAY FUR-FAMILY FRIENDLY We would never ask you to leave your furry (or not furry) friend behind! As a pet-friendly hotel, your pup is always welcome at 1 Hotel West Hollywood. PET FRIENDLY Rooms & Suites View All King City View King Bed 2 People Rain Shower Only View Details King City King City View King Bed 3 People Shower or Shower/Tub combo View Details City King City Two Double City View 2 Double Beds 4 People Shower/Tub Combo View Details City Two Double Skyline King Skyline View King Bed 3 People Shower or Shower/Tub combo View Details Skyline King Skyline Two Double Skyline View 2 Double Beds 4 People Shower/Tub Combo View Details Skyline Two Double Studio Suite City View King Bed 3 People Rain Shower Only View Details Studio Suite Skyline Studio Suite Skyline View King Bed 3 People Rain Shower Only View Details Skyline Studio Suite Loft Suite City View King Bed 3 People Separate Rain Shower View Details Loft Suite One Bedroom Suite Skyline View King Bed 3 People Separate Rain Shower View Details One Bedroom Suite Panoramic One Bedroom Suite Panoramic Views King Bed 3 People Separate Rain Shower View Details Panoramic One Bedroom Suite Hills House Suite Panoramic Views King Bed 3 People Kitchenette View Details Hills House Suite Canyon House Suite Panoramic Views King Bed 3 People Kitchenette View Details Canyon House Suite Connecting City King & Two Double City View 1 King & 2 Double Beds 7 People Rain Shower Only View Details Connecting City King & Two Double Connecting King & Skyline Two Double Skyline View 1 King & 2 Double Beds 7 People Rain Shower Only View Details Connecting King & Skyline Two Double Connecting Skyline King & Two Double Skyline View 1 King & 2 Double Beds 7 People Rain Shower Only View Details Connecting Skyline King & Two Double Connecting Studio & Loft Suites City View 2 King Beds 6 People Rain Shower Only View Details Connecting Studio & Loft Suites Two Bedroom Suite Skyline View 1 King & 2 Double Beds 7 People Separate Rain Shower View Details Two Bedroom Suite Panoramic Two Bedroom Suite Panoramic Views 1 King & 2 Double Beds 7 People Separate Rain Shower View Details Panoramic Two Bedroom Suite Neighboring Two Bedroom Suite & Skyline King Skyline View 2 King & 2 Double Beds 10 People Separate Rain Shower View Details Neighboring Two Bedroom Suite & Skyline King Upcoming Events View all Wed 5 Mar West Hollywood Bamford Wellness Spa Bamford Treatment Highlight: B Silent All Month Long Wed 5 Mar West Hollywood 1 Kitchen West Hollywood Daily Wine Down at 1 Kitchen Daily in 1 Kitchen Thu 6 Mar West Hollywood Melrose Alo Moves x Yoga Flow with Tawny Janae March 6 Fri 7 Mar West Hollywood Juniper Lounge Juniper Live DJ Sessions Every Friday and Saturday Sat 8 Mar West Hollywood Skyline Deck Alo Moves Run Club x Louis Chandler & Stef Armstead March 8 Sat 8 Mar West Hollywood Melrose International Women's Day Alo Moves x Mat Pilates with Laura Quinn March 8 Sun 9 Mar West Hollywood Melrose International Women's Day Weekend x Alo Moves x Yoga Flow with Ashley Galvin March 9 Mon 10 Mar West Hollywood Juniper Lounge Irish Whiskey Flight Voyage March 10 - 17 Sat 15 Mar West Hollywood Sunset Foyer South Alo Moves x Mat Pilates with Laura Quinn March 15 Wed 19 Mar West Hollywood Melrose Alo Moves x Yoga Flow with Tawny Janae March 19 Taste Experience Southern California’s bounty at our three restaurants and bars. Savor farm-to-table fare at our signature restaurant, 1 Kitchen, enjoy live music and craft cocktails biodynamic wines at our lobby bar and lounge, Juniper, or join us at Harriet’s, our rooftop bar with skyline views of Los Angeles. Explore Do Take in the skyline from our rooftop pool and lounge, immerse yourself in holistic healing at Bamford Wellness Spa, get in your workout at The Field House, come together for drinks with friends at Juniper or Harriet’s, and discover West Hollywood, among California’s most walkable cities. Explore Gather Our 14,000 square feet of event space is designed to adapt nimbly to just about any gathering—intimate ceremony, work, all-out celebration, and more—with turnkey planning and curated seasonal menus by Executive Chef Ginger Pierce. Learn More Offers & Experiences View all Sleep West Hollywood Heart of West Hollywood Up to 30% off best rates $25 food and beverage Credit and $25 spa credit* Flexible cancellation Sleep West Hollywood Free to Park, Free to Explore Complimentary parking for one vehicle $25 hotel credit Late check-out (2pm) Flexible cancellation Sleep West Hollywood Supporting Our Community: Evacuee Offer Up to 50% off your stay Complimentary late check out at 1pm Waived amenity fee Sleep West Hollywood Sleep Suite Up to 30% off best rates $200 Food & Beverage Credit Flexible cancellation ENDS March 19 Sleep West Hollywood Winter Solstice Up to 30% off your stay $30 food and beverage credit 10% off Bamford Wellness Spa Treatments Flexible cancellation Sleep West Hollywood Wake up with 1 Up to 30% off best rates Daily $60 breakfast credit Flexible cancellation Sleep West Hollywood Relax at Bamford Wellness Spa Save up to 30% off $100 Credit to Bamford Spa Complimentary Red Light Therapy Service Welcome Dose Wellness Shot Sleep West Hollywood Give Green, Get Green $30 hotel credit Flexible cancellation Sleep West Hollywood Home at 1 Up to 30% off best rates $100 Food & Beverage Credit Daily $60 breakfast credit Flexible cancellation Sleep West Hollywood Weho Wellness Suite Retreat Up to 35% off best rates $60 Daily Breakfast Credit $100 The Field House Personal Training Credit Do West Hollywood HigherDOSE Concierge Service We've partnered with HigherDose to offer premium in-room wellness offerings, including their Sauna Blanket and PEMF Mat. Nature is Home in West Hollywood Geography Climate Flora Fauna Natural Attractions Sustainability Geography Nestled at the base of the Hollywood Hills, West Hollywood boasts panoramic views of the Santa Monica Mountains in the north and sights of its neighboring city skylines in all other directions, including Hollywood, Beverly Hills, and the Fairfax District. Known for its dense, compact neighborhoods, West Hollywood is one of the most walkable cities in California. Close Climate Most days, you can expect warm, dry weather in West Hollywood. Temperatures average around 64°F and vary from a low of 48°F to a high of 82°F (rarely dipping below 42°F or climbing over 90°F). In the warmer months, enjoy abundant sunshine, and in the colder months, seek comfort in the sweeping clouds. All year long, take on outdoor adventures with ease and excitement. Close Flora As you walk through West Hollywood, feel grounded in nature with sights of swaying palm trees, bright green succulents, and vibrant flowers. It may be a concrete jungle, but its balmy climate breeds beautiful flora such as Mexican Fan Palm Trees, Orange Trees, Jasmine blossoms, Prickly Pear Cactuses, Evergreens, Purple Orchid Trees, Mimosa Trees, and so much more. Close Fauna At the foothills of the mountains, West Hollywood is home to species ranging from coyotes, bobcats, and bears to red-crowned parrots, peacocks, and red-tailed hawks. Out in the waters of the Pacific, keep an eye out for dolphins, seals, sea otters, sea turtles, vibrant fish, and beyond. Close Natural Attractions West Hollywood offers some of the best hiking in Los Angeles. Adventure through Griffith Park, one of North America’s largest urban parks. With miles of hiking trails, camping sights, and golf courses, it’s a natural attraction everyone in the family can enjoy. Its two-mile hike leads to the world-famous Griffith Observatory, featuring spectacular sweeping views of the city, incredible telescopes, and planetarium explorations. Nearby, hike through Runyon Canyon Park with various loops that lead to peaks that showcase panoramic views of the Hollywood Hills juxtaposed with the surrounding cityscape. Close Sustainability Situated in an area where the effects of climate change (such as droughts, wildfires, earthquakes, and beyond) are unfortunately apparent, West Hollywood is continuously recognized for its commitment to sustainability. It has received national, state, and local awards for its eagerness to shift to renewable energy, reduce greenhouse gas emissions, and participate in innovative programs. From organic waste collection to mandatory green building ordinances, West Hollywood remains a leader in sustainable policies and practices. Close Your Favorite Moments @1hotel.weho #1hotelweho https://www.instagram.com/1hotel.weho/ https://www.tiktok.com/@1hotels?lang=en https://www.facebook.com/1HotelWestHollywood/ Photo by: daniellllescott, Captions reads: chapter 25!!! 💛✨🦋🥂 daniellllescott Photo by: hellofatmata, Captions reads: Day 27 of 30: Embracing my blonde moments!😍✨ In this countdown, I've embraced spontaneity, going with the flow and sharing memories from my travels. Today, I was reminded that I rocked blonde hair three years ago! Cue the nostalgic trip down memory lane: - LA vacation 1hotels (slides 1 & 5) - Private beach escapade in Manuel Antonio, CR (slides 2 & 3) - Epic girls' night out in Philly Considering these fun times, I'm seriously contemplating bringing the blonde back! 😍 Which style is your vibe? #travelmemories #travelinspiration #travelmotivation #experiencetheextraordinary #litcotravels #travel #blondehair #blondemoments hellofatmata Photo by: kinooparis, Captions reads: 1 Hotel West Hollywood 🌤️ 1hotels 1hotel.weho #losangeles #california #usa #hotels #interiordesign #pool #poolday #travel kinooparis Photo by: kinooparis, Captions reads: 1 Hotel West Hollywood 🌤️ 1hotels 1hotel.weho #losangeles #california #usa #hotels #interiordesign #pool #poolday #travel kinooparis Photo by: avdamone, Captions reads: you + winston keep me young #stepup #thesequel avdamone Photo by: marlainapate, Captions reads: Special thank you to all the lovely ladies who joined organicallygrounded’s International Women’s Day Flow with monrow & 1hotels 💚 The fits were fab and we couldn’t have asked for a more perfect day!🌞 #TheOGmethod #iwd marlainapate Photo by: michibfit, Captions reads: Life is good and it only keeps getting better 🖤 michibfit Photo by: choco_goldendoodle, Captions reads: can I sleep here tonight? 🥺 come on it’s a king size bed 🛌 . . . . . #goldendoodle #goldendoodlesofinstagram #dogsofinstagram #doodlesofinstagram #puppy #doodle #1hotel #puppylove #goldendoodlepuppy #puppiesofinstagram #dogfriendly #doodlesoftheworld #dogfriendlyhotel #minigoldendoodle #doodles #weho #1hotelwesthollywood #goldendoodles #bringfido #doglife #dogoftheday #doodletales #goldendoodlesofinsta #interiordesign #puppies #puppylife #labradoodle #instadog #doodlepuppy #goldendoodlef1b choco_goldendoodle No caption provided cristenellese No caption provided the.josie.rae Fully Electric Audi Adventures Through London’s Storied Streets Explore the iconic sights and hidden corners of London with a thoughtfully curated journey in our... Continue Reading Fully Electric Audi Adventures Through London’s Storied Streets Honoring Black History Through Nature & Craft Get to know some of the talented and dynamic BIPOC partners across our sanctuaries as they share... Continue Reading Honoring Black History Thr