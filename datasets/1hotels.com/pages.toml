full_description = "1 Hotel Central Park 1414 Sixth Avenue Get Directions Your New York City sanctuary, right off the park—and steps from the heart of Manhattan. Steps from Central Park Leed Certified Pet Friendly Electric Audi House Car Sustainable Cuisine In-Room Wellness Gym & Classes Sustainable Gatherings At 1 With Nature A sustainable sanctuary right in the heart of Manhattan, removed from its constant hustle, enveloped by greenery at every turn, starting with a three-story live green façade. Good Energy Is Clean Energy LEED-certified, optimized for energy efficiency and powered by green systems, including LED lighting, increased insulation, HVAC energy recovery, and advanced monitoring—designed to save approximately 20% in annual energy costs. Drinking Sustainably Each room is equipped with water filtration in every faucet and recycled wine-into-water bottles. No thank you, single-use plastics. View Rooms Peace of Mind We provide locally sourced, sustainable bed linens and non-toxic, organic mattresses, so you and the earth can sleep soundly. View Rooms Wandering Respectfully Explore the city emission-free in our fully electric Audi Q8 e-tron, or take a walk through Central Park—Manhattan’s most beloved natural refuge. Bring along one of our expert Conservancy Guides and learn about the park’s ecology, history, and design. Explore Easy Conservation Shower times in every bathroom—a friendly reminder, on behalf of water, to keep your showers to five minutes or less. View Rooms 1 Less Thing Overpacked? Simply leave a piece of clothing (or two) under this block to get your pre-loved threads into the hands of those in need through our local charity partner, Housing Works. 2024 MICHELIN KEY We are honored to receive a Michelin Key from the MICHELIN Guide. This accolade represents our team's passion for excellence and dedication to providing unparalleled service for our guests. LEARN MORE Wellness At 1 Hotel Central Park, our experiences are designed to nurture mind, body, and spirit—nutrient-rich cuisine from James Beard award-winning chef Jonathan Waxman, in-room treatments by HigherDose, including their next-level Sauna Blanket and PEMF Mat, and Mind & Movement programming with our expert fitness instructors. Stay Well Fur-Family Friendly We would never ask you to leave your furry (or not furry) friend behind! As a pet friendly hotel, your pup is always welcome at 1 Hotel Central Park. Pet-Friendly Rooms & Suites View All Alcove Queen Interior View Queen Bed 2 People Rain Shower Only View Details Alcove Queen Alcove King Interior View King Bed 2 People Rain Shower Only View Details Alcove King Studio King Premium City View King Bed 2 People Rain Shower Only View Details Studio King City King Interior View King Bed 2 People Rain Shower Only View Details City King City Lounge King Premium City View King Bed 2 People Rain Shower Only View Details City Lounge King City Two Beds Premium City View 2 Double Beds 4 People Rain Shower Only View Details City Two Beds Park King Park View King Bed 2 People Rain Shower Only View Details Park King Park Terrace King Park View King Bed 2 People Rain Shower Only View Details Park Terrace King Pergola Terrace King City View King Bed 2 People Rain Shower Only View Details Pergola Terrace King Alcove Jr. Suite Interior View King Bed 2 People Rain Shower Only View Details Alcove Jr. Suite Alcove 2 Bedroom Suite Interior View 2 King Beds 4 People Rain Shower Only View Details Alcove 2 Bedroom Suite Alcove Studio Suite 2 Queens Interior View 2 Queen Beds 4 People Rain Shower Only View Details Alcove Studio Suite 2 Queens City Suite Premium City View King Bed 2 People Rain Shower Only View Details City Suite Park Suite Park View King Bed 2 People Rain Shower Only View Details Park Suite Park Terrace Suite Park View King Bed 2 People Rain Shower Only View Details Park Terrace Suite Greenhouse Suite Panoramic Views King Bed Queen Bed 4 People View Details Greenhouse Suite Elm House Suite Park View K