["https://1hotels.com/brooklyn-bridge/gather"]
title = "Event Spaces in Dumbo Brooklyn - 1 Hotel Brooklyn Bridge"
description = "From intimate gatherings for 10 to events for up to 1,000 guests, find the perfect event venues in Brooklyn for business functions, weddings, or celebrations."
full_description = "Gather Space to gather, reasons to celebrate. Let us personalize every detail. Request Information Certified Sustainable Gatherings Gather, celebrate, and bring your vision to life in a way that maximizes your event’s lasting impression—but minimizes its environmental impact. Certified Sustainable Gatherings offers a beautiful opportunity to unite all hosts (that’s you!), vendors, and guests around the common purpose of nurturing and safeguarding the planet and its people. Learn More Spaces In nature, everything is interconnected. Connect with others in one of 1 Hotel Brooklyn Bridge’s private meeting rooms, serene public spaces or the fully equipped screening room. Whether it’s for an intimate gathering or large event, discover your perfect space and we’ll provide the rest. Our event spaces in Brooklyn are perfect for everything from intimate gatherings to large celebrations. With spaces that range from 280 sq ft to 11,000 sq ft, alongside 195 guest rooms and suites, there is truly something for everyone. View Details Request Information Events 1 Hotel Brooklyn Bridge offers everything you need for your business functions, wedding or celebrations, including unique spaces, state of the art technology, turnkey event planning, and farm-stand fresh food and drinks. View Details Meetings Find a unique space for your meeting. Turnkey event planning makes it easy to add elements like digital guides and theme-based modules for mindful meetings. Play your content and stream presentations in tech-ready meeting rooms. View Details Weddings From a small intimate ceremony for two, to a reception party for 90, celebrate your special day with 1 Hotel Brooklyn Bridge. Custom planning will create an unforgettable wedding suited to your taste. View Details Catering Make your event farm-stand fresh. The culinary team can create food and drink options unique to your event and needs and taste. Sustainable Design 1 Hotel Brooklyn Bridge's design balances refined elements with a comfortably curated atmosphere, inspired by the creativity and craftsmanship of local artists, builders, chefs, and the surrounding community. All design choices and materials are used purposefully and thoughtfully with an emphasis on using existing structural and reclaimed materials sourced throughout Brooklyn. Sustainable Food Practices The hotel's menus spotlight local ingredients sourced from regional farmers, fishers, bakers, and makers. Indulge knowing each bite and sip supports local purveyors, waste-diversion, and sustainable food systems. Local Love The hotel’s culinary team takes pride in their relationships with the local farmers, purveyors who supply their kitchens with high-quality, sustainably-made products. Farmers across New York, New Jersey, and Pennsylvania provide us with quality, fresh produce so our guests can savor the seasons while the hotel works to preserve the environment by purchasing local. Wellness Enhancements At 1 Hotel Brooklyn Bridge, we offer elevated extras to further enhance your next meeting, event or wedding. With a multitude of wellness offerings to add to your experience, our team will curate a package that works for you. Mind & Movement We know you have a lot on your mind. Take a moment to center yourself with a private yoga class for you and your group or a personal training session just for you."
