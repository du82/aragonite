["https://1hotels.com/thefieldguide/honoring-black-history-through-nature-craft"]
title = "Honoring Black History Through Nature & Craft - The Field Guide"
description = "Get to know some of the talented and dynamic BIPOC partners across our sanctuaries as they share their stories of passion and inspiration."
full_description = '''Honoring Black History Through Nature & Craft Get to know some of the talented and dynamic BIPOC partners across our sanctuaries as they share their stories of passion and inspiration. Published on: February 12, 2025 Share:Click the link to copy to clipboardLink Copied to Clipboard As a brand and community built upon safeguarding the planet and all of its people, we make a conscious, continuous effort to spotlight and uplift our Black partners and neighbors year-round, but Black History Month offers a unique opportunity to further amplify their voices around the world. As talented plant experts, mixologists, fragrance creators, jewelry designers, and everything in between, our partners have played (and continue to play) a huge role in shaping the 1 world, and we want to honor them by sharing their insights with the world. We spoke with our talented Black partners across our properties to explore their expertise and shine a light on their stories. Explore the contagious joy, inspiration, and passion of these visionaries as they host immersive events throughout Black History Month, from mindful mixology masterclasses to fragrance and jewelry pop-ups and everything in between. KYRA LUMPKIN, FOUNDER OF KARL MARIE | 1 HOTEL SAN FRANCISCO Karl Marie is more than a fragrance brand—it’s a celebration of legacy, memory, and self-expression. Can you share what first sparked your passion for creating scents and how that evolved into a mission to redefine the way people experience fine fragrances? Fragrance has always been how I hold memories. I moved around a lot during my childhood, often not attending the same school for more than a year, so creating physical homes or long-lasting connections to people and places became nearly impossible. However, I found that I could always relive my favorite moments through fragrances, whether it be a certain smell of petrichor and ozone that reminded me of playing outside when I was kid in St. Louis, or the fresh aquatic salty air of the Bay Area the first time I stepped off the plane when I moved here. I carry all my homes within me, with fragrance as my comforting embrace. Black History Month is a time to honor and celebrate Black creativity, resilience, and legacy. In what ways does Karl Marie reflect your personal heritage and contribute to the broader narrative of Black excellence and generational storytelling? Karl Marie is my love letter to my grandparents and the legacy they built. They were among the first black families to move into an upper middle-class neighborhood in St. Louis. They faced a lot of obstacles and discrimination to achieve what they were told they weren't good enough to have, simply because of the color of their skin. They never wavered and stayed true to their vision of what they wanted for themselves and their family for generations to come. My grandfather was a veteran and worked for the US post office until the day he died. My grandmother was a botanist and the quintessential mom and wife. To me, they were the epitome of Black elegance and excellence. Their love, kindness, intelligence and warmth was my awakening of what it meant to be Black, and how truly beautiful and multi-faceted my community is. You’ve spoken about stripping away the “padding” of the fragrance industry to craft scents that people can truly feel. How do you balance staying authentic to your vision while navigating an industry often steeped in tradition and perfection? For me, I never have strived for perfection. I believe not only will you put yourself into a toxic cycle of constant self-depreciation, but also the goal of perfection also gives you a hard stop. I never want to stop learning. I never want to stop giving the best of myself to anyone who believes in me and my brand. I don't really care what the industry is doing. I only have the capacity to care about creating a quality product and experience that people will feel and remember. Sustainability and transparency are clearly core to Karl Marie’s values. Why are these commitments so integral to your brand, and how do they shape the way you create meaningful connections through fragrance? There is a lot of trust that goes into enjoying a fragrance. Often people buy fragrances blindly, or by word of mouth. Outside of what they've heard about it or the notes they've read, they don't know much about what the fragrance smells like and even less about how it was made, yet they put so much faith (and money) into something that will stick with them psychologically for years. It is my duty to offer a product that answers any and all questions so there is no room for anyone to feel unsafe or unsure. As we celebrate Black History Month, what do you hope people take away from Karl Marie and its ability to honor Black history and culture through the stories captured in each scent? I hope they take away that at the heart of Karl Marie is Black history. Care for and celebration of my community and my culture are of the utmost importance to me as a business owner and a black woman. I could not have built anything I have in Karl Marie without paying homage to those who pioneered before and those still innovating and breaking barriers today. Karl Marie is nothing with the Black community. VANESSA MILLER, FOUNDER OF BQMNY | 1 HOTEL CENTRAL PARK Your journey blends artistry, social work, and community advocacy. How did your path lead you to jewelry design, and what inspired you to launch BQMNY? My journey into jewelry design has been motivated by the creativity, resiliency, and contributions of under-supported communities, particularly Black people and LGBTQ+ icons. From the ballroom scene to Jamaican dancehall culture, these communities have had a tremendous impact on culture, fashion, jewelry, and art, but often remain overshadowed. BQMNY was born from my commitment to uplift and support these communities. For me, jewelry has been both a personal and professional journey. I’ve been creating for 8 years, starting as a young person trying to find my way. Jewelry making gave me purpose, healing, and stability as I navigated life after aging out of the foster care system at 21. It was a time when I had minimal resources, but I stayed authentic, worked hard, and remained resourceful. This allowed me to create pieces that not only express my journey but also uplift and adorn the communities that I’m a part of. My work is a reflection of my journey and my belief that everyone, especially those from marginalized backgrounds, deserves to thrive in the creative industries. Your workshop at 1 Hotel Central Park invites guests to explore mindful jewelry making. What’s your favorite part about guiding people through the creative process? What I love most about guiding others through the jewelry-making process is seeing people rediscover their own magic. By sharing my artistic process, my progress, my vulnerability, and personal growth, I’m able to remind others and myself of the power we all hold. My artistic practice has connected me to diverse communities, reminding me that I’m not alone. It’s been incredibly rewarding to see others find connection through their own creative expression, and I deeply enjoy creating a space where others can embrace their authenticity as I’ve done. Black History Month is a time to celebrate creativity and culture. Who are some Black artists, makers, or changemakers who inspire you and why? So many Black artists, makers, and changemakers inspire me. I admire individuals who are pushing boundaries and making space for our communities, especially in creative industries. People like Audre Lorde, who deeply influenced my approach to self-expression and healing, and changemakers who are creating new pathways for others to thrive, really motivate me to continue my work. I feel that the impact of these individuals is not just about the work they’ve done but also the spaces they’ve created for future generations. Their legacy fuels my own commitment to making jewelry that serves and uplifts the communities I’m part of. For those new to jewelry making, what’s one piece of advice you’d offer to embrace the creative process with confidence? My best piece of advice is to be patient with yourself, remain authentic, and trust the process. Jewelry making, like any creative endeavor, is a journey of self-discovery. Don’t be afraid to make mistakes, those are often where the most beautiful creations emerge. Confidence comes from practice and embracing your unique perspective. Keep experimenting, stay curious, and don’t rush the learning curve. Every piece you create is a step toward building your confidence as a maker. Just remember, the process itself is as important as the final piece. VICTORIA EADY BUTLER, MASTER BLENDER AT UNCLE NEAREST 1884 TENNESSEE WHISKEY | 1 HOTEL WEST HOLLYWOOD You’re the first known African American woman Master Blender in the spirits industry. Can you speak to the journey of bringing Nathan "Nearest" Green's legacy to light? Nearest Green is and will always be the inspiration behind everything we create. His story, his experiences and his legacy are front of mind in everything we do. Uncle Nearest boasts an all-female executive team. How has this unique leadership dynamic contributed to the brand's success, and what impact does it have on the whiskey industry's landscape? The relationship that our executive team has is one of openness and radical transparency. Everyone's opinions and ideals are valued and appreciated. In addition, we're all multitaskers as each one of us wears more than one hat. Our all-female executive board is the first in the industry. Through our hard work, commitment, and dedication we've been a visual example that women have the necessary skill-set to lead a successful brand. The launch of the $50 million Nearest and Jack Advancement Initiative is a significant step towards supporting minority-founded and owned spirit brands. Can you elaborate on the mission of the fund and its role in fostering diversity within the industry? It is a three-prong initiative comprised of the Nearest Green School of Distilling, Leadership Acceleration Program (LAP), and the Business Incubation Program. It was created to improve diversity in our industry, specifically a way to get African Americans into top positions. This unique collaboration is an avenue to help advance the next generation of African American leaders in our industry. EMPOWER BLACK STORIES We hope these conversations inspire you to explore the stories of BIPOC friends and neighbors in your own life, celebrating their achievements and triumphs this month and beyond. NICHELLE QUEEN PROCTOR, FOUNDER OF THE PLANT QUEEN | 1 HOTEL SAN FRANCISCO Could you share the inspiration behind The Plant Queen, and how your journey has been creating the first Black and Asian-owned plant shop in Berkeley? The inspiration for The Plant Queen came from my love for house and native plants, combined with a passion for interior design and creating a welcoming home. My partner and I are proud to be the first Asian and Black-owned plant shop in Berkeley, showcasing the strength of both communities collaborating to create something beautiful together. Only one percent of all landscape architects in the U.S. today are Black. What do you think are the most important steps that can be taken to bring more people of color into the profession? Increasing diversity in the landscape architecture profession requires a multifaceted approach. Fostering mentorship programs, promoting educational opportunities in underrepresented communities, and actively advocating for inclusivity in hiring practices are crucial steps. Additionally, creating awareness about the profession's potential and showcasing successful role models can inspire individuals from diverse backgrounds to pursue careers in landscape architecture. We are thrilled about the upcoming pop-up collaboration at 1 Hotel San Francisco. What kind of experience should guests anticipate? Guests at the upcoming pop-up collaboration at 1 Hotel San Francisco can anticipate a warm welcome surrounded by lush greenhouse plants. The experience will include valuable plant knowledge, and for those interested, there will be a repotting station available. It promises to be an enjoyable and interactive event for all attendees. As plant enthusiasts, readers often seek advice on nurturing their green companions. What tips or insights can you share for our readers to create a thriving and sustainable indoor plant haven at home? Establishing a flourishing indoor plant haven is akin to nurturing ourselves—each plant, like us, has unique needs contributing to its overall well-being. Begin by comprehending the light requirements of different plant species and strategically placing them to receive optimal sunlight. Develop a consistent watering routine, adjusting it with seasonal changes and individual plant needs. Pay attention to humidity levels, considering occasional misting or placing water trays to accommodate specific preferences. Opt for well-draining soil and periodically re-pot to provide fresh nutrients, mirroring how we benefit from a nourishing environment. Maintain stable temperatures, acknowledging that, much like humans, plants thrive when their surroundings cater to their distinctive requirements. Regular observation and responsive care cultivate not just a collection of plants but a vibrant and flourishing indoor sanctuary, enhancing both the aesthetic and well-being of your space. More Stories We'd Think You'd Enjoy View all stories Fully Electric Audi Adventures Through London’s Storied Streets Explore the iconic sights and hidden corners of London with a thoughtfully curated journey in our... Continue Reading Our People Sustainability The Art of Seasonality: Chef Josh Bosen’s Inspired Approach to Melbourne Dining Discover how Chef Josh Bosen plans to redefine dining at 1 Hotel Melbourne, blending creativity... Continue Reading Sustainability Rethink Your Drink: Lyre’s on the Craft of Alcohol-Free Indulgence Explore the world of non-alcoholic spirits, embrace mindful drinking, and enjoy a sustainable twist... Continue Reading'''
