full_description = "Floorplan250 Gallery250 Connecting Liberty Suite & King Welcome to your Brooklyn Bridge retreat. Survey the view from your curated seating area in the Liberty Suite & King Bed rooms joined by a connecting door. Make the most of your stay with nightly turndown service (upon request) and priority seating at The Osprey, Neighbors, and Harriet's (based upon availability). Average Size: 665 sq.ft. | 61 sq.m. Premium City View 2 King Beds 4 People Rain Shower Only Connecting Rooms Living Area Corner Room Floor to Ceiling Windows Suite Perks Book This Room Check In Wednesday 5 Mar, ▼ Check Out Thursday 6 Mar, ▼ Check Availability All Rooms Include Pet Friendly Free WiFi LCD 55 Television Keetsa Mattress Cotton Bedding Filtered Water Taps Coffee Machine Bamford Bath Products Soft Cotton Robes Cotton Slippers Yoga Mat Digital Newspapers 1 Hotels Mobile App Hairdryer Full-length Mirror HEPA Air Filters In-Room Greenery Smoke Free The Bed Your king bed has been made with the comfortable, all-natural elements: custom organic cotton mattress by Keetsa, sustainably sourced linens, and a corrugated leather headboard. The Bathroom Refresh with a triple-filtered rain shower and Bamford signature amenities surrounded by Natal mahogany, glass, and marble. Relax in your cotton-knit towels, robe, and socks. Seating Area Furnishings, of a porous stone-look table of composite wood and pendant leather lampshades, bring nature into your space. Stream content from your device on the LCD 55-inch smart television. Brooklyn Made Inspired by nature. Made in Brooklyn. Many of the design details in your room are by local artisans, from the “crate” inspired, open-slatted wood closets, to the Fresnel glass light fixtures. Explore Offers View all Offers ENDS March 20 Sleep Brooklyn Bridge Winter Solstice Up to 30% off your stay $30 Dining Credit Bamford Wellness Spa treatment discount Flexible cancellation Sleep Brooklyn Bridge Give Green, Get Green Up to 40% off your stay & $30 h