full_description = "At 1 Hotels, Nature Is Everything Welcome! We’re so happy you’ve crossed our path. At 1 Hotels, we let nature lead the way—which means spaces designed to bring the outdoors in—and a stay full of natural joy, good surprises, new experiences, revived routines, and total serenity. Learn More Nature & Nurture - Our Story Sustainability Comes Naturally Thank you for having us. We are guests of this planet, so we treat it with respect, appreciation, and good manners. Learn More Wellness Is All Around Wellness on the inside starts by going outside. Learn More Natural Sustenance Fresh, organic, inspired cuisine informed by our local settings, with a diverse selection of menus for all kinds of tastes—and sweets, too. Learn More Being at 1 - Our Experiences Our Restaurants & Bars A diverse collection of restaurants and bars, for sustainably sourced menus full of nutrient-rich nourishment, craft cocktails, and inspired indulgences. Learn More Bamford Wellness Spas Designed to nurture body, mind and soul, founded on an integrated approach to wellness. Learn More Mind & Movement We've partnered with some of the world's top fitness professionals to provide their exclusive training services for a variety of complimentary wellness classes. Learn More Daylife Epic outdoor adventures, lasting wellness, connection to nature, curated events and programming, and experiences that nurture body, mind, and soul. Learn More Pets Are Family Too We would never ask you to leave your furry (or not furry) friend behind! Your pets are always welcome at 1 Hotels. Learn More Goodthings Signature sustainable products and a curated selection from our favorite like-minded brands. Learn More Certified Sustainable Gatherings Gather, celebrate, and bring your vision to life in a way that maximizes your event’s lasting impression—but minimizes its environmental impact. Certified Sustainable Gatherings offers a beautiful opportunity to unite all hosts (that’s you!), vendors, and guests around the common purpose of nurturing and safeguarding the planet and its people. Learn More A World That Is 1 Making Waves View all Press The Best Hotels in New York: All the MICHELIN Key Hotels in the City MICHELIN Guide 2024 / 12 / 18 Continue Reading The Best 1 Hotels Destination for Every Type of Trip Town & Country 2024 / 12 / 10 Continue Reading Is this London's most luxurious eco hotel? The Standard 2024 / 11 / 25 Continue Reading The Best Hotel Rooms in New York City With a View Travel + Leisure 2024 / 10 / 21 Continue Reading Your Favorite Moments @1hotels #1hotels https://www.instagram.com/1hotels/ https://www.tiktok.com/@1hotels https://www.facebook.com/1hotels/ Photo by: this_bird_set_free, Captions reads: 🤎 this_bird_set_free Photo by: josemelgarejo.us, Captions reads: 📸🎥🎞️ Shooting CINEMATIC ENGAGEMENTS is part planning and part flow. 👇 🫶🏽A ton of work to bring a great concept to life and to get all three of us — myself the photographer my couple emotionally on board with what we’re about to create. 🌉Here’s a few snapshots of the engagement session we brought to life at the 1hotel.bklynbridge in the heart of DUMBO BROOKLYN. I may share more from this shoot, but here’s a preview with some shots I’m truly proud of. 🤓I used an adapted camera with a special lens to get some of these effects as well as my own presets based on vintage film stock. Incredibly empowering to see a concept and vision come together. 🌅📸 🛑Choose your adventure - the next post should be : josemelgarejo.us Photo by: jabbarlewis, Captions reads: NYC I LOVE YOU!!! jabbarlewis Photo by: letsnomnom_, Captions reads: savoring the simple pleasures of slow mornings ✨ waking up to waffles, the crunch of a freshly baked croissant, and a good book — topped off with stunning view of the bay bridge ☺️ 1hotel.sanfrancisco Terrene.SF #1hotelSF #TerreneSF #1Hotels #sponsored letsnomnom_ Photo by: kathrinsmirke, Captions reads: Enjoyed a wonderfully relaxing spa day at bamford within the breathtaking 1hotel.hanaleibay 🌺🧖‍♀️ kathrinsmirke Photo by: bradyhousestudios, Captions reads: A quite moment after the ceremony for shared breath + exchanging personal vows under this magical tree at the 1hotel.hanaleibay #kauai bradyhousestudios Photo by: aubestlife, Captions reads: Happy Earth Day! 🌍 Today, let's take a moment to appreciate the stunning natural beauty that surrounds us here in Hawaii. From the crystal clear waters of our beaches to the lush greenery of our forests, we are so lucky to call this place home. Let's do our part to protect and preserve it for generations to come. 🌈🌺🩵🏝️🌊🌱🌏 Small actions can make a big difference, et's commit to adopting sustainable practices in our daily lives. Whether it's using a reusable water bottle, choosing to walk or bike instead of drive, or supporting local businesses that prioritize the environment, we can all do our part to reduce our impact on the planet. #earthday2023 #alaskaairlines #iflyalaska #alaskacarelines #1hotel alaskaair 1hotel.hanaleibay aubestlife Photo by: sheepadood.levi, Captions reads: Me and Moms had the BEST night and I can’t wait to tell you all about it!! Soaking up the views this morning from my home for the weekend 🌥️ 1hotel.bklynbridge 🐾 sheepadood.levi Photo by: pixiprol, Captions reads: 1 Hotel West Hollywood 🌅 • • • 1hotel.weho #losangeles #1hotel #california #room #hotelroom #1hotelwesthollywood #westhollywood #hollywood #1hotelweho #traveladdict #luxury #instamood #traveladdict #losangeles_city #socal #voyaged #voyage #businesstrip #traveling #interiordesign #luxury #upscale #5star #sustainable #sustainableluxury #environment #californialove #hotelroom #hotellover #cozy #sunrise #pool #swimmingpool pixiprol Photo by: kimiaskravings, Captions reads: Baycation’s all I ever wanted ✨ kimiaskravings Load More tagline Sanctuary Stories 1 Hotel Brooklyn Bridge Take a seat that tells a story. Much of the furniture in our sanctuary is constructed with reclaimed wood from Brooklyn’s old Domino Sugar Factory. Learn More tagline Sanctuary Stories 1 Hotel Central Park 36,000 ivy plants blanket our urban sanctuary, each working to produce oxygen, absorb greenhouse gasses, reduce surface temperatures in the summer, and insulate in the winter. Learn More tagline Sanctuary Stories 1 Hotel Hanalei Bay Throughout our island oasis, you'll find 144.6 tons of salvaged materials turned into furniture and sustainable art pieces that pay homage to their surroundings. Learn More tagline Sanctuary Stories 1 Hotel Mayfair Connect with the past while enjoying the present as our dry stone walls in the reception and signature bar are formed from reclaimed stone walls in Yorkshire, brought down from the north of England and built by hand using traditional techniques. tagline Sanctuary Stories 1 Hotel Nashville You’ll find over 56,000 individual plants in our ivy façade, capturing CO2, filtering airborne particulates, absorbing heat from sidewalks, and generating fresh oxygen. Learn More tagline Sanctuary Stories 1 Hotel San Francisco Our lobby flooring is composed of 7,000 square feet of reclaimed barn wood, with our elevator landings reclaimed from the old Bay Bridge. This design detail allowed us to divert landfill waste, cut carbon emissions, and prevent the harvesting of virgin wood. Learn More 1 Hotel & Homes South Beach Throughout our sanctuary, we’ve rescued and repurposed 7,000 square feet of hardwood from boardwalks and pool decks to offset the purchasing and shipping footprints of new materials. Learn More 1 Hotel Toronto Local woodworking studio Just Be Woodsy transformed fallen Toronto trees into over 1,000 pieces of hand-crafted, one-of-a-kind furnishings throughout our urban sanctuary. Learn More 1 Hotel West Hollywood The carpets throughout our Southern California sanctuary are made of recycled materials including ocean plastics, helping to divert unnecessary waste from oceans and landfills. Fully Electric Audi Adventures Through London’s Storied Streets Explore the i