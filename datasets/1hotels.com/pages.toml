title = "Mission by 1 Hotels - Get Started | 1 Hotels"
description = "Log in to or create your Mission account to enjoy personalized experiences at 1 Hotels like complimentary upgrades, insider offers, and custom wellness experiences."
full_description = "MISSION BY 1 HOTELS At 1 Hotels, we believe in the power of experiences that bring us closer to nature—finding joy, adventure, serenity, and comfort in the incredible cycles and systems that surround us. To nurture this connection, we’ve crafted a one-of-a-kind membership program that rewards you for immersing yourself in the wonders of the natural world. Log in Join Personalize Your Retreat When you join Mission and tell us a little bit about yourself, we’ll keep track of your likes, dislikes, sleep patterns, wellness rituals, and more, so we can make sure your retreat is perfectly tailored to you and your loved ones, and treat you to inside offers and surprise delights. From anniversary surprises to homemade dog treats, we’ll help you feel right at home. Share Your Preferences Let Nature Be Your Guide With the 1 Hotels App, you’ll have everything you need for the perfect stay at your fingertips. With just a few taps, you can view and edit your preferences, browse your benefits, dream about your upcoming adventures, explore your itineraries, discover the stories of our sanctuaries, access mobile check-in, and so much more. Download for Apple Download for Android Mission Rewards GROW AS YOU GO As you continue to explore our sanctuaries with Mission Rewards, you’ll earn points to grow into new loyalty tiers. Each tier has its own set of exclusive benefits from tailored offers to personal training sessions, giving you more opportunities to unlock exciting new perks while you explore the 1 world. EXPLORE EACH TIER STAY FOR A CAUSE Through Mission Rewards, you’ll earn Give Back cash to fund environmental and social causes around the world. From protecting the wilderness to wind power projects, your membership has the potential to ignite positive change.(see program Terms & Conditions for full details). VIEW FAQS Explore each tier Earn 1 Point per $1 (USD) of Qualifying Charges* Exclusive Benefits Earn 5,000Points Annually* Earn 50,000Points Annually* Earn 75,000Points Annually* Birthday & Anniversary Surprises Exclusive Offers & Experiences First-to-Book Opportunities Complimentary Room Upgrade (Upon Availability) Complimentary Personal Training Sessions (Per Year) Hotel Credit (Per Stay) $15 $15 $100 Guaranteed Late Check-Out 1pm 1pm 2pm Give Back | Self Love Rewards 1% 2% 3% 4% * Membership Points are awarded based on the Qualifying Charges incurred by the Member at participating properties. SH reserves the right to modify the number of Membership Points awarded per dollar of Qualifying Charges incurred. Please see full Terms & Conditions for details on the number of points earned per dollar. Once you have reached a certain Membership Tier, you may keep such status for the remainder of the twelve-month period (as calculated starting from the date of your enrollment in the Loyalty Program) and for the subsequent twelve-month period. Earned points are reset to zero points on the first day of each twelve-month period, as calculated starting from the date of your enrollment in the Loyalty Program. ** Must book specific Mission tier-based rate to receive credit."
