title = "Bamford Treatment: B Silent - 1 Hotel Central Park"
description = "Celebrate the Full Moon with us and start the weekend with renewal. Join Tina Jackson for breathwork and indulge in restorative treatments by Bamford Wellness throughout the weekend in our private suite. Reserve your spot for breathwork here. In honor of World Sleep Day and in celebration of our 10 year anniversary at 1 Hotels, we are excited to welcome Bamford for an exclusive three-day residency in our private suite, where they’ll be performing the transformative B Silent treatment  B Silent treatment (60-minutes): Prepare the body and mind for deep relaxation using products from Bamford's B Silent range, developed to improve sleep quality. Experience a full back massage with our organic B Silent body oil,  containing a blend of St John’s wort, known for its deeply relaxing properties, along with Roman chamomile, lavender flower and vetiver root essential oils. A series of assisted stretches, incorporating a Japanese Shiatsu rocking technique, is designed to release stress, loosen hips, unlock the lower back and gently rotate the spine. Finally, B Silent Temple Balm is applied to the forehead and temples to prepare the body and mind for deep relaxation. COST: $340 About Bamford: Bamford Wellness is devoted to nurturing the mind, body and spirit. Their holistic approach is based around a heartfelt connection with nature. Originally created by Carole Bamford in the English countryside, individually crafted treatments use specially formulated products from the Bamford body and skincare ranges made from natural and organic ingredients certified to the highest standard. In the intuitive hands of their therapists, the effect of each treatment will be felt long after you depart."
