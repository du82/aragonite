full_description = "Do Looking for things to do during your stay? We’ve got your daylife covered. From yoga classes, to theater recommendations and must-see destinations in the park, there are many things to discover during your stay at 1 Hotel Central Park. Mind & Movement Recharge at The Field House, our state-of-the-art gym. Stay fit with a one-on-one training session with some of the world's top personal trainers. And get inspired in group classes, complimentary for hotel guests. View Details Audi Experience We’re always seeking innovative ways to show you how to live more sustainably. With this in mind, we’re pleased to introduce the Official Electric Vehicle of 1 Hotels, the fully electric Audi Q8 e-tron. Guests are welcome to enjoy the Audi Experience while taking advantage of the house car or test driving the Audi Q8 e-tron during your stay. The house car is available daily on a first-come, first-served basis from the hotel entrance. To test drive or reserve a day trip, please contact our concierge. Learn More tagline Travel with Care Audi Excursions Explore the natural beauty and bounty of New York with Audi Excursions. Our fully electric Audi Q8 e-tron house cars will take you on unexpected city adventures to the charming coastal towns of Beacon and Greenport. tagline Travel with care The Town of Beacon Explore the eclectic art, stunning nature, and captivating culture in the lively town of Beacon, NY in the heart of the Hudson Valley. **Tour Dia Beacon’s incredible art collections and exhibitions, spanning the 1960s to the present. Explore the Beacon Flea Market, where you can find colorful glassware, retro cookware, hand-made jewelry, antique furniture and lighting, vintage designer clothing and accessories, and so much more. ** denotes an additional charge. *fully electric Audi Q8 e-tron must be reserved 48 hours in advance with concierge. Reserve tagline Travel with Care Greenport Discover the history, charm, and allure of Greenport, Long Island, soaking in the coastal beauty and serenity. **Travel to the sweeping bluffs of the Long Island Sound to tour Kontokosta Winery and indulge in tastings of their award-winning hand-crafted wines led by experts. **Tour the Railroad Museum of Long Island where you can learn why, according to Frederick A. Kramer, “Greenport was the place that caused the Long Island Railroad to be built.” ** denotes an additional charge. *fully electric Audi Q8 e-tron must be reserved 48 hours in advance with concierge. Reserve Upcoming Events Wed 5 Mar Central Park Jams Cork Recycling with the RETI Center Daily Wed 5 Mar Central Park Jams DJ Sessions at Jams Weekly Tue 11 Mar Central Park Field House Fitness Center Total Training Weekly on Tuesday Fri 14 Mar Central Park Private Suite Bamford Treatment: B Silent March 14 - 16 Fri 14 Mar Central Park Great Lawn - 2nd Floor Biofield Breathwork: Expansion & Deep Rest March 14 Sat 22 Mar Central Park Lobby GOODTHINGS TAKEOVER: KINKA Saturday Mon 7 Apr Central Park Lobby Matcha Monday with Plentea First Monday of the Month Thu 27 Nov Central Park Thanksgiving Parade View Rooms November 27 Offers Sleep Do Taste Central Park Be Well At 1 Up to 30% off your stay and Personal Training Session Legend Our Location 1 Hotel Central Park 1414 Avenue of the Americas New York, NY 10019 Get Directions Located in the center of midtown Manhattan, 1 Hotel Central Park is the perfect home base for all your urban adventures. Show All Activities & Tours Arts & Culture Doing Good Entertainment Family Food & Drink LGBTQ Nature Pets Shopping Wellness Activities & Tours Rockefeller Center Rockefeller Center is the best of New York. Where the energy, ambition and magic of the city is brought to life every day for all who come. From NBC Studios and Christie’s, to the best local boutiques and awarded local restaurants – find them all here, in the city within the city. Learn More Learn more about Rockefeller Center Columbus Circle Visit the Frederick Douglass and Duke Elli