full_description = "TASTE Refuel at our unique dining venues, where fresh, local ingredients take center plate. Savor authentic Baja cuisine with ocean views at Hacienda, and visit some of Cabo's most world-renowned restaurants within walking distance of our resort. Beachfront Pool Food Truck Join us at the resort's beachfront pool for our farm-to-food-truck concept serving Mexican cuisine with fresh and locally sourced ingredients. HOURS Daily | 10am - 6pm Mezcal Bar Visit the resort's Mezcal Bar for the finest mezcal and tequila our region has to offer. HOURS Tuesday - Sunday | 3pm - 11pm Grab & Go Stop by for snacks and sandwiches made with local ingredients, fresh baked goods, organic coffee, and made-to-order smoothies. A thoughtfully curated selection of artisanal packaged goods is also available 24/7. HOURS Daily 6am - 7pm In-Home Dining Refuel on your schedule with seasonal, locally-sourced, vibrant fare delivered to your home 24 hours a day. HOURS Daily | 24 Hours Lobby Farmstand Stop by our Farmstand located in the Sala at the resort lobby for a taste of the season’s harvest. Fresh and locally sourced fruits are available complimentary to you and the family. Visit for a quick snack and vitamin boost! HOURS Daily | 7am - 5pm Chef Services We offer a variety of culinary experiences for all occasions, from taco stations, BBQs, and boxed lunches to coursed dinners with customized menus. Bartender services compliment any gathering with local wines, beers, and custom mixology. Please contact us at least 48 hours in advance to ensure availability. Contact Us Grocery Services We offer a variety of culinary experiences for all occasions, from taco stations, BBQs, and boxed lunches to coursed dinners with customized menus. Bartender services compliment any gathering with local wines, beers, and custom mixology. Please contact us at least 48 hours in advance to ensure availability. Contact Us Hacienda Cocina y Cantina Inspired by the true style of a Mexican hacienda’s luxury and one-of-a-kind service, Hacienda Cocina y Cantina overlooks stunning views of Land's End and the seashore on Medano Beach. The restaurant celebrates Mexican cuisine, focusing on traditional dishes from Baja. It's the perfect spot for a little indulgence. Hacienda Cocina is located in our neighboring sister resort. Visit Website Savor Cabo Our resort in the heart of Cabo means many of the area's best restaurants are just a short walk away, including Edith's, Los Tres Gallos, The Office, and Nick-San. Contact our concierge team for more recommendations, and truly experience the local flavors. Contact us"
