["https://1hotels.com/brooklyn-bridge"]
title = "1 Hotel Brooklyn Bridge: Sustainable Luxury Hotel"
description = "1 Hotel Brooklyn Bridge is a sustainable, pet-friendly luxury hotel with waterfront views of the Manhattan skyline, a rooftop pool, and exclusive amenities."
full_description = '''1 Hotel Brooklyn Bridge Brooklyn, NY 60 Furman Street Get Directions Welcome to your Brooklyn Bridge waterfront retreat, with sweeping views of the East River and Manhattan skyline, and interiors featuring native greenery and reclaimed materials. Skyline & Bridge Views LEED Gold Pet Friendly Electric Audi House Car Sustainable Cuisine Rooftop Bar Rooftop Pool Bamford Wellness Spa Gym & Classes Sustainable Gatherings Good Energy Is Clean Energy Optimized for energy efficiency and powered by green systems, including low-energy LED lighting and smart temperature control. At 1 with Nature Over half of 1 Hotel Brooklyn Bridge is built from regional and reclaimed materials, including original heart pine beams from the former Domino Sugar Factory, now at home in tables and benches throughout our common spaces. Experience Local Elements Over half of our hotel is made from regional and reclaimed materials, including original heart pine beams from the former Domino Sugar Factory in Brooklyn that now act as tables in our lobby and benches on each guestroom floor. Drinking Sustainably Each room is equipped with water filtration in every faucet and recycled wine-into-water bottles in every room. No thank you, single-use plastics. View Rooms Peace of Mind We provide locally sourced, sustainable bed linens and non-toxic, organic mattresses, so you and the earth can sleep soundly. View Rooms Wandering Respectfully Explore the city emission-free in our fully electric Audi Q8 e-tron, or head to Manhattan and take a walk through Central Park. Bring along one of our expert Conservancy Guides and learn about the park’s ecology, history, and design. Explore 1 Less Thing Overpacked? Simply leave a piece of clothing (or two) under this block to get your pre-loved threads into the hands of those in need through our local charity partner, Housing Works. Learn More Travel + Leisure "1 Hotel Brooklyn Bridge is a waterfront gem, with a rooftop pool and stunning skyline views." Read the Article Wellness At 1 Hotel Brooklyn Bridge, our experiences are designed to nurture the mind, body, and spirit. Unwind with rejuvenating treatments at Bamford Wellness Spa, recenter with Mind & Movement programming, sweat it out with in-room treatments by HigherDose, and refuel with organic, seasonal menus. Stay Well Fur-Family Friendly We would never ask you to leave your furry (or not furry) friend behind! As a pet-friendly hotel, your pup is always welcome at 1 Hotel Brooklyn Bridge. Pet Policy Rooms & Suites View All Dumbo King City View King Bed 2 People Rain Shower Only View Details Dumbo King Dumbo 2 Beds City View 4 People 2 Double Beds Rain Shower Only View Details Dumbo 2 Beds Park King Park View King Bed 2 People Rain Shower View Details Park King Liberty King Skyline View King Bed 2 People Rain Shower Only View Details Liberty King Bridge King Bridge View King Bed 2 People Rain Shower Only View Details Bridge King Harbor 2 Beds Park & City Views 2 Double Beds 4 People Rain Shower Only View Details Harbor 2 Beds Liberty Studio Suite Skyline View King Bed 4 People Rain Shower Only View Details Liberty Studio Suite Bridge Studio Suite Bridge View King Bed 4 People Rain Shower Only View Details Bridge Studio Suite Skyline 1 Bedroom Suite Skyline View King Bed 4 People Separate Rain Shower View Details Skyline 1 Bedroom Suite Riverhouse Panoramic Views 2 King Beds 4 People Separate Rain Shower View Details Riverhouse Connecting Liberty Suite & King Premium City View 2 King Beds 4 People Rain Shower Only View Details Connecting Liberty Suite & King Neighboring Bridge Suite & King Bridge View 2 King Beds 4 People Rain Shower Only View Details Neighboring Bridge Suite & King Neighboring Skyline Suite & 2 Bed Skyline View 1 King & 2 Double Beds 6 People Rain Shower Only View Details Neighboring Skyline Suite & 2 Bed Connecting Skyline Suite & King Skyline View 2 King Beds 4 People Rain Shower Only View Details Connecting Skyline Suite & King Upcoming Events View all Wed 5 Mar Brooklyn Bridge Lobby Wellness Wednesdays with Plentea Matcha March 5 Wed 5 Mar Brooklyn Bridge Bamford Wellness Spa Midday Mindfulness Monday-Thursday Wed 5 Mar Brooklyn Bridge The Osprey Sustainable Sips: Oyster Happy Hour Mon-Fri Thu 6 Mar Brooklyn Bridge Social Space, Outdoor Patio Sunrise Yoga Flow Thursdays Fri 7 Mar Brooklyn Bridge Harriet's Lounge Harriet's Night Shift Weekly on Friday and Saturday Sat 8 Mar Brooklyn Bridge Social Space, Outdoor Patio Fitness Flow Saturdays Sat 8 Mar Brooklyn Bridge The Osprey Sounds of Brooklyn Weekly on Saturday Fri 14 Mar Brooklyn Bridge lobby New Season Tarot Readings March 14 & 28 Sat 15 Mar Brooklyn Bridge Blue Wood Aster Rescue Puppy Yoga with Woof Wellness March 15 Fri 21 Mar Brooklyn Bridge Lobby Sustainable Succulents with KINKA March 21 Taste Savor organic New American cuisine at The Osprey or enjoy small plates at Harriet’s, offering skyline views and live DJs. Indulge in fresh, seasonal items at Neighbors or with in-room dining, along with locally sourced produce at our Lobby Farmstand. Explore Do Take in the Manhattan skyline and cityscape from Harriet’s Lounge, sweat it out in The Field House, experience holistic well-being at Bamford Wellness Spa, or wander the whole of New York City. Do More Gather Our event spaces are designed to adapt nimbly to just about any gathering, with turnkey planning and custom seasonal menus from our expert culinary team. View Our Spaces Offers & Experiences View all ENDS March 20 Sleep Brooklyn Bridge Winter Solstice Up to 30% off your stay $30 Dining Credit Bamford Wellness Spa treatment discount Flexible cancellation Sleep Brooklyn Bridge Give Green, Get Green Up to 40% off your stay & $30 hotel credit Sleep Brooklyn Bridge 1 Right Way To Start The Day Fuel your day with a $50 breakfast credit Sleep Brooklyn Bridge Sleep Suite Enjoy a $100 Food and Beverage credit Sleep Brooklyn Bridge Starlit Sleepover Children’s tent set up Galaxy Star Projector in-room Freshly baked cookies and milk Family-Friendly Movie and Popcorn & Candy Sleep Brooklyn Bridge Home at 1 Enjoy a $100 food and beverage credit plus a $50 daily breakfast credit Sleep Brooklyn Bridge Relax & Stroll Enjoy hassle-free travel with a Joolz Aer+ Stroller or Carrycot rental during your stay. Sleep Brooklyn Bridge Relax at Bamford Wellness Spa Decompress with a $100 Credit to Bamford Wellness Spa Nature is Home in Brooklyn Bridge Geography Climate Flora Fauna Natural Attractions Sustainability Geography Brooklyn Bridge Park brings 85 acres of rich ecology, verdant vistas, growing trees, and vibrant flora alongside the East River waterfront. Occupying a space that once operated as a bustling transportation terminal, the sustainable park brings a refreshing touch of nature to an industrial-oriented borough brimming with concrete buildings. Close Climate Brooklyn typically experiences cold, wet winters and hot, humid summers. While winters are consistently chilly, spring, summer, and fall can be somewhat unpredictable. Spring and fall weather can flip on a dime with considerable day-to-day variability, while average summer temperatures hover around 75°F (but can push as high as 100°F). It’s a perfect place to witness the vibrant colors and changing temperatures of the passing seasons. Close Flora With over 12,000 species of plants and wildlife and 3,000 trees in the Brooklyn Bridge Park, admire the vibrant native flora such as the New York Aster, Blue Flag Iris, Redbud, Wild Geranium, and so many more. Stroll alongside the gorgeous young River Birch, Redwood, and Sweetbay Magnolia trees and relax on lush lawns—all managed organically through extensive irrigation systems. We’re proud to contribute to the park’s irrigation practices through our rainwater collection system at 1 Hotel Brooklyn Bridge. Close Fauna Brooklyn Bridge Park is home to spectacular pollinators and diverse woodland fauna—from butterflies, bees, and birds to squirrels, opossums, and bats. You might be surprised to find that animals such as crabs, seahorses, shrimp, and jellyfish live in the East River as incredible birds such as Blue Herons, Egrets, Cormorants, and American Oystercatchers fly above it. Estuary experts name Brooklyn Bridge Park a bird watcher's paradise. Close Natural Attractions In addition to Brooklyn Bridge Park and the East River, explore the natural beauty of Brooklyn at Prospect Park, Brighton Beach, and Botanic Gardens. With over 500 acres, Prospect Park is home to countless bird and tree species—particularly stunning in autumn. Brighton Beach offers a change of scenery with plenty of room to swim and sunbathe while the Brooklyn Botanic Garden boasts a lush oasis of native flora and fauna, a Japanese Garden pond, and so much more. Close Sustainability Brooklyn’s sustainability efforts continue to bloom. As the Brooklyn Bridge Park occupies an old trade terminal and the Brooklyn Botanical Garden gives new life to a marshy wasteland—the borough has been building sustainable spaces for decades. Brooklynites are particularly proud of the area’s sustainable irrigation systems, pesticide-free lawns, and growing sustainability initiatives—gathering beekeepers, builders, and passionate community members to transform underused brownfields, lots, roofs, and beyond into luscious green spaces that will be sustainably and lovingly maintained for years to come. Close Your Favorite Moments @1hotel.bklynbridge #1hotelbrooklynbridge https://www.instagram.com/1hotel.bklynbridge/ https://www.tiktok.com/@1hotels?lang=en https://www.facebook.com/1HotelBrooklynBridge/ Photo by: jatecheshul, Captions reads: Spicy crew right here 🌶️ jatecheshul Photo by: jatecheshul, Captions reads: Spicy crew right here 🌶️ jatecheshul Photo by: jatecheshul, Captions reads: Spicy crew right here 🌶️ jatecheshul Photo by: josemelgarejo.us, Captions reads: 📸🎥🎞️ Shooting CINEMATIC ENGAGEMENTS is part planning and part flow. 👇 🫶🏽A ton of work to bring a great concept to life and to get all three of us — myself the photographer my couple emotionally on board with what we’re about to create. 🌉Here’s a few snapshots of the engagement session we brought to life at the 1hotel.bklynbridge in the heart of DUMBO BROOKLYN. I may share more from this shoot, but here’s a preview with some shots I’m truly proud of. 🤓I used an adapted camera with a special lens to get some of these effects as well as my own presets based on vintage film stock. Incredibly empowering to see a concept and vision come together. 🌅📸 🛑Choose your adventure - the next post should be : josemelgarejo.us Photo by: quintessentially, Captions reads: Seven family-friendly stays in the city that never sleeps ⬇️ 🛎️ Park Hyatt New York, Midtown 🛎️ The Plaza Hotel, Fifth Avenue 🛎️ The Whitby Hotel, Midtown 🛎️ The Ritz-Carlton New York, NoMad 🛎️ 1 Hotel Brooklyn Bridge, Brooklyn 🛎️ The Peninsula New York, Midtown 🛎️ Four Seasons Hotel New York Downtown, Downtown Tap the link in bio to find out more. 📸 1hotel.bklynbridge | theplazahotel | firmdale_hotels | ritzcarltonnewyorknomad #newyork #nyc #usa #familyfriendly #familytravel #hotels #besthotels #luxury #lifestyle #lifestyleconcierge #concierge #membership #noted #quintessentially #quintessentiallytravel quintessentially Photo by: saritafv, Captions reads: RECOMENDACIÓN DE VIERNES: harrietsbk Ya lo había enseñado alguna vez, pero, desde luego, este rooftop es una pasada. Está situado en el 1hotel.bklynbridge (sería un sueño poder pasar una noche en una habitación con esas vistas 😍) justo al lado de la piscina. No es un rooftop de los más baratos en cuanto a precio de bebida / comidas pero si queréis pasar una tarde/noche especial, merece la pena. Ya sabéis, guardad el post y si vais, ¡quiero verlo! 📍harrietsbk at 1hotel.bklynbridge Day 25 #100dayprojectALLinNYC #ny #brooklyn #brooklynbridge #newyork #ig_nycity saritafv Photo by: hellofatmata, Captions reads: Day 27 of 30: Embracing my blonde moments!😍✨ In this countdown, I've