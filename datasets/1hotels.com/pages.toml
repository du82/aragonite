["https://1hotels.com/sustainability"]
title = "Sustainability at 1 Hotels"
description = "Our hotels serve as a tribute to our gracious host, the natural world. We are committed to uplifting the planet, people, and places that sustain our operations."
full_description = "Sustainability We think you’ll agree, our planet has been hugely generous for hosting us in the first place. So, we’re committed to protecting it. We design our spaces and places to preserve the natural environment and culture of the setting—and do all the good we can along the way. Our Highlights LEED Certified All 1 Hotels are minimum LEED or BREEAM certified or certification is underway. Supporting Causes That Matter We've donated to various charitable partners, including Housing Works, Oceanic Global, and the NRDC. CO2 Offsets To date we've offset 46,612 TONS of CO2. Our Pillars Environment Protecting Our 1 World Learn More People & Equity Supporting Our People & Communities Learn More Prosperity Growing Mindfully & Transparently Learn More In Practice Embracing Local Flavors We source our food and design our menus with sustainability top-of-mind. We consider it our responsibility - both to our guests and to the destinations that host our hotels - to serve local, seasonal, fresh ingredients. Our sustainable and humane food practices regenerate the land, mitigate climate change, support local farming, and nurture healthy living. Learn More Inspiring Positive Change We launched the Certified Sustainable Gatherings program to create memorable events with minimal environmental impact. By integrating our sustainability standards, we unite hosts, vendors, and guests around nurturing the planet. Each event aims to eliminate single-use plastics and divert at least 90% of waste. Through diligent planning and sustainable solutions, we uphold our commitment to Planet, People, and Prosperity. Learn More Celebrating nature and the spirit of adventure Our Messages capsule collection is ethically and sustainably made in Los Angeles, featuring plush sweatshirts, hoodies, t-shirts, onesies, and shorts in nature-inspired colors. Designed to connect you with the natural world, each piece in the collection embodies a powerful message: I am at 1 with the earth. I am at 1 with the sky. I am at 1 with nature. I am at 1. Learn More Paving the Way to Environmental Harmony Our aim is to work in harmony with the natural environment - not around or against it. Through the use of energy tracking smart technologies at all SH properties, we're able to measure our progress, identify opportunities for improvement, and share our findings to spark positive change in the industry. Learn More Moving Towards Zero Waste Together with our partners at Foodprint Group, we're on a mission to achieve at least 90% waste diversion from landfills and incinerators. So far, we've successfully diverted over 1,181 tons of waste from landfills, saving over 2,205 metric tons of carbon dioxide from entering the atmosphere - the equivalent of removing 491 cars from the road for one full year. Learn More Nourishing Communities So far, our partnership with Copia has allowed us to donate over 19,000 pounds of food and serve over 14,000 meals to some of the most vulnerable members of our communities through local nonprofits such as Nashville Rescue Mission, Toronto’s Good Shepherd Ministries, and The Salvation Army ARC Miami. Copia has also helped us divert over 16,000 pounds of CO2 equivalent and save over 1.2 million gallons of water. Learn More DRIVING SUSTAINABLY FORWARD We’re always seeking innovative ways to show you how to live more sustainably. With this in mind, we’re pleased to introduce the Official Electric Vehicle of 1 Hotels, the fully electric Audi e‑tron lineup. Guests are welcome to enjoy the Audi Experience while taking advantage of the house car or test driving the e‑tron during your stay. Learn More tagline Sanctuary Stories 1 Hotel Brooklyn Bridge Take a seat that tells a story. Much of the furniture in our sanctuary is constructed with reclaimed wood from Brooklyn’s old Domino Sugar Factory. Learn More tagline Sanctuary Stories 1 Hotel Central Park 36,000 ivy plants blanket our urban sanctuary, each working to produce oxygen, absorb greenhouse gasses, reduce surface temperatures in the summer, and insulate in the winter. Learn More tagline Sanctuary Stories 1 Hotel Hanalei Bay Throughout our island oasis, you'll find 144.6 tons of salvaged materials turned into furniture and sustainable art pieces that pay homage to their surroundings. Learn More tagline Sanctuary Stories 1 Hotel Mayfair Connect with the past while enjoying the present as our dry stone walls in the reception and signature bar are formed from reclaimed stone walls in Yorkshire, brought down from the north of England and built by hand using traditional techniques. tagline Sanctuary Stories 1 Hotel Nashville You’ll find over 56,000 individual plants in our ivy façade, capturing CO2, filtering airborne particulates, absorbing heat from sidewalks, and generating fresh oxygen. Learn More tagline Sanctuary Stories 1 Hotel San Francisco Our lobby flooring is composed of 7,000 square feet of reclaimed barn wood, with our elevator landings reclaimed from the old Bay Bridge. This design detail allowed us to divert landfill waste, cut carbon emissions, and prevent the harvesting of virgin wood. tagline Sanctuary Stories 1 Hotel & Homes South Beach Throughout our sanctuary, we’ve rescued and repurposed 7,000 square feet of hardwood from boardwalks and pool decks to offset the purchasing and shipping footprints of new materials. Learn More tagline Sanctuary Stories 1 Hotel Toronto Local woodworking studio Just Be Woodsy transformed fallen Toronto trees into over 1,000 pieces of hand-crafted, one-of-a-kind furnishings throughout our urban sanctuary. Learn More tagline Sanctuary Stories 1 Hotel West Hollywood The carpets throughout our Southern California sanctuary are made of recycled materials including ocean plastics, helping to divert unnecessary waste from oceans and landfills. Partnering for the planet Audi We are driving sustainably forward with the official electric vehicle of 1 Hotels, the fully electric Audi e-tron lineup. Enjoy the Audi Experience and take advantage of a chauffeured ride or test-drive at your own pace during your stay. Either way, enjoy the electrifying exploration. Learn More Copia Copia is dedicated to eliminating food waste and hunger by connecting businesses with excess food to communities in need. We've partnered with Copia to ensure that surplus food from our hotels is redistributed to local nonprofits, helping to feed those who need it most while reducing food waste and its environmental impact. Foodprint Group Foodprint Group drives Zero Waste performance in the hospitality sector with their tried and tested methodology, over 60 resources, and their daily waste tracking app, Foodprint Trax®. Housing Works Housing Works is a healing community of people living with and affected by HIV/AIDS with a mission to end the dual crises of homelessness and AIDS. We've partnered for our 1 Less Thing initiative, where we ask guests to leave behind gently used clothing that's donated to Housing Works to distribute to those in need. Legend Energy Advisors Legend Energy Advisors supports us in our pursuit of being the world’s most sustainable hospitality company. We work together to install connected devices throughout our energy and water infrastructure and actively monitor resource consumption. Our infrastructure retrofits and upgrades save energy, water, gas and of course, emissions to make us more climate resilient. NRDC NRDC works to safeguard the earth – its people, its plants and animals, and the natural systems on which all life depends. We've partnered with NRDC for hotel packages with donations, proceeds from t-shirts sales during our 2018 Earth Day Every Day campaign, and as a resource for sharing content with our audiences. Oceanic Global Oceanic Global is an environmental advocacy organization that connects with universal passions of art, music, fashion, hospitality, technology, and more, meeting people where they're already engaged. We've partnered for happy hours, special events, and a year-long film series, “Films for Thought.” PATH Water PATH Water is forging the path to end single-use plastic bottles. PATH Water’s refillable and 100% recyclable aluminum bottled waters are available in all US and Canada sanctuaries. As of 2022, 1 Hotels and PATH Water have saved over 2.5 million bottles from going into oceans and landfills. Fully Electric Audi Adventures Through London’s Storied Streets Explore the iconic sights and hidden corners of London with a thoughtfully curated journey in our... Continue Reading Fully Electric Audi Adventures Through London’s Storied Streets Honoring Black History Through Nature & Craft Get to know some of the talented and dynamic BIPOC partners across our sanctuaries as they share... Continue Reading Honoring Black History Through Nature & Craft The Art of Seasonality: Chef Josh Bosen’s Inspired Approach to Melbourne Dining Discover how Chef Josh Bosen plans to redefine dining at 1 Hotel Melbourne, blending creativity... Continue Reading The Art of Seasonality: Chef Josh Bosen’s Inspired Approach to Melbourne Dining Rethink Your Drink: Lyre’s on the Craft of Alcohol-Free Indulgence Explore the world of non-alcoholic spirits, embrace mindful drinking, and enjoy a sustainable twist... Continue Reading Rethink Your Drink: Lyre’s on the Craft of Alcohol-Free Indulgence New Year, New Horizons: Chef Michael Solomonov’s Tips for Travel, Wellness, and Culinary Adventures in 2025 A Fresh Take on Balance, Flavor, and Exploration for the Year Ahead. Continue Reading New Year, New Horizons: Chef Michael Solomonov’s Tips for Travel, Wellness, and Culinary Adventures in 2025"
