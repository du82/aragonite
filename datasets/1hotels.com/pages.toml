["https://1hotels.com/central-park/do/events/cork-recycling-with-the-reti-center"]
title = "Cork Recycling with the RETI Center - 1 Hotel Central Park"
description = "At 1 Hotel Central Park, we’re proud to partner with the RETI Center to help restore New York City’s 500 miles of coastline. At Jams, we support this initiative by donating all of our wine corks to the RETI Center, helping bring these gardens to life. RETI Center’s BlueBlock Floating Gardens are a step toward re-establishing the city’s aquatic ecosystems. Built from salvaged materials and floating on recycled corks, these modular gardens act as green edges, benefiting both water and land. Easily assembled by volunteers, they represent a simple yet powerful way to reconnect with nature. Together, we’re fostering a more balanced, sustainable future for our waterways."
