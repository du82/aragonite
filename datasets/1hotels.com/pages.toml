, Bridge Studio Suite, and Skyline 1 Bedroom Suite categories. 7 days notice required on reservations for the Riverhouse Suite. GUARANTEED RESERVATION GUARANTEED RESERVATION Reservations must be guaranteed by a major credit card when you book. Blackout dates are subject to their own rules. For security purposes, please provide a valid government or state-issued photo ID at check-in. To cover incidentals, we’ll hold $250/day on your credit card. Know there is a smoking fee of $350/room and $500/suite. EARLY ARRIVAL/LATE DEPARTURE EARLY ARRIVAL/LATE DEPARTURE Check in time is after 4:00 pm and check out time is 12:00 pm. Book an early flight? Want to sleep in? We’ll do our very best to accommodate you – just let us know in advance. If we can’t, we’ll gladly stow your luggage safely and securely, until you’re ready to move on. There is an early departure fee of one night’s stay plus tax. Late check-out fees apply after 12pm. TAXES & FEES TAXES & FEES Standard New York City taxes are applied to all reservations. A daily $45 amenity fee per room, exclusive of tax, is applied at the time of check-in. This fee is separate from your room rate and offers unique amenities including: Audi e-tron house car service Mind and Movement fitness and wellness experiences Nature-inspired programming and events Lobby Farmstand with fresh seasonal fruit Pet beds for our four-legged guests PET POLICY PET POLICY Your pet is welcome here! Just add them to your reservation when you book online, or reach out to us to let us know they'll be joining you. If your room gets dirty, a $250 cleaning fee will be added at the end of your stay. Please familiarize yourself with the house rules. FREQUENTLY ASKED QUESTIONS FREQUENTLY ASKED QUESTIONS Looking for more information about 1 Hotel Brooklyn Bridge? Visit our Frequently Asked Questions page for all of the answers."
