["https://1lumen.com/about"]
title = "About | The 1lumen.com team"
description = "Welcome to 1Lumen.com The #1 flashlight review site on the internet. Meet the team behind 1Lumen reviews."
full_description = "About US The active team behind all the awesome reviews Meet the Team Meet the team Marco Gabriel Nick Matthew Rob Andru Follow us: YouTube Facebook Instagram Name: Marco Owner 1Lumen / Reviewer / Flashlight collector About myself: I have been active in the flashlight community since 2009 when I first signed up to Candlepowerforums. 2 years later I joined the clan at BLF (budgetlightforum) where I stayed most of my time. Country: the Netherlands My first real LED flashlight: a 2006 Taskforce Super 1 watt flashlight with Luxeon LED. (direct drive). See the link for the picture. Current favorite flashlight: Depends on the situation. For a large thrower, I like the Acebeam K75. I have an old Fenix LD01 on my keys, that sometimes gets replaced with the MBI HF. Favorite tactical flashlight: Malkoff MDC bodyguard v2. I have the Malkoff in my pocket when I do beam shots at night, in the middle of nowhere. I basically have a flashlight for each occasion. Favorite flashlight brand: I have been very fond of Sunwayman in the past, but they dropped the ball a few years ago. Acebeam and Olight are in the top 3 of my list as of now. Other hobbies: Photography and Eneloop batteries (I’m ChibiM) Gabriel Flashlight enthusiast About myself: I joined BudgetLightForum in 2016 after a very short stint at CPF. I love just about anything and everything that lights up. When I’m not busy illuminating things, you can find me at my day job (a business intelligence and systems analyst). I’m also a full-time family man with a great wife and five energetic kids. Country: United States of America My first LED flashlight: Dorcy Metal Gear model 41-4282, circa 2008. Years later, I got my first “modern” LED flashlight – a Fenix E25 at the advice received from CPF. It’s a nice light, but I knew there had to be more out there, and that’s when I discovered BLF and the rest is history! Current favorite flashlight: This is like choosing a favorite child! My current EDC is a ReyLight Ti LAN with a sliced LH351D and 10 ice blue trits. When I need more lumens, I reach for my Mateminco MT07 or Wuben TO50R (with custom aux board). If I need a true thrower, I go for my Emisar D1S with a custom 5 amp linear driver and a OLSON White Flat. Favorite flashlight brand: I really like Convoys because the customization options are endless. I also really appreciate Emisar/Noctigon for what Hank has done in terms of compact, high-power, attractive lights at an affordable price. Sofirn/Wurkkos has to be mentioned though because of their interaction with flashlight enthusiasts on BLF and their constant push for redefining what can happen in a budget flashlight. Other hobbies: I’m an outdoorsman and a maker. I enjoy hunting, fishing, and being out in Mother Nature. Around the house, you’ll find me working on electronics, doing 3D design, or tinkering on a car. Gabriel’s latest reviews: Fenix TK30R February 14, 2025 Fenix CL22R January 31, 2025 Speras M4 v2 January 20, 2025 Acebeam EC20 January 8, 2025 Acebeam TAC 2AA December 31, 2024 Acebeam G15 November 8, 2024 Fenix CL27R October 31, 2024 Acebeam L16 V2 September 30, 2024 Olight Perun 3 September 16, 2024 > see all Gabriel’s reviews Nick Collector and modder About myself: I always had a fascination for bright lights growing up so that explains a lot. I dove headfirst into the flashlight hobby in 2017 when I built my first flashlight, a floating lantern I converted to lithium-ion batteries and 100 watt COB LED. After I saw how bright it was, I was hooked. I joined the Candlepower Forum first, then Budgetlightforum a week later in 2019 where I am a regular. I’m a bit of a closet flashoholic, and when I’m not reviewing flashlights, I’m a husband to an amazing wife and dad. My real job is in the medical field as biller, benefit specialist, and credentialing manager. Country: United States My first LED flashlight: Probably a 2 AA Maglite with TerraLux LED conversion or Nebo Redline zoomie with Cree XR-E Current favorite flashlight: Astrolux MF01 Mini, Wildtrail WT90, Cyansky HS6R headlamp or Lumintop FWAA, but I like all flashlights! Favorite flashlight brand: Convoy, Acebeam, Nightwatch. Other hobbies: I love the outdoors, camping, and I’m an avid kayaker. I love hiking, exploring, and any kind of general tinkering. Nick’s latest reviews: FireflyLite E90 Blaze February 19, 2025 Astrolux MF07 February 4, 2025 Nightwatch LW55 February 3, 2025 Nightwatch A54U January 31, 2025 Lumintop GT4695 Pro January 28, 2025 Sofirn SR15 January 27, 2025 Fenix HL45R January 25, 2025 Sofirn HS21 January 10, 2025 Lumintop Rainbow December 13, 2024 > see all Nick’s reviews Rob About myself: In 2020, I was looking for a new bike light and stumbled upon r/flashlight. Oops! Now not only do I have a collection of lights, I’m reviewing them! Country: United States My first LED flashlight: Way back in 2004, I converted an old AA Mini Maglite I had gotten at a thrift store to LED with a Nite-Ize LED/tail cap combo kit. The beam was off center and it only improved the output by a few lumens, but it was a start! Later, around 2007, I got a Nite-Ize (Inova) XS AAA light. It was incredibly green, but it served me well for 10+ years of daily carry. In more modern times, I ended up getting an Emisar D4V2 instead of a new bike light. Current favorite flashlight: That’s a hard question, as there are a lot of “flavors of the week.” If I had to pick only one, I’d still be torn between the Manker E02 II and E03H II! These little lights are just so versatile! Favorite flashlight brand: I’d have to say Emisar, since that was my first modern light. Other hobbies: I like cycling and playing some video games when I get a chance. Rob’s latest reviews: Wurkkos HD01 Pro January 31, 2025 Wurkkos HD01 UV January 30, 2025 Wurkkos HD01 January 29, 2025 Manker E02 III January 27, 2025 Skilhunt EC500 January 22, 2025 Streamlight Wedge XT December 24, 2024 Streamlight Wedge December 17, 2024 Fenix LD45R December 10, 2024 RovyVon E90 November 29, 2024 > see all Rob’s reviews Dave (REMOVED FROM VIEWING ONLINE) Flashlight fiend About myself: I work at a software company but have always had an interest in electronics, mechanics and how things work. I consider humankind’s aim to eradicate the night fascinating, as we’ve had the same quest driving technological advancement for millennia. I’ve been on BudgetLightForum since 2017, asking about different combinations of LEDs and drivers. You’ll also find me on r/flashlight posting things that are definitely not OSHA approved.. Country: United Kingdom My first LED flashlight: my first real flashlight was an AAA sized Thrunite Ti3. I quickly realised I wanted more lumens and got into 18650 cell lights with a Nitecore HC30 headlamp. Current favorite flashlight: give me the most lumens you can in any form factor and I’ll be happy. I also really like pocketable throwers: the ridiculous Manker MC13 with SBT90.2 LED is my favorite, followed by the Lumintop Thor II LEP. Lumens and candela aren’t everything though and my modded Zebralight H53 with a high CRI, 3000K 219B LED is always within arm’s reach Favorite flashlight brand: Imalent and Acebeam because you can never have enough lumens. Other hobbies: As most flashlight enthusiasts, I also like the outdoors, hiking, camping and exploring caves, tunnels, and bunkers. Especially at night, of course. Matthew About myself: Now on the wrong side of 40, I’m a country bod at heart, having grown up on a farm in a small English village for much of my life. On the flip side of this, most of my working career has been in the software industry as a professional software tester and engineer. I’m also a qualified Geologist and have a passion for volcanology. Country: United Kingdom My first LED flashlight: Back in around 2003 I was working in a photographic retail store, that also happened to list some torches on the catalog too. Having already special-ordered in a couple of incan Maglites, I then stumbled across an LED torch called a Primerlight PL-B and promptly ordered it up. It was a 5 LED compact torch running on 3 x AAA with an electronic side switch and a compass in the tailcap. It even included a branded sheath. Comparatively rubbish even back then, but oh so cool… Current favorite flashlight: I’m still searching for that perfect flashlight. Favourites tend to come and go depending on the day of the week. Although oddly if I had to pick one single light out of my collection it would be my hot rodded Maglite MagCharger running a Phillips 5761 incandescent bulb. For an LED light, probably the Maglite XL200, such a cool light despite the PWM and horrid tint. The Astrolux EA01 and Emisar D1 are also top contenders though. Favorite flashlight brand: This is a tough one to answer. I do like and own many Convoy lights, so they would certainly rank up there. But heart often overrules head which would mean that I’m very much a Magaholic at heart! Other hobbies: As I grew up on a farm, I love all things outdoors. Especially off roading. Land Rovers and fast cars are my expensive hobbies. But I love all things Radio Controlled too, especially micro planes. A bit of shooting is fun in the nice weather too, be it clays or airguns. Speras B7 December 12, 2024 Speras WL30-GL November 27, 2024 Brinyte PT16A September 20, 2024 TrustFire Mini X3 May 1, 2024 Manker F14 March 6, 2024 Wurkkos TD01 February 13, 2024 NightSearcher Magnum 3000 January 19, 2024 Wurkkos TS22 December 12, 2023 Cyansky H3 V2 November 22, 2023 > see all Matthew’s reviews Andru About myself: My name is Andru and I am a flashaholic. Oh wait, wrong place – I am a super easy going, fun-loving flashlight nerd, husband and father of four wonderful children. I have been married to my beautiful wife for 21 years now and our four children are ages 12, 14, 17 and 19. During the daytime, my official job title is BIM manager at a local Architectural firm and I am working on my 28th year there. At night is when things really shine, pun intended. I obviously, really love flashlights and anything with a led. Country: United States My first LED flashlight: We always had maglite flashlights around the house growing up but my first LED flashlight was the old classic 501B host that I built with a p60 drop-in. It rocked an cree xml and Nanjg 8xAMC7135 Driver and was brighter than anything around that I had seen at the time. I instantly fell in love with lumens and I wanted all of them. Current favorite flashlight: My current favorite flashlight would have to be my current daily carry, the Noctigon Kr4 with a mix of 2700k and 4500k 519a’s. So much output and the tint is so nice! I am such a flashaholic that I also have to carry something a bit larger as well. I find myself reaching for the Wurrkos TS30s Pro for the size and sbt90.2 output. Favorite flashlight brand: How can I just pick one!? My favorite few brands? I would say Hank’s Emisar and Nocitgons are hard to beat for really fun, useful, interesting lights at a decent price. Convoy and Wurkkos bring a lot to the table nowadays with options and selections so it is hard to narrow down just one. Other hobbies: When I am not modeling buildings or building flashlights, I really enjoy playing disc golf. You may find a beamshot or two from a disc golf course somewhere! I play every chance I get. I also love the outdoors, shooting sports, camping etc. and will use any excuse to get outside and play! Fenix WF25RM February 12, 2025 Astrolux WP5 February 11, 2025 Lumintop GT Nano v3 January 24, 2025 LOOP GEAR SK05 January 15, 2025 Sofirn SD03 January 14, 2025 Astrolux ST06 January 13, 2025 Streamlight TLR-7 HL-X December 30, 2024 Sofirn IF23 Pro December 21, 2024 Streamlight TLR-7 HL-X sub December 14, 2024 > see all Andru’s reviews Would you like to join the 1Lumen team? Want to become a reviewer? You can apply here: https://1lumen.com/reviewer-wanted/ Most have likely encountered similar claims on forums and social media: 1. This flashlight is brighter than X…2. This one out-throws Y…3. This flashlight can sustain its brightness yet, when pressed for evidence, the common excuses are: 1 I saw it with my own eyes…2 I don’t have gear to test it, but I am very confident that…. 3 I just sold it/ gifted it… so I can’t measure it..etc. But…. We are different, at 1LumenWe TEST, COMPARE, and MEASURE!"
