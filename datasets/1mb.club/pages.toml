["http://1mb.club/blog/back-on-sourcehut"]
title = "1MB Club: Back on Sourcehut"
description = "An exclusive membership for web pages weighing less than 1 megabyte."
full_description = '''After roughly a year of hosting both the source code and public-facing website files on NearlyFreeSpeech.net (NFS), I’ve made the switch back to sourcehut. This decision has nothing to do with NFS, since I still use them for my own personal website and a handful of other side projects. The main reason was to simplify the patch, build, and upload process whenever a new memeber gets added to the club. For a brief moment I ported the core source of 1MB Club over to a Forgejo instance but quickly reverted this. Even though the PR-based flow of submitting changes or additions has become common practice across software in general, I still prefer the simplicity of emailing patches through git and tracking updates through mailing lists. Both of these services work flawlessly on sourcehut - hence the switch. Having the ability to auto-publish on git push is really just an added bonus! That’s all I really have to say about this switch over. The club should be running identically as it was on NFS and most users probably wouldn’t have noticed before reading this post! I’ve also updated the submission page with details on how to submit patches or report bugs using sourcehut. I'm extremely grateful for the support from the "Hall of Fame" supporters: adast.dk alessandrocuzzocrea.com alexeystar.com arc-x.org artemislena.eu b0ba.dev cleberg.net danielsada.tech dieses-veganismus.de gtrr.artemislena.eu iosis-labs.com jakobmagnusson.se jamieonkeys.dev kristianscott.co.uk lukealexdavis.co.uk miniskirt.me nicksherman.com simone.org t0.vc tedmagaoay.com willem.com wonger.dev xslendi.xyz zoraster.org If you too would like to support this project and help fund more articles like this one:Become a supporter today → Maintained with ♥ for a performant web Proud supporter of NextDNS and Fathom Feel free to reach out via Mastodon Latest sites via atom.xml // Latest articles via posts.xml'''
