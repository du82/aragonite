["https://1mb.club/blog/they-wont-wait"]
title = "1MB Club: They Won't Wait: A Warning for Slow Websites"
description = "An exclusive membership for web pages weighing less than 1 megabyte."
full_description = "Your website is probably slow. I’m not trying to make you feel bad or dismiss all the hard work you’ve put into your project. Heck, performance might have been a core value of the design. But websites can always be faster. People have become increasingly more impatient over the last decade when it comes to technology, specifically non-native web-based interactions. Users expect your website to load almost instantly or they will leave and try another site, probably one of your competitors. Why should they stick around if your competitors’ websites load half a second faster? Users are tired of being bombarded with tracking scripts, having to download massive component libraries, forced to deal with “accept cookies” prompts, playing a small mini-game of “close those ads!”, and then being subjected to never-ending loading screens. This is not the internet we were promised. If there is only one thing that you learn from this post, hopefully it’s knowing to better value the time and money of your users. It’s a user’s choice to visit your website, so taking advantage of their time is extremely careless. Don’t be arrogant and ignore the cost of data on most mobile plans either. Eating up a chunk of someone’s data just for hitting your website is rage-inducing. That’s how you can lose customers permanently. Imagine going to your local hardware store because you need to buy a new hammer. Once you get to the entrance a woman holds the the door closed and asks you if it’s alright for someone to follow you around the store today. You say no. She then follows up by asking if you accept their hardware store agreement before proceeding inside - you tell her “sure”. She finally opens the door and lets you in. As you walk into the store she quickly stuffs a few advertisements for other local businesses into you hand. “Thanks”, you mutter. Once inside you realize the hardware store is very big and manually looking for a hammer might take a while. You walk up to the front desk to ask where you can find a hammer but notice the cashier is playing with their phone behind the counter. You try to get their attention but they simply raise their hand and shout “Be with you in a minute”. After a short while they get off their phone and finally listen to your question. They then tell you where to find the hammers."
year_published = 2019
