["http://1mb.club/about"]
title = "1MB Club: About 1MB Club"
description = "An exclusive membership for web pages weighing less than 1 megabyte."
full_description = "The internet has become a bloated mess. Massive JavaScript libraries. Countless client-side queries. Overly complex frontend frameworks. But we can make a difference - no matter how small it may seem. 1MB Club is a growing collection of performance-focused web pages found across the internet. All member web pages weigh less than 1 megabyte in page size. Simplicity is a great virtue but it requires hard work to achieve it and education to appreciate it. And to make matters worse: complexity sells better. This project is a one-man operation. My name is Bradley Taunt and I’m a designer/developer with over 12 years experience building on the web. I’m passionate about performance (obviously), accessibility and improving user experience across the internet. Maintained with ♥ for a performant web Proud supporter of NextDNS and Fathom Feel free to reach out via Mastodon Latest sites via atom.xml // Latest articles via posts.xml"
