["https://1mb.club/blog/bidirectional-scrolling"]
title = "1MB Club: Bidirectional Scrolling: Why Not Both?"
description = "An exclusive membership for web pages weighing less than 1 megabyte."
full_description = '''I recently came across Adam Silver’s post about the merits and pitfalls of bidirectional scrolling and found myself conflicted with the design arguments put forth in the article. It’s a very good article overall, and I suggest giving it a read before digging deeper into my post here. The original article argues that displaying page content via horizontal scrolling (and therefore slightly hiding interactive content) creates a few major issues: Having to scroll down and across in a zig zag fashion can be tiresome, especially for people with motor impairments. But I don’t believe these issues create a need to completely remove the horizontal “scrolling” design altogether. You can still implement the See All Items category link, while allowing the horizontal content to load in dynamically. Balance is always key. By loading the row content in piece-by-piece, initial loads for users will be faster and subsequent list items will load quickly as well (since they would limit to a set default - in this case only 4). Below you can find a quick, static version of this concept. Here you can see the horizontal list items, along with their corresponding See All Items links. You’ll have to use your imagination for how new items would load once you each the end of a horizontal row. (I’m too lazy to spend extra time building out that functionality for a hypothetical blog post) I'm extremely grateful for the support from the "Hall of Fame" supporters: adast.dk alessandrocuzzocrea.com alexeystar.com arc-x.org artemislena.eu b0ba.dev cleberg.net danielsada.tech dieses-veganismus.de gtrr.artemislena.eu iosis-labs.com jakobmagnusson.se jamieonkeys.dev kristianscott.co.uk lukealexdavis.co.uk miniskirt.me nicksherman.com simone.org t0.vc tedmagaoay.com willem.com wonger.dev xslendi.xyz zoraster.org If you too would like to support this project and help fund more articles like this one:Become a supporter today → Maintained with ♥ for a performant web Proud supporter of 