full_description = "Editor’s note: My plan is to have this article exist as a “living document”. Corrections and additions will be made whenever it is deemed necessary. Last update: October 26, 2022 That isn’t something you hear very often in the world of web development, especially from a designer. But it’s true - I think HTML tables can be awesome. I believe their poor reputation is ill-deserved. Something I do notice however, whenever I stumble across tables in the wild, is the lack of experimentation or the use of more complex layouts. I’ve mentioned in a previous article on how to properly design responsive tables with minimal CSS, so why not expand even further with more table design “tricks”? In the golden age of the web, developers needed to cobble together some JavaScript in order for table headings to “follow” the user as they scrolled. This was particularly useful for large datasets that took up enormous amounts of vertical space. I find that “child” header columns are often underutilized when trying to display more detailed datasets in HTML tables. They are relatively easy to implement once you wrap your head around “rows” and “columns”. The two HTML parameters that makes the magic happen are rowspan and colspan. We are essentially telling the browser to make the th elements with rowspan parameters taller and those with colspan wider. If that oversimplified explanation seems silly, then the official documentation will suit you better. It is important to remember that the tbody tr elements will outnumber the amount of listed thead tr elements. This is because the header with the child elements is technically “splitting” itself into additional columns. You can see a live example below: Although not the most useful feature, I find that table footer elements are also overlooked for things like subtotals or final values. You can include these just as you would thead or tbody elements: You can see it in action below. Don’t forget - you could always make your tfoot sticky in order to always show your users a subtotal, etc. even when scrolling through the data."
