["http://1mb.club/blog/css-variables"]
title = "1MB Club: CSS Variables"
description = "An exclusive membership for web pages weighing less than 1 megabyte."
full_description = '''The CSS language is becoming even more awesome and powerful everyday. In this quick article I’d like to focus specifically on the “new” CSS variable function that you can start using in your projects right now. We are using the :root selector at the very top of our CSS file in order to call these variables into any elements in the rest of our document. This is normally the safest way to include variables. As for the variables themselves, you declare that they are variables using the -- tags, followed by the variable’s name and it’s property. Pretty simple stuff, right? That’s it! It’s also good to know that CSS variables have pretty decent browser support (who likes IE11 anyway). I’m a pretty big fan of Sass and Stylus, but sometimes it’s refreshing to just use vanilla CSS for certain projects. Most preprocessors have had the ability to use variables and mixins for a while, but I prefer to avoid build scripts when not absolutely necessary. I'm extremely grateful for the support from the "Hall of Fame" supporters: adast.dk alessandrocuzzocrea.com alexeystar.com arc-x.org artemislena.eu b0ba.dev cleberg.net danielsada.tech dieses-veganismus.de gtrr.artemislena.eu iosis-labs.com jakobmagnusson.se jamieonkeys.dev kristianscott.co.uk lukealexdavis.co.uk miniskirt.me nicksherman.com simone.org t0.vc tedmagaoay.com willem.com wonger.dev xslendi.xyz zoraster.org If you too would like to support this project and help fund more articles like this one:Become a supporter today → Maintained with ♥ for a performant web Proud supporter of NextDNS and Fathom Feel free to reach out via Mastodon Latest sites via atom.xml // Latest articles via posts.xml'''
