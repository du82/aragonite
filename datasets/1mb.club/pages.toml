["http://1mb.club/blog/https-redirects"]
title = "1MB Club: Consider Disabling HTTPS Auto Redirects"
description = "An exclusive membership for web pages weighing less than 1 megabyte."
full_description = "If you run your own website or blog, odds are that you have HTTPS auto redirects enabled by default. While not a bad thing from a security standpoint, in many cases it might be overkill and limiting to those with restricted access to updated software (in this case - browsers). In these instances I would strongly suggest disabling those redirects. Don’t bust out the torches and pitchforks just yet. Websites and applications storing data, collecting user information or handling payments should most definitely use only HTTPS to serve all traffic. No one is arguing for a less secure web when it comes to sensitive data. My main issue with HTTPS redirects comes from it’s overuse for simple content consumption (blogs, research papers, video essays etc). Websites that do not collect any user data or process any sensitive information. Applications that do not process payments or collect credit card details. Purely static, non-dynamic websites that only serve up text and media. “But what about sites like https://doesmysiteneedhttps.com?” While this website makes a few valid points, it still relies heavily on “fear tactics” that honestly don’t apply for the vast majority of users. It’s overkill. I won’t re-hash the counter-points brought up by others, but feel free to read through the discussion on Hacker News. Let’s use my own personal blog as an example to compare both HTTPS and HTTP versions based on performance: By using HTTPS my website increases it’s overhead by almost 100%. It should be mentioned that my personal website is also plain text based and tiny. Imagine the impact of a blog article or research paper with significantly more content. I understand that security is important - but so is performance. (And again, no user data is collected or payments processed on my personal blog). “What about SEO?” I hear some of you ask. I’m probably not the best person to answer this since I don’t give a shit about optimizing for search engines. You shouldn’t either. This is part of the reason why search results have become worthless over the past few years. Just make good, accessible content."
year_published = 2022
year_updated = 2022
