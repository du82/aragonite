["https://1mb.club/blog/reflection"]
title = "1MB Club: Two Years and Over 700 Websites Later"
description = "An exclusive membership for web pages weighing less than 1 megabyte."
full_description = '''Although the second “birthday” of the 1MB Club is officially November 19, I couldn’t help by write down some of my thoughts about this project over the past two years. I honestly have nothing but positive things to say and the amount of interest in this silly side project has been wonderful! Let’s take a look at some stats that don’t mean anything of real importance (please note - these figures are based on stats collected at the time of writing): I’m still passionate about making a leaner, more performance-based web. I still get excited seeing another member request pop into my inbox. I love getting to visit those submitted websites and discovering something new on the internet. Something I otherwise would have probably missed. It’s a good reminder how truly massive the size of the internet is. I should also mention that the members who have requested to join have been nothing but nice. It’s been great interacting with so many others who share the same passion for a “smaller” web footprint. My hope is to keep this collection growing for as long as I possibly can. I'm extremely grateful for the support from the "Hall of Fame" supporters: adast.dk alessandrocuzzocrea.com alexeystar.com arc-x.org artemislena.eu b0ba.dev cleberg.net danielsada.tech dieses-veganismus.de gtrr.artemislena.eu iosis-labs.com jakobmagnusson.se jamieonkeys.dev kristianscott.co.uk lukealexdavis.co.uk miniskirt.me nicksherman.com simone.org t0.vc tedmagaoay.com willem.com wonger.dev xslendi.xyz zoraster.org If you too would like to support this project and help fund more articles like this one:Become a supporter today → Maintained with ♥ for a performant web Proud supporter of NextDNS and Fathom Feel free to reach out via Mastodon Latest sites via atom.xml // Latest articles via posts.xml'''
