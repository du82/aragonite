["https://1mb.club/blog/macos-convert-to-html"]
title = "1MB Club: Convert Files to HTML with macOS Automator Quick Actions"
description = "An exclusive membership for web pages weighing less than 1 megabyte."
full_description = "Since a few people have reached out and thanked me for my previous post Batch Converting Images to webp with macOS Automator, I thought I would continue to share more of my own custom Automator Quick Actions. Today’s post will cover the ability to convert any text-based document into pure HTML. I know - there are over 6 billion conversion apps that do this very same thing. But our way of doing it is cooler. Our conversion tool: And it can do all of this for free on your existing macOS system. No apps required. So, enough chit-chat, let’s get started! Unfortunately, setting things up isn’t as simple as clicking a single Install button and calling it a day. But don’t start to panic! I assure you everything we’ll be doing is actually quite easy to breeze through - trust me. Homebrew is a simple package manager for macOS. The beauty of having Homebrew is the flexibility in the future for installing other custom packages. Overall it’s just a nice piece of software to have on your machine. If you have already installed Homebrew in the past, ignore this step and continue down the page. If not, simply open your Terminal and run: Let that finish and you’re done! Also feel free to read more about Homebrew on the official website. Knowledge is power! The package that is going to be doing all the heavy-lifting for us is pandoc. Because we have Homebrew on our machine now, installing this package is as simple as opening our Terminal again and running: Next you’ll want to open the macOS Automator app and create a new “Quick Action” when given the prompt to do so. Once all that is done, simply paste the following in the open text field within the “Run Shell Script” item: Save this new Quick Action (Name is something like “Convert to HTML” to keep things simple). That’s it! Amazing, right? Now it is finally time to see our Quick Action is action! Navigate to any document file in a Finder window and follow along. If everything was set up properly (and depending on the size of the file) you should see your converted HTML file show up right next to your existing document. Time to celebrate!"
