["https://1mb.club/blog/purge"]
title = "1MB Club: Purging the 1MB Club"
description = "An exclusive membership for web pages weighing less than 1 megabyte."
full_description = '''This project has been running for almost 3 years now, and I still enjoy adding more members to the club! The only issue is that I have never been great at ensuring the quality of the members remained consistent. This included removing dead links, sites that now forward to less-than-safe domains, etc. I wrote up a very crude script that checks the status of each existing club member’s URL and flags those that error-out. After running the check I found I could remove over 60 websites that were either dead or broken. Note: If you happen to notice your website has been incorrectly caught in the “purge-crossfire”, then don’t hesitate to shoot me an email letting me know! I’m only human after all. This ruby script is far from perfect but it works well for my own personal workflow. Feel free to steal this and tweak it for your own purposes as you see fit! I have been slacking in terms of web-related content on this blog. My plan is to improve that and I even have a few outlines ready to go. I’ll be sure to keep you all posted when something new is published! I'm extremely grateful for the support from the "Hall of Fame" supporters: adast.dk alessandrocuzzocrea.com alexeystar.com arc-x.org artemislena.eu b0ba.dev cleberg.net danielsada.tech dieses-veganismus.de gtrr.artemislena.eu iosis-labs.com jakobmagnusson.se jamieonkeys.dev kristianscott.co.uk lukealexdavis.co.uk miniskirt.me nicksherman.com simone.org t0.vc tedmagaoay.com willem.com wonger.dev xslendi.xyz zoraster.org If you too would like to support this project and help fund more articles like this one:Become a supporter today → Maintained with ♥ for a performant web Proud supporter of NextDNS and Fathom Feel free to reach out via Mastodon Latest sites via atom.xml // Latest articles via posts.xml'''
