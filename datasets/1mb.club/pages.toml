["https://1mb.club/blog/responsive-tables"]
title = "1MB Club: Making Tables Responsive With Minimal CSS"
description = "An exclusive membership for web pages weighing less than 1 megabyte."
full_description = "Update (Oct 2019): @aardrian wrote a previous post about how changing the display properties on tables can impact screen readers. I highly recommend his excellent article Tables, CSS Display Properties, and ARIA I find that the need to create responsive table layouts pops up far more often than most developers would expect. The gut reaction might to be implement some sort of custom grid-system or pull in a pre-built library. Don’t do this - just use tables and some simple CSS. My recent article, Write HTML Like It’s 1999, received far more attention than I ever expected on HackerNews. With this attention came a few comments mentioning how table elements don’t play nice with mobile devices or that it’s not possible to have a useable layout on smaller screens. This simply isn’t true. Included below are two separate demos showing how to optimize table HTML for mobile devices using only a minimal amount of CSS. These implementations may not be perfect, but they are far superior to injecting a bunch of custom div elements to look like tables. Okay I will admit, this implementation isn’t the greatest but I find it does work well with huge datasets. Simply set a min-width on your parent table element and the browser will just require the user to scroll the contents horizontally. I actually prefer this method because of its simplicity and function. Users on mobile are familiar with scrolling since it is one of the most basic actions required. Seeing a “cut-off” table gives them an instant visual cue that they have the ability to scroll the content. Using something like flexbox tends to work better when you are working with smaller table datasets. All you need to do is add some minor flexbox layout at your targeted mobile screen size. You could keep the table headings and style them the same as the tbody contents, but I find hiding them a little cleaner. That choice is entirely up to your personal preference. You can also decide to add heading span elements inside the main tbody elements like so:"
