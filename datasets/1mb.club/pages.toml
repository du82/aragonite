full_description = "Things are looking a little different around here. In case it wasn’t obvious already, 1MB Club has received a visual overhaul. New pages have also been added to the project website. These include an about page, the new official blog and a more streamlined submission page. My hope is that this makes the project more approachable for those less knowledgeable about web technology. Moving some of my older posts (and also adding new ones) here seemed like a better place for them to call home. I’ll still write on my personal blog, but all web-based articles/tutorials will be posted here instead. This just makes more sense since most web tutorials and experiments require live demos / code examples. My personal website is generated using only plain text files - so that makes rendering demos somewhat difficult. (Not to mention less accessible) Some readers might already recognize the design influence used for this update: the Apache2 Ubuntu Default Page. It’s a small piece of nostalgia since I so frequently saw that page in my earlier days of web development. It just feels like a simpler time of the internet. You might have also noticed that the members are once again listed in order of page size. I had originally placed a simple script on the homepage that would randomize the order on every page visit. This was added in hopes to deter those wishing to simply “game the system” or have their links placed at the very top (because that’s so important?). But changing the order on refresh ended up hurting the fun of exploring the club’s websites. Having things set in a formatted list just makes the experience cleaner. Also, the homepage is now JavaScript free! Anyone can still freely submit their website for membership to the 1MB Club. This resource will always remain completely free and the source code is available on Github. The inclusion of this “Hall of Fame” section on the homepage allows those who wish to support this project to do so. These donations also help fund the creation of new blog posts."
