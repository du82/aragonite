["https://1mb.club/blog/default-html-style-updates"]
title = "1MB Club: Modern Improvements for Default Browser Styles"
description = "An exclusive membership for web pages weighing less than 1 megabyte."
full_description = "This website almost exclusively uses the browser’s (whichever one that might be) default styling to render it’s HTML. I firmly believe, and have stated in a previous post, that the default HTML styling across all browsers is a thing of beauty. “Consistent and boring” is how I tend to refer to default browser styles - and I mean that in a good way. A little extra breathing room for a website’s content never hurts. Browser defaults set the inner content too close to the main window borders, creating mild eye strain to focus on the far edges of the screen when reading. Pair this with a typeface set too small and you’ve got a recipe for disaster (in terms of user experience and accessibility). Luckily for us, adding two basic CSS properties fixes all of our readability woes. All that is required is a simple boost to the existing margin property set on the body element (I personally lean towards a very specific 1.5em) and overriding the default font-size to 18px1: There is one small caveat with setting the font-size across the whole body element: code elements set in monospace. They will stand out larger than the other fonts found in the document (due to variations in different typeface heights, spacing etc.) so we will need to target these elements specifically: Since we’ve mentioned code elements, let’s fix those as well. The existing styling for inline code snippets and larger pre-formatted text sections leave a lot to be desired. They don’t provide any means to wrap their inner content or make use of overflow properties to avoid vertically scrolling on smaller device screens. Sharing code examples becomes quite a pain when your webpage’s flow and layout is broken just by including them. Browsers could fix this easily enough by defaulting to: Barebones styling in current web browsers have no sane defaults2 for system-level dark mode. What a huge letdown. This is where the most “drastic” changes will be implemented with our browser default updates. We will need the browser to change the main background-color, along with resetting both the text and anchor link color for improved accessibility. Browser defaults for anchor link color in “light mode” are blue/purple - so I’ve opted towards using gold, orange and orangered in dark mode respectively:"
year_published = 2021
clearnet = "https://1mb.club/blog/default-html-style-updates"
