description = "Listen now to 2000 AD's award-winning official podcast - the 2000 AD Thrill-Cast!"
full_description = "2000 AD THRILL-CAST PODCAST Listen now to 2000 AD’s award-winning official podcast – the 2000 AD Thrill-Cast! Beamed direct from the Nerve Centre of the Galaxy’s Greatest Comic, every fortnight publicity droid Molch-R brings you the lowdown on the Galaxy’s Greatest Comic, interviewing some of the world’s greatest comics creators, welcoming special guests, giving you exclusive announcements and the chance to win zarjaz prizes – plus so much more! You can subscribe to the Thrill-Cast on iTunes or download on Soundcloud and Podomatic. LISTEN NOW ON Soundcloud Spotify Apple Podcasts YouTube 26th February 2025 Happy birthday, 2000 AD! – In Orbit Every Wednesday Celebrating 48 years of Thrill-power with a broken mic, a bad hat, and a lovely cat – Molch-R & KLO-E are back with another episode of In Orbit Every Wedensday! It’s 48 years since 2000 AD first landed on shelves, so the gruesome twosome discuss when they first started reading The Galaxy’s Greatest Comic, when […] More… 19th February 2025 A Valentine to Judge Dredd?! – In Orbit Every Wednesday Valentine’s Day may have passed, but love is in the air on the latest In Orbit Every Wednesday as Molch-R & KLO-E delve into 2000 AD Prog 2420 and Judge Dredd Megazine #477 and talk Devlin Waugh, Judge Dredd, romance, love and s*x in the Big Meg. Hosted by 2000 AD Brand Manager Michael ‘Molch-R’ […] More… 12th February 2025 What are the best Judge Dredd horror stories? – In Orbit Every Wednesday Putting the dread into Judge Dredd – this week on In Orbit Every Wednesday we’re talking horror with our special guest – artist on Judge Dredd: The Shift, Nick Percival! He talks to Molch-R and KLO-E about his new Judge Dredd story with writer Ken Niemand, why Dredd works with horror, and what the best […] More… 8th February 2025 NEW PODCAST SHOW: The Best Comic You’re Not Reading? This is 2000 AD: The Deep Dive! BRAND NEW SHOW! Every month, Steve Morris is joined by a guest – critic, academic, creator, fan – to discuss a series or character from the archives of 2000 AD, exploring the characters and story, uncovering its context, and finding out what makes it tick. This month, Steve is joined by journalist, critic and podcaster […] More… 5th February 2025 Who are 2000 AD’s most underrated? – In Orbit Every Wednesday Which 2000 AD creators don’t get their due? On the latest episode of In Orbit Every Wednesday, Molch-R & KLO–E discuss their picks for who they think deserves more of the limelight in the history of the Galaxy’s Greatest Comic. Hosted by 2000 AD Brand Manager Michael ‘Molch-R’ Molcher and comics critic and creator of […] More… 29th January 2025 What are Judge Dredd’s most villainous moments? – In Orbit Every Wednesday What are Judge Dredd’s most villainous moments? When’s the Lawman of the Future been the biggest ****? Writer Rob Williams is our special guest on the latest episode of In Orbit Every Wednesday – the NEW weekly podcast from 2000 AD. Molch-R and KLO-E host the co-writer of Judge Dredd: A Better World, the critically-acclaimed […] More… 22nd January 2025 The *hottest* 2000 AD characters? – In Orbit Every Wednesday Who’s the hottest 2000 AD character? Which dystopian anti-hero or cloned sci-fi warrior gets your blood running? On the second episode of In Orbit Every Wednesday – the NEW weekly podcast from 2000 AD – Molch-R gets KLO-E to list her fav hotties from the Galaxy’s Greatest Comic, but only after they’ve dissected this week’s […] More… 15th January 2025 Brand new weekly comics show – this is ‘In Orbit Every Wednesday’! In Orbit Every Wednesday is the new weekly comics show from 2000 AD! What’s in store from the new show? What’s the best strip in the latest issue of 2000 AD? Why is John Wagner the GOAT? And who’s got the best haircut? Hosted by 2000 AD Brand Manager Michael ‘Molch-R’ Molcher and comics critic […] More… 18th December 2024 Best of the Year 2024! – The 2000 AD Thrill-Cast So that was 2024 – but what were some of the highlights of the past 12 Thrill-powered months? Molch-R and KLO-E are joined by critic and journalist Sam Thielman as they pick their favourites from 2000 AD and the Treasury of British Comics this year, as well as a top pick from beyond the House […] More… 27th November 2024 Could YOU survive in the Cursed Earth? – The 2000 AD Thrill-Cast Acid rain that will strip skin from bone! Killer viruses that strike without warning! Marauding bands of mutants! Herds of hungry dinosaurs! Could YOU survive the irradiated wasteland outside the walls of Mega-City One? That’s the question on the lips of the 2000 AD Thrill-Cast’s Steve Morris and his special guest, Brad Gullickson from the podcast […] More… 13th November 2024 A shark more deadly than Jaws? – The 2000 AD Thrill-Cast We’re gonna need a bigger boat! With the third issue of Battle Action out now, on the latest episode of the 2000 AD Thrill-Cast Molch-R talks to writer Steve White and artist John McCrea about their one-shot story featuring the infamous shark from the pages of Action. Hook Jaw is the murderous great white shark, […] More… 30th October 2024 The Best Horror Comics for Halloween – The 2000 AD Thrill-Cast The moon is high, the mists are settling, and the season for spine-chilling stories is upon us! We’re getting in the Halloween mood on the latest episode of the 2000 AD Thrill-Cast, as Molch-R and special guest Rosie Knight discuss the horrific, the monstrous, and the terrifying (and we’re not talking about Molch-R’s beard!), giving […] More… window.excludeIds = [77669,77592,77510,77494,77474,77384,77288,77232,77088,76812,76677,76474]; 16th October 2024 Love manga? Check out this 2000 AD series! – The 2000 AD Thrill-Cast Love manga? Then you need to check out Full Tilt Boogie – planet-conquering, prince-rescuing, and ramen-eating all-ages space opera! On the latest episode of The 2000 AD Thrill-Cast, PR droid Steve is joined by Lisa Gullickson from the Comic Book Couples Counseling podcast to take a deep dive into Alex de Campi and Eduardo Ocaña’s […] More… 2nd October 2024 Where to start with 2000 AD – The 2000 AD Thrill-Cast It’s the Galaxy’s Greatest Comic, but where’s the best place to start reading 2000 AD? Fear not, Earthlets – Molch-R and KLO-E are here with their recommendations for graphic novel collections to pick up in print and on the new 2000 AD app, from the best way to get into Judge Dredd to folk horror, […] More… 16th September 2024 Simon Bisley & Kevin Eastman on HEAVY METAL magazine – The 2000 AD Thrill-Cast 2000 AD welcomed two giants of the comics world to a panel at San Diego Comic Con this year – Sláine and Lobo artist Simon Bisley, and Teenage Mutant Ninja Turtles creator Kevin Eastman – to discuss one of the most famous comics of all time,. Heavy Metal. Kevin was Heavy Metal’s owner/publisher for more […] More… 2nd September 2024 Gail Simone, Ram V & Abigail Harding on HORROR! and ROMANCE! at SDCC – The 2000 AD Thrill-Cast Horror! Romance! At San Diego Comic Con, Gail Simone, Ram V & Abz Harding headed up a fantastic panel exploring the worlds of 2000 AD‘s incredible new genre anthologies Misty and Roxy: from reviving classic scares to kickstarting spicy stories of love and intrigue! Get the Misty collection >> Roxy late pledges on Kickstarter coming […] More… 19th August 2024 Simon Bisley, Gail Simone & Hayden Sherman on The 2000 AD San Diego panel – The 2000 AD Thrill-Cast It’s San Diego Comic Con – and the 2000 AD panel is CHOCK full of top talent! Listen to Gail Simone, Simon Bisley, and Hayden Sherman as they talk to Molch-R at SDCC about Thrills past, present, and future! Please be aware that audio quality is variable due to the live nature of the panel. […] More… 5th August 2024 Why was Steve Dillon one of the greatest artists of all time? – The 2000 AD Thrill-Cast When Steve Dillon passed away unexpectedly in 2016, comics lost one of its greatest talents. This episode, marking the release of The 2000 AD Art of Steve Dillon Apex Edition, we discuss his legacy and talk to those keeping his memory alive. Tanya Celine is Steve’s daughter-in-law and organises The Steve Dillon Exhibition. Since its […] More… 22nd July 2024 “I want to write Misty forever” – Gail Simone on The 2000 AD Thrill-Cast Comics megastar Gail Simone joins us on The 2000 AD Thrill-Cast to chat about her revival of the legendary Misty, the late ’70s horror comic aimed at girls. With the new anthology special out now, Gail and host Steve Morris discuss how and why horror comics work and Gail’s obsession with British pubs, among much […] More… 8th July 2024 Al Ewing & Boo talk zombies and sports comics! – The 2000 AD Thrill-Cast It’s the monster mash-up! The 2000 AD Sci-Fi Special is out now and packed with action-packed mash-ups of your favourite 2000 AD series, from Judge Alpha to Rogue/Dog! On this episode of The 2000 AD Thrill-Cast, we talk to writer Al Ewing and artist Boo Cook about jamming together two Thrill-powered classics: Harlem Heroes and Zombo! The gang also delve into […] More… 24th June 2024 John Higgins: “Dredd is still my #1 character” – The 2000 AD Thrill-Cast From drawing dead bodies to colouring two of the biggest graphic novels of all time, the artistic career of John Higgins can only be described as unique. Even after decades in the industry, the 2000 AD great is still hard at work – with the second book of Judge Dredd prequel series ‘Dreadnoughts’ underway, John talks […] More… 10th June 2024 From driving buses to drawing Dredd: Dan Cornwell speaks – The 2000 AD Thrill-Cast One minute he’s driving a bus, the next he’s getting an email from Judge Dredd co-creator John Wagner – on this episode we talk to artist Dan Cornwell! From self-published sci-fi sports strip Rok of the Reds (coming to the Judge Dredd Megazine soon!) to Judge Dredd and Spector, Dan has quickly cemented his reputation […] More… 27th May 2024 Noir, A.I. and scars: the Armitage & DeMarco creators speak – The 2000 AD Thrill-Cast We’re talking a*******s and d***s on this episode of The 2000 AD Thrill-Cast – grumpy cops and private eyes, that is! The Thrill-Cast team talk to current Armitage writer Liam Johnson and the DeMarco P.I. creative team of writer Laura Bailey and artist Rob Richardson about the grimmer side of investigation in Judge Dredd’s world, […] More… 13th May 2024 Michael Carroll on writing space opera & dystopian cops – The 2000 AD Thrill-Cast From the means streets to far space, writer Michael Carroll has his feet in different 2000 AD worlds with his current work – with one series returning after a long hiatus and another drawing to a close. The new series of Dreadnoughts begins in Judge Dredd Megazine #468 this month. While the new Justice Department […] More… window.excludeIds = [77669,77592,77510,77494,77474,77384,77288,77232,77088,76812,76677,76474,76320,76069,75923,75714,75437,75343,75231,74955,74689,74337,74041,73860]; 29th April 2024 “I like to play with words”: Dan Abnett on 2000 AD, Warhammer, and more – The 2000 AD Thrill-Cast “Prolific” doesn’t really seem to cover the career of writer Dan Abnett – from decades of writing for 2000 AD to his prominent work for Marvel UK, Marvel and DC, and bestselling novels for the Warhammer 40K universe, his career has been marked by both quantity and quality. Dan returns to the The 2000 AD […] More… 15th April 2024 Was this the CREEPIEST comic ever? – The 2000 AD Thrill-Cast This episode is not for the nervous! At least that’s what Ghastly McNasty, the editor of Scream! might claim! With a brand new hardcover collection publishing all the stories from the 1980s horror comic in order out in May, the Thrill-Cast talkes to its editor Ian Rimmer, sub-editor and writer Simon Furman, and SFX editor […] More… 1st April 2024 “I feel like a son of 2000 AD” – Liam Sharp on the 2000 AD Thrill-Cast From “gifted child” to million-selling comic artist, Liam Sharp’s artistic journey has been one of high hopes and hard work. Beginning his career as an apprentice of legendary The Rise & Fall of The Trigan Empire artist Don Lawrence, Sharp went on to debut at 2000 AD while still in his teens and co-create the precocious homocidal teenager PJ […] More… 18th March 2024 A Tribute to John M Burns – The 2000 AD Thrill-Cast At the very end of 2023, the legendary artist John M Burns sadly passed away. While well known amongst 2000 AD fans for his extensive work on stories including Judge Dredd, The Order, and Nikolai Dante, Burns’ career spanned six decades and endeared him to generations of readers thanks to enthralling and enchanting work on TV tie-ins such as Champion […] More… 4th March 2024 Simon Harrison on Bradley, Revere & beyond – The 2000 AD Thrill-Cast 2000 AD has had more than its fair share of artists whose work can be described as “unique” – but few match the distinctive individuality of Simon Harrison. From his first work on the demonicly badly-behaved alien infant Bradley to the lead up to the most iconic moment in Strontium Dog and the fever dream […] More… 19th February 2024 Defund Judge Dredd! And top tips for 2000 AD newbies – The 2000 AD Thrill-Cast The official 2000 AD podcast is back! We switched Molch-R on and off again, and it did the trick – the Thrill-Cast again takes you behind-the-scenes on the Galaxy’s Greatest Comics! We launch the first episode of 2024 with a special chat for readers new or unfamiliar to 2000 AD – newly minted droid Steve […] More… 27th September 2023 R.I.P. Judge Hershey – The 2000 AD Thrill-Cast LISTENER ADVISORY: STRONG LANGUAGE The 2000 AD Thrill-Cast is back to mark the passing of a legend – as Judge Barbara Hershey comes to the end of her days bringing law to the lawless! With the final episode of Hershey: ‘The Cold In The Bones’ in 2000 AD Prog 2349 still fresh in the memory […] More… 1st March 2023 Did Judge Dredd Predict Our Future – The 2000 AD Thrill-Cast It’s the galaxy’s greatest podcast – The 2000 AD Thrill-Cast brings you more from the worlds of 2000 AD! Did Judge Dredd predict the future? In a startling turn of events, Molch-R goes from interviewer to interviewee as journalist Graeme McMillan grills him about his new book, ‘I Am The Law’, which is out now. […] More… 10th February 2023 Lockwood & Co.’s Jonathan Stroud on comics, TV & more – The 2000 AD Thrill-Cast Lockwood & Co. is the hit new show on Netflix – and eagle-eyed viewers will have spotted plenty of references to the Galaxy’s Greatest Comic. The 2000 AD Thrill-Cast talks to author Jonathan Stroud about childhood reading, the influence of comics on his writing, and seeing his characters come to life on the screen. You […] More… 21st December 2022 A Tribute to Alan Grant – The 2000 AD Thrill-Cast The official 2000 AD podcast finally returns with a special pre-Christmas episode paying tribute to writer Alan Grant, who passed away in July this year. In a discussion recorded at New York Comic Con, writer Garth Ennis, editor Dan Raspler, and comics critic Chloe Maveal discuss the impact and legacy of Grant’s work, before E"
