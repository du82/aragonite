["https://2000ad.com/news/out-now-judge-dredd-megazine-477"]
title = "OUT NOW: Judge Dredd Megazine #477 | 2000 AD"
description = "Judge Dredd Megazine #477 is OUT NOW! Two in-house designers that played an integral part in the development of The Galaxy’s Greatest Comic in different eras come under the spotlight this month. First up, former 2000 AD art editor Robin Smith reveals his role in sketching out the ideas that would become some of the […]"
full_description = "Comics OUT NOW: Judge Dredd Megazine #477 19th February 2025 Judge Dredd Megazine #477 out nowBuy nowPrint editionDigital editionNorth AmericaSubscribe nowFind your local stockistFind your local comic storeGet the cover printDownload the appOr ask at your local newsagent, comic shop, or bookshop Judge Dredd Megazine #477 is OUT NOW! Two in-house designers that played an integral part in the development of The Galaxy’s Greatest Comic in different eras come under the spotlight this month. First up, former 2000 AD art editor Robin Smith reveals his role in sketching out the ideas that would become some of the anthology’s most acclaimed and iconic covers as new book Cover Story: The Design Art of Robin Smith collects his numerous design briefs alongside the final versions for a fascinating glimpse behind the scenes of the Nerve Centre in the late 1970s/early 1980s. Meanwhile, at the other end of the eighties, the prog was to undergo a revamp, and newcomer Steve Cook was tasked with giving the logo and typography an update. Here he chats with Karl Stock about his career, working not just for Tharg but Marvel UK and Sindy too! Elsewhere, there’s a new case for Dredd in Messiah Complex by Ian Edginton and Paul McCaffrey, Cadet Rico’s The Cycle comes to a close, and we reach the penultimate parts of Devlin Waugh, Fargo & McBane and Riley’s Rebels – be here in thirty for their finales, as well as the start of an all-new Atomfall tie-in series! Judge Dredd Megazine #477 is out now from all good newsagents and comic book stores, plus digitally from our webshop and apps! Don’t forget that if you buy an issue of the Megazine in the first month of its release then postage in the UK is free! SUBSCRIBE NOW >> DOWNLOAD THE APP >> Cover Art: Cliff Robinson with Dylan Teague Script: Ian Edginton / Art: Paul McCaffrey / Letters: Annie Parkhouse JUDGE DREDD // MESSIAH COMPLEX, Part One Mega-City One, 2146 AD. This vast urban hell on the east coast of post-apocalyptic North America is home to over 200 million citizens, bordered by the irradiated Cursed Earth to the west and the toxic Black Atlantic to the east. Tensions run a knife-edge and crime is rampant. Stemming the tide of chaos are the Judges. Toughest of them all is Judge Dredd – he is the Law! Script: T.C. Eglington / Art: Boo Cook / Letters: Simon Bowland DEATH CAP // FRONTIER JUSTICE, Part Five The Cursed Earth, 2144 AD. This blasted, irradiated wilderness covers much of what’s left of post-apocalyptic twenty-second century North America. Here, mutants scratch out a meagre existence in ramshackle townships. Former Judge Anita Goya’s family were massacred, and she became infected with a virulent fungus. Now she’s being hunted by Justice Dept… Script: Ken Niemand / Art: Anna Readman / Colours: Quinton Winter / Letters: Annie Parkhouse FARGO & MCBANE // NEW YORK’S FINEST, Part Five New York City, the 1970s. Detective Jack McBane was one of the toughest cops to patrol the metropolis, having no compunction in handing out summary justice upon criminals. Although his ruthless attitude wins him few friends, he has one in Officer Eartha Fargo, who worked with him in NYC before moving out to Jaxville with her family. Now they’ve reunited… Script: Ales Kot / Art: PJ Holden / Colours: Jack Davies / Letters: Jim Campbell DEVLIN WAUGH // TWO MONTHS OFF, Part Five Brit-Cit, 2146 AD. A freelance paranormal troubleshooter and exorcist for the Vatican, Devlin Waugh is the world’s foremost supernatural investigator. Despite becoming a vampire after getting bitten tackling an outbreak in an underwater prison, Devlin continues to enjoy the finer things in life. Now, he’s on holiday with three friends, but things have turned weird… Script: John Wagner / Art: Dan Cornwell / Colours: Abigail Bulmer / Letters: Jim Campbell ROK OF THE REDS // Chapter Two Dangerous intergalactic outlaws and an arrogant footballer collide, on the run after his home world is destroyed, Rok of Arkadi needs a hiding place. And that hiding place happens to be troubled football star Kyle Dixon. A black comedy about revenge, redemption and the ‘beautiful game’. Script: Honor Vincent / Art: Stewart K. Moore / Letters: Simon Bowland RILEY’S REBELS // Part Four The Cursed Earth: an irradiated wasteland covering much of what was once the United States. Inhabited today by mutants, exiles… and lost children. Now, Riley wanders this wilderness, looking for something important… Script: Liam Johnson / Art: Rob Richardson / Letters: Jim Campbell CADET RICO // THE CYCLE, Part Five From the moment he was cloned, Rico has been bred for Justice. Enrolled into the Academy as a child, he and his brother Joe are learning the hard way that it isn’t easy to be the Law in Mega-City One… Script: Dan Abnett / Art: Phil Winslade / Letters: Simon Bowland LAWLESS // A TOWN CALLED BADROCK, Part Five Colonial Marshal Metta Lawson was appointed to the frontier township of Badrock on the planet 43 Rega, intent on stamping her authority on the colony. But in doing so, Lawson made many enemies, including Munce, Inc., the mega-corporation that funded Badrock. Now, with the SJS also running things, Lawson’s recently returned to the force after going undercover… LATEST NEWS 27th February 2025 75% off in the Treasury of British Comics sale 27th February 2025 Buy two 2000 AD hoodies and get a FREE T-shirt! 27th February 2025 NEW merch: the ’80s classic Halo Jones T-shirt is back, plus new Mean Machine tees & hoodies! 26th February 2025 Pre-order the latest collections from 2000 AD & The Treasury of British Comics! ALL NEWS"
