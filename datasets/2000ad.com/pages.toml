erve the right to charge a reship fee. Every effort is made to obtain accurate product information. We reserve the right to correct any errors in pricing, image, description or any other inaccuracy. We also reserve the right to refuse or cancel any order based on such inaccuracy. If the price at which you ordered the items is incorrect, you have the right to cancel. 2.3 Cancellations and ReturnsIf there is a problem with any item that you receive, please contact us immediately either via the contacts page or by writing to Rebellion Publications, 8 Galliford Road, Maldon, Essex, CM9 4XD UK and we shall replace the item (if possible). Under Consumer Contracts Regulations 2013 you have the right to cancel within 14 working days of the goods being delivered. For digital content downloads you will not have the right to cancel once a download has started. Further cancellation rights are set out below. For subscriptions and any other recurring billing items, this particular right of cancellation only applies to the initial product delivery. 2.4 GeneralYou must be 18 years or over to order from the store. There is no minimum or maximum order unless such is stipulated in a particular promotion, solicitation or advertisement. Ownership and title in the goods does not pass to you until full payment has been received. If a card is declined for any reason we reserve the right to charge any extra costs of collection. Our liability in connection with any order will not exceed the total price charged for the relevant items. 2.5 SubscriptionsRebellion reserves the right to change the pricing of Annual and Monthly subscription products. Rebellion will attempt to contact all current subscribers two months in advance, to give notice of any price changes. The new rates will come into effect for monthly subscribers on their next billing date after the price change date. The new rates will come into effect for annual subscribers on their next annual billing date after the price change date. Should any payment not be successful on the billing date for that subscription, one further attempt will be made 7 days later. Should the subsequent payment fail, the subscription will be suspended. Subscriptions will not be re-instated until all back dues are paid up-to-date. 2.5.1 Annual and Two –Year Subscriptions2.5.1.1 BillingAnnual (since July 2014) and two-year Subscriptions are charged on the 2nd day of the month before the original subscription was purchased, to ensure no issues are missed. By default, billing will automatically renew a subscription after one year (for an annual subscription) or after two years (for a two-year Subscription) for an additional 12 months (for an annual subscription) or for an additional 24 months (for a two-year subscription), unless auto-renew is deactivated or the subscription is cancelled. Annual and two-year subscriptions can be manually renewed up to 5 months early, if desired, through your Subscription Management page. For both current subscription types, on manual renewal either an annual or a two-year Subscription can be chosen. 2.5.1.2 CancellationsAn annual or two-year subscription cannot be cancelled in the first 12 months, except in exceptional circumstances. After the first 12 months, if a subscription is cancelled, the subscriber will be refunded any monies owed after their last issue is received. Subscriptions are processed in advance of publication dates; therefore any cancellation of a subscription needs to be made at least 14 days in advance of a subscriber’s recurring billing date. 2.5.2 Monthly Subscriptions2.5.2.1 BillingMonthly Subscriptions (purchased after 1st March 2014) are continuous and charged on the day of the month the original subscription was purchased, or the nearest working day taking weekends & holidays into consideration. The billing will recur every month, unless and until the subscription is cancelled 2.5.2.2 CancellationsSubscriptions are processed in advance of publication dates, therefore any cancellation of a subscription needs to be made two weeks in advance of a subscribers recurring billing date, otherwise the subscriber will have committed to a following month’s subscription. If the cancellation request is 14 days or more in advance of the recurring billing date, then the subscription will finish at the end of the current billing cycle. If the cancellation request is less than 14 days in advance of the recurring billing date, then cancelling the subscription comes into effect at the end of the next month’s billing cycle. 2.5.3 Exclusive subscriber bonus premium productEach year a bonus premium product is offered exclusively to subscribers. Annual and two-year combi subscribers (i.e. those taking out a subscription to both 2000 AD and the Judge Dredd Magazine) of good standing qualify for one unit of this for free per year. Other subscribers of good standing may purchase a single unit of this product per year. Good Standing in this context means: any new annual or two-year subscriber, or an existing annual subscriber with four months or more to go before renewal, or a renewing annual or two-year subscriber, or any monthly-paying subscriber who has paid for and received copies for a minimum of four continuous months. Rebellion reserve the right to withdraw or amend the free premium subscription offer at their sole discretion. 3. Information on the WebsiteWhilst every effort is made to update the information contained on this website, neither Rebellion nor any third party or data or content provider make any representations or warranties, whether express, implied in law or residual, as to the sequence, accuracy, completeness or reliability of information, opinions, any share price information, research information, data and/or content contained on the website (including but not limited to any information which may be provided by any third party or data or content providers) (“information”) and shall not be bound in any manner by any informat