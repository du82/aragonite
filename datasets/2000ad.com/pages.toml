["https://2000ad.com/news/2000-ad-prog-2420-out-now"]
title = "2000 AD Prog 2420 out now! | 2000 AD"
description = "ATTENTION, EARTHLETS – 2000 AD Prog 2420 is OUT NOW! Call me Tharg The Mighty, all-powerful alien editor at the helm of this awesome anthology! Welcome back, my Thrill-seeking Squaxx, to your seven-day one-stop shop for all that is scrotnig. Inside you’ll find the ghafflebette latest instalments of Judge Dredd: The Shift, Portals & Black […]"
full_description = "Comics 2000 AD Prog 2420 out now! 19th February 2025 PROG 2420 out nowBuy nowPrint DigitalNorth AmericaSubscribe nowFind your nearest stockistFind your local comic storeGet the cover printDownload the appOr ask at your local newsagent or comic shop ATTENTION, EARTHLETS – 2000 AD Prog 2420 is OUT NOW! Call me Tharg The Mighty, all-powerful alien editor at the helm of this awesome anthology! Welcome back, my Thrill-seeking Squaxx, to your seven-day one-stop shop for all that is scrotnig. Inside you’ll find the ghafflebette latest instalments of Judge Dredd: The Shift, Portals & Black Goo, Full Tilt Boogie, Hawk the Slayer and Fiends of the Western Front — another line-up that’s guaranteed to keep your circuits glowing! S upplementing your Thrill-intake this week is Meg 477, which you’ll find hitting newsagent shelves as we speak. Alongside the next chapters of Devlin Waugh, Fargo & McBane, Lawless, Death Cap and Riley’s Rebels, there’s the start of a new Dredd story, Messiah Complex, by Ian Edginton and Paul McCaffrey, and the finale to the Cadet Rico series The Cycle. Plus former 2000 AD designer Steve Cook talks about his career, one-time art editor Robin Smith discusses how his sketches were instrumental in the creation of some of the prog’s most iconic covers as collected in new book Cover Story, and there’s more sci-fi soccer shocks in Rok of the Reds — buy it, humes! 2000 AD Prog 2420 is out now from all good newsagents and comic book stores, plus digitally from our webshop and apps! Don’t forget that if you buy an issue of 2000 AD in the first week of its release then postage in the UK is free! DOWNLOAD THE APP >> SUBSCRIBE NOW >> GET COVER PRINTS >> Cover Art: Tiernen Trevallion Script: Ken Niemand / Art: Nick Percival / Letters: Annie Parkhouse JUDGE DREDD // THE SHIFT, Part Three Mega-City One, 2147 AD. Home to over 250 million citizens, this urban hell is situated along the east coast of post-apocalyptic North America. Crime is rampant and only the Judges — empowered to dispense instant justice — can stop total anarchy. Toughest of them all is JUDGE DREDD — he is the Law! Now, Dredd’s entered a terrifying parallel reality called the Shift, seeking to rescue a young student… Script: Ian Edginton / Art: Tiernen Trevallion / Letters: Jim Campbell FIENDS OF THE WESTERN FRONT // WILDE WEST, Part Eight In 1980, the diary of German soldier Hans Schmitt was discovered in Berlin, detailing events that occurred in 1941, when he encountered the terrifying vampire Captain Constanta and his Romanian platoon. But Schmitt was not the first person to meet Constanta — the vampire has popped up throughout history, in various countries and under various guises, and now he’s in North America in the late nineteenth century… Script: John Tomlinson / Art: Eoin Coveney / Colours: Jim Boswell / Letters: Simon Bowland PORTALS & BLACK GOO // A QUORUM OF FIENDS, Part Eight In the near future, the job market is more perilous than ever and Generation Y must take on any task to make ends meet. Kroy Plemons is a rider for Devouroo — a fooddelivery service for creatures of myth and legend. Devouroo policy is ruthless and Kroy has in the past barely escaped with his life after being given the night shift, when London’s most lethal denizens are hungry. Indeed, there’s unrest across the capital… Script: Alex de Campi / Art: Eduardo Ocana / Colours: Giulia Brusco / Letters: Simon Bowland FULL TILT BOOGIE // BOOK THREE, Part Three Tee — together with her grandmother and cat — is a bounty hunter/hired help, operating from her spaceship the FULL TILT BOOGIE. Tee was paid to rescue the Luxine Prince Ifan from his debtors’ prison. In the process, she encountered a resurrected Anubite warrior, a member of the enemy race with whom the Luxine Empire battled. Now, Tee and her allies must take on the Empress herself, who is once again going to war… Script: Alec Worley / Art: Simon Coleby / Colours: Gary Caldwell / Letters: Annie Parkhouse HAWK THE SLAYER // THE LAST OF HER KIND, Part Eight It is a time of legend. HAWK THE SLAYER defeated his evil brother Voltan some years before, and now he and his compatriots are keeping an eye on the malign spread of the Black Wizards’ influence. Rumours of dark magic abound, and armed with his fabled Mindsword, Hawk must keep the peace. Now he’s entered the city of Valensfort, ruled by the Lady Morlaine, who’s using necromancy to maintain order… LATEST NEWS 27th February 2025 75% off in the Treasury of British Comics sale 27th February 2025 Buy two 2000 AD hoodies and get a FREE T-shirt! 27th February 2025 NEW merch: the ’80s classic Halo Jones T-shirt is back, plus new Mean Machine tees & hoodies! 26th February 2025 Pre-order the latest collections from 2000 AD & The Treasury of British Comics! ALL NEWS"
