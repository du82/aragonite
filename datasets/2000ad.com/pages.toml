["https://2000ad.com/news/new-merch-the-80s-classic-halo-jones-t-shirt-is-back-plus-new-mean-machine-tees-hoodies"]
title = "NEW merch: the '80s classic Halo Jones T-shirt is back, plus new Mean Machine tees & hoodies!"
description = "It’s one of the most iconic 2000 AD T-shirts ever – and, after almost 40 years, the Halo Jones ‘Increased Leisure Citizen’ is back! Head to the Rebellion store now >> Expressing the grim despair of life in The Hoop, the floating housing project off the coast of Manhattan in Alan Moore and Ian Gibson’s […]"
full_description = "Comics NEW merch: the ’80s classic Halo Jones T-shirt is back, plus new Mean Machine tees & hoodies! 27th February 2025 It’s one of the most iconic 2000 AD T-shirts ever – and, after almost 40 years, the Halo Jones ‘Increased Leisure Citizen’ is back! Head to the Rebellion store now >> Expressing the grim despair of life in The Hoop, the floating housing project off the coast of Manhattan in Alan Moore and Ian Gibson’s groundbreaking classic The Ballad of Halo Jones, ‘Increased Leisure Citizen’ is the ironic euphemism for ‘unemployed’ under which Halo and her friends live in the crowded, poverty-stricken 50th Century, where even a shopping trip can lead to death. One of 2000 AD‘s greatest ever serials, Halo Jones is the story of an ordinary, idealistic young woman desperate for a better life who escapes and finds an extraordinary universe waiting for her… This design, long unavailable, is now available on a T-shirt, hoodie, and sweatshirt from the Rebellion webshop, alongside as the classic ‘Hoop Life Hero’ design. And make sure you warn people that there’s a maniac in the room with brand new Mean Machine Angel designs! Born and raised in the Cursed Earth as a member of the notorious Angel gang, ‘Mean Angel’ (AKA Mean Machine) is one of the most dangerous criminals to ever plague Mega-City One – with his mechanical claw and head dial, which amps up his anger and aggression from Mean to Brutal, Mean Angel is a headbutting psychopath with a penchant for destruction! These new designs – with art by Carlos Ezquerra, Carl Critchlow, and Richard Dolan – are available on shirts and hoodies, and mean everyone has fair warning that you’re a certified maniac! Head to the Rebellion store now >> LATEST NEWS 27th February 2025 75% off in the Treasury of British Comics sale 27th February 2025 Buy two 2000 AD hoodies and get a FREE T-shirt! 26th February 2025 Pre-order the latest collections from 2000 AD & The Treasury of British Comics! 26th February 2025 Judge Dredd in 2025: What to Read Next! ALL NEWS"
