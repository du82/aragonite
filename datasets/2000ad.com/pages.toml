["https://2000ad.com/news/2000-ad-covers-uncovered-the-lullaby-lady-sings-you-to-sleep-nick-percival-on-prog-2421"]
title = "2000 AD Covers Uncovered: The Lullaby Lady sings you to sleep – Nick Percival on Prog 2421 | 2000 AD"
description = "Every week, 2000 AD brings you the galaxy’s greatest artwork and 2000 AD Covers Uncovered takes you behind-the-scenes with the headline artists responsible for our top cover art – join bloggers Richard Bruton and Pete Wells as they uncover the greatest covers from 2000 AD! Borag Thungg, Earthlets. Welcome to Covers Uncovered and another journey […]"
full_description = "Comics 2000 AD Covers Uncovered: The Lullaby Lady sings you to sleep – Nick Percival on Prog 2421 26th February 2025 Every week, 2000 AD brings you the galaxy’s greatest artwork and 2000 AD Covers Uncovered takes you behind-the-scenes with the headline artists responsible for our top cover art – join bloggers Richard Bruton and Pete Wells as they uncover the greatest covers from 2000 AD! Borag Thungg, Earthlets. Welcome to Covers Uncovered and another journey into your nightmares as Judge Dredd: The Shift, the new eight-part terror tale of someplace very strange by Ken Niemand and Nick Percival, takes the cover. And it’s unmistakably a Nick Percival cover, as the Lullaby Lady gets into your heads… Get this cover as a print >> Yep, Niemand and Percival have taken Dredd into The Shift, the dark hell dimension full of nightmares and nasties. Here in part 4, Dredd’s carrying on with his rescue mission, battling all the hideous things that inhabit this place – but who’s going to rescue Dredd? It’s everything you’d expect from both Niemand and Percival, who’ve both talked about bringing the horrors back to the world of the Galaxy’s greatest lawman. And there’s no-one better to bring those horrors to the page right now than the Percival droid, who’s having plenty of fun bringing us the vile things to haunt our nightmares. Let’s see what Nick’s got to say about this latest bit of gloriously grotesque work… NICK PERCIVAL: So, we’re hitting the halfway point of Dredd’s eight‑part journey into the Hell that is The Shift. As things now begin to expand and we’re seeing more of the world, I wanted the cover to focus on one of the many horrific and twisted entities that Dredd has to face off against. I originally had a completely different idea (Dredd vs a hoard of beasties)… NICK PERCIVAL: … but when I got the script and read Ken’s description of the Lullaby Lady, I knew she had to take centre stage and be the cover star. She only makes a brief appearance but it’s pretty memorable, I think. [Oh, it is, it really is. If by pretty memorable, Nick actually means nightmare-inducing.] NICK PERCIVAL: Design wise, she owes a lot to Bette Davis in her role from ‘Whatever Happened to Baby Jane’ – that demented look with the heavy makeup and garish appearance… NICK PERCIVAL: I knocked up a very quick loose rough for layout purposes and for Mr. Tharg. The main focus being on the Lullaby Lady and her lovely deformed offspring. I slapped in a hint of Dredd, Lawgiver drawn in the extreme foreground just to define the threat and give it some context and depth. I framed everything with a Dutch angle just to give it a more disjointed feel. NICK PERCIVAL: For the final piece, I had one of my daughters pose for the Lady, since I wanted to get all the main elements spot on and test out various lighting models (same for when we see in the actual episode inside the Prog) I stayed with the same grim, gritty colour palate that I’ve established for the series and just cut loose with it. I really enjoyed working on this one and it was fun to push the boundaries of what we can go for on cover images. Having said that, the cover for Part seven is a pretty dangerous one too… Thanks so much to Nick for sending another truly terrifying cover along. It’s his fault when you’re all getting nightmares this week. You can find 2000 AD Prog 2421 on shelves right now wherever the Galaxy’s Greatest is sold, including the 2000 AD web shop. As for much more from the Percival droid, he’s talked plenty to us over the last few years. For a look into the direction he and Niemand are taking their Dredd tales, we talked to Nick about Judge Dredd: Iron Teeth here. Molch-R and KLO-E have also just talked to Nick on the new In Orbit Every Wednesday podcast here. Going back a little bit more, we had a trio of chats about his work on Dark Judges with David Hine here, here, and here. Plus, there’s an opportunity to see and hear Hine and Percival talk Dark Judges with Molch-R in the 2000 AD Thrill-Cast Lockdown Tapes here. After that, there’s an embaressment of riches when it comes to Nick’s covers work in Covers Uncovered, starting off with his most recent, the wrapround Shift cover from Prog 2418. Then there’s Prog 2247, Prog 2382, Prog 2387, Megazine 425, Megazine 427, Megazine 430, Megazine 433, Megazine 430, Megazine 443, Megazine 448, Megazine 453, Megazine 456, Megazine 458, and Megazine 474. And finally, as is his want, Nick sent over some extras from inside part 4 of The Shift, including the Lullaby Lady. I’d say don’t have nightmares, but that’s just pointless with this level of horror… And now, a little closer look at the Lullaby Lady and her child. Remember, it’s all the Percival droid’s fault when you wake up screaming… LATEST NEWS 27th February 2025 75% off in the Treasury of British Comics sale 27th February 2025 Buy two 2000 AD hoodies and get a FREE T-shirt! 27th February 2025 NEW merch: the ’80s classic Halo Jones T-shirt is back, plus new Mean Machine tees & hoodies! 26th February 2025 Pre-order the latest collections from 2000 AD & The Treasury of British Comics! ALL NEWS"
