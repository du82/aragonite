title = "2000 AD Prog 2421 out now! | 2000 AD"
description = "ATTENTION, EARTHLETS – 2000 AD Prog 2421 is OUT NOW! I am The Mighty Tharg, the Betelgeusian brainiac at the helm of this awesome anthology! Forty-eight years ago I travelled to your planet from my home on Quaxxann to gift to your excitement-deprived species the wonder that is Thrill-power. From my spaceship disguised as the […]"
full_description = "Comics 2000 AD Prog 2421 out now! 26th February 2025 PROG 2421 out nowBuy nowPrint DigitalNorth AmericaSubscribe nowFind your nearest stockistFind your local comic storeGet the cover printDownload the appOr ask at your local newsagent or comic shop ATTENTION, EARTHLETS – 2000 AD Prog 2421 is OUT NOW! I am The Mighty Tharg, the Betelgeusian brainiac at the helm of this awesome anthology! Forty-eight years ago I travelled to your planet from my home on Quaxxann to gift to your excitement-deprived species the wonder that is Thrill-power. From my spaceship disguised as the King’s Reach Tower office block in London, in 1977 my crack legion of creator-droids and I crafted the first issue of the Galaxy’s Greatest Comic, a sci-fi title the likes of which your world had never seen before… Ahh, you know the story by now, my Squaxx. Prog 1, Space Spinner, Invasion!, M.A.C.H. 1, Dan Dare — it’s all entered into legend, of which you’re no doubt very familiar. However, that doesn’t detract from the milestone, which is pretty bloody scrotnig, whichever way you cut it — forty-eight years of uninterrupted weekly zarjazness, pumped into your domiciles and your imaginations via this pulse-pounding publication. Mucho kudos to the writers, artists, letterers, colourists and editorial minions that all bust a rivet to make 2000 AD the ghafflebette read it is — and, of course, thanks to you, Terrans, for sticking with the GGC. Join me and raise a toast to Tooth! 2000 AD Prog 2421 is out now from all good newsagents and comic book stores, plus digitally from our webshop and apps! Don’t forget that if you buy an issue of 2000 AD in the first week of its release then postage in the UK is free! DOWNLOAD THE APP >> SUBSCRIBE NOW >> GET COVER PRINTS >> Cover Art: Nick Percival Script: Ken Niemand / Art: Nick Percival / Letters: Annie Parkhouse JUDGE DREDD // THE SHIFT, Part Four Mega-City One, 2147 AD. Home to over 250 million citizens, this urban hell is situated along the east coast of post-apocalyptic North America. Crime is rampant and only the Judges — empowered to dispense instant justice — can stop total anarchy. Toughest of them all is JUDGE DREDD — he is the Law! Now, Dredd’s entered a terrifying parallel reality called the Shift, seeking to rescue a young student… Script: Ian Edginton / Art: Tiernen Trevallion / Letters: Jim Campbell FIENDS OF THE WESTERN FRONT // WILDE WEST, Part Nine In 1980, the diary of German soldier Hans Schmitt was discovered in Berlin, detailing events that occurred in 1941, when he encountered the terrifying vampire Captain Constanta and his Romanian platoon. But Schmitt was not the first person to meet Constanta — the vampire has popped up throughout history, in various countries and under various guises, and now he’s in North America in the late nineteenth century… Script: John Tomlinson / Art: Eoin Coveney / Colours: Jim Boswell / Letters: Simon Bowland PORTALS & BLACK GOO // A QUORUM OF FIENDS, Part Nine In the near future, the job market is more perilous than ever and Generation Y must take on any task to make ends meet. Kroy Plemons is a rider for Devouroo — a fooddelivery service for creatures of myth and legend. Devouroo policy is ruthless and Kroy has in the past barely escaped with his life after being given the night shift, when London’s most lethal denizens are hungry. Indeed, there’s unrest across the capital… Script: Alex de Campi / Art: Eduardo Ocana / Colours: Giulia Brusco / Letters: Simon Bowland FULL TILT BOOGIE // BOOK THREE, Part Four Tee — together with her grandmother and cat — is a bounty hunter/hired help, operating from her spaceship the FULL TILT BOOGIE. Tee was paid to rescue the Luxine Prince Ifan from his debtors’ prison. In the process, she encountered a resurrected Anubite warrior, a member of the enemy race with whom the Luxine Empire battled. Now, Tee and her allies must take on the Empress herself, who is once again going to war… Script: Alec Worley / Art: Simon Coleby / Colours: Gary Caldwell / Letters: Annie Parkhouse HAWK THE SLAYER // THE LAST OF HER KIND, Part Nine It is a time of legend. HAWK THE SLAYER defeated his evil brother Voltan some years before, and now he and his compatriots are keeping an eye on the malign spread of the Black Wizards’ influence. Rumours of dark magic abound, and armed with his fabled Mindsword, Hawk must keep the peace. Now he’s entered the city of Valensfort, ruled by the Lady Morlaine, who’s using necromancy to maintain order… LATEST NEWS 27th February 2025 75% off in the Treasury of British Comics sale 27th February 2025 Buy two 2000 AD hoodies and get a FREE T-shirt! 27th February 2025 NEW merch: the ’80s classic Halo Jones T-shirt is back, plus new Mean Machine tees & hoodies! 26th February 2025 Pre-order the latest collections from 2000 AD & The Treasury of British Comics! ALL NEWS"
