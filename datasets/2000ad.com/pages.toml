["https://2000ad.com/news/john-wagner-mick-mcmahon-and-dan-cornwell-dont-miss-our-latest-2000-ad-signing-event"]
title = "John Wagner, Mick McMahon and Dan Cornwell: don't miss our latest 2000 AD Signing Event!"
description = "Kiss My Axe! This April we have an all-star signing event to celebrate the launch of Spector; Rok of the Reds; as well as The Definitive Slaine Volume 1! John Wagner and Dan Cornwell will be joined by Mick McMahon at Gosh Comics in London on Saturday 26th April! With Rok of the Reds debuting […]"
full_description = "Comics John Wagner, Mick McMahon and Dan Cornwell: don’t miss our latest 2000 AD Signing Event! 24th February 2025 Kiss My Axe! This April we have an all-star signing event to celebrate the launch of Spector; Rok of the Reds; as well as The Definitive Slaine Volume 1! John Wagner and Dan Cornwell will be joined by Mick McMahon at Gosh Comics in London on Saturday 26th April! With Rok of the Reds debuting in Judge Dredd Megazine this year, and the release of Spector as a collection in April, John Wagner and Dan Cornwell will be signing copies of the new GN as well as issues of the Meg and copies of their previous Rok collections. And Mick McMahon will be signing copies of Slaine: The Definitive Edition, as well as an exclusive mini-print only available at this signing. More details from Gosh as below: BORAG THUNGG, EARTHLETS, we have quite the thrill packed signing for you. Three titanic creator droids Dan Cornwall, Mick McMahon and John Wagner will grace us with their presence for a 2000AD signing on Saturday 26th April 2025, from 1-2pm. We’ll be celebrating two brand new 2000AD releases, Sláine: The Definitive Edition and Spector: Incorruptible. Sláine: The Definitive Edition Sláine Mac Roth of the Sessair tribe is known as the Warped Warrior – a mighty barbarian who can master the ‘warp-spasm’, harnessing the power of the Earth to transform into a monstrous creature. Accompanied by his dwarf sidekick, Ukko, and wielding his legendary axe Brain-biter, he travels Tir-Nan-Og, a land marred by warring tribes and ruled by merciless gods. Created by Pat Mills and Angie Kincaid, with art by Mick McMahon and Massimo Belardinelli, Sláine: The Definitive Edition collects the complete series in order, and includes original covers from the full run. Spector: Incorruptible Just a few years into our future, faced with unsustainable levels of corruption within the branches of city government, and a police force that is equally rotten, Spector is created. A robot detective, untainted by corruption and beyond bribery, Spector is charged with cleaning up the city. But it is an uphill battle, as many people currently in positions of power want the robot to fail. Written by John Wagner (A History of Violence), this standalone graphic novel represents the final work of Carlos Ezquerra (Judge Dredd), with Dan Cornwell (Rok of the Reds) completing the story. You can meet Mick, John and Dan on Saturday 26th April, from 1pm. If you’d like to pre-order a signed copy of Spector: Incorruptible for mail-order or collection then click the link right here. Gosh will also have an exclusive Sláine mini-print signed by Mick McMahon to accompany all copies of the definitive edition, which you can pre-order for collection or mail-order by clicking the link here. Keep up to date with all news over on the Gosh Comics Facebook event page. LATEST NEWS 27th February 2025 75% off in the Treasury of British Comics sale 27th February 2025 Buy two 2000 AD hoodies and get a FREE T-shirt! 27th February 2025 NEW merch: the ’80s classic Halo Jones T-shirt is back, plus new Mean Machine tees & hoodies! 26th February 2025 Pre-order the latest collections from 2000 AD & The Treasury of British Comics! ALL NEWS"
