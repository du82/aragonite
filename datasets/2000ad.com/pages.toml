description = "Ever wanted to get into reading the legendary 2000 AD? This is the book for you – no continuity, no serialisation, just tailor-made comics for new readers."
full_description = "Best of 2000 AD The Ultimate 2000 AD Mix-Tape Has Arrived! BUY NOW WATCH TRAILER ► All 6 volumes of the best-selling Best of 2000 AD are now available to buy! A 6-volume landmark quarterly graphic novel series from the cult comic. No continuity – no serialisation. Tailor-made for new readers. Every volume contains a mix of modern classics and gems from the vault. In each edition you’ll find an explosive Judge Dredd adventure, fresh essays by prominent popular culture writers, a graphic novel-length feature presentation by global legends and a vintage Dredd case. Volume 6 Out Now In this volume: Judge Dredd makes a Tempus Fugitive of literature’s most famous time-travel enthusiast; tremble as Robbie Morrison and Henry Flint deliver galaxy-wide carnage at the hands of the retribution of a dead race, Shakara The Avenger; during a long, hot summer something rots at the heart of a council estate in John Smith and Edmund Bagwell’s Cradlegrave; Dredd sends his cadets into the Cursed Earth to face The Hotdog Run; The government agents of Ice Station Delta find their problems snowball when they tangle with Shako, the only polar bear on the CIA death list! BUY NOWPaperback2000 AD ShopWebshop Exclusive Edition2000 AD ShopBarnes & Noble (US)Amazon.comAmazon.co.ukFind local comic store PREVIEW Volume 5 Out Now In this volume: Judge Dredd raises only the law when Mega City One’s super-rich consider themselves above it all in Elevator Pitch; crash-land on a Death Planet as Al Ewing (The Immortal Hulk) and Henry Flint (Eerie) introduce the monstrous, weaponized (but dead polite) Zombo; go Swimming in Blood with occult detective Devlin Waugh as he investigates a vampire outbreak in an underwater prison by John Smith (Hellblazer) and Sean Phillips (Reckless, Night Fever); ride out into the Godless wasteland of the Cursed Earth and witness Gordon Rennie (Doctor Who) and Frank Quitely (All-Star Superman) preach faith through firepower in Missionary Man. BUY NOWPaperback2000 AD ShopWebshop Exclusive Edition2000 AD ShopHive.co.ukBookshop.org (UK)Barnes & Noble (US)Amazon.comAmazon.co.ukFind local comic store PREVIEW Volume 4 Out Now In this volume: when Judge Dredd investigates a potential whistleblower, it’s hard to avoid paranoia when information is this Mega-City Confidential; from medieval Prague to the streets of Elizabethan London, Kek-W and John Burns sound the call to battle extra-dimensional Wurms and join The Order; a rolling stone gathers no mousse as Pete Milligan and Jamie Hewlett tangle you in Hewligan’s Haircut, a shear reality-warping victory roll that’s just the tonic; quake to the Cry of the Werewolf with an all-time Dredd classic by John Wagner, Alan Grant and Steve Dillon. BUY NOWPaperback2000 AD ShopWebshop Exclusive Edition2000 AD ShopHive.co.ukBookshop.org (UK)Barnes & Noble (US)Amazon.comAmazon.co.ukFind local comic store PREVIEW Volume 3 Out Now In this volume: spend a night on The Graveyard Shift with Judge Dredd; Gordon Rennie and Frazer Irving tune in and drop tab of superpowers before Storming Heaven; and get lost in the darkness lying in the belly of the good ship Leviathan from Ian Edginton and D’Israeli. Boasting brand new covers from an all-star line-up of artists including Erica Henderson (Dracula, Motherf**ker!) and Declan Shalvey (Moon Knight) with designer Tom Muller (X-Men), Best of 2000 AD is the essential gateway into the Galaxy’s Greatest Comic! BUY NOWPaperback2000 AD ShopWebshop Exclusive Edition2000 AD ShopHive.co.ukBookshop.org (UK)Barnes & Noble (US)Amazon.comAmazon.co.ukFind local comic store PREVIEW Volume 2 Out Now In this volume: Judge Dredd hunts untraceable assassins firing ‘Magic Bullets’ by Al Ewing (Immortal Hulk) and Colin Wilson (Blueberry); even robots get the ‘Red Planet Blues’ from Alan Moore (Watchmen), Steve Dillon (Preacher) and John Higgins (Judge Dredd); not even Mega City One’s brightest can escape ‘The Vampire Effect’ by John Wagner (A History of Violence), Alan Grant (Batman) and Mick McMahon (The Last American); and join the front line of the resistance against intergalactic bigots in the Gothic masterpiece Nemesis The Warlock by the creative team behind Marshal Law, Pat Mills and Kevin O’Neill! BUY NOWPaperback2000 AD shopWebshop Exclusive Edition2000 AD ShopHive.co.ukBookshop.org (US)Bookshop.org (UK)Barnes & Noble (US)Amazon.comAmazon.co.ukFind local comic store PREVIEW Volume 1 Out Now In this volume: Judge Dredd battles Mutie Block anarchy; Halo Jones escapes in Alan Moore’s first masterpiece; humanity is on the Brink in the space murder mystery from Dan Abnett and INJ Culbard; Judge Anderson takes centre stage in the search for Shamballa. Boasting a brand new cover from superstar artist Jamie McKelvie (The Wicked + The Divine) and a webshop exclusive cover by Karl Kerschl (Gotham Academy), plus stunning new designer by Tom Muller (X-Men), Best of 2000 AD is the essential gateway into the Galaxy’s Greatest Comic! BUY NOWPaperback2000 AD ShopWebshop Exclusive Edition2000 AD ShopHive.co.ukBookshop.org (US)Bookshop.org (UK)Barnes & Noble (US)Amazon.comAmazon.co.ukFind local comic store PREVIEW Best of 2000 AD is the ultimate comics mixtape – what better way to enjoy than with music inspired by and inspiring the Galaxy’s Greatest comic? Listen now to the official soundtrack on Spotify. More on 2000 AD “For newcomers and lapsed readers alike, it acts as a near-perfect primer for what makes 2000 AD so special.” Wired.com “Frankly, it’s absolutely perfect for new readers” comicon.com “People ask me “where’s the best place to start reading 2000 AD?” Somebody else did the job for me.” Near Mint Condition “A master-class in pulling in new readers” The Comics Beat “If you want to get started on comics, this is where you want to be. You won’t regret it.” The Comic Crush “⭐⭐⭐⭐⭐ … it’s hard to imagine a better entry point into [2000 AD].” comicbook.com “An impressive and substantial helping of the kinds of genres, names and properties that have made 2000 AD an iconic force.” Broken Frontier “A quintessential entry point for new readers and an exemplary re-discovery for fans of the classics.” Comic Book Yeti “Made me eager for the next collection.” How To Love Comics “a must-have for comic book fans, regardless of their genre preferences” Comic Book Resources “How to finally break Judge Dredd and 2000 AD into America” Popverse Related titles"
