full_description = "Comics Sláine the Miniatures Game – in stores now! 15th April 2022 Sláine: Kiss My Axe! is a skirmish tabletop miniatures battle game for two or more players set in the fantasy world created by the legendary comic creators Pat Mills and Angela Kincaid. Join Sláine as he attempts to unite the Earth Tribes of the goddess Danu to battle the decaying Drune Lords and the relentless Fomorian Sea Demons. BUY NOW >> In Sláine, players take control of a small band of Earth Tribe, Drune, or Fomorian warriors as they fight for glory and survival in the mist-shrouded lands of Tir Nan Og and beyond. This starter set contains scenery, tokens, cards and all the rules you need to play, including scenarios, advanced rules and profile lists to create your warbands such as the heroes of the Earth Tribes and Drune Lords included in this set and much more… The Sláine Miniatures Game, penned by Andy Chambers & Gav Thorpe, is the third of Warlord Games’ 2000 AD offerings. Unlike the sci-fi-infused ranged-combat that dominates Strontium Dog and Judge Dredd, Sláine is more concerned with the clash of sword & axe and opposing magics! LATEST NEWS 27th February 2025 75% off in the Treasury of British Comics sale 27th February 2025 Buy two 2000 AD hoodies and get a FREE T-shirt! 27th February 2025 NEW merch: the ’80s classic Halo Jones T-shirt is back, plus new Mean Machine tees & hoodies! 26th February 2025 Pre-order the latest collections from 2000 AD & The Treasury of British Comics! ALL NEWS"
