description = "THE BOOK OF DREDD Mega-City One, a dystopian nightmare of the future teetering on the brink of chaos. The only thing stopping the sprawling megalopolis from succumbing to the mayhem, maniacs and murderers are the Judges… and toughest of them all is Judge Dredd. The best-selling series collecting The Law in order continues as Dredd […]"
full_description = "Comics Firestorm! Judge Dredd: The Complete Case Files Vol.46 is Out Now! 26th February 2025 Out NowJUDGE DREDD: THE COMPLETE CASE FILES 46Buy nowPaperbackHiveWaterstonesBookshop.orgAmazon (UK)Find your local comic storeDownload the appOr ask at your local comic shop or bookshop THE BOOK OF DREDD Mega-City One, a dystopian nightmare of the future teetering on the brink of chaos. The only thing stopping the sprawling megalopolis from succumbing to the mayhem, maniacs and murderers are the Judges… and toughest of them all is Judge Dredd. The best-selling series collecting The Law in order continues as Dredd uncovers a decades-old cover-up that will see justice come for the Judges themselves and, one hotel, one night, multiple psychopaths, but who will live to see daybreak? Written by John Wagner (A History of Violence), Gordon Rennie (Missionary Man), Rob Williams (Kingsman: The Red Diamond), Robbie Morrison (Doctor Who), Pat Mills (Marshal Law), Al Ewing (The Immortal Hulk) and Si Spurrier (Hellblazer), with art by Simon Coleby (Low Life), Dave Taylor (Zorro), Richard Elson (Sonic the Comic), Patrick Goddard (Hulk), Kev Walker (Guardians of the Galaxy), Sam Hart (Starship Troopers), Paul Marshall (Firekind), Cliff Robinson (Mother Earth), Smudge (Chiaroscuro), David Roach (Doctor Who), Inaki Miranda (Ragman), Neil Googe (Welcome to Tranquility) and Peter Doherty (The Dreaming). Judge Dredd: The Complete Case Files is the ultimate series for fans of the lawman of the future, collecting every case, in order, from more than four decades of adventures in the pages of 2000 AD and the Judge Dredd Megazine. From the groundbreaking classics to the modern masters, this on-going and best-selling series collects the stories that have made Judge Dredd one of the world’s biggest comic book characters! LATEST NEWS 27th February 2025 75% off in the Treasury of British Comics sale 27th February 2025 Buy two 2000 AD hoodies and get a FREE T-shirt! 27th February 20