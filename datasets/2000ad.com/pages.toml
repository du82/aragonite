["https://2000ad.com/news/2000-ad-covers-uncovered-gaze-into-the-head-of-dredd-nick-percivals-megazine-474"]
title = "2000 AD Covers Uncovered: Gaze Into The Head Of Dredd - Nick Percival's Megazine 474! | 2000 AD"
description = "Every week, 2000 AD brings you the galaxy’s greatest artwork and 2000 AD Covers Uncovered takes you behind-the-scenes with the headline artists responsible for our top cover art – join bloggers Richard Bruton and Pete Wells as they uncover the greatest covers from 2000 AD! This week we have the new Judge Dredd Megazine issue […]"
full_description = "Comics 2000 AD Covers Uncovered: Gaze Into The Head Of Dredd – Nick Percival’s Megazine 474! 20th November 2024 Every week, 2000 AD brings you the galaxy’s greatest artwork and 2000 AD Covers Uncovered takes you behind-the-scenes with the headline artists responsible for our top cover art – join bloggers Richard Bruton and Pete Wells as they uncover the greatest covers from 2000 AD! This week we have the new Judge Dredd Megazine issue 474, where we take a deep dive into the mind of the Law, as Nick Percival graces the cover for another cracking wrapround piece of brilliance for Judge Dredd: Memory Lane inside… Get this cover as a print >> Yes, it’s double duty for the Percival droid with the latest Megazine, providing a stunning wrapround cover and interior art on Judge Dredd as he joins Mike Carroll for Memory Lane, where young memory diviner Psi-Judge Nash is needed for the most dangerous of missions, extracting a memory from the mind of Dredd… It’s everything you’d expect from having Nick Percival on art, wonderfully detailed grotesqueries and terrifying imagery, all beginning with that wrapround cover. So, let’s bring out the Percival droid to take a bow and tell you all about it… NICK PERCIVAL: It was great to hook up with my old partner in crime, writer Mike Carroll for this bizarre Dredd one off, Memory Lane and it was Tharg’s lucky day as this time I gave him TWO cover ideas to go with the story (which is something I rarely ever do) – Bloody hell! I originally planned on going with the first idea (above) which was Dredd’s head splitting in two, unleashing all the weird shit he has locked up in there. Just as I was getting ready to email the Mighty One with this idea, I suddenly had another take on it which was a wraparound version, Dredd now in profile as his head breaks away, letting all the strange things out (literally quickly scribbled on the back of a paper receipt)– I kind of hinted that this might be the better image to go with and luckily Tharg agreed. So, I went for a nice, big high impact shot of Dredd, teeth gritted in pain, with the breakaway effect and all these weird, twisted Dredd ‘memories’ flowing out of him. No more detail was needed as it’d detract from the main image. After I’d finished the painting, I thought it’d be good to also apply the same FX to the Megazine logo. I pitched that idea to Tharg who went for it. One email later as I received a hi-res version of the Meg logo and then I set about breaking it apart with my trusty virtual hammer. This was great fun to do and to incorporate it into the final art image was cool – I took great care to make sure it flowed with the artwork – It’s something I’d like to muck about with again on future covers and I have a few plans. This was a fun, crazy Dredd story to ilustrate and a nice little palette cleanser before I started the art on the terrifying follow up to Judge Dredd: Iron Teeth, that will be unleashed in the Prog next year. Scaring myself silly with this one… Oh, it’s always great to get the artist doing weird things to the logo – a rare treat done so well by Nick on yet another truly great cover there. And there’s even more Percival greatness inside as he and Carroll put Dredd and a young Psi-Judge who’ll never forget this particularly petrifying experience through the mill in Memory Lane. You can find Megazine issue 474 on shelves right now wherever Tharg’s monthly gift to you is sold, including the 2000 AD web shop. For a lot more from Nick, head for a brace of interviews we’ve done with him over the years – first there’s the one about Iron Teeth here, plus multiple chats about his work on Dark Judges with David Hine here, here, and here. And if that’s not enough of the particularly horrific delights, Molch-R talks to Hine and Percival about all things Dark Judges in the 2000 AD Thrill-Cast Lockdown Tapes here. And then you’ve got a load of Nick’s incredible covers to read about in Covers Uncovered – Prog 2247, Prog 2382, Prog 2387, Megazine 425, Megazine 427, Megazine 430, Megazine 433, Megazine 430, Megazine 443, Megazine 448, Megazine 453, Megazine 456, and Megazine 458. Nick also kindly sent over some of the interior art to Memory Lane for you to have a look at… it’s enough to give you nightmares… And finally, because there’s so much going on in that cover, how about some close-up looks at the details from Nick’s artwork? Yep, we knew you’d like that… LATEST NEWS 27th February 2025 75% off in the Treasury of British Comics sale 27th February 2025 Buy two 2000 AD hoodies and get a FREE T-shirt! 27th February 2025 NEW merch: the ’80s classic Halo Jones T-shirt is back, plus new Mean Machine tees & hoodies! 26th February 2025 Pre-order the latest collections from 2000 AD & The Treasury of British Comics! ALL NEWS"
