full_description = "Buy two hoodies & get a FREE T-shirt! Get any T-shirt for FREE when you order two 2000 AD hoodies, only until 10th February! BUY NOW LATEST NEWS Comics 75% off in the Treasury of British Comics sale 27th February 2025 Comics Buy two 2000 AD hoodies and get a FREE T-shirt! 27th February 2025 Comics NEW merch: the ’80s classic Halo Jones T-shirt is back, plus new Mean Machine tees & hoodies! 27th February 2025 Comics Pre-order the latest collections from 2000 AD & The Treasury of British Comics! 26th February 2025 window.excludeIds = [77738,77712,77680,76609]; Comics Judge Dredd in 2025: What to Read Next! 26th February 2025 window.excludeIds = [77738,77712,77680,76609,77571]; Comics Firestorm! Judge Dredd: The Complete Case Files Vol.46 is Out Now! 26th February 2025 Comics 2000 AD Prog 2421 out now! 26th February 2025 Podcasts Happy birthday, 2000 AD! – In Orbit Every Wednesday 26th February 2025 Comics 2000 AD Covers Uncovered: The Lullaby Lady sings you to sleep – Nick Percival on Prog 2421 26th February 2025 window.excludeIds = [77738,77712,77680,76609,77571,77662,77521,77669,77629]; ALL NEWS LATEST RELEASES 2000 AD Prog 2421 26th February 2025 Judge Dredd Megazine 477 19th February 2025 LATEST GRAPHIC NOVELS Adam Eterno: Grunn the Grim 26th February 2025 Judge Dredd: The Complete Case Files 46 26th February 2025 Battle Action 2024 Mini Series issue 7 26th February 2025 Roxy: Romance Reborn – Regular Edition 12th February 2025 Judge Dredd: A Better World 29th January 2025 Essential Rogue Trooper: The Traitor General 29th January 2025 GO TO SHOP 2000 AD THRILL-CAST PODCAST Listen now to 2000 AD’s award-winning official podcast – the 2000 AD Thrill-Cast! Beamed direct from the Nerve Centre of the Galaxy’s Greatest Comic, every fortnight publicity droid Molch-R brings you the lowdown on the Galaxy’s Greatest Comic, interviewing some of the world’s greatest comics creators, welcoming special guests, giving you exclusive announcements and the chance to win zarjaz prizes – plus so much more! You can subscribe to the Thrill-Cast on iTunes or download on Soundcloud and Podomatic. LISTEN NOW ON Soundcloud Spotify Apple Podcasts YouTube 26th February 2025 Happy birthday, 2000 AD! – In Orbit Every Wednesday Celebrating 48 years of Thrill-power with a broken mic, a bad hat, and a lovely cat – Molch-R & KLO-E are back with another episode of In Orbit Every Wedensday! It’s 48 years since 2000 AD first landed on shelves, so the gruesome twosome discuss when they first started reading The Galaxy’s Greatest Comic, when […] More… 19th February 2025 A Valentine to Judge Dredd?! – In Orbit Every Wednesday Valentine’s Day may have passed, but love is in the air on the latest In Orbit Every Wednesday as Molch-R & KLO-E delve into 2000 AD Prog 2420 and Judge Dredd Megazine #477 and talk Devlin Waugh, Judge Dredd, romance, love and s*x in the Big Meg. Hosted by 2000 AD Brand Manager Michael ‘Molch-R’ […] More… 12th February 2025 What are the best Judge Dredd horror stories? – In Orbit Every Wednesday Putting the dread into Judge Dredd – this week on In Orbit Every Wednesday we’re talking horror with our special guest – artist on Judge Dredd: The Shift, Nick Percival! He talks to Molch-R and KLO-E about his new Judge Dredd story with writer Ken Niemand, why Dredd works with horror, and what the best […] More… 8th February 2025 NEW PODCAST SHOW: The Best Comic You’re Not Reading? This is 2000 AD: The Deep Dive! BRAND NEW SHOW! Every month, Steve Morris is joined by a guest – critic, academic, creator, fan – to discuss a series or character from the archives of 2000 AD, exploring the characters and story, uncovering its context, and finding out what makes it tick. This month, Steve is joined by journalist, critic and podcaster […] More… window.excludeIds = [77738,77712,77680,76609,77571,77662,77521,77669,77629,77669,77592,77510,77494]; ALL PODCASTS Best of 2000 AD The Ultimate 2000 AD Mix-Tape Has Arrived! Ever wanted to get into reading the legendary 2000 AD? This is the book for you – no continuity, no serialisation, just tailor-made comics for new readers. Learn More Sláine the Miniatures Game – in stores now! Axes and swords clash whilst Earth and Sour magic lash out across the Land of the Young – the new Sláine miniatures game from Warlord Games is out now! window.excludeIds = [77738,77712,77680,76609,77571,77662,77521,77669,77629,77669,77592,77510,77494]; A celebration of 45 years of 2000 AD Featuring celebrity fans and legendary creators, The Galaxy’s Greatest will stream online and for free on 26 and 27 March on 2000 AD’s social media channels and YouTube, and Rebellion’s dedicated Twitch stream. Learn More Follow 2000 AD : Social media Follow 2000 AD on our social media channels. Twitter Instagram Facebook Youtube"
