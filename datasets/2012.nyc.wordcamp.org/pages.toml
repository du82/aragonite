full_description = "Blog Archives Developing and Extending WordPress for Higher Education Presented by Baruch College • Education / Nonprofit Track An extension of the “Building and Supporting WordPress for Higher Education” session, this session will feature a range of presentations from CUNY folks working with WordPress around custom functionality they’ve developed in order to more effectively integrate WordPress into their … Continue reading Developing and Extending WordPress for Higher Education → Share this:EmailFacebookLinkedInTwitter Comments Off on Developing and Extending WordPress for Higher Education Building and Supporting WordPress for Higher Education Presented by Baruch College • Education / Nonprofit Track The City University of New York has given rise to several WordPress Multisite installations including Blogs@Baruch, the CUNY Academic Commons, ePortfolios at Macaulay, the OpenLab at City Tech, and QWriting at Queens College. This session will feature a range of … Continue reading Building and Supporting WordPress for Higher Education → Share this:EmailFacebookLinkedInTwitter Comments Off on Building and Supporting WordPress for Higher Education WordPress for Teaching and Learning – Best Practices Presented by Baynard Bailey • Education / Nonprofit Track At Vassar College, we use WordPress as a digital publishing platform for classes interested in sharing and publishing multimedia as part of their class discourse. I have consulted with dozens of faculty in order to incorporate WordPress into their instructional … Continue reading WordPress for Teaching and Learning – Best Practices → Share this:EmailFacebookLinkedInTwitter Comments Off on WordPress for Teaching and Learning – Best Practices WordPress for Nonprofits: Using CiviCRM Presented by Dana Skallman • Education / Nonprofit Track WordPress is the most pervasive and fastest growing open source CMS. Many non-profits, charities and educational institutions use WordPress to power their websites. However, finding a way to connect a Constituent Resource Manager (CRM) has been difficult. You could add … Continue reading WordPress for Nonprofits: Using CiviCRM → Share this:EmailFacebookLinkedInTwitter Comments Off on WordPress for Nonprofits: Using CiviCRM"
