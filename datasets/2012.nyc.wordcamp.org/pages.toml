["https://2012.nyc.wordcamp.org/session/wordpress-com-first-timer-workshop"]
title = "WordPress.com First-Timer Workshop | WordCamp New York City 2012"
description = "Want to get started blogging but have no idea where to begin? We have a great workshop for you that’s a part of WordCamp NYC. Just a note before we get started: This workshop is meant for those wit…"
full_description = "WordPress.com First-Timer Workshop Want to get started blogging but have no idea where to begin? We have a great workshop for you that’s a part of WordCamp NYC. Just a note before we get started: This workshop is meant for those with no prior experience blogging with any platform. If you’re currently blogging or are looking for a refresher on best practices the workshop is not for you. This class is for the people who are totally new to blogging. We will walk each workshop attendee through the setup of a site on WordPress.com. You’ll learn how to use themes and widgets, publish various types of content, and take advantage of some of the other really cool features available on WordPress.com. To participate in the workshop you will need to bring a few things with you. Don’t worry, it’s easy homework. The morning of the workshop you’ll need to have: a title and tagline in mind for your site a folder of images, some of which should be large text written for at least two posts a blurb about yourself and an image for an About Me page Since we’ll be teaching you how to use WordPress.com you’ll be able to change your posts and about page later. The posts and images you bring don’t have to be in finished, final draft form, but they should be something you’re comfortable working with for the day. The workshop will be run by Happiness Engineers and others from WordPress.com. You’ll be hearing all the information straight for the source and get an introduction to the people who provide WordPress.com’s famous (and free!) 24/7 support. We’ll show you how you can get in touch with them after the workshop so that as you run into more questions you’ll know right where to go. We’re really looking forward to having you join us for this workshop! If you’re interested in an overview of how we’ll cover things the workshop schedule will look like this: Setting up your new site An introduction to the WordPress.com Dashboard The basics of creating content Themes and custom design tools Customizing your site with widgets and menus An introduction to Gravatar profiles and social features How to post from anywhere Introducing custom domains How to get support and some basic ground rules Where you can go from here and what’s next."
