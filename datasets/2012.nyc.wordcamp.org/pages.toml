title = "Social Media | Tracks | WordCamp New York City 2012"
full_description = "Blog Archives Increase pageviews and user retention in 3 minutes Presented by Neil Mody • Social Media Track You work hard to drive visitors to your site, now learn some simple ways of keeping them there. In this session, Neil Mody from nRelate, will go over some simple methods that recirculate your older content, engage readers to click, … Continue reading Increase pageviews and user retention in 3 minutes → Share this:EmailFacebookLinkedInTwitter Comments Off on Increase pageviews and user retention in 3 minutes Getting Started with WordPress , SEO, Analytics and related Tools Presented by Ron Suarez • Social Media Track From good information architecture to metrics driven design, this presentation will help you to choose the appropriate WordPress plugins and understand the basics of how to use them along with related Google Webmaster tools. Share this:EmailFacebookLinkedInTwitter Comments Off on Getting Started with WordPress , SEO, Analytics and related Tools Google Adwords and WordPress Presented by Lex Dreitser • Social Media Track A start to finish presentation of how to integrate Google Adwords (or any digital advertising) into your marketing strategy. We’ll go through creating a campaign and discover some keyword tools. We’ll touch on the things google considers when setting your … Continue reading Google Adwords and WordPress → Share this:EmailFacebookLinkedInTwitter Comments Off on Google Adwords and WordPress DIY SEO (using WordPress) Presented by Melissa Cahill • Social Media Track SEO can be a big scary topic. You’ve heard or read a bit about it. Everyone tells you need it — you think you need it, too. But admit it: you have no idea what it really means. This presentation … Continue reading DIY SEO (using WordPress) → Share this:EmailFacebookLinkedInTwitter Comments Off on DIY SEO (using WordPress) 15 WordPress Optimizations of the Top Media Companies Presented by Frederick Townes • Social Media Track I present conversion rate optimization, search engine optimization and social media optimization tips to developers, designers and bloggers have practical tips for making sites successful. Share this:EmailFacebookLinkedInTwitter Comments Off on 15 WordPress Optimizations of the Top Media Companies Social Media and Social Movements Presented by MaryBeth Coudal • Social Media Track Find out how to use social media as a creative, democratic, and social force to bring people together. Over the last year, a number of social movements, such as Occupy Wall Street, Susan B. Konen, and Stop Kony, have gained … Continue reading Social Media and Social Movements → Share this:EmailFacebookLinkedInTwitter Comments Off on Social Media and Social Movements"
