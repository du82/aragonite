title = "WP 101 | Tracks | WordCamp New York City 2012"
full_description = "Blog Archives Speeding up WordPress on Shared Hosting Presented by Kevin Cristiano • WP 101 Track We all want our WordPress sites run super fast. This becomes a challenge if you have a shared hosting account. Let’s face it not all good sites are on their own server or even a Virtual Private Server. This session … Continue reading Speeding up WordPress on Shared Hosting → Share this:EmailFacebookLinkedInTwitter Comments Off on Speeding up WordPress on Shared Hosting Basics on Managing Dashboard for New Admins Presented by Krista Gonzalez • WP 101 Track Whether getting started for the first time with WP or taking over Admin control of your website after a bad experience with a consultant, the dashboard can be intimidating, especially when it comes to maintenance. Sometimes it’s better to have … Continue reading Basics on Managing Dashboard for New Admins → Share this:EmailFacebookLinkedInTwitter Comments Off on Basics on Managing Dashboard for New Admins Widge-WHAT!? Demystifying WordPress and must have tips for beginners Presented by Michael Gyura • WP 101 Track WordPress for beginners. WordPress is a great CMS that has millions of users, but the learning curve can be steep for someone who isn’t a web developer. This session will unpack the essential vocabulary, demonstrate how to use WordPress, show … Continue reading Widge-WHAT!? Demystifying WordPress and must have tips for beginners → Share this:EmailFacebookLinkedInTwitter Comments Off on Widge-WHAT!? Demystifying WordPress and must have tips for beginners Welcome to WordPress.Com The Beginners Bootcamp Presented by Bob Tynes • WP 101 Track What you can do with WordPress.com. When do you need to go to WordPress.org WP.com – (The Basics) Under the Hood WordPress.com Where are we going – future considerations The future for wordpress.com Migrating to wordpress.org Share this:EmailFacebookLinkedInTwitter Comments Off on Welcome to WordPress.Com The Beginners Bootcamp WordPress ABC’s and 123’s: Steps on how to start using WP, the right way! Presented by Shauna Graham • WP 101 Track Topics ranging from where to get the best WP themes online, installations, the 10 plugins to add, social sharing, as well as basic posting and paging placements. Once all the secrets are revealed, you will be good to go, sharing … Continue reading WordPress ABC’s and 123’s: Steps on how to start using WP, the right way! → Share this:EmailFacebookLinkedInTwitter Comments Off on WordPress ABC’s and 123’s: Steps on how to start using WP, the right way! A Beginner’s Guide to WordPress Presented by Kathryn Presner • WP 101 Track This introductory session is geared toward bloggers, web designers and programmers who are new to WordPress. Even those who don’t know a Codex from a Cadillac will feel comfortable here. Delving into WordPress from a beginner’s point-of-view, we use unintimidating … Continue reading A Beginner’s Guide to WordPress → Share this:EmailFacebookLinkedInTwitter Comments Off on A Beginner’s Guide to WordPress"
