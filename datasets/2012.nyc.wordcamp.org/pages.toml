title = "WordCamp New York City 2012"
full_description = "← Older posts WordCamp NYC is on for 2014! April 8, 2014 by GDPR Eraser • Comments Off on WordCamp NYC is on for 2014! Just in case you missed it, WordCamp NYC was just announced for August 2-3, 2014! Check out the new site, and be sure to subscribe over there! Share this:EmailFacebookLinkedInTwitter Posted in WordCamp | Comments Off on WordCamp NYC is on for 2014! Speaker Presentations June 21, 2012 by Steve Bruner • Comments Off on Speaker Presentations You wanted it… you got it! WordCamp NYC Speaker presentations… all on one page. Sorted by Presentation name: Frederick Townes 15 Secrets of Top Media Companies Kathryn Presner A Beginner’s Guide to WordPress Andy Stratton Accomplish It With Core: Sliders, Galleries & More Mel Choyce Alas, No Mind Meld: Designer-Developer Communication Kimanzi Constable Breaking Through With Your Stor Steve Bruner / Kevin Miller Build Powerful Websites and Web Applications with Piklist Garth C. Koyle Can you Go Commercial Scott Taylor Cloud, Cache, and Configs Tracy Levesque Creating Custom Child Themes for WordPress Alex Sapountzis and Jeffrey Marx Customizing the Custom Loop Austin Gunter Developing Digital Marketing into your WordPress Ro Gupta Disqus & WordPress – Getting the Most from Community Cross Pollination Melissa Cahill DIY SEO Using WordPress Jeremy Clarke DRY CSS – Theries, methods and tools for efficient and scalable Stylesheets. Jodie Barr eCommerce Choices for WordPress Tammie Lister Express Yourself With BuddyPress Themes Lex Dreitser Google Adwords and WordPress Alex Mirand Google Loves WordPress – Blogging For SEO Max Cutler Integrating with WordPress via XML-RPC Andrew Christian Intro to HTML5 and CSS3 Josh Leuze jQuery The WordPress Way Aaron Jorbin Lessons from Making Millions of Websites More Accessible Helen Hou-Sandi Making Custom Content Management Disappear into the WordPress Admin Kenny Katzgrau Making WordPress Fly: Optimizing Your Servers for Performance Jason Coleman Membership Sites with WordPress: Paid Memberships Pro Erick Hitter Moving Beyond the Codex: Learning WordPress from Itself Mike Toppa Object Oriented Programming for WordPress Plugin Development Marko Heijnen Rocking a WordPress network Meeky Hwang Save Your Code: One Codebase, 9 Blogs with WordPress Multisite Using Sub-domains and Sub-directories MaryBeth Coudal Social Media and Social Movements Kevin Cristiano Speeding up WordPress on Shared Hosting Mason James Supporting WordPress John Havlik The Power of Custom Post Types Boone Gorges Using Git for Sane WordPress Development Rindy Portfolio Using Web Fonts in WordPress Justin Beckwith WebMatrix 2: Uber geek in designer clothes Jake Goldman What Would Core Do? Jason Paul WordPress as Custom CMS Dana Skallman WordPress for Nonprofits: Using CiviCRM Baynard Bailey WordPress for Teaching and Learning Michael Basto WordPress on Amazon Web Services from Start to Finish Sonja Leix WordPress Responsive Design Bootcamp Brad Williams WordPress Security Sarah Whinnem WordPress Template Hierarchy Share this:EmailFacebookLinkedInTwitter Posted in News | Comments Off on Speaker Presentations That’s all Folks! June 11, 2012 by Steve Bruner • 1 Comment Share this:EmailFacebookLinkedInTwitter Posted in WordCamp | 1 Comment Submit your questions for Mark Jaquith or Nacin June 10, 2012 by Andy Christian • Comments Off on Submit your questions for Mark Jaquith or Nacin Loading&#8230; Share this:EmailFacebookLinkedInTwitter Posted in WordCamp | Comments Off on Submit your questions for Mark Jaquith or Nacin Breaking News! Sunday’s schedule (Updated) June 9, 2012 by danaskallman • Comments Off on Breaking News! Sunday’s schedule (Updated) Breaking News! Sunday’s schedule has come to fruition. Repeating sessions were chosen based on demand, but all in all there was much gained from everyone’s sessions today. Thanks to everyone who offered requests for repeat sessions and to the speakers for being willing to do it all over again. See full schedule here! Share this:EmailFacebookLinkedInTwitter Posted in News, WordCamp | Comments Off on Breaking News! Sunday’s schedule (Updated) Today’s the Day! June 9, 2012 by Andy Christian • Comments Off on Today’s the Day! Hello there WordCampers! Are you excited yet? Registration begins today at 8:00 AM, and the weekend officially kicks of at 9:00 AM. Happiness Bar is in 4225 Hangout Room is in 9135 Enter Baruch College on 25th St between Lexington & 3rd Ave. To get there, take the 6 Train or N/Q/R Train to 23rd Street and walk to Lexington Avenue and 25th Street. Make sure to keep an eye on this site and on our Twitter Feed for up to the minute details throughout the day. Wifi details!!! Field: Baruch-Guest Pass: b@rucHi2W0rdC@mp Share this:EmailFacebookLinkedInTwitter Posted in WordCamp | Comments Off on Today’s the Day! Submit your Unconference Workshops June 7, 2012 by danaskallman • Comments Off on Submit your Unconference Workshops We will have two rooms for a total of eight Unconference workshops. Here’s your chance to share your WordPress knowledge at WordCamp. Your submission ideas will be aggregated to create sessions that we will post on the website during lunch on Saturday. Attendees will vote tomorrow afternoon to determine which presentations will be part of the Unconference series! Submissions must be in by noon tomorrow (Saturday). Share this:EmailFacebookLinkedInTwitter Posted in News | Comments Off on Submit your Unconference Workshops Are you ready for WordCamp NYC? June 6, 2012 by Andy Christian • Comments Off on Are you ready for WordCamp NYC? Wow, the wait is almost over! WordCamp NYC is less than 48 hours away, and the excitement is building. Here are some final details we think you should know before the big day. This is a lot of info, so pay attention: Wifi: There’s been a lot of buzz about this on Twitter, so let’s clear things up. As in years past, Wifi access for attendees will be limited due to venue constraints. The network can’t handle a huge amount of traffic, so please exercise restraint when using the internet. If possible, bring your own internet; if you have one of the many smartphones that have a Personal Hotspot feature, do us a favor and use that instead of the college Wifi. Or better yet, leave the laptop, pay attention to the speakers you came to see, and network with the hundreds of other attendees who come to WordCamp. Transportation: As of right now, there is no maintenance scheduled by the MTA that should affect WordCamp, but a constant in the city that never sleeps is that everything can change. Be sure to keep an eye on the MTA’s Website for up to date information. We’ll post information on this site as well as on our Twitter account if anything changes. Registration: Registration opens at 8am on Saturday morning, so why not get there early to avoid the crowd? The day officially begins at 9am, and you don’t want to be stuck waiting for your badge while sessions are going on. If you are late, Registration will be open all day Saturday, just in case. Baruch College is located at 55 Lexington Avenue @ 25th street. The actual entrance is on 25th street (which would be the side of the building that isn’t covered in blue scaffolding). Badges: Due to venue security, all attendees must wear their WordCamp badge at all times while in the secured area of the college. We started printing the badges yesterday, so if you didn’t register (or fill out your attendee profile) by Tuesday, June 5th, we will not have a pre-printed badge for you. We will have blank badges for those attendees. Please take care of your badge, as you will need it to last for two days (and to get admission to the after party). T-shirts: Every attendee will get a t-shirt. When you will be able to receive it depends on when you registered. If you registered (and completed your attendee profile) on or before Tuesday, May 29th, you will be able to receive your t-shirt in the size that appears on your attendee badge at registration. If you registered after that date, you will need to wait until after lunch to get your t-shirt. Saturday Sessions: We have 13 rooms of sessions going, so there will be plenty to see. Most of the sessions will be taking place in the Vertical Campus (the same building as registration), but the WordPress 101 track will be across 25th Street in the Newman Library building on the 6th floor. Saturday Lunch: Just like the t-shirts, there was a deadline to be guaranteed your meal preference. If you registered on or before Tuesday June 5th and completed your attendee profile, you will be guaranteed the meal that you chose (omnivore, kosher, vegetarian, or vegan). If you did not complete your registration by then, we assumed that you are an omnivore. Please stand by your meal choice, as we didn’t order a lot of extra food. Saturday Night After Party: What would WordCamp be without an after party? This year, we’re holding the after party at Slate, an awesome club on 21st Street between 5th and 6th avenues. The party begins at 7pm, two hours after the final session of the day, so you have plenty of time to get some dinner before partying the night away. In fact, Slate has a pretty good food menu, so you can eat there if you want to get in early. Please have your WordCamp badge with you to ensure you will be admitted to the party. Sunday Sessions: Doors open at 10am on Sunday, so don’t party too hard. There will be a few more planned sessions, but most of the sessions will be repeat sessions from Saturday (so you can see something you missed) or Unconference sessions that any attendee can propose. We’ll be opening proposals tomorrow, so if you’d like to present, get your thinking cap on now. We’ll take a vote during the day on Saturday, so keep an eye on this site (and on Twitter) for more details. There will also be a room for hacking plugins, themes, core WP, and even working on the Codex. If you want to contribute to WordPress, this is the place to do it. Sunday Lunch: There will be a lunch period on Sunday, but sadly, a second free lunch wasn’t included in our budget. There are a lot of great places to get lunch in the area, mostly on 3rd avenue. Sunday WordPress.com workshop: The full-day WordPress.com Beginner workshop will take place in the Newman Library Building on Sunday. This is the only session that required pre-registration due to the fact that we will be using the computer lab (and thus need computer accounts for all of the attendees). We will be doing a separate check-in for this workshop, so please make sure you received a confirmation email saying that you are on the list to go. Sunday Q & A with Mark Jaquith and Andrew Nacin: As our big finale of the weekend, we’ll be hosting a Q & A with two of the guys that help make WordPress. Get your questions in now by filling out this form. We’ll pose as many questions as we have time for. Wow, that’s a lot of information! Thanks for reading all the way through. We hope you have a great time at WordCamp! Share this:EmailFacebookLinkedInTwitter Posted in WordCamp | Comments Off on Are you ready for WordCamp NYC? Our Gold Sponsor – NorthPoint Solutions June 6, 2012 by Kevin Cristiano • Comments Off on Our Gold Sponsor – NorthPoint Solutions We had a chance to meet with Arwin Holmes and Shruti Shah of our Gold Sponsor, NorthPoint , the other day. WordCamps take a considerable amount of resources to happen, with the most precious commodities being time and money… and NorthPoint has stepped up as this year’s only Gold Sponsor. So who is NorthPoint and what do they do with WordPress?They are an enterprise digital platform strategy and technology-consulting firm, based in New York City, with two distinct Practices: Financial Services and Content Solutions. Odd Mix? Perhaps, but as Arwin Holmes explained, they have felt that they could market Enterprise Content Management Systems to their clients using WordPress. Arwin went on to say that since WordPress 3.0, they see the platform as a full-fledged CMS that supports Enterprise initiatives. NorthPoint considers themselves as being platform agnostic; their functional domain knowledge allows them to successfully recommend and implement the right solution to support their clients’ on-going business strategy/situation. They have a significant track record of success having delivered digital platforms for some of the world’s most admired and leading organizations in Publishing, Media, Education, Healthcare, Entertainment, and Not-for-Profit industries. What they like about WordPress is that they see its development eclipsing other platforms and supporting the Enterprise. Arwin stated that the current development and release cycle that WordPress is on, with a release every six months, is a major factor. Giving back to the WordPress Community is a big part of open source software and NorthPoint has presented at WordCamp Boston on Enterprise Do’s and Don’ts (You can check out the video here). In addition, NorthPoint feels that the Multi-Site capabilities of WordPress are a tremendous feature that lends itself to the Enterprise. Meeky Hwang will be presenting in the Multi-site Track on Saturday at 11:30 Check it out here. Beyond presenting, NorthPoint felt that becoming a sponsor at WordCamp NYC was a way to support the community close to home. Look for NorthPoint this weekend at WordCamp NYC and join us in thanking them for their support. Share this:EmailFacebookLinkedInTwitter Posted in Sponsors | Tagged NorthPoint, Sponsor Spotlight | Comments Off on Our Gold Sponsor – NorthPoint Solutions Have you filled out your Attendee profile? June 4, 2012 by Steve Bruner • 6 Comments Are you listed on the Attendee page? Are you there, but you see a funny Gravatar? We’re printing badges on Wednesday, so please fill in your information asap. I purchased a ticket and I’m not listed on the Attendee page! Check your inbox and find the email titled: “Ticket Purchase for WordCamp NYC 2012″ Click on the link in the email. It should bring you to a ticket page with your personal info. Fill in the blanks and press SAVE. Go to the attendee page to see your smiling face! I’m listed on the Attendee page, but there’s a mean-looking shape instead of my face! Make sure you’re signed up with the same email address at gravatar.com. We will also be placing the food order tomorrow, so unless you tell us otherwise, we will be assuming you are an omnivore (rather than vegetarian, vegan, or kosher eater). Share this:EmailFacebookLinkedInTwitter Posted in News | 6 Comments ← Older posts"
