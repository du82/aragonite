["https://2012.nyc.wordcamp.org/track/sysadmin"]
title = "Scaling / Optimization | Tracks | WordCamp New York City 2012"
full_description = "Blog Archives Customized WordPress Website for Small Business Owners Presented by Chris Cho • Scaling / Optimization Track We specialize in SEO & Web Design for small business owners and would love to talk about the marketing side and why wordpress works so well whether they want a simple blog site or an ecommerce site since it’s user … Continue reading Customized WordPress Website for Small Business Owners → Share this:EmailFacebookLinkedInTwitter Comments Off on Customized WordPress Website for Small Business Owners WordPress on AWS from Start to Finish Presented by Michael Bastos • Scaling / Optimization Track So everyone’s been to some WordCamp talk in the past about the benefits of using Amazon Web Services with your WordPress Install but few speakers have ever actually shown how to set it all up within the 30 minute talk … Continue reading WordPress on AWS from Start to Finish → Share this:EmailFacebookLinkedInTwitter Comments Off on WordPress on AWS from Start to Finish Scaling WordPress – Cloud, Cache, and Configs Presented by Scott Taylor • Scaling / Optimization Track How to run WordPress with High Availability across many environments (Dev, QA, Prod) on many servers, regionalized, on multiple server configurations… and how to make it fast! Also, some tricks of the trade when managing and sharing content across sites … Continue reading Scaling WordPress – Cloud, Cache, and Configs → Share this:EmailFacebookLinkedInTwitter Comments Off on Scaling WordPress – Cloud, Cache, and Configs Optimizing WordPress for Speed and Scale Presented by Ben Metcalfe • Scaling / Optimization Track This talk will encompass ways to optimize your website to make it fast, and then how to make that speed scalable. It starts at the beginner level with basic ways to get the most from WordPress, and will go all … Continue reading Optimizing WordPress for Speed and Scale → Share this:EmailFacebookLinkedInTwitter Comments Off on Optimizing WordPress for Speed and Scale Making WordPress Fly: Optimizing Your Servers for Performance Presented by Kenny Katzgrau • Scaling / Optimization Track WordPress isn’t exactly the speediest app out of the box, although the community has done a commendable job in boosting application-level performance via clever caching plugins and patches. Optimization of WordPress at the server level can yield the greatest performance … Continue reading Making WordPress Fly: Optimizing Your Servers for Performance → Share this:EmailFacebookLinkedInTwitter Comments Off on Making WordPress Fly: Optimizing Your Servers for Performance Your First VPS Presented by John Keegan • Scaling / Optimization Track Looking for more control over your WordPress site? More power than a shared host? Maybe it’s time for you to consider moving to a one of the many VPS hosting solutions. This talk will outline what you need to know … Continue reading Your First VPS → Share this:EmailFacebookLinkedInTwitter Comments Off on Your First VPS Jailbreaking WordPress: How to move your site to a new hosting provider Presented by Chris Lauzon • Scaling / Optimization Track Sometimes you’ve got to break the chains of an old relationship; and you’ve got to pack up all your stuff, and fight over the dog. Hosting is very similar. If you don’t prepare your site, the database, your themes, and … Continue reading Jailbreaking WordPress: How to move your site to a new hosting provider → Share this:EmailFacebookLinkedInTwitter Comments Off on Jailbreaking WordPress: How to move your site to a new hosting provider"
