["https://2013.minneapolis.wordcamp.org/blog"]
title = "Blog | WordCamp Minneapolis 2013 | April 27"
full_description = "WordCamp Minneapolis 2014 Tickets On Sale Early bird tickets are now on sale for WordCamp Minneapolis 2014. This year’s WordCamp will be on April 26-27 at the University of St. Thomas in downtown Minneapolis. We’ve got some great sessions planned, the speaker line-up will be announced by March 16th, so register now to get your early bird ticket to save a few bucks! This entry was posted in News on March 5, 2014 by Josh Leuze. Thank You! Jan, Bill, & Carl at MCTC MCTC is a great partner for WordCamp. Bill, Carl, and Jan helped us start a WordCamp relationship that we hope will last a long time. I know more than one WordPress agency has been spawned from MCTC graduates. Travis Totz & WerkPress When I first met Travis last November, I asked if he’d be interested in helping out with WordCamp. He went over the top – designing our website, logos, stickers, sweatshirts, glasses, t-shirts – the list goes on. His company, WerkPress, stepped up to be our only Viking level sponsor and then hosted the after-party as well. Carl Bliss, Moni Francesca & the volunteer team Carl & Moni stepped up to be our lead volunteer wranglers. Their team of almost 30 volunteers (comprised of mostly MCTC students) helped the event go off without a hitch. Josh Leuze Josh turned Travis’s design into an awesome responsive website. He also was the creative force behind the Template Hierarchy poster. Just when the poster idea was about to die on the table, he drew a doodle/cartoon of what he thought the template hierarchy might look like in the mind of a WordPress geek. Jessi Foell Jessi volunteered her great marketing experience to help with our SWAG orders. She also proofed almost every email and blog post that went out. Marcus Genzlinger Marcus is our nightlife specialist. I’m pretty sure he knows every square inch of downtown that serves food and drink. He was instrumental in planning the speaker/sponsor dinner and Sunday brunch. David Skarjune I’m pretty sure David knows everyone in this town. He proved it as he brought in our sponsorships – which in true WordCamp fashion, included his own company. Barbara Schendel Even with her own event to plan, her wedding, Barbara came back into the fray to help us work out all of the catering details for lunch and the after-party. If you’re a vegetarian or vegan, she deserves extra props as she’s always looking out for the non-omnivores out there. Matt Barker Matt started the whole thing back in 2010 and inspired us to reboot it for 2013. He was gracious enough to pay forward the leftover surplus from 2010. All Speakers, Sponsors and Attendees And of course, we’d like to thank our speakers, sponsors and everyone who attended. We had a great panel of both national and local speakers. They donated their time to come to Minneapolis and we hope they found it worthwhile. We also couldn’t have thrown such a successful event without our sponsors. WordCamp is a conference for the people, by the people. Without a nexus of great speakers, willing sponsors, and eager attendees, WordCamp would never be possible. Thanks again to all involved! – Justin Foell This entry was posted in News on April 28, 2013 by jrfoell."
