full_description = "Register Tickets for Saturday are sold out, please join us Sunday for BuddyCamp! WordCamp Saturday, April 27th, 2013 This is the main event! We’ll hear from industry experts on topics ranging from security, theme and plugin development, blogging 101, SEO, and so many more! We’ll also hook you up with lunch! BuddyCamp Sunday, April 28th, 2013, 12PM-5PM BuddyPress is an online community-building plug-in suite. If you’re looking to complete your WordCamp experience, then be sure to attend BuddyCamp and learn from local and national leaders who use BuddyPress. Don’t stay out too late Saturday night because we’ll provide brunch before the first session – seating is limited. Hotel Discounted rates are available for WordCamp attendees at the Minneapolis Marriott City Center. This special rate ($109/night) is only available until April, 5th so book your room today! More information on hotel and locations This event has completed. Share this post:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window)"
