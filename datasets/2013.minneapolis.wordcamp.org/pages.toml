title = "WordCamp Minneapolis 2013 | April 27"
full_description = "Calling All WordPress Fans WordCamp Minneapolis 2013 is a conference that focuses on everything WordPress. Join us April 27th & 28th for engaging and inspiring sessions that will leave you exhausted (in a good way!) and ready to take on new challenges with your WordPress site. April 27th will be at the Minneapolis Community & Technical College and April 28th – BuddyCamp – will be held at the Minneapolis Central Library. This community-led event would not happen without the help of volunteers, sponsors and speakers so sign up and spread the word. Tickets On Sale Now! Did you hear that sound? It was the sound of WordCamp Minneapolis tickets officially going on-sale! Get Yours Today If you’re looking to stay downtown, don’t delay booking your hotel room. Our promotional price of $109/night is good through April 5th. Book your room today! More information about the hotel promotion and WordCamp locations can be found on the location page. Keep In Touch It wouldn’t be a WordCamp without a steady flow of blogging and tweeting! Check out our blog, subscribe to the feed, or follow us on Twitter for the latest news. From the Blog WordCamp Minneapolis 2014 Tickets On Sale Thank You! WordPress Theme Template Poster Sign Up to Learn How To Build Online Community Websites! Brunch!"
