["https://2013.minneapolis.wordcamp.org/location"]
title = "Location | WordCamp Minneapolis 2013"
description = "WordCamp Minneapolis will be held at two locations: Saturday, April 27th at the Minneapolis Community & Technical College 1501 Hennepin Ave, Minneapolis, MN 55403 8am – 4pm Sunday, April …"
full_description = "Location WordCamp Minneapolis will be held at two locations: Saturday, April 27th at the Minneapolis Community & Technical College 1501 Hennepin Ave, Minneapolis, MN 55403 8am – 4pm Sunday, April 28th at the Minneapolis Central Library 300 Nicollet Mall Minneapolis, 55401 12pm – 5pm Hotel We have secured a promotional rate of $109/night at the Minneapolis Marriott City Center Hotel, located at 30 South 7th Street Minneapolis, MN 55402 The promotional rate is good for the nights of Friday April 26th and Saturday April 2th. Book early as the promotion ends at midnight (Central Time) on Friday, April 5th. We encourage locals and out-of-towner’s to stay downtown as everything is conveniently located nearby. Reserve a room at $109/night. Getting Around Getting around Minneapolis is easy to do with or without a car. For those without, Hiawatha Light Rail Transit (route #55) runs 24-hours and goes quickly between downtown, the aiport, and the Mall of America. From Marriot City Center downtown, it’s a short walk to both MCTC and the library. You can also ride any bus or train in the downtown area for $.50 or even better, ride for free on Nicollet Mall. The library is located on Nicollet Mall, and if you want to ride for free to MCTC, you can take a free bus down to 13th street, and treat yourself to a stroll along the Loring Greenway. Otherwise you can take any number of Hennipen Ave buses (routes #4, #6, #12) for $.50 to MCTC. For more adventurous types, Minneapolis has a great bike sharing program called NiceRide. If the weather is good, you could easily take one of these bicycles from the rack nearby at the IDS Station and drop it off at the Loring Park or Hennepin & Laurel Ave. Stations near MCTC, or the Downtown Library Station."
