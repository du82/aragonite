full_description = "Membership Sites using BuddyPress The s2Member plugin is a great way to turn your WordPress site into a membership site (either fee based or free). Best of all, it integrates almost seamlessly with BuddyPress. In this session I will be showing both a s2Member stand-alone free membership site as well an example of BuddyPress integration. I will also touch on when it is appropriate to use a membership plugin rather than other built-in functionality of WordPress itself. This entry was posted on March 29, 2013 by Josh Leuze. About Josh Leuze WordPress developer, sci-fi fan, and artist. View all posts by Josh Leuze →"
