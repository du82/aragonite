full_description = "BuddyCamp Minneapolis 2013 What is BuddyCamp? BuddyCamp is a day of discussion around building online communities with WordPress. Register here. There will be talks from local and national leaders in this field, including: Intro to Building Online Communities with BuddyPress – Lisa Sabin Wilson Mind-Blowing Online Engagement – Toby Cryns & Tania Jones Membership Sites Using S2 Member and BuddyPress – Dan Biel BuddyPress as a Directory – John Hawkins Online Communities Now and In The Future – John James Jacoby There will be food. There will be merriment. John James Jacoby, perhaps the world’s best resource for building WordPress communities, will be on hand to update us on the current state of the WordPress community as well as offer his vision for the future of BuddyPress, the WordPress-based online community-building plugin. This event is an official part of WordCamp Minneapolis 2013. BuddyCamp Details Date: Sunday, April 28th, 12-5pm (Brunch will be provided before the first session at noon) Format: 5 Sessions lasting about an hour each Location: Minneapolis Central Library"
