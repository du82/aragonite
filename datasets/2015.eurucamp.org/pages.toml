title = "Childcare"
full_description = "Founded in 2010, Kinderfee is Germany’s leading provider of babysitter and nanny services. The platform works with a network of over 15,000 independent babysitters and nannies across Germany. Your kids will draw pictures, play in the woods, at the beach, on the grass, in a play-room and you can be sure that they will be cared for for the entire weekend. Child care will be provided at daytime on all days of eurucamp core, from 31st July to 2nd August. Evening child care is not provided by eurucamp, but don’t worry, Kinderfee is still there for you. The site is currently only available in German, but if you need help making a booking, please contact one of the team."
