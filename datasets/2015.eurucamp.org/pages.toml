["http://2015.eurucamp.org/guides/accommodation"]
title = "Camping & Hotels"
full_description = "The nearby Bäkeweise camping grounds are reserved for eurucamp attendees on the nights of the conference. The camping area is a 10-minute bike ride from the conference venue. Bringing (or renting) a bike is recommended if you stay at Bäkeweise. By foot, it’s a 25-minute walk. The Mercure Hotel Potsdam City is situated across the street and over the river from Potsdam Hauptbahnhof, which is only 2 stops away from Bahnhof Griebnitzsee (aka 6.8 km to venue). To book a room at the Mercure please write an email to info@mercure-hotel-potsdam.de or call them directly at +49 331 272-2. The hotel can be found on the other side of the S-Bahnhof Griebnitzsee directly at the Griebnitzsee. It will be the hotel where the speakers will stay. The hotel is approximately 2.5 km away from the venue, which would be a nice walk or a short bike ride. It is fairly small hotel surrounded by a forrest and near the water. To book a room at Hotel Forsthaus please write an email to info@hotel-forsthaus-wannsee.de or call them directly at +49 30 8058680 Besides hotels you can also stay in private rooms that are rented from private to private. Our dear silver sponsor Wimdu offers a platform to find apartments like that. You can look here to find one."
