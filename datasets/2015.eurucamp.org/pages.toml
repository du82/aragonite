["http://2015.eurucamp.org/concept"]
title = "Concept"
full_description = "The first edition. The EuRuKo conference was happening in town, expectations far exceeded the plans and many Rubyists got stuck in Berlin without a ticket. The Berlin community reacted perfectly, putting together a parallel event baptised “eurucamp”. The eurucamp crew wanted to repeat the experience of running a relaxed and unconventional conference in Berlin. This time it was done in a big way: 200 attendees came to to the main event plus 60 to the JRubyConfEU. Everyone had fun listening to outstanding talks during a summer weekend (with great weather, by the way) on the shores of the lake. eurucamp and JRubyConf were extended to five days full of activities, 30 speakers, more than 400 people together, becoming the reference conferences for the whole community. And boy did we have fun! eurucamp and JRubyConf took place at HPI Potsdam near Griebnitzsee. Around 400 attendees enjoyed 25 talks. We also improved the festival atmosphere by having an open air stage."
year_published = 2025
