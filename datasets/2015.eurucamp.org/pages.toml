["http://2015.eurucamp.org/guides/arriving"]
title = "Arriving"
full_description = "You should generally find getting to Berlin by plane a straightforward experience. Berlin has non-stop connections to most major European cities, in addition to key cities in the U.S. Berlin has two airpots: Berlin Tegel (TXL) for most airlines and Berlin Schönefeld (SXF) for a few cheaper airlines. Of the two airports, the eurucamp venue is located almost equally far away to both airports. It takes about 40 minutes from Schönefeld (38 km) by car/taxi. From Tegel (27 km) you need approximately 30 minutes with taxi/car to our venue. Just show the address to your driver: Berlin is also a centre of the central European rail network. Direct train connections exist to many German and Eastern European metropoles. Exit your train at the main station (Berlin-Hauptbahnhof)."
