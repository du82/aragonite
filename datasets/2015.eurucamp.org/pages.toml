["http://2015.eurucamp.org/sponsors"]
title = "Sponsors"
full_description = "Babbel the market-leading language-learning app makes it easy to learn anything from English to Indonesian – either from home or on the go with a smartphone or tablet. Since being founded in 2007, Babbel has helped people discover the joy of learning beyond work or school. The company now has more than 300 team members based in Berlin and New York and has up to 120,000 users registering daily. Babbel offers courses through which to learn 14 different foreign languages, each specifically adapted for seven different display languages. Travis CI is a continuous integration platform: We run people’s tests, deploy their code and help them be confident about their work. We have strong roots in open source, both in our community and how Travis CI was built. We continue to support the open source community wherever we can. Travis CI is run as a hosted service, free for open source, and a paid product for private code. It’s also available as an on-premises version (Travis CI Enterprise). We’re a small, bootstrapped business from Berlin, Germany with a team distributed across the globe. Our goal is to help people build better software. Travis CI is profitable, and we’re building a sustainable business for the long run. Recently named one of the five fastest-growing companies in Germany, Blacklane provides a professional driver service around the globe. With availability in over 50 countries worldwide, passengers can easily schedule a ride online or using our mobile app. Blacklane guarantees low, fixed and all-inclusive rates, confirmed at the moment you book. To ensure a seamless customer experience, from registration to ride to payment, our team of talented engineers work hard to deliver a world-class product. Personal development is at the forefront of Blacklane’s work ethos; we hold internal TechTalks and coding sessions so as to better learn from each other, provide a rich library with new books added every month, visit conferences and user-groups regularly, and we never compromise- striving always for the best quality, no matter what!"
