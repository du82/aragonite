["https://2015.eurucamp.org/speakers"]
title = "Speakers"
full_description = "Erik Michaels-Ober has been writing Ruby for almost 10 years. He was a 2014 Ruby Hero award recipient and has been a Rails Girls Summer of Code coach since 2013. He currently lives in Berlin and works at SoundCloud. Floor is involved in many a Rails Girls workshop, developer meetup and tech conference in Europe (currently ROSSConf Berlin and arrrrcamp), which she combines with her duties as Managing Director of sektor5 coworking spaces in Vienna. She considers herself the future Neelie Kroes. Joanne is a RoR developer, eurucamp fan, creative programmer, and this year's keynote speaker.We interviewed her here: http://blog.eurucamp.org/2015/06/30/keynote/. This talk gives a quick introduction into the not so well known Fiddle, which has been a part of MRI since 1.9. It allows direct interaction with C code via a Foreign Function Interface, which enables wrapping native code without compiling C extensions, making the lives of users of your projects much easier. Don't like JavaScript? Don't like CoffeeScript? Want to use Ruby on the backend and on the front-end? Then this talk is for you!Opal is a Ruby to JavaScript source-to-source compiler, which also has an implementation of the Ruby corelib. In this talk we'll examine how Opal works, where it delivers and where it falls short. And above all - we'll have fun! Bozhidar loves computers in general and programming in particular. His fanatic devotion to Emacs is known world-wide. Bozhidar spends a lot of his time on GitHub, contributing to various Ruby, Clojure and Emacs Lisp projects. Believe it or not, Bozhidar has interests outside computers as well! We won't, however, bore you with those here. As a developer, diving in a new code base is not uncommon: you’ve just been hired, you change projects, you want to help an open source project, the open source library your project depends on is buggy, etc. It’s like swimming through a underwater cave, you don’t know what treasures or monsters you’ll find, if the path is treacherous, or if it’s a true labyrinth where you’ll get lost. However, if you plan your visit, you can prepare, equip yourself, and survive to find the gem you’re looking for…"
