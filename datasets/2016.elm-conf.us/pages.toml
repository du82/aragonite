title = "elm-conf 2016"
full_description = "Elm Logo About elm-conf is a one-day conference focusing on the Elm programming language and its libraries, colocated with Strange Loop. It aims to be a welcoming place for people worldwide to meet one another and learn about what is happening with the language and community. Speakers We have a full lineup of great speakers for elm-conf. We have a wide range of topics, from making music to diving into how Elm helps ADHD to using templates for easier maintenance. It's going to be quite a day! View Speakers Download Schedule 9:00 AM Keynote by Evan Czaplicki - Creator of Elm Evan created Elm, a functional language for web programming. He is an open source engineer at NoRedInk, where all front-end code is written in Elm these days. He continues to develop the language, tools, and libraries full time. 9:50 AM Beyond Hello World and Todo Lists by Ossi Hanhinen Have you come into grips with Elm as a language and prolific enough to start using it in a real project? Awesome! Did you already have an idea of how you would structure your application, handle authentication and maybe show toast-like pop up messages in the UI? If not, this talk is for you. 10:40 AM Compilers as Therapists, or Why Elm is Good for ADHD by Luke Westby I have ADHD and struggle to stay focused on things. This has actually been helpful in learning JS since things change as quickly as my attention does, but it makes it hard to finish things. Elm pushes out distractions so I can focus, and at last the first side-project I’ve ever completed is in Elm! 12:30 PM Lightning Talk: Functional Data Structures by Tessa Kelly Elegant data structures are different across programming languages, and creating them should be approached differently. Leverage Elm’s union types to build simple and readable structures, beginning with binary trees. 12:30 PM Lightning Talk: Rich Animation by Matthew Griffith Games and rich applications present a compelling use-case for Elm, but managing dynamic animations can quickly become complicated. Here’s how to succinctly express animation pipelines using the elm-style-animation library and how to architect your animation code in a readable, extensible manner."
