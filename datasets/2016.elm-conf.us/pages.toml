["https://2016.elm-conf.us/about"]
title = "elm-conf 2016"
full_description = "Elm Logo About elm-conf elm-conf is a one-day conference focusing on the Elm programming language and its libraries, colocated with Strange Loop. It aims to be a welcoming place for people worldwide to meet one another and learn about what is happening with the language and community. Buy Tickets Elm-conf is a new conference as of 2016. We want to promote Elm and the ecosystem around it by bringing together the brightest minds in the community for a day of mixing ideas and making connections. Thank you to everyone who helped make elm-conf US a reality! Special thanks to Strange Loop for hosting the conference, to our great sponsors for making it affordable, and of course the talk selection committee: Jessica Kerr and Richard Feldman. It wouldn’t have been possible without you! General organizing principles: We assume you know about Elm already. Beginner talks, while great, are more appropriate for a general-interest conference. A thriving community is built on diversity. We encourage people from all different backgrounds and walks of life to attend and speak. To ensure that all are welcome, we follow and enforce a code of conduct, to which all present at the conference are expected to adhere. Community, not marketing. We don’t give the attendee list to any sponsors. Blind auditions. Talks are selected anonymously by a diverse talk selection committee. Organizers: Brian Hicks (@brianhicks) Joseph Hager (@ajhager)"
