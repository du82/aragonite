full_description = "NoRedInk has the largest commercial Elm codebase in the world, and has hired Elm creator Evan Czaplicki to develop the language full-time. We spend almost all of our front-end coding time writing Elm. Our software helps English teachers, and their students answer millions of questions per day on our site. About half of our 15-person engineering team works remotely from around the world, and the other half is in our San Francisco office. We’re hiring for front-end, back-end, and ops. No prior Elm experience necessary! DailyDrip makes learning easier. Every weekday you’ll get a bite-sized piece of something awesome about a topic you are interested in. Best of all: it only takes five minutes a day. CARFAX is web-based service that supplies vehicle history reports to individuals and businesses on used cars and light trucks, with the most comprehensive vehicle history database available in North America. Founded in 2014, Asteris provides software design and development services for next-generation infrastructure software for the modern datacenter. Take advantage of powerful tools without needing a team of experts to deploy and manage infrastructure. Deploy Mesos, Kubernetes, or Docker Swarm to any cloud in minutes. Manning is an independent publisher of computer books for software developers, engineers, architects, system administrators, managers and all who are professionally involved with the computer business. We also publish for students and young programmers, including occasionally for children. Oasis Digital is a custom software development firm in St. Louis, MO. We create high quality software and solve hard problems, to help our customers thrive. Stripe is an American technology company, operating in over 20 countries, that allows both private individuals and businesses to accept payments over the Internet. Stripe focuses on providing the technical, fraud prevention, and banking infrastructure required to operate online payment systems."
