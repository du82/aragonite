["https://2019.pycon-au.org/conduct"]
title = "PyCon AU 2019 | Code of Conduct"
full_description = "Linux Australia aims to provide fun, welcoming and professional environments so that diverse groups of people - regardless of age, race, gender identity or expression, background, disability, appearance, sexuality, walk of life, or religion - can get together to learn from and be inspired by each other about all things Free and Open Source. Linux Australia is committed to the ideals expressed in our Values Statement and ask all our members, speakers, volunteers, attendees and guests to adopt these principles. We are a diverse community. Sometimes this means we need to work harder to ensure we’re creating an environment of trust and respect where all who come to participate feel comfortable and included. If at any time during the conference you feel unsafe or want to report questionable behaviour, please contact a member of the safety team. Find any volunteer or organiser (green lanyard or green bandana) who will direct you to one of the following people, who you can also message or email directly. Respect yourself, and respect others. Be courteous to those around you. If someone indicates they don’t wish to be photographed, respect that wish. If someone indicates they would like to be left alone, let them be. Our event venues and online spaces may be shared with members of the public; please be considerate to all patrons of these locations. Any public presentation which is part of any event, including but not limited to keynotes, presentations, lightning talks, addresses, mailing list posts and forums, is subject to this code of conduct and thus may not contain: Presenters are asked to avoid language which is not appropriate for an all-ages audience as much as possible. If the subject matter of the presentation cannot be presented adequately without including language that could be considered offensive, this should be pointed out in advance, at the beginning of the talk and in the schedule. If presenters are unsure whether their material is suitable, they are encouraged to show it to the conference’s speaker liaison or mailing list/forum moderators before their session."
