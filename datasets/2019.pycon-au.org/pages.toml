["https://2019.pycon-au.org/talks/web-accessibility-in-django"]
title = "PyCon AU 2019 | Web Accessibility In Django"
description = "Many developers want to build accessible applications,but don't know where to start. This talk will cover common accessibility issues and how to address them. The audience will learn about how disabled users interact with web apps, how to build more accessible sites and W3C accessibility guidelines."
full_description = "Many developers want to build accessible applications,but don’t know where to start. This talk will cover common accessibility issues and how to address them. The audience will learn about how disabled users interact with web apps, how to build more accessible sites and W3C accessibility guidelines. Many developers want to build accessible applications,but don’t know where to start. This talk will cover common accessibility issues and how to address them. The audience will learn about how disabled users interact with web apps, how to build more accessible sites and W3C accessibility guidelines. Like most developers, I’ve always known that building accessible web apps is the right thing to do, but I wasn’t sure how to do it. I tried my best to add image descriptions and audio transcripts and figured that was good enough. I’ve since gotten training in web accessibility, and want to share some of what I’ve learned so we can all build more accessible apps. This talk will go through accessibility concerns on the web through example sites and code with both good and bad accessibility to experience what some users have to struggle with daily. I will cover well-known concerns such as: Common Accessibility Issues: I’ll cover the most common barriers to access and the tools and accommodations people rely on to get around them. Blindness and low-vision: Blindness is what most people think of first when they’re thinking of web accessibility, but there are a lot of myths and common mistakes around making sites accessible to blind and low-vision users. We’ll talk about screen-readers, screen magnification, color contrast, and best practices for links and image captions. Color blindness: I’ll cover resources that can help developers see how their site will look to folks with various kinds of colorblindness, and best practices around using color to distinguish the content. Deafness and hearing difficulties: Applications that require the ability to hear and process sound are inaccessible to folks with hearing difficulties, as well as anyone who’s forgotten their headphones. I’ll talk about best practices around audio and captions. Short and long-term fixes will be demonstrated and taught, with the overall goal being that the participants leave knowing how to find and solve accessibility problems."
year_published = 2025
