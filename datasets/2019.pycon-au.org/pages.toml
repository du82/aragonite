["https://2019.pycon-au.org/attend"]
title = "PyCon AU 2019 | Attend"
full_description = "PyCon AU kicks off with a day for attendees interested in specialist fields. It runs just like a main conference day, any attendees on this day are welcome to attend talks from any or all of the tracks, you can pick and choose and the talk schedules will line up nicely to let you do that. With four very different tracks there’s something for everyone and each track will have a mix of beginner friendly and in-depth specialist talks. The four tracks are: Security and Privacy, DjangoCon AU, Education, and Science and Data. Each track is organised by specialists in their field, the talks are selected from all submissions by the track organisers in coordination with the program committee. This is the core of PyCon AU, as each day kicks off one of our amazing keynote speakers, followed by four tracks of talks on a diverse range of Python related topics. There will be a mix of beginner friendly and advanced talks on both technical and non-technical topics, with four tracks there’ll always be something you’re interested to see. This year we’re adding in deep dive talks to make extra space for some deep and advanced Python goodness. The end of the day brings everyone together again for a hilarious and informative round of lightning talks (submission of lightning talks topics will be open during the conference). Python wouldn’t have gotten to where it is without a welcoming community of developers building cool things together. The development sprints are an open space for people to work on projects with a particular focus on open source projects. The sprints are a place for everyone from experienced open source contributors to interested first-time contributors and anyone really! Maybe you want to hang out and try out an idea you have, maybe you’d like to find collaborators for a project you want to start, maybe you’d like someone to help you through your first attempts at open source. We’ll provide tables, chairs, wifi, power and a community of supportive developers."
