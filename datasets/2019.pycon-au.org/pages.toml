title = "PyCon AU 2019 | The Unspeakable Horror of Discovering You Didn't Write Tests"
description = "I didn't write tests. I'm here to help you avoid making the same mistake."
full_description = "Public service announcement: if you don’t write tests, you will instead write code for a time machine to go back and train a band of feisty raccoons to dump grape jelly on the head of your past self because you’ll have realized she is a terrible, lazy, no good awful person. If you are new to Python programming and see testing as a thing you’ll get around to eventually, this talk is for you. Or if you’ve been writing Python for a while but have yet to believe in the magic of testing, this talk is for you. If you hate tests, and Python, and people who talk about tests and Python…maybe go get a donut or something because I don’t think you’ll like this talk. Melanie is a creator, tinkerer, and aspiring do-gooder. She does Python-y things with Django, and feelings-y things with a cool service she made called Five Up. She’s mentally ill and doesn’t mind talking about it. One time she met Scott Bakula."
