["https://2019.pycon-au.org/about"]
title = "PyCon AU 2019 | About"
full_description = "The first day of PyCon AU is dedicated to specialist tracks. These tracks, also known as ‘mini-confs’, are curated by smaller specialist groups within Python community, and allow for more in-depth talks on the subject. The weekend of PyCon AU, traditionally the Saturday and Sunday, is the main conference event. We invite speakers from all backgrounds and levels of knowledge to share their experience and knowledge with our audience. Following three days of talks, we hold space in our venue for two days of Development Sprints (sometimes shortened just to ‘Sprints’) Since you’ve travelled all the way to Sydney for a Python event, why not stay an extra day or two and stretch your legs in the new things you’ve learnt, or dive into some interesting projects you’ve heard about over the weekend? Development Sprints provide an unstructured location for projects and contributors to work in real time on their projects, or for people to hack about with various things with people with experts in their fields. The sprints are uncatered, but the conference will provide copious amounts of table space, power, and internet connectivity. PyCon Australia (“PyCon AU”) is the national conference for the Python Programming Community, bringing together professional, student and enthusiast developers with a love for developing with Python. PyCon Australia informs the country’s Python developers with presentations, tutorials and panel sessions by experts and core developers of Python, as well as the libraries and frameworks that they rely on."
