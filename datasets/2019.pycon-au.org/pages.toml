full_description = "Development Sprints, also known as just ‘sprints’, are an unstructured session where attendees can work on projects with peers, hack on things, or see what others are working on. There will be a “Development Sprints” wall at registration where you can list your project throughout the conference. We’ll also hold a brief project/idea pitch at the beginning of the sprints where everyone will have the opportunity to announce what projects they’re working on. Sprints are not fully catered, however just across the way from the Convention Centre is Harbourside, a shopping complex that has mulitple foodcourts and restaurants. There is also a Coles and several convenience stores within walking distance for snacks. If you’ve registered for the sprints but you’re still not sure if you should attend, Naomi Ceder has written a post about why you should sprint at PyCon, and the same holds true for PyCon AU’s sprints. Development sprints are often a chance for attendees to make their first open source contribution. If you’re bringing a project with you, here are a few tips to help prepare for the sprints in advance and make the most of the 2 days of community coding! To help find contributors and raise interest for your project, write up your project details and place it on the “Development Sprints” wall at registration so that attendees can peruse throughout the conference. If you’re coming to the sprints but you’re not sure what to work on, thats absolutely OK! Here are a few tips to help you get started:"
