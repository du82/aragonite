title = "PyCon AU 2019 | Sponsor"
full_description = "PyCon Australia gratefully acknowledges the support of our sponsors, without which the conference could not go ahead. If you are interested in sponsoring, please download our sponsor prospectus, and get in touch! PyCon Australia gratefully acknowledges the support of our sponsors, without which the conference could not go ahead. If you are interested in sponsoring, please download our sponsor prospectus, and get in touch! Spriggy is a rapidly growing Australian start-up, based in Sydney. Spriggy is on a mission to educate kids about money in an increasingly cashless society, to help prepare them for the future and deliver real value to families. Established in 2016 by co-founders Mario Hasanakos and Alex Badran, more than 250,000 Aussie members have already chosen Spriggy to teach kids to make better decisions with their own money. A multi-award winning Australian fintech startup, Spriggy has been featured on the H2 Ventures / KPMG Fintech 100 Emerging Star list among international tech giants, recognised as the Best Banking Innovation by Finder in 2017 and was named Best Fintech Startup at the 2018 Australian StartCon Awards. We love Python. Our platform has been developed in Python from day one and we are proud to have the opportunity of supporting PyCon AU and the Python community. If you would like to talk to us about the challenges we've faced and overcome in our journey to date, come and find us at the conference! We're a business where the team is encouraged to tackle problems head on, challenge the status-quo, to learn and grow - not only as individuals but as a team. If you love Python and what we're about, we're always looking for talented engineers to join our team. Head over to our website, email us at pyconau@spriggy.com.au or come and have a chat during PyCon AU. Find out more about us at https://sprig.gy/pyconau WSP Digital is the software engineering division of WSP, a publicly listed global consulting engineering company with over 50,000 employees in more than 50 countries. We work with WSP's other engineering disciplines and directly with customers to deliver custom web and mobile applications, systems integration and IoT implementations. Python has been our language of choice for over 7 years - in that time we've deployed Python code for clients including VicRoads, Qantas, Myer, Coles, Telstra, BOC, State and Federal Government departments and many others. We have active projects using Django, Twisted, Celery, Channels, Pandas and many other open source tools from the Python community, so we're very happy to have this opportunity to make a small contribution in return. Our team is made up of 40 software engineers, business analysts, test engineers and project managers, including a number of interns and graduates. We take great pride in providing an environment that encourages software engineering excellence through collaboration, informed debate and learning - we believe that our commercial success is directly related to the quality of what we produce and the talent and commitment of our team."
