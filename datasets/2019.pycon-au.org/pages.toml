title = "PyCon AU 2019 | Invited Speaker - VM Brasseur"
full_description = "We are thrilled to announce our first Invited Speaker for PyCon AU 2019 - VM Brasseur!She will be speaking on the real costs of Open Source Sustainability. VM (aka Vicky) spent most of her twenty-plus years in the tech industry leading software development departments and teams, providing technical management and leadership consulting for small and medium businesses, and helping companies understand, use, release, and contribute to free and open source software in a way that's good for both their bottom line and for the community. Now, as the Director of Open Source Strategy for Juniper Networks, she leverages her nearly 30 years of free and open source software experience and a strong business background to help Juniper be successful through free and open source software. She is the author of Forge Your Future with Open Source, the first and only book to detail how to contribute to free and open source software projects. The book is published by The Pragmatic Programmers and is now available at https://fossforge.com. Vicky has been a moderator and author for opensource.com, an author for Linux Journal, the Vice President of the Open Source Initiative, and is a frequent and popular speaker at free/open source conferences and events. She's the proud winner of the Perl White Camel Award (2014), the O’Reilly Open Source Award (2016), and two Opensource.com Moderator's Choice Awards (2018, 2019). She blogs about free/open source, business, and technical management at {anonymous => 'hash'};."
