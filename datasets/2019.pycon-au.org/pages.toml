full_description = "Tickets can be reassigned to new attendees via our ticketing system until July 26 2019. If you do choose to made changes after July 9 2019, we cannot guarantee your t-shirt size will be availabile. In the course of registering for the event and related events, personal information will be collected about attendees such as their name, contact details, etc. This information is required to facilitate registration to to the event, for catering requirements, and for organisers or their agents to contact particular attendees as and when required in respect of the event. Attendees who do not disclose this personal information will be unable to complete registration at the event and will therefore not be able to attend. Personal information will only be disclosed to Linux Australia, and to Government agencies where organisers believe disclosure is appropriate for legal compliance and law enforcement; to facilitate court proceedings; to enforce our terms and conditions; or to protect the rights, property, or safety of the event, our attendees, or others. Linux Australia will not sell your personal information to third parties and will not use your personal information to send promotional material from any of our affiliated partners and/or sponsors. From time to time event organisers update their information and website practices. Please regularly review this page for the most recent information about the event privacy practices. All personal information will be kept private and used only for event registration purposes, statistics for future events, and convenience for future event registration. The event may provide attendees with access to a wired and/or wireless network. The access to this network is a privilege and not an entitlement, and must be used appropriately. Inappropriate use includes, but is not limited to: unlawful activities, interfering with the equipment or network access of others and not respecting the reasonable expectations of privacy