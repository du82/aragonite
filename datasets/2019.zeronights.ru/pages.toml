full_description = "Независимое и открытое сообщество, объединяемое интересами в области ИТ и ИБ. Основная цель Сообщества – создание комфортного пространства для обмена опытом и знаниями, для повышения практических навыков специалистов в области информационной безопасности. Defcon Group #7812 объединяет технических специалистов информационной безопасности Санкт-Петербурга, Москвы и других городов России и стран СНГ. На ежемесячных встречах участников Defcon Group #7812 специалисты выступают с докладами и мастер классами по вопросам практической безопасности. Журнал «Хакер» — самый популярный компьютерный журнал России, ориентированный на людей, увлеченных информационной безопасностью и IT в целом, программированием, администрированием и строительством информационных систем. Каждый месяц: описания свежих уязвимостей, лучшие вирусы и трояны, истории компьютерных взломов, практические кейсы в области программирования и системного администрирования, все новые технологии, секреты и трюки в использовании компьютеров. «BIS Journal» — специализированное отраслевое издание об информационной безопасности кредитно-финансовых организаций. Содержит оперативную, полную и достоверную информацию по всем аспектам развития отрасли: освещает нововведения в области законодательства, регламентов и стандартов, актуальные требования регуляторов, инструментарий информационных атак и средств защиты, динамику рынка предложений интеграторов, деловые мероприятия и профильное образование."
