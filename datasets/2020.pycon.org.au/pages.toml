title = "PyCon AU 2020"
full_description = "Journey into the Deep World of Web Development Fri September 04, 04:00 PM–04:25 PM • Back to program Start time 16:00 End time 16:25 Countdown link Open timer This talk mentions briefly about my job loss during COVID-19 pandemic. A story of a construction project manager who fell into the deep world of Django and Python Are you from a non-tech industry but want to learn web development? Have you tried doing the official Django tutorial and had no idea what was going on? This talk is a story about how I learnt Django and Python coming from a non-tech industry, during the COVID-19 pandemic. I will cover tips for beginners on how best to get started with Django and Python. I will be sharing about mistakes that I made, resources that I found useful, and how I created connections both online and offline. Andrew Kim He/Him 🙋🏻‍♂️ Hello, I'm Andrew Kim I'm a client-side construction project manager living in Melbourne, Australia. I am a Django and Python hobbyist trying to code a software that I think would benefit my industry. Twitter: @dearandrewkim Website: www.dearandrewkim.com"
