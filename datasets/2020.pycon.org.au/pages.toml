["https://2020.pycon.org.au/program/JZW83Q"]
title = "PyCon AU 2020"
full_description = "Oops! I Became an Open Source Maintainer! 😱 Fri September 04, 09:15 AM–10:10 AM • Back to program Start time 09:15 End time 10:10 Countdown link Open timer I consider myself relatively new to the open source world; my first open source contribution was in summer of 2016. Pretty soon I found myself being given commit rights to other people’s open source projects. Being a new open source maintainer brings a set of unique challenges that I was not fully prepared for. In this talk, I will share my journey and the things I’ve learned along the way, and some advice for other aspiring open source maintainers and contributors. . Mariatta she/her Mariatta is a Python Core Developer, a software engineer at Zapier, Vancouver PyLadies co-organizer, and one of the founding members of the PyCascades conference. She moved to Canada almost two decades ago, and now lives in Vancouver with her husband and two children. In her free time, she contributes to open source, builds GitHub bots, fixes typos, and likes to tell you about f-strings. Her favorite emoji is :stuck_out_tongue_closed_eyes:."
