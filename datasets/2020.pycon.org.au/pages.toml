["https://2020.pycon.org.au/about"]
title = "PyCon AU 2020"
full_description = '''Latest news PyConline AU 2020 is over published 07 September, 2020 It's conference time! published 04 September, 2020 Conference Program & Registration published 12 August, 2020 Specialist Tracks + Call for Proposals published 17 June, 2020 PyConline AU, 4–6 September 2020! published 10 June, 2020 PyCon AU is going online! published 08 April, 2020 About the conference PyConline AU 2020 was held on the Internet, in the Curlyboi Convention Centre. If you're new to our event, you might also want to read about the culture of PyCon AU. 4 Sep: Specialist tracks The first day of PyConline AU was dedicated to specialist tracks. These tracks, also known as ‘miniconfs’, were curated by smaller specialist groups within Python community, and allowed for more in-depth talks on the subject. This year we had five fantastic tracks: DjangoCon Australia: returning for their eighth year, this track is all things Django. Stories and fairy tales about Django, web development in Python, ponies, and unicorns 🦄! Security and Privacy: How (and why) to be safe on the Big, Scary Internet, and avoid being the next headline data breach. Education: Learn about learning, teach about teaching, and educate about education Science, Data, & Analytics: Data and number crunching, analysis and visualisation, machine learning, and how those things affect us human beings. DevOops: Learning from Failure: as their inaugural PyConline appearance. “Learn from our failures, or teach us about yours”. 5 Sep: Conference main track Saturday was the main conference event of PyCon AU condensed down to a single day. We invited speakers from all backgrounds and levels of knowledge to share their experience and knowledge with our audience. Saturday's content was spread across four channels running simultaneously—and since we're not in a brick-and-mortar venue this year, we're not contractually obliged to use someone else's names for our channels, so we've had a bit of fun. The Curlyboi Theatre was our plenary hall, named for PyCon AU's mascot (which you can see slithering across the header of this page). The curlyboi was designed by Tania Walker in her 2018 refresh of the PyCon AU brand and has since become a community favourite. The Python 2 Memorial Concert Hall was named in honour of the 2.x release series of the Python language; work on its replacement, Python 3, started in around 2006, but Python 2 reached its end of support in 2020. The Flip Floperator Auditorium was named for the obscure flip-flop operator in the Ruby programming language, which was introduced to the PyCon AU audience and given a shorter, catchier name by Tom Eastman and Merrin Macleod at PyCon AU 2018. The One, Obvious Room referred to one of the aphorisms that notionally describe the guiding principles of Python: "There should be one—and preferably only one—obvious way to do it." The One, Obvious Room is, fittingly, one of the four equally excellent choices available to you. 6 Sep: Development sprints and social events Development Sprints provided an unstructured location for projects and contributors to work in real time on their projects, or for people to hack about with various things with people with experts in their fields. About PyCon AU PyCon AU is the national conference for the Python programming community, bringing together professional, student and enthusiast developers, sysadmins and operations folk, students, educators, scientists, statisticians, and many others besides, all with a love for working with Python. PyCon AU informs the country’s Python developers with presentations, tutorials and panel sessions by experts and core developers of Python, as well as the libraries and frameworks that they rely on. PyCon AU is typically held in two year blocks at the same city. 2010, 2011: Sydney, NSW 2012, 2013: Hobart, TAS 2014, 2015: Brisbane, QLD 2016, 2017: Melbourne, VIC 2018, 2019: Sydney, NSW 2020: The Internet Whenever this is all over, hopefully: Adelaide, SA Videos from previous years can be watched on the PyConAU YouTube channel.'''
