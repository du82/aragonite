["https://2020.pycon.org.au/program/DQM9JQ"]
title = "PyCon AU 2020"
full_description = '''What happens when you run manage.py test ? Sat September 05, 04:35 PM–05:00 PM • Back to program Start time 16:35 End time 17:00 Countdown link Open timer You know what happens inside your test functions, but what machinery operates around that to put the dots (or E's and F's!) on your screen? This talk will open up the internals of Django's test framework and describe the various steps of the test process, and some examples of customzing it. Testing frameworks do a lot of work for us, so much that they can even appear like magic. But if we go under the hood, we can find better ways of working with them. This talk looks at Django's testing framework and pytest together, so it can show the common features as well as the differences. The general test lifecycle will be examined, from start to finish. We'll then use this knowledge to write a couple of customizations. Adam Johnson he/him 👋 Hi, I'm Adam, and welcome to my site. ✍️ I'm an author and "solo consultant" working with Ansible, AWS, Django, and Python. 🦄 I'm a member of the Django project Technical Board (2.2, 3.0, and 3.1 release cycles), and a co-organizer of the The London Django Meetup. 🇬🇧 I'm based in London, UK. ✈️ I love to travel, especially to Django and Python conferences! ☕️ I drink tea, and especially enjoy a genmaicha.'''
