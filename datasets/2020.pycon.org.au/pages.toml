["https://2020.pycon.org.au/program/BPPLYM"]
title = "PyCon AU 2020"
full_description = "The Software Engineering Part of Data Science Fri September 04, 10:25 AM–10:50 AM • Back to program Start time 10:25 End time 10:50 Countdown link Open timer Data science and software engineering are getting more and more intertwined with each other. But what is the common grounds between the two? How do we define the boundaries of the two disciplines? This talk will discuss the role of python in terms of development process for software engineers working in a data science environment. We will also tackle the different aspects of software engineering in relation to working with a data science oriented team. In this session, I will discuss the software engineering side of data science and how python bridges the gap between data science and software engineering. Will highlight some of the challenges involved in working with data scientists. Will also demonstrate some sample codes and best practices that shows how to work as a software engineer in a data science company. Lastly, I will discuss how software engineers can shift to a more data science related job like a data engineer. Outline: Intro: Data science vs software engineering Challenges working with a data science team and how Python bridges the two domains Common problems and solutions Development setup Performance considerations Deployment Transitions from software engineering to data science Niño Eclarin Hi, I'm Ninz. I am a software engineer in the Philippines. I've worked with several startups in the past and currently working at Hacarus(focus on backend and machine learning integration). I am currently taking my Masters degree in Computer Science here in the Philippines. My interests are Astronomy, Physics and Cooking :P"
