["https://2020.pycon.org.au/program/CRSJXF"]
title = "PyCon AU 2020"
full_description = "Of Django, PostgreSQL schemas, and your multi-million dollar idea Fri September 04, 05:45 PM–06:10 PM • Back to program Start time 17:45 End time 18:10 Countdown link Open timer Who in their right mind would pick Django -in 2020- to develop a software as a service? Who would even go as far as using PostgreSQL schemas for doing multi-tenancy? Well, according to the star count of some GitHub repositories on the topic, many! In this talk, we'll cover the major challenges of doing multi-tenancy in Django through PostgreSQL schemas. Come along to discover whether all those people are wrong (or not), and whether you'd be de facto wrong (or not) for taking this path. Although rough for the world, 2020 is proving a good year (and decade start) for Django. Boring batteries-included frameworks and established monolith makers are shining again, in a world where the hype-enchantment of JavaScript and micro-everything is starting to wear off and fall into a more mature position of tradeoffs. After 15 years of life, Django continues to prove solid, battle tested, and very capable of major undertakings in the web arena. Over the last decade, the competence of the framework has extended to the SaaS world, through a number of packages that have emerged as viable options for making Django multi-tenant. PostgreSQL concept of schemas has opened a new exploration space for multi-tenancy, by combining the power of RDBMS native isolation with the reduced costs of managing a single database. However, nothing comes for free. The ease of using PostgreSQL schemas for multi-tenancy in Django comes at the expense of some challenges that must be overcome in the short, medium, and long term, if the project seeks to survive while gracefully escaling to success. In this talk we will cover the major challenges of doing multi-tenancy in Django through PostgreSQL schemas. You will learn the pros and cons of the approach as you move from tutorial-grade projects to massive multi-tenant behemoths. By the end, you will be able to answer whether or not this is going to be a feasible approach for your next multi-million dollar idea. Lorenzo Peña I have been using Django for 11 years, since I fell in love with the framework back in 2009, while I was taking a web development class in college. Now a member of the Django Software Foundation, co-creator and maintainer of django-pgschemas and django-unmigrate, and contributor of django-tenants. Former professor of Logics and Programming at the University of Holguín. I currently teach Biblical studies in my local Methodist church."
year_published = 2020
