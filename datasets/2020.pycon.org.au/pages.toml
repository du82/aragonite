["https://2020.pycon.org.au/program/8TA7ZA"]
title = "PyCon AU 2020"
full_description = "Hacking Playable Ads: What REALLY are they? Fri September 04, 01:55 PM–02:20 PM • Back to program Start time 13:55 End time 14:20 Countdown link Open timer Have you ever clicked the 💎 FREE GEMS 💎 button and been served an ad, only to find you're now trialing a game? Come along and learn what those ads really are (and how we can use Python to remove them, all while still keeping your precious gems! 💎😉 ) Have you ever clicked the FREE GEMS button and been served an ad, only to find you're now trialing a game? What are they? Are they running code? If they are, can we hijack them? If we can't, can we bypass, or even replace them? And more importantly, what are they actually doing? Are you really playing a game? Or are they bitcoin miners in disguise? Come along and join my adventurous curiosity as we learn to man in the middle these ads and discover what they're really about! Evan Kohilas He/They Evan is a passionate 5th year Computer Science & Maths Student and Tutor at UNSW. When he's not thinking about security, informatics, or giving talks at conferences, you'll find him running the Security Society of UNSW, nomming on subway cookies, or chasing bunny rabbits."
