title = "PyCon AU 2021"
full_description = "< Back to news CFP closed, Tickets on sale Published 22 June, 2021 We have been overwhelmed by responses to our call for proposals for the second very online PyConline. Our program team is currently reviewing MANY submissions, and curating a schedule for our Friday specialist tracks and Saturday general conference. We anticipate everyone who submitted will hear from us about their talk within one month of the CFP close, or before July 10 2021 (hopefully earlier!) While you wait, we want to get you excited about PyConline AU regardless of the program. With that, we're happy to announce tickets are now available! Our prices remain consistent with last year, with Enthusiast tickets at $29, Professionals at $79, and Contributors at $300. Students can attend for only $10 upon confirmation of a valid student ID. All prices in AUD including GST. For more details, and to secure your ticket, enclicken the button vv Get your PyConline AU tickets! We hope to see you online! SOON, Katie McLaughlin she/her Communications Director PyConline AU 2021"
