["https://2021.pycon.org.au/program/3B8SEP"]
title = "PyCon AU 2021"
full_description = '''A capital letter, a number, a special character, an emotional journey for the character, a subplot, and a twist ending Fri September 10, 03:00 PM–03:30 PM • Back to program Session Type Live Start time 15:00 End time 15:30 Countdown link Open timer The humble password is broken. The internet is littered with poor security practices and password breaches, but the world is not ready to go password free yet. So what can we do to protect our users? Let's take a look at how we currently protect passwords, at what we can throw away from those processes and what we can bring in to help strengthen our users' passwords. We'll investigate the tools, practices and APIs that can help us in this endeavour. Together we can move the world from "password1" to "correct horse battery staple" and beyond! The humble password is broken. The internet is littered with poor security practices and password breaches, but the world is not ready to go password free yet. So what can we do to protect our users? Let's take a look at how we currently protect passwords, at what we can throw away from those processes and what we can bring in to help strengthen our users' passwords. We'll investigate the tools, practices and APIs that can help us in this endeavour. Together we can move the world from "password1" to "correct horse battery staple" and beyond! philnash he/him Phil is a developer evangelist for Twilio and a Google Developer Expert living in Melbourne, Australia. He loves building web applications and tools to help developers. He once helped build a website that captured everyone's favourite sandwich fillings. He has too many GitHub repositories and you can find him working on some of them live on Twitch. Away from the keyboard, Phil listens to ska punk, hangs out with his miniature dachshund (also called Ruby), and is on a mission to discover the world's best beers. Phil tweets at @philnash, and you can find him elsewhere online here.'''
