["https://2021.pycon.org.au/program/D38FLT"]
title = "PyCon AU 2021"
full_description = '''The Butterfly Effect: How a single bit changed my career Fri September 10, 09:30 AM–10:00 AM • Back to program Session Type Pre-Recorded Start time 09:30 End time 10:00 Countdown link Open timer I relate the story of a single bit gone wrong back in 2006, which launched my career on a new trajectory of root-cause analysis, continuous improvement, and DevOps. In 2006 I had just started a new job when a bad release brought every one of our hundreds of customers mail servers to its knees. In this talk, I'll walk through a high-level "incident postmortem" of this event, the lessons I (and my team) learned, and how this years-ago incident changed my career and paved my way toward DevOps. Jonathan Hall Jonathan Hall is a DevOps Coach focused on helping small companies accelerate software delivery and improve quality.'''
