["https://2021.pycon.org.au/social"]
title = "PyCon AU 2021"
full_description = '''🐍 Social Events 👯 With the lockdowns in many parts of Australia and New Zealand, we are an extremely online event. Excessively so. Since we can't have viewing parties, let's ramp up the social with extremely online social events! We have had many people offering to run many things. Details about capacity, access, etc, will be available closer to the event. All times shown in AEST (UTC+10:00) Friday evening 🎤 Online Karaoke Bring your absolutely best voice and a microphone and let’s sing away our hearts! When: 7pm-8:30pm Where: Venueless (# Social event video chat [1] channel) and Watch2Gether. Send your song requests via this form Requirements: Camera and microphone, browser with access to youtube and Watch2Gether Capacity: Up to 30 people Hosts: Peter Hall and Harshal 🍣 Dinner-side chat about machine learning Wanna chat about machine learning while enjoying your dinner? Say no more. When: 7pm-9pm Where: Venueless (# Social event video chat [2] channel). Requirements: Camera and microphone Capacity: Up to 20 people Host: Thomas Chen Saturday evening 🥙 Dinner with PyFriends All attendees, speakers, volunteers and organisers welcomed to our virtual dinner party! Sure, bring your kids, your dogs, cats and pet kangaroos. When: 7pm-9pm Where: Zoom meeting, to be announced in Venueless (channel #Social events). Requirements: A device with Zoom installed. Please note that web clients do not support breakout rooms, so cannot be used. Capacity: Up to 500 people can join Host: Cintia Del Rio Sunday ⛰️ Staircase sprint (docs) Staircase sprint! No, not that sort of staircase and not that sort of sprint (thankfully). Have you been wanting to contribute to an open source project? This is an opportunity to be guided in contributions to staircase, a python package used for data analysis and designed to operate as part of the "pandas ecosystem". A backlog has been put together for PyCon AU 2021, with contribution difficulties ranging from beginner to advanced. Documentation https://www.staircase.dev Repository https://github.com/staircase-dev/staircase Discussion page (github) https://github.com/venaturum/PyConAu2021-staircase/discussions When: starting from 10:30am Where: Venueless (channel #Starcase Dev Sprint) Requirements: git installed (and basic knowledge of operation), Python 3.7 or higher, github account, working knowledge of pandas Capacity: Up to 10 people Host: Riley Clement ⚡️ Lightning talks Yes, they are back this year! Submissions will happen until Saturday 1pm, so make sure to submit your ideas! When: 11am-12:30pm (See Program) Where: Venueless (Stage Lightning Talks) Capacity: No limits on spectators! Host: Christopher Neugebauer and Libby Berrie 🎲 RPG one-shots (Little Trouble in Big Absalom) Two sessions will be available on Sunday, each one for 6 people and lasting around 3.5h. Expression of interest will be available by Friday, and participants selected by Saturday. No preparation nor previous experience needed. When: 9am-12pm for morning session, 1pm-5pm for afternoon session Where: FoundryVTT, detailed instructions will be sent to selected people Requirements: Check FoundryVTT requirements Capacity: 6 per session; register your expression of interest by Saturday 5pm. Six people will be randomly selected per session, and they will be notified by Saturday 6pm via venueless and email. Host: Henry Walshaw 🌐 0 A.D. (game site) Ancient warfare is your thing? Buckle up then! When: 3-5pm Where: Venueless (# Social event video chat [2] channel) and 0 A.D. Requirements: A device with 0 A.D. game installed (check game requirements) Capacity: Up to 8 players Host: Joshua Hesketh 🎤 Family-friendly karaoke Got some kids to entertain at home? Fear no more. Yes, we will sing Let It Go until the neighbours complain. Bring your absolutely best voice and a microphone and let’s sing away our hearts! Yes, bring your musical instrument, that's the best thing I've seen in karaokes. When: 3:30pm-5pm Where: Venueless (# Social event video chat [1] channel) and Watch2Gether. Send your song requests in advance via this form Requirements: Camera and microfone, browser with access to youtube and Watch2Gether Capacity: Up to 20 people Hosts: Peter Hall and Harshal 🚗 MarioKart 8 Deluxe Of course, MarioKart is back. When: 2-3pm Where: Nintendo network and Venueless (# Social event video chat [1] channel); instructions to be shared in Venueless channel #Social events Requirements: Nintendo Switch console, Nintendo Switch Online subscription, Mario Kart 8 Deluxe game (2 players in the same room can share a console) Capacity: No upper limit Host: Leigh Brenecki 🍄 Mario Party No party is good enough without a Mario Party. When: 5-6pm Where: Nintendo network and Venueless (# Social event video chat [2] channel); instructions to be shared in Venueless channel #Social events Requirements: Nintendo Switch console, Nintendo Switch Online subscription, Mario Party game Capacity: 4 max per game, but multiple concurrent games can happen. Host: Leigh Brenecki More social! There will be two hallway video chat channels and one text channel in venueless available throughout the whole conference. Make sure to check them out, it's a great opportunity to hang out and chat and meet amazing new people from our community. If you'd like to host a games or organise any social events, there will plenty of time during breaks or on Sunday. If you'd like to book a video chat or you'd like a new text channel, drop a message to #Social events channel.'''
