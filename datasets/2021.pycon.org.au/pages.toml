["https://2021.pycon.org.au/program/JJ9NTN"]
title = "PyCon AU 2021"
full_description = "Education Track Welcoming Address Fri September 10, 09:00 AM–09:15 AM • Back to program Session Type Live Start time 09:00 End time 09:15 Countdown link Open timer Opening announcements for the track The organisers for the Education track will open their track for the day with some announcements. Amanda J Hogan She/her Amanda is a teacher at a co-educational secondary school in Sydney. She's been trying to find really effective and engaging ways to teach students how to solve problems with code for some time now with mixed success. She is a contributor, content creator and tutor for the Sydney branch of the Girls Programming Network. She is the current treasurer of the ICT Educators professional association in NSW and in that role tries hard to mentor new teachers or teachers new to computing. She always has some project on the go from e-textiles to making web tools to make her life easier. In a former life she was a database and web developer. In her opinion Python is the best mix of power and ease of use for beginner programmers. In her spare time she throws herself at bouldering walls or rides her bike. Nicky Ringland she/her Nicky is joining from the Gadigal Lands of the Eora Nation. Dr Nicky Ringland is a Product Manager at Google, working on Open Source Software tools. She is passionate about advocating for the user and driving consensus while solving gnarly problems. A recovering academic with a background in Computational Linguistics, Nicky completed her PhD at the University of Sydney. (Her thesis involved thinking hard about the names of things, then training a computer to do the thinking for her.) She went on to co-founded Grok Learning, an edtech startup teaching hundreds of thousands of students to solve problems with code, and the Girls' Programming Network Australia, which runs free workshops introducing coding and computer science to school students across Australia. Named one of Australia's “Superstars of STEM” and 2018 AFR Women of Influence, Nicky is passionate about teaching the next generation the skills they need to become the creators of tomorrow."
