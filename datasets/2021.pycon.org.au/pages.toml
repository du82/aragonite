["https://2021.pycon.org.au/program/8HLVVS"]
title = "PyCon AU 2021"
full_description = "Things might go wrong in a data-intensive application Fri September 10, 02:15 PM–02:45 PM • Back to program Session Type Pre-Recorded Start time 14:15 End time 14:45 Countdown link Open timer We are going to go behind the scene of building a data-intensive system. The story includes challenges I have faced and what I learned from those incidents. We always want to do things right at the very first. Have a faultless architecture design, 100% test coverage, things like that. However, after running a data-intensive system for many years, I realize so many unimaginable things can happen in production. This talk will help audiences avoid making the same mistakes so they don’t suffer as I did. Audiences may be inspired by this talk and help them to build a scalable and reliable system that stands the test of time. Petertc Chu Open-source enthusiast, Pythoneer. Research engineer worked on backend/SRE/DevOps, experienced in implementing and maintaining distributed/software-defined storage at scale. http://hrchu.github.io"
