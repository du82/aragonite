full_description = "PyConline AU sponsors PyCon AU is the national conference for developers using the Python Programming Language. Hosted annually since 2010, this event brings the national and international Python community together. The conference could not run without the generous support of our sponsors. We thank them for their financial commitment, and ongoing support and encouragement to make PyConline AU a special moment for our vibrant developer community. Please take a moment to get to know the 2021 PyConline AU sponsors: Canva, WSP Digital, Octopus Energy, Google Cloud, Elastic, Planet Innovation, Thoughtworks, Python Software Foundation, Twilio, our media partners, our contributors, and of course Linux Australia! Platinum Sponsors Canva is a free online visual communications platform with a mission to empower everyone in the world to design. Featuring a simple user interface and a vast range of templates ranging from presentations, social media graphics, posters, apparel, videos, plus a huge library of fonts, stock photography, illustrations, video footage, and audio clips, anyone can take an idea and create something beautiful. Canva’s powerful collaboration and communication features are empowering teams to streamline their design processes, with customers including American Airlines, Live Nation, Kimberly Clark and Salesforce. Visit canva.com | Follow Canva on LinkedIn WSP Digital is the digital technology division of WSP, a publicly listed global consulting engineering company with over 50,000 employees in more than 50 countries. We work with WSP's other engineering and professional advisory disciplines and directly with customers to deliver custom platforms, systems integration, IoT, analytics and digital twin implementations. WSP Digital incorporates Software Engineering & Systems Integration, Geospatial, Data & Analytics, Visualisation, Digital Engineering and Platform Engineering. Our experts are supported by a team of Account Managers, Project Managers, Business Analysts, Testers and Customer Support personnel to ensure that we provide complete end-to-end services to our customers. Python has been our language of choice for over 9 years - in that time we've deployed Python code for clients including Department of Transport, Department of Defence, VicRoads, Qantas, Myer, Coles, Telstra, BOC, State and Federal Government departments and many others. We have active projects using Django, Twisted, Celery, Channels, Pandas and many other open source tools from the Python community, so we're very happy to have this opportunity to make a small contribution in return. Our team is made up of over 60 software engineers, business analysts, test engineers, project managers, data scientists, visualisation and GIS experts, and includes a number of interns and graduates. We take great pride in providing an environment that encourages software engineering excellence through collaboration, informed debate and learning - we believe that our commercial success is directly related to the quality of what we produce and the talent and commitment of our team. Visit WSPDigital.com | Follow @WSP_Australia on Twitter Gold Sponsors Help us make a big green dent in the universe. We're on a mission to drive the global renewable energy revolution, and we need loads more people to help us make our vision a reality. Octopus Energy Group is an energy tech company. We use technology to make green electrons cheap and revolutionise customer experiences. Kraken is our revolutionary energy tech platform, built around the customer. Kraken promotes a culture of customer centricity, grounded on delivering simple processes and straightforward interactions. Built around a scalable, cloud-based architecture running continuous deployments, Kraken’s ability to help teams innovate and accelerate is second-to-none. As well as all that, Octopus Energy for Business supplies green energy to over 20,000 companies, Octopus Electric Vehicles helps make clean transport cheaper and easier, Octopus Energy Services brings smart products into thousands of homes, and Octopus Centre for Net Zero is a multi-disciplinary research organisation helping Governments and industry reach net zero sooner. Engineering standards are high. We pair program, thoroughly review and test code before it deploys, and maintain fast, high-value test suites. We have weekly tech talks, monthly blitz-days (eg sharpening our internal tools, upgrading dependencies) and can often be found at tech meet-ups and conferences. Our coding conventions are open-source and we maintain a tech blog. Octopus is a great place to learn, work with some talented engineers and level-up your skills. We are providing a great opportunity to help shape the development of Australian market specific functionality into our global energy platform. Visit www.linkedin.com/company/octopusenergy/ | Follow @octopusenergy on Twitter Google Cloud helps you build Python applications quicker with deeply integrated SDKs and IDE integrations. These enable you to quickly scale as big, or small, as you need on App Engine, Cloud Functions, Cloud Run, or Google Kubernetes Engine. Visit cloud.google.com/developers | Follow @googlecloudtech on Twitter Digital Sponsors Elastic makes data usable in real time and at scale for enterprise search, observability, and security. Elastic solutions are built on a single free and open technology stack that can be deployed anywhere to instantly find actionable insights from any type of data — from finding documents, to monitoring infrastructure, to hunting for threats. Thousands of organizations worldwide, including Cisco, Goldman Sachs, Microsoft, The Mayo Clinic, NASA, The New York Times, Wikipedia, and Verizon, use Elastic to power mission-critical systems. Founded in 2012, Elastic is publicly traded on the NYSE under the symbol ESTC. Learn more at elastic.co. Visit www.elastic.co | Follow @elastic on Twitter Planet Innovation is a HealthTech Innovation and Commercialization company. We exist to create breakthrough products and commercially successful businesses that transform industries and have a positive impact on the world. We develop regulated biomedical products and hi-tech connected devices. Our capabilities includes not just software engineering but also industrial design, manufacturing, mechanical engineering, electronics engineering and science. Looking for a career in a high-achieving workplace where software is not just software? Our team is at PyCon Australia - let's talk! Visit planetinnovation.com/about/careers | Follow @planetinnovate on Twitter Thoughtworks is a global technology consultancy that integrates strategy, design and engineering to drive digital innovation. We are 9,000+ people strong across 48 offices in 17 countries. Over the last 25+ years, we’ve delivered extraordinary impact together with our clients by helping them solve complex business problems with technology as the differentiator. We help engineer your data future, through building the next generation of data-driven products, platforms and culture that allow you to unlock new sources of value. We combine applied machine learning solutions with human-centred thinking and our heritage of software engineering excellence to embed lasting differentiated capabilities in your organisation. To find out more about our data services, checkout our Data & AI practice and visit our careers pages to learn about life at Thoughtworks and see open roles. Visit thoughtworks.com | Follow @Thoughtworks on Twitter The mission of the Python Software Foundation is to promote, protect, and advance the Python programming language, and to support and facilitate the growth of a diverse and international community of Python programmers. The majority of the PSF's work is focused on empowering and supporting people within the Python community. The PSF has active grant programs that support sprints, conferences, meet ups, user groups, and Python development efforts all over the world. In addition, the PSF underwrites and runs PyCon US, the primary Python community conference. Being part of the PSF means being part of the Python community. Recently we changed the PSF to an open membership organization, so that everyone who uses and supports Python can join. To learn more, visit https://www.python.org/psf/membership. Visit python.org/psf Twilio powers the future of business communications. Enabling phones, VoIP, and messaging to be embedded into web, desktop, and mobile software. Twilio has democratized communications channels like voice, text, chat, video, and email by virtualizing the world’s communications infrastructure through APIs that are simple enough for any developer to use, yet robust enough to power the world’s most demanding applications. By making communications a part of every software developer’s toolkit, Twilio is enabling innovators across every industry — from emerging leaders to the world’s largest organizations — to reinvent how companies engage with their customers. Visit www.twilio.com | Follow @twiliodevs on Twitter Contributors We thank everyone who purchased a Contributor ticket. They are directly helping fund our financial assistance efforts for future events: 11 anonymous contributors Daryl Tester Geoff Pidcock Jack Skinner from CTOforHire.com.au Patrick Quinn-Graham Richard Autry from BrainGu Media Partner The wonderful team at Next Day Video are making the entire event look and sound great. Media Partner Chris (ctrix.net) is the mastermind behind our Tech Tips video, and has been providing world-class media support for our entire event. Auspice Linux Australia is the peak body of Open Source communities in Australia. Linux Australia represents approximately 5000 Australian users and developers of Free Software and Open Technologies, and facilitates internationally-renowned events including linux.conf.au – Australasia’s grassroots Free and Open Source Software Conference. Visit linux.org.au | Follow @linuxaustralia on Twitter Sponsorship Opportunities Thank you to all the sponsors who made PyConline AU 2021 such a memorable moment for our community. PyCon AU will run in 2022, but its format (and optimistically, location) are yet to be determined. If you would like to hear from us regarding early sponsorship opportunities for 2022, please email sponsorship@pycon.org.au to register your interest."
