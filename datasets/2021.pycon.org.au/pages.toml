["https://2021.pycon.org.au/program/HNK9YE"]
title = "PyCon AU 2021"
full_description = "When a little web app needs to grow up... the journey from a hobby project to production Fri September 10, 03:00 PM–03:30 PM • Back to program Session Type Live Start time 15:00 End time 15:30 Countdown link Open timer A few years ago a small web application was built with Flask over a weekend allowing customers to order a free t-shirt for an event being hosted. It was designed for this single purpose and had never been considered to be needed or expanded beyond that. Within the next six months, the app was adapted to allow breakfasts, hoodies, socks, pens and rubik's cubes ordered for different events. With these new adaptions came added complexities. Originally orders were sent from the app to the supplier via email as soon as customers placed them, whereas as new suppliers were onboarded, a list of all orders were shared at the end of each event. In addition, new and more flexible fields for both customer, shipping and item descriptions were needed to support a wider range of event merchandise. A database was needed! Marketing for each product needed to be added so that custom titles, event descriptions, merchandise and branding could be applied to different pages. Image storage and a form builder was investigated to enable others to create events. An email notification system was developed to send order updates to customers. Security and data privacy had to be considered for sensitive order data. The concept of mini-apps for events was formed so that a subdomain could be generated for each event page. An investigation into moving to serverless or containers was examined to assist handle increased traffic. To help reduce deployment time, continuous delivery patterns were implemented and infrastructure creation was automated. This is the journey on how my small app needed to grow, the decisions that were made along the way, and the fine balance between having the app ready to handle current needs whilst continuing to update architecture and functionality to suit unexpected growth and business requirements. Matt Coles he/him Matt has authored and releasing a number of enterprise mobile applications, worked in mobile device security, and developed global innovations within the chatbot technology space. He now works at a cloud provider helping customers scale their applications."
year_published = 2021
