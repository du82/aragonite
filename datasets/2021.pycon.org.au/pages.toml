["https://2021.pycon.org.au/attend"]
title = "PyCon AU 2021"
full_description = "Thank you for attending PyConline AU 2021! If you'd like to hear more about future PyCon AU events, you can follow us on Twitter, or sign up to our low-volume announcement list. The following is information about how attendance worked in 2021 Quick links for 2021: shirts, culture, social. Attend PyConline AU! As with previous years, we have several types of tickets priced at different levels: Contributor tickets are our top tier ticket. Contributors are recognised as minor sponsors because the ticket price helps fund outreach and diversity programs (such as covering affordable access for students). This year you can also “pay what you want” above the listed price. Professional tickets are for professional Python users attending the conference. If your employer is paying for your ticket or you make a living using Python, please consider this tier. Enthusiast tickets is your ‘general admission’ ticket to the conference, regardless of your python proficiency. Student tickets are available for anyone enrolled in full or part-time educational courses at any level. (Where possible, please register using your Australian education institution email address). You would have got your tickets here Like last year, our event will be hosted on the Venueless platform, allowing for multiple streaming tracks, text channels, video rooms and more. Your link to Venueless will be on your digital ticket. The full schedule can be seen over on our program. Swag is available at our store. See you online!"
