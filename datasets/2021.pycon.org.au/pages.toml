["https://2021.pycon.org.au/program/8RP8QU"]
title = "PyCon AU 2021"
full_description = "Python Type hints and how they can supercharge CS education. Fri September 10, 10:15 AM–10:45 AM • Back to program Session Type Live Start time 10:15 End time 10:45 Countdown link Open timer This talk will walk through Python type hints: what they are, why they should be taught. Specifically we will example how it helps us write better code, and how it can teach a better generation of programmatic thinkers, and design better programs. Python's support for type hints has been increasingly growing over the past several years. This talk will go over what type hints are, an intro to type theory (and why it can be important to teach) and specifically around how type-hints can be used to enable students to understanding better software engineering and critical thinking principles. This talk is based of my experience in learning about type systems for the first time in a software engineering course at UNSW. From then talking to a few highschool students about how to design certain aspects of their HSC Major Works - I realised that use of type-hints would significantly improve their ability to design and reason about manufacturing programming projects. Shrey Somaiya He/Him Shrey is a Course Administrator and Tutor of COMP1511, the Programming Fundamentals course in UNSW's School of Computer Science. He has been teaching in some form for most of his life, and started tinkering with python in early high school. He is also currently the Co-President of the CSESoc UNSW (the resident computing society of UNSW), leading a team of ~150 people to produce social events, podcasts, hackathons, careers events, videos, workshops, peer mentoring, ctfs, assorted technical projects, high-school outreach, and more! Otherwise - Shrey loves cats, music, reading and videogames! Connect with me on Linkedin: https://www.linkedin.com/in/shreysomaiya/"
