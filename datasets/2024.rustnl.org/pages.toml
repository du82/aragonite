["https://2024.rustnl.org/speakers"]
title = "Speakers - RustNL 2024"
description = "RustNL 2024, The Netherlands - May 7 & 8 2024"
full_description = "Alice is a software engineer at Google, where she works on a driver for the Linux Kernel in Rust, as part of the Android Rust team. She is also a core maintainer of Tokio. The Linux Kernel is a very special codebase with a lot of restrictions on how you can write your code. In this talk, you will hear about how Rust has to adapt to work in the Linux Kernel. We will be looking at the kernel's extensive use of linked lists, and how we need to change our Arc to work in that environment, as well as the various unstable compiler features that we are using to make that happen. Raph Levien is a research software engineer on the Google Fonts team, primarily working on GPU font rendering. He’s been actively involved in the Rust community for over seven years, and has worked on pulldown-cmark, the Druid UI toolkit, and other popular crates. He has a PhD from UC Berkeley on the topic of interactive curve editing, and has been involved in font creation and 2D graphics tools most of his career. Xilem is a new UI toolkit designed for high performance and idiomatic expression of UI and app logic, suitable for both desktop and mobile. Xilem is built in a layered architecture. At the top is a reactive layer where views are simple statically typed Rust structs (though type erasure is possible), and no macros are needed. The widget layer is evolved from Druid. At the infrastructure layer is Vello, a 2D rendering engine using GPU compute shaders, specially tuned for dynamic vector graphics content. The text stack is also tuned for performance, including supporting animation of variable font parameters. Accessibility is a primary goal, and integration with AccessKit is baked in from the start. Another goal is interop with other projects in the Rust ecosystem, including wgpu, and providing a clean abstraction layer for widgets. It is work in progress, with a strong open source community driving toward ambitious goals. Nicholas Matsakis is a Senior Principal Engineer at AWS and co-lead of the open source Rust language design team. He has worked on Rust since 2011, and led the design of its “secret sauce”, the borrow checker. He has played a number of other roles in Rust over the years, such as being a member of the Rust core team, the lead of the Rust compiler team, and helping to launch the Rust Foundation. Prior to working on Rust, he completed a PhD at ETH Zurich and did his undergraduate study at MIT."
year_published = 2025
