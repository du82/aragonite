["https://2024.rustnl.org/directions"]
title = "Getting to the Venue - RustNL 2024"
description = "RustNL 2024, The Netherlands - May 7 & 8 2024"
full_description = "Travel from the city center (Delft Station) to the venue through the Delft canals in the RustNL tour boat! Note: Paying for public transport in the Netherlands work with the OV chipkaart, however, you can also pay at each of the OV chipkaart terminals with your bank card or phone. The only thing to keep in mind is that you also have to check out with the same card when you exit the vehicle. For the train, it might be cheaper to get a mobile ticket, which you can read about on the NS website. Note that you can also walk this distance, along the “Schie” canal, which is quite pretty. This takes about 15 minutes. Take bus 69, 174 or 50. Get off at the TU-Mekelpark stop. See walking directions ‘arriving from Rotterdam’. From the Delft city centre or Delft station it is a ~ 20-25 min walk or ~ 8 min bike ride to Lijm & cultuur."
