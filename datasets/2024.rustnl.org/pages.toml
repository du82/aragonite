["https://2024.rustnl.org/workshops"]
title = "Workshops - RustNL 2024"
description = "RustNL 2024, The Netherlands - May 7 & 8 2024"
full_description = "This workshop is focused on setting up communications between a host PC and an embedded system. Having the skills to do this quickly and reliably can help your next project, whether you are starting a project that requires heavy interaction with a host PC, or setting up a testing interface for triggering hardware events, or building tooling to make it easier to see what your system is doing. James will explain the different crates that can be used, how they fit together, and techniques + recipes for solving a number of common challenges. You'll build your own communication link over USB to a microcontroller. This workshop is best suited to developers that are comfortable writing and running Rust on `no_std` microcontrollers already, particularly using the `embassy` framework. You will be provided working projects to start from, and will be expected to customize and extend them to achieve the different goals of the workshop. This workshop is led by James Munns of OneVariable UG. James is the author of the `postcard` crate, and has built dozens of PC-to-MCU links like these for client projects over the past years. James is a software engineer currently living in Berlin. He primarily works with Rust and Embedded Systems. In this workshop we will use a small RiscV microcontroller (ESP32C3, provided by the workshop) to build a connectionless chat application running on your PC written with the Makepad UI library. We will be using the ESP NOW protocol, an IOT protocol that allows you to send and receive messages without being connected to a wifi hotspot. The Rust toolchain and libraries needed to program this MCU are available directly from cargo and crates io, as well as makepad studio and framework. We will use Makepad Studio to write both the MCU program and the chat UI that connects to the ESP32 over USB serial and thus allows sending and receiving these messages from the local space. At end we will hopefully have a working local (lossy) chatroom. Are you a happy Rust developer, who cannot wait but struggles to introduce Rust at their day job? Is the fear of working with foreign code keeping your team from getting to work with your favourite programming language? This workshop is for you!"
year_published = 2025
clearnet = "https://2024.rustnl.org/workshops"
