title = "Privacy Policy - 247 Creative"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "This policy applies to information held about clients and prospective clients, suppliers and prospective suppliers, contacts and all other persons about whom 247 Creative holds information. By ‘information’, we mean personal information about you that we collect, use, share and store. In this policy, “we”, “us”, and “our” means 247 Creative, Chichester Enterprise Centre, Terminus Road, Chichester, West Sussex, PO19 8TX and “you” means the individual to whom the information relates. Our website uses cookies, as almost all websites do, to help provide you with the best experience we can. Cookies are small text files that are placed on your computer or mobile phone when you browse websites. If the settings on your software that you are using to view this website (your Internet browser) are adjusted to accept cookies we take this, and your continued use of our website, to mean that you are fine with this. Should you wish to remove or not use cookies from our site you can learn how to do this by referring to your Internet browser for instructions, however doing so will likely mean that our site will not work as you would expect. So you can easily “Like” or share our content on the likes of Facebook and Twitter we have included sharing buttons on our site. The privacy implications on this will vary from social network to social network and will be dependent on the privacy settings you have chosen on these networks. We use cookies to compile visitor statistics such as how many people have visited our website, what type of technology they are using (e.g. Mac or Windows which helps to identify when our site isn’t working as it should for particular technologies), how long they spend on the site, what page they look at etc. This helps us to continuously improve our website. These so called “analytics” programs also tell us if how people reached this site (e.g. from a search engine) and whether they have been here before helping us to put more money into developing our services for you instead of marketing spend."
