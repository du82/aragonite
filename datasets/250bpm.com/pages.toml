["https://250bpm.com/blog:127/index.html"]
title = "250bpm"
full_description = '''If you read accounts of Nazi Germany, or the USSR, or North Korea or other despotic regimes today, you can easily be overwhelmed by this sense of, “so why didn’t all the sane people just rise up and overthrow the totalitarian monsters? Surely there were more sane people than crazy, evil ones. And probably the sane people even knew, from experience, that many of their neighbors were sane—so why this cowardice?” Once again, it could be argued that common knowledge is the key. Even if everyone knows the emperor is naked; indeed, even if everyone knows everyone knows he’s naked, still, if it’s not common knowledge, then anyone who says the emperor’s naked is knowingly assuming a massive personal risk. That’s why, in the story, it took a child to shift the equilibrium. Likewise, even if you know that 90% of the populace will join your democratic revolt provided they themselves know 90% will join it, if you can’t make your revolt’s popularity common knowledge, everyone will be stuck second-guessing each other, worried that if they revolt they’ll be an easily-crushed minority. And because of that very worry, they’ll be correct! The question I want tackle in this article is: As someone who have lived in the Ostblock (admittedly though, I was 16 when the system collapsed) how did it look like in reality? How was the common knowledge spread at the face of a repressive regime? Did the insight we get from the game theory matter in reality? I am going to ignore the question of how the message of "socialism sucks" got to the people. There was Radio Free Europe, there were samizdats, there were dissidents. But even if you never encountered one of those, all it took was to watch a western film or page through a western magazine to notice that things were just more shiny in the west. (By the way, I read that they are watching South Korean soap operas in North Korea. That's bad news for the the regime.) Anyway, I am going to focus only on how the second-level knowledge, the understanding that other people also believe that socialism sucks, propagated.'''
year_published = 2025
clearnet = "https://250bpm.com/blog:127/index.html"
tags = ["12th,", "common", "irony", "jokes,", "knowledge,", "soviet-era"]
