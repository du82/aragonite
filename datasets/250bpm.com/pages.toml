["https://250bpm.com/blog:113/index.html"]
title = "250bpm"
full_description = "At the end of 1950's my great-grandmother was the last inhabitant of the family farm. One day she locked the door and went away never to return. When we visited the place couple of years ago, the easiest way to get there was to drive to the closest village, then proceed by foot. We had to pass through some fields, then through a forest. Finally, we've descended into a swampy gorge overgrown with vegetation. The path was barely passable. Blackberries and nettles were growing everywhere. We've walked down along the stream. We've passed the cellars, carved into soft tuff rock, that once belonged to the farm. Now they were empty, with no doors and half-filled with water. Then we have arrived at the farm itself. The stone-and-adobe walls were reduced to almost nothing. You could see them sticking out of the thicket here and there and that was it. Eerily, in this country without people, there was an improvised goat shed built out of sticks and plastic foil among the weed, leaning against the remnant of a wall. There were no goats, nor people, to be seen though. I've always considered this part of Slovakia, stretching roughly from the town of Krupina towards Veľký Krtíš and Lučenec, to be an enchanted land. It is wild and mostly empty, with hard-to-access depopulated villages and small farms all over the place. If you travel to the area you will experience a genuine post-apocalyptic feeling. Everything is seemingly falling apart. Nature is taking over. Unemployment rate is around 30%. The region has the highest support for neo-Nazi parties in the country. I never knew much about the history of the region and it was just by a coincidence that I've stumbled upon an interview with a person who wrote a study about what happened to this once populous and prosperous region in the second half XIX. and the first half of XX. century. It was so weirdly (but not entirely) reminiscent of some of the problems that developed societies are facing today that I'll try to recount the story in English to make it available to wider audience."
year_published = 2025
clearnet = "https://250bpm.com/blog:113/index.html"
