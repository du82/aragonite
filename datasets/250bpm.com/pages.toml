["https://250bpm.com/blog:161/index.html"]
title = "250bpm"
full_description = "Swiss political system may be best known for its extensive use of referenda. However, others may argue that its most striking feature is the ability to avoid political polarization. In this respect it may be unique among the western nations. That being said, it is hard to learn much about how it works. First, a big part of the system is informal and thus only discoverable by observing it personally or by asking the locals. Second, it's strongly decentralized. Different rules apply in different cantons and municipalities which makes the topic confusing to study. Third, Swiss aren't especially interested in promoting their own system abroad. A lot of the resources therefore exist only in local languages. In this article I'll try to put together what I've learned by living in the country, speaking to local people, following local press and studying the resources. Still, a disclaimer is due: I am not Swiss. I have lived here only for five years. Neither am I a political scientists or a sociologist. If you are Swiss, or simply know better than me, let me know about any inaccuracies in the article. On the more technical side of things: There's a lot of material to cover, and the result may be rather overwhelming. It would be a small book rather than a long article. Therefore, I am going to split this essay into three or four installments which I will publish one at a time. When modern Switzerland was established in 1848, it was a pretty standard representative democracy, mostly based on the American model. It's a federal state. Federal elections are held every four years. People are represented by political parties. There are two chambers of the parliament. Parliament elects members of the government, who then together run the country. The thriving ecosystem of various voluntary associations resembles the America that Alexis de Toqueville has written about. However, Switzerland is special in that various elements of direct democracy were introduced in the course of history."
year_published = 2025
clearnet = "https://250bpm.com/blog:161/index.html"
