["https://250bpm.com/blog:149/index.html"]
title = "250bpm"
full_description = "After working some more with Tiles, my mini-library for programmatic code generation, I've realized it has a feature that I haven't knowingly baked in, but which makes it a really good tool for the job. Namely, the code you write is composable. Here's what I mean: If you want to generate a C function that prints out names of countries' capitals then you can generate the code that does the actual printing first: The example, of course, shows just two levels of nesting. In practice, however, you'd have many levels of nesting. But whatever the nesting level, you, as a programmer, can focus on a single task at a time. First, you think about how to print the capitals. Then you think about the scaffolding. There's no overlap. Note how you start with writing scaffolding (include, main) then you switch to the business logic (printf), then you get back to scaffolding (return)."
