["https://250bpm.com/blog:163/index.html"]
title = "250bpm"
full_description = "When I've mentioned the failed referendum to limit urban sprawl to a Swiss friend he nodded and casually noted that government is already introducing some anti-suburbanization legislation. And how come that he was not fuming with rage at the government so blatantly ignoring the will of the people? Well, it turns out that vote against a proposal is not a vote for the opposite extreme. Vote against stricter zoning doesn't mean that the zoning should be relaxed. All it means is that status quo is preserved. The referendum has failed and the government could safely ignore it. But while that explains why the Swiss haven't stormed Bundeshaus with pitchforks, it doesn't explain why did the government go an extra mile and introduced legislation clearly inspired by a failed popular initiative. The result of the initiative haven't been spectacular (36.3% in favor) but the preliminary opinion polls have shown much larger support. At times it even looked like the initiative may succeed. So, presumably, a lot of people felt that something should have been done against the urban sprawl, but they disliked the particulars of the initiative. If the underlying tension was not relieved, it would probably lead to similar initiatives in the future. And one of those may succeed. But the government is not particularly thrilled about successful popular initiatives. First, they have no say in the exact wording. Silly things may get in, not because of ill will but because the text of the initiative was written without fully understanding the full scope of the problem and its on-the-ground consequences. Consider one of the government's arguments against the urban sprawl initiative, one, which the authors have clearly overlooked: The initiative would not allow to build greenhouses or poultry halls on agricultural land. The farmers would have to move them to the construction zones where the land is much more expensive. That, in turn, would harm the agriculture. Second, the text of a successful initiative is incorporated into the constitution and is therefore set in stone. From that point on the government has to carefully navigate around its provisions and the more of them there are the more the terrain it has to operate in resembles a minefield."
year_published = 2025
clearnet = "https://250bpm.com/blog:163/index.html"
