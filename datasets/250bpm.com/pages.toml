["https://250bpm.com/blog:153/index.html"]
title = "250bpm"
full_description = '''Which would create a directory "c" with file "foo" (containing "1") and directory "bar" containing file "quux" which would in turn contain "2". Fun idea: For map indexing use operator / instead of []. So, to access "quux" you would write "c/bar/quux" which happens to be the path to the file in question. Of course, state of the program is not just about variables. We would have to represent the call stack in some way. Easy to do! For each stack frame create a directory called "nextframe". The call stack would then look like a sequence of embedded directories: In such a model, scoping is easy. If you want to access "b" in the innermost frame, just walk up the directory tree until you find a file (or directory) named "b". Also, overrides work as expected. If you ask for "a" in the innermost frame, you'll get "2", not "1". Now you are probably wondering how would one persist the instruction pointer. The language needs to know which command is the next to execute after all and not making this information persistent defeats the entire point of the language. But hey, you cry, if there's a loop in the source code we can't just delete a command within the loop! We will still need it in the next iteration! Easy to fix! Let's make each iteration of the loop create a new stack frame (we would want that anyway, to get proper variable scoping). The body of the loop would be then copied to the "todo" file of the new frame and executed. Once there's nothing left in the inner "todo" file the scope would be exited, the stack frame deleted and the parent could start new iteration of the loop with a new copy of the loop body. Finally, when there's no more iterations to do the parent will delete the entire loop construct, including the loop body and move on. First iteration of the loop is started. Interpreter creates a new stack frame and populated both the "i" variable and the local "todo" file: Now the echo command can be executed which will print "1" and remove the statement from the "todo" file:'''
