["https://250bpm.com/blog:177/index.html"]
title = "250bpm"
full_description = '''Acemoglu & Robinson in their book The Narrow Corridor use Tiv people as an example of a stateless society. The statelessness among Tiv was achieved by penalizing or eliminating those who grew successful or powerful enough to become an eventual condensation point for creation of a state. The traditional mechanism for doing so was accusing such people of whichcraft. This, on one hand, left Tiv without the state and the associated oppression, but, on the other hand, kept them dirt-poor. That sounds all right on the theoretical level, but what made me really visualize the process was a story about how Shaka Zulu, the builder of the Zulu Kingdom, broke the power of stateless elments in the traditional Zulu society. When a hammerhead crane flew over his kraal and a porcupine wandered into it, when a crow perched on a fence and began to utter human words he summoned a team of which doctors led by a woman called Nobela: The Zulus were lined up and Nobela and here associates began "smelling out" the witches who had brought on the evil omens. They picked on prosperous people. One had grown rich through frugality. Another had put cattle manure on his lands as fertilizer, producing a bountiful harvest much greater than his neighbors'. Yet another was a fine stock breeder who had picked the best bulls and taken great care of his stock and as a result had seen a prodigious expansion of his herds. Shaka took offence, accused the which doctors of false accusations and demanded that two of them must die in compensation. The witch doctors panicked and asked Shaka for protection. He agreed, conditional on that they "won't cheat any more". That way he broke the power of the institution of which doctors. Another interesting data point about stateless societies is this paper by Lowes, Nunn, Robinson and Weigel (yes, the same Robinson as in The Narrow Corridor book). In turns out that in Congo there is a set of tribes which are ethnically and culturally pretty homogenous, except that while all of them are historically stateless, one tribe managed to establish a state. The researchers made the people from this area play different economic games and find out that people with a state are less cooperatve than stateless people.'''
year_published = 2025
