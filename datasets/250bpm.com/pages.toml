["https://250bpm.com/blog:130/index.html"]
title = "250bpm"
full_description = '''She didn't fight in the insurgency, of course. She lived at Earth, twenty light years away from the conflict. However, she did attend the protests and she did help with the distribution of leaflets. She had a poster of comandante Iñigo hung above her bed. Part Che Guevara, part Zorro the Avenger, the young daredevil with a wry smile and a submachine gun guarded her sleep. Once, she sent him a letter. Maybe she was a little bit drunk. But the fact that by the time the letter would arrive the man may already be dead made it easier. One day, many years later, she opened her mailbox and found a crumpled letter stamped by the central post office at Gliese 581. "I've read about some cement workers who had, in year 1900, built a glass jar into a quay wall. The jar was discovered hundred years later when the quay was being repaired. There was an anarchist newspaper inside and a note. When I received your letter I have suddenly understood how the finders of the time capsule must have felt." "I've searched my old papers (I haven't touched them for years) and found the photo taken on the day when the EGLM forces entered Gliesita. There are all of us. The core of the movement. We are sitting on a tank. It's summer and everyone's wearing sleeveless t-shirts. Everybody's smiling and el Bru is eating watermelon. He fell few months later, in one of the skirmishes near the Valentian pits. Juan Marron haven't lived till victory either. He was shot by his own men when he tried to limit the rations during the North-S siege. Others made it through. There's another photo of us, standing together on a tribune at Zócalo on May the 23rd. Everything seemed rosy back then. We've won. But then Gustavo Damrosch disappeared in '42. Ian Vilar, the one who was the most optimistic of us, was caught fleeing Gliese with gold bars in his hand luggage. It was found that he have been an agent of the ancien régime all along. He confessed and was executed. Erbert Wayne died from a stroke few years later. Juan Muñoz got himself killed by a jealous husband, idiot. Juan T.C. was blown to pieces in his own house. It turned out he had his basement packed with explosives. General Augustín Martí and Adrián Santa Teresa are the only ones who are still alive. The general is retired and lives alone in one of those colored houses down at La Campana, tending the tobacco plants in the backyard. We haven't spoken each to another for fifteen years. Adrián, I am told, is conspiring with the young officers of the general staff to overthrow me."'''
year_published = 2025
clearnet = "https://250bpm.com/blog:130/index.html"
