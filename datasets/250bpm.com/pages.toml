["https://250bpm.com/blog:125/index.html"]
title = "250bpm"
full_description = '''People who helped Jews during WWII are intriguing. They appear to be some kind of moral supermen. Observe how they had almost nothing to gain and everything to lose. Jewish property was confiscated early on and any portable assets Jews may have had have evaporated quickly. Helping Jews, after a short initial period, wasn't a way to get rich. Hoping for compensation after the war didn't work either. At the time it was not obvious that Nazis will lose. Until last couple of years of WWII it was even probable that they will win. And even if they had lost, hoping for some kind of future appreciation from their anti-Semitic compatriots would be naive. On the other hand, by helping Jews, one put oneself into grave danger. In the eastern Europe, if you were found helping Jews, you were most likely to be shot. And your family as well. In western Europe the consequences were a bit less brutal, but still, going to Nazi jail or concentration camp is pretty bad in itself. Moreover, if one decided to hide Jews, it was no temporary thing. As already said, it was entirely plausible that Nazis will win and with that in mind, a person deciding to shelter a Jew was basically signing up for the life in danger for ever after. Thus, the obvious questions are: Who were these moral supermen? How did they differ from the general population? And: Can we do anything to get more of such people today? I finally got some free time to research the topic. In this post I am going to summarize what I've learned. However, I am not an expert and my research was superficial at best. Take it with a grain of salt and if you know better, please do correct me. Unlike with other genocides we do have some source material on the topic. A lot of it comes from Yad Vashem's "Righteous among the Nations" programme. It's an institution tasked to document the help to the Jews during the Holocaust and to award medals to the rescuers. Let me insert a personal note here: How cool is that? A nation that was recently slaughtered by millions have created an institution for rewarding people from perpetrator nations, people who haven't participated in the atrocities but rather turned against their compatriots and done what was right. I don't think anything like that was ever done before. I am, for example, unaware of any similar undertaking in the context of the earlier Armenian genocide. As for genocides before that, there may not even have been anything to document. Case in point: Tasmanian genocide. The entire nation was wiped out by the British. Nobody survived. That probably wouldn't be the case if someone, anyone, made an honest rescue attempt. On the brighter side, there are some meager efforts to document the rescuers during Rwandan genocide and during ethnic cleansing in former Yugoslavia in 1990's.'''
year_published = 2025
clearnet = "https://250bpm.com/blog:125/index.html"
