["https://250bpm.com/blog:129/index.html"]
title = "250bpm"
full_description = '''Before getting to my topic I would like to thank Alvaro for organizing this awesome event. I think that he deserves three huzzas. So here we go: Huzza! Huzza! Huzza! I was also asked to mention that Medioera festival begins here in Viterbo in just few days. Those of you who are interested in digital culture may consider prolonging your stay here. Finally, there's an Alfajor stand beneath the stairs in the main hall. Go and try it. It's delicious! Recounting the story of illustrious Ts'ui Pen to this audience would be carrying coals to Newcastle. However, for the sake of strangers who may have strayed here from the street, let me mention that when Ts'ui Pen retired from the government service he claimed it was so that he can write a book. Others have reported that he said that he wanted to build a labyrinth. But when he died, the labyrinth was never found and instead of the book there was just a shapeless mass of contradictory rough drafts. Many years later English sinologist named Stephen Albert realized that when saying those two different things to different people, Ts'ui Pen was actually referring a single thing. A book that was, at the same time, a labyrinth. Let me read you the quote… Uhm, let me see: "In all fiction, when a man [the writer] is faced with alternatives he chooses one at the expense of the others. In the almost unfathomable Ts'ui Pen, he chooses - simultaneously - all of them. He thus creates various futures, various times which start others that will in their turn branch out and bifurcate in other times. This is the cause of the contradictions in the novel." But as always, Borges is Herbert Quain in disguise. His stories are like Quain's "Statements", short, cryptic, intentionally unfinished, left for less talented writers to use as a starting point for their own five hundred page long novels. I believe that a substantial portion of this gathering has, at one time or another, fallen into that trap. Similarly, the story of Ts'ui Pen postulates the existence of the book, that Everett monster, where all possible story lines are explored in parallel, but it remains conspicuously silent about how exactly was this chimaeric cross between a novel and a maze constructed.'''
