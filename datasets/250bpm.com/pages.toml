["https://250bpm.com/blog:164/index.html"]
title = "250bpm"
full_description = "This is a transcript of a recording made on August 9th, 2020 at a polling station in Vitebsk, Belarus. Aside from being a nice illustation to Milgram experiment, I couldn't resist its literary appeal, its XIX. century, almost Chekhovian, feel and have written it down as if it was a play. MEMBERS OF THE ELECTORAL COMMISSION No. 25 are in a room. The commission consists of of both men and women of various ages, all of them teachers at the local school. SERGEY VIKTOROVICH, the head of the Oktyabrskiy electoral district, enters. He speaks in a deep, calm, a little bit concerned, some may say even sad, voice. I think you are all aware of what's going on. I think you understand the reason why your school has been visited by the Chief of Staff of the Executive Office. Or maybe there's something that one of you does not understand? Am I wrong? COMMISSION: Everyone did. Everyone has counted. And this is what we've got here, at the polling station. They have inspected each ballot honestly and conscientiously. They have got, according to preliminary estimates, 75% for the third candidate. For the candidate who has got the most votes here, they've got something like 15%. That is consistent with the overall results in Oktyabrskiy district. Therefore, I don't want you to be the only ones who will somehow - it's not clear whether guided by common sense, pride, sense of responsibility or whatever - stand out of the crowd. I am, so to say, an old person. I am a contemporary of Viktor Tsoi. Even of Elvis Presley. I was born before he died. I know all those songs. Even Scorpions I know very well. But today we are not in a place where one should engage in this kind of honest actions. A proposal to change the propocol. To change the numbers substantially for the third and the fourth candidate. I am prepared to admit that a number of people voted for Tikhanovskaya. I am not going to try to explain why, or even fantasize about it. Some have voted at the behest of their heart. Some have voted with their mind. Some have voted with their wallet."
