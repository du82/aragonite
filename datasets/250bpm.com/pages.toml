["http://250bpm.com/blog:91"]
title = "250bpm"
full_description = '''Recently, I've released a small tool to write configurations (repo). The README is pragmatic, just a worked example, and doesn't claim anything extraordinary. However, my ultimate motive was to explore a new programming paradigm, or at least a paradigm that I — being a programmer for three dacades — have never heard of. Describing the world using cartesian products isn't logical programming or object-oriented programming. It isn't functional programming in the strict sense and it's definitely not imperative programming. I am not making any big claims now either, mind you. I would just like to explore the mechanics and the limits of this new paradigm. Maybe its use is limited to the niche area of writing config files? Or maybe it's a full-blown paradigm, a worthwhile peer to functional and imperative paradigms? I frankly don't know. That being said, I want to address an obvious objection to the cartesian paradigm. The objection goes like this: "Cartesian program generates a description of the world in the form of a set of anonymous (unnamed) objects. You can iterate over them, but you cannot really reference any specific object. This makes the paradigm not useful for anything but config files, which don't, by their nature, require addressable objects." To put it in practical terms, what if we wanted one object to be dependent on another object? Say, what if we wanted property X of object A to be twice the property X of object B: Well, I think (prove me wrong, if you can) that this problem is really in the eye of the beholder. As long as you think as described above there's no way to solve the problem. However, once you start thinking in top-down manner rather than traditional bottom-up manner, the problem disappears. Let me explain. In both imperative and funcional paradigms we are accustomed to start with smallest functions and then to combine them into more complex functional units. We've solved the problem by creating an object with a bigger scope (a global one) and referencing it from the smaller-scoped object (our configuration). Note that in both imperative and functional programming it works exactly the other way round: Bigger-scoped objects invoke smaller-scoped functions to solve problems in subdomains of their original problem.'''
year_published = 2025
clearnet = "http://250bpm.com/blog:91"
tags = ["30th,", "cartesian", "functional.", "imperative", "programming?", "sure,"]
