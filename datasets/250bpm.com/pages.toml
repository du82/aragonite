["http://250bpm.com/blog:162"]
title = "250bpm"
full_description = '''It's hard not to conclude that direct democracy is the reason why Swiss society works so well. However, one then remembers the direct democracy in California and is no longer so sure. Not that the Californian direct democracy is necessarily bad, but it shows no spectacular results either. One possible argument to explain the discrepancy could be that direct democracy needs time to mature. Which it certainly does. We've already seen how the Swiss popular initiative needed hundred years to evolve to its current form. However, Swiss direct democracy dates back to the end of 19th century, while Californian direct democracy became fully established in 1911. Difference of mere 22 years. Another possible explanation of why Swiss direct democracy works better is that California is constrained by being part of the United States. And there is no direct democracy on the federal level in the US. Maybe the dysfunction trickles down from above and the local direct democratic institutions are not able to cope with it. I have no idea whether that's a plausible explanation, however, we may be wiser after giving a closer look to the second pillar of the Swiss political system, the feature that is often called "federalism" but which can, in my opinion, be interpreted in much wider sense as decentralization at all levels of the society. Switzerland has once been a loose confederacy of independent states and the unification in 1848, to a significant extent, preserved that independence. While there is a central government, its powers are rather limited. So-called "principle of subsidiarity" applies: The areas managed by the federal government are explicitly listed in the constitution and anything that is not included in the list automatically falls under the jurisdiction of the cantons. Even in the areas that the federal government is responsible for, it often does the decision making, but leaves the execution to the cantons. So, for example, although the Department of Justice and Police exists at the federal level, the police forces themselves operate at the cantonal level, in larger cities even at the municipal level.'''
year_published = 2025
clearnet = "http://250bpm.com/blog:162"
