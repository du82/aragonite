["http://250bpm.com/blog:136"]
title = "250bpm"
full_description = '''This is a series of posts about coordination problems, as they appear in the course of biological evolution. It is based on the book "The Major Transitions in Evolution" by John Maynard Smith and Eörs Szathmáry. Previous part, discussing Eigen's paradox as well as the origin of chromosomes, can be found here. In this part we are going to look at the origin of eukaryotic cell, specifically at its acquisition of endosymbiotic organelles, and at the origin of multicellularity. While all single-celled organisms may look like similar wiggly little creatures to us, there is a huge difference between prokaryota (like bacteria) and eukaryota (like protozoa or, for that matter, our own cells). The cell wall is different. The interior of the cell is different. One has rigid cell wall, in the other it's the cytoskeleton that holds the cell together. One has a single-origin DNA strand attached to the cell wall, the other has nucleus containing chromosomes. One has mitochondria and chloroplasts, the other does not. Even the mechanism of cell division is different. If we haven't known that we share part of the genome, it would be easy to make a mistake and believe that the life on Earth had originated at two separate occasions. The transition from prokayotes to eukaryotes is likely the most complex transition in the entire course of evolution. It took two billion years to happen. More than the emergence of life itself. All that being said, we are going to look only at a single part of the evolution of eukaryotes, namely at their acquisition of mitochondria. Mitochondria were free-living cells once. But then they've became an inseparable part of eukaryotic cell. Hence, back to the coordination problems! How did it come to be that some cells started living within other cells? Well, assuming that flexible cell wall and phagocytosis evolved before the domestication of mitochondria, getting them inside wouldn't be a big problem. It happens each time one cell eats another. What's more interesting is how did the guest cell survive and how did the cooperative behavior between the host and the guest evolve.'''
year_published = 2025
