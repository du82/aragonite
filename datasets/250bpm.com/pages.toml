["https://250bpm.com/blog:131/index.html"]
title = "250bpm"
full_description = '''Procopius praises them for being unlike other Huns, less like savage animals, more like civilized men with white bodies and laws to obey. Menander Protector, citing Peter the Patrician, asserts that they were in fact those Huns who decided to return to the east after the fall of Attila. Joshua the Stylite describes their military tactic as being "like that of other Huns; they pretend to flee and then turn upon their pursuers killing them mercilessly with long bows and short knives". Despite all that, there persisted a rumour among common people, something one would hear at a bazaar or in a tavern, saying that they were no Huns at all. That they were just calling themselves so to instill fear in their enemies. And then there was yet another rumour, whispered in the corridors of the patrikioi. It claimed that the tavern story was in fact a fabrication planted by the Huns themselves to make them appear weak and to lure their prey into a deadly trap. Among themselves they've called themselves Eb and if we are to believe Chinese chroniclers they once lived north of the Great Wall and paid tribute to the Jou-jan. Whatever their true origin, Eliseus (the Armenian one) reports that they've appeared in Central Asia by the middle of 5th century and attacked Sasanian empire from the north. Peroz I fought them thrice. Twice he was captured and ransomed. The third time he was killed. The Eb have then plundered eastern Khorasan for years. Ibn Miskawayh notes how they've enjoyed burning down places of worship and then, on a whim, rebuilding them again. We have almost no information about what was going on at the beginning of the 6th century. The only source, however unreliable, is John of Pannonia. Interested, as he were, only in things Christian, he recounts a story of one of their kings who converted to Christianity. On his death bed he got serious doubts whether he'll be admitted to heaven. The priests failed to persuade him of the merits of wearing prickly goat hair underwear as a way to elicit Lord's infinite mercy. And so finally, just before his death, he ordered mass murdering of the Khorasan Christians so that, in the ensuing chaos, he could sneak more easily through the tall gate of heaven.'''
year_published = 2025
