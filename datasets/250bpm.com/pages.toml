title = "250bpm"
full_description = '''Abstract: Reputation tokens (e.g. brands, but lot of other things as well) are vessels to store reputation. They are free to create but expensive to fill with trust. Consumers use them to deal with information overload. Producers use them to manipulate common knowledge. Also, a certain kind of supply-demand-style equilibrium exists. To keep the discussion down-to-earth, let's start with the trademark law. The trademark law was, after all, created specifically to deal with reputation. And being a law, it is not a theoretical model but a living organism evolved to solve actual real-world problems. You may have a vague idea that a trademark is something like an Internet domain name. You can buy a name and then it's yours. It's your property and everyone else should get off your lawn. First of all, you don't create a trademark by buying it. Trademark is rather created as a by-product of using a name. You establish a company. You start producing stuff. Maybe you do a little advertising. People start to recognize your brand. Et voilà, you own a legally recognized trademark. No explicit action on your part is needed. Similarly, if you stop using the name, your claim to the name gradually dissipates. If you claim a trademark and your opponent is able to prove that you haven't used it for decades, the court will rule against you. There is also the concept of "trademark goodwill" which loosely translates to "reputation". Interestingly, the notion of trademark goodwill tends to be phrased in economic terms. Namelt, it is the part of the value of the company that is gained through owning the trademark. Another common misconception about trademarks is that the names are, similarly to the Internet domain names, global. In reality, the scope of a trademark is limited to the area of one's activity. Apple, the grocery store doesn't infringe on the trademark of Apple, the consumer electronics manufacturer. Similarly, Apple a grocery store in Manchester, England may not infringe on the trademark of Apple, a grocery store in Brisbane, Australia. The rule of the thumb is that there's an infringement only when the two trademarks can be easily mistaken for each other by the customers.'''
year_published = 2025
clearnet = "https://250bpm.com/blog:172/index.html"
