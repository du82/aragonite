["https://250bpm.com/blog:102/index.html"]
title = "250bpm"
full_description = "I've started programming early, in 1984 when I was 11 years old. Back then I just had an idea of what the program should do and I did whatever was necessary to get there. After that initial period of pogramming I haven't cared about it too much. I did whatever programming assignments we've got in school and later whatever work I needed to do to feed myself, but that was it. In the spare time I was mostly drinking with artists. That changed in 2004. Back then I started to be involved in open source. The fact that I was delivering code, not a packaged product, sparked my interest in programming again. You see, with packaged product you provide people with a tool to do stuff. That's super useful and a noble endeavour but, at least for me, it is not very interesting. Delivering code, on the other hand, means putting an idea into other peoples' minds. And that kind of thing has an aura of magic that's hard to resist. From 2007 to 2013 I've created ZeroMQ and later nanomsg. The idea I've tried to convey was that messaging patterns (request/reply, publish/subscribe etc.) aren't just some vague heuristics about how to make distributed systems but rather formally precise algorithms. Once you've understood what publish/subscribe means you knew exactly what kind of behaviour to expect from it and was able to use it as an atomic building block of your distributed application. To pass that idea on I've created a library that encapsulated each of those patterns. As a user, you instantiated an publish/subscribe endpoint and that was it. It worked in publish/subscribe way. I hoped that people using the library will adopt those patterns and use them in their future work independent of whether they'll use ZeroMQ or not. In 2015 I've created a library called libmill. It's an easy to use coroutine library for C. Most of the code there is just a legwork, trying to rewrite Go's model of concurrency and make it so fast that the speed of coroutine creation or a context switch would be comparable to simple control constructs like 'if' or 'for'. The idea is that concurrency is literally just a bunch of control constructs. And the hope was that having a library which makes them equal performance-wise would shift the peoples' mental model of them."
year_published = 2025
