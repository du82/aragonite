["https://250bpm.com/blog:45/index.html"]
title = "250bpm"
full_description = '''When Ned Stark got executed by the end of first season of the TV series everyone went like: Ugh! Not possible! He's the protagonist! He just cannot die like this in the middle of the story! Ridiculous! What's the next season going to be about? The deep sense of confusion that the event causes is he result of a completely new story-telling device invented G.R.R. Martin. And when I say "completely new" I don't mean it in the sense of "the best one this season" but rather as "I cannot think of such disruptive change to story telling technique without going back to the middle ages". Classic story-telling technique is based on building up the tension gradually until it reaches a climax, where it is dissolved. The higher the climax, the more captivating the story. After the climax the story ends. It's called "dramatic structure" and can be depicted like this: The image gets a bit more complex when you consider that there may be several mini-climaxes on the way towards the main climax: The important fact about the dramatic structure is that it doesn't fit to everything that happens in real life. Only a little part of life is actually "dramatic" in this sense… So, every writer must have at some time or other fancied writing a detective story where the protagonist is investigating a murder, clues are gathered, tension rises, it's finally becoming clear who the suspects are and then the detective is run over by bus. The end. The story is entirely plausible, it can very well happen in the real life, but nobody have actually written it. A narrative where dramatic tensions are left unresolved is deeply unsatisfactory to the reader and writing such a story is a literary suicide. Given that classic dramatic structure is incapable of capturing a lot of what's going on in life, there have been multiple experimental attempts to break out of the box. To give just one example, let's mention the absurd drama. However, none of those experiments have made it to the mainstream literature (or, for what it's worth, to the movies). The lack of dramatic structure results in stories that are kind of unsatisfactory and disappointing. That makes it a taboo for those writers who actually care about their audience.'''
year_published = 2025
clearnet = "https://250bpm.com/blog:45/index.html"
tags = ["27th,", "clockwork", "game", "inside", "november", "thrones"]
