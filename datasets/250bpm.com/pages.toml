["https://250bpm.com/blog:135/index.html"]
title = "250bpm"
full_description = '''Lately I've written couple of posts that discuss coordination problems. Not the idealized, game-theoretical stuff but rather the real, messy coordination problems encountered by real people in the real world. Here, I will explore very different territory. I will look at coordination problems between between molecules, chromosomes, cells and individuals as they occurred and as they were solved in the course of biological evolution. This article is based on the book "The Major Transitions in Evolution" by John Maynard Smith and Eörs Szathmáry. Before proceeding I would like to say few words about why I chose that particular book, although it was published in 1995 and thus misses a lot of recent research. First, it was written by widely recognized experts in the field. That may not have been that important if I was writing about a different topic, but evolutionary biology is notoriously tricky, subtle and prone to misunderstanding. Sometimes it generates crackpot ideas, which, nonetheless, sometimes turn out to be true. A layman, or even a popular science writer, is likely to get lost. John Maynard Smith is one of the big names of evolutionary biology of 20th century. He owe to him the introduction of game theory into evolutionary biology. He's the author of the central idea in the field, so called evolutionarily stable strategy, which is, to put it shortly, an application of the concept of Nash equilibria to biological, evolving systems. Second, the book is concerned with the big changes in the evolutionary history. It doesn't spend much time on evolution-as-usual, on how a specific bone or organ evolved. Rather, it discusses the events which significantly changed the nature of evolution itself: How did the life began? How we've got the first self-replicating molecules? How did the cell originated? How did the multicellular organisms? One would expect a book on such a grand subject to be a least a bit hand-wavy. Surprisingly though, it's not. Instead, the authors dive deep into the details of each individual topic, they discuss chemical details of the reactions in questions, their yield and speed, how would they survive in the competition of other reactions going on nearby and so on. They discuss the game-theoretic considerations of forming an eukaryotic cell or an insect society. They describe the minutiae of intragenomic conflict and the interplay between the development and evolution.'''
year_published = 2025
