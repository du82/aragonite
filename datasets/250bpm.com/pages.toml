["https://250bpm.com/blog:175/index.html"]
title = "250bpm"
full_description = '''The common narrative of evolution is that it is that great force of progress, optimizing the organisms, casting away inefficiencies, multiplying the species, and generally, driving living things to become more complex, starting from the simplest possible lifeforms, such as protozoans, up to that pinnacle of progress that is ourselves, the vertebrates. But consider a plant that happens to have a mechanism to survive droughts, such as ability to store water in the roots. If there is no drought this year, that mechanism is a dead weight. It is costly to maintain and there's no immediate benefit form it. The plant would be better of without it. But the next year there's a drought and the plant survives. If the evolution was super progressive, the plant would optimize out its water-accumulating capacity in the first year and then die in the second year leaving no progeny behind. A conservative may thus say: Evolution is a way to store knowledge of the past. It's a trove of mechanisms that have once proved useful for surviving. "Optimizing" it is just a nice way of saying that the instruments from that war chest are being thrown away. And, of course, neither our strawman progressive or our strawman conservative are considering the full picture. Organisms benefit from having inherited the survival tricks from the past but also from being able to respond quickly and in novel ways to the new challenges. (But, to be fair, the conservative view is much easier to argue for. Arguing for the progressive view tends to lead to the theories on group selection, if not to some semi-mystical élan évolutif.) In the end it's all probably just a race with time. The events that are frequent enough (the low temperature during the night, the cold in the winter) are worth optimizing for. Infrequent events (the ice ages) not much so. In the former case the tools for dealing with the event are worth keeping in the war chest. In the latter case they will be inevitably thrown away and we have to rely on the fact that at least some organisms will be, for random reasons, better suited to withstand cold and that those organisms will be the lucky winners of the evolutionary race when the next ice age comes.'''
year_published = 2025
clearnet = "https://250bpm.com/blog:175/index.html"
