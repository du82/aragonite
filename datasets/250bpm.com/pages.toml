["https://250bpm.com/blog:150/index.html"]
title = "250bpm"
full_description = '''When Black Panther came out I went to cinema hoping to finally see a science fiction movie about Sub-Saharan Africa. (District 9, for obvious reasons, doesn't count.) Needless to say, I was disappointed. The film wasn't really about Africa. It was about America, pretending, half-heartedly, to be about Africa. I was not sure how to feel about it. On one hand — trying to relate it to my own cultural background — a Hollywood movie about slovak shepherds with laser weapons would be hilarious. On the other hand, it would be a wasted opportunity. All the strangeness and complexity of Slovak rural life would be thrown out, leaving only superficial, schematized image of an Eastern European country, presumably a mix of Dracula and Hunt for Red October. Sub-Saharan Africa is much more complex and strange than boring Slovakia, but all we've got were some cringe-worthy depictions of local customs and a skyscraper that kind of looked like the mosque of Djenne. For exactly the reasons above I loved Liu Cixin's science fiction novels. They are distinctly non-American and, for that matter, non-European. They are unapologetically Chinese and thanks to that they are often shocking for the western reader. What left a lasting impression on me, personally, was their bleak worldview, the total resignation on the possibility of cooperation, the "it's either us or them" attitude, where neither party is particularly evil, yet nobody seems to be able to imagine a world where the civilizations would treat each other with anything better than genocide. Muqaata'a by Fahad Himsi (self-published, 2017) is another such book. Not only does it have little in common with either American or European science fiction, it doesn't really intersect with them. It's doing its own thing and it doesn't seem to care about what goes under the "science-fiction" label elsewhere in the world. However, unlike with The Three-Body Problem, I can't imagine it ever becoming popular. Not only is the name of the novel impossible to remember. It's not even that it contains no less than three sounds that don't exist in English. It's also the lengthy discussions of Middle Eastern politics that are going to bore every science-fiction fan to death. And while there are undoubtely people who would find that kind of content interesting, those are unlikely to reach for a book from science-fiction shelf.'''
