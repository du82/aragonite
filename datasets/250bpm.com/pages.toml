["https://250bpm.com/blog:178/index.html"]
title = "250bpm"
full_description = '''I've never thought much of the Wittgenstein's argument. First, there's non-verbal thinking that can be used to escape the limits of the language. Second, once the knowledge is gained by non-verbal thinking, it can be used to extend the language itself and thus extend the limits of everyone's world. However, I've been writing newspaper articles and a blog in Slovak lately and the experience made me think of the Wittgenstein quote. Namely, I had hard time expressing some ideas and making some arguments. Slovak, you see, is a language of 5 million speakers, with ~200 years of history as a literary language. A lot of terms that one can use in English simply do not exist. I support policy X because it enables economies of scale and I am against polcy Y because it introduces a single point of failure. Som za X, pretože umožňuje úspory z rozahu a som proti Y, pretože zavádza jediný bod zlyhania. It's hard to relate how that sounds. Enough to say that "úspory z rozahu" doesn't literaly translate to "economies of scale" but rather as "savings from the extent". One gets an impression of a crackpot speaking gibberish, making a crackpot argument. It should be said that this is not a problem in one-to-one conversations. One can use the English term if the other is aware of it, or, if not, he can clarify the meaning of the term in advance. Where the problem hits is the public discussion. There you can't expect the prior knowledge or afford extensive explanations. Attention span in public discussion is, after all, very limited. If you waste your one minute of public attention by explaining what a single point of failure is, you've already lost. It can be argued that the problem lies not with the language, but rather with the language speakers: Slovaks are simple people, uneducated, they don't have the concept of encomies of scale. Therefore, they should be educated and the the term would force its way into the language all by itself. Most English speakers don't know what encomies of scale are either. Yet, with 1.5 billion English speakers there's a large enough minority that does. They use the term, they write about it, they discuss it. If you encunter the term and you are not sure what it means you can google it and find out that there's a lot of hits, that some pretty serious people are discussing it, you can even learn what it means yourself. In any case, there's none of this "lonely crackpot" perception that you get if using a small language.'''
year_published = 2025
clearnet = "https://250bpm.com/blog:178/index.html"
tags = ["13th,", "april", "cage", "language"]
language = "en"
internal-references = ["none"]
