["https://250bpm.com/blog:119/index.html"]
title = "250bpm"
full_description = '''After spending full day adding new documentation to libdill and after getting desperate about the repetitivness of the man pages I've got rid of what I had and spent another day writing a program to generate the documentation. A lot of functions, for example, have deadlines. For each of those functions the man page should contain the following text: deadline: A point in time when the operation should time out, in milliseconds. Use the now function to get your current point in time. 0 means immediate timeout, i.e., perform the operation if possible or return without blocking if not. -1 means no deadline, i.e., the call will block forever if the operation cannot be performed. A lot of functions have a "mem" variant (such as udp_open vs. udp_open_mem) which have almost identical man pages, except for one added paragraph. All functions related to a particular network protocol could share a single code example that should be copied into each man page. So I wrote a program to generate all that and the input to that program is a JSON file, a list of all the metadata needed to generate the documentation. What I've realized in the process was that it forced me think about consitency of libdill's API. If two functions were inconsistent in some way I had to add special case to my documentation generator. That in turn provides an incentive to fix the API and make it more consistent — an incentive that is often missing in the ordinary life of a programmer. Furthermore, I've realized that by writing the metadata JSON file I have unwittingly created a formalized description of some aspects of the library that would, at first sight, seem to be too vague to be formalized. Let me give an example. Imagine there is a subset of functions that only work if you pray to saint Isidore of Seville, patron saint of programmers. It's pretty hard to express that in a program. However, you still want a line in the man page saying: The function assumes that the user is praying to St. Isidore during its execution. It the condition is not met the function will exhibit undefined behaviour.'''
year_published = 2025
clearnet = "https://250bpm.com/blog:119/index.html"
