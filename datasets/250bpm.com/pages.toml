["https://250bpm.com/blog:165/index.html"]
title = "250bpm"
full_description = "When researching the topic of distributing government seats in Switzerland. I've chanced on the so-called split-the-dollar game, which is kind of simplified, game-theoretical model of the process. Given that despite having some basic knowledge of the game theory I have never heard of the game, it may be worth making a short blog post about it. In the game, three players are asked to vote on splitting a dollar. The game is iterative, it has multiple rounds. At the beginning, a third of a dollar may be assigned to each player. The players, unanimously, vote for the arrangement. However, the arrangement is not stable. It's a game about forming coalitions. Two players can conspire and vote in a arrangement where they split the dollar fairly among themselves and give nothing to the third player. But even then the arrangement isn't stable. Now the third player can approach one of the other two coalition parties and propose a better deal: Instead of 50 cents they would get 75 cents and the proposing party would content itself with just 25 cents. Their current coalition partner would get nothing. The party is incentivized to accept not only because of sheer greed, but also because it is aware that if they rejected the proposal, the proposing party can make the same offer to their coalition partner and thus lock them out of the coalition. But even now, with two players sharing the dollar in 75:25 ratio, the arrangement is not stable. The senior partner can blackmail the junior partner by threatening to make a coalition with the opposition party. The junior partner, in their turn, can do exactly the same thing. As can be seen, any arrangement is, in principle, unstable. The negotiation game can go on forever without reaching a stable state. We can see the game in action in the case of Switzerland. In 1953, despite FDP (liberals), CVP (christian democrats) and SP (social democrats) getting very much the same amount of votes, the seats in government were distributed among them in 4:2:0 ratio. (There was also one seat going to SVP, which matched their election result and is not relevant to this story.)"
year_published = 2025
clearnet = "https://250bpm.com/blog:165/index.html"
