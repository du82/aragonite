["http://250bpm.com/blog:114"]
title = "250bpm"
full_description = '''When I was an adolescent, maybe 18 years old, I was hit over the head with the realization that we have no say in our survival as species. Evolution is going to progress in a way that maximizes multiplication and our beliefs, our cleverness, our science, our will to sacrifice personal wellbeing to the benefit of all is not going to change that a bit. I was never able to communicate the horror of being at the mercy of cold and uncaring, non-sentient in fact, forces of nature to anyone else. At the time I was living in Bratislava and hanging out with the local bohème. Getting terrified by theoretical speculations was not exactly their cup of tea. And surely, given that the evolution progresses at generational pace, the problem, however troubling in theory, is not terribly urgent, right? What I failed to communicate was the underlying structural pattern. The fact that the idea generalizes. If all self-optimizing feedback loops suffer from the problem, it's not just the evolution that doesn't care about our will and progresses in an unpredictable direction. It's also the economy. It's all the diverse feedback loops that the fabric of society is made of. I had this terrifying insight, at a quite an early age, and I was left alone with it. It was like being the only passenger on Titanic who have noticed the iceberg. The one who you see running around and screaming and getting nobody's attention. One would think I have got some relief from reading scientific literature. Scientists are clever. They have all these deep insights. They do see patterns in things. And they are not afraid of theorizing! Well, I have read quite a lot of evolutionary biology. And evolutionary biologists haven't convinced me they see the danger. Presumably, they were too sober to write about such philosophical and hand-wavy topics. What about the economists then? They wouldn't mind a bit of hand-waving, would they? I found nothing. I guess they were too busy inventing new financial instruments. Or, more probably, both evolutionary biologists and economists have indeed seen the issue but haven't considered it to be a problem. It's just the natural order of things, isn't it? Then philosophers maybe? This seems to be exactly the kind of topic a philosopher would be interested in. I have to admit I haven't read much philosophy. I've got disheartened by too much inconsequential mumbling in the books. As a friend of mine, a professional philosopher, desperately cried after a long discussion we've had: "Sústrik, you don't care about philosophy! You care about truth!" Anyways, even today I am not aware of a philosopher seriously tackling this problem. Daniel Dennett seems to have all the necessary mental machinery but yeah, he's working on his congnitive science stuff.'''
year_published = 2025
clearnet = "http://250bpm.com/blog:114"
tags = ["4nd,", "december", "equilibria", "inadequate"]
language = "en"
