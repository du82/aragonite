["https://250bpm.com/blog:182/index.html"]
title = "250bpm"
full_description = '''Old people have a sort of double vision about the past — an ability to see the past from the perspective of today, and also from the perspective of the people who lived through those times. When then was now. This double vision, according to Scott, brings wisdom, something you gain with age, an attitude that younger people are missing: When I read some of my lamer posts from the early days, I cringe at their lack of wisdom. What was I thinking? It's a little nebulous, but one can see how considering the current issue from multiple cultural perspectives - remember: past is a foreign country! - helps you to get a more balanced view. Say, the political situation in Slovakia, the country which I am originally from, is not exactly rosy right now. We have a new Orbán or PiS-style government, which is trying hard to weaken the rule of law. Everybody in my social circle goes crazy about it. But there's a difference: While young people are simply horrified, older people do act as if they were horrified, but if you question them in private, they tend to admit that yes, it's not that bad, it used to be worse in 90s, when we used to have severed human heads in flower pots and whatnot. It's a tacit knowledge that doesn't get passed on. Young people, born in 90s don't remember the severed heads, after all. Of course this only applies to periods that we ourselves have lived through. I have no feel at all for the 1890s. I know that it was a disgrace for respectable women to show their legs in public, or to go out on the town without an escort, but I don’t actually have much of a feel for why. Understood. But I have two questions: First, do we need the full experience of the past to get wise? Or would something that goes half the way be good enough? And second, is there a way to convey this tacit knowledge about the past, even if it's not perfect? People today freak out about the war of the day, the democratic backslide, the conspiration theories, the AI doom. But then you look at someone like Tyler Cowen and it's surprising how equianimous he manages to remain in spite of all that. And it doesn't seem to be only about the age. One has to wonder whether it's simply linked to intimate knowledge of the history, the visceral realization that people are always freaking out about something. "When we run out of guano we are all going to die!" (That's late XIX. century.) The calm comes from understanding that today is just business as usual, not some kind of outlier.'''
year_published = 2025
clearnet = "https://250bpm.com/blog:182/index.html"
tags = ["28th,", "june", "living", "wisdom", "years"]
