["https://250bpm.com/blog:128/index.html"]
title = "250bpm"
full_description = '''In the past I've reviewed Eliezer Yudkowsky's "Inadequate Equilibria" book. My main complaint was that while it explains the problem of suboptimal Nash equilibria very well, it doesn't propose any solutions. Instead, it says that we should be aware of such coordination failures and we should expect ourselves to fare better than the official institutions in such cases. What Yudkowsky is saying (if I understand him correctly) is that given that the treatment of short bowel syndrome in babies is stuck in an inadequate equilibrium, there's no way to fix the problem on the system level. However, you can spot the problem and acquire the medication needed to keep your kid alive from abroad yourself. In my review I've sketched a couple of ideas how to approach the problem, but that was just me trying to be clever. Something backed by evidence would make me much more happy. So I've decided to have a look at how people are getting out of suboptimal equilibria in the real world. And that's how I've got to the Elinor Ostrom's book "Governing the Commons (The Evolution of Institutions for Collective Action)". The book is very explicitly covering the same problem as Yudkowsky. As Ostrom say about her research in her Nobel lecture: "One of the key questions that we've been addressing is 'Are rational individuals hopelessly trapped in dilemmas?'" Ostrom is an economist with a game-theoretic bent. But she's not a theoretician. She's a field researcher. I've expected some good read and I wasn't disappointed. The book focuses on special subset of coordination problems, problems of management of what Ostrom calls "common pool resources". Common pool resource is something that, unlike private property, is not exclusionary, something that one cannot easily restrict people from taking advantage of, but that, unlike public property, can be depleted by excessive usage. So, for example, it's hard to exclude others from fishing in the ocean, yet, the fish stock can be depleted by overfishing. Ocean fishery is a common pool resource. Compare that with a private fish farm where others are prevented from fishing by a barrier. And on the other side, contrast it with a public weather forecast which doesn't get depleted as more people turn on the radio.'''
year_published = 2025
clearnet = "https://250bpm.com/blog:128/index.html"
