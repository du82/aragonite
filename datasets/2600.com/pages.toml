["https://2600.com/chatterbox"]
title = "2600 | Chatterbox"
full_description = '''Chatterbox General Main Page Off The Hook Off The Wall Brain Damage Voice of Long Island Shadow Over LI News Archive The Magazine General Information Online Store Covers Pay Phones Meetings People Kevin Mitnick Bernie S Cons HOPE Beyond HOPE H2K H2K2 The Fifth Hope Hope Number Six Hacked Sites Archive ... of the Future? Features The Secret Service Walter Tribute Samori Marksman "Chatterbox" was a one-hour afternoon talk/interview program hosted by Eric Corley. It aired Mondays from 2:30 pm to 3:30 pm in the fall of 1983 on WUSB. It was followed by a half hour music fill along with a two hour afternoon slot (complete with shortwave-style intro), snippets of which are included where available. On October 12, 1983, in the middle of the show's run, the radio station was raided by the FBI as part of a nationwide computer hacking investigation. Trivia note: the last edition of the program, technically not an episode of "Chatterbox," occurred on the last Monday of the year and included some "coconspirators" in the above investigation. 1983 September October November December 2600 Magazine P.O. Box 752 Middle Island, NY 11953 USA Telephone/Fax: +1 631 751 2600 Copyright © 1983 2600 Enterprises, Inc. All rights reserved. "Chatterbox" was a one-hour afternoon talk/interview program hosted by Eric Corley. It aired Mondays from 2:30 pm to 3:30 pm in the fall of 1983 on WUSB. It was followed by a half hour music fill along with a two hour afternoon slot (complete with shortwave-style intro), snippets of which are included where available. On October 12, 1983, in the middle of the show's run, the radio station was raided by the FBI as part of a nationwide computer hacking investigation. Trivia note: the last edition of the program, technically not an episode of "Chatterbox," occurred on the last Monday of the year and included some "coconspirators" in the above investigation.'''
