["https://2realities.com"]
title = "Artem Sidorenko"
description = "Blog of Artem Sidorenko"
full_description = "Full encrypted Proxmox installation Fan in and progress counters pattern Testing of functions with channels in Go Hugo on GitHub Pages with Travis CI OpenStack Networking: Open vSwitch and VXLAN introduction CentOS VM image for Synology Nice tagcloud with Hugo Using travis to deploy hugo site to a shared hosting Testing chef cookbooks with GitLab CI Setting up NAT64 with tayga on Centos This post describes the full encrypted installtion of proxmox hypervisor with unlocking of encryption via ssh. The pipeline blogpost of Sameer Ajmani gives a good overview over the design pattern “fan-in” in Go. Sometimes, you might have a slightly different situation within fan-in code, where you need a different approach. Example: you might need some progress counters, which get incremented during the fan-in operation, e.g. to display the processing progress of some operation to the user. Go or Golang has a very nice mechanisms for dealing with concurrency: channels and goroutines. This post describes my approach about testing of functions, which are used within goroutines and consume input or provide output via channels. There is no rocket science at all, just the typical channel handling in the tests. I already wrote about deploying Hugo websites to the shared hosting by using Travis CI. GitHub Pages support HTTPS for custom domains from May 2018, so now it’s worth to have a look at this topic again. In my new job I had to deploy a new OpenStack environment. It was about 5 years ago when I did last time anything related to the OpenStack infrastructure deployment. Unused knowledge vanishes pretty fast, besides that OpenStack is developing. So I had to refresh a lot of things and even to build knowledge from scratch in some areas. From my point of view OpenStack networking is one of the most complicated parts if you want to do it right. This series of posts aims to give a brief introduction to this topic. It will cover following setup: OpenStack uses Open vSwitch and VXLAN heavily in this setup, so I start first with introduction to Open vSwitch and VXLAN in this post. OpenStack networking architecture and implementation will be covered in the further posts."
year_published = 2019
clearnet = "https://2realities.com"
