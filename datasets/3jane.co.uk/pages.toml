["https://3jane.co.uk/posts/assembly-line-components"]
title = "ir·regular expressions: Assembly Line Pattern: Components"
description = "What is the Assembly Line pattern and how to identify its components in real-life systems"
full_description = '''Assembly Line Pattern: Components April 14, 2019 Assembly Line pattern describes a process transforming a series of similar items. It is very common in functional programming languages. After reading this article, you will be familiar with components of the pattern, and you will be able to identify them in real-life applications. The article constitutes the first part of a series on how to apply the pattern in code, system design, problem analysis, and individual productivity.Components and FlowAn assembly line consists of a series of components, or stations:which perform actions that change an item's status:Dispenser: the source of your itemsEvery assembly line starts with a source, a dispenser which either produces or delivers items (data) of similar shape for the assembly line to process.Real-life dispensers include:a directory of filesa CSV file with a list of customer email addressesa sequence of numbers (1, 2, 3 ... n)a queue of buy/sell instructionsa search API endpointa log file of user interactions with your websiteDispensers exist on the boundary between your system and the "outside world", which means they require special handling that would be unnecessary in the rest of your program. (A receptionist may sit at the office entrance, but usually not at the entrance to each individual meeting room.)Quality control: which items are usefulIn a factory, not every item coming out from a dispenser is of the right shape. The assembly line needs a quality control step. The earlier you can install it the better, as its goal is to save operational costs by cutting down the amount of items processed.To set up effective quality control, you need to prepare a simple formula which, given an item, will judge "yes, it is useful" or "no, it should be discarded". This is called a filter.Real-life quality control filters:skip write-protected and hidden filesdiscard inactive emailsin a sequence of (1, 2, ...) skip days which are weekends and holidays this monthskip buy/sell instructions that have already been reportedskip API responses that returned an errorskip user interaction logs generated by testing toolsRefinery: how do you process and improve the items?An assembly line exists because items generated by the dispenser are not usable in their raw state, without processing. Refinery station is where items are modified. It's useful to think of a refinery station in terms of an action performed on a single object: a transformation.A real-life refinery station:translates a file from one language to anotherinserts a customer's name and email into an email templateconverts the day number into (day-number, day-of-week) pair, generates an iCalendar event specifying gym routine for the dayconverts the currency in a buy/sell instruction according to today's exchange ratetransforms a text file with markdown encoding into a static HTML filetransforms a line of log file into a JSON objectAssembly: how do you bundle the items?In an assembly station items are combined or bundled into larger packages in order to:assemble the items into a final product (a layer cake), orgroup items into batches (nobody would buy a single piece of pasta), orbundle the items together for shipment to save on individual delivery costs.A real-life assembly station might:compress files into a single archivewrap iCalendar events into a single iCalendar filecalculate a day's balance as sum of financial expenses and profitswrap JSON objects in a JSON listDispatcher: who organises delivery?Finally, items need to be passed to a dispatcher, who will then take care of further delivery. Like a dispenser, a dispatcher is not strictly part of the assembly line. An assembly line may have more than one dispatcher.A real-life dispatcher might perform:displaying translated files on a websitesending templates to an email server queueuploading the calendar to a calendar service or serverprinting a financial reportuploading files to a VPS via FTPsending JSON in response to an API requestAnalysing a systemIf a system doesn't look like it conforms to the basic assembly line pattern, classify functions of its components by function.DispenserDispatcherQuality ControlRefineryAssemblyInputOutputTests, checksTransformationsn items -> 1 itemRandomnessLoggingValue readsWrites, updatesTemporary cacheTimers-1 itemStatelessStatelessStop condition+1 itemStatefulRepeating or skipping stationsA process may repeat or skip stages of a certain type. For example, the following imaginary JSON processing workflow contains multiple Quality and Process steps, while skipping Assembly.Dispenser: decode a JSON string containing a list of objectsQuality: if field contents are empty, discard the objectwhere the field is "name"(empty "name" field means malformed data)Process: transform object "category" field from ID to label(using an ID-to-label lookup map from process configuration)Quality: if field contents are empty, discard the objectwhere the field is "category"(empty "category" field means the lookup failed)Process: encode each object as JSON stringDispatcher: save each string in a separate fileComposite Assembly LinesWhen examined in greater detail, stages of a process may consist of other assembly lines. Analysing your system in this way helps you find optimisations, reusability, and switch between bottom-up and top-down design (all of which we will cover when talking about assembly line design.)Dispenser: get files from a specified directoryDispenser: get a list of filesQuality: if a file is read-only or hidden, discard itQuality: if the extension is something else than clj, cljs, or cljc, discard the fileTransform: for each file, count its lines of codeDispenser: read in the file and split it into linesFilter: if a line is a comment, discard itAssembly: count the remaining linesDispatcher: return the line countAssembly: create a HTML report with LOC statisticsDispenser: calculate the min, max, mean and median and return a sequence of (label, value) pairsTransform: round each value to two digits and convert it to stringAssembly: update the HTML report template by copying each value into a location indicated by labelDispatcher: send the resulting webpage as a response to a request that triggered the processParallel Assembly LinesParallel processing is one of the flagship usecases for functional languages. This is because an assembly line is easily parallelised. Filters and transformations work on a single item at a time, independently of other items.every node in a processing cluster can run its own small sequence of filters and transformations.Dispenser: send each text of a corpus to an available distributed processing nodeTransform-parallel: a node calculates frequency of words in the text it receivedAssembly: collect results from nodes and calculate frequency of words in the entire corpusDispatcher: save the frequency table into a fileSummaryAn assembly line is a programming and system design pattern especially common in functional programming languages.An assembly line consists of a dispenser, which adds items to the line, a quality control station, which discards items from the line, a refinery which transforms the items, an assembly station which bundles them, and a dispatcher which sends them out of the system.Filters are functions which, given an item, return a boolean (indicating whether to keep or discard an item.) Transformations are functions which, given an item, return a new item. Both should be stateless, that is, given an item they will always return the same result. This makes assembly lines especially suited to parallel processing. Tags: hack functional-programming assembly-line « Best habits for a solo developer False Economy of Agile »'''
