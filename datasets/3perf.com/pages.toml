["http://3perf.com/talks/web-perf-101"]
title = "Web Performance 101: JS, CSS, HTTP, images & fonts · PerfPerfPerf"
description = "Learn how (and why) to make your app faster by optimizing JS, CSS, images/fonts and other things"
full_description = "This is an introduction to modern web loading performance. Learn why performance is important, what performance optimizations exist, and which tools can help you understand if your app is performing well. Want to apply this advice to your site? We help companies like Framer, Toggl, SitePoint to get faster – and we’d be happy to help you as well! Reach out First—a slow site is very uncomfortable. When a mobile site loads slowly, the user experiences stress similar to watching a horror movie. — In 2016, AliExpress increased the speed of their site by a third – and customer orders jumped 10.5%— Back in 2006, Google slowed down its search results by a half-second – and user requests dropped 25%— In 2008, Aberdeen Group discovered that discovered that making a site one second slower decreased user satisfaction by 16% and there’re lots of such data – from both old and recent studies (wpostats.com · pwastats.com). A site is fast when:— it loads quickly,— and, being loaded, it works quickly (meaning animations don’t skip frames, scrolling is smooth, etc.) A the site loads quickly when:— the server promptly responds to requests,— the app renders quickly The first element is not relevant – most often, performance problems lie in the second or the third one. The third element didn’t fit into the talk – we’ll probably make another one :) (Subscribe to get notified if/when it’s out.) The first way to optimize JavaScript is minification. If you already know about it, skip to the next section. During minification, the code loses all unnecessary characters, receives shorter variable names, and so on. In the end, it becomes smaller but keeps working as intended. Minification is supported in every major app builder:— mode: production in webpack,— babel-preset-minify in Babel,— gulp-uglify in Gulp Next. So, you wrote a script, minified it, and now want to load it on a page. How would you connect it to the page? The simplest approach is just to write the <script> tag and specify the path to your file. It’s a fine approach, and it works."
