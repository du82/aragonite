["http://3perf.com/blog/notion"]
title = "Case study: Analyzing Notion app performance · PerfPerfPerf"
description = "How to make a React app load ~30% faster – by tuning some configs and delaying some scripts"
full_description = '''Web performance isn’t going to save you in this crisis. But if you’re building a software product, chances are you’re relatively unaffected. And in this case, having a quick app is more important than ever. Internet is slowing down due to increased demand, and people are holding on to their phones for longer – so if your app is slow, your users will be affected by it. And slow app means worse business. Today, let’s take a look at Notion – an advanced note-taking web app. Notion is a great product, but one thing customers complain about is its startup time: Notion app and my laptop OS take the same time to boot.Beautiful application but it's tooooo slow😔— Aniket (@aniketmandle11) May 2, 2020 Notion shipped tremendous speed enhancements recently, but there’s still a lot of space to improve. Let’s reverse-engineer it and see what else can be optimized! Contents How Notion loads Cost of JavaScript Defer JS execution Use code splitting Check that module concatenation is working Try the lazy option of Babel’s plugin-transform-modules-commonjs Remove unused JS code Use code splitting Remove unused vendor code Remove polyfills Optimize the loading waterfall Defer third parties Preload API data Other stuff Cache-Control on responses Loading skeleton Summing up How Notion loads Notion is a React web app embedded into a native shell. This means its “startup time” is largely the “loading time of the web part”. To be concrete. On the desktop, the Notion app is a web app wrapped with Electron. On mobile, from my understanding, the Notion app runs both React Native parts (likely responsible for some mobile experiences) and web parts (likely responsible for the overall editing UI).Due to (apparently) HTTPS certificate pinning in the Android Notion app, I wasn’t able to verify whether the mobile app runs the same bundles the desktop app does. But even if the bundles are different, issues they are having are, likely, similar. To understand how the web part is loading, let’s create a public Notion page: and run a WebPageTest audit over it. (This works because public pages run the same code the whole app runs.)Sidenote: WebPageTest is an advanced performance testing tool. WebPageTest returns a lot of useful information, but the most interesting part is the loading waterfall: Woah, that’s a lot of info. What’s going on there? Here’s what’s going on: You open the page. The page loads a few stylesheets – and two JavaScript bundles, vendor and app. Once both bundles are loaded, they start to execute – and spend a whole second doing so. Once the app has been initialized, it starts sending API requests for page data, loading analytics... and executing more code... until, at 5.6 seconds, the first paint happens: ...but it’s just a spinner. At 6.2 seconds, the page content gets actually rendered. It takes a couple more seconds to finish loading all the hero image. 6.2 seconds for a desktop computer is quite a lot. However, with a medium-tier phone like Nexus 5, this time increases to 12.6 seconds. Here’s how that feels: Let’s see how we can improve it. Cost of JavaScript When one talks about “loading speed”, one typically means networking performance. From the networking standpoint, Notion is doing well: they’re using HTTP/2, they’re gzipping files, and they’re using Cloudflare as a proxying CDN. However, another part of “loading speed” that people talk less about is processing performance. All downloaded resources have a processing cost: gzip archives need to be decompressed; images need to be decoded; JS needs to be executed. Unlike networking performance, processing performance doesn’t improve with better networks – it’s only as fast as the user’s CPU is. And user’s CPUs in phones – especially Android phones – are bad: For Notion, processing performance is even more significant. It’s easy to avoid networking costs by caching network resources in the app. But processing costs are paid every single time the app starts – which means a phone user may see a 10-second splash screen multiple times a day. On our test Nexus 5, executing vendor and app bundles takes 4.9 seconds. This whole time, the page – and the app – stay non-interactive and empty: What’s happening there? WebPageTest doesn’t record JS traces, but if we go to DevTools and run a local audit, we’ll see this: First, the vendor bundle is being compiled (for 0.4s). Second, the app bundle is being compiled (for 1.2s). Third, both bundles start executing – and spend 3.3s doing so. So how can we reduce that time? Defer JS execution Let’s take a look at the bundle execution phase. What are all these functions? Turns out that’s bundle initialization: Functions with four-character names, like bkwR or Cycz, are application modules. When webpack builds a bundle, it wraps each module with a function – and assigns it an ID. That ID becomes the function name. In the bundle, this looks as follows:Before:import formatDate from './formatDate.js'; // ...After:fOpr: function(module, __webpack_exports__, __webpack_require__) { "use strict"; __webpack_require__.r(__webpack_exports__); var _formatDate__WEBPACK_IMPORTED_MODULE_0__ = __webpack_require__("xN6P"); // ... },Sidenote: Four-character IDs (like bkwR or Cycz) are used when optimization.moduleIds: 'hashed' or HashedModuleIdsPlugin is enabled. And the s function is actually __webpack_require__. __webpack_require__ is the webpack’s internal function that it uses for requiring modules. Whenever you write an import, webpack transforms it to __webpack_require__(). Bundle initialization takes so much time because it executes all the modules. Each module may take just a few milliseconds to execute, but with Notion’s 1100+ modules, this adds up. The only way to fix it is to execute fewer modules upfront. Use code splitting The best way to improve the startup time is to code-split away some features that’re not needed immediately. In webpack, this is done using import(): // Before <Button onClick={openModal} /> // After <Button onClick={() => import('./Modal').then(m => m.openModal())} /> Code splitting is the best first optimization you can do. It brings huge performance benefits: after doing code splitting, Tinder reported a 60% decrease in the complete load time; and our client, Framer, managed to cut 40-45% off the CPU Idle time. There are several common approaches to code splitting: splitting the bundle by pages, splitting away below-the-fold code, and splitting away conditional content (any dynamic UIs that are not visible immediately) The Notion app doesn’t have pages, and code-splitting below-the-fold content is hard because pages are very dynamic. This means the only useful approach is code-splitting conditional content. The following parts may be good candidates for that: Settings, Import, Trash – all UIs that are rarely used Sidebar, Share, Page options – all UIs that are frequently used but are not needed immediately when the app starts. Those could be preloaded and initialized right after the app starts Heavy page blocks. Some page blocks are quite heavy – e.g. the Code block supports highlighting 68 languages, which bundles 120+ minified KBs of language definitions from Prism.js. Notion seems to be code-splitting some blocks already (e.g., Math equation), but it might make sense to extend it to others as well. Check that module concatenation is working In webpack, the module concatenation feature is responsible for merging multiple small ES modules into one large. This reduces the module processing overhead and makes removing unused code more effective. To confirm that module concatenation is working: check that you’re not transpiling ES modules to CommonJS with Babel. @babel/preset-env doesn’t transpile ES modules into CommonJS check that optimization.concatenateModules is not disabled explicitly run the production webpack build with --display-optimization-bailout to see if there are any cases where module concatenation bails out Fun fact. Remember that all imports are transformed into the __webpack_require__ function?Well, what happens when the same function is called 1100 times throughout initialization? Right, it becomes a hot path taking 26.8% of the total time:(s is the minified name of __webpack_require__.)Unfortunately, apart from concatenating more modules, there’s not much to optimize there. Try the lazy option of Babel’s plugin-transform-modules-commonjs Note: this suggestion relies on disabling module concatenation. Because of that, it’s incompatible with the previous one. @babel/plugin-transform-modules-commonjs is an official Babel plugin that transforms ES imports into CommonJS require()s: // Before import formatDate from './formatDate.js'; export function getToday() { return formatDate(new Date()); } // After const formatDate = require('./formatDate.js'); exports.getToday = function getToday() { return formatDate(new Date()); }; And with its lazy option enabled, it also inlines all requires right into where they’re used: // After, with `lazy: (path) => true`, simplified exports.getToday = function getToday() { return require('./formatDate.js')(new Date()); }; Thanks to this transformation, if the getToday() function is never called, ./formatDate.js is never imported! And we don’t pay the import cost. There are a few drawbacks, however: Switching the existing codebase to lazy might be tricky. Some modules may rely on side effects from other modules, which we’re delaying here. Also, the plugin docs warn that the lazy option breaks cyclic dependencies Switching to CommonJS modules disables tree shaking in webpack. This means some unused code may be kept in the bundleSidenote: This doesn’t affect webpack 5, as it will add support for CommonJS tree shaking. Switching to CommonJS modules disables module concatenation. This means the module processing overhead will be higher These drawbacks make this option riskier compared to others – but if it plays right, its benefits might far outweigh its costs. How many modules could be deferred like this? Chrome DevTools let us find an easy answer. Open any JS-heavy page (e.g. the Notion one), go to DevTools, press Ctrl+Shift+P (Windows) or ⌘⇧P (macOS), type in “start coverage”, and press Enter. The page will reload, and you’ll see how much code was executed in the initial render.In Notion, 39% of the vendor bundle and 61% of the app bundle are unused after the page renders: Remove unused JS code Let’s take a look at the bundle initialization trace again: A significant part here is “Compile Script” (parts 1 and 2), which takes 1.6s in total. What is that? V8 (Chrome’s JS engine), just like other JS engines, uses just-in-time compilation to run JavaScript. This means all code it executes has to be compiled into machine code first. And the more code there is, the more time it takes to compile it. In 2018, on average, V8 was spending 10-30% of total execution time in parsing and compiling JavaScript. In our case, the compilation step takes 1.6s out of a total of 4.9s – a whopping 32%. The only way to reduce the compilation time is to serve less JavaScript.Sidenote: Another great approach would be to precompile JavaScript into machine code – and avoid parsing costs altogether by running compiled JavaScript. However, this is not currently possible. Use code splitting Yes, this again. By code-splitting unused functionality, you not only reduce bundle init time, but also decrease the compilation time. The less JS code there is, the faster it compiles. Check out the previous section on code splitting where we’ve talked about common code-splitting approaches & how Notion could benefit from it. Remove unused vendor code As we saw, when a page loads, almost 40% of the Notion’s vendor bundle stay unused: Some of that code will be needed later when the user does something in the app. But how much? Notion doesn’t publish source maps, which means we can’t use source-map-explorer to explore the bundle and see the largest modules. However, we could still guess libraries from their minified source – by looking at non-minified strings & searching for them in GitHub. Based on my analysis, here’re the 10 largest modules in the vendor bundle: fingerprintjs2 → 29 KB moment-timezone → 32 KB chroma-js → 35 KB tinymce → 48 KB diff-match-patch → 54 KB amplitude-js → 55 KB lodash → 71 KB libphonenumber-js/metadata.min.json → 81 KB react-dom → 111 KB moment with all locales → 227 KB Sidenote: This list does not include libraries that are composed of multiple small files.For example, the bundle also includes core-js, which occupies 154 KB but consists of 300+ small files. Out of all these modules, the most significant and easy to optimize ones are moment, lodash and libphonenumber-js. moment, a JS library for manipulating dates, is bundling 160+ minified KBs of localization files. Given than Notion is only available in English, this is hardly needed. What can one do here? First, drop unused moment locales using moment-locales-webpack-plugin. Second, consider switching from moment to date-fns. Unlike with moment, when you’re using date-fns, you’re importing only specific date manipulation methods you need. So if you only use addDays(date, 5), you won’t end up bundling the date parser.Sidenote: You-Dont-Meed-Momentjs: List of functions which you can use to replace moment.js lodash, a set of data manipulation utilities, bundles 300+ functions for working with data. That’s too much – from what I’ve seen, apps typically use 5-30 of those methods at most. The easiest way to drop unused methods is to use babel-plugin-lodash. Apart from that, lodash-webpack-plugin supports removing some lodash features (like caching or Unicode support) from inside these methods. libphonenumber-js, a library for parsing and formatting phone numbers, bundles an 81 KB JSON file with phone number metadata. I can’t see any places where phone numbers are used, so it’s likely this library supports a single use case somewhere deep in the Notion UI. It’d be great to replace it with another library or custom code – and drop the whole dependency. Remove polyfills Another major dependency present in the vendor bundle is polyfills from the core-js library: There are two problems with it. It’s unnecessary. We’re testing Notion in Chrome 81, which supports all the modern JS features. However, the bundle still includes polyfills for Symbol, Object.assign, and many other methods. These polyfills have to be downloaded, parsed, and compiled – all for nothing. This also affects Notion apps. In the desktop app (and probably in the mobile one as well), the JS engine version is modern, fixed, and well-known. There’s zero chance Symbol or Object.assign would be absent there – however, the app still downloads the same polyfills. What should we do instead? Ship polyfills for older browsers, but skip them for modern ones. See “How to load polyfills only when needed” for a few ways to do this. It’s bundled multiple times. The vendor bundle includes the core-js copyright '''
