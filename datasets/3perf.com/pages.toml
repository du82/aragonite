full_description = "A ton of extremely useful, actionable feedback that directly and significantly improved our First Meaningful Paint, Time to Interactive, [and] Speed Index What: we’ll analyze the site, identify all performance issues, and tell you which ones matter the most & how to fix them. I want to marry that audit document! The level of detail, including going through our own codebase and pin-pointing where exactly improvements need to happen, it’s just... wow Format: An audit document with concrete actionable steps · Takes one-two weeks · One month of support afterwards (to make sure the implementation goes smoothly) What: we’ll join your project, roll up our sleeves, find all performance bottlenecks, and apply precise optimizations – all by ourselves. In just a couple weeks, Ivan significantly improved runtime performance and tree shaking of our key components. One of our products’ bundle got 3 times smaller – with 10× less JS needed for the initial load! How this looks: we’ll take a bunch of slow sites or apps → profile each one → and make each one faster, learning multiple performance tools and techniques in the process. Ivan is immensely knowledgeable in React, in performance and in the combination of the two. I really recommend PerfPerfPerf’s React workshop to developers interested in getting the most out of their apps and in understanding the inner workings of React profiling. Format: Covers React performance or Core Web Vitals · Online or offline · Takes 12-16 hours. More details Are you a non-commercial open-source project? Our work wouldn’t be possible without open-source tools. Reach out, and, if we have capacity, we’ll be glad to help for free. Want something custom? We’ll be glad to help. Reach us, and let’s figure out how our experience can be relevant. We worked with Google on educating developers about web performance. This targets the long-term goal of making the web faster. The Hugo team was noticing their React app was slow here and there. They weren’t sure what was causing that, so they reached out to PerfPerfPerf for help."
