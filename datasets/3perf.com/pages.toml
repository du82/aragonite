title = "React Concurrency, Explained: What useTransition and Suspense Hydration Actually Do · PerfPerfPerf"
description = "Concurrent rendering: how it helps with performance, how it works under the hood, and why Vue.js/Preact refused to ship anything similar"
full_description = "In this talk, let’s peek under the hood of React 18’s useTransition and <Suspense>, see how they work, and figure out what drawbacks they have (there’s no free lunch!). 1489 days. This is how much time passed between Dan Abramov showing the first preview of what, back then, was called “Time Slicing” – and the React 18 release, which finally made these capabilities available for everyone. In these 1489 days, “Time Slicing” went through a bunch of rebrandings, several API changes, and, today, became known as “Concurrent Rendering.” If you’ve upgraded to React 18, you might’ve already seen its new features. If you haven’t, the “Concurrent Rendering” name might sound scary. But that’s okay! What’s actually new, performance-wise, in React 18 is just three things: Working with these things – especially with stuff like useTransition – might sometimes feel like magic. So today, I want to show you what actually happens in the app whenever you use useTransition and <Suspense>. So if a user tries to interact with the app in any way, they’ll have to wait until the rerender is done. If rerendering the app takes 2 seconds, the user will have to wait for two seconds. By the way – need help with React performance? We helped product companies like Appsmith, Hugo, and Castor to get React apps two, three, or even ten times faster and improve customer satisfaction. Let’s chat! With React 17 and below, every update that happens in the app is considered urgent. If you click a button, React has to handle the update immediately. If you type into the text field, React has to rerender the list of notes immediately. To learn more about how React 18 handles priorities, see a Twitter thread by @swyx, a React 18 Working Group discussion, and an article by JSer. The way this works is by giving the control back to the browser. React starts rendering the app – and then gives back control to the browser approximately every 5 ms. In React 17, this was it. You’d start processing the queue, and you’d keep processing it until you’re done. All this time, the main thread would be blocked."
author = "Ivan Akulov"
year_published = 2022
year_updated = 2022
