ymized information about you and how you use the Website. Analytics data is collected by using third-party cookies which are set by parties other than 3Route. A third-party cookie can recognize your computer both when it visits our Website and when it visits other websites or applications. We do not control how third-party cookies are used. You should check the third party's website for more information about how they use cookies. Wallet addresses (public blockchain addresses), transaction, and balance information (blockchain data) that is accessible when interacting with the Website. WE ARE NEVER GOING TO ASK YOU TO SHARE YOUR PRIVATE KEYS OR WALET SEED PHRASE. NEVER TRUST ANYONE OR ANY WEBSITE THAT ASKS YOU TO ENTER YOUR PRIVATE KEYS OR WALLET SEED PHRASE. How the collected information is used Generally, we collect and use information from you to provide, protect, and improve our Website, and to provide you with a personalized experience when using our Website. We will use the collected data: to understand and strive to meet your needs and preferences in using our Website; to develop new and enhance existing service and product offerings; to address service requests and resolve user questions; for purposes as disclosed at the time you provide your information, with your consent, and as further described in this Policy; to comply with regulatory and legal obligations; to find and prevent frauds; to deliver you promotions, news, and advertising information. We will process your personal information legally and fairly and not use it outside the purposes of which we have informed you, including selling it individually or in the aggregate for commercial use. Sharing of personal information We do not sell, exchange, transfer, or give your personal information to any other company or individual for any reason except as set forth below: we will share collected information with companies or individuals when we have your consent to do so only if necessary for operational purposes; we will share collected information with law enforcement or other third parties if we: (1) are compelled to do so to comply with any applicable law or legal process; or (2) believe in good faith that disclosure is necessary to prevent physical harm, illegal activity, or harm to the rights, property, or safety of 3Route or others. How collected information is protected We take reasonable precautions to protect your personal information from loss, misuse, unauthorized access, disclosure, alteration, and destruction. We maintain physical, technical and procedural safeguards to protect the confidentiality and security of your personal information. Such safeguards include the use of firewalls and data encryption, enforcing physical access controls to our buildings and files, and limiting access to personal information only to those employees, agents or third parties who need access to that information to process it for us. More specifically, our server uses TLS (Transport Layer Security) security protection by encrypting your personal information to prevent individuals from accessing such personal information as it travels over the internet. Please note that no electronic transmission, storage, or processing of Personal Data cannot be entirely secure. We cannot guarantee that the security measures we have in place to safeguard Personal Data will never be defeated or fail, or that those measures will always be sufficient or effective. Therefore, although we are committed to protecting your privacy, we do not promise, and you should not expect that your Personal Data will always remain private or secure. Retention of collected information We store the information we collect for as long as it is necessary for the purposes for which we initially collected it, to comply with our legal and regulatory processes, and to ensure this Privacy Policy. Site activity and analytics data, excluding analytics data collected by third parties, is retained for no longer than 180 day