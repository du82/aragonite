full_description = '''Back to Work Merlin’s weekly podcast with Dan Benjamin. We talk about creativity, independence, and making things you love. Join us via RSS, iTunes, or at 5by5.tv. ”What’s 43 Folders?” 43Folders.com is Merlin Mann’s website about finding the time and attention to do your best creative work. Episode #11: Johnny Heuristic Download MP3 | Huffduff It Back to Work #11: Johnny Heuristic - 5by5 on Huffduffer Merlin Mann joins Dan Benjamin to talk about futureproofing your passion by finding your obsession and voice, putting away your buggy whip and evolving, spreading your chips out across safe and risky investments, and taking smarter chances. read more » Merlin Mann - "Scared Shitless: How I (Mostly) Learned to Love Being Afraid of Pretty Much Everything" Download MP4 Video of "Scared Shitless" This is the video of a talk I did last month at Webstock in Wellington, New Zealand. It's pretty different from a lot of stuff I've done. It's about being scared. read more » Merlin’s First Desktop Tour on Vimeo (Full HD Version) After a recent “Most Days” episode, several people asked to see what all's in my menu bar, so I made this little video using ScreenFlow. It's a “proof of concept.” A “pilot program,” if you like. Again: an experiment. (Hint: this looks way better in full HD) Watch this space next week for more info on these apps, plus discount codes and more. read more » Leo Interviews Merlin Mann of 43 Folders The beginning of a blood-curdling recession hardly seems like the time to ruminate about fantasy resources, I'll grant you that. But, I want you to think about something. Really think about it. If, tomorrow morning, you had 60% of the time and resources you needed to start making anything you wanted, what would it be? And, what would you do first? read more » 43 Folders Clips (RSS) If you're curious about the stuff that gets my attention and inspires me (and, consequently, inspires the longer essays you see here on 43 Folders), you may enjoy my informal new sub-blog, 43 Folders Clips. read more »'''
