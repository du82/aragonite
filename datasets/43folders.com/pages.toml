["https://43folders.com/topics/inbox-zero"]
title = "Inbox Zero | 43 Folders"
full_description = '''Back to Work Merlin’s weekly podcast with Dan Benjamin. We talk about creativity, independence, and making things you love. Join us via RSS, iTunes, or at 5by5.tv. ”What’s 43 Folders?” 43Folders.com is Merlin Mann’s website about finding the time and attention to do your best creative work. 1. Nothing wrecks your living room decor quite like a giant, rented hospital bed. The one my Dad laid in for a couple months in the fall of 1974 was an alarmingly stiff and sturdy affair, the frame of which was forged of impossibly heavy iron, with half a dozen jaggy coats of putty-flesh latex paint doing a shit job of concealing the dings and dents kissed by dozens of clutches of burly rental guys trying to navigate unaccommodating residential doors. Jammed cattywampus between a teddy-bear brown sectional, an antiqued rococo credenza, and what had until recently been my Father's favorite armchair, the hospital bed left little room for easy socializing, let alone aesthetic speculation. This was a living room where a very ill person would mostly die soon. read more » Video: Makebelieve Help, Old Butchers, and Figuring Out Who You Are (For Now) - Vimeo [NSFW] MP3, Audio Only: Makebelieve Help, Old Butchers, and Figuring Out Who You Are (For Now) [NSFW] Here's a video I made about a video I made. Consequently, it's also about writing a book, fake self-help, the long road to developing expertise, and the ups and downs of repeatedly asking the world to tell you who you are. The video is long. As usual. This is how it works. read more » Real Estate Connect San Francisco 2008 | Inman News Later this morning, I'm honored to be delivering the keynote address at the Inman Real Estate Connect conference here in San Francisco -- coincidentally, a conference I attended in 2000 as the "Senior Producer" (whatever that means) for the real estate dotcom I was working for. I'll be doing my Inbox Zero talk and touching on some of the ways that real estate agents can use the system in their go-go, always-on sales environment. There are several new slides in today's deck that I'll be premiering with this version of the talk -- the one above reflects something I've been returning to a lot lately in helping people to spend less time fiddling with their messages: stop obsessing about "organizing" your email. read more »'''
