title = "How to Use 43 Folders | 43 Folders"
description = "A very simple guide to leaving here quickly so you can get back to making something awesome."
full_description = '''Back to Work Merlin’s weekly podcast with Dan Benjamin. We talk about creativity, independence, and making things you love. Join us via RSS, iTunes, or at 5by5.tv. ”What’s 43 Folders?” 43Folders.com is Merlin Mann’s website about finding the time and attention to do your best creative work. A very simple guide to leaving here quickly so you can get back to making something awesome. Ask yourself… Why am I here right now instead of making something cool on my own? What’s the barrier to me starting that right now? This is not an insult or put-down. It’s a useful question. Please, think about it, then search the site to see if we have anything that might inspire you to make something awesome today. What Sucks? Looking for specific answers to what sucks for you today? “My email sucks.” “My attention management sucks.” “My compulsive web browsing sucks.” “My lack of resolve to put my art first sucks.” “My procrastination sucks.” “No, seriously. My procrastination really sucks.” “My fiddling with ‘productivity systems’ sucks.” “My to-do list sucks.” “My blog sucks.” “My band’s stupid website sucks.” “My meetings suck.” “My PowerPoint presentation sucks.” “I suck.” More ideas Still sucking? No problem. Here’s more places to scratch around. Popular now — Here are the hottest articles on our site (right this minute). TitleRecent Getting started with "Getting Things Done"111 Introducing the Hipster PDA102 "Back to Work" - Merlin's New Thing with Dan Benjamin at 5by5.tv70 Video: John Roderick on String Art Owls, Copper Pipe, and Bono's Boss68 Cranking66 Our Most Popular Posts — Okay, technically, it’s the most popular from January 2007 til now. But, you know. You get the gist. TitleAll-time Getting started with "Getting Things Done"3088470 Introducing the Hipster PDA2348423 "Perfect" iTunes equalizer setting1892278 Cranking950210 Writing sensible email messages852739 Still Lost? Try a mental sweep, do a shitty first draft, or consider a modest change. Maybe just get away from the computer for a while by taking a nice walk. Without your phone. We’ll still be here when you come back. Promise. How to Know When You’re Done Here You’re done here whenever you’ve found just enough information to get you back on track for today. If we don’t have the right fit for you, we sincerely hope it won’t take you half a day of surfing to figure that out. We love having you visit with us here, and we hope you’ll return many times — whenever you think we might have something that might help you get over the hump. But. The Only “Productivity” That Matters The best advice we can offer is to just put your head down, push yourself harder, and try to figure out what you need to change today to get a little better. “Productivity” isn’t about about making more widgets per hour or being efficient and organized for its own anal-retentive sake. Real productivity means getting faster at moving the crap off your desk so you can have room to focus on the creative work that only you can do. Figure out how to do that every morning, and you’ll be ready to go pro.'''
