["https://43folders.com/2004/11/18/hack-your-way-out-of-writers-block"]
title = "Hack your way out of writer's block | 43 Folders"
description = "I recently had occasion to do some&#8230;errr&#8230;research on writer&#8217;s block. Yeah, research. That&#8217;s what I was doing. Like a scientist. I found lots of great ideas to get unstuck and wrote the best ones on index cards to"
full_description = "Back to Work Merlin’s weekly podcast with Dan Benjamin. We talk about creativity, independence, and making things you love. Join us via RSS, iTunes, or at 5by5.tv. ”What’s 43 Folders?” 43Folders.com is Merlin Mann’s website about finding the time and attention to do your best creative work. I recently had occasion to do some…errr…research on writer’s block. Yeah, research. That’s what I was doing. Like a scientist. I found lots of great ideas to get unstuck and wrote the best ones on index cards to create an Oblique Strategies-like deck. Swipe, share, and add you own in comments. Talk to a monkey - Explain what you’re really trying to say to a stuffed animal or cardboard cutout. Do something important that’s very easy - Is there a small part of your project you could finish quickly that would move things forward? Try freewriting - Sit down and write anything for an arbitrary period of time—say, 10 minutes to start. Don’t stop, no matter what. Cover the monitor with a manila folder if you have to. Keep writing, even if you know what you're typing is gibberish, full of misspellings, and grammatically psychopathic. Get your hand moving and your brain will think it’s writing. Which it is. See? Take a walk - Get out of your writing brain for 10 minutes. Think about bunnies. Breathe. Take a shower; change clothes - Give yourself a truly clean start. Write from a persona - Lend your voice to a writing personality who isn’t you. Doesn’t have to be a pirate or anything—just try seeing your topic from someone else’s perspective, style, and interest. Get away from the computer; Write someplace new - If you’ve been staring at the screen and nothing is happening, walk away. Shut down the computer. Take one pen and one notebook, and go somewhere new. Quit beating yourself up - You can’t create when you feel ass-whipped. Stop visualizing catastrophes, and focus on positive outcomes. Stretch - Maybe try vacuuming your lungs too. Add one ritual behavior - Get a glass of water exactly every 20 minutes. Do pushups. Eat a Tootsie Roll every paragraph. Add physical structure. Listen to new music - Try something instrumental and rhythmic that you’ve never heard before. Put it on repeat, then stop fiddling with iTunes until your draft is done. Write crap - Accept that your first draft will suck, and just go with it. Finish something. Unplug the router - Metafilter and Boing Boing aren’t helping you right now. Turn off the Interweb and close every application you don’t need. Consider creating a new user account on your computer with none of your familiar apps or configurations. Write the middle - Stop whining over a perfect lead, and write the next part or the part after that. Write your favorite part. Write the cover letter or email you’ll send when it’s done. Do one chore - Sweep the floor or take out the recycling. Try something lightly physical to remind you that you know how to do things. Make a pointless rule - You can’t end sentences with words that begin with a vowel. Or you can’t have more than one word over eight letters in any paragraph. Limits create focus and change your perspective. Work on the title - Quickly make up five distinctly different titles. Meditate on them. What bugs you about the one you like least? Write five words - Literally. Put five completley random words on a piece of paper. Write five more words. Try a sentence. Could be about anything. A block ends when you start making words on a page. On the other hand, remember Laurence Olivier. One day on the set of Marathon Man, Dustin Hoffman showed up looking like shit. Totally exhausted and practically delirious. Asked what the problem was, Hoffman said that at this point in the movie, his character will have been awake for 24 hours, so he wanted to make sure that he had been too. Laurence Olivier shook his head and said, “Oh, Dusty, why don’t you just try acting?” So, when all else fails, just try writing."
