title = "Scared Shitless | 43 Folders"
description = '''Merlin Mann - "Scared Shitless: How I (Mostly) Learned to Love Being Afraid of Pretty Much Everything" Download MP4 Video of "Scared Shitless" This is the video of a talk I did last month at Webstock in Wellington, New Zealand. It's'''
full_description = '''Back to Work Merlin’s weekly podcast with Dan Benjamin. We talk about creativity, independence, and making things you love. Join us via RSS, iTunes, or at 5by5.tv. ”What’s 43 Folders?” 43Folders.com is Merlin Mann’s website about finding the time and attention to do your best creative work. Merlin Mann - "Scared Shitless: How I (Mostly) Learned to Love Being Afraid of Pretty Much Everything" Download MP4 Video of "Scared Shitless" This is the video of a talk I did last month at Webstock in Wellington, New Zealand. It's pretty different from a lot of stuff I've done. It's about being scared. As I mentioned on Back to Work, Webstock is—what? Well. Webstock is unique. Truly. If you get the chance, you should go. Really. I could not and would not have done this talk in this way had I had not been so inspired (and, frankly, so terrified) by the awesomeness of the other speakers, by the quality of their talks, and by the astounding graciousness and empathy of the audience that this particular event attracts. Tash and Mike and their crackerjack team have made something really special here. I'm honored that they even invited me, and I'm insanely grateful for the care and hospitality that they showed to the speakers and to the attendees at every step of the way. Seriously. Thank you. So, yeah. I did something really weird at Webstock. Weird for me and, honestly, just plain weird for "a talk." I'm not sure if it succeeded. But, I did the best I could to make myself (along with some really heroic friends and fellow speakers) into a legitimate guinea pig for a concept that means the world to me: You can be scared and still do it anyway. Regardless of whatever it is. And, you can. No. Really. You. You can do this. You can run toward the shitstorm, let it cover you with shit, but, still never let it stop you from running. Because, like Crazy Bob says: "They can't eat you." And, they can't. And, they won't. Okay? Well, okay, then. BioMerlin Mann is an independent writer, speaker, and broadcaster. He’s best known for being the guy who created the website you’re reading right now. He lives in San Francisco, does lots of public speaking, and helps make cool things like You Look Nice Today, Back to Work, and Kung Fu Grippe. Also? He’s writing this book, he lives with this face, he suffers from this hair, he answers these questions, and he’s had this life. So far. Merlin’s favorite thing he’s written in the past few years is an essay entitled, “Cranking.” View full user profile'''
