full_description = '''Back to Work Merlin’s weekly podcast with Dan Benjamin. We talk about creativity, independence, and making things you love. Join us via RSS, iTunes, or at 5by5.tv. ”What’s 43 Folders?” 43Folders.com is Merlin Mann’s website about finding the time and attention to do your best creative work. [jump to video] Long story (not very) short? One night in 2003--after killing it in front of audience of about 30 lucky people in Oakland--The Long Winters needed a place to crash, and my wife and I were happy to oblige. So, they drove their Big Stinky Blue Van over the bridge, slept on our floor, and by breakfast the next morning, it'd become clear to me that I'd provided lodging to a man who was not only very likely a member of my karass--he was also one of the smartest bullshit artists I'd ever met. Almost eight years later, although I don't see him nearly as much as I'd like, I still count the guy as one of my best pals ever. That's John Roderick. read more » YouTube - Mindfulness with Jon Kabat-Zinn Jon Kabat-Zinn is the founder of the Center for Mindfulness in Medicine, Health Care, and Society at U Mass, and he's highly regarded for his role in bringing mindfulness into the mainstream of medicine. He's also an illuminating writer and speaker on the ways that mindfulness meditation can improve health and reduce stress. I really enjoyed this hour-plus talk Kabat-Zinn delivered at Google last year. It's a terrific introduction to meditation that includes a long portion where you can "meditate along," learning how to follow your breath and become more aware of being in the moment. (I doubt I'm the only one who'll benefit from that bit of help today). read more » Ads via The Deck //<![CDATA[ (function(id) { document.write('<script type="text/javascript" src="' + 'http://www.northmay.com/deck/deck' + id + '_js.php?' + (new Date().getTime()) + '"></' + 'script>'); })("MM"); //]]> Advertise on 43 Folders via The Deck utmx_section("My Section")43f Hosting by A