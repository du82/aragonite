full_description = "Back to Work Merlin’s weekly podcast with Dan Benjamin. We talk about creativity, independence, and making things you love. Join us via RSS, iTunes, or at 5by5.tv. ”What’s 43 Folders?” 43Folders.com is Merlin Mann’s website about finding the time and attention to do your best creative work. Introducing Instapaper 4.0 for iPad and iPhone The lede here is that my pal, Marco, has just released the stellar new 4.0 version of his Instapaper suite. This is fantastic news, and–as if you needed one more of Marco’s beta testers to say so–I do sincerely hope you’ll mark the occasion (and support his hard work) by purchasing the Instapaper iOS app(s). I promise you’ll be treating yourself to a massive update to an already excellent product. Now, it’s fortunate and appropriate that you’ll be hearing this advice at length from a lot of people this week. Because, if it’s not already obvious, Marco’s little app (and its associated services) enjoys a rabid fanbase of sundry paragraph cultists who are as eager as I am to spread the word; and, yes, we do want you to join the Reading Nerd cult. But, I also want to mark the occasion by adding a few thoughts on exactly what Instapaper has done, and continues to do, for me. (As you may already know, I’m a big Marco fan.) Thing is, I want to tell you how Marco has made a magical machine for people who have decided to read. Long-Time Fan For years, Instapaper has been one of the best made, most used, and most beloved apps in my iOS ecosystem. It’s always lived on my iPhone’s home page, and, as you can surmise, that’s because I use Instapaper a lot. Like, a lot a lot. Specifically, I use Instapaper a lot because it helps me do four things extremely well. Four things that work together to make my life a little better. In that typically annoying mixed order I can’t seem to stop doing, here goes. 2. Deciding WHEN to read Second, and most obviously, I use Instapaper maybe five to ten times a day to catch up on my reading. Which is great. This is what Instapaper is actually for, right? You read stuff. Long articles, smaller features, short books, big piles of documentation, and really just anything that I would like to read…later. More saliently, these are things that I have decided to read. This decision part’s important, but more on that in a couple minutes. But, how does all this “stuff” I’ve decided to read get in to Instapaper? 1. Deciding WHAT to read See, this is the really important first part. Because as much as I use Instapaper for all manner of reading, its use as an ephemeral destination for mostly ephemeral content wouldn’t be nearly so useful if I didn’t have so many ways to collect all that stuff. So, that flexibility in collecting material is where I end up using some form of Instapaper dozens of times each day. Examples? I have a bookmarklet for adding items to Instapaper in 4 browsers on 7 devices. I have (and use the hell out of) the “Send to Instapaper” services that are built in to everything from Google Reader to Reeder to Flipboard to Instacast to Tweetbot to Zite to you name it. I can automate in or out of Instapaper with If This Then That, I can email items directly to Instapaper–hell, I can even just copy a URL from iOS Safari, and paste it directly into the motherscratching Instapaper app. Suffice it to say, there are many ways to get “stuff” into Instapaper. E.g.: But, that banner dump only tells part of the story. Yes, a big part of this is about ubiquity and ease-of-use. But, the practical result is that all those little entrees to Instapaper are available to me everywhere I might need them, and they each represent a single little click that silently adds an item of “stuff” to my Instapaper pile. Each button is one more simple opportunity for me to decide to read. 3. Deciding WHERE to read Now, the third part of this magic is less immediately obvious, not least because the reading experience of the Instapaper iOS apps is, for my own purposes, perfect. But, there’s more. Because, all that support for getting stuff into Instapaper is mirrored by an endless number of ways to get stuff back out. To, in fact, read. That thing I decided to read is now everywhere. However I ended up deciding to read something, seconds after that *click*, the real magic starts happening, and–through whatever inscrutable black art and transmogrification is happening inside the fearsome celestial engine Marco has made–that decision to read is expressed in the most elegant of results and in a startlingly broad variety of convenient places. It’s readable on a website; it’s readable on an iPhone, and 2 iPads; it’s readable on a Kindle 3; it’s readable on the crazy number of apps and services that display Instapaper items. And, it’s even preserved for posterity in my private Pinboard archive. So, for practical purposes, this stuff that I’ve decided to read can now go whooshing through a network of customized tubes, and gently land practically anywhere that well-formed bits may reside. 4. Just…Deciding to Read I know most of you know these things. I know you’re familiar with the many “Features and Benefits” of Instapaper. And, I even know that most of you reading this are probably already using Instapaper–perhaps even to read this very article. So, the point here is not simply that Instapaper is flexible, idiot-proof, and sanity-savingly redundant. Although it is all those things and many more. The point is that my life always gets better when I decide to read things–and then actually read those things I decided to read. This is not a trivial point. We’re all busy, and we’re all bombarded with 10,000 potential calls on our attention every day. Some days, we handle that better than others. Some days, we don’t handle it all. All I know, is that, throughout my life, deciding to read has made that life better. It made my life better at 7 with Henry Huggins. It made my life better at 16 with Slaughterhouse-Five. It made my life better at 20 with Absalom, Absalom!. And, it made my life way better at 25 with A Confederacy of Dunces (cf.). And, now, for the past few years–following over a decade during which I read way more href tags than actual prose paragraphs–my life has gotten better, in part, due to Instapaper. I’ve finally gotten my hands around this “too much stuff” issue, at least insofar as it relates to words of theoretical interest. Now, I know where it goes. It goes into Instapaper. Because, now? Yeah. Twenty-some years after a college career sucking down over 1,000 pages a week, I am finally returning to reading a lot more. Because, I am deciding to read a lot more. Instapaper means there’s no excuse for not reading a lot more. Period. How about you? What Are YOU Deciding? When you’re in line at the ATM or the professional sporting event, what do you do? If you’re like a lot of people, you hit your mobile device like a pigeon on a goddamned pellet. Then, you decide what happens. You can decide to throw birds at pigs. You can decide to check in on which strangers are pretending to like you today. You may even decide to see what you would look like if you were really fat. Thing is, you could also decide to read. Just for a couple minutes. Maybe more. Maybe less. Who knows. It’s your decision. A Nudge Towards “Better” But, if you have followed the circuitous skeins of yarn comprising this little sweater you’ve been reading, it comes down to this: If you’ve decided that you want to read, Marco’s app will really help you. He’s removed any phony barriers you’ve built about “not having time” or “not having it with you” or “not knowing where to put it.” There are no excuses, apart from the superficial animated ones you’ve constructed out of cartoon birds. As for me? In the last week alone, I decided to read a lot of things in Instapaper. A small sampling: I decided to read about an American family’s educational experiment in Russia. I decided to read about what Heidegger means by Being-in-the-World. I decided to read about why toasters are so bad. I decided to read about responsive web design. I decided to read about why Charlie Kaufman wrote Being John Malkovich. I decided to read about how Open Data could make San Francisco Public Transportation better. I decided to read about how John Siracusa remembers Steve Jobs. I decided, and then I read. I read, and I read. So, thanks, Marco. You’ve made my life better by making it easier to decide to read. Then, you made it way easier to do the actual reading. And, to you–the kind readers-of-prose-paragraphs who were inexplicably patient enough to decide to read this long article–please consider supporting Marco’s work. Please get an account at Instapaper and, if you have an iOS dingus, please do buy the Instapaper app. In addition to having exquisite taste in app icons and a lovely speaking voice, Marco’s just a very good human. And, good humans more than deserve our support. Buy Instapaper 4.0 by Marco Arment."
