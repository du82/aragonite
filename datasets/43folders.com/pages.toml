full_description = '''Back to Work Merlin’s weekly podcast with Dan Benjamin. We talk about creativity, independence, and making things you love. Join us via RSS, iTunes, or at 5by5.tv. ”What’s 43 Folders?” 43Folders.com is Merlin Mann’s website about finding the time and attention to do your best creative work. 1. Nothing wrecks your living room decor quite like a giant, rented hospital bed. The one my Dad laid in for a couple months in the fall of 1974 was an alarmingly stiff and sturdy affair, the frame of which was forged of impossibly heavy iron, with half a dozen jaggy coats of putty-flesh latex paint doing a shit job of concealing the dings and dents kissed by dozens of clutches of burly rental guys trying to navigate unaccommodating residential doors. Jammed cattywampus between a teddy-bear brown sectional, an antiqued rococo credenza, and what had until recently been my Father's favorite armchair, the hospital bed left little room for easy socializing, let alone aesthetic speculation. This was a living room where a very ill person would mostly die soon. read more » Ads via The Deck //<![CDATA[ (function(id) { document.write('<script type="text/javascript" src="' + 'http://www.northmay.com/deck/deck' + id + '_js.php?' + (new Date().getTime()) + '"></' + 'script>'); })("MM"); //]]> Advertise on 43 Folders via The Deck utmx_section("My Section")43f Hosting by A2 A2 hosts 43 Folders with handsome aplomb. Please consider perusing their affordable shared hosting plans. » MerlinMann.com Back to Work Kung Fu Grippe You Look Nice Today 5ives Merlin on Twitter Merlin on Flickr PopularTodayPopularClassicsRecentPostsPopularTodayPopularClassicsOldies but goldies TitleGetting started with "Getting Things Done"Recent Hits110Created2004-09-08 13:25 TitleIntroducing the Hipster PDARecent Hits101Created2004-09-03 11:06 TitleFive fast email productivity tipsRecent Hits48Created2005-02-15 02:15 TitleProcrastination hack: '(10+2)*5'Recent Hits35Created2005-10-11 06:30 TitleHack