title = "Interviews | 43 Folders"
full_description = '''Back to Work Merlin’s weekly podcast with Dan Benjamin. We talk about creativity, independence, and making things you love. Join us via RSS, iTunes, or at 5by5.tv. ”What’s 43 Folders?” 43Folders.com is Merlin Mann’s website about finding the time and attention to do your best creative work. After almost a year of hand-wringing, fretting, and occasionally even writing the odd string of English words, I've finally started turning into the home stretch with the first draft of my Inbox Zero book. If it hasn't been obvious, or you couldn't just guess, this book project's been a big rock for me. Given the effort it's taken (read: most every hour I'm not sleeping, working, or pushing my daughter in a swing), it's also the primary reason why updates to 43 Folders have been so scarce over the last few months. The spirit was willing, but the brain--insanely sick of thinking about these very topics--was weak. Yes, as it turns out, writing a book does require an extraordinary expenditure of both attention and time. And, in my own case, I'll confess that this often meant working even more than four hours a week. But, who knows? Maybe that's just a consequence of my slow typing and abject lack of lifetrepreneurship. read more » Aha! Embeddable video for a third MacBreak interview at Macworld '08 has turned up -- this one's with Dave Teare at Agile Web Solutions, makers of 1Password. As we discuss in the video, I'm really looking forward to seeing 1Password's secure password bookmarklet for iPhone. MacBreak: Macworld 2008/Agile Web Solutions MacBreak (iPod video) - MacBreak 122: Macworld 2008: 1Password read more » Back at work killing time? Sure you are. After all, it's nationwide "Thumb up your butt" week, right? You bet it is. So, from the archives of 43 Folders (and the on-hiatus Merlin Show), here's four of my favorite videos of stuff I've done. Hope you like 'em. read more » The last week or so of The Merlin Show has featured three fun interviews with independent musicians -- talking about Macs, handling email, and figuring out how to get paid. Stop by for visits with John Roderick, Chris Wetherell, and John Vanderslice (or view the videos right here, after the jump...) read more »'''
