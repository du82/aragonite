full_description = '''Back to Work Merlin’s weekly podcast with Dan Benjamin. We talk about creativity, independence, and making things you love. Join us via RSS, iTunes, or at 5by5.tv. ”What’s 43 Folders?” 43Folders.com is Merlin Mann’s website about finding the time and attention to do your best creative work. Video: Makebelieve Help, Old Butchers, and Figuring Out Who You Are (For Now) - Vimeo [NSFW] MP3, Audio Only: Makebelieve Help, Old Butchers, and Figuring Out Who You Are (For Now) [NSFW] Here's a video I made about a video I made. Consequently, it's also about writing a book, fake self-help, the long road to developing expertise, and the ups and downs of repeatedly asking the world to tell you who you are. The video is long. As usual. This is how it works. read more » Active Voice Writing & Editorial Services in Baltimore -- Downloads Cool-looking collection of CC-licensed Hipster PDA templates include iconic "capture notes," research notes, and (here's a new one for me) a "yarn sorting card." Neat stuff. Simply drag and drop them to your desktop, or right-click and "save as." Templates are formatted as .png graphics and can be printed as-is or inserted into a formatted document. They can be resized to fit everything from a 3x5 card to a daily organizer to an 8.5x11 sheet. Kvet.ch features an excellent article on how to print D*I*Y Planner HPDA cards (see the end of this page) directly to 3x5 cards for Mac users. The technique should also work nicely with the templates offered here. Kung Fu, Meditation, and Sexual Intercourse There’s as rich a body of literature about (and tools for) Productivity as most any subject you can imagine. To avoid becoming an unproductive dilettante, make sure your practice of Productivity always takes precedence over your talmudic scholarship on the subject. AKA: All the reading in the world won’t teach you as much as your first french kiss. (Running Time: 03:47) Grab the MP3, learn more at Odeo.com, or just listen from here: read more »'''
