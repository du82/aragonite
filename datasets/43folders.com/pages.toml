full_description = "Back to Work Merlin’s weekly podcast with Dan Benjamin. We talk about creativity, independence, and making things you love. Join us via RSS, iTunes, or at 5by5.tv. ”What’s 43 Folders?” 43Folders.com is Merlin Mann’s website about finding the time and attention to do your best creative work. Introducing Instapaper 4.0 for iPad and iPhone The lede here is that my pal, Marco, has just released the stellar new 4.0 version of his Instapaper suite. This is fantastic news, and–as if you needed one more of Marco’s beta testers to say so–I do sincerely hope you’ll mark the occasion (and support his hard work) by purchasing the Instapaper iOS app(s). I promise you’ll be treating yourself to a massive update to an already excellent product. Now, it’s fortunate and appropriate that you’ll be hearing this advice at length from a lot of people this week. Because, if it’s not already obvious, Marco’s little app (and its associated services) enjoys a rabid fanbase of sundry paragraph cultists who are as eager as I am to spread the word; and, yes, we do want you to join the Reading Nerd cult. But, I also want to mark the occasion by adding a few thoughts on exactly what Instapaper has done, and continues to do, for me. (As you may already know, I’m a big Marco fan.) Thing is, I want to tell you how Marco has made a magical machine for people who have decided to read. read more » 1. Nothing wrecks your living room decor quite like a giant, rented hospital bed. The one my Dad laid in for a couple months in the fall of 1974 was an alarmingly stiff and sturdy affair, the frame of which was forged of impossibly heavy iron, with half a dozen jaggy coats of putty-flesh latex paint doing a shit job of concealing the dings and dents kissed by dozens of clutches of burly rental guys trying to navigate unaccommodating residential doors. Jammed cattywampus between a teddy-bear brown sectional, an antiqued rococo credenza, and what had until recently been my Father's favorite armchair, the hospital bed left little room for easy socializing, let alone aesthetic speculation. This was a living room where a very ill person would mostly die soon. read more »"
