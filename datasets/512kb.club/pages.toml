full_description = "The internet has become a bloated mess. Huge JavaScript libraries, countless client-side queries and overly complex frontend frameworks are par for the course these days. When popular website like The New York Times are multiple MB in size (nearly 50% of which is JavaScript!), you know there’s a problem. Why does any site need to be that huge? It’s crazy. But we can make a difference - all it takes is some optimisation. Do you really need that extra piece of JavaScript? Does your WordPress site need a theme that adds lots of functionality you’re never going to use? Are those huge custom fonts really needed? Are your images optimised for the web? The 512KB Club is a collection of performance-focused web pages from across the Internet. To qualify your website must satisfy both of the following requirements: It must be an actual site that contains a reasonable amount of information, not just a couple of links on a page (more info here). Your total UNCOMPRESSED web resources must not exceed 512KB. Help support the 512KB Club It takes a lot of work to run the 512KB Club. We rely on the kind work of a couple of great volunteers. If you want to support the 512KB Club, please do think about buying us a coffee. View FAQ for more details Visit a Random Site Jump to: Green Team (<100KB) Orange Team (<250KB) Blue Team (<512KB) The Green Team (<100KB) ^ Top ^ 3.00 KB karl.berlin 3.50 KB ig.emnace.org 3.65 KB thejollyteapot.com 3.90 KB m-chrzan.xyz 3.90 KB nih.ar 3.90 KB temp.sh 4.10 KB minwiz.com 4.18 KB hugo.gal 4.20 KB gsthnz.com 4.30 KB stchris.net 4.33 KB crism.ro 4.36 KB jamesst.one 4.50 KB yne.fr 4.62 KB devcara.com 4.70 KB buchh.org 4.70 KB gtrr.artemislena.eu 4.80 KB fossphones.com 4.85 KB raikas.dev 4.88 KB farajli.net 4.97 KB 2600.madrid 5.00 KB ccsleep.net 5.08 KB conorknowles.com 5.13 KB jakobmaier.at 5.30 KB consoom.soy 5.40 KB bestmotherfucking.website 5.40 KB gaikanomer9.com 5.51 KB rb.ax 5.70 KB penstemon.net 5.71 KB cheng.bearblog.dev 5.80 KB