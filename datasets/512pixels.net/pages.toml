title = "Performa Month: February 1994 Updates — 512 Pixels"
description = "In February 1994, Apple released three new Performa models. Dubbed the Macintosh Performa 575, 577, and 578, these machines were essentially a Quadra 605 in the all-in-one Performa/LC 520 case, bringing the 68LC040 CPU to the all-in-one Performa for the first time. Here is how the three models compared in some key metrics: Model: Memory: […]"
full_description = "Performa Month: February 1994 Updates August 13, 2024 ⌘ Permalink Stephen Hackett In February 1994, Apple released three new Performa models. Dubbed the Macintosh Performa 575, 577, and 578, these machines were essentially a Quadra 605 in the all-in-one Performa/LC 520 case, bringing the 68LC040 CPU to the all-in-one Performa for the first time. Here is how the three models compared in some key metrics: Model: Memory: HDD Size: Price: 575 5 MB 250 MB $2,099 577 5 MB 250 MB $2,199 578 8 MB 320 MB $2,299 Each of these models ran at 33 MHz. This was a full 32-bit design, so both the CPU and data path were 32-bit, unlike some previous machines which were slowed down by narrower buses. However, in true Apple-in-the-1990s fashion, there is weirdness we have to discuss. The clock input ran at 66 MHz on this version of the 68LC040, leading to some sources — including Apple’s official tech specs — to show these machines running at 66 MHz. However, that’s not true, as the CPU itself was clocked at 33 MHz. These three machines came equipped with a new communications slot that could be equipped with an Ethernet card for users who wanted high-speed networking. True to the Performa game plan, these computers came with numerous bundled software titles, including ClarisWorks 2.0, America Online 2.0, Microsoft Corp.’s Dinosaurs, and SoftKey International Inc.’s American Heritage Electronic Dictionary 2.0. What’s in a Name I think the 575, 577, and 578 really highlight the ridiculous nature of Apple’s naming scheme during this period. Like many Performas before and after the 570 series, this could have been a single computer with multiple BTO options. Today, we take for granted that a computer like the iMac can come with various RAM and SSD specifications. We understand that each option doesn’t need its own name and marketing, but Apple just wasn’t there in the 1990s. Most consumers didn’t understand what the differences were between memory and storage, let alone how much they needed of each. Multiple model numbers made it clear where a particular computer fell into the good/better/best matrix, at least to a degree. However, it doesn’t seem that Apple took real advantage of this scheme, according to James Staten at MacWEEK, who wrote: According to reports, the Performa 575, 577 and 578 are similar to the Mac LC 575, which features a 33-MHz 68040 processor, built-in 14-inch Trinitron display, tray-loading internal CD-ROM drive, unidirectional microphone, stereo speakers and one LC processor direct slot. The new models share the same logic board and enclosure but vary in their RAM and hard disk configurations. Sources also said that each model will be earmarked for sale in different retail channels, meaning that dealers will be able to sell only one of the three models. In the January 2 1995 edition of MacWEEK, David Ramsey revisited this topic, answering a confused reader: This is a result of an Apple manufacturing program called Customer Directed Manufacturing, or CDM. But lest you get the wrong impression, you are not the customer Apple has in mind here. The Performa line of Macs is designed to be sold through mass-market merchants rather than traditional computer-only stores. Mass-market merchants include consumer-electronics and appliance stores, as well as large department stores such as Sears, Roebuck and Co. CDM means that Sears can order 10,000 Performa 500-series machines built just as they want them, with memory, hard disk and installed software as specified. This also helps stores that have price guarantees — you know, “We’ll beat anyone’s price on this exact model.” Thanks to CDM, nobody else has that exact model! In fairness to Apple, though, I should mention that it is not the only company that does this. (This shouldn’t dissuade anyone from buying Performas; their preinstalled software and bundled monitors and modems are frequently the best deals in the Mac world.) Additionally, much of that clarification went out the window as Apple sold overlapping models and even other computers with the same number, such as the LC 575. This education-only SKU was the same as the Performa 575, but shipped with just 4 MB of RAM and with no CD-ROM drive. There was also an LC 550, powered by a Motorola 68030. Whew. Become a member of 512 Pixels. Support projects like these, receive exclusive content in the monthly newsletter, and more!"
