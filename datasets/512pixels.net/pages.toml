full_description = "OS X 10.8 Mountain Lion Even though Lion was hailed as the “Back to the Mac” release, 2012’s Mountain Lion did even more to bring iOS features and concepts to the Mac. Game Center, Notes and Reminders all made it into this version of OS X. Address Book and iCal were re-named Contacts and Calendars for better … synergy, I guess. Dictation made speech-to-text easier than ever on the Mac, and the inclusion of Notification Center gave users a centralized location to see and manage incoming notifications. Mountain Lion was also home to the first Messages beta, which brought iMessage to the Mac for the first time. 10.8 cost $19 in the Mac App Store. Sponsored by Rogue Amoeba Rogue Amoeba is a proud continuing sponsor of the 512 Pixels macOS Screenshot Library. Our powerful audio tools help make your Mac sound great: apply per-app audio controls with SoundSource, record any audio with Audio Hijack or its little brother Piezo, and route audio between apps with powerful virtual audio devices created by Loopback. Head to rogueamoeba.com to learn more and download our free trials today. Desktop About This Mac About This Mac: Details System Information Stacks Apple Menu Finder Menu Go Menu Finder: Go to Folder Finder: Connect to Server Finder: Network Finder: Home Finder: Cover Flow Finder: Quick Look Finder: Get Info Finder: Search Applications Applications: Utilities Menu Bar: Battery App Switcher Force Quit Finder: Copy Finder: Replace Finder: Empty Trash Finder: Eject Warning Fast User Switching Spotlight Spotlight: More Results Dashboard Mission Control Menu Bar: Time Machine Time Machine Launchpad Launchpad: Folder Fullscreen App Notification Center Dictation TextEdit TextEdit: Open TextEdit: Open: iCloud Print Activity Monitor AirPort Utility Automator Boot Camp Assistant Calculator Calendar Calendar: Preferences Chess Console Contacts Dictionary Disk Utility FaceTime Font Book Game Center Help Help: Search iTunes 10 iTunes 10: Preferences Keychain Ac