description = "In 2016, with 10.12 Sierra, Apple retired the name “Mac OS X” and replaced with “macOS” to better fit in with the company’s other platforms: iOS, watchOS and tvOS. While not as grand as the old “Mac OS” name from the pre-OS X days, I don’t mind it one bit. As far as features, Sierra’s […]"
full_description = "macOS 10.12 Sierra In 2016, with 10.12 Sierra, Apple retired the name “Mac OS X” and replaced with “macOS” to better fit in with the company’s other platforms: iOS, watchOS and tvOS. While not as grand as the old “Mac OS” name from the pre-OS X days, I don’t mind it one bit. As far as features, Sierra’s headlines were all about Siri. The virtual assistant can do the same sorts of tasks as always, but the Mac version can also be used to search for files and adjust system settings. Results can be turned into Today widgets or dragged into other applications if Siri returns images or other files. Sierra also blessed all standard macOS apps with tabs like Safari and Finder gained years earlier. This version of macOS also includes tools to manage disk space, including a new utility to easily see what is taking up space on the local disk and remove files or move them to iCloud. It also included Night Shift, to warm the color of the screen as the evening begins. Sponsored by Rogue Amoeba Rogue Amoeba is a proud continuing sponsor of the 512 Pixels macOS Screenshot Library. Our powerful audio tools help make your Mac sound great: apply per-app audio controls with SoundSource, record any audio with Audio Hijack or its little brother Piezo, and route audio between apps with powerful virtual audio devices created by Loopback. Head to rogueamoeba.com to learn more and download our free trials today. Desktop About This Mac System Information Stacks Apple Menu Finder Menu Go Menu Finder: Go to Folder Finder: Connect to Server Finder: Network Finder: Home Finder: Cover Flow Finder: Quick Look Finder: Get Info Finder: Search Applications Applications: Utilities Menu Bar: Battery App Switcher Force Quit Finder: Copy Finder: Replace Finder: Empty Trash Finder: Eject Warning Fast User Switching Spotlight Spotlight: More Results Mission Control Menu Bar: Time Machine Time Machine Launchpad Launchpad: Folder Fullscreen App Notification Center: Today Notification Cente