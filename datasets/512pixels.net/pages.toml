title = "The Now Page — 512 Pixels"
description = "This page is intended to serve as a running log of things I have going on, both professionally and in life. It’s like social media, but instead is a static page on a blog. Projects It’s been about a month since taking social media apps off of my phone and I think it’s going well. […]"
full_description = "The Now Page This page is intended to serve as a running log of things I have going on, both professionally and in life. It’s like social media, but instead is a static page on a blog. Projects It’s been about a month since taking social media apps off of my phone and I think it’s going well. I feel a little disconnected at times, but that’s not always a bad thing. Myke is officially on paternity leave now. So far, so good at Relay. Over at Cross Forward, David and I are in a good rhythm with feature releases across our portfolio of apps, and I’m tackling a series of big internal projects that no one will ever see, but it feels good to get them moving. I think the home network is in good shape, and with a fiber run about to go in between the office and the PodCabin, I should be done with it for a long time. I have set up a “Then” page to serve as an on-site archive of this page. Media I’m currently reading through several books on the Sermon on the Mount. I suspect this study will take months, as I’m moving pretty slowly through the text. I’m reading these books: Studies in the Sermon on the Mount by Dr. Martyn Lloyd-Jones The Sermon on the Mount by James Montgomery Boice Reading the Sermon on the Mount by John Stott and Douglas Connelly In stark contrast, I’ve finally gotten around to starting Nick Bilton’s American Kingpin, and it is wild. I am keeping up with the current seasons of Mythic Quest and Severance. The latter is possibly the best show I’ve watched since HBO’s Chernobyl aired several years ago. Updated February 28, 2025. View the changelog."
