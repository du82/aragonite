full_description = "OS X 10.10 Yosemite Available in October 2014, OS X Yosemite ushered in a brand-new version of Aqua. Now much more in line with iOS, Yosemite featured a flat design and wide-ranging use of transparency. It came complete with both light and dark modes, the latter making the menu bar, Spotlight (and its new center-of-the-screen design) and Dock black. Yosemite used Helvetica Neue as its default system font, replacing Lucida Grande. Many of Yosemite’s features made the Mac play better with its iOS cousins. Continuity meant a user could move between their Mac and iOS deices more seamlessly, while the new Today view in Notification Center made use of iOS-like widgets. Photos replaced both iPhoto and Aperture, and allowed users to sync their entire photo library with iCloud. Sponsored by Rogue Amoeba Rogue Amoeba is a proud continuing sponsor of the 512 Pixels macOS Screenshot Library. Our powerful audio tools help make your Mac sound great: apply per-app audio controls with SoundSource, record any audio with Audio Hijack or its little brother Piezo, and route audio between apps with powerful virtual audio devices created by Loopback. Head to rogueamoeba.com to learn more and download our free trials today. Desktop About This Mac System Information Stacks Apple Menu Finder Menu Go Menu Finder: Go to Folder Finder: Connect to Server Finder: Network Finder: Home Finder: Cover Flow Finder: Quick Look Finder: Get Info Finder: Search Applications Applications: Utilities Menu Bar: Battery App Switcher Force Quit Finder: Copy Finder: Replace Finder: Empty Trash Finder: Eject Warning Fast User Switching Spotlight Spotlight: More Results Dashboard Mission Control Menu Bar: Time Machine Time Machine Launchpad Launchpad: Folder Fullscreen App Notification Center: Today Notification Center: Notifications Dictation Light Mode Dark Mode TextEdit TextEdit: Open TextEdit: Open: iCloud Print Activity Monitor AirPort Utility Automator Boot Camp Assistant Calculator Cale