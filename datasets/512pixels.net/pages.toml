["https://512pixels.net/projects/aqua-screenshot-library/macos-11-0-big-sur"]
title = "macOS 11 Big Sur — 512 Pixels"
description = "Big Sur’s announcement brought a lot of change to the Mac operating system. As if ushering in a new UI wasn’t enough, it’s also the transition OS for Apple Silicon Macs, which can run iOS and iPadOS apps natively atop Big Sur. Oh, and the version number is officially 11.0, which is a lot of […]"
full_description = "macOS 11 Big Sur Big Sur’s announcement brought a lot of change to the Mac operating system. As if ushering in a new UI wasn’t enough, it’s also the transition OS for Apple Silicon Macs, which can run iOS and iPadOS apps natively atop Big Sur. Oh, and the version number is officially 11.0, which is a lot of fun. But about that UI … as you can see, it’s a big change. Menu bar items have more space, and Control Center has come to the Mac for the first time. Alerts are now centered (with centered text) above their corresponding windows, and the relationship between sidebars and titlebars has changed drastically. Both Light and Dark mode have been retained, but Apple has added an Accent Color setting that allows each app to use its own color to bring more personality to individual programs, which is a nice touch. This means the highlight color can remain blue, but buttons in Notes will be yellow and controls in Music and Calendar will be red. Big Sur goes further than previous versions of macOS in tinting windows with color sampled from the user’s wallpaper. This can be turned off in the General preference pane, but as it is the default, I’ve left it on for my screen shots. When using Big Sur, I leave it off. Sponsored by Rogue Amoeba Rogue Amoeba is a proud continuing sponsor of the 512 Pixels macOS Screenshot Library. Our powerful audio tools help make your Mac sound great: apply per-app audio controls with SoundSource, record any audio with Audio Hijack or its little brother Piezo, and route audio between apps with powerful virtual audio devices created by Loopback. Head to rogueamoeba.com to learn more and download our free trials today. Editor’s Note: As different as the UI is in Big Sur, the mechanics of Dark Mode haven’t changed, so I’m only showing the two modes in the first three galleries; the bulk of my Big Sur screenshots are in Light Mode. Last year, I had just shy of 300 Catalina images, and things were getting out of hand. Plus, the UI variety within System Preferences continues to evolve and expand, so it pretty much covers everything. Appearance & Accent Combinations Light: Accent Color Light: Blue Light: Purple Light: Pink Light: Red Light: Orange Light: Yellow Light: Green Light: Graphite Dark: Accent Color Dark: Blue Dark: Purple Dark: Pink Dark: Red Dark: Orange Dark: Yellow Dark: Green Dark: Graphite System Preferences (Light Mode) System Preferences Apple ID Family Sharing General Desktop & Screen Saver Dock & Menu Bar Dock & Menu Bar: Control Center Mission Control Siri Spotlight Language & Region Notifications Internet Accounts Wallet & Apple Pay Touch ID Users & Groups Accessibility Screen Time Extensions Security & Privacy Software Update Network Bluetooth Sound Printers & Scanners Keyboard Trackpad Mouse Displays Sidecar Battery Date & Time Sharing Time Machine Startup Disk System Preferences (Dark Mode) System Preferences Apple ID Family Sharing General Desktop & Screen Saver Dock & Menu Bar Dock & Menu Bar: Control Center Mission Control Siri Spotlight Language & Region Notifications Internet Accounts Wallet & Apple Pay Touch ID Users and Groups Accessibility Screen Time Extensions Security & Privacy Software Update Network Bluetooth Sound Printers & Scanners Keyboard Trackpad Mouse Displays Sidecar Battery Date & Time Sharing Time Machine Startup Disk Big Sur Desktop About This Mac System Information Stacks Desktop Stacks Apple Menu Finder Menu Go Menu Finder: Go to Folder Finder: Connect to Server Finder: Network Finder: Home Finder: Gallery View Finder: Quick Look Finder: Quick Look Markup Finder: Get Info Finder: Search Applications Applications: Utilities Menu Bar: Battery Menu Bar: Control Center App Switcher Force Quit Finder: Copy Finder: Replace Finder: Empty Trash Finder: Eject Warning Fast User Switching Fast User Switching: Login Window Spotlight Spotlight: More Results Mission Control Menu Bar: Time Machine Time Machine Launchpad Launchpad: Folder Full Screen App Split