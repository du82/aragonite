["https://512pixels.net/2025/02/more-on-the-c1"]
title = "More on the C1 — 512 Pixels"
description = "Stephen Nellis at Reuters, writing about Apple’s new cell modem: The C1 subsystem is the most complex technology Apple has ever built, with a baseband modem manufactured with advanced 4-nanometer chipmaking technology and a transceiver made with 7-nanometer technology, Johny Srouji, Apple’s senior vice president of hardware technologies, said in an interview at one of […]"
full_description = "More on the C1 → February 20, 2025 ⌘ Permalink Stephen Hackett Stephen Nellis at Reuters, writing about Apple’s new cell modem: The C1 subsystem is the most complex technology Apple has ever built, with a baseband modem manufactured with advanced 4-nanometer chipmaking technology and a transceiver made with 7-nanometer technology, Johny Srouji, Apple’s senior vice president of hardware technologies, said in an interview at one of Apple’s silicon labs in Sunnyvale, California. The chips had to be tested with 180 carriers in 55 countries to ensure they will work in all the places Apple ships iPhones. “We build a platform for generations,” Srouji said. “C1 is the start, and we’re going to keep improving that technology each generation, so that it becomes a platform for us that will be used to truly differentiate this technology for our products.”"
