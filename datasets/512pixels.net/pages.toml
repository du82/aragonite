full_description = "Skype to Drop Its Final Call on May 5 → February 28, 2025 ⌘ Permalink Stephen Hackett Tom Warren, writing at The Verge: It’s the end of an era. Microsoft is shutting down Skype in May and replacing it with the free version of Microsoft Teams for consumers. Existing Skype users will be able to log in to the Microsoft Teams app and have their message history, group chats, and contacts all automatically available without having to create another account, or they can choose to export their data instead. Microsoft is also phasing out support for calling domestic or international numbers. ”Skype users will be in control, they’ll have the choice,” says Jeff Teper, president of Microsoft 365 collaborative apps and platforms, in an interview with The Verge. “They can migrate their conversation history and their contacts out and move on if they want, or they can migrate to Teams.” Framous → February 27, 2025 ⌘ Permalink Stephen Hackett It’s not every week that I get to link to two new Mac apps, but turns out there is some good in this world yet. Dark Noise developer Charlie Chapman has a new app out for creating those fancy in-device screenshots you see on fancy blogs. Here’s how he described Framous to Chance Miller: Framous 1.0, the easiest way to quickly add device frames around your screenshots on the Mac, just released to the Mac App Store today. Drag and drop or copy and paste to throw your screenshots in and yank them back out perfectly set into device frames to make them look great. And with Shortcuts support you can even automate the process to make framing your screenshots even easier! Chance has also details about the app’s monetization strategy: You can download Framous from the Mac App Store for free and use generic device frames. To unlock all current frames and additional frames released in 2025, there’s a one-time purchase of $19.99. Alternatively, there’s a $9.99 yearly subscription to unlock all frames as they are released. Connected 541: The Suspicious Shape of Spaghetti → February 26, 2025 ⌘ Permalink Stephen Hackett This week on the podcast: Myke is away, so Stephen and Federico are relaunching every shirt from the show’s archives. Then, the guys talk through iOS 18.4 and Ticci’s new WiFi. Lastly, Stephen chats with Connected headphone expert Merri about her new Powerbeats Pro 2. It’s always fun to have my wife crash the podcast."
