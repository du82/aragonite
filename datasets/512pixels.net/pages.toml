full_description = "Mac OS X 10.6 Snow Leopard When asked which version of Mac OS X was the best, many Mac nerds will reply with Snow Leopard. Released in 2009 under the mantra “No New Features,” 10.6 did bring new things with it. Mail, iCal and Address Book were granted Microsoft Exchange integration, and as it was the first release to support only Intel Macs, the whole OS was smaller, shedding PowerPC code once and for all. Snow Leopard laid the groundwork for future releases and included OpenCL and Grand Central Dispatch to make computing with additional CPU cores and more powerful GPUs easier for developers. It is the last version to include Rosetta, which allowed PowerPC applications to run on Intel Macs. It cost just $29. Sponsored by Rogue Amoeba Rogue Amoeba is a proud continuing sponsor of the 512 Pixels macOS Screenshot Library. Our powerful audio tools help make your Mac sound great: apply per-app audio controls with SoundSource, record any audio with Audio Hijack or its little brother Piezo, and route audio between apps with powerful virtual audio devices created by Loopback. Head to rogueamoeba.com to learn more and download our free trials today. Desktop About This Mac System Profiler Stacks Apple Menu Finder Menu Go Menu Finder: Go to Folder Finder: Connect to Server Finder: Connect to iDisk Finder: Network Finder: Home Finder: Cover Flow Finder: Quick Look Finder: Get Info Finder: Search Applications: Applications: Utilities Menu Bar: Displays App Switcher Force Quit Finder: Copy Finder: Replace Finder: Empty Trash Finder: Eject Warning Fast User Switching Spotlight Spotlight: More Results Dashboard Exposé Dock Exposé Spaces Menu Bar: Time Machine Time Machine TextEdit TextEdit: Open Print Activity Monitor Address Book Address Book: New Contact AirPort Utility Automator Boot Camp Assistant Calculator Chess Console Dictionary Disk Utility Front Row Font Book Help Help: Search iCal iCal: Preferences iChat iSync iTunes 9 iTunes 9: Preferences Keychain A