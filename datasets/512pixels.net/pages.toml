["https://512pixels.net/2024/08/performa-month-fall-1993-updates"]
title = "Performa Month: Fall 1993 Brought an Avalanche of Machines — 512 Pixels"
description = "In the fall of 1993, Apple released a virtual beige avalanche of updated Performa models. Let’s jump in! Performa 275 Like the 250 before it, the 275 took the shape of a compact Mac. This time around, Apple based the Performa model on the Color Classic II, as LowEndMac writes: First available in Canada (1993), […]"
full_description = "Performa Month: Fall 1993 Brought an Avalanche of Machines August 8, 2024 ⌘ Permalink Stephen Hackett In the fall of 1993, Apple released a virtual beige avalanche of updated Performa models. Let’s jump in! Performa 275 Like the 250 before it, the 275 took the shape of a compact Mac. This time around, Apple based the Performa model on the Color Classic II, as LowEndMac writes: First available in Canada (1993), and then Asia and Europe (and never sold in the home US market), the Color Classic II (also known as the Performa 275) shares the motherboard design of the LC III. Running at a relatively fast 33 MHz, memory can be expanded as far as 36 MB. The CC II/Performa 275 and Performa/LC 550 share the same motherboard. If you ever need to perform a motherboard transplant, a 550 makes for a very inexpensive donor. Specs wise, the Color Classic II and Performa 275 were virtually identical. Many Color Classic II fans have put their machines through the “Mystic Upgrade,” which involves swapping in the motherboard from an LC 575: I don’t have a Color Classic II, but after reading more about the Mystic Upgrade, I really want one. A Cornucopia of Performa 400 Models The bulk of Performas released in the fall of 1993 were of the 400 variety, and unsurprisingly, it’s hard to understand what Apple was doing with some of these models. Up first was the Performa 410 was just a 400, but bundled with a 12″ Apple color monitor. The 460, 466, and 467 were siblings. They were based on the LC III+, complete with a 33 MHz Motorola 68030 on a full 32-bit bus. This meant the LC III+ and its clones were the fastest 68030 Mac ever shipped. On the Performa side, here’s how the hardware stacked up: Model: HDD Size: Price: 460 80 MB $1,300 466 160 MB $1,500 467 160 MB $1,500 All three SKUs came with 4 MB of memory and 512 KB of VRAM. The 475 & 476, Powered by the 68LC040 It’s a story for a different time, but Apple’s Quadra line was a family of Macs powered by the Motorola 68040. This new processor should have been a huge win for the Mac line, but due to the chip’s separate instruction and data caches, Apple had to do some weird stuff in Mac OS to maintain compatibility with software written for the 68020 or 68030. Many different models would ship with a Quadra badge on the front, but the Quadra 605 was the cheapest. It kept compatibility with the LC expansion slot, but did not include an FPU. One could be added by swapping out the Quadra 605’s 68LC040 CPU with a full-blown 68040. The Quadra 605 used an updated version of Apple’s smallest desktop case, but this time it was flat instead of being angled upward like the older LCs: image via Wikipedia When it came time to turn this small machine into a Performa, Apple named the “new” machines the Performa 475 and 476. The former shipped with 160 MB drive, while the latter had 230 MB of storage. They all used the FPU-less 68LC040 that the Quadra 605 did. Oddly, the Performa models used the old LC case and not the new Quadra case. I assume this was done in an effort to keep costs down. image via WorthPoint Performa 550 Lastly, we have the Performa 550, the first update to the 500 line we recently discussed. It was basically identical to the 520 before it, but its 68030 CPU was updated to run at 33 MHz. This means it’s on par with the Color Classic II mentioned above. The biggest news was an upgrade to the CD-ROM drive, which no longer required the use of a caddy. Oddly, this machine has the largest disparity in pricing that I’ve found in my research for this project so far. Some sources say Apple sold it for as little as $1,200, while others quote a cost of $2,000. I really hope no one paid two grand for this thing. Become a member of 512 Pixels. Support projects like these, receive exclusive content in the monthly newsletter, and more!"
