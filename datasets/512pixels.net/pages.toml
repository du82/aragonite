description = "At 512 Pixels, your privacy is important to us. We take your privacy seriously and only ask you to provide the personal information necessary to provide the services we offer. Also, we store personal information for only as long as we have a reason to keep it and aim to make it as simple as […]"
full_description = "Privacy Policy At 512 Pixels, your privacy is important to us. We take your privacy seriously and only ask you to provide the personal information necessary to provide the services we offer. Also, we store personal information for only as long as we have a reason to keep it and aim to make it as simple as possible for you to control your personal information. Who We Are and What This Policy Covers 512 Pixels consists of a website and related services: 512 Pixels and the 512 Pixels Membership. This Privacy Policy applies to information we collect you when you use any of these websites and their related products and services, which we refer to herein as the ‘Services.’ Information We Collect We only collect information about you if we have a reason to do so, including in connection with providing the Services, communicating with you, or improving the Services. We collect information if and when you provide information to us and information we collect automatically. Information You Provide to Us We collect information that you provide to us, including: Account information you provide if you sign up to be a member of 512 Pixels, including your name and email address Information you provide if you enter a giveaway or other promotion related to the Services Information you provide in response to polls, surveys, and similar communications with us transaction and billing information if you purchase something from us We also collect some information automatically: Log Information: Like most online service providers, we collect information that web browsers, mobile devices, and servers typically make available, such as the browser type, referring site, the date and time of access, operating system, and mobile network information. We also collect information about what happens when you use our Services (for example, page views) along with information about your device (for example, mobile screen size). We use this information to, for example, provide our Services to you, as well as get insights on how people use our Services, so we can make our Services better. How We Use The Information We Collect We use information about you as mentioned above and as follows: To provide our Services – for example, to set up and maintain your 512 Pixels Membership account To limit certain parts of 512 Pixels to members To monitor and analyze trends and better understand how users interact with our Services, which helps us improve our Services To monitor and protect the security of our Services, detect and prevent fraudulent transactions and other illegal activities, and protect the rights and property of 512 Pixels Sharing Information We do not sell our users’ private personal information. We share information about you in the limited circumstances spelled out below and with appropriate safeguards on your privacy: Third-Party Vendors: We may share information about you with third-party vendors who need to know information about you in order to provide their services to us. This group includes vendors that help us provide our Services to you (like payment providers that process your credit and debit card information, Memberful, which administers the 512 Pixels Membership, and Mailchimp, which provides email newsletter distributions services for the 512 Pixels Membership) and those that help us understand and enhance our Services (like analytics providers). We require vendors to agree to privacy commitments in order to share information with them. As Required by Law: We may disclose information about you in response to a subpoena, court order, or other governmental request. To Protect Rights and Property: We may disclose information about you when we believe in good faith that disclosure is reasonably necessary to protect the property or rights of 512 Pixels, third parties, or the public at large. Business Transfers: In connection with any merger, sale of company assets, or acquisition of all or a portion of our business by another company, or in the unlikely event that 512 Pixels goes out of business or enters bankruptcy, user information would likely be one of the assets that is transferred or acquired by a third party. If any of these events were to happen, this Privacy Policy would continue to apply to your information and the party receiving your information may continue to use your information, but only consistent with this Privacy Policy. With Your Consent: We may share and disclose information with your consent or at your direction. For example, we may share your information with third parties with which you authorize us to do so. Aggregated and De-Identified Information: We may share information that has been aggregated or reasonably de-identified, so that the information could not reasonably be used to identify you. For instance, we may share aggregate statistics about the use of our Services with prospective sponsors of our Services. Information Shared Publicly Information that you choose to make public is disclosed publicly. For example, if you submit a question or other information for inclusion in a 512 Pixels Membership newsletter and do not request anonymity, that information will be disclosed. Security We work very hard to protect information about you against unauthorized access, use, alteration, or destruction, and take reasonable measures to do so. Transferring Information 512 Pixels is a worldwide service. By accessing or using the Services or otherwise providing information to us, you consent to the processing, transfer, and storage of information in and to the U.S., and other countries, which may have rights and protections that are different from those in your home country. Ads and Analytics Services Provided by Others Ads appearing on any of our Services may be delivered by advertising networks. Other parties may also provide analytics services via our Services. These ad networks and analytics providers may set tracking technologies (like cookies) to collect information about your use of our Services and across other websites and online services. These technologies allow these third parties to recognize your device to compile information about you or others who use your device. This information allows us and other companies to, among other things, analyze and track usage, determine the popularity of certain content, and deliver advertisements that may be more targeted to your interests. Please note this Privacy Policy only covers the collection of information by 512 Pixels and does not cover the collection of information by any third party advertisers or analytics providers. 512 Pixels uses analytics providers to collect information about your use of our Services. This information allows us to, among other things, analyze and track usage and determine the popularity of certain content. Please note this Privacy Policy only covers the collection of information by 512 Pixels and does not cover the collection of information by any third-party sponsors or analytics providers. Privacy Policy Changes Although most changes are likely to be minor, 512 Pixels may change its Privacy Policy from time to time. 512 Pixels encourages visitors to check this page for any changes to its Privacy Policy. Credit This policy is adapted from the Automattic Privacy Policy which is made available under a Creative Commons Sharealike license."
