description = "In September 2000, Mac users could get a taste of the future with the Mac OS X Public Beta. For sale for $29, the release was plagued with problems, but showed off the Aqua interface and the marriage of NeXT’s technology with the classic Mac OS. It features several applications that didn’t ship as part […]"
full_description = "Mac OS X Public Beta In September 2000, Mac users could get a taste of the future with the Mac OS X Public Beta. For sale for $29, the release was plagued with problems, but showed off the Aqua interface and the marriage of NeXT’s technology with the classic Mac OS. It features several applications that didn’t ship as part of Mac OS X, including HTMLEditor, Sketch and Music Player. This release also features an Apple logo centered in the menu bar. The logo didn’t serve any interactive function in the user interface, and the OS X team quickly put the Apple menu back in its rightful place, letting it take over many functions found in the “Special” menu. The beta expired on May 14, 2001, and running it today requires manually setting the system clock to a time before that date. The Mac OS X Public Beta never had an “official” code name, but internally it was known as Kodiak. Sponsored by Rogue Amoeba Rogue Amoeba is a proud continuing sponsor of the 512 Pixels macOS Screenshot Library. Our powerful audio tools help make your Mac sound great: apply per-app audio controls with SoundSource, record any audio with Audio Hijack or its little brother Piezo, and route audio between apps with powerful virtual audio devices created by Loopback. Head to rogueamoeba.com to learn more and download our free trials today. Desktop About This Mac Apple System Profiler Desktop Menu Special Menu Go Menu Finder: Go To Folder Finder: Connect to Server Finder: Network Finder: Home Finder: Get Info 1 Finder: Get Info 2 Finder: Get Info 3 Finder: Get Info 4 Applications Applications: GrabBag Applications: Utilities App Switcher Force Quit Finder: Copy Finder: Replace Finder: Empty Trash TextEdit TextEdit: Open Print Calculator Chess Classic Console CPU Monitor Disk Utility Help Help: Search HTMLEditor Mail Mail: New Message Mail: Preferences Music Player Preview Process Viewer PPP Connect QuickTime Script Editor Sherlock Sketch Stickies System Preferences System Preference