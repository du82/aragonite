full_description = "OS X 10.9 Mavericks The first OS X release to break from the cat names and take its name from a location in California, Mavericks shipped in October 2013 for free. This version of Mac OS X includes several improvements designed to extend battery life for notebook users, including App Nap, compressed memory and timer coalescing. Finder gained tabs, and iBooks as well as Maps made their first appearance as system apps. While Aqua retained many components from Mountain Lion, much of the skeuomorphic design from previous releases were stripped from Maverick’s user interface. Sponsored by Rogue Amoeba Rogue Amoeba is a proud continuing sponsor of the 512 Pixels macOS Screenshot Library. Our powerful audio tools help make your Mac sound great: apply per-app audio controls with SoundSource, record any audio with Audio Hijack or its little brother Piezo, and route audio between apps with powerful virtual audio devices created by Loopback. Head to rogueamoeba.com to learn more and download our free trials today. Desktop About This Mac About This Mac: Details System Information Stacks Apple Menu Finder Menu Go Menu Finder: Go to Folder Finder: Connect to Server Finder: Network Finder: Home Finder: Cover Flow Finder: Quick Look Finder: Get Info Finder: Search Applications Applications: Utilities Menu Bar: Battery App Switcher Force Quit Finder: Copy Finder: Replace Finder: Empty Trash Finder: Eject Warning Fast User Switching Spotlight Spotlight: More Results Dashboard Mission Control Menu Bar: Time Machine Time Machine Launchpad Launchpad: Folder Fullscreen App Notification Center Dictation TextEdit TextEdit: Open TextEdit: Open: iCloud Print Activity Monitor AirPort Utility Automator Boot Camp Assistant Calculator Calendar Calendar: Preferences Chess Console Contacts Dictionary Disk Utility FaceTime Font Book Game Center Help Help: Search iBooks iTunes 11 iTunes 11: Preferences Keychain Access Mac App Store Mac App Store: Updates Mail Mail: Preferences Ma