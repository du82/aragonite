description = "Released in September 2023, macOS 14 Sonoma was the fourth version of macOS to run on Apple silicon Macs and Intel machines, dropping support for all 2017 Intel machines except for the one-off iMac Pro. In conjunction with iOS and iPadOS 17, this release had a big focus on widgets, which now run on the […]"
full_description = "macOS 14 Sonoma Released in September 2023, macOS 14 Sonoma was the fourth version of macOS to run on Apple silicon Macs and Intel machines, dropping support for all 2017 Intel machines except for the one-off iMac Pro. In conjunction with iOS and iPadOS 17, this release had a big focus on widgets, which now run on the Desktop, free from the cramped space of Notification Center. Messages, Notes, Reminders and other system apps were updated across the ecosystem. Safari gained the ability to save websites as stand-alone apps. Apple focused on gaming for macOS Sonoma, launching tools for developers to port their titles to Apple silicon, and even including a Game Mode, which automatically gives games top priority on the CPU and GPU. Visually, the biggest change — other then widgets hanging out on the Desktop — was the inclusion of screensavers from tvOS that gracefully blended into a still desktop picture when logging in. Sponsored by Rogue Amoeba Rogue Amoeba is a proud continuing sponsor of the 512 Pixels macOS Screenshot Library. Our powerful audio tools help make your Mac sound great: apply per-app audio controls with SoundSource, record any audio with Audio Hijack or its little brother Piezo, and route audio between apps with powerful virtual audio devices created by Loopback. Head to rogueamoeba.com to learn more and download our free trials today. Editor’s Note: Like for previous releases, I am providing both Light and Dark Mode images in just the first two image collections. Appearance & Accent Combinations Light: Multicolor Light: Blue Light: Purple Light: Pink Light: Red Light: Orange Light: Yellow Light: Green Light: Graphite Dark: Multicolor Dark: Blue Dark: Purple Dark: Pink Dark: Red Dark: Orange Dark: Yellow Dark: Green Dark: Graphite System Settings Apple ID Wi-Fi Bluetooth Network Notifications Sound Focus Screen Time General General: About General: Software Update General: Storage General: AirDrop & Handoff General: Login Items Gener