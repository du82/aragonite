description = "It’s not every week that I get to link to two new Mac apps, but turns out there is some good in this world yet. Dark Noise developer Charlie Chapman has a new app out for creating those fancy in-device screenshots you see on fancy blogs. Here’s how he described Framous to Chance Miller: Framous […]"
full_description = "Framous → February 27, 2025 ⌘ Permalink Stephen Hackett It’s not every week that I get to link to two new Mac apps, but turns out there is some good in this world yet. Dark Noise developer Charlie Chapman has a new app out for creating those fancy in-device screenshots you see on fancy blogs. Here’s how he described Framous to Chance Miller: Framous 1.0, the easiest way to quickly add device frames around your screenshots on the Mac, just released to the Mac App Store today. Drag and drop or copy and paste to throw your screenshots in and yank them back out perfectly set into device frames to make them look great. And with Shortcuts support you can even automate the process to make framing your screenshots even easier! Chance has also details about the app’s monetization strategy: You can download Framous from the Mac App Store for free and use generic device frames. To unlock all current frames and additional frames released in 2025, there’s a one-time purchase of $19.99. Alternatively, there’s a $9.99 yearly subscription to unlock all frames as they are released."
