title = "Skype to Drop Its Final Call on May 5 — 512 Pixels"
description = "Tom Warren, writing at The Verge: It’s the end of an era. Microsoft is shutting down Skype in May and replacing it with the free version of Microsoft Teams for consumers. Existing Skype users will be able to log in to the Microsoft Teams app and have their message history, group chats, and contacts all […]"
full_description = "Skype to Drop Its Final Call on May 5 → February 28, 2025 ⌘ Permalink Stephen Hackett Tom Warren, writing at The Verge: It’s the end of an era. Microsoft is shutting down Skype in May and replacing it with the free version of Microsoft Teams for consumers. Existing Skype users will be able to log in to the Microsoft Teams app and have their message history, group chats, and contacts all automatically available without having to create another account, or they can choose to export their data instead. Microsoft is also phasing out support for calling domestic or international numbers. ”Skype users will be in control, they’ll have the choice,” says Jeff Teper, president of Microsoft 365 collaborative apps and platforms, in an interview with The Verge. “They can migrate their conversation history and their contacts out and move on if they want, or they can migrate to Teams.”"
