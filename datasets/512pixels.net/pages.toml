full_description = "Mac OS X 10.5 Leopard Mac OS X 10.5 Leopard was released on October 26, 2007 after a lengthy development cycle that Apple said was slowed by the release of the original iPhone. When it did ship, Leopard was a major push forward for OS X. Gone were the numerous window styles that had cropped up in the Panther and Tiger years. Every major application and window were now using a new gray appearance that gave the whole OS a more mature look. Beyond window styles, Leopard brought a new Dock, which included Stacks, a way to look into a folder stored in the Dock. The release also brought automated backups with Time Machine, a redesigned Finder complete with Cover Flow and Quick Look, Photo Booth, an expanded Mail that now supported things like notes and RSS feeds and Spaces, Apple’s take on virtual desktops. Sponsored by Rogue Amoeba Rogue Amoeba is a proud continuing sponsor of the 512 Pixels macOS Screenshot Library. Our powerful audio tools help make your Mac sound great: apply per-app audio controls with SoundSource, record any audio with Audio Hijack or its little brother Piezo, and route audio between apps with powerful virtual audio devices created by Loopback. Head to rogueamoeba.com to learn more and download our free trials today. Desktop About This Mac System Profiler Stacks Apple Menu Finder Menu Go Menu Finder: Go to Folder Finder: Connect to Server Finder: Connect To iDisk Finder: Network Finder: Home Finder: Cover Flow Finder: Quick Look Finder: Get Info Finder: Search Applications Applications: Utilities Menu Bar: Displays App Switcher Force Quit Finder: Copy Finder: Replace Finder: Empty Trash Finder: Eject Warning Fast User Switching Spotlight Spotlight: More Results Dashboard Exposé Spaces Menu Bar: Time Machine Time Machine TextEdit TextEdit: Open Print Activity Monitor Address Book Address Book: New Contact AirPort Utility Automator Calculator Chess Console Dictionary Disk Utility Font Book Front Row Help Help: Search iCal iCal: Pre