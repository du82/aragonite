full_description = "macOS 12 Monterey macOS Big Sur helped usher in the Apple silicon era, and with it, a new design of macOS. For 2021, Monterey has a less ambitious set of tasks, but it does continue Apple’s efforts to better tie the Mac and its mobile device cousins closer together with features like SharePlay and Universal Control. …neither of which shipped with the operating system at launch. Launching alongside the first M1 Pro and M1 Max notebooks, Monterey does unravel the mystery of Big Sur’s taller menu bar and the inclusion of Control Center to keep clutter to a minimum — Apple was laying the groundwork for the first Mac displays with notches. The notebook used for these screenshots was an M1 MacBook Air with no notch, so the effects of this change aren’t present in the images below. Sponsored by Rogue Amoeba Rogue Amoeba is a proud continuing sponsor of the 512 Pixels macOS Screenshot Library. Our powerful audio tools help make your Mac sound great: apply per-app audio controls with SoundSource, record any audio with Audio Hijack or its little brother Piezo, and route audio between apps with powerful virtual audio devices created by Loopback. Head to rogueamoeba.com to learn more and download our free trials today. Editor’s Note: Like last year, I am providing both Light and Dark Mode images in just the first two collections of images. Appearance & Accent Combinations Light: Accent Color Light: Blue Light: Purple Light: Pink Light: Red Light: Orange Light: Yellow Light: Green Light: Graphite Dark: Accent Colors Dark: Blue Dark: Purple Dark: Pink Dark: Red Dark: Orange Dark: Yellow Dark: Green Dark: Graphite System Preferences (Light Mode) System Preferences Apple ID Family Sharing General Desktop & Screen Saver Dock & Menu Bar Dock & Menu Bar: Control Center Mission Control Siri Spotlight Language & Region Notifications Notifications: Focus Internet Accounts Passwords Wallet & Apple Pay Users & Groups Accessibility Screen Time Extenions Security & Privac