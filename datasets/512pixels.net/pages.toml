description = "In the spring of 1996, Apple updated its all-in-one Performa across two collections of models: the 5200 and 5400. Thankfully, not all of them were beige… Performa 5200 Series In 1996, the Performa 5200 line was updated with three new models: Model: CPU: Memory: HDD Size: Price: 5260CD 100 MHz PowerPC 603e 8 or 16 […]"
full_description = "Performa Month: 1996 Arrives August 23, 2024 ⌘ Permalink Stephen Hackett In the spring of 1996, Apple updated its all-in-one Performa across two collections of models: the 5200 and 5400. Thankfully, not all of them were beige… Performa 5200 Series In 1996, the Performa 5200 line was updated with three new models: Model: CPU: Memory: HDD Size: Price: 5260CD 100 MHz PowerPC 603e 8 or 16 MB 800 MB $1,699 5260/120 120 MHz PowerPC 603e 8 or 16 MB 1.2 GB $1,499 5270CD 100 MHz PowerPC 603e 8 MB 1.2 GB Unknown The 5260/100 came out in the fall of 1996, following the 5260CD and 5270CD, which both shipped in April of that year. All three of these systems shipped with a 14-inch CRT, running at 640 x 480 resolution, despite earlier Performas in the same enclosure using a 15-inch CRT capable of running at 832 x 624. Performa 5400 Series The Mac Performa 5400 Series was also released in April 1996. It shipped with the previous 15-inch display and PowerPC 603e CPUs ranging from 120-180 MHz. This line up included the Performa 5400/180 Director’s Edition, which came in a black case. I mean, just look at this detail: The Power Macintosh version seems to have omitted that logo: (I want one of these very badly.) Inside that sick black enclosure was a 180 MHz PowerPC 603e-powered system with 16 MB of RAM, a 1.6 GB hard drive, an 8X CD-ROM drive, and a TV tuner card. The Performa was only sold in Australia; the closest thing we got was the ill-fated Macintosh TV. It seems that black Power Macintosh popped up in Europe and Asia, however. The rest of the 5400 series is boring. Next time, we’ll break down the final three Performa models! Become a member of 512 Pixels. Support projects like these, receive exclusive content in the monthly newsletter, and more!"
