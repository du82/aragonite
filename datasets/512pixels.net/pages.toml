["https://512pixels.net/about"]
title = "About — 512 Pixels"
description = "Hello. My name is Stephen Hackett. I live in my hometown of Memphis, Tennessee. My wife and I have three children, a dog named Eva Corndog and a cat named Albert Queso. I make podcasts and write for a living. I’m the co-founder of the Relay podcast network, where I host several shows. You can […]"
full_description = "About Hello. My name is Stephen Hackett. I live in my hometown of Memphis, Tennessee. My wife and I have three children, a dog named Eva Corndog and a cat named Albert Queso. I make podcasts and write for a living. I’m the co-founder of the Relay podcast network, where I host several shows. You can learn about these projects and more below. I’m a collector of all things Apple. As such, old computers outnumber people in our house, and I have a dogcow tattoo on my ankle. You can email me at stephen@hackett.fm. I’m also on too many social media networks: Bluesky Mastodon Threads Instagram I’m taking a bit of a break from social media, but you can keep up with what I’m doing by visiting this page, which I update on a regular basis. About 512 Pixels Here’s how you can follow along and help keep the lights on here: Subscribe via RSS. Follow the blog on Mastodon. Become a member. Sponsor the blog for a week. I (sometimes) host Apple history videos and other nerdy content on the 512 Pixels YouTube channel. Go subscribe! Sometimes people ask me what the name “512 Pixels” means. The original Macintosh’s screen was 512 pixels across, making the screen resolution 72 DPI. The Mac’s GUI paved the way for computers and design as we know them today. macOS Wallpapers in 5K 6K Every default macOS wallpaper, with the old ones remastered for our modern Retina age. The macOS Screenshot Library I have assembled a detailed screenshot collection of every major version of macOS. Gear List You can see a list of gear I use here. This page also shows off photos of the PodCabin, my studio. (As an Amazon Associate, I earn from qualifying purchases.) Relay & Podcasts In 2014, Myke Hurley and I co-founded the Relay podcast network. We have shows with topics ranging from Apple and Google to pens and feelings. We get to work with the best people in the business. I currently co-host two shows on Relay: Mac Power Users is a podcast I host with David Sparks. We interview interesting people about how they use Apple gear, dive into nerdy topics, review categories of apps and more. Connected is a weekly panel discussion on Apple and the impact of technology on our lives. I co-host it with Myke Hurley and Federico Viticci of MacStories. We each have a unique accent and perspective, making Connected special. And weird. Cross Forward In late 2023, I joined David Smith’s company and work with him on his portfolio of apps, including Widgetsmith, Pedometer++, Sleep++ and more. My work there focuses on communication and customer support. You can read more about this addition to my work in this blog post."
