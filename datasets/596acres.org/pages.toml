title = "Land Access Advocacy Network – 596 Acres"
full_description = "596 Acres convenes an active network of land access facilitators who cross-pollinate each other’s work. We engage in an ongoing conversation with other groups about how to make land more available to communities in our cities. You can learn about 596 Acres’ partnerships to build mapping tools that support these advocates’ work in Maps for Other Cities and read updates from across our network in our News section. A list of participants in the worldwide network is below. One highlight of our work with this international network was a 2-day symposium we hosted with the New School in April 2014: Turning Vacant Acres into Community Resources. You can read the conference materials and the issue of Cities and the Environment derived from its proceedings. That gathering brought together representatives from many of the organizations below, who are facilitating the transformation of vacant lots and community control of land in towns and cities around the world. If you’re looking to plug in directly to any of the below projects, please get in touch with them! And please contact us if there are other great transformation facilitators out there who we should connect with and list here! Sanjay Kharod of the New Orleans Food & Farm Network, Paula Z. Segal of 596 Acres and Marco Clausen of Prinzessinnengarten at the Turning Vacant Acres into Community Resources symposium In the United States California Collective Roots, East Palo Alto Community Health Councils, Los Angeles (our partner on LA Open Acres) From Lot to Spot, Los Angeles Los Angeles Neighborhood Land Trust San Francisco Parks Alliance Illinois NeighborSpace, Chicago Openlands, Chicago Louisiana New Orleans Food & Farm Network (our partner on Living Lots NOLA) Michigan Detroit Black Community Food Security Network Michigan Community Resources Maine Lots to Gardens, Lewiston Maryland Baltimore Green Space Community Law Center’s Urban Agriculture Law Project, Baltimore Massachusetts Boston Food Project