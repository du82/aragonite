zing. Manhattan Borough President’s Office The Manhattan Community Award Program (MCAP) provides small funding awards—between $3,500 and $5,000—to nonprofit organizations and public schools to help support programming or operational expenses. Each award is contracted through one of five City agencies (DFTA, DOC, DOE, DOHMH, or DPR). Proposals must relate to the specific agency’s overall mission and goals. The New York Community Trust The New York Community Trust grants are made on a rolling basis and support programs that improve the lives of all New Yorkers, with an emphasis on promoting healthy lives, promising futures, and thriving communities. Partnership for Parks The Partnerships for Parks Capacity Fund Grant program provides small grants of up to $5,000 to strengthen the outreach, membership, and program-planning capacity of community groups who care for their neighborhood parks, gardens and green spaces in all five boroughs of New York City. Project work must be on NYC Parks Department property. Deadlines are February 1, June 1 and October 1. The Riverside Church The Riverside Sharing Fund grants up to $5,000 to projects outside the church that are consistent with their mission of “education, reflection, and action for peace and justice.” Rolling deadline! Seeds of Change The Seeds of Change Grant Program offers four $20,000 grants and twenty $10,000 grants to support sustainable, community-based farming and gardening programs. Half of the grants go to community gardens, half to school gardens. SeedMoney SeedMoney, a program of Kitchen Gardeners International, is a crowdfunding site exclusively for food garden projects. During its 2015 grant cycle, SeedMoney also awarded challenge grants to motivate donors and merit grants for worthy projects without a base of individual donors. United States Department of Agriculture The USDA Farm to School Grant Program assists eligible entities in implementing farm to school programs that improve access to local foods in eligible schools. On an annual basis, USDA awards up to $5 million in competitive grants for training, supporting operations, planning, purchasing equipment, developing school gardens, developing partnerships, and implementing farm to school programs. Wells Fargo Foundation Wells Fargo Foundation grants support organizations working to improve communities with low- to moderate-income. In particular, the Foundation strives to improve education, community development, and environmental health, ensure access to health and human services, and to bolster civic engagement. Wild Ones The Wild Ones Seeds for Education grant program supports environmental education with small grants to help you build your schoolyard native plant teaching space. NYC Mayor’s Office of Environmental Remediation NYC Mayor’s Office of Environmental Remediation grants provide $25,000 to community-based organizations for planning the development of vacant or underutilized sites. Contact Mark McIntyre at (212) 788-3015 or mmcintyre@cityhall.nyc.gov to apply. Here is a list of past projects funded. Programming Opportunities GrowNYC’s Fresh Food Box Bring affordable fruits and vegetables to your community farm or garden! What is the Fresh Food Box program? Fresh Food Box brings fresh produce to neighborhoods all over New York year round and sells it at about half the price of regular grocery stores. Customers pay $12 for 10-15 pounds of fresh, seasonally available produce. Payment must be made one week in advance. Customers can use cash, credit, debit, SNAP/EBT, or Health Bucks. Who runs Fresh Food Box? Fresh Food Box is run by the not-for-profit GrowNYC. GrowNYC partners with community groups who serve as host sites for Fresh Food Box. How can I bring Fresh Food Box to my community garden? Fill out the application. GrowNYC staff will read the application and decide whether they want to partner with your group to create a Fresh Food Box site. They are looking for the following things in a strong candidate: At least 30 people interested in becoming customers An easily accessible outdoor location with good foot traffic Access to two tables that can be used as a part of the outdoor setup Capacity to store a tent (5 ft x 1.5 ft), a box of supplies (2 ft x 2 ft), and paper bags (2 ft x 2 ft) on site Other health and wellness programming happening on site A person or people who can commit 2-4 hours a week during the season to participate in outreach and other Fresh Food Box activities Past Opportunities These grants were not available as of the last time this list was updated. However it is worth checking if these organizations have any current opportunities relevant to your project: Aetna Foundation The Aetna Foundation Local Roots program supports the creation and expansion of community gardens, urban farms, and farmers’ markets in underserved, low-income, and minority communities. To be eligible, all projects must include nutrition education or cooking classes focused on the health benefits of fresh produce; the growing or distribution of produce that reflects the food traditions of the target area; opportunities to learn job skills or entrepreneurship within the context of community gardens, urban farms, or farmers’ markets; and/or opportunities for community service or volunteer work. In 2015, grants of up to $50,000 will be awarded! To be eligible, applicants must be a non-profit organization with evidence of 501(c)(3) designation. Brooklyn Community Foundation The Brooklyn Community Foundation Micro Grants program accepts requests for $500 or less to help support smaller scale projects and organizations throughout Brooklyn. Our Micro Grants serve two purposes: to support grassroots, community efforts like beautification campaigns, Parent-Teacher Associations, youth sports teams, or community gardens and to serve as seed funding for start-up nonprofit groups to help support immediate needs as they build a rapport within the community members and among other funders. Applications are accepted on a rolling basis. Department of Environmental Conservation The New York State DEC’s Office of Environmental Justice offered two types of grants in 2013. DEC’s Community Impact Grants award $10,000 to $50,000 to fund projects that address exposure of the communities served by the applicant organizations to multiple environmental harms and risks. DEC also offers Green Gems Grants which award $2,500 to $10,000 for smaller scale projects that involve education, stewardship, or monitoring activities related to parks, open space, community gardens or green infrastructure. The projects must include a research and educational component that will be used to expand the knowledge or understanding of the affected community. The Fund for Public Health in New York Community organizations in Harlem, Canarsie and Brownsville have been invited to partner in starting new farms on NYCHA campuses! Organizations will get paid up to $50,000 per year for supporting the development of these new p"
