full_description = "Activating Vacant Spaces Living Lots NYC is a clearinghouse of information that New Yorkers can use to find, unlock and protect our shared resources. 596 Acres started with vacant lots and remains committed to helping fill these holes. Go to Living Lots NYC Reviewing Accountability Urban Reviewer catalogs over 150 urban renewal plans that NYC adopted to get federal funding for acquiring land, relocating the people living there, demolishing the structures and making way for new public and private development. Go to Urban Reviewer Gaining Access to Public Buildings NYCommons helps New Yorkers impact decisions about public land and buildings in their neighborhoods. It is a collaboration between Common Cause/NY, the Community Development Project at the Urban Justice Center, and 596 Acres. Go to NYCommons"
