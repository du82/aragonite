["http://596acres.org/protect-places-w-us"]
title = "Join the #protectourplaces coalition: keeping NYC’s community property for community – 596 Acres"
full_description = "Not-for-profit corporations hold property in service of their missions: they own buildings that house day cares and mosques, arts organizations and churches, food pantries and theaters; they own land for community gardens, playgrounds and farms. State Law is clear that they are all entitled to property tax exemptions from the date they purchase the property. New York City’s taxation system puts community property at risk: when such organizations do not apply for and annually renew the tax exemptions they are entitled to get from the City under New York State law, the City sells the accumulated debt to private entities for collection and potential foreclosure. The Protect Our Places coalition is working together to: Pass a law to change it; Keep community properties out of the 2018 sale; and Protect places included in past sales from foreclosure by speculators! Please click the links above to join any of these calls to action! Join the Protect Our Places Coalition! Nonprofits, advocacy orgs, coops, small businesses, community garden groups, block associations, individuals and more are invited. Start the conversation here. Please write “join pop!” in the message section: Name (required) Email (required) Phone Reason OtherTell us about the lot in your lifeRequest a community land access workshopInvite us to your eventPress inquiryI'm in a city that's not New York Select location belowBronxBrooklynManhattanQueensStaten IslandOutside NYC Message"
