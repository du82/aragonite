["http://596acres.org/events/596-acres-general-meeting-brain-trust-soil-science-safety-plus-a-new-nyc-parks-garden"]
title = "596 Acres General Meeting: Brain Trust, Soil Science & Safety, plus a new NYC Parks Garden! – 596 Acres"
description = """
Saturday, June 18 from 2:30 p.m. to 4 p.m.
At Hooper Street and South 5th Street, Williamsburg, Brooklyn

Whether you’re a community land steward, stuck in the middle of a land access campaign or just curious about how to get started, come to 596 Acres’ General Meeting to get the scoop!
Come early, at 2pm, to meet the folks from Hooper Street Park, help care for street trees and make a banner! The lot on the corner of Hooper and South 5th was planned as Open Space through Urban Renewal in a plan adopted by City Council in 1992. After a years-long, relentless campaign which 596 Acres reinvigorated in 2012 and facilitated for four years, the lot was transferred to the jurisdiction of the NYC Parks Department! Last Sunday, neighbors had their first official garden planning meeting. You can see the campaign history here: http://livinglotsnyc.org/lot/3024500028/
2:30-3:15pm: Know Your Urban Soils: a soil science and safety teach-in! Learn about nutrients and metals in your soil-y places, and what you can do to protect yourself and your community while creating wonderful growing spaces.
3:15-4pm: 596 Acres Brain Trust! Share your land access campaign struggles and successes, and get your fellow advocates’ advice! We will help you plot your next steps to gain access to city land for your community projects. Together we can troubleshoot any sticky points in the process."""
full_description = "This Event has passed. Saturday, June 18 from 2:30 p.m. to 4 p.m. At Hooper Street and South 5th Street, Williamsburg, Brooklyn Whether you’re a community land steward, stuck in the middle of a land access campaign or just curious about how to get started, come to 596 Acres’ General Meeting to get the scoop! Come early, at 2pm, to meet the folks from Hooper Street Park, help care for street trees and make a banner! The lot on the corner of Hooper and South 5th was planned as Open Space through Urban Renewal in a plan adopted by City Council in 1992. After a years-long, relentless campaign which 596 Acres reinvigorated in 2012 and facilitated for four years, the lot was transferred to the jurisdiction of the NYC Parks Department! Last Sunday, neighbors had their first official garden planning meeting. You can see the campaign history here: http://livinglotsnyc.org/lot/3024500028/ 2:30-3:15pm: Know Your Urban Soils: a soil science and safety teach-in! Learn about nutrients and metals in your soil-y places, and what you can do to protect yourself and your community while creating wonderful growing spaces. 3:15-4pm: 596 Acres Brain Trust! Share your land access campaign struggles and successes, and get your fellow advocates’ advice! We will help you plot your next steps to gain access to city land for your community projects. Together we can troubleshoot any sticky points in the process. + Google Calendar+ iCal Export Details Date: June 18, 2016 Time: 2:30 pm - 4:00 pm Organizer 596 Acres Phone: (718) 316-6092 Email: organizers@596acres.org Website: 596acres.org Venue Hooper Street Park Hooper Street and South 5th Street Brooklyn, NY 11211 United States + Google Map"
