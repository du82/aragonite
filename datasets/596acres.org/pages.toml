full_description = "Radical Transparency August 13, 2018 / Comments Off on Radical Transparency / Paula Z. Segal At the beginning of June 2018, 596 Acres sent an email update about dialing back staff. We are at a pivotal moment and want to share some lessons learned and celebratory moments, and also acknowledge some points of tension [...] June 2018 Update June 17, 2018 / Comments Off on June 2018 Update / Paula Z. Segal As of June 1, 2018, 596 Acres is without a staff. 596acres.org, onedollarlots.org, nycommons.org and livinglotsnyc.org will continue to exist as digital resources for communities to access the information and tools we developed over the years and to organize [...] Researcher for NYCommons.org June 15, 2017 / Comments Off on Researcher for NYCommons.org / Paula Z. Segal This Summer, join the 596 Acres team to add key details to a new tool for NYC community land access. Created in collaboration with Common Cause/NY and the Community Development Project at the Urban Justice Center, NYCommons.org will bring [...] 596 ACRES’ 2017 GALA: A GOLDEN GARDEN GLOVE AFFAIR April 5, 2017 / Comments Off on 596 ACRES’ 2017 GALA: A GOLDEN GARDEN GLOVE AFFAIR / Paula Z. Segal Join us for a glimmering evening in celebration of community strength, stewardship and resilience. Party basics… June 1, 2017 7pm to 10 pm @ Genius in Gowanus: 84 4th Street, BROOKLYN between Hoyt and Bond Honoring these incredible community land stewards: [...] 2016 Annual Report! January 20, 2017 / Comments Off on 2016 Annual Report! / Paula Z. Segal To download the PDF, click here. Or read it like a book below! Click the second button down on the left to make it full screen: Welcome Alicia December 21, 2016 / Comments Off on Welcome Alicia / Paula Z. Segal As we close out 2016, 596 Acres is really excited to welcome our new New York City Community Land Access Program Organizer, Alicia Rodgers. In her own words… I am excited to join 596 Acres after completing my Master [...] Small Gifts, Seismic Shifts November 28, 2016 / Comments Off on Small Gifts, Seismic Shifts / Paula Z. Segal We need our community spaces now more than ever. Resilience relies on the strength of our communities. We need places to build those strengths. Nothing takes place without a place. By giving to 596 Acres by the calendar end, you allow [...]"
