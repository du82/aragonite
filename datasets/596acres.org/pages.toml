ns helps New Yorkers impact decisions about public land and buildings in their neighborhoods. It is a collaboration between Common Cause/NY, the Community Development Project at the Urban Justice Center, and 596 Acres. One Dollar Lots One Dollar Lots documents each time NYC sells or plans to sell a vacant lot to developers for $1. This tool can help New Yorkers better shape how dollar sales of public land impact our neighborhoods and city. Urban Reviewer Urban Reviewer catalogs over 150 urban renewal plans that NYC adopted to get federal funding for acquiring land, relocating the people living there, demolishing the structures and making way for new public and private development. Latest News 13 Aug Radical Transparency Paula Z. Segal | Aug 13, 2018 | Comments Off on Radical Transparency 17 Jun June 2018 Update Paula Z. Segal | Jun 17, 2018 | Comments Off on June 2018 Update 18 Apr Join us for Earth Day Weekend! 596 Acres | Apr 18, 2018 | Comments Off on Join us for Earth Day Weekend! Events 02 Oct Mapping Matters Gala at Galapagos in DUMBO 16 Main Street Brooklyn, NY 11201 United States October 2, 2014 @ 7:00 pm - 11:00 pm $50 Thursday, October 2 from 7 p.m. to 11 p.m. At 16 Main Street, DUMBO, Brooklyn Have you ever enjoyed the transformational quality of creating a new space together with your neighbors? 596 Acres has facilitated the transformation of 28 vacant lots into something better, ten in 2014 alone. Help us continue to cultivate green spaces from vacant land by […] 12 Mar This Land Is Our Land: Keeping NYC’s Vibrant Growing Spaces at the Just Food Conference 525 West 120th Street New York, NY 10027 United States March 12, 2017 @ 12:55 pm - 2:40 pm $55 Community land stewards from across the boroughs will present their land access struggles and successes. You will learn about farms and gardens that *need our help now* and those that have been ~recently permanently preserved~ via land trusts or conveyance to the NYC Parks Department from their stewards. This session is organized and facilitated by 596 […] 18 Jun 596 Acres General Meeting: Brain Trust, Soil Science & Safety, plus a new NYC Parks Garden! Hooper Street and South 5th Street Brooklyn, NY 11211 United States June 18, 2016 @ 2:30 pm - 4:00 pm FREE Saturday, June 18 from 2:30 p.m. to 4 p.m. At Hooper Street and South 5th Street, Williamsburg, Brooklyn Whether you’re a community land steward, stuck in the middle of a land access campaign or just curious about how to get started, come to 596 Acres’ General Meeting to get the scoop! Come early, at 2pm, […] Our Collaborators'''
