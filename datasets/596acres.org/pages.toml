full_description = "Annual Reports 2017 Impact Report (design by Alexander McSwain) & Poster (design and illustration by Yehuda Blum) 2016 Annual Report (design by Alexander McSwain) 2015 Annual Report (design by Josh Bisker) 2014 Annual Report (2014, design by Partner & Partners) 2011-2012 Recap (design by Julia Samuels) Guides A New York City Advocate’s Guide to Community Land Access Community Governance Cards by 596 Acres to help facilitate the development of healthy group dynamics and habits (July 2015, design by Rachel Albetski). We created an edition of 400 of these, printed by Radix Media and bound with ring. Click the link to see the PDF and feel free to make your own edition, or purchase them in our Store. Reviewing Renewal 1949-2015 (January 2015, Partner & Partners), a comprehensive atlas of every Urban Renewal Plan Area in New York City, created as part of 596 Acres’ Reviewing Renewal residency at the Queens Museum. See the archive of the 5-week intervention on the Queens Museum panorama at Urban Reviewer. A New York City Advocate’s Guide to Community Land Access (April 2014, design by MANY). 596 Acres Curriculum, a land access advocacy education tool (June 2013). HAS ENCONTRADO UN LOTE VACANTE… (September 2012, design by Jessica Finley). You’ve Found the Lot in Your Life — NOW WHAT? (April 2012, illustration by Hannah Learner). Signs This Land Is Your Land sign in the wild THIS LAND IS YOUR LAND (2014, metal sign, design by Partner & Partners). THIS IS AN ACTIVE URBAN RENEWAL AREA (2014, metal sign, design by Partner & Partners). THIS LAND IS YOUR LAND (July 2013, metal sign, design by Partner & Partners). New York City Posters & Provocations: There is land if you want it Volunteers put up 596 Acres signs and posters on a fence BRONX There is land if you want it (April 2013, design by Laura Alvarez). BRONX, HAY TIERRA SI LA QUIERES (April 2013, design by Laura Alvarez). QUEENS There’s Land If You Want It (August 2012, design by Tres Romer & Julia Samuels). This is Rockaway, Queens. There’s Land If You Want It (June 2012, design by Tres Romer & Julia Samuels). There’s Land If You Want It (Manhattan) (June 2012, design by Mauro Carichini). There’s Land If You Want It (Brooklyn) (April 2012, design by Julia Samuels). There are 596 acres of vacant public land in Brooklyn (originally produced for the New Ideas for the New City Festival, May 2011, design by Julia Samuels). New York City Neighborhood Maps Map of projects and opportunities on vacant lots in Queens Community District 14 What Do We Do With Our Land: an annotated map of land stewardship on the Lower East Side (originally created for the New Museum Ideas City Festival, May 2015, with Deborah Berke Partners and GRT Architects; listen to related audio on our blog). Maps of NYC community planning districts with the greatest concentrations of vacant public land (maps by Joseph LaGrand): Bronx Community District 1: 2015 map, 2014 map Bronx Community District 3: 2015 map, 2014 map Bronx Community District 4: 2015 map Bronx Community District 12: 2015 map Brooklyn Community District 5: 2015 map, 2014 map Brooklyn Community District 16: 2015 map, 2014 map Brooklyn Community District 8: 2014 map Queens Community District 14: 2015 map, 2014 map South Williamsburg Organizing Map (originally produced for the NYCCGC Unconference, June 2012, design by Julia Samuels). East Bed-Stuy Organizing Map (originally produced for the 462 Halsey Opening and Earth Day Celebration, April 22, 2012, design by Julia Samuels). Related Publications Free Gardens: A Practical Guide to Grow Food in Irregular Spaces Free Gardens: A Practical Guide to Grow Food in Irregular Spaces (you’ll see us in the credits if you look really, really closely), inspired by 596 Acres’ own A New York City Advocate’s Guide to Community Land Access. In February 2016, São Paulo’s Lanchonete.org launched this print publication at the Centro Cultural da Ocupação São João. A special issue of the journal Cities and the Environment, “Urban Vacant Land and Community Access,” based on the Vacant Acres Symposium that 596 Acres co-organized at the New School in 2014, was published in October 2015! It’s awesome to have an issue dedicated to academics studying community access to land in our cities and practitioners from our Land Access Advocacy Network! Check out the issue to read about parallel efforts in Berlin, Philadelphia, Chicago, Montreal and more! Handmade in the 596 Acres Store I’m So Lucky You Found Me: public land inside the city We produce silkscreened posters and handmade books contemplating and celebrating community land access in New York City and around the world. Check them out in our Store!"
