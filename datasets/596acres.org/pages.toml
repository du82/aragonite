title = "Help protect community places from illegal foreclosure – 596 Acres"
full_description = "October 17, 2017 / 596 Acres / The NYC Department of Finance sells tax debt owed to the city to private speculative debt collectors each year through the tax lien sale. It routinely includes active nonprofits, even though they are exempt from paying taxes as per New York State law. Our successful campaign in 2017 brought together grassroots and elected advocates to protect 360 key community properties from the annual sale and to champion new legislation that will stop this problem in future years! Now we are turning to the properties put at risk by prior years’ sales. We could use your help contacting the people who run these places: 2011-2016 Kips Bay Community Association, Inc. Metro Comm Meth Church Mt Pleasant Christian Church of the Master, Inc. The Minority Task Force on Aids, Inc. St Peter’s Lutheran Church MHHC Corp. The True Witness Shiloh Apostolic Church MMC Corporation Church of God of Crotona Avenue, Inc. Baitul Aman Islamic Center Inc. Jerusalem Christian Church Inc Congregation OHR Menachem Morning Star Highway Church of Christ Congregation & Yeshiva Ateres Shmiel Dsaylish St Grace Prot Chapl I Wyckoff Heights Medic Borough Development Group Linroc Nursing Homein Paul J Cooper Center for Human Services Inc. Fernande Valme Ministries Toldos Yakov Yosef, Inc. Congregation Tehilos Yeshiva Gedolah Tefereth Shmuel Mor Markowitz (clergy) Jesus is Lord Church of SDA Sephardic Center of Mi Congregation Vayechiyos Pentecostal Faith CHU Bushwick Helping Hand/ Randolph Ferdinand Ministries Beth Shalom Inc Congregation Nachlei Emunah Congregation V’yoel M Overcoming Love Ministries Inc. Bushwick Helping Hand/ Randolph Ferdinand Ministries Bangladesh Society In Bethel International EMMANUEL FULL GOSPEL ASSEMBLIES, INC. THE AFRIKAN POETRY THEATRE, INC. Angeldocs, Inc. Rugged Cross Ch./Pray Mt. Pleasant Pentecost CONG. U.T.A. OF BAYSWATER, INC Haven Ministries New Greater Bethel Interdenominational Church, Inc. Yeshiva and Masivta Tiferes Torah 2017 manhattan: ADVENT SABBATH CHURCH AUDUBON PARTNERSHIPFOR ECONOMIC DEV NEIGHBORHOOD PARTNERSHIP HDFC RUSSIAN HOLY FATHERS’CHURCH SFDS DEVELOPMENT CORP – lottcdc.org/ bronx: BRONX GOSPEL CHRISTIAN MISSIONARYASS LIFE WORSHIP CENTER CHURCH OF GOD O MOUNT EDEN RESCUE MISSION -GENA HUD MT CARMEL BAPTIST CHURCH MT CARMEL BAPTIST CHURCH MT HOPE MISSIONARY BAPTIST CHURCH NEIGHBORHOOD YOUTH & FAMILY SERVICE NEIGHBORHOOD YOUTH & FAMILY SERVICE NEIGHBORHOOD YOUTH &FAMILY SERVICES ORGDEN CHRISTIAN HOME PILGRIM UNITED CHURCH brooklyn: AGAPE HOUSE OF PRAYER AND PRAISE, I CONGREGATION YISROELSUVA EMMANUEL PENTACOSTALTEM EVANGEL TEMPLE INC FORT GREENE CH OF GOD GRACE CHRISTIAN CHURCH GRACE CHRISTIAN CHURCH GRACE PROT EPIS CH HARVEST TIME ZION CHURCH OF OUR GOD HOLY HOUSE OF PRAYERCHURCH INC HOLY TRINITY SEED MINISTRY INC THE CASSIDIC DISCOVE THE WILLIAMSBURG CHRISTIAN CHURCH UNITED LUBAVITCHER YESHIVOTH YESHIVA KAVUNAS HALEV queens: FORBES TEMPLE INC LIGHTHOUSE DELVCE CH/CHS LIGHTHOUSE DELVCE CH/CHS MORRIS BROWN AFRICAN METHODIST EPIS RED APPLE CHILD DEVELOPMENT CENTER ROCKAWAY BOULEVARD LOCAL DEVELOPMEN ROCKAWAY BOULEVARD LOCAL DEVELOPMEN UNITED NATIONS CHURCH INTERNATIONAL OF VA,INC. These groups may not know that they have a lien. They may need help reaching the NYC Department of Finance Taxpayer Advocate so they can get that lien defected. They may need help finding a lawyer to defend a foreclosure proceeding. Here’s what you can do: This spreadsheet lists all places at risk of foreclosure. It includes the date that liens were sold, and how much debt they were for. When you contact people, you can say: The city illegally charged you taxes between 2011 and 2016, even though you are a nonprofit. They sold the debt on those illegally-charged taxes to Wall Street investors sometime between 2011 and 2016. Those collectors can initiate foreclosure on your place. Let’s stop that from happening! To stop it, contact David Crotty at the Taxpayer Advocate’s office immediately: CrottyD@finance.nyc.gov, (212) 312-6588. Tell him that you are a nonprofit and that the lien against your property that was sold between 2011 and 2017 needs to be defected. Contact Mara at 596 Acres for any further assistance: mara@596acres.org, (718) 316-6092 X3. Keep us posted so we can be coordinate on outreach by emailing organizers@596acres.org. Thank you for helping protect our places! Tags: protecting our places, tax lien sale Share this Post! About the Author : 596 Acres Related posts June 2018 Update As of June 1, 2018, 596 Acres is without a staff. 596acres.org, onedollarlots.org, nycommons.org and livinglotsnyc.org will continue to ... Join us for Earth Day Weekend! JOIN US THIS WEEKEND FOR EARTH DAY CELEBRATIONS Day Party on Saturday: We’re partnering with Ode to Babel (772 Dean St at Washington ... One Dollar Lot Sale Alert: upcoming public hearings Attention NYC Residents: The City of New York has scheduled three public hearings regarding 9 lots of land the ..."
