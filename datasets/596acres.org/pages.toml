ns helps New Yorkers impact decisions about public land and buildings in their neighborhoods. It is a collaboration between Common Cause/NY, the Community Development Project at the Urban Justice Center, and 596 Acres. One Dollar Lots One Dollar Lots documents each time NYC sells or plans to sell a vacant lot to developers for $1. This tool can help New Yorkers better shape how dollar sales of public land impact our neighborhoods and city. Urban Reviewer Urban Reviewer catalogs over 150 urban renewal plans that NYC adopted to get federal funding for acquiring land, relocating the people living there, demolishing the structures and making way for new public and private development. Latest News 13 Aug Radical Transparency Paula Z. Segal | Aug 13, 2018 | Comments Off on Radical Transparency 17 Jun June 2018 Update Paula Z. Segal | Jun 17, 2018 | Comments Off on June 2018 Update 18 Apr Join us for Earth Day Weekend! 596 Acres | Apr 18, 2018 | Comments Off on Join us for Earth Day Weekend! Events 22 Apr Vacant Acres Symposium: Advocates From All Over the World! New York, NY 10011 United States April 22, 2014 @ 1:30 pm - April 23, 2014 @ 7:00 pm FREE The Tishman Environment and Design Center at the New School is teaming up with 596 Acres and practitioners from around the world for a 2-day symposium about transforming vacant land into community resources. Neat! APRIL 22, 2014: THE NEW YORK EXPERIENCE 66 West 12th Street, Room 510 1:30 pm – 1:45 pm Coffee and Registration […] 16 Sep 596 Acres’ Community Land Access Booth at GreenThumb’s Harvest Fair! 590 Pacific Street at Flatbush Avenue Brooklyn, NY 11217 United States September 16, 2017 @ 12:00 pm - 4:00 pm FREE Visit 596 Acres’ table at GreenThumb’s Harvest Fair! Here’s what we have in store: Find out about the vacant lots in your life and how to transform them into the vibrant community places you want and need, like GreenThumb gardens! Plug into local campaigns to transform vacant lots into growing places, and find out