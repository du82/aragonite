full_description = "Refactoring English AuthorSample ChaptersRefactoring EnglishEffective Writing for Software Developersby Michael LynchMany software developers think they’re naturally poor writers, but there’s no such thing.Most software developers are weak writers because they don’t try.You can improve your writing skills the same way you learned to become a better programmer: by learning best practices and understanding how to apply them.Refactoring English will improve your writing in areas that matter most to developers, including:EmailsSoftware documentationBlog postsTutorialsI’m writing the book now, and it will be available as a digital download in 2025. Sign up below to receive updates and excerpts as soon as they’re available.Send me updates on Refactoring EnglishReceive updates and sample chapters as I write the book.Unsubscribe anytime. Book ContentsRefactoring English teaches everything I've learned over the years about applying effective writing techniques to the domain of software.Grab the Reader's Attention ImmediatelyWhy Improve Your Writing?Write Better EmailsWrite Better Design DocumentsWrite Better Blog PostsWrite Better TutorialsGood Writing Minimizes Strain for the ReaderVerbs Drive the SentenceStay Positive: How Negative Phrasing Reduces ReadabilityPassive Voice Considered TerribleBrevity Is Performance Optimization for Your WritingWhy So Serious? Make Your Writing Sound NaturalExpand Your AudienceAccommodate SkimmersThe Writing ProcessEditing is Valuable Because it's HardManage Writer's BlockCommon Writing Pitfalls for DevelopersImprove Your Grammar IncrementallyWork with a Professional EditorWork with a Professional IllustratorBuild a Personal Writing ToolsetContinuous Improvement: Long-Term Strategies for Your WritingContactDo you have questions about the book? Want to tell me about things you’re hoping to learn?Get in touch! I’d love to hear from you."
