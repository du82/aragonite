full_description = "Refactoring English AuthorSample ChaptersAuthorI’m Michael Lynch, the author of this book. I’m a software engineer who spent most of my career at Microsoft and Google. In 2018, I left to create my own businesses. I’ve been blogging about software and entrepreneurship at mtlynch.io since 2016.I’ve always been passionate about clear writing. Too many developers overestimate the difficulty of clear writing and underestimate its benefits. Refactoring English is my attempt to show developers how drastically they can improve their writing with simple guidelines and techniques.In 2021, I created my first course, Hit the Front Page of Hacker News, which explains the methods that have made my writing successful on tech-oriented sites like Hacker News and reddit. The course currently has a 5-star rating on Gumroad."
