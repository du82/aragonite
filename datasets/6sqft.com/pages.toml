title = "222 affordable apartments available in the Bronx, from $454/month"
description = "A lottery opened for 222 affordable apartments in the Bronx. Qualifying New Yorkers can apply for the units, starting at $454/month for studios."
full_description = '''222 affordable apartments available in the South Bronx, from $454/month By Aaron Ginsburg February 7, 2025 Rendering courtesy of the NYC Department of Housing Preservation and Development A housing lottery has launched for 222 affordable apartments at a new residential complex in the South Bronx. Located at 1001 Whitlock Avenue in Longwood, the 14-story building marks the first phase of Whitlock Point, an all-affordable development that will bring over 500 apartments to the neighborhood. New Yorkers earning 30, 50, 60, and 80 percent of the area median income can apply for the units, priced from $454/month for studios to $2,949/month for three bedrooms. Developed by Stagg Group and designed by Newman Design Architects, amenities include covered parking, bike storage lockers, and a shared laundry room, as well as outdoor spaces and a recreation room. The building also features energy-efficient appliances and a pet-friendly policy. Situated on the site of a former plastics factory, plans for an apartment complex go back to 2017 when it was first purchased by the Adler Group, according to Hunt’s Point Express. Permits were filed for the building by Adler in September 2017, according to Yimby. The project has changed ownership several times, with the Stagg Group purchasing it in 2020. In August 2023, the developers secured a $136.8 million loan for the project, used to fund all construction costs from the ground up, according to BLDUP. The project includes 43 units designated for formerly homeless adults, as well as 8,610 square feet of community space, a community mural, and more. In September, Hunt’s Point Express reported that phase two of the project was indefinitely delayed, with the city’s Department of Housing Preservation and Development (HPD) halting construction until sometime after July 2025 due to budget issues despite an already approved budget. Nearby public transit options include the 2, 5, and 6 subway lines and the Bx4A, Bx5, Bx19, and Bx27 buses. Qualifying New Yorkers can apply for the apartments until April 7, 2025. Complete details on how to apply are available here. Preference for 20 percent of the units will be given to residents of Bronx Community Board 2. Questions regarding this offer must be referred to NYC’s Housing Connect department by dialing 311. RELATED: Waitlist opens for affordable apartments at Bjarke Ingels’ Harlem rental, from $1,056/month Sustainable rental in Greenpoint opens lottery for 251 apartments, from $1,537/month 244 apartments available at luxury Hunter’s Point rental, from $2,490/month Interested in similar content? Email(Required) window.addEventListener('DOMContentLoaded', function() { gform.initializeOnLoaded( function() {gformInitSpinner( 20, 'https://www.6sqft.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_20').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_20');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_20').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confirmation;var mt = parseInt(jQuery('html').css('margin-top'), 10) + parseInt(jQuery('body').css('margin-top'), 10) + 100;if(is_form){jQuery('#gform_wrapper_20').html(form_content.html());if(form_content.hasClass('gform_validation_error')){jQuery('#gform_wrapper_20').addClass('gform_validation_error');} else {jQuery('#gform_wrapper_20').removeClass('gform_validation_error');}setTimeout( function() { /* delay the scroll by 50 milliseconds to fix a bug in chrome */ }, 50 );if(window['gformInitDatepicker']) {gformInitDatepicker();}if(window['gformInitPriceFields']) {gformInitPriceFields();}var current_page = jQuery('#gform_source_page_number_20').val();gformInitSpin