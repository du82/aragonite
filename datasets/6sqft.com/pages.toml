title = "1,600-foot-tall office tower 350 Park Avenue prepares to enter public review"
description = "Located at 350 Park Avenue, the 62-story office tower—developed by Vornado Realty Trust, Rudin, and Citadel—will replace three existing office buildings."
full_description = '''1,600-foot-tall office tower 350 Park Avenue prepares to enter public review By Aaron Ginsburg February 7, 2025 350 Park Avenue © DBOX for Foster + Partners A proposed supertall office tower in Midtown East is set to enter the public review process next month, according to a land use application filed with the city this week. Vornado Realty Trust, Citadel, and Rudin Management are looking to build a 1,600-foot-tall skyscraper at 350 Park Avenue. Set to replace three existing buildings, the fully electric tower will rise 62 stories and deliver 1.8 million square feet of office space and a new public concourse. Designed by Foster + Partners, Ken Griffin’s Citadel and Citadel Securities would be the tower’s anchor tenants, occupying at least 850,000 square feet. Rendering courtesy of Foster + Partners The three buildings set for demolition include a Vornado-owned 30-story office tower at 350 Park Avenue, a Rudin-owned 23-story office building at 40 East 52nd Street, and a five-story office building at 39 East 51st Street. According to the Environmental Assessment Statement filed by Vornado, the proposed project would include over 1.6 million square feet of office, financial trading and tenant amenity space, and nearly 23,000 square feet of retail space, likely a fast food establishment and a larger restaurant. A proposed 12,500-square-foot public plaza will be located along Park Avenue and feature green space, seating, enhanced visibility of nearby landmarks, public art installations, and opportunities for local businesses. It will also improve pedestrian flow across the corridor. Last year, Mayor Eric Adams and the developers released new renderings of the project, showing off its glass facade, landscaped terraces, and unique “stepped configuration.” “350 Park Avenue is a new symbol of the rebirth of this world-famous street, resulting from the city’s Midtown rezoning initiative,” Nigel Dancey, head of studio at Foster + Partners, said in a statement announcing the design. “With its stepped back, gently tapering form, the building follows in the tradition of distinctive towers along Park Avenue, creating a silhouette that is very much ‘of New York.'” Dancey added: “The all-electric tower is designed to meet the needs of the workplace of the future with a variety of flexible floorplates, featuring cascading green terraces and soaring amenity floors that will define a new generation of buildings on Park Avenue.” Construction could begin next spring following the roughly seven-month uniform land use review procedure (ULURP). The process requires numerous public hearings, as well as review from the DCP, Manhattan Borough President Mark Levine, the local community board, the City Council, and the mayor. If approved, the project is expected to be completed by 2032. Plans for the tower first surfaced in May 2019, following the passage of the Midtown East rezoning in 2017. The zoning reform has cleared the way for 6.5 million square feet of new office space on 78 blocks around Ground Central Terminal, allowing for denser development. Citadel and Vornado acquired air rights from St. Patrick’s Cathedral and St. Bartholomew’s Church, allowing for a larger tower than originally proposed under the rezoning deal. Part of the proceeds pay for upgrades to public spaces in the area. The Midtown East rezoning aims to modernize the area’s aging office buildings, many of which lack the floor-to-ceiling heights, larger floor plates, and functionality needed for today’s business operations, according to the developer’s application. Other supertall towers coming to the neighborhood thanks to the rezoning include 175 Park Avenue, a 1,575-foot-tall mixed-use building developed by TF Cornerstone and RXR Realty and designed by Skidmore, Owings & Merrill, and 270 Park Avenue, a 60-story tower built as the headquarters for JPMorgan Chase. Norman Foster’s 47-story tower at 425 Park Avenue was completed in 2022. RELATED: Vornado reveals new renderings for 62-story office tower at 350 Park Avenue JPMorgan’s all-electric supertall at 270 Park Avenue tops out in Midtown East Proposed project from Vornado and Rudin calls for 1,450-foot tower in Midtown East Interested in similar content? Email(Required) window.addEventListener('DOMContentLoaded', function() { gform.initializeOnLoaded( function() {gformInitSpinner( 20, 'https://www.6sqft.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_20').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_20');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_20').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confirmation;var mt = parseInt(jQuery('html').css('margin-top'), 10) + parseInt(jQuery('body').css('margin-top'), 10) + 100;if(is_form){jQuery('#gform_wrapper_20').html(form_content.html());if(form_content.hasClass('gform_validation_error')){jQuery('#gform_wrapper_20').addClass('gform_validation_error');} else {jQuery('#gform_wrapper_20').removeClass('gform_validation_error');}setTimeout( function() { /* delay the scroll by 50 milliseconds to fix a bug in chrome */ }, 50 );if(window['gformInitDatepicker']) {gformInitDatepicker();}if(window['gformInitPriceFields']) {gformInitPriceFields();}var current_page = jQuery('#gform_source_page_number_20').val();gformInitSpinner( 20, 'https://www.6sqft.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery(document).trigger('gform_page_loaded', [20, current_page]);window['gf_submitting_20'] = false;}else if(!is_redirect){var confirmation_content = jQuery(this).contents().find('.GF_AJAX_POSTBACK').html();if(!confirmation_content){confirmation_content = contents;}jQuery('#gform_wrap