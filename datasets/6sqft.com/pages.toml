description = "Effective Date: July 11, 2023 This Cookie Policy explains how 6sqft.com, a service provided by CityRealty.com, LLC (“we,” “us,” “our,” or “6sqft”) uses cookies and similar technologies to recognize you when you visit our website. It explains what these technologies are and why we use them, as well as your rights to control our use"
full_description = "Effective Date: July 11, 2023 This Cookie Policy explains how 6sqft.com, a service provided by CityRealty.com, LLC (“we,” “us,” “our,” or “6sqft”) uses cookies and similar technologies to recognize you when you visit our website. It explains what these technologies are and why we use them, as well as your rights to control our use of them. 1. What are Cookies? Cookies are small data files that are placed on your computer or mobile device when you visit a website. They are used to make websites work, or work in a better, more efficient way. They can do this because websites can read and write these files, enabling them to recognize you and remember important information that will make your use of a website more convenient. 2. How We Use Cookies We use cookies for several reasons: 2.1. Essential Cookies. These cookies are necessary to provide you with services available through our website. 2.2. Performance and Functionality Cookies. These cookies are used to enhance the performance and functionality of our website but are non-essential to their use. However, without these cookies, certain functionality may become unavailable. 2.3. Analytics and Customization Cookies. These cookies collect information that is used to help us understand how our website is being used or how effective our marketing campaigns are, or to help us customize our website for you. 3. How to Control and Delete Cookies You have the right to choose whether or not to accept cookies. However, please note that if you choose to refuse cookies, you may not be able to use the full functionality of our website. You can usually control cookies by changing your web browser’s settings to refuse cookies, disable existing cookies, or let you know when new ones are being sent. The “help” portion of the toolbar on most browsers will tell you how to prevent your browser from accepting new cookies, how to have the browser notify you when you receive a new cookie, or how to disable cookies altogether. 4. Changes to This Cookie Policy We may update this Cookie Policy from time to time to reflect, for example, changes to the cookies we use or for other operational, legal, or regulatory reasons. Please revisit this Cookie Policy regularly to stay informed about our use of cookies and related technologies. 5. Contact Us If you have any questions about our use of cookies, please contact us at [email protected]. By using our website, you accept this Cookie Policy and consent to our use of cookies as outlined in this policy. If you do not agree with this Cookie Policy, you should not use our website."
