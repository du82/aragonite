["https://www.6sqft.com/4-9m-brick-townhouse-offers-rustic-charm-and-outdoor-space-in-the-heart-of-greenpoint"]
title = "$4.9M brick townhouse offers rustic charm and outdoor space in the heart of Greenpoint"
description = "Asking $4,990,000, the two-story brick Neo-Classical townhouse at 115 Milton Street sits within the Greenpoint Historic District."
full_description = '''$4.9M brick townhouse offers rustic charm and outdoor space in the heart of Greenpoint By Devin Gannon February 25, 2025 All photos courtesy of Oleg Davidoff for The Corcoran Group A rare historic Greenpoint townhouse is for sale. Asking $4,990,000, the two-story brick Neo-Classical row house at 115 Milton Street sits within the Greenpoint Historic District, designated by the city in 1982 in recognition of its well-preserved, 19th-century row homes. Reimagined through a top-to-bottom renovation for modern living, the single-family home’s rustic charm remains, highlighted by exposed brick, wood beams, and bay windows. A gated front patio and landscaped backyard with a hot tub add even more to the home’s allure. Milton Street is home to some of the neighborhood’s oldest homes, which showcase nearly all of the architectural styles that were popular during the second half of the 19th century, including Italianate, Neo-Grec, French Second Empire, Queen Anne, and Neo-Classical, according to the LPC designation report. No. 115 was built by Dr. Charles A. Walters in 1894 as an investment property. The L-shaped home has an entrance bay set back from the street, with “the main plane of the facade close to the lot line,” which creates a “transition from the houses to the east.” The home has a full-height, three-sided bay and an ornate roof cornice. The super long property measures 62 feet deep, by 21 feet wide. Through the front patio and steps, the entry opens into the middle of the first floor, in what is currently used as a spacious dining room. To the right is a well-sized chef’s kitchen with chic black wood cabinets juxtaposed with butcher block countertops and brick backsplash. A prep island is big enough to seat six people. High-end appliances include a French-door fridge, a Bosch microwave drawer and dishwasher, a double wine cooler, and a Bosch induction cooktop with an industrial venting hood. Bonus space on this floor includes built-in storage, a walk-in pantry, and a built-in breakfast nook with banquette seating that overlooks the backyard. The spacious backyard is fenced-in and private, with both paved and turf areas for lounging and entertaining. To top it off, there’s a wood-fueled hot tub. At the front of the home is the living room, which faces Milton Street and gets an abundance of sun from the front bay windows and a window by the front door. The window seat, historic details, and floor-to-ceiling shelving make this room extra cozy. The upper level currently has four bedrooms and a laundry room with a new washer and dryer. Right off the street-facing primary suite is a walk-in closet and a bonus office space. Dual exposures brighten the bedroom. There’s one full bath on this floor and a half bath on the first level. Separate entrances at the front and rear of the home lead to the finished basement with a full bath that can be rented out as an Airbnb or used as a guest suite or home gym, as the listing notes. At the back of this floor is extra storage space. While the block’s turn-of-the-century aesthetic has been preserved, the surrounding neighborhood has evolved rapidly in the last decade, with new developments bringing Brooklyn’s latest hot-spot restaurants, shops, bakeries, and bars all in close proximity. The G is barely a block and a half away, with the Greenpoint waterfront, only a bit further. [Listing details: 115 Milton Street at CityRealty] [At The Corcoran Group by Deborah L Rieders and Sarah Shuken] RELATED: Asking $2.75M, this pale pink Greenpoint townhouse has gardens, terraces, history, and charm In historic Sunset Park, this $2M row house is an architectural gem with modern upgrades Behind a stately Village brownstone facade, a massive six-story mansion asks $35M All photos courtesy of Oleg Davidoff for The Corcoran Group window.addEventListener('DOMContentLoaded', function() { jQuery(document).on('gform_post_render', function(){ jQuery("#gform_submit_button_20").val('Sign Up'); 