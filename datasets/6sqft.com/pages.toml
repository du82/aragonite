full_description = "All photos courtesy of Anton Brookes of H5 Property February 28, 2025 William Lescaze’s modernist Upper East Side townhouse is on the market again, for $15M By Devin Gannon One of New York City's first modernist residences is back on the market. The townhouse at 32 East 74th Street was designed by William Lescaze, a Swiss-born American architect credited with pioneering modernism in the United States. Known as the Raymond C. and Mildred Kramer House for the original owners, the Upper East Side property has an iconic white stucco and glass brick facade preserved to comply with landmarks law. Inside, however, several renovations over the years have left little traces of Lescaze's interior design. Now asking $15,000,000, the home, which has been divided into three duplex apartments, has been on and off the market for nearly a decade. details this way Distinctive Homes Photo by Acroterion on Wikimedia February 28, 2025 Intrepid Museum parking lot in Hell’s Kitchen slated for development By Aaron Ginsburg New York is seeking proposals to transform a parking lot in Hell's Kitchen used by the Intrepid Museum into a mixed-use development. Gov. Kathy Hochul on Friday issued a request for proposals for the site at 621 West 45th Street, which measures just over 50,500 square feet on 12th Avenue between West 45th and West 46th Streets. Proposed for one of the largest undeveloped parcels on Manhattan's far West Side, the project presents an opportunity to bring much-needed affordable housing to a state-owned site in the city. READ MORE Affordable Housing The Miriam and Ira D. Wallach Division of Art, Prints and Photographs: Picture Collection, The New York Public Library. (1902). “New York slave market about 1730.” Via New York Public Library Digital Collections. February 28, 2025 NYC launches project to make historical records of enslaved people more accessible By Aaron Ginsburg The historical records of thousands of enslaved New Yorkers will be more easily accessible to the public through a new city project. Mayor Eric Adams on Thursday announced a plan led by the Department of Records and Information Services (DORIS) to transcribe digitized historical records from 1660 to 1827, helping historians and New Yorkers locate records of enslaved people and potentially trace familial roots. The Adams administration is calling on volunteers to help transcribe the records and build the project's searchable database. Find out more Policy"
