title = "$1.95M Turtle Bay co-op feels like a modern cabin in the middle of Manhattan"
description = "With three bedrooms and an open, loft-like living and dining space, this unusual co-op at 301 East 52nd Street resembles both a loft and a cozy woodland cabin. Asking $1,950,000, the home's layout has room for privacy as well as entertaining, enhanced by a wood-burning fireplace, wood beams, built-ins, brick accents, and arched loft windows."
full_description = '''$1.95M Turtle Bay co-op feels like a modern cabin in the middle of Manhattan By Michelle Cohen January 13, 2025 Photo courtesy of Richard Caplan and Douglas Elliman With three bedrooms and an open, loft-like living and dining space, this unusual co-op at 301 East 52nd Street resembles both a loft and a cozy woodland cabin. Asking $1,950,000, the home’s layout has room for privacy as well as entertaining, enhanced by a wood-burning fireplace, wood beams, built-ins, brick accents, and arched loft windows. The heart of the home is a living space that stretches to 34 feet. South-facing windows with dramatic arched frames guarantee plenty of sunlight and views of the surrounding residential block. An open kitchen also offers a washer/dryer. Adjacent is a dining area, served by a built-in bar. The home’s three bedrooms are distributed for maximum convenience and privacy: The smallest of the three is just off the living room (perfect for a home office), and the larger chambers are on the other side of the apartment. The primary suite offers three large closets. The full-service doorman building offers a live-in super and a bike room. Pets are welcome, and pied-a-terres are allowed on a case-by-case basis. [Listing details: 301 East 52nd Street, #3C at CityRealty] [At Douglas Elliman by Sean Jadidian] RELATED: Bob Dylan’s former Turtle Bay home asks $7.25M Katharine Hepburn’s longtime home in Turtle Bay Gardens asks $7.2M Jessica Chastain’s lavish Osborne co-op lists for $7.45M Olivier Sarkozy’s historic Turtle Bay townhouse comes back on the market for $11.5M Photos courtesy of Richard Caplan and Douglas Elliman Interested in similar content? Email(Required) window.addEventListener('DOMContentLoaded', function() { gform.initializeOnLoaded( function() {gformInitSpinner( 20, 'https://www.6sqft.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_20').on('load',function(){var contents = jQuery(this).contents().find('*