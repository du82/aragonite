full_description = "Effective Date: July 11, 2023 At 6sqft.com, a service provided by CityRealty.com, LLC (“we,” “us,” “our,” or “6sqft”), we are committed to ensuring that our website and digital services are accessible to all individuals, including those with disabilities. Our goal is to provide an inclusive experience that allows all users to easily access and understand the information on our site, following the best practices and standards as defined by Section 508 of the U.S. Rehabilitation Act and the Web Content Accessibility Guidelines (WCAG) of the World Wide Web Consortium. Our Commitment. We are dedicated to continually improving our digital accessibility, considering usability for everyone, including those with visual, auditory, motor, or cognitive disabilities. We strive to make our website compatible with assistive technologies and ensure the ability to navigate our site using various methods. Continuous Improvement. As technology and accessibility standards continue to evolve, so do our efforts to improve the user experience for everyone. We view accessibility as an ongoing initiative and are consistently working to apply relevant accessibility practices to our site. Regularly, we review our site to ensure we adhere to best practices in web accessibility. Feedback and Assistance. We welcome your feedback on our website’s accessibility. If you encounter any accessibility barriers or if you have suggestions on how we can improve the accessibility of our site, please contact us at [email protected]. If you are having trouble accessing information or services on our website due to a disability, please reach out to us, and we will make every effort to provide you with the necessary assistance. By working together, we can ensure that 6sqft.com remains a leading, inclusive resource for all individuals. Note: This accessibility statement applies to all content on 6sqft.com. We cannot guarantee the conformance of third-party plug-ins and widgets, or assure the accessibility of content provided by third-party partners and websites that we link to."
