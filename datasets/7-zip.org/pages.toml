["https://7-zip.org/sdk.html"]
title = "LZMA SDK (Software Development Kit)"
full_description = "English Chinese Simpl. Chinese Trad. Esperanto French German Japanese Persian Portuguese Brazil Spanish Thai Vietnamese The LZMA SDK provides the documentation, samples, header files, libraries, and tools you need to develop applications that use LZMA compression. LZMA / LZMA2 are default and general compression methods of 7z format in the 7-Zip program. LZMA provides a high compression ratio and fast decompression, so it is very suitable for embedded applications. For example, it can be used for ROM (firmware) compressing. The LZMA decoder uses only CPU integer instructions and can be implemented for any modern 32-bit CPU. Anyone is free to copy, modify, publish, use, compile, sell, or distribute the original LZMA SDK code, either in source code form or as a compiled binary, for any purpose, commercial or non-commercial, and by any means."
