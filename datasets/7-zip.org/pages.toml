["https://7-zip.org/faq.html"]
title = "Frequently Asked Questions (FAQ)"
full_description = '''English Chinese Simpl. Chinese Trad. Esperanto French German Japanese Persian Portuguese Brazil Spanish Thai Vietnamese Yes, 7-Zip is free software. You can use it on any computer. You don't need to register or pay for 7-Zip. You must run 7-Zip File Manager in administrator mode. Right-click the icon of 7-Zip File Manager, and then click Run as administrator. Then you can change file associations and some other options. New versions of 7-Zip (starting from version 15.06) use another file sorting order by default for solid 7z archives. You can get big difference in compression ratio for different sorting methods, if dictionary size is smaller than total size of files. If there are similar files in different folders, the sorting "by type" can provide better compression ratio in some cases. Note that sorting "by type" has some drawbacks. For example, NTFS volumes use sorting order "by name", so if an archive uses another sorting, then the speed of some operations for files with unusual order can fall on HDD devices (HDDs have low speed for "seek" operations). If you think that unusual file order is not problem for you, and if better compression ratio with small dictionary is more important for you, use 'qs' mode. In 99% of these cases it means that the archive contains incorrect headers. Other ZIP programs can open some archives with incorrect headers, since these programs just ignore errors. If you have such archive, please don't call the 7-Zip developers about it. Instead try to find the program that was used to create the archive and inform the developers of that program that their software is not ZIP-compatible. There are also some ZIP archives that were encoded with methods unsupported by 7-Zip, for example, WAVPack (WinZip). 7-Zip 9.20 supports RAR 2/3/4 formats only and doesn't support RAR5 archives. But latest versions of 7-Zip supports RAR5 archives. 7-Zip doesn't know folder path of drop target. Only Windows Explorer knows exact drop target. And Windows Explorer needs files (drag source) as decompressed files on disk. So 7-Zip extracts files from archive to temp folder and then 7-Zip notifies Windows Explorer about paths of these temp files. Then Windows Explorer copies these files to drop target folder.'''
