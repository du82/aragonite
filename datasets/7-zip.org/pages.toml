title = "7z Format"
full_description = "English Chinese Simpl. Chinese Trad. Esperanto French German Japanese Persian Portuguese Brazil Spanish Thai Vietnamese 7z has open architecture, so it can support any new compression methods. Now the following compression methods are integrated to 7z: 7z also supports filters that improve compression ratio of main compression method. Now the following filters are integrated to 7z: 7-Zip also supports encryption with AES-256 algorithm. This algorithm uses cipher key with length of 256 bits. To create that key 7-Zip uses derivation function based on SHA-256 hash algorithm. A key derivation function produces a derived key from text password defined by user. For increasing the cost of exhaustive search for passwords 7-Zip uses big number of iterations to produce cipher key from text password. 7z code is a part of 7-Zip program distributed under the GNU LGPL. You can download 7-Zip sources and binaries from Download Page."
