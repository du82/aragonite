title = "Links"
full_description = "English Chinese Simpl. Chinese Trad. Esperanto French German Japanese Persian Portuguese Brazil Spanish Thai Vietnamese p7zip is an old port of 7-Zip (command line version only) for Linux and Unix, created by an independent developer. Now p7zip is no longer needed as the new version of 7-Zip can run on Linux. So you can use new 7-Zip for Linux instead of p7zip. Please note that the source code of p7zip was not updated since version 16.02. And this p7zip 16.02 contains bugs, that were fixed in newer versions of 7-Zip. If you have your own web site and want to support the 7-Zip project, you can display the 7-Zip link button on your web pages. Use this HTML code: 7-max is a program that increases the performance of some applications by up to 10-20%. 7-max can speed up applications that use big amount of memory and that are affected by RAM latency. In our tests, 7-max gives 10-20% speed improvements on modern file compression programs like 7-Zip. Windows uses small (4 KB) RAM pages by default. If you run any application with 7-max, that application will use large (2 MB) RAM pages. And some programs work faster, if they use large RAM pages instead of small pages."
