["https://9front.org/releases"]
title = "releases"
full_description = "Multiple installation media are provided for PC, Raspberry Pi, MNT Reform, and QEMU. For PC, burn an .iso file to CD, or dd it directly to USB media. For Raspberry Pi or MNT Reform, dd an .img file directly to sdcard. The pi.img file can be used for Raspberry Pi 1, 2, and 3. The pi3.img file can be used for Raspberry Pi 3 and 4. nusb/usbd: impelement warm-reset for usb3 ports, attempt port reset on failed hubs, enable port-power for rootports We are now able to handle more USB audio, even ones that do not offer standard 44.1kHz sample rate. (Sigrid!) Multiple installation media are provided for PC, Raspberry Pi, MNT Reform, and QEMU. For PC, burn an .iso file to CD, or dd it directly to USB media. For Raspberry Pi or MNT Reform, dd an .img file directly to sdcard. The pi.img file can be used for Raspberry Pi 1, 2, and 3. The pi3.img file can be used for Raspberry Pi 3 and 4. New /sys/src/9/arm64 directory with generic arm64 implementations that is shared with all the arm64 kernels (imx8, bcm64). Multiple installation media are provided for PC, Raspberry Pi, MNT Reform, and QEMU. For PC, burn an .iso file to CD, or dd it directly to USB media. For Raspberry Pi or MNT Reform, dd an .img file directly to sdcard. The pi.img file can be used for Raspberry Pi 1, 2, and 3. The pi3.img file can be used for Raspberry Pi 3 and 4. devip: have findipifc() return rlock’d interface, allow to use “del” instead of “remove” for route and interface operations audio/flacenc: implement [-i fmt] for supported formats; fix tell callback; fix big endian and 3-byte samples vt: resize only when the window is not hidden (fixes window at top left corner with riow after terminal reset) /lib/troll: We have created something new that we named R9, an OS strongly inspired by Plan 9, written in the Rust programming language. Multiple installation media are provided for PC, Raspberry Pi, and MNT Reform. For PC, burn an .iso file to CD, or dd it directly to USB media. For Raspberry Pi or MNT Reform, dd an .img file directly to sdcard."
