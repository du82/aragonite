full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); iOS watchOS iPadOS macOS Apple Watch Ultra watchOS 10 shows how Dark Mode on iPhone and Mac should work Zac Hall | Jun 19 2023 - 6:56 am PT 5 Comments Dark Mode on iPhone, iPad, and Mac is fairly flexible. You can toggle it on or off from Control Center or Settings, automatically switch based on time of day, or use local sunrise and sunset time to switch. There’s one method for invoking dark mode that’s still missing, however, and watchOS 10 on the Apple Watch Ultra shows how it could work. Launched in September 2022, Apple Watch Ultra includes an exclusive extreme sports face called Wayfinder. Tapping the dial of the Wayfinder clock transforms the hours and minutes into degrees on a compass, and the bezel can optionally show longitude/latitude or elevation/incline. Wayfinder is also the only watch face to include the “Night Mode” option to turn the watch face red and black for easier viewing in dark environments. This allows you to read data on the Wayfinder watch face while still being able to see the night sky without having to adjust to the darkness. watchOS 10 introduces a new widget system Apple called Smart Stack. You can set your favorite widgets, pin specific ones, and view contextually relevant widgets like ongoing timers. Invoking the Smart Stack is done by swiping up from the bottom of any watch face (except Siri). In watchOS 9, this gesture invokes Control Center. Now the side button has been reassigned to open that panel. Another method for opening the Smart Stack view is spinning the Digital Crown upward. In watchOS 9, rotating the crown is how you toggle Night Mode on and off on the Wayfinder watch face. The Smart Stack comes to Apple Watch Ultra, of course, so Apple resolved this conflict by moving Night Mode to the watch face customizer. While this new method is nowhere near as convenient for simply turning Night Mode on or off, watchOS 10 does introduce Auto Night Mode. Auto Night Mode works exactly like how I’d like Dark Mode to work – at least as an option. Mode switching occurs based not on time of day or sunset/sunrise, but instead on ambient light sensing. In a dark environment? Night Mode kicks in. In a normal to bright setting? Night Mode off. This, but for Dark Mode! As it stands, I find myself manually switching in and out of Dark Mode based on context that doesn’t involve time of day or when the sun sets. Take right now, for example. It’s gloomy outside, and I’m focused on work on my Mac. This is the sort of environment where I prefer to run Dark Mode on all my devices, and the current automatic switching methods don’t apply here. Ambient light sensing as a Dark Mode toggle would make a fine addition to some future version of iOS, iPadOS, and macOS. Night Mode on the Apple Watch Ultra Wayfinder face is already nailing it. Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides iOS iOS is Apple's mobile operating system that runs… watchOS Apple's software platform for its wrist-worn wea… iPadOS macOS Apple Watch Ultra Author Zac Hall apollozac Zac covers Apple news, hosts the 9to5Mac Happy Hour podcast, and created SpaceExplored.com.'''
