full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); iOS 18 calendar iOS 18.3 Apple Calendar Apple’s Calendar app is quickly improving, and iOS 18.3 offers a new advantage Ryan Christoffel | Jan 28 2025 - 8:00 am PT 42 Comments Apple’s Calendar app has been on the iPhone since the start, and rarely gets changed. But in the last few months, Calendar has been the subject of some compelling upgrades. And now, iOS 18.3 adds a feature that provides another reason to use the app. Calendar got several rare upgrades in iOS 18 Apple’s ‘strategy’ with the Calendar app has always been a bit perplexing to me. The company knows that lots of iPhone users have been drawn away by alternative apps like Google Calendar, and even indie offerings like Fantastical. Yet the company has mostly left Calendar unchanged for years. Despite worthy competition, Apple has shown little interest in making its own app better. But that’s started to change. iOS 18 came with some of the biggest Calendar changes I can remember seeing. And honestly, they’re not that big—but for Calendar, they are. One of the most significant upgrades was the integration of Reminders into the app. You can now create, edit, and view all your reminders from inside Calendar. It’s a great addition, albeit limited—I’d love to enable only certain Reminders lists, but currently it’s all or none. Beyond that major new feature, iOS 18 also brought: a refreshed design with several typography and UI improvements and a new Month view that shows your event details Overall, for an app that seldom gets any attention from Apple, iOS 18’s updates have been a very welcome surprise. And just this week, a small iOS 18.3 addition provides yet another reason to use the built-in Calendar app. iOS 18.3 provides a small addition for Calendar app users If you own an iPhone 16 model featuring Camera Control, iOS 18.3 provides a new advantage for Apple’s Calendar app. Long-pressing Camera Control opens visual intelligence, a recent addition that turns your iPhone’s camera into an AI-infused tool. With visual intelligence you can get information about whatever your camera sees, and in some cases even take action on it. iOS 18.3 adds a nice feature addition for Calendar users. Use visual intelligence to point your iPhone at a flyer, poster, or some other sign containing a calendar date, and iOS 18.3 will offer to add that event to the Calendar app. It’s a quick, easy way to bring real-world info into your digital calendar. Top comment by Hiltegard Liked by 5 people While I've been using Apple services (iCloud storage, Music, iCloud mail, etc) as my default services, I've been migrating to Apple's default apps recently from using all 3rd party apps. A few years back I switched to Apple Maps after I felt it was on par with the competition and still use it. Most recently I switched to Apple Calendar from Fantastical and am really happy. Now I'm using all default Apple apps except for Mail. Still using Edison Mail because Apple Mail opens the next email after deleting/archiving an email without allowing users to have it go back to the inbox instead. anyway, It's crazy that 5-6 years ago I was using all 3rd party apps and now all but one is a default app. In my opinion Apple has been doing a good job improving its apps. Should they keep it up, I'll stay. If not, I'll go back to 3rd party. View all comments iOS lets you change default apps in a variety of categories, but calendar isn’t one of them. Which means the new visual intelligence feature will only work with Apple’s Calendar app. It’s a relatively small addition, but also yet another new reason to stick with the built-in Calendar. Do you use Apple’s Calendar app? What do you think of the recent changes? Let us know in the comments. Best iPhone accessories Anker 100W charging brick for fast charging 10-year AirTag battery case AirPods Pro 2 (now just $199, down from $249) MagSafe Car Mount for iPhone HomeKit smart plug 4-pack Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides iOS 18 calendar iOS 18.3 Apple Calendar Author Ryan Christoffel iryantldr Ryan got his start in journalism as an Editor at MacStories, where he worked for four years covering Apple news, writing app reviews, and more. For two years he co-hosted the Adapt podcast on Relay FM, which focused entirely on the iPad. As a result, it should come as no surprise that his favorite Apple device is the iPad Pro.'''
