title = "All Apple operations now run off 100% renewable energy - 9to5Mac"
description = "[Update: Apple has shared a press release on its environmental progress and hitting 100% renewable energy.] Apple has finally hit..."
full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); Environment All Apple operations now run off 100% renewable energy Benjamin Mayo | Apr 9 2018 - 1:00 pm PT 0 Comments [Update: Apple has shared a press release on its environmental progress and hitting 100% renewable energy.] Apple has finally hit its goal of running its own operations off 100% renewable energy. All Apple facilities, from Apple Park to its data centers to worldwide fleet of Apple retail stores, are now solely powered by green energy. Last year, it was close at 96%, but now it’s finally hit the magic 100 number. This figure does not include Apple’s third-party suppliers or manufacturers, although the company is convincing many of those to switch to 100% renewable sources too … Apple’s environment VP Lisa Jackson discussed the news in an interview with Fast Company. Jackson highlights how Apple has not only focused on reducing emissions but also contributed to the availability of green energy on the grid. Apple has gone from 16% renewable energy to 100% in eight years, with CO2 emissions falling by 58%. The company has built numerous wind and solar farms in cooperation with local institutions, as well as intense focus on environmental sustainability during development of its new buildings like Apple Park. Its data centers are flanked by fields of solar panels. Filling out the last 4% required Apple to find renewable energy sources in some of its more remote retail stores and offices. It has signed power purchase agreements in Brazil, India, Israel, Mexico and Turkey. Every Apple store, every data center, every Apple corporate office — everywhere — is now powered by 100 percent renewable energy.Link: https://t.co/glH7XTFy42 — Tim Cook (@tim_cook) April 9, 2018 Here are some of Apple’s latest renewable energy projects: Apple Park, Apple’s new headquarters in Cupertino, is now the largest LEED Platinum-certified office building in North America. It is powered by 100 percent renewable energy from multiple sources, including a 17-megawatt onsite rooftop solar installation and four megawatts of biogas fuel cells, and controlled by a microgrid with battery storage. It also gives clean energy back to the public grid during periods of low occupancy. Over 485 megawatts of wind and solar projects have been developed across six provinces of China to address upstream manufacturing emissions. Apple recently announced plans to build a 400,000-square-foot, state-of-the-art data center in Waukee, Iowa, that will run entirely on renewable energy from day one. In Prineville, Oregon, the company signed a 200-megawatt power purchase agreement for an Oregon wind farm, the Montague Wind Power Project, set to come online by the end of 2019. In Reno, Nevada, Apple created a partnership with the local utility, NV Energy, and over the last four years developed four new projects totaling 320 megawatts of solar PV generation. In Japan, Apple is partnering with local solar company Daini Denryoku to install over 300 rooftop solar systems that will generate 18,000 megawatt-hours of clean energy every year — enough to power more than 3,000 Japanese homes. Apple’s data center in Maiden, North Carolina, is supported by projects that generate 244 million kilowatt-hours of renewable energy per year, which is equivalent to the energy used by 17,906 North Carolina homes. In Singapore, where land is scarce, Apple adapted and built its renewable energy on 800 rooftops. Apple is currently constructing two new data centers in Denmark that will run on 100 percent renewable energy from day one. Being 100% renewable does not mean that every Apple Store is powered by a solar farm, of course. Apple contributes to the power grid in even absolute amounts to what it uses. Unlike some other companies, it does not buy up REC in open market transactions to offset its dirty energy consumption skew the figures. Jackson explains: “You could go out and buy carbon credits and offsets–nope,” says Jackson firmly. “You could go out and wait for other people to do projects and say ‘Can I have some of that please? How much will you charge me for some of your clean energy?’ No.” Jackson explains that Apple prefers to buy power from renewable energy projects where the company played some role–by either investing capital up front or committing to buying the power produced there for a long time, sometimes decades. In regard to the supply chain, the story is not as clean. Apple has now announced pledges with 23 of its suppliers to serve Apple operations on 100% renewable energy. This is up from 14 in 2016 and includes names like Finisar and Pegatron, a key iPhone assembler. Apple’s biggest link in the supply chain, Foxconn, has yet to sign up. There is a long way to go. Apple wants to stop mining rare mineral for its production processes, and has a long-term goal to create a ‘closed loop’. This would see Apple making new products solely out of recycled parts. These initiatives are underway but may be years off coming to fruition. Apple's VP of Environment, Policy and Social Initiatives @lisapjackson says the company is now globally running on 100% renewable energy, including 23 of its suppliers, and are progressing towards a carbon neutral footprint. #CheddarLIVE pic.twitter.com/HtAq2R03Eh — Cheddar (@cheddar) April 11, 2018 Check out 9to5Mac on YouTube for more Apple news: Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Guides Environment Author Benjamin Mayo bzamayo Benjamin develops iOS apps professionally and covers Apple news and rumors for 9to5Mac. Listen to Benjamin, every week, on the Happy Hour podcast. Check out his personal blog. Message Benjamin over email or Twitter. Benjamin Mayo's favorite gear Philips Hue Lights The easiest way to get into HomeKit and Apple smart home tech. Great for gifts. iPhone Wireless Charger Inexpensive, fast, wireless charger for iPhone.'''
