ed ‘HomeAccessory’ could have square display, A18 chip for AI, more Filipe Espósito Sep 26 2024 - 11:16 am PT 27 Comments We’ve been hearing multiple rumors about Apple working on a new home accessory that combines capabilities of an iPad, Apple TV, and HomePod. A few months ago, references to a “HomeAccessory” were found in Apple’s backend code. Now 9to5Mac has learned more details about this new device. Expand Expanding Close"
