9 for the base iPhone 16 with the same storage. To achieve the lower price, here are some of the biggest cuts Apple made compared to the standard iPhone 16: no Ultra Wide camera, just the standard camera no Camera Control button no MagSafe, but wireless charging is still supported notch instead of Dynamic Island Should I upgrade? iPhone 16e feature comparisons For in-depth comparisons of the iPhone 16e to other iPhone models, see the following articles: iPhone 16e vs 15: Five key upgrades to entice users iPhone 16e vs 14 Pro: Upgrade or downgrade? iPhone 16e vs iPhone 14: No-brainer upgrade? Here’s how the iPhone 16e compares to iPhone 12, 13, and more If you’re looking to move up from an older iPhone model, Apple notes that you can get trade-in credit for a qualifying device trade. Special carrier offers can also bring steep discounts on an upgrade. The Apple Trade-In program makes it easier and quicker than ever to upgrade from an older device. Customers purchasing iPhone 16e can receive up to $120 in credit when they trade in iPhone 11 — or now with a carrier offer, up to $599 in credit — and receive help activating their new device at their local Apple Store. Do you plan to upgrade to an iPhone 16e? Which model are you coming from? Let us know in the comments. Best iPhone accessories Anker 100W charging brick for fast charging MagSafe Car Mount for iPhone HomeKit smart plug 4-pack AirPods Pro 2 (now only $199, down from $249) 10-year AirTag battery case 2-pack Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone