’s reassigning staff that had worked on Skype to other areas of the business and will not lay anyone off, Teper added. According to Bloomberg, while Skype once had over 300 million monthly users in 2016, that number shrank to around 36 million by 2023 as Microsoft Teams has grown. 9to5Mac’s Take Skype was one of the major losers of the 2020 COVID era that brought big success to companies like Zoom and Slack. Already at the time Microsoft was investing heavily in Teams, so Skype, despite its past success, was largely left to flounder. Microsoft acquired Skype for $8.5 billion in 2011, which is not that long ago in the grand scheme of things. Per the company, Skype helped set a foundation that was built upon with Teams. So in that sense, its downfall is less a story of failure and more one of preparing the way for the more modern Teams platform to emerge. When was the last time you used Skype? Are you surprised at all by the news? Let us know in the comments. Best iPhone accessories Anker 100W charging brick for fast charging MagSafe Car Mount for iPhone HomeKit smart plug 4-pack AirPods Pro 2 (now only $199, down from $249) 10-year AirTag battery case 2-pack Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assuran