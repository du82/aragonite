full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); Apple @ Work Apple @ Work: Apple’s biometric strategy pays off as IT leaders believe Touch ID and Face ID are the future of enterprise security Bradley C | Mar 1 2025 - 11:31 am PT 2 Comments Apple @ Work is exclusively brought to you by Mosyle, the only Apple Unified Platform. Mosyle is the only solution that integrates in a single professional-grade platform all the solutions necessary to seamlessly and automatically deploy, manage & protect Apple devices at work. Over 45,000 organizations trust Mosyle to make millions of Apple devices work-ready with no effort and at an affordable cost. Request your EXTENDED TRIAL today and understand why Mosyle is everything you need to work with Apple. A new IT report makes it clear—IT teams are ready to ditch passwords. 85% of surveyed IT admins believe requiring biometrics would improve security, but 68% of admins report that less than half of thedevices they currently manage have biometric capabilities. That’s a massive gap, and Apple might be the best company to fill it as every Apple device comes with biometrics out of the box. Some of my favorite gear Aqara Smart Lock U50 Upgrade your doors with Apple Home Key and the Aqara U50. About Apple @ Work: Bradley Chambers managed an enterprise IT network from 2009 to 2021. Through his experience deploying and managing firewalls, switches, a mobile device management system, enterprise grade Wi-Fi, 1000s of Macs, and 1000s of iPads, Bradley will highlight ways in which Apple IT managers deploy Apple devices, build networks to support them, train users, stories from the trenches of IT management, and ways Apple could improve its products for IT departments. Touch ID/Face ID has been on the iPhone around for 11 years at this point, and it’s been available on the Mac since 2016. Today, every iPad, Mac, and iPhone includes biometrics that are out of the box. But here’s the real question: If IT leaders already know biometrics are the way forward, why aren’t Apple’s authentication systems becoming the default for enterprise security? Passwords are the weak link—and IT teams know it If there’s one thing IT teams agree on, it’s that passwords are a problem as they’re ripe for phishing. Apple has been heavily pushing passkey across macOS and iOS, a passwordless authentication method (from the FIDO Alliance) that relies on biometrics or a device-based key. The FIDO Alliance has been working with major device manufacturers and password managers to continue improving the standard (portability is coming soon). Meanwhile, enterprise IT teams struggle with weak passwords, multi-factor authentication fatigue, and rising security threats. The report also notes that AI-driven cyberattacks are rising, and poorly managed passwords remain an easy target for hackers. IT teams know this, but they’re still playing catch-up when deploying better security tools. 98% of the people surveyed report using password-based systems for at least some IT resources. Some of my favorite gear eufyCam 2C Upgrade your home security with wireless cameras that includes HomeKit compatibility. If biometric security is the future, Apple already has the pieces to win. Touch ID is standard for desktop users on MacBook Pros, MacBook Airs, and Apple’s Magic Keyboard. It’s fast, secure, and tied to Apple’s Secure Enclave, which keeps biometric data locked away from potential attacks and stays local to the device. For many years, I’ve said that Apple’s not trying to sync biometric data across iCloud strategically was an incredible decision in hindsight. The data is clear, though. IT admins want biometrics to improve their security posture, but many companies still buy and deploy devices that don’t support them. In my opinion, that’s a strategic mistake. With Apple Silicon Macs gaining traction in the enterprise, 2025 is the time for IT leaders to start prioritizing hardware that makes biometrics work great for IT and the end user. Buying devices without biometrics in 2025 is ignoring what’s best for security. One thing I’d like Apple to begin thinking about in the long term is making biometrics always available, even if you restart the Mac. We need biometrics 100% of the time to move to a passwordless world. JumpCloud’s report makes it obvious: IT teams know biometrics are the future, but they’re not rolling them out fast enough. Apple is already ahead of the game with Touch ID, Face ID, Secure Enclave, and passkeys—it’s just a matter of enterprise IT catching up with their buying strategy. Some of my favorite gear Abode Home Security System Abode is the best home security system and includes compatibility with HomeKit. You can download the full report here. Apple @ Work is exclusively brought to you by Mosyle, the only Apple Unified Platform. Mosyle is the only solution that integrates in a single professional-grade platform all the solutions necessary to seamlessly and automatically deploy, manage & protect Apple devices at work. Over 45,000 organizations trust Mosyle to make millions of Apple devices work-ready with no effort and at an affordable cost. Request your EXTENDED TRIAL today and understand why Mosyle is everything you need to work with Apple. Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 Some of my favorite gear Abode Home Security System Abode is the best home security system and includes compatibility with HomeKit. Some of my favorite gear Aqara Smart Lock U50 Upgrade your doors with Apple Home Key and the Aqara U50. Some of my favorite gear eufyCam 2C Upgrade your home security with wireless cameras that includes HomeKit compatibility. Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides Apple @ Work Apple @ Work is a 9to5Mac series where Bradley C… Author Bradley C Bradley C Tips, feedback, corrections and questions can be sent to Bradley@9to5mac.com. Bradley C's favorite gear eufyCam 2C Upgrade your home security with wireless cameras that includes HomeKit compatibility. Abode Home Security System Abode is the best home security system and includes compatibility with HomeKit.'''
