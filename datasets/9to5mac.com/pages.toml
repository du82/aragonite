description = "Apple TV+ has a growing slate of acclaimed crime thrillers, but its next—Dope Thief—looks like it could be the best yet. Here’s the trailer."
full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); Apple TV Apple TV+ is becoming a crime thriller destination, and its next might be the best yet Ryan Christoffel | Feb 19 2025 - 7:23 am PT 2 Comments Apple TV+ has become known as a go-to streamer for sci-fi shows, such as Severance, Foundation, Dark Matter, and Silo. But the service has a growing slate of top-tier crime thrillers in its catalog too, and the next one—Dope Thief—looks like it could be the best yet. Dope Thief debuts on Apple TV+ next month, and the first trailer looks impressive When Apple TV+ first launched in 2019, it infamously included only Apple originals. As a result, its library of content was slim. Over the years, Apple has beefed up its catalog significantly thanks to more and more originals, plus additional seasons for early hits like The Morning Show and Ted Lasso. With its growing slate of content, TV+ has been able to distinguish itself as a go-to streamer for sci-fi shows, feel-good Bill Lawrence comedies, and now crime thrillers are becoming another strong suit. Some of the best or most popular shows available today on Apple TV+ are crime thrillers, including: Black Bird Hijack Presumed Innocent Criminal Record Next up, Apple has a new crime thriller debuting on March 14 called Dope Thief. The trailer just released, and it looks very impressive. I was interested in Dope Thief before seeing the trailer, but the trailer easily made the show a must-watch for me. Creative team behind Apple’s next crime thriller Dope Thief is executive produced by Ridley Scott, who also directs the first episode. Its creator is Peter Craig, who has co-written several Hollywood hits including The Batman, Top Gun: Maverick, and The Town. The latter Ben Affleck film, plus to some degree Matt Reeves’ The Batman, clearly prepared Craig to take on a major crime series like Dope Thief. Here’s Apple’s description of the new show: Based on Dennis Tafoya’s book “Dope Thief,” the series follows long-time Philly friends and delinquents who pose as DEA agents to rob an unknown house in the countryside, only to have their small-time grift become a life-and-death enterprise, as they unwittingly reveal and unravel the biggest hidden narcotics corridor on the Eastern Seaboard. Dope Thief’s cast includes Brian Tyree Henry, Wagner Moura, Ving Rhames, and more. The first two episodes will be available on Friday, March 14, then a new episode weekly through April 25. Though Dope Thief is clearly very different in tone and genre than Severance, if it turns out to be as high quality as the trailer indicates, it could be the perfect way for Apple to keep Severance viewers subscribed to TV+ after the current season ends March 21. Apple TV+ is available for $9.99 per month. Best iPhone accessories AirPods Pro 2 (now only $199, down from $249) 10-year AirTag battery case 2-pack Anker 100W charging brick for fast charging MagSafe Car Mount for iPhone HomeKit smart plug 4-pack Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — 