o enable warnings for children when they receive or send photos that contain nudity. This tool was announced alongside Apple’s controversial CSAM plans but was delayed due to backlash from the community. You can check below the full release notes of iOS 15.2: Apple Music Voice Plan Apple Music Voice Plan is a new subscription tier that gives you access to all songs, playlists, and stations in Apple Music using SiriJust Ask Siri suggests music based on your listening history and likes or dislikesPlay it Again lets you access a list of your recently played music Privacy App Privacy Report in Settings lets you see how often apps have accessed your location, photos, camera, microphone, contacts and more during the last seven days, as well as their network activity Messages Communication safety setting gives parents the ability to enable warnings for children when they receive or send photos that contain nuditySafety warnings contain helpful resources for children when they receive photos that contain nudity Siri and Search Expanded guidance in Siri, Spotlight, and Safari Search to help children and parents stay safe online and get help with unsafe situations Apple ID Digital Legacy allows you to designate people as Legacy Contacts so they can access your iCloud account and personal information in the event of your death Camera Macro photo control for switching to the Ultra Wide lens to capture macro photos and videos can be enabled in Settings on iPhone 13 Pro and iPhone 13 Pro Max TV app Store tab lets you browse, buy, and rent movies and TV Shows all in one place CarPlay Enhanced city map in Apple Maps with road details like turn lanes, medians, bike lanes, and pedestrian crosswalks for supported cities This release also includes the following enhancements for your iPhone: Hide My Email is available in the Mail app for iCloud+ subscribers to create unique, random email addressesFind My can locate iPhone for up to five hours when in Power ReserveStocks allows you to view the currency for a ticker and see year-to-date performance when viewing chartsReminders and Notes now allow you to delete or rename tags This release also includes bug fixes for your iPhone: Siri may not respond while VoiceOver is running and iPhone is lockedProRAW photos may appear overexposed when viewing in third-party photo editing appsHomeKit scenes that include a garage door may not run from CarPlay when your iPhone is lockedCarPlay may not update Now Playing information for certain appsVideo streaming apps may not load content on iPhone 13 modelsCalendar events may appear on the wrong day for Microsoft Exchange users Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Guides iOS 15 watchOS 8 iPadOS 15 tvOS 15 Author Staff Writer'''
