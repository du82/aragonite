full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); AAPL Company Privacy iCloud Security British government secretly ordered Apple to create a worldwide iCloud backdoor Ben Lovejoy | Feb 7 2025 - 4:17 am PT 52 Comments It’s being reported that the British government secretly ordered Apple to create a security backdoor into all content uploaded by iCloud users anywhere in the world. Apple is certain to refuse the demand, leading to the possibility of a similar privacy stand-off to the one seen between the iPhone maker and the FBI back in the San Bernardino shooter case … British government demands iCloud backdoor The Washington Post reports that the order was sent to Apple last month. Security officials in the United Kingdom have demanded that Apple create a back door allowing them to retrieve all the content any Apple user worldwide has uploaded to the cloud, people familiar with the matter told The Washington Post. The British government’s undisclosed order, issued last month, requires blanket capability to view fully encrypted material, not merely assistance in cracking a specific account, and has no known precedent in major democracies. Given Apple’s strong privacy stance, there seems absolutely no prospect of the company agreeing to the demand, raising the prospect of a court battle similar to that seen in the 2016 case with the FBI. In that case, the US government demanded that Apple create an iOS backdoor to help the FBI break into an iPhone belonging to a suspected shooter. Apple refused, and the case went to court. The drama eventually ended when the law enforcement agency managed to gain access via a third-party company without Apple assistance. 9to5Mac’s Take The British government’s demand is as technically clueless as it is outrageous. First, much of the data is protected by end-to-end encryption (E2EE). This means that Apple does not hold a copy of the key, and would be unable to decrypt it. You can ensure your iCloud data uses E2EE by switching on Advanced Data Protection. Second, even for the data Apple could supply, there are already legal mechanisms in place for law enforcement agencies to request it. They simply need to go to a judge to apply for a court order. The judge will weigh the interests of justice against those of privacy and make an individual determination based on the specific circumstances in that case. Where a judge agrees to issue a court order, Apple complies with these to the extent that it is able to do so. There is absolutely no justification whatsoever for any government to have uncontrolled access to the personal data of every iCloud user on the planet. Top comment by HellinTL Liked by 3 people What has happened to the European continent? I would prefer they build their own hardware and software systems, and stop telling Apple what to do. They’re all being very reckless in this regard. Also, this sounds like science fiction. Did the British government just wake up and watch Person of Interest? View all comments We know that Apple will refuse, not only because it did so in the San Bernardino and Pensacola cases, but because we’ve been down this road before in the UK. Back in 2023, the British government demanded access to iMessages and FaceTime calls, both of which are end-to-end encrypted. Apple would have had no way to comply without removing E2EE, and it refused to do so, saying it would withdraw the services from the UK rather than comply. In the end, the government backed down, issuing an unconvincing statement about “postponing” the measure. Both past and present UK governments have voted in favor of repressive legislation granting widespread powers to spy not just on their own citizens but on tech users worldwide. Photo by Dima Pechurin on Unsplash Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides AAPL Company Breaking news from Cupertino. We’ll give you t… Privacy Privacy is a growing concern in today's world. F… iCloud Security Author Ben Lovejoy benlovejoy Ben Lovejoy is a British technology writer and EU Editor for 9to5Mac. He’s known for his op-eds and diary pieces, exploring his experience of Apple products over time, for a more rounded review. He also writes fiction, with two technothriller novels, a couple of SF shorts and a rom-com! Ben Lovejoy's favorite gear Dell 49-inch curved monitor'''
