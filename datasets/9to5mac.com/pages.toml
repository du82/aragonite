full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); AAPL Company Trump likens UK encryption law to ‘something you hear about with China’ Chance Miller | Feb 28 2025 - 8:30 am PT 17 Comments President Trump has chimed in on the UK’s attempt to force Apple to add a global backdoor to iCloud, likening the demand to “something that you hear about with China.” Trump met with UK Prime Minister Keir Starmer at The White House yesterday for a wide-ranging conversation on world politics, tariffs, free speech, and more. It marked Starmer’s first visit to Washington, D.C., since Trump took office last month. In an interview with British news outlet The Spectator yesterday, Trump was asked about the UK’s anti-encryption legislation. Trump said that he told Starmer that the UK “can’t do this.” “We told them you can’t do this. We actually told him [Starmer]… that’s incredible. That’s something, you know, that you hear about with China.” Trump’s comments came after his Director of National Security, Tulsi Gabbard, suggested that the UK may have broken a bilateral agreement when secretly demanding Apple to build a global backdoor into iCloud. Gabbard said she has “grave concern about the serious implications of the United Kingdom, or any foreign country, requiring Apple or any company to create a ‘backdoor’ that would allow access to Americans personal encrypted data.” In response to the UK’s request, Apple pulled Advanced Data Protection from the UK market. In a statement, the company said, “we have never built a backdoor or master key to any of our products or services and we never will.” Other categories of iCloud data, such as passwords, health data, and Messages in iCloud, remain encrypted in the UK. An interesting aside: Advanced Data Protection is available in China, so users in China actually have access to an encryption feature that users in the UK do not have. Follow Chance: Threads, Bluesky, Instagram, and Mastodon. Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides AAPL Company Breaking news from Cupertino. We’ll give you t… Author Chance Miller chancehmiller Chance is the editor-in-