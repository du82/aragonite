full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); Apple TV You can get Apple TV+ completely free, here’s how Ryan Christoffel | Feb 28 2025 - 12:28 pm PT 4 Comments Apple TV+ is currently airing Severance season two, a hit that’s even surpassed Ted Lasso in viewer numbers. But if you haven’t yet tried Apple’s streaming service, there are a variety of ways to access Apple TV+ completely free—from trials and free periods to ongoing subscriptions. Here’s how. 7-day free trial from Apple This is the simplest way to get started with Apple TV+. If you’ve never previously subscribed to Apple TV+, you’re entitled to a free 7-day trial. This trial applies automatically upon signing up for a monthly $9.99 subscription. After your trial starts, you can immediately cancel the plan’s renewal to ensure you never get charged. Even if you cancel right away, you’ll still get the seven days of viewing time to try out Apple TV+. 1-month free trial with Apple One Apple One is sort of like Amazon Prime, in that it bundles together a variety of different services at one discounted cost. Several different Apple One plans are available, but at a minimum they all include Apple TV+, Apple Music, Apple Arcade, and iCloud+. If you sign up for Apple One, you’re entitled to a 1-month free trial of the services you’re not already subscribed to. So if you want an extended test-run with Apple TV+, signing up for Apple One then canceling before the trial ends is a great option. Students get Apple TV+ free with Apple Music If you subscribe to the Apple Music Student plan, there’s a really nice bonus: Apple throws in an Apple TV+ subscription entirely free. That means students can get not only Apple Music for just $5.99, but also an Apple TV+ subscription at no additional cost. 3 free months with new Apple device If you buy a new iPhone, iPad, Apple TV, or Mac, your purchase gets you three free months of Apple TV+ thrown in too. Full details on qualifications are available here. You can’t stack this offer with multiple purchases, as it can only be claimed once per account. But if you’re new to Apple TV+ and just bought an iPhone 16e, for example, three months will give you plenty of time to enjoy Apple’s biggest hits. Free with T-Mobile 5G plans T-Mobile currently offers free Apple TV+ service to select wireless customers. You have to be on a Go5G Next or Go5G Plus plan to qualify, but if you’re already paying for one of those plans, you can access Apple TV+ completely free for as long as you’re with T-Mobile. Xfinity bundle makes Apple TV+ mostly free If you’re a Comcast Xfinity subscriber, whether you pay for Internet, TV, or both, there’s a special bundle available exclusively for you. Xfinity subscribers can add Xfinity StreamSaver to their plan for just $15/month, and that gets you: Netflix Standard with ads ($7.99 value) Peacock Premium with ads ($7.99 value) and Apple TV+ ($9.99 value) Most of us are already Netflix subscribers, and if you already pay for Peacock too, you can save money by using StreamSaver for $15/month and get Apple TV+ thrown in at no extra cost. Free Apple TV+ wrap-up Apple TV+ is available for $9.99 per month if none of the above offers apply to you. You can watch the service through the Apple TV app on various smart TVs, and also iPhone, Android, iPad, Mac, and more. Apple TV+ offers hit TV shows and movies like Ted Lasso, Severance, The Morning Show, Silo, and Shrinking. Best Apple TV and home accessories AirPods Pro 2 (currently $199, down from $249) Anti-slip silicone case for Siri Remote, AirTag compatible HomeKit smart plug 4-pack HomeKit Garage Door Opener TP-Link Tapo 2K camera with HomeKit Secure Video Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides Apple TV Apple TV is Apple's streaming device that access… Author Ryan Christoffel iryantldr Ryan got his start in journalism as an Editor at MacStories, where he worked for four years covering Apple news, writing app reviews, and more. For two years he co-hosted the Adapt podcast on Relay FM, which focused entirely on the iPad. As a result, it should come as no surprise that his favorite