 ideally you’d never have to use, but if you do – it’s incredibly handy to have. iPhone SE 3 never supported this feature set. With the purchase of an iPhone 16e, you receive 2 years of free satellite connectivity. Unfortunately, we still don’t know what it’ll cost after the free trial period. Apple opted to offer an additional free year for those who purchased an iPhone 14 early on. Crash Detection Continuing the theme of “just in case safety features that you’ll hopefully never need to use” – iPhone 16e also supports crash detection. Thanks to the high-g accelerometer, Apple can now tell when you’ve been in a car crash, and call emergency services for you if you’re unresponsive. This feature can save lives. Water resistance improvements iPhone 16e features IP68 water resistance, allowing you to use your iPhone underwater up to 6 meters deep for 30 minutes or less. This is a vast improvement over the iPhone SE 3, which only supported IP67. With IP67 water resistance, you could only use your iPhone up to 1 meter underwater for up to 30 minutes. Optical zoom support iPhone 16e equips an all new 48MP sensor. Ever since Apple introduced the first 48MP sensor on iPhone 14 Pro, its supported a feature to take 2x optical zoom photos with the main sensor. Essentially, Apple crops in on the middle 12MP of the larger 48MP sensor, allowing for each pixel to be properly represented in a photo. You may disagree on whether or not this methodology should count as optical zoom, but one way or another, it’s a lot better quality than a normal digital zoom photo, which would ordinarily be under 12MP. Night mode photography Apple debuted night mode with the iPhone 11 lineup. This allowed users to take better photos at night, thanks to a longer processing algorithm. Despite the second and third generation iPhone SE‘s debuting after the introduction of this feature, they never gained support for night mode. iPhone 16e does support night mode though, allowing Apple’s latest entry-level iPhone to take much better photos when its dark out. What do you think of Apple’s new iPhone 16e? Let us know in the comments. My favorite iPhone accessories on Amazon: ESR MagSafe Wallet with Kickstand, Grip, and Find My support Anker MagSafe 2-in-1 Wireless Charging Stand with Qi2 UGREEN 6.6ft braided USB-C charging cables, 2-pack AirPods Pro 2 (USB-C) Follow Michael: X/Twitter, Bluesky, Instagram Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides iPhone 16E Author Michael Burkhardt mbrkhrdt Michael is 9to5Mac’s Weekend Editor, keeping up with all of the latest Apple news on Saturday and Sunday. He got started in the world of Apple news during the pandemic, and it became a growing hobby. He’s also an indie iOS developer in his free time, and has published numerous apps over the years.'''
