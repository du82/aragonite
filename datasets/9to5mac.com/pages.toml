full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); AAPL Company Apple is on a mission to develop more of its silicon in-house: Here’s what’s next Michael Burkhardt | Mar 1 2025 - 10:37 am PT 2 Comments In 2020, Apple announced the Mac transition to Apple Silicon. Replacing Intel was a large undertaking, but it proved successful. Apple was able to develop chips that were both faster and more efficient than the Intel processors they replaced, all in an under 3 year transition. Now, Apple is trying to replace Qualcomm, starting off with the new C1 modem in the brand new iPhone 16e, it’s the first step in a much larger journey. In the end, Apple wants all networking to be handled in-house. Future C2 and C3 modems Apple’s first C1 modem, which debuted in iPhone 16e last month, is more focused on efficiency. It doesn’t support 5G mmWave, and doesn’t support all of the same wavelengths as the existing Qualcomm modems. It’s still pretty performant according to tests, but it isn’t the best of the best. That’s why this C1 modem isn’t making its way to most of the iPhone 17 lineup, though it will likely appear in the iPhone 17 Air – where its efficiency gains will be important for such a thin form factor. Apple referred to C1 as “the most power-efficient modem ever on an iPhone, delivering fast and reliable 5G cellular connectivity.” Unsurprisingly, Apple is already working on future generation 5G modems. According to Bloomberg’s Mark Gurman, Apple intends to fully replace Qualcomm within two generations. The C2 modem, codenamed Ganymede, will debut in the iPhone 18 lineup in 2026 – as well as future iPad models in 2027. According to Gurman, these modems will be on-par with Qualcomm: The big difference is that Ganymede will catch up to current Qualcomm modems by adding support for mmWave, download speeds of 6 gigabits per second, six-carrier aggregation when using Sub-6, and eight-carrier aggregation when using mmWave. Afterwards, Apple will debut C3 in 2027, codenamed Prometheus, alongside the iPhone 19 lineup. This modem will completely surpass Qualcomm: In 2027, Apple aims to roll out its third modem, code-named Prometheus. The company hopes to top Qualcomm with that component’s performance and artificial intelligence features by that point. It will also build in support for next-generation satellite networks. Amid all of these plans, Apple is also considering bringing cellular support to MacBooks, as soon as 2026. This would of course be thanks to its new in-house modems. New Wi-Fi and Bluetooth chip On top of replacing Qualcomm’s cellular modems, Apple also wants to replace Broadcom’s networking chips. Despite being a relatively new rumor, this new networking chip will debut as soon as this year. This networking chip, codenamed Proxima, is expected to debut in refreshed versions of the HomePod mini and Apple TV later this year, per Gurman. The chip will support the Wi-Fi 6E standard, and has a theoretical capability of serving as a Wi-Fi router. Gurman also said it’ll debut in some iPhone models this year, and some iPad and Mac models in 2026. Analyst Ming-Chi Kuo has taken this a step further, and stated that the Apple networking chip will actually debut in the entire iPhone 17 lineup later this year, rather than just the iPhone 17 Air. Kuo states that this will “enhance connectivity across Apple devices,” as well as reduce cost. Modem integration with main chipset After Apple is done with its modem transition, it’s also considering integrating its cellular modems inside of the main Apple Silicon chipset. Rather than an A18 chip and a separate C1 chip, it’d all be one package. According to Gurman, this feat won’t happen until 2028 at the earliest. Nonetheless, its on the table, and apparently provides a number of cost and efficiency benefits. My favorite iPhone accessories on Amazon: ESR MagSafe Wallet with Kickstand, Grip, and Find My support Anker MagSafe 2-in-1 Wireless Charging Stand with Qi2 UGREEN 6.6ft braided USB-C charging cables, 2-pack AirPods Pro 2 (USB-C) Follow Michael: X/Twitter, Bluesky, Instagram Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides AAPL Company Breaking news from Cupertino. We’ll give you t… Author Michael Burkhardt mbrkhrdt Michael is 9to5Mac’s Weekend Editor, keeping up with all of the latest Apple news on Saturday and Sunday. He got started in the world of Apple news during the pandemic, and it became a growing hobby. He’s also an indie iOS developer in his free time, and has published numerous apps over the years.'''
