description = "Apple’s Reality Pro headset will pack a number of unique features when it’s announced next week at WWDC 2023. But..."
full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); Vision Pro Reality Pro’s library of Apple Music VR concerts has been a decade in the making Chance Miller | Jun 2 2023 - 12:47 pm PT 3 Comments Apple’s Reality Pro headset will pack a number of unique features when it’s announced next week at WWDC 2023. But there’s one thing in particular that I’m interested in seeing from Apple – virtual reality concerts. Nothing will ever compare to the experience of live music. But when you combine things like 360-degree video, top-of-the-line display technology, and spatial audio, Apple’s Reality Pro headset will create an incredibly immersive experience. Real concerts, not metaverse concerts Last week, I was chatting with Zac about his piece on what it was like attending a virtual reality concert in the metaverse using the Meta Quest Pro. In Zac’s case, this concert was performed in a truly bizarre virtual world: The “venue” was a SIMS-like multilevel platform that wrapped halfway around the VR performer. Four sets of VR drum sets were available with VR drum sticks that you could pick up with the Meta Quest controllers. You could also launch the camera on your VR phone to snap photos or record short video clips that saved to your gallery. The artist performance aspect of the “concert” was weird though. It was like watching a music video designed to fill in the space of the circular stage. My experience is limited to this one time so I’m not sure if other VR concerts feel more like being there instead of feeling like a game character in a game world. Oh, and I didn’t have legs. Apple executives have made it clear that they aren’t fond of the “metaverse” term or idea. The company’s goal is also not to cut people off entirely from the outside world. The concert that Zac attended through the Meta Quest Pro sounds like it was the exact opposite – a metaverse-based concert that completely transported you to a fake, virtual world. What I want from Apple, and what I think the company is actively planning, are virtual reality versions of actual concerts. Not fake metaverse concerts, but the ability to watch actual concerts – whether live or pre-recorded – in virtual reality. A headset full of dreams As 9to5Mac first reported by in 2020, Apple acquired NextVR, a company that was focused on creating VR experiences for viewing live events like sporting events and concerts. At the time, the company’s content was available for headsets from the likes of Oculus, HTC, and PlayStation. The work on content like this dates back over a decade. NextVR was founded in 2009 and built a wide library of content in the years prior to the Apple acquisition. With Apple’s pile of cash and connections, it’s easy to assume that NextVR has been able to further ramp up the pace at which this type of content is created. In fact, I’ve also heard from a few friends in the live concert and music documentary field that Apple is already out and filming this type of content in virtual reality. One of the first run-ins I had with virtual reality concerts was in 2014 when NextVR teamed up with Coldplay. Coldplay was fresh off the release of their newest album Ghost Stories, and they weren’t planning to tour the album given its subdued and dark themes. Teaming up with NextVR allowed the band to film one of the few live shows they did for Ghost Stories in 360-degree 3D VR video instead. The virtual reality concert puts Coldplay fans directly in the middle of the action, viewing the band members as if they are on stage with them. The concert film is the first ever broadcast quality VR experience. This quality VR experience has never before been possible. NextVR worked with Coldplay in London over the summer to develop the VR concert concept as a cutting edge experience for both fans who saw the concert live and wanted to experience it again, as well as those who were unable to attend. NextVR aims to follow up the release of A Sky Full Of Stars with the full concert over the coming months and is in talks with Coldplay for future virtual reality collaborations. “You’re literally inside the show, front of stage with the band. The quality of this virtual reality experience is far superior to anything else out there. It’s pretty mind-blowing,” Coldplay creative director and secret 5th member Phil Harvey explained at the time. The footage was then released via the NextVR application for Samsung Gear VR users. Again, this was over a decade ago, and the technology for filming this type of content has only gotten better since then. Win-win for fans and artists? Still image from Coldplay’s second VR concert in 2017 The idea of immersive virtual reality concerts makes even more sense when you zoom out and look at the current state of the live music industry. Given Ticketmaster’s monopoly, concert and event tickets are harder than ever to come by. They are more expensive than ever before and supply is more limited than ever before. Doing world tours has also gotten much more expensive for bands themselves. This has led to artists doing far fewer shows than they might have done several years ago, visiting fewer countries than before, and in some cases having to scrap their plans altogether. Not to keep harping on Coldplay, but even they admitted they almost had to scrap their Music of the Spheres world tour because of logistical and cost concerns. All of this is to say that offering an in-depth catalog of live concerts could be a key selling point for Reality Pro and xrOS. Imagine the demand if Taylor Swift recorded one of her recent Eras Tour performances in virtual reality. To recap: More opportunities for fans to experience “live” music, more revenue opportunities for artists, and a key selling point for Apple. I’m well aware that the idea of virtual reality concerts has existed for years, but it’s something I think Apple can truly revolutionize. After all, the company has been an innovator in the music industry for years. It has deep connections in the music industry, a pile of cash to throw at artists and bands, and industry-leading tech. Follow Chance: Twitter, Instagram, and Mastodon Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more