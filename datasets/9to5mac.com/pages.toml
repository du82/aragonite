full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); Apple Watch Environment New lawsuit alleges Apple Watch carbon neutral claims are ‘false and misleading’ [U] Ryan Christoffel | Feb 28 2025 - 8:45 am PT 36 Comments Apple has a big goal of making all its products carbon neutral by 2030. But the company is now being sued over claims that its first such product to hit that goal—Apple Watch—isn’t actually as carbon neutral as Apple says. Here’s what you should know about the new Apple Watch carbon neutral lawsuit. Updated 2/28 11:45 a.m. ET to include Apple’s statement in response below. Watch buyers believe they were misled by Apple’s carbon neutral claims Jonathan Stempel writes at Reuters: Apple has been sued by consumers who said its claim that three versions of Apple Watches are “carbon neutral” and environmentally friendly is false and misleading. In a complaint filed on Wednesday in San Jose, California federal court, seven purchasers of the green-tagged Apple Watch Series 9, SE and Ultra 2 said they would not have bought their watches or would have paid less had they known the truth. Apple…launched the watches in September 2023, saying they would be carbon neutral through a combination of lower emissions and purchases of carbon offsets. But the plaintiffs–from California, Florida and Washington, D.C.–said two carbon offsetting projects on which Apple relied to meet its corporate emissions target did not provide “genuine” carbon reductions. Two specific offsetting projects are named as not “genuine”: Kenya’s Chyulu Hills Project China’s Guinan Project Plaintiffs argue that neither of these should actually qualify for providing carbon offsets to Apple: “In both cases, the carbon reductions would have occurred regardless of Apple’s involvement or the projects’ existence,” the complaint said. “Because Apple’s carbon neutrality claims are predicated on the efficacy and legitimacy of these projects, Apple’s carbon neutrality claims are false and misleading.” Top comment by urname Liked by 2 people Maybe I don’t understand how carbon offsets work, but isn’t the point that Apple purchases them as some sort of credit towards the carbon produced by the manufacturing of their products?So of course Apple would have no hand in the reductions produced by those projects. The point is that they’re buying those offsets produced. Not funding the project as an investment, or managing it themselves. View all comments The lawsuit seeks damages from Apple and an injunction blocking Apple from using the term ‘carbon neutral’ in any of its product marketing. Since the 2023 launch of the first carbon neutral Apple Watch models, Apple has also launched the M4 Mac mini as its first carbon neutral Mac, and also expanded the options for carbon neutral watches with the Apple Watch Series 10 line. Update 2/28 11:45 a.m. ET: Apple has provided the following statement to 9to5Mac: “We are proud of our carbon neutral products, which are the result of industry-leading innovation in clean energy and low-carbon design. We’ve drastically cut emissions for Apple Watch by over 75 percent, and we are investing significantly in nature-based projects to remove hundreds of thousands of metric tons of carbon from the air. That innovation and progress is important to us and to the planet, which is why we detail our work prominently and transparently for our users.” What do you think of Apple’s new carbon neutral lawsuit? Let us know in the comments. Best Apple Watch deals and accessories Apple Watch Series 10, 46mm (only $359, discounted from $429) Anker portable USB-C charger for Apple Watch AirPods Pro 2 MagSafe Qi2 3-in-1 charger Retro Mac stand for Apple Watch Nightstand Mode Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides Apple Watch Apple Watch is Apple's wearable is designed to h… Environment Author Ryan Christoffel iryantldr Ryan got his start in journalism as an Editor at MacStories, where he worked for four years covering Apple news, writing app reviews, and more. For two years he co-hosted the Adapt podcast on Relay FM, which focused entirely on the iPad. As a result, it should come as no surprise that his favorite Apple device is the iPad Pro.'''
