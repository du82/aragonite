documents, and web links — to the canvas and preview it inline, without leaving the board. Apple warns of some bugs in the first version of Freeform available today: Can’t delete boards while offline, or if iCloud data is disabled for Freeform. (100294085)Adding or removing collaborators can fail while attempting to change share settings. (101186059) Freeform is also available in today’s iOS 16.2 beta as well as macOS Ventura 13.1. For Stage Manager, iPadOS 16 initially included support for external displays, but Apple removed the feature before shipping iPadOS 16.1 to the general public. With today’s release, the functionality has returned. As expected, it is exclusive to the M1 and M2 models of the iPad Pro and iPad Air. Apple cautions: While using Stage Manager with an External Display, dragging a second window to the workspace incorrectly hides the Recent Apps list—shifting all windows in the workspace to the right. (98540114) The first iPadOS 16.2 beta is available now to developers. A public beta is likely to be released sometime in the next several weeks. Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac