description = "iOS 15.4 changes and features. A hands-on look at what's new in the final version of iOS 15.4 and iPadOS 15.4."
full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); iPadOS iOS 15.4 40+ iOS 15.4 changes and features – hands-on with everything new for iPhone and iPad [Video] Jeff Benjamin | Mar 15 2022 - 9:53 am PT 0 Comments Apple yesterday shipped the final public versions of iOS 15.4 and iPadOS 15.4. The releases include many iOS 15.4 changes and features, along with several noteworthy updates. Included is the ability to unlock your iPhone while wearing a mask, support for Universal Control on the iPad for those running the macOS 12.3 beta, brand new emoji, a new Apple Wallet widget, and tons more. In this hands-on video walkthrough, we take a look at over 40 new iOS 15.4 changes and features. Be sure to subscribe to 9to5mac on YouTube for more hands-on videos. Some of my favorite gear M4 Mac mini The M4 Mac mini is pound-for-pound the best value in Mac computers in Apple's history. Table of contentsWhat’s new in iOS 15.4 and iPadOS 15.4?Universal Control support (00:12)Dynamic volume controls on iPads (01:38)Keyboard brightness control toggle (2:44)iPadOS Notes preferences corner gestures (3:46)Green wallpaper for iPhone 13 and iPhone 13 ProNew American Siri voiceNew anti-stalking warning messages during AirTag setup processUpdated Find My “Me” tabSeparate Tracking Notifications and Find My Notifications preferencesImproved Find My alertsEmoji 14.0Support for Face ID while wearing a maskNew authentication screen when invoking Apple Pay before unlockingApple Wallet widgetUpdated Dual SIM Messages app interfaceSeamless Safari Status BarSearch Safari extensionsWebXR experimentsReset Safari experimental featuresiOS 15.4 stops iCloud Keychain from saving passwords without usernamesAdd notes to keychain passwordsRun Shortcuts Automations without notificationsTighter SharePlay integrationTV app Up Next Display preferencesNew Custom Email Domain UI in iCloud settingsiCloud Mail preferences consolidationNotes and Reminders get Live Text integrationMagnifier app updatesApple Music playlists now display name of playlist in top barMusic app Quick Action shortcutsApple Music SharePlay shortcutWhat’s New in Apple Podcasts splash screenFilter podcasts that you subscribe to by episodesBrowse podcasts that you subscribe to by seasonsScheduled summary weekly notification averageConfigure App Store notificationsUpdated Shortcuts app system iconsUpdated Top Stories layout in Stocks app Updated AirPods statusNew AirPods Pro accessibility glyphUpdated AirPlay icons for Roku devicesVisual Lookup available in more countries like Germany, Italy, Spain, etc.9to5Mac’s Take Video: iOS 15.4 changes and features for iPhone and iPad Subscribe to 9to5mac on YouTube for more videos What’s new in iOS 15.4 and iPadOS 15.4? Universal Control support (00:12) After initially being unveiled at WWDC 2021, Universal Control, the feature that lets you control multiple iPads and Macs from a single input source, finally arrives in iOS 15.4. Keep in mind that you’ll also need to be running macOS 12.3 or higher to get Universal Control working. Be sure to watch my full hands-on Universal Control tutorial as I showcase everything about this exciting new feature. Dynamic volume controls on iPads (01:38) Like the 6th-generation iPad mini, other iPads running iPadOS 15.4 can now take advantage of dynamically changing volume buttons based on device orientation. Keyboard brightness control toggle (2:44) If you’re a Magic Keyboard user, you might appreciate a new toggle in iPadOS 15 that lets you adjust keyboard backlight brightness via Control Center. Keep in mind that you’ll need to be in a dark or dimly-lit environment before the keyboard backlight – and thus the toggle – becomes active. Some of my favorite gear Apple Polishing Cloth Jeff's favorite screen cleaning cloth that polishes to a shine. iPadOS Notes preferences corner gestures (3:46) Replicating already-present functionality in Settings → General → Gestures, users can now change corner gesture settings directly from the Notes app preferences. In iOS 15.4, it’s also possible to invoke a corner gesture from either the bottom-right or left corner and use it to take a screenshot or start a Quick Note. Green wallpaper for iPhone 13 and iPhone 13 Pro As it normally does for new hardware releases, Apple includes a new wallpaper to match the just-launched green iPhone 13 and iPhone 13 Pro models. New American Siri voice American Siri voice users will find a new voice simply entitled American (Voice 5). The new voice can be configured in Settings → Siri & Search → Siri Voice. You can hear an example of the new Siri voice here. New anti-stalking warning messages during AirTag setup process Apple has taken measures to address AirTag stalking with a new anti-stalking warning that appears during the initial AirTag setup process. The new warning is there to inform would-be stalkers about potential legal and criminal ramifications from stalking. Some of my favorite gear AirPods Pro 2 Jeff Benjamin's favorite wireless earbuds; they just keep getting better. Updated Find My “Me” tab Alongside new anti-stalking measures is a slightly revamped Me tab in the Find My app. The updated Me tab eschews the Item Safety Alerts toggle for direct links to Find My notifications preferences. Separate Tracking Notifications and Find My Notifications preferences Apple has broken out Find My notifications into two different categories in iOS 15.4. You can find separate Tracking Notifications and Find My panels in Settings → Notifications. Improved Find My alerts Less ambiguous Find My alerts are also featured in iOS 15.4, with specific details on the types of devices that may be following you. For instance, if an unknown pair of AirPods Pro is detected as “moving with you,” the alert will clearly state “AirPods Pro Detected” rather than a vague “Unknown Accessory Detected.” Emoji 14.0 A considerable amount of new emoji characters make their debut in iOS 15.4, including a new melting face and troll emoji. In total, there are over 37 new emoji characters to choose from. Some of my favorite gear Whoosh! Screen Cleaner Jeff Benjamin's favorite screen cleaner for Apple products. Support for Face ID while wearing a mask Just in time for dwindling mask mandates, Apple has finally added direct support for Face ID while wearing a mask. The new iOS 15.4 feature, which doesn’t require an Apple Watch, lets users unlock their iPhones and even use authentication with third-party apps while wearing a mask. To learn more about Face ID unlock with a mask, be sure to watch our in-depth walkthrough with the feature. New authentication screen when invoking Apple Pay before unlocking If you invoke Apple Pay by double-pressing your iPhone’s Side button prior to unlocking, you’ll be met with a new authentication screen that’s devoid of any personal information. Apple Wallet widget You’ll find a new Apple Wallet widget in iOS 15.4 that’s exclusive to Apple Card users. The new 2×2 widget allows you to display your card balance and available balance on a weekly, monthly, or yearly period. Updated Dual SIM Messages app interface If you’re a dual SIM user, switching between phone numbers in the Messages app just became a little less cumbersome. When reengaging a new or established conversation, you can now directly select the phone number you wish to use directly from the conversation screen. Seamless Safari Status Bar iOS 15.4 fixes a bug with Safari that would cause a break in the full bleed status bar area. Search Safari extensions You can now search through installed extensions directly from Safari. Simply tap the ‘aA’ button in the address bar and select Manage Extensions. You’ll now see a search box at the top of the Manage Extensions interface. WebXR experiments Safari in iOS 15.4 now includes support for WebXR experiments, which are disabled by default. By visiting Settings → Safari → Advanced → Experimental Features, you’ll find the following new switches: WebXR Augmented Reality ModuleWebXR Device APIWebXR Gamepads ModuleWebXR Hand Input Module WebXR Device API is a Web API that describes support for accessing AR and VR devices. With the rumors that Apple is knee-deep in the development of its own headset, it’s no surprise that we’re seeing glimpses of features like these. Reset Safari experimental features Now, it’s easy to revert back to stock Safari settings after toggling the numerous experimental settings. iOS 15.4 stops iCloud Keychain from saving passwords without usernames A new provision to prevent iCloud Keychain from saving passwords without usernames is present in iOS 15.4. When creating a new password, and Safari isn’t sure which user name that password belongs to, you’ll see a popup asking you to enter the user name for your account on that specific website. Add notes to keychain passwords Like other passwords managers, such as 1Password, it’s now possible to add notes to the passwords in your keychain. You can even perform searches on the contents of the notes in Settings → Passwords. Run Shortcuts Automations without notifications Prior to iOS 15.4, you would always receive a banner notification when a shortcut automation ran. Now users have the option of disabling these notifications, providing a more seamless experience with shortcut automations. Tighter SharePlay integration SharePlay-enabled apps can now display a SharePlay button within the Share Sheet to make it easier to start a SharePlay session. TV app Up Next Display preferences The Up Next panel that appears at the top of the TV app’s Watch now Page can now be customized to display poster artwork or a still frame. New Custom Email Domain UI in iCloud settings Apple’s new Custom Email Domain support – which was revealed at WWDC 2021 – is somewhat integrated into iOS starting with iOS 15.4. Previously, you’ve been able to set up custom email domains only via iCloud.com, and while iCloud.com is still a requirement, you can now start the process of adding a custom domain directly from iOS’ iCloud Mail preferences. iCloud Mail preferences consolidation iCloud Mail now gains its own full panel within iCloud preferences and consolidates all related settings into a single area. Notes and Reminders get Live Text integration You can now capture Live Text directly into note or reminder via the new Scan Text feature in the stock Notes app or Reminders app. Magnifier app updates New UI tweaks for invoking the camera within the Magnifier app are now present in iOS 15.4. You now have the option of switching between the front-facing camera, ultra wide angle for up close shots, or automatic mode that will switch between the appropriate camera dynamically. Apple Music playlists now display name of playlist in top bar When scrolling down on a Playlist within Apple Music, the name of the playlist is now displayed in the top bar. Music app Quick Action shortcuts A pair of new Quick Action shortcuts are now available for the Music app in iOS 15.4. Long-pressing on the Music app icon now reveals a new Play Most Recent shortcut and a new Play My Station shortcut. Apple Music SharePlay shortcut A new SharePlay shortcut is now included in the Music app when long-pressing on a song or album or when utilizing context menus. What’s New in Apple Podcasts splash screen The stock Podcasts app includes a new splash screen previewing the new filter and browse by season changes in iOS 15.4. Filter podcasts that you subscribe to by episodes When you visit the main page for a podcast that you subscribe to, you’ll now see a handy filter button that lets you filter the podcast by unplayed or downloaded episodes. Browse podcasts that you subscribe to by seasons The Podcasts app now allows you to filter podcasts that you subscribe to by seasons. Scheduled summary weekly notification average Instead of a daily notification average in Settings → Notifications → Scheduled Summary, iOS 15.4 now features weekly notification averages. Configure App Store notifications Tapping your avatar in the upper right-hand corner of the App Store app will reveal a new Notifications panel in iOS 15.4. Inside that panel, you’ll find the ability to toggle notifications for New Features & Updates and Recommendations & Offers. Updated Shortcuts app system icons The Shortcuts app gains lots of new tweaked system icons for things like URL encode, X-Callback URL, etc. Updated Top Stories layout in Stocks app A modified Top Stories layout in the stocks app includes increased padding between stories, bylines, and a context menu to easily save or share a story. Updated AirPods status The AirPods status screen that appears when you open your AirPods charging case next to your iPhone features several subtle UI tweaks. New AirPods Pro accessibility glyph Instead of a generic pair of headphones, the AirPods accessibility panel includes an AirPods Pro glyph. Updated AirPlay icons for Roku devices AirPlay 2-enabled Roku devices received an updated AirPlay icon when managing destinations within Control Center. Visual Lookup available in more countries like Germany, Italy, Spain, etc. The Siri-powered visual lookup feature, which lets you quickly gain info on things like flowers, animals, etc., is now available in more countries in iOS 15.4. 9to5Mac’s Take iOS 15.4 is the biggest iOS 15 update since the initial release debuted last September. Features like new emoji, Universal Control, and Face ID with mask support might garner the headlines, but there are many, many smaller quality of life enhancements that are now available in iOS 15.4. Of course, that doesn’t include the behind the scenes bug fixes, which are also a huge reason to upgrade. What’s your favorite new iOS 15.4 feature? Sound off down below in the comments with your thoughts. Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know w'''
