he main ‘Meet iPhone 16e’ video. Which for some reason I don’t quite understand features a blue inflatable guy dancing with the new iPhone. Overall, I think Apple’s new iPhone 16e ads do a good job of hitting on the features that its target market will care about. It truly is a solid option for users who don’t want to buy another iPhone for a long time. What do you think of the new iPhone 16e videos? Let us know in the comments. Best iPhone accessories Anker 100W charging brick for fast charging MagSafe Car Mount for iPhone HomeKit smart plug 4-pack AirPods Pro 2 (now only $199, down from $249) 10-year AirTag battery case 2-pack Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides iPhone 16E Author Ryan Christoffel iryantldr Ryan got his start in journalism as an Editor at MacStories, where he worked for four years covering Apple news, writing app reviews, and more. For two years he co-hosted the Adapt podcast on Relay FM, which focused entirely on the iPad. As a result, it should come as no surprise that his favorite Apple