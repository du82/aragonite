full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); Privacy App Store Security Bite Security Bite: Do an app’s privacy labels influence your decision to download it? Arin Waichulis | Mar 1 2025 - 9:56 am PT 14 Comments Apple introduced app privacy labels to help people better understand what data an app may collect, including what data is linked to them or used to track them across the web. When released back in 2020, the labels set a precedent in the industry and were a major first step in raising awareness of privacy-invasive apps. It was now easy for users to compare something like Signal, which collects virtually no data at all, and Facebook Messenger, which gobbles up anything it can use to sell advertising or better its services. The feature set out to help users make informed downloads. However, in recent years, I have seen a growing conversation around whether these entirely self-reported labels located further down on the application’s App Store page still impact the user’s decision before hitting “Get” to install. 9to5Mac Security Bite is exclusively brought to you by Mosyle, the only Apple Unified Platform. Making Apple devices work-ready and enterprise-safe is all we do. Our unique integrated approach to management and security combines state-of-the-art Apple-specific security solutions for fully automated Hardening & Compliance, Next Generation EDR, AI-powered Zero Trust, and exclusive Privilege Management with the most powerful and modern Apple MDM on the market. The result is a totally automated Apple Unified Platform currently trusted by over 45,000 organizations to make millions of Apple devices work-ready with no effort and at an affordable cost. Request your EXTENDED TRIAL today and understand why Mosyle is everything you need to work with Apple. There are three main groups of what Apple calls “privacy nutrition labels”: Data Linked to You: This is data collected by the app and linked to the user’s identity, typically for third-party advertising or personalization. This can include full name, physical address, email address, precise and coarse location, purchase history in the app, browsing history, financial info, and lots more. Apple requires developers to disclose this when the data can be linked back to the user. Data Not Linked to You: This is data collected but not tied back to the user, typically used for analytics to improve the product. Apple requires developers to process data in a way that prevents re-identification, ensuring it cannot be traced back to an individual user. Data Used to Track You: This is collected and used to track users across other apps and websites. Think Google or Meta using a user’s device ID to serve personalized ads across their respective apps. This info can also be sold to data brokers. Top comment by Agent Smith Liked by 2 people Sure do. Tracking is a full stop for me. I’m not interested in installing any app where its primary purpose is to sell my data. Apps which include Data linked to me get me to at least pause and think. If I can’t find a better equivalent than I might only use it once and then delete it. View all comments Public attention around data collection tends to surge when a new blockbuster app raises privacy concerns but quickly fizzles. We saw this with the launch of Threads a few years back when users questioned why its App Store privacy labels included data categories like ‘Health and Fitness’—despite having no obvious need for that type of data. However, in retrospect, this had virtually no effect on the growth of the service. Today, Threads is the number one downloaded social media service on the App Store. Which raises the question: Does an app’s privacy labels influence a user’s decision to download it? A big misconception about Privacy Nutrition Labels is how they’re determined. Apple leaves it up to the developer to accurately determine and declare what the app may collect from its users. While this gives developers flexibility and likely keeps the App Store review process time down, it raises some concerns about transparency and accountability. So, what does this mean for users? Privacy labels are undeniably useful—if you know where to find them and how to interpret them. But just because they’re declared doesn’t necessarily mean they’re being implemented. As Apple continues to position privacy as a core value, the bigger question is how it can work with developers to increase transparency, better communicate data practices, and hold those over-declaring just to cover their assets legally, accountable. I would enjoy hearing other thoughts and opinions on this! Do you look at these before installing? Is there a way Apple can improve further here? Leave a comment below. Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides Privacy Privacy is a growing concern in today's world. F… App Store Security Bite Author Arin Waichulis arinwaichulis Arin Waichulis's favorite gear M2 MacBook Air My laptop! Lightweight. Fast. Seemingly indestructible. 55-inch Stand-Up Desk My current and favorite electric stand-up desk I've tested. The quality is great and the price even more so.'''
