wide lens. Because of this, the camera module is significantly smaller, which probably helped Apple put a bigger battery in the iPhone 16e. iPhone 16e uses the same system based on low-voltage electric current to remove and replace the internal battery, which makes the process much easier and safer. Interestingly, the teardown shows that the battery has 4005 mAh of capacity – more than was previously reported by some YouTubers. For comparison, the iPhone 16 battery has 3561 mAh. When it comes to the Face ID module, it’s pretty much identical to the one in the iPhone 14 as the new iPhone 16e features a notch instead of the Dynamic Island. The teardown also shows the C1 chip, Apple’s first 5G modem. It combines 4 nanometer baseband technology with 7 nanometer transceiver technology. As previously revealed by a lab test, the new modem is much more efficient and uses less power than the Qualcomm modems in other iPhones. You can watch the full teardown below: iPhone 16e starts at $599 for the 128GB version. Alternatively, you can buy other iPhone models at a discount. Read also Best deals on Apple products iPhone 16e vs 14 Pro: Upgrade or downgrade? Apple explains why MagSafe’s removal from iPhone 16e isn’t a problem There’s a fun hidden message in the official iPhone 16 wallpapers Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: 