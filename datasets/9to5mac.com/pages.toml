full_description = "iOS 18 Reminders Apple Calendar iOS 18 gave Apple Calendar the feature I’ve always wanted, and it doesn’t disappoint Ryan Christoffel 24 hours ago 19 Comments After years going mostly unchanged, Apple’s Calendar app has started improving quickly over the last few months. And there’s one recent feature in particular that I’ve long wanted, and it’s made a big difference for me: integrating Reminders with the Calendar app. Expand Expanding Close Messages Your iPhone now lets apps send you ‘Critical Messages’ via SMS Ryan Christoffel Feb 28 2025 - 12:52 pm PT 5 Comments There’s a new Priority Notifications feature in iOS 18.4 to ensure important messages and alerts get prominent Lock Screen placement. But a different feature entirely was added in a recent iOS update—‘Critical Messages’—that enables apps to send your iPhone highly important messages via SMS. Here’s how it works. Expand Expanding Close Apple TV You can get Apple TV+ completely free, here’s how Ryan Christoffel Feb 28 2025 - 12:28 pm PT 4 Comments Apple TV+ is currently airing Severance season two, a hit that’s even surpassed Ted Lasso in viewer numbers. But if you haven’t yet tried Apple’s streaming service, there are a variety of ways to access Apple TV+ completely free—from trials and free periods to ongoing subscriptions. Here’s how. Expand Expanding Close iPhone 16E New iPhone 16e videos dub it ‘future proof,’ one camera is ‘all you need’ Ryan Christoffel Feb 28 2025 - 10:41 am PT 5 Comments Apple has released some of the first video ads for the iPhone 16e on its release day, including six new shorts plus a traditional video ad. The videos hit on a variety of talking points and feature promotions, but all seemingly supporting a single message: the iPhone 16e is the best iPhone for the average person. Expand Expanding Close Apple Watch Environment New lawsuit alleges Apple Watch carbon neutral claims are ‘false and misleading’ [U] Ryan Christoffel Feb 28 2025 - 8:45 am PT 36 Comments Apple has a big goal of making all its products carbon neutral by 2030. But the company is now being sued over claims that its first such product to hit that goal—Apple Watch—isn’t actually as carbon neutral as Apple says. Here’s what you should know about the new Apple Watch carbon neutral lawsuit. Updated 2/28 11:45 a.m. ET to include Apple’s statement in response below. Expand Expanding Close"
