title = "Your iPhone now lets apps send you ‘Critical Messages’ via SMS - 9to5Mac"
description = "Your iPhone now offers support for a Critical Messages feature that allows apps to send you SMS messages in very specific situations."
full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); Messages Your iPhone now lets apps send you ‘Critical Messages’ via SMS Ryan Christoffel | Feb 28 2025 - 12:52 pm PT 5 Comments There’s a new Priority Notifications feature in iOS 18.4 to ensure important messages and alerts get prominent Lock Screen placement. But a different feature entirely was added in a recent iOS update—‘Critical Messages’—that enables apps to send your iPhone highly important messages via SMS. Here’s how it works. New messaging feature involves very specific parameters to prevent spam With an iPhone update over the last few months, Apple has given developers a new capability to send SMS alerts to users. But it’s only intended for very specific and ‘critical’ situations. Here’s the description from Apple’s documentation: The Critical Messaging API provides a way for apps to deliver critical messages to a set of phone numbers. This can serve a number of purposes. For example, if an enterprise wants to receive check-ins from employees working in hazardous or rural environments, being able to automatically message a corporate check-in point may help check the safety of those employees without disrupting their work, or if the employee is unable to access or unlock their iPhone. Since this feature could potentially be abused by some developers, there are very specific conditions Apple has set to ensure that Critical Messages doesn’t lead to spamming users with advertising or other unwanted alerts. For example, Apple specifies: “You may not use the Critical Messaging API for sending unsolicited messages or for phishing or spamming, including but not limited to engaging in any types of activities that violate anti-spamming laws and regulations, or that are otherwise improper, inappropriate, or illegal.“ From a user’s standpoint, it’s unlikely you’ll receive Critical Messages often. Similar to the existing Critical-level notifications, they’re expected to be rarely deployed only for very important, time-sensitive notices. If you do find yourself receiving Critical Messages you don’t want, there’s an opt-out option in iOS that can be applied to individual apps. To opt out, simply open your iPhone’s Settings app, then go to Privacy & Security ⇾ Critical Messages. Any apps that have requested permission to send these types of messages will appear here and can be disabled. What do you think of the iPhone’s Critical Messages feature? Let us know in the comments. Best iPhone accessories AirPods Pro 2 (now only $199, down from $249) 10-year AirTag battery case 2-pack Anker 100W charging brick for fast charging MagSafe Car Mount for iPhone HomeKit smart plug 4-pack Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos