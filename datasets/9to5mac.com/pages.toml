your ideas A “much higher quality camera” for shooting videos “All the editing tools you’d expect” Ability to share drafts with friends and other creators Easy export to Instagram, and powerful insights for Reels content Based on screenshots, Instagram Edits will let users crop videos, combine multiple clips, add sounds and voiceover, create subtitles, and much more. The app will also have options to record videos directly from it, with resolution, frame rate, and color profile settings. Meta says Edits will let users export videos to other platforms with no watermark. Coincidentally or not, Edits was announced on the same day that TikTok and CapCut were banned in the US. Given that Instagram has the Reels platform that competes directly with TikTok when it comes to short vertical videos, it’s no surprise to see the Meta investing in its own video editor. Edits will be released first for iPhone, with the version set to be released “soon after.” Read also WhatsApp begins rolling out chat themes to everyone Threads now lets users share their custom feeds with others The return of ‘OG Facebook’ is a big Meta priority this year Telegram adds AI-powered sticker search and improved video player ChatGPT integration in WhatsApp now supports images and voice messages Best deals on Apple products Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e v