full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); AAPL Company Environment Apple commits to being 100% carbon neutral for entire supply-chain by 2030 Ben Lovejoy | Jul 21 2020 - 5:10 am PT 0 Comments Apple’s own operations have been 100% carbon neutral for more than two years, and received a UN award for this, but the company has today made a bold commitment for the same to be true of its entire supply-chain by 2030. The company is promoting this on its homepage, calling it ‘a planet-size plan.’ Apple started working on greening its supply-chain back in 2015, and VP Lisa Jackson provided an update last year. The company said its commitment includes boosting its use of recycled materials and recycling of discarded products so that carbon neutrality applies to the complete life-cycle of all Apple products … Apple laid out a 10-year road-map. Apple today unveiled its plan to become carbon neutral across its entire business, manufacturing supply chain, and product life cycle by 2030. The company is already carbon neutral today for its global corporate operations, and this new commitment means that by 2030, every Apple device sold will have net zero climate impact. Apple’s 10-year roadmap will lower emissions with a series of innovative actions, including: Low carbon product design: Apple will continue to increase the use of low carbon and recycled materials in its products, innovate in product recycling, and design products to be as energy efficient as possible […] Expanding energy efficiency: Apple will identify new ways to lower energy use at its corporate facilities and help its supply chain make the same transition […] Renewable energy: Apple will remain at 100 percent renewable energy for its operations — focusing on creating new projects and moving its entire supply chain to clean power […] Process and material innovations: Apple will tackle emissions through technological improvements to processes and materials needed for its products […] Carbon removal: Apple is investing in forests and other nature-based solutions around the world to remove carbon from the atmosphere. The iPhone maker provides specifics for each of these, stating what has been achieved to date on the environmental front, and what it has planned. For example, for low carbon product design: Apple’s latest recycling innovation — a robot the company is calling “Dave” — disassembles the Taptic Engine from iPhone to better recover key materials such as rare earth magnets and tungsten while also enabling recovery of steel, the next step following its line of “Daisy” iPhone disassembly robots. The company’s Material Recovery Lab in Austin, Texas, which is focused on innovative electronics recycling technology, is now partnering with Carnegie Mellon University to further develop engineering solutions. All iPhone, iPad, Mac, and Apple Watch devices released in the past year are made with recycled content, including 100 percent recycled rare earth elements in the iPhone Taptic Engine — a first for Apple and for any smartphone. Apple decreased its carbon footprint by 4.3 million metric tons in 2019 through design and recycled content innovations in its products. Over the past 11 years, Apple has reduced the average energy needed for product use by 73 percent. The company does admit that carbon removal programs will form part of how it will become 100% carbon neutral, which is not the same as not generating it in the first place, but it’s still a huge commitment – and one that Apple helps will inspire others. “Businesses have a profound opportunity to help build a more sustainable future, one born of our common concern for the planet we share,” said Tim Cook, Apple’s CEO. “The innovations powering our environmental journey are not only good for the planet — they’ve helped us make our products more energy efficient and bring new sources of clean energy online around the world. Climate action can be the foundation for a new era of innovative potential, job creation, and durable economic growth. With our commitment to carbon neutrality, we hope to be a ripple in the pond that creates a much larger change.” The company’s environment microsite has links to the detailed plan. It’s also promoted with a powerful new video, below. Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Guides AAPL Company Breaking news from Cupertino. We’ll give you t… Environment Author Ben Lovejoy benlovejoy Ben Lovejoy is a British technology writer and EU Editor for 9to5Mac. He’s known for his op-eds and diary pieces, exploring his experience of Apple products over time, for a more rounded review. He also writes fiction, with two technothriller novels, a couple of SF shorts and a rom-com! Ben Lovejoy's favorite gear Dell 49-inch curved monitor'''
