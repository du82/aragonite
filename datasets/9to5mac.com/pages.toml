["https://9to5mac.com/2021/12/14/ios-15-2-changes-features-whats-new-video"]
title = "iOS 15.2 changes and features – A great end-of-year update for iPhone and iPad [Video] - 9to5Mac"
description = "A hands-on look at iOS 15.2 changes and features. New updates include App Privacy Report, Hide My Email updates, Auto Macro switch, and more."
full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); iOS iPadOS iOS 15.2 iOS 15.2 changes and features – A great end-of-year update for iPhone and iPad [Video] Jeff Benjamin | Dec 14 2021 - 12:48 pm PT 0 Comments Yesterday Apple released another feature-filled update for iPhone and iPads in the form of iOS 15.2 and iPadOS 15.2. In beta since the later part of October, iOS 15.2 comes bundled with numerous enhancements, headlined by features like App Privacy Report, which first came on the radar back at WWDC 2021. In addition to App Privacy Report, there and many more changes and features to be found in iOS 15.2. Users can look forward to an updated Mail app with integrated Hide My Email, the implementation of Digital Legacy Contacts, Apple Music Voice Plan, and a whole lot more. Watch our hands-on video walkthrough of iOS 15.2 for the details. Some of my favorite gear Apple Polishing Cloth Jeff's favorite screen cleaning cloth that polishes to a shine. What’s new in iOS 15.2? iOS 15.2 is a significant update to iOS 15, which brings several new key features to the table. Let’s have a look at each feature and what they entail. App Privacy Report App Privacy Report lets users see how often apps use the permissions that you grant them. Permissions include access to sensitive areas like camera and microphone, location, media library contacts, etc. The report also includes data on the network activity of the apps you have installed on your device. Video: iOS 15.2 changes and features Subscribe to 9to5mac on YouTube for more videos In total, App Privacy Report provides data on four key areas related to privacy: Some of my favorite gear Whoosh! Screen Cleaner Jeff Benjamin's favorite screen cleaner for Apple products. Data and Sensor AccessApp Network ActivityWebsite Network ActivityMost Contacted Domains App Privacy Report can be accessed via Settings → Privacy → App Privacy Report. Once enabled, data is logged immediately and will be stored for up to seven days. If you disable App Privacy Report, logged data will be purged. Although App Privacy Report doesn’t provide every detail on how apps use your data, it is a great resource for monitoring how apps behave on a high level. Hopefully, Apple will continue to build out the App Privacy Report to include more data logging capability and access to even more network and sensor data. Legacy Contact Much of life in the 21st century involves digital items that, although largely intangible, can be very valuable to those closest to us. This data may include photos, messages, notes, files, apps, backups, etc. What will happen to this data after you die? That’s not a question that most of us like to dwell on, but it’s an important question that Apple is seeking to help users answer with the implementation of its new Legacy Contact feature. Some of my favorite gear M4 Mac mini The M4 Mac mini is pound-for-pound the best value in Mac computers in Apple's history. Legacy Contact can be found in Settings → Apple ID, iCloud, Media & Purchases → Password & Security → Legacy Contact. There, you can add a legacy contact – someone you trust to have access to your data after you die. It’s important that users are proactive in establishing legacy contacts before death, because these contacts will need to be pre-approved by the user by means of an access key. Establishing the Legacy Contact is relatively trivial, as you can see in our hands-on video walkthrough above, but it must be done beforehand. Only at death will a legacy contact be able to request the data of a loved one via Apple’s Digital Legacy portal. Apple requires both the access key and a valid death certificate before approving requests. When requests are approved, the legacy contact will receive a special Apple ID that can be used to access your account. The deceased person’s Apple ID will then be disabled, as will Activation Lock on any devices linked to the deceased’s Apple ID. Legacy contact access is available for a limited time of three years after approval. Afterward, the data will be permanently deleted. For more details on Legacy Contacts, view Apple’s Legacy Contact support page. Some of my favorite gear AirPods Pro 2 Jeff Benjamin's favorite wireless earbuds; they just keep getting better. Hide My Email updates One of the more useful features in iOS 15.2 is an update to the default Mail app to include Hide My Email functionality. An iCloud+ feature, Hide My Email lets you create anonymous random email addresses that forward to your real email address in order to preserve your privacy. In previous versions of iOS, users were limited to establishing Hide My Email addresses via Sign In with Apple, via the Hide My Email preference panel in iCloud settings, and via Safari when creating a new login. In iOS 15.2, Apple takes the next logical step with Hide My Email, allowing users to create new addresses on the fly directly inside the default Mail app. Tapping the From: field will reveal a new Hide My Email option, which will create a new random anonymous iCloud address that forwards to your real address. Hide My Email addresses created in the default Mail app are linked directly to the recipient selected in the To: field. As such, Hide My Email is only supported when sending mail to a single recipient. Once a link is established, every time you use Hide My Email to send an email to that specific email address, the same randomly-generated email address will be used. If you’d like to generate a new address when sending to a specific email, you’ll need to venture into Settings → Apple ID, iCloud, Media & Purchases → iCloud → Hide My Email, to delete the email address and create a new randomly-generated address. Music app playlist song search iOS 15.2 brings about the super-handy ability to search within a playlist. Simply swipe up to the top of the page when viewing a playlist to reveal an inline search option. Thanks to iOS 15.2, it’s now easy to find a specific song within a playlist, even if the playlist includes dozens of tracks. Night Mode indicator for photos A more information-dense Info pane in the Photos app, which debuted in iOS 15, has been updated to include additional details on photos taken using Night mode. In iOS 15.2, you’ll now see a Night mode indicator, along with the Night mode exposure time. Emergency SOS updates Emergency SOS is the iOS feature that automatically contacts emergency services in your area when invoked. One of the primary benefits of the feature is that it can be activated discretely while your iPhone is still in your pocket. A few updates to the wording of the Emergency SOS settings can be found in Apple’s latest iOS update, but the most noticeable change in iOS 15.2 is the additional three seconds added to the countdown timer. When invoking Emergency SOS in iOS 15.2, either via pressing and holding the volume + Side button for five seconds or by pressing the Side button five times in quick succession, the countdown timer will now begin counting down from eight seconds instead of five seconds. This increase in countdown time may reduce the occurrences where users accidentally contact emergency service personnel due to a false alarm. iPhone 13 Pro Macro Control switch Auto Macro, which switches to the ultra wide camera to take up close photography on the iPhone 13 Pro, is invoked automatically when you move close to a subject. In previous versions of iOS 15, there was no way to disable this automatic switching, but iOS 15.2 addresses the complaints generated by this feature. A new Macro Control switch found in Settings → Camera, allows users to display a button within the Camera app interface to disable macro mode. Users also have the option of preserving the Auto Macro settings in Settings → Camera → Preserve Settings. Limit IP Tracking switch A new Limit IP Address Tracking option can be found within Cellular settings in iOS 15.2. Limit IP address Tracking will hide your IP address from known trackers in Mail and within Safari. Take note that this feature is not the same as iCloud Private Relay, which aims to protect all unencrypted Internet traffic. Limit IP address Tracking can be enabled separately from that iCloud Private Relay, but if you disable Limit IP address Tracking, iCloud Private Relay will be disabled for that individual connection as well. iPhone parts and service history If you’ve received service on your iPhone, you can now view the service history in iOS 15.2 by visiting Settings → General → About. There, you’ll find a Parts and Service History heading that includes details on battery, display, and camera replacements for iPhone 12 and iPhone 13. Older models may only show battery or display replacement details. The update will also indicate whether or not a genuine Apple part was used and allow you to see when service was performed. Visit Apple’s iPhone parts and service history support page for more details. Apple Music Voice Plan Although my attempts to test it have proved fruitless thus far, Apple officially launched its new Apple Music Voice Plan yesterday alongside iOS 15.2. The new $4.99 plan gives users a cheaper way to access Apple Music, but you’re limited to interfacing with the service using Siri. iPadOS 15.2 updates In addition to the aforementioned changes and features, the iPad gets a few new features of its own in iPadOS 15.2. TV app users will appreciate the newly-redesigned TV app, which features a collapsable side bar with links to your media library, Apple TV+ content, and even direct store links to purchase Movies and TV shows. iPadOS 15.2 receives a multitasking UI update, which brings forth an updated Multitasking menu button. This button makes it apparent that Split View windows can occupy either side of the display. Finally, a new addition to iPadOS gestures allows users to invoke screenshots of Quick Notes from the bottom left-hand corner of the display. Previously, this gesture was only available to use from the bottom right-hand corner. 9to5Mac’s Take iOS 15.2 is a big new update that almost all users will find some value in. Along with the features and changes, there are several noteworthy bug fixes Apple ProRAW photos, HomeKit and CarPlay, video streaming, and more. You can view the full set of release notes for iOS 15.2 on Apple’s iOS 15 Updates page. What’s your favorite new feature found in iOS 15.2? Sound off in the comments below with your thoughts. Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 Some of my favorite gear AirPods Pro 2 Jeff Benjamin's favorite wireless earbuds; they just keep getting better. Some of my favorite gear Whoosh! Screen Cleaner Jeff Benjamin's favorite screen cleaner for Apple products. Some of my favorite gear Apple Polishing Cloth Jeff's favorite screen cleaning cloth that polishes to a shine. Some of my favorite gear M4 Mac mini The M4 Mac mini is pound-for-pound the best value in Mac computers in Apple's history. Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Guides iOS iOS is Apple's mobile operating system that runs… iPadOS iPadOS is the operating system for Apple's iPad.… iOS 15.2 Author Jeff Benjamin Jeff Benjamin Jeff is the head of video content production for 9to5. He initially joined 9to5Mac in 2016, producing videos, walkthroughs, how-tos, written tutorials, and reviews. He takes pride in explaining things simply, clearly, and concisely. Jeff’s videos have been watched hundreds of millions of times by people seeking to learn more about today’s tech. Subscribe to 9to5Mac on YouTube to catch Jeff’s latest videos. Jeff Benjamin's favorite gear AirPods Pro 2 Jeff Benjamin's favorite wireless earbuds; they just keep getting better. M4 Mac mini The M4 Mac mini is pound-for-pound the best value in Mac computers in Apple's history.'''
