full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); Deals 9to5Toys 9to5Toys Lunch Break Deals: Best price ever on AirTags from $16 each, official Apple Watch Solo Loops from $15, Alpine Loop $45, MacBooks, more Justin Kahn | Feb 28 2025 - 8:45 am PT 0 Comments While we are still tracking a host of big-time deals on major Apple releases, including the latest Apple Watch Series 10, Apple Pencil Pro, M3 MacBook Air configurations at up to $420 off the original prices, and more, today’s deals are largely focused on big-time accessory offers. Firstly, the 4-pack of AirTags has now dropped to its best price ever at $64.50 (that’s $16 per AirTag). Next we move over to official Apple Watch bands – the Solo and Braided Solo Loops are now starting from $15 (that’s over 70% off) while the army green-style Alpine Loop is seeing a massive 55% price drop at $45. You’ll also find some M4 MacBook Pro deals and more awaiting below in today’s 9to5Toys Lunch Break. Heads up! Apple’s AirTag 4-pack just dropped again to the best price ever at the $64.50 all-time low ($16 each) Amazon has now dropped Apple’s 4-pack of AirTags down to its very best price ever. Regularly $99, you can now score four of them for $64.49 shipped – that’s 35% off and a new Amazon all-time low to deliver a price at just over $16 per AirTag. While Amazon still has its single AirTag listing down from $29 to $22.99 (within a few bucks of the lowest price to date), the 4-pack has never sold for any less than this. In fact, we have never tracked the 4-pack down this low from any retailer ever outside of some extremely limited YMMV deals that very few folks would have had a shot at. Black Friday sales at the end of 2024 had this bundle package going for $69, for the record. All things considered, at just over $16 per AirTag here, you’re looking at prices much closer to a third-party Find My tag from a budget brand. However, Apple’s AirTag remain atop the list of the best item trackers out there to this day. They also just received a notable software update in the form of the new “Share Item Location” feature – it allows users to enlist the help of trusted friends and businesses (like approved airlines) to track down their misplaced AirTag (and the gear it is attached to). The complete details on this are waiting for you over at 9to5Mac. AirTag 2 is expected to be launching at some point this year with better range and an improved ultrawide band chip, which is quite possibly the reason we are seeing such a fantastic deal here today. But the AirTag on sale right now remains the best in the business and there’s no denying the price tag here at just over $16 a pop. Hello! Massive deals now live on official Apple Watch Solo/Braided Loops from just $15 Prime shipped (Orig. up to $99) Woot has now re-stocked its deals on the official Apple Solo Loops and Braided Solo Loops. Originally $49 and $99, respectively, you’re looking at up to 70% price drops to mark a return of the lowest cash deals we have tracked on these bands, outside of a limited bundle offer. The silicone Solo Loops are now starting at $19.99 and the braided models are listed at $29.99, both free Prime shipping (a $67 delivery fee will apply otherwise). That said, new Woot customers can take an additional $5 off these bands using code APPLEFIVE at check out right now – even if you aren’t a new customer give the code a try anyway. After going over the terms and conditions on the bonus coupon offer, it doesn’t seem to explicitly say anything about new or returning customers, so you’ll want to give the code a shot either way. The price even without it is already rock-bottom so it’s not a huge deal, but at $15 and $25 a pop here, we are talking about the lowest prices we have ever tracked. You will find a giant selection of colors available on these official Apple Solo Loops, ranging through shades of greens and blues as well as reds, oranges, yellows, and more neutral options – black, gray, tan, and so on. We are also noticing that Woot’s stock of size optionson many of these bands has been refreshed, but with prices like this you’ll want to get in there as soon as possible if you’re interested. Score a massive 55% price drop on the green Apple Watch Ultra Alpine Loop at $45 (Orig. $99, small) Samsung’s 43-inch M7 4K Smart Monitor with hub and onboard streaming is Mac mini ready, just dropped an additional $50 to $350 (Reg. $500) Apple’s upgraded 1TB M4 MacBook Pro is up to $210 off today, 512GB model still down at $1,399 While the major $200 price drop on the entry-level M4 MacBook Pro are still live on both colors at $1,399, we are also tracking the upgraded 1TB model starting from $1,589 shipped right now. This is a regularly $1,799 configuration that is now up to $210 off – the 16GB/1TB model is Space Black is still at the $1,589 Amazon all-time low, and it has just dropped the silver model back to its best price at $1,599 shipped. But how does this deal price compare to the more powerful M4 Pro machines? While we have seen the 24GB/512GB M4 Pro model as low as $1,699 in the past, that was indeed a doorbuster offer and it hasn’t dropped below $1,749 since – it is currently on sale for $1,779 at Amazon. That leaves the aforementioned entry-level M4 MacBook Pro as the closest option in terms of price and specs. Again, it all goes back to how much you value the internal storage upgrade here. Is double the storage worth spending an extra $190 for you? For me it isn’t, and in this case I would go with the sweet deal still live on the 16GB/512GB M4 model at $1,399 instead, but some folks like to have the expanded storage capacity built-in and the price is right here as far as Apple’s internal SSD options go. Apple 15-inch 16GB M3 MacBook Air with upgraded SSD now even lower at $1,279 ($420 off original price), more from $899 Launch deal now live on Journey’s new leather Apple Find My Key Organizer tool with box cutter at 20% off Belkin’s Apple MagSafe Duo-style 2-in-1 15W MagSafe charger now seeing a major 40% price drop Today’s accessories and charging deals: This braided 140W USB-C to MagSafe 3 cable costs 59% less than Apple’s, grab it on sale for $20 Twelve South’s chrome silver BookArc Flex MacBook stand just hit the $36 Amazon low Make your monitor lightweight and easy to adjust with this gas-spring arm at $27 (Reg. $45) This adjustable acrylic laptop stand neatly stows your MacBook and saves desk space down at just $10 today (50% off) Anker’s regularly $130 3-in-1 wireless charging stand powers your iPhone, AirPods, and Apple Watch down at $70 low today This 15-foot surge protector gets 15 power sources across a room for $18 (Reg. $25) New meross Smart Thermostat with Matter sees 30% markdown at Amazon, now $70 Current-gen Bose QuietComfort ANC headphones now $100 off in 24-hr. flash sale Official M4 iPad Pro Magic Keyboards now up to $114 off (Best Buy open-box, full Apple warranty) Apple Pencil Pro holiday pricing now live again at Amazon, grab one for $99 (Nearly 25% off) Just about every Apple Watch Series 10 config is now back at Black Friday pricing from $329 Best Buy launches Travel Tech sale: iPad 10 $279, AirPods Max USB-C, Beats, and more Level’s ultra-discreet Apple/Google Home smart Lock Connect bundle is now $249 in all colors (Up to $100 off) Nomad launches official overstock sale at up to 50% off: iPhone 16 cases, Apple Watch bands, accessories, more from $13 While we did happen to coincidentally spot some of these deals popping yesterday (that is what we do after all), Nomad has now officially launched a wide-ranging overstock sale featuring a number of its newer releases for iPhone 16 alongside some bundle offers that combine its wonderful MagSafe chargers with its premium cables and wall chargers too. Head below for a closer look. Again we already detailed some of these deals yesterday, and we will leave you with links to those posts for additional insight on the value there, but there are plenty more now going live in the official Nomad overstock section of the site. Nomad’s latest 15W metal Base One Max Charging Hub now at $128 Up to 40% off Nomad iPhone 16 cases and Apple Watch bands Here are the details from Nomad on the standout deals – you’ll find some new bundle options up top followed but a selection of one-off deals on Apple Watch Bands, iPhone 16 cases, charging gear, and more: Bundle offers: 65W Adapter & Universal Cable $51 (Additional 20% off) 30W Adapter & Base One Max Carbide $132 (Additional 20% off) More featured deals: Sport Case – iPhone 16 Pro Max | Naval Blue $30 (40% off) Sport Band – 46mm/49mm | Black $48 (20% off) Modern Band – 46mm/49mm | Silver Hardware | Black | Horween $64 (20% off) Base One Max – MagSafe Carbide 2nd Gen $128 (15% off) AC Adapter – 30W | Carbide $21 (30% off) USB C Cable – 0.3M | USB-C | Kevlar | V2 $13 (50% off) And even more… All of these items might be temporarily sitting in the brand’s Overstock section, but they all still come with the full warranty and are eligible for returns if needs be. More of the latest from Nomad: Nomad launches new upgraded 240W USB-C ChargeKey with 10Gbps data transfers at $25 – hands-on impressions Nomad’s new limited run Glow in the Dark Icy Blue Apple Watch band now up for purchase Finally! Nomad unleashes new magnetic Leather Folio covers for Apple’s M4 iPad Pro Nomad turns up the heat with new vibrant Magma iPhone 16 case and Apple Watch band Tested: Nomad’s hybrid Active Band Pro – the perfect combination of real leather and rubber for Apple Watch users Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides Deals 9to5Toys 9to5Toys Lunch Break Author Justin Kahn justinkahnmusic Justin is a senior editor covering all things music for 9to5Mac, including our weekly Logic Pros series exploring music production on Mac and iOS devices. Justin is an audio engineer/producer with over 10 years experience in the music industry. Justin Kahn's favorite gear Bose QuietComfort Ultra Wireless Earbuds Apple Watch Ultra 2'''
