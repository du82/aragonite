und the operating system: https://twitter.com/stroughtonsmith/status/1135653636145590273 At this point, it’s unclear if Apple has any further plans to expand support for mouse input in iPadOS 13. At this point, it’s clearly meant as an Accessibility feature, but you could theoretically use it if you wanted to give the iPad a laptop-like feel. What do you think of this feature? Let us know down in the comments. Read our news hub to see a full recap of everything Apple announced at its Worldwide Developers Conference keynote this afternoon. Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Subscribe to 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Guides iPadOS 13 iPadOS 13 was announced at WWDC 2019, and it wil… Author Chance Miller chancehmiller Chance is the editor-in-chief of 9to5Mac, overseeing the entire site’s operations. He also hosts the 9to5Mac Daily and 9to5Mac Happy Hour podcasts. You can send tips, questions, and typos to chance@9to5mac.com.'''
