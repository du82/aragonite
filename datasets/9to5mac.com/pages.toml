["https://9to5mac.com/2025/02/27/neural-openai-announces-gpt-4-5-chatgpts-largest-and-best-model-for-chat"]
title = "Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat - 9to5Mac"
description = "Welcome to Neural. AI moves fast. We help you keep up. OpenAI has officially unveiled GPT-4.5, the latest version of the fastest ChatGPT..."
full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall | Feb 27 2025 - 7:15 pm PT 2 Comments Welcome to Neural. AI moves fast. We help you keep up. OpenAI has officially unveiled GPT-4.5, the latest version of the fastest ChatGPT model. While GPT-4.5 excels in a number of areas including accuracy and emotional intelligence, OpenAI emphasizes that GPT-4.5 is not its most advanced model for now. GPT-4.5 is smarter, warmer, and not yet available for everyone OpenAI knows that its various models and model names are confusing. GPT-4.5 isn’t here to help. In fact, while GPT-4.5 is the newest model release, OpenAI says that its o3 reasoning model remains its most powerful. It describes GPT-4.5 as a research preview and not a frontier model. Later this year, OpenAI expects to introduce GPT-5 as a single that handles quick chat requests and more intensive reasoning requests without switching models. For now, GPT-4.5 is here to replace GPT-4o with more accuracy, fewer hallucinations, and higher emotional intelligence. The latter quality is something for which Anthropic’s Claude chatbot has been praised compared to ChatGPT’s less natural responses. For example, GPT-4.5 may invite users to continue a conversation rather than simply provide detailed information as a response. The new model is also more succinct and conversational, according to OpenAI. Starting today, GPT-4.5 is available to Pro subscribers in the $200/month plan, but the new model is coming to more users starting next year. OpenAI says it will start rolling out GPT-4.5 to ChatGPT Plus ($20/month) and Team subscribers next week, followed by Enterprise and Edu users the following week. Watch the 13-minute livestream reveal below: For a deeper dive, you can read OpenAI’s 30-page system card on GPT-4.5 here. Beyond OpenAI While OpenAI continues to forge ahead, former key players at OpenAI that left the company have founded new startups that are raising money and building new AI tools. Mira Murati, the former Chief Technology Officer at OpenAI, recently announced her AI startup called Thinking Machines Lab. Murati has brought along more than 30 experts from OpenAI, Meta, and Google DeepMind. Co-founder Lilian Weng previously served as Vice President of AI safety and robotics as well as applied research at OpenAI. John Schulman, another OpenAI co-founder, joined Thinking Machines from Anthropic where he served as a researcher. Thinking Machines Lab is focused on multimodal AI models and products that are accessible with practical applications. Here’s how Thinking Machines Lab describes its focus in part: While AI capabilities have advanced dramatically, key gaps remain. The scientific community’s understanding of frontier AI systems lags behind rapidly advancing capabilities. Knowledge of how these systems are trained is concentrated within the top research labs, limiting both the public discourse on AI and people’s abilities to use AI effectively. And, despite their potential, these systems remain difficult for people to customize to their specific needs and values. To bridge the gaps, we’re building Thinking Machines Lab to make AI systems more widely understood, customizable and generally capable. […] Emphasis on human-AI collaboration. Instead of focusing solely on making fully autonomous AI systems, we are excited to build multimodal systems that work with people collaboratively. More flexible, adaptable, and personalized AI systems. We see enormous potential for AI to help in every field of work. While current systems excel at programming and mathematics, we’re building AI that can adapt to the full spectrum of human expertise and enable a broader spectrum of applications. The company is seeking to raise $1 billion at a $9 billion valuation, according to Business Insider. Ilya Sutskever, former OpenAI chief scientist, co-founded another AI startup called Safe Superintelligence with ex-OpenAI researcher Daniel Levy and former Apple AI projects lead Daniel Gross. Here’s how SSI explains its purpose: Building safe superintelligence (SSI) is the most important technical problem of our​​ time. We have started the world’s first straight-shot SSI lab, with one goal and one product: a safe superintelligence. It’s called Safe Superintelligence Inc. SSI is our mission, our name, and our entire product roadmap, because it is our sole focus. Our team, investors, and business model are all aligned to achieve SSI. We approach safety and capabilities in tandem, as technical problems to be solved through revolutionary engineering and scientific breakthroughs. We plan to advance capabilities as fast as possible while making sure our safety always remains ahead. This way, we can scale in peace. SSI raised its first $1 billion in September 2024. More recently, SSI has reportedly been seeking an additional $1 billion at a $30 billion market valuation. A third AI startup from a former OpenAI veteran to have on your radar is Eureka Labs, which is creating an AI-native educational platform. Former OpenAI research scientist and founding member Andrej Karpathy has been building Eureka Labs since 2024. He currently served as director of AI at Tesla. The startup announced its mission and first product-in-development in July 2024: We are Eureka Labs and we are building a new kind of school that is AI native. How can we approach an ideal experience for learning something new? For example, in the case of physics one could imagine working through very high quality course materials together with Feynman, who is there to guide you every step of the way. Unfortunately, subject matter experts who are deeply passionate, great at teaching, infinitely patient and fluent in all of the world’s languages are also very scarce and cannot personally tutor all 8 billion of us on demand. However, with recent progress in generative AI, this learning experience feels tractable. The teacher still designs the course materials, but they are supported, leveraged and scaled with an AI Teaching Assistant who is optimized to help guide the students through them. This Teacher + AI symbiosis could run an entire curriculum of courses on a common platform. If we are successful, it will be easy for anyone to learn anything, expanding education in both reach (a large number of people learning something) and extent (any one person learning a large amount of subjects, beyond what may be possible today unassisted). Our first product will be the world’s obviously best AI course, LLM101n. This is an undergraduate-level class that guides the student through training their own AI, very similar to a smaller version of the AI Teaching Assistant itself. The course materials will be available online, but we also plan to run both digital and physical cohorts of people going through it together. Today, we are heads down building LLM101n, but we look forward to a future where AI is a key technology for increasing human potential. More to come for Eureka Labs. In the meantime, Karpathy regularly shares his knowledge in course-length videos on YouTube: Meta is making a standalone AI app Lastly, Meta is reportedly developing a standalone AI app that will debut as soon as Q2 this year. CNBC reports: The company intends to debut a Meta AI standalone app during the second quarter, according to people familiar with the matter. It marks a major step in Meta CEO Mark Zuckerberg’s plans to make his company the leader in artificial intelligence by the end of the year, ahead of competitors such as OpenAI and Alphabet, said the people, who asked not to be named because the project is confidential. News of Meta possibly focusing its AI efforts into a standalone app and not just inside of Facebook and WhatsApp prompted OpenAI’s Sam Altman to quip on X, “ok fine maybe we’ll do a social app.” lol if facebook tries to come at us and we just uno reverse them it would be so funny 🤣— Sam Altman (@sama) February 27, 2025 More on the latest in AI developments in the next edition of Neural — only on 9to5Mac! Read the previous issue here. Best Apple accessories Wireless CarPlay adapter iPhone MagSafe battery USB-C iPhone charger Apple AirTag AirPods 4 AirPods Pro 2 Apple Pencil Pro Follow Zac Hall on X, and listen to Runtime with co-host Sophia Tung on Apple Podcasts and YouTube. Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides News Author Zac Hall apollozac Zac covers Apple news, hosts the 9to5Mac Happy Hour podcast, and created SpaceExplored.com.'''
