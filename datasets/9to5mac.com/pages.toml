full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); iPad EU will force Apple to add app sideloading, alternative browser engine support to iPad Benjamin Mayo | Apr 29 2024 - 3:10 am PT 40 Comments The last few months have seen Apple rapidly implement technical and policy solutions to comply with the Digital Markets Act. That has seen the rollout of things like alternative app marketplaces, web distribution, alternative browsers, and more as part of iOS 17.4 and iOS 17.5 updates. So far, those rules have only applied to the iPhone and iOS. But now, the European Commission has expanded the Digital Markets Act’s purview of products to include the iPad (via Bloomberg). Right now, support for things like the App Store’s alternative commission structure and app sideloading are only available to iPhone customers in the European Union. Following the European Union’s announcement, Apple has approximately six months to bring iPadOS and the iPad into compliance. Top comment by S. Jobs Liked by 3 people Interesting... lots of people thought the iPad and other iDevices were already included in the original adjustment made by Apple because of the DMA. View all comments That will likely mean all the same changes we have seen Apple apply to the iPhone in the EU will now also apply to the iPad. For example, iPad users will be able to download apps from alternative app stores (like AltStore) and have the opportunity to use an alternative browser and browser engine. Apple’s implementation of the DMA rules as it applies to the iPhone remains under review. Companies like Spotify have complained that Apple has made adoption unfeasible due to obstacles like the Core Technology Fee, which enforces a per-install per-year fee for apps distributed outside Apple’s App Store, under the alternative business terms. If Apple is found not to be in compliance, the EU can fine the company up to 10% of its annual global revenue. Follow Benjamin: @bzamayo on Threads and Twitter. Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides iPad Apple's tablet debuted in 2010. Since the origin… Author Benjamin Mayo bzamayo Benjamin develops iOS apps professionally and covers Apple news and rumors for 9to5Mac. Listen to Benjamin, every week, on the Happy Hour podcast. Check out his personal blog. Message Benjamin over email or Twitter. Benjamin Mayo's favorite gear Philips Hue Lights The easiest way to get into HomeKit and Apple smart home tech. Great for gifts. iPhone Wireless Charger Inexpensive, fast, wireless charger for iPhone.'''
