description = "In addition to widgets on the home screen and new multitasking, iPadOS 15 enhances the Files app with a progress bar, NTFS support, and more."
full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); iPadOS iPadOS 15 Files app on iPadOS 15 now has a progress bar, partial NTFS support, more Filipe Espósito | Jun 14 2021 - 5:35 pm PT 0 Comments It’s been a week since Apple introduced iOS 15 and iPadOS 15 at WWDC 2021, but we’re still discovering some new features that weren’t mentioned on stage or on Apple’s website. In addition to having widgets on the home screen and new multitasking shortcuts, iPadOS 15 enhances the Files app with a progress bar, NTFS support, and more. Now when you’re copying a file in Apple’s Files app, there’s finally a progress bar to indicate the remaining time and how much data has already been copied. A progress indicator icon appears right next to the create new folder button, and users can cancel ongoing tasks from there. This alone would be a great improvement for iPad users as previously there was no way to see the progress of such tasks in the Files app, but there’s even more. If you plug an NTFS-formatted USB stick into the iPad, it can now be read by the Files app. It’s worth noting that this is only partial support, just like on the Mac, so you’ll only get the read-only mode without being able to add files to the USB storage. Still, much better than not even being able to see the files on an NTFS flash drive as in iPadOS 14. For those who have a mouse or trackpad paired to the iPad, iPadOS 15 enables the selection of multiple files at once with the cursor, so you no longer have to select one file at a time in order to copy, move, or share them. Unfortunately, at least in beta 1, the Files app still lacks the ability to check folder sizes or open DMG files, which are features requested by many iPad users. iPadOS 15 beta is currently available for developers, while a public beta release will be available in July. The update is expected to be officially released to the public this fall. H/T Steven Fjordstrom Read also: iPadOS 15 for iPad brings with home screen widgets, multitasking updates, and moreiPadOS 15 coming to all iPads supported by iPadOS 14 this fall, here’s the full listiPadOS 15 enables iPhone apps in landscape mode for iPad usersTranslate app coming to iPadOS 15 with system-wide translationsiPadOS 15 and macOS Monterey bring Low Power Mode to iPad and Mac, here’s how to enable it Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Guides iPadOS iPadOS is the operating system for Apple's iPad.… iPadOS 15 Author Filipe Espósito https://www.threads.net/filipe.esposito Filipe Espósito is a Brazilian tech Journalist who started covering Apple news on iHelp BR with some exclusive scoops — including the reveal of the new Apple Watch Series 5 models in titanium and ceramic. He joined 9to5Mac to share even more tech news around the world.'''
