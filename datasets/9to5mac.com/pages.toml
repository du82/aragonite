in a separate section on the Lock Screen, so you can catch up on what you may have missed. You can still swipe up to view all notifications. Basically, your iPhone uses on-device intelligence to analyze the importance of various notifications, and puts ones deemed especially important into a new section that sits atop your other notifications. Normally, iOS sorts notifications based on how new they are, with the most recent alerts right at the top. But with Prioritize Notifications enabled, the most important alerts are shown first regardless of how long ago you received them. If you’ve used the new Mail app’s priority mail feature, where certain messages deemed important are elevated to the top of your inbox—Priority Notifications basically works just like that. Are you going to enable Priority Notifications in iOS 18.4? Why or why not? Let us know in the comments. Best iPhone accessories AirPods Pro 2 (now only $199, down from $249) 10-year AirTag battery case 2-pack Anker 100W charging brick for fast charging MagSafe Car Mount for iPhone HomeKit smart plug 4-pack Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to