d display for additional screen space. Refer to one app while you work in another, or see how a presentation looks in presentation mode on your iPad while editing it on your Mac. Mirrored desktop: Mirror the screen on your Mac to have two screens displaying the same content, making it perfect for sharing with others. Draw and sketch in apps: Use the precision and intuitiveness of Apple Pencil with your favorite creative Mac apps. Draw and write naturally, edit a photo or graphic, and use it to point and click as you do with a mouse. Sidecar can be used wired or wirelessly within 10 meters of your Mac, and supports the iPad’s normal array of multi-touch gestures and new additions introduced with iPadOS. It also includes Continuity support for Markup and sketching: Continuity Markup: Write and sketch on PDFs or mark up your documents with Apple Pencil. See the updates live on your Mac as you mark them up on your iPad. Continuity Sketch: Create a sketch on your iPad using Apple Pencil and easily insert it into any document on your Mac. One of the most novel features in Sidecar is a software sidebar that will appear on your iPad for common macOS shortcuts and popular tools. Apps that use the MacBook Pro’s Touch Bar will also be supported: Sidebar: Get easy access to your most commonly used controls from the sidebar. Use modifier keys to enable shortcuts in pro apps, and access buttons that allow you to undo as well as display or hide the menu bar, Dock, and keyboard. While the main features of Sidecar will work out of the box on day one, developers can add special support for Sidecar that enables the full feature set, like pressure sensitivity and tilt support for Apple Pencil. Apple says the following apps have confirmed support for Sidecar: Adobe: After Effects, Illustrator, Premiere Pro Affinity Designer & Affinity Photo Cinema 4D CorelDRAW DaVinci Resolve Final Cut Pro & Motion Maya Painter Principle Sketch Substance Designer & Painter ZBrush You can learn more about Sidecar on Apple’s website, and check out our News Hub for everything announced at WWDC 2019. Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Guides WWDC 2019 "Write code. Blow minds." Apple's Worldwide Dev… Sidecar Author Michael Steeber ‪MichaelSteeber‬ Michael is a Creative Editor who covered Apple Retail and design on 9to5Mac. His stories highlighted the work of talented artists, designers, and customers through a unique lens of architecture, creativity, and community. Contact Michael on Twitter to share Apple Retail, design, and history stories: @MichaelSteeber'''
