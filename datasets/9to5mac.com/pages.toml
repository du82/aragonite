e 14 USB-C European Union iPhone 14 and iPhone SE no longer available in most EU countries Filipe Espósito Dec 27 2024 - 3:22 pm PT 11 Comments As previously reported, Apple will no longer sell the iPhone 14 and iPhone SE in the European Union due to local legislation that requires all smartphones sold there to have a USB-C port. After removing these models from the online store in some countries such as Switzerland, Apple has now ended sales of the iPhone 14 and SE in most EU countries. Expand Expanding Close"
