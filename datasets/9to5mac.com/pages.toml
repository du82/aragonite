e crease. When unfolded, this display will apparently be around 20 inches or so. Gurman describes it as a “single, uninterrupted piece of glass.” It’s also described as a “higher-end device.” Apple appears to be focusing its foldable strategy on creating much larger screens that fit in your backpack, rather than offering a suboptimal tablet experience for your pocket. When addressing the operating system, Gurman suggests that the product will likely run a version of iPadOS. However, there’s one interesting detail here: I don’t believe it will be a true iPad-Mac hybrid, but the device will have elements of both. By the time 2028 rolls around, iPadOS should be advanced enough to run macOS apps … It’s unclear whether or not this is just speculation from Gurman, but the possibility of running Mac apps on this foldable iPad (and potentially other iPads as well) is quite exciting! As for foldable iPhones, the company is exploring the idea, though we might not see it until 2026 at the absolute earliest. Follow Michael: X/Twitter, Bluesky, Instagram Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more 