rt AVIF at all, but they do. Apple implemented support for AVIF image files in Safari in iOS 16, over two years ago. For whatever reason, they just haven’t gotten around to supporting it in iMessage, even though the AVIF files are visible to users. There’s just no way to properly view them. This experience is weird, and I sincerely hope Apple gets around to fixing it soon. AVIFs are supported in Safari and Photos, so there’s nothing stopping users from sending them on iMessage. They’ll never render properly, and you end up in a weird situation where you sent an image that isn’t viewable. It’s annoying. My favorite iPhone accessories on Amazon: ESR MagSafe Wallet with Kickstand, Grip, and Find My support Anker MagSafe 2-in-1 Wireless Charging Stand with Qi2 UGREEN 6.6ft braided USB-C charging cables, 2-pack AirPods Pro 2 (USB-C) Follow Michael: X/Twitter, Bluesky, Instagram Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides iMessage iMessage is a free, secure messaging platform fo… Author Michael Burkhardt mbrkhrdt Michael