e a helpful way for me to stay on top of various home tasks and work priorities. Before iOS 18, if I wanted to understand what a given day’s schedule looked like, I would have to open both the Calendar app and Reminders. Looking at Calendar alone wasn’t enough, because then I’d miss out on important scheduled work throughout my day. But now I can see it all in just one place. All of my scheduled reminders are listed in-line chronologically with calendar events, so with a quick glance at the Calendar app I have an instant understanding of what my full day’s going to look like. The only drawback: you can’t currently enable only certain Reminders lists inside the Calendar app. You have to show either all scheduled reminders (regardless of list), or disable reminders entirely. That limitation aside, merging Reminders with Calendar has been a fantastic change that’s made a big difference in my daily use. Do you use Reminders inside Apple’s Calendar app too? Why or why not? Let us know in the comments. Best iPhone accessories Anker 100W charging brick for fast charging MagSafe Car Mount for iPhone HomeKit smart plug 4-pack AirPods Pro 2 (now only $199, down from $249) 10-year AirTag battery case 2-pack Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety 