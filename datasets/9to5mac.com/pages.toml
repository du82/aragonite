full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); iPhone 16 Visual Intelligence Visual Intelligence in iOS 18.2 will unlock new iPhone 16 powers Ryan Christoffel | Oct 1 2024 - 8:53 am PT 16 Comments Apple’s iPhone 16 line is getting an exclusive and powerful new feature later this year—likely in iOS 18.2. It uses the A18 chip, Camera Control, and smarts from Apple, ChatGPT, and Google to unlock a fresh way of interacting with the world. Here’s everything you should know about visual intelligence. New camera feature will be exclusive to iPhone 16 line Every year when a new iPhone is unveiled, Apple puts a major spotlight on camera upgrades. With the iPhone 16, a big part of the camera pitch had to do with Camera Control. All iPhone 16 models feature a new physical button with touch controls for controlling the Camera app. Camera Control does a lot already, but soon it will gain even more power thanks to the addition of visual intelligence. Here’s how Apple describes what’s coming: Later this year, Camera Control will unlock visual intelligence to help users learn about objects and places faster than ever before. Users can click and hold Camera Control to pull up the hours or ratings for a restaurant they pass, add an event from a flyer to their calendar, quickly identify a dog by breed, and more. Camera Control will also serve as a gateway into third-party tools with specific domain expertise, like when users want to search on Google to find where they can buy an item, or to benefit from ChatGPT’s problem-solving skills. Users are in control of when third-party tools are used and what information is shared. How Visual Intelligence features will work After visual intelligence arrives, you’ll be able to long-press Camera Control to load the Camera app in a special mode. In this mode, similar to Google Lens, your iPhone 16’s camera will be able to recognize objects in the world, and provide information and actions related to them. So to summarize what Apple shared above, here’s what visual intelligence will make possible. Three main examples so far include pointing the camera at: a restaurant to view its Maps listing an event flyer to add it to your calendar a dog to identify its breed But there’s more. The above examples are using Apple’s own resources to power visual intelligence. But the company is also partnering with OpenAI and Google to enable even more capabilities. So if you’re shopping somewhere and want to pull up an item online, Google might get involved. Or if your subject necessitates problem-solving powers, ChatGPT can come to assistance. Similar to when ChatGPT gets fully integrated with Siri, it appears these third-party data sources may prompt a permission request before Apple gets them involved. That way, you know exactly what info is being shared at any given time, and with who. There’s also, of course, potential for Apple to expand visual intelligence to offer more capabilities over time. But what the company has shared so far should all be available at launch. When to expect Visual Intelligence to release So far, Apple has only said that visual intelligence is coming to the iPhone 16 “later this year.” However, all signs point to iOS 18.2 as the update that will bring the feature. Apple is close to shipping iOS 18.1 already, and there’s been no trace of visual intelligence in the betas so far. Additionally, the ChatGPT integration required for visual intelligence works a lot like what’s expected for Siri in iOS 18.2. Finally, assuming Apple follows its normal release pattern, iOS 18.2 will be the last big software update of the year. So it’s the last chance, beyond iOS 18.1, for the company to hit its stated target. It’s always possible the feature will get delayed into 2025, but right now an iOS 18.2 arrival in December seems a safe bet. Visual Intelligence wrap-up The iPhone’s camera is about to get more powerful than ever. By building visual intelligence into Camera Control, Apple is elevating the importance of the feature and providing another compelling reason to upgrade to the iPhone 16. It’s unfortunate it wasn’t able to ship last month alongside the iPhone, but I’m excited to try it out soon—hopefully in an iOS 18.2 beta later this month. Are you looking forward to visual intelligence? Why or why not? Let us know in the comments. Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel 