description = "In late 2022, initial payments for the Small Developer Assistance Fund started going out, with each eligible US developer receiving..."
full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); AAPL Company App Store Developers begin receiving final round of Small Developer Assistance Fund payments Michael Burkhardt | Mar 1 2025 - 6:35 am PT 0 Comments In late 2022, initial payments for the Small Developer Assistance Fund started going out, with each eligible US developer receiving at least $1000 – up to 4x the projected minimum payout. A second round of payouts begun toward the end of 2023, and now the third and final round of payments started going out this week. Previous payouts As part of a settlement agreement, Apple established the Small Developer Assistance Fund in 2021. It offered payouts of $250 to $30,000 to any developer who had paid any commission to Apple between June 4, 2015 and April 26, 2021. The total settlement was over $100,000,000, benefiting over 99% of US app developers. The payment tiers broke down as follows: Under $100 in annual App Store proceeds: $250 minimum payout $100-$1,000 in annual App Store proceeds: $500 minimum payout $1,000-$5,000 in annual App Store proceeds: $1,000 minimum payout $5,000-$10,000 in annual App Store proceeds: $1,500 minimum payout $10,000-$50,000 in annual App Store proceeds: $2,000 minimum payout $50,000-$100,000 in annual App Store proceeds: $3,500 minimum payout $100,000-$250,000 in annual App Store proceeds: $5,000 minimum payout $250,000-$500,000 in annual App Store proceeds: $10,000 minimum payout $500,000-$1,000,000 in annual App Store proceeds: $20,000 minimum payout Over $1,000,000 in annual App Store proceeds: $30,000 minimum payout With the initial round of payouts in October 2022, since fewer people filed than anticipated – the payouts ended up being roughly 4x the minimum payout. That means for some developers, the settlement payout exceeded what they actually would’ve earned. For example, developers in the $100-1000 annual income tier received a settlement check exceeding $2000. In late 2023, a second round of payouts went out, distributing any unclaimed funds from developers who were unable to provide a valid tax identification number. That payout was $17 for those who earned under $100, and $34 for those who earned under $1000. If you wish, you can do the math to figure out what that payout meant for each tier. The max payout here was around ~$2040. Final payout Starting this week, developers begun receiving checks, E-MasterCards, and PayPal payments for the third and final payout from the Small Developer Assistance Fund. It was in the amount of $20.19 for those who earned under $100, and $40.39 for those who earned under $1000. That means payouts presumably go as high as ~$2422 for those developers who earned over $1,000,000 a year. So, if you’re an indie app developer who participated in this class action settlement – keep an eye on your mailbox! These checks will be void on April 21st, 2025. My favorite iPhone accessories on Amazon: ESR MagSafe Wallet with Kickstand, Grip, and Find My support Anker MagSafe 2-in-1 Wireless Charging Stand with Qi2 UGREEN 6.6ft braided USB-C charging cables, 2-pack AirPods Pro 2 (USB-C) Follow Michael: X/Twitter, Bluesky, Instagram Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides AAPL Company Breaking news from Cupertino. We’ll give you t… App Store Author Michael Burkhardt mbrkhrdt Michael is 9to5Mac’s Weekend Editor, keeping up with all of the latest Apple news on Saturday and Sunday. He got started in the world of Apple news during the pandemic, and it became a growing hobby. He’s also an indie iOS developer in his free time, and has published numerous apps over the years.'''
