board shortcuts and a download manager. #gallery-1 { margin: auto; } #gallery-1 .gallery-item { float: left; margin-top: 10px; text-align: center; width: 33%; } #gallery-1 img { border: 2px solid #cfcfcf; } #gallery-1 .gallery-caption { margin-left: 0; } /* see gallery_shortcode() in wp-includes/media.php */ Apple is also adding custom font support to iPadOS. You can download font libraries from the App Store. There are new three-finger gestures for cut-copy-paste, including a three-finger swipe to undo. Apple Pencil latency is dropping from 20 milliseconds to 9 milliseconds for even more responsive interactions when using a digital stylus. Markup is integrated system-wide, so you can annotate a screenshot or an entire document. A PencilKit API is available for third-party apps. There’s a new compact layout keyboard mode for the iPad, which shrinks down the keyboard to only occupy a fraction of the screen space. Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Guides News Author Benjamin Mayo bzamayo Benjamin develops iOS apps professionally and covers Apple news and rumors for 9to5Mac. Listen to Benjamin, every week, on the Happy Hour podcast. Check out his personal blog. Message Benjamin over email or Twitter. Benjamin Mayo's favorite gear Philips Hue Lights The easiest way to get into HomeKit and Apple smart home tech. Great for gifts. iPhone Wireless Charger Inexpensive, fast, wireless charger for iPhone.'''
