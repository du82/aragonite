full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); iPad Pro iPadOS Why Slide Over is my favorite iPadOS superpower Ryan Christoffel | Feb 18 2025 - 12:39 pm PT 18 Comments I’ve used an iPad Pro as my primary computer for nearly 10 years. And over that time, iPadOS multitasking features have changed a lot. But there’s one such iPad tool I depend on that’s been around since the start, and only improved with time: Slide Over. The basics of Slide Over in iPadOS Slide Over is one of a variety of multitasking tools Apple has built into iPadOS. It’s the feature that lets you store iPhone-sized apps just off the edge of the screen so you can quickly ‘slide’ them into and out of view. This is different from Split View, where you’re building a fixed setup of two apps side by side. It also differs from Stage Manager, which is arguably the most powerful iPad multitasking feature. Slide Over has changed some over the years, but the current iteration works a lot like your iPhone’s multitasking system. After pulling Slide Over into view (by default it lives off the right edge of the screen), you can swipe up on your Slide Over app to see a multitasking view that looks just like the iPhone’s. It allows you to switch between a stack of different Slide Over apps. Also like the iPhone, you can switch between apps by swiping left and right on the horizontal bar at the bottom of the app. Any apps that you like to pop in and out of quickly, you can add to your Slide Over stack. Slide Over sits atop whatever other app or apps you’re already using, giving you quick access to more apps without altering your main working setup. Slide Over is the best multitasking fit for Apple’s original iPad vision From the start, the iPad was intended as a one-app-at-a-time device. It’s very like the iPhone in that way. Apple’s various multitasking additions over the years have sought to give iPad users more power, but sometimes at the expense of the device’s original, user-friendly design. When it comes to retaining that original iPad vision, Slide Over is easily Apple’s best offering. It lets you continue to keep a single app on screen, plus get the benefit of popping in and out of other apps as needed. For me, I love the improved focus that comes from working in one main app at a time. Usually that’s Ulysses for writing, or Safari for browsing the web. Without disrupting that primary workspace, Slide Over lets me open apps like Files, Slack, Messages, and Reminders all throughout the day to respond to a quick message, upload a file, or check off a task before getting back to my main app. In other words, I get the benefit of the iPad’s original design principle—one app for ultra simplicity and focus—while also enjoying convenient multitasking capabilities. Slide Over on iPad: wrap-up Without Slide Over, working from an iPad would feel a lot more slow and clunky. But with it, I get to enjoy increased focus in my main app while still retaining convenient access to other apps as needed. Slide Over is also, out of Apple’s various multitasking tools, easily the least complex. In large part because it works just like an iPhone—thus following the pattern set by the original iPad. Which iPadOS multitasking features do you use most, and why? Let us know in the comments. Best iPad accessories AirPods Pro 2 (currently just $199, down from $249) 100W USB-C power adapter for fast charging tomtoc Tablet sleeve bag for protection and style Apple Pencil Pro (currently just $99, down from $129) Baseus 10ft USB-C cable for extended reach Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides iPad Pro The new iPad Pro is powered by the A12Z processo… iPadOS iPadOS is the operating system for Apple's iPad.… Author Ryan Christoffel iryantldr Ryan got his start in journalism as an Editor at MacStories, where he worked for four years covering Apple news, writing app reviews, and more. For two years he co-hosted the Adapt podcast on Relay FM, which focused entirely on the iPad. As a result, it should come as no surprise that his favorite Apple device is the iPad Pro.'''
