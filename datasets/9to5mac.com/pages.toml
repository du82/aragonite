full_description = '''// Make sure that nineto5ads exists, it will load ad once google tag exists window.nineto5ads = window.nineto5ads|| []; if (typeof adSizes === 'undefined') { var adSizes = {"leaderboard":{"mobile":[[320,50],[320,100]],"tablet":[[728,90],[320,100]],"desktop":[[970,250],[728,90],[970,70],[970,90]]},"sidebar":{"mobile":[300,250],"desktop":[[300,600],[300,250]]}}; } function getLeaderboardApstagSlotsSizes() { if ( window.innerWidth < 768 ) { return adSizes.leaderboard.mobile; } else if ( window.innerWidth < 1024 ) { return adSizes.leaderboard.tablet; } else { return adSizes.leaderboard.desktop; } } window.nineto5ads.push(function() { apstag.fetchBids({ slots: [{ slotID: "div-gpt-ad-1436850350386-0", slotName: "\/1049447\/9to5mac-Top", sizes: getLeaderboardApstagSlotsSizes() }], timeout: 2e3 }, function(bids) { googletag.display( "div-gpt-ad-1436850350386-0" ); apstag.setDisplayBids(); googletag.pubads().refresh([leaderboardAdSlot]); }); }); AAPL Company Environment Apple 2030 environmental goals: 95% of suppliers now using clean energy Ben Lovejoy | Apr 17 2024 - 5:37 am PT 6 Comments We’ve today received an update on Apple’s 2030 environmental goals, one of which is for the company’s entire supply-chain to be carbon neutral by that date. The company says more than 320 suppliers – representing 95% of the company’s “direct” manufacturing spend – have made the transition to clean energy … Apple 2030 environmental goals Apple’s own operations have been 100% carbon neutral since 2018. In 2020, the company announced “a planet-sized plan” to switch its entire supply chain to clean energy by 2030. Given that the company’s main manufacturing hub is China, which is currently the worst offender in the world for continued dependence on coal-fired plants, that’s no small goal. The company also pledged to match with clean energy the total electricity used by customers to charge their Apple devices. 95% of direct suppliers using clean energy Apple announced today the progress it has made to date. Electricity — both to manufacture Apple products and to charge and power them — makes up the largest portion of Apple’s comprehensive carbon footprint. As part of Apple 2030, the company has called on its global suppliers to use clean electricity and become carbon neutral across all their Apple-related operations. Over 320 suppliers — representing 95 percent of Apple’s direct manufacturing spend — have led the way in the transition so far, resulting in 16.5 gigawatts of renewable energy online in Apple’s supply chain today. This generated over 25.5 million megawatt-hours of clean energy across the supply chain last year, avoiding over 18.5 million metric tons of carbon emissions. It’s not clear from the statement what percentage of the entire supply chain is using clean energy, as the company of course relies on an entire network of companies supplying components to “direct” Apple suppliers. Offsetting electricity used to charge Apple devices The company also provided updates on its latest efforts to generate enough clean energy to offset all the power used to charge Apple devices. In the U.S., Apple is investing in a portfolio of solar projects across Michigan, with construction underway to bring 132 megawatts of clean energy online later this year. In Spain, Apple has partnered with international solar development platform ib vogt on an investment that will generate 105 megawatts of solar power when the project comes online by the end of 2024. Saving and replenishing water Another goal is to reduce water usage in the manufacturing process, and to replenish the clean water used. Apple says it has made significant progress here. Apple also advanced progress toward another ambitious 2030 goal: to replenish 100 percent of the fresh water used in corporate operations in high-stress locations. This includes launching new partnerships to deliver nearly 7 billion gallons in water benefits — from restoring aquifers and rivers, to funding access to drinking water — over the next 20 years. As with clean energy, Apple has extended its commitment to clean water across the entire supply chain: Together, Apple suppliers saved over 12 billion gallons of fresh water last year, for a total of 76 billion gallons in water savings since the company launched its Supplier Clean Water Program in 2013. Photo by Red Zeppelin on Unsplash Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides AAPL Company Breaking news from Cupertino. We’ll give you t… Environment Author Ben Lovejoy benlovejoy Ben Lovejoy is a British technology writer and EU Editor for 9to5Mac. He’s known for his op-eds and diary pieces, exploring his experience of Apple products over time, for a more rounded review. He also writes fiction, with two technothriller novels, a couple of SF shorts and a rom-com! Ben Lovejoy's favorite gear Dell 49-inch curved monitor'''
