full_description = "iOS 18.4 iOS Decoded iOS 18.4 beta 1 – 50 new changes and features [Video] Jeff Benjamin Feb 24 2025 - 8:35 am PT 3 Comments In this latest episode of iOS Decoded, 9to5Mac investigates everything new in iOS 18.4, including several new behind-the-scenes features that you may be hearing about for the first time. Included in our walkthrough is a full hands-on look at the new proximity setup feature for Mac, Prioritize notifications, the new Ambient Music feature, and much, much more. Subscribe to 9to5Mac on YouTube for additional iOS 18.4 coverage. Expand Expanding Close Advanced Data Protection Advanced Data Protection – how it makes your iCloud data more secure [Video] Jeff Benjamin Feb 18 2025 - 10:07 am PT 9 Comments By default, iCloud data is secure while in transit. This data is stored in an encrypted format, while the encryption keys are housed in Apple data centers. 15 particularly sensitive data types, like passwords, Health data, and Journal data, use end-to-end encryption as standard. This sensitive data is encrypted with keys derived from your devices and device passcode, which are only accessible by the end user, and thus this data remains secure even in the case of a data breach in the cloud. Advanced Data Protection, which is opt-in, provides end-to-end encryption for 10 additional iCloud data categories like Photos, Notes, and Reminders, meaning that Apple no longer possesses the keys to decrypt these categories as well. It’s been couple of years since Advanced Data Protection rolled out. Are you using it? If not, should you consider using it? In this full tutorial and video walkthrough, I discuss what Advanced Data Protection is, how to enable it, and best practices for protecting your precious data. Be sure to subscribe to 9to5Mac on YouTube for more in-depth video walkthroughs. Expand Expanding Close 9to5Mac Overtime 9to5Mac Overtime 040: iPhone SE 4 and Apple Intelligence Jeff Benjamin Feb 11 2025 - 12:57 pm PT 0 Comments The iPhone SE 4 is coming soon, and just how important is Apple Intelligence? Fernando and Jeff discuss what its success or failure could mean for the future of Apple. 9to5Mac Overtime is a weekly video-first podcast exploring fun and interesting observations in the Apple ecosystem, featuring 9to5Mac’s Fernando Silva & Jeff Benjamin. Subscribe to Overtime via Apple Podcasts and our YouTube channel for more. Expand Expanding Close"
