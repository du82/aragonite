tdoor setting when the Columbus Blue Jackets host the Detroit Red Wings at Ohio Stadium, the famed football stadium of The Ohio State University. The normal in-game environment – with roaring crowds and lightning-fast speeds – has certain challenges when it comes to communication between officials, and an outdoor environment can be even more challenging. The use of haptic feedback timed with the game clock for NHL Officials is sort of like following a sporting event with a Live Activity on Apple Watch, except it’s actually for your work. Pretty cool. Here’s a look at the NHL Watch Comms app, developed for the NHL by Presidio: Best Apple accessories Wireless CarPlay adapter iPhone MagSafe battery USB-C iPhone charger Apple AirTag AirPods 4 AirPods Pro 2 Apple Pencil Pro Follow Zac Hall on X, and listen to Runtime with co-host Sophia Tung on Apple Podcasts and YouTube. Add 9to5Mac to your Google News feed. FTC: We use income earning auto affiliate links. More.You’re reading 9to5Mac — experts who break news about Apple and its surrounding ecosystem, day after day. Be sure to check out our homepage for all the latest news, and follow 9to5Mac on Twitter, Facebook, and LinkedIn to stay in the loop. Don’t know where to start? Check out our exclusive stories, reviews, how-tos, and subscribe to our YouTube channel Featured from 9to5Mac 9to5Mac Logo Rumor Replay: Foldable iPhone breakthrough, AirTag 2 release date, more Ryan Christoffel Feb 27 2025 Neural: OpenAI announces GPT-4.5, ChatGPT’s largest and best model for chat Zac Hall Feb 27 2025 iPhone 16e vs 14 Pro: Upgrade or downgrade? Ryan Christoffel Feb 27 2025 Apple reveals new child safety features and its approach to age assurance Chance Miller Feb 27 2025 (adsbygoogle = window.adsbygoogle || []).push({}); Check out 9to5Mac on YouTube for more Apple news: Comments Expand Close comments Expand Close comments Guides News Author Zac Hall apollozac Zac covers Apple news, hosts the 9to5Mac Happy Hour podcast, and created Sp