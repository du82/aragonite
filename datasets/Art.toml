["https://www.comuseum.com/painting/masters/shen-zhou/"]
title = "Shen Zhou (沈周, 1427–1509)"
description = "Shen Zhou’s many paintings reveal an active concern with preserving the aesthetic discoveries of bygone ages as well as a similar concern with nature in its many manifestations (especially landscapes). However various in stylistic source and subject matter, Shen Zhou’s art consistently bears his unique touch of an abiding confidence, restrained calmness, and subtle warmth. The ideal of his life and the accomplishments of his art have earned him reverence by all artists devoted to the ideals of the literati (wenren, 文人) tradition. He is regarded as one of the painting elite—“the Four Masters of Ming” (明四家), which also includes Wen Zhengming (文徵明), Tang Yin (唐寅) and Qiu Ying (仇英)."
clearnet = "https://www.comuseum.com/painting/masters/shen-zhou/"
status = "Operational"
category = "art"
