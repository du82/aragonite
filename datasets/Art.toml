["https://www.comuseum.com/painting/masters/zhao-mengfu/"]
title = "Zhao Mengfu (趙孟頫, 1254–1322)"
description = "Zhao Mengfu’s paintings were among the first after the collapse of the Song dynasty and its academy of painting to show an interest derived from subjects and styles of ancient masters. Zhao Mengfu is popularly remembered as a painter of horses in the manner of the Tang dynasty (618–907) master Han Gan (韓幹), but he also painted other animal groups, landscapes, and bamboos. Referring to the antique, he generally avoided superficial beauty by utilizing deliberately simplified color and compositions and a schematic, even childlike, rendering of forms and scale. His works often display a great variety of brushwork. Among his most famous landscape paintings are Autumn Colors on the Que and Hua Mountains"
clearnet = "https://www.comuseum.com/painting/masters/zhao-mengfu/"
status = "Operational"
category = "art"
tags = ["great artists", "13th century artist", "traditional chinese artist", "influential chinese artist", "china art history", "artist"]

