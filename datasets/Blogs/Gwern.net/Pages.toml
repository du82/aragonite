["https://gwern.net/creative-benchmark"]
title = "Towards Benchmarking LLM Diversity & Creativity - Gwern.net"
author = "Gwern Branwen"
description = "Discussion of possible tasks to measure LLM capabilities in soft ‘creative’ tasks like brainstorming or editing, to quantify failures in creative writing domains."
full_description = "ne of the weakest parts of 2024-era LLMs, and where user opinions differ the most from the benchmarks, is anything to do with ‘diversity’ and ‘creativity’. Hardly any benchmark can be said to meaningfully test any sense of those words.It is not a surprise then that R&D doesn’t prioritize that, and users regularly complain that eg. Claude-3 is the LLM they like best, and yet, isn’t always at the top of the benchmarks even for ‘creative’-seeming tasks. Mode collapse is just not measured or punished by existing benchmarks, which consider datapoints in isolation, and ignore individual differences in preferences in favor of maximizing the lowest common denominator of popularity.Oddly, “preference learning” research currently involves no learning of preferences. Few preference learning datasets or research papers attempt to model preferences, and only attempt to predict mass popularity.1 (Those papers which do consider it, tend to dismiss it as noise; for example, the DPO authors measure⁠—on simple summarization tasks—human disagreement rates as high as 35% and infer this justifies using LLM proxies, rather than raising questions about the basic approach of attempting to model ‘the’ human preference.) This has been handsomely rewarded in the mass marketplace (one man’s AI slop is another man’s metric pop), but leaves behind the ‘high end’."
clearnet = "https://gwern.net/creative-benchmark"
