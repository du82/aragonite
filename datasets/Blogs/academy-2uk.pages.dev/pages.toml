XPELLED FROM SPAIN CHAPTER VII CHAPTER VIII CHAPTER IX CHAPTER X CHAPTER XI CHAPTER XII EPISODE 28 -- RETURN TO ROME CHAPTER XIII CHAPTER XIV CHAPTER XV CHAPTER XVI CHAPTER XVII EPISODE 29 -- FLORENCE TO TRIESTE CHAPTER XVIII CHAPTER XIX CHAPTER XX CHAPTER XXI CHAPTER XXII EPISODE 30 -- OLD AGE AND DEATH OF CASANOVA APPENDIX AND SUPPLEMENT PART THE FIRST -- VENICE 1774-1782 I -- CASANOVA’S RETURN TO VENICE II -- RELATIONS WITH THE INQUISITORS III -- FRANCESCA BUSCHINI IV -- PUBLICATIONS V -- MLLE---- X---- . . . C---- . . . V----. . . VI -- LAST DAYS AT VENICE PART THE SECOND -- VIENNA-PARIS I -- 1783-1785 II -- PARIS III -- VIENNA IV -- LETTERS FROM FRANCESCA V -- LAST DAYS AT VIENNA PART THE THIRD -- DUX -- 1786-1798 I -- THE CASTLE AT DUX II -- LETTERS FROM FRANCESCA III -- CORRESPONDENCE AND ACTIVITIES IV -- CORRESPONDENCE WITH JEAN-FERDINAND OPIZ V -- PUBLICATIONS VI -- SUMMARY of MY LIFE VII -- LAST DAYS AT DUX Illustrations Bookcover 1 Titlepage 1 Chapter 4 Chapter 5 Chapter 8 Chapter 9 Chapter 14 Chapter 14b Chapter 17 Chapter 18 Chapter 8 Chapter 9 Chapter 22 Chapter 23 Chapter 5 Chapter 6 Chapter 11 Chapter 12 Chapter 7 Chapter 8 Chapter 16 Chapter 16b Chapter 7 Chapter 8 Chapter 15 Chapter 17 Chapter 7 Chapter 8 Chapter 15 Chapter 16 CASANOVA AT DUX An Unpublished Chapter of History, By Arthur Symons I The Memoirs of Casanova, though they have enjoyed the popularity of a bad reputation, have never had justice done to them by serious students of literature, of life, and of history. One English writer, indeed, Mr. Havelock Ellis, has realised that ‘there are few more delightful books in the world,’ and he has analysed them in an essay on Casanova, published in Affirmations, with extreme care and remarkable subtlety. But this essay stands alone, at all events in English, as an attempt to take Casanova seriously, to show him in his relation to his time, and in his relation to human problems. And yet these Memoirs are perhaps the most valuable document which we possess on the society of the eighteenth century; they are the history of a unique life, a unique personality, one of the greatest of autobiographies; as a record of adventures, they are more entertaining than Gil Blas, or Monte Cristo, or any of the imaginary travels, and escapes, and masquerades in life, which have been written in imitation of them. They tell the story of a man who loved life passionately for its own sake: one to whom woman was, indeed, the most important thing in the world, but to whom nothing in the world was indifferent. The bust which gives us the most lively notion of him shows us a great, vivid, intellectual face, full of fiery energy and calm resource, the face of a thinker and a fighter in one. A scholar, an adventurer, perhaps a Cabalist, a busy stirrer in politics, a gamester, one ‘born for the fairer sex,’ as he tells us, and born also to be a vagabond; this man, who is remembered now for his written account of his own life, was that rarest kind of autobiographer, one who did not live to write, but wrote because he had lived, and when he could live no longer. And his Memoirs take one all over Europe, giving sidelights, all the more valuable in being almost accidental, upon many of the affairs and people most interesting to us during two-thirds of the eighteenth century. Giacomo Casanova was born in Venice, of Spanish and Italian parentage, on April 2, 1725; he died at the Chateau of Dux, in Bohemia, on June 4, 1798. In that lifetime of seventy-three years he travelled, as his Memoirs show us, in Italy, France, Germany, Austria, England, Switzerland, Belgium, Russia, Poland, Spain, Holland, Turkey; he met Voltaire at Ferney, Rousseau at Montmorency, Fontenelle, d’Alembert and Crebillon at Paris, George III. in London, Louis XV. at Fontainebleau, Catherine the Great at St. Petersburg, Benedict XII. at Rome, Joseph II. at Vienna, Frederick the Great at Sans-Souci. Imprisoned by the Inquisitors of State in the Piombi at Venice, he made, in 1755, the most famous escape in history. His Memoirs, as we have them, break off abruptly at the moment when he is expecting a safe conduct, and the permission to return to Venice after twenty years’ wanderings. He did return, as we know from documents in the Venetian archives; he returned as secret agent of the Inquisitors, and remained in their service from 1774 until 1782. At the end of 1782 he left Venice; and next year we find him in Paris, where, in 1784, he met Count Waldstein at the Venetian Ambassador’s, and was invited by him to become his librarian at Dux. He accepted, and for the fourteen remaining years of his life lived at Dux, where he wrote his Memoirs. Casanova died in 1798, but nothing was heard of the Memoirs (which the Prince de Ligne, in his own Memoirs, tells us that Casanova had read to him, and in which he found ‘du dyamatique, de la rapidite, du comique, de la philosophie, des choses neuves, sublimes, inimitables meme’) until the year 1820, when a certain Carlo Angiolini brought to the publishing house of Brockhaus, in Leipzig, a manuscript entitled Histoire de ma vie jusqu a l’an 1797, in the handwriting of Casanova. This manuscript, which I have examined at Leipzig, is written on foolscap paper, rather rough and yellow; it is written on both sides of the page, and in sheets or quires; here and there the paging shows that some pages have been omitted, and in their place are smaller sheets of thinner and whiter paper, all in Casanova’s handsome, unmistakable handwriting. The manuscript is done up in twelve bundles, corresponding with the twelve volumes of the original edition; and only in one place is there a gap. The fourth and fifth chapters of the twelfth volume are missing, as the editor of the original edition points out, adding: ‘It is not probable that these two chapters have been withdrawn from the manuscript of Casanova by a strange hand; everything leads us to believe that the author himself suppressed them, in the intention, no doubt, of re-writing them, but without having found time to do so.’ The manuscript ends abruptly with the year 1774, and not with the year 1797, as the title would lead us to suppose. This manuscript, in its original state, has never been printed. Herr Brockhaus, on obtaining possession of the manuscript, had it translated into German by Wilhelm Schutz, but with many omissions and alterations, and published this translation, volume by volume, from 1822 to 1828, under the title, ‘Aus den Memoiren des Venetianers Jacob Casanova de Seingalt.’ While the German edition was in course of publication, Herr Brockhaus employed a certain Jean Laforgue, a professor of the French language at Dresden, to revise the original manuscript, correcting Casanova’s vigorous, but at times incorrect, and often somewhat Italian, French according to his own notions of elegant writing, suppressing passages which seemed too free-spoken from the point of view of morals and of politics, and altering the names of some of the persons referred to, or replacing those names by initials. This revised text was published in twelve volumes, the first two in 1826, the third and fourth in 1828, the fifth to the eighth in 1832, and the ninth to the twelfth in 1837; the first four bearing the imprint of Brockhaus at Leipzig and Ponthieu et Cie at Paris; the next four the imprint of Heideloff et Campe at Paris; and the last four nothing but ‘A Bruxelles.’ The volumes are all uniform, and were all really printed for the firm of Brockhaus. This, however far from representing the real text, is the only authoritative edition, and my references throughout this article will always be to this edition. In turning over the manuscript at Leipzig, I read some of the suppressed passages, and regretted their suppression; but Herr Brockhaus, the present head of the firm, assured me that they are not really very considerable in number. The damage, however, to the vivacity of the whole narrative, by the persistent alterations of M. Laforgue, is incalculable. I compared many passages, and found scarcely three consecutive sentences untouched. Herr Brockhaus (whose courtesy I cannot sufficiently acknowledge) was kind enough to have a passage copied out for me, which I afterwards read over, and checked word by word. In this passage Casanova says, for instance: ‘Elle venoit presque tous les jours lui faire une belle visite.’ This is altered into: ‘Cependant chaque jour Thérèse venait lui faire une visite.’ Casanova says that some one ‘avoit, comme de raison, forme le projet d’allier Dieu avec le diable.’ This is made to read: ‘Qui, comme de raison, avait saintement forme le projet d’allier les interets du ciel aux oeuvres de ce monde.’ Casanova tells us that Thérèse would not commit a mortal sin ‘pour devenir reine du monde;’ pour une couronne,’ corrects the indefatigable Laforgue. ‘Il ne savoit que lui dire’ becomes ‘Dans cet etat de perplexite;’ and so forth. It must, therefore, be realized that the Memoirs, as we have them, are only a kind of pale tracing of the vivid colours of the original. When Casanova’s Memoirs were first published, doubts were expressed as to their authenticity, first by Ugo Foscolo (in the Westminster Review, 1827), then by Querard, supposed to be an authority in regard to anonymous and pseudonymous writings, finally by Paul Lacroix, ‘le bibliophile Jacob’, who suggested, or rather expressed his ‘certainty,’ that the real author of the Memoirs was Stendhal, whose ‘mind, character, ideas and style’ he seemed to recognise on every page. This theory, as foolish and as unsupported as the Baconian theory of Shakespeare, has been carelessly accepted, or at all events accepted as possible, by many good scholars who have never taken the trouble to look into the matter for themselves. It was finally disproved by a series of articles of Armand Baschet, entitled ‘Preuves curieuses de l’authenticite des Memoires de Jacques Casanova de Seingalt,’ in ‘Le Livre,’ January, February, April and May, 1881; and these proofs were further corroborated by two articles of Alessandro d’Ancona, entitled ‘Un Avventuriere del Secolo XVIII., in the ‘Nuovo Antologia,’ February 1 and August 1, 1882. Baschet had never himself seen the manuscript of the Memoirs, but he had learnt all the facts about it from Messrs. Brockhaus, and he had himself examined the numerous papers relating to Casanova in the Venetian archives. A similar examination was made at the Frari at about the same time by the Abbé Fulin; and I myself, in 1894, not knowing at the time that the discovery had been already made, made it over again for myself. There the arrest of Casanova, his imprisonment in the Piombi, the exact date of his escape, the name of the monk who accompanied him, are all authenticated by documents contained in the ‘riferte’ of the Inquisition of State; there are the bills for the repairs of'
