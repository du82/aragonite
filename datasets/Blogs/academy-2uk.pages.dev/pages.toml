["https://academy-2uk.pages.dev/carthage"]
title = "On Carthage |"
description = "The most underrated part of history"
full_description = '''On Carthage 2024-11-24 The most underrated part of history Carthage | Qart Hadasht | Qart-ḥadašt | 𐤒𐤓𐤕𐤟𐤇𐤃𐤔𐤕 | New City 𐤒 (Q) 𐤓 (R) 𐤕 (T) 𐤟 (word divider) 𐤇 (H) 𐤃 (D) 𐤔 (SH) 𐤕 (T) Almost every written word in their own voice, their music, their stories, their perspectives on themselves and others has been entirely lost. We're left piecing together fragments to glimpse what must have been an extraordinary place. When we cobble together as many existing sources as we possibly can, the image that forms is of a bustling, wealthy, multicultural port city. Think Venice, Amsterdam, or Hong Kong - where wealth, trade, and cultural exchange created a unique urban energy and attitude. Glimpsing an alternate version of antiquity - one centered on trade rather than conquest, on practical innovation rather than philosophical speculation, on multicultural pragmatism rather than cultural imperialism. There really is something spectacular here. Here's a speculative but informed picture of life's rhythm in the new city: During Trade Season (Spring/Summer): Bustling excitement as ships arrived Pride in their naval expertise Young sailors showing off their skills Markets full of exotic goods Wealthy merchants in purple clothes conducting business The sound of multiple languages in the streets Smell of garum and spices from the markets Barbary macaques causing mischief among the crowds. Occassional religious ceremonies for safe voyages. The satisfaction of wealth flowing into the city Rainy Season (Winter): More indoor focused life Satisfaction watching the cisterns fill Appreciation for their engineering as water systems worked Probably some smugness about having better winter preparations than other cities Indoor entertainment, storytelling, music Smaller trade activity but still busy ports Planning for spring ventures Religious festivals to ensure good fortune The Social Atmosphere: Likely a certain arrogance from success (matches descriptions of young men) Pride in their technical achievements Cosmopolitan attitude from extensive trade Conservative older generation (as shown by the Council of 104) Probable tension between traditional values and merchant wealth Strong sense of privacy and discretion about business Religious devotion mixed with practical commerce Multilingual environment with Greek, Punic, and other languages Competition between wealthy families Probably some resentment between merchant class and old nobility Daily Life: Morning markets busy with trade Harbor constantly active Religious observances threading through daily life Wealthy areas probably had a leisurely pace Industrial districts (like the metal works) bustling with activity Cultural sophistication (shown by love of Athenian pottery) Mix of local and foreign fashions Entertainment in the evenings (music we discussed) Likely rivalry between different city districts Pride in their unique identity distinct from Greeks/Romans Overall Theme Phoenician traditional values Merchant wealth and sophistication Naval pride Religious devotion Cultural confidence Technical innovation International trade savvy Technologically innovative (those standardized ship parts, the calcium-enhanced iron, the incredible harbor engineering) Culturally sophisticated (their love of fine Athenian pottery while maintaining their own distinct identity) Remarkably modern in some ways (their banking systems, assembly lines, urban planning) Full of contrasts (conservative council members in their strict political roles while young merchants bragged and raced ships) Deeply practical (using Greek as diplomatic language, their water management) yet also maintaining strong traditions Monkeys played in merchant gardens while serious financial deals were made Ships were mass-produced in the world's first known assembly line Young men showed off dangerous sailing skills then drank from imported Greek vessels Conservative elders in their purple robes managed an empire from a tower in a perfect circular harbor Engineers created innovations in metallurgy and hydraulics that were centuries ahead of their time Multiple languages echoed through markets selling goods from three continents Carthaginian Goods and Services Purple dye (from murex shells - one of their most famous exports) Textiles dyed with their famous purple Ivory (both raw and carved) Gold (from West Africa) Silver (from Spain) Tin (crucial for bronze-making) Copper Lead Iron from Spain Slaves Wild animals for Roman games Grain/wheat (especially from Sicily) Olive oil Wine Garum (fish sauce) Salt Dates Figs Nuts Ceramic goods Glass items Perfumes Incense Spices from trade routes Horses (particularly from North Africa) Timber (especially cedar from Lebanon) Carthaginian metalwork Jewelry Naval technology/shipbuilding expertise Navigational knowledge (they were famously secretive about trade routes) Agricultural knowledge (preserved in Mago's treatise) Mercenary services (they were known for hiring and providing military forces) Banking/financial services (they had sophisticated financial systems) Architectural knowledge (especially regarding water management) Religious practices (cultural exchange with other Mediterranean peoples) Carthaginian furniture (especially wooden luxury items) Wool and wool products Honey Precious stones Ship construction services The Harbor Divided into a military circiular harbor with the Byrsa citadel situated in the middle, and a commercial rectangular harbor, the remarkable double-harbor is the flagship feature of the City of Carthage. The inner harbor could reportedly hold up to 220 ships. It was designed in a way that boats passing by could never quite see what was going on in there, and the commercial harbor had a raising chain and acted as a defensive buffer during times of naval combat. From the Byrsa, the military command had a full 360 view of the surrounding area, could monitor the horizon for incoming trade vessels, weather, and enemy espionage. Trade with Athens The Carthaginians were particularly enthusiastic collectors and importers of high-end Athenian pottery, especially black-figure and later red-figure vases. This taste for Athenian ceramics reveals several interesting aspects about Carthaginian culture: They particularly favored drinking vessels and symposium (drinking party) equipment, suggesting they may have adopted some Greek-style dining/drinking customs among the elite Archaeological evidence shows they were willing to pay premium prices for the finest Athenian pieces Some pieces found in Carthaginian tombs show they valued these vessels enough to include them as grave goods There's evidence that some Athenian potters may have created pieces specifically for the Carthaginian market The trade was substantial enough that it influenced maritime routes, with ships stopping at Carthage on their way to and from other Mediterranean ports This appreciation for Athenian pottery continued even during periods when Carthage was in conflict with Greek cities in Sicily, showing how trade and cultural appreciation could continue even during political tensions. Cisterns built into the walls for rainwater collection The Carthaginians developed an impressive system of rainwater storage by building cisterns directly into their city walls and underneath buildings. These cisterns were lined with waterproof hydraulic cement (a technique they may have developed or refined) to prevent leakage. The system was particularly remarkable because Carthage didn't have natural springs or a river within the city, so water management was crucial. The cisterns collected rainwater that ran down from the Byrsa hill and other elevated areas of the city through a network of channels and pipes. Some of these cisterns were massive - the largest surviving ones from the later Roman rebuilding of Carthage (which likely followed similar principles to the Punic originals) are the Malga Cisterns, which could hold millions of liters of water. While these specific ones are Roman-era, they were probably built on or inspired by earlier Punic engineering principles. The wall-integrated cistern system helped make Carthage extremely resilient to siege warfare, since water supply was often a critical weakness for ancient cities under siege. Industrial Shipbuilding Assembly Lines The Carthaginians developed a remarkably efficient shipbuilding system that used standardized, pre-fabricated parts and an assembly-line approach. Archaeological and textual evidence suggests: They used a system of standardized parts marked with Punic letters/numbers Different teams specialized in creating specific components The process was divided into distinct stages and areas They could reportedly build a warship in 6-8 weeks The circular military harbor had specialized construction/repair stations arranged around it Key innovations: Pre-cut timber pieces stored ready for assembly Standardized keel sections Interchangeable parts Assembly markers to guide construction Division of labor into specialized teams This system allowed them to: Replace damaged ships quickly Maintain quality control Train workers efficiently Scale production up or down as needed Maintain consistent designs Signs of Steel Production 2000 years before the Industrial Revolution The Carthaginians had sophisticated metallurgical techniques, and archaeological evidence from a metalworking district outside the western walls has revealed some interesting innovations: They developed a technique of adding calcium to iron, which appears to have improved the quality of the metal The discovery of specialized blow valves/tuyères (nozzles for forcing air into a furnace) suggests advanced temperature control The industrial suburb shows evidence of organized mass production The location outside the walls was likely chosen for: Fire safety Access to trade routes Wind patterns for the furnaces Space for large operations Military Outsourcing Strategy The shift from citizen soldiers to mercenaries in Carthaginian military organization is a notable part of Carthage's history: Initially: Carthage had a strong citizen militia tradition Upper class citizens served as officers and cavalry Middle class citizens formed heavy infantry The system was similar to other Mediterranean city-states Citizens were expected to provide their own equipment The Change: As Carthage got wealthier through trade, citizens became less interested in military service Merchant class increasingly focused on commerce Began relying more on mercenaries and professional soldiers By the time of the Punic Wars, the citizen militia was mainly just defending the city itself Naval service remained more popular among citizens than land warfare Problems This Caused: Expensive to maintain mercenary armies Loyalty issues (famous mercenary revolt after First Punic War) Loss of military experience among the citizenry Dependency on foreign troops Sometimes mercenaries would switch sides Harder to raise emergency forces when needed The Hannibal Exception: During the Second Punic War, Hannibal managed to inspire more citizen participation His core African troops were more loyal than typical mercenaries But this was more exception than rule Carthaginian Banking and Financial Innovation A system of negotiable instruments similar to checks Letters of credit for international trade Complex accounting systems Investment partnerships for trading ventures Marine insurance concepts Sophisticated contract law Banking families that operated across the Mediterranean Credit networks between merchants Money and Currency: Minted their own coins Used a variety of foreign currencies Had systems for managing exchange rates Developed methods for verifying metal purity Used both precious metals and credit instruments Had standardized weights and measures Sophisticated record-keeping systems Trade Finance: Funded trading expeditions Risk-sharing arrangements Investment pools for large ventures Systems for managing multiple investors Methods for dividing profits Insurance against losses Credit arrangements for merchants State Finance: Complex tax collection system Public treasury management State banking functions Funding for public works Management of war finances International payments systems Sophisticated debt management (as shown by paying off their debt after the punic wars, to which Rome gave them 50 years, and it was paid in 10) Hannibal There were actually mutliple Hannibal's, as evident by the Punic-Sicilian wars that predate the Punic-Romana wars people are more familiar with. "Hannibal" (meaning "Grace of Baal") was actually a fairly common Carthaginian name, particularly among elite families. "Hanni" (grace/favor) "Ba'al" (the god) "Hanni-ba'al bar-kah" with that downward tone on the final 'h' (probably more of a heavy aspirated sound than our modern 'h') would be much closer to how it actually sounded, especially with: The distinct break between "Hanni" and "ba'al" The guttural 'ayin' sound in "ba'al" "bar" meaning "son of" or "of the house of" That characteristic downward inflection on the final aspirated 'h' in "kah" The Most Famous: Hannibal Barca (247-182 BCE) - crossed the Alps, Second Punic War Earlier Hannibals: Hannibal Mago - led forces in Sicily around 410 BCE in wars against Greek cities Hannibal Gisco - commanded in Sicily during First Punic War (died 258 BCE) Several other generals and admirals named Hannibal during the Sicilian campaigns Punic Language Here's what we know about the Punic language (their version of Phoenician): Writing System: Consonantal alphabet (22 letters) Written right to left No written vowels in standard text Later Neo-Punic developed some vowel notation Had both formal and cursive styles Numbers used a decimal system What Survived: Mostly inscriptions on monuments Some grave markers Commercial marks on pottery Religious dedications A few fragments of longer texts Place names that survived in other languages The Poenulus (a play by Plautus with some Punic dialogue) Some agricultural terms through Mago's treatise A few bilingual inscriptions that help translation Sound/Structure: Related to other Semitic languages Had a complex verb system Used prefixes and suffixes extensively Likely had emphatic consonants Probably had similar sounds to Hebrew/Arabic Social Context: Was the administrative language of their empire Used for commerce across Mediterranean Survived Rome's destruction in rural areas Evolved into Neo-Punic Saint Augustine mentioned rural people still speaking it in his time Different dialects existed across their territory Used alongside Greek in diplomacy Many Carthaginians were multilingual Speaking Punic Common Features: Many dental/alveolar consonants (made with tongue against teeth/ridge) Frequent use of sibilants (s, sh, th sounds) Sharp terminal consonants Emphatic consonants (sounds made with constricted throat) Hard stops at word endings Lots of "t" and'''
