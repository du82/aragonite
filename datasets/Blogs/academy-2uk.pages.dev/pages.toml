["https://academy-2uk.pages.dev/about"]
title = "About Me |"
description = "Uncomfortably Honest"
full_description = '''About Me 2024-11-24 Uncomfortably Honest Why I Hate Blogs I hate talkiing in one-direction. I have no idea who is reading this. I have no idea how you'll percieve my words. You'll miss every tone and nuance that would come across very obviously if we were chatting face-to-face. Why I Have a Blog A friend of mine came along one day and said "Hey, you're kind of interesting, you should write your thoughts down". As fucking stupid as I think that is, there is a valid point. Conversation gets lost to the wind, but etching something into stone (or silicon, in this case) does last a lot longer. Flexing I've worked at a decent handful of interesting places. Including: The Federal Reserve, Visa, a couple electric scooter companies, and an instant delivery startup. I've worked on a presidential campaign. I helped out with Twitter BlueSky early on. I've lent a hand to many projects/firms in ways that don't benefit me at all long-term [Including: Android Apps, Fitness Equipment, Health Tech, Small Startups, Obscure Tech Projects, Blue Collar Work, and more]. I don't do everything I do for money, I usually prefer to be behind the scenes, seeing the horrendous nitty gritty of how reality works, and using that to make better decisions or inform people who ask for my advice. Obligatory self-victimization I grew up firmly middle class (Am I the last one?), went to american public school, and went to a standard in-state public university. I've never asked my family for career help. I never took up any of their trades. Other than a few basic first-world standards literally everyone else in a first world country has, I essentially started from scratch. I proudly identify as "not a rich shithead or nepo baby". My Worldview I'm not a contrarian. I'm not a conformist. I usually just try to look at things objectively. Most people have described me as very politically confusing, but passionate nonetheless. I lean collectivist, but think communism is stupid. To me collectivism is just reading the room. Societies that read each other well are usually healthier. Societies that try and sweep the ugly truth under the rug usually get exploited. I will always base my worldview in objective reality and the experiences of others and how closely that aligns with what I'm seeing for myself. That might sound like going with the mainstream, but it really isn't if you take this perspective outside of your own culture/language barrier. Maybe everyone in your country says something is offensive, but no one else in any time period or other parts of the world currently think that. My conclusion would probably be "Why is this one section in particular more easily offended than others, maybe they just have a skill issue". I am brutally honest because I have seen how being limp and furthering low-quality information is lowering everyone's quality of life. Sometimes you must act a little barbaric to preserve civilization. Rules of Engagement I am both a very peaceful and a very aggressive person. It depends on the context. I don't mind disruption, if it's not meant to be disrespectful.'''
