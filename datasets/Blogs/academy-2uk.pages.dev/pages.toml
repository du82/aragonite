title = "Proving Darwin Wrong |"
description = "A detailed blueprint to put his dogshit theories into the grave"
full_description = '''Proving Darwin Wrong 2024-11-24 A detailed blueprint to put his dogshit theories into the grave Darwinistic Downfall of Intellectualism I hate Darwin. Darwinism has been a plague on modern intellectualism for over a century now. It has retarded the minds of intellectuals. Everyone must see things through purely rational scientific means and then jump to wild extrapolated theories about all of life, no matter how minimal the core evidence is. Darwin's entire theory is blasphemously not thorough enough to justify such massive theoretical leaps about all life. I do not know how he said "Birds have cool beaks, so your great ancestor was a fish-mammal" and the entire scentific community just ran with it for most of modern history. Most of human history is defined by spirituality in some sense. Egypt, Greece, Persia, Rome, Babylon, were all polythesitic societies. Many mathematical principles are derived from astronomy and spiritual principles. China used to have a form of ancestor worship, critical to their worldview for thousands of years. Spirituality is a core, fundamental, innate part of being human. It always has been. When you purge that with darwinism and atheism, you're missing half the color spectrum. Worse than that, you end up with shitty theories like Communism, Woke Leftism, Reddit Circle Jerking, Insane Surveillance Capitalism, and Authority Ass-Kissing essentially morhping into new shitty replacements for the massive void left in the soul. The Big Hole Darwin only ever mentions the study of adult finches and how their beaks adapted to the seeds particular to the island. He never mentions the babies apparently. You'd think someone would have asked about that. Are the baby finches born with the beak patterns the adults have? That would likely suggest a deeper genetic evolution. No, that's not in there, by intentional omission or not. Foot Human feet adapt to cultural footwear, even evident in skeletons. The concept of the study to prove Darwin wrong is simple: Are the exact same finches, on the exact same islands Darwin went to, showing signs of beat adaptation from early adolescence or even in the embryotic stages? Is there a deeper DNA-level evolution to the available food supply? Or do beaks of finches, as human feet do to footwear, adapt and mold to their surrounding environement for obvious surivival reasons. If one was to show that the babies, or embryo's, show virtually no statistically significant changes or signs of adaptaion, then you essentially wipe the entirety of Darwinism and all it's atheist derivatives off the map, permanently sunset evolutionary theory, and put Darwin right in the grave where he belongs.'''
