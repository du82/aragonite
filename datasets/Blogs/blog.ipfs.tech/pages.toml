title = "IPFS 周报-54 | IPFS Blog & News"
description = "ZH - All the latest information about the IPFS Project in one place: blog posts, release notes, videos, news coverage, and more."
full_description = "Blog & news IPFS 周报-54 默奕 13 August 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新你的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # 正如我们所承诺的，js-ipfs 0.37.0 已经发布 最新发布的 js-ipfs 引入了一个全新的构造器，更好的 DNSLink 支持和委托路由!有关完整的发布细节，请参阅 IPFS 博客 (opens new window)。 # js-libp2p 增加了 Gossipsub 支持和 Promisify API Libp2p 的工作人员也很忙! 上周，他们宣布了 js-libp2p 0.26.0 (opens new window) 版本的发布，该版本增加了对更高效的 pubsub 路由器 (Gossipsub) 的支持，并提供了目前阶段对 Promisify 的支持。点击查看详情！ # 你好 ipfs-cohost 👋 ipfs-cohost(https://github.com/olizilla/ipfs-cohost#ipfs-cohost-) 由 @olizilla 创建，它是 CLI (命令行界面)，可以共同管理在 IPFS 上发布的网站。如果你的域有一个 DNSlink 指向 CID，那么 ipfs-cohost 将允许其他人将其 pin 到自己的 IPFS 节点。 # IPFS 生态圈的动态 你在 Twitter 上关注 IPFS (opens new window) 吗? 关于新闻中 IPFS 的最新汇总，请查看我们的 Twitter 提要或查看有关 Awesome IPFS 的最新文章 (opens new window)。 2019 IPFS Camp 举行的 “大灾难规避大会” (opens new window), Alan Shaw, 2019 年 8 月 11 日 视频: TAU Coin 的 David 谈论移动端采矿、IPFS、交易证明、了解你的客户(KYC)、老化逃逸速度 (opens new window)，Crypto Grownups, 2019 年 8 月 11 日 IPFS 生产配置 (opens new window), Coinmonks, 2019 年 8 月 9 日 Peergos 上的应用程序 (opens new window), Peergos, 2019 年 8 月 9 日 libp2p devgrants (opens new window): 联合资助者 (Protocol Labs、以太坊、Polkadot 等) 和寻求资助者之间的一个会议点，公开讨论要激励的项目、范围和规范。2019 年 8 月 8 日 肯尼亚区块链和 AI 工作组关于 IPFS 的报告 (opens new window), Bits Wallet, 2019 年 8 月 8 日 我的 IPFS 管理设置 (opens new window), Emiel Kollof, 2019 年 8 月 8 日 定义下一代网络的技术 (opens new window)，Temporal, 2019 年 8 月 8 日 如何开始使用 IPFS 和 Node (opens new window), BetterProgramming, 2019 年 8 月 7 日 RTrade 宣布首席执行官兼首席技术官将在 2019 年多伦多 Futurist 大会上发表 “分布式互联网的黎明” 演讲 (opens new window)，2019 年 8 月 7 日 Web3 是什么?(转录) (opens new window) Juan Benet 在 2018 年 Web3 峰会上的讲话，翻译成日语, 2019 年 7 月 28 日 #tbt IPFS 👽 和 Merkle 森林 (opens new window) 🌳, Hackernoon, 2019 年 4 月 14 日 # 开放 IPFS 工作岗位 Golang 高级工程师 (opens new window)，IPFS-Force，中国，上海 React Native 开发员 (opens new window), Berty，巴黎，法国 Senior Backend Engineer (opens new window)，MXC 基金会 gGmbH，德国柏林 Golang 高级工程师 (opens new window)，Textile，远程工作 分布式系统技术主管，IPFS， (opens new window)，Protocol Labs，远程工作 IPFS 文档制作和技术内容策略师， (opens new window) Protocol Labs，Remote UI/UX 设计师， (opens new window) Qri，美国，纽约，布鲁克林 # 更新和最新版本 查看生态系统中 IPFS 工具和项目的最新版本。 IPFS Laravel 库 (opens new window): 一个简单的库，通过 Laravel 访问 IPFS 的服务。它通过使用 HTTP API 来提供对 IPFS 函数的简单接入，包括导航内容、检索图片和文件，以及向 IPFS 网络添加文本和文件。 Peergos v0.1.1 (opens new window) - 包括 PDF 查看器和文本/代码编辑器 # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将你的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 SourceCred 0.4.0 (opens new window) 已经发布了! SourceCred 的目标是通过创建每个项目的名誉测度，名为 cred，来增强开源开发人员和社区的能力。 Ambients (opens new window) 是一种分布式计算协议。它允许开发人员构建去中心化的应用程序、数据库和服务，并在对等网络中部署和运行它们。 Librem 5 (opens new window) - 唯一你可以(真正)拥有的现代智能手机。 Nethereum 游乐场 (opens new window)现在从 IPFS 加载 Nethereum 程序集和依赖包，使其在编译程序集时的初始加载和缓存速度快得多。 上帝永恒的话语 (opens new window) - 不可审查的圣经，用 20 多种语言，在 IPFS 上建立。 OwnPaste (opens new window) - 去中心化的假名制 pastebin Permanent Upload (opens new window) 是一个简单、安全、简便的工具，可以将任何文件上传到 IPFS。 # 即将到来的社区活动 你知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 8 月 14 日： 参与编程的女性在云中 (opens new window)，了解 IPFS (opens new window)，激励女性在技术职业中脱颖而出。远程活动。 2019 年 8 月 16 日： 区块链，加密货币 & IPFS (opens new window): 和往常一样，我们将讨论正在改变和塑造密码世界和 WEB 3.0 的最新事件。美国，圣地亚哥。 2019 年 8 月 21 日至 23 日： 柏林 DappCon (opens new window)：以太坊 Dapps、基础设施和令牌工程全球开发者大会，德国，柏林。 2019 年 8 月 22 日： 西雅图 ProtoSchool 将举办 8 月去中心化网络会议 (opens new window)，详情待宣布! 美国，华盛顿州，西雅图。 2019 年 8 月 23 日至 25 日： ETHBerlinZwei (opens new window) 是 ETHBerlin 的第二个迭代，它是一个编程马拉松，一个文化节，一个教育活动，一个黑客主义的平台，一个推动去中心化生态系统向前发展的社区倡议。德国，柏林。 2019 年 8 月 31 日： ProtoSchool -上海分会: 技术沙龙会第 5 期 (opens new window): ProtoSchool - 上海分会是一群热爱去中心化网络，乐于学习、教学和分享想法的人。欢迎加入! 中国，上海。 2019 年 8 月 7 日： 巴黎 P2P (opens new window) 是一个由 P2P 和密码学爱好者组织的每月一次的会议。法国，巴黎。 重新安排 – 2019 年 9 月 27 日至 30 日： Offline Camp Oregon (opens new window) 现已延期，但它仍在计划中！这里是过去的露营者对我们独特的 (opens new window), 专注于离线优先 (opens new window)的网络开发和设计方法的非会议形式的活动的评论。 # 感谢你的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍你。"
