full_description = "Blog & news IPFS 周报-64 默奕 23 October 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新你的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # 参见 IPFS Camp 主题演讲和访谈 我们很高兴分享在 IPFS Camp 所有汇聚在一起的主题演讲 (opens new window) ，以及社区访谈，重点介绍了 IPFS Camp 参与者在广泛的生态系统中所做的一些令人震惊的工作。 # 观看：ProtoSchool Denver 的 IPFS 基础知识之夜 IPFS 基础知识演示，然后是 Cryptorado 社区的实时协作工具的交互式演示 (opens new window)！ # 在 2019 年 Web3 峰会上展示构建 Web3 分享 Juan Benet 在 2019 年 Web3 峰会上有关构建 Web3 的演讲 (opens new window) 。 # IPFS 生态圈的动态 你是否关注Twitter 上的 IPFS (opens new window)?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window)。 Peergos 更新：快 2 倍且具有交易意识的 GC (opens new window) ，Peergos，2019 年 10 月 21 日 爆炸式 IPFS 数据 - 通过简单的链接缩短服务启用一次性链接，过期链接等。 (opens new window) Textile，2019 年 10 月 18 日 突破性的 DAPPS：传统网络的最佳去中心化替代方案 (opens new window) ，Creary，2019 年 10 月 15 日 教程： 使用 IPFS 在线发布 (opens new window) ，SimpleAsWater，2019 年 10 月 13 日 教程： 如何设置私有 IPFS 群集 (opens new window) ，Raptoreum，2019 年 10 月 11 日 幻灯片：不再神秘的 gossipsub (opens new window) ，Raúl Kripalani，Devcon5，大阪，2019 年 10 月 9 日 # 空缺的 IPFS 工作岗位 技术负责人，分布式系统测试基础架构 (opens new window) ，Protocol Labs，远程工作 分布式系统工程师，IPFS 群集（Go） (opens new window) ，Protocol Labs，远程工作 高级后端工程师 (opens new window)，MXC 基金会 gGmbH，德国 柏林 分布式系统技术主管 (opens new window)，IPFS，Protocol Labs，远程工作 # 更新和最新版本 查看生态系统中 IPFS 工具和项目的最新版本。 Peergos v0.1.3 (opens new window) ：巨大的速度优化，本机构建和有交易意识的 GC Qri Desktop 0.1.0 发布！ (opens new window)在本地对数据集进行版本控制，并将它们（具有完整的提交历史记录）发布到云中。 ARK Core v2.6 (opens new window)现在可以在 Devnet 上运行 # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将你的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 宣布 Lotus (opens new window) ，第一个交替的 Filecoin 实现！ 3Box Ghost 线程 API (opens new window) ：Ghost 线程是另一种类型的线程，不会将任何消息持久保存到数据库存储中。而是使用 IPFS pubsub 将消息从一个对等方发送到网络的其余部分，并在其他联机对等方收到消息后将其保留在内存中。 Large (opens new window)是一个 P2P 博客平台。建立一个由社区运行和托管的在线社区。 Permaweb (opens new window)在一系列自托管节点上运行。这些功能由 Textile.io 提供支持，后者充当完全加密的去中心化内容的数字钱包。内容使用 IPFS 协议存储，这使 Permaweb 链接唯一且永久。 SourceCred Color Exploration (opens new window) ：一个使用 cred 发行轻松游戏的机会！ # 即将到来的社区活动 你知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 10 月 23 日： 去中心化网络布拉格举办 IPFS 聚会＃2：IPFS 中的文件和实践研讨会 (opens new window)：在聚会的前半部分，我们将更深入地研究 IPFS 如何处理文件。在下半部分，我们将一起探索解释概念。捷克，布拉格 2019 年 10 月 25 日： 重新去中心化会议 2019 (opens new window) – 对更公平，更自由的网络感兴趣？致力于权力下放？关心隐私，自主权和我们未来的数字基础设施吗？请加入我们去学习，交流经验，分享想法，加入挑战，进行协作，计划活动并开始项目。英国，伦敦 2019 年 10 月 27 日： 基于 IPFS 的 Force 商业平台 (opens new window) – 由 IPFS Force 社区主办的这次聚会将介绍 IPFS Force 商业平台，该平台在 IPFS 网络之上连接去中心化存储提供商和用户。中国，上海 2019 年 10 月 28 日至 30 日： 开源峰会 + ELC 欧洲 2019 (opens new window)将由戴尔技术公司的 Trevor Conn 主持，主题为“使用 IPFS 和分布式分类帐安全地存储 IOT 边缘数据”。法国，里昂 2019 年 10 月 30 日： 由 ScaleUp Porto 计划支持的 OPO.js Meetup＃10 (opens new window)将主办下一次免费的 Porto JavaScript 社区聚会。葡萄牙，波尔图。 2019 年 11 月 6 日： 巴黎每月 P2P Peer 对 Beer (opens new window)活动是由 P2P 和密码学爱好者社区组织并为其举办的会议。法国，巴黎。 2019 年 11 月 14 日： DWeb 会谈：Textile.io 的 Carson Farmer (opens new window)西雅图 ProtoSchool 主持。快来访问 Textile.io 上的分布式 Web 开发人员 Carson Farmer！西雅图，美国 2019 年 12 月 6 日： 柏林 React Day (opens new window) ：构建代码，而不是围墙。参与 React 世界的探索！ React Day 柏林会议专注于深入的演讲，实践研讨会和寻找新的机会，为每个人提供了结识新朋友和共同开发一流应用程序的空间。柏林，德国。 # 感谢你的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍你。"
