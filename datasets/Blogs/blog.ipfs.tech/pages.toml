full_description = "Blog & news IPFS 周报-70 默奕 03 December 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新您的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # js-ipfs 0.40.0 发布啦 🎉 朋友们，好消息！现在，新版本的 js-ipfs 附带了一个 repo 迁移工具，该工具将自动在浏览器中迁移 repo。 阅读完整的发布文章 (opens new window)以了解更多信息！ # “每周日简单技能”期间 IPFS 上的 GeoHot 黑客 最近，George Hotz 或 GeoHot，有机会在每周日简单技能中使用一些 IPFS (opens new window)，用 React 创建了 Tic Tac Toe (opens new window)。观看完整的视频，或跳到 2:45:00 直接进入 IPFS 部分。 # IPFS 生态圈的动态 您是否关注 Twitter 上的 IPFS (opens new window) ?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window)。 幻灯片： cyber：计算伟大网络中的知识 (opens new window) ，@xhipster 和 @litvintech，2019 年 12 月 1 日 照片： Henrique Dias 指导 BarcampLX 受众 (opens new window)通过 IPFS 快速进入去中心化网络，2019 年 11 月 30 日 Code Talks：零知识证明技术在区块链行业中的应用 (opens new window) ，PPIO，2019 年 11 月 29 日 教程： 使用 Node.Js 构建 IPFS 应用程序 (opens new window) ，The Startup，2019 年 11 月 29 日 IPFS 如何使网络去中心化 (opens new window) ，Make Tech Easier，2019 年 11 月 28 日 法规时代规范的数据驱动广告 (opens new window) ，2key，2019 年 11 月 28 日 性能测试 IPFS 协议 (opens new window)，Naveen Kumar Namachivayam，2019 年 11 月 24 日 如何解决互联网的所有错误 (opens new window) ，Martti Malmi，2019 年 11 月 2 日 # 空缺的 IPFS 工作岗位 高级后端工程师（IPFS）- Golang/Python 或 Golang/JavaScript (opens new window) ，Infura，布鲁克林，旧金山，远程工作 技术负责人，分布式系统测试基础架构 (opens new window) ，Protocol Labs，远程工作 分布式系统工程师，IPFS 群集（Go 语言） (opens new window)，Protocol Labs，远程工作 高级后端工程师 (opens new window)，MXC 基金会 gGmbH，德国 柏林 分布式系统技术主管 (opens new window)，IPFS，Protocol Labs，远程工作 # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将您的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 机密行星际文件系统 (opens new window) ：IPFS 的开源加密层，使任何具有 Internet 连接的人都可以访问免费的机密分散式存储。 在 IPFS 上打开街景图块服务器 (opens new window) ：光栅图块系统，其中图像数据的存储和传输是通过 IPFS 进行分配的！ CyberCongress (opens new window) ：很难简单地解释它是什么。 # 即将到来的社区活动 您知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 12 月 3-4 日： 由 SmartFactoryOWL 主持的 Actyx Hackathon (opens new window) 将于下个月发布。作为黑客马拉松的一部分，将测试 Actyx 平台（使用 IPFS 和 libp2p）的应用程序并将其应用于“生活对象”。德国，莱姆戈。 2019 年 12 月 4 日： 巴黎 P2P＃4 (opens new window)是由对法国巴黎的 P2P 和密码学充满热情的社区组织的聚会。 2019 年 12 月 6 日： 柏林 React Day (opens new window) ：构建代码，而不是围墙。参与 React 世界的探索！ React Day Berlin 会议专注于深入的演讲，动手研讨会和寻找新的机会，为每个人提供了结识新朋友和共同开发一流应用程序的空间。德国，柏林。 2019 年 12 月 7 日至 8 日： 旧金山 IndieWebCamp (opens new window) 是为期两天的研讨会，面向想要讨论，集思广益或破解任何独立，分布式，本地，离线，独立网络技术的创意者，以针对实际可用的开放式 Web 解决方案。社交媒体。美国，旧金山（CA）。 2019 年 12 月 11 日： 里昂 P2P (opens new window) 是一个聚会，讨论 P2P，去中心化，离线优先应用程序，网络，机密性，反监视，反审查，安全等主题！法国，里昂。 2020 年 1 月 8 日： 巴黎 P2P 庆典 (opens new window)是结成联盟的机会，邀请各种形式的 Peer-2-Peer 参与者见面，围绕与 Peer-to-Peer 相关的所有主题展开讨论。有关免费的四日庆典的更多信息，请访问 p2p.paris (opens new window)。 # 感谢您的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍您。"
