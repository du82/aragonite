full_description = "Blog & news 2019 第三季度 IPFS 回顾 🎉 默奕 15 October 2019 #weekly #recap Share this item: Twitter Facebook 每一天都使我们接近 2019 年底！为了庆祝，我们整理了一个非常特殊的问题，回顾 IPFS (opens new window) 社区在 2019 年迄今已完成的所有工作。从里程碑意义到重新混合工作组和发布新版本，再到许多敬畏的（和新的！ ）加入我们的贡献者，以及今年余下的时间会发生什么。我们希望您喜欢本季度回顾！ 感谢您成为我们社区的一部分，没有您，我们真的无法实现 IPFS。 ❤️ # 大事记 # IPFS Q3 发布项目有限度和工作组 早在 7 月， 我们重组了项目工作组， (opens new window)以包括 Bifrost 团队，软件包经理等！ # 项目发布精彩！ # 发行 js-ipfs 0.37.0 和 0.38.0💛 0.37.0 版具有 (opens new window)新的构造函数，更好的 DNSLink 支持和委托路由，而 0.38.0 版增加了 (opens new window)对垃圾回收，Gossipsub 的支持以及 IPNS 对 ipfs resolve 的支持！ # js-libp2p 0.26.0 发布 🧩 8 月初， js-libp2p 还获得了 Gossipsub 支持 (opens new window) ，并 Promisify-实现了 libp2p API。 # go-ipfs 0.4.22 发布了 💠 go-ipfs 版本 0.4.19、0.4.20 和 go-ipfs 0.4.21 附带了不寻常数量的关键回归，这些关键回归已在最新补丁程序发行版 (opens new window)中修复。 # go-ipfs 改进了 IPFS 发行过程 前面提到的回归分析需要一种新的发布过程方法， 如去年 8 月所详述的 (opens new window) 。新方法在 5 阶段流程中增加了三个特定的更改。 # 现在，您可以在浏览器中 pubsub 使用 JS IPFS HTTP API 客户端！ 由于无聊的技术原因，不支持通过浏览器中的 HTTP API 进行发布订阅。但是，一旦 fetch API 支持取消， 对 js-ipfs 的 pubsub 支持就到了 (opens new window)！ # IPFS Desktop 0.9 发布 🖥 9 月初， 最新版本的 IPFS Desktop 0.9.2 已发布 (opens new window)！现在，您可以浏览，在 IPFS 上使用 npm，将 IPFS 命令行工具添加到系统中等等！ # IPFS 浏览器更新 我们旨在使多个浏览器实现完全本地化的（并且可互操作的！）IPFS 支持。在此过程中，我们与 Firefox，Brave，Opera 和其他浏览器进行了持续的合作。 请继续阅读以了解最新状态 (opens new window)与进展。 # IPFS + ENS 无处不在：推出 EthDNS（严格来说第 4 季度，但我们必须分享） 本月早些时候，EthDNS 宣布 (opens new window)通过那古老但必不可少的 🧙‍♂️ 域名系统 🧙‍♂️ ，将传统的网络世界与 ENS 命名的，由 IPFS 支持的去中心化站点和 dapp 的新世界联系起来。 # IPFS Camp 没错，IPFS Camp 是在第二季度举行的，但是活动中产生的许多令人惊奇的内容直到第三季度才准备就绪。查看这些批次的 IPFS Camp 很棒的视频和博客内容！ ⚡️ 闪电谈话和 📃 海报项目 (opens new window) 从一位来自遥远的未来的 DWeb 历史研究人员的角度讲述 IPFS Camp 2019 深潜会议故事 (opens new window) IPFS Camp 核心课程视频 🍿 (opens new window) IPFS Camp 科幻博览会视频 🧬 (opens new window) # 您看过这些 IPFS 教程吗？ 在 IPFS 上托管 Slate 文档 (opens new window) ，Temporal 如何开始使用 IPFS 和 Node (opens new window) ，BetterProgramming 使用 IPFS 将我的网站去中心化 (opens new window) ，Henrique Dias 在 IPFS 上构建零依赖注释应用程序 (opens new window)，SimpleID 以 Ethereum Grid 中的 IPFS 入门 (opens new window) 使用 IPFS 和 Blockstack 构建版本控制系统 (opens new window) ，Hackernoon 使用 IPFS，IPNS 和 DNSLink 托管网站 (opens new window) ，SimpleAsWater # Q3 的名称和编号 在过去的一个季度中，IPFS 项目中的 109 个 repo 中的 121 位贡献者总共提交了约2,202 个提交 。感谢以下人员： @0zAND1z @aanupam23 @achingbrain @adria0 @aeddi @aknuds1 @alanshaw @alexander255 @AliabbasMerchant @amitizkpa @andrew @andrewxhill @aphelionz @arku @aschmahmann @AuHau @autonome @bigs @blackforestboi @bob-42 @campoy @carsonfarmer @cesarosum @codynhat @cwaring @daviddias @dbachko @dbw9580 @dignifiedquire @dirkmc @djdv @doctorrobinson @drbh @DTV96Calibre @eingenito @ericronne @ernest-bruce @fbielejec @frrist @fsdiogo @gjeanmart @gmas @godkong @gpestana @hacdias @hannahhoward @hapsody @herronjo @hikerpig @hsanjuan @hugomrdias @ianopolous @icidasset @jacobheun @jamiew @jbenet @jehunter5811 @Jeroen52 @jessicaschilling @jimpick @jkarni @jonnycrunch @Jonybang @kanej @Kcchouette @khinsen @khursheb @kishansagathiya @koalalorenzo @konoromiHimaries @Kubuxu @lanzafame @lidel @magik6k @Mairkur @maparent @mburns @mcdee @meiqimichelle @mib-kd743naq @michealavila @MichaelMure @mikeal @momack2 @moyid @nick @npfoss @NukeManDan @obo20 @olizilla @parkan @PedroMiguelSS @phillmac @pkafei @postables @Prabhakar-Poudel @Prtfw @raulk @realabbas @renrutnnej @romanic-juniet @satazor @scout @smwa @soapdog @solangegueiros @stebalien @steven004 @swedneck @tapaswenipathak @terichadbourne @timowli @tobowers @vasa-develop @vasco-santos @vijaysv @vmx @whyrusleeping @xavivives @xhipster @ZenGround0 @Zimmi48 # 请帮助我们欢迎这 49 位新贡献者 👏 @0zAND1z @aanupam23 @adria0 @AliabbasMerchant @amitizkpa @andrewxhill @bob-42 @cesarosum @codynhat @dbachko @dbw9580 @dignifiedquire @doctorrobinson @drbh @DTV96Calibre @ernest-bruce @fbielejec @gmas @godkong @gpestana @hapsody @herronjo @hikerpig @icidasset @jehunter5811 @Jeroen52 @jonnycrunch @kanej @khinsen @khursheb @Mairkur @mcdee @mib-kd743naq @moyid @nick @npfoss @phillmac @Prtfw @realabbas @soapdog @solangegueiros @steven004 @swedneck @tapaswenipathak @timowli @tobowers @vijaysv @xavivives @xhipster @Zimmi48 再次感谢您在第三季度的辛勤工作和贡献。继续这了不起的工作吧！ # 即将在 2019 年推出 随着一年的结束，IPFS 所有项目的不同项目工作组都在忙于实现其第四季度和 2019 年目标。您可以在可见的 2019 Q4 IPFS OKRs 电子表格中 (opens new window)看到这些目标。通过在 GitHub 上加入我们 (opens new window)借给我们您的专业知识！ # 感谢您的阅读 ☺️ 这就是 IPFS 周刊的特别版。如果我们错过了什么，请回复邮件通知我们! 下周，我们将返回自上周以来整个生态系统中发生的所有新闻。 如果这是您首次阅读 IPFS 周刊，则可以通过在 GitHub 项目上查看 (opens new window)或加入我们的聊天 (opens new window)来了解更多信息。 下周见！ 👋"
