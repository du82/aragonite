["https://blog.ipfs.tech/zh-cn/weekly-60"]
title = "IPFS 周报-60 | IPFS Blog & News"
description = "ZH - All the latest information about the IPFS Project in one place: blog posts, release notes, videos, news coverage, and more."
full_description = 'Blog & news IPFS 周报-60 默奕 24 September 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新你的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # IPFS Camp 课程视频发布 如果你一直关注 IPFS Camp 的更新，你可能已经浏览了闪电演讲、深度教程和项目海报的视频，但是现在 IPFS Camp 的核心和选修课视频 (opens new window)已经发布了 # IPFS 集群 v0.11.0 已经发布！ IPFS 集群 v0.11.0 是本项目历史上最大的发布 (opens new window)。它的主要特点是引入了新的 CRDT “共识”组件。利用 Pubsub、Bitswap 和 DHT，并使用 CRDTs，集群对等点可以跟踪全局 pinset，而不需要在线，也不需要像原来的 Raft 方法那样担心其他对等点。一定要查看更新的文档 (opens new window)。 # IPFS 生态圈的动态 你是否关注Twitter 上的 IPFS (opens new window)?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window)。 使用 IPFS、IPNS 和 DNSLink 网站 (opens new window) ，SimpleAsWater，2019 年 9 月 22 日 IPFS DeFi 金融技术银行现实检查 (opens new window)，Temporal，2019 年 9 月 20 日 充满 cDAI 的池子 (opens new window)，The Graph，2019 年 9 月 20 日 视频: 介绍 OpenBazaar P2P 市场视频 (opens new window)，CryptoShoppe, 2019 年 9 月 19 日 RTrade 与 Permaweb 合作，利用 Web 3.0 基础设施创建新的发布平台 (opens new window)。Temporal，2019 年 9 月 18 日 发布你的元数据和源代码群集到 IPFS 和 SWARM (opens new window)，Remix Ethereum-IDE, 2019 年 9 月 18 日 区块链：以用户为宗旨 (opens new window)。Ken Woodruff，2019 年 9 月 16 日 报名参加 Qri Beta 测试！ (opens new window) 2019 年 9 月 15 日 # 开放 IPFS 工作岗位 React Native 开发员 (opens new window), 法国 巴黎, Berty 高级后端工程师 (opens new window)，MXC 基金会 gGmbH，德国 柏林 高级 Golang 工程师 (opens new window)，Textile，远程工作 分布式系统技术主管 (opens new window)，IPFS，Protocol Labs，远程工作 IPFS 文档技术内容策略 (opens new window)，Protocol Labs，远程工作 # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将你的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 IpJot (opens new window) 在 web 上创建短文、故事、书籍、诗歌等，并将它们添加到 IPFS 中。 带有 TiddlyWiki 的 IPFS (opens new window)，一个旨在帮助开发人员、编辑人员或用户通过 IPFS 保存 wiki 和附件的插件。 # 即将到来的社区活动 你知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 新 IPFS 聚会： 苏黎世 IPFS Meetup Gruppe (opens new window) 将于近期召开会议，讨论 IPFS 的潜力和现状，也许还会讨论类似的 P2P 网络，使经济无国界。瑞士 苏黎世。 2019 年 9 月 27 日至 30 日： Offline Camp Oregon (opens new window) 现已延期，但它仍在计划中！这里是过去的露营者对我们独特的 (opens new window), 专注于离线优先 (opens new window)的网络开发和设计方法的非会议形式的活动的评论。 28 September 2019: ProtoSchool -上海分会: 技术沙龙会第 6 期 (opens new window) 将在漕河泾国际孵化中心举行。中国上海。 2019 年 10 月 2 日： 巴黎 P2P (opens new window) 是一个由 P2P 和密码学爱好者组织的每月一次的会议。法国，巴黎。 2019 年 10 月 7 日 准备好迎接火星吧！ (opens new window)，大阪的 IPFS 研讨会邀请你深入了解 IPFS 的工作原理，以及如何在新项目中实际使用 IPFS。日本大阪。 2019 年 10 月 28 至 30 日，开放源码峰会 + ELC 欧洲 2019 (opens new window) 将以戴尔技术公司的 Trevor Conn 为特色，"通过 IPFS 和分布式账本安全存储物联网边缘数据"。法国 里昂。 # 感谢你的阅读 ☺️ 以上就是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复这封电子邮件。让我们知道，我们可以在下周的版本功能你。'
