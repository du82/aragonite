full_description = 'Blog & news IPFS 周报-57 默奕 03 September 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新你的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # 您现在可以在浏览器中使用 JS IPFS HTTP API 客户端进行 PubSub! 现在 fetch API 支持 cancelation 了，并且已经支持了一段时间，PubSub 支持已经到来! Hooray \o/ 在 IPFS 博客 (opens new window)上阅读所有相关内容。 # 回顾最新的 IPFS 每周通话 长假期周末让你无法参加本周的 IPFS 电话会议? 点击回顾! (opens new window) # IPFS 生态圈的动态 你是否关注Twitter 上的 IPFS (opens new window)?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window)。 教程:在 IPFS 上构建零依赖 Notes 应用程序 - 第一部分 (opens new window)， SimpleID, 2019 年 9 月 3 日 假新闻:一个通用的解决方案 (opens new window)，Towards Data Science，2019 年 9 月 2 日 Memolabs: 确保低成本数据的有效性 (opens new window)， 2019 年 9 月 1 日 The Gathering 简介 (opens new window)， 2019 年 8 月 29 日 超越金融服务领域的扩张 (opens new window)， RTrade Technologies, 2019 年 8 月 29 日 区块链的应用如何超越金融服务 (opens new window)， RTrade Technologies, 2019 年 8 月 29 日 开始在 Ethereum Grid 使用 IPFS (opens new window)，2019 年 8 月 28 日 创建私人 IPFS 网络 (opens new window)， 2019 年 8 月 28 日 技术和研究更新 (opens new window)， Web3 基金会，2019 年 8 月 26 日 10+ 每个 IPFS 开发人员都应该知道的资源 (opens new window)， Hackernoon, 2019 年 8 月 21 日 使用 EdgeFS 保护和删除 Edge (opens new window)，The Startup，2019 年 8 月 11 日 # 开放 IPFS 工作岗位 UX 和 Web 设计师 (HTML/CSS) (opens new window)，Blender，荷兰阿姆斯特丹 React Native 开发员 (opens new window), Berty，巴黎，法国 Golang 高级工程师 (opens new window)， Textile，远程工作 分布式系统技术主管，IPFS， (opens new window)，Protocol Labs，远程工作 IPFS 文档制作和技术内容策略师， (opens new window) Protocol Labs，远程工作 # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将你的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 Koos (opens new window)，一个去中心化的社交网络 Diffuse (opens new window) - 连接到 cloud/distrib 的音乐播放器 TulipTools (opens new window)通过 IPFS 为所有 Tezos 网络托管 snapshots，使运行 Tezos 节点更快 # 即将到来的社区活动 你知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 9 月 4 日： 巴黎 P2P (opens new window) 是一个由 P2P 和密码学爱好者组织的每月一次的会议。法国，巴黎。 2019 年 9 月 6 日: 您是否愿意帮助为docs.ipfs.tech (opens new window)创建下一代导航? 请加入对 IPFS 文档站点现有导航结构的讨论，并参与一个协作的“卡片排序”练习，以探索绕过 IPFS 文档的其他可能性。加入 1700-1830 UTC 的视频聊天 (opens new window)。 2019 年 9 月 16 日: 维多利亚科技大会 2019 年 9 月 (opens new window):一旦他们确定了日期和地点，就报名参加!加拿大，不列颠哥伦比亚省，维多利亚 2019 年 9 月 20-22 日: 我们的网络 2019 RE: 基础设施 (opens new window) 探讨对替代网络实践(新协议、对等连接、离线优先计算和基于社区的治理)的集体关心和维护。多伦多,加拿大安大略省。 2019 年 9 月 27 日至 30 日： Offline Camp Oregon (opens new window) 现已延期，但它仍在计划中！这里是过去的露营者对我们独特的 (opens new window), 专注于离线优先 (opens new window)的网络开发和设计方法的非会议形式的活动的评论。 # 感谢你的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍你。'
