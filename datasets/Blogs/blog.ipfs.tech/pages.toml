full_description = "Blog & news IPFS 周报-52 默奕 30 July 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新你的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # 在树莓派上安装 IPFS 和 IPFS- cluster 想过做 IPFS 和物联网的骇客吗? Aadhi Manivannan 最近写了一篇很棒的教程，介绍如何在树莓派上安装 IPFS 和 IPFS-cluster。查看完整的教程了解更多细节 (opens new window)。 # IPFS 生态圈的动态 你在 Twitter 上关注 IPFS (opens new window) 吗? 关于新闻中 IPFS 的最新汇总，请查看我们的 Twitter 提要或查看有关 Awesome IPFS 的最新文章 (opens new window)。 去中心化云存储正在改变互联网的面貌 (opens new window), Hackernoon, 2019 年 7 月 26 日 现在在 IPFS 上发布预先缓存的 Prelude (opens new window), Dhall Discourse, 2019 年 7 月 26 日 RTrade 宣布 Temporal 网站的重新设计，IPFS API，企业节点和新的定价 (opens new window), Temporal, 2019 年 7 月 26 日 分解 Web3 中心化的载体 (opens new window), Multicoin Capital, 2019 年 7 月 25 日 请查看 Elk: 去中心化世界的开发版 (opens new window), Kickstarter, 2019 年 7 月 25 日 报告: libp2p 和 ETH2 的研究 (opens new window), Raúl Kripalani, 2019 年 7 月 24 日 重新去中心化网络 (opens new window), Haja Networks, 2019 年 7 月 24 日 适用于 DAOs（去中心化自制组织）的基于智能合同的 IPFS 存储 (opens new window), Open Work Labs, 2019 年 7 月 24 日 ARK 核心：到 V3 的路径和视野 (opens new window), ARK.io, 2019 年 7 月 24 日 每个 IPFS 开发者应该知道的 10 个以上资源 (opens new window), The Startup, 2019 年 7 月 23 日 Peergos 在 IPFS Camp, 2019 年 7 月 (opens new window), Peergos, 2019 年 7 月 22 日 The Graph（第 1 部分）: 如何在 Ethereum 上部署子图 (opens new window), ProtoFire.io, 2019 年 7 月 18 日 # 开放 IPFS 工作岗位 Golang 高级工程师 (opens new window), Textile, 远程工作 分布式系统技术主管, IPFS, (opens new window), Protocol Labs, 远程工作 IPFS 文档制作和技术内容策略师, (opens new window) Protocol Labs, Remote UI/UX 设计师, (opens new window) Qri, 美国，纽约，布鲁克林 # 更新和最新版本 查看生态系统中 IPFS 工具和项目的最新版本。 Peergos: v0.0.11 (opens new window): 现在有二维码朋友验证，文件夹上传等! # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将你的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 MetaMask 移动端 Beta (opens new window) — 连接去中心化网络的桥梁，具有以 dapp 为中心的浏览体验、直观的登录和与桌面 MetaMask 帐户同步的功能。 最新发布的: THC（时态 HTTP 客户） (opens new window)是一个 Golang 库和 CLI 用于通用时态 API 调用 Minerva (opens new window): 在 IPFS 上构建 Hadoop-Hive，使用 Minerva，你可以使用标准 SQL 查询 IPFS 上的文件内容 (json, csv 格式)。 Pinata Pinner (opens new window): 使用 Pinata pinning 服务递归地将整个目录添加到 IPFS 的小实用程序。 # 即将到来的社区活动 你知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 8 月 7 日: 巴黎 P2P (opens new window) 将举办第一个活动，巴黎 P2P #0 (opens new window)，讨论点对点(P2P)、去中心化、网络和自治社区、分布式和去中心化系统等主题。请在此提交你对未来活动的演讲思路。 (opens new window) 2019 年 8 月 14 日: 参与编程的女性在云中 (opens new window)，了解 IPFS (opens new window)，激励女性在技术职业中脱颖而出。 # 感谢你的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍你。"
