["http://blog.ipfs.tech/newsletter-200"]
title = "Welcome to IPFS News 200! | IPFS Blog & News"
description = "Featuring a big announcement about IPFS and libp2p."
full_description = '''Blog & news Welcome to IPFS News 200! 18 December 2023 #newsletter Share this item: Twitter Facebook # Advancing IPFS and libp2p Governance 🔭 We have some exciting news to share! IPFS and libp2p are officially taking big steps forward in project maturity, with independent foundations and funding structures in the Protocol Labs network! You can learn more about this news on the Protocol Labs blog. (opens new window) Read the blog post # Brand New on IPFS ✨ Videos: IPFS Connect Istanbul Talks (opens new window) IPFS Connect was a community-run regional conference bringing together all of the builders and ecosystems that rely on and use IPFS as the most widely used decentralized content addressing protocol for files and data. This year's event happened alongside Devconnect and LabWeek23 in Istanbul, Turkey on November 16. Watch the talks here! (opens new window) IPFS Companion MV3 Update (opens new window) In September, IPFS-Companion built on MV3 (Manifest V3) was shipped on the main channel, which brings exciting improvements and changes the way you interact with this powerful tool. This blog post (opens new window) will give you a quick overview of the journey, changes, and what to expect. Incident Report - Increased Latency on the Amino DHT (opens new window) Since 4 December, the ProbeLab team which monitors the IPFS network observed two major anomalies in Amino (The public IPFS DHT). Learn more about it here! (opens new window) Built with IPFS - Mintter and The Hypermedia Protocol (opens new window) In this episode of Built with IPFS, we dive into Mintter and The Hypermedia Protocol. Mintter Hypermedia is an open system, built on IPFS that allows communities to collaborate on content that is structured and deeply linked. All content in the system is cryptographically signed, versioned, and made permanent with IPFS. Watch the video here! (opens new window) New Release: Kubo v0.25.0 (opens new window) Commands ipfs key sign and ipfs key verify New Release: Boxo v0.16.0 (opens new window) New Release: Iroh v0.11.0 (opens new window) New Release: curl v8.5.0 - improved IPFS and IPNS URL support (opens new window) Popular on the Forums (opens new window) Help: Constant 100% CPU utilization on AWS EC2 IPFS node (opens new window) Help: Double-hashed entries in denylists (opens new window) Help: How to find these files through CID? (opens new window) Helia Reports (opens new window) ProbeLab Network Weekly Reports (opens new window) # Around the Ecosystem 🌎 Blog: Introducing Major Improvements to Omnilingo (opens new window) From the Omnilingo team: "We're happy to introduce some major improvements to Omnilingo, the decentralised language learning platform designed with special attention to small and marginalised language communities. We now have an experimental contribution system, including an encryption-based consent model." Read more about it here! (opens new window) Blog: dAppling - a New Way to Deploy IPFS Sites in Minutes (opens new window) Introducing a seamless way to launch your code on IPFS, featuring straightforward setup, automatic deployments, and more. Learn more about it here! (opens new window) Dumb Pipe by number 0 (opens new window) Easy, direct connections that punch through NATs & stay connected as network conditions change. Learn more here! (opens new window) Call for submissions: awesome-ipfs (opens new window) This is a community list of awesome projects, apps, tools, and services related to IPFS. We'd love to see more projects added to it, so submit yours today! (opens new window) Upholding a Free Tier: The IPFS Challenge (opens new window) From the Filebase Team: "Four years into our journey at Filebase, we stand amid a shifting technological landscape where continuity and reliability are more valued than ever. In such times, we are not just continuing but reaffirming our pledge to offer a free IPFS tier." Read the blog post here! (opens new window) IPFS-based CDN faster than Akamai in some cases (opens new window) A group of students at MIT ran a speedtest of IPFS vs a large web2 CDN, and IPFS was significantly faster for some file sizes! Check out the full report here. (opens new window) # Have something you want featured? 📥 If you have something exciting or important that you think the IPFS community should know about, then you can submit this form (opens new window) to have it be considered for inclusion in the IPFS newsletter. Submit form'''
