title = "IPFS 周报-59 | IPFS Blog & News"
description = "ZH - All the latest information about the IPFS Project in one place: blog posts, release notes, videos, news coverage, and more."
full_description = 'Blog & news IPFS 周报-59 默奕 17 September 2019 #weekly #docs Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新你的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # IPFS 解释程序 (IPFS Explainer) 的 v0.1 现已公开发布！ 经过 IPFS 文档团队 (opens new window) 的艰苦工作，解释程序 v0.1 关于 IPFS 内容如何处理, peer-to-peer 网络怎样工作终于在这里了。你自己去看看吧！ (opens new window) # 加入 js-ipfs 早期测试人员计划 早期的测试人员计划允许在生产中使用 js-ipfs 的工作组自愿帮助测试 js-ipfs 发布候选版本，以确保没有可能影响生产系统的退化出现在最终版本中。请继续阅读了解更多信息。 (opens new window) # IPFS 生态圈的动态 你是否关注Twitter 上的 IPFS (opens new window)?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window)。 通过专用网络启用 IPFS 应用程序 (opens new window)，Temporal，2019 年 9 月 16 日 使用 IPFS 和 Blockstack 构建版本控制系统 (opens new window)，Hackernoon，2019 年 9 月 16 日 Temporal 自豪地赞助我们的网络重建基础设施 (opens new window)，Temporal，2019 年 9 月 16 日 使用 IPFS 去中心化文件存储游戏资产元数据 (opens new window)，Blockade Games，2019 年 9 月 15 日 比较开发人员的身份验证工具 (opens new window)，Justin Hunter, 2019 年 9 月 15 日 使用 IPFS 和 Blockstack 构建版本控制系统 (opens new window)，SimpleID, 2019 年 9 月 13 日 专用 IPFS 网络 (opens new window)，Pinata，2019 年 9 月 12 日 开发、部署和监视 IoTFOTA 平台迭代性能测试的有效过程 (opens new window)，Rohit Bohara，2019 年 9 月 11 日 在 Matic testnet 上部署 Kyber (opens new window)，2019 年 9 月 11 日 IPFS 便携用户设置 App 首次发布 (opens new window)，FISSION，2019 年 9 月 10 日 Nimbus 团队授予了 libp2p 本地实现的赠款 (opens new window)，Status，2019 年 9 月 10 日 企业 IPFS 为真正的供应链起源 - 第 2 部分 (opens new window)，Temporal，2019 年 9 月 10 日 3Box 密码管理器 (opens new window)，Ryan Pedersen, 2019 年 9 月 8 日 视频: SourceCred 在柏林开放源码沙龙 (opens new window)，Dandelion Mané，2019 年 9 月 1 日 # 开放 IPFS 工作岗位 React Native 开发员 (opens new window), 法国 巴黎, Berty 高级后端工程师 (opens new window)，MXC 基金会 gGmbH，德国 柏林 高级 Golang 工程师 (opens new window)，Textile，远程工作 分布式系统技术主管 (opens new window)，IPFS，Protocol Labs，远程工作 IPFS 文档技术内容策略 (opens new window)，Protocol Labs，远程工作 # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将你的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 ETH Pictures (opens new window): 将图像上传到 IPFS，并在以太坊区块链中生成一个 NFT 不可替换的令牌来表示每个图像。 开放索引协议 DDX (opens new window): 即分布式数据库 X，是建立在开放索引协议基础上的一款软件。 WAX 照片 (opens new window): 去中心化的照片服务，允许上传形象化符号到 IPFS 和链接到您的 WAX 帐户。 密码管理器与 3Box (opens new window) # 即将到来的社区活动 你知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 新 IPFS 聚会： 苏黎世 IPFS Meetup Gruppe (opens new window) 将于近期召开会议，讨论 IPFS 的潜力和现状，也许还会讨论类似的 P2P 网络，使经济无国界。瑞士 苏黎世。 2019 年 9 月 19 日： 旧金山 IPFS 将在 Starfish Mission 主办 IPFS 如何工作 (opens new window)，请报名参加并了解更多关于 IPFS 以及它如何实际工作的信息。 2019 年 9 月 20 日至 22 日： 我们的网络 2019 年 RE：基础设施 (opens new window)探索了对替代网络实践的集体关心和维护——新协议、同行连接、离线优先计算和基于社区的治理。加拿大 安大略省 多伦多。 2019 年 9 月 27 日至 30 日： Offline Camp Oregon (opens new window) 现已延期，但它仍在计划中！这里是过去的露营者对我们独特的 (opens new window), 专注于离线优先 (opens new window)的网络开发和设计方法的非会议形式的活动的评论。 28 September 2019: ProtoSchool -上海分会: 技术沙龙会第 6 期 (opens new window) 将在漕河泾国际孵化中心举行。中国上海。 2019 年 10 月 2 日： 巴黎 P2P (opens new window) 是一个由 P2P 和密码学爱好者组织的每月一次的会议。法国，巴黎。 2019 年 10 月 28 至 30 日，开放源码峰会 + ELC 欧洲 2019 (opens new window) 将以戴尔技术公司的 Trevor Conn 为特色，"通过 IPFS 和分布式账本安全存储物联网边缘数据"。法国 里昂。 # 感谢你的阅读 ☺️ 以上就是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复这封电子邮件。让我们知道，我们可以在下周的版本功能你。'
