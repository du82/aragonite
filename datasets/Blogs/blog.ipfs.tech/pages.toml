full_description = "Blog & news IPFS 周报-66 默奕 05 November 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新您的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # 新教程：将 go-ipfs 用作程序库（不需要单独的过程！） 如果您错过了它，通过此新教程 (opens new window)学习如何使用 go-ipfs 核心 API 生成 go-ipfs 节点。 # IPFS 生态圈的动态 您是否关注 Twitter 上的 IPFS (opens new window) ?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window)。 TemporalX 开发环境正式发布 (opens new window) ，2019 年 11 月 3 日 本周视频：Filecoin 和 Web3 (opens new window) ，AVC，2019 年 11 月 2 日 照片： Textile 首席执行官 Andrew Hill 在 Data Science Wrangle 上解释 IPFS 多么酷 (opens new window)，Bethann Noble，2019 年 10 月 30 日 去中心化舞蹈 (opens new window)， Aicumen，2019 年 10 月 29 日 播客： Qri：与 Brendan O'Brien 和 Rico Gardaphe 讨论数据集 (opens new window) ，A Better Mouse Trap，2019 年 10 月 29 日 高性能 IPFS 网关的明确指南 (opens new window) ，Stackical，2019 年 9 月 21 日 # 空缺的 IPFS 工作岗位 技术负责人，分布式系统测试基础架构 (opens new window)，Protocol Labs，远程工作 分布式系统工程师，IPFS 群集（Go 语言） (opens new window)，Protocol Labs，远程工作 高级后端工程师 (opens new window)，MXC 基金会 gGmbH，德国 柏林 分布式系统技术主管 (opens new window)，IPFS，Protocol Labs，远程工作 # 即将到来的社区活动 您知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 11 月 6 日： 巴黎每月 P2P Peer 对 Beer (opens new window) 活动是由 P2P 和密码学爱好者社区组织并为其举办的会议。法国，巴黎。 2019 年 11 月 14 日： DWeb 会谈：Textile.io 的 Carson Farmer (opens new window)，西雅图 ProtoSchool 主办。快来访问 Textile.io 上的去中心化网络开发人员 Carson Farmer！美国，华盛顿州，西雅图。 2019 年 12 月 6 日： 柏林 React Day (opens new window) ：构建代码，而不是围墙。参与 React 世界的探索！ React Day Berlin 会议专注于深入的演讲，动手研讨会和寻找新的机会，为每个人提供了结识新朋友和共同开发一流应用程序的空间。德国，柏林。 # 感谢您的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍您。"
