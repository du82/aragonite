full_description = "Blog & news IPFS 回顾 2019 年第4季度 🎉 默奕 17 December 2019 #weekly #recap Share this item: Twitter Facebook 这是一个特殊的周刊，我们回顾了 IPFS 社区在今年过去几个月中所完成的工作。 从里程碑发布，ProtoSchool 这样的新项目，到加入我们的许多新的(和令人敬畏的)贡献者，以及今年剩下的时间里会发生什么，我们希望您喜欢这个季度回顾。 感谢您成为我们社区的一份子，没有您，我们真的无法实现 IPFS。 ❤️ # 里程碑 就发布而言，是的，我们做到了。 # IPFS 浏览器更新 了解与 Firefox，Brave，Opera 和其他浏览器与我们正在进行的持续合作 (opens new window) ，并了解目前的进展。 # 大量 IPFS Camp 内容发布出来！ 从主题演讲到开发人员访谈 (opens new window) ，再到科幻博览会视频 (opens new window) ，都有大量精彩的 IPFS Camp 视频可供观看！ # js-ipfs 0.39.0 和 0.40.0 发布 js-ipfs 团队一直在努力工作，以找出将来转换为哈希格式的基础，以及更多。查看 0.39.0 (opens new window) 和 0.40.0 (opens new window) 版本的更新。 # 了解如何将 go-ipfs 用作代码库 标题说明了一切！通过新教程了解如何将 go-ipfs 用作代码库 (opens new window) ，并充分利用 go-ipfs 核心 API。 # 在 ProtoSchool 上浏览 Files API 本新教程探讨了为处理文件而定制的 js-ipfs 顶级方法 (opens new window) （添加，获取，分类等）。一探究竟！ # 在 IPFS 上演示？我们给您帮助 请随意使用这些材料 (opens new window) ，例如 IPFS 的工作方式和 IPFS Deep Dive 讲习班，使您的活动很棒！ # Q4 的名称和编号 在过去的一个季度中， 共有 83 位贡献者 在 IPFS 项目的91 个 repo 中进行了约 1607 次提交。感谢以下人员，帮助我们度过了美好的一年，这真是令人惊奇的一年。 👏 @0x6431346e @aarshkshah1992 @achingbrain @agowu338 @alanshaw @alexander255 @Alexey-N-Chernyshov @AliabbasMerchant @alzuri @andrewxhill @aschmahmann @AuHau @autonome @ay2306 @carsonfarmer @csuwildcat @cwaring @daviddias @dirkmc @djdv @doctorrobinson @dreamski21 @ericronne @erlend-sh @Frijol @frrist @fulldecent @gjeanmart @hacdias @hannahhoward @hcg1314 @hinshun @hsanjuan @hueg @hugomrdias @ianopolous @iiska @jacobheun @jessicaschilling @jimpick @jkosem @johnnymatthews @Jorropo @jsoares @kaczmarj @khinsen @kishansagathiya @kpp @Kubuxu @lanzafame @lidel @martin-seeman @mboperator @meiqimichelle @MichaelMure @mikeal @mikedotexe @mkg200001 @momack2 @moul @moyid @nijynot @nonsense @olizilla @parkan @PedroMiguelSS @pranjalv9 @raulk @reasv @renrutnnej @sarthak0906 @Seenivasanseeni @serejandmyself @starmanontesla @Stebalien @stongo @tapaswenipathak @terichadbourne @TheBinitGhimire @vasco-santos @vincepmartin @whyrusleeping @xiegeo @yiannisbot # 请和我们一起欢迎这些新贡献者 👋 没有您的帮助，IPFS 将会是不同的！非常感谢您的加入。谢谢。 @0x6431346e @aarshkshah1992 @Alexey-N-Chernyshov @alzuri @ay2306 @csuwildcat @dreamski21 @erlend-sh @Frijol @fulldecent @hcg1314 @iiska @jkosem @johnnymatthews @jsoares @kaczmarj @kpp @mboperator @mikedotexe @mkg200001 @moul @nijynot @nonsense @pranjalv9 @reasv @sarthak0906 @Seenivasanseeni @serejandmyself @starmanontesla @stongo @TheBinitGhimire @vincepmartin @xiegeo @yiannisbot # 按数字排列的贡献者 以下是本季度项目中 repo 额最高的 10 个贡献者： @Stebalien @achingbrain @阿施玛曼 @lidel @阿兰肖 @MichaelMure @hugomrdias @jessicaschilling @hacdias 再次感谢您在 2019 年的辛勤工作和贡献。继续努力！ # 很棒的内容 # 去中心化网络即将到来 亚马逊，谷歌，Facebook 和 Twitter 处于联邦政府的视线中，但是破坏其统治地位所必需的技术可能已经存在。 了解 IPFS 在 (opens new window)未来的互联网中如何发挥作用 。 # IPFS + ENS 无处不在：EthDNS 简介 EthDNS (opens new window) 通过古老但必不可少的 🧙‍♂ 域名系统 🧙‍♂️，将传统的网络世界与 ENS 命名的，由 IPFS 支持的去中心化网站和 dapp 的新世界连接起来。 # 爆炸 IPFS 数据 💥 通过简单的链接缩短服务 (opens new window) ，启用一次性链接，过期链接等。 # 在 2019 年 Web3 峰会上展示 Building Web3 请看 Juan Benet 在 2019 年 Web3 峰会上有关构建 Web3 的演讲 (opens new window)。 # Tim Berners-Lee 似乎是 IPFS 和 libp2p 的粉丝 OMG 先辈注意到了我们 (opens new window)！ # 2020 年的 Brave 浏览器：新的广告块，过滤器，SDK 和 IPFS 早在 11 月， Brave 就宣布 (opens new window)了启动和实施 IPFS（去中心化的前沿方法）的计划。💁‍♀️ # “简单技能周日” 期间 GeoHot 在 IPFS 上 hack 最近，George Hotz，或 GeoHot，有机会在周日的 React for Simple Skills 中创建 Tic Tac Toe 时，hack 一些 IPFS (opens new window)。观看完整的视频，或跳到 2:45:00 直接进入 IPFS 阶段。 # DAppNode 的 IPFS Pinner Package 演示 万一您错过了它，DAppNode 创建了一个 IPFS-pinner！请观看此关于 IPFS 群集，ENS 和 IPFS 的创意组合演示 (opens new window) ，以获取您喜欢的软件包注册表的协作社区反射镜 。 # 2020 年新推出 我们别具风格的庆祝 2019 年 🎉 IPFS 文档焕然一新 查看目前我们概述的 2020 年目标 (opens new window) # 感谢您的阅读 ☺️ 这就是 IPFS 周刊的特别版。如果我们错过了什么，请回复邮件通知我们! 我们将在 2020 年 1 月 7 日返回您喜欢阅读的所有生态系统新闻。 如果这是您首次阅读《 IPFS 周刊》，则可以查看 GitHub 上的项目 (opens new window)或加入我们的聊天室 (opens new window)来了解更多信息或参与其中。 明年再见！ 👋"
