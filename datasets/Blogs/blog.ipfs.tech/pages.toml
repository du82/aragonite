full_description = '''Blog & news IPFS News Issue 203 28 March 2024 #newsletter Share this item: Twitter Facebook # Registration for IPFS Camp 2024 is officially open! Register soon and take advantage of a 40% off early bird discount. (opens new window) IPFS Camp is for those who want to bend the arc of the Internet to be more open, efficient, and secure. This will be the most exciting IPFS event yet! Connecting builders and users, organized by thematic tracks, and inspired by the in-depth conversations and unbounded energy of previous IPFS gatherings, it will be an event to remember. 🗓️ July 11-13, 2024 📍 Brussels, Belgium Register Today # Want to Speak at IPFS Camp 2024? We’re looking for talks long and short, as well as workshops and other creative formats, for numerous content tracks. Submit your proposal here: Submit a talk # Brand New on IPFS ✨ New Release: Kubo v0.28.0 (opens new window) RPC client: removed deprecated DHT API Gateway: /api/v0 is removed Removed deprecated Object API commands Popular on the Forums (opens new window) Help: Unable to resolve IPNS name via remote IPFS nodes or public gateways (used to work fine) (opens new window) Help: How to upload mutiple file same in a folder (opens new window) Kubo: Kubo (go-ipfs) closes db randomly (opens new window) Ecosystem: IPFS governance: launching a provisional Steering Committee (opens new window) General: How was everyone’s ETHDenver trip? (opens new window) ProbeLab Network Weekly Reports (opens new window) # Around the Ecosystem 🌎 Introducing the Filebase Content Delivery Network (opens new window) "Spanning three continents, the Filebase CDN features multiple Points of Presence (PoPs) in key locations across North America, Europe, and Asia. Leveraging geolocation-based load balancing, the Filebase CDN automatically directs traffic to the nearest data center, minimizing latency and turbocharging content delivery speed—whether over HTTPS or Bitswap. This global network ensures that no matter where users are located, they can access IPFS content quickly and reliably." Learn more about Filebase's CDN here! (opens new window) # Have something you want featured? 📥 If you have something exciting or important that you think the IPFS community should know about, then you can submit this form (opens new window) to have it be considered for inclusion in the IPFS newsletter. Submit form'''
