title = "IPFS 周报-53 | IPFS Blog & News"
description = "ZH - All the latest information about the IPFS Project in one place: blog posts, release notes, videos, news coverage, and more."
full_description = "Blog & news IPFS 周报-53 默奕 06 August 2019 #weekly #project planning Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新你的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # 宣布 IPFS 项目第三季度的优先事项和工作组 今年初夏，IPFS 团队聚集在一起，制定了一个计划，使 IPFS 具有高性能、高稳定、高质量和定期更新，并为进一步发展做好准备。看看这个计划 (opens new window)，重组的工作组和更多! # 介绍 ProtoSchool 的多项选择题课程 你知道吗? 在 ProtoSchool，并不是每节课都有编码挑战。ProtoSchool 长期以来一直支持编码练习和基于文本的课程，但今天我们引入了 一种新的课程类型: 选择题 (opens new window)。 🎉 现在，教程的作者可以在学习者阅读完课文后提供一个选择题测试，增加与学习者的互动性，并在进入下一个主题之前检查理解。 # 在 2019-07-29 IPFS 每周电话会议中了解如何通过 Web 打包支持 Web 归档 上周，在 IPFS 每周电话会议期间，Sawood Alam 在现场就 Web 打包及其如何支持 Web 归档做了一个精彩的演讲。点击这里查看详情！ (opens new window) # IPFS 生态圈的动态 你在 Twitter 上关注 IPFS (opens new window) 吗? 关于新闻中 IPFS 的最新汇总，请查看我们的 Twitter 提要或查看有关 Awesome IPFS 的最新文章 (opens new window)。 Gnosis 每月开发更新 (opens new window)，2019 年 8 月 1 日 Ethereum Grid 1.5.0 发布公告 (opens new window)，2019 年 8 月 1 日 现在，第一个重新去中心化摘要发布了! (opens new window)，31 July 2019 进入 Temporal 的 I2P IPFS 基础设施 (opens new window)，31 July 2019 现代技术问题与 Web 3.0 解决方案 (opens new window)，Temporal，2019 年 7 月 31 日 Textile.io 新工具和新面貌 (opens new window)，2019 年 7 月 30 日 目前影响区块链开发者的 5 大趋势 (opens new window)，ConsenSys，2019 年 7 月 22 日 # 开放 IPFS 工作岗位 Senior Backend Engineer (opens new window)，MXC 基金会 gGmbH，德国柏林 Golang 高级工程师 (opens new window)，Textile，远程工作 分布式系统技术主管，IPFS， (opens new window)，Protocol Labs，远程工作 IPFS 文档制作和技术内容策略师， (opens new window) Protocol Labs，Remote UI/UX 设计师， (opens new window) Qri，美国，纽约，布鲁克林 # 更新和最新版本 查看生态系统中 IPFS 工具和项目的最新版本。 # 即将到来：⚡️js-ipfs v0.37.0 🚀 下一个版本的 js-ipfs (opens new window) 包括一个新的构造函数，支持 DNSLink IPNS 名称解析，委托对等点和内容路由，等等! Haven 已经登陆 (opens new window) - OpenBazaar 的第一个功能齐全的移动应用程序(自豪地由 IPFS 提供!) 现已可用。无论你身在何处，都可以使用你的 iOS 或 Android 设备购物、聊天和隐私的发送加密货币。 Peergos v0.1.0 (opens new window) - 快速查找、加密历史记录和空间使用情况显示 Textile 有一个新的博客 (opens new window)，一个新的论坛 (opens new window)和一个新的网站 (opens new window)! # 进展中的 IPFS 这些 IPFS 项目可能会非常棒，但是它们需要你的帮助! IPFS 发布: 如果我们的发布能有一个 RSS 提要就太好了。 (opens new window) IPFS 教学卡片。任何程序都可使用。 (opens new window) # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将你的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 anytype.io (opens new window): 像 Notion，但自我托管，隐私的，免费的! 去中心化浏览器 MIX Acuity 1.0 发布 (opens new window) # 即将到来的社区活动 你知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 8 月 7 日： 巴黎 P2P (opens new window) 将举办第一个活动，巴黎 P2P #0 (opens new window)，讨论点对点(P2P)、去中心化、网络和自治社区、分布式和去中心化系统等主题。请在此提交你对未来活动的演讲思路。 (opens new window) 2019 年 8 月 8 日： IPFS Meet & Hack (opens new window)是每月一次的聚会，讨论 IPFS 的有关事项。由 San Francisco IPFS 主办，演讲请在这里注册 (opens new window)。美国旧金山。 2019 年 8 月 14 日： 参与编程的女性在云中 (opens new window)，了解 IPFS (opens new window)，激励女性在技术职业中脱颖而出。Remote event. 2019 年 8 月 21 日至 23 日： 柏林 DappCon (opens new window)：以太坊 Dapps、基础设施和令牌工程全球开发者大会，德国，柏林。 2019 年 8 月 23 日至 25 日： ETHBerlinZwei (opens new window) 是 ETHBerlin 的第二个迭代，它是一个编程马拉松，一个文化节，一个教育活动，一个黑客主义的平台，一个推动去中心化生态系统向前发展的社区倡议。德国，柏林。 重新安排 – 2019 年 9 月 27 日至 30 日： Offline Camp Oregon (opens new window) 现已延期，但它仍在计划中！这里是过去的露营者对我们独特的非会议形式的活动的评论。 # 感谢你的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍你。"
