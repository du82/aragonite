full_description = 'Blog & news IPFS 周报-51 默奕 23 July 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新你的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # 2019 IPFS 露营的第一批录音出来了! 你没看错,IPFS 露营的录音开始发布了！第一批: 闪电演讲和项目海报 (opens new window)，去看看吧！ # 加入 IRC 上的 IPFS、libp2p 和 IPLD 社区 \o/， 它很有趣! 友情提示我们亲爱的社区：IRC 和 Matrix 仍然是体验 IPFS、libp2p 和 IPLD 社区的最佳场所之一! 请进入 https://riot.im/app/#/group/+ipfs:matrix.org 加入我们的多种频道。 # IPFS 生态圈的动态 你在 Twitter 上关注 IPFS (opens new window) 吗? 关于新闻中 IPFS 的最新汇总，请查看我们的 Twitter 提要或查看有关 Awesome IPFS 的最新文章 (opens new window)。 视频: 点对点网络中的隐私 (opens new window)， Gonçalo Pestana，在 Data Terra Nemo，2019 年 7 月 22 日 深入了解 IPFS (5/6): 什么是 Libp2p? (opens new window) Coinmonks, 2019 年 7 月 21 日 星际哈希表… (opens new window), Textile, 2019 年 7 月 18 日 IPFS 可伸缩性: 构建 IPFS 第二层 (opens new window), Pinata, 2019 年 7 月 17 日 WORBLI 将为 EDNA 提供动力 (opens new window)，雅虎!金融，2019 年 7 月 17 日 谁是 Memo Labs? (opens new window) 2019 年 7 月 15 日 The Gathering 的构想 (opens new window)，Justin Maier，2019 年 7 月 12 日 150 万美元的资金和一个新篇章 (opens new window)，Textile，2019 年 7 月 11 日 建设世界上第一个 IPFS 数据中心 - 第 1 部分 (opens new window)，RTrade Technologies，2019 年 7 月 9 日 通过 Solidity 智能合同创造高效、可用和廉价的 IPFS 哈希存储 (opens new window)，Temporal，2019 年 7 月 9 日 IPFS 简介: 新的和改进的网络 (opens new window)，Temporal，2019 年 7 月 9 日 制作可以上传、Pin 和搜索 IPFS 的 Discord 机器人 (opens new window)，Temporal，2019 年 7 月 9 日 用 Lens 运行你自己的 IPFS 搜索引擎 (opens new window)，Temporal，2019 年 7 月 9 日 Temporal.cloud 简介 (opens new window)，2019 年 7 月 9 日 教程: 在 IPFS 上托管 Slate 文档 (opens new window)，2019 年 7 月 9 日 视频: MIX Acuity（去中心化浏览器）、挖矿、加密账户 (opens new window)，2019 年 7 月 3 日 由 Stove Labs & Tezos Commons 创建的 Staked Competitions (opens new window)，Tezos Insights & Updates, 2019 年 7 月 1 日 # 开放 IPFS 工作岗位 Textile.io 首席工程师，远程工作 (opens new window) IPFS 文档和技术内容策略师， (opens new window) Protocol Labs, 远程工作 UI/UX 设计师, (opens new window) Qri, 布鲁克林, 纽约 (美国) # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将你的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 go-stellar-ipfs (opens new window) 是一个库，搭建 Stellar 和 IPFS 之间的桥梁。 # 即将到来的社区活动 你知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 7 月 28 日: ProtoSchool - 上海分校：第四届技术沙龙 (opens new window)将聚焦于技术深度挖掘，并宣传去中心化存储网络及其发展中的生态系统。由上海去中心化系统会议集团主办。 2019 年 8 月 2 日至 5 日: Offline 夏令营 (opens new window)是 Oregon 州 Grants Pass 市的一个为期 4 天的活动，旨在探索 Offline First 的开发和设计。在这里了解更多关于这次活动的信息。 (opens new window) 2019 年 8 月 7 日: 巴黎 P2P (opens new window)将举办第一个活动，巴黎 P2P #0 (opens new window)，讨论点对点(P2P)、去中心化、网络和自治社区、分布式和去中心化系统等主题。请在此提交你对未来活动的演讲思路。 (opens new window) # 感谢你的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍你。'
