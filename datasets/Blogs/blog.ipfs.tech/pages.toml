title = "IPFS & libp2p Devs Go Independent: Meet Interplanetary Shipyard | IPFS Blog & News"
description = "Meet the team behind Interplanetary Shipyard, the newly created entity of many core maintainers behind the most popular implementations of IPFS and libp2p."
full_description = '''Blog & news IPFS & libp2p Devs Go Independent: Meet Interplanetary Shipyard Adin Schmahmann 08 April 2024 #ipfs #libp2p #shipyard #interplanetary shipyard Share this item: Twitter Facebook Last November, Protocol Labs, where IPFS was invented and incubated, announced its commitment to decentralizing project governance (opens new window). In this post, you'll hear from Adin Schmahmann of Interplanetary Shipyard, introducing the new team, its roadmap, and what this means for the IPFS community. Since its release nearly ten years ago, IPFS has become the connective tissue that powers the infrastructure layer for the decentralized web and connects web2 to web3. Well over 50 million monthly active users access IPFS-based applications, from ENS addresses (~90% of content hashes) to NFTs to blockchains to IoT to enterprise applications. IPFS has always been an open, decentralized, censorship-resistant protocol, and now the project itself is increasingly decentralized too. Now we’re delighted to announce our own "exit to community": Interplanetary Shipyard (opens new window), an independent collective of people maintaining many of the most popular implementations in the IPFS and libp2p ecosystem. Our founding team includes many longtime maintainers of widely-used IPFS and libp2p implementations and tools. Shipyard is laser-focused on supporting users of the open-source projects in the Interplanetary stack. We are committed to building bridges between web2 and web3 through open-source innovation. We work directly with teams building on IPFS and libp2p, both to troubleshoot and improve current implementations, and also to inform our public goods roadmap. We are registered as a Delaware nonstock corporation. Our current set of implementations maintained by Shipyard include: IPFS libp2p Boxo (GO SDK) Kubo (Server, Desktop, Brave) Rainbow (Gateway impl.) Someguy (Router impl.) Helia (JS SDK) verified-fetch (Web API for JS) Service Worker Gateway (impl. WIP) Bad Bits Denylist IPFS Companion (browser extension) IPFS Desktop (Windows/macOS/Linux) IPFS Cluster (on hold) ipfs.io (public utility) dweb.link (public utility) trustless-gateway.link (public utility) delegated-ipfs.dev (public utility) Amino DHT (public utility) IPFS Measurements go-libp2p js-libp2p rust-libp2p libp2p Measurements We have an extensive initiative roadmap (opens new window) and are eager to get more input from the developer community. To shout out just a few ideas we’re working on: Reliable, decentralized, and verified retrieval of CIDs (opens new window) (content identifiers) in browsers. The idea is to allow web browsers to fetch CIDs in a verifiable and trustless manner without being vulnerable to centralized chokepoints. You can participate and follow along with this work in the IPFS dApps Working Group (opens new window). IPFS for pioneers (opens new window). We aim to enable the building of interoperable IPFS systems using extremely minimal HTTP-based protocols so that building IPFS-compatible tooling in something like Python (that doesn’t have much IPFS or libp2p tooling today) is super easy and appealing. Self-service tooling for debugging IPFS request handling (opens new window). The idea here is that a user can hit a Boxo-based HTTP gateway and if they experience an error, get a link to download an IPFS request trace. They can then use easy tooling locally or centrally hosted to pinpoint the issue. About Shipyard IPFS is a big project with big ambitions of being the essential content addressing layer for the next generation of the internet. That ecosystem comes with a sprawling set of resources that IPFS users today depend on in some way, including: People and expertise Applications Libraries Networks Infrastructure Think of Shipyard as the union of dockworkers who send ships (projects) out onto the ocean of the distributed web, well-built and equipped with all they need to sail. The next era of the internet is still in its infrastructure phase; IPFS has already positioned itself as one of the core infrastructure layers for the next generation of the internet, and these implementations will be working with the foundation to continue to steward the project. We want the community to inform how we grow and sustain ourselves, and are eager for community input on our roadmap. We believe the builders growing IPFS, libp2p, and ProbeLab will thrive best together, under their own roof. So, a few questions might arise next. Why now? The set of projects leveraging IPFS and libp2p is now so broad and diverse that it exceeds the purview of one company. Open-source projects need to be managed and owned by their community. Consider the precariousness of core IPFS development being tied to a single company, and thus a single funding source. What if that company experiences a change in strategy? What if that funding source decides to prioritize something different from what the IPFS community believes is most important? In web2, the model for supporting and promoting open-source projects was to get the largest centralized players to pay their own employees to maintain the tooling. What does that model look like for the next generation of the internet? We want to let the community decide. We believe putting control of the IPFS stack in the hands of an independent collective will foster better resiliency, transparency, open-protocol governance, and long-term future health. By operating independently while collaborating publicly, we will build alongside other technical teams that rely on this essential infrastructure. Who maintains and funds this work? We're grateful to Protocol Labs, our anchor financial partner for 2024-2025, for its continued support. We’re thankful as well to our early ecosystem supporters and patrons including Optimism's RetroPGF grants, Cloudflare, Pinata, Fission, and CoopHive. We’re exploring multiple avenues for financial support, and in keeping with our new community collective approach, we’re thinking in public about what those avenues could be: public goods funding, community grants, commercial services, crypto-native funding, and more. Our team is raising an additional $3 million in community contributions to sustain our work as technical stewards in 2024. Here’s how you can support Shipyard: Support Public Goods Maintenance If you or your project depends upon IPFS or libp2p, we invite you to consider contributing toward the ongoing maintenance of these important protocols as a public good. You can donate directly to IPFS or libp2p through the Open Impact Foundation (opens new window). Hire Shipyard for Commercial Services In addition to public good funding, we are also beginning to support commercial service agreements for our core users, including service tiers, contracted support, and other embedded engineering work. You can check out our commercial services tiers (opens new window) or reach out directly if you have a project you’d like to collaborate with us on. We're excited for Shipyard's opportunity to strengthen the IPFS and libp2p ecosystems through community feedback and patronage. If you would like to get more involved we're in the IPFS (opens new window) and libp2p (opens new window) forums, and you can reach us at contact [AT] ipshipyard.com.'''
