["https://blog.ipfs.tech/zh-cn/ipfs-weekly-55"]
title = "IPFS 周报-55 | IPFS Blog & News"
description = "ZH - All the latest information about the IPFS Project in one place: blog posts, release notes, videos, news coverage, and more."
full_description = "Blog & news IPFS 周报-55 默奕 20 August 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新你的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 ###改进 IPFS 发布过程 go-ipfs 引入了一个新的发布周期和过程，以确保更可靠和更频繁的发布!查看IPFS 博客了解更多细节 (opens new window)。 # IPFS/LibP2P 服务台即将来到 ETHBerlin! 为了帮助开发人员快速跨越障碍，重新回到黑客解码，ETHBerlin 将提供一个专门的 IPFS/libp2p 服务台 (opens new window)供开发人员在编程马拉松期间访问。 # go-ipfs 0.4.22 发布 📣 请查看最近发布的基于 0.4.21 的 go-ipfs PATCH 版本 (opens new window)，其中包含一些关键修补。 # IPFS 生态圈的动态 你是否关注Twitter 上的 IPFS (opens new window)?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window). Tupelo 与 IPLD 和 IPFS (opens new window)， Topper Bowers, 2019 年 8 月 19 日 Berty 团队在 IPFS Camp (opens new window)， Berty, 2019 年 8 月 15 日 基准 IPFS 网关 (opens new window)， Aadhi Manivannan, 2019 年 8 月 13 日 开发者应对气候变化的责任 (opens new window)， Matthias Wahl, 2019 年 8 月 13 日 去中心化存储:引领数字化存储的转型 (opens new window)， MemoLabs, 2019 年 8 月 13 日 在 IPFS 上存储加密文件是否足够好? (opens new window) Michael Smolenski, 2019 年 8 月 12 日 下一代互联网将建立在区块链技术之上吗? (opens new window) 2019 年 8 月 12 日 我知道 IPFS, Qri 是怎么回事? (opens new window) 2019 年 8 月 12 日 以太坊经典令人惊叹的 Kademlia 系统 (opens new window)， Christian Seberino 博士，2019 年 8 月 12 日 迈向可相互操作的名称服务标准 (opens new window)，井上真 (Makoto Inoue），2019 年 7 月 15 日 如何在你的本地网络中启用 .Eth 域 (opens new window)，井上真，2019 年 7 月 8 日 如何使用 IPFS+ENS 托管你的 Dapp 并通过 EthDNS 访问它 (opens new window)， 井上真, 2019 年 6 月 21 日 # 更新和最新版本 查看生态系统中 IPFS 工具和项目的最新版本。 这就是即将到来的 IPFS 集群 0.11.0 (opens new window)。 Peergos v0.1.2 (opens new window) - 包括升级到 ipfs v0.4.22 和 Amazon S3 数据存储插件 # 开放 IPFS 工作岗位 React Native 开发员 (opens new window), Berty，巴黎，法国 Senior Backend Engineer (opens new window)，MXC 基金会 gGmbH，德国柏林 Golang 高级工程师 (opens new window)，Textile，远程工作 分布式系统技术主管，IPFS， (opens new window)，Protocol Labs，远程工作 IPFS 文档制作和技术内容策略师， (opens new window) Protocol Labs，Remote # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将你的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 介绍金字塔! (opens new window)加载页面并动态创建加密密钥对!它们的公共部分可以上传到 IPFS。IPFS 哈希可以在一个 stellar 交易中注册。 go-ipfs-log (opens new window) - Go 版本 的只能添加日志，CRDT 在 IPFS 上 Ambients 的编码示例 (opens new window)——使用 Robust Ambients 微积分的计算抽象示例 TMFS: 一个 IPFS 概念设计 (opens new window) IPFS 内容分布检查器 (opens new window):一个简单的 IPFS 内容分布检查器工具 # 即将到来的社区活动 你知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 8 月 21 日至 23 日： 柏林 DappCon (opens new window)：以太坊 Dapps、基础设施和令牌工程全球开发者大会，德国，柏林。 2019 年 8 月 22 日： 西雅图 ProtoSchool 将举办 8 月去中心化网络会议 (opens new window)，详情待宣布! 美国，华盛顿州，西雅图。 2019 年 8 月 23 日: 分布式存储峰会 (opens new window)德国柏林。 2019 年 8 月 23 日至 25 日： ETHBerlinZwei (opens new window) 是 ETHBerlin 的第二个迭代，它是一个编程马拉松，一个文化节，一个教育活动，一个黑客主义的平台，一个推动去中心化生态系统向前发展的社区倡议。德国，柏林。 2019 年 8 月 31 日： ProtoSchool -上海分会: 技术沙龙会第 5 期 (opens new window): ProtoSchool - 上海分会是一群热爱去中心化网络，乐于学习、教学和分享想法的人。欢迎加入! 中国，上海。 2019 年 8 月 7 日： 巴黎 P2P (opens new window) 是一个由 P2P 和密码学爱好者组织的每月一次的会议。法国，巴黎。 2019 年 9 月 16 日:维多利亚科技大会 2019 年 9 月 (opens new window):一旦他们确定了日期和地点，就报名参加!加拿大，不列颠哥伦比亚省，维多利亚 重新安排 – 2019 年 9 月 27 日至 30 日： Offline Camp Oregon (opens new window) 现已延期，但它仍在计划中！这里是过去的露营者对我们独特的 (opens new window), 专注于离线优先 (opens new window)的网络开发和设计方法的非会议形式的活动的评论。 # 感谢你的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍你。"
