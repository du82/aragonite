["https://blog.ipfs.tech/zh-cn/ipfs-weekly-56"]
title = "IPFS 周报-56 | IPFS Blog & News"
description = "ZH - All the latest information about the IPFS Project in one place: blog posts, release notes, videos, news coverage, and more."
full_description = "Blog & news IPFS 周报-56 默奕 27 August 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新你的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # IPFS 生态圈的动态 你是否关注Twitter 上的 IPFS (opens new window)?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window)。 Package chain 项目概述 (opens new window), David Craven, 2019 年 8 月 24 日 幻灯片: go-libp2p-noise (opens new window), Ed Mazurek, ETHBerlinZwei, 2019 年 8 月 24 日 我如何使用 3Box 来构建一个完整堆栈的 Dapp (opens new window), Pedro Gomes, 2019 年 8 月 23 日 用简单方法添加认证到您的应用程序 (opens new window), 2019 年 8 月 23 日 去中心化云存储正在改变互联网的面貌 (opens new window), Hackernoon, 2019 年 8 月 21 日 IPFS 和 EdgeFS 在 Secure Edge/IoT 计算用例方面的比较 (opens new window), Hackernoon, 2019 年 8 月 21 日 创建一个 Caelum 主节点 —— 有多容易? (opens new window) Pro Cryptologist, 2019 年 8 月 21 日 视频: 释放去中心化的力量: 如何使用 IPFS 构建不可阻挡的应用程序 (opens new window), Andrew Hill 在 Commit Porto '19, 2019 年 8 月 20 日 扩展下一代互联网 (opens new window), Temporal, 2019 年 8 月 20 日 在 GeeSome 和用于去中心化社交网络的 IPFS 协议的帮助下，如何才能让互联网再次变得伟大? (opens new window) Social Network, 2019 年 8 月 20 日 ttcX: 将 Top Trading Cycle 算法应用于 NFT exchange (opens new window), The Block Genesis, 2019 年 8 月 16 日 用于区块链网络的分布式存储系统的类型 (opens new window), Incubicon blog, 2019 年 8 月 8 日 使用 IPFS 去中心化我的网站 (opens new window), Henrique Dias, 2019 年 8 月 7 日 # 更新和最新版本 查看生态系统中 IPFS 工具和项目的最新版本。 MIX Acuity 1.0.3 发布! (opens new window) 修复了 IPFS 传播回归、交易历史上显示错误等问题。 # 开放 IPFS 工作岗位 React Native 开发员 (opens new window), Berty，巴黎，法国 +高级后端工程师 (opens new window)，MXC 基金会 gGmbH，德国柏林 Golang 高级工程师 (opens new window)， Textile，远程工作 分布式系统技术主管，IPFS， (opens new window)，Protocol Labs，远程工作 IPFS 文档制作和技术内容策略师， (opens new window) Protocol Labs，远程工作 # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将你的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 SimpleID (opens new window) – 隐私性、安全性和便利性都集成到一个简单的开发人员体验中。在 10 分钟内将去中心化的身份验证和存储添加到应用程序。 InterPlanetary Wayback (opens new window): 使用 IPFS 的分布式的和持久性的存档重播系统 BitTube (opens new window) 重塑了网络货币化的运作方式。在无广告的环境中，隐私的浏览和支持每一个你访问的发布者。你的时间毫无疑问地为新的注意力经济提供动力。 # 即将到来的社区活动 你知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 8 月 29 日: Graphs with Friends 将主持 dweb 上的隐私 (opens new window). 讨论分布式系统中的隐私保护、元数据的阻力、跟踪和匿名问题。英国伦敦 2019 年 8 月 31 日： ProtoSchool -上海分会: 技术沙龙会第 5 期 (opens new window): ProtoSchool - 上海分会是一群热爱去中心化网络，乐于学习、教学和分享想法的人。欢迎加入! 中国，上海。 3 September 2019: Ethereum Hack Tokyo 将主持 17 - 接触和学习 IPFS (分布式存储)) (opens new window)，为了解以太坊但不了解 IPFS (分布式存储)的人士而设。Chiyoda-ku, 东京,日本。 2019 年 9 月 4 日： 巴黎 P2P (opens new window) 是一个由 P2P 和密码学爱好者组织的每月一次的会议。法国，巴黎。 2019 年 9 月 16 日:维多利亚科技大会 2019 年 9 月 (opens new window):一旦他们确定了日期和地点，就报名参加!加拿大，不列颠哥伦比亚省，维多利亚 2019 年 9 月 20-22 日: 我们的网络 2019 RE: 基础设施 (opens new window) 探讨对替代网络实践(新协议、对等连接、离线优先计算和基于社区的治理)的集体关心和维护。多伦多,加拿大安大略省。 重新安排 – 2019 年 9 月 27 日至 30 日： Offline Camp Oregon (opens new window) 现已延期，但它仍在计划中！这里是过去的露营者对我们独特的 (opens new window), 专注于离线优先 (opens new window)的网络开发和设计方法的非会议形式的活动的评论。 # 感谢你的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍你。"
