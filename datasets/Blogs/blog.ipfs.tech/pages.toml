title = "IPFS News Issue 202 | IPFS Blog & News"
description = "Featuring the announcement of IPFS Camp 2024 and pre-reregistration for this year's exciting event!"
full_description = "Blog & news IPFS News Issue 202 28 February 2024 #newsletter Share this item: Twitter Facebook # Pre-register for IPFS Camp 2024 🔭 Drumroll please... 🥁 IPFS Camp 2024 is coming soon! This event is for those who want to bend the arc of the Internet to be more open, efficient, and secure. 🗓️ July 11-13, 2024 📍 Brussels, Belgium This will be the most exciting IPFS event yet! Connecting builders and users, organized by thematic tracks, and inspired by the in-depth conversations and unbounded energy of previous IPFS gatherings, it will be an event to remember. IPFS Camp 2024 tracks include: Decentralized Apps and Publishing, Public Records and Human Rights, CIDs in the Age of Generative AI, Syncing Bytes at Scale, Libp2p Day... & more! Pre-register to save the date # Brand New on IPFS ✨ Interplanetary Shipyard needs your help raising $3 million (opens new window) The core maintainers of several key IPFS implementations now operate as a separate team in the Protocol Labs network known has Shipyard – and they need your help! They're raising $3M in community contributions to sustain their work as technical stewards in 2024. Learn more and contribute here! (opens new window) Strategy for transitioning IPFS chat away from the Filecoin Slack (opens new window) With the IPFS project continuing to mature, there is an increasing need for chat to begin shifting away from Filecoin Slack to its own communication platforms in order to avoid confusion and brand overlap. Check out the proposal on the forum! (opens new window) New Public Utilities docs page (opens new window) These utilities make it easier to retrieve data from the IPFS network in resource-constrained environments such as browsers and low-powered devices. Check out the new page here! (opens new window) New Release: Kubo v0.27.0 (opens new window) Gateway: support for /api/v0 is deprecated IPNS resolver cache's TTL can now be configured RPC client: deprecated DHT API, added Routing API Deprecated DHT commands removed from /api/v0/dht Repository migrations are now trustless New Release: Boxo v0.18.0 (opens new window) Popular on the Forums (opens new window) General: Setup advice - use case (opens new window) General: Updates on advancing IPFS project governance (opens new window) Comms WG: Strategy for transitioning IPFS chat away from Filecoin Slack (opens new window) Protocol: IPNS discovery using DIDs (opens new window) ProbeLab Network Weekly Reports (opens new window) # Around the Ecosystem 🌎 Lighthouse announces Desktop app (opens new window) Lighthouse offers perpetual storage on Filecoin and IPFS. Initially a developer tool with SDKs, Lighthouse is now available to any desktop user through their new app. Learn more and register for the closed beta! (opens new window) 4 new demos and tutorials from Agregore (opens new window) See how to build a basic chat app with the pubsub:// protocol that is part of IPFS, upload full directories, and build a drag-and-drop uploader. Check out the latest demos here! (opens new window) DScan: Own Your Identity, Own your Data (opens new window) Check out this Chrome extension that uploads content to IPFS and generates decentralized QR codes for easy file sharing. Dscan uses DIDs and UCAN for robust, decentralized user permissions. Download the extension here! (opens new window) # Have something you want featured? 📥 If you have something exciting or important that you think the IPFS community should know about, then you can submit this form (opens new window) to have it be considered for inclusion in the IPFS newsletter. Submit form"
