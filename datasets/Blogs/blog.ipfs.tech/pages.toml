title = "IPFS 周报-11 | IPFS Blog & News"
description = "ZH - All the latest information about the IPFS Project in one place: blog posts, release notes, videos, news coverage, and more."
full_description = "Blog & news IPFS 周报-11 Jenn Turner 25 September 2018 #weekly Share this item: Twitter Facebook # 欢迎回到 IPFS 周报！👋 InterPlanetary File System (IPFS, 星际文件系统) (opens new window) 是一种新型的，基于内容和身份的，超媒体分发协议。IPFS 使得开发完全分布式的应用程序成为可能。它旨在使网络更快、更安全、更开放。因为这是一个相当大范围的任务，在这篇周报中，我们跟踪、汇总了（IPFS）整个生态系统的发展。 想参与进来吗？点击下面的一些链接，看看我们在 GitHub 上做了什么，或者在 IRC 上加入我们（Freenode 网络上的#ipfs）。 希望收到邮件更新吗？订阅我们的每周通讯！ 以下是自上一期 IPFS 周报以来的一些新亮点： 最新进展： IPFS 现已有 22 种语言支持，更多的语言还在加入中。得益于最近的“IPFS 本地化”努力，IPFS 正在向全世界进发！ CloudFlare 加入了我们的星际任务 (opens new window)。尝试下 CloudFlare 的 IPFS 网关，该网关是在其第一次的 Crypto Week 活动中宣布的。 观看 9 月 18 号发布的最新的“动态数据及能力工作小组”会议视频 (opens new window)，迅速了解关于身份管理的演示和讨论。 第一次柏林 IPFS 会议将于 10 月 11 日举行！在此处注册参加 Meetup (opens new window)。 IPFS 的 JavaScript 实现版本刚刚有了新的主页：js.ipfs.tech (opens new window)。 野生态 IPFS： 你有在推特上关注 IPFS (opens new window)吗？对于最新的新闻中提到的 ipfs，请查看我们的 twitter feed 或阅读：关于最棒的 ipfs 的最新文章 (opens new window)。 Dweb: Creating Decentralized Organizations with Aragon (opens new window), （DWeb：使用 Aragon 来创建去中心化组织）作者：Mozilla Hacks, 2018 年 9 月 19 日 End-to-End Integrity with IPFS (opens new window), （IPFS 的点到点完整性）作者：Cloudflare, 2018 年 9 月 17 日 CloudFlare’s IPFS Gateway Makes it Easy to Create Distributed Web Sites (opens new window), （CloudFlare 的网关大大简化了分布式网站的构建）2018 年 9 月 17 日 An Interview with Textile (opens new window), （对 Textile 的采访）（译者注：该采访由星鉴网完成）2018 年 9 月 13 日 The Centralized Secret (opens new window), （中心化的秘密）2018 年 9 月 12 日 Decentralisation: the next big step for the world wide web (opens new window), （去中心化：万维网的下一个里程碑）作者：The Guardian （卫报），2018 年 9 月 8 日 Swapping bits and distributing hashes on the decentralized web (opens new window), （在去中心化网络上交换比特，分发哈希），2018 年 9 月 4 日 Introducing Origin Messaging: Decentralized, Secure, and Auditable (opens new window), （起源信息简介：去中心化，安全和审查）作者：Origin，2018 年 8 月 29 日 Dweb: Building Cooperation and Trust into the Web with IPFS (opens new window), （DWeb：使用 IPFS 技术，将合作与信任融入到网络中）作者：Mozilla Hacks，2018 年 8 月 29 日 软件更新和新版本发布： 以下是 IPFS 工具和 IPFS 生态项目的发布情况： ipfs-cluster 0.5.0 (opens new window) – IPFS Cluster 是一个独立的程序和命令行客户端；可以在 IPFS daemon 的集群上分配、复制以及追踪 pins go-ipfs 0.4.17 (opens new window) – IPFS 在 Go 语言上的实现 ipfs-companion v2.5.0.11550 (Beta) (opens new window) – 一个大大简化了 IPFS 资源获取过程的浏览器插件，开发人员和爱好者可以选择使用我们的浏览器插件的手工选择的开发版本 js-ipfs v0.32.0 (opens new window) – IPFS 在 JavaScript 语言上的实现 npm-on-ipfs v0.6.4 (opens new window) – 📦 通过 IPFS 安装 npm 模块！ Replicated Object Notation 2.1 (opens new window) – 一个分布式的实时数据格式 DNSLink Detection in IPFS Companion: 我们的浏览器插件现在可以在默认模式下检测 DNSLink，访问docs.ipfs.tech (opens new window) 或者tr.wikipedia-on-ipfs.org (opens new window)，你就可以从 IPFS，而不是 HTTP 上加载它，通过以下链接获取更加详细信息:DNSLink Support in IPFS Companion (opens new window) Qri 0.5.2 (opens new window), 即 Prune Norwegian Buhund, 在此！ The Graph Development Update (opens new window), 2018 年 9 月 13 日 Polkadot PoC-2 在此 (opens new window): Parachains, 运行更新，libp2p 更新 我们喜爱的工具和项目： Awesome IPFS （完美 IPFS） (opens new window)是由社区维护和更新的，包括了一系列的工具、项目，以及基本上与 IPFS 相关的很棒的一切。查看更多，或将你的项目添加到其中，请访问以下 Github 地址：Awesome IPFS on GitHub (opens new window) Neocities hit 200K sites this month! (opens new window) （Neocites 这个月达到了 20 万个网站！） are we distributed yet? (opens new window) （我们已经实现分布式了吗？） Pinata (opens new window), 轻松自如的在 IPFS 上部署. 社区活动： 你知道 ipfs 有一个社区论坛 discuss.ipfs.tech 吗？报名参加关于编码的讨论，教程，请参阅通知并了解即将到来的社区活动。 35th Chaos Communication Congress (opens new window) （第 35 届混沌通讯议会）CFP 现已开放 新的见面会提醒:peer to peer ÖRESUND (opens new window), 地点：瑞典马尔默 时间：10 月 27 日 在此注册，接收 IPFS 里斯本会议的通知 (opens new window) 感谢阅读 ☺️ 以上就是本周关于 IPFS 一切的新闻。如果我们错过了什么，请回复这个邮件，让我们知道！这样我们就可以在下次周报中介绍您了。"
