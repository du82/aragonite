full_description = "Blog & news IPFS 周报-58 默奕 10 September 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新你的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # 查看带有新功能的 IPFS 桌面的最新版本! 0.9.0 版本 (opens new window)现在允许您导航，不仅可以导航您自己的文件和 pin，还可以导航整个 /ipfs 和 /ipns 领域。 # 同步服务已经从 Consul 迁移到 Redis 了解权衡和原型解决方案， (opens new window)请参见在我们的 testground。然后，你自己试试吧! # IPFS 生态圈的动态 你是否关注Twitter 上的 IPFS (opens new window)?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window)。 使用 docker-compose 和 certbot 设置 IPFS 节点 (opens new window), Will Schenk, 2019 年 9 月 7 日 企业 IPFS 提供真正的供应链起源 - 第一部 (opens new window), RTrade Technologies, 2019 年 9 月 6 日 视频:Topper 与 IPFS 社区讲 Tupelo (opens new window), 2019 年 9 月 5 日 教程:如何构建 IPFS 和文本通知 App (opens new window), SimpleID, 2019 年 9 月 5 日 在 IPFS 上分步指导构建一个独立的 Notes App (opens new window), Hackernoon, 2019 年 9 月 4 日 视频: Open Source Coin & Radicle - 巴塞罗那自由软件 (opens new window), KDE España, 2019 年 9 月 4 日 区块链应用程序开发介绍 - 第 2 部分 (opens new window), Kristjan Kosic, 2019 年 9 月 4 日 视频: 18 - 去中心化数据库面板: GunDB, Textile, Fluence, VulcanizeDB (opens new window), 去中心化存储峰会 2019，2019 年 9 月 3 日 RTrade Technologies 与 Textile 合作，为 Textile Cafe 提供数字基础设施 (opens new window), Temporal, 2019 年 9 月 3 日 教程:在 IPFS 上构建零依赖 Notes App - 第 2 部分 (opens new window), SimpleID, 2019 年 9 月 3 日 视频: EO 数据挑战建议 (opens new window), Teodora Selea、Ivian Adrian Albu、Bang Pham Huu、Vasil Yordanov、 Iván Sánchez Ortega、 Candan Eylül Kilsedar 和 Volker Mische for FOSS4G 2019, 2019 年 8 月 30 日 视频: IPFS 上的 Geodata (opens new window), Volker Mische for FOSS4G 2019, 2019 年 8 月 29 日 文章: 协议，而不是平台: 一种实现言论自由的技术途径 (opens new window), Knight First Amendment Institute 在哥伦比亚大学, 2019 年 8 月 21 日 # 更新和最新版本 查看生态系统中 IPFS 工具和项目的最新版本。 Go 的最新发布, 版本 1.13 (opens new window), Go 1.12 发布六个月后到达。 Lighthouse 更新 #15 (opens new window): 即将来到一个您附近的多客户端 testnet! # 开放 IPFS 工作岗位 React Native 开发员 (opens new window), Berty，巴黎，法国 高级后端工程师 (opens new window)，MXC 基金会 gGmbH，德国柏林 Golang 高级工程师 (opens new window)， Textile，远程工作 分布式系统技术主管，IPFS， (opens new window)，Protocol Labs，远程工作 IPFS 文档制作和技术内容策略师， (opens new window) Protocol Labs，远程工作 # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将你的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 Dicoogle IPFS 存储插件 (opens new window) – 一个 Dicoogle 插件，支持通过 IPFS 存储文件。 Elastos Hive (opens new window) 是为应用程序提供去中心化存储功能的基本服务基础设施 GitHuman (opens new window) — GitHub 和 GitLab 的去中心化替代 # 即将到来的社区活动 你知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 9 月 16 日: 维多利亚科技大会 2019 年 9 月 (opens new window):一旦他们确定了日期和地点，就报名参加!加拿大，不列颠哥伦比亚省，维多利亚 19 September 2019: 旧金山 IPFS 将在 Starfish Mission 主持 IPFS 是如何工作的 (opens new window) ，请报名参加，并学习更多有关 IPFS 及其实际工作原理的知识! 美国旧金山 2019 年 9 月 20-22 日: 我们的网络 2019 RE: 基础设施 (opens new window) 探讨对替代网络实践(新协议、对等连接、离线优先计算和基于社区的治理)的集体关心和维护。多伦多,加拿大安大略省。 2019 年 9 月 27 日至 30 日： Offline Camp Oregon (opens new window) 现已延期，但它仍在计划中！这里是过去的露营者对我们独特的 (opens new window), 专注于离线优先 (opens new window)的网络开发和设计方法的非会议形式的活动的评论。 28 September 2019: ProtoSchool -上海分会: 技术沙龙会第 6 期 (opens new window) 将在漕河泾国际孵化中心举行。中国上海。 # 感谢你的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍你。"
