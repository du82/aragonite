full_description = '''Blog & news IPFS on the Web in 2024: Update From Interplanetary Shipyard Daniel Norman 25 November 2024 #ipfs #cid #web platform #browsers #WebRTC #WebTransport #WebSockets #AutoTLS #Let's Encrypt Share this item: Twitter Facebook # Update From Interplanetary Shipyard Earlier this year, we introduced Interplanetary Shipyard (opens new window), as the evolution of the maintainers leading the open-source development of libp2p and the most popular IPFS implementations, tooling and infrastructure. In our introduction, we shared our roadmap and vision, a key part of which is to make IPFS work on the web. In this blog post, we'll share all the progress we've made since then and what we have planned for the future. # IPFS on the Web For as long as IPFS has existed, one of the key goals has been to make it possible to use IPFS on the web. That is, resilient, decentralized, and verified data retrieval on the Web. But what does it mean for IPFS to work on the Web? Resilient: Data is retrievable in a browser even if some providers go offline. Decentralized: You can connect to other peers from a browser for content routing and retrieval while immune to censorship and chokepoints that disrupt the network. Verified: You verify data locally, ensuring integrity without assuming trust (aka trustless). Data refers to anything that can be addressed by a CID: files, directories, web apps/dapps, videos, etc. While the Web platform has by far the widest reach, it's also the most challenging platform to make IPFS work on due to the inherent constraints of the platform and the discrepancies between browsers. Gateways like ipfs.io are a double-edged sword, because they make IPFS content accessible to the web, but they also highlight the challenges of IPFS on the web. Initially conceived as a crutch to bootstrap the network until a more decentralized and resilient solution was in place, public gateways became entrenched as the default to access IPFS content on the web to the detriment of the principles of IPFS. At Interplanetary Shipyard (opens new window), we've been tackling this challenge head on with a number of projects across the libp2p and IPFS stacks to make IPFS on the web a reality: Verified Fetch Service Worker Gateway New browser transports AutoTLS with libp2p.direct IPFS over HTTP Browser Developer Tools Delegated Routing HTTP API Bitswap improvements libp2p improvements Let's take a look at each of these projects in more detail. # Verified Fetch Verified Fetch (opens new window) is a TypeScript library for verified retrieval of IPFS content we released earlier this year (opens new window) and built on top of Helia (opens new window). We designed it to make IPFS retrieval by CID as easy as the Fetch API (opens new window) that most developers are already familiar with. We focused on getting a seamless developer experience with a simple API, while abstracting away all the complexities of IPFS: content routing, transports, and verification. Verified Fetch works great for loading content-addressed static assets or sub-resources asynchronously as part of a web app or dapp, for example, images, videos, or JSON. From a developer experience standpoint, Verified Fetch follows the following pattern: Take a CID as input Return a Response object (opens new window) This foundational API surface, while simple, enables a wide range of retrieval use-cases while abstracting away the complexities of data types, content routing, transports and verification. Moreover, returning a Response object allows for easy integration with the browser's caching mechanisms and use in Service Workers (opens new window). Verified Fetch is great for loading content-addressed static assets or "sub-resources" asynchronously, for example, images, videos and even IPLD encoded data. See the Pen @helia/verified-fetch Direct Retrieval with Libp2p by Daniel Norman (@2color) on CodePen. Install Verified Fetch But what about loading full dapps or websites from IPFS? Unlike static assets, web apps and websites require a way to resolve standard URLs to their corresponding content addressed resources. This is where the Service Worker Gateway comes in, which builds on top of Verified Fetch. # Service Worker Gateway The Service Worker Gateway (opens new window) is a Web native IPFS gateway that runs in the browser. It implements the IPFS Gateway spec (opens new window) in a Service Worker (opens new window) and fetches IPFS content directly from providers on the network in addition to verifying it locally. In a previous blog post (opens new window), we looked at how web publishing works with IPFS. This can be summarized as: The web app is static, i.e. just files and directories containing HTML, JS, CSS, images, etc. that make up the app. This is typically the build output of a frontend framework or a static site generator. The web app's build outputs are encoded with UnixFS (opens new window) and addressed by a CID (opens new window) which represents the root of the app (see diagram below). There are IPFS nodes (aka providers) that have the blocks for the CID. # Decentralized Frontends with the Service Worker Gateway The Service Worker Gateway unleashes new possibilities for decentralized web publishing: Decentralized: with peer-to-peer retrieval. Trustless: with local verification, removing the implicit trust in any given gateway or provider. Offline use: Visited pages are cached in the Cache API, enabling offline support for every static web app. Try the Service Worker Gateway For example, the IPFS blog is statically generated and has a distinct CID for each version. With the help of Fleek, each build is encoded with UnixFS, given a CID (opens new window) and provided to the IPFS network. The DNSLink (opens new window) record is also updated to the latest release CID. Now, instead of using a trusted gateway, e.g. https://blog-ipfs-tech.ipns.dweb.link/, you can load the blog using the Service Worker Gateway at blog-ipfs-tech.ipns.inbrowser.link (opens new window). Note: There's an inherent trade off with the Service Worker Gateway: it requires an initial upfront cost of fetching and installing the Service Worker which fetches and verifies data. This is why the first load may be slower than using a trusted gateway. # Note on composability The Service Worker Gateway also highlights the focus on composability across the JavaScript/TypeScript implementations of IPFS and libp2p: The Service Worker Gateway (opens new window) depends on Verified Fetch (opens new window), which depends on Helia (opens new window) which depends on js-libp2p (opens new window). # Service Worker Gateway: What's new As we embarked on this project, we focused on getting the basics right: Service Worker lifecycle management with custom gateways and delegated routing configuration. Subdomain origin isolation according to the Subdomain Gateway specification (opens new window). Testing infrastructure to ensure compliance with the specs. Basic error handling and fallback to trusted gateways. Correct caching of assets. Division of responsibilities between the Verified Fetch library and the Service Worker Gateway to ensure they are both useful without duplicating functionality. HTTP retrieval from recursive gateways and HTTP gateway providers. Note: There's a subtle difference between recursive gateways and HTTP gateway providers. Recursive gateways, like ipfs.io and trustless-gateway.link, will fetch content by CID from providers when the content is not locally available. HTTP gateway providers on the other hand, are IPFS HTTP gateways discovered via the IPNI (opens new window) (with the transport-ipfs-gateway-http protocol) that only return blocks for CIDs they have. Over the last few months, we've been improving the reliability and user experience. Most importantly, we've added support for direct peer-to-peer retrieval with js-libp2p under the hood. This means that the Service Worker Gateway can now leverage a broader set of provider peers that have either WebTransport or Secure WebSocket enabled. This brings us to the next topic: browser transports, which play a crucial role in making both IPFS and libp2p on the web a reality. # Browser transports Browser transports (protocols) are the bread and butter of the web and the Achilles heel of IPFS on the web. If you can't communicate with other peers, you can't do much. Browsers communicate over the internet using a number of transport protocols, each with their own strengths and weaknesses. Assuming a web app is in a Secure Context (opens new window), i.e., served over HTTPS as most modern web apps are, the following transport protocols are available: HTTPS: Request/Response HTTP over TLS. Secure WebSocket: Secure bidirectional streaming communication over WebSockets. WebRTC: Initially conceived for real-time browser-to-browser communication, e.g. for video, audio, and data streaming. WebTransport: A QUIC based replacement for WebSockets. The following table summarizes the capabilities of each transport: Bi-directional streaming Requires TLS Certificate and domain Widely supported Useable in Service Worker Browser-to-Browser HTTPS ❌ ✅ ✅ ✅ ❌ Secure WebSocket ✅ ✅ ✅ ✅ ❌ WebRTC ✅ ❌ ✅ ❌ ✅ WebTransport ✅ ❌ ❌ ✅ ❌ Note: while streaming is technically possible with HTTPS, browsers don't allow reading from the response until the request has been fully sent. See this issue (opens new window) for more details. # HTTPS and Secure WebSockets HTTP is widely supported in browsers and implementations of IPFS. Perhaps most common is the IPFS HTTP Gateway (opens new window), a general purpose retrieval API with HTTP semantics that is broadly used in IPFS implementations, tooling and infrastructure. # Request/Response vs Bi-directional streaming Request/response protocols like HTTP are not very well suited for streaming protocols like Bitswap (opens new window). WebSocket (and WebRTC and WebTransport), are bi-directional streaming protocols and are well suited for libp2p based protocols like Bitswap. What's more, WebSockets are supported in all modern browsers and are compatible with Service Workers. # TLS certificates for HTTP and WebSockets Where things get slightly tricky is TLS for both HTTP and WebSockets, i.e. HTTPS and Secure WebSockets, which are required by Secure Contexts and Service Workers. HTTPS and Secure WebSockets require a CA-signed TLS certificate and a domain, which most peers in the IPFS network do not have by default. To address this, we've been working on a project to automate the issuance of wildcard Let's Encrypt TLS certificates for all publicly dialable IPFS nodes. More on that in the AutoTLS section below. # WebRTC WebRTC is a browser-to-browser communication protocol, e.g. for video, audio, and data streaming. In the context of IPFS and libp2p, there are two implementations of WebRTC (opens new window): WebRTC: for browser-to-browser communication. WebRTC-Direct: for browser-to-server communication without the need for trusted TLS certificates. The spec for WebRTC for browser-to-browser communication in libp2p (opens new window) was ratified last year and includes a decentralized signalling mechanism for exchanging SDPs that leverages Circuit Relays. We've written an extensive guide (opens new window) to help you get started and also ran a workshop at IPFS Camp. It's also used by Universal Connectivity (opens new window) and IPFS Share (opens new window) to demonstrate the possibilities of browser-to-browser communication. We've also seen the ecosystem thrive with projects like Topology (opens new window), OrbitDB (opens new window), and Canvas (opens new window) that rely on js-libp2p and WebRTC as the foundation for their browser-to-browser communication. It's also worth noting that WebRTC is the only browser transport with a mechanism for NAT hole-punching, which is the process of establishing a direct connection between two peers through a network address translator (NAT). This is a crucial part of establishing a direct connection between two peers in a decentralized network like IPFS. # WebRTC-Direct WebRTC-Direct was designed a transport protocol to allow browser-to-server communication without the need for a domain name and CA-signed TLS certificates. WebRTC-direct is stable as of go-libp2p v0.36.1 (opens new window) and enabled by default in Kubo as of 0.30.0 (opens new window). This is a huge milestone, because it means that browsers can dial publicly reachable IPFS nodes with WebRTC-direct enabled without TLS certificates or domain names. We therefore recommend upgrading to the latest version of Kubo to take advantage of this. # Limits of WebRTC in browsers There are two caveats with WebRTC in browsers: WebRTC isn't available in Service Workers. Chrome limits the number of WebRTC connections per window to 500 (opens new window) after which it will prevent establishing new connections. # WebTransport Two years ago, the IPFS and libp2p projects made a bet on the promise of WebTransport (opens new window) and it's been a bumpy road. WebTransport is a promising protocol, especially for libp2p and IPFS, because it allows bi-directional streaming communication with many modern improvements over WebSockets, without the need for CA-signed certificates and a domain. This was a game changer, since most peers in the IPFS network do not have a domain name. However, the WebTransport specification is still in draft, and browser implementations have had a number of bugs and issues (opens new window), that we've been working with the browser vendors to address. As such, browser compatibility breaks as soon as the interoperability target changes. While we still believe in the longer term promise of WebTransport, we've reoriented our immediate priorities to WebRTC-Direct (which is now available) and Secure WebSockets (see AutoTLS below) . Nonetheless, we continue to work with browser vendors and standard bodies to get WebTransport to a stable and interoperable state. # AutoTLS with libp2p.direct AutoTLS is a new feature that significantly improves how browsers (Helia, Service Worker) can connect to Kubo nodes. As mentioned above, Secure WebSockets is the only streaming transport that works reliably in Service Workers, but requires a TLS certificate and domain. To overcome this, the Shipyard team has been working on a project to automate the issuance of wildcard TLS certificates for publicly dialable Kubo nodes. This way, nodes can use Secure WebSockets libp2p transport (opens new window) without needing to register a domain name. We call this service AutoTLS and it's powered by the libp2p.direct domain. AutoTLS (opens new window) enables publicly reachable Kubo nodes, i.e. nodes dialable from the public internet, to get a wildcard TLS certificate unique to their PeerID at *.<PeerID>.libp2p.direct without needing to register and configure a domain name. This enables direct libp2p connections and direct retrieval of IPFS content from browsers using Secure WebS'''
