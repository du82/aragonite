description = "Welcome to IPFS News 204! Featuring @helia/verified-fetch and the IPFS Camp 2024 track list."
full_description = "Blog & news IPFS News Issue 204 30 April 2024 #newsletter Share this item: Twitter Facebook # Register for IPFS Camp 2024 Register soon and take advantage of an 8% off early bird discount. IPFS Camp is for those who want to bend the arc of the Internet to be more open, efficient, and secure. This will be the most exciting IPFS event yet! Connecting builders and users, organized by thematic tracks, and inspired by the in-depth conversations and unbounded energy of previous IPFS gatherings, it will be an event to remember. 🗓️ July 11-13, 2024 📍 Brussels, Belgium Register Today # Brand New on IPFS ✨ Announcing @helia/verified-fetch (opens new window) The fetch-like, Web native abstraction for retrieving content from IPFS-compatible networks has been released. Read the blog post to learn more! (opens new window) Announcing the IPFS Camp 2024 Track List (opens new window) To give you a taste of what kinds of topics IPFS Camp will cover this year, we’re excited to share the 2024 track list. If any of the tracks sparks your imagination or gives you an idea for something you’d like to present, be sure to submit a proposal for a talk. We’d love to hear from you! Check out the track list! (opens new window) Helia Survey (opens new window) The Shipyard team leading the development of Helia is conducting a survey to learn about how Helia is used so that we can make it better. Your feedback will help us understand developer needs, challenges, as well as inform our priorities and shape Helia’s roadmap. Fill out the survey! (opens new window) Kubo v0.28.0 (opens new window) LAN and Loopback IPs are not announced when not useful, Pin roots are now prioritized when announcing, Sunset deprecated RPCs and features. Rainbow v1 (opens new window) Performant IPFS gateway based on boxo, also replaced Kubo as backend of public gateways ipfs.io, dweb.link, and trustless-gateway.link Iroh v0.14.0 (opens new window) Dial by just a Node ID Faster relay handshakes Basic Author API Upgrade redb to v2.0 Iroh v0.15.0 (opens new window) Graceful Shutdown Integrated Downloader Expanded Support for dialing by only NodeID More binaries Breaking Changes Someguy v0.2 (opens new window) Popular on the Forums (opens new window) Local.storage - self hosted w3storage backend (opens new window) Next steps for the IPFS Community Calendar (opens new window) Does ipfs takes more time to upload and download encrypted data? (opens new window) Retrieve content using cid from ipfs cluster (opens new window) ProbeLab Network Weekly Reports (opens new window) # Around the Ecosystem 🌎 IPFS & libp2p Devs Go Independent: Meet Interplanetary Shipyard (opens new window) Learn more about the new independent collective of people maintaining many of the most popular implementations in the IPFS and libp2p ecosystem. Read the new blog post! (opens new window) Fireproof Roadmap Update (opens new window) The Fireproof team has shared an in-depth update on what they're up to and where they're going. Check it out! (opens new window) Celebrating Innovation and Community at NFT.Storage's Landmark Event (opens new window) Recap of NFT.Storage's groundbreaking event at MoMA PS1 during NFT.NYC, where they unveiled a new platform upgrade and launched the NFT.Storage DAO. This blog post explores their commitment to community-driven NFT preservation, highlights from the discussions on the future of arts and NFTs, and how you can join the DAO to contribute to this innovative journey. Read the blog post! (opens new window) # Have something you want featured? 📥 If you have something exciting or important that you think the IPFS community should know about, then you can submit this form (opens new window) to have it be considered for inclusion in the IPFS newsletter. Submit form"
