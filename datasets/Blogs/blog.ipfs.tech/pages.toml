full_description = "Blog & news IPFS 周报-65 默奕 29 October 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新您的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # 了解如何将 go-ipfs 用作程序库 📚 标题说明了一切。 (opens new window)通过此新教程了解如何将 go-ipfs 用作程序库，并充分利用 go-ipfs 核心 API。 # js-ipfs 0.39.0 发布 🎉 喔！使用预设配置文件配置您的节点！限制从浏览器传出的请求！使用一条命令从头开始创建节点！ 全部使用 js-ipfs 0.39.0！ (opens new window) # IPFS 生态圈的动态 您是否关注 Twitter 上的 IPFS (opens new window) ?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window)。 照片：蒂姆·伯纳斯·李（ Tim Berners-Lee ）看起来是 IPFS 和 libp2p 的粉丝 (opens new window) ，Twitter，2019 年 10 月 29 日 RTrade Technologies 与 Dappkit 合作利用企业 IPFS 基础架构和 API (opens new window) ，Temporal，2019 年 10 月 28 日 照片：在 ＃devcon5 和 #CrosslinkTaiwan 之后，我们上周一参加了 #IPFS 聚会。 (opens new window) Twitter，2019 年 10 月 27 日 观察者十月更新：IPFS 和内置插件 (opens new window) ，Paul Rumkin，2019 年 10 月 27 日 正如对我持怀疑态度的父亲所解释的，为什么科技公司仍然可以创造光明的未来。 (opens new window) Alex White，2019 年 10 月 25 日 教程：如何设置公共 IPFS 网关 (opens new window) ，Raptoreum，2019 年 10 月 25 日 走向自治组织 - 过去，现在，未来 (opens new window) ，Jose Jubin，2019 年 10 月 25 日 Ocean Protocol 和 IPFS，坐在默克尔树中 (opens new window) ，Ocean Protocol，2019 年 10 月 24 日 嵌入式 Textile 简介 (opens new window) ，Textile，2019 年 10 月 23 日 教程： Embark 很棒！ (opens new window)Andrej，2019 年 10 月 23 日 ARK 发展路线图：迈向 2020 年 (opens new window) ，ARK，2019 年 10 月 23 日 Function X，采用区块链技术的现代智能手机 (opens new window) ，Afton Aila，2019 年 10 月 21 日 PODCAST：分布式 Web：Web 的民主化？ (opens new window) 2019 年 10 月 14 日 设计用于可互操作和通用数据保护法规的分布式分类帐技术系统-符合卫生数据交换：血糖数据中的用例 (opens new window)，Hawig D, Zhou C，Fuhrhop S, Fialho AS，Ramachandran N，Journal of Medical Internet Research, 2019 年 6 月 # 空缺的 IPFS 工作岗位 技术负责人，分布式系统测试基础架构 (opens new window)，Protocol Labs，远程工作 分布式系统工程师，IPFS 群集（Go 语言） (opens new window)，Protocol Labs，远程工作 高级后端工程师 (opens new window)，MXC 基金会 gGmbH，德国 柏林 分布式系统技术主管 (opens new window)，IPFS，Protocol Labs，远程工作 # 更新和最新版本 查看生态系统中 IPFS 工具和项目的最新版本。 async-std v0.99.11 已经发布！ (opens new window)包括添加的 sync::channel，添加的 Future::delay，添加的 Stream::timeout， 修复 task::block_on 和更快的 fs::File 操作。 发布的 Ocean Protocol v1.1 (opens new window) ：一项小的维护更新，具有一些新功能：IPFS 文件托管集成，新的 Events-Handler 组件和 Commons 作为 Barge 中的默认 UI。 # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将您的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 os (opens new window) – 尝试构建某种类似于操作系统的环境，其中可执行文件全部位于 WASM 中，并从类似于 IPFS 的去中心化网络中加载。 深度了解 Graph 网络 (opens new window) Witness (opens new window) – 使用 IPFS 使以太坊区块链上的文件永生 # 即将到来的社区活动 您知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 10 月 28 日至 30 日： 开源峰会 + ELC Europe 2019 (opens new window)将由戴尔技术公司的 Trevor Conn 主持，主题为 “使用 IPFS 和分布式分类帐安全地存储 IOT Edge 数据”。法国，里昂。 2019 年 10 月 30 日： 由 ScaleUp Porto 计划支持的 OPO.js Meetup＃10 (opens new window)将主办下一次免费的 Porto JavaScript 社区聚会。葡萄牙，波尔图。 2019 年 10 月 30 日： 数据科学在 Palo Alto 发生争执 (opens new window) – 在数据科学创新的前沿与实践者进行联系，社交和交易记录，并了解专业人士如何在日常工作流程中利用 ML 推动业务成果。美国， 加利福尼亚，Palo Alto。 2019 年 11 月 6 日： 巴黎每月 P2P Peer 对 Beer (opens new window) 活动是由 P2P 和密码学爱好者社区组织并为其举办的会议。法国，巴黎。 2019 年 11 月 14 日： DWeb 会谈：Textile.io 的 Carson Farmer (opens new window)，西雅图 ProtoSchool 主办。快来访问 Textile.io 上的去中心化网络开发人员 Carson Farmer！美国，华盛顿州，西雅图。 2019 年 12 月 6 日： 柏林 React Day (opens new window) ：构建代码，而不是围墙。参与 React 世界的探索！ React Day Berlin 会议专注于深入的演讲，动手研讨会和寻找新的机会，为每个人提供了结识新朋友和共同开发一流应用程序的空间。德国，柏林。 # 感谢您的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍您。"
