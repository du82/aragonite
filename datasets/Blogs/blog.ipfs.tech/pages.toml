["https://blog.ipfs.tech/zh-cn/weekly-71"]
title = "IPFS 周报-71 | IPFS Blog & News"
description = "ZH - All the latest information about the IPFS Project in one place: blog posts, release notes, videos, news coverage, and more."
full_description = "Blog & news IPFS 周报-71 默奕 10 December 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新您的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # IPFS 零知识 上周，@jbenet 在“零知识”（Zero Knowledge）上进行了播报，该播客专注于新兴的 Web3 研究和构建社区。 查看它，以了解有关 IPFS (opens new window) ，libp2p 以及 Filecoin 项目最近的新功能和更多信息。 # DAppNode 的 IPFS Pinner 软件包演示 万一您错过了它，DAppNode 创建了一个 IPFS-pinner！请观看此关于 IPFS 群集，ENS 和 IPFS 的创意组合演示 (opens new window) ，以获取您喜欢的软件包注册表的协作社区反射镜 。 # IPFS 每周一电话聊天！ 昨天，@parkan 亲自为我们介绍了 EthDNS 演示 (opens new window)，@alanshaw 涵盖了最新 js-ipfs v0.40.0 版本的一些要点。来听通话记录，并在12 月 16 日（星期一）参与我们 (opens new window) ，@ianopolous 将分享有关 Peergos 的信息。 Peergos 是一种点对点加密文件系统，具有安全共享性，旨在抵制监视数据内容或友谊图。 # IPFS 生态圈的动态 您是否关注 Twitter 上的 IPFS (opens new window) ?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window)。 视频： 如何使用 ENS + IPFS 托管网站 (opens new window) ，Huang Yahsin，2019 年 12 月 5 日 关于视频内容的货币化和区块链 (opens new window) ，Dmitriy Kim，2019 年 12 月 5 日 视频：如何以及为什么应该通过 ENS 获得 .ETH 地址 (opens new window)，Scott Cunningham，2019 年 12 月 5 日 Hydro dApp Store — 第三方合作伙伴开发人员工具 (opens new window) ，Hydro，2019 年 12 月 5 日 社区聚焦：Meeting Merwane (opens new window) ，The Arweave Project，2019 年 12 月 5 日 教程：3Box 编辑配置文件插件 (opens new window) ，3Box，2019 年 12 月 4 日 中国对 EtherScan 的禁令是一个预兆 (opens new window) ，BTC Manager，2019 年 12 月 4 日 基于文件的区块链上的分布式工作流 (opens new window) ，EVEN Foundation，3 Dec 2019 Temporal Kubernetes 堆栈 — 扩展 IPFS 集群 & 分片的 Pinset (opens new window) ，RTrade Technologies，Ltd.，2019 年 12 月 2 日 来自 Property 令牌媒体内容的 IPFS 视频流 - Geesom (opens new window) ，Galt Project，2019 年 12 月 2 日 使用 IPFS，IPNS 和 DNSLink 托管网站 (opens new window) ，Simple as Water，2019 年 12 月 2 日 教程： Raspberry Pi 4 上的 NixOS，ROS 和 p2p 技术 (opens new window) ，Airalab Robonomics，2019 年 12 月 1 日 OpenAPI：通过 Band 协议连接到任何公共 API (opens new window)，Band Protocol，2019 年 11 月 20 日 论文：将区块链合并到轻量级边缘设备的 RDF 存储中 (opens new window) ，Anh Le-Tuan Darshan HinguManfred HauswirthDanh Le-Phuoc，2019 年 11 月 4 日 # 看看这些未解决的问题 👀 通过 ipfs/docs ，我们是否应该包含用于“非官方”安装 IPFS 方式的指标 (opens new window) ？ 帮助创建一个简短的概念文档，说明 IPFS 中的 “swarm” 是什么 (opens new window) 。 竭尽全力确保每个 repo 都包含描述和 README 文件 (opens new window) ！ # 空缺的 IPFS 工作岗位 高级后端工程师（IPFS）- Golang/Python 或 Golang/JavaScript (opens new window) ，Infura，布鲁克林，旧金山，远程工作 技术负责人，分布式系统测试基础架构 (opens new window) ，Protocol Labs，远程工作 分布式系统工程师，IPFS 群集（Go 语言） (opens new window)，Protocol Labs，远程工作 分布式系统技术主管 (opens new window)，IPFS，Protocol Labs，远程工作 # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将您的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 data，together.org (opens new window) 。探索社区驱动的数据管理！ radicle (opens new window) 发起了他们的社区论坛，有关 IPFS 的一些有趣的讨论正在进行中。 👀 Denarius Jupiter POD — IPFS 时间戳记 (opens new window) GruPur.com (opens new window), 未经审查的永久公共记录现在在 IPFS 上运行，并支持 IPFS 文件上传。 # 即将到来的社区活动 您知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 12 月 11 日： 里昂 P2P (opens new window) 是一个聚会，讨论 P2P，去中心化，离线优先应用程序，网络，机密性，反监视，反审查，安全等主题！法国，里昂。 2020 年 1 月 8 日： 巴黎 P2P 庆典 (opens new window)是结成联盟的机会，邀请各种形式的 Peer-2-Peer 参与者见面，围绕与 Peer-to-Peer 相关的所有主题展开讨论。有关免费的四日庆典的更多信息，请访问 p2p.paris (opens new window)。 # 感谢您的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍您。"
