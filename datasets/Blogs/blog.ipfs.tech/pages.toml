title = "IPFS 周报-69 | IPFS Blog & News"
description = "ZH - All the latest information about the IPFS Project in one place: blog posts, release notes, videos, news coverage, and more."
full_description = "Blog & news IPFS 周报-69 默奕 26 November 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新您的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # js-ipfs-http-client v40 版本发布了！ 🎉 在最新版本的 IPFS HTTP API 客户端库中，我们修复了一个以前防止 JWT 推送到每个 API 调用的漏洞！查看完整的发行说明 (opens new window)以获取更多详细信息。 # IPFS 列入 Old Dominion University 的 2019 年秋季高级 CS 课程中 IPFS 被列入 Sawood Alam (opens new window) 教授的有关网络服务器设计的高级课程 (opens new window)中。 在此处 (opens new window)查看所有课程讲义幻灯片 。 # IPFS 生态圈的动态 您是否关注 Twitter 上的 IPFS (opens new window) ?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window)。 IPFS 和区块链：豆荚里的两个豌豆 (opens new window) ，Viraz Malhotra，2019 年 11 月 26 日 50 个已签约的钱包，不断发展的 dWeb，TruffleSuite 等：ENS 生态系统更新 (opens new window) ，Brantly Millegan，2019 年 11 月 22 日 你能真正打破互联网吗？ (opens new window) James Frew，2019 年 11 月 22 日 建立在 Origin 上：去中心化 Shopify 是另一个选择 (opens new window) ，Nick Poulden，2019 年 11 月 20 日 促进开放科学的区块链技术和区块链项目回顾 (opens new window) ，Frontiers，2019 年 11 月 19 日 介绍 Mattereum 资产护照 (opens new window) ，James Hester，2019 年 11 月 19 日 ‘Pepo‘ 是 Apple Pay 批准的首个 DApp (opens new window) ，Faisal Khan，2019 年 11 月 19 日 Textile 在 libp2p 上的入门（或为什么我们 ❤️ libp2p） (opens new window) ，Textile，2019 年 11 月 19 日 基于区块链的存储服务与 Amazon AWS 对比，公布价格 (opens new window) ，Lucas Mearian，2019 年 11 月 19 日 运行 IPFS 节点的新工具 (opens new window) ，Infura，2019 年 11 月 18 日 为什么 Vitalik 和其他所有人的 Twitter 个人资料中都带有“ .ETH”（您也应该这样！） (opens new window) ，Brantly Millegan，2019 年 11 月 18 日 您的下一个应用程序可能没有后端 (opens new window) ，Alessandro Segala，2019 年 11 月 15 日 ENS 名称的终极指南 (opens new window) ，Eric Conner，2019 年 11 月 12 日 # 空缺的 IPFS 工作岗位 新！ 高级后端工程师（IPFS）- Golang/Python 或 Golang/JavaScript (opens new window) ，Infura，布鲁克林，旧金山，远程工作 技术负责人，分布式系统测试基础架构 (opens new window) ，Protocol Labs，远程工作 分布式系统工程师，IPFS 群集（Go 语言） (opens new window)，Protocol Labs，远程工作 高级后端工程师 (opens new window)，MXC 基金会 gGmbH，德国 柏林 分布式系统技术主管 (opens new window)，IPFS，Protocol Labs，远程工作 # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将您的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 Zil.Link (opens new window) ：搭桥 IPFS 和传统 DNS 的服务。 RecipeRadar (opens new window) ：通过 IPFS 上的 CRDT 对等共享会话。 3Box 体系结构：3Box 技术堆栈简介 (opens new window) # 即将到来的社区活动 您知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 12 月 3-4 日： 由 SmartFactoryOWL 主持的 Actyx Hackathon (opens new window) 将于下个月发布。作为黑客马拉松的一部分，将测试 Actyx 平台（使用 IPFS 和 libp2p）的应用程序并将其应用于“生活对象”。德国，莱姆戈。 2019 年 12 月 6 日： 柏林 React Day (opens new window) ：构建代码，而不是围墙。参与 React 世界的探索！ React Day Berlin 会议专注于深入的演讲，动手研讨会和寻找新的机会，为每个人提供了结识新朋友和共同开发一流应用程序的空间。德国，柏林。 Fission 正在举办一系列去中心化 Web 聚会 (opens new window)。 Brooke @expede (opens new window) 将分别对 IPFS 101 进行概述，然后解释我们如何使用它来构建 Fission 平台。我们还有其他有关去中心化 Web 主题的发言人。 2019 年 11 月 29 日： 荷兰，阿姆斯特丹去中心化网络聚会 (opens new window) ，其中包括 @berkes 呈现对等网络制图与 Peermaps (opens new window) # 感谢您的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍您。"
