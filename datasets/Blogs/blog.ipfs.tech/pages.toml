title = "IPFS 周报-61 | IPFS Blog & News"
description = "ZH - All the latest information about the IPFS Project in one place: blog posts, release notes, videos, news coverage, and more."
full_description = "Blog & news IPFS 周报-61 默奕 01 October 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新你的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # js-ipfs 0.38.0 发布 https://blog.ipfs.tech/070-js-ipfs-0-38/ # 去中心化网络即将到来 视频：https://www.youtube.com/watch?v=R1ccwyP6fjc&feature=youtu.be # 你本周在奥兰多的 Grace Hopper 吗？请访问 PL (协议实验室)的展位 https://twitter.com/IPFSevents/status/1178711529656422406?s=20 # IPFS 生态圈的动态 你是否关注Twitter 上的 IPFS (opens new window)?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window)。 深入了解 IPFS（1/6）：从初级到高级的指南 (opens new window) ，Hackernoon，2019 年 9 月 30 日 DFile：一种基于 IPFS 的奇特文件共享模式 (opens new window) ，Bruce Meerkat，2019 年 9 月 30 日 深入了解 IPFS（3/6）：什么是星际命名系统（IPNS）？ (opens new window) Hackernoon，2019 年 9 月 30 日 企业 IPFS 平台将添加到 Hydro dApp Store 中 (opens new window) ，Temporal，2019 年 9 月 30 日 Beta 版现已支持 ethoFS Windows 和 macOS！ (opens new window)The Ether-1 Project，2019 年 9 月 28 日 寻求重新去中心化互联网的简短纪录片 (opens new window) ，Boing Boing，2019 年 9 月 27 日 比特币区块链和 IPFS 的一般条款和条件押金 (opens new window) ，Bèr Kessels，2019 年 9 月 27 日 利用 Graph Protocol 来改善用户体验并快速迭代想法 (opens new window) ，The Graph，2019 年 9 月 25 日 Diffusion 开发者大会和 IPFS 服务台 (opens new window) ，FISSION，2019 年 9 月 25 日 为什么流式视频需要 IPFS？ (opens new window) Sasha Sydney，2019 年 9 月 25 日 通过 IPFS 进行去中心化和分布式互联网 (opens new window) ，Iker Landajuela，2019 年 9 月 23 日 在 Chromebook 上运行 IPFS (opens new window) ，fission forum，2019 年 9 月 23 日 图片： Hector Sanjuan 对 IPFS 进行了技术介绍！ (opens new window)Our Networks，2019 年 9 月 22 日 高性能 IPFS 网关的绝对指南 (opens new window) ，The Stacktical Blog，2019 年 9 月 21 日 # 更新和最新版本 查看生态系统中 IPFS 工具和项目的最新版本。 Qri Desktop 简介 (opens new window) ：作为一个开源项目，Qri 既是贡献者和数据爱好者社区的资源又是产品 - 他们中的许多人共享对功能的想法，帮助发现和解决 bug，或贡献代码和数据集。 # 开放 IPFS 工作岗位 React Native 开发员 (opens new window), 法国 巴黎, Berty 高级后端工程师 (opens new window)，MXC 基金会 gGmbH，德国 柏林 高级 Golang 工程师 (opens new window)，Textile，远程工作 分布式系统技术主管 (opens new window)，IPFS，Protocol Labs，远程工作 IPFS 文档技术内容策略 (opens new window)，Protocol Labs，远程工作 # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将你的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 PageSaver (opens new window) 将 Web 页面保存到 IPFS，并为您提供到公共网关的链接。 DFile (opens new window) ：如何使用 python + flask 用 IPFS 作文件存储 # 即将到来的社区活动 你知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 今晚！ 2019 年 10 月 1 日： DWeb SF 聚会-十月 (opens new window) ，我们非常热爱社区，并在 2019 DWeb Camp 上分享，所以让我们保持势头！快来认识有兴趣建立去中心化网络的其他人，这是我们需要和应得的。美国，加利福尼亚州，旧金山。 2019 年 10 月 2 日： 巴黎每月 P2P Peer 对 Beer (opens new window)活动是由 P2P 和密码学爱好者社区组织并为其举办的会议。法国，巴黎。 2019 年 10 月 7 日： 为火星做好准备 (opens new window) ，大阪 IPFS 研讨会邀请您深入了解 IPFS 的工作原理以及如何在新项目中实际使用 IPFS。日本，大阪。 2019 年 10 月 16 日： IPFS 科罗拉多州用户测试日 (opens new window) ：帮助影响点对点互联网的用户体验，并获得免费合作和咖啡的一天！美国科罗拉多州，博尔德/丹佛。 2019 年 10 月 16 日： IPFS 科罗拉多基础知识之夜 (opens new window) ：科罗拉多 IPFS 与以太坊博尔德之间的合作！加入我们，获得出色的 IPFS 概述以及有关 IPFS 基础知识的交互式教程。美国，科罗拉多州，博尔德/丹佛。 2019 年 10 月 19 日至 20 日： Diffusion 2019 (opens new window)加入并连接来自 The Convergence Stack 的区块链，人工智能，物联网和大数据中的一些世界上最令人兴奋的 Web 3 协议，为期 2 天的由黑客，独家产品组成的开发环境发布和现场演示。柏林，德国。 2019 年 10 月 28 日至 30 日： 开源峰会 + ELC Europe 2019 (opens new window)将由戴尔技术公司的 Trevor Conn 主持，主题为“使用 IPFS 和分布式分类帐安全地存储 IOT Edge 数据”。法国里昂。 # 感谢你的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍你。"
