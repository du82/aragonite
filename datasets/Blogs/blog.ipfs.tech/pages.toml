full_description = "Blog & news IPFS 周报-68 默奕 19 November 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新您的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # 帮助我们处理 IPFS 文档 ✍️ IPFS 文档团队需要您的帮助！想贡献吗？查看按大小和难度分类的最新问题 (opens new window)。 # IPFS 在 Berty 周刊上大声疾呼！ 从上周的 Berty 周刊上 (opens new window) ，快速了解 gomobile-ipfs：“Guilhem 和 Antoine 找到了最佳方法，允许 gomobile-ipfs 使用流处理与给定对等方的传入和传出连接...” # IPFS 生态圈的动态 您是否关注 Twitter 上的 IPFS (opens new window) ?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window)。 Temporal IPFS 更新：Kubernetes，ENS 域，Amazon S3，Playground（游乐场），组织管理 (opens new window)，Temporal，2019 年 11 月 18 日 原子访问控制 (opens new window) ，Peergos，2019 年 11 月 15 日 2020 年的 Brave 浏览器：新的广告块，过滤器，SDK 和 IPFS (opens new window)，Vladislov Sopov，2019 年 11 月 15 日 跨平台 IPFS Lite：JS，Android，iOS 和 gRPC (opens new window)，Textile，2019 年 11 月 13 日 一个通用无主机基质，为一个无服务器的未来，在 Øredev 2019 (opens new window)，Brooklyn Zelenka，2019 年 11 月 13 日 数学家使用行星超级计算机解决 '42' 问题 (opens new window)，Science Alert，2019 年 9 月 9 日 # 空缺的 IPFS 工作岗位 技术负责人，分布式系统测试基础架构 (opens new window)，Protocol Labs，远程工作 分布式系统工程师，IPFS 群集（Go 语言） (opens new window)，Protocol Labs，远程工作 高级后端工程师 (opens new window)，MXC 基金会 gGmbH，德国 柏林 分布式系统技术主管 (opens new window)，IPFS，Protocol Labs，远程工作 # 更新和最新版本 查看生态系统中 IPFS 工具和项目的最新版本。 视频：RPI4 的 RavencoinOS 版本 5 的“抢先看”，现已可供下载 (opens new window) IPFS Webpack 插件 (opens new window) ：该插件通过在 Webpack 构建过程中自动添加 js 捆绑包，从而简化了创建要通过 IPFS 提供服务的 js 捆绑包的操作。 # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将您的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 Eternum (opens new window) 是一种简单易用的 IPFS pinning 服务。它将托管您的 IPFS 文件，因此您可以确保它们始终可用，并且附带了可在您的应用程序中使用的 API。 # 即将到来的社区活动 您知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 11 月 20 日： 布拉格去中心化网络 (opens new window)将于晚上 6 点在 ParalelníPolis 举办一个 IPFS 开发应用程序之夜。捷克共和国，布拉格。 2019 年 11 月 21 日： 维多利亚去中心化网络聚会 (opens new window) Watershed Coworking 主办了一项新活动，关于开源和去中心化网络的广泛交流。加拿大，不列颠哥伦比亚省，维多利亚 2019 年 12 月 6 日： 柏林 React Day (opens new window) ：构建代码，而不是围墙。参与 React 世界的探索！ React Day Berlin 会议专注于深入的演讲，动手研讨会和寻找新的机会，为每个人提供了结识新朋友和共同开发一流应用程序的空间。德国，柏林。 Fission 正在举办一系列去中心化 Web 聚会 (opens new window)。 Brooke @expede (opens new window) 将分别对 IPFS 101 进行概述，然后解释我们如何使用它来构建 Fission 平台。我们还有其他有关去中心化 Web 主题的发言人。 2019 年 11 月 20 日比利时，安特卫普去中心化网络聚会 (opens new window)，@icidasset 将在此谈论他的去中心化音乐播放器 Diffuse (opens new window) 2019 年 11 月 21 日加拿大，维多利亚，技术见面会 (opens new window) ，来自 Textile (opens new window) 的 Carson 组织 2019 年 11 月 29 日荷兰，阿姆斯特丹去中心化网络聚会 (opens new window) ，其中包括 @berkes 呈现对等网络制图与 Peermaps (opens new window) # 感谢您的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍您。"
