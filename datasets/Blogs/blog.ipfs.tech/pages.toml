full_description = "Blog & news IPFS 周报-67 默奕 12 November 2019 #weekly #project planning Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新您的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # 在 ProtoSchool 的新教程中探索 Files API 上周，由著名的 Gil Domingues 建立了全新的 ProtoSchool 教程，探讨了 Regular Files API。 🎉 请阅读完整的博客公告 (opens new window)以获取更多详细信息。 # 查看我们 2020 年项目规划中提出的新主题 查看我们公开征集主题时提交的所有2020 年主题提案 (opens new window) ，从而对 IPFS 项目在 2020 年进行更专项的投资。从移动端的 IPFS 到 Wikipedia Mirror，等等！ # IPFS 生态圈的动态 您是否关注 Twitter 上的 IPFS (opens new window) ?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window)。 Dappkit 选择 MóiBit 作为去中心化存储合作伙伴 (opens new window)，MóiBit，2019 年 11 月 11 日 比较 IPFS Pinning 服务定价/功能。Temporal，Eternum 和 Pinata。 (opens new window) Temporal，2019 年 11 月 11 日 原子访问控制和人类可读的公共链接 (opens new window)，Peergos，2019 年 11 月 11 日 将您的 Facebook 照片导出到 Fission (opens new window)，Fission，2019 年 11 月 10 日 去中心化网络初学者指南 (opens new window)，ppio，2019 年 11 月 8 日 MóiBit 在 Matic Network 上作为去中心化存储合作伙伴 (opens new window)，MóiBit，2019 年 11 月 7 日 免费部署防审查网站 (opens new window)，Jason Schorr，2019 年 11 月 6 日 崩溃之后：重新考虑事件管理平台。 (opens new window)，Stefan Adolf，2019 年 11 月 5 日 为全球言论自由创建防审查标准 — 不可阻挡的域名，Brad Kam (opens new window)，Wyre blog，2019 年 11 月 5 日 Web 3.0 IPFS 和区块链 (opens new window) ，BHD 网络，2019 年 11 月 4 日 TemporalX S3 API 与 STORJ IPFS。开发环境现场直播！ (opens new window) Temporal，2019 年 11 月 4 日 视频：如何在 3 分钟内在 IPFS 上启动不可阻挡的网站！ (opens new window)不可阻挡的域名，2019 年 11 月 4 日 Diffusion2019 Hackathon 的一等奖使用了 IPFS！ 了解有关 @toxzique 和 @mediaquery 如何使用 iExec，IPFS 和 FISSION 建立去中心化的静态网站 CI/CD 管道的更多信息 (opens new window) 。 2019 年 10 月 20 日 当我们殖民宇宙时，WEB 将会发生什么？ (opens new window) Riccardo Giorato，2019 年 10 月 10 日 # 空缺的 IPFS 工作岗位 技术负责人，分布式系统测试基础架构 (opens new window)，Protocol Labs，远程工作 分布式系统工程师，IPFS 群集（Go 语言） (opens new window)，Protocol Labs，远程工作 高级后端工程师 (opens new window)，MXC 基金会 gGmbH，德国 柏林 分布式系统技术主管 (opens new window)，IPFS，Protocol Labs，远程工作 # 更新和最新版本 查看生态系统中 IPFS 工具和项目的最新版本。 Peergos v0.1.4 (opens new window)：原子访问控制和公共链接 Qri Desktop 0.2.0 已发布！ (opens new window) # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将您的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 Henrique Dias 的一个很棒的复制公共数据集的例子 (opens new window) ethoFS (opens new window) 是一个完全去中心化的托管平台，结合了区块链索引技术和 IPFS 协议，可按需提供去中心化内容。 Neocities 点击达到 40 亿！ (opens new window) Infury (opens new window) – 使用 Infura.io IPFS API 从 IPFS 将文件上传到 IPFS 的基本应用程序 # 即将到来的社区活动 您知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 11 月 14 日： DWeb 会谈：Textile.io 的 Carson Farmer (opens new window)，西雅图 ProtoSchool 主办。快来访问 Textile.io 上的去中心化网络开发人员 Carson Farmer！美国，华盛顿州，西雅图。 2019 年 12 月 6 日： 柏林 React Day (opens new window) ：构建代码，而不是围墙。参与 React 世界的探索！ React Day Berlin 会议专注于深入的演讲，动手研讨会和寻找新的机会，为每个人提供了结识新朋友和共同开发一流应用程序的空间。德国，柏林。 Fission 正在举办一系列去中心化 Web 聚会 (opens new window)。 Brooke @expede (opens new window) 将分别对 IPFS 101 进行概述，然后解释我们如何使用它来构建 Fission 平台。我们还有其他有关去中心化 Web 主题的发言人。 2019 年 11 月 15 日德国，柏林去中心化网络聚会 (opens new window)在 Monadic 办事处主持，他们将分享更多 Radicle (opens new window) 的内容 2019 年 11 月 20 日比利时，安特卫普去中心化网络聚会 (opens new window)，@icidasset 将在此谈论他的去中心化音乐播放器 Diffuse (opens new window) 2019 年 11 月 21 日加拿大，维多利亚，技术见面会 (opens new window) ，来自 Textile (opens new window) 的 Carson 组织 2019 年 11 月 29 日荷兰，阿姆斯特丹去中心化网络聚会 (opens new window) ，其中包括 @berkes 呈现对等网络制图与 Peermaps (opens new window) # 感谢您的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍您。"
