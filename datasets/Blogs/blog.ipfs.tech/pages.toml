title = "IPFS 周报-62 | IPFS Blog & News"
description = "ZH - All the latest information about the IPFS Project in one place: blog posts, release notes, videos, news coverage, and more."
full_description = "Blog & news IPFS 周报-62 默奕 10 October 2019 #weekly Share this item: Twitter Facebook # 欢迎来到 IPFS 周刊。👋 星际文件系统 (IPFS) (opens new window) 是一种新的超媒体分布协议，通过内容和标识来寻址。IPFS 支持创建完全分布式的应用程序。它的目标是使网络更快、更安全、更开放。由于范围广大，本周刊旨在跟踪整个生态系统的开发。 想参与其中？点击下面的一些链接，查看我们在 GitHub (opens new window) 上的内容，或加入我们的 IRC (opens new window)。 想要更新你的收件箱吗? 订阅我们的每周通讯! (opens new window) 以下是自上次 IPFS 周刊以来的一些亮点。 # 最新发布 # IPFS 浏览器进度更新 我们正在取得进展！我们想分享一下 IPFS 项目正在进行的一些合作，这使我们进一步接近无中介的信息访问…… 通过解决“最后一英里”问题并将 IPFS 直接集成到网络浏览器 (opens new window) 。 # Storj 网络上现已提供 IPFS 最近，Storj 团队宣布了可用性参考架构，该架构将 IPFS 节点支持到其 Tardigrade 去中心化云存储服务中 (opens new window) 。 # IPFS Camp 科幻视频 🧬 IPFS Camp 视频紧随其后，包括闪电演讲，深入讨论，海报项目和核心 + 选修课程，这些来自我们的科幻博览会 (opens new window)。 # IPFS 生态圈的动态 你是否关注Twitter 上的 IPFS (opens new window)?有关 IPFS 的最新新闻，请查看我们的 Twitter 提要或查看关于 Awesome IPFS 的最新文章 (opens new window)。 预览 RTrade 的去中心化，注重隐私的（dVPN） (opens new window) ，RTrade Technologies，2019 年 10 月 9 日 IPFS + ENS 无处不在：EthDNS 简介 (opens new window) ，The Ethereum Name Service，2019 年 10 月 8 日 视频： RPi 群集采访 Héctor Sanjuán (opens new window) ，2019 年 10 月 7 日 TemporalX vs Go-IPFS 官方节点基准测试 (opens new window) ，Temporal，2019 年 10 月 7 日 教程： 使用 IPFS 构建 Youtube (opens new window) ，SimpleAsWater，2019 年 10 月 5 日 ipfs-deploy 中的 Fission API (opens new window) ，Fission，2019 年 10 月 2 日 将 IPFS 分布式文件存储用于游戏资产元数据 (opens new window) ，Blockade Games，2019 年 9 月 15 日 # 空缺的 IPFS 工作岗位 React Native 开发员 (opens new window), 法国 巴黎, Berty 高级后端工程师 (opens new window)，MXC 基金会 gGmbH，德国 柏林 高级 Golang 工程师 (opens new window)，Textile，远程工作 分布式系统技术主管 (opens new window)，IPFS，Protocol Labs，远程工作 IPFS 文档技术内容策略 (opens new window)，Protocol Labs，远程工作 # 我们<3 的工具和项目 Awesome IPFS (opens new window) 是一个由社区维护和更新的列表，它包括项目、工具或几乎所有与 IPFS 相关的东西，非常棒。想要了解更多，或将你的信息添加到列表中，请访问 GitHub 上的 Awesome IPFS (opens new window)。 GoFS (opens new window) 是一种现代的文件存储解决方案。与传统的文件存储解决方案（Dropbox，Google 文件等）不同，GoFS 一次可从多个位置提供文件，从而加快了下载速度，并提供了更多冗余以保持文件可用。 # 即将到来的社区活动 你知道 IPFS 在 discuss.ipfs.tech (opens new window) 上有一个社区论坛吗? 注册参与关于编码的讨论、教程、查看公告和了解即将到来的社区活动。 2019 年 10 月 16 日： IPFS 科罗拉多州用户测试日 (opens new window) ：帮助影响点对点互联网的用户体验，并获得免费合作和咖啡的一天！美国科罗拉多州，博尔德/丹佛。 2019 年 10 月 16 日： IPFS 科罗拉多基础知识之夜 (opens new window) ：科罗拉多 IPFS 与以太坊博尔德之间的合作！加入我们，获得出色的 IPFS 概述以及有关 IPFS 基础知识的交互式教程。美国，科罗拉多州，博尔德/丹佛。 2019 年 10 月 19 日至 20 日： Diffusion 2019 (opens new window)加入并连接来自 The Convergence Stack 的区块链，人工智能，物联网和大数据中的一些世界上最令人兴奋的 Web 3 协议，为期 2 天的由黑客，独家产品组成的开发环境发布和现场演示。柏林，德国。 2019 年 10 月 28 日至 30 日： 开源峰会 + ELC Europe 2019 (opens new window)将由戴尔技术公司的 Trevor Conn 主持，主题为“使用 IPFS 和分布式分类帐安全地存储 IOT Edge 数据”。法国里昂。 2019 年 10 月 30 日： 由 ScaleUp Porto 计划支持， OPO.js Meetup＃10 (opens new window)将主办下一次免费的 Porto JavaScript 社区聚会。波尔图，葡萄牙。 2019 年 11 月 6 日： 巴黎每月 P2P Peer 对 Beer (opens new window)活动是由 P2P 和密码学爱好者社区组织并为其举办的会议。法国，巴黎。 # 感谢你的阅读 ☺️ 以上是本周有关 IPFS 的全部新闻。如果我们错过了什么，请回复邮件通知我们! 我们可以在下周的节目中介绍你。"
