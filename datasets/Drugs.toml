["https://psychonautwiki.org/wiki/Psychoactive_substance_index"]
title = "Psychoactive substance index"
description = "A psychoactive substance is a chemical substance—other than a nutrient or essential dietary ingredient—that alters brain function to produce temporary changes in sensation, perception, mood, consciousness, cognition, and behavior."
full_description = "A psychoactive substance is a chemical substance—other than a nutrient or essential dietary ingredient—that alters brain function to produce temporary changes in sensation, perception, mood, consciousness, cognition, and behavior. Psychoactive substances have been used by humans for a variety of purposes since recorded history. For example, they may be used as medicine, as recreational substances for their euphoric effects and novelty value, as entheogens for ritual or spiritual purposes, or as scientific research probes for studying the brain and mind. The latter two have particular relevance for practitioners of psychonautics. The Psychoactive Substance Index (PSI) is designed to catalog and provide relevant, accurate, and unbiased information for any and all mind-altering substances known to humankind, with a special focus on those with potential applications as mind-expanding tools. The individual articles detail not just the history, chemistry, pharmacology, toxicity, and legality of each substance, but also its user-reported subjective effects (i.e. phenomenology). This is achieved in accordance with a standardized system of definitions and terminologies proposed in the Subjective Effect Index (SEI). Please see our summary index to view conveniently condensed versions of each article."
clearnet = "https://psychonautwiki.org/wiki/Psychoactive_substance_index"
status = "Operational"
subject_type = "psychoactive substances"
category = "drugs"
tags = ["tripping", "trip sitting", "research", "psychology", "drugs", "substances"]
language = "english"

["https://psychonautwiki.org/wiki/Classical_psychedelics"]
title = "Classical psychedelics"
description = "Classical psychedelics may be distinguished from novel psychedelics, which are generally psychedelics discovered after the 1970s. These include relatively older and well-tested substances like 2C-B as well as highly novel compounds like the 25x-NBOMe series, which were developed as neurochemical probes."
full_description = "Classical psychedelics (or classic psychedelics) refers to the most common, recognizable, and historically significant psychedelic substances. They generally include: DMT (or Ayahuasca) LSD Mescaline Psilocybin mushrooms A common feature of classical psychedelics is that they act as (partial) agonists at the serotonin 5-HT2A receptor, which is abundant in specific regions of the human brain. Classical psychedelics may be distinguished from novel psychedelics, which are generally psychedelics discovered after the 1970s. These include relatively older and well-tested substances like 2C-B as well as highly novel compounds like the 25x-NBOMe series, which were developed as neurochemical probes. Furthermore, they are thought to have excellent safety profiles relative to most psychoactive substances, with low abuse potential and toxicity.[citation needed] However, adverse psychological reactions like severe anxiety, paranoia, delusions, mania, and psychosis are always possible, especially in individuals susceptible to mental disorders. As a result, harm reduction practices are advised."
clearnet = "https://psychonautwiki.org/wiki/Classical_psychedelics"
status = "Operational"
subject_type = "classic psychedelics"
category = "drugs"
tags = ["tripping", "trip sitting", "research", "psychology", "drugs", "classic psychedelics", "psychedelics"]
language = "english"

["https://psychonautwiki.org/wiki/Psilocybin_mushrooms"]
title = "Psilocybin mushrooms"
description = "Psilocybin mushrooms (also known as magic mushrooms, psychedelic mushrooms, and shrooms) are a family of psychoactive fungi that contain psilocybin, a psychedelic substance of the tryptamine class. The mechanism of action is not fully known, although binding activity at serotonin receptors is thought to be involved."
full_description = "Psilocybin mushrooms (also known as magic mushrooms, psychedelic mushrooms, and shrooms) are a family of psychoactive fungi that contain psilocybin, a psychedelic substance of the tryptamine class. The mechanism of action is not fully known, although binding activity at serotonin receptors is thought to be involved. Psilocybin mushrooms occur on all continents and have been taxonomically classified into over 200 species, the most potent of which belong to the genus Psilocybe. Based on imagery found in prehistoric rock art, they are thought to have been used by various human cultures since before recorded history. After being introduced to the Western world in the 1950s, they generated substantial public interest. Along with LSD, they were incorporated into the youth counterculture movement of the 1960s. Widespread usage of psychedelics provoked a societal backlash, and they were prohibited in 1970.[citation needed] Today, they are among the most widely used psychedelic substances (partly due to the ease of personal cultivation and harvesting). As a part of the so-called "psychedelic renaissance", they are currently being investigated in the treatment of a number of ailments including anxiety, depression, addiction, and other mental disorders. Subjective effects include visual geometry, hallucinatory states, time distortion, enhanced introspection, conceptual thinking, euphoria, and ego loss. The intensity and duration of effects can vary greatly depending on factors such as species and batch, which can complicate standardized dosing information (see this section). They are often described to evoke entheogenic, mystical-like, or transpersonal experiences that may facilitate self-reflection and personal growth. In distinction to psychedelics like LSD, mescaline, and 2C-B, which may be described as "stimulating", "cerebral", and "bright", psilocybin mushrooms are typically described as having an "earthy", "subliminal", or "dream-like" quality. They also are reported to produce slightly more emotion enhancement, time distortion and ego loss than the aforementioned substances, as well as more nausea, confusion, and sedation. Unlike most highly prohibited substances, psilocybin mushrooms have low abuse potential and are neither addictive nor physiologically toxic.[5] However, adverse psychological reactions such as severe anxiety, paranoia, delusions and psychosis are always possible, particularly among individuals predisposed to mental disorders.[6] It is highly advised to use harm reduction practices if using this substance."
clearnet = "https://psychonautwiki.org/wiki/Psilocybin_mushrooms"
status = "Operational"
subject_type = "psychonautics"
category = "drugs"
tags = ["tripping", "trip sitting", "research", "drugs", "substances", "magic mushrooms", "psychedelic muchrooms", "shrooms"]
language = "english"

["https://psychonautwiki.org/wiki/LSD"]
title = "LSD"
description = "Lysergic acid diethylamide (also known as Lysergide, LSD-25, LSD, L, Lucy, and Acid) is a classical psychedelic substance of the lysergamide class. It is perhaps the most researched and culturally influential psychedelic substance, as well as the prototypal lysergamide. The mechanism of action is not fully known, although serotonin binding activity is thought to be involved."
full_description = "Lysergic acid diethylamide (also known as Lysergide, LSD-25, LSD, L, Lucy, and Acid) is a classical psychedelic substance of the lysergamide class. It is perhaps the most researched and culturally influential psychedelic substance, as well as the prototypal lysergamide. The mechanism of action is not fully known, although serotonin binding activity is thought to be involved. The psychoactive effects of LSD were first discovered in 1943 by Albert Hofmann at Sandoz Laboratories (Switzerland). In the 1950s, it was widely distributed by Sandoz as an experimental drug for psychotherapy and scientific research;[4] during this era, it provoked considerable interest from the intellectual establishment and was even the subject of a clandestine investigation by the U.S. Central Intelligence Agency (CIA) for potential applications in "mind control".[5] Recreational LSD use became a central, highly-visible aspect of the 1960s youth counterculture movement, eventually paving the way for international prohibition in 1971.[6][7] Today, illicit recreational use remains widespread and it is associated in popular culture with the counterculture and rave scenes. The lifetime prevalence of LSD use among American adults is 6-8%.[8] Following decades of institutional suppression, scientific research involving LSD has recently undergone a massive revival.[4] As a part of the so-called "psychedelic renaissance",[9] it is currently being investigated in the treatment of a number of conditions including alcoholism,[10] substance addiction,[11] cluster headache,[12] autism,[13] and anxiety associated with terminal illness.[14] Subjective effects include visual geometry / hallucinatory states, time distortion, enhanced introspection, conceptual thinking, increased music appreciation, euphoria, and ego loss. LSD use is reportedly associated with mystical-type experiences that are sometimes claimed to facilitate self-reflection and personal growth.[15] It has been called the first modern entheogen, a group which is otherwise limited to traditional plant preparations or extracts.[16] Unlike most highly prohibited substances, LSD has not been proven to be physiologically toxic or addictive.[17] However, adverse psychological reactions such as severe anxiety, paranoia, delusions, and psychosis are always possible, particularly for those predisposed to mental disorders (see this section).[18]"
clearnet = "https://psychonautwiki.org/wiki/LSD"
