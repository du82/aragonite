["https://psychonautwiki.org/wiki/Psychoactive_substance_index"]
title = "Psychoactive substance index"
description = "A psychoactive substance is a chemical substance—other than a nutrient or essential dietary ingredient—that alters brain function to produce temporary changes in sensation, perception, mood, consciousness, cognition, and behavior."
full_description = "A psychoactive substance is a chemical substance—other than a nutrient or essential dietary ingredient—that alters brain function to produce temporary changes in sensation, perception, mood, consciousness, cognition, and behavior. Psychoactive substances have been used by humans for a variety of purposes since recorded history. For example, they may be used as medicine, as recreational substances for their euphoric effects and novelty value, as entheogens for ritual or spiritual purposes, or as scientific research probes for studying the brain and mind. The latter two have particular relevance for practitioners of psychonautics. The Psychoactive Substance Index (PSI) is designed to catalog and provide relevant, accurate, and unbiased information for any and all mind-altering substances known to humankind, with a special focus on those with potential applications as mind-expanding tools. The individual articles detail not just the history, chemistry, pharmacology, toxicity, and legality of each substance, but also its user-reported subjective effects (i.e. phenomenology). This is achieved in accordance with a standardized system of definitions and terminologies proposed in the Subjective Effect Index (SEI). Please see our summary index to view conveniently condensed versions of each article."
clearnet = "https://psychonautwiki.org/wiki/Psychoactive_substance_index"
status = "Operational"
subject_type = "psychoactive substances"
category = "drugs"
tags = ["tripping", "trip sitting", "research", "psychology", "drug", "drugs", "substances"]
language = "english"

["https://psychonautwiki.org/wiki/Classical_psychedelics"]
title = "Classical psychedelics"
description = "Classical psychedelics may be distinguished from novel psychedelics, which are generally psychedelics discovered after the 1970s. These include relatively older and well-tested substances like 2C-B as well as highly novel compounds like the 25x-NBOMe series, which were developed as neurochemical probes."
full_description = "Classical psychedelics (or classic psychedelics) refers to the most common, recognizable, and historically significant psychedelic substances. They generally include: DMT (or Ayahuasca) LSD Mescaline Psilocybin mushrooms A common feature of classical psychedelics is that they act as (partial) agonists at the serotonin 5-HT2A receptor, which is abundant in specific regions of the human brain. Classical psychedelics may be distinguished from novel psychedelics, which are generally psychedelics discovered after the 1970s. These include relatively older and well-tested substances like 2C-B as well as highly novel compounds like the 25x-NBOMe series, which were developed as neurochemical probes. Furthermore, they are thought to have excellent safety profiles relative to most psychoactive substances, with low abuse potential and toxicity.[citation needed] However, adverse psychological reactions like severe anxiety, paranoia, delusions, mania, and psychosis are always possible, especially in individuals susceptible to mental disorders. As a result, harm reduction practices are advised."
clearnet = "https://psychonautwiki.org/wiki/Classical_psychedelics"
status = "Operational"
subject_type = "classic psychedelics"
category = "drugs"
tags = ["tripping", "trip sitting", "research", "psychology", "drug", "drugs", "classic psychedelics", "psychedelics"]
language = "english"

["https://psychonautwiki.org/wiki/Psilocybin_mushrooms"]
title = "Psilocybin mushrooms"
description = "Psilocybin mushrooms (also known as magic mushrooms, psychedelic mushrooms, and shrooms) are a family of psychoactive fungi that contain psilocybin, a psychedelic substance of the tryptamine class. The mechanism of action is not fully known, although binding activity at serotonin receptors is thought to be involved."
full_description = "Psilocybin mushrooms (also known as magic mushrooms, psychedelic mushrooms, and shrooms) are a family of psychoactive fungi that contain psilocybin, a psychedelic substance of the tryptamine class. The mechanism of action is not fully known, although binding activity at serotonin receptors is thought to be involved. Psilocybin mushrooms occur on all continents and have been taxonomically classified into over 200 species, the most potent of which belong to the genus Psilocybe. Based on imagery found in prehistoric rock art, they are thought to have been used by various human cultures since before recorded history. After being introduced to the Western world in the 1950s, they generated substantial public interest. Along with LSD, they were incorporated into the youth counterculture movement of the 1960s. Widespread usage of psychedelics provoked a societal backlash, and they were prohibited in 1970.[citation needed] Today, they are among the most widely used psychedelic substances (partly due to the ease of personal cultivation and harvesting). As a part of the so-called psychedelic renaissance, they are currently being investigated in the treatment of a number of ailments including anxiety, depression, addiction, and other mental disorders. Subjective effects include visual geometry, hallucinatory states, time distortion, enhanced introspection, conceptual thinking, euphoria, and ego loss. The intensity and duration of effects can vary greatly depending on factors such as species and batch, which can complicate standardized dosing information (see this section). They are often described to evoke entheogenic, mystical-like, or transpersonal experiences that may facilitate self-reflection and personal growth. In distinction to psychedelics like LSD, mescaline, and 2C-B, which may be described as stimulating, cerebral, and bright, psilocybin mushrooms are typically described as having an earthy, subliminal, or dream-like quality. They also are reported to produce slightly more emotion enhancement, time distortion and ego loss than the aforementioned substances, as well as more nausea, confusion, and sedation. Unlike most highly prohibited substances, psilocybin mushrooms have low abuse potential and are neither addictive nor physiologically toxic. However, adverse psychological reactions such as severe anxiety, paranoia, delusions and psychosis are always possible, particularly among individuals predisposed to mental disorders. It is highly advised to use harm reduction practices if using this substance."
clearnet = "https://psychonautwiki.org/wiki/Psilocybin_mushrooms"
status = "Operational"
subject_type = "psychonautics"
category = "drugs"
tags = ["tripping", "trip sitting", "research", "drug", "drugs", "substances", "magic mushrooms", "psychedelic muchrooms", "shrooms"]
language = "english"

["https://psychonautwiki.org/wiki/LSD"]
title = "LSD"
description = "Lysergic acid diethylamide (also known as Lysergide, LSD-25, LSD, L, Lucy, and Acid) is a classical psychedelic substance of the lysergamide class. It is perhaps the most researched and culturally influential psychedelic substance, as well as the prototypal lysergamide. The mechanism of action is not fully known, although serotonin binding activity is thought to be involved."
full_description = "Lysergic acid diethylamide (also known as Lysergide, LSD-25, LSD, L, Lucy, and Acid) is a classical psychedelic substance of the lysergamide class. It is perhaps the most researched and culturally influential psychedelic substance, as well as the prototypal lysergamide. The mechanism of action is not fully known, although serotonin binding activity is thought to be involved. The psychoactive effects of LSD were first discovered in 1943 by Albert Hofmann at Sandoz Laboratories (Switzerland). In the 1950s, it was widely distributed by Sandoz as an experimental drug for psychotherapy and scientific research; during this era, it provoked considerable interest from the intellectual establishment and was even the subject of a clandestine investigation by the U.S. Central Intelligence Agency (CIA) for potential applications in mind control. Recreational LSD use became a central, highly-visible aspect of the 1960s youth counterculture movement, eventually paving the way for international prohibition in 1971. Today, illicit recreational use remains widespread and it is associated in popular culture with the counterculture and rave scenes. The lifetime prevalence of LSD use among American adults is 6-8%. Following decades of institutional suppression, scientific research involving LSD has recently undergone a massive revival. As a part of the so-called psychedelic renaissance, it is currently being investigated in the treatment of a number of conditions including alcoholism, substance addiction, cluster headache, autism, and anxiety associated with terminal illness. Subjective effects include visual geometry / hallucinatory states, time distortion, enhanced introspection, conceptual thinking, increased music appreciation, euphoria, and ego loss. LSD use is reportedly associated with mystical-type experiences that are sometimes claimed to facilitate self-reflection and personal growth. It has been called the first modern entheogen, a group which is otherwise limited to traditional plant preparations or extracts. Unlike most highly prohibited substances, LSD has not been proven to be physiologically toxic or addictive. However, adverse psychological reactions such as severe anxiety, paranoia, delusions, and psychosis are always possible, particularly for those predisposed to mental disorders (see this section)."
clearnet = "https://psychonautwiki.org/wiki/LSD"
status = "Operational"
subject_type = "Lysergic acid diethylamide"
category = "drugs"
tags = ["tripping", "trip sitting", "research", "psychology", "drug", "drugs", "substances", "Lysergide", "LSD", "Acid", "LSD-25"]
language = "english"

["https://psychonautwiki.org/wiki/DMT"]
title = "DMT"
description = "N,N-Dimethyltryptamine (also known as DMT, N,N-DMT, Dmitri, and The Spirit Molecule) is a classical psychedelic substance of the tryptamine class. Among psychedelics, it is known for its unique ability to produce short-lived but intense visionary states and complete hallucinations. It is thought to produce its effects by binding to serotonin receptors in the brain, although the precise mechanism is not fully understood."
full_description = "DMT is present in over 65 species of plants and has been identified as being a normal constituent of human metabolism and an endogenous neurotransmitter in certain rodents. Its presence is also known to be widespread throughout the plant kingdom. Although various theories have been postulated, its neurobiological function has yet to be determined. When vaporized or smoked, DMT produces short-lived effects with a very rapid onset that is sometimes described as an inconceivably high-speed rollercoaster ride. When ingested in combination with a MAOI or RIMA agent, it becomes active orally and significantly longer lasting, immersive, and interactive in nature: this combination is known as pharmahuasca. See also ayahuasca. Unlike most highly prohibited substances, DMT has not been proven to be addictive or physiologically toxic.[1][4] However, adverse reactions such as severe anxiety, delusions and psychosis are always possible, even for experienced users, and particularly for those predisposed to mental disorders.[5]"
clearnet = "https://psychonautwiki.org/wiki/DMT"
status = "Operational"
subject_type = "Dimethyltryptamine"
category = "drugs"
tags = ["tripping", "trip sitting", "research", "psychology", "drug", "drugs", "substances", "Dimethyltryptamine", "DMT", "The Spirit Molecule"]
language = "english"

["https://psychonautwiki.org/wiki/Datura"]
title = "Datura"
description = "Datura (also known as devil's trumpet, moonflower, jimsonweed, devil's weed, hell's bells, thorn-apple, and many others) is a genus of nine species of poisonous flowering plants belonging to the family Solanaceae. Datura is known as powerful and dangerous deliriants, used for shamanic and medical purposes, as well as poisons. They contain the potent anticholinergic substances scopolamine, hyoscyamine, and atropine primarily in their seeds and flowers."
full_description = "Datura's precise and natural distribution seem to be throughout most of the temperate and tropical regions of the globe, owing to its extensive cultivation and naturalization. The two most well-known species are Datura inoxia and Datura stramonium. Both have been used in a shamanic context for religious purposes on most continents since before recorded history throughout the ancient Americas, Europe, and India. The potency of Datura is highly variable, as the potency varies depending on mother plants age, the weather it was grown in and the location its growing in. This makes Datura highly dangerous to use as a substance and can lead directly to death, it is highly advised the user does not start with a delirium inducing dosage and uses a scale to measure the dose (though its never safe despite the measuring tools you use.) The principal psychoactive constituents of all datura plants are the tropane alkaloids scopolamine, hyoscyamine, and atropine. These constituents are structurally analogous compounds. These tropane alkaloids contain a substituted tropane ring, a seven-membered ring with an N-methylated nitrogen bridge between R1 and R5. Scopolamine additionally has an oxygen bonded to R6 and R7 of this bicyclic structure to form a three membered oxirane ring. They also contain a propionic acid chain, CH3CH2COOH, which is substituted at R2 with an aromatic phenyl ring and at R3 with a hydroxyl group OH-. The propionic acid chain is linked at R1 through an oxygen atom to R3 of the substituted tropane ring to form an ether. These compounds are secondary metabolites synthesized naturally by various plants. The ratio of these compounds in datura plants varies greatly depending on location, growing conditions, etc. The datura genus contains other chemical constituents, but limited research has been done on their properties. Scopolamine, hyoscyamine, and atropine have a stereocenter at R2 of their propionic chain. Hyoscyamine is the levorotorary enantiomer of atropine. The alkaloids within datura exert their effects by acting as competitive antagonists at muscarinic acetylcholine receptors, primarily muscarinic acetylcholine receptors M1 and M2. Although the precise mechanism is not understood, it’s this inhibition of acetylcholine which leads to delirium, sedation and intensely realistic hallucinations alongside of extremely uncomfortable and dysphoric physical side effects. All parts of Datura plants contain dangerous levels of the tropane alkaloids atropine, hyoscyamine, and scopolamine, which are classified as deliriants, or anticholinergics. The risk of fatal overdose is high among uninformed users, and many hospitalizations occur among recreational users who ingest the plant for its psychoactive effects. Deliberate or inadvertent poisoning resulting from smoking jimsonweed and other related species has been reported."
clearnet = "https://psychonautwiki.org/wiki/Datura"
status = "Operational"
subject_type = "Datura"
category = "drugs"
tags = ["tripping", "trip sitting", "research", "psychology", "drug", "drugs", "substances", "Datura", "moonflower", "devil's trumpet"]
language = "english"

["https://psychonautwiki.org/wiki/Cannabis"]
title = "Cannabis"
description = "Cannabis (also known as thc, marijuana, weed, pot, grass, hemp, and many others) is a preparation of the cannabis plant that produces psychoactive effects when consumed (via smoking, vaporizing, or ingestion). It is the most used illicit substance in the world. The mechanism of action is binding activity at cannabinoid receptors distributed throughout the body."
full_description = "The principal psychoactive constituent of cannabis is tetrahydrocannabinol (THC), which makes up one of 483 known compounds in the plant,[8] including at least 84 other cannabinoids such as cannabidiol (CBD), cannabinol (CBN), tetrahydrocannabivarin (THCV),[9][10] and cannabigerol (CBG). At least three species are recognized: Cannabis sativa, Cannabis indica, and Cannabis ruderalis. The earliest recorded uses of cannabis date from the 3rd millennium BC.[11] In modern times, cannabis is used for recreational or medicinal and religious or spiritual purposes.[12] It played a central role in the 1960s youth counterculture movement and is associated with the art and music of this era. Subjective effects include sedation, appetite enhancement, immersion enhancement, creativity enhancement, increased sense of humor, increased music appreciation, visual disconnection, and euphoria. The effects can vary widely depending on dose, strain & form, tolerance, and set and setting. Notably, it can either strongly suppress or enhance anxiety depending on the individual and situation. Lower doses are associated with relaxing effects similar to a depressant. Higher doses are associated with mild-to-moderate hallucinogenic effects such as visual hallucinations, conceptual thinking and time distortion, as well as a greater risk of anxiety, paranoia, and delusions (generally more prevalent with sativa strains). Cannabis is considered to have low to moderate abuse potential.[citation needed] Chronic use is associated with escalating tolerance and psychological dependence in some individuals.[citation needed] It has very low physical toxicity and is essentially impossible to physically overdose on. However, it is capable of exacerbating certain mental health symptoms like delusions or psychosis in predisposed individuals (see this section). The earliest recorded uses of cannabis date from the 3rd millennium BC.[11] In modern times, cannabis is used for recreational or m