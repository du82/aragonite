["https://judiciary.house.gov/sites/evo-subsites/republicans-judiciary.house.gov/files/evo-media-document/NSF-Staff-Report_Appendix.pdf"]
title = "THE WEAPONIZATION OF THE NATIONAL SCIENCE FOUNDATION: HOW NSF IS FUNDING THE DEVELOPMENT OF AUTOMATED TOOLS TO CENSOR ONLINE SPEECH “AT SCALE” AND TRYING TO COVER UP ITS ACTIONS"
description = "February 6, 2024 Press Release WASHINGTON, D.C. – The House Judiciary Committee and its Select Subcommittee on the Weaponization of the Federal Government released an interim staff report titled, 'The Weaponization of the National Science Foundation: How NSF is Funding the Development of Automated Tools to Censor Online Speech 'At Scale' and Trying to Cover Up its Actions.'"
full_description = "The report details the National Science Foundation's (NSF) funding of artificial intelligence (AI)-powered censorship and propaganda tools, and its repeated efforts to cover up and avoid political and media scrutiny. In the name of combatting alleged misinformation regarding COVID-19 and the 2020 election, NSF has been issuing multi-million-dollar grants to university and non-profit research teams. The purpose of these taxpayer-funded projects is to develop AI-powered censorship and propaganda tools that can be used by governments and Big Tech to shape public opinion by restricting certain viewpoints or promoting others. Non-public documents obtained by the House Judiciary Committee and the Select Subcommittee on the Weaponization of the Federal Government demonstrate that these federal bureaucrats, 'disinformation' researchers, and non-profit groups understood that their actions—'content moderation' and combatting so-called misinformation—amounted to 'censorship.' And yet, NSF forged ahead, supporting new technologies that would essentially enable the censorship of online speech 'at scale.' From legal scholars to conservative journalists, NSF tracked any public criticism of its work in funding misinformation projects. NSF went so far as to develop a media strategy that considered blacklisting certain American media outlets because they were scrutinizing NSF's funding of censorship and propaganda tools."
clearnet = "https://judiciary.house.gov/sites/evo-subsites/republicans-judiciary.house.gov/files/evo-media-document/NSF-Staff-Report_Appendix.pdf"
status = "Operational"
category = "education"
tags = ["NSF", "national science foundation", "house judiciary", "pdf", "publication", "censorship"]
language = "english"

