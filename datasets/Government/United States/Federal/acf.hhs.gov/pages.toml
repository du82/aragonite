["https://acf.hhs.gov/office-external-affairs"]
title = "Office of External Affairs (OEA) | The Administration for Children and Families"
description = "The Office of External Affairs (OEA) leads the Administration for Children and Families’ (ACF) national external engagement efforts and supports cross-cutting initiatives. An office function within ACF’s Immediate Office of the Assistant Secretary (IOAS), OEA plays a crucial role in stakeholder engagement by serving as the bridge between ACF and its partners. Building and maintaining a network of positive, productive relationships with stakeholders—both internal and external to ACF—OEA helps the agency develop a more informed understanding of the needs and expectations of the communities it serves, thereby enabling ACF to achieve its goal of strengthening the economic and social well-being of children and families. OEA is led by the Deputy Assistant Secretary for External Affairs, a political appointee, and comprises a Director of Stakeholder Engagement, a Technical Writer-Editor, as well as internal and external stakeholder liaisons. "
