description = "The Department of Health and Human Services (HHS), Administration for Children and Families (ACF), Children’s Bureau is responsible for the implementation and management of the Adoption and Foster Care Analysis and Reporting System (AFCARS). State and tribal title IV-E agencies are required to report AFCARS demographic, case-related, and service information on all children in foster care and children who have been adopted with title IV-E agency involvement (per §479 of the Social Security Act). The regulations were updated via the final rule published in May 2020 (85 FR 28410). Title IV-E agencies are required to submit the AFCARS data twice a year based on two 6-month reporting periods."
