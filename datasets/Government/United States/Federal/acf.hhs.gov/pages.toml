["https://acf.hhs.gov/fysb/resources-address-human-trafficking-among-vulnerable-youth"]
title = "Intersection of Human Trafficking, Youth Homelessness, Intimate Partner Violence, and Adolescent Pregnancy Prevention | The Administration for Children and Families"
description = "Human trafficking is a criminal issue and a public health challenge. It can happen to any person of any race, age, gender, socioeconomic background, sexual orientation, ethnicity, religion or nationality. However, some populations are more vulnerable to human trafficking than others. The Family and Youth Services Bureau (FYSB) funded projects serve children, youth, individuals, and families nationwide that have been impacted by extreme trauma and adverse experiences. Certainly, intimate partner violence, homelessness, lack of youth supporting systems, socio-economic challenges, and structural racism and inequities increase the risks for multiple victimizations, including human trafficking."
