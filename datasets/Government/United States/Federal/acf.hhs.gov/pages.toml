["https://acf.hhs.gov/ecd/newsletter/ecdnewsletter/december-2023-ecd-latest-newsletter"]
title = "December 2023 ECD Newsletter | The Administration for Children and Families"
description = "Dear Colleagues:    Happy Holidays! At the Office of Early Childhood Development, we've accomplished so much in 2023, and I can't wait to continue working to make next year one of our best year yet. Before we ring in 2024, I'd like to share some highlights from this past year.  The Office of Early Childhood Development (ECD) announced new funding totaling $24,500,000 to 34 tribes and tribal organizations nationwide to create culturally grounded, evidence-based home visiting programs. These funds are part of the Tribal Maternal, Infant, and Early Childhood Home Visiting (MIECHV) program, which help and promote the health and well-being of American Indian and Alaska families.   ECD had the opportunity to collaborate with the U.S. Department of Education on a new joint policy statement supporting the inclusion of children with disabilities in early childhood programs. The Policy Statement on the Inclusion of Children with Disabilities in Early Childhood Programs updates a 2015 statement. It includes a renewed commitment and urgency as children with disabilities continue to face barriers to accessing and fully participating in inclusive early childhood programs.  The Administration for Children and Families (ACF) also established the National Early Care and Education Workforce Center, the first of its kind in the country. The Center is the result of an investment to fund research and technical assistance for states, municipalities, territories, and tribal countries. This investment aims to promote the recruitment and retention of a diverse and talented workforce throughout early care and education programs.   The Office of Head Start worked on a supporting the workforce and consistent quality programming: a Notice of Proposed Rule Making (NPRM) that will assist Head Start programs in hiring and retaining qualified educators while ensuring consistent quality programming for the children and families served. The proposed rule would require Head Start educators to be paid at least the same as preschool teachers in public schools. Once fully implemented, this will enhance compensation for Head Start educators.  Lastly, we are proud of the Biden Administration's work to strengthen our country's child care system. The Administration has urged nearly every agency to use existing funding and programs to improve access to child care through the executive order (EO). The Biden Administration's commitment has resulted in the most comprehensive set of initiatives taken by any administration to date to enhance access to high-quality child care, long-term care, and caregiver assistance.   We are excited to continue collaboration with each and every one of you as we move into action in 2024, with the goal of prioritizing young children and their families, as well as the early childhood workforce.  With appreciation,    Katie Hamm, Deputy Assistant Secretary for Early Childhood Development "
year_published = 2025
