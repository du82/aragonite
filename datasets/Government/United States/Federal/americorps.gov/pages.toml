title = "AmeriCorps 30: Supporting Healthy Futures for West Virginian Children and Families | AmeriCorps"
description = "In 1988, a 13-year-old's story of surviving and escaping sexual abuse inspired the establishment of Step by Step, a writing group of youth in foster care. The organization did everything to spread stories like these to the world and develop peer support systems. For more than 35 years, Step by Step has continued to grow from the stories and needs of our communities, working to bring stories as witnesses to the world and creating opportunities for people to support each other and meet challenges during times of need. "
