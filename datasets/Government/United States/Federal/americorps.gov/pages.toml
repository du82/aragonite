description = "On Thanksgiving, Americans are reminded to pause and give thanks for the comforts and security in our lives and for the people we share those things with. When we do so, it puts into perspective not only what we have but also what we can give. The Giving Season is not so much about material gifts as it is about personal ones. Giving the gift of your time can be more special and powerful than any material item. It can transform lives. Acts of Service"
