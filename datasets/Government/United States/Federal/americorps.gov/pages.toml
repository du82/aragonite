title = "Return on Investment Study: Green City Force | AmeriCorps"
description = "Green City Force (GCF), operating in Brooklyn, New York, uses workforce training to improve the economic mobility of AmeriCorps members, all of whom reside in New York City Housing Authority (NYCHA) housing. During the six-month program, members gain hands on experience with building sustainable infrastructure, engaging in urban agriculture, and distributing fresh produce. That experience can lead to green career pathways such as energy conservation assistants, compost coordinators, solar energy installers, energy auditors, and other positions and apprenticeships."
