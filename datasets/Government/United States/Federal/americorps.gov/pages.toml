["https://americorps.gov/evidence-exchange/return-investment-study-americorps-seniors-foster-grandparent-program-senior"]
title = "Return on Investment Study: AmeriCorps Seniors Foster Grandparent Program and Senior Companion Program | AmeriCorps"
description = "AmeriCorps Seniors is composed of three programs: the Foster Grandparent Program (FGP), the Senior Companion Program (SCP), and the Retired and Senior Volunteer Program (RSVP). Throughout the United States, FGP engages volunteers age 55 and over to serve in communities as role models, mentors, and friends to children. SCP engages volunteers to provide assistance and companionship primarily to elderly individuals—and also to people with disabilities—who have difficulty with daily living tasks."
