["https://www.disasterassistance.gov/help-desk/korean"]
title = "한국인 | disasterassistance.gov"
description = "귀하가 원하시는 언어로 FEMA의 도움을 받으세요. 이 웹사이트와 온라인 신청은 현재는 영어와 스페인어로만 가능합니다. FEMA 재난 부조 신청을 하거나 자신의 신청에 대해 질문이 있으시면, 주 7일 1-800-621-3362로 문의하십시오. FEMA에는 귀하를 도울 수 있도록 250개 언어별로 유자격 통역사가 있습니다. 영어 및 스페인어 외의 언어는 3을 누르십시오. 자신의 언어 선택 FEMA 직원에게 연락하시면, 통역사를 연결해 드릴 것입니다. 통역사를 부르는 동안 조금 더 기다리셔야 할 수 있습니다. 통역사는 통화 전 시간 동안 귀하 및 담당직원과 함께 통화 상태로 대기하게 됩니다. 또한, 다음의 글을 읽어 FEMA의 절차에 관해 보다 자세히 알아보실 수 있습니다."
