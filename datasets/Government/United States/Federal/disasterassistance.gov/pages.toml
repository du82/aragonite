["https://www.disasterassistance.gov/help-desk/chinese"]
title = "官话 | disasterassistance.gov"
description = "用你选择的语言获得FEMA帮助。 本网站和在线申请目前可用的语言只有英语和西班牙语。如果你需要申请FEMA灾难协助或者就你的申请有任何问题的话，请拨打电话1-800-621-3362，一周七天皆可。FEMA有250个语言的合格的口译员在线协助你。 按3获取英语或西班牙语之外的语言帮助。 选择你的语言 你的电话被FEMA代表接通之后，FEMA工作人员会马上接通一位口译员。他们接通口译员可能需要时间，你需要稍微等一下。在你与工作人员通话期间，口译员会全程在线。 请阅读以下信息了解FEMA申请流程："
