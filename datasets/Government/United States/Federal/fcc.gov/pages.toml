["https://fcc.gov/encyclopedia/freedom-information-act-electronic-reading-room"]
title = "Freedom of Information Act Electronic Reading Room | Federal Communications Commission"
description = '''Subsection (a)(2) of the Freedom of Information Act, commonly known as the FOIA, requires federal agencies to make four types of records affirmatively available for "public inspection and copying." Agencies may satisfy this requirement by either providing the designated documents solely in an electronic Reading Room on an agency website, or in a combination of electronic and conventional Reading Rooms. The Federal Communications Commission satisfies this requirement (Certification) through a combination of electronic and conventional Reading Rooms. Conventional Reading Room - FCC Reference Information Center The Reference Information Center is the official Commission custodian for many of the Commission records that meet the FOIA Reading Room requirements. The Center provides a convenient, central location for members of the general public wishing to research and obtain record information on applications, formal and informal proceedings, and FCC programs and activities. The Reference Information Center is located in Room CY-A257 at the Commission’s Headquarters. It is open to the public Monday through Thursday from 8:00 AM to 4:30 PM and from 8:00 AM to 11:30 AM on Friday. Electronic Reading Room Listed below are links that will take you directly to the four types of information required in an Electronic Reading Room. BUT, these links are just a small taste of what is available on the Commission's web site.'''
