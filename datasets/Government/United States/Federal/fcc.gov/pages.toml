["https://fcc.gov/general-counsel/general/freedom-information-act"]
title = "Freedom of Information Act | Federal Communications Commission"
description = "The Freedom of Information Act is the law that gives you access, with certain exceptions, to documents and records about the functions, procedures, policies, decisions and operations of federal government departments and agencies. The following is an overview of the FCC's FOIA rules, how FOIA requests work and how you can file a FOIA request with the FCC. What is the FOIA? Please note that you do not always need to file a FOIA request to get information about the FCC. The FCC routinely makes a wide variety of information about its decisions and actions available to the public through this website and its Reference Information Center (445 12th Street, S.W., Washington, D.C. 20554; open to the public 8:00 AM to 4:30 PM Monday through Thursday and 8:00 AM to 11:30 AM on Friday). Among the types of information routinely available are comments filed by the public, records from docketed cases, broadcast applications and related files, petitions for rulemakings, various legal and technical publications, legislative history compilations, etc. (See47 C.F.R. §§ 0.453 and 0.455.)"
