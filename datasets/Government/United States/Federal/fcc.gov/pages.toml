["https://fcc.gov/general/no-fear-act-data"]
title = "No FEAR Act | Federal Communications Commission"
description = "The No Fear Act, Public Law 107-174, requires that federal agencies be publically accountable for violations of anti-discrimination and whistleblower protection laws.  Federal agencies must post both quarterly and annual statistical data relating to federal sector Equal Employment Opportunity (EEO) complaints on its public website, reimburse the Judgment Fund for any payments made, notify employees and applicants for employment about their rights under the federal antidiscrimination and whistleblower laws.  The No Fear Act and its implementing regulations also require federal agencies to report annually on: The number of cases pending or resolved in Federal District Court in each fiscal year arising under federal antidiscrimination and whistleblower protection laws; The total number of employees disciplined and the specific nature of the disciplinary action taken for violation of antidiscrimination and whistleblower protection laws; Final year-end statistical data of federal sector EEO activity; A detailed description of the agency’s policy for taking disciplinary action for conduct that is found to violate federal antidiscrimination and whistleblower protection laws; An analysis of the trends and causes of complaints of discrimination, as well as practical knowledge gained though experience and actions planned or taken to improve complaint or civil rights programs with the goal of eliminating discrimination. Amounts reimbursed for any payments made from the Judgment Fund and any budgetary adjustments required to comply with the reimbursement obligation; and A written plan to train employees about their rights.  "
year_published = 2025
