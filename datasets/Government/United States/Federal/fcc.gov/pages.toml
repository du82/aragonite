["https://fcc.gov/general-counsel/general/attorney-honors-program"]
title = "Attorney Honors Program | Federal Communications Commission"
description = "Honors.Program@fcc.gov The Federal Communications Commission’s Attorney Honors Program is a two-year employment and training program designed to introduce law school graduates to the field of communications law and policy. On August 1, 2015 the FCC will begin accepting applications for the fall 2016 class from law students in their final year of study and judicial clerks. The application deadline was September 14, 2015. Honors Program attorneys will participate in the many varied aspects of federal administrative practice as they relate to the FCC’s oversight of television, radio, cable, wireless, wireline, satellite, and other communications services and facilities. Participants also will benefit from a wide variety of learning experiences. Attorneys at the FCC draft decisions in adjudicatory and rulemaking matters, work with internal and external constituencies to resolve complex policy issues before the agency, participate in international negotiations, represent the FCC in dealings with other government agencies, Congress and the private sector, and defend FCC decisions in the federal courts."
