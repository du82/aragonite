["https://fcc.gov/general/emergency-access-advisory-committee-eaac"]
title = "Emergency Access Advisory Committee (EAAC) | Federal Communications Commission"
description = "The charter of the Emergency Access Advisory Committee (EAAC) expired on July 14, 2013. This webpage is an archive of EAAC meeting minutes, meeting presentations, reports, and related activities. The EAAC was chartered on January 14, 2011 to determine the most effective and efficient technologies and methods by which to enable equal access to emergency services by individuals with disabilities as part of the nation’s migration to Next Generation 911 (NG9-1-1), and to make recommendations to the Commission on how to achieve those effective and efficient technologies and methods. During its term, the EAAC met on a regular basis, formed subcommittees to study and report on specific topics such as text-to-911, gaps in existing public safety standards, and the TTY transition. As required under the CVAA, the EAAC conducted a nationwide survey of individuals with disabilities and released a report on that survey on July 21, 2011, as well as a number of other reports listed below on this webpage."
