["https://fcc.gov/licensing"]
title = "Licensing | Federal Communications Commission"
description = "The FCC is responsible for managing and licensing the electromagnetic spectrum for commercial users and for non-commercial users including: state, county and local governments. This includes public safety, commercial and non-commercial fixed and mobile wireless services, broadcast television and radio, satellite and other services.  In licensing the spectrum, the Commission promotes efficient and reliable access to the spectrum for a variety of innovative uses as well as promotes public safety and emergency response. FCC Licensing Systems Getting Registered - If you wish to conduct business with the FCC, you must first register through the FCC's COmmission REgistration System (CORES). Upon registration, you will be assigned a FCC Registration Number (FRN). This number will be used to uniquely identify you in all transactions with the FCC."
year_published = 2025
