description = "Learn how to prepare for a biological threat, as well as what to do during, and after a biological threat. バイオハザード暴露の前 暴露の可能性がある間 生物由来物質は、人、家畜、作物を殺害、または障害を与える可能性のある有機体、または毒素です。生物学的事象は、偶発的または意図的の可能性があります。どちらの事象も、病気になる可能性があります。 偶発的または意図的に人を傷つける可能性のある生物由来物質には、細菌、ウイルス、毒素の３つの基本グループがあります。生物由来物質は、人と人との接触で空気中に噴霧、動物が感染してから人と接触、または食品や水が汚染された場合、蔓延する可能性があります。"
