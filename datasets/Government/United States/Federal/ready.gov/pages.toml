title = "화학물질 및 유해물질 사고 | Ready.gov"
description = "Learn how to stay safe before, during, and after a hazardous materials incident. 발생 전 대비하기 재난 발생 중 살아남기 재난 발생 후 안전 유지 위험 물질에는 폭발물, 인화성 및 가연성 물질, 독극물 및 방사성 물질이 해당될 수 있습니다 화학 물질은 사람, 동물 또는 식물에 유독한 영향을 미치는 유독성 증기, 에어로졸, 액체 및 고체 형태가 있습니다. 위험 물질의 생산, 보관, 운송, 사용 또는 폐기 중에 비상 사태가 발생할 수 있습니다. 화학물질이 안전하지 않게 사용되거나 거주지, 직장 또는 놀이 공간에 해로운 양이 방출되면 위험에 처할 수 있습니다. 화학물질 유출의 징후에는 호흡 곤란, 눈 자극, 조정능력 상실, 메스꺼움 또는 코, 목, 폐의 작열감 등이 있습니다. 곤충이나 새가 많이 죽어 있는 것은 화학물질의 유출을 나타낼 수 있습니다."
