description = "Colleges and universities are encouraged to regularly review, update, and exercise their emergency plans several times a year. Find resources here. 정보 얻기 해당 지역에 영향을 줄 수 있는 재난, 대피가 필요한 재난과 현 장소에서의 대피(shelter in place)를 해야 하는 시기를 알아두십시오.NOAA 기상 라디오 지역 비상 방송국에 주파수를 맞추고 TV와 라디오를 주시하며, 해당 지역의 악천우와 관련해 모바일 경보 및 모바일 경고를 따르십시오.FEMA 앱을 다운로드하고 미국 내 최대 5개 지역에 대한 기상청의 기상 경보를 수신합니다. 계획 세우기 재난 발생 시 대학은 연방, 주, 지방, 부족, 영토 및 민간 부문 기관과 주요한 비상 관리 협력자 역할을 합니다. 교육기관은 1년에 여러 차례 정기적으로 비상 계획을 검토하고 업데이트하며 훈련하는 것이 좋습니다."
