["https://ready.gov/es/kit"]
title = "Prepare un kit de suministros | Ready.gov"
description = "A disaster supplies kit is simply a collection of basic items your household may need in the event of an emergency.Try to assemble your kit well in advance of an emergency. You may have to evacuate at a moment’s notice and take essentials with you. You will probably not have time to search for the supplies you need or shop for them. You may need to survive on your own after an emergency. This means having your own food, water and other supplies in sufficient quantity to last for at least 72 hours. Local officials and relief workers will be on the scene after a disaster but they cannot reach everyone immediately. You could get help in hours or it might take days. Después de una emergencia, es posible que deba sobrevivir por su cuenta durante varios días. Estar preparado significa tener su propia comida, agua y otros suministros para durar varios días. Un kit de suministros de desastres es una colección de artículos básicos que su hogar puede necesitar en caso de una emergencia."
year_published = 2025
