["https://ready.gov/es/acerca-de-la-campana-de-ready"]
title = "Sobre la Campaña Ready | Ready.gov"
description = "Launched in February 2003, Ready is a national public service advertising (PSA) campaign designed to educate and empower Americans to prepare for and respond to emergencies including natural and man-made disasters. The goal of the campaign is to get the public involved and ultimately to increase the level of basic preparedness across the nation. Ready and its Spanish language version Listo ask individuals to do three key things: (1) build an emergency supply kit, (2) make a family emergency plan and (3) be informed about the different types of emergencies that could occur and their appropriate responses. The campaign’s messages have been distributed through: television, radio, print, outdoor and Web (PSAs) developed and produced by The Advertising Council; brochures; www.Ready.gov and www.Listo.gov Web sites; toll-free phone lines 1-800-BE-Ready and 1-888-SE-Listo; and partnerships with a wide variety of public and private sector organizations. Lanzado en febrero de 2003, Ready es una campaña nacional de servicio público diseñada para educar y capacitar al pueblo estadounidense para prepararse, responder y mitigar emergencias, incluidos desastres naturales y provocados por el hombre. El objetivo de la campaña es promover la preparación a través de la participación pública. Ready y su versión en español Listo les pide a las personas que hagan cuatro cosas clave:"
year_published = 2025
