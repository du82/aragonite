description = "Learn how to stay safe before, during, and after a hazardous materials incident. 事前に準備ましょう 間を生き延びましょう 後に安全でましょう 危険物には、爆発物、引火性および可燃性物質、毒物、放射性物質が含まれる可能性があります。化学物質は、人、動物、または植物に有毒作用を及ぼす有毒な蒸気、エアロゾル、液体、および固体です。緊急事態は、危険物の製造、保管、輸送、使用、または廃棄中に発生する可能性があります。化学物質は、あなたが生活、仕事、遊びをする場で、危険に使用、または有害な量が放出されると、危険にさらされます。 化学物質放出の兆候は、呼吸困難、目がヒリヒリする、体を思うように動かせない、吐き気、鼻、のど、肺の焼けるような痛さなどがあります.昆虫や鳥の死骸が多数ある場合、化学物質の放出を示す可能性があります。"
