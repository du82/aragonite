["https://usccr.gov/reports/no-fear-act"]
title = "EEO Data Posted Pursuant to the No Fear Act | U.S. Commission on Civil Rights"
description = "The No Fear Act (Public Law 107-174) requires that federal agencies be publicly accountable for violations of anti-discrimination and whistleblower protection laws. Federal agencies must post both quarterly and annual statistical data relating to federal sector Equal Employment Opportunity (EEO) complaints on its public website, reimburse the Judgment Fund for any payments made, and notify employees and applicants for employment about their rights under the federal antidiscrimination and whistleblower laws."
