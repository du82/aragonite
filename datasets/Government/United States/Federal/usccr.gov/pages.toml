["https://usccr.gov/accessibility"]
title = "Accessibility | U.S. Commission on Civil Rights"
description = "Section 508 of the Rehabilitation ActSection 508 of the Rehabilitation Act of 1973, as amended (29 U.S.C. § 794d) requires all electronic and information technology (also referred to as information and communication technology) that is developed, procured, maintained, or used by a federal agency to be accessible to people with disabilities. Examples of information and communication technology include websites, telephones, multimedia devices, and copiers. Access available to individuals with disabilities must be comparable to access available to others."
