["https://usccr.gov/ipv6"]
title = "IPv6 Policy | U.S. Commission on Civil Rights"
description = "In accordance with Office of Management and Budget (OMB) Memorandum 21-07 (M-21-07), dated November 19, 2020, by Fiscal Year (FY) 2023, all new US Commission on Civil Rights (USCCR) information systems must be IPv6-enabled at the time of deployment. It is also the strategic intent of US Commission on Civil Rights to phase out the use of IPv4 for all current systems as soon as practical by meeting the milestones laid out by M-21-07, to include at least 80% of IP-enabled assets on USCCR networks operating in IPv6-only environments by the end of FY 2025."
