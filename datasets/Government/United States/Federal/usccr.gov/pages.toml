description = "The District of Columbia Advisory Committee to the U.S. Commission on Civil Rights took up a study on May 18, 2023 regarding access to special education and transportation services in D.C. for students with disabilities. Through its study, the Committee has examined if policies, practices, and procedures limit access to these services on the basis of race, color, religion, sex, age, disability, or national origin, or in the administration of justice. "
