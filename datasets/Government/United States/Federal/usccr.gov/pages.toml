["https://usccr.gov/reports/2024/rising-use-artificial-intelligence-k-12-education"]
title = "The Rising Use of Artificial Intelligence in K-12 Education | U.S. Commission on Civil Rights"
description = "On December 13, 2023, the Pennsylvania Advisory Committee to the U.S. Commission on Civil Rights adopted a proposal to study the rising use of artificial intelligence (AI) in K-12 education. The focus of the Committee’s inquiry was to examine how AI algorithms are developed, and the impact they can have on either reducing or exacerbating existing disparities (or creating new disparities) in K-12 classrooms based on federally protected classes. The Committee also examined potential solutions and recommendations to remediate identified concerns."
