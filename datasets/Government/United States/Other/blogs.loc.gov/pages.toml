["https://blogs.loc.gov/bibliomania/2024/12/17/just-my-type-making-letters-at-the-type-foundry/?loclr=blogbib"]
title = "Just My Type: Making Letters at the Type Foundry | Bibliomania"
description = "Most of us learned in school that Johannes Gutenberg invented the printing press, which is not entirely accurate. He is, however, conventionally credited with inventing the process of mass-producing individual pieces of type. These innovations in moveable type allowed for books to be efficiently produced in large quantities and revolutionized the human ability to share ideas. This post explains the multi-step process of mass-producing metal letters to be used in printing texts."
