["https://blogs.loc.gov/folklife/2024/12/shipwreck-stories-with-patrick-tayluer"]
title = "Like a Snap of a Carrot: Shipwreck Stories with Patrick Tayluer | Folklife Today"
description = "When William Main Doerflinger interviewed the retired sailor and shanty singer Patrick Tayluer in April, 1942, one of the topics he asked Tayluer about was shipwrecks. This is not surprising: ever since people took to the seas in ships, maritime folks have been fascinated and terrified by shipwrecks; shipwreck stories go back to the Middle Kingdom of Ancient Egypt. As it turned out, Tayluer had several stories about shipwrecks, which he told as first-person narratives, but which might not have happened exactly as he described. We’ll look at two of those stories in this post, exploring Tayluer's fascinating blend of fact and fiction."
year_published = 2025
