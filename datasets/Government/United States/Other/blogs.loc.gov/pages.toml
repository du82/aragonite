title = "Community Collections Grant: Los Pleneros de la 21 and Documenting Bomba and Plena Musicians in the Diaspora | Folklife Today"
description = "In 2024, Los Pleneros de la 21--a NYC-based organization whose members specialize in teaching and performing the Puerto Rican musical genres of bomba and plena--were awarded with a Community Collections Grant (CCG) by the American Folklife Center, to document musicians, teachers, and community members involved in bomba and plena music in New York, New Jersey, and Connecticut. This post is an excerpt of an interview with LeAna López, the primary interviewer for the project, about the group's CCG work. The full interview is accessible on the Library of Congress' Of the People blog."
