["https://bbc.com/news/articles/c93qglwr6yzo"]
title = "Play highlights history of lost Hull Tudor fortress"
description = "Theatre performances will tell the story of Hull's South Blockhouse which was built by Henry VIII."
full_description = '''Play highlights history of lost Tudor fortressHull MaritimeThe South Blockhouse was built in the 1540s at the mouth of the River HullA theatre performance will tell the history of a lost 16th Century fortress in Hull.The South Blockhouse was built by Henry VIII at the mouth of the River Hull.It was torn down in 1864 but the remains, including walls, earthworks and a cannon, were uncovered by archaeologists during various digs dating from the 1990s.It is planned to turn the site into a visitor attraction.The play, titled When Cannons Were Roaring: The Story of Hull's South Blockhouse, will be performed by actors from the city's Northern Academy of Performing Arts (NAPA) in March. NAPA's chief executive Carl Wheatley described it as an "exciting project"."Through immersive performances, we'll bring the history of the South Blockhouse to life, engaging the audience in a truly unique way," he said."Our performances will not only educate but allow the public to experience history through live theatre, with the added benefit of Q&A sessions and access to informative handouts."The performance will look at the history of the building from its construction in the 1540s to its use as a prison for Catholics and its role during the English Civil War.Humber Field ArchaeologyA number of artefacts have been uncovered including a cannonNAPA said there would be an emphasis on prioritising accessibility, "with specific efforts to ensure that all members of the community can fully engage with the performances". A "touch tour" will be offered to visually impaired attendees, allowing them to interact with the set, costumes, and props used in the production. A sign language interpreter will also be on stage during one of the performances.The event is a partnership between NAPA, Hull Maritime and Hull City Council.The show will be held at various venues across the city, including Hull Minster, Victoria Dock Village Hall, Hymers College as well as the NAPA building.Listen to highlights from Hull and East Yorkshire on BBC Sounds, watch the latest episode of Look North or tell us about a story you think we should be covering here.More related storiesPlans submitted for South Blockhouse attractionDate set for Henry VIII castle attractionHenry VIII blockhouse dig to resumeRelated internet linksNorthern Academy of Performing Arts Hull MaritimeTheatreHullHistory'''
