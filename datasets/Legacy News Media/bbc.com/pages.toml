["https://bbc.com/news/articles/cy48v1x4dv4o"]
title = "Elon Musk responds to backlash over gesture at Donald Trump rally"
description = 'The billionaire says his critics "need better dirty tricks" after a gesture likened to a Nazi salute.'
full_description = '''Musk responds to backlash over gesture at Trump rallyElon Musk draws scrutiny over arm gesture at post-inauguration rallyElon Musk has brushed aside the furore over a one-armed gesture he gave during a speech celebrating the inauguration of Donald Trump.At Monday's event, Musk thanked the crowd for "making it happen", before placing his right hand over his heart and then thrusting the same arm out into air straight ahead of him. He then turned and repeated the action for those sitting behind him.Some on X, the social medial platform he owns, likened the gesture to a Nazi salute, though others disagreed.In response, the SpaceX and Tesla chief posted on X: "Frankly, they need better dirty tricks. The 'everyone is Hitler' attack is sooo tired."Musk, the world's richest man and a close ally of President Trump, was speaking at the Capital One Arena in Washington DC when he made the gesture."My heart goes out to you. It is thanks to you that the future of civilisation is assured," the 53-year-old said, after giving the second one-armed salute.There was immediate backlash on social media and disagreement about Musk's intent.Ruth Ben-Ghiat, a history professor at New York University, said: "Historian of fascism here. It was a Nazi salute and a very belligerent one too."But the Anti-Defamation League, an organisation founded to combat antisemitism, did not agree."It seems that Elon Musk made an awkward gesture in a moment of enthusiasm, not a Nazi salute," it posted on X.Andrea Stroppa, a confidant of Musk who has connected him with far-right Italian PM Giorgia Meloni, was reported by Italian media to have posted the clip of Musk with the caption: "Roman Empire is back starting from Roman salute".LIVE: Follow BBC's live coverageANALYSIS: Anthony Zurcher on the beginning of a new Trump eraIN PICTURES: Defining images as the 47th US president takes officeWATCH: Inauguration day in two minutesVIRAL MOMENTS: Carrie Underwood goes a cappella and Melania's air kissThe Roman salute was widely used in Italy by Benito Mussolini's Fascist Party, before later being adopted by Adolf Hitler in Germany.Stroppa later deleted his post, Italian media said. He later posted that "that gesture, which some mistook for a Nazi salute, is simply Elon, who has autism, expressing his feelings by saying, 'I want to give my heart to you'". "That is exactly what he communicated into the microphone. ELON DISLIKES EXTREMISTS!"The gesture comes as Musk's politics have increasingly shifted to the right. He has made recent statements in support of Germany's far-right AfD party and British anti-immigration party Reform UK.Appearing at the Davos at the World Economic Forum's annual meeting, German Chancellor Olaf Scholz was asked about the comparison to a Nazi salute, something that is banned in Germany. "We have the freedom of speech in Europe and in Germany," he said."... what we do not accept is if this is supporting extreme right positions. And this is what I would like to repeat again."Musk has become one of Trump's closest allies and has been tapped to co-lead what the president has termed the Department of Government Efficiency.Trump returns to powerMelania's hat, shorts in winter and other eye-catching looks Watch: Key moments from President Trump's inauguration dayTrump declares border emergency and seeks to end US birthright citizenshipElon MuskDonald TrumpUnited States'''
year_published = 2025
clearnet = "https://bbc.com/news/articles/cy48v1x4dv4o"
