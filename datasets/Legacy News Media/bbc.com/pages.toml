full_description = "Four simple hacks to succeed in every conversationOne of the key underrated skills that most people think they can master is providing critical feedback and communicating effectively in thorny situations.A career coach, a choreographer, a chef and a dragon boat captain offer advice and collaborative methods to enable people to better express their thoughts to their peers.Video by Lucie McCormickAnimation by Andi Concha & Léon Moh-Cah14 November 2023Work CultureSaveExplore MoreHow industry leaders transformed their career17 Jan 2024Work CultureWomen were the original beer brewers - what changed?7 Dec 2023Work CultureHow waiting alters our perception of time14 Nov 2023Work CultureASMR: How whispering took over the internet14 Nov 2023Work CultureA desk full of descriptions for your work colleagues14 Nov 2023Work CultureVeterinarian suicide rates are very high. Why?14 Nov 2023Work CultureUS stocks open higher, 'no shock and awe' - 21 Jan 2025Investment Strategist Edward Yardeni says Trump's threat of 25 percent tariffs by 1 February is negotiable.9 hrs agoOpening BellClaudia Winkleman's physio doesn't normally treat humansWhilst filming 'The Traitors', Claudia Winkleman was surprised to learn that her physiotherapist was a vet.2 days agoFilm & TVInside the studio of Britain's most celebrated sculptorThe BBC visits the studio of British sculptor Antony Gormley to learn how art evolves as a communal practice.2 days agoArts in MotionThe Finnish secret to happiness: Avanto and LöylyNordic etiquette: Learn how to sauna and ice plunge like a Finn and feel great afterwards.2 days agoThe SpeciaListWashington DC's biggest myths and mysteries debunkedRobert Pohl, author and veteran tour guide, explains what's behind the US capital's most famous urban legends.4 days agoThe Travel ShowHow technology can monitor and improve our healthBBC Click visits CES 2025 to find out about the latest health tech, from medical tools to well-being devices.5 days agoInnovationMe