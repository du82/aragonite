["https://bbc.com/news/articles/cvgl8zl7014o"]
title = "US trades Taliban prisoner for American detainees Ryan Corbett and William Wallace McKenty"
description = "Two Americans held by the Taliban were exchanged for an Afghan imprisoned in the US on narco-terrorism charges."
full_description = '''US trades Taliban prisoner for two American detaineesAnna CorbettRyan Corbett pictured with his wife Anna in an undated photoTwo Americans held by the Taliban authorities in Afghanistan have been exchanged for an Afghan imprisoned in the US on drug trafficking and terrorism charges.The news emerged after Ryan Corbett and William Wallace McKenty were freed. The Afghan, Khan Mohmmad, had been serving a life sentence in a federal prison in California on drug trafficking and terrorism charges.A statement from the Taliban government in Kabul announced the agreement, which was concluded just before President Joe Biden ended his term in office. Mr Corbett's release was confirmed by his family. US media, quoting official sources, identified Mr McKenty as the second American.The deal – reportedly the culmination of two years of negotiations - was done just before Joe Biden handed over power to Donald Trump on Monday."An Afghan fighter Khan Mohammed imprisoned in America has been released in exchange for American citizens and returned to the country," the Taliban foreign ministry said in a statement.The family of Ryan Corbett thanked both administrations as well as Qatar for what they described as its vital role."Today, our hearts are filled with overwhelming gratitude and praise to God for sustaining Ryan's life and bringing him back home after what has been the most challenging and uncertain 894 days of our lives," the family said.Mr Corbett had lived in Afghanistan for many years with his family and was detained by the Taliban more than two years ago when he returned on a business trip.There are few details about Mr McKenty, whose family have asked for privacy.AFPKhan Mohammad spoke to the media on his return to Jalalabad in eastern Afghanistan on TuesdayKhan Mohammad was a member of the Taliban taken captive in Afghanistan during the US's military engagement. He was jailed in 2008. Joe Biden commuted his sentence just before he left office.The Taliban called the exchange the result of "long and fruitful negotiations" with the US and "a good example of resolving issues through dialogue"."The Islamic Emirate looks positively at the actions of the United States of America that help the normalisation and development of relations between the two countries," it said.Since the Taliban took power in 2021, they have not been formally recognised by any government.While the move is not likely to change relations between Kabul and Washington, more negotiations may follow – two other Americans are still in Afghanistan, believed to be George Glezmann and Mahmood Habibi.The Taliban are also seeking the release of an Afghan who is one of the few remaining prisoners at the US's Guantanamo Bay detention camp.At a rally in Washington on the eve of his inauguration, President Trump threatened to cut humanitarian aid to Afghanistan unless the Taliban returned the military equipment seized after the US pulled out in 2021.A US Department of Defense report in 2022 estimated that military equipment worth $7bn had been left behind in Afghanistan after US forces withdrew.US hostage swapped for jailed Taliban allyAfghanistanTalibanUnited States'''
