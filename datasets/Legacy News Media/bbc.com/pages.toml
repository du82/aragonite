["https://bbc.com/news/articles/crlkdnx8n08o"]
title = "Immersive light show to take over Beverley Minster"
description = "The installation focusses on the theme of time and comes off the back of a similar event last year."
full_description = '''Immersive light show to take over minsterBeverley MinsterBeverley Minster's light show will run from 25 February until 1 MarchA light show will take place at Beverley Minster following the success of a similar event last year.The installation will run from 25 February until 1 March, following on from 2024's Illuminating Art.The nearly 800-year-old building will be lit up inside and out and will feature immersive light and sound displays focusing on the theme of time.The event will be on every evening from 17:30 GMT, with the last entry at 19:30.The installations have previously featured at cathedrals in Salisbury and Exeter.Artistic director Peter Walker said: "Beverley Minster is one of the most beautiful buildings in the country and, therefore, following the success of our first installation there in 2024, we are delighted to bring Time to the minster."Time has had a fantastic response so far and is an artwork we spent many months researching, designing and creating."The lighting has been designed by Luxmuralis and sound composed by David Harper.Listen to highlights from Hull and East Yorkshire on BBC Sounds, watch the latest episode of Look North or tell us about a story you think we should be covering here.More on this storyImmersive light show to return to minsterSound and light show to take over Beverley MinsterLincoln Lights: Illuminated trail set for FebruaryRelated internet linksBeverley MinsterBeverleyArt'''
