["https://bbc.com/news/articles/crm73r138gxo"]
title = "Trump inauguration: Why Nigerian Pastors Bassey and Kumuyi went to Washington"
description = "The visits of William Kumuyi and Nathaniel Bassey underscores Trump's connection with evangelicalism."
full_description = '''The Nigerian pastors who went to US for Trump inaugurationGlobal Crusade with Kumuyi/Kevin Smart MediaPastor William Kumuyi had been scheduled to attend Monday's inauguration ceremony before the venue was changedTwo high-profile Nigerian clerics took part in events surrounding the inauguration of US President Donald Trump on Monday.The visits of Pastors William Kumuyi and Nathaniel Bassey served to underscore the ties between Christian evangelicalism and the incoming US administration.Trump could leverage his popularity among some religious Christians on the African continent as an alternative way to boost his influence to the more traditional channels, an analyst has told the BBC.Pastor Kumuyi was invited to Trump's swearing-in ceremony though was unable to attend after the event was moved inside due to harsh weather.Instead he spent time at a prayer service for the incoming president, as well as meeting political groups.His invitation to the inauguration was unusual. Although Trump broke tradition by inviting world leaders from countries including China, Italy and Argentina, there were no African heads of state on the guest list.Outside of the official schedule, the well-known Nigerian gospel minister, Nathaniel Bassey, performed at the US Presidential Inaugural Prayer Breakfast on Monday morning.The non-political, faith-based event was held ahead of the swearing-in ceremony, though it was not part of the official celebrations, and the president-elect did not attend.Who is William Kumuyi?Global Crusade with Kumuyi/Kevin Smart MediaWilliam Kumuyi (R) met several leading US evangelical figures including Jim Garlow (L) of the Well Versed ministryA former maths professor, Pastor Kumuyi is the founder of Deeper Life Bible Church and the convener of the worldwide evangelistic ministry, the Global Crusade With Kumuyi.The Global Crusade says its church has 120,000 attendees every week.Having travelled to Washington DC, Pastor Kumuyi posted on X that he met congressmen from the powerful conservative youth group Turning Point USA to discuss how they can "partner together for global evangelism".On Sunday, he delivered a prayer at the Inauguration Praise & Prayer Convocation hosted by US pastor Jim Garlow and Tony Perkins from the Family Research Council, a US evangelical organisation.Who is Nathaniel Bassey?Nathaniel Bassey/InstagramPastor Nathaniel Bassey is well known as a gospel musicianNathaniel Bassey is a Nigerian singer, pastor, trumpeter, music producer and gospel songwriter from Akwa Ibom state, southern Nigeria.He has earned global recognition through his music and worship programme Hallelujah Challenge on social media, with almost four million followers on Instagram.The musician says he started his online praise and prayer sessions in 2017 to connect Christians worldwide.Although he refers to himself as a pastor, he is most widely recognised as a gospel artist. He is also a youth pastor and music minister at the Redeemed Christian Church of God in Lagos, Nigeria.Pastor Bassey was the only African artist who performed at the Prayer Breakfast event in honour of Trump and Vance.Why were they there?In a statement from the Global Crusade ministry, Pastor Kumuyi said he was participating in inauguration-related festivities to "celebrate a return to religious freedom in America and support for other nations in combatting religious persecution".Trump is popular with evangelical Christian voters in the US and has promised to uphold Christian values.In 2019, during his first presidential term, Trump hosted the first meeting of foreign ministers focused solely on religious freedom. In a 2020 Executive Order, he wrote that "religious freedom for all people worldwide is a foreign policy priority of the United States".Dion Forster, professor of public theology at the Vrije Universiteit Amsterdam, says both Trump and Pastor Kumuyi will benefit from the Nigerian's invitation to the inauguration.He says Pastor Kumuyi can demonstrate that he is a friend to the most powerful man in the world.For his part Trump and his team can use the pastor's popularity to gain influence, the professor argues."The genius - and I hate to use that word - of the Trump political machine is that they really know how to work outside the traditional structures of national politics," he says."Where [former President] Joe Biden would have set up connections with ambassadors, senior business leaders, Trump's the kind of guy who asks 'where does the power lie outside of those structures? And how can I bring those kinds of people closer to me?'"Caleb Okereke, founder and editor of Minority Africa, agrees that the backing of popular religious figures like Pastors Kumuyi and Bassey could help Trump gain popular support on the African continent.Mr Okereke believes shared political views unite US conservatives and African evangelists."There's a marrying of global conservative ideals so I think Pastor Kumuyi and Pastor Nathaniel Bassey are only a small representation of what I think is a huge alignment between US politics and politics on the continent," he says."I see them as a signifier of something that is much more entrenched, which is this agenda of aligning on the hatred of LGBTQ+ populations."However he believes there is a "cognitive dissonance" in Africa when it comes to Trump.He points to the US president referring to African nations as "shithole countries" and restricting immigration from several states on the continent, including Nigeria, as part of a controversial travel ban during his first term."I am amazed at how much gender, sexuality almost blinds everybody to whatever else they're saying," he says.LIVE: Follow BBC's live coverageANALYSIS: The promise and peril of Trump's speechIN PICTURES: Key moments of the inaugurationWATCH: The new president's day so farEXPLAINED: What Trump is doing on day oneFASHION: Melania's striking hat and other eye-catching looksVIRAL MOMENTS: Carrie Underwood goes a cappella and other momentsBBC and Getty ImagesGo to BBCAfrica.com for more news from the African continent.Follow us on Twitter @BBCAfrica, on Facebook at BBC Africa or on Instagram at bbcafricaNigeriaUS election 2024Trump inauguration 2025Donald TrumpAfricaEvangelism'''
