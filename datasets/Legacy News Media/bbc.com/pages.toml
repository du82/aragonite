title = "Coastal artist hopes Cambois beach work will create 'connection'"
description = "Nature artist James Brunt hopes his piece on Cambois beach inspires others to create art outside."
full_description = '''Coastal artist hopes work will create 'connection'Angela MessengerArtist James Brunt had never visited Cambois beach before An artist who created a stone sculpture which stunned beach visitors says he is "pleased" with the response. James Brunt, from Sheffield, spent about three hours on 13 January on Cambois beach in Northumberland building a circle, made up of different coloured stones, and a tower.Regular dogwalkers there described it as "beautiful" and "lovely" and praised the design. Mr Brunt said: "If one or two people make a connection with my art and perhaps create themselves, then we're going to end up with a happier society." James BruntJames Brunt makes his art on beaches or in woodlands Mr Brunt had not created art in Northumberland before, but had meetings in Ashington so decided to explore the beaches nearest to it. "I'd done a little bit of research and I thought there might be pebbles on the beach at Cambois," he said. "I never really have a plan, the weather or the tides might dictate what I create."The artwork has survived several high tidesAlongside the main sculpture, Mr Brunt also created a tower which he demolished before he left."If there's any chance that my art might hurt a dog or something, I don't leave it there," he said. Angela MessengerJames Brunt also constructed a tower of stones on Cambois beach but dismantled it before leaving It took about three hours to construct both pieces, with "about 30 people" watching as he worked."Most of them were quite curious, perhaps because it was my first time there," Mr Brunt said."I don't mind a bit of interaction, usually I just get lost in the moment."James BruntJames Brunt says he rarely plans his art in advance Mr Brunt says he "eeks out a living" as an artist through workshops and festivals but the pieces he creates in nature are for everyone. "I create art for myself but if other people like it, well that's a bonus really," he added. Follow BBC North East on X, Facebook, Nextdoor and Instagram. Send your story ideas to northeastandcumbria@bbc.co.uk.More stories from BBC North East and Cumbria Mystery coastal artwork impresses beach visitors Buried 'WW2 defences' appear on beach Festival celebrates 'forgotten' coastal villageRelated internet linksJames Brunt CamboisArt'''
