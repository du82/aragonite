full_description = "The legendary soprano making a differenceDame Kiri Te Kanawa has enjoyed one of the longest careers in operatic history. The New Zealand soprano is a favourite of the UK Royal Family – and became a household name when she sang at the wedding of King Charles and Princess Diana.Now, the music legend says she is dedicating her time to training the next generation of singers.Watch the full programme on BBC News channel starting 9 March 2024.1 March 2024OperaSaveExplore MoreCallas at 100: 'This is the stuff legends are made of'8 Jan 2024OperaBehind the scenes at La Scala in Milan11 Dec 2023OperaThe journey to become an opera singer11 Dec 2023OperaThe sustainable power of Glyndebourne31 Jul 2023OperaAntonio Pappano: 'Opera is an art form'24 Jul 2023OperaZeinab Badawi meets German tenor Jonas Kaufmann6 Jun 2023OperaGustavo Dudamel: 'Music has the power to change the world'6 Jun 2023Opera'Singing is the air that we breathe'6 Jun 2023OperaUS stocks open higher, 'no shock and awe' - 21 Jan 2025Investment Strategist Edward Yardeni says Trump's threat of 25 percent tariffs by 1 February is negotiable.9 hrs agoOpening BellClaudia Winkleman's physio doesn't normally treat humansWhilst filming 'The Traitors', Claudia Winkleman was surprised to learn that her physiotherapist was a vet.2 days agoFilm & TVInside the studio of Britain's most celebrated sculptorThe BBC visits the studio of British sculptor Antony Gormley to learn how art evolves as a communal practice.2 days agoArts in MotionThe Finnish secret to happiness: Avanto and LöylyNordic etiquette: Learn how to sauna and ice plunge like a Finn and feel great afterwards.2 days agoThe SpeciaListWashington DC's biggest myths and mysteries debunkedRobert Pohl, author and veteran tour guide, explains what's behind the US capital's most famous urban legends.4 days agoThe Travel ShowHow technology can monitor and improve our healthBBC Click visits CES 2025 to find out about the latest health tech, from medical tools to well-being devices.5 days agoInnovationMeet the world's first recipient of an AI-powered bionic armSarah De Lagarde lost an arm and a leg after being hit by two trains in London. Now, she has an AI-powered arm.5 days agoAI v the MindHow a performance lab is putting musicians to the test BBC Click visits a simulator lab that allows musicians to practice performance in real-world conditions.5 days agoInnovationBank performance signals boost to US economy - 16 Jan 2025Jason Betz from Ameriprise Financial says that there is untapped resilience in the American economy.5 days agoOpening BellA mother tiger on a fierce hunt to feed her cubsWhile her three offspring take a leisurely bath, this Bengal tiger mother must find food for the entire family.6 days agoEarthWhy new habits are so hard to stick toDr Radha Modgil explains what's going on in our brains when we try to make or break habits.7 days agoHumansUS shares open higher after new PPI reading - 14 Jan 2025US shares opened higher after the Producer Price Index rose at a slower-than-expected pace in December.7 days agoOpening BellTom Hiddleston busts out signature dance moveTom Hiddleston gives a demo of his signature move, which he calls 'just keep swimming'.8 days agoTheatreVisiting one of Europe's 'well preserved ancient cities'The ancient city of Butrint is the first site in Albania to be added to the UNESCO World Heritage list.13 Jan 2025AdventuresWhitney White on how Shakespeare still resonates todayTony-nominated theatre maker Whitney White reimagines Shakespeare's plays by infusing them with gospel and rock.13 Jan 2025Arts in MotionThe microbe that could protect humans from space radiation'Conan the Bacterium' is the most radiation resistant bacteria in the world. Now, scientists know why.11 Jan 2025World of wonderUS stocks under pressure after jobs report - 10 Jan 2025The latest healthy US jobs report adds more uncertainty about whether the Fed will cut its key interest rate.10 Jan 2025Opening BellHow the