["https://bbc.com/news/articles/cp8qv8gz1m3o"]
title = "Tel Aviv stabbing attack injures four"
description = "The attacker, believed to be a Moroccan citizen with US residency, was shot dead at the scene."
full_description = '''Four injured in Tel Aviv stabbing attackReutersThe attack happened near a wine bar in Tel AvivFour people were injured in a stabbing attack in Tel Aviv on Tuesday, Israel's emergency services said.Ichilov Hospital said it was treating three of the victims, including one with "a serious condition with a knife wound to the neck". The assailant, a 28-year-old foreign national, was shot at the scene, police said. Israel's intelligence agency Shin Bet said it is carrying out an investigation after a decision was made to allow the man, who reportedly had Moroccan citizenship and American permanent residency, to enter the country. This is the second stabbing in Tel Aviv in four days, after another person was attacked on Saturday before being shot by an armed civilian.Israel's military chief resigns over 7 October 2023 failuresTuesday's attack took place on Nahalat Binyamin Street, an area popular for its restaurants and nightlife, and on the nearby Gruzenberg Street, where the attacker stabbed another person and was shot dead. Israeli media reported that an American residency permit and border control ticket were found on the body of the attacker.He entered Israel on a tourist visa on 18 January. Border and immigration forces had raised objections to the man entering Israel while he was at Ben Gurion Airport, but the Shin Bet security service approved his entry, Israel's Interior Minister Moshe Arbel said. "I call on Shin Bet head Ronen Bar to investigate the serious incident and draw lessons from it as soon as possible," he added.The Shin Bet said in response: "Upon the individual's entry into Israel, a security assessment was conducted, including questioning and additional checks, which concluded that there were no grounds to deny his entry for security reasons. The incident will be investigated."Hamas did not claim responsibility but in a statement praised the attack.Dramatic day ushers in a fragile Israel-Hamas ceasefire after 15 months of warIsrael & the PalestiniansIsraelPalestinian territories'''
