["https://bbc.com/news/articles/cz7e0jve875o"]
title = "Trump pardons Silk Road creator Ross Ulbricht"
description = "Trump said he had called Ulbricht's mother to let her know he had granted her son a full pardon."
full_description = '''Trump pardons Silk Road dark web market creator Ross UlbrichtReutersUlbricht was convicted in 2015US President Donald Trump says he has signed a full and unconditional pardon for Ross Ulbricht, who operated Silk Road, the dark web marketplace where illegal drugs were sold.Ulbricht was convicted in 2015 in New York in a narcotics and money laundering conspiracy and sentenced to life in prison.Trump posted on his Truth Social platform that he had called Ulbricht's mother to inform her that he had granted a pardon to her son.Silk Road, which was shut down in 2013 after police arrested Ulbricht, sold illegal drugs using Bitcoin, as well as hacking equipment and stolen passports."The scum that worked to convict him were some of the same lunatics who were involved in the modern day weaponization of government against me," Trump said in his post online on Tuesday evening. "He was given two life sentences, plus 40 years. Ridiculous!"Ulbricht was found guilty of charges including conspiracy to commit drug trafficking, money laundering and computer hacking.During his trial, prosecutors said Ulbricht's website, hosted on the hidden "dark web", sold more than $200m (£131m) worth of drugs anonymously.The Silk Road took its name from the historic trade routes spanning Europe, Asia and parts of Africa.The site achieved notoriety through media reports and online chatter. But users could only access the site through Tor - a system that lets people use the web without revealing who they are or which country they are in.Court documents from the FBI said the site had just under a million registered users, but investigators said they did not know how many were active.Sentencing Ulbricht - who has two college degrees - District Judge Katherine Forrest said he was "no better a person than any other drug dealer".She said the site had been his "carefully planned life's work".The judge noted the lengthy sentence also acted as a message to copycats that there would be "very serious consequences". "I wanted to empower people to make choices in their lives and have privacy and anonymity," Ulbricht said at his sentencing in May 2015.Trump previously hinted that he planned to commute Ulbricht's sentence during a speech last year at the Libertarian National Convention. The Libertarian party had been advocating for Ulbricht's release and said his case was an example of government overreach. Republican congressman Thomas Massie, a Trump ally, applauded the president's decision."Thank you for keeping your word to me and others who have been advocating for Ross' freedom," said the Kentucky lawmaker.Silk Road drug website founder Ross Ulbricht jailedHow the FBI closed in on Silk Road suspectBitcoinNew YorkDonald TrumpUnited States'''
