["https://bbc.com/news/articles/cql5dx1l9e9o"]
title = "'I hired Banksy for £50 then painted over his mural'"
description = "The world-famous street artist taught art lessons with local children in the 1990s."
full_description = '''They hired Banksy for £50 then painted over his muralPeter de BoerBanksy ran three sessions with young people in a deprived area of BristolFor years people have tried - and failed - to uncover details about Bristol's most famous, yet anonymous, graffiti artist Banksy. Photos of him and stories of people who have met him are incredibly rare. But now a man who got the secretive artist to work with children at a youth club in the late 1990s has given the BBC an exclusive insight into the man behind the murals, just as he was about to become famous.Banksy is one of the world's most famous graffiti artists. His work has sold for millions of pounds and his exhibitions seen by hundreds of thousands of people.But behind layers of paint, lost in time at a Bristol youth club, there's a Banksy very few people know about.On the cusp of international fame, the artist was leaving his mark - not only on the streets of his city, but on young people in Lawrence Weston.Here, Banksy helped groups of teens in art classes, just as he was about to paint his famous Mild, Mild West mural."If you look at the photos, you can see the way he was working with the young people," said Peter de Boer, the man responsible for getting Banksy in the building. "They were engaged, having fun and sharing ideas. It was a true collaboration."Peter invited Banksy to run art classes at the centre in Lawrence Weston and eventually would also paint over oneWhen Banksy came to Lawrence Weston youth centreNow all that remains of these unique murals are photographs, capturing the colourful, abstract and lively pieces that stretched across the walls of the youth club. The BBC has been given permission to use these photos on the condition that Banksy remains anonymous.The artist would return to the club several times to create new works, with a revolving door of excitable 11 to 16 year olds – oblivious to who the artist would eventually become. When Banksy came to Lawrence Weston youth centreIt was the late 1990s when Peter, a senior youth worker for the area, was looking for local artists to inspire a generation of children in this part of west Bristol.His friend had a suggestion – someone who went out 'tagging' the city with his brother and was starting to make a name for himself. That person was Banksy."I got his phone number, so I used to call him up and ask if he'd come and do some art projects. He was really keen," Peter said.This was the same year Banksy did his first large stencil mural in Stokes Croft - Mild Mild West - depicting a teddy bear throwing a Molotov cocktail at three riot police.Peter de BoerThe classes happened at about the same time his famous Mild, Mild West mural appearedWhat do we know about Banksy?Campaign to save building home to early Banksy artBanksy's Girl with Balloon print sells for £80,000Each time Banksy arrived at the youth club, he was greeted by dozens of eager kids.The purpose-built youth centre from the 1970s had become a real community hub."There would literally be hundreds of young people that would come here over a week," said Peter, who is passionate about the need for youth clubs in society."It was always very vibrant."Peter recalled the hype building around Banksy's work in Bristol, but that "nobody thought twice about who he was" when he was running sessions in Lawrence Weston. He was just another artist sharing his skills with the community, he said.Peter de BoerThe BBC has been asked to obscure Banksy's face in order to publish the photos"The thing that struck me back then was he didn't really have an ego. He was doing art with them, rather than doing art for them," he said."In the morning, he sat around a table with the children, talking about their ideas. "Then they would all just muck in and spray these things that were invented."It wasn't more Banksy than the young people, it was definitely a kind of 50/50 thing."And how much did it cost to bring in Banksy?"For the first one [workshop], I think we paid him £50. Probably only covered the cost of the spray paints back then," Peter said."I don't think he's ever been in it for the money. It shows what a deep, kind and caring person he is."Peter de BoerBanksy has gone on to be a world-famous artistThe murals Banksy created with the children were fun and vivid in colour – but with meaning.Cows looking up as bombs are dropped above them, which Peter believes was a nod to climate anxiety, while another was more obscure - a circus overrun by robots.'I painted over a Banksy'But what happened to these murals? They were painted over. Again and again."I personally painted over a Banksy. I threw a Banksy stencil away when I was clearing up," Peter said.But he is not one to get sentimental about preserving street art."I have no regrets at all [covering them up]. Back then, it was much more about working with and engaging young people."And it was just another art project back then."Peter de BoerEarly in his career Banksy - here on the left - was keen to help teenagers learn how to paintFor Peter, the value of Banky's time at the club is not monetary, but based on what these murals did for the community. He wonders if the children remember creating pieces with a man who is now one of the most famous artists in the world."I'm very proud he came here," he said."There will be [those who were] young people in the local community who are parents now who worked with Banksy, and they may not know that."Follow BBC Bristol on Facebook, X and Instagram. Send your story ideas to us on email or via WhatsApp on 0800 313 4630.Street artBristolBanksy'''
