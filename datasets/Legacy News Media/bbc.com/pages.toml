["https://bbc.com/news/articles/c93lggeek7do"]
title = "Plans to restore historic Endon mural to its former glory"
description = "The Toby Carvery is to undergo a refresh, with plans to restore the building's prominent mural."
full_description = '''Village pub mural to be restored to former gloryBBCIt is hoped restoring the mural will mean it can be enjoyed for generations to comeA prominent mural in Staffordshire could soon be restored, following the submission of plans to carry out the work.The mural features on the side of a Toby Carvery in Endon, and owner Mitchells and Butlers said it wanted to preserve the artwork for future generations."It's a symbol of the community in which the people of Endon are very proud," a spokesperson said."We're hoping after the site is refurbished guests come and visit to appreciate the mural in person."The plans state that the mural, which is more than 100 years old, has suffered salt contamination and moisture ingress which has led to its deterioration.The site was formerly a hotel, but more recently has operated as a restaurant.The mural is painted on the front of the building and is visible to the thousands of passers-by who use the A53 between Stoke-on-Trent and Leek.It depicts a rural setting – the meaning and significance of which are unknown, according to documents accompanying the pub firm's planning application.Mitchells and ButlersThe mural was painted in the early 1900s when the building was used as a hotelThe plans state the mural was painted in the early 1900s by Endon-born artist Herbert Foster, whose collection of works are showcased in the Minton archives and various museums across the Midlands."The mural has been enjoyed by locals for decades, not only for its cosmetic value in a central area of Endon, but it also serves as inspiration and a reminder of a great talent born and educated locally," the documents said.The company said the work would be carried out by a specialist heritage contractor, who would fix cracks in the paintwork and clean off debris which has accumulated on the surface of the artwork.Mitchells and ButlersThe mural at The Plough in Endon was painted by local artist Herbert FosterA spokesperson for Endon with Stanley Parish Council said the mural was an "important landmark" in the village.They said: "We are pleased to report that Moorlands Partnership Board has provisionally agreed to award a grant towards the restoration of the iconic mural at The Plough Inn, which is believed to be the largest pub sign in the UK."A date when the work will begin has not yet been set, but it is understood to be part of wider plans to refurbish the pub building.Follow BBC Stoke & Staffordshire on BBC Sounds, Facebook, X and Instagram.More on this storyArtist's Peaky Blinders mural on studio wallsPark's new mural celebrates nature and communityGraffiti-covered subway gets nature-themed makeoverRelated internet linksEndon with Stanley Parish CouncilEndonLeekStoke-on-TrentArt'''
