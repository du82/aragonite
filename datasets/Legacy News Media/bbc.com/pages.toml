title = "BBC"
full_description = "Contact BBC.com & BBC App SupportStep 1 of 4Need more help?1Need more help?2Reason for contact3Your details4Review and submitWhat service are you contacting us about?BBC Website and/or BBC appBBC Account Sign InReason For ContactFinding An ArticleWatching ContentHow To UseGeneral FeedbackAccessibilityBBC Account (Sign In)URL (if relevant)Date affectedSubjectDescriptionTo help us assist you better, please include your Browser and OS details. Additionally, if you are using the mobile app, please provide the app version via BBC app settings.Please don’t add personal details such as your name, email address or phone number in this field – we’ll ask you for those at the next stage if requiredBackContinueWe automatically retain some technical data on how you've used BBC.com. This and personal information you provide will be used by the BBC and its service providers for the purpose of handling your contact about BBC.com and treated in accordance with Data Protection Legislation. Please visit theBBCs Privacy and Cookies Policyfor more information.Do you want a response?YesNoBackContinuePlease review your contact and use the Edit buttons if necessaryNeed more help?EditReason for contactEditYour detailsEditBackSubmitBBC Studios Distribution Limited - Feedback ProcessBBC Studios Distribution Limited (BBC.com) welcomes your feedback on any accessibility barriers that you may have encountered in dealing with the BBC.com service. The person at BBC.com responsible for receiving feedback is the Principal Service Manager of BBC.com. Feedback can be general or specific, but providing more details such as the date, the name of the webpage, application or activity involved, may make it easier for us to understand your concerns. Feedback can be sent by:Email: You can email us at comhelp.bbc@bbc.comOnline webform: Accessible above this notice.Anonymous FeedbackIndividuals providing feedback can provide personal information and contact information, but they do not have to. If you wish to submit feedback anonymously, the webform may be the best method to do so.Acknowledgement of FeedbackWe will acknowledge all feedback, other than anonymous feedback where we do not receive contact details for the person providing the feedback. Confidentiality of FeedbackWe will keep all feedback confidential as required by applicable law.How feedback will be usedFeedback will help BBC.com continously improve our accessibility efforts. Some feedback may not require a direct response or immediate follow-up, and some may highlight issues that need to be addressed right away. However, all feedback received will help BBC.com develop its future plans and it will help us know how we are progressing towards our goals.Last updated: 19 November 2024"
