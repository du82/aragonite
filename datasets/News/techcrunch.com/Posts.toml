["https://techcrunch.com/2025/01/17/supreme-court-upholds-tiktok-ban/"]
title = "Supreme Court upholds TikTok ban"
description = "The Supreme Court has upheld the law that will effectively ban TikTok on Sunday, January 19. The decision marks the end of TikTok’s months-long legal fight against a law that essentially forces the ByteDance-owned app to shut down unless it divests its U.S. operations on national security grounds. As of Sunday, it will be illegal [&hellip;]"
full_description = "The Supreme Court has upheld the law that will effectively ban TikTok on Sunday, January 19. The decision marks the end of TikTok’s months-long legal fight against a law that essentially forces the ByteDance-owned app to shut down unless it divests its U.S. operations on national security grounds. As of Sunday, it will be illegal for app stores and internet hosting services to distribute the social network. TikTok has warned that the app will simply &#8220;go dark&#8221; on Sunday, but it&#8217;s unclear what exactly will happen once the ban takes effect. In an opinion published early on Friday, the Supreme Court said it was writing in response to an appeal from three groups of petitioners, &#8220;two TikTok operating entities and a group of U. S. TikTok users,&#8221; who requested that the ban &#8212; a result of the new Protecting Americans from Foreign Adversary Controlled Applications Act &#8212; be dismissed on First Amendment (free speech) grounds. &#8220;Given just a handful of days after oral argument to issue an opinion, I cannot profess the kind of certainty I would like to have about the arguments and record before us,&#8221; the court writes in the unsigned opinion. &#8220;All I can say is that, at this time and under these constraints, the problem appears real and the response to it not unconstitutional&#8230; Speaking with and in favor of a foreign adversary is one thing. Allowing a foreign adversary to spy on Americans is another.&#8221; Upholding the ban kicks TikTok&#8217;s fate to the next stage: whether Trump, after he takes office, chooses to make an extraordinary intervention; or whether some form of a sale goes forward. On the first point, Trump wrote on Truth Social earlier today that he had a conversation with China&#8217;s leader, Chairman Xi Jinping, in which they discussed TikTok, among other things. He didn&#8217;t say what the outcome was of that conversation. On the second point, reportedly China has supported the idea of none other than Elon Musk buying the U.S. version of the app. Today&#8217;s decision comes days after TikTok pleaded its case before the nation’s highest court, arguing that the law conflicts with the First Amendment, and that the social network needed extra time to allow President elect-Donald Trump to act to save the app. During the hearing, the Department of Justice (DOJ) argued that the law doesn’t violate the First Amendment because it doesn’t aim to regulate free speech on the platform or its algorithm. Surveillance has been at the heart of the move to ban TikTok, and the DOJ argued that the Chinese government could compel ByteDance to secretly turn over the data of millions of Americans. Throughout the legal battle, TikTok argued that divesting the app&#8217;s U.S. operations would be impossible because China would prevent the export of the social network&#8217;s algorithm. The company also claimed that TikTok would be a fundamentally different service with a different algorithm. Today, the Supreme Court summarized the longer TikTok saga since 2020 in its opinion. But it also came to the conclusion that the Act as it was spelled out &#8220;appears appropriately tailored to the problem it seeks to address.&#8221; &#8220;Without doubt, the remedy Congress and the President chose here is dramatic,&#8221; it acknowledged. Yet the Supreme Court also highlighted the difficulties of ruling on technology, essentially a moving target in terms of what can be achieved with it, both in terms of positive potential but also harm. &#8220;We should take care not to &#8217;embarrass the future,'&#8221; the court noted in its opinion today. President Biden signed the sell-or-ban law back in April 2024. The bill followed years of allegations from the U.S. government that TikTok’s ties to China pose a national security risk and that it exposes Americans’ sensitive information to the Chinese government. More to come. Refresh for updates."
