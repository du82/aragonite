["https://techcrunch.com/2025/01/15/ai-researcher-francois-chollet-founds-a-new-ai-lab-focused-on-agi/"]
title = "AI researcher François Chollet founds a new AI lab focused on AGI"
description = "François Chollet, an influential AI researcher, is launching a new startup that aims to build frontier AI systems with novel designs. The startup, Ndea, will consist of an AI research and science lab. It&#8217;s looking to &#8220;develop and operationalize&#8221; AGI. AGI, which stands for &#8220;artificial general intelligence,&#8221; typically refers to AI that can perform any [&hellip;]"
full_description = "François Chollet, an influential AI researcher, is launching a new startup that aims to build frontier AI systems with novel designs. The startup, Ndea, will consist of an AI research and science lab. It&#8217;s looking to &#8220;develop and operationalize&#8221; AGI. AGI, which stands for &#8220;artificial general intelligence,&#8221; typically refers to AI that can perform any task a human can. It&#8217;s a goalpost for many AI companies, including OpenAI. &#8220;We&#8217;re betting on a different path to build AI capable of true invention, adaptation, and innovation,&#8221; Chollet wrote in a series of posts on X. &#8220;We believe we have a small but real chance of achieving a breakthrough — creating AI that can learn at least as efficiently as people, and that can keep improving over time with no bottlenecks in sight.&#8221; Ndea plans to use a technique called program synthesis, in tandem with other technical approaches, to unlock AGI. Chollet thinks that program synthesis, which allows AI to generalize problems it hasn&#8217;t seen before from only a few examples, can help to overcome the most intractable problems in AI research. Program synthesis is traditionally computing-intensive. But Chollet thinks this limitation can be overcome — and that overcoming it will help accelerate scientific progress. &#8220;[W]e are not alone in recognizing the potential of program synthesis — it&#8217;s a technique every frontier AI lab is now starting to explore,&#8221; reads a blog post on Ndea&#8217;s website. &#8220;We are at the crest of a pivotal moment in scientific history and the world deserves every possible direct, unique attempt to build AGI.&#8221; François Chollet (left) and Mike Knoop.Image Credits:Ndea Ndea, which Chollet is co-founding with Zapier co-founder and head of AI Mike Knoop, hasn&#8217;t disclosed whether it has raised any capital from outside investors. But the company is currently hiring for remote research positions, suggesting that there&#8217;s at least some financial backing. It&#8217;s not everyday that you see folks of the calibre of @fchollet and @mikeknoop decide to start a company! I&#8217;m excited to be involved as a supporter, but importantly, their vision for how to solve the hard problems in AI is awesome. Our field is dominated by hype and hope -… https://t.co/7u6OT1vrHc — Naveen Rao (@NaveenGRao) January 15, 2025 Knoop says that he&#8217;s stepping away from his day-to-day work at Zapier to make Ndea his focus, but that he&#8217;ll remain a member of Zapier&#8217;s board. &#8220;We’re assembling the world’s top program synthesis team,&#8221; Knoop said in a post on X. &#8220;Our first focus is on deep learning-guided program synthesis to create AGI that can invent, adapt, and innovate &#8230; But even more exciting is the chance to metaphorically time-travel into the future: learn, invent, and discover things that would not organically happen for decades or even centuries.&#8221; Chollet, who recently launched a nonprofit with Knoop to develop benchmarks for AGI, is the latest high-profile AI researcher to leave Big Tech to found an independent AI lab. Perhaps best known as the creator of Keras, a high-level, open source API that can be used to create AI models and tackle machine learning tasks, Chollet announced last November that he would depart Google after close to a decade there. Ilya Sutskever, OpenAI&#8217;s former chief scientist and co-founder, last year founded Safe Superintelligence, an AI lab that has raised over $1 billion in capital from investors including Sequoia and Andreessen Horowitz. Elsewhere, longtime Google AI researcher and Stanford academic Fei-Fei Li is heading World Labs, a company developing AI systems that can generate video game-like 3D simulations. TechCrunch has an AI-focused newsletter! Sign up here to get it in your inbox every Wednesday."
