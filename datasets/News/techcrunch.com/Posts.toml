["https://techcrunch.com/2025/01/17/trump-comments-on-tiktok-ban-stay-tuned/"]
title = "Trump comments on TikTok ban: &#8216;Stay tuned!&#8217;"
description = "Just ahead of today&#8217;s Supreme Court ruling &#8212; which saw the nation&#8217;s highest court uphold the law banning TikTok in the U.S. as of January 19 &#8212; Donald Trump posted on Truth Social that he had a &#8220;very good&#8221; phone call with China&#8217;s President Xi Jinping, which included discussion of TikTok. In addition, the president-elect [&hellip;]"
full_description = "Just ahead of today&#8217;s Supreme Court ruling &#8212; which saw the nation&#8217;s highest court uphold the law banning TikTok in the U.S. as of January 19 &#8212; Donald Trump posted on Truth Social that he had a &#8220;very good&#8221; phone call with China&#8217;s President Xi Jinping, which included discussion of TikTok. In addition, the president-elect said that he would make a decision on TikTok in the &#8220;not too distant&#8221; future, but did not say what he would do. Trump earlier signaled that he is no longer in favor of the ban, after urging the Supreme Court to block the law requiring the app to be shut down or sold by January 19, but in his message today he said that he would make a decision in the future, but first needed &#8220;time to review the situation.&#8221; He also said that the Supreme Court&#8217;s decision was &#8220;expected.&#8221; &#8220;Stay tuned!,&#8221; he wrote. Ahead of the ruling, Trump had also written on Truth Social that he had a good call with Xi this morning and that it was his expectation that they would &#8220;solve many problems together,&#8221; starting immediately. &#8220;We discussed balancing trade, fentanyl, TikTok, and many other subjects,&#8221; Trump wrote on his social platform. &#8220;President Xi and I will do everything possible to make the world more peaceful and safe! &#8220; Shortly after the call, the Supreme Court ruled that the ban would go through. This means the app will be shut down in the U.S. unless it&#8217;s sold — something that TikTok argued it could not accomplish in the allotted time. It&#8217;s unclear if TikTok will effectively go dark on January 19 or if it will continue to operate on users&#8217; devices where it&#8217;s already installed, as there have been reports pointing to both scenarios. However, the Biden administration was said to be considering ways to keep TikTok available in the U.S., even if the ban was upheld."
