full_description = "As TikTok&#8217;s fate hangs in the balance, TikTok CEO, Shou Chew, is planning to attend President-elect Donald Trump&#8217;s inauguration on Monday, The New York Times reports. The executive will join Mark Zuckerberg, Jeff Bezos, and Elon Musk on the dais, which is where former presidents and important guests are traditionally seated. Although Trump initiated calls to ban the app during his first term, he took a different approach during his 2024 campaign and promised to save the app if elected. Trump has discussed how content about him and his campaign did well on TikTok, and that he was able to reach young users through the platform. Chew&#8217;s upcoming appearance at the inauguration and Trump&#8217;s embrace of the app are significant as TikTok nears a potential shutdown in the U.S. on Sunday. The Supreme Court is expected to rule in the coming days on the law that could effectively ban TikTok​ in the U.S. on January 19. Trump asked the court to pause the law a few weeks ago."
