["https://techcrunch.com/2025/01/17/chatgpts-newest-feature-lets-user-assign-it-traits-like-chatty-and-gen-z/"]
title = "ChatGPT&#8217;s newest feature lets users assign it traits like &#8216;chatty&#8217; and &#8216;Gen Z&#8217;"
description = "Update: OpenAI officially announced this feature one week after some users reported the arrival, and then disappearance, of the new options. It&#8217;s possible they went live prematurely. OpenAI is introducing a new way for users to customize their interactions with ChatGPT, the company&#8217;s AI-powered chatbot. On Friday, OpenAI announced it is rolling out a new [&hellip;]"
full_description = "Update: OpenAI officially announced this feature one week after some users reported the arrival, and then disappearance, of the new options. It&#8217;s possible they went live prematurely. OpenAI is introducing a new way for users to customize their interactions with ChatGPT, the company&#8217;s AI-powered chatbot. On Friday, OpenAI announced it is rolling out a new user interface for ChatGPT&#8217;s custom instructions menu, including new ways to customize the chatbot&#8217;s traits. The feature will roll out first on ChatGPT.com and the Windows desktop app, according to OpenAI, and will come to the mobile and MacOS desktop apps in the next few weeks. We&#39;ve updated custom instructions to make it easier to customize how ChatGPT responds to you.With the new UI, you can tell ChatGPT the traits you want it to have, how you want it to talk to you, and any rules you want it to follow. pic.twitter.com/BaXaqAw5cE- OpenAI (@OpenAI) January 17, 2025 The new UI will not be immediately available to ChatGPT users in the EU, Norway, Iceland, Liechtenstein, and Switzerland, OpenAI said in a tweet on Friday. Some users on X reported last week that ChatGPT&#8217;s existing custom instructions menu on the web has been revamped with new fields. Now, users can specify a preferred name or nickname, their profession, other things they&#8217;d like ChatGPT to know about them, and &#8220;traits&#8221; they&#8217;d like the chatbot to have. OpenAI suggests traits like &#8220;Chatty,&#8221; &#8220;Encouraging,&#8221; and &#8220;Gen Z.&#8221; Important to note is that this is unrelated to ChatGPT&#8217;s memory feature, which lets users tell ChatGPT explicitly to remember — or forget — something. Somewhat confusingly, ChatGPT &#8220;memories&#8221; can be personal details — but they can also cover a broader range of conversation-relevant info. &#8220;Introduce yourself to get better, more personalized responses,&#8221; reads a message in the refreshed menu. Image Credits:Tibor Blaho (opens in a new window) The options aren&#8217;t showing up for this reporter yet. TechCrunch has reached out to OpenAI for comment and will update this article if we hear back. It&#8217;s likely the new menu is more of an aesthetic makeover than a deep technical upgrade. The old custom instructions feature used what&#8217;s known as prompt engineering to guide ChatGPT&#8217;s style and tone. Essentially, it &#8220;primed&#8221; the AI powering ChatGPT with a paragraph of user-provided instructions so its answers adhered to those requirements and preferences. So far as we can tell, the new menu still relies on prompt engineering. It simply presents it in a user-friendlier way. OpenAI previously said that it applies moderation to custom instructions to check if they adhere to its terms of use. Presumably, that hasn&#8217;t changed with the revamped personalization settings. OpenAI has looked to polish ChatGPT as its user base grows, adding capabilities like live web search and a &#8220;Canvas&#8221; interface tailored to writing and coding projects. The company said in December that over 300 million people use the chatbot each week."
