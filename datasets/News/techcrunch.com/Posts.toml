["https://techcrunch.com/2025/01/15/duolingo-sees-216-spike-in-u-s-users-learning-chinese-amid-tiktok-ban-and-move-to-rednote/"]
title = "Duolingo sees 216% spike in US users learning Chinese amid TikTok ban and move to RedNote"
description = "TikTok U.S. users have been learning Chinese on Duolingo in increasing numbers amid their adoption of a Chinese social app called RedNote ahead of the TikTok ban. The U.S. law, scheduled to go into effect on January 19, unless halted by the Supreme Court, will see TikTok removed from U.S. app stores and will stop [&hellip;]"
full_description = "TikTok U.S. users have been learning Chinese on Duolingo in increasing numbers amid their adoption of a Chinese social app called RedNote ahead of the TikTok ban. The U.S. law, scheduled to go into effect on January 19, unless halted by the Supreme Court, will see TikTok removed from U.S. app stores and will stop the app from functioning on users&#8217; devices unless they install a VPN client. Instead of trying to work around the ban, however, over 700 million TikTok users have shifted over to the social video platform RedNote (aka Xiaohongshu), prompting a surprising cultural exchange between the two countries&#8217; citizens — not to mention quite a few requests for American users to help with Chinese users&#8217; English homework. Though some TikTok refugees have since struggled with technical problems when signing up for RedNote, and others immediately got booted for community violations, the intent of the move from one Chinese-owned app to another is meant to send a strong signal to the U.S. government and would-be TikTok competitors like Meta that there&#8217;s demand for the type of social networking experiences that China creates and U.S. companies have only managed to imitate. The move is also serving as something of a pulse check as to whether or not U.S. users are worried about Chinese companies collecting their personal data for nefarious use — one of the key factors that led to TikTok&#8217;s ban in the first place. (As it turns out, many are not, as this migration shows.) However, because Shanghai-based Xiaohongshu/RedNote is designed for a Chinese audience, the app&#8217;s default language is Mandarin Chinese. That prompted an increase in U.S. users of the Duolingo language-learning app to take a crash course in Mandarin. According to Duolingo, the app has seen roughly 216% growth in new Mandarin learning in the U.S. compared to this time last year, with a sharp spike in mid-January as RedNote&#8217;s adoption took off. In addition, the company reports that in its &#8220;How did you hear about us&#8221; survey that new users are prompted to answer, it&#8217;s seeing a corresponding spike in people selecting &#8220;TikTok&#8221; as their response. oh so NOW you’re learning mandarin- Duolingo (@duolingo) January 14, 2025 &#8220;Oh so NOW you&#8217;re learning mandarin,&#8221; the company joked in an X post on Tuesday. It also posted a video to TikTok promoting the use of its app for learning the Chinese language. The short video showed the company&#8217;s green owl mascot at the airport heading to China overlaid by text that said &#8220;me because I&#8217;d rather move to China & learn Mandarin on Duolingo.&#8221; The video currently has north of half a million likes. Another more recent video focused on teaching Mandarin phrases for &#8220;TikTok refugees&#8221; has over 620,000 likes. According to data from app intelligence provider Appfigures, consumer demand for Duolingo&#8217;s language learning courses has also affected the app&#8217;s install base. The firm reports Duolingo&#8217;s app saw a 36% increase in U.S. downloads across the App Store and Google Play combined as of January 3 — an early sign that users may have tried out different Chinese social apps before the surge to join RedNote hit later in the month. A week ago, Duolingo was ranked in the 40s for Top Apps (minus games) and Top Overall (including games). As of right now, it&#8217;s No. 22 in Top Overall and No. 20 in Top Apps. starter pack pic.twitter.com/XE9mPuWBW9- pamela 🎡✨ (@tisthepamseason) January 14, 2025"
