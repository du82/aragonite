["https://techcrunch.com/2025/01/16/spacex-catches-starship-booster-a-second-time-loses-ship-to-an-anomaly-in-space/"]
title = "SpaceX catches Starship booster a second time, loses ship to an &#8216;anomaly&#8217; in space"
description = "SpaceX caught the Starship rocket&#8217;s Super Heavy booster for a second time, after it launched the upper stage into space on Thursday during a seventh test flight of the system. Soon after the successful catch, SpaceX representatives reported the ship was lost after the company lost contact about eight and half minutes into the flight. [&hellip;]"
full_description = "SpaceX caught the Starship rocket&#8217;s Super Heavy booster for a second time, after it launched the upper stage into space on Thursday during a seventh test flight of the system. Soon after the successful catch, SpaceX representatives reported the ship was lost after the company lost contact about eight and half minutes into the flight. The ship had successfully separated from the booster and had started its own rocket engines to ascend to orbit before it appeared some of those engines gave out. The company then saw its link to the telemetry coming off of the ship disappear, and a few minutes later SpaceX confirmed that the ship had suffered an &#8220;anomaly with that upper stage&#8221; during the end of its ascent burn in space. The Federal Aviation Administration confirmed to TechCrunch that it slowed or diverted a number of flights in the area where debris was spotted. On Thursday evening, SpaceX CEO Elon Musk wrote on X that the company believes an &#8220;oxygen/fuel leak&#8221; inside Starship built up too much pressure inside the cavity of the craft. He wrote that SpaceX will &#8220;obviously [be] double-checking for leaks&#8221; going forward, add a fire suppression system to that part of the ship, and increase the venting area to help reduce any pressure. Shortly after the ship failed, users across social media shared photos and videos of what appeared to be pieces of the spacecraft burning up as they re-entered Earth&#8217;s atmosphere over Turks and Caicos. In between posts where he complained about corporate diversity initiatives, Musk shared one of the videos on X, writing: &#8220;Success is uncertain, but entertainment is guaranteed!&#8221; The company pulled off the first booster &#8220;catch&#8221; &#8212; which involves articulated arms on the launch tower snatching the rocket stage out of the air as it uses rockets to slow its descent &#8212; in October 2024. A second attempt to catch the booster in November was called off due to a communication problem. This launch was about much more than another catch, though. SpaceX had loaded Starship with 10 dummy Starlink satellites and was planning to attempt the first payload deployment with the spacecraft. The test was supposed to be the start of a &#8220;transformational&#8221; year for Starship, SpaceX said on its website. The ship SpaceX sent up on Thursday was upgraded in multiple ways compared to prior test flights. SpaceX said this Starship&#8217;s avionics systems had a &#8220;complete redesign,&#8221; featuring a more powerful flight computer and integrated antennas with Starlink, GNSS, and backup RF communication functions. The ship was fitted with redesigned inertial navigation and star tracking sensors, and integrated &#8220;smart batteries and power units&#8221; that SpaceX said distributed data and 2.7MW of power across the craft. This updated Starship also had more than 30 cameras on board so the company&#8217;s engineers could monitor the performance of all this new and existing hardware. SpaceX is working towards being able to catch Starship along with the booster, and this flight was supposed to be a chance to test technologies that would make that possible. The company put a number of different heat tiles on the ship, to test which offer the best protection from the forces of re-entry. The ship also had &#8220;non-structural versions&#8221; of the knobs that get caught by the tower, to see how they would hold up during re-entry. On the booster side of things, SpaceX had outfitted the launch tower with radar sensors to more accurately locate the rocket stage during the catch process. The booster was also re-using one of the rocket engines from a previous Starship flight for the first time. This story has been updated with additional information from SpaceX, Elon Musk, and a comment from the FAA."
