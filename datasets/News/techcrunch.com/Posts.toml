full_description = "Meta&#8217;s Threads is internally prototyping the ability to add music to posts, the company confirmed to TechCrunch. The option to add music to posts is already available on Meta&#8217;s other social apps, Instagram and Facebook. It looks like the company is now thinking about bringing the feature to Threads, its X competitor. The feature isn&#8217;t yet being tested publicly and was first spotted by reverse engineer Alessandro Paluzzi, who often finds unreleased features while they’re still under development. The option to add music to posts could be a welcome addition for people who want to add a bit more color to their posts and show off their musical taste, as it would be somewhat reminiscent of the Myspace era. However, not everyone would likely be a fan of posts with music, because they could be distracting. As with any other internal prototype, it’s unknown if or when Meta plans to roll out the feature. TechCrunch reported last week that Threads is also internally prototyping the ability to set a display name and add a cover image to profiles. The new features would bring Threads&#8217; user experience more in line with its competitors, including X and Bluesky."
