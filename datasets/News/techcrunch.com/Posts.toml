["https://techcrunch.com/2025/01/16/nintendo-unveils-the-nintendo-switch-2/"]
title = "Nintendo unveils the Nintendo Switch 2"
description = "Nintendo shared the first images of the Nintendo Switch 2 in a video posted on YouTube. The successor to the widely popular game console will be simply called the Switch 2. As the name suggests, it shares the same design philosophy with a modular form factor. Right out of the gate, the video shows the [&hellip;]"
full_description = "Nintendo shared the first images of the Nintendo Switch 2 in a video posted on YouTube. The successor to the widely popular game console will be simply called the Switch 2. As the name suggests, it shares the same design philosophy with a modular form factor. Right out of the gate, the video shows the main difference with the Switch — the Switch 2 is going to be a bigger console with a larger display. There&#8217;s still a significant bezel around the display. The Joy-Con controllers are receiving a massive update as well. Due to the larger screen size, they are also larger and feature a more rounded design. They attach magnetically to the sides of the tablet. Nintendo is going for a less colorful design with this new console. This time, the Switch 2 is nearly entirely black with some accented colors below the controller sticks and at the top of the Joy-Cons. The console will be dockable so that you can also play on your TV. In that case, you can detach the controllers and use them as two distinct controllers, or snap them on a separate controller grip. And if you&#8217;re playing on the go, the kickstand at the back of the device has been redesigned. It appears much sturdier than the kickstand on the original Switch. There&#8217;s a new USB-C port at the top of the device as well — this is a better location if you want to charge and play at the same time when using the Switch 2 as a handheld device. Nintendo Switch owners will be happy to hear that the Nintendo Switch 2 will support original Switch games. There will be a physical cartridge slot at the top of the device. Digital games originally designed for the Switch will also work on the new console. The only game that appears in the video is a Mario Kart game. It looks similar to Mario Kart 8 Deluxe, but it&#8217;s unclear whether it&#8217;s just the existing Nintendo Switch game or a brand new Mario Kart game. The most significant difference with the Nintendo Switch will be inside the device. The company will likely upgrade internal components so that the console supports more demanding games. But we&#8217;ll have to wait to learn more on this front. Details are still thin when it comes to pricing and availability as well. The company plans to share more details in a Nintendo Direct livestream video on April 2, 2025. So it sounds like the Nintendo Switch 2 release is still months away. Image Credits:Nintendo"
