["https://techcrunch.com/2025/01/15/chinese-ai-company-minimax-releases-new-models-it-claims-are-competitive-with-the-industrys-best/"]
title = "Chinese AI company MiniMax releases new models it claims are competitive with the industry&#8217;s best"
description = "Chinese firms continue to release AI models that rival the capabilities of systems developed by OpenAI and other U.S.-based AI companies. This week, MiniMax, an Alibaba- and Tencent-backed startup that has raised around $850 million in venture capital and is valued at more than $2.5 billion, debuted three new models: MiniMax-Text-01, MiniMax-VL-01, and T2A-01-HD. MiniMax-Text-01 [&hellip;]"
full_description = "Chinese firms continue to release AI models that rival the capabilities of systems developed by OpenAI and other U.S.-based AI companies. This week, MiniMax, an Alibaba- and Tencent-backed startup that has raised around $850 million in venture capital and is valued at more than $2.5 billion, debuted three new models: MiniMax-Text-01, MiniMax-VL-01, and T2A-01-HD. MiniMax-Text-01 is a text-only model, while MiniMax-VL-01 can understand both images and text. T2A-01-HD, meanwhile, generates audio — specifically speech. MiniMax claims that MiniMax-Text-01, which is 456 billion parameters in size, performs better than models such as Google&#8217;s recently unveiled Gemini 2.0 Flash on benchmarks like MMLU and SimpleQA, which measure the ability of a model to answer math problems and fact-based questions. Parameters roughly correspond to a model’s problem-solving skills, and models with more parameters generally perform better than those with fewer parameters. As for MiniMax-VL-01, MiniMax says that it rivals Anthropic&#8217;s Claude 3.5 Sonnet on evaluations that require multimodal understanding, like ChartQA, which tasks models with answering graph- and diagram-related queries (e.g., &#8220;What is the peak value of the orange line in this graph?&#8221;). Granted, MiniMax-VL-01 doesn&#8217;t quite best Gemini 2.0 Flash on many of these tests. OpenAI&#8217;s GPT-4o and an open model called InternVL2.5 beat it on several as well. Of note, MiniMax-Text-01 has an extremely large context window. A model’s context, or context window, refers to input (e.g., text) that a model considers before generating output (additional text). With a context window of 4 million tokens, MiniMax-Text-01 can analyze around 3 million words in one go — or just over five copies of &#8220;War and Peace.&#8221; For context (no pun intended), MiniMax-Text-01&#8217;s context window is roughly 31 times the size of GPT-4o&#8217;s and Llama 3.1&#8217;s. The last of MiniMax&#8217;s models released this week, T2A-01-HD, is an audio generator optimized for speech. T2A-01-HD can generate a synthetic voice with adjustable cadence, tone, and tenor in around 17 different languages, including English and Chinese, and clone a voice from just 10 seconds of an audio recording. MiniMax didn&#8217;t publish benchmark results comparing T2A-01-HD to other audio-generating models. But to this reporter&#8217;s ear, T2A-01-HD&#8217;s outputs sound on par with audio models from Meta and startups like PlayAI. With the exception of T2A-01-HD, which is exclusively available through MiniMax&#8217;s API and Hailuo AI platform, MiniMax&#8217;s new models can be downloaded from GitHub and the AI dev platform Hugging Face. Just because the models are &#8220;openly&#8221; available doesn&#8217;t mean they aren&#8217;t locked down in certain aspects, however. MiniMax-Text-01 and MiniMax-VL-01 aren&#8217;t truly open source in the sense that MiniMax hasn&#8217;t released the components (e.g., training data) needed to re-create them from scratch. Moreover, they&#8217;re under MiniMax&#8217;s restrictive license, which prohibits developers from using the models to improve rival AI models and requires that platforms with more than 100 million monthly active users request a special license from MiniMax. MiniMax was founded in 2021 by former employees of SenseTime, one of China’s largest AI firms. The company&#8217;s projects include apps like Talkie, an AI-powered role-playing platform along the lines of Character AI, and text-to-video models that MiniMax has released in Hailuo. Some of MiniMax&#8217;s products have become the subject of minor controversy. Talkie, which was pulled from Apple&#8217;s App Store in December for unspecified &#8220;technical&#8221; reasons, features AI avatars of public figures, including Donald Trump, Taylor Swift, Elon Musk, and LeBron James, none of whom appear to have consented to being featured in the app. In December, Broadcast magazine reported that MiniMax&#8217;s video generators can reproduce the logos of British television channels, suggesting that MiniMax&#8217;s models were trained on content from those channels. And MiniMax is reportedly being sued by iQiyi, a Chinese video streaming service that alleges MiniMax illicitly trained on iQiyi&#8217;s copyrighted recordings. MiniMax&#8217;s new models arrive days after the outgoing Biden administration proposed harsher export rules and restrictions on AI technologies for Chinese ventures. Companies in China were already prevented from buying advanced AI chips, but if the new rules go into effect as written, companies will be faced with stricter caps on both the semiconductor tech and models needed to bootstrap sophisticated AI systems. On Wednesday, the Biden administration announced additional measures focused on keeping sophisticated chips out of China. Chip foundries and packaging companies that want to export certain chips will be subjected to broader license requirements unless they exercise greater scrutiny and due diligence to prevent their products from reaching Chinese clients."
