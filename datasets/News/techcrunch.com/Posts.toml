["https://techcrunch.com/2025/01/15/google-inks-deal-with-the-associated-press-to-bring-more-real-time-info-to-gemini/"]
title = "Google inks deal with The Associated Press to bring more real-time info to Gemini"
description = "In a bid to make its Gemini chatbot app more of a one-stop shop, Google says it&#8217;s working with The Associated Press to build &#8220;a feed of real-time information&#8221; in Gemini. Jaffer Zaidi, Google&#8217;s VP of global news partnerships, said that the goal is to &#8220;further enhance the usefulness of results&#8221; in the Gemini experience. [&hellip;]"
full_description = "In a bid to make its Gemini chatbot app more of a one-stop shop, Google says it&#8217;s working with The Associated Press to build &#8220;a feed of real-time information&#8221; in Gemini. Jaffer Zaidi, Google&#8217;s VP of global news partnerships, said that the goal is to &#8220;further enhance the usefulness of results&#8221; in the Gemini experience. &#8220;As we develop new AI offerings and product[s], we’re identifying specific types of information and data that can help improve our products and services for people everywhere,&#8221; Zaidi wrote in a blog post. &#8220;This [new feed] will be particularly helpful to our users looking for up-to-date information.&#8221; Zaidi gave no indication as to when this feature might arrive in Gemini, nor whether it&#8217;ll be visible to users in every region where the app is available. Google, which has a longstanding partnership with The Associated Press, is but one of many companies developing AI that has sought to collaborate with news organizations to improve the accuracy of its AI technologies. OpenAI has formed partnerships with publishers including the Financial Times, Axel Springer, and News Corp., the owner of The Wall Street Journal. Elsewhere, AI-powered search engine Perplexity has launched a program that allows publishers to earn incremental revenue when their content is referenced in results. Several of these deals have a training component. Publishers like Condé Nast have agreed to let AI vendors with which they have a licensing agreement train AI models on their archives. The AI industry has largely pitched these arrangements as a service to journalism, but they&#8217;re also designed to shield AI companies from copyright infringement claims. In many cases, publisher deals haven&#8217;t, in fact, noticeably improved AI companies&#8217; products. A recent study from Columbia University&#8217;s Tow Center for Digital Journalism showed that OpenAI&#8217;s AI-powered chatbot, ChatGPT, misquotes content even from publishers that have agreements with OpenAI. Be that as it may, the dire state of the news industry is likely to push more outlets to secure what agreements they can."
