title = "Europe orders Elon Musk&#8217;s X to submit documents on its recommendation algorithms"
description = "The European Commission (EC) says it has requested information from Elon Musk&#8217;s X related to the algorithms that determine the content it recommends to users. The EC wants to determine how those algorithms may or may not be compliant with the Digital Services Act (DSA), which imposes key obligations on online platforms operating across the [&hellip;]"
full_description = "The European Commission (EC) says it has requested information from Elon Musk&#8217;s X related to the algorithms that determine the content it recommends to users. The EC wants to determine how those algorithms may or may not be compliant with the Digital Services Act (DSA), which imposes key obligations on online platforms operating across the bloc. With Germany preparing for a federal election in February, the German government had accused Elon Musk of trying to influence the upcoming election in favor of the far-right AfD party. However, as per a report in the Financial Times, the Commission says its latest request is not directly related to this. The request expands on an existing probe into X&#8217;s activities that the EC initiated back in 2023. Now, the EC has requested X to provide &#8220;internal documentation&#8221; on its recommendation systems, and any recent changes the company has made to them. It has also issued a &#8220;retention order&#8221; that requires X to keep a record of any future changes through the end of 2025. Additionally, the EC has requested access to some of X&#8217;s commercial APIs and technical interfaces."
