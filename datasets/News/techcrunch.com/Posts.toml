["https://techcrunch.com/2025/01/17/spacex-and-blue-origin-must-investigate-this-weeks-big-rocket-tests-faa-says/"]
title = "SpaceX and Blue Origin must investigate this week&#8217;s big rocket tests, FAA says"
description = "The Federal Aviation Administration is requiring Elon Musk&#8217;s SpaceX and Jeff Bezos&#8217; Blue Origin to investigate what went wrong on their respective mega-rocket test flights this week. The regulator said both companies must perform what&#8217;s known as a &#8220;mishap investigation.&#8221; These probes involve the companies and the FAA working together to understand what went wrong, [&hellip;]"
full_description = "The Federal Aviation Administration is requiring Elon Musk&#8217;s SpaceX and Jeff Bezos&#8217; Blue Origin to investigate what went wrong on their respective mega-rocket test flights this week. The regulator said both companies must perform what&#8217;s known as a &#8220;mishap investigation.&#8221; These probes involve the companies and the FAA working together to understand what went wrong, why it went wrong, and take corrective action. In both cases, the regulator will have to sign off on the companies before those rockets can fly again. It&#8217;s not immediately clear how long that will take. In SpaceX&#8217;s case, there was an explosion during the seventh test-flight of its Starship rocket system, which launched from Boca Chica, Texas on Thursday. Musk wrote on X that the Starship itself became over-pressurized due to excess gas as it ascended into space, and it ultimately exploded. The company&#8217;s official explanation on its website says the inside of the ship caught fire. Starship&#8217;s destruction created a debris field that lit up the skies over the islands of Turks and Caicos, prompting the FAA to slow and even divert some flights in the nearby airspace as a result of low fuel levels. There are no reports of injuries, according to the FAA, but the regulator said it&#8217;s working with SpaceX to &#8220;confirm reports of public property damage on Turks and Caicos.&#8221; SpaceX and the FAA already seem to be at odds on one particular detail about the explosion. The FAA technically activated what&#8217;s known as a &#8220;Debris Response Area,&#8221; which the administration says it only does if pieces of the spacecraft fall outside of hazard areas that are defined prior to a launch. SpaceX insists on its website that &#8220;[a]ny surviving pieces of debris would have fallen into the designated hazard area.&#8221; Hours before SpaceX&#8217;s rocket launch, Blue Origin&#8217;s New Glenn rocket took off from Cape Canaveral, Florida for the first time ever. The upper stage of the New Glenn rocket successfully made it into orbit, but the booster exploded on its way back down for an attempted landing on a drone ship at sea. The FAA says it is &#8220;aware an anomaly occurred during the Blue Origin&#8221; mission, and that no injuries or public property damage have been reported."
