["https://techcrunch.com/2025/01/15/rockfish-is-helping-enterprises-leverage-synthetic-data/"]
title = "Rockfish is helping enterprises leverage synthetic data"
description = "For years, Vyas Sekar would call up Muckai Girish, an old friend from undergrad, to talk through potential startup ideas and get Girish&#8217;s opinion. The two usually talked through an idea and ended the conversation at that. When Sekar called Girish with an idea involving synthetic data in early 2022, the conversation didn&#8217;t just end [&hellip;]"
full_description = "For years, Vyas Sekar would call up Muckai Girish, an old friend from undergrad, to talk through potential startup ideas and get Girish&#8217;s opinion. The two usually talked through an idea and ended the conversation at that. When Sekar called Girish with an idea involving synthetic data in early 2022, the conversation didn&#8217;t just end when they hung up the phone. Sekar and fellow Carnegie Mellon University colleague Giulia Fanti had been working on building synthetic data to fix the reproducibility crisis, or inability to reproduce data, within academia. While Sekar was seeing the need for a solution in academia, Girish knew his customers at the time were facing the same problem. After talking to a few enterprises, the thesis was further validated. &#8220;At that time, it felt that this was very real and there was an opportunity,&#8221; Girish, CEO, told TechCrunch. &#8220;So that&#8217;s what got us started and over the next couple of months we spoke to some investors, people we knew, and more importantly enterprises, and realized this was a significant problem and it is worth putting, you know, an entire life behind it.&#8221; The result was Rockfish, a startup that uses generative AI to create synthetic data for operational workflows to help enterprises break down their data silos. Rockfish integrates with database providers including AWS and Azure, among others, and helps users choose the best configuration for their data based on company policies or uses for the data. Synthetic data has increasingly become a hot topic in the world of AI, but there was already growing momentum for it when the company got started in June 2022. Girish said that Rockfish wanted to make sure that it was building a product that was differentiated from its peers and also a solution enterprises would be using daily, not just every once in a while. That&#8217;s why the company&#8217;s product is designed to ingest data constantly and is focused on operational data, which includes data on things like financial transactions, cybersecurity, and supply chains. These areas are constantly producing data for companies and are also constantly changing. Girish thinks focusing here helps Rockfish stand apart from other competitors. Now the company works with a handful of enterprise clients, Girish said, including streaming analytics platform Conviva, in addition to government departments including the U.S. Army and the U.S. Department of Defense. Rockfish is announcing a $4 million seed round led by Emergent Ventures, with participation from Foster Ventures, TEN13, and Dallas VC, among others. This brings the company&#8217;s total funding up to about $6 million. Anupam Rastogi, a managing partner at Emergent Ventures, told TechCrunch that he had been tracking Sekar long before the founding of Rockfish. He said that what caused the firm to invest was &#8220;team, market, and product, in that order.&#8221; Plus, Rockfish&#8217;s focus on building for enterprises made it a better fit for Emergent than some of the other players in the space. &#8220;The team is super high-quality data scientists, multiple PhDs,&#8221; Rastogi said. &#8220;This is a space that we think is very technically sophisticated and having that technical strength around the table is really critical. They have done a lot of the foundational work in the space, not just in the company, but the whole industry.&#8221; While Rockfish hopes its focus helps give it a moat amongst competitors, it doesn&#8217;t change the fact that synthetic data will likely be an increasingly crowded market. AI companies are turning toward synthetic data as multiple players think the market has exhausted other AI training data. There are already numerous startups looking to tackle the market, including Tonic AI, which has raised more than $45 million in venture funding; Mostly AI, which has raised $31 million in VC funding; and Hazy, which raised $14.5 million before being acquired by SAS in 2024, just to name a few. Girish said the company looks to add on to its approach to synthetic data by incorporating other types of models like state space models, mathematical models that use state variables. The company also looks to improve its end-to-end features. &#8220;It&#8217;s not like you take random data for the internet and generate synthetic data,&#8221; Girish said. &#8220;There is no guarantee that it&#8217;ll do well. But if you put all of this together for enterprises, it actually is very relevant and realistic. So that&#8217;s the key to this, and then being able to do that on a constant basis is what we find to be useful.&#8221; TechCrunch has an AI-focused newsletter! Sign up here to get it in your inbox every Wednesday."
