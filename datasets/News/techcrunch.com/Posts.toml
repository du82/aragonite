title = "Trump explores ways to extend TikTok ban deadline"
description = "The U.S. ban on TikTok is poised to be delayed as the deadline falls on the MLK Day holiday weekend and President-elect Donald Trump’s incoming administration intends to find a way to extend the deadline, Bloomberg reports. Biden officials see the issue as one for Trump&#8217;s incoming administration, as the current administration doesn&#8217;t plan to intervene [&hellip;]"
full_description = "The U.S. ban on TikTok is poised to be delayed as the deadline falls on the MLK Day holiday weekend and President-elect Donald Trump’s incoming administration intends to find a way to extend the deadline, Bloomberg reports. Biden officials see the issue as one for Trump&#8217;s incoming administration, as the current administration doesn&#8217;t plan to intervene before the ban&#8217;s January 19 deadline. One of the officials told Bloomberg that users should not expect the social network to shut down on Sunday. Michael Waltz, Trump’s incoming national security adviser, told Fox News&#8217; Fox and Friends that the incoming administration will put measures in place to keep TikTok from going dark. The Washington Post also reports that Trump is considering an executive order once in office to buy more time to negotiate a sale or find another solution. While Trump was the one to initiate calls to ban the app during his first term, he took a different approach during his recent campaign and vowed to save the app if elected. Trump has also already asked the Supreme Court, which is currently weighing the ban, to pause the law."
