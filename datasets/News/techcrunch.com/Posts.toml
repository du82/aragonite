["https://techcrunch.com/2025/01/15/these-tech-companies-are-donating-to-la-wildfire-relief-efforts/"]
title = "These tech companies are donating to LA wildfire relief efforts"
description = "Numerous tech companies have pledged millions in donations to help LA recover from wildfires that caused widespread devastation and forced thousands to evacuate the region. Those offering aid include YouTube/Google, Meta, Snap, Amazon, Netflix, and Sony. Here’s an overview of what each company is doing to aid relief efforts in the region: YouTube and Google: [&hellip;]"
full_description = "Numerous tech companies have pledged millions in donations to help LA recover from wildfires that caused widespread devastation and forced thousands to evacuate the region. Those offering aid include YouTube/Google, Meta, Snap, Amazon, Netflix, and Sony. Here’s an overview of what each company is doing to aid relief efforts in the region: YouTube and Google: $15 million YouTube and Google committed $15 million to organizations providing immediate relief in LA, including Emergency Network Los Angeles, the American Red Cross, the Center for Disaster Philanthropy, and the Institute for Nonprofit News. The companies also said that once it’s safe to reopen their offices in LA, they plan to offer YouTube production facilities to impacted creators and artists to help them rebuild their businesses. &#8220;Los Angeles is the heart of entertainment and storytelling and has an impact on culture all over the world,&#8221; YouTube CEO Neal Mohan wrote in a blog post. &#8220;It’s also where many YouTube creators, artists, partners, and our employees call home. Like so many, we’ve been heartbroken by the devastation from the wildfires and want to do our part to support the community as it rebuilds.&#8221; Meta: $2 million (cash + ad credits) Meta has committed $2 million in cash and advertising credits for relief activities, a spokesperson for the company confirmed to TechCrunch. Mark Zuckerberg and his wife, Priscilla Chan, have also personally donated $2 million.  The donations will support immediate shelter, medical humanitarian aid, and long-term recovery efforts. The ad credits will support PSA messaging to affected communities and to support fundraising appeals on Meta’s platforms. While Meta&#8217;s donation is smaller than its other tech counterparts&#8217;, the company notes that emergency response organizations are leveraging its Data for Good tools to aid in their efforts, including its mobility data, which helps track movement and evacuation patterns resulting from the fires. Plus, Meta has activated Facebook&#8217;s Safety Check feature to help users notify their friends and family that they are safe. &#8220;Meta is giving to the relief efforts and Priscilla and I are personally as well,&#8221; Zuckerberg wrote in a post on Threads. &#8220;Meta also activated Safety Check and so far more than 400k people have used it to let friends and family know they&#8217;re safe.&#8221; Snap: $5 million Snap CEO Evan Spiegel announced that the company has donated $5 million in immediate relief and that the social network plans to do more. Snap is also providing meals to evacuees and first responders, and offering free space.   In a blog post titled &#8220;Dear Los Angeles, I Love You,&#8221; Spiegel wrote about how he grew up in the Palisades and that his father’s house had been lost in the wildfires.  &#8220;We are not the first community to face a megafire,&#8221; Spiegel said. &#8220;We will not be the last. But we will use our strength, our ingenuity, and our love to create again and anew. Our city of great artists will add a new layer of paint to this beautiful canvas we call home. Los Angeles, I love you. And as I witness first responders from across the country staging in our office parking lot, I see their tireless support and know that millions more love you too.&#8221; Amazon: $10 million Amazon has committed $10 million to relief organizations in LA, including the American Red Cross of Southern California, FireAid, MusiCares Fire Relief Effort, World Central Kitchen, Los Angeles Fire Department Foundation, Habitat for Los Angeles Wildfire Fund, and Los Angeles Chamber of Commerce Small Business Relief/Recovery Fund.  The company says it has also donated over 145,00 essential items to 17 local organizations working on the wildfire response and that it deployed cloud technology to assist emergency responders.  &#8220;Amazon is working with first responders, nonprofit partners, and humanitarian relief agencies on the ground in Los Angeles to get them thousands of vital supplies,&#8221; Amazon CEO Jeff Bezos said in a post on X. &#8220;The team will continue to support relief efforts in coordination with community partners and humanitarian organizations in the coming weeks.&#8221; Netflix: $10 million Netflix is donating $10 million to the Los Angeles Fire Department Foundation, California Community Fund Wildfire Recovery Fund, World Central Kitchen, Motion Picture and Television Fund, and Entertainment Community Fund.  The streaming giant is also assisting its impacted employees, including helping with temporary housing needs for those who lost their homes. In addition, Netflix is double-matching all employee charitable contributions through its employee giving program. &#8220;The next few years will be a rebuilding time for many of us and it will require creativity, vision, grit and perseverance,&#8221; Netflix CEO Ted Sarandos wrote in a blog post. &#8220;Looking around at some of the hardest hit neighborhoods, it is hard to imagine rebuilding — but we will, and we will come back stronger than before.&#8221; Apple: Yes, but amount not shared Apple CEO Tim Cook announced that the tech giant is donating to support the victims and recovery efforts on the ground. TechCrunch has reached out to the company to learn more about its efforts. In addition to donating, Apple has added a way for users to easily donate to the American Red Cross through its App Store and Apple Music apps. &#8220;Our hearts go out to all impacted by the ongoing devastation in LA. In addition to Apple&#8217;s donation, we&#8217;re making it easy to support recovery efforts,&#8221; Cook said in a post on X. &#8220;If you’re in the US, just open the App Store or Apple Music & click to donate to help make a difference.&#8221; Sony: $5 million Sony is donating $5 million to support emergency relief in LA. The donation will be allocated to relief organizations supporting first responders, community relief, rebuilding efforts, and employee assistance programs. &#8220;Los Angeles has been the home of our entertainment business for more than 35 years,&#8221; said Sony CEO Kenichiro Yoshida and Sony president, COO, and CFO Hiroki Totoki in a joint statement. &#8220;Through our many thousands of employees, partners and friends based there, our roots run deep in this community. We will continue to work with our local business leadership to determine how best Sony Group can support relief and recovery efforts in the days ahead.&#8221; Beyond tech Outside of tech giants, major entertainment companies have donated millions to help aid relief efforts. Warner Bros. Discovery committed $15 million, Comcast NBCUniversal donated $10 million, The Walt Disney Company has committed $15 million, and Paramount is donating $1 million."
