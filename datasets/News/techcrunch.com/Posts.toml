["https://techcrunch.com/2025/01/17/bluesky-saw-17x-increase-in-moderation-reports-in-2024-after-rapid-growth/"]
title = "Bluesky saw 17x increase in moderation reports in 2024 after rapid growth"
description = "Bluesky on Friday published its moderation report for the past year, noting the sizable growth the social network experienced in 2024 and how that affected its Trust & Safety team&#8217;s workload. It also noted that the largest number of reports came from users reporting accounts or posts for harassment, trolling, or intolerance — an issue [&hellip;]"
full_description = "Bluesky on Friday published its moderation report for the past year, noting the sizable growth the social network experienced in 2024 and how that affected its Trust & Safety team&#8217;s workload. It also noted that the largest number of reports came from users reporting accounts or posts for harassment, trolling, or intolerance — an issue that&#8217;s plagued Bluesky as it&#8217;s grown, and has even led to wide-scale protests at times over individual moderation decisions. The company&#8217;s report did not address or explain why it did or did not take action on individual users, including those on the most-blocked list. The company added over 23 million users in 2024, as Bluesky became a new destination for former Twitter/X users for various reasons. Throughout the year, the social network benefited from several changes at X, including its decision to change how blocking works and train AI on user data. Other users left X after the results of the U.S. presidential election, based on how X owner Elon Musk&#8217;s politics began to dominate the platform. The app also surged in users while X was temporarily banned in Brazil back in September. To meet the demands caused by this growth, Bluesky increased its moderation team to roughly 100 moderators, it said, and is continuing to hire. The company also began offering team members psychological counseling to help them with the difficult job of being constantly exposed to graphic content. (An area we hope AI will one day address, as humans are not built to handle this type of work.) In total, there were 6.48 million reports to Bluesky&#8217;s moderation service, up 17x from 2023 when there were only 358,000 reports. Starting this year, Bluesky will begin to accept moderation reports directly from its app. Similar to X, this will allow users to track actions and updates more easily. Later, it will support appeals in-app, too. When Brazilian users flooded into Bluesky in August, the company was seeing as many as 50,000 reports per day, at the peak. This led to a backlog in addressing moderation reports and required Bluesky to hire more Portuguese-language staff, including through a contract vendor. In addition, Bluesky began automating more categories of reports beyond just spam to help it address the influx, though this sometimes led to false positives. Still, the automation helped drop the processing time to just &#8220;seconds&#8221; for &#8220;high-certainty&#8221; accounts. Before automation, most reports were handled within 40 minutes. Now, human moderators are kept in the loop to address the false positives and appeals, if not always handling the initial decision. Bluesky says that 4.57% of its active users (1.19 million) made at least one moderation report in 2024, down from 5.6% in 2023. Most of these — 3.5 million reports — were for individual posts. Account profiles were reported 47,000 times, often for a profile picture or banner photo. Lists were reported 45,000 times; DMs were reported 17,700 times, with feeds and Starter Packs receiving 5,300 and 1,900 reports, respectively. Most reports were over anti-social behavior, like trolling and harassment — a signal from Bluesky users that they want to see a less toxic social network, as compared with X. Other reports were for the following categories, Bluesky said: Misleading content (impersonation, misinformation, or false claims about identity or affiliations): 1.20 million Spam (excessive mentions, replies, or repetitive content): 1.40 million Unwanted sexual content (nudity or adult content not properly labeled): 630,000 Illegal or urgent issues (clear violations of the law or Bluesky&#8217;s terms of service): 933,000 Other (issues that don’t fit into the above categories): 726,000 The company also offered an update on its labeling service, which involves labels added to posts and accounts. Human labelers added 55,422 &#8220;sexual figure&#8221; labels, followed by 22,412 &#8220;rude&#8221; labels, 13,201 &#8220;spam&#8221; labels, 11,341 &#8220;intolerant&#8221; labels, and 3,046 &#8220;threat&#8221; labels. In 2024, 93,076 users submitted a total of 205,000 appeals over Bluesky&#8217;s moderation decision. There were also 66,308 account takedowns from moderators and 35,842 automated account takedowns. Bluesky additionally fielded 238 requests from law enforcement, governments, and legal firms. The company responded to 182 of these and complied with 146. Most of the requests were law enforcement requests from Germany, the U.S., Brazil, and Japan, it said. Bluesky&#8217;s full report also delves into other types of issues, including trademark and copyright claims and child safety/CSAM reports. The company noted it submitted 1,154 confirmed CSAM reports to the National Center for Missing & Exploited Children (NCMEC)."
