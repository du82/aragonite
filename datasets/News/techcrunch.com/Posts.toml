["https://techcrunch.com/2025/01/15/akshay-naheta-distributed-technologies-research/"]
title = "SoftBank veteran hunts for profits in payments infrastructure plumbing"
description = "Former SoftBank exec Akshay Naheta&#8217;s startup, Distributed Technologies Research, is trying to bridge the gap between banking and blockchain tech."
full_description = "In the summer of 2020, as pandemic-driven volatility gripped markets, SoftBank Group shocked Wall Street with a series of massive options bets on U.S. technology stocks. Behind those trades — which earned SoftBank the &#8220;Nasdaq whale&#8221; moniker — was Akshay Naheta, an executive whose career has been marked by bold wagers on disruption. Now, after orchestrating multi-billion-dollar deals, including an attempt to merge Nvidia and ARM, Naheta is making perhaps his most ambitious bet yet: That the world&#8217;s payment infrastructure is ripe for reinvention. His Zug, Switzerland-based startup, Distributed Technologies Research (DTR), is attempting to bridge the gap between traditional banking and blockchain technology, joining an army of companies trying to modernize the global payments infrastructure. The startup claims its technology can eliminate various payment inefficiencies, from transfer costs and interchange fees to foreign exchange conversion charges and settlement delays. &#8220;Current payment networks suffer from inefficiencies — transfer costs, interchange fees, FX conversion charges, settlement delays and other opaque fees,&#8221; Naheta told TechCrunch in an interview. DTR&#8217;s core technology, AmalgamOS, essentially connects banks with blockchain networks. Through APIs, it allows businesses to integrate payment capabilities while maintaining compliance with local regulations. The system can handle everything from merchant payments to treasury management, supporting both traditional currencies and major stablecoins across 48 countries. The startup has built what Naheta describes as an &#8220;international orchestration network&#8221; that automatically routes transactions through either traditional banking or blockchain rails, depending on which path offers the optimal combination of speed and cost. &#8220;We&#8217;re connected to 12,000 banks in Europe,&#8221; he said in an interview. A business integrating DTR&#8217;s APIs can let its customers initiate transfers directly through banking apps. DTR&#8217;s push into payments infrastructure comes at a seemingly opportune time. Visa and Mastercard &#8212; both of which charge 2% to 3% swipe fees, typically the second highest cost for merchants after payroll &#8212; are facing mounting scrutiny over their duopoly, and the U.S.&#8217; proposed Credit Card Competition Act could require banks to offer merchants alternatives to the dominant networks. DTR&#8217;s early customers say its infrastructure fills a significant gap. Phillip Lord of Oobit, a crypto wallet startup, said the system allowed his company to move money from his crypto wallet to a U.K. bank account on Christmas Day in under 30 seconds — a transfer that would have taken days through traditional channels. Akshay Naheta.Image Credits:DTR Naheta&#8217;s interest in payment infrastructure stems from an unlikely source: SoftBank&#8217;s acquisition of Fortress Investment Group in 2017. The deal put about $20 million worth of Bitcoin on SoftBank&#8217;s balance sheet. As he studied the underlying blockchain technology, Naheta says he saw an opportunity to apply his background in wireless communications to payment networks. While still at SoftBank, Naheta had begun assembling what he hoped would be DTR&#8217;s founding team. He reached out to his undergraduate thesis adviser, Pramod Viswanath, an expert in wireless communications who now leads Princeton&#8217;s blockchain center and Sreeram Kannan, who would later start EigenLayer. The team saw blockchain as a peer-to-peer communications network at heart, one that could apply decades of research in wireless systems to revolutionize payments. Naheta said he nearly resigned from SoftBank in summer 2018 to focus on DTR and crypto venture Bakkt, but was persuaded to stay by senior executives, including Rajeev Misra and Masayoshi Son. Naheta&#8217;s previous forays into the payments sector also included SoftBank&#8217;s investment in Wirecard, which later collapsed. SoftBank still made profits on its investment in Wirecard. &#8220;I&#8217;ve had lots of missteps,&#8221; he acknowledged. &#8220;I looked at it from a perspective of, here&#8217;s a company that has all of these regulated licenses around the world, clearly has the payments technology.&#8221; Those experiences appear to have influenced DTR&#8217;s emphasis on compliance and institutional credibility. This measured approach extends to the company&#8217;s growth strategy. &#8220;Even if I increase my headcount to 60 people by the second quarter, we&#8217;ll be free-cash-flow positive,&#8221; he said. Stablecoin&#8217;s growth surged 55% in 2024 and Bernstein expects it to hit $500 billion in market cap this year.Image Credits:Bernstein The startup faces competition on multiple fronts. Wise has built a successful business matching currency flows between countries, Ripple offers blockchain-based settlement despite its legal troubles, while traditional banks also say they are upgrading their systems through initiatives like SWIFT. Last, but not least, Stripe&#8217;s recent $1 billion acquisition of Bridge stands to help the world&#8217;s most valuable fintech startup make deeper inroads into payments. Yet Naheta sees an opening in serving businesses caught between these worlds — particularly digital nomads, creator economy platforms, and companies operating across emerging markets. &#8220;Banks are not equipped to run KYC/AML at that small level, where you&#8217;re paying out $200 to 10,000 people per month,&#8221; he argued. The fragmented nature of national payment systems creates particular challenges for businesses operating globally, as each jurisdiction maintains its own rails and regulations. The payments industry&#8217;s high margins and network effects make it notoriously difficult to disrupt. PayPal commands a $70 billion market cap even after recent declines, while Visa and Mastercard together are worth over $1 tillion. &#8220;I really think that the retail customer is getting screwed on payments,&#8221; he says. &#8220;And it&#8217;s not the fault of the banks. They are plugged into legacy systems and it&#8217;s very hard to turn a Titanic.&#8221; Lord of Oobit said in an interview that the space remains wide open. He pointed out that until just a year ago, the only option for businesses needing to move between crypto and traditional banking systems was to &#8220;go to like an OTC shop and pay probably like 1 to 3% to get it transferred.&#8221; &#8220;It&#8217;s crazy that for so many years, we have had so many startups come up, we have had so many coins show up, and whenever I wanted to do an on-ramp or off-ramp, there was no other formalized legal idea system around,&#8221; he said. DTR&#8217;s solution is &#8220;a block faster&#8221; than alternatives."
