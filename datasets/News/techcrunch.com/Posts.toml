["https://techcrunch.com/2025/01/16/mistral-signs-deal-with-afp-to-offer-up-to-date-answers-in-le-chat/"]
title = "Mistral signs deal with AFP to offer up-to-date answers in Le Chat"
description = "Just a day after Google inked a deal with The Associated Press, Mistral has announced a content deal with newswire Agence France-Presse (AFP) to improve the accuracy of answers in Le Chat, Mistral’s chatbot. This is the first deal of this kind for the Paris-based artificial intelligence company, and it indicates that Mistral doesn’t want [&hellip;]"
full_description = "Just a day after Google inked a deal with The Associated Press, Mistral has announced a content deal with newswire Agence France-Presse (AFP) to improve the accuracy of answers in Le Chat, Mistral’s chatbot. This is the first deal of this kind for the Paris-based artificial intelligence company, and it indicates that Mistral doesn’t want to be considered as “just” a foundation model maker. Going forward, Le Chat will be able to tap into AFP’s stories, and given that AFP is one of the biggest news agencies in the world, that represents a significant volume of text — around 2,300 stories per day in six languages (Arabic, English, French, German, Portuguese, and Spanish). Le Chat will be able to query AFP’s entire archive dating back to 1983. However, photos and videos aren’t part of this multi-year agreement. As a reminder, Mistral focuses on large language models and doesn’t offer image-generation models. Image generation in Le Chat is handled by Black Forest Labs&#8217; Flux Pro. The AI company also wants to build appealing products, starting with Le Chat. From what I’ve heard, the company is also working on dedicated apps that let users access Le Chat and better compete with OpenAI&#8217;s ChatGPT and Anthropic&#8217;s Claude. OpenAI has been leading the charge when it comes to content deals. The company has inked partnerships with AP, Axel Springer, Condé Nast, El País, Financial Times, Le Monde, and others. It’s going to be interesting to see whether Mistral has more content partnerships in the works. “We believe improving the accuracy of [Le Chat’s] responses is a key step in the deployment of our technology, particularly for businesses,” Mistral co-founder and CEO Arthur Mensch said in a statement. “Through this partnership, we are providing our clients with a unique multicultural and multilingual alternative.” Today’s partnership is also a first for AFP. It couldn’t have come at a better time, as Meta ended its third-party fact-checking program just last week, and AFP was one of the key partners in Meta’s fact-checking system. “Through this partnership, AFP is further diversifying its revenue sources,” AFP chairman and CEO Fabrice Fries said in a statement. While the AI industry is looking to improve its products with these arrangements, there are two side effects that could be considered as added benefits: firstly, AI companies can position themselves as (financial) allies to news organizations; and, these partnerships protect them from potential copyright infringement claims. TechCrunch has an AI-focused newsletter! Sign up here to get it in your inbox every Wednesday."
