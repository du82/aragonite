full_description = "Y Combinator alum Stoke Space just raised a $260 million Series C, bringing its total raised to $480 million. This follows $100 million raised in October 2023, and $75 million in December 2021. The company was founded in 2019 by Blue Origin veterans Andy Lapsa and Tom Feldman, who launched his career as a SpaceX intern. Stoke attended the Winter 2021 YC cohort. The space startup has an ambitious goal to build the first fully reusable rocket, meaning both the booster and second stage. Last month, it shared video of a successful test of its first-stage rocket engine. The cash will help it build its new facilities at Florida’s historic Cape Canaveral Space Force Station. Investors in this latest round include Breakthrough Energy Ventures, Glade Brook Capital Partners, Industrious Ventures, Point72 Ventures, Seven Seven Six, Y Combinator, and several others."
