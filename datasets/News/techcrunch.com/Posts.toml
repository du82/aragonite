["https://techcrunch.com/2025/01/15/in-ai-copyright-case-zuckerberg-turns-to-youtube-for-his-defense/"]
title = "In AI copyright case, Zuckerberg turns to YouTube for his defense"
description = "Meta CEO Mark Zuckerberg appears to have used YouTube&#8217;s battle to remove pirated content to defend his own company&#8217;s use of a dataset containing copyrighted e-books, revealed in newly released snippets of a deposition he gave late last year. The deposition, which was part of a complaint submitted to the court by plaintiffs&#8217; attorneys, is [&hellip;]"
full_description = "Meta CEO Mark Zuckerberg appears to have used YouTube&#8217;s battle to remove pirated content to defend his own company&#8217;s use of a dataset containing copyrighted e-books, revealed in newly released snippets of a deposition he gave late last year. The deposition, which was part of a complaint submitted to the court by plaintiffs&#8217; attorneys, is related to the AI copyright case Kadrey v. Meta Platforms. It’s one of many such cases winding through the U.S. court system that&#8217;s pitting AI companies against authors and other IP holders. For the most part, the defendants in these cases — AI companies — claim that training on copyrighted content is “fair use.” Many copyright holders disagree. “For example, YouTube, I think, may end up hosting some stuff that people pirate for some period of time, but YouTube is trying to take that stuff down,” Zuckerberg said during his deposition, according to portions of a transcript made available Wednesday night. “And the vast majority of the stuff on YouTube, I would assume, is kind of good and they have the license to do.”  Snippets from Zuckerberg&#8217;s deposition provide some clues of Zuckerberg&#8217;s thinking on copyright content and fair use. However, it should be noted that a full transcript of the deposition was not released. TechCrunch has reached out to Meta for additional context and will update the article if the company responds. Based on the deposition nuggets, Zuckerberg appears to be defending Meta’s use of a training dataset of e-books called LibGen to develop its family of AI models known as Llama. Meta’s Llama competes against flagship models from AI companies like OpenAI.  LibGen, which describes itself as a “links aggregator,” provides access to copyrighted works from publishers, including Cengage Learning, Macmillan Learning, McGraw Hill, and Pearson Education. LibGen has been sued a number of times, ordered to shut down, and fined tens of millions of dollars for copyright infringement. According to court filings unsealed this week, Zuckerberg allegedly cleared the use of LibGen to train at least one of Meta’s Llama models despite concerns within the company’s AI exec and research teams over the legal implications. Counsel for the plaintiffs, who include bestselling authors Sarah Silverman and Ta-Nehisi Coates, quoted Meta employees as referring to LibGen as a “data set we know to be pirated” and flagging that its use “may undermine [Meta’s] negotiating position with regulators,” according to a legal filing. During his deposition, Zuckerberg claimed he &#8220;hadn&#8217;t really heard of&#8221; LibGen. “I get that you’re trying to get me to give an opinion of LibGen, which I haven’t really heard of,” said Zuckerberg during the deposition. “It’s just that I don’t have knowledge of that specific thing.” Under questioning from one of the plaintiffs’ attorneys, David Boies, Zuckerberg explained why it would be unreasonable to prohibit using a dataset like LibGen. “So would I want to have a policy against people using YouTube because some of the content may be copyrighted? No,” he said. “[T]here are cases where having such a blanket ban might not be the right thing to do.” Zuckerberg did state that Meta should be “pretty careful about” training on copyrighted material. “You know, [if there’s] someone who’s providing a website and they’re intentionally trying to violate people’s rights … obviously it’s something that we would want to be cautious about or careful about how we engaged with it or maybe even prevent our teams from engaging with it,” Zuckerberg said during his deposition, according to the transcript. New allegations Plaintiffs’ lawyers in the Kadrey v. Meta Platforms case have amended the complaint several times since it was filed in U.S. District Court for the Northern District of California, San Francisco Division in 2023. The latest amended complaint filed by plaintiffs’ counsel late Wednesday contains new allegations against Meta, including that the company cross-referenced certain pirated books in LibGen with copyrighted books available for license. Lawyers allege Meta used this tactic to determine whether it made sense to pursue a licensing agreement with a publisher.  Meta allegedly used LibGen to train its latest family of Llama models, Llama 3, per the amended filing. Plaintiffs also allege that Meta is using the dataset to train its next-gen Llama 4 models. According to the amended filing, Meta researchers allegedly tried to hide the fact that Llama models were trained on copyrighted materials by inserting “supervised samples” into Llama’s fine-tuning. And Meta downloaded pirated e-books from another source, Z-Library, for Llama training as recently as April 2024, the amended complaint alleges. Z-Library, or Z-Lib, has been the subject of a number of legal actions brought by publishers, including domain seizures and takedowns. In 2022, the Russian nationals who allegedly maintained it were charged with copyright infringement, wire fraud, and money laundering."
