["https://techcrunch.com/2025/01/16/apple-brings-store-app-to-indian-market/"]
title = "Apple brings Store app to Indian market"
description = "Apple launched its dedicated Apple Store app in India on Friday, deepening its retail presence in the world&#8217;s most populous country as the iPhone maker seeks to capitalize on growing consumer demand. The app, available for download on India&#8217;s App Store, lets customers purchase Apple products directly while receiving personalized shopping recommendations, the company said [&hellip;]"
full_description = "Apple launched its dedicated Apple Store app in India on Friday, deepening its retail presence in the world&#8217;s most populous country as the iPhone maker seeks to capitalize on growing consumer demand. The app, available for download on India&#8217;s App Store, lets customers purchase Apple products directly while receiving personalized shopping recommendations, the company said in a statement. Through the app, users can also customize their Mac with more powerful chips, extra memory, or additional storage &#8212; features long sought by Indian customers &#8212; and arrange for delivery or pickup of their purchases. The move comes as Apple works to strengthen its foothold in India, where it opened its first physical stores in Mumbai and Delhi in 2023. The company plans additional four stores in tech hub Bengaluru, Pune, and other parts of Delhi and Mumbai. (Apple launched its online store in India in 2020.) &#8220;At Apple, our customer is at the centre of everything we do, and we are thrilled to introduce the Apple Store app to reach even more users in India, further deepening our connections,&#8221; said Karen Rasmussen, Apple&#8217;s head of retail online, in a statement. The app features separate tabs for products, personalized recommendations and post-purchase support, including online setup sessions with Apple specialists. Customers can also sign up for free training sessions at physical Apple stores and learn about Apple trade-in and financing options as well as add free engravings to devices such as AirPods and iPads in eight languages. India, the world&#8217;s second largest smartphone market, is slowly becoming a significant geography for Apple as it looks to expand its manufacturing bases outside of China. The company began assembling iPhones in India in 2017 and has since expanded production through partners, including Foxconn and Indian conglomerate Tata."
