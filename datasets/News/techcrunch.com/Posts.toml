["https://techcrunch.com/2025/01/15/amazon-to-acquire-indian-fintech-axio-in-credit-push/"]
title = "Amazon to buy Indian BNPL startup Axio for over $150M"
description = "Amazon has agreed to acquire Indian buy-now, pay-later startup Axio, deepening its push into financial services in one of its fastest-growing markets. The e-commerce group, which has held an equity stake in Axio for six years, signed the acquisition agreement in December after completing due diligence, the Indian startup said in a blog post. Financial [&hellip;]"
full_description = "Amazon has agreed to acquire Indian buy-now, pay-later startup Axio, deepening its push into financial services in one of its fastest-growing markets. The e-commerce group, which has held an equity stake in Axio for six years, signed the acquisition agreement in December after completing due diligence, the Indian startup said in a blog post. Financial terms of the deal were not disclosed, but two people familiar with the matter told TechCrunch that the size of the deal is over $150 million. The transaction requires approval from the Indian central bank. The Bengaluru-headquartered startup, formerly known as Capital Float, has so far raised $135 million from investors including Peak XV Partners, Ribbit Capital, and Elevation Capital over the years. Axio specializes in providing credit to self-employed individuals and households at the point of sale on major e-commerce platforms, including Amazon and MakeMyTrip. It claims it serves more than 10 million customers and that its loan book is worth more than $260 million. Axio and other startups like it in India operate in a market where access to traditional credit remains limited — the country has low credit card penetration, and conventional banks often find small-ticket loans unprofitable. The startup says it attempts to address this gap with its regulated lending platform that can assess customers&#8217; credit-worthiness rapidly, helping it make credit decisions &#8220;within two clicks and five seconds.&#8221; But like many other startups in the category, Axio has also struggled to maintain its growth. Goldman Sachs-backed ZestMoney, which operated in a similar space and was once valued at $450 million, also struggled and was eventually bought by financial services firm DMI Group in a fire sale last year. The startup competes with Bajaj Finance, the Indian financial services giant that dominates the market. Axio is the second startup Amazon has acquired in India in the past year — it bought on-demand video streaming service MX Player in June. The tech giant has deployed more than $10 billion in the country so far."
