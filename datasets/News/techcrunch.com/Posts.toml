["https://techcrunch.com/2025/01/15/how-to-stream-donald-trumps-inauguration-day-2025/"]
title = "How to stream Donald Trump’s Inauguration Day 2025"
description = "Donald Trump will take the presidential oath of office on Monday in front of the Capitol building in Washington, D.C., once again. The event takes place at noon ET and is expected to attract considerable attention from both supporters and opponents. How to stream Trump’s inauguration You can watch the inauguration live with cable or [&hellip;]"
full_description = "Donald Trump will take the presidential oath of office on Monday in front of the Capitol building in Washington, D.C., once again. The event takes place at noon ET and is expected to attract considerable attention from both supporters and opponents. How to stream Trump’s inauguration You can watch the inauguration live with cable or by subscribing to a live TV streaming service (DirecTV Stream, Hulu Live TV, Sling, or YouTube TV) that provides access to ABC, CBS, CNN, CSPAN, Fox News, MSNBC, NBC, and PBS. All the above networks will also livestream it on YouTube. We&#8217;ve included the links below. ABC CBS CNN CSPAN Fox News NBC PBS What to expect from Inauguration Day 2025 We can anticipate a large turnout for the upcoming event, especially since Donald Trump&#8217;s previous inauguration in 2017 was the largest live news event ever hosted by the content delivery network Akamai. While the guest list has not yet been confirmed, we can likely expect attendance from Joe Biden, members of Congress, the Supreme Court, Trump&#8217;s family members, and incoming Vice President J.D. Vance. There will also be several tech leaders who reportedly plan to attend, including Elon Musk, Jeff Bezos, and Mark Zuckerberg. Carrie Underwood is expected to perform “America the Beautiful.” The main ceremony itself is predicted to last around two hours, based on events in the past. The swearing-in ceremony only lasts around 30 minutes. The entire livestream, which includes events like parades, performances, and other activities, is typically around 10 hours."
