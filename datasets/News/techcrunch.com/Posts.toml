["https://techcrunch.com/2025/01/15/samsung-will-unveil-the-galaxy-s25-on-january-22-heres-what-we-expect/"]
title = "Samsung will unveil the Galaxy S25 on January 22 — here’s what we expect"
description = "The biggest reveal from last week’s Samsung CES press conference may well have been another press conference. The hardware giant closed out the main event by teasing the company’s upcoming show. The next Samsung Unpacked event is set for January 22 at 10 a.m. PT. As with all recent Unpacked events, next week&#8217;s big show [&hellip;]"
full_description = "The biggest reveal from last week’s Samsung CES press conference may well have been another press conference. The hardware giant closed out the main event by teasing the company’s upcoming show. The next Samsung Unpacked event is set for January 22 at 10 a.m. PT. As with all recent Unpacked events, next week&#8217;s big show will be streamed both directly through Samsung’s site, as well as the company’s YouTube channel. Samsung is so excited to get the preorders flowing ahead of time that reservations prior to the event come with a $50 Samsung store credit. You can find all of the fine print on that over here. The one absolute slam dunk for the event is the Galaxy S25 line. Since breaking off from CES/MWC for its mobile announcements, the company has developed a twice-a-year cadence for flagship releases. We get the Galaxy S series around January/February, followed by new foldables over the summer. The line should include three key models: the S25, S25+, and S25 Ultra, the latter of which is the product of the S line absorbing the Galaxy Note as its biggest, most premium device. Per the usual, the lead-up to the event has been peppered with leaks, renders, and cases. The latter gives us a general sense of dimensions for the line, as they are built to specs submitted by Samsung to the manufacturer. The lion&#8217;s share of rumors point to the S25 looking a whole lot like its predecessor. The biggest change on the hardware front is a slimmer design. Rumors published this week point to Samsung shaving 1 to 2 millimeters off the device’s profile. Another nearly certain rumor is the inclusion of the Snapdragon 8 Elite chip that Qualcomm unveiled in Hawaii last October. (The usual caveat is that there’s always a bit of processor variation in international markets. Here in the States, however, it’s pretty much a done deal.) Galaxy AI will, of course, be the centerpiece as Samsung looks not only to present itself as a leader in the category, but also differentiate its offering from Google Gemini features that will be available across Android devices. Of course, last year’s big AI announcement was Circle to Search, a Google feature that launched on the S24 first. Other possible — but significantly less certain — reveals include a successor to the lukewarmly received Galaxy Ring wearable and a closer look at Project Moohan, an extended reality headset being jointly developed with Google."
