["https://techcrunch.com/2025/01/15/google-raises-the-price-of-workspace-plans-making-its-ai-features-included-for-free/"]
title = "Google raises the price of Workspace plans, includes its AI features for free"
description = "Google announced on Wednesday that all AI features in Gmail, Docs, Sheets, and Meet are now available to Workspace customers at no extra charge, though the plan will see a $2 per month increase per user.  This change simplifies access to Workplace AI tools, including email summaries, automated note-taking, chatting with the Gemini bot, and [&hellip;]"
full_description = "Google announced on Wednesday that all AI features in Gmail, Docs, Sheets, and Meet are now available to Workspace customers at no extra charge, though the plan will see a $2 per month increase per user.  This change simplifies access to Workplace AI tools, including email summaries, automated note-taking, chatting with the Gemini bot, and more. Previously, customers who wanted to use all of the AI features needed to pay an additional $20 per user per month for the Gemini for Workplace plan on top of the $12 for the Workspace Business Standard plan. Now, the standard plan is $14 per user per month. The new pricing takes effect for new customers immediately, and existing customers will see changes starting March 17, 2025. Small business customers are exempt from these pricing changes for now. Customers who previously purchased the Gemini for Workspace add-on will continue to have access to the features but will no longer be charged for the subscription after January 31. The latest update is part of a competitive push against Microsoft and other companies making the move to integrate AI capabilities into their standard offerings. In November, Microsoft bundled its Copilot Pro AI features with the standard Microsoft 365 subscription."
