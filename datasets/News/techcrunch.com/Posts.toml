["https://techcrunch.com/2025/01/17/instabase-raises-100m-to-help-companies-process-unstructured-document-data/"]
title = "Instabase raises $100M to help companies process unstructured document data"
description = "Instabase, a company that creates software for extracting and processing unstructured data from myriad document types, has raised $100 million in a Series D round of funding. The announcement comes as companies struggle under a deluge of data &#8212; data that can unlock key business insights. Indeed, most of the data that companies generate is [&hellip;]"
full_description = "Instabase, a company that creates software for extracting and processing unstructured data from myriad document types, has raised $100 million in a Series D round of funding. The announcement comes as companies struggle under a deluge of data &#8212; data that can unlock key business insights. Indeed, most of the data that companies generate is &#8220;unstructured,&#8221; that is, it doesn&#8217;t have any predefined labeling. This could be plain text contained within PDFs, image files, or emails. By deploying Instabase, businesses can extract, classify, and analyze data from any document, including to re-route correspondence to the right department, for example. They can also apply generative AI to this data, allowing anyone to ask questions or request summaries or insights from across their vast document stores. The San Francisco-based startup has amassed a number of high-profile customers since its inception in 2015, including Uber, NatWest, AXA, the United States Patent and Trademark Office (USPTO), and &#8220;four of the five largest U.S. banks.&#8221; Data extractionImage Credits:Instabase Historically, Instabase was one of numerous document processing automation companies that used more rules-based techniques to extract and process data. With the advent of the modern AI era, including natural language processing (NLP) and generative AI, such systems are capable of handling far more complex data types. &#8220;As we progress through the AI age, companies cannot realize their AI capabilities without first harnessing and learning from the unstructured data that lives within every organization,&#8221; Instabase founder and CEO Anant Bhardwaj (pictured above) said in a statement. Prior to now, Instabase had raised around $175 million in funding, including a $45 million Series C round in 2023 that valued the startup at $2 billion. Bloomberg reports that its valuation has slipped to $1.24 billion, signifying that the down round trend continues to prevail in 2025. Indeed, PitchBook data indicates that &#8220;flat&#8221; and down rounds for VC-backed companies constituted more than 28% of all deals in the first half of 2024, the highest percentage in a decade. Instabase&#8217;s Series D round was led by Qatar&#8217;s sovereign wealth fund, the Qatar Investment Authority (QIA), with participation from big-name existing investors, including Andreessen Horowitz, Greylock Partners, Index Ventures, and NEA."
