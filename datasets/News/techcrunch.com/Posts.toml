["https://techcrunch.com/2025/01/15/colossal-biosciences-raises-200m-at-10-2b-valuation-to-bring-back-woolly-mammoths/"]
title = "Colossal Biosciences raises $200M at $10.2B valuation to bring back woolly mammoths"
description = "Colossal Biosciences wants to bring back the woolly mammoth and has raised $200 million at a $10.2 billion valuation to do it."
full_description = "Colossal Biosciences, the company that&#8217;s famously on a mission to bring back the woolly mammoth and two other extinct species, has raised a $200 million Series C at a $10.2 billion valuation from TWG Global, the investment company of Guggenheim Partners co-founder Mark Walter and the billionaire Thomas Tull. The funding comes two years after the company closed its previous round at a reported valuation of $1.5 billion. Why did investors pour so much capital at an eye-popping valuation for a company that has yet to generate any revenue and whose flagship projects, resurrecting an extinct mammoth and Tasmanian tiger, are not expected to be completed until 2028? &#8220;The investor base has been very impressed with the speed at which we&#8217;ve created new technologies,&#8221; Ben Lamm, Colossal Biosciences&#8217; co-founder and CEO, told TechCrunch. The company claims it has made significant breakthroughs on all three of its main projects, which, in addition to the mammoth and the Tasmanian tiger (also known as the thylacine), includes the dodo bird, and is on schedule or even ahead of it to resurrect these animals. Colossal&#8217;s approach to bringing back extinct animals involves mapping the entire genome of the species and then comparing it to their closest living relative, which in the case of the mammoth is the Asian elephant. Lamm said this phase has been completed for the mammoth and the thylacine, and now the company&#8217;s scientists are using the gene-editing tool CRISPR to edit the Asian elephant&#8217;s cells. In the final step, those cells will be put into an egg cell, and the embryo will be implanted into an elephant, which will give birth to a baby mammoth, Lamm explained. To achieve its mission, Colossal has been building various technologies, including artificial wombs, which is how the company hopes future generations of &#8220;de-extinct&#8221; animals will be born. &#8220;Some of those technologies alone are world-changing for human healthcare, for agtech, for all these different categories,&#8221; he said. While Colossal Biosciences&#8217; ultimate goal is to restore extinct species and enhance biodiversity, the company&#8217;s primary value for investors likely lies in the potential of its technologies. Colossal plans to spin off three businesses over the next two years, one of which will be for its artificial womb technology, which could have applications in fertility treatment. The company has already spun out two businesses: One of these, Breaking, helps break down plastics and last year raised $10.5 million in seed funding, while the other is Form Bio, a computational biology platform, which secured $30 million in funding. Government collaborations are another potential source of revenue. While Colossal offers its conservation technology to governments at no cost, Lamm said some countries are asking Colossal for help with preserving endangered species. Some governments are also exploring de-extinction projects for animals that hold cultural and, in some instances, spiritual value for their people. If Colossal successfully resurrects and reintroduces any of the species into their respective ecosystems, the company anticipates generating revenue through the sale of biodiversity credits, a market-based mechanism similar to carbon credits. Lamm said all three of its revenue streams &#8212; the tech, government collaboration, and biodiversity credits &#8212; could bring in billions of dollars in annual recurring revenue, and they show the &#8220;short-term, the mid-term, the long-term economic&#8221; potential of the company."
