["https://techcrunch.com/2025/01/15/this-week-in-ai-will-bidens-ai-actions-survive-the-trump-era/"]
title = "This Week in AI: Will Biden&#8217;s AI actions survive the Trump era?"
description = "Hiya, folks, welcome to TechCrunch’s regular AI newsletter. If you want this in your inbox every Wednesday, sign up here. This week was something of a swan song for the Biden administration. On Monday, the White House announced sweeping new restrictions on exporting AI chips — restrictions that tech giants, including Nvidia, loudly criticized. (Nvidia&#8217;s business [&hellip;]"
full_description = "Hiya, folks, welcome to TechCrunch’s regular AI newsletter. If you want this in your inbox every Wednesday, sign up here. This week was something of a swan song for the Biden administration. On Monday, the White House announced sweeping new restrictions on exporting AI chips — restrictions that tech giants, including Nvidia, loudly criticized. (Nvidia&#8217;s business would be seriously affected by the restrictions, should they go into effect as proposed.) Then on Tuesday, the administration issued an executive order that opened up federal land to AI data centers. But the obvious question is, will the moves have a lasting impact? Will Trump, who takes office on January 20, simply roll back Biden&#8217;s enactments? So far, Trump hasn&#8217;t signaled his intentions either way. But he certainly has the power to undo Biden&#8217;s last AI acts. Biden&#8217;s export rules are scheduled to take effect after a 120-day comment period. The Trump administration will have broad leeway over how the measures are implemented — and whether to change them in any way. As for the executive order pertaining to federal land use, Trump could repeal it. Former PayPal COO David Sacks, Trump&#8217;s AI and crypto &#8220;czar,&#8221; recently committed to revoking another AI-related Biden executive order that set standards for AI safety and security. However, there&#8217;s reason to believe the incoming administration may not rock the boat too much. Along the lines of Biden&#8217;s move to free up federal resources for data centers, Trump recently promised expedited permits for companies that invest at least $1 billion in the U.S. He also picked Lee Zeldin, who has vowed to cut regulations he sees as burdensome to businesses, to lead the EPA. Aspects of Biden&#8217;s export rules could stand as well. Some of the regulations target China, and Trump has made no secret that he sees China as the U.S.&#8217; biggest rival in AI. One piece in question is Israel&#8217;s inclusion in the list of countries subjected to AI hardware trade caps. As recently as October, Trump described himself as a &#8220;protector&#8221; of Israel and has signaled that he&#8217;s likely to be more permissive toward Israel&#8217;s military actions in the region. In any event, we&#8217;ll have a clearer picture within the week. News Image Credits:Bryce Durbin / TechCrunch ChatGPT, remind me to…: Paying users of OpenAI’s ChatGPT can now ask the AI assistant to schedule reminders or recurring requests. The new beta feature, called Tasks, will start rolling out to ChatGPT Plus, Team, and Pro users around the globe this week. Meta versus OpenAI: Executives and researchers leading Meta’s AI efforts obsessed over beating OpenAI’s GPT-4 model while developing Meta&#8217;s own Llama 3 family of models, according to messages unsealed by a court on Tuesday. OpenAI&#8217;s board grows: OpenAI has appointed to its board of directors Adebayo &#8220;Bayo&#8221; Ogunlesi, an executive at investment firm BlackRock. The company&#8217;s current board bears little resemblance to OpenAI&#8217;s board in late 2023, the members of which fired CEO Sam Altman only to reinstate him days later. Blaize goes public: Blaize is set to become the first AI chip startup to go public in 2025. Founded by former Intel engineers in 2011, the company has raised $335 million from investors, including Samsung for its chips for cameras, drones, and other edge devices. A &#8220;reasoning&#8221; model that thinks in Chinese: OpenAI’s o1 AI reasoning model &#8220;thinks&#8221; in languages such as Chinese, French, Hindi, and Thai sometimes, even when asked a question in English — and no one really knows why. Research paper of the week A recent study co-authored by Dan Hendrycks, an adviser to billionaire Elon Musk&#8217;s AI company, xAI, suggests that many safety benchmarks for AI correlate with AI systems&#8217; capabilities. That is to say, as a system&#8217;s general performance improves, it &#8220;scores better&#8221; on benchmarks — making it appear as though the model is &#8220;safer.&#8221; &#8220;Our analysis reveals that many AI safety benchmarks — around half — often inadvertently capture latent factors closely tied to general capabilities and raw training compute,&#8221; the researchers behind the study write. &#8220;Overall, it is hard to avoid measuring upstream model capabilities in AI safety benchmarks.&#8221; In the study, the researchers propose what they describe as an empirical foundation for developing &#8220;more meaningful&#8221; safety metrics, which they hope will &#8220;[advance] the science&#8221; of safety evaluations in AI. Model of the week Sakana AI compares its new AI method to an octopus in its adaptability. Image Credits:Sakana AI In a technical paper published Tuesday, Japanese AI company Sakana AI detailed Transformer² (&#8220;Transformer-squared&#8221;), an AI system that dynamically adjusts to new tasks. Transformer² first analyzes a task — for example, writing code — to understand its requirements. Then it applies &#8220;task-specific adaptations&#8221; and optimizations to tune to that task. Sakana says the methods behind Transformer² can be applied to open models such as Meta&#8217;s Llama and that they offer &#8220;a glimpse into a future where AI models are no longer static.&#8221; Grab bag A flow chart showing PrAIvateSearch&#8217;s architecture. Image Credits:PrAIvateSearch A small team of developers has released an open alternative to AI-powered search engines like Perplexity and OpenAI&#8217;s SearchGPT. Called PrAIvateSearch, the project is available on GitHub under an MIT license, meaning that it can be used largely without restriction. It&#8217;s powered by openly available AI models and services, including Alibaba&#8217;s Qwen family of models and the search engine DuckDuckGo. The PrAIvateSearch team says that its goal is to &#8220;implement similar features to SearchGPT,&#8221; but in an &#8220;open source, local, and private way.&#8221; For tips to get it up and running, check out the team&#8217;s latest blog post."
