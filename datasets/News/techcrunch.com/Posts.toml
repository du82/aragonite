["https://techcrunch.com/2025/01/17/openai-is-trying-to-extend-human-life-with-help-from-a-longevity-startup/"]
title = "OpenAI is trying to extend human life, with help from a longevity startup"
description = "OpenAI says it trained a new AI model called GPT-4b micro with Retro Biosciences, a longevity science startup trying to extend the human lifespan by 10 years, according to the MIT Technology Review. Retro, which is backed by Sam Altman, has been working with OpenAI for roughly a year on this research, according to the [&hellip;]"
full_description = "OpenAI says it trained a new AI model called GPT-4b micro with Retro Biosciences, a longevity science startup trying to extend the human lifespan by 10 years, according to the MIT Technology Review. Retro, which is backed by Sam Altman, has been working with OpenAI for roughly a year on this research, according to the report. The GPT-4b micro model tries to re-engineer proteins &#8212; a specific set called the Yamanaka factors &#8212; that can turn human skin cells into young-seeming stem cells. Retro believes these proteins are a promising step toward building human organs and providing supplies of replacement cells. The model differs slightly from Google&#8217;s Nobel prize-winning AlphaFold, which predicts the shape of proteins, but it appears to be OpenAI&#8217;s first model that is custom-built for biological research. OpenAI and Retro tell the MIT Technology Review they plan to release research on the model and its outputs."
