["https://techcrunch.com/2025/01/15/unitedhealth-hid-its-change-healthcare-data-breach-notice-for-months/"]
title = "UnitedHealth hid its Change Healthcare data breach notice for months"
description = "The ransomware attack on Change Healthcare affected over 100 million Americans, the health giant told regulators."
full_description = "Change Healthcare, the UnitedHealth-owned health tech company that lost more than 100 million people&#8217;s sensitive health data in a ransomware attack last year, said on Tuesday that the company has &#8220;substantially&#8221; completed notifying affected individuals about the massive data breach. The February 2024 ransomware attack on Change Healthcare, one of the biggest processors of patient billing in the United States, resulted in months-long outages that disrupted care across the U.S. healthcare system. The data breach also became the largest known theft of medical data in U.S. history. Change Healthcare paid the hackers a ransom with the aim of preventing them from publishing any more of the stolen data, and in exchange, obtained a copy of the stolen data to begin notifying people whose information was taken. In an update to its data breach notice on its website on Tuesday, Change Healthcare said it has &#8220;notified its impacted customers&#8221; for whom the company has a postal address on file. The healthcare giant said it &#8220;may not have sufficient addresses for all potentially impacted individuals,&#8221; and that the website notice was to &#8220;provide customers and individuals with information about the criminal cyberattack.&#8221; But if you search the web for the Change Healthcare data breach notice, you&#8217;re unlikely to find the web page in search engine results. TechCrunch&#8217;s review of the breach notice&#8217;s web page source code reveals Change Healthcare included hidden “noindex” code on the notice, which tells search engines to ignore the web page, making it more difficult for anyone searching the web for the notice to find it in search results. Change Healthcare had been including the &#8220;noindex&#8221; code on its data breach notice since at least November 20, 2024. It&#8217;s unclear why Change Healthcare hid the page from search engines. UnitedHealth spokesperson Tyler Mason did not comment on the reason why Change Healthcare included the code to hide the data breach notice. When asked, the spokesperson was unable to provide a specific number of individuals that Change Healthcare had notified of the breach beyond the estimated 100 million number shared with the U.S. government&#8217;s health department in October 2024. A spokesperson for the Department of Health and Human Services&#8217; Office for Civil Rights, which oversees federal investigations of data breaches involving protected health information, did not respond to a request for comment on the matter. Change Healthcare has been criticized for being slow to notify affected individuals of the breach — the company only started to do so four months after it had received a copy of the stolen files. The delay in public disclosure prompted several U.S. states, including California, Massachusetts, Nebraska and New Hampshire, to intervene by notifying residents to stay alert to identity theft and fraud following the data breach.  In December 2024, Nebraska brought legal action against Change Healthcare for a string of security failings that led to the breach. The state&#8217;s attorney general, Mike Hilgers, said Change Healthcare&#8217;s lack of adequate notice to affected individuals left the state&#8217;s citizens &#8220;more vulnerable to exploitation of the sensitive personal financial, health, and identifying information.&#8221; Corrected link to California&#8217;s notice in eighth paragraph."
