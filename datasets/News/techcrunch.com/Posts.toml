["https://techcrunch.com/2025/01/16/new-york-powerhouse-vc-insight-partners-nabs-another-12-5b-after-8b-in-exits/"]
title = "New York powerhouse VC Insight Partners nabs another $12.5B after $8B in exits"
description = "Insight Partners closed another giant flagship fund after big returns in 2024."
full_description = "Jeff Horing&#8217;s Insight Partners is to New York venture capital what Andreessen Horowitz and Sequoia are to Silicon Valley. And it&#8217;s a status that has been cemented with Insight&#8217;s latest closing. As expected, Insight Partners announced Thursday that it closed another giant flagship fund, known as Fund XIII, along with its second Opportunity fund, collectively $12.5 billion in new capital. An opportunity fund is generally money set aside to reinvest in existing portfolio companies when they raise new rounds. In September, it was rumored to be working on a $10 billion-plus fund. Insight clearly achieved that target, and then some. With this fund it now has $90 billion of assets under management. An Insight spokesperson declined to divulge how many billions are in each new fund but part of the money is also in what it calls a &#8220;dedicated buyout co-invest fund.&#8221; The spokesperson said this money will be used for buyout software investments, an established area for the 30-year-old firm. This raise signals that Insight has no intention of ceding the top dog spot to upstart New York powerhouse VC, Thrive. In 2024, Josh Kushner&#8217;s Thrive led and co-led many of the biggest deals from OpenAI&#8217;s $6.6 billion round to the $100 million Series B of Anysphere, the maker of AI coding assistant Cursor. Insight isn&#8217;t ceding any ground. For instance, the VC firm won the co-lead of Databricks&#8217; record-breaking $10 billion fundraising deal in December, alongside Thrive. It tapped into funds from its Partners Public Equities fund to do so, a fund set up to buy public stocks. This fresh capital will help it pursue, perhaps even lead, more deals. Interestingly, in a year where the locked IPO market means lagging returns for many VCs, Insight said it did well with its portfolio companies logging over $8 billion on exits in 2024, largely through acquisitions. These included Recorded Future to Mastercard for $2.65 billion, Own to Salesforce for $1.9 billion, WalkMe to SAP for $1.5 billion, and Jama Software to private equity for $1.2 billion."
