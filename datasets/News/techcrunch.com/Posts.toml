["https://techcrunch.com/2025/01/17/perplexity-acquires-read-cv-a-social-media-platform-for-professionals/"]
title = "Perplexity acquires Read.cv, a social media platform for professionals"
description = "Read.cv, a social media platform for professionals that competed with LinkedIn, has been acquired by AI-powered search engine Perplexity. As part of the deal, Read.cv will begin to wind down operations Friday. Users will be able to export their data, including their profiles, posts, and messages, until May 16. &#8220;We&#8217;ve long admired Perplexity and believe [&hellip;]"
full_description = "Read.cv, a social media platform for professionals that competed with LinkedIn, has been acquired by AI-powered search engine Perplexity. As part of the deal, Read.cv will begin to wind down operations Friday. Users will be able to export their data, including their profiles, posts, and messages, until May 16. &#8220;We&#8217;ve long admired Perplexity and believe great things happen when the world&#8217;s knowledge is made more open and accessible,&#8221; reads a post on Read.cv&#8217;s blog. &#8220;In that spirit, we are thrilled to be joining the design and engineering team at Perplexity to continue in our shared mission of exploration and discovery.&#8221; Today I’m excited to share that @read_cv is joining the team at @perplexity_ai in their mission to make the world&#8217;s knowledge more accessible to everyone. This is incredibly bittersweet for us, as the start of this new chapter will mark the end of our time with @read_cv. It has… pic.twitter.com/6CUinOEGsi — andy chung (@_andychung) January 17, 2025 A Perplexity spokesperson confirmed the acquisition to TechCrunch via email, but provided no additional details. &#8220;We&#8217;re excited to have the Read.cv team join Perplexity,&#8221; Perplexity CEO Aravind Srinivas wrote in a post on X. &#8220;The team is incredibly capable in designing and building consumer and social experiences and we look forward to working with them on many new exciting directions!&#8221; Read.cv, which was founded in 2021 by Andy Chung, previously a product designer at Facebook, Mozilla, and Salesforce-owned Quip, offered a range of tools that let users share their resumes and chat with other professionals in their industries. Read.cv also offered capabilities aimed at organizations, like team profiles and the ability to post job listings and perform candidate searches. More recently, Read.cv launched Sites, a feature that allowed users to publish a personal website using their Read.cv profile. Users could even obtain a &#8220;.cv&#8221; domain from Read.cv and connect it to their profile, if they wanted. Read.cv says it plans to migrate &#8220;.cv&#8221; domains starting January 31 to its partners at Hello.cv, where users will be able to continue managing them. Read.cv&#8217;s feed, where users could share their profiles, posts, and job listings. Image Credits:Read.cv Perplexity&#8217;s plans for West Berkeley-based Read.cv, which had around three employees and was backed by funding from F7 Ventures and Fanjul Capital, aren&#8217;t clear. But Perplexity has increasingly invested in corporate-focused functionality, last summer launching an enterprise plan with user management, &#8220;internal knowledge search,&#8221; and more. The moves could be in part at the behest of the VCs backing Perplexity, who are no doubt eager to see a return sooner than later. Perplexity has reportedly raised over $500 million in capital from investors, including Institutional Venture Partners, and is said to be valued at $9 billion. Read.cv is Perplexity&#8217;s third acquisition following its purchase of Carbon, which specializes in connecting AI systems to external data sources. In 2023, Perplexity acquired Spellwise, whose CEO was brought on to develop Perplexity’s mobile app. TechCrunch has an AI-focused newsletter! Sign up here to get it in your inbox every Wednesday."
