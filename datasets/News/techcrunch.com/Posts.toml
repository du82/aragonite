["https://techcrunch.com/2025/01/17/google-begins-requiring-javascript-for-google-search/"]
title = "Google begins requiring JavaScript for Google Search"
description = "Google says it has begun requiring users to turn on JavaScript, the widely used programming language to make web pages interactive, in order to use Google Search. In an email to TechCrunch, a company spokesperson claimed that the change is intended to &#8220;better protect&#8221; Google Search against malicious activity, such as bots and spam, and [&hellip;]"
full_description = "Google says it has begun requiring users to turn on JavaScript, the widely used programming language to make web pages interactive, in order to use Google Search. In an email to TechCrunch, a company spokesperson claimed that the change is intended to &#8220;better protect&#8221; Google Search against malicious activity, such as bots and spam, and to improve the overall Google Search experience for users. The spokesperson noted that, without JavaScript, many Google Search features won&#8217;t work properly and that the quality of search results tends to be degraded. &#8220;Enabling JavaScript allows us to better protect our services and users from bots and evolving forms of abuse and spam,&#8221; the spokesperson told TechCrunch, &#8220;and to provide the most relevant and up-to-date information.&#8221; Many major websites rely on JavaScript. According to a 2020 GitHub survey, 95% of sites around the web employ the language in some form. But as users on social media point out, Google&#8217;s decision to require it could add friction for those who rely on accessibility tools, which can struggle with certain JavaScript implementations. JavaScript is also prone to security vulnerabilities. In its 2024 annual security survey, tech company Datadog found that around 70% of JavaScript services are vulnerable to one or more &#8220;critical&#8221; or &#8220;high-severity&#8221; vulnerabilities introduced by a third-party software library. The Google spokesperson told TechCrunch that, on average, &#8220;fewer than .1%&#8221; of searches on Google are done by people who disable JavaScript. That&#8217;s no small number at Google scale. Google processes around 8.5 billion searches per day, so one can assume that millions of people performing searches through Google aren&#8217;t using JavaScript. One of Google&#8217;s motivations here may be inhibiting third-party tools that give insights into Google Search trends and traffic. According to a post on Search Engine Roundtable on Friday, a number of &#8220;rank-checking&#8221; tools — tools that indicate how websites are performing in search engines — began experiencing issues with Google Search around the time Google&#8217;s JavaScript requirement came into force. The Google spokesperson declined to comment on Search Engine Roundtable&#8217;s reporting."
