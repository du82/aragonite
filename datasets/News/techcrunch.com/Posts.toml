["https://techcrunch.com/2025/01/17/as-tiktok-faces-a-us-shutdown-here-are-some-alternative-apps-to-check-out/"]
title = "As TikTok faces a US shutdown, here are some alternative apps to check out"
description = "TikTok has warned of a looming shutdown in just six days, as the Supreme Court is currently weighing the law that would ban the app. So we thought it&#8217;s time to take a look at other platforms that may be able to fill the TikTok-shaped hole in our lives. The law gives TikTok parent company [&hellip;]"
full_description = "TikTok has warned of a looming shutdown in just six days, as the Supreme Court is currently weighing the law that would ban the app. So we thought it&#8217;s time to take a look at other platforms that may be able to fill the TikTok-shaped hole in our lives. The law gives TikTok parent company ByteDance until January 19 to divest its U.S. operations or face a ban in the country. TikTok is hoping for a pause to the law, but if that doesn’t happen, the app will effectively be banned in the country. There’s no 1:1 TikTok replacement, but there are some viable options to consider that offer a similar experience. Many companies have spent the last few years building out TikTok clones within their own products, and several newer companies have looked to challenge the app’s dominance. Here’s a look at the different apps that are worth checking out: Instagram Reels Image Credits:Meta Instagram’s Reels product is arguably the most popular TikTok clone, and for good reason. Many of the videos are the same, as creators often share the same content that they post on TikTok to Instagram Reels. Plus, a lot of the trending sounds and topics on TikTok eventually make their way over to Instagram Reels. Because a lot of the content is the same, Instagram Reels might be the best option for a TikTok alternative. However, given that TikTok’s algorithm is largely unmatched, Instagram Reels might not be able to surface videos you’re interested in on the same level that TikTok can. But, Instagram has spent the past few years enhancing the Reels recommendation algorithm, so we can probably expect it to get even better over time. If a TikTok ban becomes a reality, Instagram Reels might become the most popular home for short-form video content because it already largely dominates the social media landscape and has most of the same people and types of content as TikTok. YouTube Shorts Image Credits:YouTube YouTube is another platform that has been building out and prioritizing its TikTok-like product. YouTube Shorts might be the best TikTok alternative for you if you’re someone who already spends a lot of time on YouTube, or likes to find new music on TikTok, given that YouTube Shorts has access to YouTube’s vast library of songs and music videos. YouTube Shorts has an advantage that other services on this list don’t, which is an integration with a popular long-form video content platform. Millions of people around the world already go to YouTube every day to watch content, so if TikTok were to get banned, YouTube has the potential to become the go-to place for short-form content as well, especially if popular TikTok creators choose it as the new home of their content. Unfortunately, the content on YouTube Shorts often isn’t as engaging as it can be on platforms like TikTok or Instagram Reels, as it sometimes features content that has been reposted from longer YouTube videos. Still, you could search for content that you want to see and find videos based on hashtags or keywords. Snapchat Spotlight Image Credits:Snapchat Snapchat’s Spotlight feed is another viable TikTok alternative if you’re looking for short and entertaining content. Unlike TikTok and Instagram Reels, Spotlight generally only surfaces funny and lighthearted videos. You likely won’t find political or news content on the feed, which could be a selling point for some users. Spotlight features a trending section where you can watch popular videos based on different topics and songs that are having a moment. Similar to TikTok and Instagram Reels, you can search for content based on keywords and hashtags. However, one of the biggest cons when it comes to Snapchat Spotlight is that it has struggled to go beyond its younger users. Given that adults are more likely to use a platform like TikTok or Instagram Reels, you might not find the content on Spotlight as engaging because it mostly caters to younger audiences. Triller Image Credits:Triller Triller, which started off as a TikTok competitor, could be a good alternative for people who are mainly interested in the music and dance aspects of TikTok. It’s worth noting that Triller has a much smaller user base than TikTok, so content is somewhat limited. Triller is already looking to take advantage of the potential TikTok ban in the U.S. The company recently launched a website, SaveMyTikToks.com, to allow TikTok users to save their TikTok videos by transferring them to Triller’s platform, encouraging creators to migrate their content to its app. Plus, Triller recently hired ex-TikTok exec Sean Kim as its CEO to focus on an overhaul of the app. Kim previously served as TikTok’s head of product from 2019 to 2022, working on things like its “For You” feed, creator monetization, the developer platform, third-party integrations, and more. Triller’s addition of one of TikTok’s top talents could help the platform build out its service to be a better-positioned TikTok alternative. RedNote Image Credits:RedNote TikTok users in the U.S. are already flocking to Chinese short-form video app Xiaohongshu (known as RedNote in English). Launched in 2013, the app is China’s answer to Instagram. The app features a layout that’s similar to Pinterest’s and boasts a number of social shopping features. It provides users with a mix of video and livestreaming features. RedNote includes a lot of the sort of content you see on TikTok, like beauty tutorials and product reviews. It’s not clear whether RedNote will sustain the interest it’s getting right now. It&#8217;s also not clear whether the U.S. government will want to crack down on the app due to its Chinese ownership if it’s able to get a significant American user base. Lemon8 Image Credits:ByteDance In the months leading up to the TikTok ban deadline, the company has been promoting its sister app, Lemon8. TikTok also recently started allowing users to access Lemon8 with their TikTok account. The app is similar to Instagram and Pinterest, as it lets people share slideshows, photo collections, and browse content through “Following” and “For You” feeds. Lemon8 offers access to creative tools, filters, effects, stickers, text templates, and more. However, it’s worth noting that Lemon8 could get tangled up in the TikTok ban, especially since lawmakers’ main concern with TikTok is its Chinese ownership. As a result, Lemon8’s presence in the U.S. remains unclear. Likee Image Credits:Likee Likee is a short-form video app that, alongside the ability to share videos, features editing tools and livestreams. The app boasts over 100 million users from all around the world. Likee is big on AR filters, similar to Snapchat&#8217;s, and lets creators use them in their videos and livestreams. Likee also features an extensive music library, so it could be good for people who use TikTok to find new music. In addition, the app has monetization features that allow creators to earn money for their content through SuperLikes from their followers. However, as with the other smaller apps on this list, engagement on Likee is somewhat limited since it doesn’t have the same amount of reach as TikTok. Of course, that could change over time. Fanbase Image Credits:Fanbase Fanbase is a subscription-based social network that is essentially a combination of TikTok, Instagram, Patreon, Clubhouse, and Snapchat. The app features short-form videos, images, long-form videos, Stories, livestreams, and audio rooms. While the app is free to use, you can pay a subscription to get access to exclusive content. What makes Fanbase a possible alternative to TikTok is the app’s &#8220;Flickz&#8221; feed. Like TikTok, Flickz includes a feed for discovery and another feed dedicated to content from creators you follow. You can find all sorts of content on Fanbase, including videos on sports, cooking, music, humor, and more. The app was founded with the mission of valuing and platforming Black creators, whose content is often appropriated or undervalued on traditional social media platforms. Fanbase is an ad-free platform that promises to never shadowban or suppress content. Zigazoo Image Credits:Zigazoo Zigazoo is a relatively new short-form video platform aimed at young users and could be a good TikTok alternative for kids and teens. The app features lighthearted and playful videos and is considered a safer alternative to TikTok, as it doesn’t have a comments feature and has strict moderation policies. The app lets users browse through or create short videos based on challenges or educational prompts. Zigazoo also features fun dancing videos, which is one of TikTok’s most popular content categories. Like TikTok and Instagram Reels, the app includes different effects, sounds, and filters for video. While the app isn’t a TikTok replacement for adults, it’s a great alternative for younger users, especially those with parents who are concerned about TikTok’s potential harm to kids and teens. Favorited Image Credits:Favorited Favorited is an a16z-backed social app that gamifies livestreaming. The app lets livestream creators interact with their audiences and earn money through virtual gifts from viewers. The app also features a 70/30 revenue split for creators, whereas TikTok has a 50/50 split for live creators. Favorited also lets creators link their digital stores. However, unlike TikTok, Favorited doesn’t feature a discovery feed to help people find new content. The app has 750,000 users so far this year and is seeing thousands of new signups per day. Unfortunately, the app doesn’t have much of a presence outside of the U.S., but of course, that could change. Clapper Image Credits:Clapper Clapper is a short-form adults-only app that champions authentic expression and unfiltered interactions. The app has a 17+ audience policy and is known for having limited moderation, which may not be for everyone. Clapper lets you post videos that are up to three minutes long. The app features an audio-only feature that allows users to create a room with up to 2,000 listeners with 20 speakers. Plus, creators can create communities where they can interact with their followers one-on-one. The app is ad-free and is more focused on unfiltered content, rather than polished content that is designed to go viral. It includes some video editing features, but they are quite limited when compared to what’s available on TikTok. And, of course, the app’s user base is quite small, so there is somewhat limited social interaction. Fable Image Credits:Fable Fable is a good app for TikTok users who are part of the social network’s reading-focused BookTok community. The app features book clubs where people can discuss the books they’re reading, kind of like they would on TikTok. Unfortunately, Fable lacks the video aspect, so it’s nowhere near a complete TikTok alternative. Instead, it could provide a way for BookTok creators and members of the community to continue their discussions on another platform. Flip Image Credits:Flip Flip is a shopping-focused short-form video app that could be a great platform for people who are fans of TikTok’s ecommerce offerings like TikTok Shop. The app lets users create and monetize their own product reviews, and viewers can purchase the products they see in videos directly within the app. The app lets every shopper become a creator on the social network, as they can share their honest reviews and then earn cash based on the engagement and sales their content generates. Loops Image Credits:Loops (opens in a new window) Loops is an upcoming short-form video app that is part of the fediverse, which is a network of decentralized social media platforms. It&#8217;s designed to be a privacy-focused alternative to TikTok. The app is available in beta via Apple’s TestFlight platform. Loops is pretty similar to TikTok, as it will allow users to share, comment on, and post short videos. Plus, Loops claims it will not sell or provide user data to third-party advertisers or use uploaded content to train AI models. Since the app will be a part of the federated web, remote users from other platforms like Mastodon and Pixelfed will also be able to follow users’ Loops accounts. These remote followers will also be able to like, comment on, or share videos if their platform supports it. Neptune Image Credits:Neptune Nepture is an upcoming female-founded social network that promises to put content creators first. The app has started to get buzz on social networks like TikTok and X by users who are wondering if it could become the next TikTok. Their hopes aren’t random, as Neptune’s marketing strategy frames the app as a TikTok alternative, but better. The beta version of the app is expected to be released either this month or in February. The public release for the app is expected in the spring. The company says that on Neptune, a creator’s content will get seen not because of an algorithm but because of its quality and impact. The app is also going to feature customizable content feeds and ghost metrics, which would allow users to try out new ideas without worrying about the pressure to perform. Tome Image Credits:Tome Tome is an upcoming iOS platform that could be a great option for people who are part of TikTok’s BookTok community. The app will launch on January 28, and is being advertised as a place to share everything from memes, to fan art, to book recommendations. Tome will feature a Tumblr-like feed that will show content from people you follow, as the app doesn&#8217;t use an algorithm to influence the content you see. The app is expected to be a place for people to find other readers and creators with similar interests to chat about favorite books. Tome says it won’t use user data for ads and that users’ fan art and content won’t be used to train AI. ReelShort Image Credits:ReelShort ReelShort is a short movie platform that offers access to exclusive vertical TV miniseries.The app is good for fans of TikTok because it offers short, engaging videos. It features new TV miniseries added daily, with hundreds of new episodes each month. Of course, ReelShort isn’t a direct TikTok competitor because it features scripted shows, unlike videos from regular people who are just sharing their lives and experiences on social media. Faves Image Credits:Faves Faves is an app that lets people organize videos in one place to view them at a later time without clogging up a device’s storage space. When a video is saved on Faves, it’s automatically stored on the cloud. While Faves isn’t a social network, people are using it to save all of their favorite TikTok videos so they don’t lose access to them. For instance, you could download all of your favorite TikTok recipes to ensure they&#8217;re safe if TikTok gets banned. Bluesky Image Credits:Bluesky While decentralized social network Bluesky isn’t a TikTok competitor, it’s worth checking out because it gives users more control over their data and experience. The app is a great alternative for people who want to use something other than Meta’s Instagram and Threads. Similar to X, Bluesky lets you share text, videos, and photo posts. Blueksy also lets you create and join custom feeds based on your interests."
