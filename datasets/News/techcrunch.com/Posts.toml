["https://techcrunch.com/2025/01/17/tiktok-ceo-responds-to-trump-thanks-him-for-trying-to-solve-us-ban/"]
title = "TikTok CEO responds to Trump, thanks him for trying to solve US ban "
description = "TikTok CEO Shou Zi Chew responded to comments made by Donald Trump regarding Friday&#8217;s Supreme Court ruling to ban the app in the U.S. In a video posted on TikTok, Chew said, “On behalf of everyone at TikTok and all our users across the country, I want to thank President Trump for his commitment to [&hellip;]"
full_description = "TikTok CEO Shou Zi Chew responded to comments made by Donald Trump regarding Friday&#8217;s Supreme Court ruling to ban the app in the U.S. In a video posted on TikTok, Chew said, “On behalf of everyone at TikTok and all our users across the country, I want to thank President Trump for his commitment to work with us to find a solution that keeps TikTok available in the United States. This is a strong stand for the First Amendment and against arbitrary censorship.”  TikTok appears to be relying on support from Trump to maintain the legality of the Chinese-owned platform in the United States. Trump clearly wants everyone to see him as TikTok&#8217;s savior, posting on Truth Social that he is in talks with China’s President Xi Jinping about finding a way to save the platform. “We are grateful and pleased to have the support of a president who truly understands our platform, one who has used TikTok to express his own thoughts and perspectives, connecting with the world and generating more than 60 billion views of his content in the process,” Chew continued. “Rest assured, we will do everything in our power to ensure our platform thrives … More to come.” Earlier Friday, the Supreme Court ruled that the TikTok ban would go through. Currently, it’s uncertain whether TikTok will disable the app for users in the U.S. this Sunday or if the app plans to wait and see if the Trump administration can negotiate a resolution. In the meantime, here are some TikTok alternatives for you to check out. @tiktok Our response to the Supreme Court decision. ♬ original sound &#8211; TikTok"
