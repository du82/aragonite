["https://techcrunch.com/2025/01/15/microsofts-newest-copilot-plan-for-business-is-pay-as-you-go/"]
title = "Microsoft&#8217;s newest Copilot plan for business is pay-as-you-go"
description = "Microsoft is launching a pay-as-you-go plan for corporate customers that bundles several, but not all, of the company&#8217;s existing AI-powered productivity features for Microsoft 365. The new plan, Copilot Chat &#8212; not to be confused with Microsoft&#8217;s Copilot Business Chat or GitHub Copilot Chat &#8212; is underpinned by OpenAI&#8217;s GPT-4o AI model and lets users [&hellip;]"
full_description = "Microsoft is launching a pay-as-you-go plan for corporate customers that bundles several, but not all, of the company&#8217;s existing AI-powered productivity features for Microsoft 365. The new plan, Copilot Chat &#8212; not to be confused with Microsoft&#8217;s Copilot Business Chat or GitHub Copilot Chat &#8212; is underpinned by OpenAI&#8217;s GPT-4o AI model and lets users ask business-related questions, build workflow automations, generate images, and more. All of these capabilities were a part of Microsoft 365 Copilot, Microsoft&#8217;s sprawling enterprise AI add-on for Microsoft 365. But pricing for Microsoft 365 Copilot is more rigid. A license costs $30 per user per month. &#8220;Copilot Chat &#8230; adds pay-as-you-go [services] to our existing free chat experience for Microsoft 365 commercial customers,&#8221; Microsoft said in a blog post published Wednesday. &#8220;Copilot Chat is a powerful new on-ramp for everyone in [an] organization to build the AI habit.&#8221; Microsoft&#8217;s Copilot Chat plan compared to Microsoft 365 Copilot. Image Credits:Microsoft Copilot Chat&#8217;s features live in the Microsoft 365 Copilot app, a rebranding of the Microsoft 365 app. From the app, users can ask Copilot, Microsoft&#8217;s chatbot experience on top of GPT-4o, to summarize key points in an uploaded file, draft a work document, or create an AI-generated image. Or, they can collaborate on a project with teammates and AI via the built-in Copilot Pages tool. Microsoft is particularly touting Copilot Chat&#8217;s task automation features, which it describes as &#8220;agentic.&#8221; Using the Microsoft 365 Copilot app, Copilot Chat users can launch &#8220;agents&#8221; to automate basic tasks, like giving account details before a sales meeting, or delivering instructions to a field service worker. IT admins can build org-wide agents and manage their deployment, as well as govern the access and security of individual agents. Agents will be priced on a &#8220;metered basis,&#8221; Microsoft told TechCrunch. It didn&#8217;t reveal more; we&#8217;ve reached out to the company for detailed pricing information and will update this article if we hear back. The Copilot Chat plan lacks many of the features in Microsoft 365 Copilot, including prebuilt agents and AI-powered capabilities for Microsoft Teams, Outlook, Word, Excel, and PowerPoint. Copilot Chat users also don&#8217;t get the personalization options available to Microsoft 365 Copilot subscribers, nor do they get Microsoft&#8217;s recently introduced Copilot Analytics tool to measure company-wide AI usage. It seems fairly clear that Copilot Chat is Microsoft&#8217;s attempt to convince holdouts to pull the trigger on Microsoft 365 Copilot by dangling metered agentic features, while at the same time extracting incremental revenue from customers with less complex AI requirements. Microsoft 365 Copilot hasn&#8217;t been a home run for the tech giant. According to Business Insider, Copilot, which Microsoft claims is being used by nearly 70% of Fortune 500 companies, is proving to be inefficient, costly, and insecure for many organizations. Per a recent Gartner survey, only 3.3% of IT leaders said that Copilot has provided significant value to their employers. In an internal memo this week, Microsoft CEO Satya Nadella said that the company&#8217;s focus in 2025 will be &#8220;[AI] model-forward applications&#8221; that &#8220;reshape all application categories.&#8221; &#8220;We have a lot of work to do and a tremendous opportunity ahead,&#8221; Nadella wrote. &#8220;The good news is that we have been working at this for more than two years, and have learned a lot in terms of the systems, app platform, and tools required for the AI era.&#8221;"
