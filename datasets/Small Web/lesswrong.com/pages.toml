["https://lesswrong.com/users/saidachmiz"]
title = "Said Achmiz - LessWrong"
description = "Said Achmiz's profile on LessWrong — A community blog devoted to refining the art of rationality"
full_description = "Or, phrased slightly differently: verbal thinking increases the surface area through which you can get hacked. This doesn’t seem quite right, because it is also possible to have an unconscious or un-verbalized sense that, e.g., you’re not supposed to “discriminate” against “religions”, or that “authority” is bad and any rebellion against “authority” is good, etc. If bringing such attitudes to conscious awareness and verbalizing them allows you to examine and discard them, have you excised a vulnerability or installed one? Not clear. As with any expertise, the standard heuristic is “if you can’t do it in-house, outsource it”. In this case, that means “if you have a trusted friend who does ‘get vibes’, consult with them when in doubt (or even when not in doubt, for the avoidance thereof)”. Of course, the other standard heuristic is “it takes expertise to recognize expertise”, so finding a sufficiently trusted friend to consult on such things may be difficult, if you do not already have any such. Likewise, principal-agent problems apply (although sufficiently close friends should be as close to perfect alignment with the principal as any agent can realistically get). Solution seems obvious: do not attempt to correct for potential prejudice. If you consider the prejudice itself to be a problem (and that’s a reasonable view), then work to eliminate the prejudice. (The best and most reliable way is to get to know more people of the given category.) But regardless of whether you have already succeeded in this, don’t override your judgment (whether based on “vibes” or on anything else) on the basis of “well I have a prejudice that might be contributing to this”. These mitigations would do nothing against a lot of real relationship failures. Imagine that everything goes swimmingly for the first year. OP talked about someone asking you on a date. The suggested strategy was about mitigating problems that might be encountered when going on a date. An analogous strategy for a long-term relationship might be something like “establish boundaries, ensure that the relationship does not crowd out contact with your friends, regularly check in with friends/family, talk to trusted confidantes about problems in the relationship to get a third-party opinion”, etc. “This solution to problem X doesn’t also solve problem Y” is not a strike against said solution. P.S.: The anecdotes are useful, but “data” is one thing they definitely aren’t."
