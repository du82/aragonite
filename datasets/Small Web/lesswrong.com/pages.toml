description = "Mbp's profile on LessWrong — A community blog devoted to refining the art of rationality"
full_description = "My head started spinning. I probably would have included information on the audience you were impressing. The conundrum (wicked problem) is that what you wanted to write (truth) is not what donors want to read. Donors sometimes skim through mission statements and it’s now political and who you are connected with. Brands donate as a form of marketing to promote sales. Who is the biggest trophy for our BD and stakeholders. The orgs who need it the most are putting up turbines in Africa and lack the resources to dedicate one grant writing professional on staff. A true philanthropist would already know this. Is there a LessWrong for dummies? How do humans with this level of intelligence engage in typical human relationships. So many less intelligent humans have superior insight based on simplistic common sense often overlooked by over analyzing. I’m a MoreRight mindset over a LessWrong. Another site named WrongPlanet had snippets aligned to earlier theoretical AI and most contributors labeled themselves AS. I love an AS higher intelligence mindset but so much is lacking in the design of AI when significant ‘typical’ contributions are necessary for sustainable design to integrate in typical human life. AI, if taken to a next level of basic old brain underlying the high functioning new brain 🧠 and designed to replicate personality and physical traits would be a goal."
