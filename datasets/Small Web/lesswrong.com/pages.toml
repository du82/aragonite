full_description = "14orthonormalThe LW team is encouraging authors to review their own posts, so: In retrospect, I think this post set out to do a small thing, and did it well. This isn't a grand concept or a vast inferential distance, it's just a reframe that I think is valuable for many people to try for themselves. I still bring up this concept quite a lot when I'm trying to help people through their psychological troubles, and when I'm reflecting on my own. I don't know whether the post belongs in the Best of 2018, but I'm proud of it. The LW team is encouraging authors to review their own posts, so: In retrospect, I think this post set out to do a small thing, and did it well. This isn't a grand concept or a vast inferential distance, it's just a reframe that I think is valuable for many people to try for themselves. I still bring up this concept quite a lot when I'm trying to help people through their psychological troubles, and when I'm reflecting on my own. I don't know whether the post belongs in the Best of 2018, but I'm proud of it."
