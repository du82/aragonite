title = "pom - LessWrong"
description = "pom's profile on LessWrong — A community blog devoted to refining the art of rationality"
full_description = '''You wouldn’t take irreversible actions if you didn’t know what the fuck you were doing.I would add for clarity "...if you knew you didn't know...." [edit:] did not realize this reaction would take the form of a separate comment, ah well serves the same function I guess. The premise seems like a hard ask, though if we assume precise control over all shapes on all 'observable' levels, I feel there is always background noise, radiation of different kinds, so when you are not in the same position there will be slightly different values reaching you.[edit: so when this reaches biological systems it will always affect them slightly. So you could probably just sit there, only if we are looking for an observable threshold you might be there a while depending on levels] I am slightly intrigued by this game, as it seems to look like how I approach things in general when I have enough time and information to do so. Just an interesting aside, I like that people are also doing these kinds of things after all, or at least attempting to. As I am by no means "successful" with my method, it does seem to be the only way I can get myself to undertake something when it is important to me that I could at least have a somewhat realistic chance at succeeding. I could also delete my other comment, though I thought to retract would also mean deletion, but whatever. If no one is interested I will not expend any effort to try and "fix" some perceived "flaws", as I am aware of my own subjectiveness, of course. It is clear that this type of "train of thought" is unwanted here, so slightly disappointed I will take my leave. [edit] Maybe I overreacted with my previous statement, though putting a not insignificant amount of time into trying to explain some intricate points does feel bad when you are met with silence. [edit#2] The idea of this 2nd post on the topic was supposed to 'land' on the observation that when we have a tangled web of knowledge available to try and make sense of 'unforeseen' (technically since we can't "know" until it happens and what form it might take)/novel conditions such as an AGI, we might be able to assume this suboptimal organization is only disadvantageous to us as it would be relatively easy to solve for such function when it's processing power and consistency in applying the 'desired' function holding us back. Hinging on real time processing of previously unknown/opaque forms of reasoning (which we might partially associate with "fuzzy logic" for example). And I felt I had failed to bring that point across successfully.'''
