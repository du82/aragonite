["https://lesswrong.com/posts/5Q5sw5qF8f5yW4Nzi/king-lear-a-new-interpretation"]
title = "King Lear - A New Interpretation — LessWrong"
description = "Tragedies often explore fundamental human flaws, showing how they can lead to ironic and devastating consequences. The greatest tragedies invite read…"
full_description = '''Tragedies often explore fundamental human flaws, showing how they can lead to ironic and devastating consequences. The greatest tragedies invite readers to reflect and draw their own conclusions. To fully appreciate these timeless works, modern audiences may need to engage in a degree of historical presentism—applying contemporary perspectives to understand the past. This essay offers an interpretation of Shakespeare's King Lear, focusing on the human tendency to conflate desires about the world with beliefs about the world.To understand this interpretation, let's first define some key terms. At the heart of any action lies agency, which requires two essential components: beliefs and desires. Beliefs reflect reality—our understanding of what the world is, including ourselves. Desires, on the other hand, stem from our imagination—they represent what we want the world to become. Without desires, we would have no motivation to act; without accurate beliefs, we wouldn't know how to achieve our desires. We can think of agency like this: an agent, using their understanding of the world (their beliefs), decides how to act to make the world align with their desires. However, when an agent conflates their desires with their beliefs—mistaking what they want to be true for what is true—they fall into self-deception.King Lear presents us with a series of deceptions so outrageous that they might seem implausible to modern audiences, who may dismiss them as mere theatrical devices. How could a king be so easily fooled by his daughters' exaggerated flattery? How could both Regan and Goneril be so utterly captivated by the illegitimate Edmund? How could Gloucester fall so readily into Edmund's trap? This essay argues that these deceptions are not simply plot devices, but rather are driven by a significant element of self-deception. Each of these deceived characters harbors desires that lead them to believe these otherwise incredible falsehoods.For the purpose of this analysis, the main characters in King Lear can be divided into two distinct groups. The first group includes Edmund, Lear, Goneril, Regan, and Cornwall. Their narratives are tragedies, each driven by profound self-deception (often concerning their own identities) that leads to ironic and devastating consequences. The second group serves a more symbolic function: Kent was a personification of loyalty, the Fool of reason, Cordelia of love, and Edgar of transcendence[1].Before we delve into the analysis, it's important to clarify that this essay isn't trying to uncover Shakespeare's exact intentions. We can't know for sure if Shakespeare intended to explore the psychology of these characters in this way. But that doesn't mean we can't use our own understanding of the human mind to gain insights into this timeless masterpiece. One last disclaimer, while this interpretation draws from King Lear some metaphorical lessons, they do not necessarily fully align with my own philosophical views. Part I Tragic CharactersEdmundEdmund, who deceives nearly everyone he encounters in the play, offers this explanation for why people are so easily fooled. In a soliloquy, he scornfully mocks humanity's tendency to blame external forces for their misfortunes:“This is the excellent foppery of the world that when weare sick in fortune—often the surfeit of our ownbehavior—we make guilty of our disasters the sun, themoon, and the stars, as if we were villains bynecessity, fools by heavenly compulsion, knaves,thieves, and treachers by spherical predominance,drunkards, liars, and adulterers by an enforcedobedience of planetary influence, and all that we areevil in by a divine thrusting-on.” (1.2.118-126)Edmund's tone was one of superiority as he describes how people rationalize their own failings. The excuses they offer are utterly unbelievable, yet they cling to them because, regardless of how others might judge their morality, most people desire to see themselves as fundamentally good. This inherent gullibility, in Edmund's view, makes it natural for people to be deceived. He saw himself as an agent of this natural order, as evidenced in his declaration: “Thou, Nature, art my goddess. To thy law / My services are bound” (1.2.1-2)[2].Driven by this belief, Edmund set out to seize the power and status he craved, deceiving nearly everyone in his path. He believed he could transcend his illegitimate birth and overcome the prevailing norms of blood legitimacy, convincing himself that nature was his ally. This is where his tragic flaw was revealed: he was not immune to the same gullibility he observed in others. Despite the hypocrisy and irony of his self-justification, his belief that he could defy his illegitimacy, while perhaps understandable to a modern audience, was as fantastical in that pre-modern era as the astrological influences he mocked. This was underscored by his invocation of "Nature" as his goddess—a notion as imaginative as the excuses he derided. Ultimately, the only explanation for why Edmund, an intelligent and cunning individual, held this belief was that he wanted it to be true. He was as much a victim of self-deception as those he despised.Edmund's tragedy reaches its culmination in the final act. When he challenges Albany, who had previously referred to him as Gloucester, Albany's curt reply, "Half-blooded fellow, yes" (5.3.98), lays bare Edmund's true status. He had always been illegitimate[3], his self-deception as potent as the deceptions he inflicted on others. His soldiers were levied in Albany's name, as his illegitimate status afforded him no recognized authority. The "truth and honor" he claimed to fight for were mere illusions. Adding to the irony, he could have avoided the fatal duel with Edgar had he not scorned the very rules of knighthood he purported to uphold. Facing death, alone and unaware of his killer's identity, Edmund finally confronts reality, acknowledging his true status with the resigned words: "The wheel is come full circle. I am here" (5.3.217). This acceptance of his reality marks a turning point, leading him to reconcile with Edgar and attempt, however belatedly, to save Lear and Cordelia. Of the characters in the first group, Edmund alone possessed a degree of insight into others' flaws (though blind to his own), and perhaps for this reason, his end contains a hint of redemption. LearLear harbored a deep-seated pride in his inherent authority and nobility, a fact that Shakespeare makes abundantly clear through numerous textual clues[4]. He believed his subjects' devotion stemmed from these inherent qualities rather than from his political power as king. It follows, then, that he would also believe his children's love was rooted in his inherent worth, transcending the typical bond between father and daughter. This conviction formed the foundation of his decision to divide his kingdom among them. When he demanded that his daughters proclaim their love, he sought not genuine affection but mere confirmation of this belief. He envisioned himself as the generous, noble patriarch, relinquishing his throne yet retaining his authority and esteemed status, which he believed were inherently his.. The "glib and oily art" (1.1.246) of Goneril and Regan, though blatantly exaggerated to others, was precisely what he desired and anticipated.The first significant challenge to Lear's belief comes from Cordelia's unforgettable response to his demand for a declaration of love: "I love your majesty / According to my bond, no more nor less" (1.1.94-95). To most, this answer seems perfectly reasonable and Lear's reaction—banishing her—shockingly extreme. However, as previously discussed, the true cause of this reaction lies not in the perceived lack of flattery, but in the fact that Cordelia's words directly refute Lear's belief about the nature of his daughters' love. Her answer threatens the very foundation of his self-identity, prompting the anguished question: how is it possible that Cordelia, his favorite, loves him merely as a father? Lear banishes Cordelia not for being untender, but because she is no longer "our joy" (1.1.84), having become inextricably linked to the perturbation and distress caused by this challenge to his worldview. The line, "Or all of it, with our displeasure pieced" (1.1.216) further reinforces this idea. It is possible that Lear's pain is so profound because, deep down, he senses the truth in her words, a possibility hinted at in his own pronouncement: "Let it be so. Thy truth then be thy dower" (1.1.112).Lear clung to denial and self-deception for a time, but eventually, he could no longer ignore the truth: his two daughters had merely feigned their love, and, most devastatingly, he possessed no inherent authority. This realization shattered Lear's false self-identity, causing the entire network of beliefs built upon it to crumble. When an agent's worldview disintegrates in this way, agency becomes impossible—the individual loses their capacity to act rationally. Lear's descent into madness followed. In this state, freed from his deceptive self-identity, his mind was no longer clouded. He began to perceive the world differently, as evidenced by his own words: "“My wits begin to turn.” (3.2.71). However, without a foundational belief in his own identity to replace the one he lost, he remained lost. Edgar aptly describes Lear's condition: “matter and impertinency mixed! Reason in / madness!” (4.6.190)Only after reuniting with Cordelia does Lear finally embrace a self-identity grounded in reality—that of the “old and foolish” father of Cordelia - “For as I am a man, I think this lady / To be my child Cordelia.” (4.7.79-80). With this newfound clarity, he begins to rebuild his agency, envisioning a future far more realistic than the one he imagined before relinquishing his kingdom. This hopeful vision is movingly expressed in his words to Cordelia: “Come, let’s away to prison. /../ So we’ll live, And pray, and sing, and tell old tales, and laugh…” (5.3.14)It’s all too late. The seeds of this tragedy had already been sown long ago by Lear himself. Cordelia's death shatters that hopeful vision, and consigns Lear to the bleak reality he himself had earlier invoked when, in a fit of rage before she left for France, he declared: "nor shall ever see that face of hers again." (1.1.291). Holding her lifeless body, after a heart-wrenching and half mad lament, Lear finally grasps the full weight of this reality: "Oh, thou'lt come no more / Never, never, never, never, never.- "(5.3.376-377), His last, fragile self-identity—that of an ordinary father—is rendered impossible, and with it, his existence. Regan and GonerilRegan and Goneril meticulously lay out their "rationale" for their mistreatment of Lear: his knights were unruly, the aging Lear was in need of guidance, and they themselves were the voices of reason. However, this was merely motivated reasoning and self-deception, fooling no one but themselves. The sisters were well aware that their actions stemmed from a desire to secure their own power; an unpredictable old man with a hundred knights posed a very real threat[5] . They sought to convince themselves that their cruel deeds were justified, even noble, and that they were not villains. Regan's swiftness to blame Edgar's fabricated treachery partly on Lear provides another example of this motivated reasoning: “Was he not companion with the riotous knights / That tend upon my father? …'Tis they have put him on the old man’s death, / To have th' expense and spoil of his revenues” (2.1.105, 110-111). This is a rather creative way of conjuring up more evidence against Lear. Ultimately, their justifications were driven by a deep-seated need to maintain a self-image as honorable individuals, to avoid seeing themselves as cruel or evil.If their earlier motivated reasoning hinted at self-deception, their romantic entanglement with Edmund reveals it in its entirety. It might seem overly theatrical, especially to modern audiences, that both Regan and Goneril could be so easily manipulated by Edmund, believing this illegitimate son to harbor genuine affection for them. But here lies the ultimate irony: they fall prey to the same fallacy as Lear[6]. They believe in their own inherent honor (and perhaps their feminine charms), a self-deception parallel to Lear's belief in his inherent authority. Blinded by this distorted self-image, they, like Lear, accept Edmund's flattery wholeheartedly, oblivious to his true ulterior motive: to seize their power.Further amplifying the irony, both sisters, like Lear, descend into a kind of madness when confronted with the truth of Edmund's duplicity. Their public displays of jealousy over Edmund become increasingly desperate, bordering on deranged. Goneril, for instance, declares she would "rather lose the battle than that sister / Should loosen him and me" (5.1.23-24). Regan's pronouncements are even more unhinged, as she proclaims to Edmund: “Take thou my soldiers, prisoners, patrimony./ Dispose of them, of me. The walls is thine. / Witness the world that I create thee here/ My lord and master” (5.3.91-94). The deaths of these two, mirroring Lear's own tragic end, extinguish any lingering hope for their reconciliation with reality. The fact that Edgar, whom he called "no dearer" than Edmund, was his only legitimate son and the one entitled to inherit his title and property seemed almost an inconvenience to Gloucester. With minimal coaxing from Edmund, who merely feigned advocacy for Edgar, Gloucester readily embraced the preposterous notion that his loyal and legitimate son was plotting against him. Initially, Gloucester recognized the possibility of a misunderstanding, stating, “He cannot be such a monster—” (1.2.94). He even expressed a willingness for the matter to be happily resolved by Edmund’s suggested eardrop: “I would unstate myself to be in a due / resolution” (1.2.99-100). However, he quickly conjures up a rationalization, seemingly out of thin air: ”These late eclipses in the sun and moon portend no good to us./…This villain of mine comes under the / prediction—there’s son against father” (1.2.103-106). Edmund's success in deceiving Gloucester stems from the older man's own desire for Edmund to be his legitimate son and his inability to entertain the possibility that Edmund might be capable of such treachery. GloucesterGloucester held a peculiar fondness for Edmund. While one might expect this affection to be based on some redeeming quality in his illegitimate son, Gloucester never articulates such a reason. Instead, his fondness seems rooted in Edmund's association with the "good sport" he had with the boy's fair mother[7]. When presented with the letter, it never occurs to Gloucester, not even for a moment, that Edmund might be the one manipulating the situation. The very idea that Edmund could be deceiving him was simply unthinkable inside Gloucester's head, a blind spot that is a direct result of hi'''
