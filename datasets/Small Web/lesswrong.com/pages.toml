["https://lesswrong.com/events/vspYEgW5GL28H5D8L/lighthaven-sequences-reading-group-18-tuesday-01-21"]
title = "Lighthaven Sequences Reading Group #18 (Tuesday 01/21) — LessWrong"
description = "Come get old-fashioned with us, and let's read the sequences at Lighthaven! We'll show up, mingle, do intros, and then split off into randomized grou…"
full_description = '''The host has requested RSVPs for this event Going Maybe Can't Go18 Going5 Maybe3 Can't GoDuncan HaldaneNucleushathhalinaethGarrett BakerNickSharpHammersleyjoycewAndis_DragunsMichael CohnElijah Ravitz-CampbelltrevorEneaszJozdienZicoThomas BroadleyJenniferMorphismJackson KarelEverettSodiumSonia AlbrechtSara Popovich Ben PacelcMaelstrom Come get old-fashioned with us, and let's read the sequences at Lighthaven! We'll show up, mingle, do intros, and then split off into randomized groups for some sequences discussion. Please do the reading beforehand - it should be no more than 20 minutes of reading.This group is aimed for people who are new to the sequences and would enjoy a group experience, but also for people who've been around LessWrong and LessWrong meetups for a while and would like a refresher.This meetup will also have dinner provided! We'll be ordering pizza-of-the-day from Sliver (including 2 vegan pizzas). Please RSVP to this event so we know how many people to have food for.We're roughly working through the sequences highlights. The mandatory readings this week areIllusion of Transparency: Why No One Understands YouCached ThoughtsTaboo Your WordsReplace the Symbol with the Substance(optional) Subskills of "Listening to Wisdom"The posts should take around 15-20 minutes to read if you've read them before, and 30-60 mins if it's your first time.The event starts at 6:30, and doors open 6pm (yes we will let you in early if you get here). At 6:30 we'll welcome people, give a few announcements, and then split into groups. Pizza will be served at about 7:30pm, after which point we'll hangout around the fireside as late as we feel like.If you'd like to help us keep dinner going, you can donate here (dinner costs about $200 each time, we recommend $5-$15 as a donation amount per person).You can come without having read the essays from the sequences, we do want you to get to join, but then you will have to do a punishment. (And then you still have to catch up on reading the essays during the meetup.)If you're ever having a hard time getting in the front door, you can call me (Ben) at five one oh, nine nine eight, four seven seven one, or Ronny at two oh one, four oh six, six eight seven two, and we'll come and get you.Some questions to ask yourself about the essays as you read themWhat's the most important point in the essay?What's the weakest point in the essay? Or what is the essay wrong about?Can you think of a way to apply the ideas in this essay to your own life?For the futureThis is a weekly meetup! If you'd like to get notified of future events, you can subscribe to our meetup below to get an email whenever we add another one. Posted on: 17th Jan 2025'''
