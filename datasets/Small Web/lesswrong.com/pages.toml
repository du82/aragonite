full_description = "If you get an email from aisafetyresearch@gmail.com , that is most likely me. I also read it weekly, so you can pass a message into my mind that way.Other ~personal contacts: https://linktr.ee/uhuge My suspicion: https://arxiv.org/html/2411.16489v1 taken and implemented on the small coding model. Is it any mystery which of the DPO, PPO, RLHF, Fine tuning was likely the method for the advanced distillation there? EA is neglecting industrial solutions to the industrial problem of successionism...because the broader mass of active actors working on such solutions renders the biz areas non-neglected? Wow, such a badly argued( aka BS) while heavily up-voted article!Let's start with the Myth #1, what a straw-man! Rather than this extreme statement, most researchers likely believe that in the current environment their safety&alignment advances are likely( with high EV) helpful to humanity. The thing here is they had quite a free hand or at least varied options to pick the environment where they work and publish.With your examples a bad actor could see a worthy EV even with a capable system that is less obedient and more false. Even if interpretabilty speeds up development, it would direct such development to more transparent models, at least there is a naive chance for that.Myth #2: I've not yet met anybody in the alighnment circles who believed that. Most are pretty conscious about the double-edgedness and your sub-arguments.https://www.lesswrong.com/posts/F2voF4pr3BfejJawL/safety-isn-t-safety-without-a-social-model-or-dispelling-the?commentId=5vB5tDpFiQDG4pqqz depicts the flaws I point to neatly/gently. Are you referring to a Science of Technological Progress ala https://www.theatlantic.com/science/archive/2019/07/we-need-new-science-progress/594946 ? What is your gist on the processes for humanizing technologies, what sources/researches are available on such phenomena? some OpenAI board members who the Office of National AI Strategy was allowed to appoint, and they did in fact try to fire Sam Altman over the UAE move, but somehow a week later Sam was running the Multinational Artificial Narrow Intelligence Alignment Consortium, which sort of morphed into OpenAI's oversight body, which sort of morphed into OpenAI's parent company, and, well, you can guess who was running that.pretty sassy abbreviations spiced in there.'ĐI've expected the hint of> My name is Anthony. What would you like to ask?to show it Anthony was an LLM-based android, but who knows.?."
