["https://lesswrong.com/posts/cmxjLEYQi2AXcWhZw/monthly-roundup-26-january-2025"]
title = "Monthly Roundup #26: January 2025 — LessWrong"
description = "Some points of order before we begin the monthly: …"
full_description = "Some points of order before we begin the monthly: It’s inauguration day, so perhaps hilarity is about to ensue. I will do my best to ignore most forms of such hilarity, as per usual. We shall see. My intention is to move to a 5-posts-per-week schedule, with more shorter posts in the 2k-5k word range that highlight particular subtopic areas or particular events that would have gone into broader roundups. This means that the Monthly Roundups will likely be shorter. If you’re considering reading Agnes Callard’s new book, Open Socrates, I am reading it now and can report it is likely to get the On the Edge treatment and its own week, but of course it is too soon to know. I may be doing some streams of myself working, via Twitch, primarily so that a volunteer can look for ways to build me useful tools or inform me of ways to improve my workflow. You are also of course welcome to watch, either live or the recordings, to see how the process works, but I make zero promises of any form of interaction with the audience here. I also might stream Slay the Spire 2 when the time comes, once I have access and they permit this. On with the show. Table of Contents Bad News. Wanna Bet. A Matter of Trust. Against Against Nuance. Government Working. Scott Alexander on Priesthoods. NYC Congestion Pricing Bonus Coverage. Positive Sum Thinking. Antisocial Media. The Price of Freedom. Mood Music. Dedebanking. Good News, Everyone. While I Cannot Condone This. Clear Signal. When People Tell You Who They Are Believe Them. What Doesn’t Go Without Saying. Party at My Place. I Was Promised Flying Self-Driving Cars. Gamers Gonna Game Game Game Game Game. For Your Entertainment. Sports Go Sports. The Lighter Side. Bad News PornHub cuts off Florida, the 13th state to lose access, after Florida passed an age verification law, and PornHub quite reasonably does not want to ask for your ID. Running for Congress is a horrible deal and essentially no sane person would do it. If we want good people to run for Congress and for them not to consider sleeping on cots in their office we need to dramatically raise pay, which we should do. Share of American adults having dinner or drinks with friends on any given night has declined by more than 30% in the past 20 years, and changes from Covid mostly have not reversed. Older software engineers often report that once they lose their current job, they can’t get new jobs and that this is because of rampant agism, others report this is not true, and it’s you in particular that sucks, or you’re seeing selection effects because most of the good ones get forced into management or start their own companies. It’s certainly not universal, but my sense is that many underestimate the downside risk of this outcome. The replication crisis comes for experimental asset market results, out of 17 attempted replications only 3 results were significant with average effect size 2.9% of the original estimates. Wanna Bet Gary Marcus places another highly virtuous public bet, this time with Derya Unutmaz. Derya Unutmaz, M.D.: I accept this, and in fact, I counteroffer a $10,000 bet that by 2045 we will surpass a life expectancy of 95, with an increase of more than a year each year thereafter. I intend to collect it, so don’t die! Gary Marcus: I hereby accept @deryaTR_’s $10,000 bet on human life expectancy 20 years hence. Winnings go to charity, and I hope desperately that I lose! The bet is resolved once 2045 data are available. (I will not hold him to the “thereafter” part. But I hope he is correct on that part, too.) Best part of this bet is everyone is rooting for Derya. This is largely but not entirely a bet on AI capabilities. If we get an intelligence explosion relatively soon, then either life expectancy will go way down but Gary won’t be around to collect, or if things go well I do expect to be able to get life expectancy rising rapidly. If AI stalls out, then it gets a lot harder for Derya to win, but it isn’t impossible. There’s always the rub of whether, when you lose, you actually pay… A Matter of Trust Sam Harris accuses Elon Musk of having bet him a $1 million in charitable donation at 1000:1 odds (against a $1k bottle of tequila) that there would not be 35k Covid cases in America, and then refusing to pay and turning against him when Harris tried to collect. Both halves are rather terrible if true, and it is a strange accusation to make if it is false. There are also rather well-supported accusations that Elon Musk’s supposed Path of Exile 2 characters are, at best, being played primarily by someone else. He doesn’t seem to even understand many basics of how the game works, and the amount of time obviously required to get the characters in question is obviously impossible given his time constraints. Honestly this was pretty embarrassing, and it tells you a lot about a person if they decide to do this, including the fact that it was 100% to be caught. Does Musk pull off some impressive feats of gaming? It seems like he does. Grimes: Just for my personal pride, I would like to state that the father of my children was the first american druid in diablo to clear abattoir of zir and ended that season as best in the USA. He was also ranking in Polytopia, and beat Felix himself at the game. I did observe these things with my own eyes. There are other witnesses who can verify this. That is all. However, when you pull a stunt like this, you call all that into question, and you dishonor the game, all of gaming and also yourself. On some level, one must wonder if this was intentional. Against Against Nuance Tyler Cowen challenges whether there can be ‘an intermediate position on immigration.’ This is another form of Dial Theory, where one says that all one can say is Yay [X] or Boo [X], so saying something nuanced only matters insofar as it says Yay or Boo. That what matters is the vibe, not the content. Tyler Cowen: Increasingly, I have the fear that “general sympathies toward foreigners” is doing much of the load of the work here. This is one reason, but not the only one, why I am uncomfortable with a lot of the rhetoric against less skilled immigrants. It may also be the path toward a tougher immigration policy more generally. I hope I am wrong about this. Right now the stakes are very high. I have never written the post Against Dial Arguments, or perhaps Against Against Nuance. Or perhaps Stop Prioritizing the Vibes? This seems like a clear example. Tyler has had several posts on related issues, where he frames discussions as purely being on the basis of what would be convincing to the public in the immediate term, rather than any attempt to actually use asymmetric weapons or argue for actually optimal understanding or policy. I also am much less cynical here. I believe that this distinction (between legal or skill immigration, versus illegal or unskilled) not only can be drawn, but that drawing it is the way to win hearts and minds on the issue. So much of how I disagree with Tyler Cowen in general is perhaps embodied by his response to the death of Jimmy Carter. Essentially Tyler said that Carter had great accomplishments that stand the test of time, but the vibes were off, so he much preferred Ford, Clinton or Reagan – and without a ‘I know this is foolish of me but’ attached to that statement. If Carter killed it on foreign policy and peace, and killed it on being moral and standing up for what is right, and killed it on monetary policy and deregulation as a Democrat when we desperately needed both, and you realize this, then I don’t care if the vibes are off. That’s amazing. You better recognize. Government Working I pledge not to ever vote for anyone who claimed in public that the ERA was a legal part of our constitution. This is a dealbreaker, full stop. Please remind me, if this ever becomes relevant. Note that this includes one of my senators, Gillibrand, and also Duckworth. A similar reaction goes for organizations that bought into this, which they claim includes the American Bar Association. I also note I don’t understand why the Archivist of the United States matters here. Kudos to her for pointing out that A is A, the bar sure is low these days, but her role is ceremonial. If she declared that somehow it had been ratified, wouldn’t SCOTUS simply inform everyone that it wasn’t? How is this not ultimately their call? DOGE picks a fight over the Christmas tree funding package, and loses hard. It’s not only that they didn’t get most of what they wanted. It’s that they picked the wrong fight on multiple levels, targeting the traditional superficially flashy ‘wasteful spending’ instead of places that matter, in a spot where they needed congressional approval. They need to wise up, fast. Our government will sometimes take your child away for months or longer because of a positive drug test reported by a hospital… for the same drugs that hospital gave you. And there are several cases where, after the authorities in question were made aware of what happened, Child Services not only did not profusely apologize, they didn’t let the matter drop. Scott Alexander on Priesthoods His post is rather scathing. The fact that it tries not to be only makes it worse. Let’s start out with a quote for those who thought I was kidding when I said modern architecture was a literal socialist plot to make our lives worse: Peter Eisenman: What I’m suggesting is that if we make people so comfortable in these nice little structures of yours, that we might lull them into thinking that everything’s all right, Jack, which it isn’t. And so the role of art or architecture might be just to remind people that everything wasn’t all right. I say the proper role of architecture is to make things as all right and good as possible. Are the other similar academic determiners of truth and worth any better? Let’s consider economics. Scott Alexander: I used to wonder why so many econ-bloggers I liked were at GMU. GMU only is only the 74th best economics department in the country, but more than half of the econbloggers I like are affiliated with it in some way (Tyler Cowen, Alex Tabarrok, Garett Jones, Robin Hanson, Bryan Caplan, Arnold Kling, Scott Sumner, Mark Koyama, sorry if I’m forgetting anyone!). … When I asked academics about this, they didn’t find it mysterious at all. The average high-ranked economics department doesn’t care that you have a popular blog. They might even count it against you. Only your reputation within the priesthood matters. This is my experience too. What’s weird is that Tyler Cowen is responsible for the majority of the time I encounter in practice the pure form of the argument that ‘blogs don’t count, only properly peer reviewed and published papers do, so your argument is invalid. I am not only allowed to but almost obligated to ignore it until you change that. Good luck.’ Whereas this exact principle is used to exclude essentially all the economists I respect most from the core economic discourse – and most of them are listed above, in one place, at ‘the 74th best economics department in the country.’ I have no problem with various people playing intricate ingroup status games. But when that makes my buildings ugly and economics largely Obvious Nonsense, and so on throughout the various disciplines with notably rare exceptions, and those with power are accepting their status claims, and they’re doing it all effectively at public expense, I’m not a fan. Scott Alexander tries to say that hard boundaries with the public are not only useful, but even necessary. Scott Alexander: This hard boundary – this contempt for two-way traffic with the public – might seem harsh to outsiders. But it’s an adaptive artifact produced by cultural evolution as it tries to breed priesthoods that can perform their epistemic function. The outside world is so much bigger than the priesthoods, so much richer, so full of delicious deposits of status waiting to be consumed – that any weaker border would soon be overrun, with all priesthood members trying to garner status with the public directly. Only the priesthoods that inculcated the most powerful contempt for the public survived to have good discussions and output trustworthy recommendations. Yeah, no. Of course you need to ignore the public when it’s espousing Obvious Nonsense and Did Not Do the Research. But if and when the public has good ideas, that is great. Those saying otherwise are rent seekers whose conversations are engaged in a conspiracy against the public, or some contrivance to raise prices. Several other sections are so unconvincing as to sound absurd. Yes, there is messiness in not doing everything according to only the sacred laws of communication and trade, but come on with these excuses. Then there’s the point that so many of these organizations got politically captured. Scott Alexander offers a theory as to how that happened. It isn’t flattering. Another example of that this month was the American Economic Association once again makes clear it is fully partisan and unafraid to stick its nose where it does not belong, as it encouraged members to move from Twitter to BlueSky. It also seems suspect, but it seems to be pointing towards some part of the story. Scott Alexander: I think the priesthoods are still good at their core functions. Doctors are good at figuring out which medicines work. Journalists are good at learning which Middle Eastern countries are having wars today and interviewing the participants about what fighting wars in the Middle East is like. Architects are good at designing buildings that don’t collapse. But now this truth must coexist with an opposite truth: the priesthoods are no longer trustworthy on anything adjacent to politics. This is the standard, which is rather grim and… well, it’s close. Yes, I can probably count on architects to design builds that don’t collapse. That’s a case where they are forced to match physical reality. We’d find out real quick if they stopped doing that one. But I can’t count on them to, beyond this basic requirement, design good buildings I want to exist. I am not convinced I can count on journalists to tell me which Middle Eastern countries are having wars today. There has often been quite a lot of them pretending that countries that are effectively fighting wars (e.g. through proxies) are not fighting wars today. If I want to know who is and is not fighting wars today, my best way of doing that is not to trust journalists too much on that question. Doctors are not good at figuring out what medicines work. I know this because I had a company based largely on trying to figure out which medicines work in a given context, and because I know doctors and I know people who encounter doctors. Doctors are much better than random, or a random member of the public, at this, to be sure. Mostly they learn a set of heuristics, which they apply, and that’s not too bad in most situations and for many practical purposes you can largely trust t"
