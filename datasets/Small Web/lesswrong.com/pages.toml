full_description = "AI Safety Outreach = Making more people better informed about AI risk, through any means that works. Who is this event for: Anyone who wants to help with, or might want to help with AI safety outreach. No qualifications required. Approximate Schedule: 1st hour: Talks by speakers + break 2nd hour: Q&A with speakers + break 3rd hour: 1-on-1s with other audience members The talk and Q&A will be recorded and shared publicly, but some parts may be removed on the request of the speakers. Speakers: William BairdRemmelt Ellen… maybe one more person…? Collaborative note taking:Shared notes for AI Safety Outreach Seminar - Google Docs Registration (optional):Registration is not necessary, but if you sign up here you'll get an event reminder.Posted on: 8th Jan 2025"
