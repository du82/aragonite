full_description = '''Running Lightcone Infrastructure, which runs LessWrong and Lighthaven.space. You can reach me at habryka@lesswrong.com. (I have signed no contracts or agreements whose existence I cannot mention, which I am mentioning here as a canary) I have heard from many people near AI Safety camp that they also have judged AI safety camp to have gotten worse as a result of this. I think there was just a distribution shift, and now it makes sense to judge the new distribution.Separately, it matters who is in a position to shape the culture and trajectory of a community.I think there is a track record for the last few safety camps since Remmelt went off the deep end, and it is negative (not purely so, and not with great confidence, I am just trying to explain why I don't think there is a historical track record thing that screens off the personalities of the people involved). I think "stop AI" is pretty reasonable and good, but I agree that Remmelt seems kind of like he has gone off the deep end and that is really the primary reason why I am not supporting AI Safety camp. I would consider filling the funding gap myself if I hadn't seen this happen.My best guess is AISC dying is marginally good, and someone else will hopefully pick up a similar mantle. (I am not a huge fan of this post, but I think it's reasonable for people to care about how society orients towards x-risk and AI concerns, and as such to actively want to not screen off evidence, and take responsibility for what people affiliated with you say on the internet. So I don't think this is great advice. I am actively subscribed to lots of people who I expect to say wrong and dumb things, because it's important to me that I correct people and avoid misunderstandings, especially when someone might mistake my opinion for the opinion of the people saying dumb stuff) My sense is political staffers and politicians aren't that great at predicting their future epistemic states this way, and so you won't get great answers for this question. I do think it's a really important one to model!'''
