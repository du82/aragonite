nd that he physically, sexually, and emotionally abused at least two of his partners. Until these abuse allegations were made public, most of our... READ MORE Jan 22, 2019 - Timothy Telleen-Lawton CFAR Newsletter (January 2019) Happy New Year! With 2019 under way, we’d like to share some updates from the past few months and plans for the coming year. Updates Harm in the Community Last year, allegations of serious harm were brought against an alumnus and community member. Since then, CFAR has been focused on understanding what happened, what mistakes we made in this case, and how we can reduce the risks of a range... READ MORE Nov 23, 2018 - Timothy Telleen-Lawton Further Updates [Since this post we have also posted a more detailed follow-up.] This statement is a short update to the public apology we made in September. Since then, we have taken the following additional actions: We have decided to permanently ban Brent from all CFAR events and spaces. After learning more about people’s experiences with Brent, and re-examining our own history with him, we have concluded that he poses significant danger... READ MORE Sep 21, 2018 - Timothy Telleen-Lawton ACDC Update and Apology [Since this post we have also posted a short and a more detailed follow-up.] We were horrified to learn of the serious allegations of repeated consent-violation and lasting harm detailed in three Medium posts. [Persephone, T, and Jonathan] Today, we have taken the following actions: Brent is banned from all CFAR activities and spaces until the original ACDC recommendation—which suggested a ban was unnecessary—can be revisited by an improved due... READ MORE See All Updates Subscribe via RSS"
