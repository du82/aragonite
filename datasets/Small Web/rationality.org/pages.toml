title = "Fight, Flight, Freeze, or... attend class September 28 | Center for Applied Rationality"
description = "On Saturday, September 28th, we'll be offering a three hour class on handling your fight/flight/freeze reflexes. Tensing up can help you deal with punches an..."
full_description = "Leah Libresco Curriculum Developer & Instructor Fight, Flight, Freeze, or... attend class September 28 On Saturday, September 28th, we'll be offering a three hour class on handling your fight/flight/freeze reflexes. Tensing up can help you deal with punches and a burst of adrenaline might help you outrun an aggressive dog, but these instincts can trip you up in a high-stakes conversation or a challenging task. In Againstness Training, CFAR instructor Valentine Smith will explain the biology of sympathetic and parasympathetic nervous systems and how you can consciously help your body shift your balance between these two systems as the situation demands. This class won't just be theory, though. Once the basics are explained, Valentine will help you practice responding to stressors while giving yourself room to think (or even just breathe). At our four-day workshops, we run a special sessions to help people drill this skill on the last day, and it's usually one of our most popular activities. So, if you'd like to have a little more self-possession in a crisis, come out for the three-hour version of our Againstness Training. The class will cost $90 and will run from 2-5pm at our Berkeley office (2030 Addison St, Suite #300). Because this class is highly interactive, it will be capped at 12 participants, and admission will be first come, first served. Click here to register! Find out more about our Workshops Or donate to CFAR"
