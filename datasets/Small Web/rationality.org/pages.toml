full_description = "Leah Libresco Curriculum Developer & Instructor Virtual Open House at CFAR Tomorrow (Thursday, September 12), our Executive Director Anna Salamon and Andrew Critch, a CFAR cofounder, will be sitting down on Skype for a series of 15 and 30 minute chats about CFAR. We're looking to chat with people who haven't met us or been exposed to CFAR before, so we can learn a bit about what questions people tend to ask and can refine our explanation of what we do. So, if you have a friend you'd like to introduce to CFAR, let them know that they can sign up for a skype chat here. Just check off one box for a 15 minute slot, and two consecutive boxes for a half-hour conversation. We've got times open from noon to 5:30pm PT. And make sure you use your skype handle as your name, so we know how to reach you! Find out more about our Workshops Or donate to CFAR"
