description = "Developing clear thinking for the sake of humanity’s future"
full_description = "Updates Popular Elizabeth Garrett Community Manager & Instructor CFAR Newsletter (December 2020) Hello, We continue to exist! Although we’ve definitely been really quiet. Here’s what we’ve been up to. The year started well with a mainline CFAR workshop and an AIRCS workshop. Then, at the beginning of March, we cancelled any plans for in-person workshops for the rest of the year, including one that was set to start in a week. This was primarily motivated by the desire to make sure people had enough time to prepare for, as we all called it then, “corona.” This left us in a bit of a pickle with instructor training. The March mainline workshop was supposed to be a sort of “final exam.” Eventually we decided to officially end the program, but continue to work with our ICs on other projects if they were interested. Many were! You’ll hear about some of what they’re doing in these newsletters. With offices closed and in-person workshops doomed, we decided to have a “workshop sabbatical”, giving staff more time for learning, outside projects, focused work, and exploration. We had wanted to do this for a while, and considered this as good a time as any. Here is a smattering of random artifacts from this time: LW post, (prize winning!) EA post, LW post, household musical, podcast guest. Sometime around September, we ended our sabbatical and got back to thinking about developing and teaching applied rationality. Here are some of the things we’re working on right now. Coaching Program Experiment We’re running an experimental coaching program for our alumni designed to help us with our R&D and maybe participants with their bugs. Coaching is $40 an hour while the program is in beta, and the first session with each coach is free. Here are some of our coaches’ areas of interest this month: Nora Ammann is trying to help people get unstuck in their research. Looking for traction? Daniel Hnyk wants to help people think through GTD or productivity improvements and debugging. Feeling overwhelmed and unproductive? Jack Carroll is facilitating focusing sessions that aim for the core of persistent problems. Got something that keeps pinging your attention? Naturalism School Logan (né Brienne) is unfurling a “naturalism” school: an approach to learning the art of rationality that is more like studying botany and less like attending a coding bootcamp. They will likely be posting more about this in the next few months. Other contributors include Nora Ammann, Preston Greene, Nicole Ross, and Irena Kotikova. Below is an artistic peep at what’s going to come. Roam Collaboration Roam is a new “note taking tool for networked thought” that a number of our staff and alumni use and which was in fact founded by one of our workshop mentors. We’re currently trying our hand at running our first online, asynchronous workshop for some of their staff. If you and your organization would be interested in being a future experiment, email Tim. Holacracy Investigation We’ve been thinking about how organizations calcify: actions drifting away from purposes, mindsets changing from expected value to loss aversion, and increases in day-to-day bureaucracy. What types of structures keep things fresh and innovative? In that vein of inquiry, we did a Holacracy workshop. We’re not running a fundraiser this winter, but if you find that crypto or recent market gains are burning a hole in your pocket, we always appreciate donations! Happy Holidays! Elizabeth & the CFAR Team Unaffiliated Links Clearer Thinking just launched 15 new tools for, well, thinking more clearly. Interested in what’s going on with forecasting? Try this forecasting newsletter READ MORE Dec 20, 2019 - Timothy Telleen-Lawton CFAR Newsletter (December 2019) Hello from CFAR! Here’s a look at what we did during the past few months and what we’re planning for the next few. We’re also in the middle of our year-end fundraiser, including an AMA we’re holding right now on LessWrong until 10am tomorrow; check out our fundraiser page to see a broader look at the last two years and the next one, or to donate! What We Did Mainline... READ MORE Dec 18, 2019 - Timothy Telleen-Lawton Financial Overview: 2018-2020 Note: This document is intended as an informal, easily-readable overview of CFAR’s income and expenses in 2018 and 2019, and of our financial projections for 2020. You can view our 2019 Independent Auditor’s Report here, and our most recent 990 here. 2018 Income In 2018, CFAR1 received approximately $2.2 million in revenue. Half this sum came in the form of general support from BERI (the Berkeley Existential Risk Initiative), $800k... READ MORE Archive Aug 30, 2019 - Timothy Telleen-Lawton CFAR Newsletter (August 2019) Hello from CFAR! Read on to learn about our busy summer, as well as what we’ve got planned for the fall. What We Did Instructor Training We’ve completed the first phase of our 2019 Instructor Training Program! We’re now moving on to the second (and final) phase with 20 instructor candidates. Staff will be working with these candidates as they continue various “quests”—mastering and improving core parts of CFAR’s curriculum,... READ MORE May 30, 2019 - Timothy Telleen-Lawton CFAR Newsletter (May 2019) Hello from CFAR! It’s springtime in Berkeley and we’re gearing up for a busy summer. Here’s a look at what we did during the past few months and what we’re planning for the next few. What We Did Alumni Double Crux Workshop In January, a few staff members joined Eli Tyre in Bodega Bay as he led an experimental alumni workshop on the Double Crux technique. We invited a dozen... READ MORE Mar 21, 2019 - Timothy Telleen-Lawton CFAR's Mistakes Regarding Brent This document is a follow-up to the public statements we made in September and November. Last September there were multiple public allegations that Brent caused grave harm to members of our community. We consider these allegations credible: we believe that Brent routinely manipulated those around him, and that he physically, sexually, and emotionally abused at least two of his partners. Until these abuse allegations were made public, most of our... READ MORE Jan 22, 2019 - Timothy Telleen-Lawton CFAR Newsletter (January 2019) Happy New Year! With 2019 under way, we’d like to share some updates from the past few months and plans for the coming year. Updates Harm in the Community Last year, allegations of serious harm were brought against an alumnus and community member. Since then, CFAR has been focused on understanding what happened, what mistakes we made in this case, and how we can reduce the risks of a range... READ MORE Nov 23, 2018 - Timothy Telleen-Lawton Further Updates [Since this post we have also posted a more detailed follow-up.] This statement is a short update to the public apology we made in September. Since then, we have taken the following additional actions: We have decided to permanently ban Brent from all CFAR events and spaces. After learning more about people’s experiences with Brent, and re-examining our own history with him, we have concluded that he poses significant danger... READ MORE Sep 21, 2018 - Timothy Telleen-Lawton ACDC Update and Apology [Since this post we have also posted a short and a more detailed follow-up.] We were horrified to learn of the serious allegations of repeated consent-violation and lasting harm detailed in three Medium posts. [Persephone, T, and Jonathan] Today, we have taken the following actions: Brent is banned from all CFAR activities and spaces until the original ACDC recommendation—which suggested a ban was unnecessary—can be revisited by an improved due... READ MORE See All Updates Subscribe via RSS"
