full_description = '''Developing clear thinking for the sake of humanity’s future Writing Rationality-related writing/videos by current and former CFAR staff Workshops CFAR's 4.5 day immersive retreats, where we teach and train techniques for forming accurate beliefs, navigating intellectual disagreement, making better use of our internal advisors, developing non-self-deceptive motivation, and building the habit of getting things done. Upcoming Workshops Information on upcoming 4-day workshops See more workshop dates Common Questions Frequently asked questions How much does a workshop cost? What material will you cover? Who should attend a CFAR Workshop? Are there workshops near me? What is the answer to everything? SEE MORE QUESTIONS Apply to one of our Workshops Reviews "I went to the July workshop. I think it was probably the most useful week of my life in terms of exposure to things I could be doing to be more productive and effective." — Ben Toner, CEO of Draftable "As a founder of a company with a similar mission to CFAR’s – making people more awesome – ... CFAR’s Rationality for Entrepreneurs workshop did not disappoint." — Daniel Reeves, Co-Founder of Beeminder Number of workshop alumni 1317 and counting Average participant rating based on the question "Are you glad you came?" 9.2 out of 10 Increased life satisfaction 0.17σ after 1 year Read more in our longitudinal study Organizations we've collaborated with'''
