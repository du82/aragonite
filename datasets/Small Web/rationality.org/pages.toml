["http://rationality.org/venue"]
title = "Venue | Center for Applied Rationality"
description = "Developing clear thinking for the sake of humanity’s future"
full_description = "Venue .post-header { display: none; } .venueTitle { text-align: center; font-size: 20px; margin-bottom: 32px; font-family: 'roboto', sans-serif; font-weight: 700; color: rgba(0, 0, 0, 0.55); } .venueTitle .supertitle { } .venueTitle .title { font-size: 40px; } .venueTitle .subtitle { } .nestedList { list-style: none; } .bigImage { width: 100%; margin-bottom: 40px; } .images4x4 img { width: calc(50% - 12px); padding: 6px; margin-bottom: 20px; } .imageStandalone { text-align: center; margin: 16px; } .images2xSBS img { width: calc(50% - 12px); padding: 6px; } The Center for Applied Rationality’s Bodega Bay Venue Rental Information Once a bed and breakfast, this venue nestled in the hills of the Sonoma Coast is an ideal space for retreats. We worked hard to find lighting, seating, whiteboards, etc. that help nudge gatherings toward warmth, clarity, and reasoning. If you’re interested in booking, or have questions, contact us at venue@rationality.org – we’d love to talk. Venue features: Approximately 5,500 sq ft 12 bedrooms (plus overflow sleeping areas) with 50 beds for lodging with towels and linens included, in addition to weighted blankets on each bed 8 bathrooms: 6 full bathrooms, 1 half bathroom A main classroom area that can hold 40 people (extendable walls are available to create a smaller classroom space if desired), with a combination living room, dining room area adjacent for additional space Breakout spaces on the top and bottom floor an octagon shaped space on the top floor with tall ceilings and 4 large windows that fill the room with light; this unique room is the perfect space for facilitating intimate group conversations and giving each person an equal vantage. The room can hold around 8-10 people comfortably. The basement room that can hold around 15 people- each already supplied with whiteboards, easels, and writing supplies Large fully furnished kitchen with 2 refrigerators (one commercial sized) and a large chest freezer, a large kitchen island for buffet serving + 6 food warmers, countertop hot water dispenser, gas stove, and a large walk-in pantry. Several outdoor common spaces to gather; a wrap around porch immediately adjacent to the living room on the main floor, a small patio with a picnic table off the driveway, a multi-level wooden deck with several seating areas, and a peaceful yard ensconced by lush greenery with a small seating area To see more of our venue, check out the full photo set. Local restaurants that can provide takeout, as well as various catering options. There are two small grocery stores in town, Pelican Plaza Grocery & Deli and Diekmann's Bay Store, but the nearest Whole Foods (or similar) is 30 min away in Sebastopol. Instacart grocery delivery is an option for food transportation. There are many nature preserves and state parks nearby. From the venue its a 30 minute walk to the Pacific Coast (or 5 minutes by car); first stop at the Children’s Bell Tower https://maps.app.goo.gl/uLAWNjxA25HRiMvM8, then cut through the woods for 60 seconds to the Bodega Dunes Campground, before continuing on Bodega Dunes road to the beach. Take a beautiful stroll along the Coastal Prairie Trail, or an hour hike to the apex of Bay Hill Road’s hill with views of the ocean and the neighboring farms. Check out more places to visit at https://www.bodegabay.com/things-to-do/ Reach out to us at venue@rationality.org"
