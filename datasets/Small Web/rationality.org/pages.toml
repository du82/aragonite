wsletter (Cross posted from our alumni mailing list) Hey everyone! As 2017 comes to a close, I wanted to share some news about what we’ve done over the last quarter, and about what we plan to do next. Note: our fundraiser is currently live! You can find our 2017 retrospective here, and read more about our plans for 2018 here. What We Did Mainline Workshops - We ran three of our... READ MORE Dec 16, 2017 - Pete Michaud CFAR 2017 Fundraiser I’m happy to report that with your help, CFAR can make 2018 by far the highest impact year we’ve ever had. According to our new data, a disproportionate amount of our impact comes from running special programs like the AI Summer Fellows Program, compared to mainline workshops. These special programs tend to be more expensive because they are more difficult and time consuming to run, and because they bring in... READ MORE Dec 16, 2017 - Michael "Valentine" Smith CFAR 2017 Retrospective As we approach the end of the year, we’d like to offer everyone a summary of what CFAR has been up to in 2017. Sprint & Instructor Training The first half of the year focused on improving and stress testing our main intro workshops. We ran a “sprint” of five workshops from February through May. This had a couple of main aims: We wanted to see if we could do... READ MORE Dec 16, 2017 - Dan Keys CFAR 2017 Impact Report Intro CFAR was founded with a two-part vision: to develop and train people in the art of rationality, and to have some of those people then be more likely to work effectively on the world’s most important problems. Last year, we decided to focus especially on our alums’ impact on the problem of AI risk. The question of how well CFAR is succeeding at its mission can be broken down... READ MORE Dec 16, 2017 - Pete Michaud CFAR 2017 Venue Update We’ve been actively working to acquire a venue for over a year, and are now the closest we’ve ever been to actually having it. We have closed the deal on a venue in Bodega Bay, the Bay Hill Mansion: That means we’ve determined the property is suitable—in terms of cost, zoning, permitting, and structure—for us to run essentially all of our programs, and we’ve finished negotiating with the current owners... READ MORE Jul 18, 2017 - Pete Michaud Second Quarter CFAR Newsletter (Cross posted from our alumni mailing list) Hello again! The second quarter of 2017 has come and gone, so it’s time for an update about what CFAR has been up to and what we’re planning. If you missed our newsletter last quarter, here’s a link to catch up! What We Did Finished Workshop Sprint - We finished the last 2 workshops of our 5 workshop sprint! From February through early May we... READ MORE Apr 11, 2017 - Pete Michaud First Quarter CFAR Newsletter (Cross posted from our alumni mailing list) Hey everyone! 2017 has been a busy year for CFAR so far, I’d like to tell you some of what we’ve been up to, and some of the plans we have for the rest of the year. Accomplishments Instructor Pipeline - Last year Duncan Sabien took on the substantial project of creating a system to train a growing number of new, fully-qualified CFAR... READ MORE Nov 28, 2016 - Duncan Sabien Double Crux — A Strategy for Resolving Disagreement (Cross posted to LessWrong) Preamble Double crux is one of CFAR’s newer concepts, and one that’s forced a re-examination and refactoring of a lot of our curriculum (in the same way that the introduction of TAPs and Inner Simulator did previously). It rapidly became a part of our organizational social fabric, and is one of our highest-EV threads for outreach and dissemination, so it’s long overdue for a public, formal... READ MORE Sep 13, 2016 - Anna Salamon Grant from Open Philanthropy Project The Open Philanthropy Project recently announced a grant to CFAR for $1,035,000 across the next two years, earmarked toward a combination of improving our organizational competence, providing scholarships for promising effective altruists and similar folk to attend CFAR workshops, and assisting with SPARC and EuroSPARC. We very much appreciate the grant, and we are looking forward to putting it to work improving CFAR and streamlining SPARC operations. (We recently ran... READ MORE Oct 6, 2015 - Julia Galef Deliberate Grad School A useful post from CFAR co-founder Andrew Critch's personal blog describes how to get the most out of graduate school -- especially if you want to maximize your positive impact on the world. Sample tip (this is 1 of 8): Find a flexible program. PhD programs in mathematics, statistics, philosophy, and theoretical computer science tend to give you a great deal of free time and flexibility, provided you can pass... READ MORE Sep 15, 2015 - Julia Galef Insights from the alumni reunion Is it my imagination, or is there something about being in windswept landscapes -- especially by the water -- that makes it so much easier to come up with new insights? Last month over 100 CFAR alumni from around the world converged on Asilomar State Beach, on the edge of Northern California, for our second annual reunion. And I know I wasn't the only one whose frequency of exclaiming, "Whoa!... READ MORE Aug 19, 2015 - Julia Galef Why learning to fix little "bugs" can make a big difference We spend a fair amount of time at CFAR workshops tackling "bugs" in our daily lives. But does learning to solve small problems really make a big difference? Recent CFAR alum and Oxford student, Ben Albert Pace, posted this thoughtful discussion of the "debugging" mindset on his personal blog. Excerpt below; read the whole thing here. ~ One criticism of the utility of getting better at solving these, is that... READ MORE May 8, 2015 - Julia Galef Back from Boston We're back from running our first-ever rationality workshop in Boston. (Well, actually, a rustic retreat in Harvard, MA, about 50 minutes outside of Boston). We usually try a few new things each time we run a workshop, while keeping most of our tried-and-true features constant. This workshop was no exception. For one, we had an unprecedentedly large cohort of participants: 38 instead of our typical 25, which seemed to work... READ MORE May 5, 2015 - Julia Galef Q&A: Isn't self-deception sometimes productive? We'll be taking people's questions about life, philosophy, and rationality, and giving them our best off-the-cuff answers here on the CFAR blog. Q: "How do we confront the fact that having false beliefs is sometimes more efficient and productive?" A: I'm willing to accept that, in principle, false beliefs can help you achieve your goals. But in practice, I think self-deception is rarely your best option. Basically, the problem with... READ MORE Mar 22, 2015 - Peter McIntyre Taking control of your happiness and productivity What's one thing you can do to improve your physical and mental health, be happier and more successful? Before I tell you the answer, first try answering these questions (interpretation in the footnotes [1]). For each question select the statement (a or b) that you agree with the most. a) Many of the unhappy things in people’s lives are partly due to bad luck. b) People’s misfortunes result from the... READ MORE Mar 2, 2015 - Peter McIntyre Keep Your Identity Fluid Keep your identity small? Why do some discussions involving smart and reasonable people generate such emotive responses and so often go nowhere? Why does this happen more often for politics and religion than for discussing, say, preferred sock colours? In Paul Graham’s essay Keep Your Identity Small, he suggests that these topics are often too close to our identities which can obscure the truth: Do religion and politics have something... READ MORE Feb 4, 2015 - Peter McIntyre 4 Common Prediction Failures and How to Fix Them Our predictions fail in predictably bad ways. Picture the last time you were getting ready to leave the house and you were asked how much longer you would take. And when was the last time you actually left by then? You might be better at this than I am, but I have struggled with forecasting how long it will take. My dad used to account for this, and pretended we... READ MORE Sep 3, 2014 - Kenzi Amodei Dauntless and Divergent In the five months before I saw Divergent, I went to the gym twice. In the five months since then, I’ve been just over fifty times (as well as making forays into interval sprints and Crossfit). A lot of things came together to make that happen, but no small part of it was that I found the movie incredibly inspirational. [Warning: spoilers ahead! You may want to watch a trailer... READ MORE Jun 24, 2014 - Julia Galef A Message to System 1 (A guest post from CFAR April '13 alum Brienne Strohl) I used to be afraid of checking the balance of my bank account. I felt as though finding out how much money I had caused me to lose money, so I'd go weeks, sometimes a month, without checking it--even though my income was tiny and irregular. I'd feel guilty almost any time I bought anything, which led to bizarre spending... READ MORE Jun 16, 2014 - Julia G'''
