ow to better delegate tasks to yourself; How to learn new skills faster; … and lots of other topics that aren’t on the schedule because you’ll learn about them from other participants. Price and Benefits The total cost of attendance is $3,900. That price includes: The four and a half day long workshop itself Room and board starting from the Wednesday evening of opening session, through the Monday morning after the workshop. 200 page handbook, complete with references for further reading Four free follow up coaching calls with a CFAR staff member Access to many alumni community benefits: Free access to coworking space in the CFAR offices in downtown Berkeley At-cost alumni workshops. Small, free or donation-based workshops that are either deeper dives into a particular part of our curriculum, or experimental new material that we want to test Active alumni mailing list Alumni events like our yearly reunion, test sessions, and frequent meetups Mentorship and instructor training. This is selective program for people who are interested in deeply learning the CFAR curriculum and potentially adding to it, and for those who are interested in teaching our material to others Payment plans are available, as well as need-based financial aid. And if you conclude the benefits to your happiness and effectiveness don’t recoup the investment, we’ll refund your money up to a year after you attend the workshop. Some relevant numbers... 9.2 average response, from past participants, to the question “On a scale from 1 (not at all) to 10 (extremely): Are you glad you came to the workshop?” 96 hours of fully immersive instruction 1 to 3 staff to participant ratio, so there’s always someone available before and after class to discuss applying the material in your life Organizations we've collaborated with Read about us on Hacker News Sign Up for A Workshop Now Or read our full workshop FAQ'''
