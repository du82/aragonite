title = "Conduit - Your own chat server"
description = """
Conduit is a simple, fast and reliablechat server powered by Matrix. Conduit is an alternative to Synapse andtries to be lightweight and easy to install, but it is still in development."""
full_description = "What is Matrix? Why Conduit? Links Donate Note: This project is beta. It can be used already, but is missing some smaller features. What is Matrix? Matrix is an open network for secure and decentralized communication. Users from every Matrix homeserver can chat with users from all other Matrix servers. You can even use bridges to communicate with users outside of Matrix, like a community on Discord. Why Conduit? Conduit is a lightweight open-source server implementation of the Matrix Specification with a focus on easy setup and low system requirements. That means you can make your own Conduit setup in just a few minutes. Conduit keeps things simple, it's a single binary with an embedded database and can be much faster than other server implementations in some cases. Conduit uses RocksDB for the database by default. Links Website: https://conduit.rs Git and Documentation: https://gitlab.com/famedly/conduit Chat with us: #conduit:fachschaften.org Donate Liberapay: https://liberapay.com/timokoesters/ Bitcoin: bc1qnnykf986tw49ur7wx9rpw2tevpsztvar5x8w4n Server hosting for conduit.rs provided by the Matrix.org Foundation. Conduit was sponsored by https://manualsbrain.com/ in 2023. Conduit was sponsored by German BMBF for 6 months in 2021. FKZ: 01lS21S11"
year_published = 2025
