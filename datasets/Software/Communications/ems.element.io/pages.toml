description = "Choose the right Element plan for your organisation. Available on-premise or fully-managed in the cloud. Includes optional add-ons."
full_description = "Flexibility between self-hosted or fully-managed in the cloud, with additional collaboration add-ons available. End-to-end encrypted collaboration, messaging and video conferencing. Threads, voice messages, location sharing, read receipts and much more. The Element platform is end-to-end encrypted by default. Configuration options can enable the creation of non-encrypted chat rooms. Automatically create and manage Spaces and user access according to policy definitions stored in backends like LDAP, AD and SCIM. Visible in-room auditing to capture an official record of discussion and decision-making for regulation and compliance purposes. The ability to easily migrate your data, whether self-hosted or fully-managed, protecting from vendor lock-in. Configure rules-based retention policies to meet your organisation's processes and compliance requirements. Use your own custom domain (example.com) for your web address (webchat.example.com) and usernames (@you:example.com)."
