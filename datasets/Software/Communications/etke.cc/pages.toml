title = "etke.cc | Hookshot bridge"
description = "Information about the Hookshot bridge for Matrix offered by etke.cc, and powered by hookshot"
full_description = '''etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpBridgesHookshotHookshot bridgeThe Hookshot bridge installed by us is powered by hookshot. full documentation source code supportHookshot supports integration with popular software project management services such as GitHub , GitLab , JIRA , and Figma , as well as generic webhooks .Below, we describe the basic Hookshot usage for:creating webhooks to receive arbitrary data in Matrix roomssubscribing to RSS/Atom feeds to receive updates in Matrix roomsUsageCreate a room and invite @hookshot:your-server.com. When it joins, type !hookshot help in the chat to see instructions.Make sure the bot is able to send state events (usually the Moderator power level in clients).WebhooksNow that you’ve invited the bot to the room and ensured the permission level is adequate, send a !hookshot webhook yourwebhook room message and you will receive a webhook link in a private message.You can use this link with external systems which support webhooks.To verify that the webhook link works, or to make use of it from your own systems, send a new message via the webhook link. You will need to send a JSON body payload to it which looks like this:{ "text": "Hello world!", "username": "MyBot" } You can test this via curl like so:curl --header "Content-Type: application/json" \ --data '{ "text": "Hello world!", "username": "MyBot" }' \ THE_WEBHOOK_LINK_YOU_RECEIVED_EARLIER For more information about webhook payloads and handling, see the Hookshot documentation about Webhooks .Feeds (RSS, Atom)Now that you’ve invited the bot to the room and ensured the permission level is adequate, send a !hookshot feed URL_HERE message to register a new URL feed. (URL_HERE needs to point to an RSS or Atom feed).To list feeds that the bot currently subscribes to, use !hookshot feed list.To remove feeds from the list, use !hookshot feed remove URL_HERE.For more information about feed handling, see the Hookshot documentation about Feeds .If you need assistanceBefore seeking help, make sure to thoroughly review the documentation. If you still have questions, please don't hesitate to contact bridge's support. Please note that etke.cc Customer Support exclusively handles server-related inquiries. For any questions related to the bridge, please reach out to bridge's support.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now'''
year_published = 2025
