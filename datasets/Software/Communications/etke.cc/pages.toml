["https://etke.cc/news/kyn2o2hccqnb0yfgv2zmmm5wdv-s2j8xwtze6u5wf0c"]
title = "etke.cc | 2024-02-12 09:21 UTC"
description = "New message published on 2024-02-12 09:21 UTC"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 Theme2024-02-12 09:21 UTC🎉 Today marks 3 years of etke.cc! 🎉The etke.cc managed Matrix hosting service was launched on the 12th of February 2021 and has turned 3 years old today!Below, we’d like to show you what improvements have happened over the last year and what’s coming ahead for us.New payment model, more services, more server regionsIn case you’ve missed our large news announcement from December 2023, it’s not too late to learn about it now.To summarize, we have:switched to a new payment/pricing model, which is more sustainablelaunched many of new components and services (see below) and will continue to launch new onescompletely reworked order form - easier for you and for us - a quicker turnaround time when deploying serversbegan offering more powerful servers (using Hetzner Cloud ’s CPX line) and in more geographic locations - including the U.S.We encourage you to read the our original news announcement for more details about these changes.New component additionsIn the past year, we have launched many new Matrix-related and non-Matrix components.If you’d like to use one or more of the components seen below, contact us and we’ll install it to your existing server.New Matrix-related componentsAll of the Matrix components described below are new additions to our stack. Some are installed by default to all servers managed by us, as part of our base Matrix components stack .(free) Sliding-sync - assists next-generation clients like Element X in talking to the homeserver in an optimized manner. This component is installed by default to all servers as part of our base Matrix components stack .(free) Encrypted Bridges - we now offer a checkbox on our order form that globally enables encryption for all bridges that support it. This is experimental and may not work well for some bridges, so we don’t recommend it to everyone.(free) The synapse_auto_compressor tool, which runs in the background and periodically compresses the (Postgres) database for the Synapse homeserver, so that it runs optimally. This component is installed by default to all servers as part of our base Matrix components stack .(free) We’ve switched to exim-relay for delivering emails (optionally via an SMTP relay ) and wired all email-sending components (the Synapse Matrix homeserver and other addons) to it.(free addition to our $5/mo bridge pack) a Google Messages bridge (powered by mautrix-gmessages). The old Google Chat bridge still continues to work.(+$1/mo) the SchildiChat web-based Matrix client - an Element-web fork offering more customization.(+$3/mo) ChatGPT - a Large-Language-Model (LLM) bot that you can talk to via Matrix, based on OpenAI ’s ChatGPT (Requires a separately-obtained OpenAI API key )(+$2/mo) S3 storage support for the Synapse homeserver - for infinite Matrix media storage (Requires a separately obtained AWS S3-compatible object store of your choice)(+$5/mo) Synapse workers - a multi-process homeserver setup to more efficiently handle many users and large rooms (Requires a powerful server - 8+ GB of RAM)We’ve also replaced our Signal bridge (mautrix-signal) offering with the new bridge implementation (complete rewrite from Python to Golang ). New non-Matrix-related components(+$1/mo) [previously-offered and making a comeback] the Miniflux RSS reader(+$1/mo) [previously-offered and making a comeback] the Radicale CalDAV/CardDAV server(+$1/mo) [previously-offered and making a comeback] the Uptime Kuma monitoring system(+$1/mo) [brand new] the Linkding bookmark manager(+$2/mo) [brand new] the Vaultwarden password manager (a lightweight Bitwarden -compatible server which can be used with the Bitwarden client apps)(+$2/mo) [brand new] the Firezone - a VPN server based on WireGuard with a Web UI(+$3/mo) [brand new] the GoToSocial ActivityPub server (a lightweight Mastodon alternative)New or discontinued etke.cc servicesDedicated supportOn the services front, we’re now offering a Dedicated support tier for $100/mo. This is an addition to the free Basic support tier that we offer to all etke.cc customers.The dedicated support tier is useful when your product relies on Matrix and you may require quicker help in case of outages. The main differences with the Basic tier are the dedicated Matrix chat room with etke.cc developers and the higher priority of your requests relative to others.Matrix Rooms SearchWe’ve developed the Matrix Rooms Search tool (naturally, as AGPLv3-licensed free-software). Anyone can run their instance and index the global Matrix Federation.MRS provides a search across room names, topics, etc., allowing for better discoverability of rooms across all of Matrix.We’re making Matrix Rooms Search available to etke.cc customers in 2 ways:The MatrixRooms.info websitePre-configured as an alternative Rooms Directory in ElementMore domain choicesTo those who don’t wish to use their own custom domain for their server, we’ve been offering hosting on etke.cc-owned domains like my-business.etke.host.At the expense of some independence (afforded by having your own custom domain), using etke.cc-owned domains allows people to avoid dealing with domains, DNS, and the cost that comes with that.We now offer hosting on these additional domains:onmatrix.chatkupo.emailmatrix.townmatrix.fanma3x.chatWhen making a new order , you can claim your subdomain on any of these domains and get your Matrix server deployed more quickly and easily (no DNS configuration required on your side).Discontinuing our Custom Consulting/Development serviceWe used to offer a Custom Consulting/Development service - helping people with custom deployments or integrations on top of Matrix.We have discontinued this service in order to free up time and let us focus on improving etke.cc for everyone. This is part of the reason why we have so many major improvements to announce in this birthday post.Improved internalsBesides the many new components, services and tools, we’ve also done a lot of internal work - improving reliability and performance.Below are some of the important internal changes we’ve done:The Scheduler :Automatic HTTP, DNS, and port checks, including federation tests, on run ping and run maintenanceCumulative alerts - we combine multiple failure alerts into a single message that we deliver via Matrix and emailImproved deliverability of emails, thanks to sending them via PostmarkFull overhaul of the agent/worker (injector) part making it blazing-fast and decreasing the delay (to milliseconds) between receiving a command from the user and executing itHuge refactoring of the codebaseMany automation improvements, allowing us to more quickly and easily install new serversServer Maintenance:Automatic Postgres database vacuuming on each maintenance runAutomatic Postgres database tuning (based on PGTune ’s calculaton logic) which takes into account your server’s configuration and installed componentsNetworking: reworked Matrix stack networking for improved security, performance and ease of plugging-in new services (we’ve migrated from nginx to Traefik )Emails: we’ve also configured DKIM , SPF and rDNS for customers hosted on our (Hetzner Cloud ) servers - this improves outgoing email deliverability for big providers like Google (see New Gmail protections for a safer, less spammy inbox )Free-software workWe’ve also done a lot of work on a new free-software (AGPLv3) Ansible mega-playbook - mash-playbook , which currently includes 80+ components. Many of these began their life at etke.cc, while others were developed by us (or by the community) later on. Some of these components will be offered as addon components to etke.cc customers in the future. There are no technical difficulties to offering all of them immediately, but supporting a new component is not so simple - it requires documentation, commitment, support-staff training, etc.Components from mash-playbook and the matrix-docker-ansible-deploy playbook are at the core of our automation (etke/ansible ), powering all servers managed by us.As part of our work over the past year, we have also developed and released as free-software (AGPLv3) the following new tools:MRS - Matrix Rooms Search, the backend that powers our MatrixRooms.info service (discussed above)A.G.R.U - a command-line tool like ansible-galaxy , but fasteransible-ssh - a command-line tool (wrapper around ssh) that makes it easy to SSH into hosts found in an Ansible inventory fileradicale-auth-matrix - an adapter that connects Radicale ’s user authentication system to MatrixNumbers!We’ve installed 243 new Matrix serversPushed 461 updates and enhancements to the automation framework used as the service corePosted 60 updates in the announcements room, so you’re always up-to-date with what we’re working onIf you’re curious to travel back in time, here are posts from previous etke.cc birthdays:2 years celebration post1 year celebration postSourceDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
