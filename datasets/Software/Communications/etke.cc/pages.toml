["https://etke.cc/help/extras/smtp-relay"]
title = "etke.cc | SMTP Relay service"
description = "Explore our SMTP Relay service, an optional enhancement for your Matrix server hosting. Learn when SMTP Relay is needed, such as for email confirmation, notifications, and email bridges. Discover the advantages of using an SMTP relay, especially in cases of network restrictions and IP address reputation concerns. Set up SMTP Relay by providing your SMTP server details or consider our Email Hosting service for a hassle-free solution. We offer the flexibility and support to ensure your Matrix server seamlessly handles email functionality."
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpExtra ServicesSMTP RelaySMTP Relay serviceIntroductionOur SMTP Relay service is an additional offering to enhance your Matrix server hosting experience. While it’s not critical to the core functionality of your Matrix server, there are specific scenarios in which it becomes valuable.When You Need SMTP RelaySending outgoing emails may not be a core requirement for all Matrix servers. However, there are instances where your Matrix homeserver may need to send out emails:Email Confirmation: When users add email addresses to their profiles, the server sends an email confirmation link to verify mailbox ownership.Email Notifications: Users who enable email notifications for unread rooms may receive periodic “Here’s what you’ve missed” emails.Postmoogle Email Bridge: If users utilize the Postmoogle email bridge , your server may be involved in sending outgoing emails through it.Why Use SMTP RelayBy default, your Matrix server attempts to send outgoing emails directly. In many cases, this direct approach works seamlessly. However, there are specific situations where using an SMTP relay is advantageous:Network Restrictions: Some networks and VPS providers may block outgoing port 25, hindering the direct delivery of emails.IP Address Reputation: If the IP address reputation of your server is less than optimal, it can affect email deliverability.In such circumstances, opting for an SMTP relay offers a reliable solution.How to Set Up SMTP RelayIf you find the need for your Matrix server to utilize an SMTP relay for sending outgoing emails, you have two options:Provide Your SMTP Server: You can supply us with the address and credentials of an SMTP server you own, whether it’s on your infrastructure or a service like SendGrid , among others.Email Hosting Service: Alternatively, you can leverage our Email Hosting service . If you choose this option, we’ll configure your Matrix server to use the SMTP relay through our email hosting service. In this case, SMTP Relay is included at no extra cost.We aim to provide the flexibility and support you need to ensure your Matrix server operates seamlessly, even when it comes to email functionality.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
