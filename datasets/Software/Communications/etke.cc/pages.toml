title = "etke.cc | IRC bridge"
description = "Information about the IRC bridge for Matrix offered by etke.cc, and powered by heisenbridge"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpBridgesIRCIRC bridgeThe IRC bridge installed by us is powered by heisenbridge. full documentation source code supportHeisenbridge brings IRC to Matrix by creating an environment where every user connects to each network individually like they would with a traditional IRC bouncer.UsageStart a chat with @heisenbridge:your-server.com. When it joins, type help in the chat to see instructionsSend addnetwork network.name to the bridge bot, eg: addnetwork libera.chatSend addserver network.name irc-server.address port --tls to the bridge bot, eg: addserver libera.chat irc.libera.chat 6697 --tlsSend open network.name to the bridge bot, eg: open libera.chat. The bridge bot will create a control room for that IRC network and invite youIn the new room, read the bot instructions in the first room message and configure it as you wish, after that send connectSend join #room-name to the bot to bridge into an IRC roomPro Tip! You can allow other users (even from other homeservers) to use your bridge by sending addmask @user:some-server.com or even addmask *:other-server.com to the botIf you need assistanceBefore seeking help, make sure to thoroughly review the documentation. If you still have questions, please don't hesitate to contact bridge's support. Please note that etke.cc Customer Support exclusively handles server-related inquiries. For any questions related to the bridge, please reach out to bridge's support.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
