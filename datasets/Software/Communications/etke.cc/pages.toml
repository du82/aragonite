title = "etke.cc | Buscarron bot"
description = "Allows forms you add to your website to be submitted to a Matrix room of your choice."
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpBotsBuscarronBuscarron bot made by etke.ccThe Buscarron bot installed by us is powered by buscarron. full documentation source code supportBuscarron - Matrix Bot for Secure Form SubmissionsBuscarron is a Matrix bot developed by etke.cc , which allows forms you add to your website (static or dynamic) to be submitted to a Matrix room of your choice. Submission happens via HTTP POST to a URL endpoint that the Buscarron bot exposes.Buscarron provides a robust and customizable solution for securely handling form submissions within the Matrix ecosystem.FeaturesSecure CommunicationBuscarron ensures end-to-end encryption, providing a secure channel for data transmission and maintaining user privacy.Form Submission HandlingReceive HTTP POST forms and JSON submissions within Matrix rooms, and then redirect successful and failed submissions to different target pages.Spam preventionVarious spam prevention mechanisms are in place, starting from standard rate limiting and even doing SMTP validation on email fields in the form payload.Customizable matrix messagesSupporting Go templates to define your own messages formatConfirmation emails using PostmarkSay “Thank you!” automatically ;)Prometheus metricsThe bot exposes a Prometheus -compatible /metrics endpoint, protected with HTTP basic auth and an IP whitelist.If you need assistanceBefore seeking help, make sure to thoroughly review the documentation. If you still have questions, please don't hesitate to contact bot's support. Please note that etke.cc Customer Support exclusively handles server-related inquiries. For any questions related to the bot, please reach out to bot's support.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
