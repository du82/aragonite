["https://etke.cc/news/page/8"]
title = "etke.cc | News"
description = "copy of #news:etke.cc room messages"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeNewsThis page contains copy of #news:etke.cc room messages, but you may use RSS , or Fediverse to get them. Additionally, you may check News Archive for full list of messages.2023-10-31 15:38 UTCServers Update In Progress (Security Fix)Synapse 1.95.0 -> 1.95.1Cached device information of remote users can be queried from Synapse. This can be used to enumerate the remote users known to a homeserver.Details#discussion:etke.ccSource2023-10-26 19:48 UTCStable Updates PublishedCinny 2.2.6 -> 3.0.0Element / app.etke.cc 1.11.46 -> 1.11.47Grafana 10.1.5 -> 10.2.0Nginx 1.25.2 -> 1.25.3Synapse 1.94.0 -> 1.95.0This update fixes the recent Jitsi auth issues, but the fix may require reset of the existing internal jitsi accounts if you use internal jitsi auth.Service Updates: Embrace the Matrix Federation directly from Element WebStarting with this update, the Element Web app we offer on app.etke.cc and install on customers’ servers includes native integration with the #mrs:etke.cc project - a fully-featured Matrix rooms search engine working across federation - using the MatrixRooms.info demo instance. That means, you can find brilliant Matrix communities from other matrix servers without even leaving your client app.Note: #mrs:etke.cc implementation of Matrix Federation API is in testing phaseService Updates: MSC1929 enabled by default for new customersMatrix admin contacts MSC provides a way to contact server owners in case of issues. From now on, we enable MSC1929 integration by default for all new customers, leaving existing customers unaffected (you can request enabling MSC1929 for your server using etke.cc/contacts ):If base domain is served from your matrix server, then you only need to ask us to enable integration.If you’re serving base domain from any other server, you will need to set up one more redirect, for the new /.well-known/matrix/support file (https://your-server.com/.well-known/matrix/support -> https://matrix.your-server.com/.well-known/matrix/support). This redirect should be configured the same way you’ve already configured redirects for the client and server files.In any case, if you’d like to adjust your contact information (Matrix ID or email address) which will be published in the new /.well-known/matrix/support file, please let us know.Service Updates: Scheduler ’s ping MSC1929 integrationrun ping of etke.cc/scheduler got MSC1929 integration as well, so it will check if the support file is valid and not empty, but check’s status won’t be considered as failed because MSC1929 is completely optional.#discussion:etke.ccSource2023-10-19 20:04 UTCStable Updates PublishedBorgmatic 1.8.2 -> 1.8.3Discord bridge 0.6.2 -> 0.6.3Google Messages bridge 0.2.0 -> 0.2.1Grafana 10.1.4 -> 10.1.5Exim 4.96-r1-0 -> 4.96.2-r0-0Miniflux 2.0.48 -> 2.0.49Prometheus 2.47.1 -> 2.47.2WhatsApp bridge 0.10.2 -> 0.10.3Service Updates: Automatic Database Tuning during the MaintenanceStarting from this update, each maintenance run will perform automatic Postgres tuning, calculated based on customers’ server configuration.Service Updates: Consultation Service Has Been RetiredWe do not offer Consultations anymore - that service wasn’t popular, and it was decided that focus on technical enhancements (like the db tuning above) will provide more benefits to our customers#discussion:etke.ccSource2023-10-12 20:29 UTCStable Updates PublishedCoturn 4.6.2-r4 -> 4.6.2-r5Element / app.etke.cc 1.11.45 -> 1.11.46Sliding Sync 0.9.10 -> 0.9.11Synapse 1.93.0 -> 1.94.0Traefik 2.10.4 -> 2.10.5Uptime Kuma 1.23.2 -> 1.23.3Service Updates: etke.cc ’s Ssh Keys Have Been RotatedNew keys are published on etke.cc/ssh.key and already installed on all customers’ servers. That’s an automatic process, you don’t need to do anything#discussion:etke.ccSource2023-10-10 14:04 UTCServers Update In Progress (Security Fix)Synapse 1.93.0 -> 1.94.0Fix for a moderate severity security issue for the Synapse homeserver component.Details#discussion:etke.ccSource2023-10-05 20:00 UTCStable Updates PublishedBorg 1.2.4 -> 1.2.6Element / app.etke.cc 1.11.44 -> 1.11.45Google Chat bridge 0.5.0 -> 0.5.1Grafana 10.1.2 -> 10.1.4#postmoogle:etke.cc 0.9.15 -> 0.9.16Prometheus 2.47.0 -> 2.47.1Service Updates: New Domain NameThe new kupo.email joins the etke.host and onmatrix.chat domains available for order for new customers. Now you can get a matrix server with MXIDs like @postmoogle:fan.kupo.email with no extra feeService Updates: MatrixRooms.info Got MSC1929 IntegrationThis is the first matrix project that integrates the admin contacts proposal at scale. Currently, it works with email addresses only, so when a room is reported on MatrixRooms.info , the report details will be sent to the homeserver owner of the room’s server if that server provides email address(-es) in the support file#discussion:etke.ccSource2023-09-28 19:41 UTCStable Updates PublishedElement / app.etke.cc 1.11.43 -> 1.11.44Etherpad 1.9.2 -> 1.9.3Hookshot 4.4.1 -> 4.5.1Jitsi 8960 -> 8960-1#postmoogle:etke.cc 0.9.14 -> 0.9.15Synapse 1.92.3 -> 1.93.0#discussion:etke.ccSource2023-09-21 20:04 UTCStable Updates PublishedDiscord bridge 0.6.1 -> 0.6.2Facebook bridge 0.5.0 -> 0.5.1Google Messages bridge 0.1.0 -> 0.2.0Grafana 10.1.1 -> 10.1.2Instagram bridge 0.3.0 -> 0.3.1Jitsi 8922-1 -> stable-8960Linkedin 0.5.4 -> latestMiniflux 2.0.47 -> 2.0.48Prometheus Postgres Exporter 0.13.2 -> 0.14.0Synapse 1.92.1 -> 1.92.3Twitter bridge 0.1.6 -> 0.1.7Uptime Kuma 1.23.1 -> 1.23.2WhatsApp bridge 0.10.0 -> 0.10.2synapse and the vast majority of the bridges updates were already installed previously as part of off cycle security fixesService Updates: Customer Support is available nowIn the past, our subscription plans didn’t include customer support. The etke.cc/contacts page on our website was mainly for getting in touch in cases of service issues.But here’s the deal: we’ve been spending a lot of developer time each month helping you with all sorts of questions, even some things we can’t control. This has sometimes taken away from our core work of improving and maintaining our services.To keep our Matrix hosting services affordable and sustainable, we’ve decided to be clear about what we can help you with. We’ve created the etke.cc/services/support page, where you can find all the details about customer support and what you can expect from us.In a nutshell, all our subscription plans now include the “Basic” support level , which gives you some reasonable customer assistance (up to 4 support requests per month). If you’re a business customer, we’re offering an even better “Dedicated” support option , with faster response times and more support requests per month. Soon, when you visit our new order form on the website, you’ll be able to choose your support plan instead of being stuck with basic support.We appreciate your understanding, and we’re committed to providing you with top-notch service.#discussion:etke.ccSource2023-09-19 19:42 UTCServers Update In Progress (More Security Fixes)Facebook bridge 0.5.0 -> 0.5.1Linkedin 0.5.4 -> latestInstagram bridge 0.3.0 -> 0.3.1Telegram bridge 0.14.1 -> 0.14.2Twitter bridge 0.1.6 -> 0.1.7WhatsApp bridge 0.10.1 -> 0.10.2Those updates related to the same security issue with webpDetails#discussion:etke.ccSource2023-09-18 15:19 UTC (updated)Servers Update In Progress (Another Security Fix)Synapse 1.92.2 -> 1.92.3It turns out that libwebp is bundled statically in Pillow wheels so we need to update this dependency instead of libwebp package at the OS level.Details#discussion:etke.ccSource«««4567891011»»»Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
