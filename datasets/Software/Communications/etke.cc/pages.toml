["https://etke.cc/help/distro-upgrade"]
title = "etke.cc | Linux Distribution Upgrade"
description = "Learn how to upgrade the Linux Distribution of your Matrix server. This step-by-step guide covers the process of upgrading your server's OS, including the necessary preparations, the upgrade itself, and post-upgrade steps."
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeLinux Distribution UpgradeIf you ever need to upgrade your Matrix server’s host OS (distribution) from one major version to another, you can contact us and we will handle the upgrade for you for a one-time fee. We will take care of the entire process, ensuring your server is fully operational.However, if you prefer to do it yourself at no extra cost, we will guide you through the process.UbuntuPlease, use LTS (Long Term Support) versions of Ubuntu only. We recommend using the latest LTS version available at the time of installation.1. BackupHosting customers: contacts us and ask us to perform a full server backup (snapshot)On-premises customers: Make sure to back up your server before proceeding. All cloud providers have some kind of backup functionality and make snapshots either automatically or on-demand (manually)2. Fallback portDuring the upgrade process, the SSH process on your host may be restarted and you may lose connectivity.The upgrade process usually opens another fallback SSH port (1022) that may be used to get back to the upgrade process. The port will be opened automatically, but you need to update firewall(-s) to allow incoming connections to this port.Ensure the screen utility is installed on your system to be able to resume the session .Hosting customers:Contacts us and ask to allow SSH connections to the fallback portUpdate the on-server firewall to allow incoming connections to the fallback port: ufw allow 1022/tcpOn-premises customers:Update your provider-level firewall rules to allow connectivity to the 1022 (TCP) port, if you have oneUpdate the on-server firewall to allow incoming connections to the fallback port: ufw allow 1022/tcp3. Update the systemBefore performing the actual distribution upgrade, make sure your system is up-to-date:# Update the package list apt-get update # Upgrade the system packages apt-get dist-upgrade You may reboot your server after this step, if apt output suggests so.4. Upgrade to the new releaseFinally, run the upgrade command:do-release-upgrade Follow the on-screen instructions - they are quite straightforward.Post-upgrade stepsAfter the upgrade is complete, we strongly suggest to run maintenance to ensure your server is properly configured. If your Matrix server happens to be down after the upgrade, contact us and we will help you bring it back online.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
