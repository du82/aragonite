title = "etke.cc | LinkedIn bridge"
description = "Information about the LinkedIn bridge for Matrix offered by etke.cc, and powered by beeper-linkedin"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpBridgesLinkedInLinkedIn bridgeThe LinkedIn bridge installed by us is powered by beeper-linkedin. full documentation source code supportUsageStart a chat with @linkedinbot:your-server.com. When it joins, type help in the chat to see instructionsLogin (recommended)Send login your@email.here to the bridge botSend your password in the next messageIf you have 2FA enabled, the bot will ask you to send the 2FA token.Recent chats should now get portals automatically. Other chats will get portals as you receive messages.Note: If you don’t have 2FA enabled and are logging in from an unknown/strange IP for the first time, LinkedIn will send an email with a one-time code. You can use this code to authorize the bridge session. Usually, once the IP is authorized, you will not be asked again.Login (manual)In case of recommended login didn’t work, you can login manually using li_at and jsessionID cookies.Open linkedin website and login to your account.Go to the dev tools Storage tab to get a list of cookiesFind the li_at and jsessionID cookies’ valuesSend login-manual <li_at> <jsessionID>Recent chats should now get portals automatically. Other chats will get portals as you receive messages.If you need assistanceBefore seeking help, make sure to thoroughly review the documentation. If you still have questions, please don't hesitate to contact bridge's support. Please note that etke.cc Customer Support exclusively handles server-related inquiries. For any questions related to the bridge, please reach out to bridge's support.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
