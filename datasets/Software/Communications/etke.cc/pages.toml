full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 Theme2024-04-04 20:01 UTCStable Updates PublishedBorg 1.2.7 -> 1.2.8Borgmatic 1.8.6 -> 1.8.9Funkwhale 1.4.0 newMiniflux 2.1.1 -> 2.1.2Peertube 6.0.3 newSynapse 1.103.0 -> 1.104.0Service Updates: Email DeliverabilityWe continue working on improving email deliverability from your matrix servers. With this update, the outgoing email queue was made persistent, so emails won’t be lost due to restarts or temporary downtimes.Service Updates: Extras UpdatesWe’ve restructured the extras page, added missing quick start guides, and divided all items into sensible sectionsService Updates: List of Deprecated Components was updatedThe list was extended with Facebook (mautrix-facebook) and Instagram (mautrix-instagram) bridges, as they were archived by their devs on March 2024, and superseded by Facebook (mautrix-meta) and Instagram (mautrix-meta) bridges.Quick start guides of the deprecated bridges contain migration guides for your convenienceService Updates: New Component - FunkwhaleA new component is available for order - Funkwhale is a self-hosted audio player and publication platform. It enables users to build libraries of existing content and publish their own. It uses the ActivityPub protocol to talk to other apps across the Fediverse. Users can share content between Funkwhale pods or with other Fediverse software.Funkwhale is available for new and existing customers for +$5/monthService Updates: New Component - PeertubeA new component is available for order - Peertube is a self-hosted video platform over Fediverse, similar to Funkwhale. And as with Funkwhale it allows building libraries of existing content from Fediverse and publish your own.Additionally, Peertube supports S3-compatible storage, so you don’t need to worry about the disk space utilizationPeertube is available for new and existing customers for +$5/month#discussion:etke.ccSourceDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
