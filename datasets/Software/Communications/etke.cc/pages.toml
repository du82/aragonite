description = "copy of #news:etke.cc room messages"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeNewsThis page contains copy of #news:etke.cc room messages, but you may use RSS , or Fediverse to get them. Additionally, you may check News Archive for full list of messages.2021-12-14 19:01 UTCservers update in progressFacebook bridge latest will be updated with latest version again, because of important bugfixes, not included in pinned version yetJitsi 6173 -> 6726 some changes were added to the auth flow, should not cause any issuesMjolnir 1.1.20 -> 1.2.1#miounne:etke.cc 2.2.0 -> 2.2.1Synapse 1.48.0 -> 1.49.0previous updates (already installed during off cycle deploys):Element web 1.9.6 -> 1.9.7Grafana 8.3.0 -> 8.3.1Automatic database backups enabled by default for all subscribers’ servers (configuration: 7 daily, 0 weekly, 0 monthly = 7 total/max), including turnkey/hosting. That was a pretty common request because not all hosting providers have automatic backup feature. Please, keep in mind that backups will require some disk space.If you don’t want the automatic backups and/or you want to change the configuration for it - just send me a PM#discussion:etke.ccSource2021-12-13 16:10 UTCoff cycle servers update in progressdue to security fix in matrix-js-sdk (part of Element web)#discussion:etke.ccSource2021-12-13 15:24 UTC<@neb_rssbot=40aine=3aetke.cc:matrix.org> matrix.org: Disclosure: buffer overflow in libolm and matrix-js-sdk ( https://matrix.org/blog/2021/12/13/disclosure-buffer-overflow-in-libolm-and-matrix-js-sdk )Element web 1.9.7 is not released at this moment, waiting for the release…Source2021-12-11 18:16 UTCoff cycle servers update in progressDue to security fixes in signal daemon (not the bridge itself, but component of; uses log4j) and grafana (CVE-2021-43798)#discussion:etke.ccSource2021-12-07 18:38 UTC@room service updatessorry for that notification/mention, but the information below is quite important and we want to be sure that every customer will get it as soon as possible. Subscribers will receive a copy of that message through BMC notification as well.Due to recent changes with payment processing options and discounting of PayPal there were some concerns and questions we had. Now we have answers.Will minimal prices and PWYW model change to address new payment processor fees? - NO. Prices will stay the same. Of course, fees are higher, but they are still manageable and have a way to somehow optimize the processing cost, so there will be no changes in minimal pricing.Should subscribers to do something due to payment processor changes? YES. Unfortunately, PayPal stops payments processing on their side, so your existing subscriptions are affected. Please, follow the BMC guide to change payment method from PayPal to Credit/Debit Card, Apple Pay or Google Pay . Good news - no more throwaway accounts, because you have ability to change your payment settings without re-creating BMC accountWill subscribers receive updates today even if subscription failed/automatically canceled due to PayPal issues? YES. All subscribers’ servers are updating right now, no need to worry.Updated “discounting PayPal” FAQ on BMC if you want to get more info.If you have any questions - please, ask them in #discussion:etke.cc roomSource2021-12-07 18:04 UTCservers update in progressCorporal 2.2.1 -> 2.2.2Element 1.9.5 -> 1.9.6Facebook bridge 0.3.2 -> latest bugfix released for the broken login, but it was not included in a pinned release yet, so installing latest version to fix the login flow for new users (existing/already logged in users are not affected by that bug)Grafana 8.2.2 -> 8.3.0Prometheus 2.30.2 -> 2.31.1Redis 6.2.4 -> 6.2.6#discussion:etke.ccSource2021-12-01 16:55 UTC (updated)service updatesDue to discounting PayPal on buymeacoffee side , any new payments (both recurring, like new maintenance subscriptions, and one time, like setup or support) will be processed through stripe and payoneer.from BMC FAQ (link above):Will my membership renewals be affected? First off, please note that this applies only to creators who have active members (monthly recurring payments via PayPal). Membership payment renewals won’t be affected as per our knowledge. However, we recommend suggesting your members to resubscribe whenever you’re ready.so, no need to worry for existing subscribers.I don’t like the situation and forced changes to payment processing (we already had issues with recurring payments with stripe+payoneer before), but that’s the only way we have.Due to unexpected and urgency of the situation, we don’t have any other info to share. There are some concerns regarding fees, but we will review them soon and if stripe+payoneer fees are higher than paypal, prices may be increased to cover that (we do NOT increasing them, just need some time to review the terms we were forced to accept), fun fact: your $5 payment is $4 for us (and $1 is a fee)If you have any questions - ask them in #discussion:etke.cc so other customers may read them, too (keep in mind, that we don’t have answers right now and have almost the same info that you have).Source2021-11-30 16:04 UTCservers update in progressIRC (heisenbridge) 1.7.0 -> 1.7.1Mailer (exim) 4.94.2-r0-5 -> 4.95-r0Telegram 0.10.1 -> 0.10.2Synapse 1.47.1 -> 1.48.0#discussion:etke.ccSource2021-11-23 13:02 UTCservers update in progressnew versions:Element 1.9.4 -> 1.9.5Exim 4.94.2-r0-4 -> 4.94.2-r0-5IRC (heisenbridge) 1.6.0 -> 1.7.0Synapse 1.46.0 -> 1.47.1Matrix Corporal 2.1.4 -> 2.2.1configuration changesall servers:log level set to warning for all actual bridges to prevent sensitive messages leaks in logs and decrease disk utilizationservers with #miounne:etke.cc and matrix-registration:notification about the used token has been enabled. Keep in mind that it’s an experimental feature (fully covered by tests, but still), so in case of any problems post them to the #miounne:etke.cc room and/or directly to the https://etke.cc/miounne issuesonly for NEW customers:identity server not installed by defaultexim mailer not installed by defaultsynapse (matrix homeserver) will be used to send emails in case of SMTP-relayBoth identity server (ma1sd) and mailer (exim) are battle-tested and work well, but nobody needs them. In 99% of cases, you want email verification and notifications, that’s it. Of course, for specific cases, like phone number verification we will install identity server and related services and of course, we continue to support them on existing installations. Just keep in mind that the latest identity server release was on April 16, and it’s not ready for Matrix 1.1 spec release. So we will not set up ma1sd and exim (used by ma1sd only in most cases) by default. We will continue to support them and install them on request.These changes are NOT applied to existing customers and will be used for new homeservers only. But if you want to apply them on your server (eg: to free some compute power) - send me a PM.#discussion:etke.ccSource2021-11-18 12:02 UTC<@neb_rssbot=40aine=3aetke.cc:matrix.org> matrix.org: Synapse 1.47.0 released ( https://matrix.org/blog/2021/11/17/synapse-1-47-0-released )Due to late release and planned security fix release on the next Tuesday, no off cycle deployment will be done.Source«««1718192021222324»»»Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
