["https://etke.cc/news/jbqypx41h8poakgco6o8x6-eckr8lmt9qvq2qgu9xgc"]
title = "etke.cc | 2024-09-26 20:00 UTC"
description = "New message published on 2024-09-26 20:00 UTC"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 Theme2024-09-26 20:00 UTCStable Updates PublishedBaibot : latest -> v1.1.1Element : v1.11.77 -> v1.11.78Etherpad : 2.2.2 -> 2.2.5Synapse Admin : v0.10.3-etke14 -> v0.10.3-etke17Service Updates: Customer Support changesWe wanted to inform you about important changes in how we handle support. Over the years, we’ve been accessible through various channels—Email, Matrix, Telegram, Fediverse—but technical challenges (SSL certificate issues, encryption troubles with Matrix bots, missing notifications, etc.) have complicated things for both you and us.To improve this, we’re consolidating all support into a single system using FreeScout (a great open-source helpdesk). While we’ll be retiring the old contact methods, rest assured that these existing methods will continue to work for now. However, we encourage you to start using the new options for a more streamlined experience.From now on, here’s how you can contact us:Email us directly using our new email address (all emails go directly into FreeScout).Click the Contact support button in your Synapse-Admin (details below).Submit a support request using the form on our contacts page .Use the Support Portal to manage your support requests.All these methods lead to the same support queue in FreeScout, ensuring consistent and timely responses regardless of the interface you choose to use. This new setup allows us to better track and respond to your requests more efficiently.Additionally, after the next maintenance run , you’ll notice a new Contact support button in Synapse-Admin , which will take you directly to the support portal.Service Updates: Synapse-Admin SafeguardsA while ago, we announced our Synapse-Admin fork to provide more features and quality-of-life improvements for our customers.We’ve already implemented an extensive list of changes , and starting this week, a new safeguard has been introduced: system-managed users (like bots, bridge puppets, etc.) will have restricted modification capabilities in Synapse-Admin. Altering these users has historically led to serious problems—sometimes even requiring full server reinstallation. To prevent this, we’ve now disabled dangerous actions (e.g., password changes, account locking, deactivation, erasure) by default, while allowing safer changes (like updating display names and avatars).Please note that the list of system-managed users will vary by server. You can review your server’s list by checking the configuration at https://matrix.your-server.com/synapse-admin/config.json (you may need to reload the page to refresh the cache).SourceDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
