full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 Theme2021-11-23 13:02 UTCservers update in progressnew versions:Element 1.9.4 -> 1.9.5Exim 4.94.2-r0-4 -> 4.94.2-r0-5IRC (heisenbridge) 1.6.0 -> 1.7.0Synapse 1.46.0 -> 1.47.1Matrix Corporal 2.1.4 -> 2.2.1configuration changesall servers:log level set to warning for all actual bridges to prevent sensitive messages leaks in logs and decrease disk utilizationservers with #miounne:etke.cc and matrix-registration:notification about the used token has been enabled. Keep in mind that it’s an experimental feature (fully covered by tests, but still), so in case of any problems post them to the #miounne:etke.cc room and/or directly to the https://etke.cc/miounne issuesonly for NEW customers:identity server not installed by defaultexim mailer not installed by defaultsynapse (matrix homeserver) will be used to send emails in case of SMTP-relayBoth identity server (ma1sd) and mailer (exim) are battle-tested and work well, but nobody needs them. In 99% of cases, you want email verification and notifications, that’s it. Of course, for specific cases, like phone number verification we will install identity server and related services and of course, we continue to support them on existing installations. Just keep in mind that the latest identity server release was on April 16, and it’s not ready for Matrix 1.1 spec release. So we will not set up ma1sd and exim (used by ma1sd only in most cases) by default. We will continue to support them and install them on request.These changes are NOT applied to existing customers and will be used for new homeservers only. But if you want to apply them on your server (eg: to free some compute power) - send me a PM.#discussion:etke.ccSourceDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or