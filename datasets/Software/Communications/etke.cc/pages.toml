["https://etke.cc/news/page/2"]
title = "etke.cc | News"
description = "copy of #news:etke.cc room messages"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeNewsThis page contains copy of #news:etke.cc room messages, but you may use RSS , or Fediverse to get them. Additionally, you may check News Archive for full list of messages.2024-11-07 21:00 UTCStable Updates PublishedBorg: 1.2.8 -> 1.4.0Borgmatic: 1.8.13 -> 1.9.0Element : v1.11.83 -> v1.11.84Gotosocial : 0.17.0 -> 0.17.2Ntfy : v2.10.0 -> v2.11.0Postmoogle : v0.9.23 -> v0.9.24Prometheus : v2.54.1 -> v2.55.1Synapse Admin : v0.10.3-etke26 -> v0.10.3-etke29Traefik : v3.1.3 -> v3.2.0Service Updates: Deprecating Sliding-Sync ProxyFinally, the Sliding Sync MSC got a Synapse-native implementation in the form of Simplified Sliding Sync MSC , and client apps are updated to use it; thus we’re starting a multistep process of removal of the old Sliding Sync implementation (powered by the Sliding Sync Proxy).With this update, Sliding Sync Proxy’s URL has been removed from /.well-known/matrix/client, causing new sessions to use Synapse’s native Sliding Sync endpoints instead.In the future, the Sliding Sync Proxy component will be disabled and removed from all servers.NOTE: Please keep in mind that Sliding Sync is not part of the Matrix protocol yet, nor its implementations are stable. If you use Sliding Sync with your client apps, you may and will face bugs and issues, that’s expected. If you don’t want to have such issues - do not use Sliding Sync in your client apps (some apps, like Element X, work only with Sliding Sync)Source2024-10-31 21:00 UTCStable Updates PublishedElement : v1.11.82 -> v1.11.83Etherpad : 2.2.5 -> 2.2.6Miniflux : 2.2.1 -> 2.2.2Peertube : v6.3.2 -> v6.3.3Postmoogle : v0.9.21 -> v0.9.23Radicale : 3.3.0.0 -> 3.3.0.1Synapse : v1.117.0 -> v1.118.0Synapse Admin : v0.10.3-etke25 -> v0.10.3-etke26Vaultwarden : 1.32.2 -> 1.32.3Source2024-10-24 20:00 UTCStable Updates PublishedElement : v1.11.81 -> v1.11.82Gotosocial : 0.16.0 -> 0.17.0Hydrogen : v0.5.0 -> v0.5.1Jitsi : stable-9753 -> stable-9779Synapse Admin : v0.10.3-etke20 -> v0.10.3-etke25Service Update: Synapse Admin changesWith this update, Synapse Admin UI has been changed, here are some highlights. Apart from small QoL changes like user profile added to the top menu , separate login button for access token auth , and fixed room state display , there are more significant changes:Visual customizations have been enabled - now you can control what you see in most of the tables/datagridsCustom menu items with common links were added - like your server’s updates, self-service bot, link to the help pages and contacts. Previously, there was a Contact support button, but it was replaced with this new featureAnd the fork got its own community support room: #synapse-admin:etke.ccSource2024-10-17 20:00 UTCStable Updates PublishedCinny : v4.2.1 -> v4.2.2Element : v1.11.80 -> v1.11.81Gmessages : v0.5.0 -> v0.5.1Grafana : 11.1.7 -> 11.2.2Meta Instagram : v0.4.0 -> v0.4.1Meta Messenger : v0.4.0 -> v0.4.1Radicale : 3.2.3.1 -> 3.3.0.0Signal : v0.7.1 -> v0.7.2Slack : v0.1.1 -> v0.1.2Synapse : v1.116.0 -> v1.117.0Synapse Admin : v0.10.3-etke19 -> v0.10.3-etke20Vaultwarden : 1.32.1 -> 1.32.2Whatsapp : v0.10.9 -> v0.11.0Source2024-10-15 12:25 UTCServers Update In Progress (Security Fix)Element v1.11.80 -> v1.11.81Potential access token exposure to malicious third parties via untrusted widgetsDetails#discussion:etke.ccSource2024-10-10 20:00 UTCStable Updates PublishedElement : v1.11.79 -> v1.11.80Peertube : v6.3.0 -> v6.3.2Sygnal : v0.15.0 -> v0.15.1Synapse Admin : v0.10.3-etke18 -> v0.10.3-etke19Source2024-10-03 20:17 UTC (updated)Stable Updates PublishedBaibot : v1.1.1 -> v1.3.1Element : v1.11.78 -> v1.11.79Grafana : 11.1.4 -> 11.1.7Languagetool : 6.4 -> 6.5Miniflux : 2.2.0 -> 2.2.1Synapse : v1.115.0 -> v1.116.0Synapse Admin : v0.10.3-etke17 -> v0.10.3-etke18Nginx : 1.27.1-alpine -> 1.27.2-alpineUptime Kuma : 1.23.13 -> 1.23.15Vaultwarden : 1.32.0 -> 1.32.1Source2024-09-26 20:00 UTCStable Updates PublishedBaibot : latest -> v1.1.1Element : v1.11.77 -> v1.11.78Etherpad : 2.2.2 -> 2.2.5Synapse Admin : v0.10.3-etke14 -> v0.10.3-etke17Service Updates: Customer Support changesWe wanted to inform you about important changes in how we handle support. Over the years, we’ve been accessible through various channels—Email, Matrix, Telegram, Fediverse—but technical challenges (SSL certificate issues, encryption troubles with Matrix bots, missing notifications, etc.) have complicated things for both you and us.To improve this, we’re consolidating all support into a single system using FreeScout (a great open-source helpdesk). While we’ll be retiring the old contact methods, rest assured that these existing methods will continue to work for now. However, we encourage you to start using the new options for a more streamlined experience.From now on, here’s how you can contact us:Email us directly using our new email address (all emails go directly into FreeScout).Click the Contact support button in your Synapse-Admin (details below).Submit a support request using the form on our contacts page .Use the Support Portal to manage your support requests.All these methods lead to the same support queue in FreeScout, ensuring consistent and timely responses regardless of the interface you choose to use. This new setup allows us to better track and respond to your requests more efficiently.Additionally, after the next maintenance run , you’ll notice a new Contact support button in Synapse-Admin , which will take you directly to the support portal.Service Updates: Synapse-Admin SafeguardsA while ago, we announced our Synapse-Admin fork to provide more features and quality-of-life improvements for our customers.We’ve already implemented an extensive list of changes , and starting this week, a new safeguard has been introduced: system-managed users (like bots, bridge puppets, etc.) will have restricted modification capabilities in Synapse-Admin. Altering these users has historically led to serious problems—sometimes even requiring full server reinstallation. To prevent this, we’ve now disabled dangerous actions (e.g., password changes, account locking, deactivation, erasure) by default, while allowing safer changes (like updating display names and avatars).Please note that the list of system-managed users will vary by server. You can review your server’s list by checking the configuration at https://matrix.your-server.com/synapse-admin/config.json (you may need to reload the page to refresh the cache).Source2024-09-19 20:00 UTCStable Updates PublishedCinny : v4.2.0 -> v4.2.1Gmessages : v0.4.3 -> v0.5.0Meta Instagram : v0.3.2 -> v0.4.0Meta Messenger : v0.3.2 -> v0.4.0Peertube : v6.2.1 -> v6.3.0Radicale : 3.2.3.0 -> 3.2.3.1Signal : v0.7.0 -> v0.7.1Slack : v0.1.0 -> v0.1.1Synapse : v1.114.0 -> v1.115.0Synapse Admin : v0.10.3-etke12 -> v0.10.3-etke14Synapse S3 Storage Provider : 1.3.0 -> 1.5.0Traefik : v3.1.2 -> v3.1.3#discussion:etke.ccSource2024-09-12 20:00 UTCStable Updates PublishedBaibot : latest newCinny : v4.1.0 -> v4.2.0Element : v1.11.76 -> v1.11.77Honoroit : v0.9.25 -> v0.9.26Synapse Admin : v0.10.3-etke12Service Update: New Component - BaibotAt etke.cc , we haven’t been entirely happy with the state of AI / LLM integration into Matrix.We’ve been offering the matrix-chatgpt-bot service to our customers, but we’ve found it rather limited because:it’s complicated to install, requiring manual interventionit doesn’t allow self-servicing (changing the configuration at runtime), which increases our support burdenit only supports a single provider (OpenAI) and model, hardcoded in the configurationit only supports text-generationit stores all its state (including messages exchanged in encrypted rooms) in a plaintext fileThis provoked us to develop a more private and much more 🌟 featureful alternative - baibot . 🤖 As with everything we do, it’s released under the AGPLv3 license.Existing etke.cc customers can request the new baibot service by contacting us , while new customers can order it directly from our order form .To learn more about the project and how to install the software against your own Matrix server, see the baibot project on Github .Service Update: ChatGPT bot is DeprecatedThe ChatGPT bot hasn’t been receiving fixes and new features for a long time, so we decided to deprecate it and offer Baibot as a replacement.Service Update: Synapse-Admin ForkSince day one, we’ve been offering Synapse-Admin as a core service. Over time, we identified several areas where small tweaks and enhancements could improve the user experience.Little by little, we’be been making improvements or adopting and reworking existing upstream PRs, which have been stuck in review for long. We’re hoping that all our changes will eventually be accepted upstream and will make our fork obsolete.For now, it seems like the original project has lost momentum, so we’ll continue maintaining our own fork, for the benefit of our customersHere’s a list of the changes already implemented (full details here ):Prevent admins from deleting themselvesFix user’s default tab not being shownAdd identifier when authorizing with passwordAdd ability to toggle whether to show locked usersFix user’s display name in header on user’s pageFix footer overlapping contentSwitch from nginx to SWS for serving the app, reducing the size of the Docker imageFix redirect URL after user creationDisplay actual Synapse errorsFix base_url being undefined on unsuccessful loginPut the version into manifest.json (CI only)Federation page improvements (using theme colors)More updates are in the pipeline (check them here ). A big thank you to the authors and contributors of the upstream project for providing such an outstanding tool!Service Update: admin.etke.cc Goes LiveOur Synapse-Admin fork is now the default on all servers, updated with regular maintenance runs. However, if you’d like to check out the latest improvements before they’re installed on your server, we’ve launched admin.etke.cc . This CDN-hosted version always features the latest commit from the fork repo .Source«««12345678»»»Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
