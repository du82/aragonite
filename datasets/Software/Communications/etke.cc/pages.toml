["https://etke.cc/news/xueua5a7nvgjzxldyu52gkw7viftcthp8cz-m3dyi_8"]
title = "etke.cc | 2024-09-12 20:00 UTC"
description = "New message published on 2024-09-12 20:00 UTC"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 Theme2024-09-12 20:00 UTCStable Updates PublishedBaibot : latest newCinny : v4.1.0 -> v4.2.0Element : v1.11.76 -> v1.11.77Honoroit : v0.9.25 -> v0.9.26Synapse Admin : v0.10.3-etke12Service Update: New Component - BaibotAt etke.cc , we haven’t been entirely happy with the state of AI / LLM integration into Matrix.We’ve been offering the matrix-chatgpt-bot service to our customers, but we’ve found it rather limited because:it’s complicated to install, requiring manual interventionit doesn’t allow self-servicing (changing the configuration at runtime), which increases our support burdenit only supports a single provider (OpenAI) and model, hardcoded in the configurationit only supports text-generationit stores all its state (including messages exchanged in encrypted rooms) in a plaintext fileThis provoked us to develop a more private and much more 🌟 featureful alternative - baibot . 🤖 As with everything we do, it’s released under the AGPLv3 license.Existing etke.cc customers can request the new baibot service by contacting us , while new customers can order it directly from our order form .To learn more about the project and how to install the software against your own Matrix server, see the baibot project on Github .Service Update: ChatGPT bot is DeprecatedThe ChatGPT bot hasn’t been receiving fixes and new features for a long time, so we decided to deprecate it and offer Baibot as a replacement.Service Update: Synapse-Admin ForkSince day one, we’ve been offering Synapse-Admin as a core service. Over time, we identified several areas where small tweaks and enhancements could improve the user experience.Little by little, we’be been making improvements or adopting and reworking existing upstream PRs, which have been stuck in review for long. We’re hoping that all our changes will eventually be accepted upstream and will make our fork obsolete.For now, it seems like the original project has lost momentum, so we’ll continue maintaining our own fork, for the benefit of our customersHere’s a list of the changes already implemented (full details here ):Prevent admins from deleting themselvesFix user’s default tab not being shownAdd identifier when authorizing with passwordAdd ability to toggle whether to show locked usersFix user’s display name in header on user’s pageFix footer overlapping contentSwitch from nginx to SWS for serving the app, reducing the size of the Docker imageFix redirect URL after user creationDisplay actual Synapse errorsFix base_url being undefined on unsuccessful loginPut the version into manifest.json (CI only)Federation page improvements (using theme colors)More updates are in the pipeline (check them here ). A big thank you to the authors and contributors of the upstream project for providing such an outstanding tool!Service Update: admin.etke.cc Goes LiveOur Synapse-Admin fork is now the default on all servers, updated with regular maintenance runs. However, if you’d like to check out the latest improvements before they’re installed on your server, we’ve launched admin.etke.cc . This CDN-hosted version always features the latest commit from the fork repo .SourceDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
