["https://etke.cc/help/bots/chatgpt"]
title = "etke.cc | (Deprecated) ChatGPT bot"
description = "Information about the (Deprecated) ChatGPT bot for Matrix offered by etke.cc"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpBots(Deprecated) ChatGPT(Deprecated) ChatGPT botThe (Deprecated) ChatGPT bot installed by us is powered by matrix-chatgpt-bot. full documentation source code supportChatGPT Matrix Bot - Conversational AI in Your Matrix RoomsThe ChatGPT Matrix Bot, brings the power of conversational AI (powered by OpenAI ’s ChatGPT ) into your own Matrix rooms, offering a seamless and interactive experience for users within the Matrix ecosystem.NOTE: this component is deprecated and pretty much unmaintained by its developers since November 2023. We recommend using our very own and much more capable AI bot - baibot .To use this component, you will need to sign up for OpenAI ’s platform and obtain an API key . Send over this API key to us and we will configure your ChatGPT bot to use it - this way, your bot usage (through Matrix) will be billed to your own OpenAI account.By default, we configure the bot to use the ChatGPT 3.5 Turbo model , but other models are supported .UsageStart a chat with @chatgpt:your-server.com and send the bot a message (example: What are the benefits of decentralized networks?).Note that the bot behaves differently based on the type of room it’s in (1-on-1 chat or group conversation), as described in Matrix Integration below.Matrix IntegrationParticipate in Matrix rooms, providing real-time responses to user queries and engagement.Enhance collaboration by having ChatGPT present to facilitate discussions, answer questions, and provide information.The ChatGPT Matrix Bot introduces a new dimension to communication within Matrix rooms, combining the capabilities of ChatGPT with the collaborative features of the Matrix platform. Enjoy natural language interactions and enhance the overall user experience with ChatGPT in your Matrix community.Each conversation with the bot in your rooms happens within a separate thread. The bot behaves differently based on the room it’s in:in 1-on-1 rooms, the bot considers every chat message as an inquiry and starts a chta thread to provide an answerin rooms with multiple people (group chats), the bot does not consider every chat message as an inquiry meant for it to handle. This is to allow regular conversation (between people) to happen in the room without triggering the bot. In such rooms, you need to prefix all your questions to the bot with !chatgpt. Example message that would trigger the bot: !chatgpt What are the benefits of decentralized networks?Different models are supportedThe bot could be powered by one of the ChatGPT models . For now, we support:(default) ChatGPT 3.5 Turbo - a reasonably capable and fairly inexpensive modelgpt-4 - a more capable (but ~10x more expensive and also slower) modelgpt-4-1106-preview - a more capable and up-to-date version of the gpt-4 modelWe do not support the gpt-4-vision-preview model yet, because it’s not yet supported by matrix-chagpt-bot .If you need assistanceBefore seeking help, make sure to thoroughly review the documentation. If you still have questions, please don't hesitate to contact bot's support. Please note that etke.cc Customer Support exclusively handles server-related inquiries. For any questions related to the bot, please reach out to bot's support.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
