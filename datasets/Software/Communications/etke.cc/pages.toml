title = "etke.cc | News"
description = "copy of #news:etke.cc room messages"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeNewsThis page contains copy of #news:etke.cc room messages, but you may use RSS , or Fediverse to get them. Additionally, you may check News Archive for full list of messages.2024-02-29 21:03 UTCStable Updates PublishedElement / app.etke.cc 1.11.58 -> 1.11.59Prometheus 2.49.1 -> 2.50.1SchildiChat v1.11.30-sc.2 -> v1.11.36-sc.6Service Updates: New Facebook and Instagram bridgesmautrix-instagram and mautrix-facebook bridges were superseded by the mautrix-meta bridge. Quick Start documentation has been updated both for the Facebook / Messenger and the Instagram bridges.Existing customers are not affected, but if you wish to migrate to the new bridges - just follow the Facebook and Instagram migration guidesService Updates: Registry UpdatesTo prevent abuse of our private Docker registry, we’ve made internal changes to how access is controlled/secured. The new flow has been enabled for customers using the fresh stability branch . If you encounter any issues with the new flow, please, do not hesitate to contact usService Updates: Demo Server is Up&RunningTo offer a way to test components before ordering them (both for new & existing customers), we’ve deployed a demo server that you could use to decide. It has a few limitations, and not all components are available for usage yet, but we hope you will find it useful! Details: etke.cc/demo#discussion:etke.ccSource2024-02-22 21:32 UTCStable Updates PublishedGoToSocial 0.13.0 -> 0.13.3Hookshot 5.1.2 -> 5.2.1Miniflux 2.0.51 -> 2.1.0Signal bridge 0.5.0 first actual realease of the go-based bridge#discussion:etke.ccSource2024-02-15 20:57 UTCStable Updates PublishedElement / app.etke.cc 1.11.57 -> 1.11.58Jitsi 9220 -> 9258#postmoogle:etke.cc 0.9.16 -> 0.9.17Synapse-Admin 0.9.1 -> 0.8.7 downgrade due to regression issue in 0.9.x versionsSynapse 1.100.0 -> 1.101.0Traefik 2.10.7 -> 2.11.0#discussion:etke.ccSource2024-02-12 09:21 UTC🎉 Today marks 3 years of etke.cc! 🎉The etke.cc managed Matrix hosting service was launched on the 12th of February 2021 and has turned 3 years old today!Below, we’d like to show you what improvements have happened over the last year and what’s coming ahead for us.New payment model, more services, more server regionsIn case you’ve missed our large news announcement from December 2023, it’s not too late to learn about it now.To summarize, we have:switched to a new payment/pricing model, which is more sustainablelaunched many of new components and services (see below) and will continue to launch new onescompletely reworked order form - easier for you and for us - a quicker turnaround time when deploying serversbegan offering more powerful servers (using Hetzner Cloud ’s CPX line) and in more geographic locations - including the U.S.We encourage you to read the our original news announcement for more details about these changes.New component additionsIn the past year, we have launched many new Matrix-related and non-Matrix components.If you’d like to use one or more of the components seen below, contact us and we’ll install it to your existing server.New Matrix-related componentsAll of the Matrix components described below are new additions to our stack. Some are installed by default to all servers managed by us, as part of our base Matrix components stack .(free) Sliding-sync - assists next-generation clients like Element X in talking to the homeserver in an optimized manner. This component is installed by default to all servers as part of our base Matrix components stack .(free) Encrypted Bridges - we now offer a checkbox on our order form that globally enables encryption for all bridges that support it. This is experimental and may not work well for some bridges, so we don’t recommend it to everyone.(free) The synapse_auto_compressor tool, which runs in the background and periodically compresses the (Postgres) database for the Synapse homeserver, so that it runs optimally. This component is installed by default to all servers as part of our base Matrix components stack .(free) We’ve switched to exim-relay for delivering emails (optionally via an SMTP relay ) and wired all email-sending components (the Synapse Matrix homeserver and other addons) to it.(free addition to our $5/mo bridge pack) a Google Messages bridge (powered by mautrix-gmessages). The old Google Chat bridge still continues to work.(+$1/mo) the SchildiChat web-based Matrix client - an Element-web fork offering more customization.(+$3/mo) ChatGPT - a Large-Language-Model (LLM) bot that you can talk to via Matrix, based on OpenAI ’s ChatGPT (Requires a separately-obtained OpenAI API key )(+$2/mo) S3 storage support for the Synapse homeserver - for infinite Matrix media storage (Requires a separately obtained AWS S3-compatible object store of your choice)(+$5/mo) Synapse workers - a multi-process homeserver setup to more efficiently handle many users and large rooms (Requires a powerful server - 8+ GB of RAM)We’ve also replaced our Signal bridge (mautrix-signal) offering with the new bridge implementation (complete rewrite from Python to Golang ). New non-Matrix-related components(+$1/mo) [previously-offered and making a comeback] the Miniflux RSS reader(+$1/mo) [previously-offered and making a comeback] the Radicale CalDAV/CardDAV server(+$1/mo) [previously-offered and making a comeback] the Uptime Kuma monitoring system(+$1/mo) [brand new] the Linkding bookmark manager(+$2/mo) [brand new] the Vaultwarden password manager (a lightweight Bitwarden -compatible server which can be used with the Bitwarden client apps)(+$2/mo) [brand new] the Firezone - a VPN server based on WireGuard with a Web UI(+$3/mo) [brand new] the GoToSocial ActivityPub server (a lightweight Mastodon alternative)New or discontinued etke.cc servicesDedicated supportOn the services front, we’re now offering a Dedicated support tier for $100/mo. This is an addition to the free Basic support tier that we offer to all etke.cc customers.The dedicated support tier is useful when your product relies on Matrix and you may require quicker help in case of outages. The main differences with the Basic tier are the dedicated Matrix chat room with etke.cc developers and the higher priority of your requests relative to others.Matrix Rooms SearchWe’ve developed the Matrix Rooms Search tool (naturally, as AGPLv3-licensed free-software). Anyone can run their instance and index the global Matrix Federation.MRS provides a search across room names, topics, etc., allowing for better discoverability of rooms across all of Matrix.We’re making Matrix Rooms Search available to etke.cc customers in 2 ways:The MatrixRooms.info websitePre-configured as an alternative Rooms Directory in ElementMore domain choicesTo those who don’t wish to use their own custom domain for their server, we’ve been offering hosting on etke.cc-owned domains like my-business.etke.host.At the expense of some independence (afforded by having your own custom domain), using etke.cc-owned domains allows people to avoid dealing with domains, DNS, and the cost that comes with that.We now offer hosting on these additional domains:onmatrix.chatkupo.emailmatrix.townmatrix.fanma3x.chatWhen making a new order , you can claim your subdomain on any of these domains and get your Matrix server deployed more quickly and easily (no DNS configuration required on your side).Discontinuing our Custom Consulting/Development serviceWe used to offer a Custom Consulting/Development service - helping people with custom deployments or integrations on top of Matrix.We have discontinued this service in order to free up time and let us focus on improving etke.cc for everyone. This is part of the reason why we have so many major improvements to announce in this birthday post.Improved internalsBesides the many new components, services and tools, we’ve also done a lot of internal work - improving reliability and performance.Below are some of the important internal changes we’ve done:The Scheduler :Automatic HTTP, DNS, and port checks, including federation tests, on run ping and run maintenanceCumulative alerts - we combine multiple failure alerts into a single message that we deliver via Matrix and emailImproved deliverability of emails, thanks to sending them via PostmarkFull overhaul of the agent/worker (injector) part making it blazing-fast and decreasing the delay (to milliseconds) between receiving a command from the user and executing itHuge refactoring of the codebaseMany automation improvements, allowing us to more quickly and easily install new serversServer Maintenance:Automatic Postgres database vacuuming on each maintenance runAutomatic Postgres database tuning (based on PGTune ’s calculaton logic) which takes into account your server’s configuration and installed componentsNetworking: reworked Matrix stack networking for improved security, performance and ease of plugging-in new services (we’ve migrated from nginx to Traefik )Emails: we’ve also configured DKIM , SPF and rDNS for customers hosted on our (Hetzner Cloud ) servers - this improves outgoing email deliverability for big providers like Google (see New Gmail protections for a safer, less spammy inbox )Free-software workWe’ve also done a lot of work on a new free-software (AGPLv3) Ansible mega-playbook - mash-playbook , which currently includes 80+ components. Many of these began their life at etke.cc, while others were developed by us (or by the community) later on. Some of these components will be offered as addon components to etke.cc customers in the future. There are no technical difficulties to offering all of them immediately, but supporting a new component is not so simple - it requires documentation, commitment, support-staff training, etc.Components from mash-playbook and the matrix-docker-ansible-deploy playbook are at the core of our automation (etke/ansible ), powering all servers managed by us.As part of our work over the past year, we have also developed and released as free-software (AGPLv3) the following new tools:MRS - Matrix Rooms Search, the backend that powers our MatrixRooms.info service (discussed above)A.G.R.U - a command-line tool like ansible-galaxy , but fasteransible-ssh - a command-line tool (wrapper around ssh) that makes it easy to SSH into hosts found in an Ansible inventory fileradicale-auth-matrix - an adapter that connects Radicale ’s user authentication system to MatrixNumbers!We’ve installed 243 new Matrix serversPushed 461 updates and enhancements to the automation framework used as the service corePosted 60 updates in the announcements room, so you’re always up-to-date with what we’re working onIf you’re curious to travel back in time, here are posts from previous etke.cc birthdays:2 years celebration post1 year celebration postSource2024-02-08 20:58 UTCStable Updates Published#buscarron:etke.cc 1.3.1 -> 1.4.0#honoroit:etke.cc 0.9.19 -> 0.9.20Signal bridge updated pinned commitSynapse Admin 0.8.7 -> 0.9.1Vaultwarden 1.30.2 -> 1.30.3ReminderAll announcements published into the #news:etke.cc room are published on etke.cc/news page, RSS feed , and Fediverse account for your convenience. Moreover, we’ve added Attention needed! block with the most important things on the news pagePlease keep an eye on them, to avoid missing important information. We publish announcements only once a week (except security updates - announcements published ASAP), so you could safely enable “All messages” notification preset.Service Updates: Deprecating Abandoned ComponentsSome of the components we offered previously have been abandoned or deprecated by their developers, but we continue to maintain them on customers’ servers (if any of the abandoned components are installed).Unfortunately, such components misbehave and sometimes can’t even work with modern APIs, so we’ve proclaimed them deprecated many months ago and now defined a removal plan.Starting from 1st July 2024, the following components will be uninstalled from customers servers:Discord bridge (mx-puppet-discord) which has been unmaintained by its developers since May 2022. It got superseded by Discord bridge (mautrix-discord)Slack bridge (mx-puppet-slack) which has been unmaintained by its developers since May 2022. It got superseded by Slack bridge (mautrix-slack)Webhooks bridge (appservice-webhooks) which has been unmaintained by its developers since November 2022. It got superseded by Webhooks bridge (hookshot)Dimension integration manager which is unmaintained by its developers since November 2022. There is no free-software alternative integration managerWireguard (and dnsmasq) which has been superseded by FirezoneAlmost every component has maintained and updated successor, so you have time to migrate to the new components until the deprecated ones are removed.More details are available in the related FAQ entry: etke.cc/help/faq#what-about-deprecated-components#discussion:etke.ccSource2024-02-01 21:33 UTC (updated)Stable Updates PublishedElement / app.etke.cc 1.11.55 -> 1.11.57 there was no 1.11.56Jitsi 9111 -> 9220Synapse 1.99.0 -> 1.100.0Vaultwarden 1.30.1 -> 1.30.2this update contains fixes for S3 and coturn issuesService Updates: Synapse Workers are available for orderLarger matrix servers may suffer from Synapse slowness. To increase the throughput and performance of your matrix server, you could now order Synapse Workers (charged extra) to be enabled on your matrix server to offload Sync, Client, Federation, Encryption, Authorization, Events, Account Data, Receipts, Presence, and Directory APIs to worker processes.Existing customers may request Synapse Workers to be enabled by contacting usService Updates: Better Email Deliverability for the New OrdersAs an answer to Google’s and Yahoo’s tightened requirements for emails, prerequisites for all new orders were updated to include DMARC and SPF DNS records. For hosting orders, we additionally configure rDNS record to resolve to matrix.your-server.com by default.Existing customers are unaffected, but may update their DNS records to accommodate the changes:For custom domains:Add new TXT record for matrix subdomain with the following value: v=spf1 ip4:REPLACE_WITH_SERVER_IPv4 -all (REPLACE_WITH_SERVER_IPv4 should be replaced with your matrix server’s IPv4)Add new TXT record for _dmarc.matrix subdomain with the following value: v=DMARC1; p=quarantine;Reverse DNS (rDNS) records configuration depends on your VPS provider, you may wish to contact their support to help with changing itFor etke.cc-owned domains (etke.host, kupo.email, ma3x.chat, matrix.fan, matrix.town, onmatrix.chat)Contact us: etke.cc/contacts#discussion:etke.ccSource2024-01-25 21:08 UTCStable Updates PublishedElement app.etke.cc 1.11.54 -> 1.11.55Grafana 10.2.3 -> 10.3.1Sliding Sync 0.99.14 -> 0.99.15Service Updates: Server Emails are sent through Exim from now onPreviously, when you ordered the SMTP Relay component we configured it for Synapse only because it "
