title = "etke.cc | LanguageTool service"
description = "LanguageTool is an Open Source proofreading software for English, Spanish, French, German, Portuguese, Polish, Dutch, and more than 20 other languages. It finds many errors that a simple spell checker cannot detect."
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpExtra ServicesLanguageToolLanguageTool serviceUsagen-grams official website full documentation source code supportLanguageTool is an Open Source proofreading software for English, Spanish, French, German, Portuguese, Polish, Dutch, and more than 20 other languages . It finds many errors that a simple spell checker cannot detect.UsageURL: https://languagetool.your-server.comThat is API URL, there is no web interface for this service. To use LanguageTool with UI, you can install browser extensions, e-mail addons, office plugins, and even apps!Once a client is installed, you can configure it to use your own LanguageTool instance by setting the URL to https://languagetool.your-server.com.Browser Extensions: Firefox , Chrome , Safari , Edge , OperaE-mail Addons: Gmail , Outlook , Apple Mail , ThunderbirdOffice Plugins: Google Docs , Microsoft Word , Apple Pages , OpenOffice , LibreOfficeApps: MacOS , Windows , iOSn-gramsLanguageTool can make use of large n-gram data sets to detect errors with words that are often confused, like their and there. The n-gram data set is huge and thus not part of the default configuration (details ). To make use of it, you need at least 20GB of free disk space per language. If you have that - just contact us and tell what languages you want to use n-grams for.Supported languages: English, German, Spanish, French, Hebrew, Italian, Dutch, Russian, and Chinese.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
