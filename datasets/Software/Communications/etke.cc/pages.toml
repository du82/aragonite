full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeDemo serverTo try how your own Matrix server would work before ordering , you can try our demo instance.Our demo instance is a fully-featured Matrix server with additional components, and a few limitations.LimitationsData retention is 1 day - all data is deleted after 1 day, including accounts, rooms, messages, and files.No admin access - you can try to use user-level features, but you cannot change server settings.Not all features and components are enabled - some features and components are disabled to prevent abuse.No guarantees - the server is provided as-is, and we do not guarantee its availability or performance.No support - we do not provide support for the demo server.AccessMatrixYou can access the demo server at https://demo.etke.host .Unlike servers we setup, this is an instance with public registration . You will need to register a new account and confirm your email address (abuse prevention measure).The following Matrix-related components are available:Element Web - recommended web clientCinny - alternative web clientHydrogen - catching-up web clientSchildiChat - catching-up web clientNtfy - UnifiedPush provider (details )Radicale - CalDAV/CardDAV server, use your matrix login (user, not @user:demo.etke.host) and password to acccess itThe following Matrix bots and bridges are also available:Reminder-Bot: @reminder:demo.etke.host (details )Discord: @discordbot:demo.etke.host (details )Facebook/Messenger: @messengerbot:demo.etke.host (details )Gmessages: @gmessagesbot:demo.etke.host (details )Googlechat: @googlechatbot:demo.etke.host (details )Instagram: @instagrambot:demo.etke.host (details )Irc: @heisenbridge:demo.etke.host (details )Linkedin: @linkedinbot:demo.etke.host (details )Postmoogle: @emailbot:demo.etke.host (details )Signal: @signalbot:demo.etke.host (details )Skype: @skypebridgebot:demo.etke.host (details )Slack: @slackbot:demo.etke.host (details )Twitter: @twitterbot:demo.etke.host (details )Webhooks: @hookshot:demo.etke.host (details )WeChat: @wechatbot:demo.etke.host (details )Whatsapp: @whatsappbot:demo.etke.host (details )Non-MatrixYou can access the following components using demo login:Jitsi - video conferencing, password: demo (details )Miniflux - RSS reader, password: demo123 (details )Grafana - server monitoring, password: demoEtherpad - collaborative text editingDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
