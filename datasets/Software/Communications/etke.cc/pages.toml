title = "etke.cc | Vaultwarden service"
description = "Vaultwarden is a password manager server (compatible with Bitwarden) that you can use with the official Bitwarden apps and browser addons. It's offered as an add-on service."
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpExtra ServicesVaultwardenVaultwarden serviceUsageUsage on the webUsage on mobile full documentation source code supportVaultwarden is an unofficial Bitwarden compatible password manager server that you can use with the official Bitwarden apps and browser addons. It’s is much more lightweight than Bitwarden, which makes it a good choice for hosting.You can find links to Bitwarden applications in the download section of the Bitwarden website and in some quick links below. Refer to the Usage section for hints on how to connect these applications to your Vaultwarden server.UsageServer URL: https://vault.your-server.comAdministrative URL: https://vault.your-server.com/adminThe first time you use Vaultwarden, you’d need to create one or more accounts via the Administrative UI, after authenticating with an admin token (password) that we have provided to you.You then proceed to use it on the web , via a mobile app or on the command-line.Below, we include some quick links and descriptions for how to connect to your Vaultwarden instance, but any Bitwarden application can be made to work with your instance in a similar way.Usage on the webUsing a web browser, you have 2 ways to access Vaultwarden.One is via the Web UI available at the Server URL (mentioned above). Another is via a browser addon:Bitwarden for FirefoxBitwarden for Chrome & Chromium-based browsersWhen using the browser addons, choose self-hosted and point the addon to your Server URL (mentioned above).Usage on mobileBitwarden for AndroidBitwarden for iOSWhen using the mobile apps, choose the self-hosted option and point the app to your Server URL (mentioned above).Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
