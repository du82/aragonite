full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeNewsThis page contains copy of #news:etke.cc room messages, but you may use RSS , or Fediverse to get them. Additionally, you may check News Archive for full list of messages.2024-07-02 08:11 UTCServers Have Been Updated (Vulnerability Mitigation)It was discovered that OpenSSH incorrectly handled signal management. A remote attacker could use this issue to bypass authentication and remotely access systems without proper credentials.Details (Ubuntu) , Details (Debian)#discussion:etke.ccSource2024-07-01 11:03 UTC (updated)Service UpdatesAs it was announced a long time ago, 2 major changes hit the transition’s deadline and are enforced starting from 1st July 2024:Any customer with a deprecated subscription model (Maintenances and Turnkeys) will be asked to switch to the By Complexity model on any support request (if you got your matrix server installed after the announcement on December 2023 - don’t worry, you already use By Complexity price model)All deprecated components announced previously are disabledDeprecated Components Alternatives and Migration NotesAlmost every component has an alternative, usually with more features and options than the original one. We understand there could be confusion, so here are migration notes and suggestions for each of them:Dimension - unfortunately, the only alternative is the built-in integration manager. For customers who had Dimension with Etherpad, etherpad is still available on dimension.your-server.com/etherpad (i.e., nothing changed)Wireguard (and dnsmasq) - alternative is Firezone (+$2/month) that provides UI for devices management and VPN server configuration. You may request adding that component by contacting usDiscord bridge (mx-puppet-discord) - alternative is Discord bridge (mautrix-discord) . You may request adding that component by contacting usFacebook bridge (mautrix-facebook) - alternative is Facebook bridge (mautrix-meta) . You may request adding that component by contacting usGroupMe bridge (mx-puppet-groupme) - unfortunately, there is no alternativeInstagram bridge (mautrix-instagram) - alternative is Instagram bridge (mautrix-meta) . You may request adding that component by contacting usSlack bridge (mx-puppet-slack) - alternative is Slack bridge (mautrix-slack) . You may request adding that component by contacting usSteam bridge (mx-puppet-steam) unfortunately, there is no alternativeWebhooks bridge (appservice-webhooks) - alternative is Webhooks bridge (hookshot) . You may request adding that component by contacting us#discussion:etke.ccSource2024-06-27 20:00 UTCStable Updates PublishedCoturn : 4.6.2-r9 -> 4.6.2-r10Gotosocial : 0.15.0 -> 0.16.0Grafana : 11.0.0 -> 11.1.0Hookshot : 5.3.0 -> 5.4.1Sygnal : v0.14.3 -> v0.15.0Final Reminderchanges will be enforced starting from the 1st JulyIn relation to our new pricing model: When will old subscriptions (Maintenance and Turnkeys) be deprecated?Upcoming removal of long-deprecated components#discussion:etke.ccSource2024-06-20 20:03 UTCStable Updates PublishedElement : v1.11.68 -> v1.11.69Gmessages : v0.4.1 -> v0.4.2Prometheus : v2.52.0 -> v2.53.0Radicale : 3.2.1.0 -> 3.2.2.0Signal : v0.6.1 -> v0.6.2Synapse : v1.108.0 -> v1.109.0Whatsapp : v0.10.7 -> v0.10.8ReminderIn relation to our new pricing model: When will old subscriptions (Maintenance and Turnkeys) be deprecated?Upcoming removal of long-deprecated components#discussion:etke.ccSource2024-06-13 20:00 UTCStable Updates PublishedRadicale : 3.2.0.0 -> 3.2.1.0Traefik : v2.11.2 -> v2.11.4#discussion:etke.ccSource2024-06-06 20:37 UTCStable Updates PublishedBorgmatic: 1.8.9 -> 1.8.11Element : v1.11.67 -> v1.11.68Etherpad : 2.0.3 -> 2.1.0Sygnal : v0.14.2 -> v0.14.3Synapse Reverse Proxy Companion : 1.25.5-alpine -> 1.27.0-alpineWechat : 0.2.4 newWechat Agent: 0.0.1 newService Update: New Component - WeChat bridgeWeChat bridge is available for order. Existing customers can request it by contacting usService Update: Monitoring Alerts changesStarting this week, we are gradually implementing an exponential backoff mechanism for monitoring alerts. If an alert doesn’t change, we’ll email and Matrix-message you less often about the same issue.#discussion:etke.ccSource2024-05-30 20:01 UTCStable Updates PublishedCoturn : 4.6.2-r5 -> 4.6.2-r9Synapse : v1.107.0 -> v1.108.0#discussion:etke.ccSource2024-05-23 19:58 UTCStable Updates PublishedElement : v1.11.66 -> v1.11.67Gmessages : v0.4.0 -> v0.4.1Meta Instagram : v0.3.0 -> v0.3.1Meta Messenger : v0.3.0 -> v0.3.1Prometheus Node Exporter : v1.8.0 -> v1.8.1Radicale : 3.1.9.1 -> 3.2.0.0Signal : v0.6.0 -> v0.6.1Sliding Sync : v0.99.17 -> v0.99.18 Sygnal : v0.14.1 -> v0.14.2ReminderThe following items may need your attention:In relation to our new pricing model: When will old subscriptions (Maintenance and Turnkeys) be deprecated?Upcoming removal of long-deprecated components#discussion:etke.ccSource2024-05-16 20:00 UTCStable Updates PublishedGrafana : 10.4.2 -> 11.0.0Prometheus : v2.51.2 -> v2.52.0Sliding Sync : v0.99.16 -> v0.99.17Synapse : v1.106.0 -> v1.107.0#discussion:etke.ccSource2024-05-09 20:00 UTCStable Updates PublishedElement : v1.11.65 -> v1.11.66Etherpad : 2.0.1 -> 2.0.3Peertube : v6.0.4 -> v6.1.0#discussion:etke.ccSource«««12345678»»»Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
