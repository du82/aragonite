["https://etke.cc/news/039s1ivet7iwend-lehdlqkmj8ufmnrwxfwdmc_10ey"]
title = "etke.cc | 2024-04-25 20:03 UTC"
description = "New message published on 2024-04-25 20:03 UTC"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 Theme2024-04-25 20:03 UTCStable Updates PublishedElement : v1.11.64 -> v1.11.65Jitsi : stable-9364-1 -> stable-9457-1Prometheus Node Exporter : v1.7.0 -> v1.8.0Synapse : v1.105.0 -> v1.105.1Synapse Admin : 0.9.2 -> 0.10.1Uptime Kuma : 1.23.12 -> 1.23.13Service Updates: Monitoring UpdateThe monitoring report now includes an additional check - Metrics . This check will only be visible when the VPS Metrics cannot be read. Such a failure indicates a critical issue with the server, typically severe overload, to the extent that even metrics cannot be checked.Service Updates: RAM utilization adjustmentsDue to a significant number of cases with high RAM utilization, we’ve implemented adjustments to decrease the usage, the most considerable changes are: decreased the max allowed memory for database, and more aggressive swapping. Those changes lead to a decrease in RAM utilization from 10% to 30% of total RAM. Unfortunately, they come with the cost of slightly decreased performance of the Matrix stack. If you’d like to have “performance-first” configuration instead, please, contact usService Updates: Order Form UpdateWith the implementation of the new monitoring system , an increasing number of customers are becoming aware of overloads on their servers. In most cases, these are the Small-sized servers with additional components installed. Unfortunately, the notes regarding the underpowered nature of these servers on the order form were insufficient. Consequently, many servers were overloaded from the start, leading to confusion among their owners when they received alerts regarding high CPU/RAM utilization. We apologize for any confusion caused and are taking steps to prevent such situations in the future.Regrettably, for existing customers, the only recourse is to inform them of the situation, which the new monitoring service accomplishes effectively.However, for new customers, we are implementing changes. Henceforth, the order form will automatically disable any resource-intensive components for the Small server size, accompanied by a clear explanation of why and what happened. It’s important to note that these disabled components are unusable on Small server sizes anyway, and their inclusion often results in unresponsive servers rather quickly. Additionally, certain components (e.g., Synapse Workers) will be disabled for Medium-sized servers as well due to the same reason.#discussion:etke.ccSourceDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
