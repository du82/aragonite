["https://etke.cc/help/bridges/mautrix-meta-messenger"]
title = "etke.cc | Facebook Messenger bridge"
description = "Information about the Facebook Messenger bridge for Matrix offered by etke.cc, and powered by mautrix-meta"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpBridgesFacebook MessengerFacebook Messenger bridgeThe Facebook Messenger bridge installed by us is powered by mautrix-meta. full documentation source code supportUsageThe mautrix-meta bridge can communicate with Facebook Messenger via Facebook , Facebook over Tor and Messenger .We configure the bridge to use Messenger , not Facebook , because that’s most universal - all Facebook users have an associated Messenger account, but not all Messenger users have a Facebook account.Start a chat with @messengerbot:your-server.com. When it joins, type help in the chat to see instructionsSend a login message to the bridge bot. The bot will reply with a link to its official Authentication instructions. Ignore this message. Our instructions below are similar, but simpler.Open a private window in your browser (Firefox or any Chromium -based browser like Google Chrome , Microsoft Edge , Brave , etc.). It’s important to use a private window, because we’d like your new Messenger login session to be separate from your regular session.Log into Messenger as you would usually do. We’ll reiterate that it’s important to log into Messenger , not FacebookOpen your browser’s Developer Tools. You can do this by right-clicking anywhere on the Messenger page and then clicking on the Inspect button. You may also open Developer Tools using a keyboard shortcut - Ctrl + Shift + K for Firefox and Ctrl + Shift + J for Chromium-based browsers.Click on the Network tab in the Developer Tools window. See a screenshot of some of the steps below for Firefox or for Chrome .In the Filter textbox, enter this text: graphqlEnsure that the All button or the XHR button next to the Filter textbox is activated.Reload the page using the reload button in the browser’s toolbar or with the F5 keyboard shortcutYou will see one or more graphql/ entries in the list below the Filter textboxRight-click on any of the graphql/ entries, go to the Copy submenu and then click the Copy as cURL button (for Mac and Linux) or Copy as cURL (POSIX) button (for Windows). This copies the graphql/ request in a curl -compatible format.Paste this copied information into your existing chat with the bridge bot and send the message. The mautrix-meta bridge will extract some login cookies from there. The bot will automatically delete your message to prevent this sensitive information from leaking.Close the private window WITHOUT logging out. It’s important that you just close the window without actually logging out of Messenger. Logging out of Messenger will invalidate the login session and the bridge will stop working.If you need assistanceBefore seeking help, make sure to thoroughly review the documentation. If you still have questions, please don't hesitate to contact bridge's support. Please note that etke.cc Customer Support exclusively handles server-related inquiries. For any questions related to the bridge, please reach out to bridge's support.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
