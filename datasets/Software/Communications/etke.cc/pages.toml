["https://etke.cc/help/extras"]
title = "etke.cc | Help | Extra Services"
description = "Discover a range of extra services and components to elevate your Matrix server experience. From maintenance control with The Scheduler to efficient Synapse server management with Synapse Admin, email hosting with Migadu, and seamless outgoing email communication with SMTP Relay, explore these services for a more versatile Matrix server setup. Also, free your mobile and desktop notifications from Google's push service with Ntfy. Explore additional services like Prometheus+Grafana, Jitsi, BorgBackup, Buscarron, Honoroit, Single Sign-On, Sygnal, Etherpad, and more to enhance your Matrix server's capabilities."
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpExtra ServicesElevate Your Matrix Server with Extra ServicesWe offer a range of extra services and components (for Matrix and independent ones), which would make your server more useful.etke.cc exclusiveThe following services are exclusive to etke.cc customers:The Scheduler made by etke.cc is a new maintenance system designed exclusively for etke.cc customers. It provides you with full control over server maintenance, ensuring your Matrix server stays in top shape.etke.cc’s Synapse Admin - a web-based tool that lets you manage your Matrix Synapse homeserver (user account management, clearing media and chat history, etc). We offer our own fork of the Synapse Admin with lots of improvements and new features.Matrix add-onsIn addition to the various Bridges and Bots , we also offer these additional Matrix services:Ntfy - the go-to choice for mobile app push notifications & script-based notifications without relying on Google’s push serviceSygnal - a push gateway server allowing Matrix application developers to support push notifications on Android and iOS devicesSynapse Single Sign-On - log in to your Matrix homeserver using SSO (powered by an OpenID Connect provider like Keycloak, Google, Github and 15+ others)Synapse S3 Storage - a module for the Matrix Synapse homeserver allowing it to store its media files in an object storage system like AWS S3 or compatible alternativeSynapse Workers - an option for the Synapse homeserver, which allows it to offload CPU-intensive tasks to separate worker processes, improving the performance of the homeserver.Fediverse componentsIn addition to Matrix, we also offer Fediverse components to enhance your server’s capabilities. Here are some of them:Funkwhale - a decentralized audio hosting platformGoToSocial - a decentralized social network platformPeertube - a decentralized video hosting platformCollaboration componentsEmail service is powered by Migadu , offering a reliable solution for personal and small business use. Break free from email hosting limitations and enjoy flexibility.Email (outgoing) SMTP Relay - increase outgoing email delivery success rate by sending emails via an SMTP server (either via your own SMTP server or our Email Hosting Service ).Etherpad - a real-time collaborative document editorJitsi - a video conferencing tool for use within Matrix and standaloneLanguageTool - an Open Source proofreading software for English, Spanish, French, German, Portuguese, Polish, Dutch, and more than 20 other languages. It finds many errors that a simple spell checker cannot detectRadicale - a simple CalDAV (calendar) and CardDAV (contact) serverReading and bookmarking componentsMiniflux - a minimalist and opinionated feed readerLinkding - a bookmarking serviceSecurity and privacy componentsFirezone - a VPN service based on WireGuardVaultwarden - a lightweight Bitwarden compatible password manager server that you can use with the official Bitwarden apps and browser addonsMonitoring and visualization componentsUptime Kuma - a fancy monitoring toolPrometheus and Grafana - a monitoring and visualization stack for your serverAdditional componentsBorgBackup - a backup solution (deduplicating archiver with compression and encryption)Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
