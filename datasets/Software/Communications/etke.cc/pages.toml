description = "Explore answers to frequently asked questions for new homeserver owners and learn about additional components, such as bridges and bots, for your Matrix server. Discover the Scheduler, a maintenance system for server control, and Synapse Admin, a web-based tool for managing your Synapse homeserver. If you need more assistance, don't hesitate to contact us."
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpHelpFrequently Asked QuestionsExplore answers to common questions frequently asked by new homeserver owners.There is a dedicated page with information and common questions about Matrix FederationAdditional ComponentsBridges - Discover how to bridge Matrix to other communication networks.Bots - Explore bots you can use on your Matrix server.Extra Services - Learn about additional services we can install on your Matrix server.The Scheduler made by etke.ccThe Scheduler is a new maintenance system developed specifically for etke.cc customers. It empowers you with control over server maintenance and addresses common issues, such as disk utilization and service restarts.Synapse AdminSynapse Admin is a web-based tool for administrating your (Matrix) Synapse homeserver. Manage user accounts, delete media, and clear chat history to reclaim disk space. Find detailed how-to instructions for using Synapse Admin on this page.GuidesWe’ve prepared a series of guides to help you get started with your Matrix serverPaymentsGet help you with anything related to subscription-management (Ko-Fi) and payment-processing (Paypal).Restoring BackupsLearn how to restore your server from backups using BorgBackup and local Postgres backups. This guide provides step-by-step instructions for restoring specific files or full server snapshots.VPS to VPS migrationLearn how to migrate your Matrix server from one VPS to another. This step-by-step guide covers DNS setup, SSH configuration, data migration, and post-migration steps.Linux Distributive UpgradesLearn how to upgrade your Matrix server’s host OS (distributive) from one major version to another. This step-by-step guide covers the process of upgrading your server’s OS, including the necessary preparations, the upgrade itself, and post-upgrade steps.Need More Assistance?If the information on these pages doesn’t resolve your issue, please feel free to contact us .Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
