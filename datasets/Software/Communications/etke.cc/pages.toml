title = "etke.cc | Custom Development"
description = "on that page, you can read about the Custom Development service we offer."
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeCustom DevelopmentTermsHow toWe created and maintain various open-source projects , and we can develop new features you want to see within those projects.Some highlights:A.G.R.U. - a fast replacement for the ansible-galaxy commandBuscarron - a web forms to matrix bridgeEMM - a tool to export matrix messages using arbitrary templatesHonoroit - a helpdesk botM.A.S.H. playbook - a next iteration of the infrastructure automationMatrix Rooms Search (and its demo instance MatrixRooms.info ) - a search engine across Matrix FederationPostmoogle - an email to matrix bridgeTTM - a time-like tool that sends results into matrix roomsansible-ssh - an SSH client wrapper that uses ansible inventory as configuration sourcematrix-docker-ansible-deploy playbook - a core of our automationand any component with the made by etke.cc badge you can see on the websiteOf course, you can just create an issue in a project’s repository to request a new feature and get it implemented, if we will find it useful for our services or if someone from the open-source community will implement it and send an MR with the requested feature.But if you want to get that feature for sure and not rely on our and community good will, you can pay the project developers to implement that feature.TermsOur hourly rate is $150/hour and we’re ready to get the job done with the following terms:The scope of work must be agreed before payment.All the results of commissioned work are released under the GPL/AGPL license (depending on the original project license) as part of the original open-source project.After the scope has been agreed and payment has been made, there is no refund possible.We reserve the right to refuse your request if the commission doesn’t fit into our vision of the project.Please, add the issue URL you us want to implement/fix to the message fieldHow toCreate a Github issue with the clear explanations of the changes you would like to getSend a comment @etkecc I want to pay to make that doneOne of the etke.cc developers will join, review the issue you created, ask some additional questionsOnce the scope of work is agreed, we’ll ask you to pay for the number of hours we think the implementation will take, if the requested changes fit in our project vision (meaning requests unrelated to the project’s scope will be rejected)After the payment, we’ll implement the requested changes and release them publiclyDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
