["https://etke.cc/services"]
title = "etke.cc | Services"
description = "Explore the range of services provided by etke.cc"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeServicesManaged ServersHosting TypesCloud HostingOn-PremisesSubscriptionGetting StartedMaintenanceSelf-Service BotMonitoringPrivate Docker RegistryCustomer SupportCloud Servicesapp.etke.ccadmin.etke.ccdemo.etke.hostMatrixRooms.infoCustom DevelopmentWelcome to our Services page, where you can discover the array of offerings from etke.cc.Managed ServersWe provide a range of managed Matrix homeserver services, tailored to your needs. Whether you’re looking for an on-premises solution or prefer to use get a cloud hosting , we’ve got you covered.Hosting TypesWe work with two hosting types: Cloud Hosting and On-Premises.Cloud HostingGet a server without having to deal with infrastructure yourselfOur Hosting service is for those who’d rather avoid dealing with server infrastructure.If you’re not a fan of running servers On-Premises (on your own infrastructure or on a cloud provider of your choice), we can rent a server from Hetzner Cloud and manage it on your behalf.Learn more about our Hosting service here .On-PremisesManaged Matrix homeserver on your own infrastructureDon’t like our Cloud Hosting offering? No problem! We can install and manage your Matrix homeserver on your own infrastructure.Prerequisites:An x86/amd64 Linux server with a Debian-based distribution (we recommend the latest Ubuntu LTS).An unrestricted internet access for the server (running behind NAT, proxied or air-gapped setups are not supported).A domain name to use with your Matrix server. Alternatively, you can obtain a subdomain from us at no extra cost.SubscriptionAll our services are available on a subscription basis.The Matrix base service is the only required component we charge for on our order form . With the aim of achieving fair pricing, all other services are an addon available at extra charge - choose the ones that make sense to you!Getting StartedFirst of all, place an order for the services you’re interested in. Once you’ve done that, you will receive an email with the next steps to get your server up and running. At some point in the process, there’s a payment step. Just follow the instructions in the email and you will progress.After, that we will setup your managed Matrix server and take care of the following:Setting up DockerConfiguring Matrix homeserver components (e.g., Synapse, Coturn, Synapse Admin , Element app, etc.) based on your orderHandling database backups (gzip SQL dump for on-premises installations or server snapshots for hosted options)Configuring swap based on your server’s RAM capacityConfiguring fail2ban for intrusion preventionSetting up the firewall (ufw)Conducting SSH security hardeningAs part of the setup process, we also ensure:System package updatesCleanup of unused system and Docker resourcesLogs retention for 7 daysMaintenanceWhen Is Maintenance Required?Maintenance services become available only after the initial setup. We exclusively offer maintenance for homeservers installed by us, owing to variations in configuration and deployment methods. If you have an existing Matrix server installed through other means, you can get in touch with us for integration.Automatic Weekly MaintenanceOur automated maintenance runs once a week, in accordance with your chosen recurring schedule managed by our scheduler . If you haven’t set a schedule, a default one will be assigned for your server’s upkeep.We release stable updates every Friday, ensuring your server stays current. In addition to automatic weekly maintenance, you have the option to manually trigger maintenance via our Scheduler bot at any time, although it’s usually unnecessary. Sit back, relax, and let us handle the weekly maintenance for you.As part of our maintenance, we perform the following tasks every week:System package updatesMatrix component updatesCleanup of unused system, Docker, and Matrix resources (e.g., cache, logs, thumbnails)Logs retention for 7 daysAutomatic tuning and vacuuming of your database, tailored to your server’s configurationNote that maintenance does not cover distribution upgrades (e.g., from Ubuntu 20.04 to 22.04), which are considered major upgrades and require a manual intervention. You can either do them yourself with our guidance (no extra cost) or request our assistance for a fee. More detailsAdditional benefitsWith the subscription, you can enjoy the following included benefits:Access to the Scheduler (self-service) botAccess to the exclusive Synapse Admin featuresBasic supportMonitoring with email and Matrix alertsPrivate Docker registry containing all Matrix components, ensuring stability by avoiding issues with public registriesSelf-Service BotManage Your Server with EaseOur Scheduler bot is a self-service tool that allows you to manage your server with ease. You can schedule maintenance, monitor your server’s health, and more, all from the comfort of your Matrix client.Learn more about the Scheduler bot here .MonitoringStay InformedOur monitoring service keeps you informed about your server’s health and performance. We offer monitoring reports via email and Matrix alerts, ensuring you’re always up-to-date on your server’s status.Learn more about our monitoring service here .Private Docker RegistryAvoid Public Registries IssuesOur private Docker registry acts as a mirror for public registries, eliminating common issues such as rate limits, unavailability, and restricted access.Learn more about our private Docker registry here .Customer SupportChoose the Level of SupportWe offer various levels of customer support. The “Basic” level is included with subscription by default. For more extensive support, our “Dedicated” level is available upon request.For additional details, please visit our support page .Cloud ServicesBesides the services listed above, we also offer a range of cloud services, integrated with the servers we manage by default. These services are designed to enhance your Matrix experience and provide you with a comprehensive solution for your communication needs.app.etke.ccWe provide CDN-backed hosting of the Element Web app with additional features enabled by default, and MatrixRooms.info integration.Available at app.etke.cc and included by default for all services we manage.admin.etke.cc made by etke.ccWe provide CDN-backed hosting for the our own fork of Synapse Admin web interface with additional features and improvements (details ).Available at admin.etke.cc and included by default for all services we manage.demo.etke.hostWe provide a demo Matrix server with additional components for you to try out.Available at demo.etke.host , details and instructionsMatrixRooms.info made by etke.ccWe develop and maintain Matrix Rooms Search project, a search engine for Matrix rooms. To make it easier for you, we offer an instance the project at MatrixRooms.info , where you can search for and join Matrix rooms (details ).Available at MatrixRooms.info and included by default for all services we manage in the Element Web app (you can search rooms across federation directly from the app).If you’d like to use it by default in other client apps (e.g., FluffyChat), follow the instructions hereCustom DevelopmentTailored SolutionsIf you require custom features within our open-source projects, we’re here to help at a fair price. Get more details about our custom development services here .Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
