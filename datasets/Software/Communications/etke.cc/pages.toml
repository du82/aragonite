full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpExtra ServicesBorgBackupBorgBackup serviceTarget audienceData being backed up and scheduleGetting started official website full documentation source code supportWe can setup borgbackup with borgmatic for you.BorgBackup is a deduplicating backup program with optional compression and encryption. That means your daily incremental backups can be stored in a fraction of the space and is safe whether you store it at home or on a cloud service.Target audienceIf you’re getting your server from us, we automatically enable server backups with our provider (Hetzner Cloud ), which gives you 7 daily backups of your whole server.If you’re getting your server from someone else, similar whole-server snapshot options may be available to you.Nevertheless, it’s always a good idea to have extra backups, especially at other locations (off-site, etc.)Data being backed up and scheduleBorgBackup will back up the files for all services and also include a database dump of the PostgreSQL database we run for you on the server.The backup will run based a schedule, defaulting to 4am every day.Getting startedTo use our BorgBackup service, you will need a remote server where backups will be pushed.There are hosted, borg-compatible solutions available, such as BorgBase and rsync.net .Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
