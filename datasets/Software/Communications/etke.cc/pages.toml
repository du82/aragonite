["https://etke.cc/news/2xf2lotiqbcu-wf_f5neay-jihxbd6y016g4xxmhxoo"]
title = "etke.cc | 2024-11-28 21:01 UTC"
description = "New message published on 2024-11-28 21:01 UTC"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 Theme2024-11-28 21:01 UTCStable Updates PublishedBorgmatic: 1.9.2 -> 1.9.3Radicale : 3.3.0.1 -> 3.3.1.0Synapse : v1.119.0 -> v1.120.0Synapse Admin : v0.10.3-etke31 -> v0.10.3-etke32Synapse Reverse Proxy Companion : 1.27.2-alpine -> 1.27.3-alpineTraefik : v3.2.0 -> v3.2.1Valkey : 8.0.1 newReminder: Synapse Admin Path ChangedStarting from the previous update, the Synapse Admin path changed from https://matrix.your-server.com/synapse-admin to https://matrix.your-server.com/adminComponent Updates: Authenticated Media Enabled by DefaultWith this update, your Synapse homeserver will now require authentication for newly uploaded media files. While most Matrix ecosystem components (clients, bots, etc.) should support this feature, some software may lack compatibility.Due to the critical security benefits of this change, we strongly discourage disabling it. If you develop your own Matrix app, service, or tool, please consider implementing authenticated media support as soon as possible.Component Updates: KeyDB Replaced by ValkeyPreviously, we replaced Redis with KeyDB due to Redis’s licensing change .Unfortunately, KeyDB has proven to be problematic, with issues that are not easily worked around. As a result, we are switching to Valkey , a promising drop-in replacement that has demonstrated reliability and performance.This change only affects servers using Redis-dependent components such as Synapse Workers, Funkwhale, and Peertube. Please expect a one-time maintenance downtime of up to 15 minutes during the migration.Service Updates: Enhancing News AwarenessSome customers have missed important updates shared in #news:etke.cc, resulting in misunderstandings about server changes and increased customer support requests. To address this, the Scheduler will now repost announcements from #news:etke.cc directly to the DMs of homeserver admins.We encourage everyone to take just one minute per week to read these updates and stay informed. This small effort will help prevent confusion and ensure smoother operations.Service Updates: Monitoring ChangesThis week, we made significant backend changes to the monitoring service . If you notice unexpected behavior or incorrect results in reports , please contact us .Additionally, all customers will have the Systemd unit monitoring feature enabled in the upcoming week.SourceDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
