full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeNewsThis page contains copy of #news:etke.cc room messages, but you may use RSS , or Fediverse to get them. Additionally, you may check News Archive for full list of messages.2025-01-16 21:00 UTCStable Updates PublishedElement : v1.11.89 -> v1.11.90Jitsi : stable-9909 -> stable-9955Radicale : 3.3.3.0 -> 3.4.0.0Signal : v0.7.4 -> v0.7.5Synapse : v1.121.1 -> v1.122.0Synapse Admin : v0.10.3-etke35 -> v0.10.3-etke36Traefik : v3.2.2 -> v3.3.2Twitter : v0.2.0 -> v0.2.1Source2025-01-09 21:00 UTCStable Updates PublishedBorgmatic: 1.9.4 -> 1.9.5Maubot : v0.5.0 -> v0.5.1Peertube : v7.0.0 -> v7.0.1Radicale : 3.3.2.0 -> 3.3.3.0Source2024-12-26 21:00 UTCStable Updates PublishedMiniflux : 2.2.3 -> 2.2.4Peertube : v6.3.3 -> v7.0.0Traefik : v3.2.1 -> v3.2.2Uptime Kuma : 1.23.15 -> 1.23.16Vaultwarden : 1.32.6 -> 1.32.7Source2024-12-19 21:00 UTCStable Updates PublishedDiscord : v0.7.1 -> v0.7.2Element : v1.11.87 -> v1.11.89Gmessages : v0.5.2 -> v0.6.0Jitsi : stable-9823 -> stable-9909Meta Instagram : v0.4.2 -> v0.4.3Meta Messenger : v0.4.2 -> v0.4.3Radicale : 3.3.1.1 -> 3.3.2.0Signal : v0.7.3 -> v0.7.4Slack : v0.1.3 -> v0.1.4Synapse Admin : v0.10.3-etke34 -> v0.10.3-etke35Twitter : v0.1.8 -> v0.2.0Whatsapp : v0.11.1 -> v0.11.2Component Updates: Synapse Admin Got Server NotificationsThere are different kinds of server notifications, like monitoring reports, components alerts, overdue payments notices, and update notices. We attempt to make them less annoying, but still keep you aware about them. Starting with this update, Synapse Admin will show all such notifications directly in the UI, so even with broken federation you will notice that something is wrongSource2024-12-12 21:00 UTCStable Updates PublishedBaibot : v1.4.0 -> v1.4.1Borgmatic: 1.9.3 -> 1.9.4Exim Relay : 4.98-r0-2 -> 4.98-r0-3Grafana : 11.3.2 -> 11.4.0Synapse : v1.120.2 -> v1.121.1Synapse Admin : v0.10.3-etke33 -> v0.10.3-etke34Vaultwarden : 1.32.5 -> 1.32.6Reminder: Authenticated Media Enabled by DefaultStarting from November 28, your Synapse homeserver requires authentication for newly uploaded media files. While most Matrix ecosystem components (clients, bots, etc.) should support this feature, some software may lack compatibility.Due to the critical security benefits of this change, we strongly discourage disabling it. If you develop your own Matrix app, service, or tool, please consider implementing authenticated media support as soon as possible.Reminder: Synapse Admin Path ChangedThe Synapse Admin path changed from https://matrix.your-server.com/synapse-admin to https://matrix.your-server.com/admin (that change was initially announced on November 21, and then again, but we still get support requests about it)Source2024-12-05 21:00 UTCStable Updates PublishedElement : v1.11.86 -> v1.11.87Exim Relay : 4.98-r0-1 -> 4.98-r0-2Grafana : 11.3.1 -> 11.3.2Hookshot : 5.4.1 -> 6.0.1Radicale : 3.3.1.0 -> 3.3.1.1Schildichat : 1.11.36-sc.3 -> 1.11.86-sc.0.test.0Synapse : v1.120.0 -> v1.120.2Synapse Admin : v0.10.3-etke32 -> v0.10.3-etke33Component Updates: Synapse Admin Got Server Status PageStarting with this update, you could always check the status of your server using Synapse Admin. Apart from the components’ health, it shows if there is a process (like maintenance) running currently.Service Updates: Monitoring ChangesAs it was announced within the last update, systemd units monitoring has been enabled.You may see failed systemd units (components) in the monitoring reports (on-demand using Synapse Admin or Scheduler; automatically via Email and Matrix reports) starting from this weekReminder: Synapse Admin Path ChangedThe Synapse Admin path changed from https://matrix.your-server.com/synapse-admin to https://matrix.your-server.com/admin (that change was initially announced on November 21, and then again, but we still get support requests about it)Reminder: Customer Support Contacts ChangedSome time ago, we announced changes to Customer Support with its migration to the new system and email address, and want to remind you that the up-to-date contact methods could be found on the etke.cc/contacts page. The old contact methods (old email addresses, matrix and telegram contacts) are still working currently, but that may change in the future, so we suggest revisiting the contacts page to ensure you have up-to-date information.Source2024-12-03 16:43 UTCServers Update In Progress (Security Fix)Synapse v1.120.0 -> v1.120.2This patch release fixes multiple security vulnerabilities, some affecting all prior versions of Synapse.DetailsSource2024-11-28 21:01 UTCStable Updates PublishedBorgmatic: 1.9.2 -> 1.9.3Radicale : 3.3.0.1 -> 3.3.1.0Synapse : v1.119.0 -> v1.120.0Synapse Admin : v0.10.3-etke31 -> v0.10.3-etke32Synapse Reverse Proxy Companion : 1.27.2-alpine -> 1.27.3-alpineTraefik : v3.2.0 -> v3.2.1Valkey : 8.0.1 newReminder: Synapse Admin Path ChangedStarting from the previous update, the Synapse Admin path changed from https://matrix.your-server.com/synapse-admin to https://matrix.your-server.com/adminComponent Updates: Authenticated Media Enabled by DefaultWith this update, your Synapse homeserver will now require authentication for newly uploaded media files. While most Matrix ecosystem components (clients, bots, etc.) should support this feature, some software may lack compatibility.Due to the critical security benefits of this change, we strongly discourage disabling it. If you develop your own Matrix app, service, or tool, please consider implementing authenticated media support as soon as possible.Component Updates: KeyDB Replaced by ValkeyPreviously, we replaced Redis with KeyDB due to Redis’s licensing change .Unfortunately, KeyDB has proven to be problematic, with issues that are not easily worked around. As a result, we are switching to Valkey , a promising drop-in replacement that has demonstrated reliability and performance.This change only affects servers using Redis-dependent components such as Synapse Workers, Funkwhale, and Peertube. Please expect a one-time maintenance downtime of up to 15 minutes during the migration.Service Updates: Enhancing News AwarenessSome customers have missed important updates shared in #news:etke.cc, resulting in misunderstandings about server changes and increased customer support requests. To address this, the Scheduler will now repost announcements from #news:etke.cc directly to the DMs of homeserver admins.We encourage everyone to take just one minute per week to read these updates and stay informed. This small effort will help prevent confusion and ensure smoother operations.Service Updates: Monitoring ChangesThis week, we made significant backend changes to the monitoring service . If you notice unexpected behavior or incorrect results in reports , please contact us .Additionally, all customers will have the Systemd unit monitoring feature enabled in the upcoming week.Source2024-11-21 21:00 UTCStable Updates PublishedBaibot : v1.3.2 -> v1.4.0Borgmatic: 1.9.1 -> 1.9.2Discord : v0.7.0 -> v0.7.1Element : v1.11.85 -> v1.11.86Gmessages : v0.5.1 -> v0.5.2Grafana : 11.3.0 -> 11.3.1Meta Instagram : v0.4.1 -> v0.4.2Meta Messenger : v0.4.1 -> v0.4.2Signal : v0.7.2 -> v0.7.3Slack : v0.1.2 -> v0.1.3Synapse Admin : v0.10.3-etke30 -> v0.10.3-etke31Vaultwarden : 1.32.4 -> 1.32.5Whatsapp : v0.11.0 -> v0.11.1Service Updates: Synapse Admin Path ChangesWith this update, the Synapse Admin path changed from https://matrix.your-server.com/synapse-admin to https://matrix.your-server.com/adminSource2024-11-14 21:00 UTCStable Updates PublishedBaibot : v1.3.1 -> v1.3.2Borgmatic: 1.9.0 -> 1.9.1Cinny : v4.2.2 -> v4.2.3Element : v1.11.84 -> v1.11.85Grafana : 11.2.2 -> 11.3.0Jitsi : stable-9779 -> stable-9823Miniflux : 2.2.2 -> 2.2.3Synapse : v1.118.0 -> v1.119.0Synapse Admin : v0.10.3-etke29 -> v0.10.3-etke30Vaultwarden : 1.32.3 -> 1.32.4Source«««12345678»»»Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
