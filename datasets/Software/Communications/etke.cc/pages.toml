title = "etke.cc | News"
description = "copy of #news:etke.cc room messages"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeNewsThis page contains copy of #news:etke.cc room messages, but you may use RSS , or Fediverse to get them. Additionally, you may check News Archive for full list of messages.2021-09-21 16:47 UTCservers update in progressnew versions:IRC (appservice) 0.30.0 -> 0.31.0IRC (heisenbridge) 1.0.1 -> 1.1.1Mjolnir 0.1.19 -> 1.1.20 +changed versioning schemeElement 1.8.4 -> 1.8.5Grafana 8.1.3 -> 8.1.4Nginx 1.21.1 -> 1.21.3Synapse 1.42.0 -> 1.43.0service updatesWe start offering hosting options for people and organizations who don’t want to setup their own VPS, based on Hetzner with following locations: Germany and Finland. Right now, 3 plans available - small ( $15 ), medium ( $18 ) and big ( $23 ), all plans include following features:VPS itselfMaintenanceEmail services for domainProvider-level firewall (rules are the same as on-server firewall + strict IP whitelist for ssh)Daily backups (7 days retention)We still don’t want to be some kind of SaaS provider, so even now we offer hosting that’s still considered as your own server, the only difference is you pay for VPS not to AWS or other cloud provider directly, but through us. So, you have root access to your server and control how it works inside.If you have any questions - ask them in #discussion:etke.cc roomNew order system on website is up and running (our website is heavily cached, so in case you don’t see new order form with different options try to clear cache in your browser)call to action (organizations)As you saw on website, we added Case Studies section some time ago and the first organization who published their story is Reidel Law Firm. We want to add more cases to that section to help more organizations choose Matrix for internal communications (and, I hope, external, too).So if you use Matrix in your organization as messenger or platform for your product or in any other way - please, send me PM, etke.cc service will be honored to publish your storySource2021-09-13 16:12 UTC (updated)Note to F-droid users: there is unofficial repo with automated builds of element Android development branch: fdroid.krombel.de (maintained by @krombel:msg-net.de)That repo contains fixed version of the app.Source2021-09-13 16:11 UTCservers update in progressnew versions:Element 1.8.2 -> 1.8.4 security fixGrafana 8.1.2 -> 8.1.3#miounne:etke.cc 1.0.0 -> 1.0.2#discussion:etke.ccSource2021-09-13 15:53 UTCDue to security fix, etke.cc subscribers’ servers will be updated today instead of tomorrow, an announcement with updated components will be posted later today.Source2021-09-07 19:33 UTCservers update in progressnew versions:Element 1.8.1 -> 1.8.2IRC (heisenbridge) 1.0.0 -> 1.0.1Synapse 1.41.1 -> 1.42.0dnsmasq new#miounne:etke.cc 1.0.0WireGuardadded dnsmasq integration#discussion:etke.ccSource2021-08-31 18:38 UTCservers update in progressthis update contains various configuration changes to decrease the load created by bridges with rarely needed things. If you don’t like any of the following changes, just send me a PM and it will be reverted for your servernew versions:Mjolnir 0.1.18 -> 0.1.19Hydrogen 0.2.5 -> 0.2.7Coturn 4.5.2-r3 -> 4.5.2-r4Grafana 8.0.6 -> 8.1.2Jitsi 5963 -> 6173Mailer (exim) 4.94.2-r0-3 -> 4.94.2-r0-4Prometheus 2.29.1 -> 2.29.2Synapse 1.41.0 -> 1.41.1 security fixTurnkey subscription planenabled external firewallWireGuardadded full IPv6 support, now it works in dual-stack moderegenerated devices’ configs (keys didn’t change, so you can work with old config or copy new configs to enable ipv6)Telegramit’s the most resource-heavy bridge because people tend to bridge large chats, so with the following changes your server’s life will be easier and require less CPU/RAM/diskenabled sync of direct chats on startupdisabled delivery receipts(only for new rooms) set initial sync size of telegram users in the bridged room to 10, other members will be synced when they send a message to that room(only for new rooms) disabled sync of members of bridged telegram channels (you can’t send any message to telegram channel, only read it, so no need to waste resources on puppets for readers)(only for new rooms) explicitly set room name and avatar on creationLinkedIn, Instagram, Facebook, Discord, GroupME, Skype, Slack, Steam, Twitterdisabled bridge presence#discussion:etke.ccSource2021-08-25 15:50 UTCservers updatesIRC 0.29.0 -> 0.30.0Linkedin 0.5.0 newElement 1.8.0 -> 1.8.1Corporal 2.1.1 -> 2.1.2Coturn 4.5.2-r2 -> 4.5.2-r3Mailer 4.94.2-r0-2 -> 4.94.2-r0-3Telegram 0.9.0 -> 0.10.1Prometheus (node exporter) 1.2.0 -> 1.2.2Prometheus (postgres exporter) 0.9.0 -> 0.10.0Prometheus 2.28.1 -> 2.29.1Sygnal 0.9.0 -> 0.10.1Synapse 1.40.0 -> 1.41.0#discussion:etke.ccSource2021-08-17 16:49 UTCservers updatesElement 1.7.34 -> 1.8.0IRC (heisenbridge) latest -> 1.0.0 version pinningFacebook bridge latest -> 0.3.1 version pinningMiniflux 2.0.31 -> 2.0.32#discussion:etke.ccSource2021-08-16 16:45 UTCNew post on element blog regarding new features included in latest releases:https://element.io/blog/introducing-voice-messages-and-so-much-more/ ​I wish threads among them…Source2021-08-10 17:49 UTC (updated)note to subscribers: please, reboot your servers tomorrow (or at least in 3-5 hours, not earlier) to load new kernel versions and cleanup iptables rules.There was an issue with firewall configuration and because of that downtime (< 1 hour) occurred, sorry! To avoid other issues, server reboot is encouraged.If you face that issue again, please, run following command: sudo iptables -I DOCKER-USER 1 -j RETURNSource«««1920212223242526»»»Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
