full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpBridgesWhatsAppWhatsApp bridgeThe WhatsApp bridge installed by us is powered by mautrix-whatsapp. full documentation source code supportUsageStart a chat with @whatsappbot:your-server.com. When it joins, type help in the chat to see instructionsSend login to the bridge botOpen WhatsApp on your phoneTap Menu or Settings and select WhatsApp WebPoint your phone at the image sent by the bot to capture the codeRecent chats should now get portals automatically. Other chats will get portals as you receive messages.Please note that the bridge uses the web API, so your phone must be connected to the internet for the bridge to work. The WhatsApp app doesn’t need to be running all the time, but it needs to be allowed to wake up when receiving messages. The web API is used instead of the main client API to avoid getting banned.If you need assistanceBefore seeking help, make sure to thoroughly review the documentation. If you still have questions, please don't hesitate to contact bridge's support. Please note that etke.cc Customer Support exclusively handles server-related inquiries. For any questions related to the bridge, please reach out to bridge's support.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
