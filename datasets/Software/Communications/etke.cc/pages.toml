description = "copy of #news:etke.cc room messages"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeNewsThis page contains copy of #news:etke.cc room messages, but you may use RSS , or Fediverse to get them. Additionally, you may check News Archive for full list of messages.2024-09-05 20:00 UTCStable Updates PublishedRadicale : 3.2.2.0 -> 3.2.3.0Synapse : v1.113.0 -> v1.114.0#discussion:etke.ccSource2024-08-29 20:00 UTCStable Updates PublishedElement : v1.11.75 -> v1.11.76Maubot : v0.4.2 -> v0.5.0Prometheus : v2.54.0 -> v2.54.1#discussion:etke.ccSource2024-08-22 20:00 UTCStable Updates PublishedBuscarron : v1.4.2 -> v1.4.3Element : v1.11.74 -> v1.11.75Honoroit : v0.9.24 -> v0.9.25Hydrogen : v0.4.1 -> v0.5.0Miniflux : 2.1.4 -> 2.2.0Postmoogle : v0.9.20 -> v0.9.21Signal : v0.6.3 -> v0.7.0Slack : latest -> v0.1.0Nginx : 1.27.0-alpine -> 1.27.1-alpineService Updates: Migration to GitHubWe’ve previously been using Gitlab, because other platforms lacked features we needed.It seems like Github has caught up and provides a better platform with a larger community of users.As such, we’ve migrated all of our Gitlab repositories to Github. Most of our repositories were migrated to the new etkecc organization, while non-Matrix-related Ansible roles (which were already used by the MASH playbook ) now live under the MASH organization.There is a lot of housekeeping to do (e.g., updating various website links), but the migration part of the process is now complete.With this change, we hope to achieve improved collaboration on our FOSS projects!#discussion:etke.ccSource2024-08-15 20:00 UTCStable Updates PublishedElement : v1.11.73 -> v1.11.74Etherpad : 2.1.1 -> 2.2.2Grafana : 11.1.3 -> 11.1.4Heisenbridge : 1.14.6 -> 1.15.0Prometheus : v2.53.1 -> v2.54.0Synapse : v1.112.0 -> v1.113.0Vaultwarden : 1.31.0 -> 1.32.0#discussion:etke.ccSource2024-08-08 20:00 UTCStable Updates PublishedCinny : v4.0.3 -> v4.1.0Element : v1.11.72 -> v1.11.73Exim Relay : 4.98-r0-0 -> 4.98-r0-1Jitsi : stable-9584-1 -> stable-9646Traefik : v3.1.1 -> v3.1.2Service Update: New Component - MaubotMaubot is available for order. Existing customers may request it by contacting us#discussion:etke.ccSource2024-08-01 20:02 UTCStable Updates PublishedCoturn : 4.6.2-r10 -> 4.6.2-r11Element : v1.11.71 -> v1.11.72Grafana : 11.1.1 -> 11.1.3Honoroit : v0.9.23 -> v0.9.24Peertube : v6.2.0 -> v6.2.1Postmoogle : v0.9.19 -> v0.9.20Redis : 7.2.4 -> 7.2.5Synapse : v1.111.0 -> v1.112.0Traefik : v3.1.0 -> v3.1.1#discussion:etke.ccSource2024-07-25 20:01 UTCStable Updates PublishedBuscarron : v1.4.1 -> v1.4.2Cinny : v3.2.0 -> v4.0.3Grafana : 11.1.0 -> 11.1.1Honoroit : v0.9.22 -> v0.9.23Postmoogle : v0.9.18 -> v0.9.19Synapse Admin : 0.10.2 -> 0.10.3#discussion:etke.ccSource2024-07-18 20:00 UTC (updated)Stable Updates PublishedBorgmatic: 1.8.11 -> 1.8.13Discord : v0.6.5 -> v0.7.0Element : v1.11.70 -> v1.11.71Exim Relay : 4.97.1-r0-1 -> 4.98-r0-0Gmessages : v0.4.2 -> v0.4.3Googlechat : v0.5.1 -> v0.5.2Meta Instagram : v0.3.1 -> v0.3.2Meta Messenger : v0.3.1 -> v0.3.2Peertube : v6.1.0 -> v6.2.0Prometheus Node Exporter : v1.8.1 -> v1.8.2Signal : v0.6.2 -> v0.6.3Synapse : v1.110.0 -> v1.111.0Telegram : v0.15.1 -> v0.15.2Traefik : v3.0.4 -> v3.1.0Twitter : v0.1.7 -> v0.1.8Whatsapp : v0.10.8 -> v0.10.9Service Updates: etke.cc SSH Keys Have Been RotatedNew keys have been published on the website (https://etke.cc/keys.txt ) and rotated on customers’ servers. This is an automatic process, you don’t need to do anythingReminder About Subscriptions MigrationContext . Impacts only customers on the deprecated price model (Maintenance and Turnkey subscriptions). If you got your server after December 2023 or already switched to the new By Complexity model, you are not affected and thus you don’t need to do anything.If you intend to switch from a deprecated subscription plan, you don’t need to submit a new order. Just obtain the price for your specific server by using run price of etke.cc/scheduler and follow the step-by-step guide to update your payment details#discussion:etke.ccSource2024-07-11 20:00 UTCStable Updates PublishedContainer Socket Proxy : 0.1.2 -> 0.2.0Element : v1.11.69 -> v1.11.70Etherpad : 2.1.0 -> 2.1.1Exim Relay : 4.97.1-r0-0 -> 4.97.1-r0-1Honoroit : v0.9.21 -> v0.9.22Jitsi : stable-9584 -> stable-9584-1Miniflux : 2.1.3 -> 2.1.4Prometheus : v2.53.0 -> v2.53.1Synapse Admin : 0.10.1 -> 0.10.2Traefik : v2.11.4 -> v3.0.4Vaultwarden : 1.30.5 -> 1.31.0Service Updates: HTTP/3 SupportHTTP/3 is now supported and enabled by default for all customers, making access to services even faster.On-Premises customers, which have an additional firewall in front of their server, will need to open UDP ports 443 and 8448 in their provider-level firewall (if enabled) for HTTP/3 to work.Service Updates: The Scheduler Gets price CommandThe price command provides an overview of your server’s cost with a detailed breakdown by components, it’s especially handy when you want to adjust your server’s components and their cost.Notice About Subscriptions MigrationContext . Impacts only customers on the deprecated price model (Maintenance and Turnkey subscriptions). If you got your server after December 2023 or already switched to the new By Complexity model, you are not affected and thus you don’t need to do anything.If you intend to switch from a deprecated subscription plan, you don’t need to submit a new order. Just obtain the price for your specific server by using run price of etke.cc/scheduler and follow the step-by-step guide to update your payment details#discussion:etke.ccSource2024-07-04 20:00 UTCStable Updates PublishedJitsi : stable-9457-2 -> stable-9584Sliding Sync : v0.99.18 -> v0.99.19Synapse : v1.109.0 -> v1.110.0Service Updates: GoToSocial S3 SupportGoToSocial supports S3 storage, and starting this week, we added optional s3 configuration to the GoToSocial component on the order form for new customers. Existing customers may request s3 storage by contacting us#discussio