full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 Theme2023-08-25 08:52 UTCTLDR: Bring-your-own-server orders on etke.cc no longer incur a one-time setup fee ($50) as part of a pricing change experiment, thus making Matrix hosting with us more accessible and encouraging more people to host on their own server. Additional details are below.At etke.cc , we’re working on a new ordering form, new services and pricing changes to match. We’re always trying to cut down costs and to make prices more fair - smaller/simpler setups costing less, while orders with many components (requiring more work to setup and to support) having a higher cost.At the same time, we’re working on automating more of the order-handling flow and of server maintenace, so that we can keep costs low for everyone.While all these changes are still being worked on (coming soon!), we’d like to announce another change - the experimental removal of the $50 one-time setup fee that we used to charge for Bring-your-own-server orders . With this fee removed, we’re aiming to encourage more people to try Matrix on their own server (on-premise or rented from any provider in any localtion), as opposed to renting Hetzner Cloud servers out through us via our Turnkey offering.While our Turnkey offering (optionally combined with hosting on a domain of ours like YOU.etke.host or YOU.onmatrix.chat) is still the easiest way to get started, we’d like to promote our more-independent and vendor-lock-in-free Bring-your-own-server offering more.Bring-your-own-server orders are more difficult/costly for us to process compared to hosting Turnkey servers that we are in complete control of, so removing the one-time setup fee may come back to bite us through an influx of many and difficult to process orders. For now, we’ve decided to take this risk and see how it goes. If you’ve been wishing to host Matrix via etke.cc but this fee was holding you back, now is your chance!SourceDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
