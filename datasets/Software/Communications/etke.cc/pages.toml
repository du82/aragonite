["https://etke.cc/help/faq"]
title = "etke.cc | Frequently Asked Questions"
description = "Learn the importance of .well-known redirects for shorter, user-friendly Matrix usernames and the required open ports for Matrix server components. Understand how to have multiple administrators on your server, modify the registration flow, and troubleshoot common issues. Get answers to frequently asked questions about Matrix servers."
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeFrequently Asked QuestionsWhat is Federation? Can I disable it?Can I migrate my server or its data to etke.cc?I want to get a new Matrix server from etke.cc based on exported data from my current providerI want to have an existing Matrix server installed with matrix-docker-ansible-deploy to be maintained by etke.ccI want to have existing Matrix servers installed using any other method to be maintained by etke.ccCan I have one-time setup without a subscription?Why are .well-known redirects on the base domain important?What are the base Matrix components installed on the server?What ports should be open?Can I have multiple administrator accounts on my server?Can I change the registration (sign-up) flow?(Default) Invite-Based RegistrationClosed RegistrationOpen RegistrationSingle Sign-On (SSO)My newly-installed server joins new rooms slowlyBridge bot doesn’t respondPaymentsHow to migrate to the By Complexity subscription?When will old subscriptions (Maintenance and Turnkeys) be deprecated?What about deprecated components?Can I modify the server configuration or run additional services?Modifying Matrix configuration manually on the server is prohibitedRunning other services along our stack is OKWhat is Federation? Can I disable it?We’ve prepared a dedicated page with information and common questions about Matrix FederationCan I migrate my server or its data to etke.cc?I want to get a new Matrix server from etke.cc based on exported data from my current providerThe short answer is: no - we do not support migration.The long answer has been removed, because it gave a false impression that migration is possible in some cases. We’ve decided to be clear and upfront about this: we do not support migration.I want to have an existing Matrix server installed with matrix-docker-ansible-deploy to be maintained by etke.ccIf you have a relatively up-to-date server installation done with the matrix-docker-ansible-deploy Ansible playbook, it may be possible to migrate your setup to us.However, it will require prior reviewing of your existing configuration, as components offered on etke.cc (which you can see on our Order Form ) differ from those offered by the Ansible playbook.Please, contact us and send over a cleaned up (no passwords and secrets) version your vars.yml file, so we can let you know if:we can migrate your setup as-is immediatelyor, we’re planning on adding support for the services that you’re missingI want to have existing Matrix servers installed using any other method to be maintained by etke.ccUnfortunately, that is technically impossible.Can I have one-time setup without a subscription?We do not offer one-time setups. Our services are subscription-based and we do not provide “just setup” service.We are committed to providing enhancements and upgrades on a regular basis, and we believe that a subscription model is the best way to ensure that we can continue to provide the best possible service to our customers.And so, we are unable to provide one-time setups.Why are .well-known redirects on the base domain important?Moved to the Delegation RedirectsWhat are the base Matrix components installed on the server?We offer a lot of optional Matrix bridges , bots and extra services , but all Matrix servers come installed with a set of core Matrix components:the Synapse Matrix homeserver software. At this moment, this is the most complete and compatible homeserver implementation. We currently do not offer alternative homeserver software like Conduit , Construct or Dendrite .the matrix-synapse-shared-secret-auth module for Synapse, which assists various bridges and bots with authenticationthe synapse_auto_compressor tool, which runs in the background and periodically compresses the database for the Synapse homeserver, so that it runs optimally.the sliding-sync software which assists next-generation clients like Element X in talking to the homeserver in an optimized manner. In the future, it’s expected that the homeserver itself (e.g. Synapse) will handle these tasks, but for now a separate component is necessary.the Synapse Admin web UI tool for homeserver managementthe Coturn TURN server, to assist audio/video callsa PostgreSQL database server, storing the data for Synapse and other services(only for Bring-your-own-server types of orders), the docker-postgres-backup-local software which makes periodic local backups of your PostgreSQL database - we store 7 daily database dumps by default. For Turnkey orders (hosted on Hetzner Cloud VPS servers rented by us), we do not enable local Postgres database dumps, because we enable Hetzner’s server backups feature , which stores the last 7 daily full-disk snapshots.optionally, the Element web application for chatting on your Matrix server, but we also support some alternative client applications like Cinny and SchildiChat . Regardless of the web application we may install on your server, you can connect to your server via any compatible Matrix client application on any platform.a Traefik reverse-proxy server, which obtains free Let’s Encrypt SSL certificates for all domains used in your setupa Prometheus Node Exporter agent for basic monitoring and alerting. Metrics data is collected by our own external Prometheus system which also does alerting. In the event of trouble, alerts go out to us and to you via email and Matrix.What ports should be open?Moved to the Ports and FirewallsCan I have multiple administrator accounts on my server?Yes, you can have multiple administrator accounts on your Matrix server. However, there are some important details to consider:Matrix Homeserver Administration: By default, our order form on the website configures a single administrator user account. This user has full access to the Synapse Admin tool and various administration APIs of your Matrix server. You can create additional Matrix administrator accounts using the Synapse Admin tool without needing to contact us.etke.cc Service Management: To manage your server using our scheduler bot for maintenance scheduling and other commands, you need to prepare Matrix accounts for additional administrators. You can create these accounts (e.g., using Synapse Admin ) and provide us with their Matrix IDs (e.g., @someone:YOUR_SERVER). We will grant them access to the bot. These accounts must be on your server’s domain and not on other Matrix servers across federation.Matrix Bridge Administration: If you require additional administrators for your Matrix bridges, whether on your server or other servers, provide us with their Matrix IDs (e.g., @someone:YOUR_SERVER or @someone:ANOTHER_SERVER). We will grant them administrator access to your bridges.Can I change the registration (sign-up) flow?By default, we configure invite-based registration on all servers we set up. Enabling completely open registration is generally not recommended due to potential spam and abuse.Check the supported registration types for your Matrix server below.(Default) Invite-Based RegistrationThe Matrix protocol supports Token-authenticated registration . This means registration is closed by default, allowing only those with a valid invite token to register. Admins can issue invite tokens using the Synapse Admin tool, and each token can be configured for multiple registrations with various options, including expiration dates.Closed RegistrationClosed registration is similar to invite-based registration . Admins can still manually register users using the Synapse Admin tool, but users cannot register themselves with invitation tokens.Open RegistrationCompletely open registration allows anyone on the internet to register on your server without restrictions. However, this can lead to spam and abuse. To enhance security, you can enable mandatory email verification, ensuring users confirm their email addresses. An SMTP relay is recommended for this setup to prevent emails from landing in spam.Single Sign-On (SSO)You can use Single Sign-On (SSO) with an OpenID Connect provider to allow registration for specific groups of people. SSO can work alongside other registration types, including invite-based , closed registration , or open registration with or without domain restrictions. For instance, you can link your Matrix server to a provider like Google Workspace for one-click registration for your users while restricting access for others.My newly-installed server joins new rooms slowlyNewly set up Matrix servers lack knowledge about other servers. When you join a room over federation, your server contacts other servers and retrieves data about the room and its members. This process can be slow, especially in larger rooms, as each step involves rate limiting and potential network issues. Over time, your server builds a network of federated servers, and room joins become faster. Be patient, and room joins will improve with time.Bridge bot doesn’t respondIf your bridge bot isn’t responding, there are two common issues to check:Wrong Bridge MXID: Ensure you’re contacting the correct bridge bot associated with your server. Make sure to use the correct Matrix IDs, which are listed in your onboarding materials or bridge documentation pages .Encrypted Room: We typically set up bridges with encryption support disabled as it can be unstable. Some client apps may automatically create encrypted rooms when trying to chat with a bridge bot. To avoid this, create a new room and disable encryption. Then invite the bridge bot to the roomIf you encounter other issues, please refer to our additional documentation resources.PaymentsWe’ve prepared a dedicated page with payment guides and instructions .How to migrate to the By Complexity subscription?If you’re on an old, deprecated, subscription tier (Maintenance, Maintenance + Email or one of the Turnkeys), you should migrate to the new By Complexity subscription plan. This new plan is based on the infrastructure, maintenance, and support complexity of specific components, ensuring fair pricing, otherwise you loose access to etke.cc support (more details ).How to verify your current subscription tier:Either your server was installed before December 2023 and you didn’t switch to the new subscription tier yetOr your subscription tier on your Ko-Fi account page is not “By Complexity”How to migrate:Just obtain the price for your specific server by using run price command of the Scheduler and follow the step-by-step guide to update your payment details.When will old subscriptions (Maintenance and Turnkeys) be deprecated?Since December 2023, we operate on a new pay-by-complexity service model under which customers pay a different monthly subscription fee - based on the services we are providing to them. Customers who order a basic server with few components pay minimally (e.g. $5/mo), while others who order tens of services pay more (e.g. $100/mo). People on this new By Complexity subscription tier are always charged according to the services we run for them and this FAQ entry does not apply to them.Customers from before December 2023 are on an old subscription tier (Maintenance, Maintenance + Email or Turnkey) which has a fixed price. Such customers can keep their existing subscription under certain conditions.Until 1st of July 2024, existing customers can remain on their old subscription tier as long as the subscription is active (not overdue) and the services we provide to them remain unchanged. That is:if customers subscription is overdue (i.e., inactive), we’ll ask them to switch to the new By Complexity subscription tierif customers continue to use the same services, they can remain on the same subscription tier and we won’t charge them differentlyif customers request additional services from us, we’ll need to ask them to switch to the new By Complexity subscription tier, so we can charge them fairly according to our new pricing modelUpdate: after the 6 months of the grace period, starting from 1st of July 2024, any existing customer who contacts our support will be asked to switch to the new By Complexity subscription plan. If customers wish to continue using our services without support, they can remain on the same subscription tier for longer. We have not yet established a final date after which we’ll completely abandon the old subscription tiers.Announcement with details , Migration guideWhat about deprecated components?We’ve prepared a dedicated page with information about removed components .Can I modify the server configuration or run additional services?With us, you get a managed Matrix server. Be it on-premises, or hosted by us, we take care of the server’s configuration and maintenance. This means you can focus on using the server and not worry about its upkeep.Modifying Matrix configuration manually on the server is prohibitedBecause:it often causes breakage and increases our support burdenwill typically be rolled-back by our automation (scheduler bot )Please, contact us if you need any changes to your server configuration. We’ll be happy to help.Running other services along our stack is OKBut:may cause breakagemay break at any time in the future due to service upgrades performed by uscomes without any support from usDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
