title = "etke.cc | Slack bridge"
description = "Information about the Slack bridge for Matrix offered by etke.cc, and powered by mautrix-slack"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpBridgesSlackSlack bridgeThe Slack bridge installed by us is powered by mautrix-slack. full documentation source code supportUsageStart a chat with @slackbot:your-server.com. When it joins, type help in the chat to see instructions.Option 1: Password loginSend login-password your@email.here slack-team-domain.here your-password.here (e.g., login-password me@example.com example.slack.com superSecretPassword to the bridge bot.Recent chats should now get portals automatically. Other chats will get portals as you receive messages.Password login isn’t guaranteed to always be fully supported, but you can switch to token-based login at any time afterwards by following the instructions in the section below without signing out.Option 2: Token loginOpen a slack workspace in a browserOpen browser dev tools (chrome dev tools) and go to the Network tabFilter requests by type WS/WebSocketFind xoxc token as a parameter of one of the URLsGo to the dev tools Storage tab to get a list of cookiesFind d cookie and copy its contentsSend login-token your.xoxc-token your.d-cookie to the bridge botAfter login using a token, all your joined channels will automatically be bridged into Matrix, but DMs will only appear once you receive messages in them.If you need assistanceBefore seeking help, make sure to thoroughly review the documentation. If you still have questions, please don't hesitate to contact bridge's support. Please note that etke.cc Customer Support exclusively handles server-related inquiries. For any questions related to the bridge, please reach out to bridge's support.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
