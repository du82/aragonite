full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 Theme2023-04-27 20:04 UTCStable Updates PublishedElement / app.etke.cc 1.11.29 -> 1.11.30Grafana 9.4.7 -> 9.5.1Ntfy 2.3.1 -> 2.4.0Synapse 1.81.0 -> 1.82.0Do you want to receive updates up to 1 week before the stable release? Switch to the fresh stability branchService Updates: MatrixRooms.infoLack of rooms discovery for new users is one of the issues we noticed, so today, we welcome you to MatrixRooms.info , a search engine built for matrix rooms discovery.The current index contains over 230,000 rooms across 19,000 servers, and we’re constantly tweaking it to provide more relevant search results. Even non-English users may find it useful because it does automatic language detection in room names and topics (during the alpha stage language analysis limited to English, Hindi, Spanish, French, Russian, Portuguese, German)We plan the following future improvements:Searching by languageSearching by specific fieldProviding a browsable catalog of rooms by server/language/etcImplementing a subset of the Matrix Server-Server API to request (and provide!) a Matrix-native rooms directoryMatrixRooms.info , Source code , #mrs:etke.ccAs with anything else we do at etke.cc , the website, its API backend and all related tools are free software (A/GPL).#discussion:etke.ccSourceDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
