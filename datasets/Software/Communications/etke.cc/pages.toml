["https://etke.cc/help/extras/jitsi"]
title = "etke.cc | Jitsi - video conferencing service"
description = "Jitsi is a free video conferencing tool, which is offered as an add-on service."
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpExtra ServicesJitsi - video conferencingJitsi - video conferencing serviceWho is it for?UsageAuthentication official website full documentation source code supportJitsi is a free video conferencing tool which is often used for group calls in Matrix, but can also be used standalone.In the future, Jitsi’s usage within Matrix will be replaced with Element Call . For now, Element Call is not yet supported by us. Jitsi image source: the Jitsi organization on Github .Who is it for?On Matrix:1-on-1 audio/video calls use WebRTC directly (assisted by a TURN server) and do not use Jitsigroup calls use Jitsi and sometimes the new Element Call service (depending on the client application)If you don’t have your own Jitsi instance, the public Jitsi instance will be used by default. As such, you do not necessarily need your own Jitsi instance.For additional privacy, you can enable the Jitsi component and your Matrix server will be reconfigured to use it.Jitsi can also be used standalone, without Matrix. If you wish to have an audio/video conferencing tool installed on your server, that may be another point in favor of installing it.Keep in mind, that Jitsi is heavy on server resources (CPU, RAM, network bandwidth).We optimize for the common use-case - for us, this is small-scale deployments. Video conferencing tools are heavy and hard to scale. Our Jitsi setup is not optimized for high availability and scalability. If you need a solution for hundreds (or even thousands) of people, we may not be the best choice for hosting your Jitsi instance.UsageWe host your Jitsi instance at a URL like: https://jitsi.your-server.com.Within Matrix (on client apps like Element, etc.) just start an audio/video call in a group room and Jitsi should automatically load inside the Matrix client application.Standalone, you can go to your Jitsi instance URL and start a meeting there.By default, your Jitsi instances is open for anyone to use. This provides the best User Experience (no additional logins, etc.), but allows others to potentially use your instance. If necessary, your Jitsi instance can be protected with additional Authentication .AuthenticationBeside the default “open to anyone” type of server, Jitsi also supports multiple authentication methods.We only support one authentication method, called Jitsi internal authentication. It uses a list of usernames and password pairs.When enabled, before joining a meeting (through Matrix or standalone, as described in usage ) people will need to provide their (Jitsi internal auth) username and password.To have Jitsi internal authentication enabled for your Jitsi server, contact us and send over the usernames and passwords that you would like to have access to your Jitsi instance.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
