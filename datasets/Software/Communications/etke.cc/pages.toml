title = "etke.cc | Made by etke.cc"
description = "List of all components made by etke.cc"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeMade by etke.ccOver the years we’ve developed a lot of components for use on etke.cc, which are also benefiting the open-source Matrix ecosystem.While the full list of components is available on our GitHub profile , you may notice made by etke.cc badges on some pages of this website.What does it mean?Components marked with this badge are developed by us and we prioritize our customers’ needs in terms of support and development. Please, note that the support for the components developed by us is provided via the same channels as for any of the other components, i.e. by clicking the “Support” link on each component’s page, not by contacting us directly.If you have any questions or need help with the components developed by us, please, use the “Support” link on each component’s page.The ListHere is the list of the components developed by us and installed or available directly on customers’ servers:Baibot (bot) - Conversational AI in Your Matrix RoomsBuscarron (bot) - Allows forms you add to your website to be submitted to a Matrix room of your choice.Email (bridge) - Postmoogle is a Matrix bot that bridges email and Matrix, allowing you to send and receive emails from Matrix rooms.Honoroit (bot) - A specialized helpdesk bot designed to streamline support interactions within the Matrix ecosystem.Synapse Admin (extra-service) - Discover Synapse Admin, a powerful tool for efficient Matrix Synapse homeserver managementThe Scheduler (extra-service) - Discover The Scheduler, an exclusive maintenance system designed for etke.cc customers. Customize your server maintenance with flexibility and a choice of stability branches. Get started with straightforward commands and enjoy four distinct work modes: Run, Schedule, Recurring, and List. Proactively receive alerts about server issues. Select from essential commands like ping, disk, maintenance, and restart. Choose between stability branches 'stable' for reliability and 'fresh' for the latest updates. Stay in control of your server's maintenance and stability with The Scheduler.Here is the list of the components developed by us and provided as a cloud service to our customers:admin.etke.cc - a cloud version of the Synapse Admin component (originally developed by Awesome-Technologies , later forked by us and improved)MatrixRooms.info - an instance of MRS (Matrix Rooms Search), a search engine for Matrix roomsDocker Registry Proxy - a caching Docker Registry proxy with excessive list of features used as part of our Private Docker Registry serviceDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
