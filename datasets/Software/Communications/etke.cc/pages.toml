["https://etke.cc/news/page/9"]
title = "etke.cc | News"
description = "copy of #news:etke.cc room messages"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeNewsThis page contains copy of #news:etke.cc room messages, but you may use RSS , or Fediverse to get them. Additionally, you may check News Archive for full list of messages.2023-09-15 13:30 UTCServers Update In Progress (Security Fix)Synapse 1.92.1 -> 1.92.2a critical vulnerability in libwebpDetails#discussion:etke.ccSource2023-09-14 20:01 UTCStable Updates PublishedElement / app.etke.cc 1.11.40 -> 1.11.42Jitsi stable-8922 -> stable-8922-1Synapse 1.91.2 -> 1.92.1Service Updates: Better Email AlertsWe’ve had customer complaints about the poor deliverability of the alert emails, so we switched from a homegrown solution to Postmark for sending alert emails, the same way we do for order follow-ups. We hope that this will help avoid issues and reduce downtimeService Updates: Enforced Postgres Vacuum during the MaintenanceA few recent Synapse versions contained various bugs related to excessive disk utilization, including ineffective database usage. To work around the problem, we enforce database vacuuming during the maintenance run by default. Details: Postgres documentation (lock-free VACUUM mode is used)Service Updates: Sliding-Sync Enabled by DefaultElement X has become more common nowadays, and one of the special requirements of the app is a backend with sliding sync (sync v3) support. Starting with this update, sliding-sync proxy will be installed by default on all customers servers (including existing customers) automatically#discussion:etke.ccSource2023-09-07 20:05 UTCStable Updates PublishedGrafana 10.1.0 -> 10.1.1#honoroit:etke.cc 0.9.18 -> 0.9.19Hydrogen 0.4.0 -> 0.4.1Jitsi stable-8615 -> stable-8922Prometheus 2.45.0 -> 2.47.0Sliding Sync 0.99.7 -> 0.99.10Synapse 1.91.0 -> 1.91.2#discussion:etke.ccSource2023-08-31 20:02 UTCStable Updates PublishedElement / app.etke.cc 1.11.39 -> 1.11.40SchildiChat 1.11.30-sc.2 newGrafana 10.0.3 -> 10.1.0Sliding Sync 0.99.5 -> 0.99.7Synapse 1.90.0 -> 1.91.0Uptime Kuma 1.23.0 -> 1.23.1That update package contains fixes for several synapse bugs related to rapidly increasing disk utilization. We recommend that you take advantage of the ‘run maintenance’ of etke.cc/scheduler as soon as possible.Service Updates: New ComponentThe new SchildiChat web app is available for order for new customers, existing customers can request it using etke.cc/contacts .SchildiChat Web is a (catching up) Element Web fork with additional neat features. While it is 10 versions behind the upstream, it still has way more customization options.#discussion:etke.ccSource2023-08-25 08:52 UTCTLDR: Bring-your-own-server orders on etke.cc no longer incur a one-time setup fee ($50) as part of a pricing change experiment, thus making Matrix hosting with us more accessible and encouraging more people to host on their own server. Additional details are below.At etke.cc , we’re working on a new ordering form, new services and pricing changes to match. We’re always trying to cut down costs and to make prices more fair - smaller/simpler setups costing less, while orders with many components (requiring more work to setup and to support) having a higher cost.At the same time, we’re working on automating more of the order-handling flow and of server maintenace, so that we can keep costs low for everyone.While all these changes are still being worked on (coming soon!), we’d like to announce another change - the experimental removal of the $50 one-time setup fee that we used to charge for Bring-your-own-server orders . With this fee removed, we’re aiming to encourage more people to try Matrix on their own server (on-premise or rented from any provider in any localtion), as opposed to renting Hetzner Cloud servers out through us via our Turnkey offering.While our Turnkey offering (optionally combined with hosting on a domain of ours like YOU.etke.host or YOU.onmatrix.chat) is still the easiest way to get started, we’d like to promote our more-independent and vendor-lock-in-free Bring-your-own-server offering more.Bring-your-own-server orders are more difficult/costly for us to process compared to hosting Turnkey servers that we are in complete control of, so removing the one-time setup fee may come back to bite us through an influx of many and difficult to process orders. For now, we’ve decided to take this risk and see how it goes. If you’ve been wishing to host Matrix via etke.cc but this fee was holding you back, now is your chance!Source2023-08-25 06:14 UTCStable Updates PublishedBorgmatic 1.7.15 -> 1.8.2Discord bridge 0.6.0 -> 0.6.1Etherpad 1.9.0 -> 1.9.2Google Messages bridge latest -> 0.1.0 pinMiniflux 2.0.46 -> 2.0.47Ntfy 2.6.2 -> 2.7.0Redis 7.0.12 -> 7.2.0Uptime Kuma 1.22.1 -> 1.23.0WhatsApp bridge 0.9.0 -> 0.10.0#discussion:etke.ccSource2023-08-17 22:25 UTCStable Updates PublishedElement 1.11.38 -> 1.11.39IRC bridge 1.14.4 -> 1.14.5Nginx 1.25.1 -> 1.25.2Prometheus Node Exporter 1.6.0 -> 1.6.1Redis 7.0.10 -> 7.0.12#discussion:etke.ccSource2023-08-10 20:00 UTCStable Updates PublishedElement 1.11.37 -> 1.11.38Sliding Sync proxy 0.99.5 newDo you want to receive updates up to 1 week before the stable release? Switch to the fresh stability branchService Updates: New componentAs Element X is becoming more usable, at etke.cc we’d like to help push the future of Matrix forward. For this reason, we’ve decided to add Sliding Sync support so that customers who wish to experiment with new technology can give it a try.For iOS, there’s a TestFlight (enroll here ). The iOS version is mostly usable and has basic functionality like sending messages, photos, videos, locations, and reactions, but it does not support threads or many other features. Nightly APK builds are available for the Android version, which is even less feature-rich.Element X is still under heavy development, so it is expected that there will be bugs and missing features. It shouldn’t cause data loss or break your conversations/rooms, as they appear in other clients. However, problems are still expected.Service Updates: New DomainThe new onmatrix.chat domain is available for order for new customers. Now you can get a matrix server with MXIDs like @john:doe.onmatrix.chat with no extra fee#discussion:etke.ccSource2023-08-03 19:38 UTCStable Updates PublishedElement 1.11.36 -> 1.11.37IRC bridge 1.14.3 -> 1.14.4#honoroit:etke.cc 0.9.17 -> 0.9.18Hookshot 4.4.0 -> 4.4.1 already installed on all serversSynapse 1.88.0 -> 1.89.0Do you want to receive updates up to 1 week before the stable release? Switch to the fresh stability branch#discussion:etke.ccSource2023-07-31 16:28 UTC (updated)Component Update Has Been Deployed (Security Fix)Hookshot 4.4.0 -> 4.4.1Bridges Security UpdateDetails#discussion:etke.ccSource«««56789101112»»»Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
