title = "etke.cc | Reminder bot"
description = "Information about the Reminder Bot bot for Matrix offered by etke.cc"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpBotsReminder BotReminder botThe Reminder Bot bot installed by us is powered by matrix-reminder-bot. full documentation source code supportWith Reminder Bot, you can schedule one-off or recurring reminders by sending messages in a Matrix room.The bot will keep track of the reminder and send a message back to you when the time comes.Example remindersExample one-off reminders:!remindme at 18:00; Pick up groceries!remindme tomorrow at 10:45; Head to that 11:00 meeting!remindme on 12th of September; Wish John a Happy BirthdayExample recurring reminders:!remindme every 1w; on Tuesday at 07:30; Take out the trash (the first reminder will be next Tuesday at 07:30; it will repeat every 1 week after that)!remindme every 5m; 1m; You are loved (the first reminder will be after 1 minute; it will repeat every 5 minutes after that)The full documentation for the bot shows more examples.UsageTo use the bot, start a chat with @reminder:your-server.com.You can also add the bot to any existing Matrix room by inviting it to the room.See Example Reminders above (or the full documentation ) for some example reminders you can schedule.Send !help reminders to the room to see the bot’s help menu for additional commands (listing reminders, canceling reminders, advanced usage, etc).If you need assistanceBefore seeking help, make sure to thoroughly review the documentation. If you still have questions, please don't hesitate to contact bot's support. Please note that etke.cc Customer Support exclusively handles server-related inquiries. For any questions related to the bot, please reach out to bot's support.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
