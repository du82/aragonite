full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpBridgesTwitterTwitter bridgeThe Twitter bridge installed by us is powered by mautrix-twitter. full documentation source code supportUsageStart a chat with @twitterbot:your-server.com. When it joins, type help in the chat to see instructionsSend login-cookie to the bridge botThe bot will send you these instructions to extract required cookies. Follow the steps to log into the bridgeLog into the Twitter in private/incognito browser windowPress F12 to open developer toolsSelect the Application (Chrome, Safari, Edge) or Storage (Firefox) tabIn the sidebar, expand Cookies and select https://twitter.comIn the cookie list, find the auth_token row and double click on the value then copy the value and send it to the chatIn the cookie list, find the ct0 row and double click on the value then copy the value and send it to the chatRecent chats should now get portals automatically. Other chats will get portals as you receive messages.If you need assistanceBefore seeking help, make sure to thoroughly review the documentation. If you still have questions, please don't hesitate to contact bridge's support. Please note that etke.cc Customer Support exclusively handles server-related inquiries. For any questions related to the bridge, please reach out to bridge's support.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
