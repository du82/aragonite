["https://etke.cc/help/payments"]
title = "etke.cc | Payments"
description = "Explore payment instructions and answers to payment-related questions, such as becoming an etke.cc customer, updating subscription details, cancelling your subscription or renewing a failed subscription."
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemePaymentsHow to Become a SubscriberHow to Update Your Subscription PriceHow to Cancel Your SubscriptionHow to Fix a Failing Subscriptionetke.cc uses the Ko-Fi payment and subscription management platform, which itself uses PayPal for payment processing. At the moment, we don’t support any other subscription or payment options.While Ko-Fi is a robust tool, some aspects of it might not be immediately intuitive. To ensure a seamless experience, we’ve prepared a set of step-by-step guides to assist you in various payment scenarios.How to Become a SubscriberTo access etke.cc’s services, you’ll need to set up a subscription with recurring payments on the Ko-Fi subscription platform.You will need a Ko-Fi account to manage your subscription later (to update its price , to fix it if payments are failing or to cancel it ). For this reason:it’s recommended that you sign up for Ko-Fi now (before making your subscription), so that the subscription will be associated with you automatically. When signing up for Ko-Fi, make sure to use the same email address that you had provided when placing your etke.cc order. If you use another email address, we won’t be able to automatically match it to your order, so you’d need to contact us about it.alternatively, you sign up for Ko-Fi at any time later on, after having created a subscription. However, it’s important that you sign up with the same email address that you used for your subscription (see below).To become an etke.cc subscriber:Sign into your Ko-Fi account , if you have one already. If not, you can also subscribe without a Ko-Fi account, as discussed above.Visit the etke.cc membership page on Ko-Fi .Select the By Complexity tier.Enter the following details:Pay what you want: Use the total price based on the components you’ve ordered.Email address: This field only appears when ordering without a Ko-Fi account. Use the same email address you had provided when placing your etke.cc order. If you use another email address, we won’t be able to automatically match it to your order, so you’d need to contact us about it.Your name or nickname: (optional) Use any name you wishPress the PayPal button to proceed to the PayPal checkout page.Select your preferred payment method or add a new one and click on Agree & Continue.If the payment is successful, you’ll be redirected to the payment confirmation page on Ko-Fi.Congratulations! You’re all set. 🎉We’ll receive a notification from Ko-Fi and will begin preparing your Matrix server. Keep an eye on your email for updates.If you had created a Ko-Fi account, you can also review your account’s Payments and Orders page on Ko-Fi. If you don’t have a Ko-Fi account yet, perhaps now is a good time to sign up for Ko-Fi - just make sure to sign up with the same email address that you used for your subscription, so that it will be associated with your new account.How to Update Your Subscription PriceIf you subsequently order new services from us or cancel some services we were providing until now, you may need to adjust the price of your subscription to align it with the new cost.You will need a Ko-Fi account to manage your etke.cc subscription on the Ko-Fi platform. If you haven’t created a Ko-Fi account early on, you can create one now by going to Ko-Fi’s signup page . When signing up, make sure to use the same email address that you used for your already-existing subscription - this way, Ko-Fi will automatically attribute this subscription to your new account.To update your subscripion’s price:Log in to your Ko-Fi accountVisit your Ko-Fi account pageLocate your etke.cc subscription in the list.Click on the three-dots dropdown menu and press the Update Pledge buttonEnter the new, recalculated price into the input field and click UpdateConfirm the changes by clicking Yes, update pledgeYou’ll be charged using the new subscription price during the next payment period (e.g. next month), not immediately. To make up for the difference during the current payment period, make a one-time Ko-Fi donation with a custom price equal to the price difference between the new price and the old price. For example, if going from $10/mo subscription to a $25/mo subscription, make a one-time payment of $15.Congratulations, you’ve successfully updated your subscription price! 🎉Your Ko-Fi account page should now reflect these changes:How to Cancel Your SubscriptionWARNING: by canceling your subscription, you will lose access to all services provided by etke.cc:(in case of hosting) your Matrix server will be erased, including all its data and backups, there won’t be an option to restore it laterno updates, security fixes, housekeeping, or support will be provided, etc.no monitoring , private docker registry , self-service bot , etc.even no exclusive admin panel features will be availableIf, for any reason, you don’t wish to continue with your subscription, you can cancel it.You will need a Ko-Fi account to manage your etke.cc subscription on the Ko-Fi platform. If you haven’t created a Ko-Fi account early on, you can create one now by going to Ko-Fi’s signup page . When signing up, make sure to use the same email address that you used for your already-existing subscription - this way, Ko-Fi will automatically attribute this subscription to your new account.To cancel your subscription:Log in to your Ko-Fi accountVisit your Ko-Fi account pageLocate your etke.cc subscription in the list.Click on the three-dots dropdown menu and press the Don’t Renew button.Confirm the changes by clicking Yes, cancel itYour canceled subscription will now appear on your Ko-Fi account page.Note: Depending on the automatic renewal status and the number of retry attempts, the canceled subscription may not be immediately visible or may appear differently.At this point, you are no longer an etke.cc subscriber. Nevertheless, we’ll continue providing the service you were paying for until the end period you paid for. If you wish for us to stop providing the service immediately, please contact us .How to Fix a Failing SubscriptionIf, for any reason, your subscription fails to renew automatically, you may need to resubscribe manually.To resubscribe:Cancel your existing subscription. See the How to Cancel Your Subscription guideSubscribe again. See the How to Become a Subscriber guideDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
