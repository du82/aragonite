["https://etke.cc/services/monitoring"]
title = "etke.cc | Monitoring"
description = "on that page, you can read about the Monitoring service we offer."
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeMonitoringWhat is monitored?PortsDNS recordsHTTP endpointsVPS metricsHow long is the monitoring data stored?How to access the monitoring data?How the report is looks like?All services are up and runningThere are issues with the serverHow do I get the monitoring report?On-demandAutomaticWhat to do if the monitoring report shows issues?DNS records failuresHigh CPU usageHigh RAM usageHigh Disk usageUnits failuresMetrics failures/.well-known/matrix/server failures/.well-known/matrix/client failures/.well-known/matrix/support failures/_matrix/federation/v1/version failures/_matrix/client/versions failuresAny other HTTP endpoints failuresPorts failuresAt etke.cc , we provide monitoring services for your Matrix server. This service is included with all server subscriptions we provide.What is monitored?We monitor the following aspects of your server:PortsWe monitor the availability of the expected ports on your server based on the services you have enabled. On a basic Matrix server without any add-ons, the following ports will be monitored:22/tcp - SSH port80/tcp, 443/tcp, 443/udp - HTTP, HTTPS port. UDP is necessary for HTTP/3 .8448/tcp and 8448/udp - Matrix federation port (if federation is enabled). UDP is necessary for HTTP/3 .3478/tcp+udp, 5349/tcp+udp - TURN ports (VoIP calls)49152-49573/udp - TURN ports (VoIP calls)But if you have additional components, e.g., Postmoogle email bridge , additional ports will be monitored: 25/tcp and 587/tcp (SMTP ports).A full list of the required ports per component can be found in the What ports should be open FAQ section.DNS recordsSimilar to ports, we monitor the existence and correctness of the DNS records needed for your server to function properly. For a basic Matrix server without any add-ons, the following DNS records will be monitored:@ base/apex domain record - should be present and point to your server’s IP address (only if you serve the base domain from the matrix server itself)matrix subdomain record, used for the Matrix server itself - should be present and point to your server’s IP addressBut if you have additional components, e.g., Linkding , additional DNS records will be monitored: the linkding subdomain record - as with previous records, it should be present and point to your server’s IP address (via CNAME or A record).HTTP endpointsWe monitor the availability of the HTTP endpoints of the services you have enabled. On a basic Matrix server without any add-ons, the following HTTP endpoints will be monitored:https://your-server.com/.well-known/matrix/server - Matrix server discovery endpoint (Matrix Federation API, if federation is enabled)https://your-server.com/.well-known/matrix/client - Matrix server discovery endpoint (Matrix Client-Server API)https://your-server.com/.well-known/matrix/support - Matrix server contacts endpoint (MSC1929 , part of Matrix protocol v1.10)https://matrix.your-server.com:8448/_matrix/federation/v1/version - Matrix Federation version endpoint (Matrix Federation API, if federation is enabled)https://matrix.your-server.com/_matrix/client/versions - Matrix client version endpoint (Matrix Client-Server API)https://element.your-server.com - Element web client (enabled by default on all servers)But if you have additional components, e.g., Funkwhale , additional HTTP endpoints will be monitored: https://funkwhale.your-server.com/api/v1/instance/nodeinfo/2.0 - Funkwhale NodeInfo endpoint.VPS metricsWe monitor the basic metrics of your Matrix server’s host:CPU - CPU usage; we recommend keeping it below 80% for optimal performanceRAM - RAM usage; we recommend keeping it below 80% for optimal performanceDisk - disk usage; we recommend keeping it below 80% for optimal performanceUnits - failed systemd units; we monitor the state of the Docker containers running on your server to ensure that all services are running as expectedIf any of the metrics exceed the recommended values, we will notify you about it.How long is the monitoring data stored?We store the monitoring data for the last 7 days on our side.How to access the monitoring data?At this moment, you can receive the monitoring report by opening Server Status page in the Synapse Admin , or using the ping command of the Scheduler, or by automatic monitoring alerts.How the report is looks like?All services are up and runningThe following report shows that all services are up and running, and there are no issues with the server.🟩 CPU utilization is ~7%🟩 Disk utilization is ~35%🟩 RAM utilization is ~77%🟩 etke.cc federation🟩 https://etke.cc/.well-known/matrix/server🟩 https://matrix.etke.cc/_matrix/client/versions🟩 https://matrix.etke.cc:8448/_matrix/federation/v1/version🟩 https://social.etke.ccThere are issues with the serverThe following report shows that there are issues with the server that require your attention, namely:High disk utilizationTimeout on the 25/tcp and 587/tcp portsInvalid content in the delegation endpoint (/.well-known/matrix/server)Invalid DNS records for the social.etke.cc subdomain🟩 CPU utilization is ~7%🟥 Disk utilization is ~85%: recommended is below 80% (help )🟩 RAM utilization is ~77%🟥 25 (tcp port): timeout (help )🟥 587 (tcp port): timeout (help )🟥 [etke.cc federation]: invalid character ‘<’ looking for beginning of value (help )🟩 https://matrix.etke.cc/_matrix/client/versions🟩 https://matrix.etke.cc:8448/_matrix/federation/v1/version🟥 social.etke.cc (DNS record): no or invalid A record; invalid CNAME record (expected: 1.2.3.4, actual: 4.3.2.1, 5.6.7.8) (help )How do I get the monitoring report?On-demandYou can receive the monitoring report either by opening Server Status page in Synapse Admin , or by using the ping command of the SchedulerAutomaticWe will notify you about any issues with your server through automatic monitoring alerts sent to your matrix account and email address daily. The report is generated between 3 a.m. and 5 a.m. UTC every day (fixed schedule).To avoid spamming you with the same alerts, an exponential backoff mechanism is used, meaning that if the same issue persists for more than one day, you will receive the alert less frequently.What to do if the monitoring report shows issues?There are different kinds of issues that can be shown in the monitoring report, and each of them requires different actions to be taken. Below are the most common issues and the suggested actions to resolve them.DNS records failuresIf the monitoring report contains DNS record failures, you should revisit your DNS configuration.All matrix-related subdomains should point to your server’s IP addressIf you serve the base/apex domain from the matrix server itself, it should point to your server’s IP address as wellIf you use any DNS proxy (like Cloudflare Proxy), it should be disabled for any of the matrix server’s recordsIf that didn’t help, please contact us to resolve the issue.High CPU usageIf the CPU usage of your server is constantly above 80%, you should consider upgrading your server to a more powerful one or removing additional components.The minimum recommended configuration for a basic Matrix sever without any add-ons is 2 vCPUs:If your server has less than 2 vCPUs, consider upgrading it as soon as possibleIf your server has 2 vCPUs, and you have any additional components enabled, consider removing them as soon as possibleIf your server has 2 vCPUs, and you don’t have any additional components enabled, one of the possible reasons for high CPU usage is that a user of your server joined a large room over federation (1000+ members). You could identify such rooms and remove them using Synapse AdminOn-premises servers: please resize your server to a more powerful one using your VPS provider dashboard.Hosting by etke.cc: please contact us to discuss the upgrade options.High RAM usageIf the RAM usage of your server is constantly above 80%, you should consider upgrading your server to a more powerful one or removing additional components.Minimum recommended configuration for a basic Matrix sever without any add-ons is 2 GB of RAM:If your server has less than 2 GB of RAM, consider upgrading it as soon as possibleIf your server has 2 GB of RAM and you have any additional components enabled, consider removing them as soon as possibleIf your server has 2 GB of RAM and you don’t have any additional components enabled, one of the possible reasons for high RAM usage is that a user of your server joined a large room over federation (1000+ members). You could identify such rooms and remove them using Synapse AdminOn-premises servers: please resize your server to a more powerful one using your VPS provider dashboard.Hosting by etke.cc: please contact us to discuss the upgrade options.High Disk usageIf the Disk usage of your server is constantly above 80%, you should consider upgrading your server or removing the old media using Synapse Admin .The minimal recommended configuration for a basic Matrix sever without any add-ons is 40 GB of disk space:If your server has less than 40 GB of disk space, consider upgrading it as soon as possibleIf your server has 40 GB of disk space, consider removing the old media using Synapse Admin as soon as possibleIf your server has 40 GB of disk space, and you don’t have any old media or don’t want to remove it, consider upgrading your server as soon as possibleOn-premises servers: please resize your server’s disk to a bigger one using your VPS provider dashboard.Hosting by etke.cc: please contact us to discuss the upgrade options.Units failuresIf you get Units failed in the monitoring report, that means something is wrong with specific components of your server. That failure could be the outcome of other issues, possible reasons:High CPU usageHigh RAM usageHigh Disk usageIf the report doesn’t contain any other issues, please contact us to resolve the issue, otherwise please address the other issues first (if any) and run the check again.Metrics failuresIf you get Metrics failed in the monitoring report, that means something is wrong with your VPS or DNS. That failure is the outcome of other other issues, possible reasons:Misconfigured DNS recordsHigh CPU usageHigh RAM usageHigh Disk usageMisconfigured firewallOn-premises servers: please ensure all mandatory ports are open and reachable from the internet, and the DNS records are configured properly, and CPU/RAM/Disk utilization is below recommended 80%. If that doesn’t help, please contact us to resolve the issue.Hosting by etke.cc: please ensure DNS records are configured properly. If that doesn’t help contact us to resolve the issue./.well-known/matrix/server failuresIf the /.well-known/matrix/server endpoint is not available (be it a 404 error, invalid content, or any other issue), you should ensure the delegation is configured properly.If your base/apex domain is served outside the Matrix server (e.g., when you have a website on that domain), please refer to the delegation redirects configuration FAQ section.If your base/apex domain is served by the Matrix server itself, please contact us to resolve the issue./.well-known/matrix/client failuresIf the /.well-known/matrix/client endpoint is not available (be it a 404 error, invalid content, or any other issue), you should ensure the delegation is configured properly.If your base/apex domain is served outside the Matrix server (e.g., when you have a website on that domain), please refer to the delegation redirects configuration FAQ section.If your base/apex domain is served by the Matrix server itself, please contact us to resolve the issue./.well-known/matrix/support failuresIf the /.well-known/matrix/support endpoint is not available (be it a 404 error, invalid content, or any other issue), you should ensure the delegation is configured properly.If your base/apex domain is served outside the Matrix server (e.g., when you have a website on that domain), please refer to the delegation redirects configuration FAQ section.If your base/apex domain is served by the Matrix server itself, please contact us to resolve the issue./_matrix/federation/v1/version failuresIf the /_matrix/federation/v1/version endpoint is not available (be it a 404 error, invalid content, or any other issue), something is wrong with your matrix server. Such failures are usually the outcome, not the cause of the issue, so you should check if there are any other issues (usually high CPU, RAM, or disk usage).If your server has the Matrix Federation API disabled, and you still get this error, please contact us to resolve the issue./_matrix/client/versions failuresIf the /_matrix/client/versions endpoint is not available (be it a 404 error, invalid content, or any other issue), something is wrong with your matrix server. Such failures are usually the outcome, not the cause of the issue, so you should check if there are any other issues (usually, high CPU, RAM, or disk usage).Any other HTTP endpoints failuresPlease, ensure:The DNS records are configured properly, pointing to the matrix server’s IP, and any DNS proxy (like Cloudflare Proxy) is disabled for any of the matrix server’s subdomains.The ports are open and reachable from the internet (on-premises servers only)CPU, RAM, and disk usage are below 80%If that’s not the case, please contact us to resolve the issue.Ports failuresPort failures mean a port that is expected to be open is unreachable for some reason. The most common reasons are:misconfigured firewall (on-premises servers)high CPU, RAM, or disk usageOn-premises servers: please ensure all mandatory ports are open and reachable from the internet. If that doesn’t help, please contact us to resolve the issue.Hosting by etke.cc: please contact us to resolve the issue.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
