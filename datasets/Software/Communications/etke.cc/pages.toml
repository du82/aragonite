["https://etke.cc/news/omkxovfj_q0e44ndsrngpcvl1l5waud61golqciqlwe"]
title = "etke.cc | 2024-02-08 20:58 UTC"
description = "New message published on 2024-02-08 20:58 UTC"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 Theme2024-02-08 20:58 UTCStable Updates Published#buscarron:etke.cc 1.3.1 -> 1.4.0#honoroit:etke.cc 0.9.19 -> 0.9.20Signal bridge updated pinned commitSynapse Admin 0.8.7 -> 0.9.1Vaultwarden 1.30.2 -> 1.30.3ReminderAll announcements published into the #news:etke.cc room are published on etke.cc/news page, RSS feed , and Fediverse account for your convenience. Moreover, we’ve added Attention needed! block with the most important things on the news pagePlease keep an eye on them, to avoid missing important information. We publish announcements only once a week (except security updates - announcements published ASAP), so you could safely enable “All messages” notification preset.Service Updates: Deprecating Abandoned ComponentsSome of the components we offered previously have been abandoned or deprecated by their developers, but we continue to maintain them on customers’ servers (if any of the abandoned components are installed).Unfortunately, such components misbehave and sometimes can’t even work with modern APIs, so we’ve proclaimed them deprecated many months ago and now defined a removal plan.Starting from 1st July 2024, the following components will be uninstalled from customers servers:Discord bridge (mx-puppet-discord) which has been unmaintained by its developers since May 2022. It got superseded by Discord bridge (mautrix-discord)Slack bridge (mx-puppet-slack) which has been unmaintained by its developers since May 2022. It got superseded by Slack bridge (mautrix-slack)Webhooks bridge (appservice-webhooks) which has been unmaintained by its developers since November 2022. It got superseded by Webhooks bridge (hookshot)Dimension integration manager which is unmaintained by its developers since November 2022. There is no free-software alternative integration managerWireguard (and dnsmasq) which has been superseded by FirezoneAlmost every component has maintained and updated successor, so you have time to migrate to the new components until the deprecated ones are removed.More details are available in the related FAQ entry: etke.cc/help/faq#what-about-deprecated-components#discussion:etke.ccSourceDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
