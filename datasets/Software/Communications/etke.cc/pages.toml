full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 Theme2023-10-26 19:48 UTCStable Updates PublishedCinny 2.2.6 -> 3.0.0Element / app.etke.cc 1.11.46 -> 1.11.47Grafana 10.1.5 -> 10.2.0Nginx 1.25.2 -> 1.25.3Synapse 1.94.0 -> 1.95.0This update fixes the recent Jitsi auth issues, but the fix may require reset of the existing internal jitsi accounts if you use internal jitsi auth.Service Updates: Embrace the Matrix Federation directly from Element WebStarting with this update, the Element Web app we offer on app.etke.cc and install on customers’ servers includes native integration with the #mrs:etke.cc project - a fully-featured Matrix rooms search engine working across federation - using the MatrixRooms.info demo instance. That means, you can find brilliant Matrix communities from other matrix servers without even leaving your client app.Note: #mrs:etke.cc implementation of Matrix Federation API is in testing phaseService Updates: MSC1929 enabled by default for new customersMatrix admin contacts MSC provides a way to contact server owners in case of issues. From now on, we enable MSC1929 integration by default for all new customers, leaving existing customers unaffected (you can request enabling MSC1929 for your server using etke.cc/contacts ):If base domain is served from your matrix server, then you only need to ask us to enable integration.If you’re serving base domain from any other server, you will need to set up one more redirect, for the new /.well-known/matrix/support file (https://your-server.com/.well-known/matrix/support -> https://matrix.your-server.com/.well-known/matrix/support). This redirect should be configured the same way you’ve already configured redirects for the client and server files.In any case, if you’d like to adjust your contact information (Matrix ID or email address) which will be published in the new /.well-known/matrix/support file, please let us know.Service Updates: Scheduler ’s ping MSC1929 integrationrun ping of etke.cc/scheduler got MSC1929 integration as well, so it will check if the support file is valid and not empty, but check’s status won’t be considered as failed because MSC1929 is completely optional.#discussion:etke.ccSourceDon't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
