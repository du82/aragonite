title = "etke.cc | News"
description = "copy of #news:etke.cc room messages"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeNewsThis page contains copy of #news:etke.cc room messages, but you may use RSS , or Fediverse to get them. Additionally, you may check News Archive for full list of messages.2024-05-02 20:54 UTCStable Updates PublishedHonoroit : v0.9.20 -> v0.9.21Jitsi : stable-9457-1 -> stable-9457-2Languagetool : 6.3 -> 6.4Miniflux : 2.1.2 -> 2.1.3Postmoogle : v0.9.17 -> v0.9.18Sliding Sync : v0.99.15 -> v0.99.16Synapse : v1.105.1 -> v1.106.0#discussion:etke.ccSource2024-04-25 20:03 UTCStable Updates PublishedElement : v1.11.64 -> v1.11.65Jitsi : stable-9364-1 -> stable-9457-1Prometheus Node Exporter : v1.7.0 -> v1.8.0Synapse : v1.105.0 -> v1.105.1Synapse Admin : 0.9.2 -> 0.10.1Uptime Kuma : 1.23.12 -> 1.23.13Service Updates: Monitoring UpdateThe monitoring report now includes an additional check - Metrics . This check will only be visible when the VPS Metrics cannot be read. Such a failure indicates a critical issue with the server, typically severe overload, to the extent that even metrics cannot be checked.Service Updates: RAM utilization adjustmentsDue to a significant number of cases with high RAM utilization, we’ve implemented adjustments to decrease the usage, the most considerable changes are: decreased the max allowed memory for database, and more aggressive swapping. Those changes lead to a decrease in RAM utilization from 10% to 30% of total RAM. Unfortunately, they come with the cost of slightly decreased performance of the Matrix stack. If you’d like to have “performance-first” configuration instead, please, contact usService Updates: Order Form UpdateWith the implementation of the new monitoring system , an increasing number of customers are becoming aware of overloads on their servers. In most cases, these are the Small-sized servers with additional components installed. Unfortunately, the notes regarding the underpowered nature of these servers on the order form were insufficient. Consequently, many servers were overloaded from the start, leading to confusion among their owners when they received alerts regarding high CPU/RAM utilization. We apologize for any confusion caused and are taking steps to prevent such situations in the future.Regrettably, for existing customers, the only recourse is to inform them of the situation, which the new monitoring service accomplishes effectively.However, for new customers, we are implementing changes. Henceforth, the order form will automatically disable any resource-intensive components for the Small server size, accompanied by a clear explanation of why and what happened. It’s important to note that these disabled components are unusable on Small server sizes anyway, and their inclusion often results in unresponsive servers rather quickly. Additionally, certain components (e.g., Synapse Workers) will be disabled for Medium-sized servers as well due to the same reason.#discussion:etke.ccSource2024-04-23 16:19 UTCServers Update In Progress (Security Fix)Synapse 1.105.0 -> 1.105.1Weakness in auth chain indexing allows DoS from remote room members through disk fill and high CPU usage.Details#discussion:etke.ccSource2024-04-18 20:20 UTCStable Updates Published#buscarron:etke.cc 1.4.0 -> 1.4.1Firezone 0.7.35 -> 0.7.36Google Messages bridge 0.3.0 -> 0.4.0Hookshot 5.2.1 -> 5.3.0Facebook & Instagram bridge 0.2.0 -> 0.3.0Signal bridge 0.5.1 -> 0.6.0Synapse 1.104.0 -> 1.105.0Synapse Admin 0.8.7 -> 0.9.2Uptime Kuma 1.23.11 -> 1.23.12WhatsApp bridge 0.10.6 -> 0.10.7Service Updates: Email DeliverabilityWe continue working on improving email deliverability from your matrix servers. With this update, a few bugs were fixed, including an incorrect sender address (it used base domain instead of subdomain). Starting from this update, all outgoing emails will be sent from server@matrix.your-server.com address by default. Sender address change does not affect servers with Email Service , SMTP Relay , or customized senderExisting customers may request DKIM integration just by contacting usService Updates: New Monitoring ServiceWe continue working on improving stability and awareness of homeserver owners, and starting from this week we’ve replaced the monitoring service with a new one. The new service provides more detailed and precise alerts, and based on the ping command of the Scheduler. Documentation: etke.cc/services/monitoringAs part of this update, the following changes were made:Added system metrics (CPU, RAM, Disk utilization)Added details about the problematic itemsStandardized alert time window (from 3am UTC to 4am UTC)All alerts are sent within a single email / matrix messageYou can run full monitoring check of your server at any moment by using the ping command of the Scheduler.The new monitoring service is in testing phase, if you have any issues, please contact usService Updates: etke.cc SSH Keys Have Been RotatedNew keys have been published on the website (https://etke.cc/keys.txt ) and rotated on customers’ servers. This is automatic process, you don’t need to do anything#discussion:etke.ccSource2024-04-11 20:05 UTCStable Updates PublishedContainer Socket Proxy 0.1.1 -> 0.1.2Element 1.11.63 -> 1.11.64Exim 4.97-r0-0 -> 4.97.1-r0-0GoToSocial 0.14.0 -> 0.15.0Peertube 6.0.3 -> 6.0.4Sygnal 0.14.0 -> 0.14.1Service Updates: Email DeliverabilityWe continue working on improving email deliverability from your matrix servers. With this update, any new order will have DKIM configured by default, and so new matrix servers will send signed emails by default.Existing customers may request DKIM integration just by contacting us#discussion:etke.ccSource2024-04-04 20:01 UTCStable Updates PublishedBorg 1.2.7 -> 1.2.8Borgmatic 1.8.6 -> 1.8.9Funkwhale 1.4.0 newMiniflux 2.1.1 -> 2.1.2Peertube 6.0.3 newSynapse 1.103.0 -> 1.104.0Service Updates: Email DeliverabilityWe continue working on improving email deliverability from your matrix servers. With this update, the outgoing email queue was made persistent, so emails won’t be lost due to restarts or temporary downtimes.Service Updates: Extras UpdatesWe’ve restructured the extras page, added missing quick start guides, and divided all items into sensible sectionsService Updates: List of Deprecated Components was updatedThe list was extended with Facebook (mautrix-facebook) and Instagram (mautrix-instagram) bridges, as they were archived by their devs on March 2024, and superseded by Facebook (mautrix-meta) and Instagram (mautrix-meta) bridges.Quick start guides of the deprecated bridges contain migration guides for your convenienceService Updates: New Component - FunkwhaleA new component is available for order - Funkwhale is a self-hosted audio player and publication platform. It enables users to build libraries of existing content and publish their own. It uses the ActivityPub protocol to talk to other apps across the Fediverse. Users can share content between Funkwhale pods or with other Fediverse software.Funkwhale is available for new and existing customers for +$5/monthService Updates: New Component - PeertubeA new component is available for order - Peertube is a self-hosted video platform over Fediverse, similar to Funkwhale. And as with Funkwhale it allows building libraries of existing content from Fediverse and publish your own.Additionally, Peertube supports S3-compatible storage, so you don’t need to worry about the disk space utilizationPeertube is available for new and existing customers for +$5/month#discussion:etke.ccSource2024-03-28 21:03 UTCStable Updates PublishedElement / app.etke.cc 1.11.61 -> 1.11.63Grafana 10.4.0 -> 10.4.1Jitsi 9364 -> 9364-1KeyDB 6.3.4 newNtfy 2.9.0 -> 2.10.0Radicale 3.1.9.0 -> 3.1.9.1Redis 7.2.3 -> 7.2.4Service Updates: LanguageTool is backPreviously, we’ve offered LanguageTool , but it was taken down for refactoring. It returns for the price of +$1/month, with optional extended list of supported n-grams and a quick start guide .Service Updates: Redis has been replaced with KeyDB due to upcoming license changesStarting from v7.4.x, Redis is no longer Open Source, and switch to source-available model, it was announced in their blog . As a result, we’ve decided to replace Redis with KeyDB - an Open Source drop-in replacement with additional features (like multi-threading). That change affects all customers with Synapse Workers, but you don’t need to do anything - it will be fully automatic. The only possible impact is longer downtime during the maintenance (only once, to apply the migration)#discussion:etke.ccSource2024-03-21 21:02 UTCStable Updates PublishedElement / app.etke.cc 1.11.60 -> 1.11.61Etherpad 1.9.6 -> 2.0.1Google Messages bridge 0.2.4 -> 0.3.0Jitsi 9258 -> 9364Facebook & Instagram bridge 0.1.0 -> 0.2.0Prometheus 2.50.1 -> 2.51.0Radicale 3.1.8.3 -> 3.1.9.0Signal bridge 0.5.0 -> 0.5.1Sygnal 0.13.0 -> 0.14.0Synapse 1.102.0 -> 1.103.0WhatsApp bridge 0.10.5 -> 0.10.6during this week, there were issues with system packages updates. We apologize for the inconvenience, but can assure you that the issue did not affect Matrix servers, just blocked the update of the system packages for a short time. We’ve fixed all affected hosts already, and adjusted automation to properly handle such situations. However, if you will notice a failed maintenance, please, try to run it again to apply the fixService Updates: About UsWe’ve added the About Us page that contains information about the founders and some stats. It hasn’t even been four years 😄#discussion:etke.ccSource2024-03-14 20:41 UTCStable Updates PublishedElement / app.etke.cc 1.11.59 -> 1.11.60Miniflux 2.1.0 -> 2.1.1Ntfy 2.8.0 -> 2.9.0Service Updates: Support UpdatesPreviously, we’ve announced the Customer Support service and described the limits for each support level. Now we continue to enhance it, and will tell the current request’s number (counted for the last 30 days) in the greetings message when you contact us via Matrix#discussion:etke.ccSource2024-03-07 21:24 UTCStable Updates PublishedGoToSocial 0.13.3 -> 0.14.0Grafana 10.3.1 -> 10.4.0Synapse 1.101.0 -> 1.102.0Vaultwarden 1.30.3 -> 1.30.5Service Updates: Registry UpdatesTo prevent abuse of our private Docker registry, we’ve made internal changes to how access is controlled/secured. The new flow has been enabled for all customers. If you encounter any issues with the new flow, please, do not hesitate to contact usAs with anything we do, the changes are open source under AGPL-3.0#discussion:etke.ccSource«««12345678»»»Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
