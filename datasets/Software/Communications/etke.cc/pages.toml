["https://etke.cc/help/extras/gotosocial"]
title = "etke.cc | GoToSocial service"
description = "GoToSocial is an ActivityPub social network server, written in Golang. With GoToSocial, you can keep in touch with your friends, post, read, and share images and articles. All without being tracked or advertised to!"
full_description = '''etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpExtra ServicesGoToSocialGoToSocial serviceUsageOptional S3 storageChoosing an Object Storage providerBucket creation and Security ConfigurationAmazon S3Backblaze B2Other providers official website full documentation source code supportGoToSocial is an ActivityPub social network server, written in Golang. With GoToSocial, you can keep in touch with your friends, post, read, and share images and articles. All without being tracked or advertised to! GoToSocial provides a lightweight, customizable, and safety-focused entryway into the Fediverse , and is comparable to (but distinct from) existing projects such as Mastodon , Pleroma , Friendica , and PixelFed .If you’ve ever used something like Twitter or Tumblr (or even Myspace!) GoToSocial will probably feel familiar to you: You can follow people and have followers, you make posts which people can favourite and reply to and share, and you scroll through posts from people you follow using a timeline. You can write long posts or short posts, or just post images, it’s up to you. You can also, of course, block people or otherwise limit interactions that you don’t want by posting just to your friends.Key features of GoToSocial include:Mastodon API compatibility: GoToSocial implements and extends the Mastodon API, ensuring compatibility with popular Mastodon client apps like Tusky, Semaphore, and Feditext.Granular post settings: Users can choose who sees their posts with options including public, unlisted, friends-only, mutuals-only, and direct posts. Additionally, users can customize interactions on their posts such as reblogging, liking, and replying.Customizability for admins: Admins have access to plenty of configuration options, including adjustable post length and media upload size settings.Easy to run: With no external dependencies apart from a database, GoToSocial is easy to deploy and run. It’s designed to work well even on lower-powered machines like small VPSes.Safety + security features: GoToSocial prioritizes security with built-in support for secure HTTPS using Let’s Encrypt, strict privacy enforcement, and HTTP signature authentication.Various federation modes: Users can choose from different federation modes, including ‘blocklist’ mode (default), ‘allowlist’ mode (experimental), and ‘zero’ federation mode (not yet implemented).Backend-first design: Unlike other federated server projects, GoToSocial doesn’t include an integrated client front-end. Instead, it provides a backend server implementation with a well-documented API, allowing developers to build their own front-end implementations or mobile applications.UsageWe host your GoToSocial instance at a URL like: https://social.your-server.com - just replace your-server.com with your actual server domain, and open the URL in your browser. Welcome to your GoToSocial instance!Optional S3 storageGoToSocial supports S3-compatible providers, which allows it to store videos, photos, etc. in an object storage system like Amazon S3 or any other S3-compatible alternative (Wasabi , Backblaze B2 , Cloudflare R2 , etc).Moving media files off of the server’s local filesystem and into an external storage (the S3 storage system) allows you to free up disk space on the server and effectively gives you infinite storage (for a relatively-cheap price).To make your GoToSocial server use an S3 storage provider, you first need to choose an Object Storage provider , then create the S3 bucket and finally send the details to us.For new orders, you can provide the S3 Storage details right in our order form .Choosing an Object Storage providerYou can create Amazon S3 or another S3-compatible object store like Backblaze B2 , Wasabi , Digital Ocean Spaces , etc.Amazon S3 and Backblaze S3 are pay-as-you with no minimum charges for storing too little data.All these providers have different prices, with Backblaze B2 appearing to be the cheapest.Wasabi has a minimum charge of 1TB if you’re storing less than 1TB, which becomes expensive if you need to store less data than that.Digital Ocean Spaces has a minimum charge of 250GB ($5/month as of 2022-10), which is also expensive if you’re storing less data than that.Important aspects of choosing the right provider are:a provider by a company you like and trust (or dislike less than the others)a provider which has a data region close to your Matrix server (if it’s farther away, high latency may cause slowdowns)a provider which is OK pricewisea provider with free or cheap egress (if you need to get the data out often, for some reason) - likely not too important for the common use-caseBucket creation and Security ConfigurationNow that you’ve chosen an Object Storage provider , you need to create a storage bucket.How you do this varies from provider to provider, with Amazon S3 being the most complicated due to its vast number of services and complicated security policies.Below, we provider some guides for common providers. If you don’t see yours, look at the others for inspiration or read some guides online about how to create a bucket. Feel free to contribute to this documentation with an update!Amazon S3You’ll need an Amazon S3 bucket and some IAM user credentials (access key + secret key) with full write access to the bucket. Example IAM security policy:{ "Version": "2012-10-17", "Statement": [ { "Sid": "Stmt1400105486000", "Effect": "Allow", "Action": [ "s3:*" ], "Resource": [ "arn:aws:s3:::your-bucket-name", "arn:aws:s3:::your-bucket-name/*" ] } ] } NOTE: This policy needs to be attached to an IAM user created from the Security Credentials menu. This is not a Bucket Policy.Backblaze B2To use Backblaze B2 you first need to sign up.You can’t easily change which region (US, Europe) your Backblaze account stores files in , so make sure to carefully choose the region when signing up (hint: it’s a hard to see dropdown below the username/password fields in the signup form).After logging in to Backblaze:create a new private bucket through its user interface (you can call it something like peertube-DOMAIN-media-store)note the Endpoint for your bucket (something like https://s3.us-west-002.backblazeb2.com).adjust its Lifecycle Rules to: Keep only the last version of the filego to App Keys and use the Add a New Application Key to create a new onerestrict it to the previously created bucket (e.g. peertube-DOMAIN-media-store)give it Read & Write accessThe keyID value is your Access Key and applicationKey is your Secret Key.Other providersFor other S3-compatible providers, you may not need to configure security policies, etc. (just like for Backblaze B2 ).You most likely just need to create an S3 bucket and get some credentials (access key and secret key) for accessing the bucket in a read/write manner.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now'''
