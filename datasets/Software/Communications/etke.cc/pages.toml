description = "copy of #news:etke.cc room messages"
full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeNewsThis page contains copy of #news:etke.cc room messages, but you may use RSS , or Fediverse to get them. Additionally, you may check News Archive for full list of messages.2023-05-18 21:14 UTCStable Updates PublishedBorgmatic 1.7.12 -> 1.7.13Discord bridge 0.3.0 -> 0.4.0Prometheus 2.43.0 -> 2.44.0Signal bridge 0.4.2 -> 0.4.3WhatsApp bridge 0.8.4 -> 0.8.5Do you want to receive updates up to 1 week before the stable release? Switch to the fresh stability branch#discussion:etke.ccSource2023-05-11 20:24 UTCStable Updates PublishedElement / app.etke.cc 1.11.30 -> 1.11.31Grafana 9.5.1 -> 9.5.2Miniflux 2.0.43 -> 2.0.44Synapse 1.82.0 -> 1.83.0Uptime Kuma 1.21.2 -> 1.21.3Do you want to receive updates up to 1 week before the stable release? Switch to the fresh stability branchService UpdatesWe’ve developed new Radicale (contacts, calendars server) matrix auth module, enabled by default for new installations. If you already use Radicale and want to switch from manual user management to automatic matrix-based, contact us#discussion:etke.ccSource2023-05-04 20:08 UTCStable Updates PublishedHookshot 3.2.0 -> 4.0.0Jitsi stable-8319 -> stable-8615Signal (daemon) 0.23.1 -> 0.23.2#discussion:etke.ccSource2023-04-27 20:04 UTCStable Updates PublishedElement / app.etke.cc 1.11.29 -> 1.11.30Grafana 9.4.7 -> 9.5.1Ntfy 2.3.1 -> 2.4.0Synapse 1.81.0 -> 1.82.0Do you want to receive updates up to 1 week before the stable release? Switch to the fresh stability branchService Updates: MatrixRooms.infoLack of rooms discovery for new users is one of the issues we noticed, so today, we welcome you to MatrixRooms.info , a search engine built for matrix rooms discovery.The current index contains over 230,000 rooms across 19,000 servers, and we’re constantly tweaking it to provide more relevant search results. Even non-English users may find it useful because it does automatic language detection in room names and topics (during the alpha stage language analysis limited to English, Hindi, Spanish, French, Russian, Portuguese, German)We plan the following future improvements:Searching by languageSearching by specific fieldProviding a browsable catalog of rooms by server/language/etcImplementing a subset of the Matrix Server-Server API to request (and provide!) a Matrix-native rooms directoryMatrixRooms.info , Source code , #mrs:etke.ccAs with anything else we do at etke.cc , the website, its API backend and all related tools are free software (A/GPL).#discussion:etke.ccSource2023-04-20 20:05 UTCStable Updates PublishedBorgmatic 1.7.11 -> 1.7.12Discord bridge 0.2.0 -> 0.3.0WhatsApp bridge 0.8.3 -> 0.8.4Do you want to receive updates up to 1 week before the stable release? Switch to the fresh stability branchService Updatescustomers on fresh stability branch migrated from nginx reverse proxy to traefik#discussion:etke.ccSource2023-04-13 20:08 UTCStable Updates PublishedElement / app.etke.cc 1.11.28 -> 1.11.29Synapse 1.80.0 -> 1.81.0Note to BorgBackup users: the Borgmatic v1.7.11 contains a regression issue , but it doesn’t affect ability to actually backup your server, so there won’t be version downgradeDo you want to receive updates up to 1 week before the stable release? Switch to the fresh stability branchService Updatesetke.cc ’s ssh keys have been rotated, new keys (available at etke.cc/ssh.key ) were installed on customers’ servers. That’s an automatic process, you don’t need to do anythingThe Scheduler will automatically check your server’s HTTP endpoints in case of run ping (all known endpoints) and run maintenance (only failed ones) commands from now on. You can try it yourself or see the example on the docs page#discussion:etke.ccSource2023-04-06 19:59 UTCStable Updates PublishedBorgmatic 1.7.10 -> 1.7.11Coturn 4.6.1-r2 -> 4.6.1-r3Element / app.etke.cc 1.11.26 -> 1.11.28Hookshot 3.1.1 -> 3.2.0Languagetool 6.0 -> 6.1Ntfy 2.3.0 -> 2.3.1Uptime Kuma 1.21.1 -> 1.21.2Do you want to receive updates up to 1 week before the stable release? Switch to the fresh stability branchService UpdatesEncrypted Bridges option has been added to the order form for new customers. Existing customers can request it by contacting support . Please, note that it’s unstable and may fail at any time without an easy way to fix it.A new service is now being offered: Custom Development . If you have a feature you want to implement within one of our open-source projects, but for some reason there are no MRs from the open-source community, and we don’t need it for our own services, you can pay us to get it done. Just to be on the same page: when we develop a project for our own needs, we implement specific features useful for our operations, but we don’t have spare resources to invest into features outside that scope. Of course, we totally understand that others use cases may be different from ours and that somebody will need a bit different set of features. We want to be fair, so we added that custom development service. If somebody finds it useful - that will be wonderful!#discussion:etke.ccSource2023-04-04 11:18 UTCThe outage has been resolvedWhat: etke.host domainImpact: customers using etke.host as their matrix server’s domain, etke.cc email communicationsDomain registry operator unsuspended the etke.host domain, all services using that domain name have been resolvedSource2023-04-03 07:49 UTCOutage is in progress (update)What: etke.host domainImpact: customers using etke.host as their matrix server’s domain, etke.cc email communicationsETA: unknownWe got a response from the domain registry operator - they won’t do anything, until Google Safe Browsing issue is resolved. Meanwhile, we’re updating the website with notes about that outage, and contacting affected customers to give them a clear understanding of the current status.Source2023-04-03 07:49 UTC (updated)Outage is in progress (update)What: etke.host domainImpact: customers using etke.host as their matrix server’s domain, etke.cc email communicationsETA: unknownThe etke.host domain name was put on hold by the domain registry operator due to a domain name listing in Google Safe Browsing.We already sent requests to unlist the domain name from Google Safe Browsing and unsuspend it from the domain registry operator side because the reasons listed on the Google Safe Browsing side are false accusations and that domain name was never used for such actions from the moment it was registered by us.Unfortunately, such requests may take a while before they will be fulfilled.Source«««7891011121314»»»Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
