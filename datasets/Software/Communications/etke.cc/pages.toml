full_description = "etke.cc🌓 ThemePricingServicesAboutNewsHelp etke.ccPricingServicesAboutNewsHelp🌓 ThemeHelpBridgesEmailEmail bridge made by etke.ccThe Email bridge installed by us is powered by postmoogle. full documentation source code supportWith Postmoogle, you can:receive emails to custom addresses (like something@matrix.example.com) and have these emails delivered to Matrix roomssend outgoing emailsand many more thingsUsageCreate a room and invite @emailbot:your-server.com (or @postmoogle:your-server.com if your server was installed before October 2023). When it joins, type !pm help in the chat to see instructionsSend !pm mailbox yourmailbox to the bridge botNow you can receive emails to yourmailbox@matrix.your-server.com and send emails using the !pm send commandSend !pm dkim to the bridge bot and copy the signature from the bot responseAdd new DNS record with type = TXT, key (subdomain/from): postmoogle._domainkey.matrix and value: signature copied from the !pm dkim responseAfter that we recommend to verify email deliverability using online services like mail-tester.com , dkimvalidator.com . Note that even if your configuration is perfect, you still will have deliverability issues due to high centralization around big email services (e.g., Gmail, Outlook, Yahoo, etc.)If you need assistanceBefore seeking help, make sure to thoroughly review the documentation. If you still have questions, please don't hesitate to contact bridge's support. Please note that etke.cc Customer Support exclusively handles server-related inquiries. For any questions related to the bridge, please reach out to bridge's support.Don't have a Matrix server yet?We specialize in setup, hosting and maintenance of Matrix and various Matrix & non-Matrix add-ons.Hosting is on affordable VPS servers provided by us (via Hetzner Cloud) in the EU or US, or on your own infrastructure anywhere in the world.Let's build your Matrix haven together!Order Now"
