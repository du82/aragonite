title = "Appendices | Matrix Specification"
description = """
Unpadded Base64 Unpadded Base64 refers to ‘standard’ Base64 encoding as defined in RFC 4648, without “=” padding. Specifically, where RFC 4648 requires that encoded data be padded to a multiple of four characters using = characters, unpadded Base64 omits this padding.
For reference, RFC 4648 uses the following alphabet for Base 64:
Value Encoding Value Encoding Value Encoding Value Encoding 0 A 17 R 34 i 51 z 1 B 18 S 35 j 52 0 2 C 19 T 36 k 53 1 3 D 20 U 37 l 54 2 4 E 21 V 38 m 55 3 5 F 22 W 39 n 56 4 6 G 23 X 40 o 57 5 7 H 24 Y 41 p 58 6 8 I 25 Z 42 q 59 7 9 J 26 a 43 r 60 8 10 K 27 b 44 s 61 9 11 L 28 c 45 t 62 + 12 M 29 d 46 u 63 / 13 N 30 e 47 v 14 O 31 f 48 w 15 P 32 g 49 x 16 Q 33 h 50 y Examples of strings encoded using unpadded Base64:"""
full_description = '''You're looking at an unstable version of this specification. Unstable specifications may change at any time without notice. Switch to the current stable release. Matrix Specification Appendices Appendices Unpadded Base64 Unpadded Base64 refers to ‘standard’ Base64 encoding as defined in RFC 4648, without “=” padding. Specifically, where RFC 4648 requires that encoded data be padded to a multiple of four characters using = characters, unpadded Base64 omits this padding. For reference, RFC 4648 uses the following alphabet for Base 64: Value Encoding Value Encoding Value Encoding Value Encoding 0 A 17 R 34 i 51 z 1 B 18 S 35 j 52 0 2 C 19 T 36 k 53 1 3 D 20 U 37 l 54 2 4 E 21 V 38 m 55 3 5 F 22 W 39 n 56 4 6 G 23 X 40 o 57 5 7 H 24 Y 41 p 58 6 8 I 25 Z 42 q 59 7 9 J 26 a 43 r 60 8 10 K 27 b 44 s 61 9 11 L 28 c 45 t 62 + 12 M 29 d 46 u 63 / 13 N 30 e 47 v 14 O 31 f 48 w 15 P 32 g 49 x 16 Q 33 h 50 y Examples of strings encoded using unpadded Base64: UNPADDED_BASE64("") = "" UNPADDED_BASE64("f") = "Zg" UNPADDED_BASE64("fo") = "Zm8" UNPADDED_BASE64("foo") = "Zm9v" UNPADDED_BASE64("foob") = "Zm9vYg" UNPADDED_BASE64("fooba") = "Zm9vYmE" UNPADDED_BASE64("foobar") = "Zm9vYmFy" When decoding Base64, implementations SHOULD accept input with or without padding characters wherever possible, to ensure maximum interoperability. Binary data In some cases it is necessary to encapsulate binary data, for example, public keys or signatures. Given that JSON cannot safely represent raw binary data, all binary values should be encoded and represented in JSON as unpadded Base64 strings as described above. In cases where the Matrix specification refers to either opaque byte or opaque Base64 values, the value is considered to be opaque AFTER Base64 decoding, rather than the encoded representation itself. It is safe for a client or homeserver implementation to check for correctness of a Base64-encoded value at any point, and to altogether reject a value which is not encoded properly. However, this is optional and is considered to be an implementation detail. Special consideration is given for future protocol transformations, such as those which do not use JSON, where Base64 encoding may not be necessary in order to represent a binary value safely. In these cases, Base64 encoding of binary values may be skipped altogether. Signing JSON Various points in the Matrix specification require JSON objects to be cryptographically signed. This requires us to encode the JSON as a binary string. Unfortunately the same JSON can be encoded in different ways by changing how much white space is used or by changing the order of keys within objects. Signing an object therefore requires it to be encoded as a sequence of bytes using Canonical JSON, computing the signature for that sequence and then adding the signature to the original JSON object. Canonical JSON To ensure that all implementations use the same JSON encoding we define “Canonical JSON”. This should not be confused with other uses of “Canonical JSON” outside of the specification. We define this encoding for a value to be the shortest UTF-8 JSON encoding with dictionary keys lexicographically sorted by Unicode codepoint. Numbers in the JSON must be integers in the range [-(2**53)+1, (2**53)-1], represented without exponents or decimal places, and negative zero -0 MUST NOT appear. We pick UTF-8 as the encoding as it should be available to all platforms and JSON received from the network is likely to be already encoded using UTF-8. We sort the keys to give a consistent ordering. We force integers to be in the range where they can be accurately represented using IEEE double precision floating point numbers since a number of JSON libraries represent all numbers using this representation. Events in room versions 1, 2, 3, 4, and 5 might not be fully compliant with these restrictions. Servers SHOULD be capable of handling JSON which is considered invalid by these restrictions where possible. The most notable consideration is that integers might not be in the range specified above. Float values are not permitted by this encoding. import json def canonical_json(value): return json.dumps( value, # Encode code-points outside of ASCII as UTF-8 rather than \u escapes ensure_ascii=False, # Remove unnecessary white space. separators=(',',':'), # Sort the keys of dictionaries. sort_keys=True, # Encode the resulting Unicode as UTF-8 bytes. ).encode("UTF-8") Grammar Adapted from the grammar in http://tools.ietf.org/html/rfc7159 removing insignificant whitespace, fractions, exponents and redundant character escapes. value = false / null / true / object / array / number / string false = %x66.61.6C.73.65 null = %x6E.75.6C.6C true = %x74.72.75.65 object = %x7B [ member *( %x2C member ) ] %x7D member = string %x3A value array = %x5B [ value *( %x2C value ) ] %x5D number = [ %x2D ] int int = %x30 / ( %x31-39 *digit ) digit = %x30-39 string = %x22 *char %x22 char = unescaped / %x5C escaped unescaped = %x20-21 / %x23-5B / %x5D-10FFFF escaped = %x22 ; " quotation mark U+0022 / %x5C ; \ reverse solidus U+005C / %x62 ; b backspace U+0008 / %x66 ; f form feed U+000C / %x6E ; n line feed U+000A / %x72 ; r carriage return U+000D / %x74 ; t tab U+0009 / %x75.30.30.30 (%x30-37 / %x62 / %x65-66) ; u000X / %x75.30.30.31 (%x30-39 / %x61-66) ; u001X Examples To assist in the development of compatible implementations, the following test values may be useful for verifying the canonical transformation code. Given the following JSON object: {} The following canonical JSON should be produced: {} Given the following JSON object: { "one": 1, "two": "Two" } The following canonical JSON should be produced: {"one":1,"two":"Two"} Given the following JSON object: { "b": "2", "a": "1" } The following canonical JSON should be produced: {"a":"1","b":"2"} Given the following JSON object: {"b":"2","a":"1"} The following canonical JSON should be produced: {"a":"1","b":"2"} Given the following JSON object: { "auth": { "success": true, "mxid": "@john.doe:example.com", "profile": { "display_name": "John Doe", "three_pids": [ { "medium": "email", "address": "[email protected]" }, { "medium": "msisdn", "address": "123456789" } ] } } } The following canonical JSON should be produced: {"auth":{"mxid":"@john.doe:example.com","profile":{"display_name":"John Doe","three_pids":[{"address":"[email protected]","medium":"email"},{"address":"123456789","medium":"msisdn"}]},"success":true}} Given the following JSON object: { "a": "日本語" } The following canonical JSON should be produced: {"a":"日本語"} Given the following JSON object: { "本": 2, "日": 1 } The following canonical JSON should be produced: {"日":1,"本":2} Given the following JSON object: { "a": "\u65E5" } The following canonical JSON should be produced: {"a":"日"} Given the following JSON object: { "a": null } The following canonical JSON should be produced: {"a":null} Given the following JSON object: { "a": -0, "b": 1e10 } The following canonical JSON should be produced: {"a":0,"b":10000000000} Signing Details JSON is signed by encoding the JSON object without signatures or keys grouped as unsigned, using the canonical encoding described above. The JSON bytes are then signed using the signature algorithm and the signature is encoded using unpadded Base64. The resulting base64 signature is added to an object under the signing key identifier which is added to the signatures object under the name of the entity signing it which is added back to the original JSON object along with the unsigned object. The signing key identifier is the concatenation of the signing algorithm and a key identifier. The signing algorithm identifies the algorithm used to sign the JSON. The currently supported value for signing algorithm is ed25519 as implemented by NACL (http://nacl.cr.yp.to/). The key identifier is used to distinguish between different signing keys used by the same entity. The unsigned object and the signatures object are not covered by the signature. Therefore intermediate entities can add unsigned data such as timestamps and additional signatures. { "name": "example.org", "signing_keys": { "ed25519:1": "XSl0kuyvrXNj6A+7/tkrB9sxSbRi08Of5uRhxOqZtEQ" }, "unsigned": { "age_ts": 922834800000 }, "signatures": { "example.org": { "ed25519:1": "s76RUgajp8w172am0zQb/iPTHsRnb4SkrzGoeCOSFfcBY2V/1c8QfrmdXHpvnc2jK5BD1WiJIxiMW95fMjK7Bw" } } } def sign_json(json_object, signing_key, signing_name): signatures = json_object.pop("signatures", {}) unsigned = json_object.pop("unsigned", None) signed = signing_key.sign(encode_canonical_json(json_object)) signature_base64 = encode_base64(signed.signature) key_id = "%s:%s" % (signing_key.alg, signing_key.version) signatures.setdefault(signing_name, {})[key_id] = signature_base64 json_object["signatures"] = signatures if unsigned is not None: json_object["unsigned"] = unsigned return json_object Checking for a Signature To check if an entity has signed a JSON object an implementation does the following: Checks if the signatures member of the object contains an entry with the name of the entity. If the entry is missing then the check fails. Removes any signing key identifiers from the entry with algorithms it doesn’t understand. If there are no signing key identifiers left then the check fails. Looks up verification keys for the remaining signing key identifiers either from a local cache or by consulting a trusted key server. If it cannot find a verification key then the check fails. Decodes the base64 encoded signature bytes. If base64 decoding fails then the check fails. Removes the signatures and unsigned members of the object. Encodes the remainder of the JSON object using the Canonical JSON encoding. Checks the signature bytes against the encoded object using the verification key. If this fails then the check fails. Otherwise the check succeeds. Identifier Grammar Some identifiers are specific to given room versions, please refer to the room versions specification for more information. Common Namespaced Identifier Grammar [Added in v1.2] The specification defines some identifiers to use the Common Namespaced Identifier Grammar. This is a common grammar intended for non-user-visible identifiers, with a defined mechanism for implementations to create new identifiers. The grammar is defined as follows: An identifier must be at least one character and at most 255 characters in length. Identifiers must start with one of the characters [a-z], and be entirely composed of the characters [a-z], [0-9], -, _ and .. Identifiers starting with the characters m. are reserved for use by the official Matrix specification. Identifiers which are not described in the specification should follow the Java Package Naming Convention to namespace their identifier. This is typically a reverse DNS format, such as com.example.identifier. Identifiers can and do inherit grammar from this specification. For example, “this identifier uses the Common Namespaced Identifier Grammar, though without the namespacing requirements” - this means that m. is still reserved, but that implementations do not have to use the reverse DNS scheme to namespace their custom identifier. ASCII characters do not have issues with homoglyphs or alternative encodings which might interfere with the identifier’s purpose. Additionally, using lowercase characters prevents concerns about case sensitivity. Server Name A homeserver is uniquely identified by its server name. This value is used in a number of identifiers, as described below. The server name represents the address at which the homeserver in question can be reached by other homeservers. All valid server names are included by the following grammar: server_name = hostname [ ":" port ] port = 1*5DIGIT hostname = IPv4address / "[" IPv6address "]" / dns-name IPv4address = 1*3DIGIT "." 1*3DIGIT "." 1*3DIGIT "." 1*3DIGIT IPv6address = 2*45IPv6char IPv6char = DIGIT / %x41-46 / %x61-66 / ":" / "." ; 0-9, A-F, a-f, :, . dns-name = 1*255dns-char dns-char = DIGIT / ALPHA / "-" / "." — in other words, the server name is the hostname, followed by an optional numeric port specifier. The hostname may be a dotted-quad IPv4 address literal, an IPv6 address literal surrounded with square brackets, or a DNS name. IPv4 literals must be a sequence of four decimal numbers in the range 0 to 255, separated by .. IPv6 literals must be as specified by RFC3513, section 2.2. DNS names for use with Matrix should follow the conventional restrictions for internet hostnames: they should consist of a series of labels separated by ., where each label consists of the alphanumeric characters or hyphens. Examples of valid server names are: matrix.org matrix.org:8888 1.2.3.4 (IPv4 literal) 1.2.3.4:1234 (IPv4 literal with explicit port) [1234:5678::abcd] (IPv6 literal) [1234:5678::abcd]:5678 (IPv6 literal with explicit port) This grammar is based on the standard for internet host names, as specified by RFC1123, section 2.1, with an extension for IPv6 literals. Server names must be treated case-sensitively: in other words, @user:matrix.org is a different person from @user:MATRIX.ORG. Some recommendations for a choice of server name follow: The length of the complete server name should not exceed 230 characters. Server names should not use upper-case characters. Common Identifier Format The Matrix protocol uses a common format to assign unique identifiers to a number of entities, including users, events and rooms. Each identifier takes the form: &string where & represents a ‘sigil’ character; string is the string which makes up the identifier. The sigil characters are as follows: @: User ID !: Room ID $: Event ID #: Room alias User IDs, room IDs, room aliases, and sometimes event IDs take the form: &localpart:domain where domain is the server name of the homeserver which allocated the identifier, and localpart is an identifier allocated by that homeserver. The precise grammar defining the allowable format of an identifier depends on the type of identifier. For example, event IDs can sometimes be represented with a domain component under some conditions - see the Event IDs section below for more information. User Identifiers [Changed in v1.8] Users within Matrix are uniquely identified by their Matrix user ID. The user ID is namespaced to the homeserver which allocated the account and has the form: @localpart:domain The localpart of a user ID is an opaque identifier for that user. It MUST NOT be empty, and MUST contain only the characters a-z, 0-9, ., _, =, -, /, and +. The domain of a user ID is the server name of the homeserver which allocated the account. The length of a user ID, including the @ sigil and the domain, MUST NOT exceed 255 bytes. The complete grammar for a legal user ID is: user_id = "@" user_id_localpart ":" server_name user_id_localpart = 1*user_id_char user_id_char = DIGIT / %x61-7A ; a-z / "-" / "." / "=" / "_" / "/" / "+" A number of factors were considered when defining the allowable characters for a user ID. F'''
