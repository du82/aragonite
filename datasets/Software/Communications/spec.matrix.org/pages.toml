["https://spec.matrix.org/unstable/application-service-api"]
title = "Application Service API | Matrix Specification"
description = """
The Matrix client-server API and server-server APIs provide the means to implement a consistent self-contained federated messaging fabric. However, they provide limited means of implementing custom server-side behaviour in Matrix (e.g. gateways, filters, extensible hooks etc). The Application Service API (AS API) defines a standard API to allow such extensible functionality to be implemented irrespective of the underlying homeserver implementation.
Application Services Application services are passive and can only observe events from the homeserver. They can inject events into rooms they are participating in. They cannot prevent events from being sent, nor can they modify the content of the event being sent. In order to observe events from a homeserver, the homeserver needs to be configured to pass certain types of traffic to the application service. This is achieved by manually configuring the homeserver with information about the application service."""
full_description = '''You're looking at an unstable version of this specification. Unstable specifications may change at any time without notice. Switch to the current stable release. Matrix Specification Application Service API Application Service API The Matrix client-server API and server-server APIs provide the means to implement a consistent self-contained federated messaging fabric. However, they provide limited means of implementing custom server-side behaviour in Matrix (e.g. gateways, filters, extensible hooks etc). The Application Service API (AS API) defines a standard API to allow such extensible functionality to be implemented irrespective of the underlying homeserver implementation. Application Services Application services are passive and can only observe events from the homeserver. They can inject events into rooms they are participating in. They cannot prevent events from being sent, nor can they modify the content of the event being sent. In order to observe events from a homeserver, the homeserver needs to be configured to pass certain types of traffic to the application service. This is achieved by manually configuring the homeserver with information about the application service. Registration Previously, application services could register with a homeserver via HTTP APIs. This was removed as it was seen as a security risk. A compromised application service could re-register for a global * regex and sniff all traffic on the homeserver. To protect against this, application services now have to register via configuration files which are linked to the homeserver configuration file. The addition of configuration files allows homeserver admins to sanity check the registration for suspicious regex strings. Application services register “namespaces” of user IDs, room aliases and room IDs. An application service is said to be “interested” in a given event if it matches any of the namespaces. An application service can also state whether they should be the only ones who can manage a specified namespace. This is referred to as an “exclusive” namespace. An exclusive namespace prevents humans and other application services from creating/deleting entities in that namespace. Typically, exclusive namespaces are used when the rooms represent real rooms on another service (e.g. IRC). Non-exclusive namespaces are used when the application service is merely augmenting the room itself (e.g. providing logging or searching facilities). The registration is represented by a series of key-value pairs, which is normally encoded as an object in a YAML file. It has the following structure: Registration Registration Name Type Description as_token string Required: A secret token that the application service will use to authenticate requests to the homeserver. hs_token string Required: A secret token that the homeserver will use authenticate requests to the application service. id string Required: A unique, user-defined ID of the application service which will never change. namespaces Namespaces Required: The namespaces that the application service is interested in. protocols [string] The external protocols which the application service provides (e.g. IRC). rate_limited boolean Whether requests from masqueraded users are rate-limited. The sender is excluded. receive_ephemeral boolean Whether the application service wants to receive ephemeral data. Defaults to false if not present. Added in v1.13 sender_localpart string Required: The localpart of the user associated with the application service. Events will be sent to the AS if this user is the target of the event, or is a joined member of the room where the event occurred. url string Required: The URL for the application service. May include a path after the domain name. Optionally set to null if no traffic is required. Namespaces Name Type Description aliases [Namespace] A list of namespaces defining the room aliases that the application service is interested in. All events sent in a room with an alias which matches one of the namespaces will be sent to the AS. rooms [Namespace] A list of namespaces defining the room IDs that the application service is interested in. All events sent in a room with an ID which matches one of the namespaces will be sent to the AS. users [Namespace] A list of namespaces defining the user IDs that the application service is interested in, in addition to its sender_localpart. Events will be sent to the AS if a local user matching one of the namespaces is the target of the event, or is a joined member of the room where the event occurred. Namespace Name Type Description exclusive boolean Required: A true or false value stating whether this application service has exclusive access to events within this namespace. regex string Required: A POSIX regular expression defining which values this namespace includes. Examples {} Exclusive user and alias namespaces should begin with an underscore after the sigil to avoid collisions with other users on the homeserver. Application services should additionally attempt to identify the service they represent in the reserved namespace. For example, @_irc_.* would be a good namespace to register for an application service which deals with IRC. An example registration file for an IRC-bridging application service is below: id: "IRC Bridge" url: "http://127.0.0.1:1234" as_token: "30c05ae90a248a4188e620216fa72e349803310ec83e2a77b34fe90be6081f46" hs_token: "312df522183efd404ec1cd22d2ffa4bbc76a8c1ccf541dd692eef281356bb74e" sender_localpart: "_irc_bot" # Will result in @_irc_bot:example.org namespaces: users: - exclusive: true regex: "@_irc_bridge_.*" aliases: - exclusive: false regex: "#_irc_bridge_.*" rooms: [] For the users namespace, application services can only register interest in local users (i.e., users whose IDs end with the server_name of the local homeserver). Events affecting users on other homeservers are not sent to an application service, even if the user happens to match the one of the users namespaces (unless, of course, the event affects a room that the application service is interested in for another room - for example, because there is another user in the room that the application service is interested in). For the rooms and aliases namespaces, all events in a matching room will be sent to the application service. If the homeserver in question has multiple application services, each as_token and id MUST be unique per application service as these are used to identify the application service. The homeserver MUST enforce this. Homeserver -> Application Service API Authorization [Changed in v1.4] Homeservers MUST include an Authorization header, containing the hs_token from the application service’s registration, when making requests to the application service. Application services MUST verify that the provided Bearer token matches their known hs_token, failing the request with an M_FORBIDDEN error if it does not match. The format of the Authorization header is similar to the Client-Server API: Bearer TheHSTokenGoesHere. In previous versions of this specification, an access_token query parameter was used instead. Servers should only send this query parameter if supporting legacy versions of the specification. If sending the query_string, it is encouraged to send it alongside the Authorization header for maximum compatibility. Application services should ensure both match if both are provided. Legacy routes Previous drafts of the application service specification had a mix of endpoints that have been used in the wild for a significant amount of time. The application service specification now defines a version on all endpoints to be more compatible with the rest of the Matrix specification and the future. Homeservers should attempt to use the specified endpoints first when communicating with application services. However, if the application service receives an HTTP status code that does not indicate success (i.e.: 404, 500, 501, etc) then the homeserver should fall back to the older endpoints for the application service. The older endpoints have the exact same request body and response format, they just belong at a different path. The equivalent path for each is as follows: /_matrix/app/v1/transactions/{txnId} should fall back to /transactions/{txnId} /_matrix/app/v1/users/{userId} should fall back to /users/{userId} /_matrix/app/v1/rooms/{roomAlias} should fall back to /rooms/{roomAlias} /_matrix/app/v1/thirdparty/protocol/{protocol} should fall back to /_matrix/app/unstable/thirdparty/protocol/{protocol} /_matrix/app/v1/thirdparty/user/{user} should fall back to /_matrix/app/unstable/thirdparty/user/{user} /_matrix/app/v1/thirdparty/location/{location} should fall back to /_matrix/app/unstable/thirdparty/location/{location} /_matrix/app/v1/thirdparty/user should fall back to /_matrix/app/unstable/thirdparty/user /_matrix/app/v1/thirdparty/location should fall back to /_matrix/app/unstable/thirdparty/location Homeservers should periodically try again for the newer endpoints because the application service may have been updated. Unknown routes If a request for an unsupported (or unknown) endpoint is received then the server must respond with a 404 M_UNRECOGNIZED error. Similarly, a 405 M_UNRECOGNIZED error is used to denote an unsupported method to a known endpoint. Pushing events The application service API provides a transaction API for sending a list of events. Each list of events includes a transaction ID, which works as follows: Typical HS ---> AS : Homeserver sends events with transaction ID T. <--- : Application Service sends back 200 OK. AS ACK Lost HS ---> AS : Homeserver sends events with transaction ID T. <-/- : AS 200 OK is lost. HS ---> AS : Homeserver retries with the same transaction ID of T. <--- : Application Service sends back 200 OK. If the AS had processed these events already, it can NO-OP this request (and it knows if it is the same events based on the transaction ID). The events sent to the application service should be linearised, as if they were from the event stream. The homeserver MUST maintain a queue of transactions to send to the application service. If the application service cannot be reached, the homeserver SHOULD backoff exponentially until the application service is reachable again. As application services cannot modify the events in any way, these requests can be made without blocking other aspects of the homeserver. Homeservers MUST NOT alter (e.g. add more) events they were going to send within that transaction ID on retries, as the application service may have already processed the events. PUT /_matrix/app/v1/transactions/{txnId} This API is called by the homeserver when it wants to push an event (or batch of events) to the application service. Note that the application service should distinguish state events from message events via the presence of a state_key, rather than via the event type. Rate-limited: No Requires authentication: Yes Request Request parameters path parameters Name Type Description txnId string Required: The transaction ID for this set of events. Homeservers generate these IDs and they are used to ensure idempotency of requests. Request body Name Type Description ephemeral [Event] A list of ephemeral data, if the receive_ephemeral setting was enabled in the registration file. There are only three event types that can currently occur in this list: m.presence, m.typing, and m.receipt. Room-scoped ephemeral data (m.typing and m.receipt) MUST include a room_id property to identify the room that they were sent in. This property can be omitted if it would be empty. Added in v1.13 events [ClientEvent] Required: A list of events, formatted as per the Client-Server API. Event Name Type Description content object Required: The fields in this object will vary depending on the type of event. When interacting with the REST API, this is the HTTP body. type string Required: The type of event. This SHOULD be namespaced similar to Java package naming conventions e.g. ‘com.example.subdomain.event.type’ ClientEvent Name Type Description content object Required: The body of this event, as created by the client which sent it. event_id string Required: The globally unique identifier for this event. origin_server_ts integer Required: Timestamp (in milliseconds since the unix epoch) on originating homeserver when this event was sent. room_id string Required: The ID of the room associated with this event. sender string Required: Contains the fully-qualified ID of the user who sent this event. state_key string Present if, and only if, this event is a state event. The key making this piece of state unique in the room. Note that it is often an empty string. State keys starting with an @ are reserved for referencing user IDs, such as room members. With the exception of a few events, state events set with a given user’s ID as the state key MUST only be set by that user. type string Required: The type of the event. unsigned UnsignedData Contains optional extra information about the event. UnsignedData Name Type Description age integer The time in milliseconds that has elapsed since the event was sent. This field is generated by the local homeserver, and may be incorrect if the local time on at least one of the two servers is out of sync, which can cause the age to either be negative or greater than it actually is. membership string The room membership of the user making the request, at the time of the event. This property is the value of the membership property of the requesting user’s m.room.member state at the point of the event, including any changes caused by the event. If the user had yet to join the room at the time of the event (i.e, they have no m.room.member state), this property is set to leave. Homeservers SHOULD populate this property wherever practical, but they MAY omit it if necessary (for example, if calculating the value is expensive, servers might choose to only implement it in encrypted rooms). The property is not normally populated in events pushed to application services via the application service transaction API (where there is no clear definition of “requesting user”). Added in v1.11 prev_content EventContent The previous content for this event. This field is generated by the local homeserver, and is only returned if the event is a state event, and the client has permission to see the previous content. Changed in v1.2: Previously, this field was specified at the top level of returned events rather than in unsigned (with the exception of the GET .../notifications endpoint), though in practice no known server implementations honoured this. redacted_because ClientEvent The event that redacted this event, if any. transaction_id string The client-supplied transaction ID, for example, provided via PUT /_matrix/client/v3/rooms/{roomId}/send/{eventType}/{txnId}, if the client being given the event is the same one which sent it. Request body example { "ephemeral": [ { "content": { "'''
