title = "Room Version 2 | Matrix Specification"
description = """
This room version builds on version 1 with an improved state resolution algorithm.
Client considerations There are no client considerations introduced in this room version. Clients which implement the redaction algorithm locally should refer to the redactions section below for a full overview of the algorithm.
Server implementation components The information contained in this section is strictly for server implementors. Applications which use the Client-Server API are generally unaffected by the details contained here, and can safely ignore their presence."""
full_description = '''You're looking at an unstable version of this specification. Unstable specifications may change at any time without notice. Switch to the current stable release. Matrix Specification Room Versions Room Version 2 Room Version 2 This room version builds on version 1 with an improved state resolution algorithm. Client considerations There are no client considerations introduced in this room version. Clients which implement the redaction algorithm locally should refer to the redactions section below for a full overview of the algorithm. Server implementation components The information contained in this section is strictly for server implementors. Applications which use the Client-Server API are generally unaffected by the details contained here, and can safely ignore their presence. Room version 2 uses the base components of room version 1, changing only the state resolution algorithm. State resolution [New in this version] The room state S′(E) after an event E is defined in terms of the room state S(E) before E, and depends on whether E is a state event or a message event: If E is a message event, then S′(E) = S(E). If E is a state event, then S′(E) is S(E), except that its entry corresponding to the event_type and state_key of E is replaced by the event_id of E. The room state S(E) before E is the resolution of the set of states {S′(E1), S′(E2), …} after the prev_events {E1, E2, …} of E. The resolution of a set of states is given in the algorithm below. Definitions The state resolution algorithm for version 2 rooms uses the following definitions, given the set of room states {S1, S2, …}: Power events. A power event is a state event with type m.room.power_levels or m.room.join_rules, or a state event with type m.room.member where the membership is leave or ban and the sender does not match the state_key. The idea behind this is that power events are events that might remove someone’s ability to do something in the room. Unconflicted state map and conflicted state set. The keys of the state maps Si are 2-tuples of strings of the form K = (event_type, state_key). The values V are state events. The key-value pairs (K, V) across all state maps Si can be divided into two collections. If a given key K is present in every Si with the same value V in each state map, then the pair (K, V) belongs to the unconflicted state map. Otherwise, V belongs to the conflicted state set. Note that the unconflicted state map only has one event for each key K, whereas the conflicted state set may contain multiple events with the same key. Auth chain. The auth chain of an event E is the set containing all of E’s auth events, all of their auth events, and so on recursively, stretching back to the start of the room. Put differently, these are the events reachable by walking the graph induced by an event’s auth_events links. Auth difference. The auth difference is calculated by first calculating the full auth chain for each state Si, that is the union of the auth chains for each event in Si, and then taking every event that doesn’t appear in every auth chain. If Ci is the full auth chain of Si, then the auth difference is ∪ Ci − ∩ Ci. Full conflicted set. The full conflicted set is the union of the conflicted state set and the auth difference. Reverse topological power ordering. The reverse topological power ordering of a set of events is the lexicographically smallest topological ordering based on the DAG formed by auth events. The reverse topological power ordering is ordered from earliest event to latest. For comparing two topological orderings to determine which is the lexicographically smallest, the following comparison relation on events is used: for events x and y, x < y if x’s sender has greater power level than y’s sender, when looking at their respective auth_events; or the senders have the same power level, but x’s origin_server_ts is less than y’s origin_server_ts; or the senders have the same power level and the events have the same origin_server_ts, but x’s event_id is less than y’s event_id. The reverse topological power ordering can be found by sorting the events using Kahn’s algorithm for topological sorting, and at each step selecting, among all the candidate vertices, the smallest vertex using the above comparison relation. Mainline ordering. Let P = P0 be an m.room.power_levels event. Starting with i = 0, repeatedly fetch Pi+1, the m.room.power_levels event in the auth_events of Pi. Increment i and repeat until Pi has no m.room.power_levels event in its auth_events. The mainline of P0 is the list of events [P0 , P1, … , Pn], fetched in this way. Let e = e0 be another event (possibly another m.room.power_levels event). We can compute a similar list of events [e1, …, em], where ej+1 is the m.room.power_levels event in the auth_events of ej and where em has no m.room.power_levels event in its auth_events. (Note that the event we started with, e0, is not included in this list. Also note that it may be empty, because e may not cite an m.room.power_levels event in its auth_events at all.) Now compare these two lists as follows. Find the smallest index j ≥ 1 for which ej belongs to the mainline of P. If such a j exists, then ej = Pi for some unique index i ≥ 0. Otherwise set i = ∞, where ∞ is a sentinel value greater than any integer. In both cases, the mainline position of e is i. Given mainline positions calculated from P, the mainline ordering based on P of a set of events is the ordering, from smallest to largest, using the following comparison relation on events: for events x and y, x < y if the mainline position of x is greater than the mainline position of y (i.e. the auth chain of x is based on an earlier event in the mainline than y); or the mainline positions of the events are the same, but x’s origin_server_ts is less than y’s origin_server_ts; or the mainline positions of the events are the same and the events have the same origin_server_ts, but x’s event_id is less than y’s event_id. Iterative auth checks. The iterative auth checks algorithm takes as input an initial room state and a sorted list of state events, and constructs a new room state by iterating through the event list and applying the state event to the room state if the state event is allowed by the authorization rules. If the state event is not allowed by the authorization rules, then the event is ignored. If a (event_type, state_key) key that is required for checking the authorization rules is not present in the state, then the appropriate state event from the event’s auth_events is used if the auth event is not rejected. Algorithm The resolution of a set of states is obtained as follows: Select the set X of all power events that appear in the full conflicted set. For each such power event P, enlarge X by adding the events in the auth chain of P which also belong to the full conflicted set. Sort X into a list using the reverse topological power ordering. Apply the iterative auth checks algorithm, starting from the unconflicted state map, to the list of events from the previous step to get a partially resolved state. Take all remaining events that weren’t picked in step 1 and order them by the mainline ordering based on the power level in the partially resolved state obtained in step 2. Apply the iterative auth checks algorithm on the partial resolved state and the list of events from the previous step. Update the result by replacing any event with the event with the same key from the unconflicted state map, if such an event exists, to get the final resolved state. Rejected events Events that have been rejected due to failing auth based on the state at the event (rather than based on their auth chain) are handled as usual by the algorithm, unless otherwise specified. Note that no events rejected due to failure to auth against their auth chain should appear in the process, as they should not appear in state (the algorithm only uses events that appear in either the state sets or in the auth chain of the events in the state sets). This helps ensure that different servers’ view of state is more likely to converge, since rejection state of an event may be different. This can happen if a third server gives an incorrect version of the state when a server joins a room via it (either due to being faulty or malicious). Convergence of state is a desirable property as it ensures that all users in the room have a (mostly) consistent view of the state of the room. If the view of the state on different servers diverges it can lead to bifurcation of the room due to e.g. servers disagreeing on who is in the room. Intuitively, using rejected events feels dangerous, however: Servers cannot arbitrarily make up state, since they still need to pass the auth checks based on the event’s auth chain (e.g. they can’t grant themselves power levels if they didn’t have them before). For a previously rejected event to pass auth there must be a set of state that allows said event. A malicious server could therefore produce a fork where it claims the state is that particular set of state, duplicate the rejected event to point to that fork, and send the event. The duplicated event would then pass the auth checks. Ignoring rejected events would therefore not eliminate any potential attack vectors. Rejected auth events are deliberately excluded from use in the iterative auth checks, as auth events aren’t re-authed (although non-auth events are) during the iterative auth checks. Unchanged from v1 The following sections have not been modified since v1, but are included for completeness. Redactions Upon receipt of a redaction event, the server must strip off any keys not in the following list: event_id type room_id sender state_key content hashes signatures depth prev_events prev_state auth_events origin origin_server_ts membership The content object must also be stripped of all keys, unless it is one of the following event types: m.room.member allows key membership. m.room.create allows key creator. m.room.join_rules allows key join_rule. m.room.power_levels allows keys ban, events, events_default, kick, redact, state_default, users, users_default. m.room.aliases allows key aliases. m.room.history_visibility allows key history_visibility. Event IDs An event has exactly one event ID. Event IDs in this room version have the format: $opaque_id:domain where domain is the server name of the homeserver which created the room, and opaque_id is a locally-unique string. The domain is used only for namespacing to avoid the risk of clashes of identifiers between different homeservers. There is no implication that the room or event in question is still available at the corresponding homeserver. Event format Events in rooms of this version have the following structure: Persistent Data Unit A persistent data unit (event) for room versions 1 and 2. Persistent Data Unit Name Type Description auth_events [[string|Event Hash]] Required: Event IDs and reference hashes for the authorization events that would allow this event to be in the room. Must contain less than or equal to 10 events. Note that if the relevant auth event selection rules are used, this restriction should never be encountered. content object Required: The content of the event. depth integer Required: The maximum depth of the prev_events, plus one. Must be less than the maximum value for an integer (2^63 - 1). If the room’s depth is already at the limit, the depth must be set to the limit. event_id string Required: The event ID for the PDU. hashes Event Hash Required: Content hashes of the PDU, following the algorithm specified in Signing Events. origin_server_ts integer Required: Timestamp in milliseconds on origin homeserver when this event was created. prev_events [[string|Event Hash]] Required: Event IDs and reference hashes for the most recent events in the room that the homeserver was aware of when it made this event. Must contain less than or equal to 20 events. redacts string For redaction events, the ID of the event being redacted. room_id string Required: Room identifier. sender string Required: The ID of the user sending the event. signatures {string: {string: string}} Required: Signatures for the PDU, following the algorithm specified in Signing Events. state_key string If this key is present, the event is a state event, and it will replace previous events with the same type and state_key in the room state. type string Required: Event type unsigned UnsignedData Additional data added by the origin server but not covered by the signatures. Event Hash Name Type Description sha256 string Required: The hash. UnsignedData Name Type Description age integer The number of milliseconds that have passed since this message was sent. Examples { "auth_events": [ "$af232176:example.org", { "sha256": "abase64encodedsha256hashshouldbe43byteslong" } ], "content": { "key": "value" }, "depth": 12, "event_id": "$a4ecee13e2accdadf56c1025:example.com", "hashes": { "sha256": "thishashcoversallfieldsincasethisisredacted" }, "origin_server_ts": 1404838188000, "prev_events": [ "$af232176:example.org", { "sha256": "abase64encodedsha256hashshouldbe43byteslong" } ], "room_id": "!UcYsUzyxTGDxLBEvLy:example.org", "sender": "@alice:example.com", "signatures": { "example.com": { "ed25519:key_version:": "these86bytesofbase64signaturecoveressentialfieldsincludinghashessocancheckredactedpdus" } }, "type": "m.room.message", "unsigned": { "age": 4612 } } Deprecated event content schemas Events sent into rooms of this version can have formats which are different from their normal schema. Those cases are documented here. The behaviour described here is preserved strictly for backwards compatibility only. A homeserver should take reasonable precautions to prevent users from sending these so-called “malformed” events, and must never rely on the behaviours described here as a default. m.room.power_levels events accept values as strings In order to maintain backwards compatibility with early implementations, each of the integer-valued properties within m.room.power_levels events can be encoded as strings instead of integers. This includes the nested values within the events, notifications and users properties. For example, the following is a valid m.room.power_levels event in this room version: { "content": { "ban": "50", "events": { "m.room.power_levels": "100" }, "events_default": "0", "state_default": "50", "users": { "@example:localhost": "100" }, "users_default": "0" }, "origin_server_ts": 1432735824653, "room_id": "!jEsUZKDJdhlrceRyVU:example.org", "sender": "@example:example.org", "state_key": "", "type": "m.room.power_levels" } When the value is representative of an integer, they must be the following format: a single base 10 integer, no float values or decimal points, optionally with any number of leading zeroes ("100", "000100"); optionally prefixed with a single - or + character before the integer ("+100", "-100"). optionally with any number of leading or trailing'''
