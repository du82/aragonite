["https://spec.matrix.org/unstable/rooms/v11"]
title = "Room Version 11 | Matrix Specification"
description = """
This room version builds on version 10 while clarifying redaction rules.
Client considerations Redactions [New in this version] The top-level origin, membership, and prev_state properties are no longer protected from redaction. The m.room.create event now keeps the entire content property. The m.room.redaction event keeps the redacts property under content. The m.room.power_levels event keeps the invite property under content.
The full redaction algorithm follows.
Upon receipt of a redaction event, the server must strip off any keys not in the following list:"""
full_description = '''You're looking at an unstable version of this specification. Unstable specifications may change at any time without notice. Switch to the current stable release. Matrix Specification Room Versions Room Version 11 Room Version 11 This room version builds on version 10 while clarifying redaction rules. Client considerations Redactions [New in this version] The top-level origin, membership, and prev_state properties are no longer protected from redaction. The m.room.create event now keeps the entire content property. The m.room.redaction event keeps the redacts property under content. The m.room.power_levels event keeps the invite property under content. The full redaction algorithm follows. Upon receipt of a redaction event, the server must strip off any keys not in the following list: event_id type room_id sender state_key content hashes signatures depth prev_events auth_events origin_server_ts The content object must also be stripped of all keys, unless it is one of the following event types: m.room.member allows keys membership, join_authorised_via_users_server. Additionally, it allows the signed key of the third_party_invite key. m.room.create allows all keys. m.room.join_rules allows keys join_rule, allow. m.room.power_levels allows keys ban, events, events_default, invite, kick, redact, state_default, users, users_default. m.room.history_visibility allows key history_visibility. m.room.redaction allows key redacts. Event format Clients should no longer depend on the creator property in the content of m.room.create events. In all room versions, clients can rely on sender instead to determine a room creator. The format of m.room.redaction events has been modified. Client should look for the redacts key under content instead of a top-level event property. The third_party_invite key of m.room.member events is no longer redacted, but will only contain the signed key after redaction. Server implementation components The information contained in this section is strictly for server implementors. Applications which use the Client-Server API are generally unaffected by the intricacies contained here. The section above regarding client considerations is the resource that Client-Server API use cases should reference. This room version updates the redaction algorithm and modifies how servers should create m.room.create and m.room.redaction events. Room version 11 is based upon room version 10 with the following considerations. Redactions See above. Event format The core event format is the same as room version 10. However, this room version changes some properties of some event types. Events in rooms of this version have the following structure: Persistent Data Unit A persistent data unit (event) for room version 11 and beyond. Persistent Data Unit Name Type Description auth_events [string] Required: Event IDs for the authorization events that would allow this event to be in the room. Must contain less than or equal to 10 events. Note that if the relevant auth event selection rules are used, this restriction should never be encountered. content object Required: The content of the event. depth integer Required: The maximum depth of the prev_events, plus one. Must be less than the maximum value for an integer (2^63 - 1). If the room’s depth is already at the limit, the depth must be set to the limit. hashes Event Hash Required: Content hashes of the PDU, following the algorithm specified in Signing Events. origin_server_ts integer Required: Timestamp in milliseconds on origin homeserver when this event was created. prev_events [string] Required: Event IDs for the most recent events in the room that the homeserver was aware of when it made this event. Must contain less than or equal to 20 events. room_id string Required: Room identifier. sender string Required: The ID of the user sending the event. signatures {string: {string: string}} Required: Signatures for the PDU, following the algorithm specified in Signing Events. state_key string If this key is present, the event is a state event, and it will replace previous events with the same type and state_key in the room state. type string Required: Event type unsigned UnsignedData Additional data added by the origin server but not covered by the signatures. Event Hash Name Type Description sha256 string Required: The hash. UnsignedData Name Type Description age integer The number of milliseconds that have passed since this message was sent. Examples { "auth_events": [ "$urlsafe_base64_encoded_eventid", "$a-different-event-id" ], "content": { "key": "value" }, "depth": 12, "hashes": { "sha256": "thishashcoversallfieldsincasethisisredacted" }, "origin_server_ts": 1404838188000, "prev_events": [ "$urlsafe_base64_encoded_eventid", "$a-different-event-id" ], "room_id": "!UcYsUzyxTGDxLBEvLy:example.org", "sender": "@alice:example.com", "signatures": { "example.com": { "ed25519:key_version:": "these86bytesofbase64signaturecoveressentialfieldsincludinghashessocancheckredactedpdus" } }, "type": "m.room.message", "unsigned": { "age": 4612 } } Remove the creator property of m.room.create events The content of a m.room.create event no longer has a creator property, which previously was always equivalent to the sender of the event. Moving the redacts property of m.room.redaction events to a content property The redacts property of m.room.redaction events is moved from a top-level event property to a property under the event content. For backwards-compatibility with older clients, servers should add a redacts property to the top level of m.room.redaction events when serving such events over the Client-Server API. For improved compatibility with newer clients, servers should add a redacts property to the content of m.room.redaction events in older room versions when serving such events over the Client-Server API. Authorization rules Events must be signed by the server denoted by the sender property. The types of state events that affect authorization are: m.room.create m.room.member m.room.join_rules m.room.power_levels m.room.third_party_invite Power levels are inferred from defaults when not explicitly supplied. For example, mentions of the sender’s power level can also refer to the default power level for users in the room. m.room.redaction events are subject to auth rules in the same way as any other event. In practice, that means they will normally be allowed by the auth rules, unless the m.room.power_levels event sets a power level requirement for m.room.redaction events via the events or events_default properties. In particular, the redact level is not considered by the auth rules. The ability to send a redaction event does not mean that the redaction itself should be performed. Receiving servers must perform additional checks, as described in the Handling redactions section. The rules are as follows: [Changed in this version] If type is m.room.create: If it has any prev_events, reject. If the domain of the room_id does not match the domain of the sender, reject. If content.room_version is present and is not a recognised version, reject. Otherwise, allow. Considering the event’s auth_events: If there are duplicate entries for a given type and state_key pair, reject. If there are entries whose type and state_key don’t match those specified by the auth events selection algorithm described in the server specification, reject. If there are entries which were themselves rejected under the checks performed on receipt of a PDU, reject. If there is no m.room.create event among the entries, reject. If the content of the m.room.create event in the room state has the property m.federate set to false, and the sender domain of the event does not match the sender domain of the create event, reject. If type is m.room.member: If there is no state_key property, or no membership property in content, reject. If content has a join_authorised_via_users_server key: If the event is not validly signed by the homeserver of the user ID denoted by the key, reject. If membership is join: [Changed in this version] If the only previous event is an m.room.create and the state_key is the sender of the m.room.create, allow. If the sender does not match state_key, reject. If the sender is banned, reject. If the join_rule is invite or knock then allow if membership state is invite or join. If the join_rule is restricted or knock_restricted: If membership state is join or invite, allow. If the join_authorised_via_users_server key in content is not a user with sufficient permission to invite other users, reject. Otherwise, allow. If the join_rule is public, allow. Otherwise, reject. If membership is invite: If content has a third_party_invite property: If target user is banned, reject. If content.third_party_invite does not have a signed property, reject. If signed does not have mxid and token properties, reject. If mxid does not match state_key, reject. If there is no m.room.third_party_invite event in the current room state with state_key matching token, reject. If sender does not match sender of the m.room.third_party_invite, reject. If any signature in signed matches any public key in the m.room.third_party_invite event, allow. The public keys are in content of m.room.third_party_invite as: A single public key in the public_key property. A list of public keys in the public_keys property. Otherwise, reject. If the sender’s current membership state is not join, reject. If target user’s current membership state is join or ban, reject. If the sender’s power level is greater than or equal to the invite level, allow. Otherwise, reject. If membership is leave: If the sender matches state_key, allow if and only if that user’s current membership state is invite, join, or knock. If the sender’s current membership state is not join, reject. If the target user’s current membership state is ban, and the sender’s power level is less than the ban level, reject. If the sender’s power level is greater than or equal to the kick level, and the target user’s power level is less than the sender’s power level, allow. Otherwise, reject. If membership is ban: If the sender’s current membership state is not join, reject. If the sender’s power level is greater than or equal to the ban level, and the target user’s power level is less than the sender’s power level, allow. Otherwise, reject. If membership is knock: If the join_rule is anything other than knock or knock_restricted, reject. If sender does not match state_key, reject. If the sender’s current membership is not ban, invite, or join, allow. Otherwise, reject. Otherwise, the membership is unknown. Reject. If the sender’s current membership state is not join, reject. If type is m.room.third_party_invite: Allow if and only if sender’s current power level is greater than or equal to the invite level. If the event type’s required power level is greater than the sender’s power level, reject. If the event has a state_key that starts with an @ and does not match the sender, reject. If type is m.room.power_levels: If any of the properties users_default, events_default, state_default, ban, redact, kick, or invite in content are present and not an integer, reject. If either of the properties events or notifications in content are present and not an object with values that are integers, reject. If the users property in content is not an object with keys that are valid user IDs with values that are integers, reject. If there is no previous m.room.power_levels event in the room, allow. For the properties users_default, events_default, state_default, ban, redact, kick, invite check if they were added, changed or removed. For each found alteration: If the current value is higher than the sender’s current power level, reject. If the new value is higher than the sender’s current power level, reject. For each entry being changed in, or removed from, the events or notifications properties: If the current value is greater than the sender’s current power level, reject. For each entry being added to, or changed in, the events or notifications properties: If the new value is greater than the sender’s current power level, reject. For each entry being changed in, or removed from, the users property, other than the sender’s own entry: If the current value is greater than or equal to the sender’s current power level, reject. For each entry being added to, or changed in, the users property: If the new value is greater than the sender’s current power level, reject. Otherwise, allow. Otherwise, allow. Some consequences of these rules: Unless you are a member of the room, the only permitted operations (apart from the initial create/join) are: joining a public room; accepting or rejecting an invitation to a room. To unban somebody, you must have power level greater than or equal to both the kick and ban levels, and greater than the target user’s power level. Unchanged from v10 The following sections have not been modified since v10, but are included for completeness. Handling redactions In room versions 1 and 2, redactions were explicitly part of the authorization rules under Rule 11. As of room version 3, these conditions no longer exist as represented by this version’s authorization rules. While redactions are always accepted by the authorization rules for events, they should not be sent to clients until both the redaction event and the event the redaction affects have been received, and can be validated. If both events are valid and have been seen by the server, then the server applies the redaction if one of the following conditions is met: The power level of the redaction event’s sender is greater than or equal to the redact level. The domain of the redaction event’s sender matches that of the original event’s sender. If the server would apply a redaction, the redaction event is also sent to clients. Otherwise, the server simply waits for a valid partner event to arrive where it can then re-check the above. Event IDs The event ID is the reference hash of the event encoded using a variation of Unpadded Base64 which replaces the 62nd and 63rd characters with - and _ instead of using + and /. This matches RFC4648’s definition of URL-safe base64. Event IDs are still prefixed with $ and might result in looking like $Rqnc-F-dvnEYJTyHq_iKxU2bZ1CI92-kuZq3a5lr5Zg. State resolution The room state S′(E) after an event E is defined in terms of the room state S(E) before E, and depends on whether E is a state event or a message event: If E is a message event, then S′(E) = S(E). If E is a state event, then S′(E) is S(E), except that its entry corresponding to the event_type and state_key of E is replaced by the event_id of E. The room state S(E) before E is the resolution of the set of states {S′(E1), S′(E2), …} after the prev_events {E1, E2, …} of E. The resolution of a set of states is given in the algorithm below. Definitions The state resolution algorithm for version 2 rooms uses the following definitions, given the set'''
