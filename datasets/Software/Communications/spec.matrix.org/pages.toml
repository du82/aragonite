["https://spec.matrix.org/unstable/rooms/v3"]
title = "Room Version 3 | Matrix Specification"
description = """
This room version builds on version 2 with an improved event format.
Client considerations This room version changes the format for event IDs sent to clients. Clients should be aware that these event IDs may contain slashes and other potentially problematic characters. Clients should be treating event IDs as opaque identifiers and should not be attempting to parse them into a usable form, just like with other room versions."""
full_description = '''You're looking at an unstable version of this specification. Unstable specifications may change at any time without notice. Switch to the current stable release. Matrix Specification Room Versions Room Version 3 Room Version 3 This room version builds on version 2 with an improved event format. Client considerations This room version changes the format for event IDs sent to clients. Clients should be aware that these event IDs may contain slashes and other potentially problematic characters. Clients should be treating event IDs as opaque identifiers and should not be attempting to parse them into a usable form, just like with other room versions. Clients should expect to see event IDs changed from the format of $randomstring:example.org to something like $acR1l0raoZnm60CBwAVgqbZqoO/mYU81xysh1u7XcJk (note the lack of domain and the potentially problematic slash). Though unchanged in this room version, clients which implement the redaction algorithm locally should refer to the redactions section below for a full overview. Server implementation components The information contained in this section is strictly for server implementors. Applications which use the Client-Server API are generally unaffected by the intricacies contained here. The section above regarding client considerations is the resource that Client-Server API use cases should reference. Room version 3 uses the event format described here in addition to all the remaining behaviour described by room version 2. Handling redactions [New in this version] In room versions 1 and 2, redactions were explicitly part of the authorization rules under Rule 11. As of room version 3, these conditions no longer exist as represented by this version’s authorization rules. While redactions are always accepted by the authorization rules for events, they should not be sent to clients until both the redaction event and the event the redaction affects have been received, and can be validated. If both events are valid and have been seen by the server, then the server applies the redaction if one of the following conditions is met: The power level of the redaction event’s sender is greater than or equal to the redact level. The domain of the redaction event’s sender matches that of the original event’s sender. If the server would apply a redaction, the redaction event is also sent to clients. Otherwise, the server simply waits for a valid partner event to arrive where it can then re-check the above. Event IDs In other room versions (namely version 1 and 2) the event ID is a distinct field from the remainder of the event, which must be tracked as such. This leads to complications where servers receive multiple events with the same ID in either the same or different rooms where the server cannot easily keep track of which event it should be using. By removing the use of a dedicated event ID, servers are required to track the hashes on an event to determine its ID. [New in this version] The event ID is the reference hash of the event encoded using Unpadded Base64, prefixed with $. A resulting event ID using this approach should look similar to $CD66HAED5npg6074c6pDtLKalHjVfYb2q4Q3LZgrW6o. Event format When events are sent over federation, the event_id field is no longer included. A server receiving an event should compute the relevant event ID for itself. Additionally, the format of the auth_events and prev_events fields are changed: instead of lists of (event_id, hash) pairs, they are now plain lists of event IDs. These changes to the format of an event mean that servers must be aware of the version of the room containing an incoming event, so that the event can be correctly parsed and handled. This is facilitated via changes to the server-server API (such as the inclusion of room_version in the response to GET /_matrix/federation/v1/make_join/{roomId}/{userId}.) The complete structure of a event in a v3 room is shown below. Persistent Data Unit A persistent data unit (event) for room version 3 and beyond. Persistent Data Unit Name Type Description auth_events [string] Required: Event IDs for the authorization events that would allow this event to be in the room. Must contain less than or equal to 10 events. Note that if the relevant auth event selection rules are used, this restriction should never be encountered. content object Required: The content of the event. depth integer Required: The maximum depth of the prev_events, plus one. Must be less than the maximum value for an integer (2^63 - 1). If the room’s depth is already at the limit, the depth must be set to the limit. hashes Event Hash Required: Content hashes of the PDU, following the algorithm specified in Signing Events. origin_server_ts integer Required: Timestamp in milliseconds on origin homeserver when this event was created. prev_events [string] Required: Event IDs for the most recent events in the room that the homeserver was aware of when it made this event. Must contain less than or equal to 20 events. redacts string For redaction events, the ID of the event being redacted. room_id string Required: Room identifier. sender string Required: The ID of the user sending the event. signatures {string: {string: string}} Required: Signatures for the PDU, following the algorithm specified in Signing Events. state_key string If this key is present, the event is a state event, and it will replace previous events with the same type and state_key in the room state. type string Required: Event type unsigned UnsignedData Additional data added by the origin server but not covered by the signatures. Event Hash Name Type Description sha256 string Required: The hash. UnsignedData Name Type Description age integer The number of milliseconds that have passed since this message was sent. Examples { "auth_events": [ "$base64encodedeventid", "$adifferenteventid" ], "content": { "key": "value" }, "depth": 12, "hashes": { "sha256": "thishashcoversallfieldsincasethisisredacted" }, "origin_server_ts": 1404838188000, "prev_events": [ "$base64encodedeventid", "$adifferenteventid" ], "redacts": "$some/old+event", "room_id": "!UcYsUzyxTGDxLBEvLy:example.org", "sender": "@alice:example.com", "signatures": { "example.com": { "ed25519:key_version:": "these86bytesofbase64signaturecoveressentialfieldsincludinghashessocancheckredactedpdus" } }, "type": "m.room.message", "unsigned": { "age": 4612 } } Deprecated event content schemas Events sent into rooms of this version can have formats which are different from their normal schema. Those cases are documented here. The behaviour described here is preserved strictly for backwards compatibility only. A homeserver should take reasonable precautions to prevent users from sending these so-called “malformed” events, and must never rely on the behaviours described here as a default. m.room.power_levels events accept values as strings In order to maintain backwards compatibility with early implementations, each of the integer-valued properties within m.room.power_levels events can be encoded as strings instead of integers. This includes the nested values within the events, notifications and users properties. For example, the following is a valid m.room.power_levels event in this room version: { "content": { "ban": "50", "events": { "m.room.power_levels": "100" }, "events_default": "0", "state_default": "50", "users": { "@example:localhost": "100" }, "users_default": "0" }, "origin_server_ts": 1432735824653, "room_id": "!jEsUZKDJdhlrceRyVU:example.org", "sender": "@example:example.org", "state_key": "", "type": "m.room.power_levels" } When the value is representative of an integer, they must be the following format: a single base 10 integer, no float values or decimal points, optionally with any number of leading zeroes ("100", "000100"); optionally prefixed with a single - or + character before the integer ("+100", "-100"). optionally with any number of leading or trailing whitespace characters (" 100 ", " 00100 ", " +100 ", " -100 "); Authorization rules [New in this version] m.room.redaction events are subject to auth rules in the same way as any other event. In practice, that means they will normally be allowed by the auth rules, unless the m.room.power_levels event sets a power level requirement for m.room.redactionevents via the events or events_default properties. In particular, the redact level is not considered by the auth rules. The ability to send a redaction event does not mean that the redaction itself should be performed. Receiving servers must perform additional checks, as described in the Handling Redactions section. [New in this version] In room versions 1 and 2, events need a signature from the domain of the event_id in order to be considered valid. This room version does not include an event_id over federation in the same respect, so does not need a signature from that server. The event must still be signed by the server denoted by the sender property, however. The types of state events that affect authorization are: m.room.create m.room.member m.room.join_rules m.room.power_levels m.room.third_party_invite Power levels are inferred from defaults when not explicitly supplied. For example, mentions of the sender’s power level can also refer to the default power level for users in the room. The complete list of rules, as of room version 3, is as follows: If type is m.room.create: If it has any prev_events, reject. If the domain of the room_id does not match the domain of the sender, reject. If content.room_version is present and is not a recognised version, reject. If content has no creator property, reject. Otherwise, allow. Considering the event’s auth_events: If there are duplicate entries for a given type and state_key pair, reject. If there are entries whose type and state_key don’t match those specified by the auth events selection algorithm described in the server specification, reject. If there are entries which were themselves rejected under the checks performed on receipt of a PDU, reject. If there is no m.room.create event among the entries, reject. If the content of the m.room.create event in the room state has the property m.federate set to false, and the sender domain of the event does not match the sender domain of the create event, reject. If type is m.room.aliases: If event has no state_key, reject. If sender’s domain doesn’t matches state_key, reject. Otherwise, allow. If type is m.room.member: If there is no state_key property, or no membership property in content, reject. If membership is join: If the only previous event is an m.room.create and the state_key is the creator, allow. If the sender does not match state_key, reject. If the sender is banned, reject. If the join_rule is invite then allow if membership state is invite or join. If the join_rule is public, allow. Otherwise, reject. If membership is invite: If content has a third_party_invite property: If target user is banned, reject. If content.third_party_invite does not have a signed property, reject. If signed does not have mxid and token properties, reject. If mxid does not match state_key, reject. If there is no m.room.third_party_invite event in the current room state with state_key matching token, reject. If sender does not match sender of the m.room.third_party_invite, reject. If any signature in signed matches any public key in the m.room.third_party_invite event, allow. The public keys are in content of m.room.third_party_invite as: A single public key in the public_key property. A list of public keys in the public_keys property. Otherwise, reject. If the sender’s current membership state is not join, reject. If target user’s current membership state is join or ban, reject. If the sender’s power level is greater than or equal to the invite level, allow. Otherwise, reject. If membership is leave: If the sender matches state_key, allow if and only if that user’s current membership state is invite or join. If the sender’s current membership state is not join, reject. If the target user’s current membership state is ban, and the sender’s power level is less than the ban level, reject. If the sender’s power level is greater than or equal to the kick level, and the target user’s power level is less than the sender’s power level, allow. Otherwise, reject. If membership is ban: If the sender’s current membership state is not join, reject. If the sender’s power level is greater than or equal to the ban level, and the target user’s power level is less than the sender’s power level, allow. Otherwise, reject. Otherwise, the membership is unknown. Reject. If the sender’s current membership state is not join, reject. If type is m.room.third_party_invite: Allow if and only if sender’s current power level is greater than or equal to the invite level. If the event type’s required power level is greater than the sender’s power level, reject. If the event has a state_key that starts with an @ and does not match the sender, reject. If type is m.room.power_levels: If users property in content is not an object with keys that are valid user IDs with values that are integers (or a string that is an integer), reject. If there is no previous m.room.power_levels event in the room, allow. For the properties users_default, events_default, state_default, ban, redact, kick, invite check if they were added, changed or removed. For each found alteration: If the current value is greater than the sender’s current power level, reject. If the new value is greater than the sender’s current power level, reject. For each entry being changed in, or removed from, the events property: If the current value is greater than the sender’s current power level, reject. For each entry being added to, or changed in, the events property: If the new value is greater than the sender’s current power level, reject. For each entry being changed in, or removed from, the users property, other than the sender’s own entry: If the current value is greater than or equal to the sender’s current power level, reject. For each entry being added to, or changed in, the users property: If the new value is greater than the sender’s current power level, reject. Otherwise, allow. Otherwise, allow. Some consequences of these rules: Unless you are a member of the room, the only permitted operations (apart from the initial create/join) are: joining a public room; accepting or rejecting an invitation to a room. To unban somebody, you must have power level greater than or equal to both the kick and ban levels, and greater than the target user’s power level. Unchanged from v2 The following sections have not been modified since v2, but are included for completeness. Redactions Upon receipt of a redaction event, the server must strip off any keys not in the following list: event_id type room_id sender state_key content hashes signatures depth prev_events prev_state auth_events origin origin_server_ts membership The content object must also be stripped of all keys, unless it is one'''
