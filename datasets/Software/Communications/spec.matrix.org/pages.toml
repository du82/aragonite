full_description = "Matrix Specification Changelog v1.4 v1.4 Changelog Git commithttps://github.com/matrix-org/matrix-spec/tree/v1.4 Release dateSeptember 29, 2022 Checklistchecklist.md Client-Server API Removed Endpoints Remove unused policy room sharing mechanism, as per MSC3844. (#1196) Backwards Compatible Changes Add a .m.rule.room.server_acl push rule to match m.room.server_acl events, as per MSC3786. (#1190, #1201) Add Cross-Origin-Resource-Policy (CORP) headers to media repository, as per MSC3828. (#1197) Copy a room’s type when upgrading it, as per MSC3818. (#1198) Add room_types filter and room_type response to /publicRooms, as per MSC3827. (#1199) Add m.replace relations (event edits), as per MSC2676. (#1211) Add m.read.private receipts, as per MSC2285. (#1216) Make m.fully_read optional on /read_markers, as per MSC2285. (#1216) Allow m.fully_read markers to be set from /receipts, as per MSC2285. (#1216) Add threading via m.thread relations, as per MSC3440, MSC3816, MSC3856, and MSC3715. (#1254) Add per-thread notifications and read receipts, as per MSC3771 and MSC3773. (#1255) Add thread_id to the /receipt endpoint, as per MSC3771. (#1261) Spec Clarifications Mention that the /rooms/{roomId}/invite endpoint will return a 200 response if the user is already invited to the room. (#1084) Fix various typos throughout the specification. (#1135, #1161, #1164, #1170, #1180, #1215, #1238, #1243, #1263) Describe return codes for account data endpoints, and clarify that per-room data does not inherit from the global data. (#1155) Clarify that policy rule globs work like ACL globs. Contributed by Nico. (#1165) Clarify the format of some structures in the End-to-end encryption module. (#1166) Add HTML anchors for object definitions in the formatted specification. (#1174) Tweak the styling of <code> snippets in tables rendered from OpenAPI definitions. (#1179) Update “API Standards” section to clarify how JSON is used. (#1185) Clarify that the “device_id”, “user_id” and “access_token” fields are required in the response body of POST /_matrix/client/v3/login. (#1210) Reinforce the relationship of refreshed access tokens to transaction IDs. (#1236) Clarify enum values by separating possible values with commas. (#1240) Server-Server API Backwards Compatible Changes Add per-thread notifications and read receipts, as per MSC3771 and MSC3773. (#1255) Spec Clarifications Add HTML anchors for object definitions in the formatted specification. (#1174) Tweak the styling of <code> snippets in tables rendered from OpenAPI definitions. (#1179) Update “API Standards” section to clarify how JSON is used. (#1185) Application Service API Breaking Changes Replace homeserver authorization approach with an Authorization header instead of access_token when talking to the application service, as per MSC2832. (#1200) Spec Clarifications Add HTML anchors for object definitions in the formatted specification. (#1174) Identity Service API Spec Clarifications Add HTML anchors for object definitions in the formatted specification. (#1174) Update “API Standards” section to clarify how JSON is used. (#1185) Push Gateway API Spec Clarifications Add HTML anchors for object definitions in the formatted specification. (#1174) Room Versions Spec Clarifications For room versions 1 through 10, clarify that events with rejected auth_events must be rejected. (#1137) For room versions 2–10: correct a mistaken clarification to the state resolution algorithm. (#1158) For room versions 7 through 10: Clarify that invite->knock is actually a legal transition. (#1175) Appendices No significant changes. Internal Changes/Tooling Backwards Compatible Changes Add internal changes changelog section. (#1194) Spec Clarifications Render HTML anchors for object definition tables. (#1191) Give rendered-data sections a background and some padding. (#1195) Fix rendering of shortcodes within the client-server API. (#1205) Fix the spacing of mapping types generated from the OpenAPI spec. (#1230)"
