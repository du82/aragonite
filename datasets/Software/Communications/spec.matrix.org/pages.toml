ifications to the text on event authorisation rules. (#1270) Fix a number of broken links in the specification. (#1330) Appendices No significant changes. Internal Changes/Tooling Backwards Compatible Changes Update docsy theme to v0.5.0 + matrix.org modifications (https://github.com/matrix-org/docsy/commit/a0032f8db919a6c67ba6cdef2c455f105b6272a2). (#1295) Spec Clarifications Improve error messages emitted by resolve-additional-types template. (#1303) Fix link to API viewer. (#1308) Stop rendering the subsections of the Client-Server API and Room Versions specs as their own separate pages. (#1317) Use a link checker to ensure that we do not have broken links. (#1329, #1338) Update instructions to preview Swagger definitions. (#1331) Make definition anchors more unique. (#1339) Generate the unstable changelogs with towncrier, for consistency. (#1340) Update CONTRIBUTING.md to mention that non-content changes to this repo should have an “internal” changelog entry. (#1342) Update module summary table with new modules: Event Replacements, Threading and Reference Relations. (#1344) Disable RSS generation for the spec. (#1346)"
