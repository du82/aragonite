full_description = "Matrix Specification Changelog v1.8 v1.8 Changelog Git commithttps://github.com/matrix-org/matrix-spec/tree/v1.8 Release dateAugust 23, 2023 Checklistchecklist.md Client-Server API Backwards Compatible Changes Require callers to be joined to the room to report its events, as per MSC2249. (#1517) Spec Clarifications Fix missing type property in the JSON schema definition of the m.reaction event. Contributed by @chebureki. (#1552) Make sure examples types match schema in definitions. (#1563) Allow null in room_types in POST /publicRooms endpoints schemas. (#1564) Fix broken header formatting. Contributed by @midnightveil. (#1578) Render binary request and response bodies. (#1579) Fix description of MAC calculation in SAS verification. (#1590) Update link to SAS emoji definition data. (#1593) Fix various typos throughout the specification. (#1597) Server-Server API Deprecations Deprecate matrix SRV lookup steps during server discovery, as per MSC4040. (#1624) Backwards Compatible Changes Add matrix-fed SRV lookup steps to server discovery, as per MSC4040. (#1624) Spec Clarifications Document why /state_ids can respond with a 404. (#1521) Fix response definition for POST /_matrix/federation/v1/user/keys/claim. (#1559) Fix examples in server keys definition. (#1560) Make sure examples types match schema in definitions. (#1563) Allow null in room_types in POST /publicRooms endpoints schemas. (#1564) Fix broken header formatting. Contributed by @midnightveil. (#1578) Remove spurious mention of a “default port” with respect to SRV record lookup. (#1615) Switch to ordered list for server name resolution steps. (#1623) Application Service API Spec Clarifications Fix type of custom fields in thirdparty lookup queries. (#1584) Identity Service API Spec Clarifications Make sure examples types match schema in definitions. (#1563) Push Gateway API No significant changes. Room Versions Backwards Compatible Changes Add room version 11 as per MSC3820. (#1604) Move redacts from top level to content on m.room.redaction events in room version 11, as per MSC2174. (#1604) Remove creator from m.room.creator events in room version 11, as per MSC2175. (#1604) Remove remaining usage of origin from events in room version 11, as per MSC3989. (#1604) Update the redaction rules in room version 11, as per MSC2176 and MSC3821. (#1604) Appendices Backwards Compatible Changes Allow + in Matrix IDs, as per MSC4009. (#1583) Spec Clarifications Clarify spec re canonical JSON to handle negative-zero; also, give an example of negative-zero and a large power of ten. (#1573) Internal Changes/Tooling Backwards Compatible Changes Upgrade Swagger data to OpenAPI 3.1. (#1310) Create @matrix-org/spec npm package to ship the SAS Emoji data definitions & translations. (#1620) Spec Clarifications Update the CI to validate the file extension of changelog entries. (#1542) Disclosure sections now only display their title when collapsed. (#1549) Fix the sidebar in recent versions of Hugo. (#1551) Bump jsonschema to validate JSON Schemas against Draft 2020-12. (#1556) Use Redocly CLI to validate OpenAPI definitions. (#1558) Use tag name as the OpenAPI definition version. (#1561) Make sure version in x-changedInMatrixVersion is a string. (#1562) Clarify usage of ABNF for grammar in the documentation style guide. (#1582) Remove unnecessary oneOfs in JSON schemas. (#1585) Update the version of Hugo used to render the spec to v0.113.0. (#1591) Fix rendered changelog with new version of towncrier. (#1598) Improve the layout of tables on desktop displays. Contributed by Martin Fischer. (#1601)"
