title = "v1.9 Changelog | Matrix Specification"
description = """
Client-Server API Backwards Compatible Changes
Add the m.rule.suppress_edits default push rule, as per MSC3958. (#1617) Spec Clarifications
Fix m.call.negotiate schema and example. (#1546) Clarify that the via property is required for m.space.parent and m.space.child as per MSC1772. Contributed by @PaarthShah. (#1618) Add a note to the /publicRooms API that the server name is case sensitive. (#1638) Clarify that an m.room.name event with an absent name field is not expected behavior. (#1639) Fix schemas used for account data and presence events in GET /initialSync. (#1647) Fix various typos throughout the specification. (#1658, #1661, #1665) Fix .m.rule.suppress_notices push rule not being valid JSON. (#1671) Add missing properties for event_property_is and event_property_contains push conditions to PushConditions object. (#1673) Indicate that fallback keys should have a fallback property set to true. (#1676) Clarify that thread roots are not considered within the thread. (#1677) Server-Server API Spec Clarifications"""
full_description = "You're looking at an unstable version of this specification. Unstable specifications may change at any time without notice. Switch to the current stable release. Matrix Specification Changelog v1.9 v1.9 Changelog Git commithttps://github.com/matrix-org/matrix-spec/tree/v1.9 Release dateNovember 29, 2023 Checklistchecklist.md Client-Server API Backwards Compatible Changes Add the m.rule.suppress_edits default push rule, as per MSC3958. (#1617) Spec Clarifications Fix m.call.negotiate schema and example. (#1546) Clarify that the via property is required for m.space.parent and m.space.child as per MSC1772. Contributed by @PaarthShah. (#1618) Add a note to the /publicRooms API that the server name is case sensitive. (#1638) Clarify that an m.room.name event with an absent name field is not expected behavior. (#1639) Fix schemas used for account data and presence events in GET /initialSync. (#1647) Fix various typos throughout the specification. (#1658, #1661, #1665) Fix .m.rule.suppress_notices push rule not being valid JSON. (#1671) Add missing properties for event_property_is and event_property_contains push conditions to PushConditions object. (#1673) Indicate that fallback keys should have a fallback property set to true. (#1676) Clarify that thread roots are not considered within the thread. (#1677) Server-Server API Spec Clarifications Fix schema of m.receipt EDU. (#1636) Fix various typos throughout the specification. (#1661) Clarify that federation requests for non-local users are invalid. (#1672) Application Service API No significant changes. Identity Service API No significant changes. Push Gateway API No significant changes. Room Versions No significant changes. Appendices Spec Clarifications Clarify timestamp specification with respect to leap seconds. (#1627) Fix various typos throughout the specification. (#1652) Internal Changes/Tooling Backwards Compatible Changes Add more CI checks for OpenAPI definitions and JSON Schemas. (#1656) Generate server-server OpenAPI definition. (#1657) Spec Clarifications Replace all mentions of Swagger by OpenAPI. (#1633) Fix enum types in JSON schemas. (#1634) Fix schema of m.mentions object. (#1635) Fix rendering of m.receipt event in Client-Server API. (#1637) Remove required fieldname in appservice Protocol definition. (#1646) Fix github action workflow responsible for releasing of @matrix-org/spec package. (#1648) Upgrade GitHub actions. (#1660)"
