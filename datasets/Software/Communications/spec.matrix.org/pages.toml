["https://spec.matrix.org/unstable/changelog/v1.12"]
title = "v1.12 Changelog | Matrix Specification"
description = """
Client-Server API Deprecations
Deprecate the server_name query parameter on POST /_matrix/client/v3/join/{roomIdOrAlias} and POST /_matrix/client/v3/knock/{roomIdOrAlias}, as per MSC4156. (#1933) Removed Endpoints
Remove references to device-specific push rules. (#1842) Remove the deprecated name attribute on HTML anchor elements, as per MSC4159. (#1870) Backwards Compatible Changes
Add 403 responses on GET /_matrix/client/v3/profile/{userId}/avatar_url and GET /_matrix/client/v3/profile/{userId}/displayname, as per MSC4170. (#1867) Add support for marking rooms as unread, as per MSC2867. (#1895, #1941) Add via query parameter on POST /_matrix/client/v3/join/{roomIdOrAlias} and POST /_matrix/client/v3/knock/{roomIdOrAlias}, as per MSC4156. (#1933) Add account locking, as per MSC3939. (#1934) Guest accounts can now download/thumbnail media from the new authenticated endpoints, as per MSC4189. (#1959) Spec Clarifications"""
full_description = "You're looking at an unstable version of this specification. Unstable specifications may change at any time without notice. Switch to the current stable release. Matrix Specification Changelog v1.12 v1.12 Changelog Git commithttps://github.com/matrix-org/matrix-spec/tree/v1.12 Release dateOctober 7, 2024 Checklistchecklist.md Client-Server API Deprecations Deprecate the server_name query parameter on POST /_matrix/client/v3/join/{roomIdOrAlias} and POST /_matrix/client/v3/knock/{roomIdOrAlias}, as per MSC4156. (#1933) Removed Endpoints Remove references to device-specific push rules. (#1842) Remove the deprecated name attribute on HTML anchor elements, as per MSC4159. (#1870) Backwards Compatible Changes Add 403 responses on GET /_matrix/client/v3/profile/{userId}/avatar_url and GET /_matrix/client/v3/profile/{userId}/displayname, as per MSC4170. (#1867) Add support for marking rooms as unread, as per MSC2867. (#1895, #1941) Add via query parameter on POST /_matrix/client/v3/join/{roomIdOrAlias} and POST /_matrix/client/v3/knock/{roomIdOrAlias}, as per MSC4156. (#1933) Add account locking, as per MSC3939. (#1934) Guest accounts can now download/thumbnail media from the new authenticated endpoints, as per MSC4189. (#1959) Spec Clarifications Rename and sort the modules in the feature profiles table for easier skimming. (#1855) Clarify that room avatars cannot be encrypted. (#1871) Document the acronyms and alternate names for the “Secrets” section. (#1875) Improve recommendation for how to form transaction IDs. (#1888) Clarify that the deprecated dont_notify and coalesce push rule actions MUST be ignored, not rejected. (#1890) Fix various typos throughout the specification. (#1892) Add missing references to m.set_displayname, m.set_avatar_url, and m.3pid_changes in capabilities table. (#1897) Clarify that the fallback login page calls window.matrixLogin.onLogin instead of window.onLogin. (#1899) Remove confusing description of restricted rooms with no valid conditions. (#1903) Clarify that window.matrixLogin.onLogin is called with the response body of POST /_matrix/client/v3/login. (#1905) Document the m.get_login_token capability, as per MSC3882. (#1908) Clarify that the User identifier object in POST /_matrix/client/v3/login contains additional properties that depend on the identification type. (#1909) Don’t mention that GET /_matrix/client/v3/profile/{userId} can return additional properties because this is true for almost every endpoint. (#1910) Improve wording of the unauthenticated media deprecation box. Contributed by @HarHarLinks. (#1916) Additional properties in GET /.well-known/matrix/client don’t have to be objects. (#1920) Document that the spec uses RFC 2119 keywords. Contributed by @HarHarLinks. (#1928) Specify Content-Type and Content-Disposition usage in the media repo, as per MSC2701 and MSC2702. (#1935) Additional keys in GET /_matrix/client/v3/capabilities don’t have to be objects. (#1945) Server-Server API Backwards Compatible Changes Add 403 response on GET /_matrix/federation/v1/query/profile, as per MSC4170. (#1867) Spec Clarifications Remove origin field from PDU example because it doesn’t exist in the schema anymore. (#1918) Document that the spec uses RFC 2119 keywords. Contributed by @HarHarLinks. (#1928) Fix required fields in GET /_matrix/key/v2/server response schema. (#1930) Use “server name” instead of “DNS name” to avoid confusion with the “DNS name” component of “server names” as defined in the appendices. (#1946) Application Service API Spec Clarifications Document that the spec uses RFC 2119 keywords. Contributed by @HarHarLinks. (#1928) Identity Service API Spec Clarifications Document that the spec uses RFC 2119 keywords. Contributed by @HarHarLinks. (#1928) Push Gateway API Spec Clarifications Document that the spec uses RFC 2119 keywords. Contributed by @HarHarLinks. (#1928) Room Versions Spec Clarifications Fix a formatting issue in state resolution v2. (#1896) Document that the spec uses RFC 2119 keywords. Contributed by @HarHarLinks. (#1928) Appendices Spec Clarifications Document that the spec uses RFC 2119 keywords. Contributed by @HarHarLinks. (#1928) Internal Changes/Tooling Spec Clarifications The Matrix.org Foundation no longer requires “real” or “legally identifiable” names in order to contribute to projects. (#1886, #1914) Document the removal changelog category. (#1907) Use dedicated fonts for better support of mathematical symbols. (#1919) Document that the spec uses RFC 2119 keywords. Contributed by @HarHarLinks. (#1928) Provide markdown checklists for changelogs under /changelog/$VERSION/checklist.md. (#1937, #1954) Add the deprecated field to properties of OpenAPI definitions and JSON Schemas. (#1940) Use relative permalink to redirect to latest changelog. (#1956)"
