["https://spec.matrix.org/unstable/identity-service-api"]
title = "Identity Service API | Matrix Specification"
description = 'The Matrix client-server and server-server APIs are largely expressed in Matrix user identifiers. From time to time, it is useful to refer to users by other (“third-party”) identifiers, or “3PID"s, e.g. their email address or phone number. This Identity Service Specification describes how mappings between third-party identifiers and Matrix user identifiers can be established, validated, and used. This description technically may apply to any 3PID, but in practice has only been applied specifically to email addresses and phone numbers.'
full_description = '''You're looking at an unstable version of this specification. Unstable specifications may change at any time without notice. Switch to the current stable release. Matrix Specification Identity Service API Identity Service API The Matrix client-server and server-server APIs are largely expressed in Matrix user identifiers. From time to time, it is useful to refer to users by other (“third-party”) identifiers, or “3PID"s, e.g. their email address or phone number. This Identity Service Specification describes how mappings between third-party identifiers and Matrix user identifiers can be established, validated, and used. This description technically may apply to any 3PID, but in practice has only been applied specifically to email addresses and phone numbers. General principles The purpose of an identity server is to validate, store, and answer questions about the identities of users. In particular, it stores associations of the form “identifier X represents the same user as identifier Y”, where identities may exist on different systems (such as email addresses, phone numbers, Matrix user IDs, etc). The identity server has some private-public keypairs. When asked about an association, it will sign details of the association with its private key. Clients may validate the assertions about associations by verifying the signature with the public key of the identity server. In general, identity servers are treated as reliable oracles. They do not necessarily provide evidence that they have validated associations, but claim to have done so. Establishing the trustworthiness of an individual identity server is left as an exercise for the client. 3PID types are described in 3PID Types Appendix. API standards The mandatory baseline for identity server communication in Matrix is exchanging JSON objects over HTTP APIs. HTTPS is required for communication. All POST and PUT endpoints, with the exception (for historical reasons) of POST /_matrix/identity/v2/account/logout, require the client to supply a request body containing a (potentially empty) JSON object. Clients should supply a Content-Type header of application/json for all requests with JSON bodies, but this is not required. Similarly, all endpoints require the server to return a JSON object. Servers must include a Content-Type header of application/json for all JSON responses. All JSON data, in requests or responses, must be encoded using UTF-8. Standard error response Any errors which occur at the Matrix API level MUST return a “standard error response”. This is a JSON object which looks like: { "errcode": "<error code>", "error": "<error message>" } The error string will be a human-readable error message, usually a sentence explaining what went wrong. The errcode string will be a unique string which can be used to handle an error message e.g. M_FORBIDDEN. There may be additional keys depending on the error, but the keys error and errcode MUST always be present. Some standard error codes are below: M_NOT_FOUND The resource requested could not be located. M_MISSING_PARAMS The request was missing one or more parameters. M_INVALID_PARAM The request contained one or more invalid parameters. M_SESSION_NOT_VALIDATED The session has not been validated. M_NO_VALID_SESSION A session could not be located for the given parameters. M_SESSION_EXPIRED The session has expired and must be renewed. M_INVALID_EMAIL The email address provided was not valid. M_EMAIL_SEND_ERROR There was an error sending an email. Typically seen when attempting to verify ownership of a given email address. M_INVALID_ADDRESS The provided third-party address was not valid. M_SEND_ERROR There was an error sending a notification. Typically seen when attempting to verify ownership of a given third-party address. M_UNRECOGNIZED The request contained an unrecognised value, such as an unknown token or medium. This is also used as the response if a server did not understand the request. This is expected to be returned with a 404 HTTP status code if the endpoint is not implemented or a 405 HTTP status code if the endpoint is implemented, but the incorrect HTTP method is used. M_THREEPID_IN_USE The third-party identifier is already in use by another user. Typically this error will have an additional mxid property to indicate who owns the third-party identifier. M_UNKNOWN An unknown error has occurred. Privacy Identity is a privacy-sensitive issue. While the identity server exists to provide identity information, access should be restricted to avoid leaking potentially sensitive data. In particular, being able to construct large-scale connections between identities should be avoided. To this end, in general APIs should allow a 3PID to be mapped to a Matrix user identity, but not in the other direction (i.e. one should not be able to get all 3PIDs associated with a Matrix user ID, or get all 3PIDs associated with a 3PID). Web browser clients It is realistic to expect that some clients will be written to be run within a web browser or similar environment. In these cases, the identity server should respond to pre-flight requests and supply Cross-Origin Resource Sharing (CORS) headers on all requests. When a client approaches the server with a pre-flight (OPTIONS) request, the server should respond with the CORS headers for that route. The recommended CORS headers to be returned by servers on all requests are: Access-Control-Allow-Origin: * Access-Control-Allow-Methods: GET, POST, PUT, DELETE, OPTIONS Access-Control-Allow-Headers: Origin, X-Requested-With, Content-Type, Accept, Authorization API Version check GET /_matrix/identity/versions Added in v1.1 Gets the versions of the specification supported by the server. Values will take the form vX.Y or rX.Y.Z in historical cases. See the Specification Versioning for more information. All supported versions, including patch versions, are reported by the server. Rate-limited: No Requires authentication: No Request No request parameters or request body. Responses Status Description 200 The versions supported by the server. 200 response Name Type Description versions [string] Required: The supported versions. { "versions": [ "r0.2.0", "r0.2.1", "v1.1" ] } Authentication Most endpoints in the Identity Service API require authentication in order to ensure that the requesting user has accepted all relevant policies and is otherwise permitted to make the request. Identity Servers use a scheme similar to the Client-Server API’s concept of access tokens to authenticate users. The access tokens provided by an Identity Server cannot be used to authenticate Client-Server API requests. Access tokens may be provided via a request header, using the Authentication Bearer scheme: Authorization: Bearer TheTokenHere. Clients may alternatively provide the access token via a query string parameter: access_token=TheTokenHere. This method is deprecated to prevent the access token being leaked in access/HTTP logs and SHOULD NOT be used by clients. Identity Servers MUST support both methods. [Changed in v1.11] Sending the access token as a query string parameter is now deprecated. When credentials are required but missing or invalid, the HTTP call will return with a status of 401 and the error code M_UNAUTHORIZED. GET /_matrix/identity/v2/account Gets information about what user owns the access token used in the request. Rate-limited: No Requires authentication: Yes Request No request parameters or request body. Responses Status Description 200 The token holder’s information. 403 The user must do something in order to use this endpoint. One example is an M_TERMS_NOT_SIGNED error where the user must agree to more terms. 200 response Name Type Description user_id string Required: The user ID which registered the token. { "user_id": "@alice:example.org" } 403 response Error Name Type Description errcode string Required: An error code. error string A human-readable error message. { "errcode": "M_TERMS_NOT_SIGNED", "error": "Please accept our updated terms of service before continuing" } POST /_matrix/identity/v2/account/logout Logs out the access token, preventing it from being used to authenticate future requests to the server. Rate-limited: No Requires authentication: Yes Request No request parameters or request body. Responses Status Description 200 The token was successfully logged out. 401 The token is not registered or is otherwise unknown to the server. 403 The user must do something in order to use this endpoint. One example is an M_TERMS_NOT_SIGNED error where the user must agree to more terms. 200 response {} 401 response Error Name Type Description errcode string Required: An error code. error string A human-readable error message. { "errcode": "M_UNKNOWN_TOKEN", "error": "Unrecognised access token" } 403 response Error Name Type Description errcode string Required: An error code. error string A human-readable error message. { "errcode": "M_TERMS_NOT_SIGNED", "error": "Please accept our updated terms of service before continuing" } POST /_matrix/identity/v2/account/register Exchanges an OpenID token from the homeserver for an access token to access the identity server. The request body is the same as the values returned by /openid/request_token in the Client-Server API. Rate-limited: No Requires authentication: No Request Request body OpenIdCredentials Name Type Description access_token string Required: An access token the consumer may use to verify the identity of the person who generated the token. This is given to the federation API GET /openid/userinfo to verify the user’s identity. expires_in integer Required: The number of seconds before this token expires and a new one must be generated. matrix_server_name string Required: The homeserver domain the consumer should use when attempting to verify the user’s identity. token_type string Required: The string Bearer. Request body example {} Responses Status Description 200 A token which can be used to authenticate future requests to the identity server. 200 response Name Type Description token string Required: An opaque string representing the token to authenticate future requests to the identity server with. { "token": "abc123_OpaqueString" } Terms of service Identity Servers are encouraged to have terms of service (or similar policies) to ensure that users have agreed to their data being processed by the server. To facilitate this, an identity server can respond to almost any authenticated API endpoint with an HTTP 403 and the error code M_TERMS_NOT_SIGNED. The error code is used to indicate that the user must accept new terms of service before being able to continue. All endpoints which support authentication can return the M_TERMS_NOT_SIGNED error. When clients receive the error, they are expected to make a call to GET /terms to find out what terms the server offers. The client compares this to the m.accepted_terms account data for the user (described later) and presents the user with option to accept the still-missing terms of service. After the user has made their selection, if applicable, the client sends a request to POST /terms to indicate the user’s acceptance. The server cannot expect that the client will send acceptance for all pending terms, and the client should not expect that the server will not respond with another M_TERMS_NOT_SIGNED on their next request. The terms the user has just accepted are appended to m.accepted_terms. m.accepted_terms A list of terms URLs the user has previously accepted. Clients SHOULD use this to avoid presenting the user with terms they have already agreed to. Event type: Message event Content Name Type Description accepted [string] The list of URLs the user has previously accepted. Should be appended to when the user agrees to new terms. Examples { "content": { "accepted": [ "https://example.org/somewhere/terms-1.2-en.html", "https://example.org/somewhere/privacy-1.2-en.html" ] }, "type": "m.accepted_terms" } GET /_matrix/identity/v2/terms Gets all the terms of service offered by the server. The client is expected to filter through the terms to determine which terms need acceptance from the user. Note that this endpoint does not require authentication. Rate-limited: No Requires authentication: No Request No request parameters or request body. Responses Status Description 200 The terms of service offered by the server. 200 response Name Type Description policies {string: Policy Object} Required: The policies the server offers. Mapped from arbitrary ID (unused in this version of the specification) to a Policy Object. Policy Object Name Type Description version string Required: The version for the policy. There are no requirements on what this might be and could be “alpha”, semantically versioned, or arbitrary. <Other properties> Internationalised Policy The policy information for the specified language. Internationalised Policy Name Type Description name string Required: The translated name of the policy. url string Required: The URL, which should include the policy ID, version, and language in it, to be presented to the user as the policy. URLs should have all three criteria to avoid conflicts when the policy is updated in the future: for example, if this was “https://example.org/terms.html" then the server would be unable to update it because the client would have already added that URL to the m.accepted_terms collection. { "policies": { "privacy_policy": { "en": { "name": "Privacy Policy", "url": "https://example.org/somewhere/privacy-1.2-en.html" }, "fr": { "name": "Politique de confidentialité", "url": "https://example.org/somewhere/privacy-1.2-fr.html" }, "version": "1.2" }, "terms_of_service": { "en": { "name": "Terms of Service", "url": "https://example.org/somewhere/terms-2.0-en.html" }, "fr": { "name": "Conditions d'utilisation", "url": "https://example.org/somewhere/terms-2.0-fr.html" }, "version": "2.0" } } } POST /_matrix/identity/v2/terms Called by a client to indicate that the user has accepted/agreed to the included set of URLs. Servers MUST NOT assume that the client will be sending all previously accepted URLs and should therefore append the provided URLs to what the server already knows has been accepted. Clients MUST provide the URL of the policy in the language that was presented to the user. Servers SHOULD consider acceptance of any one language’s URL as acceptance for all other languages of that policy. The server should avoid returning M_TERMS_NOT_SIGNED because the client may not be accepting all terms at once. Rate-limited: No Requires authentication: Yes Request Request body Name Type Description user_accepts [string] Required: The URLs the user is accepting in this request. Request body example { "user_accepts": [ "https://example.org/somewhere/terms-2.0-en.html" ] } Responses Status Description 200 The server has considered the user as having accepted the provided URLs. 200 response {} Status check GET /_matrix/identity/v2 Checks that an identity server is available at th'''
