full_description = "Matrix Specification Changelog v1.13 v1.13 Changelog Git commithttps://github.com/matrix-org/matrix-spec/tree/v1.13 Release dateDecember 19, 2024 Checklistchecklist.md Client-Server API New Endpoints Add POST /_matrix/client/v3/rooms/{roomId}/report, as per MSC4151. (#1938, #2028) Backwards Compatible Changes Add error codes to requestToken endpoints, as per MSC4178. (#1944) Remove reply fallbacks, as per MSC2781. (#1994) Clarify the allowed HTTP methods in CORS responses, as per MSC4138. (#1995, #2011) Add new M_USER_SUSPENDED error code behaviour, as per MSC3823. (#2014) Spec Clarifications The reason parameter in POST /_matrix/client/v3/rooms/{roomId}/report/{eventId} can be omitted instead of left blank, as per MSC2414. (#1938) Correct OpenAPI specification for query parameters to GET /_matrix/client/v3/thirdparty/location/{protocol} endpoint. (#1947) Sort VoIP events semantically. (#1967) Clarify that servers must forward custom keys in PusherData when sending notifications to the push gateway. (#1973) Clarify formats of string types. (#1978, #1979, #1980) Clarify that the async upload endpoint will return 404 in some cases. (#1983) Remove distinction between StateFilter and RoomEventFilter. (#2015) Add hyperlinks throughout the specification. (#2016) Use json instead of json5 for syntax highlighting. (#2017) Specify order that one-time keys are issued by /keys/claim, as per MSC4225. (#2029) Server-Server API Backwards Compatible Changes Make ACLs apply to EDUs, as per MSC4163. (#2004) Spec Clarifications Add 403 error response to /_matrix/federation/v1/state_ids/{roomId}. (#1926) Application Service API Backwards Compatible Changes Allow sending ephemeral data to application services, as per MSC2409. (#2018) Identity Service API No significant changes. Push Gateway API Spec Clarifications Document the schema of PusherData. (#1968) The path of HTTP pusher URLs is fixed to /_matrix/push/v1/notify. (#1974) Room Versions Spec Clarifications Clarify rule 4.3.1 of the auth rules in room version 11 to state which event’s sender the state_key needs to match. (#2024) Appendices Spec Clarifications Remove note about reference implementations. (#1966) Internal Changes/Tooling Spec Clarifications Add x-weight property for sorting events rendered with the event-group shortcode. (#1967) Enforce consistent vertical spacing between paragraphs in endpoint definitions. (#1969, #2005) Remove boxes/added-in-paragraph shortcode. (#1970) Remove withVersioning parameter of rver-fragment shortcode. (#1971) Remove span element from added-in and changed-in shortcodes. (#1972) Fix formatting of added-in and changed-in shortcodes by using % delimiter. (#1975) Remove CSS workaround for scroll-anchoring. (#1976) Rename custom-formats.yaml to string-formats.yaml and update its docs. (#1977) Fix relative URLs when serving the specification with a custom baseURL. (#1984, #1997) Rename .htmltest.yaml to .htmltest.yml. (#1985) Improve the JS script to highlight the current ToC entry. (#1991, #2002) Upgrade docsy to 0.11.0 and hugo to 0.139.0. (#1996, #2007) Improve the quality of the rendered diagrams (#1999) Update the Inter font and allow the browser to render the page before it is loaded (#2000) Use a proper Matrix favicon (#2001) Clean up unused CSS classes in openapi/render-operation partial. (#2003) Fix changed-in partial when used with multiple paragraphs. (#2006) Optimize generated CSS by removing unused selectors. (#2008) Remove trailing slash on void HTML elements. (#2009) Remove type and language attributes of script element. (#2021) Change the accessible role of info boxes to note. (#2022)"
