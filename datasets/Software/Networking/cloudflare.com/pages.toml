["https://cloudflare.com/case-studies/zenn"]
title = "Zenn & Cloudflare | Customer Story | Cloudflare"
description = "Classmethod protects the Japanese information-sharing platform Zenn from a surge in DDoS attacks while maintaining reliable user experiences and cutting costs"
full_description = "Based in Japan, Zenn is an information-sharing platform that hosts technical blogs written by engineers. Driven by a mission of “rewarding engineers for sharing knowledge,” Zenn enables engineers to easily contribute their unique insights to the IT community. Zenn is run by Classmethod — a leading cloud integrator and service provider in Japan. “Our top priority is to deliver a consistent writing experience without compromising performance or disrupting service continuity,” says Yusuke Wada, an engineer at Classmethod. Unfortunately, a rise in cyber attacks has threatened those consistent experiences. Classmethod today is focused on strengthening security to enhance platform reliability. The company needs an adaptable platform that can help them respond rapidly to the latest threats and maintain application performance. “Writing technical articles is a very labor-intensive task. Solid application performance is critical for the writing experience — and for the reading experience,” says Wada. “If performance issues sour the experience during output, it has a direct impact on repeat business. We see sudden increases in load and DDoS attacks as threats to performance.” In February 2024, a DDoS attack disrupted the Zenn platform’s services. “Performance declined, which had a negative impact on both the writing and reading experience,” says Wada. “The attack also significantly increased cloud infrastructure costs.” The Classmethod team needed an alternative to the tools available through their cloud provider. “DDoS defense capabilities were available for the cloud infrastructure, but their high cost made them impractical for us given the scale of our services,” says Wada. After considering other solutions, the team homed in on Cloudflare, which was top of mind for network security. “We chose Cloudflare because of the straightforward setup, affordable fixed costs, and low-risk rollout,” says Wada. The presence of multiple Cloudflare data centers in Japan was another plus. Classmethod would be able to use security capabilities running in those data centers without adding latency."
