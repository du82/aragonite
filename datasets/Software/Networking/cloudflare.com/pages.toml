title = "Leroy Merlin & Cloudflare | Customer Story | Cloudflare"
description = "Global home-improvement retailer Leroy Merlin blocks millions of attacks per month and saves R$1 million with Cloudflare"
full_description = "Headquartered in France, Leroy Merlin is a leader in home-improvement retail with a strong presence in countries across Europe, Brazil, and South America. The company has had a presence in Brazil since 1998, where there are now 53 physical stores plus several smaller Leroy Merlin Express locations. Leroy Merlin is an omnichannel retailer offering a complete solution for home transformation. Today, Leroy Merlin is focused on expanding their digital presence in Brazil. While 12% of sales in Brazil are currently generated through the e-commerce platform, the leadership team is working to increase that number to 30% over the next three years. As Leroy Merlin’s digital presence has grown in Brazil, the company has been increasingly targeted by cyber attacks. The company experiences DDoS and malicious bots — and in some cases, attackers try to change prices on the company’s website. In fact, Leroy Merlin must guard against multiple types of fraud — including both internal and external fraudulent activities. “Fraud is a key challenge in our industry,” says Fabiana Tanaka, CISO for cyber security and data privacy director at Leroy Merlin. “We need to protect our e-commerce platform, physical stores, and even our warehouses, where we run our logistics and supply chain processes. We have to prevent attacks but also improve our incident response and resilience.” In selecting solutions that can combat threats, the Leroy Merlin team wanted to avoid increasing complexity. “Employees need to be comfortable using the technology,” says Tanaka. “We need to create an efficient environment for our employees to handle security.” The Leroy Merlin team in Brazil began working with Cloudflare to address cyber security challenges. “Cloudflare is a strong partner,” says Tanaka. “We are working together to improve the maturity of cyber security for our digital platform.” Leroy Merlin uses Cloudflare DDoS protection and bot management to counter some of the most prevalent threats facing the company. DDoS protection mitigates attacks from the nearest location, without having to send traffic to distant scrubbing centers. Meanwhile, Cloudflare bot management draws from extensive threat intelligence from the Cloudflare network and uses anomaly detection capabilities to stop malicious bot activity."
year_published = 2025
