["https://cloudflare.com/galileo"]
title = "Project Galileo  | Cloudflare"
description = "Through Project Galileo, Cloudflare provides free cyber security services to organizations supporting the arts, human rights, journalism, and democracy."
full_description = "If you are an organization working in human rights, civil society, journalism, or democracy, you can apply for Project Galileo to get free cyber security protection from Cloudflare. Founded in 2014, Project Galileo is our response to devastating cyber attacks launched against important yet vulnerable targets, like humanitarian organizations, civil society, and human rights defenders. Through Project Galileo, Cloudflare provides free, robust security to 2,900+ vulnerable Internet properties that are the targets of DDoS and other cyber attacks. The Internet is a powerful tool for spreading and expanding ideas. When journalists, social activists, and minority groups are flooded with malicious traffic in an attempt to knock them offline, the Internet stops fulfilling its promise. Such organizations often face attacks from powerful and entrenched opponents, yet operate on limited budgets. We offer services through Project Galileo to any proposed recipient if brought to us by or approved by any one of our trusted partners. Such inclusion does not require and should not be understood as endorsement by all our diverse partner organizations. Any qualified vulnerable public interest site can seek participation in Project Galileo. Examples of participants include, but are not limited to, minority rights organizations, human rights organizations, independent media outlets, arts groups, and democracy protection programs. Many of our participants are under threat of persecution. To help keep participants safe from potential backlash, Cloudflare will not reveal sites involved in Project Galileo without explicit permission. We are grateful the following groups were willing to share their stories. Cloudflare partners with respected free speech, public interest, and civil society organizations to identify at-risk websites eligible for participation in Project Galileo. By relying on these informed decision-makers, we ensure the program benefits from civil society expertise and is not influenced by our biases."
