["https://cloudflare.com/case-studies/money-forward"]
title = "Money Forward & Cloudflare | Customer Story | Cloudflare"
description = "Market-leading Japanese fintech SaaS Money Forward chose Cloudflare to encrypt its web traffic and secure its websites, applications, and infrastructure."
full_description = 'Founded in 2012, Tokyo-based Money Forward is a fintech/SaaS developer dedicated to creating fair and open financial platforms that provide essential services to businesses, individuals, and institutions. Its product offerings range from personal financial management services for individual consumers — like Money Forward ME — to the SaaS application for back office operations with its online back office service Money Forward Cloud. The Money Forward Fintech Platform provides comprehensive services for financial institutions. Money Forward offers over 60 services for both corporate and individual clients. In corporate services, the number of paying customers exceeds 340,000 — a number that has grown by 20%. The user base for "Money Forward ME," a financial management service for individuals, has surpassed 16 million. A key characteristic of Money Forward is its extensive user base, encompassing both corporate and individual users. The company is expanding its development operations into Vietnam. Following the rapid growth of its user base and product portfolio, Money Forward needed to upgrade its existing performance and security tooling. The company’s infrastructure — particularly its web application firewall (WAF) — lacked the resilience, capacity, and scalability to handle its steadily growing traffic and security requirements. These shortcomings became especially problematic during periods of increased financial activity and high transactional volumes at the beginning and end of every month. With its existing WAF unable to cope, Money Forward’s origin servers were exposed to a potentially dangerous combination of security and availability issues. “As we grew, regular traffic surges began to overwhelm our infrastructure,” explains Tsukasa Takada from Money Forward’s Corporate Information and Security Office. “To keep everything running, every month we had to temporarily reconfigure our WAF or take it offline altogether to deal with the increased bandwidth demands.”'
