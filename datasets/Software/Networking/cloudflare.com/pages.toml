["https://cloudflare.com/press-kit"]
title = "Cloudflare Press Kit | Cloudflare"
description = "Cloudflare Press Kit"
full_description = "Matthew Prince is co-founder and CEO of Cloudflare. Cloudflare’s mission is to help build a better Internet. Today the company runs one of the world's largest networks, which spans more than 300 cities in over 100 countries. Matthew is a World Economic Forum Technology Pioneer, a member of the Council on Foreign Relations, and winner of the 2011 Tech Fellow Award. Matthew holds an MBA from Harvard Business School where he was a George F. Baker Scholar and awarded the Dubilier Prize for Entrepreneurship. He is a member of the Illinois Bar, and earned his J.D. from the University of Chicago and B.A. in English Literature and Computer Science from Trinity College. He’s also the co-creator of Project Honey Pot, the largest community of webmasters tracking online fraud and abuse. Michelle Zatlyn is co-founder, President, and COO of Cloudflare (NYSE: NET), the leading connectivity cloud company on a mission to help build a better Internet. She currently serves on the board of directors for Atlassian and the World Economic Forum Young Global Leaders Foundation. Prior to co-founding Cloudflare, Michelle held positions at Google and Toshiba and launched two successful startups. Michelle has previously been included in Fortune’s 40 Under 40, named a “2024 Changemaker” by CNBC, and was recognized as a 2024 Top Female Founder by Inc. Magazine. She holds a B.S. degree, with distinction, from McGill University, and an MBA from Harvard Business School, where she was awarded the Dubilier Prize for Entrepreneurship. Thomas J. Seifert is the Chief Financial Officer of Cloudflare. Seifert comes to Cloudflare from Symantec, a leading cybersecurity company, where he served as advisor from December 2016 until March 2017. Seifert served as the Chief Financial Officer and Executive Vice President of Symantec from March 2014 to December 2016. At Symantec, he managed financial operations, corporate accounting, treasury, tax, investor relations, and business development. Prior to Symantec he served as Executive Vice President and Chief Financial Officer of Brightstar Corp., a wireless distribution and services company, from December 2012 to March 2014. From October 2009 until August 2012, Seifert was Senior Vice President and Chief Financial Officer at Advanced Micro Devices, Inc., a semiconductor company. From October 2008 to August 2009, he served as Chief Operating Officer and Chief Financial Officer of Qimonda AG, a German memory chip manufacture. In this role, he was involved in the formation and IPO of the company. He also held executive positions at Infineon AG, White Oak Semiconductor, and Siemens AG. He has been an independent director of IPG Photonics Corporation since June 3, 2014."
