["https://cloudflare.com/trust-hub/gdpr"]
title = "Cloudflare and GDPR compliance | Cloudflare"
description = "This paper outlines policies and procedures that guide how we manage customer and end-user data on our systems — and how we address government and other legal requests for data."
full_description = "Cloudflare is a privacy-first company. As such, the General Data Protection Regulation (“GDPR”) represents many steps we were already taking. We do not sell personal data we process, or use it for any purpose other than delivering our services. In addition, we let people access, correct, and delete their personal information, and give our customers control over the information passing through our network. Cloudflare is a security, performance, and reliability company headquartered in the United States with global operations including five offices in Europe that delivers a broad range of network services to businesses of all sizes and in all geographies. We help make our customers’ websites and Internet applications more secure, enhance the performance of their business-critical applications, and eliminate the cost and complexity of managing individual network hardware. Cloudflare's Global Network – which is powered by Edge servers in more than 300 cities around the world, as described here – serves as the foundation on which we can rapidly develop and deploy our products for our customers. The types of personal data Cloudflare processes on behalf of a customer depend on which Cloudflare services are implemented. For our most popular Core Application Layer Services, Cloudflare does not store customer content, nor do we have any control of the data our customers choose to transmit, route, switch, and cache through our Global Network. In a limited number of cases, Cloudflare products can be used for storage of content. Regardless of what Cloudflare services they use, however, our customers are fully responsible for their own compliance with applicable law and their independent contractual arrangements in connection with the data they choose to transmit, route, switch, cache, or store through the Cloudflare Global Network. For our Core Application Layer Services, the vast majority of data that transits Cloudflare’s network stays on Cloudflare’s Edge servers. Metadata about this activity is processed on behalf of our customers in our data centers in the United States and Europe."
