title = "Cloudflare for Campaigns - United States of America | Cloudflare"
description = "Secure your candidate's election website — and your team. Special offer for US federal candidates."
full_description = "Cloudflare for Campaigns offers a suite of products to safeguard and optimize the performance of your candidate's web presence — and to protect your team's internal data. Qualified federal election candidates are eligible to receive a package of products free of charge, proudly provided by Cloudflare in partnership with the nonprofit Defending Digital Campaigns. Campaign finance rules generally prohibit companies like Cloudflare from providing free services to political campaigns. However, a 2019 ruling by the Federal Election Commission makes exceptions for cyber security services for candidates who meet certain criteria because of the threat of foreign attacks. Cloudflare partners with Defending Digital Campaigns to qualify candidates who meet FEC criteria. Cloudflare provides many campaigns — local, federal, and international — with a wide range of services at costs that fit within most budgets. If your campaign does not qualify for the free suite, there is likely one you can afford. In addition to Cloudflare for Campaigns, Cloudflare provides free services to US state and local government election websites through the Athenian Project, and to many organizations spanning the arts, human rights, civil society, journalism, and democracy through its initiative Project Galileo. In submitting this form, you agree to receive information from Cloudflare related to our products, events, and special offers. You can unsubscribe from such messages at any time. We never sell your data, and we value your privacy choices. Please see our Privacy Policy for information."
