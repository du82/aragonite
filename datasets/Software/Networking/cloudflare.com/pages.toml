["https://cloudflare.com/case-studies/alpargatas"]
title = "Alpargatas & Cloudflare | Customer Story | Cloudflare"
description = "Cloudflare optimizes performance and prevents fraud for Havaianas and other iconic brands"
full_description = "Alpargatas is a group of globally-recognized consumer brands best known for their iconic Havaianas flip-flops. The Alpargatas Group is headquartered in Brazil, but operates over 40 ecommerce platforms that serve customers around the world, including Europe, Latin America, and the United States. Alpargatas owns many highly-recognizable brands in the consumer goods industry. The success of these brands depends on ensuring a positive user experience for customers around the world. “At Alpargatas, we are committed to delight the world with amazing brands, brands that convey lightness and joy to the everyday lives of our consumers,” says Felipe Bonomo, Executive Manager of Information Security and Privacy at Alpargatas. Serving a global customer base across multiple ecommerce channels requires solutions that ensure that user traffic is quickly routed to the appropriate platform. Additionally, Alpargatas needs to protect their highly-visible brands against fraud and other potential security threats Cloudflare’s global network is essential to ensure the availability and performance of Alpargatas’ ecommerce platforms. With over 330 locations worldwide, the Cloudflare network is uniquely positioned to protect Alpargatas’ ecommerce platforms and help Alpargatas provide a better connectivity experience to their customer base. Alpargatas uses Cloudflare Workers and Argo Smart Routing to manage and improve routing across their complex infrastructure. “At Alpargatas, we use Workers to manage access to our ecommerce solutions around the globe,” Bonomo says. “With Workers, we can precisely manage traffic without harming application performance or the user experience.” Alpargatas manages high-visibility brands, including Havaianas and Rothys, a sustainable, North American footwear brand. These are common targets for cyber attacks designed to disrupt services or engage in fraudulent activities against the company. Often, these attacks involve using malicious bots to purchase and resell goods, deplete inventory, or perform credential stuffing attacks against customer accounts."
