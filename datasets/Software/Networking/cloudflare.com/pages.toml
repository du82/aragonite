["https://cloudflare.com/learning/network-layer/enterprise-networking"]
title = "What is enterprise networking? | Cloudflare"
description = "An enterprise network privately connects branch offices, internal data centers, and employee devices. Learn why enterprise networking is rapidly evolving."
full_description = "An enterprise network privately connects branch offices, internal data centers, and employee devices. Today, enterprise networking is rapidly evolving. A network is a group of connected computers, and an enterprise network is such a group constructed to serve the needs of a large business. Enterprise networks are composed of local area networks (LANs) that in turn connect to wide area networks (WANs) and the cloud. In an enterprise setting, data centers, branch offices, public and private clouds, Internet of Things (IoT) devices, and the individual employees of an organization all need reliable network connections. These connections enable enterprises to exchange data, run business processes, and analyze what happens on the network — essentially, the network makes running the business possible. Unlike the Internet, enterprise networks are not open to anyone who wants to connect. Enterprise networks limit connectivity to specific users, devices, and facilities. They often encrypt the data that passes over them by using virtual private networks (VPNs) or Transport Layer Security (TLS) encryption. Enterprise networking is also distinct from other types of networking because of its scale. The average person may have access to a home LAN that connects a few devices to the Internet via a single router. But enterprises run internal networks that connect thousands of devices to each other and to the Internet. (Some enterprise networks are large enough and connected enough to be assigned an autonomous system number, or ASN — learn more about ASNs.) For many years, the main focus for enterprise networks was connecting everyone and everything to the on-premise, self-hosted centralized data centers where data was saved and applications ran. This access was provided by connecting users and devices to the LAN in the corporate office. Each office's LAN was connected to the other offices via a large enterprise WAN, usually constructed via dedicated multiprotocol label switching (MPLS) routes."
