["https://cloudflare.com/the-net/multichannel-phishing"]
title = "theNET | Phishing keeps evolving | Cloudflare"
description = "Phishing, like any type of cyber attack, exploits the weakest link. However, unlike many other attacks, phishing exploits human behavior rather than technical vulnerabilities. Whether you are booking a trip, responding to a Zoom invite, or simply checking email — everyone online is a target."
full_description = "Phishing, like any type of cyber attack, exploits the weakest link. However, unlike many other attacks, phishing exploits human behavior rather than technical vulnerabilities. Whether you are booking a trip, responding to a Zoom invite, or simply checking email — everyone online is a target. As described in the latest Phishing Threats Report, based on data from approximately 13 billion emails, attackers focus their efforts on appearing authentic: They attempt to impersonate the brands we know and rely upon, and they exploit trust in normal ‘course of business’ interactions. Attackers have become relentless when it comes to crafting authentic-looking messages to evade common email security. Here are several key trends about the specific tactics they are using, along with strategies organizations can use to prevent those tactics from causing a breach. Deceptive links are the #1 phishing threat category — appearing in 35.6% of threat detections. Since the display text for a link (hypertext) in HTML can be arbitrarily set, attackers can make a URL appear as if it links to a benign site when, in fact, it is actually malicious. Most organizations have implemented some form of cyber security awareness training to remind their users to be aware of links in suspicious work emails. However, attackers are increasingly casting their phishing lures into channels where users are less cautious about where they click. In an approach called “multichannel” phishing, attacks may start with one email, but continue on to SMS/text messaging, IM, social media, cloud collaboration services, and other Internet-connected tools not typically protected by anti-phishing controls. For example, one multichannel phishing campaign involved the highly-publicized “0ktapus” attack targeting more than 130 organizations. Individuals were sent text messages redirecting them to a phishing site impersonating the popular single sign-on (SSO) service, Okta. Ultimately, nearly 10,000 credentials were stolen."
year_published = 2025
