["https://cloudflare.com/resource-hub/?resourcetype=Whitepaper"]
title = "Resource Hub | Cloudflare"
description = "SaaS providers need to extend their service beyond their own domains to those of their end customers. Cloudflare for SaaS lets providers give each end customer SSL certificate issuance, traffic routing, and advanced customization."
full_description = "Cloudflare provides Security, Performance, and Reliability for anything connected to the Internet. Refer to our latest resources to learn how you can leverage our integrated global cloud network. SaaS providers need to extend their service beyond their own domains to those of their end customers. Cloudflare for SaaS lets providers give each end customer SSL certificate issuance, traffic routing, and advanced customization. Architectures of how customers can protect and secure inbound and outbound traffic for their public, Internet-facing networks with Cloudflare. This guide outlines how to use Cloudflare’s ZTNA service, Cloudflare Access, to protect your self-hosted and SaaS applications, covering technical architecture and policy creation in context of specific use cases. Use Cloudflare to provide a secure, high-performance solution for both fixed-location and roaming connected devices. Key features include mutual TLS, API security, DDoS protection, and content cache. In this implementation guide we will be focusing on the L7 / Application Layer security for HTTP/S requests targeting proxied hostnames, including the first connection between client and Cloudflare. Learn how to use a SASE platform to ensure all access into, and data downloaded from SaaS applications is secured leveraging device, identity and network information. Durable Objects allow you to scale infinitely by sharding your application at the resource-level. This document describes an architectural pattern to design your control and data planes for resilient and performant applications. Use Cloudflare's Email Security to protect your Microsoft 365 email inbox from phishing and malware attacks. This guide explains how to set up Cloudflare's Web Application Firewall in production across multiple zones and apps. It focuses on enterprise features, like the account level WAF, and includes tips for deploying rulesets, handling exceptions, and reducing maintenance. Government departments and agencies need to protect their users when they access the Internet. Protective DNS allows a simple solution to block traffic from reaching malicious sites and alerts security organizations when incidents occur."
