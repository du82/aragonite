["https://cloudflare.com/case-studies/q2"]
title = "Q2 | Customer Video | Cloudflare"
description = "Q2 and Cloudflare | Case Study and Customer Video"
full_description = 'Q2 began with the radical idea to simplify and integrate the banking experience across mobile, online, and voice channels. From its founding in 2005, the company has grown into a financial industry powerhouse, fueling the digital banking experiences of one out of 10 consumers in the US. Thirty-five percent of the country’s top 100 banks rely on Q2’s digital banking and lending services. With $500 million in revenue in 2021, Q2 is planning for explosive growth as consumers expect the convenience of banking and borrowing from anywhere and at any time. “Availability is the expectation that we proudly wear for our clients,” says Jordan Hager, vice president of hosting architecture at Q2. “With the pandemic’s stimulus payments and Paycheck Protection Program loan activity, the role we play in our customers’ ability to access money in a time of need really came to light." Q2 shifted to a distributed cloud environment to improve agility, and the company needed to ensure adequate security and availability for their Internet-facing applications. “Operating across multiple cloud providers unlocks innovation, and our customers assume that we’re doing this securely and with the same high availability that we’ve delivered through our private data centers,” says Hager. Q2 not only needed to protect and scale, but also assure the highest levels of availability as the company supported more financial clients and their customers. “Uptime is critical not just for us and our customers, but ultimately the end users who entrust in our financial platforms,” says Joshua Pena, principal security architect at Q2. “There are over 19 million global users of our online banking product who rely on our technology to navigate their financial lives.” Cloudflare Magic Transit serves as the front door of Q2’s network, protecting its cloud-hosted and on-premise data centers against even the largest and most sophisticated DDoS attacks. Magic Transit also accelerates Q2’s application traffic, with Cloudflare’s built-in Load Balancing, Next-Generation Firewall Services, and Content Caching to improve the customer experience.'
