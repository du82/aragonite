["https://cloudflare.com/case-studies/ncr"]
title = "NCR | Cloudflare Customer Video | Cloudflare"
description = "NCR and Cloudflare | Video Testimonial"
full_description = "With a storied history of innovation, NCR has been at the forefront of retail systems for more than 100 years. From the earliest cash registers to today’s contactless checkout, NCR is a global leader in software for retail, hospitality, payments and banking. A customer-first focus and a strong foundation of information security have helped NCR earn the trust of its customers and their consumers. Whether you are buying the perfect puffer jacket, picking up takeout from your favorite restaurant or buying crypto at an ATM, chances are NCR is behind your digital interaction. “At NCR, our mission is to convert daily transactions into meaningful relationships with our customers,” says Alok Kumar, CISO, Retail & Payments at NCR. But as the pandemic accelerated digital transformation of sectors such as banking, retail and restaurants, so has online fraud. As the threat of cyberattacks increases, NCR has continued to advance its digital protections that could otherwise chip away at customer confidence and result in higher costs for everyone. NCR relies on a portfolio of Cloudflare solutions to protect its retail, hospitality, payments and banking customers from online fraud and business disruption while providing a better consumer experience. With Cloudflare, NCR can help guard against brute-force attacks, malicious bots and DDoS attacks. “Cloudflare was really attractive because it provides really sophisticated controls against attacks but does so in the cloud,” says Bob Varnadoe, CISO at NCR. “The security team isn’t responsible for managing infrastructure, so they are able to focus on doing higher value security work.” Cloudflare Bot Management Service enables NCR to detect and block malicious bots at scale, helping to protect customers against automated attacks and lowering fraud chargebacks from payment card companies. “When we deployed Cloudflare, we were able to prevent 80 to 90 percent of brute-force attacks–and that was right out of the box.” With Cloudflare SSL for SaaS, NCR can provide its banking, retail, payments and hospitality customers with a branded visitor experience while extending security and performance benefits. Cloudflare Web Application Firewall offers protection for NCR’s customers against expanding attack surfaces, including advanced malware, zero-day vulnerabilities and the growing risk of attacks on APIs."
