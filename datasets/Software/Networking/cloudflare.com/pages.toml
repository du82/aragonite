title = "Sage & Cloudflare | Customer Video | Cloudflare"
description = "Sage leverages Cloudflare to improve application performance and security, enhance product development, secure user data, and streamline their digital footprint"
full_description = "Sage is a leader in accounting, financial, HR, and payroll technology for small and mid-sized businesses (SMBs). Its technology automates accounting, payroll and payment practices. Supporting millions of businesses across 21 countries, Sage helps SMBs thrive in a complex digital landscape. The Sage ecosystem allows entrepreneurs to offload their administrative processes and free up time and resources to focus on core business objectives. Sage’s purpose is to knock down barriers so everyone can thrive and good security built into the products from the outset is the foundation of this. As providers of cloud-based financial and business management tools, Sage is responsible for the security of their clients’ financial information. It is a charge they take seriously, especially as online threats become more sophisticated and automated threats increase in frequency. “A key cybersecurity focus is the rise of criminal groups that try to hold companies to ransom by making data unavailable or simply by profiting from stolen data,” says Sage Chief Information Security Officer (CISO), Gustavo Zeidan. “Our challenge is to protect our customers’ data, as well as their own customers’ data, by staying ahead in technology evolution and anticipating changes in the threat landscape — always monitoring the environment and ensuring that Sage and our customers’ data stay secure.” As Sage’s product portfolio grew, so did their need to secure and integrate their new offerings without hindering development efforts or user access to financial tools and information. “We are constantly evolving our business processes and technology, and a significant part of that initiative involved a strong push towards a Zero Trust network architecture,” Zeidan explains. “We have been consistently and relentlessly decommissioning legacy ways of working and old technologies such as VPN and modernising how our business colleagues and development teams use technology to deliver their work.”"
