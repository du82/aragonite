["https://cloudflare.com/case-studies/genuine-parts-company"]
title = "GPC & Cloudflare | Customer Video | Cloudflare"
description = "Cloudflare gives Genuine Parts Company a single application security solution across its global digital footprint, reducing business risk and costs while enhancing the customer experienc"
full_description = "Since its inception in 1928, Genuine Parts Company has sold a wide variety of automotive replacement parts, industrial parts, and related supplies to a diverse customer base of individuals and businesses.The company’s high-profile brands include NAPA AUTO PARTS, Traction Heavy Duty Parts, Motion NA, and Motion Asia Pacific. A Fortune 200 company, Genuine Parts Company employs more than 53,000 people worldwide and markets its products both online and through brick-and-mortar stores. Online sales are an increasingly important channel, and the company operates more than 900 ecommerce websites. According to Damian Apone, global director of governance, risk, compliance, and security at Genuine Parts Company, the company’s primary security challenges revolved around effective attack surface management. The team couldn’t tell how many bot attacks and DDoS attacks were occurring globally. In addition, there was no visibility into how many attacks were prevented. The company had a web application security service, but it did not deliver the level of insight Genuine Parts Company needed. In addition, the security service ran in multiple regionally siloed instances, making it difficult to manage centrally. “We were paying a lot of money, but we had no visibility into our global digital footprint,” Apone explains. “We didn’t have any information on how or when we were being attacked and we had no idea who was targeting us.” The security team opted to move to Cloudflare not only because of its exceptional protection for websites and applications, but also because Cloudflare provides a comprehensive view of attacks. With Cloudflare’s Bot Management, DDoS mitigation, Web Application Firewall (WAF), and Rate Limiting, the security team now has the visibility they need to achieve robust surface attack management. Cloudflare’s Security Center console depicts Genuine Parts Company’s attack surface visually to help the team understand attack types, associated vulnerabilities, and risk levels. This visibility enables team members to quickly see which attacks represent a serious threat so they can marshal their defensive resources in the most effective and efficient manner."
year_published = 2025
