["https://cloudflare.com/case-studies/indeed"]
title = "Indeed & Cloudflare | Customer Story | Cloudflare"
description = "Global job matching and hiring platform Indeed reduces technical debt, secures employee and contractor access, and protects confidential information in Cloudflare’s connectivity cloud"
full_description = 'Indeed is the world’s #1 job site. Founded in 2004 and based in Austin, Texas, Indeed has over 15,000 employees across North America, Asia Pacific, and Europe. More than 350 million unique visitors use Indeed each month to search for jobs, post resumes, research companies and more. And over 3.5 million employers find candidates. Known for its easy-to-use design and advanced technologies for job matching and hiring, Indeed serves job seekers in over 60 countries and 28 languages. Indeed’s security team prioritizes ensuring the platform is safe for the hundreds of millions of employers and job seekers who rely on the platform, and protecting sensitive user data — like resumes, employment histories, and personally identifiable information — from leaks and theft. “We have an obligation to be the best data stewards possible,” explains Matthew Ortiz, senior manager of Indeed’s information security, engineering, and operations teams. “People come to us in a vulnerable state looking for a job. They entrust us with their most valuable personal data and rely on us to provide a secure, efficient environment.” On top of these day-to-day security concerns, Indeed recognized the need to modernize an IT ecosystem that had grown increasingly complex. This complexity resulted in inconsistent traffic controls to the company’s SaaS apps, data centers, and cloud resources. It also meant inefficient backhauling of traffic to data centers and an overreliance on traditional, perimeter-based tools like an on-premises virtual private network (VPN). “As we grew, our technical debt grew with us," says Ortiz. "We developed increasingly complex networking and security stacks which created risk and hurt productivity. We needed to simplify — complexity only leads to challenges and vulnerabilities.” To address these security and modernization goals, Indeed turned to Cloudflare’s connectivity cloud for secure any-to-any connectivity. In partnership with Cloudflare, Indeed began transforming its IT ecosystem, reducing complexity, improving security, and modernizing its architecture in the cloud.'
