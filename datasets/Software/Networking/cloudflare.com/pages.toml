["https://cloudflare.com/case-studies/salla"]
title = "Salla & Cloudflare | Customer Story | Cloudflare"
description = "Discover how Salla enhanced their platform security, improved content delivery, and streamlined operations across the Middle East and Europe with Cloudflare."
full_description = "Salla is a leading ecommerce platform in the Middle East. Founded in 2016 in Saudi Arabia, Salla helps merchants across industries set up and manage their online presence with payment, shipping, inventory management, and marketing, and a variety of other services. Salla is one of the fastest growing SaaS businesses in the Middle East, and as of fall 2024, Salla serves over 55,000 stores and processes sales worth over 24 billion Saudi riyal. As Salla has grown, the organization has recognized the need to invest more in security. Processing more customer data and payments has made Salla an increasingly popular target for threat actors. For example, when ecommerce surged during the 2020 pandemic, Salla faced over ten cyber attacks weekly, which demanded significant time and effort to mitigate. Growth also strained operational efficiency for Salla’s IT and security. As Salla launched new web content and public-facing applications, the company wanted a more centralized, efficient way to manage its online presence without investing in infrastructure. And as Salla served more customers in more regions, the company wanted to ensure that online content was served reliably with low-latency. Plus, the shift to remote work in 2020 forced Salla to reimagine how it could streamline access for its employees to corporate resources to get their jobs done. To address these challenges, Salla began their journey with Cloudflare in 2017 with the basic plan. Three years into the partnership, Salla upgraded to become an Enterprise customer, improving security and efficiency across their public-facing web platform and their internal workforce as the business has grown. Cloudflare DNS played a pivotal role in protecting Salla’s platform. With built-in DDoS protection, Salla’s platform was shielded from volumetric attacks that could disrupt service availability. Cloudflare’s Anycast network, which routes DNS requests to the nearest data center, ensures high availability and low latency for users worldwide, which is essential for ecommerce platforms like Salla, where downtime directly impacts revenue."
