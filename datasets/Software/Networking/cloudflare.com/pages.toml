["https://cloudflare.com/case-studies/easygo"]
title = "Easygo & Cloudflare | Customer Story | Cloudflare"
description = "Easygo enhances security and empowers rapid global growth across its KICK and Stake platforms with Cloudflare."
full_description = 'Easygo is an Australian technology developer best known for Stake, one of the world’s top online casinos and sports betting sites, and KICK, a top international live-streaming and video entertainment platform. The KICK platform’s creator-first focus and creative partnerships have attracted over 40 million users since its launch in 2022. Showing 8.9% viewer growth monthly, KICK outpaces its streaming industry competitors. Similarly, Stake — one of the industry’s earliest crypto casinos — has disrupted the online gaming ecosystem with its unique, player-centric games and high-visibility marketing collaborations. Currently responsible for 4% of bitcoin traffic globally, Stake went from 5 billion to over 30 billion bets placed in under 12 months. Easygo drives its innovations, supports rapid growth, and serves millions of users with a 500-person team based at its Melbourne headquarters and an additional 600 employees worldwide. Easygo faced growing pains as it began expanding into new markets and transforming from a startup into what Head of IT & Security, Michael McKinnon, calls the company’s “scale-up” phase. There are now over 40 million regular viewers on KICK, and Stake draws 100 million to 200 million monthly visitors. With this rapid growth, bringing global attention to its products and platforms, Easygo needed to pivot from an innovation-driven ethos into a longer-term strategy with a greater focus on security, reliability, and scalability. "As with many startups, there was a time where development was prioritised over security — we weren’t really on the global radar as a focal point for any major threat activity," explains McKinnon. "However, when we raised our profile and gained millions of community members, everything changed. Alongside our new users, we attracted unwanted attention from bad actors and new threat vectors." To sustain growth and secure the platform without compromising innovation, performance, or development agility, Easygo reached out to Cloudflare for specialized expertise in the following areas:'
