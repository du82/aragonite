["https://cloudflare.com/learning/access-management/what-is-sase"]
title = "What is SASE? | Secure access service edge | Cloudflare"
description = "Secure access service edge (SASE) is a cloud-based architecture that unifies software-defined networking and security services. Learn about SASE security."
full_description = "Secure access service edge (SASE) architecture is an IT model that combines security and networking services on one cloud platform. Secure access service edge, or SASE (pronounced “sassy”) is an architectural model that converges network connectivity with network security functions, and delivers them through a single cloud platform and/or centralized policy control. As organizations increasingly migrate applications and data to the cloud, it has become more complex and risky to manage network security with a traditional “castle and moat” approach. Unlike the traditional networking approach, SASE unifies security and networking onto one cloud platform and one control plane for consistent visibility, controls, and experiences from any user to any application. In this way, SASE creates a new unified corporate network based on cloud services run over the Internet — allowing organizations to transition away from many architectural layers and point solutions. In a traditional network model, data and applications live in a core data center. To access those resources, users, branch offices, and applications connect to the data center from within a localized private network or a secondary network (which typically connects to the primary one through a secure leased line or VPN). However, this model is ill-equipped to handle the complexities introduced by new cloud-based services and the rise of distributed workforces. It is impractical, for example, to reroute all traffic through a centralized data center if an organization hosts SaaS applications and data in the cloud. By contrast, SASE places network controls on the cloud edge — not the corporate data center. Instead of layering services that require separate configuration and management, SASE converges network and security services using one control plane. It implements identity-based, Zero Trust security policies on the edge network, which allows enterprises to expand network access to any remote user, branch office, device, or application."
year_published = 2025
