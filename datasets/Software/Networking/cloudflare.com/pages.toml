title = "Tavria V & Cloudflare | Customer Story | Cloudflare"
description = "Retail leader Tavria V eliminates phishing threats and reduces IT management workloads with Cloudflare Email Security"
full_description = "Founded in 1992, Tavria V is one of Ukraine’s largest retail companies, employing approximately 4,500 workers nationwide. Their broad portfolio includes shopping centers, supermarkets, home goods stores, restaurants, bakeries, garment manufacturing, luxury boutiques, delivery service, online store tavriav.ua, and much more. The Tavria V shops strive to guarantee a high level of service with access to high-quality goods at affordable prices. Their supermarkets also simplify how customers access social infrastructure services, such as the ability to use points for utility payments, currency exchange, dry cleaning, pharmacies, and payment terminals. Reducing risks and optimizing technology performance is critical to Tavria V’s continued success. To help accelerate their digital transformation, prevent growing zero-day exploits, and adapt to evolving compliance requirements, they sought more effective cyber security solutions — ideally with minimal IT administration resources required. Microsoft 365 delivers native functionality that provides essential email and data protection capabilities. However, as Tavria V started to experience, threat actors continue to evolve their tactics to bypass traditional email filters. Despite using Microsoft’s built-in email security, Tavria V’s corporate inboxes saw an unacceptable level of spam, email fraud, and phishing attacks. In addition to the security impact, Sergey Yaroschuk, the senior system administrator responsible for managing Tavria V’s IT Infrastructure, explains, “This was affecting the workload of the IT staff responsible for administering this infrastructure and processing feedback from other employees.” The company needed a dedicated anti-phishing solution to protect their workforce. “For us, automated email protection is a key aspect of information security,” notes Yaroschuk. “Protecting the business with minimal administrative resources are keys to successful and effective cybersecurity for any business.”"
