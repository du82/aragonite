["https://cloudflare.com/athenian/guide"]
title = "Athenian Project | Cloudflare | Cloudflare"
description = "The Athenian Project provides free security and reliability tools to state and local governments to help ensure constituents have access to election and voter registration information."
full_description = "Cloudflare is one of the world’s largest networks. Today, businesses, nonprofits, bloggers, and anyone with an Internet presence uses our network to make their websites, apps, and anything connected to the Internet fast and secure. Millions of Internet properties are on Cloudflare, and our network is growing by tens of thousands each day. Cloudflare powers Internet requests for ~35% of the Fortune 1,000, and serves 35 million HTTP requests per second on average. In September 2017, the U.S. Department of Homeland Security informed 21 states that their voter registration files or public election websites had been the target of cyber attacks. Among their many responsibilities, state and local officials are often responsible for election websites, which are increasingly the primary source of critical voter information, such as where to vote, how to vote, and who is running for office. Just like every other Internet property, election websites need to be fast, they need to be reliable, they need to be secure. Yet, scarce budgets too often prevent governments from getting the right resources to prevent attacks and stay online. Athenian Project offers Cloudflare’s Enterprise level of protection to state and local election websites for free. As part of this project, we are introducing this Interactive Guide to Protecting Your Election Website so that you are aware of the vulnerabilities and how Athenian Project protects you from them. Taking the steps included in this guide helps us all ensure that the Internet remains a vital resource for elections. They provide crucial information to people before, during, and after elections. Election websites can also be targets of attack and can face vulnerabilities due to peaks in traffic. Security and performance vulnerabilities can cause these sites to become unavailable or to spread false information about how to register to vote and the specific state and local measures that will be on the ballot. Security and performance vulnerabilities can prevent citizens who visit election websites from accessing important information about where and when to vote."
