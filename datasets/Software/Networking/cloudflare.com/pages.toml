["https://cloudflare.com/developer-platform/products/workers"]
title = "Cloudflare Workers |  Build and deploy code with Easy-to Use Developer Tools | Cloudflare"
description = "Build great software while Cloudflare manages the overhead of configuring and maintaining the infrastructure."
full_description = "Build serverless functions and applications without configuring or maintaining infrastructure with global deployment to over 330 data centers around the world on Cloudflare’s global network. Spin up applications in hours not days with no tuning necessary. Code is automatically placed for optimal performance. No action is required from developers to add more compute power or worry about reaching a limit no matter how much traffic an application receives. To enable industry-leading performance automatically, Cloudflare Workers runs on V8 isolates not containers. Our V8 isolate architecture enables instant start up times at no additional cost as there is no delay waiting for the runtime to be loaded into an instance upon initiation. Isolates already have the runtime, all that is needed is for the code to be loaded on invocation, virtually eliminating cold starts on requests. We need exceptionally strong security for our customers who upload private app code to Docker Hub. Cloudflare Workers provides an authentication layer that ensures that anyone who tries to access user data is authorized to do so. From fast and light to longer running and more CPU-intensive workloads, deploy and execute code globally."
