["https://cloudflare.com/case-studies/polestar"]
title = "Polestar | Cloudflare Customer Video Testimonial | Cloudflare"
description = "Polestar and Cloudflare | Customer Video"
full_description = "Polestar has always focused on performance and innovation. From its roots as an automotive racing team, the organization evolved to become Volvo’s performance tuning arm. Under the Volvo brand, the Polestar badge became synonymous with the Swedish manufacturer’s more sporty offerings. Today, as an independent electric car manufacturer, Polestar applies its talent toward the development and manufacture of design-forward, performance-oriented luxury electric vehicles (EVs). The company’s ethos— Pure Progressive Performance — is at the heart of its approach to all aspects of the business, from the cars it designs to the end-to-end customer experience it provides. For automobile manufacturers, an effective digital infrastructure is central to both product performance and how customers perceive and interact with the manufacturer. Within the performance EV sector, Polestar has the mechanical pedigree, but wants to take its digital experience to the next level. “Polestar has a unique take on how to buy a car and it's very important to us to deliver on those expectations,” explains Mikael Vesavuori, Cloud Software Architect and Technical Standards Lead at Polestar. “Whether you purchase our cars online or visit one of the Polestar spaces, we tie together the physical and digital dimensions to provide a much richer retail and automotive encounter.” One way they achieve this is the Polestar Configurator, a central feature of Polestar’s distinctive physical spaces. It is a media-rich digital and physical touchpoint that familiarizes buyers with vehicle configurations, options, and interior and exterior materials and trim. Unfortunately, the Polestar Configurator experienced performance and availability issues in China — a lucrative market where one in every five cars sold is an EV (1). At the heart of the problem was Polestar’s CDN provider, which had issues with the restrictive Chinese Internet infrastructure and connectivity problems with its global AWS network. The only solution was a partner that could overcome the latency, congestion and peering, and DNS issues that negatively affected customer perceptions of Polestar technology and the cars themselves."
