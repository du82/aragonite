["https://cloudflare.com/case-studies/wingie-enuygun"]
title = "Wingie Enuygun & Cloudflare | Customer Story | Cloudflare"
description = "Wingie Enuygun improves their websites security and efficiency, eliminating security incidents and accelerating task completion."
full_description = "Wingie Enuygun Group (WEG) is a prominent travel marketplace in the MENA region, primarily focused on flights through its platforms such as wingie.com, sa.wingie.com, wingie.ae, enuygun.com, and other associated domains. The company provides a wide range of travel services, including flights, bus tickets, hotels, and car rentals. Known for its innovative approach, WEG has been a leading player in the MENA online travel space, aiming to drive technological advancements and spearhead the digital transformation of the travel industry. Wingie.com stands out as a leading flight booking platform, particularly through its integration of virtual interlining technology, which offers users a broad selection of airline tickets and travel options to enhance their booking experience. With over 12 million mobile app downloads and support in six languages, the platform caters to millions of users worldwide. Before adopting Cloudflare, Wingie Enuygun encountered several significant challenges with their previous cyber security and content delivery network (CDN) providers. For example, certain technology limitations and support issues impacted Wingie Enuygun’s productivity, and hindered their ability to respond effectively to threats and high traffic volumes. Managing multiple IPs became cumbersome, and poor documentation left Wingie Enuygun uncertain whether issues arose from their actions or the platform's limitations. The pivotal moment for Wingie Enuygun occurred during a special holiday in Turkey, when they experienced one of the largest distributed denial-of-service (DDoS) attacks they had ever faced. This attack had a significant impact on their sales, preventing teams from hitting sales targets they would otherwise have easily achieved during peak holidays. These and other ongoing challenges led Wingie Enuygun to explore other options, including a one-month proof of concept (POC) with multiple providers. Wingie Enuygun sought to find a new vendor that could reduce the frequency of security attacks and improve the performance of their platform, whilst providing scalability and ease of use, and that is what led Wingie Enuygun to choosing Cloudflare."
