title = "News-Detail | gematik"
full_description = "01.07.2021 Pressemitteilung | Eine sichere Sache Wie sicher sind E-Rezept und E-Rezept-App, die beide am 1. Juli 2021 starten? Diese Frage stellen sich nicht nur Patienten, Ärzte und Apotheker, die mit diesen Anwendungen in naher Zukunft tagtäglich arbeiten. Auch die gematik, die sich Datenschutz und Informationssicherheit bei der Digitalisierung des deutschen Gesundheitswesens auf die Fahnen geschrieben hat, will die Antworten darauf ganz genau wissen und hat daher mehrere externe Gutachten zur Prüfung der Anwendungen in Auftrag gegeben. Die Gutachter, deren Auswahl das Bundesamt für Informationssicherheit (BSI) zustimmen musste, bestätigen, dass einer kontrollierten Inbetriebnahme in den Produktionsbetrieb nichts im Wege steht und die Anwendungen somit Teil der Telematikinfrastruktur werden können. Die gematik hat die E-Rezept-App für Deutschland selbst entwickelt und für das E-Rezept die Spezifikationen bereitgestellt. Holm Diening, Leiter Sicherheit bei der gematik: „Wir veröffentlichen das Gutachten zur E-Rezept-App, um Transparenz im Sinne der Vertrauensbildung herzustellen. Zusätzlich werden wir die Zusammenfassung aus den Produktgutachten des Fachdienstes und des Identity Providers sowie die Ergebnisse des Penetrationstests für das gesamte System veröffentlichen. Das entspricht unserem Anspruch an eine offene Kommunikation gegenüber den Nutzern aus der breiten Öffentlichkeit und der Fachcommunity, nicht nur, aber insbesondere auch bei den Entwicklungsprozessen von E-Rezept und E-Rezept-App. Nicht ohne Grund haben wir bereits die Software der gematik, die den Standard für den E-Rezept-Fachdienst vorgibt, als Open Source für jeden zugänglich veröffentlicht und laufend aktualisiert. Die von der gematik beauftragten Hersteller des Fachdienstes (IBM Deutschland) und des Identity Providers (RISE) für das E-Rezept haben wir ebenfalls dazu verpflichtet, den gesamten Quellcode ihrer Produkte zu veröffentlichen. Die Entwicklung, die Einführung und auch die sicherheitstechnische Bewertung des E-Rezepts und der gematik-App, die beide so viele Menschen im Alltag begleiten werden, sollen von A bis Z mit größtmöglicher Offenheit geteilt werden.“ Gutachten mit einem Vorwort der gematik zurück © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
