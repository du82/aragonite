["https://gematik.de/anwendungen/kim/faq"]
title = "FAQ | gematik"
full_description = "FAQ - KIM Allgemein Technik eAU FAQ KIM Pflege Alle öffnen Brauche ich in jedem Behandlungszimmer ein Kartenterminal zum signieren mit HBA?Sofern Dokumente wie z.B. ein eArztbrief oder eine eArbeitsunfähigkeitsbescheinigung in jedem Behandlungszimmer signiert werden sollen, ist es erforderlich, je ein Kartenterminal für die Eingabe der PIN vorzusehen. Ich möchte meine Organisation in der Third-Level-Domain der KIM-E-Mailadresse aufnehmen lassen. Wie geht das?Der KIM-Anbieter muss dazu im Service-Portal von Arvato Systems einen Request einstellen und die Domain beantragen. Wie viele KIM Adressen brauche ich als Praxis?Grundsätzlich genügt pro Praxis eine Adresse, welche an die SMC-B gekoppelt ist. Man kann aber je nach Bedarf weitere E-Mailadressen einrichten. Wie viele KIM-Adressen kann ich pro SMC-B verwalten?Man kann pro SMC-B bis zu 100 E-Mailadressen verwalten.In welchen Fällen benötige ich ein persönliches KIM-Postfach (gebunden an den HBA)?Das hängt von den Nutzungsfällen ab. Wenn Informationen ausschließlich für den Arzt verschlüsselt werden sollen und auch nur der Arzt die Informationen entschlüsseln soll, kann ein HBA gebundenes Postfach verwendet werden.Ab wann wird KIM 1.5 voraussichtlich zur Verfügung stehen?Die Anbieter planen ab Mitte 2023 mit KIM 1.5 in den Markt einzutreten.Ist KIM 1.0 für den digitalen Versand von elektronischen Arbeitsunfähigkeitsbescheinigungen (eAU) geeignet?Ja, die eAU kann über KIM 1.0 verschickt werden.Wie erhält der Arbeitgeber die elektronische Arbeitsunfähigkeitsbescheinigung?Die Krankenkassen haben ab dem 30. Juni 2022 ein Verfahren etabliert, das die Arbeitgeber über die elektronische Arbeitsunfähigkeitsbescheinigung des Versicherten informiert.Wir arbeiten mit drei Ärzten pro Sprechstunde. Reichen unsere zwei Kartenlesegeräte an der Anmeldung aus, um zu arbeiten und zu signieren?Ja, zwei Lesegeräte reichen dafür aus.Arbeitet KIM zum Verschlüsseln und Unterschreiben von Daten mit dem Programm PGP?Nein, KIM nutzt die Public-Key-Infrastruktur der Telematikinfrastruktur.Erhalten Patientinnen und Patienten ihre Arbeitsunfähigkeitsbescheinigung weiterhin in zweifacher Ausfertigung in Papierform?Ab dem 30. Juni 2022 gibt es die Arbeitsunfähigkeitsbescheinigung nur noch in einer Ausfertigung. Eine Bescheinigung in zweifacher Ausfertigung gibt es nur noch auf Wunsch. Kann in einer Gemeinschaftspraxis jede Ärztin und jeder Arzt alle KIM-Nachrichten entschlüsseln?Das hängt davon ab, über welchen elektronischen Heilberufsausweis die E-Mail-Adresse eingerichtet ist.Muss die Krankenkasse mir als Ärztin eine Bestätigung schicken, dass die elektronische Arbeitsunfähigkeitsbescheinigung angekommen ist?Ja, die Krankenkasse ist verpflichtet, eine Zustellbestätigung zu schicken.Entsteht mit der Stapelsignatur die Gefahr einer falschen Übermittlung?Nein, denn das Signieren geschieht unabhängig vom Versand der E-Mail über KIM.Ist ein Blankodrucker noch zwingend notwendig, wenn ich mit KIM arbeite?Ja, es wird ein Drucker benötigt, der das Stylesheet ausdrucken kann. Dazu können bestehende Drucker weiterverwendet werden, wenn diese die Mindestvorgaben der Kassenärztlichen Bundesvereinigung erfüllen. Weitere Infos zum E-Rezept gibt es hier.Brauchen alle Ärztinnen und Ärzte eines Medizinischen Versorgungszentrums oder einer Klinik eine eigene KIM-Adresse, um eine elektronische Arbeitsunfähigkeitsbescheinigung zu verschicken?Nein, jede Institution benötigt nur mindestens eine E-Mail-Adresse. Personenbezogene Postfächer gebunden an den Heilberufsausweis sind dazu nicht erforderlich.Können nur Ärztinnen und Ärzte elektronische Arbeitsunfähigkeitsbescheinigungen ausstellen oder auch Medizinische Fachangestellte?Medizinische Fachangestellte können weiterhin die Dokumente erstellen, jedoch muss Ärztin oder Arzt die elektronische Arbeitsunfähigkeitsbescheinigung per Heilberufsausweissignieren.Muss die elektronische Arbeitsunfähigkeitsbescheinigung trotzdem noch übergangsweise ausgedruckt werden?Ab dem 30. Juni wird die Bescheinigung für Arbeitgeber und Versicherten nur noch auf Wunsch ausgedruckt.Ist die KIM E-Mail-Adresse kostenlos und wo kann man sie beantragen?Die KIM-Adressen kosten Geld. Kosten für KIM werden den niedergelassenen Ärztinnen und Ärzten aber über ihre KV auf Grundlage einer Finanzierungsvereinbarung mit den Krankenkassen erstattet. Nähere Informationen dazu gibt es bei der KBV und der jeweiligen KV. Beantragt werden kann die KIM-Adresse bei einem KIM-Anbieter, oft über den jeweiligen Anbieter des Praxisverwaltungssystems (PVS). Wann schließen sich die Krankenhäuser an KIM an?Auch Krankenhäuser sind verpflichtet, eine elektronische Arbeitsunfähigkeitsbescheinigung zu erstellen, daher ist davon auszugehen, dass diese sich zügig an KIM anschließen werden.Sind bereits alle Krankenkassen an KIM angeschlossen und lassen diese sich somit anhand ihres Institutionskennzeichens automatisch durch das Praxisverwaltungssystem PVS identifizieren?Ja, die Krankenkassen haben sich zum 1. Oktober 2021 an die Telematikinfrastruktur und an KIM angeschlossen. Sie sind dadurch automatisch durch das PVS auffindbar. Muss jede Patientin und jeder Patient darüber aufgeklärt werden, dass die Kommunikation unter den Arztpraxen, Krankenhäusern und Apotheken über KIM erfolgt?Aufgrund der gesetzlichen Regelungen zu KIM gehen wir davon aus, dass keine neuen Einwilligungserklärungen eingeholt werden müssen. Bitte wenden Sie sich an die Datenschutzzuständigen der Krankenversicherung.Enthält das KIM-Adressbuch derzeit auch Physiotherapeuten und andere Therapeutenadressen und können diese über KIM zum Beispiel Berichte an Arztpraxen schicken?Nein, das ist erst zu einem späteren Zeitpunkt geplant.Erfolgt die Übermittlung der elektronischen Arbeitsunfähigkeitsbescheinigung an Arbeitgeber auch über KIM?Nein, die Arbeitgeber sind an KIM nicht angeschlossen. Die Krankenkassen haben jeweils ihr eigenes Verfahren mit den Arbeitgebern.Wie geht man vor, wenn man eine elektronische Arbeitsunfähigkeitsbescheinigung fehlerhaft ausstellt und korrigieren muss?Wenn eine elektronische Arbeitsunfähigkeitsbescheinigung falsch erstellt wurde, kann diese per Storno annuliert werden. Die Krankenkasse erkennt anhand der Krankenversicherungsnummer, um welche Versicherte oder welchen Versicherten es dabei geht.Viele Hausarztpraxen kommunizieren täglich mit Pflegeheimen und Hospizen, derzeit meist über Fax. Wann werden diese Institutionen an KIM angebunden?Pflegeheime können sich an die Telematikinfrastruktur und KIM anschließen. Im Rahmen eines Pflegemodellvorhabens schließen sich in Deutschland derzeit bereits einige Einrichtungen an. Sie sind jedoch nicht dazu verpflichtet.Gibt es eine sogenannte Empfangsbestätigung für alle übermittelten Daten, also beispielsweise für elektronische Arbeitsunfähigkeitsbescheinigungen und elektronische Arztbriefe?Ja, es gibt für jede Nachricht eine Zustellbestätigung.Gibt es einen Schutz vor Computerviren und Ransomware-Angriffen auf das Kernnetz der Praxis seitens KIM?KIM schützt den Datenverkehr vor fremdem Zugriff. Die Sicherheitsempfehlungen der Kassenärztlichen Bundesvereinigung sollten auch bei der Nutzung von KIM angewendet werden.Gibt es für die Einrichtung von KIM eine Vergütung?KIM wird seitens der Krankenversicherungen im Allgemeinen vergütet. Neben einer einmaligenEinrichtungspauschale gibt es auch eine Quartalspauschale.Gibt es auch mobile eHBA-Lese- und Schreibgeräte für Hausbesuche oder Besuche im Pflegeheim?Ja, es gibt auch mobile Kartenterminals.Ist das Standard-E-Mail-Programm von web.de für KIM zugelassen?Nein.Manche Krankenkassen haben mehrere Geschäftsstellen. Wie findet man bei KIM die richtige E-Mail-Adresse der Krankenkassen für den Versand der elektronischen Arbeitsunfähigkeitsbescheinigung heraus?Die elektronischen Arbeitsunfähigkeitsbescheinigung wird von jeder Kasse zentral verarbeitet.Ordnet KIM elektronische Arztbriefe automatisch der jeweiligen Patientin oder dem jeweiligen Patienten zu?Wenn das Praxisverwaltungssystem die Vorgaben der Kassenärztlichen Bundesvereinigung umgesetzt hat, kann die Zuordnung automatisch erfolgen. Wo finde ich aktuelle KIM-Anbieter?Eine Tabelle mit Anbietern finden Sie hier.Ich besitze KIM in der Anwendung CGM Z1 für Zahnärzte. Allerdings muss ich die eingehenden E-Mails derzeit „aktiv“ abrufen. Kann ich mich auch automatisch benachrichtigen lassen?Ja, das ist möglich. Sie können diese Funktion über das Praxisverwaltungssystem einstellen.Ich bin Psychotherapeutin. Kann das Antragsverfahren (Psychotherapie) mit der Krankenkasse und die Anforderung des Konsiliarberichts an den überweisenden Arzt ebenfalls über KIM laufen?Ja, das ist möglich. Voraussetzung dafür ist, dass der Ablauf vorab durch die Kassenärztliche Bundesvereinigung (KBV) und den Spitzenverband Bund der Krankenkassen (GKV) definiert wurde.Kann ich als Zahnarzt auch eine KIM-Adresse von der Kassenärztlichen Bundesvereinigung (KBV) bestellen?Sie können sich selbstverständlich am Markt erkundigen. Jedoch darf die KBV keine KIM-Adressen ausgeben.Ich habe eine Frage zur Dateibenennung der elektronischen Arbeitsunfähigkeitsbescheinigung. Wo finde ich Infos dazu?Unter diesem Link finden Sie umfassende Informationen zur Dateibenennung: https://update.kbv.de/ita-update/DigitaleMuster/eAU/KBV_ITA_VGEX_Technische_Anlage_eAU.pdfIch habe KIM erfolgreich getestet, kann aber aktuell noch mit keiner Praxis und keinem Krankenhaus kommunizieren. Woran liegt das?Das KIM-Adressbuch füllt sich sukzessive mit neuen Adressen.Warum hat man sich bei der elektronischen Arbeitsunfähigkeitsbescheinigung für einen Ausdruck im Format A4 entschieden?Bitte wenden Sie sich hierzu an die Kassenärztliche Bundesvereinigung.In der Übergangszeit erhalten Patientinnen und Patienten weiterhin einen Ausdruck der eAU für den Arbeitgeber. In diesem Fall muss separat gedruckt werden. Ist es möglich, die eAU später trotzdem per Stapelsignatur zu versenden?Ja, das ist möglich.In welchem Format werden die Daten über KIM übertragen?KIM ist ein E-Mail-Format. Im Anhang der E-Mail können verschiedene Dateiformate mitgeschickt werden.Ist der KIM-Dienst auch für Krankenversicherungen vorgesehen, so dass sensible Informationen (z.B. Honorarbescheide oder sachlich-rechnerische Korrekturen) auch zwischen Praxen und Krankenversicherungen ausgetauscht werden können?Ja, das ist vorgesehen.Ist es ein Vorteil, KIM bei meinem Praxisverwaltungssystem (PVS) zu bestellen?Es ist sinnvoll, sich bei der Einrichtung von KIM mit dem Hersteller seines PVS abzustimmen.Welchen Sinn macht KIM für mich als Psychotherapeutin?Mit KIM können Psychotherapeutinnen und –therapeuten verschlüsselte eMails mit Kolleginnen und Kollegen z.B. in Arztpraxen austauschen. Als Anhang an die KIM eMail können bspw. eArztbriefe gehangen werden.Auch die Kommunikation auf dem Postweg – wie beispielsweise an die Krankenkassen – kann nun durch KIM auf elektronischem Wege erfolgen. Alle von psychotherapeutischen Praxen ausgestellten Arbeitsunfähigkeitsbescheinigungen (AU) laufen ab dem 1. Oktober 2021 über einen KIM-Dienst. Wie genau kann ich als Physiotherapeutin KIM nutzen?In unserem Fachportal haben wir dafür Schritt-für-Schritt-Anleitungen und Checklisten bereitgestellt: fachportal.gematik.de/leistungserbringerWann werden alle Krankenkassen elektronische Arbeitsunfähigkeitsbescheinigungen (eAU) annehmen?Seit dem 1. Oktober 2021 sind alle Krankenkassen in Deutschland für die Bearbeitung von elektronischen Arbeitsunfähigkeitsbescheinigungen ausgerüstet. Sofern das Praxisverwaltungssystem (PVS) einer Arztpraxis technisch dazu in der Lage ist, kann – und muss – sie die eAU ihrer Patientinnen und Patienten auf digitalem Weg an deren jeweilige Krankenkasse versenden. Praxen, bei denen die eAU-Funktion noch nicht installiert ist, haben eine Übergangsfrist bis zum 31. Dezember 2021.Funktioniert KIM auch ohne Konnektoren? Ohne den Zugang zur Telematikinfrastruktur (TI) über Konnektor, Kartenterminal, Smartkarten und VPN (Virtual Private Network) ist die Nutzung von KIM nicht möglich. Zur Nutzung von KIM ist ein Update des Konnektors zum E-Health-Konnektor, ein Update des Praxisverwaltungs- bzw. Krankenhausinformationssystems notwendig. Um eine KIM-Adresse und ein KIM-Client-Modul zu erhalten, muss ein Vertrag mit einem zugelassenen KIM-Dienst-Anbieter abgeschlossen werden. Eine Liste aller zugelassenen Kim-Anbieter finden Sie hier: fachportal.gematik.de/anwendungen/kommunikation-im-medizinwesenWas passiert, wenn ein Virus per KIM versendet wird? Wird das auf dem Transportweg automatisch geprüft?Der Virenschutz liegt in der Verantwortung der Praxen bzw. ihres Praxisverwaltungssystems und der IT-Verantwortlichen. Der Virenschutz sollte genauso gehandhabt werden wie auch sonst in der Praxis. Die IT- Sicherheitsrichtlinie der KBV zum Schutz sensibler Daten sieht vor, dass die Praxen aktuelle Virenschutzprogramme einsetzen müssen, um sowohl die sensiblen Daten als auch die Praxis selbst vor Schadsoftware zu schützen.Wo finde ich die KIM-Adressen?Die KIM-Adressen von KIM-Nutzern werden im sogenannten TI-Verzeichnisdienst erfasst. Dieses Adressregister können Sie über Ihr Primärsystem abrufen und ansehen.Die Kassenärztliche Bundesvereinigung (KBV) bietet auch einen KIM-Dienst an. Stehen Praxen, Kliniken u. ä. auch im KIM-Adressbuch?Ja.Warum kostet eine KIM-Adresse monatlich Gebühren?KIM-E-Mail-Dienste erfüllen höchste Sicherheitsstandards und werden von privaten Unternehmen bereitgestellt, die wirtschaftlich rentabel arbeiten müssen. Daher werden Gebühren für die Nutzung erhoben. Wenn Arztpraxen KIM nutzen, erhalten sie aber eine Rückvergütung: Für die Einrichtung des KIM-Dienstes zahlen die Krankenkassen einmalig 100 Euro je Praxis. Der laufende Betrieb wird mit 23,40 Euro je Praxis und Quartal finanziert.Es handelt sich bei KIM um POP3- und SMTP-Server. Wenn die Nachricht an mehreren Stellen eingeht, ist nicht ersichtlich, ob diese schon bearbeitet wird. Warum kann es kein IMAP-Account sein?KIM wird regelmäßig weiterentwickelt. Es ist vorgesehen, dass in Folgeversionen von KIM auch IMAP unterstützt wird.Kann jede Krankenhausabteilung bei KIM eine eigene E-Mail-Adresse bekommen?Zunächst bekommt jede Institution, wie etwa ein Krankenhaus, eine eigene E-Mail-Adresse. Diese setzt sich aus dem Namen der Institution beziehungsweise einem Personennamen zusammen und endet auf: @anbieter-domain.kim.telematik. Die Anbieter-Domain-Bezeichnung kann sich aus dem Namen des Anbieters ergeben oder auch vom Anbieter frei gewählt werden.Darüber hinaus kann es sinnvoll sein, weitere KIM-Adressen einzurichten, beispielsweise für einzelne Ärztinnen, Ärzte und Abteilungen, um so die Postfächer abzutrennen. Jede Institution kann selbst entscheiden, wie viele KIM-Adressen sie nutzen möchte. Kann ich als Ärztin den Versand eines eArztbriefes an meine Praxismitarbeitenden delegieren?Die Erzeugung der qualifizierten elektronischen Signatur eines elektronischen Arztbriefes entspricht der handschriftlichen Unterschri"
