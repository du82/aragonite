title = "TI-Anbindung | gematik"
full_description = '''var customAnimationPath=undefined; TI-Anbindung Ihr Weg in die Telematikinfrastruktur TI-Gateway Konnektoren Die Telematikinfrastruktur (TI) ist ein besonders geschütztes Netzwerk, das in Deutschland als Grundlage für den Austausch, Empfang und Versand von Gesundheitsdaten dient. Ein Zugang zur TI ist notwendig, um digitale Anwendungen wie das E-Rezept, den sicheren E-Mail-Dienst KIM oder die elektronische Patientenakte zu nutzen.TI-Gateway: Der neue Weg in die TelematikinfrastrukturBei der Nutzung des TI-Gateways verbinden Sie sich über eine sichere VPN-Verbindung mit einem Rechenzentrum eines zertifizierten Anbieters. Über das Rechenzentrum wird dann ein Zugang zur TI hergestellt. Dieser Weg eignet sich besonders für (Zahn-)Arztpraxen, Apotheken und Reha- oder Pflegeeinrichtungen.Erklärfilm: So funktioniert das TI-GatewaySo funktioniert das TI-GatewayUm das TI-Gateway zu nutzen, müssen Sie einen Vertrag mit einem von der gematik zertifizierten TI-Gateway-Anbieter abschließen. Von Ihrem Anbieter erhalten Sie dann einen VPN-Zugang, über den Sie sich in ein Rechenzentrum einwählen können. Dort betreibt der Anbieter ein Zugangsmodul und einen Highspeed-Konnektor. Der Highspeed-Konnektor ist von der gematik geprüft und zugelassen und stellt den sicheren Zugang zur TI her.Vorteile des TI-GatewaysDer Vorteil ist: Während bisher im Regelfall jede medizinische Einrichtung einen eigenen Konnektor für den TI-Zugang besitzen musste, schließen die TI-Gateway-Anbieter nun mehrere Einrichtungen über einen zentral betriebenen Highspeed-Konnektor an die TI an. Updates und Wartungsarbeiten an den Konnektoren erfolgen zentral und nicht mehr vor Ort. Damit entfallen auch mögliche Haftungsfragen für die Einrichtung. Besonders kleinere Arztpraxen, Apotheken oder Reha- und Pflege-Einrichtungen haben so weniger Aufwand mit der Pflege der technischen Infrastruktur. Stimmen aus der Praxis„Ich habe schon immer gesagt, ich will meinen Konnektor ins Rechenzentrum kriegen. Wir haben den Wechsel zum TI-Gateway innerhalb weniger Tage über die Bühne gebracht. Ich kann so nun viel schneller arbeiten: Wir machen viele Telekonsile und verschicken viele pdf-Dateien, und das ist auf anderem Weg immer lästig gewesen. Hier haben wir im Team gleich die Entlastung durch das TI-Gateway gemerkt: Jetzt können wir einfach so eine KIM-eMail versenden, wie man es von einem normalen E-Mail-Programm gewöhnt ist. Und das liegt daran, dass das Gerät, der Konnektor, nicht mehr bei mir in der Praxis steht."Stefan Spieren, Hausarzt & Digital Health EnthusiastSchritte zum AnschlussPrüfen Sie, ob Sie über eine gültige SMC-B-Karte, einen HBA und mindestens ein E-Health-Kartenterminal verfügen.Suchen Sie hier einen zugelassenen TI-Gateway-Anbieter.Nehmen Sie Kontakt auf und schließen Sie einen Vertrag ab.Richten Sie die entsprechende Software Ihres Anbieters in Ihrer Einrichtung ein.Stimmen aus der Praxis„Wir haben schon eine unserer Einrichtungen mit einem TI-Gateway verbunden, und die Inbetriebnahme ging innerhalb eines Tages schnell und reibungslos. Die langwierige Lieferkette und Installation von Einboxkonnektoren entfällt. Das ermöglicht einen unkomplizierten Übergang von der bisherigen Einbox-Konnektoren-Welt in die Welt der Highspeedkonnektoren. Wir binden 2025 unsere über 80 Altenpflegeeinrichtungen in ganz Deutschland an die Telematikinfrastruktur an und erhoffen uns dafür vom TI-Gateway einen deutlich einfacheren Weg.“Benjamin Lenk, Leitung eHealth Alexianer DaKS GmbHZugelassene TI-Gateway-AnbieterNur von der gematik geprüfte und zertifizierte Anbieter dürfen medizinischen Einrichtungen das TI-Gateway bereitstellen. Die Firmen RISE sowie AKQUINET in Kooperation mit ehex haben bislang die Anbieterzulassung erhalten. Weitere Hersteller planen ebenfalls, eine TI-Gateway-Lösung anzubieten.Weitere Informationen zum TI-Gateway bei RISE (externer Link)Weitere Informationen zum TI-Gateway bei AKQUINET (externer Link)Hinweis für PrimärsystemherstellerPrimärsystemhersteller können ab sofort prüfen, ob ihre Software kompatibel mit dem TI-Gateway bzw. dem Highspeed-Konnektor ist. Die Hersteller von Highspeed-Konnektoren und TI-Gateway-Zugangsmodulen bieten dafür Optionen in der Referenzumgebung der gematik an.Für weitere Informationen zur Prüfung können die Hersteller per E-Mail kontaktiert werden:CGM / KoCo: connectivity.itsm.de@cgm.comsecunet: ehealth.vp.jira@secunet.comeHealth Experts: bestellung.ru@ehex.deRISE vertrieb@rise-world.com Alle öffnen Welche Kosten der Anbindung an die TI werden übernommen?Ob und welche Kosten abgedeckt sind, kann Ihnen Ihre Standesorganisation mitteilen. Bitte wenden Sie sich deshalb an die kassenärztliche Bundesvereinigung (KBV), die kassenzahnärztliche Bundesvereinigung oder die Bundespsychotherapeutenkammer. Hier finden Sie außerdem aktuelle Informationen der KBV zu den Finanzierungsvereinbarungen.Wie wird das TI-Gateway in medizinischen Einrichtungen integriert?Mit dem TI-Gateway wird weiterhin ein Dienstleister vor Ort (DVO) Kartenterminals pairen, Informationsmodelle einrichten und Clientsysteme konfigurieren. Ergänzend kommt die Einrichtung einer VPN-Verbindung mit der vom Anbieter des Gateways ausgewählten Technologie hinzu, sowie entsprechende Anpassungen bzw. Einstellungen für das Routing im lokalen Netz. Das Einstellen und Warten eines Einbox-Konnektors entfällt hingegen.Wer braucht einen Zugang zur TI?(Zahn)Arztpraxen, Apotheken und Kliniken müssen über einen Zugang zum sicheren Datennetz im Gesundheitswesen, der Telematikinfrastruktur (TI), verfügen. Ab dem 1. Juli 2025 sind auch Pflegeeinrichtungen verpflichtet, an die TI angebunden zu sein.Eignet sich das TI-Gateway für Praxen, Apotheken, Pflege- oder Reha-Einrichtungen?Das TI-Gateway bietet kleineren Einrichtungen wie (Zahn-)Arztpraxen, Apotheken, Pflege-Diensten oder Reha-Kliniken einen sicheren Anschluss an die Telematikinfrastruktur (TI). Durch die Nutzung des TI-Gateways muss es in der Einrichtung selbst keinen Konnektor geben, da sie einen Highspeed-Konnektor im Rechenzentrum eines Anbieters mitnutzt. Die Betriebsverantwortung dieses Konnektors liegt beim Anbieter des TI-Gateways, mit dem die medizinische Einrichtung einen Vertrag für Anschluss, Betrieb und Support abschließt.Eignet sich das TI-Gateway für größere Einrichtungen wie Kliniken?Anders als bei kleineren Einrichtungen, wie etwa einer Arztpraxis, besteht für Krankenhäuser sowohl die Möglichkeit sich via TI-Gateway an die Telematikinfrastruktur zu verbinden oder aber auch einen sogenannten Highspeed-Konnektor im hauseigenen Rechenzentrum zu nutzen. Das TI-Gateway kann dementsprechend auch für Krankenhäuser eine wirtschaftliche Möglichkeit sein, sich mit der TI zu verbinden und lokale Konnektoren überflüssig zu machen.Welche Voraussetzungen zur Konfiguration sind im Primärsystem notwendig für das TI-Gateway? Gibt es Unterschiede zur Konfiguration des Einboxkonnektors (EBK)?Das TI-Gateway beinhaltet die gleichen fachlichen Funktionalitäten und unterstützt die gleichen Schnittstellen wie der Einboxkonnektor. Im Kontext der Sicherheit setzt die gematik beim TI-Gateway verpflichtend auf mTLS, welches entsprechend durch den DVO im PVS konfiguriert werden muss. Dabei können sowohl Zertifikate auf der virtuellen Konnektor-Instanz (vKON) erzeugt werden, als auch außerhalb erzeugte Zertifikate importiert werden.Wie sieht die Netzwerkkonfiguration beim Kunden aus? Sind z.B. Portfreigaben, VPN notwendig?Die Netzwerkkonfiguration beim Kunden ist individuell. Portfreigaben (Firewall) braucht es einerseits für die Kommunikation mit dem oder den Kartenterminals (je nach Konfiguration) bzw. für die VPN-Verbindung. Können auch bisherige Kartenterminals genutzt werden, oder ist ein einheitliches Setup notwendig?Die bisher genutzten Kartenterminals können auch weiterhin genutzt werden. Somit müssen von medizinischen Einrichtungen keine neuen Hardwarekomponenten beschafft werden. Ist der Zugang zur TI auch ohne VPN-Konnektor möglich?Ein TI-Zugang mit dem TI-Gateway ohne VPN-Verbindung ist nicht möglich. Je nach Anbieter des TI-Gateway ist hierfür in der LEI ein Hardware- oder Software-basierter Client erforderlich. Wann ist mit der Einführung der SM-B/HSM-B-Funktionalität zu rechnen? Die Markteinführung der SM-B/HSM-B-Funktionalität (Security Modul Typ B/Hardware Security Modul Typ B) für das TI-Gateway (TI-G) bzw. Highspeedkonnektoren (HSK) erfordert ein koordiniertes Vorgehen der Anbieter TI-GW/HSK, der Anbieter SM-B und der Herausgeberorganisationen SM(C)-B – insbesondere im Kontext der Umsetzung der erforderlichen Herausgabe- und Personalisierungsprozesse für SM-B/HSM-B. Dazu sind technische und betriebliche Erweiterungen auf Seiten der Anbieter und Komponentenhersteller notwendig, zusätzlich muss die damit einhergehenden Zulassungsverfahren bei der gematik durchlaufen werden. Die Anbieter SM(C)-B und Herausgeber müssen darüber hinaus Antrags- und Freigabeprozesse (Portale und APIs) erweitern. Die gematik ist dazu im Dialog mit allen Marktteilnehmern und unterstützt aktiv bei der Umsetzung. Erste pilothafte Ausgaben SM-B für TI-GW/HSM-B sind für das 2 Halbjahr 2025 zu erwarten. Mit einer breiten Marktverfügbarkeit ist aus heutiger Sicht frühestens im Laufe des Jahres 2026 zu rechnen.Wie können Softwareanbieter prüfen, inwiefern ihr Produkt mit dem TI-Gateway bzw. dem Highspeedkonnektor kompatibel ist?Primärsystemhersteller können ab sofort prüfen, ob ihre Software kompatibel mit dem TI-Gateway bzw. dem Highspeed-Konnektor ist. Die Hersteller von Highspeed-Konnektoren und TI-Gateway-Zugangsmodulen bieten dafür Optionen in der Referenzumgebung der gematik an.Sollten Einrichtungen, die vor dem TI-Erstanschluss stehen, noch auf das TI-Gateway warten? Die TI-Gateway-Lösung ist eine zukunftsfähige Variante der TI-Anbindung. Gerade für neue Nutzergruppen , z.B. die Pflege ist ein Einstieg in die Welt der TI und damit auch der erste Schritt in Richtung TI 2.0 über das TI-Gateway sinnvoll.Muss ich bei einer Anbindung über das TI-Gateway auch die Netzwerk-Leistung in meiner Einrichtung erhöhen? Zur konkreten Situation einer Anbindung mittels TI-Gateway ist es sinnvoll, sowohl mit Ihrem Netzwerkpartner als auch mit dem Anbieter des TI-Gateway Kontakt aufzunehmen.Ab welcher Einrichtungs-Größe ist der Highspeedkonnektor rentabel? Wirtschaftliche Betrachtungen zum Einsatz des HSK oder TI-Gateway im Eigenbetrieb können nicht verallgemeinert werden. Es ist sinnvoll, unter Einbeziehung der eigenen IT zu prüfen, welche Voraussetzungen erfüllt sein müssen. Hinweise hierzu finden sich in den verfahrensbeschreibungen der gematik: fachportal.gematik.de/schnelleinstieg/downloadcenter/zulassungs-bestaetigungsantraege-verfahrensbeschreibungenWarum unterscheiden sich die Preise der zugelassenen TI-Gateway-Lösungen?Die gematik stellt die erforderlichen Unterlagen zu Herstellung und Betrieb von Komponenten bereit. Hierzu gehört auch das TI-Gateway. Die gematik hat keinen Einfluß auf die Preispolitik der Hersteller und/oder Anbieter. Zu diesem Suchbegriff wurde leider kein Eintrag gefunden. Erfahren Sie mehrHBA – Eintrittskarte für die digitale Welt #c-459 svg path {fill: #fff} .cls-1{fill:#fff;}Gematik_Piktogramme_Information Weiß TI 2.0: Die Zukunft der Telematikinfrastruktur #c-461 svg path {fill: #fff} .cls-1{fill:#fff;}Gematik_Piktogramme_Information Weiß TI-Score: Aktueller Stand der Softwarehersteller So funktioniert's Schritte zum Anschluss FAQ Inhalte dieser Seite So funktioniert's Schritte zum Anschluss FAQ Inhalte dieser Seite Die Telematikinfrastruktur (TI) ist ein besonders geschütztes Netzwerk, das in Deutschland als Grundlage für den Austausch, Empfang und Versand von Gesundheitsdaten dient. Ein Zugang zur TI ist notwendig, um digitale Anwendungen wie das E-Rezept, den sicheren E-Mail-Dienst KIM oder die elektronische Patientenakte zu nutzen.Der Konnektor: Die bisherige LösungDer Großteil der an die Telematikinfrastruktur angeschlossenen Institutionen nutzt derzeit noch einen Konnektor. Konnektoren sind kleine Boxen, die an einen WLAN-Router erinnern. Einen Konnektor können Sie über Ihren IT-Dienstleister beziehen. Er wird in Ihrer Einrichtung aufgestellt und muss von Ihnen betrieben und gewartet werden.Wichtige Infos zur LaufzeitverlängerungMit der Laufzeitverlängerung ist es möglich, die Laufzeit von Konnektoren bis Ende 2025 zu verlängern. Besonders für Praxen, Apotheken und Krankenhäuser, die von einem Zertifikatsablauf des Konnektors betroffen sind, kann die Laufzeitverlängerung eine adäquate Lösung dafür sein, an die Telematikinfrastruktur (TI) angebunden zu bleiben. Wie Sie herausfinden, ob Ihre TI-Komponenten von einem Zertifikatsablauf betroffen sind, haben wir Ihnen im nächsten Absatz auf dieser Seite zusammengefasst.Die Finanzierungsvereinbarung zur TI-Anbindung berücksichtigt die Option der Laufzeitverlängerung, von der speziell TI-Teilnehmer:innen profitieren können, deren Konnektor-Zertifikate ablaufen. Die Option der Laufzeitverlängerung von Konnektoren wird seit August 2023 angeboten. Je nach Hersteller kann die Umsetzung der Laufzeitverlängerung eine einmalige Einrichtung durch einen Dienst vor Ort notwendig machen, oder auch mit einem Software-Update durchgeführt werden. Technische Hinweise zur Unterscheidung von RSA und ECC-Verschlüsselungen bei KonnektorenEin überwiegender Teil von Konnektoren, die 2024 ihre Gültigkeit verlieren, sind mit dem sogenannten RSA Verschlüsselung-Algorithmus ausgestattet. RSA steht für Rivest–Shamir–Adleman und ist ein asymmetrisches kryptographisches Verfahren. Gemäß dem Bundesamt für Sicherheit in der Informationstechnik (BSI) ist die Nutzungserlaubnis für diese Verschlüsselung auf Ende 2025 begrenzt. Danach ist die Nutzung dieses kryptographischen Verfahrens nicht mehr zulässig. Daraus ergibt sich, dass eine Laufzeitverlängerung für Konnektoren mit RSA-Verschlüsselung nur bis maximal Ende 2025 möglich ist. Danach können TI-Teilnehmende eine andere Möglichkeit zur Anbindung nutzen.Seit Herbst 2020 sind auch Konnektoren in Nutzung, die neben den RSA-Zertifikaten auch ECC-Zertifikate (Elliptic Curve Cryptography / Elliptische Kurven-Kryptographie) tragen. Im Vergleich zu RSA ist ECC eine relativ neue Verschlüsselungsart. Diese neueren Geräte sind also in der Lage, die ECC-Schlüssel zu nutzen. Deshalb können diese Konnektoren auch über 2025 hinaus betrieben werden.Infos zum möglichen ZertifikatsablaufWir zeigen Ihnen, wie Sie herausfinden, ob Ihre TI-Komponenten in diesem Jahr von einem Zertifikatsablauf betroffen sind. Bitte beachten Sie dabei die grün markierten Links unter dem Text.Für den Anschluss an die Telematikinfrastruktur (TI) nutzen Praxen, Krankenhäuser und Apotheken den „Konnektor“, der neben dem Zugang zur TI auch die Kartenterminals steuert. Zudem wird in einer Praxis oder Apotheke auch die SMC-B (Security ModuleCard – Betriebsstätte) als Identifikationsmittel genutzt.Seit Oktober 2023 erreichen die in den Konnektoren der Hersteller RISE - Research Industrial Systems Engineeri'''
