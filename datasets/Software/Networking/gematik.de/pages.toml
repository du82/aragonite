["https://gematik.de/telematikinfrastruktur/ti-modellregionen"]
title = "TI-Modellregionen | gematik"
full_description = 'Definition Modellregion Hamburg und Umland Franken und Oberbayern Projektbüro Hamburg Ziel und Zweck Ergebnisse Austausch Erkenntnisse zum TI-Messenger Stimme aus der Praxis Inhalte dieser Seite Aktuelle Probleme und Störungen TI-Status WhatsApp-Kanal der gematik Aktuelle Probleme und Störungen Modellregionen Für digitale Gesundheit Digitale Anwendungen in der Gesundheitsversorgung sollen praxistauglich und nutzerorientiert sein. So bringen sie sowohl denen, die andere behandeln, als auch denen, die behandelt werden, den größten Mehrwert. In zwei Modellregionen (Hamburg und Umland sowie Franken) werden bereits bestehende und neue digitale Anwendungen und Dienste der Telematikinfrastruktur im Versorgungsalltag etabliert. In NRW hat sich zusätzlich die „ePA-Modellregion NRW“ formiert. Diese Region ist keine offizielle TI-Modellregion. Die gematik integriert die NRW-Region in die geplanten Maßnahmen der ePA-Pilotierung. „Hamburg ist eine Region, wo wir Ärzte, Apotheken, aber auch Krankenhäuser haben, die die TI-Anwendungen in ihrem Versorgungsalltag testen sollen. Und dann wirklich auch zu gucken: Was sind gute Szenarien, um das zu nutzen? Welchen Mehrwert habe ich denn jetzt eigentlich? - Durch uns haben die Menschen, die im Versorgungsalltag arbeiten, eine zentrale Anlaufstelle, sehr regional. Wir können dort die Probleme sammeln und weitergeben. Denn viele wollen einfach nur ihre Patienten versorgen, und ein bisschen Support ist da gut." Julia Nolting, Projektmanagerin TI-Modellregion Hamburg (TIMo) Struktur und Teilnehmende Eine Modellregion ist ein räumlich begrenztes Gebiet mit einem einheitlichen Verwaltungsaufbau und einer aussagekräftigen Anzahl verschiedener medizinischer Versorgungsstrukturen. So müssen dort Arztpraxen, Zahnarztpraxen und Krankenhäuser, aber beispielsweise auch Pflege- oder Rehaeinrichtungen vorhanden sein sowie einrichtungsübergreifende Verfahren bzw. Vorgänge. Die gematik koordiniert die Arbeit der Modellregionen übergeordnet. In den Modellregionen soll es mindestens ein Netzwerk aus (Zahn-)Arztpraxen, Krankenhäusern und Apotheken, ein lokales Projektbüro sowie großstädtische und ländliche Versorgungsprozesse geben. Außerdem sollen sich Hersteller und Anbieter einbringen, die Produkte für die Telematikinfrastruktur, Verwaltungssysteme für die teilnehmenden Einrichtungen oder auch weitere IT-Systeme im Auftrag beispielsweise der Krankenkassen in der Region bereitstellen. Welche Beteiligten in der Region für die Erprobung der jeweiligen Anwendung konkret und in welcher Menge benötigt werden, wird im eigens dafür erstellten Pilotierungskonzept festgelegt. Ein lokales Projektbüro ist vor Ort für alle Maßnahmen zuständig. Systemhersteller oder regionale Krankenkassen, die nicht in den Modellregionen vertreten sind, können eigene Test-Cluster aufstellen, idealerweise in Abstimmung mit der Koordinierungsstelle in der gematik. Modellregion Hamburg und Umland Als eine von zwei Modellregionen in Deutschland hat Hamburg mit Umgebung als erste den Zuschlag erhalten. Das Bewerber-Konsortium rund um das ÄrzteNetz Hamburg e. V. vereint neben Arztpraxen, Kliniken und vielen weiteren Einrichtungen des Gesundheitswesens auch Partner aus Industrie, von Verbänden und Versicherungen. Webseite „Die Leistungserbringer - also etwa Ärztinnen und Ärzte oder Apothekerinnen und Apothker - berichten, dass sie sich sehr gut an die Hand genommen fühlen und sehr vom gemeinsamen Austausch profitieren. Und das, glauben wir, ist einer der großen Vorteile der Modellregion." Markus Habetha, Projektleiter TI-Modellregion Hamburg (TIMo) Modellregion Franken Nach dem Auftakt in Hamburg steht nun auch die zweite Modellregion für digitale Gesundheit in Deutschland fest: Die gematik hat der Region „Mittel-, Ober- und Unterfranken“ den Zuschlag erteilt. Beworben hat sich ein Konsortium bestehend aus der Bayern Innovativ GmbH mit dem Bereich Gesundheit, dem Medical Valley Europäische Metropolregion Nürnberg (EMN) e. V. und der Monks – Ärzte im Netz GmbH. Webseite Das TiMo-Projektbüro in Hamburg Was ist Ziel und Zweck der Modellregionen? Neue TI-Anwendungen bzw. neue Funktionen bestehender Anwendungen sollen in den Modellregionen im realen Versorgungsalltag etabliert, die Nutzer:innen dabei intensiv begleitet werden, um eine höhere Akzeptanz zu erreichen. Die in den beiden Regionen gesammelten Erfahrungen werden wissenschaftlich ausgewertet und fließen in Schulungen und Informationsangebote für die Anwenderinnen und Anwender ein. Welche Versorgungsszenarien konkret erprobt werden sollen, legt ein jeweils mit den Gesellschaftern abgestimmtes Pilotierungskonzept fest. Wie wird man Modellregion? Interessierte Regionen konnten sich auf die Ausschreibung der gematik bewerben. Die gematik beauftragt die Verbindungsstelle – das Projektbüro vor Ort – mit der Durchführung der Pilotierungen und wird über den Fortschritt ständig unterrichtet. Bei Bedarf organisiert die gematik individuelle Erweiterungen des Mengengerüsts, um Strukturen außerhalb der Modellregionen. Welche Aufgaben hat die gematik? Nach der Vergabe der zwei Modellregionen begleitet die gematik die Regionen in der Set-up-Phase. Sie definiert die Pilotierungskonzepte für neue Anwendungen oder Anwendungsversionen in Abstimmung mit den Gesellschaftern, beauftragt die Verbindungsstelle mit der Durchführung der Pilotierungen und wird über den Fortschritt ständig unterrichtet. Darüber hinaus begleitet die gematik aktiv die Pilotierungen, führt Fehleranalysen durch und tauscht diese wo notwendig mit Herstellern aus der Industrie aus. Nach Abschluss der Pilotierung führt das IGES-Institut im Auftrag der gematik eine Wissenschaftliche Evaluation (WEV) durch. Die Ergebnisse der WEV sowie die Analyse der Fehler werden zur Verbesserung der Produkte genutzt. Ergebnisse der Pilotierungen Die ersten Ergebnisse aus der Modellregion für digitale Gesundheit in Hamburg und Umland (TIMO) liegen vor. Von September bis Dezember 2023 wurden bereits bestehende TI-Anwendungen wie das E-Rezept und der sichere E-Mail-Dienst KIM in der Hamburger Modellregion pilotiert. Zur Meldung vom 26.04.2024 gematik x DMEA: Panel zu TI-Modellregionen Schnelle Nachrichten in Echtzeit - dafür stehen die TI-Messenger. Doch wie können ihre Potenziale im Gesundheitswesen realisiert werden? Diese Frage haben Expertinnen und Experten der gematik auf der DMEA 2024 diskutiert, gemeinsam mit Nutzerinnen und Nutzern aus der Praxis. Mit dabei waren u. a. Apothekerin Sabine Haul und HNO-Arzt Dr. med. Joachim Draws. (Stand der Informationen: April 2024) Test des TI-Messengers in Hamburg & Umland In der TI-Modellregion Hamburg und Umland wurde im Herbst 2024 der TI-Messenger in ersten Gesundheitseinrichtungen erprobt.Aber wofür genau? Die Auswertungen aus der Modellregion zeigen, was die Nutzung von Messenger-Diensten im medizinischen Alltag von anderen Kommunikationswegen wie dem E-Mail-Dienst KIM unterscheidet.Während KIM vorwiegend für den Dokumentenaustausch genutzt wird, sind TI-Messenger das Mittel für schnelle Absprachen. TI-Messenger…📞 …ersetzen immer mehr das Telefon.🗓️…unterstützen bei der Terminorganisation und dem teaminternen Austausch.⁉️…helfen dabei, schnell und unkompliziert Rückfragen zu stellen.Gerade im Austausch zu medizinischen Dokumenten zeigt sich, wie TI-Messenger und KIM miteinander kombiniert zum Einsatz kommen. So werden beispielsweise Medikationspläne und nachfolgende Ergebnisberichte über KIM versendet. Rückfragen klären die Kolleginnen und Kollegen dann häufig über den Messenger. Abschlussbericht Pilotierung TI-Messenger Hamburg Stimme aus der Praxis „Der TI-Messenger hilft uns in vielen alltäglichen Situationen ohne Verzögerung weiter. Kurze (Rück-)Fragen oder auch Missverständnisse können sofort geklärt werden. Das ist zeitgemäß und effektiv, schneller als ein Anruf und lässt uns Zeit für andere wichtige Dinge." Joe Minners, Teamkoordinator Diakonie St. Pauli © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA'
