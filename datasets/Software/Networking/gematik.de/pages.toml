["https://gematik.de/ueber-uns/compliance"]
title = "Compliance | gematik"
full_description = "Compliance Verstöße erkennen und anzeigen Fragen der Integrität und Fairness beschäftigen uns als Werte unserer Unternehmenskultur schon lange. Da unsere Arbeit mit öffentlichen Mitteln finanziert wird, ist uns das Einhalten dieser Werte nicht nur persönlich sehr wichtig, sondern eine Pflicht für uns alle. Zu unserer Compliance-Kultur gehört es deshalb auch, Hinweise über Verstöße, Handlungen, Betrugsfälle und Vorfälle, die nicht mit den Gesetzen, ethischen Prinzipien und unseren internen Regelungen übereinstimmen, zu melden. Es ist elementar wichtig für uns als gematik, potenzielle Risiken frühzeitig zu erkennen und zu bearbeiten. Nur so können wir Schaden von der gematik, unseren Beschäftigten und Auftraggebenden, Industriepartnern, Nutzern und Nutzerinnen abwenden. Hinweise, die das unterstützen, leisten einen wertvollen Beitrag zum Schutz unserer geschäftlichen Aktivitäten und unseres Ansehens. Bei der Bekämpfung von Fehlverhalten und beim Vorgehen gegen die Missachtung interner Regelungen sind wir auf Mithilfe angewiesen. Bitte weist uns offen auf Verstöße hin. Mit dem BKMS® System haben wir eine interne Meldestelle eingerichtet, um den Umgang mit organisationsinternen Meldungen, den Schutz von hinweisgebenden und betroffenen Personen noch besser zu gestalten. Die Meldung erfolgt nach Deiner Anmeldung für uns anonym. Unsere detaillierten Regelungen zum Umgang mit der internen Meldestelle findest Du in unserer Unternehmensrichtlinie sowie dem Online-Tutorial und auch in den FAQ´s (nach der Anmeldung). Meldung abgeben © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
