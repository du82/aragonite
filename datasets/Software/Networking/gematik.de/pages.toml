full_description = "21.10.2024 Aktuelles | 4. TI Capture the Flag Event am 15.11.2024 – die Abenteuer von KIM & TIM gehen weiter Neues Abenteuer für KIM & TIM beim 4. TI Capture The Flag Event der gematik: Am Freitag, 15. November 2024 können wieder Teams mit bis zu vier Personen herausfordernde Aufgaben u.a. aus den Themenbereichen Penetrationtesting, Kryptographie, Programmierung, Forensik und OSINT lösen. Nachdem beim 3. CTF-Event im vergangen Jahr die Fax-Flut gestoppt werden konnte, steht in diesem Jahr der TI-Messenger im Fokus. Es dreht sich also alles um die neue digitale Anwendung der Echtzeit-Kommunikation. Teilnehmen können alle – von CTF-Anfänger:innen, über Cyber-Security-Professionals bis hin zu IT- und IT-Sicherheit-Begeisterte. Nach erfolgreicher Registrierung steht den Teilnehmenden die virtuelle Welt mit mehreren Ebenen offen: Auf der Community-Ebene können sich User austauschen, Vorträge anhören und mit den Kooperationspartnern in Kontakt treten. Auf der Challenge-Ebene können die Teams untereinander kommunizieren und rätseln. Weitere Informationen & Anmeldung: ctf.gematik.de zurück © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
