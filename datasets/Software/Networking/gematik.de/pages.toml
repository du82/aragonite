["https://gematik.de/newsroom/news-detail/hohe-teilnehmerzahl-an-ti-capture-the-flag"]
title = "News-Detail | gematik"
full_description = "20.11.2023 Hohe Teilnehmerzahl an TI Capture the Flag Das diesjährige Capture the Flag Event der gematik war ein voller Erfolg. Mit über 170 angemeldeten IT-Sicherheits-Begeisterten sowie Cyber-Security-Professionals (und über 70 angemeldeten Teams) konnte die Gesamtzahl aller Teilnehmer:innen am vergangenen Freitag im Vergleich zum Vorjahr sogar verdoppelt werden. Und auch die parallel laufenden Angebote für die gemmunity verzeichneten immer mehr Zuspruch. „Das rege Interesse am diesjährigen TI_ctf zeigt, dass Sicherheitsfragen bei digitalen Gesundheitsanwendungen für Security-Begeisterte einen immer größeren Stellenwert bekommen. Das ist eine gute und wichtige Entwicklung, umso mehr freue ich mich, dass wir in den kommenden Jahren daran anknüpfen werden“, erklärt Holm Diening, Chief Security Officer (CSO) der gematik GmbH. Mit dem diesjährigen TI_ctf sind die Abenteuer von KIM und TIM nämlich längst nicht zu Ende. In den kommenden Jahren werden weitere Kapitel rund um die beiden Protagonisten folgen. Damit ist auch künftig für neue Herausforderungen rund um Themen wie Penetrationtesting, Kryptographie, Programmierung, Forensik und OSINT gesorgt und das nächste Capture the Flag kommen. zurück © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
