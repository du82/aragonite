full_description = "Ärztin Patient Apotheker Patientin Stimmen aus Schneeberg Inhalte dieser Seite E-Rezepte einfach ausstellen und einlösen Vorteile für alle Das E-Rezept bietet für Ärztinnen und Ärzte, Apothekerinnen und Apotheker sowie für Patientinnen und Patienten viele Vorteile. Die systemischen Abläufe für die Praxis sind kaum anders als zuvor, dafür spart es sowohl dort als auch bei den Apotheken und den Versicherten Zeit ein. Wir stellen hier einige Erfahrungsberichte im Video vor, die zeigen, wie das E-Rezept den Versorgungsalltag entlasten kann. Dr. med. Laure Hengen, Fachärztin für Allgemeinmedizin Günter, Patient Bitte akzeptieren Sie YouTube-Cookies um dieses Video anzuschauen. Einstellungen ändern Dr. Benedikt Bühler, Apotheker Bitte akzeptieren Sie YouTube-Cookies um dieses Video anzuschauen. Einstellungen ändern Marie, Patientin Bitte akzeptieren Sie YouTube-Cookies um dieses Video anzuschauen. Einstellungen ändern Arzt, Apotheker, Versicherte in Schneeberg Bitte akzeptieren Sie YouTube-Cookies um dieses Video anzuschauen. Einstellungen ändern Erfahren Sie mehr E-Rezept für Praxen #c-394 svg path {fill: #010e52} .st0{fill:none;stroke:#FFFFFF;stroke-width:21;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:10;} E-Rezept für Apotheken #c-395 svg path {fill: #010e52} .cls-1{fill:#fff;} Gematik_Piktogramme_elektronisches Rezept Weiß E-Rezept für Versicherte © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
