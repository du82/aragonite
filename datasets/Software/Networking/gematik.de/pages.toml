full_description = "Zugang und Nutzung Video: Digitalisierung des Gesundheitswesens Downloads Weitere Informationen Inhalte dieser Seite Aktuelle Probleme und Störungen TI-Status WhatsApp-Kanal der gematik Aktuelle Probleme und Störungen Die Telematikinfrastruktur Auf dem Weg nach vorn Die Telematikinfrastruktur (TI) ist die Plattform für Gesundheitsanwendungen in Deutschland. Millionen Versicherte profitieren durch die digitalen Anwendungen der TI von einer verbesserten medizinischen Versorgung. Ziel und Aufgabe der gematik ist es, diese Infrastruktur auszubauen, zu modernisieren und so fit für das digitale Gesundheitswesen der Zukunft zu machen. Zugang und Nutzung #c-10112-93 svg path {fill: #010e52} #c-10112-93 .teaser__image-inner {border: 4px solid #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_Konnektor Blau TI-Anbindung #c-10112-91 svg path {fill: #010e52} #c-10112-91 .teaser__image-inner {border: 4px solid #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_Telematikinfrastruktur Blau TI-Adressbuch #c-10112-92 svg path {fill: #010e52} #c-10112-92 .teaser__image-inner {border: 4px solid #010e52} TI 2.0 #c-10112-94 svg path {fill: #010e52} #c-10112-94 .teaser__image-inner {border: 4px solid #010e52} gematik_Piktogramme_Kontur_RZ_Karte NFC HBA Blau Created with Sketch. HBA HBA #c-10112-95 svg path {fill: #010e52} #c-10112-95 .teaser__image-inner {border: 4px solid #010e52} gematik_Piktogramme_Kontur_RZ_Karte NFC eGK Blau Created with Sketch. eGK eGK #c-10112-96 svg path {fill: #010e52} #c-10112-96 .teaser__image-inner {border: 4px solid #00ff65} .cls-1{fill:#fff;} Gematik_Piktogramme_Service Weiß FAQ Video Digitalisierung des Gesundheitswesens Downloads Interview_TI2.0_2024.pdf PDF | 167 KB | 19.04.2024 Download Patient_Journey_Kardiologie_Illustration_2024.pdf PDF | 176 KB | 19.04.2024 Download Reportage_Kardiologie_2024.pdf PDF | 134 KB | 19.04.2024 Download Auf einen Blick: Verzeichnisdienst (VZD) PDF | 725 KB | 03.01.2024 Download Weitere Informationen T