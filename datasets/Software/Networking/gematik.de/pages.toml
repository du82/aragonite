["https://gematik.de/privatpraxen"]
title = "Privatpraxen | gematik"
full_description = 'SMC-B & HBA Wofür TI-Zugang? Online Check-in E-Rezepte ausstellen Video: Komfortsignatur Erfahren Sie mehr Inhalte dieser Seite Privatpraxen Mehr Möglichkeiten Immer mehr Patientinnen und Patienten, immer weniger Zeit: Praxen brauchen neue Lösungen, um die anstehenden Herausforderungen zu meistern. Digitale Anwendungen sind das richtige Hilfsmittel, um diesen Herausforderungen erfolgreich entgegenzutreten. Praxiskarte und Heilberufsausweis Für Vertragspraxen ist eine Institutionskarte für den Zugang zur Telematikinfrastruktur (TI) verpflichtend. Aber auch Praxen von Privatmedizinerinnen und Privatmedizinern - wie Privat(zahn)ärztinnen und Privat(zahn)ärzten oder Privatpsychotherapeutinnen und Privatpsychotherapeuten - können einen TI-Zugang erhalten. Die dafür notwendige „Secure Module Card" (SMC-B) für ihre Betriebsstätten wird von der gematik herausgegeben und kann über das Antragsportal der D-TRUST angefordert werden. Privatärztinnen und Privatärzte müssen eine Bescheinigung über ihre privatärztliche Tätigkeit in Niederlassung nachweisen können, um eine SMC-B über die gematik zu erhalten. Diese Bescheinigung wird nach einer entsprechenden Selbstauskunft von der zuständigen Ärztekammer ausgestellt. Auch Privatpsychotherapeutinnen und Privatpsychotherapeuten müssen eine Bescheinigung über ihre privatpsychotherapeutische Tätigkeit in Niederlassung nachweisen können. Diese Bescheinigung wird nach einer entsprechenden Selbstauskunft von der zuständigen Landespsychotherapeutenkammer ausgestellt. Für Einrichtungen von Privatzahnärztinnen und Privatzahnärzten prüft die gematik die Berechtigung zum Erhalt einer SMC-B anhand einer Bestätigung der zuständigen Zahnärztekammer. Mehr zu den berufsgruppenspezifischen Antragsverfahren im gematik Fachportal. Einen elektronischen Heilberufsausweis (HBA) erhalten Privatmedizinerinnen und Privatmediziner bei ihrer zuständigen Heilberufskammer. Wofür benötigen Sie einen TI-Zugang? Privatmedizinerinnen und Privatmediziner benötigen einen Zugang zur TI unter anderem zum intersektoralen Austausch mit anderen Leistungserbringerinstitutionen via KIM (Kommunikation im Medizinwesen), zum Ausstellen von E-Rezepten oder zum Befüllen der elektronischen Patientenakte (ePA). Privatärztinnen und Privatärzte müssen darüber hinaus seit Juli 2024, dem Beginn des Regelbetriebs des Implantateregisters Deutschland (IRD), implantatsbezogene Maßnahmen mit Brustimplantaten an das Register über die TI melden. Für in diesem Bereich agierende privatärztlichen Institutionen ist die Nutzung einer SMC-B-Karte eine Grundvoraussetzung für Meldungen an das IRD. Weitere Informationen Online Check-in für Privatversicherte Privatversicherte können per Versicherten-App (sofern die private Krankenversicherung an dem Verfahren teilnimmt) eine Praxis auswählen und ihre Daten sicher via KIM an diese schicken lassen. Das geschieht mittels „Online Check-in“. Dieser dient vor allem einer einmaligen Übermittlung der Krankenversichertennummer. Denn diese benötigen Praxen, um für Privatversicherte E-Rezepte auszustellen und die elektronische Patientenakte (ePA) zu befüllen. QR-Code der Praxis für die Datenübermittlung der Versicherten Nehmen Sie bereits am KIM-Verfahren teil und Ihre Praxissoftware unterstützt die Anwendung „Online Check-in“ (sprechen Sie im Zweifel Ihren Praxisverwaltungssoftware-Hersteller an), dann erstellen Sie für die Datenübermittlung seitens der oder des Versicherten aus Ihrer KIM-Adresse den individuellen QR-Code für Ihre Praxis. Stellen Sie diesen dann auf Ihrer Website oder in Ihren Räumen bereit. Die Patientinnen und Patienten können ihn scannen und die Datenübermittlung selbst per App anstoßen, so dass die Krankenversicherung die Daten an die Praxis übermitteln kann. Den Code bzw. das pdf zum Ausdrucken können Sie hier generieren. Stellen Sie Rezepte schneller aus Das E-Rezepts ermöglicht es Ihnen, Rezepte mit wenigen Klicks zu erstellen. Das bedeutet für Sie: keine handschriftlichen Unterschriften mehr, keine unnötigen Wege innerhalb der Praxis zur Unterzeichnung von Rezepten und weniger Papierausdrucke. Weitere Informationen Video: Komfortsignatur Bitte akzeptieren Sie YouTube-Cookies um dieses Video anzuschauen. Einstellungen ändern Erfahren Sie mehr Die Telematikinfrastruktur #c-367 svg path {fill: #00ff65} .cls-1{fill:#000e52;} Gematik_Piktogramme_Patientenakte 2 Blau ePA: Persönliche Daten, persönliche Entscheidungen #c-364 svg path {fill: #00ff65} .cls-1{fill:#000e52;} Gematik_Piktogramme_ KIM: Schnell und sicher kommunizieren © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA'
