the future, I would like to see better utilisation of health data for the benefit of patients. Many people wear smartwatches, for example - the data collected could be used to detect heart disease at an early stage." Eglė Čiuoderienė, Digitalberaterin, Kaunas Belgien E-Rezept Einführung ab 2013 In der Regelversorgung ja Verbreitungsgrad 100% (verpflichtend, Papierausdruck möglich) Einlösung mit einem Barcode per Ausdruck oder in elektronischer Form (z.B. E-Mail); Personalausweis mit Chip Zugang Einsicht über ePA (MaSanté), System ansonsten unabhängig von der ePA ePA Name MaSanté/MijnGezondheid Einführung ab 2018 Wahlfreiheit (Opt-In oder Opt-Out) Opt-out Zugriff über… (App/Website/etc.) Webportal Authentifizierung itsme (digitale Identität), Personalausweis und Kartenleser Digitale Identitäten Name itsme Identifizierungsprozess ID oder Bankkarte Anmeldung Passwort/Biometrie und Gerätebindung Vertrauensniveau hoch Dänemark E-Rezept Einführung ab 1994 In der Regelversorgung ja Verbreitungsgrad 99% Einlösung mit der elektronischen Medikamentenkarte Zugang mit der MitID (Digitale Identität) ePA Name sundhed.dk Einführung ab 2012 Wahlfreiheit (Opt-In oder Opt-Out) Opt-out Zugriff über… (App/Website/etc.) Webportal und App (sundhed.dk) Authentifizierung mit digitaler Identität Digitale Identitäten Name MitID Identifizierungsprozess Personalausweis und App mit FaceID oder PIN & Telefonnummer Anmeldung Facescan oder Fingerabdruck; alternativ per Code-Generator oder Chip Vertrauensniveau hoch; variable Prozesse für versch. Vertrauensniveaus Dänemark "Ich wickle das meiste, was mit Arztbesuchen, Untersuchungen und Medikamenten zu tun hat, über die offizielle App „MinSundhed“ ab. Darüber kann ich zum Beispiel auf Befunde und Laborergebnisse zugreifen. Auch meine Impfungen sind dort hinterlegt. Ich finde das wirklich gut, denn ich kann nochmal in Ruhe nachschauen, welche Diagnose der Arzt genau gestellt hat. Sowas vergisst man ja schnell. Wenn man im Krankenaus war, wird das Wichtigste auch in der elektronischen Akte vermerkt. Um mich in die App einzuloggen, brauche ich nur Gesichtserkennung oder Fingerabdruck. Vorher muss man sich allerdings einmal autorisieren. Ich nutze dafür „MitID“. Das ist eine digitale Identität, die in ganz Dänemark für alle möglichen Online-Dienstleistungen, zum Beispiel auch Überweisungen, gilt. Die Registrierung für MitID ist ein bisschen aufwändiger, aber es lohnt sich." Boris Boll-Johansen (55 Jahre), Illustrator, Kopenhagen Deutschland E-Rezept Einführung ab 2022 In der Regelversorgung ja Verbreitungsgrad über 45 Millionen eingelöste Rezepte Einlösung mit der elektronischen Gesundheitskarte, mit der E-Rezept-App, per Ausdruck Zugang In der App mit der elektronischen Gesundheitskarte und PIN (mit NFC-fähigem Smartphone einlesen) ePA Name ePA Einführung ab 2021 Wahlfreiheit (Opt-In oder Opt-Out) Ab 2025 Opt-Out Zugriff über… (App/Website/etc.) App (abhängig von Krankenkasse) Authentifizierung abhängig von Krankenkasse Digitale Identitäten Name Gesundh'''
