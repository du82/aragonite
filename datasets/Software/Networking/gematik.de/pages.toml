["https://gematik.de/anwendungen/epa-fuer-alle/reha"]
title = "Reha | gematik"
full_description = "Vorteile für die Reha Downloads für Reha-Einrichtungen Erklärvideos Statement aus der Praxis FAQ Inhalte für Nutzergruppen Erfahren Sie mehr Inhalte dieser Seite Zum Webshop Start der ePA für alle Kostenlose Infopakete für Praxen, Kliniken und Apotheken Zur Bestellung ePA für alle Reha Auf dieser Themenseite finden Sie wichtige Informationen für Reha-Einrichtungen, die mit der ePA für alle arbeiten werden. Alle relevanten medizinischen Daten Ihrer Patientinnen und Patienten einfach zugänglich – das wird mit der ePA für alle möglich. Ab Januar werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen, außer die Versicherten widersprechen dem. Auch private Krankenversicherungen dürfen ihren Versicherten eine ePA anbieten. Dadurch ergeben sich auch für das Personal in Reha-Einrichtungen neue Möglichkeiten. Auf dieser Seite erfahren Sie, was Sie mit der ePA für alle erwartet und finden zahlreiche Infomaterialien zum Download. Vorteile für die RehaGesundheitsdaten sind im Versorgungsalltag zugänglichPatientinnen und Patienten müssen mit der ePA für alle nicht mehr jeden Zugriff einzeln freigeben. Für die Reha ist eine Institutionsberechtigung vorgesehen. Das heißt: Alle Heilberuflerinnen und Heilberufler einer Einrichtung, also zum Beispiel einer Reha-Klinik, und ihre Mitarbeitenden können auf die ePA zugreifen. Voraussetzung ist, dass die Patientin oder der Patient vorher zugestimmt hat.Informationen gehen nicht verlorenArztberichte, Diagnosen, Entlassbriefe, Befunde, verordnete Medikamente sowie Reha- und Therapiepläne: All das kann künftig in der ePA gebündelt werden. Diese Daten sind im Behandlungskontext für Ärztinnen, Apotheker und Physiotherapeuten direkt sichtbar und sorgen für einen schnellen Überblick. Das gilt sowohl in der ambulanten als auch in der stationären Versorgung.Medikation wird übersichtlichIn der Medikationsliste, die in der ePA integriert ist, werden von Beginn an alle verschriebenen Medikamente einer Patientin bzw. eines Patienten angezeigt. Probleme oder Wechselwirkungen können so schneller erkannt werden. In einem zukünftigen Update wird auf der Medikationsliste aufbauend der Medikationsplan zur ePA hinzugefügt. Beispielsweise können dann die Informationen institutionsübergreifend gepflegt und mit Einnahmehinweisen ergänzt werden. Vorsorgevollmacht bei BedarfWenn Menschen mit körperlichen oder kognitiven Einschränkungen (z. B. Demenz) die ePA nicht eigenständig bedienen können, gibt es zwei Möglichkeiten: Dritte, die über eine Vorsorgevollmacht verfügen, können die ePA im Namen der Patientin oder des Patienten direkt bedienen und verwalten. Alternativ können Dritte (zum Beispiel Freundinnen, Freunde oder Angehörige) technisch berechtigt werden, um bei Bedarf für die Patientin oder den Patienten zu handeln. Downloads für Reha-Einrichtungen Infomaterialien für Reha-Einrichtungen In unserem Download-Portal finden Sie Infomaterialien, Erklärvideos und Grafiken zum Herunterladen. Zum Download-Portal Erklärvideos Video abspielen Die ePA für alle im Überblick So funktioniert die neue elektronische Patientenakte × Video abspielen Medikationsliste in der ePA für alle Besserer Überblick für das medizinische Personal × Video abspielen Suchfunktion in der ePA für alle So finden Sie relevante Informationen × Prof. Dr. med. Björn Hauptmann über die ePA für alle FAQIst es technisch möglich, eine größere Menge an Dokumenten gemeinsam herunterzuladen?Technisch ist es möglich, mehrere Dokumente zusammen herunterzuladen.Können privat Versicherte eine elektronische Patientenakte (ePA) erhalten, obwohl sie keine elektronische Gesundheitskarte (eGK) haben?Ja, privat Versicherte können eine ePA erhalten, auch wenn sie keine eGK haben. Versicherte müssen über die ePA-App ihrer privaten Krankenversicherung dann die Zugriffsrechte für die Leistungserbringerinstitutionen aktiv erteilen. Muss die empfangende oder die sendende Einrichtung dafür sorgen, dass ein Dokument in die ePA eingestellt wird?In der Regel sollte das Einstellen von der Institution übernommen werden, die bspw. den Befund erhoben hat. In der Realität kann das in manchen Konstellationen nicht umsetzbar sein, wenn bspw. die erstellende Institution die Patientin oder den Patienten nie gesehen hat (zum Beispiel bei einem Laborauftrag).Ist es möglich, dass ein Dokument nur für ausgewählte Ärztinnen und Ärzte auf sichtbar gestellt werden kann?Nein, es ist nicht möglich, ein einzelnes Dokument nur für bestimmte Ärztinnen und Ärzte bzw. für bestimmte medizinische Einrichtungen sichtbar zu stellen. Ein Verbergen ist immer nur für alle Institutionen möglich.Wie sorge ich vor Ort in meiner Einrichtung dafür, die Daten in der ePA zu schützen?In der KBV IT- Sicherheitsrichtlinie (https://www.kbv.de/html/it-sicherheit.php) werden Vorgaben für die Austattung von Praxen gemacht. Zu diesem Suchbegriff wurde leider kein Eintrag gefunden. Alle FAQ Alle Infos für verschiedene Nutzergruppen auf einen Blick Übersicht Auf unserer Übersichtsseite finden Sie allgemeine Informationen für die medizinischen Nutzergruppen, die mit der ePA für alle ab Januar 2025 arbeiten werden. Praxen Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Praxen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Krankenhäuser Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Krankenhäuser, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Zahnarztpraxen Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Zahnarztpraxen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Apotheken Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Apotheken, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Pflege Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Plegeeinrichtungen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Erfahren Sie mehr Sie haben weitere Fragen? Zum Kontaktformular #c-522 svg path {fill: #fff} .cls-1{fill:#fff;} Gematik_Piktogramme_Information Weiß ePA für alle - Informationen für Versicherte #c-523 svg path {fill: #fff} .cls-1{fill:#fff;} Gematik_Piktogramme_Information Weiß ePA für alle - Informationen der KBV © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
