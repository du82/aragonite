["https://gematik.de/ueber-uns"]
title = "Über uns | gematik"
description = """
Aus Alt mach Neu                                                                                                                                    Webversion                                                                                                                                                                                        PDF | 19 MB | 08.04.2024"""
full_description = "Das Gesundheitswesen von morgen Auf dem Weg in die Zukunft Open-Source-Kultur Downloads Inhalte dieser Seite Über uns Gesunde Aussichten. Die Digitalisierung ist der nächste Quantensprung in der Entwicklung der Medizin. Die Erfassung, Verarbeitung und Nutzung medizinischer Daten beflügelt die Forschung, revolutioniert Therapien und sorgt dafür, dass wir immer gesünder, länger und besser leben. Diesen Prozess in Deutschland entschlossen voranzutreiben und konstruktiv mitzugestalten, ist Ziel, Aufgabe und Mission der gematik. Auf dem Weg in das Gesundheitswesen von morgen und übermorgen Eine digitale Gesundheitsinfrastruktur für DeutschlandDie gematik trägt die Gesamtverantwortung für die Telematikinfrastruktur (TI), die zentrale Plattform für digitale Anwendungen im deutschen Gesundheitswesen (vgl. § 306 SGB V). Mit der Definition und Durchsetzung verbindlicher Standards für Dienste, Komponenten und Anwendungen in der TI gewährleistet die gematik, dass diese zentrale Infrastruktur sicher, leistungsfähig und nutzerfreundlich ist und bleibt. Die gematik vermittelt, moderiert und berät – national und internationalDie Arbeit der gematik als Nationale Agentur für Digitale Medizin reicht weit über Landesgrenzen hinaus – für die beste medizinische Versorgung der Menschen kooperiert sie international mit „National Digital Health Agencies“ anderer Länder. Sie ist Kompetenzzentrum und Koordinierungsstelle für Interoperabilität und versteht sich dabei nicht nur als Prüferin und Standardgeberin, sondern auch als Vermittlerin, Moderatorin und Beraterin.Digitale Medizin für alle MenschenDie elektronische Patientenakte, das elektronische Rezept und weitere Kernanwendungen in der TI fördern den Erkenntnisgewinn und die Vernetzung im medizinischen Bereich, um immer bessere Therapien und Behandlungen zu ermöglichen. Die gematik schafft die Rahmenbedingungen, damit die TI dies leisten kann – für die Gesundheit aller Menschen in Deutschland.Gemeinsam auf dem Weg in die Zukunft Beim Aufbau der TI hat die gematik ein immenses Wissen im Bereich Digital Health erlangt. Gleichzeitig steht sie mit allen Akteuren – Industrie, Wissenschaft, Politik, Krankenversicherungen, Heilberuflern, IT-Experten und Datenschützern – im regen Kontakt und Austausch. Damit befindet sich die gematik in zentraler Position, um die Entwicklung zum Wohle aller weiter voranzutreiben und mitzugestalten. Auf dem Weg in die ZukunftEine solide Basis für künftige EntwicklungenEbenso wichtig wie verbindliche Standards sind zentrale Dienste, die allen Akteuren immer und überall zur Verfügung stehen und alle gesetzlichen und technischen Anforderungen zuverlässig erfüllen. Die gematik identifiziert solche Kern-Dienste und gewährleistet deren Bereitstellung und Verfügbarkeit. So werden Aufwände und Kosten reduziert, die Nutzung erleichtert und Innovationen gefördert.Auf dem Weg zur TI 2.0Ziel der gematik ist die Evolution der TI zu einer nationalen Arena für digitale Medizin. Für diese TI 2.0 schafft die gematik einen verlässlichen Rahmen und stellt essentielle Grundleistungen bereit. Im Ringen um die besten Lösungen wird so kontinuierliche Innovation ermöglicht, um die Versorgung nachhaltig zu verbessern und die Digitalisierung des Gesundheitswesens zum Wohle aller entschlossen voranzutreiben. Open-Source-KulturMehr Transparenz und Zusammenarbeit mit Open SourceAls zentrale Akteurin bei der Gestaltung der digitalen Gesundheitsinfrastruktur legt die gematik besonderen Wert auf Offenheit, Transparenz und Zusammenarbeit. Das zeigt sich auch in der Open-Source-Kultur des Unternehmens: Die Produkte und Dienstleistungen der gematik basieren zunehmend auf Open-Source-Lizenzen und offenem Quelltext. So hat die gematik zum Beispiel den Produktivcode der E-Rezept-Apps publiziert; weitere Produkte werden folgen. Darüber hinaus entwickelt und veröffentlicht sie auch API-Spezifikationen über GitHub – zum Beispiel für das E-Rezept, den E-Mail-Dienst KIM (Kommunikation im Medizinwesen) und den TI-Messenger, dem neuen Instant-Messaging-Dienst für das Gesundheitswesen. Auf der Plattform Simplifier veröffentlicht sie zudem auf dem Standard FHIR (Fast Healthcare Interoperability Resources) basierende Datenprofile – unter anderem für das E-Rezept, für ISiK (Informationstechnische Systeme im Krankenhaus), ISiP (Informationstechnische Systeme in der Pflege) und den Verzeichnisdienst (VZD 2.0).Enge Zusammenarbeit mit Entwickler-CommunitysDer Open-Source-Ansatz ermöglicht es der gematik, an Innovationen teilzuhaben und Produkte zu entwickeln, die ein hohes Maß an Sicherheit und Qualität aufweisen. Denn durch den engen und stetigen Austausch mit Entwicklergemeinschaften und Herstellern können Fehler und Schwachstellen frühzeitig erkannt und behoben werden.Intern gelebte Open-Source-KulturDurch ein unternehmensinternes Open Source Program Office (OSPO) stellt die gematik sicher, dass die Open-Source-Kultur von den Mitarbeitenden gelebt und umgesetzt wird. Das umfasst neben der Entwicklung und Veröffentlichung der gematik-Projekte auf Open-Source-Basis möglichst auch die Nutzung von Open-Source-Lösungen bei der Verwendung externer Produkte und Komponenten. Zugleich steht OSPO für eine Kultur der Zusammenarbeit im Unternehmen, die Mitarbeitende motiviert, gemeinschaftlich die besten Lösungen zu finden. Zusätzliche Informationen Aus Alt mach Neu Webversion PDF | 19 MB | 08.04.2024 Download gematik - Nationale Agentur für Digitale Medizin PDF | 245 KB | 27.04.2023 Download gematik - National Digital Health Agency PDF | 150 KB | 27.04.2023 Download © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
