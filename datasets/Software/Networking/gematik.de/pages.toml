tionen von ärztlichen Kolleginnen und Kollegen im Behandlungskontext vor – ohne Hinterherzutelefonieren. Standardmäßig dauert der Behandlungskontext 90 Tage an. Patientinnen und Patienten können sich aber dafür entscheiden, Ihnen mithilfe ihrer ePA-App über die 90 Tage hinaus Zugriff auf ihre elektronische Patientenakte zu geben.Medikation wird übersichtlichIn der Medikationsliste, die in der ePA integriert ist, werden alle verschriebenen Medikamente einer Patientin bzw. eines Patienten angezeigt. Probleme oder Wechselwirkungen können so schneller erkannt werden. Auf die Medikationsliste setzt zukünftig ein Medikationsplan auf, der noch mehr Funktionen bietet. Beispielsweise können dann die Informationen institutionsübergreifend gepflegt und mit Einnahmehinweisen ergänzt werden.Daten sind geschütztDie ePA für alle funktioniert nach modernen Sicherheitsstandards. Daten werden nur verschlüsselt in die ePA übertragen und sind dort für niemanden erreichbar. Nur Patientinnen und Patienten selbst oder zugriffsberechtigte Heilberuflerinnen und Heilberufler haben die Möglichkeit, Daten aus der ePA für alle abzurufen. Downloads für Zahnarztpraxen Infomaterialien für Zahnarztpraxen In unserem Download-Portal finden Sie Infomaterialien, Erklärvideos und Grafiken zum Herunterladen. Zum Download-Portal Erklärvideos Video abspielen Die ePA für alle in Zahnarztpraxen Vorteile und Use-Cases kurz erklärt × Video abspielen Medikationsliste in der ePA für alle Besserer Überblick für das medizinische Personal × Video abspielen Suchfunktion in der ePA für alle So finden Sie relevante Informationen × Video abspielen Die neue ePA für Privatversicherte Funktionen und Vorteile × Klickstrecke: ePA im zahnärztlichen System Öffnen ePA im zahnärztlichen System In dieser Klickstrecke sehen Sie beispielhaft, wie die ePA für alle in einem Zahnarzt-Praxisverwaltungssystem (ZPVS) genutzt werden kann. Mit Klick auf Buttons in dieser Anwendung kann eine Datenübertragung an die Figma, Inc. in die USA s