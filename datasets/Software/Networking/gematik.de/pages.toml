full_description = '''Aktuelle Probleme und Störungen TI-Status WhatsApp-Kanal der gematik Aktuelle Probleme und Störungen TI-Dashboard Digitalisierung in der Übersicht Wie ist der aktuelle Stand der Digitalisierung im Gesundheitswesen? Das TI-Dashboard zeigt transparent die relevantesten Schlüsselkennzahlen der Anwendungen der Telematikinfrastruktur (TI) auf einen Blick. Mit der Darstellung dieser Zahlen gibt die gematik einen kompakten Überblick darüber, wie es um die Digitalisierung des Gesundheitswesens in Deutschland im Rahmen der TI steht. Das Dashboard zeigt die absoluten Zahlen zur Nutzung der einzelnen Anwendungen seit Produktivstart bis zum Vortag. Die Verbreitung und der Anstieg der Nutzung der Anwendungen in den einzelnen Nutzergruppen im zeitlichen Verlauf kann und soll durch das Dashboard nicht dargestellt werden. Diesen Kontext reichen wir regelmäßig in unseren Mitteilungen nach. Die konkreten Definitionen und Erläuterungen zu den einzelnen KPI pro Anwendung erfahren Sie, wenn Sie mit der Maus über das „i“ fahren. Wir verwenden einen Service eines Drittanbieters, um das Dashboard einzubetten. Dieser Service kann Daten zu Ihren Aktivitäten sammeln. Bitte lesen Sie die Details durch und stimmen Sie der Nutzung des Service zu, um dieses Formular aufzurufen.Wir verwenden einen Service eines Drittanbieters, um das Kontaktformular einzubetten. Dieser Service kann Daten zu Ihren Aktivitäten sammeln. Bitte lesen Sie die Details durch und stimmen Sie der Nutzung des Service zu, um dieses Formular aufzurufen. Einstellungen ändern Leider unterst&uuml;tzt Ihr Browser kein Javascript bzw. keine "Frames"! var service; function getService() { if (typeof UC_UI !== "undefined") { var btn = document.getElementById("uc-bt-5099"); var service = UC_UI.getServicesBaseInfo().find( (service) => service.name === "ti-lage.prod.ccs.gematik.solutions" ); if (service){ if (btn && !service.consent.status){ var el_a = document.getElementById('uc-bt-c-5099'); if (el_a) el.classList.