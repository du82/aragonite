["https://gematik.de/ueber-uns/struktur"]
title = "Struktur | gematik"
full_description = 'Geschäftsführung der gematik Gesellschafter und Gremien Im Dialog mit vielen Akteuren Inhalte dieser Seite Die Struktur der gematik Geschäftsführung der gematik v. l. n. r.: Dr. Florian Hartge, Brenya Adjei, Dr. Florian Fuhrmann Dr. Florian Fuhrmann, Brenya Adjei und Dr. Florian Hartge sind seit September 2024 das Leitungsteam der gematik. In ihrer Zusammenarbeit setzen sie Schwerpunkte in der Nutzerzentrierung, dem intensiven Dialog und Einbindung von beteiligten Partnern sowie einem kollaborativen Prozess bei der Produktentwicklung. Das Führungsteam verbindet ein gemeinsames Ziel: Die digitale Transformation des deutschen Gesundheitswesens voranzutreiben. Dr. Florian Fuhrmann - Vorsitzender der Geschäftsführung | Bereiche: Strategie und Standards, Recht und Finanzen Florian Fuhrmann ist seit dem 1.9.2024 Vorsitzender der Geschäftsführung der gematik. Im Unternehmen verantwortet er die Bereiche Strategie und Standards, Recht und Finanzen. Von 2014 bis Ende 2022 baute er im Auftrag der Kassenärztlichen Bundesvereinigung die kv.digital GmbH auf. Zuletzt war Herr Fuhrmann tätig als Mit-Gründer von Lillian Care und Geschäftsführer des Telematikanbieters Kosyma. Vorherige berufliche Stationen umfassen u. a. eine Unternehmensberatung, einen bundesweiten Versorgungsträger und einen internationalen Softwarekonzern. Seine akademische Laufbahn schloss Florian Fuhrmann mit einer Promotion über Krankenhausprozesse ab. Unter seiner Führung entwickelten seine Teams in den vergangenen Jahren Kommunikations- und Versorgungsplattformen für Arztpraxen, Krankenhäuser, Impfzentren und Organisationen, die mehrfach ausgezeichnet wurden. Dr. Florian Fuhrmann war und ist Mitglied bzw. Beisitzer in verschiedenen Jurys und Gremien in den Bereichen Versorgung und Digitalisierung. Brenya Adjei | Bereiche: Personal, IT und Kommunikation Brenya Adjei ist seit dem 1.9.2024 Teil der Geschäftsführung der gematik und verantwortlich für die Bereiche Personal, IT und Kommunikation. Zuvor war sie Chief Customer Officer bei Dina Elektronik, einem holokratischen, mittelständischen Unternehmen für Sicherheitstechnologie. Dort war sie u. a. zuständig für die Digitalisierung der Customer Experience (Kundenerlebnis), die Entwicklung der Produktstrategie sowie die Etablierung von New Work-Methoden in der Organisation. Die studierte Medienmanagerin ist eine Strategin mit über 15 Jahren Agenturerfahrung, u. a. als „Director of Innovation & Strategy“ bei der Strategieagentur diffferent. Sie hat große Unternehmen beraten, die sich der Digitalisierung stellen wollen, wie die Deutsche Telekom, Porsche und Nivea. Brenya Adjei verfügt über umfassende Expertise in der Entwicklung kundenzentrierter Services und Produkte, Kommunikationsstrategien, dem Aufbau und der Führung diverser Teams sowie der Transformation von Organisationen. Dr. Florian Hartge | Bereiche: Produktion, Sicherheit und Betrieb Florian Hartge ist seit dem 1.9.2024 Teil der Geschäftsführung der gematik und verantwortlich für die Bereiche Produktion, Sicherheit und Betrieb. Vom 1.1. bis zum 31.8.2024 leitete er die gematik als Interims-Geschäftsführer. Der promovierte Medizininformatiker ist seit 2020 im Unternehmen und verantwortete zuvor als Chief Produktion Officer die Produktentwicklung und Einführung der Produkte der gematik. Florian Hartge ist Experte in den Themen E-Health, Gesundheitsvernetzung, Softwareentwicklung und Projektmanagement. In vorherigen Positionen war er Geschäftsführer und Gründer einer Unternehmensberatung mit dem Schwerpunkt Gesundheitsdigitalisierung sowie Innovationsmanager und Interessenvertreter für die gesetzliche Krankenversicherung in den Bereichen E-Health, Telematik und Telemedizin. Außerdem war Herr Hartge verantwortlich für das Business Development einer Softwarefirma für E-Health-Lösungen. Gesellschafter und Gremien Die Gesellschafter der gematik sind das Bundesministerium für Gesundheit (BMG), die Bundesärztekammer (BÄK), die Bundeszahnärztekammer (BZÄK), der Deutsche Apothekerverband (DAV), die Deutsche Krankenhausgesellschaft (DKG), der Spitzenverband der Gesetzlichen Krankenversicherungen (GKV-SV), die Kassenärztliche Bundesvereinigung (KBV), die Kassenzahnärztliche Bundesvereinigung (KZBV) und der Verband der Privaten Krankenversicherung (PKV). Das Bundesministerium für Gesundheit hält 51% der Gesellschafteranteile. Der GKV-Spitzenverband mit 22,05% der Anteile finanziert die Arbeit der gematik zu 93 Prozent mit einem Betrag in Höhe von 1,50 Euro pro Jahr je Mitglied der Gesetzlichen Krankenversicherung (§ 316 Absatz 1 Satz 1 SGB V). Der Verband der Privaten Krankenversicherung trägt 7 Prozent der Finanzierung. Das Bundesministerium für Gesundheit hat diesen Betrag entsprechend dem Finanzbedarf (Mittelbedarf) der gematik und unter Beachtung der Wirtschaftlichkeit in den letzten Jahren durch die Rechtsverordnung jeweils angepasst. So wurde für das Jahr 2024 die Finanzierung durch die Verordnung zur Anpassung des Betrags zur Finanzierung der „Gesellschaft für Telematik“ für das Jahr 2024 (TeleFinV 2024) auf 1,67 Euro je Mitglied der gesetzlichen Krankenversicherung festgestellt. Die anderen 24,5% der Gesellschafteranteile verteilen sich auf die Spitzenorganisationen der Leistungserbringer. Für Entscheidungen ist eine gesetzlich vorgeschriebene Mehrheit von 51% nötig. Gesellschafterversammlung Das oberste Gremium der gematik ist die Gesellschafterversammlung. Die neun Gesellschafter der gematik treffen hier gemeinsam wichtige Entscheidungen zur Telematikinfrastruktur und der elektronischen Gesundheitskarte. Den Vorsitz der Gesellschafterversammlung hat Herr Sebastian Zilch vom Bundesministerium für Gesundheit. Die stellvertretenden Vorsitzenden sind Frau Dr. Doris Pfeiffer vom GKV-Spitzenverband sowie Frau Claudia Korf (DAV - Deutscher Apothekerverband e.V.). Die Gesellschafterversammlung wählt im Abstand von jeweils zwei Jahren einen Vorsitzenden und bis zu drei stellvertretende Vorsitzende. Die Bundesrepublik Deutschland hat ein Vorschlagsrecht für den Vorsitzenden, der aus dem Bundesministerium für Gesundheit besetzt werden soll. Leistungserbringer und Kostenträger haben jeweils ein Vorschlagsrecht für eines der beiden weiteren Ämter der stellvertretenden Vorsitzenden. Gesellschafter der gematik sind: Bundesministerium für GesundheitSebastian Zilch BundesärztekammerNorbert Butz BundeszahnärztekammerJürgen Herbert DAV - Deutscher Apothekerverband e.V.Claudia Korf Deutsche Krankenhausgesellschaft e.V.Dr. Gerald Gaß GKV-SpitzenverbandDr. Doris Pfeiffer Kassenärztliche BundesvereinigungDr. Philipp Stachwitz Kassenzahnärztliche BundesvereinigungDr. Karl-Georg Pochhammer Verband der privaten KrankenversicherungDr. Florian Reuther Schlichtungsstelle Vorsitzender der Schlichtungsstelle ist der Datenschutzexperte Peter Schaar. Von den Gesellschaftern gehören Dr. Doris Pfeiffer (GKV-Spitzenverband) sowie Dr. Franz-Josef Bartmann (BÄK) der Schlichtungsstelle an. Die Schlichtungsstelle ist im § 291c Sozialgesetzbuch Fünftes Buch (SGB V) festgeschrieben. Beirat Der Beirat nimmt zu Grundsatzthemen Stellung und berät die Gesellschaft nach § 317 und § 318 SGB V. Mitglieder des Beirats sind die Vertreter der Länder, der Patientinnen und Patienten, der Industrie, der Wissenschaft sowie die Berufsgruppen im Gesundheitswesen, deren Spitzenorganisationen nicht zu den Gesellschaftern der gematik gehören. Auch gehören dem Beirat je ein Vertreter des Bundesbeauftragten für den Datenschutz und die Informationsfreiheit (BfDI), des Bundesamts für Sicherheit in der Informationstechnik (BSI) und des Bundesministeriums für Wirtschaft und Klimaschutz (BMWK) an. Hier finden Sie die Geschäftsordnung des Beirats. Vorsitz des Beirats Sebastian Claudius Semler ist Vorsitzender des Beirats und Geschäftsführer der Technologie- und Methodenplattform für die vernetzte medizinische Forschung e. V. (TMF)Hans-Peter Bursig ist stellvertretender Vorsitzender des Beirats und Bereichsleiter Gesundheit des Verbandes der Elektro- und Digitalindustrie (ZVEI) Mitglieder des Beirats Vertreter der LänderBayern: Dr. Georg Münzenrieder Brandenburg: Petra PravemannHamburg: Lukas Dölger Nordrhein-Westfalen: N.N.Vertreter der PatienteninteressenBAG SELBSTHILFE - Bundesarbeitsgemeinschaft Selbsthilfe von Menschen mit Behinderungen und chronischer Erkrankung und ihren Angehörigen e. V.: Dr. Martin DannerVdK - Sozialverband VdK Deutschland e. V.: Ilias Essaidavzbv - Verbraucherzentrale Bundesverband e. V.: Lucas AuerBundesarbeitsgemeinschaft der PatientInnenstellen: Jürgen KretschmerVertreter der IndustrieverbändeADAS - Arbeitsgemeinschaft Deutscher Apotheken-Softwarehäuser: Gerhard HaasBITKOM - Bundesverband Informationswirtschaft, Telekommunikation und neue Medien e. V.: Dr. Ariane Schenkbvitg - Bundesverband Gesundheits-IT e. V.: Melanie WendlingInitiative D21, Lenkungsgruppe "IT- im Gesundheitswesen"Spitzenverband der Heilmittelverbände e. V.: Andreas PfeifferVDDS - Verband Deutscher Dentalsoftware Unternehmen e. V.: Dr. Markus HecknerZVEI e. V. - Verband der Elektro- und Digitalindustrie: Hans-Peter BursigVertreter der WissenschaftTMF – Technologie- und Methodenplattform für die vernetzte medizinische Forschung e.V.: Sebastian Claudius SemlerOstbayerische Technische Hochschule Regensburg - Fakultät Informatik und Mathematik, Abt. Informatik/ E-Health: Prof. Dr. med. Georgios RaptisGVG - Gesellschaft für Versicherungswissenschaft und - gestaltung e. V.: Nils ReithPhilipps-Universität Marburg & Universitätsklinikum Marburg, Institut für Digitale Medizin: Univ.-Prof. Dr. med. Sebastian Kuhn, MMEVertreter der hausarztzentrierten VersorgungDeutscher Hausärzteverband e. V.: Sebastian JohnVertreter der Hochschulmedizin Verband der Universitätsklinika Deutschlands e.V.: Jens BussmannVertreter der Pflegeeinrichtungen und PflegeberufeBundesarbeitsgemeinschaft der Freien Wohlfahrtspflege e.V.: Barbara BoosBundesverband privater Anbieter sozialer Dienste e.V.: Norbert GroteDeutscher Pflegerat: Peter TackenbergDie Bevollmächtigte der Bundesregierung für PflegeClaudia MollDie Bundesbeauftragte für den Datenschutz und die InformationsfreiheitProf. Dr. Louisa Specht-RiemenschneiderDer Patientenbeauftragte der BundesregierungStefan SchwartzeVertreter von BundesbehördenBMWK - Bundesministerium für Wirtschaft und Klimaschutz: Sascha TerheydenBSI - Bundesamt für Sicherheit in der Informationstechnik: Thomas GastVertreter weiterer GruppenBPtK - Bundespsychotherapeutenkammer: Dr. Nikolaus Melcop (Vizepräsident der BPthK)Bundesapothekerkammer: Dr. Hannes MüllerDeutsche Gesetzliche Unfallversicherung e.V. (DGUV): Janine KönigKommission der Europäischen Gemeinschaft, Generaldirektion Informationsgesellschaft und Medien: Peteris ZilgalvisVertreter der Gesellschafter der gematik (Gäste)BMG - Bundesministerium für Gesundheit: Gerlinde Schäfer und Johanna Cana ArenfelsGKV - Spitzenverband Bund der Krankenkassen: Robert LeitlPKV - Verband der Privaten Krankenversicherung: Dr. Florian ReutherBÄK - Bundesärztekammer: Erik Bodendieck (LÄK Sachsen)BZÄK - Bundeszahnärztekammer: Dr. Christian Junge (LZÄK Thüringen)DAV - Deutscher Apothekerverband e. V.: Claudia KorfDKG - Deutsche Krankenhausgesellschaft: Roland Engehausen (Bayerische Krankenhausgesellschaft)KBV - Kassenärztliche Bundesvereinigung: Dr. Philipp StachwitzKZBV - Kassenzahnärztliche Bundesvereinigung: Michael Evelt (KZV Westfalen-Lippe) Digitalbeirat Der Digitalbeirat der Gesellschaft für Telematik ist im Fünften Buch Sozialgesetzbuch (SGB V) § 318a definiert. Aufgabe des Digitalbeirats ist es, die Entwicklungskonzepte der gematik zu bewerten und ihr beratend zur Seite zu stehen. Er wird Handlungsempfehlungen aussprechen, die bei der Umsetzung durch die gematik einbezogen werden und so die Weiterentwicklung der Digitalisierung des Gesundheitswesens aktiv begleiten. Der Digitalbeirat setzt sich zusammen aus Vertreterinnen und Vertretern des Bundesamts für Sicherheit in der Informationstechnik (BSI) und der bzw. dem Bundesbeauftragten für den Datenschutz und die Informationsfreiheit (BfDI) sowie weiteren hochkarätigen Expertinnen und Experten aus Medizin und Ethik. Zudem sind Patienten- und Forschungsvertreterinnen und –vertreter im Digitalbeirat. Prof. Dr. Dennis-Kenji Kipker ist Vorsitzender des Digitalbeirates und Professor für IT-Sicherheitsrecht an der Hochschule Bremen. Christine Vogler ist zur stellvertretenden Vorsitzenden ernannt worden und Präsidentin des Deutschen Pflegerates e. V. Mitglieder des Digitalbeirats BAG SELBSTHILFE - Bundesarbeitsgemeinschaft Selbsthilfe von Menschen mit Behinderungen und chronischer Erkrankung und ihren Angehörigen e. V.: Jana Hassel BfDI - Die Bundesbeauftragte für den Datenschutz und die Informationsfreiheit: Prof. Dr. Louisa Specht-Riemenschneider BSI - Bundesamt für Sicherheit in der Informationstechnik: Claudia Plattner Bundes-AG Digitalisierung des Hausärztinnen- und Hausärzteverbandes: Dr. Kristina Spöhrer Deutscher Pflegerat: Christine Vogler Fachärztin: PD Dr. Maike Henningsen Hochschule Bremen: Prof. Dr. Dennis-Kenji Kipker Universitätsklinikum Essen: Prof. Dr. Dr. Jens Kleesiek Uniklinik Köln: Univ.-Prof. Dr. Michael Hallek Universitätsklinikum Schleswig-Holstein: Prof. Dr. Dr. h.c. mult. Jens Scholz Technische Universität München: Prof. Dr. Alena Buyx © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA'
