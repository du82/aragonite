full_description = 'Erklärvideos Beispiel: Klickdummy Telematik in der Pflege TI-Zugang in der Pflege Stimmen aus der Praxis Downloads Newsletter FAQ Erfahren Sie mehr Inhalte dieser Seite Pflege Gut informiert, besser versorgt Die Zahl der pflegebedürftigen Menschen in Deutschland steigt und die Pflege spielt daher eine immer wichtigere Rolle in der Gesundheitsversorgung. Ihre Arbeit in Krankenhäusern, Pflegeheimen und bei Pflegediensten wird leichter, wenn Sie an der digitalen Infrastruktur des deutschen Gesundheitssystems teilnehmen. Denn die Telematikinfrastruktur (TI) baut Bürokratie in Ihrem Arbeitsalltag ab und verschafft Ihnen mehr Zeit für Ihre Kernaufgabe: die Pflege hilfebedürftiger Menschen. Erklärvideos Video abspielen TI in der Pflege So funktioniert die Anbindung × Video abspielen Heimversorgung Diese Vorteile bietet das E-Rezept × Klickdummy: Digitalisierung in der Pflege In dieser Klickstrecke sehen Sie, wie die ambulante Pflege die verschiedenen Anwendungen der Telematikinfrastruktur nutzen kann: Nutzung des TI-Messengers für interne Abstimmungen Abruf der aktuellen Medikation aus der ePA auf mobilem Endgerät Versenden von Rezeptanforderungen für Folgerezepte mittels KIM Einlösen von E-Rezepten mittels KIM durch die Pflegedienstleitung Öffnen Darstellung von digitalen Anwendungen in der Pflege Mit Klick auf Buttons in dieser Anwendung kann eine Datenübertragung an die Figma, Inc. in die USA statt (sog. Drittseite) erfolgen. Wir haben keinen Zugang zu den Cookies oder anderen Funktionen, die von Figma, Inc. eingesetzt werden, noch können wir diese kontrollieren. Diese Drittseite unterliegt nicht den Datenschutzbestimmungen der gematik. Telematik in der Pflege Weniger Bürokratie Die Telematikinfrastruktur optimiert Arbeits- und Organisationprozesse in der ambulanten und stationären Pflege. Die sektorenübergreifende Kommunikation – etwa mit einer Arztpraxis oder der Kranken- oder Pflegekasse – wird einfacher. Es entfallen zeitintensive und fehleranfällige Abstimmungen rund um Verordnungen und Rezepte, die in Papierform zu Ihnen gelangen. Das spart Zeit, Papier und Aufwand. Weitere Informationen Mehr Zeit für die Menschen Die digitalen Anwendungen geben Ihnen einen schnellen Überblick auf die Kranken- und Behandlungsgeschichte der Menschen, die Sie pflegen und betreuen – sofern diese zustimmen. Der lückenlose Informationsfluss verbessert die Versorgungsqualität und verschafft Ihnen wieder mehr Zeit für die Pflege der auf Sie angewiesenen Menschen. Weitere Informationen Vernetztes Gesundheitswesen Die Telematikinfrastruktur vernetzt Sie mit allen Institutionen des Gesundheitswesens – etwa mit Fach- und Hausarztpraxen, Apotheken, Krankenkassen, Physiotherapiepraxen sowie Reha- und Vorsorgeeinrichtungen. Sie können so bequemer in den Austausch gehen und bekommen schneller und einfacher die für Ihre Arbeit relevanten medizinische Informationen. So funktioniert die TI-Anbindung Mobile Nutzung Die TI-Anwendungen werden künftig verstärkt für den mobilen Einsatz auf Smartphones und Tablets weiterentwickelt. Davon profitieren vor allem ambulante Pflegedienste, die die verschiedenen Anwendungen so ortsunabhängig nutzen können. Weitere Informationen Sichere Kommunikation Die Telematikinfrastruktur setzt auf starken Schutz der Informationssicherheit, damit Sie medizinische Dokumente fälschungs- und rechtssicher austauschen können. Sie erfüllt alle Datenschutzanforderungen, sorgt für eine sichere, verschlüsselte Kommunikation und verhindert, dass Dritte auf sensible Informationen zugreifen können. Weitere Informationen Wie viele Einrichtungen haben eine Karte (SMC-B) für den TI-Zugang beantragt? (Stand: Oktober 2024) unter 20% über 20% rect{fill:url(#MyGradient)} Bayern Baden-Württemberg Thüringen Hessen Rheinland-Pfalz Nordrhein-Westfalen Niedersachsen Bremen Saarland Brandenburg Sachsen Sachsen-Anhalt Mecklenburg-Vorpommern Schleswig-Holstein Hamburg Berlin 30 % 0 % Prozentanteil Pflegeeinrichtungen TI-Gateway: Der neue Weg in die TI Bitte akzeptieren Sie YouTube-Cookies um dieses Video anzuschauen. Einstellungen ändern Infoveranstaltung für Pflegeeinrichtungen gematik digital, November 2024 Stimmen aus der Praxis – KIM (Kommunikation im Medizinwesen) in der Pflege Pflegewerk Berlin Wie Digitalisierung die Pflege entlastet Peter Groeneveld Geschäftsführer, ProSanitas Emden Modellprojekt Overrath Vorteile von KIM für die Pflege Dr. Annette Sommerfeld Chefärztin der Gefäßchirurgie Krankenhaus Reinbek St. Adolf-Stift GmbH Zusätzliche Informationen Auf einen Blick: Die TI-Anbindung von Pflegeeinrichtungen PDF | 189 KB | 27.04.2023 Download Leitfaden / Checkliste für Pflegeeinrichtungen PDF | 503 KB | 16.01.2024 Download Reportage zur Digitalisierung in der Pflege PDF | 237 KB | 19.04.2024 Download Broschüre zum Pflegetag 2024 PDF | 10 MB | 25.11.2024 Download Fragen und AntwortenWas ist KIM?KIM steht für "Kommunikation im Medizinwesen" und ist ein sicherer und datenschutzkonformer Weg, Gesundheits- und Behandlungsdaten per E-Mail weiterzugeben. Nach Vertragsabschluss mit einem KIM-Anbieter können wichtige Dokumente und Nachrichten direkt an alle Leistungserbringer mit einer KIM-Adresse übermittelt werden.Wofür benötige ich einen elektronischen Heilberufsausweis (eHBA)?Der elektronische Heilberufsausweis (eHBA) wird zur Beantragung der Institutionskarte (Security Module Card Typ B-Karte, kurz: SMC-B-Karte) sowie zur persönlichen Identifikation von Mitarbeitenden einer ambulanten bzw. stationären Langzeitpflegeeinrichtung benötigt. Der eHBA ermöglicht den Zugang zur Telematikinfrastruktur und berechtigt somit zur Nutzung der Fachanwendungen, wie z.B. Kommunikation im Medizinwesen (KIM).Wie kann ich eine Institutionskarte (Security Module Card Typ B, kurz: SMC-B-Karte) beantragen?Die SMC-B-Karte kann online von antragsberechtigten Personen beim elektronischen Gesundheitsberuferegister (eGBR) beantragt werden. Es fällt eine Verwaltungsgebühr in Höhe von 40 Euro an. Üblicherweise läuft der Antragsprozess wie folgt ab:Authentifizierung im Antragsportal via Online-Ausweisfunktion, ELSTER-Unternehmenskonto oder BundIDAusfüllen des Onlineantrags und Angabe der Person in Ihrer Einrichtung mit gültigem eHBAAuswahl des Vertrauensdiensteanbieter (VDA=Kartenproduzent)Upload Nachweis der VertretungsberechtigungZahlung der Verwaltungsgebühr via ePaymentBei erfolgreicher Prüfung durch das eGBR erhalten Sie eine E-Mail mit den Ergebnissen und einer VorgangsnummerMit der Vorgangsnummer wird das Antragsverfahren beim Vertrauensdiensteanbieter (VDA=Kartenproduzent) fortgesetzt und dort kostenpflichtig bestelltPersönliche Authentifizierung z. B. via POSTIDENT oder ggf. weiteren Verfahren wie der Online-Ausweisfunktion und Abschluss des AntragsverfahrensPersönliche Zustellung der Institutionskarte (SMC-B-Karte) an die Institutionsadresse bzw. Meldeadresse der vertretungsberechtigten PersonAktivierung und FreischaltungNähere Informationen zur Beantragung einer Institutionskarte (SMC-B-Karte) finden Sie auch auf der Webseite des eGBR:www.bezreg-muenster.de/de/gesundheit_und_soziales/egbr/smcb/index.htmlWie viele elektronische Heilberufsausweise (eHBA) benötigt eine Pflegeeinrichtung?Für die Beantragung einer Institutionskarte (SMC-B-Karte) und die damit verbundene Authentifizierung ist es erforderlich, dass mindestens eine Person in Ihrer Einrichtung einen eHBA besitzt. Die kontinuierliche Weiterentwicklung der Telematikinfrastruktur (TI) und ihrer Fachanwendungen kann es perspektivisch erforderlich bzw. empfehlenswert machen, auch weitere Personen in den Einrichtungen mit einem eHBA auszustatten. Zu diesem Suchbegriff wurde leider kein Eintrag gefunden. Alle Fragen und Antworten Erfahren Sie mehr Die elektronische Gesundheitskarte #c-102 svg path {fill: #fff} .cls-1{fill:#000e52;} Gematik_Piktogramme_elektronisches Rezept Blau E-Rezept: Der schnelle Weg zum richtigen Medikament #c-105 svg path {fill: #fff} .cls-1{fill:#000e52;} Gematik_Piktogramme_ KIM: Schnell und sicher kommunizieren © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA'
