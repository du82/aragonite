title = "Digitale Gesundheit in Europa | gematik"
full_description = '''Digitale Gesundheit in Europa Mit einem digitalisierten Gesundheitswesen sorgen wir für eine bessere Versorgung der Patientinnen und Patienten sowie für viele Erleichterungen im Alltag des medizinischen Personals. Das haben auch viele unserer europäischen Nachbar- und Partnerländer erkannt. Mit unserer übersichtlichen Europa-Karte erfahren Sie, wie der Stand der Digitalisierung im Gesundheitswesen ausgewählter Länder in Europa ist. Details Norwegen E-Rezept Einführung ab 2011 In der Regelversorgung ja Verbreitungsgrad 92% Einlösung mit dem Personalausweis bzw. Identitätsdokument; Vollmacht bei Einlösung für jemand anderen Zugang Über das Portal "helsenorge.no" ePA Name Kjenejournal/Pasientjournal Einführung ab 2011 Wahlfreiheit (Opt-In oder Opt-Out) Opt-out Zugriff über… (App/Website/etc.) Helse Norge Webportal Authentifizierung eID und Smartcard Digitale Identitäten Name MinID, BankID, BuypassID, Commfides Identifizierungsprozess Nationale Registernummer (MinID), Mobiltelefon (BankID), Aktivierungsbrief (BuypassID, Commfides) Anmeldung App mit Zwei-Faktorauthentifizierung: Passwort und SMS (MinID, BankID) oder Pushnachricht (BuypassID, Commfides) Vertrauensniveau substanziell bis hoch je nach Verifizierung und Anbieter Norwegen "In Norwegen hat jeder Bürger seinen festen Hausarzt. Termine macht man telefonisch oder über das Online-Buchungssystem der Praxis. Einige Dienste und Krankenhäuser sind schon etwas weiter: Sie sind landesweit digital vernetzt. So kann man über das Gesundheitsportal „Helsenorge“ z.B. seine Kliniktermine, Untersuchungsergebnisse, Impfungen und Teile der Krankenakte einsehen. Zum Login benutzt man seine BankID. Das ist eine elektronische Identität, die man von der Bank bekommt und die für viele staatliche Dienstleistungen gilt. Das ist sehr praktisch – besser wäre es nur noch, wenn alle Gesundheitsdienste an das Portal angebunden wären. Besonders einfach funktionieren immerhin die Rezepte: Der Arzt stellt sie elektronisch aus. Anschließend sind sie automatisch auf meiner nationalen ID-Nummer hinterlegt. Ich muss nur meinen Ausweis in der Apotheke vorzeigen, schon bekomme ich meine Medikamente." Jenny Sørvold, Botschaftssekretärin, Berlin Schweiz E-Rezept Einführung ab 2022 In der Regelversorgung teilweise Verbreitungsgrad anbieterabhängig Einlösung Kein staatliches Angebot; Angebot verschiedener privatwirtschaftlich organisierter Anbieter; je nach Anbieter QR-Code Zugang E-Rezepte können nicht digital eingesehen und verwaltet werden ePA Name Elektronisches Patientendossier (EPD) Einführung ab 2017 Wahlfreiheit (Opt-In oder Opt-Out) Opt-in Zugriff über… (App/Website/etc.) Webportal je nach gewählter Stammgemeinschaft Authentifizierung Zertifizierte eID je nach Stammgemeinschaft (Cloud Trust, Swiss Sign, Genève ID, VaudID) Digitale Identitäten Name Staatliche eID Identifizierungsprozess In Entwicklung (frühestens ab 2026) Anmeldung N/A Vertrauensniveau N/A Schweiz "Es gibt zwar das elektronische Patientendossier bei uns, aber es wird nur wenig genutzt. In der ganzen Schweiz gibt es gerade einmal 20.000 Nutzer. Das liegt zum einen daran, dass das Dossier bisher nur für Krankenhäuser verpflichtend war und erst kürzlich der ambulante Bereich dazugekommen ist. Zum anderen muss man aktiv einwilligen (Opt-in). Dennoch regle ich meine Arztangelegenheiten digital – über die App „Medgate“. Das ist ein großer privater Anbieter, den viele Krankenkassen in der Schweiz nutzen. In der App kann ich Rezepte anfordern, eine Telekonsultation buchen, mit einem Arzt chatten und sogar Fotos hochladen. Künftig möchte ich aber auch das elektronische Patientendossier nutzen. Für den Zugang brauche ich nur meine SwissID. Das ist die sichere Online-Identität in der Schweiz. Dann muss ich meine Befunde nicht mehr eigenständig bei Ärzten abfragen und privat bei mir auf dem Rechner ablegen." Axel Nemetz (57 Jahre), Healthcare-Berater, Zürich Niederlande E-Rezept Einführung ab 2014 In der Regelversorgung ja Verbreitungsgrad verpflichtend Einlösung PIN/Code Zugang Keine einheitliche staatliche Lösung ePA Name Persönliche Gesundheitsumgebung (PGO) Einführung ab 2023 Wahlfreiheit (Opt-In oder Opt-Out) Opt-in Zugriff über… (App/Website/etc.) Dezentrale Anbieterstruktur; 16 zertifizierte Anbieter mit "Medmij" Label Authentifizierung Anmeldung über Authentifizierungs-Anwendungen wie die IRMA-App (ein eID-System) Digitale Identitäten Name DigiD Identifizierungsprozess Bürgerservicenummer, Meldeadresse und Mobiltelefon Anmeldung Webportal oder App Vertrauensniveau Substanziell bis hoch je nach Identifizierung Niederlande "We don't have a nationwide electronic health record yet. However, I can access some of my health data through my family doctor's website, such as my medical history at this practice, my medications, and brief findings from other healthcare facilities. I can also contact my doctor and request online consultations. However, all of this no longer works when I have to see a different doctor. It's not networked yet. When I had to have surgery recently, it was much more digital. The hospital had its own app, which I used to fill out the pre-op questionnaire, for example. I can also access my findings there. Overall, the system could be much more user-friendly. A complete network of health data would make sense. At least the prescriptions are uncomplicated: my family doctor simply sends them electronically to the pharmacy around the corner, where I can then pick up the medication." Jos van Genderen, TV-Producer, Amsterdam Irland E-Rezept Einführung ab In Entwicklung In der Regelversorgung nein Verbreitungsgrad N/A Einlösung N/A ePA Name National Shared Record Einführung ab In Entwicklung Wahlfreiheit (Opt-In oder Opt-Out) Opt-out Zugriff über… (App/Website/etc.) N/A Authentifizierung N/A Digitale Identitäten Name MyGovID Identifizierungsprozess Basis Account: Name, Passwort, E-Mail; Verifizierter Account: Personal Public Service Nummer, Public Services Card, Mobiltelefon Anmeldung Webportal oder App Vertrauensniveau Noch nicht notifiziert Irland "Wir sind noch weit von einer digitalen Patientenversorgung entfernt. Ich habe zwar eine App meiner Krankenkasse. Die ist aber eher administrativ. Ich kann dort Arzttermine anfragen oder Arztrechnungen einreichen. Alles, was mit der Gesundheitsversorgung selbst zu tun hat, läuft noch ziemlich analog. Zwar hat mein Hausarzt eine elektronische Akte von mir, aber eine landesweit funktionierende elektronische Patientenakte gibt es nicht. Lediglich meine Rezepte werden schon digital abgewickelt. Mein Hausarzt schickt diese einfach per E-Mail an meine Stammapotheke. Mit einer standardisierten Lösung für alle hat das aber nichts zu tun, es ist einfach ein Service meiner Arztpraxis. Das ist es auch, was mich grundlegend stört. Ich hätte gern alles digitalisiert, damit man nicht jedes Mal bei einem neuen Arzt seine Krankengeschichte erzählen muss. Und natürlich hätte ich gern App, in der ich meine medizinischen Daten selbst nachschauen kann – das wäre ideal!" Mario Kuhnert, Customer Success Manager, bei Dublin, Irland Tschechien E-Rezept Einführung ab 2018 In der Regelversorgung ja Verbreitungsgrad Verpflichtend Einlösung Ausdruck, E-Rezept-App, SMS, E-Mail ePA Name N/A Einführung ab N/A Wahlfreiheit (Opt-In oder Opt-Out) N/A Zugriff über… (App/Website/etc.) N/A Authentifizierung N/A Digitale Identitäten Name eDoklady Identifizierungsprozess In Entwicklung (Einführung ab 2024 geplant) Anmeldung N/A Vertrauensniveau N/A Slowakei E-Rezept Einführung ab 2018 In der Regelversorgung ja Verbreitungsgrad Verpflichtend Einlösung Krankenversicherungskarte, Personalausweis mit Chip (eID) ePA Name Elektronická zdravotná knižka (EZK) Einführung ab 2018 Wahlfreiheit (Opt-In oder Opt-Out) Opt-out (Akte durch Leistungserbringer geführt) Zugriff über… (App/Website/etc.) Webportal (nationales Gesundheitsportal (NPZ)) Authentifizierung Personalausweis mit elektronischem Chip (eID), elektronischer Wohnsitznachweis (eDoPP) Digitale Identitäten Name eID Card Identifizierungsprozess Personalausweis mit Chip, Aufenthaltskarte mit Chip Anmeldung Installierter eID Client auf dem PC (Personalausweis), Webportal Slovensko.sk (Aufenthaltskarte) Vertrauensniveau Hoch Slowakei "Besonders digitalisiert ist das Gesundheitswesen in der Slowakei noch nicht. Das elektronische Rezept aber, das in Deutschland recht neu ist, haben wir schon seit mehreren Jahren. Und das funktioniert auch sehr gut. Der Hausarzt überträgt das Rezept, wie in Deutschland, einfach auf die Krankenkassenkarte. Mit dieser geht man dann in die Apotheke und löst es ein. Hier hört die Digitalisierung aber auch schon auf. Eine elektronische Patientenakte gibt es meines Wissens noch nicht. Der Hausarzt hat seine eigene elektronische Datenverwaltung. Diese ist aber nicht zentral vernetzt und ich als Versicherte kann auch nicht darauf zugreifen. Dabei wäre das schon gut, wenn es das in Zukunft gäbe – alle Informationen an einem Ort! Immerhin bieten die Apps der Krankenkassen ein paar Funktionen. Dort kann man z. B. seine Rezepte einsehen und sich erinnern lassen, falls man sie noch nicht eingelöst hat." Livia Matyiova, Studentin, derzeit Berlin, zuvor Košice Slowenien E-Rezept Einführung ab 2016 In der Regelversorgung ja Verbreitungsgrad 94% (2020) Einlösung Krankenversichertenkarte (wird in Zukunft vom neuen Personalausweis abgelöst) ePA Name zVEM Portal Einführung ab 2022/2023 Wahlfreiheit (Opt-In oder Opt-Out) Opt-out (Akte durch Leistungserbringer geführt) Zugriff über… (App/Website/etc.) zVEM Webportal, App Authentifizierung SI-Pass (eID) Digitale Identitäten Name SI-Pass, eOsebna Identifizierungsprozess Account mit E-Mail (SI-Pass); verifizierte Zertifikate oder NFC-fähiger Personalausweis (eOsebna) Anmeldung Installierter eID Client auf dem PC (Personalausweis), Webportal Slovensko.sk (Aufenthaltskarte) Vertrauensniveau Hoch Lettland E-Rezept Einführung ab 2018 In der Regelversorgung ja Verbreitungsgrad Verpflichtend Einlö