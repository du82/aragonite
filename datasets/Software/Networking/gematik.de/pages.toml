description = """
Abschlussbericht Sicherheitsanalyse des Gesamtsystems  ePA für alle (Frauenhofer SIT)                                                                                                                                                                                PDF | 1 MB | 10.10.2024"""
full_description = "Vorteile Inhalte für Nutzergruppen Erklärvideos Klickstrecke: Medikationsprozess Sicherheitsarchitektur Widerspruch Dokumente FAQ Erfahren Sie mehr Inhalte dieser Seite Zum Webshop Start der ePA für alle Kostenlose Infopakete für Praxen, Kliniken und Apotheken Zur Bestellung ePA für alle Es ist soweit: Die neue elektronische Patientenakte, die ePA für alle startet. Sie ermöglicht, dass die Digitalisierung im deutschen Gesundheitswesen den nächsten Schritt nehmen kann. In der elektronischen Patientenakte werden die relevanten, medizinischen Daten von Patientinnen und Patienten gespeichert – und das nach den höchsten Sicherheitsstandards. Auf dieser Themenseite finden Sie wichtige Informationen für die medizinischen Nutzergruppen, die mit der ePA für alle arbeiten werden. Am 15. Januar startet die Pilotphase der ePA für alle in ausgewählten Einrichtungen in den Modellregionen der gematik (Hamburg und Umland sowie Franken) sowie in den KV-Regionen Westfalen-Lippe und Nordrhein. Was die Pilotphase der ePA für alle genau bedeutet und wie es um die bundesweite Einführung der elektronischen Patientenakte steht, erfahren Sie in diesem FAQ und auf unserer ePA-News Seite: FAQ ePA-Pilotierung ePA-News VorteileAutomatisch angelegtDie neue ePA für alle ist die sogenannte Opt-Out-Version der elektronischen Patientenakte. Bislang war es so, dass alle Patientinnen und Patienten selbst eine ePA bei ihrer Krankenkasse beantragen mussten. Das ist in Zukunft nicht mehr der Fall. Dann wird für alle gesetzlich Versicherten in Deutschland automatisch eine elektronische Patientenakte angelegt – außer, sie widersprechen. Auch Privatversicherten kann die ePA angeboten werden.Gesundheitsdaten werden nutzbarIn der ePA für alle werden relevante Gesundheitsdaten gebündelt und für den Versorgungsalltag nutzbar gemacht. Denn diese Daten liegen nun übersichtlich vor und können deutlich einfacher von Heilberuflerinnen und Heilberuflern eingesehen werden. Die Patientin bzw. der Patient muss nicht mehr jeden Zugriff auf die ePA einzeln freigeben – im Behandlungskontext können Sie bei gesetzlich Versicherten auch ohne die explizite Zustimmung auf die Daten zugreifen. Voraussetzung ist immer, dass die Patientin bzw. der Patient nicht widersprochen hat.Versorgung wird individuellerDie ePA für alle verschafft dem behandelnden medizinischen Personal besseren Überblick. Durch den schnellen Zugriff auf die Gesundheitsdaten können Ärztinnen, Apotheker und Pflegekräfte ihre Patientinnen und Patienten noch individueller behandeln und so beispielsweise die Therapie besser auf Vorerkrankungen abstimmen oder einfacher Koexistenzen zwischen Krankheiten erkennen.Daten zeitgemäß geschütztDie ePA für alle bekommt eine neue Sicherheitsarchitektur, die nach modernsten Standards funktioniert. Daten werden nur verschlüsselt in die ePA übertragen und sind dort für niemanden erreichbar – nicht einmal für die Krankenkassen als Betreiber des ePA-Aktensystems. Nur Patientinnen und Patienten selbst oder zugriffsberechtigte Heilberuflerinnen und Heilberufler haben die Möglichkeit, Daten aus der ePA für alle abzurufen. Die Sicherheitsarchitektur verhindert zudem, dass schädliche Daten in die ePA für alle gelangen können. Alle Infos für verschiedene Nutzergruppen auf einen Blick Uns ist bewusst, dass das Gesundheitswesen vielfältig ist und mehr Berufsgruppen umfasst als hier aktuell dargestellt. Aus diesem Grund wird die Themenseite kontinuierlich weiter ausgebaut und erweitert, so dass zum Beispiel für die Nutzergruppe der Praxen ein zielgerichtetes Angebot unter anderem für Medizinische Fachangestellte, Psychotherapeuten, Haus- und Fachärzte geschaffen werden wird. Praxen Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Praxen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Krankenhäuser Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Krankenhäuser, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Zahnarztpraxen Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Zahnarztpraxen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Apotheken Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Apotheken, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Pflege Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Plegeeinrichtungen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Reha Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Rehaeinrichtungen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Erklärvideos Video abspielen Vorteile Diese Vorteile bringt die ePA für alle × Video abspielen Die neue ePA für Privatversicherte Funktionen und Vorteile × Video abspielen Sicherheit So ist die ePA gegen unberechtigte Zugriffe geschützt × Video abspielen Virenschutz So ist die ePA gegen Schadsoftware geschützt × Video abspielen Suchfunktion So findet man Infos in der ePA × Klickstrecke: Medikationsprozess in der ePA In dieser Klickstrecke sehen Sie beispielhaft, wie der digital gestützte Medikationsprozess als ein zentrales Element der ePA für alle umgesetzt werden kann. Die Einsichtnahme der elektronischen Medikationsliste in zwei Praxisverwaltungssystemen, in einem Apothekenverwaltungssystem und in einer fiktiven ePA-App werden am Beispiel des Patienten Vincent Wagner illustriert. Öffnen Darstellung der elektronischen Medikationsliste in der ePA anhand einer Patientenreise Mit Klick auf Buttons in dieser Anwendung kann eine Datenübertragung an die Figma, Inc. in die USA statt (sog. Drittseite) erfolgen. Wir haben keinen Zugang zu den Cookies oder anderen Funktionen, die von Figma, Inc. eingesetzt werden, noch können wir diese kontrollieren. Diese Drittseite unterliegt nicht den Datenschutzbestimmungen der gematik. Die Sicherheitsarchitektur der ePA für alle Forschung mit ePA-Daten Verbesserung von Versorgung und Forschung Die Gesundheitsdaten in der ePA für alle haben ein enormes Potenzial für die Verbesserung der Versorgung. Deshalb können die Daten aus der ePA für alle für Zwecke, die im Interesse der Gesellschaft sind (öffentliches Interesse), genutzt werden. Das umfasst zum Beispiel Forschung, Verbesserung der Versorgungsqualität und -sicherheit, Prävention, aber auch statistische Zwecke der Gesundheitsberichterstattung. Die Daten werden im Aktensystem pseudonymisiert und an das FDZ übermittelt. Personenbezogen Daten erhält das FDZ Gesundheit somit nicht. Zusammen mit der Vertrauensstelle (RKI) sorgen Aktensystem und FDZ Gesundheit dafür, dass keine Rückschlüsse auf die konkreten Patienten möglich sind. Bürgerinnen und Bürger, die die Daten nicht bereitstellen wollen, können dem widersprechen – in der ePA-App oder über die Ombudsstellen der Krankenkassen. Antrag beim FDZ-Gesundheit Wer die Daten für die erlaubten Zwecke nutzen will, muss einen Antrag beim FDZ-Gesundheit stellen. Das FDZ Gesundheit prüft die Anträge auf Nutzungszwecke für die Datennutzung und entscheidet, ob die Daten bereitgestellt werden. Die Entscheidung darüber erfolgt anhand gesetzlich festgelegter Kriterien. Es werden an die Nutzenden nur aggregierte, anonymisierte Daten herausgegeben. Die hohen IT-Sicherheits- und Datenschutzstandards des FDZ Gesundheit zur Sicherung der Daten sind mit dem BSI und dem BfDI abgestimmt. Widerspruch Wer nicht möchte, dass seine Gesundheitsdaten in der ePA für alle gespeichert werden, kann Widerspruch einlegen. Wie funktioniert der Widerspruch? Widerspruch gegen… Wo lege ich Widerspruch ein? Was ist die Folge? Anlegen der ePA für alle Krankenkasse Es wird keine ePA angelegt. bestehende ePA ePA-App oder Krankenkasse/ Krankenversicherung Das bestehende ePA-Aktenkonto einschließlich aller Inhalte wird gelöscht. Die Nutzung der ePA ist nicht mehr möglich. Zudem werden alle Daten im Forschungsdatenzentrum Gesundheit (bspw. für die Forschung oder Zwecke im öffentlichen Interesse) gelöscht. Zugriff auf ePA durch eine med. Einrichtung ePA-App oder Ombudsstelle der Krankenkasse Die jeweilige med. Einrichtung kann bis auf Widerruf nicht mit der ePA arbeiten. Daten aus der aktuellen Behandlungssituation werden nicht in die ePA übertragen. Einstellen von Dokumenten durch eine med. Einrichtung Mündlich während der Behandlung, z.B. während des Arztbesuchs * Die jeweilige medizinische Einrichtung befüllt die ePA nicht mit Daten und Dokumenten aus der aktuellen Behandlung. Teilnahme am digital gestützten Medikationsprozess ePA-App oder Ombudsstelle der Krankenkasse E-Rezept-Daten werden weiterhin übermittelt und sind für die Patientin bzw. den Patienten in der Medikationsliste einsehbar. Die Medikationsliste ist aber für med. Einrichtungen nicht einsehbar. Bis dahin gespeicherte Daten für den Medikationsplan (eMP) und die Arzneimitteltherapiesicherheit (AMTS) werden gelöscht. Automatisiertes Einstellen von E-Rezept-Daten ePA-App oder Ombudsstelle der Krankenkasse Daten aus dem E-Rezept-Fachdienst werden nicht in die ePA übertragen und, wenn bereits vorhanden, gelöscht. Auch Daten zum eMP und AMTS werden, falls vorhanden, gelöscht. Zugriff einzelner med. Einrichtungen auf den digital gestützten Medikationspozesses Während der Behandlung, z.B. während des Arztbesuchs Das Personal in einzelnen med. Einrichtungen kann nicht auf den digital gestützten Medikationsprozess in der ePA für alle (Medikationsliste und Medikationsplan) zugreifen. (ab ePA-Version 3.1) Einstellen von Abrechnungsdaten durch die Krankenversicherung ePA-App oder der Krankenkasse/ Krankenversicherung Es werden keine (weiteren) Abrechnungsdaten in das ePA-Aktenkonto der Patientin bzw. des Patienten geladen. Sekundärnutzung ePA-App oder Ombudsstelle der Krankenkasse Es werden keine Versorgungsdaten mehr an das Forschungsdatenzentrum Gesundheit weitergeleitet. Alle bereits weitergeleiteten Daten werden gelöscht. *Für die Speicherung von Ergebnissen genetischer Untersuchungen oder Analysen des Gendiagnostikgesetzes (§353 (3) SGB V) ist eine schriftliche Einwilligung für die Patientin bzw. den Patienten notwendig. Dokumente Gematik_Piktogramme_Bericht Blau Kopie 2 Abschlussbericht Sicherheitsanalyse des Gesamtsystems ePA für alle (Frauenhofer SIT) PDF | 1 MB | 10.10.2024 Download FAQKönnen Patientinnen und Patienten jedes Dateiformat in die ePA hochladen?Nein, in die ePA können keine willkürlichen Dateiformate geladen werden.Was passiert mit den Daten, wenn ich sie aus der ePA lösche?Wenn Daten aus der ePA gelöscht werden, sind diese endgültig gelöscht. Zum Löschen von Daten können im übrigen auch Ärztinnen und Ärzte beauftragt werden, sofern und soweit diese Zugriff auf Ihre ePA haben. Dabei gilt nach wie vor: Ärztinnen und Ärzte können zusätzlich noch eigene Kopien oder Unterlagen angefertigt haben, welche von der Löschung in der ePA nicht betroffen sind und ggf. separat gelöscht werden müssen.Wie funktioniert die Vertretung durch Dritte in der ePA für ältere Menschen, die selbst kein Smartphone besitzen?Es ist möglich, bis zu fünf Vertreterinnen und Vertreter in der ePA zu benennen. Es braucht kein eigenes Smartphone, solange die Vertreterin bzw. der Vertreter ein Smartphone hat. Allerdings müssen Sie sich einmal persönlich mit der Vertreterin bzw. dem Vertreter treffen und sich dabei über ein Authentifizierungsmittel identifizieren, um die Vertretung einzurichten.Was machen ältere Patienten ohne einen Computer oder ein Handy? Wie funktioniert die ePA für Sie?Grundsätzlich benötigt man als Patientin oder Patient keinen Computer und kein Handy für die ePA. Wer Daten selbst verwalten möchte, benötigt dazu die App der eigenen Krankenkasse. Wer das nicht möchte, kann beispielsweise Vertreter:innen einrichten lassen - wie Familienangehörige. Für Widersprüche (z.B. wenn man einer Institution gar keinen Zugriff auf die ePA geben möchte) kann man sich außerdem an die Ombudsstelle der jeweiligen Krankenkasse wenden. Werden Dokumente automatisch in die ePA geladen oder können Ärztinnen und Ärzte selbst entscheiden, was sie in die ePA laden wollen?Nein, Dokumente werden nicht automatisch in die ePA geladen. Die einzigen Daten, die tatsächlich automatisch in die ePA gelangen, sind E-Rezept-Daten für die Medikationsliste. Zu diesem Suchbegriff wurde leider kein Eintrag gefunden. Alle FAQ Erfahren Sie mehr Sie haben weitere Fragen? Zum Kontaktformular #c-522 svg path {fill: #fff} .cls-1{fill:#fff;} Gematik_Piktogramme_Information Weiß ePA für alle - Informationen für Versicherte #c-523 svg path {fill: #fff} .cls-1{fill:#fff;} Gematik_Piktogramme_Information Weiß ePA für alle - Informationen der KBV © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
