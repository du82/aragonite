title = "Interoperabilität | gematik"
description = """
Das Kompetenzzentrum für Interoperabilität im Gesundheitswesen (KIG)                                                                                            In Kürze                                                                                                                                                                                        PDF | 2 MB | 22.04.2024                                                                                                                                    Download"""
full_description = "Aktuelle Probleme und Störungen TI-Status WhatsApp-Kanal der gematik Aktuelle Probleme und Störungen Interoperabilität im Gesundheitswesen Datenaustausch leicht gemacht Die digitale Vernetzung im Gesundheitswesen schreitet mit schnellen Schritten voran. Das Ziel: eine noch bessere medizinische Versorgung. Was es dafür braucht, ist der schnelle und einfache Austausch von Patientendaten. Das gilt vor allem über IT-Systeme und Sektoren hinweg, etwa zwischen Arztpraxis, Krankenhaus und Apotheke. Damit der reibungslose Datenaustausch gelingt, sorgt die gematik für einheitliche Schnittstellen und Standards, kurz: für Interoperabilität. Das Kompetenzzentrum für Interoperabilität im Gesundheitswesen Das Kompetenzzentrum für Interoperabilität im Gesundheitswesen (KIG) taktet, fördert und fordert bessere Standards in der Medizin und arbeitet eng mit verschiedenen Institutionen und Stakeholdern zusammen - im Sinne des Mandats im Digitalgesetz. Mit dem Interop Council sind fundierte Beraterinnen und Berater an der Seite des KIG. Außerdem erweitert der Expertenkreis das Netzwerk, um gemeinsam die verschiedenen Aktivitäten im Kontext der Interoperabilität zu harmonisieren. Das Kompetenzzentrum übernimmt dabei die ganzheitliche Ende-zu-Ende-Prozessverantwortung. Das Kompetenzzentrum ist bei der gematik angesiedelt und eine logische Weiterentwicklung auf Basis der Arbeit der bisherigen Koordinierungsstelle für Interoperabilität. Das Mandat des KIG umfasst insbesondere folgende Aufgaben: zentrale Koordinierung und Priorisierung von Bedarfen Entwicklung, Beauftragung und Festlegung von Standards, Profilen, Leitfäden, Informationsmodellen, Referenzarchitekturen und Softwarekomponenten Zertifizierung von Primärsystemen mittels Konformitätsbewertung (KOB), ob verbindliche Standards konform umgesetzt wurden transparente Öffentlichkeitsarbeit durch den Betrieb und die Weiterentwicklung der Wissensplattform INA sowie Listung von KOB-zertifizierten Systemen Organisation und Administration aller notwendigen Prozesse der Zusammenarbeit und Nachhalten der Ergebnisse und Berichte für das Bundesministerium für Gesundheit (BMG) INA – die nationale Wissensplattform für Interoperabilität Die Wissensplattform Interoperabilitäts-Navigator INA ist die zentrale Anlaufstelle für Interoperabilität in der digitalen Medizin. Co-Creation mit vielfältigen Expert:innen Das Interop Council ist ein interdisziplinäres Expertengremium, das thematische Vorbereitungen, fachliche Bewertungen und Empfehlungen für eine bessere Interoperabilität in Deuschland in Zusammenarbeit mit dem Kompetenzzentrum einbringt. Es repräsentiert die unterschiedlichen Bereiche im Gesundheitswesen und bewertet und priorisiert in einer gemeinsamen 360-Grad-Betrachtung die spezifischen Herausforderungen und Probleme für den interoperablen Datenfluss und die Datennutzung in der Medizin. Gemeinsam erfolgt eine fachliche und versorgungsorientierte Einordnung von Interoperabilitätsthemen, auf deren Basis das Kompetenzzentrum dann verbindliche Vorgaben an das BMG empfiehlt. Der IOP-Expertenkreis umfasst derzeit über 260 Expertinnen und Experten, die sich in unterschiedlichen Formaten, wie z. B. Arbeitskreisen zu verschiedenen Themenstellungen, engagieren und sich somit für eine stärkere Versorgungsnähe sowie Nutzerzentriertheit einsetzen. -> Mehr zu Mitwirkungsmöglichkeiten Roadmap des Interop Councils DownloadsDas Kompetenzzentrum für Interoperabilität im Gesundheitswesen (KIG) In Kürze PDF | 2 MB | 22.04.2024 Download The competence centre for Interoperability in Healthcare In short PDF | 2 MB | 22.04.2024 Download Roadmap Interop Council 2024-2025 Schaubild PNG | 206 KB | 02.05.2024 Download © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
