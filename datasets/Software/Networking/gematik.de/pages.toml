full_description = '''RSS-Newsfeed Pressekontakt Im Fokus Bilder, Grafiken und Logos Social Media Inhalte dieser Seite ePA News ePA News Updates zur ePA-Pilotierung Jetzt informieren Newsroom Presseinfos, Materialien & Social Media 1 2 3 … 38 › 21.01.2025Aktuelles| CompuGroup Medical erhält Zulassung für TI-Messengerweiterlesen17.01.2025Aktuelles | Pilotphase: Erste Eindrücke aus der Modellregion Hamburg & UmlandNeuer Newsbereich zur ePA für alle weiterlesen16.01.2025Aktuelles | Aktensystemhersteller RISE und IBM zugelassenweiterlesen15.01.2025Aktuelles | ePA für alle startet in drei Modellregionenweiterlesen30.12.2024Aktuelles | Aufzeichnungen der Veranstaltung "gematik trifft" mit dem DAV sind onlineweiterlesen 1 2 3 … 38 › Datum von Datum bis Ihre Suche Finden RSS-Newsfeed kostenlos abonnieren Was ist ein RSS-Feed? RSS steht für Really Simple Syndication und ermöglicht Inhalte in einem standardisierten Format zur Verfügung zu stellen. Dieses RSS Format kann von RSS-Readern oder anderen Webseiten und E-Mail Programmen verarbeitet und angezeigt werden. Im Gegensatz zu HTML-Seiten enthalten RSS-Dateien keine Design- und Layout-Elemente. Zum Lesen des RSS-Formats nutzen Sie bitte einen entsprechenden RSS-Reader Martin Schmalz | Leiter Kommunikation Pressekontakt Unser Team der Pressestelle erreichen Sie per E-Mail oder telefonisch. Senden Sie uns Ihre Anfragen gerne per E-Mail zu. Sie erhalten möglichst zeitnah eine Eingangsbestätigung bzw. eine Rückmeldung von unserem Team. E-Mail: presse@gematik.de Telefon: +49 30 400 41-441 Im Fokus Mediathek In unserer Mediathek bieten wir Ihnen Bildmaterial, Grafiken, Logos und Videos kostenfrei zur redaktionellen Verfügung an. Details zu den Nutzungsrechten finden Sie in der entsprechenden Rubrik. Eine kleine Auswahl der Medien finden Sie auch weiter unten in unserem Logo- und Fotoservice. TI-Dashboard Das TI-Dashboard zeigt transparent die relevantesten Schlüsselkennzahlen der Anwendungen der Telematikinfrastruktur (TI) auf ei