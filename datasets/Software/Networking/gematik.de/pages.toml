full_description = "Corporate Governance Verantwortungsvolle und werteorientierte Unternehmensführung Corporate Governance bildet in der gematik GmbH die zentrale Grundlage für eine verantwortungsvolle und werteorientierte Unternehmensführung, eine effiziente Zusammenarbeit von Geschäftsführung und Verwaltungsausschuss, Transparenz in der Berichterstattung sowie ein angemessenes Risikomanagement. Seit dem die Bundesrepublik Deutschland (vertreten durch das Bundesministerium für Gesundheit) im Mai 2019 als Mehrheitsgesellschafter in die gematik GmbH eingetreten ist, orientiert sich die gematik GmbH als Bundesunternehmen an den Grundsätzen guter Unternehmens- und Beteiligungsführung im Bereich des Bundes - dem Public Corporate Governance Kodex. Im Rahmen dieser Verpflichtung veröffentlicht die gematik GmbH einen jährlichen Corporate Governance Bericht. Hier können Sie die Berichte downloaden: Corporate Governance Bericht 2023 Download Corporate Governance Bericht 2022 Download Corporate Governance Bericht 2021 Download Corporate Governance Bericht 2020 Download Corporate Governance Bericht 2019 Download © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
