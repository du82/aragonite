["https://gematik.de/anwendungen/epa-fuer-alle/praxen"]
title = "Praxen | gematik"
full_description = 'Print-Infopaket Vorteile für Praxen Downloads für Praxen Erklärvideos Klickstrecke: Medikationsprozess & ePA im Alltag Statement aus der Praxis Infoveranstaltung Mitschnitte unserer Veranstaltungen FAQ Inhalte für Nutzergruppen Erfahren Sie mehr Inhalte dieser Seite Zum Webshop Start der ePA für alle Kostenlose Infopakete für Praxen, Kliniken und Apotheken Zur Bestellung ePA für alle Praxen Auf dieser Themenseite finden Sie wichtige Informationen für Praxen, die mit der ePA für alle arbeiten werden. In der ePA für alle werden relevante medizinische Daten Ihrer Patientinnen und Patienten einfacher zugänglich. Ab Januar werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Jede und jeder Versicherte hat die Möglichkeit dem zu widersprechen. Auch private Krankenversicherer können ihren Versicherten die ePA für alle anbieten. Durch die ePA für alle bekommen Sie viele neue Möglichkeiten im Praxisalltag. Auf dieser Seite erfahren Sie, was Sie mit der ePA für alle erwartet und finden vermehrt auch Infomaterialien zum Download. Print-Infopaket ePA-Infopaket: Jetzt kostenlos im Shop bestellen! Gut informiert in Richtung ePA-Start: Plakate, Flyer und Handouts kostenfrei und bequem über unseren Shop bestellen und zur Informationen Ihrer Patientinnen und Patienten nutzen. Zum gematik-Shop Vorteile für PraxenGesundheitsdaten sind im Versorgungsalltag zugänglichMit der ePA für alle können Ärztinnen und Ärzte im Versorgungsalltag direkt auf die medizinischen Daten der Patientinnen und Patienten zugreifen. Voraussetzung ist, dass die Patientin oder der Patient dem Zugriff nicht widersprochen hat. Für privatversicherte Patientinnen erfolgt der Zugriff nur auf Anfrage.Versorgung wird individuellerArztbriefe, Bildbefunde, Laborbefunde und Operationsberichte: All das kann künftig in der ePA gebündelt werden. So liegen Ihnen auch die gesammelten Informationen von ärztlichen Kolleginnen und Kollegen vor – ohne Hinterherzutelefonieren. Vorerkrankungen sind in der ePA dokumentiert, aber auch Koexistenzen zwischen zwischen Krankheiten lassen sich schneller feststellen.Behandlungskontext flexibel verlängernDer Behandlungskontext dauert standardmäßig 90 Tage an. Patientinnen und Patienten können sich aber dafür entscheiden, Ihnen über die 90 Tage hinaus Zugriff auf ihre elektronische Patientenakte, mithilfe ihrer ePA-App, zu geben. Das ist vor allem für Hausärztinnen und -ärzte von Vorteil. So können Sie jederzeit Zugriff die behandlungsrelevanten Daten Ihrer Patientinnen und Patienten einsehen. Medikation wird übersichtlichIn der Medikationsliste, die in der ePA integriert ist, werden alle verschriebenen und eingelösten Rezepte einer Patientin bzw. eines Patienten angezeigt. Probleme oder Wechselwirkungen können so schneller erkannt werden. In einem zukünftigen Update wird auf der Medikationsliste aufbauend der Medikationsplan zur ePA hinzugefügt. Beispielsweise können dann die Informationen institutionsübergreifend gepflegt und mit Einnahmehinweisen ergänzt werden.Daten sind geschütztDie ePA für alle funktioniert nach modernen Sicherheitsstandards. Daten werden nur verschlüsselt in die ePA übertragen und sind dort für niemanden erreichbar. Nur Patientinnen und Patienten selbst oder zugriffsberechtigte Heilberuflerinnen und Heilberufler haben die Möglichkeit, Daten aus der ePA für alle abzurufen. Downloads für Praxen Infomaterialien für Praxen In unserem Download-Portal finden Sie Infomaterialien, Erklärvideos und Grafiken zum Herunterladen. Zum Download-Portal Erklärvideos Video abspielen Die ePA für alle in Arztpraxen Vorteile und Use Cases auf einen Blick × Video abspielen Die neue ePA für Privatversicherte Funktionen und Vorteile × Video abspielen Medikationsliste in der ePA für alle Besserer Überblick für das medizinische Personal × Video abspielen Suchfunktion in der ePA für alle So finden Sie relevante Informationen × Video abspielen Technische Umsetzung der ePA für alle So könnte die neue ePA im PVS aussehen × Klickstrecke: Medikationsprozess & ePA im Alltag Öffnen Medikationsprozess in der ePA In dieser Klickstrecke sehen Sie beispielhaft, wie der digital gestützte Medikationsprozess umgesetzt werden kann. Die Einsichtnahme der elektronischen Medikationsliste in zwei Praxisverwaltungssystemen, in einem Apothekenverwaltungssystem und in einer fiktiven ePA-App werden am Beispiel eines Patienten illustriert. Mit Klick auf Buttons in dieser Anwendung kann eine Datenübertragung an die Figma, Inc. in die USA statt (sog. Drittseite) erfolgen. Wir haben keinen Zugang zu den Cookies oder anderen Funktionen, die von Figma, Inc. eingesetzt werden, noch können wir diese kontrollieren. Diese Drittseite unterliegt nicht den Datenschutzbestimmungen der gematik. Öffnen ePA im Alltag In dieser Klickstrecke sehen Sie beispielhaft, wie Medizinische Fachangestellte und Ärztinnen und Ärzte die ePA im Alltag nutzen können. Folgen Sie den Schritten mit folgenden Inhalten: Zugriff auf die ePA, Dokumentenübersicht (suchen, filtern, sortieren), Widerspruch gegen das Hochladen, Dokumente hochladen, Einstellungen im PVS Mit Klick auf Buttons in dieser Anwendung kann eine Datenübertragung an die Figma, Inc. in die USA statt (sog. Drittseite) erfolgen. Wir haben keinen Zugang zu den Cookies oder anderen Funktionen, die von Figma, Inc. eingesetzt werden, noch können wir diese kontrollieren. Diese Drittseite unterliegt nicht den Datenschutzbestimmungen der gematik. Dr. Andreas C. große Bockhorn zur ePA für alle Infoveranstaltung "gematik digital: ePA für alle - Praxen" Bitte akzeptieren Sie YouTube-Cookies um dieses Video anzuschauen. Einstellungen ändern Die gematik hat zusammen mit der Kassenärztlichen Bundesvereinigung (KBV) am 2. Oktober 2024 zur ePA für alle für Praxen informiert. Hier finden Sie den Mitschnitt der Veranstaltung. Weitere Veranstaltungen Mitschnitte unserer Veranstaltungen Wie genau funktioniert die ePA für alle in Praxen? Welche konkreten Veränderungen und Anforderungen kommen auf Arztpraxen zu und wie können Sie sich darauf vorbereiten? Fragen wie diese klären wir im Rahmen unserer digitalen Infoveranstaltungen zur Einführung der ePA für alle. Die Aufzeichnungen der Veranstaltungen inkl. der Aufzeichnungen von Breakout-Sessions zur Demonstration der ePA-Integration in den PVS-Systemen einzelner Hersteller finden Sie hier: Mitschnitte Praxen FAQWas ist die maximale Dateigröße bei einem Upload in die ePA?Dokumente können nur hochgeladen werden, wenn sie eine Größe von 25 MB nicht überschreiten. Können privat Versicherte eine elektronische Patientenakte (ePA) erhalten, obwohl sie keine elektronische Gesundheitskarte (eGK) haben?Ja, privat Versicherte können eine ePA erhalten, auch wenn sie keine eGK haben. Versicherte müssen über die ePA-App ihrer privaten Krankenversicherung dann die Zugriffsrechte für die Leistungserbringerinstitutionen aktiv erteilen. Ist es möglich, dass ein Dokument nur für ausgewählte Ärztinnen und Ärzte auf sichtbar gestellt werden kann?Nein, es ist nicht möglich, ein einzelnes Dokument nur für bestimmte Ärztinnen und Ärzte bzw. für bestimmte medizinische Einrichtungen sichtbar zu stellen. Ein Verbergen ist immer nur für alle Institutionen möglich.Ist es technisch möglich, eine größere Menge an Dokumenten gemeinsam herunterzuladen?Technisch ist es möglich, mehrere Dokumente zusammen herunterzuladen.Mit welchen Sicherungsmechanismen stellen Praxen und Krankenhäuser sicher, dass Mitarbeitende nicht illegal Daten herunterladen können?Hier gelten die gleichen Sicherungsmechanismen, die auch erforderlich sind, wenn ein Krankenhaus Zugang zu den Patientenakten im Krankenhaus-Informationssystem gewährt. Wenn eine Person in einer Einrichtung auf die ePA zugreifen will, muss sie sich authentisieren. Das funktioniert über die sogenannte Institutionskarte, die SMC-B-Karte. Damit identifiziert sich die Person gegenüber dem ePA-System als Teil einer medizinischen Institution. Im zweiten Schritt prüft die Akte selbst zuerst, ob ein Behandlungskontext für die jeweilige Einrichtung besteht. Dieser gilt ab Stecken eGK vor Ort oder ab Freischaltung des Zugriffsrechts in der ePA-App für standardmäßig 90 Tage. In diesem Zeitraum besteht damit das Zugriffsrecht auf die jeweilige ePA. Der Zeitraum kann in der ePA-App allerdings auch beendet oder verlängert werden. Zu diesem Suchbegriff wurde leider kein Eintrag gefunden. Alle FAQ Alle Infos für verschiedene Nutzergruppen auf einen Blick Übersicht Auf unserer Übersichtsseite finden Sie allgemeine Informationen für die medizinischen Nutzergruppen, die mit der ePA für alle ab Januar 2025 arbeiten werden. Krankenhäuser Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Krankenhäuser, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Zahnarztpraxen Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Zahnarztpraxen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Apotheken Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Apotheken, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Pflege Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Plegeeinrichtungen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Reha Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Rehaeinrichtungen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Erfahren Sie mehr Sie haben weitere Fragen? Zum Kontaktformular #c-522 svg path {fill: #fff} .cls-1{fill:#fff;} Gematik_Piktogramme_Information Weiß ePA für alle - Informationen für Versicherte #c-523 svg path {fill: #fff} .cls-1{fill:#fff;} Gematik_Piktogramme_Information Weiß ePA für alle - Informationen der KBV © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA'
