title = "Praxen | gematik"
description = """
Einsatz eGK/SMC-B/HBA in Praxen                                                                                                                                                                                PDF | 642 KB | 01.12.2023"""
full_description = "Vorteile für Praxen Karteneinsatz in Praxen elektronische Ersatzbescheinigung Video: elektronische Ersatzbescheinigung Online Check-in Erklärfilme zu Ihren Anwendungen Video: Komfortsignatur Downloads Erfahren Sie mehr Inhalte dieser Seite Praxen Mehr Zeit für das Wichtige Zum Webshop Start der ePA für alle Kostenlose Infopakete für Praxen, Kliniken und Apotheken Zur Bestellung Immer mehr Patientinnen und Patienten, immer weniger Zeit: Praxen brauchen neue Lösungen, um die anstehenden Herausforderungen zu meistern. Digitale Anwendungen sind das richtige Hilfsmittel, um diesen Herausforderungen erfolgreich entgegenzutreten. Deshalb ist Digitalisierung für Praxen wichtig In den Praxen laufen die Fäden im Gesundheitswesen zusammen. Sie müssen organisieren und kommunizieren, damit Patientinnen und Patienten jederzeit bestens versorgt sind. Dazu ist es notwendig, dass sensible Informationen schnellstmöglich einsehbar sind und sicher von A nach B kommen. Die digitalen Anwendungen der Telematikinfrastruktur helfen dabei. Sie verkürzen Kommunikationswege, helfen bei der internen Organisation und ermöglichen neue Angebote für die Patientinnen und Patienten, wie zum Beispiel Videosprechstunden. So kann die Digitalisierung dabei helfen, effizienter zu arbeiten und medizinischem Personal neue Freiräume zu ermöglichen. Gewinnen Sie Zeit und behalten den ÜberblickDigitale Anwendungen wie die elektronische Patientenakte geben Ihnen einen guten Überblick über die Gesundheitsgeschichte Ihrer Patientinnen und Patienten – sofern diese zustimmen.Wechseln Patientinnen und Patienten zu Ihnen, können Sie alle Diagnosen und Befunde einsehen, die Ihnen freigeschaltet werden.Weitere InformationenDie Telematikinfrastruktur (TI) vernetzt Sie schnell und sicher mit anderen Arztpraxen, Apotheken und Krankenhäusern. Medizinische Informationen, die für die Behandlung von Patientinnen und Patienten benötigt werden, sind einfacher verfügbar. So gewinnen Sie wertvolle Zeit für das Wichtigste: die Diagnostik und Behandlung Ihrer Patientinnen und Patienten.So funktioniert die TI-Anbindung Im Ernstfall schnell eingreifenIn Notfällen profitieren Ihre Patientinnen und Patienten. Wichtige Informationen – wie zum Beispiel Vorerkrankungen – können auf der elektronischen Gesundheitskarte gespeichert werden. So haben Notfallärztinnen und -ärzte Wissen parat, das Leben retten kann.Weitere InformationenStellen Sie Rezepte schneller ausDie Einführung des E-Rezepts ermöglicht es Ihnen, Rezepte mit wenigen Klicks zu erstellen. Das bedeutet für Sie: keine handschriftlichen Unterschriften mehr, keine unnötigen Wege innerhalb der Praxis zur Unterzeichnung von Rezepten und weniger Papierausdrucke.Weitere Informationen Die Kommunikation ist sicher Die TI setzt auf starke Mechanismen der Informationssicherheit. Die sichere, verschlüsselte Kommunikation sowie der Schutz vor dem Zugriff auf sensible Informationen sind das Fundament aller Anwendungen. Weitere Informationen Mehr Informationen, besserer Überblick Digitale Anwendungen wie die elektronische Patientenakte geben Ihnen einen guten Überblick über die Gesundheitsgeschichte Ihrer Patientinnen und Patienten – sofern diese zustimmen. Wechseln Patientinnen und Patienten zu Ihnen, können Sie alle Diagnosen und Befunde einsehen, die Ihnen freigeschaltet werden. Mit dem Start der ePA für alle im Januar 2025 wird die Anwendung in der Breite verfügbar und bietet unter anderem durch die integrierte Medikationsliste viele Vorteile. Informationen zur ePA für alle Erfahren Sie hier mehr über den Karteneinsatz von eGK, SMC-B und HBA in Ihrer Praxis 1. Versicherten­stamm­daten­management (VSDM) eGK im Kartenlesegerät um... eGK steckt SMC-B aktiviert eHBA obligatorisch QES obligatorisch 01.1 Nachweis des Versicherungsverhältnisses des Patienten und Übernahme Versichertenstammdaten ins PVS ja ja nein nein 2. E-Rezept eGK im Kartenlesegerät um... eGK steckt SMC-B aktiviert eHBA obligatorisch QES obligatorisch 02.1. E-Rezept anlegen und inhaltlich prüfen nein* ja nein nein 02.2 E-Rezept signieren nein ja ja ja 3. Notfalldatenmanagement (NFDM) eGK im Kartenlesegerät um... eGK steckt SMC-B aktiviert eHBA obligatorisch QES obligatorisch 03.1 Notfalldaten im PVS anlegen nein* nein nein nein 03.2 Notfalldaten von der eGK lesen ja** ja nein nein 03.3 Notfalldaten signieren nein nein ja ja 03.4 Notfalldaten auf eGK speichern ja ja nein nein 4. Elektronischer Medikationsplan (eMP) eGK im Kartenlesegerät um... eGK steckt SMC-B aktiviert eHBA obligatorisch QES obligatorisch 04.1 Medikationsplan im PVS anlegen nein* nein nein nein 04.2 eMP von der eGK lesen ja*** ja nein nein 04.3 eMP auf eGK speichern ja*** ja nein nein 5. KIM-Nachricht eGK im Kartenlesegerät um... eGK steckt SMC-B aktiviert eHBA obligatorisch QES obligatorisch 05.1 KIM Nachrichten versenden / empfangen über das KIM-Postfach der Einrichtung nein ja nein nein 05.2 KIM Nachrichten versenden / empfangen über das persönliche KIM-Postfach des Heilberuflers nein ja ja nein 6. Elektronische Arbeitsunfähigkeitsbescheinigung (eAU) eGK im Kartenlesegerät um... eGK steckt SMC-B aktiviert eHBA obligatorisch QES obligatorisch 06 Elektronische Arbeitsunfähigkeitsbescheinigung (eAU) 06.1 eAU im PVS anlegen nein* nein nein nein 06.2 eAU signieren nein ja**** ja ja 06.3 eAU versenden nein ja nein nein 7. Elektronischer Arztbrief (eArztbrief) eGK im Kartenlesegerät um... eGK steckt SMC-B aktiviert eHBA obligatorisch QES obligatorisch 07.1 Elektronischen Arztbrief anlegen nein* nein nein nein 07.2 Elektronischen Arztbrief signieren nein nein ja ja 07.3 Elektronischen Arztbrief versenden nein ja nein nein 8. Elektronische Patientenakte (E-PA) eGK im Kartenlesegerät um... eGK steckt SMC-B aktiviert eHBA obligatorisch QES obligatorisch 08.1 Adhoc-Berechtigung für eine ePA anfordern (wenn keine ePA-App) ja ja nein nein 08.2 ePA öffnen / Dokumente anzeigen / Dokumente ablegen nein ja nein nein Elektronische Ersatzbescheinigung (eEB) kann als Versicherungsnachweis genutzt werden Wenn die Gesundheitskarte beim Praxisbesuch nicht eingelesen werden kann, können die Versicherten ihre Versichertendaten an die Praxis mit der elektronischen Ersatzbescheinigung (eEB) übermitteln lassen. Die Anwendung ist derzeit noch freiwillig. Ab Juli 2025 wird sie verpflichtend für Arztpraxen und Krankenkassen. Mehr dazu bei der Kassenärztlichen Bundesvereinigung (externer Link). Video: Einchecken mit der elektronischen Ersatzbescheinigung (eEB) Bitte akzeptieren Sie Video Cookies um dieses YouTube-Video anzuschauen. Einstellungen ändern Versicherte, die ihre Gesundheitskarte (eGK) beim Praxisbesuch nicht dabeihaben, können ihre eEB selbst bei der Krankenkasse anfordern und der Praxis vorlegen. Das funktioniert ganz einfach dank dem Einscannen des QR-Codes der Praxis, den diese z. B. als Ausdruck auf dem Tresen oder auf ihrer Internetseite bereitstellt. Den QR-Code kann sich eine Praxis unter www.praxis-check-in.de selbst generieren lassen und herunterladen. Online Check-in für Privatversicherte Privatversicherte können per Versicherten-App (sofern die private Krankenversicherung an dem Verfahren teilnimmt) eine Praxis auswählen und ihre Daten sicher via KIM an diese schicken lassen. Das geschieht mittels „Online Check-in“. Dieser dient vor allem einer einmaligen Übermittlung der Krankenversichertennummer. Denn diese benötigen Praxen, um für Privatversicherte E-Rezepte auszustellen und die elektronische Patientenakte (ePA) zu befüllen. QR-Code der Praxis für die Datenübermittlung der Versicherten Nehmen Sie bereits am KIM-Verfahren teil und Ihre Praxissoftware unterstützt die Anwendung „Online Check-in“ (sprechen Sie im Zweifel Ihren Praxisverwaltungssoftware-Hersteller an), dann erstellen Sie für die Datenübermittlung seitens der oder des Versicherten aus Ihrer KIM-Adresse den individuellen QR-Code für Ihre Praxis. Stellen Sie diesen dann auf Ihrer Website oder in Ihren Räumen bereit. Die Patientinnen und Patienten können ihn scannen und die Datenübermittlung selbst per App anstoßen, so dass die Krankenversicherung die Daten an die Praxis übermitteln kann. Den Code bzw. das pdf zum Ausdrucken können Sie hier generieren. Erklärfilme zu Ihren Anwendungen Notfalldaten Die elektronische Patientenakte Das E-Rezept Video: Komfortsignatur Bitte akzeptieren Sie YouTube-Cookies um dieses Video anzuschauen. Einstellungen ändern Downloads Einsatz eGK/SMC-B/HBA in Praxen PDF | 642 KB | 01.12.2023 Download Broschüre: Digital unterwegs - Tipps für Zahnarztpraxen PDF | 1 MB | 06.01.2023 Download Broschüre: Digital unterwegs - Tipps für Ihren Praxisalltag PDF | 1 MB | 30.11.2022 Download Erfahren Sie mehr Die elektronische Gesundheitskarte #c-68 svg path {fill: #fff} .cls-1{fill:#000e52;} Gematik_Piktogramme_ KIM: Schnell und sicher kommunizieren #c-67 svg path {fill: #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_TI-Messenger_Blau Kopie 4 TI-Messenger: Schnelle Nachrichten in Echtzeit © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
