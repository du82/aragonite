title = "Rehabilitation | gematik"
description = "Folien gematik digital: TI für Reha-Einrichtungen vom 08.11.2023"
full_description = "Anwendungen Anwendungsfälle Stimmen aus der Praxis Anschluss an die TI Finanzierung gematik digital - Aufzeichnung Downloads Bayerische Pilotprojekte Newsletter Inhalte dieser Seite Reha Weniger Bürokratie, optimale Rehabilitation Medizinische Rehabilitation ist in unserem Gesundheitssystem zentral: Mehr als 1.000 Reha-Einrichtungen kümmern sich jährlich um die Genesung von etwa zwei Millionen Menschen. Seit 2021 können Sie als Reha-Einrichtung Teil der Telematikinfrastruktur (TI) – der digitalen Infrastruktur des deutschen Gesundheitssystems – werden. Medizinische Informationen sind für Sie dann einfacher und unabhängig von Ort und Zeit verfügbar. Und Sie können Behandlungen besser planen und abstimmen. Die wichtigsten Anwendungen für Reha- und Vorsorgeeinrichtungen Die wichtigsten TI-Anwendungen zur Unterstützung von Reha- und Vorsorgeeinrichtungen können Kommunikation im Medizinwesen (KIM), das Versichertenstammdaten-Management (VSDM), die elektronische Patientenakte (ePA) und später der TI-Messenger sein. #c-7672-141 svg path {fill: #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_ KIM Schnell und sicher kommunizieren #c-7672-142 svg path {fill: #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_Patientenakte 2 Blau ePA für alle Mehr Informationen, besserer Überblick #c-7672-143 svg path {fill: #010e52} .cls-1{fill:#fff;} Gematik_Piktogramme_Versichertenstammdatenmanagement_Weiss Kopie VSDM Stets auf dem aktuellen Stand #c-7672-144 svg path {fill: #010e52} .cls-1{fill:#fff;} Gematik_Piktogramme_TI-Messenger_Blau Kopie 7 TI-Messenger Schnelle Nachrichten in Echtzeit Konkrete Anwendungsfälle In Rehabilitations- und Vorsorgeeinrichtungen gibt es eine Vielzahl an Anwendungsfällen, bei denen die vorgestellten TI-Anwendungen zu einem sicheren, schnellen und einfachen Austausch von Informationen beitragen können. Die TI-Anwendungen können genutzt werden, um … medizinische Dokumentationen und Bilddaten von niedergelassenen Praxen, Kliniken und Laboren zu empfangen, die Schweigepflichtsentbindung von Patientinnen und Patienten an eine Praxis zu übermitteln, neue Patientinnen und Patienten mit der elektronischen Gesundheitskarte (eGK) elektronisch zu erfassen und die bestehenden Stammdaten abzugleichen, Entlassbriefe an den haus- oder fachärztlichen Bereich zu übermitteln, um eine nahtlose ambulante Weiterbehandlung der Patientinnen und Patienten zu ermöglichen. Stimmen aus der Praxis „Die TI-Anwendungen bieten uns zukünftig einen Mehrwert in der täglichen Arbeit. Besonders relevant sind für uns der Abgleich der Versichertenstammdaten, der Maildienst KIM und die ePA. Dank der Finanzierungsvereinbarung können wir unsere Kliniken mit den benötigten Komponenten ausstatten. So können wir die „freiwillige“ Phase der Anbindung nutzen, damit wir später nicht kurzfristig handeln müssen.“ Marcel Feret, zuständig für das Qualitätsmanagement in der Holding der Johannesbad Gruppe, Bayern Anschluss an die TI: Institutionskarte (SMC-B Reha) beantragen Als Vorsorge- und Rehabilitationseinrichtung können Sie die Beantragung der SMC-B Reha bei der zuständigen Kartenherausgeberin Deutsche Krankenhaus TrustCenter und Informationsverarbeitung GmbH (DKTIG) starten. Die DKTIG informiert auf ihrer Internetpräsenz unter dktig.de/smc-b/smc-b-reha/ umfassend zu Fragen der Beantragung und Nutzung der SMC-B Reha und welche Anbieter SMC-B Sie auswählen können. Nach Freigabe Ihres Antrages durch die DKTIG produziert der von Ihnen gewählte Anbieter SMC-B die Karte und stellt Ihnen diese sowie den dazugehörigen PIN-Brief postalisch zu. Nach Erhalt der SMC-B Reha können Sie dann die Karte in 2 Schritten in Betrieb nehmen. Diese 2 Schritte heißen Freischaltung und Aktivierung. Mit der Freischaltung schalten Sie SMC-B Reha im Antragsportal des entsprechenden Anbieters SMC-B frei. Bei der Aktivierung legen Sie Ihre persönliche PIN für die SMC-B Reha fest. Dazu nutzen Sie die so genannte Transport-PIN aus dem PIN-Brief. Weitere Informationen zum TI-Anschluss Finanzierung Im Rahmen der TI-Anbindung des Öffentlichen Gesundheitsdienstes entstehen für die teilnehmenden Einrichtungen sowohl Ausstattungs- als auch Betriebskosten. Mit einer Finanzierungsvereinbarung erhalten Reha- und Vorsorgeeinrichtungen eine Regelung, zu welchen Konditionen sie sich an die Telematikinfrastruktur anbinden können. Weitere Informationen: https://dktig.de/telematikinfrastruktur-finanzierungsvereinbarung-reha-unterzeichnet gematik digital: TI für Reha-Einrichtungen Video abspielen gematik digital: TI für Reha-Einrichtungen November 2023 × Bitte akzeptieren Sie YouTube-Cookies um dieses Video anzuschauen. Einstellungen ändern Mitschnitt der Veranstaltung vom 08.11.2023 Video abspielen gematik digital: TI-Gateway für Reha-Einrichtungen November 2024 × Bitte akzeptieren Sie YouTube-Cookies um dieses Video anzuschauen. Einstellungen ändern Mitschnitt der Veranstaltung vom 08.11.2023 Folien gematik digital: TI für Reha-Einrichtungen vom 08.11.2023 Download Downloads Onboardingcheckliste für Reha-Einrichtungen PDF | 2 MB | 08.11.2023 Download Bayerische Pilotprojekte Wie der Anschluss an die Telematikinfrastruktur (TI) praktisch funktioniert, haben fünf Reha-Kliniken und 20 niedergelassene Hausärztinnen und Hausärzte im Rahmen des vom Freistaat Bayern geförderten und von der OTH-Regensburg zusammen mit Monks – Ärzte im Netz GmbH durchgeführten Forschungsprojekts „Reha-/TI-Konsil“ getestet. Einige Reha-Kliniken haben in diesem Zuge Erfahrungen mit KIM (Kommunikation im Medizinwesen) gemacht. Die Luitpoldklinik Heiligenfeld und die Rosengartenklinik Heiligenfeld haben an dem Projekt teilgenommen. Sibylle Feyerabend, Leiterin Heiligenfeld Services / Heiligenfeld GmbH, sagt: „Das Hin und Her auf Papier ist nicht mehr zeitgemäß. Mit KIM muss ich Informationen nicht mehr hinterherlaufen, sondern unsere Ärzte können sie direkt Kolleginnen und Kollegen bereitstellen und von ihnen erhalten. Das hilft bei der übergreifenden Behandlung gemeinsamer Patientinnen und Patienten sehr. Im ambulanten Bereich sind TI-Anbindung und KIM weitgehend angekommen. Aber noch nutzen es zu wenige Kliniken bzw. Reha-Einrichtungen. Das muss viel mehr werden, damit es sich durchsetzt.“ Eruiert wurde auch eine Konsil-Anwendung für den Austausch medizinischer Informationen zwischen niedergelassenen Hausärztinnen und Hausärzten und Reha-Kliniken. Dabei ging es sowohl um die Vorbereitung als auch um die Begleitung und Nachsorge einer Reha-Maßnahme. Die Konsil-Anwendung war die erste WANDA-Smart Anwendung mit Hosting innerhalb der TI. Die Konsile wurden in Kooperation mit den medizinischen Fachverbänden konzipiert. Aus dem Projekt, das 2022 abgeschlossen wurde, ist ein Leitfaden entstanden. Mit Best Practice-Tasks soll das Handout anderen Einrichtungen bundesweit den Einstieg in die digitale Medizin erleichtern. Die DKTIG, die die benötigten TI-Smartcards für Reha- und Vorsorgeeinrichtungen bereitstellt, hat den Leitfaden auf ihrer Webseite veröffentlicht. Inzwischen (Stand 2023) läuft bereits ein Folgeprojekt. Auch dieses wird wieder von der bayerischen Staatsregierung gefördert. Projektseite Reha-TIKonsil: https://www.reha-ti-konsil.de Projektpartner und Literaturverweise Prof. Dr. Georgios Raptis, Jennifer Wolter: „Leitfaden zur Anbindung einer Reha-Einrichtung an die Telematikinfrastruktur. Digitales Rehabilitationskonsil mit Anbindung an die Telematik-Infrastruktur (Reha/TI-Konsil)“ (Stand: Oktober 2022), veröffentlicht auf der DKTIG-Website: https://dktig.de/wp-content/uploads/2023/02/Leitfaden-Anbindung_RehaEinrichtung_Reha-TI-Konsil.pdf Haug, Sonja; Scharf, Anna (2022): Auf dem Weg zur Telematikinfrastruktur. Erfassung und Evaluierung des Digitalisierungsgrades bayerischer Rehabilitationseinrichtungen im Projekt „Reha-/TI-Konsil“. Projektbericht. Regensburg: OTH Regensburg. DOI: http://dx.doi.org/10.13140/RG.2.2.20714.39361 Haug, Sonja; Scharf, Anna (2022): Auf dem Weg zur Telematikinfrastruktur. Erfassung und Evaluierung des Digitalisierungsgrades bayerischer Rehabilitationseinrichtungen im Projekt „Reha-/TI-Konsil“. Executive Summary. Regensburg: OTH Regensburg. DOI: http://dx.doi.org/10.13140/RG.2.2.32458.44484 „Reha-TIKonsil“ Projektkonsortium: OTH Regensburg (Ostbayerische Technische Hochschule Regensburg): Prof. Dr. Sonja Haug und ihr Team haben den Grad der Digitalisierung von Reha-Kliniken in Bayern erhoben und Empfehlungen an die Politik erarbeitet. Prof. Dr. Georgios Raptis hat mit seinem Team das Projekt wissenschaftlich betreut und u. a. einen Leitfaden für die TI-Anbindung einer Reha-Einrichtung entwickelt. Monks - Ärzte im Netz GmbH aus München ist für die Konzeption des Konsils inkl. Software-Entwicklung und -Betrieb verantwortlich. Projektförderung: Bayerisches Staatsministerium für Gesundheit und Pflege (StMGP) Projekt- und Kooperationspartner: Bayerischer Hausärzteverband (BHÄV) Deutsche Krankenhaus TrustCenter und Informationsverarbeitung GmbH (DKTIG) Verband der Privatkrankenanstalten in Bayern e. V. (VPKA Bayern) 5 Reha-Kliniken sowie 20 niedergelassene Hausärzt:innen an verschiedenen Standorten in Bayern Die Konsile wurden in Kooperation mit den medizinischen Fachverbänden konzipiert. Die gematik GmbH ist die Betreibergesellschaft der TI und hat das Projekt fachlich unterstützt. © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
