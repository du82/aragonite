["https://gematik.de/anwendungen/e-rezept/faq"]
title = "FAQ | gematik"
description = """
Patienteninfo: Einlösewege                                                Download"""
full_description = 'Häufig gestellte Fragen und Antworten Infomaterialien & FAQ Ihrer InteressenvertretungPatienteninfo: Einlösewege Download Kurz erklärt: Wie funktioniert das E-Rezept Download Checkliste: E-Rezept für Praxen Download Diese Rezepttypen können Sie als E-Rezept verordnen Download FAQ der KBV für Praxen FAQ der KZBV für Zahnarztpraxen FAQ des BfdI für Patienten FAQ der ABDA für Apotheken Fragen von und für Patienten finden Sie hier. Fragen und AntwortenFilter für Fragen und AntwortenSuche zurücksetzenSuchen Praxen Krankenhäuser Apotheken Pflege App E-Rezept erstellen E-Rezept einlösen E-Rezept abrechnen E-Rezept Inhalte/-Typen Direktzuweisung IT-Ausstattung PKV Signatur / HBA Service Stabilität Alle öffnen Kann ich das E-Rezept bei einer Anschlussheilbehandlung der Reha-Einrichtung direkt zusenden?Nein. Direktzuweisungen sind generell verboten, bis auf wenige in ApoG §11 genannte Ausnahmen.Kann eine Verordnung im Rahmen von künstlichen Befruchtungen nach §27a SGBV als E-Rezept ausgestellt werden?Grundsätzlich können über das E-Rezept auch Verordnungen im Rahmen von künstliche Befruchtungen erstellt werden (https://www.gematik.de/media/gematik/Medien/E-Rezept/Infomaterial/gematik_eRezept_Medikamente_Praxen_RGB-1.pdf). Da die Benutzeroberfläche je nach Praxissoftware unterschiedlich ist, erkundigen Sie sich bitten beim Support ihres Herstellers, um zu erfahren wie sie diese Verordnungen als E-Rezept ausstellen können. Es wird das erwartete E-Rezept bei der Einlösung nicht angezeigt?!Ein E-Rezept ist erst verfügbar, wenn ausstellende Ärzt*innen das Rezept elektronisch signieren. Einige Praxen signieren E-Rezepte erst zum Ende der Sprechstunde als Stapel. Das kann dazu führen, dass das gewünschte E-Rezept für Patient*innen und Apotheker*innen noch nicht sichtbar ist. Zudem ist es denkbar, dass das Rezept zwar signiert, es jedoch durch den/die jeweilige/n Ärzt*in noch nicht versendet wurde (trotzdem dies, wie von der gematik empfohlen, in den meisten Arztsystemen untrennbar miteinander verbunden sein sollte). Sprechen Sie dazu direkt mit dem/die verordnende/n Ärzt*in.Das E-Rezept beinhaltet nicht das erwartete Medikament?Sollte das E-Rezept als Freitextverordnung ausgestellt worden sein, ist es möglich, dass Warenwirtschaftssysteme in Apotheken den Freitext interpretieren und eine unpassende Arzneimittelauswahl vorschlagen. Wir empfehlen: prüfen Sie, um welche Rezeptart es sich handelt und gleichen Sie den genauen Verordnungsinhalt mit dem Vorschlag des Warenwirtschaftssystems ab.Können E-Rezepte auch in Apps von Apotheken (mit dem CardLink) eingelöst werden?Mit „eHealth-CardLink“ lässt sich ein E-Rezept in Apps von Apotheken bzw. Versandapotheken mit der Gesundheitskarte (eGK) ohne PIN einlösen. Dafür brauchen Versicherte nur ein Smartphone und eine kontaktlose eGK, die sie an der 6-stelligen Kartenzugangsnummer und dem Symbol für drahtlose Übertragung erkennen. Versicherte erhalten die Gesundheitskarte bei ihrer Krankenkasse.eHealth-CardLink kommt bei der mobilen Nutzung des E-Rezepts als Übergangstechnologie befristet zum Einsatz. Für zukünftige Anwendungen soll vorrangig die GesundheitsID genutzt werden. Diese können Patientinnen und Patienten bereits heute in der E-Rezept-App der gematik nutzen, um das E-Rezept bei ihrer Wunschapotheke einzulösen. Die GesundheitsID ist auch der sichere Zugang zu weiteren Anwendungen wie der elektronischen Patientenakte. Mein Kunde möchte nicht alle Rezepte bei mir einlösen. Kann ich die Rezepte wieder zurückgeben? Bitte geben Sie auf jeden Fall alle Rezepte zurück, die Sie nicht selbst beliefern. Ansonsten kann der Kunde die Rezepte nicht in einer anderen Apotheke oder zu einem späteren Zeitpunkt einlösen.Siehe auch FaktencheckMuss ich die Gesundheitskarte meines Kunden jedes Mal einlesen oder kann ich sie für meine Stammkunden auch in meinem System speichern?Die Gesundheitskarte muss jedes Mal erneut eingelesen werden. Das soll sicherstellen, dass der Patient oder ein Vertreter auch wirklich die Apotheke berechtigen, die E-Rezepte abzurufen. Ist die Zuzahlungspflicht im E-Rezept gespeichert? Können Versicherte den Status durch Vorlage des Befreiungsausweises beeinflussen? Es gelten die Regeln wie beim Papierrezept. Im Anforderungskatalog für Primärsysteme der Ärzte gemäß SGB V §73 für Verordnungssoftware (Anlage 23 BMV-Ärzte) sind hierzu Pflichtangaben hinterlegt. Dass ein Befreiungsausweis vorlag, können Sie in der Apotheke aber auch als zusätzliche Angabe zur Abgabe (Freitext) dokumentieren. Formale Korrekturen und Ergänzungen bei den Abgabedaten sind bis zur Übermittlung an das Apothekenrechenzentrum möglich. (Quelle: DAV, Stand: 15.06.21) Kann ich bei einem E-Rezept auch ein Wunscharzneimittel abgeben, wenn der Patient das möchte? Kann der Patient eine Kopie des Rezepts für die Abrechnung mit privaten Zusatzversicherungen erhalten? Sie können in Ihrem Warenwirtschaftssystem einen Ausdruck für den Patienten erstellen, der alle erforderlichen Informationen beinhaltet. Siehe hierzu § 15 b) www.gkv-spitzenverband.de/media/dokumente/krankenversicherung_1/arzneimittel/rahmenvertraege/apotheken/2021-10-01_AM_RV_129_Abs.2_SGBV_redaktionelle_Gesamtfassung_Stand_01102021.pdf Die Medikation des Patienten hat sich geändert. Kann ich die Mehrfachverordnung noch anpassen? Die Teile der Mehrfachverordnungen können nicht nachträglich geändert werden. Sie müssen alle exakt den gleichen Inhalt enthalten. Wenn sich die Medikation des Patienten ändert, können Sie die noch nicht eingelösten Teile der Mehrfachverordnung löschen und neue Rezepte (ggf. als Mehrfachverordnung) ausstellen. Kann ich selbst entscheiden, wie lange die einzelnen Teile einer Mehrfachverordnung gültig sind? Verordnende Ärztinnen/Ärzte können je einzelner Teilverordnung eine Gültigkeit "von" und "bis" individuell festlegen. Maximal sind Teilverordnungen so bis zu 365 Tage ab Ausstellungsdatum gültig, sofern der verordnende Arzt keine andere Gültigkeit festgelegt hat. Ihr System sollte Sie dabei unterstützen, übliche Gültigkeitszeiträume (wie z.B. 1 Monat oder 3 Monate) automatisch auszurechnen. Müssen die einzelnen Verordnungsbestandteile einer Mehrfachverordnung alle gleich sein?JaMüssen Ärzte jeden Teil einer Mehrfachverordnung extra signieren?Jede Teilverordnung wird vom verordnenden Arzt signiert. Mit der Komfortsignatur erfolgt das schnell in einem Vorgang. Wie viele Rezepte umfasst eine Mehrfachverordnung?Eine Mehrfachverordnung kann maximal vier inhaltsgleiche E-Rezepte umfassen. Warum sollte ich eine Mehrfachverordnung ausstellen? Aus der Mehrfachverordnung ergeben sich Vorteile für Patienten und die Abläufe in Arztpraxen, da die Rezepte für Dauermedikationen im Voraus ausgestellt werden können und somit Wege zur Arztpraxis zum Rezepte-Abholen entfallen. Kann der Heilberufsausweis auch im Kartenlesegerät stecken bleiben? Für die Nutzung der Komfortsignatur ist dies erforderlich. Daher sollte das Kartenterminal für den Heilberufsausweis an einem zugriffsgesicherten oder permanent beaufsichtigten Ort stehen. Was ist eine Mehrfachverordnung?Mehrfachverordnungen sollen die Versorgung mit Arzneimittel für chronisch Kranke erleichtern. Hierfür wurde in § 31 Absatz 1b SGB V die Grundlage geschaffen: „Für Versicherte, die eine kontinuierliche Versorgung mit einem bestimmten Arzneimittel benötigen, können Vertragsärzte Verordnungen ausstellen, nach denen eine nach der Erstabgabe bis zu dreimal sich wiederholende Abgabe erlaubt ist. Die Verordnungen sind besonders zu kennzeichnen. Sie dürfen bis zu einem Jahr nach Ausstellungsdatum zu Lasten der gesetzlichen Krankenkasse durch Apotheken beliefert werden.“ Aus der Mehrfachverordnung ergeben sich Vorteile für Patienten und die Abläufe in Arztpraxen, da die Rezepte für Dauermedikationen im Voraus ausgestellt werden können und somit Wege zur Arztpraxis zum Rezepte abholen entfallen. Wie kann eine Patientin oder ein Patient ein E-Rezept einlösen?Mit dem E-Rezept können Ihre Ärzt:innen apothekenpflichtige Medikamente digital verordnen und zentral in der Telematikinfrastruktur ablegen. Patient:innen können ihre E-Rezepte wie folgt einlösen:Mit Hilfe der E-Rezept-App der gematik oder mit der App ihrer Krankenkasse können Patienten ihre E-Rezept einsehen und in einer Apotheker der Wahl bequem vom Sofa aus einlösen. Die ausgewählte Apotheke hinterlegt das gewünschte Medikament dann zur Abholung. Viele Apotheken bieten hierbei auch einen Botendienst.Ein E-Rezept lässt sich auch mittels der elektronischen Gesundheitskarte (eGK) der jeweiligen Krankenversicherung in der Apotheke vor Ort einlösen. Nachdem Patient*Innen die Gesundheitskarte in der Apotheke in das Kartenterminal gesteckt haben, können Apotheker*Innen auf alle einlösbaren E-Rezept des Patienten zugreifen und das Medikament ausgeben. Mit der eGK können auch E-Rezepte in Apotheken-Apps eingelöst werden (siehe Frage/Antwort zum Einlösen in Apps von Apotheken).Alternativ zur Einlösung mittels App oder eGK kann der verordnende Arzt*Innen dem Patient*innen einen Papierausdruck mit QR-Code ausgeben. Vor Ort in der Apotheke wird der QR-Code gescannt und die Apotheker*Innen sind berechtigt, auf diese E-Rezepte zuzugreifen.Wie ist bei E-Rezepten für Rezepturen und Freitextverordnungen die Abrechnung mit Hashcode möglich? Hashcodes (aufgebracht auf dem Papier als Verbindung zu einem digitalen Datensatz) sind nur für Papierrezepte notwendig. Alle E-Rezepte haben einen digitalen Abrechnungsdatensatz. Sämtliche Apothekenverwaltungssysteme (AVS) müssen heute in der Lage sein, auch Rezepturen als E-Rezept korrekt abzugeben und dafür einen Abgabedatensatz zu erstellen. Wenden Sie sich für die konkrete Anleitung bitte an Ihren Softwareanbieter. Warum muss bei einem E-Rezept vor der Abrechnung immer eine Chargeninformation eingetragen werden?Die Angabe einer Chargeninformation in den Abgabeinformationen wurde vom Deutschen Apothekerverband (DAV) und dem Spitzenverband der Gesetzlichen Kranken- und Pflegekassen (GKV-Spitzenverband) in der Abrechnungsvereinbarung verpflichtend festgelegt. Hintergrund ist die Nachverfolgbarkeit und Durchsetzung von Regressansprüchen der Krankenkassen gegenüber der Pharmaindustrie. Derzeit wurden in der Vereinbarung noch keine Ausnahmen definiert, weshalb es insbesondere bei der Verblisterung und auch in Krankenhäuser schwierig wird die Charge zu erfassen. DAV und GKV wurden darauf hingewiesen und befassen sich mit dem Thema. Wie kann ich die Informationen zur Apotheke in der E-Rezept-App hinterlegen/ändern? Muss ich mich irgendwo anmelden?Die Basisdaten (Name der Apotheke, Adressformationen) entstammen dem Verzeichnisdienst der gematik, der von den Landesapothekerkammern befüllt wird (gesetzliche Festlegung).Um die Angaben in der gematik-App zu erweitern, können Sie die Zusatzinformationen (z.B.: Öffnungszeiten, Nacht- und Notdienst, Botendienst und Botendienstumkreis) im Verbändeportal der Apothekerschaft (www.mein-apothekenportal.de) einpflegen. (Quelle: DAV, Stand: 15.06.21)Sie finden Ihre Apotheke in der Suche nicht oder Ihre Daten sind falsch?Bitte überprüfen Sie: Haben Sie bereits eine SMC-B Karte für Ihre Apotheke?Haben Sie diese Karte bereits aktiviert?Haben Sie Ihre Zusatzinformationen im Portal mein-apothekenportal.de gepflegt? Hilfestellung: https://www.mein-apothekenportal.de/downloads/erezept_ready_flag.pdf und https://www.mein-apothekenportal.de/news/darstellung-ihrer-apotheke-in-der-e-rezept-app-der-gematik Wenn Ihr Fehler durch die obenstehenden Anleitungen nicht behoben werden kann, melden Sie sich gerne mit Ihrem Anliegen bei app-feedback@gematik.de . Bitte geben Sie bei Ihrer Anfrage Ihre Telematik-ID, den Namen und die Adresse Ihrer Apotheke an. Gilt der rosa Zettel (Muster 16) weiter?Als Ersatzverfahren für apothekenpflichtige Arzneimittel und für sonstige Verordnungszwecke wird das Muster 16 weiterhin verwendet. Sind (Zahn-)Ärzte verpflichtet, E-Rezepte auszustellen?Ja, seit dem 1.Januar besteht für (Zahn-)Ärzte die Pflicht für gesetzlich Versicherte die verschreibungspflichtigen Arzneimittel, die zulasten der Kasse verordnet werden, als E-Rezept zu verordnen. (Ausnahmen siehe https://www.gematik.de/media/gematik/Medien/E-Rezept/Infomaterial/gematik_eRezept_Medikamente_Praxen_RGB-1.pdf) Wie verhält es sich mit der Verschreibung von Zytostatika?Der Prozess der Verordnungen von anwendungsfertigen Zytostatikazubereitungen, die direkt einer Apotheke zugewiesen werden dürfen, wird von der geplanten verpflichtenden Nutzung des E-Rezepts ausgenommen und in einem unabhängigen Verfahren getestet. Die Voraussetzungen am Fachdienst wurden bereits geschaffen. Anpassungen in den Softwaresystemen der Ärzte, Apotheken und insbesondere der Krankenhäuser werden derzeit vorgenommen und zunächst geprüft.Können Krankenhäuser E-Rezepte nutzen?Mit dem Entlassrezept können Krankenhäuser bereits starten, wenn ihr Systemanbieter dies unterstützt (https://www.ti-score.de/e-rezept/krankenhaeuser). Rezepturen und Zytostatika dürfen bereits per E-Rezept verordnet werden, wenn die Systeme diese Funktion anbieten. Eine Pilotierung ist für 2024 geplant.Wie bekomme ich ein Test-E-Rezept?Die Anleitung zum Test-E-Rezept finden Sie in der Mediathek der gematik: www.gematik.de/media/gematik/Medien/Newsroom/Mediaservice/E-Rezept/E-Rezept_Testrezept_Praxen_Kurz_Erklaert_gematik_20220303.pdfWie wird verhindert, dass der Ausdruck des E-Rezepts kopiert oder bearbeitet wird?Der Ausdruck kann kopiert oder auch mehrfach gedruckt werden. Jedes E-Rezept kann aber nur einmal eingelöst werden. Der Ausdruck allein berechtigt nicht zur Abgabe des Medikaments und ist kein rechtsgültiges Dokument. Die Apotheke scannt den Rezeptcode und kann sehen, ob dieses Rezept bereits eingelöst wurde. Das E-Rezept ist fälschungssicher vom Arzt signiert und kann nicht bearbeitet werden. Wie testet die gematik die Belastbarkeit der TI? Was passiert, wenn es zum Beispiel an einem Tag mehr als zehn Millionen Zugriffe auf die TI gibt?Mit Lasttests haben wir dies bereits mehrfach mit 20 Millionen E-Rezepten an jeweils einem Vormittag simuliert. Das ist weit mehr, als tatsächlich zu erwarten ist (bislang maximal vier bis fünf Millionen E-Rezepte pro Tag). Den Hochlauf der Zahlen analysiert die gematik sehr genau, um mit Blick auf die Betriebsstabilität bei Bedarf rechtzeitig Maßnahmen zu ergreifen. Werden Betäubungsmittelrezepte (BTM) zukünftig auch als E-Rezept ausgestellt? Die Betäubungsmittelrezepte sind derzeit noch nicht durch das E-Rezept verordnungsfähig. An der Integration dieser Rezepte wird derzeit mit den zuständigen Stellen gearbeitet. Das Ziel ist, dass Betäubungsmittelrezepte ab Mitte 2025 elektronisch verordnet werden können.Kann man bereits Heil- und Hilfsmittelt als E-Rezept verordnen?Verordnungen für Heilmittel werden aktuell nicht als E-Rezept ausgestellt. Derzeit liegt der Fokus auf apothekenpflichtigen Arzneimitteln. Wie erfolgt die Abrechnung bei Arzneimitteln, die nicht über den Großhandel, sondern direkt beim Hersteller bestellt werden? Sind d'
