["https://gematik.de/newsroom/news-detail/laufzeitverlaengerung-via-software-update-wieder-in-der-konnektor-spezifikation"]
title = "News-Detail | gematik"
full_description = "09.12.2022 Laufzeitverlängerung via Software-Update wieder in der Konnektor-Spezifikation Die gematik hat am Donnerstag, den 8. Dezember 2022, die aktualisierten Spezifikationen für Konnektoren der Telematikinfrastruktur (TI) veröffentlicht. Darin enthalten ist die Option einer Laufzeitverlängerung von Konnektoren via Software-Update, welche für die Hersteller verpflichtend umzusetzen ist. Die Spezifikationen ermöglichen somit, dass die Laufzeit von TI-Konnektoren nach Ablauf einer fünfjährigen Betriebsdauer um maximal drei Jahre verlängert werden kann. Damit die Laufzeitverlängerung von Praxen und Krankenhäusern als eine Alternative zum Konnektortausch Akzeptanz findet, erarbeiten die Bundesmantel­vertragspartner zurzeit eine neue, pauschale Finanzierung­vereinbarung für die Anbindung an die Telematikinfrastruktur. Diese Pauschale wird künftig nicht nur den Austausch, sondern auch die Nutzung anderer Optionen zur Anbindung an die TI umfassen. Dazu gehört dann unter anderem die nun spezifizierte Laufzeitverlängerung. Das vom Bundestag kürzlich beschlossene Krankenhaus­pflegeentlastungsgesetz (KHPflEntG) sieht eine entsprechende Regelung vor, indem die Finanzierung auf eine TI-Pauschale umgestellt werden soll und so Anreize für die günstigeren Alternativen zum Tauschen setzt. zurück © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
