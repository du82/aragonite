["https://gematik.de/anwendungen/epa-fuer-alle/faq"]
title = "FAQ | gematik"
full_description = "Fragen und AntwortenFilter für Fragen und AntwortenSuche zurücksetzenSuchen Praxen Krankenhäuser Zahnarztpraxen Apotheken Pflege Reha Befüllung/Nutzung Berechtigung/Widerspruch Sicherheit Kosten/Rechtliches Rollout Alle öffnen Wird die ePA auch für andere Berufsgruppen als den bisher festgelegten nutzbar sein (z.B. Ernährungsberater etc.)?Dies benötigt gesetzliche Anpassungen. Diese sind derzeit noch nicht absehbar.Kann in die ePA auch ein Notfalldatensatz hinterlegt werden?Ja.Können bei den von den Krankenkassen eingestellten Abrechnungsdaten einzelne Leistungen/Diagnosen durch Patient*innen verschattet oder gelöscht werden? Oder ist das nur für alle Abrechnungsdaten als Ganzes möglich?Die Abrechnungsdaten der Krankenkassen sind aktuell nicht strukturiert und können ggf. als ein unstrukturiertes Dokument mit diversen Abrechnungsposten in die ePA gestellt werden. Ein Verbergen oder Löschen ist nur in Gänze möglich.Was passiert mit nicht eingelösten E-Rezepten in der eMedikationsliste?Die Verordnungsdaten werden in der eML angezeigt. Es ist erkenntlich, dass das Rezept nicht eingelöst wurde.Was passiert mit gelöschten E-Rezepten in der eMedikationsliste?Durch den Patienten gelöschte E-Rezepte bleiben in der eML stehen. Durch den Leistungserbringer storniert E-Rezepte werden entfernt.Können Daten abgefangen werden, wenn die TI wegen einer Störung nicht verfügbar ist?Eine Verfügbarkeitsstörung würde einen illegalen Zugriff auf Daten nicht erleichtern. Nicht einmal die berechtigten Userinnen und User könnten noch auf die Daten zugreifen.Wie wird verhindert, dass die Krankenkassen Zugriff auf die ePA-Daten haben, obwohl sie deren Betreiber sind?Krankenkassen haben aufgrund technischer Mechanismen keine Möglichkeit, die Inhalte einer ePA einzusehen.Ist es technisch möglich, eine größere Menge an Dokumenten gemeinsam herunterzuladen?Technisch ist es möglich, mehrere Dokumente zusammen herunterzuladen.Mit welchen Sicherungsmechanismen stellen Praxen und Krankenhäuser sicher, dass Mitarbeitende nicht illegal Daten herunterladen können?Hier gelten die gleichen Sicherungsmechanismen, die auch erforderlich sind, wenn ein Krankenhaus Zugang zu den Patientenakten im Krankenhaus-Informationssystem gewährt. Wenn eine Person in einer Einrichtung auf die ePA zugreifen will, muss sie sich authentisieren. Das funktioniert über die sogenannte Institutionskarte, die SMC-B-Karte. Damit identifiziert sich die Person gegenüber dem ePA-System als Teil einer medizinischen Institution. Im zweiten Schritt prüft die Akte selbst zuerst, ob ein Behandlungskontext für die jeweilige Einrichtung besteht. Dieser gilt ab Stecken eGK vor Ort oder ab Freischaltung des Zugriffsrechts in der ePA-App für standardmäßig 90 Tage. In diesem Zeitraum besteht damit das Zugriffsrecht auf die jeweilige ePA. Der Zeitraum kann in der ePA-App allerdings auch beendet oder verlängert werden.Wie sind die Server vor mechanischen und digitalen Angriffen geschützt?Die ePA wurde unter Beachtung höchster Sicherheitsstandards und im Einvernehmen mit dem Bundesamt für Sicherheit in der Informationstechnik entwickelt. Zusätzlich werden alle Sicherheitsanforderungen mittels Sicherheitsgutachten geprüft, bevor eine Zulassung für den Betrieb ausgesprochen wird.Können privat Versicherte eine elektronische Patientenakte (ePA) erhalten, obwohl sie keine elektronische Gesundheitskarte (eGK) haben?Ja, privat Versicherte können eine ePA erhalten, auch wenn sie keine eGK haben. Versicherte müssen über die ePA-App ihrer privaten Krankenversicherung dann die Zugriffsrechte für die Leistungserbringerinstitutionen aktiv erteilen. Wenn die Patientin oder der Patient die Karte am 01.07. einlesen lässt, kann die Praxis dann am 30.09. nicht mehr darauf zugreifen? Ab Stecken der elektronischen Gesundheitskarte beginnt der Behandlungskontext. Dieser dauert 90 Tage, in denen die jeweilige Institution das Zugriffsrecht für die ePA der Patientin oder des Patienten hat. Nach den 90 Tagen sind sie darauf angewiesen, dass die Patientin oder der Patient vorbeikommt und die elektronische Gesundheitskarte erneut steckt. Patientinnen und Patienten können den Zeitraum allerdings auch über ihre ePA-App verlängern (auch zeitlich unbegrenzt) bzw. verkürzen oder beenden. Das macht beispielsweise bei Hausarztpraxen Sinn, die eine Patientin bzw. einen Patienten langfristig behandeln. Bei Apotheken dauert der Versorgungskontext drei Tage, hier muss also nach diesem Zeitraum die Karte für den ePA-Zugriff neu gesteckt werden. Was ist die maximale Dateigröße bei einem Upload in die ePA?Dokumente können nur hochgeladen werden, wenn sie eine Größe von 25 MB nicht überschreiten. Wird eine ePA auch für Menschen angelegt, die nicht zustimmungsfähig sind (wie zum Beispiel Demenzerkrankte)?Ja. Ein Widerspruch kann durch gesetzliche Vertreter vorgenommen werden. Gegebenenfalls notwendige Einwillungen können ebenfalls durch den gesetzlichen Vertreter organisiert werden.Wann wird es möglich sein, Betäubungsmittel als E-Rezept zu verordnen und sie damit auch in der Medikationsliste der ePA zu erfassen?Es ist derzeit noch unklar, ab wann BTM als E-Rezept verordnet werden können. Sobald BTM über das E-Rezept abgebildet werden, fließen diese auch automatisch in die Medikationsliste ein.Wird es auch einen AMTS-Check in der ePA geben?Die ePA bildet die Datengrundlage, die für einen AMTS-Check genutzt werden kann. Der Check selbst kann dann bei entsprechender Verfügbarkeit eines AMTS-Moduls im Primärsystem durchgeführt werden. Muss die empfangende oder die sendende Einrichtung dafür sorgen, dass ein Dokument in die ePA eingestellt wird?In der Regel sollte das Einstellen von der Institution übernommen werden, die bspw. den Befund erhoben hat. In der Realität kann das in manchen Konstellationen nicht umsetzbar sein, wenn bspw. die erstellende Institution die Patientin oder den Patienten nie gesehen hat (zum Beispiel bei einem Laborauftrag).Wird ein Dokument, das in die ePA gestellt wird, auch automatisch per KIM verschickt und umgekehrt?Inwieweit die Workflows des Versands per KIM und des Einstellens in die ePA-App miteinander verbunden werden können, ist von der Implementierung des Primärsystems abhängig. Ist es möglich, dass ein Dokument nur für ausgewählte Ärztinnen und Ärzte auf sichtbar gestellt werden kann?Nein, es ist nicht möglich, ein einzelnes Dokument nur für bestimmte Ärztinnen und Ärzte bzw. für bestimmte medizinische Einrichtungen sichtbar zu stellen. Ein Verbergen ist immer nur für alle Institutionen möglich.Welche Abrechnungsdaten kommen in die ePA?Die Krankenkassen stellen die Abrechnungsdaten in die ePA ein. Erkennbar ist darin, welche Institution welche Abrechnungspositionen eingereicht hat.Sind die vier Wochen ab dem 15.01.2025 eine Testphase für die ePA und erst danach wird sie verpflichtend?Ja, die neue ePA startet schrittweise. Sie wird zunächst in den drei Modellregionen Hamburg und Umland, Franken sowie Nordrhein-Westfalen eingeführt. Hier wird getestet, ob das technische Zusammenspiel aller Komponenten funktioniert. Mehr als 250 Arztpraxen, Zahnarztpraxen, Apotheken und Krankenhäuser nehmen an dieser Pilotphase teil und setzen die ePA ab Mitte Januar in ihrem Berufsalltag ein. In verschiedenen Austauschrunden werden Erfahrungen mit der ePA besprochen und Anpassungen abgeleitet. Zudem gibt es in jeder Modellregion ein Projektteam, das den teilnehmenden Einrichtungen zur Seite steht.Nach erfolgreich abgeschlossener Pilotierung können dann alle Zahnarztpraxen, Praxen, Apotheken und Krankenhäuser in ganz Deutschland mit der ePA arbeiten.Müssen vor dem 15.01.2025 Daten in die ePA eingestellt werden, wenn Patientinnen und Patienten das wünschen?Auf Wunsch der Patienten müssen die entsprechenden Dokumente in die ePA eingestellt werden.Dürfen Patientinnen und Patienten alle Dateiformate hochladen?Die Dateiformate, die in die ePA hochgeladen werden dürfen, sind eingeschränkt. Es ist davon auszugehen, dass Patienten und Pateintinnen hauptsächlich Dokumente im PDF/A der Version 1 oder 2 hochladen.Wer haftet, wenn Daten aus der ePA Schadsoftware enthalten?Die Haftung für die Übermittlung von Schadsoftware richtet sich nach allgemeinen Haftungsgrundsätzen und ist im Einzelfall zu bewerten.Wie funktioniert der Behandlungskontext bei Privatversicherten?Privatversicherte besitzen keine eGK. Daher eröffnen sie den Behandlungskontext selbst über die ePA App.Braucht eine Einrichtung an jedem Arbeitsplatz ein Kartenlesegerät?Nein. Die IT in der Praxis muss so konfiguriert sein, dass von jedem Arbeitsplatz auf die Anwendungen der TI zugegriffen werden kann. Der ePA-Zugriff gilt dann für die entsprechende TelematikID.Werden mit folgenden ePA-Updates zusätzliche Kosten kommen?Die Kosten für Systemupdates werden über die TI-Pauschale abgedeckt. Zur Einführung der ePA für alle ist lediglich ein Update der Software notwendig.Bleibt beim Löschen oder Verschatten der Altzustand dokumentiert? Lässt sich also nachvollziehen, welche Dokumente zu welchem Behandlungszeitpunkt verfügbar waren?Die Verfügbarkeit von Dokumenten wird im Protokoll direkt in der ePA vermerkt. Dieses muss dann für Nachweiszwecke auch herangezogen werden.Was wird aus der Patientenakte im Primärsystem der Praxis in die ePA übertragen?In die ePA müssen unter anderem eArztbriefe, Entlassbriefe, Laborbefunde, Bildbefunde, OP-Berichte, Medikationsdaten und weitere relevante Dokumente eingestellt werden. Vergleichbar ist dies mit Dokumenten, die auch heute dem Patienten mitgegeben werden für eine Weiterbehandlung in einer weiteren Institution. Wird die Übermittlung von Daten abgerechnet?Hierzu gibt es spezielle Abrechnungsziffern.Gibt es bestimmte Zeitpunkte, zu denen die ePA befüllt werden muss?Die Befüllung der ePA findet im aktuellen Behandlungskontext statt. Eine Befüllung ist möglich, solange ein Zugriff auf die ePA besteht.Ist es geplant, dass die EBZ-Szenarien unter Nutzung der ePA angepasst werden?Das ist derzeit nicht geplant.Sollte man vorherige Behandlerinnen und Behandler dazu auffordern, Dokumente in die ePA zu stellen, falls diese noch nicht drin sind?Eine Befüllungspflicht ergibt sich nur für Dokumente aus dem aktuellen Behandlungskontext. Historische Dokumente müssen durch den Leistungserbringer nicht eingestellt werden bzw. der aktuelle Leistungserbringer muss keine vorherigen Behandlerinnen und Behandler dazu auffordern.Darf jede Einrichtung die Erstbefüllung abrechnen, wenn sie das erste Mal etwas in die ePA stellt?Jede Institution, die abrechnet, kann dies tun.Können Patientinnen und Patienten Dokumente aus der ePA auch selbst ausdrucken und dann ggf. auch an die private Krankenversicherung weiterleiten?Grundsätzlich ist es auch möglich, dass Patientinnen und Patienten Dokumente aus der ePA selbst ausdrucken können. Was mit dem Ausdruck dann konkret passiert, ist Sache der Patientin oder des Patienten.Was passiert mit der ePA, wenn eine Patientin bzw. ein Patient von der gesetzlichen in die private Krankenversicherung wechselt (oder umgekehrt)?Bei einem Wechsel der Krankenversicherung nimmt eine Patientin bzw. ein Patient die ePA mit zur neuen Krankenversicherung, sofern die neue Versicherung ebenfalls eine ePA anbietet.Ist die EPA 1 nur einmalig abrechenbar oder für jeden Behandlungsfall?Um die Aktivitäten im Kontext der ePA abzurechnen, gibt es konkrete Abrechnungsziffern.Wenn die elektronische Gesundheitskarte manuell erfasst wird, kann man dann auch auf die ePA zugreifen?Nein, die eGK muss gesteckt werden. Dabei wird ein Prüfnachweis erzeugt, der einen ePA Zugriff ermöglicht.Wird das Bonusheft automatisch aktualisiert, wenn die 01 abgerechnet wird?Das Zahnbonusheft als MIO muss von der Institution befüllt und mit der SMC-B signiert werden.Wie können DVT-Aufnahmen in die ePA gestellt werden?DVT-Aufnahmen müssen vor dem Hochladen in die ePA in das PDF/A Format konvertiert werden. Derzeit gibt es keine Verpflichtung zum Einstellen solcher Dokumente.Wie zeitnah müssen Befunde in die ePA geladen werden?Solange wie ein Zugriff auf die ePA besteht, können Befunde eingestellt werden. Es gibt keine Vorgaben, wie schnell das erfolgen muss.Können auch Dokumente in der ePA gespeichert werden, wenn eine TI-Störung vorliegt?Nein, das ist nicht möglich. Dokumente können nur in der ePA gespeichert werden, wenn über die TI die Verbindung zum ePA-Aktensystem aufgebaut werden kann.Woher weiß das medizinische Personal, dass die Patientin bzw. der Patient widersprochen hat?Der Widerspruch einer Patientin oder eines Patienten gegen die ePA wird über das Primärsystem zurückgemeldet. Möchte eine Patientin oder ein Patient nicht, dass ein Dokument oder mehrere Dokumente in die ePA eingestellt werden, muss er oder sie dies dem medizinischen Personal mitteilen.Wie viele Jahre rückwirkend können Patientinnen und Patienten das Hochladen vergangener Befunde in die ePA verlangen?Leistungserbringer sind nur dazu verpflichtet Dokumente aus dem aktuellen Behandlungskontext in die ePA einzustellen. Eine Übertragung der Historie muss nicht vorgenommen werden.Werden nach einer Behandlung die Dokumentation oder die Abrechnungspositionen in die ePA gestellt?Es gibt gesetzlich vorgeschriebene Kategorien von Dokumenten, die in die ePA eingestellt werden müssen. Das sind zum Beispiel E-Arztbriefe, Laborbefunde und Bildbefunde. Die lokale Dokumentation muss nicht in die ePA übertragen werden. Abrechnungsdaten werden durch die Krankenkassen in die ePA gestellt.Wie funktioniert die Erstbefüllung der ePA?Die Erstbefüllung der ePA bedeutet zunächst einmal, dass das allererste Mal Daten in die ePA einer Patientin bzw. eines Patienten durch einen Leistungserbringer geladen werden. Dabei wird das jeweilige Dokument aus der konkreten aktuellen Behandlung in die ePA geladen. Es ist nicht notwendig, bei der Erstbefüllung alle Daten aus der lokalen Patientenakte in die ePA zu laden. Müssen Befunde erst mit den Patientinnen und Patienten besprochen werden, bevor sie in die ePA eingestellt werden dürfen?Die ePA für alle ist eine widerspruchsbasierte elektronische Patientenakte. Möchte ein Patient oder eine Patientin nicht, dass Befunde in die ePA eingestellt werden, muss er oder sie dies von sich aus sagen. Für Leistungserbringer gelten jedoch besondere Hinweispflichten, wenn potentiell stigmatisierende Informationen im Dokument enthalten sind. Das können zum Beispiel Informationen zu HIV-Infektionen, Schwangerschaftsabbrüchen oder psychischen Erkrankungen sein.Müssen Patientinnen und Patienten darüber informiert werden, welche Dokumente aus der ePA heruntergeladen und im lokalen System gespeichert wurden?In der ePA wird protokolliert, welche Aktionen (z. B. Dokumente herunterladen) wann und von wem durchgeführt wurden. Dieses Protokoll ist für die Patientin oder den Patient in der ePA ersichtlich. Eine zusätzliche Information ist nicht notwendig. Patientinnen und Patienten haben vorher die Möglichkeit über ihre ePA-App oder die Ombudsstelle der Krankenkasse der Möglichkeit zum Zugriff durch eine Insti"
