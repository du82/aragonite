full_description = "Vorteile Weg einer DEMIS-Meldung Austausch Download Erfahren Sie mehr Inhalte dieser Seite DEMIS Nächster Schritt für den Infektionsschutz Die Corona-Pandemie hat aufgezeigt, wie wichtig guter Infektionsschutz für das Gesundheitswesen ist. Mit DEMIS (Deutsches Elektronisches Melde- und Informationssystem für den Infektionsschutz) haben wir ein wertvolles Werkzeug, das uns beim Kampf gegen Infektionskrankheiten hilft. Welche Vorteile bietet DEMIS?DEMIS hilft, Infektionsketten zu brechenDEMIS übermittelt Laborbefunde schnell und verlässlich an Gesundheitsämter. Über das DEMIS-Meldeportal können auch Arztpraxen und Apotheken Krankheitsmeldungen direkt an die Gesundheitsämter übermitteln. Damit können mögliche Infektionsketten noch besser erkannt und gebrochen werden.DEMIS spart wertvolle ZeitDEMIS spart wertvolle Zeit und bedeutet auch für Labore, Apotheken und Arztpraxen weniger Aufwand: Das System erkennt automatisch, an welche Gesundheitsämter eine Infektion gemeldet werden muss. Die Ämter selbst bekommen nur die Meldungen, für die sie auch zuständig sind. Sie erhalten zudem einen schnelleren Überblick über das Infektionsgeschehen vor Ort.DEMIS kann immer mehrMit DEMIS werden meldepflichtige Erregernachweise und Krankheiten sowie bundeslandspezifische Meldepflichten übermittelt. Alle Gesundheitsämter in Deutschland sind angebunden. Dazu kommen um die 1.000 Labore und über 1.300 Krankenhäuser, die täglich über DEMIS melden. In DEMIS sind auch Überwachungssysteme (Surveillance) des Robert Koch-Instituts (RKI) integriert. So funktioniert beispielsweise auch die Meldung der Bettenbelegung auf den Normalstationen in den Krankenhäusern an das RKI. Austausch: DEMIS, weil Infektionsschutz schnell sein muss Expert:innen aus der gematik tauschten sich auf der DMEA 2024 im Panel mit Michaela Diercke (RKI) und Andreas Zahn (BMG) über die Möglichkeiten von DEMIS (Deutsches Elektronisches Melde- und Informationssystem für den Infektionsschutz) aus. (Stand der Informationen: April 2024) Zusätzliche Informationen Broschüre DEMIS Vier Seiten, Stand März 2024 PDF | 5 MB | 23.04.2024 Download Erfahren Sie mehr Die gematik wurde vom Bundesministerium für Gesundheit beauftragt, das Robert Koch-Institut und Fraunhofer FOKUS bei der Entwicklung der ersten Ausbaustufen von DEMIS zu unterstützen. Die FHIR-Profile wurden in Kooperation mit HL7 Deutschland erstellt. Unser Fachportal: Weiterführende Informationen Robert Koch-Institut Fraunhofer FOKUS © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
