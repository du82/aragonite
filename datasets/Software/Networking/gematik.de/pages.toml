["https://gematik.de/sektoren/oegd"]
title = "ÖGD | gematik"
description = """
Merkblatt: TI-Finanzierung ÖGD                                                                                                                                                                                PDF | 439 KB | 27.11.2024"""
full_description = "Anwendungen Anwendungsfälle Erklärfilm Anschluss an die TI Finanzierung Downloads FAQ Erfahren Sie mehr Inhalte dieser Seite Öffentlicher Gesundheitsdienst Einfach digital Der Öffentliche Gesundheitsdienst (ÖGD) mit seinen rund 380 Gesundheitsämtern kümmert sich um die unterschiedlichsten Gesundheitsfragen. Die Gesundheitsämter steuern den Infektionsschutz, überprüfen die Einhaltung von Hygienemaßnahmen, führen Schuleingangs- und Reihenuntersuchungen durch und bieten Beratungs- und Unterstützungsangebote für alle Bürgerinnen und Bürger an. Sie sind deshalb ein wichtiger Kommunikationspartner für Praxen, Kliniken und Labore, aber auch zahlreiche Verwaltungseinrichtungen, wie Schulen, Behörden und Justizeinrichtungen. Seit Ende 2022 können sich ÖGD-Einrichtungen an die Telematikinfrastruktur (TI) anschließen und die TI-Anwendungen für einen schnellen und sicheren Informationstausch nutzen. Die wichtigsten Anwendungen für den ÖGD Die wichtigsten TI-Anwendungen zur Unterstützung des Öffentlichen Gesundheitsdienstes können Kommunikation im Medizinwesen (KIM), das Versichertenstammdaten-Management (VSDM), die elektronische Patientenakte (ePA) und später der TI-Messenger sein. #c-6581-123 svg path {fill: #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_ KIM Schnell und sicher kommunizieren #c-6581-125 svg path {fill: #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_Patientenakte 2 Blau ePA Persönliche Daten, persönliche Entscheidungen #c-6581-124 svg path {fill: #010e52} .cls-1{fill:#fff;} Gematik_Piktogramme_Versichertenstammdatenmanagement_Weiss Kopie VSDM Stets auf dem aktuellen Stand #c-6581-122 svg path {fill: #010e52} .cls-1{fill:#fff;} Gematik_Piktogramme_TI-Messenger_Blau Kopie 7 TI-Messenger Schnelle Nachrichten in Echtzeit Konkrete Anwendungsfälle In den unterschiedlichen Bereichen des ÖGD gibt es eine Vielzahl an Anwendungsfällen, bei denen die vorgestellten TI-Anwendungen zu einem sicheren, schnellen und einfachen Austausch von Informationen beitragen können. Die TI-Anwendungen können genutzt werden, um … medizinische Dokumentationen und Bilddaten von niedergelassenen Praxen, Kliniken und Laboren zu empfangen, die Schweigepflichtsentbindung von Klientinnen und Klienten an eine Praxis zu übermitteln, neue Klientinnen und Klienten mit der elektronischen Gesundheitskarte (eGK) elektronisch zu erfassen und die bestehenden Stammdaten abzugleichen, die Ergebnisse einer Erstuntersuchung eines Asylbewerbers an ein anderes Gesundheitsamt zu übermitteln und Impfungen sowie nachgeholte U-Untersuchungen elektronisch zu dokumentieren, die Hygieneprotokolle an Kliniken zu übermitteln, sich mit Patientinnen und Patienten bzw. Praxen und Kliniken zur Einhaltung der Tuberkulosevorsorge auszutauschen, medizinische Informationen vor dem Stattfinden von Begutachtungen oder Schuleingangsuntersuchungen vorläufig bereitzustellen. Erklärfilm: TI im öffentlichen Gesundheitsdienst Anschluss an die TI – Vorgehensweise Um Ihre Einrichtung an die Telematikinfrastruktur (TI) anzuschließen, werden eine Reihe von unterschiedlichen Komponenten, bestehend aus Hard- und Software, benötigt. Nachfolgend wird Ihnen Schritt für Schritt erklärt, was Sie tun müssen, um sich für die TI-Anbindung vorzubereiten. Elektronischen Heilberufsausweis beantragen Für den Anschluss an die Telematikinfrastruktur benötigen Sie mindestens einen elektronischen Heilberufsausweis (eHBA) je Institution. Anbieter, bei denen Sie diesen beantragen können, finden Sie auf der Seite der für Sie zuständigen Landesärztekammer bzw. Landeszahnärztekammer. Dort erfahren Sie auch wie der Beantragungsprozess aussieht. Sobald Sie Ihren eHBA erhalten haben, kann dieser mittels PIN beim Anbieter freigeschaltet werden. Starten Sie erst einmal mit einem Ausweis je Institution und schätzen Sie weiteren Bedarf auf Basis vorhandener Anwendungsfällt ab. Institutionskarte (SMC-B) beantragen Diese kann erst beantragt werden, wenn mind. ein eHBA innerhalb der Institution vorhanden ist. Ist das der Fall, können Sie die SMC-B beim Anbieter D-Trust GmbH anfordern. Nach Prüfung Ihres Antrages und der begleitenden Unterlagen werden Ihnen sowohl die SMC-B als auch die dazugehörige PIN durch die gematik zugesandt. Die Freischaltung der SMC-B kann mittels PIN im Antragsportal der D-Trust durchgeführt werden. Eine genaue Anleitung zur Bestellung, Freischaltung und Aktivierung finden Sie weiter unten bei den Downloads. Konnektorlösung auswählen Anschließend gilt es, sich um die Auswahl und Beschaffung der Konnektorlösung zu kümmern. Der Konnektor stellt die unterschiedlichen digitalen Dienste zur Verfügung und dient als Bindeglied zur Telematikinfrastruktur. Es stehen, je nach infrastruktureller Ausgangslage, bis zu drei unterschiedliche Optionen zur Beschaffung eines Konnektors zur Verfügung: Option 1: Ein Einbox-Konnektor wird in Ihrer Einrichtung oder einem (externen) Rechenzentrum aufgestellt. Es gibt drei durch die gematik zugelassene Einbox-Konnektor-Modelle, die entweder direkt beim Hersteller oder über den Einzelhandel gekauft werden: RISE GmbH, secunet AG, Koco Connector GmbH. Option 2: Ein Dienstleister stellt einen Konnektor als TI as a Service (TIaaS) in einem externen Rechenzentrum zur Verfügung. Option 3: Ein Highspeed-Konnektor wird in einem externen Rechenzentrum eingebunden. Option 1 und 2 sind bereits verfügbar. Die dritte Option wird vor allem für komplexe Einrichtungen aufgrund ihrer besseren Skalierbarkeit empfohlen. Sie wird ab Sommer 2024 durch die Industrie angeboten werden. Seit August 2024 steht als weitere Option auch das TI-Gateway zur Verfüfgung. Hierbei verbindet sich die Einrichtung per VPN mit einem zertifizierten Rechenzentrum, das dann einen Zugang zur TI herstellt. Mehr Informationen zum Anschluss an die TI Kartenterminal beschaffen Anschließend geht es darum, ein stationäres Kartenterminal zu beschaffen. Hierfür gibt es zwei durch die gematik zugelassene Hersteller: Cherry Digital Health GmbH und Worldline Healthcare GmbH. Das Kartenterminal kann entweder direkt beim Hersteller oder über den Einzelhandel gekauft werden. VPN-Zugangsdienst einrichten Zudem wird ein Zugangsdienst zum virtuellen privaten Netzwerk (VPN) benötigt. Der VPN-Zugangsdienst kann bei einem der drei durch die gematik zugelassenen VPN-Anbieter beschafft werden: Arvato Systems Digital GmbH, CompuGroup Medical Deutschland GmbH und T-Systems International GmbH. Der VPN-Zugangsdienst kann ebenfalls entweder direkt beim Hersteller, über den Einzelhandel und Reseller bezogen werden. KIM-E-Mailadresse beantragen Im nächsten Schritt geht es um die Beschaffung der KIM-E-Mail-Adresse. Derzeit können Sie zwischen sechs Anbietern für den KIM-Fachdienst auswählen: IBM Deutschland GmbH, CompuGroup Medical Deutschland GmbH, RISE GmbH, Arvato Systems Digital GmbH, akquinet Health Service GmbH, T-Systems International GmbH. Die KIM-E-Mailadresse kann direkt beim Hersteller oder einem Reseller bezogen werden. TI-Module im Fachverfahren nutzen Update Ihres Fachverfahrens um entsprechende Module. Treten Sie hierzu mit Ihrem Fachverfahrenshersteller in Kontakt, um zu besprechen welche Module für die TI-Anwendungen bereits verfügbar sind und ab wann sie genutzt werden können. Um die Dienste der Telematikinfrastruktur (TI) bei Ihnen in der Einrichtung erfolgreich zu installieren, können Sie entweder (soweit vorhanden) auf eigenes IT-Personal zurückgreifen oder die Installation durch Spezialisten durchführen lassen. Die Dauer der Inbetriebnahme Ihrer Einrichtung an die TI hängt an der Verfügbarkeit und Lieferzeit der zuvor genannten Hard- und Softwarekomponenten. Sind alle Komponenten vorhanden, können Sie sofort mit der Einrichtung beginnen. Nach Abschluss ist die direkte Nutzung der von Ihnen adressierten TI-Anwendungen möglich. Finanzierung Im Rahmen der TI-Anbindung des Öffentlichen Gesundheitsdienstes entstehen für die teilnehmenden Einrichtungen sowohl Ausstattungs- als auch Betriebskosten. Durch eine bundesweit geltende Finanzierungsvereinbarung zwischen den Ländern und dem GKV-Spitzenverband, werden die anfallenden Kosten teilweise refinanziert. Die den Einrichtungen anfallenden Kosten können rückwirkend bis zum 01.01.2022 über ein Abrechnungsportal des GKV-Spitzenverbandes eingereicht und erstattet werden. Hierzu muss eine Telematik-ID vorliegen, die mit Ausgabe der SMC-B vergeben wird. Wichtig ist dabei jedoch, dass eine Refinanzierung anfallender Kosten für den Anschluss an die TI nicht über den Pakt ÖGD möglich ist. Die nicht durch die Finanzierungsvereinbarung erstattungsfähigen Kosten sind durch die Einrichtungen selbst zu tragen. Welche Kosten und in welcher Höhe übernommen werden, können der Finanzierungsvereinbarung und dazugehörigen Anlage 32 BMV-Ä entnommen werden, die Sie weiter unten im Bereich Downloads finden. Downloads Merkblatt: TI-Finanzierung ÖGD PDF | 439 KB | 27.11.2024 Download Checkliste für Gesundheitsämter zum Anschluss an die TI PDF | 581 KB | 27.11.2024 Download Reportage_Gesundheitsaemter_2024.pdf PDF | 259 KB | 19.04.2024 Download Fragen & Antworten ÖGD PDF | 205 KB | 02.11.2023 Download Ausgabe von Institutionskarten SMC-B an Einrichtungen des ÖGD PDF | 1 MB | 30.06.2023 Download TI-Finanzierungsvereinbarung (Anlage 32 BMV-Ä) PDF | 308 KB | 04.01.2023 Download TI-Finanzierungsvereinbarung ÖGD PDF | 70 KB | 04.01.2023 Download Praxisbeispiel: Das bringt die Digitalisierung dem Öffentlichen Gesundheitsdienst PDF | 616 KB | 29.11.2022 Download Fragen und Antworten Allgemein Anbindung Finanzierung DEMIS Sicherheit Wo kann ich wie Anträge stellen (eHBA, SMC-B-Karte, KIM)?Die Beantragung der Heilberufsausweise wird jeweils über die zuständige kassenärztliche bzw. kassenzahnärztliche Vereinigung geregelt, die mit unterschiedlichen Unternehmen zusammenarbeiten, durch die die Karten ausgegeben werden. Die Beantragung der Institutionskarte (SMC-B) für den ÖGD ist über die D-Trust abzuwickeln. Die KIM-Adressen können bei den durch die gematik zugelassenen Anbietern erworben werden. Die Zulassungslisten befinden sich auf dem Fachportal der gematik.Direkter Link zur Zulassungsübersicht für die TI-Anwendung KIM im Fachportal der gematik.Welche Voraussetzungen (TI-Komponenten, Ressourcen, Qualifikation des Personals etc.) sind für die TI-Anbindung zu erfüllen?Damit ein Gesundheitsamt sich an die Telematikinfrastruktur anbinden und die darin befindlichen Anwendungen nutzen kann, müssen eine Reihe von Soft- und Hardware-Komponenten beschafft und eingebunden werden. Dazu gehören Smartcards (mindestens ein elektronischer Heilberufsausweis (HBA) und eine Institutionskarte (SMC-B)), eine Konnektor-Lösung, mindestens ein stationäres Kartenterminal, ein VPN-Zugangsdienst und ein Primärsystem (Fachverfahren) mit entsprechenden TI-Modulen. Die jeweils zahlenmäßige Ausprägung der Komponenten ist abhängig von der jeweiligen Einrichtung und kann nicht pauschal beziffert werden.Alle Infos zur TI-Ausstattung finden Gesundheitsämter hierWelche Zuschüsse können Gesundheitsämter in Anspruch nehmen? Wie und wo beantrage ich den Zuschuss?Für die Einrichtungen des ÖGD besteht eine Finanzierungsvereinbarung zwischen den Bundesländern und dem GKV-Spitzenverband. Die Höhe der jeweiligen Zuschüsse ist in der Vereinbarung und dem dazugehörigen Bundesmantelvertrag Ärzte (BMV-Ä) geregelt. Die (rückwirkende) Beantragung zur Rückerstattung der anteiligen Kosten im Zusammenhang mit dem TI-Anschluss, können über das Erstattungsportal des GKV-Spitzenverbandes beantragt werden. Zur Registrierung wird die Telematik-ID benötigt, welche erst mit der Ausgabe der Institutionskarte vergeben wird. Mehr zur Finanzierungsvereinbarung für den ÖGD hierDie Gesundheitsämter sind verpflichtet, durchgeführte Covid-19-Schutzimpfungen und Grippeimpfungen (perspektivisch alle) per DIM an das RKI zu melden. Ist es vorgesehen, einen Meldeweg von der angewandten Verfahrenssoftware über die TI zu etablieren?Können die Meldungen gemäß §6 und 7 IfSG durch die niedergelassenen Ärzt:innen über die Telematikinfrastruktur mittels DEMIS an die Gesundheitsämter gemeldet werden? Wenn ja, wie müssen die niedergelassenen Ärzt:innen hierzu vorgehen?Niedergelassene Ärzte und Ärztinnen können bereits heute Meldungen nach §7 Abs. 1 IfSG entweder über das DEMIS-Meldeportal über die Telematikinfrastruktur oder, falls bereits vorhanden, direkt aus dem PVS an DEMIS melden. Weiterführende Informationen hierzu finden sich in der DEMIS-Wissensdatenbank (https://wiki.gematik.de/x/lBTOGw). Meldepflichten nach §6 Abs. 1 Nr. 1 und 1a IfSG sind voraussichtlich im Frühjahr 2024 möglich. Siehe auch DEMIS Roadmap: https://wiki.gematik.de/download/attachments/75530364/DEMIS_Jahresausblick_2023-2024_final.pdf.Hinweis: Für die Anmeldung am DEMIS-Meldeportal wird ab Ende 2023 / Anfang 2024 die Verwendung des gematik Authenticators (siehe https://wiki.gematik.de/x/Lw_mGw) vorausgesetzt.DEMIS, SurvNet und TI: In welchen Zusammenhang steht DEMIS mit der TI bzw. wird DEMIS in die TI integriert?Die TI ist ein Zugangsweg zum DEMIS-Meldeportal. DEMIS ist keine TI-Anwendung, das ist weder vorgesehen noch sinnvoll (Stichwort Anbindung Meldepflichtige Non-TI).Was können Gesundheitsämter auf der ePA der Klienten sehen bzw. was müssen Gesundheitsämter tun, um einen Zugriff auf die ePA zu erhalten?Die Bürgerin bzw. der Bürger muss über die Suche im Verzeichnisdienst (VZD) proaktiv den gesamthaften oder partiellen Zugriff auf seine Akte und die darin befindlichen Informationen geben. Wenn eine aktive Berechtigung vorhanden ist, können beispielsweise Diagnosen, Befunde, Laborwerte und der Medikationsplan eingesehen werden. Ebenso ist das Einstellen weiterer Dokumente durch das Gesundheitsamt möglich. Dies bezieht sich auf die konzeptionelle ePA (nicht künftige „ePA für alle“).Gibt es auch eine Anleitung/Information/Hilfe zum Thema Refinanzierung? Wir versuchen seit einem halben Jahr einen Zugang zum Portal der GKV zu erhalten, die Unterstützung von dort ist aber leider mangelhaft.Der GKV-Spitzenverband ist der Ansprechpartner für die Themen Refinanzierung und das GKV-Antragsportal. Informationen sind auch unter https://antraege.gkv-spitzenverband.de/home zu entnehmen. Eine Registrierung ist erst nach Erhalt der Telematik-ID möglich, die mit der Ausgabe der Institutionskarte auf Einrichtungsebene vergeben wird. Die gematik ist nicht für Finanzierungsfragen zuständig.Gibt es eine Refinanzierung der Ausgaben, für die Implementierungs- und Betriebskosten? Wo muss ich hier einen Antrag stellen?Ja, es gibt Pauschalen für laufende Kosten, die teils monatlich oder quartalsweise erstattet werden. Genauere Informationen sind der geltenden Finanzierungsvereinbarung zu entnehmen. Die Refinanzierung wird über das Portal des GKV-Spitzenverbands abgewickelt.Mit welchen Kosten müssen Gesundheitsämter für den TI-Anschluss rechnen (für die Hard- und Softwarekomponenten)?Eine generelle Kosteneinschätzung ist nicht möglich, da sich die Preise der unterschiedlichen Anbieter unterscheiden und die jeweilige Ausprägun"
