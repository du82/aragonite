title = "Praxen | gematik"
description = """
Folgerezepte mit dem E-Rezept - Tipps für die Praxis-Organisation                                                                                                                                                                                PDF | 598 KB | 29.02.2024"""
full_description = "Vorteile Erklärfilm - E-Rezept per eGK einlösen So funktioniert's elektronische Ersatzbescheinigung E-Rezept für Privatversicherte Downloads Erfahren Sie mehr Inhalte dieser Seite E-Rezept Einfacher für alle Das E-Rezept ist nicht nur für Patientinnen und Patienten eine deutliche Erleichterung. Auch Praxen profitieren vom E-Rezept. Es vereinfacht administrative Abläufe und gibt neue Möglichkeiten, um den Praxisalltag zu optimieren. Mit dem E-Rezept sparen sich Praxen wertvolle Zeit, die in die Versorgung der Patientinnen und Patienten fließen kann. Welche Vorteile bietet das E-Rezept für Praxen?Das E-Rezept macht Praxisabläufe effizienterMit wenigen Klicks wird das E-Rezept im Praxisverwaltungssystem erstellt und digital an die Patientinnen und Patienten übermittelt. Ärztinnen und Ärzte können viele Rezepte gleichzeitig signieren. Händische Unterschriften und unnötige Wege innerhalb der Praxis zur Unterzeichnung von Rezepten entfallen. Aber auch zeitaufwändige Prozesse, wie der Druck oder der Postversand von Rezepten, entfällt und entlastet das Praxispersonal.Folgerezepte können digital übermittelt werdenMit dem E-Rezept können Folgerezepte innerhalb eines Quartals elektronisch übermittelt und den Patientinnen und Patienten über die eGK oder die E-Rezept-App der gematik oder der Krankenkasse bereitgestellt werden, ohne dass ein Besuch in der Praxis erforderlich ist. Dadurch bleibt mehr Zeit für die Behandlung akut erkrankter Patientinnen und Patienten.Bestmögliche Versorgung durch lückenlose DokumentationMit dem E-Rezept und dem E-Medikationsplan sind wichtige Informationen zur Medikation der Patientinnen und Patienten direkt verfügbar. Diese Informationen können auch an die elektronischen Patientenakte übertragen werden – für eine bestmögliche integrative Versorgung.Verbesserung der ArzneimittelsicherheitDurch das E-Rezept werden die Informationen zur Medikation direkt bei der Verschreibung elektronisch erfasst. Da E-Rezepte bei Erstellung auf die formale Richtigkeit überprüft werden, entfallen zudem viele Rückfragen aus den Apotheken.Fernbehandlungen funktionieren voll digitalMit dem E-Rezept sind Praxen gerüstet für neue Versorgungsformen wie die Telemedizin. Im Anschluss an digitale Videosprechstunden kann das elektronische Rezept kontaktlos an die Patientinnen und Patienten übermittelt werden. So kann das E-Rezept auch neue Arbeitskonzepte ermöglichen, z.B. eine Rezeptsprechstunde aus dem Homeoffice. Zudem kann das die Versorgung von Patientinnen und Patienten verbessern, die weiter entfernt wohnen. Erklärfilm - E-Rezept per eGK einlösen Bitte akzeptieren Sie YouTube-Cookies um dieses Video anzuschauen. Einstellungen ändern So funktioniert das E-Rezept Verordnung über das Praxisverwaltungssystem Im Rahmen der Sprechstunde erstellen Sie wie gewohnt Rezepte in Ihrem Praxisverwaltungssystem. Dabei wird das E-Rezept bereits automatisch auf Vollständigkeit geprüft, so dass Formfehler vermieden werden. Elektronische Signatur mit dem Heilberufsausweis Sie unterschreiben das Rezept am Computer sicher und digital mit Ihrem Heilberufsausweis. Mit der Unterschrift werden die Informationen aus der Verordnung direkt in der Telematikinfrastruktur (TI) gespeichert und dabei sicher verschlüsselt. So können die Rezeptdaten später direkt in der Apotheke abgerufen werden. Rezept zur Einlösung verfügbar machen Die Informationen des signierten E-Rezepts können von Ihrer Patientin oder Ihrem Patienten mittels eines Rezeptcodes abgerufen oder zur Einlösung mit der eGK in der TI hinterlegt werden. Den Code können Patientinnen und Patienten über ihre E-Rezept-App abrufen oder alternativ als Papierausdruck erhalten. Alle in der TI gespeicherten, offenen Rezepte können sie sicher und einfach mit ihrer elektronischen Gesundheitskarte in der Apotheke einlösen. Elektronische Ersatzbescheinigung (eEB) Wenn die bzw. der Versicherte einmal die Gesundheitskarte vergessen hat beim Praxisbesuch, kann sie oder er die Versichertendaten mit der elektronischen Ersatzbescheinigung (eEB) übermitteln lassen. Dafür fordert sie oder er die eEB, etwa über die App der Krankenkasse auf dem Smartphone, selbst bei der Krankenkasse an, indem sie bzw. er den QR-Code der Praxis einscannt. Praxen können diesen in ihren Räumen oder auch auf ihrer Webseite für die Patientinnen und Patienten bereitstellen. Mehr dazu unter www.praxis-check-in.de Ein E-Rezept, das die Praxis ausstellt, kann die bzw. der Versicherte im Anschluss ebenfalls kartenlos über die E-Rezept-App einlösen. E-Rezept für Privatversicherte Erleichtert Ihren Praxisalltag, bietet noch mehr Service für Ihre Privatpatient:innen: das E-Rezept für Privatversicherte Privatversicherte können zunehmend Rezepte für verschreibungspflichtige Arzneimittel auch via App „Das E-Rezept“ auf dem Smartphone einlösen. Dazu wird eine digitale Identität für die Nutzung der E-Rezept-App angeboten sowie eine App-Funktion für den Online Check-in. Weitere Informationen zum E-Rezept für Privatversicherte erhalten Sie beim Verband der Privaten Krankenversicherung (externer Link). Online Check-in Der Online Check-in ermöglicht eine sichere Übermittlung der Krankenversichertennummer an Ihre Praxis, so bekommen Arztpraxen die Identitätsbestätigung der Privatpatient:innen und den Nachweis des Versichertenverhältnis nun elektronisch übermittelt. Wann es so weit ist, erfahren Privatversicherte von ihrer jeweiligen privaten Krankenversicherung. Das Ausstellen eines E-Rezepts für Privatversicherte funktioniert in der Praxis ganz einfach und für Sie genau wie E-Rezepte für gesetzlich Versicherte. Auch Privatpatient:innen können Sie beispielsweise Folgerezepte ausstellen und mitteilen, dass sie per App auf das Rezept zugreifen können, ohne dass die Patient:innen dafür in die Praxis kommen müssen. Wie das Einlösen des Rezepts für Ihre Privatpatientin bzw. Ihren Privatpatienten im weiteren Prozess funktioniert: Sie oder er übermittelt das E-Rezept an eine Apotheke der Wahl für eine spätere Abholung oder Zustellung per Lieferboten bzw. löst es unter Vorzeigen der App direkt in einer Apotheke ein. Die Apotheke ruft über ihr Apothekenverwaltungssystem (AVS) das E-Rezept aus dem Fachdienst auf und klärt mit der bzw. dem Versicherten die Bereitstellung des Kostenbelegs entweder via App oder Ausdruck. Wie Sie als Ärztin oder Arzt, Zahnärztin oder Zahnarzt ein E-Rezept für Privatversicherte ausstellen Ihr Praxisverwaltungssystem (PVS) muss bereits das E-Rezept für Privatversicherte unterstützen. Sie benötigen ein Update Ihres Praxisverwaltungssystems mit der neuen Funktion. Fragen Sie ggf. bei Ihrem PVS-Hersteller nach, ob bzw. wann das Update verfügbar ist. Privatversicherte müssen einmalig ihre Krankenversicherungsnummer (KVNR) per Online Check-in an Ihre Praxis übermittelt haben. Sie verordnen im Patientengespräch (in der Praxis oder einer Videosprechstunde) ein apothekenpflichtiges Arzneimittel als E-Rezept. Die Verordnung für die Privatpatientin bzw. den Privatpatienten speichern Sie über Ihr PVS im Fachdienst fürs E-Rezept und signieren dieses mit Ihrem Heilberufsausweis (wie Sie es für gesetzlich Versicherte kennen). Ihre privatversicherten Patientinnen und Patienten können das E-Rezept über die App abrufen und einlösen. Sollte das Ausstellen eines E-Rezeptes für eine Privatversicherte oder einen Privatversicherten einmal nicht möglich sein, dürfen Sie wie bisher ein klassisches Privatrezept ausstellen. Wer möchte, kann sich aus Ihrer Praxis einen Ausdruck des E-Rezepts mitgeben lassen und diesen in der Apotheke vorlegen. Erklärfilm für das Wartezimmer: Vorteile für Versicherte Sie brauchen ein neues Rezept? Sparen Sie Zeit! Zusätzliche Informationen Folgerezepte mit dem E-Rezept - Tipps für die Praxis-Organisation PDF | 598 KB | 29.02.2024 Download E-Rezepte korrigieren So funktioniert es PDF | 457 KB | 13.12.2023 Download Diese Rezepte können Sie elektronisch verschreiben PDF | 668 KB | 07.12.2023 Download Kurz erklärt: Wie funktioniert das E-Rezept? Informationen für (Zahn-)Arztpraxen PDF | 880 KB | 06.12.2023 Download Information für Zahnärztinnen und Zahnärzte - Freitext-Verordnungen: So geht's richtig PDF | 42 KB | 25.10.2023 Download Praxisbeispiel: Mehr Komfort bei regelmäßiger Medikation PDF | 707 KB | 30.06.2023 Download Erfahren Sie mehr HBA – Eintrittskarte für die digitale Welt #c-37 svg path {fill: #fff} .st0{fill:#000E52;} Unser Fachportal: Checklisten und weitere Informationen © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
