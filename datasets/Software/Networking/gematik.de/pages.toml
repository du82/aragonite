full_description = "Auf einen Blick Schneller Austausch Sie kommunizieren sicher Download: Checkliste zum Anschluss an die TI Erfahren Sie mehr Inhalte dieser Seite Physiotherapie Einfachere Kommunikation, ganzheitliche Behandlung Bandscheibenvorfälle, Rheuma oder Osteoporose – Erkrankungen wie diese führen jedes Jahr 20 Prozent aller privat und gesetzlich Versicherten in eine physiotherapeutische Praxis. Für Sie als Physiotherapeutin bzw. -therapeut ist die ganzheitliche Betreuung Ihrer Patientinnen und Patienten das oberste Ziel. Die Telematikinfrastruktur (TI) – die digitale Infrastruktur des deutschen Gesundheitssystems – unterstützt Sie dabei: Sie verbindet auf einer sicheren Plattform alle Gesundheitsprofis, um wichtige medizinische Informationen für eine individuelle Behandlung sicher und unkompliziert auszutauschen und die gezielte Behandlung gemeinsam abzustimmen. Sie haben alle Gesundheitsdaten im Blick Die TI ermöglicht Ihnen den Zugriff auf die elektronische Patientenakte (ePA), auf Medikationspläne, Notfalldaten und Stammdaten der Versicherten. So erhalten Sie einen schnellen Überblick über die Kranken- und Behandlungsgeschichte Ihrer Patientinnen und Patienten – sofern diese zustimmen. Damit können Sie Ihre physiotherapeutische Behandlung optimal abstimmen und die Therapie individuell an Ihre Patientinnen und Patienten anpassen. Weitere Informationen: E-Patientenakte Notfalldaten Sie können sich schnell und unkompliziert austauschen Langwierige, komplizierte Abstimmungswege und Nachfragen gehören der Vergangenheit an. Mit dem Kommunikationsdienst KIM können Sie Dokumente schnell und einfach austauschen und Rückfragen mit Leistungserbringern wie Arztpraxen oder Krankenhäusern schnell klären. Weitere Informationen: KIM Sie kommunizieren sicher Sie können Nachrichten und Dokumente sicher austauschen. Die TI setzt auf starke Informationssicherheitsmechanismen. Damit erfüllt sie alle Datenschutzanforderungen und schützt die Gesundheitsdaten. Die sichere, verschlüsselte Kommunikation und der Schutz vor dem Zugriff Dritter auf sensible Informationen sind daher das Fundament der Telematikinfrastruktur. Weitere Informationen: Ihr Weg in die Telematikinfrastruktur Datensicherheit in der TI Download: Checkliste Physiotherapiepraxen zum Anschluss an die TI Checkliste Physiotherapiepraxen PDF | 57 KB | 06.07.2022 Download Erfahren Sie mehr Die elektronische Gesundheitskarte #c-167 svg path {fill: #fff} .cls-1{fill:#000e52;} Gematik_Piktogramme_elektronisches Rezept Blau E-Rezept: Der schnelle Weg zum richtigen Medikament #c-170 svg path {fill: #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_ KIM: Schnell und sicher kommunizieren #c-172 svg path {fill: #010e52} Notfalldatenmanagement Created with Sketch. eGK Notfalldaten: Einfach da, wenn es darauf ankommt #c-173 svg path {fill: #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_Patientenakte 2 Blau E-Patientenakte: Persönliche Daten, persönliche Entscheidungen © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
