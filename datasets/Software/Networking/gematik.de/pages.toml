full_description = "Video E-Rezept und Heimversorgung Klickdummy Pflege Statements Downloads Erfahren Sie mehr Inhalte dieser Seite E-Rezept Entlastung fürs Pflegepersonal Stationäre und ambulante Pflegeeinrichtungen profitieren vom E-Rezept. Es entlastet die bürokratischen Prozesse rund um die Medikation mit Praxen und Apotheken, denn die Kommunikations- und Übermittlungswege werden digitaler. Die Pflegekräfte gewinnen wertvolle Zeit für die Versorgung der Pflegebedürftigen. Bitte akzeptieren Sie YouTube-Cookies um dieses Video anzuschauen. Einstellungen ändern Klickdummy: Digitalisierung in der Pflege UX-Visualisierung In der Klickstrecke sehen Sie, wie die ambulante Pflege die verschiedenen Anwendungen der Telematikinfrastruktur nutzen kann: Nutzung des TI-Messengers für interne Abstimmungen Abruf der aktuellen Medikation aus der ePA auf mobilem Endgerät Versenden von Rezeptanforderungen für Folgerezepte mittels KIM Einlösen von E-Rezepten mittels KIM durch die Pflegedienstleitung Zum Klickdummy Statements „Ich habe Patienten, die in Heimen oder in Seniorenwohnungen leben und die ich besuche. Es ist natürlich sinnvoll, dass auch bei einem Heim-Patienten E-Rezepte genutzt werden, wenn dieser Medikamente braucht. Dass man das direkt und schnell erledigten kann, ohne dorthin fahren zu müssen und ohne, dass es zu lange dauert. Wenn das digitale am selben Tag von mir abgearbeitet wird, an dem es bestellt wird, dann ist das für Heime auch vorteilhaft.“ Dr. Sodabe Nawroozi, Fachärztin für Allgemeinmedizin „Speziell in der Heimversorgung hat das E-Rezept den Vorteil, dass die Distributionswege des Rezeptes an sich, des Papierstückes, wegfallen. Das hat den Vorteil, dass wir schneller versorgen können, dass wir unkomplizierter versorgen können und dass wir dort auch im Grunde genommen einen günstigeren Prozess der Versorgung haben. Die Prozesse werden digital abgebildet, das ist eine klare Vereinfachung.“ Jan Harbecke, Apotheker Zusätzliche Informationen E-Rezept zwischen Apotheke und Pflegeheim Praxisbeispiel PDF | 675 KB | 30.08.2022 Download Erfahren Sie mehr TI für die Pflege - gut informiert, besser versorgt TI-Anbindung: Ihr Weg in die Telematikinfrastruktur #c-472 svg path {fill: #00ff65} .cls-1{fill:#00ff64;} Gematik_Piktogramme_ KIM - Schnell und sicher kommunizieren © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
