["https://gematik.de/newsroom/news-detail/pressemitteilung-antiviren-gate-bietet-zusaetzlichen-schutz-fuer-den-einsatz-der-epa-im-krankenhaus"]
title = "News-Detail | gematik"
full_description = "23.02.2023 Pressemitteilung | Antiviren-Gate bietet zusätzlichen Schutz für den Einsatz der ePA im Krankenhaus Die elektronische Patientenakte (ePA) hat im Krankenhausalltag viele Vorteile und ist ein sicheres digitales Zuhause für alle Gesundheitsdaten. Um diese umfassend zu schützen, müssen eingehende Daten mit der notwendigen Aufmerksamkeit behandelt werden. Die gematik hat deshalb gemeinsam mit der RHÖN-KLINIKUM AG einen Lösungsansatz entwickelt, der speziell auf die Anforderungen im Klinik-Alltag abgestimmt ist. Dabei geht es um die Einbindung eines Virenschutzes, der Dokumente aus der ePA innerhalb des Krankenhausnetzwerks vor der Ausführung im Krankenhausinformationssystem (KIS) auf Schadsoftware prüft (ein sogenanntes Antiviren-Gate). Hierdurch wird, neben dem auf dem Client-System bestehenden Virenschutz, eine weitere Sicherheitsebene hinzugefügt, die die Ausführung von virenbefallenen Dokumenten aus der ePA minimiert. Ziel ist, die Lösung produktunabhängig und Open-Source aufzusetzen, so dass sie in jedem System bzw. Krankenhaus zum Einsatz kommen kann, um die Datensicherheits- und Datenschutzanforderungen von Kliniken zu erfüllen. „Es ist uns ein wichtiges Anliegen, die Kliniken bei der Implementierung und Einführung der ePA im Bereich Datensicherheit und Datenschutz zu begleiten. Wir zeigen mit dem Antiviren-Gate, dass eine KIS-unabhängige Lösung möglich ist“, so Dr. Raik Kuhlisch, Lead IT-Architect der gematik GmbH. „Wir haben gemeinsam eine Lösung entwickelt, die von jedem Krankenhaus in Deutschland übernommen und in ihre IT-Umgebung integriert werden kann. Die Virenschutzprüfung findet dadurch in einer vorgeschalteten geschützten IT-Umgebung statt und nicht erst im Krankenhausinformationssystem, dem IT-Herzstück eines Krankenhauses“, erklärt Julian Schäfer, Teamleiter Medizinische Fachsysteme & eHealth der RHÖN-KLINIKUM IT Service GmbH. Weitere Informationen: GitHub - gematik/ref-ePA-AV-Gate zurück © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
