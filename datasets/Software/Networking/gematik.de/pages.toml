full_description = 'Informationen für verschiedene Zielgruppen Erklärfilm - E-Rezept per eGK einlösen Vernetzung von TI-Anwendungen Die App zum E-Rezept FAQ Reportage Erfahren Sie mehr Inhalte dieser Seite E-Rezept Der schnelle Weg zum richtigen Medikament Das E-Rezept ist neuer Standard. Es wird ausschließlich digital erstellt und signiert und kann mit der elektronischen Gesundheitskarte, mit dem Smartphone oder mit einem Ausdruck in Apotheken eingelöst werden. Mit der E-Rezept-App der gematik erhalten Patientinnen und Patienten einen datenschutzkonformen und sicheren Zugang zu Rezeptdaten. Das elektronische Rezept wird im ersten Schritt für alle Verordnungen von verschreibungspflichtigen Arzneimitteln verbindlich. Ausnahmen: Betäubungsmittelrezepte und gesetzliche geregelte Ausnahmen zum Beispiel bei direkter Zuweisung von Verordnungen wie Zytostatika. Auch mehr und mehr private Krankenversicherungen bieten ihren Versicherten das E-Rezept freiwillig an. Weniger ist mehr – das bringt das E-Rezept … #c-1542-31 svg path {fill: #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_Versicherte Blau … für Versicherte Zu unserer Themenseite für die Bevölkerung #c-1542-32 svg path {fill: #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_Ärzte Blau … für Praxen Weniger Zettel, mehr Zeit für Patienten #c-1542-178 svg path {fill: #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_Krankenhaus Blau ...für Krankenhäuser Einfacher im Klinikalltag #c-1542-33 svg path {fill: #010e52} .st0{fill:#000E52;} … für Apotheken Weniger Bürokratie, mehr Beratung Erfahrungsberichte Aus dem Versorgungsalltag ...für Pflegeeinrichtungen Entlastung fürs Pflegepersonal Erklärfilm - E-Rezept per eGK einlösen Bitte akzeptieren Sie YouTube-Cookies um dieses Video anzuschauen. Einstellungen ändern Interaktive Infografik Öffnen Zusammenspiel von E-Rezept & ePA Erfahren Sie hier interaktiv, wie E-Rezept und ePA für alle ineinandergreifen. × .ctype-ce_iframe_teaser .modal .modal-dialog .modal-content .modal-body, .ctype-ce_iframe_slider .modal .modal-dialog .modal-content .modal-body { aspect-ratio: unset; } .ctype-ce_iframe_teaser .modal .modal-dialog .modal-content, .ctype-ce_iframe_slider .modal .modal-dialog .modal-content { height:100%; } .ctype-ce_iframe_teaser .modal .modal-dialog, .ctype-ce_iframe_slider .modal .modal-dialog { max-width: 98%; max-height: 95%; } .close { font-size: 3rem; } So könnten digitale Anwendungen künftig miteinander funktionieren Wie die Vernetzung zwischen Praxen, Krankenhäusern, Apotheken und Patienten mit TI-Messenger, ePA, E-Rezept, KIM und Co. zukünftig aussehen kann, verdeutlicht unsere interaktive Patientengeschichte zum Thema Herzinsuffizienz. Klicken Sie sich durch Vincents Geschichte und erfahren Sie, wie Anwendungen der Telematikinfrastruktur (TI) künftig in Versorgunsprozesse eingebunden werden könnten. Zur interaktiven Patientengeschichte Die App zum E-Rezept Die App "Das E-Rezept" der gematik bietet Versicherten komfortable Funktionen, die die Verwaltung und Einlösung von E-Rezepten erleichtern. Für die Anmeldung in der App brauchen Sie ein NFC-fähiges Smartphone sowie eine NFC-fähige Gesundheitskarte samt PIN von Ihrer Krankenkasse. Alternativ können Sie sich ggf. auch mit der ePA-App Ihrer Krankenkasse in der E-Rezept-App anmelden oder die App Ihrer Krankenkasse für das E-Rezept nutzen. Mehr Informationen für Versicherte und die Datenschutz-Folgenabschätzung zur gematik-App "Das E-Rezept" finden Sie auf der Website: https://www.das-e-rezept-fuer-deutschland.de/app Jetzt kostenfrei downloaden FAQ Industrie Patient Praxen Krankenhäuser Apotheken Pflege Sicherheit Was ist das E-Rezept?Das E-Rezept ersetzt weitestgehend den „rosa Zettel“ bei der Verschreibung rezeptpflichtiger Arzneimittel. Ärztinnen und Ärzte können das E-Rezept digital ausstellen und damit sicher im digitalen Gesundheitsnetzwerk, der sogenannten Telematikinfrastruktur, speichern. Patientinnen und Patienten können ihr E-Rezept mit ihrer elektronischen Gesundheitskarte (eGK), mit der App „Das E-Rezept“ oder auf Wunsch mit einem E-Rezept-Papierausdruck in der Apotheke einlösen: Die eGK wird in der Apotheke ins Terminal gesteckt, E-Rezept-App und Papierausdruck enthalten einen QR-Code der Verordnung, den die Apotheke einscannt. Mit der E-Rezept-App können Patientinnen und Patienten alternativ auch Medikamente bei der Apotheke zurücklegen oder – falls angeboten – per Botendienst liefern lassen.Wo kann ich das E-Rezept einlösen?Das E-Rezept kann in allen Apotheken in Deutschland eingelöst werden. Auch Online-Apotheken lösen das E-Rezept ein.Welche E-Rezept-App kann ich nutzen?Sie können das E-Rezept mit der offiziellen App der gematik („Das E-Rezept“) nutzen. Auch Krankenversicherungen können die E-Rezept-Funktionalität in ihrer App anbieten. Bitte erkundigen Sie sich bei Ihrer Versicherung, ob bzw. ab wann diese Funktion bereits zur Verfügung steht.Welche Ärztinnen und Ärzte stellen E-Rezepte aus?Alle Ärztinnen und Ärzte sind seit dem 01.01.2024 verpflichtet, das E-Rezept für verschreibungspflichtige Arzneimittel zulasten der gesetzlichen Krankenversicherung zu nutzen.Sind E-Rezepte fälschungssicher?E-Rezepte werden von der/dem verordnenden Ärztin/Arzt qualifiziert elektronisch signiert. Die Apotheke überprüft diese Signatur im Rahmen der Abgabe des Medikaments. Zudem sind E-Rezepte nur einmalig einlösbar. Funktioniert das E-Rezept auch für Privatpatientinnen und -patienten?Privatversicherte Menschen können E-Rezepte erhalten, sofern ihre Krankenversicherung bereits eine digitale Identität (sog. GesundheitsID) und den sogenannten „Online Check-in“ anbietet.Seit wann ist das E-Rezept Pflicht?(Zahn-)Arztpraxen und Krankenhäuser sind verpflichtet, gesetzlich Versicherten seit dem 1. Januar 2024 elektronische Rezepte in der Regelversorgung auszustellen. Damit startet die Ablösung des Muster 16, dem „rosa Zettel“, bis auf wenige Ausnahmen für verschreibungspflichtige Arzneimittel.Ist das E-Rezept kostenlos?Das E-Rezept ist für Patientinnen und Patienten kostenlos.Welche Medikamente kann ich mit einem E-Rezept bekommen?Welche Rezepttypen bereits per E-Rezept funktionieren, können Sie dieser Liste entnehmen:Apothekenpflichtige Arzneimittel („Rosa Rezept“)Empfehlungen der Ärztin bzw. des Arztes („Grünes Rezept“)Nicht-verschreibungspflichtige Arzneimittel für Kinder unter 12 JahrenPrivatrezept für GKV-Versicherte („Blaues Rezept“)Hinweis: „Wunscharzneimittel“ können von Apotheken gegen Aufzahlung abgegeben werdenEine Übersicht finden Sie hier https://www.gematik.de/media/gematik/Medien/E-Rezept/Infomaterial/gematik_eRezept_Medikamente_Praxen_RGB-1.pdfWie lange sind E-Rezepte gültig?E-Rezepte haben die gleiche Gültigkeit wie Papierrezepte. Sie können 28 Tage zulasten der gesetzlichen Krankenkasse eingelöst werden. Anschließend können sie als Selbstzahlerrezept bis zum Ablauf der Gültigkeit eingelöst werden, also insgesamt 3 Monate nach Ausstellung. E-Rezepte werden 100 Tagen nach der Einlösung automatisch gelöscht. Versicherte können ihr E-Rezept selbst löschen – auch ohne dass das E-Rezept eingelöst wurde. E-Rezepte, die nicht eingelöst wurden, werden automatisch zehn Tage nach Ablauf der Rezeptgültigkeit (Datum der Rezeptausstellung + 92 Kalendertage) gelöscht.Gibt es das E-Rezept auch für Kinder?Auch Kinder können E-Rezepte erhalten. Diese können Sie entweder mit der elektronischen Gesundheitskarte (falls vorhanden) oder dem Papierausdruck einlösen. Über die Familienfunktion in der E-Rezept-App können Sie zudem die Rezepte Ihrer Kinder und anderer Angehörigen verwalten. Zu diesem Suchbegriff wurde leider kein Eintrag gefunden. Alle FAQ Zusätzliche Informationen Reportage_E-Rezept_2024.pdf PDF | 178 KB | 19.04.2024 Download Erfahren Sie mehr Das E-Rezept in Europa Aktuelle Zahlen: das TI-Dashboard © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA'
