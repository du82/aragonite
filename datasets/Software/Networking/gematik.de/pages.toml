description = "Die gematik trägt die Gesamtverantwortung für die Telematikinfrastruktur (TI), die zentrale Plattform für digitale Anwendungen im deutschen Gesundheitswesen."
full_description = 'Zum Webshop Start der ePA für alle Kostenlose Infopakete für Praxen, Kliniken und Apotheken Zur Bestellung Aktuelles21.01.2025 Aktuelles| CompuGroup Medical erhält Zulassung für TI-Messenger 17.01.2025 Aktuelles | Pilotphase: Erste Eindrücke aus der Modellregion Hamburg & Umland 16.01.2025 Aktuelles | Aktensystemhersteller RISE und IBM zugelassen 15.01.2025 Aktuelles | ePA für alle startet in drei Modellregionen 30.12.2024 Aktuelles | Aufzeichnungen der Veranstaltung "gematik trifft" mit dem DAV sind online 27.12.2024 Aktuelles | Stellungnahme zum CCC-Vortrag zur ePA für alle Newsroom Anwendungen E-Patientenakte Mit der elektronischen Patientenakte (ePA) haben Versicherte ihre Gesundheit stets im Blick. E-Rezept Das E-Rezept macht Ihr Leben leichter – und endlich Schluss mit der Zettelwirtschaft. KIM Der sichere E-Mail-Standard für das Gesundheitswesen. Notfalldaten Wenn es auf Sekunden ankommt. Ihre Notfalldaten auf der Gesundheitskarte. DEMIS Gefährliche Infektionskrankheiten schneller und besser bekämpfen. TI-Messenger Per Sofortnachricht einfach, schnell und sicher kommunizieren. ISiK Eine digitale Sprache für den Klinikalltag. Alle Anwendungen Die Zukunft des Gesundheitswesens ist digital Angebote für #c-247-7 svg path {fill: #010e52} .st0{fill:#000E52;} Versicherte Sicher für ihre Gesundheit: Wie die Digitalisierung die Gesundheitsversorgung verbessert #c-247-8 svg path {fill: #010e52} .st0{fill:#000E52;} Praxen Mehr Zeit für Ihre Patienten: Wie die Digitalisierung Ihre Arbeit entlastet #c-247-9 svg path {fill: #010e52} .st0{fill:#000E52;} Apotheken Mehr Zeit für Beratung: Wie Apotheken von der Digitalisierung profitieren #c-247-10 svg path {fill: #010e52} .st0{fill:#000E52;} Krankenhäuser Weniger Bürokratie, mehr Behandlungszeit: Ihre Vorteile vom digitalen Gesundheitswesen #c-247-23 svg path {fill: #010e52} .b{fill:#00ff64;} Rehabilitation Weniger Bürokratie, optimale Rehabilitation: Was Reha-Einrichtungen das digitale Gesundheitswesen bringt #c-247-24 svg path {fill: #010e52} .st0{fill:#000E52;} Pflege Gut informiert, besser versorgt: Wie Telematik die Pflege voranbringen kann „Die Medikationsliste in der ePA gibt mir wertvolle Einblicke in die Medikation meiner Patient:innen und steigert die Therapiesicherheit.“Dr. Sagheri, Zahnarzt „Ich glaube, die Digitalisierung wird zu einer großen Transparenz führen und damit die Pflegequalität steigern.“Ursula Oleimeulen, Projektadministratorin Pflegewerk Berlin „Ich erhoffe mir vom elektronischen Rezept eine Erleichterung, dass das Einlösen eines Rezepts schneller, sicherer und zuverlässiger funktioniert.“Linus Niesel, Versicherter © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA'
