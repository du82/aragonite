title = "HBA | gematik"
description = """
Informationsblatt HBA                                                                                                                                                                                PDF | 214 KB | 26.11.2021"""
full_description = 'Video zum Bestellvorgang Heilberufsausweise der gematik für weitere Anwender FAQ Inhalte dieser Seite Aktuelle Probleme und Störungen TI-Status WhatsApp-Kanal der gematik Aktuelle Probleme und Störungen HBA Eintrittskarte für die digitale Welt Der elektronische Heilberufsausweis (HBA) ist der zentrale Zugang zu wichtigen Telematikinfrastruktur-Anwendungen. Er ist z.B. für das Auslesen und Signieren des Notfalldatensatzes notwendig. Benötigt wird er außerdem, um Arztbriefe, Befunde, E-Rezepte und elektronische Arbeitsunfähigkeitsbescheinigungen (eAU) rechtssicher elektronisch zu signieren. So funktioniert der Bestellvorgang für Ärzte Einfach erklärt: eArztausweis für Ärzte Bitte beachten: Für andere Gesundheitsberufe und -handwerke unterscheidet sich der Bestellprozess. Privatärztinnen und Privatärzte erhalten ihren HBA von den für sie zuständigen Landesärztekammern. Für Pflegekräfte ist das elektronische Gesundheitsberuferegister (eGBR) zuständig. Mehr zu Herausgebern und Anbietern des Heilberufsausweises Heilberufsausweise der gematik für weitere Anwendergruppen der Telematikinfrastruktur Anwendergruppen in unserem Gesundheitssystem, die nicht durch Standesorganisationen vertreten sind, werden mit dem Heilberufsausweis der gematik versorgt. Das sind beispielsweise die im EU-Ausland ansässigen Versandapotheker, die Pharmazieingenieure und die Apothekenassistenten. Diese Berufsgruppen benötigen den Ausweis für die rechtssichere qualifizierte elektronische Signatur von Dispensierdatensätzen inklusive korrigierter oder ergänzter Verordnungen, von Abrechnungsdatensätzen und von Dokumentationen in Vertretung der Apothekenleitung. Ferner können sie ihn einsetzen für die Ver- und Entschlüsselung von vertraulichen Daten oder Dokumenten wie z. B. KIM-Nachrichten des persönlichen Postfaches. Für alle diese Anwender handelt die gematik gemäß ihrem gesetzlichen Auftrag (gemäß § 340 (4) SGB V) und agiert somit innerhalb der Telematikinfrastruktur einmal mehr nicht nur als Normierungsinstitution, sondern auch als verantwortlicher Kartenherausgeber. Weiterführende Informationen und eine kompakte Übersicht zur Antragstellung bzw. zur Berechtigungsprüfung sind in unserem Fachportal zu finden. Informationen zur Freischaltung und Aktivierung D-Trust – Ein Unternehmen der Bundesdruckerei-Gruppe Anleitungsvideo Freischaltung: https://www.youtube.com/watch?v=YfXTSk4_MEQ FAQ-Bereich: https://www.bundesdruckerei.de/de/Service-Support/Service/Elektronischer-Heilberufsausweis-eHBA Medisign Inbetriebnahme: PIN-Änderung und Freischaltung: https://www.medisign.de/support/wp-content/uploads/sites/2/2021/10/Kurzanleitung_Inbetriebnahme-medisign-eHBA.pdf https://www.medisign.de/support/article/ehba-g2-pin-aenderung-und-freischaltung/ https://www.medisign.de/support/article/ehba-g2-pin-aenderung-mit-dem-dgn-pintool/ FAQ-Bereich: https://www.medisign.de/support/haeufige-fragen/elektronische-heilberufsausweise-ehba/ SHC+Care Checkliste Einrichtung und Freischaltung: https://shc-care.de/storage/files/101015%20Checklisten%20HBA-Freischaltung_V0.02.pdf Bestellprozess https://shc-care.de/produkte/heilberufsausweis-ehba/bestellprozess/377 T-Systems Informationen & Downloads: https://www.telesec.de/de/branchen-and-eco-systeme/gesundheitswesen/details/heilberufsausweis-hba/ Handbuch und Download des PIN-/PUK-Tools zur Aktivierung von Heilberufsausweisen (HBA): https://www.telesec.de/de/service/downloads/branchen-und-eco-systeme/#smc-b-und-hba-413 Fragen und Antworten: https://www.telesec.de/de/service/faq/branchen-und-eco-systeme/#heilberufsausweis-hba-398 Alles auf einen Blick Informationsblatt HBA PDF | 214 KB | 26.11.2021 Download Kurz erklärt: Komfortsignatur PDF | 623 KB | 19.12.2022 Download Herausgeber und Anbieter des HBA Landesärztekammern Landeszahnärztekammern Landesapothekerkammern Landespsychotherapeutenkammern gematik Elektronisches Gesundheitsberuferegister (eGBR) D-Trust GmbHZum HBA der D-Trust GmbH Medisign GmbHZum HBA der Medisign GmbH SHC+CAREZum HBA von SHC+CARE T-Systems International GmbHZum HBA der T-Systems International GmbH Fragen und AntwortenIch arbeite in einer Praxis mit mehreren Behandelnden. Benötigen alle einen eigenen Heilberufsausweis und ein eigenes Terminal zum Signieren?Sie alle benötigen einen eigenen Heilberufsausweis, pro Praxis ist aber ein zentrales Kartenterminal ausreichend.Wie aktiviere ich einen neuen HBA?Bereiten Sie alle PINs (auch Ihre neuen) vor. Bitte beachten Sie, dass es 2 unterschiedliche PINs gibt: eine Karten-PIN (PIN-CH) und eine PIN-QES. Wenn Sie für eine PIN im Primärsystem "aktivieren" auswählen, gehen Sie dabei bitte zügig vor, da einige Primärsysteme nach 30 Sekunden die Meldung anzeigen, dass der Vorgang unterbrochen wurde. Sollte Ihr Primärsystem diese Meldung ausgeben, ignorieren Sie diese. Führen Sie die PIN-Änderung am Kartenterminal zu Ende. Nach einem erneuten Stecken des HBA sollte nun nicht mehr angezeigt werden, dass die PIN im Transportstatus ist. Wenn das so ist, können Sie davon ausgehen, dass der HBA die neue PIN übernommen hat und diese ab sofort eingesetzt werden kann. Vergessen Sie bitte nicht, den HBA zusätzlich noch im Antragsportal des Kartenanbieters freizuschalten. Zum genauen Vorgehen informieren die Kartenanbieter.Was geschieht bei Verlust des elektronischen Heilberufeausweises?Bei Verlust des Heilberufsausweises ist dieser beim Kartenanbieter zu sperren, um eine missbräuchliche Verwendung zu verhindern. Gleichzeitig kann eine Ersatzkarte bestellt werden. Für die Zwischenzeit sind Ersatzverfahren definiert, um den Betrieb einer Praxis aufrechtzuerhalten. Zu diesem Suchbegriff wurde leider kein Eintrag gefunden. Alle Fragen und Antworten © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA'
