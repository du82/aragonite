title = "FAQ | gematik"
full_description = "FAQ - Notfalldaten Versicherte Ärzte Gesundheitsfachpersonal Alle öffnen Was ist das Notfalldatenmanagement (NFDM)?Das Notfalldatenmanagement (NFDM) ist eine freiwillige, kostenlose Servicefunktion in der Telematikinfrastruktur. Das Notfalldatenmanagement umfasst zum einen den Notfalldatensatz (NFD) und zum anderen den Datensatz Persönliche Erklärungen (DPE).Was ist der Notfalldatensatz (NFD)?Der Notfalldatensatz (NFD) ist eine Übersicht über notfallrelevante medizinische Informationen auf Ihrer Gesundheitskarte.Folgende Informationen können Sie als Notfalldatensatz von bspw. Ihrer Hausärztin oder Ihrem Hausarzt hinterlegen lassen:Informationen zu chronischen oder seltene ErkrankungenInformationen zu regelmäßig eingenommenen MedikamentenAllergien und Unverträglichkeitenweitere medizinische Hinweise (z.B. Schwangerschaft oder Implantate)Kontaktdaten von Angehörigen, die im Notfall benachrichtigt werden sollenKontaktdaten von behandelnden Ärztinnen und Ärzten.Die Erstellung der Notfalldaten ist für Sie freiwillig und kostenlos.Wann ist ein Notfalldatensatz hilfreich? In einem medizinischen Notfall kommt es oft auf Sekunden an. Und genau in diesen Situationen kann der Notfalldatensatz zum Einsatz kommen. Denn Dann ist es wichtig, dass zum Beispiel Notärzte auf wichtige medizinische Informationen sekundenschnell zugreifen können – auch und gerade wenn Sie nicht ansprechbar sind.Ein Notfalldatensatz auf Ihrer Gesundheitskarte unterstützt Ärztinnen und Ärzte bei der bestmöglichen Gesundheitsversorgung unter Berücksichtigung Ihrer individuellen Bedürfnisse.Wer erstellt meinen Notfalldatensatz?Wenn Sie in die Erstellung eines Notfalldatensatzes einwilligen, kann jede (Zahn-)Ärztin bzw. jeder (Zahn-)Arzt, die/der umfassend über Ihren Gesundheitszustand sowie Ihre Befunde, Diagnosen und Therapiemaßnahmen informiert ist, einen Notfalldatensatz anlegen oder aktualisieren.Ich möchte einen Notfalldatensatz auf meiner Gesundheitskarte. Was muss ich tun?Arztpraxen, Zahnarztpraxen und Krankenhäuser können Ihre Notfalldaten direkt auf Ihrer Gesundheitskarte speichern – sofern Sie dies wünschen und einer Speicherung zustimmen. Grundsätzlich ist der Notfalldatensatz für Sie eine freiwillige Option.Schritt für Schritt zum Notfalldatensatz auf der GesundheitskarteSprechen Sie beim nächsten regulären Termin Ihre Ärztin, Ihren Arzt oder deren medizinisches Fachpersonal an. Sagen Sie, dass Sie einen Notfalldatensatz auf Ihrer Gesundheitskarte wünschen.Besprechen Sie dann mit Ihrer Ärztin oder Ihrem Arzt, welche Informationen über Ihre Gesundheit bzw. über Ihre individuelle medizinische Vorgeschichte im Notfall bedeutsam sind.Willigen Sie mündlich oder schriftlich ein, dass diese Angaben auf Ihrer Gesundheitskarte gespeichert werden.Auf Wunsch können Sie einen Ausdruck Ihrer Notfalldaten erhalten.Sprechen Sie Änderungen rechtzeitig an, damit Ihre Notfalldaten beim nächsten Praxisbesuch aktualisiert werden.Kann ich meine Notfalldaten einsehen?Im Rahmen einer ärztlichen Versorgung/Behandlung können Sie Ihre Notfalldaten einsehen. Auf Wunsch erhalten Sie außerdem einen Ausdruck Ihrer Notfalldaten auf Papier.Wer kann meine Notfalldaten in einem Notfall sehen?Ist der Patient in einer Notfallsituation nicht zustimmungsfähig und können anamnestische Daten nicht oder nicht vollständig erhoben werden, so dürfen berechtigte Personen den NFD auch ohne Zustimmung des Patienten von der Gesundheitskarte auslesen. Zum Auslesen berechtigt sind alle Ärzte und Zahnärzte sowie das unter Aufsicht eines Arztes oder Zahnarztes tätige Personal medizinischer Einrichtungen (z. B. Pflegepersonal in der Notaufnahme), weiterhin alle Angehörigen anderer medizinischer Berufe mit einem elektronischen Berufsausweis (z.B. Notfallsanitäter).Kann ich meinen Notfalldatensatz löschen?Sie können Ihre Einwilligung zum Notfalldatensatz jederzeit widerrufen. Auf Ihren Wunsch wird dann Ihre behandelnde (Zahn-)Ärztin bzw. Ihr behandelnder (Zahn-)Arzt die Notfalldaten Ihrer Gesundheitskarte löschen.Kann ich der Aufnahme bestimmter Informationen im Notfalldatensatz (NFD) widersprechen (Widerspruchsrecht)?Aufgrund des informationellen Selbstbestimmungsrechts können Sie grundsätzlich der Aufnahme bestimmter Angaben in Ihren Notfalldatensatz (NFD) widersprechen, etwa, weil Sie diese als stigmatisierend empfinden (z.B. eine psychiatrische Erkrankung).Würde ein unvollständiger NFD Sie gefährden, hat Ihre behandelnde (Zahn-)Ärztin bzw. Ihr behandelnder (Zahn-)Arzt allerdings das Recht, die Erstellung des Notfalldatensatzes oder auch dessen Aktualisierung zu verweigern.Kann ich meine Notfalldaten auf der Gesundheitskarte durch eine PIN schützen?Bei Bedarf können Sie Ihren Notfalldatensatz mithilfe Ihrer Gesundheitskarten-PIN schützen. Diese mindestens sechsstellige PIN erhalten Sie von Ihrer Krankenversicherung.In bestimmten Situationen – zum Beispiel während eines regulären Arzttermins – müssen Sie dann den PIN eingeben, wenn Sie bspw. Ihrer Ärztin Einsicht in Ihren Notfalldatensatz gewähren wollen.Im Notfall jedoch ist das Auslesen Ihrer Notfalldaten für Befugte (z.B. Notfallarzt) stets ohne PIN-Eingabe möglich.Was passiert mit meinem Notfalldatensatz, wenn ich meine Gesundheitskarte verliere oder eine neue Gesundheitskarte beantrage? Falls Sie Ihre Gesundheitskarte verlieren oder eine neue Gesundheitskarte beantragen, muss Ihr Notfalldatensatz erneut erstellt werden.In diesem Fall kann Ihre behandelnde (Zahn-)Ärztin bzw. Ihr behandelnder (Zahn-)Arzt, die/der zuletzt Ihre Notfalldaten auf Ihrer alten Gesundheitskarte gespeichert bzw. aktualisiert hat, Ihre Notfalldaten auf die neue Karte übertragen.Ihr Notfalldatensatz wird ausschließlich auf Ihrer Gesundheitskarte sowie als Kopie bei Ihrer behandelnden (Zahn-)Ärztin/bei Ihrem behandelndem (Zahn-)Arzt/ Zahnarzt oder Ihrem Krankenhaus gespeichert. Eine Speicherung Ihrer Notfalldaten bei Ihrer Krankenversicherung ist weder rechtlich zulässig noch technisch möglich. Kann ich meine Notfalldaten auch in meiner elektronischen Patientenakte (ePA) speichern?Sie können eine Kopie Ihres Notfalldatensatzes in Ihrer elektronischen Patientenakte speichern lassen. Dies kann zum Beispiel durch Ihre Hausärztin oder Ihren Hausarzt im Anschluss an die Erstellung des Notfalldatensatzes erfolgen.Kann mein Datensatz Persönliche Erklärungen ohne meine Einwilligung eingesehen werden?Der „Datensatz Persönliche Erklärungen“ auf Ihrer Gesundheitskarte enthält Hinweise dazu, wo Sie Ihren Organspendeausweis, Ihre Patientenverfügung und Ihre Vorsorgevollmachten aufbewahren.Unter folgenden Bedingungen kann dieser Datensatz ohne Ihre aktive Einwilligung eingesehen werden:OrganspendeausweisGemäß § 3 Transplantationsgesetz dürfen Ärztinnen, Ärzte sowie deren berufsmäßige Gehilfen nach Feststellung des Todes den Datensatz Persönliche Erklärungen und somit Ihre Angaben zu Organ- oder Gewebeentnahme einsehen.Patientenverfügung und VorsorgevollmachtBei einer unmittelbar bevorstehenden, ärztlich indizierten Maßnahme (bspw. Operation), in die Sie aufgrund Ihres Gesundheitszustandes nicht mehr aktiv einwilligen können, dürfen Ärztinnen, Ärzte sowie deren berufsmäßige Gehilfen den Datensatz einsehen, um Ihre Wünsche gemäß Patientenverfügung und Vorsorgevollmacht zu berücksichtigen.Kann ich den Datensatz Persönliche Erklärungen löschen lassen?Sie können Ihre Einwilligung in den Datensatz Persönliche Erklärungen jederzeit zurücknehmen.Sobald Sie es wünschen, wird der Datensatz Persönliche Erklärungen mit allen Willenserklärungen auf Ihrer Gesundheitskarte von Ihrer behandelnden Ärztin/Zahnärztin bzw. von Ihrem behandelnden Arzt/Zahnarzt gelöscht.Benötige ich eine schriftliche Einwilligung der Patientin/des Patienten, um einen Notfalldatensatz auf der Gesundheitskarte zu erstellen?Bevor Sie einen Notfalldatensatz erstmalig erstellen, benötigen Sie die ausdrückliche Zustimmung (Einwilligung) der Patientin/des Patienten in die Verarbeitung von medizinischen Daten. Diese Einwilligung kann sowohl mündlich als auch schriftlich erfolgen. Es empfiehlt sich, diese Einwilligung zu dokumentieren.Was ist der Datensatz Persönliche Erklärungen (DPE)? Was muss ich bei der Erstellung dieses Datensatzes beachten?Im Rahmen des Notfalldatenmanagements haben Patientinnen und Patienten die Möglichkeit, neben dem Notfalldatensatz (NFD) einen Datensatz Persönliche Erklärungen (DPE) auf ihrer Gesundheitskarte speichern zu lassen.Im DPE werden Hinweise zum Ablageort folgender Dokumente hinterlegt:OrganspendeausweisPatientenverfügungVorsorgevollmachtenDie Dokumente selbst werden nicht auf der Gesundheitskarte gespeichert.Die erstmalige Anlage eines Datensatz Persönliche Erklärungen dürfen Sie oder Ihr medizinisches Fachpersonal nur nach ausdrücklicher Einwilligung er Patientin bzw. des Patienten vornehmen. Auch Aktualisierungen bedürfen der Zustimmung der Patientin bzw. des Patienten.Im Gegensatz zum Notfalldatensatz signieren Sie den DPE nicht.Welche technische Ausstattung benötige ich, um einen Notfalldatensatz zu erstellen?Das Erstellen, Ändern und Löschen eines Notfalldatensatzes ist nur möglich, wenn Sie an die Telematikinfrastruktur angeschlossen sind.Darum benötigen Sie folgende Komponenten und Dienste:Update zum E-Health-Konnektor: Praxen benötigen für ihren Konnektor ein Software-Update ̶damit wird ihr vorhandenes Gerät zum E-Health-KonnektorPraxisverwaltungssystem-Update für NFDMeHBA (elektronischer Heilberufsausweis) mindestens der Generation 2.0(Quelle und weiterführende Informationen finden Sie hier.)Wie erstelle ich einen Notfalldatensatz (NFD)?In nur 4 Schritten können Sie einen Notfalldatensatz (NFD) anlegen:1. Ansprache und Information der Patientin/des PatientenMachen Sie oder Ihr medizinisches Personal die Patientin/den Patienten auf den Notfalldatensatz (NFD) aufmerksam.Signalisiert Ihre Patientin/Ihr Patient klares Interesse, kann Ihr Fachpersonal die Anlage des NFD im Praxisverwaltungs-/Krankenhausinformationssystem vorbereiten.2. Aufklärungsgespräch und EinwilligungIm Aufklärungsgespräch mit Ihrer Patientin/Ihrem Patienten klären Sie, ob sie/er sich ausreichend informiert fühlt oder weitere Erläuterungen wünscht.Achten Sie darauf, dass alle notfallrelevanten Informationen vorliegen und erfragen Sie diese ggf. im Rahmen der Anamnese.Erfragen Sie anschließend die mündliche oder schriftliche Einwilligung in die Verarbeitung der medizinischen Daten. Es empfiehlt sich, diese Einwilligung zu dokumentieren.3. Erstellen und Speichern des NFD Sie legen einen Notfalldatensatz mithilfe Ihres Praxisverwaltungssystems bzw. Krankenhausinformationssystems an. Hierzu benötigen Sie einen elektronischen Heilberufsausweis (HBA), um den Notfalldatensatz wie vorgeschrieben rechtsgültig elektronisch zu signieren.Den Notfalldatensatz speichern Sie auf der Gesundheitskarte. Eine Kopie des Datensatzes wird zudem in Ihrer elektronischen Dokumentation gespeichert.Auch die Speicherung des Notfalldatensatzes in der ePA ist seit dem 01.06.2021 möglich. Mittels Zugriffsberechtigung der Praxis durch den Patienten auf seine ePA kann auch Wunsch der NFD in der ePa gespeichert werden.4. Aushändigen von Papierausdruck und Informationsmaterial Nach der Anlage des NFD können Sie Ihrer Patientin/Ihrem Patienten folgende Dokumente mitgeben: Das Informationsmaterial der gematik und – falls gewünscht – einen Papierausdruck des Notfalldatensatzes.(Quelle und weiterführende Informationen finden Sie hier.) Wie kann ich einen Notfalldatensatz (NFD) auslesen?Einen Notfalldatensatz (NFD) können Sie in 3 Schritten auslesen:Holen Sie die Einwilligung der Patientin/des Patienten zum Auslesen des Notfalldatensatzes ein. Ausnahme: In einer Notfallsituation dürfen Sie den Notfalldatensatz einer nicht zustimmungsfähigen Person auch ohne Zustimmung einsehen. Die Zustimmung bzw. die ggf. fehlende Zustimmungsfähigkeit sollten Sie stets dokumentieren. Rufen Sie in Ihrem Praxisverwaltungssystem bzw. im Krankenhausinformationssystem den Notfalldatensatz auf und geben Sie einen der folgenden Auslesegründe an NotfallAktualisierungAbruf ohne Notfallhintergrund Nun können die den NFD einsehen. Auslesegrund, Zugriffszeitpunkt und zugreifende Person werden auf der Gesundheitskarte protokolliert. Ihr Praxisverwaltungs- bzw. im Krankenhausinformationssystem kann eine Kopie des Notfalldatensatzes speichern. Diese Kopie steht Ihnen zur weiteren Nutzung zur Verfügung, bspw. zu Dokumentationszwecken. Sie kann als Grundlage für Aktualisierungen oder für das Neuaufspielen des Notfalldatensatzes bei Kartenersatz genutzt werden.Wie werden die Kosten für die Bereitstellung der technischen Voraussetzungen für das Notfalldatenmanagement vergütet? Die Vergütung für die technische Ausstattung von bspw. Praxen wird in der Finanzierungsvereinbarung zwischen der Kassenärztlichen Bundesvereinigung und dem GKV-Spitzenverbandes geregelt. Sie müssen nachweisen, dass Sie die technische Ausstattung vorhalten und anwenden.Vergütung je Telematikinfrastruktur-Komponente:Notfalldatenmanagement: Update für Konnektor und Softwaresystem der Praxis (530 Euro einmalig)zusätzliches Kartenterminal (595 Euro je Kartenterminal)Zuschlag Betriebskosten auf die bereits im Rahmen der Telematikinfrastruktur-Erstausstattung gezahlten Betriebskosten (4,50 je Quartal)Beachten Sie, dass für die technische Erstausstattung zur Anbindung an die Telematikinfrastruktur und des laufenden Betriebs gesonderte Pauschalen gelten. Weitere Informationen dazu finden Sie unter: https://www.kbv.de/html/nfdm.php.(Quelle und weiterführende Informationen finden Sie unter: https://www.kbv.de/media/sp/Praxisinformation_NFDM.pdf )Benötige ich im Rahmen des Notfalldatenmanagements einen elektronischen Heilberufsausweis (HBA)?Sie können einen Notfalldatensatz sowohl direkt auf der Gesundheitskarte speichern als auch als Kopie in der elektronischen Patientenakte Ihrer Patientin/Ihres Patienten.In beiden Fällen benötigen Sie einen elektronischen Heilberufsausweis, um den Notfalldatensatz elektronisch zu signieren (sogenannte „Qualifizierte Elektronische Signatur).(Quelle und weiterführende Informationen finden Sie unter: https://www.kbv.de/html/nfdm.php)Wie wird das Anlegen/die Aktualisierung/das Löschen eines Notfalldatensatzes (NFD) vergütet?Für die Anlage, die Aktualisierung und das Löschen eines Notfalldatensatzes gelten folgende Vergütungspauschalen:Vergütung für die Anlage eines NotfalldatensatzesDie Vergütung erfolgt nur bei Ersteintragung bzw. einmalig im Krankheitsfall und nur bei Anlage durch Vertragsärztinnen und -ärzte, die anhand von Diagnostik und Therapie über ein umfassendes Bild an Befunden und notfallrelevanten Informationen verfügen. Bis zum 20.10.21 beläuft sich die Vergütung für die Erstanlage auf 17,80 Euro, ab dem 21.10.21 auf 8,90 Euro (Stand: 08/2021). Vergütung für die Aktualisierung eines NotfalldatensatzesDer Zuschlag zu allen Versicherten-, Grund- und Konsiliarpauschalen mit persönlichem Arzt-Patienten-Kontakt je einmal im Behandlungsfall beträgt derzeit 0,44 Euro (Stand: 08/2021).Lösche"
