title = "News-Detail | gematik"
full_description = "17.10.2022 Pressemitteilung | gematik-Reaktion auf CCC-Veröffentlichung zu Konnektoren Die Veröffentlichung des Chaos Computer Clubs (CCC) zum Konnektortausch vom 15.10.2022 ordnen wir wie folgt ein: Die veröffentlichten Ergebnisse sind grundsätzlich nicht neu: Die Möglichkeit der Zertifikatsverlängerung für einen Konnektor hat die gematik ihren Gesellschaftern mehrfach vorgeschlagen. Die Entscheidung für den Konnektortausch haben die Gesellschafter gemeinsam getroffen. Hintergrund ist, dass die Zertifikate in den Konnektoren mit Ablaufdaten versehen sind. Seit September 2022 laufen die 5-jährigen Zertifikate der ersten Konnektoren ab. Zur Gewährleistung eines kontinuierlichen Betriebs der TI wurden verschiedene Optionen in den Gremien der gematik – zuletzt anlässlich der Gesellschafterversammlung am 29.8.2022 – diskutiert. Die gematik hat den Gesellschaftern dazu mehrfach alle Optionen zum Konnektor für den Übergang zur TI 2.0 vorgestellt. In diesem Zusammenhang wurden als Lösungsmöglichkeiten sowohl die Laufzeitverlängerung als auch der Gerätetausch mit den Vor- und Nachteilen beschrieben und zur Entscheidungsfindung dargelegt. Mit dem Beschluss der Gesellschafterversammlung vom 29.8.2022 (https://www.gematik.de/newsroom/news-detail/pressemitteilung-konnektortausch-bleibt-aktuell-beste-loesung) bleibt der Konnektortausch kurzfristig die beste Lösung: Bei allen Zertifikaten, deren Gültigkeit bis August 2023 abläuft, ist danach wegen veralteter Technik ein Austausch des Konnektors die einzig sinnvolle Alternative. Der Hardwaretausch wurde als insgesamt sicherste und wirtschaftlichste Lösung identifiziert. Für Zertifikate, deren Gültigkeit ab August 2023 endet, sollen Alternativen angeboten werden. Die Alternativen zum Konnektortausch sind eine Laufzeitverlängerung der Zertifikate durch ein Firmware-Update des Konnektors bis Ende 2025 oder ein Anschluss an einen Konnektor, der in einem Rechenzentrum betrieben wird. Der GSV-Beschluss ermöglicht damit neue, kostengünstigere Optionen. Das bedeutet auch, dass längst nicht alle Konnektoren getauscht werden müssen und die dadurch entstehenden Kosten deutlich niedriger sind, als berichtet. Voraussetzung hierfür ist ein neues Finanzierungsmodell. Die Gesellschafter haben bei der Versammlung am 29.8.2022 empfohlen, das Finanzierungsmodell für die sichere Anbindung an die Telematikinfrastruktur anzupassen, um neben dem Konnektortausch weitere Varianten bei der TI-Anbindung zu ermöglichen. Hierzu müssen entsprechende gesetzliche Grundlagen geschaffen und die Finanzierung zwischen den Bundesmantelvertrags-Partnern geklärt werden. zurück © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
