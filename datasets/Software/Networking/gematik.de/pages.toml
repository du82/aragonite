["https://gematik.de/anwendungen/epa-fuer-alle/krankenhaeuser"]
title = "Krankenhäuser | gematik"
full_description = "Print-Infopaket Vorteile für Krankenhäuser Downloads für Krankenhäuser Erklärvideos Klickstrecke: Nutzung der ePA im Krankenhaus Statements aus der Praxis FAQ Inhalte für Nutzergruppen Erfahren Sie mehr Inhalte dieser Seite Zum Webshop Start der ePA für alle Kostenlose Infopakete für Praxen, Kliniken und Apotheken Zur Bestellung ePA für alle Krankenhäuser Auf dieser Themenseite finden Sie wichtige Informationen für Krankenhäuser, die mit der ePA für alle arbeiten werden. Dank der ePA für alle sind relevante medizinische Daten Ihrer Patientinnen und Patienten auch einrichtungsübergreifend zugänglich und können somit bereits in der vorstationären Aufnahme und in der Fallbesprechung berücksichtigt werden. Ab Januar werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Jede und jeder Versicherte hat die Möglichkeit, dem zu widersprechen. Auch private Krankenversicherungen dürfen ihren Versicherten eine ePA anbieten, sind dazu aber nicht verpflichtet. Einige Unternehmen stellen bereits eine ePA zur Verfügung, andere arbeiten daran. Wird eine ePA angeboten, entscheiden Privatversicherte selbst, ob sie diese nutzen möchten. Durch die ePA für alle bekommen Sie viele neue Möglichkeiten im Klinikalltag. Auf dieser Seite erfahren Sie, was Sie mit der ePA für alle erwartet und finden vermehrt auch Infomaterialien zum Download. Print-Infopaket ePA-Infopaket: Jetzt kostenlos im Shop bestellen! Gut informiert in Richtung ePA-Start: Plakate, Flyer und Handouts kostenfrei und bequem über unseren Shop bestellen und zur Informationen Ihrer Patientinnen und Patienten nutzen. Zum gematik-Shop Vorteile für KrankenhäuserGesundheitsdaten sind im Versorgungsalltag zugänglichPatientinnen und Patienten müssen mit der ePA für alle nicht mehr jeden Zugriff einzeln freigeben. Denn im Behandlungskontext können Ärztinnen und Ärzte automatisch auf die Daten zugreifen. Das hilft vor allem, wenn die Zeit knapp ist. Voraussetzung ist, dass die Patientin oder der Patient dem Zugriff nicht widersprochen hat. Für privatversicherte Patientinnen erfolgt der Zugriff nur auf Anfrage.Versorgung wird individuellerArztbriefe, Bildbefunde, Laborbefunde und Operationsberichte: All das kann künftig in der ePA gebündelt werden. So liegen Ihnen künftig auch die gesammelten Informationen von ärztlichen Kolleginnen und Kollegen im Behandlungskontext vor – ohne sich auf unsichere Angaben der Patientinnen und Patienten zu verlassen oder bei Praxen Hinterherzutelefonieren. Vorerkrankungen sind in der ePA dokumentiert, aber auch Koexistenzen zwischen Krankheiten lassen sich schneller feststellen.Medikation wird übersichtlichIn der Medikationsliste, die in der ePA integriert ist, werden von Beginn an alle verschriebenen Medikamente einer Patientin bzw. eines Patienten angezeigt. Probleme oder Wechselwirkungen können so schneller erkannt werden. In einem zukünftigen Update wird auf der Medikationsliste aufbauend der Medikationsplan zur ePA hinzugefügt. Beispielsweise können dann die Informationen institutionsübergreifend gepflegt und mit Einnahmehinweisen ergänzt werden.Daten sind geschütztDie ePA für alle funktioniert nach modernen Sicherheitsstandards. Daten werden nur verschlüsselt in die ePA übertragen und sind dort für niemanden erreichbar. Nur Patientinnen und Patienten selbst oder zugriffsberechtigte Heilberuflerinnen und Heilberufler haben die Möglichkeit, Daten aus der ePA für alle abzurufen. Downloads für Krankenhäuser Infomaterialien für Krankenhäuser In unserem Download-Portal finden Sie Infomaterialien, Erklärvideos und Grafiken zum Herunterladen. Zum Download-Portal Erklärvideos Video abspielen Die ePA für alle im Krankenhaus Vorteile und Use-Cases kurz erklärt × Video abspielen Medikationsliste in der ePA für alle Besserer Überblick für das medizinische Personal × Video abspielen Suchfunktion in der ePA für alle So finden Sie relevante Informationen × Klickstrecke: Nutzung der ePA im Krankenhaus Öffnen Nutzung der ePA im Krankenhaus In dieser Klickstrecke sehen Sie beispielhaft, wie die ePA für alle im Krankenhauses eingesetzt werden kann. Folgen Sie den Schritten, um einen Fall für Carolina anzulegen, sie in die stationäre Versorgung aufzunehmen und am Ende einen Entlassbrief für sie zu erstellen. Mit Klick auf Buttons in dieser Anwendung kann eine Datenübertragung an die Figma, Inc. in die USA statt (sog. Drittseite) erfolgen. Wir haben keinen Zugang zu den Cookies oder anderen Funktionen, die von Figma, Inc. eingesetzt werden, noch können wir diese kontrollieren. Diese Drittseite unterliegt nicht den Datenschutzbestimmungen der gematik. Statements aus der Praxis Video abspielen Prof. Dr. Diehl Alfried Krupp Krankenhaus, Essen × Video abspielen Prof. Dr. Spethmann Charité × FAQWie sorge ich vor Ort in meiner Einrichtung dafür, die Daten in der ePA zu schützen?In der KBV IT- Sicherheitsrichtlinie (https://www.kbv.de/html/it-sicherheit.php) werden Vorgaben für die Austattung von Praxen gemacht. Wenn bei der Aufnahme ins Krankenhaus eine Medikationsanordnung über die ePA gemacht wird, gibt es dann eine Verbindung zum Medikationsmodul des KIS? Wird es dort dann auch angezeigt?Über die ePA werden keine Anordnungen im Krankenhaus gemacht. Die ePA wird aller Voraussicht nach für die Anmnese und bei Entlassung eine Rolle spielen.Wie lange nach der Entlassung einer Patientin bzw. eines Patienten kann ein Dokument noch eingestellt werden?Das ist so lange möglich, wie die die Institution Zugriff auf die elektronische Patientenakte hat.Mit welchen Sicherungsmechanismen stellen Praxen und Krankenhäuser sicher, dass Mitarbeitende nicht illegal Daten herunterladen können?Hier gelten die gleichen Sicherungsmechanismen, die auch erforderlich sind, wenn ein Krankenhaus Zugang zu den Patientenakten im Krankenhaus-Informationssystem gewährt. Wenn eine Person in einer Einrichtung auf die ePA zugreifen will, muss sie sich authentisieren. Das funktioniert über die sogenannte Institutionskarte, die SMC-B-Karte. Damit identifiziert sich die Person gegenüber dem ePA-System als Teil einer medizinischen Institution. Im zweiten Schritt prüft die Akte selbst zuerst, ob ein Behandlungskontext für die jeweilige Einrichtung besteht. Dieser gilt ab Stecken eGK vor Ort oder ab Freischaltung des Zugriffsrechts in der ePA-App für standardmäßig 90 Tage. In diesem Zeitraum besteht damit das Zugriffsrecht auf die jeweilige ePA. Der Zeitraum kann in der ePA-App allerdings auch beendet oder verlängert werden.Muss die empfangende oder die sendende Einrichtung dafür sorgen, dass ein Dokument in die ePA eingestellt wird?In der Regel sollte das Einstellen von der Institution übernommen werden, die bspw. den Befund erhoben hat. In der Realität kann das in manchen Konstellationen nicht umsetzbar sein, wenn bspw. die erstellende Institution die Patientin oder den Patienten nie gesehen hat (zum Beispiel bei einem Laborauftrag). Zu diesem Suchbegriff wurde leider kein Eintrag gefunden. Alle FAQ Alle Infos für verschiedene Nutzergruppen auf einen Blick Übersicht Auf unserer Übersichtsseite finden Sie allgemeine Informationen für die medizinischen Nutzergruppen, die mit der ePA für alle ab Januar 2025 arbeiten werden. Praxen Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Praxen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Zahnarztpraxen Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Zahnarztpraxen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Apotheken Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Apotheken, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Pflege Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Plegeeinrichtungen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Reha Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Rehaeinrichtungen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Erfahren Sie mehr Sie haben weitere Fragen? Zum Kontaktformular #c-522 svg path {fill: #fff} .cls-1{fill:#fff;} Gematik_Piktogramme_Information Weiß ePA für alle - Informationen für Versicherte #c-523 svg path {fill: #fff} .cls-1{fill:#fff;} Gematik_Piktogramme_Information Weiß ePA für alle - Informationen der KBV © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
