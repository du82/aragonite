title = "Karriere | gematik"
full_description = 'Was uns wichtig ist Das bieten wir Dir Finde Deinen Job Dein Bewerbungsprozess FAQ Kontakt Inhalte dieser Seite Du wolltest schon immer im Team Zukunft spielen? Deine Möglichkeiten bei der gematik Lena (ePA Product Owner) Offene Stellen Bewirb Dich jetzt! Offene Stellen Neue Wege, neue Maßstäbe, Deine Zukunft Unser Gesundheitswesen zu digitalisieren – das ist unsere große Aufgabe. Unser Ziel ist, die medizinische Versorgung und Forschung zu verbessern. Wir verlieren dabei nie die Menschen aus den Augen, sondern entwickeln zusammen mit den Kolleg:innen unsere digitalen Lösungen. Diese wichtige Aufgabe können wir nur gemeinsam meistern. Gemeinsam mit Dir. Mit Deiner Expertise wollen wir neue Maßstäbe setzen. Wir wollen zusammen neue Wege gehen. Wir wollen zusammen Chancen ergreifen, Neues ausprobieren und uns weiterentwickeln. Du machst den Unterschied – für Dich, für uns, für alle. Komm zu uns und gestalte mit uns das Gesundheitswesen von Morgen. FINDE DEINEN JOB Was uns wichtig istWir sind verbindend in unserer Zusammenarbeit, indem wir mit allen Stakeholdern aktiv in einen offenen und wertschätzenden Dialog gehen.Wir überzeugen unsere Kund:innen, Partner:innen und Kolleg:innen durch wirksame Lösungen und Produkte.Wir suchen innovative Lösungen, entwickeln uns kontinuierlich weiter und treffen mutige Entscheidungen.Wir übernehmen Verantwortung für unser Handeln und treffen klare Vereinbarungen. Das bieten wir Dir Flexibilität Bei der gematik setzen wir auf flexibles Arbeiten. Du hast die Möglichkeit aus dem deutschen Inland mobil zu arbeiten. Daneben bieten wir Dir flexible Arbeitszeitmodelle, damit Dein Job bei der gematik auch in Dein Leben passt. Wir bieten Dir 30 Urlaubstage im Jahr plus Sonderurlaub zum Firmenjubiläum und bezahlte Freistellung bei besonderen Anlässen. Gesundheit Bei uns bist Du immer bestens versorgt. Dazu profitierst Du von Angeboten unserer Betriebsärztin, wie Gesundheits-Workshops, Impfungen und Check-ups. Auch mit mobilen Massagen und unserer Gesunde-Pause-Software denken wir an Dein Wohlbefinden. Zuschüsse Die Arbeit bei uns lohnt sich. Für das mobile Arbeiten bekommst Du eine attraktive Pauschale. Außerdem erhältst Du bei uns Zuschüsse zum BVG-Firmenticket und zur Mitgliedschaft im Fitnessstudio sowie vermögenswirksame Leistungen. Wir bieten Dir attraktive Angebote und individuelle Beratung zur betrieblichen Altersvorsorge. Durch unsere Corporate Benefits kannst Du bei vielen Anbietern Geld sparen. Und wenn Du neue Mitarbeiter:innen überzeugst, winkt Dir eine attraktive Prämie. Entwicklung & Weiterbildung Du willst viel erreichen – wir unterstützen Dich bei Deiner Entwicklung. Durch ein individuelles Schulungsbudget kannst Du Deine Expertise ausbauen. Mit unserem internen Mentoring-Programm wirst Du bei Deiner Entwicklung begleitet und durch "Mitarbeitende schulen Mitarbeitende" kannst Du gemeinsam mit Deinen Kolleg:innen lernen. In unserem gematik eLearning Space kannst Du Dich außerdem schnell und einfach digital weiterbilden. Deine Karriere bei der gematik Wer wir sind? Die gematikerinnen und gematiker. Wen wir suchen? Dich! Ich wollte schon immer mit den neuesten Technologien arbeiten Michele (Software Entwickler) Ich wollte schon immer am Ball bleiben Marcus (IT-Betriebsarchitekt) Ich wollte schon immer gemeinsam mit anderen etwas bewegen Charly (ePA Product Strategy Manager) Ich wollte schon immer meinen Beitrag im Gesundheitswesen leisten Larissa (CHRO) FINDE DEINEN JOB Unser Standort: Aus Berlin für ganz Deutschland Direkt an der Spree liegen unsere Büroräume – mitten im Herzen Berlins. Du läufst nur zwei Minuten bist zum Bahnhof Friedrichsstraße. Dadurch ist die gematik perfekt an den Berliner ÖPNV angebunden. Die Räume der gematik befinden sich in einer attraktiven Gegend mit vielen Restaurants, Bars und Supermärkten. Bei uns wird es also nie langweilig. Dein Bewerbungsprozess 1. Screening Screening Deiner Online-Bewerbung mit Anschreiben, Lebenslauf und Zeugnissen (als PDF-Dateien) nach Eingang über unser Bewerbungsformular. 2. Interview Recruiter Du führst ein Kennenlern-Gespräch mit unserem Recruiting. 3. Interview Fachbereich Du führst ein Gespräch mit unserem Recruiting und ein bis zwei Kolleg:innen aus dem Fachbereich, bei dem Du Dich beworben hast. 4. Case Study / Hospitation (Optional) Optional löst Du eine Case Study und/oder machst eine Hospitation bei uns. 5. Vertragsangebot Wenn Du uns überzeugt hast, bieten wir Dir einen Arbeitsvertrag an. Wenn die vertraglichen Konditionen für Dich stimmen, steht Deiner Zukunft bei uns nichts mehr im Wege. Willkommen an Bord! 6. Willkommen bei der gematik Damit Du Dich gut und schnell zurechtfindest, bekommst Du von uns nicht nur alle wichtigen Informationen, sondern lernst auch an den verschiedenen Stationen Deines Onboardings Deine neuen Kolleg:innen kennen. Dein Team, Deine Führungskraft und die Kolleg:innen aus dem Team „People & Workplace“ begleiten Dich dabei. Statement zur Chancengleichheit Wir können die Zukunft nur gemeinsam gestalten – ganz gleich in welchem Bereich. Wir glauben, dass ein vielfältiges, wertschätzendes, tolerantes und weltoffenes Miteinander die Grundlage ist, damit wir unsere Ziele Hand in Hand umsetzen können. Denn echte Innovationen entstehen nur, wenn wir über den eigenen Horizont hinausschauen und uns offen mit zukunftsfähigen Lösungen beschäftigen. Dazu sind vielfältige Sichtweisen und Erfahrungen der Schlüssel. Diversität ist für uns unverzichtbar, um das Gesundheitssystem von Morgen neu zu denken. Deshalb haben alle Mitarbeiter:innen sowie alle Bewerber:innen bei uns die gleichen Chancen. Wir machen den Unterschied – für uns und für unsere Gesellschaft. FAQ Was ist beim Hochladen meiner Bewerbung zu beachten? Sende uns Deinen Lebenslauf, Zeugnisse und ein Anschreiben ganz unkompliziert über unser Bewerbungsformular. So können wir sicherstellen, dass Deine Bewerbung bei uns eingeht und wir diese schnellst- und bestmöglich bearbeiten können. Wir empfehlen den Upload von PDF-Dateien. Du kannst entweder ein Gesamtdokument Deiner Bewerbung oder einzelne Dokumente hochladen. Die einzelnen Dateien dürfen nicht größer als 15 MB sein. Bitte lade keine Dokumente hoch, die mit einem Passwort- oder Schreibschutz versehen sind. Ist eine Initiativbewerbung möglich? Unsere Stellenbörse ist immer tagesaktuell. Solltest Du dort keine passende Stelle finden, freuen wir uns über Deine Initiativbewerbung. Bitte reiche auch hier Deine vollständigen Bewerbungsunterlagen ein. Wir prüfen potentielle Möglichkeiten bei der gematik GmbH. Zu welchen Einstiegsdaten kann ich bei der gematik beginnen? Wir freuen uns über Deinen Einstieg zum ersten oder fünfzehnten eines Monats. Sind meine Daten bei euch sicher und kann ich mein Profil aus dem gematik Bewerber-Pool wieder löschen? Ja. Deine persönlichen Daten sind bei uns sicher und werden DSGVO-konform gespeichert, verwaltet und geschützt. Deine persönlichen Daten werden mit der gebotenen Diskretion behandelt und nicht zweckentfremdet. Wir verlangen nicht mehr Angaben von Dir als nötig und bewahren diese nur solange auf wie erforderlich. Du kannst Deine Daten jederzeit einsehen oder löschen lassen. Was muss ich bei meinem virtuellen Bewerbungsgespräch beachten? Wir führen die digitalen Bewerbungsgespräche als Videokonferenz über Microsoft Teams. Du erhältst frühzeitig einen Link, mit dem Du Dich in das Gespräch einwählen kannst. Bitte achte auf eine ungestörte Gesprächsatmosphäre und eine angemessene Bildqualität. Es ist sinnvoll vorab einen Technikcheck durchzuführen. Achte bitte auch darauf, dass Du Dich pünktlich in den Termin einwählst. Wir freuen uns auf das Gespräch mit Dir! Was muss ich bei meinem Bewerbungsgespräch vor Ort beachten? Unsere Kolleg:innen am Empfang im 3. Obergeschoss in der Friedrichstraße 136, 10117 Berlin heißen Dich bei uns willkommen. Am Empfang wirst Du von Deinen Gesprächspartner:innen abgeholt. Bitte sei pünktlich zu Deinem Termin. Wir freuen uns, Dich persönlich kennenlernen zu können! Ist mobiles Arbeiten möglich? Mobiles Arbeiten innerhalb Deutschlands ist bei uns möglich. Eine gute Vereinbarkeit von Familie und Beruf ist uns wichtig, daher kannst Du Deine Arbeitszeit auch flexibel gestalten. Wie sind die Arbeitszeiten? Deine Arbeitszufriedenheit steht bei uns im Vordergrund. Als festangestellte:r Mitarbeiter:in kannst Du aus verschiedenen Arbeitszeitmodellen wählen, die für Dich und Deine Situation am besten passen. Als Werkstudent:in teilst Du Deine Zeit im Büro oder beim mobilen Arbeiten flexibel ein. Wie kann ich mich bei der gematik entwickeln? Uns ist Deine Weiterentwicklung wichtig. Neben individuellen Angeboten bieten wir für alle Kolleg:innen unser Mentoring-Programm, „Mitarbeitende schulen Mitarbeitende“, unseren eLearning Space und weitere Formate an, damit wir uns gemeinsam weiterentwickeln können. Gibt es die Möglichkeit meine Bachelor-/Masterarbeit bei der gematik zu schreiben? Gerne stimmen wir mit den Fachbereichen ab, welche Möglichkeiten wir Dir zum Schreiben Deiner Abschlussarbeit bieten können. Uns ist wichtig, eine angemessene Betreuung sicherstellen zu können, damit wir Dich bei Deinem Abschluss bestmöglich unterstützen. Kontakt Du willst noch mehr Infos, wie Du bei der gematik das Gesundheitswesen von Morgen mitgestalten kannst? Kein Problem – melde Dich bei uns! Wenn es um Job, Karriere, Bewerbung und Co. geht, bist Du bei unserem Recruiting-Team bestens aufgehoben. Schreib uns gerne eine E-Mail mit Deinem Anliegen an karriere@gematik.de Wir freuen uns auf Dich! © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA'
