["https://gematik.de/newsroom/news-detail/aktuelles-drittes-ti-capture-the-flag-mission-kimpossible"]
title = "News-Detail | gematik"
full_description = "23.10.2023 Aktuelles | Drittes TI Capture the Flag – Mission (K)IMpossible Das Capture the Flag (ctf) Event der gematik geht in die Dritte Runde. Beim diesjährigen TI_ctf beginnen die Abenteuer von KIM und TIM mit der Mission (K)IMpossible am 17. November. Im Team mit bis zu vier Personen können dabei spannende und herausfordernde Aufgaben gelöst und Flags eingesammelt werden. Aus den Themenbereichen wie etwa Penetrationtesting, Kryptographie, Programmierung, Forensik und OSINT ist für jeden etwas dabei. Als Kulisse dient in diesem Jahr eine virtuelle Stadt, in der plötzlich vertrauliche Faxe mit Patientendaten überall auf Bildschirmen veröffentlicht werden. Als Agent KIM sollen IT-Sicherheit-Begeisterte sowie Cyber-Security-Professionals nun herausfinden, was es mit den Faxen auf sich hat und wie die Daten geschützt werden können. Nach erfolgreicher Registrierung können auf der Challenge-Ebene Teams untereinander kommunizieren und rätseln. Auf der Community-Ebene erwarten auch in diesem Jahr spannende Vorträge aus der Community. Die Anmeldung ist noch bis zum 12. November 2023 möglich. Beginn des CTF ist am 17.11. von 10 bis 18 Uhr. Näheres zum TI_ctf auf: https://ctf.gematik.de/ zurück © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
