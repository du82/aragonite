["https://gematik.de/anwendungen/kim"]
title = "KIM | gematik"
description = """
KIM-Nutzergruppen: Wer kommuniziert mit wem?                                                                                                                                                                                SVG | 134 KB | 03.09.2024"""
full_description = 'Die häufigsten KIM-Anwendungen Erklärfilme Verschlüsselter Übertragungsweg Vorteile Der Unterschied zu herkömmlicher Mail Jetzt KIM einrichten! Datenvolumen KIM-Mails Elektronischer Arztbrief Video: elektronische Ersatzbescheinigung Stimmen aus der Praxis Downloads FAQ Erfahren Sie mehr Inhalte dieser Seite KIM Schnell und sicher kommunizieren Keine Arztbriefe mehr per Post, keine Befunde mehr per Fax: Mit KIM können wichtige Dokumente und Nachrichten sicher und bequem per E-Mail versendet werden. KIM steht für Kommunikation im Medizinwesen und ist der einheitliche Standard für die elektronische Übermittlung medizinischer Dokumente. Als sicherer Kommunikationsdienst bildet KIM die Grundlage zur Datenübermittlung beispielsweise bei der elektronischen Arbeitsunfähigkeitsbescheinigung (eAU) oder für den eArztbrief. Welche Anwendung auf KIM-Basis in welcher Häufigkeit anteilig genutzt werden, zeigt die Infografik. Kommunikation im Medizinwesen (KIM) Wie funktioniert moderne Kommunikation im Medizinwesen? KIM am Fallbeispiel Hausärztin, Facharzt und Krankenhaus Sicherer E-Mail- und Datenaustausch Diejenigen, die eine KIM-Mail versenden oder empfangen, müssen keine besonderen Sicherheitsmaßnahmen beachten. Dafür, dass die Nachricht dennoch sicher transportiert wird, sorgt eine Ende-zu-Ende-Verschlüsselung im Hintergrund. So könnten digitale Anwendungen künftig miteinander funktionieren Wie die Vernetzung zwischen Praxen, Krankenhäusern, Apotheken und Patienten mit TI-Messenger, ePA, E-Rezept, KIM und Co. zukünftig aussehen kann, verdeutlicht unsere interaktive Patientengeschichte zum Thema Herzinsuffizienz. Klicken Sie sich durch Vincents Geschichte und erfahren Sie, wie Anwendungen der Telematikinfrastruktur (TI) künftig in Versorgunsprozesse eingebunden werden könnten. Zur interaktiven Patientengeschichte Welche Vorteile bietet KIM?KIM spart Zeit, Geld und PapierMit KIM ist es einfacher und schneller, Daten von Patientinnen und Patienten weiterzugeben. Wichtige Untersuchungsergebnisse können per E-Mail vom Fach- zum Hausarzt oder direkt an die Klinik geschickt werden. So ist das ganze Behandlungsteam schnell darüber informiert, was Patientinnen und Patienten brauchen. Der Clou: Dank strukturierter Daten, können eArztbriefe automatisch den Patienten zugeordnet werden.KIM ist sicherJede Nachricht über KIM wird automatisch verschlüsselt und signiert. So sind auch sensible Inhalte sicher. Beim Abruf werden die Nachrichten automatisch für die Empfängerinnen und Empfänger entschlüsselt. Diese können sie dann direkt weiterverarbeiten.KIM vermittelt schnell KontakteOb Ärztinnen und Ärzte oder Apothekerinnen und Apotheker: Das bundeseinheitliche Adressbuch von KIM enthält nur geprüfte Adressdaten von Einrichtungen des Gesundheitswesens. Kontaktinfos sind schnell gefunden, der Austausch mit Kolleginnen und Kollegen ist so einfach wie noch nie.KIM ist einfachDas Versenden einer KIM-Nachricht ist so einfach wie das Versenden einer E-Mail. Auch ist dafür keine neue Software nötig: Es funktioniert über das Krankenhausinformationssystem bzw. das Praxisverwaltungssystem oder, falls entsprechend konfiguriert, über ein marktübliches E-Mail-Programm. Was unterscheidet eine KIM-Mail von einer herkömmlichen Mail? Das zeigt unsere Vergleichsübersicht. KIM noch nicht eingerichtet? In wenigen Schritten sind Sie startklar: 1. Wählen Sie einen KIM-Anbieter aus! Was Ihren KIM-Anbieter angeht, haben Sie freie Wahl – zugelassene KIM-Dienst-Anbieter im Vergleich finden Sie in unserem Fachportal. Tipp: Sprechen Sie vorher mit Ihrem Softwareanbieter. 2. Bestellen Sie Ihre E-Mail-Adresse(n)! Entscheiden Sie, wie viele E-Mail-Adressen Sie in Ihrer Praxis benötigen und teilen Sie dies Ihrem KIM-Anbieter mit. Tipp: In der Regel genügt eine KIM-Adresse welche an den Praxisausweis (SMC-B) gebunden ist. 3. Registrieren Sie sich im Verzeichnisdienst! Damit andere (Zahn-)Arztpraxen, Apotheken und Krankenhäuser Sie finden können, ist eine Registrierung im Verzeichnisdienst der Telematikinfrastruktur erforderlich. Dazu wird Ihre KIM-Adresse durch den KIM-Anbieter in das zentrale Adressbuch eintragen, sodass Sie durch andere KIM-Teilnehmer auffindbar sind. Datenvolumen der E-Mails Bitte akzeptieren Sie Video Cookies um dieses YouTube-Video anzuschauen. Einstellungen ändern KIM-Nutzerinnen und -Nutzer können E-Mails mit einer Datengröße von bis zu 500 MB versenden. Mehr dazu im Video. Elektronischer Arztbrief spart Zeit und Geld 2 Minuten statt 2 Tage – der elektronische Arztbrief ist nicht nur sicherer, sondern deutlich schneller beim Empfänger. Arztpraxen und Krankenhäuser sparen Arbeitszeit und Geld. Das Eintüten, Frankieren und Einscannen der Arztbriefe fällt ebenso weg wie das Einholen händischer Unterschriften von den Ärztinnen und Ärzten. Dadurch gewinnen vor allem medizinische Fachangestellte Zeit für fachbezogene Tätigkeiten. Unsere Erklärgrafik zeigt Ihre Vorteile. Video: Einchecken mit der elektronischen Ersatzbescheinigung (eEB) Bitte akzeptieren Sie Video Cookies um dieses YouTube-Video anzuschauen. Einstellungen ändern Versicherte, die ihre Gesundheitskarte (eGK) beim Praxisbesuch nicht dabeihaben, können ihre eEB selbst bei der Krankenkasse anfordern und der Praxis vorlegen. Das funktioniert ganz einfach dank dem Einscannen des QR-Codes der Praxis, den diese z. B. als Ausdruck auf dem Tresen oder auf ihrer Internetseite bereitstellt. QR-Code der Praxis für die Datenübermittlung der Versicherten Nehmen Sie bereits am KIM-Verfahren teil und Ihre Praxissoftware unterstützt die beiden Anwendungen „elektronische Ersatzbescheinigung“ und „Online Check-in“ (sprechen Sie im Zweifel Ihren Praxisverwaltungssoftware-Hersteller an), dann erstellen Sie für die Datenübermittlung seitens der oder des Versicherten aus Ihrer KIM-Adresse den individuellen QR-Code für Ihre Praxis. Stellen Sie diesen dann auf Ihrer Website oder in Ihren Räumen bereit. Die Patientinnen und Patienten können ihn scannen und die Datenübermittlung selbst per App anstoßen, so dass die Krankenversicherung die Daten an die Praxis übermitteln kann. Der "Online Check-in" gilt für Privatversicherte, die das E-Rezept oder die ePA nutzen möchten. Den Code bzw. das pdf zum Ausdrucken können Sie hier generieren. Stimmen und Beispiele aus der Praxis Dr. med. Markus Sagheri Zahnarzt Dr. Jens Beermann Geschäftsführender Gesellschafter CardioGo GmbH Dr. med. Verena Gall Hausärztin Khanh-Tho Duong Arzt für Allgemein- und Rettungsmedizin Dr. med. Dominik Pförringer Facharzt für Orthopädie, Sportmedizin Kommunikation im Medizinwesen (KIM) am Fallbeispiel Hausärztin, Facharzt und Krankenhaus Dr. med. Martin Deile Hausarzt / Notarzt / Anästhesist / Sportmediziner Zusätzliche Informationen KIM-Nutzergruppen: Wer kommuniziert mit wem? SVG | 134 KB | 03.09.2024 Download Interview_KIM_TIM_2024.pdf PDF | 123 KB | 19.04.2024 Download Auf einen Blick: Verzeichnisdienst (VZD) PDF | 725 KB | 03.01.2024 Download Auf einen Blick: Kommunikation im Medizinwesen PDF | 155 KB | 27.04.2023 Download Praxisbeispiel: KIM für Zahnarztpraxen PDF | 677 KB | 06.01.2023 Download Checkliste: Einrichtung KIM für Apotheken PDF | 46 KB | 29.08.2022 Download Checkliste: Einrichtung KIM für Arztpraxen PDF | 48 KB | 08.07.2022 Download Praxisbeispiel: KIM in der Praxis PDF | 735 KB | 08.12.2021 Download Fragen und Antworten Allgemein Technik Brauche ich in jedem Behandlungszimmer ein Kartenterminal zum signieren mit HBA?Sofern Dokumente wie z.B. ein eArztbrief oder eine eArbeitsunfähigkeitsbescheinigung in jedem Behandlungszimmer signiert werden sollen, ist es erforderlich, je ein Kartenterminal für die Eingabe der PIN vorzusehen. Ich möchte meine Organisation in der Third-Level-Domain der KIM-E-Mailadresse aufnehmen lassen. Wie geht das?Der KIM-Anbieter muss dazu im Service-Portal von Arvato Systems einen Request einstellen und die Domain beantragen. Wie viele KIM Adressen brauche ich als Praxis?Grundsätzlich genügt pro Praxis eine Adresse, welche an die SMC-B gekoppelt ist. Man kann aber je nach Bedarf weitere E-Mailadressen einrichten. Zu diesem Suchbegriff wurde leider kein Eintrag gefunden. Alle Fragen und Antworten Erfahren Sie mehr Datensicherheit in der TI #c-33 svg path {fill: #fff} .cls-1{fill:#efec01;} Gematik_Piktogramme_ Unser Fachportal: Checklisten und weitere Informationen #c-34 svg path {fill: #fff} .cls-1{fill:#000e52;} Gematik_Piktogramme_Krankenhaus Blau Informationstechnische Systeme in Krankenhäusern © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA'
