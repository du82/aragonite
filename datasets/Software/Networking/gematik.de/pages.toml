["https://gematik.de/anwendungen/ti-messenger/faq"]
title = "FAQ | gematik"
full_description = "FAQ - TI-Messenger Alle öffnen Warum braucht es den TI-Messenger, wenn es doch schon einige sehr sichere Messenger gibt?Viele dieser Messenger sind primär für die private Nutzung ausgelegt. Auch gibt es inzwischen einige, die explizit für das Gesundheitswesen konzipiert sind. Was dabei aber fehlt, ist die Kommunikation über diese Anbieter hinweg: Mit dem TI-Messenger setzt die gematik deshalb einen neuen Standard für interoperable Kommunikation im Gesundheitswesen.In welchen Fällen nutze ich KIM, in welchen den TI-Messenger?KIM kann für Standard-Kommunikation verwendet werden, etwa um einen eArztbrief oder eine elektronische Arbeitsunfähigkeitsbescheinigung qualifiziert elektronisch signiert zu versenden. Der TI-Messenger dagegen ist für flüchtige Kommunikation gedacht: für den organisatorischen Austausch zwischen Kolleginnen und Kollegen einer Klinik oder für kurze Rückfragen an einen überweisenden Leistungserbringer.Warum wird das Matrix-Protokoll für den TI-Messenger genutzt?Die Entscheidung für das Matrix-Protokoll hat mehrere Gründe: Es handelt sich dabei um einen offenen Standard, der durch eine breite Community stetig weiterentwickelt wird und eine sehr gute Ende-zu-Ende-Verschlüsselung mitbringt. Außerdem bietet sein dezentraler Ansatz insbesondere für die Abbildung von Organisationen viele Vorteile. Ist der TI-Messenger automatisch Teil von KIM oder muss ich ihn extra bestellen?KIM und der TI-Messenger sind zwei getrennt zu betrachtende Anwendungen. Inwiefern der TI-Messenger als Teil des Primärsystems als Leistung angeboten wird, obliegt den Anbietern. Leistungserbringer sind nicht verpflichtet, den TI-Messenger zu nutzen.Können die Versicherten über den TI-Messenger Kontakt mit mir als Arzt oder Ärztin aufnehmen?Versicherte können damit beispielsweise einen Praxis-Account erreichen, der durch Medizinische Fachangestellte betreut werden kann. Ein direkter Kontakt mit den Ärztinnen und Ärzten ist über den TI-Messenger nicht möglich – es sei denn, Sie wünschen dies explizit. Zu diesem Suchbegriff wurde leider kein Eintrag gefunden. © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
