["https://gematik.de/newsroom/news-detail/pressemitteilung-ti-capture-the-flag-2022-mit-dem-epapagei-auf-der-jagd-nach-der-verlorenen-nacht"]
title = "News-Detail | gematik"
full_description = "10.11.2022 Pressemitteilung | TI-Capture the Flag 2022: Mit dem ePApagei auf der Jagd nach der verlorenen Nacht Von Beginn an standen Datensicherheit und Datenschutz bei der Entwicklung der elektronischen Patientenakte (ePA) im Mittelpunkt, schließlich gehören Patientendaten in ein gesichertes System. Eine Reihe neuer Funktionen sind inzwischen für Patientinnen und Patienten, Ärztinnen und Ärzte, sowie weiteres medizinisches Fachpersonal in der ePA verfügbar. Diese neuen Ausbaustufen sind stets gleichbedeutend mit einer Reihe von Stresstests und sicherheitsrelevanten Prüfungen. In diesem Kontext lädt die gematik erneut IT- und IT-Sicherheit-Begeisterte sowie Cyber-Security-Professionals zum zweiten TI Capture The Flag Event ein: Diesmal hilft der ePApagei die Ereignisse der letzten Nacht zu rekonstruieren. Capture the Flag (CTF) mit dem ePApagei am 18. November von 10 bis 18 Uhr „Nachdem wir bereits im vergangenen Jahr erfolgreich ein erstes Capture the Flag Event im Kontext des E-Rezepts durchgeführt haben, freue ich mich umso mehr, dass wir in diesem Jahr erneut eine solche Veranstaltung umsetzen können – diesmal mit der ePA als Mittelpunkt. Der Austausch mit der Fachcommunity ist hier von besonderem Wert für uns. Außerdem bin ich gespannt, welche Erkenntnisse wir aus dem Event ziehen und wie sich die diesjährigen Teilnehmer:innen bei den gestellten Aufgaben schlagen werden“, erklärt Holm Diening, Chief Security Officer (CSO) der gematik GmbH. Zum diesjährigen CTF werden die Teilnehmer:innen in die virtuelle Welt der ePA eintauchen und zunächst auf die Suche nach ihrer analogen Patientenakte – und deren „Flags“ – gehen, um die Geheimnisse der vorherigen Nacht zu entschlüsseln. Erste kryptische Hinweise gibt dazu der ePApagei. Die Erkenntnisse werden schließlich sicher in die elektronische Patientenakte überführt. Auf die Gewinnerinnen und Gewinner warten attraktive Preise. Vom CTF-Anfänger, über Cyber Security-Professionals bis hin zu IT- und IT-Sicherheit-Begeisterten ist jeder willkommen, sich für das Event anzumelden. Zu den Kooperationspartnern des Events gehört IBM. Das weltweit agierende IT-Unternehmen ist Betreiber von ePA-Diensten auf Basis der IBM Gesundheitsplattform mit Anbindung an die Telematikinfrastruktur. Weiterer Partner ist die ehex – eHealth Experts GmbH. Das Unternehmen steht für neue Wege und Lösungen im eHealth-Universum und ist enger Begleiter der Telematikinfrastruktur. Das Capture The Flag Event zur ePA wird außerdem von der Hochschule für Technik und Wirtschaft Berlin (HTW) begleitet. Hier geht es zum Capture The Flag Event: https://ctf.gematik.de zurück © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
