full_description = "Alle Anwendungen Die Zukunft des Gesundheitswesens ist digital Zum Webshop Start der ePA für alle Kostenlose Infopakete für Praxen, Kliniken und Apotheken Zur Bestellung Die Digitalisierung des deutschen Gesundheitswesens wird die Gesundheitsversorgung von über 70 Millionen Menschen optimieren. Digitale Anwendungen werden entscheidend dazu beitragen, dass medizinische Informationen, die für die Behandlung benötigt werden, schneller und lückenloser verfügbar sind. Das wird die Versorgung der gesetzlich und privat versicherten Patientinnen und Patienten in Deutschland verbessern. E-Rezept Der schnelle Weg zum richtigen Medikament Rezepte einfach per App erhalten und verwalten – das E-Rezept macht’s möglich. Weitere Informationen Elektronische Patientenakte (ePA) Persönliche Daten, persönliche Entscheidungen Die elektronische Patientenakte (ePA) bündelt alle Gesundheitsdaten an einem Ort – kostenlos, freiwillig und sicher. Informationen zur ePA für alle Kommunikation im Medizinwesen (KIM) Schnell und sicher kommunizieren Mit KIM können Dokumente und Nachrichten sicher per E-Mail versendet werden. Weitere Informationen Digitale Identitäten im Gesundheitswesen (GesundheitsID) Die GesundheitsID als Alternative zur Gesundheitskarte Mit der digitalen Identität erhalten Versicherte einen kartenlosen Zugang zu allen Anwendungen der Telematikinfrastruktur (TI). Weitere Informationen Notfalldaten Einfach da, wenn es darauf ankommt In Notfällen geht es oft um Sekunden. Wichtige Informationen können Sie nun auf Ihrer Gesundheitskarte hinterlegen lassen. Weitere Informationen TI-Messenger Schnelle Nachrichten in Echtzeit Mit dem TI-Messenger können kurze aber wichtige Nachrichten im Medizinwesen künftig als Textnachrichten versendet werden. Weitere Informationen ISiK Für eine gemeinsame digitale Sprache im Klinikalltag ISiK verbindet alle IT-Systeme, die in Klinken zum Einsatz kommen – für mehr und schnellere Information. Weitere Informationen DEMIS Weil Infektionsschutz schnell sein muss DEMIS hat das Fax in Laboren und Gesundheitsämtern ersetzt. Infektionen können nun digital gemeldet werden. Weitere Informationen © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
