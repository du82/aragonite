full_description = "ePA für alle News & Aktuelles Willkommen auf unserem News-Portal zum Rollout der neuen elektronischen Patientenakte. Hier finden Sie übersichtlich und gebündelt alles Wichtige rund um die Pilotierung in den Modellregionen und alle aktuelle Informationen und Einblicke. Aktuelle Video-Highlights Video abspielen ePA-Pilotierung So funktioniert die Testphase × Video abspielen Erste Eindrücke aus Hamburg gematik-Geschäftsführer Dr. Florian Fuhrmann in der Modellregion × 1 2 2 › 17.01.2025Aktuelles | Pilotphase: Erste Eindrücke aus der Modellregion Hamburg & UmlandNeuer Newsbereich zur ePA für alle weiterlesen16.01.2025Aktuelles | Aktensystemhersteller RISE und IBM zugelassenweiterlesen15.01.2025Aktuelles | ePA für alle startet in drei Modellregionenweiterlesen14.01.2025ePA-Pilotierung: Was Sie wissen müssenweiterlesen14.01.2025ePA-Veranstaltungen: Hier Mitschnitte nachschauenweiterlesen 1 2 2 › Wichtige Informationen ePA-Infopaket Plakate, Erklärvideos und mehr: Mit unserem Infopaket sind Sie gut auf den Start der ePA vorbereitet – und für die wichtigsten Fragen Ihrer Patientinnen und Patienten gewappnet. ePA-Themenseite Auf unserer Themenseite zur ePA für alle finden Sie hilfreiche Informationen, Materialien zum Download und Erfahrungsberichte aus der Praxis – zielgruppengerecht und übersichtlich. ePA-FAQ In unserer umfangreichen FAQ-Liste beantworten unsere Fachexpertinnen und -experten Ihre Fragen rund um die neue ePA – verständlich und aktuell. ePA-Veranstaltungen Gemeinsam mit unseren Partner-Institutionen aus den unterschiedlichen Leistungserbringer-Gruppen veranstalten wir regelmäßig Online-Veranstaltungen. Hier finden Sie alle kommenden Termine. Unsere aktuellen LinkedIn-Posts uc.blockElements({ 'dCQTj1ryb': '.elfsight' }); uc.reloadOnOptIn('dCQTj1ryb'); ePA-Logo ePA_vertikal_blau_gematik_240806.png PNG | 6 KB | 15.10.2024 Download ePA_vertikal_blau_gematik_240806.svg SVG | 3 KB | 25.11.2024 Download Erfahren Sie mehr Sie haben Fragen? Zum Kon