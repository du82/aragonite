full_description = '''Hilfe & Kontakt So erreichen Sie uns Kontaktformular Die gematik freut sich über jeden Hinweis, Anregung oder einfach nur Feedback von Ihnen und möchte diese auch gerne in möglichst kurzer Zeit beantworten. Bitte sehen Sie deshalb davon ab, die gematik per Fax oder auf dem Postweg zu kontaktieren. Verwenden Sie stattdessen unsere Kontaktformulare auf den Webseiten der gematik. Damit helfen Sie nicht nur uns, sondern auch der Umwelt. Wir nehmen gerne Ihre Fragen auf und leiten diese an die entsprechende Stelle bei uns im Haus weiter. Bitte geben Sie bei einer Frage zu einem verwendeten Softwaresystem den entsprechenden Namen an. Informationen zur Verarbeitung personenbezogener Daten entnehmen Sie bitte unserer Datenschutzerklärung Wir benötigen Ihre Zustimmung, um das Capita-Formular zu laden. Wir verwenden einen Service eines Drittanbieters, um das Kontaktformular einzubetten. Dieser Service kann Daten zu Ihren Aktivitäten sammeln. Bitte lesen Sie die Details durch und stimmen Sie der Nutzung des Service zu, um dieses Formular aufzurufen. Einstellungen ändern Leider unterst&uuml;tzt Ihr Browser kein Javascript bzw. keine "Frames"! var service; function getService() { if (typeof UC_UI !== "undefined") { var btn = document.getElementById("uc-bt-5098"); var service = UC_UI.getServicesBaseInfo().find( (service) => service.name === "gematik.capita-europe.com" ); if (service){ if (btn && !service.consent.status){ var el_a = document.getElementById('uc-bt-c-5098'); if (el_a) el.classList.add("show"); } return service; } } return false; } function initService() { var el_b = document.getElementById('uc-bt-c-5098'); if (el_b) el_b.remove(); var iframeId = "uc-if-5098"; function receiveMessage(e) { if ( typeof e.data === "number" && e.currentTarget.length > 0 ) { document.getElementById(iframeId).height = e.data; } return; } window.addEventListener("message", receiveMessage); document.getElementById(iframeId).src = "https://gematik.capita-europe.com/Konta