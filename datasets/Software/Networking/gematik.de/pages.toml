["https://gematik.de/anwendungen/ti-messenger"]
title = "TI-Messenger | gematik"
description = """
Kurzfassung: Abschlussbericht Pilotierung Modellregion                                                                                                                                                                                PDF | 230 KB | 26.11.2024"""
full_description = 'Vorteile Stimme aus der Praxis Einblick Entwicklung Die nächsten Schritte Austausch Beispiel Downloads FAQ Erfahren Sie mehr Inhalte dieser Seite TI-Messenger Schnelle Nachrichten in Echtzeit Über Kurznachrichten ortsunabhängig miteinander kommunizieren – das ermöglicht der TI-Messenger auch für den medizinischen Alltag. So ist eine schnelle und sichere Echtzeit-Kommunikation im Gesundheitswesen möglich. Welche Vorteile bietet der TI-Messenger?Der TI-Messenger ermöglicht schnellen Austausch im MedizinwesenRückfragen zur verordneten Medikation, Infos über vorliegende Laborbefunde oder Rückrufbitten: Mit dem TI-Messenger können kurze aber wichtige Nachrichten im Medizinwesen als Textnachrichten versendet werden. Das spart auf allen Seiten wertvolle Zeit.Der TI-Messenger ist ein Kommunikations-Tool für alleEgal ob Ärztin, Pflegekraft oder Apotheker – über den TI-Messenger können alle Gesundheitsberufe deutschlandweit in Echtzeit miteinander kommunizieren. Der erste Anbieter hat bereits eine Zulassung der gematik für seinen TI-Messenger erhalten. Weitere Unternehmen werden folgen. Alle zertifizierten Anbieter greifen dabei auf ein gemeinsames bundesweites Adressbuch zurück, in dem sich mit wenigen Klicks die gesuchten Kontaktdaten, zum Beispiel von Krankenhäusern, Arztpraxen oder Apotheken finden.Der TI-Messenger ist einfach zu bedienenOb Smartphone oder Desktop-PC: Über den TI-Messenger können Sofortnachrichten mit verschiedenen Endgeräten versendet und empfangen werden. Auch von unterwegs erreichen größere Datenmengen schnell den Empfänger. Institutionen erhalten den Zugang über eine SMC-B-Karte und können den TI-Messenger ihren Beschäftigten zur Verfügung stellen. Selbstständige können sich auch mit ihrem elektronischen Heilberufsausweis für den TI-Messenger registrieren.Mit dem TI-Messenger werden Nachrichten sicher und vertraulich versendetMedizinisch relevante Informationen können mit dem TI-Messenger so schnell und unkompliziert ausgetauscht werden wie bei WhatsApp und Co. Sensible und vertrauliche Daten sind dabei aber sicher: Jede Kommunikation über den TI-Messenger ist mehrfach vor dem Zugriff durch Dritte geschützt.Auch interne Kommunikation wird durch den TI-Messenger einfacherWenn eine Institution für den TI-Messenger registriert ist, können alle Mitarbeitenden an den Kommunikationsdienst angeschlossen werden. So ist es zum Beispiel möglich, alle Beschäftigten per Broadcast-Nachricht zeitgleich zu erreichen oder sich untereinander schnell und unkompliziert auszutauschen. Stimme aus der Praxis „Der TI-Messenger hilft uns in vielen alltäglichen Situationen ohne Verzögerung weiter. Kurze (Rück-)Fragen oder auch Missverständnisse können sofort geklärt werden. Das ist zeitgemäß und effektiv, schneller als ein Anruf und lässt uns Zeit für andere wichtige Dinge." Joe Minners, Teamkoordinator Diakonie St. Pauli Einblick: Die TI-Messenger Timo Frank Produktmanager bei der gematik GmbH Entwicklung Verschiedene Messenger dialogfähig gemacht Ob Rettungswagen, Pflegeheim oder Krankenhaus – so vielfältig wie die Einsatzsorte im Gesundheitswesen sind auch die Anforderungen an einen guten Messenger. Die gematik ermöglicht daher die Entwicklung verschiedener nutzerzentrierter TI-Messenger. Untereinander sind diese aber jederzeit dialogfähig und greifen zudem alle auf ein gemeinsames Adressverzeichnis zu. Diese sogenannte „Interoperabilität“ der TI-Messenger ist ein Meilenstein für die sektorenübergreifende Kommunikation im Gesundheitswesen. Die gematik konnte ihn nur setzen, indem sie die Verwendung des frei nutzbaren Protokolls der Matrix.org Foundation vorsieht. Die Open-Source-Implementierungen des Protokolls sind bereits erprobt, beispielsweise von französischen Behörden, der Bundeswehr oder im Bildungswesen einzelner Bundesländer. Übersicht Zugelassene TI-Messenger-Anbieter und Hersteller Hier finden Sie alle Anbieter/Hersteller von TI-Messenger-Lösungen in alphabetischer Reihenfolge:Akquinet: Mehr InformationenAwesome Technologies: Mehr InformationenFamedly: Mehr InformationenGedisa: Mehr Informationensamedi: Mehr Informationenx-tention: Mehr Informationen Die nächsten SchritteTI-M ProFokus Health Professionals - Für alle Akteure der GesundheitsversorgungEinfache sektorenübergreifende Ad-hoc-Kommunikation zwischen den HeilberufenHeilberufler und Kostenträger können anbieter- und sektorenübergreifend organisationsintern miteinander kommunizieren.Spezifikation: veröffentlichtverfügbar: seit April 2024 (erste Anbieter- und Produktzulassung)TI-M ePAFokus Versicherte - Versicherte im DialogKommunikation zwischen Heilberufen und Versicherten sowie Austausch zwischen Versicherten und KassenVersicherte können über den TI-Messenger in der ePA mit Heilberuflern und Kostenträgern kommuninizieren.Spezifikation: Q2/2024verfügbar: Q3/2025TI-M ConnectFokus MehrwertanwendungenAustausch per Videochat und VideosprechstundenIntegration vom TI-Messenger in Produkte und Plattformen von Drittanbietern. So könnten digitale Anwendungen künftig miteinander funktionieren Wie die Vernetzung zwischen Praxen, Krankenhäusern, Apotheken und Patienten mit TI-Messenger, ePA, E-Rezept, KIM und Co. zukünftig aussehen kann, verdeutlicht unsere interaktive Patientengeschichte zum Thema Herzinsuffizienz. Klicken Sie sich durch Vincents Geschichte und erfahren Sie, wie Anwendungen der Telematikinfrastruktur (TI) künftig in Versorgunsprozesse eingebunden werden könnten. Zur interaktiven Patientengeschichte Austausch: Potenzial der TI-Messenger gematik x DMEA: Panel zu TI-Modellregionen Schnelle Nachrichten in Echtzeit - dafür stehen die TI-Messenger. Doch wie können ihre Potenziale im Gesundheitswesen realisiert werden? Diese Frage haben Expertinnen und Experten der gematik auf der DMEA 2024 diskutiert, gemeinsam mit Nutzerinnen und Nutzern aus der Praxis. Mit dabei waren u. a. Apothekerin Sabine Haul und HNO-Arzt Dr. med. Joachim Draws. (Stand der Informationen: April 2024) Eine Nachricht und alle sind informiert: Fiktives Beispiel Per TI-Messenger lassen sich Informationen schnell, sicher und unkompliziert verschicken. Schließt eine Institution alle Mitarbeitenden an den Dienst an, kann der TI-Messenger – wie das Praxisbeispiel zeigt – die interne Kommunikation enorm verbessern. Sabine Schmidt tritt ihren Nachtdienst an Es ist 22 Uhr, Schichtbeginn für Nachtschwester Sabine Schmidt. Sie erfährt, dass auf ihrer Station heute unter anderen die 70-jährige Hilde Kunz liegt, die nach einer Operation noch zwei Tage zur Beobachtung im Krankenhaus bleiben soll. Die Patientin leidet an einer Demenz, weshalb sie nachts häufig wach ist und dann orientierungslos sein kann. In der Nacht verschwindet eine Patientin Sabine Schmidt prüft in dieser Nacht regelmäßig, ob Hilde Kunz noch schläft. Um 2 Uhr nachts gibt es einen kleinen Notfall in einem anderen Zimmer der Station. Als die Nachtschwester 30 Minuten später wieder in Hilde Kunz‘ Zimmer kommt, ist das Bett der Patientin leer. Sabine Schmidt setzt Suchmeldung ab Sabine Schmidt setzt per TI-Messenger eine kurze Textnachricht an ihre Kolleginnen und Kollegen der anderen Stationen ab. Alle Pflegekräfte, die in dieser Nacht im Krankenhaus arbeiten, erhalten diese direkt auf ihr Smartphone. Kollege bringt Patientin zurück Kurz darauf meldet ein Kollege sich per TI-Messenger bei der Nachtschwester. Hilde Kunz hat sich verlaufen und sitzt im Empfangsbereich seiner Station. Behutsam geht er mit Hilde Kunz ins Gespräch und begleitet sie zurück zu ihrer Station. Eine Nachricht entwarnt alle Nachtschwester Sabine Schmidt ist erleichtert, als sie die Nachricht ihres Kollegen erhält. Sofort informiert sie ihre alarmierten Kolleginnen und Kollegen per TI-Messenger, dass Hilde Kunz gefunden wurde und wohlauf ist. Als die Patientin ein paar Minuten später begleitet von ihrem Kollegen zurück auf die Station kommt, nimmt Sabine Schmidt sie in Empfang und bringt sie zurück in ihr Zimmer. Zusätzliche Informationen Kurzfassung: Abschlussbericht Pilotierung Modellregion PDF | 230 KB | 26.11.2024 Download Broschüre TI-Messenger (Stand April 2024) Broschüre TI-Messenger PDF | 1 MB | 19.06.2024 Download TI_Messenger_Checkliste.pdf PDF | 33 KB | 24.04.2024 Download Interview_KIM_TIM_2024.pdf PDF | 123 KB | 19.04.2024 Download Auf einen Blick: TI-Messenger PDF | 457 KB | 08.12.2021 Download Praxisbeispiel: Kommunikation mit TI-Messenger PDF | 2 MB | 08.12.2021 Download Auf einen Blick: Verzeichnisdienst (VZD) PDF | 725 KB | 03.01.2024 Download Fragen und AntwortenWarum braucht es den TI-Messenger, wenn es doch schon einige sehr sichere Messenger gibt?Viele dieser Messenger sind primär für die private Nutzung ausgelegt. Auch gibt es inzwischen einige, die explizit für das Gesundheitswesen konzipiert sind. Was dabei aber fehlt, ist die Kommunikation über diese Anbieter hinweg: Mit dem TI-Messenger setzt die gematik deshalb einen neuen Standard für interoperable Kommunikation im Gesundheitswesen.In welchen Fällen nutze ich KIM, in welchen den TI-Messenger?KIM kann für Standard-Kommunikation verwendet werden, etwa um einen eArztbrief oder eine elektronische Arbeitsunfähigkeitsbescheinigung qualifiziert elektronisch signiert zu versenden. Der TI-Messenger dagegen ist für flüchtige Kommunikation gedacht: für den organisatorischen Austausch zwischen Kolleginnen und Kollegen einer Klinik oder für kurze Rückfragen an einen überweisenden Leistungserbringer. Zu diesem Suchbegriff wurde leider kein Eintrag gefunden. Alle Fragen und Antworten Erfahren Sie mehr Datensicherheit in der TI #c-23 svg path {fill: #fff} .cls-1{fill:#000e52;} Gematik_Piktogramme_TI-Messenger_Blau Kopie 4 Unser Fachportal: Checklisten und weitere Informationen #c-24 svg path {fill: #fff} .cls-1{fill:#000e52;} Gematik_Piktogramme_Krankenhaus Blau Informationstechnische Systeme in Krankenhäusern © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA'
