["https://gematik.de/ueber-uns/rueckblick"]
title = "Rückblick | gematik"
full_description = "Neue Anwendungen für das digitale Gesundheitswesen Die Digitalisierung verbessert unsere Gesundheitsversorgung. Dafür braucht es digitale Anwendungen, die sowohl Patientinnen und Patienten als auch dem medizinischen Personal praktischen Nutzen bieten. Als nationale Agentur für Digitale Medizin ist es unsere Aufgabe, solche Lösungen zu entwickeln. Auf dem Weg zum Gesundheitswesen von morgen konnten wir dabei wichtige Meilensteine erreichen. KIM Wichtige medizinische Dokumente einfach und sicher verschicken? Vor einigen Jahren war das ohne KIM bloß eine Vision. Doch 2023 nutzen schon vier von fünf Arztpraxen den sicheren E-Mail-Dienst. So konnten wir mit KIM tausende medizinische Einrichtungen in ganz Deutschland miteinander vernetzen. Knapp 17 Millionen eArztbriefe und etwa 170 Millionen elektronische Arbeitsunfähigkeitsbescheinigungen wurden bis heute mit KIM versendet. Auch Beantragungs- und Genehmigungsverfahren für zahnärztliche Leistungen werden nun digital mit KIM auf den Weg gebracht – seit Anfang 2022 ganze acht Millionen Mal. KIM zeigt, welchen Mehrwert die Digitalisierung und die Telematikinfrastruktur für das Gesundheitswesen mit sich bringen können. So viele Einrichtungen nutzen KIM 74% Krankenhäuser 82% Praxen 80% Zahnarztpraxen 22% Apotheken 7% Psychotherapeuten KIM Wichtige medizinische Dokumente einfach und sicher verschicken? Vor einigen Jahren war das ohne KIM bloß eine Vision. Doch 2023 nutzen schon vier von fünf Arztpraxen den sicheren E-Mail-Dienst. So konnten wir mit KIM tausende medizinische Einrichtungen in ganz Deutschland miteinander vernetzen. Knapp 17 Millionen eArztbriefe und etwa 170 Millionen elektronische Arbeitsunfähigkeitsbescheinigungen wurden bis heute mit KIM versendet. Auch Beantragungs- und Genehmigungsverfahren für zahnärztliche Leistungen werden nun digital mit KIM auf den Weg gebracht – seit Anfang 2022 ganze acht Millionen Mal. KIM zeigt, welchen Mehrwert die Digitalisierung und die Telematikinfrastruktur für das Gesundheitswesen mit sich bringen können."
