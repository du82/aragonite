Praxisbeispiel: elektronische Patientenakte und Mutterpass                                                                                                                                                                                PDF | 639 KB | 08.12.2021"""
full_description = "Auf einen Blick Schneller Austausch E-Mutterpass Über die TI kommunizieren Sie sicher Erklärvideo: E-Mutterpass Beispiel Downloads Erfahren Sie mehr Inhalte dieser Seite Hebammen Gut informiert, beste Vor- und Nachsorge Für die fürsorgliche und umfassende Beratung und Betreuung von Schwangeren und frischgebackenen Müttern sind Sie als Hebamme oft die wichtigste Ansprechpartnerin. Gleichzeitig ist Ihre Zusammenarbeit mit Frauenarztpraxen, Geburtshäusern, anderen Hebammen und Krankenhäusern enorm wichtig. Die Telematikinfrastruktur (TI) – die digitale Infrastruktur des deutschen Gesundheitssystems – vereinfacht diesen Austausch: Sie verbindet auf einer sicheren Plattform alle, die sich um das Wohl von Müttern und ihren Säuglingen kümmern. Sie können wichtige medizinische Informationen sicher und unkompliziert austauschen und die gemeinsame Betreuung optimal abstimmen. Sie haben alle Gesundheitsdaten im Blick Die Telematikinfrastruktur optimiert Arbeits- und Organisationprozesse in der ambulanten und stationären Pflege. Die sektorenübergreifende Kommunikation – etwa mit einer Arztpraxis oder der Kranken- oder Pflegekasse – wird einfacher. Es entfallen zeitintensive und fehleranfällige Abstimmungen rund um Verordnungen und Rezepte, die in Papierform zu Ihnen gelangen. Das spart Zeit, Papier und Aufwand. Weitere Informationen: E-Patientenakte Notfalldaten Sie können sich schnell und unkompliziert austauschen Langwierige, komplizierte Abstimmungswege und Nachfragen gehören der Vergangenheit an. Mit dem Kommunikationsdienst KIM können Sie Dokumente schnell und einfach austauschen und Rückfragen mit Leistungserbringern wie Arztpraxen oder Krankenhäusern schnell klären. Weitere Informationen: KIM Der Mutterpass ist auch elektronisch verfügbar Auf Wunsch der Versicherten kann der Mutterpass digital in der elektronischen Patientenakte geführt werden. Damit wird die Dokumentation wichtiger Informationen rund um die Schwangerschaft zentral gebündelt. Untersuchungsergebnisse werden im E-Mutterpass gespeichert. Mit der elektronischen Alternative des Mutterpasses können Daten sofort aufgerufen und gelesen werden. Weitere Informationen: E-Patientenakte Über die TI kommunizieren Sie sicher Die Telematikinfrastruktur setzt auf starken Schutz der Informationssicherheit, damit Sie medizinische Dokumente fälschungs- und rechtssicher austauschen können. Sie erfüllt alle Datenschutzanforderungen, sorgt für eine sichere, verschlüsselte Kommunikation und verhindert, dass Dritte auf sensible Informationen zugreifen können. Ihr Weg in die Telematikinfrastruktur Datensicherheit in der TI Vorteile der elektronischen Patientenakte E-Mutterpass Wichtige Gesundheitspässe immer dabei: Fiktives Beispiel Ob Mutterpass, Impfpass oder Zahn-Bonusheft – ab 2022 können Patientinnen und Patienten diese Unterlagen digital in ihre elektronische Patientenakte aufnehmen. Welche Vorteile das für Schwangere bringt, zeigt das Beispiel von Anna Rudolf. Anna Rudolf erwartet ihr erstes Kind Anna Rudolf ist schwanger. Es ist ihre erste Schwangerschaft und sie hat sich freiwillig für den E-Mutterpass in ihrer elektronischen Patientenakte entschieden. So kann sie den Mutterpass nicht mehr vergessen oder verlieren. Alle Daten rund um ihre Schwangerschaft sind in der ePA-App sicher gespeichert. Ein Schwangerschaftsdiabetes wird diagnostiziert In der 26. Schwangerschaftswoche stellt ihre Gynäkologin Dr. Schmidt bei Anna Rudolf einen leichten Schwangerschaftsdiabetes fest und überweist sie zum Diabetologen. Anna Rudolf schaltet in der ePA den E-Mutterpass für den Diabetologen Dr. Müller frei. So kann dieser alle wichtigen Informationen einsehen und die Schwangere zielgerichtet und individuell behandeln. Die werdende Mutter muss ihre Ernährung umstellen Anna Rudolf erhält von Dr. Müller einen Behandlungs- und Ernährungsplan, den er in die ePA einstellt. So weiß auch Dr. Schmidt genau Bescheid. Diese Informationen sind auch für ihre betreuende Hebamme Luise Grams wichtig. Da sie noch nicht an die Telematikinfrastruktur angeschlossen ist, lädt Anna Rudolf ihr die Daten aus dem Mutterpass herunter und zeigt sie ihr. Gut vorbereitet für die Geburt Anna Rudolf ist jetzt in der 40. Schwangerschaftswoche. Ihr Schwangerschaftsdiabetes ist gut behandelt worden. Anna Rudolf weiß auch, dass ihr Kind aufgrund ihres Schwangerschaftsdiabetes etwas schwerer sein kann als andere Babys und dass seltene Komplikationen bei der Geburt auftreten können. Die Geburtsklinik ist dank der lückenlosen Dokumentation des Schwangerschaftsverlaufes darauf eingestellt. Glückliche Mutter Anna Rudolfs Kind ist gesund zur Welt gekommen. Anna Rudolf ist glücklich und beruhigt, denn sie wünscht sich mehrere Kinder. Sie weiß um das erhöhte Risiko, erneut einen Schwangerschaftsdiabetes zu entwickeln. Mit dem elektronischen Mutterpass in der ePA sind die Daten langfristig und sicher gespeichert und ihre Gynäkologin Dr. Schmidt kann bei einer erneuten Schwangerschaft frühzeitig reagieren Downloads: Zusätzliche Informationen Praxisbeispiel: elektronische Patientenakte und Mutterpass PDF | 639 KB | 08.12.2021 Download Checkliste Hebammen zum Anschluss an die TI PDF | 85 KB | 06.07.2022 Download Erfahren Sie mehr Die elektronische Gesundheitskarte #c-157 svg path {fill: #fff} .cls-1{fill:#000e52;} Gematik_Piktogramme_elektronisches Rezept Blau E-Rezept: Der schnelle Weg zum richtigen Medikament #c-160 svg path {fill: #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_ KIM: Schnell und sicher kommunizieren #c-162 svg path {fill: #010e52} Notfalldatenmanagement Created with Sketch. eGK Notfalldaten: Einfach da, wenn es darauf ankommt #c-163 svg path {fill: #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_Patientenakte 2 Blau E-Patientenakte: Persönliche Daten, persönliche Entscheidungen © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
