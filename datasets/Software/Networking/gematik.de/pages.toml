["https://gematik.de/anwendungen/epa-fuer-alle/apotheken"]
title = "Apotheken | gematik"
full_description = "Print-Infopaket Vorteile für Aptheken Downloads für Apotheken Erklärvideos Klickstrecke: Medikationsprozess Statement aus der Praxis Infoveranstaltung Mitschnitte unserer Veranstaltungen FAQ Inhalte für Nutzergruppen Erfahren Sie mehr Inhalte dieser Seite Zum Webshop Start der ePA für alle Kostenlose Infopakete für Praxen, Kliniken und Apotheken Zur Bestellung ePA für alle Apotheken Auf dieser Themenseite finden Sie wichtige Informationen für Apotheken, die mit der ePA für alle arbeiten werden. Besserer Überblick für Sie und ein besserer Service für Ihre Kundinnen und Kunden: Ab Januar werden die gesetzlichen Krankenkassen die neue elektronische Patientenakte für ihre Versicherten anlegen. Auch private Krankenversicherungen dürfen ihren Versicherten eine ePA anbieten. Jede und jeder Versicherte hat die Möglichkeit dem zu widersprechen. Durch die ePA für alle bekommen Sie viele neue Möglichkeiten im Apothekenalltag. Auf dieser Seite erfahren Sie, was Sie mit der ePA für alle erwartet und finden vermehrt auch Infomaterialien zum Download. Print-Infopaket ePA-Infopaket: Jetzt kostenlos im Shop bestellen! Gut informiert in Richtung ePA-Start: Plakate, Flyer und Handouts kostenfrei und bequem über unseren Shop bestellen und zur Informationen Ihrer Patientinnen und Patienten nutzen. Zum gematik-Shop Vorteile für ApthekenRelevante Daten sind einfacher zugänglichPatientinnen und Patienten müssen mit der ePA für alle nicht mehr jeden Zugriff einzeln freigeben. Denn im Behandlungskontext können Sie in der Apotheke automatisch auf die Daten zugreifen. Voraussetzung ist, dass die Kundin oder der Kunde dem Zugriff nicht widersprochen hat. Für privatversicherte Patientinnen erfolgt der Zugriff nur auf Anfrage.Medikationsliste zur InformationIn der Medikationsliste, die in der ePA integriert ist, werden alle verschriebenen Medikamente einer Patientin bzw. eines Patienten angezeigt. In der Medikationsliste werden ausgestellte und eingelöste E-Rezepte automatisch übertragen. Bei diesen müssen Sie also nicht selbst aktiv werden.Mehr Sicherheit und bessere BeratungDurch die Medikationsliste können Probleme oder Wechselwirkungen schneller erkannt werden. In einem zukünftigen Update wird auf der Medikationsliste aufbauend der Medikationsplan zur ePA hinzugefügt. Beispielsweise können dann die Informationen institutionsübergreifend gepflegt und mit Einnahmehinweisen ergänzt werden. So können Sie Ihre Kundinnen und Kunden noch umfassender beraten.Daten sind geschütztDie ePA für alle funktioniert nach modernen Sicherheitsstandards. Daten werden nur verschlüsselt in die ePA übertragen und sind dort für niemanden erreichbar. Nur Patientinnen und Patienten selbst oder zugriffsberechtigte Heilberuflerinnen und Heilberufler haben die Möglichkeit, Daten aus der ePA für alle abzurufen. Downloads für Apotheken Infomaterialien für Apotheken In unserem Download-Portal finden Sie Infomaterialien, Erklärvideos und Grafiken zum Herunterladen. Zum Download-Portal Erklärvideos Video abspielen Die ePA für alle im Überblick So funktioniert die neue elektronische Patientenakte × Video abspielen Medikationsliste in der ePA für alle Besserer Überblick für das medizinische Personal × Video abspielen Suchfunktion in der ePA für alle So finden Sie relevante Informationen × Video abspielen Die ePA für alle im AVS So könnte die neue ePA technisch umgesetzt werden × Klickstrecke: Medikationsprozess in der ePA Öffnen Medikationsprozess in der ePA In dieser Klickstrecke sehen Sie beispielhaft, wie der digital gestützte Medikationsprozess umgesetzt werden kann. Die Einsichtnahme der elektronischen Medikationsliste in zwei Praxisverwaltungssystemen, in einem Apothekenverwaltungssystem und in einer fiktiven ePA-App werden am Beispiel eines Patienten illustriert. Mit Klick auf Buttons in dieser Anwendung kann eine Datenübertragung an die Figma, Inc. in die USA statt (sog. Drittseite) erfolgen. Wir haben keinen Zugang zu den Cookies oder anderen Funktionen, die von Figma, Inc. eingesetzt werden, noch können wir diese kontrollieren. Diese Drittseite unterliegt nicht den Datenschutzbestimmungen der gematik. Dr. pharm. Benedikt Bühler über die ePA für alle Infoveranstaltung gematik digital: Die ePA für alle in Apotheken Bitte akzeptieren Sie YouTube-Cookies um dieses Video anzuschauen. Einstellungen ändern In unserem Format „gematik digital“ informiert die gematik gemeinsam mit dem Deutschen Apothekerverband (DAV) zur elektronischen Patientenakte (ePA) für alle (27.11.2024). Weitere Veranstaltungen Mitschnitte unserer Veranstaltungen Wie genau funktioniert die ePA für alle in Apotheken? Welche konkreten Veränderungen und Anforderungen kommen auf Apotheken zu und wie können Sie sich darauf vorbereiten? Fragen wie diese klären wir im Rahmen unserer digitalen Infoveranstaltungen zur Einführung der ePA für alle. Die Aufzeichnungen der Veranstaltungen inkl. der Aufzeichnungen von Breakout-Sessions zur Demonstration der ePA-Integration in den AVS-Systemen einzelner Hersteller finden Sie hier: Mitschnitte Apotheken FAQBekommen Apotheken auf die gesamte ePA Zugriff oder nur auf die Medikationsliste (bzw. später auch den Medikationsplan)?Apothekerinnen und Apotheker können während des Zugriffs zu Versorgungszwecken auf einen Großteil der ePA Daten zugreifen. Unterbunden sind die Einsicht von bspw. Zahnbonusheft oder auch eAU Daten – wenn keine Widersprüche vorliegen oder Dokumente verborgen wurden. Können Patientinnen und Patienten einstellen, welche Apotheken in die ePA schauen dürfen?Patientinnen und Patienten haben die Möglichkeit, Institutionen für einen ePA-Zugriff zu sperren. Dies ist über die ePA-App oder über die Ombudsstelle der entsprechenden Krankenkasse möglich.Können Patientinnen und Patienten widersprechen, dass Apotheken die gesamte ePA einsehen können?Die Voraussetzung für einen Zugriff auf die ePA durch eine Apotheke, ist dass der Versicherte in der Apotheke seine eGK gesteckt hat oder eine Berechtigung per ePA App vergeben hat. Ansonsten kann ein Widerspruch immer nur für einzelne Institutionen abgegeben werden. Ein grundsätzlicher Widerspruch zum ePA-Zugriff für einen bestimmten Sektor, also wie hier im Beispiel Apotheken generell, ist derzeit nicht vorgesehen.Was passiert mit nicht eingelösten E-Rezepten in der eMedikationsliste?Die Verordnungsdaten werden in der eML angezeigt. Es ist erkenntlich, dass das Rezept nicht eingelöst wurde.Wird es auch einen AMTS-Check in der ePA geben?Die ePA bildet die Datengrundlage, die für einen AMTS-Check genutzt werden kann. Der Check selbst kann dann bei entsprechender Verfügbarkeit eines AMTS-Moduls im Primärsystem durchgeführt werden. Zu diesem Suchbegriff wurde leider kein Eintrag gefunden. Alle FAQ Alle Infos für verschiedene Nutzergruppen auf einen Blick Übersicht Auf unserer Übersichtsseite finden Sie allgemeine Informationen für die medizinischen Nutzergruppen, die mit der ePA für alle ab Januar 2025 arbeiten werden. Praxen Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Praxen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Krankenhäuser Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Krankenhäuser, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Zahnarztpraxen Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Zahnarztpraxen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Pflege Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Plegeeinrichtungen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Reha Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Rehaeinrichtungen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Erfahren Sie mehr Sie haben weitere Fragen? Zum Kontaktformular #c-522 svg path {fill: #fff} .cls-1{fill:#fff;} Gematik_Piktogramme_Information Weiß ePA für alle - Informationen für Versicherte #c-523 svg path {fill: #fff} .cls-1{fill:#fff;} Gematik_Piktogramme_Information Weiß ePA für alle - Informationen der KBV © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
