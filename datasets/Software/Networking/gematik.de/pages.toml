full_description = "17.01.2025 Aktuelles | Pilotphase: Erste Eindrücke aus der Modellregion Hamburg & Umland gematik-Geschäftsführer Dr. Florian Fuhrmann in der Modellregion Hamburg Wie bereiten sich teilnehmende Einrichtungen in der Modellregion Hamburg & Umland konkret auf die ePA für alle vor? gematik-Geschäftsführer Dr. Florian Fuhrmann war gestern (16.1.) in Hamburg und hat die Praxis von Helmut M. K. Weiberlenn besucht. In unserem Video (s. u.) erklärt Dr. Florian Fuhrmann, wie die Pilotphase in den Modellregionen abläuft und gibt einen Einblick in die Zusammenarbeit zwischen teilnehmenden Einrichtungen, Projektteams und Herstellern vor Ort. Regelmäßige Status-Updates der gematik-Geschäftsführung und Einblicke bietet ab sofort der neue Newsbereich zur ePA für alle. Auf der Seite können sich Interessierte zu den aktuellen Entwicklungen während der Pilotphase und häufig gestellten Fragen informieren sowie Aufzeichnungen zu verschiedenen Veranstaltungen rund um die neue ePA anschauen. Ein Erklärvideo beschreibt die Pilotphase in den Modellregionen, allgemeine Infomaterialien zur neuen ePA werden ebenfalls zur Verfügung stehen. Die Seite wird fortlaufend ausgebaut und aktualisiert: https://www.gematik.de/epafueralle/news zurück © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
