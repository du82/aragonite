["https://gematik.de/newsroom/news-detail/epa-fuer-alle-startet-in-drei-modellregionen"]
title = "News-Detail | gematik"
full_description = "15.01.2025 Aktuelles | ePA für alle startet in drei Modellregionen Die neue elektronische Patientenakte (ePA) wird ab heute schrittweise eingeführt. Den Anfang machen die Modellregionen Hamburg & Umland, Franken und NRW. Hier testen knapp 300 Zahnarztpraxen, Praxen, Apotheken und Krankenhäuser die neue digitale Anwendung und sammeln Erfahrungen mit der Nutzung. „Die Zukunft der Versorgung beginnt mit gemeinsamen Daten und digitalen Prozessen, sie beginnt mit der ePA für alle, sie beginnt heute! Die Einführung der neuen ePA ist ein digitales Gemeinschaftsprojekt, an dem wir zusammen mit vielen Partnern Hand in Hand arbeiten. Wir danken allen Beteiligten für das große Engagement bei der Umsetzung. Jetzt geht es darum, intensiv zu testen, um damit den Weg für die bundesweite Nutzung zu ebnen“, erklärt Dr. Florian Fuhrmann im Namen der gematik-Geschäftsführung. In der Pilotphase werden die technische Stabilität des Gesamtsystems geprüft und einzelne Funktionen der ePA getestet. Dazu gehören bspw. der Upload und Download von Dokumenten sowie der Zugriff auf die Medikationsliste. Die Einrichtungen in den Modellregionen werden dazu von ihrem jeweiligen Software-Anbieter technisch ausgestattet. Die gesetzlich Versicherten erhalten nach und nach von ihrer Krankenkasse die elektronische Patientenakte – zunächst in den Modellregionen, dann bundesweit. Dies gilt, sofern die Versicherten der ePA bei ihrer Krankenkasse nicht widersprochen haben. Nach erfolgreich abgeschlossener Pilotierung startet die neue ePA in ganz Deutschland. Voraussetzungen dafür sind, dass die Software-Lösungen technisch funktionieren und durch Benutzerfreundlichkeit überzeugen. Ein besonderer Fokus liegt auf der Sicherheit der Daten. Die ePA basiert auf den höchsten und modernsten Sicherheitsstandards, die zusammen mit den obersten Sicherheits- und Datenschutzbehörden entwickelt und abgestimmt werden. Medizinische Einrichtungen außerhalb der Modellregionen sollten sich bereits jetzt mit der neuen ePA vertraut machen. Dies umfasst z. B. das Update ihrer Software, sobald dieses verfügbar ist, und auch entsprechende Schulungen ihres Teams. Die gematik hat gemeinsam mit Gesellschaftern und Verbänden Informationsveranstaltungen angeboten, deren Aufzeichnungen auch online zur Verfügung stehen. Außerdem können Infopakete für Arztpraxen, Zahnarztpraxen, Apotheken und Krankenhäuser bestellt bzw. Flyer und Videos z. B. für den Wartebereich heruntergeladen werden. Die Infopakete enthalten Materialien für die Teams der Einrichtungen und auch Patient:innen-Informationen: https://www.gematik.de/anwendungen/epa/epa-fuer-alle zurück © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
