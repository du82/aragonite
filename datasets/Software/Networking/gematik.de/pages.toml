["https://gematik.de/newsroom/news-detail/den-ti-erx-eingefangen"]
title = "News-Detail | gematik"
full_description = "14.12.2021 Aktuelles | Den TI-eRX eingefangen Neue Wege gehen im Austausch mit der Fachcommunity: Dafür steht das 1. TI Capture The Flag (CTF) Event der gematik. Anlässlich des Starts des E-Rezepts – einem Meilenstein in der digitalen Gesundheitsversorgung in Deutschland – hatte die gematik IT- und IT-Sicherheit-Begeisterte sowie Cyber Security-Professionals eingeladen, um in einer virtuellen Welt IT-Sicherheitsaufgaben im Kontext des E-Rezeptes zu lösen. 139 Teilnehmende sind der Einladung gefolgt. „Was für ein gelungener Auftakt! Insgesamt 50 Teams haben wirklich das Beste gegeben, um in kürzester Zeit die versteckten Flags zu finden. Wir sind beeindruckt von der positiven Resonanz auf die Veranstaltung und dem Einsatz, den die Teams an den Tag gelegt haben“, zieht Holm Diening, Chief Security Officer der gematik, Bilanz. „Das Event hat nicht nur jede Menge Spaß gemacht, sondern auch gezeigt, dass es ein großes Interesse der Fachcommunity an unseren Anwendungen gibt. Das bestärkt uns in unserem Vorhaben, ein solches Event regelmäßig anzubieten.“ Auch für IBM Deutschland und RISE Deutschland, die Partner der gematik für das E-Rezept, war das Event ein voller Erfolg: „Wir arbeiten beim E-Rezept eng und vertrauensvoll mit der gematik zusammen. Dabei liegt ein Schwerpunkt darauf, die Anwendungslandschaft des E-Rezepts auf „Herz und Nieren“ zu prüfen. Der Capture The Flag Wettbewerb hat durch die Simulation von verwundbaren, an das E-Rezept angelehnte Anwendungen den Kern unserer Arbeit gezeigt“, so Ronald Fritz, Senior Partner IBM Consulting. „Die Einführung des E-Rezepts zählt zu den derzeit größten IT-Projekten Europas. In diesem spannenden Kontext mit Projektpartnern und Kunden das CTF-Event zu veranstalten, so in den direkten Austausch mit der sehr aktiven Community zu treten, ist nicht nur extrem wertvoll für die „Härtung“ des Systems, so ein Vorgehen ist wohl in Zukunft Vorbild und Standard bei großen Projekten für ein digital selbstbestimmtes Europa“, betont Christian Schanes, Vorstand für IT-Security der Research Industrial Systems Engineering (RISE) Forschungs-, Entwicklungs- und Großprojektberatung GmbH. Wissenschaftlich begleitet wurde das Event außerdem von der Hochschule für Technik und Wirtschaft Berlin (HTW). Prof. Dr. Ulrich Meissen vom Lernlabor Cybersicherheit an der HTW Berlin: „Wir freuen uns, dass wir mit der Konzeptionierung des Vorgehensmodells und der Evaluation der daraus resultierenden Ergebnisse bei der Durchführung des CTF-Events unterstützen und so einen Beitrag für eine erfolgreiche Veranstaltung leisten konnten.“ Mehr Informationen zum E-Rezept und der E-Rezept-App: https://www.das-e-rezept-fuer-deutschland.de zurück © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
