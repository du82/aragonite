title = "eGK | gematik"
description = """
So funktioniert die eGK                                                                                                                                                                                PDF | 118 KB | 24.03.2022"""
full_description = "Behandlung mit eGK, eEB & Online Check-in elektronische Ersatzbescheinigung Video: elektronische Ersatzbescheinigung Zusätzliche Informationen Inhalte dieser Seite Aktuelle Probleme und Störungen TI-Status WhatsApp-Kanal der gematik Aktuelle Probleme und Störungen Die elektronische Gesundheitskarte Digitaler Türöffner für Versicherte Wer in Deutschland bei einer gesetzlichen Krankenkasse versichert ist, hat eine elektronische Gesundheitskarte (eGK). Sie zeigt, dass Patientinnen und Patienten versichert sind, wenn sie medizinische Leistungen von Ärztinnen und Ärzten, im Krankenhaus oder von Apotheken in Anspruch nehmen möchten. Die neue Generation der eGK kann aber noch viel mehr. Sie ist Ihr Schlüssel zu digitalen Anwendungen im deutschen Gesundheitssystem. Und damit der Zugang zu bestmöglicher medizinischer Versorgung. Digital zur besten medizinischen Versorgung Die neuen elektronischen Gesundheitskarten sind mit NFC-Technologie ausgestattet. Diese Technologie ermöglicht den kontaktlosen Austausch von Daten. So können Sie mit Ihrer elektronischen Gesundheitskarte und Ihrem Smartphone oder Tablet künftig wichtige digitale Anwendungen wie die elektronische Patientenakte (ePA) oder das elektronische Rezept (E-Rezept) in vollem Umfang nutzen. Mit wenigen Klicks zum Medikament: das E-Rezept Ein Rezept vom Hausarzt per App auf dem Smartphone in der Apotheke einlösen, Medikamente bestellen und nach Hause liefern lassen? Mit Ihrer elektronischen Gesundheitskarte und der E-Rezept-App der gematik auf Ihrem Smartphone oder Tablet können Sie E-Rezepte erhalten, Medikamente in Apotheken vorbestellen oder liefern lassen. Auch Folgerezepte kann die Arztpraxis in die E-Rezept-App speichern. Für ein neues Rezept müssen Sie also nicht erst einen Termin vereinbaren. Weitere Informationen Medizinische Daten selbst verwalten: die elektronische Patientenakte In der elektronischen Patientenakte (ePA) sind alle wichtigen Gesundheitsdaten gespeichert. Mit Ihrer elektronischen Gesundheitskarte und der zugehörigen Patienten-PIN können Sie gespeicherte Daten verwalten, löschen oder in der Arztpraxis aktualisieren lassen. Welche Daten gespeichert sind, welche Praxis, Apotheke oder welches Krankenhaus wie lange darauf zugreifen darf, das entscheiden Sie selbst. Weitere Informationen Mehr Zeit für das Wesentliche: Ihre Behandlung Mit der ePA haben Ärztinnen und Ärzte schnell und effizient einen Überblick über Ihre Krankengeschichte. Arztbriefe, Diagnosen und Dokumente von Voruntersuchungen liegen ihnen direkt vor. So bleibt mehr Zeit für das Wesentliche: Ihre Behandlung. Weitere Informationen Notfalldaten retten Leben Sind Patienten im Notfall nicht mehr ansprechbar, können wertvolle Informationen verloren gehen – etwa, dass sie dauerhaft wichtige Medikamente einnehmen oder notfallrelevante Allergien haben. Diese Informationen, eine Kontaktperson für den Notfall und ein elektronischer Medikationsplan können auf Ihren Wunsch hin auf dem Chip Ihrer eGK gespeichert werden. Weitere Informationen Ihre Daten sind optimal geschützt und sicher Einsicht in Ihre Daten hat nur medizinisches Personal und nur dann, wenn Sie mit der Freigabe Ihrer Patienten-PIN zugestimmt haben. Weitere Informationen So erhalten Sie Ihre neue kontaktlose Gesundheitskarte Die gesetzlichen Krankenkassen stellen die Versichertenkarten automatisch aus. Falls Sie noch keine neue kontaktlose Gesundheitskarte erhalten haben, können Sie Karte und Patienten-PIN jetzt bei Ihrer Krankenkasse beantragen. Eine neue eGK erkennen Sie an der 6-stelligen Kartenzugangsnummer und dem Symbol für drahtlose Übertragung. Abgleich der Versichertendaten Begeben sich gesetzlich Versicherte in medizinische Behandlung, benötigt die Praxis oder andere medizinische Einrichtung deren Daten über die Versicherung und zur Person. Das erfolgt mittels des Versichertenstammdaten-Managements (VSDM) beim Einlesen der eGK im Kartenlesegerät in der Praxis beim erstmaligen Besuch in einem neuen Quartal. So kann die Behandlung in der gesetzlichen Krankenversicherung abgerechnet werden. Gesetzlich Versicherte können dann auch Anwendungen wie die elektronische Patientenakte oder das E-Rezept nutzen. Über die Telematikinfrastruktur (TI) erfolgt beim VSDM ein automatischer Abgleich mit den bei der Krankenversicherung hinterlegten Stammdaten der bzw. des Versicherten. Hat sich an den Daten, etwa durch einen Umzug oder Krankenkassenwechsel, etwas geändert, werden sie automatisch auf der eGK online angepasst und können so auch aktualisiert direkt ins Primärsystem der medizinischen Einrichtung übernommen werden. So sind die Versichertendaten in der behandelnden Einrichtung immer auf dem neuesten Stand. Elektronische Ersatzbescheinigung (eEB) kann als Versicherungsnachweis genutzt werden Wenn die Gesundheitskarte beim Praxisbesuch nicht eingelesen werden kann, können die Versicherten ihre Versichertendaten an die Praxis mit der elektronischen Ersatzbescheinigung (eEB) übermitteln lassen. Die Anwendung ist derzeit noch freiwillig. Ab Juli 2025 wird sie verpflichtend für Arztpraxen und Krankenkassen. Mehr dazu bei der Kassenärztlichen Bundesvereinigung (externer Link). Video: Einchecken mit der elektronischen Ersatzbescheinigung (eEB) Bitte akzeptieren Sie Video Cookies um dieses YouTube-Video anzuschauen. Einstellungen ändern Versicherte, die ihre Gesundheitskarte (eGK) beim Praxisbesuch nicht dabeihaben, können ihre eEB selbst bei der Krankenkasse anfordern und der Praxis vorlegen. Das funktioniert ganz einfach dank dem Einscannen des QR-Codes der Praxis, den diese z. B. als Ausdruck auf dem Tresen oder auf ihrer Internetseite bereitstellt. Zusätzliche Informationen So funktioniert die eGK PDF | 118 KB | 24.03.2022 Download © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
