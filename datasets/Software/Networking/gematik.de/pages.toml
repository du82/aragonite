["https://gematik.de/apotheken"]
title = "Apotheken | gematik"
description = """
Kurz erklärt: KIM für Apotheken                                                                                                                                                                                PDF | 623 KB | 19.09.2023"""
full_description = "Apotheken Zum Webshop Start der ePA für alle Kostenlose Infopakete für Praxen, Kliniken und Apotheken Zur Bestellung Apotheken spielen eine wichtige Rolle für die gesundheitliche Versorgung. Und sie verwalten sensible Gesundheitsdaten ihrer Patientinnen und Patienten. Die Digitalisierung ermöglicht es, medizinische Informationen mit Arztpraxen, Krankenhäusern und anderen Einrichtungen des Gesundheitssystems schnell und zuverlässig auszutauschen. Als Apothekerin oder Apotheker sind Sie oft die erste Anlaufstelle, wenn Menschen gesundheitliche Beschwerden haben. Die Telematikinfrastruktur schenkt Ihnen wertvolle Zeit für die Beratung Ihrer Patientinnen und Patienten. Sie erleichtert die Kommunikation mit Arztpraxen, Krankenhäusern und anderen Einrichtungen des Gesundheitswesens. Gesundheitsdaten, die für die medizinische Versorgung nötig sind, sind einfacher, lückenloser und schneller verfügbar – sofern Ihre Patientinnen und Patienten diese Daten freigeben. Sicherer E-Mail- und Datenaustausch Weniger Bürokratie, mehr Zeit für die Beratung So funktioniert KIM in Apotheken Sichere Kommunikation über die TI Die Telematikinfrastruktur setzt auf starke Mechanismen der Informationssicherheit. Die sichere, verschlüsselte Kommunikation sowie der Schutz vor dem Zugriff auf sensible Informationen sind das Fundament aller Anwendungen der TI. Ihr Weg in die Telematikinfrastruktur Weitere Infos zur Datensicherheit Sie gewinnen mehr Zeit für Beratung Mit dem E-Rezept gehören manuelle Eingaben und fehlerhafte oder schwer lesbare Papierrezepte der Vergangenheit an. Das E-Rezept und die E-Rezept-App sorgen für einen digitalen, datenschutzkonformen und sicheren Zugang zu den Rezeptdaten – für mehr Zeit und verbesserte Abläufe bei der Beratung Ihrer Patientinnen und Patienten. Weitere Informationen https://www.das-e-rezept-fuer-deutschland.de/ Sie haben alle Gesundheitsdaten auf einen Blick Die elektronische Patientenakte und die Notfalldaten auf der elektronischen Gesundheitskarte geben Ihnen auf Wunsch Ihrer Patientinnen und Patienten einen schnellen Überblick über deren Gesundheitsgeschichte. Damit können Sie individuell umfassender beraten und haben Unverträglichkeiten, Allergien oder Wechselwirkungen sofort im Blick. Ab 2025 wird die ePA für alle in der Breite verfügbar kein und Apotheken vor allem durch die integrierte Medikationsliste mehr Überblick verschaffen. Infos zur ePA für alle Vertrauliche Informationen kommen schneller an Nutzerinnen und Nutzer der Telematikinfrastruktur profitieren vom schnellen und sicheren Datenaustausch. KIM, die TI-Anwendung für die Kommunikation im Medizinwesen, ermöglicht eine sichere E-Mail-Kommunikation auch zu medizinisch sensiblen Informationen. Ab Sommer 2022 sorgt der TI-Messenger zusätzlich für sichere Kurznachrichten im Gesundheitswesen – in Echtzeit und ortsungebunden. Weitere Informationen KIM Weitere Informationen TI-Messenger Sie erhalten mehr Transparenz über Medikationen Mithilfe des elektronischen Medikationsplans von Versicherten sind Sie valide darüber informiert, welche Medikamente Ihre Patientinnen und Patienten einnehmen. So können Sie noch besser beraten und zum Beispiel mögliche Wechselwirkungen mit anderen Arzneimitteln noch verlässlicher berücksichtigen. Weitere Informationen Erfahren Sie mehr Die elektronische Gesundheitskarte #c-75 svg path {fill: #fff} .cls-1{fill:#000e52;} Gematik_Piktogramme_elektronisches Rezept Blau E-Rezept: Der schnelle Weg zum richtigen Medikament #c-72 svg path {fill: #010e52} .cls-1,.cls-3{fill:#000e52;}.cls-2,.cls-3{isolation:isolate;}.cls-3{font-size:8.7px;font-family:EuclidCircularB-Bold, Euclid Circular B;font-weight:700;}.cls-4{letter-spacing:-0.02em;}.cls-5{letter-spacing:-0.03em;} HBA HBA: Eintrittskarte für die digitale Welt #c-73 svg path {fill: #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_ KIM: Schnell und sicher kommunizieren #c-74 svg path {fill: #010e52} .cls-1{fill:#000e52;} Gematik_Piktogramme_TI-Messenger_Blau Kopi