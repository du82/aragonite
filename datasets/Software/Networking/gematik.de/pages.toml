title = "News-Detail | gematik"
full_description = "09.06.2022 Aktuelles | Security Heroes aus Münster machen TI noch sicherer Damit das Gesamtsystem der Telematikinfrastruktur noch sicherer wird, können Sicherheitsexperten im Rahmen des Coordinated Vulnerability Disclosure Programs der gematik Schwachstellen und Bedrohungen melden, damit noch vor der öffentlichen Verbreitung die Möglichkeit besteht, diese zusammen mit den jeweiligen Partnern zu beheben. Zu diesen sogenannten „Security Heroes“ gehören Christoph Saatjohann und Fabian Ising von der Fachhochschule Münster vom Labor für IT-Sicherheit. Beide haben der gematik Schwachstellen im Kontext des KIM Client Moduls gemeldet und damit noch vor der öffentlichen Verbreitung ermöglicht, diese zu beheben. Deshalb dankt die gematik Herrn Saatjohann und Herrn Ising für die Meldung und die konstruktive Unterstützung! Weitere Informationen zum Coordinated Vulnerability Disclosure Programs der gematik und zu den Security Heroes auf: https://www.gematik.de/datensicherheit/security-heroes zurück © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
