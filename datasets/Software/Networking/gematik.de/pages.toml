["https://gematik.de/anwendungen/isik"]
title = "ISiK | gematik"
description = """
Auf einen Blick: ISiK - der Standard für IT-Systeme in Krankenhäusern                                                                                                                                                                                PDF | 147 KB | 27.04.2023"""
full_description = "Vorteile Erklärfilm Beispiele Stimmen aus der Praxis Download Erfahren Sie mehr Inhalte dieser Seite ISiK Für eine gemeinsame digitale Sprache im Klinikalltag In Krankenhäusern müssen Behandlungsdaten schnell und sicher ausgetauscht werden. ISiK (Informationstechnische Systeme in Krankenhäusern) verbindet alle IT-Systeme, die vor Ort zum Einsatz kommen, damit wichtige Informationen ohne Umwege dort landen, wo sie benötigt werden. Die ISiK-Standards sind verbindlich und müssen mit einer Übergangsfrist von 24 Monaten umgesetzt werden. Welche Möglichkeiten bieten ISiK-Standards?Die ISiK-Standards sparen wichtige ZeitVitalwerte können von den Pflegekräften per Scanner mithilfe von ISiK direkt in ein smartes und intuitives Pflegeexperten-System geschickt werden. Die Daten gelangen dadurch ohne mögliche Fehler beim Ausfüllen von Formularen direkt bei den behandelnden Ärztinnen und Ärzten.Die ISiK-Standards schaffen Klarheit, ohne UmständeBei der Entlassung aus dem Krankenhaus müssen Patientinnen und Patienten dank ISiK nicht noch einmal – wie oft üblich – persönlichen Daten wie Versicherungsverhältnis und Wohnort angeben. ISiK speichert diese Informationen automatisch und ohne Umstände in der Entlassakte.Die ISiK-Standards ermöglichen mehr FlexibilitätPatientinnen und Patienten, die beispielsweise nach einer Operation engmaschig betreut werden, müssen regelmäßig Fragebögen ausfüllen. Dank ISiK ist das mit einer App möglich, so dass die Eingabe bequem von zu Hause aus erfolgen kann.Die ISiK-Standards machen den Weg freiDie stationäre Behandlung einer Patientin oder eines Patienten geht zu Ende und die anschließende Reha soll starten. Dafür muss eine passende Einrichtung vermittelt werden. ISiK hilft, die geeignete Reha-Einrichtung unkompliziert und schnell zu finden.Die ISiK-Standards machen stark gegen Viren und ErregerWird bei einer Patientin oder einem Patienten ein Virus oder ein Erreger festgestellt, ist das im klinischen Umfeld äußerst problematisch. Hier ist es essenziell, zeitnah wirksame Maßnahmen einzuleiten, um die weitere Ausbreitung effizient zu verhindern. Durch ISiK „sprechen“ die relevanten IT-Systeme miteinander, so dass Daten nicht erst mühsam und zeitaufwendig ermittelt, gesichtet und ausgewertet werden müssen. Wie funktioniert eigentlich ISiK? Eine digitale Sprache für den Klinikalltag Aus dem Klinikalltag: Beispiele aus der Praxis Gemeinschaftskrankenhaus Havelhöhe Im Babylotsenprogramm werden Eltern beraten und rund um das Thema Baby unterstützt. Dafür werden definierte Patientendaten per Fragebogen aufgenommen. Mit ISiK geschieht das alles digital. Eltern können somit die Informationen schon vor der Aufnahme oder nach der Entlassung senden, die dann strukturiert in die Patientenakte übernommen und verarbeitet werden. Zollernalb Klinikum Vitalwerte wie Blutdruck und Herzfrequenz werden im Zollernalb Klinikum von den Pflegekräften per Scanner mithilfe von ISiK direkt in ein smartes und intuitives Pflegeexpertensystem geschickt. Patientendaten gelangen dadurch ohne Fehler beim Ausfüllen von Formularen bei den behandelnden Ärztinnen und Ärzten. Es wird viel Zeit gespart, die für die Patientinnen und Patienten genutzt werden kann. Klinikum der Stadt Ludwigshafen am Rhein Wenn Patientinnen oder Patienten aus dem Klinikum Ludwigshafen entlassen werden, müssen sie nicht noch einmal – wie oft üblich – ihre persönlichen Daten angeben, z. B. Angaben zur Krankenkasse oder Wohnort. Denn mit ISiK landen diese Informationen automatisch und ohne Umstände in der persönlichen Entlassakte. Universitätsklinikum Essen Transplantationspatienten werden im Universitätsklinikum Essen vor und nach ihrer Operation engmaschig betreut. Um diesen Prozess zu begleiten, sollen Patientinnen und Patienten regelmäßig Fragebögen ausfüllen. Mithilfe von ISiK kann dabei eine App zum Einsatz kommen, mit der Patientinnen und Patienten die Fragen auch bequem zu Hause ausfüllen können. Klinikum rechts der Isar der TU München Das Klinikum rechts der Isar der TU München hat bereits einen Prozess gestartet, bei dem Patientendaten über den neuen ISiK-Standard übertragen werden. Dies ist die Grundlage, um daran anschließend die Übertragung von Daten zwischen Krankenhäusern zu ermöglichen. Zudem bereitet das Klinikum einen Self-Service-Check-in vor, bei dem Patientinnen und Patienten die Aufnahme im Krankenhaus schon von zu Hause aus über das Patientenportal digital vorbereiten können. Unfallkrankenhaus Berlin Viren oder Erreger, die sich z. B. durch Tröpfchen- oder Schmierinfektion übertragen, sind im klinischen Umfeld äußerst problematisch. Wird bei einer Patientin oder einem Patienten ein kritischer Erreger wie das Norovirus festgestellt, herrscht „Alarmstufe Rot“. Es besteht akuter Handlungsbedarf: Mit welchen Patientinnen und Patienten und mit welchen Angestellten hatte die betroffene Person während des Aufenthalts Kontakt? Durch ISiK „sprechen“ die relevanten IT-Systeme am Unfallkrankenhaus Berlin miteinander, so dass Daten nicht erst mühsam und zeitaufwendig ermittelt, gesichtet und ausgewertet werden müssen. Auf diese Weise können zeitnah wirksame Maßnahmen eingeleitet werden, um die weitere Ausbreitung des Erregers effizient zu verhindern. Klinikum Ingolstadt Die stationäre Behandlung eines Patienten oder einer Patientin geht zu Ende und die anschließende Reha soll starten. Dafür muss eine passende Einrichtung vermittelt werden. Dank ISiK kann die geeignete Reha-Einrichtung am Klinikum Ingolstadt unkompliziert und schnell gefunden werden. Interoperabilität dank ISiK Andreas G. Henkel, Leitung Abteilung Informationstechnologie, Klinikum rechts der Isar Zusätzliche Informationen Auf einen Blick: ISiK - der Standard für IT-Systeme in Krankenhäusern PDF | 147 KB | 27.04.2023 Download Erfahren Sie mehr Datensicherheit in der TI #c-45 svg path {fill: #fff} .st0{fill:#000E52;} Unser Fachportal: Checklisten und weitere Informationen Arbeitskreis-Analyse Umsetzung ISiK im Krankenhaus (bei INA) © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
