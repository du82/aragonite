["https://gematik.de/anwendungen/epa-fuer-alle/pflege"]
title = "Pflege | gematik"
full_description = "Vorteile für die Pflege Downloads für die Pflege Erklärvideos FAQ Inhalte für Nutzergruppen Erfahren Sie mehr Inhalte dieser Seite Zum Webshop Start der ePA für alle Kostenlose Infopakete für Praxen, Kliniken und Apotheken Zur Bestellung ePA für alle Pflege Auf dieser Themenseite finden Sie wichtige Informationen für Pflege-Einrichtungen, die mit der ePA für alle arbeiten werden. Alle relevanten medizinischen Daten Ihrer Patientinnen und Patienten einfach zugänglich – das wird mit der ePA für alle möglich. Ab Januar werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen, außer die Versicherten widersprechen dem. Auch private Krankenversicherungen dürfen ihren Versicherten eine ePA anbieten. Dadurch bekommen Sie viele neue Möglichkeiten im Berufsalltag – egal ob in der ambulanten oder in der stationären Pflege. Auf dieser Seite erfahren Sie, was Sie mit der ePA für alle erwartet und finden vermehrt Infomaterialien zum Download. Vorteile für die PflegeGesundheitsdaten sind im Versorgungsalltag zugänglichPatientinnen und Patienten müssen mit der ePA für alle nicht mehr jeden Zugriff einzeln freigeben. Für die Pflege ist eine Institutionsberechtigung vorgesehen. Das heißt: Alle Heilberuflerinnen und Heilberufler einer Einrichtung, also zum Beispiel eines Pflegeheims, und ihre Mitarbeitenden können auf die ePA zugreifen. Vorrausetzung ist, dass die Patientin oder der Patient vorher zugestimmt hat.Informationen gehen nicht verlorenArztbriefe, Pflegeüberleitungsbögen, Diagnosen und Laborwerte, Operations- und Therapieberichte: All das kann künftig in der ePA gebündelt werden. Diese Daten sind im Behandlungskontext für Ärztinnen, Apotheker und Pflegekräfte direkt sichtbar und sorgen für einen schnellen Überblick. Das gilt sowohl in der ambulanten als auch in der stationären Versorgung.Medikation wird übersichtlichIn der Medikationsliste, die in der ePA integriert ist, werden von Beginn an alle verschriebenen Medikamente einer Patientin bzw. eines Patienten angezeigt. Probleme oder Wechselwirkungen können so schneller erkannt werden. In einem zukünftigen Update wird auf der Medikationsliste aufbauend der Medikationsplan zur ePA hinzugefügt. Beispielsweise können dann die Informationen institutionsübergreifend gepflegt und mit Einnahmehinweisen ergänzt werden. Vorsorgevollmacht bei BedarfWenn Menschen mit körperlichen oder kognitiven Einschränkungen (z. B. Demenz) die ePA nicht eigenständig bedienen können, gibt es zwei Möglichkeiten: Dritte, die über eine Vorsorgevollmacht verfügen, können die ePA im Namen der Patientin oder des Patienten direkt bedienen und verwalten. Alternativ können Dritte (zum Beispiel Freundinnen, Freunde oder Angehörige) technisch berechtigt werden, um bei Bedarf für die Patientin oder den Patienten zu handeln. Downloads für die Pflege Infomaterialien für die Pflege In unserem Download-Portal finden Sie Infomaterialien, Erklärvideos und Grafiken zum Herunterladen. Zum Download-Portal Erklärvideos Video abspielen Die neue ePA in der Pflege Funktionen und Vorteile × Video abspielen Medikationsliste in der ePA für alle Besserer Überblick für das medizinische Personal × Video abspielen Suchfunktion in der ePA für alle So finden Sie relevante Informationen × FAQWird eine ePA auch für Menschen angelegt, die nicht zustimmungsfähig sind (wie zum Beispiel Demenzerkrankte)?Ja. Ein Widerspruch kann durch gesetzliche Vertreter vorgenommen werden. Gegebenenfalls notwendige Einwillungen können ebenfalls durch den gesetzlichen Vertreter organisiert werden.Kann in die ePA auch ein Notfalldatensatz hinterlegt werden?Ja.Müssen Patientinnen und Patienten darüber informiert werden, welche Dokumente aus der ePA heruntergeladen und im lokalen System gespeichert wurden?In der ePA wird protokolliert, welche Aktionen (z. B. Dokumente herunterladen) wann und von wem durchgeführt wurden. Dieses Protokoll ist für die Patientin oder den Patient in der ePA ersichtlich. Eine zusätzliche Information ist nicht notwendig. Patientinnen und Patienten haben vorher die Möglichkeit über ihre ePA-App oder die Ombudsstelle der Krankenkasse der Möglichkeit zum Zugriff durch eine Institution zu widersprechen. Die Ombudsstellen können diese Protokolldaten dem Versicherten auf Anfrage auch zur Verfügung stellen.Braucht eine Einrichtung an jedem Arbeitsplatz ein Kartenlesegerät?Nein. Die IT in der Praxis muss so konfiguriert sein, dass von jedem Arbeitsplatz auf die Anwendungen der TI zugegriffen werden kann. Der ePA-Zugriff gilt dann für die entsprechende TelematikID.Wie sind die Server vor mechanischen und digitalen Angriffen geschützt?Die ePA wurde unter Beachtung höchster Sicherheitsstandards und im Einvernehmen mit dem Bundesamt für Sicherheit in der Informationstechnik entwickelt. Zusätzlich werden alle Sicherheitsanforderungen mittels Sicherheitsgutachten geprüft, bevor eine Zulassung für den Betrieb ausgesprochen wird. Zu diesem Suchbegriff wurde leider kein Eintrag gefunden. Alle FAQ Alle Infos für verschiedene Nutzergruppen auf einen Blick Übersicht Auf unserer Übersichtsseite finden Sie allgemeine Informationen für die medizinischen Nutzergruppen, die mit der ePA für alle ab Januar 2025 arbeiten werden. Praxen Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Praxen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Krankenhäuser Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Krankenhäuser, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Zahnarztpraxen Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Zahnarztpraxen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Apotheken Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Apotheken, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Reha Ab Januar 2025 werden die gesetzlichen Krankenkassen die neue ePA für ihre Versicherten anlegen. Auf dieser Themenseite finden Sie wichtige Informationen für Rehaeinrichtungen, die mit der ePA für alle arbeiten werden sowie Infomaterialien zum Download. Erfahren Sie mehr Sie haben weitere Fragen? Zum Kontaktformular #c-522 svg path {fill: #fff} .cls-1{fill:#fff;} Gematik_Piktogramme_Information Weiß ePA für alle - Informationen für Versicherte #c-523 svg path {fill: #fff} .cls-1{fill:#fff;} Gematik_Piktogramme_Information Weiß ePA für alle - Informationen der KBV © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
