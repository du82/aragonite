full_description = '30.12.2024 Aktuelles | Aufzeichnungen der Veranstaltung "gematik trifft" mit dem DAV sind online ePA für alle in Apotheken: In unserer Veranstaltung „gematik trifft“ haben wir zusammen mit dem Deutschen Apothekerverband e. V. (DAV) und ausgewählten Herstellern gezeigt, wie die neue ePA in Apothekensoftwaresystemen aussieht. Die Aufzeichnung der Veranstaltung ist nun online. In der Podiumsrunde gaben DAV-Vizevorsitzende Anke Rüdinger, DAV-Syndikusrechtsanwalt Marcel de la Chevallerie, gematik-Geschäftsführerin Brenya Adjei und ePA-Product Ownerin Lena Dimde Infos rund um die Einführung und zum Einsatz der ePA in Apotheken. Danach zeigten vier Hersteller die Integration der ePA in ihren Systemen, um einen ersten Einblick in die Handhabung zu geben. Aufzeichnungen der Veranstaltung: https://www.gematik.de/anwendungen/epa/epa-fuer-alle/mitschnitte-apotheken zurück © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA'
