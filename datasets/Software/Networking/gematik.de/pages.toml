title = "News-Detail | gematik"
full_description = "28.03.2023 Aktuelles | TI-Messenger Hackathon: Matrix-Messenger im Gesundheitswesen chatten erstmals anbieterübergreifend Zum ersten Mal lud die gematik vom 23. bis 24. März 2023 zum TI-Messenger Hackathon nach Berlin ein. Das Ziel: den aktuellen Status quo zum Entwicklungsstand der TI-Messenger zu ermitteln und voranzutreiben. Dazu diskutierten mehr als 30 Teilnehmerinnen und Teilnehmer aus Industrie, Gesundheitswesen und Politik über Umsetzungsmöglichkeiten der Spezifikation, welche die zentralen Anforderungen für die Entwicklung der TI-Messenger vorgibt. Mit Erfolg entwickelten sie gemeinsam Lösungswege, um das Chatten über Sektorengrenzen hinweg zu ermöglichen. Während des „Hacks“ konnten erstmals verschlüsselte Kurznachrichten anbieterübergreifend via TI-Messenger verschickt werden. „Als Industriepartner begrüßen wir die Idee des TI-Messenger Hackathons der gematik und den damit verbundenen Dialog ausdrücklich“, so Michael Borchert, Leiter IT & Entwicklung von Kosyma. „Für die Entwicklung eines leistungsstarken TI-Messengers ist ein vertrauensvoller interdisziplinärer Austausch unverzichtbar und trägt maßgeblich zu einem gemeinsamen Produktverständnis bei.“ Peter Salathe, Public Affairs von m.Doc ergänzt: „Wir alle – Industrie wie Leistungserbringerinnen und Leistungserbringer – werden davon profitieren, wenn wir uns von digitalen Insellösungen verabschieden und die digitale Zusammenarbeit endlich gemeinsam voranbringen.“ „Der TI-Messenger Hackathon war ein voller Erfolg und hat zum ersten Mal alle Industriepartner an einen Tisch zusammengebracht. Die Veranstaltung hat gezeigt, die Hersteller sind bei der Entwicklung auf einem sehr guten Weg. Wir sind davon überzeugt, dass die datenschutzkonforme Kommunikation via TI-Messenger für viele Beschäftigte z. B. in Krankenhäusern, Praxen und Apotheken eine wertvolle Unterstützung sein wird. Und für die Patientenversorgung ein großer Gewinn“, sagt Franziska Faust, Produktmanagerin bei der gematik. Über den aktuellen Entwicklungsstand der TI-Messenger informiert das Team der gematik auch auf Europas zentraler Health-IT-Messe DMEA am Stand D-108 Halle 1.2. Die Fachmesse findet vom 25. April bis 27. April 2023 in Berlin statt. zurück © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
