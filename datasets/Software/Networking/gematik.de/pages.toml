["https://gematik.de/kontakt"]
title = "Kontakt | gematik"
full_description = 'Hilfe & Kontakt So erreichen Sie uns Hilfe & Kontakt Die gematik freut sich über jeden Hinweis, Anregung oder einfach nur Feedback von Ihnen und möchte diese auch gerne in möglichst kurzer Zeit beantworten. Bitte sehen Sie deshalb davon ab, die gematik per Fax oder auf dem Postweg zu kontaktieren. Verwenden Sie stattdessen unsere Kontaktformulare auf den Webseiten der gematik. Damit helfen Sie nicht nur uns, sondern auch der Umwelt. Kontaktformular Bei technischen Problemen wenden Sie sich bitte an Ihren IT-Dienstleister oder direkt an den Hersteller bzw. Anbieter. Bestellungen für Testkarten oder Testsoftware nehmen Sie über den Onlineshop unseres Fachportals vor Onlineshop Weitere technische Informationen finden Sie in unserem Fachportal So finden Sie uns Sichere Kommunikation Verschlüsselte und signierte E-Mail Um den Austausch von vertraulichen Informationen mit unseren Partnern sicherzustellen, können Daten verschlüsselt und signiert per E-Mail übertragen werden. Die gematik stellt allen Kommunikationspartnern die öffentlichen Schlüssel des Verschlüsselungsstandards S/MIME zur Verfügung. Einrichtung verschlüsselte und signierte E-Mails Einrichtung - Senden Um verschlüsselte E-Mails an die gematik senden zu können, laden Sie sich bitte durch Angabe der E-Mail-Adresse des Empfängers das entsprechende S/MIME-Zertifikat über den Zertifikatsspeicher https://www.globaltrustpoint.com herunter. Alternativ können Sie sich vom Empfänger eine S/MIME signierte E-Mail zusenden lassen. Der Importvorgang des S/MIME-Zertifikats ist abhängig von Ihrem verwendeten E-Mail-Client. Unter Microsoft Outlook wählen Sie hierzu beispielsweise den angelegten Kontakt Ihres gematik Kommunikationspartners über "Kontakte" aus und importieren das Zertifikat über die Schaltfläche "Importieren". Einrichtung – Empfangen Wenn Sie vertrauliche Informationen von der gematik verschlüsselt per E-Mail erhalten wollen, benötigen wir von Ihnen ein gültiges, auf Ihr Unternehmen oder Sie persönlich ausgestelltes S/MIME-Zertifikat einer anerkannten Certificate Authority (CA). Hierzu senden Sie eine mit Ihrem Zertifikat signierte E-Mail an Ihren Ansprechpartner in der gematik. Dadurch wird das Zertifikat automatisch in das Mailgateway der gematik eingebunden. Alternative Nutzung des Webmaildienstes Wenn Sie verschlüsselt mit der gematik E-Mails austauschen wollen, aber kein S/MIME Zertifikat besitzen, ist die Verwendung des von der gematik bereitgestellten Webdienstes SecureMail möglich. Folgende Anleitung erleichtert Ihnen die Einrichtung: Anleitung zur Einrichtung des herstellerspezifischen Verschlüsselungsverfahrens (SecureMail) © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA'
