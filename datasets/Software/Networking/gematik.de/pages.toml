["https://gematik.de/newsroom/news-detail/aktuelles-aktensystemhersteller-rise-und-ibm-zugelassen"]
title = "News-Detail | gematik"
full_description = "16.01.2025 Aktuelles | Aktensystemhersteller RISE und IBM zugelassen Die gematik hat Research Industrial Systems Engineering (RISE) im Entwicklerkonsortium mit BITMARCK sowie IBM Deutschland GmbH anlässlich des Starts der Pilotierung der ePA für alle in den Modellregionen am 15. Januar die Zulassungen für die Bereitstellung der Aktenkonten erteilt. Damit können alle gesetzlichen Krankenkassen sukzessive die elektronische Patientenakte (ePA) für ihre Versicherten anlegen. Der Prozess startet mit Versicherten, die bereits eine ePA haben; daraufhin folgt die Aktenanlage für Versicherte in den Modellregionen Hamburg & Umland, Franken und in Teilen NRW, dann bundesweit. Durch dieses schrittweise Vorgehen wird sichergestellt, dass die Aktenkonten in den Modellregionen für die Erprobung der neuen ePA zur Verfügung stehen. Im Rahmen der Zulassung für die Anlage der Aktenkonten haben auch alle gesetzlichen Krankenkassen von der gematik die Zulassung für die Aktualisierung ihrer ePA-Apps erhalten. Versicherte können mit der App ihrer Krankenkasse ihre ePA selbstständig verwalten und bspw. Zugriffsberechtigungen für medizinische Einrichtungen anpassen. Die Updates der ePA-Apps laufen aktuell. Die Pilotierung der neuen ePA ist gestern in den drei Modellregionen gestartet. Hier erproben knapp 300 Zahnarztpraxen, Praxen, Apotheken und Krankenhäuser die neue digitale Anwendung. Nach erfolgreich abgeschlossener Pilotierung wird die ePA für alle bundesweit ausgerollt. zurück © gematik GmbH 2024 Rechtliche HinweiseDatenschutzImpressumVersichertePraxenApothekenKrankenhäuserRehabilitationPflegeKarriereFachportal INA"
