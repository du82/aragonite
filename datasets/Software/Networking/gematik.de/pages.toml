full_description = "Vorteile Erklärfilm So funktioniert's Stimmen aus der Praxis E-Rezept für Privatversicherte Patienteninformationen für Ihre Apotheke Downloads Erfahren Sie mehr Inhalte dieser Seite E-Rezept Mehr Zeit für pharmazeutische Beratung Das E-Rezept erleichtert den Versicherten viele Arzt- und Apothekengänge. Aber auch für Apotheken bringt es Vorteile: Denn Verschreibungen sind künftig vor den Patientinnen und Patienten in der Apotheke – und das weder unleserlich noch fehlerhaft. Es bleibt mehr Zeit für das Wesentliche: die Beratung der Kundinnen und Kunden. Welche Vorteile bietet das E-Rezept für Apotheken?Das E-Rezept vereinfacht AbläufeDas E-Rezept beschleunigt und automatisiert administrative Vorgänge. Durch den Zugang zu den Rezeptinformationen in der Telematikinfrastruktur (TI) ist eine händische Eingabe der Rezepte und die Prüfung der ärztlichen Angaben nicht mehr nötig. Und Versicherte müssen keine Angst davor haben, ihr Rezept zu verlieren – es bleibt sicher in der TI gespeichert. Weniger Fehler und RetaxationenFehlerhafte oder schwer lesbare Papierrezepte gehören ab sofort der Vergangenheit an. Das fehleranfällige Scannen samt OCR-Erkennung und Nachbearbeitung entfällt. Über die eGK oder den Rezeptcode erhalten Apotheken den direkten Zugriff auf die elektronisch signierte Verordnung des Arztes. Weniger Fehler bei der Abgabe bedeuten weniger Retaxationen und damit auch weniger finanzielle Verluste.Mehr Zeit für die pharmazeutische BeratungAdministrative Vorgänge und Nachfragen in Arztpraxen kosten Zeit. Weil E-Rezepte schon in der Arztpraxis automatisch auf Formfehler geprüft werden, entfallen Arbeitsschritte. Und die Bestellung selbst kommt direkt im Warenwirtschaftssystem an. Das spart wertvolle Zeit für die Beratung der Kundinnen und Kunden.Dank E-Rezept näher an den Patientinnen und PatientenUm ein Rezept einzulösen, können Patientinnen und Patienten über die E-Rezept-App in Kontakt mit der Apotheke treten. Bereits vor dem Besuch vor Ort können Apotheken darüber informieren, ob ein Medikament vorrätig ist und wann es abgeholt werden kann. Dieser Service stärkt die Beziehungen zu den Kundinnen und Kunden. Interaktive Infografik Öffnen Zusammenspiel von E-Rezept & neuer ePA Erfahren Sie hier interaktiv, wie E-Rezept und ePA für alle zukünftig ineinandergreifen. × .ctype-ce_iframe_teaser .modal .modal-dialog .modal-content .modal-body, .ctype-ce_iframe_slider .modal .modal-dialog .modal-content .modal-body { aspect-ratio: unset; } .ctype-ce_iframe_teaser .modal .modal-dialog .modal-content, .ctype-ce_iframe_slider .modal .modal-dialog .modal-content { height:100%; } .ctype-ce_iframe_teaser .modal .modal-dialog, .ctype-ce_iframe_slider .modal .modal-dialog { max-width: 98%; max-height: 95%; } .close { font-size: 3rem; } Erklärfilm - E-Rezept per eGK einlösen Bitte akzeptieren Sie YouTube-Cookies um dieses Video anzuschauen. Einstellungen ändern So funktioniert das E-Rezept Der Patient reicht das Rezept per eGK oder Rezeptcode ein Patientinnen und Patienten kommen mit ihrer elektronischen Gesundheitskarte oder dem Rezeptcode per App oder Ausdruck in Ihre Apotheke und lösen das Rezept dort ein. Alternativ können sie über die E-Rezept-App anfragen, ob ihr Medikament bei Ihnen verfügbar ist und dieses digital bestellen. Die Apotheke ruft die Rezeptdaten aus der Telematikinfrastruktur ab Sobald Sie die eGK eines Patienten eingelesen oder den Rezeptcode gescannt haben, können Sie auf die Rezeptdaten zugreifen, die in der TI gespeichert sind. Die Rezeptdaten kommen so direkt in Ihr Warenwirtschaftssystem. Wie beim bisherigen Muster-16-Formular kann auch eine Vertreterin oder ein Vertreter das Rezept in Ihrer Apotheke einlösen. Die Apotheke gibt die Medikamente aus Als Apotheke geben Sie den Patientinnen und Patienten die Medikamente wie gewohnt vor Ort, per Botendienst oder Versand aus. Hier haben Sie auch wie gewohnt die Möglichkeit, Ihre Kundinnen und Kunden umfassend zu beraten. Stimmen aus der Praxis Katja Krane Privilegierte Apotheke Barmstedt Matthias Philipp Axels Apotheke Dorothee Wilms Stadtwald-Apotheke Bottrop Ralf König Königs-Apotheke Nürnberg E-Rezepte von Privatversicherten Nach den gesetzlich Versicherten können künftig auch Privatversicherte E-Rezepte einlösen. Das funktioniert denkbar einfach per App oder Ausdruck. Ob bzw. wann sie das E-Rezept nutzen können, hängt von der jeweiligen Krankenversicherung ab. Wie Sie als Apothekerin oder Apotheker ein E-Rezept von Privatversicherten einlösen: Sie benötigen ein Update Ihres Warenwirtschaftssystems mit der neuen Funktion: E-Rezept für Privatversicherte. Die Verordnung für die Privatpatientin bzw. den Privatpatienten speichern die verordnenden Ärzt:innen im Fachdienst fürs E-Rezept. Ihre privatversicherten Kund:innen können Ihnen das E-Rezept über die App „Das E-Rezept“ zuweisen oder vor Ort in der App vorzeigen. Auch per Ausdruck können Privatversicherte ihre E-Rezepte einlösen. Sie verarbeiten das E-Rezept wie gewohnt in Ihrer Warenwirtschaft und dokumentieren die abrechnungsrelevanten Informationen. Die Ausfertigung von Kopien der Verordnung, damit die Kund:innen diese bei verschiedenen Kostenträgern einreichen können, entfällt. Nutzt ein:e Privatversicherte:r die E-Rezept App, können Sie ihr bzw. ihm den Kostenbeleg digital darin bereitstellen, sofern die bzw. der Versicherte dazu in der App eingewilligt hat. Sonst drucken Sie den Beleg aus. Die bzw. der Privatversicherte kann den Kostenbeleg dann wie bisher an verschiedene Kostenträger weiterleiten. Hinweis: Privatversicherte erhalten von ihrer Versicherung keine elektronische Gesundheitskarte. Sie können daher die E-Rezepte ausschließlich per App oder Ausdruck bei Ihnen einlösen. Digitale Patienteninformationen für Ihre Apotheke Gematik_Piktogramme_Bericht Blau Kopie 2 Infopaket zur E-Rezept-App: Onepager, Plakate und Videos ZIP | 73 MB | 07.03.2024 Download Gematik_Piktogramme_Bericht Blau Kopie 2 Infopaket: Flyer, Plakat und Videos ZIP | 15 MB | 02.01.