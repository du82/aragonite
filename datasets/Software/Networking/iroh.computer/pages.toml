["https://www.iroh.computer/blog/iroh-0-28-let-them-have-crates"]
title = "iroh 0.28.0 - Let them have crates - Iroh"
description = "Iroh 0.28 release"
full_description = '''iroh 0.28.0 - Let them have cratesNovember 6, 2024 by ramfoxWelcome to a new release of iroh, a library for building on direct connections between devices, putting more control in the hands of your users. Buckle up, folks! We’ve been talking a big game about focusing iroh and gearing up for a 1.0 release and v0.28 is where we’ve started to do the major refactors to make these promises a reality. The most dramatic changes are around slimming down the iroh codebase, moving code to new repos, and marking chunks of code as deprecated. Don’t worry, though, we didn’t only shuffle things around, but we’ve also added new functionality to Discovery, new configuration options to iroh-dns-server, and squashed some nasty bugs. This was a complicated release and some things got confused in the shuffle. You’ll notice that iroh v0.28.0 was yanked. v0.28.1 is the “canonical” version of the latest release! This is also true of iroh-net, iroh-cli , iroh-blobs, and iroh-gossip. 📦 New Crates Part of our journey to getting to iroh v1.0 includes reorganizing our crate structure and pulling existing code into new crates. We are slimming down the iroh codebase, starting with pulling the protocols that we’ve developed at number0 and the general networking tools we’ve developed to help with holepunching into their own crates. Here is a brief tour: iroh-router: this new crate contains the definitions for protocols. It lives inside the iroh repo. iroh-gossip: the crate that contains the iroh-gossip protocol. It exists in its own repo now: https://github.com/n0-computer/iroh-gossip iroh-docs: the crate that contains the iroh-docs protocol. It exists in its own repo now: https://github.com/n0-computer/iroh-docs iroh-blobs: the crate that contains the iroh-blobs protocol. It exists in its own repo now: https://github.com/n0-computer/iroh-blobs portmapper: a new crate, pulled from iroh-net. A library to ensure a mapping for a local port is maintained despite network changes. Provides upnp, pcp and nat-pmp protocols support. It currently still exists in the iroh repo, but will move into a new net-tools repo in future refactors. netwatcher: a new crate, pulled from iroh-net. A cross-platform library for monitoring networking interfaces and route changes. It currently exists in the iroh repo, but will move into a new net-tools repo in future refactors. ⚔️ Deprecations We’ve got some big API changes coming down the pipe in our next release. Here is a guide to what changes you can expect to come! Explicitly add custom protocols As we stated in our blog post “Smaller is Better”, we are doubling down on iroh as a networking library that allows its users to easily use direct connections in their custom protocols. Because of that, the custom protocols that we at number0 have developed along-side developing iroh (namely, iroh-docs, iroh-gossip, and iroh-blobs) have moved out of iroh, and, after v0.29 is released, they will no longer get “special treatment”. If you want to use any of these protocols, you will have to add them the same way you would add your own custom protocol. If you rely on iroh-docs, iroh-gossip, or iroh-blobs, we will have an extensive guide on how to migrate your current code with the 0.29 release. CLI Iroh will no longer include a CLI and the current CLI will be split up and moved into the protocol repos. So, for example, the iroh-blobs crate will get an example that shows the current iroh blobs functionality. The current iroh doctor functionality will be moved into an iroh-doctor repo. This binary will be all about diagnosing your network setup and measuring your holepunching rates. RPC RPC functionality will also be moving out of iroh itself and into their respective protocol crates. Examples for how to add RPC functionality will also move into the custom protocol crates. As a consequence of removing RPC from iroh, we will also be removing the client API in iroh. If you rely on RPC commands in your code, we will have an extensive guide on how to migrate to the new normal with the 0.29 release. 📓 Static Discovery We will be doing some adjusting and experimenting with how we add node information to the iroh_net::Endpoint. Long term, we hope to be able to remove add_node_addr from the endpoint and just use the Discovery services to inform the endpoint about node information. The first step is to add a StaticDiscovery service. This service allows you to manually add and remove node address information to the service. So, for example, if you have a side channel that informs you of nodes that you need to dial, you would explicitly add that information to the StaticDiscovery service before you dial by NodeId. Then, when you call connect with that NodeId, the iroh_net::Endpoint will query the StaticDiscovery service to request the latest node information it has for that NodeId. This helps iroh long-term since it takes the burden of having to manage node information off of the iroh internals, and into something that you the user can manage on top of iroh. Along side this StaticDiscovery that the user has full control over, iroh will still try to resolve the given NodeId with any other Discovery services that are available. For more information, check out https://github.com/n0-computer/iroh/pull/2825. ⌛ iroh-dns-server gets configurable rate limiting Thanks to HeavenVolkoff from Spacedrive, we now have configurable rate limiting on the iroh-dns-server! In the iroh-dns-server configuration file, the field is called pkarr_put_rate_limit and can have the following values: "disabled" - No rate limiting applied "simple" - Simple rate limiting based on connected peer IP address. Details "smart" - Smart rate limiting logic logic for extracting the connection original IP address, useful for reverse proxies. Details For more information, check out https://github.com/n0-computer/iroh/pull/2772 ⚠️ Breaking Changes Protocol No protocol level changes 🎉 API iroh-net removed the secret_key property of the iroh-relay config iroh_net::relay::server::ServerActorTask::secret_key iroh_net::relay::server::ServerActorTask::public_key iroh_net::relay::server::ServerActorTask::meta_cert field secret_key in iroh_net::relay::server::RelayConfig iroh_net::portmapper is moved to its own crate: portmapper iroh_net::net has been split and added to the netwatch crate changed iroh_net::relay::server::ServerActorTask::new now takes no arguments MagicsockMetrics is now #[non_exhaustive]. This allows us to add more metrics without breaking backwards compatibility in the future. The struct is not meant to be constructed outside of iroh-net anyways. iroh-base removed iroh_base::rpc::RpcError iroh_base::rpc::RpcResult iroh changed iroh::node::ProtocolHandler -> iroh::router::ProtocolHandler But wait, there's more! Many bugs were squashed, and smaller features were added. For all those details, check out the full changelog: https://github.com/n0-computer/iroh/releases/tag/v0.28.0 and https://github.com/n0-computer/iroh/releases/tag/v0.28.1. If you want to know what is coming up, check out the 0.29.0, and our Roadmap to 1.0. If you have any wishes or see something missing, let us know about in the issues! If you need help using iroh or just want to chat, please join us on discord! To keep up with all things iroh, check us out on Twitter or Mastodon.Iroh is a dial-any-device networking library that just works. Compose from an ecosystem of ready-made protocols to get the features you need, or go fully custom on a clean abstraction over dumb pipes. Iroh is open source, and already running in production on hundreds of thousands of devices.To get started, take a look at our docs, dive directly into the code, or chat with us in our discord channel.'''
