["https://iroh.computer/blog/a-new-direction-for-iroh"]
title = "A new direction for iroh - Iroh"
description = "Thus far, Iroh has been built as an implementation of the InterPlanetary File System (IPFS) focused on interoperability with Kubo, the reference implementation of IPFS. In the near future Iroh will break  interoperability with Kubo, with the goal of moving the IPFS project forward."
full_description = '''A new direction for irohFebruary 17, 2023 by number 0 teamIroh will still be aim to implement the core goals of the IPFS design, but moving forward our exclusive focus is on hitting numbers that make Iroh a reliable piece of technology that just works. The measurements we&ve gathered from our work to date leaves us confident that we need to make breaking changes to get to that “it just works” feeling, which means a new direction for Iroh. Rather than delete the IPFS implementation we&ve built so far we will rename the project to Beetle, and put it into maintenance mode. In the coming weeks we will publish source code, design documents, measurements and production deployment reports that lead up to a re-release of Iroh. You can stay up to date by subscribing to our youtube channel. We have no plans to leave the IPFS community, instead we want to use our freedom from today's spec requirements to take big risks in the name of pushing IPFS forward. We see what we&re building as IPFS 2.0, and plan to convince others that Iroh should be formalized as future IPFS improvements through a quantified design and real world adoption. We may fail, and if so our work will be published in the open as lessons for our colleagues to build upon. Why? Because our metrics are telling us this is what we have to do. “Plan A” for Iroh was something like this: Build a version of IPFS in rust that talks to kubo. Measure. Improve. GOTO 2, until Iroh performance metrics approaches a theoretical max. After 9 months of building and 5 releases of Iroh, we’ve accomplished a few iterations of Plan A. We have built an IPFS implementation that interoperates with kubo, measured it, and shipped a number of performance improvements. Iroh is nowhere near any theoretical maximum. There are lots of details to unpack in the future, but to get a sense of numbers, the current interop-focused Iroh needs at least 2,000 simultaneous p2p connections to serve as a gateway; sends on the order of 1,000 messages to retrieve a single 256KB block of data; takes on the order of seconds to resolve DHT queries; and cannot reliably remain connected to the vast majority of peers on the network, if connection is possible at all. We need those numbers to be on the order of 200 peers; less than 1 message per block; and 95%+ reliability. There is no way to get there without breaking things. So, Plan B: Define an IPFS-like system and quantify “working” in terms of stuff we can measure. Build a thing that hits those numbers. Build bridges to other IPFS implementations. We’ve been working with this “Plan B” approach since early January, and our early experiments in this new paradigm are extremely promising. We’ve also been spending a great deal of time learning from other research in the space, some of which we are deeply excited to utilize given this newfound freedom. The world needs IPFS. The only way to get there is to learn & grow. If you’ve ever thought “IPFS doesn’t work”, but wished it did, we would like to hear from you. Update (2022-02-23): This post originally read that we were "breaking from the IPFS spec", which isn't accurate. IPFS is a bunch of specs, and we're not breaking from all of them. Iroh is still an IPFS implementation: it continues to use CIDs. We've updated this post to reflect the change. Original text of this article can be found here.Iroh is a dial-any-device networking library that just works. Compose from an ecosystem of ready-made protocols to get the features you need, or go fully custom on a clean abstraction over dumb pipes. Iroh is open source, and already running in production on hundreds of thousands of devices.To get started, take a look at our docs, dive directly into the code, or chat with us in our discord channel.'''
