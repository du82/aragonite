description = "Iroh 0.18.0 release"
full_description = "iroh 0.18.0 - Small, but helpfulJune 7, 2024 by dignifiedquireWelcome to a new release of iroh, the open-source distributed systems toolkit with tools for connecting devices directly, moving data, and syncing state. 🏑 From fields to methods After feedback from the community, we have decided to change how you access the subsystems on the iroh::client::Client through methods instead of fields. This allows for better discoverability and a more efficient implementation under the hood in the future. The old fields are deprecated and will be removed in the next release. // iroh@0.17 let my_blob = iroh.blobs.read_to_bytes(my_hash).await?; // iroh@0.18 let my_blob = iroh.blobs().read_to_bytes(my_hash).await?; CopyCopied! Checkout PR #2350 for details. 🐘 Gossip larger messages iroh-gossip previously had a maximum message size of 4KiB. We still used this default when using iroh-gossip inside the iroh client, but it can now be overridden when configuring the gossip client directly. Checkout PR #2340 for details. 🚀 Netcheck, but faster Thanks to a new contributor and user of iroh, the time to run netcheck in iroh-net is much shorter and it avoids blocking other operations. There’s only good news here: things work faster and more reliably. Checkout PR #2330 for details. ⚠️ Breaking Changes Protocol Changes None! API Deprecations Not breaking yet, but will be breaking in the next release. iroh client::Client.blobs, use client::Client::blobs() client::Client.docs, use client::Client::docs() client::Client.authors, use client::Client::authors() client::Client.tags, use client::Client::tags() API Changes iroh-blobs removed util::LivenessTracker downloader::DownloadRequest field tag function untagged function tag added util::TagDrop util::TagCounter format::Collection::load format::SimpleStore renamed format::Collection::load → format::Collection::load_db iroh-gossip added Gossip::max_message_size changed net::util::read_message, added max_message_size param net::util::write_message, added max_message_size param net::util::read_lp, added max_message_size param removed proto::MAX_MESSAGE_SIZE But wait, there's more! Many bugs were squashed, and smaller features were added. For all those details, check out the full changelog: https://github.com/n0-computer/iroh/releases/tag/v0.18.0. If you want to know what is coming up, check out the 0.19.0 milestone, and if you have any wishes, let us know about the issues! If you need help using iroh or just want to chat, please join us on discord! And to keep up with all things iroh, check out our Twitter.Iroh is a dial-any-device networking library that just works. Compose from an ecosystem of ready-made protocols to get the features you need, or go fully custom on a clean abstraction over dumb pipes. Iroh is open source, and already running in production on hundreds of thousands of devices.To get started, take a look at our docs, dive directly into the code, or chat with us in our discord channel."
