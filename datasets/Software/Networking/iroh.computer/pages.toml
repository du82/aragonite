["https://iroh.computer/blog/iroh-0-17-0-everything-is-a-little-better"]
title = "iroh 0.17.0 - Everything Is A Little Better - Iroh"
description = "Iroh 0.17.0 release"
full_description = '''iroh 0.17.0 - Everything Is A Little BetterMay 24, 2024 by dignifiedquireWelcome to a new release of iroh, the open source distributed systems toolkit with tools for connecting devices directly, moving data, and syncing state. This release focused on improving iroh in many aspects of daily use, from wider support of operating systems to HTTP proxy support to simpler APIs for interacting with documents. There is something for everyone to enjoy! 🤓 Make Simple Things Simpler Iroh docs are great, but getting started with them can be daunting. Our API did not always help with this, so we have introduced a few additions to simplify things. Default Authors When you create an iroh Node, it always has an author, so you don't have to worry about creating one. let node = iroh::node::Node::memory().spawn().await?; let author = node.authors.default().await?; // lets gooo CopyCopied! Document Import Importing a document is one of the most basic things you need to do, but until now, it hasn't been very easy to know when the imported document was synced or when the content was downloaded. This is now super easy let ticket: DocTicket = "<doc ticket from your friend>".parse()?; // import the document via ticket, and subscribe to its events let (doc, mut events) = node.docs.import_and_subsribe(ticket).await?; while let Some(event) = events.try_next().await? { match event { LiveEvent::SyncFinished(_) => { // this event is emitted when the initial sync is finished println!("sync finished") } LiveEvent::PendingContentReady => { // this event is emitted when all content of the initial sync is downloaded println!("all content downloaded"); break; } _ => { // ignore other events } } } // Use your document, knowing that the initial data is all available CopyCopied! Checkout PR #2303, PR #2302 and PR #2299 for details. 🚇 HTTP Proxy Support Sometimes, you just want to use another tunnel, and sometimes, this tunnel is an HTTP proxy. If so, you are in luck, as we now have support for HTTP_PROXY and HTTPS_PROXY, including authentication. If you use iroh, it will automatically parse these environment variables and do the right thing, and if you use iroh-net, you can call Builder::proxy_from_env to load the configuration. Checkout PR #2298 for details. 🍦 More than one flavour of BSD With iroh being used in different projects, more people want to use it on new platforms, and so we got the request for iroh to work on OpenBSD and FreeBSD. Thanks to the community's help, we are happy to report that with patches to iroh-quinn and iroh itself, everything should now work on OpenBSD, FreeBSD, and NetBSD. This support is quite new, and we might have missed something, if so please be sure to file an issue to let us know. Checkout PR #2311 for details. 🔎 Better DNS resolution DNS is hard, and while things were working, they could always work better. In this release, we improved timeouts and strategies for DNS resolution to ensure swift and correct resolution of DNS records when needed. Checkout PR #2313 and PR #2301 for details. 🪦 The MagicEndpoint is dead, long live the Endpoint Fun names are great, but sometimes they get in the way, and while we all loved MagicEndpoint as a name, it just became too long. So now it is called just Endpoint, short and to the point. But don't worry; it is still as magical as ever under the hood, I promise! Checkout the PR #2287 for details. 🤯 WASM Phase 0 We want to support browsers and other WASM-compatible targets sooner rather than later, so the first small step was done: ensuring that iroh-base compiles for the WASM target. Checkout the PR #2305 for details. 🤨 iroh-perf - Some Good and Some Bad News Measuring things is crucial for performance, but sometimes those measurements do not reveal what you want. Starting with the bad news, iroh is not as fast as we would like it to be. More specifically, it reduces throughput more than we thought it had, compared to using just quinn. TransportThroughput (MiB/s)Quinn@0.10 (MacOS)358.88iroh-net (MacOS)187.31Quinn@0.10 (Linux)1030.50iroh-net (Linux)884.75 The good news is that we have a new testing tool, iroh-perf, which makes it much easier to get these numbers. We can now roll up our sleeves and get to work on fixing the performance. Checkout the PR #2186 for details. ⚠️ Breaking Changes MSRV increased to 1.76 Protocol Changes None! API Changes iroh added client::Docs::import_namespace client::Docs::import_and_subscribe LiveEvent::PendingContentReady client::Authors::default client::Authors::set_default util::path::IrohPaths::DefaultAuthor removed node::Node::subscribe node::Event renamed node::Node::magic_endpoint -> node::Node::endpoint iroh-net renamed magic_endpoint → endpoint magic_endpoint::MagicEndpoint -> endpoint::Endpoint magic_endpoint::MagicEndpointBuilder -> endpoint::Builder added endpoint::Builder::proxy_url endpoint::Builder::proxy_from_env relay::http::ClientError::Proxy endpoint::Endpoint::watch_home_relay moved dns::node_info::lookup_by_domain → ResolverExt::lookup_by_domain But wait, there's more! Many bugs were squashed, and smaller features were added. For all those details, check out the full changelog: https://github.com/n0-computer/iroh/releases/tag/v0.17.0. Want to know what is coming up, check out the 0.18.0 milestone. Do you have any wishes? Let us know about it in the issues! And to keep up with all things iroh, check out our Twitter.Iroh is a dial-any-device networking library that just works. Compose from an ecosystem of ready-made protocols to get the features you need, or go fully custom on a clean abstraction over dumb pipes. Iroh is open source, and already running in production on hundreds of thousands of devices.To get started, take a look at our docs, dive directly into the code, or chat with us in our discord channel.'''
