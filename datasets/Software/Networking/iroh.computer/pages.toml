full_description = '''less net work for networksIroh is a library for building on direct connections between devices, putting more control in the hands of your users.Start NowDocumentation .text { fill: #7c7cf7; font-family: SpaceMono-Regular, 'Space Mono'; font-size: 12.59px; letter-spacing: .1em; } .devices-light-2 { stroke: #3C3C3C; fill: none; stroke-miterlimit: 10px; } .devices-light-3 { stroke: #9494f7; fill: none; stroke-width: 1px; } .devices-light-4 { fill: #9494f7; } DIRECTDIRECTRELAYDIRECT .text { fill: #7c7cf7; font-family: SpaceMono-Regular, 'Space Mono'; font-size: 12.59px; letter-spacing: .1em; } .devices-2 { stroke: #9494F7; } .devices-2, .devices-3 { fill: none; stroke-miterlimit: 10; } .devices-3 { stroke: #f8f8f8; } .devices-4 { fill: #282828; } .devices-4, .devices-5 { stroke-width: 0px; } .devices-5 { fill: #9494F7; } DIRECTDIRECTRELAYDIRECTConnect any two devices on the planetIroh gives you an API for dialing by public key. You say “connect to that phone”, iroh will find & maintain the fastest connection for you, regardless of where it is.“In stark contrast to other p2p & dweb technologies we've played with - which are exciting due to their implications for the future - Iroh brought instant gains in our present."- weird.oneCompose your own tailor-made protocol stackAn ecosystem of ready-made, composable protocols are built on top of iroh. Mix & match to get the feature set you need.BlobsResumable, verifiable data transferGossipBroadcast messages to groups of nodes by topic.DocumentsRealtime, multiwriter, key-value syncBrowse all protocols.wrench-code-dark-1,.wrench-code-dark-2{fill:none;stroke:#3b3b3b;}.wrench-code-dark-2{stroke-miterlimit:10;}.wrench-code-light-1{stroke-miterlimit:10;}.wrench-code-light-1,.wrench-code-light-2{fill:none;stroke:#f8f8f8;}Build your own protocolDon't see a protocol you need? Build your own! Iroh gives you a reliable foundation for building distributed systems that reach the edge. The rest is up to you.Protocol DocsContinuously MeasuredAll commits to iroh's main branch run through a growing set of simulations & testsIroh Perf SiteReal World UseIroh is running in production on hundreds of thousands of devices, on all major platforms.Delta ChatIroh powers multi-device backup & live connections for in-chat WebXDC appsBuild in your languageIroh supports a growing set of languages, embedding nodes directly in your project without any need to call out to an external APIStart Buildinghellonodejsrustswiftimport { argv } from 'process' import { Iroh, BlobTicket } from '@number0/iroh' // serve & fetch data with iroh, from any two devices in the world // run this example from any two computers, and iroh will connect them! (async () => { // create a new node with default protocols const node = await Iroh.memory(); // Choose between client & server roles based on the presence of a download CLI argument if (argv.length > 2) { // we have a download argument. Fetch some data! let ticket = BlobTicket.fromString(argv[2]); console.log(`fetching hash '${ticket.hash}' from node: '${ticket.nodeAddr.nodeId.toString()};`); // download the data await node.blobs.download(ticket.hash, ticket.asDownloadOptions(), (_err) => {}); // read the data const data = await node.blobs.readToBytes(ticket.hash); console.log("data:", new TextDecoder().decode(new Uint8Array(data))); } else { // no download argument. Serve some data that says "Hello, world!" const data = Array.from(new TextEncoder().encode('Hello, World!')); const result = await node.blobs.addBytes(data); // create a "ticket" for sharing data with another node const ticket = await node.blobs.share(result.hash, result.format, 'RelayAndAddresses'); console.log(`server running. in another terminal run:\n\nnode hello.js ${ticket.toString()}`); // wait for ctrl+c await new Promise((resolve) => { process.on('SIGINT', () => { resolve() }); setInterval(() => {}, 1000); }); process.exit(); } })(); CopyCopied!From the BlogJanuary 15, 2025iroh 0.31.0 - Back At Fighting FitIroh 0.31 releaseRead PostDecember 17, 2024iroh 0.30.0 - Slimming DownIroh 0.30 releaseRead Post'''
