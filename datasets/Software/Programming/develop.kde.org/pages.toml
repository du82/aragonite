["https://develop.kde.org/docs/features/configuration/kconfig_xt"]
title = "Using KConfig XT | Developer"
description = "This tutorial introduces the main concepts of the KConfigXT configuration framework and shows how to efficiently use it in applications."
full_description = '''DocumentationFeaturesConfigurationUsing KConfig XTUsing KConfig XTThis tutorial introduces the main concepts of the KConfigXT configuration framework and shows how to efficiently use it in applications.KConfigXT generates a C++ class for your configuration based on an XML description of the config schema. This allows to have a single source of truth for the configuration structure and helps avoiding common issues such as misspelled configuration keys.The .kcfg fileA .kcfg file is an XML file describing the configuration keys for your application. Let's create a .kcfg file with a single group and a few entries.<?xml version="1.0" encoding="UTF-8"?> <kcfg xmlns="http://www.kde.org/standards/kcfg/1.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.kde.org/standards/kcfg/1.0 http://www.kde.org/standards/kcfg/1.0/kcfg.xsd" > <group name="General"> <entry name="SplitterSizes" type="IntList"> <label>How the main window is divided.</label> </entry> <entry name="Width" type="Int"> <label>Width of the main window.</label> <default>600</default> </entry> <entry name="Platform" type="Enum"> <label>Last operating system used.</label> <choices> <choice name="Linux"> <label>Linux</label> </choice> <choice name="FreeBSD"> <label>FreeBSD</label> </choice> <choice name="Windows"> <label>Windows</label> </choice> </choices> <default>0</default> <!-- Linux --> </entry> </group> </kcfg>The first entry, SplitterSizes, will store the sizes of the application's QSplitter widgets. The second entry, Width, will store the width of the main window. The last entry, Platform, will store the last operating system used, this is an enum, and the value can be either Linux, FreeBSD or Windows.The individual entries must have at least a name or a key attribute. The key is used as the key in the config file. The name is used to create accessor and modifier functions. If key is not given, the name is used as the key in the config file. If key is given, but not name, the name is constructed by removing all spaces from the key.All entries have a type. The supported basic types are: String, Url, StringList, Font, Rect, Size, Color, Point, Int, UInt, Bool, Double, DateTime, Int64, UInt64 and Password. Besides those basic types the following special types are supported:Path: This is a string that is specially treated as a file-path. In particular paths in the home directory are prefixed with $HOME when being stored in the configuration file.Enum: This indicates an enumeration. The possible enum values should be provided via the <choices> tag. Enum values are accessed as integers by the application but stored as literal strings in the configuration file. This makes it possible to add more values at a later date without breaking compatibility. The value attribute is used to control the string representation of the choice tag.IntList: This indicates a list of integers. This information is provided to the application as QList<int>. Useful for storing QSplitter geometries for example.PathList: List of Path elements.Color: isn't a special type but has special input. It is generated as QColor. Any valid input to QColor(QString) can be used (hex or SVG keyword notation) as well as the special format "r,g,b,a" (where "a" denotes the alpha channel and may be omitted).It is recommended to always add <label> and <tooltip> tags to your entries in which you describe the configuration options. The <label> tag is used for short descriptions of the entry, while <tooltip> contains more verbose documentation. It's important for tools like KConfigEditor (now unmaintained) which can be used by systems administrators to setup machines over remotely. Note that these tags will be ignored unless you provide SetUserTexts=true option in your .kcfgc file (see section on it below).The <min> and <max> tags can be used to set the lower and upper limits (inclusive) to the value of integral type options, respectively.You can also add an <emit> tag, if you want to specify the signal to emit when the property changes.An entry can optionally have a default value which is used when the value isn't specified in any config file. Default values are interpreted as literal constant values. A default value can be either an enum value or the index of an enum.Compute the default valueSometimes it is useful to dynamically compute a default value from a C++ expression. This can be done by adding the code="true" attribute to the <default> tag. Please be aware that that any default value set this way will be not be persisted by the configuration system and is recomputed each time the generated settings class is instantiated (even if a different configuration value has been set).In addition, the code inside of a default tag will be used as parameter of a function call, so this is a valid code for the default tag:<default code="true"> true </default>while this is not:<default code="true"> return true </default>If you need to do calculations on the default, you can use the fact that a lambda in C++ will can be defined and evaluated at the same time, you should also keep in mind that this code is running on the constructor, so you can’t rely on other default values.<default code="true"> [this] { int someValue = OtherLibrary::precalculate(); if (someValue % 2 == 0) { return "Even"; } return "Odd"; } () </default>In case you need to import a C++ header to compute the default value, you can add an <include> tag to the .kcfg file which contains the header file that is needed. Note that more than one <include> tag can be used as needed.Additional code for computing default values can be provided via the <code> tag. The content of the <code> tag is inserted as-is. A typical use for this, is to compute a common default value which can then be referenced by subsequent entries.Using variables inside of the Configuration DefinitionSometimes you want to create logic that's reusable inside of different groups, supergroups, or to handle defaults. You can define variables that are passed via the constructor of the Configuration.<kcfg> <kcfgfile name="rc_file_for_the_setting"> <parameter name="masterGroup"/> </kcfgfile> <group name="Global" parentGroupName="$(masterGroup)"> <entry> ... </entry> </group> </kcfg>This will generate a code that can be used like this:auto *settings = new Settings("MyMasterGroup");And the stored file on disk will have the MyMasterGroupThe .kcfgc filesThe behavior of KConfigXT is controlled by a .kcfgc file.File=config.kcfg ClassName=Config Mutators=true DefaultValueGetters=true Singleton=trueThe first line File=config.kcfg specifies where the configuration options for your application are stored.The second line ClassName=YourConfigClassName specifies the name of the class that will be generated from the .kcfg file. Save this file under yourconfigclassname.kcfgc. This will result in the yourconfigclassname.{h,cpp} files being generated.NoteKConfigXT offers a variety of options. The full list can be seen in the kconfig_compiler documentation.Adjusting the CMakeLists.txt fileTo use KConfigXT in a CMake project use the kconfig_add_kcfg_files function.add_executable(<target name> [source files]) kconfig_add_kcfg_files(<target name> settings.kcfgc)orkconfig_add_kcfg_files(<project name>_SRCS settings.kcfgc)Since version 5.67 a target based variant is available:Use the GENERATE_MOC option when using signals in your kcfg files. This is the case for example you want to have your setting exposed to QML and setting GenerateProperties to true.kconfig_add_kcfg_files(<project name>_SRCS GENERATE_MOC settings.kcfgc)Reading and setting valuesC++To access our kcfg file, we must instantiate the class generated by the kcfgc file. Remember to do this with the classname provided in the kcfgc file.#include "config.h" ... auto config = Config::self();Our kcfgc file automatically generates getter and setter functions for each entry in our kcfg file. These functions use the names of the entries that we have created, according to their name or key attributes in their <entry> tags. These functions are in camelCase.Using these functions is as simple as you might expect:auto config = Config::self(); int currentWidth = config->width(); if(currentWidth != 720) config->setWidth(720);QMLTo access our configuration files in QML we must first add GenerateProperties=true to our .kcfgc file, and register our Config class as a singleton in our application's QML engine.auto config = Config::self(); qmlRegisterSingletonInstance("org.kde.myapp.private", 1, 0, "Config", config);Our config class will now be instance throughout our QML as Config. All of our entries in our kcfg are accessible as members of this instance. Setting them and getting them is as you would expect with any other object (again, these members are in camelCase).import org.kde.myapp.private 1.0 Kirigami.ApplicationWindow { width: Config.width onWidthChanged { Config.width = applicationWindow().width } }Managed Config Module (KCM)If you want to develop a KCM, that uses KConfigXT, you shouldn't use a singleton config instance. Instead, you should make it a part of your ManagedConfigModule class and make it accept parent argument.To do this, you first need to tweak you .kcfgc file:# my_config.kcfg File=my_config.kcfg NameSpace=My ClassName=Config Mutators=true ParentInConstructor=true GenerateProperties=trueNotice the ParentInConstructor=true --- this option allows generating a Config class, that takes an optional QObject *parent argument. This allows your ManagedConfigModule to watch changes in the KCM: once you change something using controls on the QML side, KCM will indicate, that the changes were made, and will offer you to save or reset them.NoteParentInConstructor=true is incompatible with the Singleton=true.Do not forget, that to make changes you need setters and properties in Config class, that are generated using Mutators=true and GenerateProperties=true options.To expose your config to QML side of the KCM, you need to make it a constant Q_PROPERTY with read access.// mykcm.h #pragma once #include <KQuickAddons/ManagedConfigModule> // This should be a class generated by kcfgc #include "my_config.h" class MyKcm : public KQuickAddons::ManagedConfigModule { Q_OBJECT Q_PROPERTY(My::Config *config READ config CONSTANT) public: MyKcm(QObject *parent, const QVariantList &args); My::Config *config() const; private: My::Config *m_config; };Instead of registering singleton, you must use qmlRegisterAnonymousType here.// mykcm.cpp #include "mykcm.h" #include "my_config.h" // ... K_PLUGIN_CLASS_WITH_JSON(MyKcm, "metadata.json") MyKcm::MyKcm(QObject *parent, const QVariantList &args) : KQuickAddons::ManagedConfigModule(parent, args), m_config(new My::Config(this)) { // ... qmlRegisterAnonymousType<My::Config>("org.kde.mykcm.private", 1); // ... } My::Config *MyKcm::config() const { return m_config; } #include "mykcm.moc"Now you can access all your defined configuration using kcm property of any type, that inherits from AbstractKCM.import org.kde.kcm 1.5 as KCM import QtQuick.Controls 2.12 as QQC2 KCM.SimpleKCM { // ... QQC2.SpinBox { value: kcm.config.width onValueModified: kcm.config.width = value } // ... }Additionally, you can use SettingStateBinding in your QML code to display correctly if your setting is immutable or isn't using the default value anymore.import org.kde.kcm 1.5 as KCM import QtQuick.Controls 2.12 as QQC2 KCM.SimpleKCM { // ... QQC2.SpinBox { value: kcm.config.width onValueModified: kcm.config.width = value KCM.SettingStateBinding { configObject: kcm.config settingName: "width" } } // ... }PreviousIntroduction to KConfigNextKDE Frameworks 6 porting guide'''
year_published = 2024
year_updated = 2024
