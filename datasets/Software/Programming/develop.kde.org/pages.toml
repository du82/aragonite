["https://develop.kde.org/it"]
title = ""
full_description = "KPiattaforma di sviluppo di KDEProgetta, compila e distribuisci con le tecnologie di KDE delle applicazioni magnifiche e usabili.ProgettazioneScopri le linee guida di KDE per la progettazione di applicazioni e di iconeSviluppoScopri gli strumenti e le librerie che ti aiutano a creare dei programmi KDEDistribuisciMetti la tua applicazione di fronte agli utentiMulti piattaformaSviluppa una volta, distribuisci ovunque. Costruite sopra Qt, le tecnologie di KDE funzionano su tutte le piattaforme.Desktop Linux, Android, Windows, macOS, incorporato e altro KDE Frameworks: migliora l'esperienza con QtKDE Frameworks copre 80 librerie di componenti aggiuntivi per programmare con Qt. Tutte le librerie sono state accuratamente testate per gli scenari del mondo reale, e sono state documentate in modo completo. Le librerie di KDE sono distribuite con licenza LGPL o MIT.Ulteriori informazioniKFramework per l'interfaccia grafica con KirigamiKirigamiCostruisci magnifici programmi convergenti che funzionano su telefoni, TV e su tutto quello che c'è in mezzo.La divisione tra desktop e mobile si sta assottigliando e gli utenti si aspettano la stessa esperienza di qualità su ogni dispositivo. Le applicazioni che utilizzano Kirigami si adattano in maniera brillante ai sistemi mobili, ai desktop, alle TV, ai sistemi di infotainment e a tutte le sfumature intermedie.I componenti di Kirigami sono gradevoli alla vista e coerenti, inoltre Kirigami stesso mette a disposizione un flusso di lavoro definito chiaramente. Gli utenti dei programmi in Kirigami apprezzeranno le scelte intelligenti fatte nell'interfaccia e la progettazione ordinata.Scopri KirigamiKDevelopUn IDE multi-piattaforma per C, C++, Python, QML/JavaScript e PHPOpen source, potente e veloce, KDevelop offre un ambiente semplice ai programmatori che lavorano su progetti di qualsiasi dimensione. KDevelop ti aiuta a completare il lavoro senza darti fastidio.Ottieni KDevelopDocumentazioneDai principianti agli sviluppatori esperti con Qt, qui trovi tutto quello di cui hai bisogno per iniziare a sviluppare le applicazioni di KDE.Primi passiImpara le basi e crea la tua prima applicazione KDEKirigamiCostruisci magnifici programmi convergenti che funzionano su telefoni, TV e su tutto quello che c'è in mezzo."
