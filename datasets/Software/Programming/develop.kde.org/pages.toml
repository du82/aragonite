title = ""
full_description = "KEvoluigista Platformo de KDEDezajnu, konstruu kaj distribuu belajn, uzeblajn aplikaĵon kun teknologioj de KDE.DezajnoEksciu pri la dezajn-gvidlinioj de KDE por apoj kaj piktogramojEvoluigiPritaksu la ilojn kaj bibliotekojn kiuj helpas vin konstrui KDE-apojnDistribuiMetu vian aplikaĵon antaŭ uzantojPlur-PlatformaEvoligu unufoje, disponigu ĉie. Konstruitaj surbaze de Qt, la teknologioj de KDE funkcias en ĉiu platformo.Labortabla Linux, Android, Windows, macOS, enkorpigita kaj pli KDE Frameworks: Plibonigu la Sperton pri QtKDE Frameworks kovras 80 aldonajn bibliotekojn por programado kun Qt. Ĉiuj bibliotekoj estis bone testitaj en realmondaj scenaroj kaj estas amplekse dokumentitaj. La bibliotekoj de KDE estas distribuitaj sub LGPL- aŭ MIT-licencoj.Lerni pliKKirigami UI FrameworkKirigamiKonstruu Belajn, Konverĝajn Apojn, kiuj Funkcias per Telefonoj, Televiloj kaj Ĉio Intere.La divido inter labortablo kaj poŝtelefono malklariĝas kaj uzantoj atendas la samkvalitan sperton sur ĉiu aparato. Aplikoj uzantaj Kirigami adaptiĝas brile al poŝtelefono, labortablo, televidiloj, informsistemoj kaj ĉio inter ili.La komponantoj de Kirigami estas belaspektaj kaj konsekvencaj, kaj Kirigami mem provizas klare difinitan laborfluon. Uzantoj de Kirigami-aplikoj aprezos la inteligentajn elektojn faritajn en la API kaj serena dezajno.Malkovru KirigamiKDevelopTransplatforma IDE por C, C++, Python, QML/JavaScript kaj PHPMalfermfonta, potenca kaj rapida, KDevelop ofertas senjuntan evolumedion al programistoj kiuj laboras pri projektoj de ajna grandeco. KDevelop helpas vin plenumi la taskon dum ĝi ne altrudas sin en via labormaniero.Ekprenu KDevelopDokumentaroDe komencantoj ĝis spertaj programistoj de Qt, jen ĉio, kion vi bezonos scii por komenci disvolvi KDE-aplikaĵojn.Getting StartedLearn the basics and create your first KDE applicationKirigamiKonstruu Belajn, Konverĝajn Apojn, kiuj Funkcias per Telefonoj, Televiloj kaj Ĉio Intere."
