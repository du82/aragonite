full_description = "KPlataforma de desenvolupadors del KDEDissenyeu, construïu i distribuïu aplicacions belles i usables amb les tecnologies del KDE.DissenyAprendre sobre les directrius de disseny del KDE per a les aplicacions i iconesDesenvolupamentConsulteu les eines i biblioteques que us ajuden a construir les aplicacions KDEDistribucióFeu que la vostra aplicació arribi als usuarisMultiplataformaDesenvolupeu una vegada i que funcioni arreu. Construïda damunt de les Qt, les tecnologies del KDE funcionen sobre cada plataforma.Escriptori Linux, Android, Windows, macOS, incrustat i molt més Frameworks del KDE: Millora l'experiència de les QtEls Frameworks del KDE cobreixen 80 biblioteques de complements per a la programació amb les Qt. Totes les biblioteques han estat ben provades en escenaris del món real i estan completament documentades. Les biblioteques del KDE es distribueixen sota les llicències LGPL o MIT.Apreneu-ne mésKMarc de treball IU en KirigamiKirigamiConstruïu aplicacions boniques i convergents que funcionin en els telèfons, televisors i tot el que hi ha entre ells.La línia entre l'escriptori i el mòbil està desdibuixada, i els usuaris esperen la mateixa experiència de qualitat en cada dispositiu. Les aplicacions que empren Kirigami s'adapten brillantment als mòbils, escriptoris, televisors, sistemes d'informació i tot el que hi ha entre ells.Els components de Kirigami són bons i coherents, i el Kirigami mateix proporciona un flux de treball definit amb claredat. Els usuaris de les aplicacions en Kirigami apreciaran les opcions intel·ligents realitzades a l'API i el disseny adequat.Descobriu el KirigamiKDevelopUn IDE multiplataforma per a C, C++, Python, QML/JavaScript i PHPCodi obert, potent i ràpid, el KDevelop ofereix un entorn de desenvolupament sense fissures als programadors que treballen en projectes de qualsevol mida. El KDevelop us ajudarà a fer la feina mentre resta fora del vostre camí.Obteniu el KDevelopDocumentacióDes dels principiants fins