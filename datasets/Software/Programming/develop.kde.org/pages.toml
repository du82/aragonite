description = """
La KDE Hom-Interfacaj Gvidlinioj (HIG) ofertas al dizajnistoj kaj programistoj aron da rekomendoj por produkti belajn, uzeblajn kaj konsekvencajn uzantinterfacojn por konverĝaj labortablaj kaj moveblaj aplikoj kaj laborspacaj fenestraĵoj. Nia celo estas plibonigi la sperton por uzantoj farante konsekvencajn interfacojn por labortablo, poŝtelefono kaj ĉio intere, pli konsekvencajn, intuiciajn kaj lerneblajn.
Nia desegna vizio temigas du atributojn de KDE-programaro, kiuj konektas ĝian estontecon al sia historio:
Simpla defaŭlte, potenca kiam bezonate. Design determines how well something fulfills its functional purpose and how enjoyable it is to interact with. If either is lacking, the result will be frustrating. People won't want to use a poorly-designed app, and if forced to, they'll be resentful and spread negativity about it. Avoid this through good design!"""
