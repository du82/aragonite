["https://develop.kde.org/hig/accessibility"]
title = "Accessibility and inclusiveness | Developer"
description = """
Accessibility Following this guide will give you an app that's already quite accessible. Nonetheless, it's important to test your app in a way that simulates sensitivities or impairments you may not possess yourself. Use the following techniques:
Keyboard Unplug your mouse or disable your touchpad and attempt to interact with every UI element solely with the keyboard. Make sure the item with default focus makes sense, and each item with active focus looks visibly different from selected items in inactive views. Make sure no truly important text is only seen in a hover tooltip."""
full_description = '''KDE Human Interface GuidelinesAccessibility and inclusivenessAccessibility and inclusivenessAccessibilityFollowing this guide will give you an app that's already quite accessible. Nonetheless, it's important to test your app in a way that simulates sensitivities or impairments you may not possess yourself. Use the following techniques:KeyboardUnplug your mouse or disable your touchpad and attempt to interact with every UI element solely with the keyboard. Make sure the item with default focus makes sense, and each item with active focus looks visibly different from selected items in inactive views. Make sure no truly important text is only seen in a hover tooltip.Name items in such a manner that the distinctive parts come first, so they are easier to select with the keyboard. For example, in a list of countries on continents, write "Germany (Europe)" instead of "Europe/Germany".Pointing deviceUnplug or don't use your keyboard, and attempt to interact with every UI element solely with left-clicks from a pointing device and the virtual keyboard. Verify that all drag-and-drops show a preview of the dragged item and either succeed or show the “can't drag here” cursor.TouchscreenIf you have a touch-capable device, try using it exclusively. Verify that everything works and that the virtual keyboard appears only at the right times. Verify that hover tooltips also appear on press-and-hold.ColorChange the system-wide color scheme to something other than what you regularly use to verify that everything adapts as expected.Text sizeIncrease the system-wide font size to 14 and verify that visual relationships are preserved and text doesn't get cut off.AudioUnplug or mute your speakers and verify that no information is only communicated via audio.Screen ReaderTurn off your screen and attempt to use the app with the Orca screen reader. It should say something intelligible and distinct for all elements. For GUI elements, it should say the label and type, e.g.: “File, Menu” or “Create New Folder, Button”. Verify that all tooltip text is read by the screen reader via the Accessible attached properties and that no labels are used more than once in the same window.AnimationsGlobally disable animations and verify that all animated UI elements either transition instantly (e.g. for a pushing a new page) or display a static image (e.g. for a loading spinner). Avoid blinking UI elements other than the text insertion point.See the Qt accessibility documentation for more information.InclusivenessBeing accessible is not enough; your app must also feel inclusive to avoid turning away potential users.As with accessibility, following this guide will already give you an app that's quite inclusive. But there are a few more things to keep in mind as well.AssumptionsAvoid implicit references to or assumptions about the user with respect to:Physical abilitiesAgeGender or sexual orientationEthnicity or national originMode of livingLife experiencesLevel of educationReligious, political, or philosophical viewsEconomic resourcesLevel of technical skillEtc.Negative languagePrefer neutral language over language referencing death, violence, crime, prejudice, stereotypes, or evil history. For example:Kill → CloseExecute → RunAbort → ExitFatal → Critical, majorEnd of life → End of supportForce → RequireIllegal → UnauthorizedCrippled, gimped → Broken, nonfunctionalSlave → Worker, jobWiped out → ClearedPreviousIcons'''
year_published = 2025
year_updated = 2025
