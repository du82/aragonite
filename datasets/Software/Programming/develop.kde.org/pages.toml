title = ""
full_description = "KKDE 開發者平台使用 KDE 科技來設計、製作並發佈漂亮且好用的應用程式。設計瞭解關於 KDE 對應用程式與圖示的設計準則開發查看幫助您製作 KDE 應用程式的工具與函式庫發佈將您的應用程式提供給使用者多平台開發一次，部署到所有地方。建基於 Qt 上的 KDE 科技在所有平台上都能運作。桌面 Linux、Android、Windows、macOS、嵌入式環境等等 KDE Frameworks：強化 Qt 體驗KDE Frameworks 包含 80 個 Qt 程式可以使用的擴充函式庫。這些函式庫全部皆在現實情境下經過良好的測試，並且有非常完整的說明文件。KDE 的函式庫以 LGPL 或 MIT 授權條款釋出。了解更多KKirigami UI 框架Kirigami建構能夠在手機、電視和任何大小介於其間的裝置上運作且好看的響應式應用程式。桌面與手機的界限變得越來越模糊，而使用者期待在每個裝置上都有同樣的高品質體驗。使用 Kirigami 的應用程式會很好地適應到手機、桌面、電視、資訊娛樂系統及其他等等不同環境。Kirigami 的部件外觀良好且具有一致性，且 Kirigami 自身也提供清楚定義好的工作流程。Kirigami 應用程式的使用者會感謝 API 中做的聰明決定以及乾淨的設計。探索 KirigamiKDevelop一個支援 C、C++、Python、QML/JavaScript 與 PHP 的跨平台整合開發環境開源、功能強大且快速。KDevelop 提供能夠處理任何專案大小的無縫開發環境。KDevelop 幫助您做好您的工作而不阻礙您。取得 KDevelop說明文件不論您是初心者還是富有經驗的 Qt 開發者，在此有您要開始開發 KDE 應用程式的所有資訊。Getting StartedLearn the basics and create your first KDE applicationKirigami建構能夠在手機、電視和任何大小介於其間的裝置上運作且好看的響應式應用程式。"
