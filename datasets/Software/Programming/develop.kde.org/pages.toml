title = ""
full_description = "KPlatforma programistyczna KDEProjektuj, buduj i rozpowszechniaj ładne i użyteczne aplikacje w technologii KDE.ProjektDowiedz się o wytycznych projektowania KDE dla aplikacji i ikonRozwójSprawdź narzędzia i biblioteki, które pomogą ci w budowaniu aplikacji KDERozmieśćUmieść swoją aplikację przed użytkownikamiWieloplatformoweOpracuj raz, wykorzystaj wszędzie. Buduj na podstawie technologi Qt oraz KDE, które działają na każdej platformie.Pulpit Linuksa, Android, Windows, macOS, osadzone oraz więcej Szkielety KDE: Podnoszą wrażenia z używania QtSzkielety KDE stanowi 80 bibliotek-dodatków do programowania w Qt. Wszystkie biblioteki zostały dobrze wypróbowane w świecie rzeczywistym i są szczegółowo opisane. Biblioteki KDE są rozpowszechniane na licencjach LGPL oraz MIT.Dowiedz się więcejKSzkielet interfejsów KirigamiKirigamiBuduj ładne, wieloplatformowe aplikacje, które działają na telefonach, telewizorach i wszystkim pomiędzy.Granica pomiędzy urządzeniami biurkowymi i przenośnymi się zaciera, a użytkownicy oczekują wrażeń tej samej jakości na każdym urządzeniu. Aplikacje używające Kirigami dostosowują się doskonale do urządzeń biurkowych, przenośnych, telewizorów, systemów rozrywki i wszystkiego pomiędzy.Składnik Kirigami są dobrze wyglądające i spójne, a samo Kirigami daje schludnie określony obieg pracy. Użytkownicy aplikacji Kirigami docenią sprytne wybory dokonane w API i jej przejrzysty projekt.Odkryj KirigamiKDevelopWieloplatformowe IDE dla C, C++, Python, QML/JavaScript oraz PHPOtwarty kod, rozbudowany i szybki, KDevelop daje programistom środowisko do programowania, które działa na projektach o dowolnym rozmiarze. KDevelop pomaga wykonywać pracę, nie stojąc przy tym na drodze.Pobierz KDevelopDokumentacjaOd początkujących do doświadczonych programistów Qt, tutaj znajduje się wszystko, czego potrzebujesz, aby zacząć rozwijać aplikacje dla KDE.Getting StartedLearn the basics and create your first KDE applicationKirigamiBuduj ładne, wieloplatform