["https://develop.kde.org/uk"]
title = ""
full_description = "KПлатформа розробників KDEКомпонуйте, збирайте і розповсюджуйте красиві і корисні програми з використанням технологій KDE.ДизайнВивчіть настанови щодо дизайну програм та піктограм KDEРозробкаОзнайомтеся з інструментами та бібліотеками, які допоможуть вам будувати програми KDEПоширенняПокажіть вашу програму користувачамБагатоплатфомовістьЄдиний процес розробки для усіх платформ одразу. Побудовані на основі Qt, технології KDE працюють на усіх програмних платформах.Робочі станції на основі Linux, Android, Windows, macOS, вбудовані системи тощо KDE Frameworks: розширення спектра QtKDE Frameworks складається з 80 додаткових бібліотек для програмування з використанням Qt. Усі бібліотеки ретельно перевірено у сценаріях з реального життя і повністю документовано. Розповсюдження бібліотек KDE відбувається за умов ліцензування LGPL або MIT.Дізнатись більшеKБібліотека інтерфейсу KirigamiKirigamiБудуйте красиві однорідні програми, які працюватимуть на телефонах, телевізорах та усіх проміжних пристроях.Межа між робочою станцією та мобільним пристроєм розмивається — користувачі очікують однакової якості користування на будь-якому пристрої. Програми, у яких використано Kirigami, чудово підлаштовуються до мобільних пристроїв, робочих станцій, телевізорів, систем інформування та розваг та будь-яких проміжних пристроїв.Компоненти Kirigami виглядають добре і однорідно, сама Kirigami використовує точно визначені робочі процедури. Користувачів програм Kirigami оцінять продуманий вибір у програмних інтерфейсах та незахаращений дизайн.Знайомимося з KirigamiKDevelopКомплексне середовище розробки мовами C, C++, Python, QML/JavaScript і PHP, яке може працювати на багатьох програмних платформахПотужна і швидка, з відкритим кодом KDevelop пропонує вам самодостатнє середовище розробки для програмістів, які працюють із проєктами будь-якого розміру. KDevelop допоможе вам виконати роботу, не заважаючи вам ні у чому.Отримати KDevelopДокументаціяВід початківців до досвідчених розробників на Qt — тут є усе, що знадобиться вам для того, щоб почати розробку програм KDE.Початкові зауваженняВивчіть основи і створіть вашу першу програму KDEKirigamiБудуйте красиві однорідні програми, які працюватимуть на телефонах, телевізорах та усіх проміжних пристроях."
