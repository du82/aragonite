["https://develop.kde.org/ca/docs/getting-started/kirigami"]
title = "Com començar amb el Kirigami |"
description = "Aprenent a crear les vostres primeres aplicacions amb el Kirigami"
full_description = "DocsKirigamiCom començar amb el KirigamiAprenent a crear les vostres primeres aplicacions amb el KirigamiAquesta guia d'aprenentatge us guiarà a través del procés de creació de la vostra pròpia aplicació convergent emprant el marc de treball Kirigami. Una aplicació convergent, en aquest context, vol dir que les persones poden utilitzar el programa amb facilitat independentment del dispositiu en el qual s'estigui executant. Si està en un ordinador d'escriptori, s'adaptarà a una pantalla gran amb un ratolí i teclat. Si està en un dispositiu mòbil, acceptarà l'entrada d'una pantalla tàctil i s'adaptarà a una pantalla vertical més petita. I així successivament.El Kirigami està construït sobre el llenguatge QML i els components Qt Quick Controls 2 proporcionats pel projecte Qt. El QML té integrada la implementació de sistemes tàctils, el qual el fa ideal per a aplicacions mòbils. Els components Qt Quick són elements visuals reutilitzables que podem utilitzar en crear les interfícies de les aplicacions. El Kirigami és un conjunt de components Qt Quick dissenyats per a crear aplicacions convergents.Si bé fareu servir QML per a crear la part visual de la vostra aplicació, la lògica empresarial, el codi que fa la feina pesada de la funcionalitat de l'aplicació, s'hauria d'escriure en un llenguatge diferent. També explorarem com integrar la nostra lògica empresarial amb la nostra interfície d'usuari en les guies d'aprenentatge següents.En primer lloc, caldrà establir un projecte nou en un llenguatge de la vostra elecció. La introducció us mostrarà com fer una aplicació petita però funcional del Kirigami.Se us mostraran els conceptes bàsics de com tractar els colors i el text a la vostra aplicació, i us familiaritzareu amb la majoria dels components del QML. A continuació, us familiaritzareu amb la majoria dels components del QML que potser voldreu utilitzar i com es veuen. Aquesta secció no tocarà cap lògica empresarial en absolut, només el codi QML.Us endinsareu en temes més avançats que tenen a veure amb la manipulació de les dades que es mostraran en el vostre programa.Finalment, se us presentarà Kirigami Addons, una sèrie de components de qualitat de vida que podeu utilitzar per, entre altres coses, dissenyar la Configuració de la vostra aplicació.ConfiguracióEl Kirigami amb C++Preparant-nos per a crear la nostra primera aplicació escrita amb el KirigamiIntroduccióExplicar les pàginesPàgines que permeten organitzar el contingut de la vostra aplicacióDisposicions (Layout), vistes de llista (ListView) i targetes (Card)Descobrint les formes diferents de col·locar les coses en una pàginaAfegir accionsAprendre més sobre les Kirigami Actions ens ajudarà a fer que la nostra aplicació sigui més útil.Afegir un diàlegAbordar a fons els diàlegs del Kirigami.Utilitzar fitxers separats en un projecte C++Separar el codi difícil de gestionar en diferents fitxers, i adjuntar senyals als components.Passos següentsQuè fer una vegada finalitzada la primera aplicació senzilla escrita amb el KirigamiEstilColors i temes creats amb el KirigamiFent que la vostra aplicació segueixi l'esquema de color de l'usuariTipografiaDissenyar el contingutComponentsAccions basades en els componentsLes Kirigami Actions s'utilitzen per a afegir funcionalitat als components.Files de pàgines i piles de pàginesAfegint flux a la vostra aplicació: afegir, eliminar i substituir pàgines de maneres diferentsPàgines desplaçables i vistes de llistaLes pàgines desplaçables són útils quan es combinen amb components verticals o dinàmics com les vistes de llista.Targetes (Card)Una targeta serveix com a una descripció general i punt d'entrada per a obtenir informació més detallada, i pot oferir accés directe a les accions més importants d'un element.Calaixos (drawers)Els calaixos proporcionen aplicacions amb accés ràpid als controls i les pàgines de la vostra aplicació.ChipsEls chips són elements petits que s'utilitzen normalment per a llistar les propietats relacionades.Tipus de diàlegsDiverses maneres de servir i introduir dades.Controls i elements interactiusFent que les vostres aplicacions siguin més interactives mitjançant l'ús de botons, controls de selecció, controls lliscants i camps de text.Disposicions de formulariCreant amb facilitat àrees d'interacció atractives amb les FormLayouts de KirigamiMissatges inclososMostrant en la vostra aplicació els missatges relacionats amb el contingutBarres d'eines d'accióCreant les vostres pròpies barres d'eines personalitzables amb el component ActionToolBarBarres de progrés i indicadorsProporcionant als usuaris la informació sobre l'estat de càrrega mitjançant barres de progrés.Vistes de llistaUna vista de llista pot ajudar-vos a mostrar amb facilitat molts components de forma dinàmica.AvançatEntendre les CMakeListsFamiliaritzant-nos amb com funcionen els fitxers CMakeLists.txtDescobrir el main.cppComprenent el fitxer central del nostre codi de dorsalPàgina «Quant al»Informació sobre la vostra aplicacióManipulació de dadesConnectar la lògica amb la vostra interfície d'usuari en QMLConnectant un dorsal per a fer càlculs i proporcionar dades per a mostrar a la vostra interfície d'usuariConnectar models C++ a la vostra interfície d'usuari en QMLDades des del dorsal C++ a un frontal QMLComplements del KirigamiIntroducció als complements del KirigamiConeixeu els components dels complements del KirigamiPàgines FormCard «Quant al»Aprendre a crear pàgines «Quant al» per a acreditar la vostra aplicació.Delegats de formularis a les pàgines de configuracióCreació de pàgines elegants de configuració personalitzada."
