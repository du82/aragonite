title = ""
full_description = "KPlataforma de Desenvolvimento do KDEDesenhe, compile e distribua aplicações bonitas e úteis com as tecnologias do KDE.DesenhoAprenda mais sobre as linhas-guia e directrizes de desenho do KDE para as aplicações e íconesDesenvolvimentoDescubra as ferramentas e bibliotecas que o ajudam a compilar as aplicações do KDEDistribuirDisponha a sua aplicação perante os utilizadoresMulti-PlataformaDesenvolva uma vez e instale em todo o lado. Construídas com base no Qt, as tecnologias do KDE funcionam em todas as plataformas.Linux em Computadores Pessoais, Android, Windows, macOS, sistemas embebidos, etc Plataformas do KDE: Melhore a Experiência com o QtAs Plataformas do KDE cobrem 80 bibliotecas de extensão para programar com o Qt. Todas as bibliotecas foram bem testadas em cenários da vida real e estão devidamente documentadas. As bibliotecas do KDE são distribuídas segundo as licenças LGPL ou MIT.Saber MaisKPlataforma Gráfica do KirigamiKirigamiCrie Aplicações Bonitas e Convergentes que Correm em Telemóveis, TV's e Tudo o Resto.A linha entre os computadores pessoais e os dispositivos móveis está a ficar ténue e os utilizadores esperam a mesma qualidade de experiência em qualquer dispositivo. As aplicações que usam o Kirigami adaptam-se de forma brilhante aos dispositivos móveis, computadores, TV's, sistemas de entretenimento e muitos outros segmentos intermédios.Os componentes do Kirigami são bonitos e consistentes, e o próprio Kirigami oferece um fluxo de trabalho bem definido. Os utilizadores das aplicações do Kirigami irão gostar das escolhas inteligentes feitas na API e pelo seu desenho arrumado.Descubra o KirigamiKDevelopUm IDE multi-plataforma para o C, C++, Python, QML/JavaScript e PHPEm código aberto, poderoso e rápido, o KDevelop oferece um ambiente de desenvolvimento transparente para os programadores que lidam com projectos de qualquer tamanho. O KDevelop ajuda-o a concluir as suas tarefas sem se intrometer.Obtenha o KDevelopDocumentaçãoDos principiantes aos programadores experientes do Qt, aqui está tudo o que precisa de saber para começar a desenvolver aplicações para o KDE.Getting StartedLearn the basics and create your first KDE applicationKirigamiCrie Aplicações Bonitas e Convergentes que Correm em Telemóveis, TV's e Tudo o Resto."
