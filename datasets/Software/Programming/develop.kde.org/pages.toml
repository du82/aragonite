["https://develop.kde.org/hig/icons/monochrome/emblem"]
title = "Emblem Icons | Developer"
description = """
Emblem icons are used to indicate state. They come in three sizes: 8px, 16px, and 22px, and always use the monochrome style. They are typically overlaid on icons. Unlike most monochromatic icons, emblem icons use bright colours to remain recognizable, even at small sizes.
Purpose Emblem icons are used alongside a base icon to form compound icons that convey additional information on top of the base icon, indicating its status, such as missing, deleted, etc."""
full_description = "KDE Human Interface GuidelinesMonochromatic IconsEmblem IconsEmblem IconsEmblem icons are used to indicate state. They come in three sizes: 8px, 16px, and 22px, and always use the monochrome style. They are typically overlaid on icons. Unlike most monochromatic icons, emblem icons use bright colours to remain recognizable, even at small sizes.PurposeEmblem icons are used alongside a base icon to form compound icons that convey additional information on top of the base icon, indicating its status, such as missing, deleted, etc.DesignAnatomyEmblem icons always use the entire canvas area. Pixel alignment is especially important for emblem icons as they are rendered at very small sizes, making the consequences of pixel misalignment more noticeable than at other sizes.Pixel-align your icon and use the entire canvas.Don't misalign your icon or use margins.16px and 22px emblem icons get a 60% text colour outline to ensure contrast against various backgrounds. 8px emblems do not recieve an outline because of their limited canvas size.16px and 22px emblem icons get an outline to increase visibility on various backgrounds.8px emblem icons need to rely on bold shapes and bright colours for visiblity, as they don't have room for an outline.PreviousAction IconsNextMIME Type Icons"
