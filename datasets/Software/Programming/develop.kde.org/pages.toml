title = "Breeze Icons | Developer"
description = """
Breeze-icons is a freedesktop.org compatible icon theme. It's developed by the KDE Community as part of KDE Frameworks 5 and it's used by default in KDE Plasma 5 and KDE Applications. Its sources are hosted on KDE Invent.
Design Guidelines The Breeze icons guidelines are described at hig.kde.org. To help contribute to KDE design please join the KDE Visual Design Group."""
