["https://develop.kde.org/ja"]
title = ""
full_description = "KKDE Developer PlatformKDE の技術で美しく便利なアプリケーションをデザイン、ビルドそして配布する。デザインアプリケーションとアイコン向けの KDE のデザインガイドラインについて学ぶ開発KDE のアプリケーションのビルドを補助するツールやライブラリを確認する貢献アプリケーションをユーザーに配布するマルチプラットフォーム1度の開発で、どこにでもデプロイできます。Qt 上に構築された KDE の技術はすべてのプラットフォームで動作します。デスクトップ版 Linux、Android、Windows、macOS、組み込みなど KDE Frameworks: Qt での体験を向上KDE Frameworks は Qt を利用したプログラミングのための 80 のアドオンライブラリーを含んでいます。すべてのライブラリーは現実世界のシナリオで十分に試験されており、包括的な資料が用意されています。KDE のライブラリーは LGPL または MIT ライセンスの下に配布されています。詳細を確認するKKirigami UI FrameworkKirigami携帯やテレビ、その中間などで動作する、美しく融合したアプリケーションを構築する。デスクトップと携帯の境界線は曖昧になりつつあり、ユーザーはどのデバイス端末でも同じ品質の体験を望んでいます。Kirigami を使用したアプリケーションは、携帯、デスクトップ、テレビ、娯楽システム、その他のすべてのものに適応します。Kirigami コンポーネントは見栄えがよく一貫性があります。また、Kirigami は自身に明確に定義がされたワークフローを提供します。Kirigami アプリケーションのユーザーは API に施されたスマートな選択とすっきりしたデザインを高く評価するでしょう。Kirigami を探すKDevelopC、C++、Python、QML/JavaScript、PHP 向けのクロスプラットフォーム IDEオープンソースで、強力で高速な KDevelop はあらゆる規模のプロジェクトに携わるプログラマーにシームレスな開発環境を提供します。KDevelop はあなたの作業を邪魔せずに仕事を終わらせる手伝いをします。KDevelop を入手する資料初心者から熟練した Qt の開発者まで、ここに KDE アプリケーションの開発を始めるのに知る必要のあるすべてのものが揃っています。Getting StartedLearn the basics and create your first KDE applicationKirigami携帯やテレビ、その中間などで動作する、美しく融合したアプリケーションを構築する。"
