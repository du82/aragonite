["https://develop.kde.org/ca/hig"]
title = "Guia d'interfície humana de KDE |"
description = """
Us donem la benvinguda a les Directrius d'Interfície Humana de KDE! Seguir-les us ajudarà a construir una aplicació bonica i potent que se senti com a casa en un Plasma de KDE i que funcioni bé fora d'ell. Els usuaris aprendran ràpidament a utilitzar-la, compliran els seus objectius amb facilitat i trobaran menys problemes que requereixin suport.
Aquest document cobreix la filosofia i la cultura de disseny de KDE, els patrons i fluxos de treball habituals, les convencions estàndard de la interfície d'usuari i les recomanacions per a la integració de la plataforma."""
full_description = "Guia d'interfície humana de KDEGuia d'interfície humana de KDEUs donem la benvinguda a les Directrius d'Interfície Humana de KDE! Seguir-les us ajudarà a construir una aplicació bonica i potent que se senti com a casa en un Plasma de KDE i que funcioni bé fora d'ell. Els usuaris aprendran ràpidament a utilitzar-la, compliran els seus objectius amb facilitat i trobaran menys problemes que requereixin suport.Aquest document cobreix la filosofia i la cultura de disseny de KDE, els patrons i fluxos de treball habituals, les convencions estàndard de la interfície d'usuari i les recomanacions per a la integració de la plataforma.Per què és tan important un bon disseny?El disseny determina com de bé compleix alguna cosa el seu propòsit funcional, i també com és d'agradable interactuar amb ell. Si falta alguna cosa, el resultat serà frustrant. La gent no voldrà utilitzar una aplicació mal dissenyada, i si es veu obligada a fer-ho, es mostraran ressentits i difondran negativitat sobre això. Eviteu-ho amb un bon disseny!El disseny implica decisions dirigides i compromisos que acosten un projecte als seus objectius i paradigmes d'ús. Les millors aplicacions saben quins usuaris i casos d'ús estan apuntant, i quins deixen per a altres. És millor tenir èxit centrant-se en el que pots fer bé que dispersar-se i fallar. Promeses reduïdes i lliuraments augmentats, mai al revés.Temes no cobertsAquest document és un conjunt de directrius de disseny, no instruccions per a implementar cada component específic. Tot i que es proporcionarà alguna guia tècnica, es pot trobar molt més detall en l'ús i l'API de la mateixa documentació, així com el codi font de les aplicacions KDE existents.nameasc). És més un què i un per què, que no pas un com.Aquest document no pretén ser un codi legal forjat en ferro. Aprenent i seguint les normes, entendreu com innovar amb seguretat dins de les directrius, i que pot ser adequat trencar-les si produeix un resultat millor.Col·laboracióAquest és un document viu, destinat a actualitzar-se amb el temps per a reflectir les tendències actuals del disseny de KDE i les millors pràctiques. Les col·laboracions són benvingudes!El contingut està escrit en Markdown, i els fitxers font estan allotjats en un repositori Git. Per a editar ràpidament una pàgina, l'editor de GitLab es pot obrir en qualsevol pàgina amb el botó «Edita aquesta pàgina» al calaix de la dreta. Les tasques i els canvis s'organitzen a través de https://invent.kde.org. Per a aprendre a enviar canvis, vegeu el fitxer README.Llegiu les directriusFeu clic en qualsevol d'aquestes fitxes per a saltar a una pàgina:"
