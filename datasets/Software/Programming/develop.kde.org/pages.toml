["https://develop.kde.org/sl/hig"]
title = "Smernice za uporabniški vmesnik KDE |"
description = """
Dobrodošli v smernicah za uporabniški vmesnik KDE! Njihovo upoštevanje vam bo pomagalo zgraditi lepo in zmogljivo aplikacijo, ki se počuti kot doma v okolju KDE Plasma, in dobro deluje zunaj njega. Uporabniki se bodo naučili, kako ga hitro uporabljati, z lahkoto dosegli svoje cilje in naleteli na manj težav, ki potrebujejo podporo.
Ta dokument pokriva filozofijo in kulturo oblikovanja KDE, običajne poteke dela in vzorce, standardne konvencije uporabniškega vmesnika in priporočila za integracijo platforme."""
full_description = "Smernice za uporabniški vmesnik KDESmernice za uporabniški vmesnik KDEDobrodošli v smernicah za uporabniški vmesnik KDE! Njihovo upoštevanje vam bo pomagalo zgraditi lepo in zmogljivo aplikacijo, ki se počuti kot doma v okolju KDE Plasma, in dobro deluje zunaj njega. Uporabniki se bodo naučili, kako ga hitro uporabljati, z lahkoto dosegli svoje cilje in naleteli na manj težav, ki potrebujejo podporo.Ta dokument pokriva filozofijo in kulturo oblikovanja KDE, običajne poteke dela in vzorce, standardne konvencije uporabniškega vmesnika in priporočila za integracijo platforme.Zakaj je dobro oblikovanje tako pomembno?Oblikovanje ne določa le, kako dobro nekaj izpolnjuje svoj funkcionalni namen, ampak tudi, kako prijetno je komunicirati z njim. Če enega ali drugega manjka, bo rezultat frustrirajoč. Ljudje ne bodo želeli uporabljati slabo zasnovane aplikacije, in če bodo v to prisiljeni, bodo to zamerili in ​​bodo o njej širili negativne govorice. Izognite se temu z dobrim oblikovanjem!Oblikovanje vključuje ciljno usmerjene odločitve in kompromise, ki projekt približajo predvidenim ciljem in paradigmam uporabe. Najboljše aplikacije vedo, na katere uporabnike in primere uporabe ciljajo ter katere pustijo drugim. Bolje je uspeti tako, da se osredotočite na tisto, kar lahko naredite dobro, kot pa se raztegniti in spodleteti. Obljubljajte premalo in izpolnite preveč, nikoli obratno.Teme niso zajeteTa dokument je zbirka smernic za načrtovanje in ne navodil za implementacijo vsake posamezne komponente. Čeprav bo na voljo nekaj tehničnih navodil, je veliko več podrobnosti mogoče najti v komponentah v uporabi in [API] (https://api.kde.org/) dokumentacijo kot tudi izvorno kodo obstoječih aplikacij KDE. Gre bolj za kaj in zakaj, ne za kako.Ta dokument ni mišljen kot strog pravni kodeks. Z učenjem in upoštevanjem pravil boste razumeli, kako varno inovirati v smernicah in kdaj je primerno, da jih kršite, če prinašajo vrhunske rezultate.PrispevkiTo je živi dokument, ki naj bi ga sčasoma posodobili, da odraža trenutne trende oblikovanja in najboljše prakse KDE. Prispevki so dobrodošli!Vsebina je napisana v Markdown, izvorne datoteke pa gostujejo v Git repozitoriju. Za hitro urejanje strani lahko urejevalnik GitLab odprete na kateri koli strani z gumbom “Uredi to stran“ v predalu na desni. Naloge in spremembe so organizirane preko https://invent.kde.org. Če želite izvedeti, kako predložiti spremembe, glejte datoteko README.Preberite smerniceZa skok na stran kliknite katero koli od teh ploščic:"
