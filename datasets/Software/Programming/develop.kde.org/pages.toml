title = ""
full_description = "KPlate-forme de développement sous KDevelopConcevoir, développer et distribuer de belles applications, utilisables avec les technologies de KDE.ConceptionApprenez en plus sur les directives de conception de KDE pour les applications et les icônes.DévelopperDécouvrez les outils et les bibliothèques vous aidant à créer des applications pour KDE.DistribuerObtenez votre application en présence des utilisateursMulti-Plate-formeDévelopper une première fois, déployer partout. Conçu à partir de Qt, les technologies de KDE fonctionnent sur n'importe quelle plate-forme.Linux sur ordinateur fixe, Android, Windows, macOS, en embarqué et encore plus. Environnement de développement de KDE : améliorez l'expérience avec QtL'environnement de développement de KDevelop regroupe 80 bibliothèques supplémentaires pour la programmation avec Qt. Toutes les bibliothèques ont été largement testées dans des scénarios du monde réel et sont entièrement documentées. Les bibliothèques de KDE sont distribuées sous licence « LGPL » ou « MIT ».Plus d'informationsKEnvironnement de développement pour interface utilisateur KirigamiKirigamiDévelopper de belles applications convergentes pouvant fonctionner sur les téléphones, les téléviseurs et tout se trouvant entre les deux.La séparation entre ordinateur fixe et sur périphérique mobile est floue et les utilisateurs attendent la même expérience de qualité sur chaque appareil. Les applications utilisant Kirigami s'adaptent avec brio aux systèmes mobiles, aux ordinateurs fixes, aux télévisions, aux systèmes multimédia et tout ce qui est entre.Les composants de Kirigami sont beaux et cohérents. Kirigami lui-même fournit un flux de travail clairement défini. Les utilisateurs des applications sous Kirigami apprécieront les choix judicieux faits dans l'API et la conception épurée.Découvrir KirigamiKDevelopUn environnement de développement intégré en plate-forme croisée pour C, C++, Python, QML / JavaScript et PHP.« Open Source », puissant 