["https://develop.kde.org/hig/icons/monochrome/places"]
title = "Places Icons | Developer"
description = """
Places icons are used to depict folders, network locations, and other places. They come in four sizes: 16px, 22px, 32px, and 64px. Places icons use the monochrome style for 16px and 22px sizes, and the colorful style for 32px and 64px sizes.
Purpose Places icons allow a user to quickly identify landmarks in their filesystems. They indicate places that a user will visit frequently, such as home, root, downloads, etc."""
full_description = "KDE Human Interface GuidelinesMonochromatic IconsPlaces IconsPlaces IconsPlaces icons are used to depict folders, network locations, and other places. They come in four sizes: 16px, 22px, 32px, and 64px. Places icons use the monochrome style for 16px and 22px sizes, and the colorful style for 32px and 64px sizes.PurposePlaces icons allow a user to quickly identify landmarks in their filesystems. They indicate places that a user will visit frequently, such as home, root, downloads, etc.DesignIconographyPlaces icons use bold and recognizable symbols that allow a user to determine the icon's corresponding location at a glance.Use a bold, descriptive, and metaphorically recognizable icon to identify a user's landmark and guide the user to their desired destination — international icons are used instead of regional icons to better serve the diverse array of users that use KDE software.Don't use places icons based off of real locations or brands unless the landmark filesystem location is directly tied to that location or brand — more generic icons are meaningful for more users in more use cases.PreviousMIME Type IconsNextStatus Icons"
