title = ""
full_description = "KPlatform voor ontwikkelaar van KDEOntwerp, bouw en distribueer prachtige, bruikbare toepassingen met KDE technologieën.OntwerpNeem kennis van de ontwerprichtlijnen van KDE voor toepassingen en pictogrammenOntwerpenBekijk de hulpmiddelen en bibliotheken die u helpen bij het bouwen van KDE-toepassingenVerdelenKrijg uw toepassing in het zicht van gebruikersMulti-platformOntwikkel eenmalig, pas overal toe. Bouw bovenop Qt, technologieën van KDE werken op elk platform.Linux bureaublad, Android, Windows, macOS, ingebed en meer KDE Frameworks: verbeter de Qt ervaringKDE Frameworks dekt 80 add-on bibliotheken voor programmeren met Qt. Alle bibliotheken zijn goed getest in scenarios uit de echte wereld en zijn uitgebreid gedocumenteerd. Bibliotheken van KDE worden gedistribueerd onder LGPL of MIT licenties.Meer informatieKKirigami UI FrameworkKirigamiPrachtig gebouwd, convergente toepassingen die draaien op telefoons, TV's en alles er tussenin.De lijn tussen bureaublad en mobiel is aan het vervagen en gebruikers verwachten dezelfde kwalitatieve ervaring op elk apparaat. Toepassingen die Kirigami gebruiken passen zich brilliant aan aan mobieltjes, bureaubladen, TV's, infortainmentsystemen en alles er tussenin.De componenten van Kirigami zien er goed uit en zijn consistent en Kirigami zelf biedt een helder gedefinieerde workflow. Gebruikers van Kirigami-toepassingen zullen de slimme keuzes gemaakt in de API en niet-klonterige ontwerp waarderen.Kirigami ontdekkenKDevelopEen cross-platform IDE voor C, C++, Python, QML/JavaScript en PHPOpen-source, krachtig en snel, KDevelop biedt een naadloze ontwikkelomgeving aan programmeurs die werken aan projecten van elke grootte. KDevelop helpt u om de job gedaan te krijgen terwijl deze niet in de weg zal zitten.KDevelop ophalenDocumentatieVanaf beginners tot ervaren Qt-ontwikkelaars, hier is alles wat u nodig zult hebben om te starten met het ontwikkelen van KDE-toepassingen.Hoe te beginnenLeer de basis en maak uw eerste KDE toepassingKirigamiPrachtig gebouwd, convergente toepassingen die draaien op telefoons, TV's en alles er tussenin."
