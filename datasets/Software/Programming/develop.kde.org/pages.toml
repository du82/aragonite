["https://develop.kde.org/hig/layout_and_nav"]
title = "Layout and navigation | Developer"
description = """
Positioning Convey importance and grouping by placing items strategically.
People read layouts in the order they read words in their language; users will pay more attention to items near the top-leading position (i.e. top-left in a language like English, and top-right in a language like Arabic). By the same token, users will perceive items in the bottom-trailing position as being the logically last or final thing to do before moving on."""
full_description = '''KDE Human Interface GuidelinesLayout and navigationLayout and navigationPositioningConvey importance and grouping by placing items strategically.People read layouts in the order they read words in their language; users will pay more attention to items near the top-leading position (i.e. top-left in a language like English, and top-right in a language like Arabic). By the same token, users will perceive items in the bottom-trailing position as being the logically last or final thing to do before moving on.One exception is on a mobile phone, where the most commonly used tools live in a bottom toolbar. This improves acquisition speed by making them thumb-reachable without re-positioning the hand.Group related items together by reducing the spacing between them, and increasing the spacing between groups. Make sure items that look grouped are in fact logically related.Spacings and sizesUse the Kirigami standard units consistently:ItemValue to useSpacing between title and subtitle text0Spacing between title/subtitle groups and other content below themsmallSpacingSpacing between other directly related items, or controls sharing a logical groupsmallSpacingSpacing between groups of controls or textlargeSpacingSpacing between items in a toolbar (e.g. buttons and text fields)mediumSpacingPadding between window/page edges and “frameless" container views0Padding between window/page edges and all other UI elementslargeSpacingCorner radius for rounded UI elementscornerRadiusFixed-size UI elements, including default and minimum window sizesgridUnit (18px) multiplied as neededSize of icons in menu items and raised buttonsIconSizes.smallSize of icons in flat/toolbar buttons and list items without subtitlesIconSizes.smallMediumSize of icons in list items with subtitlesIconSizes.mediumCommon layouts and responsivenessKDE apps commonly consist of layout elements such as a main content area, a sidebar used for navigation, a toolbar displaying actions contextually relevant to what's shown in the content view, a menu of globally-scoped actions, and more.These layout elements must adapt fluidly to diverse screen sizes and window shapes. Even on the desktop, users may resize your app's window to be small and narrow. Adapt the app's window content in sane and sensible ways when maximized, tiled, or otherwise used at a different size or shape than how it was originally designed.Here are the ways that common layout elements, when present, should move or change in different circumstances:ItemDesktop/widescreenMobile/narrowToolbarAbove the content areaBelow the content areaSidebarLeading the content areaVisible on demand in the leading position, or the first page in a page stackContextual preview/tool viewTrailing the content areaVisible on demand in the trailing positionMenubarAbove the toolbarHamburger menu button on the toolbarNavigation tab barAbove the content areaBelow the content areaStatus barBelow the content areaOmittedKirigami.GlobalDrawer is a useful component for convergent apps. It looks like a standard sidebar, and can be made always visible in widescreen/desktop mode by setting modal: false. In narrow/mobile mode, users pull it out on demand. Kirigami.ContextDrawer is the same but for contextual actions relevant only for individual pages.Desktop/laptop apps can be adapted to work on tablets and 2-in-1 laptops in tablet mode by enlarging small UI elements and hiding menubars. Phones (even large ones) need an optimized mobile UI; do not just scale down a desktop UI.NoteDetect that the app is running in tablet mode by reading the value of Kirigami.Settings.tabletMode. Enable this mode for testing purposes on System Settings' General Behavior page.Detect that the app is running on a mobile phone by reading the value of Kirigami.Settings.isMobile. Set the QT_QUICK_CONTROLS_MOBILE=1 environment variable to test your app in a simulated mobile mode.In addition, offer a good experience for laptop users by keeping these points in mind:Implement “pixel-by-pixel” scrolling for touchpad two-finger scroll gestures, instead of jumping a certain number of rows.Set shortcuts using modifier and alphanumeric keys; never just a function key, as these can be hard to access on laptops.Click here to learn about relevant QtWidgets technologiesIn a QtWidgets app, KDE's basic GUI layout library in KXmlGui is recommended. Sidebars can be implemented using QDockWidget.MenusMenus are drop-down lists of actions the user can perform.Small or focused apps often need no menu structures at all, because all of their actions are visible on demand in contextual toolbars or inline on content items.In small- and medium-sized apps, it's common for a curated set of globally-scoped actions to be visible in a “hamburger menu:” a menu that appears when clicking on a button located on the app's toolbar with the application-menu icon. Its contents are static and globally-scoped, with contextually irrelevant items disabled rather than being hidden.Don't put standard app and window management actions like “Quit” and “Minimize” in a hamburger menu.Only show a hamburger menu by default if its contents can be kept to about 15 items or fewer. If you are tempted to add more than this, a hamburger menu is the wrong UI element for your app; instead place a real menubar between the titlebar and toolbar. Like the hamburger menu, its contents are static and disabled when not relevant, rather than hidden. The major difference is that the menubar shows all possible actions in the app, so users can access any of them at any time.Click here to learn about relevant QtWidgets technologiesIn a QtWidgets app, use KHamburgerMenu to give a medium-to-large app both a menu bar and a hamburger menu. Choose a curated list of the most important actions for the hamburger menu, which will appear when the menubar is hidden.NavigationStrive to minimize navigation as a chore for users to succeed at before they can get to what they want. The best navigational flow is nonexistent, because everything is provided to the user as they need it.Linear navigation works well for apps that have a step-by-step workflow with clear starting and ending points. Use the standard PageStack mechanism built into Kirigami for this navigation model, with breadcrumbs and back/forward buttons in the toolbar for navigation.For apps with multiple destinations not arranged in a linear flow, implement a dedicated navigational control to let the user jump from one destination to another. With five or fewer destinations, use a Kirigami.NavigationTabBar.Otherwise, use a Kirigami.GlobalDrawer to display the navigation destinations.Regardless of which navigational control is used, ensure that the view your app shows at launch is represented as its first item so users can easily get there again.Tools and functionalityWhen a content view needs controls specific to it that for some reason cannot be provided by the main toolbar, place them in a secondary toolbar underneath the main toolbar.Many KDE apps also feature auxiliary “Contextual Toolviews.” These can show previews or information about what's displayed or selected in the main content area, or extra tools to interact with it.Show these views in addition to the global-scope navigation UI; don't replace it. The only exception is when the navigation view is itself already contextual (e.g. a thumbnail view for the open document in a PDF reader app); in this case the contextual navigation can be integrated into a tabbed/multi-view sidebar that shows different contextual views for the visible content.Right-to-left languagesPeople using the software in right-to-left languages like Arabic and Hebrew expect for layouts to reverse direction.This works automatically for items using anchor-based positioning or Qt Layout objects such as RowLayout and ColumnLayout, but it's important to check things yourself. For example you can test your app in right-to-left mode by running it in Arabic with LANGUAGE=ar_AR [app_executable]. Even if you can't read the words, you can check the layout.In addition to layout objects reversing their horizontal positioning, make sure text alignment has reversed too.Manually reverse any custom controls that show progress of directionality—for example star-rating widgets or sliders with custom visual styling.When using icons that indicate directionality or depict layouts or textual elements, use the reversed versions that are suffixed with -rtl. Examples include back and forward icons, undo/revert icons, volume icons, and icons depicting things like “close the left sidebar.”Don't mirror images.For more information, see the Qt documentation on right-to-left user interfaces.PreviousPowerful when neededNextDisplaying content'''
