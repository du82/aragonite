["https://develop.kde.org/tr/hig"]
title = "KDE İnsan Arayüzü Yönergeleri |"
description = """
KDE İnsan Arayüzü Yönergeleri’ne hoş geldiniz. Bunlara uymak, KDE Plasma üzerinde çalıştırırken evinde hissettirecek güzel ve güçlü bir uygulama yapmanıza ve başka platformlarda düzgün bir biçimde çalışmasına yardımcı olacaktır. Kullanıcılar uygulamanızı tez nasıl kullanacağınızı ve kendi çalışma hedeflerini kolaylıkla nasıl gerçekleştireklerini öğrenecekler ve destek gerektiren daha az sorunla karşılaşacaklardır.
Bu belge; KDE’nin tasarım felsefesini ve kültürünü, genel iş akışlarını ve örüntülerini, standart kullanıcı arayüzü konvansiyonlarını ve platform tümleştirmesi konusunda önerileri kapsar."""
full_description = "KDE İnsan Arayüzü YönergeleriKDE İnsan Arayüzü YönergeleriKDE İnsan Arayüzü Yönergeleri’ne hoş geldiniz. Bunlara uymak, KDE Plasma üzerinde çalıştırırken evinde hissettirecek güzel ve güçlü bir uygulama yapmanıza ve başka platformlarda düzgün bir biçimde çalışmasına yardımcı olacaktır. Kullanıcılar uygulamanızı tez nasıl kullanacağınızı ve kendi çalışma hedeflerini kolaylıkla nasıl gerçekleştireklerini öğrenecekler ve destek gerektiren daha az sorunla karşılaşacaklardır.Bu belge; KDE’nin tasarım felsefesini ve kültürünü, genel iş akışlarını ve örüntülerini, standart kullanıcı arayüzü konvansiyonlarını ve platform tümleştirmesi konusunda önerileri kapsar.İyi tasarım neden bu kadar önemli?Tasarım, bir şeyin işlevsel amacını ne kadar iyi yerine getirdiğini ve etkileşim kurmanın ne kadar eğlenceli olduğunu belirler. Her ikisi de eksikse sonuç sinir bozucu olacaktır. İnsanlar kötü tasarlanmış bir uygulama kullanmak istemeyeceklerdir ve buna zorlanırlarsa bu konuda hiç iyi şeyler hissetmeyeceklerdir. İyi tasarımla bundan kaçının!Tasarım, bir projeyi amaçlanan hedeflerine ve kullanım paradigmalarına yaklaştıran hedefli kararları ve ödünleşmeleri içerir. En iyi uygulamalar, hangi kullanıcıları ve kullanıcıları hedeflediklerini ve hangilerini başkaları için bıraktıklarını bilir. Kendinizi zayıflatmak ve başarısız olmaktan çok iyi yapabileceğiniz şeylere odaklanarak başarılı olmak daha yeğdir. Her zaman daha az söz verin ve daha fazlasını sağlayın; hiçbir zaman tersini yapmayın.Kapsanmayan konularBu belge, her bir bileşeni nasıl gerçekleyeceğinize odaklanan talimatlardan çok bir nevi tasarım kılavuzudur. Bir nebze teknik konularda yol gösterilse de, bileşenlerin kendi kullanım ve API belgelendirmelerinde ve var olan KDE uygulamalarının kaynak kodlarında çok daha ayrıntılı bilgi bulunabilir. Bu, bir “nasıl”dan ziyade ne ve neden konularına yöneliktir.Bu belgenin bir katı töre olması amaçlanmamıştır. Kuralları öğrenerek ve izleyerek, yönergeler içinde nasıl güvenlice inovatif olacağınızı ve üstün bir sonuç ortaya çıkarsa onları ne zaman törpülemenin uygun olabileceğini anlayacaksınız.Katkıda bulunmakBu, geçerli KDE tasarım eğilimlerini ve en iyi pratikleri yansıtması için hazırlanan, canlı ve yaşayan bir belgedir. Her zaman katkılarınızı bekleriz.İçerik Markdown ile yazılır ve kaynak dosyaları bir Git deposunda bulunur. Bir sayfayı tez düzenlemek için GitLab düzenleyicisi, her bir sayfanın sağ üst köşesindeki çekmecede bulunan “Edit This Page” düğmesi ile kullanılabilir. Görevler ve değişiklikler https://invent.kde.org ile organize edilir. Nasıl değişiklikler göndereceğinizi öğrenmek için README dosyasına bakın.Yönergeleri okuyunBir sayfaya atlamak için bu karolardan birine tıklayın:"
