full_description = "DevelopDevelop Featureful Applications with KDE and Qt Technologies.Design Develop DistributeToolsKDE provides a variety of tools to help you develop the best applications.KDevelopKDevelop is KDE's full-fledged development environment.KateKate is KDE's lightweight, but feature-rich text editorAnd many more tools Umbrello Clazy KCachegrind Heaptrack Massif-VisualizerSee All ToolsKDE Frameworks, enhance the Qt experienceKDE Frameworks encompasses 80 add-on libraries for programming with Qt. They have all been well-tested in real-world scenarios and are extensively documented. All libraries are licensed under LGPL or MIT.Discover the FrameworksExtend Qt with New PossibilitiesKDE's development tools and frameworks are built on top of Qt, the popular cross-platform framework for developing beautiful applications.Stop Reinventing the WheelTired of writing your own widgets for your Qt projects? Use KWidgetsAddons! Want a flexible configuration system? Use KConfig! The KDE Frameworks suite solves most of the problems you have to deal with when building Qt applications. It will also integrate perfectly into your Qt projects and the API will be familiar as it is based on the same interfaces that make up the majority of existing Qt applications.Network TransparencyThe increase in connectivity of today's world makes KIO an essential part of your toolset. KIO allows Qt applications to connect to remote shares as if they were on local computers, making accessing server-hosted files and directories transparent and easy for your users. KIO supports ftp, ssh, http, webdav, fish, samba, and many more protocols.Discover Qt Discover KDE FrameworksDevelop Convergent Apps with KirigamiKirigami is a new, convergent, responsive, elegant, and open cross-platform toolkit that uses QML.Discover KirigamiStart Building your First KDE ApplicationGetting Started with KXmlGuiCreate a small text editorGetting Started with KirigamiCreate a convergent application using QtQuickKConfigManage your application settingsAkonadiIntegrated Personal Information managerD-BusInter-process communication made easyAnd MoreSee all the tutorialsKDE e.V. Trusted IT Consulting FirmsIn KDE we take pride in being a Free Software community and having an open, free and fair development process.However, we also understand that sometimes companies' and institutions' main priorities do not include learning the processes of our community and they just want issues solved or features implemented.For this reason, we provide a list of professional consultants that have a profound knowledge of KDE technologies and who will help you make your project reach its goals.See the list of consultants"
