["https://develop.kde.org/nl/hig"]
title = "Human-interface richtlijnen van KDE |"
description = """
Welkom bij de richtlijnen van KDE voor het menselijke interface (HIG)! Ze volgen zal u helpen een mooie en krachtige toepassing te bouwen die zich thuis voelt indien uitgevoerd in KDE Plasma en goed werkt erbuiten. Gebruikers zullen uw toepassing snel leren gebruiken, hun doelen met gemak halen en minder problemen tegenkomen die ondersteuning vereisen.
Dit document dekt de ontwerpfilosofie en cultuur van KDE, algemene werkwijzen en patronen, standaard conventies voor gebruikersinterface en aanbevelingen voor platformintegratie."""
full_description = "Human-interface richtlijnen van KDEHuman-interface richtlijnen van KDEWelkom bij de richtlijnen van KDE voor het menselijke interface (HIG)! Ze volgen zal u helpen een mooie en krachtige toepassing te bouwen die zich thuis voelt indien uitgevoerd in KDE Plasma en goed werkt erbuiten. Gebruikers zullen uw toepassing snel leren gebruiken, hun doelen met gemak halen en minder problemen tegenkomen die ondersteuning vereisen.Dit document dekt de ontwerpfilosofie en cultuur van KDE, algemene werkwijzen en patronen, standaard conventies voor gebruikersinterface en aanbevelingen voor platformintegratie.Waarom is een goed ontwerp zo belangrijk?Ontwerp bepaalt hoe goed het zijn functionele doel vervult en hoe plezierig het is om er mee om te gaan. Als een van tweeën ontbreekt, zal het resultaat frustrerend zijn. Mensen willen geen slecht ontworpen toepassing en als ze het moeten gebruiken, zullen dat met tegenzin doen en negativiteit erover verspreiden. Vermijd dat door een goed ontwerp!Ontwerpen houd in gerichte beslissingen en afwegingen die een project dichter bij zijn bedoelde doelen en gebruiksparadigma's brengt. De beste toepassingen weten op welke gebruikers en gebruiksgevallen ze zich richten en welke ze overlaten voor anderen. Het is beter succes te hebben door de focus te richten op wat u goed kan doen dan van alles te doen en te falen. Onder-belofte en over-aflevering, nooit het omgekeerde.Niet gedekte onderwerpenDit document is een set met ontwerprichtlijnen, geen instructies voor het implementeren van elk specifieke component. Terwijl enige technische begeleiding geleverd zal worden, zal veel meer detail te vinden zijn in de componenten van eigen gebruik en API documentatie evenals de broncode van bestaande KDE toepassingen. Het is meer een wat en een waarom, geen hoe.Dit document is niet bedoeld om een ijzersterke wet voor coderen te zijn. Door het leren en volgen van de regels, zult u begrijpen hoe veilig te innoveren binnen de richtlijnen en wanneer het toepasselijk kan zijn om met ze te breken als het een superieur resultaat produceert.BijdragenDit is een levend document, bedoeld om in de tijd bijgewerkt te worden om huidige ontwerptrends en beste praktijken in KDE weer te geven. Bijdragen zijn welkom!Inhoud is geschreven in Markdown en de bronbestanden staan in een Git-opslagruimte. Om snel een pagina te bewerken kan de GitLab-bewerker geopend worden op elke pagina met de knop “Deze pagina bewerken” in de schuiflade rechts. Taken en wijzigingen zijn georganiseerd via https://invent.kde.org. Om te leren hoe wijzigingen in te dienen, zie het README bestand.Lees de richtlijnenKlik op een van deze vakken om naar een pagina te gaan:"
