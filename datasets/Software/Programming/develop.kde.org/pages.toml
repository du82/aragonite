["https://develop.kde.org/hig/status_changes"]
title = "Communicating status changes | Developer"
description = """
Minimize unnecessary status messages. Indicate success by visually changing something on the screen related to the task that succeeded, not by sending a message saying “Task completed.” One exception is for long-running tasks that the user may have forgotten about.
Errors and failures Strive to prevent error messages by keeping the user from entering an error or failure state in the first place. Only accept data in structured input fields, validate inputs before entry, and automatically recover from internal failures."""
full_description = "KDE Human Interface GuidelinesCommunicating status changesCommunicating status changesMinimize unnecessary status messages. Indicate success by visually changing something on the screen related to the task that succeeded, not by sending a message saying “Task completed.” One exception is for long-running tasks that the user may have forgotten about.Errors and failuresStrive to prevent error messages by keeping the user from entering an error or failure state in the first place. Only accept data in structured input fields, validate inputs before entry, and automatically recover from internal failures.See the following table for how to express errors to the user, in decreasing order of preference:Message typeWhen to useNone; the error condition is made impossible or the software recovers automaticallyAlways preferredDescription of what went wrong with some kind of “Fix it” actionWhen the “Fix it” action is not universally desirable or has consequences the user must be notified aboutDescription of what went wrong and how the user can proceedWhen it's technically infeasible to offer a “Fix it” actionOnly a description of what went wrongNeverOnly technical gibberishNever everSilent failureNever ever everAll error messages must be actionable. Tell the user in plain language what happened and what they can do to either fix it, or at least move forward somehow. Be explicit and don't assume knowledge of the system's inner workings or support resources! For example, if you expect the user to visit a support forum or submit a bug report, show a link to the appropriate location in the UI displaying the error message.Ensure that failures originating with third-party software or web services are communicated to the user as such. Never let the user blame your app for a problem that's outside of your control!ColorAnything colorful will stand out visually, so use it strategically to attract the user's attention. Don't overdo it; when many UI elements are colorful, the user's attention will be pulled in multiple directions.HighlightedTextColor/HighlightColor color (blue by default): highlighted list or grid items, checked controls, benign and ignorable textNeutralTextColor/NeutralBackgroundColor (orange by default): warning or alert text/areas, non-default settings statesNegativeTextColor/NegativeBackgroundColor (red by default): error text/areas, dangerous actionsDon't rely on color alone to convey meaning or invite action; also use different icons, shapes, or text.In-app notificationsAvoid sending system notifications while your app's main window is in the foreground, as they can appear where the user is not looking. Instead use one of the following:For ignorable or low-importance messages, use Kirigami.PassiveNotification.For messages that should get the user's attention but not interrupt their current task, add a Kirigami.InlineMessage. If the message's scope is specific to the whole page or application, add it to the page header with the position property set to InlineMessage.Position.Header.System notificationsSend a system notification when your app is in the background and needs to inform the user about about actionable events such as the progress of ongoing jobs, incoming communications from other people, or hardware issues such as running low on battery power.Give an urgency level to each notification: Low, Normal, or Critical. Strongly consider not sending Low importance notifications in the first place. Give the persistent flag to normal-priority notifications that are not critical, but that the user should not miss anyway. Critical notifications always remain visible until dismissed.Use system notifications sparingly. Excessive notifications drive users crazy.Don't use system notifications to bug the user about expected and ignorable events. For user-initiated system-level changes made within Plasma itself rather than a windowed app, consider using an OSD instead.Never use notifications to advertise new features or prompt the user to promote the app.On-screen displaysUse an on-screen display (OSD) to communicate in a lightweight fashion that a user-initiated system-level action has taken effect, and also to show the new state of the system.OSDs are useful in either of these situations:When knowledge of the new state is important for the user to know.When an action that is quick but not instant has completed.Examples include:Volume changesBrightness changesConnection to a new network or Bluetooth device has succeededActive audio device has been switched in response to a hardware changeSystem time zone has been switched in response to traveling somewhere elseOnly Plasma components should show OSDs; don't show an OSD from a windowed app. Instead, use an in-app or system notification.Don't show an OSD for an automatic action not initiated or expected by the user in some way.Task Manager badges and progress barsFor infrequent yet long-running tasks, also display the completion percentage on the app's Task Manager background using setBadgeNumber on your QApplication/QGuiApplication. Only use this to show completion percentage for jobs and tasks the user has explicitly initiated.Task Manager badges can also display a number using the same D-Bus interface. This can be used to show a count of unread messages or open tasks. Only include actionable tasks in the number; users want to get rid of it!System Tray iconsSystem Tray icons can be annoying to users, who generally expect apps to quit when their windows are closed. The status monitoring functions typically provided by System Tray icons are better implemented with deeper system integration:Task Manager badges can show a count of unread messages.Task Manager progress bars and system notifications can show job progress.System notifications can display new messages and status changes.If your app runs primarily as a background service with any UI or window being of secondary importance, consider writing a Plasma Widget instead of a standalone app.Only implement System Tray icons as a last resort, and always follow these rules:Also implement any of the system integrations mentioned above that make sense.Make the tray icon opt-in, not opt-out.Make the tray icon visible only when there is abnormal status to report and the app is not showing a window—not 100% of the time.PreviousGetting inputNextText and labels"
