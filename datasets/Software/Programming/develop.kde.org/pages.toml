["https://develop.kde.org/hig/icons/monochrome/action"]
title = "Action Icons | Developer"
description = """
Action icons are used to depict actions. They come in two sizes: 16px and 22px, and always use the monochrome style.
Purpose Action icons indicate actions that a user is able to take on on-screen elements. They allow a user to intuit the behavior of controls.
Design Color Action icons should use a base color of Shade Black. Additional colors can indicate information about an action to a user."""
full_description = "KDE Human Interface GuidelinesMonochromatic IconsAction IconsAction IconsAction icons are used to depict actions. They come in two sizes: 16px and 22px, and always use the monochrome style.PurposeAction icons indicate actions that a user is able to take on on-screen elements. They allow a user to intuit the behavior of controls.DesignColorAction icons should use a base color of Shade Black. Additional colors can indicate information about an action to a user.Use Shade Black as your icon's base — this color is neutral and has the most contrast against a white background.Don’t use a bright color for your icon’s base — this distracts the user without adding extra information to your icon.Use red to indicate destructive actions.Don't use red to indicate other types of actions — this will confuse the user as to what the actions do.Action icons are able to dynamically change their color based on context.Implementation details can be found at community.kde.org.MetaphorAppropriate and consistent metaphors should be used to inform a user about the action an icon represents.Use appropriate metaphors to indicate what an action does.Don't use inaccurate or conflicting metaphors — this will mislead your user and lead to frustration.AccessibilityWhen using actions icons to indicate an action, a textual name and description of the action should be provided for accessibility purposes. Screen readers can take advantage of this information to allow more people to use your application. Your local jurisdiction may also require that your application meet accessibility standards. Care should also be taken to reinforce information conveyed by an icon in multiple ways — not everyone is able to distinguish between all colors.Provide a name and description that describe what an icon's action does.Don't describe the icon's appearance — this is useless information that will make your application harder to use.Reinforce information in multiple ways to allow users with conditions such as colorblindness to get the message.Don't only rely on color to convey information — this makes it harder for users with colorblindness to distinguish two like icons apart.NextEmblem Icons"
