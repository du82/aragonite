title = ""
full_description = "KPlataforma de desarrollo de KDEDiseñe, compile y distribuya aplicaciones atractivas y usables con las tecnologías de KDE.DiseñoConozca las directrices de diseño de KDE para aplicaciones e iconos.DesarrolloConsulte las herramientas y bibliotecas que le ayudarán a crear aplicaciones de KDE.DistribuciónPonga su aplicación al alcance de los usuarios.MultiplataformaDesarrolle una vez, implemente en todas partes. Construidas sobre Qt, las tecnologías de KDE funcionan en todas las plataformas.Escritorio de Linux, Android, Window, macOS, integradas y más KDE Frameworks: Mejora la experiencia de QtKDE Frameworks contiene 80 bibliotecas complementarias para programar con Qt. Todas las bibliotecas se han probado minuciosamente en escenarios del mundo real y están exhaustivamente documentadas. Las bibliotecas de KDE se distribuyen bajo las licencias LGPL o MIT.Saber másKFramework de interfaz de usuario KirigamiKirigamiCree aplicaciones atractivas y convergentes que se ejecuten en teléfonos, televisores y en cualquier cosa entre ambos.La línea entre escritorio y móvil se está diluyendo y los usuarios esperan la misma calidad de experiencia en cualquier dispositivo. Las aplicaciones que usan Kirigami se adaptan de una forma brillante al móvil, el escritorio, el televisor, sistemas de infoentretenimiento y cualquier cosa entre ellos.Los componentes de Kirigami tienen buen aspecto y son consistentes, mientras que el propio Kirigami proporciona un flujo de trabajo claramente definido. Los usuarios de aplicaciones Kirigami apreciarán las inteligentes elecciones realizadas en la API y el despejado diseño.Descubra KirigamiKDevelopUn IDE multiplataforma para C, C++, Python, QML/JavaScript y PHPDe código abierto, potente y rápido, KDevelop ofrece un entorno de desarrollo perfecto para los programadores que trabajan en proyectos de cualquier tamaño. KDevelop le ayuda a realizar su trabajo sin estorbarle.Obtener KDevelopDocumentaciónDesde principiantes hasta experimentados desarrolladores de Qt, esto es todo lo que necesita para saber cómo empezar a desarrollar aplicaciones de KDE.Primeros pasosAprenda lo básico y cree su primera aplicación de KDEKirigamiCree aplicaciones atractivas y convergentes que se ejecuten en teléfonos, televisores y en cualquier cosa entre ambos."
