["https://develop.kde.org/docs/getting-started/kirigami"]
title = "Getting started with Kirigami | Developer"
description = "Learning to create your first applications using Kirigami"
full_description = "DocumentationGetting startedKirigamiGetting started with KirigamiLearning to create your first applications using KirigamiThis tutorial will guide you through the process of creating your own convergent application using the Kirigami framework. A convergent application, in this context, means people can use the program easily regardless of the device it is running on. If it is on a desktop computer, it will adapt to a large screen and a mouse and keyboard; if it is being used on a mobile device, it will accept input from a touchscreen and adapt to a smaller portrait screen. And so on.Kirigami is built on top of the QML language and Qt Quick Controls 2 components provided by the Qt project. QML has built in support for touch systems, which makes it ideal for mobile apps. Qt Quick components are reusable visual items we can use when building our applications' interfaces. Kirigami is a set of Qt Quick components designed for creating convergent applications.While you will use QML to create the visual part of your application, the business logic—the code that does the heavy lifting for your application's functionality—should be written in a different language. We will also explore how to integrate our business logic with our UI in the tutorials below.First, you will need to set up a new project in a language of your choice. The introduction will show you how to make a small, but functional Kirigami application.You will be shown the basics of how to deal with colors and text in your application, and you will get acquainted with most QML components. Next, you will get acquainted with most of the QML components you might want to use and how they look like. This section won't touch any business logic at all, only QML code.You will get a deep dive into more advanced topics that concern manipulating the data that will be shown in your program.Lastly, you will be presented with Kirigami Addons, a series of quality-of-life components that you can use to, among other things, design the Settings of your application.SetupKirigami with C++Getting ready to create our first Kirigami applicationIntroductionExplaining pagesPages allow you to organize your application contentLayouts, ListViews, and CardsFiguring out the different ways of placing things on a pageAdding actionsLearning more about Kirigami's Actions will help us make our application more useful.Adding a dialogGetting to grips with Kirigami dialogs.Using separate files in a C++ projectSeparating unwieldy code into different files, and attach signals to your components.Next stepsWhat to do after finishing your first simple Kirigami applicationStyleColors and themes in KirigamiMake your app follow your user color schemeTypographyLaying out your contentComponentsActions based componentsKirigami's Actions are used to add functionality to components.Page rows and page stacksAdd flow to your application: Add, remove and replace pages in different waysScrollable pages and list viewsScrollable pages are useful when combined with vertical components or dynamic components such as List Views.CardsA card serves as an overview and entry point for more detailed information and can offer direct access to the most important actions of an item.DrawersDrawers provide applications with quick access to controls and pages of your application.ChipsChips are small elements typically used to list out related properties.Dialog typesVarious ways to serve and input data.Controls and interactive elementsMake your apps more interactive by using buttons, selection controls, sliders, and text fields.Form layoutsEasily create attractive interaction areas with Kirigami FormLayoutsInline messagesDisplay messages related to the content in your applicationAction toolbarsCreate your own customisable tool bars with the ActionToolBar componentProgress bars and indicatorsProvide your users with loading state information using progress bars.List viewsA list view can help you easily display many components dynamically.AdvancedUnderstanding CMakeListsGetting to grips with how CMakeLists.txt files workFiguring out main.cppUnderstanding the central file of our backend codeAbout pageInformations about your applicationManipulating dataConnect C++ models to your QML user interfaceData from the C++ backend to the QML frontendConnect logic to your QML user interfaceConnect a backend to do calculations and supply your user interface with data to displayKirigami AddonsIntroduction to Kirigami AddonsGet acquainted with Kirigami Addons componentsFormCard About pagesLearn to create About pages to credit your application.Form delegates in your settings pagesCreate elegant custom settings pages."
