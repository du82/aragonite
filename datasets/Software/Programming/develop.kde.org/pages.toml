["https://develop.kde.org/docs/packaging/android"]
title = "KDE on Android | Developer"
description = "Learn how to port your applications to the most widely used mobile platform"
full_description = "DocumentationPackagingAndroidKDE on AndroidLearn how to port your applications to the most widely used mobile platformAbstractAndroid is currently the largest mobile platform regarding market share and number of application, so supporting it is an excellent opportunity for gaining many users for our applications.Qt supports building for Android, as do many of the KDE frameworks. Using this foundation, there is a good chance an application will be buildable for android. The usability of the application depends on different factors. As a general rule of thumb, applications using QtWidgets do not work well on Android, since their user interfaces are not well-suited for smaller screens. For applications developed using QML, the quality depends on how well the user interface adapts to different screen sizes. Ideally, the application uses Kirigami, which enables user interfaces that adapt well to different form-factors.ContactFor questions and discussion around KDE software on Android join our Matrix channel and mailing list.Getting ApplicationsStable releases of our Android apps are available on KDE's Android Release Builds F-Droid repository. Some apps are also available on Google Play.Nightly builds of our apps are available on KDE's Android Nightly Builds F-Droid repository. Alternatively, they can be downloaded from KDE's GitLab by browsing the build artifacts of the project's craft_android_* jobs.If you want to install an application from one of KDE's F-Droid repositories then you have to add the repository as a package source to your F-Droid client using the URL or the QR code displayed on the pages linked above.Publishing ApplicationsEvery Android application built on KDE's GitLab is published in KDE's F-Droid repositories. For details see the tutorial on packaging and publishing applications for Android.Building applications for AndroidLearn how to build your applications for AndroidPackaging and publishing applications for AndroidLearn how to package and publish your applications for AndroidPublishing applications on Google PlayLearn how to publish your applications on Google PlayPorting Applications to AndroidLearn how to port your applications to the most widely used mobile platform"
