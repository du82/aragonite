["https://develop.kde.org/es/hig"]
title = "Directrices de interfaz humana de KDE |"
description = """
¡Bienvenido a las «Directrices de interfaz humana de KDE»! Seguirlas le ayudará a crear una aplicación bonita y potente que se sentirá como en casa cuando se ejecuta en KDE Plasma y funcionará bien fuera de él. Los usuarios aprenderán a usar su aplicación rápidamente, cumpliendo sus objetivos con facilidad, y encontrarán menos problemas que requieran asistencia.
Este documento cubre la filosofía de diseño y la cultura de KDE, flujos de trabajo y patrones comunes, convenciones estándares de la interfaz de usuario y recomendaciones para la integración con la plataforma."""
full_description = "Directrices de interfaz humana de KDEDirectrices de interfaz humana de KDE¡Bienvenido a las «Directrices de interfaz humana de KDE»! Seguirlas le ayudará a crear una aplicación bonita y potente que se sentirá como en casa cuando se ejecuta en KDE Plasma y funcionará bien fuera de él. Los usuarios aprenderán a usar su aplicación rápidamente, cumpliendo sus objetivos con facilidad, y encontrarán menos problemas que requieran asistencia.Este documento cubre la filosofía de diseño y la cultura de KDE, flujos de trabajo y patrones comunes, convenciones estándares de la interfaz de usuario y recomendaciones para la integración con la plataforma.¿Por qué es tan importante un buen diseño?El diseño determina lo bien que algo cumple su propósito funcional, así como lo agradable que resulta interactuar con ello. Si algo de esto falla, el resultado será frustrante. Las personas no querrán usar una aplicación mal diseñada y, si se ven obligadas a hacerlo, se resentirán y difundirán negatividad al respecto. ¡Evítelo mediante un buen diseño!El diseño implica decisiones específicas y compensaciones que acercan un proyecto a sus objetivos previstos y paradigmas de uso. Las mejores aplicaciones saben a qué usuarios y casos de uso están enfocadas, y cuáles dejan para otros. Es mejor tener éxito concentrándose en lo que se puede hacer bien que extenderse y fracasar. Pocas promesas y muchas entregas, nunca al revés.Temas no cubiertosEste documento es un conjunto de directrices de diseño, no las instrucciones para implementar cada componente específico. Si bien se proporcionará cierta orientación técnica, se pueden encontrar muchos más detalles en el uso y la documentación de la API de los propios componentes, así como en el código fuente de las aplicaciones de KDE. Es más un qué y un por qué, no un cómo.Este documento no pretende ser un estricto código legal. Al aprender y seguir las reglas, comprenderá cómo innovar de manera segura dentro de las directrices y cuándo puede ser apropiado romperlas si se obtiene un resultado superior.ColaboraciónEste es un documento vivo, destinado a actualizarse a lo largo del tiempo para reflejar las tendencias y las mejores prácticas de diseño actual de KDE. ¡Las colaboraciones son bienvenidas!El contenido está escrito en Markdown y los archivos fuente residen en un repositorio Git. Para editar rápidamente una página, se puede abrir el editor de GitLab en cualquier página con el botón «Editar esta página» que hay a la derecha. Las tareas y las modificaciones se organizan mediante https://invent.kde.org. Para aprender a enviar cambios, consulte el archivo README.Leer las directricesPulse en cualquiera de esos apartados para ir a una página:"
