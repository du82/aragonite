["https://develop.kde.org/sv/hig"]
title = "KDE:s riktlinjer för mänskliga gränssnitt |"
description = """
Välkommen till KDE:s riktlinjer för människa-maskin-gränssnitt! Att följa dem hjälper dig att bygga ett snyggt och kraftfullt program som känns hemma i KDE Plasma, och fungerar bra utanför det. Användare lär sig snabbt att använda det, uppnå sina mål med lätthet och stöta på färre problem som kräver support.
Det här dokumentet täcker KDE:s designfilosofi och kultur, vanliga arbetsflöden och mönster, standardkonventioner för användargränssnitt och rekommendationer för plattformsintegration."""
full_description = 'KDE:s riktlinjer för mänskliga gränssnittKDE:s riktlinjer för mänskliga gränssnittVälkommen till KDE:s riktlinjer för människa-maskin-gränssnitt! Att följa dem hjälper dig att bygga ett snyggt och kraftfullt program som känns hemma i KDE Plasma, och fungerar bra utanför det. Användare lär sig snabbt att använda det, uppnå sina mål med lätthet och stöta på färre problem som kräver support.Det här dokumentet täcker KDE:s designfilosofi och kultur, vanliga arbetsflöden och mönster, standardkonventioner för användargränssnitt och rekommendationer för plattformsintegration.Varför är bra design så viktigt?Design avgör inte bara hur väl något uppfyller sitt funktionella syfte, utan också hur njutbart det är att interagera med. Om någondera saknas blir resultatet frustrerande. Folk vill inte använda ett dåligt utformat program, och om de tvingas till det blir de förbittrade och sprider negativitet om det. Undvik det genom bra design!Design innebär riktade beslut och avvägningar som för ett projekt närmare dess avsedda mål och användningsparadigm. De bästa programmen vet vilka användare och användningsfall de riktar sig till och vilka de lämnar åt andra. Det är bättre att lyckas genom att fokusera på vad du kan göra bra än att sprida sig för brett och misslyckas. Lova lite och leverera mer, aldrig tvärtom.Ämnen som inte tas uppDokument är en uppsättning riktlinjer för design, inte instruktioner för implementering av varje specifik komponent. Även om viss teknisk vägledning tillhandahålls, kan mycket mer information hittas i komponenternas egen användning och API dokumentation samt källkoden för befintliga KDE-program. Det är mer ett vad och ett varför, inte ett hur.Dokumentet är inte avsett att vara en oangripbar lag. Genom att lära dig och följa reglerna förstår du hur du säkert kan förnya dig inom riktlinjerna och när det kan vara lämpligt att bryta mot dem om det ger ett överlägset resultat.BidraDet här är ett levande dokument, avsett att uppdateras med tiden för att återspegla aktuella KDE-designtrender och bästa praxis. Bidrag är välkomna!Innehållet är skrivet i Markdown, och källfilerna finns i ett [Git-arkiv](https://invent.kde.org/documentation/develop-kde-org .git). För att snabbt redigera en sida kan editorn i GitLab öppnas på vilken sida som helst med knappen "Edit this page" i lådan till höger. Uppgifter och ändringar organiseras via https://invent.kde.org. För att lära dig hur du skickar in ändringar, se README-filen.Läs riktlinjernaKlicka på någon av rutorna för att gå till en sida:'
