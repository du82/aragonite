["https://develop.kde.org/ko"]
title = ""
full_description = "KKDE 개발 플랫폼KDE 기술을 사용하여 아름답고 사용하기 편한 앱을 설계, 개발, 배포하십시오.디자인KDE의 앱과 아이콘 디자인 가이드라인 알아보기개발KDE 앱을 만들 때 필요한 도구와 라이브러리 알아보기배포내 앱을 사용자에게 배포하기멀티 플랫폼한 번 개발하고 여러 곳에 배포하십시오. Qt를 기반으로 하는 KDE 기술은 어느 플랫폼에서도 작동합니다.데스크톱 리눅스, Android, Windows, macOS, 임베디드, 그리고 더 KDE 프레임워크: Qt 경험 강화KDE 프레임워크는 Qt 프로그래밍에 사용할 수 있는 80여 개의 추가 기능 라이브러리입니다. 모든 라이브러리는 실제 상황에서 사용할 수 있도록 테스트되었으며 모든 부분이 문서화되어 있습니다. KDE 라이브러리는 LGPL이나 MIT 라이선스로 배포됩니다.더 알아보기KKirigami UI 프레임워크Kirigami휴대폰, TV, 그 사이에 있는 모든 것에서 실행되는 아름답고 통합된 앱을 개발하십시오.데스크톱과 모바일 사이의 경계선은 점점 흐려지고 있으며, 사용자들은 모든 장치에서 비슷한 사용자 경험을 기대하고 있습니다. Kirigami를 사용하는 앱은 모바일, 데스크톱, TV, 인포테인먼트 시스템뿐만 아니라 그 사이에 있는 어떤 것에도 융합됩니다.Kirigami의 구성 요소는 미적인 요소뿐만 아니라 일관성도 고려되었으며, Kirigami 자체적으로도 작업의 흐름을 정합니다. Kirigami 앱을 사용해 보았다면 API 설계 방식과 번잡하지 않은 디자인을 높게 살 것입니다.Kirigami 둘러보기KDevelopC, C++, Python, QML/자바스크립트, PHP 등을 지원하는 크로스 플랫폼 통합 개발 환경오픈 소스, 강력함, 빠름. KDevelop은 어떠한 크기의 프로젝트라도 편하게 개발할 수 있는 통합 개발 환경을 제공합니다. KDevelop을 사용하여 집중을 잃지 않고 작업을 완료할 수 있습니다.KDevelop 설치문서초보자부터 전문 Qt 개발자까지 모두가 참조할 수 있는 KDE 앱 개발을 시작할 때 필요한 자료입니다.Getting StartedLearn the basics and create your first KDE applicationKirigami휴대폰, TV, 그 사이에 있는 모든 것에서 실행되는 아름답고 통합된 앱을 개발하십시오."
