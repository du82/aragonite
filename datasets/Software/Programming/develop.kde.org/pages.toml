["https://develop.kde.org/docs/administration/kiosk/keys"]
title = "Kiosk keys | Developer"
description = """
This article contains a listing of known keys that can be used with Kiosk and what they do. How to actually use these keys and other capabilities of Kiosk such as URL restrictions, creating assigning profiles, etc. is covered in the Introduction to Kiosk article.
Which configuration file to put these entries in depends on whether you wish to make them global to all applications or specific to one application. To make the restrictions valid for all applications, put them in kdeglobals. To enable a restriction for a specific applications place them in the application-specific configuration, e.g. konquerorrc for Konqueror."""
full_description = '''DocumentationSystem administrationKiosk - Simple configuration management for large deploymentKiosk keysKiosk keysThis article contains a listing of known keys that can be used with Kiosk and what they do. How to actually use these keys and other capabilities of Kiosk such as URL restrictions, creating assigning profiles, etc. is covered in the Introduction to Kiosk article.Which configuration file to put these entries in depends on whether you wish to make them global to all applications or specific to one application. To make the restrictions valid for all applications, put them in kdeglobals. To enable a restriction for a specific applications place them in the application-specific configuration, e.g. konquerorrc for Konqueror.Application Action RestrictionsThese keys disable actions that are commonly found in KDE applications. To use these actions, create a section in kdeglobals that looks like this:[KDE Action Restrictions][$i] action/<key>=falseKeyMenuActionaction/file_newFileNewaction/file_openFileOpenaction/file_open_recentFileOpen Recent Fileaction/file_saveFileSaveaction/file_save_asFileSave Asaction/file_revertFileRevertaction/file_closeFileCloseaction/file_printFilePrintaction/file_print_previewFilePrint Previewaction/file_mailFileEmail Fileaction/file_quitFileQuitaction/edit_undoEditUndoaction/edit_redoEditRedoaction/edit_cutEditCutaction/edit_copyEditCopyaction/edit_pasteEditPasteaction/edit_select_allEditSelect Allaction/edit_deselectEditDeselectaction/edit_findEditFindaction/edit_find_nextEditFind Nextaction/edit_find_lastEditFind lastaction/edit_replaceEditReplaceaction/view_actual_sizeView100% Zoomaction/view_fit_to_pageViewFit To Page (zooming)action/view_fit_to_widthViewFit To Width (zooming)action/view_fit_to_heightViewFit To Height (zooming)action/view_zoom_inViewZoom Inaction/view_zoom_outViewZoom Outaction/view_zoomViewZoomaction/view_redisplayViewRefreshaction/go_upGoUpaction/go_backGoBackaction/go_forwardGoForwardaction/go_homeGoHomeaction/go_previousGoPreviousaction/go_nextGoNextaction/go_gotoGoGo To...action/go_goto_pageGoGo To Page...action/go_goto_lineGoGo To Line...action/go_firstGoGo To Startaction/go_lastGoGo To Endaction/bookmarksBookmarksAlso disables action/bookmark_add and action/bookmark_editaction/bookmark_addBookmarksAdd Bookmarkaction/bookmark_editBookmarksEdit Bookmarksaction/tools_spellingToolsCheck Spellingaction/options_show_menubarSettingsShow/hide Menubaraction/options_show_toolbarSettingsShow/hide Toolbar, will also disable the "Toolbars" submenu if presentaction/options_show_statusbarSettingsShow/hide statusbaraction/options_save_SettingsSettingsSave Settingsaction/options_configureSettingsConfigure applicationaction/options_configure_keybindingSettingsConfigure Shortcutsaction/options_configure_toolbarsSettingsConfigure Toolbarsaction/options_configure_notificationsSettingsConfigure Notificationsaction/fullscreenSettingsEnter full screen modeaction/helpHelpNot yet fully implementedaction/help_contentsHelpApplication handbookaction/help_whats_thisHelpGo into "what's this" modeaction/help_report_bugHelpReport a bugaction/help_about_appHelpShow about application dialogaction/help_about_kdeHelpShow about KDE dialogKCalcBy marking the kcalcrc config file as immutable, the "Configure" button will not be shown.File ManagerKeyActionaction/editfiletypeEdit associated applicationsaction/propertiesFile propertiesaction/openwithOpen file with actionaction/openintabOpen link in a new tabaction/kdesktop_rmbRMB menu, see note belowaction/iconview_previewShow preview thumbnails in icons, though it leaves the actual setting untouched. To disable previews (as opposed to simply disabling the user to change the setting) you also need to add the following lines to konqiconviewrc:[Settings] PreviewsEnabled[$i]=falseaction/sharefileDisables file sharing from the UI, but you may also want to disable filesharing altogether.action/sendURLSend Link Addressaction/sendPageSend Fileaction/devnewCreate New -> Deviceaction/incIconSizeIncrease icon sizeaction/decIconSizeDecrease icon sizeaction/goEntire go menuaction/configdesktopConfigure desktop in RMB menu, see also Control Module Restrictionsaction/executeshellcommandIn Konqueror Tools menu, see also shell_accessaction/show_dotDisables the option to toggle showing hidden files, the actual setting remains unaffected. To disable showing hidden files, add the following lines to konqiconviewrc:[Settings] ShowDotFiles[$i]=falseKonsoleThese keys can appear in kdeglobals, konsolepartrc or konsolerc.KeyActionaction/konsole_rmbContext menusaction/settingsDisable the entire settings menuaction/show_menubarShow/hide the menubaraction/show_toolbarShow/hide the toolbaraction/scrollbarShow/hide the scrollbaraction/bellConfigure bell actionsaction/fontConfigure fontaction/keyboardSet keyboard typeaction/schemaSelect the schema to useaction/sizeSet the terminal sizeaction/historyConfigure historyaction/save_defaultSave settings as defaultsaction/save_sessions_profileSave sessions profileaction/send_signalSend a signal to the current terminalaction/bookmarksBookmarks menuaction/add_bookmarkAdd a bookmarkaction/edit_bookmarksEdit bookmarksaction/clear_terminalClear the current terminalaction/reset_clear_terminalClear and reset the current terminalaction/find_historyFind in historyaction/find_nextFind next item in historyaction/find_previousFind previous item in historyaction/save_historySave history to diskaction/clear_historyClear history of current terminalaction/clear_all_historiesClear histories of all terminalsaction/detach_sessionDetach current tabaction/rename_sessionRename current sessionaction/zmodem_uploadZModem uploadingaction/monitor_activityMonitor current terminal for activityaction/monitor_silenceMonitor current terminal for silenceaction/send_input_to_all_sessionsReplicate input to all sessionsaction/close_sessionClose current terminal sessionaction/new_sessionCreate a new terminal sessionaction/activate_menuActivate menubaraction/list_sessionsSession list menuaction/move_session_leftShift tab to the leftaction/move_session_rightShift tab to the rightaction/previous_sessionGo to tab to the leftaction/next_sessionGo to tab to the rightaction/switch_to_session_#Go to tab numbered #, where # is a number between 1 and 12 inclusive.action/bigger_fontIncrease font sizeaction/smaller_fontDecrease font sizeaction/toggle_bidiTurn bidirectional text support on or offKWinKeyActionaction/kwin_rmbContext menus on window titlebar and framePlasmaLocking down the entire config with [$i] will cause everything to be immutable. Locking a Containment group will render that one group of widgets to be immutable, and locking a widget itself will cause it to not be movable as well as otherwise locked. In addition, the following resource restrictions are available:KeyActionplasma/allow_configure_when_locked (since Plasma 4.4)Whether widgets and containments can be configured when immutable / locked. The default is true as a convenience to users.plasma/containment_actions (since KDE Frameworks 5.49)Whether or not to allow Plasma mouse actions on desktop and panels (most notably context menus, but also mouse wheel to switch virtual desktops, etc.)plasma/plasmashell/unlockedDesktop (since Plasma 5.0)Whether to allow widgets in Plasma to be unlocked; when false, the following restrictions apply:Widgets cannot be unlockedFavorites and applications in the application launchers cannot be added, removed, rearranged, or otherwise altered (since Plasma 5.7)Application launchers in the task manager cannot be added or removed (since Plasma 5.8)plasma-desktop/scripting_console (since Plasma 4.4)Whether the plasma desktop scripting console is accessible or not.plasma-desktop/add_activities (>= 4.7.1)Whether the user may add new activities or not.GHNSPlasma offers to download new widgets, wallpapers, scripts, and other 3rd party add-ons from the KDE Store using the KNewStuff (aka "Get Hot New Stuff") framework. The buttons are typically labeled "Get New ..." with a "star" icon. If this feature is undesirable it can be disabled using the following key:KeyActionghns (since KDE Frameworks 5.27)Whether the Download Dialog of Get Hot New Stuff can be accessedAuthorizingApplication .desktop files can have an additional field X-KDE-AuthorizeAction.If this field is present the .desktop file is only considered valid if the action(s) mentioned in this field has been authorized. If multiple actions are listed they should be separated by commas (',').If the .desktop file of an application lists one or more actions this way and the user has no authorization for even one of these actions then the application will not appear in the KDE menu, will not allow execution via that .desktop file and will not be used by KDE for opening files of associated mimetypes.File DialogThese keys disable actions that are found in the KDE file dialog. To use them, create a section in kdeglobals that looks like this:[KDE Action Restrictions][$i] action/<key>=falseKeyActionaction/homeGo to home directoryaction/upGo to parent directoryaction/backGo to previous directoryaction/forwardGo to next directoryaction/reloadReload directoryaction/mkdirCreate new directoryaction/toggleSpeedbarShow/hide sidebaraction/sorting menuSorting optionsaction/short viewSelect short viewaction/detailed viewSelect detailed viewaction/show hiddenShow/hide hidden filesaction/previewShow/hide previewaction/separate dirsShow/hide separate directoriesPrintingThere are several keys that restrict various aspects of the KDE print dialog and printing system. To use them, create a configuration section like this:[KDE Resource Restrictions][$i] print/<resource key>=falseNote how each of the printing keys start with print in the configuration file.KeyActionprint/copiesDisables the panel that allows users to make more than one copy.print/dialogDisables the complete print dialog. Selecting the print option will immediately print the selected document using default settings. Make sure that a system-wide default printer has been selected. No application-specific settings are honored when this restriction is activated.print/optionsDisables the button to select additional print options.print/propertiesDisables the button to change printer properties or to add a new printer.print/selectionDisables the options that allows selecting a (pseudo) printer or change any of the printer properties. Make sure that a proper default printer has been selected before disabling this option. Disabling this option also disables print/system, print/options and print/properties.print/systemDisables the option to select the printing system backend, e.g. CUPS. It is recommended to disable this option once the correct printing system has been configured.Resource RestrictionsKDE applications can take advantage of many types of resources such as configuration data, caches, plugin registries, etc. These are loaded from both system-wide as well as from per-user locations on disk. It is possible to restrict the use of the per-user resources directories, preventing users from adding to or altering existing shared resources.This is accomplished by creating a section like this in a configuration file:[KDE Resource Restrictions][$i] <resource key>=falseThe following resources can be used as keys and controlled in this manner:KeyDirectoryProvidesalln/aAll resources listed in this tableautostartshare/autostartApps to start on logindatashare/appApplication datadata_<appname>share/appsApplication data for the application named htmlshare/doc/HTMLHTML filesiconshare/iconIconsconfigshare/configApplication configurationspixmapshare/pixmapsImagesxdgdata-appsshare/applicationApplication .desktop filessoundshare/soundSound fileslocaleshare/localeLocalization dataservicesshare/servicesProtocols, plugins, kparts, control panels, etc. registryservicetypesshare/servicestypesPlugin definitions, referenced in services registry entriesmimeshare/mimelnkMimetype definitionswallpapershare/wallpapersDesktop wallpaper imagestemplatesshare/templatesDocument templatesexebinExecutable filesliblibLibrariesScreensaversIn kdeglobals in the [KDE Action Restrictions] group:KeyActionopengl_screensaversDefines whether OpenGL screensavers are allowed to be used.manipulatescreen_screensaversDefines whether screensavers that manipulate an image of the screen (e.g. moving chunks of the screen around) are allowed to be used.Automatic logoutIn kscreensaverrc:[ScreenSaver] AutoLogout=true AutoLogoutTimeout=600The timeout is the time in seconds that the user must be idle for before the logout process is automatically started. Be careful with this capability as it can lead to data loss if the user has unsaved files open.Session Capability RestrictionsThese keys apply to various capabilities associated with a desktop session and are not application specific. To use them, create a section in kdeglobals that looks like this:[KDE Action Restrictions][$i] <key>=falseKeyActioncustom_configWhether the --config command line option should be honored. The --config command line option can be used to circumvent locked-down configuration files.editable_desktop_iconsDefines whether icons on the desktop can be moved around. In order to prevent adding, removing, or renaming icons, you should set the desktop folder read-only. *(since Plasma 5.14)lineedit_text_completionDefines whether input lines should have the potential to remember any previously entered data and make suggestions based on this when typing. When a single account is shared by multiple people you may wish to disable this out of privacy concerns.lineedit_reveal_passwordDefines whether password input fields may have a button that allows showing the password in plain text. *(since KDE Frameworks 5.30 and/or Plasma 5.9)action/lock_screenDefines whether the user will be able to lock the screen.logoutDefines whether the user will be able to logout from the Plasma session.movable_toolbarsDefines whether toolbars may be moved around by the user. See also action/options_show_toolbar.run_commandDefines whether the "Run Command" (Alt-F2) option is available. Note: To also disable desktop context menu run command action/run_command is required at [KDE Action Restrictions]run_desktop_filesDefines whether users may execute desktop files that are not part of the default desktop, KDE menu, registered services and autostarting services.The default desktop includes the files under .local/share/kdesktop/Desktop but not the files under $HOME/Desktop.The KDE menu includes all files under $KDEDIR/share/applnk and $XDGDIR/applicationsRegistered services includes all files under $KDEDIR/share/servicesAutostarting services include all files under $KDEDIR/share/autostart but not the files under $KDEHOME/Autostartshell_accessWhether a shell suitable for entering random commands may be started. This also determines whether the "Run Command" option (Alt-F2) can be used to run shell-commands and arbitrary exec'''
