title = "XDG Portal Pre-Authorization | Developer"
description = "Pre-authorize applications to allow usage of XDG portal tech without interactive dialogs"
full_description = '''DocumentationSystem administrationXDG Portal Pre-AuthorizationXDG Portal Pre-AuthorizationPre-authorize applications to allow usage of XDG portal tech without interactive dialogsThis feature was introduced in Plasma 6.3.IntroductionInteractive permission prompts are nice, but sometimes users need to authorize access to resources non-interactively.To solve this, we have a bespoke permission table named kde-authorized in the standard xdg-desktop-portal permission store. Inside this table the user may store pre-authorization to bypass the interactive workflow. To authorize a well-known application, the user can pass the app_id to the set command:flatpak permission-set kde-authorized remote-desktop org.kde.krdpserver yesTo authorize a host application without an app_id, an empty app_id may be provided:flatpak permission-set kde-authorized remote-desktop "" yesUsually the app_id is obtained from flatpak/snap metadata. For host applications, it is obtained from the systemd unit name:For applications that get started by Plasma, those will be set up correctly.For manually created units, the https://systemd.io/DESKTOP_ENVIRONMENTS/ spec should be followed (i.e. name the unit app-org.kde.appname.service).When the name cannot be determined, the empty app_id is used.Supported Typesremote-desktopCaveatsHost applications may impersonate any app_idThe empty app_id may match too broadly. It's advisable to get the application to provide an app_id instead. See https://systemd.io/DESKTOP_ENVIRONMENTS/. In the future possibly also via https://github.com/flatpak/xdg-desktop-portal/pull/1521.'''
year_published = 2025
