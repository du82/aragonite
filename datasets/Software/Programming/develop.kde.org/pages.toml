full_description = "KKDE Developer PlatformDesign, build and distribute beautiful, usable applications with KDE technologies.DesignLearn about KDE's design guidelines for apps and iconsDevelopCheck out the tools and libraries that help you build KDE appsDistributeGet your application in front of usersMulti-PlatformDevelop once, deploy everywhere. Built on top of Qt, KDE's technologies work on every platform.Desktop Linux, Android, Windows, macOS, embedded, and more KDE Frameworks: Enhance the Qt ExperienceKDE Frameworks cover 80 add-on libraries for programming with Qt. All libraries have been well-tested in real world scenarios and are comprehensively documented. KDE's libraries are distributed under LGPL or MIT licenses.Learn MoreKKirigami UI FrameworkKirigamiBuild Beautiful, Convergent Apps that Run on Phones, TVs and Everything in Between.The line between desktop and mobile is blurring and users expect the same quality experience on every device. Applications using Kirigami adapt brilliantly to mobile, desktop, TVs, infortainment systems and everything in between.Kirigami's components are goodlooking and consistent, and Kirigami itself provides a clearly defined workflow. Users of Kirigami apps will appreciate the smart choices made in the API and uncluttered design.Discover KirigamiKDevelopA cross-platform IDE for C, C++, Python, QML/JavaScript and PHPOpen Source, powerful and fast, KDevelop offers a seamless development environment to programmers that work on projects of any size. KDevelop helps you get the job done while staying out of your way.Get KDevelopDocumentationFrom beginners to experienced Qt developers, here is all you will need to know to start developing KDE applications.Getting StartedLearn the basics and create your first KDE applicationKirigamiBuild Beautiful, Convergent Apps that Run on Phones, TVs and Everything in Between."
