title = ""
full_description = "KKDE utvecklingsplattformSkapa, bygg och distribuera vackra, användbara program med KDE-teknologier.DesignTa reda på mer om KDE:s designriktlinjer för program och ikonerUtvecklaTa en titt på verktygen och biblioteken som hjälper till att skapa KDE-programFördelaLåt användare ta del av ditt programFör flera plattformarUtveckla en gång, utplacera överallt. Byggt på Qt, KDE:s teknologier fungerar på alla plattformar.Linux på en skrivbordsdator, Android, Windows, macOS, inbäddat, med mera KDE Ramverk: Förbättra upplevelsen av QtKDE Ramverk omfattar 80 tilläggsbibliotek för programmering med Qt. Alla bibliotek är väl utprovade i scenarier från verkligheten och har omfattande dokumentation. KDE:s bibliotek distribueras med LGPL- och MIT-licenser.Ta reda på merKKirigami ramverk för användargränssnittKirigamiBygg vackra, konvergerande program som kör på telefoner, teve-apparater och allt däremellan.Linjen mellan skrivbord och mobil suddas ut och användare förväntar sig samma upplevelsekvalitet på alla apparater. Program som använder Kirigami anpassar sig briljant till mobil, skrivbord, teve, infotainment och allt däremellan.Kirigamis komponenter ser bra ut och är likformiga, och själva Kirigami erbjuder ett klart definierat arbetsflöde. Användare av Kirigami-program uppskattar de smarta valen gjorda i programmeringsgränssnittet och den snygga designen.Upptäck KirigamiKDevelopEn integrerad utvecklingsmiljö på flera plattformar för C, C++, Python, QML/JavaScript och PHPKDevelop, med öppen källkod, kraftfullt och snabbt, erbjuder en sömlös utvecklingsmiljö för programmerare som arbetar med projekt av vilken storlek som helst. KDevelop hjälper till att få jobbet gjort medan det håller sig ur vägen.Hämta KDevelopDokumentationHär finns allt som man behöver veta för att börja utveckla KDE-program, från nybörjare till erfarna Qt-utvecklare.Komma igångLär dig grunderna och skapa ditt första KDE-programKirigamiBygg vackra, konvergerande program som kör på telefoner, teve-apparater och allt däremellan."
