["https://develop.kde.org/docs/features/akonadi/debugging_akonadi"]
title = "Debugging Akonadi Resources | Developer"
description = """
It is possible to debug a specific akonadi resource. This is done by restarting akonadi with specific environment variables. For example to debug the EWS resource:
Heaptrack (memory profiler) with AKONADI_HEAPTRACK=akonadi_ews_resource akonadictl restart to start the profiling and akonadictl stop to stop it. Valgrid (dynamic memory analysis tool) with the AKONADI_VALGRIND environment variable. By default, this uses the memcheck tool, but this can be changed with the AKONADI_VALGRIND_SKIN environment variable. More options can be passed with the AKONADI_VALGRIND_OPTIONS environment variable. Perf (CPU profiler) with the AKONADI_PERF environment variable. This can then be visualized with Hotspot. This variables are defined in akonadicontrol"""
full_description = 'DocumentationFeaturesPersonal Information ManagementDebugging Akonadi ResourcesDebugging Akonadi ResourcesIt is possible to debug a specific akonadi resource. This is done by restarting akonadi with specific environment variables. For example to debug the EWS resource:Heaptrack (memory profiler) with AKONADI_HEAPTRACK=akonadi_ews_resource akonadictl restart to start the profiling and akonadictl stop to stop it.Valgrid (dynamic memory analysis tool) with the AKONADI_VALGRIND environment variable. By default, this uses the memcheck tool, but this can be changed with the AKONADI_VALGRIND_SKIN environment variable. More options can be passed with the AKONADI_VALGRIND_OPTIONS environment variable.Perf (CPU profiler) with the AKONADI_PERF environment variable. This can then be visualized with Hotspot.This variables are defined in akonadicontrolDebugging the EWS resourceBy using the following logging rules, Akonadi will dump the content of the EWS responses to a temporary directory.QT_LOGGING_RULES="*org.kde.pim.ews*=true" akonadictl restartNextUsing Akonadi in applications'
