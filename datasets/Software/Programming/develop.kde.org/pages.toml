["https://develop.kde.org/sl"]
title = ""
full_description = "KRazvijalska platforma KDEOblikujte, gradite in razširjajte prekrasne, uporabne aplikacije s tehnologijami KDE.OblikovanjePreberite več o smernicah KDE za načrtovanje aplikacij in ikonRazvijajteOglejte si orodja in knjižnice, ki vam pomagajo zgraditi aplikacije KDERazširjajteSpravite aplikacijo pred uporabnikeZa različne platforme hkratiRazvijte enkrat, razmestite povsod. Tehnologije KDE, zgrajene na osnovi Qt, delujejo na vseh platformah.Namizni Linux, Android, Windows, macOS, vdelani sistemi in še več Ogrodje KDE Frameworks: izboljšajte izkušnjo QtOgrodja KDE zajemajo 80 knjižnic dodatkov za programiranje s Qt. Vse knjižnice so bile dobro preizkušene v realnem svetu in so celovito dokumentirane. Knjižnice KDE se razširjajo z dovoljenjem LGPL ali MIT.Preučite večKOgrodje za vmesnike KirigamiKirigamiZgradite krasne, konvergentne aplikacije, ki delujejo na telefonih, računalnikih in vsem vmes.Razmejitev med namizjem in mobilnim telefonom je vedno bolj zamegljena, uporabniki pa pričakujejo enako kakovostno izkušnjo na vsaki napravi. Aplikacije, ki uporabljajo Kirigami, se odlično prilagajajo mobilnim, namiznim, TV sistemom in vsemu vmes.Komponente Kirigamija so lepe in dosledne, Kirigami sam pa zagotavlja jasno opredeljen potek dela. Uporabniki aplikacij Kirigami bodo cenili pametne odločitve v API in izčiščenem oblikovanju.Odkrijte KirigamiKDevelopRazvojno okolje (IDE) za navzkrižne platforme v jezikih C, C++, Python, QML/JavaScript in PHPOdprto-koden, zmogljiv in hiter: KDevelop ponuja prijazno razvojno okolje programerjem, ki delajo na projektih poljubne velikosti. KDevelop vam pomaga opraviti delo, pri čemer vas pusti delati.Pridobi KDevelopDokumentacijaZa začetnike in izkušene razvijalce Qt je tukaj vse, kar boste rabili vedeti, da začnete razvijati aplikacije KDE.Kako začetiNaučite se osnov in ustvarite svojo prvo aplikacijo KDEKirigamiZgradite krasne, konvergentne aplikacije, ki delujejo na telefonih, računalnikih in vsem vmes."
