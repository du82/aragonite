["https://develop.kde.org/hig/icons/colorful/category_preferences"]
title = "Category and Preferences Icons | Developer"
description = "Purpose Category and preferences icons guide the user through an application. They appear in an application's navigation and configuration, guiding the user with icons to what they want to get to. While category and preferences icons should be distinct, all icons should be unified with the same design style."
full_description = "KDE Human Interface GuidelinesColorful IconsCategory and Preferences IconsCategory and Preferences IconsPurposeCategory and preferences icons guide the user through an application. They appear in an application's navigation and configuration, guiding the user with icons to what they want to get to. While category and preferences icons should be distinct, all icons should be unified with the same design style.DesignCategory and preferences icons always use the colorful icon style. Their only size is 32 pixels.When creating category and preferences icons, consider the following aspects of an icon:MetaphorYou should consider the metaphors being conveyed by your icon's design choices.Use symbols that evoke the metaphor of your icon's category.Don't use icons just for the sake of having different visuals per category — use meaningful metaphors that inform the user about their category.RecognizabilityCategory and preferences icons should be recognizable, yet connected.Keep icons unique, yet connected. This allows users to easily identify icons as unique members in a set.Don't make icons too similar to each other — this impairs the ability of users to distinguish them.CautionBe careful when making icons extremely unique from each other — they may not appear in contexts that inform users that they're related.PreviousMIME Type IconsNextPlaces Icons"
year_published = 2024
year_updated = 2024
