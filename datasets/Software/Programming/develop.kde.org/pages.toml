["https://develop.kde.org/docs/apps/kmines/theme"]
title = "Making a KMines theme | Developer"
description = "How to add a theme to KMines."
full_description = '''DocumentationApplicationsKMinesMaking a KMines themeMaking a KMines themeHow to add a theme to KMines.IntroductionThis short tutorial will show you how to add a theme to KMines. It is assumed that you already have a working dev environment, you are familiar with building KDE software using kde-builder, and you are able to use a vector editing program such as Inkscape and a raster editing program such as Krita to create and export images. You should already have a local copy of the KMines source via kde-builder kmines. By the end of this tutorial, you will know what is necessary to create a KMines theme, and how to include them in the KMines source code.Components of a KMines themeA KMines theme requires the following components:SVG theme - the actual SVG file.Theme preview - a 210 x 210 px PNG file that will be shown in Settings > Configure KMines > Themes.Theme .desktop file - a file containing information about your theme.Step one: Create your SVG theme fileThe easiest way to begin is to edit a copy of an existing theme in the KMines source code. If you have followed the kde-builder tutorial, the source code should be in ~/kde/src/kmines. Existing themes can be found in the themes/ directory.Elements of your theme are identified using their IDs. If you are editing your SVG in Inkscape, you can set the ID of an element by right clicking on the element you want to change and then clicking on "Object Properties…".To set an element ID:Select an element.Enter an IDClick "Set"List of IDsBorders:border.edge.northborder.edge.eastborder.edge.southborder.edge.westborder.outsidecorner.nwborder.outsidecorner.neborder.outsidecorner.seborder.outsidecorner.swNumbers:arabicOnearabicTwoarabicThreearabicFourarabicFivearabicSixarabicSevenarabicEightObjects:mineflagquestionhinterrorCells:cell_downcell_upexplosionBackground:mainWidgetStep two: Create a .desktop fileFor your KMines theme to be detected and shown on the KMines settings, you will need to create a .desktop file containing information about your theme. It should contain the following fields:[KGameTheme] Author= AuthorEmail= Copyright=2023 Your Name Description= FileName=your-svg-theme-name.svgz License=CC-BY-SA-4.0 Name= Preview=theme-preview.png Type=SVG Version=1.0After filling the required information, save the file in the themes/ folder.Step three: Add your files to CMakelistsIn themes/CMakeLists.txt, add your theme SVG and .desktop files.Step four: Create your preview imageNow you can build KMines and test your theme. When you're happy with it, create a 210 x 210px PNG preview image, and add this file to themes/CMakeLists.txt. Don't forget to update your theme's .desktop file with the new preview image.'''
