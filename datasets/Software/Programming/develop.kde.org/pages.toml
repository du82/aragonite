["https://develop.kde.org/it/hig"]
title = "Linee guida di interfaccia umana di KDE |"
description = """
Benvenuto nelle linee guida per l'interfaccia umana di KDE! Seguirle ti aiuterà a creare un'applicazione bella e potente che si senta a casa in un ambiente KDE Plasma e funzioni bene al di fuori di esso. Gli utenti impareranno a usarla rapidamente, raggiungeranno i loro obiettivi con facilità e incontreranno meno problemi che richiedono supporto.
Questo documento tratta la filosofia e la cultura di progettazione di KDE, i flussi di lavoro e i modelli comuni, le convenzioni dell'interfaccia utente standard e i consigli per l'integrazione della piattaforma."""
full_description = "Linee guida di interfaccia umana di KDELinee guida di interfaccia umana di KDEBenvenuto nelle linee guida per l'interfaccia umana di KDE! Seguirle ti aiuterà a creare un'applicazione bella e potente che si senta a casa in un ambiente KDE Plasma e funzioni bene al di fuori di esso. Gli utenti impareranno a usarla rapidamente, raggiungeranno i loro obiettivi con facilità e incontreranno meno problemi che richiedono supporto.Questo documento tratta la filosofia e la cultura di progettazione di KDE, i flussi di lavoro e i modelli comuni, le convenzioni dell'interfaccia utente standard e i consigli per l'integrazione della piattaforma.Perché la buona progettazione è così importante?La progettazione determina non solo quanto bene qualcosa soddisfi il suo scopo funzionale, ma anche quanto sia piacevole interagire con essa. Se manca uno dei due, il risultato sarà frustrante. Le persone non vorranno utilizzare un'applicazione mal progettata e, se costrette a farlo, proveranno risentimento e diffonderanno negatività al riguardo. Evitatelo attraverso una buona progettazione!La progettazione implica decisioni mirate e compromessi che avvicinano un progetto agli obiettivi previsti e ai paradigmi di utilizzo. Le migliori applicazioni sanno a quali utenti e casi d'uso si rivolgono e quali lasciano ad altri. È meglio avere successo concentrandoti su ciò che sai fare bene piuttosto che dilapidarti e non riuscire. Poche promesse e numerosi rilasci, mai il contrario.Argomenti non trattatiQuesto documento è un insieme di linee guida di progettazione, non istruzioni per l'implementazione di ogni componente specifico. Anche se saranno fornite alcune indicazioni tecniche, molti più dettagli possono sono disponibili nella documentazione di utilizzo e dell'API dei componenti, così come il codice sorgente delle applicazioni KDE esistenti. È più un cosa e un perché, non un come.Questo documento non vuole essere un codice di leggi ferree. Imparando e seguendo le regole, capirai come innovare in sicurezza nel rispetto delle linee guida e quando può essere opportuno infrangerle se ciò produce un risultato superiore.ContribuireQuesto è un documento vivo, destinato ad essere aggiornato nel tempo per riflettere le attuali tendenze e le migliori pratiche di progettazione di KDE. I contributi sono benvenuti!Il contenuto è scritto in Markdown e i file sorgente sono ospitati in un deposito Git. Per modificare rapidamente una pagina, l'editor di GitLab può essere aperto su qualsiasi pagina con il pulsante «Edit this page» nel cassetto a destra. Le attività e le modifiche sono organizzate tramite https://invent.kde.org. Per sapere come inviare modifiche, vedi il file README.Leggi le linee guidaFai clic su uno di questi riquadri per passare a una pagina:"
