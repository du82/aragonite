full_description = 'DocumentationSystem administrationSystem administrationLearn how to manage your systems with KDE technologies.KDE Plasma is a highly productive Linux desktop environment provided by the KDE community. Its motto is "Simple by default, powerful when needed", which speaks for its adaptability in multiple scenarios and for different use cases.After installing KDE Plasma, you can configure it to meet the needs of your users.This section includes tutorials on how to administrate your KDE Plasma systems, ranging from single users to deployment at large companies.Shell scripting with KDE dialogsCreate simple scripts for your users to use.Kiosk - Simple configuration management for large deploymentThe Kiosk framework provides a set of features that makes it possible to easily and powerfully restrict the capabilities of a KDE environment.XDG Portal Pre-AuthorizationPre-authorize applications to allow usage of XDG portal tech without interactive dialogs'
