["https://develop.kde.org/fr/hig"]
title = "Directives de KDE pour les interfaces Homme / Machine |"
description = """
Bienvenu dans les directives de l'interface homme /machine de KDE ! Les suivre vous aidera à créer une application élégante et puissante, s'intégrant parfaitement à un environnement deKDE Plasma et fonctionnant bien en dehors de celui-ci. Les personnes utilisatrices apprendront comment utiliser rapidement votre application, atteindre leurs objectifs avec facilité et à rencontrer le moins de problèmes nécessitant une assistance.
Ce document couvre la philosophie et la culture concernant la conception de KDE, les flux de travail, les modèles communs, les conventions d'interface utilisateur standard et les recommandations pour l'intégration de la plate-forme."""
full_description = "Directives de KDE pour les interfaces Homme / MachineDirectives de KDE pour les interfaces Homme / MachineBienvenu dans les directives de l'interface homme /machine de KDE ! Les suivre vous aidera à créer une application élégante et puissante, s'intégrant parfaitement à un environnement deKDE Plasma et fonctionnant bien en dehors de celui-ci. Les personnes utilisatrices apprendront comment utiliser rapidement votre application, atteindre leurs objectifs avec facilité et à rencontrer le moins de problèmes nécessitant une assistance.Ce document couvre la philosophie et la culture concernant la conception de KDE, les flux de travail, les modèles communs, les conventions d'interface utilisateur standard et les recommandations pour l'intégration de la plate-forme.Pourquoi une bonne conception est-elle si importante ?La conception détermine dans quelle mesure quelque chose remplit son objectif fonctionnel, mais aussi dans quelle mesure il est agréable d'interagir avec. Si l'un ou l'autre est absent, le résultat sera frustrant. Les personnes ne voudront pas utiliser une application mal conçue. Si elles y sont obligées, elles produiront du ressentiment et répandront des avis négatifs sur l'application. Veuillez éviter ces situations grâce à une conception élégante !La conception implique des décisions et des compromis ciblés permettant de rapprocher un projet de ses objectifs et de ses paradigmes d'utilisation. Les meilleures applications savent quelles personnes vont les utiliser et quels en sont les cas d'utilisation visés et les cas qu'elles laissent aux autres applications. Il est préférable de réussir en se concentrant sur ce que vous pouvez bien faire bien plutôt que de vous éparpiller et d'échouer. Promettre moins et fournir plus mais jamais l'inverse.Sujets non traitésCe document regroupe un ensemble de directives de conception et non des instructions pour la mise en œuvre de chaque composant spécifique. Bien que certaines directives techniques soient fournies, vous trouverez beaucoup plus de détails dans les documentations spécifiques à chaque composant et dans l'interface API ainsi que dans le code source des applications KDE existantes. C'est plus un quoi et un pourquoi, plutôt qu'un comment.Ce document n'est pas destiné à être un code juridique à toute épreuve. En apprenant et en suivant les règles, vous comprendrez comment innover en toute sécurité dans le respect des directives et quand il peut être approprié de les enfreindre si cela produit un meilleur résultat.ContributionsIl s'agit d'un document évolutif, destiné à être mis à jour au fil du temps pour refléter les tendances actuelles de la conception de KDE et les meilleures pratiques. Toutes les contributions sont les bienvenues !Le contenu est écrit en langage Markdown. Les fichiers sources sont hébergés dans un dépôt Git. Pour modifier rapidement une page, l'éditeur de GitLab peut être ouvert sur n'importe quelle page grâce au bouton dans le panneau de droite. Les tâches et les modifications sont organisées grâce aux services du site « https://invent.kde.org ». Pour savoir comment soumettre des modifications, veuillez consulter le fichier « README ».Lire les directivesCliquez sur l'une de ces tuiles pour accéder à une page :"
