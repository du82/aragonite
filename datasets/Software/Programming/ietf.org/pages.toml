["https://ietf.org/blog/wit-area"]
title = "IETF  | New IETF Area focuses on web and transport technologies"
description = "The new Web and Internet Transport (WIT) area covers protocols that provide the functions of the transport layer of the Internet, including congestion control and queue management, real-time communication, as well as protocols that implement the World Wide Web and adjacent technologies."
full_description = "IETF News Blog listing IETF Administration LLC 2025 Budget The IETF Administration LLC has finalised its budget for 2025. Jay Daley IETF Executive Director 22 Jan 2025 RFC Production Center management transition After an extensive review of recent developments in the RFC Editor function, the IETF Administration LLC (IETF LLC) and Association Management Solutions LLC (AMS) have agreed that the IETF LLC will assume management of existing RFC Production Center (RPC) staff, under an Employer of Record arrangement with AMS, the employer of the RPC team. Jay Daley IETF Executive Director 5 Jan 2025 Workshop on the Decentralization of the Internet at ACM CoNEXT 2024 The recent Decentralization of the Internet (DIN) workshop at ACM CoNEXT-2024 brought together network researchers, law and policy experts, and digital right activists to discuss the consolidation and centralization of the existing Internet applications, services, and infrastructure observed in recent years. Dirk Kutscher DINRG Co-chair Lixia Zhang DINRG Co-chair 19 Dec 2024 Launch of the IETF Community Survey 2024 The IETF Community survey is our major annual survey of the whole of the IETF community and is used to inform the actions of IETF leadership throughout the year. The 2024 IETF Community Survey is live and we want to hear from you! Jay Daley IETF Executive Director 19 Dec 2024 Second IASA2 Retrospective Report The IETF Administration LLC (IETF LLC) has now completed the second IETF Administrative Support Activity (IASA 2.0) retrospective. The report was developed with community input and review, and is now available online. Jason Livingood IETF Administration LLC Board Chair 18 Dec 2024 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter New IETF Area focuses on web and transport technologies Francesca Palombini WIT Area Director Zaheduzzaman Sarker WIT Area Director 8 Oct 2024 The new Web and Internet Transport (WIT) area covers protocols that provide the functions of the transport layer of the Internet, including congestion control and queue management, real-time communication, as well as protocols that implement the World Wide Web and adjacent technologies. Recognizing the increasing activity in application and real-time technologies and a shift in the technical work underway in the IETF, during 2023 the Internet Engineering Steering Group (IESG) reviewed how best to organize Working Groups (WGs) into Areas. The result was the creation of the WIT Area, which began work with the IETF 119 Brisbane meeting held in March 2024. WIT took over from the Transport (TSV) Area and incorporated the web-related and real-time part of Application and Real-Time (ART) Area. One of the aims of this new area was to have cohesion around traditional Transport subjects and ART protocols that are often used as transports, especially HTTP. Areas help connect IETF work on related technologies. They are managed by Area Directors (ADs) who are jointly responsible for making sure the WGs in the area are well coordinated, that there is coverage for the technologies needed in the area, and that the challenges most important to the Internet in that area are indeed being worked on. The WIT Area, with its two centers of gravity (transport layer and web applications), includes groups that work on technologies such as QUIC, TCP, UDP, SCTP, RTP, and MASQUE, and also groups working on technologies like HTTP, CoAP, and MOQ.If you would like to learn more about work underway in the WIT area, many of the Working Groups will be meeting during the upcoming IETF 121 Dublin meeting. There will be meetings such as the TSV working group (TSVWG), QUIC, MOQ, HTTPbis, CoRE, WEBTRANS, and AVTCORE. Birds of a Feather (BOF) sessions are good places to start if you are looking to learn more about work being considered, and the High Performance Wide Area Network (HPWAN) BoF will be held during IETF 121. For any group you are interested in, be sure to join the mailing lists and review documents so you can be up to speed on discussions that will take place during IETF 121. The WITAREA mailing list archive includes summary Working Group reports from previous meetings, which give a high-level overview to the status of most WIT working groups. If you’d like, you can reach us on the main WIT Area mailing list or directly at wit-ads@ietf.org. Share this page PreviousIETF Meetings recording playback system now open source NextMeet the IETF Secretariat"
