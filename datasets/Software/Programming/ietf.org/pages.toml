f Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Second IASA2 Retrospective Report Jason Livingood IETF Administration LLC Board Chair 18 Dec 2024 The IETF Administration LLC (IETF LLC) has now completed the second IETF Administrative Support Activity (IASA 2.0) retrospective. The report was developed with community input and review, and is now available online. BCP 101 specifies a requirement to conduct a three-year retrospective of the IETF Administrative Support Activity version 2.0 (IASA2). That was completed and a report was published in 2021. The first recommendation in that report was that additional retrospectives should occur every three years.The "Second Internet Administrative Support Activity version 2.0 (IASA2) Retrospective Report" focuses on what has changed since 2021 and includes several points of action to be taken.Future retrospectives should be published in 2027, 2030, 2033, and so on every three years. Share this page PreviousIETF Administration LLC 2025 Draft Budget NextLaunch of the IETF Community Survey 2024'
