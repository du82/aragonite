full_description = "IETF News Blog listing IETF Administration LLC 2025 Budget The IETF Administration LLC has finalised its budget for 2025. Jay Daley IETF Executive Director 22 Jan 2025 RFC Production Center management transition After an extensive review of recent developments in the RFC Editor function, the IETF Administration LLC (IETF LLC) and Association Management Solutions LLC (AMS) have agreed that the IETF LLC will assume management of existing RFC Production Center (RPC) staff, under an Employer of Record arrangement with AMS, the employer of the RPC team. Jay Daley IETF Executive Director 5 Jan 2025 Workshop on the Decentralization of the Internet at ACM CoNEXT 2024 The recent Decentralization of the Internet (DIN) workshop at ACM CoNEXT-2024 brought together network researchers, law and policy experts, and digital right activists to discuss the consolidation and centralization of the existing Internet applications, services, and infrastructure observed in recent years. Dirk Kutscher DINRG Co-chair Lixia Zhang DINRG Co-chair 19 Dec 2024 Launch of the IETF Community Survey 2024 The IETF Community survey is our major annual survey of the whole of the IETF community and is used to inform the actions of IETF leadership throughout the year. The 2024 IETF Community Survey is live and we want to hear from you! Jay Daley IETF Executive Director 19 Dec 2024 Second IASA2 Retrospective Report The IETF Administration LLC (IETF LLC) has now completed the second IETF Administrative Support Activity (IASA 2.0) retrospective. The report was developed with community input and review, and is now available online. Jason Livingood IETF Administration LLC Board Chair 18 Dec 2024 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter IETF Administration LLC 2022 Budget Jay Daley IETF Executive Director 2 Feb 2022 The IETF Administration LLC has finalised its 2022 budget following a community consultation. NOTE: When this blog post was first published, there was a formula error in the summary giving an incorrect figure for meeting expenses and net income. This has now been corrected and a corrected budget uploaded.In November 2021 the IETF Administration LLC published a draft of its 2022 budget along with a detailed narrative for community feedback. In developing this budget the LLC continues to give careful consideration to each budget request as well as the needs of the community as a whole. The IETF Administration LLC 2022 Budget has now been finalised and approved by the LLC Board. It contains the following sections:BudgetMeeting BudgetChart of AccountsKey AssumptionsISOC contribution as per our agreementIETF 113 will go ahead with 500 onsite participants, IETF 114 and IETF 115 will go ahead as in-person meetings with 1000 participants. All meetings will have a fee for remote participants.All strategic retreats etc will go ahead.Air travel costs will be at 50% above pre-COVID levels.The RFC Editor Future Program will conclude as expected and an RCSE will be appointedInvestments increase 5% over the year (up from 4% in 2021)4% inflation reflected in staff and some admin costs (up from 2% in 2021)Summary 2022 Budget 2021 Budget Variance Non-Meeting Revenue $ 9,074,098 $7,489,940 $ 1,584,158 Meeting Revenue $ 3,934,315 $ 3,104,437 $ 829,878 TOTAL REVENUE $ 13,008,413 $ 10,594,377 $ 2,414,036 Operating Expenses $ 5,692,400 $ 5,642,035 $ 50,365 Meeting Expenses $ 4,287,606 $ 3,347,792 $ 939,814 TOTAL EXPENSES $ 9,980,007 $ 8,989,827 $ 880,180 NET INCOME $ 3,028,406 $ 1,604,550 $ 1,423,856 Capital Expenditure $ 573,039 $ 585,000 $ (11,961) NET INCOME AFTER CAPITAL $ 2,455,367 $ 1,019,550 $ 1,435,818 Key Changes from Draft 2022 BudgetGeneralBudget assumption for IETF 113 lowered to 500 onsite participants from 650 due to the current Omicron wave.Inflationary increase in a number of key contractsFundraisingCorrects an error where no figure was shown for ISOC matched funding in 2022. Figure now shown and based on actual figures for 2021 endowment contributions ($250k raised instead of $500k budget giving $500,000 matched funding instead of $1,000,000).MeetingsUsed actual contract figures for IETF 113 Vienna (deficit of $274,215 instead of $242,009) and IETF 115 London (surplus of $107,596 instead of $92,786)Key Changes from 2021 BudgetBudget changesGeneralInflation has been applied at a rate of 4% while it currently stands in the US at 5.3%, in anticipation of Federal Reserve action to reduce it. FundraisingThe budget for fundraising for external funds into the endowment has been raised from $0.5m to $1m in line with the plan even though that may be premature.The budget for ISOC funds into the endowment is based on the 2021 budget of us raising $0.5m in 2021. Current donations are running approximately $250,000 lower than that and if that situation does not change then the budget for next year will need to be reduced by $500,000 to account for the loss of 2:1 match funds.Meetings:Assumes all three IETF meetings will go ahead in-person with reduced numbersAssumes fee for remote participation paid by 250 people per meetingChildcare costs only for last two meetings in 2022Estimating much higher travel costs throughout 2022.Administration:Budget for Director of Development increased to provide for a CRM system and small events for potential donors..Inflation has been applied to a number of itemsCommunity leadershipNew budget for EMODIR Support, covering the development, production and distribution of materials (documentation, videos, and other collateral). This is more than offset by a reduction in the Comms budget.The IETF Trust budget has increased.RSE and RPCThe costs for the new RSCE have been added including recruitment costs.Tools:New contract for a project manager to plan a complete rewrite of RPC tools.New DBA services contract.Old contracts now removed.More accurate cost for new developers.Net increase in cost for Tools across both Opex and Capex of approximately $340,000.Presentation changesMajor changes to capex presentationSplit capex between Tools and OtherIncluded a negative capitalisation adjustment line under tools opex to forecast the tools expense that is capitalised at the end of the year. This also allows for a reader to correctly estimate total tools expenditure.Tools tab simplified to show capex/opex split for each line.Split LLC staff costs between Administration and Tools to correctly show tools spend.Travel page tidied up to reduce hard coded valuesNew EMODIR Support line under Community LeadershipReservesOur reserves are invested with one fund manager in four separate portfolios, each with a different risk and investment profile. These portfolios and their value as of 31 December 2021 are Continuity and Operations $5,415,474Board Designated Reserve $10,991,993Restricted Endowment $3,956,124Business Opportunities $567,733We are planning to produce full reserve forecasts for our next budget (FY 2023) following the introduction of a new financial system in 2022 that will significantly improve our operational forecasting and therefore the level of any surplus that may be safely added to reserves while leaving sufficient cash at hand. Share this page PreviousIETF 113 Registration Open NextIETF 112 Plenary Experiment Evaluation"
