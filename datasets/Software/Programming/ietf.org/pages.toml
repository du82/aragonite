title = "IETF  | Conclusion of the IASA2 Retrospective"
description = "The IETF Administration LLC (IETF LLC) completed the IETF Administrative Support Activity (IASA 2.0) retrospective. The report was developed with community input and review and is now available online."
full_description = "IETF News Blog listing IETF Administration LLC 2025 Budget The IETF Administration LLC has finalised its budget for 2025. Jay Daley IETF Executive Director 22 Jan 2025 RFC Production Center management transition After an extensive review of recent developments in the RFC Editor function, the IETF Administration LLC (IETF LLC) and Association Management Solutions LLC (AMS) have agreed that the IETF LLC will assume management of existing RFC Production Center (RPC) staff, under an Employer of Record arrangement with AMS, the employer of the RPC team. Jay Daley IETF Executive Director 5 Jan 2025 Workshop on the Decentralization of the Internet at ACM CoNEXT 2024 The recent Decentralization of the Internet (DIN) workshop at ACM CoNEXT-2024 brought together network researchers, law and policy experts, and digital right activists to discuss the consolidation and centralization of the existing Internet applications, services, and infrastructure observed in recent years. Dirk Kutscher DINRG Co-chair Lixia Zhang DINRG Co-chair 19 Dec 2024 Launch of the IETF Community Survey 2024 The IETF Community survey is our major annual survey of the whole of the IETF community and is used to inform the actions of IETF leadership throughout the year. The 2024 IETF Community Survey is live and we want to hear from you! Jay Daley IETF Executive Director 19 Dec 2024 Second IASA2 Retrospective Report The IETF Administration LLC (IETF LLC) has now completed the second IETF Administrative Support Activity (IASA 2.0) retrospective. The report was developed with community input and review, and is now available online. Jason Livingood IETF Administration LLC Board Chair 18 Dec 2024 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Conclusion of the IASA2 Retrospective Jason Livingood IETF Administration LLC Board Chair 1 Nov 2021 The IETF Administration LLC (IETF LLC) has now completed the IETF Administrative Support Activity (IASA 2.0) retrospective. The report was developed with community input and review and is now available online. This assessment was required by BCP 101 after three years of operation of the IETF LLC. In April 2021 we announced a proposed process and timing for this retrospective and sought comment from the community. We then started the process in June 2021 with solicitation of input from the community.The report documents areas where work is completed as well as where work is continuing. Section E of the document also contains several recommendations for future work, including that further IASA assessments be performed every three years. This report will also be presented at the IETF 112 plenary meeting on 3 November 2021 at 13:30 UTC. Share this page PreviousIETF 2022 Draft Budget NextIETF 112 Sessions for New Participants"
