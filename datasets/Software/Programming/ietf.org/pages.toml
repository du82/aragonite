full_description = "Meetings IETF Hackathons IETF Hackathons encourage developers and subject matter experts to collaborate and develop utilities, ideas, sample code and solutions that show practical implementations of IETF standards. The IETF Hackathons aim to:Advance the pace and relevance of IETF standards activities by bringing the speed and collaborative spirit of open source development into the IETFBring developers and young people into IETF and get them exposed to and interested in IETFIETF Hackathons are free to attend and open to everyone. They are collaborative events, not competitions. Past IETF Hackathons have covered a range of topics spanning almost all IETF work areas, including DNS, FD.io/VPP, HTTP 2.0, NETVC, OpenDaylight, ONAP, RiOT, QUIC, TLS 1.3, WebRTC, YANG/NETCONF/RESTCONF, and many others. New technologies are always encouraged.The next IETF Hackathon will take place in Bangkok! Past Hackathons:121 Hackathon - Dublin120 Hackathon - Vancouver119 Hackathon - Brisbane118 Hackathon - Prague117 Hackathon - San Francisco116 Hackathon - Yokohama115 Hackathon - London114 Hackathon - Philadelphia and Online113 Hackathon - Vienna and Online112 Hackathon - Online111 Hackathon - Online110 Hackathon - Online109 Hackaton - Online108 Hackathon - Online106 Hackathon - Singapore105 Hackathon - Montreal104 Hackathon - Prague103 Hackathon - Bangkok102 Hackathon - Montreal101 Hackathon - London100 Hackathon - Singapore99 Hackathon - Prague98 Hackathon - Chicago97 Hackathon - Seoul96 Hackathon - Berlin95 Hackathon - Buenos Aires94 Hackathon - Yokohama93 Hackathon - Prague92 Hackathon - Dallas Gold Running Code Sponsor Next IETF Hackathon The IETF 122 Hackathon will be held Online and in Bangkok. Register for the next IETF Hackathon! Meetings IETF 122 Bangkok IETF 123 Madrid IETF 124 Montreal Upcoming meetings Past meetings Interim meetings IETF Hackathons Code Sprint"
