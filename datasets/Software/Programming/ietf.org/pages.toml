["https://ietf.org/blog/ietf-116-post-meeting-survey"]
title = "IETF  | IETF 116 post-meeting survey"
description = "IETF 116 Yokohama was held 25-31 March 2023 and the results of the post-meeting survey are now available on a web-based interactive dashboard."
full_description = 'IETF News Blog listing IETF Administration LLC 2025 Budget The IETF Administration LLC has finalised its budget for 2025. Jay Daley IETF Executive Director 22 Jan 2025 RFC Production Center management transition After an extensive review of recent developments in the RFC Editor function, the IETF Administration LLC (IETF LLC) and Association Management Solutions LLC (AMS) have agreed that the IETF LLC will assume management of existing RFC Production Center (RPC) staff, under an Employer of Record arrangement with AMS, the employer of the RPC team. Jay Daley IETF Executive Director 5 Jan 2025 Workshop on the Decentralization of the Internet at ACM CoNEXT 2024 The recent Decentralization of the Internet (DIN) workshop at ACM CoNEXT-2024 brought together network researchers, law and policy experts, and digital right activists to discuss the consolidation and centralization of the existing Internet applications, services, and infrastructure observed in recent years. Dirk Kutscher DINRG Co-chair Lixia Zhang DINRG Co-chair 19 Dec 2024 Launch of the IETF Community Survey 2024 The IETF Community survey is our major annual survey of the whole of the IETF community and is used to inform the actions of IETF leadership throughout the year. The 2024 IETF Community Survey is live and we want to hear from you! Jay Daley IETF Executive Director 19 Dec 2024 Second IASA2 Retrospective Report The IETF Administration LLC (IETF LLC) has now completed the second IETF Administrative Support Activity (IASA 2.0) retrospective. The report was developed with community input and review, and is now available online. Jason Livingood IETF Administration LLC Board Chair 18 Dec 2024 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter IETF 116 post-meeting survey Jay Daley IETF Executive Director 26 Apr 2023 IETF 116 Yokohama was held 25-31 March 2023 The results of the IETF 116 Yokohama post-meeting survey are now available on a web-based interactive dashboard. Thank you to all of you who respond to this survey as we use your views to continually adjust the meeting experience.AnalysisWe received 223 responses, of which 222 participated in IETF 116, 163 onsite and 59 remote. As only 1 of the respondents did not participate in IETF 116 the specific questions for them are not shown in the dashboard, but their views were read and considered. With 1740 registered participants, this gives the survey a maximum margin of error of +/- 6.15%. (Note, for previous surveys we have used recorded participants, but due to many people not signing in to sessions, we have switched to registered participants).The results for satisfaction questions include a mean and standard deviation using a five point scale scoring system of Very satisfied = 5, Satisfied = 4, Neither satisfied nor dissatisfied = 3, Dissatisfied = 2, Very dissatisfied = 1. While there’s no hard and fast rule, a mean of above 4.50 is sometimes considered excellent, 4.00 to 4.49 is good, 3.50 to 3.99 is acceptable and below 3.50 is either poor or very poor if below 3.00. The satisfaction score tables also include a top box, the total of satisfied and very satisfied, and a bottom box, the total of dissatisfied and very dissatisfied, both in percentages. Please note that a small number of questions are on a four point scale.Changes since the last surveyFor this survey we added some new questions about accommodation to help us understand what makes a good IETF hotel and to see why people make other choices. The COVID questions were dropped for this survey as it was unlikely these would provide any more actionable data.SatisfactionOverall satisfaction is 4.30 which is again a good result. With some key exceptions, the satisfaction scores remain high, reflecting the various improvements made since we returned to onsite meetings.The table below shows the satisfaction scores for the last six meetings, along with colour coded indicators for the five point scale above. Satisfaction scores for the last six meetings IETF 116 Yokohama IETF 115 London IETF 114 Phila. IETF 113 Vienna IETF 112 Online IETF 111 Online Overall satisfaction 4.30 🟢 4.28 🟢 4.19 🟢 4.36 🟢 4.15 🟢 4.13 🟢 AGENDA Overall agenda 4.18 🟢 4.22 🟢 4.06 🟢 4.16 🟢 4.11 🟢 3.91 🟡 Sessions for new WGs 4.17 🟢 4.12 🟢 4.15 🟢 4.18 🟢 4.10 🟢 4.03 🟢 Sessions for existing WGs 4.22 🟢 4.22 🟢 4.10 🟢 4.24 🟢 4.19 🟢 4.04 🟢 BOFs 4.11 🟢 4.10 🟢 4.09 🟢 4.04 🟢 3.92 🟡 4.01 🟢 Sessions for existing RGs 4.14 🟢 4.10 🟢 3.95 🟡 4.13 🟢 4.05 🟢 3.99 🟡 Plenary 3.98 🟡 3.98 🟡 3.98 🟡 3.94 🟡 - 3.91 🟡 Side meetings 3.73 🟡 3.81 🟡 3.73 🟡 3.52 🟡 3.46 🔴 3.84 🟡 Hackathon 4.34 🟢 4.35 🟢 4.30 🟢 4.09 🟢 3.83 🟡 4.14 🟢 HotRFC 3.84 🟡 4.21 🟢 3.94 🟡 4.17 🟢 3.54 🟡 - Office hours 4.23 🟢 4.00 🟢 4.09 🟢 3.96 🟡 3.91 🟡 4.12 🟢 Opportunities for social interaction 3.72 🟡 3.98 🟡 3.89 🟡 3.51 🟡 2.79 ⚫️ 2.90 ⚫️ STRUCTURE Overall meeting structure 4.28 🟢 4.28 🟢 4.19 🟢 4.26 🟢 4.23 🟢 4.08 🟢 Start time 4.16 🟢 (9:30am) 4.28 🟢 (9:30am) 4.20 🟢 (10:00am) 4.12 🟢 (10:00am) 3.95 🟡 (12:00pm) 3.01 🔴 (12:00pm) Length of day 4.30 🟢 4.32 🟢 4.10 🟢 4.20 🟢 4.21 🟢 3.93 🟡 Number of days 4.30 🟢 (5+2) 4.32 🟢 (5+2) 4.30 🟢 (5+2) 4.23 🟢 (5+2) 4.36 🟢 (5) 4.14 🟢 (5) Session lengths 4.36 🟢 (60 / 90 / 120) 4.32 🟢 (60 / 90 / 120) 4.25 🟢 (60/120) 4.31 🟢 (60/120) 4.26 🟢 (60/120) 4.12 🟢 (60/120) Break lengths 4.38 🟢 (30/90) 4.36 🟢 (30/90) 4.25 🟢 (30/90) 4.16 🟢 (30/60) 4.15 🟢 (30) 4.09 🟢 (30) Number of parallel tracks 4.01 🟢 (8) 3.90 🟡 (8) 3.86 🟡 (8) 3.92 🟡 (8) 3.92 🟡 (8) 3.60 🟡 (9) PARTICIPATION MECHANISMS Meetecho 4.45 🟢 4.45 🟢 4.23 🟢 4.36 🟢 4.36 🟢 4.29 🟢 Gather 3.46 🔴 3.37 🔴 3.06 🔴 3.04 🔴 3.40 🔴 3.77 🟡 Zulip 3.77 🟡 3.73 🟡 3.56 🟡 2.91 ⚫️ - - Jabber - - - 3.80 🟡 3.75 🟡 3.68 🟡 Audio streams 4.21 🟢 4.04 🟢 4.05 🟢 4.14 🟢 4.41 🟢 3.84 🟡 YouTube streams 4.36 🟢 4.25 🟢 4.22 🟢 4.25 🟢 4.41 🟢 4.09 🟢 Onsite network and WiFi 4.06 🟢 4.10 🟢 3.82 🟡 - - - CONFLICTS Conflict avoidance 3.94 🟡 3.91 🟡 3.78 🟡 3.89 🟡 4.00 🟢 3.76 🟡 ACCOMM. Overall accommodation 4.09 🟢 - - - - - Areas for improvementGather / Social interaction for remote participantsThe satisfaction scores for Gather and "Opportunities for social interaction" for remote participants, continue to be unacceptable. For this meeting, we experimented with a hallway Meetecho session but the feedback is that this was not advertised widely enough. For IETF 117 San Francisco, we will repeat that experiment with better communications around it.However that works out, it is clear the Gather is not working and we now need to make the difficult decision on whether or not to persist with Gather for in-meeting social interaction (we know that it is successfully used by some Hackathon projects and this would not affect that). Alternatively, it may be that trying to create a video-based opportunity for social interaction is the wrong approach and we need to switch to a chat based opportunity.Please contact me directly if you have any thoughts on this.ZulipSatisfaction for Zulip at 3.77 continues to track that for jabber, the service it replaced, and not show any improvement. While there are some criticisms of Zulip in the survey feedback, the nature of that feedback points to this being primarily an issue of lack of familiarity and only secondarily an issue with the tool and/or how we use it. It is not clear how to address that rapidly given that most of us only use Zulip during IETF meetings and in a limited way. We will continue to look at this and again welcome any thoughts on this.Side meetingsThe satisfaction score for side meetings at 3.73 still shows a relatively high level of dissatisfaction. The feedback on how to improve side meetings is primarily asking for better remote participation facilities. This will be discussed with the IESG before IETF 117 San Francisco.Conflict avoidanceIn preparation for this meeting we implemented a new process to reduce conflicts as described in our blog post using the feedback from these surveys. However, the satisfaction score at 3.94 was basically unchanged and so it may be that we have reached the limit of what can be achieved with 8 parallel tracks. We will try this process again for IETF 117 San Francisco and look to see what impact that has.PlenaryThe satisfaction score for the Plenary continues to hover around the Acceptable/Good boundary. We have not yet been able to do the more in-depth research with individual community members to understand what they want from the session.Individual commentsThe individual comments covered a number of key themes:The distance between the venue and the hotel. The feedback is that this was not "one roof" and that this distance was not well advertised. On the first point, RFC 8718 is clear that "one roof" is only a preference and participants should expect there to regularly be meetings in conference centres that are a short walk from the IETF hotel. On the second point, we were unfortunately unable to conduct a site visit until just a few weeks out from the meeting, due to COVID restrictions, at which point we immediately included that information in an update on the meeting, but this was not clear in the subject line. We do not anticipate this happening again, but if it does then we will endeavour to ensure that people are made aware.Lack of chairs in the hallways. The feedback is that this prevented a natural flow of conversation. Our strategy so far has primarily focused on providing a Lounge for people move to and hold ad-hoc conversations there, as almost all venues would expect us to hire hallway furniture and have it brought it, set up and then taken down at the end of the meeting. This is clearly not working, particularly in a venue without a bar, and so we will look at bringing in such furniture for future meetings.Frustration with masks, with many people stating that they will rethink onsite participation if masks are again mandated. As just announced, masks will no longer be required from IETF 117 San Francisco and beyond.In-session attendance record. The feedback is that there were too many people onsite who did not record their attendance in a session by logging in to Meetecho. We agree this is a problem and for the next meeting we will passing around the QR code in each session, and if that does not work we will consider more radical solutions.Earlier publication of session agendas, with many explaining that this is very important for them to decide on whether or not they participate in a meeting and some noting that they missed out on sessions as a result or they made an unnecessary trip. This feedback will be passed on to the IESG.Hotels and accommodationFor the first time, we asked questions about accommodation, partly in response to complaints during the meeting about the distance to the IETF hotel, and partly to inform the ongoing discussion on changes to our venue selection process. The overall satisfaction (Q63) at 4.09 is good.We asked for views on both the importance of certain factors that affect the choice of accommodation, and satisfaction with those. That enables the production of the table of the importance-satisfaction gap for each factor. This is a technique used to rank the relative "problem" among a set of factors, with the higher the gap, the more of a problem we have with that factor relative to others. We intend to collect this data for more meetings before deciding on how to respond. Importance and satisfaction of factors affecting accommodation choice Factor Importance Satisfaction Gap Rank Cost 4.09 3.70 0.39 2 IETF Hotel network 3.49 4.19 -0.70 8 Distance to venue 4.32 3.59 0.73 1 Availability of rooms 4.36 4.07 0.29 3 Facilities in the accommodation 3.76 3.93 -0.17 7 Proximity to colleagues 3.62 3.76 -0.14 6 Proximity to other IETF participants 3.63 3.53 -0.10 5 Proximity to restaurants / bars / shops 4.01 3.72 0.19 4 And finallyThank you everyone who responded to this survey, your feedback is much appreciated. Share this page PreviousCatching up on IETF 116 NextBanishing the bane of bufferbloat'
