full_description = 'About Groups Internet Engineering Steering Group Process experiments BCP 93 defines a process for time-limited experimental changes to the IETF standards process. Process experiments, described by RFC 3933, provide an approach to making changes to IETF prices that echoes the "running code" approach to informing that standards setting process. Process experiments adopt a "propose and carry out an experiment, evaluate the experiment, and then establish permanent procedures based on operational experience" model.This page lists experiments under way and links to a separate status page for each one.Experimental Procedure for Long Term Suspensions from Mailing Lists (September 2006)RFC 5111, Experiment in Exploratory Group Formation Internet Engineering Steering Group IESG Members IESG Meeting Minutes'
