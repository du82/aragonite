full_description = "IETF News Blog listing IETF Administration LLC 2025 Budget The IETF Administration LLC has finalised its budget for 2025. Jay Daley IETF Executive Director 22 Jan 2025 RFC Production Center management transition After an extensive review of recent developments in the RFC Editor function, the IETF Administration LLC (IETF LLC) and Association Management Solutions LLC (AMS) have agreed that the IETF LLC will assume management of existing RFC Production Center (RPC) staff, under an Employer of Record arrangement with AMS, the employer of the RPC team. Jay Daley IETF Executive Director 5 Jan 2025 Workshop on the Decentralization of the Internet at ACM CoNEXT 2024 The recent Decentralization of the Internet (DIN) workshop at ACM CoNEXT-2024 brought together network researchers, law and policy experts, and digital right activists to discuss the consolidation and centralization of the existing Internet applications, services, and infrastructure observed in recent years. Dirk Kutscher DINRG Co-chair Lixia Zhang DINRG Co-chair 19 Dec 2024 Launch of the IETF Community Survey 2024 The IETF Community survey is our major annual survey of the whole of the IETF community and is used to inform the actions of IETF leadership throughout the year. The 2024 IETF Community Survey is live and we want to hear from you! Jay Daley IETF Executive Director 19 Dec 2024 Second IASA2 Retrospective Report The IETF Administration LLC (IETF LLC) has now completed the second IETF Administrative Support Activity (IASA 2.0) retrospective. The report was developed with community input and review, and is now available online. Jason Livingood IETF Administration LLC Board Chair 18 Dec 2024 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter IETF Administration LLC 2024 Budget Jay Daley IETF Executive Director 18 Jan 2024 The IETF Administration LLC has finalised its budget for 2024. The IETF Administration LLC 2024 Final Budget is made up of the following:BudgetMeetings budgetChart of accountsKey assumptionsInternet Society contribution as per our agreementAll meetings will go ahead with an increased fee structure but with lower levels of onsite registration than pre-COVID.Fundraising will meet the targets set out two years ago.IT support structure has changed from prior yearsInvestments rate of return is 4% over the year, as confirmed with our investment advisors4% inflation reflected in some admin and contract costs Community consultationA draft budget was shared for community consultation. No changes were made as a result, and the final budget is unchanged from the draft budget.Summary Summary of 2024 budget and comparison to 2023 2024 Final Budget 2023 Budget Variance Non-Meeting Revenue $ 9,271,173 $ 10,264,250 $ (993,077) Meeting Revenue $ 4,147,704 $ 3,685,791 $ 461,913 TOTAL REVENUE $ 13,418,877 $ 13,950,041 $ (531,164) Operating Expenses $ 7,123,163 $ 6,353,650 $ (769,513) Meeting Expenses $ 5,076,232 $ 4,933,815 $ (142,417) TOTAL EXPENSES $ 12,199,395 $ 11,287,465 $ (911,930) NET INCOME $ 1,219,482 $ 2,662,576 $ (1,443,094) Capital Expenditure $ 1,015,942 $ 752,400 $ (263,542) NET INCOME AFTER CAPITAL $ 203,540 $ 1,910,176 $ (1,706,636) Key changes from 2023Budget changesInvestmentsThe budget for Investment income is lower due to using 4% vs. 10% as only income returns are being budgeted (not increase in value). This is a decrease of ($1,213,077)Meetings:Sponsorship revenue budgeted increased $180,000 spread between Hosts, Running Code, and D&I Meeting Rebates & Comps budgeted includes Subvention Grants and VAT recovery, whereas 2023 did not include either of theseMeeting NOC Support includes the cost of in-kind circuits, whereas 2023 did not include the expense side of this contributionSponsorship Supported Services for 2024 eliminated the ASL service and the Fee Waiver expense, as this is just lost revenueAdministration:Inflationary increase in all wages at 4%Reduction of 1 FTE for fundraisingAdjustment for actual payroll process fees being greaterThe cost of the annual financial audit was budgeted in Operation in 2023 and was moved to CPA services for 2024RFC Production CenterIncludes a new Citation Specialist (through AMS)IETF TrustAdjusted the prior year standard budget amount of $165,216 to agree with the 2024 Advice in the IETF Trust approved 2023 budget - $120,652 standard budget and $30,000 reserve amountTools:Due to migrating IT Infrastructure and Mail Management to other contractors and methodology, there is an increase in Staff costs and a decrease in Secretariat-IT costs. The migration costs are included also.Depreciation was not budgeted in 2023, but has been included for 2024Presentation changesNo changes Share this page PreviousUpdate on the IT Infrastructure Transition Project NextWhat’s the deal with Media Over QUIC?"
