["https://ietf.org/blog/author/dirk-kutscher"]
title = "IETF  | Articles by Dirk Kutscher"
full_description = "IETF News Articles by Dirk Kutscher 2024-12-19 Workshop on the Decentralization of the Internet at ACM CoNEXT 2024 IETF News Articles by Dirk Kutscher 2024-12-19 Workshop on the Decentralization of the Internet at ACM CoNEXT 2024 The IETF works on a broad range of networking technologies that provide the foundation for the Internet's growth and evolution. While most IETF work takes place online, meetings and other events such as Hackathons provide in-person opportunities to advance work within the IETF. The IETF is the premier Internet standards organization. It follows open and well-documented processes for setting these standards. Once published, those standards are made freely available. The global IETF community works together in many different ways to produce high quality, relevant technical documents that influence the way people design, use, and manage the Internet."
