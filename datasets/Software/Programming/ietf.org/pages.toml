["https://ietf.org/blog/author/diego-lopez"]
title = "IETF  | Articles by Diego Lopez"
full_description = "IETF News Articles by Diego Lopez 2024-10-29 The new GREEN working group gets ready for an energy efficient Internet IETF News Articles by Diego Lopez 2024-10-29 The new GREEN working group gets ready for an energy efficient Internet The IETF works on a broad range of networking technologies that provide the foundation for the Internet's growth and evolution. While most IETF work takes place online, meetings and other events such as Hackathons provide in-person opportunities to advance work within the IETF. The IETF is the premier Internet standards organization. It follows open and well-documented processes for setting these standards. Once published, those standards are made freely available. The global IETF community works together in many different ways to produce high quality, relevant technical documents that influence the way people design, use, and manage the Internet."
