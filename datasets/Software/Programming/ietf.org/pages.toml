["https://ietf.org/meeting/preparation"]
title = "IETF  | Preparing for an IETF meeting."
description = "This page provides details of the resources available to prepare for IETF meetings."
full_description = "Meetings Preparing for an IETF Meeting This page provides details of the resources available to prepare for IETF meetings. It is strongly recommended to review this information even if you have participated in a past IETF meeting using Meetecho as details may have changed. General notesFor IETF meetings, all onsite and remote session chairs and participants will need to sign into each session in which they participate using a Web browser.For IETF meetings an IETF Datatracker login and Meetecho will be used (by chairs and participants) to generate session blue sheets (attendance lists) and to manage a unified queue for all participants, both remote and in-person. A special version of Meetecho designed to work on mobile devices will be available for onsite participants.For a more comprehensive overview of IETF meetings and how to get the most from them, read this Introduction to IETF meetings. Information for participantsOnline participants will use the full Web-based Meetecho client. In-person participants are able to use a streamlined mobile-friendly version of Meetecho during sessions. A Meetecho guide for meeting participants is available and will be updated several weeks before each meeting.Onsite participants Be sure to use Meetecho to sign in to every session you attend in-person when you are onsite. You can do this by using the QR codes available at the entrance to and in the meeting room to quickly access Meetecho for the session currently underway. IETF meeting appsSeveral apps for IETF meetings have been developed by, and are maintained by, IETF participants. You may wish to download them before the IETF meeting begins.Android IETF meeting appiOS, iPadOS and macOS IETF meeting app Information for session chairsAll session chairs whether onsite or remote will use the full version of Meetecho.NOTE: New features for session chairs were added For IETF 122. The Meetecho guide for session chairs has been updated. Session chairs are strongly encouraged to test in advance.A Meetecho guide for session chairs is available and will be updated several weeks before each IETF meeting.Session chair checklistSession starter slides1-minute video for onsite chairs3-minute video on how to manage session materials in MeetechoAdditional information and resources related to organizing and managing meetings are available on the IETF Chairs wiki. Self-schedule test sessions for chairsAs with past meetings, session chairs can schedule sessions on-demand to test set ups and arrange run throughs with presenters. This feature is available for working group and research group chairs. These test sessions do not create interim meetings. IETF 122 testing sessions for chairsIn addition to self-scheduled test session chairs can arrange at anytime, there will be two guided Meetecho test and demonstration sessions in advance of IETF 122:TBDTBD(Please note that the linked sessions above will not be available until just before the testing sessions.) More information and questionsQuestions should be sent to support@ietf.org. IETF 122 Bangkok and Online Registration Register for IETF 122 Bangkok and Online Register now! Next IETF Meeting Attendee List Get great tips about the next IETF meeting and participate in the ongoing conversation among IETF meeting participants Subscribe here Meetings IETF 122 Bangkok IETF 123 Madrid IETF 124 Montreal Upcoming meetings Past meetings Interim meetings IETF Hackathons Code Sprint"
