full_description = "Meetings Code Sprint IETF Code Sprints develop the tools that support the work of the IETF. IETF Code Sprints, organized by the IETF Tools Team, bring together volunteers from the IETF community to work on code for the IETF Datatracker, mailing lists, and other tools used by the IETF community. Some people may be working on improvements in existing functionality, others may be adding exciting new functionality. IETF Code Sprints are held in conjunction with each in-person IETF Meeting and also online between in-person meetings. All code will becomes part of the open source tools used to develop IETF specifications.Next IETF Code SprintThe Code Sprint for IETF 122 will be held on Sunday, 16 March 2025. Details about the next Code Sprint are posted to the codesprints mailing list and/or the Code Sprint Wiki just before the sprint is held. Next IETF Meeting Stay tuned for the latest information on the next IETF meeting scheduled for 15-21 March 2025 Visit the IETF 122 Bangkok meeting webpage Meetings IETF 122 Bangkok IETF 123 Madrid IETF 124 Montreal Upcoming meetings Past meetings Interim meetings IETF Hackathons Code Sprint"
