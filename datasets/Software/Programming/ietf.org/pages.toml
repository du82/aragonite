full_description = "IETF News Blog listing IETF Administration LLC 2025 Budget The IETF Administration LLC has finalised its budget for 2025. Jay Daley IETF Executive Director 22 Jan 2025 RFC Production Center management transition After an extensive review of recent developments in the RFC Editor function, the IETF Administration LLC (IETF LLC) and Association Management Solutions LLC (AMS) have agreed that the IETF LLC will assume management of existing RFC Production Center (RPC) staff, under an Employer of Record arrangement with AMS, the employer of the RPC team. Jay Daley IETF Executive Director 5 Jan 2025 Workshop on the Decentralization of the Internet at ACM CoNEXT 2024 The recent Decentralization of the Internet (DIN) workshop at ACM CoNEXT-2024 brought together network researchers, law and policy experts, and digital right activists to discuss the consolidation and centralization of the existing Internet applications, services, and infrastructure observed in recent years. Dirk Kutscher DINRG Co-chair Lixia Zhang DINRG Co-chair 19 Dec 2024 Launch of the IETF Community Survey 2024 The IETF Community survey is our major annual survey of the whole of the IETF community and is used to inform the actions of IETF leadership throughout the year. The 2024 IETF Community Survey is live and we want to hear from you! Jay Daley IETF Executive Director 19 Dec 2024 Second IASA2 Retrospective Report The IETF Administration LLC (IETF LLC) has now completed the second IETF Administrative Support Activity (IASA 2.0) retrospective. The report was developed with community input and review, and is now available online. Jason Livingood IETF Administration LLC Board Chair 18 Dec 2024 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter IETF Administration LLC 2025 Draft Budget Jay Daley IETF Executive Director 13 Dec 2024 The IETF Administration LLC has prepared its draft budget for 2025 and now seeks community feedback. The IETF Administration LLC 2025 Draft Budget is made up of the following:BudgetMeetings budgetChart of accountsKey assumptionsInternet Society contribution as per our agreementIETF 123 & IETF 124 meetings will have a slightly increased fee structureRPC cost structure has changed from prior yearsIncrease cost of airfare costsNo additional employeesInvestments rate of return is 2.2% over the year, as confirmed with our investment advisorsUp to 4% inflation reflected in staff and some contract costs Summary Summary of 2025 budget and comparison to 2024 2025 Draft Budget 2024 Budget Variance Non-Meeting Revenue $ 9,149,340 $ 9,271,173 $ (121,833) Meeting Revenue $ 4,474,293 $ 4,147,704 $ 326,589 TOTAL REVENUE $ 13,623,633 $ 13,418,877 $ 204,756 Operating Expenses $ 7,085,814 $ 7,123,163 $ 37,349 Meeting Expenses $ 4,964,316 $ 5,076,232 $ 111,916 TOTAL EXPENSES $ 12,050,130 $ 12,199,395 $ 149,265 NET INCOME $ 1,573,503 $ 1,219,482 $ 354,021 Capital Expenditure $ 947,360 $ 1,015,942 $ 68,582 NET INCOME AFTER CAPITAL $ 626,143 $ 203,540 $ 422,603 Key changes from 2024Budget changesInvestmentsThe budget for Investment income is lower due to using 2.2% vs. 4% as advised by Goldman Sachs. This is a decrease of ($300,833).Key ContractsThe Secretariat contract decreased with the IT changes, but increased for inflation and the loss of a multi-service discount, leaving a net increase of $122,515. The RPC contract changed to a cost plus contract and absorbed the RPC Tools Refresh PM contract, creating a positive variance to 2024’s budget of $204,002.Meetings:Sponsorship revenue budgeted decreased slightly due to Global Sponsor changing to Global Host and therefore being recognized differently. Meeting Rebates & Comps budgeted decreased due to less Subvention Grants and VAT recovery.Meeting venue costs are significantly lower, but travel costs have increased due to increased airfare costs.Administration:Inflationary increase in all wages at a maximum of 4%.Adjustment for actual payroll process fees was less than expected.Conference Services in-kind contributions of $58,050 was not budgeted for in 2024.Professional Development and Staff Meeting costs together increased $62,000 from the 2024 budget due to increased staff in 2024 and managing the RPC staff.Tools:No additional staff budgeted for 2025 (one position remains vacant).There is a reduction of Tools expenses by $699,515 due to using internal staff vs contractors for projects.Depreciation budgeted in 2024 was below the need to cover all of the CapEx in the last few years, so the 2025 budget reflects an additional $500,000 of depreciation.Presentation changesNo changes Increase in IETF Meeting registration feesWe last increased the IETF Meeting registration fees in July 2023, following a report to the community and consultation. The increase was based on US inflation in the eight years since the previous increase, to January 2023, resulting in a rise of ~25% across the boardAt that time, the board set a policy that the fees should be increased annually, during the annual budget process, using US inflation since the last increase. Unfortunately, this was not followed for the 2024 financial year, meaning that the rise this year will be slightly higher to compensate.The fees have been reviewed using the official US inflation calculator, which gives the inflation rate from January 2023 to October 2024 as 5.51%. Using that for the increase, and with some rounding, we get the following table of proposed fees, to be effective from July 2025.The onsite student fee has been $150 since at least 2006, which is why the increase is slightly higher than inflation. Table of current and proposed registration fees and percentage change ONSITE REMOTE Current Proposed Actual % Current Proposed Actual % Week Super Early $875 $925 5.71% $250 $264 5.60% Early $1,095 $1,155 5.48% $310 $327 5.48% Standard $1,200 $1,265 5.42% $360 $380 5.56% One Day Super Early $470 $495 5.32% $140 $148 5.71% Early $590 $620 5.08% $170 $180 5.88% Standard $645 $680 5.43% $200 $210 5.00% Student $150 $160 6.67% $55 $58 5.45% Community feedbackCommunity feedback on the budget is welcome and should be made either directly to the IETF Executive Director at exec-director@ietf.org, who can also answer any questions, or to the administration discussion list admin-discuss@ietf.org. Please provide any feedback before December 31st 2024. Share this page PreviousCore BPF ecosystem standardized in RFC 9669 NextSecond IASA2 Retrospective Report"
