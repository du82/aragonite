["https://ietf.org/participate/ids"]
title = "IETF  | Internet-Drafts"
description = "Internet-Drafts are working documents of the IETF, its areas, and its Working Groups. Note that other groups may also distribute working documents as Internet-Drafts."
full_description = '''Participate Internet-Drafts Internet-Drafts (I-Ds) are working documents of the IETF, its Areas, and its Working Groups. Other groups may also distribute working documents as Internet-Drafts. During the development of a specification, draft versions of the document are made available for informal review and comment by submitting them to the IETF's Internet-Drafts repository.Internet-Drafts (often referred to simply as "drafts") have no formal status, and are subject to change or removal at any time; therefore they should not be cited or quoted in any formal document.Author an Internet-DraftAnyone can author an Internet-Draft. Opinions expressed in the drafts are the authors' alone. The drafts do not necessarily have any standing in the IETF unless, for instance, they are adopted by a working group or approved as an RFC. The Internet-Draft Author Resources website provides authors information on how to write an I-D and the tools available to support authoring.Submit an Internet-DraftSubmitting an I-D via the IETF Datatracker submission tool places it in the IETF's Internet-Drafts directory. This makes the I-D readily available to a wide audience, facilitating the process of discussion, review, and revision. More detail about how to submit an I-D is available on Internet-Draft Authors Resources website.Search for a Current Internet-DraftThe most effective way to search for, and browse, Internet-Drafts, is by using the IETF Datatracker. Internet-Drafts also can be retrieved using http or rsync.Need Additional Assistance?Questions on Internet-Drafts not answered here should be sent to the Internet-Drafts Administrator. Participate Getting started in the IETF Internet-Drafts IETF Systers'''
year_published = 2025
clearnet = "https://ietf.org/participate/ids"
