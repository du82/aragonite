["https://ietf.org/about/note-well"]
title = "IETF  | Note Well"
description = "The Note Well describes IPR and other policies related to submissions by a Contributor for publication as all or part of an IETF Internet-Draft or RFC and any statement made within the context of an IETF activity."
full_description = '''About Note Well - A reminder of IETF policies A reminder of IETF policies. This is a reminder of IETF policies in effect on various topics such as patents or code of conduct. It is only meant to point you in the right direction. Exceptions may apply. The IETF's patent policy and the definition of an IETF "contribution" and "participation" are set forth in BCP 79; please read it carefully.As a reminder:By participating in the IETF, you agree to follow IETF processes and policies.If you are aware that any IETF contribution is covered by patents or patent applications that are owned or controlled by you or your sponsor, you must disclose that fact, or not participate in the discussion.As a participant in or attendee to any IETF activity you acknowledge that written, audio, video, and photographic records of meetings may be made public.Personal information that you provide to IETF will be handled in accordance with the IETF Privacy Statement.As a participant or attendee, you agree to work respectfully with other participants; please contact the ombudsteam (https://www.ietf.org/contact/ombudsteam/) if you have questions or concerns about this.Definitive information is in the documents listed below and other IETF BCPs. For advice, please talk to WG chairs or ADs:BCP 9 (Internet Standards Process)BCP 25 (Working Group processes)BCP 25 (Anti-Harassment Procedures)BCP 54 (Code of Conduct)BCP 78 (Copyright)BCP 79 (Patents, Participation)https://www.ietf.org/privacy-policy/ (Privacy Policy) View the IETF Note Well as:MarkdownPDFPPTX About'''
