full_description = "About Introduction to the IETF The Internet Engineering Task Force (IETF), founded in 1986, is the premier standards development organization (SDO) for the Internet. Groups The work of the IETF is undertaken and supported by a wide variety of groups with differing structures, goals, and responsibilities. Open records Public archives of most of the contributions, submissions, statements and communications that we receive. Liaisons The IETF has a limited number of liaison relationships with other organizations. Liaisons are appointed by the Internet Architecture Board (IAB) when the IAB feels that conditions warrant appointing a specific person to such a task. Note Well - A reminder of IETF policies The Note Well describes IPR and other policies related to submissions by a Contributor for publication as all or part of an IETF Internet-Draft or RFC and any statement made within the context of an IETF activity."
