["https://ietf.org/blog/it-infrastructure-outage-2024-06-20"]
title = "IETF  | Key IETF service outages on 20 June during transition to new infrastructure"
description = "The transition of IETF Datatracker and related services to a new cloud infrastructure is now complete and all affected services are available. Affected services were unavailable from 1800 UTC until approximately 2000 UTC on Thursday 20 June 2024."
full_description = "IETF News Blog listing IETF Administration LLC 2025 Budget The IETF Administration LLC has finalised its budget for 2025. Jay Daley IETF Executive Director 22 Jan 2025 RFC Production Center management transition After an extensive review of recent developments in the RFC Editor function, the IETF Administration LLC (IETF LLC) and Association Management Solutions LLC (AMS) have agreed that the IETF LLC will assume management of existing RFC Production Center (RPC) staff, under an Employer of Record arrangement with AMS, the employer of the RPC team. Jay Daley IETF Executive Director 5 Jan 2025 Workshop on the Decentralization of the Internet at ACM CoNEXT 2024 The recent Decentralization of the Internet (DIN) workshop at ACM CoNEXT-2024 brought together network researchers, law and policy experts, and digital right activists to discuss the consolidation and centralization of the existing Internet applications, services, and infrastructure observed in recent years. Dirk Kutscher DINRG Co-chair Lixia Zhang DINRG Co-chair 19 Dec 2024 Launch of the IETF Community Survey 2024 The IETF Community survey is our major annual survey of the whole of the IETF community and is used to inform the actions of IETF leadership throughout the year. The 2024 IETF Community Survey is live and we want to hear from you! Jay Daley IETF Executive Director 19 Dec 2024 Second IASA2 Retrospective Report The IETF Administration LLC (IETF LLC) has now completed the second IETF Administrative Support Activity (IASA 2.0) retrospective. The report was developed with community input and review, and is now available online. Jason Livingood IETF Administration LLC Board Chair 18 Dec 2024 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Key IETF service outages on 20 June during transition to new infrastructure Robert Sparks IETF Tools Project Manager 20 Jun 2024 The transition of IETF Datatracker and related services to a new cloud infrastructure is now complete and all affected services are available. Affected services were unavailable from 1800 UTC until approximately 2000 UTC on Thursday 20 June 2024. As of 2000 UTC on 20 June 2024, all affected services have been restored. If you encounter issues, please report them as you normally would:open an issue at the relevant github repository (linked on each applications pages),send email to tools-help@ietf.org for login issues,send email to tools-discuss@ietf.org for general issues,orsend email to support@ietf.org for urgent matters In addition to the IETF Datatracker, the following services transitioned to the new cloud infrastructure:the www.ietf.org websiteThe IETF MailarchiveThe IMAP and rsync services Services that relied on IETF Datatracker were affected. The following services were not available:the IETF meeting registration system, andany interim meeting sessions that use MeetEcho integrated with the IETF Datatracker.The following services were impaired, with any features requiring logging in unavailable:the IETF Notes service(editing notes will not be possible)IETF wikis, including wiki.ietf.org and chairs.ietf.org(editing wiki pages will not be possible)the IETF Zulip service (any new connection will not work) Of particular note: posting Internet-Drafts (I-Ds) to the IETF repository were unavailable during the outage; this includes automated posting of I-Ds via the IETF Datatracker API, such as via Github actions in repositories used to develop I-Ds. This blog post has been updated as this phase of the IT infrastructure transition is complete.Next, we plan to transition the IETF mail processing system.We will provide further updates with information and expected outages during that phase, as soon as those are available. Share this page PreviousEDHOC - A new lightweight authenticated key exchange protocol provides improved security with less overhead for Internet-of-Things devices NextIETF Administration LLC Board of Directors Succession Planning Update"
