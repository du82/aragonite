full_description = '''Meetings While most IETF work takes place online, meetings and other events such as Hackathons provide in-person opportunities to advance work within the IETF. IETF 122 Bangkok IETF 122 starts Saturday 15 March and runs through Friday afternoon, 21 March. Bangkok, Thailand Upcoming meetings IETF Meetings are held three times per year around the world to promote in-person attendance by IETF participants. Interim meetings are organized between IETF meetings to focus on specific issues Interim meetings The work of the IETF is largely conducted over mailing lists; however, some working groups also occasionally hold "interim" meetings, either face-to-face or virtually. Past meetings List of all previous IETF plenary meetings, records of the proceedings and post-meeting surveys. The 'Proceedings' of a meeting is where you find links to the agenda, minutes, presentations, video … Guide to IETF Meetings A detailed guide to IETF meetings, how they work, what to expect, and how to get the best from them. Meeting network and technology We use a variety of technologies to support meetings which we recommend participants are familiar with to get the most from the meetings. Side meetings and private meetings The IETF provides limited support for meetings held during IETF meetings that are not part of the official agenda. Meeting planning Information about how we plan where and when to hold our meetings, the community requirements that we aim to fulfill in venue selection, and policies regarding meeting planning. Upcoming events IETF 123 Madrid Madrid, Spain IETF 124 Montreal Montreal, Canada'''
