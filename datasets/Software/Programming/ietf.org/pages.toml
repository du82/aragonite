["https://ietf.org/participate/ietf-systers"]
title = "IETF  | IETF Systers"
description = "The IETF Systers Program offers women the opportunity to catch up with friends across all areas of the Internet Engineering Task Force and the Internet Research Task Force."
full_description = "Participate IETF Systers The IETF Systers Program offers women and nonbinary IETF participants the opportunity to meet and exchange knowledge and experience with other colleagues from across all areas of the Internet Engineering Task Force and the Internet Research Task Force. IETF Systers at IETF 104, in Prague IETF Systers is a community of women and non-binary IETF participants who gather to network, share advice and experiences, and collaborate on various projects. We welcome cis and trans women, and non-binary participants of all ages and at any stage of their studies or careers. We encourage our members to utilize the Systers group as an informal mentoring and information gathering network. We are here to support and encourage each other.In addition to providing a supportive environment, our charter below outlines the activities the group is currently focusing on: newcomer support, guidance on becoming an active IETF-er, promoting leadership roles and networking.The IETF Systers have gathered during nearly every IETF meeting since 1993. The founder of the program, Allison Mankin, chose the name Systers as an answer to the late Anita Borg’s call for women in computer systems to support and celebrate each other. IETF Systers is a recognized initiative of AnitaB.org.Complementing the face-to-face and online gatherings, the Systers email list is for Systers anywhere, and topics can be about any concern of the list members. The mailing list is open to all women and non-binary individuals who are interested in the IETF.Join the mail listSysters meet twice at IETF. The meeting schedule can be found in the DatatrackerIf you are interested in learning more about IETF Systers or sponsoring the program, please contact support@ietf.org. IETF Systers Program Network, share advice and experiences, and collaborate on various projects with other women participating in the IETF. Sign up for the IETF Systers Mailing list Participate Getting started in the IETF Internet-Drafts IETF Systers"
