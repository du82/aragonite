["https://ietf.org/meeting/new-participants"]
title = "IETF  | IETF Meeting New Participants Page"
description = "New participants have several resources designed to introduce and integrate IETF you into to the community, including tutorials and web pages that describe IETF processes and provide overviews of IETF technical work."
full_description = "Meetings New Participants Welcome New Participants! We have several resources designed to introduce and integrate IETF you into to the community, including tutorials and web pages that describe IETF processes and provide overviews of IETF technical work. Dive in and have fun! New Participants' OverviewThis overview is divided into three sections:Overview of the IETFIntroduction to an IETF meeting weekOverview of resources (people, tools, information)The entire tutorial can be viewed in a 20 minute block of time. Or, if you prefer, you can view each section separately. This introduction was developed to help new participants understand how to start participating in the IETF. It’s intended to be a practical introduction. As such, it does not cover topics like the history of the IETF or how to author an Internet draft. Those topics are covered in other tutorials, available on our website. We strongly recommend that you download the accompanying slide deck. Participating in IETF MeetingsPlease start by reading the Introduction to IETF Meetings, which covers all of the basics you need to know about IETF Meetings, and familiarise yourself with the Meeting Technology as this is probably very different from anything you may have used before.Support for New ParticipantsThe IETF defines 'New Participants' as anyone who has participated in fewer than 6 meetings (onsite or remote) and provides events and other services to help them get the most from the meeting.Events for New ParticipantsThere are a number of events specifically set up for new participants during the week. These are advertised both in the agenda and on the new participants mailing list.The **New Participants Overview Tutorial**, generally held on Sunday, where an experienced IETF participant presents a general introduction to the IETF. The session covers the structure of the IETF, how to get the most out of the meeting, and many other essential and enlightening topics for new IETFers.Then later on the Sunday is the **New Participants Quick Connections**, which is a simple and effective way for new participants to be introduced to a variety of experienced IETF attendees — often working group (WG) chairs — who can help you get more involved in your areas of interest. It is a great chance to meet people, and establish contacts that can be useful during the rest of the week. Registration is required as space is limited.The **New Participants Dinner** on the Monday night is a subsidised dinner providing time for in-depth conversation and socializing.Finally there is the **New Participants Social Hour** on the Thursday evening, which is a great opportunity for newcomers to share their experiences and discuss topics of interest with IETF leadership.Guides ProgramThe IETF Guides program, pairs newcomers with an experienced IETF person to help you become acclimated and effective quickly. The intent is for you to have a call with your guide before the meeting, a meeting during the beginning of the meeting, and check in some time during the meeting, so they can help you with any questions you might have. For more information on the program see the IETF Guide page or sign-up.Tips for New ParticipantsIt is best to plan to be present the whole week, to benefit from cross-fertilization between WGs and from hallway discussions. As noted, the agenda can change, and there have been instances of participants missing important sessions due to last-minute scheduling changes after their travel plans were fixed. Being present the whole week is the only way to avoid this annoyance. If you cannot find meetings all week to interest you, you can still make the most of the IETF meeting by working between sessions. Almost every attendee has a laptop, and it is common to see many of them in the terminal room or in the lobbies and hallways working during meeting sessions.As a new participant, don't be afraid to strike up conversations with leadership (people with dots on their badges). If the IAB and IESG members and Working Group and BOF chairs didn't want to talk to anybody, they wouldn't be wearing the dots in the first place! Note, however, that if someone is very busy and you want to discuss a complex topic then they may ask you to send email after the meeting ends.For a good primer on how to effectively engage in the IETF, read RFC 4144: How to Gain Prominence and Influence in Standards Organizations. New Participant Information for IETF 122 BangkokMeetecho introduction and test session with Q&AWe will be hosting 2 Meetecho test sessions prior to IETF 122 for New Participants. These sessions will help you get familiar with the most useful features of Meetecho. There will also be time for general Q&A about the upcoming IETF 122 meeting.Prior to the session starting, please read the Meetecho guide for participants.When you click on the meeting links below, you will be prompted to log into your datatracker account.Session 1 - Tuesday, March 4, 2025 Meetecho call-in details: TBDSession 2 - Wednesday, March 5, 2025Meetecho call-in details: TBDThere will also be a Meetecho introduction session onsite in Bangkok. This session will also be available or remote participants. Important DatesSee the important dates page to stay informed about when registration opens and all deadlines related to the meeting.The preliminary agenda for IETF 122 will be available 14 February 2025. It is up to each individual working group to post agendas. New Participants' EventsAll times below are in local time for Bangkok. Date Time Event Description Sunday TBD New Participant Overview (Onsite and Remote) This session is a review of the New Participants’ Overview Presentation and provides new participants with information on how the IETF works, what to expect at a meeting and much more. This session will be available via Meetecho and will be linked from the agenda. Sunday TBD Meetecho introduction and test session (Onsite and Remote) Immediately following the New Participant Overview we will have a Meetecho test session to help participants become familiar with the tool and test their audio/video settings. This session will be available via Meetecho and will be linked from the agenda. Sunday TBD Quick Connections (Onsite only) NOTE: Pre-registration is required and available on your attendee dashboard. The Quick Connections is a simple and effective way for you to be introduced to a variety of experienced IETF attendees — often working group (WG) chairs — who can help you get more involved in your areas of interest. Monday TBD New Participants' Dinner (Onsite participants only) Join fellow new participants and make connections. Organized by Secretariat, please note that there is a $15 entrance fee as this is not an IETF funded event. This dinner will be a short walk from the venue. Thursday TBD New Participants' Social Hour (Onsite only) Come join us to chat about how your IETF week went. This is a great opportunity to meet IETF Leadership! Refreshments will be provided. If you have any questions, please contact support@ietf.org! Meetings IETF 122 Bangkok IETF 123 Madrid IETF 124 Montreal Upcoming meetings Past meetings Interim meetings IETF Hackathons Code Sprint"
