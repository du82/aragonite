full_description = "IETF News Blog listing IETF Administration LLC 2025 Budget The IETF Administration LLC has finalised its budget for 2025. Jay Daley IETF Executive Director 22 Jan 2025 RFC Production Center management transition After an extensive review of recent developments in the RFC Editor function, the IETF Administration LLC (IETF LLC) and Association Management Solutions LLC (AMS) have agreed that the IETF LLC will assume management of existing RFC Production Center (RPC) staff, under an Employer of Record arrangement with AMS, the employer of the RPC team. Jay Daley IETF Executive Director 5 Jan 2025 Workshop on the Decentralization of the Internet at ACM CoNEXT 2024 The recent Decentralization of the Internet (DIN) workshop at ACM CoNEXT-2024 brought together network researchers, law and policy experts, and digital right activists to discuss the consolidation and centralization of the existing Internet applications, services, and infrastructure observed in recent years. Dirk Kutscher DINRG Co-chair Lixia Zhang DINRG Co-chair 19 Dec 2024 Launch of the IETF Community Survey 2024 The IETF Community survey is our major annual survey of the whole of the IETF community and is used to inform the actions of IETF leadership throughout the year. The 2024 IETF Community Survey is live and we want to hear from you! Jay Daley IETF Executive Director 19 Dec 2024 Second IASA2 Retrospective Report The IETF Administration LLC (IETF LLC) has now completed the second IETF Administrative Support Activity (IASA 2.0) retrospective. The report was developed with community input and review, and is now available online. Jason Livingood IETF Administration LLC Board Chair 18 Dec 2024 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter IETF Administration LLC 2020 Budget Reforecast Jay Daley IETF Executive Director 28 Aug 2020 The IETF Administration LLC has reforecast its 2020 budget to address the significant changes in the underlying assumptions since the original budget was created. The IETF Administration LLC published a 2020 budget back in January 2020 but since then the COVID-19 pandemic has led to significant changes in the underlying assumptions and so the budget has been reforecast. The main changes incorporated in this reforecast are:Actual figures for IETF 107Assume that IETF 108 and IETF 109 will be fully online.Estimating an insurance payout for our IETF 107 and IETF 108 claims.No permanent fundraiser appointed until next yearNo strategic retreats by any groupIncrease in tools spendThe investment income has not been reforecast due to exceptional market volatility. Budget Reforecast SummaryThe table below summarises this budget reforecast and compares it to the original 2020 budget and the 2019 budget. 2020 budget reforecast summary 2020 Budget F1 2020 Budget Variance 2019 Budget Non-Meeting Revenue $ 5,457,414 $ 5,457,414 $ 0 $ 5,083,560 Meeting Revenue $ 1,390,493 $ 3,818,999 $ (2,428,506) $ 3,941,880 TOTAL REVENUE $ 6,847,907 $ 9,276,413 $ (2,428,506) $ 9,025,440 Operating Expenses $ 5,135,618 $ 5,105,448 $ (15,340) $ 4,831,867 Meeting Expenses $ 1,557,989 $ 4,110,242 $ (2,470,253) $ 3,837,325 TOTAL EXPENSES $ 6,693,607 $ 9,215,690 $ (2,485,593) $ 8,669,192 Net Income $ 154,301 $ 60,723 $ 57,088 $ 356,248 Capital Expenditure $ 160,500 $ 160,500 $0 $ 190,550 Net Income after Capital $ (6,199) $ (99,777) $ 57,088 $ 165,698 As you will see, the net effect is a lower budget deficit. Share this page PreviousInternet Research Task Force at IETF 108 NextSchrödinger’s Internet at the IRTF"
