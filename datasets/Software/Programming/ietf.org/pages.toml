["https://ietf.org/blog/green-wg"]
title = "IETF  | The new GREEN working group gets ready for an energy efficient Internet"
description = "The Getting Ready for Energy-Efficient Networking (GREEN) working group will explore use cases, derive requirements, and provide solutions to optimize energy efficiency across the Internet."
full_description = "IETF News Blog listing IETF Administration LLC 2025 Budget The IETF Administration LLC has finalised its budget for 2025. Jay Daley IETF Executive Director 22 Jan 2025 RFC Production Center management transition After an extensive review of recent developments in the RFC Editor function, the IETF Administration LLC (IETF LLC) and Association Management Solutions LLC (AMS) have agreed that the IETF LLC will assume management of existing RFC Production Center (RPC) staff, under an Employer of Record arrangement with AMS, the employer of the RPC team. Jay Daley IETF Executive Director 5 Jan 2025 Workshop on the Decentralization of the Internet at ACM CoNEXT 2024 The recent Decentralization of the Internet (DIN) workshop at ACM CoNEXT-2024 brought together network researchers, law and policy experts, and digital right activists to discuss the consolidation and centralization of the existing Internet applications, services, and infrastructure observed in recent years. Dirk Kutscher DINRG Co-chair Lixia Zhang DINRG Co-chair 19 Dec 2024 Launch of the IETF Community Survey 2024 The IETF Community survey is our major annual survey of the whole of the IETF community and is used to inform the actions of IETF leadership throughout the year. The 2024 IETF Community Survey is live and we want to hear from you! Jay Daley IETF Executive Director 19 Dec 2024 Second IASA2 Retrospective Report The IETF Administration LLC (IETF LLC) has now completed the second IETF Administrative Support Activity (IASA 2.0) retrospective. The report was developed with community input and review, and is now available online. Jason Livingood IETF Administration LLC Board Chair 18 Dec 2024 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter The new GREEN working group gets ready for an energy efficient Internet Diego Lopez GREEN Working Group Co-chair Robert Wilton GREEN Working Group Co-chair 29 Oct 2024 Building on a successful Birds of a Feather (BOF) session held during IETF 120, the Getting Ready for Energy-Efficient Networking (GREEN) working group will meet for the first time during IETF 121 Dublin to explore use cases, derive requirements, and provide solutions for identifying and characterizing energy efficiency metrics, defining methods related to monitoring and controlling energy consumption of network devices, and optimizing energy efficiency across the Internet. Improving the energy efficiency of communication systems is highly sought after for environmental, business, and technical reasons yet no standards exist to accomplish this in heterogeneous networks. Network operators would like to have better tools for understanding and managing the energy consumption of components, devices, and services across their networks along with the evolution of usage patterns.. Operating an energy-efficient network over the long haul means deploying and managing updates to network infrastructures and functions to optimize energy use while achieving the network’s functional and performance requirements. For example, one desired outcome of the GREEN working group is to allow operators to combine knowledge of device and component power consumption with network wide traffic flow and behavioral knowledge to tune components of network devices to reduce power usage of individual devices, hence reducing overall power usage of the entire network. The GREEN working group will initially focus on the following deliverables:An Informational document that (1) defines common terminology and metric definitions, (2) categorizes various types of metrics and measurements at component, device, and network levels.Standard Track definitions of YANG data models at the component level, device level, and network level for energy efficiency network management including energy usage monitoring and energy consumption management.An Informational document that (1) defines a set of architectural components for managing Energy Efficient Networks and (2) describes incremental deployment considerations for new energy efficiency metrics monitoring and capability discovery, and management within a network domain. The GREEN working group will seek guidance covering the incremental deployment of energy-efficient features in both network devices and the management of energy-efficient networks. The working group will collaborate with other working groups that address topics related to power consumption observability and energy efficiency management, such as IVY, OPSAWG, and NETMOD. It will also work and liaise with other stakeholders such as industry associations and other standards development organizations (SDOs).For full details and background, see the GREEN working group page on the IETF Datatracker. To join the discussion, sign up for the working group mailing list. And, if you’d like to join the first working meeting, register for the upcoming IETF 121 Dublin meeting, 2-8 November, and participate in-person or remotely. The GREEN session will be held at 9:30 UTC on 4 November, with a view-only livestream available from the IETF Live webpage. Share this page PreviousIETF Annual Report 2023 NextIETF 121 post-meeting survey"
