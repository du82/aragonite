title = "IETF  | Interim meetings"
description = 'Links to announcements and other information about "interim" meetings (held between IETF Meetings) that some working groups occasionally hold, either face-to-face or virtually via conference calls.'
full_description = 'Meetings Interim meetings The work of the IETF is largely conducted over mailing lists; however, some working groups also occasionally hold "interim" meetings, either face-to-face or virtually. Interim meetings held between IETF meetings focus on specific issues and accelerate the working group process.Upcoming interim meetingsA complete list of upcoming interim meetings is available on the IETF Datatracker. Interim face-to-face meetings are scheduled by Working Group chairs and require Area Director approval. They must be announced at least four weeks prior to the meeting. Virtual interim meetings must be announced at least two weeks prior to the meeting, and require Working Group Chair approval.Past interim meetingsA list of past interim meetings is also available on the IETF Datatracker. Archives for each meeting include meeting agendas, minutes, participation records, as well as slides and documents presented and discussed during the meeting.For more information about interim meetings, please see the IESG Statement: Guidance on In-Person and Online Interim Meetings. Meetings IETF 122 Bangkok IETF 123 Madrid IETF 124 Montreal Upcoming meetings Past meetings Interim meetings IETF Hackathons Code Sprint'
