full_description = "IETF News Blog listing IETF Administration LLC 2025 Budget The IETF Administration LLC has finalised its budget for 2025. Jay Daley IETF Executive Director 22 Jan 2025 RFC Production Center management transition After an extensive review of recent developments in the RFC Editor function, the IETF Administration LLC (IETF LLC) and Association Management Solutions LLC (AMS) have agreed that the IETF LLC will assume management of existing RFC Production Center (RPC) staff, under an Employer of Record arrangement with AMS, the employer of the RPC team. Jay Daley IETF Executive Director 5 Jan 2025 Workshop on the Decentralization of the Internet at ACM CoNEXT 2024 The recent Decentralization of the Internet (DIN) workshop at ACM CoNEXT-2024 brought together network researchers, law and policy experts, and digital right activists to discuss the consolidation and centralization of the existing Internet applications, services, and infrastructure observed in recent years. Dirk Kutscher DINRG Co-chair Lixia Zhang DINRG Co-chair 19 Dec 2024 Second IASA2 Retrospective Report The IETF Administration LLC (IETF LLC) has now completed the second IETF Administrative Support Activity (IASA 2.0) retrospective. The report was developed with community input and review, and is now available online. Jason Livingood IETF Administration LLC Board Chair 18 Dec 2024 IETF Administration LLC 2025 Draft Budget The IETF Administration LLC has prepared its draft budget for 2025 and now seeks community feedback. Jay Daley IETF Executive Director 13 Dec 2024 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Launch of the IETF Community Survey 2024 Jay Daley IETF Executive Director 19 Dec 2024 The 2024 IETF Community Survey is live and we want to hear from you! Please respond by 20 January 2024. The IETF Community survey is our major annual survey of the whole of the IETF community and is used to inform the actions of IETF leadership throughout the year. Our 2023 survey had over 2000 responses and the results were documented in a detailed report.We are now launching our 2024 IETF Community Survey and we would be very grateful if you could spare six minutes to provide your feedback on the IETF and your experiences even if you don’t consider yourself an IETF participant:https://ietf.iad1.qualtrics.com/jfe/form/SV_7ajlQ6jgwMrIKPkPlease note that Javascript is required for this survey, and that we run this survey in anonymous mode and do not collect data such as IP addresses. It will take about six minutes to complete the survey.An invitation to participate in this survey will be sent directly to approximately 53,000 email addresses on Thursday 19 December / Friday 20 December from my address <exec-director@ietf.org>. These email addresses are all those subscribed to an IETF mailing list except those who have previously unsubscribed from this survey.If you want to unsubscribe now from this and all future community surveys then you can do so by emailing ietf-surveys-leave@ietf.org and responding to the confirmation email. If you have a more complex unsubscription request then please send me the list of addresses to unsubscribe. Your unsubscription will be recorded for future community surveys. Apologies in advance if you get the invitation more than once.This survey will close on Monday 20 January 2025. Thanks in advance for your time! Share this page PreviousSecond IASA2 Retrospective Report NextWorkshop on the Decentralization of the Internet at ACM CoNEXT 2