["https://a-k-apart.com/faq.html"]
title = "Frequently Asked Questions @ 10K Apart"
description = "The who, what, when, where and why of this contest."
full_description = "Why progressive enhancement?Progressive enhancement is the gold standard for web design. It ensures your creation will reach the most people because it assumes nothing of your users other than they have access to the web via some sort of browser. Progressive enhancement makes no assumptions about a user’s abilities or the capabilities of their browser or device. For more on progressive enhancement, check out this article on A List Apart or take a look at Adaptive Web Design (you can read the first edition for free). Can I use a feature that is only implemented in one browser?You can, provided you still provide an experience for everyone who doesn’t have that feature. The focus of this contest is showing what’s possible using web standards. The web is constantly evolving though, and we recognize that. If you want to use a developing standard (e.g. Service Worker) feel free, but don’t assume it’s available. Follow the philosophy of progressive enhancement. Why no JavaScript libraries?JavaScript has evolved a lot over the years and many of the pain points JavaScript libraries were created to address no longer exist. JavaScript libraries also add a lot of bulk to your code. In order to encourage folks to use native JavaScript functionality and keep their project as slim as possible, this year we’ve chosen to remove JavaScript libraries from the “free resource” camp. If you absolutely need a feature provided only by a library, consider extracting that piece (provided its license allows for that, of course) rather than including the whole library.To see how JavaScript counts in your 10kB, scroll down. How do I test for accessibility?Real user testing is always best, but since this is a contest and we are looking to get you used to spot-checking your work for accessibility, we’d recommend taking a look at aViewer, aXe, a11y, F12’s Accessibility Tools, Chrome’s Accessibility Developer Tools, or any of the other amazing tools on the W3C’s Web Accessibility Evaluation Tools List."
year_published = 2025
clearnet = "https://a-k-apart.com/faq.html"
