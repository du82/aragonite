full_description = "A 10k tribute to CSS by Henrik Nielsen There are lots of cool webpages showing what can be done with CSS. Some of them achieve their awesomeness by sacrificing semantic markup, resulting in a DOM that is bloated with elements that has no other purpose than to serve the CSS. This 10k tribute to CSS takes a different approach by applying CSS to semantic markup only. A single <h1> element is turned into a cartoon that complements the subject of the content, just to emphasize that additional markup isn’t needed for CSS to shine. View the source of this project on GitHub: https://github.com/1hdn/a-10k-tribute-to-css"
