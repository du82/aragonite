["https://a-k-apart.com/legal.html"]
title = "The Official Rules @ 10K Apart"
description = "The inevitable fine print."
full_description = "The 10k Apart Official RulesThe inevitable fine printPLEASE NOTE: It is your sole responsibility to review and understand your employer's policies regarding your eligibility to participate in trade promotions. If you are participating in violation of your employer's policies, you may be disqualified from entering or receiving prizes. Microsoft disclaims any and all liability or responsibility for disputes arising between an employee and their employer related to this matter, and prizes will only be awarded in compliance with the employer's policies.GOVERNMENT EMPLOYEES: Microsoft is committed to complying with government gift and ethics rules and therefore government employees are not eligible for this offer.This Contest is hosted in the United States, and entry information is collected on computers in the United States. This Contest will be governed by the laws of the State of Washington, and you consent to the exclusive jurisdiction and venue of the courts of the State of Washington for any disputes arising out of this Contest. If you do not agree with this provision and these Official Rules, please do not enter this Contest.Common Terms Used In These Rules:These are the official rules that govern how the 10K Apart promotion (“Contest”) will operate.In these rules, “we,” “our,” and “us” refer to Microsoft Corporation, the sponsor of the Contest. “You,” “yourself,” “I,” “me,” and “my” refers to an eligible Contest entrant.1. Contest DescriptionThis is a skill-based Contest. Entrants create and submit a web project where the rendered web pages are fully usable without exceeding a size of 10 kilobytes (kB). Refer to Section 3 (“Who Can Enter”) for eligibility determination and Section 4 (“What Constitutes An Eligible Entry”) for additional entry requirements and details.For purposes of this Contest, the web project that you create and submit in the Contest will be called an “entry.” The Contest seeks entries in five (5) separate Contest Categories: Best Overall, People’s Choice, Best Design, Best Technical & Notable Mention. All eligible entries received will be automatically entered into all 5 Contest Categories and will be judged using judging criteria described in Section 7 (“How Entries Will Be Judged”).2. What Are The Start And End Dates?This Contest starts at 12:01 p.m. Pacific Time (PT) on August 15, 2016 and ends at 5 p.m. PT on September 30, 2016 (“Entry Period”). Entries must be received within the Entry Period to be eligible.3. Who Can Enter?You are eligible to enter this Contest if you meet the following requirements at time of entry:You are a professional or a hobbyist in the field of web development or design; andYou are 18 years of age or older; and PLEASE NOTE: If you are otherwise eligible to enter, but you have not yet reached the age of majority in your place of legal residence, then you should ask your parent's or legal guardian’s permission prior to submitting an entry in this Contest.You are NOT a resident of any of the following countries: Cuba, Iran, North Korea, Sudan, and Syria; and PLEASE NOTE: U.S. export regulations prohibit the export of goods and services to Cuba, Iran, North Korea, Sudan and Syria. Therefore residents of these countries / regions are not eligible to participate.You are NOT an employee of Microsoft Corporation or an employee of a Microsoft subsidiary; andYou are NOT involved in any part of the administration and execution of this Contest; andYou are NOT an immediate family (parent, sibling, spouse, child) or household member of a Microsoft employee, an employee of a Microsoft subsidiary, or a person involved in any part of the administration and execution of this Contest.4. What Constitutes An Eligible EntryTo be eligible for judging an entry must meet the following requirements:The entry MUST use HTML; andThe entry MUST be accessible as a public repository on Github. Every public page of the entry must be usable WITHOUT the total download of the HTML page and all assets exceeding 10 kilobytes (10,240 bytes); andThe entry MUST function in the latest version of Microsoft Edge, Firefox, Safari, and Chrome.The entry MAY use any of the following additional technology components; andCSSJavaScriptSVGImages (e.g. PNG, JPG, WebP, JPEG-XR)The entry CANNOT include third party source code, libraries, or assemblies that are not openly licensed. Data from third-party web services is permitted, provided that you have obtained all consents, approvals, or licenses required to use the data and you submit it into this Contest along with your entry.In addition:your entry must be your own original work; andyour entry cannot have been selected as a winner in any other contest; andyou must have obtained any and all consents, approvals or licenses required for you to submit your entry; andyour entry must not otherwise violate the rights of any other person or company by using their trademarks, music, logos, names or images without their express written consent.Entries may NOT contain, as determined by us, in our sole and absolute discretion, any content that:is sexually explicit, unnecessarily violent or derogatory of any ethnic, racial, gender, religious, professional or age group; profane or pornographic;promotes alcohol, illegal drugs, tobacco, firearms/weapons (or the use of any of the foregoing) or a particular political agenda;is obscene or offensive;defames, misrepresents or contains disparaging remarks about other people or companies;communicates messages or images inconsistent with the positive images and/or good will to which we wish to associate; and/or violates any law;We reserve the right to reject any entry, in our sole and absolute discretion, that we determine does not meet the above criteria.5. How My Entry May Be UsedOther than what is set forth below, we are not claiming any ownership rights to your entry. However, by submitting your entry, you:agree that, to the extent you have any rights in and to the entry, you are granting us a non-exclusive, irrevocable, royalty-free, worldwide, sublicenseable and transferable right and license to: (i) use, review, assess, test and otherwise analyze your entry and all its content in connection with this Contest; and (ii) feature your entry in connection with the promotion of this Contest and Microsoft or An Event Apart events in all media (now known or later developed).agree to sign any necessary documentation that may be required for us and our designees to make use of the rights you granted above;understand and acknowledge that we may have developed or commissioned materials similar or identical to your submission and you waive any claims you may have resulting from any similarities to your entry;understand that we cannot control the incoming information you will disclose to our representatives in the course of entering, or what our representatives will remember about your entry. You also understand that we will not restrict work assignments of representatives who have had access to your entry. By entering this Contest, you agree that use of information in our representatives' unaided memories in the development or deployment of our products or services does not create liability for us under this agreement or copyright or trade secret law; andunderstand that you will not receive any compensation or credit for use of your entry, other than what is described in these Official RulesPlease note that following the end of this Contest your entry may be posted on a website selected by us for viewing by visitors to that website. We are not responsible for any unauthorized use of your entry by visitors to this website. While we reserve these rights, we are not obligated to use your entry for any purpose, even if it has been selected as a winning entry.If you (or your parent or legal guardian) do not want to grant us these rights to your entry, please do not enter this Contest.6. How To Submit Your EntryTo submit your web application, navigate to https://a-k-apart.com/, and enter the Contest by submitting your project, as instructed. We will accept up to three (3) entries per person. We are not responsible for entries that we do not receive, or that we are unable to access, for any reason, or for entries that we receive but are not decipherable for any reason.We will automatically disqualify any incomplete or illegible entry and any entries that we receive that do not meet the requirements described above and in Section 4 (“What Constitutes An Eligible Entry”).7. How Entries Will Be JudgedAll eligible entries received will be automatically considered for each Contest Category: Best Overall, People’s Choice, Best Design, Best Technical & Notable Mentions. Winners in each Contest Category will be determined by the judging panel listed on the home page of the contest.Judging CriteriaFollowing the close of the Entry Period, a panel of judges will conduct a “blind” review of all eligible entries received and assess each entry based on a 100 point scale, using the following judging criteria:Accessibility - 10 pointsInteroperability - 10 pointsPerformance - 40 pointsProgressive enhancement - 20 pointsUsefulness or Novelty - 10 pointsDesign & User Experience - 10 pointsThe scores will be used to help the panel select one grand prize winner (Best Overall), one winner for Best Design, one for Best Technical and 12 Notable Mentions. In the event of any ties, the judging panel will have sole discretion to select a winner.People’s ChoiceWe will present eligible entries online within three (3) business days of receipt of valid entry. Between 12:01 p.m. Pacific Time (PT) on October 7, 2016, and 5 p.m. PT on October 21, 2016 (“Public Voting Period”), visitors will be asked to vote for an entry by logging into the contest site using a Facebook, Github, or Twitter account and following the prompts on each entry’s page. Votes will be limited to one vote per person per project. Votes determined to be in excess of this limit will be thrown out.At the conclusion of the Public Voting Period, we will determine one People’s Choice winner, based on total weighted ratings received. In the event of a tie between any eligible entries, the tie will be broken by judges, who will judge the tied entries based on the criteria listed above.We, in our sole discretion, reserve the right to void suspect ratings or take other remedial actions if we suspect any use of robotic, automatic, macro, programmed or similar methods, known or unknown, to impact the integrity of the public rating result.For both Contest Categories, the decisions of the judges are final and binding. If we do not receive a sufficient number of entries meeting the entry requirements, we may, at our discretion, select fewer winners than the number of Contest prizes described below.8. The PrizesOne (1) Best Overall Prize.Admission for winner to attend an An Event Apart Event in a city of their choice. The registration is valid for one year and expires on October 24, 2017. Approximate Retail Value, ARV, $1,095;$4000 USD Visa Cash Card;An 21-volume A Book Apart Library, ARV, $262.50;A copy of the book Adaptive Web Design, 2nd Edition, ARV, $34.99.Three (3) Runners Up Prizes (Best Design, Best Technical & People’s Choice).Admission for winner to attend an An Event Apart Event in a city of their choice. The registration is valid for one year and expires on October 24, 2017. Approximate Retail Value, ARV, $1,095;$2000 USD Visa Cash Card;An 21-volume A Book Apart Library, ARV, $262.50;A copy of the book Adaptive Web Design, 2nd Edition, ARV, $34.99.Twelve (12) Notable Mention PrizesA complete digital collection of A Book Apart Briefs, ARV, $24.A digital copy of Adaptive Web Design, 2nd Edition, ARV, $27.99.If the An Event Apart event is cancelled for any reason, Sponsor shall have no further obligation to the winner other than to provide the remainder of the prize package.If you are selected as a potential winner of this Contest:The prize will be awarded to you and you shall ensure it is used and/or distributed in accordance with your company’s policies (Note: We are not responsible for the re-distribution of prizes within your company, if required); andYou may not exchange your prize for cash or any other merchandise or services; andYou may not designate someone else as the winner. If you are unable or unwilling to accept your prize, we will award it to an alternate potential winner; andIf you accept a prize, you will be solely responsible for all applicable taxes related to accepting the prize.9. How Winners Will Be NotifiedIf you are a potential winner, we will notify you by sending a message to the e-mail address listed on your entry within seven (7) days following winner determination. If the notification that we send is returned as undeliverable, or you are otherwise unreachable for any reason, we may award the prize to an alternate winner.If there is a dispute as to who is the potential winner, we will consider the potential winner to be the authorized account holder of the e-mail address used to enter the Contest.If you are a potential winner, we may require you to sign an affidavit of eligibility, liability/publicity release and W-9 or W8-BEN tax form. If you do not sign and return these required forms within the time period listed on the winner notification message, we may disqualify you and select the next highest-scoring entry.10. Other Conditions You Are Agreeing To By Entering This ContestBy entering this Contest you (your parent or legal guardian if you are a minor) agree and understand that:To abide by these Official Rules;To the extent allowed by law, to release and hold harmless Microsoft, their respective parents, subsidiaries, affiliates, employees and agents from any and all liability or any injury, loss or damage of any kind arising from or in connection with this Contest or any prize won;That Microsoft’s decisions will be final and binding on all matters related to this Contest; andThat Microsoft may use of your proper name and state of residence online and in print, or in any other media, in connection with this Contest, without payment or compensation to you, except where prohibited by law.This Contest will be governed by the laws of the State of Washington, and you consent to the exclusive jurisdiction and venue of Washington courts (state and federal) for any disputes arising out of this Contest.11. If Something Unexpected Happens And The Contest Can’t Run As PlannedIf someone cheats, or a virus, bug, catastrophic event, or any other unforeseen or unexpected event that cannot be reasonably anticipated or controlled, (also referred to as force majeure) affects the fairness and/or integrity of this Contest, we reserve the right to cancel, change or suspend this Contest.This right is reserved whether the event is due to human or technical error. If a solution cannot be found to restore the integrity of the Contest, we reserve the right to select winners from among all eligible entries receiv"
