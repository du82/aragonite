title = "Creating an Accessibility Engineering Practice | blog.danielna.com"
description = "Accessibility is not a feature, it's a requirement."
full_description = "Creating an Accessibility Engineering Practice Accessibility is not a feature, it's a requirement. Note: You can link directly to this blog post via http://a11y.danielna.com. I was a founding engineer and then the engineering manager of Etsy’s first accessibility team for about a year, from mid-June 2016 to mid-June 2017. We were a small team of three, but Cameron Cundiff’s deep subject matter expertise/strategic vision and Kristyn Reith’s work ethic and quick study of a completely new technical domain resulted in an organizational impact that far exceeded our team size. I will be forever proud of how much we accomplished. I very intimately understand how making your product accessible can seem like an intractable problem, especially at large companies with large codebase(s) and lots of teams. I still remember the meeting in 2015 that kicked it all off. Our manager at the time asked, “what should we work on this year?” Someone asked, “what’s the deal with accessibility?” We all looked at each other and shrugged. Beyond best practices like associating form labels with inputs and being moderately confident that alt attributes on images were important for some reason none of us had a real understanding of how accessibility worked. One of our overarching goals as a team was to teach. We knew that any inaccessible interfaces built at the company weren’t a function of apathy or malice but ignorance. Once engineers/designers knew how their design/UI decisions negatively impacted real users, could they ever again willingly create an inaccessible design? We weren’t looking just to impact the products they built at Etsy but also the products they built for the rest of their careers. While the lessons are still fresh I want to write the blog post that I wish I had read when I was first starting down this path, in the hopes that it gives you insight into possible steps and the belief that crafting culture around accessibility is possible. Teaching coworkers at your company about accessibility will only raise the engineering standards across our industry moving forward. Accessibility is not a feature, it’s a requirement. Disclaimers I no longer work at Etsy and the contents of this post is not speaking on behalf of the company. This post is 100% a reflection of personal experience and opinion. Our focus was web accessibility. Mobile accessibility is very important, but I don’t have as much experience with it. Table of contents Quick note: what is a11y? What are assistive technologies? Paradigm shifts The accessibility tree Keyboard accessibility How do AT users interact with websites? Changing culture The business case Legal SEO “How many people with disabilities use our site anyway?” Can you hear from real users? (User research is amazing) Remediation strategies Automation Manual accessibility review Bake accessibility into your UI/component library/styleguide “Accessibility is solved at the design stage” Quick wins / where to start Familiarize yourself with WCAG 2.0 Get plugged into the #a11y community Add a “Skip to Content” link Fix your heading outlines Fix your forms Everything else What’s the deal with ARIA? What’s the deal with screen readers? What are other organizational accessibility wins to consider? Real-time captioning Video captions Invite guest speakers Tools and resources that we actually used Quick note: what is a11y? What are assistive technologies? “a11y” is a numeronym and the most succinct/common representation of the word “accessibility” on the web. The basic idea is that there are 11 letters between the first and last letters: a-ccessibilit-y. Other common numeronyms are i18n (i-nternationalizatio-n) and l10n (l-ocalizatio-n). #a11y is the most common hashtag you’ll find online, and particularly great to surface goings-on on Twitter. In this post, “assistive technologies” are tools used by people with disabilities to use software/websites. AT is a broad spectrum of devices or software depending on the type of disability: visual, auditory, motor or cognitive. I’ll typically abbreviate “assistive technologies” as AT. Paradigm shifts I had a few “aha!” moments when I was learning about accessibility that I felt had huge impacts on how I thought about building websites. These included the accessibility tree, keyboard accessibility and how users of AT interact with websites. The accessibility tree I had a seminal moment early on in my accessibility journey at Beecher’s Cheese after my first visit to the A11YNYC meetup. I probably said something that was very incorrect, at which point the person I was talking to asked me, “wait, do you understand the accessibility tree?” The accessibility tree is a tree-based, internal representation of the UI that is exposed explicitly to AT. If you’ve ever used Chrome developer tools to examine the DOM tree the accessibility tree is similar in spirit. Browsers map your HTML into a tree-based structure of nodes that represent a visual display of information (the DOM tree). Browsers also map your HTML into a tree-based structure of nodes that represent a semantic display of information (the a11y tree). “Semantics” is the key term here. The a11y tree is entirely about semantics. The DOM tree cares about what your HTML looks like. The a11y tree cares about what your HTML means. AT are essentially robots that consume an accessibility tree. That’s the key takeaway: AT don’t look at rendered UI, and the interface between AT and computing interfaces is the accessibility tree. Let’s cover a trivial example of the implications of HTML semantics. Imagine a UI with the following “buttons” (currently styled via bootstrap): See the Pen Buttons: span vs button by Dan Na (@dxna) on CodePen. Visually these buttons appear to be exactly the same: same color, font, border-radius, etc. If all you care about is what your HTML looks like (the DOM tree) then those HTML snippets are equivalent. But if you care about what the HTML means (the a11y tree), those HTML snippets are completely different. Because CSS class names are arbitrary, AT can’t know that your btn and btn-primary classes make a <span> or <div> appear like a button. If you use an actual <button> HTML element, you promote proper HTML semantics and increased usability for AT users. Users of AT know that elements on a webpage are designed to perform specific behaviors – buttons trigger actions, links redirect to content, headings designate topical hierarchy, etc. These assumed behaviors and semantic meanings are baked into HTML specifications, which is why, for example, <h1> tags are intended to precede <h2> tags. When web developers arbitrarily use HTML elements without regard for their semantic meanings and instead rely on visual treatments to prescribe meaning, this foundational understanding of how webpages work crumbles and usability for non-visual users crumbles with it. Imagine a low vision or blind screen reader user. When the screen reader traverses the a11y tree, the <button> element above will be announced as a “button”. The user can then make inferences about how to interact with the current page given that announcement. “Ah, this is a button, meaning it should perform an action.” In contrast, a <span> or <div> styled to appear like a button do not express the same intention, and a screen reader may not even announce them at all. When I understood the idea of the a11y tree I felt like understanding the accessibility implications of UI decisions no longer required a huge suspension of disbelief. Why do form labels need properly associated inputs? Because visually co-locating a label next to an input is not enough. Using the “for” attribute builds that semantic association between label and input. Why add “alt” attributes describing the contents of images? Because if you can’t visually inspect an image, how else would you know its contents? (Note: there’s nuance to adding alt attributes to images. See “Writing for all people: how to use alternative text well” by Shopify UX.) For a long time the a11y tree wasn’t easy to visualize well. However, as a result of some amazing work by the Chrome team, you can even view the a11y tree in Chrome DevTools if you turn on an experimental flag. First, turn on the DevTools experiment flag by navigating to chrome://flags: Then, enable the “Accessibility Inspection” checkbox under the Experiments menu (use SHIFT+CMD+P to access the dynamic dropdown): Let’s look at some form inputs with labels of varying correctness and their names in the accessibility tree. As demoed by the following CodePen, the following three text inputs look identical: See the Pen Labels by Dan Na (@dxna) on CodePen. The “First name” label is properly associated to its input via the “for” attribute. Thus, when you focus the “First name” input, the accessible name comes from the label: The “Middle name” label doesn’t have a “for” attribute but is properly associated with its input via wrapping. Thus, when you focus the “Middle name” input, the accessible name comes from the label: The “Last name” label is visually next to, but unassociated with, its input. Thus, when you focus the “Last name” input, there is no prevailing name in the accessibility tree: Again, unlike consuming an interface visually the accessibility tree can’t make inferences based on location. Despite the fact that those three form fields appear properly constructed they’re not. Associations and representations must be semantic and explicit. My main point is that understanding the concept of the accessibility tree means that you don’t need a disability to perceive how an interface is parsed by AT. Does each item have a representative name or label? Does your use of HTML elements match their intended purpose? (i.e. are you using LINKS to redirect to content and BUTTONS to perform actions?) If so, great! If not, the semantic representation of your interface might not make sense. Keyboard accessibility Making your site fully keyboard accessible will go a long way towards making your site generally accessible. What I mean by “keyboard accessibility” is your ability to perform every action on the site without the use of a mouse. This is consistent with how a lot of AT fundamentally work. From screen readers to sticks, wands and switches, traversing a webpage from beginning-to-end via many forms of AT is essentially traversing via keyboard focus. Chances are the majority of the websites you visit on a daily basis are completely keyboard inaccessible. I’d encourage you to go to some of your favorite websites and try it yourself. Major considerations here include a visible keyboard focus indicator and the ability to get in and out of menus and modals. If you press TAB on your company’s website, can you follow the keyboard focus throughout the page or does it get lost via some errant outline: 0 CSS? Modals are particularly problematic. When you click a button to open a modal, does keyboard focus enter the modal content? Can you press the ESCAPE key to close the modal? When you do close it, does keyboard focus return to the element that triggered its opening? There are also some particular behaviors around keyboard interactions. Did you know that <button> elements are triggered by default by both SPACEBAR and ENTER keypress? When you use <span> and <div> elements to create “buttons” this means you must add additional JS to attach event listeners for these keypresses (which is another reason to use the stock <button> element!) Training every designer/developer at your company how to use a screen reader may be an unrealistic goal. But emphasizing building interfaces that are functional with a keyboard is completely doable and can preempt a lot of accessibility problems. Designers can easily include both hover and focus states within design comps, and you can make a visible focus outline mandatory within your UI. How do AT users interact with websites? If you’re like me, chances are you’ve never seen a user of AT interact with a website. It’s an eye-opening experience and likely more intuitive than you think. Think about how most sighted people consume webpages. Chances are they visually skim the page. When they’re looking for a specific type of functionality their eyes dart around the page, looking for the “Add to cart” or “Sign in” button. When they’re looking to simply understand the gist of an article they may scroll quickly, reading the headlines but skipping the details. Here’s what navigating via headline looks like in VoiceOver and Safari for this blog post: AT like screen readers enable users to iterate specific components of a page in a similar vein. Users will often iterate the headings only to get an idea of the page structure or drill down on a specific area, or iterate only the form elements to see what actions are available (like “Sign In” or “Add to Cart”). This effectively answers the question, “semantically, what does this page look like?” If your headings don’t respect proper hierarchy (<h1>s before <h2>s before <h3>s… and no skipped levels) or you use <span>s in lieu of <button>s, these navigation methods are rendered useless. Yet another reason why proper semantics are huge. Changing culture Changing a culture to care about accessibility is the number one thing people ask about, and for good reason – it’s the hardest part. Our team was lucky in that the company was very values aligned and we had a lot of buy-in from leaders and coworkers who wanted to build accessible products but didn’t know where to start. If you work at a place that lacks similar values alignment that’s okay, as I still think there are some compelling business reasons to care about accessibility. But that does likely create an uphill battle. While I don’t have a silver bullet here, I do have some considerations that I think are relevant. The business case Legal Legal liability around inaccessible websites is real. In 2008, Target Corp settled a $6M class action lawsuit with the National Federation of the Blind over its inaccessible shopping experience. Since then Target.com has made amazing strides to provide an accessible experience for online shoppers. Organizations like National Federation of the Blind can sue companies as a very effective advocacy measure. And once that happens, frankly, you’re not left with great options. Here’s a headline you don’t want across TechCrunch: “[Your company] countersues National Federation of the Blind.” For companies with a web presence in Europe, there is also an increasing number of web accessibility regulations being set by European countries. If you plan to internationalize your product, prepare to take a serious look at accessibility before you do so. That being said, the risk of legal liability wrt accessibility is very difficult to quantify. Karl Groves has a great blog post exploring this uncertainty that’s worth a read. SEO Remember when I said this? AT are essentially robots that consume an accessibility tree. AT remind me of an"
