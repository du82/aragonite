full_description = "Learn about all things digital accessibility The HighEdWeb 2020 Accessibility Summit offers informative sessions and engaging presentations about digital accessibility in higher education. Attendees will learn best practices, share stories with their peers and expand their knowledge on a wide range of topics. Explore the event schedule Attend a future summit Meet our presenters The HighEdWeb Accessibility Summit is powered by volunteers sharing their expertise with our community. Heather Battaglia 18F Adam Berkowitz University of Connecticut Jennifer Bland Level Access Levi Bloom Penn State World Campus Rachel Cherry WPCampus Alison Diefenderfer University of Michigan-Ann Arbor Erin Fryer College of William and Mary Jon Gunderson University of Illinois at Urbana-Champaign Robert Jolly 18F D Krahmer Colgate University Terrill Thompson University of Washington Terry Watson Penn State World Campus Kathryn Weber-Hottleman University of Connecticut Tom Wojciechowski Daemen University Angelina Zaytsev University of Michigan-Ann Arbor Thank you to our sponsors Continue your learning path HighEdWeb offers professional development throughout the year — tailored for colleges and universities. Find solutions for the issues facing digital teams in higher ed. Attend another event Learn on demand"
