he horizon. .bh-theme-card.alt.hvr-7 h3 { color: #ffffff; } .bh-theme-card.alt.hvr-7:hover h3 { color: #ffffff; } .bh-theme-card.alt.hvr-7 .eyebrow { color: #ffffff; } .bh-theme-card.alt.hvr-7:hover .eyebrow { color: #ffffff; } .bh-theme-card.alt.hvr-7 p { color: #ffffff; } .bh-theme-card.alt.hvr-7:hover p { color: #ffffff; } BIO EATS WORLD Journal Club: Remodeling Oncogenic Transcriptomes Unexpected results and translational implications from a recent paper, in one of our Journal Club podcast episodes. .bh-theme-card.alt.hvr-8 h3 { color: #ffffff; } .bh-theme-card.alt.hvr-8:hover h3 { color: #00a4b1; } .bh-theme-card.alt.hvr-8 .eyebrow { color: #ffffff; } .bh-theme-card.alt.hvr-8:hover .eyebrow { color: #00a4b1; } .bh-theme-card.alt.hvr-8 p { color: #ffffff; } .bh-theme-card.alt.hvr-8:hover p { color: #00a4b1; } SPECIAL FEATURE The Opportunity for Healthcare x Fintech How technology will make our healthcare system more intuitive, efficient, and cost-effective. .bh-theme-card.alt.hvr-9 h3 { color: #ffffff; } .bh-theme-card.alt.hvr-9:hover h3 { color: #ffffff; } .bh-theme-card.alt.hvr-9 .eyebrow { color: #ffffff; } .bh-theme-card.alt.hvr-9:hover .eyebrow { color: #ffffff; } .bh-theme-card.alt.hvr-9 p { color: #ffffff; } .bh-theme-card.alt.hvr-9:hover p { color: #ffffff; } BIO EATS WORLD AI and Actionable Drug Insights with Daphne Koller Hear about how AI can enable new models of discovery in biology, in this episode of Bio Eats World. .bh-theme-card.alt.hvr-10 h3 { color: #ffffff; } .bh-theme-card.alt.hvr-10:hover h3 { color: #4b5058; } .bh-theme-card.alt.hvr-10 .eyebrow { color: #ffffff; } .bh-theme-card.alt.hvr-10:hover .eyebrow { color: #00a4b1; } .bh-theme-card.alt.hvr-10 p { color: #ffffff; } .bh-theme-card.alt.hvr-10:hover p { color: #4b5058; } SPECIAL FEATURE Digital Health Builders Playbooks for going to market in digital health. .bh-theme-card.alt.hvr-11 h3 { color: #ffffff; } .bh-theme-card.alt.hvr-11:hover h3 { color: #ffffff; } .bh-theme-card.alt.hvr-11 .eyebrow { color: #ffffff; } .bh-theme-card.alt.hvr-11:hover .eyebrow { color: #a77ad7; } .bh-theme-card.alt.hvr-11 p { color: #ffffff; } .bh-theme-card.alt.hvr-11:hover p { color: #ffffff; } FEATURED ARTICLE The Biggest Company in the World Will the biggest company be a consumer healthtech company? An Ironman Suit for Doctors with Muthu Alagappan New Muthu Alagappan, Julie Yoo, Olivia Webb, and Kris Tatiossian Dr. Muthu Alagappan, MD, founder and CEO of Counsel Health, joins Julie Yoo, a16z Bio + Health general partner, to dive deep into the company's vision for revolutionizing healthcare through AI-powered asynchronous care.... Voice AI: Solving Healthcare’s Workforce Challenges with Ankit Jain Ankit Jain, Julie Yoo, Olivia Webb, and Kris Tatiossian Ankit Jain, CEO and cofounder of Infinitus Systems, Inc, joins Julie Yoo, a16z Bio + Health general partner, to discuss Infinitus's work in solving one of healthcare's most pressing challenges: workforce shortages. Lever... Transforming Clinical Trials with Alexander Saint-Amand Alexander Saint-Amand, Julie Yoo, Olivia Webb, and Kris Tatiossian Alexander Saint-Amand, cofounder and CEO of Topography, reflects on his journey from leading Gerson Lehrman Group (GLG), a pioneer in expert networks, to tackling systemic barriers in clinical trials at his current compa... It’s Time to Build: Healthtech Infrastructure Julie Yoo In the “Maslow's hierarchy” of the healthcare industry’s needs, the infrastructure layer is the foundational workhorse of the system. Healthtech infrastructure refers to the utilities and systems-of-record that underpin all of the core operational transactions, financial transactions, data exchange, and interoperability actions that occur across the healthcare system everyday. Marc Andreessen: Can Tech Finally Fix Healthcare? Marc Andreessen, Julie Yoo, and Vijay Pande Healthcare is a $4 trillion industry, making up nearly a fifth of the U.S. economy—but despite having some of the best doctors and advanced technology, the system often delivers poor outcomes at skyrocketing costs. Why i... Announcement: Andreessen Horowitz Partners with Lilly to Launch First-of-Its-Kind Biotech Ecosystem Fund a16z editorial Andreessen Horowitz (a16z) Bio + Health today announced a newly formed, first-of-its-kind venture capital fund to fuel broader innovation in human health, in partnership with Eli Lilly and Company (“Lilly”). The Biotech Ecosystem Venture Fund (“Fund”) seeks to drive transformative progress in healthcare by investing in therapeutic platforms and cutting-edge technology companies that can bring new medicines and disease treatments to improve patients’ lives. Investing in Slingshot AI Vijay Pande, Daisy Wolf, Bryan Kim, and Zach Cohen Today, we’re proud to announce we’ve led the Series A for Slingshot, the world’s first foundation model for psychology. This brings the total capital raised for the company to $40 million. Scaling Medicaid Innovation with Afia Asamoah, Rajaie Batniji, and Sanjay Basu Vineeta Agarwala, Afia Asamoah, Sanjay Basu, Rajaie Batniji, Kris Tatiossian, and Olivia Webb Rajaie Batniji, MD, PhD, Afia Asamoah, JD, and Sanjay Basu, MD, PhD, cofounders of Waymark, join Vineeta Agarwala, MD, PhD, a16z Bio + Health general partner, to discuss their transformative approach to Medicaid care delivery. Super Staffing in Healthcare with Munjal Shah Munjal Shah, Julie Yoo, Kris Tatiossian, and Olivia Webb Hippocratic AI cofounder and CEO Munjal Shah joins a16z Bio + Health general partner Julie Yoo to explore the incredible potential of generative AI in transforming healthcare delivery. Lessons from Healthcare Infrastructure Pioneers with Jeff Margolis Julie Yoo, Jeff Margolis, Olivia Webb, and Kris Tatiossian Jeff Margolis, founder of TriZetto, joins Julie Yoo, a16z Bio + Health general partner, to share the journey of building an iconic company in healthcare infrastructure. From the early days of managed care to creating a t... Super Staffing Healthcare, Codifying Compliance, & Scaling Services Julie Yoo, Angela Strange, and Joe Schmidt As we prepare to step into 2025, the possibilities for applied AI are reshaping industries in profound ways. Rare Disease, Big Impact with Matt Wilsey Jorge Conde, Matt Wilsey, Kris Tatiossian, and Olivia Webb Matt Wilsey, cofounder and CEO of Grace Science, joins Jorge Conde, Bio + Health general partner, to share the profound personal story of his daughter Grace's diagnosis with NGLY1 deficiency and how it catalyzed his journey to founding a biotech startup aimed at developing a cure for his daughter’s condition. Big Ideas in Tech for 2025 a16z editorial An external "AI brain." Big swings in biopharma. Infinite games. A nuclear resurgence. "Faceless" creators. Google search challengers. Battlefield AI. We asked 50 a16z partners to preview one big idea that will spur innovation in 2025. Bioorthogonal Chemistry with Carolyn Bertozzi Carolyn Bertozzi, Jorge Conde, Kris Tatiossian, and Olivia Webb Carolyn Bertozzi, PhD, Director of Sarafan Stanford ChEM-H and professor at Stanford University, joins Jorge Conde, general partner at a16z Bio + Health. The Longevity Imperative: Redefining the Way We Age Vijay Pande and Andrew Scott What if the biggest challenge of our time isn’t living longer, but living better? Mastering Data with Sajith Wickramasekara Jorge Conde, Jay Rughani, Sajith Wickramasekara, Kris Tatiossian, and Olivia Webb In this episode, a16z partners Jorge Conde and Jay Rughani sit down with Sajith Wickramasekara, CEO and cofounder of Benchling, to unpack the evolution of Benchling from idea to transformative software platform. The Freedom to Choose Your Own Insurance with Chris Ellis and Adam Stevenson Chris Ellis, Adam Stevenson, Jay Rughani, Julie Yoo, Kris Tatiossian, and Olivia Webb Chris Ellis, CEO and Adam Stevenson, president, both cofounders of Thatch, join Julie Yoo and Jay Rughani of a16z Bio + Health. From Surgeon to Biotech CEO with Jonathan Lim Jorge Conde, Jonathan Lim, Kris Tatiossian, and Olivia Webb Jonathan Lim, chairman and CEO of Erasca, joins Jorge Conde, general partner at a16z. In a recent conversation, Lim shared valuable insights about his transition to the biotech world, his leadership experiences, and the lessons he's learned while founding and guiding organizations through high-stakes decision making. Investing in Alchemy Julie Yoo and Jay Rughani Today, we are thrilled to announce our investment in Alchemy as they work to better connect our life sciences and healthcare delivery systems and solve these supply-demand mismatches in the pharmaceutical value chain. Alchemy has emerged to empower the long tail of independent providers with the physical, clinical, and digital infrastructure they need to fully serve their patient communities effectively, and profitably. Investing in Arda Therapeutics Becky Pferdehirt and Vineeta Agarwala If these modalities have proven to be so effective (in some cases, even curative) against cancer, is there a role for them outside oncology, in the treatment of chronic diseases that might also be driven by a population of bad-actor cells? Arda Therapeutics is building upon exactly this bold hypothesis. Why Tech Must Disrupt Healthcare Now Vijay Pande, Daisy Wolf, Steph Smith, Kris Tatiossian, and Olivia Webb Vijay Pande, general partner, and Daisy Wolf, investing partner, join host Steph Smith on this crossover episode of the a16z podcast. Medicaid Matters with Marta Bralic Kerns Marta Bralic Kerns, Will Shrank, Kris Tatiossian, and Olivia Webb Marta Bralic Kerns, founder and CEO of Pomelo Care, joins Will Shrank, MD, a16z Bio + Health venture partner. Together, they talk about the innovator’s dilemma with building in the Medicaid space Medicaid Matters with Nikita Singareddy Will Shrank, Nikita Singareddy, Kris Tatiossian, and Olivia Webb Nikita Singareddy, cofounder and CEO of Fortuna Health, joins Will Shrank, MD, a16z Bio + Health venture partner. This is the second episode in our Medicaid Matters series. Investing in GC Therapeutics Vineeta Agarwala GCTx is flipping the entire iPSC differentiation paradigm on its head. Rather than manually iterating through a limited set of differentiation protocols, the Human TFome technology platform instead deploys large-scale combinatorial screening to discover new hypotheses and new protocols that are as-yet unknown to even the best biologists. Medicaid Matters with Mark Smith Will Shrank, Mark Smith, Kris Tatiossian, and Olivia Webb Over the next three episodes, we’re going to talk about why Medicaid matters, and the potential for technology to make it easier for enrollees to access and utilize the program. Our first guest is Mark Smith, MD, Clinical Professor of Medicine at UCSF. Balancing AI Expertise and Industry Acumen in Vertical Applications Nikhil Buduma and Derrick Harris Ambience cofounder Nikhil Buduma discusses how to build vertical applications with AI models, including in health care, and why tech expertise isn't enough. AI + a'''
