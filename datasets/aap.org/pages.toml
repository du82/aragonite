["https://aap.org/en/policy"]
title = "Featured Policy"
description = "The American Academy of Pediatrics (AAP) is committed to advocating for evidence-based policies that promote the health and well-being of children. Explore our comprehensive policy resources covering a wide range of pediatric topics, including healthcare, education, safety, and more. Stay informed about the latest policy recommendations, position statements, and guidelines developed by leading pediatric experts. Join us in shaping a healthier future for children by accessing the AAP Policy webpage. Discover the trusted information and resources that empower healthcare professionals, policymakers, and parents to make informed decisions for child health."
full_description = "It appears you are using Internet Explorer as your web browser. Please note, Internet Explorer is no longer up-to-date and can cause problems in how this website functionsThis site functions best using the latest versions of any of the following browsers: Edge, Firefox, Chrome, Opera, or Safari. You can find the latest versions of these browsers at https://browsehappy.com This new clinical report examines the leading cause of pediatric visual impairment and recommends that pediatricians familiarize themselves with the condition and its causes, improve communication within the patient’s healthcare team and support research on cerebral/cortical visual impairment. Nonmedical prescription drug use (NMPDU), the use of controlled prescription medications for purposes other than initially intended by the prescriber, is common among adolescents and young adults (AYAs). In this new policy statement, the AAP recommends universal paid family and medical leave for at least 12 weeks with parity across all leave categories. In an updated policy statement, the AAP recommends cheerleading athletes be screened each year with preparticipation physical evaluations to give pediatricians the chance to assess any injuries while informing patients and families about ways to practice the sport safely. A new clinical report from the AAP frames the ethical, legal, and medical issues of permanent contraception in children, adolescents, and young adults with intellectual developmental disorder, emphasizing the importance of long-acting reversible and minimally invasive treatments. In this updated policy statement, the AAP recommends a trauma-informed approach to supporting students and reducing the need for exclusionary discipline. This updated AAP policy statement encourages parents and caregivers to read aloud with their newborns and young children as an opportunity to foster loving, nurturing relationships during a critical time of brain development. The AAP has published its first clinical guideline for pediatricians on prescribing opioids, including explicit instructions on how and when to prescribe these medications for pain while reducing the long-term risk of addiction."
year_published = 2024
year_updated = 2025
