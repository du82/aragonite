full_description = "Pediatric medical subspecialists and pediatric surgical specialists care for children with special health care needs. Since physicians in many pediatric subspecialties are in short supply, children and families face challenges in accessing timely health care. Pediatric subspecialty shortages mean traveling long distances to get care, waiting weeks or months to get an appointment with a subspecialist, going without care altogether, or getting care from providers with less specific training. Below are state-specific resources that detail the impact of these shortages in each state."
