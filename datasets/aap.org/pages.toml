["https://aap.org/en/community/aap-committees/committee-on-native-american-child-health"]
title = "Committee on Native American Child Health (CONACH)"
description = "The Committee on Native American Child Health (CONACH), offers its expertise to individuals and groups concerned about the issues facing American Indian/Alaska Native (AI/AN) children."
full_description = "Enhance your member experience by joining and connecting with a variety of communities that allow you to meet your needs and find your unique place in the AAP. It appears you are using Internet Explorer as your web browser. Please note, Internet Explorer is no longer up-to-date and can cause problems in how this website functionsThis site functions best using the latest versions of any of the following browsers: Edge, Firefox, Chrome, Opera, or Safari. You can find the latest versions of these browsers at https://browsehappy.com The Committee on Native American Child Health (CONACH), offers its expertise to individuals and groups concerned about the issues facing American Indian/Alaska Native (AI/AN) children. CONACH members are selected for their willingness to advocate on behalf of Native American children and for their previous experience in working directly with AI/AN children and youth. Committee members maintain contact with tribal, urban, and Indian Health Service (IHS) programs, and keep up with important changes, legislation, and regulations that affect Native American health in general (e.g., the Indian Self Determination and Education Act) and Native American child health (e.g., Indian Child Welfare Act) in particular. The committee meets twice a year - once in Washington, DC, which includes Hill visits and a legislative briefing and once in conjunction with consultation site visits in an Indian Health Service Area. Each meeting addresses the major health and social needs of Native American children and youth and how committee members and pediatricians can address these needs. The Committee helps disseminate research and model programs and promotes the multidisciplinary exchange of ideas through the biennial International Meeting on Indigenous Child Health (IMICH), which is co-sponsored by the Canadian Paediatric Society. The Committee supports the Indigenous Health Special Interest Group which provides a forum for pediatricians and other care health professionals serving AI/AN children to share successes, strategies and resource to support their care of AI/AN children and youth."
year_published = 2025
year_updated = 2025
