full_description = "Enhance your member experience by joining and connecting with a variety of communities that allow you to meet your needs and find your unique place in the AAP. It appears you are using Internet Explorer as your web browser. Please note, Internet Explorer is no longer up-to-date and can cause problems in how this website functionsThis site functions best using the latest versions of any of the following browsers: Edge, Firefox, Chrome, Opera, or Safari. You can find the latest versions of these browsers at https://browsehappy.com Note: Click here to join the Oregon Chapter, which has a separate membership application and renewal process. Chapters advocate for kids at the local level while providing education, QI initiatives, grant opportunities, mentorship, and career and leadership development. Join your chapter today to help shape the conversation for kids. Academy chapters are organized groups of pediatricians and other health care professionals working to achieve AAP goals in their communities. There are 59 chapters in the United States and 7 chapters in Canada. The US chapters generally are drawn along state lines, but two states with large populations (New York and California) constitute more than one chapter. In addition, two chapters serve pediatricians in the uniformed services (east and west, divided by the Mississippi River) and Puerto Rico and the District of Columbia are also separate chapters."
