title = "Child Nutrition"
description = "The blueprint reflects on the State of Children in 2020 and recommends policies to promote healthy children, support secure families, build strong communities, and reclaim America’s role as a leading nation for youth."
full_description = "Given the link between nutrition and health, the AAP is a leading voice in support of strong, science-based nutrition programs to help promote children's lifelong health and combat food insecurity. The blueprint reflects on the State of Children in 2020 and recommends policies to promote healthy children, support secure families, build strong communities, and reclaim America’s role as a leading nation for youth. The Academy advocates for policies and programs that help ensure all children have access to the optimal physical, mental and social health care they need. The AAP provides consultation and technical assistance to chapters seeking to influence state government policy. AAP has developed state fact sheets, advocacy reports, training modules and more to help support and improve health care for children."
