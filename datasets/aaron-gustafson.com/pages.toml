["https://www.aaron-gustafson.com/notebook/affirming-user-choice-with-checkboxes"]
title = "Affirming User Choice with Checkboxes :: Aaron Gustafson"
description = "“Checkbox” form controls have long been a part of software. They enable users to provide a simple binary response—yes or no. On the Web, we often see them in two scenarios: confirmations and multiple choice."
full_description = '''Affirming User Choice with CheckboxesThis is the second entry in the series Modern Web Form Best Practices.Published06 Jan 2016 by Aaron GustafsonReading Time5 minFiled Underforms web design accessibilityReactions10 Webmentions1 CommentsCrosspostedMediumLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)“Checkbox” form controls have long been a part of software. They enable users to provide a simple binary response—yes or no. On the Web, we often see them in two scenarios: confirmations and multiple choice.# Confirmation CheckboxesStandalone checkboxes are often employed to enable users to affirm a statement, as in this example from the American Express login form where a customer can indicate they’d like the site to remember them.American Express’ login form offers users the option of being remembered. As that is a binary choice (e.g. yes or no), the checkbox makes sense.Here’s a simplification of the markup they’re using:<input type="checkbox" id="lilo_checkBox" name="REMEMBERME"> <label for="lilo_checkBox">Remember Me</label>This works really well, though I generally prefer to combine explicit and implicit labeling to simplify my CSS selectors and broaden their applicability. Here’s how I would rewrite this control:<label for="lilo_checkBox"> <input type="checkbox" id="lilo_checkBox" name="REMEMBERME"> Remember Me </label>Regardless of the markup pattern itself, it’s important to note the explicit association of the form control and the label element (using the for attribute). You’ll also notice the input has a straightforward name value which will be submitted to the back end if the user ticks the box.It’s worth noting that some back-end systems may require a value be submitted for the given variable name (in this case, “REMEMBERME”) regardless of whether the user has ticked the checkbox. If that’s a requirement, you can alter the pattern to use a hidden input as well:<input type="hidden" name="REMEMBERME" value="no"> <input type="checkbox" id="lilo_checkBox" name="REMEMBERME" value="yes"> <label for="lilo_checkBox">Remember Me</label>The source order matters because with matching name values, the final submittable value will always be the one the back-end receives. With this setup, the value of “no” (from the hidden input) will be submitted by default. If the checkbox is ticked, its value is submitted instead, setting REMEMBERME to “yes”.# Multiple Choice CheckboxesThe other way we often see checkboxes used is to enable users to choose zero or more items from a collection of options. Consider this example from the Chattanooga Open Device Lab’s reservation form. It allows users to choose the devices they’d like to include in their test matrix:In this excerpt from the reservation form on the Chattanooga Open Device Lab website, users can choose to include gaming system options.The markup they employ is pretty well-organized and straightforward: it’s a list of checkbox options.<ul> <li> <label for="nintendo-ds-lite"> <input type="checkbox" name="reservation_requested_device[]" id="nintendo-ds-lite" value="Nintendo DS Lite (Upper Cabinet #13)" data-checkbox-required="" > Nintendo DS Lite </label> </li> <li> <label for="nintendo-wii"> <input type="checkbox" name="reservation_requested_device[]" id="nintendo-wii" value="Nintendo Wii (TV Area)" data-checkbox-required="" > Nintendo Wii </label> </li> <!-- list continues --> </ul>As this is an instance where a user could choose more than one option, the back end needs to be able to capture that information in what’s called an “array”. An array, if you’re unfamiliar, is a collection of values. You’ll notice that the name given to each of these checkbox input elements is the same: “reservation_requested_device[]”. The square brackets (“[]”) at the end of the name are the magic bit that allows the values of each chosen “reservation_requested_device” checkbox to be submitted as the value of “reservation_requested_device”.# Applicable AttributesCheckbox controls only use a subset of the typical input attributes. In particular, you’ll need to includename - This is the variable name you want to hold the user’s response. As mentioned in the previous section, appending “[]” to the variable name will allow the variable to hold all of the user’s choices as opposed to only the final one.value - This is the value that should be captured if the user ticks the checkbox.id - The unique identifier you’re using for the control in order to explicitly associate it with a label.There are a few optional attributes you might consider including as well.checked - Use this null attribute if you want the default state of the checkbox to be ticked. This attribute should be used with caution. Don’t use this attribute to automatically check confirmation boxes for things like mailing list opt-ins. Do use this attribute when you are displaying sensible default settings or displaying confirmations the user has already made (e.g. in the user’s profile or when re-displaying the form when it has a submission error).required - Use this to indicate the checkbox must be ticked for the form to be valid. It’s important to note that this attribute is typically only useful in confirmation checkbox scenarios. If you need a user to choose at least one from a multiple choice checkbox collection, it’s useless unless you need them to pick a specific one. To require one (or more) of a multiple choice checkbox group, you currently need to use JavaScript, like the one the Chattanooga Open Device Lab uses.# Checkbox vs. Other ControlsCheckboxes excel at allowing users to indicate preference from a pre-defined set of options. But there are other form control types that allow for similar control over user responses. That can make it difficult to decide which element to use.# Dropdown List (select)The select element is another tried and true option for allowing users to indicate preference. A simple two-choice select could achieve the same goal as a confirmation checkbox, but it’s a little clunkier. In terms of user interface, select elements require more clicks of your users. They also obscure the complete list of choices from view because only one options is displayed at a time. Their appearance makes them more compact, but can make it difficult to get a complete picture of what choices are available when you can’t see them all.You can enable multiple choice in a select element by adding the multiple attribute to it, but depending on the number of option elements, it could also be a little unwieldy. Depending on the size of the select and the number of options, you could also create an inner scroll that could be awkward on certain touch-based devices.The select element has its place, but should be used sparingly. I’ll go in-depth with select elements in a future post.# Choose One (input[type=radio])For simple confirmation questions, it’s completely valid to use a radio form control in lieu of a single checkbox. In fact, in some cases, it may offer a more explicit choice for your users. Consider this example from Subway’s online ordering tool.In this excerpt from Subway’s online ordering tool, they use a checkbox to confirm the user wants their sandwich toasted.A checkbox labelled “Fresh Toasted”, isn’t terribly clear. A better approach would be to ask something like “Would you like your sandwich toasted?” with radio controls for “yes” and “no”. Alternately, if they absolutely wanted to keep it as a checkbox, they could use a better label: “Please toast my sandwich”.An alternate approach to the Subway interface, using radio controls.Radio controls have their place, but are not often a one-to-one replacement for checkboxes. I will discuss radio controls in greater depth in another post.# Check ’Em OutCheckboxes are an invaluable tool in the form building tool chest. Understanding their purpose and capabilities is key to using them properly and ensuring your forms are usable to the broadest number of users.Like this? You might dig my book Adaptive Web Design, Second Edition. You can grab a copy on Amazon, Barnes & Noble, Peachpit, or anywhere excellent web design books are sold.You might also likeA Web Component for Conditional Dependent FieldsNotebook entry posted on 14 Aug 2024Requirement Rules for CheckboxesNotebook entry posted on 05 Jul 2024Better form UX with the CSS property field-sizingLink saved on 01 Apr 2024For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.toWebmentionsAffirming User Choice With Checkboxes, From the Notebook of Aaron Gustafson06 Jan 2016 Stuart Langridge@AaronGustafson all these years, and I never knew of . aaron-gustafson.com/notebook/affir…07 Jan 2016 | Permalink: https://twitter.com/sil/status/685051229198807040 UIEAffirming User Choice With Checkboxes, the 2nd entry in @AaronGustafson's Modern Web Form Best Practices series. ow.ly/YHDZa 24 Feb 2016 | Permalink: https://twitter.com/UIE/status/702632954779013120LikesSharesCommentsNote: These are comments exported from my old blog. Going forward, replies to my posts are only possible via webmentions. Francis KimThe radio button makes more sense in the Subway example.17 Jan 2016 Permalink to comment 2462810403'''
