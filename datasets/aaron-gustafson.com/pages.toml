title = "Bring Focus to the First Form Field with an Error :: Aaron Gustafson"
description = "While filling out a long form the other day, I couldn’t figure out why it wasn’t submitting. Turns out I’d forgotten to fill in a field, but I didn’t know that because it had scrolled out of the viewport. This is a common problem on the web, but easily remedied with a little bit of JavaScript."
full_description = '''Bring Focus to the First Form Field with an ErrorThis is the third entry in the series Modern Web Form Best Practices.Published22 Aug 2022 by Aaron GustafsonReading Time5 minFiled Underaccessibility forms HTML inclusive design JavaScript progressive enhancement WAI-ARIA web designReactions9 WebmentionsCommentsCrosspostedCodementorLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)Credit: Aaron Gustafson × DALL·EWhile filling out a long form the other day, I couldn’t figure out why it wasn’t submitting. Turns out I’d forgotten to fill in a field, but I didn’t know that because it had scrolled out of the viewport. This is a common problem on the web, but easily remedied with a little bit of JavaScript.# Step 1: Make the Most of Your MarkupWhenever you’re building a form, you should use every tool in your toolbox for building that form properly. That means:Associate labels with their fieldsUse specialized input types (e.g., email, URL) as appropriateIdentify required fields with required and aria-requiredIf you’re expecting a field to match a particular format, note that with pattern and provide an example with placeholderAdditional information about a field should be bound to it using aria-describedbyBy following these steps, you’re likely already in a good place when it comes to your form’s UX and accessibility. Browsers will pay attention to the instructions in the markup, validate the user’s input, and even provide guidance on how to correct issues without you having to lift a finger. They’ll even focus the first invalid field on your behalf!But what if you want to customize the experience?# Step 2: Enhanced Browser ValidationWhen you use proper markup for your forms, enhancing them with JavaScript becomes straightforward, thanks to the Constraint Validation API. Consider the following form field:<input id="name" name="name" required aria-required="true" >Using JavaScript, we can check to see it’s validity at any point:document.getElementById("name").validity.valid; // Is either true or falseThere are also a host of other properties on the field’s validity property that provide even more detail as to the state of the field’s validity (hence the name: ValidityState). In the case of the field above, if valueMissing is true (relating back to that required attribute), valid is false.Armed with that knowledge, you could use another feature of the Constraint Validation API to show a custom error message in the browser UI:var input = document.getElementById("name"); if ( ! input.validity.valid ){ input.setCustomValidity("Please enter your name"); input.reportValidity(); }The thing is, you don’t really want to litter your JavaScript with strings like that. It’s not maintainable. Thankfully, we can leverage markup to achieve the same goal:<input id="name" name="name" required aria-required="true" data-error-required="Please enter your name" >The input in this example has a data attribute containing the error string (data-error-required). We can create whatever data attributes we want and access them using that element’s dataset property. It’s worth noting that hyphenated property names become camelCase when accessed as a named property of dataset.var input = document.getElementById("name"); if ( ! input.validity.valid ){ input.setCustomValidity(input.dataset.errorRequired); input.reportValidity(); }With that, we get the same result with far looser coupling between individual fields and the JavaScript handling validation.You can even extend the approach to handle different kinds of errors:<input type="email" id="email" name="email" required aria-required="true" data-error-required="Please enter your email" data-error-invalid="Your email doesn’t look right" >Here I’m using two different data attributes to apply in different error scenarios and the one I show will depend on the type of error a user has encountered. Pretty cool!And since we’re still operating in the context of the browser’s built-in validation experience, users will still get directed to the first field with an error when they submit the form.But what if you want to bypass the built-in experience and go full custom?# Step 3: Going RogueThe built-in browser validation UI is pretty great, but maybe it’s not your cup of tea. Thankfully, it’s pretty easy to take the training wheels off. You just add a novalidate attribute to the form element. But before you go dropping that attribute in your markup, consider that your custom validation code will all be JavaScript and if that fails to run—yes, it happens—the browser won’t step in and fill the void. So instead of putting it in your markup, inject it into the form when you know absolutely all of the JavaScript code necessary to run your custom validation experience is loaded and ready to rock. In fact, it should be the last line of code to execute:// Validation Logic Definition // including validateMe() function document.querySelectorAll("form") .forEach(function($form){ $form.addEventListener('submit', validateMe, false); $form.setAttribute('novalidate',''); });With that in place, we can turn our attention to handling the validation setup.For simplicity, and based on personal preference, I am going to start with setting up my form to validate when the form is submitted rather than whenever an individual field is changed (hence the “submit” event listener). When the event is fired, the event handler will loop through the fields in the form and validate each one. For the sake of the widest possible browser compatibility, I’m foregoing fat arrow functions and other ES2015 goodies and rockin’ this old school.function validateMe( e ) { var $form = e.target, i = 0, field_count = $form.elements.length, $first_error = false; for ( i; i< field_count; i++) { var $field = $form.elements[i], valid = isValid($field); if ( !$first_error && !valid ) { $first_error = $field; } } if ( $first_error ){ e.preventDefault(); $first_error.focus(); } }First, I get a reference to the form that needs to be validated, then I set up the loop for each of the fields. I also set up a reference to the first field with an error—that is the point of the article after all—as $first_error and set it to false.Within the loop, I grab a reference to the field and pipe it into another function that will do the actual validation (isValid()). That function will return true if the field is valid and false if it isn’t. The last bit of the loop checks to see if $first_error has been set already and, if it hasn’t, sets it to the current field if it isn’t valid.Finally, I check to see if $first_error is set (i.e., true) and if it is, the form has an issue, so I prevent the default behavior of the submit event (using preventDefault()) and focus the field captured in $first_error.# Addendum: Associating Custom Error MessagesI don’t want to get too into the weeds with my isValid() method, as you can see the end result at the bottom of this post, but I do want to take a moment to describe how you should be handling inline field errors.First off, you will need to add aria-invalid="true" to any fields that have an error. Secondly, you will want to inject the error message into the markup, give its container an id, and associate it with the field using aria-errormessage. So when your JavaScript is done with it, your field will look something like this:<label for="name">What’s Your Name?</label> <input id="name" name="name" required aria-required="true" data-error-required="Please enter your name" aria-errormessage="name-validation-error" aria-invalid="true" > <strong class="form-validation-error" id="name-validation-error" >Please enter your name</strong>It’s also worth noting that you’ll want to reset and re-validate the form field once the user has changed the contents of the field (and hopefully remediated the error). Resetting the field will involve removing the aria-invalid attribute and doing one of two things with the error message: either remove it from the markup entirely or simply hide it (e.g., display: none). Once the aria-invalid state is reset, it doesn’t matter that there is an existing aria-errormessage attribute. That said, I generally prefer to totally reset the field entirely, removing both attributes and the validation error element as well.Here you can see a complete working prototype of this approach:<p><a href="https://codepen.io/aarongustafson/pen/eYMXMPP" rel="noopener" target="_blank">See the Pen</a></p>Hopefully this helps you with the development of your own forms. Good luck!Like this? You might dig my book Adaptive Web Design, Second Edition. You can grab a copy on Amazon, Barnes & Noble, Peachpit, or anywhere excellent web design books are sold.You might also likeSpeech Accessibility Project data leads to recognition improvements on Microsoft AzureLink saved on 31 Jan 2025On DiversityNotebook entry posted on 30 Jan 2025@media (prefers-color-scheme:dark){path{fill:#fffcf4}}Expanding Accessibility with AIFirst presented at Microsoft AI Skills on 11 Dec 2024For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.toWebmentions tams sokarisolid approach aaron-gustafson.com/notebook/bring…23 Aug 2022 | Permalink: https://twitter.com/tamssokari/status/1562168624886042626 Frontend DogmaBring Focus to the First Form Field with an Error, by @aarongustafson: aaron-gustafson.com/notebook/bring…26 Aug 2022 | Permalink: https://twitter.com/frontenddogma/status/1563052098794967043 Adactio LinksBring Focus to the First Form Field with an Error :: Aaron Gustafson aaron-gustafson.com/notebook/bring…30 Aug 2022 | Permalink: https://twitter.com/adactioLinks/status/1564671269022351363 FullStack BulletinBring Focus to the First Form Field with an Error :: Aaron Gustafson aaron-gustafson.com/notebook/bring…09 Sep 2022 | Permalink: https://twitter.com/fstackbulletin/status/1568192633150791680 JackyBring Focus to the First Form Field with an Error :: Aaron Gustafson aaron-gustafson.com/notebook/bring…22 Sep 2022 | Permalink: https://twitter.com/jackysee/status/1572890955925295109 Docto Tech LifeDelivering good UX is important in our jobs as web developers, especially when it comes to forms. In this article, the author shows us what to pay attention to when it comes to forms and how to do it with vanilla JS. aaron-gustafson.com/notebook/bring…17 Oct 2022 | Permalink: https://twitter.com/DoctoTechLife/status/1581979840001069057 Vio CasselBring Focus to the First Form Field with an Error aaron-gustafson.com/notebook/bring… #html #js #webdev13 Dec 2022 | Permalink: https://twitter.com/viocassel/status/1602800673355177984 Akari☯️webデザイナー・講師｜上級ウェブ解析士エラーのある最初のフォームフィールドにフォーカスを移動する aaron-gustafson.com/notebook/bring…13 Dec 2022 | Permalink: https://twitter.com/kokona_san/status/1602796079174406144LikesShares'''
