ocus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)This deck was delivered at Code & Creativity on 02 May 2014Responsive web design has taken our industry by storm and with good reason: it helps us improve our reach with less effort. But incorporating responsive design is not the goal, meeting our user’s needs is. Responsive design is not an end in itself… it’s just the beginning.As a fitting way to kick off our new workshop series, Code & Creativity asked two internationally-renown mobile web and responsive design experts—Brad Frost (of This is Responsive, and Pattern Lab fame) and I—to come and teach you everything we need to know about working in this multi-device reality.For the first part of the day, Brad and I surveyed the landscape of responsive design, covering:broad concepts,strategies,the design process & deliverables,emerging design patterns and principles, anddevelopment best practices and considerations.Then, we broke into small groups to tackle some thorny responsive challenges through discussions, sketching, and even a little coding, while Brad & I provided real-time feedback and pushed attendees to go further. At the end, everyone shared their findings with the class and got additional feedback from the experts.If you’d like to have me speak at your oganization or event, please get in touch.You might also likeOn CrowdStrike, dependencies, and building robust products on the webNotebook entry posted on 25 Jul 2024The quiet, pervasive devaluation of frontendLink saved on 20 Mar 2024path{fill:#000}@media (prefers-color-scheme:dark){path{fill:#fffcf4}}Building Resilient Web Apps: Progressive Enhancement UnveiledJoined Code Ryan podcast on 28 Aug 2023For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.to'''
