500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)This deck was delivered at Ready to Inspire on 29 Nov 2011In this workshop, I teach you everything you need to know about modern web design with progressive enhancement. Whether you are a novice or an experienced professional, you will walk away from this workshop with a greater understanding of what progressive enhancement is and how to implement this philosophy in your own work.During the course of the workshop, I mentor folks on best practices as you work together to build a web page from the content out. Along the way, you’ll…see where concepts like “mobile first” and ”responsive design” fit in with progressive enhancement and your workflow;learn how to wield the awesome power of JavaScript wisely, while keeping a watchful eye on how it can affect the user experience or your sites;become more familiar with how CSS parsers work and how you can use their logic to apply advanced CSS (including CSS3) in a layered fashion;see how accessibility concerns can be easily factored into your development process; andgain exposure to ARIA roles & states and see how you can employ them to improve the experience of those using screen readers.If you’d like to have me speak at your oganization or event, please get in touch.You might also likeSpeech Accessibility Project data leads to recognition improvements on Microsoft AzureLink saved on 31 Jan 2025On DiversityNotebook entry posted on 30 Jan 2025@media (prefers-color-scheme:dark){path{fill:#fffcf4}}Expanding Accessibility with AIFirst presented at Microsoft AI Skills on 11 Dec 2024For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.to'''
