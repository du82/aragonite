us(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)This deck was delivered at MITRE Accessibility Technical Exchange Meeting on 27 Oct 2022“Progressive enhancement” is a philosophical approach to web design and development that centers users, with the goal of enabling everyone to access the content and complete core tasks, regardless of circumstances influencing how they access the web. In this session, I set the stage for why progressive enhancement is the gold standard for developing web projects before diving into a host of practical examples of how you can apply this practice to a range of interfaces. Along the way, I also show you how your entire team can (and should) get involved in the ideation, development, testing, and evolution of your interfaces and components.If you’d like to have me speak at your oganization or event, please get in touch.You might also likeA Web Component for Conditional Dependent FieldsNotebook entry posted on 14 Aug 2024Don’t Use JS for That: Moving Features to CSS and HTML by Kilian ValkhofLink saved on 29 Jul 2024On CrowdStrike, dependencies, and building robust products on the webNotebook entry posted on 25 Jul 2024For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.to'''
