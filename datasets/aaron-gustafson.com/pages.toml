a, TN USAWebVisions25 May 2011 Portland, OR USAMIX1111 Apr 2011 Las Vegas, NV USARetreats 4 Geeks: HTML5 & CSS308 Apr 2011 Gatlinburg, TN USASXSW Interactive11 Mar 2011 Austin, TX USAThink Vitamin: HTML5 Online Conference01 Nov 2010 OnlinejQuery Summit16 Oct 2010 OnlineAccessibility Summit30 Sep 2010 OnlineThink Vitamin: HTML and CSS31 Aug 2010 OnlineDevChatt26 Mar 2010 Chattanooga, TN USAAn Event Apart12 Oct 2009 Chicago, IL USABarCamp Chattanooga25 Jul 2009 Chattanooga, TN USAWeb Design World20 Jul 2009 Seattle, WA USAAIGA In Control Conference11 Jun 2009 Cincinnati, OH USASXSW Interactive13 Mar 2009 Austin, TX USAWeb Design World08 Dec 2008 Boston, MA USAWEB Builder 2.013 Oct 2008 Las Vegas, NV USAWebVisions22 May 2008 Portland, OR USAAn Event Apart24 Apr 2008 New Orleans, LA USAW3C TPAC05 Nov 2007 Cambridge, MA USAThe Ajax Experience24 Oct 2007 Boston, MA USAAn Event Apart04 Oct 2007 San Francisco, CA USAWebjam 729 Sep 2007 Sydney, AustraliaWeb Directions South26 Sep 2007 Sydney, AustraliaRich Web Experience06 Sep 2007 San Jose, CA USAThe Ajax Experience25 Jul 2007 San Francisco, CA USAAn Event Apart10 Jul 2007 New York, NY USAWebVisions03 May 2007 Portland, OR USAAjaxWorld18 Mar 2007 New York, NY USASXSW Interactive09 Mar 2007 Austin, TX USAWeb Directions North07 Feb 2007 Vancouver, BC CanadaThe Ajax Experience23 Oct 2006 Boston, MA USAEPA Webmaster Conference14 Sep 2006 Atlanta, GA USASXSW Interactive10 Mar 2006 Austin, TX USAWOW Web Design and Project Management Conference16 Sep 2005 Cupertino, CA USAEPA Webmaster Conference15 Sep 2005 Research Triangle Park, NC USAWOW Web Design and Project Management Conference17 May 2005 Joliet, IL USAWOW Web Design and Project Management Conference05 Apr 2005 Pasadena, CA USANew York State Forum Web Content Development & Management Seminar24 Feb 2005 Albany, NY USAWOW CMS & Web Services Workshop06 Sep 2004 Las Vegas, NV USACOMDEX17 Nov 2003 Las Vegas, NV USATalks I’ve GivenHere are some of the talks I’ve given. If you’d like me to speak at your organization or event, please get in touch.Expanding Accessibility with AIThis session, hosted by Aaron Gustafson and Ioana Tanase explores the transformative role of AI in enhancing accessibility. Together, you will uncover the pivotal role AI plays in crafting cutting-edge accessible technologies, learn about innovative AI tools that empower individuals with disabilities, and dive into best practices for creating inclusive AI solutions. Together, we will also explore the exciting future of AI in pushing the boundaries of accessibility.First presented at Microsoft AI Skills on 11 Dec 2024Embedding AccessibilityIn this session, I discuss the many reasons companies should prioritize accessibility, how to build a culture of accessibility, and what it can mean for their bottom line.First presented at Private talk at a Fortune 25 company on 19 Jan 2024Accessibility Beyond Code ComplianceIn this keynote, I discuss the future of accessibility and your place in it. I also share a number of ways accessibility devs and related practitioners are putting their skills to work, beyond code compliance.First presented at axe-con on 15 Mar 2023Progressive Enhancement: Where Do I Begin?In this session, I explain why progressive enhancement is the gold standard for developing web projects before diving into a host of practical examples of how you can apply this practice to a range of interfaces.First presented at MITRE Accessibility Technical Exchange Meeting on 27 Oct 2022Don’t Worry, Be AppyIn this talk, I walk you through a host of new web platform features you can use today to grant your web projects app-like super powers.First presented at An Event Apart: Spring Summit on 18 Apr 2022Delivering Critical Information & ServicesIn this session, Aaron discusses the many challenges to delivering critical information and services as well as the steps you can take to overcome those challenges.First presented at JavaScript & Friends on 11 May 2021Designing the ConversationUsers are gradually becoming more accustomed to and reliant on voice-based interactions, so enabling users to complete critical tasks without a visual user interface is crucial for the long-term success of websites.First presented at SpeechTEK on 22 May 2016Getting Started with PWAsIn this workshop, Aaron Gustafson will help you get your web projects super-charged as Progressive Web Apps (PWAs).First presented at PWA Summit on 05 Oct 2022Progressive Web Apps: Where Do I Begin?In this session, you’ll learn how to grow a project from a core, universally-accessible experience to a sophisticated Progressive Web App that ensures users will be able to access your product, no matter what.First presented at Microsoft Ignite on 24 Sep 2018Media in the Age of PWAsIn this session I discuss some of the potential pitfalls in implementing Service Workers, especially when it comes to managing heavy files like images and video.First presented at ImageCon on 01 May 2019Adapting to RealityA one-size-fits-all approach rarely fits anyone well. When we embrace that, our designs, products, and experiences will be all the better for it.First presented at TechReady 22 on 31 Jan 2016Conversational Semantics for the WebOver time, your users will become more accustomed to and reliant on voice-based interactions with their computers and, thereby, the web. Enabling them to complete critical tasks without a visual user interface will be crucial for the long-term success of your website.First presented at CascadiaJS on 15 Nov 2018Better Performance == Greater AccessibilityIn this intensely practical session, Aaron will explore the ins and outs of page load performance by showing how he made the web site of the 10K Apart meet its own contest rules, by having a site that was functional and attractive even without JavaScript, and was less than ten kilobytes at initial load.First presented at Inclusive Design 24 on 11 Oct 2018Designing for Everyone: Building Great Web Experiences for Any DeviceIn this session, I help you think about user experience from its foundation, so you understand what it means to build adaptive web experiences – whether in an app, in a browser, or beyond.First presented at Microsoft Build on 07 May 2018Performance as User ExperienceIn this intensely practical session, I explore the ins and outs of page load performance by showing how he made the web site of the 10K Apart meet its own contest rules, by having a site that was functional and attractive even without JavaScript, and was less than ten kilobytes at initial load.First presented at An Event Apart on 11 Dec 2017Advanced Design MethodsTwo days of advanced design & layout workshops covering responsive design, progressive enhancement, performance, flexbox, css grid, and more.First presented at Center Centre Workshop on 15 Nov 2017Exploring Adaptive InterfacesOne of the Web’s major strengths is its ability to adapt, to travel anywhere and everywhere in service of its users. When we embrace that, our designs, products, and experiences will be all the better for it.First presented at Generate on 20 Sep 2017Progressive Web Apps and the Windows EcosystemIn this session, I discuss what PWAs are, how they can be integrated into the development process of modern websites, the advantages and disadvantages of PWAs vs. native development, and what opportunities they present when installed alongside native apps in Windows.First presented at Chadev on 06 Jul 2017The Web Should Just Work for EveryoneThis talk is largely about accessibility with a push for thinking about the future of the interface and how considering accessibility now will help us prepare for a world of “headless UIs”.First presented at Microsoft Edge Web Summit on 04 Apr 2016The Features of Highly Effective FormsWeb forms are complex beasts with many moving parts. That’s one of the reasons they’re so challenging to build well.First presented at An Event Apart on 14 Mar 2016Learn from the Past, Enhance for the FutureWe are just starting to scratch the surface of what’s possible in voice-enabling the Web.First presented at EnhanceConf on 03 Mar 2016Planning Adaptive InterfacesHow do you plan for the unknown? The answer is obvious—you can’t—but that’s not a bad thing. Unknowns can be scary, but they also create opportunity.First presented at UxLx on 15 May 2013Writing for EngagementWriting tips for developer relations and technology evangelists.First presented at TechReady 22 on 31 Jan 2016There Are No Buts in Progressive EnhancementProgressive enhancement sounds practical, but not for your current project, right? Good news: you’re wrong!First presented at UX Immersion Mobile on 13 Apr 2015Falling in Love with FormsI’ll explore forms from top to bottom, examining how they work and how their components can be incorporated with other elements to maximize accessibility, improve semantics, and allow for more flexible styling.First presented at Accessibility Summit on 09 Sep 2014Beyond ResponsiveResponsive design is not an end i"
