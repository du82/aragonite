tor)This deck was delivered at An Event Apart: Spring Summit on 18 Apr 2022When it comes delivering software that deeply integrates with operating systems, the web has historically struggled to compete with compiled apps. Many frameworks have sought to bridge this chasm over the years, but they have become less necessary as the web continues to evolve deeper connections with operating systems.In this talk, Aaron Gustafson walks you through a host of new web platform features you can use today to grant your web projects app-like super powers. Learn the simple steps you can take to improve how users discover and install your software offerings.If you’d like to have me speak at your oganization or event, please get in touch.You might also likeSafari 17.4 Beta Release NotesLink saved on 05 Mar 2024PurePWA — A Radical U-Turn in Web DevelopmentLink saved on 02 Feb 2024Widgets!Notebook entry posted on 09 Oct 2023For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.to'''
