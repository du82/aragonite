ent,this.navigator)This deck was delivered at edUi on 04 Nov 2013In this half-day workshop, I teach you everything you need to know about modern web design with progressive enhancement. During the course of the workshop, Aaron will mentor you on best practices as you work together to build a web page from the content out. Whether you are a novice or an experienced professional, you will walk away from this workshop with a greater understanding of what progressive enhancement is and how to implement this philosophy in your own work.# What you’ll learn:A greater understanding of semantic markup, including the improved semantics of HTML5How CSS parsers work and how you can use their logic to apply advanced CSS (including CSS3) in a layered fashionWhere concepts like “mobile first” and ”responsive design” fit in with progressive enhancement and your workflowHow to wield the awesome power of JavaScript wisely while keeping a watchful eye on how it can affect the user experience or your sitesHow accessibility concerns can be easily factored into your development processMore about ARIA roles & states and how you can employ them to improve the experience of those using screen readersIf you’d like to have me speak at your oganization or event, please get in touch.You might also likeA Web Component for Conditional Dependent FieldsNotebook entry posted on 14 Aug 2024Don’t Use JS for That: Moving Features to CSS and HTML by Kilian ValkhofLink saved on 29 Jul 2024On CrowdStrike, dependencies, and building robust products on the webNotebook entry posted on 25 Jul 2024For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.to'''
