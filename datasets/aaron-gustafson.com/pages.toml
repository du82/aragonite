["https://www.aaron-gustafson.com/notebook/we-can-truly-transform-peoples-lives"]
title = "We Can Truly Transform People’s Lives :: Aaron Gustafson"
description = "Kelly, Oscar, and I are getting ready to head out for a long weekend up in Gatlinburg, TN to take a break from house selling insanity and kick off the celebration of our 16-year anniversary. We love the Fall, but not everyone is equipped to take in the awesome beauty of Fall foliage. Thankfully, Tennessee is doing something about that."
full_description = '''We Can Truly Transform People’s LivesPublished09 Nov 2017 by Aaron GustafsonReading Time1 minFiled Underaccessibility inclusive designReactions13 WebmentionsCommentsLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)Kelly, Oscar, and I are getting ready to head out for a long weekend up in Gatlinburg, TN to take a break from house selling insanity and kick off the celebration of our 16-year anniversary. We love the Fall, but not everyone is equipped to take in the awesome beauty of Fall foliage. Thankfully, Tennessee is doing something about that.At scenic overlooks throughout Tennessee, the state has installed special viewfinders capable of bringing the gorgeous yellows, oranges, and reds of Fall to people who are colorblind. Those of us who aren’t colorblind, you may wonder what the big deal is, but for folks who’ve gone years, even decades without ever having seen what the big deal it, this can be transformative and humbling.This is a wonderful reminder of the great opportunities we, as technologists, have for making a real difference, however small, in people’s lives. Look for those opportunities. Harness them. Make a difference in someone’s life.Like this? You might dig my book Adaptive Web Design, Second Edition. You can grab a copy on Amazon, Barnes & Noble, Peachpit, or anywhere excellent web design books are sold.You might also likeSpeech Accessibility Project data leads to recognition improvements on Microsoft AzureLink saved on 31 Jan 2025On DiversityNotebook entry posted on 30 Jan 2025@media (prefers-color-scheme:dark){path{fill:#fffcf4}}Expanding Accessibility with AIFirst presented at Microsoft AI Skills on 11 Dec 2024For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.toWebmentions Ste GrainerDang it, Aaron! Now I can’t see the fall foliage because of all the tears in my eyes! ;) Thanks for sharing this.09 Nov 2017 | Permalink: https://twitter.com/stegrainer/status/928681589273518080 Ste GrainerThis is great design. 09 Nov 2017 | Permalink: https://twitter.com/stegrainer/status/928681894753030145 Theresa❤️❤️❤️ #accessibility youtube.com/watch?v=zi7R66… 09 Nov 2017 | Permalink: https://twitter.com/tsullivanphoto/status/928685481956651008 Oudt Maureen| Permalink: https://www.facebook.com/100002880350996/posts/1263542717085061#love-by-10203356610662209 Lois Willis| Permalink: https://www.facebook.com/100002880350996/posts/1263542717085061#love-by-1013142245366412 Jen Strickland| Permalink: https://www.facebook.com/100002880350996/posts/1263542717085061#love-by-10211586524873491 Jason NeelThis is incredible. I want to know how it all works. aaron-gustafson.com/notebook/we-ca…10 Nov 2017 | Permalink: https://twitter.com/JasonNeel/status/929014361930305536 尾内でべ秋のテネシーに、色覚障害者も秋の黄色やオレンジやレッドが見える双眼鏡が設置された。色盲ではない人には大したことじゃないかもしれない。でも何十年も紅葉を見たことがなかった人には、劇的な意味がある。我々はだれかの人生をすこし変換することができる。aaron-gustafson.com/notebook/we-ca…05 Sep 2018 | Permalink: https://twitter.com/onouchidebe/status/1037294464551645186LikesShares'''
