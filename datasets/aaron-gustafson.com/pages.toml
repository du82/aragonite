["https://www.aaron-gustafson.com/notebook/dynamic-shortcuts-questions"]
title = "Dynamic shortcuts questions :: Aaron Gustafson"
description = "You may or may not be aware, but the Shortcuts feature for PWAs has begun rolling out in Chromium-based browsers and implementation is underway in other browsers as well. The first version of Shortcuts provides you with the ability to define a small set of links in your Manifest. Rayan Kanso and I are currently working on a proposal for Shortcuts v2 which will introduce a JavaScript API for managing these links and we’d love your input too."
full_description = '''Dynamic shortcuts questionsPublished17 Jun 2020 by Aaron GustafsonReading Time2 minFiled Underprogressive web appsReactions43 WebmentionsCommentsLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)You may or may not be aware, but the Shortcuts feature for PWAs has begun rolling out in Chromium-based browsers and implementation is underway in other browsers as well. The first version of Shortcuts provides you with the ability to define a small set of links in your Manifest. Rayan Kanso and I are currently working on a proposal for Shortcuts v2 which will introduce a JavaScript API for managing these links and we’d love your input too.If you are unfamiliar with Shortcuts, this feature lets you declare a handful of links that will appear as part of the context menu of your PWA’s icon within the host OS. On most desktop operating systems, these actions are accessed by right clicking on the app icon. In iOS you “force touch” (or “long touch”, depending on your device generation) the icon and on Android they appear when you “long press” the icon. You can learn more about Shortcuts in the Explainer.In Shortcuts v2, we are looking at enabling JavaScript to add to or modify Shortcuts menu items. When I originally thought about this, I had assumed all of the Shortcuts defined in the Manifest would be able to be removed or adjusted via the JavaScript API. So, for example, a shortcut to “Now Playing” in a music app could be updated to “Now Playing: Phone by Lizzo” when that track is playing. In this case, the URL might remain exactly the same, but the label would be updated.When discussing this with Rayan (and others), it appears that Android draws a distinction between “static” shortcuts and “dynamic” ones. Static shortcuts are generated when the app is installed; dynamic shortcuts don’t appear until the app has been run the first time. Static shortcuts are immutable (i.e., can’t be changed); dynamic shortcuts can be replaced by application logic at any time. These two different classes of shortcut also exist in different collections in the context menu and cannot be intertwined in the same menu system (i.e., all static shortcuts are in one group and all dynamic shortcuts are in another).Further complicating things, iOS draws a distinction between “static” and “dynamic” shortcuts, but based on my cursory reading of the docs, even dynamic shortcuts are immutable once created. From what I’ve read, desktop OSes do not seem to support distinct shortcut types.In order to set expectations properly and spec out the API, we need to decide on a direction to go in. That’s where you come in. I’ve created a Twitter Poll (below) that will allow you to vote for your preference. This will help us get a better sense of what you (folks who make websites) want and expect from a Shortcuts JavaScript API. If it means we need to come up with creative ways to manage the implementation under the hood in order to provide the right user experience and developer ergonomics, we’ll figure that out.We are working on a JavaScript API for managing PWA Shortcuts and would appreciate your input on a core feature. This thread ends with a poll. Please read the whole thing before voting.Background: https://t.co/NXhKogWzxQ— Aaron Gustafson (@AaronGustafson) June 19, 2020Here are the longform definitions of the choices in the poll:Read/write dynamic: I want immutable "static" Shortcuts and separate "dynamic" Shortcuts I can add/update/remove via JavaScript.— Aaron Gustafson (@AaronGustafson) June 19, 2020Read all/write dynamic: I want JavaScript read access to all shortcuts, regardless of how they are defined, and I want to be able to add/update/remove new app shortcuts dynamically. Static ones would persist as defined by the Manifest.— Aaron Gustafson (@AaronGustafson) June 19, 2020Read/write all: I want JavaScript access to all shortcuts, regardless of how they are defined. This means I can update/remove Shortcuts defined in the Manifest too.— Aaron Gustafson (@AaronGustafson) June 19, 2020After reading all of that, how would you prefer to manage PWA Shortcuts in JavaScript?— Aaron Gustafson (@AaronGustafson) June 19, 2020Like this? You might dig my book Adaptive Web Design, Second Edition. You can grab a copy on Amazon, Barnes & Noble, Peachpit, or anywhere excellent web design books are sold.You might also likeSafari 17.4 Beta Release NotesLink saved on 05 Mar 2024PurePWA — A Radical U-Turn in Web DevelopmentLink saved on 02 Feb 2024Widgets!Notebook entry posted on 09 Oct 2023For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.toWebmentions David Dal BuscoOne spontaneous input I have after a quick look at the explainer is supporting i18n Each shortcuts have to be provided with name+description, being able to translate these (according OS/language language) would be nice 19 Jun 2020 | Permalink: https://twitter.com/daviddalbusco/status/1273855531007049728 Aaron GustafsonTotally. There is some guidance around localization of manifests in general, which would cover most cases, but with JS API, the Internationalization API could be quite useful indeed. 19 Jun 2020 | Permalink: https://twitter.com/AaronGustafson/status/1273869767808450562LikesShares'''
