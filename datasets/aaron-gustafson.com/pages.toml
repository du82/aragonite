title = "Requirement Rules for Checkboxes :: Aaron Gustafson"
description = "HTML checkboxes debuted as part of HTML 2.0 in 1995. Our ability to mark an individual checkbox as being required became part of the HTML5 spec that published in 2014. A decade later, we can still only make checkboxes required on a case-by-case basis. To overcome this limitation, I had created a jQuery plugin that allowed me to indicate that a user should choose a specific number of items from within a checkbox group. Yesterday I turned that plugin into a web component: form-required-checkboxes."
full_description = '''Requirement Rules for CheckboxesThis is the 5 entry in the series Modern Web Form Best Practices.Published05 Jul 2024 by Aaron GustafsonReading Time2 minFiled Underaccessibility forms HTML JavaScript progressive enhancement web components web formsReactions26 WebmentionsCommentsLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)HTML checkboxes debuted as part of HTML 2.0 in 1995. Our ability to mark an individual checkbox as being required became part of the HTML5 spec that published in 2014. A decade later, we can still only make checkboxes required on a case-by-case basis. To overcome this limitation, I had created a jQuery plugin that allowed me to indicate that a user should choose a specific number of items from within a checkbox group. Yesterday I turned that plugin into a web component: form-required-checkboxes.# Markup AssumptionsBefore I tuck into the details, I’ll start by saying that the web component begins with the assumption that you are following best practices with respect to form markup:Your checkbox group should be in a fieldset with a legendAll of the checkbox elements must have the same name (e.g., “foo[]”).In other words, they should look something like this:<fieldset> <legend>Group 1 label</legend> <ul> <li><label> <input type="checkbox" name="foo[]" value="1"> First item </label></li> <li><label> <input type="checkbox" name="foo[]" value="2"> Second item </label></li> <!-- options continue --> </ul> </fieldset>To use the web component, you wrap the group in a form-required-checkboxes element and then include the JavaScript to initialize it.<form-required-checkboxes> <fieldset> <legend>Group 1 label</legend> <!-- etc. --> </fieldset> </form-required-checkboxes> <!-- at the end of your document --> <script src="/js/web-components/form-required-checkboxes.js" async></script>If you’re following right along, there’s an error waiting for you in the console — we need to set the requirement rules.# The APIThe form-required-checkboxes element requires at least one attribute to function, but using some of the others you can more fully customize the experience for users:required - Represents the range of required values. You can set this up in one of three ways depending on your needs:Single number (e.g., 3) requires exactly that number of choices.Range (e.g., 3-5) requires a minimum of the first number and a max of the second number be chosen.Max (e.g., 0-3) requires a minimum of zero and a max of the second number to be chosen.notice (optional) - This is a string description that explains details of the required value in plan language. If you don’t supply one, the component will create one for you. This description will be added as a small element within the component (as a sibling to the fieldset).error (optional) - This is a string validation error you’d like to be shown when the validation criteria is not met. By default the component will use the notice text, but this gives you more flexibility.# DemoI put together a relatively simple demo of the web component over on GitHub:# Grab ItYou can view the entire project (and suggest enhancements) over on the component’s Github repo.Like this? You might dig my book Adaptive Web Design, Second Edition. You can grab a copy on Amazon, Barnes & Noble, Peachpit, or anywhere excellent web design books are sold.You might also likeSpeech Accessibility Project data leads to recognition improvements on Microsoft AzureLink saved on 31 Jan 2025On DiversityNotebook entry posted on 30 Jan 2025@media (prefers-color-scheme:dark){path{fill:#fffcf4}}Expanding Accessibility with AIFirst presented at Microsoft AI Skills on 11 Dec 2024For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.toWebmentionsLikesShares'''
