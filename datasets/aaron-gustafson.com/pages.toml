title = "Harvard, MIT, and Captioning :: Aaron Gustafson"
description = "The U.S. Department of Justice (DOJ) has published Statements of Interest in two cases brought by the National Association of the Deaf (NAD) against Harvard (PDF) and MIT (PDF), respectively. The NAD is suing the two universities for violations of Title III of the Americans with Disabilities Act (ADA) and Section 504 of the Rehabilitation Act because the video and audio materials they are making available as part of their online learning offerings are not captioned."
full_description = '''Harvard, MIT, and CaptioningPublished29 Jun 2015 by Aaron GustafsonReading Time2 minFiled Underaccessibility web designReactions1 WebmentionsCommentsLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)The U.S. Department of Justice (DOJ) has published Statements of Interest in two cases brought by the National Association of the Deaf (NAD) against Harvard (PDF) and MIT (PDF), respectively. The NAD is suing the two universities for violations of Title III of the Americans with Disabilities Act (ADA) and Section 504 of the Rehabilitation Act because the video and audio materials they are making available as part of their online learning offerings are not captioned.The DOJ Statements make it quite clear thatBoth the ADA and Section 504 currently obligate Harvard to provide effective communication to ensure equal access to its online programming services, and resolution of Plaintiffs’ claim involves a straightforward application of longstanding statutory and regulatory requirements. For more than two decades, federal courts have resolved effective communication claims brought under the ADA and Section 504 in a wide range of contexts, including claims alleging unequal access to goods, benefits and services provided through websites or other electronic media. And the Departments of Justice and Education have routinely required covered entities to ensure equal access to goods, benefits and services, electronic or otherwise, through the provision of captioning or other auxiliary aids or services.Also…[T]he Department issued an Advanced Notice of Proposed Rulemaking (“ANPRM”) on Accessibility of Web Information and Services of State and Local Government Entities and Public Accommodations, announcing the Department’s interest in developing more specific requirements or technical standards for website accessibility. … In the ANPRM, the Department reaffirmed its longstanding position that the ADA applies to websites of public accommodations, and reiterated, consistent with the preamble to the 1991 regulations, that the ADA regulations should be interpreted to keep pace with developing technologies.Neither case has been settled yet, but the fact that the DOJ is siding with the NAD will lend more credence to their complaints and will likely result in one or both institutions settling out of court and, eventually, captioning their videos.Captions are critical for the deaf and hard of hearing as they let them know what’s being said, who is saying it, how it’s being said, and inform them of any other sounds that are germane to the content. Reading captions is the equivalent of hearing with your eyes.Are your videos captioned? If your content is aimed at a broad audience, it might be worth your time (and even your money) to get them captioned.No doubt, accurate captioning is time-consuming. There are some ways of automating it (YouTube does this, for instance), but there are also services like Casting Words, Rev, and 3Play Media that will do it for a nominal fee.It’s worth noting that the HTML video element supports subtitles and captions via the track element (browser support, Can I Use data). YouTube also allows you to add captions and subtitles to your videos manually. But keep in mind that captions and subtitles are not the same thing; captions need to capture more than just the words that are said.Like this? You might dig my book Adaptive Web Design, Second Edition. You can grab a copy on Amazon, Barnes & Noble, Peachpit, or anywhere excellent web design books are sold.You might also likeSpeech Accessibility Project data leads to recognition improvements on Microsoft AzureLink saved on 31 Jan 2025On DiversityNotebook entry posted on 30 Jan 2025@media (prefers-color-scheme:dark){path{fill:#fffcf4}}Expanding Accessibility with AIFirst presented at Microsoft AI Skills on 11 Dec 2024For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.toWebmentionsDOJ Delays ADA Regulations for the Accessibility of Private Websites to 201810 Dec 2015LikesShares'''
