s=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)This deck was delivered at Microsoft Build on 10 May 2017Whether at home or at work, the web plays an increasingly critical role in our daily lives. As we have become more dependent on accessing the tools it powers, we’ve also struggled to overcome some of its limitations—network connectivity, for instance.At Microsoft, we’ve long been interested in the power of the web for software development and we are even more excited for the future possibilities offered by progressive web apps (PWAs). In this session, I discuss what PWAs are, how they can be integrated into the development process of modern websites, the advantages and disadvantages of PWAs vs. native development, and what opportunities they present when installed alongside native apps in Windows.Watch This TalkPlay Video: Progressive Web Apps and the Windows EcosystemVideo recorded at Chadev on 06 Jul 2017If you’d like to have me speak at your oganization or event, please get in touch.You might also likeWidgets!Notebook entry posted on 09 Oct 2023Mac-like Special Characters in WindowsNotebook entry posted on 02 Nov 2016For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.to'''
