["https://www.aaron-gustafson.com/notebook/lessons-in-averaging"]
title = "Lessons in Averaging :: Aaron Gustafson"
description = "In the work that we do on the Web (as well as in our daily lives), we’re often confronted, informed, or judged based on averages. I never really stopped to think about it, beyond being bugged by the fact that averages aren’t truly representative of reality. Then I listened to 99% Invisible’s episode “On Average”. It was incredibly enlightening and the stories shared in that episode provide sage wisdom that is very relevant to the work that we do."
full_description = '''Lessons in AveragingPublished14 Dec 2016 by Aaron GustafsonReading Time3 minFiled Underprogressive enhancement design web design user experience accessibilityReactions8 Webmentions2 CommentsCrosspostedMediumLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)In the work that we do on the Web (as well as in our daily lives), we’re often confronted, informed, or judged based on averages. I never really stopped to think about it, beyond being bugged by the fact that averages aren’t truly representative of reality. Then I listened to 99% Invisible’s episode “On Average”. It was incredibly enlightening and the stories shared in that episode provide sage wisdom that is very relevant to the work that we do.Do you know where our fascination with averages began? It all started with Adolphe Quételet, a Belgian mathematician and astronomer:In the 1830s, astronomers were some of the only people that regularly calculated averages, since early telescopes were extremely imprecise. To obtain more accurate data for say, tracking the orbits of planets, astronomers would take multiple measurements (all of which were slightly different) add them together, then divide by the number of observations to get a better approximation of the true value.Quetelet decided to apply this tool to people, starting with Scottish soldiers’ chest sizes. Turns out the average chest size of a Scottish soldier in the 1830s was 39.75 inches. File that one away for Pub Trivia.Quetelet believed that the average was the “true” size of something… something that we should strive for or that nature would attempt to create. The Platonic ideal if you will:In Quetelet’s mind, human averages had a certain moral mandate. By his logic, if everyone were optimally fed and lived under the same environmental conditions, they would be average. And this is what society should be striving for: the continual improvement of the average of the group.We look at averages all the time in our work. Some, like average Time To Interactive (TTI), are useful measurements that allow us to improve our work; others, like the “average” user are decidedly less so. The “average” person (or dog or flower) is a myth. Everyone and everything is unique to some equally unique degree. Even mass-produced objects have variance.Designing for the “average” user is incredibly problematic. The episode I mentioned captured this perfectly in a story about the U.S. Army’s design of airplane cockpits:[I]n 1926, when the Army designed its first airplane cockpit, they measured the physical dimensions of male pilots and calculated the average measurement of their height, weight, arm-length and other dimensions.The results determined the size and shape of the seat, the distance to the pedals and the stick, and even the shape of the flight helmets. This mean that, in part, pilots were selected based on their ability to fit into the cockpit designed for the average 1920s man.This worked more or less up until World War II, when the Army began recruiting hundreds of new pilots to expand its air forces (which became a separate branch of the military in 1947). But with the birth and expansion of the Air Force came a decline in performance and a rash of deaths. Even with no war, pilots continued to die during training, as they were unable to control their planes.The high death rate in the Air Force was a mystery for many years, but after blaming the pilots and their training programs, the military finally realized that the cockpit itself was to blame, that it didn’t actually fit most pilots.In 1950, the Air Force sent Gilbert S. Daniels out to collect ten measurements from thousands of airmen—yes, they were all men at the time—across the U.S. in order to establish a new average. After collecting the data, Daniels got curious and decided to see how many of the airmen he measured hit the average on all ten measurements. Not a single one. How about three of the measurements? Less than five percent. He realized that in designing for an average, they were, in fact, designing for no one. Based on this discovery, the Air Force commissioned new equipment that including features like adjustable foot pedals, helmet straps, flight suits, and seats. And, wonder of wonders, pilot performance improved dramatically.When we design, we need to be cognizant of the variety of human experience and plan accordingly. For our work to be successful, we need to accommodate the adjustments our users require for them to be successful. Responsive layouts, adaptive interfaces, support for assistive technologies… all of these approaches enable our work to go further by enabling it to be tailored to the permanent, temporary, and/or situational needs of our users.All of this is to say, this episode made me an even more ardent believer in the idea of progressive enhancement and the continuum of experience it enables. You should go listen to it now, I promise there’s more to the story.Like this? You might dig my book Adaptive Web Design, Second Edition. You can grab a copy on Amazon, Barnes & Noble, Peachpit, or anywhere excellent web design books are sold.You might also likeA Web Component for Conditional Dependent FieldsNotebook entry posted on 14 Aug 2024Don’t Use JS for That: Moving Features to CSS and HTML by Kilian ValkhofLink saved on 29 Jul 2024On CrowdStrike, dependencies, and building robust products on the webNotebook entry posted on 25 Jul 2024For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.toWebmentions Manuel MatuzovicI really enjoyed that episode as well. Great idea to compare it with what we (should) do as webdesigners/devs.14 Dec 2016 | Permalink: https://twitter.com/mmatuzo/status/809137965041590272 Aaron GustafsonThanks!14 Dec 2016 | Permalink: https://twitter.com/AaronGustafson/status/809142918409764868 Jeremy McDuffieLessons in Averaging aaron-gustafson.com/notebook/lesso… +@AaronGustafson // “be cognizant of the variety of human experience and plan accordingly”14 Dec 2016 | Permalink: https://twitter.com/jmmcduffie/status/809137750263943168 Duke VukadinovicGreat lessons in averaging at aaron-gustafson.com/notebook/lesso… by @aarongustafson01 Feb 2017 | Permalink: https://twitter.com/Duke_FSG/status/826811819935281153LikesSharesCommentsNote: These are comments exported from my old blog. Going forward, replies to my posts are only possible via webmentions. Dusan (Duke) VukadinovicI decided at the earliest age that I will never be normal because normal for me is just another word for average so I guess that I fall into category of those people which you addressed as the most problematic to design for :)01 Feb 2017 Permalink to comment 3132082002 msrValuable information! Looking forward to seeing your notes posted. Thank you for sharing the nice article. Good to see your article. poesniper16 Mar 2017 Permalink to comment 3207080572'''
