title = "Categories land in the Web App Manifest :: Aaron Gustafson"
description = "Starting in early May, Rob Dolin began advocating for adding a categories member to the Web App Manifest spec. It was something we’d been discussing for a while now. It’s a feature that will be incredibly useful to users, especially as it relates to PWAs in the Windows Store, other app stores, and in catalogs. This weekend, our hard work paid off and it was added to the spec!"
full_description = '''Categories land in the Web App ManifestPublished28 Aug 2017 by Aaron GustafsonReading Time2 minFiled Underprogressive web appsReactions14 Webmentions2 CommentsLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)Starting in early May, Rob Dolin began advocating for adding a categories member to the Web App Manifest spec. It was something we’d been discussing for a while now. It’s a feature that will be incredibly useful to users, especially as it relates to PWAs in the Windows Store, other app stores, and in catalogs. This weekend, our hard work paid off and it was added to the spec!# So what does it do and how do I use it?First off, the new categories member is totally optional. It’s there if you think it offers a benefit for your users, but is by no means necessary.According to the spec:The categories member is only meant as a hint to catalogs or stores listing web applications and it is expected that these will make a best effort to find appropriate categories (or category) under which to list the web application. Like search engines and meta keywords, catalogs and stores are not required to honor this hint.The categories member is a list of categorizations you want to apply to your site. There are no pre-defined categories, but the W3C is maintaining a list of common categories shared by most app stores and catalogs. You will probably want to use at least one of those to ensure your site gets filed properly.Here’s quick example of a hypothetical manifest for a web version of the book Gojiro by Mark Jacobson:{ "name": "Gojiro", "description": "Gojiro, a freak mutation with a cynical worldview, suffers the pain of solitude as well as several maladies experienced by entertainers, including drug abuse and suicidal tendencies.", "icons": [{ "src": "images/icon.png", "sizes": "192x192" }], "categories": ["books", "fiction", "science fiction & fantasy", "kaiju", "怪獣"] }Here you can see 5 categories being assigned to the book. I chose to start with one of the top-level categories from the list and then get more specific, kinda like how class names were originally conceived. The genre “Kaiju” is a sub-classification of “science fiction & fantasy” novels, which are a sub-classification of “fiction”, which is a sub-classification of “books”.Though the W3C list is in English (as with most web specs), there is no requirement to have all of your categories in English. The final entry, “怪獣”, is “Kaiju” in Japanese.This addition to the Web App Manifest was much-needed and, along with IARC rating (which we also landed recently) will help our users more easily find the resources they’re looking for. Many hearty congrats to Rob for landing this update and for being added as an editor of the spec!Like this? You might dig my book Adaptive Web Design, Second Edition. You can grab a copy on Amazon, Barnes & Noble, Peachpit, or anywhere excellent web design books are sold.You might also likeSafari 17.4 Beta Release NotesLink saved on 05 Mar 2024PurePWA — A Radical U-Turn in Web DevelopmentLink saved on 02 Feb 2024Widgets!Notebook entry posted on 09 Oct 2023For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.toWebmentions UXLx: UX Lisbon“The Requisite Contact Form” buff.ly/2vCTvqT by @AaronGustafson #progressivewebapps 30 Aug 2017 | Permalink: https://twitter.com/uxlx/status/902931551041794048 Rey Bango"Categories" is an awesome new addition to the Web App Manifest spec. Chk out @AaronGustafson's thoughts on it: aaron-gustafson.com/notebook/categ…30 Aug 2017 | Permalink: https://twitter.com/reybango/status/902986490023731201 Rey Bango"Categories" is an awesome new addition to the Web App Manifest spec. Chk out @AaronGustafson's thoughts on it: aaron-gustafson.com/notebook/categ…30 Aug 2017 | Permalink: https://twitter.com/reybango/status/902986490023731201 Jeff BurtoftI think there might be something to this W3C manifest thingie: aaron-gustafson.com/notebook/categ… from @AaronGustafson30 Aug 2017 | Permalink: https://twitter.com/boyofgreen/status/902986226277519360 Jason Grigsby, ☁4Categories added to the Web App Manifest. Applies to Progressive Web Apps. More from @AaronGustafson aaron-gustafson.com/notebook/categ…31 Aug 2017 | Permalink: https://twitter.com/grigs/status/903241759202803712 Jason Grigsby, ☁4Categories added to the Web App Manifest. Applies to Progressive Web Apps. More from @AaronGustafson aaron-gustafson.com/notebook/categ…31 Aug 2017 | Permalink: https://twitter.com/grigs/status/90324175920280371201 Sep 2017 | Permalink: https://www.aaron-gustafson.com/notebook/categories-land-in-the-web-app-manifest/ Adactio LinksCategories land in the Web App Manifest | Aaron Gustafson aaron-gustafson.com/notebook/categ…01 Sep 2017 | Permalink: https://twitter.com/adactioLinks/status/903557109845024769 Xperienz“The Requisite Contact Form” buff.ly/2vDdu8V by @AaronGustafson #progressivewebapps 06 Sep 2017 | Permalink: https://twitter.com/XperienzRD/status/905385272292114432LikesSharesCommentsNote: These are comments exported from my old blog. Going forward, replies to my posts are only possible via webmentions. Gerard TyedmersThe link to the manifest-example is wrong. Instead of linking to a manifest.json its just a link to the wikipedia-page of the book.15 Jan 2018 Permalink to comment 3708888732 Aaron GustafsonActually, I screwed up my Content Security Policy and the Gist was blocked. My apologies and thanks for the heads up!22 Jan 2018 Permalink to comment 3720577005'''
