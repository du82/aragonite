title = "Labeled with Love :: Aaron Gustafson"
description = "Forms exist on pretty much every site on the web in one form or another. They are the primary mechanism by which we gather information from our users. Of course, before anyone can fill out a form, they need to know what it’s asking for. Labeling is key."
full_description = '''Labeled with LoveThis is the first entry in the series Modern Web Form Best Practices.Published12 Nov 2015 by Aaron GustafsonReading Time5 minFiled Underaccessibility web design forms HTMLReactions64 Webmentions11 CommentsCrosspostedMediumCodementorLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)Forms exist on pretty much every site on the web in one form or another. They are the primary mechanism by which we gather information from our users.1 Of course, before anyone can fill out a form, they need to know what it’s asking for. Labeling is key.A few months back, I relayed a story from Facebook about how important the wording of their questions was in getting accurate responses from their users. The words we choose are incredibly important—your interface is a conversation with your users. I highly recommend reading up on that (and listening to the Radiolab episode that spurred me to write it), but I’m going to spend the remainder of this post talking about the utilitarian aspects of labels and how to use them properly in your forms.# Connecting the DotsWhen you look at a basic form field, you have two bits of information: the field and the label.A typical form control: a label and a field.You could achieve this with a minimum of markup:Your Name <input name="full_name">The thing is, the text “Your Name” is not associated in any way with the input. Sure, a sighted person would likely be able to tell that that text is associated with the field, but no computer can tell that. And if a computer can’t tell the text and input are associated, your form control is inaccessible to anyone who uses assistive technology like a screen reader. It’s also going to pose a problem in the near-future of “headless UIs” like those hinted at by Cortana, Siri, and the Echo.Thankfully, establishing a relationship between the two is quite easy using the label element. The most common (and preferable) way to do this is to wrap the labeling text in a label element. Then you create an explicit association with the field using the for attribute, which is an id reference. In other words, the value of the for attribute needs to match the value of the id attribute on the field you want to associate with that label.<label for="full_name">Your Name</label> <input id="full_name" name="full_name">With that markup in place, the programmatic connection between the elements is made and the results speak for themselves: When you focus the field, the contents of the label are read out.# An Alternate ApproachSince I specifically referred to this approach as explicit association, you probably assumed that there’s another kind of association. And you were right: implicit association. Implicit association is created by wrapping a form control and its associated label text in a label element. I like to use this approach with radio and checkbox controls:<label> <input type="checkbox" name="devices[]" value="Asus Nexus 7"> Asus Nexus 7 </label>It’s worth noting that there’s nothing wrong with explicit association in this context either.<input type="checkbox" id="asus-nexus-7" name="devices[]" value="Asus Nexus 7"> <label for="asus-nexus-7">Asus Nexus 7</label>You can even combine the two approaches.<label for="asus-nexus-7"> <input type="checkbox" name="devices[]" id="asus-nexus-7" value="Asus Nexus 7"> Asus Nexus 7 </label>The reason I like to use implicit association with checkbox and radio controls has to do with ensuring the greatest breadth of support when it comes to styling inputs. For instance, if I set width: 80% on all input elements using a simple type selector, that width would be applied to all input elements, including radio and checkbox controls. In order to prevent radio and checkbox controls from getting rendered at that width, I would need to assign an override value of width: auto to them them specifically. I can do that using attribute selectors:input { width: 80%; } input[type=checkbox], input[type=radio] { width: auto; }While completely valid, that approach leaves out any browsers that don’t support attribute selection (e.g. IE 6). That may not seem like a deal-breaker in your book, but on the off chance some poor soul happens to be stuck using an out-of-date browser (as many are on mobile), I like to show them a little love. And, thankfully, using the implicit markup pattern for checkboxes and radio controls allows for this quite easily: I just use a descendent selector instead.input { width: 80%; } label input { width: auto; }This approach results in a greater amount of support and, incidentally, less CSS.# Added Benefit: InteractivityObviously, associated labels are great for folks who use screen readers, but they have another benefit: tapping on a label will focus or activate the associated form control."Animation showing how clicking a label will focus the associated form control.This isn’t a game-changer when it comes to standard text fields, but it’s an exceptional affordance when it comes to radio and checkbox controls, especially on mobile, as it vastly increases the tappable region used to activate the control.A screenshot of a group of checkbox controls with their labels outlined.To create incredibly generous tap targets on mobile devices, we can take things a little further. Add padding to the top and bottom of the label to make it bigger and then use negative margins to counter that enlargement and keep the layout as it was before the padding was applied..grouped label { margin: -1em 0; padding: 1em 0; }An animation showing very generous tap targets on a narrow screen.It’s worth noting that older versions of Internet Explorer only provide the focus/interaction benefit when you use explicit label association. That’s why I like the combo approach of implicit and explicit association for checkbox and radio controls.As Dennis Lembrée mentions in the comments below, Dragon’s Naturally Speaking also doesn’t recognize implicit association, which is why it’s incredibly important to use explicit association even if it seems implicit association should suffice.# Placeholders Aren’t LabelsHTML5 ushered in a new option for working with input elements: the placeholder attribute. This declarative attribute makes it possible to offer hint as to the sort of content you were looking for in a field. In supporting browsers, it appears in the field, ghosted back a bit, and disappears when you start typing a response.2An animation showing a placeholder in action on Web Standards Sherpa.Having this supported in the browser was a huge boon. For years we’d been using JavaScript to achieve this very effect—albeit typically for label text—in an effort to create more compact forms. Now we get the effect without having to include any additional files or libraries.Of course, since placeholder implements an existing pattern, it came with baggage. People commonly achieved this effect by (ab)using the value attribute as a fake label. As such, its introduction didn’t do much to increase the accessibility of forms. Form controls need a label. If you want to make your form more compact, you can do that using proper markup and a little clever CSS.<p class="form-control"> <input id="full_name" name="full_name"> <label for="full_name">Your Name</label> </p>.form-control { position: relative; } label { display: block; position: absolute; top: 50%; margin-top: -.5em; left: .25em; transition: .25s transform; } input { display: block; border: 1px solid; border-radius: 3px; padding: .25em; } input:focus + label { transform: translateY(-1.5em); }<p><a href="https://codepen.io/aarongustafson/pen/BoGgYM" rel="noopener" target="_blank">See the Pen</a></p>Mary Lou assembled some beautiful examples of this approach in her Inspiration for Text Input Effects. I highly recommend you check those out, but here’s a teaser to whet your whistle:A fancy, accessible form field and label from Mary Lou’s collection.We don’t have a ton of elements in HTML, which is why it’s important that we properly use the ones we do have. Hopefully this has provided a helpful overview of how to properly label form controls using HTML.FootnotesWhen we’re not, you know, tracking them with a super cookie or something. ↩︎Browsers typically exhibit two different behaviors here. Some hide the placeholder text as soon as you focus the field, others hide it only when you start typing. Either one works although, admittedly, I favor the text disappearing when you type rather than when the field receives focus. I can see how that approach might confuse some users, I just prefer it because it ensures you see the placeholder. ↩︎Like this? You might dig my book Adaptive Web Design, Second Edition. You can grab a copy on Amazon, Barnes & Noble, Peachpit, or anywhere excellent web design books are sold.You might also likeSpeech Accessibility Project data leads to recognition improvements on Microsoft AzureLink saved on 31 Jan 2025On DiversityNotebook entry posted on 30 Jan 2025@media (prefers-color-scheme:dark){path{fill:#fffcf4}}Expanding Accessibility with AIFirst presented at Microsoft AI Skills on 11 Dec 2024For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.toWebmentions Šime Vidas@AaronGustafson Heads up: The embedded video on aaron-gustafson.com/notebook/label… is blocked by mixed content policy (http: → https:)12 Nov 2015 | Permalink: https://twitter.com/simevidas/status/664680629867556865 Aaron Gustafson@simevidas Thanks for the heads-up! I thought I’d fixed that plugin to be all https back when I made the switch. Weird. I’ll fix shortly. 12 Nov 2015 | Permalink: https://twitter.com/AaronGustafson/status/664785036462456832 Aaron Gustafson@simevidas Looks like I missed switching one. Re-publishing now. 12 Nov 2015 | Permalink: https://twitter.com/AaronGustafson/status/664797413534801920 UIELabeled With Love ow.ly/UzrJW 12 Nov 2015 | Permalink: https://twitter.com/UIE/status/664861540236050432 Andy GongeaLabeled With Love, From the Notebook of Aaron Gustafson disq.us/8rgmre 17 Nov 2015 | Permalink: https://twitter.com/andygongea/status/666674771132874753 Pat BrownDo you ha