title = "Designing Across Devices with Progressive Enhancement :: Aaron Gustafson"
description = "Today, browsers are just one of the issues among a sea of considerations like accessibility, device compatibility, and responsive or adaptive design. And with new techniques and devices coming out daily, it’s easy to feel overwhelmed."
full_description = '''Designing Across Devices with Progressive EnhancementFormatWebinarPresented AtUIE Virtual Seminar on 21 Nov 2013Filed Underaccessibility inclusive design mobile progressive enhancement responsive web designResourcesSlides (PDF, 4.6 MB)Like this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)This deck was delivered at UIE Virtual Seminar on 21 Nov 2013Remember the good old days when getting IE6 to “work” was our main worry?My, we’ve come a long way, baby.Today, browsers are just one of the issues among a sea of considerations like accessibility, device compatibility, and responsive or adaptive design. And with new techniques and devices coming out daily, it’s easy to feel overwhelmed.Fortunately, I know how to wrangle all of these elements using progressive enhancement. With his practical approach, he designs for humans on any spectrum ­­ with and without javascript enabled—and soon enough, you will, too.Create experiences without technological constraintsUnderstand progressive enhancement and integrate it with your processUse content as your foundation and build the experience from thereStop assuming users are just like youCome to a better understanding of how existing design decisions can unintentionally skew your analyticsPrevent the typical myopic view of web and mobile experiencesMake a content­-first approach workFuse responsive web design and mobile­-first with progressive enhancementFocus content, core tasks, and visual designs on a continuumEstablish a solid strategy for planningSketch different experiences using basic UI elements and flow chartsPlan decision points and outcomes from simple through complex interactionsJoin us for this seminar if you:Need a manageable design process that works for your whole teamFeel your sanity slipping away as more devices launch every. single. day.Want to plan, design, and test all potential experiences across platformsIf you’re trying to create a better web ­­ and are open to rethinking how you approach designing for any interface, then you need to watch Aaron’s seminar.Watch This TalkVideo recorded at on 28 Feb 2025If you’d like to have me speak at your oganization or event, please get in touch.You might also likeA Web Component for Conditional Dependent FieldsNotebook entry posted on 14 Aug 2024Don’t Use JS for That: Moving Features to CSS and HTML by Kilian ValkhofLink saved on 29 Jul 2024On CrowdStrike, dependencies, and building robust products on the webNotebook entry posted on 25 Jul 2024For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.to'''
