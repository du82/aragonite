["https://www.aaron-gustafson.com/speaking-engagements/the-web-is-for-everyone"]
title = "The Web Is for Everyone :: Aaron Gustafson"
description = "We should strive towards the equality of equal opportunity, while also accepting that it does not guarantee equal experience. And that's okay."
full_description = '''The Web Is for EveryoneFormatKeynotePresented Ata11yqc on 14 Oct 2014Filed Underaccessibility inclusive design progressive enhancementResourcesSlides (PDF, 15.8 MB)Text VersionLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)This deck was delivered at a11yqc on 14 Oct 2014As people who work on the Web, we are surrounded by technology-often very new, very fast, very shiny, very expensive technology. Immersed in this sea of ​​"latest and greatest" gadgets, it’s easy to be lulled into believing that our experience is universal. It’s not.If headlines are to be believed, this is the era of the smartphone, the tablet, wearables, and what have you. But the reality is that there are millions of people who access the web. Accessing your bank balance, getting healthcare information, and booking iDevice.Design is about solving problems. Yet, when we are tasked with addressing a universal need, we tend to be more easily reported. It’s natural and completely understandable; it’s easy empathy. It’s a good place to start, but we need to push ourselves to learn about empathize with people who have different needs, experiences, and capabilities.We should strive towards the equality of equal opportunity, while also accepting that it does not guarantee equal experience. And that’s okay. Not everyone needs to have an identical experience, as long as they have a good experience.If you’d like to have me speak at your oganization or event, please get in touch.You might also like@media (prefers-color-scheme:dark){path{fill:#fffcf4}}Expanding Accessibility with AIFirst presented at Microsoft AI Skills on 11 Dec 2024Why I Care Deeply About Web Accessibility And You Should TooLink saved on 09 May 2024Steve Gleason interview with Jenny Lay-FlurrieLink saved on 01 May 2024For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.to'''
