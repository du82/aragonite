full_description = '''Crossposting to Medium from JekyllPublished26 Oct 2015 by Aaron GustafsonReading Time1 minFiled UnderJekyll Octopress blogging indie webReactions22 WebmentionsCommentsCrosspostedMediumLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)Last week, Jeremy Keith posted about syndicating his content to Medium using their new API. Before they added the API, there was no way to automatically publishing to Medium from your own blog. And doing it manually was quite tedious.Jeremy posted in detail about how to set it all up and provided the PHP code he’s using to make it all work. As I’m running a static site on Octopress, I ported it to Ruby as a Jekyll Generator. I’ve posted it to Github, so you can grab it there if you so desire.Like this? You might dig my book Adaptive Web Design, Second Edition. You can grab a copy on Amazon, Barnes & Noble, Peachpit, or anywhere excellent web design books are sold.You might also likeMoved from Octopress to JekyllNotebook entry posted on 23 Mar 2017Any Advice on Moving From Octopress to Jekyll?Notebook entry posted on 21 Jan 2017For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.toWebmentions Sven Aas@Robin2go but then how does this help? 27 Oct 2015 | Permalink: https://twitter.com/SvenAas/status/658853856051384320 Sven Aas@Robin2go Do you use Jeckyll or OctoPress? 27 Oct 2015 | Permalink: https://twitter.com/SvenAas/status/658853627386331136 Sven Aas@Robin2go I’m not ready to blog again but I need to do something about my personal web presence. Someday. Maybe. And I might use Jeckyll. 27 Oct 2015 | Permalink: https://twitter.com/SvenAas/status/658854084246642688 Sven Aas@Robin2go You can also use Übercart. Or Vignette. Or even SharePoint (God help you). How will you choose? 27 Oct 2015 | Permalink: https://twitter.com/SvenAas/status/658854445464297472 Robin SmailI know smart people. Now I can actually use Medium. RT @AaronGustafson: Crossposting to Medium from Jekyll aaron-gustafson.com/notebook/cross…27 Oct 2015 | Permalink: https://twitter.com/Robin2go/status/658852692450803712 Robin Smail@SvenAas Neither. Yet. 27 Oct 2015 | Permalink: https://twitter.com/Robin2go/status/658853712329224192 Robin Smail@SvenAas Because now I can. 27 Oct 2015 | Permalink: https://twitter.com/Robin2go/status/658853952956596224 Sven Aas@Robin2go @fienen Have you considered a tattoo? 27 Oct 2015 | Permalink: https://twitter.com/SvenAas/status/658858468770713600 Robin Smail@SvenAas *snort* It's on the list. 27 Oct 2015 | Permalink: https://twitter.com/Robin2go/status/658855168751071232 Robin Smail@fienen I know several who would buy that one. 27 Oct 2015 | Permalink: https://twitter.com/Robin2go/status/658857034633363456 Sven Aas@Robin2go27 Oct 2015 | Permalink: https://twitter.com/SvenAas/status/658856171760177152 Robin Smail@SvenAas By following the lead of someone I trust — and then unabashedly sucking up to the to help me fix it when I Bork it. 27 Oct 2015 | Permalink: https://twitter.com/Robin2go/status/658854717150375937 Robin Smail@SvenAas @fienen And yet, so much fun! 27 Oct 2015 | Permalink: https://twitter.com/Robin2go/status/658860310816669696 Sven Aas@Robin2go @fienen But it would be so embarrassing when we wear the same outfit. 27 Oct 2015 | Permalink: https://twitter.com/SvenAas/status/658858265443454977 Robin Smail@SvenAas And as an aside — my phone auto capitalized Bork. This makes me want to put an exclamation on it. Bork! Bork! Bork! 27 Oct 2015 | Permalink: https://twitter.com/Robin2go/status/658854973657235456 Sven Aas@Robin2go So, um, let me know when you’ve got it all worked out, ok? You’re so good at this sort of thing. 27 Oct 2015 | Permalink: https://twitter.com/SvenAas/status/658855009183006720 Michael Fienen@Robin2go I think you need to make me a T-shirt... 27 Oct 2015 | Permalink: https://twitter.com/fienen/status/658856817167060992 Sven Aas@Robin2go AND I WILL NOT ABIDE 27 Oct 2015 | Permalink: https://twitter.com/SvenAas/status/658856707410567168 Robin Smail@SvenAas As someone dear to me once said, I AM THE KING OF FUCK MOUNTAIN. 27 Oct 2015 | Permalink: https://twitter.com/Robin2go/status/658856602318053376 remoukJe suis en tout point d’accord avec ton article.:) Je me renseigne doucement sur #webmention dont je n’avais jamais entendu parler… Il existe un plugin #WordPress et avec #Bridgy pour récupérer les “réponses” ça devrait pas être trop compliqué à mettre en place.09 Nov 2017 | Permalink: https://twitter.com/remouk/status/928547984060633088LikesShares'''
