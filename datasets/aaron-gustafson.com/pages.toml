full_description = '''Disability, Bias, and AIPublished byAI Now InstituteSaved on07 Mar 2023byAaron GustafsonFiled Underaccessibility AI/MLLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)This is a foundational paper concerning AI and its potential to help and harm people with disabilities. There are a lot of choice quotes in here, but this one really sums up the importance of an intersectional approach to AI:Integrating disability into the AI bias conversation helps illuminate the tension between AI systems’ reliance on data as the primary means of representing the world, and the fluidity of identity and lived experience. Especially given that the boundaries of disability (not unlike those of race and gender) have continually shifted in relation to unstable and culturally specific notions of “ability,” something that has been constructed and reconstructed in relationship to the needs of industrial capitalism, and the shifting nature of work.Read on AI Now Institute'''
