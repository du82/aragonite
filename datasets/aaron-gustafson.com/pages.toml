eventDefault()}catch(e){}}}(this,this.document,this.navigator)This deck was delivered at UX Immersion Mobile on 13 Apr 2015Progressive enhancement sounds practical, but not for your current project, right? Good news: you’re wrong!In this session, Aaron will debunk the myths that often preclude individuals and organizations from embracing progressive enhancement and demonstrate solid techniques for applying progressive enhancement in your work.By the end of this session, you’ll walk away witha better sense of the devices people are using to access the Web,a framework for envisioning experience as a continuum, anda solid understanding of how to improve the accessibility and reach of your Web projects.Come find out why progressive enhancement isn’t just for “content” sites (whatever those are).Watch This TalkVideo recorded at Øredev on 03 Nov 2015If you’d like to have me speak at your oganization or event, please get in touch.You might also likeDon’t Use JS for That: Moving Features to CSS and HTML by Kilian ValkhofLink saved on 29 Jul 2024On CrowdStrike, dependencies, and building robust products on the webNotebook entry posted on 25 Jul 2024An even faster Microsoft EdgeLink saved on 29 May 2024For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.to'''
