title = "Hi! :: Aaron Gustafson"
description = "Hi there. My name is Aaron Gustafson and I work on the web."
full_description = "# Hi there, I’m Aaron and I work on the web.Every day I strive to make the web (and world) more accessible, open, and equitable place for people to live, play, and work.Over the last 29 years, I’ve written 2 books (contributing to 10 more) and 57 articles with that focus. I’ve also presented on these and related topics at over 158 events in 59 cities across the globe.I’m a Principal Accessibility Innovation Strategist at Microsoft, where I run the $25M Accessibility Innovation grant program and lead the charge on accessibility innovation across the company. In my prior role on the Edge browser team, I steered our investments in Progressive Web Apps (PWAs).I’m also deeply involved in culture work within Microsoft, providing allyship and related training across a broad swath of Microsoft product teams.I’m a spec editor at the W3C, a former manager of the Web Standards Project, Editor-in-chief of A List Apart, and the creator of the Web We Want.If you’re interested in learning more about what I’m up to, check out what I’m working on right now.Me, Elsewhere Follow on Mastodon Follow on Twitter Follow my work on Github View my profile on LinkedIn View my profile on Polywork See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.to Follow me on Academia.edu Follow me on Facebook View my square photos on Instagram See my videos on YouTube Vinyl head? Check out my collection Check out the artists I support on Bandcamp See what I’ve been listening to See my profile on IMDb"
