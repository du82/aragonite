["https://www.aaron-gustafson.com/notebook/a-web-component-for-conditional-dependent-fields"]
title = "A Web Component for Conditional Dependent Fields :: Aaron Gustafson"
description = "A few weeks back I released a web component to enable you to add requirement rules to checkbox groups. Continuing in the form utility space, I’ve created a new web component that allows you to make fields required based on the values of other fields: form-required-if."
full_description = '''A Web Component for Conditional Dependent FieldsThis is the 6 entry in the series Modern Web Form Best Practices.Published14 Aug 2024 by Aaron GustafsonReading Time2 minFiled Underforms HTML JavaScript progressive enhancement web components web formsReactions3 WebmentionsCommentsLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)A few weeks back I released a web component to enable you to add requirement rules to checkbox groups. Continuing in the form utility space, I’ve created a new web component that allows you to make fields required based on the values of other fields: form-required-if.The form-required-if web component, which is based on a jQuery plugin I’d written in 2012, looks like this:<form-required-if conditions="email=*" > <label>Required if there’s an email value <input name="depends-on-email"> </label> </form-required-if>You wrap any field (and its label) in the component and then declare the conditions under which it should be required in the conditions attribute.# Defining the requirement conditionsEach condition is a key/value pair where the key aligns to the name of the field you need to observe and the value is the value that could trigger the dependency. If any value should trigger the dependency, you use an asterisk (*) as the value. In the example above, the field will become required when any value is assigned to the field matching [name="email"].This conditions attribute can be populated with as many or as few dependencies as make sense for your use case. Multiple conditions are separated by double vertical pipes (|| a.k.a. or) as in this example:<form-required-if conditions="email=*||test=3" > <label>Depends on email or test field <input name="depends-on-email-or-test"> </label> </form-required-if>Here the field depends on one of the following conditions being true:the field matching [name="email"] has a value, orthe field matching [name="test"] has a value of “3”If the field you reference doesn’t exist, no errors will be thrown, it will just quietly exit.# Visually indicating a field is requiredIf you typically use an asterisk or similar to indicate a field is required, this web component can support that through one or both of the following attributes:indicator - This attribute is where you define the indicator itself. It could be something as simple as a string (e.g., *), or even full-blown HTML.indicator-placement - As you can probably guess, this attribute is used to set the position of the indicator. If you want it at the start of the label text, you give it the value “before.” If you want it after the text, you use “after” or don’t use the attribute at all. Indicators will be placed after the label text by default.Here’s an example with a custom indicator that is HTML:<form-required-if conditions="email=*" indicator="<b>*</b>" > <label>Depends on email <input name="dep2"> </label> </form-required-if>If you don’t include markup in your indicator, it will be automatically wrapped in span when injected into the DOM. The hidden and aria-hidden attributes are used to toggle its visibility, relative to the requirement state of the field.# DemoI put together a relatively simple demo of the web component over on GitHub:# Grab ItYou can view the entire project (and suggest enhancements) over on the form-required-if component’s Github repo.Like this? You might dig my book Adaptive Web Design, Second Edition. You can grab a copy on Amazon, Barnes & Noble, Peachpit, or anywhere excellent web design books are sold.You might also likeRequirement Rules for CheckboxesNotebook entry posted on 05 Jul 2024Better form UX with the CSS property field-sizingLink saved on 01 Apr 2024Assume the Position—A Labelling StoryLink saved on 07 Jun 2023For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.toWebmentionsLikesShares'''
