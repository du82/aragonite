ocument,this.navigator)This deck was delivered at An Event Apart on 29 Jul 2019For the last three years, our industry has been coming to terms with Progressive Web Apps (PWAs) and what they mean for the work we do every day. Scores of articles, reams of documentation, and dozens of white papers touting the successes and failures in this space can really get your head spinning. It’s easy to get lost in the complexities of service workers, manifests, and oh so many JavaScript frameworks and toolkits. Aaron believes it’s time to take a step back and refocus our attention on what really matters: building great web experiences. In this session, you’ll learn how to apply modern web design and development best practices to your web projects. You’ll learn how to grow a project from a core, universally-accessible experience to a sophisticated Progressive Web App that ensures users will be able to access your product, no matter what.Watch This TalkPlay Video: Progressive Web Apps: Where Do I Begin?Video recorded at An Event Apart on 29 Jul 2019If you’d like to have me speak at your oganization or event, please get in touch.You might also likeSafari 17.4 Beta Release NotesLink saved on 05 Mar 2024PurePWA — A Radical U-Turn in Web DevelopmentLink saved on 02 Feb 2024Widgets!Notebook entry posted on 09 Oct 2023For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.to'''
