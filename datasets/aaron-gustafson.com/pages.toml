on Gustafson × DALL·EToday, some colleagues and I kicked off a new series on developing Progressive Web Apps. It will run for 30 days and takes you from the point of knowing nothing about PWAs all the way through integrating some of the amazing advanced capabilities available to web apps today.I’ll be using this post to collect the articles as they publish. You can also check out the series on dev.to or on the canonical site.Welcome to #30DaysOfPWADay 1 - Introducing Progressive Web AppsDay 2 - Deconstructing Progressive Web AppsDay 3 - Make Progressive Web Apps InstallableDay 4 - Make Progressive Web Apps ReliableDay 5 - Make Progressive Web Apps Work OfflineDay 6 - Make Progressive Web Apps CapableDay 7 - Developing Progressive Web AppsDay 8 - Introducing Advanced Capabilities of PWAsDay 9 - Creating Application ShortcutsDay 10 - Sharing Content From and With Your AppDay 11 - Displaying Content More Like An AppDay 12 - Caching Your App DataDay 13 - Synchronizing App Data in the BackgroundDay 14 - Notifying Users Of UpdatesDay 15 - Tools: Getting Started / Building New PWADay 16 - Tools: Getting Started / Converting your web app to a PWADay 17 - Tools: Debug Your PWA (Part 1)Day 18 - Tools: Debug Your PWA (Part 2)Day 19 - Tools: Auditing Your PWADay 20 - Tools: Test Automation for PWADay 21 - Tools: Packaging Your PWADay 22 - Best Practices for PWA: InstallabilityDay 23 - Best Practices for PWA: EngagementDay 24 - Best Practices for PWA: DistributionDay 25 - Best Practices for PWA: ReliabilityDay 26 - Best Practices for PWA: MaintainabilityDay 27 - Best Practices for PWA: AuthenticationDay 28 - Best Practices for PWA: UI/UXDay 29 - Recap: From Core Concepts to Best Practices!Day 30 - PWA: Learning Resources For BeginnersThis was a really fun series to put together; many thanks to all of my friends and colleagues who contributed. They are:@beth_panx,@nitya,@kennethrohde,@diekus,@seaotta,@webmaxru,@Justinwillis96,@amruthasrin,@patrickbrosset,@noobtiger11,@jaylynsatwork,@devteutsch,@JudahGabriel, and@metulev.Like this? You might dig my book Adaptive Web Design, Second Edition. You can grab a copy on Amazon, Barnes & Noble, Peachpit, or anywhere excellent web design books are sold.You might also likeSafari 17.4 Beta Release NotesLink saved on 05 Mar 2024PurePWA — A Radical U-Turn in Web DevelopmentLink saved on 02 Feb 2024Widgets!Notebook entry posted on 09 Oct 2023For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.toWebmentions Alex RussellICYMI, @AaronGustafson collected all of the incredible #30DaysOfPWA content in one post: aaron-gustafson.com/notebook/30-da… Massive props to @nitya, @seaotta, @diekus, @Justinwillis96, @jaylynsatwork, @patrickbrosset, and everyone else who pitched in outstanding content.30 Mar 2022 | Permalink: https://twitter.com/slightlylate/status/1509033550770675714 Joe Gaffey 🇪🇺🌻30 days of PWA aaron-gustafson.com/notebook/30-da…05 Apr 2022 | Permalink: https://twitter.com/joegaffey/status/1511262121174183937LikesShares'''
