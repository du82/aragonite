title = "PWAs + Desktop = Equity, Opportunity, and Reliability :: Aaron Gustafson"
description = """
Next week I’ll be giving a talk on Progressive Web Apps (PWAs) on Windows (and desktop) at Microsoft Build. While researching folks perspectives on PWAs for the desktop, I stumbled on this post from Justin Ribeiro. In it, he makes a solid case for why discussions of PWAs should not be limited to mobile contexts:

> As web developers we use the desktop browser different than an average user. We use the desktop to develop and we sometimes fall prey to assumptions about the platform from that experience."""
full_description = '''PWAs + Desktop = Equity, Opportunity, and ReliabilityPublished03 May 2017 by Aaron GustafsonReading Time2 minFiled Underprogressive enhancement progressive web appsReactions9 WebmentionsCommentsCrosspostedMediumLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)Next week I’ll be giving a talk on Progressive Web Apps (PWAs) on Windows (and desktop) at Microsoft Build. While researching folks perspectives on PWAs for the desktop, I stumbled on this post from Justin Ribeiro. In it, he makes a solid case for why discussions of PWAs should not be limited to mobile contexts:As web developers we use the desktop browser different than an average user. We use the desktop to develop and we sometimes fall prey to assumptions about the platform from that experience.I know for a fact that right here in my backyard—Chattanooga, TN, self-proclaimed “Gig City”—connectivity is still a problem. Many of the folks who go through the digital literacy training programs offered by Tech Goes Home Chattanooga—which Kelly runs—don’t have an Internet connection at home. Period.The adults and seniors taking TGH CHA classes may not know the value of or can’t afford Internet access. Students have an Internet connection at school, of course, but when they go home to complete their homework, they’re in the same boat. And even when folks have access, in many cases the connection is sub-optimal. Many access the Internet via a mobile or throttled connection tailored to low-income families.Justin again:Desktops can suffer the same ills as any mobile device, no matter how fast you think your LAN or uplink may be. Our assumptions about the desktop experience are like mobile; we believe in a perfectly fast and always connected world that does not exist.Every improvement we can make with flakey mobile networks in mind pays dividends for folks who are using laptops and other devices without a reliable connection. PWAs excel at this.Ultimately, the quality of the experience is what matters, but it’s not all about the network. As Alex Russell points out, reliability is also key (and it’s why platform-specific software has traditionally had an edge over the Web):Think of it this way: the first load of a native app sucks. It’s gated by an app store and a huge download, but once you get to a point where the app is installed, that up-front cost is amortized across all app starts and none of those starts have a variable delay. Each application start is as fast as the last, no variance. What native apps deliver is reliable performance.PWAs enable us to provide a consistent experience and give us the ability to mitigate network issues, making a big difference for a lot of people regardless of the device they’re using. And once we’ve got that, we can make our products even more useful by tying them in to core system components such as address books, calendar applications, and notifications—many desktop operating systems provide JavaScript hooks for those, some standardized, some proprietary.I’m quite excited to see where all of this goes. PWAs on the desktop could be a revolution in the software development space, especially given that both Google and Microsoft are already looking at ways to surface PWAs within their respective app stores. That means that PWAs will not only be viable on Android, but likely also Chrome OS and Windows 10 (including the newly-announced Windows 10 S).Note: I no longer use “native” in this context, but it remains in quoted material.Like this? You might dig my book Adaptive Web Design, Second Edition. You can grab a copy on Amazon, Barnes & Noble, Peachpit, or anywhere excellent web design books are sold.You might also likeA Web Component for Conditional Dependent FieldsNotebook entry posted on 14 Aug 2024Don’t Use JS for That: Moving Features to CSS and HTML by Kilian ValkhofLink saved on 29 Jul 2024On CrowdStrike, dependencies, and building robust products on the webNotebook entry posted on 25 Jul 2024For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.toWebmentions Jason Grigsby, ☁4PWAs + Desktop = Equity, Opportunity, and Reliability by @AaronGustafson aaron-gustafson.com/notebook/PWAs-…07 May 2017 | Permalink: https://twitter.com/grigs/status/861245336194433025The “Developer Experience” Bait-and-Switch14 Sep 2018LikesShares'''
