,this.document,this.navigator)I have mixed emotions about this move to repurpose the utterly terrifying Boston Dynamics robots as service robots, but there are some upsides too.Pro: No waste to clean up & dispose ofPro: Can be used by people with allergiesPro: Has no mouth, will never bitePro: People are less likely to try to pet/distract your service robotPro: Can likely be trained (or sensor-enabled) to recognize more objects and scenarios than a dog can (or at least the specific breeds we employ as service animals)Pro: Would be of service for someone’s lifetime (and beyond) if maintained properlyPro: Knowledge & personality (if there is one) can be migrated to a new robot if the current one breaksQuestionable: Potentially less costly to own, assuming power & maintenance is less than the US$1000-2000/yr it costs to own the average dogCon: Far more expensive upfrontCon: Unlikely to be a companion in nearly the same way (though robots with personality is something folks are working on)Con: Not warm or furryRead on Consejo Superior de Investigaciones Científicas'''
