title = "Considering content warnings in HTML :: Aaron Gustafson"
description = "One of the features I really love about Mastodon is their first-class Content Warning feature. With one additional step, you can add any warning of your choice to your post and it will be hidden by default, showing only the content warning text. It’s a super-simple idea, but so powerful when it comes to reducing potential the likelihood of causing our readers to experience the kinds of trauma that could have severe consequences."
full_description = '''Considering content warnings in HTMLPublished21 Apr 2023 by Aaron GustafsonReading Time3 minFiled UnderHTML inclusive designReactions8 WebmentionsCommentsLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)Credit: Aaron Gustafson × DALL·EOne of the features I really love about Mastodon is their first-class Content Warning feature. With one additional step, you can add any warning of your choice to your post and it will be hidden by default, showing only the content warning text. It’s a super-simple idea, but so powerful when it comes to reducing potential the likelihood of causing our readers to experience the kinds of trauma that could have severe consequences.Earlier today, the idea of a “spoiler / content warning” element popped onto my radar through the Web We Want inbox. It referenced a discussion over on the WICG and I was intrigued but the potential of this kind of feature for HTML. Some folks suggested progressive disclosures like details/summary was the way to go, but that approach is limited to flow content (and fraught with a host of issues).# Markup possibilitiesI wasn’t sold on the idea of a spoiler element either, as that’s a pretty specific use case of a content warning. And so I wondered, what if instead of an element, we introduced an attribute that could take the kind of content warning as its value. For example, consider the following:<article content-warning="child abuse"> … article contents … </article>This would identify the entire article as discussing child abuse. Obscuring that behind a warning would probably be a good idea.Or perhaps the content warning should apply to an image:<img content-warning="violence gore" …>Or, to return to the original idea of a spoiler, it could also be applied inline:I thoroughly enjoyed the film, especially when it was revealed that <b content-warning="spoiler">Taye Diggs had been the bad guy all along</b>.# Necessary behaviorsWhen considering how content behind a warning should be handled, there are a few things that jump immediately to mind:Indicated content should be obscured by default.Users must choose to reveal the content.Content should not be included in the “find in page” index.Images should not be downloaded until they are requested (or there is a good chance they will be needed).There’s also an interesting opportunity for browsers to offer user preferences around this approach as well. For example, I may never want to be shown content that deals with rape, so I could configure that in my preferences and the browser could take additional steps to hide that content from me or at least make sure I actually want to reveal it by requiring a second step for final approval (i.e., Are you actually sure you want to see this?).# DemoI threw together a quick & dirty demo of what the experience could be like on Codepen if you’d like to take a look:<p><a href="https://codepen.io/aarongustafson/pen/rNqjeqj" rel="noopener" target="_blank">See the Pen</a></p>It’s still a work-in-progress, but it’s a starting point. Ideally the browser would handle all of this directly, rather than us having to author CSS and/or JavaScript to implement the feature ourselves. (Though maybe we could get access to style parts of the overlay.)# Thoughts?What do you think? Is this something you’d like to see on the web? I’d love to hear your thoughts, which you can share by Webmention-ing this post or referencing it on Mastodon.# Update 2023-04-24James Edwards mentioned the potential interplay issues with Reader Mode (and similar) so I started playing around with an alternate approach. I landed on a version that physically swaps out the elements in the DOM for a custom element content-warning that acts as a placeholder. Here’s how it works:Author uses content-warning attribute as described above.The runtime script swaps that element for the custom content-warning element, which contains a wrapper element (span) that is sized to occupy the same space as the original element (including margins).The content warning text is used to label a button inside that wrapper.Clicking the button swaps the original element back into position and announces it to screen reader users (using role="alert").I tested this approach with VoiceOver and JAWS and it works a treat. I also confirmed the Edge’s Reader Mode does not deliver the hidden content.<p><a href="https://codepen.io/aarongustafson/pen/QWZpqPe" rel="noopener" target="_blank">See the Pen</a></p>Note: The browser doing the work of my demo would be much faster as it could do all the size calculations prior to rendering. I am having to fake that in JavaScript, so I have to peg it to the window’s onload event to ensure all CSS is applied to get the size calculations right.Like this? You might dig my book Adaptive Web Design, Second Edition. You can grab a copy on Amazon, Barnes & Noble, Peachpit, or anywhere excellent web design books are sold.You might also likeA Web Component for Conditional Dependent FieldsNotebook entry posted on 14 Aug 2024Don’t Use JS for That: Moving Features to CSS and HTML by Kilian ValkhofLink saved on 29 Jul 2024Requirement Rules for CheckboxesNotebook entry posted on 05 Jul 2024For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.toWebmentions Chris Taylor@Aaron hey, I'd love to read this but in Firefox on Android when I scroll down past the header image it jumps to the bottom of the page! I'll send myself the link and read it on a different device 😀22 Apr 2023 | Permalink: https://mastodon.world/@stillbreathing/110241664180831463LikesShares'''
