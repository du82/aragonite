title = "Designing with Empathy :: Aaron Gustafson"
description = "In this session, I explore why empathy is a good thing, how empathy empowers creativity, and how we, as a community, can inject more empathy into our work."
full_description = '''Designing with EmpathyFormatTalkPresented AtBreaking Development on 08 Apr 2013Beyond Tellerrand on 27 May 2013From the Front on 19 Sep 2013Breaking Development on 21 Oct 2013Awwwards on 14 Feb 2014Code & Creativity on 24 Jun 2014DevDev on 14 Jul 2014DevLink on 26 Aug 2014Chattanooga City Employees Lunch & Learn on 10 Dec 2014Filed Underempathy equality design user experienceResourcesSlides (PDF, 5.68 MB)Like this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)This deck was delivered at Breaking Development on 08 Apr 2013Every decision we make affects the way real people experience our products. We’ve all heard the rallying cry for user-centered design, but even those of us who ascribe to that ideal often fall back on our own biases and instincts when it comes to making decisions about how people experience our content and our services. Sadly, this often means we make decisions we think will be good for our “users”—that anonymous, faceless crowd—rather than actually trying to understand the perspectives, surroundings, capabilities, and disadvantages of the actual people who we are here to serve.In this session, I explore why empathy is a good thing, how empathy empowers creativity, and how we, as a community, can inject more empathy into our work.Watch This TalkPlay Video: Designing with EmpathyVideo recorded at Breaking Development on 08 Apr 2013If you’d like to have me speak at your oganization or event, please get in touch.You might also likeOn DiversityNotebook entry posted on 30 Jan 2025Digital Exclusion in Healthcare & How to Change ItLink saved on 27 Jan 2023How to talk about disability sensitively and avoid ableist tropesLink saved on 09 Sep 2022For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.to'''
