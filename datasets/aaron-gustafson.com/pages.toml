title = "My Notebook :: Aaron Gustafson"
description = "Hi there. My name is Aaron Gustafson and I work on the web."
full_description = "Dispatches From The InternetsSpeech Accessibility Project data leads to recognition improvements on Microsoft AzureSaved on31 Jan 2025Filed Underaccessibility AI/MLThis is the kind of work that keeps me excited about the potential of AI to meaningfully improve people’s lives. I’m so proud to be playing a small part in this project.On DiversityPosted on30 Jan 2025Filed Underequality inclusion society industryI’ve been broadly working in the DEI (or DEIA if you like) sphere for decades now. Most of my work has been coming at it from the accessibility side of things, but I got really involved in allyship and more traditional DEI work starting in 2019. Seeing the current U.S. administration taking an axe to DEI programs in the government and bully private businesses to do the same has me incredibly frustrated, confused, and (yes) angry. I want more equality and more opportunity in the world, not less. And so, when I was listening to the latest episode of The Weekly Show with Jon Stewart, I was struck by how the left and right may actually be more aligned on DEI than the headlines lead us to believe.You can finish reading On Diversity in less than 7 minWeb Components Are Not the Future — They’re the PresentSaved on27 Sep 2024Filed Underweb components web standards JavaScriptI really appreciated Cory LaViska’s take on #WebComponents here. Especially this bit:You know what framework I want to use? I want a framework that aligns with the platform, not one that replaces it. I want a framework that values incremental innovation over user lock-in. I want a framework that says it’s OK to break things if it means making the Web a better place for everyone. Yes, that comes at a cost, but almost every good investment does, and I would argue that cost will be less expensive than learning a new framework and rebuilding buttons for the umpteenth time.A Web Component for Conditional Dependent FieldsPosted on14 Aug 2024Filed Underforms HTML JavaScript progressive enhancementA few weeks back I released a web component to enable you to add requirement rules to checkbox groups. Continuing in the form utility space, I’ve created a new web component that allows you to make fields required based on the values of other fields: form-required-if.You can finish reading A Web Component for Conditional Dependent Fields in less than 2 minDon’t Use JS for That: Moving Features to CSS and HTML by Kilian ValkhofSaved on29 Jul 2024Filed UnderHTML CSS JavaScript progressive enhancementThis is a fantastic run-through of HTML and CSS features that help reduce our dependence on JavaScript (and improve #accessibility). Great work Kilian!On CrowdStrike, dependencies, and building robust products on the webPosted on25 Jul 2024Filed Underprogressive enhancement hazards CSS JavaScriptI have no opinion on CrowdStrike as a company or service. I’ve never used their products. In fact, prior to the incident last week, I had only a passing familiarity with their name — likely from headlines in the tech press I’d scrolled past at some point in time. I now have a vague understanding of what they do, but that’s only based on what I learned about the cause of the incident. In reflecting on this unfortunate incident, I can’t help but think of the lesson it holds for web designers and developers.You can finish reading On CrowdStrike, dependencies, and building robust products on the web in less than 2 minRequirement Rules for CheckboxesPosted on05 Jul 2024Filed Underaccessibility forms HTML JavaScriptHTML checkboxes debuted as part of HTML 2.0 in 1995. Our ability to mark an individual checkbox as being required became part of the HTML5 spec that published in 2014. A decade later, we can still only make checkboxes required on a case-by-case basis. To overcome this limitation, I had created a jQuery plugin that allowed me to indicate that a user should choose a specific number of items from within a checkbox group. Yesterday I turned that plugin into a web component: form-required-checkboxes.You can finish reading Requirement Rules for Checkboxes in less than 2 minTodo app with no client-side JavaScript using @lazarv/react-serverSaved on29 May 2024Filed UnderJavaScript progressive enhancementI love straightforward examples, like this one, of how to build progressively enhanced experiences in frameworks like React.Step 2: Add in some HTML web components!An even faster Microsoft EdgeSaved on29 May 2024Filed Underprogressive enhancement browsers HTML CSSProgressive enhancement for the win! This post from the Edge team demonstrates that producing markup directly rather than relying on JavaScript to do it for you is faster — even in the browser UI!In this project, we built an entirely new markup-first architecture that minimizes the size of our bundles of code, and the amount of JavaScript code that runs during the initialization path of the UI. This new internal UI architecture is more modular, and we now rely on a repository of web components that are tuned for performance on modern web engines. We also came up with a set of web platform patterns that allow us to ship new browser features that stay within our markup-first architecture and that use optimal web platform capabilities.Link Rot and Digital Decay on Government, News and Other WebpagesSaved on24 May 2024Filed Underthe web industry URLsA quarter of all webpages that existed at one point between 2013 and 2023 are no longer accessible, as of October 2023. In most cases, this is because an individual page was deleted or removed on an otherwise functional website.Linkrot, especially in government and legal scenarios, is a tremendous problem, which is why we need services like the Internet Archive and Perma.cc. If you have the means, please consider supporting these, and similar, projects!Page 1 of 100 Next Page →"
