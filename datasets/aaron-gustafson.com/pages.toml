["https://www.aaron-gustafson.com/notebook/going-offline"]
title = "Going Offline :: Aaron Gustafson"
description = """
As you’ve probably gathered if you’ve been following my work for the last few years, I’m super-jazzed about Progressive Web Apps.  I think they have the potential to improve user experience, performance, access, and so much more for so many people. So I was stoked when Jeremy Keith asked me to write the foreword for his latest book, Going Offline, which tackles the complex topic of Service Workers with aplomb.

With his permission (and A Book Apart’s), I’m reprinting the foreword here."""
full_description = '''Going OfflinePublished10 Apr 2018 by Aaron GustafsonReading Time2 minFiled Underweb design web development writing progressive web apps performanceReactions31 WebmentionsCommentsLike this? Share on Twitter (new tab) Share on Hacker News Post on Facebook Share on LinkedIn Share on Pinterest!function(i,e,t){var r,n,o,a,l,c;if("querySelectorAll"in e)if("share"in t)n=(r=e.querySelector(".social-links--share")).parentNode,o=e.createElement("button"),a=e.querySelector("h1.p-name,title").innerText,s=e.querySelector('meta[name="og:description"],meta[name="description"]'),l=s?s.getAttribute("content"):"",c=i.location.href,o.innerHTML='Share <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 448.003 446.746"><path d="M362.065 172.023c47.523 0 85.938-38.559 85.938-85.941C448.003 38.559 409.59 0 362.065 0s-86.082 38.559-86.082 86.082c0 7.406 1.235 14.477 3.008 21.34l-99.09 50.582c-18.699-22.031-46.531-36.051-77.711-36.051C45.78 121.953 0 167.726 0 224.143c0 56.246 45.777 102.02 102.19 102.02 28.617 0 54.418-11.812 72.93-30.758l65.164 38.715c-2.773 8.453-4.652 17.312-4.652 26.688 0 47.383 38.559 85.938 86.082 85.938s85.938-38.559 85.938-85.938c0-47.523-38.418-86.082-85.938-86.082-24.688 0-46.805 10.547-62.504 27.211l-63.266-37.582a101.633 101.633 0 008.27-40.211c0-11.816-2.102-23.117-5.786-33.676l97.648-49.848c15.793 19.008 39.328 31.398 65.984 31.398l.005.005z"/></svg>',o.addEventListener("click",function(e){t.share({title:a,text:l,url:c})}),n.insertBefore(o,r),r.remove();else{var s="visualViewport"in i?i.visualViewport.width:i.innerWidth,h=e.querySelectorAll(".social-links--share a"),u=h.length;if(500<s)for(;u--;)h[u].addEventListener("click",p,!1),h[u].querySelector(".social-link__text").innerHTML+=" (in a popup)"}function p(e){for(var t=e.target;"a"!=t.nodeName.toLowerCase();)t=t.parentNode;var r=i.open(t.href,"share","height=500,width=600,status=no,toolbar=no,popup");try{r.focus(),e.preventDefault()}catch(e){}}}(this,this.document,this.navigator)As you’ve probably gathered if you’ve been following my work for the last few years, I’m super-jazzed about Progressive Web Apps. I think they have the potential to improve user experience, performance, access, and so much more for so many people. So I was stoked when Jeremy Keith asked me to write the foreword for his latest book, Going Offline, which tackles the complex topic of Service Workers with aplomb.With his permission (and A Book Apart’s), I’m reprinting the foreword here.We often talk gleefully about the open and ubiquitous nature of the web, but it has an Achilles’ heel: network connectivity. If your career is spent working on the web, chances are you might rarely encounter networking issues in your day-to-day life. When it comes to networks, many of us are spoiled with sweet, sweet speed and incredible reliability. We take it for granted that everyone in the world experiences the web like we do.With an uncertain network connection, the web can be elusive. Broken page layouts. Missing functionality. Lost images. Dinosaurs. Broken hearts. Frustration.With no network at all, the web ceases to exist.Over the years, scores of people far smarter than I have looked for ways to help the web overcome its complete dependence on the network. Browser caching, Application Cache, Local (and Session) Storage, and client-side databases have all helped to some degree (well, maybe not AppCache) but these technologies have been somewhat limited in both scope and capability.Then along came the service workers. Service workers are one of the most powerful tools we’ve had at our disposal, enabling us to control how we handle network requests. They even enable us to decide whether to make a network request at all. Of course, that power also gives us the ability to completely break our sites—if we’re not careful.Which brings me to the book you hold in your hands. In Going Offline, Jeremy Keith breaks down heady concepts into approachable prose and easy-to-follow code examples. He also points out service worker gotchas and shows you how to deftly avoid them. Invest a scant few hours with this book, and you’ll gain a solid understanding of how to put this new technology to work for you right away. No, really—within fifteen to twenty minutes of putting it down.Armed with the knowledge you gain from Jeremy’s words, I have no doubt you’ll do wonders to improve the resilience of the web.—Aaron GustafsonYou can (and should) purchase Going Offline directly from A Book Apart. You can also read Chapter 1 of Going Offline on A List Apart.Like this? You might dig my book Adaptive Web Design, Second Edition. You can grab a copy on Amazon, Barnes & Noble, Peachpit, or anywhere excellent web design books are sold.You might also likeOn CrowdStrike, dependencies, and building robust products on the webNotebook entry posted on 25 Jul 2024The quiet, pervasive devaluation of frontendLink saved on 20 Mar 2024path{fill:#000}@media (prefers-color-scheme:dark){path{fill:#fffcf4}}Building Resilient Web Apps: Progressive Enhancement UnveiledJoined Code Ryan podcast on 28 Aug 2023For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.toWebmentions A Book ApartTake a peek at the super lovely and thoughtful foreword to @adactio’s new book, by @AaronGustafson:bit.ly/2JyqPHG 10 Apr 2018 | Permalink: https://twitter.com/abookapart/status/983800818762702849 A Book ApartTake a peek at the super lovely and thoughtful foreword to @adactio’s new book, by @AaronGustafson:bit.ly/2JyqPHG 10 Apr 2018 | Permalink: https://twitter.com/abookapart/status/983800818762702849 Nicolas HoizeyNice foreword!AppCache did really help with offline, and it is still useful for older browsers.Also, in old technologies, even if it was not a cross-browser standard, you could have mentioned Google Gears. 😉10 Apr 2018 | Permalink: https://twitter.com/nhoizey/status/983854015334232064 edUi conferenceThe foreword to 2018 #edUiConf keynote @adactio's new book "Going Offline" is being written by another edUi friend @AaronGustafson! The book is about creating a great experience even when users are offline. Aaron's published the foreword here: ow.ly/CZCV30jqZZz @abookapart 11 Apr 2018 | Permalink: https://twitter.com/eduiconf/status/984057764174618625 edUi conferenceThe foreword to 2018 #edUiConf keynote @adactio's new book "Going Offline" is being written by another edUi friend @AaronGustafson! The book is about creating a great experience even when users are offline. Aaron's published the foreword here: ow.ly/CZCV30jqZZz @abookapart 11 Apr 2018 | Permalink: https://twitter.com/eduiconf/status/98405776417461862511 Apr 2018 | Permalink: https://www.aaron-gustafson.com/notebook/going-offline/ Adactio LinksGoing Offline | Aaron Gustafson aaron-gustafson.com/notebook/going…11 Apr 2018 | Permalink: https://twitter.com/adactioLinks/status/984076883158499329LikesShares'''
