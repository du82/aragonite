title = "My Official Biographies :: Aaron Gustafson"
description = "Hi there. My name is Aaron Gustafson and I work on the web."
full_description = "# BiographiesLooking for a headshot?# One-liner (31 Words)Aaron Gustafson is a Principal Accessibility Innovation Strategist at Microsoft and the author of Adaptive Web Design.# Brief Bio (106 Words)As would be expected from a former manager of the Web Standards Project, Aaron Gustafson has been working to make the web more equitable for nearly three decades now. He is a Principal Accessibility Innovation Strategist at Microsoft. In a prior role, he worked on the Edge browser team with a focus on Progressive Web Apps and developer-focused user experiences. He penned the seminal book on progressive enhancement, Adaptive Web Design, and has been known to have some opinions, many of which he shares at aaron-gustafson.com.# Full Bio (282 Words)As would be expected from a former manager of the Web Standards Project, Aaron Gustafson has been working to make the web more equitable for nearly three decades now.As a web designer, developer, and consultant, Aaron has worked with a number of companies you’ve probably heard of. In 2015, he joined Microsoft as a web standards advocate to work closely with their browser team, where he established the developer-engagement platform the Web We Want and worked to chart the future of Progressive Web Apps (PWAs) as a member of the W3C’s Web Applications Working Group, an editor of several PWA-related specifications, and author of numerous feature proposals. In 2022, Aaron shifted his focus to leading Microsoft’s AI for Accessibility grant program, where he identifies and funds innovations in accessibility on a global scale.Aaron loves to share his knowledge and insights in written form. His three-part series on progressive enhancement for A List Apart is a perennial favorite and his seminal book on the subject, Adaptive Web Design, earned him numerous accolades and honors. When he’s not writing, Aaron is frequently on the road presenting at conferences and running workshops across the globe.You can find out more about Aaron at aaron-gustafson.com."
