full_description = 'Nano Mixed ReefRed Sea Reefer 170# Livestock# FishFirefish Goby (Nemateleotris magnifica)Green Mandarin (Synchiropus splendidus)Springer’s Damsel (Chrysiptera springeri)Starry Blenny (Salarias ramosus)# InvertsEmerald Crabs (Mithraculus sculptus) × 3Fighting Conch (Strombus spp.)Fuzzy Chiton (Acanthopleura granulata) × 2Marginella Snail (Marginella spp.)Money Cowrie (Monetaria moneta)Scarlet Hermit Crabs (Paguristes cadenati)Assorted snails (trochus, nassarius, strombus)Assorted worms, pods, hermits, snails & such from Indo-Pacific Sea FarmsAdditional Clean-up Crew (zigzag periwinkles, dwarf planaxis, etc.) from ReefCleaners# Soft CoralsZoanthids & PalythoasBlue AgaveCitrus CoolerDevil’s ArmorDing Dang People EaterEagle EyeFruit LoopOxideRastaTubb’s BlueUtter ChaosVampires in DragOtherGolden Ricordea yuma# Stony CoralsAcroporaGreg Hiller’s Aqua DelightBlastomussaUltra Corals (UC) Blue Raven (Blastomussa merletti)Superman (Blastomussa merletti)Rainbow (Blastomussa wellsi)Ironman (Blastomussa wellsi)GoniastreaDragon Soul (Goniastrea palauensis)GonioporaLong-tentacled, green with blue mouthsLong-tentacled, hot pinkLong-tentacled, highlighter greenLeptastreaJason Fox John Deere LeptastreaPurple LeptastreaWWC Burning LeptastreaWWC Kermit The Frog LeptastreaMicromussaWWC Ultron (Micromussa amakusensis)Rainbow Lord - Yellow, purple & green (Micromussa lordhowensis)Gold Dust Lord - Gold, white & green (Micromussa lordhowensis)MontiporaBeach BumRainbowMiscellaneousBlueberry DuncanRainbow Symphilia (Symphilia wilsoni)# Life SupportTankRed Sea Reefer 170 (white)Custom lid from Octo AquaticsTank Lighting[ReeFi Duo Extreme](https://www.reefi-lab.com/product/reefi-led-duo-extreme/)RMS mountCustom adapter for RMS mountSumpStock Reefer 170 sump with additional baffles for the refugiumCustom lid from Octo AquaticsRed Sea Nano Filter MatSkimmerTunze Comline DOC Skimmer 9004 DCReturnNeptune Systems COR 15VCA Random Flow GeneratorWavemakerRed Sea ReefWave 25Refugium LightTunze Refugium LED 8831.00HeatersBulk Reef Supply Titanium 200WCobalt Aquatics Neotherm 150WControllerNeptune Apex 2016 w/ temp, salinity, pH, and ORPEB832FMM × 2DosingGHL Doser 2.1Coral Box Dosing 3-Room Liquid ReservoirAuto Top-OffNeptune Systems ATKCustom reservior from Octo AquaticsSafetyGFCI + Arc Fault protected outletInk Bird Heater ControllerNeptune Systems FMM + 2 hard surface water sensorsNeptune Systems Solenoid Valve between the PMUP and the sump (since the ATO Reservoir is on top)# EnvironmentSaltRed Sea Blue BucketDosingTriton Core7AcropowerTankLife Rock Shapes Aquarium Rock (40lbs)CaribSea Arag Alive Fiji Pink Sand (40lbs)CaribSea Arag-Alive Bimini Pink Sand (10lbs)RefugiumWalt Smith Fiji MudAssorted Macroalgae# NotesConnecting the COR to the Reefer is challenging. Here is how I ended up plumbing it all together: COR ¾" slip + ¾" slip × ¾" FPT + ¾" NPT × ⅝" barbedGalleryUltra Corals Blue Raven Blastomussa merlettiWWC Burning LeptastreaThese Devil’s Armor zoanthids have always beena great grower for me. These came from my old tank.A small piece of my old Dragon Soul Goniastrea from Cultivated Reef.Originally sold to me as Emeralds on Fire, these are actually Fruit Loop zoanthids.I love branching montipora and this German Blue Digitata has a particularly nice branching pattern.Here’s a look at my old (sold) colony of German Blue Digitata.These WWC Halle Berry zoas were among the first residents of this tank and they’ve really taken off.A very cool orange-dominant Symphilia with hints of teal and green. Becomes more yellow in mid-day. Good eater. Can’t wait to see it grow!I originally got this colony from World Wide Corals on a trip to Orlando back in 2014.I go back & forth on clove polyps, but I’m a sucker for yellow corals and these have awesome yellow tips.I cannot tell you how amazing this Sunset Plate coral is. It’s easily the brightest thing in the tank. Gorgeous!It may not look like much amid the purple coraline algae, but the purples and blues in this Micromussa lord are just stunning.I love this Micromussa lord because it is pretty conservative on the surface (tan and lavender), but underneath it has a glowing green mouth. Some of the polyps even have bi-color mouths (neon purple and green).This photo doesn’t really capture all the colors that come out when this Micromussa lord is feeding. Greens, yellows, oranges, and reds… it’s beautiful.This Micromussa lord is predominantly a rusty orange red with a steel blue rim and it’s mounths are hot pink. This particular colony has massive polyp extension. It’s like nothing ive seen in other colonies.Another descendent from my old tank, Oxide zoanthids originally from Cultivated Reef.I’m a sucker for pretty pink corals, so naturally I had to buy this mini-colony of Pink Zipper zoanthids.These Rainbow Incinerator zoas blew me away at the Zoanthids.com booth at a reefing tradeshow, so naturally they had to come home with me. They’re growing strong too.Rastas are one of my favorite zoas. Just look at that green!I’m fascinated by tube worms. This red & white coco worm is particularly beautiful.'
