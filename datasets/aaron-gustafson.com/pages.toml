full_description = "# ColophonSo you want to know more about what makes this site tick, huh? Well, it’s powered by Eleventy, a Node-based static site generator created by Zach Leatherman. The site is hosted on Netlify.No frameworks were used in the creation of this site. I did use Sass to help me with my CSS workflow and use Breakup, and Quantity Query add-ins. I also use the HTML5 Doctor CSS reset. I have a couple of Gulp scripts I use to manage my builds.Many icons used on the site are from the Noun Project:“Article” by Creative Stall“Article” by Sergey Krivoy“Book” by Elliot Midson“Books” by Adrien Coquet“Chat” by Creative Stall“Keynote” by romzicon“Notebook” by Xela Ub“Pin” by alix“Share” by BrickclayThe full source of this site is available on Github.Did I miss anything? If so, ask and I will do my best to include it."
