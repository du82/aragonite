full_description = "What’s Keeping Me BusyIf you’re wondering what I’m up to, it’s a little bit of everything.Currently…Evaluating applications for Microsoft’s AI for Accessibility grant program.Educating myself on all things Machine Learning, especially its implications for privacy, accessibility, and equity.Helping bring PWA-driven widgets to Windows.Putting together the 2023 edition of PWA Summit with friends.Editing the Web App Manifest, Manifest App Info, and ImageResource specs at the W3C.Helping give web folks a voice in the future of the platform via The Web We Want.Setting the editorial direction at A List Apart.Neglecting my my reef tank.Open to…Doing podcast interviews and talks/workshops on AI/ML, accessibility, PWAs, inclusive design, progressive enhancement, and more.Writing articles on any of the aforementioned topics.Article pitches for A List Apart.Sharing my network with folks in tech who come from underrepresented/marginalized communities.Reach out if you’re interested in talking.Updated 28 Feb 2025"
