.document,this.navigator)The web is not a fixed width. So if the medium is fluid, should the process be fixed? Fireworks and Photoshop are not flexible enough to demonstrate media queries, button and menu states, HTML5 and JavaScript behaviors, dynamic resizing of elements and navigation flow.Diving into responsive design projects can be daunting. Old design practices are cumbersome when thinking in terms of web systems that will span a wide variety of devices and dimensions. Four industry leaders will delve into how they handle the responsive process or how they don’t. A fluid process to match the fluidity of responsive design. Bam! We’ll also explore some of recent successes and failures while establishing why a responsive process is a responsible process.One web to rule them all?If you’d like to have me speak at your oganization or event, please get in touch.You might also likeRequest with Intent: Caching Strategies in the Age of PWAsArticle published in A List Apart on 21 Nov 2019@media (prefers-color-scheme:dark){path{fill:#fffcf4}}Designing for Everyone: Building Great Web Experiences for Any DeviceFirst presented at Microsoft Build on 07 May 2018@media (prefers-color-scheme:dark){path{fill:#fffcf4}}Advanced Design MethodsFirst presented at Center Centre Workshop on 15 Nov 2017For more content like this, follow me on Follow on Mastodon Follow on Twitter View my profile on LinkedIn See where I’ve been & where I’m going next on Notist I crosspost my content to Dev.to'''
