description = "commitiversary(noun)com·​mit·i·​ver·​sa·​ry kə-ˈmit-ə-vərs-rē Ten years ago yesterday I took some code that someone suggested belonged in WordPress and made the decision that it belonged in WordPress. This wasn’t a change to the actual distributed code of WordPress but was a change that affected the builders of WordPress. Since that time, I’ve made 538 additional commits. Here […]"
full_description = '10th Commitiversary Sep 30, 2024 — Code commitiversary(noun)com·​mit·i·​ver·​sa·​ry kə-ˈmit-ə-vərs-rē The annual recurrence of a date marking your first commit to a project.“It is my 10th commitiversary“ The celerbration of a commitiversary.“For my Commitiversary I am writing this blog post“ Ten years ago yesterday I took some code that someone suggested belonged in WordPress and made the decision that it belonged in WordPress. This wasn’t a change to the actual distributed code of WordPress but was a change that affected the builders of WordPress. Since that time, I’ve made 538 additional commits. Here are 10 facts to celebrate this commitiversary. 351 of my commits have been to trunk, 155 to different branches and 33 have been to create branches. I’ve propped 319 different invididuals. The person I’ve propped the most is Jonathan Desrosiers. I’m third on his list, can you tell we like to work on similiar things? 2016 is the year I made the most commits with 131 commits that year. 2022 is the year I made the fewest with 6. I’m currently at 99 for 2024. I’ve never committed during the 0700 hour or 1000 hour UTC. 45% of my commits happened between 17:00 and 20:59 UTC. Besides myself, I’ve given “unprops” to 4 other people. I’ve propped three different people with “matt” in their username include one who’s username is just matt. My commits have touched 517 different files. It has remained an honor and a pleasure to work on WordPress Core I’ve spent the last year as an independant and community sponsored committer. If you would like to support my work, I would love to have it. I’ve previusly blogged my ninth, eighth, seventh, and third commitiversary. Like this:Like Loading… core commit open source software WordPress GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browse