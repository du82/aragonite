title = "My December in WordPress - Aaron Jorbin"
description = "I’ve now been accepting sponsors for my contributions to WordPress for two months and in order to add some transparency, I’m sharing what I have done in WordPress. While nearly all the work I do is in public and on my WordPress profile, this roundup is designed to be an at-a-glance look. In December, I […]"
full_description = 'My December in WordPress Dec 28, 2023 — Code I’ve now been accepting sponsors for my contributions to WordPress for two months and in order to add some transparency, I’m sharing what I have done in WordPress. While nearly all the work I do is in public and on my WordPress profile, this roundup is designed to be an at-a-glance look. In December, I was the release lead for the 6.4.2 security and maintenance release. This was a quick release due to a vulnerability being published rather than responsibly disclosed. In my role as release lead, I coordinated and ensured that all the roles for the release day were covered. Communication before the release to hosts and then to the general public was also in my purview. For this, I drafted and coordinated edits to the release post. Behind the scenes, I was one of many who reviewed the patch and I also drafted the security commit message so that it was prepared and ready to go when the release started. On the day of the release, I served as the host. I also ran two bug scrubs for WordPress 6.4.3 and have been working on lining up a team to work on that. I’ve also begun hacking on a google chrome extension to help me with bug gardening that I plan to release and open source in early 2024. Finally, I contributed to multiple discussions in slack and on the make/core and make/project sites. By The Numbers During the month of December, I contributed to 65 tickets on trac, made 9 commits to core, received 8 props, and worked approximately 75 hours on WordPress, of which my sponsors paid for 10 and I donated the rest. I had 11 sponsors this month: JeffMatson, jeffpaul, philipjohn, zstepek, kkoppenhaver, wpcloudpanel, mamaduka, kingkool68, austinginder, and two who wish to remain anonymous. Thank you for believing in and supporting my contributions to Open Source. Previous: November 2023 Like this:Like Loading… My Month In WordPress open source software WordPress GET AARON IN YOUR INBOX Type your email… Subscribe 