["https://aaron.jorb.in/my-february-in-wordpress"]
title = "My February in WordPress - Aaron Jorbin"
description = "For the first time since I started my journey towards being a sponsored WordPress contributor, I went an entire month without leading a WordPress release. This was a nice change of pace since it gave me some time to focus on building a feature for 6.5. My main focus this month has been on the […]"
full_description = 'My February in WordPress Mar 1, 2024 — Code For the first time since I started my journey towards being a sponsored WordPress contributor, I went an entire month without leading a WordPress release. This was a nice change of pace since it gave me some time to focus on building a feature for 6.5. My main focus this month has been on the site icon and making it easier to update by moving it out of the customizer and the block editor. Site Icons in WordPress is something that I’ve worked on in some way since February 9th, 2012 when I made the 38th comment on the ticket for the initial idea. One of the cool parts about updating a feature is finding all the ways the original can be improved. While the suggestions for the UI improvements came a little late (though I tried to get them in, ultimately it made sense to defer them for another release), there are some alt-text improvements to the preview in the customizer and some text improvements to the implementation in the block editor. Outside of directly core related contributions, I also contributed to two other areas. I have been supporting the development of the props bot action largely through code review, but I also helped add linting and fixed a few bugs. February was also the month for the WordPress Photo Festival 2024 where one of my submissions was selected as a runner-up. I had six photos accepted into the Photo Directory this month. By the numbers During the month of February, I contributed to 63 tickets on trac, made 6 commits to core, received 9 props, and worked approximately 96 hours on WordPress, of which my sponsors paid for slightly less than 17 and I donated the rest. I had 12 sponsors this month: JeffMatson, jeffpaul, philipjohn, zstepek, kkoppenhaver, mamaduka, kingkool68, austinginder, adamsilverstein, felixarntz, Emilia-Capital and one who wishs to remain anonymous. Thank you for believing in and supporting my contributions to Open Source. Previous: January 2024, December 2023, November 2023 Like this:Like Loading… My Month In WordPress open source software WordPress GET AARON IN YOUR INBOX Type your email… Subscribe Comments 5 responses to “My February in WordPress” Leo Gopal March 1, 2024 Legendary record, an aspirational for me (though in the Community Team). Definitely sharing your sponsor link and joining the list as lucky 13. Reply jorbin March 1, 2024 Thank you and thank you for your contributions to the Community Team! Reply Mentions 💬 jorbin 💬 jorbin 💬 jorbin Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: Titles of drafts I just deleted Next: Aaron’s Axioms→'
