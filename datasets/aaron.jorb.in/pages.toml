title = "Pride Photos I've released to the commons - Aaron Jorbin"
description = "Some links in this post are affiliate links. Clicking them and buying will benefit me. During June as a celebration of Pride Month, LGBTQ+PRESS ran a Share Your Pride Photo Drive and I was honored to be one of the top contributors. I submitted a total of 12 rainbow/pride-related photos which are now all available […]"
full_description = 'Pride Photos I’ve released to the commons Jul 25, 2024 — Art Some links in this post are affiliate links. Clicking them and buying will benefit me. During June as a celebration of Pride Month, LGBTQ+PRESS ran a Share Your Pride Photo Drive and I was honored to be one of the top contributors. I submitted a total of 12 rainbow/pride-related photos which are now all available for you to use free of restriction (much like all love should be). Genoa Pride Village I took each of these photos in and around the Liguria Pride village in Genoa. I used my Canon RF 16mm f2.8 which is a small lightweight lens that I’m always glad to have in my bag. It’s super wide on a full-frame camera, so it lets me capture A LOT and forces me to really get up close to a subject. A rainbow heart with a tree and city street in the background. by Aaron Jorbin is licensed under CC-CC0 1.0 A city street with a rainbow painted on it. The rainbow stripes run the full length of the image and all are 10s of centimeters wide by Aaron Jorbin is licensed under CC-CC0 1.0 Intersex variant of the Progress Pride Flag painted on a city street by Aaron Jorbin is licensed under CC-CC0 1.0 Pride on the Road This next group is photos I found by looking through my archive. The first from New Orleans felt like a Pride photo since Mardi Gras and Pride are both holidays that feel like parties to celebrate ourselves. The next two are from Puerto Rico where I regularly saw rainbows while sitting on the beach. Colorful beads in purple, green, and yellow are hanging on a black iron fence. by Aaron Jorbin is licensed under CC-CC0 1.0 A rainbow above the ocean with a sandy beach in the foreground. by Aaron Jorbin is licensed under CC-CC0 1.0 A rainbow above a sandy beach on a partially cloudy day. The waves on the water are very strong by Aaron Jorbin is licensed under CC-CC0 1.0 Pride Photos from Turin WordCamp Europe was in Turin and I got a few chances to take some photos. The first two are phone photos from the venue where the Scale Consortium held a small event and the third is from outside a bar on Corso Vittorio Emanuele II. Hanging glass panels create a rainbow of colors in a modern building by Aaron Jorbin is licensed under CC-CC0 1.0 Turin Italy from above with a rainbow in the distance by Aaron Jorbin is licensed under CC-CC0 1.0 A pride flag hanging on a balcony on a city street. by Aaron Jorbin is licensed under CC-CC0 1.0 Two Flags in Valencia While walking through a very sunny day in Valencia, I saw this building with it’s duel pride flags. Two pride flags on the railing of a balcony. by Aaron Jorbin is licensed under CC-CC0 1.0 Staged Photos Two of the photos are ones I set up. The first features my rainbow sunglasses where I tried to get only the sunglasses in focus and the second is some rainbow candies. Rainbow mirrored sunglasses sitting on the ground by Aaron Jorbin is licensed under CC-CC0 1.0 A pile of rainbow flag sugar coated candies on a piece of wood with a white background. by Aaron Jorbin is licensed under CC-CC0 1.0 Like this:Like Loading… Photos GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: An Open Letter to New WordPress Committers Next: My July in WordPress→'
