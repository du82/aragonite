["https://aaron.jorb.in/my-april-in-wordpress"]
title = "My April in WordPress - Aaron Jorbin"
description = "April was a month where I focused on the maintenance and security releases for WordPress. The month for WordPress started with the release of 6.5, but for me the month began as one of the leads working to release 6.5.1 6.5.2 on 9 April. This release wouldn’t have happened without several other amazing contributors. Getting […]"
full_description = '''My April in WordPress Apr 30, 2024 — Code April was a month where I focused on the maintenance and security releases for WordPress. The month for WordPress started with the release of 6.5, but for me the month began as one of the leads working to release 6.5.1 6.5.2 on 9 April. This release wouldn’t have happened without several other amazing contributors. Getting many versions of WordPress released at once can be a challenge. In this case, folks started at about 11pm the night before, I joined in at 8am, and the post announcing the release was published at 5pm. One of the fun parts about working on open source is that I can work from anywhere. In April I took that to mean I could work from a pool and committed code while most of my body was in the pool. My dream remains to commit code from a hot air balloon. I don't have a floaty, so it's a bit more like this pic.twitter.com/8pA0LnjFOD— Aaron Jorbin (@aaronjorbin) April 4, 2024 Next week, WordPress 6.5.3 is scheduled to be released. A number of contributors (What is the number? No idea, I have to work on adding them up still) have helped get the next maintenance release ready. After 6.5.3, my plan is to focus on documentation and some build related tools. I would like to get https://core.trac.wordpress.org/ticket/60966 finished up in order to help make maintenance and security releases easier. By the numbers During the month of April, I contributed to 59 tickets on trac, made 5 commits to core, received 42 props, ran 5 bug scrubs, and worked approximately 105 hours on WordPress, of which my sponsors paid for slightly less than 17 and I donated the rest. I had 13 sponsors this month: JeffMatson, jeffpaul, philipjohn, zstepek, kkoppenhaver, mamaduka, kingkool68, austinginder, adamsilverstein, felixarntz, Emilia-Capital, desrosj and one who wishs to remain anonymous. Thank you for believing in and supporting my contributions to Open Source. Previous: March 2024, February 2024, January 2024, December 2023, November 2023 Like this:Like Loading… My Month In WordPress open source software WordPress GET AARON IN YOUR INBOX Type your email… Subscribe Comments One response to “My April in WordPress” Mentions 💬 jorbin Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: My March in WordPress Next: A few random stats related to WordPress commits→'''
