title = "My August in WordPress - Aaron Jorbin"
description = "During August, I focused my contributions on the bootstrap/load component. I was able to close 6 tickets and move more towards a resolution. My goal in September is to continue this work. Another goal in August was working on a couple of long-standing issues. None of these three are finished, but each has moved closer […]"
full_description = 'My August in WordPress Sep 3, 2024 — Code During August, I focused my contributions on the bootstrap/load component. I was able to close 6 tickets and move more towards a resolution. My goal in September is to continue this work. Another goal in August was working on a couple of long-standing issues. None of these three are finished, but each has moved closer to completion and I’m still hopeful that I also spent a lot of time working on my upcoming WordCamp US talk with Jonathan Desrosiers entitled “Releasing a Version of WordPress in 8 Hours or Less” where we are going to be doing a deep dive into WordPress 6.4.1. I’m excited to explore this aspect of release management with everyone in attendance. During August, I also contributed to the upcoming 6.6.2 release in bug scrubs. That will be coming out in the coming weeks and I’m looking forward to helping make it a successful release. With 6.6.2 coming out soon, WordPress 6.7 beta 1 in early October, and WordCamp US this month, September should be a busy time but I am going to continue my work to give the Bootstrap/Load component some love and otherwise help the project in any way I can. By the numbers During the month of August, I contributed to 49 tickets on trac, made 2 commits to core, received 5 props, reviewed 1 make/core post, did one call with WordPress Youtubers, updated some documentation for contributors, and worked approximately 42 hours on WordPress, of which my sponsors paid for just over 19 hours and I donated the rest. I had 19 sponsors this month: Jeff Matson, Jeffrey Paul, philipjohn, Zach Stepek, Keanan Koppenhaver, George Mamadashvili, Russell Heimlich , Austin Ginder, Adam Silverstein, Felix Arntz, Emilia-Capital, Jonathan Desrosiers, Brian Coords, mklute101, Emily Rapport, mattreport, annezazu, Tim Nash and one who wishes to remain anonymous. Thank you for believing in and supporting my contributions to Open Source. Previous: July 2024, June 2024, May 2024, April 2024, March 