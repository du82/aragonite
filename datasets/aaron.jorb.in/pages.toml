title = "Polyhistoric Archives - Aaron Jorbin"
full_description = "Category: Polyhistoric Who I cheer for when watching a baseball game Oct 10, 2024 — Polyhistoric I’ve honed this list over the last forty or so years and 15 stadiums. It changes, but not often. The Cleveland baseball team has moved up. The Atlanta one down. The Astros down. The Mets and Nats are both additions based on living in thier cities. Aaron’s Axioms Mar 1, 2024 — Polyhistoric As a big fan of Akin’s rules for spacecraft design, so big that I adopted them for website builders, I think a good Axiom can help you when you need some sort of insporation for how to make a decision. These are the things that I come back to and say over and over again. Titles of drafts I just deleted Feb 29, 2024 — Polyhistoric Happy Delete Your Drafts Day! I’m calling it a success since I started with 141 drafts and through a combination of deleting, publishing, and Here are some of the drafts I deleted. Guide to attending a zoom funeral Feb 28, 2024 — Polyhistoric I’ve now attended my five zoom funerals which is 5 more than I want. They suck. I have found a few things to make them a bit easier. Don’t treat them like a meeting on your calendar. It might be scheduled for an hour, but give yourself time before and after. Give yourself time before… Quotes from Drafts I’m deleting Feb 28, 2024 — Polyhistoric Delete Your Drafts Day is Tomorrow! So I’m going through and trying to find things I want to finish. While I will publish some of them, some have already entered the trash. Here are some quotes from drafts I’m deleting: Cycling contributors is something that I would consider a good thing. WordPress needs new opinions,… Leap Day is Delete Your Drafts Day Feb 6, 2024 — Polyhistoric In December of 2019, shared 10 posts I didn’t publish over the last decade. It was my way of accepting that good ideas aren’t always right for execution. It also inspired Jeremy to do the same and Kelly tried but instead wrote a different post. I want to bring that back and Leap Day feels… Four Short Things – 1 February 2024 Feb 1, 2024 — Polyhistoric The featured image is based on the prompt Please create a square logo for a series entitled “Four Short Things” that is busy and includes a wide variety of icons. It should include the specific text “Four Short Things” used on ChatGPT 4. Office Mandates Have No Effect Or at least no positive one as this short video… What it means to be polyhistoric Jan 26, 2024 — Polyhistoric In a world teeming with specialization, the term ‘polyhistoric’ seems almost anachronistic. Yet, my tagline is “Polyhistoric Man of the Web.” But what exactly does it mean to be polyhistoric? At its core, being polyhistoric refers to my ability to master and integrate knowledge from multiple fields. I consider it a blend of curiosity, intellect,… Four Short Things – 24 January 2024 Jan 24, 2024 — Polyhistoric The featured image is based on the prompt A logo for a series called “Four short things” that looks like it was designed in the bauhaus used on Firefly. I am pretty ok with this one, but I don’t think Mies would be. The Model Solving Geometry Problems at the Level of a Math Olympiad Gold Medalist AlphaGeomatry… Feeds I subscribe to as of 23 January 2024 Jan 23, 2024 — Polyhistoric I’ve been using Feedly more this year as an act of Human Curation. These are in no particular order. It’s most code and tech-related things, but it also includes my college newspaper, Foreign Policy Magazine’s coverage of the UN, and my favorite sources for both Coffee and Beer. If you don’t see your self listed… Next Page→"
