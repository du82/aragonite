["https://aaron.jorb.in/my-june-in-wordpress"]
title = "My June in WordPress - Aaron Jorbin"
description = "This post is coming a few days earlier than normal, but I’m planning to take off most of the next two weeks for some R&R. During June, my primary focus was on WordCamp Europe and the release of both 6.5.4 and 6.5.5. Doing two releases meant that my hours went way up compared to May. […]"
full_description = 'My June in WordPress Jun 28, 2024 — Code This post is coming a few days earlier than normal, but I’m planning to take off most of the next two weeks for some R&R. During June, my primary focus was on WordCamp Europe and the release of both 6.5.4 and 6.5.5. Doing two releases meant that my hours went way up compared to May. Just before the release, I opened sourced a tool that I’ve been using to generate the list of contributors in the release announcement posts for minor releases. Most of the work for 6.5.4 was done in May however I still needed to get the release out the door. This was a quick release party (It usually is when we have only one version) and there were no surprises. After that release, I took a bit of time off before heading to Turin where my first few days were mostly focused on reconnecting with old friends and less on WordPress. The first large piece of work I did was attending the Scale Consortium event where I was able to chat with folks about challenges they are facing in WordPress. At contributor day I was immediately pulled into a couple of good conversations on the ways to improve the contribution process and the work that the core team does. One of these lead to some work I did to increase access rights on WordPress trac and a proposal to add some additional committers. I also drafted a really fun commit message 🤓. After the camp, I got a chance to spend time with a few friends but started trying to ensure that 6.5.5 could get out in a rather short period of time. With people working around the globe, I tried to keep the conversation moving as quickly as feasible. It was a slog trying to get fixes out for three security vulnerabilities. I worked until about 3 am one night and on my travel day from Turin to Valencia I was working basically anytime I could get decent wifi. The day of the release was about a twelve-hour day as I helped with every step along the way. Following up on the release has also taken a lot of hours of work. Last month I applied for a grant from the Open Tech Fund. Today I found out my application was dismissed and I was not invited to submit a full proposal. Between this and seeing how little I am getting in sponsorship, I’m questioning how valuable my work is and If I should instead look to do something else. Either I’m doing a bad job of explaining the value or there isn’t value in bug fixes and patching security holes. Or both. By the numbers During the month of June, I contributed to 47 tickets on trac, made 10 commits to core, received 45 props, ran 2 release parties, drafted a paragraph of a dev note, updated some documentation for committers, reviewed one other dev note, released 26 versions of WordPress and worked approximately 134 hours on WordPress, of which my sponsors paid for almost 18 hours and I donated the rest. If we assume my sponsors paid for everything, I made $19.74 an hour this month. I had 15 sponsors this month: JeffMatson, jeffpaul, philipjohn, zstepek, kkoppenhaver, mamaduka, kingkool68, austinginder, adamsilverstein, felixarntz, Emilia-Capital, desrosj, bacoords, mklute101 and one who wishes to remain anonymous. Thank you for believing in and supporting my contributions to Open Source. Previous: May 2024, April 2024, March 2024, February 2024, January 2024, December 2023, November 2023 Like this:Like Loading… My Month In WordPress open source software WordPress GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: A script for generating links to WordPress profiles Next: An introduction to Git Bisect→'
