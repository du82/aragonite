full_description = "Category: Art Nunca quería decir “DeBÍ TiRAR MáS FOToS” Jan 14, 2025 — Art Like most of the world, the new Bad Bunny album has been on repeat for me. But what makes it more special is that I’m living in Puerto Rico for this, living where I can experience “Otro sunset bonito que veo en San Juan”. In the spirit of the love for PR that Benito shares,… Flights 2024 playlist Dec 27, 2024 — Art For the past few years, I’ve made a flights playlist every year. It’s the playlist I listen to at the start of every flight I take with the rules being that I add a new song every flight segment. I took 24 flight segments this year visiting a total of 18 airports. Four segments involved… I Love Building Software Oct 4, 2024 — Art I love building software that lets people speak, sell, do as they please. Everyone gets a voice, a product, or a protest. Freedoms, four of them, all boxed up in neat little binaries. I love building software that tosses a bunch of strangers into one room and watches the sparks fly. Debates, disagreements, and, if… Pride Photos I’ve released to the commons Jul 25, 2024 — Art Some links in this post are affiliate links. Clicking them and buying will benefit me. During June as a celebration of Pride Month, LGBTQ+PRESS ran a Share Your Pride Photo Drive and I was honored to be one of the top contributors. I submitted a total of 12 rainbow/pride-related photos which are now all available… When I was fucking a Lot of Men By Paula Harris Mar 2, 2024 — Art that stupid thing that people say that sounds deep and smart and uplifting, you have to love yourself before anyone else can love you, they’re wrong, some of us need someone else to love us to show us that we can be loved, to teach us how to love ourselves by letting us copy them,… The story behind my #wpkeralaphotos runner up photo Feb 14, 2024 — Art Driving on a mountain road towards a coffee farm over the weekend, I received exciting news: the Kerala WordPress Photo Festival had selected one of my submissions as a runner-up. The chosen photo marked the first occasion I had used my tripod, so it’s a special one to me. This photo was taken along the… The Album I Kept Coming Back to in 2023 Feb 9, 2024 — Art In a review by NME, this album was described as “…the blueprint for any alt-leaning electronic act in the pop space.” That’s a promising intro to an artist who helped define the alt-leaning electronic scene nearly 30 years ago with a song that peaked at number 2 on the Billboard hot 100. Everything but the… Grammy Winner Playlist Feb 5, 2024 — Art Lots of the Grammy’s are in categories I don’t normally listen to. In pursuit of the everpresent goal of expanding my listening, here is a playlist with the winners of nearly all the music-related winners with the exceptions of Christian music and classical. Nearly 30 hours of music in total. https://music.apple.com/us/playlist/66th-grammy-winners/pl.u-J7a3TDroyBD Art I’ve made so far this year Feb 2, 2024 — Art I think the art that I am most proud of is Variations on A Theme – Island Verde, the four-part series I shared earlier this month, but there is other work I did as well that I’m happy with. Like most of my art, this is a mixed bag of digital and analog and something… 1994 has an argument to be one of the greatest years in music history Jan 24, 2024 — Art I saw this article on NME about all the albums turning 30 this year and realized that they include some absolute bangers. While the album is only OK, Coolio’s Fantastic Voyage is a 1994 song that gets me moving whenever I hear it. Next Page→"
