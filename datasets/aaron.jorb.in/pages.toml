title = "My October in WordPress - Aaron Jorbin"
description = "This post is coming a bit later than normal since I was heads-down building a WordPress site for most of October into November. At WordCamp Europe earlier this year, Matt stated that “Everyone developing and making decisions for software needs to use it.” and this is something I completely agree with. While I work on […]"
full_description = 'My October in WordPress Nov 20, 2024 — Code This post is coming a bit later than normal since I was heads-down building a WordPress site for most of October into November. At WordCamp Europe earlier this year, Matt stated that “Everyone developing and making decisions for software needs to use it.” and this is something I completely agree with. While I work on this site, help my partner with her site, and work on a site for a nonprofit Model United Nations conference I am on the board of, this was the first time I did an enterprise-level build from scratch in a little while. I need to write up some notes from the experience, but overall it showed me that Full Site Editing is extremely powerful and ready for prime time, while also demonstrating there are hard edges that need to be smoothed out. While my coding time was largely focused on that site, I still made time to contribute to WordPress with my focus on supporting the 6.7 launch. Both core tech leads work (and live) on APAC time so there was a need for someone to help out with the release candidates while they slept. My November is going to be a light month since I took a bit of time to relax after working way too many hours on the site I was building and will be spending the rest of the month volunteering by educating college students about international relations. By the numbers During the month of October, I contributed to 53 tickets on trac, made 9 commits to core, received 7 props, reviewed 2 news posts, served as the committer for two release candidates, and worked approximately 30 hours on WordPress, of which my sponsors paid for just over 27.5 hours and I donated the rest. I had 19 sponsors this month: Jeff Matson, Jeffrey Paul, philipjohn, Zach Stepek, Keanan Koppenhaver, George Mamadashvili, Russell Heimlich , Austin Ginder, Adam Silverstein, Felix Arntz, Emilia-Capital, Jonathan Desrosiers, Brian Coords, mklute101, Emily Rapport, Tim Nash, Jens De Beule, Jay Hoppie, and one who wishes to remain anonymous. Thank you for believing in and supporting my contributions to Open Source. Previous: September 2024, August 2024, July 2024, June 2024, May 2024, April 2024, March 2024, February 2024, January 2024, December 2023, November 2023 Like this:Like Loading… My Month In WordPress open source software WordPress GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: Who I cheer for when watching a baseball game Next: Flights 2024 playlist→'
