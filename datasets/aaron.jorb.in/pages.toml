title = "My Month In WordPress Archives - Aaron Jorbin"
full_description = "Tag: My Month In WordPress My January in WordPress Feb 3, 2025 — Code My January in WordPress was focused on getting 6.7.2 ready to be released. This has involved organizing multiple bug scrubs, reviewing code to ensure it is ready, and some wrangling to ensure the right people looked at code. I did some checking and January 2025 featured the same number of people committing as January 2024.… My 2024 in WordPress Jan 7, 2025 — Code Oh what a year it’s been. 2024 was the year where I was sponsored by members of the community. This isn’t an easy task and I am not even hitting 50% of my goal which is what would allow for this to be sustainable. Unless I am able to double the sponsorship, I am afraid… My October in WordPress Nov 20, 2024 — Code This post is coming a bit later than normal since I was heads-down building a WordPress site for most of October into November. At WordCamp Europe earlier this year, Matt stated that “Everyone developing and making decisions for software needs to use it.” and this is something I completely agree with. While I work on… My September in WordPress Oct 1, 2024 — Code The highlight for my September in WordPress was the opportunity to speak at WordCamp US with Jonathan Desrosiers. We gave a presentation entitled “Releasing a Version of WordPress in 8 Hours or Less” where we did a deep dive into WordPress 6.4.1 and explored what goes into releasing WordPress. The talk was well received. And… My August in WordPress Sep 3, 2024 — Code During August, I focused my contributions on the bootstrap/load component. I was able to close 6 tickets and move more towards a resolution. My goal in September is to continue this work. Another goal in August was working on a couple of long-standing issues. None of these three are finished, but each has moved closer… My July in WordPress Aug 1, 2024 — Code I did a lot less in July and it was necessary. After steering two minor releases in June, I took a two-week break for some much-needed rest and relaxation. I am going to need to post some photos from them soon. And then in a horrible bit of timing, I got sick the night before… My June in WordPress Jun 28, 2024 — Code This post is coming a few days earlier than normal, but I’m planning to take off most of the next two weeks for some R&R. During June, my primary focus was on WordCamp Europe and the release of both 6.5.4 and 6.5.5. Doing two releases meant that my hours went way up compared to May.… My May in WordPress Jun 3, 2024 — Code During May, my primary focus was on the release of 6.5.3 and the discussions that led up to the decision to do the upcoming release of 6.5.4. It’s also a month that I have taken some time off to celebrate my birthday (which Pascal celebrated in a commit message, the third time one committer wished… My April in WordPress Apr 30, 2024 — Code April was a month where I focused on the maintenance and security releases for WordPress. The month for WordPress started with the release of 6.5, but for me the month began as one of the leads working to release 6.5.1 6.5.2 on 9 April. This release wouldn’t have happened without several other amazing contributors. Getting… My March in WordPress Apr 1, 2024 — Code March was a month where the majority of my focus was on helping drive 6.5 to completion. This has meant many long conversations with the overwhelming majority of it focused on the location of the fonts on the file system. It took a lot of time from a lot of people, but ultimately we were… Next Page→"
