full_description = '''Three Years as a WordPress Committer Sep 29, 2017 — Code Three years ago today, I changed three lines of code in WordPress and did it without someone else signing off. In fact, I didn't write the code that went into WordPress that day. I've not been a high volume committer in my three years ( I've made 283 total commits), but I have had the pleasure of working on user-facing features such as Shiny Updates for plugins and "Logout everywhere" along with helping to maintin multiple underlying components. I also had the honor of being a deputy release lead for WordPress 4.7. Here's to three years of helping to democratize publishing 🍻 Like this:Like Loading… gutenbergChallange GET AARON IN YOUR INBOX Type your email… Subscribe Comments 2 responses to “Three Years as a WordPress Committer” Five lessons from Eight Years as a WordPress Core Committer – Aaron Jorbin February 24, 2023 […] previously blogged three years and seven years as a […] Reply jorbin September 29, 2023 Today marks nine years since my first commit to WordPress Core. In that time I’ve made 406 commits which puts me 26th in the list of most commits. The majority of the commits came in the first few years (I had 283 on my third commitiversary). I’ve settled into a role where I try to […] Reply Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: Typography V