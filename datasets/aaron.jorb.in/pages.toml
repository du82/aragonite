title = "My 2024 in WordPress - Aaron Jorbin"
description = "Oh what a year it’s been. 2024 was the year where I was sponsored by members of the community. This isn’t an easy task and I am not even hitting 50% of my goal which is what would allow for this to be sustainable. Unless I am able to double the sponsorship, I am afraid […]"
full_description = 'My 2024 in WordPress Jan 7, 2025 — Code Oh what a year it’s been. 2024 was the year where I was sponsored by members of the community. This isn’t an easy task and I am not even hitting 50% of my goal which is what would allow for this to be sustainable. Unless I am able to double the sponsorship, I am afraid this won’t last and I will need to find a full-time job instead. The highlight for me is knowing that millions of websites are more secure. WordPress as an ecosystem is successful in large part because of the stability of the core software. It’s something that people can extend to make their own. I’m happy to have played a role in 2024 and hope to continue playing a role in the success of web publishing. 2024 Contributions by the Numbers Contributed to 334 tickets Made 131 commits to core Propped on 186 commits by others Published 5 articles to wordpress.org/news Spoke at WCUS about WordPress 6.4.1 Led five minor releases of WordPress including all three security releases and mentored the team responsible for two other minor releases Published 10 “This Month in WordPress” updates where I outlined my work Added 35 photos to the Photo Directory Runner up in the #wpkeralaphotos photo contest A Top Contributor to the LGBTQ+PRESS Share Your Pride Photo Drive Thank you to my sponsors Thank you to JeffMatson, jeffpaul, philipjohn, zstepek, kkoppenhaver, mamaduka, kingkool68, austinginder, adamsilverstein, felixarntz, Emilia-Capital, desrosj, bacoords, mklute101, Emily Rapport, mattreport, annezazu, Tim Nash, Jens De Beule, Jay Hoppie, and two people who wish to remain anonymous for supporting me. I also received support from the WordPress Community Collective for my contributions at WordCamp US Contributor Day. Like this:Like Loading… My Month In WordPress open source software WordPress GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment *