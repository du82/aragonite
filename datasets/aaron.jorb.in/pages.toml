["https://aaron.jorb.in/my-january-in-wordpress"]
title = "My January in WordPress - Aaron Jorbin"
description = "GitHub has a 60-day waiting period before it issues payment to folks like me. Since I started collecting sponsors on 22 November, this meant I needed to wait until this month to start collecting. But I did get my first check so I am officially paid for my contributions to WordPress. My primary focus for January […]"
full_description = 'My January in WordPress Jan 31, 2024 — Code GitHub has a 60-day waiting period before it issues payment to folks like me. Since I started collecting sponsors on 22 November, this meant I needed to wait until this month to start collecting. But I did get my first check so I am officially paid for my contributions to WordPress. My primary focus for January was on WordPress 6.4.3 which was released yesterday. This was the fourth consecutive minor release that I was a lead for, but since this also included many other minor releases, I guess I’ve led the last 55 minor releases? Other non-code highlights included helping with a new action to collect contributions on Git Hub and ensure people are given credit, a chrome extension for WordPress bug gardening, and some handbook edits (including collaborating on a new page related to props). I also ran two bug scrubs for 6.4.3 and just submitted a plugin to the WordPress repo to force using PclZip as a workaround to a bug some folks are facing with 6.4.3. By the numbers During the month of January, I contributed to 57 tickets on trac, made 59 commits to core, received 12 props, and worked approximately 112 hours on WordPress, of which my sponsors paid for slightly less than 10 and I donated the rest. I had 11 sponsors this month: JeffMatson, jeffpaul, philipjohn, zstepek, kkoppenhaver, mamaduka, kingkool68, austinginder, and two who wish to remain anonymous. Thank you for believing in and supporting my contributions to Open Source. Previous: December 2023, November 2023 Like this:Like Loading… My Month In WordPress open source software WordPress GET AARON IN YOUR INBOX Type your email… Subscribe Comments 4 responses to “My January in WordPress” Mentions 💬 jorbin 💬 jorbin 💬 jorbin 💬 jorbin Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of fo