["https://aaron.jorb.in/tag/wordpress"]
title = "WordPress Archives - Aaron Jorbin"
full_description = "Tag: WordPress 15 years of my code in WordPress Feb 27, 2025 — Code I normally celebrate my commitiversary, the anniversary of the day I made my first commit to WordPress, but right now I am instead celebrating my propsevarsary since it’s a fun one, it’s 15 years of my code being a part of WordPress core. One of the greatest things about open source is that contributions come in many… My January in WordPress Feb 3, 2025 — Code My January in WordPress was focused on getting 6.7.2 ready to be released. This has involved organizing multiple bug scrubs, reviewing code to ensure it is ready, and some wrangling to ensure the right people looked at code. I did some checking and January 2025 featured the same number of people committing as January 2024.… My 2024 in WordPress Jan 7, 2025 — Code Oh what a year it’s been. 2024 was the year where I was sponsored by members of the community. This isn’t an easy task and I am not even hitting 50% of my goal which is what would allow for this to be sustainable. Unless I am able to double the sponsorship, I am afraid… My October in WordPress Nov 20, 2024 — Code This post is coming a bit later than normal since I was heads-down building a WordPress site for most of October into November. At WordCamp Europe earlier this year, Matt stated that “Everyone developing and making decisions for software needs to use it.” and this is something I completely agree with. While I work on… I Love Building Software Oct 4, 2024 — Art I love building software that lets people speak, sell, do as they please. Everyone gets a voice, a product, or a protest. Freedoms, four of them, all boxed up in neat little binaries. I love building software that tosses a bunch of strangers into one room and watches the sparks fly. Debates, disagreements, and, if… My September in WordPress Oct 1, 2024 — Code The highlight for my September in WordPress was the opportunity to speak at WordCamp US with Jonathan Desrosiers. We gave a presentation entitled “Releasing a Version of WordPress in 8 Hours or Less” where we did a deep dive into WordPress 6.4.1 and explored what goes into releasing WordPress. The talk was well received. And… 10th Commitiversary Sep 30, 2024 — Code commitiversary(noun)com·​mit·i·​ver·​sa·​ry kə-ˈmit-ə-vərs-rē Ten years ago yesterday I took some code that someone suggested belonged in WordPress and made the decision that it belonged in WordPress. This wasn’t a change to the actual distributed code of WordPress but was a change that affected the builders of WordPress. Since that time, I’ve made 538 additional commits. Here… My Core Contribution Workflow Sep 18, 2024 — Code At WordCamp US, we had an informal meetup for all of the committers (There were over 20 of us in a circle round shape!) and one of the things that we discussed was that everyone has a slightly different workflow but discovering your own workflow can be a burden, especially for newer contributors. So this… My August in WordPress Sep 3, 2024 — Code During August, I focused my contributions on the bootstrap/load component. I was able to close 6 tickets and move more towards a resolution. My goal in September is to continue this work. Another goal in August was working on a couple of long-standing issues. None of these three are finished, but each has moved closer… Year-based Category Archives Aug 19, 2024 — Code Sometimes you want a page that is one year of posts for a specific category. For example, maybe you want to know about the code I shared in 2015 or Art I was making in 2018. Out of the box, WordPress doesn’t support URLs like this. So I wrote a snippet that adds URLs that… Next Page→"
