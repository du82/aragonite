["https://aaron.jorb.in/my-january-in-wordpress-2"]
title = "My January in WordPress - Aaron Jorbin"
description = "My January in WordPress was focused on getting 6.7.2 ready to be released. This has involved organizing multiple bug scrubs, reviewing code to ensure it is ready, and some wrangling to ensure the right people looked at code. I did some checking and January 2025 featured the same number of people committing as January 2024. […]"
full_description = 'My January in WordPress Feb 3, 2025 — Code My January in WordPress was focused on getting 6.7.2 ready to be released. This has involved organizing multiple bug scrubs, reviewing code to ensure it is ready, and some wrangling to ensure the right people looked at code. I did some checking and January 2025 featured the same number of people committing as January 2024. It’s great to see that there are still many folks who want to show up to do the work for the users of WordPress because ultimately that’s who we all work to help. We fix bugs so that the people who want to publish content can do so. Features are added with the idea that it will make it a bit easier or a bit more powerful. And it’s given away for free. The free to users is a large part of what has enabled some companies to get really big. It’s my hope that some of these large companies want to see the bugs continue to go down and the features to continue to go up. So I am once again asking for them to support me and other core committers. If you think my work isn’t helping you, that’s ok. I would instead encourage you to support the work of Tammie Lister who is the 6.8 design lead. By the numbers During the month of January, I contributed to 41 tickets on trac, made 6 commits to core, received 10 props, wrote 1 make/core post, participated in one call related to a potential new feature, and ran three bug scrubs. I had 20 sponsors this month: Jeff Matson, Jeffrey Paul, philipjohn, Zach Stepek, Keanan Koppenhaver, George Mamadashvili, Russell Heimlich , Austin Ginder, Adam Silverstein, Felix Arntz, Jonathan Desrosiers, Brian Coords, mklute101, Emily Rapport, Tim Nash, Jens De Beule, Jay Hoppie, Dan Knauss, Weston Ruter, and one who wishes to remain anonymous. Thank you for believing in and supporting my contributions to Open Source. Previous: 2024 as a whole, October 2024, September 2024, August 2024, July 2024, June 2024, May 2024, April 2024, March 2024, February 2024, January 2024, December 2023, November 2023 Like this:Like Loading… My Month In WordPress open source software WordPress GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: Nunca quería decir “DeBÍ TiRAR MáS FOToS” Next: 15 years of my code in WordPress→'
