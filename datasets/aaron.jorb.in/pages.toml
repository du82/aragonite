["https://aaron.jorb.in/art-ive-made-so-far-this-year"]
title = "Art I’ve made so far this year - Aaron Jorbin"
description = "I think the art that I am most proud of is Variations on A Theme – Island Verde, the four-part series I shared earlier this month, but there is other work I did as well that I’m happy with. Like most of my art, this is a mixed bag of digital and analog and something […]"
full_description = 'Art I’ve made so far this year Feb 2, 2024 — Art I think the art that I am most proud of is Variations on A Theme – Island Verde, the four-part series I shared earlier this month, but there is other work I did as well that I’m happy with. Fully digital Semi Digital / Semi Analog Nearly all analog Basically just digital Like most of my art, this is a mixed bag of digital and analog and something in between. It’s fun working at this intersection since this is the intersection of yesterday. Today it’s more about the modeled reactions that LLM/AI/Algorithmic Decisions have vs the ones humans haven’t ceded. But for art, I like holding back to the questions of before for the sole reason that I can. This Variation on a Theme is based off an embrace I viewed from the beach a few miles from the first one. It’s got digital and analogue elements, though I will say the most analog painting of the bunch is one I am not happy with. I hate the clouds but I haven’t fixed it yet. Unsure if I’ll come back to do so. Looking at a pinnaple with desire Am Yisrael Chai Two more autobiographical pieces. The first is completely digital and based off my desire to eat the pinnaple that wasn’t ripe enough. The third is a mixed media as I start wearing my grandfather’s Chai. First take A second take, for the gram The ultimate outcome. More analogue than digital This mixed media series feels like things that could be fun prints for a poster. Less art, more design. There was a dog on the plane and so I sketched it A watercolor sketch of some beers First beach sketch of PR The embrace that inspired more art Like this:Like Loading… Photos watercolor GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by 