["https://aaron.jorb.in/my-july-in-wordpress"]
title = "My July in WordPress - Aaron Jorbin"
description = "I did a lot less in July and it was necessary. After steering two minor releases in June, I took a two-week break for some much-needed rest and relaxation. I am going to need to post some photos from them soon. And then in a horrible bit of timing, I got sick the night before […]"
full_description = 'My July in WordPress Aug 1, 2024 — Code I did a lot less in July and it was necessary. After steering two minor releases in June, I took a two-week break for some much-needed rest and relaxation. I am going to need to post some photos from them soon. And then in a horrible bit of timing, I got sick the night before a 9-hour transatlantic flight. It took a lot of time to recover (I’m only now getting back to 100%) and I had to take it easy but I did make some meaningful contributions to WordPress this month. My first bit of contribution for the month was to help with WordPress 6.6.1. It’s nice to say help instead of lead especially since this was a quick follow-up release. Tonya did a great job as the lead. The work I did to improve the documentation proved helpful (though there is still room for improvement). Jonathan Desrosiers took the lead and I have been his second for some efforts to Align the Committer-Level Access Across the Code Base. I supported this with proofreading, helping update some documentation, and was planning to host a working session for the new committers to assist them with svn and the act of committing but sadly we picked a time no one could attend (so we’ll reschedule). I also wrote an open letter to welcome and hopefully help the new committers. My priority for next month is going to be on driving some tickets to completion and doing a full scrub of the bootstrap/load component (Currently 68 open tickets). My current thinking on tickets I want to get finished are 58905, 61694, and 61330. I’m open to alternative ideas of tickets though, so comment below if you have one you think I should be focussing time on. For each of my sponsors, I promise to at least comment on the ticket. In some non-core related contributions, during June and the first few days in July I was tied with the most photos contributed for the Share Your Pride photo drive. A highlight of my R&R was taking a paella-making class. It was fun to learn to chop up a rabbit, the process of making paella, and its place in Valencian culture. That’s the inspiration for this month’s featured image. By the numbers During the month of July, I contributed to 19 tickets on trac, made 8 commits to core, received 28 props, reviewed 3 make/core posts, updated some documentation for committers, mentored 1 release of WordPress and worked approximately 31 hours on WordPress, of which my sponsors paid for almost 18 hours and I donated the rest. I had 16 sponsors this month: JeffMatson, jeffpaul, philipjohn, zstepek, kkoppenhaver, mamaduka, kingkool68, austinginder, adamsilverstein, felixarntz, Emilia-Capital, desrosj, bacoords, mklute101, Emily Rapport and one who wishes to remain anonymous. Thank you for believing in and supporting my contributions to Open Source. Previous: June 2024, May 2024, April 2024, March 2024, February 2024, January 2024, December 2023, November 2023 Like this:Like Loading… My Month In WordPress open source software WordPress GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: Pride Photos I’ve released to the commons Next: Year-based Category Archives→'
