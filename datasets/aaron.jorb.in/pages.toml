full_description = "Author: jorbin 15 years of my code in WordPress Feb 27, 2025 — Code I normally celebrate my commitiversary, the anniversary of the day I made my first commit to WordPress, but right now I am instead celebrating my propsevarsary since it’s a fun one, it’s 15 years of my code being a part of WordPress core. One of the greatest things about open source is that contributions come in many… My January in WordPress Feb 3, 2025 — Code My January in WordPress was focused on getting 6.7.2 ready to be released. This has involved organizing multiple bug scrubs, reviewing code to ensure it is ready, and some wrangling to ensure the right people looked at code. I did some checking and January 2025 featured the same number of people committing as January 2024.… Nunca quería decir “DeBÍ TiRAR MáS FOToS” Jan 14, 2025 — Art Like most of the world, the new Bad Bunny album has been on repeat for me. But what makes it more special is that I’m living in Puerto Rico for this, living where I can experience “Otro sunset bonito que veo en San Juan”. In the spirit of the love for PR that Benito shares,… My 2024 in WordPress Jan 7, 2025 — Code Oh what a year it’s been. 2024 was the year where I was sponsored by members of the community. This isn’t an easy task and I am not even hitting 50% of my goal which is what would allow for this to be sustainable. Unless I am able to double the sponsorship, I am afraid… Flights 2024 playlist Dec 27, 2024 — Art For the past few years, I’ve made a flights playlist every year. It’s the playlist I listen to at the start of every flight I take with the rules being that I add a new song every flight segment. I took 24 flight segments this year visiting a total of 18 airports. Four segments involved… My October in WordPress Nov 20, 2024 — Code This post is coming a bit later than normal since I was heads-down building a WordPress site for most of October into November. At WordCamp Europe earlier this year, Matt stated that “Everyone developing and making decisions for software needs to use it.” and this is something I completely agree with. While I work on… Who I cheer for when watching a baseball game Oct 10, 2024 — Polyhistoric I’ve honed this list over the last forty or so years and 15 stadiums. It changes, but not often. The Cleveland baseball team has moved up. The Atlanta one down. The Astros down. The Mets and Nats are both additions based on living in thier cities. I Love Building Software Oct 4, 2024 — Art I love building software that lets people speak, sell, do as they please. Everyone gets a voice, a product, or a protest. Freedoms, four of them, all boxed up in neat little binaries. I love building software that tosses a bunch of strangers into one room and watches the sparks fly. Debates, disagreements, and, if… My September in WordPress Oct 1, 2024 — Code The highlight for my September in WordPress was the opportunity to speak at WordCamp US with Jonathan Desrosiers. We gave a presentation entitled “Releasing a Version of WordPress in 8 Hours or Less” where we did a deep dive into WordPress 6.4.1 and explored what goes into releasing WordPress. The talk was well received. And… 10th Commitiversary Sep 30, 2024 — Code commitiversary(noun)com·​mit·i·​ver·​sa·​ry kə-ˈmit-ə-vərs-rē Ten years ago yesterday I took some code that someone suggested belonged in WordPress and made the decision that it belonged in WordPress. This wasn’t a change to the actual distributed code of WordPress but was a change that affected the builders of WordPress. Since that time, I’ve made 538 additional commits. Here… Next Page→"
