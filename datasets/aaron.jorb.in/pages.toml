description = "Sometimes you want a page that is one year of posts for a specific category. For example, maybe you want to know about the code I shared in 2015 or Art I was making in 2018. Out of the box, WordPress doesn’t support URLs like this. So I wrote a snippet that adds URLs that […]"
full_description = '''Year-based Category Archives Aug 19, 2024 — Code Sometimes you want a page that is one year of posts for a specific category. For example, maybe you want to know about the code I shared in 2015 or Art I was making in 2018. Out of the box, WordPress doesn’t support URLs like this. So I wrote a snippet that adds URLs that look like: /{year}/category/{category}/ /{year}/category/{category}/page/{page} Adding these two URL types involves calling add_rewrite_rule twice. Once for the version without a page and once for the version with it <?php add_action( 'init', function() { add_rewrite_rule( '([0-9]{4})/category/(.+?)/page/?([0-9]{1,})/?$', 'index.php?year=$matches[1]&category_name=$matches[2]&paged=$matches[3]', 'top' ); add_rewrite_rule( '([0-9]{4})/category/(.+?)/?$', 'index.php?year=$matches[1]&category_name=$matches[2]', 'top' ); } ); This code lives in an mu-plugin and all it takes is visiting /wp-admin/options-permalink.php to refresh the permalinks. Simple plugins like this are very demure. Very mindful. Like this:Like Loading… WordPress WordPress Plugins GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: My July in WordPress Next: My August in WordPress→'''
