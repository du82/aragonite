["https://aaron.jorb.in/aarons-axioms"]
title = "Aaron’s Axioms - Aaron Jorbin"
description = "As a big fan of Akin’s rules for spacecraft design, so big that I adopted them for website builders, I think a good Axiom can help you when you need some sort of insporation for how to make a decision. These are the things that I come back to and say over and over again."
full_description = 'Aaron’s Axioms Mar 1, 2024 — Polyhistoric As a big fan of Akin’s rules for spacecraft design, so big that I adopted them for website builders, I think a good Axiom can help you when you need some sort of insporation for how to make a decision. These are the things that I come back to and say over and over again. Clever solutions rarely are right. If it’s easy to change your mind later, it’s better to make a decision quick than get stuck making one. If at all possible, try not to do a data migration. Anything resembling a data migration is in fact a data migration no matter how much you try to believe otherwise. Real Leaders Say Thank You. If you can’t troll your friends, who can you troll? The easiest way to make a site faster is to get rid of ads; The hardest way to make a site faster is to get rid of ads. Be the best you, not the best someone else Future you will be happier if there is documentation. You will run git blame and find out that you are the idiot who wrote that line of code. You can’t do everything. Do a dry run; It’s better to learn when the pressure is low. Nothing is a substitute for experience, but talking through what could go wrong with someone who has it is close. Find your superpower. Like this:Like Loading… GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: My February in WordPress Next: When I was fucking a Lot of Men By Paula Harris→'
