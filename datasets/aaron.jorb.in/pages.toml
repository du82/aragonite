description = "Nine years ago, I spoke out against a WordPress core feature, arguing that it should be removed from Core. In February, I dedicated a significant amount of time to ensuring that WordPress Core included this feature for version 6.5. So, what led me to completely change my stance, making a full 360-degree turn? A new […]"
full_description = 'In the Presence of New Rationale, Good Maintainers Change Their Mind Often Mar 28, 2024 — Code Nine years ago, I spoke out against a WordPress core feature, arguing that it should be removed from Core. In February, I dedicated a significant amount of time to ensuring that WordPress Core included this feature for version 6.5. So, what led me to completely change my stance, making a full 360-degree turn? A new rationale. A Brief History of Site Icon in WordPress February of 2011 was when the ticket for a Site Icon was first opened. It didn’t receive any traction right away. Some dismissed this feature as being plugin territory, others pointed out that scaling images down could be problematic. But there still wasn’t any traction. When I go to WordCamps or meet business owners, most of them don’t even know the word favicon, but they know they want that image to be theirs, not a g or a globe or a blue e. Jen Mylo This comment helped get things moving for WordPress 3.4 but the next challenge was ico files. The .ico format was the only file format that Internet Explorer supported for favicons until IE 11. In 2012, the idea that a feature would be built without support for IE wasn’t something folks wanted to consider. A number of contributors, including Tom Auger, Brandon Dove, Nacin, Otto, Ocean90, and myself, explored libraries but ultimately nothing was ready and the feature was punted. It would be another three years before there was real traction. The best thing to happen in those three years is that the .ico format was no longer going to be a blocker. While it wouldn’t work for older versions of Internet Explorer, Konstantin Obenland picked things up and took ownership of the feature and added the first version during the 4.3 cycle. While bug fixes and improvements took place, Nick Halsey came in with a patch to move the feature to the Customizer. With the possibility of having this in two places, I stepped in to push towards retracting the options page version. After a bit of cleanup, WordPress shipped 4.3. Sites could have icons. It took a few years, but an important bit of site customization was in core. Site Icons in a Full Site Editing World Starting in WordPress 5.9, when a site uses a block theme, WordPress no longer includes the link to the Customizer in the wp-admin menu. This means that the ability to find the site icon is harder. There is a Site Logo block that can also manage the site icon (and includes a link to the customizer) but this feels awkward. Much like before, it took a little while to get some momentum. While not a good solution, it was still possible to manage the site icon. It just felt hidden and far from a smooth experience. Anne McCarthy messaged me early in during the 6.5 cycle to see if I would have any interest in working on this. It only took a couple of moments of thinking to realize that this was going to be a good use of my time. After a lot of back and forth and work from multiple individuals, especially Erik (kebbet), James Koster, Pascal Birchler, and Andrea Fercia, it was once again possible to manage your site icon from the options screen. New Rationale In this case, the new rationale wasn’t an explicit argument, it was a change in WordPress itself. But new rationale can come in many forms. It can be data, disproving assumptions, or technological advances. When WordPress 6.5 is released on April 2, head over to your site, visit /wp-admin/options-general.php and add a site icon if you don’t see one. If you want to support me working on features like this, I am looking for additional sponsors. Like this:Like Loading… WordPress GET AARON IN YOUR INBOX Type your email… Subscribe Comments 5 responses to “In the Presence of New Rationale, Good Maintainers Change Their Mind Often” Anne McCarthy March 28, 2024 Thanks for all your work in getting this in! Love hearing the history of this too. A history I didn’t know when I first messaged you, thinking you’d be the perfect person to navigate it in. Reply jorbin March 28, 2024 I didn’t even remember all of my involvement until after I had agreed to drive this. Thanks for the encouragement and your support along the way. Reply Felix Arntz March 28, 2024 The original site icon introduction was my first core props! I just did a tiny bit of testing, found and fixed a bug, and that got my user name included, and I was hooked from there <3 Thank you for giving this feature some new love after all these years! Reply jorbin March 28, 2024 I love that this feature is a part of both of our contributor stories Reply Could WordPress Use A New Logo? – The WP Minute March 29, 2024 […] Aaron Jorbin reminds us that good maintainers change their mind often. […] Reply Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: In Open Source, When You Align With a Project, You Align With it’s Values Next: My March in WordPress→'
