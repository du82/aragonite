["https://aaron.jorb.in/a-few-random-stats-related-to-wordpress-commits"]
title = "A few random stats related to WordPress commits - Aaron Jorbin"
description = "My friend Jonathan Desrosiers made his 2,000th commit to WordPress today and I thought I would pull to gether a couple of stats to celebrate him since he always enjoys random WordPress trivia like this. I have written bash one-liners for pulling commit stats before, so all of these are from similar one liners, sometimes […]"
full_description = '''A few random stats related to WordPress commits May 3, 2024 — Code My friend Jonathan Desrosiers made his 2,000th commit to WordPress today and I thought I would pull to gether a couple of stats to celebrate him since he always enjoys random WordPress trivia like this. I have written bash one-liners for pulling commit stats before, so all of these are from similar one liners, sometimes with a bit of additional help. Today I made my 2,000th commit to the @WordPress code base, giving a contributor props for the first time! As a committer, welcoming new contributors is so important to the future of the project. Thank you and congrats to Anamarija Papić (not on Twitter)! https://t.co/3U8ewkZgMa— Jonathan Desrosiers (@desrosj) May 3, 2024 So far there have been 103 accounts who have committed to WordPress core. Some of these are the same person with multiple accounts (hello saxmatt and matt) or bots (RIP bumpbot), so I think it’s about 98 but I didn’t try hard to add it up. Bash command for this svn log http://develop.svn.wordpress.org -r1:HEAD -v --xml | grep '<author.*/author>' | cut -d '>' -f 2 | cut -d '<' -f 1 | sort | uniq -c | sort -nr | wc -l This gets a log of all the commits, greps for the author XML tag and pulls out just the user name before sorting, counting and sorting based on the number. The final step counts the number of lines. Jonathan is the 6th person to have over 2000 commits. Ryan Boren remains number one at 9080 total (across two accounts) but Sergey Biryukov is closing in at 7709. At the rate of one commit a day, Sergey will overtake Ryan around February 3, 2028. 5 people have only committed to branches and 33 have only committed to trunk. Of the people who have committed to both, Aaron Campbell has the fewest percentage of commits to trunk (at 5.42% of this commits) and there is a tie at 99.82% for highest percentage of commits to trunk by Drew Jaynes and Scott Taylor. Data I used two commands to get this data. The only difference is that one used http://develop.svn.wordpress.org and the other used http://develop.svn.wordpress.org/trunk All of the data was added to a Google sheet and then a few small functions got me these percentages and counts. Congrats again to Jonathan! Here’s to another 2000 commits. Like this:Like Loading… GET AARON IN YOUR INBOX Type your email… Subscribe Comments One response to “A few random stats related to WordPress commits” Mentions 💬 Jeremy Felt Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: My April in WordPress Next: Hoppy Espresso Tonic→'''
