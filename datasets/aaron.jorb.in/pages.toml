["https://aaron.jorb.in/the-story-behind-my-wpkeralaphotos-runner-up-photo"]
title = "The story behind my #wpkeralaphotos runner up photo - Aaron Jorbin"
description = "Driving on a mountain road towards a coffee farm over the weekend, I received exciting news: the Kerala WordPress Photo Festival had selected one of my submissions as a runner-up. The chosen photo marked the first occasion I had used my tripod, so it’s a special one to me. This photo was taken along the […]"
full_description = 'The story behind my #wpkeralaphotos runner up photo Feb 14, 2024 — Art Driving on a mountain road towards a coffee farm over the weekend, I received exciting news: the Kerala WordPress Photo Festival had selected one of my submissions as a runner-up. The chosen photo marked the first occasion I had used my tripod, so it’s a special one to me. This photo was taken along the Bronx River in New York City. While the most densely populated city in the US is known more for man made beauty than nature, this little waterfall is a quick train ride away. The first time I saw it, I could tell that it would look better if I could capture it with a longer shutter speed. Upon my first visit, I immediately recognized its potential under a longer shutter speed. Thus, with a new Peak Design tripod in hand, I eagerly returned to this spot. It was a 60-degree fahrenheit day in October, perfect for carrying a backpack full of camera gear. Out of several attempts, a shot with a 0.8-second exposure at f/22 best captured the water’s essence. I wish I had an ND filter so that I could have used a lower f-stop, but I didn’t then and still don’t have one for my 16mm f/2.8. Photographing waterfalls, with their endless flow and stunning allure, always proves to be an exhilarating experience. The dynamic cascade of water, tumbling over rocks and into tranquil pools, offers a unique challenge to capture through the lens. It’s more than just taking photos; it’s about delving into the interplay of light, motion, and framing. Slow shutter speeds often enhance a waterfall’s beauty, turning each shot into a thrilling experiment. This photography journey also sparks adventure and exploration. Hidden waterfalls provide not only spectacular photo opportunities but also a deeper connection with nature. The trek to these waterfalls can be just as fulfilling as the photography itself, offering chances to spot wildlife, soak in serene landscapes, and ponder nature’s magnificence. This quest for the perfect photo frequently unveils new discoveries. Ultimately, photographing waterfalls is immensely rewarding, merging the art of photography with the excitement of discovery and a deep appreciation for the natural world. The photo is available free of charge and is CC0 licensed. It is available in the WordPress Photo Directory. Like this:Like Loading… Photos GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: The Album I Kept Coming Back to in 2023 Next: Creative Code Vs. Clever Code→'
