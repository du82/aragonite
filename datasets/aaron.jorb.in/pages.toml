["https://aaron.jorb.in/the-album-i-kept-coming-back-to-in-2023"]
title = "The Album I Kept Coming Back to in 2023 - Aaron Jorbin"
description = "In a review by NME, this album was described as “…the blueprint for any alt-leaning electronic act in the pop space.” That’s a promising intro to an artist who helped define the alt-leaning electronic scene nearly 30 years ago with a song that peaked at number 2 on the Billboard hot 100. Everything but the […]"
full_description = 'The Album I Kept Coming Back to in 2023 Feb 9, 2024 — Art In a review by NME, this album was described as “…the blueprint for any alt-leaning electronic act in the pop space.” That’s a promising intro to an artist who helped define the alt-leaning electronic scene nearly 30 years ago with a song that peaked at number 2 on the Billboard hot 100. Everything but the Girl’s album “Fuse” lived up to the hype and is the album I kept coming back to. After 24 years, the electronic pop duo returns with a moving, handsome album that tells a sophisticated story about recapturing innocence. Laura Snapes, Pitchfork The first time I listened to this album was in the Museum Ludwig in Cologne. Wandering through Max Ernst and Heinrich Hoerle while hearing “Have a drink, talk too loud / Be a fool in the crowd / But forgive yourself / Forgive yourself” makes it easier to be less critical of yourself when you are on your 40th birthday trip. The lyrics though are secondary to the power in Tracy Thorne’s voice. The now 61 year old sings in a way to inspire emotion and tell the story regardless of the words. And the music both colors the scene behind the story and fills in important plot pieces. Time and Time Again found me most recently as I sat near the end of a dark 7-hour bus ride through middle America. It’s melodic electronic bass leaves a clear sense of waiting and desire. As with the album that introduced the new, beat-driven EBTG to the world, 1996’s Walking Wounded, none of this ever feels like artists of a certain age glomming on to the latest trends. It is audibly made by people with a deep love for and understanding of the music they’re inspired by. Everything But the Girl: Fuse review – still staking out pop’s frontier after 40 years – The Guardian When You Mess Up is on my art making playlist and I don’t foresee it going anywhere. It’s absolutely an album I can imagine coming back to again even as the world moves to 2024. Like this:Like Loading… music GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: Three things that excite me about WordPress on 8 February 2024 Next: The story behind my #wpkeralaphotos runner up photo→'
