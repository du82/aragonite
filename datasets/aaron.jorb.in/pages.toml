description = "I presented an unconference session at the great WordCamp Portland and have cleaned up my backup script for WordPress (and really any db/single uploading/plugin/theme folder program). Comment here if you have any questions about how it works or suggestions for how to improve it. Like WordPress, it’s available under the GPL v2 #! /bin/sh # […]"
full_description = '''A Basic Database and Content Backup Script Sep 22, 2009 — Code I presented an unconference session at the great WordCamp Portland and have cleaned up my backup script for WordPress (and really any db/single uploading/plugin/theme folder program). Comment here if you have any questions about how it works or suggestions for how to improve it. Like WordPress, it’s available under the GPL v2 #! /bin/sh # config DBPASSWORD='password' DBTABLE='DB' DBUSER='user' CONTENTPATH='path/to/wp-content' DESTINATION='/destination/for/backups/' # end config DATE=`date +%Y.%m.%d.%k.%m | tr " " _` echo echo Licensed under the GPL version 2 http://www.gnu.org/licenses/gpl-2.0.html echo Copyright 2009 Aaron Jorbin https://aaron.jorb.in echo echo $DATE start backup with mysqldump mysqldump $DBTABLE --add-drop-table -h localhost -u $DBUSER --password=$DBPASSWORD --single-transaction > db.$DATE echo mysqldump done, gziping it tar cfz db.$DATE.tar.gz db.$DATE rm db.$DATE echo Database backup gzipped, Tarring up our WordPress folder tar cfz mu.$DATE.tar.gz -C / $CONTENTPATH echo copying files to backup folder mv db.$DATE.tar.gz $DESTINATION/ mv mu.$DATE.tar.gz $DESTINATION/ echo Cleaning Up #clean up files that are sitting there find $DESTINATION -type f -mtime +14 -exec rm {} ; echo Thank you for backing up WordPress. echo --- echo The Poetic Code echo Options, Comments, Posts and more echo Safer then before Like this:Like Loading… BASH GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permal