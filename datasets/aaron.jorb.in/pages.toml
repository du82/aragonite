description = "Like most of the world, the new Bad Bunny album has been on repeat for me. But what makes it more special is that I’m living in Puerto Rico for this, living where I can experience “Otro sunset bonito que veo en San Juan”. In the spirit of the love for PR that Benito shares, […]"
full_description = 'Nunca quería decir “DeBÍ TiRAR MáS FOToS” Jan 14, 2025 — Art Like most of the world, the new Bad Bunny album has been on repeat for me. But what makes it more special is that I’m living in Puerto Rico for this, living where I can experience “Otro sunset bonito que veo en San Juan”. In the spirit of the love for PR that Benito shares, here are some recent photos from my last week . Since I don’t want to be the one saying “I should have taken more photos”. Senadores de San Juan vs. los Cangrejeros de Santurce The playoffs for Liga de Béisbol Profesional Roberto Clemente are going on right now and game one for this rivalry was a fantastic experience. Cementerio Puerto Rico Memorial Located near the border of Carolina and San Juan, this was a great destination for some photos and then a nice 2.25-mile walk home. La Ruta del Lechón It’s hard to beat a Saturday when you head 30 minutes south of the city to eat pork. The Pork Highway is alive with dancing, drinking, and plenty of delicious food. Like this:Like Loading… Photos GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: My 2024 in WordPress Next: My January in WordPress→'
