["https://aaron.jorb.in/an-introduction-to-git-bisect"]
title = "An introduction to Git Bisect - Aaron Jorbin"
description = "Git Bisect is one of the most powerful features of git as it allows you to easily find the changeset where an issue was introduced. Instead of needing to check each change manually, you use a binary search to find the changeset. To get started, you are are going to need the following things: To […]"
full_description = 'An introduction to Git Bisect Jul 16, 2024 — Code Git Bisect is one of the most powerful features of git as it allows you to easily find the changeset where an issue was introduced. Instead of needing to check each change manually, you use a binary search to find the changeset. To get started, you are are going to need the following things: You need to have git installed and usable on the command line. you need to know the sha or a tag of a changeset where this was working to begin with. On GitHub, you can the full sha from the URL (see the image below) A way of testing to see if the code is good or bad, either a command to run an automated test or a manual method such as refreshing a browser. To start, you should go a known bad commit such as the the most recent one and run git bisect start followed by git bisect bad which tells git that we are gong to be running bisect and then that the current version is an example of a bad changeset. Next, using the SHA of a known good version, you should run git bisect good SHA. For example when I used this WordPress Core ticket 60862, I used the SHA from a commit during the crossover time between 6.4 and 6.5 that I had found to be working in advance and ran git bisect good 0133fc5441e299a39480d0e726a61a585713af32. Git will then automatically identify how many commits are and approximately how many steps it will take to find the bad commit. During each step, you will need to take whatever steps are necessary to verify if things are good (working as expected) or bad (broken) and then running telling git bisect that with either git bisect good or git biscect bad. After each run, you’ll get an update with the new possible number of revisions to check and number of steps needed. Eventually, after all the steps, you will have narrowed things down to the specific commit that caused the issue to begin with. I made a quick animation to give an idea for how this works. When I use git bisect I like to use Git Bisect when it’s not clear what caused an issue. This could be due to no recent changes to the specific function that is being problematic or due to changes in dependencies being a potential issue. It’s also blame is often faster when you know the code well and can easily find problematic code. I don’t think that asking about this during an interview is a good idea, but if you are a candidate who brought it up, it would impress me. It’s a good tool even if it’s not an everyday tool. Like this:Like Loading… GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: My June in WordPress Next: An Open Letter to New WordPress Committers→'
