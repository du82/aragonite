title = "Titles of drafts I just deleted - Aaron Jorbin"
description = "Happy Delete Your Drafts Day! I’m calling it a success since I started with 141 drafts and through a combination of deleting, publishing, and Here are some of the drafts I deleted."
full_description = 'Titles of drafts I just deleted Feb 29, 2024 — Polyhistoric Happy Delete Your Drafts Day! I’m calling it a success since I started with 141 drafts and through a combination of deleting, publishing, and Here are some of the drafts I deleted. Working with External Agencies – I wanted to share some of the lessons I learned from working with agencies, but so much of this was written in the present tense and I’m not currently working with agencies, it didn’t make sense to finish it or re-write it. I would call it 20% complete. OWASP Top Ten and WordPress – I planned to talk about how each of the security guidelines apply to WordPress. This was nothing but a title. Not Quite 48 hours in Toronto – I did a quick trip to Toronto in October of 2022 and planned to share my experience. The TL;DR; is go to the Art Gallery of Ontario and Blood Brothers Brewing. Also, don’t assume that the hours for Global Entry interviews are actually going to honored 🙁 Optimization – In which I argue that optimization for developer experience is more valuable than optimization for other things. Security as a courtesy – Talking about how WordPress releases twenty some versions when it does security releases but that doesn’t mean it supports that many versions. No Title – This was a response to Rand’s “An Unreasonable Investment” where I was planning to talk about one of my early mentors. I really need to do a general post on all my mentors. Like this:Like Loading… GET AARON IN YOUR INBOX Type your email… Subscribe Comments One response to “Titles of drafts I just deleted” David Artiss March 1, 2024 After a random (joke/suggestion) on Twitter a few years back, I wrote a plugin that can help manage your drafts – Draft Concluder. It sends you an email reminder at chosen intervals listing any that are over a specific age. It’s weirdly useful for regular, gentle reminders, so that you hopefully don’t need to do a mass deletion every 4 years. It’s free on wp.org, but thought it was a mention: https://wordpress.org/plugins/draft-concluder/ Reply Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: Staying Technical by Staying in the Arena Next: My February in WordPress→'
