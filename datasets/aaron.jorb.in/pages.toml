description = "For the past few years, I’ve made a flights playlist every year. It’s the playlist I listen to at the start of every flight I take with the rules being that I add a new song every flight segment. I took 24 flight segments this year visiting a total of 18 airports. Four segments involved […]"
full_description = 'Flights 2024 playlist Dec 27, 2024 — Art For the past few years, I’ve made a flights playlist every year. It’s the playlist I listen to at the start of every flight I take with the rules being that I add a new song every flight segment. I took 24 flight segments this year visiting a total of 18 airports. Four segments involved Houston, though I never went to Houston. I went through ORD the most (10 times) and got to experience all three NYC airports. Sometimes a song will be about where I’m heading ( Total Eclipse of the Heart as I was on my way to view the full solar eclipse), others it’s a bop I haven’t been able to get out of my head (Higher), or something I had recommended to me (Wish). The nice part is that each of these gets associated with a memory of a place and a time. I’m entering 2025 with no flights booked yet (which is a weird feeling) but I fully intend to create a new playlist. Like this:Like Loading… music GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: My October in WordPress Next: My 2024 in WordPress→'
