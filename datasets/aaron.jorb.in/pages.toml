["https://aaron.jorb.in/my-core-contribution-workflow"]
title = "My Core Contribution Workflow - Aaron Jorbin"
description = "At WordCamp US, we had an informal meetup for all of the committers (There were over 20 of us in a circle round shape!) and one of the things that we discussed was that everyone has a slightly different workflow but discovering your own workflow can be a burden, especially for newer contributors. So this […]"
full_description = 'My Core Contribution Workflow Sep 18, 2024 — Code At WordCamp US, we had an informal meetup for all of the committers (There were over 20 of us in a circle round shape!) and one of the things that we discussed was that everyone has a slightly different workflow but discovering your own workflow can be a burden, especially for newer contributors. So this is how I go about committing to WordPress Core. I currently have three folders that sit next to each other. wordpress is my svn checkout and wordpress-develop is my git clone. I also have wordpress-develop-security as a separate git clone so that when working on security issues I don’t accidentally push those public. For local development, I use the built-in WordPress docker environment. I’ll spin them up and down as I move between them. For small changes, especially inline documentation-focused changes, I’ll work directly from my SVN checkout usually in vim. I’ll use svn diff > XXXX.diff to generate diff files that I upload to trac. For larger changes that benefit from more eyes, I’ll use my git clone in wordpress-develop and push to a branch. I’ll either use vim or vscode for these changes, it mostly depends on my mood. When I am committing code, I always work from wordpress. To get a PR from GitHub applied locally, I’ll run gh pr diff YYYY --repo=WordPress/wordpress-develop | patch -p1 to apply the changes locally. If I am getting a patch from trac, I use npm run grunt patch:https://core.trac.wordpress.org/ticket/15705 to get a list of patches and pick the one I want to apply. My first step to make sure the code looks good and is ready to go is svn diff to look at the change and make sure it’s what I expect. I’ll then run the automated tests, do some manual testing and run svn commit which loads the $SVN_EDITOR that I define in my dot files as vim. I have vim setup to have spellcheck for svn commits by default with the following line in my vimrc autocmd FileType svn setlocal spell. As I write my commit message, I’ll generally check for a recent commit or look at the commit message documentation since I never remember if it is props and then fixes or fixes and then props. Like this:Like Loading… core commit WordPress GET AARON IN YOUR INBOX Type your email… Subscribe Comments 4 responses to “My Core Contribution Workflow” How I commit to WordPress – WerdsWords September 22, 2024 […] My Core Contribution Workflow – Aaron Jorbin […] Reply Damon Cook September 25, 2024 This is very helpful, and thanks for taking the time to write it up. It helps to get insight into these workflows, along with Joe McGill’s post. I think the nuances of switching from stable to dev are where I get hung up and how Gutenberg integrates with it all. For example, I want to have Gutenberg stable, but want to test something against WordPress bleeding-edge. Or, if I want to test something on a specific development cycle for WordPress and against a specific Gutenberg version number… how would one have a setup to account for all of that, and what would the commands look like to switch back and forth? Reply jorbin September 25, 2024 For my workflow, I’ll install and activate plugins on an as needed basis but I’ll also use `npm run sync-gutenberg-packages` to bring the packages over and test them. In addition to Gutenebrg, I often have rtl-tester, Simple Admin Language Change, and Log Deprecated Notices running. Reply Mentions 💬 Jonathan Desrosiers Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) 