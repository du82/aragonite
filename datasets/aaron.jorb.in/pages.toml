["https://aaron.jorb.in/my-september-in-wordpress"]
title = "My September in WordPress - Aaron Jorbin"
description = "The highlight for my September in WordPress was the opportunity to speak at WordCamp US with Jonathan Desrosiers. We gave a presentation entitled “Releasing a Version of WordPress in 8 Hours or Less” where we did a deep dive into WordPress 6.4.1 and explored what goes into releasing WordPress. The talk was well received. And […]"
full_description = 'My September in WordPress Oct 1, 2024 — Code The highlight for my September in WordPress was the opportunity to speak at WordCamp US with Jonathan Desrosiers. We gave a presentation entitled “Releasing a Version of WordPress in 8 Hours or Less” where we did a deep dive into WordPress 6.4.1 and explored what goes into releasing WordPress. The talk was well received. And they’ve wrapped up with one of the BEST quotes I’ve heard this entire camp!“Releasing software is 90% mental and the other half is physical”– Yogi Berra 😂😂😂#WCUS @aaronjorbin @desrosj #WordPress pic.twitter.com/r1g04x9IU6— Hari Shanker (@HariShanker) September 20, 2024 WordCamp US also allowed me to chat with numerous folks. One thing that I find WordCamps great for is getting some long standing members of the community to jump back in and help out. It was great to see Jeremy Felt return to committing code. Helen Hou-Sandí also made her first commit in about 18 months. Before my first WordCamp as a committer I was told by some of the longer-tenured committers that I should make sure to commit someone else’s code. I’ve tried to enshrine this advice in the core handbook: When attending contributor day of WordCamps, you are strongly encouraged to commit someone else’s code, ideally, an attendee that is there working on a patch. It’s also good to encourage inactive committers to dip their toes back in at these events. WordCamp wasn’t all I did in September. I also helped with the 6.6.2 release and continued trying to triage and scrub the bootstrap/load component. When I started scrubbing the bootstrap/load component, there were 68 open tickets. It’s now down to 51 and there are seven tickets that are a candidate to close. Over half of the open tickets have received some sort of update in the last two months. Slowly bringing this component under control. By the numbers During the month of September, I contributed to 63 tickets on trac, made 6 commits to core, received 10 props, reviewed 2 make/core post, did one dinner with WordPress YouTubers, gave one presentation, updated some documentation for contributors, created one new handbook page, served as the committer for one release, and worked approximately 69 hours on WordPress, of which my sponsors paid for just over 19.5 hours and I donated the rest. I had 18 sponsors this month: Jeff Matson, Jeffrey Paul, philipjohn, Zach Stepek, Keanan Koppenhaver, George Mamadashvili, Russell Heimlich , Austin Ginder, Adam Silverstein, Felix Arntz, Emilia-Capital, Jonathan Desrosiers, Brian Coords, mklute101, Emily Rapport, Tim Nash, Jens De Beule, and one who wishes to remain anonymous. Thank you for believing in and supporting my contributions to Open Source. Previous: August 2024, July 2024, June 2024, May 2024, April 2024, March 2024, February 2024, January 2024, December 2023, November 2023 Like this:Like Loading… My Month In WordPress open source software WordPress GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: 10th Commitiversary Next: I Love Building Software→'
