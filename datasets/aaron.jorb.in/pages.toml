["https://aaron.jorb.in/an-open-letter-to-new-wordpress-committers"]
title = "An Open Letter to New WordPress Committers - Aaron Jorbin"
description = "Dear New WordPress Core Committer, My friend Daniel would say “My condolences, you’re now the maintainer of a popular open source project” and I have to agree. Being a committer is an honor and burden and you’ve accepted part of this burden. Thank you. Thank you is something that hopefully you’ll hear very often from […]"
full_description = 'An Open Letter to New WordPress Committers Jul 22, 2024 — Code Dear New WordPress Core Committer, My friend Daniel would say “My condolences, you’re now the maintainer of a popular open source project” and I have to agree. Being a committer is an honor and burden and you’ve accepted part of this burden. Thank you. Thank you is something that hopefully you’ll hear very often from folks, but sometimes this work is thankless. Try to say thank you to your peers whenever you can. Say thank you to everyone who is contributing. When I was asked to be a committer, Nacin sent me a wall of text that has been lost to the ether of Skype. Some of the ideas have lived on in his now abandoned blog or in walls of text other committers have sent/received. Here are some of the things I remember and some of my own tips A lot of the things in WordPress work the way they do because they work that way. Sometimes there is a good reason for it. We use a singular format for commit messages. This format can be cumbersome (such as remembering if the order is props then fixes or fixes then props) but it’s done so that both humans and machines can easily parse the data. When you have to go back and investigate a decision from years ago, seeing the rationale for why in a commit message makes it much quicker. Sometimes there isn’t a good reason for why something is done the way it is. Sometimes the reason is that no one has questioned it and been willing to find a better one. Ask why but remember if you break it you bought it. Install a spell checker for your commits. Maybe this advice was just for me, but I’ll still pass it on. Also, if you use vim, you can add this to your .vimrc autocmd FileType svn setlocal spell. Spell check will always be used for svn commits. And get used to opening the doc on commit messages. When in doubt, work in public. It’s ok to ask for help. If you’re doing something big, it’s best to seek consensus early and often. If there is an objection, seek to understand why and find a solution. Dig a level deeper. You are going to get reverted by someone. Others will change your code without your consent. While it’s rarely Peter these days, you should still wear it as a badge of honor. Props are handed out liberally, but unprops need to be truly earned and when you earn them, smile. Read producing open source. Read Havoc Pennington. Read archaic pages on WordPress.org. Blog your thoughts. You have something to add. Think about the Philosophies of WordPress and what they mean to you. Use WordPress. Help users with their site. Talk to random attendees at WordCamps. Your opinions should be strong, but loosely held. In the presence of new rationale, good maintainers change their minds often. WordPress is a project that is bigger than any one individual. As of today, 103 accounts have committed to core. You’re joining a small group that has had a large impact on the web. You’re going to break someone’s website. You’ll feel bad about it. You’re going to fix someone’s website. You might not even know it. It’s hard work and is often thankless. My condolences and haha sucker. Regards, Aaron JorbinCore Committer since 09/29/2014 at 12:20:58 PM. Like this:Like Loading… core commit WordPress GET AARON IN YOUR INBOX Type your email… Subscribe Comments 3 responses to “An Open Letter to New WordPress Committers” Daniel Bachhuber July 22, 2024 My friend Danial would say I think you need a spellchecker in your WordPress too 😉 Reply jorbin July 23, 2024 I agree. I miss After The Deadline. Reply Weston Ruter July 29, 2024 Install a spell checker for your commits. What I’ve been doing lately, since almost every SVN commit starts out in a pull request nowadays, is I use the pull request description to draft the commit message. Then I get Chrome’s built-in enhanced spell check (which includes grammar checking), and as a bonus I also get a preview of any markdown. Putting the drafted commit message in the PR description also provides a way to let the message bake for awhile and also get revisions before it gets cemented in SVN for eternity. Reply Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: An introduction to Git Bisect Next: Pride Photos I’ve released to the commons→'
