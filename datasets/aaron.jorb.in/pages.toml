title = "My March in WordPress - Aaron Jorbin"
description = "March was a month where the majority of my focus was on helping drive 6.5 to completion. This has meant many long conversations with the overwhelming majority of it focused on the location of the fonts on the file system. It took a lot of time from a lot of people, but ultimately we were […]"
full_description = 'My March in WordPress Apr 1, 2024 — Code March was a month where the majority of my focus was on helping drive 6.5 to completion. This has meant many long conversations with the overwhelming majority of it focused on the location of the fonts on the file system. It took a lot of time from a lot of people, but ultimately we were able to get to a solution that will allow the font library to work out of the box for hopefully everyone even though it meant needing to delay the release a week. Getting to a decision can be hard. In WordPress, I often think it’s best to consider every angle and every side effect of a decision. It can be time-consuming and sometimes I wish it was quicker, but I think that it ultimately leads to better software. I’ve also started putting a group together for 6.5.1. Crossing my fingers that it’s not released nearly as quickly as 6.4.1. I’m also hoping to be able to spend time improving some of the documentation for minor releases. By the numbers During the month of February, I contributed to 44 tickets on trac, made 1 commit to core, received 6 props, and worked approximately 81 hours on WordPress, of which my sponsors paid for slightly less than 17 and I donated the rest. I had 12 sponsors this month: JeffMatson, jeffpaul, philipjohn, zstepek, kkoppenhaver, mamaduka, kingkool68, austinginder, adamsilverstein, felixarntz, Emilia-Capital and one who wishs to remain anonymous. Thank you for believing in and supporting my contributions to Open Source. Previous: February 2024, January 2024, December 2023, November 2023 Like this:Like Loading… My Month In WordPress open source software WordPress GET AARON IN YOUR INBOX Type your email… Subscribe Comments 2 responses to “My March in WordPress” Mentions 💬 jorbin 💬 jorbin Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify