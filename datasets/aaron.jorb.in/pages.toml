["https://aaron.jorb.in/my-may-in-wordpress"]
title = "My May in WordPress - Aaron Jorbin"
description = "During May, my primary focus was on the release of 6.5.3 and the discussions that led up to the decision to do the upcoming release of 6.5.4. It’s also a month that I have taken some time off to celebrate my birthday (which Pascal celebrated in a commit message, the third time one committer wished […]"
full_description = 'My May in WordPress Jun 3, 2024 — Code During May, my primary focus was on the release of 6.5.3 and the discussions that led up to the decision to do the upcoming release of 6.5.4. It’s also a month that I have taken some time off to celebrate my birthday (which Pascal celebrated in a commit message, the third time one committer wished another happy birthday) and to be a tourist as I get ready for WordCamp Europe. Overall, I worked on WordPress a bit less this month than in April. Here is the image of a picturesque hillside in Italy’s Liguria region with the text “My May in WordPress” overlaid on it. Let me know if you need any further adjustments! The conversations related to 6.5.4 began in private in order to fully understand the problem space. We needed to ask plugin companies for data that they might not want to be made public. The conversations shifted to being public as quickly as possible and proposals were brought forward which led to a decision that I think will help resolve some of the lingering issues from the introduction of Plugin Dependencies. It’s not without side effects, but hopefully, those can be mitigated in the long term. A big accomplishment that affects very few people is that I published an update to the releasing minor versions handbook page focused on the day of release. Over the coming months, my hope is to put a lot of what I’ve learned into documentation. It shouldn’t be an undue burden for any trusted contributor to lead a minor release. May also marked six months since I first started looking for and accepting sponsorship. It is not yet at a point where this can sustain me long-term. I applied for a grant from the Open Technology Fund which would go a long way to helping, but I am hopeful that at WordCamp Europe I’m able to find a few more organizations interested in sponsoring me. By the numbers During the month of May, I contributed to 56 tickets on trac, made 15 commits to core, received 17 props, ran 3 release parties, drafted one dev note that won’t need to be published, and worked approximately 75 hours on WordPress, of which my sponsors paid for slightly less than 17 and I donated the rest. I had 14 sponsors this month: JeffMatson, jeffpaul, philipjohn, zstepek, kkoppenhaver, mamaduka, kingkool68, austinginder, adamsilverstein, felixarntz, Emilia-Capital, desrosj, bacoords and one who wishs to remain anonymous. Thank you for believing in and supporting my contributions to Open Source. Previous: April 2024, March 2024, February 2024, January 2024, December 2023, November 2023 Like this:Like Loading… My Month In WordPress open source software WordPress GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: Hoppy Espresso Tonic Next: A script for generating links to WordPress profiles→'
