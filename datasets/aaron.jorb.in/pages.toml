["https://aaron.jorb.in/five-lessons-from-eight-years-as-a-wordpress-core-committer"]
title = "Five lessons from Eight Years as a WordPress Core Committer - Aaron Jorbin"
description = "Today marks eight years since I first committed to WordPress Core. Like many things, this feels like both yesterday and forever ago. Reflecting on this, I thought of five lessons I have learned from being a maintainer of what is now 43% of the internet. Have a bias toward action Learning when to move fast […]"
full_description = 'Five lessons from Eight Years as a WordPress Core Committer Sep 28, 2022 — Code Today marks eight years since I first committed to WordPress Core. Like many things, this feels like both yesterday and forever ago. Reflecting on this, I thought of five lessons I have learned from being a maintainer of what is now 43% of the internet. Have a bias toward action Learning when to move fast and when to move slow is a never-ending experience, but helping to maintain WordPress has helped me understand that it’s important to make decisions, even if that decision is the wrong one. Sometimes the action though is to not do something. In open source no is temporary, and yes is forever. But you need to make decisions. It’s also ok to make the wrong one because when it’s the wrong one, you should… Wear your mistakes as badges of honor I was told early on that as a committer I was going to encounter the day that someone reverted my code without consulting me. And I needed to be ok with this. When I’ve been reverted, when I’ve earned unprops, I learn something and ultimately the software is better. It might hurt in the short term, but I am ok with it because… Committers are trusted by the community, but first you need to trust themselves Trusting myself is something that has meant two different things as a committer: First was having the confidence to do it (and being ok with mistakes helped with this). The second is knowing the things I am still in touch with the code and having the confidence to continue to commit. I often think about this quote from Karl Fogel: If the main criterion for granting commit access is good judgement, then why assume someone’s judgement would deteriorate just because she’s been away from the project for a while? Even if she completely vanishes for years, not looking at the code or following development discussions, when she reappears she’ll know how out of touch she is, and act accordingly. You trusted her judgement before, so why not trust it always? If high school diplomas do not expire, then commit access certainly shouldn’t. Producting Open Source Software – Dormant Committers – Karl Fogel While there are more and more parts of the code I don’t have a lot of confidence in my knowledge of, one thing I can continue to do is ask the question… “What’s the problem you are trying to solve?” Some variation of this is something that I saw Nacin and Helen ask on a regular basis during my early time as a commuter. Digging a little deeper and trying to understand the problem helps find the best solution. Learning this lesson reminds me to… Make friends along the way Committers aren’t a big group. You never know when that eagle-eyed new contributor at a WordCamp is going to turn into a friend, so appreciate the opportunity. I’ve used my commit 393 times. There are 93 people who have been trusted to maintain the codebase of WordPress at some time and I’m proud to say many are friends. Here is to 8 years. 🍻 I previously blogged three years and seven years as a committer. Like this:Like Loading… core commit GET AARON IN YOUR INBOX Type your email… Subscribe Comments 57 responses to “Five lessons from Eight Years as a WordPress Core Committer” Anthony Burchell September 29, 2022 Happy 8! 🎉 Reply Amy Hendrix September 29, 2022 Oh hey congrats! Reply Felix Arntz September 29, 2022 Congrats on 8 years 🍻 Reply Google Fonts in WP 6.1, Headless und die wp-config – WP Letter October 4, 2022 This Article was mentioned on wpletter.de Reply jorbin September 29, 2023 Today marks nine years since my first commit to WordPress Core. In that time I’ve made 406 commits which puts me 26th in the list of most commits. The majority of the commits came in the first few years (I had 283 on my third commitiversary). I’ve settled into a role where I try to […] Reply Likes 👍 Alexander Gounder ☪️ 🇺🇦 👍 Andy Fragen 👍 Bellycan 👍 Jon Desrosiers 👍 Birgit Pauli-Haack 👍 David Bisset 👍 Abdullah #WordPress #CommunityBuilder #OpenSource 👍 John Hawkins 👍 ale 👍 Christina Rose 👍 Darren Ethier 👍 Benjamin Gosset Ⓦ 👍 Petya Raykovska 👍 Greg Ziółkowski 👍 Jonathan Wold 👍 Felix Arntz 👍 SKC 🏳️‍🌈 👍 Brandon Kraft ❤️‍🔥🧡 👍 Nicholas Mercer 👍 Shusei Toda🎥💻💡 👍 Amy Hendrix 👍 Robert Windisch 👍 Brad Williams 👍 Sergey Biryukov 👍 Kelly Berdine 👍 Erica Comfort 👍 Josepha Haden Chomphosy 👍 Drew Wilde 👍 Adam Silverstein 👍 Torsten Landsiedel 👍 Jake Spurlock 👍 Joost de Valk 👍 Anthony Burchell 👍 Courtney Robertson 🌻 👍 David Baumwald 👍 Joe McGill 👍 Shawn Hooper 👍 Suzi 👍 Jeff 👍 Marius Jensen 👍 Lindsey Miller 👍 meagan hanes Reposts ♻️ pixelmagic – #BlackLivesMatter ♻️ David Bisset ♻️ Abdullah #WordPress #CommunityBuilder #OpenSource ♻️ SeriousWP ♻️ Robert Windisch ♻️ James Huff ♻️ Sergey Biryukov ♻️ Jeff Mentions 💬 Birgit Pauli-Haack 💬 Courtney Robertson 🌻 Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: The Bee and The Flower Next: The Bowery→'
