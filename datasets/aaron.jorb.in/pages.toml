title = "Hoppy Espresso Tonic - Aaron Jorbin"
description = "Espresso Tonic is a great beverage. It’s a variation on an iced americano that uses tonic water for a different texture and slightly different flavor. Hop water is a great beverage. It’s a variation on sparkling water and beer that adds a beautiful bitterness to sparkling water. What if we married them? Well then we […]"
full_description = 'Hoppy Espresso Tonic May 31, 2024 — Beverages Espresso Tonic is a great beverage. It’s a variation on an iced americano that uses tonic water for a different texture and slightly different flavor. Hop water is a great beverage. It’s a variation on sparkling water and beer that adds a beautiful bitterness to sparkling water. What if we married them? Well then we would have what I call a Hoppy Espresso Tonic1. I made mine with a light roasted Nicaraguan coffee from Sump Coffee and Super Zero Sparkling Hop Water from Revolution Brewing. I normally use an Aeropress and hand grind my coffee with a TIMEMORE Chestnut C3 PRO so that’s what I did here. For this one, my coffee recipe is as follows: Grind 15 grams very fine (8 clicks on the C3) Add coffee and 75 grams of 95 degree celsius water to the aeropress While brewing, add 150 grams of ice to a pint glass Let brew for 2 minutes with a metal filter the flow control cap Plunge the Aeropress for 30 seconds Top with 100 grams of cold hop water Stir lightly to combine Before mixing, you can see just how clear the drink is. In early versions of this recipe, I found that the hop water can easily overpower the coffee. So even thought the glass didn’t fill all the way, I wouldn’t add much more than 150 grams. When I can get more hop water, I want to experiment with this some more. I might use my normal iced coffee recipe with 150 grams of ice, a coarse grind (25 clicks) with 25 grams of coffee, 50 grams of water in a 30-second bloom, swirl and add 100 additional grams of water. At two minutes, swirl and then do a 30 second extraction from 2:30 to 3:00. I’m thinking of doing this, but dropping down the water to 100 total grams instead of 150 and topping with 50 grams of hop water. I also want to try some fruit additions that match the hop profile a bit. Maybe a citra hop with an orange filter? Or a stone fruit puree with this Sabro/Nectaron hop water? It’s not really tonic since it’s not made with tonic water, but the name feels right to me. ↩︎Like this:Like Loading… GET AARON IN YOUR INBOX Type your email… Subscribe Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post’s permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post’s URL again. (Learn More) ←Previous: A few random stats related to WordPress commits Next: My May in WordPress→'
