title = "Art Archives - Page 2 of 20 - Aaron Jorbin"
full_description = "Category: Art Variations on a theme – Isla Verde Jan 22, 2024 — Art Four different representations of the same place with different levels of machines and human decision-making and interactions. 18:30, almost sunset, looking east on the Isla Verde beach. 21 January 2024. Boomer.Before.Arts is a fitting three words for where I sat. Which one do you prefer? Drawings, Sketches, and Paintings from the last six months Dec 24, 2023 — Art I didn’t think I had actually done a good job of making art since I started traveling, but looking back at these I can see I haven’t been too bad. This is a mixture of digital art, generally based on either a sketch or a photo I took, along with physical art that is mostly… The Flying Train of Wuppertaler Dec 23, 2023 — Art The Wuppertal Schwebebahn was a unique site. In addition to making it easy to get around town, it also provided some good views. Thanks Felix Arntz for suggesting I visit. Layers of Memories Oct 1, 2023 — Art Cemeteries are the final place where generations will often overlap. The place where time overlaps grow the longer we look at them. Like museums where at first 10 years tell 100 stories, but given the timeline, 100 years tell 3 or 4. This started as a photo, but human decisions about which and where algorithms… Infrared Upper East Side Apr 10, 2023 — Art Spent part of my Sunday walking through central park with both my infrared and standard light cameras. The upper east side around the Guggenheim captured my eye. Here are a couple of different angles. All photos shot with a 590nm converted Nikon d5000. Iowa City and Cedar Rapids Oct 10, 2022 — Art Spent the weekend in Iowa for a wedding which was absolutely beautiful, but I also had some time for a tiny bit of sight seeing and brewery visits. I hadn’t spent a lot of time in this part of Iowa before and was fun to be on a college campus with the energy of fall,… The Bowery Oct 7, 2022 — Art started as an infrared photo, didn’t stay there. multiple passes with multiple tools. Fall 2022 The Bee and The Flower Sep 28, 2022 — Art I have an irrational fear of bees. I’ve had it my whole life. Anna Chlumsky’s acting in My Girl and is partially to blame, but that might be me trying to apply logic to the illogical. Somehow though, I have a very rational love for taking photographs of bees on flowers, especially when I have… Canon RF 16mm f2.8 – First Thoughts Oct 25, 2021 — Art My first reaction to rumors of the Canon RF 16mm f2.8: intrigue. Upon seeing the price and announcement: I’m in! My preorder was placed on September 13 and it arrived on October 21. An initial launch date of October 14 and there have been reports for supply issues, had me worried. That worry was unfounded… Let’s Go Other Sox Oct 16, 2021 — Art This year the White Sox performed exactly as I thought they would. They won a bunch of games and coasted to a division tittle but showed they still had a lot of room for growth. The playoff were a different story, and one that was disappointing to watch. They couldn’t hit, they couldn’t pitch, and… ←Previous Page Next Page→"
