title = "Speaker Bios and Photos • Aaron Parecki"
description = "Below you can find various versions of my bio. Please feel free to use the one you find most appropriate for your situation."
full_description = "Below you can find various versions of my bio. Please feel free to use the one you find most appropriate for your situation. Aaron Parecki is Director of Identity Standards at Okta with over 15 years of experience in the industry. He is active in multiple standards development organizations (SDOs), including IETF, OpenID Foundation, and W3C. He is an editor of OAuth 2.1 along with several other OAuth specifications, and co-chairs the SCIM working group at IETF, and the IPSIE working group at the OpenID Foundation. He has taught the fundamentals of OAuth and online security to thousands of developers worldwide through his book OAuth 2.0 Simplified as well as video courses and live online trainings. Aaron Parecki is Director of Identity Standards at Okta. He is the author of OAuth 2.0 Simplified, and maintains oauth.net. He regularly writes and gives talks about OAuth and online security. He is a member of the OAuth working group, and is the co-founder of IndieWebCamp, a conference focusing on data ownership and online identity. Aaron has spoken at conferences around the world about OAuth, data ownership, quantified self, and home automation, and his work has been featured in Wired, Fast Company and more. Aaron Parecki is an educator and content creator, and hosts a weekly livestream on his YouTube channel to help people level up their livestreaming and live video production. With over half a decade of experience filming corporate events and conferences, he uses his expertise with the Blackmagic ATEM switchers and other hardware to help people build up their own studios. You can learn more about Aaron at aaronpk.tv. Aaron Parecki is the co-founder of IndieWebCamp, an annual unconference on data ownership and online identity. Aaron helps people own their online content by creating specs such as the W3C Webmention and Micropub specifications. He also participates in the OAuth working group, maintains oauth.net, and wrote OAuth 2.0 Simplified. He has spoken at conferences around the world about OAuth, data ownership, quantified self, and even explained why R is a vowel."
