["https://abaufdiewiese.de/dein-picknickerlebnis"]
title = "Dein Picknickerlebnis"
description = "Gestalte dein ganz individuelles Picknickerlebnis bei Ab auf die Wiese"
full_description = 'Eine Streuobstwiese nur für DichDu suchst dir den Tag aus und wir kümmern uns um den Rest. Gerne gestalten wir ein Picknick exklusiv für dich und deine Gäste. Ihr habt die Streuobstwiese dann ganz für euch alleine und könnt dieses gemeinsame Erlebnis ungestört genießen. Melde dich bei uns und wir besprechen deinen Wunschtermin. Ein Menü ganz nach deinem GeschmackDein Picknick, deine Wahl! Für deinen Besuch auf unserer Streuobstwiese stellen wir dir gerne ein individuelles Menü zusammen. Du liebst Zimt in deinen Cupcakes oder kannst die Finger nicht von unserem Sauerteigfocaccia lassen? Kein Problem! Wir achten bei der Menügestaltung auf deine Vorlieben und die deiner Gäste. Das Sahnehäubchen obendraufManchmal darf es auch ein bisschen mehr sein! Du hast Lust auf einen besonderen Prisecco oder eine hausgemachte Limonade? Du wünscht dir eine individuelle Geburtstagstorte oder Cupcakes in der Lieblingsfarbe deiner Braut? Bei "Ab auf die Wiese" ist so einiges möglich, um dein Picknick nach deinen Wünschen zu erweitern. Wir freuen uns darauf deine Ideen wahr werden zu lassen. Regionale Leckereien für dein PicknickUnsere Region liegt uns am Herzen! Für unsere Picknicks haben wir uns deshalb nach Produzent:innen rund ums Lenninger Tal umgeschaut und besondere, regionale Produkte zusammengetragen. Frisch vom Erzeuger holen wir beispielsweise unser Mehl, Sonnenblumenöl, Obst und Gemüse, sowie Käse, Wurst und Fleisch. Dazu kommen natürlich regionale Apfelsäfte, Sekt- und Prisecco-Sorten.'
