full_description = "Ab auf die WieseDein Picknickerlebnis der besonderen ArtRegionale ProdukteArtenvielfalt schützenGenuss erlebenTradition bewahrenMit unseren Picknicks wollen wir ein Erlebnis gestalten, welches Menschen im Lenninger Tal zusammenbringt, Begeisterung für die Streuobstwiesen entfacht & an das Erbe der Hopfenburg erinnert. In deinem Picknickkorb erwarten dich Leckereien aus regionalen Produkten, zusammengestellt in liebevoller Handarbeit. Die Highlights in deinem Korb sind Kreationen, die auf unsere Streuobstwiesen abgestimmt wurden. Sie machen dein Picknickerlebnis zu etwas ganz Besonderem. Ihr könnt euer Picknick entweder auf einer Picknickdecke mit Kissen oder an einem Tisch mit Stühlen genießen. Die Details zu den Arrangements findet ihr in den FAQs.Aktuelle PicknicksPicknick meets Yoga - 25.05.Beginne deinen Tag mit einer erfrischenden Yogastunde unter freiem HimmelPicknick am 25.05.2025 buchenGeschenkgutscheinVerschenke Genussmomente mit einem Gutschein von Ab auf die WiesePicknick buchenZeige mir alle PicknicktermineMelde dich bei mir!Du hast Fragen zu unseren Picknicks, den Menüs oder spezielle Wünsche für dein Picknick? KATHARINA JÄGERMobil: +49 151 651 233 15Email: info@abaufdiewiese.deNameVornameEmailMessageNachricht absendenFörderungDieses Projekt wird mit Mitteln des Bundes und des Landes Baden-Württembergs aus der Gemeinschaftsaufgabe zur Verbesserung der Agrarstruktur und des Küstenschutzes gefördert.Newsletter AnmeldungDu möchtest auf dem Laufenden bleiben sobald ein neuer Picknicktermin online geht oder die neuesten Infos von der Apfelernte direkt in dein E-Mail Postfach? Dann lass mir gerne deine E-Mail da und freue dich über regelmäßige News rund um meine Picknicks.Email*Dein Name*Ich habe die Datenschutzerklärung gelesen und bin damit einverstanden.Abschicken"
