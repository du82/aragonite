title = "Unsere Partnerbetriebe"
description = "Partnerbetriebe von Ab auf die Wiese im Lenninger Tal und Umgebung"
full_description = 'Biolandhof GruelEin familiengeführter Biolandhof, der sich auf den organisch-biologischen Landbau spezialisiert hat. Gemeinsam mit ihrem Team baut Familie Gruel verschiedene Obst- und Gemüsesorten an. In ihrem Hofladen in Owen findet man je nach Saison z.B. Kartoffeln, Zwiebeln, Tomaten, Karotten oder auch Grünkohl. Für unsere Picknickmenüs ist die Saisonalität und Regionalität der Produkte besonders wichtig, daher schätzen wir die tolle Auswahl der hauseigenen Produkte sehr. Neben Rote Bete, Paprika, Karotten und Zwiebeln sind auch Teck-Lensa und Teck-Flocka feste Bestandteile unserer Menüs. Die Teck-Flocka findet ihr beispielweise in unserem hausgemachten Granola, die Rote Bete in unserem Rote-Bete-Aufstrich und die Paprika in unserem Käsesalat. Getränkehandlung Roland AllgaierDie familiengeführte Getränkehandlung Roland Allgaier aus Oberlenningen legt besonderen Wert auf hochwertige Produkte und persönliche Beratung. Seit vielen Jahren liefert die Familie Allgaier neben klassischen Getränken auch eine Vielzahl an alkoholischen und alkoholfreien Spezialitäten kleiner Brauereien. Mit einer breiten Auswahl an erlesenen Getränken ist die Getränkehandlung Roland Allgaier der ideale Partner für unsere Picknicks und Caterings. Manufaktur Jörg GeigerEin Pionier, der Tradition und Innovation verbindet voller Respekt vor der Natur und ihrer Vielfalt. Aus schwäbischem Wiesenobst gestaltet die Manufaktur Jörg Geiger in Schlat besondere Destillate, Schaumweine oder auch alkoholfreie PriSeccos im Einklang mit dem natürlichen Jahresrhythmus der Bäume, Kräuter, Gräser und Sträucher. Dabei spielen Nachhaltigkeit und Regionalität eine wichtige Rolle.Für unsere Picknicks haben wir gemeinsam mit der Manufaktur Jörg Geiger eine feine Auswahl an alkoholfreien PriSeccos getroffen, welche ergänzend zu unseren Frühstücks- und Vespermenüs gebucht werden können. Darunter sind sowohl vegane Varianten, wie der "TEASECCO", als auch Bio-Varianten, wie der saisonale "Bio-Frühlingsduft".'
year_published = 2025
