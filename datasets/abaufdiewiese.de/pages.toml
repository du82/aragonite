["https://abaufdiewiese.de/products/picknick-meets-yoga-25-05"]
title = "Picknick meets Yoga - 25.05."
description = "Beginne deinen Tag mit einer erfrischenden Yogastunde unter freiem Himmel. Danach genießt du ein gemütliches Picknick auf unserer Streuobstwiese. Lass die Seele an diesem Sonntag baumeln und tanke neue Energie in entspannter Gesellschaft. Genauere Details zum Event findest Du weiter unten auf dieser Seite.Solltest Du noch Fragen haben, melde dich gerne über das Kontaktformular."
full_description = 'Picknick meets Yoga - 25.05.25.05.202510:30 - 13:30Apfelwiese zwischen Seestraße 9 & Seestraße 11, 73252 UnterlenningenBeginne deinen Tag mit einer erfrischenden Yogastunde unter freiem Himmel. Danach genießt du ein gemütliches Picknick auf unserer Streuobstwiese. Lass die Seele an diesem Sonntag baumeln und tanke neue Energie in entspannter Gesellschaft. Genauere Details zum Event findest Du weiter unten auf dieser Seite.Solltest Du noch Fragen haben, melde dich gerne über das Kontaktformular.€44.80Picknickgäste1234PicknickmenüKlassischVegetarischVeganWelche Picknick-Arrangements gibt es? BesonderheitenPrisecco Jörg Geiger - 0,75 (alkoholfrei) - 14,00 €Täles Secco (weiß/rosé) 0,75l - 12,00 €Libero (Weißwein, entalkoholisiert) 0,75l - 11,50 €Mein Picknick buchenWer steckt dahinter?Unsere Yogalehrerin Vera Cafaro hat ein kleines Yogastudio in Lenningen-Hochwang:"Ich freue mich sehr mit euch gemeinsam Yoga auf der Wiese zu praktizieren. In der Natur wirkt Yoga besonders beruhigend und erdend. Du tankst Vitamin D und das Grün der Bäume und der Wiese erfreut Herz und Seele."Was erwartet dich?Wir beginnen mit 1,5h Yoga inklusive Schlussentspannung.Danach verteilen wir die Picknickkörbe und ihr könnt entspannt euer Picknick genießen.Die Yogaübungen können sehr sanft bis fordernd gestaltet werden. Die Yogastunde ist auch für Anfänger geeignet.Das solltest du mitbringen:Mattebequeme KleidungDecke oder Pulli für die SchlussentspannungWie sieht das Menü aus?Es wird 3 Varianten geben: Klassisch, Vegetarisch & Vegan.Im Picknickkorb findest Du unter anderem unseren fruchtigen Bio-Joghurt mit hausgemachtem Granola, Gemüsesticks und unser liebstes Sauerteig-Focaccia. Die detaillierten Menüs veröffentlichen wir hier in Kürze.Was ist, wenn es regnet?Bei Regen werden wir das Picknick in Veras Studio in Lenningen-Hochwang verlegen.Nichts für dich dabei?Das kriegen wir schon hin! Melde dich gerne direkt bei uns unter info@abaufdiewiese.de oder über unser Kontaktformular.Zurück zu den anderen Picknickterminen'
