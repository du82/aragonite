title = "Datenschutzerklärung Ab auf die Wiese"
description = "Datenschutzerklärung für Ab auf die Wiese"
full_description = 'In dieser Datenschutzerklärung wird beschrieben, wie Ihre personenbezogenen Daten erfasst, verwendet und weitergegeben werden, wenn Sie abaufdiewiese.de (die "Website") nutzen oder dort etwas kaufen.VON UNS ERFASSTE PERSONENBEZOGENE DATENWenn Sie die Website besuchen, erfassen wir automatisch bestimmte Informationen über Ihr Gerät, darunter Informationen zum Webbrowser, der IP-Adresse, der Zeitzone und einigen der Cookies, die auf Ihrem Gerät installiert sind. Wenn Sie auf der Website navigieren, erfassen wir außerdem Informationen zu den einzelnen Webseiten oder Produkten, die Sie aufrufen, zu den Websites oder Suchbegriffen, die Sie auf die Website geführt haben, sowie Informationen darüber, wie Sie mit der Website interagieren. Wir bezeichnen diese automatisch erfassten Informationen als "Geräteinformationen".Wir erfassen Geräteinformationen mithilfe der folgenden Technologien:"Cookies" sind Datendateien, die auf einem Gerät oder Computer gespeichert werden und häufig eine anonyme eindeutige Kennung enthalten. Weitere Informationen zu Cookies und zum Deaktivieren von Cookies sind unter http://www.allaboutcookies.org zu finden."Protokolldateien" protokollieren Aktionen auf der Website und erfassen Daten wie IP-Adresse, Browsertyp, Internetdienstanbieter, verweisende/Ausstiegsseiten sowie Datums-/Uhrzeitstempel."Web Beacons", "Tags" und "Pixel" sind elektronische Dateien zur Erfassung von Informationen dazu, wie Sie auf der Website navigieren.Wenn Sie auf der Website etwas kaufen oder versuchen, etwas zu kaufen, erfassen wir außerdem bestimmte Informationen über Ihre Person. Dazu gehören Name, Rechnungsadresse, Lieferadresse, Zahlungsinformationen (einschließlich Kreditkartennummern), E-Mail-Adresse und Telefonnummer. Wir bezeichnen diese Angaben als "Bestellinformationen".Mit "personenbezogene Daten" in dieser Datenschutzerklärung bezeichnen wir sowohl Geräteinformationen als auch Bestellinformationen.WIE VERWENDEN WIR IHRE PERSONENBEZOGENEN DATEN?Wir verwenden die von uns erfassten Bestellinformationen in der Regel zur Ausführung von Bestellungen, die wir über die Website erhalten (unter anderem zur Verarbeitung Ihrer Zahlungsinformationen, Versandbereitstellung und Zusendung von Rechnungen und/oder Bestellbestätigungen).Außerdem verwenden wir diese Bestellinformation zur:Kommunikation mit Ihnen;Prüfung unserer Bestellungen auf potenzielle Risiken oder Betrug undBereitstellung von Informationen oder Werbung im Zusammenhang mit unseren Produkten oder Dienstleistungen an Sie, sofern dies mit Ihren Datenschutzeinstellungen im Einklang steht.Wir verwenden die von uns erfassten Geräteinformationen für die Prüfung auf potenzielle Risiken und Betrug (insbesondere Ihre IP-Adresse) und allgemein zur Verbesserung und Optimierung unserer Website (z.B. mithilfe von Analysen zum Navigationsverhalten unserer Kunden und ihrer Interaktion mit der Website sowie zum Beurteilen des Erfolgs unserer Marketing- und Werbekampagnen).WEITERGABE IHRER PERSONENBEZOGEN DATENWir geben Ihre personenbezogenen Daten an Dritte weiter, die uns bei der Verwendung Ihrer personenbezogenen Daten wie oben beschrieben unterstützen. Zum Beispiel verwenden wir Shopify, um unseren Onlineshop zu betreiben. Weitere Informationen dazu, wie Shopify Ihre personenbezogenen Daten verwendet, finden Sie hier: https://www.shopify.com/legal/privacy. Schließlich können wir Ihre personenbezogenen Daten auch weitergeben, um geltende Gesetze und Vorschriften einzuhalten, um auf eine Vorladung, einen Durchsuchungsbefehl oder eine andere rechtmäßige Anfrage nach Informationen, die wir erhalten, zu reagieren oder um unsere Rechte anderweitig zu schützen.KONTAKTFORMULARBei der Benutzung des Kontaktformulars werden die von Ihnen übermittelten Daten vom externen Anbieter Formspree.io gesammelt und unterliegen dessen Datenschutzerklärung. Beachten Sie, dass Formspree.io nur die 100 zuletzt gesendeten Nachrichten speichert. Danach werden die Nachrichten gelöscht. Formspree.io verwendet Sendgrid.com zur Übermittlung von Emails an info@abaufdiewiese.de Weitere Informationen und Widerspruchsmöglichkeiten finden sich in der Datenschutzerklärung von Formspree.io: https://formspree.io/legal/privacy-policy/. Wenn Sie uns ohne Verwendung dieser Drittanbieter kontaktieren wollen, können Sie uns eine Email an info@abaufdiewiese.de schreiben.DO NOT TRACKWir weisen Sie darauf hin, dass wir die Datenerfassungs- und -nutzungsverfahren unserer Website nicht ändern, wenn wir von Ihrem Browser ein "Do Not Track"-Signal erhalten.IHRE RECHTEWenn Sie in Europa ansässig sind, haben Sie das Recht, auf die personenbezogenen Daten, die wir über Sie besitzen, zuzugreifen und deren Korrektur, Aktualisierung oder Löschung zu fordern. Wenn Sie dieses Recht ausüben möchten, setzen Sie sich über die nachstehenden Kontaktdaten mit uns in Verbindung.Wenn Sie in Europa ansässig sind, weisen wir außerdem darauf hin, dass wir Ihre Daten verarbeiten, um Verträge mit Ihnen zu erfüllen (z. B. wenn Sie über die Website eine Bestellung aufgeben) oder um unsere oben genannten berechtigten Geschäftsinteressen zu verfolgen. Bitte beachten Sie außerdem, dass Ihre Daten außerhalb von Europa, einschließlich Kanada und den Vereinigten Staaten, übertragen werden.AUFBEWAHRUNG VON DATENWenn Sie eine Bestellung über die Website aufgeben, bewahren wir Ihre Bestellinformationen für unsere Aufzeichnungen auf, sofern Sie uns nicht auffordern, diese Daten zu löschen.ÄNDERUNGENWir können diese Datenschutzerklärung gelegentlich ändern, um Änderungen unserer Vorgehensweisen zu berücksichtigen, oder aus anderen betrieblichen, rechtlichen oder aufsichtsrechtlichen Gründen.KONTAKTWenn Sie weitere Informationen zu unseren Datenschutzverfahren benötigen, Fragen haben oder eine Beschwerde einreichen möchten, kontaktieren Sie uns per E-Mail an info@kjphotography.de oder per Post an die unten genannte Adresse:Hölderlinstraße 3373252 Lenningen Baden-Württemberg, Deutschland'
