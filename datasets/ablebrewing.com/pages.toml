bout this page) */ @media screen and (max-width: 640px) { #shopify-section-product-template + .shopify-section--bordered { border-top: 0; } #shopify-section-product-template + .shopify-section--bordered > .Section { padding-top: 0; } } Taste Your Coffee, Not the Filter. Brews sweet, clean, full-bodied coffee while minimizing sediment, and doesn’t impart unwanted flavors. And unlike paper filters, the BASKET produces no paper waste. Simply rinse and repeat. <img src="//ablebrewing.com/cdn/shop/files/Basket_-_Taste_Your_Coffee_800x.jpg?v=1684530262" alt=""> <img src="//ablebrewing.com/cdn/shop/files/Basket_-_Precision_Engineered_800x.jpg?v=1684530263" alt=""> Engineered with Precision Every detail has been carefully obsessed over and rigorously tested for optimal water flow, coffee extraction and flavor. BASKET is the only reusable coffee filter for your automatic coffee maker capable of brewing to Speciality Coffee Association standards. Built to Last Constructed of precision-welded, photo chemically etched stainless steel and an injection-molded, food-safe polymer support ring, the BASKET is built to stand up to daily use, and is backed by our 3-year warranty. <img src="//ablebrewing.com/cdn/shop/files/Basket_-_Built_to_Last_800x.jpg?v=1684530263" alt=""> <img src="//ablebrewing.com/cdn/shop/files/Basket_-_Fits_800x.jpg?v=1684530516" alt=""> Fits 8-12 Cup Basket-Style Coffee Makers Universal fit integrates seamlessly with automatic coffee makers from Ratio, OXO, Bonavita, Breville, Cuisinart, Mr. Coffee and more. BASKET Details Fits 8-12 Cup Coffee MakersBASKET was designed for a seamless fit with automatic coffee makers from Ratio, OXO, Bonavita, Breville, Cuisinart, and more.Square-to-Round Hole DesignPhoto chemically etched square-to-round hole design reduces clogging for consistent water flow through your grounds.Graduated Density Hole PatternBASKET's unique hole pattern optimizes water flow rate for both small and large batches.Polished Stainless SteelBright polished stainless steel imparts no unwanted flavor, and prevents build up of coffee oils that can become rancid and bitter.Easy to CleanAfter each use, rinse and dry, hand wash or place in the top rack of your dishwasher.Durable Support RingPolymer support ring maintains shape integrity and makes it easy to remove after each brew. Created by Coffee Pros Able’s line of reusable coffee filters are widely celebrated among coffee pros. Able’s first product, the Kone, was designed by coffee veteran Keith Gehrke, and made its debut in 2011 at Coava Coffee’s brew bar in Portland, OR. Able’s reusable filters are now used in homes, cafes and competitions around the world. Customer Reviews You May Also Like <img class="ProductItem__Image ProductItem__Image--alternate" src="//ablebrewing.com/cdn/shop/products/cleaner-10_600x.png?v=1625073385" alt="Urnex Cleaning Powder Packets"> <img class="ProductItem__Image" src="//ablebrewing.com/cdn/shop/products/cleaner_179e8a09-db15-4881-aea8-4b413c1d0593_600x.png?v=1625073385" a'''
