["https://ablebrewing.com/products/kone"]
title = "Able Kone - Reusable Coffee Filter for Chemex"
description = 'The new Kone brews better, is easier to clean and more durable than ever. The Able Kone is loved by coffee pros, competitors and enthusiasts alike. Its forgiving, yet capable design makes brewing pour-over coffee approachable for everyone, while living up to the uncompromising standards of coffee professionals. Featuring a new square-to-round hole design, bright polished finish, and more durable construction, the newest Kone is the most capable yet. Fits 6, 8 and 10 cup Chemex® coffee makers. Fits Ratio Eight, Technivorm Moccamaster and Bonavita automatic drip brewers. 5 1/8" diameter, 4" height. Certified food-safe stainless steel and plastic. Designed by Able in Portland, Oregon. Assembled in China.'
