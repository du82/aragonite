lished stainless steel imparts no unwanted flavor, and prevents build up of coffee oils that can become rancid and bitter.Easy to CleanAfter each use, rinse and dry, hand wash or place in the top rack of your dishwasher.Durable Support RingPolymer support ring maintains shape integrity and makes it easy to remove after each brew. Created by Coffee Pros Able’s line of reusable coffee filters are widely celebrated among coffee pros. Able’s first product, the Kone, was designed by coffee veteran Keith Gehrke, and made its debut in 2011 at Coava Coffee’s brew bar in Portland, OR. Able’s reusable filters are now used in homes, cafes and competitions around the world. Customer Reviews You May Also Like <img class="ProductItem__Image ProductItem__Image--alternate" src="//ablebrewing.com/cdn/shop/products/cleaner-10_600x.png?v=1625073385" alt="Urnex Cleaning Powder Packets"> <img class="ProductItem__Image" src="//ablebrewing.com/cdn/shop/products/cleaner_179e8a09-db15-4881-aea8-4b413c1d0593_600x.png?v=1625073385" a'''
