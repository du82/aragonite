description = "We love when we have something new to share. The latest addition to our catalog may look familiar but means big things for AeroPress owners. We’ve added the XL Fine disk to our lineup which means that owners of the Aeropress XL can now brew fresh coffee without having to waste paper filters. The larger AeroPress carafe has the same classic, simple brew design as the original but is capable of brewing up to 20oz of fresh coffee — twice the capacity — in just a couple of minutes.  The Able XL Fine Disk boasts our photo-chemically etched filter design with an industry leading hole size of just 150 micron. This means you can grind and brew for maximum flavor, minimizing the fines in your cup. This is our favorite recipe for brewing a full batch on the AeroPress XL: 36 grams of"
full_description = 'Now reading: Now Available: XL Fine Disk for AeroPress Next July 19, 2024brewingNow Available: XL Fine Disk for AeroPress We love when we have something new to share. The latest addition to our catalog may look familiar but means big things for AeroPress owners. We’ve added the XL Fine disk to our lineup which means that owners of the Aeropress XL can now brew fresh coffee without having to waste paper filters. The larger AeroPress carafe has the same classic, simple brew design as the original but is capable of brewing up to 20oz of fresh coffee — twice the capacity — in just a couple of minutes. The Able XL Fine Disk boasts our photo-chemically etched filter design with an industry leading hole size of just 150 micron. This means you can grind and brew for maximum flavor, minimizing the fines in your cup. This is our favorite recipe for brewing a full batch on the AeroPress XL: 36 grams of coffee (about 1 heaping tablespoon) 540 grams (or ml) of water (just over 1 cup) 2:00 total brew time But you don’t have to stop there! We have a complete brew guide for the AeroPress on our blog and for after that delicious cup of coffee - a handy cleaning guide. Have more questions? Feel free to visit our Support page for even more info. <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/Featured_Coffee_1_600x.jpg?v=1585706962" alt="Featured Coffee: Dapper &amp; Wise Guatemala La Giralda"> Featured Coffee Featured Coffee: Dapper & Wise Guatemala La Giralda <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/AeroPress_brew_Ratio_600x.jpg?v=1721152279" alt="Ultimate Guide to Brewing on the Aeropress"> aeropress Ultimate Guide to Brewing on the Aeropress <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/Featured_Coffee_1_600x.jpg?v=1585706962" alt="Featured Coffee: Dapper &amp; Wise Guatemala La Giralda"> Featured Coffee Featured Coffee: Dapper & Wise Guatemala La Giralda <img class="ArticleItem