["https://ablebrewing.com/blogs/able-blog/how-to-clean-the-kone"]
title = "How to Clean the Kone – Able"
description = "So, you’ve just brewed an incredible cup of coffee with your Kone. Good work! To make sure it performs its best brew-after-brew, we recommend cleaning after each use. The good news? The Kone is super easy to clean! Follow our guide below to learn how. Tools we recommend: Fragrance-free soap, like this one from Seventh"
full_description = 'Now reading: How to Clean the Kone PrevNext December 18, 2023cleaningHow to Clean the Kone So, you’ve just brewed an incredible cup of coffee with your Kone. Good work! To make sure it performs its best brew-after-brew, we recommend cleaning after each use. The good news? The Kone is super easy to clean! Follow our guide below to learn how. Tools we recommend: Fragrance-free soap, like this one from Seventh Generation A cleaning brush, like this one (which you can also use to clean your Chemex) Steps: After brewing, knock the used coffee grounds into your compost bin. Rinse the filter in the sink to remove any grounds that are left. Now apply a fragrance-free soap and gently massage it into the filter. The goal is to work the soap into the filter holes, dislodging any stubborn grounds and oils. If you’ve waited a while to clean your Kone, you might want to use a brush for extra cleaning power. Continue rinsing under warm water, and air dry. A few further notes: We find it easiest to clean the Kone right after using. Don’t have fragrance-free soap? Conventional soap will work in a pinch, and you probably won’t even notice the difference. But since coffee is so focused on flavor — and since many of us spend so much time finding the perfect coffee and perfecting our brew method — we prefer to use fragrance-free soap when we can. The Kone is also dishwasher safe! We recommend using the top rack. <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/DSCF2454_600x.jpg?v=1721168699" alt="Do I Need a Coffee Scale? Three Reasons It Helps"> acaia Do I Need a Coffee Scale? Three Reasons It Helps <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/May_Lifestyle_Baratza_Encore_Grinder_Able_Kone_Glass_Carafe_3_600x.jpg?v=1721172063" alt="Understanding Grind Settings"> acaia Understanding Grind Settings <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/DSCF2454_600x.jpg?v=1721168699" alt="Do I Need a Coffee Scale? Three Reasons It Helps"> acaia Do I Need a Coffee Scale? Three Reasons It Helps'
