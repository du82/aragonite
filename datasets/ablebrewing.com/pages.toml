title = "Able Basket - Reusable Coffee Filter for 8-12 Cup Automatic Coffee Makers"
description = "Free 3-Day Shipping &amp; Free Returns Able’s first stainless steel filter for automatic coffee makers, BASKET is designed to brew cafe quality coffee at home without the use of paper. Carefully engineered for optimal water flow, coffee extraction and flavor, BASKET is unmatched in brewing sweet, clean, full-bodied coffee that meets Specialty Coffee Association standards. Features precision-welded, photo chemically etched stainless steel, square-to-round holes, graduated-density hole pattern, and an injection-molded, food-safe polymer support ring. BASKET is easy to brew with, easy to clean, and built to last. Fits all 8-12 cup basket-style automatic coffee makers. Brews sweet, clean, full-bodied coffee while minimizing sediment. Precision engineered for optimal water flow, coffee extraction and flavor. Durable and certified food-safe, backed by Able’s 3-year warranty. Easy to clean. Rinse and dry, hand wash or top rack dishwasher safe. Designed by Able in Portland,"
