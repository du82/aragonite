l,"id":27177407873093,"position":3,"preview_image":{"aspect_ratio":1.0,"height":2400,"width":2400,"src":"\/\/ablebrewing.com\/cdn\/shop\/files\/disk-standard-1_258f0cbf-e883-49bc-a95c-5eae0a344101.png?v=1720798806"},"aspect_ratio":1.0,"height":2400,"media_type":"image","src":"\/\/ablebrewing.com\/cdn\/shop\/files\/disk-standard-1_258f0cbf-e883-49bc-a95c-5eae0a344101.png?v=1720798806","width":2400},{"alt":null,"id":6549906358341,"position":4,"preview_image":{"aspect_ratio":1.0,"height":2400,"width":2400,"src":"\/\/ablebrewing.com\/cdn\/shop\/products\/disk-combo.png?v=1720799230"},"aspect_ratio":1.0,"height":2400,"media_type":"image","src":"\/\/ablebrewing.com\/cdn\/shop\/products\/disk-combo.png?v=1720799230","width":2400},{"alt":null,"id":27177445425221,"position":5,"preview_image":{"aspect_ratio":0.873,"height":1139,"width":994,"src":"\/\/ablebrewing.com\/cdn\/shop\/files\/51grhC5763L._AC_SL1200.jpg?v=1720799643"},"aspect_ratio":0.873,"height":1139,"media_type":"image","src":"\/\/ablebrewing.com\/cdn\/shop\/files\/51grhC5763L._AC_SL1200.jpg?v=1720799643","width":994},{"alt":null,"id":27177445818437,"position":6,"preview_image":{"aspect_ratio":1.456,"height":864,"width":1258,"src":"\/\/ablebrewing.com\/cdn\/shop\/files\/61YLOChss0L._AC_SL1296.jpg?v=1720799648"},"aspect_ratio":1.456,"height":864,"media_type":"image","src":"\/\/ablebrewing.com\/cdn\/shop\/files\/61YLOChss0L._AC_SL1296.jpg?v=1720799648","width":1258},{"alt":null,"id":6549910323269,"position":7,"preview_image":{"aspect_ratio":1.0,"height":2400,"width":2400,"src":"\/\/ablebrewing.com\/cdn\/shop\/products\/disk-in-basket.png?v=1720799686"},"aspect_ratio":1.0,"height":2400,"media_type":"image","src":"\/\/ablebrewing.com\/cdn\/shop\/products\/disk-in-basket.png?v=1720799686","width":2400}],"requires_selling_plan":false,"selling_plan_groups":[],"content":"\u003ch3\u003eOverview\u003c\/h3\u003e\n\u003cp\u003eThe DISK Coffee Filter is a reusable filter designed to be used with the AeroPress® Coffee Maker. This allows more oils and a fuller bodied cup of coffee when used with the AeroPress®. Eliminates the need for paper filters, which is especially convenient when traveling.\u003c\/p\u003e\n\u003cp\u003eThe Disk is available in two different options.\u003c\/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cstrong\u003e\u003cspan style=\"color: #f54135;\" data-mce-style=\"color: #f54135;\"\u003eStandard:\u003c\/span\u003e\u003c\/strong\u003e Fuller body cup of coffee with a bit more fines. Thicker and should last many years of heavy use and is very hard to bend\/damage. 254 micron hole size. \u003c\/li\u003e\n\u003cli\u003e\n\u003cspan style=\"color: #f54135;\" data-mce-style=\"color: #f54135;\"\u003e\u003cstrong\u003eFine:\u003c\/strong\u003e \u003c\/span\u003eVery sweet clean cup of coffee with very little fines to none at all. It is thinner (1\/3 of the Standard) and should be handled with care as bending\/damage is more likely. 152 micron hole size \u003c\/li\u003e\n\u003cli\u003e\n\u003cspan style=\"color: #f54135;\" data-mce-style=\"color: #f54135;\"\u003e\u003cstrong\u003eFine XL:\u003c\/strong\u003e \u003c\/span\u003eFits the newer Aeropress® XL Coffee Maker. 152 micron hole size. \u003c\/li\u003e\n\u003c\/ul\u003e\n\u003ch3\u003e\u003cspan\u003eFeatures\u003c\/span\u003e\u003c\/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cspan\u003e304 Stainless Steel\u003c\/span\u003e \u003c\/li\u003e\n\u003cli\u003e\n\u003cspan\u003eFits AeroPress\u003c\/span\u003e\u003cspan\u003e\u003cspan\u003e®\u003c\/span\u003e\u003c\/span\u003e Coffee Makers\u003c\/li\u003e\n\u003cli\u003e\n\u003cspan\u003e100% Made in USA\u003c\/span\u003e by Able Brewing\u003cspan\u003e\u003c\/span\u003e\n\u003c\/li\u003e\n\u003cli\u003e\u003cspan\u003ePackaging: 100% post-consumer recycled FSC certified\u003c\/span\u003e\u003c\/li\u003e\n\u003cli\u003e\u003cspan\u003eDiameter: Standard \u0026amp; Fine 2.45”\u003c\/span\u003e\u003c\/li\u003e\n\u003cli\u003e\u003cspan\u003eDiameter: XL 2.83”\u003c\/span\u003e\u003c\/li\u003e\n\u003cli\u003e\u003cspan\u003eDisk Standard hole size: \u003cspan data-mce-fragment=\"1\"\u003e254 microns\u003c\/span\u003e\u003c\/span\u003e\u003c\/li\u003e\n\u003cli\u003e\u003cspan mce-data-marked=\"1\"\u003e\u003cspan data-mce-fragment=\"1\" mce-data-marked=\"1\"\u003eDisk Fine hole size: \u003cspan data-mce-fragment=\"1\"\u003e152 microns\u003c\/span\u003e\u003c\/span\u003e\u003c\/span\u003e\u003c\/li\u003e\n\u003c\/ul\u003e"}, "selected_variant_id": 41836981125189 } Overview The DISK Coffee Filter is a reusable filter designed to be used with the AeroPress® Coffee Maker. This allows more oils and a fuller bodied cup of coffee when used with the AeroPress®. Eliminates the need for paper filters, which is especially convenient when traveling. The Disk is available in two different options. Standard: Fuller body cup of coffee with a bit more fines. Thicker and should last many years of heavy use and is very hard to bend/damage. 254 micron hole size. Fine: Very sweet clean cup of'
