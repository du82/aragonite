description = "Disco Marmalade is a washed process coffee from Ethiopia that was roasted by Luna Coffee Roasters in Langley, British Columbia, Canada. Their tasting notes include purple jam, sweet herbs, and violet. We chose to brew this coffee on the Kone with a 1:15 ratio of coffee to water. Our recipe: 40g coffee — medium grind600"
full_description = 'Now reading: Featured Coffee: Luna Disco Marmalade PrevNext January 01, 2021Featured CoffeeFeatured Coffee: Luna Disco Marmalade Disco Marmalade is a washed process coffee from Ethiopia that was roasted by Luna Coffee Roasters in Langley, British Columbia, Canada. Their tasting notes include purple jam, sweet herbs, and violet. We chose to brew this coffee on the Kone with a 1:15 ratio of coffee to water. Our recipe: 40g coffee — medium grind600g water — just off boil 40 second bloom (90g)Finished pouring at 3:00Finished draining at 4:00 Tasting notes: Holy violet! We were blown away by the intense violet aroma and flavor of this coffee. Perfume-like in the best way, the violet flavors were complimented with some soft notes of plum, a sweet herbasciousness, and a sugarcane finish. Our take: The dominant violet flavor stands above all else, making this an exceptionally memorable coffee from Ethiopia. <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/DSCF2531_600x.jpg?v=1609892891" alt="Featured Coffee: Market Lane Ngamba"> Featured Coffee Featured Coffee: Market Lane Ngamba <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/DSCF2531_600x.jpg?v=1609892891" alt="Featured Coffee: Market Lane Ngamba"> Featured Coffee Featured Coffee: Market Lane Ngamba <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/DSCF2531_600x.jpg?v=1609892891" alt="Featured Coffee: Market Lane Ngamba"> Featured Coffee Featured Coffee: Market Lane Ngamba <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/DSCF2531_600x.jpg?v=1609892891" alt="Featured Coffee: Market Lane Ngamba"> Featured Coffee Featured Coffee: Market Lane Ngamba'
