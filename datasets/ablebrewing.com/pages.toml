title = "How to clean the Disk – Able"
description = "So, you’ve just brewed an incredible cup of coffee with your Disk. Good work! To make sure it performs its best brew-after-brew, we recommend cleaning after each use. The good news? The Disk is super easy to clean! Follow our guide below to learn how. Tools we recommend: Fragrance-free soap, like this one from Seventh Generation Steps: After brewing, we like to wait a minute or two for the Aeorpress and coffee puck to cool down. Remove the black filter cap, slide the Disk off of the coffee bed, and pop the used coffee grounds into your compost bin. What a satisfying feeling! Rinse the filter in the sink to remove any grounds that are left. Now apply a fragrance-free soap and gently massage it into the filter. The goal is to work the soap into the filter holes, dislodging"
full_description = 'Now reading: How to clean the Disk PrevNext March 08, 2024aeropressHow to clean the Disk So, you’ve just brewed an incredible cup of coffee with your Disk. Good work! To make sure it performs its best brew-after-brew, we recommend cleaning after each use. The good news? The Disk is super easy to clean! Follow our guide below to learn how. Tools we recommend: Fragrance-free soap, like this one from Seventh Generation Steps: After brewing, we like to wait a minute or two for the Aeorpress and coffee puck to cool down. Remove the black filter cap, slide the Disk off of the coffee bed, and pop the used coffee grounds into your compost bin. What a satisfying feeling! Rinse the filter in the sink to remove any grounds that are left. Now apply a fragrance-free soap and gently massage it into the filter. The goal is to work the soap into the filter holes, dislodging any stubborn grounds and oils. Continue rinsing under warm water, and air dry. Easy! A few further notes: We find it easiest to clean the Disk right after using. Don’t have fragrance-free soap? Conventional soap will work in a pinch, and you probably won’t even notice the difference. But since coffee is so focused on flavor — and since many of us spend so much time finding the perfect coffee and perfecting our brew method — we prefer to use fragrance-free soap when we can. The Disk is also dishwasher safe! <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/2024-02-09_AbleBrewing_6688_600x.jpg?v=1721165624" alt="6 Tips for Choosing Better Coffee Beans"> coffee beans 6 Tips for Choosing Better Coffee Beans <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/2021-03-16_AbleBrewing_Cone_2560x1440-1920x1080_600x.jpg?v=1705448869" alt="Designing the perfect coffee filter for Chemex."> Designing the perfect coffee filter for Chemex. <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/2024-02-09_AbleBrewing_6688_600x.jpg?v=1721165624" alt="6 Tips for Choosing Better Coffee Beans"> coffee beans 6 Tips for Choosing Better Coffee Beans'
