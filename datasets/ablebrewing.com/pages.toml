title = "Urnex Cleaning Powder Packets – Able"
description = """
Urnex Cleary Coffee cleaning powder removes coffee oils and inhibits mineral deposits from forming in your stainless steel and glass coffee filters and brewers. We recommend weekly cleaning of your Kone or Disk coffee filter if you brew daily. To use, simply add one packet of cleaning powder to brew temperature water in a glass bowl or brewing vessel (up to 3 liters capacity). Submerge your Able coffee filter, and agitate solution with a brush. Allow to soak for 5-10 minutes, then discard solution and rinse everything with clean water.

Cleans and removes coffee oils and inhibits mineral deposits.
Packaged in single use 7g portions, ideal for vessels up to 3 liters.
For use on glass carafes, bowls, and thermal servers.
NSF-Certified for metal compatibility and safety.
Individual powder packets offers accurate portion control."""
