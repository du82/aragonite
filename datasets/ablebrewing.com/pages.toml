full_description = '''About Able Every morning we would wake up and stumble into the kitchen to make our morning coffee. There is nothing like the smell of fresh grounds and brewed coffee. Our method of choice was manual drip using the Chemex Coffee Maker. Making your coffee by hand feels very rewarding and seems to bring an intimate connection to the cup.One morning we ran out of paper filters. The hunt for a reusable filter ensued. However, we couldn’t find a filter that fit perfectly in our coffee maker as the shape was not a true cone. The available options also seemed to be of cheap build and resulted in a cup that didn’t taste as good as we thought it could.On our kitchen table we sketched out an idea for a custom filter. The goal was to make a filter that produced the best coffee possible, was made with high quality construction, and was sustainable.Thus the KONE coffee filter was born. It is a reusable filter made from high quality stainless steel and specifically designed to fit the Chemex Coffee Maker.Now with a few iterations of the KONE and a few other filters later, we remain committed to continue to innovate and provide the best coffee brewing equipment possible. {% if box.template.id == 1 or box.template.id == '1' %} <div id="{{box.id}}" data-title="{{box.title.text | escape}}" class="ga ga-template_1 ga-products-box ga-template_themeid_855"> {% if box.title and box.title.text and box.title.text != '' %}<h2 class="ga-title section-title "><span>{{box.title.text}}</span></h2>{% endif %} {% if box.subtitle and box.subtitle.text and box.subtitle.text != '' %}<div class="ga-subtitle">{{box.subtitle.text}}</div>{% endif %} <div class="ga-products"> <div class="ga-carousel_wrapper"> <ul class="ga-carousel gowl-carousel" data-products-count="{{products.size}}"> {% for product in products %} {% assign first_available_variant = false %} {% for variant in product.variants %} {% if first_available_variant == false and variant.available %}{% assign first_availabl