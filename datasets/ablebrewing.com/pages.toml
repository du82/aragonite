title = "Privacy Policy – Able"
description = "Able Coffee, LLC Privacy PolicyThis Privacy Policy describes how your personal information is collected, used, and shared when you visit or make a purchase from https://ablebrewing.com (the “Site”).PERSONAL INFORMATION WE COLLECTWhen you visit the Site, we automatically collect certain information about your device, in"
full_description = '''Privacy Policy Able Coffee, LLC Privacy PolicyThis Privacy Policy describes how your personal information is collected, used, and shared when you visit or make a purchase from https://ablebrewing.com (the “Site”).PERSONAL INFORMATION WE COLLECTWhen you visit the Site, we automatically collect certain information about your device, including information about your web browser, IP address, time zone, and some of the cookies that are installed on your device. Additionally, as you browse the Site, we collect information about the individual web pages or products that you view, what websites or search terms referred you to the Site, and information about how you interact with the Site. We refer to this automatically-collected information as “Device Information.”We collect Device Information using the following technologies:- “Cookies” are data files that are placed on your device or computer and often include an anonymous unique identifier. For more information about cookies, and how to disable cookies, visit http://www.allaboutcookies.org.- “Log files” track actions occurring on the Site, and collect data including your IP address, browser type, Internet service provider, referring/exit pages, and date/time stamps.- “Web beacons,” “tags,” and “pixels” are electronic files used to record information about how you browse the Site.Additionally when you make a purchase or attempt to make a purchase through the Site, we collect certain information from you, including your name, billing address, shipping address, payment information, email address, and phone number. We refer to this information as “Order Information.”When we talk about “Personal Information” in this Privacy Policy, we are talking both about Device Information and Order Information.HOW DO WE USE YOUR PERSONAL INFORMATION?We use the Order Information that we collect generally to fulfill any orders placed through the Site (including processing your payment information, arranging for shipping, and providing you with invoices and/or order confirmations). Additionally, we use this Order Information to:Communicate with you;Screen our orders for potential risk or fraud; andWhen in line with the preferences you have shared with us, provide you with information or advertising relating to our products or services.We use the Device Information that we collect to help us screen for potential risk and fraud (in particular, your IP address), and more generally to improve and optimize our Site (for example, by generating analytics about how our customers browse and interact with the Site, and to assess the success of our marketing and advertising campaigns).SHARING YOUR PERSONAL INFORMATIONWe share your Personal Information with third parties to help us use your Personal Information, as described above. For example, we use Shopify to power our online store--you can read more about how Shopify uses your Personal Information here: https://www.shopify.com/legal/privacy. We also use Google Analytics to help us understand how our customers use the Site--you can read more about how Google uses your Personal Information here: https://www.google.com/intl/en/policies/privacy/. You can also opt-out of Google Analytics here: https://tools.google.com/dlpage/gaoptout.Finally, we may also share your Personal Information to comply with applicable laws and regulations, to respond to a subpoena, search warrant or other lawful request for information we receive, or to otherwise protect our rights.BEHAVIOURAL ADVERTISING As described above, we use your Personal Information to provide you with targeted advertisements or marketing communications we believe may be of interest to you. For more information about how targeted advertising works, you can visit the Network Advertising Initiative’s (“NAI”) educational page at http://www.networkadvertising.org/understanding-online-advertising/how-does-it-work.You can opt out of targeted advertising here:FACEBOOK - https://www.facebook.com/settings/?tab=adsGOOGLE - https://www.google.com/settings/ads/anonymousBING - https://advertise.bingads.microsoft.com/en-us/resources/policies/personalized-adsAdditionally, you can opt out of some of these services by visiting the Digital Advertising Alliance’s opt-out portal at: http://optout.aboutads.info/. TEXT MARKETING & NOTIFICATIONS By entering your phone number in the checkout and initialising a purchase, subscribing via our subscription form or a keyword, you agree that we may send you text notifications (for your order, including abandoned cart reminders) and text marketing offers. You acknowledge that consent is not a condition for any purchase. If you wish to unsubscribe from receiving text marketing messages and notifications reply with STOP to any mobile message sent from us or use the unsubscribe link we provided you with in any of our messages. You understand and agree that alternative methods of opting out, such as using alternative words or requests will not be accounted as a reasonable means of opting out. Message and data rates may apply. For any questions please text HELP to the number you received the messages from. You can also contact us for more information. If you wish to opt out please follow the procedures above.DO NOT TRACK Please note that we do not alter our Site’s data collection and use practices when we see a Do Not Track signal from your browser.DATA RETENTION When you place an order through the Site, we will maintain your Order Information for our records unless and until you ask us to delete this information.CHANGES We may update this privacy policy from time to time in order to reflect, for example, changes to our practices or for other operational, legal or regulatory reasons.CONTACT US For more information about our privacy practices, if you have questions, or if you would like to make a complaint, please contact us by e-mail at hello@ablebrewing.com or by mail using the details provided below:1204 SE Water Ave Suite 15, Portland, OR, 97214, United States {% if box.template.id == 1 or box.template.id == '1' %} <div id="{{box.id}}" data-title="{{box.title.text | escape}}" class="ga ga-template_1 ga-products-box ga-template_themeid_855"> {% if box.title and box.title.text and box.title.text != '' %}<h2 class="ga-title section-title "><span>{{box.title.text}}</span></h2>{% endif %} {% if box.subtitle and box.subtitle.text and box.subtitle.text != '' %}<div class="ga-subtitle">{{box.subtitle.text}}</div>{% endif %} <div class="ga-products"> <div class="ga-carousel_wrapper"> <ul class="ga-carousel gowl-carousel" data-products-count="{{products.size}}"> {% for product in products %} {% assign first_available_variant = false %} {% for variant in product.variants %} {% if first_available_variant == false and variant.available %}{% assign first_available_variant = variant %}{% endif %} {% endfor %} {% if first_available_variant == false %}{% assign first_available_variant = product.variants[0] %}{% endif %} {% if product.images[0] %} {% assign featured_image = product.images[0] | img_url: '350x' %} {% else %} {% assign featured_image = no_image_url | img_url: '350x' %} {% endif %} <li class="ga-product" data-product-id="{{product.id}}"> <a{% if settings.new_tab %} target="_blank"{% endif %} href="/products/{{product.handle}}"> {% if box.template.elements contains 'saleLabel' and first_available_variant.compare_at_price > first_available_variant.price %} <span class="ga-label ga-label_sale">{{translation.sale}}</span> {% endif %} {% unless product.available %} <span class="ga-label ga-label_sold">{{translation.sold_out}}</span> {% endunless %} <div class="ga-product_image ga-product_image_{{product.id}}" id="ga-product_image_{{product.id}}" style="background-image: url('{{featured_image}}')"><span></span></div> </a> <a class="ga-product_title "{% if settings.new_tab %} target="_blank"{% endif %} href="/products/{{product.handle}}">{{product.title}}</a> {% assign variants_size = product.variants | size