title = "Featured Coffee: Market Lane Ngamba – Able"
description = "Ngamba is a washed process coffee from Kenya, roasted by Market Lane Coffee in Australia. Their tasting notes are blackcurrant and lime with an orange sweetness. We chose to brew this coffee on the Kone with a 1:15 ratio of coffee to water. Our recipe: 20g coffee — medium grind300g water — just off boil 30 second bloom"
full_description = 'Now reading: Featured Coffee: Market Lane Ngamba PrevNext January 01, 2021Featured CoffeeFeatured Coffee: Market Lane Ngamba Ngamba is a washed process coffee from Kenya, roasted by Market Lane Coffee in Australia. Their tasting notes are blackcurrant and lime with an orange sweetness. We chose to brew this coffee on the Kone with a 1:15 ratio of coffee to water. Our recipe: 20g coffee — medium grind300g water — just off boil 30 second bloom (50g)Finished pouring at 2:10Finished draining at 2:35 Tasting notes: One quality we often find (and deeply appreciate) in great Kenyan coffees is a mouthwatering aspect — the feeling of, having taken a sip, immediately desiring another. This coffee has that in spades. The flavors are blackberry, citrus, and cola — and like cola, we found this coffee to have a slight effervescence that makes it even more irresistible. Notes of brown sugar on the finish. Our take: An irresistible, addictive, mouthwatering Kenyan coffee. One of our favorites of the year. <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/DSCF2608_600x.jpg?v=1609892409" alt="Featured Coffee: Luna Disco Marmalade"> Featured Coffee Featured Coffee: Luna Disco Marmalade <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/DSCF2608_600x.jpg?v=1609892409" alt="Featured Coffee: Luna Disco Marmalade"> Featured Coffee Featured Coffee: Luna Disco Marmalade <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/DSCF2608_600x.jpg?v=1609892409" alt="Featured Coffee: Luna Disco Marmalade"> Featured Coffee Featured Coffee: Luna Disco Marmalade <img class="ArticleItem__Image" src="//ablebrewing.com/cdn/shop/articles/DSCF2608_600x.jpg?v=1609892409" alt="Featured Coffee: Luna Disco Marmalade"> Featured Coffee Featured Coffee: Luna Disco Marmalade'
