rewing.com\/cdn\/shop\/files\/chemex-kone_7625afa6-d34d-4699-a756-d2c8222193ba.png?v=1710362064"},"aspect_ratio":1.0,"height":2400,"media_type":"image","src":"\/\/ablebrewing.com\/cdn\/shop\/files\/chemex-kone_7625afa6-d34d-4699-a756-d2c8222193ba.png?v=1710362064","width":2400},{"alt":null,"id":26087977648197,"position":6,"preview_image":{"aspect_ratio":1.0,"height":2400,"width":2400,"src":"\/\/ablebrewing.com\/cdn\/shop\/files\/kone-black-1_7db5bed5-3056-4e74-bf4a-d8e0eb5c934d.png?v=1710362176"},"aspect_ratio":1.0,"height":2400,"media_type":"image","src":"\/\/ablebrewing.com\/cdn\/shop\/files\/kone-black-1_7db5bed5-3056-4e74-bf4a-d8e0eb5c934d.png?v=1710362176","width":2400},{"alt":null,"id":26088580087877,"position":7,"preview_image":{"aspect_ratio":1.0,"height":2400,"width":2400,"src":"\/\/ablebrewing.com\/cdn\/shop\/files\/kone-black-alt1.jpg?v=1710362176"},"aspect_ratio":1.0,"height":2400,"media_type":"image","src":"\/\/ablebrewing.com\/cdn\/shop\/files\/kone-black-alt1.jpg?v=1710362176","width":2400},{"alt":null,"id":26088580120645,"position":8,"preview_image":{"aspect_ratio":1.0,"height":2400,"width":2400,"src":"\/\/ablebrewing.com\/cdn\/shop\/files\/kone-black-alt2.jpg?v=1710362176"},"aspect_ratio":1.0,"height":2400,"media_type":"image","src":"\/\/ablebrewing.com\/cdn\/shop\/files\/kone-black-alt2.jpg?v=1710362176","width":2400},{"alt":null,"id":26088580153413,"position":9,"preview_image":{"aspect_ratio":1.0,"height":2400,"width":2400,"src":"\/\/ablebrewing.com\/cdn\/shop\/files\/kone-black-alt3.jpg?v=1710362054"},"aspect_ratio":1.0,"height":2400,"media_type":"image","src":"\/\/ablebrewing.com\/cdn\/shop\/files\/kone-black-alt3.jpg?v=1710362054","width":2400},{"alt":null,"id":26088580186181,"position":10,"preview_image":{"aspect_ratio":1.0,"height":2400,"width":2400,"src":"\/\/ablebrewing.com\/cdn\/shop\/files\/kone-black-alt4.jpg?v=1710362054"},"aspect_ratio":1.0,"height":2400,"media_type":"image","src":"\/\/ablebrewing.com\/cdn\/shop\/files\/kone-black-alt4.jpg?v=1710362054","width":2400}],"requires_selling_plan":false,"selling_plan_groups":[],"content":"\u003cp style=\"text-align: center;\" class=\"medium-text\"\u003e\u003cstrong\u003eFree 3-Day Shipping \u0026amp; Free Returns\u003c\/strong\u003e\u003c\/p\u003e\n\u003chr\u003e\n\u003cp\u003eBrew cafe quality coffee without the fuss or waste of traditional paper filters. The Kone has been carefully engineered to make brewing delicious pour over coffee at home a breeze, while living up to the rigorous standards of the best cafes. The Kone fits perfectly inside your 6, 8 or 10 cup Chemex coffee maker, and the Ratio Glass Carafe.\u003c\/p\u003e\n\u003cul\u003e\n\u003cli\u003eFits 6, 8 and 10 cup Chemex coffee makers.\u003c\/li\u003e\n\u003cli\u003eAlso fits Ratio Eight, Technivorm Moccamaster and Bonavita automatic drip brewers.\u003c\/li\u003e\n\u003cli\u003eDesigned by Able in Portland, Oregon. Assembled in China.\u003c\/li\u003e\n\u003cli\u003eCertified food-safe.\u003c\/li\u003e\n\u003cli\u003e5 1\/8\" diameter, 4\" height.\u003c\/li\u003e\n\u003cli\u003eAvailable in stainless steel and black titanium coated stainless steel.\u003c\/li\u003e\n\u003c\/ul\u003e"}, "selected_variant_id": 41128698314821 } Free 3-Day Shipping & Free Returns Brew cafe quality coffee without the fuss or waste of traditional paper filters. The Kone has been carefully engineered to make brewing delicious pour over coffee at home a breeze, while living up to the rigorous standards of the best cafes. The Kone fits perfectly inside your 6, 8 or 10 cup Chemex coffee maker, and the Ratio Glass Carafe. Fits 6, 8 and 10 cup Chemex coffee makers. Also fits Ratio Eight, Technivorm Moccamaster and Bonavita automatic drip brewers. Designed by Able in Portland, Oregon. Assembled in China. Certified food-safe. 5 1/8" diameter, 4" height. Available in stainless steel and black titanium coated stainless steel. /* This is a bit hacky but allows to circumvent the complete independency of section (as next section included in the page does not know anything about this page) */ @media screen and (max-width: 640px) { #shopify-section-product-template + .shopify-section--bordered { border-top: 0; } #shopify-section-product-template + .shopify-section--bordered > .Section { padding-top: 0; } } No Paper Filter Fuss The Kone brews a full-bodied cup of coffee, rich with oils and flavors normally trapped by paper filtration, and doesn’t impart unwanted flavors. And unlike paper filters, the Kone produces no paper waste. Simply rinse and repeat. <img src="//ablebrewing.com/cdn/shop/files/kone-no-paper-filter-fuss-image_800x.jpg?v=1618329010" alt=""> <img src="//ablebrewing.com/cdn/shop/files/kone-meticulously-engineered-image_800x.jpg?v=1618329011" alt=""> Meticulously Engineered Every last detail of the Kone has been painstakingly engineered to help you brew a delicious cup of coffee. Its singular design and unique features facilitate an even, controlled flow of water through the coffee grounds for better extraction and consistent flavor. Built to Last Constructed from a single piece of precision-welded, photo chemically etched stainless steel and an injection-molded, food-safe polymer support ring, the Kone is built to stand up to the daily demands of the cafe and your home. <img src="//ablebrewing.com/cdn/shop/files/kone-built-to-last-image_800x.jpg?v=1618329011" alt=""> <img src="//ablebrewing.com/cdn/shop/files/kone-easy-to-clean-image_800x.jpg?v=1618329011" alt=""> Easy to Clean A quick rinse and occasional scrub keeps the Kone in tip-top shape. Unlike other reusable filters made with cloth, mesh, and gimmicky construction, the Kone’s elegant, single-layer design prevents build up of oils and sediment. Available in Black Titanium Kone is now available in a stunning, black titanium-coated stainless steel with black polymer support ring. Works with Chemex and with Ratio's new Glass Carafe in Smoke Grey. <img src="//ablebrewing.com/cdn/shop/files/kone-black-feature_800x.jpg?v=1710361162" alt=""> Kone Details Made for ChemexKone was designed to nestle perfectly atop your Chemex coffee maker for a perfect fit.Square-to-Round Hole DesignPhoto chemically etched square-to-round hole design reduces clogging and creates an even flow of water through your grounds.Graduated Density Hole PatternKone's unique hole pattern optimizes water flow rate for both smaller brews and larger batches.Polished Stainless SteelBright polished stainless steel imparts no unwanted flavor, and prevents build up of coffee oils that can become rancid and bitter.Blunt Safety TipPrecision-welded blunt tip makes handling safe and creates a tight seal with no slits or gaps.Durable Support RingDurable support ring nestles perfectly atop your Hario V60 dripper and makes it easy to remove after each brew. Created by Coffee Pros Able’s line of reusable coffee filters are widely celebrated among coffee pros. Able’s first product, the Kone, was designed by coffee veteran Keith Gehrke, and made its debut in 2011 at Coava '''
