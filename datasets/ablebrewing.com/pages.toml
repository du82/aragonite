 cafe quality coffee without the fuss or waste of traditional paper filters. The Kone Mini has been carefully engineered to make brewing delicious coffee at home a breeze, while living up to the rigorous standards of the best cafes. The Kone Mini fits perfectly inside your Hario V60 02 coffee maker. Fits all Hario V60 02 coffee drippers. Certified food-safe. 4" diameter, 3" height. Designed by Able in Portland, Oregon. Assembled in China. /* This is a bit hacky but allows to circumvent the complete independency of section (as next section included in the page does not know anything about this page) */ @media screen and (max-width: 640px) { #shopify-section-product-template + .shopify-section--bordered { border-top: 0; } #shopify-section-product-template + .shopify-section--bordered > .Section { padding-top: 0; } } No Paper Filter Fuss The Kone Mini brews a full-bodied cup of coffee, rich with oils and flavors normally trapped by paper filtration, and doesn’t impart unwanted flavors. And unlike paper filters, the Kone Mini produces no paper waste. Simply rinse and repeat. <img src="//ablebrewing.com/cdn/shop/files/no-paper-filter-fuss-image_c81101c4-7d7c-4fbe-bede-ac3fab9d2f5d_800x.jpg?v=1618442959" alt=""> <img src="//ablebrewing.com/cdn/shop/files/built-to-last-image_800x.jpg?v=1617892369" alt=""> Meticulously Engineered Every last detail of the Kone Mini has been painstakingly engineered to help you brew a delicious cup of coffee. Its singular design and unique features facilitate an even, controlled flow of water through the coffee grounds for better extraction and consistent flavor. Built to Last Constructed from a single piece of precision welded, photo-chemically etched stainless steel and an injection-molded, food-safe polymer support ring, the Kone Mini is built to stand up to the daily demands of the cafe and your home. <img src="//ablebrewing.com/cdn/shop/files/meticulously-engineered-image_800x.jpg?v=1617891927" alt=""> <img src="//ablebrewing.com/cdn/shop/files/easy-to-clean-image_800x.jpg?v=1617892369" alt=""> Easy to Clean A quick rinse and occasional scrub keeps the Kone Mini in tip-top shape. Unlike other reusable filters made with cloth, mesh, and gimmicky construction, the Kone Mini’s elegant, single-layer design prevents build up of oils and sediment. Kone Mini Details Made for Hario V60Kone Mini was designed to nestle perfectly atop any Hario V60 02 coffee dripper for a perfect fit.Square-to-Round Hole DesignPhoto chemically etched square-to-round hole design reduces clogging and creates an even flow of water through your grounds.Graduated Density Hole PatternKone Mini's unique hole pattern optimizes water flow rate for both smaller brews and larger batches.Polished Stainless SteelBright polished stainless steel imparts no unwanted flavor, and prevents build up of coffee oils that can become rancid and bitter.Blunt Safety TipPrecision-welded blunt tip makes handling safe and creates a tight seal with no slits or gaps.Durable Support RingDurable support ring nestles perfectly atop your Hario V60 dripper and makes it easy to remove after each brew. Kone Mini Video Created by Coffee Pros Able’s line of reusable coffee filters are widely celebrated among coffee pros. Able’s first product, the Kone, was designed by coffee veteran Keith Gehrke, and made its debut in 2011 at Coava Coffee’s brew bar in Portland, OR. Able’s reusable filters are now used in homes, cafes and competitions around the world. Customer Reviews You May Also Like <img class="ProductItem__Image ProductItem__Image--alternate" src="//ablebrewing.com/cdn/shop/products/cleaner-10_600x.png?v=1625073385" alt="Urnex Cleaning Powder Packets"> <img class="ProductItem__Image" src="//ablebrewing.com/cdn/shop/products/cleaner_179e8a09-db15-4881-aea8-4b413c1d0593_600x.png?v=1625073385" alt="Urnex Cleaning Powder Packets"> Sold out Urnex Cleaning Powder Packets Coffee equipment cleaner From $2 <img class="ProductItem__Image ProductItem__Image--alternate" s