Overview
The AeroPress is ideal for any coffee lover looking for a rich and smooth cup of coffee without acidity or bitterness. Brews one to three delicious cups of American or espresso style coffee in about a minute, and clean up takes only a few seconds. It’s a great addition to any kitchen but since it is durable, lightweight, and compact, the AeroPress also makes the perfect companion when traveling, camping, or just going to work. Includes: 350 filters, filter cap, filter holder, stirrer and scoop."""
