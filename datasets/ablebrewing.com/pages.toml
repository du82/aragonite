title = "Chemex 6 Cup Coffee Maker – Able"
description = '''
Overview
The Chemex® coffeemaker is an elegant, one-piece, hourglass shaped vessel made of high quality, heat resistant glass. And it's the pour over coffeemaker we originally designed the Able Kone to function seamlessly with.
Features

Made of non-porous Borosilicate glass which will not absorb odors or chemical residues.
Graceful, sturdy glass handle.
Works seamlessly with the Able Kone coffee filter. 

Specs

Capacity: 30 oz
