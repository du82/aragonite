title = "Able Disk - Reusable Coffee Filter for AeroPress"
description = "Overview The DISK Coffee Filter is a reusable filter designed to be used with the AeroPress® Coffee Maker. This allows more oils and a fuller bodied cup of coffee when used with the AeroPress®. Eliminates the need for paper filters, which is especially convenient when traveling. The Disk is available in two different options. Standard: Fuller body cup of coffee with a bit more fines. Thicker and should last many years of heavy use and is very hard to bend/damage. 254 micron hole size.  Fine: Very sweet clean cup of coffee with very little fines to none at all. It is thinner (1/3 of the Standard) and should be handled with care as bending/damage is more likely. 152 micron hole size  Fine XL: Fits the newer Aeropress® XL Coffee Maker. 152 micron hole size.  Features 304 Stainless Steel  Fits AeroPress® Coffee Makers 100%"
