["https://ablinger.mur.at/engl.html"]
title = "english texts"
description = "Peter Ablinger - english texts"
full_description = '''Christian Scheib: PETER ABLINGER/STATIC'S MUSIC/NOISE INQUIRIES 1997/98 RECITATIVE AND ARIA There're at base only 2 things: recitative and aria. Or said differently: telling a story (narrative) and stopping time. Or put yet another way: the consecutive, the 1-after-the-other, and the simultaneous, the all-at-once. The first in all these examples (the sequence, the succession) lets itself be reduced to a common denominator: language. The second does not; locked up with it is the indescribable, the unspeakable, the unutterable. At times I think this second might also be called music. No sense but hearing is so little tied to linearity. No other sense is so intensely capable of the simultaneous. And yet only rarely has music been prepared to make use of this capability. So often being only the obsequious servant of language. And is still. We represent even the unutterable as speakable, even eternity after the model of language: as a 'stretch'. As the spinning apart from beginning and end. As thinning (an infinitely thin line), dilution. I maintain the opposite. That eternity is everything at once. Is beginning (taking up, starting) and ending (stopping) now in this instant. Is the condensed, compressed, infinitely thick Now of this moment - in every moment. And the series of these moments again and again in every moment. Now and always. All music simultaneously - this would be the waterfall, (white) Noise. All symphonies and operas at once, all the jazz solos ever played and that ever will be, every drum rhythm that can be beaten anywhere, every 'good night' song, even that which is sung and forgotten. And yet what we perceive is not this Everything. What we hear is not really that Noise. We make a selection. We do what Debussy has said: I start with all the notes, keep out the ones I don't like, and let in the ones I do. This selection is our being. When we stand at a waterfall, we perceive our thoughts and ideas, but not the waterfall itself; and if it succeeds in quieting our minds, letting our thoughts rest, we hear a melody in the din. Each his own! What happens here is MADE by no one. It is instead through Noise, by It, MADE-POSSIBLE. Putting the realization of this 'making-possible' of Being, this selection, this enabling, before 'making' exists as an attitude in the arts. Above all in pre-historic (pre-literate!) art: one doesn't 'create', one makes no 'works', one makes only an arrangement of what is (one sets up a circle of stones, one beats on a drum, one repeats the same syllable again and again) - an arrangement, an order, within which something can happen - through which some-thing can pass. This idea is preserved in Eastern European icons. And at times finds itself in newer art. Not counting(-on), registering, the DIFFERENT, but instead the SAME, through which the ONE can be manifest. transl. by Bill Dietz HEARING IS THE WORK (from Catalogue "Sonoric Perspectives", Kunsthalle Rostock 2006) Hearing is the work. The path of the sun from rising to setting describes a line on an open field in Rümlingen, Switzerland, on which 36 chairs and 6 bamboo plants are set up. (Chairs, Bamboo, Sunrise, Sunset, 1996/97) The axes of listening and viewing are aligned with this path -- oriented along sunbeams. Chairs in the landscape become a part of a larger sculpture that combines motives of Land Art with those of conceptual composition. Hearing and observing, and the orienting of these two important senses in nature: this motive can be found in the most various of forms throughout the work of the composer and experimental sound artist Peter Ablinger (born in Austria, 1959) whenever the question is of extracting aesthetic qualities from the sounds of nature in the landscape. Indeed, the more unspecific the sound configuration presents itself, the greater seems the challenge to get to the bottom of it. This is particularly clear in Ablinger's musical works devoted to the phenomenon of white noise. ON THE PHOTO PIECES OF THE SERIES SEEING AND HEARING "In 1994 I was searching for a way to significantly increase sound density -- as in "Der Regen, das Glas, das Lachen" -- that would also allow me to continue collaborating with instrumentalists. "Significantly" meaning, I had a conception of sound comparable to noise: in which individual events would become colors. I was close to the solution that eventually led to the IEAOV pieces when I began taking photographs with extended exposure time and while moving the camera: movements in space that condensed into color spectra. ("Seeing and Hearing") For me, these photos were in no way visual art. And yet, the soon to follow condensification pieces for instruments and electronics (IEAOV) were always more like huge colored plates than music -- huge colored plates that nevertheless, were composed for the concert hall... However, if in the beginning the photos were studies for the concert pieces, they later asserted themselves as an independent and self-sufficient series of works --which, to me, only make sense when I consider them as music: when I, so to speak, hear them -- or maybe better: when I must provide them with a further, additional sense, a sense where seeing has only a preparatory function and where hearing becomes and extra-physical process..." (P.A. 11/02, engl. version edited by Bill Dietz) RAIN, GLASS, LAUGHING "Der Regen, das Glas, das Lachen" for 25 instrumentalists: this marks the juncture of a one tone piece and white noise. The constituent polymetric one tone piece takes 20 minutes to "glissando" once through the octave and in the process turns into an all tone piece, while the total sound passes in stages through 6 further layers of simultaneous sound until it arrives at a single level of white noise. The simultaneity of the graduation from coarsegraininess (tone) to fine-graininess (= more compactness, more noise) right down to the surface (white noise) is maintained - potentially - from start to finish. This means that what is played is extremely dense and a large part of the orientation is left to the listener. Over long periods he is left alone to listen in to the various levels of the piece, to find his way IN THE SOUND. This process of listening in is an essential part of the piece itself, the actual event, the reason it Game into being. No-one is "forced" when listening to select or distinguish between the different levels when listening to the piece. Nor is THE SOUND of the piece made up of its individual levels. I would like to say, IT OCCURS beyond the levels, through the levels, and in the ears of the listener. This is where "melodies" are created which do not feature in any of the layers, but which for example begin with a sound in layer 6, immediately followed by one in layer 4 and then in 3, only to end in layer 5. One might say that the process of listening does not run "along" the axis of chronological time but takes place "across" time. Or that it expands instead of remaining on a line. In this sense, it is a "kind of spectralisation of attention". And as a listener I enjoy oscillating between the different forms of listening - including that of absence. transl. Anne Durand and Mark Court'''
author = "Peter Ablinger"
year_published = 2025
clearnet = "https://ablinger.mur.at/engl.html"
