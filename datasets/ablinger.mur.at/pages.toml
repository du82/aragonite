["https://ablinger.mur.at/docu13.html"]
title = "Schaufensterstück"
description = "Peter Ablinger - Schaufensterstück"
full_description = '''PETER ABLINGER - SCHAUFENSTERSTÜCK "display-window piece" drawing for "Schaufensterstück" Constructor of the Computer Controlled Piano Player: Winfried Ritsch Software design: Thomas Musil, IEM Graz Quadraturen III "Wirklichkeit" is, in opposition to the otherwise fixed and finished Quadraturen I, II, IV and V, an open work - or, itself a series within the series. Therefore, Quadraturen III consists of an open number of installation- and concert-pieces for computer-controlled piano, all of them concerned with the reproduction of concrete sounds, street noise, speech, -reality -, via the sound-repertoire of the piano. WP: Medienkunstlabor, Kunsthaus Graz, 2004 One of it's pieces, the "Schaufensterstück", is an interactive real-time version: a microphone picks up input outside, the piano realizes this input inside in real-time. My main concern is not the literal reproduction itself but precisely this border-zone between abstract musical structure and the sudden shift into recognition - the relationship between musical qualities and "phonorealism": the observation of "reality" via "music". > listen Detail 1 recorded at Medienkunstlabor, Graz, Austria, Oct 21, 2004 (1126 KB) > listen Detail 2 recorded at Medienkunstlabor, Graz, Austria, Oct 22, 2004 (1046 KB) "Was wir Realität nennen, stützt sich im Wesentlichen auf die Kohärenz unserer Sinneswahrnehmungen (George Pennington). Das heißt, daß zwischen unseren Sinneswahrnehmungen ein Bestätigungszusammenhang herschen muß; unsere Augen müßen bestätigen was unsere Ohren hören." "... Du hast noch nach dem "Schaufensterstück" gefragt. Das Schaufensterstück ist gewissermaßen eine Oper, weil es um das Verhältnis von Hören und Sehen geht. Wir haben also ein Schaufenster, drinnen das computergesteuerte Klavier, draußen, über dem Schaufenster ein Mikrofon, das die Klänge von der Strasse an den Computer weiterleitet, der diese in Echtzeit auf Klaviertöne überträgt. Das Klavier spielt also das, was draußen gerade passiert. Die Besucher befinden sich ebenfalls drinnen und sehen durch das Schaufenster gleichzeitig das, was das Klavier in chromatische Klänge überträgt. Nun, in dem oben beschriebenen Sinne bleibt diese Übertragung immer nur ein Annäherungsversuch, und der Zusammenhang zwischen dem Gesehenen und dem Gehörten ist unterschiedlich offensichtlich: Manchmal sind die Klaviertöne und das Geschehen auf der Strasse ganz leicht miteinander zu identifizieren, manchmal bleibt der Zusammenhang ein Rätsel. Immer aber können wir unseren eigenen Versuch beobachten, überhaupt einen Zusammenhang herstellen zu wollen (- zumindest solange wir uns auf das Stück konzentrieren). Und das als Wahrnehmungsarbeit beobachten, was uns normalerweise als Selbstverständlichkeit gar nicht auffällt: die Arbeit unseres Gehirns an der Synchronizität von Sehen und Hören." aus: Trond Olav Reinholdtsen: "Die Klänge interessieren mich nicht", E-mail-Interview mit Peter Ablinger, Musiktexte, 2006, Nr.111 Frequence grid: semitones Time grid: variable Reproduced on a piano design and construction of the auto-piano player: Winfried Ritsch construction assistance for the auto-piano player: Peter Plessas software development: IEM Graz, Thomas Musil realtime controls: Winfried Ritsch Requirements: any piano, plus the auto-piano player, distributed by Zeitvertrieb Wien Berlin the weight of the auto-piano player is just 55kg it can be attached to any piano the controlling computer comes from Winfried Ritsch, Graz, Austria, who is also required for set-up of the instrument duration of attachment: 2-3 hours duration of detachment: 20 minutes > see also documentation of QUADRATUREN I-V > see also G. Douglas Barrett: WINDOW PIECE: Seeing and Hearing the Music of Peter Ablinger, 2010, as download-document: pdf (52 KB) > DVD drawings: Peter Ablinger, photos: Maria Tr�an, english version edited by Bill Dietz'''
