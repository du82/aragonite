["https://ablinger.mur.at/txt_ruido.html"]
title = "Ruido"
description = "El ruido blanco contiene todas las frecuencias, y - poéticamente hablando - toda la música"
full_description = '''Peter Ablinger: RUIDO Traducido por Sergio Bové Todo Siempre El ruido (Ruido blanco) es la totalidad de los sonidos - "todo siempre" en su representación acústica. Comparable a la luz blanca que contiene todos los colores, el ruido blanco contiene todas las frecuencias, y - poéticamente hablando - toda la música. El espejo Por lo tanto, el Ruido es la máxima densidad, la máxima información. Pero también es lo opuesto: la no información, la máxima redundancia. Para mí es menos que nada, menos que el silencio. Hace tiempo que el silencio dejó de ser el silencio. Actualmente está repleto. Sentimentalmente lleno de ideas y de recuerdos (de la vida privada, la religión, la naturaleza y dentro de la música: John Cage). Además, la idea de Ruido no está vacía: existe el océano, el sonido de los árboles producido por el viento, una vieja radio analógica sintonizada entre dos estaciones. La diferencia entre silencio y Ruido se torna clara cuando nos exponemos a él, cuando lo "escuchamos". Cage nos ense�ó la cantidad de cosas que dejamos de escuchar cuando escuchamos el silencio, que el silencio no existe del todo. Sin embargo, estar expuesto al llano ruido blanco es diferente. No es sólo que ya no escuchamos las quejas del estómago de nuestro vecino. La razón por la cual escuchamos "menos que nada" es que no nos podemos conectar a él sólo por medio de la escucha. Simplemente es demasiado. No podemos hacer nada con él. Lo único que se puede hacer es producir ilusiones, es decir, escuchar algo "en" el ruido que no está allí, algo que puede ser percibido sólo individualmente - proyectar nuestra propia imaginación sobre esa "pantalla" blanca. De esta manera, el Ruido funciona como un espejo, reflejando sólo lo que proyectamos en él. El Plano Otro aspecto que me condujo hacia el Ruido ("ruido superficie"), o hacia sonidos con una alta densidad espectral y relativa envolvente estática, fue el deseo por el plano. El plano en el sentido de un gran campo de color como en Barnett Newman; el plano como opuesto a la figura (Gestalt). En el comienzo de los 90', unos cuarenta a�os después de "Onement I", no había nada en música que se pareciera a esta idea. Ligeti vislumbró la potencialidad estructural del plano en este sentido, pero no le interesó. Él se interesó por la forma dinámica, por la envolvente dramática de las masas orquestales. La quinta de La Monte Young, de 1960, estuvo, por así decirlo, en contacto con el plano, y fue probablemente la música más carente de figura (gestaltlos) con relación a ese punto. Pero en oposición a lo sin forma (Gestaltlosigkeit) de Ligeti, se cumplimentó aquí en categorías temporales; la dimensión vertical (espectral) se mantiene sobre la identidad y la definición de un intervalo musical, un fuerte recuerdo de la tradición de la Gestalt musical. �Pero qué sería un plano en la música? �Una superficie? �Blanco o azul? Preguntémonos primero por el blanco. Ya encontramos la equivalencia entre "blanco" y "todo siempre". Normalmente imaginamos la superficie como limitada. Como no podemos limitar los límites del espectro (para aún permanecer "blanco"), hemos dejado el tiempo para ser definido y cuantificado. Con estas preguntas realmente comenzamos a aproximarnos a la cuestión. (Pero lo anticiparé aquí: aunque vuelva a estas preguntas una y otra vez, pienso que no podrían responderse en un sentido estricto. El paralelo entre las categorías visuales y musicales no se pueden llevar a cabo para una solución satisfactoria. Y eso es exactamente lo que nos salvará. En un punto nos tenemos que separar de las categorías visuales y deberíamos darnos cuenta de que el Ruido es uno de los elementos excepcionales de la acústica que NO se orignan en el dominio visual. Por el contrario, el Ruido - vía la teoría de la información - se ha infiltrado en la lengua vernácula como una metáfora y actualmente significa todo lo relacionado con la redundancia y la contingencia, los residuos incomunicables de la figura y la información.) RUIDO / HIPÓTESIS (1991-95) Traducción: Alberto C. Bernal (PDF 29 KB) Música estática - Investigaciones sobre el ruido (1997/98) Características de la obra de Peter Ablinger por Christian Scheib Traducción: Sergio Bové > escuchar: cascada, fecha de grabación: 12/1990 > escuchar "Estudio para Rauschen" de 1986 > escuchar "Rauschen, Estudio para Violín" 1992 > escuchar "Rauschen, Estudio para Trompeta" 1992 > escuchar "Rauschen, Estudio para Flauta" 1992 > escuchar "Rauschen, Estudio para Tuba" 1994 > escuchar "Liste 3" (lista 3) para Saxofón y Trompeta, de "13 Rauschlisten" (13 listas de ruido) 1992 > escuchar "Liste 12" (lista 12) para fl, sax, trp, perc, vl, cb, de "13 Rauschlisten" (13 listas de ruido) 1992 WEISS / WEISSLICH 7a: Rauschempfänger (1994) WEISS / WEISSLICH 7b: Rauschen (1998)'''
