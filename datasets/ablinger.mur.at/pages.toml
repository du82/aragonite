["https://ablinger.mur.at/franz.html"]
title = "textes françaises"
description = "Peter Ablinger - textes françaises"
full_description = '''peter ablinger - textes françaises Au sujet de Peter Ablinger: "Les sons ne sont pas des sons! Leur rôle est de détourner l'attention de l'intellect et d'adoucir les sens. Même entendre n'est pas entendre: entendre est ce qui me crée ." Peter Ablinger, né en 1959 à Schwanenstadt en Autriche, est selon Christian Scheib, un "mystique de l'élucidation" dont les "appels et les litanies aspirent à la connaissance". Mais en même temps, le compositeur qui, suite à des études d'arts graphiques, a étudié auprés de Gösta Neuwirth et de Roman Haubenstock-Ramati et vit depuis 1982 à Berlin, est un sceptique, pleinement conscient des règles du jeu culturelles et des (mauvaises) habitudes imposées par la tradition: "Continuons donc à jouer en affirmant que les sons sont lá pour entendre (et non pas pour être entendus, c'est autre chose), et entendre pour écouter. Je n'en sais pas plus." (Christian Baier) QUADRATURES V "MUSIQUE" pour orchestre (1997-2000) J'appelle "Quadraturen" (Quadratures) une méthode servant à la représentation de tout type d'enregistrements sonores; cette méthode peut être comparée au quadrillage de la définition des photos. La fréquence f et le temps t sont décomposés en un schéma de petits champs sonores dont le format est, par exemple, d'l seconde (temps) fois 1 seconde (intervalle). L'application technique fut d'abord inspirée par le filtre à ton du Studio expérimental de Fribourg, dont la fonction "Freeze" peut être interprétée comme un quadrillage spectral. Grâce à une invitation de l'IEM de Graz, j'eus la possibilité de réaliser mes idées dans les conditions individuelles les meilleures qui soient (Robert Höldrich, Winfried Ritsch, Thomas Musil). Dans un premier temps fut construit un filtre à demi-ton avec l'option variabilité fondamentale de la largeur des intervalles. Suivit alors la réalisation de la définition temporelle comme d'un enchaînement plus ou moins rapide d'analyses statiques sur l'intégralité du spectre. Début 1997, les premières grilles bidimensionnelles en temps réel étaient réalisables. C'est de cette même époque que date le projet, lequel s'étendit jusqu'à la fin de la même année pour devenir une vaste entreprise. Réalisées, en projet ou en préparation (2000): Quadraturen I "Portrait urbain Graz" (2 versions) "La langue est" - Etudes préalables sur support sonore Quadraturen II "Allocutions du XX. siècle" - Morceau d'installation pour six haut-parleurs sur socles élevés, à partir de discours de Hitler, Lénine, Kennedy, Fidel Castro, Gandhi, Martin Luther King Quadraturen III "Réalité" - Etudes pour piano mécanique Quadraturen IV "Autoportrait avec Berlin" - pour ensemble et CD ajouté Quadraturen V "Musique" - pour orchestre Aux Quadraturen V participent essentiellement l'IEM Graz, Nader Mashayekhi et Thomas Musil, avec lequel j'ai produit la plupart des morceaux de ces dernières années. A ma mort, il prétendra avoir lui-même composé tous mes morceaux - et il a raison! Je décris donc par la suite ce qu'il a composé: Quadraturen V est - en tant que composition - une machine à composer des morceaux pour orchestres. A une extrémité, j'introduis une cassette sur laquelle est enregistré n'importe quoi... De l'autre côté de la machine sort la partition terminée - quel bonheur! Quoi qu'il en soit: la composition n'est pas seulement faite de ce qui ressort à la fin, elle est - aussi - le processus de production même: de la conception jusqu'à l'élaboration de la partition et des voix pour orchestres en passant par la transformation de données analytiques en valeurs de notes. Le mode de production peut tout à fait être lu comme une réponse à l'orchestre. Celui-ci est un appareil de reproduction et non de production. Dans Quadraturen V, la reproduction elle-même est devenue l'objet de la reproduction. L'objet de la Quadrature - de la Rasterung d'un matériau sortant en vue d'une reproduction par les instruments de l'orchestre - n'est pas cette fois un bruit environnant ni une langue, c'est de la musique - de la musique, car ainsi est donnée une vague chance de reconnaître le matériau sortant. Il s'agit de produire un non-endroit entre "entendre seulement le son" et "se souvenir d'un objet musical". Non-endroit, parce que cet endroit n'existe pas: on parvient tout au plus à osciller entre l'écoute et le souvenir. L'objet est l'hymne de l'ancienne RDA composée par Hanns Eisler, dont sont extraites dix fois une phrase. L'objet devait être connu pour qu'il puisse évoquer un souvenir. L'alternance des temps de quadrillages en constellations différentes fait en sorte que la reconnaissance soit tantôt plus facile, tantôt plus difficile. Le quadrillage spectral en revanche reste invariablement de 3/4 de ton, c'est-à-dire de 8 tons par octave. Ceci est proche des sept tons "non équidistants" de la gamme diatonique, mais à la fois aussi assez loin. L' "original" n'est donc pas complètement saisissable, au contraire. Il s'approche juste suffisamment du rideau, pour aussitôt redisparaître. (J'espère que la plupart des auditeurs n'étudieront les cahiers du programme qu'après la représentation, car j'aimerais beaucoup savoir si ne serait-ce qu'une seule personne reconnait, perçoit l'"original", sans savoir ce qu'il y a à entendre.) Peter Ablinger Extrait du livret des Journées musicales de Donaueschingen 2000 Traduction: Martine Passelaigue DEUS CANTANDO, le �piano parlant� de Peter Ablinger, par Marc Wathieu LA PLUIE, LE VERRE, LE RIRE "Der Regen, das Glas, das Lachen" pour 25 instrumentalistes est la réunion d'un unisson et d'un frémissement sonore. L'unisson polymétrique "glissande" en 20 minutes dans toute l'octave pour devenir un son universel, tandis que l'ensemble sonore, en 6 autres couches retentissant simultanément, aboutit progressivement à un vaste bruissement. La simultanéité de 1'échelonnement entre l'état brut (ton) et les différents stades du devenir raffiné (= plus dense, plus bruyant), jusqu'à la surface (bruissement) perdure - potentiellement - du début à la fin. Ainsi, le morceau joué est trés dense, et une grande partie de l'orientation relève de l'auditeur. Pendant de longs moments, ce dernier se retrouve seul lorsqu'il pénètre par l'écoute dans les niveaux du morceau, lorsqu'il s'oriente DANS LE SON. Le processus consistant à pénétrer dans le morceau par écoute représente une partie essentielle du morceau lui-même, l'événement an soi, et finalement son origine. Séléctionner, séparer les niveaux n'est pas une "obligation". LE SON du morceau n'est pas composé des différents niveaux. Je dirais plutôt qu'IL A LIEU, au-delà des niveaux, à travers les niveaux, et dans l'oreille de I'auditeur. C'est là que naissent des "mélodies" qui n'existent dans aucun des niveaux, mais qui commencent par example avec un son de la couche 6 suivi aussitôt d'un son de la couche 4 puis de la couche 3 pour aboutir dans la couche 5. On pourrait dire que l'écoute ne se déroule pas le long du temps du morceau, mais qu'elle est "perpendiculaire au temps". Ou encore qu'elle s'évase au lieu de suivre une ligne. Il s'agit ici d'une sorte "d'évolution spectrale de l'attention". Et en tant qu'auditeur, j'apprécie le va-et-vient entre les différentes formes d'écoute, y compris celle de l'absence. Peter Ablinger transl. Anne Durand and Mark Court REGENSTÜCKE, blog en français SANS TITRE/14 INSTRUMENTALISTES (1992) Pendant l'élaboration de la partition «Ohne Titel/14 Instrumentalisten» («Sans titre/14 instrumentalistes»), le morceau possédait BIEN un nom: «Augen (Ikonen 2)» («Yeux (Icones 2)»). Presque parallèlement, j'avais rempli un cahier de paires d'yeux dessinées selon le modèle de la peinture byzantine. La même paire d'yeux qui revenait toujours, peut-être 30, 40 fois sur une page, jusqu'à ce que le cahier fusse plein. Sur la couverture, j'inscrivis «Augen (Ikonen 1)» («Yeux (Icones 1)»). h n'est pas h répéter le même moment la réalité apparente faire qu'elle se transforme d'elle-même sans que nous le remarquions parce que nous nous transformons en même temps qu'elle l'éclair la fissure dans la réalité ne pas avancer dans le temps répéter l'éclair jusqu'à ce que l'on y voit à travers à l'intérieur maintenant n'est pas maintenant Peter Ablinger transl. Anne Durand and Mark Court LE TRAVAIL DE LA PERCEPTION Lors du festival rainy days 2009, le compositeur Peter Ablinger avait présenté une pièce conçue pour une sorte de «piano parlant», explorant déjà de façon très inventive les liens entre la parole et le son. Sa pièce Wachstum, Massenmord (croissance, hécatombe) «pour orchestre et sous-titres» a été écrite spécifiquement pour ce concert avec sous-titres, et commandée par la Philharmonie. À partir de l'analyse des fréquences d'un enregistrement des deux mots parlés Wachstum, Massenmord, le compositeur a réalisé une sorte d'instrumentation / transcription pour orchestre - mettant en oeuvre pour l'auditeur tout un réseau de perceptions variables. Ablinger donne ici d'autres pistes de réflexion sur la façon dont nous percevons la musique et dont notre perception peut ou non rendre compte d'un contenu de réalité, en faisant la proposition suivante dans le texte en allemand accompagnant ce concert: «Comme la culture, la perception est quelque chose d'acquis et par conséquent en aucun cas identique selon les êtres, les cercles culturels ou les époques de l'histoire. La perception est l'usage d'une grille de lecture du monde conditionnée par la culture. Perception et culture sont alors digitales, contrairement au monde, qui est analogique. Et notre degré de proximité avec le monde dépend en quelque sorte du nombre de pixels de notre appareil perceptif. [�]. Une haute résolution signifie une compréhension du monde réaliste, une basse résolution une relation abstraite à la réalité. Mais aussi parfaite que puisse être la résolution, jamais notre perception ne sera analogique, jamais elle ne permettra de rendre compte du monde». Peter Ablinger "Les sons ne sont pas des sons! Ils sont là pour distraire l'intellect et adoucir les sens. Pas une seule fois entendre n'est-il véritablement "entendre": entendre est ce qui me crée". Peter Ablinger est né à Schwanenstadt, en Autriche en 1959. Il a d'abord étudié les arts visuels puis s'est enthousiasmé pour le free jazz. Il compléta ses études de composition avec Gösta Neuwirth et Roman Haubenstock-Ramati à Graz et Vienne. Il vit à Berlin depuis 1982, où il a fondé des festivals et dirigé d'innombrables festivals et concerts. En 1988 il a fondé l'Ensemble Zwischentöne. En 1993 il était professeur invité à l'université de Musique de Graz. Il a été invité à diriger le Klangforum Wien, United Berlin et le Insel Musik Ensemble. Depuis 1990 Peter Ablinger est un musicien freelance. Les compositions de Peter Ablinger ont été jouées aux festivals de Berlin, Festwochen de Vienne, Darmstadt, Donaueschingen, et également aux festivals d'Istanbul, de Los Angeles, Oslo, Buenos Aires, Hong Kong, et Londres. Le Offenes Kulturhaus Linz, Le Diözesanmuseum de Cologne, le Kunsthalle de Vienne, Neue Galerie der Stadt de Graz, le Kunsthaus de Graz, l'Akademie der Künste de Berlin, le Santa Monica Museum of the Arts, et le Haus am Waldsee ont exposé ses installations au cours des dernières années. Peter Ablinger est, selon Christian Scheib, un "mystique des Lumières dont les appels et litanies visent la cognition". Ablinger est l'un des rares artistes d'aujourd'hui qui utilise le bruit sans aucune sorte de symbolisme - non pas pour signifier chaos, énergie, entropie, désordre ou tapage; non pas pour s'opposer à quelque chose, être dissident ou destructif; pas pour l'éternité, pour tout ou pour quoi que ce soit. Comme dans tous ces exemples de musique incluant délibérément des bruits, le bruit est le sujet mais pas pour Ablinger: il n'y a que cela. Ablinger a parcouru un long chemin questionnant la nature du son, le temps, l'espace (composant considérés habituellement comme au coeur de la musique) et ses conclusions ont rendu problématiques nombre de conventions jusque-là regardées comme irréfutables. Ces idées concernent les répétitions et la monotonie, les réductions et la redondance, les densités et l'entropie. Ablinger est aussi un sceptique qui comprend les règles du jeu de la culture imposées par les traditions et les habitudes d'écoute (destructives): "Cependant, allons plus loin et disons: les sons sont là pour entendre (- mais pas pour être entendus; ce qui est tout autre chose). Et l'ouïe nous est donnée pour cessersaisir" ('Das Hören ist da um aufzuhören'). Je ne pourrais en dire plus. (Texte de Christian Baier) Traduction: Mokha Laget Comme le pur ciel bleu de Peter Ablinger's 33-127 par Evan Johnson Traduction: Mokha Laget Les sons ne m�intéressent pas Une entrevue menée par courriel par le compositeur Trond Olav Reinholdtsen Traduction: Simon Labbé & Pascale Berthelot publié dans: Revue & Corrigée, n°117, septembre 2018 Art et culture Traduction: Simon Labbé Théorie de la polyphonie Traduction: Simon Labbé Les bois Traduction: Simon Labbé Tout, en même temp par Pierre-Yves Macé Parcours de l'�uvre, IRCAM 2020 Dessins: Peter Ablinger'''
