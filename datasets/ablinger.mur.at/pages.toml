["https://ablinger.mur.at/docu01.html"]
title = "Stühle, als Hörorte/Chairs as listening places"
description = "Peter Ablinger - Aktuelles"
full_description = '''PETER ABLINGER - STÜHLE / CHAIRS Weiss/Weisslich 14 und 29 Bestuhlungen Hörorte Stuhl-Projekte seit 1995 Weiss/Weisslich 14 and 29, Chairs, Listening Places, Chair Projects since 1995 "not the sound, but the listening is the piece" Since 1995 different chairs-pieces have been realized in different spaces, inside and outside. The piece is both a sculpture that plays with the serial structure of minimal art and the quotation of an audience space that can actually be used to sit down and enjoy the given situation as a concert. Other versions exist as text, photo-series, and as performance, but the fundamental formulation of the piece is "Weiss/Weisslich 14", which exists just as its title that says "Sitting and Hearing". This piece, which does not consist of an object and exists only as an idea (or its title), refers to the thought that is elementary to Peter Ablinger's entire work; the thought that it is not the piece, the composition, the given structure that is important, but the listening process itself. Even the sounds are too much of an object and are not the absolute center of interest. For Peter Ablinger only the hearing itself, the relationship between the listener (the subject) and the sound (the object), has the quality of being art in its most immediate sense. Not the sound, but the listening is the piece. The documentation below shows some of the versions of Weiss/Weisslich 14 and 29 WEISS/WEISSLICH 14 (White/Whitish 14), Sitting and Hearing, 1995, (the piece exists only in its title; one can execute, do or think it) Sitzen und Hören, 2 Skizzen, 1995 Sitting and Hearing, 2 sketches, 1995 WEISS/WEISSLICH 29, 6 Stühle auf winterlichem Feld, 31.12.1996 White/Whitish 29, 6 chairs on a wintery field, 31.12.1996 STÜHLE, BAMBUS, SONNENAUFGANG, SONNENUNTERGANG (1996/97), im Freien werden 36 Stühle und 6 Bambuspflanzen nach der Sonne ausgerichtet (Skizzen, und Realisation Rümlingen, Schweiz, 1997) Chairs, Bamboo, Sunrise, Sunset (1996/97), 36 chairs and 6 bamboo plants are arranged according to the sun (sketches, and realization in Rümlingen, Switzerland, 1997)'''
