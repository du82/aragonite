["https://ablinger.mur.at/phonograph.html"]
title = "Phonographie"
description = "Mikrofonaufnahmen aus unserer alltäglichen Umgebung: Stadtlärm, Kneipengemurmel, Kaufhäuser, Strassen, etc., gewissermaßen akustische Photografie, oder auch Phonografie"
full_description = 'Phonographie Mikrofonaufnahmen aus unserer alltäglichen Umgebung: Stadtlärm, Kneipengemurmel, Kaufhäuser, Strassen, etc., gewissermaßen akustische Photografie, oder auch Phonografie Gewissermaßen um dem Bild zu entgehen, begann ich, mich von der Idee des Abstrakten, der reinen weissen Fläche, des Absoluten loszulösen, und mich dem Kontingenten, dem Unklaren, den gegenständlichen und alltäglichen Klängen anzunähern. Das bis dahin statische Rauschen wurde kontinuierlich, die Klänge konkret. "Die wahre Herausforderung bestand nicht darin, es aus dem Rauschen des Waldes herauszuhören. Dort war es fast zu einfach - eine Art Handwerk. Nicht aber, mitten im Waffenlärm, im Augenblick des reinen Grauens, in der Zerstörung des Geistes wiederzuerkennen, daß hier eine noch dichtere Stille, eine betäubende Stille eintrat." (Roberto Calasso)'
