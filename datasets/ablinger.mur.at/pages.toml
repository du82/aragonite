["https://ablinger.mur.at/docu14.html"]
title = "METAPHERN"
description = "Peter Ablinger - Metaphern"
full_description = 'ein Text von Peter Ablinger veröffentlicht in: "Übertragung - Transfer - Metapher", Kerber-Verlag, 2004 A "Übertragung eines Sinneseindrucks in einen anderen" (- so ähnlich bei McLuhan), oder Übertragung einer Kunst in eine andere: das ist exakt die Definition von ERFAHRUNG. Ich könnte Bücher füllen um von solcher Erfahrung zu berichten, bzw. von eigenen Werken, die auf solcher Übertragung beruhen. B Im Grunde arbeite ich aber daran, daß das was man sieht oder hört, nicht das ist, was man sieht oder hört. Es ist eine Art umgekehrter Kunst. Kunst als Negativ. Oder besser noch: Komplementäre Kunst. Das was man sieht oder hört, ist das Komplement zu dem, was man NICHT sieht oder hört. Die Kunst ist aber nicht das was man sieht oder hört - das ist nur das Handwerk/Kunsthandwerk - die Kunst ist genau das Komplement zu dem, was man sieht oder hört. Ist das, dessen Außengrenze das Sicht- oder Hörbare beschreibt. Die Kunst ist exakt dort, wo das Sicht- oder Hörbare aufhört. Die Standardsituation mit der ich es zu tun habe, ist diejenige, in der das Sicht- oder Hörbare/das Gemachte als das Kunstwerk begriffen (bewundert oder abgelehnt) wird: das goldene Kalb. Nur: das geht alles voll daneben. Die Kunst ist daneben. Ist das was übrigbleibt, wenn man das Werk wie einen Scherenschnitt herausschneidet aus seiner Umgebung. Aaron und Moses. Verräter und Retter. Der Künstler ist beides in einem. Er verrät die Kunst, um sie zu retten. Die Schwierigkeit besteht nur darin daß der VERRAT gefeiert wird und nicht die Rettung. Daraus entsteht das unaufhörliche Weitermüssen/den Verrat verraten müssen/immer und immer wieder. Die Rettung wird zur Flucht. Denn nur in dieser Flucht vor der jeweils gesetzten Manifestation/dem Werk/dem Kalb läßt sich die Idee des ANDEREN/des Im-Ausgesprochenen-Nicht-Ausgesprochenen/die Idee der Idee aufrecht erhalten... C Newman und Klein haben mich angeregt, zu etwas, das mit Newman und Klein nichts zu tun hat, zu etwas, das, aus der Perspektive von Newman und Klein, das Gegenteil von Newman und Klein ist. Die maximale Abstraktion ist für mich (nur) die Voraussetzung für die maximale Konkretheit. Das ist so, wie man einen Gedanken nur klar denken kann vor dem Hintergrund der Gedankenleere. Das ist wie richterliche Unbefangenheit, die Indifferenz eines Ignatius von Loyola. Abstraktion, Monochromie, das weisse Quadrat sind Voraussetzungen für eine klare Haltung gegenüber dem Unklaren, dem Vielfältigen, der Wirklichkeit.'
