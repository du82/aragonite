["https://ablinger.mur.at/rauschen.html"]
title = "Rauschen"
description = "jede Form des Rauschens, künstlich oder natürlich, every form of"
full_description = '''Peter Ablinger: RAUSCHEN Everything Always Rauschen (White noise) is the totality of sounds - "everything always" in its acoustic representation. Comparable to white light that contains all colours, white noise contains all frequencies, and - poetically speaking - all music. The Mirror Rauschen therefore is maximum density, maximum information. But it is also the opposite: no information, maximum redundancy. For me it is less than nothing, less than silence. Silence ceased to be silent long ago. It is crowded now. Full of ideas, sentimentality, and reminiscences (of privacy, religion, nature, and within music: John Cage). The idea of Rauschen furthermore is not empty: there is the ocean, the noise of trees in the wind, an old analog radio tuned between two stations. The difference between silence and Rauschen becomes clear when we are exposed to it, when we "listen" to it. Cage taught us how many things are left to hear when we listen to silence, that silence does not exist at all. However, being exposed to plain white noise is different. It is not just that we no longer hear the grumbling of our neighbour's stomach. The reason why we hear "less than nothing" is that we cannot connect to it by just listening. It is simply too much. We can't do anything with it. The only thing that is left to do is to produce illusions, i.e., to hear something "in" the noise that is not there, that can be perceived only individually - to project our own imagination onto that white "screen". In this way Rauschen works like a mirror, reflecting back only what we project onto it. The Plane Another coherence that guided me to Rauschen ("surface noise"), or to sounds with a high spectral density and relatively static envelope, was the desire for plane. Plane in the sense of a large colour field by Barnett Newman; plane as opposed to figure (Gestalt). In the early 1990's, some forty years after "Onement I", there was nothing in music that came close to that idea. Ligeti had the structural potentiality for plane in this sense, but he was not interested. He was interested in the dynamic shape, the dramaturgic envelope of the orchestral masses. La Monte Young's fifth, from 1960, was so to speak really in touch with plane, and it was probably the most figure-less (gestaltlos) music up to that point. But in opposition to Ligeti Gestaltlosigkeit fullfilled itself here in temporal categories; the vertical (spectral) dimension holds on to the identity and definiteness of a musical interval, a strong remainder of the tradition of musical Gestalt. But what would be a plane in music? A surface? White or blue? Let's first ask for white. We have already found the equivalence between the "white" and the "everything always". We normally imagine surface as limited. As we cannot limit the borderlines of the spectrum (to still remain "white"), we have left only the time to be defined and quantified. With these questions we really start to get into the subject. (But I shall anticipate here: Even if I come back to these questions again and again I think they might not be answered in a strict sense. The parallel between visual and musical categories cannot be carried out until to a satisfactory solution. And that's exactly what will rescue us. At some point we have to detach from visual categories and should become aware that with Rauschen we keep hold of one of the rare terms in acoustics that does NOT originate from the visual domain. On the contrary, Rauschen - via information theory - has infiltrated the vernacular as a metaphor and now signifies everything around redundancy and contingency, the incommunicable residuals of figure and information.) Noise and Noises English notes on Peter Ablinger's Noise Inquiries by Christian Scheib Christian Scheib anlässlich der Installation Weiss/weisslich 15 "Weiss", ein Text aus "Metaphern" von Peter Ablinger "Ruido", Traducción: Sergio Bové Rauschen Vor 1994 arbeitete ich abwechselnd an Stücken die immer reduzierter wurden (Ohne Titel/3 Flöten, Ohne Titel/3 Klaviere, Ohne Titel/2 Klarinetten), und solchen die immer dichter wurden (Verkündigung, Grisailles, Der Regen, das Glas, das Lachen). Das war kein wirklicher Gegensatz. Nur etwas das sich unterschiedlich ausprägte. Die Reduktion war wichtig um sich von den Gesten, und von der Vorstellung von Musik als Sprache zu lösen, die Verdichtung war wichtig, um sich von den Einzelheiten, den Motiven und Gestalten zu entfernen (- und auch vom Pathos des Leisen und Langsamen der Feldman- und späten Nono-Stücke, die die späten 90er Jahre prägten). Das Rauschen schließlich hob den (scheinbaren) Gegensatz in sich auf: es war so reduziert wie eine weiße Fläche, und es war so dicht wie alle Musik der Welt gleichzeitig. Rauschen als Vorstellung oder Metapher durchdringt seit ca. 1990 auch solche Stücke die in Wirklichkeit weit von der akustischen Realität wirklichen weissen Rauschens enfernt sind: Verkündigung, Weisse Litanei, Grisailles; In Weiss/weisslich 3 spielt es als undifferenziert gleichmäßiges, flächiges instrumentales Rauschen die Hauptrolle; In Der Regen, das Glas, das Lachen tritt es auf als eine durchgehende Schicht 6 kontinuierlich tremmulierender Becken, dann als weitere Schicht eines das ganze Stück grundierenden, elektronisch produzierten (weissen) Rauschens, und schließlich als die grundsätzliche Klangarchitektur, welche vom Vordergrund (Ton) zum Hintergrund (Rauschen) in 7 Ensemblegruppen, bzw. Klangschichten vermittelt. Zu den explizitesten Formulierungen des Rauschens gehören Stücke wie Weiss/Weisslich 18, Baumrauschen, die Aufnahmen 18 verschiedener im Wind rauschenden Bäume, oder Weiss/Weisslich 17a, Klavier und Rauschen, wo die der Reihe nach abgeschrittenen weissen Tasten des Klaviers von weissem Rauschen "eingehüllt" werden.'''
author = "Peter Ablinger"
year_published = 2025
clearnet = "https://ablinger.mur.at/rauschen.html"
category = "SitesList"
