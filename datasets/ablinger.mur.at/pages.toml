["https://ablinger.mur.at/zettel-augen-ikonen1.html"]
title = "Augen (Ikonen 1)"
description = "Zeichnungen"
full_description = 'Peter Ablinger: Augen (Ikonen 1) Zumindest während der Arbeit an der Partitur von "Ohne Titel/14 Instrumentalisten" hatte das Stück DOCH einen Titel, und zwar: "Augen (Ikonen 2)". Fast gleichzeitig hatte ich ein Schreibheft vollgezeichnet mit Augenpaaren, die an byzantinischer Malerei orientiert waren. Einfach immer wieder das gleiche Augenpaar, vielleicht 30, 40 mal auf jeder Seite, bis das Heft voll war. Vorne auf den Deckel schrieb ich "Augen (Ikonen 1)". "Augen (Ikonen 1)" 1992, Tinte auf Papier, Seiten 12-14 > Ohne Titel/14 Instrumentalisten > Griffa 1'
