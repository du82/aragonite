description = "Investiga��es sobre o ruído, Características da obra de Peter Ablinger"
full_description = "Christian Scheib: Música estática - Investiga��es sobre o ruído Características da obra de Peter Ablinger CalArts 1997/1998, vers�o original em inglês editado por Bill Dietz, traducido por Edilene de Souza Santiago Nos últimos anos o compositor Peter Ablinger tem focalizado o seu trabalho em investiga��es sobre o ruído estático. Este artigo oferece um panorama dos seus descubrimentos, das idéias e concep��es que colocaram o ruído estático no centro do seu interesse, bem como das pe�as que escreveu e/ou desenvolveu. Ablinger comp�e música para solistas, ensembles e orquestra; realiza instala��es e performances; trabalha com meios eletrônicos e com eletrônica ao vivo. Peter Ablinger é um dos poucos artistas atuais que utiliza o ruído sem nenhum tipo de conota��o simbólica. N�o o usa como um significante do caos, nem para gerar energia, entropia, desordem ou agita��o; nem para se posicionar contra algo ou alguém; ou para ser desobediente ou destrutivo. Para Ablinger o ruído é o objeto central. Peter Ablinger também esteve um longo período questionando a natureza do som, do tempo e do espa�o (componentes considerados centrais na música) e as suas respostas comprometeram e puseram em cheque as conven��es que usualmente se consideravam irrefutáveis na música. Estas respostas est�o relacionadas com a repeti��o e a monotonia, a redu��o e a redundância, a densidade e a entropia."
