["https://ablinger.mur.at/txt_polski.html"]
title = "polskie teksty"
description = "Peter Ablinger odpowiada na pytania Moniki Pasiecznik"
full_description = "Peter Ablinger - polskie teksty Moim materialem nie jest dzwiek. Moim materialem jest slyszalnosc. Podczas gdy inni pracuja z dzwiekiem przykladowo ustawiaja dzwiek, nastepnie pauze ja ustawiam slyszalnosc, pózniej nieslyszalnosc. Nieslyszalnosc moze powstac na wiele sposobów. Przez cichosc, lecz równiez glosnosc. Przez zbyt niskie i zbyt wysokie tony. Przez powolnosc, lecz i przez szybkosc. Przez to, ze pojawi sie zbyt malo ale równiez przez to, ze pojawi sie zbyt wiele. Przez zbytnie przyblizenie oraz za wielki dystans. Przez zbyt krótkie, ale i przez zbyt dlugie trwania. Przez pustke, ale i przez przepelnienie. Trzeba dodac, ze relacje slyszalnosci do nieslyszalnosci � w odróznieniu od dzwieku i pauzy � cechuje swoiste przekraczanie. Po pierwsze slyszalnosc i nieslyszalnosc nie sa od siebie jako idee calkowicie rozdzielne, ale polaczone poprzez istnienie pasm krytycznych. To znaczy, ze istnieje wydzielona krytyczna przestrzen, dla kazdego rózna, w której zachodzi przejscie od slyszalnosci do nieslyszalnosci. Po drugie i wazniejsze, relacja slyszalnosci i nieslyszalnosci nie jest biegunowa, zamiana slyszalnosci w nieslyszalnosc oznacza przejscie w INNY stan. Przykladowo po przekroczeniu okreslonego poziomu glosnosci zaczyna sie ból; po przekroczeniu okreslonej wysokosci mamy do czynienia z ultradzwiekami; ponizej okreslonych czestotliwosci ton zamienia sie w stukot; po przekroczeniu pewnej bariery wielosc informacji przeistacza sie w chaos lub szum. (transl. Krzysztof Marciniak)"
author = "polskie teksty"
