["https://ablinger.mur.at/i+r7_kltr+r.html"]
title = 'Kleine Trommel und UKW-Rauschen ("Conceptio")'
description = "Kleine Trommel und UKW-Rauschen,"
full_description = '''Peter Ablinger: KLEINE TROMMEL UND UKW-RAUSCHEN ("CONCEPTIO") 2000 6', snare drum, FM-receiver Snare Drum and FM-noise ("Conceptio") 1 small snare drum, with little resonance, to allow the finest possible difference to the FM-noise. The radio receives white noise - and no station. But if you suceed by ABSOLUTELY INPERCEPTIBLY mixing in a bit of a station, then it is allowed: as an inperceptible irritation; one may not be shure; one might miss it; BETTER ONLY AS WHITE NOISE rather than a recognizable signal! From 8 loud ossia-beats on snare drum written in the score a maximum of only one per performance is played and, in every performance another of the ossia-beats. Or OFTEN NO ONE. (And, only "once in a life time" of an interpretor - and only if he/she had played the piece several times - maybe 2 beats). (From: score, description, translated by Bill Dietz, edited by Austin Buckett) ) Drawing from sketchbooks for "Conceptio" KLEINE TROMMEL UND UKW-RAUSCHEN ("CONCEPTIO") (aus dem Partitur-Vorwort) 1 kleiner UKW-Empfänger, ohne Rauschunterdrückung, zwischen den Sendestationen. 1 kleine Trommel, mit wenig Resonanz (schmale Zarge), um die feinst-mögliche Differenz zum UKW-Rauschen bilden zu können. Das Radio kann auf maximale Lautstärke gestellt werden um mit einem pp-Spiel der kleinen Trommel gleich laut zu sein. Der Trommelwirbel darf niemals einen Vordergrund zum UKW-Rauschen bilden, sondern lediglich einen leichten Klangfarbenwechel erzeugen. > listen to part 1 (snare drum: Nick Hennies) > full score and performance material (156KB) > CD for score more information contact the publisher: ZEITVERTRIEB WIEN BERLIN Bryan Eubanks, Gotzkowskystr. 15, D-10555 Berlin,T: +49 / 176 / 47 39 29 97, zeitvertrieb@proton.me see also: > Instrumente und Rauschen > WEISS / WEISSLICH 17, Instrument und Rauschen > Rauschen, documentation'''
