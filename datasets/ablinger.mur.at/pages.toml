full_description = 'PETER ABLINGER - Hinweisstücke/Reference Pieces Sven �ke Johansson performing "Weiss/Weisslich 19" in 1996 (Stücke, die oft nur aus ihrem Titel bestehen; man kann sie ausführen oder aufsuchen, man kann sie tun oder denken / pieces which often exist only in their title; one can execute or visite, do or think them) WEISS / WEISSLICH 7a: Rauschempfänger (1994) zB. ein Radio zwischen zwei Sendern eingestellt, oder ein Fernseher ohne Antenne - als Tatsache - oder als Installation - oder als Aufführung WEISS / WEISSLICH 25b, Ohrstöpsel (2010) WHITE / WHITISH 25b: earplugs > note WEISS / WEISSLICH 28, Gehen Aufnehmen (1990,96) WHITE / WHITISH 28, walking record (1996) > note LISTENING PIECE IN FOUR PARTS Orte (2001) Spaces (2001) 1. Los Angeles, Dockweiler State Beach, Baywatch 53 and 54 2. Los Angeles, Baldwin Hills, CulverCityPark, BaseballField 3. Los Angeles, Downtown, 4thStreet/MerrickStreet, ParkingLot 4. Palm Springs Trail Station/Wind Farm eine Version des Stückes (Stühle, Orte) hat stattgefunden, indem an jedem der 4 Orte 20 Stühle 90 Minuten lang aufgestellt wurden(10.12.,11.12.,19.12.,26.12.2001); Ohne Stühle verbleibt das Stück als Hinweis (Titel) ORTE: St.Anna in Zepernick 1. Raumformanten (verschiedene Versionen für Instrumente und/oder Sänger) 2. Der Moment, wenn Sie den Raum verlassen (2001) Places: church St.Anna in Zepernick, Germany; 1. Room formants, different versions for instruments and/or singer(s); 2. The moment you leave the room 3 ORTE Graz 1. Raumformanten für Instrumente, die Kirchen St.Andrä und Mariahilf, und den großen Minoritensaal 2. Der Wechsel zwischen den Orten (2003) 3 Places Graz; 1. Room formants for instruments, the churches St.Andrä and Mariahilf, the Minoritensaal; 2. The shift between places > dt.Text > score 3 ORTE Oslo 1. Raumformanten für Instrumente und die Orte Paulus Kirke, Skatehallen/Hausmania und Norsk Form 2. Der Wechsel zwischen den Orten (2005) 3 Places Oslo; 1. Room formants for instruments and the