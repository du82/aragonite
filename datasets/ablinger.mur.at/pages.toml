["https://ablinger.mur.at/werk89verkuend.html"]
title = "VERKÜNDIGUNG"
description = "für Flöte, Saxophon und Klavier (1990), ca.20', fl,sax,pno"
full_description = '''Peter Ablinger: VERKÜNDIGUNG für Flöte, Saxophon und Klavier (1990), ca.20', fl,sax,pno Verkündigung ("Annunciation"): for flute, tenor saxophone and piano. This piece is dedicated "to the masters of flying: Franz Liszt, Alexander Scriabin, Cecil Taylor" - music with complex notation, and which is highly virtuosic, sometimes beyond the limits of possibility. The piece is about aural illusion, ornament and repetition, architecture and figure, about the mosaic or Islamic Bilderverbot, about dripping and flying, and about a particular painting by the early renaissance painter Domenico Veneziano. Some consider it a key work in Peter Ablinger's oeuvre. Annunciation by Domenico Veneziano, 1445, CC BY-SA 2.0 de > score, one page from saxophone part > legend (introduction to score) > listen (flute: Gisela Mashayekhi-Beer, saxophone: Marcus Weiss, piano: Hildegard Kleeb) > CD - "Verkündigung" in 3 versions (flute: Gisela Mashayekhi-Beer, saxophone: Marcus Weiss, piano: Hildegard Kleeb) > CD - version for 7 flutes (flute: Gisela Mashayekhi-Beer)'''
author = "Peter Ablinger"
