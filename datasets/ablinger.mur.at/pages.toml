["https://ablinger.mur.at/hoerstuecke.html"]
title = "Hörstücke / Listening Pieces"
description = "Hörstück ist die Bezeichnung solcher Stücke in denen tendenziell weniger das, was gehört wird (das Objekt) im Zentrum steht, sondern das Hören selbst (das Subjekt)"
full_description = '''Peter Ablinger: Hörstücke / Listening Pieces Hörstück ist die Bezeichnung solcher Stücke in denen tendenziell weniger das, was gehört wird (das Objekt) im Zentrum steht, sondern das Hören selbst (das Subjekt). Hörstücke können Tonbandstücke oder Installationen sein, aber auch sogenannte Hinweisstücke - also Stücke, die oft nur aus ihrem Titel bestehen und lediglich auf eine bestimmte Hörsituation hinweisen, - oder diverse Prosa-, Foto-, Video- oder Objektstücke, die physikalisch gar keinen Klang aufweisen, aber dennoch als Musik ("Musik ohne Klänge") verstanden werden wollen. WEISS / WEISSLICH 6, 12 Kassettenrekorder 6a: (1992,94), 30' 6b: "konzertante Installation" (1996), 12' 12 tape recorders, 30'; 6b: "concert installation", 12' > score and photos; german description how to create the performance material WEISS / WEISSLICH 7a: Rauschempfänger (1994) zB. ein Radio zwischen zwei Sendern eingestellt, oder ein Fernseher ohne Antenne - als Tatsache - oder als Installation - oder als Aufführung noise receiver; e.g. a radio between 2 stations, or tv without antenna; - as a fact, installation, or performance > white noise received through the ether, documentation WEISS / WEISSLICH 7b: Rauschen (1998) jede Form des Rauschens künstlich oder natürlich noise; - every form of "Rauschen" (static noise), artificial or natural > reference pieces WEISS / WEISSLICH 8, Schneckengehäuse (1994) Schneckengehäuse ans Ohr halten snails' shells; hold a snail's shell to your ear > note WEISS / WEISSLICH 9, Wege 9a: Windweg: Gehen, und den Wind hören 9b: Wasserweg: Gehen, und das Wasser hören (1986,93) 9a: wind path: walk and listen to the wind; 9b: water path: walk and listen to water > note WEISS / WEISSLICH 10, Orte 10a: Kreuzgang mit Brunnenhaus, Lilienfeld, Niederösterreich 10b: Autobahntunnel, Plabutsch, Graz 10c: Klamm, Burgau am Attersee 10d: Weißdornhain, Grieben, Hiddensee (seit 1994) places; 10a: cloister with fountain-house, Lilienfeld, Austria; 10b: free-way tunnel, Plabutsch, Austria; 10c: ravine, Burgau, Austria; 10d: whitethorn wood, Hiddensee, Germany > note'''
