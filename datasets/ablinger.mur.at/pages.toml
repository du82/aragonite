["https://ablinger.mur.at/txt_sin-titulo.html"]
title = "Sin título - Sobre las instalaciones de Peter Ablinger, por Christian Scheib"
description = "5 vowels, coloured silence, head-mic/head-phones, symphonies, wall drawing, book of songs"
full_description = '''Christian Scheib: Sin título Sobre las instalaciones de Peter Ablinger 2003 Traducido por Sergio Bové Cinco salas contiguas de una galería, cada una conectada con la siguiente por medio de una sola puerta, han sido adaptadas con altavoces, cada uno alimentado por un reproductor de CD. Las cinco vocales a,e,i,o,u fueron trabajadas en un estudio para colorear el ruido resultante de los cinco CDs, cada uno coloreado con una vocal. En cada sala de la galería se puede escuchar un ruido coloreado por una vocal. El volumen es muy bajo de manera que hace que el ruido sea apenas perceptible, a menos que uno vaya en búsqueda de él, quizás como resultado de una de las hojas informativas que hay sobre un atril en el centro de la sala. Sin embargo, entrando en la sala contigua de la galería, donde un ruido que es coloreado por una vocal diferente resuena sosegadamente, uno de repente, y sin instrucciones, toma conciencia del cambio, a pesar del bajo volumen. En un principio, el efecto no es el de un cambio auditivo sino que más bien parece como si la sala cambiase de color o como si la percepción de su escala óptica no se correspondiese - no al menos acústicamente - con el tama�o y la calidad del espacio. Las cinco salas contiguas con sus varios ruidos coloreados aparecen en el catálogo de Peter Ablinger bajo el título de "Weiss / Weisslich 15. Installation und Hinweis, 1995. 5 Räume, 5 Lautsprecher, gefärbte Stille in den Farben A, 0, U, E, I" (Blanco / Blancuzco. Instalación e instrucción, 1995. 5 salas, 5 altavoces, silencio coloreado en los colores A, O, U, E I). Incluso la observación recientemente mencionada, que es evidente que un color acústico cambie de uno a otro más que en sí mismo, parece que se da en el catálogo. La descripción de arriba forma parte a) de la obra de arte. Parte b) dice: "cualquier cambio, de una sala a otra". Esto no (o no sólo) se refiere al cambio de una de las cinco salas a la siguiente sino a la conclusión obvia de este arreglo artístico experimental con relación a la vida exterior a la galería. La frase misma "cualquier cambio de una sala a la siguiente" enfatiza una de las características fundamentales del arte de Ablinger: a menudo concibe un utópico estado intermedio (un entre) mientras la inevitabilidad del fracaso quizás sea su arte. Con la misma frecuencia, no es el estático o al menos definible entre sino más bien este momento de cambio, que nunca será limitado, este momento siempre esquivo de transición entre una cosa y otra. Todavía no es metamorfosis, que es central en las típicas obras de Peter Ablinger, sino más bien, o quizás, la diferencia, o más precisamente, la fugaz experiencia de la diferencia permanente. La diferencia es central en esto, a veces es menos importante que el original, maravillando en la diferencia los momentos de observación, puntos o transiciones donde nada había sido esperado. Sin embargo el título de las instalaciones y de las series de piezas "Weiss / Weisslich" (Blanco / Bancuzco) sugieren que peque�as alteraciones en la textura blanca son una metáfora pictórica que se aproxima a las ideas auditivas de las series. Muchas piezas de estas series son variaciones de lo que es diferente en y acerca del ruido, algunas son - no deberían ser lo mismo - lo que es diferente en y acerca de simples realidades. Dondequiera que uno vea un conjunto de auriculares que obviamente están para ser usados, uno se los pone con la expectativa de escuchar algo ajeno a uno mismo, la mayoría de las veces música o algún texto explicativo que está siendo leído. Poniéndose los auriculares en las instalaciones de Peter Ablinger "Weiss / Weisslich 36, Kunstkopf / Kopfhörer (head-mic / head-phones)" algo extra�o pasa. La primera expectativa que es decepcionada es que precisamente no hay nada "ajeno/extra�o" para ser escuchado. El dispositivo técnico transfiere a los auriculares esa situación auditiva que podría ser escuchada sin los auriculares, de un lugar circundante a cuando el oyente se quita los auriculares. Aquí comienza el juego sobre las diferencias de las realidades de Weiss-Weisslich: contrario a la expectativa inicial de que lo que es escuchado con y sin es lo mismo de cualquier modo, resulta que es, en el mejor de los casos, diferente. Sin embargo, eso ya es un eufemismo: la diferencia entre la escucha del mismo entorno con o sin auriculares es enorme. Las discrepancias descubiertas son aquellas relacionadas con nuestra percepción: no sólo son otras las ondas sonoras reales que golpean nuestros tímpanos de aquellas que los alcanza cuando escuchamos los mismos sonidos a través de los auriculares, sino que es nuestra manipulación de la situación que crea las diferencias. Cada uno de los otros filtros depredadores de un conjunto de ondas sonoras entrantes por medio de la propia referencia inmediata que es percibida en cada situación - ordenando menos cantidad de volumen o cualquier otro criterio físicamente definido pero acorde con el criterio socio-biológico tal como cuál es la información importante de las se�ales sonoras, qué nuevos arribos o aproximaciones de se�ales o, al menos, el malestar inminente como el pulso grave de las primeras gotas de lluvia en el tejado. En vez de esta selección diaria de probada eficacia, los auriculares nos sitúan en un mundo completamente artificial, incluso si ellos pretenden mapear el mismo mundo acústico. Todo está mal: el chirrido de nuestros propios zapatos, hasta ahora desapercibido, se transforma insoportablemente ruidoso; y lo que esa interesante persona está diciendo allí en ese momento es absolutamente incomprensible porque docenas de voces súbitamente tienen casi el mismo volumen. Esto debería ser así de conocido desde hace un largo tiempo. Ambas situaciones en sí mismas a menudo han sido empleadas en contextos artísticos - realizaciones de radio y películas - como electroacústica. Peter Ablinger no usa ese deslumbramiento por la diferencia para contar una historia diferente. Él está interesado en la historia menos por este estado que por su transición. "De manera que lo que uno escucha", se lee en uno de los primeros borradores descriptivos de la pieza, "con o sin auriculares es lo mismo - o: una diferencia. Esta diferencia es la pieza". La descripción previa tal vez aclare lo que realmente se escuchará en los auriculares. Seremos menos capaces de filtrar claramente la información tanto en la constelación casi artificial como en la casi natural. Un alto porcentaje de sonidos apenas identificables, quizás dentro de un ruido que es manipulado, se fundirán en él. Comúnmente - y en particular en situaciones como ésta - esto es experimentado como una ruptura en la transmisión de la información. Sin embargo, Peter Ablinger nuevamente explora y describe cómo el ruido en sí mismo se transforma en información, tanto como portador de ella como información como tal. En "Weiss / Weisslich 22, Haydn, Mozart, Beethoven, Schubert, Bruckner, Mahler, 4'" las sinfonías de los compositores mencionados son condensadas en 40" cada una por medio de un programa de computadora específicamente dise�ado para esta tarea. El resultado es un ruido coloreado e iridiscente. Sin embargo, la información sobre la peculiaridad y el carácter de cada compositor que contiene el ruido es inequívoco a toda persona que conozca su música y, lo que es más, no es comunicable de esta manera en otras constelaciones, al menos no dentro de cuarenta segundos. Este aspecto de informar puede ser uno de los menos importantes de esta obra debido a que la pieza revela cuestiones más decisivas relacionadas con un "todo", que será representado y condensado; en efecto, en relación con la representación y la presencia. Tal vez el rol más inmediato que se pueda tener en cuenta y que se percibe conscientemente en relación con la información del ruido es aquel que informa sobre el espacio y la proporción. Cuando a�os atrás Peter Ablinger comenzó a explorar el fenómeno del ruido, uno de los dogmas que se encontró fue que el ruido blanco era categorizado por los ingenieros, en general y de manera preventiva por así decirlo, como el "todo". Incluso la simple superposición en fases desfasadas de dos ruidos blancos, que según el dogma no tendría ningún efecto, era claramente perceptible. Era, cuenta Ablinger, realmente menos perceptible como una comunicación acústica que como la impresión de que la sala había cambiado levemente, era como si las paredes se hubieran deslizado y el techo bajado un poco. Este resultado cimentó la convicción de Ablinger que el arte no representa nada, describiéndolo por sustitución o teniendo que poner algo completamente en su lugar sino que simplemente se puede mostrar como tal, como algo que crea espacio "parecido a una intervención arquitectónica". Dentro de las bellas artes una convicción como ésta está lejos de ser evidente en sí misma pero es perfectamente razonable, el cambio del espacio lo trabajan artistas como Richard Serra o James Turrell, que son puntos de referencia para Ablinger. Richard Serra utilizó tiza negra en dos paredes enfrentadas, en una sala sobre las mitades inferiores y en otra sobre las superiores. Las salas parecían tener por completo identidades y proporciones diferentes. El subtítulo de una obra de Peter Ablinger, "Wall drawing", está directamente relacionado con Richard Serra: el ruido blanco uniforme de dos altavoces puestos en frente y abajo como otros dos puestos atrás y arriba han sido cambiados levemente por el simple ajuste de los controles de agudo y grave. Caminando por la sala, se realizó recientemente en la Städtische Galerie en Kiel, uno la siente palpitando de una manera peculiar, una irritación producida por una intervención invisible dentro del espacio visible. Robert Musil una vez llamó a algo similar "la perturbación del equilibrio en la conciencia de la realidad" y fue el mismo autor que caracterizó hermosamente esta forma de arte con la frase: "Ni siquiera era un acontecimiento, a pesar de que se llevó a cabo, era un estado". Cantos ("Gesänge") aparece, de acuerdo con la convención y la lexicografía, en primer lugar cantada y en segundo lugar utilizada por la gente como medio para comunicarse con otras personas. La diferencia con la canción ("Lied") es inherente a esta última y pronto aparece que el concepto de cantos puede ser visto como literario, retrotrayéndonos a los grandes cantos de la civilización occidental: la "Odisea", la "Eneida" y "La Divina Comedia". Ablinger es un compositor y un artista sonoro, todavía no es un poeta que trabaja con la noción de cantos como si se refiriera a las grandes épicas mitológicas. En "Das Buch der Gesänge" (el libro de los cantos) no hay palabra cantada que se escuche claramente sino un mundo de fragmentos auditivos. Los fragmentos son grabaciones de sonidos, en este caso "100 Gesänge" (100 cantos) que parece hablar de la vida más mundana imaginable: el ruido del tráfico, el murmullo de un bar y los difusos ruidos de un ambiente. Un reproductor de CD es instalado en cada una de las seis mesas. Una porción de los cien cantos puede ser escuchada en cada set como fragmentos de entre 35" y 7'30" de duración aproximadamente. Además del ruido, Peter Ablinger escenifica cantos: próximo a la exploración de una nada particular, el ruido blanco,- para variar una de sus notas de 1997 - existe la búsqueda de la nada mundana, el ruido de cada día. La nada del ruido (blanco) también es un "todo" - al igual que la nada de la vida diaria se transforma en el todo a través de la misma palabra "diaria". Los fragmentos y recortes de la realidad son ambiguos con relación al grado preciso que no queda nada por medio de una reproducción de radio, ninguna palabra inteligible o sonidos evocando asociaciones definidas. Los sonidos a través de los cuales el "Buch der Gesänge" dice la palabra renuncia al juego de referencias y a la representación. Al mismo tiempo es la mitología lo que ellos informan: que podría haber un mundo utópico sin representaciones, al menos en la imaginación artística. Lleva tiempo percibir esto, como la escucha que siempre lleva tiempo para que los sonidos sean un "acontecimiento". Sin embargo, se torna en sí mismo en un "estado", "aunque se llevó a cabo". A pesar de todo, esto permanece mientras que los sonidos conserven su ambigüedad; sólo la escucha prolongada mantiene un estado de dicha. Cuando los sonidos ya no representan nada la escucha da un paso hacia atrás y la categorización pasa al primer plano, el paraíso da paso al conocimiento. La información, inequívocamente asociable debido a que está siendo representada, se muestra en sí misma como la antítesis de la escucha y de la presencia de la observación. El estado de la escucha perceptiva no puede extraerse del "acontecimiento" y del cese de los sonidos sino que debería desprenderse de la sistemática catalogación pictórico-simbólica del pensamiento. La percepción del mundo que es proyectado sobre sí mismo y desentramado - en el caso utópico e ideal - emerge como la esencia y la narrativa de "Das Buch der Gesänge". Como misterioso y separado de la clasificación, cantos posibilita un mito, un mecanismo de la cognición del mundo que se torna observable, el cual habla de la búsqueda de la utopía del todo y de la nada.'''
