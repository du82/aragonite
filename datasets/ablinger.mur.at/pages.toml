["https://ablinger.mur.at/ieaov1_laeuterung.html"]
title = "IEAOV - Läuterung des Eisens"
description = "Saxophon, Klavier, Schlagzeug, sax,pno,perc,electronics"
full_description = '''Peter Ablinger: IEAOV Instrumente und ElektroAkustisch Ortsbezogene Verdichtung ("LÄUTERUNG DES EISENS") Saxophon, Klavier, Schlagzeug (1995), 30' sax, pno, perc, electronics, 30' > general introduction to IEAOV pieces The first in the series of IEAOV pieces: Instrumente und ElektroAkustisch Ortsbezogene Verdichtung ("Läuterung des Eisens"), saxophone, piano, percussion, composed 1995, for the instrumentalists Marcus Weiss, Yukiko Sugawara, Christian Dierstein; program: Peter Böhm, Vienna. Premiered: Rümlingen, Swizzerland, 1995 Kreuzgang / Läuterung, ink drawing by Peter Ablinger, 1995 Requirements for IEAOV ("Läuterung des Eisens"): alto-saxophone in Eb, piano, percussion (Glockenspiel and 9 metal instruments from high to low, i.e. 3 triangles, a ship bell, 2 metal plates, 3 chimes) MaxMSP, 4 microphones, 4 loudspeakers, mixing desc stage set-up: 4 loudspeakers and 3 instruments in one straight line: drawing from sketch books, representing the general plan for the piece: 3 horizontal lines for the 3 intruments, 3 squares for the 3 electronic surfaces (verticalisations) IEAOV I: Bis 1994 habe ich ausschließlich instrumental/vokal komponiert. Einer der Grundzüge der Stücke war die zunehmende Dichte, die Entwicklung hin zum Rauschen (- zum Rauschen, nicht zum Geräusch. Das ist für mich etwa das Gegenteil.). E: Nach einem Jahr Komponierpause mit Versuchen in verschiedenen Studios (TU Berlin, Experimentalstudio der Heinrich-Strobel-Stiftung des Südwestfunks Freiburg, Peter Böhm Wien, IEM Graz) habe ich die lEA0V-Reihe begonnen.(1) A: Wollte ich mich weiterhin auf Instrumente allein beschränken, hätte ich jeweils mehrere hundert benötigt. Das A steht für den höheren Anteil an unmittelbarer Erfahrung. Das A ist gewissermaßen die Opposition zum Notenpapier. 0: Die instrumentalen Klänge werden nun in einem Prolog eingespielt und verdichtet. Die verdichteten Klänge sind dann Hauptbestandteil des eigentlichen Stückes, zu dem noch der Live-Spieler hinzutritt. Das heißt, der ElektroAkustik-Anteil selbst ist nicht live und doch in jeder Aufführung, an jedem Ort neu erstellt. Der Ort ist, im Gegensatz zum Abstraktum "Raum", dasjenige, wo Vorgestelltes (Raum) und Bedingtes (Zeit), Verfassung und Wahrnehmung in eins fließen. V: Die Verdichtung ist das eigentlich Methodische an diesem Konzept. Es ist die präzise technische Umsetzung einer ursprünglichen Metapher: Das Hochklappen der Zeit in den Augenblick. Das "Alles immer". > score, last page from instrumentalists score > Blockschaltbild, from technical score > listen (Trio Accanto: Marcus Weiss, Christian Dierstein, Yukiko Sugawara) > CD > Text zur IEAOV-Serie > general introduction to IEAOV pieces > complete list of IEAOV pieces Software realisation: Peter Böhm Further system development: Robert Hölderich, Thomas Musil, IEM Graz Implementation, final version: Wolfgang Musil for score and software contact the publisher: ZEITVERTRIEB WIEN BERLIN Bryan Eubanks, Gotzkowskystr. 15, D-10555 Berlin,T: +49 / 176 / 47 39 29 97, zeitvertrieb@proton.me'''
