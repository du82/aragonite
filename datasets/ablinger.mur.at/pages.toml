["https://ablinger.mur.at/insideout.html"]
title = "From Inside Out"
description = "Peter, Ablinger, Schaufenster-Installation"
full_description = 'Peter Ablinger: From Inside Out (2004) Setup Ein Schaufenster. Draußen ein Mikrofon. Drinnen ein Lautsprecher, der die Geräusche von draußen nach drinnen überträgt: als Mono-Signal. Der Blick geht von innen nach außen (dh. das Stück ist für den Blick von innen nach außen, nicht umgekehrt). Der Blick beobachtet die Vorgänge draußen und vergleicht/synchronisiert sie mit den nach innen projizierten Klängen. Die Synchronisierung scheint im ersten Moment zu gelingen wie gewohnt, und daher unreflektiert zu bleiben. Erst beim näheren Draufeinlassen bemerkt man daß etwas nicht stimmt. Das, was nicht stimmt, ist eigentlich nur die fehlende räumliche Information im Audio-Signal (mono!) gegenüber den räumlichen Bewegungen im Visuellen, also dessen, was durch das Schaufenster gesehen wird. Das Verhältnis von Bild und Ton wirkt plötzlich "wie" synchronisiert, die Synchronisation funktioniert nicht mehr wie gewohnt: nämlich unbemerkt, sondern wird als Bewußtseinsleistung spürbar.'
