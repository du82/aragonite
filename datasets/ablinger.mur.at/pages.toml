["https://ablinger.mur.at/i&_.html"]
title = "Instruments & by Peter Ablinger"
description = "pieces for instruments and something else: an installation of dripping water, a reading performance, a school class, a galery space"
full_description = '''Peter Ablinger: INSTRUMENTS & (since 2006) "Instruments &" ist kein Stück. Es ist ein offenes Projekt, in dem jede einzelne Erscheinungsform nur ein Splitter eines nie in Erscheinung tretenden Ganzen ist. Die erste Aufführung am 26.10.2006 in Berlin im Ballhaus Naunynstrasse, hatte den Untertitel "KEIN KONZERT" und war eine Art öffentlicher Probe wo die Spieler den Notentext erst on stage erhielten; parallel dazu, und wie eine Grundierung dieses nicht-konzertanten Vorgangs, habe ich einen Text - "Progamm Notes For One Composer" - gelesen... Die zweite Aufführung in der Berliner Galerie Coma am 9.1.2007 hat einen ganz anderen Notentext zur Grundlage ("REGENSTÜCK"), der dann auch - wie üblich - vorher einstudiert wurde, und sich aus der Spektral-Analyse einer Regen-Aufnahme herleitet. In Kombination mit der temporären Installation eines Tropf-Geräusches (Wasser aus einem nassen Lappen tropft auf eine Trommel) entsteht eine Art Kontrapunkt verschiedener Zeiten: Das absolut vorhersehbare, aber nicht wiederholbare Ritardando der realen Wassertropfen, und die Da Capo-Spielen einer "Regen"-Partitur, die der Wahrnehmung selbst nach mehrmaliger Wiederholung unvorhersehbar bleibt. Die dritte Aufführung - oder auch Erscheinungsform von "Instruments &" ("16 STÜCKE", UA am 1.2.2007 im Alten Rathaus in Potsdam,) kombiniert die Instrumentalisten (der Notentext kann für verschiedene Besetzungen instrumentiert werden) mit einer Schulklasse. Wie schon in den früheren "Versionen" des Stücks werden gewissermaßen verschiedene Präsenzen einander gegenübergestellt: Das auratisch Aufgeladene und das alltäglich Private, das Kunstvolle und das Schmucklose, die Fiktion (oder Poesie) und das Hier und Jetzt. In die Pausen der "16 Stücke" (diesmal einer Musik, die selbst eher zuzuhören scheint, als daß sie sich dem Hören präsentierte) sagen die verstreut unter das Publikum gemischten Schüler einfach nur das, was sie eben jetzt gerade, während die Musik schweigt, hören. (Dieser Sprecherpart kann ebenfalls variabel besetzt, oder sogar von den Instrumentalisten selbst übernommen werden.) Die Nummer 4 des Zyklus: ein Stück für Solo-Cello und ein Schaufenster, bzw. für eine Situation, in der der/die Cellospieler(in) akustisch, aber nicht visuell von den Zuhörern getrennt ist. Drinnen, bzw. im Raum des Instrumentalisten befindet sich ein Mikrophon auf Stativ. Draussen, bzw. im Zuhörerraum, befindet sich ein einzelner Lautsprecher. Dazwischen geschaltet ist ein Delay von 500ms. Der Klang des Cellos (bzw. alles, was im Raum des Instrumentalisten passiert, wird also mit einer halben Sekunde Verzögerung nach draussen (bzw. in den Zuhörerraum) übertragen. Der/die Spieler(in) kennt die Partitur nicht, und erhält die Noten/Anweisungen erst unmittelbar vor dem Auftritt. Die Nummer 5 ist wieder ein "REGENSTÜCK" und hat ein dem zweiten Stück verwandtes Set-up: Eine temporäre Installation (Wassertropfen auf Schlagzeuginstrumente) wird von einer konzertanten Intervention (eine Regen-Aufnahme für dirigiertes Ensemble instrumentiert) durchdrungen. Zwischen den beiden liegt eine dritte, statisch-kontinuierliche Ebene unabhängiger Streicherstimmen mit langsam durch alle Register gleitenden Dur-Akkorden. Auch das sechste Stück thematisiert, wie schon die anderen Teile des Zyklus, die Konzertform als solche, diesmal aus der Perspektive der 100 Jahre früher entstandenen, Schönbergschen Kammersymphonie - gewissermaßen dem Gründungsstück moderner Instrumental-Ensembles. Der Dirigent ist hier Teil der Besetzung, denn ein guter Teil des Stücks ist wiederum nicht vorher einstudiert, sondern wird im Zustand der Probe präsentiert. Die Nr. 7, WACHSTUM UND MASSENMORD, ist für Titel, Streichquartett und Programmnote, wobei ich diese 3 Elemente als unabhängige und ebenbürtige Komponenten ansehe, und Titel und Programmnote nicht etwa nur Zusätze zum "eigentlichen" Werk, dem Streichquartett darstellen. "SINGDROSSEL oder: der Antiprometheus" heißt das nächste Stück des Zyklus und ist für 3 Violinen. Die repetitive Instrumenmtation deutet schon auf das Zentrum der Auseinandersetzung hin: Die wörtliche und nicht-variierte Wiederholung spielt die Hauptrolle in diesem Stück. Sie soll der Schlüssel sein um den Prometheus Mythos aufzuknacken. STARS & STRIPES ist in der Maximalvariante ein Oktett, ansonsten aber ein Multiple das in verschiedenen Erscheinungsformen auftreten kann. In jedem Fall aber spielt Jimmy Hendrix' Version der amerikanischen Hymne darin eine Rolle... Wie dises Nicht-Stück insgesamt weitergehen wird ist ungewiß. Elemente früherer Aufführungen können in späteren wieder auftauchen; die "Probe" der ersten Aufführung gelegentlich fortgesetzt werden, das tendenziell ewig Aufgeschobene, nie Abgeschlossene des Projekts sich in anderen Besetzungen und Konstellationen fortsetzen. Was sonst noch alles, weiß ich noch nicht, - und das ist das Gute daran. P.A.'''
author = "Peter Ablinger"
year_published = 2025
