title = "Hotel Deutsches Haus"
description = "a street corner in Berlin and a concert piece for wind trio"
full_description = '''Peter Ablinger: Hotel Deutsches Haus 1. Berlin-Kreuzberg, Ecke Manteuffel-/Wiener Straße 2. Bassflöte, Englischhorn, Klarinette und Zuspiel-CD (2000/01) Dauer: 1. immer, 2. 13'36" 1. a street corner in Berlin; 2. bfl,eh,cl,CD; duration: 1. permanent, 2. 13'36" Das Stück HOTEL DEUTSCHES HAUS bezieht sich auf eine Straßenecke in Berlin-Kreuzberg (Ecke Manteuffel-/Wiener Straße). Eigentlich ist diese Ecke bereits das Stück. Oder anders herum: Diese Ecke ist das eigentliche Stück. (Man kann diesen Ort als Klanginstallation begreifen � allerdings wurde nichts installiert, außer der Absicht, diesen Ort als Klanginstallation begreifen zu wollen.) Das Instrumentaltrio ist dagegen eine Art Anhang zum �eigentlichen� Stück, dem Ort. Ein Foto davon. Ein Kommentar dazu. Eine von vielen Versionen, etwas �über� diese Straßenecke zu sagen.'''
