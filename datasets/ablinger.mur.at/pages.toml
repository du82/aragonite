["https://ablinger.mur.at/txt_bosanski.html"]
title = "bosanski tekstovi"
description = "Peter Ablinger - bosanski tekstovi"
full_description = '''peter Ablinger - bosanski tekstovi Stvarati slu�anjem Amila Ramovic, umjetnicka rukovoditeljica projekta Studio Peter Ablinger, kompozitor koji je formiran u konvencionalnom ambijentu klasicne kompozicije i jazza (i, uz to, za muzicare manje konvencionalnom svijetu grafickih umjetnosti) realizaciju svoje umjetnosti utemeljuje na vje�tini koja je dostupna svima, i kojom, uz posvecenost i trud, virtuozno mogu ovladati svi: slu�anju. U njegovim djelima mi trenutno prepoznajemo tragove najradikalnijih ideja Johna Cagea, koji je ambijentalni zvuk emancipovao do muzickog materijala. Ali Cageov fokus bio je na djelu, kao vremenskom prostoru, koji je tek popunjen materijalom prema kojem je on indiferentan i koji mo�e biti bilo �ta �to donese slucaj - u fokusu njegovih vremenskih procesa je ono �to se slu�a. Ablinger se, medutim, bavi onim �to se cuje. On ne propagira indiferentni odnos prema zvucnom okoli�u, nego u fokus stavlja licni odnos, pojedinacno iskustvo onoga koji cuje i onoga �to se cuje. Fokus na empirijsko iskustvo pojedinca veoma je va�an otklon od cisto konceptualnih praksi visokog modernizma ili relativizirajucih praksi postmodernizma. Cak bismo mogli reci da se on konceptualno pribli�ava, za umjetnost danas veoma provokativnim, prostorima spekulativnog realizma. Upravo na nivou licnog iskustva, unutar umjetnickog djela pojedinac se srece sa iskustvom svijeta u prostoru vlastitog tijela, i kroz to iskustvo tumaci umjetnicki do�ivljaj. Ako o umjetnosti mislimo kao o posebnom metodu koji nudi jedinstveni pristup svjetovnoj realnosti, onda je umjetnost Petera Ablingera jedinstveni metod kojim umjetnicku spoznaju posti�emo otkrivanjem suptilnih nijansi vlastitog iskustva, u sebi, kroz tijelo, okrenuto prema vani, i prema unutra. U vremenu podatkovnog zagadenja, kakofonije, shizofonije, o kojoj pi�e R. Murray Schafer, spoznajemo da je buka sve �to nastaje kada ne slu�amo pa�ljivo: buka su zvukovi koje smo naucili da treba da ignori�emo. Sve �to se potrudimo da cujemo, prestaje biti ostranjeno, neprijatno, drugo. Ablinger nas poziva da fokus usmjerimo na suptilne odnose koji cine na�u zvukovnu stvarnost i na�u �ivotnu stvarnost, i na osvje�tenje procesa slu�anja, kako je to sublimirano u njegovom djelu Weiss/Weisslich 11f: Denken was ich höre [Mi�ljenje onog �to cujem] (2012). Veoma preciznim intervencijama u prostoru odnosa umjetnickog i dru�tvenog, Ablinger se, nikada ne zapadajuci u banalno reproduciranje problema svakodnevnice, pozicionira zapravo kao anga�irani umjetnik par excellence, u svijet unoseci spoznaje kakve samo umjetnost mo�e da otkrije. Peter Ablinger / Bio Peter Ablinger (r. 1959, Austrija, �ivi u Berlinu) od 2012. je profesor kompozicije na Univerzitetu Huddersfield. Posebno je anga�ovan u radu Centra za Novu muziku (CeReNeM), vodeci majstorske radionice, predavanja i specijalne projekte sa studentima i nastavnicima. Kao jedan od najinovativnijih i najutjecajnijih kompozitora dana�njice, u podrucju Nove muzike, proizveo je opus naj�ireg opsega - od orkestralnih djela i opere do instalacija. Njegov rad je redovito predstavljen na svim vecim internacionalnim festivalima, ukljucujuci Berlinsko bijenale, Venecijansko bijenale, Holland Festival, Triennale Köln i Carnegie Hall New York. Njegova izdanja ukljucuju vi�e od trideset nosaca zvuka i mnogobrojne autorske tekstove u casopisima, knjigama i umjetnickim antologijama. Njegov rad je popracen i nagradama kao �to su Andrzej-Dobrowolski-Kompositionspreis (2008) i Deutschen Klangkunstpreis (2010). Bio je kustos i ko-kustos festivala Donaueschinger Musiktage i Festival Conceptualisms Akademie der Künste, Berlin (2003) i Turning Sounds u Var�avi i Hörsturz u Berlinu (2005). Ablingerov rad s bukom, spacijalizacijom, spektralnim modeliranjem/transkripcijom i percepcijom zvuka redovito je dobivao podr�ku velikih istra�ivackih centara muzicke tehnologije, od kojih su najpoznatiji Experimental studio Heinricha Strobel Stiftung u Freiburgu, TU Berlin te IEM u Grazu. U sredi�tu njegova rada je istra�ivanje razlicitosti izmedu stvarnosti i na�e percepcije stvarnosti u zvuku. Cin slu�anja i buka, ili bolje receno, "Rauschen" (njemacki naziv) su dominantne teme Ablingerovog rada i istra�ivanja u muzici du�e od 20 godina. Njegovo preispitivanje fundamentalnih vrijednosti muzicke percepcije kori�tenjem osnovnih sredstava, kao �to su ljestvice, mogu se povezati s njegovim iskustvom u grafickoj umjetnosti koju je studirao, ukljucujuci i studije kompozicije sa Romanom Haubenstock-Ramatijem, koji je bio zacetnik kori�tenja graficke notacije. "Danas je Peter Ablinger jedan od nekolicine savremenih umjetnika koji koriste buku bez ikakvog simbolizma, ne kao znak za kaos, energiju, entropiju, poremecaj ili uzbunu, ne kao simbol za protivljenje, neposluh ili razaranje. U svim ovim slucajevima u muziku se namjerno ukljucuje buka, buka je subjekt, ali za Ablingera ona je samo buka. Takoder, Peter Ablinger je daleko stigao preispitujuci prirodu zvuka, vremena i prostora (komponente koje se obicno smatraju centralnim za muziku), a njegova otkrica su ugrozila i dovela u pitanje konvencije koje su se uobicajeno smatrale neupitnim. Ovi njegovi stavovi prenose se na pitanja ponavljanja i monotonije, redukcije i suvi�nosti, gustoce i entropije" (Christian Scheib). Djela Petera Ablingera su izvodena na Wiener Festwochen, Berliner Festwochen, Wien Modern, Darmstädter Ferienkurse, Musikprotokoll des Steirischen Herbstes, Bienale Berlin, Donaueschinger Musiktage, Internationales Musikfestival Istanbul, Los Angeles Resistance Fluctuation, Festival of Vision Hong Kong, Teatro Colón Buenos Aires, SuperDeluxe Tokyo, Kunstraum Düsseldorf, Cut&Splice London, Música Contemporánea Santiago de Chile, Maerzmusik Berlin, Holland Festival Amsterdam, La Biennale di Venezia, Carnegie Hall New York, medu ostalima. Njegove instalacije proizvedene su za Offenes Kulturhaus Linz, Stadttheater Gießen, Diözesanmuseum Köln, Rote Fabrik Zürich, Santa Monica Museum of the Arts, Kunsthalle Karlsplatz Wien, Akademie der Künste Berlin, Kunsthaus Graz, Ostseebienale der Klangkunst, Kunsthalle Rostock, MAK Wien, Märkisches Museum der Stadt Witten, Haus am Waldsee Berlin, WUK Kunsthalle Matadero Madrid, MuHKA Antwerp, Skulpturenmuseum Marl, SoundART Köln, Ars Electronica Linz, itd. Peter Ablinger je predavao na Univerzitetu za muziku u Grazu te suraduje s ansamblima Klangforum Wien, United Berlin i Insel Musik. U Berlinu je oformio ansambl Zwischentöne 2007. godine. Proteklih godina bio je gost predavac i odr�avao majstorske radionice na Columbia University, BARD College, Manhattan School of Music, Yale University i Mozarteum Salzburg. U maju 2012. godine, izabran je za clana Akademije umjetnosti u Berlinu. Biografija i bilje�ke o djelima Petera Ablingera citirane sa http://www.hud.ac.uk/research/researchcentres/cerenem/peterablinger Peter Ablinger / Ideje Djelo Petera Ablingera postavlja se kao provokacija pred muzicke konvencije mo�da vi�e nego djelo bilo kojeg drugog kompozitora od Johna Cagea 1950-tih godina. Kao takvo je stasalo kroz niz paralelnih umjetnickih projekata, ukljucujuci njegovo ispitivanje prirode buke (i njene veze sa fizickim prostorom), koncepata vertikalizacije zvuka, kompleksnih analiza i "fonorealistickih" instrumentalnih transkripcija ambijentalne buke i govora (video njegovog "govoreceg klavira" jedan je od mo�da najgledanijih videa savremene muzike na internetu u posljednjim godinama), prostorno specificne slu�alacke okoli�e [site-specific listening environments] (najrecentnije, CityOpera i Landscape Opera), i konceptualno izazovne serije fotografija Sehen und Hören [Vidjeti i slu�ati]. Ablingerov rad sa bukom - ili, konkretno, Rauschen, na njemackom jeziku - je vi�edimenzionalan, ali je u najvecoj mjeri voden svije�cu o vi�ku podataka u buci / �umu (njenom mno�tvu i nejasnom nedostatku hijerarhija) i shodno tome, aktivnim odnosom slu�aoca prema ovim zvucnim podacima kroz konstrukciju obrazaca, melodijskih figura, impliciranih pokreta i zvucnih figura "unutar" nestabilne staticnosti buke. Ovaj aktivni nacin slu�anja proizilazi djelimicno iz konfrontacijskog pristupa muzici i zvuku. Ablingerovo djelo ne poziva slu�aoca na neposredni kontakt na svojoj povr�ini, vec ponekad grubi, staticni, nestabilni zvucni svjetovi kreiraju slu�alacke okoli�e u kojima pojedinac postaje svjestan cina i procesa slu�anja. To je izuzetno jedinstvena muzika - istovremeno repetitivna i nestabilna, istovremeno realna i apstraktna (Quadraturen, instrumentalne transkripcije govora i buke, na primjer), istovremeno jednostavna i kompleksna (terenski snimci vodopada ili car�afa koji se vijore na vjetru, jednostavne ljestvice izvedene na bijelim tipkama klavira, zvuk prazne katedrale) - i to je rad koji je primjer istra�ivanja utemeljenog u praksi. To je rad koji postavlja znacajna pitanja o zvuku i o muzici, ali ta pitanja, naravno, moraju biti do�ivljena da bi bila pitana, i do�ivljena da bi bila shvacena. Njegova djela cesto postavljaju ogledalo pred slu�aoca i pred konvencije slu�ateljske prakse. Ovo je nedavno nagla�eno u njegovim ostvarenjima, Landcape Opera i CityOpera, modularnim djelima koja kombiniraju razlicite umjetnicke forme (knji�evnost, koncerte, instalaciju, film, performans, arhitekturu, land art, itd.) na takav nacin da mjesto (grad, okoli�) postaje predmet opere. Ova djela kombiniraju terenske snimke, izgradnju "scenografija" u okoli�u (ukljucujuci sadnju drveca, izgradnju arhitektonskih/skulpturalnih okoli�a), film/video, �ivu izvedbu i postavnje publike u situaciju slu�anja okoli�a (postavljanje stolica u javnim prostorima koje odgovaraju koncertnoj postavci sjedi�ta za publiku, na primjer) koje proizvode direktnu svijest o zvuku ili pojacanim stanjima slu�anja, o razlici izmedu stvarnog, fizicki primljenog, i unutarnjeg, do�ivljenog zvuka. Moj materijal nije zvuk. Moj materijal je cujnost. Dok drugi rade sa zvukom, mo�da postave zvuk i onda pauzu, ja postavljam cujnost i onda necujnost. Necujnost se mo�e proizvesti razlicitim sredstvima. Ti�inom, ali i glasnocom. Preniskim tonovima, ali i previsokim. Sporo�cu, ali i brzinom. Premalim brojem stvari koje se pojavljuju, ali i prevelikim. Prevelikom blizinom i prevelikom daljinom. Prekratkim trajanjima i predugim trajanjima. Prazninom i punocom. P.A.6/97 "Jednom, mislim da je to bilo 1986, u ljeto - �etajuci poljima istocnog Beca, blizu granice i Haydnovog rodnog mjesta, do�ao sam do necega izuzetnog. Kukuruz je stajao uspravno, neposredno pred �etvu. Vreli istocni ljetnji vjetar je duvao poljem i odjednom sam cuo 'das Rauschen', (buku, �um). Iako mi je cesto bilo obja�njeno, i dalje ne znam razliku izmedu p�enice i ra�i. Ali ja sam razliku cuo. Vjerujem da je to bio prvi put da sam je cuo izvan estetskih okolnosti (koncerta, na primjer). Ne�to se dogodilo. Ono prije i ono poslije su bili kategoricno razdvojeni, nisu vi�e imali veze jedno sa drugim. Barem mi se tako ucinilo tada. Padaju mi na pamet i druga uporediva iskustva koja pobuduju opnu percepcije, ali hodanje �itnim poljem je mo�da bilo najupecatljivije. Na ovaj ili onaj nacin, cini mi se, sva djela koja sam od tada uradio imaju veze sa ovim iskustvom. Cak i komadi koji nisu posveceni �umu, ili oni namijenjeni sviranju na tradicionalnim instrumentima, itd." Peter Ablinger Tekstovi i Prijevodi: Sarajevo Sonic Studio 2014 Crte�i: Peter Ablinger Intervju na Radio Slobodna Evropa: Peter Ablinger: Slu�anje nije pasivni osjecaj'''
