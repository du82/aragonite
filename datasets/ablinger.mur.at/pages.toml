["https://ablinger.mur.at/i&_aufhoeren.html"]
title = "Remove.Terminate.Exit. (Rainpiece Bergen)"
description = "electric guitar, ensemble, 2 speakers, live-electronics, dripping bathrobes"
full_description = '''Peter Ablinger: REMOVE.TERMINATE.EXIT. (RAINPIECE BERGEN) from: "Instruments &" Concert-Installation for Solo-Guitar, Ensemble in 2 Groups, 2 Speakers, Live-Electronics and 50 Dripping Bathrobes 2007/2016-2018 ensemble: fl,ob,cl,bsn,hrn,trp,tbn,hrp,pno,2vl,va,vc,cb; overall duration: ca. 100' "ass cloud", ink on paper the drawing ("ass cloud") could serve as the shortest possible (poetic) abstract of the piece - or at least of the text for the 2 speakers: Liese/God sits down and pushes. and out comes an apocalyptic rain. it washes away everything that was and is and will be. (here the text for 2 speakers in the german original: "Antikalypso" by Peter Ablinger) Commissioned by BIT20 Ensemble, Bergen; premiere: March 2018, Borealis Festival rehearsal with dripping bathrobes, Bergen, Grieg Hallen Foyer'''
