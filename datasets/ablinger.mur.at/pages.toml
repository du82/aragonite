["https://ablinger.mur.at/phonorealism.html"]
title = "Phonorealism"
description = "the tranfer of recorded sounds to instruments, representation of phonographs by instrumental sounds"
full_description = 'Phonorealism The Reproduction of "Phonographs" by Instruments (1) The first step is always an acoustic photograph ("phonograph"). This can be a recording of anything: speech, street noise, music. (2) Time and frequency of the chosen "phonograph" are dissolved into a grid of small "squares" whose format may, for example, be 1 second (time) to 1 second (interval). (3) The resulting grid is the score, which is then to be reproduced in different media: on traditional instruments, computer controlled piano, or in white noise. The reproduction of "phonographs" by instruments can be compared to photo-realist painting, or - what describes the technical aspect of the "Quadraturen" more precisely -with techniques in the graphic arts that use grids to transform photos into prints. When using humanly played instruments the grid has to be enlarged (slowed down) to remain playable - thus the result of the transformation is not so much a reproduction of the original but an approach to or a situation of comparison between instrumental sounds and the original sound source. Using a smaller grain, e.g. 16 units per second (about the limit of the player piano), the original source approaches the border of recognition within the reproduction. With practice listening the player piano can even perform structures possible for a listener to transpose into/understand as spoken sentences. Actually however, my main concern is not the literal reproduction itself but precisely this border-zone between abstract musical structure and the sudden shift into recognition - the relationship between musical qualities and "phonorealism": the observation of "reality" via "music".'
author = "Peter Ablinger"
year_published = 2025
