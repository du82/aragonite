["https://ablinger.mur.at/txt_godard.html"]
title = "Hommage á Godard"
description = "Konzeptstück für 2 Filme"
full_description = 'Hommage á Godard für 2 Kameraleute / 2 parallele Filmprojektionen Konzept: Zwei Kameraleute gehen, sich gegenseitig filmend, von fern aufeinander zu und knapp aneinander vorbei; Anfangs sind sie als ganze Figur im Bild; Während sie sich einander annähern, nehmen sie immer mehr Raum innerhalb des Bildausschnitts ein, bis nur mehr ihre Büste, und schließlich - für einen Moment - die vors Auge gehaltene Kamera die Leinwand füllt... um unmittelbar danach die Personen-leere Landschaft freizugeben. Das Ergebnis wird gleichzeitig auf zwei parallelen Leinwänden projiziert. aus den Notizbüchern von Peter Ablinger, datiert 17.3.1988 A realisation of the piece, Mesr, Iran 2013: "Hommage á Godard" performed by Javad Molania and Negar Ramzi compare: Wegnehmen Fallstudie Videostücke / Video Pieces'
