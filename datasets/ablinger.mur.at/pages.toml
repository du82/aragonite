["https://ablinger.mur.at/werk89ot14instr.html"]
title = "OHNE TITEL / 14 INSTRUMENTALISTEN"
description = "ca.12', fl,tsax,cl,trp,trb,tb,pno,2perc,2vl,va,vc,db"
full_description = '''Peter Ablinger: OHNE TITEL / 14 INSTRUMENTALISTEN (1992) ca.12', fl,tsax,cl,trp,trb,tb,pno,2perc,2vl,va,vc,db At least while I was working on the score for "Ohne Titel/14 Instrumentalisten" ("Untitled/14 Instrumenalists") the piece DID have a title, which was: "Augen (Ikonen 2)" ("Eyes (Icons 2)"). Around the same time I had filled up a writing pad with pairs of eyes based on the techniques of Byzantine painting. It was always the same pair of eyes, perhaps 30 or 40 on a page, until the pad was full. On the front cover I wrote "Augen (Ikonen 1)" ("Eyes (Icons 1)"). (P.A., transl. Anne Durand and Mark Court) "Augen (Ikonen 1)", ink, one page from writing pad > Augen (Ikonen 1), pages 12-14 > score, page 19 > listen (Ensemble Klangforum, conductor: Silvain Cambreling) > CD > Text zum Stück > english translation of program note'''
