["https://ablinger.mur.at/city-opera-buenos-aires.html"]
title = "Cityopera Buenos Aires"
description = "sound archive, book, piano installation, conference, public intervention, imagination, concert for ensemble, city noises and video"
full_description = '''Peter Ablinger: Cityopera Buenos Aires in 7 Acts Video still from the 7th act, a 60 minutes piece for ensemble, city noises and video Video: Ian Kornfeld, Voice: Carmen Baliero; Premiere: Buenos Aires, November 2011; stuff and venues. primero acto: "EL CANTO" an archive of the sounds and noises of Buenos Aires. installation for a galery space. segundo acto "EL LIBRETO" a book - not be set into music, but to take away and read privately tercero acto "EL REPETIDOR" an interactive piece for a large vidriera and a computer controlled piano. a microphone picks up input outside, the piano realizes this input inside in real-time. cuarto acto "EL CORO" a conference about acoustics and ecology, a conference about noise between aesthetics and pollution quinto acto "EL DISPOSICIÓN" 20 chairs in rows, like a small audience, set in public space, to different announced places, for one hour each. it is possible to sit down and listen. sexto acto "LA PAUSA" your way to and from another part of this opera, the time between acts. septimo acto "LA FINAL" a concert for ensemble, city noises and video 60 minutes recorded city noises from the 1st act, and the recording of a female voice (Carmen Baliero, talking, not singing) tranfered into music. the video (Ian Kornfeld) is one shot over the whole time, a typical street corner of almagro, - but only in a few moments are the sounds of the concert synchronized with the video. fl, 2cl, hrn, trp, tbn, pno, 2vl, va, vc, cb, video, 60' Pictures from the premiere, Buenos Aires 2011 (Photographs: Lula Bauer): Listen: Carmen Baliero talking about the rain in Buenos Aires OPERA OBRAS (2007) Una ópera para lugares y tiempos conectados entre sí Traducción: Alberto C. Bernal (PDF 9 KB) ARTE Y CULTURA (2003) Traducción: Alberto C. Bernal (PDF 11 KB) "Los sonidos siempre cuentan algo" - Entrevista con Pablo Gianera - La Nacion El compositor austríaco Peter Ablinger presentará dos obras en Buenos Aires, dentro del Ciclo de Música Contemporánea del Teatro San Martín english e-mail interview with Pablo Gianera about the Cityopera, Voices And Piano, and on perception stuff and venues for Cityopera Buenos Aires, Noviembre 2011 Chiyoko Szlavnics: TEN QUESTIONS ABOUT "CITYOPERA", 2008 about Peter Ablinger's Cityopera Graz más textos en español see also: STADTOPER / CITYOPERA GRAZ OPERA/WERKE, Landscape Opera (English edited by Simon Charles)'''
