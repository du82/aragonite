["https://ablinger.mur.at/ieaov4_fischer.html"]
title = "IEAOV - Für Johann Michael Fischer"
description = "2 Posaunen, 2 Violoncelli, 2trb, 2vc, electronics"
full_description = '''Peter Ablinger: IEAOV Instrumente und ElektroAkustisch Ortsbezogene Verdichtung ("FÜR JOHANN MICHAEL FISCHER") 2 Posaunen, 2 Violoncelli (1995-97), 22' 2trb, 2vc, electronics, 22' > general introduction to IEAOV pieces Instrumente und ElektroAkustisch Ortsbezogene Verdichtung ("Für Johann Michael Fischer"), 2 trombones, 2 violoncellos, composed 1995-97; program: Sylviane Sapir, IRIS Rom, und Thomas Hummel, Experimentalstudio der Heinrich-Strobel-Stiftung des Südwestfunks, Freiburg; revised version: Wolfgang Musil, Vienna. Premiered: Donaueschingen, Germany, 1997 Basilica Ottobeuren, 1748 by Johann Michael Fischer Johann Michael Fischer (1692-1766), architect und constructor of the monastery churches of Ottobeuren, Zwiefalten, Rott am Inn (Germany). His lifework consisted in ever new suggestions to solve an old european conflict: the conflict between basilica und central building (Zentralbau), between long and round construction, between pacing out and omnipresence, and one could carry on: between "path" and "place", between teleology and presence, between "thinking" and "hearing". Requirements for IEAOV ("for Johann Michael Fischer"): 2 alto trombones, 2 violoncellos, MaxMSP, 4 microphones, 8 loudspeakers Das vierte Stück der IEAOV-Reihe, eine Auftragskomposition des Südwestfunks Baden-Baden für die Donaueschinger Musiktage 1997: Instrumente und ElektroAkustisch Ortsbezogene Verdichtung ("für Johann Michael Fischer"), 2 Posaunen, 2 Violoncelli, 1995-97; die Spieler: Michael Svoboda, Andrew Digby, Gregory Johns, Scott Roller; Programm: Sylviane Sapir, IRIS Rom, und Thomas Hummel, Experimentalstudio der Heinrich-Strobel-Stiftung des Südwestfunks, Freiburg. Johann Michael Fischer (1692-1766), Architekt und Erbauer der Klosterkirchen von Ottobeuren, Zwiefalten, Rott am Inn. Sein Lebenswerk bestand in immer neuen Lösungsvorschlägen, um einen alten europäischen Konflikt aufzuheben: den zwischen Basilika und Zentralbau, zwischen Längs- und Rundbau, zwischen dem Abschreiten und der Allgegenwart, und man könnte weiterführen: zwischen "Weg" und "Ort", zwischen Teleologie und Anwesenheit, zwischen "Denken" und "Hören". Im vierten der IEA0V Stücke werden die Ergebnisse verschiedener Untersuchungen über komplementäre Spektren auf Instrumentenklänge übertragen. Zeitliche Veränderungen sind auf einen einzigen Parameter zurückgenommen: den Raum. > set-up informations from the score > filter lay-out, detail 6'30" to 8'41" from the score > page 12 from the instrumentalists score > listen > CD > Lydia Jeschke about IEAOV ("for Johann Michael Fischer") > Text zur IEAOV-Serie > complete list of IEAOV pieces > general introduction to IEAOV pieces for score and software contact the publisher: ZEITVERTRIEB WIEN BERLIN Bryan Eubanks, Gotzkowskystr. 15, D-10555 Berlin,T: +49 / 176 / 47 39 29 97, zeitvertrieb@proton.me'''
