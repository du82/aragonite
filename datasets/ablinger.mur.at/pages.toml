["https://ablinger.mur.at/txt_ruido_esp.html"]
title = "Música estática - Investigaciones sobre el ruido, por Christian Scheib"
description = "Investigaciones sobre el ruido, Características de la obra de Peter Ablinger"
full_description = "Christian Scheib: Música estática - Investigaciones sobre el ruido Características de la obra de Peter Ablinger CalArts 1997/1998 versión original en inglés editado por Bill Dietz, traducido por Sergio Bové En los últimos a�os el compositor Peter Ablinger ha focalizado su trabajo en investigaciones sobre el ruido estático. Este artículo ofrece un panorama de sus descubrimientos, de las ideas y concepciones que colocaron al ruido estático en el centro de su interés, así como de las piezas que ha escrito y/o desarrollado. Ablinger compone música para solistas, ensembles y orquesta; realiza instalaciones y performances; trabaja con medios electrónicos y con electrónica en vivo. Peter Ablinger es uno de los pocos artistas actuales que utiliza el ruido sin ningún tipo de connotación simbólica. No lo usa como un significante del caos, ni para generar energía, entropía, desorden o bullicio; ni para posicionarse en contra de alguien o de algo; o para ser desobediente, destructivo. Para Ablinger el ruido es el objeto central. Peter Ablinger también estuvo un largo período cuestionándose la naturaleza del sonido, del tiempo y del espacio (componentes considerados centrales en la música) y sus respuestas comprometieron y pusieron en jaque las convenciones que usualmente se consideraban irrefutables en la música. Estas respuestas están relacionadas con la repetición y la monotonía, la reducción y la redundancia, la densidad y la entropía."
author = "Peter Ablinger"
year_published = 2025
clearnet = "https://ablinger.mur.at/txt_ruido_esp.html"
