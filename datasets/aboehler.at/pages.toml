title = "DokuWiki 2Factor Google Authentication Plugin        [Andreas Böhler]"
description = "Professional Homepage of DI(FH) Dr. Andreas Böhler, MLBT"
full_description = "« Authenticate openERP against postfixAdmin databaseNew Company R'n'B Medical Software Consulting GmbH » DokuWiki 2Factor Google Authentication Plugin Personally, I use DokuWiki for various things. Recently, I stumbled upon the Google 2Factor authentication and looked for a DokuWiki plugin. There was a very basic one, that only supported one static key for all users. Based on this implementation, I decided to create my own implementation. This version supports multiple users with different keys, user self service via the Update Profile link, force and hint on non-existing keys as well as a very basic admin interface. Find the code in my hg repository at www.aboehler.at/hg/authg2fa Dokuwiki, 2Factor, GoogleAuthenticator This website uses cookies. By using the website, you agree with storing cookies on your computer. Also you acknowledge that you have read and understand our Privacy Policy. If you do not agree leave the website.OKMore information about cookies"
