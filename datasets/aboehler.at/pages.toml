full_description = "DokuWiki PlugIns DokuWiki is my favourite Wiki platform for doing all kinds of things. This website runs on DokuWiki, too. Being a very powerful Wiki, it can be easily customized and extended with plugins. For various projects and use-cases I neede to create or enhance a PlugIn. authg2fa This plugin adds two-factor Google authentication support to the DokuWiki login page. Documentation www.dokuwiki.org/plugin:authg2fa Source www.aboehler.at/hg/authg2fa Bugtracker code.rnb-consulting.at/tag/authg2fa_plugin datapopup When using the data-plugin, it might be useful to display additional information in a popup dialog instead of having to click on the link. This plugin supports this functionality by adding regexes for the links to attach to. Documentation www.dokuwiki.org/plugin:datapopup Source www.aboehler.at/hg/datapopup Bugtracker code.rnb-consulting.at/tag/datapopup_plugin autoid This plugin enhances the bureaucracy plugin by a new field: autoid. It searches for existing pages with a given template and increases the number attached to it on page creation, for instance BUG-1, BUG-2, … Documentation forum.dokuwiki.org/thread/7620 Source www.aboehler.at/hg/autoid Bugtracker code.rnb-consulting.at/tag/autoid_plugin linksenhanced Enhance the linking syntax by allowing wiki markup within the displayed text. This is useful if you want to format your link a bit better or if you have, e.g., the fontawesome plugin installed to render the link. Documentation www.dokuwiki.org/plugin:linksenhanced Source www.aboehler.at/hg/linksenhanced Bugtracker code.rnb-consulting.at/tag/linksenhanced_plugin csstimeline A simple plugin to generate a CSS-only timeline. Documentation www.dokuwiki.org/plugin:csstimeline Source www.aboehler.at/hg/csstimeline Bugtracker code.rnb-consulting.at/tag/csstimeline_plugin jorgchart A simple JavaScript-only plugin to generate an organisational chart from a list Documentation www.dokuwiki.org/plugin:jorgchart Source www.aboehler.at/hg/jorgchart Bugtracker code.rnb-consulting.at/tag/jorgchart_plugin davcal A calendar plugin with synchronisation and sharing support. Requires webdavclient for Client support. Documentation www.dokuwiki.org/plugin:davcal Source www.aboehler.at/hg/davcal Bugtracker code.rnb-consulting.at/tag/davcal_plugin davcard A contacts plugin with synchronisation and sharing support. Requires webdavclient for client support. Documentation www.dokuwiki.org/plugin:davcard Source www.aboehler.at/hg/davcard Bugtracker code.rnb-consulting.at/tag/davcard_plugin webdavclient A generic WebDAV client that support synchronising calendar and address books. Allows davcal to subscribe to remote calendars, an addrss book PlugIn is in the works. Documentation www.dokuwiki.org/plugin:webdavclient Source www.aboehler.at/hg/webdavclient Bugtracker code.rnb-consulting.at/tag/webdavclient_plugin This website uses cookies. By using the website, you agree with storing cookies on your computer. Also you acknowledge that you have read and understand our Privacy Policy. If you do not agree leave the website.OKMore information about cookies"
