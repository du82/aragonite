["https://aboehler.at/doku/doku.php/blog:2015:1018_upgraded_thinkpad_x240_touchpad_and_windows_10"]
title = "Upgraded ThinkPad X240 touchpad and Windows 10        [Andreas Böhler]"
description = "Professional Homepage of DI(FH) Dr. Andreas Böhler, MLBT"
full_description = "« New Company R'n'B Medical Software Consulting GmbH Upgraded ThinkPad X240 touchpad and Windows 10 A few weeks ago, I upgraded the touchpad of my X240 to the newer X250's variant featuring physical buttons. It worked out-of-the-box on Linux and using a specific driver version also under Windows 7. After upgrading to Windows 10, the physical buttons wouldn't work at all and I started messing around with the Synaptics driver. It seems that the wrong driver is installed, as soft buttons are reported in the control panel. When I poked through the SynPD.inf file, I noticed that there are quite a few registry settings that influence the behaviour of the driver. I researched my device ID and the device ID of the X250 and found out that the X250's device ID is LEN0046, while mine is LEN0038. I came up with a registry patch file (it's actually a .inf, you need to install it with a right click → Install) that converts the settings to LEN0046. I only incorporated the changes necessary for LEN0038 → LEN0046, but I'm quite positive it works with other devices as well. You can download the patch file here. This website uses cookies. By using the website, you agree with storing cookies on your computer. Also you acknowledge that you have read and understand our Privacy Policy. If you do not agree leave the website.OKMore information about cookies Discussion Esa Ollitervo, 2015/10/27 09:25 Thanks. This worked with jbg206ww driver with LEN0036 device ID :)"
