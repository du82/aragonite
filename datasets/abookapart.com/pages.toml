description = "Find clarity as you drive toward the next step in your tech career."
full_description = '{ "@context": "http://schema.org/", "@type": "Book", "name": "Surviving Change at Work", "url": "https://abookapart.com/products/surviving-change-at-work", "author": { "@type": "Person", "name": "Vanessa Gennarelli", "sameAs": "https://www.linkedin.com/in/michaelangeles" } , "datePublished": "2023-09-12", "inLanguage": "English", "isbn": "978-1-952616-62-4", "numberOfPages": "156", "publisher": { "type": "Organization", "name": "A Book Apart", "sameAs": [ "https://abookapart.com/", "https://www.instagram.com/abookapart/", "https://linktr.ee/abookapart", "https://twitter.com/abookapart" ] }, "genre": "Web Design" } Vanessa Gennarelli Surviving Change at Work foreword by Cassidy Williams Find clarity as you drive toward the next step in your tech career. @media (min-width: 660px) { .product-header { background-image: url(../cdn/shop/files/aba-000048-pp-pair-1-5x7_769x@2x.progressive.png%EF%B9%96v=1694516903.jpg); } } @media (min-width: 769px) { .product-header { background-image: url(../cdn/shop/files/aba-000048-pp-pair-1-5x7_960x@2x.progressive.png%EF%B9%96v=1694516903.jpg); } } @media (min-width: 960px) { .product-header { background-image: url(../cdn/shop/files/aba-000048-pp-pair-1-5x7_1100x@2x.progressive.png%EF%B9%96v=1694516903.jpg); } } @media (min-width: 660px) { .product-header { background-color: #73a1a6; } } Get this book Please reach out to this book’s author to inquire about availability. A Book Apart no longer sells or distributes books. The reality of working at a high-growth organization can be tough to endure. From product pivots to constantly shifting expectations to personnel turnover, it’s enough to cause whiplash. If this is your first (or second, or even third!) rodeo in a tech job, and you’re wondering how to stay upright amid the tumult, Surviving Change at Work will keep you grounded.Vanessa Gennarelli brings to bear years of hard-earned expertise in this essential handbook, sharing extensive research, case studies, and practical exercises to help you find clarity as you drive toward the next step in your tech career. Along the path, learn how to apply the art of persuasion and influence, and assess organizational lifecycles for better decision-making. You’ll gain strategies for navigating shifts in culture with resilience, and frameworks for planning—and sustainably growing—your career. This book explores: How to plot your career path by evaluating a company’s business lifecycleSteps for navigating shifting culture dynamics and new structuresFrameworks for gaining influence and leading through transitionHow to identify your priorities and create an aligned career plan, now and for the future Quote 1 Quote 2 Quote 3 Quote 4 Vanessa has an incredible ability to address the tough questions we’re all wanting to ask, even when we’re too afraid to ask them—or we don’t know who to go to. In this book, she offers invaluable career advice that’s grounded in personal experience and packed with great wisdom and practical tools. Written in Vanessa’s inimitably no-nonsense style, this book is a treasure. Shanku Niyogi VP of product at Databricks Previous Next When it comes to careers, there are few wrong choices you can make, except one: not choosing at all. Surviving Change at Work helps you intentionally design a career with purpose, rather than simply letting your career happen to you. Sean Blanda VP of content at Crossbeam Previous Next Because of her proven expertise leading teams and her personal thoughtfulness, Vanessa understands the necessary dialogue between organizations and individuals like few people do. Emily Goligoski Head of research and SVP at Charter Previous Next Change is a constant in our careers, and having a game plan to deal with it is key to survival both on a personal and professional level. Thank you, Vanessa, for recognizing the need for a field guide like this. Lynda Smith Former CMO at Twilio and mParticle, and GM at Nuance Previous Next About the Author Vanessa Gennarelli is the principal of Fortuna, a change management firm, and the chief operating officer for Raise.dev. She has led cross-functional teams at rapidly growing organizations, including GitHub Education through its acquisition by Microsoft. While at one of the largest tech companies on the planet, she learned how to navigate cultural differences, integrate new processes, and help direct reports thrive through change.With a background in instructional design, Vanessa has a master’s degree in technology, innovation, and education (Harvard). She is a former research intern at MIT Media Lab and a graduate of the LEAD Program (Stanford Business School). At home in Philadelphia, she invests in small businesses through the Circle of Aunts and Uncles, a group dedicated to supporting local entrepreneurs. She also serves on the Board of Directors for the Circadium School of Contemporary Circus. Product Details ISBN: 978-1-952616-62-4 Paperback: 156 pages Published: Sep 12, 2023 Part ofa Pack! Career Growth Expand your career by using your voice. Careers Also From A Book Apart Rachel Andrew The New CSS Layout Chris Coyier Practical SVG Michael Angeles, Leon Barnard, & Billy Carlson Wireframing for Everyone Sameera Kapila Inclusive Design Communities Tote Bag A Book Apart Mug'
