full_description = "Help & FAQs Frequently Asked Questions Are books still available? Ownership and publishing rights for all books have been given back to their respective authors. Many authors are continuing to offer their work for free or in new editions. A Book Apart no longer sells or distributes books, please reach out to authors for information about availability. Can I recover ebook files from a past order? A Book Apart closed up shop in 2024, we no longer sell or distribute books. If you are looking to recover ebook files from a previous order, email us at abookapart@gmail.com with your order number and missing ebook title. How can I read the ebooks? Our ebooks come in two DRM-free file formats: EPUB and PDF. Learn how to read our ebooks using several common setups on the instructions page (A link to these instructions is included in each ebook download email). What are Briefs? Briefs are short guides to essential fundamentals, of-the-moment techniques, or deep nerdery on a single aspect of a topic. Learn more about this series. Can I access my account? A Book Apart closed operations in 2024 and moved off of its e-commerce platform which hosted accounts. If you are looking to recover a past digital order, send us an email at abookapart@gmail.com with your order number and missing ebook title. Have a question? Read our FAQs"
