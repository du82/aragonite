full_description = '''{ "@context": "http://schema.org/", "@type": "Book", "name": "Color Accessibility Workflows", "url": "https://abookapart.com/products/color-accessibility-workflows", "author": { "@type": "Person", "name": "Geri Coady", "sameAs": "https://twitter.com/hellogeri" } , "datePublished": "2017-06-06", "inLanguage": "English", "isbn": "987-1-937557-57-7", "numberOfPages": "86", "publisher": { "type": "Organization", "name": "A Book Apart", "sameAs": [ "https://abookapart.com/", "https://www.instagram.com/abookapart/", "https://linktr.ee/abookapart", "https://twitter.com/abookapart" ] }, "genre": "Web Design" } Geri Coady Color Accessibility Workflows foreword by Derek Featherstone Make sure accessibility and aesthetics go hand-in-hand with every design. @media (min-width: 660px) { .product-header { background-image: url(../cdn/shop/products/aba-B00005-ee-3_769x@2x.progressive%EF%B9%96v=1549838080.jpg); } } @media (min-width: 769px) { .product-header { background-image: url(../cdn/shop/products/aba-B00005-ee-3_960x@2x.progressive%EF%B9%96v=1549838080.jpg); } } @media (min-width: 960px) { .product-header { background-image: url(../cdn/shop/products/aba-B00005-ee-3_1100x@2x.progressive%EF%B9%96v=1549838080.jpg); } } @media (min-width: 660px) { .product-header { background-color: #387468; } } Get this book Please reach out to this book’s author to inquire about availability. A Book Apart no longer sells or distributes books. Color is a powerful tool that affords seemingly endless design possibilities, but we often design with only one type of color vision in mind—our own. Make sure that accessibility and aesthetics go hand in hand with every design you create. Learn what color accessibility is (and why it matters); choose appropriate colors and implement testing; and snag a few key tips and tricks to get your color game plan together. You’ll become a better, more empathetic designer by discovering how other people see the world. Topics Covered Color BlindnessChoosing Appropriate ColorCompliance and TestingTips and TricksImplementationProviding Alternatives Quote 1 Quote 2 Quote 3 Geri uses practical tips and references key tools to teach you how to make accessible color choices in your design. It’s more than just a reference guide on color and color choices, it’s a must-read for every designer. Veerle Pieters Graphic designer and founder of Duoh! Previous Next Color is both a cornerstone and an enigma of the craft of design, because it's perceived in myriad ways. Designers who don't understand the accessibility pitfalls of color risk confusing and alienating users. In this essential reference, Geri Coady gives us a much-needed shortcut to getting color right. Aarron Walter VP of content at InVision and author of Designing for Emotion Previous Next Color is weird: seemingly obvious but largely misunderstood. Color Accessibility Workflows gives you the tools and expertise to use color effectively. David DeSandro Designer and founder of Metafizzy Previous Next About the Author Geri Coady is a color-obsessed Canadian illustrator and designer living in Nottingham, UK. A former ad agency art director, she has worked with companies including Simply Accessible, Nokia Withings, Scholastic, and A List Apart, as well as numerous magazines including Courier and Standart. She is the author of Color Accessibility Workflows by A Book Apart and was voted net Magazine’s Designer of the Year in 2014. Her side business, Geri Draws Japan, showcases her love for Japanese culture through original art prints, pins, stationery and more. Product Details ISBN: 987-1-937557-57-7 Paperback: 86 pages Published: Jun 6, 2017 Part ofa Pack! Accessibility Also From A Book Apart Dan Brown Practical Design Discovery David Demaree Git for Humans Ethan Marcotte Responsive Design: Patterns & Principles Vanessa Gennarelli Surviving Change at Work Book Cover Mug Tote Bag'''
