description = "Design an ideal offline experience with Service Workers."
full_description = '''{ "@context": "http://schema.org/", "@type": "Book", "name": "Going Offline", "url": "https://abookapart.com/products/going-offline", "author": { "@type": "Person", "name": "Jeremy Keith", "sameAs": "https://adactio.com/" } , "datePublished": "2018-04-24", "inLanguage": "English", "isbn": "978-1-952616-23-5", "numberOfPages": "142", "publisher": { "type": "Organization", "name": "A Book Apart", "sameAs": [ "https://abookapart.com/", "https://www.instagram.com/abookapart/", "https://linktr.ee/abookapart", "https://twitter.com/abookapart" ] }, "genre": "Web Design" } Jeremy Keith Going Offline foreword by Aaron Gustafson Design an ideal offline experience with Service Workers. @media (min-width: 660px) { .product-header { background-image: url(../cdn/shop/products/aba-000026-pp_769x@2x.progressive%EF%B9%96v=1524576248.jpg); } } @media (min-width: 769px) { .product-header { background-image: url(../cdn/shop/products/aba-000026-pp_960x@2x.progressive%EF%B9%96v=1524576248.jpg); } } @media (min-width: 960px) { .product-header { background-image: url(../cdn/shop/products/aba-000026-pp_1100x@2x.progressive%EF%B9%96v=1524576248.jpg); } } @media (min-width: 660px) { .product-header { background-color: #bd4523; } } Get this book This book is available directly from the author: Going Offline A Book Apart no longer sells or distributes books. Boldly take your website where it’s never gone before: offline. Jeremy Keith introduces you to service workers (and the code behind them) to show you the latest strategies in offline pages. Learn the ins and outs of fetching and caching, enhance your website’s performance, and create an ideal offline experience for every user, no matter their connection. Topics Covered Introducing Service WorkersPreparing for OfflineMaking Fetch HappenCache Me If You CanService Worker StrategiesRefining Your Service WorkerTidying UpThe Offline User ExperienceProgressive Web Apps Quote 1 Quote 2 Quote 3 Jeremy Keith explains service workers with kindness, clarity, and humor in his new book, a must-read for any web developer who wants to learn this exciting new API and enable offline experiences for their applications. Sarah Drasner VP of developer experience at Netlify and staff writer at CSS-Tricks Previous Next We have reached a new era in which the web’s powers are close to matching that of native applications. Being offline is no longer an obstacle. Jeremy’s enlightening book explores this new era with tips, explanations, and wonderful insights into the world of Progressive Web Apps. Ire Aderinokun COO and VP of engineering at BuyCoins Previous Next With Jeremy Keith’s characteristic wit and charm, Going Offline shows designers how to create truly resilient websites. At long last, we can make our work accessible on even the spottiest, most unreliable networks—which means, in turn, our sites can be visited by as many people as possible. Ethan Marcotte Author of Responsive Web Design Previous Next About the Author Jeremy Keith lives in Brighton, England where he makes websites with the splendid design agency Clearleft. You may know him from such books as DOM Scripting, Bulletproof Ajax, and Resilient Web Design. Hailing from Erin's green shores, Jeremy maintains his link to Irish traditional music running the community site The Session. He also indulges a darker side of his bouzouki-playing in the band Salter Cane. Jeremy spends most of his time goofing off on the internet, documenting his time-wasting on adactio.com, where he has been writing for over fifteen years. Product Details ISBN: 978-1-952616-23-5 Paperback: 142 pages Published: Apr 24, 2018 Part ofa Pack! Accessibility Bulk Partners Also From A Book Apart Rachel Nabors Animation at Work A Book Apart Briefs Anthology 2: Design and Content Donna Spencer Presenting Design Work Jason Garber Practical Pair Programming The *10* Tote Bag Book Cover Mug'''
