full_description = '''{ "@context": "http://schema.org/", "@type": "Book", "name": "Writing for Designers", "url": "https://abookapart.com/products/writing-for-designers", "author": { "@type": "Person", "name": "Scott Kubie", "sameAs": "https://kubie.co/" } , "datePublished": "2018-10-16", "inLanguage": "English", "isbn": "978-1-937557-79-9", "numberOfPages": "65", "publisher": { "type": "Organization", "name": "A Book Apart", "sameAs": [ "https://abookapart.com/", "https://www.instagram.com/abookapart/", "https://linktr.ee/abookapart", "https://twitter.com/abookapart" ] }, "genre": "Web Design" } Scott Kubie Writing for Designers foreword by Dan Brown Whether you’re just starting out or looking to hone your skills, don’t struggle with writing—get the writing done. @media (min-width: 660px) { .product-header { background-image: url(../cdn/shop/products/aba-B00009-ee-2_769x@2x.progressive%EF%B9%96v=1548784259.jpg); } } @media (min-width: 769px) { .product-header { background-image: url(../cdn/shop/products/aba-B00009-ee-2_960x@2x.progressive%EF%B9%96v=1548784259.jpg); } } @media (min-width: 960px) { .product-header { background-image: url(../cdn/shop/products/aba-B00009-ee-2_1100x@2x.progressive%EF%B9%96v=1548784259.jpg); } } @media (min-width: 660px) { .product-header { background-color: #d7004d; } } Get this book Please reach out to this book’s author to inquire about availability. A Book Apart no longer sells or distributes books. From product documentation to menu labels to marketing emails, writing for the web can feel challenging—even insurmountable. But it doesn’t have to be that way! Whether you’re new to writing or looking to hone your skills, Scott Kubie’s guide will empower you to get organized and get going. Learn to scope and articulate writing assignments, build a repeatable workflow, and develop methods for productive editing, collaboration, version control, and delivery. Don't struggle with writing—get the writing done. This book explores: Prepare to write by articulating the assignment, collecting inputs, generating ideas, and creating structureDive in and start writing—learn how to write quickly and keep writingGet the editing essentials down from tracking changes to getting feedbackDiscover how to get your writing approved, polish the work, and celebrate Who should read this book? Folks who believe good writing is essential to designWeb workers new to writing for digital productsFront-end developers and UX designers looking to build a solid writing foundation Quote 1 Quote 2 Quote 3 In Writing for Designers, Scott Kubie is part instructor, part cheerleader. His approach to planning for and writing content is both practical and accessible (and he’s damn funny to boot). Stop being hamstrung by missing content and read this book! Kristina Halvorson Author of Content Strategy for the Web Previous Next Too often, we don’t think of text and writing as part of our design process, but this book proves that they very much are. With a design-thinking approach, Scott offers a unique perspective on how to make the most out of your written communication, and how to reach your audience in a more effective way. Una Kravets Developer advocate at Google Chrome Previous Next We’ve all faced the challenges of content design, and this brief (but jam-packed) book provides tips and techniques that fit nicely in any designer’s tool belt. Relatable, practical, and lighthearted, Scott’s approach will help you overcome writing hurdles. Aaron Irizarry Author of Discussing Design: Improving Communication and Collaboration through Critique Previous Next About the Author Scott Kubie is a designer and digital strategist living in Minneapolis, where he works as lead content strategist at Brain Traffic. His first bit of published writing was a fan letter in the LEGO catalog. Scott can be found online at kubie.co and in person at various grungy rock clubs around the Twin Cities.Since 2010, Scott has delivered over sixty public talks and workshops on writing, content strategy, and user experience design for audiences of designers, developers, marketers, artists, makers, and more. He loves a good framework and finding ways to make esoteric design topics a bit more practical. Product Details ISBN: 978-1-937557-79-9 Paperback: 65 pages Published: Oct 16, 2018 Part ofa Pack! Content Strategy Corral your content strategy. Content Strategy Also From A Book Apart Rachel Nabors Animation at Work A Book Apart Briefs Anthology 2: Design and Content Donna Spencer Presenting Design Work Jason Garber Practical Pair Programming The *10* Tote Bag A Book Apart Mug'''
