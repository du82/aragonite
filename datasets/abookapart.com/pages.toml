full_description = '{ "@context": "http://schema.org/", "@type": "Book", "name": "The Business of UX Writing", "url": "https://abookapart.com/products/the-business-of-ux-writing", "author": { "@type": "Person", "name": "Yael Ben-David", "sameAs": "https://www.rachelmcconnell.me/" } , "datePublished": "2022-12-06", "inLanguage": "English", "isbn": "978-1-952616-24-2", "numberOfPages": "129", "publisher": { "type": "Organization", "name": "A Book Apart", "sameAs": [ "https://abookapart.com/", "https://www.instagram.com/abookapart/", "https://linktr.ee/abookapart", "https://twitter.com/abookapart" ] }, "genre": "Web Design" } Yael Ben-David The Business of UX Writing foreword by Torrey Podmajersky Make the most of the pivotal intersection between business goals and user needs. @media (min-width: 660px) { .product-header { background-image: url(../cdn/shop/products/aba-000043-pp-pair-1_769x@2x.progressive.png%EF%B9%96v=1670331575.jpg); } } @media (min-width: 769px) { .product-header { background-image: url(../cdn/shop/products/aba-000043-pp-pair-1_960x@2x.progressive.png%EF%B9%96v=1670331575.jpg); } } @media (min-width: 960px) { .product-header { background-image: url(../cdn/shop/products/aba-000043-pp-pair-1_1100x@2x.progressive.png%EF%B9%96v=1670331575.jpg); } } @media (min-width: 660px) { .product-header { background-color: #009064; } } Get this book Please reach out to this book’s author to inquire about availability. A Book Apart no longer sells or distributes books. UX writing is good for business, while also playing a critical role in delivering a top-notch user experience. Standing at this pivotal intersection between business goals and user needs is an awesome place to be—as long as we have the mindset, tools, and collaborators to make the most of it.Through case studies, frameworks, and historical context, Yael Ben-David offers savvy and practical guidance to ensure our digital products support the user and the business—plus writers and designers!—all at once. This book explores: Techniques for communicating the value of UX writing How to organize resources and gain support to prioritize UX writingMethods for collaborating with stakeholders to empower team members and create successful user experiences Steps for collecting, synthesizing, and sharing success metrics as mapped against business goals Quote 1 Quote 2 Quote 3 Yael’s expansive and engaging deep dive into the business side of UX writing isn’t just for writers crafting microcopy or stakeholders juggling revenue and results—it’s for anyone working toward a successful project. Brisk yet actionable, data-driven yet down-to-earth, The Business of UX Writing is essential to every UX practitioner’s shelf. Preston So Author of Voice Content and Usability Previous Next As I turned the pages of Yael’s book, I found myself nodding nonstop (and occasionally shouting YES! to an empty room). Her words are as clear and pragmatic as the business case she makes. I look forward to the day we no longer need this book, because once and for all, it will have successfully answered the question, “What is the value of UX writing?” Kristina Halvorson Author of Content Strategy for the Web Previous Next This book belongs in every product team’s toolkit. Teams can use this book to clarify their goals, identify metrics, and define an approach that leads to interfaces that truly meet users where they are while creating business value in an ethical manner. Erika Hall Author of Just Enough Research and Conversational Design Previous Next About the Author Yael Ben-David is a UX writer and content design leader who specializes in complex products. She is passionate about making innovative tech accessible to mass markets through clear, effective, data-driven copy. Yael loves the unique challenge of creating intentional and intricate experiences, and speaks about her work at meetups and conferences, and in masterclasses and university courses. After bouncing around the world a bit, Yael landed in Israel with a BA in journalism and an MSc/PhD in neurobiology, a husband, three kids, and a dog. Product Details ISBN: 978-1-952616-24-2 Paperback: 129 pages Published: Dec 6, 2022 Part ofa Pack! Bulk Partners Design Business Manage, sell, and buy design like a pro. Also From A Book Apart Laura Kalbag Accessibility for Everyone Chris Coyier Practical SVG Michael Angeles, Leon Barnard, & Billy Carlson Wireframing for Everyone Yael Ben-David The Business of UX Writing Laurel Leaf Pin A Book Apart Mug'
