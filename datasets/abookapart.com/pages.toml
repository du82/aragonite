["https://abookapart.com/pages/privacy-policy"]
title = "A Book Apart, Privacy Policy"
description = "Brief books for people who design, write, and code"
full_description = "Privacy Policy This Privacy Policy describes how your personal information is collected, used, and shared when you visit or make a purchase from abookapart.com (the “Site”). Personal Information We Collect We collect three basic types of information from you in conjunction with your use of the Site: (1) personal information, which is any information that individually identifies you (e.g., your name, email address, telephone number, postal address, credit card information), (2) non-personal information, which is information that does not personally identify you but may include information about your interests, demographics (e.g., age, gender, occupation) and use of the Sites, and (3) device information, including information about your web browser, IP address, time zone, and some of the cookies that are installed on your device. We collect this information in the following ways: Information You Provide Directly To Us: We may ask you to provide your personal information, demographic information or information about your preferences or interests when you: Register for an account on the Site Sign up to receive email newsletters from us Make a purchase on the Site Enter a contest or sweepstakes Participate in surveys or special promotions Participate on social media accounts involving our authors, books or brand Knowingly volunteer information on any other part of the Site (e.g., request for customer service, submit a job application) Information Collected Using Technology: When you visit the Site, we automatically collect certain information about your device, including information about your web browser, IP address, time zone, and some of the cookies that are installed on your device. Additionally, as you browse the Site, we collect information about the individual web pages or products that you view, what websites or search terms referred you to the Site, and information about how you interact with the Site. We refer to this automatically-collected information as “Device Information.” We collect Device Information using the following technologies: “Cookies” are data files that are placed on your device or computer and often include an anonymous unique identifier. For more information about cookies, and how to disable cookies, visit allaboutcookies.org. “Log files” track actions occurring on the Site, and collect data including your IP address, browser type, Internet service provider, referring/exit pages, and date/time stamps. “Web beacons”, “tags”, and “pixels” are electronic files used to record information about how you browse the Site. Additionally when you make a purchase or attempt to make a purchase through the Site, we collect certain information from you, including your name, billing address, shipping address, payment information (including credit card numbers or PayPal information), email address, and phone number. We refer to this information as “Order Information”. When we talk about “Personal Information” in this Privacy Policy, we are talking both about Device Information and Order Information. How Do We Use Your Personal Information? We use the Order Information that we collect generally to fulfill any orders placed through the Site (including processing your payment information, arranging for shipping, and providing you with invoices and/or order confirmations). Additionally, we use this Order Information to: Communicate with you; Screen our orders for potential risk or fraud; and When in line with the preferences you have shared with us, provide you with information or advertising relating to our products or services. These communications are only sent to customers or subscribers who have opted in to receive them. We use the Device Information that we collect to help us screen for potential risk and fraud (in particular, your IP address), and more generally to improve and optimize our Site (for example, by generating analytics about how our customers browse and interact with the Site, and to assess the success of our marketing and advertising campaigns). Sharing Your Personal Information We share your Personal Information with third parties to help us use your Personal Information, as described above. For example, we use Shopify to power our online store—you can read more about how Shopify uses your Personal Information here: https://www.shopify.com/legal/privacy. We also use Google Analytics to help us understand how our customers use the Site—you can read more about how Google uses your Personal Information here: google.com/intl/en/policies/privacy/. You can also opt-out of Google Analytics here: tools.google.com/dlpage/gaoptout. Finally, we may also share your Personal Information to comply with applicable laws and regulations, to respond to a subpoena, search warrant or other lawful request for information we receive, or to otherwise protect our rights. Additionally, you can opt out of some of these services by visiting the Digital Advertising Alliance’s opt-out portal at: http://optout.aboutads.info/. Do Not Track Please note that we do not alter our Site’s data collection and use practices when we see a Do Not Track signal from your browser. Your Rights If you are a European resident, you have the right to access personal information we hold about you and to ask that your personal information be corrected, updated, or deleted. If you would like to exercise this right, please contact us through the contact information below. Additionally, if you are a European resident we note that we are processing your information in order to fulfill contracts we might have with you (for example if you make an order through the Site), or otherwise to pursue our legitimate business interests listed above. Additionally, please note that your information will be transferred outside of Europe, including to Canada and the United States. Data Retention When you place an order through the Site, we will maintain your Order Information for our records unless and until you ask us to delete this information. Changes We may update this privacy policy from time to time in order to reflect, for example, changes to our practices or for other operational, legal or regulatory reasons. Contact Us If you have questions about this privacy policy, please contact us by email at support@abookapart.com. Have a question? Read our FAQs"
