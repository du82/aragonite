full_description = "ABA is now everywhere fine books are sold! Dec 20, 2023 Did you know? You can find and buy ABA books from your local bookstores and tons of online retailers, all around the world! Check out just a few of our favorite online bookshops that now stock our books: Bookshop.org works to connect readers with independent booksellers all over the world—and now you can find all of our books in the ABA storefront! Barnes & Noble is the premier destination for books, ebooks, magazines, games, music, and more. Explore thousands of excellent books—including the entire ABA catalog. Since 1879 Blackwell’s has been book trader and book seller to the world. Browse the shop for your favorite titles and to find the most wonderfully bookish recommendations. Booktopia is focused on getting books to book lovers as quickly, conveniently, and affordably as possible. And! Your patronage supports generous book donations to education programs across Australia. Thalia believes books transport knowledge and culture across generations. Discover new ways to be transported through their online shop or visit one of the 350+ stores in Germany. Have a question? Read our FAQs"
