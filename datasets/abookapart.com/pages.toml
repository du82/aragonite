full_description = '{ "@context": "http://schema.org/", "@type": "Book", "name": "SEO for Everyone", "url": "https://abookapart.com/products/seo-for-everyone", "author": [ { "@type": "Person", "name": "Rebekah Baggs", "sameAs": "https://www.rebekahbaggs.com/" } , { "@type": "Person", "name": "Chris Corak", "sameAs": "https://twitter.com/chris_corak" } ] , "datePublished": "2021-09-14", "inLanguage": "English", "isbn": "978-1-952616-07-5", "numberOfPages": "173", "publisher": { "type": "Organization", "name": "A Book Apart", "sameAs": [ "https://abookapart.com/", "https://www.instagram.com/abookapart/", "https://linktr.ee/abookapart", "https://twitter.com/abookapart" ] }, "genre": "Web Design" } Rebekah Baggs & Chris Corak SEO for Everyone foreword by Sarah Winters Create a truly human-centered web that supports users throughout their entire journey. @media (min-width: 660px) { .product-header { background-image: url(../cdn/shop/products/aba-000038-pp-duo_769x@2x.progressive%EF%B9%96v=1631577212.jpg); } } @media (min-width: 769px) { .product-header { background-image: url(../cdn/shop/products/aba-000038-pp-duo_960x@2x.progressive%EF%B9%96v=1631577212.jpg); } } @media (min-width: 960px) { .product-header { background-image: url(../cdn/shop/products/aba-000038-pp-duo_1100x@2x.progressive%EF%B9%96v=1631577212.jpg); } } @media (min-width: 660px) { .product-header { background-color: #bf770c; } } Get this book Please reach out to this book’s author to inquire about availability. A Book Apart no longer sells or distributes books. As the web has matured, so have search engines, algorithms, and marketing practices meant to attract pageviews. Modern SEO isn’t about delivering traffic for traffic’s sake—it’s about helping real people find the right information, at the right time, and in the right place.In this practical, illuminating book, Rebekah Baggs and Chris Corak make the case that SEO plays a central role not just in search rankings, but in delivering an excellent user experience. After all, most interactions don’t begin on our carefully crafted homepages, but on a list of search results—and only by connecting our efforts in content, design, development, and search optimization can we create a truly human-centered web that supports users throughout their entire journey. This book explores: The history of SEO, how it got a bad rap, and how to make it betterThe importance of satisfying users’ search intent with meaningful contentInvestigating search behaviors as part of user research and discoveryIntegrating SEO considerations into your design and development processesHow to avoid snake-oil practices and invest in holistic, human-centered SEO Quote 1 Quote 2 Quote 3 Quote 4 When we understand how people think about our content, we’re uniquely empowered to help them find it. SEO for Everyone is the first book that teaches readers how to optimize content for real-world users, not just algorithms. It belongs on the shelves of web professionals everywhere. Kristina Halvorson Author of Content Strategy for the Web Previous Next Behind every search engine query is a human being on a journey to learn, do, and explore. Human-centered SEO makes you their guide. Go beyond mining for clicks, and start integrating design and search marketing to genuinely satisfy your users’ needs and your business goals. Dr. Pete Meyers Marketing scientist at Moz Previous Next Look, you didn’t get into design so that you could make things for robots instead of people. Rebekah and Chris help you get the most out of search engines in ways that can enhance your design and content work, make it more accessible, and better serve your audiences. Jonathon Colman Senior design manager at Hubspot Previous Next Forget everything you thought you knew about SEO. Rebekah and Chris have provided a clear, practical guide to help you approach SEO in a way that truly puts people first. Dan Shure Consultant at Evolving SEO and host of Experts On The Wire podcast Previous Next About the Authors Rebekah Baggs is a content and UX strategist who has been helping teams solve complex content and collaboration challenges since 2006. She is cofounder of ONWARD, a consultancy that helps organizations bridge the gap between content, design, and technical SEO. She’s on a mission to prove that writing content for real people—not algorithms—is the key to success. Rebekah likes being outdoors in the water and cooking up a storm for hungry friends. She lives in Phoenix, Arizona with her family. Chris Corak is an SEO strategist who has been working on the web since 1999. He is cofounder of ONWARD, a consultancy that helps organizations deliver empowering user experiences while overcoming tough organic search and content challenges. He believes the best way to optimize for SEO is to optimize for people first. In his free time, Chris loves playing guitar and spending time with his family in sunny Phoenix, Arizona. Product Details ISBN: 978-1-952616-07-5 Paperback: 173 pages Published: Sep 14, 2021 Part ofa Pack! Accessibility Bulk Partners Also From A Book Apart Rachel Nabors Animation at Work Senongo Akpem Cross-Cultural Design Yesenia Perez-Cruz Expressive Design Systems Geri Coady Color Accessibility Workflows The *10* Tote Bag A Book Apart Mug'
