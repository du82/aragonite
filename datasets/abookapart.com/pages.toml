["https://abookapart.com/products/better-onboarding"]
title = "Better Onboarding, A Book Apart"
description = "Successfully welcome new users and authentically entice them to keep coming back."
full_description = '{ "@context": "http://schema.org/", "@type": "Book", "name": "Better Onboarding", "url": "https://abookapart.com/products/better-onboarding", "author": { "@type": "Person", "name": "Krystal Higgins", "sameAs": "http://www.bethdunn.com/" } , "datePublished": "2021-05-11", "inLanguage": "English", "isbn": "978-1-952616-00-6", "numberOfPages": "130", "publisher": { "type": "Organization", "name": "A Book Apart", "sameAs": [ "https://abookapart.com/", "https://www.instagram.com/abookapart/", "https://linktr.ee/abookapart", "https://twitter.com/abookapart" ] }, "genre": "Web Design" } Krystal Higgins Better Onboarding foreword by Chetana Deorah Successfully welcome new users and authentically entice them to keep coming back. @media (min-width: 660px) { .product-header { background-image: url(../cdn/shop/products/aba-000035-pp-duo_769x@2x.progressive%EF%B9%96v=1620734690.jpg); } } @media (min-width: 769px) { .product-header { background-image: url(../cdn/shop/products/aba-000035-pp-duo_960x@2x.progressive%EF%B9%96v=1620734690.jpg); } } @media (min-width: 960px) { .product-header { background-image: url(../cdn/shop/products/aba-000035-pp-duo_1100x@2x.progressive%EF%B9%96v=1620734690.jpg); } } @media (min-width: 660px) { .product-header { background-color: #912779; } } Get this book This book is available directly from the author: Better Onboarding A Book Apart no longer sells or distributes books. When users try your product for the first time, what keeps them coming back? Onboarding can make the difference between abandoned accounts and devoted use—if we design it as a holistic, ongoing process.Krystal Higgins demonstrates how the best onboarding experiences guide people as they interact, helping them follow their own path to success. Gain practical strategies and techniques for designing effective guidance, whether you’re working through a redesign, launching new features, rolling out service updates, or welcoming back returning users. Set aside the tutorials, manuals, and intrusive instructions of the past, and learn how to use guided interaction to help users find their way—and get value out of every step. This book explores: How to effectively greet, engage, and retain customersBest practices for mapping users’ onboarding journeys from start to finishBringing research, content, design, and functionality together to support new usersSteps for breaking down onboarding actions for more efficient implementationTechniques for embedding guidance in the context of the full product experience Quote 1 Quote 2 Quote 3 Few people can speak about onboarding design with the authority of Krystal Higgins. Better Onboarding is an essential knowledge source for anyone serious about building successful products and businesses. Joe MacLeod Founder and head of endineering at andEnd Previous Next This book could truly be titled Better Products. Krystal Higgins beautifully debunks the myth of one-and-done onboarding approaches, and provides a practical guide to making products that welcome users over and over again. Kate Rutter Principal at Intelleto and cohost of What is Wrong with UX podcast Previous Next This book is full of actionable advice that looks thoughtfully beyond a first-time, single-pathway use case. Krystal explores how we can positively shape a user’s experience by meeting them in context. The result is a must-have guide to guiding that sets users up for success. Patima Tantiprasut Managing director at PetRescue Previous Next About the Author Krystal Higgins is a UX designer who connects the dots between products, systems, and the people who use them. She’s taught teams across the world how to design better, human-centered onboarding at events like SXSW, An Event Apart, UX London, and UX Days Tokyo; through her catalog of first-run experiences at first-run-ux.com; and through her onboarding articles at kryshiggins.com. Krystal has more than 15 years of experience in the US and Australia designing innovative products for mobile, web, wearable, and new platforms at companies like NVIDIA, eBay, and Google. When she’s not working on tech-meets-humans projects, she enjoys painting, illustration, and scuba diving Product Details ISBN: 978-1-952616-00-6 Paperback: 130 pages Published: May 11, 2021 Part ofa Pack! Bulk Partners Design Career Kickstart Take on your next project with confidence and savvy. Also From A Book Apart Lara Hogan Demystifying Public Speaking David Demaree Git for Humans Dan Mall Pricing Design A Book Apart Briefs Anthology 2: Design and Content The *10* Mug The *10* Tote Bag'
