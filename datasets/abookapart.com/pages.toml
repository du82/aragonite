title = "HTML5 For Web Designers, A Book Apart"
description = "Get up to speed with all that’s changing in the evolving spec."
full_description = '''{ "@context": "http://schema.org/", "@type": "Book", "name": "HTML5 For Web Designers", "bookEdition": "Second Edition", "url": "https://abookapart.com/products/html5-for-web-designers", "author": [ { "@type": "Person", "name": "Jeremy Keith", "sameAs": "https://adactio.com/" } , { "@type": "Person", "name": "Rachel Andrew", "sameAs": "https://rachelandrew.co.uk/" } ] , "datePublished": "2016-02-17", "inLanguage": "English", "isbn": "978-1-952616-53-2", "numberOfPages": "92", "publisher": { "type": "Organization", "name": "A Book Apart", "sameAs": [ "https://abookapart.com/", "https://www.instagram.com/abookapart/", "https://linktr.ee/abookapart", "https://twitter.com/abookapart" ] }, "genre": "Web Design" } Jeremy Keith & Rachel Andrew HTML5 For Web Designers foreword by Jeffrey Zeldman Get up to speed with all that’s changing in the evolving spec. Second Edition @media (min-width: 660px) { .product-header { background-image: url(../cdn/shop/products/aba-000001-pp-2_769x@2x.progressive%EF%B9%96v=1482334208.jpg); } } @media (min-width: 769px) { .product-header { background-image: url(../cdn/shop/products/aba-000001-pp-2_960x@2x.progressive%EF%B9%96v=1482334208.jpg); } } @media (min-width: 960px) { .product-header { background-image: url(../cdn/shop/products/aba-000001-pp-2_1100x@2x.progressive%EF%B9%96v=1482334208.jpg); } } @media (min-width: 660px) { .product-header { background-color: #b5490d; } } Get this book This book is available directly from the author: HTML5 For Web Designers A Book Apart no longer sells or distributes books. HTML5 isn’t as confusing as it once was, but it still isn’t straightforward. It’s an evolutionary, rather than revolutionary, change in the ongoing story of markup—and if you’re currently creating websites with any version of HTML, you’re already using HTML5. Harness the power of this essential evolving spec with help from Jeremy Keith and Rachel Andrew. Brush up on syntax and updated elements, and get ready to work with responsive images, microformats, and microdata. Through clear, practical examples, you’ll be up to speed in no time.What’s new in the second edition?A lot has changed since this little book was first published. Cowritten and introduced by Rachel Andrew, the second edition highlights exactly how to implement those changes. From wrangling JavaScript APIs to revisiting the canvas and managing rich media, this updated original continues to be the perfect primer. Topics Covered A Brief History of MarkupThe Design of HTML5Rich MediaWeb Forms 2.0SemanticsUsing HTML5 Today Quote 1 Quote 2 Quote 3 Quote 4 Rachel and Jeremy cover a very wide spectrum of everything you need to know about HTML5 in a short, easily digestible format. They clear up a lot of confusion about HTML5 features, especially when comparing old and new. Highly recommended for anyone who wants a solid overview (including relevant history) of HTML5. Sara Soueidan Front-end web developer Previous Next HTML remains the foundation of everything we build for the web, from the simplest page to the most complex experience. To properly understand this foundation—particularly in its most recent incarnation, HTML5—there’s no better primer than the second edition of this book. John Allsopp Cofounder of the Web Directions conference series Previous Next Crack open this book after you fasten your seatbelt in Boston. Before you land in Chicago, you’ll stop worrying and finally, fully understand HTML5. As usual, Mr. Keith takes a complex topic and eloquently describes it for the rest of us. Dan Cederholm Cofounder and designer at Dribbble and author Previous Next With superhuman ease and wit, Jeremy Keith always makes the densest technical concepts seem approachable, intuitive, and—dare I say it—fun. He’s done it again with HTML5. Ethan Marcotte Author of Responsive Web Design Previous Next About the Authors Jeremy Keith lives in Brighton, England where he makes websites with the splendid design agency Clearleft. You may know him from such books as DOM Scripting, Bulletproof Ajax, and Resilient Web Design. Hailing from Erin's green shores, Jeremy maintains his link to Irish traditional music running the community site The Session. He also indulges a darker side of his bouzouki-playing in the band Salter Cane. Jeremy spends most of his time goofing off on the internet, documenting his time-wasting on adactio.com, where he has been writing for over fifteen years. Rachel Andrew is editor-in-chief of Smashing Magazine and writes about the web platform for companies including Google and Mozilla. She is a member of the CSS Working Group where she is coeditor of the Multiple-column Layout specification.Rachel has been working on the web since 1996 and writing about the web for almost as long. She’s written several books including Get Ready for CSS Grid Layout, the bestselling CSS Anthology from Sitepoint, and recent ventures into self-publishing have produced The Profitable Side Project Handbook and CSS3 Layout Modules, Second Edition. She is a regular columnist for A List Apart as well as other publications online and in print. When she’s not writing, Rachel often works with other authors as a technical editor.Rachel is a keen distance runner who encourages people to join her for a run when attending conferences, with varying degrees of success! Product Details ISBN: 978-1-952616-53-2 Paperback: 92 pages Published: First Ed. May 4, 2010; Second Ed. Feb 17, 2016 Also available in: Chinese, French, Korean, Russian Part ofa Pack! Bulk Partners Frontend Development Also From A Book Apart Geri Coady Color Accessibility Workflows Eric Meyer & Sara Wachter-Boettcher Design for Real Life Karen McGrane Going Responsive Josh Clark Designing for Touch A Book Apart Mug Tote Bag'''
