full_description = '{ "@context": "http://schema.org/", "@type": "Book", "name": "Cultivating Content Design", "url": "https://abookapart.com/products/cultivating-content-design", "author": { "@type": "Person", "name": "Beth Dunn", "sameAs": "http://www.bethdunn.com/" } , "datePublished": "2021-04-13", "inLanguage": "English", "isbn": "978-1-952616-06-8", "numberOfPages": "54", "publisher": { "type": "Organization", "name": "A Book Apart", "sameAs": [ "https://abookapart.com/", "https://www.instagram.com/abookapart/", "https://linktr.ee/abookapart", "https://twitter.com/abookapart" ] }, "genre": "Web Design" } Beth Dunn Cultivating Content Design foreword by Ann Handley Fundamentally change the way content works on your team. @media (min-width: 660px) { .product-header { background-image: url(../cdn/shop/products/aba-b00012-ee-pp_769x@2x.progressive%EF%B9%96v=1618272777.jpg); } } @media (min-width: 769px) { .product-header { background-image: url(../cdn/shop/products/aba-b00012-ee-pp_960x@2x.progressive%EF%B9%96v=1618272777.jpg); } } @media (min-width: 960px) { .product-header { background-image: url(../cdn/shop/products/aba-b00012-ee-pp_1100x@2x.progressive%EF%B9%96v=1618272777.jpg); } } @media (min-width: 660px) { .product-header { background-color: #576c4e; } } Get this book Please reach out to this book’s author to inquire about availability. A Book Apart no longer sells or distributes books. Great content doesn’t happen in a vacuum. It gets bogged down in teams, organizations, silos, and process. Beth Dunn helps you break the vacuum seal and bring unity and joy back to content. Cultivating Content Design gives you the power to fundamentally change your organization’s approach to great content—with the tools and team you already have. With time and a little gumption, you’ll be able to cement your position as a strategic content leader, and create a strong and respected content design practice. This book explores: Why full-stack content design is more than just grammar and styleHow to shift your mindset to subtly drive changeTechniques for seeding content-first thinking throughout your organizationGenerating continuous support for great content design Quote 1 Quote 2 Quote 3 Quote 4 Quote 5 Beth Dunn is a writer in the same way that Clark Kent reports for the Daily Planet. Her secret superpower goes far beyond the crafting and composition of words; she inspires and orchestrates teams (and customers) to achieve a higher, heroic purpose. This is truly a book about content leadership—inspiring your organization to care and enabling them to create. Tim Merrill Senior director of product design at Salesforce Previous Next If working in content has ever made you feel overwhelmed, stressed, or stretched thin, read this book. It will show you how to maintain a great content practice by empowering the people around you—while being kind to yourself. Michael Metts Director of content design at Upwork Previous Next Cultivating Content Design is going to quickly become a beloved guide for any content creators who want to scale their craft. It’s a fun, warm, and highly actionable read. Hannah Fleishman Director of employer brand and internal communications at HubSpot Previous Next Like a chat with a witty, insightful friend, this brilliantly written book is full of practical ideas that you can act on right now. A must-read for any content designer, especially those in small teams or a team of one. Rachel McConnell Content design manager at BT Previous Next Getting others to embrace your content design practice can feel like war. Beth Dunn’s kind, thoughtful approach is a Trojan horse that’ll enable you to win friends, influence people, and avoid uphill battles. Aaron Burgess UX content director at Expedia Group Previous Next About the Author Beth Dunn is a content and communications leader, speaker, author, and coach. She pioneered the content design practice at HubSpot, then developed and led the global HubSpot content design team. Her workshops, classes, exercises, and guides have helped scores of leaders, practitioners, and teams design better content, confidently and at scale. Beth Dunn lives on Cape Cod in her tiny hometown with a charming husband and some quality cats. Product Details ISBN: 978-1-952616-06-8 Paperback: 54 pages Published: Apr 13, 2021 Part ofa Pack! Careers Content Strategy Corral your content strategy. Also From A Book Apart Rachel Nabors Animation at Work Tom Greenwood Sustainable Web Design Donna Spencer Presenting Design Work Rachel Andrew The New CSS Layout The *10* Tote Bag Book Cover Mug'
