title = "Accessibility for Everyone, A Book Apart"
description = "Get sure footing on the path to designing with accessibility."
full_description = '{ "@context": "http://schema.org/", "@type": "Book", "name": "Accessibility for Everyone", "url": "https://abookapart.com/products/accessibility-for-everyone", "author": { "@type": "Person", "name": "Laura Kalbag", "sameAs": "https://laurakalbag.com/" } , "datePublished": "2017-09-26", "inLanguage": "English", "isbn": "978-1-952616-32-7", "numberOfPages": "166", "publisher": { "type": "Organization", "name": "A Book Apart", "sameAs": [ "https://abookapart.com/", "https://www.instagram.com/abookapart/", "https://linktr.ee/abookapart", "https://twitter.com/abookapart" ] }, "genre": "Web Design" } Laura Kalbag Accessibility for Everyone foreword by Heydon Pickering Get sure footing on the path to designing with accessibility. @media (min-width: 660px) { .product-header { background-image: url(../cdn/shop/products/aba-000023-pp-5_769x@2x.progressive%EF%B9%96v=1568979820.jpg); } } @media (min-width: 769px) { .product-header { background-image: url(../cdn/shop/products/aba-000023-pp-5_960x@2x.progressive%EF%B9%96v=1568979820.jpg); } } @media (min-width: 960px) { .product-header { background-image: url(../cdn/shop/products/aba-000023-pp-5_1100x@2x.progressive%EF%B9%96v=1568979820.jpg); } } @media (min-width: 660px) { .product-header { background-color: #00762e; } } Get this book This book is available directly from the author: Accessibility for Everyone A Book Apart no longer sells or distributes books. Other Formats Audiobook: Read by Laura Kalbag, available from Audible.com. You make the web more inclusive for everyone, everywhere, when you design with accessibility in mind. Let Laura Kalbag guide you through the accessibility landscape: understand disability and impairment challenges; get a handle on important laws and guidelines; and learn how to plan for, evaluate, and test accessible design. Leverage tools and techniques like clear copywriting, well-structured IA, meaningful HTML, and thoughtful design, to create a solid set of best practices. Whether you’re new to the field or a seasoned pro, get sure footing on the path to designing with accessibility. Topics Covered Considering AccessibilityDisabilities and ImpairmentsPlanning for AccessibilityContent and DesignAccessibility and HTMLEvaluation and TestingLaws and Guidelines Quote 1 Quote 2 Quote 3 This book does a great job of highlighting the necessity for accessible and inclusive design. It brings to a head the idea that making the web useful for everyone is the responsibility of all web professionals. Accessibility for Everyone proves its value immediately with invaluable ideas and tips—for both beginners and professionals. Nicole Dominguez User interface designer and front-end developer Previous Next Accessibility for Everyone is packed with practical techniques that we can use to improve the quality of our work right away. Laura illuminates everything our day-to-day work can be: meaningful, purposeful, and inclusive. It’s a guide to the part we can play in the web’s incredible potential—connecting people around the world not just to the sum of all human knowledge, but to each other. Mat Marquis Author of JavaScript for Web Designers Previous Next Accessibility for Everyone is an essential handbook for anyone involved in digital production. It’s an enjoyable and practical introduction to accessibility, covering everything from background knowledge to front-end implementation (and many things between). Léonie Watson Director of TetraLogical and cochair of the W3C Web Platform Working Group Previous Next About the Author Laura Kalbag is a British designer living in Ireland. She’s co-founder of Small Technology Foundation, a tiny two-person-and-one-husky not-for-profit organization advocating for and building small technology designed to increase human welfare, not corporate profits. They also make Better Blocker, a web privacy tool.On an average day, Laura does everything from design and development, to learning how to run a sustainable not-for-profit company, to trying to make privacy- and rights-respecting technology accessible to a wide audience. You can find her making design decisions, writing code, nudging icon pixels, or interpreting a privacy policy into something humans can understand. Sometimes she speaks at conferences and writes articles too. Product Details ISBN: 978-1-952616-32-7 Paperback: 166 pages Published: Sep 26, 2017 Part ofa Pack! Accessibility Frontend Development Also From A Book Apart Dan Brown Practical Design Discovery Laura Kalbag Accessibility for Everyone David Demaree Git for Humans Rachel Andrew Get Ready for CSS Grid Layout Book Cover Mug The *10* Mug'
