full_description = '{ "@context": "http://schema.org/", "@type": "Book", "name": "Wireframing for Everyone", "url": "https://abookapart.com/products/wireframing-for-everyone", "author": [ { "@type": "Person", "name": "Michael Angeles", "sameAs": "https://www.linkedin.com/in/michaelangeles" } , { "@type": "Person", "name": "Leon Barnard", "sameAs": "https://www.linkedin.com/in/leonbarnard/" } , { "@type": "Person", "name": "Billy Carlson", "sameAs": "https://www.linkedin.com/in/billycarlson/" } ] , "datePublished": "2023-06-13", "inLanguage": "English", "isbn": "978-1-952616-55-6", "numberOfPages": "156", "publisher": { "type": "Organization", "name": "A Book Apart", "sameAs": [ "https://abookapart.com/", "https://www.instagram.com/abookapart/", "https://linktr.ee/abookapart", "https://twitter.com/abookapart" ] }, "genre": "Web Design" } Michael Angeles, Leon Barnard, & Billy Carlson Wireframing for Everyone foreword by Ellen Chisa Harness the power and approachability of wireframes, to develop design concepts from idea to prototype. @media (min-width: 660px) { .product-header { background-image: url(../cdn/shop/files/aba-000045-pp-pair-MAIN-2_769x@2x.progressive.png%EF%B9%96v=1686619107.jpg); } } @media (min-width: 769px) { .product-header { background-image: url(../cdn/shop/files/aba-000045-pp-pair-MAIN-2_960x@2x.progressive.png%EF%B9%96v=1686619107.jpg); } } @media (min-width: 960px) { .product-header { background-image: url(../cdn/shop/files/aba-000045-pp-pair-MAIN-2_1100x@2x.progressive.png%EF%B9%96v=1686619107.jpg); } } @media (min-width: 660px) { .product-header { background-color: #3085db; } } Get this book This book is available directly from the author: Wireframing for Everyone A Book Apart no longer sells or distributes books. Many UX techniques fall apart in the real world of overflowing backlogs, two-week sprints, and stubborn stakeholders. Yet wireframing persists, despite its much-anticipated demise. Wireframes are fast and easy to make, can be created and understood by anyone, and function as both creative ideation and practical communication tools.Leaning on decades of collective experience, Michael Angeles, Leon Barnard, and Billy Carlson show us how to use low-fidelity design to generate ideas, encourage feedback, and involve everyone in the process. This approachable book also harnesses wireframing to demystify UI design, so that anyone can join in creating successful digital products. This book explores: Frameworks for implementing user interface design basicsTechniques for developing design concepts from idea to prototypeHow to use wireframing for cross-functional team participationHow to present wireframes and create effective feedback structures Quote 1 Quote 2 Quote 3 Wireframing for Everyone is so much more than a book about wireframes. It’s a clear, indispensable guide for visualizing ideas, identifying and working through design challenges, and gaining alignment across product, design, and engineering teams. Theresa Neil Tech leader, entrepreneur, and author of Designing Web Interfaces and Mobile Design Pattern Gallery Previous Next Wireframing is a critical yet underutilized skill among modern product teams. Written by experienced practitioners, this valuable how-to guide offers pragmatic wireframing techniques and frameworks essential for creating successful products. Dan Olsen Product team trainer, speaker, and author of The Lean Product Playbook Previous Next SAFETY WARNING FOR UX PROFESSIONALS: Once you pick up Wireframing for Everyone, you will have difficulty putting it down. It’s just that captivating. YOU’VE BEEN WARNED. Jared Spool Maker of awesomeness at Center Centre Previous Next About the Authors Michael Angeles has been an interface designer at Balsamiq since 2012. He has published articles and spoken at conferences on the topic of wireframing for product design. He created the IA Slash and Konigi blogs on interface design, and served as advisor and cofounder of the Information Architecture Institute. Leon Barnard leads the education team at Balsamiq. He uses his extensive experience as a UX designer to teach user interface design basics and wireframing to an audience of mostly non-designers via the Balsamiq Wireframing Academy. He loves helping people and technology get along better together. Billy Carlson is a design educator at Balsamiq, where he helps new and non-designers learn best practices for all phases of user interface and digital product design. He teaches university-level UX and design thinking courses, and, as a designer since 2005, he’s worked on myriad products and led large UX teams at various organizations. Product Details ISBN: 978-1-952616-55-6 Paperback: 156 pages Published: Jun 13, 2023 Part ofa Pack! User Experience Visual Design & Typography Also From A Book Apart Laura Kalbag Accessibility for Everyone Jason Garber Practical Pair Programming Senongo Akpem Cross-Cultural Design Rachel Nabors Animation at Work Laurel Leaf Pin The *10* Mug'
