["https://abookapart.com/blogs/press/a-new-chapter-for-a-book-apart"]
title = "A Book Apart, A New Chapter for A Book Apart"
description = "Dear Reader, We wanted to share a bit of news with you. Since opening our doors in 2010, we’ve navigated considerable change—from rising production costs, to fluctuating fulfillment needs, to evolving operational strategies. Largely, experiencing such change has inspired us to shift, flex, and transform. More recently, it is testing the sustainability of our business, and after careful consideration we"
full_description = "A New Chapter for A Book Apart Mar 01, 2024 Dear Reader, We wanted to share a bit of news with you. Since opening our doors in 2010, we’ve navigated considerable change—from rising production costs, to fluctuating fulfillment needs, to evolving operational strategies. Largely, experiencing such change has inspired us to shift, flex, and transform. More recently, it is testing the sustainability of our business, and after careful consideration we will no longer be publishing new titles. But our books aren’t going anywhere! You can continue to shop our books nearly everywhere fine books are sold, like Bookshop.org and Barnes & Noble (US), Blackwell’s (UK), Booktopia (AU), Thalia (DE)—and, of course, abookapart.com (while stock at HQ lasts!). UPDATE: Ownership and publishing rights for all books have been given back to their respective authors. Many authors are continuing to offer their work for free or in new editions. Our hope is that these books will continue to live on forever. A Book Apart no longer sells or distributes books, please reach out to authors for information about availability. Importantly, we’d like to thank you for supporting A Book Apart in ways big and small. Publishing independently is hard work, and we couldn’t have done it for as long as we did without such wonderful readers like you. Fourteen years ago, we began with a simple yet powerful idea: to create brief books for people who want to make a better web. Since publishing book No. 1, HTML5 for Web Designers, we’ve continuously developed our processes and worked with wildly talented authors and editors. We’ve adapted our approaches to stay responsive to readers’ needs by addressing relevant topics and experimenting with format. And we’ve managed to maintain alignment with our values, offering books with our signature editorial clarity, approachability, and conscientiousness. We’re so proud of the range and diversity of titles and authors we’ve published. We are inspired, awed, and humbled by the trust you have shown in continuing to support our little but mighty publishing outfit. Here are just a few things we’ve accomplished and shared with you along the way: If you’re interested in continuing to grow your skills, our books will be there for you—and you can also check out these folks doing great things: A List Apart, Skillcrush, Envato Tuts+, Rosenfeld, Smashing Magazine. They are awesome and we’ve always counted ourselves lucky to be in their orbit. Again, thank you for your support over the last fourteen years, and for your commitment to making the tech world a better place. We are wildly proud of the books we’ve shared with you, and we are beyond grateful for YOU, a warm and inspirational community of friends, colleagues, peers, and collaborators without whom ABA would simply not exist. With gratitude and care, Katel, Jason, Jeffrey Have a question? Read our FAQs"
year_published = 2024
