description = "Give your design project clarity, precision, and purpose."
full_description = '{ "@context": "http://schema.org/", "@type": "Book", "name": "Design by Definition", "url": "https://abookapart.com/products/design-by-definition", "author": { "@type": "Person", "name": "Elizabeth McGuane", "sameAs": "https://www.linkedin.com/in/michaelangeles" } , "datePublished": "2023-07-25", "inLanguage": "English", "isbn": "978-1-952616-57-0", "numberOfPages": "148", "publisher": { "type": "Organization", "name": "A Book Apart", "sameAs": [ "https://abookapart.com/", "https://www.instagram.com/abookapart/", "https://linktr.ee/abookapart", "https://twitter.com/abookapart" ] }, "genre": "Web Design" } Elizabeth McGuane Design by Definition foreword by Khoi Vinh Give your design project clarity, precision, and purpose. @media (min-width: 660px) { .product-header { background-image: url(../cdn/shop/files/aba-000046-pp-pair-1_769x@2x.progressive.png%EF%B9%96v=1690283195.jpg); } } @media (min-width: 769px) { .product-header { background-image: url(../cdn/shop/files/aba-000046-pp-pair-1_960x@2x.progressive.png%EF%B9%96v=1690283195.jpg); } } @media (min-width: 960px) { .product-header { background-image: url(../cdn/shop/files/aba-000046-pp-pair-1_1100x@2x.progressive.png%EF%B9%96v=1690283195.jpg); } } @media (min-width: 660px) { .product-header { background-color: #00602d; } } Get this book Please reach out to this book’s author to inquire about availability. A Book Apart no longer sells or distributes books. When we think of design primarily in terms of visual representation, we neglect an essential piece of the creative process. The words we use to form concepts can also powerfully shape a design project from start to finish—giving clarity to goals, precision to names and structure, and purpose to stylistic choices.Elizabeth McGuane offers a fresh, empowering framework for design. Drawing from her experience on the forefront of web, mobile, and product design, she shows us how to harness the potency of words and language to uplift and illuminate rather than encumber. Learn how to effectively apply semantic concepts, use language to frame design problems clearly, and integrate elements of style such as metaphor and nomenclature, to strengthen your design process. This book explores: Frameworks for building shared language and strengthening collaborationHow to practically incorporate semantic concepts into any design processSteps for addressing product and design evolution through concept definition Quote 1 Quote 2 Quote 3 At its heart, this powerful little book is about how to think deeply, clearly, and humanely about solving hard problems—with and for real people. Its message is relevant for those designing digital software, and for anyone striving to make meaning, build understanding, and create alignment in work and life. Amy Thibodeau Design director at Gusto Previous Next Words are slippery. Elizabeth captures them with adeptness and poetic prose, perfectly explaining how they shepherd us along the winding path of product development. This book has invaluable advice for anyone who communicates or makes things with other humans. Randall Snare Content design director at Meta Previous Next Whether we design with pixels or pencil marks on paper, we use words to share ideas. Elizabeth presents us with a roadmap for embracing the importance of words and shared language, and reminds us that when done intentionally, writing is a joyful act and the most galvanizing part of the entire creative process. Stewart Scott-Curran Cofounder and creative director at Design Business Company Previous Next About the Author Elizabeth McGuane is a user experience design director and content designer who got her start in newspapers in 2003, then pivoted to UX design in 2007. Currently, she leads large, multidisciplinary design teams that include product designers, developers, researchers and content designers, solving problems in wayfinding, communication, and cross-platform design. Elizabeth divides her time between Ontario and Nova Scotia, Canada. Product Details ISBN: 978-1-952616-57-0 Paperback: 148 pages Published: Jul 25, 2023 Part ofa Pack! Content Strategy Corral your content strategy. Content Strategy Also From A Book Apart Laura Kalbag Accessibility for Everyone Geri Coady Color Accessibility Workflows Dan Brown Practical Design Discovery Vanessa Gennarelli Surviving Change at Work Laurel Leaf Pin The *10* Mug'
