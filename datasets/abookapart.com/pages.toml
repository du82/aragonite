full_description = '{ "@context": "http://schema.org/", "@type": "Book", "name": "Immersive Content and Usability", "url": "https://abookapart.com/products/immersive-content-and-usability", "author": { "@type": "Person", "name": "Preston So", "sameAs": "https://preston.so/" } , "datePublished": "2023-04-18", "inLanguage": "English", "isbn": "978-1-952616-28-0", "numberOfPages": "132", "publisher": { "type": "Organization", "name": "A Book Apart", "sameAs": [ "https://abookapart.com/", "https://www.instagram.com/abookapart/", "https://linktr.ee/abookapart", "https://twitter.com/abookapart" ] }, "genre": "Web Design" } Preston So Immersive Content and Usability foreword by Reginé Gilbert Create incisive and inclusive user-centered experiences across augmented, extended, and virtual realities. @media (min-width: 660px) { .product-header { background-image: url(../cdn/shop/products/aba-000044-pp-pair-1_769x@2x.progressive.png%EF%B9%96v=1681743388.jpg); } } @media (min-width: 769px) { .product-header { background-image: url(../cdn/shop/products/aba-000044-pp-pair-1_960x@2x.progressive.png%EF%B9%96v=1681743388.jpg); } } @media (min-width: 960px) { .product-header { background-image: url(../cdn/shop/products/aba-000044-pp-pair-1_1100x@2x.progressive.png%EF%B9%96v=1681743388.jpg); } } @media (min-width: 660px) { .product-header { background-color: #cb0038; } } Get this book Please reach out to this book’s author to inquire about availability. A Book Apart no longer sells or distributes books. From stone tablets to paper pages to backlit screens, humans have always created and shaped content to fit the containers available to us. But increasingly, the lines between our physical and digital surroundings are blurring—and we need to design usable and accessible content for an ever-expanding array of contexts.Preston So guides designers, content strategists, and engineers on a journey through the emerging realm of immersive content design. Learn to create incisive and inclusive user-centered experiences across augmented, extended, and virtual realities, transforming the physical world into an exciting new canvas for content. This book explores: Immersive tech like beacons, digital signs, and extended realityAssessing and leveraging existing content for immersive environmentsTechniques for storyboarding, diagramming, and mapping spatial contentStrategies for designing accessible and inclusive immersive contentBest practices for testing immersive content Quote 1 Quote 2 Quote 3 Preston So guides design practitioners through an inspiring and actionable journey, traversing between digital rectangles and the physical world. An excellent primer to crafting contextually aware experiences of value, this book equips readers with the essentials needed for creating welcoming, useful, and empowering content. Jaleh Afshar Director of design at Meta Previous Next Preston So unpacks a complex and formidable topic and examines it in an engaging and inviting way. Throughout Immersive Content and Usability, So inspires us to use content to create better pathways of connection with information and each other—in real and virtual worlds, and in between. Erika Abrams Executive creative director of the Los Angeles Design Festival Previous Next Preston leads the way through a thorny thicket of immersive technologies and into the nutritious fruits of inclusive design and equitable experience creation. I yelled “Yes!” out loud as I read this inspiring and accessible book. I think you will too. Rob Ray Senior technical experience designer at Electronic Arts and associate professor of design at CSU, San Bernardino Previous Next About the Author Preston So (he/they) is a digital architect and strategist, designer and developer advocate, and polyglot educator and speaker. He is the author of Immersive Content and Usability (A Book Apart, 2023), Gatsby: The Definitive Guide (O’Reilly, 2021), Voice Content and Usability (A Book Apart, 2021), and Decoupled Drupal in Practice (Apress, 2018).A globally recognized authority on the intersections of content, design, and code, Preston has been a product, design, engineering, and innovation leader since 2015 at organizations like Oracle, Acquia, Time Inc., and Gatsby. Preston is an editor at A List Apart, columnist at CMSWire, and contributor to Smashing Magazine, and has delivered keynotes around the world in three languages. He is based in New York City, where he can often be found immersing himself in languages that are endangered or underserved. Product Details ISBN: 978-1-952616-28-0 Paperback: 132 pages Published: Apr 18, 2023 Part ofa Pack! Bulk Partners Content Strategy Corral your content strategy. Also From A Book Apart Laura Kalbag Accessibility for Everyone Michael Angeles, Leon Barnard, & Billy Carlson Wireframing for Everyone Eva PenzeyMoog Design for Safety Krystal Higgins Better Onboarding Laurel Leaf Pin The *10* Tote Bag'
