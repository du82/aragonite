["https://about.gitlab.com/solutions/compliance"]
title = "Continuous Software Compliance with GitLab | GitLab"
description = "How to use GitLab to build compliant applications with a secure software supply chain."
full_description = "Automate compliance, reduce risks Software Compliance with GitLab Build applications that meet common regulatory standards with a secure software supply chain. Start your free trial Learn about pricing Trusted By: Overview Capabilities Customers Pricing Resources Simplify and automate software compliance Manage risk Go beyond simply reducing security flaws in the code Simple and frictionless An integrated experience to define, enforce, and report on compliance Implement guardrails Control access and implement policies Fast, secure, compliant. Policy management Define rules and policies to adhere to compliance frameworks and common controls Granular user roles and permissions: Define user roles and permission levels that make sense for your organization Access control: Limit access with two-factor authentication and expiration tokens Compliance settings: Define and enforce compliance policies for specific projects, groups, and users Credentials inventory: Keep track of all the credentials that can be used to access a GitLab self-managed instance Protected branches: Control unauthorized modifications to specific branches — including creating, pushing, and deleting a branch — without adequate permissions or approvals Learn More Compliant workflow automation Enforce defined rules, policies, and separation of duties while reducing overall business risk Compliance framework project templates: Create projects that map to specific audit protocols such as HIPAA to help maintain an audit trail and manage compliance programs Compliance framework project labels: Easily apply common compliance settings to a project with a label Compliance framework pipelines: Define compliance jobs that should be run in every pipeline to ensure that security scans are run, artifacts are created and stored, or any other steps required by your organizational requirements Learn More Audit management Prepare for audits and better understand the root cause of issues with easy access to audit data Audit events: Track important events such as changes to user permission levels, who added a new user, or who removed a user Streaming audit events: Consolidate your audit logs in a tool of your choice Audit reports: Respond to auditors by generating comprehensive reports such as instance, group, and project events, impersonation data, sign-in, and user events Compliance report: Get a high-level view of compliance violations and the reasons and severity of violations in merge requests Vulnerability and dependency management View, triage, trend, track, and resolve vulnerabilities and dependencies in your applications Security dashboards: Access current security status applications and initiate remediation Software bill of materials: Scan application and container dependencies for security flaws and create a software bill of materials (SBOM) of the dependencies used Trusted by enterprises. Loved by developers. 01 - 03 Which tier is right for you? Which tier is right for you? Free Static application security testing (SAST) and secrets detection Findings in json file Learn more Premium Static application security testing (SAST) and secrets detection Findings in json file MR approvals and more common controls Learn about GitLab Premium Ultimate Everything in Premium plus Comprehensive security scanners include SAST, DAST, Secrets, dependencies, containers, IaC, APIs, cluster images, and fuzz testing Actionable results within the MR pipeline Compliance pipelines Security and Compliance dashboards Much more Start your free trial Learn more Related Resources Video Compliant pipelines Watch now Video Continuous software compliance Watch now Video SBOM and Attestation Watch now Book Guide to software supply chain security Learn more Book GitLab DevSecOps survey Learn more Blog The importance of compliance in DevOps resource Learn more Blog Top 5 compliance features to leverage in GitLab Learn more Blog How to enforce separation of duties and achieve compliance