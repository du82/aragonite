full_description = "What's nextMeet GitLab Duo WorkflowThe next generation of AI-driven development. Workflow is an intelligent, always-on agent that autonomously monitors, optimizes, and secures projects, enabling developers to focus on innovation. Read the blog post With GitLab Duo, you control which users, projects, and groups can use AI-powered capabilities. Also, your organization’s proprietary code and data aren’t used to train AI models. Give your developers a single platform that integrates the best AI model for each use case across the entire workflow, from understanding code to fixing security vulnerabilities. For organizations and teams to trust AI, it must be transparent. GitLab’s AI Transparency Center details how we uphold ethics and transparency in our AI-powered features. The best results from Code Suggestions are expected for languages the Google Vertex AI Codey APIs directly support: C++, C#, Go, Google SQL, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Scala, Swift, and TypeScript. Our abstraction layer allows us to power AI capabilities with the suitable model for the right use case. Explore the language models used for each GitLab Duo feature here. GitLab does not train generative AI models based on private (non-public) data. The vendors we work with also do not train models based on private data. Learn more here. Yes. GitLab has an open core business model that enables us to build with our customers, who can contribute new capabilities to our product. Output generated by GitLab Duo can be used at your discretion and, if a third-party claim arises from your use of the output generated by GitLab Duo, GitLab will step in and defend you. Organizational Controls allows Admins to assign license seats to specific users via a new admin UI. Code Suggestions can be enabled or disabled by the user directly in the IDE extension settings. Experimental/Beta AI Features such as Chat are controlled with a Top-level group setting. Learn more here. No, Code