["https://abseil.io/about/philosophy"]
title = "abseil / Why Adopt Abseil?"
description = "©2017 Abseil | Live at Head"
full_description = "There are a few main reasons we recommend Abseil as your first choice for utility code when starting a new C++ project: The extent to which any of these arguments applies to your project will depend on lots of things: we don’t claim that Abseil is a silver bullet, or a perfect solution for everyone’s problems. On the other hand, these libraries have grown inside Google for many years and we’ve learned a lot in their evolution. We know that these libraries and our upgrade policies can be a good solution for some types of problems that are important in the industry, and over time we’ve learned how to provide this sort of infrastructure in an evolving but maintainable fashion. Google has developed many abstractions that either match or closely match features incorporated into C++14, C++17, and beyond. Using the Abseil versions of these abstractions allows you to access these features now, even if your code is not yet ready for life in a post C++11 world. Take C++17’s std::string_view for example: this type was proposed for standardization largely based on Google’s experience with an internal type we called StringPiece. We’ve done extensive work internally to mutate our StringPiece type to have the same API as string_view, and now we are publishing it with Abseil - not as std::string_view, but as absl::string_view. Why would we do that? Doesn’t that mean there are now two near-identical types? Won’t this cause confusion? We think not: if you look at the preprocessor conditional structure in our string_view.h you’ll see that we are trying to identify whether your C++ installation has std::string_view. If you do, absl::string_view is defined only as an alias to the standard type. If you don’t, you get a C++11/C++14 compatible implementation of the type. This means you can adopt Abseil, and for types we are “pre-releasing” you can use the type from the absl namespace. As soon as your project is built with the appropriate compiler/standard library version, we’ll fall away and leave you with the standard type, albeit spelled funny. Better: as soon as you know that your project will only build with the appropriate language version you can run tools that we will provide to change the places that refer to absl::string_view to spell it std::string_view — since those are the same type, this is safe to do, even across API boundaries."
year_published = 2025
