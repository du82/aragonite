["https://abseil.io/about/compatibility"]
title = "abseil / Abseil Compatibility Guidelines"
description = "©2017 Abseil | Live at Head"
full_description = "In general, we avoid making backwards incompatible changes to our C++ APIs (see below for the definition of “API”). Sometimes such changes yield benefits to our customers, in the form of better performance, easier-to-understand APIs, and/or more consistent APIs. When these benefits warrant it, we will announce these changes prominently in our commit messages as well as in the release notes for LTS releases. Nevertheless, we have found that at scale, every change is potentially a breaking change for some user. Though we take reasonable efforts to prevent this, it is possible that backwards incompatible changes go undetected and, therefore, undocumented. We apologize if this is the case and welcome feedback or bug reports to rectify the problem. Users following our recommended live-at-head approach should always be able to temporarily pin their builds to a previous commit in our Git history. Each LTS release should be considered to be a new major version of the library. Previous LTS releases of the library will remain available on the GitHub Releases page. In many cases, you will be able to use an older version even if a newer version has changes that you are unable (or do not have time) to adopt. We request that our users adhere to the following guidelines to avoid accidentally depending on parts of the library we do not consider to be part of the public API and therefore may change (including removal) without notice: By “API” we mean the C++ API exposed by Abseil’s public header files. We are also talking only about API stability – the ABI is subject to change without notice. You should not assume that binary artifacts (e.g. static libraries, shared objects, dynamically loaded libraries, object files) created with one version of the library are usable with newer/older versions of the library. The ABI may, and does, change on “minor revisions”, and even patch releases. Applications developers interact with a C++ library through more than just the C++ symbols and headers. They also need to reference the name of the library in their build scripts. Depending on the build system they use this may be a CMake target, a Bazel rule, a pkg-config module, or just the name of some object in the file system."
year_published = 2025
clearnet = "https://abseil.io/about/compatibility"
