n-width: 768px) { .b-188042535-top { padding-top: 60px; } .b-188042535-bottom { padding-bottom: 60px; } } Course Overview Welcome to C# 101 for Hackers. This course introduces students to C# and the .NET framework. Students will learn to install and configure C# and .NET for development and concentrate on learning the language by writing C# console applications. Topics covered include the basic structure and syntax of C#, an introduction to the many core and fundamental statements and practices within C#, and leverage what’s discussed with examples that students can implement, re-use, and learn from further.Key Topics Learn how to set up and configure C# and .NET on Kali Linux. Learn the syntax and structure of C#, and understand the basics of what .NET offers. Review and use various code flow statements and techniques. Learn various coding techniques and patterns that can be reused to build practical ethical hacking tools using C#. Understand the differences between asynchronous and parallel programming and their implementations. Learn to step through and debug your code. Apply learned concepts through hands-on exercises and real-world scenarios to build practical and functional applications. PrerequisitesStudents should be familiar with basic scripting languages and techniques but do not need to have any prior knowledge of C# and .NET.System RequirementsStudents need a PC that runs Windows, Mac OSX, or Linux. No specific memory or space requirements exist for this course. .b-188042536-top { padding-top: 22.400000000000002px; } .b-188042536-bottom { padding-bottom: 22.400000000000002px; } .b-188042536-text_color { color: #323232; } .b-188042536-gutter_width { --gutter-width: 24px; } .b-188042536-content_width { width: 960px; } .b-188042536-heading_color { color: #323232; } .b-188042536-text_alignment { text-align: left; } .b-188042536-background_color { background-color: #FFFFFF; } .b-188042536-image_border_radius { border-radius: 0px; } .block__image-with-text .b-