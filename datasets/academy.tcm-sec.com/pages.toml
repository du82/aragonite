0% - 12px); margin-left: 12px; } } What will I learn?The following concepts will be taught in this course: The difference between Python2 and Python3, and how to leverage both as hacking and automation tools How to install, setup and configure a Python environment in Kali Linux with Virtual Box Fundamental programming concepts: variables, data types, string formatting, booleans, operators, tuples, lists, dictionaries, sets conditionals, functions and loops Python programming concepts useful for solving hacking and automation tasks: reading files, writing files, handling user input, exception and error handling, comprehensions and lambdas How to leverage and extend Python using common and hacking focused modules Practical examples demonstrating how to perform SSH login brute forcing, SHA256 password cracking, web login form brute forcing and SQL injection exploitation using Python Understanding the importance of documenting and commenting your work and recommendations to continue mastering Python and programming moving forward .b-188042705-top { padding-top: 33.6px; } .b-188042705-bottom { padding-bottom: 33.6px; } .b-188042705-text_color { color: #36414D; } .b-188042705-content_width { max-width: 710px; } .b-188042705-background_color { background-color: #FFFFFF; } .b-188042705-heading_text_color { color: #36414D; } .block__text .b-188042705-text_color { color: #36414D } .block__text .b-188042705-content_width { width: 710px; } .block__text .b-188042705-heading_text_color h1, .block__text .b-188042705-heading_text_color h2, .block__text .b-188042705-heading_text_color h3, .block__text .b-188042705-heading_text_color h4, .block__text .b-188042705-heading_text_color h5, .block__text .b-188042705-heading_text_color h6 { color: #36414D } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__text .block__text-wrapper h4{ margin-bottom: 9px; } .block__text .block__text-wrapper h5{ margin-bottom: 11p