ows system from start to finish Markus Schober % COMPLETE The Definitive GRC Analyst Master Class Everything you need to know to dive into the cybersecurity GRC pool Gerald Auger, PhD % COMPLETE Practical API Hacking A hands-on course for hacking APIs. Alex Olsen % COMPLETE Rust 101 Learn the foundational concepts of the Rust programming language. Heath Adams % COMPLETE Beginner's Guide to IoT and Hardware Hacking Learn to perform security research and testing on IoT devices and hardware. Andrew Bellini % COMPLETE Detection Engineering for Beginners Start thinking and working as a Detection Engineer. Anthony Isherwood % COMPLETE Practical Bug Bounty A hands-on course to prepare you for your first Bug Bounty adventure. Heath Adams % COMPLETE Practical Web Hacking Expand your knowledge and skills in web application hacking with this intermediate course. Alex Olsen % COMPLETE Advanced Web Hacking Advanced Web Hacking is designed to take your web penetration testing skills to the next level. This course dives deep into advanced topics, exploring edge-case vulnerabilities, sophisticated attacks, and complex scenarios faced in modern web applications. Each module will offer in-depth exploration through code review, debugging, and hands-on labs. Alex Olsen % COMPLETE Programming with AI - Mini Course Utilize Artificial Intelligence and Large Language Models to become a better programmer. Heath Adams % COMPLETE Soft Skills for the Job Market Equip yourself with essential soft skills, communication techniques, and job application strategies required to excel in today’s competitive job market. Heath Adams % COMPLETE Practical Phishing Campaigns This immersive course delves into practical phishing tactics, equipping cybersecurity professionals with the knowledge to perform professional phishing engagements. Aaron Wilson % COMPLETE C# 101 for Hackers Learn the fundamentals of C# and .NET to enhance your hacking skills. Alex Tushinsky % COMPLETE Practical Help Desk Prepare for a career in IT or cybersecurity by learning everything you need to know to work the help desk. Andrew Bellini % COMPLETE Programming 100: Fundamentals Learn the building blocks of programming with Python. Heath Adams % COMPLETE Academy Live Workshops Exclusive Workshops for Academy Students Go beyond the course materials with bi-monthly livestreamed workshops taught by your favorite Academy instructors. These interactive sessions will be hosted on the Academy platform and will not be available on our public social media channels. If you attend live, you can ask questions and hack alongside our instructors. Workshop recordings will also be available so you can go back later and hack at your own pace. Topics for the workshops will rotate, please check the curriculum below for the upcoming schedule. Alex Olsen % COMPLETE Assembly 101 Learn the language of computers and how to write your own Assembly code. Andrew Bellini % COMPLETE View All Products .b-188040706-top { padding-top: 11.200000000000001px; } .b-188040706-bottom { padding-bottom: 0.0px; } .b-188040706-text_color { color: #36414D; } .b-188040706-content_width { max-width: 590px; } .b-188040706-background_color { background-color: #000000; } .b-188040706-heading_text_color { color: #ffffff; } .block__text .b-188040706-text_color { color: #36414D } .block__text .b-188040706-content_width { width: 590px; } .block__text .b-188040706-heading_text_color h1, .block__text .b-188040706-heading_text_color h2, .block__text .b-188040706-heading_text_color h3, .block__text .b-188040706-heading_text_color h4, .block__text .b-188040706-heading_text_color h5, .block__text .b-188040706-heading_text_color h6 { color: #ffffff } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__text .block__text-wrapper h4{ margin-bottom: 9px; } .block__text .block__text-wrapper h5{ margin-bottom: 11px; } .block__text .block__text-wrapper h6{ margin-bottom: 14px; } @med