3232 } .block__text-with-image-grid.b-182389950-text_alignment { text-align: left } .block__text-with-image-grid.b-182389950-heading_text_color .block__text-with-image-grid__column__heading-text { color: #FFFFFF } .block__text-with-image-grid.b-182389950-description_text_color .block__text-with-image-grid__column__body { color: #FFFFFF } .block__text-with-image-grid__column__image.b-182389950-image_border_radius { border-radius: 0px; } @media screen and (min-width: 768px) { .b-182389950-top { padding-top: 40px; } .b-182389950-bottom { padding-bottom: 40px; } .b-182389950-gutter_width .block__columns { grid-column-gap: 40px; } } Andrew Bellini My name is Andrew Bellini and I sometimes go as DigitalAndrew on social media. I’m an electrical engineer by trade with a bachelor’s degree in electrical engineering and am a licensed Professional Engineer (P. Eng) in Ontario, Canada. While my background and the majority of my career has been in electrical engineering, I am also an avid and passionate ethical hacker.In addition to my love for all things ethical hacking, cybersecurity, CTFs and tech I also am a dad, play guitar and am passionate about the outdoors and fishing. Andrew Prince Andrew is a seasoned and passionate security professional who brings a wealth of experience in areas such as security operations, incident response, threat hunting, vulnerability management, and cloud infrastructure security. With a professional background in development and system administration, Andrew offers a well-rounded perspective on his security strategy. Andrew also navigates both offensive and defensive operations to provide a holistic approach to keeping people, processes, and technology secure. He is also active in developing various Capture the Flag challenges, creating security training, and sharing knowledge through content creation. .b-182389951-top { padding-top: 22.400000000000002px; } .b-182389951-bottom { padding-bottom: 22.400000000000002px; } .b-182389951-card_style { --