m: 14px; } @media screen and (min-width: 768px) { .b-188042439-top { padding-top: 60px; } .b-188042439-bottom { padding-bottom: 60px; } } Course Overview The Beginner’s Guide to IoT and Hardware Hacking course teaches foundational skills and techniques required to get started performing security research and testing on IoT devices and hardware. This course focuses mainly on the hardware aspects of IoT hacking and how to use the underlying access to physical hardware to aid in and amplify the ability to hunt for vulnerabilities. While this course is a “beginner” level for IoT and Hardware Hacking the difficulty level as an overall cybersecurity course is intermediate. This course is open to everyone but has been specifically created for students who are familiar with software-based penetration testing (such as network, web, and mobile) and want to learn how to bridge those skills over to IoT and Hardware testing.Prerequisites & System RequirementsA general understanding of penetration testing methods and methodology and a general understanding of Linux are strongly recommended.A computing environment (Windows, Linux, or Mac*) capable of running a virtual machine with at least 8GB of RAM and 40GB of disk space. *Note that new MacBook Pros with the M1 chip are unable to run virtual machines such as the ones demonstrated in this course.If you want to follow along with all the hands-on portions of the course, you’ll need to purchase the physical equipment and tools used in the course; you can find a full list in the second lesson of the course which is available for preview. Note that some hands-on portions of the course can be completed without physical hardware. .b-188042440-top { padding-top: 33.6px; } .b-188042440-bottom { padding-bottom: 2.8000000000000003px; } .b-188042440-text_color { color: #36414D; } .b-188042440-content_width { max-width: 710px; } .b-188042440-background_color { background-color: #FFFFFF; } .b-188042440-heading_text_color { color: #36414D; } .b