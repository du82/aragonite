d (min-width: 768px) { .b-188042702-top { padding-top: 60px; } .b-188042702-bottom { padding-bottom: 60px; } } Course OverviewThe Python 101 for Hackers course teaches an introduction to Python programming and concepts, with a focus on techniques, modules and examples which are useful for a hacker. No prior Python programming knowledge is required to be successful in this introductory course. Students should take this Python 101 for Hackers course if they are interested in: Understanding fundamental Python programming concepts, required to automate common hacking and bug bounty related tasks Learning how to identify and mitigate Python programming errors which may occur when attempting to execute code snippets or proof of concept (PoC) scripts Bridging the gap between generic programming concepts and practical hacking applications such as password cracking, web login brute forcing or exploitation of SQL injections System Requirements Patience and a willingness to learn A computing environment (Windows, Linux, Mac) with at least 8GB of RAM and 20GB of disk space Prior virtualization (Virtual Box) knowledge preferred .b-188042703-top { padding-top: 33.6px; } .b-188042703-bottom { padding-bottom: 2.8000000000000003px; } .b-188042703-text_color { color: #36414D; } .b-188042703-content_width { max-width: 710px; } .b-188042703-background_color { background-color: #F5F5F8; } .b-188042703-heading_text_color { color: #36414D; } .block__text .b-188042703-text_color { color: #36414D } .block__text .b-188042703-content_width { width: 710px; } .block__text .b-188042703-heading_text_color h1, .block__text .b-188042703-heading_text_color h2, .block__text .b-188042703-heading_text_color h3, .block__text .b-188042703-heading_text_color h4, .block__text .b-188042703-heading_text_color h5, .block__text .b-188042703-heading_text_color h6 { color: #36414D } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__tex