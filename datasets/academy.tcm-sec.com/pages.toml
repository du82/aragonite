tall Sublime (3:10) Start Python syntax (8:29) Start Python 101 Available in days days after you enroll Variables & data types (10:32) Preview Numbers (6:48) Start String formatting (21:29) Start Booleans & operators (17:13) Start Tuples (9:54) Start Lists (12:50) Start Dictionaries (5:40) Start Sets (6:42) Start Conditionals (14:08) Start Loops (9:17) Preview Reading and writing files (8:05) Start User input (4:22) Start Exceptions and error handling (8:55) Start Comprehensions (8:54) Start Functions and code reuse (18:25) Start Lambdas (6:06) Start Extending Python Available in days days after you enroll The Python package manager (7:09) Start Python virtual environments (5:51) Start Introduction to sys (12:13) Start Introduction to requests (18:38) Start Introduction to pwntools (12:15) Start Automating with Python Available in days days after you enroll Project #1 - SSH login brute forcing (7:27) Start Project #2 - SHA256 password cracking (8:21) Start Project #3 - Web login form brute forcing (7:33) Start Project #4 - Exploiting a SQL injection (16:48) Start Project #5 - Exploiting a restricted SQL injection (15:04) Start Closing Available in days days after you enroll The importance of comments (3:38) Start Wrap up and next steps (1:45) Start Show All Lectures .b-188042707-top { padding-top: 22.400000000000002px; } .b-188042707-bottom { padding-bottom: 22.400000000000002px; } .b-188042707-text_color { color: #36414D; } .b-188042707-gutter_width { --gutter-width: 24px; } .b-188042707-content_width { width: 960px; } .b-188042707-heading_color { color: #36414D; } .b-188042707-text_alignment { text-align: left; } .b-188042707-background_color { background-color: #FFFFFF; } .b-188042707-image_border_radius { border-radius: 0px; } .block__image-with-text .b-188042707-text_color { color: #36414D; } .block__image-with-text.b-188042707-background_color { background-color: #FFFFFF; } .block__image-with-text .b-188042707-heading_color .block__image-with-text__inner__head