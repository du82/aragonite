14px; } @media screen and (min-width: 768px) { .b-188042799-top { padding-top: 60px; } .b-188042799-bottom { padding-bottom: 60px; } } Course OverviewThis course aims to equip students with all of the fundamental security operations knowledge and practical skills needed in order to achieve and excel in a T1 or T2 SOC Analyst position. By covering topics such as phishing analysis, incident response procedures, threat detection techniques, log analysis, SIEM management, and security tool utilization, students will gain the essential competencies required to effectively monitor, analyze, and respond to security incidents within a SOC environment.Students will be able to actively engage with the course material through bite-sized video demonstrations, written materials and references, quizzes to assess comprehension, and practical exercises that simulate real-world scenarios.By the end of the course, participants will be proficient in using various common security tools, analyzing security events and artifacts, handling alert tickets, triaging, and responding effectively to incidents within a SOC. Additionally, the course aims to foster critical thinking skills and encourage both proactive and reactive methodologies, which are pivotal for skilled analysts.New Content Added November 2024!We've added a new section on Memory Analysis and one new challenge to test your skills. Key Topics Covered: Security Operations Fundamentals Phishing Analysis Network Security Monitoring Network Traffic Analysis Endpoint Security Monitoring Endpoint Detection and Response Log Analysis and Management Security Information and Event Management (SIEM) Threat Intelligence Digital Forensics Incident Response System RequirementsTo get the most out of this course and follow along with the labs, there will be times where two virtual machines (VMs) need to be run simultaneously. If resources are limited, you can run one VM at a time and follow along with the course. Below are the recommended (ideal) specifications. Feel free to adjust based on your own system's limitations, but these specs will ensure a smoother experience with the course labs.Processor: 64-bit Intel i5 or i7, 2.0 GHz or higher.RAM: At least 8 GB (ideally 8-12+ GB) to efficiently run multiple VMs.Disk Space: 80-100 GB of free storage. SSDs are recommended for better performance.PrerequisitesNetworking Fundamentals: Basic understanding of TCP/IP and OSI models. Knowledge of network concepts such as subnets, internal vs. external IP addresses, network address translation, and routing. Familiarity with common protocols (e.g., SSH, FTP, HTTP, HTTPS). The foundations and network sections of the course will provide a refresher on these concepts and more, but it would be ideal to have these foundations coming into the course.Operating System Fundamentals: Basic familiarity with Windows and Linux components. Working with the command-line and knowledge of basic commands and navigation (e.g., cd, ls, cat). Troubleshooting skills Basic Information Security Concepts: Understanding of foundational security concepts such as the CIA triad, security controls, encryption, and hashing. Basic security appliances and controls (e.g., firewalls, proxies, VPNs, EDR) The foundations section of the course will provide a comprehensive information security refresher. .b-188042800-top { padding-top: 33.6px; } .b-188042800-bottom { padding-bottom: 2.8000000000000003px; } .b-188042800-text_color { color: #36414D; } .b-188042800-content_width { max-width: 710px; } .b-188042800-background_color { background-color: #FFFFFF; } .b-188042800-heading_text_color { color: #36414D; } .block__text .b-188042800-text_color { color: #36414D } .block__text .b-188042800-content_width { width: 710px; } .block__text .b-188042800-heading_text_color h1, .block__text .b-188042800-heading_text_color h2, .block__text .b-188042800-heading_text_color h3, .block__text .b-188042800-heading_text_color h4, .block__text .b-188042800-heading_text_color h5, .block__text .b-188042800-heading_text_color h6 { color: #36414D } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__text .block__text-wrapper h4{ margin-bottom: 9px; } .block__text .block__text-wrapper h5{ margin-bottom: 11px; } .block__text .block__text-wrapper h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-188042800-top { padding-top: 60px; } .b-188042800-bottom { padding-bottom: 5px; } } SOC 101 Course Objectives .b-188042801-top { padding-top: 2.8000000000000003px; } .b-188042801-bottom { padding-bottom: 5.6000000000000005px; } .b-188042801-text_color { color: #36414D; } .b-188042801-gutter_width { --gutter-width: 50px; } .b-188042801-content_width { width: 960px; } .b-188042801-heading_color { color: #36414D; } .b-188042801-text_alignment { text-align: left; } .b-188042801-background_color { background-color: #FFFFFF; } .b-188042801-image_border_radius { border-radius: 0px; } .block__image-with-text .b-188042801-text_color { color: #36414D; } .block__image-with-text.b-188042801-background_color { background-color: #FFFFFF; } .block__image-with-text .b-188042801-heading_color .block__image-with-text__inner__heading { color: #36414D; } .block__image-with-text .b-188042801-text_alignment { text-align: left; } .block__image-with-text__image.b-188042801-image_border_radius { border-radius: 0px; } .block__image-with-text .block__image-with-text__inner__heading h2{ margin-bottom: 2px; } .block__image-with-text .block__image-with-text__inner__heading h3{ margin-bottom: 5px; } .block__image-with-text .block__image-with-text__inner__heading h4{ margin-bottom: 9px; } .block__image-with-text .block__image-with-text__inner__heading h5{ margin-bottom: 11px; } .block__image-with-text .block__image-with-text__inner__heading h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-188042801-top { padding-top: 5px; } .b-188042801-bottom { padding-bottom: 10px; } .b-188042801-gutter_width .block__image-with-text__text-wrapper { width: calc(50% - 25px); margin-right: 25px; } .b-188042801-gutter_width div.block__image-with-text__image { width: calc(50% - 25px); margin-left: 25px; } } Understand the foundational principles and practices of security operations. Learn techniques for analyzing and identifying phishing attacks. Develop skills in monitoring network traffic for security threats and anomalies. Develop skills in monitoring and analyzing security events on individual hosts. Learn how to effectively use a SIEM for security event correlation, analysis, and incident management. Learn how to leverage threat intelligence to enhance security operations and incident response. Develop an understanding of digital forensics processes, common tools, and methodologies. Understand the procedures, and best practices for incident response in a SOC environment. .b-188042802-top { padding-top: 0.0px; } .b-188042802-bottom { padding-bottom: 11.200000000000001px; } .b-188042802-text_color { color: #36414D; } .b-188042802-gutter_width { --gutter-width: 100px; } .b-188042802-content_width { width: 960px; } .b-188042802-heading_color { color: #36414D; } .b-188042802-text_alignment { text-align: left; } .b-188042802-background_color { background-color: #FFFFFF; } .b-188042802-image_border_radius { border-radius: 0px; } .block__image-with-text .b-188042802-text_color { color: #36414D; } .block__image-with-text.b-188042802-background_color { background-color: #FFFFFF; } .block__image-with-text .b-188042802-heading_color .block__image-with-text__inner__heading { color: #36414D; } .block__image-with-text .b-188042802-text_alignment { text-align: left; } .block__image-with-text__image.b-188042802-image_border_radius { border-radius: 0px; } .block__image-with-text .block__image-with-text__inner__heading h2{ margin-bottom: 2px; } .block__image-with-text .block__image-with-text__inner__heading h3{ margin-bottom: 5px; } .block__image-with-text .block__image-with-text__inner__heading h4{ margin-bottom: 9px; } .block__image-with-text .block__image-with-text__inner__heading h5{ margin-bottom: 11px; } .block__image-with-text .block__image-with-text__inner__heading h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-188042802-top { padding-top: 0px; } .b-188042802-bottom { padding-bottom: 20px; } .b-188042802-gutter_width .block__image-with-text__text-wrapper { width: calc(50% - 50px); margin-left: 50px; } .b-188042802-gutter_width div.block__image-with-text__image { width: calc(50% - 50px); margin-right: 50px; } } By the end of this course, students will be prepared to take on the Practical SOC Analyst Associate certification exam.This associate-level exam will assess a student’s ability to use analysis tools, interpret artifacts, and apply investigation methodologies to evaluate security incidents and retrace attacks. Students will have two (2) full days to complete the assessment and an additional two (2) days to write a professional report. .b-188042803-top { padding-top: 0.0px; } .b-188042803-bottom { padding-bottom: 22.400000000000002px; } .b-188042803-background_color { background-color: #FFFFFF; } .b-188042803-button_border_radius { border-radius: 25px; } .block__button--button.b-188042803-button_border_radius { border-radius: 25px; } @media screen and (min-width: 768px) { .b-188042803-top { padding-top: 0px; } .b-188042803-bottom { padding-bottom: 40px; } } LEARN MORE .b-188042804-top { padding-top: 33.6px; } .b-188042804-bottom { padding-bottom: 33.6px; } .b-188042804-text_color { color: #36414D; } .b-188042804-content_width { max-width: 710px; } .b-188042804-background_color { background-color: #F5F5F8; } .b-188042804-heading_text_color { color: #36414D; } .block__text .b-188042804-text_color { color: #36414D } .block__text .b-188042804-content_width { width: 710px; } .block__text .b-188042804-heading_text_color h1, .block__text .b-188042804-heading_text_color h2, .block__text .b-18804280