-width: 768px) { .b-188042469-top { padding-top: 60px; } .b-188042469-bottom { padding-bottom: 60px; } } Course OverviewDetection Engineering for Beginners teaches core concepts and skills to start thinking and working as a Detection Engineer!This course will first teach the theory behind security operations and detection engineering. We'll then start building out our home lab using VirtualBox and Elastic's security offering. Then we'll run through three different attack scenarios, each more complex than the one prior. We'll make detections off of our attacks, and learn how to document our detections. Next we'll dive more into coding and Python by writing validation scripts and learning out to interact with Elastic through their API. Wrapping everything up, we'll host all our detections on GitHub and sync with Elastic through our own GitHub Action automations. As a cherry on top, we'll have a final section on how to write scripts to gather important metrics and visualizations.This course takes students from A-Z on the detection engineering lifecycle and technical implementation of a detection engineering architecture.While this course is marketed as entry level, any prerequisite knowledge will help in the courses learning curve. Familiarity with security operations, searching logs, security analysis, or any related skillset will be helpful (but ultimately not required).System RequirementsThe ability to run 2-3 VMs on a local machine:* Ubuntu Linux* ParrotOS* Windows 11Minimum Requirements:CPU Cores: 4RAM: 8GBHard Drive Space: 50GBRecommended Requirements:CPU Cores: 6+RAM: 16GB+Hard Drive Space: 50GB+You can technically get by with the main host having only a couple cores and 8 gigs of RAM, but any additional resources that can be assigned to your VMs will make the process smoother. .b-188042470-top { padding-top: 33.6px; } .b-188042470-bottom { padding-bottom: 2.8000000000000003px; } .b-188042470-text_color { color: #36414D; } .b-188042470-content_width { max-width: