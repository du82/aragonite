r overloading and class decorators How to work with and debug lower level languages (including C and assembly) and data types from within Python to interface with the official Windows API, the undocumented Windows API and the kernel via direct system calls Building upon standard Python functionality and leveraging modules to perform web scraping, port scanning, threading, cryptography, direct executable conversion and process creation How to leverage Python to extend Burp and create custom extensions, directly inject a DLL into a remote Windows process and hijack an existing thread to directly execute in-memory shellcode .b-188042741-top { padding-top: 33.6px; } .b-188042741-bottom { padding-bottom: 33.6px; } .b-188042741-text_color { color: #36414D; } .b-188042741-content_width { max-width: 710px; } .b-188042741-background_color { background-color: #FFFFFF; } .b-188042741-heading_text_color { color: #36414D; } .block__text .b-188042741-text_color { color: #36414D } .block__text .b-188042741-content_width { width: 710px; } .block__text .b-188042741-heading_text_color h1, .block__text .b-188042741-heading_text_color h2, .block__text .b-188042741-heading_text_color h3, .block__text .b-188042741-heading_text_color h4, .block__text .b-188042741-heading_text_color h5, .block__text .b-188042741-heading_text_color h6 { color: #36414D } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__text .block__text-wrapper h4{ margin-bottom: 9px; } .block__text .block__text-wrapper h5{ margin-bottom: 11px; } .block__text .block__text-wrapper h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-188042741-top { padding-top: 60px; } .b-188042741-bottom { padding-bottom: 60px; } } Who Should Take Python 201 for Hackers?Students should take this Python 201 for Hackers course if they are interested in: Understanding more advanced Python programming concepts such as decorators, generators, serialization and closures Learning how to identify and use Object Oriented Programming techniques and approaches within their Python scripts Building upon introductory Python 101 concepts and applying knowledge to create practical Windows hacking applications such as keyloggers, encrypted bind shells and process injectors .b-188042742-top { padding-top: 22.400000000000002px; } .b-188042742-bottom { padding-bottom: 22.400000000000002px; } .b-188042742-content_width { width: 710px; } .b-188042742-background_color { background-color: #F5F5F8; } .b-188042742-heading_text_color { color: #36414D; } .b-188042742-lecture_name_background_color { background-color: #F9FAFD; } .b-188042742-section_name_background_color { background-color: #EFEFF5; } @media screen and (min-width: 768px) { .b-188042742-top { padding-top: 40px; } .b-188042742-bottom { padding-bottom: 40px; } } .block__curriculum__section__title.b-188042742-section_name_background_color { background-color: #EFEFF5; } .block__curriculum__section__list__item.b-188042742-lecture_name_background_color { background-color: #F9FAFD; } Python 201 for Hackers Course Curriculum - 7.5 Hours Introduction Available in days days after you enroll Welcome and course introduction (6:46) Preview Course Discord Start Setup on Windows (4:50) Start Python 201 Available in days days after you enroll Decorators (8:02) Start Generators (7:06) Preview Serialization (6:23) Start Closures (5:28) Start Object Oriented Programming Available in days days after you enroll Introduction (3:57) Start Classes, Objects and Methods (12:14) Start Inheritance (7:28) Start Encapsulation (5:10) Start Polymorphism (5:07) Start Operator Overloading (6:54) Start Class Decorators (7:46) Start The Windows API Available in days days after you enroll Introduction (1:50) Start C Data Types and Structures (14:51) Start Interfacing with the Windows API (18:04) Preview Undocumented API Calls (17:46) Start Direct Syscalls (24:38) Start Execution from a DLL (12:00) Start Extending Python Available in days days after you enroll BeautifulSoup (12:21) Start Py2exe (6:47) Start Sockets (14:10) Start Scapy (18:14) Start Subprocess (6:46) Start Threading (16:42) Start Pycryptodome (19:37) Start Argparse (10:37) Preview Python Projects Available in days days after you enroll Project #1 - Remote DLL Injection (22:00) Start Project #2 - Process Creation and Shellcode Execution (pt1) (20:00) Start Project #2 - Process Creation and Shellcode Execution (pt2) (17:16) Start Project #3 - Keylogging a System (25:33) Start Project #4 - Buffer Overflow (7:01) Start Project #5 - Encrypted Bind Shell (27:10) Start Extending Burp Available in days days after you enroll Introduction (3:06) Start Custom Burp Extension (29:55) Start Debugging Available in days days after you enroll Introduction (4:38) Start Debugging a Script (10:37) Start Closing Available in days days after you enroll Wrap Up and Next Steps (1:27) Start Show All Lectures .b-188042743-top { padding-top: 22.400000000000002px; } .b-188042743-bottom { padding-bottom: 22.400000000000002px; } .b-188042743-text_color { color: #36414D; } .b-188042743-gutter_width { --gutter-width: 24px; } .b-188042743-content_width { width: 960px; } .b-188042743-heading_color { color: #36414D; } .b-188042743-text_alignment { text-align: left; } .b-188042743-background_color { background-color: #FFFFFF; } .b-188042743-image_border_radius { border-radius: 0px; } .block__image-with-text .b-188042743-text_color { color: #36414D; } .block__image-with-text.b-188042743-background_color { background-color: #FFFFFF; } .block__image-with-text .b-188042743-heading_color .block__image-with-text__inner__heading { color: #36414D; } .block__image-with-text .b-188042743-text_alignment { text-align: left; } .block__image-with-text__image.b-188042743-image_border_radius { border-radius: 0px; } .block__image-with-text .block__image-with-text__inner__heading h2{ margin-bottom: 2px; } .block__image-with-text .block__image-with-text__inne