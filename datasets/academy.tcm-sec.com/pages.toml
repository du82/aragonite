} .block__text .block__text-wrapper h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-188042312-top { padding-top: 60px; } .b-188042312-bottom { padding-bottom: 60px; } } Course OverviewArm yourself with knowledge and bring the fight to the bad guys! Practical Malware Analysis & Triage (PMAT) brings the state of the art of malware analysis to you in engaging instructional videos and custom-made, practical labs.Welcome to Practical Malware Analysis & Triage. I’m Matt, aka HuskyHacks, and I’m excited to be your instructor for this course. I had a blast putting it together and I hope that you will come along with me and learn the art of splicing, slicing, inspecting, and dissecting malware samples.Featuring two malware analysis lab build options: local virtual machines and a rapid-deployable cloud malware analysis network! Learn how to spin up a malware analysis network on AWS from anywhere in the world!Skill LevelBasic-Plus to Intermediate. The course includes a selection of advanced topics. All concepts are taught in an accessible, foundational manner.Why Take the Practical Malware Analysis & Triage Course?This course is centered on practical labs that bring malware samples to bear in a safe, controlled environment.First, you will learn to handle malware safely and construct an isolated lab environment. Then, you will learn the basics of malware analysis on samples designed to teach you the core analysis concepts. As the labs progress, the level of offensive tradecraft employed by these samples grows.By the end of the course, you’ll be using automated workflows and advanced analysis to extract key facts about real-world specimens.Finally, and most importantly, you’ll learn the keys to writing detection rules and triage reports to tell the world what you have learned.What Will I Receive from this Course? Access to the student-only channel on Discord to receive support from the instructor and other students. Access to 9+ hours of engaging, instructional video content. Access to the PMAT Lab repository containing dozens of malware samples designed to teach you the fundamentals. Course completion certificate. System Requirements Basic IT knowledge. Knowledge of the general classes of malware (virus, trojan, worm, etc). Knowledge of how these malware classes function on the technical level is not required. Comfort in the command line of Linux and Windows. All tools and techniques taught in the course are explained step-by-step but working knowledge of Bash and the Windows command prompt is recommended. For a local lab build, you need: A computer that: Has at least 6GB of available RAM. Has at least 40GB of available storage. Can run Oracle VirtualBox and host two lab virtual machines at the same time (with the option to host a third for additional development). Has an internet connection. For a cloud malware analysis lab, you need: An AWS account and a way to pay for AWS resource utilization. Knowledge of x86 Assembly and other low level computer programming concepts is not required. Recommendations Familiarity with programming concepts is recommended but not required. Familiarity with offensive cybersecurity Tactics, Techniques & Procedures (TTPs) will be helpful but is not required. .b-188042313-top { padding-top: 33.6px; } .b-188042313-bottom { padding-bottom: 2.8000000000000003px; } .b-188042313-text_color { color: #36414D; } .b-188042313-content_width { max-width: 710px; } .b-188042313-background_color { background-color: #FFFFFF; } .b-188042313-heading_text_color { color: #36414D; } .block__text .b-188042313-text_color { color: #36414D } .block__text .b-188042313-content_width { width: 710px; } .block__text .b-188042313-heading_text_color h1, .block__text .b-188042313-heading_text_color h2, .block__text .b-188042313-heading_text_color h3, .block__text .b-188042313-heading_text_color h4, .block__text .b-188042313-heading_text_color h5, .block__text .b-188042313-heading_text_color h6 { color: #36414D } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__text .block__text-wrapper h4{ margin-bottom: 9px; } .block__text .block__text-wrapper h5{ margin-bottom: 11px; } .block__text .block__text-wrapper h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-188042313-top { padding-top: 60px; } .b-188042313-bottom { padding-bottom: 5px; } } Practical Malware Analysis and Triage Course Objectives .b-188042314-top { padding-top: 11.200000000000001px; } .b-188042314-bottom { padding-bottom: 33.6px; } .b-188042314-text_color { color: #36414D; } .b-188042314-content_width { max-width: 750px; } .b-188042314-background_color { background-color: #ffffff; } .b-188042314-heading_text_color { color: #36414D; } .block__text .b-188042314-text_color { color: #36414D } .block__text .b-188042314-content_width { width: 750px; } .block__text .b-188042314-heading_text_color h1, .block__text .b-188042314-heading_text_color h2, .block__text .b-188042314-heading_text_color h3, .block__text .b-188042314-heading_text_color h4, .block__text .b-188042314-heading_text_color h5, .block__text .b-188042314-heading_text_color h6 { color: #36414D } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__text .block__text-wrapper h4{ margin-bottom: 9px; } .block__text .block__text-wrapper h5{ margin-bottom: 11px; } .block__text .block__text-wrapper h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-188042314-top { padding-top: 20px; } .b-188042314-bottom { padding-bottom: 60px; } } Course Topics Safety Always! Build good habits for handling malware safely and create an analysis lab. Safe Malware Sourcing. Learn where to source malware samples safely (no need for the dark web!). Basic Analysis. Learn basic analysis methodology, including interpreting strings, inspecting Windows API calls, identifying packed malware, and discovering host-based signatures. Then, detonate malware to collect network signatures and identify malicious domains and second-stage payloads! Intro to the x86 Assembly Language. Dip your toes into the low-level world of Assembly Language! Learn the foundations of x86 Assembly and use it to perform advanced analysis. Advanced Analysis. Use sophisticated tools like Cutter and x32dbg to discover key insights about malware samples at the lowest possible level. Control the execution flow of a program and manipulate its low-level instructions in a debugger. Patch It Out: Binary Patching & Anti-analysis. Learn the crafty practice of patching binaries at the ASM level to alter the flow of their programs. Then, learn to identify and defeat anti-analysis techniques. Gone Phishing. Learn to analyze malicious documents and document-delivered malware, including malicious macros and remote template injections. What the Shell? Learn to identify and carve out embedded shellcode. Off Script. Identify scripted, obfuscated malware delivery techniques that use PowerShell and Visual Basic Script. Stay Sharp. Decompile and reverse engineer C# assemblies and learn about reverse engineering the .NET Framework! Then, reverse engineer an encrypted malware C2 dropper back to near-perfect original source code with DNSpy! Go Time. Learn the analysis considerations of malware written in Go. Get Mobile! Use MobSF to reverse engineer malicious Android applications. The Bossfight! Use everything you have learned to do a full analysis of one of the most infamous malware samples in history. Automating the Process. Use Jupyter Notebooks and malware sandboxes to automate the analysis process. Tell the World! Write YARA rules to aid in the detection of malware samples and learn how to write effective analysis reports to publish findings. Course Final. Apply everything you’ve learned to display your mastery of the art and science of malware analysis! .b-188042315-top { padding-top: 0.0px; } .b-188042315-bottom { padding-bottom: 11.200000000000001px; } .b-188042315-text_color { color: #36414D; } .b-188042315-gutter_width { --gutter-width: 100px; } .b-188042315-content_width { width: 960px; } .b-188042315-heading_color { color: #36414D; } .b-188042315-text_alignment { text-align: left; } .b-188042315-background_color { background-color: #FFFFFF; } .b-188042315-image_border_radius { border-radius: 0px; } .block__image-with-text .b-188042315-text_color { color: #36414D; } .block__image-with-text.b-188042315-background_color { background-color: #FFFFFF; } .block__image-with-text .b-188042315-heading_color .block__image-with-text__inner__heading { color: #36414D; } .block__image-with-text .b-188042315-text_alignment { text-align: left; } .block__image-with-text__image.b-188042315-image_border_radius { border-radius: 0px; } .block__image-with-text .block__image-with-text__inner__heading h2{ margin-bottom: 2px; } .block__image-with-text .block__image-with-text__inner__heading h3{ margin-bottom: 5px; } .block__image-with-text .block__image-with-text__inner__heading h4{ margin-bottom: 9px; } .block__image-with-text .block__image-with-text__inner__heading h5{ margin-bottom: 11px; } .block__image-with-text .block__image-with-text__inner__heading h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-188042315-top { padding-top: 0px; } .b-188042315-bottom { padding-bottom: 20px; } .b-188042315-gutter_width .block__image-with-text__text-wrapper { width: calc(50% - 50px); margin-right: 50px; } .b-188042315-gutter_width div.block__image-with-text__image { width: calc(50% - 50px); margin-left: 50px; } } By the end of the course, you will be prepared to tackle the Practical Malware Researcher Professional certification exam!This unique exam experience will put the student in the shoes of an enterprise-level malware researcher who must identify, report on, and remediate malware. Students will have five (5) full days to complete the assessment and an additional two (2) days to write a professional report. .b-188042316-top { padding-top: 0.0px; } .b-188042316-bottom { padding-bottom: 22.400000000000002px; } .b-188042316-background_color { background-color: #FFFFFF; } .b-188042316-button_border_radius { border-radius: 25px; } .block__button--button.b-188042316-button_border_radius { border-radius: 25px; } @media screen and (min-width: 768px) { .b-188042316-top { padding-top: 0px; } .b-188042316-bottom { padding-bottom: 40px; } } LEARN MORE .b-188042317-top { padding-top: 33.6px; } .b-188042317-bottom { padding-bottom: 2.8000000000000003px; } .b-188042317-text_color { color: #36414D; } .b-188042317-content_width { max-width: 750px; } .b-188042317-background_color { background-color: #F5F5F8; } .b-188042317-heading_text_color { color: #36414D; } .block__text .b-188042317-text_color { color: #36414D } .block__text .b-188042317-content_width { width: 750px; } .block__text .b-188042317-heading_text_color h1, .block__text .b-188042317-heading_text_color h2, .block__text .b-188042317-heading_text_color h3, .block__text .b-188042317-heading_text_color h4, .block__text .b-188042317-heading_text_color h5, .block__text .b-188042317-heading_text_color h6 { color: #36414D } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__text .block__text-wrapper h4{ margin-bottom: 9px; } .block__text .block__text-wrapper h5{ margin-bottom: 11px; } .block__text .block__text-wrapper h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-188042317-top { padding-top: 60px; } .b-188042317-bottom { padding-bottom: 5px; } } Who Should Take the Practical Malware Analysis & Triage Course? IT professionals of all skill levels who are looking to gain foundational knowledge of malware analysis. Network defenders looking to deepen their knowledge of the state of the art of malware analysis. Penetration Testers/Red Teamers looking to pick up the skill of malware analysis to increase tradecraft/provide higher threat emulation fidelity. Anyone who wants to learn an in-demand skill set and bring the fight to the bad guys! Student Reviews: https://syedhasan010.medium.com/honest-review-of-tcm-securitys-practical-malware-analysis-and-triage-e0285e773523https://squiblydoo.blog/2021/11/26/review-practical-malware-analysis-and-triage-pmathttps://www.domedion.com/2021/11/24/practical-malware-analysis-triage-review/https://www.youtube.com/watch?v=Y2Bb8BPEycc&ab_channel=WireDogSec .b-188042318-top { padding-top: 22.400000000000002px; } .b-188042318-bottom { padding-bottom: 22.400000000000002px; } .b-188042318-gutter_width { --gutter-width: 24px; } .b-188042318-content_width { max-width: 960px; } .b-188042318-text_alignment { text-align: center; } .b-188042318-background_color { background-color: #FFFFFF; } .b-188042318-heading_text_color { color: #36414D; } .b-188042318-image_border_radius { border-radius: 0px; } .b-188042318-description_text_color { color: #36414D; } .block__text-with-image-grid.b-188042"
