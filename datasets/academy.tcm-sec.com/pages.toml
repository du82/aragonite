title = "Practical Bug Bounty | TCM Security, Inc."
description = '''
Heath Adams      Heath Adams, also known as "The Cyber Mentor" on social media, is the founder and CEO of TCM Security, a cybersecurity consulting firm. As an ethical hacker, Heath is passionate about teaching and has educated over 170,000 students across platforms like Udemy, YouTube, Twitch, and INE. He holds numerous certifications including OSCP, OSWP, eCPPTX, eWPT, and CEH among others. Outside of his professional life, he's a husband, animal parent, hobbyist, and a military veteran.                                   Alex Olsen      Alex is a Web Application Security expert who has worked on projects ranging from small apps to enterprise-level web applications with millions of users. He is passionate about both creating and securing applications and advocates for early integration of cybersecurity (the shift-left movement). He educates various professionals on this subject. Alex possesses a Master's Degree in Computing and holds both CEH and OSCP certifications.                                  Jonah Burgess      Jonah (aka CryptoCat) is a member of the community team at Intigriti where he makes educational content, runs a monthly CTF challenge and provides support for the bug bounty community. Before joining Intigriti, he obtained an MSc in Cyber-Security and PhD focused on web malware detection. During that time, he was heavily involved in the production and delivery of content for the MSc, primarily the pen-testing and malware modules. He also holds penetration testing certifications, including OSCP and CPTS.'''
