description = "The objective of this course is to show students how to perform a full digital forensic investigation of a Windows system in a complete DIY setup."
full_description = '''.b-188042524-top { padding-top: 22.400000000000002px; } .b-188042524-bottom { padding-bottom: 22.400000000000002px; } .b-188042524-alignment { text-align: center; } .b-188042524-content_width { max-width: 668px; } .b-188042524-image_overlay { opacity: 0.1; } .b-188042524-background_color { background-color: #000000; } .b-188042524-heading_text_color { color: #FFFFFF; } .b-188042524-button_border_radius { border-radius: 25px; } .b-188042524-subheading_text_color { color: #FFFFFF; } .banner .b-188042524-heading_text_color { color: #FFFFFF } .banner .b-188042524-subheading_text_color { color: #FFFFFF } .banner__button.b-188042524-button_border_radius { border-radius: 25; } @media screen and (min-width: 768px) { .b-188042524-top { padding-top: 40px; } .b-188042524-bottom { padding-bottom: 40px; } } .bl { width: 100%; } Practical Windows Forensics Learn how to conduct a digital forensic investigation on a Windows system from start to finish. Start Your Journey .b-188042525-top { padding-top: 33.6px; } .b-188042525-bottom { padding-bottom: 33.6px; } .b-188042525-text_color { color: #36414D; } .b-188042525-content_width { max-width: 710px; } .b-188042525-background_color { background-color: #FFFFFF; } .b-188042525-heading_text_color { color: #36414D; } .block__text .b-188042525-text_color { color: #36414D } .block__text .b-188042525-content_width { width: 710px; } .block__text .b-188042525-heading_text_color h1, .block__text .b-188042525-heading_text_color h2, .block__text .b-188042525-heading_text_color h3, .block__text .b-188042525-heading_text_color h4, .block__text .b-188042525-heading_text_color h5, .block__text .b-188042525-heading_text_color h6 { color: #36414D } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__text .block__text-wrapper h4{ margin-bottom: 9px; } .block__text .block__text-wrapper h5{ margin-bottom: 11px; } .block__text .block__text-wrapper h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-188042525-top { padding-top: 60px; } .b-188042525-bottom { padding-bottom: 60px; } } Course OverviewThe objective of this course is to show students how to perform a full digital forensic investigation of a Windows system in a complete DIY setup.The course covers a full digital forensic investigation of a Windows system. It begins with the simple preparation of our lab, which consists of setting up a "victim" VM and a forensic workstation. We'll then run an attack simulation script on the victim VM that simulates attack patterns as commonly observed by threat actors in the industry to create a realistic setting for our investigation. From there, we’ll kick off the forensic process, beginning with the data collection, examination and extraction before diving deeper into the analysis of the information at hand.The data analysis section consists of a comprehensive investigation, including various tools and many different forensic artifacts with which every analyst should be familiar. We will not only analyze artifacts, but also discuss their behavior to learn when, why and how to interpret the data contained within these artifacts. The investigation covers Windows disk and memory artifacts and ends with the analysis of the timelines generated from both.This course also covers many important artifacts and concepts relating to Windows forensic analysis. We'll use several freely available tools for the analysis that are well known and recognized in the industry. The student will leave the course with a comprehensive understanding of the forensic process, important Windows artifacts and forensic tools and a forensic workstation available and ready to go for future investigations.System Requirements• Basic IT knowledge• Familiarity with Windows operating systems and virtualization• Basic knowledge of command line utilities (Windows CMD, PowerShell, Ubuntu)• Critical thinking, curiosity, passion for investigations and solving cases• Min. 4GB RAM and 60 GB storage; Ideally, 8GB RAM, 2+ CPUs and 150GB storage (specifically for the last section "Super timelines") Q&As* Where can I find support? You can find support through the Discord channel: https://discord.gg/WKsaGE2CV3 Please be patient, self-determined and willing to learn. That's the only way to gain the skills you want!* Will you be able to provide any of the VM's? Due to licensing restrictions, unfortunately not.* Where is the course material hosted? The course material is hosted on Github: https://github.com/bluecapesecurity/PWF .b-188042526-top { padding-top: 22.400000000000002px; } .b-188042526-bottom { padding-bottom: 22.400000000000002px; } .b-188042526-text_color { color: #36414D; } .b-188042526-gutter_width { --gutter-width: 24px; } .b-188042526-content_width { width: 960px; } .b-188042526-heading_color { color: #36414D; } .b-188042526-text_alignment { text-align: left; } .b-188042526-background_color { background-color: #F5F5F8; } .b-188042526-image_border_radius { border-radius: 0px; } .block__image-with-text .b-188042526-text_color { color: #36414D; } .block__image-with-text.b-188042526-background_color { background-color: #F5F5F8; } .block__image-with-text .b-188042526-heading_color .block__image-with-text__inner__heading { color: #36414D; } .block__image-with-text .b-188042526-text_alignment { text-align: left; } .block__image-with-text__image.b-188042526-image_border_radius { border-radius: 0px; } .block__image-with-text .block__image-with-text__inner__heading h2{ margin-bottom: 2px; } .block__image-with-text .block__image-with-text__inner__heading h3{ margin-bottom: 5px; } .block__image-with-text .block__image-with-text__inner__heading h4{ margin-bottom: 9px; } .block__image-with-text .block__image-with-text__inner__heading h5{ margin-bottom: 11px; } .block__image-with-text .block__image-with-text__inner__heading h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-188042526-top { padding-top: 40px; } .b-188042526-bottom { padding-bottom: 40px; } .b-188042526-gutter_width .block__image-with-text__text-wrapper { width: calc(50% - 12px); margin-right: 12px; } .b-188042526-gutter_width div.block__image-with-text__image { width: calc(50% - 12px); margin-left: 12px; } } Who Should Take Practical Windows Forensics? • Beginners wanting to break into cyber security• SOC Analysts, Junior and senior IT security staff• Current DFIR and security analysts• Blue Teamers / Red Teamers / Penetration Testers• Lawyers and compliance staff"Everything I wish I knew when I started analyzing Windows systems as a DFIR consultant." .b-188042527-top { padding-top: 22.400000000000002px; } .b-188042527-bottom { padding-bottom: 22.400000000000002px; } .b-188042527-content_width { width: 710px; } .b-188042527-background_color { background-color: #FFFFFF; } .b-188042527-heading_text_color { color: #36414D; } .b-188042527-lecture_name_background_color { background-color: #F9FAFD; } .b-188042527-section_name_background_color { background-color: #EFEFF5; } @media screen and (min-width: 768px) { .b-188042527-top { padding-top: 40px; } .b-188042527-bottom { padding-bottom: 40px; } } .block__curriculum__section__title.b-188042527-section_name_background_color { background-color: #EFEFF5; } .block__curriculum__section__list__item.b-188042527-lecture_name_background_color { background-color: #F9FAFD; } Practical Windows Forensics Course Curriculum - 11 Hours 1) Welcome to Practical Windows Forensics (PWF) Available in days days after you enroll Welcome and course introduction (4:25) Preview Resources and Materials Overview (4:32) Start Course Links Start PWF Course Roadmap (1:54) Start 2) Lab Requirements Available in days days after you enroll Lab Setup Overview (3:15) Start 3) Setting up your forensic workstation Available in days days after you enroll Build your forensic workstation tutorial and downloads (7:06) Start VirtualBox and Windows 2019 VM installation (8:46) Start WSL and Ubuntu installation on Windows 2019 Server (7:56) Start WSL and Ubuntu installation on Windows 10 (alternative) (4:03) Start Forensic workstation Windows configuration (5:37) Start Downloading and installing forensic tools (12:04) Start 4) Prepare your target system Available in days days after you enroll Download and install the Windows 10 VM (9:58) Start Target system configuration and attack script preparation (8:04) Start Execute the attack script on the target system (4:38) Start 5) Data collection process Available in days days after you enroll Forensic process overview (3:16) Start Target system containment (2:35) Start Memory acquisition of the target system (8:01) Start Disk acquisition of the target system (9:04) Start 6) Examination of the forensic data Available in days days after you enroll Data examination process overview (1:04) Start Mounting the disk image with Arsenal Image Mounter (8:32) Start Overview of Windows files and forensic artifacts (5:46) Start Creating a triage data collection with KAPE (12:51) Start 7) Disk analysis introduction Available in days days after you enroll Sources of evidence and disk analysis process overview (3:10) Start Notes taking and course materials (2:07) Start 7.1) Windows registry analysis Available in days days after you enroll Windows registry overview (17:07) Preview Exploring the registry with Registry Explorer (9:34) Start Gathering system information with RegRipper (9:25) Start RegRipper analysis continued (10:04) Start Parsing registry hives in bulk with RegRipper (8:52) Start User accounts and SIDs Overview (11:27) Start Analysis of user accounts, groups and profiles (14:22) Start 7.2) User behavior analysis Available in days days after you enroll User behavior analysis overview (3:39) Start UserAssist analysis (5:50) Start RecentDocs analysis (2:53) Start ShellBags analysis (13:57) Preview 7.3) Overview of disk structures, partitions and file systems Available in days days after you enroll What is a file system? (1:44) Start Exploring disk structures and the NTFS (8:01) Start 7.4) Analysis of the Master File Table (MFT) Available in days days after you enroll Overview of MFT Records (4:16) Start Analysis of MFT Records with MFTECmd (10:10) Start MFT parsing and in-depth analysis with MFTECmd (12:46) Start File timestamps and the MACB timestamp format (8:56) Start Investigating file timestomping (3:29) Start 7.5) Finding evidence of deleted files with USN Journal analysis Available in days days after you enroll How can we find evidence of deleted files? (10:24) Start Analyzing the USN Journal for deleted files (16:57) Start 7.6) Analyzing evidence of program execution on Windows systems Available in days days after you enroll Execution artifacts introduction (1:23) Start Analyzing the Background Activity Moderator (BAM) (7:50) Start Analysis of the Application Compatibility Cache (ShimCache) (12:03) Start Overview of the Amcache (5:38) Start Analyzing the Amcache with AmcacheParser (9:47) Start BONUS: Amcache in-depth analysis and why scheduled tasks matter (14:37) Start Windows Prefetch analysis with PECmd (9:52) Start Windows Prefetch timeline analysis (11:27) Start 7.7) Finding evidence of persistence mechanisms Available in days days after you enroll Analyzing Windows run keys with Registry Explorer and RegRipper (10:02) Start How to find evidence of persistence in startup folders (8:38) Start Windows Services overview and analysis (6:47) Start Detecting and analyzing malicious scheduled tasks (14:18) Start Persistence mechanisms analysis with Sysinternals Autoruns (5:30) Start 7.8) Uncover malicious activity with Windows event log analysis Available in days days after you enroll Windows event logs overview (11:00) Start Analyzing Windows event logs with EventLogExplorer and EvtxECmd (16:44) Start Windows Defender event log analysis (6:45) Preview Analyzing service installs using the System event log (4:54) Start Security event log and authentication events (10:11) Start Authentication events and logon IDs (8:20) Start PowerShell event logs overview (9:28) Start Analyzing malicious PowerShell events (15:55) Start Overview of the Sysmon event log and relevant event IDs (2:19) Start Detecting malicious events in Sysmon event logs (12:59) Start 8) Windows memory forensic analysis Available in days days after you enroll Setting up Volatility3 in the Ubuntu environment (7:42) Start Important files for memory analysis (8:40) Start Gathering Windows system information with Volatility3 (7:40) Start Update: If you ran the ART-attack script before July 9th!! Start Detecting suspicious Windows processes (10:40) Start Dumping processes from the memory (5:53) Start Detecting and analyzing injected DLLs (13:46) Start Identifying process owners and associated SIDs (4:37) Start Detecting and analyzing malicious registry key entries from memory (7:47) Start 9) Kitchen-Sink analysis with Super Timelines Available in days days after you enroll Super timeline analysis process and important requirements (4:43) Start Preparing tools and converting the disk image with QEMU (5:18) Start Memory timeline creation with Volatility3 (5:08) Start Creating a timeline of the disk image with Plaso tools and Log2Timeline (5:55) Start Merging timelines with mactime parser and creating a Super Timeline (5:54) Start Super Timeline overview with Timeline Explorer (5:32) Start Analyzing malicious activity using the Super Timeline (17:28) Start 10) Reporting Available in days days after you enroll Considerations and reporting types (5:33) Start 11) Final Available in days days after you enroll Wrap up and next steps (2:59) Start Show All Lectures .b-188042528-top { padding-top: 22.400000000000002px; } .b-188042528-bottom { padding-bottom: 22.400000000000002px; } .b-188042528-text_color { color: #36414D; } .b-188042528-gutter_width { --gutter-width: 24px; } .b-188042528-content_width { width: 960px; } .b-188042528-heading_color { color: #36414D; } .b-188042528-text_align