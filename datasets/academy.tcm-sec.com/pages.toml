description = """
Cyril H., Cybersec Padawan      “Practical Malware Analysis and Triage, another WAY-beyond-expectation installment in the TCM Academy library! The course progression is excellent, with practical, walk-along exercises in a majority of the videos. I particularly enjoy the rate-of-flow from Husky's pedagogical style -- it has a pristine blend of step-by-step instruction alongside a pace that deters distraction or boredom. Thanks Husky!”                                   David R., Cybersecurity Student      “It's a fantastic course packed to the brim with information. Everything is explained in a way that makes it very easy to understand. Instead of just spitting information at you, there are built-in challenges that give you an opportunity to put your understanding to the test. This is one if the highest quality courses I've taken in a while, and I couldn't be happier with it.”                                   Syed H., Security Engineer, DFIR      “The course curriculum is properly designed to take an analyst from the start till the end. I loved how Matt explained concepts to ensure everyone could be on the same playing field.… Should you get it? YES.”"""
