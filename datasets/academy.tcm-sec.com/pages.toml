full_description = '.b-180544177-top { padding-top: 33.6px; } .b-180544177-bottom { padding-bottom: 33.6px; } .b-180544177-text_color { color: #36414D; } .b-180544177-content_width { max-width: 590px; } .b-180544177-background_color { background-color: #F5F5F8; } .b-180544177-heading_text_color { color: #36414D; } .block__text .b-180544177-text_color { color: #36414D } .block__text .b-180544177-content_width { width: 590px; } .block__text .b-180544177-heading_text_color h1, .block__text .b-180544177-heading_text_color h2, .block__text .b-180544177-heading_text_color h3, .block__text .b-180544177-heading_text_color h4, .block__text .b-180544177-heading_text_color h5, .block__text .b-180544177-heading_text_color h6 { color: #36414D } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__text .block__text-wrapper h4{ margin-bottom: 9px; } .block__text .block__text-wrapper h5{ margin-bottom: 11px; } .block__text .block__text-wrapper h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-180544177-top { padding-top: 60px; } .b-180544177-bottom { padding-bottom: 60px; } } Privacy PolicyEffective Date: 01/01/2024Who we areOur website addresses are: https://tcm-sec.com for TCM Security’s Main Web Site https://certifications.tcm-sec.com for Certifications https://academy.tcm-sec.com for Academy https://exams.tcmsecurity.com – Exam Platform This Privacy Policy governs the manner in which all TCM Security web sites (collectively referred to as the "School") collect, use, maintain, and disclose information from users (referred to as “Visitors” or “Students”) of our websites and courses. This Privacy Policy applies to all websites and all courses offered by the School.Personal Information CollectionWe may collect personal identification information from users in various ways, including but not limited to when Visitors leave comments, Students enroll in a Course / Exam, subscribe to a newsletter, and in connection with other activities or resources we make available. Visitors may visit the sites anonymously, and personal identification information will only be collected if voluntarily provided.CommentsWhen visitors leave comments, we collect the data shown in the comments form, as well as the visitor’s IP address and browser user agent string, to help detect spam. An anonymized string from your email address may be provided to the Gravatar service. Gravatar’s privacy policy is available here: https://automattic.com/privacy/. After comment approval, your profile picture is visible in the context of your comment.MediaIf you upload images to the websites, avoid embedding location data (EXIF GPS). Visitors can download and extract location data from images uploaded on the site.Cookies Comments: If you leave a comment, you may opt-in to save your name, email, and website in cookies for convenience, so you don’t need to re-enter your details for future comments. These cookies last for one year. Login: If you visit the login page, we set a temporary cookie to determine if your browser accepts cookies. These cookies contain no personal data and are discarded when you close your browser. Logged In Users: When you log in, we set cookies to save your login information and screen display preferences. Login cookies last for two days, and screen options cookies last for one year. If you select "Remember Me," your login will persist for two weeks. If you log out, these cookies are removed. Content Creation: If you edit or publish an article, an additional cookie is saved in your browser, which includes the post ID of the article. It expires after one day. Embedded Content from Other WebsitesArticles on our websites may include embedded content (e.g., videos, images, articles). Embedded content from other websites behaves as if the visitor has visited the external site, which may collect data, use cookies, and track interactions.How We Use Collected InformationThe School may collect and use Students’ personal identification information for the following purposes: To improve customer service: The information you provide helps us respond to your customer service requests more efficiently. To personalize user experience: We may use aggregated information to understand how users interact with our websites and courses. To send periodic emails: We may use email addresses to send updates, respond to inquiries, and communicate relevant information about your orders or enrollment. Who We Share Your Data WithWe disclose your personal information to the following categories of recipients: To our service providers: We rely on trusted third-party service providers to process, improve, promote, and protect our websites and services, including storage of data, payment processing, and advertising. In the event of a change in control: Personal information may be disclosed in the course of a merger, restructuring, or sale of assets. As required by law: We may disclose personal information when necessary to comply with legal obligations or protect the rights, property, or safety of our users. At your direction: We may disclose personal information if requested or consented to by the user. How Long We Retain Your Data Comments: If you leave a comment, both the comment and its metadata are retained indefinitely. Registered Users: For users who register on our websites, we store personal information provided in their profiles. All users can see, edit, or delete their personal information (except their username). Website administrators can also access and edit this information. Legal Bases for Collecting and Using InformationA note here for those in the European Union about our legal grounds for processing information about you under EU data protection laws. Our use of your information is based on the grounds that: The use is necessary to fulfill our commitments to you under our Terms of Service or other agreements with you or is necessary to administer your account–for example, in order to enable access to our website on your device or charge you for a paid plan; or The use is necessary for compliance with a legal obligation; or The use is necessary to protect your vital interests or those of another person; or We have a legitimate interest in using your information–for example, to provide and update our Services, to improve our Services so that we can offer you an even better user experience, to safeguard our Services, to communicate with you, to measure, gauge, and improve the effectiveness of our advertising, and better understand user retention and attrition, to monitor and prevent any problems with our Services, and to personalize your experience; or You have given us your consent Your Rights Over Your DataIf you have an account or have left comments, you can request an exported file of the personal data we hold about you or request that we erase any personal data. This does not include any data required for administrative, legal, or security purposes.To initiate any action on your data, use the contact below. TCM will respond within a reasonable timeframe (30 days or less).[email protected] Where We Send Your DataVisitor comments may be checked through an automated spam detection service.Third-Party WebsitesOur websites may link to third-party services, partners, advertisers, and other external content. These third-party sites have their own privacy policies, and we are not responsible for their content or privacy practices.Changes to This Privacy PolicyThe School reserve the right to update this Privacy Policy at any time. We encourage users to review this page periodically for changes. Continued use of our services following any changes will signify acceptance of the revised policy.ExceptionsRequests for an exception to this Policy must be submitted to the CEO for approval.Violations & EnforcementAny known violations of this policy should be reported to the CEO. Violations of this policy can result in immediate withdrawal or suspension of system and network privileges and/or disciplinary action in accordance with company procedures up to and including termination of employment.'
