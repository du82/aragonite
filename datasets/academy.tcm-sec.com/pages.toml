een and (min-width: 768px) { .b-188042327-top { padding-top: 60px; } .b-188042327-bottom { padding-bottom: 60px; } } Course OverviewThis course focuses on Android and iOS Mobile Application Penetration testing. The course will demonstrate common techniques to extract sensitive data from Android and iOS Application such as API Keys, stored secrets, and firebase databases, and provide a solid foundation for continuing a career as a Mobile Application Penetration Tester. This course will cover the common methodologies and practices you can utilize to start Bug Bounty hunting mobile applications.Prerequisites & System RequirementsThe student should have: A basic understanding of Web Application or API-based penetration testing Some familiarity with Mobile Application platforms such as iOS and Android (like how to navigate to settings, install applications, etc.) is expected. For the Android section of this course the following device requirements will apply: Windows, Linux, or MacOS based machine 16 GB of RAM or more (to run virtual machines as well as emulated devices) At least 250GB of available storage For the iOS Section of this course the following device requirements will apply: MacOS-based Machine (Macbook, Mac Mini, etc.), or Linux-Based physical machine with preferably with 16 GB of RAM as well as at least 250GB of available storage Physical iPhone or iPad running iOS 16.x or less (for jailbreaking purposes) .b-188042328-top { padding-top: 33.6px; } .b-188042328-bottom { padding-bottom: 2.8000000000000003px; } .b-188042328-text_color { color: #36414D; } .b-188042328-content_width { max-width: 710px; } .b-188042328-background_color { background-color: #FFFFFF; } .b-188042328-heading_text_color { color: #36414D; } .block__text .b-188042328-text_color { color: #36414D } .block__text .b-188042328-content_width { width: 710px; } .block__text .b-188042328-heading_text_color h1, .block__text .b-188042328-heading_text_color h2, .block__text .b-188042328-heading_text_co