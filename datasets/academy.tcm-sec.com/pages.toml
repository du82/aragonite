0-top { padding-top: 60px; } .b-188042230-bottom { padding-bottom: 60px; } } Course Overview Linux 101 provides you with everything you need to know to start using Linux. This course was designed for those having no experience using Linux, but wanting to learn how to use it. The course is packed with all the content usually taught in an introductory university course, but without all the filler content of a university course. It contains essential, practical information gained from over 20 years of experience using Linux and Unix systems for daily work.System Requirements A computing environment (Windows, Linux, or Mac*) capable of running a virtual machine with at least 4GB or RAM and 20GB of disk space. *Note that new MacBook Pros with the M1 chip are unable to run virtual machines such as the ones demonstrated in this course. A willingness to dive into Linux! .b-188042231-top { padding-top: 22.400000000000002px; } .b-188042231-bottom { padding-bottom: 22.400000000000002px; } .b-188042231-text_color { color: #36414D; } .b-188042231-gutter_width { --gutter-width: 24px; } .b-188042231-content_width { width: 960px; } .b-188042231-heading_color { color: #36414D; } .b-188042231-text_alignment { text-align: left; } .b-188042231-background_color { background-color: #F5F5F5; } .b-188042231-image_border_radius { border-radius: 0px; } .block__image-with-text .b-188042231-text_color { color: #36414D; } .block__image-with-text.b-188042231-background_color { background-color: #F5F5F5; } .block__image-with-text .b-188042231-heading_color .block__image-with-text__inner__heading { color: #36414D; } .block__image-with-text .b-188042231-text_alignment { text-align: left; } .block__image-with-text__image.b-188042231-image_border_radius { border-radius: 0px; } .block__image-with-text .block__image-with-text__inner__heading h2{ margin-bottom: 2px; } .block__image-with-text .block__image-with-text__inner__heading h3{ margin-bottom: 5px; } .block__image-with-text .block__image-with-text