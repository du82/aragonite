or the 100% money-back guarantee, you must attend the entire course, and you must not have started any certification exam tied to the course. Requests under the satisfaction guarantee must be made within three (3) days of completion of the class. Requests under the satisfaction guarantee must be made in writing via an email sent to [email protected].5. Academic Honesty & Non-DisclosureAs the purchaser of or student taking an examination, the examination environment is made available to you for the sole purpose of certifying. You agree that you will not disclose, publish, reproduce, transmit, or make available, in part or in full, any portion of the examination environment or course materials by any means, to include, but not limited to, voice, electronic, cryptological, mechanical, etc., without the expressed written consent of TCM Security. These non-disclosure obligations extend beyond completion of any examinations.Examinee attests that they are the person who is taking the exam and agrees that at no time will they solicit assistance from others with their exam attempt. Examinee submits that they have provided us with correct and accurate registration information and all requirements for the credential and exam. Examinee agrees that any breach of the Academic Honesty Policy, including, but not limited to, cheating, providing support or assistance to another examinee, sharing exam environment information with third parties, etc., may result in (a) a failing examination grade and revocation of retake opportunities; (b) temporary or permanent ban from the TCM Security without refund; (c) revocation of the Practical Network Penetration Test certification ; or (d) Civil liability and/or criminal prosecution.6. Disclaimersa. TCM SECURITY DOES NOT GUARANTEE, REPRESENT, OR WARRANT THAT YOUR USE OF OUR SERVICES WILL BE UNINTERRUPTED OR ERROR-FREE. OUR PRODUCTS AND SERVICES ARE PROVIDED "AS IS" AND "AS AVAILABLE" FOR YOUR USE, WITHOUT WARRANTIES OF ANY KIND, EITHER EXPRESS