gin-bottom: 14px; } @media screen and (min-width: 768px) { .b-188042898-top { padding-top: 60px; } .b-188042898-bottom { padding-bottom: 60px; } } Course OverviewWelcome to the Governance, Risk, and Compliance (GRC) Analyst Master Class. This class assumes no prior background knowledge and is setup to give you a full scope understanding and the practical skills needed to be an effective GRC Analyst.Cybersecurity workforce development is focused on red team and blue team skills, but GRC is terribly underserved for training.This course fills that gap by offering practical application of risk, audit, policy development, and security awareness skills needed for modern GRC analysts.New Content Added September 2024! Login to the Academy to view the latest course updates, including: A discussion of the new NIST CSF 2.0 Audit Interview Guide .b-188042899-top { padding-top: 33.6px; } .b-188042899-bottom { padding-bottom: 2.8000000000000003px; } .b-188042899-text_color { color: #36414D; } .b-188042899-content_width { max-width: 710px; } .b-188042899-background_color { background-color: #FFFFFF; } .b-188042899-heading_text_color { color: #36414D; } .block__text .b-188042899-text_color { color: #36414D } .block__text .b-188042899-content_width { width: 710px; } .block__text .b-188042899-heading_text_color h1, .block__text .b-188042899-heading_text_color h2, .block__text .b-188042899-heading_text_color h3, .block__text .b-188042899-heading_text_color h4, .block__text .b-188042899-heading_text_color h5, .block__text .b-188042899-heading_text_color h6 { color: #36414D } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__text .block__text-wrapper h4{ margin-bottom: 9px; } .block__text .block__text-wrapper h5{ margin-bottom: 11px; } .block__text .block__text-wrapper h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-188042899-top { padding-top: 60px; } .b-188042899-bottom { padding-bottom: 5px; } } GRC Analyst Master Class Course Objectives .b-188042900-top { padding-top: 2.8000000000000003px; } .b-188042900-bottom { padding-bottom: 22.400000000000002px; } .b-188042900-text_color { color: #36414D; } .b-188042900-gutter_width { --gutter-width: 24px; } .b-188042900-content_width { width: 960px; } .b-188042900-heading_color { color: #36414D; } .b-188042900-text_alignment { text-align: left; } .b-188042900-background_color { background-color: #FFFFFF; } .b-188042900-image_border_radius { border-radius: 0px; } .block__image-with-text .b-188042900-text_color { color: #36414D; } .block__image-with-text.b-188042900-background_color { background-color: #FFFFFF; } .block__image-with-text .b-188042900-heading_color .block__image-with-text__inner__heading { color: #36414D; } .block__image-with-text .b-188042900-text_alignment { text-align: left; } .block__image-with-text__image.b-188042900-image_border_radius { border-radius: 0px; } .block__image-with-text .block__image-with-text__inner__heading h2{ margin-bottom: 2px; } .block__image-with-text .block__image-with-text__inner__heading h3{ margin-bottom: 5px; } .block__image-with-text .block__image-with-text__inner__heading h4{ margin-bottom: 9px; } .block__image-with-text .block__image-with-text__inner__heading h5{ margin-bottom: 11px; } .block__image-with-text .block__image-with-text__inner__heading h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-188042900-top { padding-top: 5px; } .b-188042900-bottom { padding-bottom: 40px; } .b-188042900-gutter_width .block__image-with-text__text-wrapper { width: calc(50% - 12px); margin-right: 12px; } .b-188042900-gutter_width div.block__image-with-text__image { width: calc(50% - 12px); margin-left: 12px; } } In this course, we will cover: An IT primer. While you don’t need to have prior IT experience, you will need to know some fundamental IT concepts to properly apply the GRC skills you learn. GRC as an information security capability. If you are going to be a GRC analyst you need to understand how the role fits into the larger information security office and how it interfaces with the business. Compliance and Audit work. A great starting point for any GRC analyst, we begin with why compliance exists and why businesses need it. We then deliver on the audit work around compliance and share a practical audit lab. Practical Security Awareness. An often undervalued skill, you will learn how to make effective security awareness content that engages your end user community and reduces cyber risk. You will use a collection of tools to develop a security awareness briefing in a lab. Cybersecurity risk. This is the bread and butter function of a GRC analyst and we spare no expense and going deep on this topic. You will learn what risk is and how to calculate it. We will assess risk in a lab to show you how you too can properly understand any business’s cybersecurity risk. Instructional Governance work. Governance is critical to adoption and business buy-in. This section will teach you about policies, procedures, and standards. We cap it off by writing a policy from scratch in real time so you can too! Getting a GRC Analyst Job. What good are these skills if you can’t get paid to use them. This section breaks down all the aspects of how to go about getting a GRC Analyst job. It’s important to note the lecture videos are a collection of produced “lecture” style vides, and livestream “in-the-moment” style videos. Each has its own strength, but all of them will deliver value and excellence in the ultimate goal of understanding and executing as a GRC Analyst! .b-188042901-top { padding-top: 33.6px; } .b-188042901-bottom { padding-bottom: 33.6px; } .b-188042901-text_color { color: #36414D; } .b-188042901-content_width { max-width: 710px; } .b-188042901-background_color { background-color: #F5F5F8; } .b-188042901-heading_text_color { color: #36414D; } .block__text .b-188042901-text_color { color: #36414D } .block__text .b-1880429