title = "Academy Live Workshops - TCM Security Academy | TCM Security, Inc."
description = """
Heath Adams      Heath Adams, also known as “The Cyber Mentor,” is the CEO of TCM Security. While Heath is an ethical hacker by trade, he also loves to teach! Heath has taught courses to over 1,000,000 students on multiple platforms, including TCM Academy, Udemy, YouTube, Twitch, and INE.Heath has held many certifications, including CISSP, PNPT, QSA, GSNA, OSCP, ECPTX, and eWPT. He also holds an MBA degree.Finally, Heath is also a husband, animal dad, tinkerer, and military veteran.                                  Alex Olsen      Alex is a Web Application Security specialist with experience working across multiple sectors, from single-developer applications all the way up to enterprise web apps with tens of millions of users. He enjoys building applications almost as much as breaking them and has spent many years supporting the shift-left movement by teaching developers, infrastructure engineers, architects, and anyone who would listen about cybersecurity.Alex holds a Master’s Degree in Computing, as well as the PNPT, CEH, and OSCP certifications."""
