 @media screen and (min-width: 768px) { .b-188042511-top { padding-top: 60px; } .b-188042511-bottom { padding-bottom: 60px; } } Course OverviewWelcome to this course on Practical Web Hacking. This course follows on from the Practical Bug Bounty course and will take you deeper into the world of finding and exploiting vulnerabilities in web applications. It’s recommended that you have completed the Practical Bug Bounty course or at least one year's worth of experience in hacking web applications before you take this course. In this course, you will develop a deeper understanding of how web attacks work, learn to craft custom payloads and build a methodology for finding and exploiting more complex vulnerabilities. The Practical Web Hacking Course Will Cover: How web applications work Authentication attacks Broken access control Server-side request forgery Advanced SQL injection attacks and NoSQL injection File inclusion XML External Entity Injection XSS and filter bypasses Attacking JSON Web Tokens Mass assignment Open redirects Race conditions Capstone challenge By the end of the course you will have a good understanding of how these attacks work, be able to find them in situations that are not immediately obvious or overlooked by automated scans and fuzzing. You will also be able to modify and craft custom payloads to bypass filters or achieve exploitation in unusual circumstances. Prerequisites & System Requirements A computer able to run a Linux virtual machine Completion of the Practical Bug Bounty course OR 1 years web hacking experience A positive attitude .b-188042512-top { padding-top: 33.6px; } .b-188042512-bottom { padding-bottom: 2.8000000000000003px; } .b-188042512-text_color { color: #36414D; } .b-188042512-content_width { max-width: 710px; } .b-188042512-background_color { background-color: #F5F5F8; } .b-188042512-heading_text_color { color: #36414D; } .block__text .b-188042512-text_color { color: #36414D } .block__text .b-188042512-content_width { width