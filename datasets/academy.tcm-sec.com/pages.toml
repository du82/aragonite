description = "In this course, you will learn how computers work at a low level, what happens to higher level code once it is compiled and understand what assembly code does."
full_description = ".b-188907047-top { padding-top: 22.400000000000002px; } .b-188907047-bottom { padding-bottom: 22.400000000000002px; } .b-188907047-alignment { text-align: center; } .b-188907047-content_width { max-width: 668px; } .b-188907047-image_overlay { opacity: 0.2; } .b-188907047-background_color { background-color: #000000; } .b-188907047-heading_text_color { color: #FFFFFF; } .b-188907047-button_border_radius { border-radius: 25px; } .b-188907047-subheading_text_color { color: #FFFFFF; } .banner .b-188907047-heading_text_color { color: #FFFFFF } .banner .b-188907047-subheading_text_color { color: #FFFFFF } .banner__button.b-188907047-button_border_radius { border-radius: 25; } @media screen and (min-width: 768px) { .b-188907047-top { padding-top: 40px; } .b-188907047-bottom { padding-bottom: 40px; } } .bl { width: 100%; } Assembly 101 Learn the language of computers and how to write your own Assembly code. Start Your Journey .b-188907048-top { padding-top: 33.6px; } .b-188907048-bottom { padding-bottom: 33.6px; } .b-188907048-text_color { color: #36414D; } .b-188907048-content_width { max-width: 700px; } .b-188907048-background_color { background-color: #F5F5F8; } .b-188907048-heading_text_color { color: #36414D; } .block__text .b-188907048-text_color { color: #36414D } .block__text .b-188907048-content_width { width: 700px; } .block__text .b-188907048-heading_text_color h1, .block__text .b-188907048-heading_text_color h2, .block__text .b-188907048-heading_text_color h3, .block__text .b-188907048-heading_text_color h4, .block__text .b-188907048-heading_text_color h5, .block__text .b-188907048-heading_text_color h6 { color: #36414D } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__text .block__text-wrapper h4{ margin-bottom: 9px; } .block__text .block__text-wrapper h5{ margin-bottom: 11px; } .block__text .block__text-wrapper h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-188907048-top { padding-top: 60px; } .b-188907048-bottom { padding-bottom: 60px; } } Course Overview Welcome to Assembly 101! This course will teach you how computers work down to the lowest level and how to write and read the human readable version of the 1s and 0s they speak in - Assembly. The course starts with an introduction on how computers perform computations using transistors, logic gates and machine code (1s and 0s), then moves on to writing your own assembly programs. Students will start writing x86-16 assembly in a beginner-friendly 8086 emulator to learn the fundamentals and then move on to writing modern x86-64 assembly. Key Topics Covered: How computers work at a low level Numbering systems: Decimal, Hex and Binary Setting up an assembly development environment x86 Registers, Flags and Pointers x86 Instruction Set Learning x86 fundamentals by writing x86-16 assembly programs Writing modern x86-64 assembly Explore memory safety and learn about writing shellcode and exploiting stack overflows. PrerequisitesProgramming 100: Fundamentals and Linux 100: Fundamentals, or equivalent knowledge!Students should have a basic understanding and familiarity of programming with any high-level language.System RequirementsStudents will need a computer capable of running and x86-64 virtual machine. The first half of the course will use an emulator that can be run on most architectures, however the second half of the course will focus on x86-64 development without the use of an emulator. .b-188907049-top { padding-top: 22.400000000000002px; } .b-188907049-bottom { padding-bottom: 22.400000000000002px; } .b-188907049-text_color { color: #36414D; } .b-188907049-gutter_width { --gutter-width: 24px; } .b-188907049-content_width { width: 960px; } .b-188907049-heading_color { color: #36414D; } .b-188907049-text_alignment { text-align: left; } .b-188907049-background_color { background-color: #FFFFFF; } .b-188907049-image_border_radius { border-radius: 0px; }