full_description = '''Comments Posted In Red Hat Enterprise Linux Microsoft ODBC Driver 18 , Need 32 bit driver Posted on 2025-02-11T17:23:27+00:00 Running Redhat 9.4, application is compiled in 32 bit because some libraries are 32 bit and can't be upgraded to 64 bit. Is there a 32 bit Microsoft ODBC Driver 18 package available? I have downloaded from Microsoft site and installed the 64 bit Microsoft ODBC Driver 18 package. The ODBC works natively to connect to SQL but the application needs a 32 bit ODBC driver. Any suggestions where we can download a 32 bit ODBC package? Joe JC Started 2025-02-11T17:23:27+00:00 by Joseph Cortese Newbie 11 points Responses pfElementsConfig = { cpComments: { auth: { type: 'cookie', name: 'rh_jwt' }, sourceId: 'ZGM6ZDQ0YzkwODYtYjMzYi00MzM5LThmZGEtZTE0NTcwMTRhMjg1', canonicalUrl: 'https://access.redhat.com', apiPath: '/api/comments', allowBestResponse: '1', allowPrivateResponse: '', rest: { "index": "https:\/\/access.redhat.com\/api\/comments\/ZGM6ZDQ0YzkwODYtYjMzYi00MzM5LThmZGEtZTE0NTcwMTRhMjg1", "create": "https:\/\/access.redhat.com\/api\/comments\/ZGM6ZDQ0YzkwODYtYjMzYi00MzM5LThmZGEtZTE0NTcwMTRhMjg1", "read": "https:\/\/access.redhat.com\/api\/comments\/ZGM6ZDQ0YzkwODYtYjMzYi00MzM5LThmZGEtZTE0NTcwMTRhMjg1\/{CID}", "update": "https:\/\/access.redhat.com\/api\/comments\/ZGM6ZDQ0YzkwODYtYjMzYi00MzM5LThmZGEtZTE0NTcwMTRhMjg1\/{CID}", "delete": "https:\/\/access.redhat.com\/api\/comments\/ZGM6ZDQ0YzkwODYtYjMzYi00MzM5LThmZGEtZTE0NTcwMTRhMjg1\/{CID}" }, pager: { enabled: 1, size: 20 } } }; /* Kick off comment initialization */ document.addEventListener('pfeconfig-query', function (e) { e.target.config = pfElementsConfig; });'''
