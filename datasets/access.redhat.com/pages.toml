full_description = "Tools Red Hat Customer Portal Labs Developed by Red Hat engineers to help you improve performance, troubleshoot issues, identify security problems, and optimize configuration. Featured Apps Convert2RHEL Helper This lab application will help users to validate their system’s eligibility for conversion into Red Hat Enterprise Linux (RHEL) and will redirect them to the steps for converting their existing Linux distributions, such as CentOS, Oracle Linux, AlmaLinux, or Rocky Linux, into RHEL. Go to App Systemd Unit Generator This application is designed to assist you in generating both systemd service unit and timer files. It simplifies the process by allowing you to create these configurations based on your specific requirements and in turn help in streamlining system management tasks. Go to App Red Hat Out Of Memory Analyzer OOM Analyzer is designed to analyze and interpret OOM messages from the Linux kernel. Go to App All Labs Showing 46 of 46 Labs All Labs Configuration Deployment Security Troubleshoot All Products ( 46 ) Red Hat Enterprise Linux (28) Red Hat OpenShift Container Platform (5) Red Hat OpenShift Data Foundation (3) Red Hat Ansible Automation Platform (2) Red Hat OpenShift Service on AWS (1) Others (3) Red Hat Satellite (1) Red Hat Virtualization (1) Red Hat Ceph Storage (1) Red Hat JBoss Enterprise Application Platform (2) Convert2RHEL Helper This lab application will help users to validate their system’s eligibility for conversion into Red Hat Enterprise Linux (RHEL) and will redirect them to the steps for converting their existing Linux distributions, such as CentOS, Oracle Linux, AlmaLinux, or Rocky Linux, into RHEL. Go to App Systemd Unit Generator This application is designed to assist you in generating both systemd service unit and timer files. It simplifies the process by allowing you to create these configurations based on your specific requirements and in turn help in streamlining system management tasks. Go to App Red Hat Out Of Memory Analyzer OOM Analyzer is designed to analyze and interpret OOM messages from the Linux kernel. Go to App OpenShift Packet Capture Helper OCPCH simplifies packet capturing within an OpenShift cluster. With an intuitive interface, it allows you to easily choose the Container Network Interface (CNI) and network flow, helping you efficiently identify the best points for capturing packets.This tool is invaluable during troubleshooting and network monitoring within your OpenShift environment. Go to App Postfix Configuration Helper This application is designed to help you to configure and troubleshoot some of the Postfix Issues reported on Red Hat Enterprise Linux. Go to App Red Hat OpenShift Network Calculator This helps you design your OpenShift cluster network during deployment and scaling phases. It resolves common problems related to cluster networking, displays network conflict items and provides output in a convenient JSON format. Go to App SSH Vulnerability Helper This application is designed to help you to mitigate some of the known ssh vulnerabilities reported for Red Hat Enterprise Linux 7, 8 and 9. Go to App Red Hat OpenShift Data Foundation Recovery Calculator This calculator provides an estimation for recovery time based on the number of disks, failure domain, disk size and network. Go to App Ansible Automation Platform Inventory File Generator This application will allow you to create the Ansible Automation Platform ‘inventory’ file, which is the basis for any installation. With zero knowledge, we will guide you through a number of questions so you can select your preferences. Go to App Red Hat OpenShift Container Platform Operator Update Information Checker This application is designed for customers to find out the update information of OpenShift Operator. Go to App Ansible Automation Platform Upgrade Assistant This app is designed to help you upgrade your Ansible Automation Platform to a newer version. Go to App Red Hat OpenShift Data Foundation Supportability and Interoperability Checker This application is designed to help you to check the supportability and interoperability of Red Hat OpenShift Data Foundation 4.X. Go to App ODF Sizing Tool The purpose of the ODF Sizing Tool is to help architects design ODF configurations for OCP clusters. Go to App Red Hat OpenShift Container Platform Update Graph Provides a visual representation of the OpenShift Update Graph by channel and a way to represent updates from a version (your current OCP version) to a newer version. Go to App Red Hat Product Errata Advisory Checker This application helps you retrieve information of Red Hat product errata advisories. Go to App Kickstart Converter This application will convert an earlier version of Red Hat Enterprise Linux Kickstart file into one that can be used to install a later version of Red Hat Enterprise Linux, such as RHEL7 -> RHEL8, RHEL 9、RHEL8 -> RHEL9 Go to App OpenShift Limits Calculator This application is setup to help minimize and expedite the process of opening the correct support and quota request with supported cloud providers, to ensure a smooth OpenShift 4.x install experience. Go to App Red Hat CVE Checker This application helps you retrieve information of given CVEs. Go to App Network Teaming Helper This app is designed to help you configure network teaming. The app will generate a script for you to configure network teaming based on the information you provided. Go to App Red Hat Satellite Upgrade Helper This app is designed to help you upgrade your Red Hat Satellite 6 to a newer version. Go to App Red Hat Virtualization Upgrade Helper Upgrade Red Hat Virtualization to a later version. Go to App Red Hat Product Certificates The Red Hat Product Certificates application helps you retrieve and install product certificate files. Go to App RHEL Tuner for Oracle This app generates a script that sets the tuning parameter in the operating system, which improves Oracle’s performance. Go to App Red Hat Virtualization Agent (virt-who) Configuration Helper This application requests information about your virt-who usage and generates a configuration file based on the answers. It also provides instructions for updating your virt-who configuration. Go to App Red Hat I/O Usage Visualizer Red Hat I/O Usage Visualizer displays a visualization of the I/O device usage statistics captured by the sar utility. Go to App AD Integration Helper (Samba FS - winbind) This tool helps you connect a Red Hat Enterprise Linux system to an Active Directory server by generating Samba Winbind configuration. Basic information of Active Directory server is needed and a script will be generated. The script will config Samba, NSS and PAM for you. Go to App Red Hat Memory Analyzer Red Hat Memory Analyzer visualizes memory usage on your system based on information captured by the SAR utility. Go to App Packet capture syntax generator The Packet capture syntax generator application will generate a tcpdump command to capture network packets. Go to App DNS Helper The DNS Helper tool provides assistance with configuring different types of DNS servers. The tool works by collecting specifications regarding the RHEL version and DNS server type, then generates a bash script to automatically create and configure the server. Go to App RHEL Backup and Restore Assistant This application introduces the most frequently-used backup/restore tools provided in Red Hat Enterprise Linux and helps you understand the common usage of each backup/restore tool by examples and how to choose an appropriate tool for a specific scenario. Go to App Rescue Mode Assistant Rescue Mode Assistant helps customers to reset root password, generate sosreport, perform a filesystem check(fsck), reinstall GRUB, rebuild the Initial Ramdisk Image and reduce the size of the root file system in/through the rescue mode of Red Hat Enterprise Linux. Go to App Ceph Placement Groups (PGs) per Pool Calculator The Ceph PGs (Placement Groups) per Pool Calculator application helps you: 1. Calculate suggested PG Count per pool and total PG Count in Ceph. 2. Generate commands that create pools. Go to App iSCSI Helper The iSCSI helper tool simplifies configuring an iSCSI target (server) or initiator (client). It handles the different configurations required for RHEL 5.4 and later versions. Go to App NFS Helper Generate a configuration script for a new NFS server or client. Go to App NTP Configuration This application steps you through a guide that generates a script for setting up NTP (Network Time Protocol) clients and servers using ntpd or chronyd. Go to App Red Hat Enterprise Linux Upgrade Helper This application helps you upgrade your Red Hat Enterprise Linux (RHEL) 6 into RHEL 7, RHEL 7 into RHEL 8 and RHEL 8 into RHEL 9. The minor release number for the upgrade is different upon the architecture. Go to App Yum Repository Configuration Helper Set up a Yum repository to be used by the local machine or remote ones. Go to App Multipath Helper Create optimal multipath configurations for Red Hat Enterprise Linux 5, 6, 7, 8 or 9 that are tailored to meet specific deployment goals. Go to App VNC Configurator Install and configure VNC server on your Red Hat Enterprise Linux Go to App Registration Assistant A simple guide to registering Red Hat Enterprise Linux systems. Go to App Kickstart Generator Create optimal Kickstart configurations for Red Hat Enterprise Linux 5, 6, 7, 8 or 9 that are tailored to meet specific deployment goals. Go to App Network Bonding Helper Configure two or more network interfaces to act as one “bonded” interface, simultaneously increasing the bandwidth and providing redundancy. Go to App Kernel Oops Analyzer Diagnose kernel crash issue. Go to App Kdump Helper Configure Kdump to dump vmcores Go to App JVM Options Configuration Tool Optimize your JVM tuning based on your workload and environment. Go to App Load Balancer Configuration Tool Plug in information about your Apache and JBoss configuration and get sane baseline configuration files. Go to App About Labs Red Hat Customer Portal Labs are built on OpenShift Container Platform , enabling continuous delivery and innovation. We invite you to try out these tools and tell us what you think. As our customer community collaborates and offers feedback, these applications will grow and change quickly."
