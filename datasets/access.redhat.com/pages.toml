["https://access.redhat.com/discussions/7105687"]
title = "subscription-manager fails  - No such file or directory: '/etc/pki/consumer/key.pem' - Red Hat Customer Portal"
description = "Image: RHEL 9.5 UBI image is deployed via Docker-Desktop Problem: The /etc/pki/consumer directory is always empty. i.e., there isn't a cert.pem or a key.pem. I've attempted other images but each lead to the same results. Any guidance would be appreciated! As the UBI images don't necessarily need to register to subscription-manager to work, a registration is really not"
full_description = '''Comments Posted In Red Hat Enterprise Linux for x86_64 Tags rhel_9 subscription_management subscription-manager fails - No such file or directory: '/etc/pki/consumer/key.pem' Posted on 2025-01-31T02:34:36+00:00 Image: RHEL 9.5 UBI image is deployed via Docker-Desktop Problem: The /etc/pki/consumer directory is always empty. i.e., there isn't a cert.pem or a key.pem. I've attempted other images but each lead to the same results. Any guidance would be appreciated! As the UBI images don't necessarily need to register to subscription-manager to work, a registration is really not necessary unless additional repo's, etc.. are needed. In my case, I'm attempting to evaluate eBPF so there are quite a few non-standard packages I need and building them outright has been met with its own set of challenges. I've considered ZScaler and this may still be an issue but I seem to have some connectivity to the subscription-manager though the logs I've analyzed could be misleading. Note that I've attempted the register with both the the username/password method as well as the activation key and org. Each lead to the same result. sh-5.1# subscription-manager register --activationkey activation-key-xxxxx --org xxxxxxxxx Error loading certificate: [Errno 2] No such file or directory: '/etc/pki/consumer/cert.pem' I've also noticed that a NoValidEntitlement error is raised and therefore have spent time in the Hybrid Cloud Console as well as the customer portal but wasn't able to identify any issues there. Note that /etc/pki/entitlement is also empty but I've focused on the lack of consumer cert as that's what's being called out in the errors. I've been unable to determine where the certs/keys will be populated from. I have found the product ones. In the documentation I've read that the certs/keys will be populated during subscription registration but that seems suspect as it looks like the cert is needed to register. ---- Some tests and logs follow ---- openssl test: sh-5.1# openssl s_client -connect subscription.rhsm.redhat.com:443 </dev/null 2>/dev/null | openssl x509 -text Could not find certificate from rhsm.log: 2025-01-31 01:53:26,672 [DEBUG] subscription-manager:78:MainThread @https.py:57 - Using standard libs to provide httplib and ssl 2025-01-31 01:53:26,803 [DEBUG] subscription-manager:78:MainThread @plugins.py:592 - loaded plugin modules: [] 2025-01-31 01:53:26,803 [DEBUG] subscription-manager:78:MainThread @plugins.py:593 - loaded plugins: {} 2025-01-31 01:53:26,803 [DEBUG] subscription-manager:78:MainThread @identity.py:152 - Loading consumer info from identity certificates. 2025-01-31 01:53:26,803 [DEBUG] subscription-manager:78:MainThread @identity.py:166 - Reload of consumer identity cert /etc/pki/consumer/cert.pem raised an exception with msg: [Errno 2] No such file or directory: '/etc/pki/consumer/key.pem' 2025-01-31 01:53:26,813 [DEBUG] subscription-manager:78:MainThread @cli.py:365 - X-Correlation-ID: c2ed289756494170b55f7946071561ee 2025-01-31 01:53:26,813 [DEBUG] subscription-manager:78:MainThread @cli.py:244 - Client Versions: {'subscription-manager': '1.29.42-1.el9'} 2025-01-31 01:53:26,813 [DEBUG] subscription-manager:78:MainThread @connection.py:239 - Environment variable NO_PROXY= will be used 2025-01-31 01:53:26,813 [DEBUG] subscription-manager:78:MainThread @connection.py:623 - Creating new BaseRestLib instance 2025-01-31 01:53:26,813 [DEBUG] subscription-manager:78:MainThread @connection.py:365 - Connection built: host=subscription.rhsm.redhat.com port=443 handler=/subscription auth=identity_cert ca_dir=/etc/rhsm/ca/ insecure=False 2025-01-31 01:53:26,813 [DEBUG] subscription-manager:78:MainThread @connection.py:239 - Environment variable NO_PROXY= will be used 2025-01-31 01:53:26,813 [DEBUG] subscription-manager:78:MainThread @connection.py:623 - Creating new BaseRestLib instance 2025-01-31 01:53:26,813 [DEBUG] subscription-manager:78:MainThread @connection.py:365 - Connection built: host=subscription.rhsm.redhat.com port=443 handler=/subscription auth=none 2025-01-31 01:53:26,813 [DEBUG] subscription-manager:78:MainThread @cli.py:244 - Client Versions: {'subscription-manager': '1.29.42-1.el9'} 2025-01-31 01:53:26,814 [DEBUG] subscription-manager:78:MainThread @cli.py:218 - Consumer Identity name=None uuid=None 2025-01-31 01:53:26,814 [DEBUG] subscription-manager:78:MainThread @cli.py:218 - Consumer Identity name=None uuid=None 2025-01-31 01:53:26,815 [DEBUG] subscription-manager:78:MainThread @connection.py:239 - Environment variable NO_PROXY= will be used 2025-01-31 01:53:26,815 [DEBUG] subscription-manager:78:MainThread @connection.py:623 - Creating new BaseRestLib instance 2025-01-31 01:53:26,815 [DEBUG] subscription-manager:78:MainThread @connection.py:365 - Connection built: host=subscription.rhsm.redhat.com port=443 handler=/subscription auth=basic username=sgar5067 2025-01-31 01:53:26,815 [DEBUG] subscription-manager:78:MainThread @connection.py:1139 - Making request: GET /subscription/users/sgar5067/owners 2025-01-31 01:53:26,815 [DEBUG] subscription-manager:78:MainThread @connection.py:756 - Creating new connection 2025-01-31 01:53:26,817 [DEBUG] subscription-manager:78:MainThread @connection.py:726 - Loaded CA certificates from /etc/rhsm/ca/: redhat-entitlement-authority.pem, redhat-uep.pem 2025-01-31 01:53:27,418 [ERROR] subscription-manager:78:MainThread @cli.py:71 - Error during registration: TLS/SSL connection has been closed (EOF) (_ssl.c:1147) 2025-01-31 01:53:27,418 [ERROR] subscription-manager:78:MainThread @cli.py:72 - TLS/SSL connection has been closed (EOF) (_ssl.c:1147) Traceback (most recent call last): File "/usr/lib64/python3.9/site-packages/subscription_manager/cli_command/register.py", line 351, in do_command owner_key = service.determine_owner_key( File "/usr/lib64/python3.9/site-packages/rhsmlib/services/register.py", line 238, in determine_owner_key owners = self.cp.getOwnerList(username) File "/usr/lib64/python3.9/site-packages/rhsm/connection.py", line 1840, in getOwnerList owners = self.conn.request_get(method, description=("Fetching organizations")) File "/usr/lib64/python3.9/site-packages/rhsm/connection.py", line 1365, in request_get result: Dict[str, Any] = self._request( File "/usr/lib64/python3.9/site-packages/rhsm/connection.py", line 1153, in _request result, response = self._make_request( File "/usr/lib64/python3.9/site-packages/rhsm/connection.py", line 1089, in _make_request raise NoValidEntitlement( File "/usr/lib64/python3.9/site-packages/rhsm/connection.py", line 1041, in _make_request conn = self._create_connection(cert_file=cert_file, key_file=key_file) File "/usr/lib64/python3.9/site-packages/rhsm/connection.py", line 804, in _create_connection conn.connect() File "/usr/lib64/python3.9/http/client.py", line 1454, in connect self.sock = self._context.wrap_socket(self.sock, File "/usr/lib64/python3.9/ssl.py", line 501, in wrap_socket return self.sslsocket_class._create( File "/usr/lib64/python3.9/ssl.py", line 1074, in _create self.do_handshake() File "/usr/lib64/python3.9/ssl.py", line 1343, in do_handshake self._sslobj.do_handshake() SG Started 2025-01-31T02:34:36+00:00 by Scott Garcia Newbie 5 points Responses pfElementsConfig = { cpComments: { auth: { type: 'cookie', name: 'rh_jwt' }, sourceId: 'ZGM6NWQ1ZGIzMGUtNDA5MS00NDE0LWE0YjctMWY0Y2VhNGM3NThk', canonicalUrl: 'https://access.redhat.com', apiPath: '/api/comments', allowBestResponse: '1', allowPrivateResponse: '', rest: { "index": "https:\/\/access.redhat.com\/api\/comments\/ZGM6NWQ1ZGIzMGUtNDA5MS00NDE0LWE0YjctMWY0Y2VhNGM3NThk", "create": "https:\/\/access.redhat.com\/api\/comments\/ZGM6NWQ1ZGIzMGUtNDA5MS00NDE0LWE0YjctMWY0Y2VhNGM3NThk", "read": "https:\/\/access.redhat.com\/api\/comments\/ZGM6NWQ1ZGIzMGUtNDA5MS00NDE0LWE0YjctMWY0Y2VhNGM3NThk\/{CID}", "update": "https:\/\/access.redhat.com\/api\/comments\/ZGM6NWQ1ZGIzMGUtNDA5MS00NDE0LWE0YjctMWY0Y2VhNGM3NThk\/{CID}", "delete": "https:\/\/access.redhat.com\/api\/comments\/ZGM6NWQ1ZGIzMGUtNDA5MS00NDE0LWE0YjctMWY0Y2VhNGM3NThk\/{CID}" }, pager: { enabled: 1, size: 20 } } }; /* Kick off comment initialization */ document.addEventListener('pfeconfig-query', function (e) { e.target.config = pfElementsConfig; });'''
