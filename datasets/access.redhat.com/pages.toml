full_description = '''Translated message A translation of this page exists in English. Red Hat 輸出コンプライアンス製品および技術マトリックス 更新 2025-02-04T17:51:25+00:00 - Japanese English Japanese Chinese 輸出コンプライアンス/関税情報 Red Hat 製品マトリックスおよび以下の情報は、米国輸出管理規則 (EAR)、その他の米国輸出法、または米国関税率表 (HTS) を置き換えることを目的としたものではなく、これらの法律と併せて、Red Hat 製品の輸出入を支援するために、当社のパートナーおよびお客様への便宜上提供されているものです。輸出者は、EAR、その他の米国輸出法、および HTS の要件に従って、Red Hat 製品を輸出する責任を負います。最終需要者、最終用途、最終仕向国によって、輸出ライセンス要件が異なる場合があります。すべての輸出規制品目分類番号 (ECCN)、HTS 番号、ライセンス認可情報は、予告なく変更される場合があります。Red Hat 製品に何らかの変更を加えると、分類は無効になります。輸出者は、このような情報を確認し、現在適用される規制を遵守することを義務付けられています。Red Hat 製品を輸出する場合、米国商務省産業安全保障局、米国輸出管理規則 (EAR)、その他の米国輸出法の要件を遵守する責任を負うことになります。すべての輸出に関する情報は「現状のまま」提供されます。Red Hat は、本サイトに含まれる情報が正確、最新、または完全であることについて、いかなる保証も表明も行いません。輸出者は、米国の輸出法および規制における現行の適用要件を遵守することを義務付けられています。かかる情報の使用は、すべて自己責任で行うものであり、Red Hat に対する償還請求権はありません。Red Hat は、いかなる目的であれ、かかる情報を使用または信頼した結果としてお客様が被った直接的、結果的、偶発的、またはその他の損害について、一切責任を負いません。 禁輸対象国/地域 Red Hat のソフトウェアや技術データは、EAR の規制または米国の制裁規制を受けている禁輸対象国/地域 (現時点でキューバ、イラン、北朝鮮、シリア、ウクライナのクリミア地域) に直接的または間接的に輸出、再輸出、あるいは移転することはできません。禁輸対象国/地域のリストは、変更される可能性がある点に注意してください。 拒否者リスト/事業体リスト Red Hat のソフトウェアや技術データは、禁輸対象国/地域に加え、米国政府によって輸出活動への参加が禁止されている個人または事業体に直接的または間接的に輸出、再輸出、あるいは移転することはできません。拒否される個人/事業体には、米国商務省の拒否者リスト/事業体リスト、米国財務省外国資産管理局 (OFAC) 特別指定国民リストに記載されている個人や事業体などが含まれますが、これに限定されるものではありません。 詳細は、 輸出管理製品マトリックス を参照してください。 Product(s) Other Article Type General Comments pfElementsConfig = { cpComments: { auth: { type: 'cookie', name: 'rh_jwt' }, sourceId: 'ZGM6NWJlZWUzYmUtMDZjMS00ZGNmLWIwNWYtMTI5NzNmMWJhYjZk', canonicalUrl: 'https://access.redhat.com', apiPath: '/api/comments', allowBestResponse: '', allowPrivateResponse: '1', rest: { "index": "https:\/\/access.redhat.com\/api\/comments\/ZGM6NWJlZWUzYmUtMDZjMS00ZGNmLWIwNWYtMTI5NzNmMWJhYjZk", "create": "https:\/\/access.redhat.com\/api\/comments\/ZGM6NWJlZWUzYmUtMDZjMS00ZGNmLWIwNWYtMTI5NzNmMWJhYjZk", "read": "https:\/\/access.redhat.com\/api\/comments\/ZGM6NWJlZWUzYmUtMDZjMS00ZGNmLWIwNWYtMTI5NzNmMWJhYjZk\/{C