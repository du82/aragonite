title = "systemd tomcat.service exit code status=143  - Red Hat Customer Portal"
description = 'Anyone seen this issue below on Red Hat Enterprise Linux Server 7.2 ? ExecStop=/opt/pacer/work/bin/shutdown.sh (code=exited, status=1/FAILURE) (code=exited, status=143) Tomcat.service starts fine, however, when i stop the service with "systemctl stop tomcat.service" I see the exit status code 143. I have added the StatusExitStatus=143 in /etc/systemd/system/tomcat.service and'
full_description = '''Comments Posted In Red Hat Enterprise Linux Tags systemd systemd tomcat.service exit code status=143 Latest response 2017-06-30T09:38:50+00:00 Anyone seen this issue below on Red Hat Enterprise Linux Server 7.2 ? ExecStop=/opt/pacer/work/bin/shutdown.sh (code=exited, status=1/FAILURE) (code=exited, status=143) Tomcat.service starts fine, however, when i stop the service with "systemctl stop tomcat.service" I see the exit status code 143. I have added the StatusExitStatus=143 in /etc/systemd/system/tomcat.service and works fine but I think it's just a work around for now. SG Started 2017-06-06T15:35:51+00:00 by Shisheer Guragain Expert 825 points Responses pfElementsConfig = { cpComments: { auth: { type: 'cookie', name: 'rh_jwt' }, sourceId: 'ZGM6Njk2NDVmMzMtMzAzNy00MDM4LWI4MzEtNWYzMTM0MzkzNjM3', canonicalUrl: 'https://access.redhat.com', apiPath: '/api/comments', allowBestResponse: '1', allowPrivateResponse: '', rest: { "index": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzMtMzAzNy00MDM4LWI4MzEtNWYzMTM0MzkzNjM3", "create": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzMtMzAzNy00MDM4LWI4MzEtNWYzMTM0MzkzNjM3", "read": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzMtMzAzNy00MDM4LWI4MzEtNWYzMTM0MzkzNjM3\/{CID}", "update": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzMtMzAzNy00MDM4LWI4MzEtNWYzMTM0MzkzNjM3\/{CID}", "delete": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzMtMzAzNy00MDM4LWI4MzEtNWYzMTM0MzkzNjM3\/{CID}" }, pager: { enabled: 1, size: 20 } } }; /* Kick off comment initialization */ document.addEventListener('pfeconfig-query', function (e) { e.target.config = pfElementsConfig; });'''
