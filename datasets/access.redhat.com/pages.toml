title = "Login to RHEL 9 laptop with MFA (google authenticator) not working - Red Hat Customer Portal"
description = "Hello all, I would like our users to login to their RHEL 9 laptops using MFA. I'm trying to implement MFA using Google Authenticator. I've tried to find information on how to do this. Everything I've read shows how to implement this for SSH. I've failed trying to do this. I've installed google authenticator. These are the steps I've done to try to implement this with no"
full_description = '''Comments Posted In Red Hat Enterprise Linux Login to RHEL 9 laptop with MFA (google authenticator) not working Posted on 2025-02-03T14:28:45+00:00 Hello all, I would like our users to login to their RHEL 9 laptops using MFA. I'm trying to implement MFA using Google Authenticator. I've tried to find information on how to do this. Everything I've read shows how to implement this for SSH. I've failed trying to do this. I've installed google authenticator. These are the steps I've done to try to implement this with no success. sudo google-authenticator sudo nano /etc/pam.d/login Add the Google Authenticator line after the auth lines that handle password authentication: auth substack password-auth auth required pam_google_authenticator.so sudo nano /etc/pam.d/gdm-password Instead of adding the Google Authenticator line at the top, try adding it after the auth lines that handle password authentication. For example: auth substack password-auth auth required pam_google_authenticator.so When I reboot, I enter my ID, password and it prompts me for the code from Google Authenticator. I enter this information and it keeps coming up with password invalid error. YES, I am entering the correct password. Any other steps I need to do? Thanks ma Started 2025-02-03T14:28:45+00:00 by michael adamosky Newbie 5 points Responses pfElementsConfig = { cpComments: { auth: { type: 'cookie', name: 'rh_jwt' }, sourceId: 'ZGM6YmFlMmYzY2UtNWYwNS00YjI1LThlMzMtMjFmZmQ3ZTUwMzNm', canonicalUrl: 'https://access.redhat.com', apiPath: '/api/comments', allowBestResponse: '1', allowPrivateResponse: '', rest: { "index": "https:\/\/access.redhat.com\/api\/comments\/ZGM6YmFlMmYzY2UtNWYwNS00YjI1LThlMzMtMjFmZmQ3ZTUwMzNm", "create": "https:\/\/access.redhat.com\/api\/comments\/ZGM6YmFlMmYzY2UtNWYwNS00YjI1LThlMzMtMjFmZmQ3ZTUwMzNm", "read": "https:\/\/access.redhat.com\/api\/comments\/ZGM6YmFlMmYzY2UtNWYwNS00YjI1LThlMzMtMjFmZmQ3ZTUwMzNm\/{CID}", "update": "https:\/\/access.redhat.com\/api\/c