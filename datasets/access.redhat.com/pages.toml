description = "Red Hat OpenShift Pipelines is a cloud-native, continuous integration and continuous delivery (CI/CD) solution based on Kubernetes resources. It uses Tekton building blocks to automate deployments across multiple platforms by abstracting away the underlying implementation details."
full_description = 'Red Hat OpenShift Container PlatformRed Hat® OpenShift® Container Platform is a consistent hybrid cloud foundation for building and scaling containerized applications. Red Hat OpenShift is trusted by thousands of customers in every industry to deliver business-critical applications, whether migrating existing workloads to the cloud or building new experiences for customers. DownloadEcosystem CatalogIncluded with Red Hat OpenShift Container PlatformRed Hat OpenShift PipelinesRed Hat OpenShift Pipelines is a cloud-native, continuous integration and continuous delivery (CI/CD) solution based on Kubernetes resources. It uses Tekton building blocks to automate deployments across multiple platforms by abstracting away the underlying implementation details.ResourcesLearn about Red Hat OpenShift Container PlatformProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadRed Hat OpenShift GitOpsRed Hat OpenShift GitOps uses Argo CD, an open-source declarative tool, for the continuous integration and continuous deployment (CI/CD) of cloud native applications and to maintain cluster resources. It implements Argo CD as a controller so that it continuously monitors application definitions and configurations defined in a Git repository.ResourcesLearn about Red Hat OpenShift Container PlatformProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadRed Hat OpenShift ServerlessOpenShift Serverless provides Kubernetes native building blocks that enable developers to create and deploy serverless, event-driven applications on OpenShift Container Platform, without having to manage servers.ResourcesLearn about Red Hat OpenShift Container PlatformProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadBuilds for Red Hat OpenShiftBuilds for Red Hat OpenShift is an extensible build framework based on the Shipwright project, which you can use to build container images on an OpenShift Container Platform cluster. You can build container images from source code and Dockerfiles by using image build tools, such as Source-to-Image (S2I) and Buildah.ResourcesLearn about Red Hat OpenShift Container PlatformProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadBrowse the latest documentationselect a versionSelect a version4.174.164.154.144.134.124.114.104.94.84.74.64.54.44.34.24.13.113.103.93.73.63.53.43.33.23.13.02AboutGetting StartedInstallation overviewInstallUpdating clustersUpgradeAuthentication and authorizationConfigureMigrating from version 3 to 4MigrateBackup and restoreManageCLI toolsReferenceIntroduction to VirtualizationVirtualizationView all product documentationLatest security advisoriesSeverityAdvisorySynopsisDateSeverity NoneAdvisory(RHBA-2025:1482) updated RHEL-8 based Middleware Containers container imagesSynopsis updated RHEL-8 based Middleware Containers container imagesDate2025-02-13T19:07:25ZSeverity NoneAdvisory(RHBA-2025:1438) updated amq7/amq-broker-rhel8-operator-bundle container imageSynopsis updated amq7/amq-broker-rhel8-operator-bundle container imageDate2025-02-13T14:36:56ZSeverity NoneAdvisory(RHBA-2025:1435) updated RHEL-8 based Middleware Containers container imagesSynopsis updated RHEL-8 based Middleware Containers container imagesDate2025-02-13T14:22:09ZSeverity NoneAdvisory(RHBA-2025:1117) OpenShift Container Platform 4.13.55 OLM Operators metadata updateSynopsis OpenShift Container Platform 4.13.55 OLM Operators metadata updateDate2025-02-13T03:28:24ZSeverity NoneAdvisory(RHBA-2025:1243) OpenShift Container Platform 4.12.73 OLM Operators metadata updateSynopsis OpenShift Container Platform 4.12.73 OLM Operators metadata updateDate2025-02-13T02:59:37ZView all security advisoriesView all CVEsView all errataTop resourcesKnowledgebaseAccess articles and solutions to find answers to your questions.TroubleshootingC