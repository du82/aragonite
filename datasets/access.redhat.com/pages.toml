full_description = '''Comments Posted In Red Hat Enterprise Linux Postfix TLS connection Posted on 2025-01-31T21:03:57+00:00 I am trying to use TLS for inbound emails relay. It works on unencrypted emails, but when using TLS, I am getting errors: AutomatedQITReport.sendFailureNotificationEmail: System.Net.Mail.SmtpException: Client does not have permission to submit mail to this server. The server response was: 4.7.0 TLS not available due to local problem when I tried: openssl s_client -starttls smtp -connect server-test.domain:587 Connecting to 10.10.10.8 CONNECTED(00000003) 00EE19CBE87F0000:error:0A00010B:SSL routines:tls_validate_record_header:wrong version number:ssl/record/methods/tlsany_meth.c:80: no peer certificate available No client certificate CA names sent SSL handshake has read 274 bytes and written 314 bytes Verification: OK New, (NONE), Cipher is (NONE) This TLS version forbids renegotiation. Compression: NONE Expansion: NONE No ALPN negotiated Early data was not sent Verify return code: 0 (ok) On the log: [root@server-test log]# cat /var/log/maillog Jan 31 15:51:25 server-test postfix/smtpd[100729]: warning: Both smtpd_tls_chain_files and one or more of the legacy smtpd_tls_cert_file, smtpd_tls_eccert_file or smtpd_tls_dcert_file are non-empty; the legacy parameters will be ignored Jan 31 15:51:25 server-test postfix/smtpd[100729]: warning: error loading chain from /etc/pki/tls/certs/server-test.pem: key not first Jan 31 15:51:25 server-test postfix/smtpd[100729]: warning: error loading private keys and certificates from: /etc/pki/tls/certs/server-test.pem: disabling TLS support Jan 31 15:51:25 server-test postfix/smtpd[100729]: connect from server-test.nj.core.him[192.60.36.80] Jan 31 15:51:25 server-test postfix/smtpd[100729]: lost connection after STARTTLS from server-test.domain Jan 31 15:51:25 server-test postfix/cleanup[100731]: CEDB518137254: message-id=20250131205125.CEDB518137254@gdomain.com Jan 31 15:51:25 server-test postfix/qmgr[93370]: C