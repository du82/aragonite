title = "RPM bundled installer fails on contacting API due to nginx service not starting cause of IPv6 entry - Red Hat Customer Portal"
description = "When installing the RPM bundled installer on a RHEL8.10 machine where ipv6 is disabled it will fail on a point where it tries to talk to the API. On investigating it on the gateway node i noticed that the nginx service failed to start. The service fails to start due to an entry in nginx.conf where it tries to listen on a ipv6 port (listen [::]:80). When you remove the entry,"
full_description = '''Comments Posted In Red Hat Ansible Automation Platform RPM bundled installer fails on contacting API due to nginx service not starting cause of IPv6 entry Posted on 2025-02-06T10:56:30+00:00 When installing the RPM bundled installer on a RHEL8.10 machine where ipv6 is disabled it will fail on a point where it tries to talk to the API. On investigating it on the gateway node i noticed that the nginx service failed to start. The service fails to start due to an entry in nginx.conf where it tries to listen on a ipv6 port (listen [::]:80). When you remove the entry, and restart the installer it works. I can't figure out why nginx adds this entry while ipv6 is disabled. Maybe the installer should also place a valid configuration, which seems to do based on the end result. AS Started 2025-02-06T10:56:30+00:00 by Albert Simenon Newbie 10 points Responses pfElementsConfig = { cpComments: { auth: { type: 'cookie', name: 'rh_jwt' }, sourceId: 'ZGM6NTUwNTJhZTUtMDgyOS00YzFkLTljYzgtYWNkMWQ1MTZkY2Fh', canonicalUrl: 'https://access.redhat.com', apiPath: '/api/comments', allowBestResponse: '1', allowPrivateResponse: '', rest: { "index": "https:\/\/access.redhat.com\/api\/comments\/ZGM6NTUwNTJhZTUtMDgyOS00YzFkLTljYzgtYWNkMWQ1MTZkY2Fh", "create": "https:\/\/access.redhat.com\/api\/comments\/ZGM6NTUwNTJhZTUtMDgyOS00YzFkLTljYzgtYWNkMWQ1MTZkY2Fh", "read": "https:\/\/access.redhat.com\/api\/comments\/ZGM6NTUwNTJhZTUtMDgyOS00YzFkLTljYzgtYWNkMWQ1MTZkY2Fh\/{CID}", "update": "https:\/\/access.redhat.com\/api\/comments\/ZGM6NTUwNTJhZTUtMDgyOS00YzFkLTljYzgtYWNkMWQ1MTZkY2Fh\/{CID}", "delete": "https:\/\/access.redhat.com\/api\/comments\/ZGM6NTUwNTJhZTUtMDgyOS00YzFkLTljYzgtYWNkMWQ1MTZkY2Fh\/{CID}" }, pager: { enabled: 1, size: 20 } } }; /* Kick off comment initialization */ document.addEventListener('pfeconfig-query', function (e) { e.target.config = pfElementsConfig; });'''
