["https://access.redhat.com/ko/articles/6923881"]
title = "Red Hat 고객 포털 자주하는 질문 (FAQ) - Red Hat Customer Portal"
description = "고객 포털에 대한 일반적인 질문 및 답변"
full_description = '''Translated message A translation of this page exists in English. Red Hat 고객 포털 자주하는 질문 (FAQ) 업데이트됨 2022-10-03T14:53:07+00:00 - Korean English Chinese Japanese Korean Table of Contents Red Hat 고객 포털이란 무엇입니까? 고객 포털에서 어떤 언어를 지원합니까? 누가 고객 포털에 액세스 할 수 있습니까? 내 로그인 정보는 어떻게 확인할 수 있습니까? 내 서브스크립션과 연결된 컨텐츠에 어떻게 액세스할 수 있습니까? 서브스크립션을 어떻게 구매할 수 있습니까? 지원 케이스를 어떻게 열 수 있습니까? 고객 포털에 대한 문제를 보고하거나 개선 사항을 요청하려면 어떻게 해야 합니까? 소프트웨어 및 에라타는 어떻게 다운로드할 수 있습니까? Red Hat 지식베이스에 액세스하려면 어떻게 해야 합니까? 제품 설명서(예: 사용자 설명서 및 릴리스 노트)에 어떻게 액세스할 수 있습니까? 학습 서브스크립션에 액세스하려면 어떻게 해야 합니까? 고객 포털에서 사용하는 Red Hat 기술은 무엇입니까? 고객 포털에 대한 일반적인 질문 및 답변 Red Hat 고객 포털이란 무엇입니까? 고객 포털은 Red Hat 서브스크립션이 제공하는 리소스에 액세스하기 위한 중앙 위치입니다. 사용자는 고객 포털을 사용하여 다음 작업을 수행할 수 있습니다. 계정 및 서브스크립션 관리 소프트웨어 및 업데이트 다운로드 지원 케이스 작성 및 관리 솔루션, FAQ 및 공식 Red Hat 제품 문서에 액세스 보안 권고 카탈로그에 액세스하여 Red Hat 제품의 보안 조치에 대한 정보 확인 Red Hat 리소스에 대한 통합 검색 엔진에 액세스 백서, 정보 시트 및 멀티미디어 프레젠테이션과 같은 다양한 기술 리소스에 액세스 제품 평가 요청 커뮤니티 토론에 참여 고객 포털에서 어떤 언어를 지원합니까? 기본적으로 고객 포털은 모든 메뉴와 옵션이 영어로 표시됩니다. 그러나 헤더 표시줄의 글로벌 아이콘에서 다음 언어를 선택할 수도 있습니다. 중국어(간체) 일본어 한국어 고객 포털의 일부 리소스는 영어 이외의 언어로도 사용할 수 있습니다. 예를 들어 일부 제품 설명서는 다양한 언어로 사용할 수 있으며 기술 자료 문서 및 솔루션과 같은 머신 번역 리소스 버전에 액세스할 수 있습니다. 모든 언어 옵션은 문서의 언어 메뉴에서 직접 선택하여 사용할 수 있습니다. 누가 고객 포털에 액세스 할 수 있습니까? 고객 포털은 공개적으로 액세스할 수 있는 사이트입니다. 그러나 일부 기능은 활성 서브스크립션이 있는 고객으로 제한됩니다. 내 로그인 정보는 어떻게 확인할 수 있습니까? 사용자 이름 또는 암호를 기억할 수 없는 경우 암호 재설정 화면을 사용합니다. 관련 정보를 검색하려면 계정 이름 또는 계정과 연결된 이메일 주소가 필요합니다. 사용자 이름 및 암호를 얻는 방법에 대한 자세한 내용은 Red Hat(고객 포털) 로그인의 중요성을 참조하십시오. 내 서브스크립션과 연결된 컨텐츠에 어떻게 액세스할 수 있습니까? 서브스크립션과 연결된 콘텐츠에 액세스하려면 해당 서브스크립션과 연결된 계정을 사용하여 로그인해야 합니다. 또한 해당 계정과 연결된 이메일 주소도 확인해야 합니다. 서브스크립션을 어떻게 구매할 수 있습니까? Red Hat Store에서 일반 서브스크립션을 사용할 수 있습니다. 다른 모든 서브스크립션의 경우 영업 팀에 문의하십시오. 지원 케이스를 어떻게 열 수 있습니까? 제목 표시줄에서 지원 케이스를 클릭합니다. 참고: 권한이 부여된 사용자만 지원 케이스를 열 수 있습니다. 지원 케이스를 작성하고 관리하는 방법에 대한 자세한 내용은 Red Hat 지원에 문의하는 방법을 참조하십시오. 고객 포털에 대한 문제를 보고하거나 개선 사항을 요청하려면 어떻게 해야 합니까? 지원 케이스를 발행하고 Red Hat 고객 포털을 제품으로 입력합니다. 소프트웨어 및 에라타는 어떻게 다운로드할 수 있습니까? 제목 표시줄에서 다운로드를 클릭합니다. Red Hat 지식베이스에 액세스하려면 어떻게 해야 합니까? 제목 표시줄의 돋보기 아이콘을 클릭하고 검색어를 입력한 후 결과 화면의 콘텐츠 유형 목록에서 지식베이스를 선택합니다. 제품 설명서(예: 사용자 설명서 및 릴리스 노트)에 어떻게 액세스할 수 있습니까? 제품 및 서비스 > 문서를 클릭하여 모든 Red Hat 제품, 서비스 및 제공 내용에 대한 제품 설명서를 확인합니다. 또는 제목 표시줄의 돋보기 아이콘을 클릭하고 검색어를 입력하고 결과 화면의 콘텐츠 유형 목록에서 문서를 선택하여 제품 문서에서 결과를 확인할 수 있습니다. 학습 서브스크립션에 액세스하려면 어떻게 해야 합니까? 제품 및 서비스 > 교육 및 자격증을 클릭하여 Red Hat의 교육 카탈로그를 확인하고 교육 과정에 등록한 후 시험에 응시해야 합니다. 고객 포털에서 사용하는 Red Hat 기술은 무엇입니까? 고객 포털은 Red Hat Enterprise Linux, OpenShift Container Platform, Red Hat JBoss Enterprise Application Platform 및 Red Hat JBoss Seam과 같은 기술을 사용합니다. Product(s) Red Hat Customer Portal Category Learn more Article Type General Comments pfElementsConfig = { cpComments: { auth: { type: 'cookie', name: 'rh_jwt' }, sourceId: 'ZGM6Njk2NDVmMzYtMzkzMi00MzM4LWI4MzEtNWYzMTM2MzQzOTM5', canonicalUrl: 'https://access.redhat.com', apiPath: '/api/comments', allowBestResponse: '', allowPrivateResponse: '1', rest: { "index": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzYtMzkzMi00MzM4LWI4MzEtNWYzMTM2MzQzOTM5", "create": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzYtMzkzMi00MzM4LWI4MzEtNWYzMTM2MzQzOTM5", "read": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzYtMzkzMi00MzM4LWI4MzEtNWYzMTM2MzQzOTM5\/{CID}", "update": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzYtMzkzMi00MzM4LWI4MzEtNWYzMTM2MzQzOTM5\/{CID}", "delete": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzYtMzkzMi00MzM4LWI4MzEtNWYzMTM2MzQzOTM5\/{CID}" }, pager: { enabled: 1, size: 20 } } }; /* Kick off comment initialization */ document.addEventListener('pfeconfig-query', function (e) { e.target.config = pfElementsConfig; });'''
