full_description = "Breadcrumb Get started with Red Hat Find answers and get help Find answers and get help Find answers and get help Problems happen. Get support when and how you need it. In this learning path, we'll explore how you can solve potential issues on your own, with the help of the Red Hat Community, or through Red Hat Support. Learning path • 4 resources • 23 mins • Published on June 5, 2024 View the resources in this path Resources in this path • 23 mins Log in to view this resource. Overview: Find answers and get help Log in to view this resource. How to self-solve and find solutions Resource • 8 mins Log in to view this resource. Use and contribute to the Red Hat Community Resource • 5 mins Log in to view this resource. Access Red Hat Support and Customer Service Resource • 10 mins Log in to access this learning path Don't have a Red Hat account? Sign up now. Log in Sign up Find answers and get help Learn how to find and use the support and troubleshooting tools included in a Red Hat subscription. From Knowledgebase to labs to Red Hat Support, there are many resources available to you to keep your systems running and help solve problems quickly. Prerequisites:A Red Hat loginIn this learning path you will:Discover Red Hat's troubleshooting and self-solve resources Figure out how to contribute to and learn from the Customer Portal CommunityDeep dive into the various types of formal supportHow long will this learning path and the complementary actions take?About 20-25 minutesDetails:Products: All Next resource How to self-solve and find solutions"
