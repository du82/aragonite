["https://access.redhat.com/ja/articles/107663"]
title = "Red Hat カスタマーポータルのよくある質問 (FAQ) - Red Hat Customer Portal"
description = "カスタマーポータルに関する一般的な質問と回答"
full_description = '''Translated message A translation of this page exists in English. Red Hat カスタマーポータルのよくある質問 (FAQ) 更新 2024-05-24T23:04:15+00:00 - Japanese English Chinese Japanese Korean 目次 Red Hat カスタマーポータルとは何ですか? カスタマーポータルが対応している言語は? Red Hat カスタマーポータルにアクセスできるのは誰ですか? ログイン情報はどこで確認できますか? サブスクリプションに関連するコンテンツにアクセスする方法は? サブスクリプションを購入する方法は? サポートケースの作成方法は? カスタマーポータルに関する不具合の報告や機能拡張のリクエストを行う方法は? ソフトウェアとエラータのダウンロード方法は? Red Hat ナレッジベースにアクセスする方法は? 製品ドキュメント (ユーザーマニュアルやリリースノートなど) にアクセスする方法は? ラーニングサブスクリプションにアクセスする方法は? カスタマーポータルではどのような Red Hat テクノロジーが使用されていますか? カスタマーポータルに関する一般的な質問と回答 Red Hat カスタマーポータルとは何ですか? カスタマーポータルは、Red Hat サブスクリプションで提供されるリソースが集約されている場所で、ここからリソースにアクセスできます。 お客様は、カスタマーポータルを使用して以下を行えます。 アカウントおよびサブスクリプションの管理 ソフトウェアおよび更新のダウンロード サポートケースの作成および管理 ソリューション、FAQ、Red Hat 製品の公式ドキュメントへのアクセス セキュリティーアドバイザリーカタログへのアクセスと Red Hat 製品のセキュリティー対策に関する確認 Red Hat リソースの統合検索エンジンへのアクセス ホワイトペーパー、情報シート、マルチメディアなどの豊富な教育コンテンツへのアクセス 製品評価のリクエスト コミュニティーでのディスカッションへの参加 カスタマーポータルが対応している言語は? カスタマーポータルでは、デフォルトですべてのメニューとオプションが英語 (米国) で表示されます。ただし、ヘッダーバーの地球儀アイコンから次の言語を選択できます。 中国語 (簡体字) 日本語 韓国語 カスタマーポータルで提供されるリソースの一部は、英語 (米国) 以外の言語でも利用できます。たとえば、一部の製品ドキュメントはさまざまな言語で提供されており、ナレッジベースの記事やソリューションなど、機械翻訳されたリソースにアクセスすることもできます。すべての言語オプションは、ドキュメントの言語メニューから直接利用できます。 Red Hat カスタマーポータルにアクセスできるのは誰ですか? カスタマーポータルは公開されており、どなたでもアクセスできます。ただし、一部の機能は有効なサブスクリプションを持つお客様に限定されています。 ログイン情報はどこで確認できますか? ユーザー名またはパスワードを忘れた場合は、パスワードのリセット が可能です。ログイン情報を取得するには、アカウント名またはアカウントに関連付けられた電子メールアドレスが必要です。 ユーザー名とパスワードを使用したアクセスに関する詳細は、Red Hat (カスタマーポータル) ログインの重要性 を参照してください。 サブスクリプションに関連するコンテンツにアクセスする方法は? サブスクリプション関連のコンテンツにアクセスするには、そのサブスクリプションに関連付けられたアカウントを使用してログインする必要があります。また、そのアカウントに関連付けられたメールアドレスを確認する必要もあります。 サブスクリプションを購入する方法は? 一般的なサブスクリプションは、Red Hat Store から購入できます。 その他のサブスクリプションを購入する場合は、営業チーム にお問い合わせください。 サポートケースの作成方法は? ヘッダーバーの サポートケース をクリックします。 注記: サポートケースは許可されたユーザーのみ作成できます。 サポートケースの作成および管理について、詳しくは Red Hat サポートの利用方法 を参照してください。 カスタマーポータルに関する不具合の報告や機能拡張のリクエストを行う方法は? サポートケースを作成し、製品欄には「Red Hat Customer Portal」を入力してください。 ソフトウェアとエラータのダウンロード方法は? ヘッダーバーの ダウンロード をクリックしてください。 Red Hat ナレッジベースにアクセスする方法は? ヘッダーバーの虫眼鏡アイコンをクリックし、検索用語を入力して結果画面のコンテンツタイプ一覧から「ナレッジベース」を選択します。 製品ドキュメント (ユーザーマニュアルやリリースノートなど) にアクセスする方法は? 「製品およびサービス > ドキュメント」をクリックして、すべての Red Hat 製品、サービス、オファリングの製品ドキュメントを表示します。また、ヘッダーバーの虫眼鏡アイコンをクリックして検索用語を入力し、結果画面のコンテンツタイプ一覧で「製品ドキュメント」を選択すると、製品ドキュメントに該当する結果が表示されます。 ラーニングサブスクリプションにアクセスする方法は? 「製品およびサービス > トレーニングおよび認定資格」から、Red Hat トレーニングカタログの表示、コースへの登録、評価の実施が可能です。 カスタマーポータルではどのような Red Hat テクノロジーが使用されていますか? カスタマーポータルでは、Red Hat Enterprise Linux、OpenShift Container Platform、Red Hat JBoss Enterprise Application Platform、Red Hat JBoss Seam が使用されています。 Product(s) Red Hat Customer Portal Category Learn more Article Type General Comments pfElementsConfig = { cpComments: { auth: { type: 'cookie', name: 'rh_jwt' }, sourceId: 'ZGM6Njk2NDVmMzEtMzAzNy00NjM2LWIzNWYtMzEzMzMzMzUzMjM2', canonicalUrl: 'https://access.redhat.com', apiPath: '/api/comments', allowBestResponse: '', allowPrivateResponse: '1', rest: { "index": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzEtMzAzNy00NjM2LWIzNWYtMzEzMzMzMzUzMjM2", "create": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzEtMzAzNy00NjM2LWIzNWYtMzEzMzMzMzUzMjM2", "read": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzEtMzAzNy00NjM2LWIzNWYtMzEzMzMzMzUzMjM2\/{CID}", "update": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzEtMzAzNy00NjM2LWIzNWYtMzEzMzMzMzUzMjM2\/{CID}", "delete": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzEtMzAzNy00NjM2LWIzNWYtMzEzMzMzMzUzMjM2\/{CID}" }, pager: { enabled: 1, size: 20 } } }; /* Kick off comment initialization */ document.addEventListener('pfeconfig-query', function (e) { e.target.config = pfElementsConfig; });'''
