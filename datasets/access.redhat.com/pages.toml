["https://access.redhat.com/products/red-hat-application-foundations"]
title = ""
description = """
Red Hat JBoss Web Server combines the world's most deployed web server (Apache) with the top servlet engine and the best support in middleware.

Customers of the Red Hat Ansible Automation Platform can take advantage of the Red Hat Ansible Certified Content Collections for Runtimes to automate the deployment of various runtimes products and components."""
full_description = '''Red Hat Application FoundationsHelps build, deploy, and operate applications with security in mind and at scale across the hybrid cloud.DownloadIncluded with Red Hat Application FoundationsRed Hat JBoss Web ServerRed Hat JBoss Web Server combines the world's most deployed web server (Apache) with the top servlet engine and the best support in middleware. Customers of the Red Hat Ansible Automation Platform can take advantage of the Red Hat Ansible Certified Content Collections for Runtimes to automate the deployment of various runtimes products and components.ResourcesLearn about Red Hat Application FoundationsProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadRed Hat AMQ BrokerRed Hat AMQ—based on open source communities like Apache ActiveMQ and Apache Kafka—is a flexible messaging platform that delivers information reliably, enabling real-time integration and connecting the Internet of Things (IoT).ResourcesLearn about Red Hat Application FoundationsProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadRed Hat support for Spring BootSpring Boot lets you create stand-alone Spring-based applications and (Micro)services. Spring Boot provides ways to implement common (Micro)service patterns, such as externalized configuration, health check, circuit breaker, failover.ResourcesLearn about Red Hat Application FoundationsProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadRed Hat Single Sign-OnRed Hat Single Sign-On provides Web single sign-on and identity federation based on SAML 2.0, OpenID Connect and OAuth 2.0 specifications.ResourcesLearn about Red Hat Application FoundationsProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadRed Hat Data GridRed Hat Data Grid is an in-memory, distributed, elastic NoSQL key-value datastore. Built from the Infinispan open-source software project, it's available to deploy as an embedded library, as a standalone server, or as a containerized application on Red Hat OpenShift Container Platform. ResourcesLearn about Red Hat Application FoundationsProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadRed Hat build of QuarkusThe Red Hat build of Quarkus is based on the popular Quarkus community project. It's Kubernetes-native Java with low memory footprint and fast boot times for microservices and serverless applications.ResourcesLearn about Red Hat Application FoundationsProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadRed Hat build of Node.jsRed Hat build of Node.js makes it possible to run JavaScript outside of a browser. Its small size, fast startup, and high developer productivity makes it versatile in almost any use case. From Microservices to embedded software, it provides an I/O model based on events and non-blocking operations that enables you to write efficient applications.ResourcesLearn about Red Hat Application FoundationsProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadRed Hat 3scale API Management Red Hat 3scale API Management makes it easy to manage your APIs. Share, secure, distribute, control, and monetize your APIs on an infrastructure platform built for performance, customer control, and future growth.ResourcesLearn about Red Hat Application FoundationsProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadStreams for Apache KafkaThe streams for Apache Kafka component is a massively scalable, distributed, and high-performance data streaming platform based on the Apache Kafka project. It offers a distributed backbone that allows microservices and other applications to share data with high throughput and low latency.ResourcesLearn about Red Hat Application FoundationsProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadRed Hat build of DebeziumA distributed change data platform that captures row-level database changes so that applications can respond immediately.ResourcesLearn about Red Hat Application FoundationsProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadCamel K integrationDesigned for serverless and microservice architectures, Red Hat build of Camel K is a lightweight integration framework that runs natively in the cloud on OpenShift with use of Kamelets. Kamelets are custom resources that you install on OpenShift and use in Camel K integrations. These route components, in the form of encapsulated code, provide an efficient method for defining data sources and data sinks, allowing you to assemble data pipelines and accelerate your development efforts.ResourcesLearn about Red Hat Application FoundationsProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadRed Hat build of Apache CamelRed Hat build of Apache Camel is a powerful, versatile framework for application integration. It simplifies the process of connecting diverse systems with its modular, component-based architecture and intuitive interfaces. With its extensive library of connectors and data transformations, Red Hat build of Apache Camel makes it easy to connect any system, regardless of platform or protocol.ResourcesLearn about Red Hat Application FoundationsProduct infoView documentationDocumentationView product life cycleLifecycleDownload latest versionDownloadRed Hat build of OptaPlannerRed Hat build of OptaPlanner solves task assigning, employee rostering, order picking, call center scheduling, vehicle route planning, cloud optimization, maintenance scheduling, and more optimization problems.ResourcesLearn about Red Hat Application FoundationsProduct infoView documenta