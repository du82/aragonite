description = "Hi Guys, We are facing issue that our Red Hat 4.2, Kernel version : 2.6.9-55 After migration from EXSi 5.5 to EXSi 8.0.2. We will receive an kernel panic error everytime we reboot/shutdown the system itself. The error we are receiving is : Code: Bad EIP value. Fatal exception: panic in 5 seconds Sending all processes the KILL signal... Saving random seed: [OK] Syncing hardware"
full_description = '''Comments Posted In Red Hat Enterprise Linux Red Hat 4.2 having kernel panic after migration (reboot/shutdown) Posted on 2025-02-06T03:53:06+00:00 Hi Guys, We are facing issue that our Red Hat 4.2, Kernel version : 2.6.9-55 After migration from EXSi 5.5 to EXSi 8.0.2. We will receive an kernel panic error everytime we reboot/shutdown the system itself. The error we are receiving is : Code: Bad EIP value. <0>Fatal exception: panic in 5 seconds Sending all processes the KILL signal... Saving random seed: [OK] Syncing hardware clock to system time [OK] Turning off swap: [OK] Turning off quotas: [OK] Umounting pipe file systems: [OK] Kernel panic - not syncing: Fatal exception RT Started 2025-02-06T03:53:06+00:00 by Ron Tan Newbie 5 points Responses pfElementsConfig = { cpComments: { auth: { type: 'cookie', name: 'rh_jwt' }, sourceId: 'ZGM6M2ZkMmVjNDgtMTI1Yy00ZjI1LWEzNGMtNGY3ZDE1YmVhNmVl', canonicalUrl: 'https://access.redhat.com', apiPath: '/api/comments', allowBestResponse: '1', allowPrivateResponse: '', rest: { "index": "https:\/\/access.redhat.com\/api\/comments\/ZGM6M2ZkMmVjNDgtMTI1Yy00ZjI1LWEzNGMtNGY3ZDE1YmVhNmVl", "create": "https:\/\/access.redhat.com\/api\/comments\/ZGM6M2ZkMmVjNDgtMTI1Yy00ZjI1LWEzNGMtNGY3ZDE1YmVhNmVl", "read": "https:\/\/access.redhat.com\/api\/comments\/ZGM6M2ZkMmVjNDgtMTI1Yy00ZjI1LWEzNGMtNGY3ZDE1YmVhNmVl\/{CID}", "update": "https:\/\/access.redhat.com\/api\/comments\/ZGM6M2ZkMmVjNDgtMTI1Yy00ZjI1LWEzNGMtNGY3ZDE1YmVhNmVl\/{CID}", "delete": "https:\/\/access.redhat.com\/api\/comments\/ZGM6M2ZkMmVjNDgtMTI1Yy00ZjI1LWEzNGMtNGY3ZDE1YmVhNmVl\/{CID}" }, pager: { enabled: 1, size: 20 } } }; /* Kick off comment initialization */ document.addEventListener('pfeconfig-query', function (e) { e.target.config = pfElementsConfig; });'''
