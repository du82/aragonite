full_description = "#trophy { font-size: 9rem; } .card-w-cta { height: 200px; } Awards & Recognition Red Hat is pleased to announce industry recognition for its Customer Portal. In June 2010, we launched the Red Hat Customer Portal to improve the relationship with our subscribers and to better support our solutions and services. We continue to make enhancements across the portal to ensure the best possible experience for our customers. We’re proud that our efforts continue to get recognized. 13 Years Running Association of Support Professionals Award Winner The Customer Portal has been recognized for 13 consecutive years by The Association of Support Professionals (ASP). Red Hat Customer Portal awards include “Best Contribution to Moving the Industry Forward” and being named among “The Ten Best Web Support Sites.” Learn more about ASP More about our 2023 award Red Hat is one of the short list of companies that I recommend to those trying to create great self-service. Their ease of use, customer experience, great search tools, and overall use of technology to benefit their customers puts them in an elite group. Al Hahn, executive director of the Association of Support Professionals"
