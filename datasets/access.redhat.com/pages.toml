["https://access.redhat.com/accelerators"]
title = "Red Hat Accelerators Program - Red Hat Customer Portal"
description = "Are you passionate about Red Hat's products, services and technologies? If so, here is where you can make your mark. The Red Hat Accelerators program is a global network of tech experts and enthusiasts who willingly share their IT knowledge and expertise with peers in the community and Red Hat."
full_description = '''#masthead { background-position-y: 17%; } #terms h4 { margin-top: 0; } p { margin-top: 0; } .accel-badge { margin-top: 5%; margin-left: 15%; } .footer-link { text-decoration: none; color: #fff; } .rhamps-footer a:link { text-decoration: none; color: #fff; } @media (max-width: 768px) { .mail-link { margin-top: 10px; } .accel-badge { margin: 0; } } window.breadcrumbs = [ ["Community", "/community"], ["Red Hat Accelerators"], ]; Overview Benefits Terms Red Hat Accelerators Make your mark Join a community of customers who are passionate tech users and practitioners The Red Hat Accelerators program is a global enterprise customer community of Red Hat technology experts and enthusiasts who willingly share their knowledge and expertise with peers in the industry, their community, and with Red Hat. Apply Now Be Heard Members engage and contribute in the following ways: Be involved Network with industry peers who share your passion and interests Get inside Gain exclusive access to product teams, executives and business leaders as well as upcoming releases and strategic direction Share knowledge Teach others what you know from your experiences Join the conversation Participate and contribute in technical discussions, product feedback sessions and share your insights Be Seen One of the many benefits of being a member of the program is officially identifying yourself as a Red Hat Accelerator. A digital badge lets others know you are a part of our exclusive community group. Red Hat Accelerator badges may be used on personal websites, blogs, email signatures and social media networks. The details on proper usage of the digital badges will be provided to Red Hat Accelerators after being accepted into the program. Why become an Accelerator? Becoming a member has its benefits. As a Red Hat Accelerator, you’ll bolster your Red Hat technology knowledge, skills, and profile. Peer to peer networking Members join a unique community of Red Hat enterprise customers just like you, providing the opportunity to network, learn, and share your passion and interests. Member perks Members gain special privileges, including early access to products and technologies, cool swag merchandise, and VIP treatment at sponsored events. Speak to Red Hat You’ll get direct access to Red Hat experts, product team members, and materials, allowing you to share your experience and provide feedback to influence product development and feature/function improvements. Be recognized Gain validation of your expertise and get the recognition you deserve by helping to build your public profile and persona. Share your expertise You have a unique set of experiences and expertise with Red Hat products. Share, contribute, and teach others in the community during technical discussions, group meetings, and events. Why Red Hat wants you We want to hear from you, understand your unique IT needs, and build that long-term partnership your business relies on. This is your opportunity to be part of our unique enterprise customer community—sharing your feedback, insight, and experiences while networking with like-minded industry experts and gaining new professional skills along the way. Feedback matters Accelerator members provide trusted feedback, from real-world experience. We need your input to help us improve. Spread the word Members are encouraged to speak publicly and share their experience, knowledge, and solutions using Red Hat technologies. Product validation Your unique membership periodically provides early access to new products and features, before they are released, giving you the opportunity to see, demo, and validate Red Hat technologies for product teams. Understanding your needs Your experiences help us understand your unique IT requirements. These help us develop products you need to solve your most difficult business challenges. Program Terms Below you will find the program Terms of the Red Hat Accelerators program. If you still have questions after reviewing these program Terms, please email us at redhataccelerators@redhat.com. What is the Red Hat Accelerators program? Charter: The Red Hat Accelerators program is a global customer community of technical experts and enthusiasts who are passionate about Red Hat's products, services and technologies. The program engages, amplifies and celebrates those who are willing to share their IT knowledge and expertise with peers and Red Hat. What are the benefits of becoming a Red Hat Accelerator? Member Benefits: Becoming a Red Hat Accelerator means being publicly recognized for your valuable contributions and achievements. As a part of this exclusive customer community group, Red Hat Accelerators will have an opportunity to network with industry peers, gain valuable knowledge and insights, participate in product, service and technology discussions and represent the voice of the customer back into Red Hat. Red Hat Accelerator benefits include (and are subject to change): Networking with industry peers who share your same passion for Red Hat products, services and technologies Being recognized as a valued member of the Red Hat Accelerators community Expanding your technical knowledge Gaining unique, private access to product teams and upcoming releases Receiving cool swag merchandise What are the requirements of becoming a Red Hat Accelerator? Membership requirements: Red Hat Accelerators are encouraged to actively engage and contribute to the community in the following ways (but not limited to): Participate and be an active member of the community in meetings, discussions, and tech forums Contribute in all forms of communications, including email, chat, and more Share your knowledge and experiences with the community and Red Hat Provide product feedback and insights via meetings, polls, and surveys Attend events or conferences (by invitation) As well as additional opportunities that present themselves throughout the year. What are the criteria for becoming a member? To become a member of the Accelerator community: We are looking for IT professionals who have a strong opinion and are open to sharing their unique knowledge and perspective on Red Hat products, services, and technologies with the community and Red Hat directly. You are passionate about Red Hat and in your spare time, love to write, blog, tweet, and share your thoughts and experiences publicly. You are active in forums and speak at conferences and trade shows. You have participated and given your unique insights in webinars, video technical talks, podcasts, and other platforms. The Red Hat Accelerator candidate should possess the following background and match the following criteria to be considered: Red Hat enterprise customer using Red Hat product(s) in production or a Red Hat partner with customers using Red Hat product(s) in production Strong IT background, knowledge and opinion about technology Passionate about Red Hat's products, services and technologies Willingness to share their opinion on future IT innovations Looking to expand their own personal brand and knowledge Active on social media and has a blog What is the process for becoming a Red Hat Accelerator? Membership onboarding process: If you or someone you know would like to become a Red Hat Accelerator member, the membership onboarding process is simple - just follow these easy steps: Review the membership criteria Submit an application form for consideration (please be sure to share your background and experience with Linux/Red Hat technologies in the “Brief Bio” section) Receive a response within 4-6 weeks of submission If you have a question, please send an email to: redhataccelerators@redhat.com. What are the guidelines (i.e., the "dos and don'ts") for maintaining membership? Membership guidelines: At Red Hat, we place a high value in our standards and integrity. As a member of the Red Hat Accelerators community, you are part of a unique membership group. As a Red Hat Accelerator, we ask that you agree, adhere to and respect those within the community and Red Hat. Red Hat reserves the right to end the membership of any Red Hat Accelerator at Red Hat's discretion for any reason. For example, Red Hat would not want to see the following from any member: Releasing any products, services, or technologies information to the general public prior to the agreed upon general announcement date / time specified by Red Hat Not staying active and / or engaged in the community Not fulfilling the minimum requirements Misrepresenting your relationship to Red Hat or posing as a Red Hat employee Attacking, bullying, negatively instigating online conversations, or making lewd or disparaging remarks Attempting to sell, solicit, or otherwise lure other community members for your own personal or company’s benefit. Disclosure The FTC has pointed out the value of disclosure in certain endorsement-related contexts (for example, see https://www.ftc.gov/tips-advice/business-center/guidance/ftcs-endorsement-guides-what-people-are-asking). We ask that you disclose your connection to Red Hat, such as by posting a statement like the following on your blog and social media profiles where you talk about Red Hat: "While I am not a representative of Red Hat and my views about Red Hat are my own, I am a member of Red Hat Accelerators community which gives me a connection to Red Hat and through which I engage with other Red Hat Accelerators." Who would and would not be eligible to become a Red Hat Accelerator? Member eligibility: The Red Hat Accelerator must be of legal age of majority in their respective jurisdiction (State, Province, or country of primary residence). Red Hat Accelerators are customers who are tech enthusiasts and are passionate about Red Hat's products, services and technologies. Membership is to individuals, not companies and is not transferable. Geographic eligibility: We are currently accepting applications from the United States, Canada, Latin America, Europe, the Middle East and Africa and Asia-Pacific (except for Indonesia). Please contact Red Hat to find out if we are accepting applications from your country. Government-required exclusions: Members will not be chosen from a country that appears on a United States Government exclusion list. This also applies to persons who are listed on United States Government list of excluded people. Government employee exclusion: Government employees are not eligible. Employees of a public university may be eligible, provided their participation would not violate any State or university laws or policies. Analysts exclusion: Market research analysts and financial analysts, who are paid to analyze market forecast and financial forecast trends are not eligible. Current Red Hat employee exclusion: Current Red Hat employees are also not eligible. Gifting policy exclusions: If anyone who is subject to any policies (such as those of an employer) that would prohibit the individual from receiving gifts or other benefits, such as may be provided by this program, the individual must inform Red Hat prior to accepting membership, so Red Hat may exclude them from receiving any gifts. I work for a Red Hat competitor, would I be eligible to become a Red Hat Accelerator? As a customer who is an IT expert, thought leader, active blogger, and/or member of the IT community, you are eligible to join. This includes candidates that contribute to one area of the Red Hat product portfolio, but who also work for a vendor who may be competing in another area of the product portfolio. Red Hat reserves the right to limit access of any events and early preview to upcoming Red Hat product, service and technology launches from someone who is a potential competitor. We appreciate your willingness to be upfront about your status during the membership onboarding process. Who selects the Red Hat Accelerators? The Red Hat Accelerator program team will decide who becomes a Red Hat Accelerator. Red Hat Accelerator memberships will be granted to those who best meet and exceed the criteria outlined in the member criteria section above. Legal disclaimer: Red Hat reserves the right to select an Accelerator at its sole discretion. How long is the full duration of membership? The program runs on a calendar year basis. Does a Red Hat Accelerator officially represent Red Hat? No, they do not. Red Hat Accelerators do not represent Red Hat. For further information, please refer to the membership guidelines section above. Could the program be a conflict of interest with my current employer? The Red Hat Accelerators program seeks individuals who share their personal views and opinions through social media networks, blogs and/or through the community. If for any reason, a member candidate has any concerns about whether joining the Red Hat Accelerators program may conflict with their current employer's business practices and guidelines, then we encourage them to check with their employer first to ensure they are allowed to participate in the program before accepting membership. What are Red Hat's rights in content created by the Red Hat Accelerators? Any Red Hat Accelerator's generated-content (e.g., written blog, video chat participant, or audio podcast participant) that is created in collaboration between the Red Hat Accelerators program and a Red Hat Accelerator may be shared and distributed by all parties involved, including Red Hat and the Red Hat Accelerators community. A Red Hat Accelerator, upon accepting membership in the Red Hat Accelerators program, gives permission for Red Hat to share, reshare and distribute any content created by the Red Hat Accelerator. Red Hat will request additional permission before using any extracted or repurposed content (such as a quote or an insightful statement). How does Red Hat use and share personal data of Red Hat Accelerators? Privacy is important to Red Hat, and maintaining the trust of Red Hat Accelerators is paramount to us. Personal data collected by Red Hat in connection with this program will include your name, email address, company affiliation, physical address, and certain product and technology related interest information. This information is needed and will be used by Red Hat to operate the program. For example, to facilitate communication with and among members of the program, product areas of focus and interest information will be gathered from members during the application process to determine the type of products, services and technology groups the program will focus on. For more information about Red Hat’s privacy practices that apply to your personal data, including how we collect, use and share your personal data, what your rights are, and how you can contact us, please see Red Hat’s Privacy Statement at: https://www.redhat.com/en/about/privacy-policy How can a Red Hat Accelerator cancel his or her membership? If for any reason a current Red Hat Accelerator decides not to continue participating in the program, they are allowed to leave at any time. To o'''
year_published = 2025
clearnet = "https://access.redhat.com/accelerators"
