["https://access.redhat.com/zh-hans/articles/35968"]
title = "红帽客户门户网站常见问题解答 - Red Hat Customer Portal"
description = "有关客户门户网站的常见问题和答案。"
full_description = '''Translated message A translation of this page exists in English. 红帽客户门户网站常见问题解答 已更新 2024-06-14T03:39:34+00:00 - Chinese English Chinese Japanese Korean 内容目录 什么是红帽客户门户网站？ 客户门户网站支持哪些语言？ 谁可以访问客户门户网站？ 如何找到我的登录详情？ 如何访问与我的订阅关联的内容？ 如何购买订阅？ 如何开一个支持问题单？ 如何向客户门户门户网站报告问题或请求增强？ 如何下载软件和勘误？ 如何访问红帽知识库？ 如何访问产品文档（例如，用户手册和发行注记）？ 如何访问学习订阅？ 客户门户网站使用哪些红帽技术？ 有关客户门户网站的常见问题和答案。 什么是红帽客户门户网站？ 客户门户网站是访问红帽订阅提供的资源的核心位置。 作为客户，您可以使用客户门户网站执行以下操作： 管理您的帐户和订阅 下载软件和更新 创建和管理支持问题单 访问解决方案、常见问题解答和官方红帽产品文档 访问安全公告的目录，并了解红帽产品的安全措施 访问红帽资源的集成的搜索引擎 访问丰富的教育内容，如白皮书、信息表和多媒体演示 请求产品评估 参与社区讨论 客户门户网站支持哪些语言？ 默认情况下，客户门户网站以美国英语形式显示所有菜单和选项。但是，您也可以从标题栏中的全球图标中选择以下语言： 中文（简体） 日语 韩语 客户门户网站上的一些资源也可以使用除美国英语以外的语言提供。例如，一些产品文档以多种语言提供，您可以访问机器翻译的资源版本，如知识库文章和解决方案。所有语言选项都可以直接从文档本身的语言菜单中提供。 谁可以访问客户门户网站？ 客户门户可公开访问。但是，某些功能仅限于具有有效订阅的客户。 如何找到我的登录详情？ 如果您无法记住您的用户名和密码，请使用 Reset your password 屏幕。您需要您的帐户名称或与您的帐户关联的电子邮件地址来检索这些详细信息。 有关访问您的用户名和密码的更多信息，请参阅 红帽（客户门户网站）登录的重要性。 如何访问与我的订阅关联的内容？ 要访问与您的订阅关联的内容，您必须使用与这些订阅关联的帐户登录。您还必须确认与该帐户关联的电子邮件地址。 如何购买订阅？ 常见订阅通过 Red Hat Store 提供。 对于所有其他订阅，请联系 销售人员。 如何开一个支持问题单？ 点标题栏中的 SUPPORT CASES。 注意：只有授权的用户才能开支持问题单。 有关创建和管理支持问题单的更多信息，请参阅 如何获得红帽支持。 如何向客户门户门户网站报告问题或请求增强？ 开一个支持问题单，并作为产品进入红帽客户门户网站。 如何下载软件和勘误？ 单击标题栏中的 DOWNLOADS。 如何访问红帽知识库？ 单击标题栏中的放大镜图标，输入搜索词，然后从结果屏幕上的内容类型列表中选择知识库。 如何访问产品文档（例如，用户手册和发行注记）？ 点 Products & Services > Documentation ，来查看所有红帽产品、服务和提供的产品文档。或者，单击标题栏中的放大镜图标，输入搜索词，然后从结果屏幕上的内容类型列表中选择文档，以查看产品文档中的结果。 如何访问学习订阅？ 点 Products & Services > Training & Certifications ，来查看红帽的培训目录、注册课程并进行评估。 客户门户网站使用哪些红帽技术？ 客户门户包含诸如 Red Hat Enterprise Linux、OpenShift Container Platform、Red Hat JBoss Enterprise Application Platform 和 Red Hat JBoss Seam 等技术。 Product(s) Red Hat Customer Portal Category Learn more Article Type General Comments pfElementsConfig = { cpComments: { auth: { type: 'cookie', name: 'rh_jwt' }, sourceId: 'ZGM6Njk2NDVmMzMtMzUzOS00NjM4LTlmMzEtMzIzNzM4MzkzMjMy', canonicalUrl: 'https://access.redhat.com', apiPath: '/api/comments', allowBestResponse: '', allowPrivateResponse: '1', rest: { "index"