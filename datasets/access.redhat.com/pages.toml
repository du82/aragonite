full_description = '''Red Hat Export Compliance Product and Technology Matrix Updated 2025-02-04T17:51:25+00:00 - English English Japanese Chinese EXPORT COMPLIANCE/CUSTOMS INFORMATION The Red Hat Product Matrix and the following information are not intended to replace the U.S. Export Administration Regulations (the "EAR"), other U.S. export laws, or the Harmonized Tariff Schedule ("HTS"), but are provided as an accommodation to our partners and customers to be used in conjunction with said laws to assist you in the export and import of Red Hat products. The exporter is responsible for exporting Red Hat products in accordance with the requirements of the EAR, other U.S. export laws, and the HTS. End-user, end-use and country of ultimate destination may affect export licensing requirements. All Export Control Classification Numbers ("ECCN"), HTS Numbers and License Authorization information are subject to change without notice. Modification in any way to a Red Hat product voids the classification. It is your obligation as an exporter to verify such information and comply with the current applicable regulations. IF YOU EXPORT RED HAT PRODUCTS, YOU ARE RESPONSIBLE FOR COMPLYING WITH THE REQUIREMENTS OF THE U.S. COMMERCE DEPARTMENT BUREAU OF INDUSTRY AND SECURITY, THE EAR, AND OTHER U.S. EXPORT LAWS. All export information is provided "as-is". Red Hat makes no warranty or representation that the information contained on this site is accurate, current, or complete. It is your obligation as the exporter to comply with the current applicable requirements of U.S. export laws and regulations. Any use of such information by you is without recourse to Red Hat and is at your own risk. Red Hat is in no way responsible for any damages, whether direct, consequential, incidental, or otherwise, suffered by you as a result of using or relying upon such information for any purpose. Embargoed Destinations Red Hat's software and/or technical data may NOT be exported, re-exported or transferred, either directly or indirectly, to a prohibited destination and/or country under the EAR or U.S. sanctions regulations (currently, Cuba, Iran, North Korea, Syria, and the Crimea Region of Ukraine). Please note that this list ("Embargoed Destinations") is subject to change. Denied Persons/Entities Lists In addition to the Embargoed Destinations, Red Hat software and/or technical data may NOT be exported, re-exported or transferred, either directly or indirectly, to a person or entity barred by the United States government from participating in export activities. Denied persons/entities include, but are not limited to, persons and/or entities such as those listed on the U.S. Commerce Department's Denied Persons List, Entities List and the U.S. Department of Treasury's Office of Foreign Assets Control ("OFAC") Specially Designated Nationals List. For more information, see Export Control Product Matrix Product(s) Other Article Type General Comments pfElementsConfig = { cpComments: { auth: { type: 'cookie', name: 'rh_jwt' }, sourceId: 'ZGM6Njk2NDVmMzEtMzIzMC00MjM4LWIwMzMtNWYzMTM0MzEzMTMz', canonicalUrl: 'https://access.redhat.com', apiPath: '/api/comments', allowBestResponse: '', allowPrivateResponse: '1', rest: { "index": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzEtMzIzMC00MjM4LWIwMzMtNWYzMTM0MzEzMTMz", "create": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzEtMzIzMC00MjM4LWIwMzMtNWYzMTM0MzEzMTMz", "read": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzEtMzIzMC00MjM4LWIwMzMtNWYzMTM0MzEzMTMz\/{CID}", "update": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzEtMzIzMC00MjM4LWIwMzMtNWYzMTM0MzEzMTMz\/{CID}", "delete": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Njk2NDVmMzEtMzIzMC00MjM4LWIwMzMtNWYzMTM0MzEzMTMz\/{CID}" }, pager: { enabled: 1, size: 20 } } }; /* Kick off comment initialization */ document.addEventListener('pfeconfig-query', function (e) { e.target.config = pfElementsConfig; });'''
