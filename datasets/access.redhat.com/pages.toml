full_description = "Red Hat DocumentationFind answers, get step-by-step guidance, and learn how to use Red Hat products.Explore popular productsRed Hat Enterprise LinuxSupport application deployments—from on premise to the cloud to the edge—in a flexible operating environment.Red Hat OpenShift Container PlatformQuickly build and deploy applications at scale, while you modernize the ones you already have.Red Hat Ansible Automation PlatformCreate, manage, and dynamically scale automation across your entire enterprise.Red Hat OpenShift Service on AWSA fully managed service to build and manage your containerized applications on AWS.Red Hat Enterprise Linux AIDevelop, test, and run Granite large language models (LLMs) on a foundation model platform.Looking for something else?Explore all productsExplore common use casesBuilding your RHEL AI environmentInstructions on how to initialize and set up the RHEL AI environmentGetting started with Ansible Automation PlatformGet started automating for administrators, developers, and operatorsManage your VMs with OpenShift VirtualizationRun and manage virtual machines alongside container workloads.Identify and resolve issues by using Red Hat InsightsInstall Red Hat Insights to discover and predict risks, recommend actions, and track costs.Learn about the Red Hat OpenShift Service on AWS (ROSA) with hosted control planes (HCP) deployment modelInstall, access, and delete Red Hat OpenShift Service on AWS (ROSA) clusters that use hosted control planesBuilding a hybrid cloud with Red Hat OpenStack Services on OpenShiftDeploy and manage virtualized and containerized applications in a scalable infrastructure with a Red Hat OpenShift control plane.Improving Developer productivity with Red Hat Developer HubInstall, configure, and customize Red Hat Developer Hub; an enterprise-grade platform for building developer portals.Using image mode for RHEL to manage operating systemsInstructions for using image mode for RHEL to build, deploy, and manage the operating system as if it is a container.Red Hat OpenShift essentialsComplete common Red Hat OpenShift tasks with our curated resources, while taking your product knowledge to the next level. Find answers based on your environment and role.Cloud services Administrators Developers DevOps Self-managed Administrators Developers Devops Explore learning resourcesGet started with Red HatDiscover the value of your Red Hat subscriptions and products by following these learning paths.Get started with the Red Hat Hybrid Cloud ConsoleBuild, deploy, and optimize workloads across the hybrid cloud with our hosted products and services.Red Hat Hybrid Cloud learning hubWhatever your expertise with Red Hat Cloud Services, build what you need with these learning resources.Red Hat Developer learning resourcesLearn how to build flexible, scalable, secure, and reliable applications with Red Hat’s latest solutions.Learn with Red Hat interactive labsLearn with self-paced, hands-on, interactive lessons based on real use cases.Optimize your system with Red Hat Customer Portal labsImprove performance, troubleshoot issues, identify security problems, and optimize your configurations.Red Hat Training and CertificationAccess hands-on training to gain knowledge, get certified, and stay ahead of technology trends. Explore Managed OpenShift tutorialsRed Hat experts share step-by-step tutorials that can help you get the most out of your cluster. Red Hat Architecture CenterProvides examples, patterns, and use cases for designing and building with Red Hat solutions.Red Hat OpenShift VirtualizationRed Hat® OpenShift® Virtualization lets you run containers and VMs side by side. Migrate quickly, modernize at your own pace, and manage all of your apps consistently on a single, trusted application platform.Start your virtualization journey"
