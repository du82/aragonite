title = "Did Red Hat replace single user mode? - Red Hat Customer Portal"
description = '''I am having trouble finding a definitive answer on this and I am in discussion with Veeam's Technical Writing Team. I have been building hardened Linux repositories for Veeam using RHEL 9.5 and Rocky 9.5 and the last line of their guide states "Note that this user account will lose sudo permissions. if you need to execute commands as a privileged user, you must boot the'''
full_description = '''Comments Posted In Red Hat Enterprise Linux Tags recovery rhel troubleshooting Did Red Hat replace single user mode? Posted on 2025-01-30T15:40:17+00:00 I am having trouble finding a definitive answer on this and I am in discussion with Veeam's Technical Writing Team. I have been building hardened Linux repositories for Veeam using RHEL 9.5 and Rocky 9.5 and the last line of their guide states "Note that this user account will lose sudo permissions. if you need to execute commands as a privileged user, you must boot the operating system into the single user mode." Problem is that I cannot find any documentation for RHEL 9 about single user mode and it seems that it was replaced by Rescue Mode and Emergency Mode. When I attempted either one, I get prompted for root credentials which were never setup as it was not part of Veeam's guide. I pointed this out to their technical writing team and they are telling me I misconfigured something and to contact Veeam support. Does anyone know where I can find official Red Hat documentation for this? I have searched and cannot find it. Veeam Hardened Linux Repo guide: https://helpcenter.veeam.com/docs/backup/vsphere/hardened_repository_rhel_configure.html?ver=120 Veeam Requirements for Backup Repositories: https://helpcenter.veeam.com/docs/backup/vsphere/system_requirements.html?ver=120#repo AG Started 2025-01-30T15:38:22+00:00 by Aaron Gruber Newbie 10 points Responses pfElementsConfig = { cpComments: { auth: { type: 'cookie', name: 'rh_jwt' }, sourceId: 'ZGM6YjA0OWRjNWYtOWJlYy00MTcyLTk5YzQtMTJlZWFiZTlkMjIw', canonicalUrl: 'https://access.redhat.com', apiPath: '/api/comments', allowBestResponse: '1', allowPrivateResponse: '', rest: { "index": "https:\/\/access.redhat.com\/api\/comments\/ZGM6YjA0OWRjNWYtOWJlYy00MTcyLTk5YzQtMTJlZWFiZTlkMjIw", "create": "https:\/\/access.redhat.com\/api\/comments\/ZGM6YjA0OWRjNWYtOWJlYy00MTcyLTk5YzQtMTJlZWFiZTlkMjIw", "read": "https:\/\/access.redhat.com\/api\/comments\/ZGM6Yj