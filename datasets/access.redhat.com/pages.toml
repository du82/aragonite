full_description = '''Comments Posted In Red Hat OpenShift Container Platform How to update certiticates? Posted on 2025-02-11T19:19:54+00:00 Hi all, I don't even know if I select the correct "product" here. I was thrust upon this project without much training or documentation. I have to update the certificates on one of the network routes. First off, my network guy sent me a .key file and a .crt along with the .ca file. I went into the OpenShift console on the bastion server then went to Networking > Routes and edited the yml putting the new key and crt in and adding the correct spaces. The ca is the same. Question is, I have no idea how to deploy this to the servers. I did a Save then Reload but that didn't seem to do much. Seems I may have to push this out to the nodes but I don't know how. If anyone can offer some suggestions, I would very much appreciate it. I only have 3 days to get this resolved before the cert expires. NR Started 2025-02-11T19:19:54+00:00 by Nigel Reed Community Member 36 points Responses pfElementsConfig = { cpComments: { auth: { type: 'cookie', name: 'rh_jwt' }, sourceId: 'ZGM6YjNiYTU2NzEtYTczYi00MjE2LTllYWYtMmNjYzQxYzIyNzJj', canonicalUrl: 'https://access.redhat.com', apiPath: '/api/comments', allowBestResponse: '1', allowPrivateResponse: '', rest: { "index": "https:\/\/access.redhat.com\/api\/comments\/ZGM6YjNiYTU2NzEtYTczYi00MjE2LTllYWYtMmNjYzQxYzIyNzJj", "create": "https:\/\/access.redhat.com\/api\/comments\/ZGM6YjNiYTU2NzEtYTczYi00MjE2LTllYWYtMmNjYzQxYzIyNzJj", "read": "https:\/\/access.redhat.com\/api\/comments\/ZGM6YjNiYTU2NzEtYTczYi00MjE2LTllYWYtMmNjYzQxYzIyNzJj\/{CID}", "update": "https:\/\/access.redhat.com\/api\/comments\/ZGM6YjNiYTU2NzEtYTczYi00MjE2LTllYWYtMmNjYzQxYzIyNzJj\/{CID}", "delete": "https:\/\/access.redhat.com\/api\/comments\/ZGM6YjNiYTU2NzEtYTczYi00MjE2LTllYWYtMmNjYzQxYzIyNzJj\/{CID}" }, pager: { enabled: 1, size: 20 } } }; /* Kick off comment initialization */ document.addEventListener('pfeconfig-query', function (e