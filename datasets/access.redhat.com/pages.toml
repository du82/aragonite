title = "Vulnerability for Tomcat CVE-2024-50379 - Red Hat Customer Portal"
description = "Hello, we have reported a vulnerability for versions of tomcat shipped with RHEL 9. https://access.redhat.com/security/cve/cve-2024-50379 So far we haven t seen any fix for this, and the fixes suggested (upgrade to tomcat 9.0.98) seems that are not supported/shipped in RHEL 9 repos. What should we do to fix this vulnerability. Shall we install from the apache page the versions"
full_description = '''Comments Posted In Red Hat Enterprise Linux for x86_64 Tags rhel tomcat Vulnerability for Tomcat CVE-2024-50379 Posted on 2025-02-07T10:54:06+00:00 Hello, we have reported a vulnerability for versions of tomcat shipped with RHEL 9. https://access.redhat.com/security/cve/cve-2024-50379 So far we haven t seen any fix for this, and the fixes suggested (upgrade to tomcat 9.0.98) seems that are not supported/shipped in RHEL 9 repos. What should we do to fix this vulnerability. Shall we install from the apache page the versions or wait for an errata and if it is so, what is the estimated time to have an errata available. Thank you very much for the feedback in this... MR Started 2025-02-07T10:54:06+00:00 by Miguel Rodrigues de Amorim RHCSA Community Member 80 points Responses pfElementsConfig = { cpComments: { auth: { type: 'cookie', name: 'rh_jwt' }, sourceId: 'ZGM6ZjQxMDFjMWUtMTc3Yy00MTgzLTgzNTQtODZkNmI1NTg2MWVi', canonicalUrl: 'https://access.redhat.com', apiPath: '/api/comments', allowBestResponse: '1', allowPrivateResponse: '', rest: { "index": "https:\/\/access.redhat.com\/api\/comments\/ZGM6ZjQxMDFjMWUtMTc3Yy00MTgzLTgzNTQtODZkNmI1NTg2MWVi", "create": "https:\/\/access.redhat.com\/api\/comments\/ZGM6ZjQxMDFjMWUtMTc3Yy00MTgzLTgzNTQtODZkNmI1NTg2MWVi", "read": "https:\/\/access.redhat.com\/api\/comments\/ZGM6ZjQxMDFjMWUtMTc3Yy00MTgzLTgzNTQtODZkNmI1NTg2MWVi\/{CID}", "update": "https:\/\/access.redhat.com\/api\/comments\/ZGM6ZjQxMDFjMWUtMTc3Yy00MTgzLTgzNTQtODZkNmI1NTg2MWVi\/{CID}", "delete": "https:\/\/access.redhat.com\/api\/comments\/ZGM6ZjQxMDFjMWUtMTc3Yy00MTgzLTgzNTQtODZkNmI1NTg2MWVi\/{CID}" }, pager: { enabled: 1, size: 20 } } }; /* Kick off comment initialization */ document.addEventListener('pfeconfig-query', function (e) { e.target.config = pfElementsConfig; });'''
