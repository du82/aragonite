["https://accessibility.huit.harvard.edu/provide-accessible-labels-and-instructions"]
title = "Provide accessible labels and instructions | Digital Accessibility​"
description = "Make it easier for people to complete input fields requesting personal information."
full_description = "Provide accessible labels and instructions Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media For Developers For Developers expand_more Essentials for Developers Structure - Developers Structure - Developers expand_more Use standard web technologies Encode elements in a logical order Use semantic elements for regions and content Provide accessible labels and instructions Interaction - Developers Presentation - Developers Images and Media - Developers For Faculty For Managers For Purchasers Forms allow users to enter data by typing or selecting from a set of options. When forms are not designed with accessibility in mind, people with disabilities are likely to have difficulty or even find it impossible to enter data without errors. So forms need to be designed so that the purpose of each control is clear. Provide an accessible label for every control. Preferably, give each control a visible text label that explains its purpose. This is best done with an HTML label element that’s programmatically associated with the control. For a text input field, its accessible label would be a short description of the data the field collects. For a control that is a group of options, such as a drop-down menu or list of radio buttons or checkboxes, the group should have a label that describes the relationship of the options. Each label should have a short description that indicates the value associated with each option. Make sure the label remains visible when the control has focus. Wherever possible, avoid relying on placeholder text to label an input field. There are several usability issues relating to placeholder text because it disappears when the user starts to type into the field. So it's much better to have an external label that remains visible at all times. If space is limited, such as when designing responsively for small screens, media queries could be used to change how label text is displayed. Provide additional input instructions when they are needed. Some controls may collect data that has constraints (such as upper or lower limits) or restricted formats. Preferably, use controls that only allow selections within those constraints. If this is not possible, provide additional text that describes the constraints in plain language. Provide additional information (metadata) to help people better understand and recognize the intention of input forms. People who have difficulty completing forms requesting personal data -- for example, those with cognitive or mobility impairments -- will benefit, because it will save time and eliminate typing or spelling errors. Most browsers today recognize well-labeled input fields corresponding to name and address. If the user allows the browser to autofill and store personal information in the settings, the browser will suggest values to complete the fields. This makes entering data faster and more accurate by eliminating typing errors. Testing For each form control: If the control is a text input field, is there a visible text label that describes what should be entered into the field? If the control is a group of selectable options, such as a dropdown menu or list of radio buttons or checkboxes, are both of these true? There is a visible, meaningful label describing the collection of options. Each option has a visible, meaningful label that conveys the value of the options. If there is no visible label for a control, are both of these true? There are sufficient visual clues to explain the function of the control. There is label text that is programmatically associated with the control, and the label is read aloud by a screen reader when it encounters the control. If users need additional information to interact with the control, is that information provided accessibly? Has the autocomplete attribute been leveraged to allow additional information to be offered to users to assist them in understanding and recognizing the intention of input fields? Resources Understanding WCAG SC 1.3.5—Identify Input Purpose (WAI) Understanding WCAG SC 3.3.2—Labels or Instructions (WAI) Understanding WCAG 2 SC 4.1.2—Name, Role and Value (WAI) Creating Accessible Forms (WebAIM) Placeholders in Form Fields are Harmful (Nielsen Norman Group) See also: Forms Related Techniques ✎ Technique: Identify input purpose Make it easier for people to complete input fields requesting personal information. ✎ Technique: Required fields A clear indication that specific form fields are required can save users time and avoid potential errors relating to missing data when a form is submitted. ✎ Technique: Input labels Descriptive labels help users understand the purpose of a form control. Labels should be associated with their controls so that when the input is focused, the label is announced by screen readers."
year_published = 2025
