["https://accessibility.huit.harvard.edu/give-users-control-over-timeouts"]
title = "Give users control over timeouts | Digital Accessibility​"
description = "For a number of reasons including data persistence, performance and security, it is sometimes beneficial to terminate idle user sessions. It's important to warn people a session is about to expire and give them the option to continue."
full_description = "Give users control over timeouts Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media For Developers For Developers expand_more Essentials for Developers Structure - Developers Interaction - Developers Interaction - Developers expand_more Keyboard Custom widgets and controls Notifications and alerts Notifications and alerts expand_more Provide helpful error messages Give users control over timeouts Provide notification of dynamic changes to content Support navigation and wayfinding Presentation - Developers Images and Media - Developers For Faculty For Managers For Purchasers People with disabilities may take longer to read and interact with web content. Sometimes a time limit is present, for example, due to security requirements, and the browsing session is terminated after a period of inactivity. If there is no suitable warning or no ability to turn off or extend a time limit, there’s an increased risk that people with disabilities will be unable to successfully use the content. Allow users to turn off or extend the time limit. The preferable approach is to give users control over the length of the time limit or whether the time limit is present at all. But in some cases this is likely to be impractical. Allow users to extend the time limit. When the time limit approaches, provide a warning dialog that allows users to extend the time limit by a simple keypress, such as by pressing the spacebar. Testing If a time limit is present on a page or site: Is there a mechanism for users to turn off the time limit or change its length? As the time limit approaches, is there a message provided to alert users of the impending time out? Does the message allow them to extend the timeout? Resources Understanding WCAG SC 2.2.1—Timing Adjustable (WAI) Related Techniques ✎ Technique: Session extension For a number of reasons including data persistence, performance and security, it is sometimes beneficial to terminate idle user sessions. It's important to warn people a session is about to expire and give them the option to continue."
