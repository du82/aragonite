["https://accessibility.huit.harvard.edu/images-and-media"]
title = "Images and Media | Digital Accessibility​"
description = "Images and media can be effective in conveying concepts and bringing information to life. Content creators are encouraged to ensure information is provided in an additional format."
full_description = "Images and Media Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media Images and Media expand_more Use images and media to enhance understanding Write helpful Alt Text to describe images Provide captions and descriptions of video For Developers For Faculty For Managers For Purchasers Accessible Media: Supports All SensesPeople can understand and use information contained in media, such as images, audio, video, animation, and presentations. Images and media can be effective in conveying concepts and bringing information to life. However, visual and audio materials rely on vision and hearing, and content creators are encouraged to ensure information is provided in an additional format, so it is available to all users. When content creators provide accessible media: Alternatives are provided to make the information in the images and media available to everyone. Images and media are used purposefully, as an effective mode of communicating relevant information."
