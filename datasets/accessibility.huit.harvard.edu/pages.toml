["https://accessibility.huit.harvard.edu/web-technologies/css"]
title = "CSS | Digital Accessibility​"
description = "Content does not restrict its view and operation to a single display orientation, such as portrait or landscape, unless a specific display orientation is essential (i.e., bank check)."
full_description = "✎ Technique: Orientation Page Content does not restrict its view and operation to a single display orientation, such as portrait or landscape, unless a specific display orientation is essential (i.e., bank check). ✎ Technique: Identify input purpose Page Make it easier for people to complete input fields requesting personal information. ✎ Technique: Reflow Page Use responsive design to allow your content to zoom and respond to various screen sizes. ✎ Technique: Non-text contrast Page The contrast of icons and graphical objects is just as important as that of text. Use sufficient contrast for all elements on the screen, with a minimum contrast ratio of 3:1. ✎ Technique: Text spacing Page People with a variety of print disabilities (including low vision, dyslexia, other cognitive disabilities) can benefit from being able to increase the spacing between lines, words, and/or letters on their own device. ✎ Technique: Checking color contrast Page Color-contrast-checking tools can compare two colors and report on the contrast ratio between them. Some tools will allow you to adjust these values until the ratio is sufficient, helping you to choose a color scheme that avoids contrast problems. ✎ Technique: Referring to page content by its position Page Avoid referring to a button, menu, or other item in the page only by its position on the page; instead, use additional information that describes the content. ✎ Technique: Visited links Page In long lists of links, it's helpful to show users which links they've already followed so they can focus on unseen content. Browsers do not tend to let you style visited links with anything but the color property. ✎ Technique: Readable paragraph text Page Paragraphs of text are a fundamental core of web content. It's important to display them in a fashion that is optimally readable to the majority of your audience."
