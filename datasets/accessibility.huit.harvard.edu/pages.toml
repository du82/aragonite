["https://accessibility.huit.harvard.edu/disabilities/cognitive"]
title = "Cognitive | Digital Accessibility​"
description = "Make it easier for people to complete input fields requesting personal information."
full_description = "✎ Technique: Identify input purpose Page Make it easier for people to complete input fields requesting personal information. ✎ Technique: Reflow Page Use responsive design to allow your content to zoom and respond to various screen sizes. ✎ Technique: Text spacing Page People with a variety of print disabilities (including low vision, dyslexia, other cognitive disabilities) can benefit from being able to increase the spacing between lines, words, and/or letters on their own device. ✎ Technique: Content on hover or focus Page Make it easier for users to interact with added content. Tooltips, drop-down menus, and popups are examples of added content. ✎ Technique: Label in name Page People with disabilities rely on interface controls that are used programmatically. These controls have a visual label, as well as a programmatic label, known as its Accessible Name. ✎ Technique: Status messages Page Assistive technology users should be able to detect when important changes occur on a web page, With the use of a status message, information can be provided to the user without changing focus or unnecessarily interrupting their work. ✎ Technique: Building tables Page The element is for data that one might find in a spreadsheet, consisting of rows and columns of cells. It's important to ensure that the editing process allows identifying row and column headers. ✎ Technique: Structuring content Page Adding structure to web content makes it more readable and comprehensible to everyone and especially to people with a visual or cognitive impairment that makes reading on-screen content difficult. ✎ Technique: Writing headings Page Headings are used to group and label sections of content, giving visual structure to the page and providing a means of navigation to screen reader users."
year_published = 2025
