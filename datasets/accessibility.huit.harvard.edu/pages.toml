["https://accessibility.huit.harvard.edu/principles/understandable"]
title = "Understandable | Digital Accessibility​"
description = "Placement of controls affects their ease of use."
full_description = "✎ Technique: Create a project charter Page A well-defined charter helps keep websites focused on meeting the needs of their target audience, ensuring that the site's architecture is logical and that users can find the information they need and complete tasks effectively. ✎ Technique: Writing readable content Page Readable content is accessible content. You should aim to choose words and sentence structures that are not difficult or unnecessarily time-consuming to read for your target audience. ✎ Technique: Readable paragraph text Page Paragraphs of text are a fundamental core of web content. It's important to display them in a fashion that is optimally readable to the majority of your audience. ✎ Technique: Required fields Page A clear indication that specific form fields are required can save users time and avoid potential errors relating to missing data when a form is submitted. ✎ Technique: Form error communication Page Effectively and accessibly communicate form errors by: Communicating that a form has errors, Communicating any individual errors case by case, including clear guidance on how to address the error. ✎ Technique: Session extension Page For a number of reasons including data persistence, performance and security, it is sometimes beneficial to terminate idle user sessions. It's important to warn people a session is about to expire and give them the option to continue. ✎ Technique: Form feedback with live regions Page Providing form feedback accessibly helps users submit data more accurately and reduces the chance for error. ✎ Technique: Input labels Page Descriptive labels help users understand the purpose of a form control. Labels should be associated with their controls so that when the input is focused, the label is announced by screen readers."
year_published = 2025
