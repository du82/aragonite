["https://accessibility.huit.harvard.edu/event/measuring-accessibility-siteimprove-050125"]
title = "Measuring Accessibility with Siteimprove | Digital Accessibility​"
description = """
This course provides an overview of Siteimprove, the Harvard-licensed platform to assess and monitor accessibility in public-facing websites. We’ll demystify the essential features and functionality that allow users to filter, sort, and measure the impact of issues. You’ll also learn how to track and report progress toward accessibility compliance, and find guidance and practical recommendations for fixing issues.
If you’d like to follow along during the training, please request access to Siteimprove through ServiceNow a week before class for the website you work on. NOTE: It takes about 5-7 days after your account is created for data to start populating in your Siteimprove dashboard.
Please contact digitalaccessibility@harvard.edu with any questions or accommodation requests."""
