["https://accessibility.huit.harvard.edu/structure-developers"]
title = "Structure - Developers | Digital Accessibility​"
description = "Structural markup is markup that reflects the semantic meaning of page content."
full_description = "Structure - Developers Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media For Developers For Developers expand_more Essentials for Developers Structure - Developers Structure - Developers expand_more Use standard web technologies Encode elements in a logical order Use semantic elements for regions and content Provide accessible labels and instructions Interaction - Developers Presentation - Developers Images and Media - Developers For Faculty For Managers For Purchasers Solid Structure: Built to StandardsPeople feel confident using the design because it is stable, robust, and secure Structural markup is markup that reflects the semantic meaning of page content. Accessibility is enhanced through good use of structural markup because it allows semantic meaning to be preserved when the page is presented in different ways. For example, menus and controls that are implemented using semantic elements, like buttons and anchors, are compatible with assistive technologies such as screen reader and speech recognition software. Solid structure also makes it possible for people to change the display—for example, by someone who has dyslexia—to make it easier for them to read. When developers focus on solid structure: Sites are built on a strong semantic structure, making them usable by assistive technology. Sites are flexible and adaptable to different display preferences. Sites work well on different platforms and using different software and input devices."
