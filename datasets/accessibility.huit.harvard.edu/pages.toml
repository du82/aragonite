["https://accessibility.huit.harvard.edu/supporting-accessibility-hybrid-workplace"]
title = "Supporting Accessibility in a Hybrid Workplace | Digital Accessibility​"
description = "As organizations begin to offer more worksite flexibility, the need for accessible, inclusive technology has increased at a rapid rate. Over one billion people worldwide experience some form of disability, and most of these disabilities are invisible, which often makes them more difficult to address."
full_description = "Supporting Accessibility in a Hybrid Workplace Course Overview Level: General Course length: 1 hour Platform: LinkedIn Learning Course Description As organizations begin to offer more worksite flexibility, the need for accessible, inclusive technology has increased at a rapid rate. Over one billion people worldwide experience some form of disability, and most of these disabilities are invisible, which often makes them more difficult to address. Whether you’re aware of it or not, you most likely share information in reports, spreadsheets, and presentations with someone who has a disability. Today's digital collaboration tools can help you make your expertise more effective and accessible to members of your team with common disabilities. In this course, organizational effectiveness consultant Jessica Williams offers tips on how to apply inclusive principles to sharing content with your hybrid team. Explore elements that often get overlooked when developing content for people who use screen readers and meeting software. Learn how to lead accessible meetings so everyone can comprehend, collaborate, and contribute their expertise. This course was created by Madecraft. We are pleased to host this training in our library. Please contact digitalaccessibility@harvard.edu with any questions or accommodation requests. Launch in the Training Portal See also: All Self-Paced Trainings Intro to Accessibility LinkedIn Learning"
