["https://accessibility.huit.harvard.edu/design-readability"]
title = "Design for readability | Digital Accessibility​"
description = "Paragraphs of text are a fundamental core of web content. It's important to display them in a fashion that is optimally readable to the majority of your audience."
full_description = '''Design for readability Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Presentation expand_more Design for readability Design for comprehension Use sufficient color contrast Language Images and Media For Developers For Faculty For Managers For Purchasers Readability and legibility are key considerations for all users. For people with disabilities, these attributes can be essential to a successful user experience. For example, some people may have difficulty tracking along a line of text if its line height (a.k.a. leading) is too wide or too narrow. Some people need to enlarge text to read it and will not be able to access content set in a text size that is small or doesn't scale correctly. For optimal readability: Use visual and semantic space. Space is an important visual design tool that helps us identify groups of related content and delineate unrelated content. Non-visual users benefit from "space" that is created using semantic markup (see Structure). Provide the right amount of space between lines of text. For most content work, the interline spacing (line-height) is applied automatically. Use clean typography. Avoid changing the typeface from that specified by the website. Avoid using all caps. Readability is reduced with all caps because all words have a uniform rectangular shape, meaning readers can't identify words by their shape. Don’t underline text. Reserve underlining for identifying links. Use left-aligned text. A consistent left margin makes reading easier. Support text resizing. Check how your content responds to enlarged text. Avoid using narrow columns of content because they will not respond well to scaling. Testing Ensure your content is coded using semantic markup (see Testing section under Identify headings, lists, and tables). Scan the “color” of your page. Is there an even color, with only important elements drawing attention, like headings? Enlarge your text size in the browser. Does the text resize? Does the layout stay intact, or do elements overlap and clip? Resources Formatting Text Correctly on a Page (OpenScholar) Understanding SC 1.3.1—Info and Relationships (WAI) Understanding SC 1.4.4—Resize text (WAI) Related Techniques ✎ Technique: Readable paragraph text Paragraphs of text are a fundamental core of web content. It's important to display them in a fashion that is optimally readable to the majority of your audience. ✎ Technique: Text and images of text When text is presented as an image of text, that limits peoples' ability to change the appearance of that text. So wherever possible, use text along with CSS to apply styling.'''
