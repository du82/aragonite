description = "Microsoft Office is one of the most popular and widely used software families available in the world. If you’re interested in making it more accessible to everyone on your team, this course was designed just for you."
full_description = "Microsoft Office Accessibility for Beginners Page Microsoft Office is one of the most popular and widely used software families available in the world. If you’re interested in making it more accessible to everyone on your team, this course was designed just for you. Advanced Accessible PDFs Page Accessible PDF files are files that can be read by a screen reader by users who are visually impaired. While you can’t just push a button to make a PDF accessible, with the tools available in Microsoft Word and Adobe InDesign, you can make sure that any... Creating Accessible PDFs Page Accessibility means making sure your content is available to as many people as possible. When you make your PDFs accessible, it means adding tags, bookmarks, alt text, and other information that makes the files readable to users of assistive technology..."
