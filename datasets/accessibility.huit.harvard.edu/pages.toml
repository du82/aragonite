["https://accessibility.huit.harvard.edu/identify-headings-lists-and-tables"]
title = "Identify headings, lists, and tables | Digital Accessibility​"
description = "Identifying headings, lists, and tables not only ensures that people have access to that important structural information, but assistive technologies like screen readers can help users easily locate these features and navigate between and within them."
full_description = "Identify headings, lists, and tables Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Structure expand_more Provide visual and semantic structure Identify headings, lists, and tables Provide accessible documents and services Wayfinding Presentation Language Images and Media For Developers For Faculty For Managers For Purchasers Identifying headings, lists, and tables not only ensures that people have access to that important structural information, but assistive technologies like screen readers can help users easily locate these features and navigate between and within them. By adding structure, you automatically make it easier for screen-reader users to explore and understand your content. Avoid using structural elements for anything other than their intended use. For example, do not use table elements for layout, such as to create columns. Screen-reader software announces the structure of a table and users may believe they are navigating through tabular data when they are not. Mark up information structure using heading levels. When you add headings for sections of content, make sure they’re identified as headings. Styling text to be bigger and bolder than the rest may make it look like a heading, but for people who don’t see that visual change the text won’t be identifiable as a heading. Mark up ordered and unordered lists. If you have content that’s a list, identify it as a list in markup. Don’t use asterisks, dashes, or numbers as lists item markers. If you use proper list markup, bullets or numbers will be added automatically. Use table markup for data tables. If you have tabular data, make sure it’s presented as an HTML table, with column and row headers. Do not use tables for layout. Look for other ways to achieve the desired layout using the authoring tool options or adding styles using CSS. You can make use of editor toolbars to help you add headings, tables, and lists. The following example shows the semantic markup options using OpenScholar's editor toolbar. Use the menu to create headings, and use the list controls to create bulleted and numbered lists. Testing Use an inspection tool, like the Web Developer Toolbar, to display structural elements: Check each section heading on the page. Is it identified in code as a heading? Is the heading given an appropriate level of hierarchy for the page structure? Check each list on the page. Is it identified in code as a list? Are data tables marked up as tables, with row and column headers? Are tables used for layout purposes? Resources Understanding WCAG SC 1.3.1—Info and Relationships (WAI) Semantic Structure on the Web (WebAIM) Related Techniques ✎ Technique: Building tables The element is for data that one might find in a spreadsheet, consisting of rows and columns of cells. It's important to ensure that the editing process allows identifying row and column headers. ✎ Technique: Identifying lists of content When you include a list in your page content, this relationship needs to be conveyed visually, and it also needs to be conveyed to people using screen readers. ✎ Technique: Identifying headings Headings are important orientation aids, and they help people quickly identify the content on your page. When headings are correctly identified, they also allow screen reader users to quickly navigate from heading to heading. ✎ Technique: Heading structure The heading levels (1-6) are often considered a way of describing and determining the “importance” of a heading, with h1 being the most important."
year_published = 2025
