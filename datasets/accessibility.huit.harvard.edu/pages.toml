title = "Digital Accessibility for the Modern Workplace (with Audio Descriptions) | Digital Accessibility​"
description = "The move towards a more digital workplace affects everyone, from newly remote employees to frontline workers. With technology being such a critical part of how we do our jobs, having accessible solutions is essential to providing an inclusive workplace."
full_description = "Digital Accessibility for the Modern Workplace (with Audio Descriptions) Course Overview Level: Intermediate Course length: 1 hour Platform: LinkedIn Learning Course Description The move towards a more digital workplace affects everyone, from newly remote employees to frontline workers. With technology being such a critical part of how we do our jobs, having accessible solutions is essential to providing an inclusive workplace. In this course, join Hector Minto, an accessibility evangelist at Microsoft, as he shares how to use accessibility solutions across your tools and processes. Hector covers the importance of accessibility, as well as how modern trends have brought accessibility to the forefront. He also shares technology solutions for each type of disability and provides best practices for developing more inclusive experiences in your meetings, emails, presentations, and social media posts. After taking this course, you’ll have the tools you need to start creating a work environment that is inclusive. Note: To view a version of this course with audio descriptions, see Digital Accessibility for the Modern Workplace (with Audio Descriptions). Please contact digitalaccessibility@harvard.edu with any questions or accommodation requests. Launch in the Training Portal See also: All Self-Paced Trainings Intro to Accessibility LinkedIn Learning"
