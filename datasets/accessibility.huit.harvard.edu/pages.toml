title = "Support keyboard interaction ✎ | Digital Accessibility​"
description = "Make it easier for users to interact with added content. Tooltips, drop-down menus, and popups are examples of added content."
full_description = "✎ Technique: Content on hover or focus Page Make it easier for users to interact with added content. Tooltips, drop-down menus, and popups are examples of added content. ✎ Technique: Character key shortcuts Page If keyboard shortcuts are implemented using only a letter (including upper- and lower-case letters), punctuation, number, or symbol characters, provide a way to turn off or remap character key shortcuts. ✎ Technique: Accessible modal dialogs Page Modal dialogs can enhance usability by focusing attention on a specific message that requires a user action to continue. An accessible modal dialog is one where keyboard focus is managed properly, and the correct information is exposed to screen readers. ✎ Technique: Expandable sections Page Expandables (sometimes called “collapsible” or “disclosure widgets”) are simple interface patterns that allow you to expand and collapse content. ✎ Technique: Focus order and tabindex Page Interactive elements should, under most circumstances, be focusable in the order that they appear in the source code. This helps people who are using the keyboard or alternative input devices to follow focus in a logical order. ✎ Technique: Keyboard operable custom controls Page Sometimes, design requirements mean that you need to create a custom interactive element rather than using a native HTML element. Your element will not be accessible by keyboard unless it is included in focus order and it can be activated using keys. ✎ Technique: Managing focus and inactive elements Page If an active element is intended to be unavailable in a particular state and it’s hidden from view, it should not be able to receive focus. ✎ Technique: Keyboard accessible links Page Links ( elements) are focusable by default, so it should normally be possible to activate them using the keyboard. However, under certain circumstances, they are not focusable."
year_published = 2025
