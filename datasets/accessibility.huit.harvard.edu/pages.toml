["https://accessibility.huit.harvard.edu/pdf-vendors"]
title = "Document Remediation Vendors | Digital Accessibility​"
full_description = "Document Remediation Vendors Docs and PDFs are a versatile and convenient way to share information. But, if they are not created with accessibility in mind, barriers may be present that make the content confusing or inaccessible. While there are best practices to follow in order to create accessible documents, if you are short on time or have a particularly complex document, there are also Harvard preferred vendors for document remediation you may hire to fix the document for you for a cost. GrackleDocs (formerly AbleDocs) How it works Create an account and upload your document on GrackleDocs to receive a quote for the cost of the remediation work. After approval of cost, work will be completed within the agreed time frame. Considerations GrackleDocs will not make modifications to the colors within the document. As such, we recommend verifying that the document has high color contrast and is not using color alone to convey meaning. Pricing Simple Documents - Starts at $5/page with $25 minimum charge per document Complex Documents - Starts at $12/page with $25 minimum charge per document Fillable forms or those requiring Optical Character Recognition (OCR) - Starts at $55/page Questions Contact production@grackledocs.com. Documenta11y by Apex CoVantage How it works Upload your document to the Documenta11y portal to receive a quote for the cost of the remediation work. After approval of cost, work will be completed within the agreed time frame. Considerations Documenta11y will write alt text and will modify color contrast, if requested. They do not make changes to use of color for meaning. As such, we recommend verifying that the document is not using color alone to convey meaning. Pricing Simple Documents - $4/page Complex Documents - $8/page Fillable forms or those requiring Optical Character Recognition (OCR) - $8/page Accessible EPUB3 Conversion: $1 per page Note: Prices are calculated per page and there’s no fixed minimum charges per document. Questions Contact support@documenta11y.com."
