["https://accessibility.huit.harvard.edu/accessibility-questions-vendors"]
title = "Accessibility questions for vendors | Digital Accessibility​"
description = "These questions can help you start a conversation with the vendor about their commitment to accessibility in their work."
full_description = '''Accessibility questions for vendors When engaging with a vendor for a technology product or service, it's important to assess their experience with accessibility so that you can determine their ability to comply with Harvard's Policy. These questions can help you start a conversation with the vendor about their commitment to accessibility in their work. Overall approach to accessibility What is the name, title, and contact information for the most appropriate accessibility contact for the product or service under consideration? What is your approach to ensuring accessibility in your product or service? Provide examples of how you have done so in the past. Product/Service documentation What accessibility documentation exists for this product or service, such as a Voluntary Product Accessibility Template (VPAT) or Accessibility Conformance Report (ACR)? When was that documentation last updated? The Harvard Digital Accessibility Policy cites WCAG 2.1 AA as its standard. What technical or legal accessibility standard of conformance do you adhere to for the product or service in question? Can you provide a current, detailed plan for accessibility improvements to be made on your product or service, with dates of intended delivery? Testing and user experience How do you test your product or service for accessibility? Do you have accessibility testers in-house, for example, in the quality assurance department, or do you hire an outside accessibility consultant? Can you provide a live or recorded demo of the product or service being used with assistive technology (i.e. screen reader and/or non-mouse input)? Does your product or service rely on activating a special "accessibility mode," a "lite version," or accessing an alternate interface for accessibility purposes? Describe the process of a user reporting an accessibility issue and examples of how you’ve used that feedback to improve your product or service. Upcoming Procurement Training Accessibility in Technology Procurement Apr. 2, 2025 2:00PM - 3:00PM Virtual All instructor-led trainingsarrow_circle_right'''
