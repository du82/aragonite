full_description = "Designing with the WCAG 2.2 Guidelines Course Overview Level: Intermediate Course length: 30 minutes Platform: LinkedIn Learning Course Description Get an overview of the new WCAG 2.2 accessibility guidelines and their impact on web/digital projects with expert Emma Moore, and explore techniques for fixing and/or addressing inaccessible projects in Figma. Topics covered include: the basics of WCAG 2.2 and its guidelines for digital projects; key specific issues that WCAG 2.2 is likely to draw attention to in existing sites and projects; how to identify inaccessible assets and content elements directly, and in Figma; and How to identify inaccessible patterns and optimize for the new guidelines. Also learn strategies for collaborating with project developers to assure a11y (accessibility) is strong, and get some hands-on examples of Figma solutions to a11y issues. Please contact digitalaccessibility@harvard.edu with any questions or accommodation requests. Launch in the Training Portal See also: All Self-Paced Trainings Digital Content LinkedIn Learning Design"
