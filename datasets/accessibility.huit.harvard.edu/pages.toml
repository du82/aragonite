["https://accessibility.huit.harvard.edu/provide-visual-and-semantic-structure"]
title = "Provide visual and semantic structure | Digital Accessibility​"
description = "Using visual characteristics can be a powerful and effective way to communicate information. But if you don’t make that same information available in another way, people who can’t see these visual characteristics won’t have access to that information."
full_description = "Provide visual and semantic structure Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Structure expand_more Provide visual and semantic structure Identify headings, lists, and tables Provide accessible documents and services Wayfinding Presentation Language Images and Media For Developers For Faculty For Managers For Purchasers Using visual characteristics can be a powerful and effective way to communicate information, whether by using color or by referring to visual location, appearance, size, or orientation. But if you don’t make that same information available in another way, people who can’t see these visual characteristics won’t have access to that information. The following instructions use visual characteristics to identify controls. But people who cannot perceive color or spatial information will not be able to follow these instructions. Click on the pink arrow Select an option from the menu on the right When using visual characteristics, make sure the information is also available to people who can’t see color: Provide another cue. Use color as a way to convey information to people who can perceive color, but also provide the information in another way for people who can’t see color—in text, for example. Provide meaningful labels. Give controls such as links and menus meaningful labels and titles so that people understand what they do without needing instructions. Testing Print out your page in black and white. Do its information and instructions make sense when color isn’t available? Read your page to someone who isn’t looking at the screen. Can they make sense of everything they hear? Check your page for references to visual appearance, size, position, or orientation. Is this information provided in a way that's understandable to someone who can't see? Resources Understanding WCAG SC 1.3.3—Sensory Characteristics (WAI) Understanding WCAG SC 1.4.1—Use of Color (WAI) Related Techniques ✎ Technique: Structuring content Adding structure to web content makes it more readable and comprehensible to everyone and especially to people with a visual or cognitive impairment that makes reading on-screen content difficult. ✎ Technique: Referring to page content by its position Avoid referring to a button, menu, or other item in the page only by its position on the page; instead, use additional information that describes the content. ✎ Technique: Using color to convey information Color is a powerful visual means of presenting or distinguishing information, but when you use color to identify or distinguish information, make sure that this information is still available to people who can't perceive color."
