["https://accessibility.huit.harvard.edu/accessible-documents"]
title = "Accessible Documents | Digital Accessibility​"
description = "Steps you can take, such as tagging your document with headings, being mindful of color, and using formatting techniques, that will make your document more accessible to more people."
full_description = "Accessible Documents Accessible documents are easier to understand and read for all of your users, not just users with disabilities. There are steps you can take, such as tagging your document with headings, being mindful of color, and using formatting techniques that will make your document more accessible to more people. If you'd like to improve your file with an automated first pass, try the Harvard licensed tool SensusAccess - Convert a File. If you need a professionally remediated accessible doc fast, consider using one of Harvard's preferred document remediation vendors: AbleDocs or Documenta11y (by Apex CoVantage). Guidance By Document Type Documents Microsoft Word Google Docs Slides PowerPoint Slides Google Slides PDFs Accessible PDFs Key concepts for accessible documents Accessibility Check: Use available Accessibility Tools to run an accessibility check of the document as you work. Document Metadata: Add metadata information, such as Title, Author, Language. Alt Text: Ensure meaningful images have alternative text and decorative images are marked as “decorative,” if possible. Headings: Use concise headings to delineate sections of your document. Tag and order them like an outline. Color: Choose colors that provide adequate contrast and don’t rely on color alone to convey meaning. Upcoming Document Trainings Creating Accessible Slides Mar. 4, 2025 10:00AM - 11:30AM Virtual - Zoom Virtual Creating Accessible Documents Mar. 19, 2025 10:00AM - 11:30AM Virtual - Zoom Virtual Creating Accessible PDFs Apr. 1, 2025 2:00PM - 4:00PM Virtual - Zoom Virtual All instructor-led trainingsarrow_circle_right DAS Office Hours Want to check your content accessibility with Digital Accessibility Services (DAS)? Stop by one of our upcoming Office Hours! We hold open office hours in a Zoom meeting room on the 2nd and 4th Fridays of each month from 10am-12pm. Upcoming DAS Office Hours arrow_circle_right"
year_published = 2025
