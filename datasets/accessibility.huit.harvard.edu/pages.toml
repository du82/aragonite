["https://accessibility.huit.harvard.edu/web-technologies/word"]
title = "Word | Digital Accessibility​"
description = "Headings are used to group and label sections of content, giving visual structure to the page and providing a means of navigation to screen reader users."
full_description = "✎ Technique: Writing headings Page Headings are used to group and label sections of content, giving visual structure to the page and providing a means of navigation to screen reader users. ✎ Technique: Writing readable content Page Readable content is accessible content. You should aim to choose words and sentence structures that are not difficult or unnecessarily time-consuming to read for your target audience. ✎ Technique: Writing web page titles Page The title of a web page is the page's accessible name. To be as helpful as possible, the title should briefly tell the user what the page is about and where they are within the site. ✎ Technique: Referring to page content by its position Page Avoid referring to a button, menu, or other item in the page only by its position on the page; instead, use additional information that describes the content. ✎ Technique: Identifying lists of content Page When you include a list in your page content, this relationship needs to be conveyed visually, and it also needs to be conveyed to people using screen readers. ✎ Technique: Identifying headings Page Headings are important orientation aids, and they help people quickly identify the content on your page. When headings are correctly identified, they also allow screen reader users to quickly navigate from heading to heading. ✎ Technique: Readable paragraph text Page Paragraphs of text are a fundamental core of web content. It's important to display them in a fashion that is optimally readable to the majority of your audience. ✎ Technique: Heading structure Page The heading levels (1-6) are often considered a way of describing and determining the “importance” of a heading, with h1 being the most important. ✎ Technique: Using diagrams to illustrate text Page While accessibility for images often focuses on providing a text alternative for screen reader users, we can also look at the issue another way—providing a graphic alternative for text to make the underlying information or concept easier to understand."
year_published = 2025
