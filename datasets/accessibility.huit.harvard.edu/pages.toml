title = "Focus | Digital Accessibility​"
description = """
Modal dialogs can enhance usability by focusing attention on a specific message that requires a user action to continue.
An accessible modal dialog is one where keyboard focus is managed properly, and the correct information is exposed to screen readers."""
full_description = "✎ Technique: Accessible modal dialogs Page Modal dialogs can enhance usability by focusing attention on a specific message that requires a user action to continue. An accessible modal dialog is one where keyboard focus is managed properly, and the correct information is exposed to screen readers. ✎ Technique: Expandable sections Page Expandables (sometimes called “collapsible” or “disclosure widgets”) are simple interface patterns that allow you to expand and collapse content. Focus Content tagged with Focus Not finding what you're looking for? Try using Advanced Search. Sort by: Date descendingDate ascendingAlphabetical A-ZAlphabetical Z-A sort Not finding what you're looking for? Try using Advanced Search. ✎ Technique: Accessible modal dialogs Page Modal dialogs can enhance usability by focusing attention on a specific message that requires a user action to continue. An accessible modal dialog is one where keyboard focus is managed properly, and the correct information is exposed to screen readers. ✎ Technique: Expandable sections Page Expandables (sometimes called “collapsible” or “disclosure widgets”) are simple interface patterns that allow you to expand and collapse content."
