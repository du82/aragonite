["https://accessibility.huit.harvard.edu/microsoft-powerpoint"]
title = "Create Accessible PowerPoint Presentations | Digital Accessibility​"
description = """
Want to check your content accessibility with Digital Accessibility Services (DAS)? Stop by one of our upcoming Office Hours!
We hold open office hours in a Zoom meeting room on the 2nd and 4th Fridays of each month from 10am-12pm."""
full_description = '''Create Accessible PowerPoint Presentations 1. Use an Accessibility Checker Use the Microsoft Accessibility Checker to create accessible documents. The Accessibility Checker is available in Word, PowerPoint, and Excel. It is turned on by default for Harvard clients and keeps track of accessibility issues in real time. It is displayed at the bottom of the Microsoft program in the status bar. You can view issues found by selecting the Accessibility icon button in the status bar. While automated checkers won’t catch every issue, they are a great tool to have in your tool set and are a good reminder that we should be thinking about accessibility when creating or editing content. These are steps to to create accessible documents in Microsoft Office. 2. Add File Metadata Add Metadata for your file to clearly identify it to your audience. Give the file a clear title and file name. Identify the language of the document. How to add Metadata In your program, modify the displayed file name and navigate to File settings to change the language. 3. Write Unique and Descriptive Slide Titles Slide titles provide an outline and improve navigation making your document more accessible. Each slide should have a unique title. For slides that may be on the same topic, try something like Goals 1 of 3, Goals 2 of 3, Goals 3 of 3. 4. Format Text for Legibility Format your text so that it is easier for your audience to read. Consider using a sans serif font, setting line spacing to 1.5. Keep text left-aligned when possible to allow users to easily identify new lines. Keep font at a standard size or larger. For documents, that is 11pt and for slide presentations 18pt. 5. Break Content into Lists, Where Possible Browse your document to see if any paragraphs would be easier to read as a list.Lists make content easier to read by providing visual structure and highlighting key points. How to add a List Use the Paragraph Panel to select a bullet or numbered list. 6. Write Descriptive Links Write link text so that it is unique, descriptive, and clear about where the link goes. If sharing documents for printing, consider including both a descriptive link and the full link text. Find additional guidance: How to Write Helpful Links. How to edit Link Text Select and highlight the text you would like to link. Right click and chose edit link text. 7. Add Alt Text to Images Add alternative text for all non-decorative images to convey the equivalent information to someone who may not be able to see the image. Keep it short and descriptive, like a tweet. Don’t include “image of” or “photo of”. For some examples, visit our page on alt text. How to add Alt Text In most programs, right-click on image to bring up a menu with the options "Add Alt Text" or "Edit Image." 8. Use High Color Contrast Choose a color for your text and other elements that has a high degree of contrast against the background color. For web content, the standard is 4.5:1 for most text. Avoid light text on light backgrounds and dark text on dark backgrounds. How to check Color Contrast Some of the automated accessibility checkers will alert you to color errors as you work. To test on your own, try downloading a desktop tool, such as the TPGi's Color Contrast Analyser. 9. Avoid Using Color Alone to Convey Meaning Avoid using color alone to convey meaning, as your message may be missed or misunderstood by individuals who can't see color. Instead use color along with a secondary element, (such as shape or text differences) to ensure the meaning can be understood without the use of color alone. 10. Review the Reading Order of Content on Each Slide Verifying the reading order ensures that screen readers and assistive technology can read material in the order it is meant to be presented. Use the tab key on each slide to see content selected in the order that it will be read How to change the Reading Order PowerPoint: You can inspect and change the order on each slide using the ”Selection Pane” Tool. Slide Title should be at the bottom of the list. Slides: You can reorder slide elements by right clicking on each and selecting "Order" and then sending elements backwards or forwards. Slide Title should be at the very "back" Related Instructor-Led Trainings Creating Accessible Slides Mar. 4, 2025 10:00AM - 11:30AM Virtual Creating Accessible Documents Mar. 19, 2025 10:00AM - 11:30AM Virtual Creating Accessible PDFs Apr. 1, 2025 2:00PM - 4:00PM Virtual DAS Office Hours Want to check your content accessibility with Digital Accessibility Services (DAS)? Stop by one of our upcoming Office Hours! We hold open office hours in a Zoom meeting room on the 2nd and 4th Fridays of each month from 10am-12pm. DAS Office Hours Mar. 14, 2025 10:00AM - 12:00PM Virtual DAS Office Hours Mar. 28, 2025 10:00AM - 12:00PM Virtual DAS Office Hours Apr. 11, 2025 10:00AM - 12:00PM Virtual All upcoming Office Hoursarrow_circle_right'''
year_published = 2025
