["https://accessibility.huit.harvard.edu/access-technologies/speech-recognition"]
title = "Speech recognition | Digital Accessibility​"
description = "Media player accessibility is essential for video content. Evaluate the accessibility and cross-device compatibility of the media player that comes with your video-distribution platform."
full_description = "✎ Technique: Choosing a media player Page Media player accessibility is essential for video content. Evaluate the accessibility and cross-device compatibility of the media player that comes with your video-distribution platform. ✎ Technique: Autocomplete input controls Page Autocomplete widgets can be helpful for accessibility because they can make it easier to enter text by providing suggestions based on the characters initially typed. ✎ Technique: Session extension Page For a number of reasons including data persistence, performance and security, it is sometimes beneficial to terminate idle user sessions. It's important to warn people a session is about to expire and give them the option to continue. ✎ Technique: Accessible modal dialogs Page Modal dialogs can enhance usability by focusing attention on a specific message that requires a user action to continue. An accessible modal dialog is one where keyboard focus is managed properly, and the correct information is exposed to screen readers. ✎ Technique: Expandable sections Page Expandables (sometimes called “collapsible” or “disclosure widgets”) are simple interface patterns that allow you to expand and collapse content. ✎ Technique: Focus order and tabindex Page Interactive elements should, under most circumstances, be focusable in the order that they appear in the source code. This helps people who are using the keyboard or alternative input devices to follow focus in a logical order. ✎ Technique: Paragraph link focus indication Page All interactive elements should indicate when they’re focused so that users know which element they are currently interacting with. This is where focus styles come into play. ✎ Technique: Keyboard operable custom controls Page Sometimes, design requirements mean that you need to create a custom interactive element rather than using a native HTML element. Your element will not be accessible by keyboard unless it is included in focus order and it can be activated using keys."
year_published = 2025
