["https://accessibility.huit.harvard.edu/use-images-and-media-enhance-understanding"]
title = "Use images and media to enhance understanding | Digital Accessibility​"
description = "While accessibility for images often focuses on providing a text alternative for screen reader users, we can also look at the issue another way—providing a graphic alternative for text to make the underlying information or concept easier to understand."
full_description = "Use images and media to enhance understanding Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media Images and Media expand_more Use images and media to enhance understanding Write helpful Alt Text to describe images Provide captions and descriptions of video For Developers For Faculty For Managers For Purchasers Images and media are powerful communication devices. They are useful for conveying concepts and information, and they can help improve comprehension by reinforcing information provided in text. But images and media attract and engage our attention. Because they are so arresting, it’s important to be purposeful in their use so they do not detract from the purpose of the page. Gratuitous images and media add unnecessary complexity and may cause confusion. Use images and media to their best effect: Include images and media that support your content. Include images and media that support or add to the information and concepts of the page. Avoid meaningless images. Don’t add images to ”spice up” a page, or create a video simply for the sake of including video. Testing For each image and item of media, does it directly support the information and context on the page? Resources Images Can Enhance Comprehension (WebAIM) Guidelines for images and video on social media (HarvardKey required) Related Techniques ✎ Technique: Using diagrams to illustrate text While accessibility for images often focuses on providing a text alternative for screen reader users, we can also look at the issue another way—providing a graphic alternative for text to make the underlying information or concept easier to understand. ✎ Technique: Using diagrams to illustrate text While accessibility for images often focuses on providing a text alternative for screen reader users, we can also look at the issue another way—providing a graphic alternative for text to make the underlying information or concept easier to understand."
