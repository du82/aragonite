["https://accessibility.huit.harvard.edu/principles/robust"]
title = "Robust | Digital Accessibility​"
description = "Assistive technology users should be able to detect when important changes occur on a web page, With the use of a status message, information can be provided to the user without changing focus or unnecessarily interrupting their work."
full_description = "✎ Technique: Status messages Page Assistive technology users should be able to detect when important changes occur on a web page, With the use of a status message, information can be provided to the user without changing focus or unnecessarily interrupting their work. ✎ Technique: Autocomplete input controls Page Autocomplete widgets can be helpful for accessibility because they can make it easier to enter text by providing suggestions based on the characters initially typed. ✎ Technique: Form feedback with live regions Page Providing form feedback accessibly helps users submit data more accurately and reduces the chance for error. ✎ Technique: Accessible modal dialogs Page Modal dialogs can enhance usability by focusing attention on a specific message that requires a user action to continue. An accessible modal dialog is one where keyboard focus is managed properly, and the correct information is exposed to screen readers. ✎ Technique: Expandable sections Page Expandables (sometimes called “collapsible” or “disclosure widgets”) are simple interface patterns that allow you to expand and collapse content. ✎ Technique: Accessible names for buttons Page Whether you provide controls using standard HTML elements or create custom controls, ensure that controls are given appropriate names. ✎ Technique: Input labels Page Descriptive labels help users understand the purpose of a form control. Labels should be associated with their controls so that when the input is focused, the label is announced by screen readers. ✎ Technique: Icon fonts Page Icon fonts are a popular and effective method for providing scalable symbols that can be used to label controls and provide graphical information. The information provided by icons also needs to be available to people who can’t see them."
year_published = 2025
