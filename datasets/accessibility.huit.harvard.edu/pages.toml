["https://accessibility.huit.harvard.edu/purpose"]
title = "Purpose | Digital Accessibility​"
description = "Websites that are purposeful and straightforward are easier for everyone to use."
full_description = "Purpose Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Purpose expand_more Design for clarity and simplicity Structure Wayfinding Presentation Language Images and Media For Developers For Faculty For Managers For Purchasers Clear Purpose: Well-Defined GoalsPeople enjoy products that are designed for the audience and guided by a defined purpose and goals. Websites that are purposeful and straightforward are easier for everyone to use. They make clear what is offered and how to find it without the confusion caused by extraneous clutter. Users can focus on the task at hand and achieve their goals quickly and successfully. And designing a site with a clear purpose in mind helps focus efforts on the content and features that matter, to both users and site owners. When content creators focus on clear purpose: People are not distracted by irrelevant content and features People using assistive technology do not encounter unnecessary obstacles and clutter Content creators can focus efforts on content and features that provide the greatest impact"
