title = "Practical Accessibility for Designers | Digital Accessibility​"
description = "Take a deep look at designing and building accessible experiences with expert Chimmy Kalu, including practical examples and exercises to help personalize the learning experience. Chimmy offers a new perspective on accessibility in your designs and explains why prioritizing accessibility is a requirement in today’s world."
full_description = "Practical Accessibility for Designers Course Overview Level: Beginner Course length: 2 hours Platform: LinkedIn Learning Course Description Take a deep look at designing and building accessible experiences with expert Chimmy Kalu, including practical examples and exercises to help personalize the learning experience. Chimmy offers a new perspective on accessibility in your designs and explains why prioritizing accessibility is a requirement in today’s world. She defines accessibility and goes over two common accessibility standards, as well as ways to test web accessibility. Chimmy devotes much of the course to deep dives into making websites work for people with vision impairments, D/deaf people, and neurodiverse people. Plus, she shows you some topics you should consider, to ensure that people can use your website, regardless of their mobility status. Please contact digitalaccessibility@harvard.edu with any questions or accommodation requests. Launch in the Training Portal See also: All Self-Paced Trainings LinkedIn Learning Design"
