full_description = "Accessibility Services at Harvard Training and Support Training and Support expand_more Instructor-Led Trainings Instructor-Led Trainings expand_more Learning Paths Self-Paced Trainings DAS Office Hours Accessibility Services As a member of the Harvard community, you have access to offices and services that can assist you throughout every step of the accessibility process. Whether you're working to create accessible digital content, find information about accessible events, or if you have general questions about accessibility, reach out to one of these offices to find the support you need. Digital Accessibility Services (DAS) As part of Harvard University Information Technology, DAS supports the Harvard community in making sure that everyone has the opportunity to access the university’s knowledge, ideas, and resources. DAS offers training, consultation, and resources on accessibility for content creators and developers. DAS also maintains this website (accessibility.huit.harvard.edu). Email digitalaccessibility@harvard.edu for questions regarding digital accessibility, Harvard's Digital Accessibility Policy, trainings, consultations, and resources. Meet the DAS team Upcoming Trainings and Office Hours University Disability Resources (UDR) UDR provides leadership and guidance on university best practices, employee disability accommodations, planning accessible events, finding accessibility vendors, and consultation on physical access or renovations, while ensuring compliance with federal and state regulations. Visit UDR's website Digital Accessibility Liaisons (DAL) The network of DALs coordinates local efforts, facilitates training, and monitors progress. At least one DAL has been appointed to represent each school and administrative unit. View the list of DALs Browse the DAL Portal"
