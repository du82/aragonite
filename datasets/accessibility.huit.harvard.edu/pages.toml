["https://accessibility.huit.harvard.edu/technologies/forms"]
title = "Forms | Digital Accessibility​"
description = "Make it easier for people to complete input fields requesting personal information."
full_description = "✎ Technique: Identify input purpose Page Make it easier for people to complete input fields requesting personal information. ✎ Technique: Required fields Page A clear indication that specific form fields are required can save users time and avoid potential errors relating to missing data when a form is submitted. ✎ Technique: Form error communication Page Effectively and accessibly communicate form errors by: Communicating that a form has errors, Communicating any individual errors case by case, including clear guidance on how to address the error. ✎ Technique: Form feedback with live regions Page Providing form feedback accessibly helps users submit data more accurately and reduces the chance for error. ✎ Technique: Input labels Page Descriptive labels help users understand the purpose of a form control. Labels should be associated with their controls so that when the input is focused, the label is announced by screen readers. Provide helpful error messages Page People with visual, cognitive and physical impairments are particularly prone to making errors when entering data through forms. When errors resulting from form input happen, it’s important to make sure that error messages are shown accessibly. Provide name, role, and value information Page Users of assistive technologies must understand what a custom control is and what it does. Custom controls that lack accessibility information become difficult or impossible to understand or operate. Provide accessible labels and instructions Page Forms need to be designed so that the purpose of each control is clear."
