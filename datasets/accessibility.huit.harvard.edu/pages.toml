full_description = "Multimedia Accessibility - Self-Paced Media Alternatives for Video and Audio Content In this on-demand course, you’ll learn how to ensure that multimedia, such as videos and podcasts, is accessible and inclusive to everyone. You’ll learn why captions, transcripts, and audio descriptions are essential for users with disabilities, and how they are beneficial for all users. The course also covers practical steps for implementing media alternatives, with guidance on using vendors and accessing Harvard’s discount pricing. Approximate time to complete: 30 minutes Launch in the Training Portal Self-Paced CoursesAudience: AnyoneAudio: YesCourse Length: 30 minutesPlease email: digitalaccessibility@harvard.edu with questions or accommodation requests. See also: All Self-Paced Trainings DAS created Multimedia"
