["https://accessibility.huit.harvard.edu/content/identify-headings-lists-and-tables"]
title = "Identify headings, lists, and tables ✎ | Digital Accessibility​"
description = "The  element is for data that one might find in a spreadsheet, consisting of rows and columns of cells. It's important to ensure that the editing process allows identifying row and column headers."
full_description = "✎ Technique: Building tables Page The element is for data that one might find in a spreadsheet, consisting of rows and columns of cells. It's important to ensure that the editing process allows identifying row and column headers. ✎ Technique: Identifying lists of content Page When you include a list in your page content, this relationship needs to be conveyed visually, and it also needs to be conveyed to people using screen readers. ✎ Technique: Identifying headings Page Headings are important orientation aids, and they help people quickly identify the content on your page. When headings are correctly identified, they also allow screen reader users to quickly navigate from heading to heading. ✎ Technique: Heading structure Page The heading levels (1-6) are often considered a way of describing and determining the “importance” of a heading, with h1 being the most important."
