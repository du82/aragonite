["https://accessibility.huit.harvard.edu/content/provide-name-role-and-value-information"]
title = "Provide name, role, and value information ✎ | Digital Accessibility​"
description = "People with disabilities rely on interface controls that are used programmatically. These controls have a visual label, as well as a programmatic label, known as its Accessible Name."
full_description = "✎ Technique: Label in name Page People with disabilities rely on interface controls that are used programmatically. These controls have a visual label, as well as a programmatic label, known as its Accessible Name. ✎ Technique: Autocomplete input controls Page Autocomplete widgets can be helpful for accessibility because they can make it easier to enter text by providing suggestions based on the characters initially typed. ✎ Technique: Required fields Page A clear indication that specific form fields are required can save users time and avoid potential errors relating to missing data when a form is submitted. ✎ Technique: Accessible modal dialogs Page Modal dialogs can enhance usability by focusing attention on a specific message that requires a user action to continue. An accessible modal dialog is one where keyboard focus is managed properly, and the correct information is exposed to screen readers. ✎ Technique: Expandable sections Page Expandables (sometimes called “collapsible” or “disclosure widgets”) are simple interface patterns that allow you to expand and collapse content. ✎ Technique: Accessible names for buttons Page Whether you provide controls using standard HTML elements or create custom controls, ensure that controls are given appropriate names. ✎ Technique: Input labels Page Descriptive labels help users understand the purpose of a form control. Labels should be associated with their controls so that when the input is focused, the label is announced by screen readers. ✎ Technique: Icon fonts Page Icon fonts are a popular and effective method for providing scalable symbols that can be used to label controls and provide graphical information. The information provided by icons also needs to be available to people who can’t see them."
year_published = 2025
