["https://accessibility.huit.harvard.edu/accessibility-topics/inputs"]
title = "Inputs | Digital Accessibility​"
description = "Make it easier for people to complete input fields requesting personal information."
full_description = "✎ Technique: Identify input purpose Page Make it easier for people to complete input fields requesting personal information. ✎ Technique: Content on hover or focus Page Make it easier for users to interact with added content. Tooltips, drop-down menus, and popups are examples of added content. ✎ Technique: Character key shortcuts Page If keyboard shortcuts are implemented using only a letter (including upper- and lower-case letters), punctuation, number, or symbol characters, provide a way to turn off or remap character key shortcuts. ✎ Technique: Pointer gestures Page All operations must use simple gestures that need only a single touch. If the site or application does use multi-touch gestures, be sure to also provide simple interfaces. ✎ Technique: Referring to page content by its position Page Avoid referring to a button, menu, or other item in the page only by its position on the page; instead, use additional information that describes the content. ✎ Technique: Site search Page It's important the search facility on your site is logically and conventionally placed and constructed for optimal accessibility. ✎ Technique: Using color to convey information Page Color is a powerful visual means of presenting or distinguishing information, but when you use color to identify or distinguish information, make sure that this information is still available to people who can't perceive color. ✎ Technique: Autocomplete input controls Page Autocomplete widgets can be helpful for accessibility because they can make it easier to enter text by providing suggestions based on the characters initially typed. ✎ Technique: Required fields Page A clear indication that specific form fields are required can save users time and avoid potential errors relating to missing data when a form is submitted. ✎ Technique: Form error communication Page Effectively and accessibly communicate form errors by: Communicating that a form has errors, Communicating any individual errors case by case, including clear guidance on how to address the error."
year_published = 2025
