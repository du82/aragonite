full_description = "Essentials for Developers Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media For Developers For Developers expand_more Essentials for Developers Structure - Developers Interaction - Developers Presentation - Developers Images and Media - Developers For Faculty For Managers For Purchasers 1. Semantic Markup: Do all elements have the correct semantic markup? Relevant Explanation: Use Semantic Elements for Regions and Content Examples of relevant techniques: Use Heading Structure Create Main Landmark 2. Input Labels: Are there descriptive labels marking each input element, and labels for input groups? Relevant Explanation: Provide Accessible Labels and Instructions Examples of relevant techniques: Create Descriptive Input Labels Indicate Required Fields 3. Focus: Is there an indicator when interactive elements have keyboard focus, and does its order follow a logical sequence? Relevant Explanation: Provide Logical and Visible Focus Indication Examples of relevant techniques: Provide Focus Order for Interactive Elements Indicate Paragraph Link Focus Managing focus and inactive elements 4. Keyboard: Can all interactive elements be selected and activated using the keyboard? Relevant Explanation: Support Keyboard Interaction Examples of relevant techniques: Create Accessible Modal Dialogs Create Accessible Expandable Sections Create Custom Controls that are Keyboard Operable 5. Names: Do all interactive controls have an accessible descriptive name? Relevant explanation: Custom Widgets and Controls Example of relevant technique: Provide Accessible Names for Buttons 6. Roles: Do all custom controls and widgets have the correct role (e.g., link, button, tab panel)? Relevant explanation: Provide Name Role and Value Information Example of relevant technique: Autocomplete Input Controls 7. Dynamic Updates: Are all dynamic updates, including error messages, conveyed to assistive technology? Relevant explanation: Provide Notification of Dynamic Changes to Content Example of relevant technique: Form Feedback with Live Regions 8. Colors: Does the design provide sufficient color contrast? Relevant explanation: Avoid Reliance on Color Example of relevant technique: Indicate Required Fields without Reliance on Color Indicate Accessible Current Page without Reliance on Color 9. Layouts: Do page layouts adapt to different window widths and text sizes? Relevant explanation: Support Flexibility and Adaptation Example of relevant technique: Enable Text Resizing 10. Images: Do images and icons have the appropriate text alternative? Relevant explanation: Provide Accessible Images Examples of relevant techniques: Provide Icon Information to Users of Assistive Technology Provide Useful Alternative Text Related: Tools and checklists Tools for evaluating accessibility of content and controls. Easy Checks—A First Review of Web Accessibility (WAI)—quick and easy ways to assess the accessibility of your web pages. Upcoming Developer Training Web Accessibility in HTML & CSS Jun. 26, 2025 10:00AM - 4:00PM Virtual Learn how the HTML and CSS that you write or edit can make or break the usability of a site for people with disabilities. Through examples and activities, we'll cover essential steps in designing for accessibility. Attendees should understand what... All trainingsarrow_circle_right"
