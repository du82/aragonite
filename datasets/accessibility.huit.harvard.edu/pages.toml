title = "Digital Accessibility Foundations Trainings | Digital Accessibility​"
full_description = "Digital Accessibility Foundations Trainings This training is held virtually via Zoom from 9 am - 11 am, and 1 pm - 3 pm over 2 days. The course is part of the IT Academy, but is open to all and recommended for anyone and everyone at Harvard. This course will cover: Introduction to accessibility – gain understanding about the meaning, history, and importance of digital accessibility, and the types of disabilities that people experience. Assistive Technology - explore a variety of technologies that people use to access digital content. Accessibility Policies and Practices at Harvard - hear more about Harvard’s Digital Accessibility Policy, Accessible Technology Procurement and Development Policy, and the recent Captioning Settlement Requirements. Accessible Content, Code, and Design - learn about core concepts of accessibility in web design and document creation. Tools for Assessment - discover and try out automated tools and manual checks for accessibility. Next Steps and Resources - reflect on shared resources and learn about concrete actions you can take to incorporate accessibility into your workflow. Upcoming Trainings Digital Accessibility Foundations Mar. 4 - Mar. 5, 2025 Virtual - Zoom Virtual Digital Accessibility Foundations Apr. 15, 2025 9:00AM - 3:00PM Virtual - Zoom Virtual Digital Accessibility Foundations Jun. 4 - Jun. 5, 2025 Virtual - Zoom Virtual Digital Accessibility Level II: Orientation Jun. 9, 2025 10:00AM - 11:00AM Virtual - Zoom Virtual"
