["https://accessibility.huit.harvard.edu/people/kyle-shachmut-0"]
title = "Kyle Shachmut | Digital Accessibility​"
full_description = "Kyle Shachmut Senior Director, Digital Accessibility Services I have been advancing digital inclusion at Harvard University since 2015, providing strategic direction to digital accessibility efforts across central administration and the schools. One of the best parts of working on accessibility at Harvard is collaborating with amazingly talented colleagues and partnering to make sure that the teaching and research mission of the university are available to everyone, including people with disabilities. Before joining DAS upon its founding in summer 2019, I worked on integrating accessibility into online learning experiences through a universal design approach at HarvardX in the Office of the Vice Provost for Advances in Learning and later on digital access from within University Disability Resources. I enjoy the intersection of innovative technology, digital inclusion, higher education policy, and related research. Beyond Harvard, I find it valuable to learn from and share with others who undertake similar work and enjoy facilitating such conversations as Co-chair of the EDUCAUSE IT Accessibility Community Group (join us!). I also serve on the Global Leadership Council (GLC) of the International Association of Accessibility Professionals (IAAP)."
