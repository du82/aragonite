["https://accessibility.huit.harvard.edu/html-essential-training"]
title = "HTML Essential Training | Digital Accessibility​"
description = "Hypertext Markup Language (HTML) is the foundation of website and web application development. It allows you to ensure that your content is understood by both segments of your audience: the people who watch, read, or listen to your content, and the computers that display it."
full_description = "HTML Essential Training Course Overview Level: Beginner Course length: 3 hours Platform: LinkedIn Learning Course Description Hypertext Markup Language (HTML) is the foundation of website and web application development. It allows you to ensure that your content is understood by both segments of your audience: the people who watch, read, or listen to your content, and the computers that display it. In this course, learn how to craft excellent HTML with the pieces that HTML itself has to offer. Instructor Jen Simmons highlights all of the fundamental concepts you need to use HTML thoughtfully. She focuses on semantic markup: tagging content as what it is, and not just for formatting, convention, or convenience. This has far-reaching impact for those who consume the web differently; it ensures that when a screen reader or a system (like a search engine) consumes a page, it knows exactly what it contains and how to categorize that information. Please contact digitalaccessibility@harvard.edu with any questions or accommodation requests. Launch in the Training Portal See also: All Self-Paced Trainings Development Digital Content LinkedIn Learning"
