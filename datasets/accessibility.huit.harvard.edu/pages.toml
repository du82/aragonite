full_description = "Content Essentials for Content Creators Creating accessible digital content is critical to ensuring an equitable experience for all users. A platform or website can be developed with accessible elements built in, but if the content added to the site isn't accessible, the whole site is at risk of introducing accessibility barriers. By thoughtfully following accessibility best practices for creating content, we can make sure our digital materials are accessible to everyone. Explore resources for Content Creators arrow_circle_right checklist Documents Guidance on creating accessible Microsoft Word and PowerPoint documents, as well as Google Docs and Slides. email Emails Guidelines and recommendations to help ensure your message comes through clearly to your audience. headphones Multimedia Explore accessibility practices for captions, transcripts, audio description, and social media. school Academic Content Whether you're developing course materials, adding content to Canvas, or building tests and quizzes, use this guide to get started creating academic content that is accessible and inclusive. bar_chart Data Visualizations, Charts, and Graphs Make sure data visualizations are accessible to everyone by being mindful of color, labels, descriptions, and design. ballot Forms Guidance on creating accessible digital forms in Qualtrics, Google Forms, and Microsoft Forms. Related Instructor-Led Trainings Creating Accessible Slides Mar. 4, 2025 10:00AM - 11:30AM Virtual - Zoom Virtual Digital Accessibility for Content Creators Mar. 5, 2025 2:00PM - 4:00PM Virtual - Zoom Virtual Creating Accessible Documents Mar. 19, 2025 10:00AM - 11:30AM Virtual - Zoom Virtual All instructor-led trainingsarrow_circle_right Self-Paced Training: Digital Accessibility for Content Creators In this training, you’ll learn essentials and best practices for creating digital content at Harvard that’s accessible to everyone. The material will be applicable across digital platforms, such as websites, documents, and learning management systems. Launch in the Training Portal (HarvardKey required) arrow_circle_right"
