["https://accessibility.huit.harvard.edu/principles/perceivable"]
title = "Perceivable | Digital Accessibility​"
description = "Content does not restrict its view and operation to a single display orientation, such as portrait or landscape, unless a specific display orientation is essential (i.e., bank check)."
full_description = "✎ Technique: Orientation Page Content does not restrict its view and operation to a single display orientation, such as portrait or landscape, unless a specific display orientation is essential (i.e., bank check). ✎ Technique: Identify input purpose Page Make it easier for people to complete input fields requesting personal information. ✎ Technique: Reflow Page Use responsive design to allow your content to zoom and respond to various screen sizes. ✎ Technique: Non-text contrast Page The contrast of icons and graphical objects is just as important as that of text. Use sufficient contrast for all elements on the screen, with a minimum contrast ratio of 3:1. ✎ Technique: Text spacing Page People with a variety of print disabilities (including low vision, dyslexia, other cognitive disabilities) can benefit from being able to increase the spacing between lines, words, and/or letters on their own device. ✎ Technique: Content on hover or focus Page Make it easier for users to interact with added content. Tooltips, drop-down menus, and popups are examples of added content. ✎ Technique: Label in name Page People with disabilities rely on interface controls that are used programmatically. These controls have a visual label, as well as a programmatic label, known as its Accessible Name. ✎ Technique: Checking color contrast Page Color-contrast-checking tools can compare two colors and report on the contrast ratio between them. Some tools will allow you to adjust these values until the ratio is sufficient, helping you to choose a color scheme that avoids contrast problems. ✎ Technique: Choosing a media player Page Media player accessibility is essential for video content. Evaluate the accessibility and cross-device compatibility of the media player that comes with your video-distribution platform. ✎ Technique: Building tables Page The element is for data that one might find in a spreadsheet, consisting of rows and columns of cells. It's important to ensure that the editing process allows identifying row and column headers."
year_published = 2025
