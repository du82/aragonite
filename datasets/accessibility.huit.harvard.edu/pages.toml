["https://accessibility.huit.harvard.edu/provide-notification-dynamic-changes-content"]
title = "Provide notification of dynamic changes to content | Digital Accessibility​"
description = "Assistive technology users should be able to detect when important changes occur on a web page, With the use of a status message, information can be provided to the user without changing focus or unnecessarily interrupting their work."
full_description = "Provide notification of dynamic changes to content Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media For Developers For Developers expand_more Essentials for Developers Structure - Developers Interaction - Developers Interaction - Developers expand_more Keyboard Custom widgets and controls Notifications and alerts Notifications and alerts expand_more Provide helpful error messages Give users control over timeouts Provide notification of dynamic changes to content Support navigation and wayfinding Presentation - Developers Images and Media - Developers For Faculty For Managers For Purchasers Where dynamic content is updated either automatically or in response to a user action, make sure that users are notified of this update in an accessible way. Make sure that the notification is appropriate to the type and importance of update that has taken place. For example, an update that reports an error or a problem may be considered more important than an update to a newsfeed that is shown as supplementary content to the main page. Identify content that may be updated as a WAI-ARIA live region. Use the aria-live attribute on the container of the content that may be updated or, in special cases, use one of the WAI-ARIA special live region roles. Make users aware of important changes in content. However, do so by clearly identifying critical updates versus information-only updates. Change focus only when an alert is critical to the user's current activity. Otherwise, don't force a focus change and/or interrupt the user's work. This guideline is especially useful to screen reader users and to those with cognitive disabilities. Provide a suitable priority for update notifications. Decide how important it is that a user hears the updated content and whether the screen reader should be interrupted from what it’s currently reading. This will influence what value you give the aria-live attribute. Testing For each piece of dynamically updated content, inspect the underlying code. Is it identified in code as a live region, with a suitable level of priority of notification? Listen to the page with a screen reader. Are notifications made in an accessible way, including making users aware of important changes in content? Resources Understanding WCAG SC 4.1.2—Name, Role, Value (WAI) Understanding WCAG SC 4.1.3—Status Message (WAI) Accessible notifications with ARIA Live Regions (Part 1) Accessible notifications with ARIA Live Regions (Part 2) Related Techniques ✎ Technique: Status messages Assistive technology users should be able to detect when important changes occur on a web page, With the use of a status message, information can be provided to the user without changing focus or unnecessarily interrupting their work. ✎ Technique: Form feedback with live regions Providing form feedback accessibly helps users submit data more accurately and reduces the chance for error."
year_published = 2025
