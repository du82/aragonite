["https://accessibility.huit.harvard.edu/learning-paths-accessibility"]
title = "Learning Paths for Accessibility | Digital Accessibility​"
description = "Digital Accessibility Services (DAS) offers a variety of instructor-led trainings. We've provided this guide to help you choose the most relevant training for your role and work - or mix and match to create a learning path that fits your schedule!"
full_description = "Learning Paths for Accessibility Digital Accessibility Services (DAS) offers a variety of instructor-led trainings. We've provided this guide to help you choose the most relevant trainings for your role and schedule, so that you can start incorporating accessibility in your everyday work. New to accessibility, or not sure where to start? Check out our brief self-paced training Introduction to Digital Accessibility at Harvard. Which training is right for me? We've created these suggested learning paths for various roles at Harvard. Choose one to follow, or create your own! Find descriptions of each course below. General Staff Anyone who writes emails, works on documents, and manages administrative tasks. Digital Accessibility for Content Creators OR Digital Accessibility Foundations Creating Accessible Documents, Slides, and PDFs Managers and Leaders Intro to Digital Accessibility & Harvard's Policies Accessibility in Technology Procurement Faculty and Teaching Assistants Digital Accessibility in Canvas Creating Accessible Documents, Slides, and PDFs Web Managers and Strategists Digital Accessibility for Content Creators OR Digital Accessibility Foundations Testing for Digital Accessibility Measuring Accessibility with Siteimprove Engineers and Developers Digital Accessibility for Content Creators OR Digital Accessibility Foundations Web Accessibility in HTML and CSS Digital Accessibility Trainings Expand each training to learn more about topics covered and intended audience. Digital Accessibility for Content Creators expand_more Digital Accessibility for Content Creators is platform-agnostic, meaning it focuses on content rather than platforms. So no matter if you’re publishing on a public-facing website, a staff portal, email, or document, you'll learn best practices for ensuring the content is accessible, no matter where it displays. We highly recommend this course to anyone who hasn’t taken it, as it’s a great introduction to accessibility and has practical takeaways that can be implemented anywhere, right away. There is also a self-paced option! Web Accessibility in HTML and CSS expand_more Web Accessibility in HTML and CSS is the next level after the Content Creator course, as it focuses on more technical implementation in HTML and CSS. Still applicable for anyone, even if you’re not a developer. Very practical and interactive. It’s only offered once per semester, but we can also host a custom session to your team of 10 or more! Digital Accessibility Foundations expand_more Digital Accessibility Foundations is a great overview of accessibility. It’s part of the IT Academy’s “T-shaped professional” program, which means that it’s required for all Harvard University Information Technology (HUIT) staff. Our other courses are more specifically focused, but the Foundations course is a sampling of many of those other topics, so attendees can choose to go deeper on a topic that interests them in related DAS trainings. Testing for Digital Accessibility expand_more Testing for Digital Accessibility focuses on automated tools and manual methods to test public and password-protected sites. It’s practical and applicable to anyone working on web interfaces. Measuring Accessibility with Siteimprove expand_more Measuring Accessibility with Siteimprove is a brief overview of a tool that tracks accessibility issues on websites over time. If you've signed up for a Siteimprove account, we recommend taking this course to learn the basics of the tool and how to filter important accessibility data on your site. Documents Trainings expand_more Documents Trainings are practical sessions on Word/Google docs, presentations/slides, and PDFs. Applicable to anyone who creates or shares documents! Intro to Digital Accessibility and Harvard's Policies expand_more Intro to Digital Accessibility and Harvard's Policies is a high-level introduction to accessibility, why it’s important, and how Harvard's Policy applies to digital content and procurement. It’s a good choice for anyone looking for a solid understanding of accessibility and the University's legal commitments. Can't make the training? Check out the self-paced course Introduction to Digital Accessibility at Harvard. Accessible Technology Procurement expand_more Accessible Technology Procurement is a brief training that covers Harvard’s procurement process, and how to assess a product for accessibility when purchasing. There is plenty of time for discussion to help answer questions you have about accessibility with third-party vendors, contracts, and licenses. Digital Accessibility in Canvas expand_more For anyone who creates and shares course materials in Canvas, Digital Accessibility in Canvas is a 1-hour course that provides actionable steps for creating inclusive accessible course content in Canvas, and using built-in automated accessibility checkers. Browse all digital accessibility trainings co_present Instructor-led Trainings ondemand_video Self-paced Trainings"
year_published = 2025
clearnet = "https://accessibility.huit.harvard.edu/learning-paths-accessibility"
