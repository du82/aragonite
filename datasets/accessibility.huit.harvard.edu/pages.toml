full_description = "Microsoft Office Accessibility for Beginners Course Overview Level: General Course length: 30 minutes Platform: LinkedIn Learning Course Description Microsoft Office is one of the most popular and widely used software families available in the world. If you’re interested in making it more accessible to everyone on your team, this course was designed just for you. Join instructor Jess Stratton as she covers the basics of how to use the accessibility features built into Microsoft Office to provide a more equitable and inclusive experience for all. Explore tools for creating content and functions such as the Dictate tool and the Immersive Reader, as well as tools for consuming content like the Read Aloud feature, alt tags, and more. Along the way, Jess shows you what it takes to make reasonable accommodations for screen readers and how to use the Accessibility Checker to scan files for special considerations. By the end of this course, you’ll have the skills you need to turn on live captions in Teams and PowerPoint and display your words on the screen in real time while you’re presenting. Please contact digitalaccessibility@harvard.edu with any questions or accommodation requests. Launch in the Training Portal See also: All Self-Paced Trainings Documents LinkedIn Learning"
