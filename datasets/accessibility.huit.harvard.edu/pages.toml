title = "Practices | Digital Accessibility​"
description = "Browse a comprehensive library of how-to guides with practical examples and code snippets to help you create accessible content and code."
full_description = "Practices The best way to ensure accessibility is by incorporating it from the very beginning of the development process, and continuously testing throughout. When working with a third-party vendor, establish a commitment to accessibility and align on a sustainable process before work even gets started. Library of Accessible Techniques Browse a comprehensive library of how-to guides with practical examples and code snippets to help you create accessible content and code. ✎ Technique: Orientation ✎ Technique: Identify input purpose ✎ Technique: Reflow ✎ Technique: Non-text contrast ✎ Technique: Text spacing ✎ Technique: Content on hover or focus All techniquesarrow_circle_right Accessibility Testing There are simple ways to check content with automatic tools and non-technical tests to see if your content is accessible and inclusive to everyone. build_circle Automated Tools Automated tools evaluate a website’s code and content, flag accessibility issues, and often provide guidance on how to fix the issues. keyboard Manual Testing Methods To manually test your site, review the content, test with a keyboard, and use a screen reader to make sure your website is accessible and inclusive to everyone. Working with Vendors When you use a vendor to purchase digital products, there should be an agreement that the products are accessible. Accessible Technology Procurement How to Interpret a VPAT Accessibility questions for vendors Related Instructor-Led Trainings Measuring Accessibility with Siteimprove Mar. 12, 2025 3:00PM - 4:00PM Virtual Accessibility in Technology Procurement Apr. 2, 2025 2:00PM - 3:00PM Virtual Testing for Digital Accessibility Apr. 9, 2025 10:00AM - 12:30PM Virtual All instructor-led trainingsarrow_circle_right"
