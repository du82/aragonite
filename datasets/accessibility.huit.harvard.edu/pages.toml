["https://accessibility.huit.harvard.edu/creating-accessible-forms"]
title = "Creating Accessible Forms | Digital Accessibility​"
full_description = '''Creating Accessible Forms When creating digital forms or surveys, there are a few considerations to ensure you maintain accessibility for all your users. Several online survey platforms including Qualtrics, Google Forms, and Microsoft Forms have accessibility features built in, and make it easy to create and maintain forms, as well as gather data. They're also user-friendly and mobile-friendly. Document-based forms are more difficult to make accessible and gather data systematically. In many cases, document forms can be moved to an online platform for efficiency and accessibility. We've included resources for different form platforms below. In all cases, we'd encourage following our Content Creator Essentials for Readability, Link Text, Color, and Alt Text. In this page: Qualtrics Forms Google Forms Microsoft Forms PDF Forms HTML Forms Qualtrics Forms Qualtrics is available to Harvard affiliates and can be used to create web-based forms and surveys. Use a layout theme with an accessible level of color contrast. Check with a color contrast checker. One theme we recommend is the Simple Layout, due to its clean design and overall usability. Use accessible question types. See the list of Qualtrics accessible and non-accessible question types. Customize the Next and Previous button text to replace the arrows. Add the title of the form in the Display name field, as this will display in the browser tab. Avoid animated backgrounds or auto-playing music. Consider adding a progress bar for longer surveys and/or numbering your questions. Run the Check Survey Accessibility Tool. Google Forms Google Forms is available to some Harvard affiliates and can be used to create forms and surveys. Select a theme with an accessible level of color contrast. We recommend selecting a light background color, to ensure the "Submit" button has sufficient contrast. Check with a color contrast checker. Avoid animated backgrounds or auto-playing music. Add a form title to display in the browser tab. Consider adding a progress bar for longer surveys and/or numbering your questions. Microsoft Forms Microsoft Forms is available to Harvard affiliates and can be used to create forms and surveys. Use a theme with an accessible level of color contrast. Check with a color contrast checker. Avoid animated backgrounds or auto-playing music. Add a form title to display in the browser tab. Consider adding a progress bar for longer surveys and/or numbering your questions. PDF Forms PDF Forms may be made accessible, but are more complex to create than the other digital form types mentioned. We would encourage if possible, using Qualtrics, Google Forms or Microsoft Forms instead, as online forms are they are easier to fill out for all users, easier to make accessible, and easier to gather data from for survey owners. If you do need to have a PDF form, Adobe offers guidance on creating accessible PDF forms. Alternatively, you can submit to a document remediation vendor to be made accessible. HTML Forms If you are custom-building your forms via HTML, there are a few considerations to keep in mind for accessibility. Use semantic HTML, such as button for buttons. Provide accessible labels and instructions. Clearly mark required fields. Use fieldset to group related questions. Provide helpful error messages and verify that error messages are announced by screen readers. Ensure color choices have an accessible level of color contrast. Check with a color contrast checker. Consider adding a progress bar for longer surveys and/or numbering your questions.'''
year_published = 2025
clearnet = "https://accessibility.huit.harvard.edu/creating-accessible-forms"
