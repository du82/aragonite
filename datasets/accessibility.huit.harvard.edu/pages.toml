["https://accessibility.huit.harvard.edu/provide-name-role-and-value-information"]
title = "Provide name, role, and value information | Digital Accessibility​"
description = "Users of assistive technologies must understand what a custom control is and what it does. Custom controls that lack accessibility information become difficult or impossible to understand or operate."
full_description = 'Provide name, role, and value information Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media For Developers For Developers expand_more Essentials for Developers Structure - Developers Interaction - Developers Interaction - Developers expand_more Keyboard Custom widgets and controls Custom widgets and controls expand_more Use accessible design patterns Provide name, role, and value information Design controls for easy operation Notifications and alerts Support navigation and wayfinding Presentation - Developers Images and Media - Developers For Faculty For Managers For Purchasers Users of assistive technologies must understand what a custom control is and what it does. Custom controls that lack accessibility information become difficult or impossible to understand or operate. Using WAI-ARIA provides a way to fill in missing accessibility information so that assistive technologies can recognize custom controls as controls and not as div or span elements without semantic meaning or value. Provide an accessible name for each custom component. An accessible name is effectively the label for a control, explaining what it does. For custom components, the corresponding design pattern defines the best way to provide the accessible name. Provide controls for which the visible text label matches the accessible name. [Note: The programmatic label of a control is its accessible name.] When the accessible name is different from the visible label, it essentially becomes an unknown hidden command for speech input users that can be accidentally activated without the user knowing what has happened. Provide an accessible role for each custom component. WAI-ARIA defines a large number of values for the role attribute, which are used by assistive technologies to convey the component’s purpose. Give each custom control a suitable role attribute, such as role="button" for custom buttons or role="slider" for slider widgets. Provide and maintain an accurate states and values for each custom component. This means giving custom form components, such as sliders, suitable values that represent their current value plus any additional required values, such as maximum and minimum possible. For controls that change visual appearance, such as a menu item with an associated dropdown menu or a button that is a show/hide toggle button for additional content, their current state must reflect whether their associated content is shown. Testing Use a code inspector (see the Accessibility Testing Tools and Practices page for examples) to query each interactive control for its name, role, and current state or value information. Is this information provided? If so, is it accurate? Does the visible name match the accessible name? When you interact with the control, is its current state and value updated? Validate your answers by using a screen reader to interact with the widget. Is this accessibility information exposed meaningfully and understandably? More information Understanding SC 2.5.3—Label in Name (WAI) Understanding SC 4.1.2—Name, Role, Value (WAI) Léonie Watson: Understanding Screen Reader Interaction Modes (useful background information on how screen readers render web content) Accessible Name Calculation (HTML to Platform Accessibility APIs Implementation Guide)—detailed description of accessible name-calculation for elements See also: Forms Related Techniques ✎ Technique: Label in name People with disabilities rely on interface controls that are used programmatically. These controls have a visual label, as well as a programmatic label, known as its Accessible Name. ✎ Technique: Autocomplete input controls Autocomplete widgets can be helpful for accessibility because they can make it easier to enter text by providing suggestions based on the characters initially typed. ✎ Technique: Required fields A clear indication that specific form fields are required can save users time and avoid potential errors relating to missing data when a form is submitted. ✎ Technique: Accessible modal dialogs Modal dialogs can enhance usability by focusing attention on a specific message that requires a user action to continue. An accessible modal dialog is one where keyboard focus is managed properly, and the correct information is exposed to screen readers. ✎ Technique: Expandable sections Expandables (sometimes called “collapsible” or “disclosure widgets”) are simple interface patterns that allow you to expand and collapse content. ✎ Technique: Accessible names for buttons Whether you provide controls using standard HTML elements or create custom controls, ensure that controls are given appropriate names. ✎ Technique: Input labels Descriptive labels help users understand the purpose of a form control. Labels should be associated with their controls so that when the input is focused, the label is announced by screen readers. ✎ Technique: Icon fonts Icon fonts are a popular and effective method for providing scalable symbols that can be used to label controls and provide graphical information. The information provided by icons also needs to be available to people who can’t see them.'
year_published = 2025
