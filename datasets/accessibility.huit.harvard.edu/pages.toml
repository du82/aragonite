["https://accessibility.huit.harvard.edu/provide-helpful-error-messages"]
title = "Provide helpful error messages | Digital Accessibility​"
description = "People with visual, cognitive and physical impairments are particularly prone to making errors when entering data through forms. When errors resulting from form input happen, it’s important to make sure that error messages are shown accessibly."
full_description = "Provide helpful error messages Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media For Developers For Developers expand_more Essentials for Developers Structure - Developers Interaction - Developers Interaction - Developers expand_more Keyboard Custom widgets and controls Notifications and alerts Notifications and alerts expand_more Provide helpful error messages Give users control over timeouts Provide notification of dynamic changes to content Support navigation and wayfinding Presentation - Developers Images and Media - Developers For Faculty For Managers For Purchasers People with visual, cognitive and physical impairments are particularly prone to making errors when entering data through forms. When errors resulting from form input happen, it’s important to make sure that error messages are shown accessibly. Provide error messages that give assistance: Describe the related problem in straightforward terms and, where possible, give advice on how to resolve them. Make it easy to locate the problem: Programmatically associate each error message with its corresponding form control using the aria-describedby attribute. If there’s a list of errors, move focus to the container of the list once it is generated so that screen reader users can find it. Testing For each input control where an error could be made, enter incorrect data and check: Is an error message displayed? Does it clearly explain the error and how to resolve it? When a screen reader is running, is it possible to find the location of the error message and the associated form control? Resources Understanding WCAG SC 3.3.1—Error Identification (WAI) Understanding WCAG SC 3.3.3—Error Suggestion (WAI) Understanding WCAG SC 4.1.2—Name Role Value (WAI) See also: Forms Related Techniques ✎ Technique: Form error communication Effectively and accessibly communicate form errors by: Communicating that a form has errors, Communicating any individual errors case by case, including clear guidance on how to address the error. ✎ Technique: Form feedback with live regions Providing form feedback accessibly helps users submit data more accurately and reduces the chance for error."
