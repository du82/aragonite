["https://accessibility.huit.harvard.edu/avoid-reliance-color"]
title = "Avoid reliance on color | Digital Accessibility​"
description = "Color is a powerful visual means of presenting or distinguishing information, but when you use color to identify or distinguish information, make sure that this information is still available to people who can't perceive color."
full_description = "Avoid reliance on color Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media For Developers For Developers expand_more Essentials for Developers Structure - Developers Interaction - Developers Presentation - Developers Presentation - Developers expand_more Avoid reliance on color Support flexibility and adaptation Images and Media - Developers For Faculty For Managers For Purchasers In addition to its role in aesthetic appeal, color is a valuable way to present information—for example, coding categories of information or highlighting information to take advantage of cultural stereotypes (such as red for “stop”). However, some people with vision impairments can’t perceive color at all, while others are unable to distinguish specific color pairs. Information provided only through color will be unavailable to these users. When using visual characteristics, make sure the information is available to people who can’t see color: Provide another cue. Use color as a way to convey information to people who can perceive color, but then also provide the information in another way for people who can’t see color—in text, for example. Provide meaningful labels. Give controls such as links and menus meaningful labels and titles so that people can understand what they do without needing instructions. Testing Print out your page in black and white. Do its information and instructions make sense when color isn’t available? Read your page to someone who isn’t looking at the screen. Can they make sense of everything they hear? Check your page for references to visual appearance, size, position, or orientation, and then update the content so that people who can’t see can still understand what you mean. Resources Understanding WCAG SC 1.4.1—Use of Color (WAI) Related Techniques ✎ Technique: Using color to convey information Color is a powerful visual means of presenting or distinguishing information, but when you use color to identify or distinguish information, make sure that this information is still available to people who can't perceive color. ✎ Technique: Required fields A clear indication that specific form fields are required can save users time and avoid potential errors relating to missing data when a form is submitted. ✎ Technique: Indicating current page location Users can find their way around a web site more easily and confidently if they know where they are."
year_published = 2025
