["https://accessibility.huit.harvard.edu/web-technologies/javascript"]
title = "JavaScript | Digital Accessibility​"
description = "Make it easier for users to interact with added content. Tooltips, drop-down menus, and popups are examples of added content."
full_description = "✎ Technique: Content on hover or focus Page Make it easier for users to interact with added content. Tooltips, drop-down menus, and popups are examples of added content. ✎ Technique: Choosing a media player Page Media player accessibility is essential for video content. Evaluate the accessibility and cross-device compatibility of the media player that comes with your video-distribution platform. ✎ Technique: Autocomplete input controls Page Autocomplete widgets can be helpful for accessibility because they can make it easier to enter text by providing suggestions based on the characters initially typed. ✎ Technique: Form error communication Page Effectively and accessibly communicate form errors by: Communicating that a form has errors, Communicating any individual errors case by case, including clear guidance on how to address the error. ✎ Technique: Session extension Page For a number of reasons including data persistence, performance and security, it is sometimes beneficial to terminate idle user sessions. It's important to warn people a session is about to expire and give them the option to continue. ✎ Technique: Form feedback with live regions Page Providing form feedback accessibly helps users submit data more accurately and reduces the chance for error. ✎ Technique: Accessible modal dialogs Page Modal dialogs can enhance usability by focusing attention on a specific message that requires a user action to continue. An accessible modal dialog is one where keyboard focus is managed properly, and the correct information is exposed to screen readers. ✎ Technique: Expandable sections Page Expandables (sometimes called “collapsible” or “disclosure widgets”) are simple interface patterns that allow you to expand and collapse content. ✎ Technique: Focus order and tabindex Page Interactive elements should, under most circumstances, be focusable in the order that they appear in the source code. This helps people who are using the keyboard or alternative input devices to follow focus in a logical order."
