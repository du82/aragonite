["https://accessibility.huit.harvard.edu/keyboard"]
title = "Keyboard | Digital Accessibility​"
description = "Making it possible for people to access and operate a web interface or application using the keyboard benefits people who can’t use a mouse due to a visual impairment or mobility impairment."
full_description = "Keyboard Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media For Developers For Developers expand_more Essentials for Developers Structure - Developers Interaction - Developers Interaction - Developers expand_more Keyboard Keyboard expand_more Support keyboard interaction Provide logical and visible focus indication Custom widgets and controls Notifications and alerts Support navigation and wayfinding Presentation - Developers Images and Media - Developers For Faculty For Managers For Purchasers Making it possible for people to access and operate a web interface or application using the keyboard benefits people who can’t use a mouse due to a visual impairment or mobility impairment. Screen reader users can take advantage of the many keyboard commands that screenreaders supports to make navigation and interaction easier. However, these aren’t available to sighted people who don’t need a screen reader but have physical impairments that make it difficult or impossible to use the mouse. For maximum usability, controls must be operable using standard keystrokes, and tracking focus as it moves through a page should be as easy as possible."
