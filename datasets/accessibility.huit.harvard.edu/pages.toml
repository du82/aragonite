["https://accessibility.huit.harvard.edu/access-technologies/custom-stylesheet"]
title = "Custom stylesheet | Digital Accessibility​"
description = "Content does not restrict its view and operation to a single display orientation, such as portrait or landscape, unless a specific display orientation is essential (i.e., bank check)."
full_description = "✎ Technique: Orientation Page Content does not restrict its view and operation to a single display orientation, such as portrait or landscape, unless a specific display orientation is essential (i.e., bank check). ✎ Technique: Reflow Page Use responsive design to allow your content to zoom and respond to various screen sizes. ✎ Technique: Text spacing Page People with a variety of print disabilities (including low vision, dyslexia, other cognitive disabilities) can benefit from being able to increase the spacing between lines, words, and/or letters on their own device. ✎ Technique: Structuring content Page Adding structure to web content makes it more readable and comprehensible to everyone and especially to people with a visual or cognitive impairment that makes reading on-screen content difficult. ✎ Technique: Writing headings Page Headings are used to group and label sections of content, giving visual structure to the page and providing a means of navigation to screen reader users. ✎ Technique: Referring to page content by its position Page Avoid referring to a button, menu, or other item in the page only by its position on the page; instead, use additional information that describes the content. ✎ Technique: Identifying lists of content Page When you include a list in your page content, this relationship needs to be conveyed visually, and it also needs to be conveyed to people using screen readers. ✎ Technique: Identifying headings Page Headings are important orientation aids, and they help people quickly identify the content on your page. When headings are correctly identified, they also allow screen reader users to quickly navigate from heading to heading. ✎ Technique: Describing graphs Page Some people understand complex information best when it's presented visually, such as as a chart or diagram, while others find that reading the information suits them better."
