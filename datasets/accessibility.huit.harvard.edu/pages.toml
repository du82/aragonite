title = "Convert a File | Digital Accessibility​"
full_description = "Convert a File Use the form below to submit an automated conversion of your file, text, or URL into another format such as an MP3, word document, e-book, braille, or accessible tagged PDF. Note: automated conversions are not as good as those done by an actual person. Learn more about creating accessible documents or take an accessible document training. While these conversions may not be fully accessible, they can often improve the existing material and bring it closer to a useful document. In this page: Conversion Form Step by Step Instructions What might you convert? Conversion Form You are unable to see the content in this frame. Visit SensusAccess Document Conversion Service here. Step by Step Instructions Begin by selecting your source - File, URL, or Text Follow the prompts to upload, provide the URL, or provide the text requested Select your output format - options will vary depending on the source format you chose Review any additional options you're given Provide your Harvard email address* where you'd like to receive the conversion and submit You will receive an email when your conversion is ready. *If you encounter any issues in providing your email, please contact digitalaccessibility@harvard.edu Conversion Examples Turn an image of text into actual text Turn a PDF into an .MP3 audio file Turn an inaccessible PDF into a tagged PDF Turn a document into Braille digital format"
