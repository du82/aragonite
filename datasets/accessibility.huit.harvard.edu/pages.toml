["https://accessibility.huit.harvard.edu/academic-content"]
title = "Guide to Accessible Academic Content | Digital Accessibility​"
description = "Whether you're developing course materials, adding content to Canvas, or building tests and quizzes, creating accessible academic content is a key part of supporting Harvard's Digital Accessibility Policy and providing an equitable experience for all students, especially those with disabilities."
full_description = "Guide to Accessible Academic Content Whether you're developing course materials, adding content to Canvas, or building tests and quizzes, creating accessible academic content is a key part of supporting Harvard's Digital Accessibility Policy and providing an equitable experience for all students, especially those with disabilities. We've created this guide to get you started with creating academic content that is accessible and inclusive. Download a printable version: Guide to Accessible Academic Content (PDF) In this page: Creating accessible content Check your content for accessibility Training and Office Hours Get support Creating Accessible Content in Canvas text_format Add headings When you add headings for sections of content, make sure they’re identified as headings. Use heading levels in a hierarchical pattern (Heading 1, Heading 2, Heading 3, etc). image Write Alt Text for images Alternative (Alt) Text should convey the “why” of the image as it relates to the content of a document or webpage. Add short, descriptive alt text to all non-decorative images. link Create descriptive links Clearly and accurately convey the link’s purpose with link text. Avoid generic text such as “click here” or “continue reading.” table_view Reconsider tables Tables should be used for tabular data, not layout. If you do use a table, add row and/or column headers. invert_colors Use accessible color contrast Use a color contrast checker to make sure that the contrast ratio between the text color and background color is at least 4.5:1. toggle_on Avoid relying on color for meaning When using color, add a secondary indicator, such as text or shape differences, so that color alone is not conveying the meaning. play_circle_filled Add captions, transcripts, and description for multimedia Add captions or transcripts for dialog in videos or podcasts, and add audible descriptions of visual elements in videos. description Check your documents Tag your document with headings, be mindful of color, and use meaningful formatting techniques that will make your document more accessible to more people. Check your content for accessibility Pope Tech Accessibility is an automated checker that provides content owners with guidance and tools to help find, fix, and track accessibility issues in Canvas. It is available to all Canvas instructors and administrators. Pope Tech includes two main feature sets: Pope Tech Guide and Accessibility Dashboard. Getting Started with Pope Tech Accessibility for Canvas arrow_circle_right Pope Tech Guide Helps content owners find accessibility issues within Canvas content, and provides information, resources, and tools for fixing them. Getting Started with the Pope Tech Canvas Accessibility Guide Instructor Pope Tech Accessibility Guide for Canvas Intro Pope Tech Canvas Accessibility Guide Demos (YouTube video playlist) Accessibility Dashboard Gives high-level data of all accessibility issues in one or multiple courses, which can be exported and shared with content owners. Using the Canvas Accessibility Dashboard for Instructors Scanning Courses from the Accessibility Dashboard Report Formats and Types Upcoming Canvas Training More Canvas trainings will be scheduled soon! All instructor-led trainingsarrow_circle_right Training and Office Hours Instructor-led Trainings Digital Accessibility Services offers live instructor-led trainings for the Harvard community on topics such as creating accessible content and documents, testing websites for accessibility, and working with vendors. Self-paced Trainings Browse on-demand training courses on accessibility topics such as content, documents, development, and testing. DAS Office Hours Want to check your content accessibility with Digital Accessibility Services (DAS)? Stop by one of our upcoming Office Hours! We hold open office hours in a Zoom meeting room on the 2nd and 4th Fridays of each month from 10am-12pm. Get Support Digital Accessibility Services (DAS) DAS supports the Harvard community in making sure that everyone has the opportunity to access the university’s knowledge, ideas, and resources. DAS offers training, consultation, and resources on accessibility for content creators and developers. Digital Accessibility Liaisons (DAL) The network of DALs coordinates local efforts, facilitates training, and monitors progress. At least one DAL has been appointed to represent each school and administrative unit. Local Student Disability Coordinators (LDC) Students who wish to request accommodations should contact their school's Local Student Disability Coordinator (LDC) to initiate the reasonable accommodation exploration process."
year_published = 2025
