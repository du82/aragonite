["https://accessibility.huit.harvard.edu/support-keyboard-interaction"]
title = "Support keyboard interaction | Digital Accessibility​"
description = "Make sure that controls can be operated using the keyboard. Native interactive HTML elements, such as links and form controls, support keyboard accessibility by default, and these should be used wherever possible."
full_description = '''Support keyboard interaction Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media For Developers For Developers expand_more Essentials for Developers Structure - Developers Interaction - Developers Interaction - Developers expand_more Keyboard Keyboard expand_more Support keyboard interaction Provide logical and visible focus indication Custom widgets and controls Notifications and alerts Support navigation and wayfinding Presentation - Developers Images and Media - Developers For Faculty For Managers For Purchasers Make sure that controls can be operated using the keyboard. Native interactive HTML elements, such as links and form controls, support keyboard accessibility by default, and these should be used wherever possible. However, many custom controls and widgets use elements such as div, span, and li, which do not by default provide keyboard support. In this case, keyboard support must be supplied by the developer, using HTML and JavaScript. Make sure every active control is in focus order. Ensure that custom controls can receive keyboard focus, by giving the control’s container element a tabindex attribute with the value of "0". Make sure currently inactive controls are not in focus order. If a control should not be in focus order initially but may become active, such as a dropdown menu item, it should have a tabindex value of "-1", which can be changed using scripting. Make sure that active controls are operable using the keyboard. Ensure that when a control has focus it can be activated using standard keystrokes—for example, a button can be pressed using the spacebar, a list of menu items can be traversed using the arrow keys, and a dialog can be dismissed using the Escape key. This requires that event-handling scripts listen for keypress events and, where necessary, suppress native keypress behavior. Make sure that content that appears/disappears, is designed such that users can perceive the additional content and dismiss it without disrupting the page experience. When dynamically adding content, be certain that users can move the pointer over the additional content to keep it visible, that the content remains open as long as it's relevant and as long as the user is interacting with it, and that the additional content is dismissable from the keyboard without moving focus/hover. In this context, custom tooltips, sub-menus, and other nonmodal popups that display on hover and focus are examples of additional content. Make certain that users are able to turn off or reconfigure keyboard shortcuts. Character key shortcuts are frustrating for speech input users, who are accustomed to use strings of characters for input, and for any keyboard user who is prone to accidentally hitting keys. For these reasons, if a keyboard shortcut is implemented, users must be able to either turn the shortcut off, remap the shortcut to one or more non-printable characters (e.g., Alt, Ctrl), or the keyboard shortcut is only active when a user interface component has focus. Testing Use the keyboard to tab through every element on a page. For each element, check that the answer to the following questions is "yes": Does it receive keyboard focus? If so, when it has focus, can it be activated using standard keys? Can dynamically added content that appears/disappears, be perceived and controlled by assistive technology users, including the ability to dismiss the additional content without disrupting the page experience? Can a keyboard shortcut be turned off or reconfigured by the user? More information Understanding SC 1.4.13—Content on Hover or Focus (WAI) Understanding SC 2.1.1—Keyboard (WAI) Understanding SC 2.1.4—Character Key Shortcuts (WAI) Developing a Keyboard Interface (WAI-ARIA) ARIA Authoring Practices Guide (APG) Patterns (including recommended keyboard behavior) (WAI-ARIA) Why Keyboard Usability Is More Important Than You Think and Designing Better Keyboard Experiences Related Techniques ✎ Technique: Content on hover or focus Make it easier for users to interact with added content. Tooltips, drop-down menus, and popups are examples of added content. ✎ Technique: Character key shortcuts If keyboard shortcuts are implemented using only a letter (including upper- and lower-case letters), punctuation, number, or symbol characters, provide a way to turn off or remap character key shortcuts. ✎ Technique: Accessible modal dialogs Modal dialogs can enhance usability by focusing attention on a specific message that requires a user action to continue. An accessible modal dialog is one where keyboard focus is managed properly, and the correct information is exposed to screen readers. ✎ Technique: Expandable sections Expandables (sometimes called “collapsible” or “disclosure widgets”) are simple interface patterns that allow you to expand and collapse content. ✎ Technique: Focus order and tabindex Interactive elements should, under most circumstances, be focusable in the order that they appear in the source code. This helps people who are using the keyboard or alternative input devices to follow focus in a logical order. ✎ Technique: Keyboard operable custom controls Sometimes, design requirements mean that you need to create a custom interactive element rather than using a native HTML element. Your element will not be accessible by keyboard unless it is included in focus order and it can be activated using keys. ✎ Technique: Managing focus and inactive elements If an active element is intended to be unavailable in a particular state and it’s hidden from view, it should not be able to receive focus. ✎ Technique: Keyboard accessible links Links ( elements) are focusable by default, so it should normally be possible to activate them using the keyboard. However, under certain circumstances, they are not focusable.'''
year_published = 2025
clearnet = "https://accessibility.huit.harvard.edu/support-keyboard-interaction"
