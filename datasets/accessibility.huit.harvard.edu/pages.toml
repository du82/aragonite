title = "Digital Accessibility​ | Digital Accessibility​"
description = "Harvard University is committed to making our information technology and digital content accessible, so that everyone has the opportunity to access the university's knowledge, ideas, and resources."
full_description = "Digital Accessibility​ HUIT Digital Accessibility at Harvard Harvard University is committed to making our information technology and digital content accessible, so that everyone has the opportunity to access the university's knowledge, ideas, and resources. Learn more and get started chevron_right We all have a role to play. Everyone has a role to play in making Harvard’s digital information more accessible. edit Content Creators code Developers school Faculty request_quote Purchasers Digital Accessibility Services Digital Accessibility Services (DAS) supports the Harvard community in making sure that everyone has the opportunity to access the university’s knowledge, ideas, and resources. For access to all other disability-related resources and guidance for students, faculty, staff, visitors and guests, please visit University Disability Resources. Meet the DAS Team arrow_circle_right Save the Date: 2025 Accessibility Summit on June 17 Join us for the 2025 Accessibility Summit on Tuesday, June 17, 2025, hosted by Digital Accessibility Services (DAS). This is an in-person event open to Harvard faculty and staff, and will provide opportunities for learning, connecting, and engaging with other accessibility advocates from around the university. Registration and event details coming soon. Reach out to digitalaccessibility@harvard.edu with any questions. Harvard's Digital Accessibility Policy Digital Accessibility Policy This Policy is established to promote equal access to information technology and digital content and to improve the user experience of IT and digital / online media for all users, including persons with disabilities. Digital Accessibility Policy Procedures Information and guidance on implementing Harvard's Digital Accessibility Policy, with supporting examples and definitions. Policy Frequently Asked Questions (FAQs) Browse information and frequently asked questions about Harvard's Digital Accessibility Policy that went into effect on June 1, 2023. Digital Accessibility Services Office Hours Not sure where to start with accessibility? We're here to help! The Digital Accessibility Services (DAS) team is available to answer your questions and provide guidance and support to the Harvard community. We hold virtual office hours via Zoom on the 2nd and 4th Fridays of each month from 10am-12pm. DAS Office Hours Mar. 14, 2025 10:00AM - 12:00PM Virtual - Zoom Virtual DAS Office Hours Mar. 28, 2025 10:00AM - 12:00PM Virtual - Zoom Virtual DAS Office Hours Apr. 11, 2025 10:00AM - 12:00PM Virtual - Zoom Virtual All upcoming DAS Office Hoursarrow_circle_right Instructor-Led Trainings Digital Accessibility Services offers live instructor-led trainings for the Harvard community on topics such as content creation, development, documents, and testing. We have also offer self-paced training courses that provide quick overviews of popular accessibility topics. Not sure which training is right for you? Check out our Learning Paths guide to find the most relevant training for your role. Digital Accessibility Foundations Mar. 4 - Mar. 5, 2025 Virtual - Zoom Virtual Creating Accessible Slides Mar. 4, 2025 10:00AM - 11:30AM Virtual - Zoom Virtual Digital Accessibility for Content Creators Mar. 5, 2025 2:00PM - 4:00PM Virtual - Zoom Virtual All instructor-led trainingsarrow_circle_right How to check a website's accessibility Automated Tools Automated tools evaluate a website’s code and content, flag accessibility issues, and often provide guidance on how to fix the issues. These tools save time for both developers and content creators, and they often catch errors that might not be obvious. Harvard-Licensed Tool: Siteimprove Free Automated tools Manual Testing After you’ve done a first pass with automated tools, you’ll need to follow up with manual testing to make sure your website is inclusive and accessible. Content Review Keyboard Testing Screen Reader Review Accessibility Services at Harvard Digital Accessibility Services (DAS) DAS offers training, consultation, and resources on accessibility for the Harvard community. DAS also maintains this website (accessibility.huit.harvard.edu). Email digitalaccessibility@harvard.edu for questions regarding digital accessibility, Harvard's Digital Accessibility Policy, trainings, consultations, and resources. University Disability Resources (UDR) UDR provides leadership and guidance on university best practices, employee disability accommodations, planning accessible events, finding accessibility vendors, and consultation on physical access or renovations, while ensuring compliance with federal and state regulations. Digital Accessibility Liaisons (DAL) The network of DALs coordinates local efforts, facilitates training, and monitors progress. At least one DAL has been appointed to represent each school and administrative unit. View the list of DALs (HarvardKey Required) Browse the DAL Portal (HarvardKey Required) Digital Digest Newsletter Subscribe to the Digital Digest newsletter arrow_circle_right September 2024 - Cybersecurity Awareness, AI Sandbox upgrade, Intro to Digital Accessibility training July 2024 - Alt text in Slack, Quishing, Zoom update April 2024 - AI security, new Digital Accessibility training, Phishing Library of Digital Accessibility Techniques Browse a comprehensive library of how-to guides with practical examples and code snippets to help you create accessible content and code. Explore Accessibility Techniques chevron_right ✎ Technique: Heading structure ✎ Technique: Expandable sections ✎ Technique: Form feedback with live regions"
