["https://accessibility.huit.harvard.edu/about"]
title = "About Digital Accessibility Services | Digital Accessibility​"
description = """
Digital Accessibility Services (DAS) supports the Harvard community in making sure that everyone has the opportunity to access the university’s knowledge, ideas, and resources. DAS offers training, consultation, and resources on accessibility for the Harvard community.
Email digitalaccessibility@harvard.edu for questions regarding digital accessibility, Harvard's Digital Accessibility Policy, trainings, consultations, and resources."""
full_description = "About Digital Accessibility Services Harvard is committed to making its digital information and resources more easily available to those who need them. Digital Accessibility Services (DAS) supports the Harvard community in making sure that everyone has the opportunity to access the university’s knowledge, ideas, and resources. DAS offers training, consultation, and resources on accessibility for the Harvard community. Email digitalaccessibility@harvard.edu for questions regarding digital accessibility, Harvard's Digital Accessibility Policy, trainings, consultations, and resources. Report a Web Accessibility Concern arrow_circle_right Meet the DAS team Kyle Shachmut Senior Director, Digital Accessibility Services I have been advancing digital inclusion at Harvard University since 2015, providing strategic direction to digital accessibility efforts across central administration and the schools. One of the best parts of working on accessibility at Harvard is... Andy Hollenhorst Manager, Digital Accessibility Services I came to Harvard from Sallie Mae bank, where I worked as a user experience researcher and accessibility lead. Before that I worked in a content strategy role at TripAdvisor. I hold a M.S. in Experiential Education from Minnesota State University, Mankato... Derek Jackson Manager, Digital Accessibility Development Before becoming a Digital Accessibility Developer I worked at Harvard Business Publishing as the Associate Director of Content Production where I supervised the production of Higher Ed content. As the AD of Content Production I infused accessibility into... Janell Sims Manager, Digital Accessibility Services As Manager of Digital Accessibility Services (DAS), I'm working to build a culture of inclusion and support for the University’s accessibility commitments. As a founding member of the DAS team, I've helped shape the strategic direction and process... Rubaiyet (Caesar) Alam Digital Accessibility Developer Before joining Harvard University I worked as a Web and Mobile Accessibility tester in several companies for the past 5 years. I’m very dedicated to creating awareness for Web Accessibility. At Harvard University my goal is to improve the usability of... Kay Belardinelli Digital Accessibility Developer I've been writing code for fun since I was a teenager and working professionally as a web developer since 2011. I have always been passionate about UX, and this focus has drawn me more and more into digital accessibility. Now, I'm certified as a Web... Jen Dee Digital Accessibility Officer, FAS As the Digital Accessibility Officer, Faculty of Arts and Sciences, I strive to spread accessibility best practices and empower my colleagues to create educational content that can meet the needs of all learners. Having earned a Master's degree from the... Suany Hurlston Digital Accessibility Specialist As someone who proudly identifies as Deaf and Latine, I am committed to ensuring inclusivity and accessibility throughout my work. Prior to my current role at Harvard, I led user experience projects focused on accessibility while increasing my knowledge... Erich Manser Digital Accessibility Consultant As an accessibility professional and disability rights advocate, I believe in a user-focused approach to ensuring access-for-all in technology. When we understand the different barriers people face, it makes accessibility real, and allows us to get beyond... Jamie Spear Digital Accessibility Consultant I joined the Digital Accessibility Services team after working for several years with Harvard University Disability Resources. My background is in teaching and training around accessibility concepts and best practices to foster an inclusive community... Evan Tansil Digital Accessibility Testing Consultant Before joining the Digital Accessibility Services Team at Harvard, I spent several years in consulting, collaborating with organizations to champion the needs of people with disabilities across their digital platforms. Through the International... Curtis Wilcox Digital Accessibility Developer Before Digital Accessibility Services (DAS) was created, I represented FAS in the HUIT Accessibility Working Group and the Digital Accessibility Working Group for the University Accessibility Committee. My IT career started over twenty years ago at the... John Williams Digital Accessibility Consultant I came to the Boston area from Houston, TX where I lived and worked throughout my career. Previously, I was Rice University’s Digital Accessibility Coordinator where I helped launch a campus-wide accessibility program and policy. I also have experience... Hunter Wright Digital Accessibility Support Analyst Originally from Myrtle Beach, SC, I have lived near Boston, MA for the last 20 years. I have 10+ years of Supply Chain Management experience ranging from logistics to procurement to contract negotiation, mainly in the Health Care setting. In entering my... Upcoming DAS Events Digital Accessibility Foundations Mar. 4 - Mar. 5, 2025 Virtual - Zoom Virtual Creating Accessible Slides Mar. 4, 2025 10:00AM - 11:30AM Virtual - Zoom Virtual Digital Accessibility for Content Creators Mar. 5, 2025 2:00PM - 4:00PM Virtual - Zoom Virtual All DAS eventsarrow_circle_right Digital Digest - Issue Archive Subscribe to the Digital Digest newsletter arrow_circle_right September 2024 - Cybersecurity Awareness, AI Sandbox upgrade, Intro to Digital Accessibility training July 2024 - Alt text in Slack, Quishing, Zoom update April 2024 - AI security, new Digital Accessibility training, Phishing"
