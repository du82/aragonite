["https://accessibility.huit.harvard.edu/access-technologies/screen-reader"]
title = "Screen reader | Digital Accessibility​"
description = "People with disabilities rely on interface controls that are used programmatically. These controls have a visual label, as well as a programmatic label, known as its Accessible Name."
full_description = "✎ Technique: Label in name Page People with disabilities rely on interface controls that are used programmatically. These controls have a visual label, as well as a programmatic label, known as its Accessible Name. ✎ Technique: Status messages Page Assistive technology users should be able to detect when important changes occur on a web page, With the use of a status message, information can be provided to the user without changing focus or unnecessarily interrupting their work. ✎ Technique: Choosing a media player Page Media player accessibility is essential for video content. Evaluate the accessibility and cross-device compatibility of the media player that comes with your video-distribution platform. ✎ Technique: Building tables Page The element is for data that one might find in a spreadsheet, consisting of rows and columns of cells. It's important to ensure that the editing process allows identifying row and column headers. ✎ Technique: Structuring content Page Adding structure to web content makes it more readable and comprehensible to everyone and especially to people with a visual or cognitive impairment that makes reading on-screen content difficult. ✎ Technique: Writing headings Page Headings are used to group and label sections of content, giving visual structure to the page and providing a means of navigation to screen reader users. ✎ Technique: Writing link text Page Link text needs to clearly and accurately convey the link's purpose. ✎ Technique: Writing web page titles Page The title of a web page is the page's accessible name. To be as helpful as possible, the title should briefly tell the user what the page is about and where they are within the site. ✎ Technique: Referring to page content by its position Page Avoid referring to a button, menu, or other item in the page only by its position on the page; instead, use additional information that describes the content."
year_published = 2025
