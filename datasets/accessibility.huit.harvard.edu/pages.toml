["https://accessibility.huit.harvard.edu/disabilities/motor-impairment"]
title = "Motor impairment | Digital Accessibility​"
description = "Content does not restrict its view and operation to a single display orientation, such as portrait or landscape, unless a specific display orientation is essential (i.e., bank check)."
full_description = "✎ Technique: Orientation Page Content does not restrict its view and operation to a single display orientation, such as portrait or landscape, unless a specific display orientation is essential (i.e., bank check). ✎ Technique: Content on hover or focus Page Make it easier for users to interact with added content. Tooltips, drop-down menus, and popups are examples of added content. ✎ Technique: Character key shortcuts Page If keyboard shortcuts are implemented using only a letter (including upper- and lower-case letters), punctuation, number, or symbol characters, provide a way to turn off or remap character key shortcuts. ✎ Technique: Pointer gestures Page All operations must use simple gestures that need only a single touch. If the site or application does use multi-touch gestures, be sure to also provide simple interfaces. ✎ Technique: Label in name Page People with disabilities rely on interface controls that are used programmatically. These controls have a visual label, as well as a programmatic label, known as its Accessible Name. ✎ Technique: Motion actuation Page Ensure that functions that are triggered by moving a device or by gesturing towards the device can also be operated by more conventional user interface components. ✎ Technique: Choosing a media player Page Media player accessibility is essential for video content. Evaluate the accessibility and cross-device compatibility of the media player that comes with your video-distribution platform. ✎ Technique: Site search Page It's important the search facility on your site is logically and conventionally placed and constructed for optimal accessibility. ✎ Technique: Site and page navigation Page It's important to provide consistent navigation regions to navigate between a site's pages and—where there is a lot content on each page—between sections of pages. ✎ Technique: Autocomplete input controls Page Autocomplete widgets can be helpful for accessibility because they can make it easier to enter text by providing suggestions based on the characters initially typed."
