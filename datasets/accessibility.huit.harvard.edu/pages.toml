title = "Operable | Digital Accessibility​"
description = "If keyboard shortcuts are implemented using only a letter (including upper- and lower-case letters), punctuation, number, or symbol characters, provide a way to turn off or remap character key shortcuts."
full_description = "✎ Technique: Character key shortcuts Page If keyboard shortcuts are implemented using only a letter (including upper- and lower-case letters), punctuation, number, or symbol characters, provide a way to turn off or remap character key shortcuts. ✎ Technique: Pointer gestures Page All operations must use simple gestures that need only a single touch. If the site or application does use multi-touch gestures, be sure to also provide simple interfaces. ✎ Technique: Label in name Page People with disabilities rely on interface controls that are used programmatically. These controls have a visual label, as well as a programmatic label, known as its Accessible Name. ✎ Technique: Motion actuation Page Ensure that functions that are triggered by moving a device or by gesturing towards the device can also be operated by more conventional user interface components. ✎ Technique: Choosing a media player Page Media player accessibility is essential for video content. Evaluate the accessibility and cross-device compatibility of the media player that comes with your video-distribution platform. ✎ Technique: Writing link text Page Link text needs to clearly and accurately convey the link's purpose. ✎ Technique: Writing web page titles Page The title of a web page is the page's accessible name. To be as helpful as possible, the title should briefly tell the user what the page is about and where they are within the site. ✎ Technique: Visited links Page In long lists of links, it's helpful to show users which links they've already followed so they can focus on unseen content. Browsers do not tend to let you style visited links with anything but the color property. ✎ Technique: Site search Page It's important the search facility on your site is logically and conventionally placed and constructed for optimal accessibility."
