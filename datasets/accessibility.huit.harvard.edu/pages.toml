["https://accessibility.huit.harvard.edu/auditing-design-systems-accessibility"]
title = "Auditing Design Systems for Accessibility | Digital Accessibility​"
description = "If a great design isn’t open and usable for everyone, how great is it? Designing accessibility into products is crucial to ensuring that you’re creating experiences that include people with disabilities. In this course, Anna E. Cook shows you how to conduct an accessibility audit on your design systems to ensure accessible experiences, helping you meet your users’ needs—while also gaining competitive advantages by building truly innovative and amazing products."
full_description = "Auditing Design Systems for Accessibility Course Overview Level: Beginner Course length: 1.5 hours Platform: LinkedIn Learning Course Description If a great design isn’t open and usable for everyone, how great is it? Designing accessibility into products is crucial to ensuring that you’re creating experiences that include people with disabilities. In this course, Anna E. Cook shows you how to conduct an accessibility audit on your design systems to ensure accessible experiences, helping you meet your users’ needs—while also gaining competitive advantages by building truly innovative and amazing products. Join Anna as she covers what you need to know about an accessibility audit, and how to audit designs, client-side code, and documentation. She shows you how to document your a11y audit and make it actionable, explains key considerations for prioritizing your a11y audit and the issues it discovers, and how to share results with the consumers of your design system. Please contact digitalaccessibility@harvard.edu with any questions or accommodation requests. Launch in the Training Portal See also: All Self-Paced Trainings LinkedIn Learning Design"
