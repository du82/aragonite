["https://accessibility.huit.harvard.edu/techniques"]
title = "Techniques | Digital Accessibility​"
description = "Browse a comprehensive library of how-to guides with practical examples and code snippets to help you create accessible content and code."
full_description = "✎ Technique: Orientation Content does not restrict its view and operation to a single display orientation, such as portrait or landscape, unless a specific display orientation is essential (i.e., bank check). ✎ Technique: Identify input purpose Make it easier for people to complete input fields requesting personal information. ✎ Technique: Reflow Use responsive design to allow your content to zoom and respond to various screen sizes. ✎ Technique: Non-text contrast The contrast of icons and graphical objects is just as important as that of text. Use sufficient contrast for all elements on the screen, with a minimum contrast ratio of 3:1. ✎ Technique: Text spacing People with a variety of print disabilities (including low vision, dyslexia, other cognitive disabilities) can benefit from being able to increase the spacing between lines, words, and/or letters on their own device. ✎ Technique: Content on hover or focus Make it easier for users to interact with added content. Tooltips, drop-down menus, and popups are examples of added content. ✎ Technique: Character key shortcuts If keyboard shortcuts are implemented using only a letter (including upper- and lower-case letters), punctuation, number, or symbol characters, provide a way to turn off or remap character key shortcuts. ✎ Technique: Pointer gestures All operations must use simple gestures that need only a single touch. If the site or application does use multi-touch gestures, be sure to also provide simple interfaces. ✎ Technique: Label in name People with disabilities rely on interface controls that are used programmatically. These controls have a visual label, as well as a programmatic label, known as its Accessible Name. ✎ Technique: Motion actuation Ensure that functions that are triggered by moving a device or by gesturing towards the device can also be operated by more conventional user interface components. ✎ Technique: Status messages Assistive technology users should be able to detect when important changes occur on a web page, With the use of a status message, information can be provided to the user without changing focus or unnecessarily interrupting their work."
year_published = 2025
