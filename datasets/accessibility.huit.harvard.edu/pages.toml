title = "Digital Accessibility for Content Creators | Digital Accessibility​"
description = """
This training will introduce learners to digital accessibility, demonstrate its importance, and provide guidance around Harvard’s Digital Accessibility Policy. We will discuss best practices for creating accessible digital content, and also for updating existing content to make it accessible to all users.
The audience for this training is anyone who develops, edits, or publishes digital content at Harvard, even if it's not your main job responsibility. The material will be applicable across digital platforms, such as websites, documents, and learning management systems.
Please contact digitalaccessibility@harvard.edu with any questions or accommodation requests."""
