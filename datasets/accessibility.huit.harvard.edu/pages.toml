["https://accessibility.huit.harvard.edu/get-started"]
title = "New to accessibility? Get started here. | Digital Accessibility​"
description = "This self-paced training provides an overview of Harvard's Digital Accessibility Policy and what you need to do to ensure your digital content and technologies are accessible for all. Learn more about how individuals with disabilities interact with digital content and how accessibility improvements benefit everyone. The course covers assistive technologies, role-specific responsibilities, and offers valuable resources to help you get started right away."
full_description = "New to accessibility? Get started here. Introduction to Digital Accessibility at Harvard This self-paced training provides an overview of Harvard's Digital Accessibility Policy and what you need to do to ensure your digital content and technologies are accessible for all. Learn more about how individuals with disabilities interact with digital content and how accessibility improvements benefit everyone. The course covers assistive technologies, role-specific responsibilities, and offers valuable resources to help you get started right away. Launch in the Training Portal arrow_circle_right Accessible Content Content Creator Essentials Whether you are sending an email, writing a document, managing a web page, or reviewing a Canvas course, these essentials can help you make your content accessible and ensure your message comes through clearly to your audience. Accessible Documents Steps you can take, such as tagging your document with headings, being mindful of color, and using formatting techniques, that will make your document more accessible to more people. Multimedia Accessibility Multimedia content such as video and audio enrich the digital experience for website visitors. The following practices for captions, audio descriptions, and transcripts will help you create equivalent experiences for all users. Creating Accessible Emails Whether you’re writing simple, everyday emails or designing marketing messages for a large audience, many of the same accessibility principles for content creation also apply to email. These guidelines and recommendations will benefit everyone and help... Data Visualizations, Charts, and Graphs Data visualizations are often not accessible due to low color contrast, insufficient labels, or images without alt text. Learn to create charts, graphs, and infographics that include everyone. Guide to Accessible Academic Content Whether you're developing course materials, adding content to Canvas, or building tests and quizzes, creating accessible academic content is a key part of supporting Harvard's Digital Accessibility Policy and providing an equitable experience for all... Accessible Development Techniques Browse a comprehensive library of how-to guides with practical examples and code snippets to help you create accessible content and code. Accessible Technology Procurement If you are contracting with a vendor, tool, or service outside Harvard for a technology product, we've provided guidance on evaluating a potential vendor, signing the Accessibility Rider, building a roadmap, and renewing the contract. Essentials for Developers Guidelines for creating accessible HTML and CSS. Check my site's accessibility Accessibility testing tools and methods How can you tell if the content you are creating is accessible? There are simple ways to check content with automatic tools and non-technical tests to see if your content is accessible and inclusive to everyone. Siteimprove - Harvard-licensed tool for public-facing websites Siteimprove breaks down accessibility issues into manageable tasks, tracks progress toward compliance, and provides recommendations and guidance. Upcoming Trainings and Office Hours Digital Accessibility Foundations Mar. 4 - Mar. 5, 2025 Virtual Creating Accessible Slides Mar. 4, 2025 10:00AM - 11:30AM Virtual Digital Accessibility for Content Creators Mar. 5, 2025 2:00PM - 4:00PM Virtual All eventsarrow_circle_right Digital Accessibility Policy and Resources Harvard University Digital Accessibility Policy This Policy is established to promote equal access to information technology and digital content and to improve the user experience of IT and digital / online media for all users, including persons with disabilities. Digital Accessibility Policy Procedures Information and guidance on implementing Harvard's Digital Accessibility Policy, with supporting examples and definitions. Harvard University Digital Accessibility Policy FAQs Browse information and frequently asked questions about Harvard's Digital Accessibility Policy that went into effect on June 1, 2023. Contacts and Support support Digital Accessibility Services (DAS) diversity_3 Digital Accessibility Liaisons (DAL)"
