["https://accessibility.huit.harvard.edu/language"]
title = "Language | Digital Accessibility​"
description = "Language that is difficult to read and understand is a potential barrier for all users, but particularly for people who have cognitive disabilities."
full_description = "Language Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Language expand_more Use plain language Support scanning and understanding Write helpful links Images and Media For Developers For Faculty For Managers For Purchasers Plain Language: Creates a ConversationPeople can read, understand, and use the information. Language that is difficult to read and understand is a potential barrier for all users, but particularly for people who have cognitive disabilities, low reading literacy, and people for whom the content is about an unknown topic or is written in an unfamiliar language. Plain language helps minimize barriers by making reading easy to understand. Plain language also improves ease of interaction, as clear headings and labels make it easier to navigate and operate a website or web application. When content creators focus on plain language: Content and controls are easy to understand for all users. People who are unfamiliar with the topic or language are better able to understand. People who have disabilities that affect the ability to access and read content are not held back by unnecessarily complex language."
