title = "Interaction - Developers | Digital Accessibility​"
description = "For maximum usability, interactive elements must be operable by people who use assistive technology and people who use alternative input devices."
full_description = "Interaction - Developers Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media For Developers For Developers expand_more Essentials for Developers Structure - Developers Interaction - Developers Interaction - Developers expand_more Keyboard Custom widgets and controls Notifications and alerts Support navigation and wayfinding Presentation - Developers Images and Media - Developers For Faculty For Managers For Purchasers Easy Interaction: Everything WorksPeople can use the product across all modes of interaction and operating with a broad range of devices. For maximum usability, interactive elements must be operable by people who use assistive technology and people who use alternative input devices. They must be straightforward and easy to understand for everyone. Using native HTML elements is the best way to support easy interaction. However, in some cases custom interactive elements may be necessary, in which case it's important to provide the additional semantic and interactive features that are needed to ensure custom controls are accessible and usable. When developers focus on easy interaction: People are readily able to understand the purpose and functionality of interactive elements. When people encounter barriers or make mistakes they are able to recover. People can operate the interactive elements using their preferred input device."
year_published = 2025
