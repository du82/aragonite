["https://accessibility.huit.harvard.edu/digital-accessibility-policy-procedures"]
title = "Digital Accessibility Policy Procedures | Digital Accessibility​"
description = "Digital Accessibility Services (DAS) offers training, consultation, and resources on accessibility for the Harvard community."
full_description = '''Digital Accessibility Policy Procedures Contents Introduction Policy Requirements Websites Purchasing & Procurement Multimedia Accessibility and Course Videos Documents & Internal Communication Tools Social Media Temporary Exceptions Available Assistance Policy and Procedures Terms and Phrases I. Introduction On April 11, 2023, Harvard University announced an updated Digital Accessibility Policy, that sets forth accessibility expectations to all new digital content created and used internally at the University, as well as technology systems, platforms, and applications bought or built by the University, starting June 1, 2023. The Policy calls for the University to publish “Digital Accessibility Implementation Procedures” (the “Procedures”) to provide interpretation and guidance; identify resources, support, and infrastructure relating to digital accessibility; and explain how members of the University community can meet the Policy’s requirements. The Procedures were developed by the University Accessibility Committee’s Digital Accessibility Working Group (DAWG) and formally adopted by the Accessibility Steering Committee (ASC). The DAWG and ASC will update the Procedures regularly to reflect new technological and structural developments at the University and feedback received from the University community. II. Policy Requirements The Policy applies (1) to “University Content”, which it defines to mean “any information or communication accessed or displayed in a digital format or medium, as text, image, audio, or video,” that is “created, posted, distributed or published for University Business.” and (2) to “University Information Technology”: i.e., information technology that is “purchased, developed, deployed, or used for University Business and, in the case of web-based applications and websites, is hosted on a Harvard-owned or -controlled domain.” The Policy in turn defines “University Business” to include “activities carried out under the auspices of Harvard University,” except for “activities organized or conducted by students or student organizations.” These Procedures give further definition to “University Information Technology,” “University Content,” and “University Business,” with supporting examples. The Policy’s requirements of University Information Technology and University Digital Content are as follows: Starting on June 1, 2023, “Harvard users using University IT to post, distribute, or publish University Content should aim to make such content conform to the Standards, to the extent technically feasible.” “Instances of University Information Technology newly purchased, licensed, or internally developed after June 1, 2023 are expected to conform to the Standards to the fullest extent possible at the point of rollout or implementation.” “The Accessibility Steering Committee will establish and recommend to Senior Leadership a prioritization plan for improving the accessibility of existing University Information Technology, including websites and web-based applications, and the existing University Content hosted, published, or communicated on those platforms. Priority will be given to University IT platforms that provide the most essential functions to, and are most broadly and regularly used by, Harvard faculty, staff, and students. In the case of public-facing websites, priority will be given to sites that are among the most highly trafficked and to those that contain core institutional information.” The “Standards” in the Policy are the Web Content Accessibility Guidelines, version 2.1, Level AA Conformance (“WCAG 2.1 AA”). These Procedures elaborate key concepts, including “created or produced at Harvard” and “substantial revisions or redesign,” in the Policy and Procedures Terms and Phrases section below. The Digital Accessibility Policy also covers non-Harvard created platforms, products, and services used for University Business including: Work done by vendors that develop, host, manage, or provide products and services. Platforms with online components, such as websites, mobile applications, or software-as-a-service (SaaS) platforms. Products or systems intended for use or access by Harvard students, alumni, faculty, staff, applicants, prospective students, and/or members of the general public. III. Websites A. Identifying a Site Owner for a University Website A Site Owner is the designated role or individual responsible for a University Website. Site Owners are responsible for the accessibility of their sites and must hold content creators, developers and other necessary parties accountable for ensuring the site’s accessibility. Site Owners are determined by the applicable unit's Dean, Vice President, Chair and/or Director. Site Owners may not have the technical knowledge or expertise needed to ensure that their “owned” websites conform to the Policy. While a Site Owner is an individual person, these Procedures recommend that Site Owners be assigned based on their roles, as individuals tend to change roles at the University over time. 1. Examples of Site Owners: Three different laboratories each have their own website. Organizationally, the labs report up to a Department. The Department reports up to a Division. The Division reports into a School. The applicable School's Dean, Vice President, Chair and/or Director is responsible for holding an appointed individual on behalf of the Division and Department accountable for the accessibility of the lab websites. Appointed individuals may be the Director of Communications, a specified Associate Dean, or the PI of the lab, as the School deems appropriate. An interfaculty initiative (IFI) creates a site to promote its annual event. Organizationally, the IFI reports up to The Office of the Provost. The Provost is responsible for holding the IFI accountable for the accessibility of the IFI website. The appointed Site Owner may be the Director of the Initiative or a designated Associate Provost but should not be ”the Office of the Provost.” B. Reporting and Responding to Accessibility Issues The Policy expects University Websites to indicate their commitment to accessibility by including a link to the Harvard Digital Accessibility Policy from each web page. (This can be accomplished most effectively by including the link in a footer or other web element that replicates across all pages of the site.) The "Report a Web Accessibility Concern" form is linked from the Policy page, providing the primary means for users to submit requests or express concern about a particular University Website. The Digital Accessibility Services (DAS) team within Harvard University Information Technology (HUIT) will triage requests submitted via this form and route them to the relevant Site Owner and Digital Accessibility Liaison (DAL) for follow-up. Site Owners who learn of a user accessibility issue through other channels also should submit the issue using the “Report a Web Accessibility Concern” form so that all such concerns can be cataloged centrally. Site Owners should ensure that prompt efforts are undertaken to address any reported barriers to access. If Site Owners are unable to address the issue promptly, the Site Owner and the DAL should contact University Disability Resources to discuss options for an accommodation. C. Site Remediation Under the Policy, the Accessibility Steering Committee may require a Site Owner to establish a plan to improve some or all non-conforming portions of an existing University Website. This may include websites and their content that would not otherwise be required to conform, such as a site created or revised prior to December 1, 2019 or access-restricted content created prior to June 1, 2023. In prioritizing websites for remediation, the ASC will consider several factors, including: How essential the website or its content is to University functions (i.e., is it functional or informational?); Whether the Site Owner is already planning a redesign; Target audience (i.e., is the website directed to internal or external users?); and Size of audience. 1. Remediation Process The ASC will refer identified sites to DAS for further evaluation. The DAS team will in turn contact each applicable Site Owner and DAL to provide information about their site and identify resources available to support remediation. DAS may assist Site Owners in prioritizing what to improve and how to approach the work, such as through incremental updates made by existing staff, through contracted work, and/or through platform migration. Site Owners must provide an evaluation report to the ASC enumerating efforts and periodically demonstrating progress. D. Evaluating a University Website for Accessibility Automated testing tools speed up the process of evaluation and allow for regular monitoring. However, human evaluation is also essential to assessing a website’s accessibility, because no single tool can determine to what extent a site conforms to the Standards. 1. Automatic scanning The use of automatic testing tools is recommended as a first step to scan and assess the broad level of accessibility for a University Website. 2. Manual testing Assistive technology, keyboard-only testing, and content review should be used as part of manual testing. The University’s Digital Accessibility Services provides guidance and training on how to test with a screen reader and keyboard and how to report and remediate issues. 3. Expert review An experienced professional can perform a deeper evaluation, which typically results in a detailed listing of issues and specific recommendations for improvements. DAS can assist with identifying reputable third-party service providers to conduct an expert review as needed. IV. Purchasing & Procurement If you are contracting with a vendor, tool, or service outside Harvard for a technology product, the agreement is subject to the Digital Accessibility Policy. Purchasing approvers are responsible for the procurement of accessible products, via the process outlined below. Establishing accessibility expectations early with vendors helps ensure that accessibility will be included and prioritized going forward. You can start with this list of accessibility questions for vendors. A. Accessibility Rider An Accessibility Rider should be considered for all technology contracts. By signing the Rider, a vendor commits to delivering a product that conforms to Harvard’s accessibility standards. Having a signed Rider will make it much easier to address accessibility issues promptly if they should arise after the product is in use. Download the Accessibility Rider (Word document, HarvardKey required) from the Office of General Counsel (OGC) website. B. Accessibility Roadmaps and Temporary Exceptions If the vendor is unwilling to commit to the requirements described in the Accessibility Rider, the University should work with the vendor to extract other assurances and commitments toward eventual compliance with Harvard’s accessibility requirements. A common and appropriate fallback position from the Rider is an “accessibility roadmap” that identifies accessibility issues to be addressed and establishes the timeline for the vendor to address them. Periodic check-ins with the vendor should also be scheduled to measure progress against accessibility goals. Contact DAS (digitalaccessibility@harvard.edu) for help developing an accessibility roadmap. If needed, you may request a temporary procurement exception. A temporary exception ensures that purchasers and their approvers understand accessibility limitations and how they might work around them as required. They are signed by leaders approved by the Accessibility Steering Committee (ASC). Such designated signers take on responsibility for monitoring progress on the status of temporary exceptions and reporting periodically to the ASC. C. Saving the agreement Save any key accessibility documentation along with the contract. If you’re documenting the contract in Harvard’s Buy-to-Pay (B2P) system, contact the Contract Manager for document uploading. Learn more about how to document accessibility in B2P. D. Renewing a contract When renewing a contract, the Accessibility Rider should be reintroduced, whether or not it was signed previously. Accessibility documentation should also be reviewed for renewal, including: Voluntary Product Accessibility Template (VPAT) or Accessibility Conformance Report (ACR) Past Roadmaps/Temporary Exception Forms, and Other vendor documentation. V. Multimedia Accessibility All videos posted to University Websites and platforms must include synchronized, accurate, closed captions and should aim to include descriptive audio where applicable. Audio files, such as podcasts, that are posted to University Websites and platforms should be accompanied by accurate transcripts. A. Captions Captions convert audio dialogue and sounds into text that appears on a video, synchronized with audio. High-quality captions include highly accurate transcription, proper punctuation, speaker identification, and the identification of meaningful sounds other than speech. Captioning must have an accuracy rate equal to or greater than that offered by a third-party vendor captioning service such as 3Play Media, and in a manner consistent with industry standards regarding synchronicity, completeness, and placement. B. Transcripts High-quality transcripts include accurate transcription, proper punctuation, speaker identification, and the identification of meaningful sounds other than speech. Audio segments and podcasts posted on University Websites and covered by the Policy must be accompanied by a full transcript. These transcripts either must be available on the same page as the audio player or linked directly from the description text. C. Descriptive Audio If a video includes content that is only presented visually, such as on-screen text, graphics, or actions that are not obvious from the audio, this visual information would need to be described in order to be accessible to people who are unable to see it. By planning ahead, a video producer can script and create content that includes descriptions of meaningful visual elements and actions in many cases. If it’s not possible to describe visual information within the script or audio, then there may be situations where it is appropriate to provide more extensive audio description as a further enhancement to accessibility. Additionally, providing meaningful content from a video (i.e., code snippets, math equations, graphs, tables, image details) presented in accessible formats alongside multimedia to be explored at their own pace should likewise enhance accessibility and overall experience. D. Live video captions Harvard events that are live-streamed through third-party platforms are not generally subject to the Policy. However, events streamed on a third-party platform but embedded within a University Website would be subject to the Policy. The University live-stream'''
year_published = 2025
year_updated = 2025
