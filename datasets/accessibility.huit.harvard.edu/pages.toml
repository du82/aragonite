["https://accessibility.huit.harvard.edu/support-scanning-and-understanding"]
title = "Support scanning and understanding | Digital Accessibility​"
description = "Structure the page content and presentation to support scanning. Make the substance and purpose of the content and functionality readily apparent, and help people quickly find the information they are seeking."
full_description = "Support scanning and understanding Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Language expand_more Use plain language Support scanning and understanding Write helpful links Images and Media For Developers For Faculty For Managers For Purchasers Structure the page content and presentation to support scanning. Make the substance and purpose of the content and functionality readily apparent, and help people quickly find the information they are seeking. Pay close attention to the sequence of your content. People who use screen reader software will benefit from content that makes sense when read linearly. Structure the page for scanning and logical sequence: Avoid extended blocks of unbroken text. Use headings and lists to break up content into chunks that are easy to scan. Headings and chunked content allow people to find what they are seeking without requiring them to read through content that is irrelevant. Write descriptive headings and labels. Clear headings and labels are essential in communicating the structure and relationships of page content and functionality. Pay attention to content sequence. Ensure that the order of the content follows a logical sequence. Testing View pages with stylesheets turned off to review the content without layout and design (see Accessibility Testing Tools and Practices for example of tools to help you do this). Or listen to the page being read out by a screen reader. Is the content broken up with headings and lists? Does the content sequence make logical sense? Resources Center for Plain Language Understanding SC 2.4.6—Headings and Labels (WAI) Understanding SC 1.3.2—Meaningful Sequence (WAI) Related Techniques ✎ Technique: Writing headings Headings are used to group and label sections of content, giving visual structure to the page and providing a means of navigation to screen reader users. ✎ Technique: Writing headings Headings are used to group and label sections of content, giving visual structure to the page and providing a means of navigation to screen reader users."
