["https://accessibility.huit.harvard.edu/nvda"]
title = "Getting Started Testing with NVDA | Digital Accessibility​"
full_description = '''Getting Started Testing with NVDA Basics of the Screen Reader Testing screen reader accessibility is an essential step in reviewing your content. NVDA is a free screen reader available for download for Windows that reads aloud page content and relevant semantic info (such as headings, lists, and links). Use the following guidance to get started testing with NVDA, and to get a more comprehensive picture of accessibility. Download:Download NVDA to get started. Browser Choice:Screen readers work best with certain browser combinations. For NVDA the recommended browser is Chrome. NVDA key:NVDA uses a modifier, called the NVDA key, that is combined with other keys for screen reader keyboard commands. It can be set by the user to be either the CAPS LOCK or the INSERT key. We'll use CAPS LOCK as our NVDA key, but use whatever NVDA key you prefer. In this page: Start testing Change how fast NVDA talks Add the Speech Viewer Practice Testing Let's Start Testing When testing, try not to use your mouse. Instead use keyboard controls for navigation. Throughout your assessment, consider: Is any content being skipped that should be read? Is any content being read that's not visible? Are headings, links, and buttons announced? Turn NVDA on or off ON: Control + Alt + N OFF: CAPS + Q Note: Once NVDA is turned on, the behavior of your keyboard keys will change. For example, you won't be able to use CAPS LOCK to capitalize text while NVDA is on. Read All Content Use CAPS LOCK + DOWN ARROW to start reading all page content. Is all content read aloud? Is it read in a logical order that follows the visible page structure? Do the names of items that you hear match the names you see? Are images read with their alt text or skipped if decorative? Change How Fast NVDA Talks Using a slower speaking rate can help with comprehension as you listen during testing. Use CAPS LOCK + N to open NVDA Menu Select Preferences and then Settings Select Speech and adjust Rate slower Add the Speech Viewer This is a text box that shows what is being read by the screen reader. It can be helpful if you want to view text as you test rather than just listen. Press CAPS LOCK + N to open NVDA Menu Select Tools then Speech Viewer Navigate Interactive Elements Interactive elements are things like buttons, links, and form fields. Use TAB to go forward through interactive elements. Use SHIFT + TAB to go backwards. Can you navigate to all interactive elements? As you tab, does the name of elements that you hear matches the name you see? Select Links or Buttons Use ENTER to select or activate certain elements. Can you access (TAB) and activate (ENTER) these elements? Does the visible name on the button match the name that you hear? Is it announced as a button? Is the link text descriptive instead of vague, like "click here" or "read more"? Navigate with Arrow Keys Use ARROW KEYS to navigate options or maneuver content. Can you go backwards and forwards through radio buttons? Can you select and then navigate down through drop-down menus? Can you navigate between tab panels or tree menus? Can you maneuver sliders or select options for auto-complete? Enhance Your Testing Skills Open Elements List Use CAPS LOCK + F7 to open a list of page elements such as headings, links, and landmarks. Use the ESC key to close the elements list, if needed. Are headings and links descriptive? Are landmarks present, unique and being used correctly? Review buttons and form fields, if any. Testing Forms Uses various keyboard keys. Check any forms on the page. Are you able to fill out the form using only your keyboard? Are there correct and distinct labels for each field? Can you select checkboxes via the SPACEBAR key? Are you alerted to errors and/or requirements? Do you receive audible confirmation when you submit the form? Testing Dynamic Content Use various keyboard keys. Test elements like pop-up dialog boxes and modal windows. Can you tab to controls within the pop up window? Can you close the window using the ESC key? When you close the window and navigate away, does the focus move to a logical place? Are status and alert messages announced by the screen reader? Resources and Testing Practice Practice Testing Use a screen reader on an inaccessible page - University of Washington - Inaccessible Test Page Use a screen reader on an accessible page - University of Washington - Accessible Test Page Resources NVDA Shortcuts List (Deque) Using NVDA to Evaluate Web A11y (WebAIM) Accessibility Testing with the NVDA (Deque) Self-paced course on Testing with NVDA (Harvard Training Portal) Upcoming Testing Training Testing for Digital Accessibility Apr. 9, 2025 10:00AM - 12:30PM Virtual All instructor-led trainingsarrow_circle_right'''
year_published = 2025
clearnet = "https://accessibility.huit.harvard.edu/nvda"
