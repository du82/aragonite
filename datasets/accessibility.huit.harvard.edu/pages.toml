description = "Guidelines and resources to make your content accessible."
full_description = "Content Creators This section is for people who create and publish content on websites. It contains best practices, examples, testing methods, and resources to support the following guidelines. Essentials Guidelines for creating accessible content. Purpose Design for clarity and simplicity Structure Provide visual and semantic structure Identify headings, lists, and tables Provide accessible documents and services Wayfinding Use consistent navigation and orientation Provide alternative ways to navigate Presentation Design for readability Design for comprehension Use sufficient color contrast Language Use plain language Support scanning and understanding Write helpful links Images and Media Use images and media to enhance understanding Write good Alt Text to describe images Provide captions and descriptions of video Upcoming Content Creator Trainings Digital Accessibility for Content Creators Mar. 5, 2025 2:00PM - 4:00PM Virtual Digital Accessibility for Content Creators Apr. 17, 2025 10:00AM - 12:00PM Virtual Digital Accessibility for Content Creators May. 21, 2025 10:00AM - 12:00PM Virtual All instructor-led trainingsarrow_circle_right New Self-Paced Training: Digital Accessibility for Content Creators In this training, you’ll learn essentials and best practices for creating digital content at Harvard that’s accessible to everyone. The material will be applicable across digital platforms, such as websites, documents, and learning management systems. Launch in the Training Portal (HarvardKey required)"
