["https://accessibility.huit.harvard.edu/access-technologies/keyboard"]
title = "Keyboard | Digital Accessibility​"
description = "Make it easier for people to complete input fields requesting personal information."
full_description = "✎ Technique: Identify input purpose Page Make it easier for people to complete input fields requesting personal information. ✎ Technique: Content on hover or focus Page Make it easier for users to interact with added content. Tooltips, drop-down menus, and popups are examples of added content. ✎ Technique: Character key shortcuts Page If keyboard shortcuts are implemented using only a letter (including upper- and lower-case letters), punctuation, number, or symbol characters, provide a way to turn off or remap character key shortcuts. ✎ Technique: Choosing a media player Page Media player accessibility is essential for video content. Evaluate the accessibility and cross-device compatibility of the media player that comes with your video-distribution platform. ✎ Technique: Site search Page It's important the search facility on your site is logically and conventionally placed and constructed for optimal accessibility. ✎ Technique: Site and page navigation Page It's important to provide consistent navigation regions to navigate between a site's pages and—where there is a lot content on each page—between sections of pages. ✎ Technique: Autocomplete input controls Page Autocomplete widgets can be helpful for accessibility because they can make it easier to enter text by providing suggestions based on the characters initially typed. ✎ Technique: Session extension Page For a number of reasons including data persistence, performance and security, it is sometimes beneficial to terminate idle user sessions. It's important to warn people a session is about to expire and give them the option to continue. ✎ Technique: Accessible modal dialogs Page Modal dialogs can enhance usability by focusing attention on a specific message that requires a user action to continue. An accessible modal dialog is one where keyboard focus is managed properly, and the correct information is exposed to screen readers. ✎ Technique: Expandable sections Page Expandables (sometimes called “collapsible” or “disclosure widgets”) are simple interface patterns that allow you to expand and collapse content."
year_published = 2025
