["https://accessibility.huit.harvard.edu/images-and-media-developers"]
title = "Images and Media - Developers | Digital Accessibility​"
description = "Images can improve usability by making orientation and interaction elements easy to recognize and use."
full_description = "Images and Media - Developers Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media For Developers For Developers expand_more Essentials for Developers Structure - Developers Interaction - Developers Presentation - Developers Images and Media - Developers Images and Media - Developers expand_more Provide accessible images Provide an accessible media player For Faculty For Managers For Purchasers Accessible Media: Supports All SensesPeople can understand and use information contained in media, such as images, audio, video, animation, and presentations. Images can improve usability by making orientation and interaction elements easy to recognize and use. Developers must ensure the interface is accessible and usable without access to visual cues, and that people who need a custom display can still access images. In addition, media accessibility requires that any player used to present audio and video is accessible to assistive technology and keyboard users. When developers focus on accessible media: All image-based elements of the user interface are accessible to people who cannot accessible visual information. Controls for operating media are usable with assistive technology and do not require use of a pointing device, like a mouse."
