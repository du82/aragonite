["https://accessibility.huit.harvard.edu/encode-elements-logical-order"]
title = "Encode elements in a logical order | Digital Accessibility​"
description = "For a readable interface, it's important to use visual cues to group or separate content to show which content relates to other content."
full_description = "Encode elements in a logical order Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media For Developers For Developers expand_more Essentials for Developers Structure - Developers Structure - Developers expand_more Use standard web technologies Encode elements in a logical order Use semantic elements for regions and content Provide accessible labels and instructions Interaction - Developers Presentation - Developers Images and Media - Developers For Faculty For Managers For Purchasers Screen readers read page content in a linear order, which is defined by the order that content appears in the source code (the Document Object Model) at a given time. Sometimes, when visual positioning is used to change the linear order for display purposes, the logical order is lost when read by a screen reader. This can affect both blind screen-reader users and sighted people with reading difficulties who are listening to content being read. Make sure that content is announced in a logical order. Use CSS to position content, rather than layout tables. Be aware of the potential effects on reading flow when using CSS to position content in a location that’s significantly different from where it appears in the content order. Use a DOM inspection tool to check the rendered code order, especially when the content is dynamically updated (see Tools). Testing Visually examine the content order of the page, then listen to the page as it’s read by a screen reader. Does the page’s content order make sense when read aloud? More information Understanding WCAG SC 1.3.2—Meaningful Sequence (WAI) Related Techniques ✎ Technique: Grouping section content For a readable interface, it's important to use visual cues to group or separate content to show which content relates to other content. ✎ Technique: Positioned navigation bar When positioning elements using CSS, it's possible to place them in a position that does not reflect their location in the source order. This can have unexpected side effects for keyboard-navigation users."
year_published = 2025
