["https://accessibility.huit.harvard.edu/provide-accessible-media-player"]
title = "Provide an accessible media player | Digital Accessibility​"
description = "Media player accessibility is essential for video content. Evaluate the accessibility and cross-device compatibility of the media player that comes with your video-distribution platform."
full_description = "Provide an accessible media player Roles Roles expand_more For Content Creators For Content Creators expand_more Purpose Structure Wayfinding Presentation Language Images and Media For Developers For Developers expand_more Essentials for Developers Structure - Developers Interaction - Developers Presentation - Developers Images and Media - Developers Images and Media - Developers expand_more Provide accessible images Provide an accessible media player For Faculty For Managers For Purchasers Audio and video should be provided using an accessible media player. To support media accessibility features, including captions and audio descriptions, use a player with controls that are clearly identified and that can be operated using the keyboard (see the section on Interaction for general requirements). Do not use autoplay. Leave it to the user to decide when to play the media. Ensure that controls are keyboard accessible. This means all controls are operable using only the keyboard and do not require the use of a mouse. Support alternative formats. The media player should support captions and audio descriptions. Testing For every page that includes a media player: Does the audio or video start playing only in response to a user action? Are all of the controls reachable using the keyboard? Do they respond to standard keyboard commands? Is there a clear focus indicator? Does each control have a descriptive name? Is the current state of each control clear? For example, does the Play/Pause button convey whether the video is playing or paused? Can the player toggle the display of captions? Can the player play audio descriptions? Resources Understanding SC 2.1.1—Keyboard (WAI) Understanding SC 2.4.7—Focus Visible (WAI) Understanding SC 4.1.2—Name, Role, Value (WAI) Accessible Media Player Resources and Demos (Henny Swan, web archive copy) Related Techniques ✎ Technique: Choosing a media player Media player accessibility is essential for video content. Evaluate the accessibility and cross-device compatibility of the media player that comes with your video-distribution platform."
