["https://accessibility.huit.harvard.edu/content/custom-widgets-and-controls"]
title = "Custom widgets and controls ✎ | Digital Accessibility​"
description = "Autocomplete widgets can be helpful for accessibility because they can make it easier to enter text by providing suggestions based on the characters initially typed."
full_description = "✎ Technique: Autocomplete input controls Page Autocomplete widgets can be helpful for accessibility because they can make it easier to enter text by providing suggestions based on the characters initially typed. ✎ Technique: Accessible modal dialogs Page Modal dialogs can enhance usability by focusing attention on a specific message that requires a user action to continue. An accessible modal dialog is one where keyboard focus is managed properly, and the correct information is exposed to screen readers. ✎ Technique: Expandable sections Page Expandables (sometimes called “collapsible” or “disclosure widgets”) are simple interface patterns that allow you to expand and collapse content. ✎ Technique: Accessible names for buttons Page Whether you provide controls using standard HTML elements or create custom controls, ensure that controls are given appropriate names. ✎ Technique: Managing focus and inactive elements Page If an active element is intended to be unavailable in a particular state and it’s hidden from view, it should not be able to receive focus. ✎ Technique: Keyboard accessible links Page Links ( elements) are focusable by default, so it should normally be possible to activate them using the keyboard. However, under certain circumstances, they are not focusable."
year_published = 2025
