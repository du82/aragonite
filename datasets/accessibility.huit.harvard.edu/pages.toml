full_description = "Intro to Digital Accessibility & Harvard's Policies Trainings This training introduces and explores basic concepts of digital accessibility and relevant university policies including Harvard's Digital Accessibility Policy. No prerequisite experience with accessibility is required. Learn how you and your department can create more inclusive and welcoming digital assets. This session is designed to address how anyone can consider digital accessibility as they purchase, develop or publish electronic content as part of their role at Harvard. This includes a wide variety of roles and can be useful even if purchasing or publishing content is not your primary role at the university. In addition to introductory concepts and details of the policies, attendees will learn what resources are available to the university now and in the future, as well as training opportunities and tools to help create and procure more accessible electronic content. Please contact digitalaccessibility@harvard.edu with any questions or accommodation requests. Upcoming Trainings Introduction to Digital Accessibility & Harvard's Policies Mar. 6, 2025 10:00AM - 11:30AM Virtual - Zoom Virtual Introduction to Digital Accessibility & Harvard's Policies May. 20, 2025 10:00AM - 11:30AM Virtual - Zoom Virtual Introduction to Digital Accessibility & Harvard's Policies Mar. 6, 2025 10:00AM - 11:30AM Virtual - Zoom Virtual Introduction to Digital Accessibility & Harvard's Policies May. 20, 2025 10:00AM - 11:30AM Virtual - Zoom Virtual"
