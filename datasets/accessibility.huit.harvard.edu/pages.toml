title = "Creating Accessible Slides | Digital Accessibility​"
description = """
This course provides an overview of the concepts and concrete steps to create accessible documents in Microsoft PowerPoint and Google Slides. It also introduces how to convert accessible slideshows into accessible PDFs. 
Designing with accessibility in mind improves ease of use and access to your content for everyone. 
To ensure a hands-on learning experience in this course, there are a number of activities for which your laptop will be required. Software requirements: Microsoft PowerPoint or Google Slides and Adobe Acrobat Pro DC.
This course will provide:

Understanding of core concepts and benefits of accessible design    
How to use automated accessibility checkers, if available   
Making an accessible slide deck
Learn the basics of converting documents to accessible PDFs 

Please contact digitalaccessibility@harvard.edu with any questions or accommodation requests."""
