["https://accessibility.huit.harvard.edu/technique-text-spacing"]
title = "✎ Technique: Text spacing | Digital Accessibility​"
description = "People with a variety of print disabilities (including low vision, dyslexia, other cognitive disabilities) can benefit from being able to increase the spacing between lines, words, and/or letters on their own device."
full_description = "✎ Technique: Text spacing Being able to change not just a site's text size but also its text spacing can be helpful to people with different disabilities. People with a variety of print disabilities (including low vision, dyslexia, other cognitive disabilities) can benefit from being able to increase the spacing between lines, words, and/or letters on their own device. When spacing is increased, the content should not become less readable, or unreadable, due to content overlapping or being completely hidden. Examples ✗ Bad example: Non responsive interface. The effect of changing the text spacing and line height on a non-responsive interface: some of the headline text of each item no longer displays ✓ Good example: Responsive interface. The effect of changing the text spacing and line height on a responsive interface: the headline text of each item always displays. (Source: Knowbility article on text spacing) See also: Text Custom stylesheet Support flexibility and adaptation ✎ Perceivable Low vision Cognitive Dyslexia CSS Techniques"
