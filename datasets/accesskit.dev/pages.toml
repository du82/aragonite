title = "AccessKit: Accessibility infrastructure for UI toolkits"
description = "Accessibility infrastructure for UI toolkits"
full_description = "Accessibility infrastructure for UI toolkits AccessKit makes it easier to implement accessibility, for screen readers and other assistive technologies, in toolkits that render their own user interface elements. It provides a cross-platform, cross-language abstraction over accessibility APIs, so toolkit developers only have to implement accessibility once. Getting started AccessKit is written in Rust and has bindings for C and Python. Rust The following Rust projects already integrate AccessKit: Bevy egui Freya Slint Xilem If you are using the winit cross-platform windowing library for Rust, you should use the AccessKit winit adapter. Otherwise, you'll need to use one or more of the AccessKit platform adapters: macOS adapter Unix adapter Windows adapter C The latest release of the AccessKit C bindings, including the header file, pre-built libraries, examples, and source code, can be found on the GitHub releases page for the C bindings. Python You can find the AccessKit Python bindings on PyPI."
