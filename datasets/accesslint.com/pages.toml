["https://accesslint.com/blog/statuses-and-review-change-requests"]
title = "AccessLint"
description = "Automated Web accessibility testing for GitHub pull requests"
full_description = '''Statuses and Review Change Requests September 1, 2017 When you've installed the GitHub App, the next time you open a Pull Request you'll notice a new "check" status badge for AccessLint. That's our way of telling you what AccessLint is up to. GitHub supports failure statuses that you can configure to block delivery of code. We don't do that. AccessLint will only show you pending and success statuses, even if you've introduced an issue. We're following a Code Review model instead of a failing build model, so that you have more flexibility while still being accountable. To that end, we've changed the Review from "Comment" to "Request Changes". We hope this drives it home that you really should fix the issue, but we won't go so far as to block delivery.'''
year_published = 2017
