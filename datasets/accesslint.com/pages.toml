["https://accesslint.com/blog/new-checks-added"]
title = "AccessLint"
description = "Automated Web accessibility testing for GitHub pull requests"
full_description = "New Checks Added: Valid role Values, Accessible Button Text, and More February 3, 2018 We’re excited to announce additional checks that AccessLint now runs to help you and your team prevent even more accessibility issues from reaching your customers. The next time you open a Pull Request, AccessLint will review your code to check that: Buttons have accessible text Values of the lang attribute on the html element are valid Attributes that start with aria- are valid ARIA attributes Values of the ARIA role attribute are valid A common mishap made by those both familiar with and new to ARIA is accidental misspelling of attribute names and values. Given the vast landscape of the ARIA specification, this isn’t much of a surprise (is it aria-role or role? 1). With AccessLint, you and your team can work fast and be confident that these small blunders won’t slip in over time. Add AccessLint to your GitHub project today! It’s free for open source projects. It’s role 😉 ↩"
