title = "Meet the Mentor Archives - ACESCentral"
full_description = "Meet the Mentor Meet the Mentor: Pablo Garcia Soriano, Head of Digital Imaging, Mission By Steve Tobenkin | April 23, 2020 | 0 Comments Posted in Meet the Mentor Q. Pablo, how did you start your career? A. It’s a bit of a long story…I studied Civil Engineering and Technical Architecture. After finishing my studies, I found out that the real world of construction was not really for me, so I started working as a graphic designer and later as a motion graphics designer. As… Read More Meet the Mentor: Walter Arrighetti By Steve Tobenkin | April 7, 2020 | 0 Comments Posted in Meet the Mentor Q. Walter, tell us about your diverse background and how that informs your approach to ACES? A. I started my career in Technicolor, engineering the Post-Production Technology for many high-profile titles co-processed by the company’s multiple sites. That was during the transition era of film being gradually replaced by digital and cloud-based workflows, thus being… Read More Meet the Mentor: Chris Brejon, Illumination Mac Guff By Steve Tobenkin | April 7, 2020 | 0 Comments Posted in Meet the Mentor Q. Chris, you’ve been in VFX for over a decade…talk about your background and work (maybe mention where you’re based?) A. I mostly come from an artistic background studying traditional painting and drawing. When I graduated, my purpose has always been to work on tent pole movies and travel around the world. After more than… Read More Meet the Mentor: Nick Shaw, Antler Post By Steve Tobenkin | April 1, 2020 | 0 Comments Posted in Meet the Mentor Q. What is your background? A. I was working as an in-house editor at E.S. Video in Surrey U.K., and they became the main reseller for the Media 100 NLE in the region. I was using 3-machine Betacam SP suites at the time, but was very interested in the new technology. I moved into a… Read More Meet the Mentor: John Frith, Head of Imaging at MPC By Steve Tobenkin | May 1, 2016 | 0 Comments Posted in Meet the Mentor JOHN FRITH, HEAD OF IMAGING AT MPC ANSWERS 3 QUESTIONS ABOUT HOW AND WHY THE COMPANY USES ACES IN VIRTUALLY ALL THEIR WORKFLOWS. Q: John, how are you using ACES at MPC? A: We are fully setup to support ACES at MPC and welcome any ACES based projects. We’ve worked on a number of (large)… Read More"
