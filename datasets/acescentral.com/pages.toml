description = "ACESCentral FAQ What are the ACES Forum Rules and Guidelines? What is the ACESCentral Privacy Policy? What are the Participation guidelines for the ACES Virtual Working Group Development? How do I create a post on ACESCentral? How do I edit my ACESCentral Profile and/or add my full name? How do I change my ACESCentral password?…"
full_description = "ACES Community Website and Forum Rules, Guidelines & FAQ ACESCentral FAQ What are the ACES Forum Rules and Guidelines? What is the ACESCentral Privacy Policy? What are the Participation guidelines for the ACES Virtual Working Group Development? How do I create a post on ACESCentral? How do I edit my ACESCentral Profile and/or add my full name? How do I change my ACESCentral password? How do I subscribe to the Master ACES Calendar? The Calendar is located here: https://acescentral.com/calendar/Instructions for subscribing are here: Subscribing to VWG Calendars Can I have the system automatically notify me of a post that I’m interested in? How can I list an ACES related event on the ACES Master Calendar? Can I use the ACES Logo on my movie? How can I add my ACES shot to IMDb or ShotOnWhat? How do I contact the ACES Team?We encourage you to post your questions publicly whenever possible as this is consistent with our desire to be open and accountable. We realize there may be times when that is not comfortable. Here are the ways you can contact the ACES Team members. For sign-on or registration issues aces@oscars.orgTo ask a private technical question acessupport@oscars.orgTo become an ACES Product Partner – aces@oscars.orgFor private suggestions to ACES leadership, technical or marketing teams aces@oscars.org Be sure to follow us on Twitter: @AcademyACES and #AcademyACES"
