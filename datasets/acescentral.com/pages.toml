title = "News Feed Archives - ACESCentral"
full_description = "News “Find Me Falling” on Netflix: A love story remotely finished in Mistika Boutique in ACES By Steve Tobenkin | August 26, 2024 | 0 Comments Posted in News Feed Recently premiered on Netflix, ‘Find Me Falling’ is a romantic comedy set against the stunning backdrop of Cyprus. To capture its enchanting visuals, Full Moon Productions relied on Mistika Boutique for color grading, VFX turnaround, and finishing, bringing the film’s magical colors to life. Read the whole story here. Thanks to ACES Product Partner SGO and Cyprus-based Full Moon Productions… Read More Finding the Perfect Finish for ‘Furiosa: A Mad Max Saga’ By Steve Tobenkin | June 26, 2024 | 4 Comments Posted in News Feed Thanks to Digital Media World for this coverage of Colourist Eric Whipp working remotely with his team between LA, Toronto and Sydney to build the looks on Baselight that tell the story of the new Mad Max film, Furiosa, in ACES! https://www.digitalmediaworld.tv/post/finding-the-perfect-finish-for-furiosa-a-mad-max-saga “George likes the term ‘rolling DI’, implying a tight integration between departments so… Read More HBO original series 30 Coins Season 2 finishes in ACES By Steve Tobenkin | May 31, 2024 | 0 Comments Posted in News Feed Spanish post house La Bestia Produce relied upon an ACES color managed pipeline which provided a fresh look and eliminated the need for LUTs, facilitating more creative freedom. You can read more here. One of the main benefits of the transition to an ACES colorspace was that the colorists were able to work in the… Read More BBC Crime Series ‘Vigil’, finished in ACES By Steve Tobenkin | February 22, 2024 | 0 Comments Posted in News Feed Blazing Griffin Post’s team in Glasgow returned for post production of ‘Vigil’ season 2, delivering all aspects of picture finishing in 4K using ACES, with both SDR and HDR deliverables. Read about it here. Thanks Griffin Post and Senior Colourist Colin Brown, Director Andy De Emonny and Cinematographer Matt Wicks to Digital for the work and Media World… Read More Ed Rutherford BSC uses ACES on The Eternal Daughter By Steve Tobenkin | December 21, 2023 | 0 Comments Posted in News Feed Thanks to cinematographer, Ed Rutherford BSC and and Ron Prince, Editor of Cinematography World for their discussion of ACES use on “The Eternal Daughter”. “Employing LUTs that I created with Jodie, we reviewed the 2K and 4K scans of the S16mm and 35mm tests, and I have to say the 4K 16-bit DPX scans of… Read More Apple Event shot on iPhone using ACES! By Steve Tobenkin | November 21, 2023 | 0 Comments Posted in News Feed Apple recently held their Scary Fast Apple” event and used ACES in the production and postproduction of the event video. Check out these links to watch the BTS and get additional info: https://www.deccanherald.com/technology/gadgets/did-you-know-apples-scary-fast-keynote-was-entirely-shot-on-iphone-2751618 https://www.avinteractive.com/markets-news/live-events/scary-fast-apple-event-shot-with-blackmagic-iphone-app-16-11-2023/ https://www.apple.com/jo/newsroom/2023/10/behind-the-scenes-at-scary-fast-apples-keynote-event-shot-on-iphone/?videoid=03ed95365e3eca79a7fb37740e84e6d1 Read More ACES 2.0 Features and Development/Release Schedule Announced By Steve Tobenkin | November 20, 2023 | 3 Comments Posted in News Feed The ACES Team has released details on the projected release of ACES 2.0 to ACES Product Partners and other industry developers. They will integrate the new ACES features and release to end-users later in 2024. See details here ! Read More Color Management: OCIO & ACES in AE 2023 by Provideo Coalition By Steve Tobenkin | October 30, 2023 | 2 Comments Posted in News Feed Thanks to Chris Zwar and Provideo Coalition for this article and video on ACES support in Adobe’s After Effects: This is an add on to his previous, very detailed article and video introduction to ACES: Read More After Effects integration with OpenColorIO (OCIO) enables you to work natively (ACES) By Steve Tobenkin | October 10, 2023 | 0 Comments Posted in News Feed Thanks to Adobe for publishing this guide: https://helpx.adobe.com/after-effects/using/opencolorio-aces-color-management.html Read More ACES Education at Sundance Film Festival Asia 2023 By Steve Tobenkin | August 29, 2023 | 0 Comments Posted in Events, News Feed ACES Vice chair Joachim Zell, recently lead several presentations featuring ACES at the 2023 Sundance Film Festival Asia, in Taipei, Taiwan. ACES is a global standard and continues to grow in popularity internationally. Thanks to Iris Wu (team member of the Sundance Asia) and Sundance Asia team for their support. Read More 1 2 3 … 14 Next »"
