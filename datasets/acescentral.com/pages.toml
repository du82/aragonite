title = "Events Archives - ACESCentral"
full_description = "Events IMAGO Panel: ACES 2.0 at Euro Cine Expo By Steve Tobenkin | June 20, 2024 | 0 Comments Posted in Events Friday June 28 at 8:45am PT (17:45 Munich Time) Roberto Schaefer, ASC – AIC will moderate a panel at the ECE 2024 Symposium at Euro Cine Expo with Industry experts who will discuss innovations in ACES 2.0 and the ACES system. Panelists will include: Miga Bär • Workflow consultant and NSC Associate Member Francesco Luigi Giardiello • Production… Read More Join us at the ACES Lounge – Cine Gear Expo LA June 7-8, 2024! By Steve Tobenkin | May 22, 2024 | 0 Comments Posted in Events ACES is excited to be at Cine Gear Expo in LA June 7-8, 2024! Please stop by our “ACES Lounge” on the Warner Bros. backlot: Booth L622. We’ll bring you up to speed on the details of the recent Developer Release of ACES 2.0 and how it will be integrated into products you use on… Read More Colorist Mixer at NAB 2024 By Steve Tobenkin | March 29, 2024 | 0 Comments Posted in Events ACES is proud to be a returning sponsor of the Colorist Mixer at NAB. This year’s get together is schedule for Sunday 4/14/24 from 7p-11p PT. We hope to see you there! Registration details here. Read More Let’s Talk ACES at NAB 2024! By Steve Tobenkin | March 29, 2024 | 0 Comments Posted in Events Don’t miss this amazing panel at NAB on Tuesday 4/16 at 4:15pm! It promises to be a lively conversation with insight and tips on creative tools, and processes that can simplify and improve your productions, whether you’re working on indie shows, television/streaming or tentpole block busters. The ACES Team will be in attendance and… Read More ACES at HPA Tech Retreat 2024 By Steve Tobenkin | February 10, 2024 | 0 Comments Posted in Events The ACES team will be at HPA this year, with multiple goals, including a presentation of a Case Study:“Color Appearance Models and the Future of Color Management” which highlights the ACES 2.0 release’s use of Color Appearance Models to help accomplish the goal of making the ACES rendering transform invertible, which was a top user… Read More SDR/HDR Presentation and Panel at Linwood Dunn Theater – 11/5/23 By Steve Tobenkin | September 27, 2023 | 0 Comments Posted in Events Join SMPTE and the Colorist Society Hollywood for a lively presentation and discussion on HDR/SDR at this free event. ACES will part of the conversation and we’ll preview the latest ACES 2.0 Output Transform candidate too. Here is link to entire program and free registration: https://www.smpte.org/sdr-and-hdr-theres-more-to-discuss?ecid=ACsprvtL5VTtr65H7hvSG_4HFEjmUriBOHwzIQYudBAO1Es2iHd0eu7r2Lu-xN1T331qQfKG6h24 Read More Colorist Mixer at IBC 2023 By Steve Tobenkin | September 8, 2023 | 0 Comments Posted in Events ACES is proud to be a sponsor of the IBC 2023 Colorist Mixer. A great event and opportunity to meet up with our European community. See you there! Pictures to come after the event. Read More ACES Education at Sundance Film Festival Asia 2023 By Steve Tobenkin | August 29, 2023 | 0 Comments Posted in Events, News Feed ACES Vice chair Joachim Zell, recently lead several presentations featuring ACES at the 2023 Sundance Film Festival Asia, in Taipei, Taiwan. ACES is a global standard and continues to grow in popularity internationally. Thanks to Iris Wu (team member of the Sundance Asia) and Sundance Asia team for their support. Read More Academy at Oslo Digital Cinema Conference 2023 By Steve Tobenkin | June 20, 2023 | 0 Comments Posted in Events, News Feed ACES Adoption Lead Steve Tobenkin, presented an update on ACES and other activities from the Academy’s Science and Technology Council at the 2023 Oslo Digital Cinema Conference in Oslo, Norway recently. In additional to ACES, Topics included the Spectral Similarity Index (SSI), the Academy Digital Preservation Forum (ADPF) and the Academy Software Foundation (ASWF). The… Read More 2023 Colorist Mixer By Steve Tobenkin | April 7, 2023 | 0 Comments Posted in Events April 16th 6pm – 10pm. Thanks to everyone at iColorist and Colorist Society for organizing. ACES is proud to be a sponsor. Read More 1 2 3 … 6 Next »"
