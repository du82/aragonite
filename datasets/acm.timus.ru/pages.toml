["https://acm.timus.ru"]
title = "Timus Online Judge"
full_description = "Timus Online Judge is the largest Russian archive of programming problems with automatic judging system. Problems are mostly collected from contests held at the Ural Federal University, Ural Championships, ICPC Ural Regional Contests, and Petrozavodsk Training Camps. To start solving problems, visit the guide. Timus Online Judge provides you an opportunity to participate in online versions of many contests held at the Ural Federal University on a regular basis. See the rules of online contests. If you want to publish your problems in the archive or hold your own online programming contest, contact us timus_support@acm.timus.ru."
year_published = 2025
clearnet = "https://acm.timus.ru"
tags = ["archive", "judge", "judge,problem", "online", "system", "timus", "welcome"]
language = "en"
