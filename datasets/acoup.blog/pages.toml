title = "New Acquisitions: That Dothraki Charge – A Collection of Unmitigated Pedantry"
description = "This post is now available in audio format. Quick Note: New Acquisitions is the category for more off-the-cuff or one-off posts. Whereas the Collections posts will come every Friday, New Acquisitions will show up irregularly. Warning: Spoilers for Game of Thrones, Season 8, Episode 3.  You have been warned. I’m sure I’ll do a complete…"
full_description = "New Acquisitions: That Dothraki Charge Bret Devereaux New Acquisitions May 4, 2019October 21, 2021 15 Minutes This post is now available in audio format. Quick Note: New Acquisitions is the category for more off-the-cuff or one-off posts. Whereas the Collections posts will come every Friday, New Acquisitions will show up irregularly. Warning: Spoilers for Game of Thrones, Season 8, Episode 3. You have been warned. I’m sure I’ll do a complete look at the Battle for Winterfell at some point (spoiler: it is a train wreck), but I wanted to single out this one element: that Dothraki charge at the beginning. Because a lot of commentators on the internet seemed to have grokked that it made little sense, but not why. And this is going to require its own post, because there are actually a lot of reasons why this charge is just baffling. This was the wrong charge, at the wrong time, by the wrong cavalry, in the wrong place, with the wrong tactics, in the wrong formation, and for the wrong reasons. That’s a lot of wrong for one scene. At the Wrong Time Let’s go in order: this was the wrong time in the battle for a cavalry charge, both in the sense of the wrong moment in the battle, but also simply the wrong time of day. Horses are fairly fragile animals. This is in part a product of selective breeding: modern domesticated horses have been bred to be larger, heavier and stronger, increasing the strain on those thin legs at high speed. Steppe ponies, much closer to pre-domesticated horses, are a lot lighter and smaller; a modern domesticated horse can weigh anywhere from 1,000 to 2,000lbs, whereas Steppe ponies are often as light as 600lbs. When you take a creature with legs designed to hold up 600lbs of weight, and instead breed it to be a 1,300lbs warhorse and then put 200lbs of rider, armor and tack on it – and pull the center of gravity of all of that up 20-25 inches or so there are consequences. What does this have to do with the time of day? Charging on a horse, full out, in the dark is an awful idea. I’m not going to link a bunch of videos of what happens when horses break legs in races and rodeos, but if you have a morbid interest, youtube will provide. That is on prepared, flat surfaces. The ground outside of Winterfell is rough grassland on rolling hills (more on the agricultural nonsense of that terrain at a later date; we ought to see grazing) in the summer. In Westeros’ long winter, that terrain is compounded with snow. One misplaced hoof-fall, one unnoticed hole in the ground, and you are in trouble. And the problem compounds from there. Because if one of the horses breaks a leg or slips, it is going to fall and spill the rider, creating two new obstacles that, in pitch blackness, no one can see. We’ll go into the nonsense formation of the Dothraki in a minute, but suffice to say that in the darkness, none of the riders can see well enough to dodge a fallen horse in front of them – even if the flaming sword has let them know the rider in front of them has fallen. An accurate recreation of what the Dothraki Cavalry, and the Audience, could see at the Battle for Winterfell. By the Wrong Cavalry This was also the wrong moment in the battle for this charge, for reasons that dovetail into the next topic: this was the wrong cavalry, in the wrong place. This is a point where some of the internet experts with degrees from the Total War academy haven’t quite gotten it right (this is not a slight against the Total War games, which I love the hell out of – but formal training in history they are not). A lot of voices pointed out it was a bone-headed move to simply charge straight up the center, but didn’t seem to know why. After all, cavalry charges up the center are not actually rare historically, and often succeed. At Dyrrhachium (1081), Robert Guiscard wins the battle with a cavalry feint up the center, followed by a devastating charge (also in the center). Likewise, the Battle of Hastings (1066) was essentially a series of cavalry charges, right up the middle. Of course, this plan doesn’t always work: Agincourt’s (1415) famous initial cavalry charge right down the center was a disaster (in the defense of the French, the terrain offered no other real attack route); a similar headlong cavalry attack at Bannockburn (1314) was similarly unsuccessful. But the idea of a cavalry charge somewhere other than the flanks is not, a priori insane. The issue here isn’t that it is always wrong to charge up the center, but that it would be foolish to charge the Dothraki up the center, and to understand that, we need to explain a bit about types of cavalry. First, cavalry are often classed as being either heavy or light. Heavy cavalry here typically means an armored rider, often on an armored horse. What level of armor makes for ‘heavy’ varies by period: in the ancient world, body armor was usually enough (although the Near East did feature cataphracts whose armor was more comprehensive), whereas by the 15th century, anything short of a full plate harness was light. By this metric, the Dothraki are clearly light cavalry: unarmored men on unarmored horses. And here we hit our first problem, because those devastating right-up-the-middle cavalry charges I listed off are generally performed by heavy cavalry, armed with lances, rather than light cavalry armed with swords. Now we should be clear: as I tell my students, horses are not battering rams. Even heavy cavalry cannot simply smash infantry out of their way, as in Total War games. Horses, you will remember, are fragile creatures. But even if you are not slamming into the enemy (we’ll cover the tactics of shock in a second), an up-the-middle charge is going to have your enemy’s full and undivided attention – some protection is a good idea. But the Dothraki are light cavalry. What ought they be doing? Well here, we need to distinguish between types of light cavalry as well. Whereas the big difference between light and heavy cavalry is about armor, the next big classification difference is about weapons: does this cavalry carry a ranged weapon? Nomadic cavalry was typically horse archer, firing bows from horseback, but light cavalry could also be close-combat only, armed exclusively with lances, swords and the like. Of course, your Mongol-style Steppe nomad cavalry also carried lances, swords and the like. You might be wondering then why anyone would use regular light cavalry and the answer is fairly simple: it is really, really hard to shoot a bow effectively from horseback. That skill pretty much has to be ingrained in your culture, which in turn means that many armies simply did not have access to effective missile cavalry. But light cavalry still serves crucial screening, scouting and raiding purposes, so one makes do with light pure-melee cavalry. I cannot imagine many generals, however, passed up the option to have Turkish or Mongol-style cavalry in their army, if the option was available. Where do the Dothraki fit? Well, based on dialogue (and the books), they are clearly intended as Mongol-style light cavalry, armed with bows and close-combat weapons and learning to use both from childhood. But in the show itself, they are almost always shown engaging with their arakh sickle-swords (a confusing placement of that weapon – for another time), rather than with bows. Not a bow is to be seen on the cavalry at the Battle of Winterfell, despite a serious dearth of archers among the defenders – one cannot help but point out that the Dothraki would have been far more useful dismounted and firing from the walls. One crucial problem here is the lack of lances (lance in this context doesn’t just mean the European type – any sort of spear used from horseback is a lance) – if for some baffling reason you are going to charge enemy infantry in good order over an open field, you really want a weapon which can reach past the head of your horse. Short swords are fine for running down routing enemies, but for any enemy that is going to try to hit you back, you want a lance. The physics make easy sense: if you have a shorter weapon, then the head of your horse will come into range of your target before he comes into your range. Mutual ruin is not your objective. So the Dothraki are expert missile cavalry, but in this scene they are inexplicably armed exclusively as shock light cavalry (shock here means ‘melee’ or ‘close combat’) – which is a simply worse form of light cavalry – and then deployed and advanced as if they were shock heavy cavalry, a task for which they are not armed or armored. These flaming swords sure are cool, but what about the bows you spent a lifetime practicing to use on horseback? With the Wrong Tactics That leads us into the next set of problems: the actual tactics. The tactics in this sequence are a matryoshka doll of bad decisions, so rather than diving right in with what is wrong, it is better to look at what doing it right looks like. So how does light cavalry attack infantry? The key concern here is actually maneuvering space. When attacking infantry, cavalry does not want to stop: a horse is a huge target and a cavalryman – even an armored one – at a stop is a terribly vulnerable target. Since (say it with me), horses are not battering rams, that means you need space in the enemy formation to ride in and around the enemy infantry, spearing and slashing as you go (you can trample a lone infantryman, but not a dozen in a pack). Light infantry in loose order will give that space to you naturally (which is part of why they are so vulnerable to cavalry), but smart infantry will close up ranks when they see you coming to deny you that space. Wights in Game of Thrones attack in huge, dense masses, so we can treat them like dense infantry, deployed in good order, for this purpose. You need some way to break them up. The way cavalry – any kind of cavalry – does this is the feint. First, the cavalry charges: if the enemy breaks and runs (horses are big and scary!), fantastic! You win! Go ride them down. If the enemy does not break, however, you do not (video-game-style) plow straight into their dense formation at full speed. Instead, the cavalry pretends to retreat, turning and running away. This, as a side note, is the ideal time to fire any ranged weapons you might have, dumping ranged fire into the dense infantry at very close range (there was even a type of pistol cavalry, called caracole, which specialized in this – ride up, dump pistol fire at point-blank range, while turning to ride away). But the key is that this is when you pretend to run away. This tactic is called feigned flight. The temptation for infantry is to pursue a fleeing enemy. This is a fundamental human mental weakness: if the enemy is on the run, we want to go get them. But if the infantry pursues, it will break that tight, solid formation that protects it, creating the space inside the formation the cavalry needs. Once that happens, the cavalry can wheel around and charge again, to devastating effect. This is what happened at the Battle of Hastings (1066); the Norman cavalry staged a series of feints, luring the Anglo-Saxon infantry down out of its formation and crushing it. Only the elite huscarls arrayed around the king were disciplined and well trained enough to hold formation. The absolute masters of this tactic were the Mongols: horse archers can intensify the psychological pressure by continuing to fire as they cycle-charge. It is very hard, psychologically, to stand idle in formation, under fire. Most infantry, the world over, would break sooner or later and either flee or pursue the ‘fleeing’ Mongols, and then be destroyed. So that is what the Dothraki charge should look like – charge and retreat, charge and retreat, until the wights are drawn out enough for there to be space to get inside the mass of them and move around. But every part of the way the charge is shown in the episode is terrible for this kind of maneuver. First, as mentioned, it is dark – the Dothraki cannot even see the enemy, much less know if they are broken up enough. Moreover, they break out into a full-speed charge without any hint of slowing down before contact; there is no effort to feint. While the Dothraki have reason to be arrogant and assume many types of infantry will simply break at their approach, they have in this show, encountered at least two groups already which do not: the Lannister army at the Loot Train (the Dothraki are essentially saved by Dragon) and the Unsullied. If the Dothraki are half as good as this show wants us to believe they are (Robert Baratheon, “only a fool would meet the Dothraki in an open field”), they ought to be smart enough to plan for at least one feint. Moreover, their formation is all wrong. Let’s move on to that. In The Wrong Formation Based on what we’ve already covered, you can actually suss out on your own what good cavalry formations look like, but let’s go over it just in case. Within the formation, the riders need space to maneuver – other horses and riders are going to fall down and create obstructions. That means that you either can deploy your cavalry shoulder-to-shoulder, but only one line deep (or perhaps multiple lines with big gaps between them), or you can deploy deep, but loose to allow a lot of space for riders to dodge obstructions. What you cannot do is deploy your formation deep and tight – which is exactly how the Dothraki form up. Close-set horses, many ranks deep – and with no clear order as an extra bonus. The next thing you know is that you need to be able to feign flight quickly and that means the formation needs to be able to turn around rapidly. Here, you have a few options: one is to deploy in a very loose formation, so that each rider has enough space around him to safely wheel around on his own – you turn every horse in the formation, rather than turning the whole formation. This seems to have been a common solution for missile cavalry. For shock cavalry, which tends to want to be in tighter (but still loose) formation, you might employ a wedge or diamond. The advantage of that is that the front rider can turn the formation far more rapidly and smoothly than he could moving a block – Alexander the Great’s companion cavalry always formed like this, with Alexander at the tip of the wedge. And no, this does not count as a diamond of wedge formation. The commander, Jorah, isn’t even at the tip where he could command. This is a mounted mob, not a formation; Steppe nomads could do far better than this. How are the Dothraki formed up? In a tight, deep rectangle. If these were supposed to be heavy cavalry, or just poor horsemen, I might find this believable, but these are supposed to be experts. The problem with a rectangle is in turning it around – you do not want anyone to stop, remember, so you have to wheel the entire formation around one of the corners and everyone has to slow down waiting for the riders at the far corner to make the huge circle to come around "
