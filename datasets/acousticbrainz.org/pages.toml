["https://acousticbrainz.org/api"]
title = "API - AcousticBrainz"
full_description = "AcousticBrainz includes models to compute semantically meaningful music features. You can read more about the Accuracies and confusion matrices for default models Additionally, we provide the functionality to design your own datasets and use them to build new models that can be integrated into the data that AcousticBrainz computes. The low-level data includes acoustic descriptors characterizing overall loudness, dynamics and spectral shape of a signal, rhythm descriptors (including beats per minute), and tonal information (including keys and scales). The low-level data is stable, compared to the higher-level data. This hopefully means that we will not have to recompute this data from audio files too frequently. More detailed information about the low-level data is provided in the official documentation for Essentia toolkit. The high-level data includes information about moods, genres, vocals and music type automatically inferred from low-level data by pre-trained classifiers. The high-level data can be computed from the low-level data, without requiring access to original audio files. The high-level data is less stable than the low-level data, since it contains more experimental algorithms. We anticipate re-calculating the high-level data until it becomes fully stable."
year_published = 2025
