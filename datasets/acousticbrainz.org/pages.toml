full_description = "If you are interested in computing acoustic features on your own music, you can still download the command-line essentia extractor and run it yourself: 2022-07-06: We provide downloadable archives of all submissions made to AcousticBrainz (29,460,584 submissions) Dumps are split into 30 archives, each with 1 million data files. Archives are compressed with zstandard compression. Filenames inside the archives are structured such that they will all uncompress into the same location. Smaller CSV files containing some basic features that may be useful for some tasks. Split into three different files based on feature type. Each file contains 29,460,584 rows of data. 2022-07-06: We will provide a downloadable archive of the data files used in the recording similarity API. 2022-07-06: We will provide new json and feature dumps of the database after de-duplicating to only one instance of each recording MBID (approximately 7 million items)"
