["https://acousticbrainz.org"]
title = "AcousticBrainz"
full_description = "Between 2015 and 2022, AcousticBrainz helped to crowd source acoustic information from music recordings. This acoustic information describes the acoustic characteristics of music and includes low-level spectral information and information for genres, moods, keys, scales and much more. AcousticBrainz was a joint effort between Music Technology Group at Universitat Pompeu Fabra in Barcelona and the MusicBrainz project. At the heart of this project lies the Essentia toolkit from the MTG – this open source toolkit enables the automatic analysis of music. The output from Essentia is collected by the AcousticBrainz project and made available to the public. In 2022, the decision was made to stop collecting data. For now, the website and its API will continue to be available. AcousticBrainz organizes the data on a recording basis, indexed by the MusicBrainz ID for recordings. If you know the MBID for a recording, you can easily fetch from AcousticBrainz. For details on how to do this, visit our API documentation. If you're wondering what this collected data actually looks like, have a look at the last 5 recordings that have been submitted:"
year_published = 2025
