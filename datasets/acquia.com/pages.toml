["https://acquia.com/about-us/team/muktesh-kandpal"]
title = "Muktesh Kandpal | Acquia"
description = "Muktesh Kandpal leads Acquia’s India office and heads the global engineering team for Marketing Cloud. He brings almost two decades of software industry experience, with an extensive marketing technology background. Muktesh in his career has built multiple martech solutions for leading Fortune 500 companies leveraging CMSs, campaign management systems, CRMs, DAMs, analytics systems, and CDPs/DMPs.  He has been with Acquia for more than seven years. During this tenure, Muktesh has had multiple successful roles within Acquia. He joined to lead the Solution Architecture team in India/ASEAN, and then headed the Channels and the Implementation Services teams in India. He also built the India Centre of Excellence (CoE) from a small team to the multi-disciplinary global delivery and capability center that it is today. He is a culture builder and, during his leadership, the India CoE has won multiple industry awards and recognitions.     Before joining Acquia, Muktesh built and led the Digital Marketing Technology practice at Mindtree, a leading system integration company in India, wherein, he led digital transformation initiatives for some of the leading global CPG/FMCG companies. Muktesh has built three successful CoEs in India and worked in three different countries in his career so far."
