["https://acquia.com/accessibility-statement"]
title = "Accessibility Statement | Acquia"
description = "Acquia is committed to ensuring digital accessibility for people with disabilities. Here’s how we take action."
full_description = "Accessibility StatementAcquia is committed to ensuring digital accessibility for people with disabilities, and we will continue to make changes to improve organization-wide digital experiences for everyone. Our Aim As a company, we aim to apply the internationally recognized digital accessibility standards, the Web Content Accessibility Guidelines (WCAG), to our website, marketing and communications, and other publicly distributed digital assets. The WCAG defines requirements for designers and developers to improve accessibility for people with disabilities. It defines three levels of conformance: Level A, Level AA, and Level AAA.Acquia aims to adhere to WCAG 2.2 Level AA guidelines, which states that sites should be: PerceivableInformation and user interface components must be presentable to users in ways they can perceive. OperableUser interface components and navigation must be operable. UnderstandableInformation and the operation of user interface must be understandable. RobustContent must be robust enough that it can be interpreted reliably by a wide variety of user agents, including assistive technologies. To ensure web accessibility, we use our own tool — Acquia Optimize — to proactively work towards a more inclusive website experience. We welcome your feedback on the accessibility of the Acquia website or any other materials that we have distributed. If you have experienced any accessibility barriers while using any part of Acquia.com or other related websites, please let us know:Get in touch with us at: https://www.acquia.com/contactFor more about the accessibility of Acquia’s products and our work to boost accessibility awareness in the Acquia community, please visit our Product Accessibility page."
year_published = 2025
