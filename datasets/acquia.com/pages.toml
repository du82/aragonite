full_description = "Image Brooks Acquia DAM (Widen), including the Assets and Insights applications Visit Brooks Website Industry Retail Products Acquia DAM 423 K downloads in the last 12 months 61 K logins in the last 12 months The Client Brooks leads global markets in selling specialty running products across more than 60 countries, and believes a run can flat out change a day, a life, or even the world. Image The Situation Each year, the Brooks creative team produces over 30,000 new digital assets that are distributed across global marketing teams and retail partners. Although Brooks had a digital asset management (DAM) solution, Acquia DAM, to store and manage this content, it was underutilized — and their brand consistency was suffering. The Challenge Because very few people across Brooks used their Acquia DAM system, image requests were funneled through one creative director — resulting in delays across numerous workflows. Teams resorted to using old content stored on their own computers, making it impossible to present a uniform brand experience. The Solution When Trey Bailey stepped into his role as Brook’s full-time DAM administrator, he knew they could solve their brand management challenges by optimizing their system and increasing user engagement. So he rolled up his sleeves and got to work. Effective metadata Everyone from internal creative teams to external agencies and retailers can now easily access the Brooks Running library of digital assets in Acquia DAM. But that didn’t happen without a lot of thoughtful planning. Trey shared how he developed a unique metadata schema that includes fields like campaign, season, designer, sales region, and SKU to organize their content. He also created a controlled vocabulary structure to ensure everyone used the same keywords to describe assets. “You can use the analogy that if you tell a group of people to draw a house, everyone is going to have something that looks different. That’s what we were finding with the metadata that anyone was allowed to put in.” Giving users metadata terms to choose from creates consistency across all assets in the system. Trey also created role-specific upload profiles that pre-populate metadata values for several fields. These strategies build accurate and thorough metadata throughout the system, and power a friction-free search experience for his users. Integrated systems Trey shared that before he became the full-time DAM admin, they often struggled to get the right product shots and videos to retailers in time for a campaign or new season. To simplify this process, Brooks built a B2B asset site and integrated it with Acquia DAM using the API. “So we have a brand-to-brand site that pulls from the API and it directly uploads. Now, instead of just sending a six-digit SKU, we’re able to include an image that helps with identifying colors.” Having access to these images helps retailers make fewer mistakes when placing orders. They also plan to use the API to connect Acquia DAM with web content management (WCM) tools, to allow digital assets to automatically flow from one system to the other. This integration will create valuable workflow efficiencies and ensure only current content is being used across their website. Content analytics and insights Did we produce the right amount? Are they being used? When you’re creating over 30,000 assets a year, these questions need to be answered. With the Insights app in Acquia DAM, Trey is able to see which assets are being viewed and downloaded by retailers and various teams. Insights data is especially valuable in understanding their asset performance across social media. “All our social assets come from the DAM [system]. A lot of them are created from an external agency … and then the social teams pull those assets and utilize them in the social media platforms,” Trey explained. He creates reports that help show how their assets performed on specific social platforms. If they discover that their social media agency produced too many Facebook assets and not enough for Instagram, or vice versa, they can adjust their workload budgets accordingly. The Results Brand control “One of the most important aspects of any brand is their logo,” said Trey. But, he continued, “logos aren’t static for the entire life of the company.” With Acquia DAM, Brooks is able to ensure that teams only have access to the most current version of any brand asset — including logos. “We’re able to curate what our global markets have access to, and that helps keep unity inside of campaigns,” Trey shared. And with embed codes, when a file in the DAM system is updated, this new version is instantly published everywhere that file is online. This helps ensure brand consistency across digital channels around the world. “If you have something where the asset is going to be utilized not only in North America, but in Europe, you want to make sure that it’s the same asset and tells the same story,” Trey shared. Empowered users Thanks to a robust training program that Trey calls the DAM tour, the Acquia DAM system is now used by teams across the company. And secure, self-serve access to content has allowed Brooks to eliminate bottlenecks across numerous workflows. Image requests no longer need to be processed by one team! And because everything is organized with effective metadata, users find what they need quickly and easily. “So now, with a more organized collection we’re able to actually go through and systematically … find all of the logos that are available for your region,” he shared. The Brooks merch and sales teams can do the same for their product shots and product videos. And Trey has further streamlined his user experience by limiting the content available to each user role. “We have some products that are only available in certain regions of the globe, versus some products that are available globally,” explains Trey. “So, instead of someone outside the country accessing every product shot and every colorway, they only see what they are able to actually sell in-country.” A strategic partner With Acquia, Brooks has found a true partner in developing a strategy to continually grow the use and value of DAM across their organization. “The customer service that Acquia provides is unparalleled,” said Trey. “I can email anytime, I can ask questions when I need to, and I can go online during the day and talk with support.” He continued, “It’s really, really important because the software is a bit of a blank slate and needs customization. So being able to utilize the customer service from Acquia has really helped keep the product around, as well as grow it.” As their organization changes and evolves over time, Brooks and Acquia will continually advance their use of Acquia DAM to meet their brand management goals, together. Additional Resources View More Resources Image Blog Article 9 min Why Brand Management Is Important Brand management is the ongoing process of ensuring a consistent, value-driven, and positive experience whenever someone engages with your company. Brand Management Case Study 6 min PRADCO Outdoor Brands PRADCO Outdoor Brands leverages Acquia DAM and Acquia PIM to manage and distribute product content across e-commerce channels. Toolkit 2 min The DAM Evaluation Toolkit Finding the perfect digital asset management (DAM) solution is easy with the right tools. Start your DAM journey here with the DAM Evaluation Toolkit. Digital Asset Management"
