["https://acquia.com/newsroom/press-releases/acquia-simplifies-delivery-digital-experiences-scale-launch-multi"]
title = "Acquia Launches Multi-Experience Operations | Acquia"
description = "Acquia has launched Multi-Experience Operations, combining the advantages of Drupal's multi-site architecture and Acquia Cloud Next."
full_description = "Press Release Acquia Simplifies the Delivery of Digital Experiences at Scale with Launch of Multi-Experience Operations Multisite governance built on Acquia Cloud Next simplifies web development with improved application performance, security, and resiliency at any scale BOSTON, July 30, 2024 – Acquia, the leader in open digital experience software, today announced Multi-Experience Operations, an enhancement to Acquia Cloud Platform that combines the time, cost, and maintenance advantages of the Drupal CMS platform’s multi-site architecture with the performance, scalability, and resiliency features of Acquia Cloud Next.For many organizations, a modern digital portfolio includes multiple websites – whether in support of multiple brands, business units, or geographies – as well as mobile, wearable, and other applications. To significantly reduce the time, complexity, and cost associated with keeping up with these applications at the same time, Drupal allows multiple separate websites to share the same codebase (the Drupal core, modules, and themes), but each with its own database to maintain distinct content, configuration, and settings. With Multi-Experience Operations, these advantages are now accessible on the Acquia Cloud Next infrastructure, which is powered by Kubernetes and enhanced with Acquia’s unique optimizations for Drupal to provide:Dynamic auto-scaling that automatically scales cloud capacity in seconds to accommodate periods of high load;Secure container-based software isolation to ensure applications always have the resources they need to operate efficiently;Maximal application performance that delivers up to 5x the throughput of databases running on more traditional MySQL server deployments; andSelf-healing infrastructure that automatically ensures cloud capacity is always healthy and performant. “A multi-site strategy can help an organization drive competitive advantage by increasing their presence in geographically dispersed markets or reach a multitude of different target audiences,” said Tom Bianchi, senior vice president of Product and Solutions Marketing at Acquia. “Governance capabilities such as Multi-Experience Operations are essential to managing such a strategy with increased productivity and faster time-to-market, while keeping development and maintenance costs low.”Multi-Experience Operations complements other Acquia solutions that can take your multi-site management to the next level, including Acquia Site Factory, a centralized management console to apply quickly build, provision, and operate a portfolio of websites using standard processes; and Acquia Site Studio, a low-code site builder that allows non-technical users to quickly and easily build, iterate, and update websites using pre-built, reusable components. About AcquiaAcquia empowers ambitious digital innovators to craft the most productive, frictionless digital experiences that make a difference to their customers, employees, and communities. We provide the world's leading open digital experience platform (DXP), built on open source Drupal, as part of our commitment to shaping a digital future that is safe, accessible, and available to all. With Acquia Open DXP, you can unlock the potential of your customer data and content, accelerating time to market and increasing engagement, conversion, and revenue. Learn more at https://acquia.com.# # # All logos, company, and product names are trademarks or registered trademarks of their respective owners."
