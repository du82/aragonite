title = "Amy Parker | Acquia"
description = "Amy Parker leads Acquia's Global Talent Development and Employee Engagement strategy. She joined the Acquia team in 2014 as the Director of Acquia University, a technical talent incubator program for Acquia and the Drupal community and went on to build Acquia's first global Learning and Development function. The global team now offers programs that span the entire employee life cycle - from new hires, early-in-career employees, management/leadership development, all the way through collaborating with senior leaders on customized employee learning and engagement programs.   With over 20 year's experience, Amy has worked in high-tech, advertising, and digital marketing environments. She built and launched departments for talent development/talent management at EMC, Endeca, Digitas, and Intralinks. She is currently a Core Member of Underscore VC, an early Acquia Investor, and advises early-stage startups on their people practices.   An avid scuba diver, she is passionate about photography above and below the waterline, taught black and white photography for +10 years at the New England School of Photography, and in her spare time, donates time to local nonprofits. She was a US Peace Corps Fisheries Volunteer in Zaire, and is fluent in Spanish and conversant in Portuguese, Swahili and French."
