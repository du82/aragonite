["https://acquia.com/blog/acquia-dam-dashboards"]
title = "Enhance the Value of Your Acquia DAM Dashboard | Acquia"
description = "See how other companies are designing and using their Acquia DAM (Widen) dashboard to welcome users to their digital asset management (DAM) site."
full_description = '''Digital Asset Management Enhance the Value of Your Acquia DAM Dashboard January 3, 2025 4 minute read Share this blog post on LinkedIn Share this blog post on Twitter Share this blog post via Email See how other companies are designing and using their Acquia DAM (Widen) dashboard to welcome users to their digital asset management (DAM) site. Acquia DAM customers average over 1,200 active users! So it’s important for your dashboard to welcome and direct your digital asset management (DAM) users to the content they need.Dashboards are comprised of three main features, in any combination: dashboard messages, spotlight searches, and saved searches. Admins are able to control the placement of these tools and customize the overall design to help users find what they need with minimal effort. Plus, admins can personalize which elements of the dashboard are shown to which users based on their user groups.In this article we’ve rounded up some noteworthy examples of Acquia DAM dashboards to showcase best practices, creative thinking, and what’s possible for your own dashboard design. Image Works Image Image Works, a small marketing firm with a team of 12 designers, previously relied on a server to organize images by topics or alphabetically. This method was slow and made it difficult to locate files, even with their existing system for client assets. After implementing Acquia DAM three years ago, the firm has seen a significant improvement in efficiency. The DAM dashboard has become the central hub for organizing and accessing assets, making it much easier and faster for the team to find the images and files they need. Image Takeaways:Infuse your brand style into the design of your dashboardFeature assets to resonate with your target audience, whether it’s verticals for B2B or consumer personas for B2CNVIDIA Image NVIDIA’s DAM dashboard directs users to featured assets and portals. The featured assets section uses dynamic search links to quickly take users to multi-faceted search results. The portals section highlights their top portals, including Corporate & Branding resources, their partner network portal with sales enablement assets, information about the DAM, and event assets. Image Takeaways:You can conduct a multifaceted search, copy the URL of the results, and make it a call to action on your dashboard to share the latest assetsMake key corporate and branding resources easily visible and accessible on your dashboard to support brand consistencyLitehouse Image Litehouse is a leader in refrigerated salad dressings, dips, sauces, herbs, and cheese. Acquia DAM is their centralized hub for all personnel to access essential resources. This digital library enables departments to share and edit content efficiently, fostering seamless collaboration and reducing duplication. It ensures that external partners like brokers have consistent and accurate information, enhancing productivity and streamlining workflows. Image Takeaways:Feature your brands with a link to their creative assets and “all things product”Dashboards can be personalized to user roles, e.g., put sales support resources above the fold for sales teamRoyal Carribean Image The Brand Marketing team at Royal Caribbean uses portals to highlight recent photos and videos, integrating them with email newsletters and targeted searches. Newsletters showcase new assets and link to attractive portals focused on current campaigns. These portals, accessible via the DAM dashboard, facilitate easy navigation and smart searches, enhancing marketing efforts and keeping staff updated with the latest content. Image Takeaways:Welcome your users with a message about key information or the purpose of your DAMFeature an iconic image for your brand to get new users excited about your brand and the assets within your DAMClearChannel Outdoor Image Clearchannel Outdoor's MediaHub dashboard provides quick access to frequently requested images and launches the "Creative Snapshot" template for sales teams. It conveniently links to specific searches, portals, and tools, offering an intuitive, one-stop resource for users to easily find what they need. Image Takeaways:Show a preview of the content from a saved search, portal, or link to illustrate what a user can expect from call to actionTailor resources to your internal personas like Marketing, Creative, and SalesGetting startedAll of these dashboard examples combine tools and beautiful visual design to create a user experience that’s both effective and enjoyable. And ultimately, strong dashboard design bolsters user engagement, to maximize the value of your DAM investment. If you’d like to update your dashboard design but don’t know where to start, this article outlines steps to get it done. Or if you simply don’t have the resources to reach your dashboard goals, consider getting some help from Acquia’s DAM design services. These talented designers can help you create a dashboard that reflects your brand and meets your user needs.Happy dashboard creating! Image Nate Holmes Manager, Product Marketing Marketing Acquia Share this blog post on LinkedIn Share this blog post on Twitter Share this blog post via Email'''
