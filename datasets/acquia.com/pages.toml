["https://acquia.com/legal/ai-user-guidelines"]
title = "AI User Guidelines and Policy | Acquia"
description = "Explore Acquia’s AI User Guidelines and Policy for safe, respectful, and responsible interaction with AI systems."
full_description = "AI User Guidelines and PolicyThis document outlines the policies and guidelines (“Policy”) for users interacting with Acquia’s (generative) AI systems (“AI Features”). It is designed to ensure a safe, respectful, and productive environment for all users. In addition, your use of AI Features is governed byAcquia’s Subscription and Services Agreement located at https://www.acquia.com/sites/default/files/legal/acquia-subscription-services-agreement.pdf (or, where applicable, the respective agreement between you or your organization and Acquia) andThe product-specific terms and information (“Product-Specific Terms and Information”) within each relevant Product and Services Guide located at https://docs.acquia.com/guide.By using our AI Features, you agree to adhere to this Policy. If you have any questions or concerns, please contact our account management or support team.1. User ResponsibilitiesRespectful Interaction: Users are expected to interact with the AI Features in a respectful manner. Abusive, offensive, or inappropriate use is not tolerated. The following uses are strictly prohibited:Engaging in or promoting pornographic or sexually explicit content, including child pornography.Directing hateful, discriminatory, or harmful content at individuals or groups based on race, ethnicity, religion, gender, age, or sexual orientation.Promoting or glorifying violence, including terrorism and extremism.Creating or spreading false information that is misleading, fraudulent, or deceptive.Participating in illegal activities.Sharing private information of others.Impersonation of individuals or entities.Creating, uploading or sharing of third-party intellectual property (copyright, trademarks, patent, personal or publicity, privacy, or any other similar rights)Any other actions that could result in real-world harm.Data Privacy: Users should be aware that interactions may be logged for quality assurance and improvement purposes. Personal data should not be shared with the AI.Compliance with Laws: Users must comply with all applicable laws and regulations when using the AI Features. Third-Party Rights: Be respectful of others’ rights and do not use the AI Features for purposes of plagiarizing a third party’s content.2. Transparency, Accountability, Limitations of AI, and Good JudgmentTransparency: Users are expected to be transparent about the use of (the output of) the AI Features, especially when using them in a public manner.Accountability: Users are ultimately responsible for their use of (the output of) the AI Features and should hold themselves accountable for any harm arising from such use.Good Judgment, No Professional Advice and the Limitations of AI:(Generative) AI is rapidly advancing, but nevertheless is limited in its capabilities due to its design, infrastructure and technology. Users should understand these limitations before using AI and use good judgment when using AI.The AI Features are not intended for any kind of professional advice and are not meant to replace advice by a qualified professional. The AI Features are neither intended to nor should they be used to seek or provide medical, financial, legal, or any other professional advice.Unlike information provided to a physician, lawyer, or similar is typically protected by such professional’s obligation to confidentiality and other laws (e.g. attorney-client relationship), Information entered into the AI Features is not protected by any such obligation or laws.3. Data Collection and UseData Logging: User interactions with the AI may be logged to enhance the system's performance and accuracy.Data Masking and Obfuscation: Efforts are made to anonymize data to protect user privacy.Data Retention: Data is retained for a limited period and used solely for improving AI capabilities.The AI Features’ data collection and use are described in more detail in the relevant sections of the Product-Specific Terms and Information (located within each relevant Product and Services Guide and available at https://docs.acquia.com/guide).4. Limitations of AIAccuracy: While Acquia strives for accuracy of its AI Features, these may occasionally provide incorrect or outdated information. Users should verify critical information from reliable sources.Scope of Knowledge: The AI Features models’ knowledge is based on certain data and may not reflect more recent developments. For more information consult theProduct-Specific Terms and Information.5. Changes to PolicyAcquia reserves the right to change the Products and Services Guide and other product documentation based on prevailing market practices and the evolution of our products."
