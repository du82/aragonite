description = "Discover the latest innovations in digital content, optimization, and insights, and gain expert perspectives on Acquia's vision for the future."
full_description = "Acquia's Product RoadmapBuilding a Better Digital FutureDiscover the latest innovations in digital content, optimization, and insights, and gain expert perspectives on Acquia's vision for the future. Video Thumbnail Featured Announcements Digital Experience OptimizationAcquia’s latest offering brings optimization to the forefront, targeting better website engagement and maximizing conversion potential. It enables teams to increase ROI on digital marketing spend via better understanding of content performance and ensuring universal content accessibility. Image Acquia Convert A platform with Insights, Testing, and Personalization to enhance conversions by identifying friction points and personalizing user experiences. Personalization Image Acquia SEO Optimize your content for search engines and user engagement with AI-driven insights, streamlined workflows, and actionable data. Customer Analytics Image Acquia Optimize This platform delivers weekly site scans to help optimize websites for a more accessible, inclusive, and compliant website experience. Accessibility & Inclusion Acquia's Product Roadmap: Building a Better Digital Future Discover the latest innovations in digital content, optimization, and insights, and gain expert perspectives on Acquia's vision for the future. Watch Now Now Available Shaping digital experience innovation Image Drupal 11The latest Drupal upgrade offers a new vertical sidebar navigation, experimental recipe APIs, stable workspaces for enhanced collaboration, a new access policy API, and revisions and moderation support for taxonomy terms. Image Acquia Content Hub EnhancementsGain more control over content syndication with Manual Export Mode, Optional Config Syndication, and Manual Unsubscribe. Image Site Studio EnhancementsCreate and manage engaging digital experiences with advanced field capabilities for connecting external data sources, enhanced frontend performance, and full Gin theme support. Image Code Studio With Node.js SupportStreamline Drupal application development with faster development, easier collaboration, fewer errors, and less overhead. Image Acquia Cloud Next: Code Assembly and Cloud ActionsEnhance the developer and DevOps experience with lightweight dependency management and deployment automation. Image CDP EnhancementsEmpower self-service with the ability to create new attributes and custom calculations. Image DAM EnhancementsLeverage webhooks for real-time communication, metadata translation, integrations with Figma and Sketch, and HIPAA compliance. Access new reports in Insights for downloads, logins, searches, and uploads. Image Acquia Multi-Experience OperationsSimplify the scalability of infrastructure for your digital experience with the ability to run multiple applications on a single codebase. (Early Access) Coming Soon The next wave of digital progress Image Drupal StarshotExperience a more user-friendly and accessible Drupal, built on Drupal Core with an enhanced out-of-the-box experience, simplified site building, and a focus on attracting new users. Image Acquia Drupal Starter Kits Alignment With Drupal RecipesBenefit from a powerful and up-to-date development toolkit by leveraging recipe functionality within Starter Kits. (Expected completion in 2H 2024) Image Content Hub: Dependency ManagementOpt-out specific fields and entity references from dependency calculation for more advanced site building. Image Content Hub: Improved Filters UIExperience usability improvements in setting up new Filters using Publisher's Dashboard. Image DAM: Smart Focal Point CroppingTransform and distribute assets faster with AI-powered focal point cropping. Image CDP: Real-Time PersonalizationPersonalize your website in real time using segmentation from Acquia and data-driven segments within the CDP. Image DAM: AI-Assisted SearchEmpower users to find assets more effectively with AI-powered search capabilities. Image CDP: Real-Time Access to Event DataInstantly leverage event data for campaigns, metrics, 360° profile, and data sharing. Image Campaign Studio: Enhanced A/B TestingTest any point in the campaign journey and gain better insights with improved reporting. Image Acquia Syndicate: Multi-Language & Multi-Currency SupportGenerate translations, store multiple language versions, and maintain a global set of translations for products. Image Acquia Syndicate: Amazon A+ Content ManagementEnhance your product detail pages on Amazon with rich content. Image Campaign Studio EnhancementsImprove usability with AI-driven content creation and messaging control with blackout dates. On the Horizon Pioneering the digital future Image Content Hub: Automatic UnsubscribeModify content on the subscriber and unsubscribe automatically, or syndicate content once without further updates. Image CDP: Data Platform EnhancementsBenefit from faster refresh times, improved system reliability, and new AI functionality built on Snowflake infrastructure. Image Campaign Studio: Open Source FlexibilityAddress bugs and add new features quickly, and easily integrate community-created modules. Request a Product DemoSchedule a personalized demo guided by an Acquia product expert.Get a Custom Demo"
