["https://acquia.com/about-us/team/jake-athey"]
title = "Jake Athey | Acquia"
description = "Jake Athey leads Acquia’s go-to-market motion for its digital asset management (DAM) and product information management (PIM) solutions. An expert on DAM and PIM, Jake is responsible for evangelizing the solutions and their ability to fuel productive digital customer experiences. He brings together first-hand understanding of evolving customer requirements with expertise in martech and commerce platforms, making him a trusted advisor on DAM, PIM, and DXP topics for organizations across industries. Jake joined Acquia via its 2021 acquisition of Widen, where he led all marketing, sales, and customer experience efforts pivotal to Widen’s growth and transformation story and rise to become a leader in digital asset management trusted by hundreds of the world’s most ambitious brands. Jake is based in Madison, WI, and holds a business administration degree from the University of Wisconsin-Platteville and an MBA from the University of Wisconsin-Madison. He is a frequent speaker at industry events, a resource for media and industry analysts, and a contributor to the Acquia blog and CMSWire."
full_description = "Image Contact Jake: Vice President, Sales and Go-To-Market, DAM and PIM Acquia Jake Athey Jake Athey leads Acquia’s go-to-market motion for its digital asset management (DAM) and product information management (PIM) solutions. An expert on DAM and PIM, Jake is responsible for evangelizing the solutions and their ability to fuel productive digital customer experiences. He brings together first-hand understanding of evolving customer requirements with expertise in martech and commerce platforms, making him a trusted advisor on DAM, PIM, and DXP topics for organizations across industries. Jake joined Acquia via its 2021 acquisition of Widen, where he led all marketing, sales, and customer experience efforts pivotal to Widen’s growth and transformation story and rise to become a leader in digital asset management trusted by hundreds of the world’s most ambitious brands. Jake is based in Madison, WI, and holds a business administration degree from the University of Wisconsin-Platteville and an MBA from the University of Wisconsin-Madison. He is a frequent speaker at industry events, a resource for media and industry analysts, and a contributor to the Acquia blog and CMSWire. Posts written by Jake Image DAM ROI: The Business Case for DAM Image What Is Digital Asset Management (DAM)? Asset reference Independent Research Firm Evaluation of Digital Asset Management (DAM) Vendors Image 7 Ways to Learn the Tech in Martech Image Adopt a Competency Framework to Build Your Martech Team Image Solve for 10 Modern Business Initiatives With DAM Pagination Current page 1 Page 2 Page 3 Page 4 Page 5 Next page ›"
