title = "DMCA Policy | Acquia"
description = "Get to know the full extent of Acquia Digital Experience Platform (DXP)."
full_description = "DMCA Policy Effective: March 7, 2022 We respect the intellectual property rights of others and expect You to do the same. We will respond to notices of copyright infringement consistent with the Digital Millennium Copyright Act (the “DMCA”) and our response to such notices may include removing or disabling access to any allegedly infringing content, suspending Your access to the applicable Acquia services, and terminating access to the Acquia service if we do not receive a satisfactory response from You following receipt of an infringement notice. If You believe that content residing or accessible on the Acquia service infringes a copyright, You (the “Notifying Party”) are asked to send a notice of copyright infringement containing the following information to the Designated Copyright Agent at the address below: (a) description of the copyrighted work or material that the Notifying Party claims has been infringed; (b) the URL where the material that the Notifying Party claims is infringing is located on Acquia’s services, or a description of that location sufficiently detailed for us to find it; (c) contact information about the Notifying Party, including address, telephone number, and e-mail address; (d) a written statement that the Notifying Party has a good faith belief that the disputed use is not authorized by the copyright owner, its agent, or law; (e) a statement by the Notifying Party, made under penalty of perjury, that the information provided in the notice is accurate and that the Notifying Party is either the copyright owner or is authorized to make the complaint on behalf of the copyright owner; and (f) an electronic or physical signature of the Notifying Party. Acquia’s Designated Copyright Agent to receive notifications of claimed infringement can be reached as follows: By mail: Acquia Inc. Attention: Designated Copyright Agent Legal Department 53 State Street, 10th Floor Boston, MA 02109 DMCA Request Form: https://www.acquia.com/legal/dmca-request Please note that if You fail to comply with all of the requirements of this section, Your DMCA notice may not be valid and any removal requests may not be acted upon. Please also note that under Section 512(f) of the DMCA, any person who knowingly materially misrepresents that material or activity is infringing may be subject to liability. This process does not limit our ability to pursue any other remedies we may have to address suspected infringement. PLEASE READ PRIOR TO NOTIFYING US: We frequently receive requests to take down certain websites that we allegedly host. Please note that we use certain hosting providers and these hosting providers re-assign or re-use IP addresses from time to time. For this reason, publicly available search tools for hosting providers often show the wrong hosting provider. You can perform a quick check yourself: If you consider a website to be infringing, please check what type of CMS it is using (you can find free tools to check this in your browser’s extension marketplace). If it is not Drupal, it is not hosted by Acquia."
