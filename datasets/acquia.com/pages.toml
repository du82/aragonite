["https://acquia.com/careers/culture"]
title = "Our Culture | Acquia"
description = "Get to know the full extent of Acquia Digital Experience Platform (DXP)."
full_description = "Careers Career Exploration Benefits People and Culture Grow Your Career Join Our Talent Network Breadcrumb Home Careers Our Culture People and CultureWe believe that a stellar people experience fuels an incredible customer experience. Everyday, we expand boundaries to achieve the extraordinary, both for ourselves and for our customers. Our Culture Is EverythingTransforming the digital world takes a team from around the world. Our global, people-first culture is our greatest strength; we stay inspired by the amazing work our team does on a daily basis. Acquians are diverse group of lifelong learners who are innovative, ambitious, collaborative, transparent, curious, and passionate. Experience PillarsThere is an intrinsic connection between the employee experience and the customer experience. A positive employee experience drives engagement, inclusion, continuous learning, retention, and productivity. When employees are engaged and productive, it contributes to customer success and satisfaction. This is supported by five key pillars that are core drivers of a positive employee experience at Acquia. Meaningful Work Make a difference and have an impact. Contribute in ways that leverage your strengths. Supportive Management Agile performance management that provides continuous coaching, bi-directional feedback, frequent check-ins, and keeps people aligned. Positive Work Environment A culture that has our wellbeing in mind: flexibility, work-life integration, and the opportunity to make meaningful connections with our colleagues. Continuous Learning Clear pathways to growth and advancement. Acquians teaching Acquians. Confidence in Leadership Demonstrate a customer and employee-first approach to lead with transparency and honesty. Acquia's ESG CommitmentAcquia believes that technology is a key to a better future for all, building stronger economies, a healthier environment, and more diverse, inclusive communities. We recognize the opportunity and responsibility we have to make a positive impact on the world through each and every one of our business decisions.More on Our ESG Commitment Inclusion and Diversity We are proud of the diverse perspectives that our team brings to Acquia. Our inclusive, supportive, and welcoming environment celebrates that each Acquian has a unique background, experience, and point of view — making us stronger and helping us win as one. Inclusion at Acquia MeansDiverse ideas and perspectives are welcomed and encouragedFeeling valued both as a team member and as an individualBeing able to bring your authentic self to work every day Employee Resource Groups (ERGs)Women of Acquia (WOA)Acquia Alliance of Black Leaders for Excellence (AABLE)Pride Image Image One of my favorite parts of co-leading the AABLE ERG is the opportunity to bring people together and celebrate a diverse and inclusive workplaceJordan FreseGlobal Talent Acquisition We Support Global CommunitiesAcquia’s Give Back More MissionThis pillar of Acquia's DNA supports the community via volunteer opportunities, educational programs, mentorship, and more. A Truly Global TeamAt Acquia, we value the differences in our life experiences and viewpoints. We believe that cultivating and supporting a diverse team globally is directly tied to our success as an organization, fueling greater innovation, productivity and business outcomes. Annual DEI RoadmapIn order to support and celebrate our global, diverse, and inclusive community of Acquians, we share a DEI Roadmap to provide ongoing opportunities to educate and involve Acquians around DEI. Throughout the year, we host a variety of speakers, feature Employee Spotlights and highlight volunteer initiatives. DEI Resource LibraryWithin Acquia Academy, we provide a variety of educational and learning resources to help you explore different DEI topics. By educating ourselves, we will develop a greater awareness and appreciation for all that makes us unique, and what makes every person a valued member of our Acquia Community. Global PartnershipsWe partner and collaborate with a variety of companies, organizations, and schools on career workshops, live events and education opportunities. Image Image For the past 10 years, we have partnered with the Wonderfund (www.wonderfundma.org) to pair Acquians with the holiday wish lists of 200 local children. All Acquians are welcome to participate through a virtual option, and we have a lot of fun watching the gifts pile up in our headquarters!Amy HughesSenior Talent Operations Partner Join Our Team View Open Positions"
