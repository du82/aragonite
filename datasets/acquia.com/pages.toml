full_description = "Acquia Cloud Platform Features Use Cases Add Ons Cloud IDE Code Studio Content Hub Edge Multi-Experience Operations Node.Js Hosting Search Site Studio Pricing Resources All Resources Compliance Support Start a Guided Tour Breadcrumb Home Products Acquia Cloud Platform Site Studio Image Site Studio Change how you build and update digital experiences with the only low-code tool for a DXP. Try Site Studio Now Video Thumbnail Experience Management Site Studio is a low-code site builder that provides developers with the ability to build reusable components to enable business users to assemble pages and create content without code, accelerating time to market while remaining brand compliant. Anyone in your organization can easily build and update sites. Simplify Digital Experience Creation Create Composable Digital Experiences Leverage reusable components to build digital experiences that boost conversions at every stage of the customer lifecycle. Get Access to a Sandbox Build and Update Pages Quickly Build pages that support campaigns, events, and launches using drag-and-drop tools. Simplify content editing by enabling users to make their own page edits and view content through their customers’ eyes. See the Guide Enforce Brand Guidelines Keep your brand consistent by defining colors, fonts, and styles at the component level — applicable across all future pages. Read the E-Book FedRAMP Authorized Provides federal agencies the benefits of low-code site building with the confidence to meet the strictest security and compliance demands. See the Press Release Acquia Named a Leader in Digital Experience by G2See the G2 Reviews Image Features Something for Devs, Something for Marketers Developer Features Component Builder Create component layouts and functions for your content authors. Content Template Builder Create templates for your structured content and view them in the content section of your Master Template. Master Template Builder Create boilerplate templates for your website's header, footer, and navigation systems. Build multiple for different boilerplates in different places. Style Guide Manager Build theme-specific overrides for your website's appearance. Style guides allow Drupal multisite websites to have different styles per site. Sync Package Manager Package templates, components, styles, and configurations to deploy from development to production or export and import elements across different sites. Custom Components Create custom components to meet more granular website requirements. Once built, use them anywhere from your component library. Marketer Features Content Authoring Leverage Site Studio’s no-code, drag-and-drop content authoring and page assembly user interfaces to create rich pages in a production environment. Visual Page Builder Create rich, component-based pages directly in the front end of your website with a fully WYSIWYG, drag-and-drop page builder. Layout Canvas Create component-based pages from the back end and see an abstracted, structural view of the components on your page. Component Library Access a library of components to create rich, component-based pages. Or import one of Site Studio’s UI Kits of 50+ common components. Component Content Save components as reusable content pieces to use across multiple pages. Update a content component centrally and populate changes across all pages. Helper Library Save layout compositions as reusable helpers to speed up page creation. Save any component or group as a helper to view in your helper library. See All Features Product Documentation Our documentation makes “thorough” an understatement. See Site Studio Technical Info Build Meaningful Websites 400%productivity increase 80%cost reduction 75%reduction in time to market See the Full ZScaler Customer Story Read the Customer Story Try Site Studio: Play in the Sandbox Key Features Learn about the functionality within Site Studio. Marketing Features Content Authoring Site Studio's no-code, drag-and-drop content authoring and page assembly user interfaces empower marketers and content authors to create rich pages in a production environment. Visual Page Builder Use the Visual Page Builder to create rich, component-based pages directly in the front end of your website. The Visual Page Builder provides a fully WYSIWYG, drag-and-drop page building experience. Layout Canvas Use the Layout Canvas to create rich, component-based pages from the back-end admin interface of your website. The Layout Canvas provides an abstracted, structural view of the components used on your page. Component Library Using the Visual Page Builder or Layout Canvas, access a library of components built for your website to create rich, component-based pages. And if you don’t want to create your own library of components using Site Studio’s Component Builder, you can import one of Site Studio’s UIKits which include a library of over 50 common components. Component Content Save components that have been populated with content as reusable content entities to use across multiple pages. Update a component content entity centrally and see your changes propagate to all pages using the component. Helper Library Save layout compositions as reusable ‘Helpers’ to speed up your page creation process. Save any component or group of components as a Helper and it becomes available in your Helper Library. IT Features Component Builder Use the drag-and-drop component builder to create components for content authors to use. Create both the layout of the component and the form your content authors will use for adding content and settings. Content Template Builder Use the drag-and-drop template builder to create templates for your structured content. Content templates are displayed within the content region in your Master Template. Master Template Builder Use the drag-and-drop Master Template Builder to create the outermost template for your website's header, footer, and navigation systems. Create multiple master templates if you want different areas of your website to have different outermost templates. Menu Template Builder Use the drag-and-drop Menu Template Builder to create templates for Drupal menus from simple list menus to multilevel interactive menus. Place menu templates within your master templates to apply them globally across your website. View Template Builder Use the drag-and-drop View Template Builder to create templates for Drupal views. View templates are a new view format which allow you to layout the structure of your View page or View block. This includes the layout of exposed filters and pagination. Style Builder Use the visual CSS style builder to create styles for base elements and classes. The visual style builder includes a flexible user interface for adding CSS properties to CSS selectors, and a visual, real-time preview as you build the style. Style Guide Manager and Style Guides Create easy to use Style guides for theme-specific overrides for your website's appearance. Style guides allow Drupal multisites to have a different style per site. Sync Package Manager Package your Site Studio templates, components, styles, and other configurations as Site Studio packages to be deployed from development to production. Or, use the Sync Package Manager to export and import your Site Studio templates, components, and styles across different websites. Further Details for Developers"
