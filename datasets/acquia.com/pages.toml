["https://acquia.com/careers/benefits"]
title = "Acquia Benefits | Acquia"
description = "Our dedication to doing the right thing for our employees means providing high-quality, competitive, and comprehensive benefits."
full_description = "Careers Career Exploration Benefits People and Culture Grow Your Career Join Our Talent Network Breadcrumb Home Careers Acquia Benefits Benefits BreakdownWe provide high-quality, employee-first benefits, and fantastic office amenities meant to enrich an innovative, productive team. Global BenefitsDoing the right thing means providing our team with high-quality, competitive, and comprehensive benefits to support team members and their families. Image Unlimited PTOWork-life balance is important to us. Employees take time off when they need it and come back to work feeling refreshed. At Acquia, unlimited PTO actually means unlimited. Image Paid Parental LeaveWe offer up to 13 weeks of maternity, six weeks of paternity leave, and six weeks of adoption leave paid at 100 percent. Our returning parent transition program allows new parents to ease back into work with flexible scheduling. We also help offset the cost of adoption fees. Image Boston HQ + Remote First WorkAlong with our Boston Headquarters, we empower Acquains to be collaborative on a global-scale. We believe in supporting a remote-first culture that allows Acquians greater flexibility to prioritize work-life integration to bring their best selves to work. With increased flexibility comes a commitment to creating a positive, productive work environment, allowing all Acquians to thrive and achieve the extraordinary as a team, no matter the space between. Employee Benefits by Country United States In the United States, we offer a highly competitive suite of benefits, including low-cost medical, dental, and vision insurance, pre-tax health care and dependent care flexible spending accounts, pre-tax commuter and parking accounts, life and accidental death and dismemberment insurance, short-term disability, long-term disability, and a 401(k) retirement savings plan. Low employee premiums for medical, dental, and vision insurance Employer Health Savings Account contributions Cutting-edge telemedicine visits Fitness center reimbursement Adult and dependent orthodontia benefits Confidential employee assistance program, including five free counseling sessions for you or a family member per year Identity theft protection, travel assistance, will preparation, and more Canada In Canada, we offer a supplemental plan to complement the benefits provided by the Canadian government. These offerings include medical, dental, prescription drug, vision, life and accidental death and dismemberment insurance, long-term disability, and a comprehensive employee assistance program. Highlights include: No employee deductible in medical, dental, or vision Insurance, plus enhanced discounts on glasses/contact lenses Paramedical practitioner services, including massage therapists, acupuncturists, physiotherapy Benefits for both basic and major dental services No dispensing fee for prescription drugs Confidential employee assistance program India In India, we offer plans designed to provide coverage across all key areas of care, including medical, dental, vision, accident, group term life insurance, EPF retirement fund, and various pre-tax accounts. Highlights include: OPD cashless network No employee premium cost Coverage for parents or parents-in-law Maternity benefit coverage with no sub-limit United Kingdom Highlights include: Medical history disregarded for medical scheme, with premium covered at 100 percent for employee and spouse Tax-free and NI-free childcare vouchers Pre-tax cycle to work scheme Gym membership discounts Confidential employee assistance program Vision benefits France In France, we offer the following benefits: An enhanced mandatory supplementary insurance (Mutuelle), covering health, dental, and vision insurance, and Prevoyance (as per statutory regulations) Employees also receive an additional monthly stipend to purchase any further enhanced insurance they may need to suit their needs. Belgium In Belgium, we offer the following benefits: Pre-tax lunch vouchers of 8 Euros per working day, 100 percent exempt from social security charges Group insurance, comprising of a hospitalization benefit, group insurance, life, and disability Australia In Australia, we offer the following benefits: A monthly stipend for employees to purchase relevant insurances (such as private medical, life or disability insurance) A one-hour “financial health check” with an independent financial advisor to educate the employee on how to best use the stipend. Employee contribution toward Superannuation Fund via salary sacrifice. Join Our Team View Open Positions"
