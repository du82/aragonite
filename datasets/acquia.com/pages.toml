["https://acquia.com/blog/ways-to-improve-web-accessibility"]
title = "15 Ways to Improve Web Accessibility | Acquia"
description = "Accessibility is more than a nice thing to do; it’s also a business opportunity. Here are 15 practical steps for a more accessible web experience."
full_description = "Accessibility & Inclusion 15 Ways to Improve Web Accessibility April 30, 2024 1 minute read Share this blog post on LinkedIn Share this blog post on Twitter Share this blog post via Email Accessibility is more than a nice thing to do; it’s also a business opportunity that makes experiences easier and more enjoyable to use for everyone. Here are 15 practical steps for a more accessible web experience. An estimated 16% of the world’s population has some form of permanent disability. There are also temporary disabilities — such as musculoskeletal injuries that impede movement — and age-related, degenerative disabilities such as low vision.Disability may limit how a person can interact with their environment, including the internet. But fully accessible websites, along with assistive technology, can help users with disabilities participate in the opportunities and share the benefits of being online. Unfortunately, many websites have accessibility problems that prevent people with disabilities from interacting with site content.If you take the step to make your website accessible, you might find yourself with a big edge over the competition. People with disabilities are likely to become loyal customers of websites that work well for them, and word-of-mouth marketing can be significant among these groups. Moreover, designing for accessibility often serves as a stimulus for innovation that leads to a more productive digital experience for all users, paying off in higher engagement. So, let’s take a look at some reasons to improve your website accessibility, along with 15 practical steps for doing so.3 reasons to improve web accessibilitySocial impactPeople with disabilities should be able to enjoy the benefits of using the internet; however, inaccessible websites limit what they’re able to do online. Making your website accessible is the socially responsible thing to do — and 70% of consumers want brands to be proactive about social issues.Economic opportunityAn inaccessible website can be bad for business. For example, the U.K.’s Click-Away Pound Report found that more than 90% of people don’t bother to complain about website accessibility problems, yet 69% of individuals with disabilities will abandon a website that’s difficult to use.That leaves a lot of money on the table as individuals with disabilities hold $1.2 trillion in annual disposable income.Legal complianceWebsites may be subject to a number of accessibility regulations, such as the Web Content Accessibility Guidelines (WCAG), the California Consumer Privacy Act, and the General Data Protection Regulation. In April 2024, the U.S. Department of Justice (DOJ) issued a final rule under Title II of the Americans with Disabilities Act (ADA) that requires websites and mobile applications provided by state and local governments to meet WCAG 2.1. And while the ADA does not (yet) specifically apply to websites operated by businesses, courts have cited ADA requirements in cases about website accessibility, as these examples demonstrate:In June 2017, a blind man sued the American supermarket chain, Winn-Dixie and won because the chain had failed to make its website accessible to blind users.In 2016, Target paid $6 million in damages to the National Federation of the Blind for accessibility issues that included failing to include alt tags for their product images.In June 2021, a judge ruled that Domino's Pizza had violated Title III of the ADA, because its website was inaccessible to the plaintiff, who was blind.These are just some of the legal cases involving web accessibility issues, and cases related to digital accessibility have increased 75% from 2018 to 2022.How disabilities way limit website interactionsNow that we’ve covered the main reasons to improve website accessibility, let’s look at how certain disabilities may impact a person’s interaction with websites:Visual impairments: A person who has low vision may need assistive reading technology to understand website content. Other visual impairments — such as color blindness, or difficulty detecting contrast — may interfere with a person’s ability to read or interpret content.Auditory impairments: Hearing loss interferes with a person’s ability to interpret audio, so text alternatives to audio files should be available.Motor impairments: People with motor impairments may be unable to use a mouse, to complete an action before it “times out,” or to click on small, precise areas.Cognitive and neurological impairments: People who have cognitive or neurological impairments may have difficulty looking at flickering content, reading large blocks of text, or understanding complex navigation.15 practical ways to improve web accessibilityNow that you understand how various disabilities can hinder a person’s ability to access, navigate, or understand content on the internet, here are 15 ways to build or improve an accessible website:1. Include captions and text transcriptsAny audio files, such as the sound that accompanies a video, should be available in a different format. Closed captions, transcripts, and sign-language interpretation are three ways to help users with auditory impairments understand audio content. It’s also good practice to include transcripts for people who prefer to read or who may be in a situation where they cannot listen to audio (such as when using the web at a cafe or at a library).2. Use proper color contrast ratiosPoor color contrast can make it difficult for users with color blindness to read text. WCAG 2.2 recommends a color contrast ratio of 4.5:1 for text that appears over a background color or image. If you don’t have a graphic designer on hand, the easiest way to make sure your site uses proper contrast is to use a contrast checker, a tool that scans your site’s text colors and backgrounds.3. Remove flickering contentFlickering content may trigger seizures for people with disabilities, so it should be removed. It’s also considered distracting and annoying, so removing flickering content can help users focus on the purpose of your content.4. Use headings to structure contentAssistive reading technology scans content for headings to interpret the structure of a webpage. Make sure headings follow the correct hierarchy, starting with a title, then H1, then H2 headings for all subheadings. You can include H3 and H4 headings under H2s, if it works with the structure of your content.5. Simplify website designsComplex website designs may be challenging for people with cognitive or neurological disabilities. A clean and simple website design helps users of all abilities understand content and see important page elements, like calls to action and form fields. Simpler website designs also can reduce bounce rate, improve conversions, and make mobile browsing easier.6. Add image alt textScreen readers cannot interpret images, unless images have accompanying alt text. This type of text also helps search engine bots “see” images on a page and could help boost rankings for any included keywords. Most content management systems7. Add labels and titles to formsForm fields should be clearly labeled, such as: “First name,” “last name,” and “mailing address.” Forms should also be set up so that a user can tab to the next field on the form.8. Offer different CAPTCHA optionsA CAPTCHA is often used to prevent spam form fills, but it’s not truly accessible, as it may involve the interpretation of unusual visual information. A better approach is to set up PHP code for forms that detects spam URLs. Forms can also be configured to validate each field, so any entries that deviate from parameters can be weeded out as spam.9. Make your site keyboard-friendlyTruly accessible content can be navigated without the use of a mouse. A website should be set up so that a user can move to different page elements or pages using only the “Tab” key, or with accessibility tools such as pointers. (You can actually test your own site’s keyboard-friendliness by attempting to tab through the navigation and pages).10. Allow more time for data inputsUsers with disabilities may be unable to complete a form in the allotted time. Ideally, a website should notify a user when a form is about to time-out and allow them up to 2 minutes to request more time.11. Avoid using tables for content layoutsWhen content is contained in tables, a screen reader may not see the content in the intended order. Tables should be avoided unless absolutely necessary, and when they are needed, all columns and rows should be clearly labeled.12. Use descriptive link textScreen readers cannot communicate the intent of CTA buttons, such as “Learn more.” Make sure website links include enough context for a screen reader to communicate their purpose — for example, “Learn more about web design13. Include skip linksSkip links are text links to the headings on a webpage that allow users to skip to specific sections. These appear at the beginning of the page and function similarly to a table of contents. People using keyboard-only navigation or screen readers can easily jump to the sections that interest them.14. Include multiple contact optionsWebsite users may have different preferred methods for contacting a business, regardless of whether they have a disability. Give users several options for contacting you — phone, email, text, or live chat, for example.15. Test and improve web accessibilityImproving accessibility is not a one-time task, especially with accessibility guidelines and regulations constantly evolving. Website managers should be routinely testing their site for accessibility compliance, using a mix of automated and manual testing.Building an accessible website is the right thing to doAn accessible website demonstrates a company’s commitment to inclusivity, presents opportunities to reach new users, and improves the user experience for people of all abilities. And with few exceptions, businesses don’t need to completely rebuild their websites to make them accessible. So there’s no reason to delay focusing on accessibility.A web optimization and accessibility solution like Acquia Optimize is a good place to start. With automated scans, it can help take the guesswork out of finding any possible issues that may hinder accessibility, while targeted corrections provide clear guidance to address them. Also, don’t look past the infrastructure of your website itself. A modern CMS, such as open source Drupal, includes advanced features to help different groups of users. Together, you get a complete solution for building, managing, and delivering accessible and compliant digital experiences.Learn more about our platform and reach out when you’re ready to make your website fully accessible. Or, for a deeper dive on web accessibility, be sure to check out our “Introduction to Your New Web Accessibility Platform” webinar. Asset reference Andy Parker Former Digital Marketing Manager Share this blog post on LinkedIn Share this blog post on Twitter Share this blog post via Email"
