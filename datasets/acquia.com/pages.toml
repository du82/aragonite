full_description = "Fully Composable Architecture Choose from 10,000+ extensions and integrations! Assemble and evolve your CMS to meet the needs of today and tomorrow. There is no such thing as future-proof, but composability means you can be future-ready. More Drupal Capabilities Project Templates Why start with a blank page? Composer projects can assemble pre-packaged codebases for different use cases and give you the perfect starting place. Even better, create your own templates to encapsulate your own CMS. Modular by Design The opposite of monolithic is composable. Unlike other systems where plugins or add-ons are an afterthought, this platform is built on a foundation of modular components. Multiple sites from a single codebase With the best multisite support available from any tool, you can craft a single codebase that is capable of powering diverse applications. Installation profiles provide turnkey application creation, and those applications can be further extended with modules and extensions. Easily support hundreds or thousands of web applications from a single codebase. Everything Is Swappable Drupal is based on Symfony, the leading PHP framework that is growing more than 50% year over year. Every subsystem is designed to be swapped or replaced as needed, there is no such thing as stuck and there are plenty of Symfony developers in the market. Modern OOP Stack A modern OOP stack enables you to extend, reuse, and customize every part of the CMS. Develop custom functionality faster than ever by building on what others have done before. Drupal Capabilities For Developers Find out more reasons why developers love to work with Drupal. Structured Content Quickly assemble and manage content models, define relationships between content types, and organize content with powerful taxonomies. Read moreAPI-First, Not API-Only Hybrid headless content to power the entire organization. Developers get the full power and flexibility of a headless CMS and authors get low-code publishing. The best of both worlds! Read moreFully Composable Architecture With Drupal, one of the largest open source communities on the planet, you can choose from 10,000+ extensions and integrations! Assemble and evolve your CMS to meet the needs of today and tomorrow. There is no such thing as future-proof, but composability means you can be future-ready. Read moreWorld class performance and scalability Building amazing web applications is no longer enough. You also need to ensure they are fast, delivered from the edge, and capable of handling extreme traffic bursts, like the Super Bowl and NBC Olympics. Read moreDeveloper Workflow Tools With the right tools, a developer can write more code, make fewer mistakes, and innovate faster than anyone else. With 100% cloud-based development tools, you have everything you need from the get go. Read moreRock-Solid Application Security Security threats are constantly on the rise and every application is a target. With threat prevention, security processes, and world-class application design patterns, your Drupal applications are fortified from day one. Read moreOpen Source Community The Drupal community is one of the largest open source communities in the world and provides an open source back-end framework for at least 14% of the top 10,000 websites worldwide. Come for the code; stay for the community. Read more"
