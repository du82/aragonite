title = "About Us | Acquia"
description = "If you can dream it, you can build it. If you build it, you should be able to truly own it."
full_description = "About UsAcquia provides software and services to help you build a better digital world for your customers — one that’s frictionless, relevant, accessible, and safe. Our History What started in a university dorm room has grown into the digital foundation for some of the world’s most ambitious brands. Image In 2000, Dries Buytaert created a community message board at the University of Antwerp in Belgium. A year later, he released it as an open source project that would become Drupal, a powerful platform with the capability and flexibility to manage content at any scale, large and small. In 2007, Dries co-founded Acquia to provide infrastructure, support, and services to the largest, most demanding Drupal users. More than 15 years later, Acquia continues to create Drupal and non-Drupal-based technologies that help companies effectively and efficiently manage content on their terms, build remarkable experiences, and connect more powerfully with their audiences. Today, Acquia offers a portfolio of products to help companies maximize the value of their content across multiple channels and throughout the customer journey. Along with integration capabilities to build a technology stack tailored to your unique business needs, Acquia ensures the tools you invest in across your ecosystem work together seamlessly to provide exceptional customer experiences. A Powerful TeamAcquia’s foundational software and services were built for and around Drupal to give enterprise companies the ability to build, operate, and optimize websites, apps, and other digital experiences. More on Acquia + Drupal Get to Know Our Leadership TeamAcquia's senior leadership is an interdisciplinary group, averaging more than 20 years of experience in the technology industry. We have the expertise, technology, and passion needed to succeed in the post-browser era of digital experience delivery.Meet Our Leadership Vista Equity Partners and AcquiaInvestment firm Vista Equity Partners acquired a majority stake in Acquia in 2019 to accelerate the company’s work in open source software development and global expansion in the digital experience platform (DXP) market. More About Vista World-Class BrandsAcquia is helping some of the world’s leading brands create powerful digital experiences, including the Warner Music Group and Stanford University. More than 4,500 organizations are using Acquia’s solutions to manage and optimize their content. See Our Customer Stories Discover Our Global Partner EcosystemJoin forces with over 700 global partners for tailored solutions and accelerated outcomes. By collaborating with Acquia partners, you'll tap into a diverse network that oﬀers scalability, flexibility, and international reach. Experience successful digital transformation and business growth with our expert community.Find a Partner A Dedicated and Talented TeamWe encourage creativity and imagination. We celebrate our individuality. We inspire ideas, even those considered a little bit wacky. Collaborate with other passionate people who enthusiastically seek out new challenges and continuous learning to continue shaping a better digital world.View Open Positions We're Making a Real ImpactAcquia's ongoing commitment to active Environmental, Social, and Governance (ESG) stewardship continues to make a difference, every day.More on Our ESG Mission Office Locations All Acquia locations that employees use for work.Looking for Acquia registered addresses? Boston, Massachusetts 53 State Street, 10th Floor Boston, MA 02109 United States Phone: 888-922-7842 Sydney, Australia 100 Walker Street Level 6 North Sydney 2060 Australia, NSW Paris, France 7 rue Meyerbeer 75009 Paris France Reading, United Kingdom Davidson House Forbury Square Reading Berkshire RG1 3EU United Kingdom Tokyo, Japan 2-24-12 Shibuya, Shibuya-ku WeWork Shibuya Scramble Square 39F Shibuya-ku, Tokyo 150-6139 Japan"
