description = "Vista Equity Partners acquired Acquia in September 2019. Learn about the partnership."
full_description = "Vista Equity Partners and Acquia In September 2019, Acquia announced a majority investment from Vista Equity Partners (Vista). The investment comes as Acquia advances our global network and creates the world’s only open digital experience platform (DXP). The partnership between Vista and Acquia is based on a shared philosophy of improving the world around us through advancements in technology.“Our mission at Acquia is to help our customers and partners build amazing digital experiences by offering them the best digital experience platform,” said Acquia Founder and Chief Technology and Strategy Officer, Dries Buytaert, in a blog post. “By partnering with Vista and leveraging their scale, network and expertise, we can greatly accelerate our mission and our ability to compete in the market.”“Vista’s support allows us to invest more in research and development, expand faster and get products to market quicker, while continuing to give back to open source communities,” said Acquia President and Chief Executive Officer, Michael Sullivan.About Vista Equity PartnersFounded in 2000 by its Chairman and CEO Robert F. Smith, Vista is a leading global investment firm that exclusively invests in enterprise software, data and technology-enabled businesses through private equity, permanent capital, credit and public equity strategies. By providing technology expertise, operational guidance and capital for sustainable growth, Vista empowers organizations across industries to accelerate innovation and drive positive impact. Stay up to date with Vista by following the firm on LinkedIn, X, Facebook, Instagram and by subscribing to its YouTube channel."
