full_description = "Multilingual Management Multiple languages? No problem. Drupal makes content localization a breeze. More Drupal Capabilities Global Language Don’t limit the places your content can go. With Drupal, you can natively install in 94 languages to deliver localized content to your global audience. Assign language to everything and create language dependent page elements to guarantee a flawless multilingual experience. Translated Interface When translating content, we often focus on our content consumers and not our content creators. But, not all content creators speak the same language. In Drupal, you can translate the UI to make it user friendly for all content creators. Multilingual Content Handling Flexibility Get granular with your translation with field-level content translation configuration. Visualize your translations to make site building in multiple languages easy. Configuration Text Translation Translate configuration text for your pages from the site’s primary language to your desired language. This works for all configuration text and is executed in a translation UI. The best part? All shipped configuration is pre-translatable. Multilingual Sitemaps Build a sitemap with your most important pages so that search engines can crawl your site and understand page hierarchy. It generates multilingual sitemaps for entities, views, and custom links to help optimize SEO across your entire digital estate. Drupal Capabilities For Marketers Find out more reasons why marketers love to work with Drupal. Low-Code Content CreationIt should be easy to build content– for anyone. Acquia makes that mission a reality with Site Studio.Read moreSEODrive higher search rankings, more traffic, and faster websites with Drupal.Read moreMultilingual ManagementMultiple languages – No problem. Drupal makes localization of your content a breeze.Read moreStructured Content Made EasyContent organization is critical to drive results. Drupal makes it easy to organize content models, types, and taxonomies.Read moreMartech IntegrationsQuickly and easily integrate with your existing martech stack to drive cohesive digital experiences and make the most of your digital content.Read moreEnterprise SearchEnable your customers to quickly find the most relevant content to prevent users from disengaging with your digital experience.Read more"
