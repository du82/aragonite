 harassment, discrimination, or violence based on race, ethnicity, nationality, religion, gender, sexual orientation, disability, or any other protected characteristic.Infringing Content. Content that infringes or misappropriates the intellectual property or proprietary rights of others.Offensive Content. Content that is defamatory, obscene, abusive, invasive of privacy, or otherwise objectionable, including content that constitutes child pornography.Harmful Content. Content or other computer technology that may damage, interfere with, surreptitiously intercept, or expropriate any system, program, or data, including viruses, malware, Trojan horses, worms, time bombs, or cancelbots.B. No Security ViolationsYou may not use the Services to violate the security or integrity of any network, computer or communications system, software application, or network or computing device (each, a “System”). Prohibited activities include but are not limited to:Unauthorized Access. Accessing or using any System without permission, including attempting to probe, scan, or test the vulnerability of a System or to breach any security or authentication measures used by a System.Interception. Monitoring of data or traffic on a System without permission.Falsification of Origin. Forging TCP­IP packet headers, e­mail headers, or any part of a message describing its origin or route. This prohibition does not include the use of aliases or anonymous remailers.C. No Network AbuseYou may not make network connections to any users, hosts, or networks unless you have permission to communicate with them. Prohibited activities include but are not limited to:Unauthorized Access. Accessing or using any System without permission, including attempting to probe, scan, or test the vulnerability of a System or to breach any security or authentication measures used by a System.Interception. Monitoring of data or traffic on a System without permission.Falsification of Origin. Forging TCPIP packet headers, email headers, or any part of a message describing its origin or route. The legitimate use of aliases and anonymous remailers is not prohibited by this provision.D. No SpamYou will not distribute, publish, send, or facilitate the sending of unsolicited mass email or other messages, promotions, advertising, or solicitations, like “spam". You will not alter or obscure mail headers or assume a sender’s identity without the sender’s explicit permission. You will not collect replies to messages sent from another Internet service provider if those messages violate this Policy or the acceptable use policy of that provider. All recipients in a Acquia customer or user's contact list must have given provable consent, online or otherwise, to receive email communication and for the specific content being sent to them. You must abide by the following rules:Email lists that were obtained by any means without consent are not allowedAll email and recipient lists must adhere to the CAN-SPAM laws, as well as to any local spam laws for your location or the location of your recipient listsEmail must abide by the rules outlined in this PolicyNo 3rd party unsubscribe methods are allowedOur Monitoring and EnforcementWe reserve the right, but do not assume the obligation, to investigate any violation of this Policy or misuse of the Services or Acquia Site. We may:investigate violations of this Policy or misuse of the Services or Acquia Site; orremove, disable access to, or modify any content or resource that violates this Policy or any other agreement we have with you for use of the Services or the Acquia Site.We may report any activity that we suspect violates any law or regulation to appropriate law enforcement officials, regulators, or other appropriate third parties. Our reporting may include disclosing appropriate customer information. We also may cooperate with appropriate law enforcement agencies, regulators, or other appropriate third parties to help with the investigation and prosecution of illegal conduct by providing network and systems information related to alleged violations of this Policy.Feedback Loops and Abuse ReportingAcquia is registered with Internet Service Provider ("ISP") feedback loops and monitors abuse reports. These feedback loops notify Acquia when your or your user's contact marks a message as "spam". You and your users are subject to warnings, suspension or termination if Acquia receives a report containing a high number of spam reported against your or your user's account.Bounce RatesAn account's bounce rate is subject to be monitored by Acquia. An account's bounce rate should consistently remain under 8% as many ISPs will begin blocking IPs for higher bounce rates. Accounts with high bounce rates are subject to warnings, suspension or termination. To avoid such consequences, ensure your list of contacts are reviewed and maintained regularly.Plugins and IntegrationsYou and your users utilizing Acquia's available integrations and plugins must adhere to Acquia's policies, as well as those of the 3rd party system being integrated. If you are found to be violating Acquia's or an integrated 3rd party system's policy, your account will be subject to suspension or deletion.Acquia Code of Business Conduct & EthicsAcquia is committed to its Code of Business Conduct and Ethics. To the extent it may apply to a customer's use of Acquia services, customer agrees to comply with Acquia's Code of Business Conduct and Ethics, as may be updated from time to time.Reporting of Violations of this PolicyIf you become aware of any violation of this Policy, you will immediately notify us and provide us with assistance, as requested, to stop or remedy the violation. To report any violation of this Policy, please contact our Legal Department: [email protected].'''
