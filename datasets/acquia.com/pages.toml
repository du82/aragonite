["https://acquia.com/newsroom/press-releases/acquia-announces-2024-partner-award-winners"]
title = "Acquia Announces 2024 Partner Award Winners | Acquia"
description = "Top performers recognized for customer outcomes, innovation, and revenue performance"
full_description = "Press Release Acquia Announces 2024 Partner Award Winners Top performers recognized for customer outcomes, innovation, and revenue performanceBOSTON, Feb. 12th, 2025 – Acquia, the leader in open digital experience software, today announced the winners of the 2024 Partner Awards, which showcase the top performers in Acquia’s partner ecosystem. The company recognized 22 organizations globally based on their exemplary utilization of Acquia technologies to deliver superior customer outcomes, their contribution to Acquia’s business performance, and their dedication to drive innovation with the open source Drupal content management system (CMS) and the Acquia digital experience platform (Acquia DXP).“Our 2024 winners set the benchmark for partnership excellence, consistently delivering high quality business impact and technical expertise that enable our customers to improve marketing outcomes and drive business results,” said Darren Burris, VP of Channels at Acquia. “Across North America, Latin America, EMEA, and APAC, these partners have demonstrated exceptional leadership, creativity, and collaboration that have helped us drive the digital experience landscape forward.”The list of winners is:Excellence in Partner Growth Category: Partner of the Year - GlobalMaterial+Partner of the Year - North AmericaBounteousPartner of the Year - EMEAMobiiworldPartner of the Year - Latin AmericaSquadraPartner of the Year - APJEPAMMost Wins of the YearCapgemini Excellence in Customer Outcomes Category: Partner of the Year - Technology AllianceAWSPartner of the Year - Accessibility ChampionParentSquarePartner of the Year - DAM ChampionVelirPartner of the Year - DXP ChampionPerficientPartner of the Year - DXO ChampionFranklyTop Growth Partner of the Year Nighthawk MarketingPartner Advocate of the Year HounderTech for Good Partner of the YearmanifestoStrategic Marketing Excellence Partner of the YearParagon DCXEmerging Partner of the YearWe are North Excellence in Innovation Category: Top Developer Certified Partner of the YearJakalaTop Technical Excellence Partner of the YearVMLProduct Most Valuable Partner of the Year AxelerantTop Partner Community ContributorLullabotTop Partner Starshot ContributorFreelyGiveAdvanced Technology Partner of the YearWorkatoAcquia congratulates its 2024 Partner Award winners, and thanks all of its partners for their commitment to empowering customers to deliver digital experiences that are more relevant, accessible, frictionless, and safe.About Acquia:Acquia empowers ambitious digital innovators to craft the most productive, frictionless digital experiences that make a difference to their customers, employees, and communities. We provide the world's leading open digital experience platform (DXP), built on open source Drupal, as part of our commitment to shaping a digital future that is safe, accessible, and available to all. With Acquia Open DXP, you can unlock the potential of your customer data and content, accelerating time to market and increasing engagement, conversion, and revenue. Learn more at https://www.acquia.com/partner-of-the-year .All logos, company, and product names are trademarks or registered trademarks of their respective owners.Contact:Nicole Ngoon[email protected]"
