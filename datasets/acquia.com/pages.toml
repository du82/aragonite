full_description = "API-First, Not API-Only Hybrid headless content to power the entire organization. Developers get the full power and flexibility of a headless CMS and authors get low-code publishing. The best of both worlds! More Acquia CMS Capabilities JSON:API Support Out of the Box Full support for the JSON:API comes standard. Authentication and full CRUD capabilities are available from day 1. Not just for content, but menus, taxonomies, users, media assets, and more. Create your content model and you’re ready to go. GraphQL Support Prefer GraphQL? No biggie! There’s full support for GraphQL available with multiple options. Embrace the freedom to work the way you want. Web Components With Low Code Headless is necessary, but not sufficient. When you need a low-code solution for non-developers, we’ve got you covered. Reuse content and web components to assemble ambitious experiences while self-service tools empower the business and free developers to focus on innovation. Visual Endpoint Builder Quickly craft API endpoints with a visual query builder. Determine fields to show, filters to use, parameters to accept, and access rights. You can be done in a flash with a custom endpoint, and can export the configuration to code. Decoupled Menus Let your authors manage both content and menus. Groups of links can be managed in the UI, and are available according to the linkset IETF draft. Create Custom REST Endpoints Need something different, complex, or otherwise bespoke? Sure thing. The services layer in the CMS core is fully extensible. Create what you need from what is already available, or create something the world has never seen. Sky’s the limit. JavaScript Resources Available Whether you’re working with React, Vue, NextJS, Gatsby, Svelte, vanilla JS, or the next great thing, our developer portal has resources and starter kits to help kick things off. Drupal Capabilities For Developers Find out more reasons why developers love to work with Drupal. Structured Content Quickly assemble and manage content models, define relationships between content types, and organize content with powerful taxonomies. Read moreAPI-First, Not API-Only Hybrid headless content to power the entire organization. Developers get the full power and flexibility of a headless CMS and authors get low-code publishing. The best of both worlds! Read moreFully Composable Architecture With Drupal, one of the largest open source communities on the planet, you can choose from 10,000+ extensions and integrations! Assemble and evolve your CMS to meet the needs of today and tomorrow. There is no such thing as future-proof, but composability means you can be future-ready. Read moreWorld class performance and scalability Building amazing web applications is no longer enough. You also need to ensure they are fast, delivered from the edge, and capable of handling extreme traffic bursts, like the Super Bowl and NBC Olympics. Read moreDeveloper Workflow Tools With the right tools, a developer can write more code, make fewer mistakes, and innovate faster than anyone else. With 100% cloud-based development tools, you have everything you need from the get go. Read moreRock-Solid Application Security Security threats are constantly on the rise and every application is a target. With threat prevention, security processes, and world-class application design patterns, your Drupal applications are fortified from day one. Read moreOpen Source Community The Drupal community is one of the largest open source communities in the world and provides an open source back-end framework for at least 14% of the top 10,000 websites worldwide. Come for the code; stay for the community. Read more"
