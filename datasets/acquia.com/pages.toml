["https://acquia.com/newsroom/press-releases/acquia-partner-awards-2023"]
title = "Acquia Announces 2023 Partner Award Winners | Acquia"
description = "Acquia announced the winners of the 2023 Partner Awards based on customer outcomes, work with Drupal and Acquia DXP, and revenue performance."
full_description = "Press Release Acquia Announces 2023 Partner Award Winners Top performers recognized for customer outcomes, innovation, and revenue performanceBOSTON, February 29, 2024 – Acquia, the digital experience leader, today announced the winners of the 2023 Partner Awards, which showcase the top performers in Acquia’s partner ecosystem. The company recognized 24 organizations globally based on superior customer outcomes, innovative work with the open source Drupal content management system (CMS) and the Acquia digital experience platform (Acquia DXP), and revenue performance. “Each of our 2023 winners went above and beyond to deliver value to customers and enable the creation of game-changing, productive digital experiences,” said Darren Burris, VP of Channels at Acquia. “Acquia partners in the Americas, Asia, and EMEA have proven that they are at the forefront of innovation and accelerating customers’ ability to generate measurable ROI.”Acquia congratulates our 2023 Partner Award winners:Excellence in Partner GrowthPartner of the Year - Global: MobiiworldPartner of the Year - Asia Pacific and Japan: SCSKPartner of the Year - Europe, Middle East, and Africa: DCX ParagonPartner of the Year - Latin America: E-SINERGIAPartner of the Year - North America: Phase2Partner of the Year - DXP Champion: Northern CommercePartner of the Year - Technology Alliance: CI-HUBMost Wins of the Year: DeptTop Growth Partner of the Year - North America: VelirTop Growth Partner of the Year - Europe, Middle East, and Africa: Capgemini Excellence in Customer OutcomesPartner Advocate of the Year - Asia Pacific and Japan: Dentsu DigitalPartner Advocate of the Year - Europe, Middle East, and Africa: MerklePartner Advocate of the Year - North America: PerficientTech for Good Partner of the Year: TPXimpactEmerging Partner: BernadetteEmerging Partner: Digital PulpEmerging Partner: Tobania, a Sopra Steria Company Excellence in InnovationAccessibility Partner of the Year: Cyber-Duck, a CACI BusinessAdvanced Technology Partner of the Year: AWSProduct MVP - Europe, Middle East, and Africa: WIDE AgencyProduct MVP - North America: Elevated ThirdTop Developer Certified Partner of the Year: AxelerantTop Partner Community Contributor: Third and GroveTop Technical Excellence: VML Our 700-partner strong ecosystem enables successful digital transformation and drives business growth for thousands of organizations globally. Learn more and find an Acquia partner at https://www.acquia.com/partners. About AcquiaAcquia empowers ambitious digital innovators to craft the most productive, frictionless digital experiences that make a difference to their customers, employees, and communities. We provide the world's leading open digital experience platform (DXP), built on open source Drupal, as part of our commitment to shaping a digital future that is safe, accessible, and available to all. With Acquia DXP, you can unlock the potential of your customer data and content, accelerating time to market and increasing engagement, conversion, and revenue. Learn more at https://acquia.com.# # #All logos, company, and product names are trademarks or registered trademarks of their respective owners."
