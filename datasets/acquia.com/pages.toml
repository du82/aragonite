["https://acquia.com/drupal"]
title = "Drupal Overview | Acquia"
description = "Drupal is a leading open source content management system and the foundation of Acquia’s digital experience platform."
full_description = "Drupal Features All Features For Marketers For Developers Use Cases Packages Resources All Resources Blog Customer Stories Drupal 11 Drupal CMS Support Get Started Breadcrumb Home Drupal Overview Drupal Drupal Overview Lottie file The premier open source digital experience software. Chat with an Expert Lottie file Built on Drupal About What is Drupal Drupal is the leading enterprise, open source content management system (CMS) in the world, and the foundation of Acquia’s digital experience platform (DXP). Created by Acquia’s co-founder and CTO, Dries Buytaert, Drupal gives teams the freedom to create exceptional digital experiences. Organizations of all sizes — across industries and the planet — use Drupal not only to build corporate websites, but to build and manage e-commerce sites, mobile applications, digital signage, social networking sites, intranets, portals, microsites, resource directories, kiosks, and more. Learn More About Drupal Get a Head Start On Your Drupal Project Starter KitEnterprise Low CodeFor control and creation of layout and display in Drupal, powered by Acquia Site StudioGet Started Starter KitCommunityIdeal for greater autonomy over layout and display in Drupal built from community projectsGet Started Starter KitHeadlessAn application optimized for a headless environment and easy for front-end developers to use Get Started Value Why Drupal One out of ten enterprise-grade digital experiences use Drupal. Why? Because Drupal is open source, flexible, has no vendor lock-in, and benefits from one of the largest and most active open source communities to deliver more innovation than its proprietary peers. Who Uses Drupal? Different roles across organizations, spanning every industry champion Drupal. The fanbase includes digital experience designers, content strategists, editors, developers, digital marketers, and other technologists. Learn why the crowd chooses Drupal. Drupal For Marketers Drupal For Developers Find Freedom with Drupal Drupal Gives Teams the Freedom to Create Exceptional Digital Experiences Learn More Integrations and APIs Get your technologies to play nicely together, and integrate with your existing martech stack to drive cohesive digital experiences and make the most of your digital content. Discover Drupal integrations Security and Compliance Threat prevention, security processes, and world-class application design patterns keep your Drupal applications protected with rock-solid application security. Research Drupal Security and Compliance Features See what happens when you take the most powerful, flexible CMS in the world and enhance it further. The possibilities are endless. See all Features Versions Drupal is always evolving. Learn more about all Drupal versions to find the one that’s right for you. Drupal 9 Drupal 10 Drupal 11 Drupal FAQs Need fast facts about the content management system? See quick answers to some of the most common questions surrounding Drupal today. Is Drupal free? Drupal is freely available for anyone to download and use. New users or those unfamiliar with its ins and outs may engage developer or consulting support from the many individuals and agencies who specialize in Drupal. Is Drupal open source? Drupal is open source software. It is distributed under the GNU General Public License version 2 or later. Anyone can run, study, share, or modify Drupal. What language is Drupal written in? Drupal is written in the PHP programming language but also uses a fair amount of JavaScript. What is Drupal Core? Drupal core offers everything needed to create a website, with features like blogging, forums, and contact forms. It includes a set of modules that provide content structuring, query building, authentication, permission, workflow, multilingual, and many more powerful capabilities. Users can take advantage of Drupal modules to enhance core features. These modules range in capability from allowing Drupal to display video to helping it manage dates. What is the Drupal Association? The Drupal Association is a 501(c)(3) nonprofit focused on accelerating Drupal, fostering the growth of the Drupal community, and supporting the project’s vision to create a safe, secure, and open web for everyone. Individuals and organizations may become members to help shape the future of Drupal. What is the difference between Drupal and Acquia? Drupal is a free, open source content management system first developed by Dries Buytaert in 2000. Acquia is the software company he co-founded in 2007 to provide enterprise support for Drupal users. Today Acquia’s products include the Drupal-powered Acquia Drupal Starter-Kits, Acquia Cloud Platform for hosting Drupal applications, the low-code Site Studio product to make it easy for marketers to build digital experiences using Drupal, and the Code Studio suite of Drupal DevOps tools. Acquia rounds out its digital experience platform with a customer data platform, digital asset management system, product information management system, and marketing automation solution. Drupal Community One platform. One community. Drupal was created and is driven by one of the largest and most diverse open source communities on the planet. Get to know the Drupal Community"
