["https://acquia.com/newsroom/press-releases/acquia-completes-acquisition-monsido"]
title = "Acquia Completes Acquisition of Monsido | Acquia"
description = "Acquia completes acquisition of Monsido, adding website accessibility, website optimization, and compliance solution to Acquia DXP"
full_description = "Press Release Acquia Completes Acquisition of Monsido Adds website accessibility, website optimization, and compliance solution to Acquia’s industry-leading digital experience platform (DXP)BOSTON, January 9, 2024 – Acquia, the digital experience leader, today announced the successful completion of its acquisition of the Monsido platform, a website accessibility and optimization solution. The SaaS-based Monsido platform helps customers of all sizes, across industries, to monitor and perfect website accessibility, content quality and governance, search engine optimization (SEO), data privacy, and performance. The acquisition expands the capabilities of the Acquia digital experience platform, Acquia DXP, making it the only leading DXP that offers a full solution for supporting the creation of digital experiences that are accessible to all website users.Acquia acquired the Monsido platform from CivicPlus, a leader in public sector integrated technology solutions. CivicPlus retains and continues to serve its U.S. local government customers as a reseller of the Monsido platform. Monsido team members in the U.S., U.K., Australia, and Denmark, including two co-founders of Monsido, have joined Acquia. “Making accessibility and compliance core to Acquia DXP supports our mission of building an inclusive digital future, and enables our customers to provide web experiences that serve all of their users,” said Steve Reny, President and CEO of Acquia. “We are delighted to welcome the Monsido team to Acquia and look forward to bringing the Monsido platform and its capabilities to more organizations globally.”Accessibility a prerequisite for an open DXPIn a recent report, IDC found that fewer than 10% of websites are fully accessible across visual, auditory, and cognitive disabilities.(1) Legislation such as the Americans with Disabilities Act and the upcoming European Accessibility Act mandates that vendors address digital accessibility. Marketers are also recognizing that they broaden the number of customers they reach by making websites accessible. Today providing a productive digital experience means meeting consumer expectations for accessibility. Doing so enhances brands, builds customer loyalty and, in a busy digital world, can be an organization’s main competitive advantage. Acquia now offers a complete solution for building, managing, and delivering websites that are fully optimized to meet modern standards and digital content guidelines and that comply with Web Content Accessibility Guidelines (WCAG) and web accessibility legislation.Monsido works with any content management system (CMS), including Drupal, the open source CMS that is the foundation of Acquia DXP. It is available as part of Acquia DXP or as a standalone offering. For more information:Learn about the Monsido platform and get startedAcquia’s accessibility missionOur path to building accessible software for all users (1) IDC, “Web Accessibility: Preparing for Compliance in 2025 Brings an Intersection of DEI and Customer Experience” by Marci Maddox, May 2023 (IDC #US48610922).About AcquiaAcquia empowers ambitious digital innovators to craft the most productive, frictionless digital experiences that make a difference to their customers, employees, and communities. We provide the world's leading open digital experience platform (DXP), built on open source Drupal, as part of our commitment to shaping a digital future that is safe, accessible, and available to all. With Acquia DXP, you can unlock the potential of your customer data and content, accelerating time to market and increasing engagement, conversion, and revenue. Learn more at https://acquia.com.# # #All logos, company and product names are trademarks or registered trademarks of their respective owners."
