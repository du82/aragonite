description = "Content management is central to your marketing team’s digital engagement strategy. See why teams choose Drupal."
full_description = "Empower Your Team With Drupal Strong content is essential to drive digital engagement. From developers and site builders to content authors and marketers, Drupal provides all the tools your team needs to deliver exceptional content experiences with ease. Drupal for Marketers Global Language Support and Management Multiple languages – No problem. Drupal is available in 94 languages, and supports content to be translated in even more. Learn more Structured Content In today's world, content needs to be delivered on the channels customers prefer to use. Leverage Drupal's content modeling, structured content, and headless delivery capabilities to provide content across channels and customer touchpoints. Learn more SEO Drupal is known for its great SEO. Find out how you can use Drupal to drive higher search rankings, more traffic, and higher conversion rates. Learn more Enterprise Search Great search not only makes content easier to find but also helps customers navigate your site. From keyword-based search to faceted navigation and related links, our built-in enterprise search capabilities help customers engage with your digital experience. Learn More Accessibility Digital equity for all demands accessible websites for everyone — and it's just good business. Learn more about Drupal's strong commitment to accessibility. Learn More Content Workflows Manage the content creation process from draft to review to revisions back to review to finally published with Drupal. Learn More Martech Integrations Quickly and easily integrate with your existing martech stack to drive cohesive digital experiences and make the most of your digital content. Drupal offers thousands of out-of-the-box integration to choose from. Learn More Low-Code Tools To deliver the best customer experiences, all departments must participate in the creation of these experiences. This is where low-code and no-code solutions come in. To enable business users to create digital experiences, check out Acquia Site Studio, the most advanced low-code tool for Drupal. Learn More Drupal for Developers Structured Content Quickly assemble and manage content models, define relationships between content types, and organize content with powerful taxonomies. Learn more API First As one of the first Hybrid CMSs in the market, Drupal gives developers the full power and flexibility of a headless CMS while authors enjoy low-code publishing. The best of both worlds! Learn more Fully Composable Architecture With Drupal, one of the largest open source communities on the planet, you can choose from 40,000+ extensions and integrations. Assemble and evolve your CMS to meet the needs of today and tomorrow. There is no such thing as future-proof, but composability means you can be future-ready. Learn more Performance and Scalability Building amazing web applications is no longer enough. You also need to ensure they are fast, delivered from the edge, and capable of handling extreme traffic bursts, like the Super Bowl and NBC Olympics. Learn more Developer Tools With the right tools, a developer can write more code, make fewer mistakes, and innovate faster than anyone else. With 100% cloud-based development tools and a Drupal-optimized CI/CD pipeline, you have everything you need from the get go. Learn more Security Security threats are constantly on the rise and every application is a target. With threat prevention, security processes, and world-class application design patterns, your Drupal applications are fortified from day one. Learn more Open Source The Drupal community is one of the largest open source communities in the world, with more than 10,000 active developers. Learn more"
