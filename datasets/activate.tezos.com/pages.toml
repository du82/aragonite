title = "Activate Tezos Wallet"
description = "Check your contribution to the Tezos fundraiser."
full_description = "Activate Your Recommended AllocationRecommended allocations for contributions to the Tezos Foundation’s fundraiser must be activated before they may be accessed. A contributor may activate the recommended allocation of a given public key hash by entering the public key hash and its corresponding activation code into the respective fields below and clicking the “Activate” button. This should also reveal the blinded key of the given public key hash. Blinded keys, not public key hashes, are the keys that appear in the genesis block proposed by the Foundation, which may be found here. Do not enter any private key information (a fifteen-word mnemonic, and the email address and password used during the fundraiser) into these fields. A balance for a public key hash that was recommended an allocation will not appear on a Tezos block explorer until it has been activated. The activation code corresponding to a public key hash from the fundraiser may be obtained by completing the Foundation’s KYC/AML process here.If a contributor has already activated the recommended allocation of a given public key hash and would like to reveal that public key hash’s blinded key, it may do so by entering the public key hash and its corresponding activation code into the respective fields below and clicking the “Reveal Blinded Key” button. Do not enter any private key information into these fields. Fundraiser contributors may contact contribution.check@tezos.com for support. This is an invalid public key hash Activate Reveal Blinded KeyWe were unable to activate a recommended allocation corresponding to the information that was entered. Please make sure that a public key hash from the fundraiser and the associated activation code obtained after completing the Foundation’s KYC/AML process here are entered correctly. If a balance for a given public key hash from the fundraiser appears on a Tezos block explorer, then the activation process has already been completed and no further action is needed.We were unable to find a blinded key corresponding to the information that was entered. Please make sure that a public key hash from the fundraiser and the associated activation code obtained after completing the Foundation’s KYC/AML process here are entered correctly.The recommended allocation of the public key hash that was entered has been activated. Here is the blinded key of this public key hash: be0e509c330e775f6425cff00dcf4f4ebe0e509c330e775f6425cff00dcf4f4ebe0e509c330e775f6425cff00dcf4f4eHere is the blinded key corresponding to the public key hash and activation code that were entered: be0e509c330e775f6425cff00dcf4f4ebe0e509c330e775f6425cff00dcf4f4ebe0e509c330e775f6425cff00dcf4f4eClose"
