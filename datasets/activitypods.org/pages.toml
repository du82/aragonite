["https://activitypods.org/specs/activitypub"]
title = "ActivityPub compliance — ActivityPods"
description = "Brings together ActivityPub and Solid Pods and empowers developers to create truly decentralized applications."
full_description = "ActivityPub compliance Outbox Inbox Authentication HTTP Signature Linked Data Signature Proxy endpoint Side effects Create/Update/Delete Follow Like Announce Add/Remove Block ActivityPub is a decentralized social networking protocol based upon the ActivityStreams 2.0 ontology. It provides a client-to-server and a server-to-server API for all common social features: following, liking, reposting… It became a W3C recommandation in 2018 and is used nowadays by dozens of softwares. Apart from a few side-effects which would be quick to implement if need arised, ActivityPods is 100% compatible with ActivityPub, and supports both client-to-server and server-to-server interactions. Outbox User can POST to his own outbox. Anyone can GET the outbox, but it will return only the activities they have the right to read. Inbox Any ActivityPub actors can post to an inbox, using HTTP Signature for authentication. Anyone can GET the inbox, but it will return only the activities they have the right to read. Authentication HTTP Signature HTTP signature is the recommended way to authenticate for server-to-server ActivityPub interactions. It is generally used when POSTing to other inboxes. We have extended its use so that it can be used on any endpoint, including LDP routes. Linked Data Signature In addition to HTTP signature, it is recommended to also verify content posted to inboxes with Linked Data Signatures in order to increase security. This is implemented by only a few ActivityPub-compatible softwares (notably Mastodon), and none enforces it at the moment. 👷 To be implemented (#321) Proxy endpoint The ActivityPub specification mentions a as:proxyUrl predicate (included in the as:endpoint predicate of the actor) with the following description: Endpoint URI so this actor’s clients may access remote ActivityStreams objects which require authentication to access. To use this endpoint, the client posts an x-www-form-urlencoded`` id parameter with the value being the id` of the requested ActivityStreams object. We have implemented this endpoint, and we have extended it for non-GET methods using the multipart/form-data Content-Type (see the related ActivityPods section). Side effects Create/Update/Delete It’s possible to create, update or delete any kind of objects. Objects are automatically stored in the corresponding containers. Follow Every ActivityStreams actor is automatically attached as:followers and as:following collections. The Undo > Follow activity is also supported. Like Every ActivityStreams actor is automatically attached a as:liked collection Every ActivityStreams object is automatically attached a as:likes collection, as soon as a Like activity is detected (?). If you want non-ActivityStreams objects to have a as:likes collection, you should add the type as:Object to the resource (TODO). The Undo > Like activity is also supported. Announce The as:shares collection is not implemented yet. However we have a custom apods:announces collection which list actors who are authorized to see a resource, and and apods:announcers collection with actors who are allowed to share it with their contacts (currently this is done through the Announce activity, but we may create a Authorize activity in the future). Add/Remove 👷 To be implemented Block 👷 To be implemented"
year_published = 2025
