full_description = "Jan 21, 2025 Our roadmap for 2025 We're delighted to announce that we've received two new grants from the NLnet foundation, which will allow us to consolidate ActivityPods. But not only that: we will also be able to add a number of long-awaited new features. So here's a quick overview of what we'll be working on in 2025. Oct 8, 2024 ActivityPods and NextGraph are joining forces Both projects are based on Semantic Web/Linked Data/RDF technologies, and both foster the decoupling of data storage from data usage. Data storage should stay in total control of the end-user, and third party apps should request permission to access or modify such data. Oct 7, 2024 ActivityPods 2.0 is out! We are thrilled to announce the official release of ActivityPods 2.0, a framework and platform that allows users to create a single account for multiple decentralised social applications while also providing developers with the tools to build and integrate these applications. releasefeatures Jul 19, 2024 The European Union must keep funding free software The funding of a large open source internet ecosystem is at risk eufunding Jan 11, 2024 ActivityPods v1.5 released While we prepare the spring release of v2.0, we're delighted to announce the immediate availability of ActivityPods v1.5, which includes two long-requested features: simplified invitation links and contact groups. The purpose of this post is to introduce them to you. releasefeatures Nov 23, 2023 The road to ActivityPods 2.0 Since this summer, thanks to a grant from NLnet as part of the NGI0 Entrust Fund program, we've been working hard on ActivityPods 2.0, with a planned release in spring 2024. The aim of this article is to explain this background work and what's at stake. roadmapsolid"
