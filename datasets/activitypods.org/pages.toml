["https://activitypods.org/roadmap"]
title = "Roadmap — ActivityPods"
description = "Brings together ActivityPub and Solid Pods and empowers developers to create truly decentralized applications."
full_description = "ActivityPods Roadmap December 2021 Launch & First working ActivityPods application Welcome to my place, an app to organize private events, is deployed February 2022 Second ActivityPods application in production Mutual Aid, a classified ads app, is deployed March 2022 Solid World presentation The project is featured in Solid project's monthly webinar Watch video December 2022 Two new ActivityPods providers MyPod.store (provided by Virtual Assembly) and Bocage.me (Normandy area) January 2023 Frontend for ActivityPods providers Account and contacts management are split in a separate frontend deployed by each Pod provider March 2023 Public data Ability to make data public and to aggregate them in external public instances. January 2024 Improved contacts management Geolocalization of profiles, contacts grouping, improved invitation by email... March 2024 Mastopod deployed to production Mastopod, a Mastodon-compatible app which saves all data on Pods Autumn 2024 ActivityPods 2.0 Extract bots from ActivityPods providers: they become independant applications activable by user. Read blog post Winter 2024-2025 Collective Online DatastoresWork in progress Allow users to create CODs and manage them collectively Mid-2025 Full Solid-OIDC compliance Solid clients can connect to ActivityPods Pods just like other Pod providers Autumn 2025 NextGraph integration Store Pod data in NextGraph so that it may be encrypted and accessed via the NextGraph protocol ActivityPods Newsletter Stay informed about the project. One mailing/month maximum. Subscribe This project is funded through the NGI0 Entrust Fund, a fund established by NLnet with financial support from the European Commission's Next Generation Internet program, under the aegis of DG Communications Networks, Content and Technology under grant agreement No 101069594. Learn more on the project page."
