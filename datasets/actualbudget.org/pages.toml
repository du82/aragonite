onUnstructured in BANKINTER_BKBKESMM — thanks hostyn#429 Prevent account fallback if name is defined in formatPayeeName — thanks hostyn#439 Fix GoCardless error handling — thanks matt-fidd#442 Fix wrong payeeName used for KBC_KREDBEBB — thanks ArnaudWeytsMaintenance​#421 Improve testing utils and add delete-user-file test — thanks tcrasset#422 Refactor user validation into middleware — thanks tcrasset#423 Add integration tests for the /sync endpoint — thanks tcrasset#425 Add integration tests for remaining app-sync.js endpoints — thanks tcrasset#430 CI workflow for pinging PRs that have been in the "WIP" state for a week without an update. — thanks MatissJanis & matt-fidd#434 Add logging middleware — thanks tcrasset#435 Optimise GoCardless sync to reduce API usage by removing accountMetadata call — thanks matt-fidd#436 Optimise GoCardless sync to reduce API usage by removing balance information — thanks matt-fiddTags:announcementreleaseEdit this page'''
