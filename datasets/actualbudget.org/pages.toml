full_description = "Release 24.8.0August 3, 2024 · 9 min readMatiss Janis AboltinsActual Budget MaintainerThe release has the following notable improvements:ability to favorite payeesmost used and favorite payees appear at the top of the payee autocomplete resultsresizable side navigationexperimental goal templates: long term goal template supportexperimental spending report: adding last month as an option for the primary graphTags:announcementreleaseRead More Release 24.7.0July 2, 2024 · 5 min readMatiss Janis AboltinsActual Budget MaintainerThe release has the following notable improvements:Custom reports are officially releasedSplits in rules are officially releasedTags support for transactions (use #tags in notes)Transactions: allow merging/un-merging multiple transactionsShow account notes in sidebar (on hover)Tags:announcementreleaseRead More Actual vs YNABJuly 1, 2024 · 10 min readyoungcwActual Budget MaintainerHello budgeters!This is the start of the series Actual Versus! Today we will be comparing Actual Budget to YNAB (You Need a Budget).YNAB is the longstanding heavyweight in the envelope budgeting space. It was one of the originals. Lets see how Actual stacks up!Tags:budgetingversusRead More Release 24.6.0June 3, 2024 · 6 min readMatiss Janis AboltinsActual Budget MaintainerThe release has the following notable improvements:API: ability to run 3rd party bank-sync (GoCardless, SimpleFin) programmaticallyAPI: methods for working with rulesAdd option to authenticate with HTTP header - X-ACTUAL-PASSWORDAdd option to import CAMT.053 based XML files(Experimental) monthly spending report - please report feedback hereTags:announcementreleaseRead More Release 24.5.0May 3, 2024 · 9 min readMatiss Janis AboltinsActual Budget MaintainerThe release has the following notable improvements:Ability to show/hide reconciled transactionsAbility to prepend/append notes when bulk editing transactionsShow remaining balance in the category autocompleteOFX, CSV import: ability to disable transaction de-duplication logicMobile: account management functionalityMobile: clicking on category allows to see transactions list for the clicked categoryDesktop app release(Experimental) custom report improvements - please report your feedback hereTags:announcementreleaseRead More"
