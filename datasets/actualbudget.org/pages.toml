["https://actualbudget.org/docs/tour/reports"]
title = "Reports | Actual Budget Documentation"
description = "This view gives you access to both the two built in reports, Net Worth and Cash Flow, but also your own custom reports."
full_description = 'A Tour of ActualReportsOn this pageReportsThis view gives you access to both the two built in reports, Net Worth and Cash Flow, but also your own custom reports.All reports in this view are shown in their small, tiled, version. Clicking on a tile will take you to that very report.<img style="position:absolute;top:0;left:0" src="/assets/ideal-img/tour-reports-overview.dfb81c6.1083.png" srcset="/assets/ideal-img/tour-reports-overview.dfb81c6.1083.png 1083w" width="1083" height="532">The built in reports​Net worth represents the overall balance of all your accounts over time. It is calculated by subtracting your debts from the total value of your cash and assets. This includes all investments. Essentially, your net worth is the amount you would have if you sold all your assets and paid off all your debts.Cash flow tracks your spending over time by focusing solely on budget accounts and displaying their balances. It includes separate visualizations for income and expenses, providing a quick overview of how these factors affect your available money over time. By considering your budgeted accounts as “cash on hand,” cash flow clearly shows how your available funds fluctuate.These reports are detailed in the reports section in the manual.<img style="position:absolute;top:0;left:0" src="/assets/ideal-img/tour-reports-cashflow.644a9fc.1078.png" srcset="/assets/ideal-img/tour-reports-cashflow.644a9fc.1078.png 1078w" width="1078" height="518">Custom reports​Actual custom reports should give you all the reports you need on your spending habits and your income and are thoroughly covered in the Custom Reports topic in the manual.Below are examples of reports covering our Daily Expenses over the last six months. One report shows this as a graph, the other as a table. Note that the table version also shows the sum and average (over six months) for the various categories.<img style="position:absolute;top:0;left:0" src="/assets/ideal-img/tour-reports-daily-expenses-graph.d81909f.1174.png" srcset="/assets/ideal-img/tour-reports-daily-expenses-graph.d81909f.1174.png 1174w" width="1174" height="679"><img style="position:absolute;top:0;left:0" src="/assets/ideal-img/tour-reports-daily-expenses-table.a1da58b.1174.png" srcset="/assets/ideal-img/tour-reports-daily-expenses-table.a1da58b.1174.png 1174w" width="1174" height="679">Edit this page'
