full_description = '''Using ActualBackup & RestoreBacking up Your Actual BudgetOn this pageBacking up Your Actual BudgetnoteIf your budget is very old, you may have trouble restoring large backups. If you’re encountering this issue, click “Reset Sync” under 'Settings' > 'Show advanced settings' to reset sync, then make the export again. This should reduce the file size.You can export your data from Actual at any time. To do so:Login to your budget, click 'More' > 'Settings'<img style="position:absolute;top:0;left:0" src="/assets/ideal-img/sidebar-settings@2x.673fd53.462.png" srcset="/assets/ideal-img/sidebar-settings@2x.673fd53.462.png 462w" width="231" height="298">Scroll down to the Export section and click Export Data<img style="position:absolute;top:0;left:0" src="/assets/ideal-img/settings-export.91491e4.1130.png" srcset="/assets/ideal-img/settings-export.91491e4.1130.png 1130w" width="1130" height="678">Save the file somewhere on your computer - that is it -- you're done.Manually Creating a Backup From the Desktop App​This will force a backup to be created right now. Do this if you are going to do something that you might want to revert later (and don't want to use undo).Select the File > Load Backup… menu itemClick Backup NowEdit this page'''
