title = '43 posts tagged with "announcement" | Actual Budget Documentation'
full_description = "Release 25.3.0March 5, 2025 · 7 min readJulian Dominguez-SchatzActual Budget MaintainerThe release has the following notable improvements:New UI for managing bank syncSupport for some additional languagesLots of bugfixes and maintenance workdangerStarting this release, the actual-server repository will no longer be updated. If you use a local install, please review these docs for how to migrate.infoStarting next release, we plan on deprecating the @actual-app/web NPM package. This should not impact any standard deployment methods, but if you have a use-case for this package, please create an issue so we know about it!Tags:announcementreleaseRead More Release 25.2.1February 6, 2025 · One min readMatt FiddamanActual Budget MaintainerThe primary intent of this release is to patch regressions that prevented the reports page from loading when the selected language was not English, and the desktop apps from working.Tags:announcementreleaseRead More Release 25.2.0February 5, 2025 · 8 min readJulian Dominguez-SchatzActual Budget MaintainerThe release has the following notable improvements:Upcoming schedule length officially released as first-party featureAbility to switch the interface language, with experimental support for the nl, pt-BR, uk, and en-GB localesAbility to disable category learningCombined account view on mobileTags:announcementreleaseRead More Release 25.1.0January 5, 2025 · 4 min readJulian Dominguez-SchatzActual Budget MaintainerThe release has the following notable improvements:New calendar report card typeAbility to duplicate budgetsExperimental support for multiple users via OpenID ConnectTags:announcementreleaseRead More Roadmap for 2025January 2, 2025 · 7 min readMatiss Janis AboltinsActual Budget MaintainerActual Budget is a powerful and open-source tool for managing personal finances. In this article - I recount my personal experience transitioning from YNAB to Actual and how I helped to build the community of volunteers. We also briefly talk about plans for 2025 and I address some frequent statements seen on the internet.Tags:announcementRead More"
