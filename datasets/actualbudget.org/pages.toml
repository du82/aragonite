["https://actualbudget.org/docs/getting-started/tips-tricks"]
title = "Tips & Tricks | Actual Budget Documentation"
full_description = '''Using ActualTips & TricksOn this pageTips & TricksUndo/Redo​If you ever make a mistake, pressing CmdZ will undo, and pressing CmdShiftZ will redo. Using the desktop app, this is an undo system that you can always rely on; any change can be undone and the UI will walk back in time. If you're using the web app, this is only good for the current session of the website. If you refresh, or close the browser tab, undo history is lost.Keyboard Shortcuts​Firstly, a few global shortcuts for the Electron App that is still in development. Please be aware that these global shortcuts do not work in the web app:Cmd1 will show the budgetCmd2 will show reportsCmd3 will show all accountsBUT here is one that WILL work in the web app as well:CmdO (O not zero) this will close the file and list other available files to openBudget​Enter while editing a budget amount will move to the next category.ShiftEnter will move to the previous category.Transaction Editing​When editing, Enter and ShiftEnter will move down and up. If a dropdown is open and you've typed a new value, this will instead save the value and close the dropdown.When editing, Tab and ShiftTab will move left and rightWhen adding a new transaction, CmdEnter will add it regardless of where you are editing. Pressing Enter in either the Payment or Deposit columns will add it as well.Transaction Management​F Show only selected transactions.D Delete selected transactions.A Set account for selected transactions.P set payee for selected transactions.N Set notes for selected transactions.C Set category for selected transactions.L Toggle cleared for current transaction.The following require a transaction to have been selected first:J/↓ Move to the next transaction down.K/↑ Move to the next transaction up.Space Toggle selection of current transaction.ShiftSpace Add all transactions between current transaction and most recently selected transaction.View Multiple Months at Once​In the top left of the budget, you will see this control:<img style="position:absolute;top:0;left:0" src="/assets/ideal-img/months-selector.5765fe7.216.png" srcset="/assets/ideal-img/months-selector.5765fe7.216.png 216w" width="216" height="74">This sets the maximum amount of months to render at once, and defaults to 1. If you want to view multiple months on the same page, click the boxes to increase the number.noteThis only controls the maximum number of months. If the app is too small to render all of them it will only render the months that fit on the screen.Show Running Balance​A "running balance" is the balance of the account after every transaction over time. This is very useful for reconciling accounts with banks because you can see the balance at a specific date and use it to compare it with your bank. Note that the "Show running balance" option and column is only available when the list of transactions is sorted by date in descending order.To enable this:Click on an accountClick on the 3 dots to show the actions menuSelect "Show running balance"A new column should appear which shows the balance of the account after each transaction:<img style="position:absolute;top:0;left:0" src="/assets/ideal-img/running-balance.f8e1710.532.png" srcset="/assets/ideal-img/running-balance.f8e1710.532.png 532w" width="532" height="466">Edit this page'''
