["https://actualbudget.org"]
title = "Actual | Actual Budget Documentation"
full_description = "Actual Budget is a super fast and privacy-focused app for managing your finances. At its heart is the well proven and much loved Envelope Budgeting methodology.You own your data and can do whatever you want with it. Featuring multi-device sync, optional end-to-end encryption and so much more. Add all of your accounts and track everything in one place. Get valuable information like net worth from all your accounts together. Learn more Self-host our syncing service. It’s easy to set up, but uses sophisticated distributed systems technology to sync changes across any number of devices. Learn more Actual has built in support for bank syncing using goCardless (EU/UK) and SimpleFIN (US/Canada). Learn more Use the power of envelope budgeting to get on top of your finances. You can only budget cash you have on hand, which means your budget stays realistic and you don't make numbers up. Learn more Manage transfers easily by creating transfer transactions. Actual will link the transactions on both sides and update them together. Learn more Import transactions from the most popular financial files: QIF, OFX, QFX, CAMT.053 and CSV. Learn more A robust undo system allows you to rollback any changes you make, and redo them if desired. Never worry about making mistakes. Learn more We provide builtin YNAB4 & nYNAB importers that keep all of your history. There are many more available from the Actual Community. Learn more If you're a developer, we got you. Use our fully-featured API to write custom importers or build your own features. This API simply runs on your local data. Learn more * PikaPods donates 20% of fees people like you pay to run Actual on their servers to our Open Collective. Regardless of this relationship, we believe PikaPods is the easiest way to get started with Actual."
