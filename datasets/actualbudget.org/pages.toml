["https://actualbudget.org/blog/roadmap-for-2025"]
title = "Roadmap for 2025 | Actual Budget Documentation"
description = "Actual Budget is a powerful and open-source tool for managing personal finances. In this article - I recount my personal experience transitioning from YNAB to Actual and how I helped to build the community of volunteers. We also briefly talk about plans for 2025 and I address some frequent statements seen on the internet."
full_description = '''Roadmap for 2025January 2, 2025 · 7 min readMatiss Janis AboltinsActual Budget MaintainerActual Budget is a powerful and open-source tool for managing personal finances. In this article - I recount my personal experience transitioning from YNAB to Actual and how I helped to build the community of volunteers. We also briefly talk about plans for 2025 and I address some frequent statements seen on the internet.My Journey to Actual Budget​Over a decade ago I began my personal finance journey. Tried various different products and budgeting methodologies available at the time, but nothing really stuck. Until I found YNAB. Finally, something that helped me create and stick to a budget, and the community was really helpful as well. It felt great. I was one of their old-time customers on the "legacy" plan which did not see the price increases. That is - until 2021 when the trust of old-time customers was broken and we saw almost a 100% price increase. Even though the product was amazing - I could not justify spending as much of my disposable income on it. This made me look for alternatives.Actual Budget enters the scene. In early 2022 James, the creator of Actual Budget, decided to close-down the commercial product and open source it. When I learned about this - I quickly jumped at the opportunity to transition to Actual before my YNAB subscription expired. Actual was not as feature-complete as YNAB, but it did the job for a fraction of the cost. It was a no-brainer for me.Initially there was a lot of buzz around Actual with developers and other folks quickly joining the project and helping out, but this initial push died down. The PRs were stuck waiting for a review for months with nobody around to review them. The Discord community slowly got less active. But - there was a small group of people that saw the tremendous value in this software.We bonded together and convinced James to give us access to the core repositories. After that we were able to start reviewing and merging the backlog of all the PRs with bug-fixes and improvements. We had roughly 50 open PRs at that stage and my personal goal was to get it down to 20 and keep it there. I never reached this number as more PRs came in when the previous ones got closed. It's was both a blessing and a curse. The community was clearly eager to help out and improve the product, but reviewing all the changes was time-consuming.At this stage I started building a bigger core maintainer team - recruiting some of the most active members of the community. There was no reward, no salary or benefits I could offer. But still - people were willing to volunteer their time, knowledge and experience to help build Actual. I am incredibly thankful and humbled by this.The core team has been constantly changing and evolving. New folks join the team and help build the software; older team members leave as other things in their lives take priority (work, personal life, etc). However, the core principles of Actual have not changed since day 1.Today - the community discord has over 7'000 members. We see thousands of users of Actual on PikaPods and upwards of a million docker container clones per month.I'm happy to have led Actual to where it is today and I hope to remain a small part in its future too. In the short-term I will be taking a step back from actively leading the product due to a baby on the way. I'm proud of the core maintainer team we have today and I am confident in their ability to run the product!A look to the future​2025 will be a very interesting year for Actual. There are many features in the works that will be released this year and with the growth trajectory of Actual - I'm sure we will see many more. Including improvements to the existing systems: more features in mobile, improvements with tagging and filtering, more tailored dashboards and reports.Some of the bigger features coming in 2025 are:Multi-user support: running a single instance of Actual for your personal use is relatively easy. But what if you want to share it with your family members? So far the recommended approach was to create multiple budget files with different e2e encryption keys, but that is more of a workaround than a proper solution. In 2025 we plan on releasing a proper multi-user system that allows multiple people to use the same Actual instance.OpenID authentication: logging in with a password is clunky. Ideally you should be able to put Actual behind a 3rd party authentication protocol and use it as the login method. OpenID authentication support plans to address this. Currently an experimental feature and coming as a first-party feature in early 2025.Translations: a highly-requested feature - to allow translating Actual in Spanish, Portuguese, French and many other languages. The groundwork for the translation system has already been placed. Individual files are also slowly being moved over to be localized. You can follow the progress here.Plugin system: by default we want to keep Actual rather minimalistic with an opinionated recommended budgeting approach. However, this does not fit everyone's needs. This is why I am particularly excited about a plugin system that would allow engineers from the community to write smaller extensions to Actual that can be easily installed. They change and/or extend the existing functionality to facilitate all sorts of edge-case behaviors that are not planed in the core offering.I'm sure there will be many more great additions, but quite honestly - it's hard to say what exactly. It really is up to you - the community - to propose improvements and then also build them out. Me and the rest of the maintainer team are here to assist as best as we can.Ps​I see some comments on the internet that I would like to address in a unstructured way.Is Actual Budget a competitor to YNAB?Personally: I don't see it that way. I have always spoken very fondly of YNAB. The software they have built is phenomenal. If I was much wealthier - I would definitely continue using it. However, I'm not in such a position.As such - I think even though Actual and YNAB both follow the envelope budgeting methodology - we cater to two different markets. And as such - I don't see us as "competing".Is Actual Budget advertising on Reddit (or other platforms)?No.We do not make any money off of this - our work for Actual is charityWe do not intend to make money off of ActualIf you are still not convinced - please see the expenses in our Open Collective page - you will not find any advertisement expense thereActual Budget is freeNot necessarily true. While the users of Actual might not need to pay to use the product - there is still a very high cost to it. It's just someone else paying the bill.And in this case the bill is not strictly monetary. Maintaining any piece of software is a very time and labor intensive work. So while it might be "free" for you to use - there are many invisible volunteers paying the cost with their time.Which leads me to the next point: please show some appreciation to these folks.Why was my Github issue closed?My philosophy to managing Actual has been quite simple: core maintainer time is limited. Thus - reducing the amount of distractions to the core maintainers takes priority.How can I support the project?contribute - fix issues, add features, write documentation, assist with support queries in discord, etc.donate to the project via Open Collectivesome of the core maintainers have github sponsors enabled if you want to buy a beerTags:announcementEdit this page'''
author = "Matiss Janis AboltinsActual Budget Maintainer"
year_published = 2025
clearnet = "https://actualbudget.org/blog/roadmap-for-2025"
tags = ["actual", "advertising", "announcement", "authentication", "budget", "budget​", "build", "closed?", "community", "competitor"]
