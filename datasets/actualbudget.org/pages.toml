title = "Budget Templates | Actual Budget Documentation"
description = "This is an experimental feature. That means we’re still working on finishing it. There may be bugs, missing functionality or incomplete documentation, and we may decide to remove the feature in a future release. If you have any feedback, please open an issue or post a message in the Discord."
full_description = '''Using ActualExperimental featuresBudget TemplatesOn this pageBudget TemplatesdangerThis is an experimental feature. That means we’re still working on finishing it. There may be bugs, missing functionality or incomplete documentation, and we may decide to remove the feature in a future release. If you have any feedback, please open an issue or post a message in the Discord.dangerAll functionality described here may not be available in the latest stable release. Use the edge images for the latest implementation.Budget templates allow you to automate your budgeting step every month. For example, a template like #template 100 in a Food category will automatically budget $ 100 in your Food category when templates are run. With budget templates there is no need to manually fill in each category each month. With one click you can fill in your entire budget based on the templates you have added.Here are a few examples of what you can do with templates, all with a single click!Budget $ 100 every monthBudget $ 50 every other weekRefill a category to $ 300 at the start of a monthAdd all leftover funds to a savings categoryBudget 10% of your income for savings or a titheBudget the average you spend over the last 6 monthsSave up for a big purchase many months in the future, and dynamically figure out the budget needsAnd much more!Using Templates​How to add a template​Create a template by adding a note to a category and adding a line that contains #template or #goal with the appropriate syntax. The example below shows the most basic template syntax #template 72.99. This will budget $ 72.99 when templates are run without having to manually type in the amount.<img style="position:absolute;top:0;left:0" src="/assets/ideal-img/goal-template-1.605553e.275.png" srcset="/assets/ideal-img/goal-template-1.605553e.275.png 275w" width="275" height="103">How to apply the templates​Apply all templates​In the budget month menu you will see the following options:<img style="position:absolute;top:0;left:0" src="/assets/ideal-img/goal-template-2.398c11e.299.png" srcset="/assets/ideal-img/goal-template-2.398c11e.299.png 299w" width="299" height="238">Check templates will test all #template and #goal lines for proper syntax.Apply budget template will run all templates in categories that currently have 0 budgeted. This will leave any existing budget amounts intact.Overwrite with budget template will fill in all budget cells using the templates and ignore any already existing budget amounts. This is the recommended method if you are using template priorities.Apply only specific templates​You can also apply selections of templates if you want.Single Category: Use the "Apply budget template" option shown below from the budget field drop down to apply templates to just that category. This will overwrite any existing budgeted amount.<img style="position:absolute;top:0;left:0" src="/assets/ideal-img/apply-template-category.50c33b8.355.png" srcset="/assets/ideal-img/apply-template-category.50c33b8.355.png 355w" width="355" height="264">Apply templates to a single category group: Use the "Apply budget templates" option shown below from the category group drop down to apply all templates to categories in a specific group. It will apply to the month furthest to the left in your budget view if viewing multiple months. This will overwrite any existing budgets in the categories in the group.<img style="position:absolute;top:0;left:0" src="/assets/ideal-img/apply-template-group.06f6906.257.png" srcset="/assets/ideal-img/apply-template-group.06f6906.257.png 257w" width="257" height="242">Goal Indicators​After having run the templates in a given month and category, the status of a respective category goal will be indicated as a text color of the category balance. The image below shows an example of categories in the following states: normal (no goal set), empty (no goal set), goal met(green), goal not met(orange), and a negative balance(red).<img style="position:absolute;top:0;left:0" src="/assets/ideal-img/templates-colors.407fb4e.701.png" srcset="/assets/ideal-img/templates-colors.407fb4e.701.png 701w" width="701" height="169">Goal Indicator Information​If you hover over the balance value in a templated category, a tooltip will appear with info on the status of that category with respect to its template.<img style="position:absolute;top:0;left:0" src="/assets/ideal-img/goal-indicator.c48f7e6.207.png" srcset="/assets/ideal-img/goal-indicator.c48f7e6.207.png 207w" width="207" height="142">Multiple Template Lines​You can add multiple #template lines for a single category note. Each line will be added together.For example:Streaming Services: 42.97Netflix#template 24.99Disney Plus#template 9.99Amazon Prime#template 7.99100 every month and an additional 10 every fortnight#template 10 repeat every 2 weeks starting 2025-01-04#template 100Template Priorities​Templates can be given a priority flag to change the order that the templates get applied to your budget. Set a priority by adding -X to the #template flag. EX #template-4 will be priority level 4. Any template with a priority other than 0 will not apply more funds than are available.Notes on Priorities​Lower priority values get run first. EX 0 is run first, then 1, then 2, etc.A #template with no priority flag defaults to priority 0 and is the same as a standard template.Negative priorities are not allowed and will result in the template being skipped.Template application order is based on the database order, not the view order. To guarantee a specific fill order use separate priorities for each category.If you have multiple schedule or by template lines in a single category, they will be forced to match the same priority level as the line run first.It is recommended to use the "overwrite with budget template" option when applying templates if you use priorities.Expected budgeted amount is 200 Expected maximum category balance is 200#template 300#template-1 150 up to 200Expected budgeted amount is 450 No maximum category balance exists#template 150 up to 500#template-1 300Notes on all templates​All templates are a single line in the category notes. Depending on your screen size, they may visually render as multiple lines. When adding a template, do not put a return (or "enter") within a single template, or the parsing will not properly handle your template.Don't add a currency symbol to your template amounts.Number formats that use comma for the decimal separator are not supported (e.g., 123,45). You must use 123.45.Thousands separators are not supported (e.g., 1,234). You must use 1234.By default, templates do not consider available funds when being applied. Use template priorities to ensure only the amount available to budget is assigned.Available Templates​There are many types of templates you can use to tailor how categories get filled to match your personal budgeting needs.Simple Type​The simple template type is the most basic type of template. The base template will budget the amount you ask it to. Simple! This template also has a few variations making it likely the most used template out of the available options.Below is an example of how it works. The template budgets just what you ask, no matter how much the respective category has in its balance.SyntaxBudgeted Amount#template 50$ 50There is also a useful variation of a simple template. This variation will put a limit on how much the balance of a category can be that month. Here are some examples of how this is usedSyntaxPrevious BalanceBudgeted AmountNew Balance#template 50 up to 100$ 80$ 20$ 100#template 50 up to 100$ 20$ 50$ 70Isn't that neat! This is especially useful for budget categories that have month to month variation in spending such as groceries. You can budget the same amount per month, but save up from one month to the next without having to worry about building up more funds than you need.The last variation of the simple template is sometimes referred to as a "refill". With this style the template budgets whatever it takes to hit a "full" amount. Here is how it works:SyntaxPrevious BalanceBudgeted AmountNew Balance#template up to 150$ 10$ 140$ 150#template up to 150$ -20$ 170$ 150Cool, right! This is another way to gracefully handle categories that have month to month variation. This will always give you the same amount available each month no matter what you spend the previous month and not ever build up more funds than you need. This variation along with the previous variation, are probably the most used templates. They are simple enough to use easily, but are robust enough to make budgeting much simpler.Notes:A single category with two templates that use up to is not supported.If any single template contains an up to, the whole category will be subject to that limit even if there are later templates and priorities. This excludes remainders which will run after the limit is applied.All Variations​There is more flexibility with the limit part of the template. By default, the limit (the "up to" part of the template) is based per month. You can modify the limit to be per week or per day if that matches your needs better. You can also modify the limit to not ever remove funds over your limit. This can be useful if you get refunds or reimbursements that you would like to have remain inside a category even if over your limit. Below is examples of these different variations of simple templates.SyntaxDescriptionExample Application#template 50Budget 50 each monthRegular monthly bills, such as internet#template 50 up to 300Budget 50 each month up to a maximum of 300Funding rainy day categories, such as replacement shoes and bicycle repairs#template up to 150Budget up to 150 each month, and remove extra funds over 150Variable expenses, such as petrol and groceries#template up to 150 holdBudget up to 150 each month, but retain any funds over 150Variable expenses that may get refunds or reimbursements#template up to 5 per dayBudget up to 5 per day that month, and remove extra fundsSetting a daily coffee budget#template up to 100 per week starting 2024-10-07Budget 100 per week starting on Mondays, and remove extra fundsSetting a weekly grocery budgetBy Type​The By type of template is for saving up funds by a certain month. For example, it is January and you are trying to save for a new car by the end of the year. If the new car will cost $ 10,000 and you plan to buy it in December, you will use something like the following:SyntaxBudgeted Amount#template 10000 by 2025-12$ 833.33That example is pretty basic. The by template is smarter than just 10000/12. Lets say the example is the same, but you already have $ 1,500 saved. In that case you get this.SyntaxPrevious BalanceBudgeted AmountNew Balance#template 10000 by 2025-12$ 1,500$ 708.33$ 2,208.33Nice! This even works if you add more funds later. The template will always divide up the remaining amount you need by the remaining number of months. If you need to pull funds away from your car savings to cover an emergency house repair, the template will budget more in the coming months to say on track. If you have extra funds one month and add that to your car savings, the template will budget less in the coming months since you need less.Note: The date must be in YYYY-MM format.Repeated savings​The By template can also repeat if your savings is cyclical, such as yearly taxes or insurance. The repeat period can be both a number of months or number of years. If you need to repeat based on a number of weeks, use the Week template. In that case use the following variation:SyntaxBudgeted AmountNote#template 500 by 2025-03 repeat every year$ 166.66Assuming starting in January 2025#template 500 by 2025-03 repeat every year$ 41.66All months after March 2025By Spend​The By template can be extended to allow some of the funds to be spent along the way. This is most commonly used for holiday savings where you will spend some of the money in the months leading up to the holiday. An example of this is buying Christmas gifts in November and December. The table below shows how this works.SyntaxBudgeted AmountSpent so farNew BalanceNote#template 500 by 2025-12 spend from 2025-11$ 41.660previous + $ 41.66Assuming starting in January 2025, all months before December#template 500 by 2025-12 spend from 2025-11$ 41.66$ 100$ 400Assuming the beginning of December, but have not spent anything in December yetAvailable Variations​Below is a table of the variations of the By template.SyntaxDescriptionExample Application#template 500 by 2027-03Break down large, less-frequent expenses into manageable monthly expensesSaving for a replacement car in a few years#template 500 by 2025-03 repeat every 6 monthsBreak down large, less-frequent expenses into manageable monthly expensesBiannual credit card fees#template 500 by 2025-03 repeat every yearBreak down large, less-frequent expenses into manageable monthly expensesAnnual insurance premium#template 500 by 2025-03 repeat every 2 yearsBreak down large, less-frequent expenses into manageable monthly expensesDomain name renewal#template 500 by 2024-12 spend from 2024-03Budget 500 by December. Any spending between March and December is OK.Christmas presents, overseas holiday, or any other expenses that I will be partially paying for before the target period ends.#template 500 by 2024-12 spend from 2024-03 repeat every year#template 500 by 2024-12 spend from 2024-03 repeat every 2 yearsWeek Type​If you have bills that cycle weekly, or like to base your budget on weeks, this is the template for you! This template is like the simple template but it uses weeks instead of months. You set the start day, and every 7 days starting from that day, you will get the requested amount budgeted. See the table below for examples.SyntaxBudgeted AmountNote#template 10 repeat every week starting 2025-01-06$ 40When budgeting in January 2025#template 10 repeat every week starting 2025-01-06$ 50When budgeting in March 2025As you can see, the template will budget based on the number of weeks that start on the desired day, starting on your start date.The Week template also supports limits the same way the simple template does. For example if you budget in January with limited template:SyntaxPrevious BalanceBudgeted AmountNew Balance#template 10 repeat every week starting 2025-01-06 up to 55$ 20$ 35$ 55Notes:The date must be in YYYY-MM-DD format.A single category with two templates that use up to is not supported.If any single template contains an up to, the whole category will be subject to that limit even if there are later templates and priorities. This excludes remainders which will run after the limit is applied.Available Variations​Below is a table of the variations of the Week template.SyntaxDescriptionExample Application#template 10 repeat every week starting 2025-01-03Budget 10 a week#template 10 repeat every week starting 2025-01-03 up to 80Budget 10 a week, up to a maximum of 80#template 10 repeat every 2 w'''
year_published = 2025
