title = "Release 24.10.0 | Actual Budget Documentation"
description = "New release of Actual."
full_description = '''Release 24.10.0October 3, 2024 · 8 min readMatiss Janis AboltinsActual Budget MaintainerThe release has the following notable improvements:SimpleFIN officially released as first-party featureColor themes: ability to set "system default" color themeMobile: button to view uncategorized transactionsPrivacy mode: instead of blurring use an unintelligible fontExperimental dashboards: ability to save cash-flow, net-worth and spending report filters and date-ranges.Important notice about the @actual-app/api package: starting from this release the versioning strategy of the API package will align with the web & server: {year}.{month}.{patch-version}.Docker tag: 24.10.0Actual​Features​#3325 Add setting to set preferred dark theme for "System default" mode — thanks tim-smart#3326 Add an uncategorized transaction button to the mobile app. — thanks tim-smart#3459 SimpleFIN is officially released as a first-party feature of Actual. — thanks MatissJanisEnhancements​#3085 Show undo notifications when applying goal templates / budget actions in mobile. — thanks joel-jeremy#3119 Auto notes in month notes when reassigning budgets. — thanks joel-jeremy#3288 Dashboards: text widget support. — thanks Matissjanis#3298 Implement greater visibility and accessibility on popover menus and tooltips. — thanks VoltaicGRiD & psybers#3313 Support translations in desktop-client/components/schedules. — thanks psybers#3332 Set html theme-color meta tag to match the webmanifest theme_color. — thanks tim-smart#3344 Adjust mobile header link style — thanks tim-smart#3364 Dashboards: ability to save filters & time-range on net-worth widgets. — thanks MatissJanis & carkom#3377 Privacy mode: instead of blurring, use an illegible font (#3376) — thanks olets#3380 Fixing spending report header so that any month can be compared to any other month. Also adds budget as an optional comparison. — thanks carkom#3400 Update splash background to match theming — thanks jfdoming#3411 Undoable auto transfer notes + auto notes for cover — thanks joel-jeremy#3417 Dashboards: ability to save filters & time-range on cash-flow widgets. — thanks MatissJanis#3432 Dashboards: ability to save filters & time-range on spending widgets. — thanks MatissJanis#3451 Fixing display issues in spending report and adding a legend. — thanks carkomBugfix​#3286 Forcibly reload app when API request is redirected. This fixes issue #2793 — thanks TimQuelch#3356 Fix incorrect hook usage in #3277 — thanks matt-fidd#3374 Mobile - Fix budget cells being triggered when pulling down to refresh on budget table. — thanks joel-jeremy#3379 Fix report header validateStart bug. — thanks carkom#3389 Prevent keyboard shortcuts modal launching when entering shortcut into editable field. — thanks MikesGlitch#3399 Fix regression in case sensitivity for is/matches operator — thanks jfdoming#3412 Sort suggested payee popup section by favorite status first, then alphabetically. — thanks qedi-r#3441 Fix account filters being overridden. — thanks MatisJanis#3453 Fix react-aria-components Button hover styles — thanks joel-jeremy#3456 Fix csv import deduplication #3416 — thanks UnderKoen#3460 SyncedPrefs: fix import prefs not reading correctly. — thanks MatisJanis#3462 Fix save report forms submit handler so that it doesn't trigger a reload of an entire page on submit. — thanks joel-jeremy#3463 Mobile - Do not allow renaming category or group to an empty name. — thanks joel-jeremy#3469 Reports - deleting custom reports should remove the widget from the dashboard. — thanks MatissJanis#3472 Fix privacy filters not activating — thanks joel-jeremy#3478 CSV import - fix checkboxes not working. — thanks MatissJanis#3480 Fix 'matches' operator incorrectly matching empty strings. — thanks qedi-r#3484 Custom reports - fix opening table reports crashing the page. — thanks MatissJanis#3487 Fix modals not opening on mobile budget view — thanks tim-smart#3491 Fix mobile page header button styles. — thanks joel-jeremy#3492 Fix mobile balance modal not properly coloring balance. — thanks joel-jeremy#3495 Removes whitespace from both ends of the category name — thanks junyuanz1#3501 Fix typo in README for Actual Budget Github homepage — thanks Jonathan-Fang#3509 Fix desktop popover showing in mobile To Budget options. — thanks qedi-r#3510 Fix templates and syntax check running on deleted categories — thanks youngcw#3515 Fix GoCardless linking (account selection window not appearing) — thanks EtaoinWu#3535 Fix balance carryover arrow on Firefox — thanks MikesGlitch#3539 Fix error when creating a rule from an existing transaction — thanks matt-fidd#3540 BankSync: fix showing sync status after linking and close all modal stack. — thanks MatissJanis#3541 Fix import crashing if the QFX file is malformed. — thanks MatissJanisMaintenance​#3163 Use new react-aria-components in common and mobile components. — thanks joel-jeremy#3277 Support translations in desktop-client/components/accounts. — thanks matt-fidd#3311 TypeScript: migrate Account component. — thanks MatissJanis#3352 Support translations in Translation support for desktop-client/src/components/budget/BalanceWithCarryover.tsx — thanks nmathey#3355 TypeScript: migrate Reconcile file. — thanks MatissJanis#3361 TypeScript: RSchedule types fixed — thanks UnderKoen#3363 Support translations in desktop-client/components/budget. — thanks agradina#3367 Support translations in Translation support for desktop-client/src/components/budget/BudgetTotals.tsx — thanks nmathey#3391 Refine Menu/Select types to allow broader types for the value/name attribute — thanks jfdoming#3393 Prevent sidebar from saving to metadata.json unnecessarily — thanks MikesGlitch#3394 Remove unneeded Payee typeahead console log — thanks MikesGlitch#3395 SyncedPrefs: refactor pref values from explicit types to string. — thanks MatissJanis#3396 Convert RecurringSchedulePicker.jsx -> RecurringSchedulePicker.tsx — thanks jfdoming#3397 SyncedPrefs: refactor usages of number formatter away from redux. — thanks MatissJanis#3398 Prevent sync from saving to metadata.json unnecessarily — thanks MikesGlitch#3401 Use react-aria-components' Button in filters. — thanks joel-jeremy#3406 Adding retries into filesystem calls to mitigate locking issues caused by virus scanners. — thanks MikesGlitch#3408 SyncedPrefs: refactor ImportTransactions usage of prefs to use a common hook. — thanks MatissJanis#3410 SyncedPrefs: move budgetType back to metadata prefs. — thanks MatissJanis#3413 Complete migration of all modals to react-aria-components Modal component. — thanks joel-jeremy#3423 SyncedPrefs: move synced-preferences from metadata.json to the database. — thanks MatissJanis#3426 Support translations in desktop-client/components/budget. — thanks a-gradina#3427 SyncedPrefs: move budget type to synced preferences. — thanks MatissJanis#3430 Support translations for component files — thanks a-gradina#3431 Restart server silently when adding self signed cert and add some logs — thanks MikesGlitch#3443 Reduce size of desktop packages — thanks MikesGlitch#3448 Reduce budget table re-renders — thanks joel-jeremy#3450 Cleanup react-aria packages and dedupe packages. — thanks joel-jeremy#3452 Update synced account balance in db if available — thanks matt-fidd#3458 SyncedPrefs: separate out MetadataPrefs and LocalPrefs in different storage locations. — thanks MatissJanis#3468 Remove old updater logic — thanks MikesGlitch#3475 Replacing the deprecated Electron file handler protocol with the new version — thanks MikesGlitch#3483 File/variable renames: rollover budget -> envelope budget; report budget -> tracking budget. — thanks MatissJanis#3493 Custom reports: added e2e tests to improve stability. — thanks MatissJanis#3497 Fix running yarn vrt:docker on windows with git bash — thanks UnderKoen#3498 e2e: improve rules test stability. — thanks MatissJanis#3503 e2e: improve onboarding test stability. — thanks MatissJanis#3512 e2e: improve rules test stability. — thanks MatissJanis#3513 e2e: improve settings test stability. — thanks MatissJanis#3514 Add category goal info to the budget prewarm list for faster loading of indicator colors. — thanks youngcw#3521 Cleanup: Set theme-color at App level instead of per page — thanks joel-jeremy#3523 e2e stability: wait for data-theme to switch before taking a screenshot — thanks joel-jeremy#3525 Expose underlying exception source when a module fails to load. — thanks qedi-r#3526 Fix electron build workflow for ubuntu-latest — thanks matt-fidd#3530 [e2e] Fix the flaky "navigates back to start page by clicking on “no server” in an empty budget file test" from onboarding.test.js — thanks joel-jeremyActual Server​Enhancements​#384 Sync multiple accounts in a single SimpleFIN API call. — thanks psybers#449 Add "Banco ActivoBank" (PT) to list of banks with limited history — thanks mtrocadomoreira#452 added REVOLUT_REVOLT21 & VUB_BANKA_SUBASKBX to banks with limited history — thanks molnart#454 Add integration of Rheinhessen Sparkasse (SPK_WORMS_ALZEY_RIED_MALADE51WOR) to the GoCardless app — thanks DirgoSalga#455 Add support for ABANCA_CAGLPTPL payee name — thanks matt-fidd#459 Add support for Bizum transactions in Revolut — thanks hostynBugfix​#445 Fix BancSabadell payee name based on the transaction amount — thanks davidmartos96#448 Fix pending purchases amount sign and payee name for National Bank of Greece import — thanks mezger6#451 Fix wrong payeeName used for CBC_CREGBEBB — thanks MMichotteMaintenance​#465 Fix typo in GoCardless Error type — thanks matt-fidd#471 Update feature request link in github issues. — thanks MatissJanisTags:announcementreleaseEdit this page'''
