["https://actualbudget.org/docs/actual-server-repo-move"]
title = "Actual Server repository move | Actual Budget Documentation"
description = "In February 2025 the actual-server repository will be merged into the Actual repository."
full_description = "Help & SupportActual Server repository moveOn this pageActual Server repository moveIn February 2025 the actual-server repository will be merged into the Actual repository.The reasons for this change are as follows:Streamlines Development: Developers will only need to clone/sync one repo instead of two.Improves Debugging: It makes end-to-end debugging for server/client easier as they will be in the same workspace.Simplifies Desktop App Packaging: Enables the desktop app to embed the sync server.Ensures code consistency and reduces the maintenance burden.Simplifies the release processQuestions:​Q. I use Docker Hub/Github's container registry, how do I stay up to date?A. We will continue to push images to Docker Hub and Github's container registry as usual.Q. I build the docker image locally, can I still do that?A. All of the docker files are still available. To build the sync server locally you can use the sync-server.Dockerfile located in the root of the repository. The docker-compose.yml is located in the /packages/sync-server directory.Q. I use the Local Installation. How do I keep up to date?A. Follow these instructions:Clone the Actual repository. You can use the following command:git clone https://github.com/actualbudget/actual.gitNavigate to the Actual project root directory:cd actualInstall the required dependencies for the server:yarn workspaces focus @actual-app/sync-server --productionIf you have a config.json file you will need to copy it into the following directory:packages/sync-serverCopy over the data from your actual-server directory (user-files, server-files, and .migrate) into the packages/sync-server directory.Run the server with:yarn start:serverEdit this page"
year_published = 2025
