full_description = '''IntroductionOn this pageIntroductionWelcome to Actual’s documentation! This page provides you a quick introduction to Actual Budget and will help you navigate to the documentation to learn more about Actual.Where to Begin?​If you're new to Actual, but do not know where to start, please consult the roadmap for new users.You can also try to install Actual on a computer to start. After installation, check out the Tour of Actual for a high-level overview of how Actual works. The next step is to read our Starting Fresh guide. Then we suggest dive into the more detailed documentation, check out the “Using Actual” section in the left menu.For help and support, reach out to the maintainers and community.Want to Contribute?​If you'd like to contribute to the Actual Budget's documentation, click "Edit this page" to contribute. We recommend you to go through the prerequisites You can contribute to the documentation by clicking the “Edit this page” link at the bottom of any page. We also recommend you to check out documentation standard, local setup, and guidelines on using images and screenshots from here.Edit this page'''
