["https://actualbudget.org/contact"]
title = "Contacting Us | Actual Budget Documentation"
description = "Actual is an open source app, which means that nobody is being paid to work on it, and everything is happening in our free time. Please keep that in mind when asking us for help :)"
full_description = "Contacting UsnoteActual is an open source app, which means that nobody is being paid to work on it, and everything is happening in our free time. Please keep that in mind when asking us for help :)We are happy to help out with any issues you encounter with getting Actual running or using it. There are a few ways to get help:For questions about installing or using Actual, join our Discord and make a new post in the #support channelIf you’d like to report a bug or request a feature, open a new issue on GitHub. If you don’t have a GitHub account, you can create one for free. Alternatively, you can post a message in Discord and we can create the issue for you.If you see a problem with this documentation website, you can click the “Edit this page” button at the bottom of the page in question and then click the “edit” button on the GitHub page that opens to make edits directly from your browser. (See a step-by-step guide here). If you don’t have a GitHub account, it’s free to create one, or you can tells us about the problem in Discord and we can make the edit for you."
