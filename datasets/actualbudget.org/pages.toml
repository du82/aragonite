full_description = '''Release 25.2.0February 5, 2025 · 8 min readJulian Dominguez-SchatzActual Budget MaintainerThe release has the following notable improvements:Upcoming schedule length officially released as first-party featureAbility to switch the interface language, with experimental support for the nl, pt-BR, uk, and en-GB localesAbility to disable category learningCombined account view on mobileDocker tag: 25.2.0Actual​Features​#4112 Add language setting — thanks jfdoming#4141 Add sorting options to custom reports — thanks matt-fidd#4173 Release schedule upcoming length adjustment — thanks matt-fidd#4206 Add option for custom upcoming length — thanks SamBobBarnesEnhancements​#3734 Add navigation to combined-accounts transactions lists from the accounts page on mobile. — thanks GabeKlavans#3805 Enables rule activation from the account view via dropdown menu or by pressing 'R' — thanks esseti#4019 Add "Year to date" and "Last year" to reports header. — thanks rodriguestiago0#4032 Allow note prefixes in budget templates. — thanks UnderKoen#4072 Sort bar chart data — thanks matt-fidd#4081 Added ability to control category learning per payee and globally — thanks NullScope#4089 Include translations in builds — thanks jfdoming#4096 Add Copy last 6/12 months to budget menu. — thanks psybers#4097 Do not show undo/redo notifications on desktop. — thanks psybers#4129 Add ability to provide default cleared status in the API and skip updating the cleared status on subsequent imports. — thanks NikxDa#4159 Display transaction notes on mobile, fixes #1764 — thanks DarkWolfSLV#4164 Move upcoming schedule length setting — thanks matt-fidd#4166 Show all occurrences of upcoming schedules within the upcoming period — thanks matt-fidd#4168 Improve one month schedule upcoming length and introduce current month option — thanks matt-fidd#4180 Add option to complete non-recurring schedules from transaction menu — thanks matt-fidd#4181 [Mobile] Show undo notification when updating category budget. — thanks joel-jeremy#4216 Extend "fix splits" to also fix transfers that have categories and should not. — thanks youngcw & UnderKoen#4243 Add new helpers to rule action templating — thanks UnderKoen#4276 Show sorting of reports on the dashboard — thanks UnderKoenBugfix​#3998 Usage of notes is (nothing) on new transactions — thanks UnderKoen#4033 Change net bar graph to show actual net values — thanks UnderKoen#4051 Fixing report crash when filters have an "any" clause selected and all conditions are deleted. — thanks douugdev#4075 Fix to ensure that the toolbar's server status updates correctly during synchronization — thanks p-payet#4099 Fix resulting wrong name when creating a new payee in rule with the condition set to "one of" — thanks sveselinovic#4120 Fixed stacked templates with priorities — thanks youngcw#4130 Fix translations missing from preview deploys — thanks jfdoming#4149 Fix string upload if new changes are present — thanks jfdoming#4151 Remove code injection in /update-vrt workflow — thanks UnderKoen#4161 Fix payees autocomplete not reflecting new name of a renamed account (under the Transfer To/From section) — thanks joel-jeremy#4162 Fix inconsistent legend coloring in custom reports — thanks matt-fidd#4167 Improve translation string punctuation in reports — thanks jfdoming#4171 Fix schedule actions not applying and schedules paid today not showing — thanks matt-fidd#4175 Add a missing space between the category name and "is" in the category deletion popup. — thanks sampellino#4182 Fix amount input requiring two clicks on safari mobile — thanks MatissJanis#4185 Fix i18n language fallback for regional languages — thanks jfdoming#4186 Fix various split transaction edits not working — thanks jfdoming#4188 Fix paid schedules showing as upcoming in the account — thanks matt-fidd#4190 Fix rounding of split rules — thanks jfdoming#4194 Fix Spending Report category filters when comparing to Budgeted — thanks CertifiKate#4195 Fix schedule bug crashing API — thanks matt-fidd#4196 Fix app hanging when schedule moved before weekend — thanks matt-fidd#4199 Fix upcomingLength type mismatch in getStatus — thanks SamBobBarnes#4200 Fix FocusableAmountInput's onUpdate to only fire when amount was updated — thanks joel-jeremy#4222 Fix notifications when applying to a single category — thanks youngcw#4225 Fix persistent split error popover — thanks matt-fidd#4246 Hide to budget tooltip when menu is open — thanks UnderKoen#4255 Allow child transactions to have different transfer payees — thanks jfdoming#4256 Fix first occurrence of some schedules moved after the weekend not showing in preview — thanks matt-fidd#4265 Fix schedule templates sometimes budgeting wrong amounts — thanks youngcw#4266 Make password login page more mobile responsive — thanks matt-fiddMaintenance​#3583 Mobile budget menu modal e2e tests — thanks joel-jeremy#3964 TypeScript: move ScheduleDetails to tsx. — thanks MatissJanis#3993 Migrate to ESLint v9 — thanks matt-fidd#4000 Phase 1 - Migrate to modern redux toolkit APIs — thanks joel-jeremy#4012 Phase 2 - Redux Toolkit Migration - accounts slice — thanks joel-jeremy#4016 Phase 2 - Redux Toolkit Migration - queries slice — thanks joel-jeremy#4018 Phase 2 - Redux Toolkit Migration - app slice — thanks joel-jeremy#4041 Improve translation strings and update some wording — thanks matt-fidd#4047 TypeScript: Refactor Accounts/Balances to tsx and Remove ts-strict-ignore from Accounts/Account — thanks tlesicka#4061 Refactoring the mobile TransactionListWithBalance component into typescript — thanks leoltl#4063 Refactoring the mobile TransactionList component to typescript — thanks leoltl#4083 Remove unused report prop from Link component. — thanks MatissJanis#4085 Remove unused permission prop from Button component. — thanks MatissJanis#4086 Refactor theme variable to be statically defined. — thanks MatisJanis#4105 Mark releases as draft by default — thanks jfdoming#4108 TypeScript: ported transactions