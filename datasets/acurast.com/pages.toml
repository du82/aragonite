full_description = "Get the Processor Lite app from the Google Play or Apple App store. On Android you can create your Android Work Profile for improved security and separation from your apps. Open the Processor Lite app, you can even do it while you sleep, to provide compute and earn rewards. It’s as easy as scanning a QR code to setup your factory reset phone.Within 3 minutes the device is onboarded as a Processor. Run your Processor, connected to the internet, for a month and earn up to 250 cACU in bootstrapping rewards. You will earn a fraction of the full reward each hour. Developers that deploy to the Acurast Cloud provide a reward for the compute power used. When your Processor has been selected, you’ll receive part of that reward. Become a Rebel and cloud-harvest MIST (points) by completing quests, onboarding Processors, and inviting others to join the Rebellion."
