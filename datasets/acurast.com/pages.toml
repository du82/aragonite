title = "Privacy Policy - Acurast"
description = "Join Acurast as a Processor: Earn Rewards while Providing Processing Power! Transform your old or damaged mobile phone into part of the decentralized Cloud."
full_description = "PRIVACY POLICY FOR OUR WEBSITESAcurast Association is committed to protecting and respecting your personal data. In the event that you send us any of your personal data, we are committed to collecting, maintaining, and securing personal data about you in accordance with our internal data protection policies and local laws. Please note; Hypergate and AirGap are registered trademarks of the Acurast Association.Who we are. Acurast Association is the Controller (for the purposes of the GDPR) of your Personal Data (referred to as either “Acurast Association”, “we”, “us” or “our” in this Privacy & Cookies Policy). Our address is:Acurast AssociationBaarerstrasse 436300 ZugSwitzerland Our EU Representative. As we do not have an establishment in the European Union (“EU”), we have appointed a representative based in the European Union, who you may address if you are located in the EU to raise any issues or queries you may have relating to our processing of your Personal Data. Our EU representative is:PrighterGDPR-Rep by Maetzler Rechtsanwalts GmbH & Co KGc/o Acurast AssociationSchellinggasse 3/101010 ViennaAUSTRIA Our EU representative can be contacted by completing the form here: https://prighter.com/q/162739535591. GENERAL INFORMATION ON DATA PROCESSING Scope of the processing of personal dataWe process the personal data of our users only to the extent necessary to provide a functioning website as well as our content and services. The processing of personal data of our users takes place regularly only with the consent of the user. An exception applies in those cases in which it is not possible to obtain prior consent for factual reasons and the processing of the data is permitted by applicable law.In order to protect the security of your data during transmission, we use encryption procedures (e.g. SSL) via HTTPS. Our servers are protected by a firewall and virus protection. Back-up and recovery procedures as well as role and authorization concepts are a matter of course for us.Legal basis for the processing of personal dataInsofar as we obtain the consent of the data subject for processing personal data, Art. 6 Para. 1 lit. a EU Data Protection Basic Regulation (GDPR) serves as the legal basis.Art. 6 para. 1 lit. b GDPR serves as the legal basis for the processing of personal data required for the performance of a contract to which the data subject is a party. This also applies to processing operations that are necessary for the implementation of pre-contractual measures. If the processing of personal data is necessary to fulfil a legal obligation to which our company is subject, Art. 6 Para. 1 lit. C serves as the legal basis.GDPR as a legal basisIn the event that vital interests of the data subject or another natural person necessitate the processing of personal data, Art. 6 para. 1 lit. d GDPR serves as the legal basis.If the processing is necessary to safeguard a legitimate interest of our company or a third party and if the interests, fundamental rights and fundamental freedoms of the data subject do not outweigh the first-mentioned interest, Art. 6 para. 1 lit. f GDPR serves as the legal basis for the processing.Data deletion and storage periodThe personal data of the person concerned will be deleted or blocked as soon as the purpose of storage no longer applies. In addition, the data may be stored if the European or national legislator has provided for this in Union regulations, laws or other provisions to which the person responsible is subject. The data shall also be blocked or deleted if a storage period prescribed by the aforementioned standards expires, unless it is necessary for further storage of the data for the conclusion or performance of a contract.2. DATA COLLECTION ON OUR WEBSITES Acurast Association websites use cookies – small text files that are placed on your machine to help the site provide a better user experience. In general, cookies are used to retain user preferences, store information for things like shopping carts, and provide anonymised tracking data to third party applications like Google Analytics. As a rule, cookies will make your browsing experience better. However, you may prefer to disable cookies on this site and on others. The most effective way to do this is to disable cookies in your browser. We suggest consulting the Help section of your browser or taking a look at the About Cookies website which offers guidance for all modern browsers.Contact form, whitepaper form and email contactA contact form and whitepaper form are available on our websites, which can be used for electronic contact and for an electronic request of a whitepaper. If a user makes use of this possibility, the data entered in the input mask will be transmitted to us and stored.These data are:First nameLast NameEmail addressPhone (contact form only)CompanyCountryThe processing of the data entered in the contact form and whitepaper form is therefore carried out exclusively on the basis of your consent (Art. 6 para. 1 lit. a GDPR). You can revoke this consent at any time. For this purpose, an informal email notification to us is sufficient. The legality of the data processing operations carried out until the revocation remains unaffected by the revocation.The data entered by you in the contact form and whitepaper form will remain with us until you request deletion, revoke your consent to storage or the purpose for data storage no longer applies (e.g. after your request has been processed or the whitepaper has been sent). Mandatory legal provisions – in particular retention periods – remain unaffected.Accelerated Mobile Pages (AMP)We also provide the content of our Internet pages via Accelerated Mobile Pages (AMP).Therefore, if you call up one of our Internet pages, e.g. after a Google search with your smartphone, this AMP may not be delivered by our servers, but directly from the cache of third-party providers such as Google. In this case, the address line of your browser on the level of the second-level domain will not show our domain name (our internet address), but e.g. the domain name of Google. The source code of our page remains unchanged.If, however, the AMP versions of our Internet pages are in the cache at e.g. Google or other third party providers and are called up from there, we have no influence on the data processing and the handling of your IP address by them. We do, however, ensure that we do not collect any personal data via our AMP pages.3. WEB ANALYSIS WITH GOOGLE ANALYTICS Our websites uses Google Analytics, a web analytics service provided by Google Inc. (“Google”). Google Analytics uses “cookies”, which are text files placed on your computer, to help the websites analyze how users use the site. The information generated by the cookie about your use of the website will generally be transmitted to and stored by Google on servers in the United States. For more information on how Google Analytics uses user data, please refer to Google’s privacy policy: https://support.google.com/analytics/answer/6004245?hl=enObjection to data collectionYou can prevent Google Analytics from collecting your data by clicking on the following link. An opt-out cookie is set to prevent the collection of your information on future visits to this website: Disable Google Analytics 4. GOOGLE ADS (FORMERLY GOOGLE ADWORDS)Our Websites use the services offered by Google AdWords. Google AdWordsis a online marketing tool by Google Inc., 1600 Amphitheatre Parkway, Mountain View, CA 94043, USA (“Google”) in order to draw attention to our attractive offers by means of advertising material (so-called Google AdWords) on external websites. In relation to the data of the advertising campaigns, we can determine how successful our individual advertising measures are. We do this because our concern is to display advertising that is of interest to you, to make our websites more attractive to you and to be able to make a fair calculation of our advertising costs.This advertising material is supplied by Google via so-called “Ad Servers”. For this purpose, we use Ad Server Cookies, which provide certain parameters to enable measurement of success, such as the insertion of the advertisements or clicks by the user. If you have reached our website via a Google ad, Google AdWords will save a cookie on your PC. Generally, these cookies expire after 30 days and are not intended to identify you personally. As a rule, the following are saved to this cookie as analysis values: unique cookie ID, number of ad impressions per placement (frequency), last impression (relevant for post-view conversions) plus opt-out information (marking to show that the user does not want to be contacted again).These cookies enable Google to recognize your browser. If a user visits certain of an AdWords customer’s pages and the cookie stored on his or her computer has not yet expired, Google and the customer can see the user has clicked on the ad and been directed to this website. Each AdWords customer is allocated a different cookie. This means cookies cannot be traced via the websites of AdWords customers. We ourselves do not collect and process any personal data in the advertising measures mentioned above. Google merely makes statistical evaluations available to us. Using these evaluations, we are able to see which of the advertising measures are particularly effective. We do not receive any further data collected from the use of the advertising material; in particular, we are unable to identify the users from this information.Based on the marketing tools used, your browser automatically makes a direct connection with the Google server. We have no influence on the scope and further use of data collected by Google by means of this tool and therefore inform you according to the state of our knowledge: by integrating AdWords Conversion, Google receives the information that you have called up the relevant part of our internet site or clicked on one of our ads. If you are registered with a Google service, Google can allocate the visit to your account. Even if you have not registered with Google or are not logged in, there is a possibility that the advertising provider may find your internet protocol address and save it. 5. GOOGLE TAG MANAGEROur websites uses the Google Tag Manager. Google Tag Manager is a solution that allows you to manage website tags through an interface. The Tag Manager tool itself (which implements the tags) is a cookie-less domain and does not collect any personally identifiable information. The tool triggers other tags that may themselves collect data. Google Tag Manager does not access this data. If deactivation has been made at the domain or cookie level, it will persist for all tracking tags implemented with Google Tag Manager. 6. SOCIAL PLUG-INS FROM, TWITTER, INSTAGRAM AND LINKEDINOn our websites we offer you the possibility of using so-called “social plugins” of the companies:“Tweet” button from Twitter Inc., 795 Folsom St., Suite 600, San Francisco, CA 94107, USA;“Recommended Button” by LinkedIn Corporation, 2029 Stierlin Court, Mountain View, CA 94043, USA;To protect your data, we rely on the “Shariff” solution during implementation. This means that the plugins on the website are only displayed as a graphic, which contains a link to the corresponding website of the plugin provider. By clicking on the graphic you will be redirected to the respective services of the provider. Only then will your data be sent to the respective services. If you do not click on the graphic, there will be no exchange between you and the social networks mentioned above.Information about the collection and use of your data in the social networks can be found in the respective terms of use of the respective providers.7. NEWSLETTERIf you wish to receive the newsletter offered on our websites, we require an email address from you as well as information that allows us to verify that you agree to the owner of the email address provided and to receive the newsletter.Zoho CRM is used as newsletter software. Your data will be transmitted to the Zoho Corporation. Zoho Corporation is prohibited from selling your data and from using it for purposes other than sending newsletters.You can revoke your consent to the storage of data, email address and their use to send the newsletter at any time, for example by clicking on the “Unsubscribe” link in the newsletter.For this reason, we ask you to inform yourself about our data protection measures at regular intervals by inspecting our data protection declaration.8. PLUGINS AND TOOLSYouTubeOur websites uses plugins from the YouTube page operated by Google. The site is operated by YouTube, LLC, 901 Cherry Ave, San Bruno, CA 94066, USA.When you visit one of our pages equipped with a YouTube plug-in, a connection is established to YouTube’s servers. This will tell the YouTube server which of our pages you have visited.If you are logged into your YouTube account, you can allow YouTube to directly associate your surfing behavior with your personal profile. You can prevent this by logging out of your YouTube account.YouTube is used in the interest of an appealing presentation of our online offers. This constitutes a legitimate interest within the meaning of Art. 6 para. 1 lit. f GDPR.Further information on the handling of user data can be found in YouTube’s data protection declaration at: https://www.google.de/intl/de/policies/privacy9. YOUR RIGHTS TO INFORMATION, CORRECTION, BLOCKING, DELETION AND OPPOSITIONYou have the right to receive information about your personal data stored by Acurast Association at any time. You also have the right to have your personal data corrected, blocked or, apart from the prescribed data storage for business purposes, deleted. Please contact the data protection officer of Acurast Association. In order that a block of data can be considered at any time, these data must be kept in a block file for control purposes. You can also request the deletion of the data, unless there is a legal archiving obligation. If such an obligation exists, we will block your data on request.You can change or revoke your consent by notifying us accordingly with effect for the future.If you would like more detailed information on your personal data, our data protection officer will be happy to answer any questions you may have regarding our data protection policy.10. CHANGES TO OUR PRIVACY POLICYWe reserve the right to amend this data protection declaration from time to time so that it always complies with current legal requirements or in order to implement changes to our services in the data protection declaration, e.g. when introducing new services. Your next visit will then be subject to the new data protection declaration. PRIVACY POLICY FOR OUR SOCIAL MEDIA APPEARANCES 1. DATA PROCESSING THROUGH SOCIAL NETWORKSWe offer online services on various social media platforms in order to provide information and to be able to contact you.We"
