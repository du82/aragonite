ery with recharging and on/off switch? Affirmative. Plug-and-play so no soldering necessary when used with a Pico H... Add to Cart, Adafruit Proto Doubler PiCowbell for Pico and PicoW $7.50 In stock Add to Cart, Adafruit Proto Doubler PiCowbell for Pico and PicoW Adafruit ItsyBitsy ESP32 - wFL Antenna - 8 MB Flash / 2 MB PSRAM Product ID: 5890 What's smaller than a Feather but larger than a Trinket? It's an Adafruit ItsyBitsy ESP32 with a wFL external Antenna Connection, a powerful processor PCB with a plethora of pins! It features the ESP32 Pico module, an FCC-certified module that contains an ESP32 chip with dual-core 240MHz Tensilica processor, WiFi, and Bluetooth classic + BLE, configured with 8 MB of... Add to Cart, Adafruit ItsyBitsy ESP32 - wFL Antenna - 8 MB Flash / 2 MB PSRAM $14.95 88 in stock Add to Cart, Adafruit ItsyBitsy ESP32 - wFL Antenna - 8 MB Flash / 2 MB PSRAM Adafruit Qualia ESP32-S3 for TTL RGB-666 Displays Product ID: 5800 There's a few things everyone loves: ice cream, kittens, and honkin' large TFT screens. We're no strangers to small TFT's - from our itsy 1.14" color display that graces many-a-TFT-Feather to our fancy 3.5" 320x480 breakout screen. But most people who dabble or engineer with microcontrollers know that you sort of 'top out' at 320x480 - that's the largest resolution... Add to Cart, Adafruit Qualia ESP32-S3 for TTL RGB-666 Displays $19.95 In stock Add to Cart, Adafruit Qualia ESP32-S3 for TTL RGB-666 Displays Adafruit Metro RP2040 Product ID: 5786 Choo! Choo! This is the RP2040 Metro Line, making all station stops at "Dual Cortex M0+ mountain", "264K RAM round-about" and "16 Megabytes of Flash town". This train is piled high with hardware that complements the Raspberry Pi RP2040 chip to make it an excellent development board for projects that want Arduino-shape-compatibility or just need the extra space and... Add to Cart, Adafruit Metro RP2040 $14.95 In stock Add to Cart, Adafruit Metro RP2040 Adafruit Matrix Portal S3 CircuitPython Powered Internet Display Product ID: 5778 Folks love our wide selection of RGB matrices and accessories for making custom colorful LED displays... and our RGB Matrix Shields and FeatherWings can be quickly soldered together to make the wiring much easier. But what if we made it even easier than that? Like, no solder, no wiring, just instant plug-and-play? Dream no more - with the Adafruit Matrix Portal S3... Add to Cart, Adafruit Matrix Portal S3 CircuitPython Powered Internet Display $19.95 35 in stock Add to Cart, Adafruit Matrix Portal S3 CircuitPython Powered Internet Display Adafruit Swirly Aluminum Mounting Grid for 0.1" Spaced PCBs - 10x5 Product ID: 5774 With most of our dev boards, sensors and feathers now sporting plug-and-play stemma QT ports it can be very fast to put together projects with half a dozen boards snapped together. But that ease of use has one downside: now you don't have a breadboard as a mechanical substrate... which is why we created this nifty swirly grid design to allow for easy mounting of... Add to Cart, Adafruit Swirly Aluminum Mounting Grid for 0.1" Spaced PCBs - 10x5 $4.95 In stock Add to Cart, Adafruit Swirly Aluminum Mounting Grid for 0.1" Spaced PCBs - 10x5 Adafruit RP2040 Prop-Maker Feather with I2S Audio Amplifier Product ID: 5768 The Adafruit Feather series gives you lots of options for a small, portable, rechargeable microcontroller board. By picking a feather and stacking on a FeatherWing you can create advanced projects quickly. One popular combo is our Feather M4 or Feather RP2040 with a Prop-Maker FeatherWing on top to create animatronics or props that boot up instantly and can drive... Add to Cart, Adafruit RP2040 Prop-Maker Feather with I2S Audio Amplifier $19.95 In stock Add to Cart, Adafruit RP2040 Prop-Maker Feather with I2S Audio Amplifier Adafruit Feather RP2040 with DVI Output Port - Works with HDMI Product ID: 5710 Wouldn't it be cool if you could display images and graphics from a microcontroller directly to an HDMI monitor or television? We think so! So we designed this RP2040 Feather that has a digital video output (a.k.a DVI) that will work with any HDMI monitor or display. Note it doesn't do audio, just graphics! It's kinda like we took our RP2040 Feather and DVI Breakout... Add to Cart, Adafruit Feather RP2040 with DVI Output Port - Works with HDMI $14.95 In stock Add to Cart, Adafruit Feather RP2040 with DVI Output Port - Works with HDMI Adafruit QT Py S3 with 2MB PSRAM WiFi Dev Board with STEMMA QT Product ID: 5700 The ESP32-S3 has arrived in QT Py format - and what a great way to get started with this powerful new chip from Espressif! With dual 240 MHz cores, WiFi and BLE support, and native USB, this QT Py is great for powering your IoT projects. Now we even have this powerhouse of a board with built in 2 Megabytes of PSRAM for when you need to buffer large datasets in... Add to Cart, Adafruit QT Py S3 with 2MB PSRAM WiFi Dev Board with STEMMA QT $12.50 4 in stock Add to Cart, Adafruit QT Py S3 with 2MB PSRAM WiFi Dev Board with STEMMA QT Adafruit Feather RP2040 SCORPIO - 8 Channel NeoPixel Driver Product ID: 5650 If there is one thing Adafruit is known for, its mega-blinky-fun-rainbow-LEDs. We just love sticking NeoPixels anywhere and everywhere. When we saw the new 'PIO' peripheral on the RP2040 from Raspberry Pi, we just knew it would be perfect for driving large quantities of NeoPixels. So we created this board, the Adafruit Feather RP2040 SCORPIO, designed specifically... Add to Cart, Adafruit Feather RP2040 SCORPIO - 8 Channel NeoPixel Driver $14.50 In stock Add to Cart, Adafruit Feather RP2040 SCORPIO - 8 Channel NeoPixel Driver Adafruit 5x5 NeoPixel Grid BFF Add-On for QT Py and Xiao Product ID: 5646 Our QT Py boards are a great way to make very small microcontroller projects that pack a ton of power - and now we have a way for you to quickly add a glittering grid of 25 RGB addressable micro NeoPixels. It's an excellent way to make tiny wearable, cosplay, or IoT projects with dazzling LEDs. We call this the Adafruit 5x5 NeoPixel Grid BFF - a "Best Friend... Add to Cart, Adafruit 5x5 NeoPixel Grid BFF Add-On for QT Py and Xiao $9.95 84 in stock Add to Cart, Adafruit 5x5 NeoPixel Grid BFF Add-On for QT Py and Xiao Micro Servo with Alligator Clips Product ID: 5592 This servo is just like our classic Micro Servo but has 3 alligator clip test leads at the end! This makes it perfect for plug-and-play support with any of our boards with alligator-clip-friendly input/output pins, like the Circuit Playground Express, Clue, and micro:bit! So you can just 'gator right into the connector and get twistin' This tiny little servo can... Notify Me, Micro Servo with Alligator Clips $7.95 Out of stock Notify Me, Micro Servo with Alligator Clips Raspberry Pi Pico W Product ID: 5526 The Raspberry Pi foundation changed single-board computing when they released the Raspberry Pi computer, now they're ready to do the same for microcontrollers with the release of the brand new Raspberry Pi Pico W. This low-cost microcontroller board features their powerful new chip, the RP2040, and all the fixin's to get started with IoT embedded electronics projects... Add to Cart, Raspberry Pi Pico W $6.00 In stock Add to Cart, Raspberry Pi Pico W nOOds - Flexible LED Filament - 3V 300mm long - Warm White Product ID: 5503 Our favorite food when hacking on code or electronics is a hot bowl of noodles - and around NYC these are often called 'noods'! What we've got here are flexible LED noodles, in different lengths and colors. All are not good for eatin' but they are good for cool lighting effects These are often seen in 'Edison-like' LED bulbs, shaped into hearts or stars or just wound... Add to Cart, nOOds - Flexible LED Filament - 3V 300mm long - Warm White $4.50 In stock Add to Cart, nOOds - Flexible LED Filament - 3V 300mm long - Warm White dLUX-dLITE Cool White Skull Shape LEDs 5 Pack by Unexpected Labs Product ID: 5429 Sure, we've got all sorts of diffused bare LEDs in all sorts of colors and sizes. But have you ever laid your peepers on this spooky set of skull-shaped LEDs? These look too cute and charming and will look amazing for any magic- or science-themed electronics project. Add that extra zing to your project with these handmade LEDs from dLUX-dLITE. Each pack contains 5... Add to Cart, dLUX-dLITE Cool White Skull Shape LEDs 5 Pack by Unexpected Labs $9.50 48 in stock Add to Cart, dLUX-dLITE Cool White Skull Shape LEDs 5 Pack by Unexpected Labs MEMENTO - Python Programmable DIY Camera - Bare Board Product ID: 5420 Make memories, or just a cool camera-based project, with Adafruit's MEMENTO Camera Board. It's a development board with everything you need to create programmable camera and vision projects: with a camera module, TFT preview screen, buttons, SD card slot and driven by a powerful ESP32-S3 with 2 MB of PSRAM for buffering 5 MegaPixel camera images. This product is just... Add to Cart, MEMENTO - Python Programmable DIY Camera - Bare Board $34.95 In stock Add to Cart, MEMENTO - Python Programmable DIY Camera - Bare Board Adafruit ESP32 Feather V2 - 8MB Flash + 2 MB PSRAM - STEMMA QT Product ID: 5400 One of our star Feathers is the Adafruit HUZZAH32 ESP32 Feather - with the fabulous ESP32 WROOM module on there, it makes quick work of WiFi and Bluetooth projects that take advantage of Espressifs most popular chipset. Recently we had to redesign this feather to move from the obsolete CP2104 to the available CH9102F and one thing led to another and before you know... Add to Cart, Adafruit ESP32 Feather V2 - 8MB Flash + 2 MB PSRAM - STEMMA QT $19.95 In stock Add to Cart, Adafruit ESP32 Feather V2 - 8MB Flash + 2 MB PSRAM - STEMMA QT Adafruit ESP32-S2 Reverse TFT Feather Product ID: 5345 Like Missy Elliot, we like to "put our [Feather] down, flip it and reverse it" and that's exactly what we've done with this new development board. It's basically our ESP32-S2 TFT Feather but with the 240x135 color TFT display on the back-side not the front-side. That makes it great for panel-mounted projects, particularly since we've also got some space for 3 buttons... Notify Me, Adafruit ESP32-S2 Reverse TFT Feather $24.95 Out of stock Notify Me, Adafruit ESP32-S2 Reverse TFT Feather Adafruit QT Py ESP32-S2 WiFi Dev Board with STEMMA QT Product ID: 5325 What has your favorite Espressif WiFi microcontroller, comes with our favorite connector - the STEMMA QT, a chainable I2C port, and has lots of Flash and RAM memory for your next IoT project? What will make your next IoT project flyyyyy? What a cutie pie! Or is it... a QT Py? This diminutive dev board comes with one of our new favorite lil chips, the ESP32-S2! The... Add to Cart, Adafruit QT Py ESP32-S2 WiFi Dev Board with STEMMA QT $12.50 In stock Add to Cart, Adafruit QT Py ESP32-S2 WiFi Dev Board with STEMMA QT Adafruit ESP32-S2 Feather with BME280 Sensor - STEMMA QT - 4MB Flash + 2 MB PSRAM Product ID: 5303 What's Feather-shaped and has an ESP32-S2 WiFi modul'''
