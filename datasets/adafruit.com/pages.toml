full_description = "Turn on your lights - from anywhere. Monitor your home security system – from anywhere Sense a theme? The Internet of Things, or IoT, is a groundbreaking way to add convenience and flexibility to your life by connecting commonly used objects to the Internet and then controlling them through a WiFi connected device.The possibilities are endless, especially since the technology's advancing almost every day, with Adafruit at the forefront of innovation. Check out our development boards like the Feather Huzzah or start with a kit for IoT beginners, like the Adafruit IO Starter Pack. If you need more power, upgrade to a Raspberry Pi to create more complex Internet of Things appliances. Once your devices are set up, and you're hooked on IoT, check out adafruit.io - the easiest way to stream, log, and interact with your data."
