title = "Adafruit 1.2 8x8 LED Matrix Backpack : ID 1048 : Adafruit Industries, Unique & fun DIY electronics and kits"
description = '''
Description									
			
			
				By popular request, you can now get our 8x8 LED backpacks without the LEDs! These backpacks feature an HT16K33 I2C LED driver, they're simple and easy to use - you can use our very nice library for the backpacks to get running in under half an hour. If you've been eyeing matrix displays but hesitated because of the complexity, this is the solution you've been looking for!Like our other LED backpacks, these are end-to-end stackable and by soldering the address jumpers on the back you can have up to 8 backpacks all sharing the same two I2C wires!Comes with a fully tested and assembled LED backpack & some header. Some light soldering is required to attach the header and, of course, the display.A 1.2" 8x8 matrix display is not included, but we have lots of options in the store! We only know that this backpack works with the ones we stock. Other 1.2" square 8x8 displays may not work, we don't guarantee 'em.'''
