full_description = "The British Invasion is here! No, not music...microcontrollers! Designed specifically for kids and beginners, the BBC micro:bit is a pocket-sized computer that you can code, customize and control to bring your digital ideas, games and apps to life. It’s a small, code-able device that is a non-intimidating introduction to programming and making – switch on, program it to do something fun – wear it, customize it, develop new ideas. It's one of the easiest ways to learn programming and electronics! Over the last few years there have been tons of accessories, add-ons, and other devices that use the micro:bit-style edge connector too! Not all things work together, so make sure you review the product pages for what works with what and what software support there is!"
