full_description = '''Terms of Service Please read the entire agreement. By using and ordering from this website you agree to these terms. If you do not agree, please do not use this site. If you have any questions or concerns, feel free to contact us. Returning Purchased Items We can only accept returns of unopened kits and products, within 30 days of receipt (28 days from shipment for international orders). Return shipment is the responsibility of the customer. All returns are credited as store credit upon receipt. Please contact us before returning any package! We're reasonable people and we hope you are too. Contact us if you have any issues and we'll do our best to help you out! Payment We accept credit card, Paypal, and Amazon Payment as payment for orders. We do not accept Paypal eChecks. Due to potential fraud and misuse, we may not to ship an order, or request additional verification information for credit card, Amazon or Paypal payments. Credit cards must clear the authorization process and are only charged before shipment. Payments through Paypal are always charged at time of order. For school or organizations requiring a Purchase order (orders over $100) - please contact us. Sales Tax Refunds If you do not set up a tax-free Adafruit account, you will be required to pay sales tax on your order. Refunds are possible only if you send us proper documentation by the 5th day of the month directly following the one in which you placed your order. For example, if you placed your order during the month of March, you need to send us your tax-exempt form by April 5th to receive a refund. After that time period has expired, you will need to contact the government office that manages tax collection in your jurisdiction in order to apply for a refund. Adafruit's Technical Support Adafruit has dedicated support engineers that will be able to assist you immediately, please keep in mind we answer all questions in the technical support forums, we do not provide one-on-one email or telephone consulting. We also offer product support to customers of our official resellers who have purchased our products. Please note, we do not provide a warranty or support to anyone who has purchased one of our products from an unauthorized resale. For example, if someone buys a product from our store and is not an official Adafruit distributor, and then sells the product elsewhere, we do not offer support or warranty on that item. Adafruit's "Be Excellent" policy Please review our Adafruit Community Code of Conduct on GitHub which has frequent updates and additions. Our community is important to all of us at Adafruit. Our “Be Excellent” policy applies to all members: This includes employees, customers, educators, makers, content creators, and more. It applies to all interactions that affect the community we have all built together: commenting on our web pages, posting in forums, and treatment of our support staff. Together, we love celebrating the awesome work the community does, and we appreciate the kind words and support we give to each other! We hold ourselves and our community members to a high standard of excellence. Each member is valuable to us and we are dedicated to maintaining a positive space where people can engage, learn, and share their work. Overwhelmingly, our members are respectful and awesome; their kindness and coolness is precious and inspiring. And — it’s worth protecting. Once in a while, we do encounter someone who has decided to cause problems, is not reasonable, or chooses not to be solutions-oriented. If a customer curses, uses abusive language, refuses to work with our engineers in the forums, cannot work together positively with other members, or otherwise ignores the “Be Excellent” code of conduct, we will suggest the customer seek another supplier for future purchases. When appropriate, we may choose to ban the former customer from making future purchases or engaging with our community. If a user continues to behave in violation of this policy, especially after warning them, we may choose to block that user on our site or any social media property we manage.We reserve the right at all times to remove any information or materials that are unlawful, threatening, abusive, libelous, defamatory, obscene, vulgar, pornographic, profane, indecent or otherwise objectionable. These cases are rare, but we believe this is an important step to take to ensure the safety of our employees, other customers, and all other wonderful members of our community. Adafruit wouldn’t be Adafruit without our community. This is why we are committed to keeping it a positive and respectful space, devoid of profane, harassing, offensive, or inappropriate language (or actions) and negativity in general. We invite you to use our commenting platform(s) to engage in insightful and inspiring conversations.We want to make sure we’re focusing on the excellent users who make the Adafruit Community such a positive space on the web. What we expect of our community members: Be inclusive: We are committed to a strong and diverse community and will not tolerate exclusion, discrimination, or intolerance. Any conduct or speech that might be considered sexist, racist, homophobic, transphobic, ableist, or otherwise discriminatory will not be tolerated. Do not intimidate or harass others. Be respectful: You may not always agree with us or other community members, but that is no excuse for disrespectful behavior. Please channel disagreement and frustration into creating positive results and refrain from personal attacks. Respect differences of opinion. Be patient: Not everyone in our community has the same experience or knowledge. Be understanding of where other members are at and be patient with the learning approaches of others. Communicate carefully: Not everyone in our community starts from the same language experiences. Effective communication will help avoid misunderstandings. Ask questions and don’t make assumptions about others. If you have any questions about this policy or what we expect of community members, or any feedback on how we might make it better, please contact us at [email protected]. Adafruit's Social Media Retention & Mute / Block / Ban Policy Adafruit auto-deletes or archives social media posts, generally after 90 days, which may include likes/RTs, and more - depending on the platform. Adafruit reserves the right to mute, block or ban accounts that target our team, our community, and/or the diverse community which enjoys the Adafruit social properties as a safe online space. We will try to resolve any matters directly, and privately, with the individuals when possible before a mute, block or ban. If there are any questions about this policy or what we expect of community members, or any feedback on how we might make it better, let us know - and sometimes we will or have mistakenly muted, blocked, or banned an account (sorry!), please contact us at [email protected] Editorial Standards Adafruit publishes a wide range of writing and video content, including interviews and reporting on the maker market and the wider technology world. Our standards page is intended as a guide to best practices that Adafruit uses, as well as an outline of the ethical standards Adafruit aspires to. While Adafruit is not an independent journalistic institution, Adafruit strives to be a fair, informative, and positive voice within the community - check it out here - adafruit.com/editorialstandards Purchasing a Raspberry Pi and Other Products During the Current Parts Shortage Adafruit is currently requiring a verified account with two-factor authentication enabled in order to purchase certain high-demand products, such as Raspberry Pi computers. Please make sure you have a verified Adafruit account and enable two-factor authentication. Finally, you will need to sign out and back in to activate the account verification. Currently, Raspberry Pi Board purchases are limited to 1 per customer. Due to stock limitations we may only be able to offer refunds or store credit for Pis that are defective, damaged or lost in transit. For complete details, please visit our guide. Safety Technology and the laws and limitations imposed by manufacturers and content owners are constantly changing. Thus, some of the projects described may not work, may be inconsistent with current laws or user agreements, or may damage or adversely affect some equipment. Your safety is your own responsibility, including proper use of equipment and safety gear, and determining whether you have adequate skill and experience. Power tools, electricity, and other resources used for these projects are dangerous, unless used properly and with adequate precautions, including safety gear. Some illustrative photos do not depict safety precautions or equipment, in order to show the project steps more clearly. These projects are not intended for use by children. Use of the instructions, kits, projects and suggestions on ladyada.net and adafruit.com is at your own risk. Adafruit Industries LLC disclaims all responsibility for any resulting damage, injury, or expense. It is your responsibility to make sure that your activities comply with applicable laws, including copyright. Always check the webpage associated with each project before you get started. There may be important updates or corrections! The United States Fire Administration (USFA) has a guide and many simple steps you can take to prevent the loss of life and property resulting from electrical fires. Click here to read them! If you feel uncomfortable with assembling any project or kit, simply contact us to return it for a full refund. Adafruit is not responsible for your shipping product function or certification if you choose to use our products in your design. Third-Party Links In an attempt to provide increased value to our visitors, we may link to sites operated by third parties. However, we have no control over these linked sites. If you use these links, you will leave Adafruit.com, and we are not responsible for any content, materials or other information located on the linked website. If you decide to check out any of the linked websites, you do so entirely at your own risk. Contact Information If you have any questions about these terms, please contact us using our "Contact Us" page. Shipping We process orders within 1-2 business days. With UPS 3 Day Select, 2nd Day Air, and Next Day Air, orders placed by 11am ET on weekdays usually ship that same day. Once we ship your order, we will send you an email with tracking information. You can also check your order status by logging into your account. Keep in mind the UPS service guarantee is suspended if delays are caused by bad weather or other disasters. We cannot refund shipping fees if your package arrives late due to snow or other natural disasters anywhere along your package's route, including (but not limited to) meteors, aliens, terrorism, incursions from other dimensions, etc. We may not always be able to ship to some mail forwarders and/or PO Boxes depending on location or if there are known fraud/theft issues with a specific mail forwarder. See our Shipping and Returns page for more information. For all international DDU and USPS orders, you are responsible for any VAT, tariff, duty, taxes, handling fees, brokerage charges, customs clearance charges, etc. required by your country for importing consumer goods! DHL DDU and USPS first class & express mail are eligible for these fees. There is no way for Adafruit (the shipper) to predict your country's customs/fee habits, so be prepared to pay full VAT on the fully declared value of your order as well as any customs fees your country's DHL or postal system may charge you! There are some services that can estimate the duty/taxes, while they're not 100% accurate they can be helpful (Duty/Tax Calculator). Keep a printout of your email receipt as you may have to send a copy to your customs office or