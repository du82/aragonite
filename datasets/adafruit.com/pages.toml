["https://adafruit.com/privacy"]
title = "Adafruit Privacy Policy"
description = "Adafruit Industries, Unique &amp; fun DIY electronics and kits : Privacy - Tools Gift Certificates Arduino Cables Sensors LEDs Books Breakout Boards Power EL Wire/Tape/Panel Components & Parts LCDs & Displays Wearables Prototyping Raspberry Pi Wireless Young Engineers 3D printing NeoPixels Kits & Projects Robotics & CNC Accessories Cosplay/Costuming Halloween Reseller and School Packs Internet of Things - IoT Development Boards Batteries Feather CircuitPython Circuit Playground Crickit - Creative Robotics Particle STEMMA Machine Learning micro:bit Add-ons & Accessories Bluetooth PPE Microchip Mechanical Keyboards Clearance Sale ecommerce, open source, shop, online shopping"
full_description = "Adafruit Privacy Policy Last Updated: August 21, 2024 This privacy policy governs how Adafruit Industries, LLC collects, stores, uses, and discloses information about users of adafruit.com. This policy applies to the site, along with related products and services offered by Adafruit Industries, LLC that link to this policy. This policy does not apply to websites, applications, or services that display or link to different privacy statements. For security related matters please email: [email protected] We adhere to EU-U.S. DPF Principles with regard to personal data transferred from the European Union and the United Kingdom and the Swiss-U.S. DPF Principles with regard to personal data transferred from Switzerland. Click here to read more about the EU-U.S. DPF Principles. California consumers can find specific disclosures, including “Notice at Collection” details, by clicking here. Information You Provide to Us The personal information we collect depends on how you interact with us, the products you use, and the choices you make. We collect and process personal information about you with your consent and/or as necessary to provide the products you use, operate our business, meet our contractual and legal obligations, protect the security of our systems and our customers, or fulfil other legitimate interests. When a user engages in certain actions on the site, they may provide us with certain kinds of information. This includes information including but not limited to: Name and Contact Information: Name, email address, postal address, phone numbers and other contact information Account Activity: Placed order details, gift certificates, wishlists, vouchers, subscriptions, and other account settings Payment Information: Payment information necessary to facilitate transactions on the site, including credit card details and billing address Content and Files: If you post comments or send us email messages, feedback, or other communications, we will collect and retain those communications Sensitive Personal Information: We collect account access information such as a username or account number in combination with a password, security or access code, or other credential that allows access to an account. When you are asked to provide personal information, you may decline. But if you choose not to provide information that is necessary for certain products or features, those products or features may not be available or function correctly. We may also combine information users provide with data we collect automatically (as further described below). Information We Collect Automatically When you use our products, we collect some information automatically. For example: Identifiers and device information. When you visit our website, our web servers automatically log your Internet Protocol (IP) address, and information about your device, including device identifiers (such as MAC address); device type; and your device’s operating system, browser, and other software including type, version, language, settings, and configuration. As further described in the Cookies and Similar Technologies section below, our websites and online services store and retrieve cookie identifiers, mobile IDs, and other data. Usage data. We automatically log your activity on our websites, apps, and connected products, including the URL of the website from which you came to our sites, pages you viewed, how long you spent on a page, access times, and other details about your use of and actions on our website. Other sensor data/Adafruit.io. If you elect to integrate a device with Adafruit.io, we may collect certain sensor information from your device as a part of your elections and certain usage and diagnostic information about the device, including device type, board type, connection type, and corresponding Adafruit.io API log. Inferences. We infer new information from other data we collect, including using automated means to generate information about your likely preferences or other characteristics (“inferences”). For example, we infer your city, state, and country location based on your IP address. Cookies and Similar Tracking Technologies (California Do Not Sell My Info) We use cookies, web beacons, mobile analytics and advertising IDs, and similar technologies to operate our websites and online services and to help collect data, including other identifiers and device information and usage data. California Do Not Sell My Info The California Consumer Protection Act (“CCPA”) requires us to disclose categories of personal information sold to third parties and how to opt-out of sale. The CCPA defines personal information to include online identifiers, including IP address, cookies IDs, and mobile IDs. The law also defines a “sale” to include simply making data available to third parties. Because we let advertising and analytics providers collect IP addresses, cookie IDs, mobile IDs through our sites and apps when you use our online services, but do not “sell” any other types of personal information, we provide our “Do Not Sell My Info” disclosures in this section. Other information related to your rights under the CCPA is contained in the California Rights section of this statement. Site DataWe may collect information automatically about users when they visit our site. This may include details about the user’s browser type and installed extensions, operating system, access times, language, IP address, and referring URLs, along with other similar data. Web Browser Cookies and Related TechnologiesOur site uses cookies, web beacons, and similar technologies to provide features such as account logins and shopping carts, to remember user preferences, to engage in advertising and retargeting, as well as to analyze user behavior. Cookies are small text files placed on your device to store data that can be recalled by a web server in the same domain that placed the cookie. The text in a cookie often consists of a string of numbers and letters that uniquely identifies your device, but it can contain other information as well. This allows the web server to recognize your browser over time, each time it connects to that web server. We use web beacons (also called single-pixel or clear gifs) that are contained within a website or email. When your browser opens a webpage or email that contains a web beacon, it automatically connects to the web server that hosts the image (typically hosted by a third party). This allows that web server to log information about your device and to set and read its own cookies. We use web beacons, for example, to deliver cookies, count visits, understand usage of our site and tell if an email has been opened and acted upon. Third Party Sites and Services Our site employs a variety of third-party services. These include payment gateways, shipping providers, content-distribution networks, advertisers, analytics, and monitoring tools. Some of these services store information about users, and may track individuals across sites, applications, and services. These services may collect information in a similar manner as described above, including, for example, IP address, access times, browser type, language, device type, and device identifiers. They can also create inferences about you from this information. By interacting with our services, certain information about user devices may be exposed to third party advertising and analytics using cookies and other tracking mechanism, these third parties include the entities in the charts below. As a requirement for using the Google Ads advertisement platform, Adafruit.com has implemented Google Signals, which uses aggregate data about a user who has Ads Personalization turned on in their Google account to serve them ads on other websites related to events they have performed on our website, such as viewing products or adding products to their cart. We do not currently implement Google's 'Enhanced Conversions' which is used to further track a user after completing a transaction - a requirement of which is to send Google first-party information: their email address and/or phone number in hashed form. We believe that hashed first-party data is not truly anonymous, as long as it is easily matched to non-hashed personal information by the receiver, and in this case the attributes of the hashing mechanism are controlled by Google and so we have made this choice on behalf of our users in our use of Google’s services. The analytics and advertising service providers we use that may track you across sites and services are: Service Name Purpose(s) Privacy policy Manage Settings (opt-out) Google Analytics web analytics service Google Analytics privacy policy Google Analytics Opt-out Browser Add-on Google Adwords online advertising service, analytics Google Adwords privacy policy See association links below. Facebook online advertising service Facebook privacy policy Facebook Ads Settings See association links below. You may find more information on each company's practices, including the choices it offers, by clicking on the above. Many of these companies are also members of associations, which provide a simple way to opt out of analytics and ad targeting, which you can access at: United States: NAI (NAI Opt Out Form) and DAA (DAA Opt Out Forms) Canada: Digital Advertising Alliance of Canada (youradchoices.ca information) Europe: European Digital Advertising Alliance (Your Online Choices information) Other third-party service providers we use: Service Name Function on adafruit.com Privacy policy Cloudflare Content Delivery Network Cloudflare privacy policy Amazon S3 Static File Hosting Amazon Web Services privacy policy Automattic site statistics and anti-spam services Automattic privacy policy Contextly web analytics and content recommender service Contextly privacy policy Algolia Search provider Algolia privacy policy & Sub-Processors Youtube Online video service Youtube privacy policy Paypal Online payments Paypal privacy policy Amazon Payments Online payments Amazon Payments privacy policy Authorize Online payments Authorize privacy policy (as a subsidiary of Visa Inc.) Stripe Online payments Stripe privacy policy Mailchimp Email marketing platform Mailchimp privacy policy Cookie Controls. Many web browsers accept cookies by default. Users can usually change their browser's settings to reject and/or to remove many cookies. Please note also that choosing to reject or remove cookies may prevent certain features or services of our site from working properly. Since cookie opt-out preferences are also stored in a cookie in a browser, please also note that deleting cookies, using a different browser, or buying a new computer, may require renewal of opt-out choices. Do Not Track and Global Privacy Control. Do Not Track (DNT) and Global Privacy Control are technologies which allows users to tell sites they visit that they don’t want to be tracked. They do this by including a signal with each request the browser sends. Where possible without breaking the functionality of our site, we take reasonable steps to honor Do Not Track and Global Privacy Control headers by attempting to serve only third-party services which themselves promise to honor Do Not Track and Global Privacy Control. However, because not all our necessary third-party service providers honor Do Not Track and Global Privacy Control and because implementations may change from time to time, we cannot guarantee that we will always be successful in all cases. While we and others give users the choices described in this policy, there are many ways through which web browser signals and other similar mechanisms can indicate user choice to disable tracking, and we may not be aware of nor honor every such mechanism. Mobile advertising ID controls. iOS and Android operating systems provide options to limit tracking and/or reset the advertising IDs. Email web beacons. Most email clients have settings which allow you prevent the automatic downloading of images, which will disable web beacons in the email messages you read. How We Use Collected Information We use the personal data we collect for purposes described in this privacy statement or as otherwise disclosed to you, including for the following purposes: To improve customer service and respond to your questions and queries Information users provide helps us respond to their customer service requests and support needs. Applicable categories of user information: Contact information, account activity, payment information, content and files, usage data, inferences To improve our site and services We may use feedback users provide to improve our products and services. We may use information in the aggregate to understand how our users as a group use the services and resources provided on our site. Applicable categories of user information: Contact information, account activity, payment information, content and files, usage data, inferences To provide and deliver our products, including securing, troubleshooting, improving, and personalizing those products To offer our users relevant content and recommendations To display marketing and advertising tailored to our users on our site and on other sites Applicable categories of user information: Contact information, account activity, payment information, content and files, identifiers and device information, usage data, sensor data, inferences For business operations, including to process payments and fulfill orders and for other accounting and internal operations We use the information users provide about themselves when placing an order only as described in this policy and to process and fulfill that order. We do not share this information with outside parties except to the extent appropriate to provide the service. Applicable categories of user information: Contact information, account activity, payment information, content and files, identifiers and device information, usage data, inferences To prevent fraud and abuse We may use the information contained in orders to prevent fraudulent financial transactions and other illicit activity or violations of our terms of service. We may use network addresses and similar data to block or report abusive and harassing users. In cases involving potential harm to individuals, we may submit personally identifiable information to law enforcement or other third parties. Applicable categories of user information: Contact information, account activity, payment information, content and files, usage data, inferences To send periodic emails and otherwise communicate with you through confirmations, invoices, notices, alerts, and administrative messages We may use the email address to send users information pertaining to their orders and accounts. It may also be used to respond to their inquiries, questions, and other requests. Applicable categories of user information: Contact information, account activity, payment information, content and"
