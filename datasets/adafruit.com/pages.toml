full_description = "Stop breadboarding and soldering - start making immediately! Adafruit's Circuit Playground is jam-packed with LEDs, sensors, buttons, alligator clip pads and more. Build projects with Circuit Playground in a few minutes with the drag-and-drop MakeCode programming site, learn computer science with the CS Discoveries class on code.org, jump into CircuitPython to learn Python and hardware together, or even use Arduino IDE. Circuit Playground Bluefruit is our third board in the Circuit Playground series: We've taken the popular Circuit Playground Express and made it even better! Now the main chip is an nRF52840 microcontroller which is not only more powerful, but also comes with Bluetooth Low Energy support for wireless connectivity. Circuit Playground Express is our most flexible Circuit Playground board, with support for MakeCode, CircuitPython, and Arduino. It has a powerful processor, 10 NeoPixels, mini speaker, InfraRed receive and transmit, two buttons, a switch, 14 alligator clip pads, and lots of sensors: capacitive touch, IR proximity, temperature, light, motion and sound. Circuit Playground Classic is the original classic Circuit Playground, which is not as powerful or featured. It is designed to be used with Arduino IDE and code.org CS Discoveries only. It does not run MakeCode or CircuitPython, and does not have Infrared support (which is why we made the Express!) A whole wide world of electronics and coding is waiting for you, and it fits in the palm of your hand."
