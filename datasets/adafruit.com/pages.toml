full_description = "Find the right battery for your project! Explore all the batteries at Adafruit! What's YOUR favorite battery? What a powerful question! Maybe it's the ubiquitous CR2032 you use to drive your TimeSquared Watch. Or maybe it's a heavy hitter - like the 6600mAh Lithium Ion Battery pack that you used to turn your Raspberry Pi display set up portable. Or maybe you just love the timeless AAA since it reminds you of a walkie-talkie you had when you were a kid. Whatever your favorite is, Adafruit has the right battery for your power needs and issues. Get great batteries and powerful chargers for all types of applications and projects. Our goal is to provide as many quality batteries and battery accessories as we possibly can, to help make sure your projects run to the best of their abilities, with the perfect amount of power. So charge up and power on - we have the size, chemistry, voltage and type of battery you're looking for!"
