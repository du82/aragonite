title = "Educators"
description = "Adafruit Industries, Unique &amp; fun DIY electronics and kits : Educators - Tools Gift Certificates Arduino Cables Sensors LEDs Books Breakout Boards Power EL Wire/Tape/Panel Components & Parts LCDs & Displays Wearables Prototyping Raspberry Pi Wireless Young Engineers 3D printing NeoPixels Kits & Projects Robotics & CNC Accessories Cosplay/Costuming Halloween Reseller and School Packs Internet of Things - IoT Development Boards Batteries Feather CircuitPython Circuit Playground Crickit - Creative Robotics Particle STEMMA Machine Learning micro:bit Add-ons & Accessories Bluetooth PPE Microchip Mechanical Keyboards Clearance Sale ecommerce, open source, shop, online shopping"
full_description = "Educators Helping educators teach the wonderful world of electronics, and programming, to makers of all ages. Adafruit provides the tools to make it easy to teach electronics. Find everything you need to inspire the next generation of makers. Discount for Educators Adafruit offers volume discounts and special offers to educators. Whether you are running a large workshop, or teaching a small class of students, we have you covered. The Best Products Adafruit sells a wide range of products for all skill levels. We carry all of the most popular boards including Circuit Playground, Feather, Arduino-compatible, Raspberry Pi, micro:bit, and more. So Many Resources Not only do we sell a wide range of products, but we also have a ton of guides on the Adafruit Learning System to help you with your curriculum. Here to Help Need a custom pack for a large order or want to learn more about educator discounts? Contact our support team! Not sure which board is right for your students? Check out our Educators channel in the forums! Get more for your budget with electronics from Adafruit. If you are an educator and plan to place a large order for your students or workshop, you may qualify for discounts of up to 10% off plus our already great quantity discounts. Talk to someone from the Adafruit Educators Team today to learn more. CONTACT US The best boards for students Here are the most popular boards for educators Circuit Playground Express Designed by Adafruit, the Circuit Playground Express is packed with sensors and is the perfect introduction to electronics and programming. Your students can start with Microsoft’s free MakeCode block-based programming software or the year-long curriculum at Code.org CS discoveries. As they progress, they can advance to using CircuitPython or even use the Arduino IDE. Learn More Raspberry Pi The Raspberry Pi is a single-board, low-cost, high-performance computer that has not only helped bring the joy of electronics and computer programming to people around the world, but it has also become a staple of the maker community. Learn More Metro Express Developed by Adafruit, the Metro Express is a microcontroller board designed for use with CircuitPython. CircuitPython is our beginner-oriented flavor of MicroPython - an easy to use version of the popular Python Programming language, and with all the same features. Not only can you use this board with CircuitPython, but you can also use it with the Arduino IDE. Learn More The best hardware comes with the best learning system. Our Adafruit Learning System is packed with over a thousand guides and tutorials teach you how to make amazing things with our products. We’ve curated our favorite guides for educators and there’s no better introduction to the world of electronics and programming. EXPLORE THE ADAFRUIT LEARNING SYSTEM All of the essentials in one convenient pack Curated kits with everything you need to start learning. Circuit Playground Express Educator's Pack Learn More Raspberry Pi 3 Model B Starter Pack Learn More Adafruit Metro Starter Pack Learn More"
