he U.S. Department of Treasury’s Office of Foreign Assets Control (31 CFR Part 500 et seq.), the Export Administration Regulations (“EAR”, 15 CFR Part 730 et seq.) administered by the U.S. Department of Commerce’s Bureau of Industry and Security, laws and regulations targeting proliferation activities, and the restricted parties lists maintained by the U.S. government (e.g., the Denied Persons List, Unverified List, Entity List, Specially Designated Nationals List, Debarred List and Non-proliferation Sanctions)). Customer agrees to comply with these laws and regulations and certifies that it will not use, sell, resell, export, re-export, import, dispose of, disclose or otherwise deal with the products or services delivered under this Agreement, directly or indirectly, to any country, destination or party without first obtaining any required export license or other governmental approval, and completing such formalities as may be required. Customer further agrees to not do anything which would cause Adafruit '''
