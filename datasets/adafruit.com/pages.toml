title = "CircuitPython Products Category on Adafruit Industries"
description = "Adafruit Industries, Unique &amp; fun DIY electronics and kits : CircuitPython - Tools Gift Certificates Arduino Cables Sensors LEDs Books Breakout Boards Power EL Wire/Tape/Panel Components & Parts LCDs & Displays Wearables Prototyping Raspberry Pi Wireless Young Engineers 3D printing NeoPixels Kits & Projects Robotics & CNC Accessories Cosplay/Costuming Halloween Reseller and School Packs Internet of Things - IoT Development Boards Batteries Feather CircuitPython Circuit Playground Crickit - Creative Robotics Particle STEMMA Machine Learning micro:bit Add-ons & Accessories Bluetooth PPE Microchip Mechanical Keyboards Clearance Sale ecommerce, open source, shop, online shopping"
full_description = "CircuitPython is Adafruit's branch of MicroPython designed to simplify experimentation and education on low-cost microcontrollers. No compiler, linker or IDE required! Now you can code directly on the device itself. CircuitPython makes it easier than ever to get prototyping by requiring no upfront desktop software downloads - open up main.py in any text editor and type away. It is great for beginners: With CircuitPython you can write clean and simple Python code to control hardware instead of having to use complex low-level languages like Arduino, C or C++. The simplicity of the Python programming language makes CircuitPython an excellent choice for beginners who are new to programming and hardware. Experts love it too: skip the annoyances of long-compile cycles, pointers and memory management - get right to the programming you want to do. CircuitPython is also quite full-featured and supports all of Python's syntax (Python version 3.4) and implements some useful parts of the Python standard library so even seasoned Python veterans will find CircuitPython familiar and fun to use. Pick up a Circuit Playground Express if you want everything-and-the-kitchen-sink-too, Gemma M0 for small wearables, Trinket M0 for compact breadboard-friendly designs, Metro M0 Express for shield-compatibility or Feather M0 Express to take advantage of the Feather system Visit the CircuitPython section of our Learn Guide to learn more about using this awesome coding language and visit our #circuitpython channel on Discord to start chatting with the CircuitPython community, today!"
