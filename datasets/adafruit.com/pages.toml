full_description = "A mainstay in the world of makers and electronics, The Raspberry Pi® is a single-board, low-cost, high-performance computer first developed in the UK by the Raspberry Pi Foundation. Not only has it helped bring the joy of electronics and computer programming to people around the world, but it has also become a staple of the maker community. The ever-present Pi in its latest iteration—Raspberry Pi 4 Model B—as the Pi Foundation continues to improve on an already excellent product. There’s also the five-dollar Pi Zero – a game-changing Raspberry Pi in a much smaller package – as well as its WiFi-laced cousin, the Pi Zero W. Since the release of the first Raspberry Pi, manifold products have been created to accompany, modify, and enhance the Pi’s capabilities. From touchscreens and displays to HATs, Bonnets, cameras and plates, the possibilities are endless when it comes to project ideas. We’ve also created a number of Raspberry Pi packs for young engineers and experts alike. Be sure to check out all of our Raspberry Pi related products, as well as our posts and tutorials."
