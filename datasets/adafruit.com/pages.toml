full_description = "Website Accessibility Looking for accessibility controls? Try the Accessibility Settings page. Website Accessibility Statement Adafruit’s Commitment to Web Accessibility - Adafruit Industries, LLC. has designed, developed, and regularly monitors our website to support functional accessibility and applicable WCAG 2.1 A & AA guidelines. We optimized this website with the assistance of: Criterion 508 Solutions, Inc (https://criterion508.com/). expert Section 508 and ADA web compliance audit teams which include WCAG experts with disabilities utilizing the following assistive technologies, browsers, and devices: Assistive Technologies:Screen readersScreen magnifiersSpeech recognition softwareKeyboard and alternative input devicesHigh contrast mode, etc. Browsers:Chrome Version 86.Safari Version 14.Edge Version 86.Firefox Version 82. Devices:DesktopTabletSmartphone Support of WCAG 2.1 POUR PrinciplesThis website supports the W3C WCAG POUR principles, which create the functional accessibility necessary for people with visual, auditory, mobility, and cognitive disabilities to access website content: Perceivable – Information and user interface components must be presentable to users in ways they can perceive. This means that users must be able to perceive the information being presented (it can’t be invisible to all their senses). Operable – User interface components and navigation must be operable. This means that users must be able to operate the interface (the interface cannot require interaction that a user cannot perform). Understandable – Information and the operation of user interface components must be understandable. This means that users must be able to understand the information as well as the operation of the user interface (the content or operation cannot be beyond their understanding). Robust – Content must be robust enough that it can be interpreted reliably by a wide variety of user agents, including assistive technologies. This means that users must be able to access the content as technologies advance (as technologies and user agents evolve, the content should remain accessible). Website Accessibility Questions and AccommodationIf you have questions about the accessibility of this website, or require accommodation due to a disability, please contact us for immediate assistance: Office Hours:Monday – Friday: 8:00 a.m. to 5:00 p.m. Eastern Email:[email protected] Telephone:(646) 248-7822 Headquarters:Adafruit Industries, LLC168 39th Street Ste 1905CCBrooklyn, NY 11232"
