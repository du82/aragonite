full_description = '''Sense your way into Open Source Hardware glory with Adafruit's sensor category! Here you can find everything you need to start measuring temperature, motion, force, flow, and more. Check out the Sensor Pack 900 for your beginner sensor needs or the Soil Temperature/Moisture Sensor for more advanced projects. With a wide and growing range of sensors, Adafruit's Sensors category is the best place for all your needs! Sensors Sense your way into Open Source Hardware glory with Adafruit's sensor category! Here you can find everything you need to start measuring temperature, motion, force, flow, and more. Check out the Sensor Pack 900 for your beginner sensor needs or the Soil Temperature/Moisture Sensor for more advanced projects. With a wide and growing range of sensors, Adafruit's Sensors category is the best place for all your needs! Weight (7) Accel, Gyro, and Magnetometers (124) Barometric Pressure (21) Biometric (14) Cameras (52) Coin (2) Gas / TVOC / Air Quality (15) Humidity (35) Light / Color / Photo (35) Liquid / Flow (13) Location / GPS (20) Motion (12) Proximity (50) Radiation / Geiger (2) Magstripe / Barcode (5) Microphone / Sound (11) Temperature (95) Touch (60) Photo cell (CdS photoresistor) Product ID: 161 CdS cells are little light sensors. As the squiggly face is exposed to more light, the resistance goes down. When it's light, the resistance is about ~1KΩ, when dark it goes up to ~10KΩ. To use, connect one side of the photocell (either one, it's symmetric) to power (for example 5V) and the other side to your microcontroller's analog input pin. Then... Add to Cart, Photo cell (CdS photoresistor) $0.95 In stock Add to Cart, Photo cell (CdS photoresistor) Strain Gauge Load Cell - 4 Wires - 20Kg Product ID: 4543 A strain gauge is a type of electronic sensor used to measure force or strain (big surprise there). They are made of an insulating flexible backing with a metallic foil pattern. The resistance of a strain gauge changes when force is applied and the object is deformed along with the foil and this change will give a different electrical output. However, these thin... Add to Cart, Strain Gauge Load Cell - 4 Wires - 20Kg $3.95 In stock Add to Cart, Strain Gauge Load Cell - 4 Wires - 20Kg Adafruit STEMMA Soil Sensor - I2C Capacitive Moisture Sensor - JST PH 2mm Product ID: 4026 Most low cost soil sensors are resistive style, where there's two prongs and the sensor measures the conductivity between the two. These work OK at first, but eventually start to oxidize because of the exposed metal. Even if they're gold plated! The resistivity measurement goes up and up, so you constantly have to re-calibrate your code. Also, resistive measurements... Add to Cart, Adafruit STEMMA Soil Sensor - I2C Capacitive Moisture Sensor - JST PH 2mm $7.50 In stock Add to Cart, Adafruit STEMMA Soil Sensor - I2C Capacitive Moisture Sensor - JST PH 2mm HC-SR04 Ultrasonic Sonar Distance Sensor + 2 x 10K resistors Product ID: 3942 If you're like me, you've dreamed of being a dolphin - smoothly gliding through the water. Using your echo-location abilities to detect tasty fish treats. Until genetic modifications catches up with our desires, we'll just have to make do with these handy HC-SR04 Ultrasonic Sonar Distance Sensors and a pair of flippers. These ubiquitous sensors are really common in... Add to Cart, HC-SR04 Ultrasonic Sonar Distance Sensor + 2 x 10K resistors $3.95 In stock Add to Cart, HC-SR04 Ultrasonic Sonar Distance Sensor + 2 x 10K resistors IR Break Beam Sensors with Premium Wire Header Ends - 3mm LEDs Product ID: 2167 Infrared (IR) break-beam sensors are a simple way to detect motion. They work by having an emitter side that sends out a beam of human-invisible IR light, then a receiver across the way which is sensitive to that same light. When something passes between the two, and its not transparent to IR, then the 'beam is broken' and the receiver will let you know. Compared to... Add to Cart, IR Break