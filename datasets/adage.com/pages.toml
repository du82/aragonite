                    Your browser does not support the video tag.                Ad AgeBest Places to Work 2024        50 companies doing a standout job. Ad Age examines the best practices of the best workplaces                    By Bradley Johnson. Illustrations by Pablo Caracol for Ad AgePublished on January 22, 2024            
            What makes the best places work?        Start with good pay and a robust benefits package.        Recruit a diverse workforce, providing incentives and opportunities for talent to grow with the company.         Offer good training, and keep staffing levels adequate so team members can do their best work. Be transparent about the state of the business.        Tilt the work-life balance a bit more toward life.        Easy to say—and hard to do. The Ad Age Best Places to Work 2024 class of 50 winners shows how to get the job done for the mutual benefit of employees and employers.    

                    
                
                    
    
                    

                                    What makes the best places work?                
                Start with good pay and a robust benefits package.                Recruit a diverse workforce, providing incentives and opportunities for talent to grow with the company.                 Offer good training, and keep staffing levels adequate so team members can do their best work. Be transparent about the state of the business.                Tilt the work-life balance a bit more toward life.                Easy to say—and hard to do. The Ad Age Best Places to Work 2024 class of 50 winners shows how to get the job done for the mutual benefit of employees and employers.

                                                                    See the winners                                                                        Top companies, 201+ employees                                                                                                                                                Top companies by discipline, 201+ employees                                                                                                    Top companies by region, 201+ employees                                                                                                                                        Top companies, up to 200 employees                                                                                                                                                Top companies by discipline, up to 200 employees                                                                                                    Top companies by region, up to 200 employees                                                                                                                                        


                What separates the best from the rest?
                The winners—the top 25 companies with more than 200 employees and the top 25 companies with 200 or fewer employees—reflect the highest overall scores based on an analysis of survey responses from employees and questionnaires submitted by employers.                The winning companies outscored other workplaces in factors ranging from compensation and training to corporate culture and leadership.                Perceptions about pay and benefits were the biggest differentiator for winners versus companies in the competition that didn’t make the ranking.                At the best companies, the quid pro quo of the employer/employee compact begins by paying proper quid to the pros. Employees at winning companies felt better about their overall compensation package than did employees at companies that didn’t make the cut.                The best places over-indexed on the employee survey’s most basic statements on pay and benefits:
                                    “Overall, I'm satisfied with this organization’s benefits package.”                    “If I do good work, I will be rewarded.”                    “My pay is fair for the work I perform.”                
                The Ad Age Best Places to Work 2024 ranking was produced by Best Companies Group, a research firm specializing in identifying and recognizing great places to work.                Best Companies Group conducted the surveys, analyzed the data and determined the winners.
            
                                                Who made the grade                    The 50 winners include a strong showing of ad agencies (13), ad tech firms (12), digital agencies (eight) and marketing agencies (six).                    The winners tally also includes three health care agencies, three media agencies, two branding and brand consulting firms, and one firm each in the fields of business transformation, event/experiential marketing and public relations.                    Among the 50 winners, nearly half—24—have headquarters in the New York or Los Angeles metro areas.                    The New York metro area is home to 17 winners—14 in Manhattan, one in Brooklyn and two in Fairfield County, Connecticut. The Los Angeles area has seven winners.                    Toronto is home to three Ad Age Best Places winners. Chicago, Dallas-Fort Worth, Minneapolis, San Diego and Boulder, Colorado, each scored two winners.                
                                                                        
                                    How employees rate their employers                    The employee engagement and satisfaction survey included a set of statements that employees responded to (from “strongly disagree” to “strongly agree”) along with some open-ended and demographic questions. This made up 75% of the overall score.                    The winners outperformed on specific offerings including employee satisfaction with tuition reimbursement benefits, retirement plan benefits and health care coverage.                    Those three benefits—tuition, retirement, health care—were significant differentiators in the employee survey, scoring the biggest difference in positive responses between staffers who worked at winning companies and staffers who worked at companies that didn’t make the ranking.                    Among winners, 94% offered a 401(k) retirement plan, 30% had an employee stock ownership plan and 22% had a profit-sharing plan.                    Beyond positive perceptions about pay and benefits, employees at winning workplaces gave their companies high marks on key points including:
                                            “This organization provided as much initial training as I needed.”                        “This organization provides as much ongoing training as I need.”                        “Deadlines at this organization are realistic.”                        “Staffing levels are adequate to provide quality products/services.”                        “This organization helps me pursue a career path that aligns with my skills and interests.”                        “This organization encourages me to develop professionally and/or acquire new skills.”                        “Most days, I look forward to going to work.”                        “At this organization, employees have fun at work.”                        “This organization effectively communicates its progress towards meeting departmental goals.”                        “I have a good understanding of how this organization is doing financially.”                        “My job provides me with a sense of meaning and purpose.”                        “I am able to maintain a reasonable balance between work and my personal life.”                    
                    The employee survey covered pay and benefits and seven other core focus areas. The best companies did better than the rest in all of these areas.                    The area of pay and benefits proved to be the biggest differentiator based on employee responses, with a 6.5-point advantage in the percentage of positive responses for winners versus companies in the competition that didn’t make the ranking.                    The best places outscored other workplaces by about 5 percentage points in training, development and resources. The winners bested other workplaces by about 4 percentage points in four areas: corporate culture and communications, leadership, overall engagement and role satisfaction.                    The two remaining areas—work environment and relationship with supervisor—were smaller differentiators for the best companies versus others.
                    How employers get the job done                    The employer questionnaire covered a company’s policies, practices, benefits and demographics. This made up 25% of the overall score.                    The winning companies outscored other entrants in such areas as:
                    Pay and benefits:                                            Tuition reimbursement.                        Allowing employees additional paid time off for community service activities or volunteer work.                        Paid sabbaticals.                    
                    Diversity:                                            Diversity and inclusion programs (84% of the winners have a diversity and inclusion task force or committee).                        Ongoing diversity training.                    
                    Recruitment, training and development:                                            Formalized programs/practices for succession planning.                        Recruitment and retention programs for older workers, veterans, employees who may require accommodations for mental or physical limitations and employees of varying ethnic and cultural backgrounds.                    
                    Work-life balance:                                            Option to work flexible hours or a compressed work week.                        Financial education workshops, seminars or classes.                        Meetings and staff-only events are limited to work hours only.                        On-site personal development and/or stress management workshops, seminars or classes.                    
                    Virtually all of the winning companies offer telecommuting options for employees. A handful of the winners have embraced a 100% remote workplace while finding ways for employees to connect.                    For example, San Diego-based NP Digital operates on a 100% remote basis in the U.S. The digital agency has in-office options in some locations for employees who prefer them, and it provides for local meet-ups in states where it has large groups of staffers to encourage team connection.                    MNTN calls Austin, Texas, its headquarters, but the ad tech company embraces a fully remote workforce. New York-based Goodway Group also is a fully remote organization; the digital agency holds two all-company summits a year so staffers can connect, learn, work and be social.                     On average, about 80% of employees at Ad Age Best Places winners were telecommuting in 2023, down from 100% after the COVID-19 pandemic began in March 2020 but far above these companies’ pre-pandemic telecommuting level of 13%.
                    Winning ideas                    The 50 winners earned their spots in Ad Age Best Places to Work 2024 based on their strong scores in the employee survey and employer questionnaire. Among all the winners, here are a few ideas that stood out:
                    Transparency: Promoting clear communication on what’s up, and down, with the business is a common theme among the winning companies.                    “Want to be a great place to work?” Signal Theory, a Kansas City, Missouri, ad agency, said in its award entry. “Stop being mysterious. Tell people how decisions get made, how things work and how those things relate to the values you tout. … Transparency trumps all the ping-pong tables, massage chairs, parties and ‘creative’ perks in the whole wide world of advertising.”                    Sharethrough, a Montreal-based ad tech firm, said transparency “creates trust and a sense of shared purpose among our team.”                    “We understand the importance of open communication, especially in times of change and adversity,” Sharethrough said in its entry. “We make every effort to be transparent with our employees, keeping them informed about our business’s challenges, successes and strategies.”                    High Wide & Handsome, a Los Angeles ad agency, touts its “extreme financial transparency.”                    “Every quarter we open our books to the entire staff, sharing everything from our profit and forecast to our bank balances, accounts receivable, accounts payable, 12-month rolling trends, comparisons to previous quarters and more,” High Wide & Handsome said. “As a result, our employees never go to sleep wondering about the solvency of the agency or the security of their jobs.”
                    Paid sabbaticals: Almost one-third of the winning companies offer paid sabbaticals.                    Basis Technologies, a Chicago-based ad tech firm and the No. 1 Best Place to Work among companies with more than 200 employees, offers a three-week fully paid sabbatical after every four years of service.                     Signal Theory gives employees a four-week paid sabbatical at their eight-year anniversary mark and every five years after that. Spectrum Science, a Washington-based health care agency, and Goodway offer employees a four-week sabbatical every seven years.
                    Perks that work: The best workplaces deliver on the basics of good compensation and benefits such as health care insurance, but many of the winners go above and beyond.                    Among the 50 companies, 15 pay 100% of health care premiums for employees; some also pay 100% of premiums for dependents. Noble Studios, a digital agency in Reno, Nevada, said: “We proudly pay for 100% of medical insurance premiums so employees and families can access care without financial barriers.”                    Beyond solid benefits, many winners offer standout special perks. MNTN gives employees a $2,000 annual vacation allowance. That jumps to $5,000 once a team member reaches the five-year mark, and the allowance then grows each year with no cap.                    There is such a thing as a free lunch. Once employees reach their 10-year anniversary, High Wide & Handsome provides a “Lunch for Life” credit card with no daily spending limit—free lunch, five days a week, 52 weeks a year, for as long as staffers stay at the agency.

                                                                About Ad Age Best Places to Work 2024                        The Ad Age Best Places to Work 2024 competition was open to agencies, ad tech firms, data and research firms, brand or corporate marketing departments or groups and marketers’ in-house agencies.                        To be eligible, a company must have headquarters in North America (U.S. and Canada), or have a North America headquarters or main office if world headquarters is outside of North America; a minimum of 15 full-time employees in North America; and be in business a minimum of one year.                        Is your company a contender for Ad Age’s next Best Places ranking? We will publish Ad Age Best Places to Work 2025 in January 2025 with a new partner, Workforce Research Group. Registration will open in May 2024.                    
                
                                
