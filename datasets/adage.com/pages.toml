full_description = "Special Report: Super Bowl Super Bowl 2024 ad review—the best and worst commercials from the Big Game The best ads featured an array of tones and styles By Tim Nudd. Published on February 11, 2024. share-arrow-solid Share article Share a link to this article that only Ad Age subscribers can access READ THIS NEXT Amp spotlight: What Super Bowl 2025 ads tell us about the state of advertising Michael Cera pitches an ad to CeraVe executives in the skin care brand’s Super Bowl commercial. Credit: CeraVe /* The modal styles */ img.theScore { height: 35px; } .brightCoveVidBoxLink { cursor: pointer; color: white; display: inline-block; background-color: black; font-family: 'Outsiders Bold'; font-size: 12px; padding: 12px 22px 11px; } .modalWrap { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1001; } .modalContainer { width: 100%; height: 100%; display: flex; position: relative; justify-content: center; } .modal { max-width: 1000px; width: 100%; position: absolute; top: 15%; } .closeModal { position: absolute; bottom: calc(-35% + 6vw); left: calc(50% - 50px); font-size: 2rem; display: inline-block; background-color: #000; color: white; padding: 10px; font-family: 'Retina Black'; } /* .closeModal { position: absolute; bottom: 15%; font-size: 2rem; display: inline-block; background-color: #000; color: white; border-radius: 16px; padding: 10px; font-family: 'Retina Black'; } */ .overlay { background-color: rgba(0, 0, 0, .65); position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1000; } .show { display: block; } .hide { display: none; } .secondHalf { display: block; } Close Commercials are interruptive, but one night a year, consumers welcome them in. It’s a great opportunity for brands, agencies and production companies to strut their stuff—to show what the ad industry can do creatively and for business. So, how did they fare during Super Bowl LVIII? Also read: The top 5 Super Bowl campaigns And: Top 10 most-liked Super Bowl ads We got glimpses of greatness. We got a few stinkers. We had a smorgasbord of food advertisers and a soup of celebrities. It was a generally strong night for automakers. It was less so for candy brands (with one notable exception). The best ads featured an array of tones and styles, with half of our Top 10 being comic spots and the other half taking a more serious tone. :root { --AdAge-RetBlack: 'Retina Black'; --backColorCTA: #ffdd1e; } div.recirculationCTA { background-color: var(--backColorCTA); padding: 20px; width: 100% !important; margin-bottom: 40px; } .recirculationCTA h2 { font-family: var(--AdAge-RetBlack); font-size: 1.4rem; margin-bottom: 10px; text-transform: none; } .recirculationCTA a { color: black; text-decoration: underline; font-family: var(--AdAge-RetBlack); } .recirculationCTA li { font-family: var(--AdAge-OutBold); font-size: 1.2rem; margin-bottom: 10px; } .recirculationCTA span { font-family: var(--AdAge-RetBlack); font-size: 1.1rem; margin-bottom: 5px; } div.recirculationCTA.grid { display: grid; grid-template-columns: 1fr minmax(150px, auto); } .grid-col-1 { grid-column: 1 / 2; } .grid-col-2 { grid-column: 2 / 3; justify-self: end; align-self: center; } .recirculationCTA .recirculationBtn { background: #000; border-radius: 0; height: 45px; line-height: 45px; display: inline-block; } .recirculationCTA .recirculationBtn span { font-family: 'Outsiders Bold'; font-size: 12px; color: #fff; padding: 0 15px; line-height: 45px; } @media only screen and (max-width: 768px) { div.recirculationCTA.grid { grid-template-rows: 1fr auto !important; grid-row-gap: 1rem !important; } .grid-col-1 { grid-column: 1 / 3 !important; } .grid-col-2 { grid-column: 1 / 3 !important; justify-self: start !important; } .recirculationCTA .grid-col-1 span { font-size: 1rem !important; } } Super Bowl commercials Tracking the latest brand and agency plans Enter here We saw tried-and-true formulas (which sometimes worked, and often didn’t). We saw some more inventive ideas. And we even had an experimental spot or two, which is always good to see. See below for our annual review of which brands were worth the interruption—and which turned out to be unwelcome guests. CeraVe ‘Michael CeraVe’ Agency: Ogilvy PR North America This whole “Michael CeraVe” campaign has been pretty special. Following some well-placed paparazzi-style social teasers in recent weeks—including Cera writing his name on CeraVe bottles in a pharmacy—the skincare brand’s Super Bowl spot extends the gag, with hilarious results. Directed by Tim & Eric (Tim Heidecker and Eric Wareheim), most of the spot mirrors the teaser from earlier in the week, with Cera absurdly claiming to have developed CeraVe. What’s new is the ending, where he pitches his idea to the brand’s stone-faced execs. The faux-perfume-ad vibes of the video are hilarious—seeing him free-solo rock climb with hand lotion is one of the funniest moments of any ad this year. And the conference room scene is the perfect capper. “My name is Cera,” he explains eagerly. “It’s a perfect crossover opportunity.” The funny thing is, yes, it’s a joke—but it’s also not a joke. It is a perfect crossover opportunity, as they’ve proven throughout the campaign. The idea here isn’t new—Bubly did it with Michael Bublé in 2019—but it’s executed flawlessly with layered humor that feels modern but also lighthearted and not overly concepted. It’s silly and smart at the same time, with great extensions beyond TV—one of the most fully realized campaigns this year. View ad Dunkin’ ‘The DunKings’ Agency: Artists Equity Dunkin’ follows up last year’s Ben Affleck/Jennifer Lopez spot, in which he was manning the drive-through (for real) at a Medford, Massachusetts, location and she showed up as a customer, by flipping the script—and getting ridiculously, comically goofy. This time, it’s Affleck showing up at Lopez’s place of work—a recording studio—with pals Tom Brady and Matt Damon. (Jack Harlow tries to stop Affleck from going in, but he’s undeterred.) Dressed in garish orange-and-pink Dunkin’ outfits, they call themselves the “DunKings” and launch into a horrible, heavily Boston-accented rap—which they’re hoping she’ll include on her album. She’s (obviously) horrified. An earlier spot on the Grammys introduced the idea of Affleck trying to be a pop star—this sequel (directed by Affleck and Brandon Pierce, aka Beedy) continues the story nicely. The cringey humor is actually funny, and the celebs are put to good use—with Affleck again being surprisingly self-deprecating, funny reaction shots from J. Lo, and Brady and Damon shining in supporting roles. J. Lo might not care for them, but maybe there’s a future for these DunKings in the music biz. Or at least in another commercial down the line. View ad Read more about the ad here Google Pixel 8 ‘Javier in Frame’ Agency: In-house, Gut Miami Google has a long history of emotional Super Bowl spots, from “Parisian Love” to “Loretta.” Its latest offering, “Javier in Frame,” isn’t quite as much of a tearjerker, but makes up for it with its inclusivity and warmth. Directed by blind filmmaker Adam Morse, the 60-second spot highlights the Google Pixel 8 smartphone’s Guided Frame feature, which helps visually impaired people take photos. The first-person perspective and blurry visuals stand out and give the viewer a sense of what it’s like to be visually impaired—a welcome exercise in empathy on advertising’s biggest stage. While not the most emotional story Google has ever told, it’s a lighthearted and effective framing of the company’s mission to make people’s lives better, in small ways, through technology. View ad NFL ‘Born to Play’ Agency: 72andSunny The NFL takes the joyful, inclusive exuberance of last year’s “Run With It” Super Bowl spot and extends it with “Born to Play,” another wonderful two-minute production by 72andSunny. This time we travel all the way to Ghana for the story of Kwesi, a boy who dreams of being a pro football player—the American kind of football. As he tears around his home and through the bustling markets of Accra (there are echoes of the NFL’s 2020 “Take It to the House” spot in here), he imagines himself in the NFL as Saquon Barkley, Justin Jefferson and Cameron Jordan make cameos. But they’re figments of his imagination—a boy daydreaming of the impossible. Soon, though, he stumbles upon an NFL camp in town and meets Osi Umenyiora, the British-Nigerian former NFL player—the ad is about how the NFL is developing talent globally these days—and things get real. The spot is beautifully done—a cheerful action film and heartfelt underdog story all in one. Plus, it’s great to see a rich and resonant African story—crafted by a Black director (Andrew Dosunmu of Little Minx), an entirely Black cast and a mostly West African crew—on America’s grandest telecast. Entertainment and purpose aren’t easy to merge. The NFL is doing it admirably. View ad Read more about the ad here Reese’s ‘Yes!’ Agency: Erich and Kallman Let’s get this out of the way before we start: Not everyone will like, never mind love, this ad. It’s yelly. It’s violent. It’s weird. It’s also, I’d argue, brilliant. Let’s break it down: First of all, you rarely see truly absurdist advertising on the Super Bowl—stuff that’s so offbeat, it’s polarizing. It’s too risky. Yet this is that rare beast, and it immediately stands out as a result. Second, it’s perfect for the Super Bowl—indeed, it plays like a parody of Super Bowl ads, taking the slapstick violence of Big Game ads to its logical, extreme conclusion. (It even feels like a parody of the Super Bowl ad-watching experience—with our motley crew of characters paying unusually close attention to everything the brand is saying, and having oversized reactions to it.) Third, the details are amazing. There are seven characters doing nutty things across four scenes—that’s 28 funny things in 30 seconds. You could watch it half a dozen times and not catch everything. (The character arcs are amusing, too, from the dude sticking his face in different foods, to the woman leaping in and out of the window, to the older woman and couch guy who suddenly decide to get it on at the end. Amid the chaos, there’s surprising character development!) Finally, for all its weirdness, the spot feels strategically sound. It’s chock full of product close-ups, and the humor feels spot-on for Gen Z and Gen Alpha (the candy eaters among us). It’s great to see an absurdist spot like this succeed on so many levels. Nice work by agency and client—and director Harold Einstein—getting this gem on the game. View ad Verizon ‘Can’t B Broken’ Agency: Ogilvy In the epic Super Bowl LVIII face-off between Tay Tay and Bey, who won? Well, Taylor Swift did get repeated screen time as she cheered on her boyfriend Travis Kelce from the sidelines—lots of sweet, sweet earned media right there. But Beyoncé got a whole-ass Verizon Super Bowl commercial—paid media that really paid off. The conceit: “Beyoncé breaks the internet, but can she break Verizon?” In the 60-second spot, the pop superstar is seen introducing “Beyonc-AI” (an AI-powered robot) and “BarBey” (a Beyoncé Barbie doll), launching her BOTUS campaign (“I’m running for Beyoncé of the United States”) and more—but none of it breaks Verizon’s “crazy powerful” 5G network. “OK, they ready,” Beyoncé says near the end of the spot. “Drop the new music!” Yep, Queen Bey leveraged the Super Bowl for a stealth product launch—for her country-themed “Renaissance Part II” album. Now, one could argue that Taylor got there first—last week she used the Grammys to announce her next album—but there’s no bigger platform than the Super Bowl. Then again, Taylor—er, Travis—won the actual Super Bowl, so ... View ad Volkswagen ‘An American Love Story’ Agency: Johannes Leonardo Volkswagen has been out of the Super Bowl for a dozen years, but what a lovely return this was. The 60-second spot is almost entirely historical—beginning 75 years ago, in 1949, with the Beetle’s arrival in America—but features mostly new footage shot period-style by Lance Acord. As Neil Diamond’s 1971 track “I Am ... I Said” builds to a crescendo, the action follows the Beetle, VW Bus and other models from postwar showrooms to Woodstock to “The Simpsons” and beyond. After their wedding, a lesbian couple drive off in a Tiguan (model year 2013—the same year the U.S. Supreme Court made two landmark rulings extending gay marriage rights). Kids dress up as Darth Vader at a convention—a reference to VW’s classic “The Force” ad from the 2011 Super Bowl (also directed by Acord). At the end, we get just a glimpse of the future—VW’s electric ID Buzz, coming this year. It’s strange that this ad works so well—the Beetle was discontinued in the U.S. in 2019, after all. But it does a great job of combining a sweeping legacy statement with a product tease—and in such an uplifting way. One of the most heartwarming, feel-good spots of the night. View ad BMW ‘Talking’ Like Walken’ Agency: Goodby Silverstein & Partners BMW delightfully tweaks the celebrity formula in this excellent :60 from GS&P and director Bryan Buckley, showing Christopher Walken being accosted wherever he goes by people doing impressions of him. There’s a shared public fascination with Walken impressions, but it’s still an unexpected approach—kudos to the client for approving an idea where its expensive talent is mostly reacting, not pontificating. What great reactions they are, though—the actor’s charming annoyance is way cooler and more authentic than when brands try to match his eccentricity by giving him weird scripts. The spot is also admirably light on product (while not forgoing sheet metal entirely), and Walken’s end line, “The rest are just imitations,” puts a nice bow on things. Usher’s appearance is totally shoehorned in, but not even that can dent the entertainment value of one of the night’s best spots. View ad Dove ‘Hard Knocks’ Agency: Ogilvy Here’s a spot that’s simple, straightforward and affecting: Dove’s latest work to support girls’ self-esteem, this time in sports. Directed by Lucy Bridger, the ad is built around a somber statistic: that 45% of girls quit sports by age 14. But most of the spot is anything but doom and gloom. It begins with home-movie footage of girls falling down—with a smile—as they compete in sports, with “It’s the Hard-Knock Life” from “Annie” playing infectiously in the background. Only in the middle do we take a brief detour. “The knocks don’t stop girls playing sports. Low body confidence does,” the ad says, as a girl in a swimsuit eyes her reflection nervously. But we quickly return to a sense of hope and vitality, as the text mentions Dove and Nike’s Body Confident Sport program—and the girl quickly sprints off and cannonballs into a pool. The problem of girls quitting sports by the end of puberty is hardly new (P&G’s Always built a campaign around the same topic in 2016), but it’s nice to see Dove and Nike picking up the cause—and promoti"
