["https://adamsilver.io/blog/user-interfaces-hiding-content-should-be-a-last-resort"]
title = "User interfaces: hiding content should be a last resort – Adam Silver – designer, London, UK"
description = "So much time is spent coming up with innovative ways to hide content. But hiding content should be a last resort."
full_description = "4 March 2019 User interfaces: hiding content should be a last resort A disproportionate amount of time is spent designing complex interactions that hide content at the cost of usability. Links are hidden within menus; hints behind tooltips; images in carousels; all sorts inside accordions and tabs; and labels inside inputs. When we hide content, there’s a greater risk users won’t see it. There’s a higher reliance on digital literacy and it’s generally more labour intensive for users. There’s also a widespread assumption that splitting content across pages is bad even when it mostly improves the experience. In my experience, content is hidden because: people mistake ‘clicking’ for ‘engaging’ people are trying to win an award for minimalism people are trying to find ways to declutter an interface people are trying to genuinely improve the experience Only the last point is of value to users. In The Life Changing Magic of Tidying Up, Marie Kondo says: “Effective tidying involves only two essential actions: discarding and deciding where to store things. Of the two, discarding must come first.” I’ll rewrite her quote and apply it to design. “Effective design involves two essential actions: discarding the superfluous and deciding where to put things. Of the two, discarding must come first.” This means we have to push back against everyone’s natural inclination to add more stuff onto a page. And instead, do the hard work to cut content to its irreducible core and then just show it. When all that remains is essential, there’s less to read and less of a need to resort to patterns that hide content. Both of which improves the experience for users. ↓Design tips to help you create products that are ridiculously simple and accessible to use Join 8,500+ designers, content designers and engineers who get my free weekly newsletter with evidence-based design tips (in 3 minutes or less). Mostly forms UX, but not always. First name Email address"
