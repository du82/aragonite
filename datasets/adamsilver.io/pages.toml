13 April 2020              Rules for cookie banners"""
full_description = "13 April 2020 Rules for cookie banners Alistair Laing did a show and tell a few weeks back on the awesome cookie banner work he did for the Find postgraduate teacher training service. Here’s what I noted. You must: Tell people the cookies are there Explain what the cookies are doing and why Get the user’s consent to store a cookie on their device You can still use cookies without asking for consent if they’re absolutely necessary. For example, if users need to login or if they need to add items to their shopping cart. Read more about cookies ↓Design tips to help you create products that are ridiculously simple and accessible to use Join 8,500+ designers, content designers and engineers who get my free weekly newsletter with evidence-based design tips (in 3 minutes or less). Mostly forms UX, but not always. First name Email address"
