["https://adamsilver.io/blog/always-use-a-label"]
title = "Always use a label – Adam Silver – designer, London, UK"
description = """
1 July 2016              Always use a label"""
full_description = "1 July 2016 Always use a label Designers love to remove labels from inputs to save space and create a minimal aesthetic. But minimal doesn’t always mean simple. And in the case of labels they improve UX because: sighted users can see them. visually-impaired users can hear them with a screen reader. motor-impaired users can more easily set focus to the input due to the larger hit area. (Clicking a label moves focus to the field). Let’s take a look at two examples whereby labels are ditched at the expense of users. Example #1: An add to basket form Sometimes the first option in a select box is used as a makeshift label like ASOS: The select box has no label This is probably enough for sighted users when an option hasn’t been selected. But, when an option has been selected, it’s hard to understand as is the case with the colour menu shown above. Motor-impaired users will find it harder to select the field due to the smaller hit area. Screen reader users will struggle to understand what’s going on because the options are a mix of instructions and options to pick. Example #2: A search form Here’s Selfridges’ search form which uses placeholder text as a makeshift label to save space: The search field is missing a label Sighted users may be able to manage with this but really placeholders are problematic for many reasons. Motor-impaired users will find it harder to select the field. Screen reader users will find it difficult because placeholder text isn’t announced. If a foreigner wants to translate the page using the browser’s translation routine, the placeholder is ignored. Just don’t mess with labels. ↓Design tips to help you create products that are ridiculously simple and accessible to use Join 8,500+ designers, content designers and engineers who get my free weekly newsletter with evidence-based design tips (in 3 minutes or less). Mostly forms UX, but not always. First name Email address"
