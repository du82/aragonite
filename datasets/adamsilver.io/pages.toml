["https://adamsilver.io/blog/the-hidden-cost-of-one-bad-design"]
title = "The hidden cost of one bad design – Adam Silver – designer, London, UK"
description = """
14 November 2015              The hidden cost of one bad design"""
full_description = "14 November 2015 The hidden cost of one bad design I once worked on a project where users wanted to pay using PayPal. We designed this: Payment options page The business blocked the design because it was too easy to select PayPal. This is because we received a 50p transaction fee when users paid by card. We we’re asked to put the PayPal option behind a click-to-reveal pattern encouraging users to choose card. But, the hidden costs of doing this add up to way more than 50p per order. Unhappy users use the service less or use competing services instead. They also stop recommending the service to their friends and family. So, if you’re going to introduce a feature and make it hard to use, don’t bother. ↓Design tips to help you create products that are ridiculously simple and accessible to use Join 8,500+ designers, content designers and engineers who get my free weekly newsletter with evidence-based design tips (in 3 minutes or less). Mostly forms UX, but not always. First name Email address"
