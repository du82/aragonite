["https://adamsilver.io/blog/the-problem-with-disabled-buttons-and-what-to-do-instead"]
title = "The problem with disabled buttons and what to do instead – Adam Silver – designer, London, UK"
description = """
14 May 2023              The problem with disabled buttons and what to do instead"""
full_description = "14 May 2023 The problem with disabled buttons and what to do instead In 2009 I prototyped a form that disabled the submit button until all the answers were valid. The idea being: the best error is the one the user never sees. But disabled buttons takes this rule to the extreme. And as a result it can frustrate users or worse, cause them to give up completely. Here’s why: Problem #1: They don’t give feedback When a form has mistakes, the user has to look at each field, spot a mistake and work out how to fix it. Kotak Bank’s disabled button does not give feedback Problem #2: They make the interface feel broken If the user thinks their answers are valid, the UI may feel broken. If there are multiple errors and 1 is fixed, the button stays disabled. This feels unresponsive. WeTransfer disabled button feels broken Problem #3: They’re hard to see Disabled buttons have low contrast to signify they’re disabled. But this makes them hard to read, especially for users who have visual impairments. Kotak Bank’s disabled button is hard to see Problem #4: They’re not focusable This means keyboard users won’t be able to tab to the button. And users with poor vision won’t see the button. This is confusing as most users expect to find a button to illuminate a clear path to proceed. Kotak Bank’s disabled button cannot be focused Problem #5: They’re deceptive While disabled buttons have low contrast to signify that they’re disabled. It’s not always obvious. So some users still try and click them. Facebook’s form to create a post may be too subtle Problem #6: Users may not notice the button becoming enabled This is because the button may be off screen (due to screen size or the length of the form). And if the button is on screen, users are focused on filling out the fields, not the button changing state. Ebay’s button is out of view “Just validate as the user types” No. Live validation is problematic. And it doesn’t solve all of the problems. What to do instead Just enable the button. Sadly it’s not as simple as that. But if you’re looking for a user-friendly pattern to help users recover from errors - one I’ve used since 2008 with zero issues in user research - you might like my course, Form Design Mastery: https://formdesignmastery.com ↓Design tips to help you create products that are ridiculously simple and accessible to use Join 8,500+ designers, content designers and engineers who get my free weekly newsletter with evidence-based design tips (in 3 minutes or less). Mostly forms UX, but not always. First name Email address"
