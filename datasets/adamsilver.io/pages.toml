["https://adamsilver.io/blog/the-problem-with-disabling-paste-and-what-to-do-instead"]
title = "The problem with disabling paste and what to do instead – Adam Silver – designer, London, UK"
description = """
6 August 2023              The problem with disabling paste and what to do instead"""
full_description = "6 August 2023 The problem with disabling paste and what to do instead Disabling paste is usually done in the name of security. For example, let’s say the user has to type their email address twice. Using 2 separate inputs means a mismatch can be caught. But that doesn’t work if they paste an error from the first input into the second. But disabling paste degrades UX and is a terrible way to stop users from making mistakes. Here’s why: Problem #1: It makes the interface feel broken This is because users expect to be able to paste but instead it just gets ignored with no feedback. Trying to paste into the password field gets ignored as paste is disabled Problem #2: It slows users down This is because the user has to type everything again from scratch. User has to type the password manually because paste is disabled Problem #3: It increases the chance of error This is because typing manually increases the chance of a mistake. Give users control and let them check their answers The way you do this will be different depending on what the user is trying to do. ↓Design tips to help you create products that are ridiculously simple and accessible to use Join 8,500+ designers, content designers and engineers who get my free weekly newsletter with evidence-based design tips (in 3 minutes or less). Mostly forms UX, but not always. First name Email address"
