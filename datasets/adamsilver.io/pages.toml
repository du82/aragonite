22 November 2022              Page title conventions"""
full_description = "22 November 2022 Page title conventions A page title or document title describes a web page. It’s the content that is placed inside the <title> element and appears in the browser window or tab. The title is important because: it’s the first thing to be announed in screen readers it distinguishes your website from other open websites it helps search engines to index your website I recommend the following structure with hyphens inbetween: name of page (usually the h1 heading but not always) section name (if applicable) name of service Here are some examples based on Amazon’s website. Page Page title Home page Amazon Your account Your account - Amazon Orders Orders - Your account - Amazon Books Books - Amazon Atomic Habits book Atomic Habits, James Clear - Books - Amazon ↓Design tips to help you create products that are ridiculously simple and accessible to use Join 8,500+ designers, content designers and engineers who get my free weekly newsletter with evidence-based design tips (in 3 minutes or less). Mostly forms UX, but not always. First name Email address"
