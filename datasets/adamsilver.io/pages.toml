["https://adamsilver.io/blog/how-to-avoid-optional-form-fields-with-a-conditional-reveal"]
title = "How to avoid optional form fields with a conditional reveal – Adam Silver – designer, London, UK"
description = """
5 February 2019              How to avoid optional form fields with a conditional reveal"""
full_description = "5 February 2019 How to avoid optional form fields with a conditional reveal The first rule of form design is to only ask for information you actually need to give users a good experience. But sometimes asking for additional information helps the user. Now you could just mark the field as optional. But a lot of the time this is not the best UX. For example, let’s say the user is applying for a new passport. And lets say that some users want to get delivery updates sent by text message… You could just ask for the user’s mobile phone number and mark it as optional: Asking the user for their mobile number and explaining why with hint text This looks well designed with a clear label and hint text explaining why the user would want to enter the phone number. But I know from years of research that not all users will spot or read the hint text. As a result there’s a risk users will not get updates even if they want them. Here’s the solution: Start by asking the user if they want to get delivery updates. And if they say yes ask for the mobile phone number: Conditionally revealing a form field based on selected radio buttons Now there’s no optional fields. And no risk of users missing the chance to get delivery updates by text message. If you’d like to learn how to design forms that users fly through without doing years of research, you might like my course, Form Design Mastery. I cover two other (better) ways to avoid optional fields: https://formdesignmastery.com ↓Design tips to help you create products that are ridiculously simple and accessible to use Join 8,500+ designers, content designers and engineers who get my free weekly newsletter with evidence-based design tips (in 3 minutes or less). Mostly forms UX, but not always. First name Email address"
