["https://adamsilver.io/blog/3-common-examples-of-button-text-that-degrades-ux-and-how-to-rewrite-them-so-theyre-clear"]
title = "3 common examples of button text that degrades UX and how to rewrite them so they’re clear – Adam Silver – designer, London, UK"
description = """
17 September 2023              3 common examples of button text that degrades UX and how to rewrite them so they’re clear"""
full_description = "17 September 2023 3 common examples of button text that degrades UX and how to rewrite them so they’re clear A lot of designers love to save space at the cost of clarity and prioritise aesthetics over content. But once you nail the foundational interaction design patterns, content is often the most important part of design. Button text is a perfect example of this. Once you design your buttons, it’s time to focus on the text. Now on the one hand it’s so subtle that it’s barely worth discussing. But on the other hand, the small details matter. And once you follow the rules it’s only slightly more effort to get it right than it is to get it wrong. And yet there are a lot of badly described buttons out there. Here’s 3 common examples: Example #1: “Next” Using a next button in a multi-step form flow “Next” is used a lot in multi-step form flows. But this is inconsistent with most buttons and calls to actions which are usually written as verbs. Using a verb also means you can use multiple actions together. For example, it’s useful to label the button “Save and continue” where the user’s answers are saved during each step of the flow. “Save and next” doesn’t make sense. Example #2: “Done” Using a done button to close the edit note screen “Done” is often used at the end of a flow or on edit screens. But it lacks clarity and it doesn’t clearly communicate what action the user is about to take. Consider something like “Return to notes” or “Close note” instead. Example #3: “OK” Using an OK button to close the dialog “OK” is often used in dialogs and banners as a way to close them. But it’s ambiguous and unclear what will happen as a result of clicking it. Consider “Close” or “Agree and close” instead. ↓Design tips to help you create products that are ridiculously simple and accessible to use Join 8,500+ designers, content designers and engineers who get my free weekly newsletter with evidence-based design tips (in 3 minutes or less). Mostly forms UX, but not always. First name Email address"
