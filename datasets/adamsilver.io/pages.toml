["https://adamsilver.io/blog/losing-is-part-of-being-a-designer"]
title = "Losing is part of being a designer (but that doesn’t have to be you) – Adam Silver – designer, London, UK"
description = """
29 July 2024              Losing is part of being a designer (but that doesn’t have to be you)"""
full_description = "29 July 2024 Losing is part of being a designer (but that doesn’t have to be you) Last Sunday I took a break from being a designer to play in the tennis men’s open singles finals. Sadly, not Wimbledon. Just at my local club in North London. Here’s how it went: I lost the first set 4-6 I won the second set 6-3 I lost the final set 1-6 Even though I lost, I was happy. Why? Because I didn’t expected to win. My opponent was the clear favourite and last year’s champion. So everyone including me had low expectations. I went out there without much pressure and just tried to enjoy the experience. But here’s the thing: When you feel less pressure you tend to play better. But this doesn’t just apply to tennis. It also applies to design. Let me explain… Here’s your typical design process (you won’t like it): You find a problem You look at the data You run some research You design a solution Next your design gets shipped to production. Except it doesn’t because: A stakeholder says they don’t like it or it’s not worth the effort. A developer mutilates your design to make it quicker to build. A product manager slices it up into something he calls a minimal viable product where the ‘viable’ is no longer part of the equation. It’s fine though because he says he’ll put it on the backlog (never to be seen again). So you bitch and moan to the few people on your team who get it. But bitching and moaning doesn’t actually get you anywhere. So what do you do? You acknowledge that: Losing is part of the job This is a good thing. Because when you realise that being challenged and ignored is part of the job it takes the pressure off and you do better. But how do you actually take this realisation and apply it in the workplace? Follow these 3 simple steps: Step #1: Accept that stakeholders and colleagues will disagree with you Most stakeholders and teammates don’t know what good design is. But they’ll act like they do. That’s okay though, because you’re expecting it. Also, it’s no bad thing because at least they care, so you can work with that. Step #2: Focus on the process, not the outcome If you focus on the outcome (that your design will get shipped), when stakeholders and teammates question you, you’ll get pissed off. If you get pissed off, you’ll communicate badly. If you communicate badly, you’ll lose trust. Goodbye outcome. But as you’re expecting it, you’ll be calm, you’ll communicate well, you’ll gain trust. Step #3: Know what your stakeholders and teammates will say Your stakeholders and teammates are going to say the same thing. “It’s not important” “It’s too much effort” “[Sh*tty pattern] is the best because Google uses it” If you know what stakeholders are going to say, you’ll have a better chance of explaining why your design is the right way to go. And why theirs isn’t. If you’d like some help with the last part, you might like my course Form Design Mastery: https://formdesignmastery.com ↓Design tips to help you create products that are ridiculously simple and accessible to use Join 8,500+ designers, content designers and engineers who get my free weekly newsletter with evidence-based design tips (in 3 minutes or less). Mostly forms UX, but not always. First name Email address"
