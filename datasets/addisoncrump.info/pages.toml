["https://addisoncrump.info/publications/talks/tobunderutilised"]
title = 'Trail of Bits "Lunch and Learn": Underutilised Fuzzing Strategies for Modern Software Testing · Addison Crump'
description = "Homepage for Addison Crump"
full_description = "Talk is available online on YouTube. Slides are available on Google Slides. Abstract Fuzzing is a well-researched and understood concept, but so little of its potential is leveraged. Throughout the talk, I introduce key features of LibAFL being used to research the frontier of fuzzing. We will use this to explore the power and problems of alternative fuzzing oracles. It is my hope that listeners walk away with a shift in perspective regarding the use of fuzzing and with excitement for its future potential."
