["https://addisoncrump.info/publications/talks/vector-acs"]
title = "Vector Automotive Cybersecurity Symposium: To Fuzz, or Not To Fuzz · Addison Crump"
description = "Homepage for Addison Crump"
full_description = "Video is available on YouTube. Presentation slides are available on Google Slides. Abstract Fuzzing is beautiful: powerful, automated, simple, elegant, and effective. Touted as one of, if not the, most powerful testing strategy available, fuzzing has seen widespread use and been the subject of great research in both industry and academia. Yet, what is fuzzing, and how is it actually used? What are the bounds of this powerful strategy, and what pitfalls do we see in practice? This talk aims to contextualise fuzzing in the broader testing domain, showing that it is one piece of the much larger puzzle."
