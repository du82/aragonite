["https://addons.mozilla.org/blog/tweak-twitch-betterttv-and-other-extensions-for-twitch-customization"]
title = "Tweak Twitch—BetterTTV and other  extensions for Twitch customization - Firefox Add-ons Blog"
description = "Customize chat, optimize your video player, auto-collect channel points, and much much more. Explore some of the ways you can radically transform your Twitch experience with a browser extension…  BetterTTV One of the most feature rich and popular Twitch extensions out there, BetterTTV has everything from fun new emoticons to advanced content filtering.  Key features: […]"
full_description = "Add-ons Firefox Add-ons Blog Tweak Twitch—BetterTTV and other extensions for Twitch customization Customize chat, optimize your video player, auto-collect channel points, and much much more. Explore some of the ways you can radically transform your Twitch experience with a browser extension… BetterTTV One of the most feature rich and popular Twitch extensions out there, BetterTTV has everything from fun new emoticons to advanced content filtering. BetterTTV by NightDevRecommendedEnhances Twitch and YouTube with new features, emotes, and more.Rated 4.6 out of 5Users: 468,971You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. Key features: Auto-collect channel pointsEasier-to-read chat interfaceSelect usernames, words, or specific phrases you want highlighted throughout Twitch; or blacklist any of those elements you want filtered outNew emoticons to use globally or custom per channelSee deleted messagesAnonymous Chat—join a channel without notice Alternative Player for Twitch.tv While this extension’s focus is on video player customization, Alternate Player for Twitch.tv packs a bunch of other great features unrelated to video streaming. Alternate Player for Twitch.tv by Alexander Choporov (CoolCmd)Alternate player of live broadcasts for Twitch.tv website.Rated 4.3 out of 5Users: 33,331You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. Let’s start with the video player. Some of its best tweaks include: Ad blocking! Wipe away all of those suuuuper looooong pre-rollsChoose a new color for the player Instant Replay is a wow feature—go back and watch up to a minute of material that just streamed (includes ability to speed up/slow down replay) Alternate Player for Twitch.tv also appears to run live streams at even smoother rates than Twitch’s default player. You can further optimize your stream by adjusting the extension’s bandwidth settings to better suit your internet speed. Audio Only mode is really great for saving bandwidth if you’re just tuning in for music or discussion. Our favorite feature is the ability to customize the size and location of the chat interface while in full-screen mode. Make the chat small and tuck it away in a corner or expand it to consume most of the screen; or remove chat altogether if the side conversation is a mood killer. Twitch Previews This is the best way to channel surf. Just hover over a stream icon in the sidebar and Twitch Previews will display its live video in a tiny player. Previews (For TTV & YT) by MarkMLive previews when hovering over streams on Twitch & YouTube | A bunch of quality of life improvements for TTV & YTRated 4.8 out of 5Users: 2,918You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. No more clicking away from the thing you’re watching just to check out other streams. Additional features we love include the ability to customize the video size and volume of the previews, a sidebar auto-extender (to more easily see all live streamers), and full-screen mode with chat. Mouse over a stream in the sidebar to get a live look with Twitch Previews. Unwanted Twitch Do you keep seeing the same channels over and over again that you’re not interested in? Unwanted Twitch wipes them from your experience. Unwanted Twitch by kwaschny.netHide unwanted streams, games, categories, channels and tags on: twitch.tvRated 4.1 out of 5Users: 5,693You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. Not only block specific channels you don’t want, but you can even hide entire categories (I’m done with dub step!) or specific tags (my #Minecraft days are behind me). Other niche “hide” features include the ability to block reruns and streams with certain words appearing in their title. Twitch Chat Pronouns What a neat idea. Twitch Chat Pronouns lets you add gender pronouns to usernames. Twitch Chat pronouns by Alejo PereyraAdd Pronouns to Twitch ChatRated 3.4 out of 5Users: 16,040You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. The pronouns will display next to Twitch usernames. You’ll need to enter a pronoun for yourself if you want one to appear to other extension users. We hope your Twitch experience has been improved with a browser extension! Find more media enhancing extensions on addons.mozilla.org. Updated July 26, 2021 By Scott DeVaney Avatar Share Twitter Pocket"
