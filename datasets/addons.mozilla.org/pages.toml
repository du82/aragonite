["https://addons.mozilla.org/blog/youtube-your-way-browser-extensions-put-you-in-charge-of-your-video-experience"]
title = "YouTube your way — browser extensions put you in charge of your video experience - Firefox Add-ons Blog"
description = "YouTube wants you to experience YouTube in very prescribed ways. But with the right browser extension, you’re free to alter YouTube to taste. Change the way the site looks, behaves, and delivers your favorite videos.  Enhancer for YouTube With dozens of customization features, Enhancer for YouTube has the power to dramatically reorient the way you […]"
full_description = '''Add-ons Firefox Add-ons Blog YouTube your way — browser extensions put you in charge of your video experience YouTube wants you to experience YouTube in very prescribed ways. But with the right browser extension, you’re free to alter YouTube to taste. Change the way the site looks, behaves, and delivers your favorite videos. Enhancer for YouTube With dozens of customization features, Enhancer for YouTube has the power to dramatically reorient the way you watch videos. Enhancer for YouTube™ by Maxime RFRecommendedTake control of YouTube and boost your user experience!Rated 4.7 out of 5Users: 673,152You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. While a bunch of customization options may seem overwhelming, Enhancer for YouTube actually makes it very simple to navigate its settings and select just your favorite features. You can even choose which of your preferred features will display in the extension’s easy access interface that appears just beneath the video player. Enhancer for YouTube offers easy access controls just beneath the video player. Key features… Customize video player size Change YouTube’s look with a dark theme Volume booster Ad blocking (with ability to whitelist channels you OK for ads) Take quick screenshots of videos Change playback speed Set default video quality from low to high def Shortcut configuration Return YouTube Dislike Do you like the Dislike? YouTube removed the display that revealed the number of thumbs-down Dislikes a video has, but with Return YouTube Dislike you can bring back the brutal truth. Return YouTube Dislike by Dmitry SelivanovRecommendedReturns ability to see dislike statistics on youtubeRated 4.7 out of 5Users: 802,829You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. “Does exactly what the name suggests. Can’t see myself without this extension. Seriously, bad move on YouTube for removing such a vital tool.” Firefox user OFG “i have never smashed 5 stars faster.” Firefox user 12918016 YouTube High Definition Though its primary function is to automatically play all YouTube videos in their highest possible resolution, YouTube High Definition has a few other fine features to offer. YouTube High Definition by Baris DerinRecommendedYouTube High Definition is a powerful tool that automatically plays all YouTube videos in HD, changes video player size, offers auto-stop and mute, and much more.Rated 3.8 out of 5Users: 170,339You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. In addition to automatic HD, YouTube High Definition can… Customize video player size HD support for clips embedded on external sites Specify your ideal resolution (4k – 144p) Set a preferred volume level Also automatically plays the highest quality audio YouTube NonStop So simple. So awesome. YouTube NonStop remedies the headache of interrupting your music with that awful “Video paused. Continue watching?” message. YouTube NonStop by lawfxRecommendedTired of getting that "Video paused. Continue watching?" confirmation dialog?This extension autoclicks it, so you can listen to your favorite music uninterrupted.Working on YouTube and YouTube Music!Rated 4.2 out of 5Users: 140,156You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. Works on YouTube and YouTube Music. You’re now free to navigate away from your YouTube tab for as long as you like and not fret that the rock will stop rolling. Unhook: Remove YouTube Recommended Videos & Comments Instant serenity for YouTube! Unhook lets you strip away unwanted distractions like the promotional sidebar, endscreen suggestions, trending tab, and much more. Unhook: Remove YouTube Recommended Videos Comments by UnhookRecommendedHide YouTube related videos, comments, video suggestions wall, homepage recommendations, trending tab, and other distractions.Rated 4.7 out of 5Users: 99,214You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. More than two dozen customization options make this an essential extension for anyone seeking escape from YouTube rabbit holes. You can even hide notifications and live chat boxes. “This is the best extension to control YouTube usage, and not let YouTube control you.” Firefox user Shubham Mandiya PocketTube If you subscribe to a lot of YouTube channels PocketTube is a fantastic way to organize all your subscriptions by themed collections. PocketTube: Youtube Subscription Manager by Dima NabokRecommendedThe best way to group your subscriptionsUsing this simple extension you can create collections that seamlessly fit into YouTube's layout.Rated 4.1 out of 5Users: 20,877You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. Group your channel collections by subject, like “Sports,” “Cooking,” “Cat videos” or whatever. Other key features include… Add custom icons to easily identify your channel collections Customize your feed so you just see videos you haven’t watched yet, prioritize videos from certain channels, plus other content settings Integrates seamlessly with YouTube homepage Sync collections across Firefox/Android/iOS using Google Drive and Chrome Profiler PocketTube keeps your channel collections neatly tucked away to the side. AdBlocker for YouTube It’s not just you who’s noticed a lot more ads lately. Regain control with AdBlocker for YouTube. AdBlocker for YouTube™ by AdblockLiteRecommendedRemove all annoying ads from YouTube.Rated 4 out of 5Users: 594,091You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. The extension very simply and effectively removes both video and display ads from YouTube. Period. Enjoy a faster, more focused YouTube. SponsorBlock It’s a terrible experience when you’re enjoying a video or music on YouTube and you’re suddenly interrupted by a blaring ad. SponsorBlock solves this problem in a highly effective and original way. SponsorBlock - Skip Sponsorships on YouTube by Ajay (SponsorBlock)RecommendedEasily skip YouTube video sponsors. When you visit a YouTube video, the extension will check the database for reported sponsors and automatically skip known sponsors. You can also report sponsors in videos. Other browsers: https://sponsor.ajay.appRated 4.8 out of 5Users: 602,046You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. Leveraging the power of crowd sourced information to locate where—precisely— interruptive sponsored segments appear in videos, SponsorBlock learns where to automatically skip sponsored segments with its ever growing database of videos. You can also participate in the project by reporting sponsored segments whenever you encounter them (it’s easy to report right there on the video page with the extension). SponsorBlock can also learn to skip non-music portions of music videos and intros/outros, as well. If you’d like a deeper dive of SponsorBlock we profiled its developer and open source project on Mozilla Distilled. We hope one of these extensions enhances the way you enjoy YouTube. Feel free to explore more great media extensions on addons.mozilla.org. Updated October 17, 2024 By Scott DeVaney Avatar Share Twitter Pocket'''
