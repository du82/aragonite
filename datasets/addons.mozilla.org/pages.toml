title = "Firefox Add-ons Blog"
description = "Download Firefox extensions and themes. They’re like apps for your browser. They can block annoying ads, protect passwords, change browser appearance, and more."
full_description = "How to turn your household pet into a Firefox theme October 17, 2024 Themes are a fun way to change the visual appearance of Firefox and give the browser a look that’s all your own. You’re free to explore more than a half-million community created themes on addons.mozilla.org (AMO), or better yet, create your own custom theme. Best of all — create a theme featuring a beloved pet! […] Read more Fakespot — your friend in the fight against unreliable reviews June 27, 2024 There may be differing opinions about the health benefits of vitamin supplements, but there’s no debate among medical experts that eating sawdust is bad for you. Yet sawdust is exactly what Saoud Khalifah found in vitamin supplements he ordered online from a globally popular shopping site. How could this have happened, he wondered? Khalifah started […] Read more Roblox browser extensions for better gaming January 10, 2023 Every day, more than 50 million people play among millions of user-created games on Roblox. With a massive global audience and an ocean of games, there are vastly different ways users like to interact with Roblox. This is where the customization power of browser extensions can shine. If you’re a Roblox player or creator, you […] Read more How Firefox’s Total Cookie Protection and container extensions work together August 23, 2022 When we recently announced the full public roll-out of Firefox Total Cookie Protection — a new default browser feature that automatically confines cookies to the websites that created them, thus eliminating the most common method that sites use to track you around the web — it raised a question: Do container extensions like Mozilla’s Facebook […] Read more Extension starter pack May 11, 2022 You’ve probably heard about “ad blockers,” “tab managers,” “anti-trackers” or any number of browser customization tools commonly known as extensions. And maybe you’re intrigued to try one, but you’ve never installed an extension before and the whole notion just seems a bit obscure. Let’s demystify extensions. An extension is simply an app that runs on […] Read more Extensions for cleaning up a chaotic desktop April 5, 2022 Clutter isn’t just material stuff scattered about your floor and shelves. Clutter can consume us in digital form, too — from an overabundance of browser bookmarks and open tabs to navigating a world wide web that’s littered with junk. The right browser extension, however, can really help clean things up… Tranquility Reader Want to sweep […] Read more Firefox extensions for creatives March 21, 2022 From designers to writers, multi-media producers and more—if you perform creative work on a computer there’s a good chance you can find a browser extension to improve your process. Here’s a mix of practical Firefox extensions for a wide spectrum of creative uses… Extensions for visual artists, animators & designers Extended Color Management Built in […] Read more The pandemic changed everything — even the way we use browser extensions March 9, 2022 On March 11, 2020 the World Health Organization declared COVID-19 a global pandemic. Within days, practically the entire planet was on lockdown. We went indoors and online. So how did the sudden mass migration online impact browser extension usage? Pretty dramatically, it turns out. On this two-year mark of the start of the pandemic we […] Read more Level up your Steam experience with a browser extension December 20, 2021 With more than 120 million users worldwide and 50,000+ games in its ecosystem, Steam is an extraordinarily eclectic gaming distribution platform. Given its broad reach, it makes sense that different users have different ways they’d like to adjust and optimize their personal Steam experience. That’s where browser extensions come in… Augmented Steam Packed with features […] Read more Firefox’s most popular and innovative browser extensions of 2021 December 14, 2021 About one-third of Firefox users have installed an add-on—be it an extension to equip Firefox with a custom feature or a visual theme to personalize their browsing experience. What kind of extensions did we use most in 2021? And what are some of the new, innovative extensions to emerge this year? Let’s find out! Two […] Read more The magic of mouse gestures November 18, 2021 Mouse gestures are mouse movement and key combinations that give you the power to customize the way you maneuver around web pages. If your online work requires a fair amount of distinct, repetitive activity—things like rapid page scrolling, opening links in background tabs, closing batches of open tabs, etc.—the right mouse gesture can make a […] Read more Top anti-tracking extensions September 30, 2021 The truth of modern tracking is that it happens in so many different and complex ways it’s practically impossible to ensure absolute tracking protection. But that doesn’t mean we’re powerless against personal data harvesters attempting to trace our every online move. There are a bunch of Firefox browser extensions that can give you tremendous anti-tracking […] Read more YouTube your way — browser extensions put you in charge of your video experience September 20, 2021 YouTube wants you to experience YouTube in very prescribed ways. But with the right browser extension, you’re free to alter YouTube to taste. Change the way the site looks, behaves, and delivers your favorite videos. Enhancer for YouTube With dozens of customization features, Enhancer for YouTube has the power to dramatically reorient the way you […] Read more uBlock Origin—everything you need to know about the ad blocker September 3, 2021 Rare is the browser extension that can satisfy both passive and power users. But that’s an essential part of uBlock Origin’s brilliance—it is an ad blocker you could recommend to your most tech forward friend as easily as you could to someone who’s just emerged from the jungle lost for the past 20 years. If […] Read more Boost your writing skills with a browser extension August 26, 2021 Whatever kind of writing you do—technical documentation, corporate communications, Harry Potter-vampire crossover fan fiction—it likely happens online. Here are some great browser extensions that will benefit anyone who writes on the web. Get grammar help, productivity tools, and other strong writing aids… LanguageTool It’s like having your own copy editor with you wherever you write […] Read more Find that font! I must have that font! August 9, 2021 You’re probably a digital designer or work in some publishing capacity (otherwise it would be pretty strange to have a fascination with fonts); and you appreciate the aesthetic power of exceptional typography. So what do you do when you encounter a wonderful font in the wild that you might want to use in your own […] Read more How to use a temp mail extension for spam and security protection August 6, 2021 One of the most common methods malicious hackers use to break into their victims’ computer systems is tricking them into clicking dangerous links within an email. It’s been popular with cyber criminals for decades because it’s so simple yet consistently effective. Just make the email appear like it’s from a trusted source and include a […] Read more Read EPUB e-books right in your browser August 4, 2021 For many online readers you simply can’t beat the convenience and clarity of reading e-books in EPUB form (i.e. “electronic publication”). EPUB literature adjusts nicely to any screen size or device, but if you want to read EPUBs in your browser, you’ll need an extension to open their distinct files. Here are a few extensions […] Read more Supercharge your productivity with a Firefox extension July 30, 2021 With more work and education happening online (and at home) you may find yourself needing new ways to juice your productivity. From time management to organizational tools and more, the right Firefox extension can give you an edge in the art of efficiency. I need help saving and organizing a lot of web content Gyazo […] Read more Tweak Twitch—BetterTTV and other extensions for Twitch customization July 26, 2021 Customize chat, optimize your video player, auto-collect channel points, and much much more. Explore some of the ways you can radically transform your Twitch experience with a browser extension… BetterTTV One of the most feature rich and popular Twitch extensions out there, BetterTTV has everything from fun new emoticons to advanced content filtering. Key features: […] Read more Too many open tabs? Extensions to the rescue! July 22, 2021 The first step in getting help with your tab hoarding problem is to admit you have a tab hoarding problem. Whatever the reason may be—your job requires you to have dozens of open tabs or the rows of tabs represent your neverending “read later” list—you can regain control of this spiraling situation with the right […] Read more Find an interesting image? Use an image search extension like Tineye to discover hidden details July 14, 2021 Reverse image search is the process of using an image as the starting point of your search to learn more about the picture, where it came from, or its subjects. Why do people perform reverse image searches? Reasons vary, but there are typically two types of objectives: Track images across the web Use an image […] Read more Reddit revolutionized—use a browser extension to enhance your favorite forum July 8, 2021 Reddit is awash with great conversation (well, not all the time). There’s a Reddit message board for just about everybody—sports fans, gamers, poets inspired by food, people who like arms on birds—you get the idea. If you spend time on Reddit, there are ways to greatly augment your experience with a browser extension… Reddit Enhancement […] Read more Watch videos with friends anywhere—how to social stream with browser extensions June 22, 2021 If you’re missing the fun of watching movies and other entertainment with friends in real time, try a browser extension like Metastream Remote or Watch2gether to host private online watch parties. Metastream Remote Install Metastream Remote and host a watch party within minutes. It works with most common video streaming sites like YouTube, Twitch, Vimeo, […] Read more What’s the best ad blocker for you? June 17, 2021 So you’ve decided to do something about all those annoying ads you’re barraged with online. What pushed you over the edge? Auto-play video ads? Blaring banners? Tired of your music interrupted by a sudden sponsorship? Was it the realization they intentionally make the ‘Close’ buttons [x] on ads super tiny so you accidentally click the […] Read more Translate the web easily with a browser extension June 14, 2021 Do you do a lot of language translating on the web? Are you constantly copying text from one browser tab and navigating to another to paste it? Maybe you like to compare translations from different services like Google Translate or Bing Translate? Need easy access to text-to-speech features? Online translation services provide a hugely valuable […] Read more"
