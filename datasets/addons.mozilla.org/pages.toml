["https://addons.mozilla.org/blog/the-pandemic-changed-everything-even-the-way-we-use-browser-extensions"]
title = "The pandemic changed everything — even the way we use browser extensions - Firefox Add-ons Blog"
description = "On March 11, 2020 the World Health Organization declared COVID-19 a global pandemic. Within days, practically the entire planet was on lockdown. We went indoors and online.  So how did the sudden mass migration online impact browser extension usage? Pretty dramatically, it turns out. On this two-year mark of the start of the pandemic we […]"
full_description = '''Add-ons Firefox Add-ons Blog The pandemic changed everything — even the way we use browser extensions On March 11, 2020 the World Health Organization declared COVID-19 a global pandemic. Within days, practically the entire planet was on lockdown. We went indoors and online. So how did the sudden mass migration online impact browser extension usage? Pretty dramatically, it turns out. On this two-year mark of the start of the pandemic we looked back at Firefox extension installs and usage data to discover several compelling trends. We wanted to see the types of extensions Firefox users were drawn to during the early days of the lockdown, so we compared average monthly installs for three months at the start of the lockdown (March – May ‘20) to average monthly installs for the three months prior (Dec. ‘19 – Feb. ‘20). For this exercise we only looked at Firefox extensions with a minimum of 10,000 users. Here are some things we found… We need all the help we can get working and educating from home As much of the world suddenly transitioned their work and schooling to home computers in March 2020, Firefox users flocked to a handful of notable extensions to make life a little easier. Which extension got the biggest install boost during the first few months of lockdown? Zoom Scheduler Of course it’s a Zoom extension. Zoom Scheduler installs increased 1,522%. Zoom Extension by ZoomRecommended, support FireFox 45+.The Zoom Firefox Extension allows participants to schedule Zoom cloud meetings directly from Google Calendar. you can start an instant meeting or schedule a future meeting via a button.Rated 4.1 out of 5Users: 251,456You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. Created by Zoom, their extension integrates Google Calendar with the Zoom app so you can conveniently schedule or start Zoom meetings directly from your Google Calendar on Firefox. Dark Background and Light Text When you’re suddenly doing everything on a computer, you need to take care of those precious peepers. Dark Background and Light Text installs jumped an eye-popping 351%. Dark Background and Light Text by Mikhail KhvoinitskyRecommendedMake every web page (or just the pages you want) display light text on dark backgrounds. All color variations are fully customizable.Rated 4.5 out of 5Users: 31,695You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. By default the extension flips the colors of every web page you visit, so your common light colored backgrounds become text colors and vice versa. But all color combinations are customizable, freeing you to adjust everything to taste. You can also set exceptions for certain websites that have a native look you prefer. Tree Style Tab Apparently we suffered from too many open tabs at the start of the pandemic (work tabs! school tabs! breaking news!). Tree Style Tab (+126%) gives Firefox users a great way to cope with tab overload. Tree Style Tab by Piro (piro_or)RecommendedShow tabs like a tree.Rated 4.5 out of 5Users: 225,027You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. The extension helps you organize all of your open tabs into a cascading “tree” format, so you can group tabs by topic and get a clean visual layout of everything. To Google Translate This translation tool was already very popular when the lockdown started, so it’s curious its install rate still climbed a whopping 126%, going from 222,000 installs/month to more than 504,000. To Google Translate provides easy right-click mouse access to the Google Translate service, eliminating the nuisance of copying text and navigating away from the page you’re on just to translate. To Google Translate by Juan EscobarRecommendedRight-click a section of text and click the Translate icon next to it to text translate or listen to it in your language.Rated 4.1 out of 5Users: 915,131You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. We can only speculate why Firefox users wanted translation extensions when the pandemic started (To Google Translate wasn’t an aberration; all of the top translation extensions had install increases), but it’s worth wondering if a big factor wasn’t a common desire to get broader perspectives, news and information about the emerging virus. Perhaps Firefox users who sought out international news coverage would explain the increased appetite for translation extensions? To Google Translate had particularly impressive install gains in China (+164%), the U.S. (+134%), France (+101%), Russia (+76%), and Germany (+75%). We started taking our digital privacy more seriously Privacy extensions are consistently the most popular type of Firefox add-on. Even so, the pandemic pushed a few notable extensions to new heights. Cookie AutoDelete Already averaging an impressive 42,000 monthly installs before the lockdown, Cookie AutoDelete skyrocketed 386% to averaging more than 206,000 installs/month between March – May 2020. Cookie AutoDelete by CAD TeamControl your cookies! This WebExtension is inspired by Self Destructing Cookies. When a tab closes, any cookies not being used are automatically deleted. Keep the ones you trust (forever/until restart) while deleting the rest. Containers SupportedRated 4.5 out of 5Users: 222,230You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. The extension automatically eliminates any unused cookies whenever you close a tab, unless you specify sites you trust and wish to maintain cookie contact. Facebook Container Naturally a lot of people spent more time on the world’s largest social media platform to stay connected during lockdown. But many folks also want to enjoy this sense of connectedness without Facebook following them around the internet. So it makes sense Mozilla’s very own Facebook Container was among the most popular extensions at the start of the lockdown—installs climbed 211%. Facebook Container by FirefoxBy FirefoxPrevent Facebook from tracking you around the web. The Facebook Container extension for Firefox helps you take control and isolate your web activity from Facebook.Rated 4.5 out of 5Users: 1,095,514You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. The extension isolates your Facebook identity into a separate “container” so Facebook can’t track your moves around the web. Indeed the social media giant wants to learn everything it can about your web habits outside of Facebook. Privacy Badger No sophisticated setup required. Just install Privacy Badger and it will silently work in the background to block some of the web’s sneakiest trackers. Privacy Badger actually gets better at its job the longer you have it installed; it “learns” more about hidden trackers the more you naturally encounter them navigating the web. Privacy Badger by EFF TechnologistsRecommendedAutomatically learns to block invisible trackers.Rated 4.8 out of 5Users: 1,812,240You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. Privacy Badger installs lept 80% globally during those first few months of lockdown, with particularly keen interest from Italy (+135%) and Brazil (+119%). We found ways to stay connected, entertained and inspired It wasn’t all work and no play online during the dreadful early days of the lockdown. BetterTTV Installs of this top Twitch extension were up 46% as we turned to each other for live streaming entertainment. BetterTTV can radically alter the look and feel of Twitch with new emoticons, a more focused interface, content filters, and a reimagined chat experience (including Anonymous Chat so you can join a channel without drawing attention). BetterTTV by NightDevRecommendedEnhances Twitch and YouTube with new features, emotes, and more.Rated 4.6 out of 5Users: 468,971You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. BetterTTV was particularly popular in Germany, where installs soared 76%. Watch2gether extension A lot of people became “watch party” animals during lockdown. If you haven’t tried social streaming, it’s a fun way to enjoy synced videos while chatting with friends online. Watch2gether extension became a popular choice for social stream parties (+82%). Watch2Gether by Watch2GetherWith Watch2Gether you can watch videos together with your friends. Enhance your Watch2Gether experience with our official browser extension.Rated 4.2 out of 5Users: 56,170You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. You don’t need the extension to use the web-based Watch2gether platform, but the extension provides a few added perks when used in conjunction with the web service, such as easy browser access to your watch rooms and the ability stream videos that aren’t directly supported by the Watch2gether website (e.g. the video source doesn’t offer an embeddable version). YouTube Non-Stop A 45% install increase means we started listening to a lot more music on YouTube when the lockdown hit. YouTube Non-Stop solves the problem of that annoying “Video paused. Continue watching?” prompt by automatically clicking it in the background so your groove never comes to a grinding halt. YouTube NonStop by lawfxRecommendedTired of getting that "Video paused. Continue watching?" confirmation dialog?This extension autoclicks it, so you can listen to your favorite music uninterrupted.Working on YouTube and YouTube Music!Rated 4.2 out of 5Users: 140,156You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. Two years into this pandemic, our day-to-day lives — and how we rely on browsers — have permanently shifted. As we continue to adjust to new life and work routines, these incredible extensions are as useful as ever. If you want to explore more, please visit addons.mozilla.org to browse thousands of Firefox extensions. Updated March 9, 2022 By Scott DeVaney Avatar Share Twitter Pocket'''
author = "Scott DeVaney"
year_published = 2022
year_updated = 2022
