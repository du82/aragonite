description = "For many online readers you simply can’t beat the convenience and clarity of reading e-books in EPUB form (i.e. “electronic publication”). EPUB literature adjusts nicely to any screen size or device, but if you want to read EPUBs in your browser, you’ll need an extension to open their distinct files. Here are a few extensions […]"
full_description = "Add-ons Firefox Add-ons Blog Read EPUB e-books right in your browser For many online readers you simply can’t beat the convenience and clarity of reading e-books in EPUB form (i.e. “electronic publication”). EPUB literature adjusts nicely to any screen size or device, but if you want to read EPUBs in your browser, you’ll need an extension to open their distinct files. Here are a few extensions to help turn your browser into an awesome digital bookshelf. EPUBReader Extremely popular and easy to use, EPUBReader can take care of all your e-reading needs in one extension. EPUBReader by epubreaderRecommendedRead ePub files right in Firefox. No additional software needed!Rated 3.7 out of 5Users: 138,173You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. Whenever you encounter a website that offers EPUB, the extension automatically loads the ebook for you. Access features by clicking EPUBReader’s toolbar icon, which launches a hub for all your EPUB activity. Here you’ll find all of your saved EPUB files (plus a portal for discovering new, free ebooks), as well as manage your layout settings like text font, size, colors, backgrounds, and more. The Adventures of Captain Hatteras in EPUBReader. EPUBReader also works very well in tandem with… Read Aloud: text to speech voice reader Think of Read Aloud: text to speech voice reader as an audio version of a traditional text-based e-reader. Sit back and let it read the web to you. Read Aloud: A Text to Speech Voice Reader by LSD SoftwareRecommendedRead out loud the current web-page article with one click. Supports 40+ languages.Rated 3.8 out of 5Users: 184,889You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. Key features: 40+ languages Male/female voice optionsAdjust the pitch and reading speed of any voicePDF support Story time with Read Aloud. EpubPress – read the web offline Optimized for offline reading, EpubPress lets you easily download and organize web pages into a “book” for offline reading. Use it to compile an actual long read book, or utilize it for saving news articles and other short form reading lists. EpubPress - Read the web offline by Harold TreenCreate custom ebooks from your favorite blogs and websites.Rated 4.1 out of 5Users: 2,179You'll need Firefox to use this extensionDownload Firefox and get the extensionThis extension is not currently available. Very intuitive to operate. Once you have all the pages you want to collate opened in separate tabs, just order them how you want them to appear in your book. Ads and other distracting widgets are automatically removed from your saved pages. EpubPress conveniently turns individual web pages into easy-to-read offline e-books. We hope these extensions bring you great browser reading joy! Explore more reading extensions on addons.mozilla.org. Updated August 4, 2021 By Scott DeVaney Avatar Share Twitter Pocket"
