["https://addons.mozilla.org/en-US/firefox/search"]
title = "Search results – Add-ons for Firefox (en-US)"
full_description = '''Simple and seamless privacy protection for your browser: tracker blocking, cookie protection, DuckDuckGo private search, email protection, HTTPS upgrading, and much more. Unmatched adblock extension against advertising and pop-ups. Blocks ads on Facebook, Youtube and all other websites. The best privacy tool and ad blocker extension for Firefox. Stop trackers, speed up websites and block ads everywhere including YouTube and Facebook. Right-click a section of text and click the Translate icon next to it to text translate or listen to it in your language. At home, at work, or on the go, Bitwarden easily secures all your passwords, passkeys, and sensitive information. Easily skip YouTube video sponsors. When you visit a YouTube video, the extension will check the database for reported sponsors and automatically skip known sponsors. You can also report sponsors in videos. Other browsers: https://sponsor.ajay.app A simple extension for superfast and easy YouTube downloads in FLV, 3GP, MP3, MP4, 720p, and 1080p formats. With this extension you can check text with the free style and grammar checker LanguageTool. It finds many errors that a simple spell checker cannot detect, like mixing up there/their, a/an, or repeating a word. A powerful reverse image search tool, with support for various search engines, such as Google, Bing, Yandex, Baidu and TinEye. The best security you can get in a web browser! Allow potentially malicious web content to run only from sites you trust. Protect yourself against XSS other web security exploits. Protects you against tracking through "free", centralized, content delivery. It prevents a lot of requests from reaching networks like Google Hosted Libraries, and serves local files to keep sites from breaking. Complements regular content blockers. FoxyProxy is an open-source, advanced proxy management tool that completely replaces Firefox's limited proxying capabilities. No paid accounts are necessary; bring your own proxies or buy from any vendor. The original proxy tool, since 2006.'''
