full_description = '''Vertical tabs tree and bookmarks in sidebar with advanced containers configuration, grouping and many other features. Easily save and organize batches of tabs as bookmarks. Clear your tabs, clear your mind. Only for Firefox. Allows you to choose the default bookmark location folder and quickly bookmark pages via a dedicated icon. Keep your Firefox bookmarks on Windows up to date with your Safari bookmarks on iPhone, iPad, and Mac with the iCloud Bookmarks extension for Firefox. Makes a Printer Friendly &amp; PDF version of any webpage. Removes navigation, ads, and junk. Formats the page for print so you save paper and ink. Good for the environment and your wallet. 🟦 Ultimate Speed Dial with ✅ advanced features for power users! 📈 Increase your productivity with ☁ Cloud dials on all your devices! 📁 Folders support, Live dials, Multi-dials, Text dials, Recently closed / Top pages, Timer, Search and many more With the Bookmarks Organizer it's easy to put order in your bookmarks. The Bookmarks Organizer finds no longer working bookmarks, redirects, duplicates and more! Speed Dial allows you to add and manage bookmarks in the New Tab page and gives you an optional search experience. Make your new tab page a true home for your work and free time. Speed Dial 2 is a new tab page extension with easy access to your favorite websites. Synchronize your bookmarks and FVD Speed Dials. Secure online access with additional features. Synchronize bookmarks between different browsers. Backup and restore your bookmarks online. Sync favorites between computers! Delete duplicated bookmarks. Easily customizable custom keyboard shortcuts for Firefox. To configure this addon go to Addons (ctrl+shift+a) -&gt;Shortkeys -&gt;Options. Report issues here (please specify that the issue is found in Firefox): <a rel="nofollow" href="https://prod.outgoing.prod.webservices.mozgcp.net/v1/12e2f788f1bdde9c64f3afef23153608411c53de3620e6fd118a93baa51449f4/https%3A//github.com/mikecrit