description = "Addy Osmani is a Software Engineer at Google working on the Chrome web browser. He is the author of books like Image Optimization and Learning JavaScript Design Patterns. He has also written a number of open-source projects like Yeoman, TodoMVC, Quicklink and Material Design Lite."
full_description = "Future-proofing your Software Engineering career Practical strategies for engineering careers in the future Addy Osmani 8 min read The 70% problem: Hard truths about AI-assisted coding A field guide and why we need to rethink our expectations Dec 4 ❤️ 235 User-centric engineering Engineering with user empathy is the foundation of great products Nov 14 ❤️ 31 There is no right time. Just time and what you do with it. How to thrive in imperfect conditions Aug 22 ❤️ 74 Grow your influence like a leader, not a boss Extending your influence past your immediate circle isn't as straightforward as you'd like to hope. But there are a few strategies you can employ to help. How to build an effective technical strategy Building a tech strategy requires a lot of moving parts. Learn about what routes to take and whether decisions should be top-down. How to keep up with tech trends and upskill sustainably With so many developments in the tech world it's difficult to keep up. Here are some strategies to stay on top of your upskilling. Navigating competing priorities as an engineer How can you prioritize when everyone's ask is an urgency and you don't have time to fit it all in? Managing the chaos of context switching It's time to examine the good, the bad, and the very ugly elements of context switching. Even better, we'll take a look at some strategies for managing it. Focus on outcomes over outputs Software engineering teams should focus on outcomes over outputs to deliver the best user and business value. What makes an effective software engineer? Being a good software engineer is not necessarily the same as being an effective one. Here, Google's Addy Osmani identifies the ten key traits of effective software engineers."
