description = "Addy Osmani is a Software Engineer at Google working on the Chrome web browser. He is the author of books like Image Optimization and Learning JavaScript Design Patterns. He has also written a number of open-source projects like Yeoman, TodoMVC, Quicklink and Material Design Lite."
full_description = "I am the engineering lead for Google Chrome's Developer Experience organization. Our projects include Chrome DevTools, Lighthouse, PageSpeed Insights and Chrome User Experience Report, Aurora and WordPress Performance. We recently shipped User Flows for DevTools and Lighthouse!. I also love side-projects. Projects I've contributed to include Lighthouse, Workbox, Quicklink, Guess.js, Yeoman, HNPWA, TodoMVC, Critical and Material Design Lite. You can find more on GitHub. I have been on a few different podcasts recently, including PodRocket, Hanselminutes with Scott Hanselman, DevDiscuss and Smashing Podcast. Recordings of my talks are on my YouTube channel. These include Optimize the Core Web Vitals and Cost Of JavaScript. You can find some of my slides on SpeakerDeck. My latest blog posts can be found on my web.dev profile. My last post on here was: Service Reliability Mathematics"
