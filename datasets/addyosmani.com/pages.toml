description = "Addy Osmani is a Software Engineer at Google working on the Chrome web browser. He is the author of books like Image Optimization and Learning JavaScript Design Patterns. He has also written a number of open-source projects like Yeoman, TodoMVC, Quicklink and Material Design Lite."
full_description = "Press If you are a print or online magazine, a conference or otherwise, please feel free to use the below for articles or interviews. Biography Addy Osmani is an engineering leader working on Google Chrome. He leads up Chrome's Developer Experience organization, helping reduce the friction for developers to build great user experiences. His teams contribute to projects like Chrome DevTools, Core Web Vitals, Lighthouse, PageSpeed Insights, Chrome User Experience Report, Aurora (JavaScript frameworks) and WordPress. A community contributed profile on Addy can be found here. Press photos Please feel free to see below for photography you can use in media. 2024 - Casual 2023 - Casual 2023 - Google Chrome 2023 - Studio Formal 2021 2020 2020 Photoshoot - Cyan 2020 Photoshoot - Pink 2020 Photoshoot - Cyan 2020 Photoshoot - Cyan 2020 Photoshoot - Yellow 2019 - Chrome Dev Summit 2019 - Cost Of JavaScript 2022 - SmashingConf 2017 - Chrome Dev Summit 2017 - Chrome Dev Summit 2019 - Google I/O 2019 - Google I/O 2019 - Google I/O 2019 - Google I/O 2018 - Google I/O 2018 - Google I/O 2018 - Chrome Dev Summit 2017 - Chrome Dev Summit 2017 - Chrome Dev Summit 2016 - Chrome Dev Summit 2016 - Chrome Dev Summit 2015 - Google I/O 2015 - Google I/O 2014 - Google I/O"
