title = "AddyOsmani.com"
description = "Addy Osmani is a Software Engineer at Google working on the Chrome web browser. He is the author of books like Image Optimization and Learning JavaScript Design Patterns. He has also written a number of open-source projects like Yeoman, TodoMVC, Quicklink and Material Design Lite."
full_description = "Addy Osmani is a software engineering leader working on the Google Chrome web browser (~3B users). He has worked at Google since 2012, leading several efforts to make the web fast, low-friction to build on, and increasingly intelligent with the integration of AI. Addy currently leads Chrome’s Developer Experience organization, including tools like the Chrome Developer Tools, Lighthouse, PageSpeed Insights,Puppeteer, Chrome Headless and Google’s teams contributing to frameworks (e.g. Aurora - React, Next.js, Angular, Nuxt) and CMS (e.g. WordPress). Addy’s efforts to make the web faster include several years working on popular efforts like making speed a ranking factor in Google Search (Core Web Vitals,Page Experience), alongside Rick Byers and Annie Sullivan. He has also heavily contributed to the design of web features, such as native image lazy-loading and Priority Hints with Pat Meenan. Some of the other speed efforts Addy has worked on can be found in 10 years of speed in Google Chrome. He has enjoyed working along teams in V8 and Chrome Loading. Addy’s work has included aligning web browsers on using the same benchmark (Speedometer) for real-performance measurement. He collaborated with Apple’s Safari team on the Speedometer benchmark and led the engineering work on Speedometer 2, partnering with Apple and Mathias Bynens. In 2022, in the Chromium BlinkOn keynote, he announced that Chrome had reached a milestone Speedometer score of 360. Chrome had shared earlier that year that it had been the first browser to score a 300. As part of his role making the web fast, he has done engineering collaborations with a number of large sites over time to improve their performance. Osmani has published several case studies on this work, includingPinterest, Twitter, Tinder, Netflix and eBay. In 2022, he shared that Chrome collaborated with YouTube on improving the Core Web Vitals pass rates of hundreds of millions of their pages. Osmani did this in collaboration with Gilberto Cocchi, another web performance expert."
