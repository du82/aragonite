title = "AddyOsmani.com - Building effective engineering teams; lessons from 10 years at Google"
description = "Addy Osmani is a Software Engineer at Google working on the Chrome web browser. He is the author of books like Image Optimization and Learning JavaScript Design Patterns. He has also written a number of open-source projects like Yeoman, TodoMVC, Quicklink and Material Design Lite."
full_description = "As engineering leaders, we have a large opportunity to scale our effectiveness as our decisions impact the output of our whole organisation. This means our investments in helping our teams become more effective are particularly valuable. A good starting point is sharing the insights that help grow people into effective individual engineers. There is of course so much more to it than this. From reducing sources of friction to optimising career growth goals to align with what produces maximum value, this talk will touch on tips, tricks and frameworks for building effective teams based on over a decade of experience Addy has had working on the Chrome team at Google. The insights here will apply across management and technical leadership."
