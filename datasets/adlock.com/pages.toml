title = "FAQ - AdLock - the most functional ad blocker"
description = "AdLock is the best way to remove annoying ads, online tracking. AdLock protect your device from malware web-sites. With AdLock our web surfing will be fast, safe and ads-free."
full_description = "AdLock is a comprehensive solution that blocks advertising in web browsers, games, instant messengers, and other applications. Blocking the unwanted content saves your valuable time, increases the speed of page loading and ensures privacy on the Web. The ad blocking feature of AdLock is based on the use of advertising filters. A filter is a set of rules for sorting out various ads (banners, pop-ups, etc.). For high-quality blocking, we use a massive amount of advertising filters, which are based on EasyList technology. We carefully check the performance of each filter we add. If problems are found, the filters get finalized and supplemented by our experts. These filters specify the rules on the basis of which the application removes ads. Blocking of banners occurs differently since they are stored on third-party servers. To display a banner, the website needs to send a request to receive it from the server. AdLock checks all requests that are sent from the website page to the server. The requests that fall under the filters will be blocked, which positively affects the speed of page loading and traffic consumption. Our “Safe surfing” feature is based on Google’s Safe Browsing service. When you click on an unfamiliar link, AdLock checks the database of unsafe websites constantly updated by Google. These resources include phishing sites and sites that host malicious or unwanted software. If the link you are requesting is found in the list of unsafe websites, AdLock notifies you and prevents you from following it. You can try AdLock on a trial basis for 14 days. If you want to continue using our blocker after the trial period, you need to purchase an activation code. If you did not receive the confirmation email within a few hours after the purchase, it is likely that the email was marked as a spam in your mailbox. Check the Junk E-mail or Spam folder to see if the order confirmation e-mail is there. Add a new rule to your e-mail client to allow receiving e-mails from adlock.com. If you cannot find the e-mail in the above-mentioned folders, contact us at support@adlock.com so we can help you."
