title = "Präsidialjahr 2025"
description = "An dieser Stelle sind Informationen über das Präsidialjahr 2025 verfügbar. Verwiesen wird dabei insbesondere auf die Stelle, an der das aktuelle Präsidialdepartement die Auftritte, Reden und Medienmitteilungen der Bundespräsidentin abbildet."
full_description = "Bundespräsidentin 2025 ist die St. Gallerin Karin Keller-Sutter. Sie wurde am 11.12.2024 in dieses Amt gewählt. Das Finanzdepartement (EFD) fungiert 2025 als Präsidialdepartement, eine Rolle, die es zuletzt im Präsidialjahr 2019 innehatte. Vizepräsident des Bundesrates ist 2025 Guy Parmelin. Er leitet das Eidgenössische Departement für Wirtschaft, Bildung und Forschung (WBF). *** «Wenn wir unsere Hausaufgaben machen, die Chancen packen, die sich uns bieten, dann können wir auch in einem schwierigen Umfeld einen entscheidenden Beitrag an den Wohlstand und damit auch an den sozialen Frieden in unserem Land leisten.» (Aus der Rede von Bundesrätin Karin Keller-Sutter am 11. Dezember 2024 vor der Vereinigten Bundesversammlung) Die Reden und Auftritte der Bundespräsidentin sind auf den Seiten des Eidgenössischen Finanzdepartements (EFD) aufgeführt. Präsidialdienst Seit Anfang 2015 steht dem Präsidialdepartement ein bei der Bundeskanzlei angesiedelter Präsidialdienst zur Verfügung. Etabliert wurde der Präsidialdienst nach einem Parlamentsbeschluss vom 28. September 2012. Rechtliche Grundlage bildet das Regierungs- und Verwaltungsorganisationsgesetz (RVOG). Der Dienst unterstützt das Präsidialdepartement bei den im Präsidialjahr zusätzlich anfallenden Aufgaben. Er bündelt insbesondere seit längerem bestehende Leistungen der Bundeskanzlei (BK) und des Eidg. Departements für auswärtige Angelegenheiten (EDA). Kernaufgabe des Präsidialdienstes ist die aussenpolitische Beratung der Bundespräsidentin oder des Bundespräsidenten. Eine solche Beratung gab es schon früher; sie wurde vom Bereich „Präsidiale Angelegenheiten“ im Staatssekretariat des EDA wahrgenommen. Noch früher wurde ein Diplomat ins Präsidialdepartement detachiert. Parlament und Regierung erwarten vom Präsidialdienst, dass sich dort Erfahrung, Fachwissen und Kontakte speichern lassen und so ein institutionelles Gedächtnis aufgebaut wird - im Sinne der Kontinuität, aber auch der Effizienz."
author = "Der Bundesrat"
year_published = 2025
