["https://admin.ch/gov/de/start/bundeskanzlei/vizekanzler_brsprecher.html"]
title = "Vizekanzler und Bundesratssprecher Andrea Arcidiacono"
description = "Andrea Arcidiacono, Vizekanzler und Bundesratssprecher seit dem 01.10.2024"
full_description = "Herr Andrea Arcidiacono, geboren am 20. April 1966, von Bellinzona TI, hat an der Universität HSG Betriebswirtschaft studiert und 1991 mit dem Lizenziat abgeschlossen. Herr Arcidiacono war in der Bundesverwaltung als stellvertretender Informationschef und Pressesprecher für Bundesrätin Ruth Dreifuss (1998-2002), als stellvertretender Informationschef und Pressesprecher für Bundesrat Pascal Couchepin (2006-2007) und als Pressesprecher im BAG (2017-2018) tätig. Ferner leitete er bei Präsenz Schweiz von 2011 bis 2016 die Programme «Gotthard 2016», «Italien/Expo Milano 2015» und «Verso Expo Milano 2015». Im Bereich der Öffentlichkeitsarbeit verantwortete er ferner die Kommunikation für die Università della Svizzera italiana (2003-2006) und für curafutura (2016-2017). Zudem war er Kommunikationsverantwortlicher für das Bundesverwaltungsgericht in Bern (2009-2011). Bis September 2024 war er Direktor der Firma Arcidiacono Consulting Partners GmbH. Andrea Arcidiacono ist Vizekanzler und Bundesratssprecher seit dem 1. Oktober 2024. In dieser Funktion trägt Herr Arcidiacono in Abstimmung mit dem Bundeskanzler die Verantwortung für die Information der Medien und Öffentlichkeit im Auftrag des Bundesrates, für die Beratung des Bundesrates und seiner Mitglieder in Informations- und Kommunikationsfragen und für die Steuerung und Koordination der Informationstätigkeit des Bundesrates, der Departemente sowie der Bundeskanzlei. Er leitet den Bereich Kommunikation und Strategie mit rund 70 Mitarbeitenden. Die ihm unterstellten Mitarbeiterinnen und Mitarbeiter unterstützen seine Tätigkeit im Zusammenhang mit der Kommunikation des Bundesrates, dem Bundespräsidium, der politischen Planung zuhanden des Bundesrates und dem Krisenmanagement. Andrea Arcidiacono ist italienischer Muttersprache und verfügt über ausgezeichnete Kenntnisse in der deutschen, französischen und englischen Sprache. Er ist parteilos und lebt in Bern."
author = "Bundeskanzlei BK"
year_published = 2025
clearnet = "https://admin.ch/gov/de/start/bundeskanzlei/vizekanzler_brsprecher.html"
