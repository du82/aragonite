title = "Bundesrat"
full_description = "Zum Seitenende Wer sitzt in der Regierung? Sieben Departementsvorsteherinnen und Departementsvorsteher bilden den Bundesrat. Entschieden wird gemeinsam. Der Bundeskanzler unterstützt die Regierung. Wie arbeitet die Regierung? Der Bundesrat lenkt die Schweiz, leitet die Verwaltung, schlägt Gesetze vor und vollzieht sie. Er trifft sich wöchentlich und informiert über Entscheide. Wer regierte seit 1848? Alle Namen der über hundert Bundesräte und Bundesrätinnen. Ihre Partei-, Kantons- und Sprachzugehörigkeit erzählen die Geschichte der Konkordanz. Bilder und Reden des Bundesrats Archiv der offiziellen Bundesratsfotos; die traditionelle, jährliche Schulreise; die Ansprachen des Bundespräsidenten zum Nationalfeiertag und zum Neujahr. Wo arbeitet die Regierung? Der Bundesrat fällt seine Entscheide an den wöchentlichen Bundesratssitzungen - sie finden im Bundesratssitzungszimmer statt. Bundesratswahl Ablauf Der Bundesrat wird in der Schweiz von dem Parlament gewählt. Die Wahl findet alle vier Jahre im Dezember statt. Legislaturplanung 2023–2027 Die politische Agenda für die Legislatur 23-27 enthält 25 Ziele in den Bereichen Wohlstand, Zusammenhalt, Sicherheit, Klima"
