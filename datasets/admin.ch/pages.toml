["https://admin.ch/gov/de/start/bundesrat/aufgaben-des-bundesrates.html"]
title = "Aufgaben des Bundesrates"
description = "Die Schweizer Regierung, der Bundesrat, ist die oberste vollziehende Behörde (Exekutive) des Landes. Die sieben Mitglieder haben eine Doppelfunktion. Zusammen bilden sie die Regierung, einzeln stehen sie einem Departement (Ministerium) vor. Kollegialität und Konsens sind zwei grundlegende Prinzipien des Schweizer Regierungssystems."
full_description = "Zum Seitenende Aufgaben des Bundesrates Regieren Die wichtigste Aufgabe des Bundesrats ist das Regieren. Er beurteilt laufend die Lage, legt die Ziele und Mittel des staatlichen Handelns fest, leitet die Umsetzung und vertritt den Bund nach innen und aussen. Leiten Bundesrätinnen und Bundesräte haben eine Doppelfunktion. Sie sind Mitglieder der Regierung und damit im Kollegium gemeinsam verantwortlich für die Regierungstätigkeit. Und sie führen ein Departement und vertreten dessen Aufgaben und Aufträge im Kollegium. Entscheiden Botschaften ans Parlament, Parlamentarische Anfragen, Verordnungsänderungen, Ausgaben, Wahlen: der Bundesrat muss laufend Entscheide fällen. Dies geschieht an der Bundesratssitzung. Lage beurteilen Die strategische Planung und Lagebeurteilung haben für den Bundesrat einen hohen Stellenwert. Er kontrolliert auch, ob die Aufgaben erfüllt und die Ziele erreicht werden. Informieren Die Sitzungen des Bundesrates sind nicht öffentlich. Aber der Bundesrat informiert die Kantone, das Parlament und die Öffentlichkeit nach jeder Sitzung umfassend über seine Entscheide und Absichten. Einkommen, Dienstfahrzeuge, Reisen Besoldung, Ruhegehalt, Dienstfahrzeuge, Reisen, usw. Erfahren Sie mehr zu den Rechten und Pflichten, die für amtierende und ehemalige Bundesräte gelten. Einkommen und Renten (PDF, 144 kB, 03.01.2025) Aide-Mémoire (PDF, 1 MB, 31.12.2024) Repräsentations- und Dienstfahrzeuge (PDF, 96 kB, 22.02.2024) Flüge 50 Jahre Von-Wattenwyl-Gespräche Seit 1970 trifft sich regelmässig eine Delegation des Bundesrates mit den Spitzen der Bundesratsparteien, um aktuelle Themen zu besprechen. Die Von-Wattenwyl-Gespräche wurden lanciert, um die Suche nach Konsenslösungen im Konkordanz-System zu erleichtern. Letzte Änderung 16.01.2025 Zum Seitenanfang Social share"
