["https://admin.ch/gov/de/start/bundespraesidium/rechtliche-grundlagen-des-bundespraesidiums.html"]
title = "Grundlagen des Bundespräsidiums"
description = "Bundespräsidium: Was sind die rechtlichen Grundlagen für das Amt des Schweizer Bundespräsidenten beziehungsweise der Bundespräsidentin? Welche Aufgaben nimmt die jeweils amtierende Präsidentin wahr? Was macht der Vizepräsident des Bundesrates?"
full_description = "Im Gegensatz zu anderen Ländern wird in der Schweiz nie eine Einzelperson Staatsoberhaupt. Der Bundespräsident hat als «Primus inter Pares» (Erster unter Gleichgestellten) während seines Amtsjahres jedoch eine Reihe von traditionellen Funktionen und Aufgaben. Der Bundespräsident oder die Bundespräsidentin wird für jeweils ein Amtsjahr von der Vereinigten Bundesversammlung gewählt. Auch wenn es die Amtsbezeichnung suggeriert: Der Bundespräsident ist nicht Staatsoberhaupt – diese Funktion übernimmt in der Schweiz keine Einzelperson, sondern der Gesamtbundesrat, der etwa bei offiziellen Staatsbesuchen das ausländische Staatsoberhaupt empfängt. Der Bundespräsident wird als «Primus inter Pares» bezeichnet, als «Erster unter Gleichgestellten». Er leitet die Bundesratssitzungen und schlichtet in strittigen Fragen. In dringlichen Fällen ordnet der Bundespräsident vorsorgliche Massnahmen an. Und für den Fall, dass weder eine ordentliche noch eine ausserordentliche Verhandlung des Bundesrates möglich ist, entscheidet der Bundespräsident an dessen Stelle. Amt des Vizepräsidenten Neben dem Bundespräsident wählt die Vereinigte Bundesversammlung jeweils auch den Vizepräsidenten oder die Vizepräsidentin des Bundesrates. Der Vizepräsident kommt zum Zug, wenn der Bundespräsident an der Amtsführung verhindert ist und übernimmt dann auch alle präsidialen Aufgaben. Der Bundesrat kann dem Vizepräsidenten präsidiale Befugnisse übertragen. Repräsentationspflichten Der Bundespräsident übernimmt während seines Amtsjahres besondere Repräsentationspflichten. Er hält etwa traditionsgemäss die Radio- und Fernsehansprachen zu Neujahr und zum Bundesfeiertag am 1. August. Ausserdem begrüsst er jeweils das diplomatische Corps - das sind die ausländischen Gesandten in der Schweiz - zum Neujahrsempfang im Bundeshaus. Seit den 1990er Jahren ist es üblich, dass der Bundespräsident amtliche Reisen ins Ausland unternimmt. Auch Beziehungen zu den Kantonen unterhält der Bundespräsident in besonderer Weise."
author = "Der Bundesrat"
year_published = 2025
