["https://admin.ch/gov/de/start/bundeskanzlei/vizekanzler_in.html"]
title = "Vizekanzlerin Rachel Salzmann"
description = "Rachel Salzmann ist seit dem 1. Juli 2024 Vizekanzlerin."
full_description = "Rachel Salzmann, geboren am 8. Dezember 1981, von Naters VS, hat an der Universität Bern Geschichte, Medien- und Kommunikationswissenschaften studiert und 2007 mit dem Lizenziat abgeschlossen. Sie verfügt über einen Executive Master of Business Administration mit Vertiefung im Public Management der Fachhochschule Bern. Rachel Salzmann arbeitete von 2012 bis 2018 im UVEK, die letzten vier Jahre als persönliche Mitarbeiterin von alt Bundesrätin Doris Leuthard. Anschliessend wechselte sie als Head Public und Regulatory Affairs zur Credit Suisse Energy Infrastructure Partners AG. Vor ihrem Eintritt in die Bundeskanzlei war sie Leiterin des CEO-Stabs der CSS Krankenversicherung. Am 1. Juli 2024 hat Rachel Salzmann als Vizekanzlerin die Aufgabe als Leiter des Bereichs Bundesrat übernommen. In dieser Funktion trägt sie in Abstimmung mit dem Bundeskanzler und dem Bundesratssprecher die Verantwortung für die qualitätskonforme und fristgerechte Erledigung aller Aufgaben im Rahmen der Vorbereitung, Durchführung und Nachbereitung der Bundesratssitzungen. Im Weiteren leitet sie sieben Organisationseinheiten mit rund 130 Mitarbeitenden, die unter anderem für die Sprachdienstleistungen der Bundeskanzlei, die Veröffentlichung der Amtlichen Publikationen und die Rechtserlasse zuständig sind. Rachel Salzmann ist verheiratet, hat einen Sohn und lebt mit ihrer Familie in Bern. Sie ist Mitglied der Mitte-Partei."
author = "Bundeskanzlei BK"
year_published = 2025
