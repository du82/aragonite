full_description = "Elisabeth Baume-Schneider Viola Amherd Guy Parmelin Karin Keller-Sutter Bundespräsidentin Ignazio Cassis Albert Rösti Beat Jans Session Bundesratswahlen vom 12. März Schutzstatus S Armeebotschaft 2025 Neuer Amtsdirektor Session Frühjahrssession des Parlaments Der Nationalrat und der Ständerat treffen sich vom 3. bis 21. März zur Frühjahrssession 2025. Session: Programm des Nationalrats Session: Programm des Ständerats Session: Live+ Bundesratswahlen vom 12. März Wer wird neuer Bundesrat? Am 12. März wählt das Parlament ein neues Bundesratsmitglied. Die Mitte hat zwei Kandidaten nominiert. Die neugewählte Person wird Viola Amherd ersetzen. Die Kandidaten, die Regeln Alle Bundesratsmitglieder seit 1848 Schutzstatus S Erwerbstätigkeit und Schutzstatus S Damit mehr Personen mit Schutzstatus S einen Job finden, schlägt der Bundesrat administrative Erleichterungen vor. So soll etwa die bisherige Bewilligungspflicht für die Erwerbstätigkeit in eine Meldepflicht umgewandelt werden. Schutzstatus S: Medienmitteilung Armeebotschaft 2025 Verteidigungsfähigkeit stärken Der Bundesrat beantragt dem Parlament Verpflichtungskredite über 1,7 Mia. Franken. Diese sind für Investitionen in Rüstungsbeschaffungen und für Immobilienprojekte des VBS vorgesehen und zielen darauf ab, die Verteidigungsfähigkeit der Armee zu stärken. Armeebotschaft 2025: Medienkonferenz Armeebotschaft 2025: Medienmitteilung Neuer Amtsdirektor Neuer Direktor des Bundesamtes für Lebensmittelsicherheit und Veterinärwesen Der Bundesrat hat Laurent Monnerat zum neuen Direktor des Bundesamtes für Lebensmittelsicherheit und Veterinärwesen (BLV) ernannt. Er wird sein Amt am 1. August 2025 antreten. Neuer Direktor: Medienkonferenz Neuer Direktor: Medienmitteilung Medienkonferenzen Alle Letzte Konferenzen des Bundesrates Medienmitteilungen Alle Zur Darstellung der Medienmitteilungen wird Java Script benötigt. Tweets Bundesratssprecher"
