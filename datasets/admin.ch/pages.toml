["https://admin.ch/gov/de/start/bundespraesidium/bundespraesidenten-und-schweizer-geschichte.html"]
title = "Bundespräsidenten und Geschichte"
description = "An dieser Stelle wird geschildert, wie sich das Schweizer Bundespräsidium und die zahlreichen „ungeschriebenen Gesetze“ rund um das Amt seit der Gründung des Bundesstaates 1848 entwickelt haben. Erwähnt werden zudem einige der herausragenden Bundespräsidentinnen und Bundespräsidenten der Geschichte."
full_description = "Das Schweizer Bundespräsidium hat eine wechselhafte Geschichte. Von zentraler Bedeutung sind seit jeher «ungeschriebene Gesetze». So galt das Amt des Bundespräsidenten ursprünglich als besondere Auszeichnung. Ab den 1890er Jahren bürgerte sich das Rotationsprinzip ein. Gegen Machtballung Die Schweizer Verfassungsväter waren «pragmatisch denkende und kompromissfreundliche Regierungsmitglieder einzelner Stände», wie es im Historischen Lexikon der Schweiz heisst. Zauderer waren sie nicht: Da es die politische Grosswetterlage im Frühling 1848 gestattete, machten sie sich entschlossen ans Werk und entwarfen in wenigen Wochen die Verfassung des Bundesstaates. Eine Machtballung in wenigen Händen wollten sie verhindern. Erst recht nicht in Frage kam eine Konzentration der exekutiven Befugnisse bei nur einer Person. Entsprechend haben sie das Bundespräsidium ausgestaltet. Zwei Rekordhalter Erster Bundespräsident wurde 1848 und 1849 der Zürcher Liberale Jonas Furrer. Im weiteren Verlauf des 19. Jahrhunderts wurden meist besonders einflussreiche Bundesräte ins Präsidialamt gewählt. Die Rekordhalter Karl Schenk (BE) und Emil Welti (AG) brachten es auf jeweils sechs Präsidialjahre. Beide gehörten allerdings auch während sehr langer Zeit der Landesregierung an: Welti 24 Jahre, Schenk sogar 31 Jahre – damit ist er bis heute der Bundesrat mit der längsten Amtsdauer. Rotationsprinzip seit 1890ern Das heute noch übliche Rotationsprinzip, wonach die Bundesräte im Turnus zum Vizepräsidenten und ein Jahr später zum Bundespräsidenten gewählt werden, hat sich erst in den 1890er Jahren eingebürgert. Davor wählte die Bundesversammlung meist besonders angesehene Bundesräte zu Bundespräsidenten. Wer bei den Parlamentariern weniger beliebt war, musste sich teilweise lange gedulden: So wurde der St. Galler Willhelm Matthias Naeff trotz einer Amtszeit von 27 Jahren bloss einmal Bundespräsident (1853). Von den bis dato 119 Bundesrätinnen und Bundesräten bekleideten rund 20 das Amt der Bundespräsidentin oder des Bundespräsidenten nie. Dass ein Bundespräsident sein Amt nicht antreten konnte, kam nur einmal vor: Der Waadtländer Victor Ruffy, der zum Bundespräsidenten für das Jahr 1870 gewählt worden war, starb am 29. Dezember 1869. Es trat nie ein amtierender Bundespräsident zurück, der Zürcher Wilhelm Hertenstein allerdings verstarb 1888 im Amt. Lange auch Aussenminister In den ersten Jahrzehnten nach der Gründung des Bundesstaates war es üblich, dass der Bundespräsident zugleich dem Politischen Departement, dem Vorläufer des Eidg. Departements für auswärtige Angelegenheiten (EDA), vorstand. 1888 wurden die beiden Ämter erstmals entkoppelt. 1897 bis 1920 wurde die Kopplung nochmals aktiviert. Zehn Mal eine Bundespräsidentin Bislang gab es zehn Mal eine Bundespräsidentin. Als erste Frau wurde 1999 Ruth Dreifuss in dieses Amt gewählt. Auf sie folgten Micheline Calmy-Rey (2007 und 2011), Doris Leuthard (2010 und 2017), Eveline Widmer-Schlumpf (2012), Simonetta Sommaruga (2015 und 2020), Viola Amherd (2024) und Karin Keller-Sutter (2025)."
author = "Der Bundesrat"
year_published = 2025
