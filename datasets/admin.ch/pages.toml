["https://admin.ch/gov/de/start/bundeskanzlei/bundeskanzler.html"]
title = "Bundeskanzler Viktor Rossi"
description = "Viktor Rossi (GLP) leitet die Bundeskanzlei seit 2024. Der Bundeskanzler unterstützt und berät die Regierung."
full_description = "Viktor Rossi wurde 1968 geboren. Nach seiner Berufslehre als Koch machte er die gymnasiale Matura und absolvierte das Lehrerstudium für Wirtschaft und Recht an der Universität Bern. Nebst Weiterbildungen im Führungs-, Projekt- und Prozessmanagement erlangte er 2015 ein Diploma of advanced studies in Law. Viktor Rossi war während 11 Jahren Direktor des Kaufmännischen Bildungsunternehmens «Bildung Formation Biel-Bienne (BFB)». Während dieser Zeit amtete er als Vizepräsident und Sekretär der Konferenz der Berufsfachschulen und höheren Fachschulen des Kantons Bern sowie als Präsident der Kaufmännischen Rektorenkonferenz des Kantons Bern. Ab 2010 leitete er die Sektion Geschäftsverwaltung und Logistik der Bundeskanzlei. Seit 2015 war er Beauftragter des Bundeskanzlers als Auftraggeber des IKT-Schlüsselprojektes GENOVA (Einführung der Geschäftsverwaltung/GEVER-Standardlösung für die zentrale Bundesverwaltung). Seit 2019 war Viktor Rossi Vizekanzler und leitete den Bereich Bundesrat. Viktor Rossi ist verheiratet und hat zwei erwachsene Töchter. Er ist schweizerisch-italienischer Doppelbürger. Er ist Mitglied der Grünliberalen Partei."
author = "Bundeskanzlei BK"
