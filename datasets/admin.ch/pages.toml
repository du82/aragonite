["https://admin.ch/gov/de/start/bundespraesidium.html"]
title = "Bundespräsidium"
full_description = "Zum Seitenende Präsidialjahr 2025 Karin Keller-Sutter wurde am 11.12.2024 zur Bundespräsidentin für das Jahr 2025 gewählt. Es ist ihr erstes Präsidialjahr. Grundlagen des Bundespräsidiums Dem Bundespräsidenten oder der Bundespräsidentin kommen in seinem Amtsjahr besondere Aufgaben zu - sowohl in der Zusammenarbeit innerhalb der Regierung wie auch in der Repräsentation nach aussen. Geschichte des Bundespräsidiums Seit der Gründung des Bundesstaates 1848 hat sich das Amt des Bundespräsidenten mehrmals erheblich verändert. Vieles, was heute als selbstverständlich gilt, war es früher keineswegs."
