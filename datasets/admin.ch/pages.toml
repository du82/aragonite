["https://admin.ch/gov/de/start/bundeskanzlei/aufgaben-der-bundeskanzlei.html"]
title = "Die Bundeskanzlei"
description = "Die Bundeskanzlei ist die Stabsstelle des Bundesrats und hat die Funktion eines Scharniers zwischen Regierung, Verwaltung, Parlament und Öffentlichkeit."
full_description = "Als Stabsstelle des Bundesrats organisiert die Bundeskanzlei die Sitzungen der Regierung und informiert über deren Beschlüsse. Sie veröffentlicht amtliche Texte, ist Garantin der politischen Rechte und sorgt für die korrekte Durchführung von eidgenössischen Wahlen und Abstimmungen. An der Schnittstelle von Bundesrat, Verwaltung, Parlament und Bevölkerung Die Bundeskanzlei (BK) ist die Stabsstelle des Bundesrats und hat die Funktion eines Scharniers zwischen Regierung, Verwaltung, Bundesversammlung und Öffentlichkeit. Sie ist verantwortlich für die Vorbereitung, Durchführung und Nachbereitung der Bundesratssitzungen. Sie koordiniert die Information von Medien und Öffentlichkeit über Beschlüsse und Haltung der Landesregierung. Die BK sorgt dafür, dass Bürgerinnen und Bürger ihre politischen Rechte wahrnehmen können und sie garantiert eine korrekte Durchführung von eidgenössischen Wahlen und Abstimmungen. Sie veröffentlicht amtliche Publikationen, erbringt Sprachendienstleistungen und spielt eine zentrale Rolle bei der digitalen Transformation der Bundesverwaltung. Regierungskommunikation Die Bundeskanzlei koordiniert die Kommunikation des Bundes gegenüber den Medien, der Öffentlichkeit, den Kantonen und dem Parlament. In Koordination mit den Departementen sorgt sie für eine einheitliche, frühzeitige, kontinuierliche und umfassende Information des Bundesrats über seine Aktivitäten und Beschlüsse. Der Bundesratssprecher leitet die Medienkonferenz nach der wöchentlichen Bundesratssitzung. Politische Rechte Schweizerinnen und Schweizer verfügen über ausgedehnte politische Rechte. Sie können Initiativen und Referenden lancieren und/oder unterzeichnen. Drei- bis viermal pro Jahr können sie über politische Fragen abstimmen, und alle vier Jahre wählen sie die Mitglieder des Nationalrats. In den meisten Kantonen finden gleichzeitig die Ständeratswahlen statt. Die Bundeskanzlei informiert die Bevölkerung über die politischen Rechte im Allgemeinen sowie über die Inhalte von eidgenössischen Abstimmungsvorlagen im Besonderen. Sie sorgt für einen reibungslosen Verlauf eidgenössischer Urnengänge und veröffentlicht deren Ergebnisse."
author = "Der Bundesrat"
year_published = 2025
