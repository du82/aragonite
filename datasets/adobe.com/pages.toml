ddy. AI Assistant for Acrobat. Here's a timesaving hack: Ask questions across your course docs and uncover quick insights. Add AI Assistant at checkout. Learn more masonry full-width Your path forward starts here. Find exactly what you need to get anywhere you want to go in school, at work, and in life. It all starts with All Apps. https://main--cc--adobecom.hlx.page/cc-shared/fragments/merch/creativecloud/buy/mini-compare/creativecloud/edu/default View all plans and pricing background linear-gradient(.5turn, #ffffff 15%, #8D5BCF 70%, #8154BF) style xl spacing, one merch card, xl spacing, grid width 10 https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/creative-cloud-64.svg | Adobe Creative Cloud What’s included in Creative Cloud All Apps for students? Apps for everything. Loads of perks. Plus, Adobe Firefly generative AI features for creating images with simple text prompts. style grid-width-8 Popular Photo Video Social media Illustration 3D & AR active tab 1 id for-the-kids background #F5F5F5 https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/photoshop-64.svg | Photoshop Photoshop Edit and combine images for posters, flyers, social collages, and websites. https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/premiere-pro-64.svg | Premiere Pro Premiere Pro Create pro-quality videos like documentaries, short films, and more. https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/acrobat-pro-64.svg | Acrobat Pro Acrobat Pro Create, comment, highlight, share, and do more with your PDFs. https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/illustrator-64.svg | Adobe Illustrator Illustrator Create graphics and illustrations like logos, infographics, and t-shirt designs. https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/indesign-64.svg | InDesign InDesign Design page layouts for print and digital campus flyers, magazines, and eBooks. https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/lightroom-64.svg | Adobe Lightroom Lightroom Edit and share photos anywhere for social posts, club websites, and blogs. See what’s included tab for-the-kids, 1 style xl spacing, static links, three up background #F5F5F5 https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/photoshop-64.svg | Photoshop Photoshop Edit and combine images for posters, flyers, social collages, and websites. https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/lightroom-64.svg | Adobe Lightroom Lightroom Edit and share photos anywhere for social posts, club websites, and blogs. https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/express-64.svg | Adobe Express Adobe Express Design presentations, graphics, videos, and animations in minutes using thousands of beautiful templates. See what’s included tab for-the-kids, 2 style xl spacing, static links, three up background #F5F5F5 https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/premiere-pro-64.svg | Premiere Pro Premiere Pro Create everything from social clips to full-length films with the leading video editor. https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/after-effects-64.svg | After Effects After Effects Create movie titles, intros, and transitions with the industry standard for motion graphics and visual effects. See what’s included tab for-the-kids, 3 style xl spacing, static links, three up background #F5F5F5 https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/express-64.svg | Adobe Express Adobe Express Design presentations, graphics, videos, and animations in minutes using thousands of beautiful templates. Photoshop Express Edit and transform your photos on the go. See what’s included tab for-the-kids, 4 style xl spacing, static links, three up background #F5F5F5 https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/illustrator-64.svg | Adobe Illustrator Illustrator Create beautiful designs, icons, infographics, and logos for class projects and extracurriculars. https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/photoshop-64.svg | Photoshop Photoshop Create and edit images, graphics, and artwork for presentations, reports, posters, and social posts. https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/fresco.svg | Fresco Fresco Enjoy a natural painting and drawing experience with the world’s largest collection of brushes. See what’s included tab for-the-kids, 5 style xl spacing, static links, three up background #F5F5F5 https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/substance-3d-collection-ste-long.svg | Substance 3D Collection Substance 3D Collection apps for students Model, texture, and render 3D assets and scenes. Free for eligible students and teachers. Not included in Creative Cloud All Apps.See what’s included. https://main--cc--adobecom.hlx.page/cc-shared/assets/img/product-icons/svg/aero-64.svg | Aero Adobe Aero Design and share interactive experiences in augmented reality. See what’s included tab for-the-kids, 6 style xl spacing, static links, two up background #F5F5F5 Everything works together. style grid width 8 https://main--cc--adobecom.hlx.page/cc-shared/assets/video/ste/students/media_1aae1ec10e7be15dc890f25fce50255ea95639114.mp4#_autoplay Create show-stopping images with Lightroom and Photoshop. Make basic photo edits in Lightroom. Then hop into Photoshop to create something totally unique and totally you. https://main--cc--adobecom.hlx.page/cc-shared/assets/video/ste/students/media_12c34ba239ea28ec89ab9832d581a0a726dd076ea.mp4#_autoplay Make memorable reports with Illustrator and Acrobat. Whip up a custom graphic, diagram, or chart in Illustrator. Pull it into Acrobat to bring your report or term paper to life. https://main--cc--adobecom.hlx.page/cc-shared/assets/video/ste/students/media_15ff74bd3b271fb0b50911faa92912d605c770c0e.mp4#_autoplay Design iconic posters with Photoshop and Adobe Express. Start by making your own logo in Photoshop. Drop it into a poster template in Adobe Express and easily customize it to perfection. style Three up What students are saying. style grid width 10, center background #f5f5f5 Carousel container background #f5f5f5 style l-spacing Liam Stone - Visual Communication Design major, University of Washington “Leaning on the Adobe tutorials and learning materials made it really easy to get a hang of things quickly.” carousel Carousel container style center Crizio Sinuraya - Digital Marketing major, Western Michigan University “I really wanted to make my mark, set my own standards, and have fun in the process. Adobe Creative Cloud All Apps helped me wow my class.” carousel Carousel container style Center Emily Otoshi - Cognitive Science major, UCLA “Having Adobe Creative Cloud All Apps helps me achieve all the things that I want to do. The ability to communicate effectively is so important — across work, school, anything you’re passionate about.” carousel Carousel container style center It’s easy to get started. Whatever your skill level, you’ll find plenty of step-by-step Creative Cloud tutorials to match your interests. Carousel show3 HOW-TO • DESIGN & LAYOUT Dream it, type it, see it with Generative Fill. Learn more carousel Carousel show3 style center TUTORIAL ARTICLE • BEGINNER • 1 MIN How to remove a background from a photo in one click Learn more carousel Carousel show3 style center BEGINNER • 1 MIN Edit text and images in PDF files Learn more carousel Carousel show3 style center TUTORIAL ARTICLE • BEGINNER • 2 MIN Tip: Move and regenerate an object made by Generative Fill Learn more carousel Carousel show3 style center TUTORIAL ARTICLE • BEGINNER • 5 MIN Getting Started with Video Editing in Adobe Express Learn more carousel Carousel show3 style center HOW-TO • DESIGN & LAYOUT Remove unwanted objects in Photoshop. Learn more carousel Carousel show3 style center Questions? We have answers. style grid width 8 background #f5f5f5 Is Adobe Creative Cloud free for college students? No, Adobe Creative Cloud is not free for college students — but we do offer a seven-day free trial. It provides free access to over 20 apps, including Adobe Photoshop, Acrobat, Illustrator, Lightroom, and Premiere Pro, plus 100GB of cloud storage. After the free trial expires, the student membership price is PRICE - ABM - Creative Cloud All Apps 100GB for the {{annual-paid-monthly-plan}} for the first year, and PRICE - ABM - Creative Cloud All Apps after that. How do I get a student discount on Adobe Creative Cloud? The easiest way to get a student discount of {{percentage-discount-ste}} on Adobe Creative Cloud is to visit the Creative Cloud Plans and Pricing page. Provide a school-issued email address during purchase so you can be instantly verified. How does Adobe verify student status? Adobe verifies student status through the school-issued email address provide during purchase. A school email address may include .edu, .k12, or other email domains sponsored by educational institutions. If you do not have a school-issued email address or your email address cannot be verified, additional proof of eligibility may be requested after purchase. Students and educators at accredited schools Proof of eligibility must be a document issued by the institution with your name, institution name, and current date. Types of proof of enrollment include: School ID card Report card Transcript Tuition bill or statement Homeschooled students Proof of eligibility may include: Dated copy of a letter of intent to homeschool Current membership ID to a homeschool association (for example, the Home School Legal Defense Association) Dated proof of purchase of curriculum for the current academic school year *Accredited schools are those that are approved by an association recognized by the U.S. Department of Education/State Board of Education or the Canadian/Provincial Ministries of Education and that teach students as their primary focus. In the U.S., such associations include: Middle States Association of Colleges and Schools, North Central Association of Colleges and Schools, Western Association of Schools and Colleges, Southern Association of Colleges and Schools, New England Association of Schools and Colleges, Northwest Association of Accredited Schools. † Documents dated within the last six months are considered current. How long does an Adobe Creative Cloud student membership last? The Adobe Creative Cloud student membership is valid for one year. Students can choose either to pay the entire year in full up front or be billed monthly. Either option requires a one-year commitment. At the end of each year, your subscription will auto-renew. How can I learn how to use the Adobe Creative Cloud apps? The Adobe Creative Cloud student membership includes tons of live tutorials on Adobe Live as well as on-demand tutorials for beginners, experts, and anyone in between. You don’t have to start from scratch. You can find free templates and project ideas on Adobe Stock. How many computers can I use my Creative Cloud membership on? An individual student membership lets you install your Adobe app on more than one computer, and sign in (activate) on two computers. However, you may use the app on only one computer at a time. How long does the Adobe Creative Cloud student discount price last? The Adobe Creative Cloud student discount price of PRICE - ABM - Creative Cloud All Apps 100GB for the {{annual-paid-monthly-plan}} lasts for the first year of your membership, and increases to PRICE - ABM - Creative Cloud All Apps for subsequent years. For more information, see the terms and conditions. Who qualifies for the Adobe Creative Cloud student discount? To qualify for an Adobe Creative Cloud student discount, you must be at least 13 years old and enrolled in a university, college, primary school, secondary school, or home school. What’s included in the Adobe Creative Cloud plan for students? Acrobat Pro Photoshop Illustrator InDesign Premiere Pro After Effects Lightroom Adobe XD Animate Lightroom Classic Dreamweaver Dimension Audition InCopy Character Animator Capture Fresco Bridge Adobe Express Photoshop Express Photoshop Camera Media Encoder Aero Prelude Lightroom Web Adobe Scan Fill & Sign Acrobat Reader Do I have to pay to update Adobe Creative Cloud apps? No. You’ll always have access to the latest versions of the apps and you can update them whenever you’re ready. You can even revert to older versions of apps if you like. style M spacing, static links background #f5f5f5 https://main--cc--adobecom.hlx.page/cc-shared/fragments/creativecloud/buy/students/bottom-blade {{home}} {{adobe-cc}} Students & Teachers"
