title = "Creators first."
description = "Adobe is committed to developing generative AI responsibly, with creators at the center. Our mission is to give creators every advantage — not just creatively, ..."
full_description = "Creators first. Adobe is committed to developing generative AI responsibly, with creators at the center. Our mission is to give creators every advantage — not just creatively, but practically. As Firefly evolves, we’ll continue to work closely with the creative community to build technology that supports and improves the creative process. style Grid width 8, center Enhance the creative process. The vision for Firefly is to help people expand upon their natural creativity. As both a product and an embedded model inside Adobe apps, Firefly offers generative AI tools made specifically for creative needs, use cases, and workflows. Give creators practical advantages. Trained on content we have permission to use, like Adobe Stock, Firefly is designed to be safe for commercial use. To ensure that creators can benefit from generative AI, we’ve developed a compensation model for Adobe Stock contributors whose content is used in the dataset to retrain Firefly models. Set the standard for responsibility. Through efforts like the Content Authenticity Initiative and the Coalition for Content Provenance and Authenticity, we’re standing up for accountability, responsibility, and transparency in generative AI. We’re working toward a universal “Do Not Train” Content Credentials tag that will remain associated with a piece of content wherever it’s used, published, or stored. style Three up, no spacing, static links Learn more|Learn more about Adobe's commitment to creators and responsible AI style M spacing, static links"
