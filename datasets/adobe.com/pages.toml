["https://www.adobe.com/cc-shared/fragments/products/firefly/faq"]
title = "Questions? We have answers."
description = "Adobe Firefly is family of creative generative AI models. Features powered by Firefly are embedded in Adobe’s flagship apps and Adobe Stock."
full_description = '''Questions? We have answers. What is {{Adobe Firefly}}? Adobe Firefly is family of creative generative AI models. Features powered by Firefly are embedded in Adobe’s flagship apps and Adobe Stock. Firefly is the natural extension of the technology Adobe has produced over the past 40 years, driven by the belief that people should be empowered to bring their ideas into the world precisely as they imagine them. What is generative AI? Generative AI is a type of artificial intelligence that can translate text and other inputs into extraordinary results. While the conversation around this technology has centered on AI image and art generation, generative AI can do much more than generate static images from text prompts. With a few simple words and the right AI generator, anyone can create videos, documents, and digital experiences, as well as rich images and art. AI art generators can also be useful for producing “creative building blocks” like brushes, vectors, and textures that can add to or form the foundation of pieces of content. What is Adobe doing to ensure AI-generated images are created responsibly? As part of our work to design Firefly to be commercially safe, we trained our first Firefly model on licensed images from Adobe Stock and public domain content where copyright has expired. We perform internal testing on our generative AI models to mitigate against any harmful biases or stereotypes. We also provide feedback mechanisms so users can report potentially biased outputs and we can remediate any concerns. In addition, Adobe is committed to building trust and transparency into digital content with Content Credentials. Content Credentials function as a digital "nutrition label" that can show important information about how and when content was created and modified, including whether and how AI was used. Adobe automatically attaches Content Credentials to images created in Firefly to show that they were AI generated. This level of transparency gives creators a way to authenticate their content and helps consumers make informed decisions about content they see online. This is the mission behind cross-industry coalition the Content Authenticity Initiative (CAI). The CAI was co-founded by Adobe in 2019 and now counts more than 3,300 members including tech companies, news organizations, NGOs, academia and more. The CAI works alongside the Coalition for Content Provenance and Authenticity (C2PA) industry standards organization, which developed the technical specification for provenance technology used in Content Credentials. Which {{Creative-Cloud-apps}} have Firefly? We are bringing Adobe Firefly to Creative Cloud apps. Features powered by Firefly can currently be found inside {{Photoshop}}, {{Illustrator}}, {{Adobe-Express}}, {{Substance-3D}}, {{InDesign}}, Lightroom and {{Adobe-Stock}}. What are generative credits? Your Creative Cloud, Adobe Express, Firefly, or Adobe Stock subscription includes monthly generative credits that give you access to content creation features powered by Firefly. Find out more about generative credits. What languages does Firefly support? Firefly is bringing the power of generative AI to global audiences by supporting over 100 languages for text prompt inputs. For audio and video translation, Firefly supports over 20 languages. What if my prompt isn’t accurately translated? We currently support prompts in over 100 languages using machine translation to English provided by Microsoft Translator. Because of the nuances of each language, it’s possible certain generations based on translated prompts may be inaccurate or unexpected. We are working hard to identify and resolve any issues. To report incorrect translation results, hover over a generated image and click on the Report tool. What is the difference between Firefly Image models? The newer generation of image generation models within Firefly produces higher quality images, better interpretation of prompts, and more accurate text in images. Where does Firefly get its data from? We train our Firefly models solely on data we have the rights to use. Our first models were trained on unique datasets comprised of Adobe Stock images, openly licensed content and content in the public domain for which the copyright has expired. We also provide our customers with the ability to train their own Custom Models so they can easily generate content with their own styles, subjects and/or brand language. Does Adobe train Firefly with Adobe Stock editorial content? No. Adobe Stock's editorial content is not used to train Adobe Firefly's generative AI models. As an Adobe customer, will I have copies of my content included as part of the Firefly model? No, copies of customer content are not included in the Firefly models. As an Adobe customer, will I have my content used automatically to train Firefly? No. We do not train on any Creative Cloud subscribers’ personal content. For Adobe Stock contributors, the content is part of the Firefly training dataset, in accordance with Stock Contributor license agreements. What is Adobe’s approach to ethics in generative AI? We have developed and deployed generative AI at Adobe in accordance with our AI ethics principles of accountability, responsibility, and transparency. Read about AI ethics at Adobe to learn more about our approach and commitment to developing generative AI in a way that respects our customers and aligns with our company values. Does Adobe plan to compensate {{adobe-stock}} contributors whose content is used in the dataset to train Firefly models, and what will the compensation plan look like? We have a compensation model for {{adobe-stock}} contributors. For more information, see the {{adobe-stock}} FAQ. What is Adobe doing to ensure that Firefly is commercially safe? As part of Adobe’s effort to design Firefly to be commercially safe, we are training our initial commercial Firefly model on licensed content, such as Adobe Stock, and public domain content where copyright has expired. Can I use Firefly-generated outputs in commercial projects? Outputs from generative AI features without the beta label can be used commercially. Outputs from generative AI beta features can be used commercially unless otherwise designated in the product or elsewhere, but these outputs are not eligible for indemnification while in beta. What is Adobe GenStudio? How does it relate to Firefly? Adobe Firefly is an integral part of Adobe GenStudio — a generative AI-first offering for marketers to quickly plan, create, manage, activate, and measure on-brand content. Adobe GenStudio natively integrates Adobe Experience Cloud and Creative Cloud applications like Frame.io, Adobe Express, and Firefly Services to automate content production at scale. What is Firefly Services? Firefly Services is a comprehensive set of generative AI and creative APIs, tools and services for content generation, editing, and assembly, empowering organizations to automate the production of content while maintaining quality and control. These new generative AI capabilities powered by Adobe Firefly help organizations automate content production and tailor it to their brand. Learn more here. style Grid width 8, static links style M spacing'''
