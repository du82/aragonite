["https://adobe.design/stories/our-people/ask-adobe-design-how-do-you-move-through-a-creative-block"]
title = "Ask Adobe Design: How do you move through a creative block?"
description = "Five team members share how they get creatively unstuck"
full_description = "Ask Adobe Design: How do you move through a creative block? Five team members share how they get creatively unstuck Illustration by Ellen Porteus Creative blocks can be frustrating. Whether trying to generate ideas for a particularly difficult challenge or looking for inspiration for a personal project, hitting creative and productive roadblocks can make people feel stuck and unproductive. From brainstorming sessions and sketching by hand to mindful walks and sharing in-progress work, there are multiple ways designers overcome obstacles and reignite their imagination, helping them get back to producing their best work. Five Adobe Design team members share their strategies for navigating these moments of stagnation. “One of the first things I do is shift my perspective so I can look at my work from a fresh angle—like the point of view of a user.” Unez Akbar, Senior Experience Designer, Document Cloud “When I face a creative block, I rely on a mix of strategies to help me move forward. One of the first things I do is shift my perspective so I can look at my work from a fresh angle—like the point of view of a user. I’ll conduct quick user testing or informal hallway tests with people who haven't seen the project before, to explore different ways a user might interact with a design, to see if my current path is too complicated or if a new approach could simplify it. Another helpful approach is connecting with real people. Talking to users or revisiting their stories and needs can bring clarity and motivation, and understanding what drives behavior can inspire new directions. “Brainstorming sessions with my team, whether formal workshops or monthly huddles, are great for gaining new perspectives. I also make it a point to share in-progress work. Even if the work isn’t fully polished, getting feedback early on can reveal blind spots and spark fresh ideas. “Changing my routine can help, too. Switching to sketching by hand, instead of jumping straight into digital tools, keeps me from leaning on preset solutions and encourages out-of-the-box thinking. Digital concepting spaces help me visualize my ideas and sticky notes are great for mind mapping. “When things get really tough, I take a break. Moving to a different space, like the cafe in the office or a quiet phone booth, gives me a fresh mental outlook. Even a five-minute pause can work wonders—just closing my eyes and taking a deep breath can help uncover a fresh approach. “I also stay curious. I read Medium, browse work on Behance, watch design talks, and challenge myself with small creative tasks to help stay sharp and motivated. I also take time to reflect on my past work. I ask myself what I loved about it and what I might change. At the end of each year, I reflect on what went well and what I could improve, using those lessons to push forward with renewed determination.” “To stay balanced and keep my creativity flowing, I set aside time each week for activities that recharge me mentally and emotionally.” Lusine Dashtoyan, Senior Experience Designer, Workfront “I find that inspiration often comes from moments of stillness and connection with nature. The tranquility of the mountains, for instance, has a way of sparking fresh ideas and shifting my perspective. To stay balanced and keep my creativity flowing, I set aside time each week for activities that recharge me mentally and emotionally. Three hours of sketching is a ritual I look forward to—it’s a way to let my thoughts move freely onto paper, giving me space for creative expression. Meditation is another essential part of my routine, helping me clear my mind and create room for new ideas to come in. “While at work, I lean on a blend of methods to maintain that creative energy—sketching, whiteboarding, workshopping, team discussions, and diagramming. These aren’t just for solving work-related problems; they’re part of my commitment to keeping my mind healthy and balanced in other parts of my life. “For instance, meditation sets me up to feel happier and more motivated the next day, giving me a fresh mindset when approaching tasks. Spending time climbing mountains on the weekends leaves me feeling recharged and receptive to new ideas. Sketching, too, is a powerful way for me to take a break from screen time and shift into a more tactile, focused mode, which makes me more productive and creative when I return to digital work. These practices are more than just hobbies, they’re essential to nurturing my creativity and maintaining a sense of well-being that sustains my work over the long term.” “I love to learn new skills because it teaches me to approach design problems in different ways.” Arif Huda, Staff Product Designer, Frame.io “There’s a lot of complexity in this world and to solve and simplify these very human problems isn't supposed to be easy. The way I see it, creative blocks are one of the best opportunities to learn and grow as a designer. It requires a certain degree of passion and persistence to continue to design even when there’s no end in sight. “I love to learn new skills because it teaches me to approach design problems in different ways. There are certainly skills, like prototyping, that directly help me by giving me the power to think and explore a wider gamut of possibilities. However, more recently, I’ve been focused on more tactile skills that aren’t directly related to my work—like woodworking and calligraphy. It’s nice to have a break from the computer to tackle more tangible design problems. The planning and execution required in woodworking taught me how to break down a problem and reduce it to its essentials, while the creativity and precision required in calligraphy taught me to persevere. Whatever the skill is, it expands our way of thinking even if we don’t realize it. “Another way is to take a ‘break’ and experience the world. We design mini experiences every day and what we do requires a degree of empathy, understanding, and connecting at a very human level. Whether it’s traveling the world or the little moments with my family, I love to see how others perceive the world and tackle problems. We design not only on an intellectual level but an emotional one, so it’s important to develop both when trying to overcome any sort of block. Experiences fuel empathy and inspiration, and I use both to craft design solutions that deeply resonate with others. I truly believe a creative block is just a stop in a designer’s never-ending journey... there is always something new to learn or experience!” “Over time, I’ve come to see creative blocks as signals to pause, shift gears, and reconnect with the world and myself. It’s not about forcing ideas to come, but about letting creativity find its way back naturally.” Bhavya Minocha, Senior Experience Designer, Adobe Illustrator “For me, creative blocks aren’t just moments of frustration—they’re a part of living a rich, creative life. Over time, I’ve come to see them as signals to pause, shift gears, and reconnect with the world and myself. It’s not about forcing ideas to come, but about letting creativity find its way back naturally. “I was deeply inspired by Twyla Tharp’s The Creative Habit, which talks about cultivating creativity as a daily practice. One thing the book taught me is that creativity thrives on routine but also needs room to breathe. When I feel stuck, I start by doing the opposite of what my instincts tell me: Instead of doubling down on work, I stop. I rest, take a moment to reset, and I lean into the block rather than fighting it. “One habit I’ve developed during these moments is picking up my phone to take photos of everyday life. There’s something magical about looking at the ordinary through a (literally) different lens. A wilted flower on the sidewalk, the shadow cast by my dog’s paw, or the texture of peeling paint on a wall—it’s all beautiful when I stop to notice it. These tiny, captured moments often become the sparks for something larger, whether it’s a color palette, a texture, or just a fresh perspective. “I also doodle—a lot. Sometimes I draw dreams I’ve had the night before, other times just random shapes or thoughts that come to mind. There’s no pressure to make anything ‘good,’ it’s about the act of creating. Another favorite reset activity is arranging wildflowers or flipping through old magazines to play with photo montages. These hands-on tasks feel tactile and freeing, pulling me out of my head and back into the joy of making. “What I’ve learned is that overthinking can stifle creativity. Instead, I try to embrace the change of pace and let go of expectations. The more I focus on enjoying the process—whether it’s arranging flowers or photographing mundane objects—the more playful ideas start to flow. And before I know it, those playful moments begin to weave their way into my work. “To me, creative blocks and bursts of inspiration are both part of the same cycle. They’re signs that I’m experiencing life deeply, with all its ups and downs. And that itself is a gift. When feeling stuck, the best thing to do is pause, switch gears, and play a little. Don’t rush the process—embrace it. The ideas will come when they’re ready, and when they do, it will be that much more rewarding.” “It may seem counterintuitive, but when these negative thoughts or feelings arise, I try to pause and befriend them, rather than to power through.” Emily Posner, Senior Program Manager, Design Operations “Creative blocks can strike spontaneously and without warning, but I’ve learned that they most often occur because of pressure—external or internal. One of the most challenging aspects of a creative job is… that it’s a job. External pressures—time constraints, interpersonal dynamics, tricky clients, technology limitations—are regularly occurring, especially in the industry we work in. Change is the only constant! Over time, these pressures get easier, as we adapt and learn strategies for navigating them. “Internal pressures are often much harder for me to move past, and can result in creative blocks, decreased motivation, and other consequences. In my experiences, these often manifest as imposter syndrome, self-doubt, guilt, worry that my work isn’t good enough, and loneliness. Creativity has become a lot harder to do remotely, especially for those who externally process and thrive on the energy of a group dynamic. “It may seem counterintuitive, but when these negative thoughts or feelings arise, I try to pause and befriend them, rather than to power through. I take myself for a walk, I get away from my screen, and I give myself some space to listen. I get curious about what’s coming up for me. Why am I feeling this way? What’s triggered it? Simply naming and acknowledging what’s present allows me to release my tight grip on the stories I’m telling myself. “When I’m ready to revisit the work I feel blocked on, I’ll begin again in a space that feels physically different. I’ll switch up my environment and the tools I’m using. I like working from busy coffee shops or the library, in the company of other humans, where there’s good energy. These locations don’t always have reliable Wi-Fi, which is also a feature because it forces me to use analog tools—fun, colorful pens and a simple notebook—which help my brain reset and loosen around old patterns and habits that aren’t serving me. “Knowing how my brain tends to work, I need structure to begin. I set up constraints or ‘guardrails,’ so I don’t get overwhelmed by the details or the infinite possibilities. I'm fortunate to have the ability and capacity to carve out ‘focus’ days, which allow me to dedicate uninterrupted time to easing back into projects. Alleviating the sense of urgency gives me permission to explore without the feeling that I need to be producing all the time. Combining these different tactics and approaches are usually enough to get me going again, but to bolster myself with a little extra support I’ll schedule a near-term gathering with a few close, trustworthy peers so I can get some feedback and guidance on where the work is headed.” Header copy Design your career at Adobe. Button copy View all jobs Button link /jobs"
