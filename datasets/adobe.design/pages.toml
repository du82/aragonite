full_description = 'Ovetta Sampson on design in the age of generative AI Tips, best practices, and global principles for creating ethical models Photography by Myleen Hollero In this Adobe Design Summit talk, Ovetta Sampson (director of User Experience, Machine Learning, Google) shares practical tips to help designers be ethical and compassionate creators and users of Artificial Intelligence and Machine Learning. Ovetta has been working in design for over 30 years and specializing in Machine Learning and Artificial Intelligence for the last ten years. She provides a crash course for designers that includes a set of global principles for designing for these technologies and a call to reduce the potential for harmful outcomes. <iframe title="Adobe Video Publishing Cloud Player" width="640" height="360" src="https://video.tv.adobe.com/v/3427984/" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen scrolling="no"></iframe> Insights from this talk The importance of a design ethics statement when designing for new technologies How datasets show cultural biases, and best practices for using design to mitigate them Considerations for creating ethical AI models Guidelines for teaching generative AI models “right from wrong” What happened when Ovetta used generative AI to rewrite “The Three Little Pigs” About Adobe Design Summit Adobe Design Summit is a biennial, multi-day celebration of Adobe’s internal design culture. It’s an opportunity for our 700+ person team—in multiple time zones, countries, and regions—to share experiences and design perspectives with each other and partner teams inside of Adobe. Header copy Design your career at Adobe. Button copy View all jobs Button link /jobs'
