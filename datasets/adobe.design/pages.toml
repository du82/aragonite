full_description = '''SXSW panel: Building the future of digital products Product equity leaders from Adobe, Uber, and Visa discuss how to build equitable systems into the product development process At this year's South by Southwest festival, Adobe curated and participated in a panel addressing the increasing importance of product equity’s role in building inclusive products for historically marginalized and underinvested communities. The panel discussion focuses on product equity as a discipline, what’s working in the effort to build more inclusive and equitable products, and implementing internal processes around product equity at large companies. “On the margins: Building the future of digital products,” moderated by Shreya Singh Hernández (Tech Equity Research Manager, Aspen Institute, Aspen Digital), featured product equity leaders Timothy “TB” Bardlavens (Director of Product Equity, Adobe), Shadeequa “Dee” Miller, Ph.D., (Director of Inclusive Design & Product Equity, Visa), and Zach Singleton (Director of Product Management, Uber) in a conversation about incorporating equitable systems into the product development process. <iframe title="Adobe Video Publishing Cloud Player" width="640" height="360" src="https://video.tv.adobe.com/v/3429358/?hidetitle=true" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen scrolling="no"></iframe> Insights from this conversation How to balance tight timelines to ship products with the limited resources of product equity teams What it means to “move at the speed of trust” How to set goals around product equity work and define what success looks like The importance of understanding the difference between localization and culturalization How to build a shared understanding of product equity About SXSW Founded in 1987 in Austin, Texas, South by Southwest (SXSW) is dedicated to helping creative people achieve their goals. An essential destination for global professionals, the SXSW conference and festivals celebrate the convergence of tech, film, music, education, and culture. Header copy Design your career at Adobe. Button copy View all jobs Button link /jobs'''
