["https://adobe.design/stories/leading-design/how-adobe-design-is-shaping-the-firefly-gen-ai-experience"]
title = "How Adobe Design is shaping the Firefly generative AI experience"
description = "A look at the design thinking and strategy behind the new technology"
full_description = '''How Adobe Design is shaping the Firefly generative AI experience A look at the design thinking and strategy behind the new technology Digital image created in Firefly This week at Adobe Summit in Las Vegas, David Wadhwani, President, Digital Media at Adobe, announced a significant new chapter for the company with the introduction of Adobe Firefly, a new family of creative generative AI models, first focused on the generation of images and text effects. The beta, which people can use in a standalone website, will allow Adobe teams to learn from user feedback. Firefly-powered features will eventually be integrated into Adobe tools across Creative Cloud, Document Cloud, Experience Cloud, and Adobe Express. Team members across the Adobe Design organization have been shaping Firefly and Adobe’s approach to generative AI—here's a behind-the-scenes look at their thinking and process. Adobe Design forms Machine Intelligence & New Technology team The hub for generative AI design work is Adobe Design’s newly formed Machine Intelligence & New Technology (MINT) team, led by Director of Design Samantha Warren. “MINT is the center of gravity for developing a design-led strategy for emerging trends and new and advanced technology,” says Warren.Adobe has been leveraging artificial intelligence, machine learning, and responsible training data for years, with now-familiar features like Content Aware Fill (an Adobe Photoshop feature that removes unwanted objects). Warren sees incredible potential for generative AI technology in Adobe tools: “Generative AI sits at an exciting crossroads between creativity, technology, and culture. We want to design this technology in a way that’s good for artists and creative professionals; by engaging with the community, understanding their needs, and using that insight to develop things that help elevate their creativity.” How Adobe Design is shaping Firefly In addition to the MINT team, collaborators across Adobe Design—including our Research and Product Equity teams, and experience designers across Creative Cloud, Experience Cloud, and Document Cloud—are deeply involved in creating the Firefly experience and bringing design expertise to a range of critical aspects of the technology. Building with the creative community: Firefly is a generative AI service built specifically with creators in mind, and its DNA is informed by the passionate creatives across Adobe Design.The Adobe Design Research and Strategy team “approached Firefly research in the same way we approach other research projects, by building a deep understanding of customer needs and designing experiences that address those needs,” says Wilson Chan, Principal Experience Researcher. "This is important, because with Firefly, we know we’re not just building towards one experience, but potentially many different experiences tailored to different types of customers throughout their creative workflows” with the planned integrations across Adobe tools. The Firefly beta will allow Adobe to learn from user feedback. Creator choice and control are paramount, along with helping to ensure outputs are safe for commercial use: Firefly is trained on Adobe Stock images, openly licensed content, and public domain content where copyright has expired. Critical to this generative AI work is the Content Authenticity Initiative (CAI), a 900-member group founded by Adobe to create a global standard for trusted digital content attribution. Adobe is advocating for open industry standards using CAI’s open-source tools, including a universal “Do Not Train” content credentials tag for creators to request that their work not be used to train models, or be associated with the work wherever it may be used, published, or stored. For transparency, any AI-generated content made using Firefly will be tagged as such. Added Kelly Hurlburt, Senior Staff Designer, “Beyond the training set, we’re working to make the experience of generative AI approachable. Many of the generative capabilities out there require deep coding knowledge or complex prompt engineering. Our goal is to incorporate the power of Firefly directly into creative workflows in ways that are practical, empowering, and easy-to-understand.” We want to design this technology by engaging with the creative community, understanding their needs, and using that insight to develop things that help elevate their creativity. Samantha Warren, Director of Design Preventing harm and bias: Addressing the potential for harm and bias in Firefly will be an ongoing effort across Adobe. Adobe Design’s Product Equity team is working closely with company partners on Adobe's approach to generative AI ethics, policies and guidelines, features, and product testing, with these four outcomes as their primary goals: Minimization of exposure to harmful, biased, and offensive content Fair, accurate, and diverse representation of people, cultures, and identities A clear set of processes and policies for when harm is reported A codified and consistent process to assess and reassess our data inputs and product outputs to ensure we’re improving consistently Says Timothy Bardlavens, Director of Product Equity, “Our motto is ‘Do more good than harm.’ It’s impossible to remove all potential of harm, bias or offensive content in AI products. Our goal is to do better.”Solving the blank canvas problem: Firefly was made with creators in mind, and one of the experience design goals, according to AI/ML Designer Veronica Peitong Chen, is to solve the “blank canvas problem,” particularly for people who may be new to generative AI. In the physical world, an artist is challenged with how to begin a new creation on a canvas; in Firefly, the same challenge presents itself, but instead of a pencil or a paintbrush, the creative implement at their disposal is a written prompt. Firefly-powered features will eventually be integrated into Adobe tools across Creative Cloud, Document Cloud, Experience Cloud, and Adobe Express. “Crafting the right text input to generate the desired image requires a deep understanding of the AI model’s capability, limitations, and nuances,” Chen explains. “To create refined results, it may also require the user to be equipped with professional knowledge of different creative fields or artistic movements.” Early features include an inspiration feed of Firefly-generated images that allow people to see the prompts used to create them, curated style options for prompt refinement and experimentation with different visual appearances, and the ability to provide real-time feedback to the Firefly team so that results can be improved over time.Imagining how generative AI might improve the creative process: As the service is integrated into Adobe applications, Firefly-powered features may be used to generate infinite variations to help you find the perfect angle, color, or detail for your design. Features being planned include: Generate vector content from a simple prompt Create templates from a text prompt Generate new, detailed, images by combining multiple photos Replace elements of an image with objects, textures, patterns, and colors using inpainting Change the mood, look, and feel of a video or image based on a reference photo “I’m excited about the new realm of creative possibilities that Firefly will enable directly in your workflow, because that’s where the real magic happens,” says Brooke Hopper, Principal Designer. “Imagine being able to make last-minute tweaks or color changes to your final designs in seconds, allowing you to focus on the parts of the creative process you enjoy.”An early look at how Firefly functionality may come alive in Adobe tools: <iframe width="560" height="315" src="https://www.youtube.com/embed/_sJfNfMAQHw" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe> Ensuring the quality of outputs: While generative AI is ripe for experimentation, the Adobe Design team’s goal is to ensure that creators can use their outputs for personal or professional projects, which meant they needed to be commercially viable and meet creators’ varying standards of quality. “Quality is subjective and contextual to the task at hand,” explains Staff Designer Kelsey Mah Smith. “The mood, tone, and textures that I want to convey for a social media post for a local plant shop can be very different than a banner ad for a national campaign. Creative outputs are not singular, they’re reflective of many elements.” A six-segment rubric was created for assessing quality: Coherence: How closely does the Firefly output match the prompt and specified style? Technical quality: Is the Firefly output of adequate resolution and is text rendered correctly? Is it editable? Harm: Does the Firefly output perpetuate harmful stereotypes? Does it include sexualized, violent, or hateful content? Bias: Do Firefly outputs represent a diversity of skin tones, age, gender, body types, and cultural perspectives? Validity: Does the Firefly output respect human and animal anatomy? Does it respect physics and contextual awareness? Breadth: Can Firefly create a diverse range of concepts in outputs? Can it render a range of visual styles? “Designers at Adobe have spent their careers in the creative industry; we can relate to our users,” says Smith. “The creative process can be messy and iterative with happy accidents along the way. When it comes to generative AI, we wanted to emulate the experience that users have in our flagship apps. We want to bring joy, autonomy, and creative control to Firefly.” Learn more about Firefly Adobe launched a limited beta for Firefly this week that showcases how creators of all experiences and skill levels can generate high-quality images and text effects. Learn more about Firefly and sign up to participate in the beta at firefly.adobe.com. Header copy Design your career at Adobe. Button copy View all jobs Button link /jobs'''
