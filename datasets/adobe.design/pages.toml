description = "Adobe is committed to a future focused on creating more equitable processes around all aspects of product research, design, and development."
full_description = "Product Equity at Adobe Our Purpose At Adobe, the Product Equity team is dedicated to ensuring that everyone, regardless of human differences, can fully engage with our products without experiencing harm or barriers. Our focus is on transforming how we research, design, and develop products, strategically minimizing bias and harm at every phase. We recognize that traditional identity models often overlook the needs of underinvested communities. To address this, we’re committed to creating new development models that prioritize marginalized identities and lived experiences. Our approach is global and intersectional. By deeply understanding the challenges systemically underinvested and marginalized creators face, we design for one and extend to many. Co-creation is at the heart of our process, driving us to build products that better serve a wider range of people. We integrate this approach by working closely with teams across Adobe, equipping them with the necessary tools, resources, and knowledge to develop products that reflect the diversity of our world. As a result, Product Equity enables top-line business goals and generate new revenue and market opportunities. Our Vision Create a future where everyone, regardless of difference, can access and harness the power of digital products. Our Mission Drive more equitable outcomes across all Adobe products, services, and communities. Product Equity News & Resources https://adobe.design/stories/our-people/sxsw-panel-building-the-future-of-digital-products https://adobe.design/stories/leading-design/building-more-equitable-product-experiences-through-community-co-creation https://adobe.design/stories/design-for-scale/introducing-spectrum-2 https://adobe.design/stories/leading-design/reducing-biased-and-harmful-outcomes-in-generative-ai https://adobe.design/stories/community/ovetta-sampson-on-design-in-the-age-of-generative-ai https://adobe.design/stories/our-people/what-does-a-product-equity-product-manager-do-mariah-driver https://adobe.design/stories/leading-design/three-strategies-for-building-more-equitable-digital-products https://adobe.design/stories/design-for-scale/charting-the-course-for-adobe-s-product-equity-team https://adobe.design/stories/our-people/adobe-design-expands-its-product-equity-team https://adobe.design/stories/leading-design/inclusive-palettes-with-adobe-color https://adobe.design/stories/leading-design/how-to-implement-inclusive-design Header copy Design your career at Adobe. Button copy View all jobs Button link /jobs"
