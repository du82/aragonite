title = "Staff Experience Designer, Project Concept"
description = "Join us and help build the next generation of our world-famous tools."
full_description = "Staff Experience Designer, Project Concept The opportunity Adobe Design seeks a Staff Experience Designer to join our team focused on a new product and business for Adobe around the early stage of the creative process. Are you excited about GenAI and new technology? We are seeking a designer to help us build the best tools and services for creativity that bring AI to concept development and creative direction. We are a collaborative team pushing design paradigms towards future possibilities while partnering closely with engineers and scientists. We believe GenAI should accelerate creativity and not replace it; this role is to play a key role in the future. What you’ll do The successful candidate will be a strong communicator and designer who is both collaborative and proactive in nature, helping to drive towards execution. You will be an integral part of designing comprehensive experiences to transform the future of the start of the creative process; beyond the traditional set of Adobe tools. Because what we do moves extremely fast, we need someone who is motivated by high quality innovative solutions and driving towards progress. In this role, you will: Find opportunities to create simplicity out of complexity. Listen to the creative community to connect friction points to intuitive experience solutions. Explore design ideas via sketches, wireframes and prototypes. Use feedback and research to refine and iterate toward product objectives. Pair strong communication skills with a user-centered perspective to influence and persuade. Dig in with prototypers, engineers, and researchers to understand the capabilities of new and developing technologies while advocating for our user’s needs. Partner with senior executives, product managers, senior engineering scientists and partners across the company to bring new product experiences to life. Create compelling presentation decks and demonstrate concepts at various stages of the design process. Serve as an ambassador of Adobe Design, promoting our principles and methods when working with other groups at Adobe. What you need to succeed Must Have: Proven experience and/or training in design or a related field, with an emphasis on user experience, interaction design, or visual design. College degree or equivalent practical experience in design with an emphasis on graphic design, HCI, or related design field Very strong interpersonal, written, and oral communication and storytelling skills. Excellent design craft and the ability to blend that with strong intuition for addressing business goals. Experience working closely and iteratively with engineering teams to bring the vision to life A highly collaborative nature and proven ability to iterate through early concepts to bring a vision to life all the way through to execution. Mastery of Adobe Illustrator, Photoshop, and other design tools such as Keynote, Sketch, or Figma. Willingness and ability to contribute to the creative spirit of the Adobe Design team Passion for collaborating with many different stakeholders, teams and across different subject areas Nice to Have: Prior experience working within a creative agency or enterprise creative team using lean startup style methodologies. Prior experience crafting design strategy for platform experiences and design systems Deep knowledge around and passion for accessible and inclusive design How to apply To be considered for this role, please submit your resume and portfolio. We’d especially like to see strong systems thinking, elegant design solutions, how you collaborate across teams, including engineering & product and proven ability to adapt your designs based on what you learn. Our compensation reflects the cost of labor across several U.S. geographic markets, and we pay differently based on those defined markets. The U.S. pay range for this position is $142,700 -- $265,400 annually. Pay within this range varies by work location and may also depend on job-related knowledge, skills, and experience. Your recruiter can share more about the specific salary range for the job location during the hiring process. At Adobe, for sales roles starting salaries are expressed as total target compensation (TTC = base + commission), and short-term incentives are in the form of sales commission plans. Non-sales roles starting salaries are expressed as base salary and short-term incentives are in the form of the Annual Incentive Plan (AIP). In addition, certain roles may be eligible for long-term incentives in the form of a new hire equity award. Adobe will consider qualified applicants with arrest or conviction records for employment in accordance with state and local laws and “fair chance” ordinances."
