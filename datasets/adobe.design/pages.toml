title = "Sr Staff Experience Researcher, Document Cloud"
description = "Join us and help build the next generation of our world-famous tools."
full_description = "Sr Staff Experience Researcher, Document Cloud The Opportunity On the Design Research & Strategy team, our mission is to lay a user-centered and data-driven foundation for Adobe product design and development. We are seeking a Sr. Staff Experience Researcher to partner with Product Marketing Mangers, Product Managers, and Designers on AI / Generative AI initiatives related to our Document Cloud products (i.e. Acrobat, Sign, AI Assistant). In this role, you will drive strategic research with a focus on product explorations and early-stage development. Your work will directly impact customer engagement and retention by understand how customers consume, creation, and collaborate on documents across domains. What you'll be working on Partner with marketing and product teams, balancing the unique (and sometimes conflicting) needs and motivations/incentives of these different groups. Focus on running qualitative and quantitative research studies from start to finish, including; understanding the needs of your partners, developing a realistic research plan and materials, recruiting participants, and synthesizing data into findings. Advocate for the customer by articulating research findings and product ideas through clear and insightful presentations. Responsible for building alliances across the company to make those opportunities a reality. What you’ll bring to the team Must-haves: Significant hands-on research experience, with at least 7 years of that experience as a Researcher in an industry setting. Including working with product teams. An undergraduate degree or equivalent experience from a 4-year, accredited institution. Mastery in multiple methods and are able to explain the rationale for using each one (e.g., 1:1 interviews, prototype concept evaluations, survey writing and analysis, tree testing, etc.) Able to handle areas (user/product/domain) that may be ambiguous or ill-defined. Can collaborate effectively across all project roles (design, research, product management, engineering, etc. Strong organizational, planning, and time management skills. Can quickly arrive at relevant frameworks and models that describe the “why” behind customer behavior. Reports and presentations don’t get lost in the weeds of what happened in the study, they lead with the meaning. Can look across multiple studies to “roll-up” themes and/or make sense of findings, then clearly and succinctly articulate these ideas. Can proactively identify and communicate clear solutions for product marketing and strategy based on these findings. Experience working with business partners at the management and Director levels without supervision and may even act as a delegate to Research. Interest in growing into a leadership role and mentoring contractors and Jr researchers as the team grows. Nice-to-haves: An understanding of the product life cycle and ability to time research to have maximum impact. An advanced degree or equivalent experience in psychology, anthropology, human computer interaction, or a related field. Familiarity with or interest in Adobe’s document (Acrobat, Sign, GenAI Assistant) tools. Why you’ll love working here Collaborate with and learn from other researchers from a wide range of backgrounds; Psychology, Anthropology, HCI, Computer Science, Design and Management, Linguistics, and more. At Adobe, we value the differences in others’ stories and ideas— You’ll be able to bring your authentic self to work every day We offer a competitive benefits package including; unlimited vacation days, 401k matching, educational reimbursement, wellness dollars, fertility benefits, parental leave, childcare assistance, gender reassignment benefits, and more! Our compensation reflects the cost of labor across several U.S. geographic markets, and we pay differently based on those defined markets. The U.S. pay range for this position is $153,600 -- $281,000 annually. Pay within this range varies by work location and may also depend on job-related knowledge, skills, and experience. Your recruiter can share more about the specific salary range for the job location during the hiring process. At Adobe, for sales roles starting salaries are expressed as total target compensation (TTC = base + commission), and short-term incentives are in the form of sales commission plans. Non-sales roles starting salaries are expressed as base salary and short-term incentives are in the form of the Annual Incentive Plan (AIP). In addition, certain roles may be eligible for long-term incentives in the form of a new hire equity award. Adobe will consider qualified applicants with arrest or conviction records for employment in accordance with state and local laws and “fair chance” ordinances."
