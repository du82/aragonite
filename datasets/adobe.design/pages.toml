rm goals. Lead. Inspire teammates and forge relationships across the company. What you'll need to succeed Must Have: Related degree or 6+ years of equivalent experience in product design, building enterprise workflows to help users get through complicated systems. Direct experience across a range of design approaches and methodologies, from persona development and research to prototyping and the many steps in between. Ability to think strategically and solve complex design challenges with experiences that meet user needs, product requirements, and strategic business objectives. Experience with design tools such as Figma, Adobe XD, Illustrator, Photoshop, Keynote, or Sketch. Excellent interpersonal skills, ability to clearly communicate sophisticated ideas both verbally and in writing form with senior leadership. Demonstrated ability to lead and mentor, encouraging an inclusive and empowering environment for other designers to do innovative and impactful work. Confidence in presenting design rationale persuasively to all functions of the organization, including executives. Nice to Have: A clear understanding of marketing strategies, enterprise marketing workflows is a plus. Previous work experience in the Content Management, Digital Asset Management, Brand Management, or a similar vertical is preferred. Experience with AI technologies and related user experiences. How to apply To be considered for this role, please submit a resume. Include examples of work you feel demonstrates you have the skills needed to succeed. Our compensation reflects the cost of labor across several U.S. geographic markets, and we pay differently based on those defined markets. The U.S. pay range for this position is $157,300 -- $292,200 annually. Pay within this range varies by work location and may also depend on job-related knowledge, skills, and experience. Your recruiter can share more about the specific salary range for the job location during the hiring process. At Adobe, for sales roles starting salaries are expressed as total target compensation (TTC = base + commission), and short-term incentives are in the form of sales commission plans. Non-sales roles starting salaries are expressed as base salary and short-term incentives are in the form of the Annual Incentive Plan (AIP). In addition, certain roles may be eligible for long-term incentives in the form of a new hire equity award. Adobe will consider qualified applicants with arrest or conviction records for employment in accordance with state and local laws and “fair chance” ordinances."
