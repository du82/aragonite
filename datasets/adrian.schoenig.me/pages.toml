title = "Adrian's Corner - page 3 - Adrian's Corner"
description = "I’m Adrian Schönig. This is my little corner of the web with information about my apps and sporadic blog posts."
full_description = "It’s launch day, and I’m both super-thrilled and humbled by the congratulations, thanks, feedback and screenshots that I have received so far. Couldn’t be happier. I especially love seeing screenshots from everyone’s music collection! Longplay is a music player for anyone who enjoy listening to entire albums start-to-finish. It digs through your Apple Music or iTunes library 1 – that might have grown over the years or decades and is full of a mix of individual songs, partial albums, complete albums and playlists – to identify just those complete albums and gives you quick access to play them. It provides a beautiful view of all your album artwork, and let’s you explore your albums (or playlists) by various sort options. A unique one is Negligence which combines how highly you’ve ranked an album and when you last listened it, to let you rediscover forgotten favourites. Brightness sorts the albums by their primary colour for an interesting visual take on your albums collection. You can hide albums or playlists that you don’t want to show up - useful for meditation or kids albums, or smart playlists that you use for doing house keeping. For users who want to listen on specific AirPlay devices, such as multi-room audio systems or headphones, there’s a “Play on” feature that’s the quickest way to listen on the right device. It’s fully VoiceOver accessible, too. It works well on iPhone and iPad – including splitscreen support and a delightful cursor effect. If that sounds intriguing to you, head over to the App Store. It’s USD 2.99, EUR 3.49, AUD 4.49, or equivalent in your currency. I started building the app under the name Albums back in mid 2015 for iOS 8.3 to experiment with the nascent Swift programming language and to scratch my own itch of being frustrated with finding my complete albums in the iOS Music app. I had a smart playlist for it in iTunes on my Mac, but that didn’t translate to iOS. A short while later I came up with the name Longplay to give it some more character and made a first attempt to get the app onto the App Store. However, due to the screenshots all using artworks of my music album, that was a no-go and I didn’t pursue that avenue further, though I did keep using the app myself since then."
