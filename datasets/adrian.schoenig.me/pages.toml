["https://adrian.schoenig.me/page/2"]
title = "Adrian's Corner - page 2 - Adrian's Corner"
description = "I’m Adrian Schönig. This is my little corner of the web with information about my apps and sporadic blog posts."
full_description = "One of my favourite uses of Maparoni is visualising live data and analysing it with the various formulas. Over on the Maparoni blog, I’ve written up a post about improvements that the latest beta brings to that. Turns out, writing formula autocompletion that feels right, is tricky! Submitted the iOS 15 update for Longplay. I really like how the dynamic sizing of albums by different metrics turned out. See what else is new in 1.2 in the changelog. Always concerning when you google a crash and get zero results. Let’s make this a 1: If you hit an exception in [NSURL URLByAppendingPathExtension:] coming from [UIDocument saveToURL:forSaveOperation:completionHandler:], double check that you’re exporting or importing the UTI of the file you’re saving. Updated my “Carthage and Catalyst” post from last year with further instructions to get it working on Xcode 12. Shame that this is still such a pain with Carthage. (Works so well with SPM.) Really good quarter for Nintendo — converting yen to USD, about $4 billion in revenue, $1.4 billion in profit. That’s great for them, but peanuts by U.S. tech giant standards. Fascinating how outsized Nintendo’s influence is on both the gaming industry and pop culture at large compared to their financial size. Yuo can flip the last sentence the other way around: Isn’t Nintendo’s success, influence and financial success a great indicator that this is an excellent size for a tech company? What similar heart-warming tech companies didn’t make it this far because they got crushed by the giants? Horace Dediu has a way of putting things into an insightful perspective that makes you look at things differently. In the latest Critical Path episode, he points out that what people enjoyed about the iPod (and the Walkman before) wasn’t just that it let’s you take your music with you, but that it gives you privacy in a public space. Similarly, the product of a gym is not just exercise, but delivering a feeling of guilt. It’s a way of looking at a thing beyond it’s features and immediate use case."
