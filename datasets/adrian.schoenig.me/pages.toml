title = "Adrian's Corner - page 6 - Adrian's Corner"
description = "I’m Adrian Schönig. This is my little corner of the web with information about my apps and sporadic blog posts."
full_description = "I very much enjoyed this mathematical and easy to follow explanation of the benefits of vaccinations to the community – including those who don’t or can’t get vaccinated themselves: “How Math (and Vaccines) Keep You Safe From the Flu” by Patrick Honner As a society, we feel like we’re at war with a computer algorithm, and the only winning move is not to play. The iPad Pro is a great device and I’ve been happily using the 12.9 inch model for a good 1.5 years. At times it felt too large though – especially when using it on the couch. So when I got the chance to get a new iPad for work, I decided to give the 10.5 inch model a try. What follows are my observations after a few months of using the 10.5 inch model running iOS 11. My summary: I feel less of a need to always use split screen mode as fullscreen apps don’t overwhelm you as easily as on the large iPad. I missed the 3-column views initially, but adopting my workflow for sorting my mails did not take long. I’m very happy with the “tiny” iPad. It’s good for typing, more suitable for the couch and much more portable. iOS 11 tip: Enjoy a web focussed on content by making reader mode in Safari opt-out rather than opt-in. Long press the reader icon & select “use on all sites”. Sundar Pichai, CEO of Google, in an interview with Walt Mossberg at Recode’s Code Conference 2016 1: We want you to be able to tell Google: maybe the last four hours, just take it off and go off the record. […] you can switch on in-cognito mode. […] I want to save every conversation that I have with my daughter for eternity […]; but some other converations, […] maybe with my general council at Google, I want to be private. Google has a binary view on privacy. Things are either on the record or off the record—with the default being the former. For things that are “on the record”, Google’s terms of service they are very explicit about what they can do with it. Namely: Would you want those things to be “on the record”? While many people trust Google with that data, as Pichai points, it is questionable whether they are fully aware of who is getting what kind of license and access to their content, when they are using their phone or computer."
