title = "Microblog - Adrian's Corner"
description = "I’m Adrian Schönig. This is my little corner of the web with information about my apps and sporadic blog posts."
full_description = "♫ Happy birthday to me ♬, sings this blog. 11 years! → Fri, 05 May 2023 at 13:45 Updated my Mac Setup page to reflect how my usage of tools has changed. I’ve since replaced Alfred with Raycast, and Backblaze with Arq. And I’ve stopped using Dropbox, mosh, and, you-were-great-at-the-time-but-I-really-do-not-miss-you, Carthage. → Thu, 14 Jul 2022 at 19:45 Second public beta for the upcoming Mac version of Longplay is ready. 🆕 Track list in the Mini Player 🆕 Control AirPlay from the Mini Player 🐛 Better handling of albums where some tracks are playable and others are DRM-protected Any feedback is highlight appreciated. → Mon, 30 May 2022 at 17:05 One of my favourite uses of Maparoni is visualising live data and analysing it with the various formulas. Over on the Maparoni blog, I’ve written up a post about improvements that the latest beta brings to that. Turns out, writing formula autocompletion that feels right, is tricky! → Mon, 10 Jan 2022 at 19:23 Submitted the iOS 15 update for Longplay. I really like how the dynamic sizing of albums by different metrics turned out. See what else is new in 1.2 in the changelog. → Thu, 16 Sep 2021 at 17:29 Always concerning when you google a crash and get zero results. Let’s make this a 1: If you hit an exception in [NSURL URLByAppendingPathExtension:] coming from [UIDocument saveToURL:forSaveOperation:completionHandler:], double check that you’re exporting or importing the UTI of the file you’re saving. → Mon, 13 Sep 2021 at 09:03 Updated my “Carthage and Catalyst” post from last year with further instructions to get it working on Xcode 12. Shame that this is still such a pain with Carthage. (Works so well with SPM.) → Tue, 08 Dec 2020 at 15:55 Black Friday/Cyber Monday sale of Longplay – it’s $1.99 until the end of November. → Sat, 28 Nov 2020 at 07:00 I updated the Longplay page to reflect the latest updates, including Home Screen widgets for iOS 14, and added a couple testimonials1. Really appreciate all the kind words and it’s great to hear from the people who love the app. That took longer than I thought as I’m rather rusty on my CSS, but these tutorials helped. Flexslider is nice. ↩ → Mon, 21 Sep 2020 at 18:57 It’s launch day, and I’m both super-thrilled and humbled by the congratulations, thanks, feedback and screenshots that I have received so far. Couldn’t be happier. I especially love seeing screenshots from everyone’s music collection! → Tue, 18 Aug 2020 at 22:50 Very impressed with Apple’s free and online-only WWDC this year. The 1-on-1 labs are fantastic! The session videos are to the point and with direct access to the code samples. Hope WWDC will remain online-first from now on. → Thu, 25 Jun 2020 at 04:40 Excited to see that Swift 5.3 will bring support for resources to Swift Package Manager! → Sun, 03 May 2020 at 17:59 I’ve turned a note on how I’m setting up my Mac(s) with my essential apps and command line tools into a page. It’s come in very handy to myself in the past and maybe there’s something in it for you, too. → Thu, 23 Apr 2020 at 01:09 I wrote up a few things that I learned while setting up a simple CI/CD for an API written in Vapor 4 and dealing with data files. Swift-on-the-Server has some rough edges, but I find it utterly enjoyable. → Sun, 12 Apr 2020 at 04:04 Do you use Apple Music or iTunes, enjoy listening to entire albums but struggle to find them in your library? Then join the beta of my upcoming app, Longplay. It’s quite pretty, too! → Tue, 03 Mar 2020 at 21:23 2019: ‘The Shining’ starring Jim Carrey 2025: Facebook lets you watch your favourite movie with a cast of your friends. → Sat, 13 Jul 2019 at 15:23 With the upcoming custom inputs and outputs in Shortcuts on iOS, I hope that someone will make HTTPie and jq for iOS. That would make working with APIs in Shortcuts a lot easier. → Wed, 19 Jun 2019 at 17:43 Kudos to Becky Hansmeyer for the timely reminder that this year will likely be the first year for many iOS developers that they will want to run macOS betas. Be prepared, backup and keep a stable install handy. → Sun, 02 Jun 2019 at 00:55 Micromobility or: Maybe the solution to all those people driving (or being driven) around by themselves is not to put someone else in the car with them, but to put them on small vehicles. → Sat, 23 Mar 2019 at 04:30 Swift’s tooling for non-app work still has some way to go. I attempted to write a script for analysing API data, but ended up fighting swift-sh, Marathon, Xcode’s integration of those, and cryptic compiler errors. Switched to Jupyter and it was fine. Might try again in 2020. → Wed, 20 Mar 2019 at 17:55 🎉 Just published my first Ruby gem: A simple agent for Huginn to filter events based on time. I’m using it to filter ISS flyover alerts to times I’m awake and it’s dark. → Sun, 10 Feb 2019 at 08:22 Bad Apple Support: Called them as my iPad stopped uploading changes to iCloud Drive1. Support told me to do an iCloud Backup and restore the iPad, saying everything will be backed up. Guess what, it didn’t. Good thing I expected that and copied the files to Dropbox first. Just kept saying “Waiting to upload”. Restart didn’t help. It still received changes from other devices, and new (empty) folders did get uploaded, too. ↩ → Thu, 24 Jan 2019 at 08:06 After a while corespeechd is constantly using 100% of one CPU core on my new Mac Mini. Annoying. Haven’t found another way than to kill it on a schedule. → Tue, 22 Jan 2019 at 20:31 Just came across Mirrorshades which is as minimalist as web analytics can get. Adorable simplicity! → Mon, 19 Feb 2018 at 07:43 I very much enjoyed this mathematical and easy to follow explanation of the benefits of vaccinations to the community – including those who don’t or can’t get vaccinated themselves: “How Math (and Vaccines) Keep You Safe From the Flu” by Patrick Honner → Wed, 07 Feb 2018 at 07:00 Nick Bilton on Vanity Fair: As a society, we feel like we’re at war with a computer algorithm, and the only winning move is not to play. This is in a nutshell why privacy matters, even if you don’t have anything to hide. → Mon, 29 Jan 2018 at 00:18 iOS 11 tip: Enjoy a web focussed on content by making reader mode in Safari opt-out rather than opt-in. Long press the reader icon & select “use on all sites”. → Wed, 23 Aug 2017 at 19:56 Enjoying the challenge to easily post from my iPad to my microblog that’s backed by Jekyll. → Mon, 14 Aug 2017 at 06:02 @manton, the “New…” menu on micro.blog says the cross-posting bot works with any RSS feed. Does it also work with JSON feed? → Mon, 14 Aug 2017 at 02:45 A self-hosted microblog. Hooray. → Mon, 14 Aug 2017 at 02:15 subscribe via JSON"
