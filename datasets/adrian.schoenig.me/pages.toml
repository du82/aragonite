title = "Tech giants and Nintendo - Adrian's Corner"
description = "In one short link post John Gruber indirectly makes an excellent case for breaking up tech giants: Really good quarter for Nintendo — converting yen to USD, about $4 billion in revenue, $1.4 billion in profit. That’s great for them, but peanuts by U.S. tech giant standards. Fascinating how outsized Nintendo’s influence is on both the gaming industry and pop culture at large compared to their financial size. Yuo can flip the last sentence the other way around: Isn’t Nintendo’s success, influence and financial success a great indicator that this is an excellent size for a tech company? What similar heart-warming tech companies didn’t make it this far because they got crushed by the giants?"
