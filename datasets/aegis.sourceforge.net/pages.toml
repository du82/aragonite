["https://aegis.sourceforge.net/tmpl-proj.html"]
title = "Aegis Template projects"
full_description = "example-make-rcs This template will provide a familiar development environment to long-time Unix coders. It uses GNU Make for its build tool, and RCS for its history tool. Simple GNU Auto Tools Example This template will provide a familiar development environment to Linux OSS developers. If your project uses a simple GNU Auto Tools configuration, this example has instructions to get you working with your project under Aegis in under 30 minutes. You will not need to change any of your source files. example-cook-aesvt This template project provides a clean simple development environment which exploits many of Aegis' features to make developers more productive. It scales better than the Make- RCS example. This template project uses Cook for its build tool, and aesvt(1) for its history tool. The aesvt(1) program is distributed with Aegis. example-c-plus-plus This template project provides a clean simple development environment which exploits many of Aegis' features to make developers more productive. The example project is written in C++, and uses the new file templates to automagically write the boring bits of new classes. The new file templates produce source files which are all GNU GPL licensed. The build system uses GNU Autoconf, and produces ready-to- distribute tarballs. This template project uses Cook for its build tool, and aesvt(1) for its history tool. The aesvt(1) program is distributed with Aegis. example-cook-fhist This template project is very similar to the previous one, and it scales just as well. This template project uses Cook for its build tool, and FHist for its history tool. The example project is written in C++, and uses the new file templates to automagically write the boring bits of new classes. The new file templates produce source files which are all GNU GPL licensed. The build system uses GNU Autoconf, and produces ready-to- distribute tarballs."
