["https://aegis.sourceforge.net/mail-list.html"]
title = "Aegis Mailing List"
full_description = "The aegis-users@auug.org.au Mailing List A mailing list has been created so that users of Aegis may exchange ideas about how to use Aegis. Discussion may include, but is not limited to: bugs, enhancements, and applications. The list is not moderated. Posting: The address of the mailing list is aegis-users@auug.org.au Please do not attempt to subscribe by sending email to this address. It is for content only. Due to an astonishing amount of SPAM, the mailing list is closed. You may only post to the mailing list if you are already subscribed. Subscribe: To subscribe to this mailing list, visit the Aegis-users mailing list page, and go through the subscribe dialogue. Archive: The mailing list is archived at eGroups. The URL is http://www.egroups.com/list/aegis-users/ and then follow the links. The archive starts from July 1999. Sorry, previous postings are not available. Unsubscribe: To unsubscribe from this mailing list, visit the Aegis-users mailing list page, and go through the change your subscription dialogue. Reminders: This list will automatically send you a reminder each month that you are subscribed. This reminder tells you how to unsubscribe. Files: You can't fetch files through this mailing list, so please don't try. Use the links on the download page, instead. The aegis-developers@lists.sourceforge.net Mailing List This mailing list is for developers of Aegis itself to exchange ideas suggestions and bug fixes. Posting: The address of the mailing list is aegis-developers@lists.sourceforge.net Please do not attempt to subscribe by sending email to this address. It is for content only. Due to an astonishing amount of SPAM, the mailing list is closed. You may only post to the mailing list if you are already subscribed. Subscribe: To subscribe to this mailing list, visit the aegis-developers mailing list page, and go through the subscribe dialogue. Archive: The mailing list is archived at SourceForge. Unsubscribe: To unsubscribe from this mailing list, visit the Aegis-developers mailing list page, and go through the change your subscription dialogue. Reminders: This list will automatically send you a reminder each month that you are subscribed. This reminder tells you how to unsubscribe. Files: You can't fetch files through this mailing list, so please don't try. Use the links on the download page, instead. Mailman These lists are run by Mailman software."
