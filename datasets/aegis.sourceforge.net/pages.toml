["https://aegis.sourceforge.net/eg_oss.html"]
title = "Aegis Template OSS Project"
full_description = "If your project is more complicated than this, and many are, you may be able to adapt these instructions once you understand what they are trying to achieve. I recommend you read on, and keep notes of where you will have to change things. These instructions do not assume you are the primary maintainer of this OSS project, you just want “a local branch” for hacking on. These instructions will work just as well for a maintainer, but they do not cover migrating from the present version control tool to Aegis. The first thing to do is create the project. In order to have good security for your project, the user account which owns the project files needs to be different than the developers. This prevents accidents where the master source could be broken accidentally. In this example, we will call that user “repos”. Create this user in the usual way for your operating system. Because this example is going to be talking about two accounts, the repos account, and your usual user account, this example will call your usual user account “user”. The project directory tree will be established in the repos user's home directory. You can put it somewhere else using the -directory command line option, so long as the repos user has write permissions to create that directory. The above command established your usual account as a project administrator. All of the remaining steps to create the project may be done from your normal account. The last step is to create the branches. Assuming vgrabbj is at version 0.9.6, we will create the 0 and 0.9 branches. The necessary settings and their source file are pre-packaged for you. The following command will download the change set and apply it to the project: It's worth mentioning that the Aegis project configuration established by this change set consists of five files: This change will automatically end development, and you need to integrate it. This is because Aegis breaks the commit step into several separate stages, each with its own checks and balances."
