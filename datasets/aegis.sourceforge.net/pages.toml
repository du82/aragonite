["https://aegis.sourceforge.net/translate.html"]
title = "Aegis<br>Localization"
full_description = '''If you are able to translate the error messages into another language, please contact Peter Miller and he will tell you how it is done. deGerman Ralf Fassel <ralf@akutech.de> enEnglish Peter Miller <millerp@canb.auug.org.au> frFrench Jerry Pendergraft <jerry@endocardial.com> nlDutch Jelle Boomstra <nietsch@dds.nl> ruRussian Alexey Voinov <voins@voins.program.ru> In the source tarball, you will see a directory called lib/en/LC_MESSAGES which contains some .po files. These are the text form of the message catalogues. You can view them with a simple text editor. If you want to test your translations, you need to "compile" the text into the binary form used by the gettext() system call. This is done using the msgfmt(1) program from the GNU Gettext package. To see you new translations in action, you create a ${prefix}/lib/aegis/xx/LC_MESSAGES directory and arrange for the msgfmt output to be placed in it. Some of the messages are hard to trigger, don't expect complete test coverage. There are almost 600 error messages. If you average 1 message every 2 minutes, this is approximately 20 hours work. The German translation, for example, required around 12 hours. When you are done translating, email the results to Peter Miller and they will be included in the next release of Aegis (and mentioned on this web page).'''
year_published = 2025
clearnet = "https://aegis.sourceforge.net/translate.html"
