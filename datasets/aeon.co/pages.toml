title = "How did rape become a feature of Indian society, like caste? | Aeon Essays"
description = "When I moved to India for work, I found that rape was a feature of the country, as deeply embedded as caste"
full_description = "It was a warm spring evening in Bengaluru. Purple jacaranda blooms leaned heavy against the dying light, and warm puffs of exhaust sat suspended in the air, as if urging the monsoon to break. Leaving the newsroom at the end of the day, I decided to stop by an office-warming party for a mapping company I was considering writing about, right by my apartment in upscale Indiranagar. Around two dozen people milled about the open-plan space, sipping beers and bobbing to the reggae playing in the background. This crew was distinct from the regular Bengaluru startup crowd: they had travelled to places like Poland and Peru for mapping projects, and there were quite a few women as well; the lead told me they wanted to reach gender parity soon. They seemed eager to get to know me as a fresh-faced foreigner new to the city, not as a reporter who might feature them in the paper. Before I knew it, it was almost 10 pm. As I took my leave, my host offered to walk me home. It was rare for me to be out drinking midweek but I shook my head no: I lived just a few blocks away! ‘Are you sure? It’s pretty late,’ he said, with genuine concern in his eyes. I dismissed his worries with a flick of my hand. The gesture felt a little too intimate between a reporter and a potential source; besides, I had chosen to live in Indiranagar precisely because of its reputation for being safe: for the right to walk home without worry. Before he could press further, I made my way towards the exit and spent a few minutes getting lost inside the maze of shoes, my vision woozy around the edges. Once I’d stepped out of the building, the euphoria of the party took all of two seconds to fade. The road ahead was pitch dark, deadly quiet. A gust of wind whipped against my torso, then another. I steeled my jaw, hunched my shoulders, and began marching the hundred or so metres back towards the bright-lit main road. I’d walked home after sundown a number of times, but this time, approaching the junction, I realised something was amiss: the streetlamp on the corner was not on. The road stayed dark. I figured there must have been another blackout – they had become more frequent as the days grew hotter. A low-pitched buzz was approaching from ahead – I could just make out the contours of a motorbike scooting towards me at full speed. Before I knew it, a hand had thwacked my chest. When I finally gathered myself to react, I spun around and saw his face, turned towards me from the receding vehicle, shiny with sweat in its red backlight. Tuft of hair on top, double chin bulging from the bottom, the offending arm held out like a weapon. A wicked smile that said: Gotcha. Did you think you were safe? It was 2015, and I had moved to Bengaluru to work as the only foreign reporter at a national paper. India was fresh off Narendra Modi’s arrival to power after decades of Congress rule; the rupee was strong and projected to grow stronger in those innocent days, pre-demonetisation, pre-COVID-19 pandemic. The promise of political change and prosperity was thick in the air, overshadowing the looming threat of Hindutva violence. One of the world’s largest emerging economies seemed poised to turn a new page and I wanted to be there. I had just graduated from a prestigious US university with no specific aspirations other than to experience as much of the world as possible. When I received an offer from the paper, I took it. Violence against women was one of India’s defining features at the time, as an outraged global media gave extended coverage to the brutal gang-rape and murder of a young physiotherapy student, Jyoti Singh, on a night bus in Delhi in 2012. What became known as the ‘Nirbhaya’ case (for ‘fearless’, in Hindi) was just the tip of the iceberg. More than 34,000 rape cases were officially reported in India in 2015 – one woman raped every 15 minutes – and nearly 10 times as many crimes against women were logged. Born and raised in Hong Kong, I’d had the privilege of growing up taking my safety for granted. I’d ambled across town alone at all hours as a teenager, had walked home after midnight without a second thought: though casual sexism abounded, I’d never had my personal space impinged upon. The few instances of public sexual assault in the region were reported with dramatic condemnation in the news. It is common for Hong Kong natives to live abroad – in industrialised nations with high living standards. Meanwhile, my move to a developing country, and one as unsafe as India, was so far beyond the bounds of convention that some of my peers took me for a joke. Did the violent crime that claimed Nirbhaya happen here too? Or were things getting better? Still, I had spent the previous summer visiting the metropoles of Delhi, Mumbai and Chandigarh, and witnessed how the gender landscape was changing. For many women whose lives had previously been circumscribed to the family home, the smartphone revolution meant they now had unprecedented access to the wider world. A generation of women was becoming educated, completing high school and university at unprecedented rates, and eager to make their own living, heading for the big cities where they would find work and a hitherto unimaginable independence. By 2014, it was estimated that more than 30 per cent of Indian programmers were women. Besides, Bengaluru was meant to be different. The city, now known as the Silicon Valley of the Global South, had jumpstarted the country’s software boom in the 1980s, on the back of the success of Infosys, co-founded by N R Narayana Murthy (father-in-law to the former UK prime minister Rishi Sunak). Bengaluru had amicable weather, live music venues, even a flourishing craft beer industry. And it was south India: liberal, educated, peace-loving and English-speaking. I arrived to find women thronging its dusty avenues at all hours of the day, lingering in restaurants and negotiating with rickshaw drivers and subziwallas (vegetable sellers), in groups and alone. They were just as likely to wear jeans as salwar kameez. Some bleached their skin with Fair and Lovely creams, others threaded and pencilled-in their brows or coated their eyelids with kajal, a look I later attempted to adopt. In the newsroom, I was placed within a predominantly female team. Krithika drove a scooter around the city for interviews and events, and before long I became a frequent rider on her backseat, catching the ends of her dupatta flying behind her helmet. Avani always had plans for a party or a festival, and the outfits to go with them. Shraddha, impeccably dressed, had her share of harassers and stalkers, but she deterred their efforts with masterful aplomb. Then there was Radha, the only female editor at the paper, who conducted herself with unfailing poise, sailing through the office among male reporters and executives in her carefully pressed, gold-bordered saris. These women appeared to have nothing to fear. They taught me everything about the country I would report on, and eased me into daily life in Bengaluru. I queried them on my worst fears: did the violent crime that claimed Nirbhaya happen here too? Or were things getting better? ‘That kind of thing won’t happen to you,’ they assured me in lowered voices. But with a few caveats: don’t wear anything too revealing, keep your valuables in a safe place, make sure you always have someone to call in case trouble strikes. Don’t go out on your own at night. Otherwise, do anything you want, go anywhere you want, wear whatever you want. This is Bengaluru, the safest city in India! The assault on my way home was not my first brush with violence. A few months before, as my first New Year’s in the city approached, I canvassed the newsroom for celebration ideas. Most of my colleagues planned to stay in with friends and family. Some restaurants and hotels were advertising countdown parties, charging thousands of rupees a head. I wondered whether there was a central place where people counted down to midnight, like they do in Times Square in New York City. It seemed that Brigade Road, the shopping street just blocks from the newsroom, might offer what I was looking for: the area was blocked off from traffic every New Year’s for a mass celebration. No one on the team had ever attended, but I was keen to check it out. ‘Be careful na, it’s going to be very crowded,’ said Krithika, but I was not concerned: I had grown up in one of the most crowded cities in the world. My friend Meghna and I started the night with a few drinks at her apartment, along with our friend Max, a tall American in his 30s, all of us recent arrivals. Before leaving for Brigade Road, I patted myself down – bank card in my bra, small wad of cash in my left pocket, phone in the other pocket – then smoothed a long kurta over my jeans. The main roads were choked with cars and pedestrians hurrying towards their merrymaking destinations. To avoid them, we took a quieter path up Museum Road and around the moonlit curve of Rest House Road, past convent schools, consulates and the line of Tibetan malls I often visited for momos and noodle soup, finally arriving at the intersection with Brigade Road. The juncture was fenced off by a makeshift security checkpoint, guarded by two policemen wearing signature khaki uniforms and slouch hats. Beyond this barricade, Brigade Road was strung with coloured fairy bulbs and neon signs, just like every other night when I passed by on my way to the Metro. However, tonight the lights shone upon a roaring tide of humans, every single one male. Men in polos and plaid shirts, in gold necklaces and bandannas, bald and bearded, pot-bellied and skeletal, pushing and shoving. Drunk, belligerent, hungry for mayhem. It was a roiling sea of testosterone and sweat and euphoria, lurching vaguely southward. Smelling sour. I took a moment to soak in the scene. This was Bengaluru’s version of the New Year crowd: it resembled nothing I had seen before. We had come all this way with a white man escorting us, what was there to do before midnight but paddle along? I turned to Meghna, who looked a little hesitant, but she nodded. ‘Hold on to me so we don’t get separated,’ she said, and we clasped hands. A policeman moved the barricade to let the three of us enter, his eyes idly surveying the mass, barely paying us attention. A dark face glared into mine from centimetres away, a bloodthirsty glint in his expression At once we were swallowed up by the heaving stew and knocked about in its current. My legs buckled forward, my sandalled feet were stamped on before they could find firm ground, my shoulders were shoved side to side. The stench of alcohol and perspiration was overpowering. I reached for my back pocket to stop my phone being snatched, but my hand landed on something else, plastered around my body, in the small of my back, pressing against my shoulder blades, pinching at my chest, digging between my legs from behind. Other hands. Sweaty hands. A dark face glared into mine from centimetres away, a bloodthirsty glint in his expression: I am going to swallow you whole. I cried out for Meghna and turned to meet her eyes – as wide and stricken as mine were. They told me everything I needed to know. The next instant, she was tearing through the mob back towards the barricade, yanking me along with her. We jostled against another dozen hands intent on folding us back into the riot, yet we somehow broke free and pried ourselves out, Max a few paces behind. We bolted all the way back to Meghna’s apartment, arriving right before midnight. The countdown roared through the window. Max cracked open a Kingfisher and handed it to me. I took the beer and headed to the bathroom, where I spent the first hour of the year crumpled on the floor, my face in my hands. We had been on Brigade Road for all of 30 seconds. It was 30 seconds too many. Back in the newsroom, I recounted what had awaited me on Brigade Road, careful not to blame my colleagues for suggesting the option. They reacted with expressions of open-mouthed awe, but I could tell they were not entirely surprised. ‘It isn’t your fault,’ they said, ‘but what were you wearing? Were you with anyone?’ Anger flared in my cheeks and quickened my breathing. My female colleagues – my guardians and friends – had not prepared me for what I’d experienced, and when things went south they resorted to finding fault in my behaviour: it felt like betrayal. I pulled in a lungful of office air. They had not meant to deceive me. Most of them had moved to Bengaluru from more violent reaches of the country and were enjoying greater independence than they had known elsewhere, without any clear idea of its limits. They were also upper class and upper caste, accustomed to unspoken norms of respectable behaviour that shielded and coddled them: the possibility of attending a public celebration with thousands of strangers would scarcely have crossed their minds. Meanwhile, I had been confronted with the scene and still misread it entirely. We were just beginning to fathom the gulf between us, the different expectations we carried when it came to our liberty and safety. In Radha’s office, I repeated the story, this time careful to qualify who I was with and what I was wearing. She was pensive while I blew my nose into a napkin. ‘I am very sorry these kinds of things are still happening in this country. Everywhere, every day.’ Her face was grave but firm, her eagle eyes beady as ever. There was a finality to her words, as if she were delivering news of a death. ‘I do hope things will get better, but unfortunately this is the way things are for now. And there is nothing you nor I can do about it.’ Before I left, she added: ‘Just stay away from these situations, OK? You have no idea who those people are, what all they can do. They’re not educated, they don’t know how to behave. All you can do is stay away.’ Those people. The mass that was the lower class, impenetrable when it came to their caste, religion, language, values and norms of behaviour. As I was starting to learn, othering was a handy tool for my companions when confronted with the less savoury realities of their society, one whose lauded diversity can just as easily morph into social division. As women in India make tentative strides towards greater liberty and individual rights, their progress has not been taken kindly by all sectors of a staunchly patriarchal, misogynistic society. Living in Bengaluru amid the changing winds and careless promises of the early Modi era, it was easy to forget that this was still a country ranked 130th out of 155 in the United Nations’ Gender Inequality Index (2015), and where, according to the UN Population Fund (2020), almost half a million baby girls went ‘missing’ every year through sex-selective abortions and infanticide. The average age of marriage for women hovered around 19, and, despite the gains made in education, the International Labor Organization (2014) estimated that only a q"
