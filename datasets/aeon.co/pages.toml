["https://aeon.co/essays/how-humanity-moved-from-eternal-to-bookended-time"]
title = "How humanity moved from ‘eternal’ to ‘bookended’ time | Aeon Essays"
description = "Nothing lasts forever: not humanity, not Earth, not the Universe. But finitude confers an indelible meaning to our lives"
full_description = "Do you recall the first time you knew you would die? It’s a milestone, realising your time is limited. That things happened before you, and will happen afterward, in your absence. As we grow up, the understanding of death comes in stages, but it culminates in acknowledgment of one’s own – unavoidable yet unpredictable – mortality. Sometime between the ages of six and 10, children become aware that their time is inescapably bounded. Roughly the same might be said of humanity’s self-knowledge. Only recently has the human collective begun accepting the fact it is itself mortal. We now appreciate that events unfolded for aeons before us and that our species can disappear, never to return. One day, the cosmos will persist without human witness, nor any inherent tendency to manifest things we cherish. The anti-war campaigner Jonathan Schell called this realisation the ‘second death’. Growing up, each of us comes to terms, psychologically, with a ‘first death’ – our own – but, beyond this, lurks the realisation that humankind itself hasn’t always existed and won’t be around forever. For most of history, such understanding was lacking. People could defang – or outright deny – the possibility of beginnings and ends greater than those of our own biographies by appealing to eternity. Before we found evidence to prove otherwise, it was permissible to presume that, beyond tangible scales, time has no true bounds. For millennia, people have found comfort in this, because nothing dies in eternity. Given eternal time, every possibility – no matter how wildly improbable – will repeat and recur limitlessly. Outside our island of perceptible time – within eternity’s boundless ocean – it remained plausible to assume that all deceased things will eventually resurrect. It’s now clear humanity lacks the luxury of eternity. We know this because evidence has accumulated to show that there are greater, even more encompassing mortalities than our own. We now understand Earth and its life had their origins and, one day, they will be cremated by our ageing Sun. A ‘third death’, then. Beyond that, even the Universe itself has its bounds: it began with a bang, and the consensus view is that, in the distant future, it will likely have its end. Thus, a ‘fourth death’. Multiple grander mortalities, expanding concentrically outward. We are only just coming to terms with this – this supremacy of finitude. It marks a historic reorganisation of our sense of orientation that may, one day, be judged comparable to that of the Copernican Revolution. Just under 500 years ago, Nicolaus Copernicus initiated a string of discoveries eventually proving our planet is not the centre of a tidy, manageable cosmos. Instead, Earth pirouettes around a mediocre star within an ungraspably vast Universe. It took generations for people to start noticing – and giving names to – what Copernicus had wrought. Similarly, we are only now waking up to the significance of the nested mortalities we live within. With the most seismic revolutions, it takes time for the dust to settle before we can glimpse the landscape transformed. However, whereas Copernicus made us feel insignificant in space, placing bookends on time stands set to reverse this, by insinuating that our acts might just be more cosmically resonant than we previously dared presume. One revolution, undone by another. Why? I argue that abandoning eternity is ultimately galvanising: for it implies that what we do in our moment on Earth genuinely matters beyond our own fleeting lives. Only by finding time’s cosmic bookends has modern science thrown into crisp relief the truth that what happens next might resonate indelibly. Because, if time has extremities, then history will never repeat; and if what’s happening here and now will never reoccur, certain decisions can never be taken back or reversed. Historically speaking, when people have encountered something whose edges they cannot directly see, they have tended – ahead of contrary evidence – to assume it simply lacks limits. Staggered by size into stupor, we tend to conflate extremely large things with limitless things. It proved no different with time, beyond perceptible scales. For much of human history, what terra incognita was for geography, eternity was for chronology. It was the amorphous unknown lurking beyond what was concretely measured. While the Abrahamic religions may have appeared to place boundaries on time millennia ago – with their teachings of genesis and apocalypse – eternity nonetheless saturates these creeds. Worldly time was conceived of as but a brief hiatus, environed by two eternities: a vanishing, Biblical ‘vale of tears’ cleft between the boundless precedent of an uncreated divinity and, afterward, the unending afterlife promised for the souls He created. Perhaps one reason why the idea of eternity has persisted for so long is that it offers consolation. In infinite time, all possibilities inevitably cycle without limit, such that unprecedented change and irrecuperable loss evaporate. The only trajectory is an orbit. Everything gained is eventually lost; everything lost, eventually regained. However, it’s also the case that the evidence required to banish eternity has accumulated only gradually. Because knowledge is tethered to observation, we know only so far as we – or our tools – can see. Thus, before humans invented clever ways to survey scales greater than the immediate, it was impossible to disqualify hunches that – beyond the purview of what’s humanly tangible – time lacks proportion and eternity reigns. Because imagination fails to circumscribe such aeons, it’s easy to assume they lack circumference entirely People speak of the ‘god of the gaps’, alluding to how the supernatural slowly recedes as we learn more about the cosmos around us. Something similar has happened with eternal time. As we’ve probed and pried farther, we’ve revealed beginnings – and possible ends – for Earth, life and the Universe, replacing eternity with finite timescales at increasingly encompassing scales. Yet, with each advance, eternity has merely ceded ground, retreating into the darkness outside the flame lit by our knowledge. Even in the present day, it’s often forgotten that the unthinkably vast durations revealed by modern science – described by the term ‘deep time’ – are distinct from eternities. Because imagination fails to circumscribe such aeons, it’s easy to assume they lack circumference entirely. If accepting such immense finitudes is difficult now, it would have been unthinkable earlier in human history, before radio telescopes and radiocarbon dating. A millennium ago, it would have been evident human lives are not eternal. However, based on available evidence, it would have remained underdetermined as to whether, beyond this familiar span, things don’t just boundlessly cycle and repeat. This mattered because it influenced how people behaved. If events inevitably reset, regardless of what happens in the present, everything accomplished now will eventually wash away. Assuming this, the Roman statesman Cicero concluded there was little point attempting to impart legacies that are ‘durable’, much less ones that are indelible. Before an archaeological record was compiled, cross-referenced and communicated across continents – rather than remaining constrained within one – it wasn’t possible to falsify hunches that human history has been cycling on Earth, forever, without definitively beginning or drastically changing. We envision a time before which no humans practised farming or writing, and a time after which some started Similarly, before the globe had been fully mapped, people could plausibly believe that everything locally chronicled and accomplished had already taken place – and would later ceaselessly repeat – on other, uncontacted landmasses. In Leviathan (1651), Thomas Hobbes spoke of the shift from a warring ‘state of nature’ to that of the ‘social contract’. This might now sound like what we understand as the transition from prehistory to history. We envision a time before which no humans, anywhere, practised farming or writing, and a time after which some started. But this wasn’t what Hobbes had in mind. He clarified that he believed the precivilisational state ‘was never generally so, over all the world’. For Hobbes, global history represents a revolving, never a rupture. Regions might slither between various situations, but, from the planet’s perspective, these will all have already been manifested elsewhere. Assuming this, humankind’s collective future cannot come to look different from its extended past. Hobbes’s contemporaries – from Francis Bacon to Edmond Halley – remarked that, though new things appeared to be being invented, they couldn’t disprove a lingering suspicion all these feats hadn’t already been innumerably achieved before – by forgotten civilisations, throughout time immemorial. Eternity resided over the horizon, in undiscovered lands. In the 18th century, these perspectives began to change – but not without a fight. Throughout the 1700s, naturalists began looking to Earth to answer the question of the present’s location in time. Geology had begun consolidating as a science. Ahead of digging into the planet, the first geologists assumed they might find proof of nothing really changing throughout Earth’s history. They expected remains of everything currently alive on the surface to be located even in the deepest strata. Some predicted that, if we dug to Earth’s core, we would find human remains. When scientists began peeling Earth open, revealing the fossil record’s testimony, this isn’t what they found. Not only did the eldest strata entirely lack organic remains, they also noticed the skeletons changed drastically – becoming less familiar – the further back in time they looked. No one could find fossilised humans in the older strata, which suggested creatures like us were embarrassingly recent additions. (There was one false positive, but that turned out to be a giant salamander’s skeleton.) Homo diluvii testis: a fossil of a giant salamander found in a limestone quarry in Öhningen, Germany, and, in 1726, believed to be the spine and pelvis of a child who had been trampled during the Biblical flood. Courtesy BnF, Paris The time was ripe for the first physical theory comprehensively predicting both the past and the future of the Earth system. This came from the French polymath Georges-Louis Leclerc, Comte de Buffon in the 1770s. He conjectured our planet was irreversibly losing an original and finite fund of internal heat. A molten birth, hurtling inexorably to frozen death. Retreating to his basement forge in Burgundy, Buffon heated iron balls then measured their cooldown times, before scaling them up to the globe’s size. From this, he estimated Earth was around 74,832 years old; that life emerged upon it 35,983 years ago; and that it would remain habitable for another 93,291 years. (Rounding wasn’t yet scientific convention.) Nonetheless, eternity wouldn’t depart without a struggle. Proof was building that Earth was far older and, with time’s limits seemingly bursting, some saw evidence of limitlessness. Hutton insisted the past and future of the Earth system was not just enormously long but limitlessly long Not long after Buffon’s investigations, the Scottish geologist James Hutton argued that, in explaining Earth’s features, only currently observable causes should be conscripted. Overapplying this rule, he became convinced our planet had never looked drastically different from how it looks today, nor could it change in future. This inspired his declaration that geologists find ‘no vestige of a beginning, – no prospect of an end.’ He even questioned evidence there had been a time when our planet entirely lacked life, insisting the Earth system never undergoes unprecedented changes. Bewitched by the aeons required to sculpt vast mountains using only mundane processes – like erosion or sedimentation, which work at a piecemeal pace – Hutton insisted the past and future of the Earth system was not just enormously long but, instead, limitlessly long. Sometimes hailed as the ‘discoverer of deep time’, this is misleading. Hutton was drunk on boundlessness – which is shallow because, in eternity, nothing truly changes – not meaningful depth. This way, eternity briefly recurred: by receding into the mists of geological time. But, despite Hutton’s efforts, Buffon’s view – that Earth’s biography has determinate bookends in time – slowly won the day. Of course, Buffon’s methods were rudimentary, the results false, but it was an important start. His experiments – attempting to simulate Earth’s evolution in miniature – provide the common ancestor of today’s sophisticated climate models. Ultimately, Buffon’s search for our planet’s biographical bookends provided the extremities within which life’s story could begin to be understood as unfolding – and in a way that could admit genuine firsts and irreversible losses. No longer was it possible to hold that everything humanly or biologically possible has already occurred, given a boundless past. This way, bookending the past liberated the future. Hope for entirely new things – never before achieved, anywhere – could take hold. The same, however, applied for global challenges entirely unprecedented: including disasters, more destructive than any previously recorded. In 1777, Buffon asked himself what would happen if all organisms on Earth were instantaneously annihilated by some disaster. To his mind, life would spontaneously reappear, briskly repopulating the planet with, he assumed, the same species as before. Though the biography of Earth had been granted its bookends, the same hadn’t yet been confirmed for its myriad species. Planets were inchoately understood as things with a definite birth, a bounded lifespan and a foreseeable death; but it wasn’t yet definitively accepted that species also experience such milestones. There wasn’t yet consensus on how species originate, so there couldn’t yet be conclusive grasp that, once lost, they are gone forever. In the earlier 1800s, naturalists continued to imagine that complex creatures could simply pop into existence without forebears. Hutton’s followers imagined dinosaurs one day, spontaneously, returning. Others theorised that the first humans were generated, effortlessly, from sea slime: no parents necessary. Darwin proved we were all born of time, not slime Charles Darwin changed this. After On the Origin of Species (1859), it became undeniable that nature cannot generate complicated creatures from scratch. The existence of us, today, required the precedent of countless yesterdays: building laboriously from simpler into less simple ancestors. This confirmed why members of the same species cannot spawn anywhere, anytime, effortlessly, without connection to countless parents and precursors stretching back, uninterrupted, to life’s beginn"
