["https://aeon.co/essays/what-makes-a-person-poor-and-what-should-we-do-about-it"]
title = "What makes a person poor and what should we do about it? | Aeon Essays"
description = "By understanding the pernicious myths surrounding poverty, we can make progress towards a lofty goal: dignity for all"
full_description = "Not seeing it requires effort. In the world today, despite ongoing economic growth and unprecedented levels of wealth accumulation, those who are poor are all around us. Poverty exists in every community, often lives right next door to (or in the houses of) those with immense affluence. The very present-ness of poverty gives it a taken-for-granted nature: those forced to live in poverty, apparently, are always with us. But does the fact that the poor have been with us for a long time justify the continued existence of poverty? Are better remedies not possible? We propose a set of measures that, by getting to its causes, will help get rid of poverty. Poverty is ordinarily defined as lacking resources for a socially acceptable standard of living. However, the socially acceptable level of living in one country or at one time can be higher or lower than in another, affecting the assessment of poverty. Governments often manipulate poverty lines to present their performance in more favourable terms. The World Bank and others have established universal poverty lines, with different thresholds corresponding to degrees of poverty: daily per-capita rates of $2.15 (extreme poverty), $3.65, $6.85 or, as in the case of the US, $15 a day. While some progress against extreme poverty has been made, the number of poor people increases rapidly at higher and more realistic thresholds. In 2019, one-quarter of Earth’s people, almost 2 billion people, lived on less than $3.65 per person per day, and almost half, 47 per cent, lived on less than $6.85 a day, with many lacking basic necessities like healthy food, potable water and clean cooking stoves. Meanwhile, wealth has mushroomed. The richest eight people own as much wealth as the bottom 4 billion of the entire planet’s population. That’s an almost impossible fact to wrap one’s head around. It’s like the entire population of the United States – 335 million Americans – were somehow crammed into the authors’ hometown of Durham, North Carolina, while just eight people hogged all the rest of the country. Inequality of this stunning magnitude is known to corrode and destroy critical pillars of modern societies – democracy, opportunity, justice, social peace itself. The economic pie keeps growing, yet vast poverty remains amid enormous wealth. To deflect from this dark reality, people in power keep advocating economic growth, claiming that a growing pie expands even the smallest pieces. What kind of growth would be needed to eradicate poverty, and at what cost to people and planet? On the surface, their logic seems intuitive. If the problem is insufficient food, income or healthcare, increasing the supply should solve the problem. But poverty resists this simple equation. Increasingly, the benefits of economic growth go almost entirely to the already rich, often at the expense of those who have the least. The relationship between economic growth and poverty is complex and often contradictory – sometimes alleviating poverty, but just as often deepening exclusion, inequality and environmental degradation. This paradox raises difficult and pressing questions: can further economic growth eliminate poverty, or does it perpetuate it? How much, and what kind of, growth would be needed to eradicate poverty, and at what cost to people and planet? Understanding these questions requires understanding poverty not just as a lack of resources, but as a pervasive social reality – a condition of exclusion from work, health, dignity, autonomy and a healthy environment. Our experience positions us to delve into these complexities. One of us (Anirudh Krishna) is a social scientist who has spent decades collaborating with teams of local investigators in Kenya, Uganda, Malawi, India, Bangladesh, Jamaica, Peru and the US to understand the lived experiences of poor communities. The other (Dirk Philipsen) is a political economist engaged in a global movement to reframe economic thinking around the wellbeing of both people and the planet. We have both learned how two interlocking processes – those that produce uncertainty, and those that erect barriers and enforce exclusion – work together to trap people in cycles of poverty. However, before rethinking what poverty really means, we must first address the pervasive myths that distort its reality. The first myth about poverty is that it has always been with us and always will be. For roughly the first 200,000 years, or about 95 per cent, of human history, there was less technological sophistication and material wealth. There was also, usually, far less inequality. Importantly, while humans experienced hardships both prior to and after the emergence of so-called ‘civilisation’, the evidence that is available relating to early Indigenous cultures on every continent indicates they had not experienced, nor would have been able to recognise, ‘poverty’. Poverty emerges when social stratification increases, leading to exclusion and restricted access to Earth’s resources. This exclusion worsens when money becomes the primary prerequisite for obtaining essential goods and services. Denying growing numbers of people direct access to food, shelter, trust and other vital resources makes them dependent on money to meet their basic needs and desires. Property enables and enriches those who own it as much as it excludes and impoverishes those without. Humans were born to an immense abundance naturally existing on our planet Accounts from ancient history through to the 21st century tell of people made poor by the greed of others. In England, the Enclosure Acts of the 17th to 20th centuries privatised common lands, leaving peasants without means to sustain themselves. Across the Atlantic, enslaved Africans were violently uprooted, their labour extracted in brutal conditions to fuel the wealth of colonial empires. Indigenous peoples across the Americas, Australia and Africa, meanwhile, were subjected to genocidal wars, forcibly displaced, and stripped of their ancestral lands by colonising powers. Behind every tale of dispossession lies a choice – by governments, corporations and elites – to prioritise power and profit over people and the planet. Woody Guthrie’s words ring true: ‘Some will rob you with a six-gun, and some with a fountain pen.’ In today’s digital age, he might add: And some with a keystroke. Predatory lending, financial manipulation and the unchecked power of multinational corporations continue to deepen global inequality. Land grabs in the Global South, where foreign investors displace small farmers, echo the enclosures of centuries past. Whether the initial dispossession took place via war, theft, genocide, decree or the rule of law, it is not, however, where humans started. On the contrary, humans were born to an immense abundance naturally existing on our planet. This fountain of natural wealth first had to be parcelled out, fenced in, codified, privatised and licensed, before those not on the receiving end of the bounty could be made into ‘the poor’. As the historian R H Tawney concluded in 1913: ‘what thoughtful people call the problem of poverty, thoughtful poor people call … a problem of riches.’ Is poverty always going to be with us? That will depend upon what we do about the conditions that lead to people becoming poor. Poverty is not a natural state but the result of deliberate systems and policies. The second myth about poverty is that it is about lack of money. Only when the accumulation of wealth became the operating logic of modern societies did our collective journey become all about money and capital. We are schooled to envy those racing along in their expensive Tesla SUVs, and variously to pity, ignore or ‘aid’ those who struggle along in hoopties, rickshaws or simply on foot. Regardless of ideological values, most people assume that ‘lifting up’ everyone to the standards of the (mostly white, male, capitalist, money-rich) Tesla driver is the primary goal. A few alternative voices on the sidelines warn about running out of land to pave over, air and water to pollute, and humans to exploit. However, most remain busy trying to keep up with the flow of traffic, eager to pass those in our way. Notably, some stretches of highway (the Scandinavian parts, for instance) provide more protections – speed limits, guard rails, better emergency services. Other parts still resemble the caricatures of the 19th-century ‘Wild West’ of North America, with barefoot travellers pushed to the side or simply ignored and run over. Yet, whether the highway runs relatively safely and slowly through Costa Rica, chaotically and dangerously through Nigeria, or is channelled with authoritarian efficiency through China, its logic and direction follow the same rules. Even a casual observer from another world could not help but notice some odd features of this worldwide race. People seem forever frantically busy – yet neither the purpose nor the destination of the journey are discussed. The pervasive assumption simply seems to be that more is better. But this is a highway to nowhere. Poverty stems from denied access to resources that society and the planet have in abundance Above all, the nature of poverty cannot be reduced to a dollar value. If it were that easy, eradicating poverty would be a trivial matter of transferring funds. But in truth poverty is a web of deprivations that extend beyond a person’s bank account. That’s why more nuanced metrics, like the United Nations Human Development Index, attempt to capture the multifaceted nature of poverty by incorporating factors like education and healthcare alongside income. Even these measures, however, fall short of conveying the ways in which poverty disempowers individuals and communities, depriving them of opportunity, stripping them of agency, and stifling their potential. Poverty is a lived experience. As the antipoverty organisation Five Talents poignantly describes, poverty is ‘an unmet need and an unfulfilled longing’. It is the lack of food, shelter and security. It is being sick but unable to see a doctor, or losing a child to a preventable disease. It is wearing clothes that don’t fit, drinking water that isn’t safe. Poverty is the vulnerability that makes people susceptible to lies, schemes and exploitation. It is an empty refrigerator, a home without electricity, a single toilet shared by a hundred neighbours. It is stress; it is shame; it is pain. At its core, in short, poverty stems from systemic barriers: the denial of access to resources and opportunities that human society and the planet provide in abundance. Inequality is perpetuated by policymakers’ failure – or unwillingness – to adopt measures that reduce risk and lower precarity. Poverty thrives not simply because people lack money but because the risks to their wellbeing remain unchecked, and the pathways to flourishing remain blocked. The solution does not lie in merely giving money to the poor but in addressing the root causes of insecurity. A third myth about poverty is that it is self-inflicted. Such familiar refrains around wealth and poverty are pervasive. ‘People deserve to be rich’ and ‘The poor just need to work harder’ are little more than lazy thinking, unsupported by evidence and unmoored from logic. The reality is that a complex array of factors, from systemic inequalities to economic structures, shape wealth and poverty and, mostly, decide who is rich and who is poor. Platitudes about individualism are woefully inadequate to understand how any of this works. Take the birth lottery, for instance. Imagine an eight-year-old girl and let’s play through different scenarios of her birth and life. If born in Finland, she would be likely to have parents enrolling her in a good school, with access to universal healthcare. She would live, by global standards, in immense safety and comfort, with the prospect of many professional opportunities, international travel, and life expectancy to her mid-80s. If born in Afghanistan, however, she would likely be denied a quality education, rarely have access to a competent and well-equipped doctor, go through her day navigating hidden landmines and violent police, with the prospect of utter dependence, desperately few chances of escape, and a life expectancy around 60. What is true across nations (Finland and Afghanistan) is also true within them. The accidents of birth shape people’s life opportunities in essential ways. In the US, social amenities vary greatly by locality. More than any other single factor, one’s postal code determines one’s opportunities – the quality of schools, the safety of neighbourhoods, the availability of jobs. Growing up in a rural area – with lower-quality schools and clinics, erratic electricity, slower roads, patchy internet connection – is a significant liability in many countries, compared with living in the capital city. Everywhere, the intergenerational transmission of privilege is more flagrant in situations of greater inequality. If poverty is inflicted, it is done by society, not any individual Neither the eight-year-old in Finland or the one in Afghanistan, nor the little girl in wealthy Presidio Heights in San Francisco or the one in impoverished Riverdale in Detroit deserve these circumstances. They have picked their parents no more than they picked their life chances. Overall, people rarely become poor or remain poor for faults of their own. On the contrary, poverty follows a distinct pathway. Tracing the life stories of those forced to live in poverty lays bare how, even as they work very hard and expect no handouts, powerful forces are stacked against them and precariousness almost always defeats individual qualities. To the extent that poverty is inflicted, it is done by society, not any individual. Systems and policies sustain the conditions that keep people trapped in poverty – systems that amplify risks while offering few opportunities for upward mobility. These structures generate vulnerabilities and perpetuate inequality, making it exceedingly difficult for individuals to escape poverty’s grip. So, to sum up, if poverty is not natural, has not always been with us, cannot be reduced to a number or monetary value, and is not self-inflicted, what is it? What makes one poor or not poor? And what should we do about it? To answer such questions turns out to be surprisingly difficult. Poverty is a lived experience defined by the crippling social reality of not being able to meet one’s basic needs. It is not, however, a condition that allows for a neat separation between the poor, the near poor, and the not poor. Instead of a clear dividing line with black on one side and white on the other, poverty is better represented in bands of grey. It requires a moving picture and not a snapshot to visualise accurately the conditions of poverty. While hundreds of millions of people spend their lives in dire need of essentials, a possibly equal number move in and out of poverty, m"
year_published = 2025
