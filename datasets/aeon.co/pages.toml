["https://aeon.co/essays/are-chatbots-of-the-dead-a-brilliant-idea-or-a-terrible-one"]
title = "Are chatbots of the dead a brilliant idea or a terrible one? | Aeon Essays"
description = "We can now create compelling experiences of talking with our dead. Is this ghoulish, therapeutic or something else again?"
full_description = "In 1970, a 57-year-old man died of heart disease at his home in Queens, New York. Fredric Kurzweil, a gifted pianist and conductor, was born Jewish in Vienna in 1912. When the Nazis entered Austria in 1938, an American benefactor sponsored Fred’s immigration to the United States and saved his life. He eventually became a music professor and conductor for choirs and orchestras around the US. Fred took almost nothing with him when he fled Europe – but, in the US, he saved everything. He saved official documents about his life, lectures, notes, programmes, newspaper clippings related to his work, letters he wrote and letters he received, and personal journals. For 50 years after Fred died, his son, Ray, kept these records in a storage unit. In 2018, Ray worked with his daughter, Amy, to digitise all the original writing from his father. He fed that digitised writing to an algorithm and built a chatbot that simulated what it was like to have a conversation with the father he missed and lost too soon. This chatbot was selective, meaning that it responded to questions with sentences that Fred actually wrote at some point in his life. Through this chatbot, Ray was able to converse with a representation of his father, in a way that felt, Ray said: ‘like talking to him.’ And Amy, who co-wrote this essay and was born after Fred died, was able to stage a conversation with an ancestor she had never met. ‘Fredbot’ is one example of a technology known as chatbots of the dead, chatbots designed to speak in the voice of specific deceased people. Other examples are plentiful: in 2016, Eugenia Kuyda built a chatbot from the text messages of her friend Roman Mazurenko, who was killed in a traffic accident. The first Roman Bot, like Fredbot, was selective, but later versions were generative, meaning they generated novel responses that reflected Mazurenko’s voice. In 2020, the musician and artist Laurie Anderson used a corpus of writing and lyrics from her late husband, Velvet Underground’s co-founder Lou Reed, to create a generative program she interacted with as a creative collaborator. And in 2021, the journalist James Vlahos launched HereAfter AI, an app anyone can use to create interactive chatbots, called ‘life story avatars’, that are based on loved ones’ memories. Today, enterprises in the business of ‘reinventing remembrance’ abound: Life Story AI, Project Infinite Life, Project December – the list goes on. These apps and algorithms are part of a growing class of technologies that marry artificial intelligence (AI) with the data that people leave behind. These technologies will become more sophisticated and accessible as the parameters and popularity of large language models increase and as personal data expands into the seeming permanence of the cloud. To some, chatbots of the dead are useful tools that can help us grieve, remember, and reflect on those we’ve lost. To others, they are dehumanising technologies that conjure a dystopian world. They raise ethical questions about consent, ownership, memory and historical accuracy: who should be allowed to create, control or profit from these representations? How do we understand chatbots that seem to misrepresent the past? But for us, the deepest concerns relate to how these bots might affect our relationship to the dead. Are they artificial replacements that merely paper over our grief? Or is there something distinctively valuable about chatting with a simulation of the dead? The bonds we form with others infuse our lives with shared meaning and warmth, but these connections are threatened by time and the rupture of death. Profound loss is inevitable. This is why all human cultures have developed rituals, stories and other resources for dealing with the death of loved ones. In Book 11 of Homer’s Odyssey, also known as the Nekyia (or Book of the Dead), Odysseus journeys to the underworld and finds his dead mother, Anticlea, who has become a shade – a spirit he cannot embrace. The ancient Egyptians’ own Book of the Dead – a collection of texts originally written on papyrus scrolls and the walls of tombs – offers incantations to guide lost souls safely into the afterlife where they might be granted immortality. Alongside such ancient stories and spells are ongoing rituals that engage the dead. In some Asian cultures, the gates of the underworld are said to open during ‘Ghost Month’, and the spirits of dead ancestors freely wander the human realm. Likewise, the Mexican Dia de Los Muertos is a time of remembrance and celebration when the living and dead can commune. Other rituals are less public. In Jewish culture, sitting shiva – which takes place in the seven days immediately after the death of a loved one – facilitates a structured space for coming together around the memory of the deceased. In Japanese culture, sacred objects like the butsudan, a small domestic Buddhist shrine for honouring deceased family members, support continuing bonds with dead ancestors. These beliefs and cultural practices offer hope that the living might one day fulfil their desire to commune with the dead. They sustain people through grief by promoting the sense that the human community transcends loss, and that love is not destroyed as long as memory remains. When someone dies, the rational person is expected to close the curtain on that relationship and move on But in the industrialised West, communities of support are collapsing. Our spiritual institutions, practices and beliefs have been denuded by centuries of disenchantment. This may suggest that technological modernity, with its commitment to scientific rationalism, is to blame for the Western world’s often-impoverished relationship to death. To be rational in the industrialised West is to grant primacy to what can be seen, touched and measured. When someone dies, the rational person is expected to close the curtain on that relationship and move on. Instead of offering new spiritual resources, our technocultures seem to provide us with a vast array of ingenious instruments to help us turn away from death: we have medicine to postpone, entertainment to soothe, drugs to stupefy, and other technologies to help us avoid and ignore. The average person is at once inundated with stylised images of people dying while being sequestered from real, meaningful experiences with death. All the while, the technological advances that saturate our lives with increasing wealth and power whisper of a way beyond death, of new eschatologies of mechanical transcendence. Yet, for all its dynamism, this technological ingenuity has not quelled the suspicion that there are no technical solutions to spiritual problems. It is often said that, rather than providing resources that meet our needs, our instruments merely help us deny the reality of death. To some, these technologies are nothing more than embalming tools, made to mask the inevitable pain of profound loss. And among these many tools, what could be more pernicious than a chatbot that speaks in the voice of those who are, in reality, gone forever? Since its inception, chatbot technology has been associated with illusion, and subject to suspicion. One of the first and most well-known chatbots, ELIZA, was created in the 1960s by the MIT professor Joseph Weizenbaum, a computer pioneer-turned-critic who later decried AI as an ‘index of the insanity of our world’. ELIZA was designed to imitate a psychotherapist, employing keyword detection and preprogrammed rules to ask users basic questions that prompted verbalisation and reflection. Although rudimentary by today’s standards, people found ELIZA compelling. When Weizenbaum’s secretary asked for alone time with the chatbot, the professor took it as evidence that she erroneously thought the machine had a mind. As a result, Weizenbaum came to believe that even simple chatbots like ELIZA ‘could induce powerful delusional thinking in quite normal people.’ Today, chatbots employ machine learning rather than preprogrammed rules and can hold sophisticated conversations by making inferences, responding to questions, tracking context and conversational presuppositions, and more. To a much greater degree than ELIZA, contemporary chatbots can produce a compelling conversational experience similar to a human interlocutor. Although chatbots have been around for a long time, chatbots of the dead are a relatively new innovation made possible by recent advances in programming techniques and the proliferation of personal data. On a basic level, these chatbots are created by combining machine learning with personal writing, such as text messages, emails, letters and journals, which reflect a person’s distinctive diction, syntax, attitudes and quirks. There are various ways this combination can be achieved. One resource-intensive method involves creating a new chatbot by training a language model on someone’s personal writing. A technically simpler method involves instructing a pretrained chatbot, like ChatGPT, to utilise personal data that is inserted into the context window of a conversation. Both methods enable a chatbot to speak in ways that resemble a dead person by ‘selectively’ outputting statements the person actually wrote, ‘generatively’ producing novel statements that bear some resemblance to statements the person actually wrote, or some combination of both. A chatbot of the dead that’s monetised or gamified could be dangerous in the hands of an unscrupulous corporation Chatbots can be used on their own or combined with other forms of AI, such as voice cloning and deepfakes, to create interactive representations of the dead. When provided with the right data, many companies and platforms now have the technical capacity to generate a conversational AI version of your deceased loved one. In the future, these chatbots will likely become more common and sophisticated, involving much more than just text. Like human mediums and Ouija boards, these bots appear to meet one of our deepest desires: to speak with the dead once again. Many critics view this technological endeavour as an especially abject form of death denial. A common objection to these bots is that emotionally vulnerable users may become so invested in their interactions that they will conflate their chatbot with the deceased person, or lose sight of the fact that the person is gone. As the philosopher Patrick Stokes puts it in Digital Souls (2021), we may ‘become so used to avatars of the dead that we accept and treat them as if they’re the dead themselves.’ This sort of worry suggests, as Weizenbaum feared, that the salutary potential of chatbots is based in delusional thinking. Another worry relates to chatbots’ lack of inner lives. Critics, like the philosopher Shannon Vallor in The AI Mirror (2024), argue that there is something defective about emotional bonds with entities that cannot reciprocate affection or interest, about love that is kept alive by ‘the economic rationality of exchange’ rather than a more precarious ‘union of loving feeling and action’. And these emotionally one-sided relationships create a risk of over-reliance, social isolation and exploitation. This risk is especially stark given that chatbots of the dead may be produced by companies with a financial incentive to manipulate users and maximise engagement. A chatbot of the dead that is highly monetised (unlock your chatbot’s ‘caring’ traits for a small fee!) or gamified (chat every day to level up!) could be a dangerous tool in the hands of an unscrupulous corporation. These types of critiques often implicitly assume that the purpose of chatbots of the dead is to function as a kind of stand-in for a lost loved one, an ersatz companion of sorts. This use suggests that chatbots should be designed to be as realistic and fully formed as possible. And from this vantage point, there are two possible problems: either chatbots cannot live up to this standard, and therefore they are deceptive and defective, or they can live up to this standard, and therefore they will confuse, isolate or exploit those who use them. But this implicit assumption is wrong. Chatbots of the dead should not be used as stand-ins or companions. Nor should they be built to be as realistic and fully formed as possible. Instead, chatbots of the dead should be made to serve a purpose that is more familiar and more complex, a purpose that can help us transcend our mortal condition, not through technological resurrection, but through imagination. Any griever, or any student of history, knows that relationships don’t end neatly with death; memories, imaginings, questions and answers continue to churn in the minds of the living, aided by artefacts and shared community. The secular space where we allow this reality to flourish is the arts. ‘Everything is as it should be, nothing will ever change, nobody will ever die,’ writes Vladimir Nabokov in his memoir, Speak, Memory (1951). Conjuring memories of childhood for the reader, he evokes a vivid sensory picture: I see again my schoolroom in Vyra, the blue roses of the wallpaper, the open window. Its reflection fills the oval mirror above the leathern couch where my uncle sits, gloating over a tattered book. A sense of security, of well-being, of summer warmth pervades my memory … The mirror brims with brightness; a bumblebee has entered the room and bumps against the ceiling. This passage may not denote a specific event, bumblebee or book. More likely, this is a composite scene staged from different impressions. When Nabokov describes his uncle as ‘gloating’ over a book, he arrives at this description from childhood memories filtered through adult inferences – ‘gloating’ is not typically a child’s concept. Memory is a space to grasp meaning through a gauze of impressionistic details, and the arts are spaces where this stippled portrait of past life can live on. We save these kinds of artefacts to nurture our imagination of the past and our ancestors We live our lives through a multitude of meaningful fictions, personal memory being one of them. This form of memory is often built, like Nabokov’s scene, from a composition of impressions – blue roses on wallpaper, a bee, a book, an expression on a family member’s face – that we stitch into a narrative when recounting scenes from our lives. This stitching-together constitutes a kind of fiction that is not opposed to truth. In Mimesis as Make-Believe (1990), the philosopher Kendall Walton describes fiction as that which ‘is to be imagined’. The passage above prescribes that the reader imagine Nabokov’s room in Vyra. This room is thus part of a fictional world. Although a bookstore might classify Speak, Memory as ‘literary nonfiction’, the world it prescribes is, in Walton’s sense, fiction, just a different kind of fiction than what is prescribed by Nabokov’s novel Pale Fire (1962). Speak, Memory makes extensive use of imagination to make the reader feel the work’s proposition: that the author"
