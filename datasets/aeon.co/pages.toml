full_description = "Paul created Aeon and Psyche in order to explore and communicate knowledge, and to address the philosophical need we all share to make sense of ourselves and the world. He is committed to ensuring our content is accessible and freely available. Paul’s role is to sustain and develop our mission and to oversee Aeon Media as a whole, including our latest venture, the Sophia Club, an international programme of Live Philosophy events. Brigid was trained as an environmental historian, has taught history and philosophy of science, and studied human ecology and anthropology. In addition to supporting Paul’s overall direction of Aeon, Psyche and the Sophia Club, Brigid directs the editorial team to ensure that the vision of the magazines is manifest in our publishing programme, working closely with our commissioning editors, photo editor, video programmers and production team. Outside of her work at Aeon Media, Brigid is a member of the Melbourne Humanities Foundation and the British Museum Friends Advisory Council. You can find Brigid on X @brigidhains. Kirsten leads the operations across our Melbourne, London and New York teams, and works with Paul and Brigid to grow Aeon Media and deliver our mission to explore and communicate knowledge that helps us make sense of ourselves and the world. Her career spans arts, international cultural relations and higher education. She was the long-term deputy director for the British Council in Australia, and has held previous roles at Monash University and at Arts Centre Melbourne, and has served on the boards of the Emerging Writers’ Festival and the Centre for Contemporary Photography in Melbourne."
