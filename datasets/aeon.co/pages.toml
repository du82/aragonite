["https://aeon.co/essays/commitment-and-cooperation-a-coevolutionary-relationship"]
title = "Commitment and cooperation: a coevolutionary relationship | Aeon Essays"
description = "Though natural selection favours self-interest, humans are extraordinarily good at cooperating with one another. Why?"
full_description = "Every week at the office, you and your fellow employees have meetings to discuss progress on group projects and to divide tasks efficiently. Perhaps in the evening, you go home and cook dinner with your partner. At least once in your life, you might have seen a team of firefighters work together to extinguish a fire at a burning house and rescue those inside. You have probably also witnessed or participated in political demonstrations aimed at bettering the treatment of those in need. These are all examples of human cooperation toward a mutually beneficial end. Some of them seem so commonplace that we rarely think of them as anything special. Yet they are. It is not obvious that any of the other great ape species cooperate in such a way – spontaneously and with individuals they have never before met. Though there has been some evidence of cooperation in other great apes, the interpretation of studies on ape cooperation has also been contested. In the human case, cooperation is unequivocal. The evolution of cooperation has been of interest to biologists, philosophers and anthropologists for centuries. If natural selection favours self-interest, why would we cooperate at an apparent cost to ourselves? You might say that none of these examples is costly; they all benefit the person cooperating as well as the recipient of the cooperation. This is true, but there is still a puzzle to solve. If I can reduce the cost of cooperating by deception – pretending to pull my weight in the group project or in the rescue mission – and still reap the benefits, why would I not do so? This is known as the ‘free-rider’ problem. This kind of problem also arises in the very first forms of human cooperation. Group hunting is one such activity, possibly occurring as early as 2 million years ago. Imagine a group of our ancestors carrying spears, tracking a bovid animal like a wildebeest. If the hunt takes the form of an ambush, the group would need to coordinate with each other to surround the prey and attack it at the same time, without being noticed. If the hunt takes the form of a chase, the group would need to coordinate when they move forward and from what angle. They might also need to collectively figure out how to shepherd the target away from its herd. While some have found that chimpanzees cooperate in group hunting, this is not true of all chimpanzee groups. Indeed, others have argued that chimpanzee hunting is often characterised by individuals trying to maximise their own gain. That is, they do not work collaboratively with others nor do they bring food back to a central location for sharing, but rather fight over the spoils competitively. This usually occurs in the form of harassing the captor of the prey since the captor would not do well by attempting to protect a carcass that was too large to monopolise from the forces of several hungry predators. However, environmental changes approximately 2 million years ago meant that choosing to forage individually was no longer optimal and it became necessary to collaborate with others to secure better game. Global cooling and drying trends resulted in an expansion of open environments. This change in habitat was coupled with an increase in terrestrial monkeys such as baboons who competed with early hominins for their usual means of subsistence in fruits and vegetation, creating selection pressure for hominins to find a new foraging niche. So, early human group hunting looked quite different from that of the other great ape species. It involved coordination and cooperation as well as division of the spoils, even among those who did not engage in the hunt. As with our earlier examples, this kind of mutually beneficial cooperation would seem to involve an incentive to free-ride or deceive others, as an individual would do better by lagging behind in the hunt and ensuring the gain at minimal cost, if they could get away with it. Yet this is not typically what we see in practice. So what could explain why human group hunting is so cooperative? The anthropologist Kristen Hawkes has argued that the reason men take part in a collaborative hunt is to signal their mating quality to potential partners. On this view, collaborative hunting is not primarily a form of providing food for one’s family but is instead a means of ‘showing off’ or sending a ‘costly signal’. In other words, if an individual’s quality is not directly observable, they are incentivised to advertise it either for sexual access or resource attainment. Such advertisements may take the form of risky displays or energy-intensive activities. Of course, it would also be profitable for ‘low-quality’ individuals to deceive others about their mating quality. The proposal is that, in general, the receiver of the signal is able to determine when senders are honest about their quality because of the cost entailed in signalling – a low-quality mate could not afford to engage in the risky or energy-intensive activity. However, there are many problems with this explanation for why men hunt. First, hunting is a collective activity where it is difficult to observe individual contributions that would correspond to mating quality. Second, it does not seem that costs are greater for the less-skilled – the whole group might do less well with lower-quality hunters but it’s unclear that the individual hunter does less well if he is low quality. Third, we would expect individuals to withdraw from costly hunting if they were less skilled – it would only advertise their low quality and they would pay the costs of signalling – but we do not see this in reality. Finally, in a study of 10 forager societies, it was found that, on average, male hunting generates 68 per cent of the group’s calories, compared with female foraging which generates 32 per cent; male hunting also provides 88 per cent of total protein sources compared with just 12 per cent from gathering. This shows that hunting is, in fact, a good means of provisioning for one’s family. So, it seems the costly signalling hypothesis is not well supported by ethnographic evidence. Provisioning offers an explanation for why men hunt, but we still face a free-rider problem. It does not necessarily require the effort of an individual hunter to ensure his family is provisioned as long as the hunting party meet a threshold level of engagement for a successful hunt, and the individual hunter’s lack of contribution goes unnoticed. My theory for why cooperation in hunting is sustained is different. To get there, I will first have to introduce some game theory. Game theory is the study of strategic interactions between individuals. We represent a game of mutual benefit as a Stag Hunt. In this game, players have two options – hunting stag or hunting hare, and they choose simultaneously so they do not know what the other will do. Both individuals would do best by cooperating and jointly acquiring a stag. However, they also have the option of going on a solo hare-hunting excursion. If they do so, and the other person goes for the stag, the hare-hunter gets a reasonably good payoff, but the stag hunter gets nothing. If both go for the hare, each gets a lower payoff than they would if only one hunted hare, but at least they get something. So hunting hare is considered the ‘risk-dominant’ option – it has a lower payoff than if both people hunted stag, but is attractive because it ensures you never end up with nothing. Really, a group hunt is a Stag Hunt game involving multiple players, but I will use the simpler two-person example for now. If we don’t end up cooperating, we lose out on future beneficial interaction How can we ensure cooperation in a Stag Hunt? One option is via commitment. A commitment is a pre-play signal (a signal that occurs before the choices are made) that changes an individual’s incentives for some future course of action, as well as changing her partner’s expectation of her future course of action. The signal need not be verbal. A commitment in the Stag Hunt game might involve, for example, picking up one’s spear or simply going on the hunting excursion. This changes the receiver’s expectations of what the sender of the signal will do. If the receiver believes the sender is going to go stag-hunting rather than hare-hunting, the receiver is also incentivised to go stag-hunting, since this ensures a better payoff for both. The sender is also incentivised to follow through on his signalled commitment to choose to hunt the stag. If he subsequently chooses to go hare-hunting, not only will he receive a lower payoff, but he will also be subject to social sanctions imposed by the receiver for violating her expectations. That is, the commitment is made credible because there is a reputational cost to reneging. Someone who commits and does not follow through reveals themselves to be an unreliable partner and so will be less likely to be chosen for mutually beneficial interaction in the future, meaning there is a cost to reneging. I believe commitment is large part of the reason humans have become so profoundly cooperative compared with other great ape species. So far, this has all been theoretical. I have shown how, in theory, commitments could solve a coordination dilemma in a Stag Hunt game, but I have not shown that this is actually the mechanism ensuring cooperation in early hominin group hunting. To do so, I must show, first, that there are future opportunities for beneficial interaction and, second, that reneging is punished by social exclusion. If these conditions are met, a signal to cooperate really does change sender incentives to cooperate since, if we don’t end up cooperating, we lose out on future beneficial interaction. To establish this empirically, I will use evidence from modern hunter-gatherer societies. Of course, the analogy between the practices of modern hunter-gatherers and our ancestors is not perfect. In particular, you might worry that I am crediting our ancestors with more advanced cognitive skills than were present at the time. However, this shouldn’t be a worry for our current case – all that is needed for reputation consequences to change the incentives of the sender of the commitment signal is that we have some concept of preferential partner choice, and this capacity is demonstrated even in chimpanzees. First, future opportunities for beneficial interaction exist because of the interconnected nature of hunter-gatherer communities. Individuals rely on one another for food and collective care of offspring, among other things. For example, recent anthropological evidence from modern forager societies reveals that, in some societies, newborns are held by alloparents 85 per cent of the time in the first days after birth. In this kind of social world, maintaining future opportunities for cooperative interaction is paramount. Second, we must ask whether reneging in the hunt is punished by social exclusion. In fact, there is plenty of evidence about this from modern hunter-gatherer communities. For example, in a comprehensive overview of food-sharing published in 2004, Michael Gurven documents his fellow anthropologist Jon Altman’s earlier finding of collusion between two Gunwinggu family clusters in Australia to share less food with a third cluster who was not producing enough. The sanction induced higher production and sharing by the third cluster. Meanwhile in the Philippines, Marcus Griffin found that unproductive Agta civilians are socially ostracised until they are forced to relocate. And in his book The Netsilik Eskimo (1970), the anthropologist Asen Balikci even notes that ‘lazy hunters’ are the subjects of back-biting, ostracism and outright quarrel in the Netsilik community. So reneging on a signalled intent to cooperate really can incur a cost. At this point, you might wonder what work the commitment signal is doing – the answer is that those who do not signal are not punished. Think, for example, of women and children who still receive food even though they did not go on the hunting excursion. If it could be shown that able-bodied men who do not signal are still punished for not hunting, then the explanation might be one of sex-based expectations rather than signalling, but there is as yet no evidence of this. I have shown how commitment can serve to secure mutually beneficial outcomes in group hunting – a commitment changes both others’ expectations of what the hunter will do, and the hunters’ own motivations to cooperate. However, I do not believe that the role of commitment in human cooperation stops here. Rather, I think there is a coevolution of commitment and cooperation over human history that explains why human cooperation is so distinctively proactive and widespread. That is, humans developed means of making commitments to cooperate with one another that allowed some forms of rudimentary cooperation to get off the ground and this, in turn, created the selective environment for the development of increasingly effective commitments, allowing even more effective cooperation on a wider range of issues, and so the feedback loop goes on. In what follows, I’ll illustrate a coevolutionary relationship of this sort by showing how group hunting and other early hominin shared activities played a role in the emergence of language, allowing us to make linguistic commitments to cooperation. Cooperation in early hunter-gatherer societies allowed hominins to expand into new habitats and with reduced risk of predation from other species. The cultural learning skills that were developing in the context of weapon-making and food preparation also enabled us to make innovations in clothing, shelter and more sophisticated tools. These developments better protect against harsh habitats and thereby contribute to extending human lifespans. Furthermore, the division of labour in hunting and gathering provides a resource buffer when prey is not available – this increased means of subsistence allows the group to grow and specialisation in these skills allow it to be more productive. As Kim Sterelny notes in his book The Evolved Apprentice (2012), it is likely we therefore see a positive feedback loop between collaborative hunting, increased group size and the rate of innovation. Not only this, but greater access to animal resources and a smoothing of the food supply across seasonal variation meant that there was greater availability of energy for mothers, a relaxation of the energy constraints on development of larger brains, and elongated life histories with shorter interbirth intervals. All these features will have contributed to growth of the group size. Since residential camp sizes in the modern ethnographic literature are still quite small, when I say growth of the group, I mean the interconnected network of camps, sometimes called the ‘village’. Unlike nonhuman primates, hunter-gatherers exhibit a hierarchical social structure of co-residing families with friendship dya"
