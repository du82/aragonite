full_description = "The US today has extraordinary levels of gun ownership. But to see this as a venerable tradition is to misread history You might have the unconditional love of family and friends and yet feel deep loneliness. Can philosophy explain why? Earthbound exploration was plagued with colonialism, exploitation and extraction. Can we hope to make space any different? When we think of changes in Earth’s history as changes of dynasty we miss out on understanding how life really works The sexual revolution promised new norms of intimacy based on egalitarianism. So far, only the rich have cashed in These canines have independent, peaceful, happy lives without a pet’s constraints. Why are they being persecuted and culled? We have laws to protect children from factory work. Why aren’t they protected from parents who monetise their lives online? It takes nerve to go against the grain and take your child out of school. But, for some, that’s when learning really starts Is Earth’s most-spoken language a living ‘gift’ or a many-headed ‘monster’? Both views distract us from the real dilemma The very attributes that make small dogs cute and popular are slowly strangling their ability to function as real animals Hunter-gatherers don’t live in an economic idyll but their deep appreciation of rest puts industrialised work to shame As the power of AI grows, we need to have evidence of its sentience. That is why we must return to the minds of animals"
