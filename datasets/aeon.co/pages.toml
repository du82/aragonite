full_description = "Byung-Chul Han’s relentless critiques of digital capitalism reveal how this suffocating system creates hollowed-out lives The consulting office reflects the personality of the therapist, while also subtly shaping the experience of their patients Since states are founded on violence and expulsion, their existence is always bound up in thorny questions about justice Though natural selection favours self-interest, humans are extraordinarily good at cooperating with one another. Why? In order to bridge the yawning gulf between the humanities and the sciences we must turn to an unexpected field: mathematics For Mary Midgley, the Western philosophical tradition is shaped by the fact that its greatest practitioners were bachelors Moral panics about erotica have coursed through the country’s history. Why do so many Americans think of porn as harm? The modern era is often seen as the triumph of science over supernaturalism. But what really happened is far more interesting It is the dark matter of conversation, the white space around a poem. For Rilke, listening is receiving the divine The case of Mexico shows that, despite a proliferating discourse that it is over, neoliberalism is as relentless as ever Often dismissed as the poor cousin of the sciences, chemistry has revealed natural laws that illuminate our Universe After decades of practising psychotherapy, I believe it has little foundation in science and often causes harm What distinguishes fiction from nonfiction? The answer to this perennial question relies on how we understand reality itself Diving into the ring of darkness beyond things easily answerable, asking ‘Why?’ questions is what make humans awesome Nurses experience deep suffering when they can’t act according to their moral compass. Our research shows a way forward All of our religions, stories, languages and norms were muddled and mixed through mobility and exchange throughout history We surveyed thousands of scientists in four countries and learned just how important beauty is to them"
