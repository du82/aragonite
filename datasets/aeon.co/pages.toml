title = "Thought-tinkering – the Korean German philosopher Byung-Chul Han | Aeon Essays"
description = "Byung-Chul Han’s relentless critiques of digital capitalism reveal how this suffocating system creates hollowed-out lives"
full_description = "I came across Byung-Chul Han towards the end of the previous decade, while writing a book about the pleasures and discontents of inactivity. My first researches into our culture of overwork and perpetual stimulation soon turned up Han’s The Burnout Society, first published in German in 2010. Han’s descriptions of neoliberalism’s culture of exhaustion hit me with that rare but unmistakable alloy of gratitude and resentment aroused when someone else’s thinking gives precise and fully formed expression to one’s own fumbling intuitions. Byung-Chul Han in Barcelona, Spain, in 2018. Photo by Album/Archivo ABC/Inés Baucells At the heart of Han’s conception of a burnout society (Müdigkeitsgesellschaft) is a new paradigm of domination. The industrial society’s worker internalises the imperative to work harder in the form of superego guilt. Sigmund Freud’s superego, a hostile overseer persecuting us from within, comes into being when the infantile psyche internalises the forbidding parent. In other words, the superego has its origin in figures external to us, so that, when it tells us what to do, it is as though we are hearing an order from someone else. The achievement society of our time, Han argues, runs not on superego guilt but ego-ideal positivity – not from a ‘you must’ but a ‘you can’. The ego-ideal is that image of our own perfection once reflected to our infantile selves by our parents’ adoring gaze. It lives in us not as a persecutory other but as a kind of higher version of oneself, a voice of relentless encouragement to do and be more. With this triumph of positivity, the roughness of the demanding boss gives way to the smoothness (a key Han term) of the relentlessly encouraging coach. On this view, depression is the definitive malaise of the achievement society: the effect of being always made to feel that we’re running hopelessly behind our own ego-ideal, exhausting ourselves in the process. The figure of the achievement subject gives rise to some of Han’s most vivid evocations of psychic and bodily debilitation: The exhausted, depressive achievement-subject grinds itself down … It is tired, exhausted by itself, and at war with itself. Entirely incapable of stepping outward, of standing outside itself, of relying on the Other, on the world, it locks its jaws on itself; paradoxically, this leads the self to hollow and empty out. It wears out in a rat race it runs against itself. Reading this passage now, I recall how startlingly true it seemed to me on first reading. It sent me back to the early years of my professional academic life, the permanent background hum of anxious frustration, as research – at once the first and the most distant professional priority, the job’s one indisputable signal of achievement – was forever subordinated to the workaday demands of teaching, marking and committee meetings. In the scarce hours outside of those duties, I’d return to work on an article and quickly realise that I needed to comb a dozen more sources before I could begin to write it. Abruptly, I became aware of how tired I was; able neither to work nor refrain from it, I’d lie suspended in a state of weary wakefulness. That hollowed-out achievement self, ‘at war with itself’, was all too familiar. Han’s critique of contemporary life centres on its fetish of transparency; the compulsion to self-exposure driven by social media and fleeting celebrity culture; the reduction of selfhood to a series of positive data-points; and the accompanying hostility to the opacity and strangeness of the human being. This may explain why autobiographical reflection barely figures in Han’s writings: he is doubtless wary of becoming just another voice seeking to be heard in among the cacophony of opinion. Born in Seoul in 1959, as a child Han tinkered with wires and chemicals in his bedroom, emulating his civil engineer father, who had worked on large public projects in South Korea. But these experiments came to an end after he triggered a chemical explosion in his bedroom that almost blinded him, leaving physical scars he still bears. He went on to study metallurgy. But Han’s reading and thinking were drawing him increasingly towards Europe, and the study of philosophy. At 22, he left South Korea for Germany, telling his parents that he was continuing his scientific studies (‘they wouldn’t have allowed me to study philosophy,’ he told El País in 2023). Han arrived in Germany with almost no knowledge of the language. Yet over the years he effected a remarkable self-transformation, from Korean technophile metallurgy student to émigré German philosopher and social critic. Now, he told an interviewer in Der Zeit, his tinkering is done with the stuff of thought rather than ‘wires or soldering irons’. The metaphor conveys a sense of thinking as more an environment than an activity, a distinctly German conception of the thinker’s vocation. Han’s affinity with German thought and culture runs deep, especially in regard to its ambiguous status of Germany as at once the philosophical home of the Enlightenment and of its comprehensive critique. He is very much in the tradition of the Frankfurt School, developing for the age of digital capitalism a new chapter of its enquiry into the ‘dialectic of Enlightenment’ – that disturbing interplay between progress and atavism, and creative making and traumatic explosion, that has shaped the passage to modernity. Han’s writerly voice is melancholic in the Freudian sense of being sealed inside its own grief These small intimations of the man and his life reverberate through his thought and prose. The tinkerer is a playful figure, bringing different chemical elements and physical forces into new and unpredictable kinds of contact. But for the boy Han, the play ended in horror that transfers directly to the later activity of thinking: ‘Thinking is also tinkering, and thinking can produce explosions. Thinking is the most dangerous activity, maybe more dangerous than the atomic bomb.’ Han clarifies that his own thinking is dangerous not because it foments violence, but because it discloses a world that is ‘merciless, mad and absurd’. He is writing from inside the experience of what T W Adorno calls ‘damaged life’, in the subtitle to Minima Moralia (1951) – a book Han often quotes – or the disintegration, under advanced consumer capitalism, of cultural forms and institutions and the accompanying deformation of individual consciousness and personal relationships. Han writes as though from the damage of a near-fatal explosion – at once the conflagration in his childhood bedroom and the more generalised explosion of previous forms of life. And the damage is irreparable: ‘The time in which there was such a thing as the Other is over,’ he writes in The Expulsion of the Other (2016). Han’s writerly voice is melancholic in the strict Freudian sense of being sealed inside its own grief, conveying an absolute conviction in the consignment of self and world to a course of destruction as inevitable as it is irreversible. Music is central to Han’s identification with German cultural tradition. He has told of his pleasure in singing Franz Schubert’s Winterreise (1827), a song cycle whose beauty is inextricably bound to its bleakness. Grieving a love lost, the singer wanders through a nocturnal winter landscape, riven by loneliness while longing for a death that will not come. Not a bad approximation, perhaps, of the Han that comes off the pages of his books, walking dejectedly through the winter of civilisation, alert to the traces of all that has been lost: the continuity of time, the grain of beauty, the tensions of eros, the substantiality of selfhood. Perhaps the other personal pleasures to which Han has alluded in interviews – tending to his garden, good food in high-end restaurants, a somewhat tentative sociability – should be seen in the context of these losses: a determination to cleave to the world of refined sensation that is being so inexorably eroded by virtual life. I’m not suggesting that Han’s books are explicitly lachrymose. Their manifest tone is more one of dry-eyed anger, rendered melancholic by the absence of any outlet or remedy for it. Under his gaze, the political, financial and technological sectors are thieves to whom we have willingly handed over our lives and selves, along with any capacity for dissent or resistance. Like his Frankfurt School predecessors, Han sees capitalism’s penetration into the deepest reaches of psychic and cultural life as the key to this phenomenon. The Burnout Society insists that power today works not through repression and persecution but by sly and insidious means of ‘self-exploitation’. In a self-administered regime of this kind, revolution is almost literally unthinkable: ‘Burnout and revolution are mutually exclusive,’ he writes later, in Capitalism and the Death Drive (2019). Han’s enquiries into the different regions of contemporary experience, including work, time, love and art, yield a remarkably consistent project of thought, a relentless critique of the spiritual and political privations of digital capitalism. The troubling question for anyone who reads widely in Han’s corpus is whether this tenaciously sustained consistency ends up becoming a symptom of what it critiques? That is, does the unbroken negativity of Han’s descriptions, his unwillingness to find anything other than loss and degradation in the forms of contemporary experience, end up reproducing the one-dimensional logic of digital capitalism itself? One of the weirder recent innovations of the tourism and leisure industry is the immersive art experience, in which viewers are invited to stand or lounge around cavernous dark spaces bordered by giant screens, onto which are projected digitally manipulated reproductions of great paintings. Vincent van Gogh’s or Claude Monet’s brush strokes, Piet Mondrian’s colour blocks, Salvador Dalí’s melting vistas – they all float across the screens, bursting into life and disintegrating into virtual piles on the floor, before rising in swirling maelstroms to combine and recombine on the walls. Enter one of these attractions after reading Han, and it will look rather more sinister than an elaborate exercise in kitsch gimmickry, since he believes that the cultural symptoms of digital capitalism effectively degrade the very nature of experience. Han regularly invokes Walter Benjamin’s distinction between the two senses of experience concentrated in the German words Erfahrung and Erlebnis. Erfahrung denotes an experience of what philosophy calls the negative – that which is irreducibly other to consciousness. As an encounter with the new and unknown, Erfahrung is intrinsically transformative, writes Han in The Palliative Society (2020), ‘a painful process of transformation that contains an element of suffering, of undergoing something.’ Art can provoke such an experience. A poem or play or painting may be what Franz Kafka called ‘the axe for the frozen sea inside us’, calling into question the ways we see, think and feel, even the way we live. It’s the kind of encounter Mark Rothko might have been alluding to when he noted that ‘a lot of people break down and cry when confronted with my pictures …’ Looked at through Han’s sensibility, Rothko’s paintings seem to cut straight through the smooth artifices of digital life, restoring contact with the tremulous realities of bodily and spiritual life from which we have so long been exiled. To digitalise a painting is to decompose it, to deprive it of ground For a work of art to have this effect, it must in some sense resist us, cause a disturbance of our familiar modes of language and perception. To be receptive to this kind of disturbance requires certain basic experiential conditions; we must be in an environment that permits lingering, an open-ended remaining in its presence. The paradox of lingering is that it fosters an intimacy that conveys the artwork’s irreducible strangeness. When a painting draws us towards it, we find it eludes us the closer we try to get to it. This is why we can find ourselves gazing at it for so long, often in a kind of stupefaction. Immersive Van Gogh, its creators claim, puts us inside the paintings, into a new, tactile proximity to their composition and texture. But it does so by annihilating what Han in The Scent of Time (2009) calls the ‘temporal gravitation’ of the originals, unmooring them from any location in space or time. A painting derives its meaning from the fixed relation of its spatial textural and chromatic elements, of, say, this thick band of yellow to that underlying wisp of black. This is what we call its composition. To digitalise a painting is to decompose it, to deprive it of ground. Under the rule of digital capitalism, time itself is severed from any ‘narrative or teleological tension’, that is, from any discernible purpose or meaning, and so, like the digital paintings in an immersive show, it ‘disintegrates into points which whizz around without any sense of direction.’ In such a regime of time, there is no possibility of Erfahrung, which depends on a sense of narrative continuum and duration. There is only the proliferation of its pale counterpart Erlebnis: the discrete event that ‘amuses rather than transforms’, as Han would later put it in The Palliative Society. The thrust of Han’s writing is, above all, philosophical. Social and cultural life are occasions for addressing metaphysical questions. As such, the surface symptoms of digital culture are secondary to its ontological premises. Like Martin Heidegger, on whose concept of Stimmung, or mood, he wrote his 1994 PhD thesis (as well as a 1999 introduction to Heidegger), he seeks to unearth the underlying metaphysics of our present-day culture. In particular, and again like Heidegger, Han is concerned with how the environment of a hyper-accelerated culture conditions the fundamental relationship between consciousness and the world. The Burnout Society crystallised the critique of the self-exploitative logic of contemporary capitalism that Han has been elaborating ever since. Prior to that, his output had been significantly more variegated; there were books on death, Far Eastern philosophy and a study of the concept of power in the Continental philosophical tradition. However, What Is Power? (2005) is intriguing for its adumbration of a non-coercive notion of power that uncannily anticipates his conception of digital capitalism’s burnout society. The power of capital is in the voluntary surrender of its subjects to their own exploitation Because power so often involves coercion, Han argues, there has been a tendency to see them as inextricable. But it is only when power is poor in mediation, felt as alien to our own lives and interests, that it resorts to threatened or actual violence. Whereas when power is at the ‘highest point of mediation’ – when it seems to speak from a recognition of its subjects’ needs and desi"
