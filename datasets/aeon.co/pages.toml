title = "To better understand the world, follow the paths of mathematics | Aeon Essays"
description = "In order to bridge the yawning gulf between the humanities and the sciences we must turn to an unexpected field: mathematics"
full_description = "In 1959, the English writer and physicist C P Snow delivered the esteemed Rede Lecture at the University of Cambridge. Regaled with champagne and Marmite sandwiches, the audience had no idea that they were about to be read the riot act. Snow diagnosed a rift of mutual ignorance in the intellectual world of the West. On the one hand were the ‘literary intellectuals’ (of the humanities) and on the other the (natural) ‘scientists’: the much-discussed ‘two cultures’. Snow substantiated his diagnosis with anecdotes of respected literary intellectuals who complained about the illiteracy of the scientists but who themselves had never heard of such a fundamental statement as the second law of thermodynamics. And he told of brilliant scientific minds who might know a lot about the second law but were barely up to the task of reading Charles Dickens, let alone an ‘esoteric, tangled and dubiously rewarding writer … like Rainer Maria Rilke.’ Sixty-plus years after Snow’s diatribe, the rift has hardly narrowed. Off the record, most natural scientists still consider the humanities to be a pseudo-science that lacks elementary epistemic standards. In a 2016 talk, the renowned theoretical physicist Carlo Rovelli lamented ‘the current anti-philosophical ideology’. And he quoted eminent colleagues such as the Nobel laureate Steven Weinberg, Stephen Hawking and Neil deGrasse Tyson, who agreed that ‘philosophy is dead’ and that only the natural sciences could explain how the world works, not ‘what you can deduce from your armchair’. Meanwhile, many humanities scholars see scientists as pedantic surveyors of nature, who may produce practical and useful results, but are blind to the truly deep insights about the workings of the (cultural) world. In his best-selling book The Fate of Rome (2017), Kyle Harper convincingly showed that a changing climate and diseases were major factors contributing to the final fall of the Roman Empire. The majority of Harper’s fellow historians had simply neglected such factors up to then; they had instead focused solely on the cultural, political and socioeconomic ones. In my own book, The Oracle of Numbers: A Short Philosophy of Mathematics (2023), currently only available in the original German, I tried to counter this intellectual parochialism. During my academic training in mathematics, physics and philosophy, I witnessed many instances of this narrow-mindedness and always wondered why highly intelligent people in these fields guarded themselves against major insights from the other fields. I wanted to motivate them, and the inquisitive general public, to open their minds and see that the neverending quest for a better understanding of the world follows many paths. Ludwig Wittgenstein once said: ‘I want to show the colourfulness of mathematics.’ In that spirit, I placed mathematics at the centre of my project because, in my view, mathematics searches along more of these many paths than any other intellectual discipline. It is connected on a deep level both with the natural sciences and the humanities. It bridges the gulf between them, and it does so by putting certain metaphysical and epistemological dogmas into question, as will become clear in the following. The divide between the two cultures is not just an academic affair. It is, more importantly, about two opposing views on the fundamental connection between mind and nature. According to one view, nature is governed by an all-encompassing system of laws. This image underlies the explanatory paradigm of causal determination by elementary forces. As physics became the leading science in the 19th century, the causal paradigm was more and more seen as the universal form of explanation. Nothing real fell outside its purview. According to this view, every phenomenon can be explained by a more or less complex causal chain (or web), the links of which can, in turn, be traced back, in principle, to basic natural forces. Anything – including any aspect of the human mind – that eludes this explanatory paradigm is simply not part of the real world, just like the ‘omens’ of superstition or the ‘astral projections’ of astrology. On the opposing view, the human mind – be it that of individuals or collectives – can very well be regarded separately from its physical foundations. Of course, it is conceded that the mind cannot work without the brain, so it is not entirely independent of natural forces and their dynamics. But events of cultural significance can be explained as effects of very different kinds of causes, namely psychological and social, that operate in a sphere quite separate from that of the natural forces. These divergent understandings underpin the worldviews of each culture. Naive realists – primarily natural scientists – like to point out that nature existed long before humankind. Nature is ordered according to laws that operate regardless of whether or not humans are around to observe. So the natural order of the world must be predetermined independently of the human mind. Conversely, naive idealists – including social constructivists, mostly encountered in the humanities – insist that all order is conceptual order, which is based solely on individual or collective thought. As such, order is not only not independent of the human mind, it’s also ambiguous, just as the human mind is ambiguous in its diverse cultural manifestations. Mathematics mediates a conciliatory view that avoids the mistake of the naive realist and the naive idealist The clash of cultures between the humanities and the natural sciences is reignited over and over because of two images that portray the interrelationship of mind and nature very differently. To achieve peace between the two cultures, we need to overcome both views. We must recognise that the natural and the mental order of things go hand in hand. Neither can be fully understood without the other. And neither can be traced back to the other. The naive realist and the naive idealist fall prey to the same error, albeit in opposite directions – which gets us some way to the essence of the disagreement between the two cultures. Both confuse determination with explanation. ‘Determination’ refers to the emergence of a real-world phenomenon through a more or less complex web of cause-and-effect relationships. For example, when particle physics tells us that the Northern Lights result from solar winds colliding with Earth’s atmosphere, we get an explanation of the luminous phenomenon by having its main causally determining factor pointed out to us. Similarly, when psychological research informs us about the potentially long-lasting effects of trauma, we can explain the behaviour of victims of childhood abuse, to a certain extent, as a result of how repressed memories influence their actions. Now, the realist and the idealist – the scientist and the literary intellectual – both agree that explaining a phenomenon always means, in essence, revealing such determining causal relationships. Their views differ only in that for the realist the causal network is rooted in a firm natural basis, whereas for the idealist the basis is conceptual and therefore dependent on a contingent cultural embedding. The best mediator of a conciliatory view that avoids the mistake of the naive realist and the naive idealist is mathematics. Mathematics gives us shining proof that understanding some aspect of the world does not always come down to uncovering some intricate causal web, not even in principle. Determination is not explanation. And mathematics, rightly understood, demonstrates this in a manner that lets us clearly see the mutual dependency of mind and nature. For mathematical explanations are structural, not causal. Mathematics lets us understand aspects of the world that are just as real as the Northern Lights or people’s behaviour, but are not effects of any causes. The distinction between causal and structural forms of explanation will become clearer in due course. For a start, take this example. Think of a dying father who wants to pass on his one possession, a herd of 17 goats, evenly to his three sons. He can’t do so. This is not the case because some hidden physical or psychological forces hinder any such action. The reason is simply that 17 is a prime number, so not divisible by three. Those who remember mathematics only as a dull school subject that is mainly about applying unmotivated formulas in the context of uninspired exercises will naturally be sceptical about my claim that mathematics can bridge the gulf between the two cultures. The usual presentation of mathematics to the broader public makes it appear, at best, as a useful auxiliary discipline for the natural and technological sciences, or, at worst, as a curious collection of cute logical tricks. How could such a discipline possibly contribute to a better understanding of the interrelationship between mind and nature? A first idea is given by Riemannian geometry, the foundations of which were laid in the mid-19th century by Bernhard Riemann, building on the work of his teacher Carl Friedrich Gauss. Gauss was fascinated by the intrinsic curvature at any point on the interior of a smooth surface. What does this mean? Take a flat sheet of paper. It has zero curvature everywhere, and this remains so even after it is rolled up into a play telescope; the apparent curvature is merely extrinsic, it exists only relative to the surrounding three-dimensional space. In contrast, the surface of a sphere has a non-zero intrinsic curvature everywhere. The surface doesn’t just look crooked, it really is crooked – in and of itself, so to speak. Riemann elevated Gauss’s concept of intrinsic curvature to more than two dimensions. Ever since, one can meaningfully and precisely ask whether the ‘space around us is curved in itself’. Before Riemann, this would have been a meaningless sequence of words, at best with some associative force in the hands of a gifted poet. Riemann’s geometry made conceivable what was not only unimaginable before, but unthinkable in the truest sense of the word. The example of Riemannian geometry not only demonstrates the ability of mathematics to broaden our intellectual horizons with new perspectives. It also shows how this intellectual-aesthetic advantage can yield unexpected scientific, and even practical, benefits: it provided the conceptual resources Albert Einstein needed to develop his general theory of relativity. Thus, Einstein was able to see gravity not as a force causing material objects to attract each other, but as a purely geometrical, ie, structural, element of the Universe. The Universe is curved in itself. And, since the Big Bang, it has been expanding, but not into a pre-existing surrounding space. The Big Bang was no explosion that ejected matter outwards (causal); there was and is simply no ‘outside’. Rather, the Universe is expanding in the sense of a certain continuous change of its intrinsic curvature (structural). It is thanks to Einstein, and Edwin Hubble, that we know this and can use it for useful things like the GPS. But it is only thanks to Riemann that we can think it at all. Mind and world are no separate spheres that must first be connected. Rather, both depend on each other The difference between causal and structural explanations becomes clearer with regard to Immanuel Kant’s conception of ‘transcendental idealism’, as laid out in his Critique of Pure Reason (1781). For Kant, empirical experience is possible only within a given conceptual framework, which in turn does not arise from empirical experience, but rather constitutes the human mind. And a crucial part of this framework is Euclidean geometry. The world is not ‘in itself’ populated by spatially and temporally delimited objects that interact with each other in a variety of ways. According to Kant, the world is structured this way because the human mind is able to grasp it in this way, and in this way only. Euclidean geometry, so he believed (he couldn’t know anything about Riemannian geometry yet), determines the spatial dimensions of this order. Thus, geometry is just as much a study of an elementary trait of our mind as of the space around us. Kant’s transcendental idealism doesn’t only suffer from the fact that Euclidean geometry turned out to be not quite as constitutive as he thought. More severely, his conception of empirical knowledge, as an act of understanding through which conceptually formed ‘judgments’ miraculously emerge from mere ‘sensations’, remains completely obscure, as even well-meaning readers of the Critique must admit. But we can attribute at least one fundamental insight to Kant: mind and world are no separate spheres that must first be connected, so that the question arises as to how exactly this might be achieved. Rather, both depend on each other. Just as the world does not simply prescribe spatial, temporal and other structures that our mind then has to decipher, the mind is not free to impose any structure on the world at will. This is most impressively demonstrated by mathematics, which, despite the lack of empirical restrictions, does not fall into wild speculation. Mathematics eludes the causal paradigm of explanation. Its explanations are of a very different kind than those in terms of cause and effect, as another look at the relationship between geometry and physics shows. Ten years before his general theory of relativity, Einstein had in 1905 presented to an astonished world its preliminary form, the special theory of relativity. And in this theory, a special form of Riemannian geometry devised by Hermann Minkowski plays a key role, with rather peculiar consequences. The most notorious is the so-called ‘twin paradox’. A pair of twin brothers have applied to take part in a space mission, but only one of them has been selected. The aim of the mission is to travel to the farthest regions of space, thanks to the latest rocket technology at nearly the speed of light. After the chosen brother returns to Earth, still a young man, he visits his brother and reencounters an old man. It is quite common to explain this ‘paradox’ as a consequence of the accelerating forces acting on the travelling brother in his rocket. (See, eg, Richard Feynman’s Lectures on Physics.) And indeed, it seems very plausible, even inevitable, to assume that some physical cause must be responsible for the age difference. But that is false, the true reason lies in the structural framework within which the forces occur: the geometry of spacetime. Space and time cannot be considered separately, rather they are intertwined in an overarching common structure. And within this structure, the path, or ‘world line’, of the astronaut on the mission is simply shorter than that of his brother on Earth. This is not a cause, but – in Kant’s terms – a basic aspect of our transcendental explanatory framework. Mathematics highlights the limits of natural scientific explanation. This be"
