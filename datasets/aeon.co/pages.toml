title = "Write for Aeon | Aeon"
description = "Have an idea to contribute? We love working with enthusiastic and dedicated writers with exciting, new ideas. Learn how to pitch your article to Aeon and join our community of expert writers."
full_description = "Since 2012, Aeon has established itself as a unique digital magazine, publishing some of the most profound and provocative thinking on the web. We ask the big questions and find the freshest, most original answers, provided by leading thinkers on science, philosophy, society and the arts. Our signature format at Aeon is the Essay, a longform, deep dive into a topic, generally 2,500-5,000 words, presented from a unique angle, drawing together various strands of knowledge and experience, and written with clarity and verve to make ideas accessible to a curious and intelligent general reader. Who writes for Aeon? Most of our Essays are written by academic experts, but certainly not all. If you are not an academic, but have significant professional or practical expertise in your field, don’t hesitate to bring us a great idea for an Essay. We also strongly encourage younger and emerging scholars, especially outside the US and the UK, to pitch Essay ideas to us, even if you don’t have much experience in writing outside of the academy. We love working with enthusiastic and dedicated writers with exciting, new ideas, and we’re good mentors. To get a better sense of what we’re looking for, we encourage you to familiarise yourself with Aeon’s archives, where you will find examples of the Aeon Essay format and the range of topics we cover. Please note that we are interested in receiving pitches, not completed drafts. We are not looking for rebuttals to previous pieces, news commentary or book reviews. As we receive a high volume of pitches, we cannot respond to every enquiry. We’ll be in touch if we’d like to pursue your Essay idea. If you have a pitch for a completed short documentary, or have any additional video inquiries, please email contact.video@aeon.co"
