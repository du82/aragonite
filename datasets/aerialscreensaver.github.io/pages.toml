["https://aerialscreensaver.github.io/changelog.html"]
title = "Aerial - A free and open-source macOS Screen Saver"
full_description = '''After having introduced 20 extra videos in 2.0, Joshua Michaels & Hal Bergman listened to feedback and went back to work on improving them. With Aerial 2.2, you will get updated versions of those videos, many have been slowed down so they feel a lot more natural amongst the other Aerial videos, and they also have seen some optimization on video compression so they have better quality and take even less disk space ! A huge shoutout to them for their effort on this. If you enjoy the updated videos, please consider supporting them by checking the video packs they have created especially for Aerial on their website, those too have all been updated with better compression and slower paced videos. Aerial will now periodically refresh all the custom sources you have added. This includes the community videos and packs mentionned above, but also any other source you've added there. For local sources, pressing the "Refresh now" button will make Aerial rescan your folder and pick-up any new video that's been added. Aerial Companion 1.2 (the app that installs/keep Aerial up to date) now includes a new cool feature, fullscreen mode ! If you have a multi monitor setup, you can now launch Aerial on just one screen while you keep working on the other. This is still a bit experimental so feel free to read this post for more information about it if you are interested! Aerial Companion now sports a new icon thanks to Inferno Design. It's monochrome and feel right at home on macOS Big Sur! And yes, in case you missed it, both Aerial and Companion are natively compiled for ARM macs, and thanks to the great improvement on video decoding on the M1, Aerial runs extremely efficiently on those! If you enjoy those videos, please consider supporting them by checking the video packs they have created especially for Aerial on their website There are also many other new options, including vibrance control if you want to make your non HDR videos pop a bit more, sunset and sunrise videos at appropriate times, and more!'''
