["https://aerialscreensaver.github.io/installation.html"]
title = "Aerial - A free and open-source macOS Screen Saver"
full_description = "Aerial comes packaged as an application called Aerial Companion that installs and keep the screensaver updated. This application also provides many of the extra features such as the video wallpaper integration. And you bet it's also open source! To install simply grab the latest release, look for it in your user's Downloads folder, unzip (it may be already unzipped depending on your web browser/settings) and move Aerial Companion.app to your /Applications folder. Then launch it! At first launch, you will have the choice of having the updates automatically happening in the background, or to have the app in your menubar. If you want to try the video wallpaper integration, please pick the menubar option. If you have used Aerial for a while, you may remember that in version 1.5.0, I had introduced an auto-update mechanism directly into the screen saver. While this worked for a while, Apple introduced changes in how screen savers operate with macOS 10.15 Catalina. Those security changes are good and were needed, but they had the unfortunate consequence of breaking the auto-update mechanism. While I still patiently wait for a new screen saver API from Apple, in the meantime, I ended up making this new Companion to fill the gap. It also makes the initial installation easier and gives you a quick access to your screen saver settings from the menu bar. And starting with version 1.2, you can also run Aerial fullscreen on one monitor while you keep working on the other one! Some generalities, both the screen saver and the Companion app are signed and notarized by/with Apple, as its now required. They are signed with my personal Developer Apple ID (Guillaume Louel). I store a manifest file on GitHub that contains the version number of the latest release, and also the sha256 of the releases. This is generated automatically on my Mac, after Aerial gets notarized for distribution and before I upload a new version on Aerial's releases page. Periodically, Aerial Companion checks the manifest to see if a new version was released. When you decide to perform an update, the following happens:"
