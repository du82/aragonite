["https://aerialscreensaver.github.io/troubleshooting.html"]
title = "Aerial - A free and open-source macOS Screen Saver"
full_description = '''Aerial requires network access (at least once, after that it can work offline) for it to work, and default Little Snitch settings may impair some or all of it's features. Furthermore, while you may be used to Little Snitch asking you to allow or deny a network connexion, they don't seem to do this for screen savers. In Catalina, Aerial (like all third party screensavers) is hosted by legacyScreenSaver.appex. In older macOS versions, it can be hosted either by System Preferences (for the preference pane) or ScreenSaverEngine.app when running fullscreen. This will allow Aerial to use your location to calculate sunset and sunrise times, and if you enabled it, provide your current weather conditions. After playing a video, Aerial is stuck on the last frame for a while and does not go to the next video : Please check that your video contains correct duration information. Some export tools may generate incorrect video files and Aerial will not be able to properly detect the end of the file. To fix your files, you will need to "remux" them using a tool such as Handbrake or MP4Box. Since version 1.4, it's maintained by Guillaume Louel.kofiwidget2.init('Buy me a coffee', '#29abe0', 'A0A32385Y');kofiwidget2.draw(); tvOS, macOS, Apple TV, and Mac are trademarks of Apple Inc., registered in the U.S. and other countries. Icon by Inferno Design'''
