["https://aerialscreensaver.github.io"]
title = "Aerial - A free and open-source Mac Screen Saver"
full_description = "Compatible with macOS 10.12 and later (including Sonoma and Apple Silicon) Version 3.5.2beta4 (December 3, 2024)More installation options Aerial is a macOS screensaver that lets you play videos from Apple's tvOS screensaver. This includes classic Aerial videos shot over various cities and locations (New York, San Francisco, China...), Earth videos from the ISS, and the new underwater videos introduced in tvOS 13. Starting with version 2.0, Aerial also includes videos from 3rd parties that kindly shared them, and you can also now add your own! Aerial is completely free and open source. You can follow its development here on GitHub, and even participate if you want. You don't have to be a developer, we always need help when it comes to translations in various languages, check here for more information (it's easy !). Version 3.2.0+ now offers support for macOS Ventura and its new System Settings. Adventurous users may also want to try the beta version of Aerial Companion that includes a redesigned user interface and needed fixes for Ventura. It can be downloaded here. Also, Josh & Hal released a pack of 31 videos shot over the Ventura region in California. You can see a preview below : Robin Fourcade has kindly shared new videos for everyone to enjoy. He's taking us on a trip around Europe with some breathtaking views shot in Norway and in France around the Mont Blanc. Check out a preview below : To add those videos to Aerial, go check the instructions at the top of the page here. With massive thanks to Robin for sharing those (and for his incredible patience !). Aerial Companion (the app that auto-updates the screensaver) is getting a much needed makeover with a new UI. This is still in beta and the design will likely change a bit, but the goal is to make some more room to add new features. A big improvement is adding controls to what used to be fairly hidden under an experimental menu : the ability to run Aerial as your Wallpaper! And now, you can control it from Companion. On top of being able to Stop and Restart the wallpaper, you can also pause it, skip a video, or even skip and hide the video, right from the UI."
