["https://aerialscreensaver.github.io/faq.html"]
title = "Aerial - A free and open-source macOS Screen Saver"
full_description = '''Aerial Companion was introduced with Aerial 2.0. It's an independent application that allows for additional functionality for Aerial. Built entirely in Swift, the program is agile and doesn't hog a significant amount of memory while performing vital tasks. If you installed Aerial directly from GitHub, you may not have Aerial Companion, but if you installed it through the instructions above, you likely do. The main benefit of using Aerial Companion is that it allows for automatic updates of Aerial in the background. To enable this, please follow the steps below. You can do this in two different ways. Either favorite the videos and then choose to play only your favorites, or limit the selection of videos that you play. When caching is set to manual you will need to download and manage your cache entirely manually. When set to automatic, you can set the size of your cache and Aerial will fill it with the videos you love! Aerial uses Apple's AVFoundation framework to play the videos as your screen saver. When available, AVFoundation will use hardware decoding (from your CPU or your graphics card) to minimize the resources needed for video playback. You can find guidelines in the help button next to the Preferred video format setting. By default, Aerial uses 1080p H.264 videos which is the most compatible format. Please note that all 4K HEVC videos are encoded with the Main10 profile, which may not be hardware accelerated by your machine, while some other HEVC videos (encoded in Main profile) will be. While we wish to provide everyone with the best setting for their machine, the GVA framework from Apple doesn't let us distinguish HEVC Main10 profile acceleration from general HEVC acceleration. Early feedback we gathered also seems to point that on machines with multiple decoding options (Intel QuickSync and AMD UVD), QuickSync will always be preferred (even if you "force" the discrete GPU use with an external monitor or via code, as of macOS Mojave). You can easily check for yourself what to expect by opening a video in Quicktime (Use the Show in Finder option in the Cache tab to find the cached videos). In Activity Monitor, the AV Framework GVA process is called VTDecoderXPCService.'''
