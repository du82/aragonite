Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F0c34c406-3428-43a2-9b18-abdd8359f6d6_what-you-can.do.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=3840&amp;q=75"/>In GeneralAs ArtistsAs CuratorsAs ManufacturersAs RecyclersThere is a lot that you can do – no matter who you are or where you are from. Inform yourself and check out our 'What You Can Do' articles. For different audiences we have set up pages with information regarding painting more sustainable. We share our best tips and tricks and try to provide you with as much useful insights possible. As artist you can learn how to reduce your own impact when you paint. For curators we have a guide to setup a event with a small carbon footprint. Be sure to click on the tab that is relevant for you. Take your time to navigate through our website. We invite you to become part of The Aerosol Alliance movement by sharing your insights with us. Or by signing up for our manifesto, if you haven't done so already. Sign up below! Sign nowSign now'''
