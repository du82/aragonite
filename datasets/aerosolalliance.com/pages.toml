-do-2.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F070ad77e-661a-4fc8-b075-f739885f666a_what-you-can-do-2.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=3840&amp;q=75"/><img alt="Picture of an old spray can" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F50f24898-c229-4196-9ae1-23cf11ee31b3_DSC02197_Mettingen%2B2.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F50f24898-c229-4196-9ae1-23cf11ee31b3_DSC02197_Mettingen%2B2.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F50f24898-c229-4196-9ae1-23cf11ee31b3_DSC02197_Mettingen%2B2.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F50f24898-c229-4196-9ae1-23cf11ee31b3_DSC02197_Mettingen%2B2.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F50f24898-c229-4196-9ae1-23cf11ee31b3_DSC02197_Mettingen%2B2.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F50f24898-c229-4196-9ae1-23cf11ee31b3_DSC02197_Mettingen%2B2.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F50f24898-c229-4196-9ae1-23cf11ee31b3_DSC02197_Mettingen%2B2.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F50f24898-c229-4196-9ae1-23cf11ee31b3_DSC02197_Mettingen%2B2.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F50f24898-c229-4196-9ae1-23cf11ee31b3_DSC02197_Mettingen%2B2.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75"/>As RecyclersIn GeneralAs ArtistsAs CuratorsAs ManufacturersAs RecyclersThe End-of-Life of spray paint cans. What happens to your cans when you finish your piece and dispose of your cans? Read more about this on our Facts page: 'End-of-Life'. What happens with a spray paint can at the end of their life? We have some questions for the recycling companies to answer. Hopefully, they can help out by providing a more clear image on the topic of waste treatment of aerosols and in particular, the graffiti can. 01. Understanding the End-of-Life02. Disposing your cans properly 03. Unanswered questions04. Invitation to recyclers 01. Understanding the End-of-LifeDid you know only 30 percent of all aerosol cans are recycled? A typical soda can in the US has a much higher recycling rate: 50 percent [1]. In Europe, it's around 76 percent for the typical beverage can [2]. Thus, there's a lot of room for improvement for aerosol spray cans. Let's move the needle together and improve the recycling rate of aerosol spray paint cans!02. Disposing your cans properly Do you know what the best option is to get rid of your cans? The best option is to recycle them via the recycling facility, by dropping your cans of at hazardous waste collection. Because aerosol cans containing paint, pesticides, and cleaning products are several examples of materials that may be hazardous when discarded. Typically, aerosol cans use hydrocarbons, such as propane, butane, or LPG gas as the propellant [3]. Hence, most waste aerosol cans that are not empty are ignitable hazardous wastes. Most of us don't clear out our paint cans and thus most cans (if not emptied properly) should be taken to hazardous waste collection. 03. Unanswered questionsThere are still questions that are left unanswered. We hope to be able to answer them in the near future. Here are a few of them. How bad is it if spray cans end up at landfills compared to incineration? What are the benefits of recycling a spray paint can? What happens if you leave spray cans in nature? How long does it take to decay? 04. Invitation to recyclers We want to invite recyclers to share more information about the recycling steps and useful resources that are obtained from recycling spray paint cans. We know that recycling possibilities differ per country and region. This makes the problem of managing the aerosol waste complex. We invite recyclers to share their experience with us and we will inform our fellow allies! ReferencesRecyclingInternational.comPackagingInsights.comhttps://dtsc.ca.gov/aerosol-can-waste-management/<img alt="Picture of trash" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Feed1563e-5031-42ee-9bba-b01d2728e1f3_Rectangle%2B766.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Feed1563e-5031-42ee-9bba-b01d2728e1f3_Rectangle%2B766.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Feed1563e-5031-42ee-9bba-b01d2728e1f3_Rectangle%2B766.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75"/><img alt="Picture of trash" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Ff61f86d3-d676-4c48-a829-6374793bf21c_Rectangle%2B777.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Ff61f86d3-d676-4c48-a829-6374793bf21c_Rectangle%2B777.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Ff61f86d3-d676-4c48-a829-6374793bf21c_Rectangle%2B777.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75"/>'''
