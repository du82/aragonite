L%2BALLIANCE.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fe41e5558-9a69-4e23-99ff-ebc8a465f934_AEROSOL%2BALLIANCE.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=3840&amp;q=75"/>Privacy PolicyNo Cookie BannerWe don't need any cookies because we don't store any user information. Signing the manifestoWhen you sign our manifesto, you allow us to store the data you give us. These are, at the minimum, your name, e-mail address and location. We store this data in a secure place on a EU server and don't hand it off to anyone else.Friendly CaptchaTo protect our manifesto sign up form against spam and bots, we use friendly captcha. Friendly captcha is GDPR compliant as it does not store personal information. It also does not use any cookies, so our users privacy is highly valued. Learn more about privacy and friendly captcha over here: https://friendlycaptcha.com/privacy/gdpr/Plausible TrackingWe use plausible to get a few insights on trends about the usage of the site. Plausible is also absolutely GDPR compliant. It does not track people across their devices and across websites and apps that they visit. All the data is isolated to a single day, single website and single device only. There is no way to know whether the same person visits a site from more than one device or visits another website.Learn more about plausibles privacy policy over here: https://plausible.io/data-policy'''
