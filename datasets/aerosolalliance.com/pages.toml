%2Cformat%26h%3D60%26dpr%3D2&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F532fa00f-1118-47b2-a26d-4f4e5a7c828a_togetherfor-04.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=3840&amp;q=75"/><img alt="A picture of empty spray cans" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F574e43f1-91a2-43c8-9e1f-e85a39aa7549_BILD.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F574e43f1-91a2-43c8-9e1f-e85a39aa7549_BILD.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F574e43f1-91a2-43c8-9e1f-e85a39aa7549_BILD.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F574e43f1-91a2-43c8-9e1f-e85a39aa7549_BILD.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F574e43f1-91a2-43c8-9e1f-e85a39aa7549_BILD.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F574e43f1-91a2-43c8-9e1f-e85a39aa7549_BILD.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F574e43f1-91a2-43c8-9e1f-e85a39aa7549_BILD.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F574e43f1-91a2-43c8-9e1f-e85a39aa7549_BILD.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F574e43f1-91a2-43c8-9e1f-e85a39aa7549_BILD.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75"/>Welcome to The Aerosol Alliance website! We have established this non-profit with the main goal: to reduce the negative impact of spray paint and cans. Below you will find the Aerosol Alliance Manifesto. To address spray paint manufactures and make the next steps towards a more sustainable spray paint industry. Be part of our movement by signing ✎ the manifesto and let's shake up our scene!01. ManifestoThe spray can is deeply rooted in the graffiti and street art subcultures. Spray paint products have made it possible for artists across the globe to bring their ideas to life and bring color to our cities. However, we see our responsibility for the effects spray paint products have on the environment. As artists and creatives, we are aware that our planet needs help and we must ensure that we do what we can to limit our negative impact.There is a lack of knowledge and transparency around the environmental footprint of spray paint and the material make up of this product. From the UK, Germany to the US we still are not able to find a recycling center that will successfully recycle the spray can. This brings us to the realization that we need to address the environmental impact across the entire life cycle of a spray can and all issues including recycling. We, the artists and the manufacturers, need to come together to research and discuss solutions to limit the impact that these products have on the environment. As artists, as creatives and as people passionate about our planet, we need to work together to find a more sustainable way of doing what we love.Dear manufacturers, we've loved using your products for decades, we collaborated on numerous projects, and we share the common interest not to destroy the world we live in. We need to open up a direct and transparent dialogue on how to find solutions to make spray paint more sustainable. Sign the Manifesto!Sign the 