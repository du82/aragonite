full_description = '''ManifestoWhat you can doAs ArtistsAs CuratorsAs Manufacturersas recyclersFactsImpactProductionUseEnd-of-LifeSubmit IdeasAbout usSupportResources<img alt="what-you-can-do-white.svg" loading="lazy" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fab38a2f6-1394-4cfc-ad91-81c8145881e0_what-you-can-do-white.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fab38a2f6-1394-4cfc-ad91-81c8145881e0_what-you-can-do-white.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fab38a2f6-1394-4cfc-ad91-81c8145881e0_what-you-can-do-white.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fab38a2f6-1394-4cfc-ad91-81c8145881e0_what-you-can-do-white.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fab38a2f6-1394-4cfc-ad91-81c8145881e0_what-you-can-do-white.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fab38a2f6-1394-4cfc-ad91-81c8145881e0_what-you-can-do-white.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fab38a2f6-1394-4cfc-ad91-81c8145881e0_what-you-can-do-white.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fab38a2f6-1394-4cfc-ad91-81c8145881e0_what-you-can-do-white.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fab38a2f6-1394-4cfc-ad91-81c8145881e0_what-you-can-do-white.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=3840&amp;q=75"/><img alt="Image of spray can" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F269cf1b5-5735-45b5-9121-ae1f84ef26e0_shutterstock-456132178%2B1.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F269cf1b5-5735-45b5-9121-ae1f84ef26e0_shutterstock-456132178%2B1.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F269cf1b5-5735-45b5-9121-ae1f84ef26e0_shutterstock-456132178%2B1.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F269cf1b5-5735-45b5-9121-ae1f84ef26e0_shutterstock-456132178%2B1.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F269cf1b5-5735-45b5-9121-ae1f84ef26e0_shutterstock-456132178%2B1.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F269cf1b5-5735-45b5-9121-ae1f84ef26e0_shutterstock-456132178%2B1.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F269cf1b5-5735-45b5-9121-ae1f84ef26e0_shutterstock-456132178%2B1.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F269cf1b5-5735-45b5-9121-ae1f84ef26e0_shutterstock-456132178%2B1.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F269cf1b5-5735-45b5-9121-ae1f84ef26e0_shutterstock-456132178%2B1.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75"/>As ManufacturersIn GeneralAs ArtistsAs CuratorsAs ManufacturersAs recyclersWe aim to collaborate with manufacturers of spray paint products. To help them with providing our insights and knowledge regarding measuring the environmental impact of spray paint products and communicating their effort to their customers. As producing companies spray paint manufacturers have the knowledge, resources and power to implement new solutions. Here are some basic steps that manufacturers can take to contribute to the overall aim of The Aerosol Alliance movement: reducing the environmental and health impact of spray paint. 01. Measure your product's impact02. Share insights03. Innovate with sustainable products01. Measure your product's impactWe know that manufacturers have the biggest influence on the overall environmental footprint of graffiti spray paint cans. The largest contribution to the impact of spray cans is coming from production and raw material usage. Researching and developing more sustainable products will become a significant challenge for the upcoming years. Therefore, measuring the impact by using Life Cycle Assessment (LCA), is the first actionable step that can help to find specific hotspots in your product and supply chain. We want to collaborate with the spray paint industry, to find solutions and drastically reduce the impact of spray cans and paint. Read how we measured the impact of spray paint on our page: Facts - Impact. Get inspired to discover the impact of your products. We can support you to do this too with our consultancy services! 02. Share insightsIt will become increasingly relevant to share information on the environmental performance of your products. Either in business-to-business or in business-to-consumer communication. European legislation like CSRD, Green Claims and Ecodesign Directive becomes major drivers to retrieve, gather and analyze environmental data on a product-level. We believe that - as manufacturing companies - it is better to stay ahead of upcoming legislation.Your most important stakeholders are those who purchase and use your product. Besides the quality of the paint, can-control and costs, sustainability aspect (such as a carbon footprint) will become pertinent to specify. The latter will allow artists and other spray paint user to make a conscious decision. Enabling spray paint user to choose which spray graffiti paint or more general spray paint they would like to use to make great art. Subsequently, allowing the artist to limit the environmental impact of their art work. TIP: If you have a sustainability report or a Product Footprint (LCA) available of spray paint, it is crucial to share the insights with your audience. 03. Innovate with sustainable productsAll in all, it is time to start developing more sustainable products. Let's join forces and find ways to improve your products. We represent a large community of users of the products that you produce. We long for better and more environmentally friendly products. And are willing to contribute to make this process of developing better spray cans a little easier. Get in touch and find out how The Aerosol Alliance can help with measuring your product's footprint. Please send your business inquires to: info@aerosolalliance.com.'''
