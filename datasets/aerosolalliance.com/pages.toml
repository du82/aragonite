-do-2.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F070ad77e-661a-4fc8-b075-f739885f666a_what-you-can-do-2.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=3840&amp;q=75"/><img alt="Baker oner" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F251c26e0-ff50-4e8b-b576-50d47ce0b41e_Bakerone-2.jpeg%3Fauto%3Dformat%252Ccompress%26rect%3D469%252C0%252C1195%252C1195%26w%3D995%26h%3D995&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F251c26e0-ff50-4e8b-b576-50d47ce0b41e_Bakerone-2.jpeg%3Fauto%3Dformat%252Ccompress%26rect%3D469%252C0%252C1195%252C1195%26w%3D995%26h%3D995&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F251c26e0-ff50-4e8b-b576-50d47ce0b41e_Bakerone-2.jpeg%3Fauto%3Dformat%252Ccompress%26rect%3D469%252C0%252C1195%252C1195%26w%3D995%26h%3D995&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F251c26e0-ff50-4e8b-b576-50d47ce0b41e_Bakerone-2.jpeg%3Fauto%3Dformat%252Ccompress%26rect%3D469%252C0%252C1195%252C1195%26w%3D995%26h%3D995&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F251c26e0-ff50-4e8b-b576-50d47ce0b41e_Bakerone-2.jpeg%3Fauto%3Dformat%252Ccompress%26rect%3D469%252C0%252C1195%252C1195%26w%3D995%26h%3D995&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F251c26e0-ff50-4e8b-b576-50d47ce0b41e_Bakerone-2.jpeg%3Fauto%3Dformat%252Ccompress%26rect%3D469%252C0%252C1195%252C1195%26w%3D995%26h%3D995&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F251c26e0-ff50-4e8b-b576-50d47ce0b41e_Bakerone-2.jpeg%3Fauto%3Dformat%252Ccompress%26rect%3D469%252C0%252C1195%252C1195%26w%3D995%26h%3D995&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F251c26e0-ff50-4e8b-b576-50d47ce0b41e_Bakerone-2.jpeg%3Fauto%3Dformat%252Ccompress%26rect%3D469%252C0%252C1195%252C1195%26w%3D995%26h%3D995&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F251c26e0-ff50-4e8b-b576-50d47ce0b41e_Bakerone-2.jpeg%3Fauto%3Dformat%252Ccompress%26rect%3D469%252C0%252C1195%252C1195%26w%3D995%26h%3D995&amp;w=3840&amp;q=75"/>As ArtistsIn GeneralAs ArtistsAs Curatorsas manufacturersas recyclersAs artists and creatives, we need to come together as a community and work together. There is a lot that you can do – no matter who you are or where you are. Here are three tips on what you can do. Interested in green graffiti? Spray painting with less impact? This page will guide you how to paint greener. 01. Dispose of your spray cans properly02. Use bucket paint or latex03. Try out water-based paint4. Use second hand paintConclusion 01. Dispose of your spray cans properlyWe all know how hard it can be sometimes: recycling. But it is one of the most crucial steps you can take as an artist. Fulfilling this duty makes you a true ally of the Aerosol Alliance: disposing of your waste at the right place. Taking your cans to the recycling facility is the best option. Your local recycler will either send the spray to ‘chemical waste’ or ‘recycle the cans directly’ or ‘incinerate’ them. This is dependent on the situation of how the local waste program treats spray paint on a municipal level. More technologically advanced nations and countries will have the capacity and technology to recycle cans properly. “Empty aerosol spray cans from paint, hair spray, shaving cream and cooking spray can be recycled in most local recycling programs. Aerosol spray cans that are full or partly full must be dropped off at a hazardous waste location.” [1] Tips for recycling Taking your cans home and bringing them to the waste treatment facility is the best option. If there is no other alternative or option, make sure to dispose of your spray cans and caps in a trash bin. This is the second-best option. If possible put your dirty caps in the plastic recycling bin. We have found some great additional tips via Recycle Coach. Please read their “5 Tips on how to recycle aerosol cans.” Avoid dumping your cans!By all means, avoid disposing or dumping your spray cans in nature. Leaving them on the spot is obviously not smart. But also polluting! It will leave the metal cans to rust and over time they can start leaking, emitting remaining fumes and other emissions during the process. Paint remains leaking into nature will have a toxicological effect on the environment [2,3].02. Use bucket paint or latexThe environmental impact of ‘regular’ latex or bucket paint is significantly lower compared to spray paint. We hope that all paint suppliers will be able to provide more accurate numbers in the future. However, we don’t need the exact figures now to know that there’s a big difference between the environmental impact of (acrylic) spray paint and latex. It has been mentioned often as the key difference between oil-based and acrylic or solvent-based paints. The amount of VOCs that are released by water-based latex paint during drying and application is considerably smaller compared to spray paint. So the next time you are doing a full-color burner. Why not try and make a multi-color latex filling instead of using only spray paint? [4,5] For larger murals using latex also helps to cover more area of the wall, while using less paint. All in all saving a lot of material usage. Not only are you doing less harm to the environment... It is good for your wallet too! 03. Try out water-based paintYou might know this already but similar to latex paint there are also water-based spray paints available. In general, they are more expensive compared to regular spray paint and not all spray paint manufacturers have them in their product portfolio. However, they are significantly better for the environment. This has two main reasons:They produce low amounts or zero VOC emissions during the use phase. Water-based paint do not use chemical solvents (which are mostly fossil-based), because the solvent in water-based paint is? Yes, exactly simply water.Our advice: the newer types of spray paints which are water-based, release limited or zero harmful VOC emissions compared to acrylic or oil based spray paint. Try out water-based paint if you can. 4. Use second hand paintAnother cheap and environmentally friendly way of painting is to buy paint second hand. A lot of local paint and hardware stores give discounts on paints that were mixed up wrong. The customer might find the color off, however the store can't sell the mixed paint anymore, discounts of 50 to 80% are common. Old stocks at the hardware store are sometimes also discounted heavily. In addition, thrift shops might also have a designated section for second hand paint. The most affordable option is free! Free paint sound like a dream, right? Well in some countries (e.g. in The Netherlands) people ditch their used paint on the streets when bulky waste is about to be picked up by the municipality. Highest chances on finding a nice bucket on the curb is during holidays and season changes. When people are more keen to redecorate their house.In multiple countries, states and municipalities the recycling facilities are also enabling leftover paint to be picked up at their facility. Some examples are: PaintShare in Canada or Community Repaint in the UK. Conclusion So, the next time you go out and paint. Consider these three options: Dispose of your cans properlyUse bucket paint or latexTry out water-based paint.Use second hand paintWe don’t promote any products or brands. We want to provide you with tips to paint more environmentally conscious and safely. ReferencesWe are always curious for better references, preferably scientific papers that support the arguments we pose. Have you read a cool and useful article? Share it with us :)RecycleCoach.comEnvironmentblog.netWikiPediaFreelandpainting.comStencilarchive.org<img alt="Picture of a spray painting on a wall" loading="lazy" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fc06ce9b4-678e-4b9c-a097-b0c6b7be694c_Rectangle%2B78.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fc06ce9b4-678e-4b9c-a097-b0c6b7be694c_Rectangle%2B78.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fc06ce9b4-678e-4b9c-a097-b0c6b7be694c_Rectangle%2B78.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fc06ce9b4-678e-4b9c-a097-b0c6b7be694c_Rectangle%2B78.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fc06ce9b4-678e-4b9c-a097-b0c6b7be694c_Rectangle%2B78.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fc06ce9b4-678e-4b9c-a097-b0c6b7be694c_Rectangle%2B78.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fc06ce9b4-678e-4b9c-a097-b0c6b7be694c_Rectangle%2B78.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fc06ce9b4-678e-4b9c-a097-b0c6b7be694c_Rectangle%2B78.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2Fc06ce9b4-678e-4b9c-a097-b0c6b7be694c_Rectangle%2B78.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75"/>'''
