Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F13ad99bd-93e3-49cd-af56-ea38b3434c8d_why-support-us-mobile.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2F13ad99bd-93e3-49cd-af56-ea38b3434c8d_why-support-us-mobile.svg%3Fauto%3Dcompress%2Cformat%26h%3D60%26dpr%3D2&amp;w=3840&amp;q=75"/>You can support our endeavor to make the spray paint industry more sustainable. There are multiple ways to do this. Check them out!01. Make a donation! 02. How to submit a donation01. Make a donation! We are a non-profit organization that benefits from the support in the form of donations, as we work on a voluntary basis but we do have running costs. In addition, we want to promote our initiative to a broader audience. Therefore, support in the form of a donation is more than welcome! Here's what we can do with it:Keeping this platform alive!Do the research and find relevant information from manufacturers, artists, researchers and other players in our field that know more about sustainable ways of spray painting.Visit congresses and conventions to stay in contact with the manufacturers and affiliated organizations. Partnering with industry associations to lobby for sustainable spray paint.Promote our initiative by creating a (video) marketing campaign on several social media platforms.02. How to submit a donationHelp us out via a donation. If you would like to donate and support The Aerosol Alliance. Feel free and use the 'Support us' button below. It will open a new tab and navigate your to our donation module. Bear in mind that you can switch to your preferred language. Any size of a donation will enable us to keep this website and our Instagram live and to continue the development of more content and information for Allies of The Aerosol Alliance. Support usSupport us03. Create a shout out04. Stating your name03. Create a shout outSupport us with a creative shout out. Are you making a piece or a mural and want to support us? Incorporated our name: 'The Aerosol Alliance' in your art work. Make a photo! Share it on Instagram using #aerosolalliance and we will include your work on our Instagram page. 04. Stating your nameYou can join The Aerosol Alliance and our allies. Did you check out our current supporters on the home page? Dope, right?Drop your own photo and empowering sustainability quote. We will embed it on the homepage of this website. Submit your quote by using the following Online Form. Don't worry it is safe! The software we use for this feature is GDPR compliant.'''
