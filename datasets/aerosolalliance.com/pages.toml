o%3Dcompress%2Cformat&amp;w=3840&amp;q=75"/>The Aerosol Alliance is a group of graffiti artists, environmental specialists, festival organizers and curators that have a passion for the use of spray cans. At the same time we are worried about the negative impact that the use of a spray can has on our environment and on our health. Our goal is to reduce this impact and create awareness in the spray paint industry. We want to share knowledge using this website and via Instagram. We believe impact is made in numbers and that change is needed. Have a look on our website to learn more about our movement. We consider people that have signed our Manifesto as an ally. Individuals that supports the goals of our non-profit. So don't wait! Become our ally and join The Aerosol Alliance movement by signing our Manifesto. <img loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2FZeyQpXUurf2G3Ob5_IMG_4172-mugshot.JPG%3Fauto%3Dformat%252Ccompress%26rect%3D116%252C0%252C3143%252C3143%26w%3D497%26h%3D497&amp;w=640&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2FZeyQpXUurf2G3Ob5_IMG_4172-mugshot.JPG%3Fauto%3Dformat%252Ccompress%26rect%3D116%252C0%252C3143%252C3143%26w%3D497%26h%3D497&amp;w=1080&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Faerosolalliance%2FZeyQpXUurf2G3Ob5_IMG_4172-mugshot.JPG%3Fauto%3Dformat%252Ccompress%26rect%3D116%252C0%252C3143%252C3143%26w%3D497%26h%3D497&amp;w=1080&amp;q=75"/>LUC HILLEGEFounder of The Aerosol AllianceArtist & Environmental specialist, Netherlands<img loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:aut