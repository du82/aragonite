title = "Accessibility | The Australian Financial Review | AFR"
full_description = "The World Wide Web Consortium (W3C) has released the Web Content Accessibility Guidelines (WCAG). These guidelines presently comprise the international standard for web accessibility. There are three levels of levels of conformance (A, AA and AAA).The Australian Financial Review recognises the importance of providing web accessible content to all users and it is our aim to meet conformance level AA for all content published on our network. We test our sites in the browsers most of our visitors use. The current release for the WCAG is version 2.0.This page is intended to provide tips and useful information to assist users with disabilities to access the Financial Review's website.How to use our accessibility featuresPage structureMost pages are structured with clear hierarchy and meaningful HTML code to better enable the use of screen readers and to help assistive devices understand and process the content.Using the keyboardPressing the Tab key after a page has loaded provides skip links to the main navigation, content area and footer. Most clickable elements are outlined when you access them using the Tab key.We do not define any access keys as assistive devices already define many key combinations. We want to avoid access keys interfering with such key combinations.Explaining contentOur editors strive to add descriptions to images and visual elements for when you use a screen reader or have images turned off.ContrastThe contrast ratio may vary slightly when text is sitting on top of images, but we generally try to ensure there is enough contrast between text and its background colour as per WCAG recommendations.Interactive componentsIf interactive content is partly hidden, as with tabs or popup elements, all content will be shown if you disable interactivity, for example by turning off Javascript.Enlarging the pageYou can enlarge the page using your browser. 'Ctrl' and '+' on PCs and 'Command' and '+' on Macs will zoom into the page. 'Ctrl' and '-' on PCs and 'Command' and '-' on Macs will zoom out.Known barriersNot every page on our network will have the accessibility features we strive to offer. This is because it takes time to improve our entire network and help third parties comply with the W3C guidelines.For example, some pages of our websites use video or audio. We are currently seeking a viable accessibility option for this content, but in the meantime please contact us if you require assistance with particular content.We are working with our partners and suppliers of externally created content to improve their level of accessible content. This will improve with changing technology and updating of our digital network.It is the Financial Review's policy to require any third party software developers (who assist us with the building and maintenance of our digital network) to comply with the W3C guidelines. An exception to this policy would be where compliance with this standard would cause the Financial Review or the developer an unjustifiable hardship.Customer Support13 66 66(Int. +61 2 7966 6900)Mon - Fri 7:30am - 5:30pmSat - Sun 7:30am - 10:30am AESTVisit the Help Centre FeedbackHelp us understand what's working and where we could improve by providing feedback here.FAQsYour questions may already have answers. Have a look at our FAQs.AdvertiseVisit Nine for Brands for ad specs and audience insights."
