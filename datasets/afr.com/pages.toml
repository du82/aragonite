["https://afr.com/about-us/timeline"]
title = "AFR 70 years: The rise of modern Australia"
description = "Since 1951, The Australian Financial Review has told the story of Australian business, politics and society. Our timeline charts the rise of modern Australia."
full_description = "For seven decades, The Australian Financial Review has tracked the booms, the busts, the empire-builders, the fraudsters and the disruptors to tell the story of the rise of modern Australia. We have written the first draft of the history of business and the nation since 1951, chronicling the contribution of enterprise to the prosperous and successful Australia of 2021. Our timeline shows that modern Australia, share-owning, aspirational and multicultural Australia, rewards those with enterprise, welcomes new ideas and is keen to exploit our place in the world. The Australia of 1951 was a nation of 8 million people, overwhelmingly with an Anglo-Celtic heritage, inhabiting an island continent at the foot of Asia. The country was supported by a giant flock of 120 million sheep and rural goods accounted for 85 per cent of the country’s earnings. The ’50s marked the start of the two-decade “golden age”, where real GDP grew by more than 4 per cent a year with inflation about 3 per cent and unemployment under 2 per cent. August 16, 1951 — The Australian Financial Review was born in response to a competitive threat after publisher John Fairfax got wind of a rival’s plan to launch a weekly Financial Times. The new national business paper started as a 28-page tabloid that published every Thursday with a cover price of one shilling, 15¢. “We want it to become a forum for the expression of opinion about the subjects with which it deals,” the front page declared. “Too often those in power take decisions without a full appreciation of the viewpoint of those whom those decisions will most vitally affect.” September 1, 1951 — Australia signed the ANZUS treaty with America to put its people under the security umbrella of the world’s new superpower. Since the end of World War II, Pax Americana in the Asia-Pacific region provided the security framework for one of the greatest eras of economic development. October 1, 1951 — The ANZ Bank was created from the merger of two heritage companies. In 1959, the Reserve Bank was created and took over the central banking functions of the government-owned Commonwealth Bank. The RBA, which started operations on January 14, 1960, got a new board including a governor, deputy governor and the secretary to the Treasury, a structure that still exists today."
year_published = 1990
year_updated = 2006
