title = "About Us | Editorial Team | The Australian Financial Review | AFR"
description = "Meet our editorial team delivering authoritative and agenda setting news and analysis. Find out more here."
full_description = "James ChessellEditor-in-ChiefJames Chessell is the Editor-in-Chief of The Australian Financial Review. He is the former Executive editor of The Sydney Morning Herald and The Age, and a former Business editor and Europe correspondent at the AFR. Connect with James on Twitter. Email James at james.chessell@afr.comCosima MarrinerEditorCosima Marriner is the Editor. She was previously Managing editor of the AFR. Also former Deputy editor at The Sydney Morning Herald, and a former editor of The Sun-Herald. Email Cosima at cmarriner@afr.comMichael StutchburyEditor-at-largeMichael Stutchbury is editor-at-large. He is in his fourth decade of writing for and editing national newspapers. After nearly six years as editor of The Australian, he returned to the Financial Review as editor-in-chief (2011-2024). Email Michael at mstutchbury@afr.comJessica GardnerDeputy editor - NewsJessica Gardner is Deputy editor - News. She has previously edited the Companies and Markets section. Connect with Jessica on Twitter. Email Jessica at jgardner@afr.comKylar LoussikianDeputy editor – businessKylar Loussikian is the Financial Review’s deputy editor – business. Email Kylar at kloussikian@afr.comAndrew BurkeAFR Weekend editorAndrew Burke is the editor of AFR Weekend, based in the Sydney newsroom. He has worked at the Financial Times in London, the South China Morning Post in Hong Kong and reported from across Asia and the Middle East. Connect with Andrew on Twitter. Email Andrew at aburke@afr.comFiona BuffiniPremium Content, Features EditorFiona Buffini is editor of Premium Content and Features. She is the former Editor of The Australian Financial Review, digital editor and news director. Email Fiona at fbuffini@afr.comPhillip CooreyPolitical editorPhillip Coorey is the political editor based in Canberra. He is a two-time winner of the Paul Lyneham award for press gallery excellence. Connect with Phillip on Facebook and Twitter. Email Phillip at pcoorey@afr.comJohn KehoeEconomics editorJohn Kehoe is economics editor at Parliament House, Canberra. He writes on economics, politics and business. John was Washington correspondent covering Donald Trump’s first election. He joined the Financial Review in 2008 from Treasury. Connect with John on Twitter. Email John at jkehoe@afr.comJames ThomsonColumnistJames Thomson is senior Chanticleer columnist based in Melbourne. He was the Companies editor and editor of BRW Magazine. Connect with James on Twitter. Email James at j.thomson@afr.comAnthony MacdonaldColumnistAnthony Macdonald is a Chanticleer columnist. He is a former Street Talk co-editor and has 10 years' experience as a business journalist and worked at PwC, auditing and advising financial services companies. Connect with Anthony on Twitter. Email Anthony at a.macdonald@afr.comSarah ThompsonStreet Talk editorSarah Thompson has co-edited Street Talk since 2009, specialising in private equity, investment banking, M&A and equity capital markets stories. Prior to that, she spent 10 years in London as a markets and M&A reporter at Bloomberg and Dow Jones. Email Sarah at sarah.thompson@afr.comVesna PoljakCompanies editorVesna Poljak is the Companies editor. She was previously the Markets editor with a special interest in the investment industry, hedge funds and accounting. She is based in the Sydney newsroom. Connect with Vesna on Twitter. Email Vesna at vpoljak@afr.comMatthew DrummondAFR Magazine editorMatthew Drummond edits AFR Magazine, our premium monthly inserted magazine that covers business, politics, fashion, design, food and wine, and is home to the Rich List, Young Rich List and the Power lists. Connect with Matthew on Twitter. Email Matthew at matthew.drummond@afr.com.auMyriam RobinSenior writerMyriam Robin is a senior writer based in the Melbourne newsroom. She has previously been a Rear Window columnist and editor, and before that reported on financial markets and media. Connect with Myriam on Twitter. Email Myriam at myriam.robin@afr.comMark Di StefanoColumnistMark Di Stefano is Rear Window columnist, based in the Sydney newsroom. He previously worked at BuzzFeed, the Financial Times and The Information before joining the Financial Review as a media and tech correspondent. Connect with Mark on Twitter. Email Mark at mark.distefano@afr.comSally PattenBOSS editorSally Patten edits BOSS, and writes about workplace issues. She was the financial services editor and personal finance editor of the AFR, The Age and the Sydney Morning Herald. She edited business news for The Times of London. Connect with Sally on Twitter. Email Sally at spatten@afr.comAlana PiperDirector, AFR VenturesAlana Piper is The Australian Financial Review's director of ventures, with responsibility for the AFR Live, AFR Lists, AFR Insights, AFR Focus and AFR Intelligence businesses. She also writes on science, education and culture.James Daggar-NicksonDirector, AFR VenturesJames is the Director of AFR Ventures. Connect with James on Twitter. Email James at james.daggar-nickson@afr.comMary-Ellen HepworthHead of productionMary-Ellen Hepworth is The Australian Financial Review's Head of Production and a former restaurant reviewer for The Canberra Times and The South China Morning Post. Email Mary-Ellen at maryellen.hepworth@afr.com.auDaniel AdamsPhoto editorDaniel Adams is Photo Editor for The Australian Financial Review.Joanna MatherWealth editorJoanna Mather joined the AFR as an education reporter in 2008. She spent four years in the Canberra press gallery before becoming superannuation reporter in 2016, deputy news director in 2021 and wealth editor in 2023. Connect with Joanna on Twitter. Email Joanna at jmather@afr.comJacob GreberSenior correspondentJacob Greber writes about politics, economics and business from Canberra. He has been a Washington correspondent and economics correspondent. Connect with Jacob on Twitter. Email Jacob at jgreber@afr.comMark MulliganWorld editorMark Mulligan is the world editor and a former markets and economics writer. He was a Financial Times correspondent. Connect with Mark on Twitter. Email Mark at mark.mulligan@afr.com.auHans van LeeuwenEurope correspondentHans van Leeuwen covers British and European politics, economics and business from London. He has worked as a reporter, editor and policy adviser in Sydney, Canberra, Hanoi and London. Connect with Hans on Twitter. Email Hans at hans.vanleeuwen@afr.com Michael SmithHealth editorMichael Smith is the health editor for The Australian Financial Review. He is based in Sydney. Connect with Michael on Twitter. Email Michael at michael.smith@afr.comMatthew CranstonUnited States correspondentMatthew Cranston is the United States correspondent, based in Washington. He was previously the Economics correspondent and Property editor. Connect with Matthew on Twitter. Email Matthew at mcranston@afr.comAndrew TillettForeign affairs, defence correspondentAndrew Tillett writes on politics, foreign affairs, defence and security from the Canberra press gallery. Connect with Andrew on Facebook and Twitter. Email Andrew at andrew.tillett@afr.comTom McIlroyCanberra Bureau ChiefTom McIlroy is the Financial Review’s Canberra bureau chief based in the press gallery at Parliament House. He was previously the AFR’s political correspondent. Connect with Tom on Twitter. Email Tom at thomas.mcilroy@afr.comAngela Macdonald-SmithSenior resources writerAngela Macdonald-Smith writes on the resources industry with a focus on energy, including gas, oil, electricity and renewables. Connect with Angela on Twitter. Email Angela at amacdonald-smith@afr.comPeter KerResources reporterPeter Ker covers resource companies for The Australian Financial Review, based in Melbourne. Connect with Peter on Twitter. Email Peter at pker@afr.comJames EyersSenior ReporterJames Eyers writes on banking, payments and fintech. He is a former legal and investment banking editor at the AFR, has degrees in commerce and law from UNSW, and is co-author of Buy now, pay later: The extraordinary story of Afterpay Connect with James on Twitter. Email James at jeyers@afr.com.auDavid RoweCartoonistDavid Rowe is the Walkley award-winning cartoonist for the Financial Review. Connect with David on Twitter. Email David at drowe@afr.comKevin ChinneryOpinion editorKevin Chinnery is the opinion editor and an editorial leader writer. He covered trade and industry across the Asia-Pacific region from Singapore and Hong Kong, and is a former editor of BRW magazine. Connect with Kevin on Twitter. Email Kevin at kchinnery@afr.comJeremy SammutAssociate Editor - Opinion. Leader Writer.Jeremy Sammut has a PhD in Australian political history and was formerly a senior researcher at the Centre for Independent Studies where he specialised in health and social policy. Email Jeremy at jeremy.sammut@afr.comKaren MaleyColumnistKaren Maley writes on banking and finance, specialising in financial services, private equity and investment banking. Karen is based in Sydney. Connect with Karen on Twitter. Email Karen at karen.maley@afr.comJennifer HewettColumnistJennifer Hewett is the national affairs columnist. She writes a daily column on politics, business and the economy. Connect with Jennifer on Twitter. Email Jennifer at jennifer.hewett@afr.comEdmund TadrosProfessional services editorEdmund Tadros leads our coverage of the professional services sector. He is based in our Sydney newsroom. Connect with Edmund on Twitter. Email Edmund at edmundtadros@afr.com.auMichael PellyLegal editorMichael Pelly is the legal editor, based in our Sydney newsroom. He has been a senior adviser to federal and state attorneys-general and written two books, one a biography of former High Court Chief Justice Murray Gleeson. Email Michael at michael.pelly@afr.comNick LenaghanProperty editorNick Lenaghan edits the property section, which covers all aspects, from residential real estate and housing and construction to commercial property – office, retail, industrial – and major ASX-listed developers and real estate investment trusts. Connect with Nick on Twitter. Email Nick at nlenaghan@afr.comMichael BaileyArts & Culture editorMichael Bailey writes on arts and culture, and edits Weekend Fin. He is a former editor of the Financial Review Rich List. He is based in Sydney. Connect with Michael on Twitter. Email Michael at m.bailey@nine.com.auYolanda RedrupRich List editorYolanda Redrup is the editor of the AFR Rich List. She previously reported on technology, healthcare and Street Talk. Connect with Yolanda on Twitter. Email Yolanda at yolanda.redrup@afr.comPaul SmithTechnology editorPaul Smith edits the technology coverage and has been a leading writer on the sector for 20 years. He covers big tech, business use of tech, the fast-growing Australian tech industry and start-ups, telecommunications and national innovation policy. Connect with Paul on Twitter. Email Paul at psmith@afr.comPatrick DurkinBOSS Deputy editorPatrick Durkin is Melbourne bureau chief and BOSS deputy editor. He writes on news, business and leadership. Connect with Patrick on Twitter. Email Patrick at pdurkin@afr.comCharis PerkinsLife & Leisure editorCharis Perkins edits The Australian Financial Review's weekly lifestyle liftout, covering the arts, fashion, design, travel, wine, fine dining, sports, motoring and more. Life & Leisure is published online and in the Friday and weekend editions. Email Charis at cperkins@afr.comEditorial FeedbackSubmit a story Letters to the editor FeedbackHelp us understand what's working and where we could improve by providing feedback here.FAQsYour questions may already have answers. Have a look at our FAQs.CareersFor the latest job openings go to our Careers Site or visit us on LinkedIn.AdvertiseVisit Nine for Brands for ad specs and audience insights."
