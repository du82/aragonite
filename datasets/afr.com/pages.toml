full_description = '{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","item":{"@id":"https://www.afr.com/companies","name":"Companies"},"position":1},{"@type":"ListItem","item":{"@id":"https://www.afr.com/companies/financial-services","name":"Financial Services"},"position":2}]}OpinionCompaniesFinancial ServicesSuper warsBig super goes all-in on Trump’s economic agendaThe super machine started by Paul Keating 40 years ago is set to bet more of Australian workers’ retirement incomes on Trump’s low-tax, smaller-government. Made-in-America master plan.Jim Chalmers visited to Washington this week offering “trillions” of dollars of union-commanded superannuation money. BETHANY RAEMichael StutchburyEditor-at-largeFeb 28, 2025 – 4.40pmSaveLog in or Subscribe to save articleShareCopy linkCopiedEmailLinkedInTwitterFacebookCopy linkCopiedShare via...Gift this articleSubscribe to gift this articleGift 5 articles to anyone you choose each month when you subscribe.Subscribe nowAlready a subscriber? LoginJust about anything can happen in Trump’s world. Jim Chalmers visited Washington this week offering “trillions” of dollars of union-commanded superannuation money as part of a push to shield Australia’s steel and aluminium exports from Donald Trump’s protectionist tariff war.Money changes everything. Chalmers and his big-super caravan convinced Trump’s new US Treasury Secretary Scott Bessent to praise Australia’s “fantastic” $4 trillion compulsory superannuation system.Loading...SaveLog in or Subscribe to save articleShareCopy linkCopiedEmailLinkedInTwitterFacebookCopy linkCopiedShare via...Gift this articleSubscribe to gift this articleGift 5 articles to anyone you choose each month when you subscribe.Subscribe nowAlready a subscriber? LoginLicense articleIntroducing your NewsfeedFollow the topics, people and companies that matter to you.Find out moreRead MoreSuper warsOpinionAFR WeekendPerspectiveMichael StutchburyEditor-at-largeMi