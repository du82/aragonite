full_description = '''{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","item":{"@id":"https://www.afr.com/life-and-luxury","name":"Life & Luxury"},"position":1},{"@type":"ListItem","item":{"@id":"https://www.afr.com/life-and-luxury/design","name":"Design"},"position":2}]}Life & LuxuryDesignOne couple’s decades-long devotion to Australian art has a new homeThe Eva and Marc Besen Centre is a state-of-the-art gallery and storage space where back-of-house and front-of-house are one and the same.The new building (right) follows the curve of the 2003 building; a new sculpture park meandering between. Studio Leo ShowellStephen ToddDesign editorFeb 28, 2025 – 5.00amSaveLog in or Subscribe to save articleShareCopy linkCopiedEmailLinkedInTwitterFacebookCopy linkCopiedShare via...Gift this articleSubscribe to gift this articleGift 5 articles to anyone you choose each month when you subscribe.Subscribe nowAlready a subscriber? LoginAs my car winds its way up a spectacular alley of towering poplars, the TarraWarra Museum of Art gradually comes into view, its rammed earth facade seeming to erupt from a hilltop in the Yarra Valley. Monumental yet humble, it was designed by architect Allan Powell in the early 2000s for billionaire philanthropists Eva and Marc Besen, to house the couple’s collection of important Australian artworks from the 1930s onwards.When looking for words to describe the landmark, Melbourne-based architect Kerstin Thompson settles on “enigmatic”. She is the design mind behind a recently completed companion building that will simultaneously store and showcase a significant expansion of this singular collection.Loading...SaveLog in or Subscribe to save articleShareCopy linkCopiedEmailLinkedInTwitterFacebookCopy linkCopiedShare via...Gift this articleSubscribe to gift this articleGift 5 articles to anyone you choose each month when you subscribe.Subscribe nowAlready a subscriber? LoginLicense articleIntroducing your 