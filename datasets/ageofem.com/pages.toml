title = "The Age of Em, A Book"
description = "The Age of Em by Robin Hanson: Work, Love and Life when Robots Rule the Earth."
full_description = "This hellish cyberworld is quite cool to think about in a dystopian Matrixy way. … brilliantly weird extrapolationsSteven PooleThe GuardianWhat is remarkable … is not just the detail … but the way he situates it within a perceptive analysis of our human past and present.Daniel LevitinWall Street JournalCrammed full of such fascinating visions of an imagined futureSarah O'ConnorFinancial TimesThe Age of Em: Work, Love and Life when Robots Rule the EarthOxford University PressPaperback available hereHardback: 1 June 2016, Revised paperback: 5 June 2018 (Has 4 new sections, 18% more text, and 42% more citations)(See full cover. Cover image: Habitat by Till Nowak) Robots may one day rule the world, but what is a robot-ruled Earth like?Many think the first truly smart robots will be brain emulations or ems. Scan a human brain, then run a model with the same connections on a fast computer, and you have a robot brain, but recognizably human.Train an em to do some job and copy it a million times: an army of workers is at your disposal. When they can be made cheaply, within perhaps a century, ems will displace humans in most jobs. In this new economic era, the world economy may double in size every few weeks.Some say we can't know the future, especially following such a disruptive new technology, but Professor Robin Hanson sets out to prove them wrong. Applying decades of expertise in physics, computer science, and economics, he uses standard theories to paint a detailed picture of a world dominated by ems.While human lives don't change greatly in the em era, em lives are as different from ours as our lives are from those of our farmer and forager ancestors. Ems make us question common assumptions of moral progress, because they reject many of the values we hold dear.Read about em mind speeds, body sizes, job training and career paths, energy use and cooling infrastructure, virtual reality, aging and retirement, death and immortality, security, wealth inequality, religion, teleportation, identity, cities, politics, law, war, status, friendship and love.This book shows you just how strange your descendants may be, though ems are no stranger than we would appear to our ancestors. To most ems, it seems good to be an em. Buy on AmazonAlso on Audible, Kindle, Google Play, Barnes & Noble, and Oxford University PressRead free sampleAnd here is a longer talk.Robin Hanson is associate professor of economics at George Mason University, and research associate at the Future of Humanity Institute of Oxford University. He has a doctorate in social science from California Institute of Technology, master's degrees in physics and philosophy from the University of Chicago, and nine years experience as a research programmer, at Lockheed and NASA. He has 3500 citations, 60 publications, 700 media mentions, and he blogs at OvercomingBias.Prof. Hanson's second book, coauthored with Kevin Simler, is The Elephant in the Brain: Hidden Motives in Everyday Life, which will be published January 2, 2018.More on Prof. Hanson here.Table of ContentsPrefaceAcknowledgementsIntroductionYour ancestors behaved differently from you, and you probably explain this via moral progress. However, your descendants may also differ greatly, and in ways that challenge your progress ideals. This is because new habits and attitudes result less than you think from moral progress, and more from people adapting to new situations. This book presents a concrete and plausible yet troubling view of a future full of strange behaviors and attitudes. It starts with a particular technology often foreseen in futurism and science fiction: brain emulations. It then uses standard theories from many physical, human, and social sciences to describe in detail what a world with that future technology would look like. BasicsStartOverviewSummaryThere have been three human eras so far: foragers, farmers, and industry. The next era is likely to arise from artificial intelligence in the form of brain emulations, sometime in the next century or so. This book paints a detailed picture of this new era. Here we summarize this picture. For example, most ems are much faster than humans, who live comfortably on the margins of the em society. Ems are crowded into a few dense hot cities, mostly live and work in virtual reality, and work most of the time because of their near subsistence wages. Ems reproduce via exact copies, and usually whole teams are copied together. Most ems are temporary copies that will be deleted after finishing a short task, and most are near a peak productivity subjective age of 50 or more years.ModesPrecedentsPrior ErasOur EraEra ValuesDreamtimeLimitsPast changes suggest future changes. Compared with its prior era, each era has had bigger groups, faster growth, and a similar total number of humans. This roughly suggests that, compared with our industry era, the next era will have groups of size trillion, economic doubling times of less than a month, and a total duration of a year or two. Strong cultural pressures were needed to turn foragers into farmers, but we feel such pressures less as we get rich today. So industry culture includes many farmer to forager trends, and non-adaptive behavior. Eventually, future individuals must return to being adaptive and poor, and so move back toward farmer culture. The em era moves in these directions.FramingMotivationForecastingScenariosConsensusScopeBiasesThe future matters more than the past, and contrary to a common impression, past forecasters have shown that we can at least dimly foresee the social implications of disruptive new technologies. This book’s main method is to assume that brain emulations are cheap to make, and to then repeatedly apply standard consensus science to predict the details of a world containing such devices, assuming other details. These many details are collected into a self-consistent scenario, with parameter values chosen either to be most likely, or to be simple so as to support further analysis. For example, markets are usually assumed to be competitive with low regulation. Economics is emphasized and tentative conclusions are drawn in as many life areas as possible. We try to avoid common biases.AssumptionsBrainsEmulationsComplexityArtificial IntelligenceAn em is an artificial signal-processing (or “computing”) device arranged to closely mimic the patterns of signals sent in a particular human brain. It has the same mental habits and styles of that human. This book assumes that brains can be emulated, and that ems can be copied and run at different speeds. For example, a kilo-em runs at 1000 times human speed, while a milli-em runs at one-thousandth. But as complex brains remain poorly understood, ems cannot be usefully reorganized, beyond a limited set of tweaks. Our rate of progress in non-em-based artificial intelligence suggests that when ems arrive that field will be less than halfway to human level abilities, allowing a substantial era where em labor is in high demand.ImplementationMindreadingHardwareSecurityParallelismBy placing matching brain areas into matching activation states, ems could read the surface of each others’ minds. Emulation hardware is probably digital, fault-tolerant, very parallel, and specialized to the emulation task. The hardware cost to run an em is roughly proportional to speed over a wide range of speeds. Ems could change speeds by changing hardware. While some ems allow anyone to copy and run them, most ems fear mind-theft as a route to torture, slavery, exposed secrets, and lost investments. Many strategies are available to avoid mind-theft.PhysicsScalesSpeedsBodiesLilliputMeetingsEntropyMiserly MindsThe cost to run an em is proportional to speed probably within at least a factor of one million above and below human speed. Ems can afford to save archive copies at least every 5 subjective minutes. For a faster em, a natural-to-control physical body is proportionally smaller, e.g. a kilo-em has a millimeter tall body, to which gravity seems weaker and winds seem stronger. Ems can meet well in virtual reality when signal delays are less than reaction times; kilo-ems need to be within 15 kilometers. Ems who use fractal adiabatically reversible hardware use much less energy than do human brains for the same speed. They can temporarily vary their speed, and spend about as much renting their hardware as on energy and cooling to run it. Interacting reversible ems coordinate to reverse their interaction messages later within a reversing period.InfrastructureClimateCoolingAir & WaterBuildingsManufacturingLike computer rooms today, em cities control temperature, dust, humidity, vibration, etc. Hardware closer to city centers is denser, and when higher it is lighter. City centers are taller, and hold more recently designed hardware. Fractal cooling pipe systems occupy roughly half of city volume, and allow huge dense cities. Pipes may push in ice slurries and pull out near boiling water, in which case em hardware is also that hot. Buildings are made fast from modular units, don’t last as long as our buildings do, connect into a lattice to jointly resist winds, and are less resistant to earthquakes. Adiabatic reversible manufacturing spends roughly the same on renting factories as on energy and cooling to run them.AppearancesVirtual RealityComfortShared SpacesMerging Real & VirtualEms spend leisure time in virtual realities of spectacular comfort, beauty, and artistry, and which prevent direct violence. Most ems also work in virtual offices, where environments need to not be overly distracting. Em virtual realities have many elements that would be recognizable and familiar to us. In contrast, em physical objects look more harsh and functional when viewed directly. Em virtual and physical spaces may be integrated into a common spatial representation, to help ems reason about brain locations. An em whose virtual body travels too far from its brain must accept delayed reactions to local events. It is usually prohibitively expensive to have active intelligent non-player characters in em virtual realities.InformationViewsRecordsFakerySimulationsEms see not just real and virtual worlds, but also ways to manage their brain’s speed, connections, security, and location. Some ems, such as spurs and retirees, are not visible in default views of spaces, but are visible on request. Ems can usually verify the identity of interaction partners, ems save audio-visual recordings of their lives, and ems want reliable records of their copy history. Ems agree to sometimes be placed into sims which they cannot at the time distinguish from reality. Each sim usually serves several functions at once. Ems in unusual situations suspect that they are in a sim, which makes ems especially loyal and reliable in such situations.ExistenceCopyingRightsMany EmsSurveillanceWhen blank em hardware is available, an existing em is easily copied into that hardware, resulting in a new em with exactly the same memories and mental habits, but with new diverging experiences from that point forward. Ems who can veto copies feel stronger ownership of their existence. While many possible legal regimes could cover em creation, for the rest of this book what mainly matters is that ems are usually created to fill jobs that create a value of a few times the em hardware cost. Strong global coordination to regulate copying could prevent this, but needs strong surveillance, which is hard to manage. Em slavery is possible, but low em wages remove most profits from slave ownership.FarewellsFragilityRetirementGhostsWays To EndDefining DeathSuicideBrains, like other complex adaptive systems, become inflexible with experience adapting to particular environments. So within a subjective few centuries, ems become no longer competitive with younger ems and so must retire. Slow retirement is very cheap, but as with the naturally-slow humans, a slow retiree’s expected lifespan is limited by em civilization instabilities. Em retirees are like ghosts in many ways. Ems see making a copy who ends after doing a short task not as “death,” but as a part of them they choose not to remember. Ems usually have a right to suicide.EconomicsLaborSupply & DemandMalthusian WagesFirst EmsSelectionEnough EntrantsBy the time 1000 humans have been scanned to make ems that compete for jobs, and 1000 useful mind tweaks are available, then almost all wages fall to within roughly a factor of four of the cost to rent em hardware and supporting utilities. Such “Malthusian” wages have described most humans before the industrial era, and almost all animals ever. While ems are “poor” in this sense, they need not suffer physical hunger, exhaustion, pain, sickness, grime, or unexpected death. The fraction of world income that goes to wages increases, and most wage premiums disappear; ems who are paid at all are paid about the same. The first scans are destructive, and of peak-career humans, while later scans are of young humans better able to learn.EfficiencyClan ConcentrationCompetitionEfficiencyElitenessQualitiesThe set of all em copies of the same original human constitutes a “clan.” Most wages go to the 1000 most productive clans, who are each known by one name, like “John,” who know each other very well, and who discriminate against less common clans. Compared with people today, ems are about as elite as billionaires, heads of state, and Olympic gold medalists. The em world is more competitive than ours in more quickly eliminating less productive entities and practices. This encourages more job punishment, less product variety and identity enhancement, and more simple functionality. Because they are more productive, ems tend to be married, religious, smart, gritty, mindful, extraverted, conscientiousness, agreeable, non-neurotic, and morning larks.WorkWork HoursSpursSpur UsesSocial PowerEms are oriented more to work, instead of leisure, and tend to be workaholics, perhaps working 12 hours per subjective day. Ems are comfortable making “spurs,” i.e. copies created at workday’s start, and retired or ended by its conclusion. Spurs save a factor of two or three in costs, but forego chances to learn from tasks. Spurs do most em work, many spur tasks take a subjective hour, and spurs interact more with each other. Spurs can ensure privacy in counseling, auditing, and law enforcement. By putting two spur copies into a “safe” from which only one bit is returned, one em can show another “you’d agree with me if I could tell you what I know.” Ems act like people today who get and keep power, handicapping themselves less, selling themselves more, flattering bosses more and criticizing them less, and directly asking more for things they want.BusinessInstitutionsNew InstitutionsCombinatorial AuctionsPrediction MarketsCompetition induces not only new more efficient physical technologies, but also new more efficient social institutions. New em practices may include more pay-for-performanc"
