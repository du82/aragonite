["https://agnescameron.info/mozilla"]
title = "agnes cameron"
full_description = "Bot or Not? Bot or Not? is a project developed by Foreign Objects, for the Mozilla Foundation Creative Media Awards. The project – consisting of an online game and learning resource, and accompanying workshop Bot Chat – explores questions around embodiment, agency and labour brought about by the increasing ease with which anyone can make a moderately-convincing ‘human’ agent. I wrote here about the process of designing the ‘AI’ part of the game. The game itself can be played here, and the accompanying guide we wrote – covering questions about the legal status of bots, their history, and how to identify them – is available here."
