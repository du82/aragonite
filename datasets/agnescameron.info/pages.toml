["https://agnescameron.info/slimes"]
title = "agnes cameron"
full_description = "Slime Moulds My 4th-year dissertation at Cambridge (supervised by Fumiya Iida of the Bio Inspired Robotics Laboratory) examined the use of slime mould Physarum Polycephalum as a bio-inspired model for a fault tolerant network. My research involved the construction of cellular automata models that were then used for a series of experiments, examining the mediation of information flow over the distributed network. I also grew some live slimes to validate the efficacy of my model. The code for this project is available here, and a copy of the dissertation itself is available here."
