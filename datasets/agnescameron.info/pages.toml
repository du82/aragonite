["https://agnescameron.info/transparencia"]
title = "agnes cameron"
full_description = "Transparencia Index Transparencia Index is a project developed with artist Federico Pérez Villoro, which indexes entries in the Mexican Freedom of Information archives (Plataforma Nacional de Transparencia) that have been denied as they request classified information. I worked with Federico on the backend components of the index, building first bots and scrapers to scrape the Plataforma Nacional de Transparencia site, and later on developing a topic model to reveal links between the different entries. The database was realised as a website by Tiger Dingsun, and we presented the project at Printer Matter in February 2022."
