["https://agnescameron.info/inflatables"]
title = "agnes cameron"
full_description = 'Inflatables Workshops Since Summer 2018, I have taught workshops on making inflatables, which have covered a variety of scales, techniques and settings. They range from a couple of hours, to a few days in length. Lots of past attendees have gone on to use inflatables as part of their artistic practice, with a few even organising workshops of their own. BA Computational Arts, Summer 2023 Invited by the Computational Arts program to run the second annual inflatables workshop -> we had 2 days, one of the students put a tentacle on the back of Camberwell Sainsbury’s, and we ended up with a beautiful dome at the end. Somerset House Summer Party 2022 Made a big guy in the second inflatables workshop at somerset house, and showed him a good time. BA Computational Arts, Summer 2022 I was invited to give an inflatables workshop with the BA Computational Arts students at Camberwell, we hung a big snake out the window and then also had a very hard time putting a big pillow up in high wind (beautiful though!) FABRICA, December 2021 I went to FABRICA, Italy to run a 3-day inflatable making workshop, we made some really big ones: Somerset House Snake, Autumn 2021 Short workshop, where 6 of us spent about an hour turning 3 packs of binbags into a surprisingly large spined snake. We took him out for a walk by the bar after. How To Make Almost Anything, Wildcard Week 2019 For the second iteration of HTMAA’s wildcard week, students produced a really stunning range of projects. At Neil’s behest to ‘please, add more CAD, this is a digital fabrication class, you can’t just think about things then cut them out’ we also had the help of Sam Calisch and Sarah Falcone to use the Zund machine to automatically cut the fabric with a drag knife. Aubrey’s spiny exoskeleton: Emma and Chucho’s Rebecca Horn-y wearable: Student documentation from the 2019 class: Lavender Tessmer and Alex Waller Aubrey Simonson Emma Zhu and Chucho Ocampo Serena Do february school session 1: sewn inflatables + windsocks (with gary zhexi zhang) Students in MIT’s ACT program ran a ‘school within a school’ over the month of February in 2018 and 2019. For the 2019 version, Gary and I ran a series of inflatables workshops. The first of these focussed on sewn inflatables, teaching students basic sewing skills, then explored different forms – wearables, large fans, air+bicycle-powered. Mindy blesses the bicycle squid: february school session 2: inflatables to live in (with gary zhexi zhang) Inspired by Ant Farm’s Inflato Cookbook, we used the second session to focus on inflatables at scale, using polythene sheeting + duct tape to construct an environment that we could (just about) all fit inside. february school session 3: protest inflatables (with gary zhexi zhang) We hosted a special workshop to mark the appearence of war criminal Henry Kissenger’s visit to campus to launch MIT’s new College of Computing. The resultant inflatable (intended to be in the shape of a missile) run from a battery-powered fan, and accompanied the protest on a march through MIT campus (if anyone has photos of this, would love them) MIT Media Lab Festival of Learning, 2019 I organised a day-long drop-in workshop at the festival of learning, which resulted in an inflatable designed and assembled by a group of around 10 people total, with minimal guidance. While not the most coherent of forms, it had a certain charm. How To Make Almost Anything, Wildcard Week 2018 This was the first inflatables workshop I ran, and also the first iteration of ‘wildcard week’ in the class How to Make Almost Anything, where skills too specific to merit a week of their own in class are guest-taught, giving students a choice of different skills to learn. I ended up doing this 2 years in a row! Student documentation from the 2018 class: Miana M Smith Luiza Bastos Lages and Ryan Aasen Jeremy Guilette Luiza and Ryan’s giant cone: \ Miana’s balcony spider: \'
