["https://agnescameron.info/ktrg"]
title = "agnes cameron"
full_description = "KTRG The Knit Tech Reading Group (KTRG) is part of the Material Programming Research Project, a collaboration between researchers at UAL’s Creative Computing Institute and Smart Textiles Lab. The group convenes to think around the following questions: what are the idiosyncrasies of knit as a medium? why is knitting like that? when designing tools for the creation of knit textiles, what kinds of task and operation have been under-considered? how do we evaluate the quality (in terms of craftsmanship, design, ease of use) of new advances in knit technology? how can software tools (made using code) work with and for experienced knitters? how can or should they work for people with no knit experience? We meet monthly. Each session, we pre-read and discuss two readings (normally research papers), both relating to a particular theme within knitting and technology. A document of past and future readings is available here. You can sign up to the mailing list here."
year_published = 2025
