["https://agnescameron.info"]
title = "agnes cameron"
full_description = "Hi, I'm Agnes ↝ I design, build and maintain software and hardware, sometimes alone but often with friends. I have a particular interest in simulation, collective knowledge and infrastructural systems. I am a specialist technician and lecturer at UAL's Creative Computing Institute, a member of the Innovation Information Initiative steering committee, and director of the community interest company Inflationary Assets. I was a founding member of the research studio Foreign Objects, am a sometime collaborator of the game studio Moving Castles, and I edit Wikipedia under the alias Petsquirrel. If you are an activist group or community organisation looking for technical support or advice*, I'm normally happy to volunteer my time. I also like hearing from people generally. You can get in touch with me at: agnesfcameron at protonmail dot com. this has included things like satellite imaging, making websites and server advice This website was last updated on 24/02/25 Blog → [ ... ] Recent Work → Transparencia Index → IIIndex → An Introduction to the Bell System → The First 10,000 Years → Garden of Blues → [ ... ] News → 06/02/2025 ↝ temporal landscape @ SOAS Gender Studies ↝ Lola and I gave a performance lecture as part of the SOAS Department of Gender Studies seminar series, presenting This Is A Temporal Landscape, plus some vintage artefacts from past collaborations. 24/01/2025 ↝ autonomous worlds n1 translation ↝ The Autonomous Worlds N1 book that I contributed to last year has been translated into Traditional Chinese by Nowhere Publishing, and exists as both a physical book and e-book. It’s got a hole! 10/01/2025 ↝ multispectral satellite imagery ↝ The research that I did as a technical writing fellow with Bellingcat, on the journalistic use of geological satellite imaging techniques, has been published! There’s a short version on their website and a longer version on my blog. I also made a tool! 08/01/2025 ↝ talk @ edinburgh winter school ↝ I gave a short talk about the CCI’s tech skills workshops at the 2025 pair programming winter school. The whole event was so lovely! 24/10/2024 ↝ VALVES @ The White Hotel ↝ New music, new performance, new sounds and new synths (using vacuum tubes!) with the Commission for New and Old Art at the White Hotel in Manchester. Stat magazine wrote about the performance here! (photo: Brad Morgan) [ ... ] Teaching + Learning → Library → CV → Archive →"
