["http://www.agolo.com/blog-posts/knowledge-graph-entity-graph"]
title = "Knowledge Graphs and Entity Graphs - When You Need One vs. The Other"
description = "How do you bring insights to unstructured data? An overview of how entity graphs build upon knowledge graphs to extract insights and improve information value."
full_description = "What's the Real Value of Higher AI Accuracy in Product Support? | November 25th at 3 pm ET / 12 pm PT | Register Here How do you bring insights to unstructured data? An overview of how entity graphs build upon knowledge graphs to extract insights and improve information value. We live in a world of unstructured data. According to IDC, more than 90% of data generated by organizations is unstructured - but most companies have organized only 10% of it. Up until recently, the value of unstructured data has been difficult to realize at scale. Two structures can help us manage this complexity: knowledge graphs and entity graphs. In this article, we’ll look at how these structures are similar, how they differ, when to use which, and how to put entity graphs into action in your organization. Before we dive into the details, let’s quickly cover exactly what we mean by “structured” vs. “unstructured” data. Structured data is typically machine-generated and follows a set, machine-readable (and, often these days, human-readable) format. Common formats include relational or columnar database tables, Excel files, or similar. Most of the time when we discuss data, we’re thinking of this structured data from enterprise applications - like Enterprise Resource Planning (ERP), Human Capital Management (HCM), Customer Relationship Management (CRM), and Supply Chain Management (SCM). We typically store this data in data warehouses or as-is in data lakes. There are various tools for data analysis, business intelligence, and machine learning that enable organizations to analyze and gain insights from structured data. Unstructured data, on the other hand, is explicitly and directly human-generated data. This can be textual data from chats, texts, social media posts, speech-to-text transcripts, customer notes, emails, documents, presentations, reports, etc. These days, almost every communication leaves a trail of unstructured text. IDC research indicates that this data is growing at nearly 30% annually."
year_published = 2025
