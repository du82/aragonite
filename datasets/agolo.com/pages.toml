["http://www.agolo.com/blog-posts/entity-extraction-disambiguation-linking"]
title = "What are entity extraction, entity disambiguation, and entity linking?"
description = "What are entity extraction, entity disambiguation, and entity linking?"
full_description = "What's the Real Value of Higher AI Accuracy in Product Support? | November 25th at 3 pm ET / 12 pm PT | Register Here In our last post, we discussed some of the powerful capabilities of entity graphs. Entity graphs model contextual relevant relationships between an organization’s entities from unstructured data sources. Like knowledge graphs, entity graphs are comprehensive, automatically curated, and cross-linked to documents. But how do you build entity graphs accurately? For example, say a customer opens a support ticket talking about their “iPhone”. Do you know if that’s an “iPhone 15 Pro Max” or an “iPhone 14 Pro Max”? Building entity graphs accurately requires three processes: entity extraction, entity disambiguation, and entity linking. Let’s look at why each of these is important to building a strong entity graph. The first step in building an entity graph is discovering the entities in context - i.e., discovering them in unstructured text. This is entity extraction, also called Named Entity Extraction (NER). An entity can be any noun or noun-phrase that is the name of something. They can be people, places, organizations, products, and more. Like we said, however, extraction is only the first step. The next step involves associating the extracted entity with authoritative database records of relevant entities. This is entity linking or entity disambiguation. This linking/disambiguation is the challenging part. NER is a known problem with several capable solutions available today.. For example, given a text like “Adam went to Cairo to visit his family”, an extractor can identify that “Adam” is an entity of type Person and “Cairo” is an entity of type Location. The more challenging part of the problem comes in determining who “Adam” is. Which of the 100s of Adams could this be within the company?! Associating this entity incorrectly to authoritative records can produce noise that makes it hard, if not impossible, for analysts to use the data to make critical decisions."
year_published = 2025
