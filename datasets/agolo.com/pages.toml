["http://www.agolo.com/blog-posts/kg-to-text-with-llama-2"]
title = "KG-to-Text with Llama 2"
description = "Beating the current SOTA Knowledge Graph-to-Text (KG-to-Text) model on the WebNLG (Constrained) dataset with a fine-tuned Llama 2 7B Chat model."
full_description = "What's the Real Value of Higher AI Accuracy in Product Support? | November 25th at 3 pm ET / 12 pm PT | Register Here Beating the current SOTA Knowledge Graph-to-Text (KG-to-Text) model on the WebNLG (Constrained) dataset with a fine-tuned Llama 2 7B Chat model. LLMs are evolving rapidly and getting better at performing complex tasks. In parallel, the use of Knowledge Graphs is increasing, due to their ability to render a semantic understanding of data, which can be leveraged by machine learning algorithms. These two technologies make the task of knowledge graph-to-text generation (KG-to-Text) more relevant today than ever. KG-to-text is a Natural Language Generation (NLG) task in which the input is a knowledge graph, and the expected output is a coherent piece of text that is consistent with the information represented in the knowledge graph. While much of the advancement in AI is centered around LLMs, their input is text. Yet, raw text lacks a semantic understanding of entities, their attributes, and relationships. Knowledge graphs excel at providing this type of information. Retrieving relevant excerpts from knowledge graphs and using them to create text can bring across the semantic structure of that linked data (which can also serve as better input to generative AI). KG-to-text is beneficial for many applications with a knowledge graph backend. For example, Wu et al. retrieve knowledge graph triples that are relevant to a question and use KG-to-text to generate the answer. Similarly, Hao et al. retrieve information that is relevant to a user’s post from a knowledge graph and use KG-to-text to generate replies. One commonly used dataset in KG-to-Text is WebNLG. It consists of a set of small knowledge graphs and the corresponding lexicalizations (the text containing the information represented in the knowledge graph). The current state-of-the-art (SOTA) on the WebNLG (Constrained) dataset is the JointGT model, which is built by fine-tuning the pre-trained transformer models on three tasks: (1) reconstructing a masked version of the text from the knowledge graph, (2) reconstructing a masked version of the knowledge graph from the text, and (3) aligning the graph and text embeddings using optimal transport. A specific type of attention layer called the structure-aware self-attention is used in JointGT to provide information about the graph structure for each transformer layer."
year_published = 2025
