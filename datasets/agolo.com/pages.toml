["https://www.agolo.com/blog-posts/why-rag-isnt-enough-for-genai-apps"]
title = "Why RAG isn’t enough for GenAI apps"
description = "Retrieval Augmented Generation (RAG) is a popular, low-cost technique to boost GenAI response quality. But for many use cases, it still falls short."
full_description = "What's the Real Value of Higher AI Accuracy in Product Support? | November 25th at 3 pm ET / 12 pm PT | Register Here Retrieval Augmented Generation (RAG) is a popular, low-cost technique to boost GenAI response quality. But for many use cases, it still falls short. ‍Retrieval Augmented Generation, or RAG, is a technique that many teams use to feed up-to-date and use case-specific context to generalized Large Language Models (LLMs). However, there are many use cases in which RAG isn’t enough to get the results you need. In the most relevant empirical benchmarking study, a research team at Stanford found that domain-specific RAG solutions generate accuracy rates in the range of 20% to 65%. The remainder of responses are either Hallucinations or Incomplete. While higher than general purpose GenAI accuracy rates, these accuracy rates for RAG solutions are too low to drive user adoption and business ROI. The key takeaway is that RAG alone is not sufficient to solve the GenAI accuracy problem in domain-specific contexts. In this article, we’ll discuss where RAG falls short and how using RAG driven by an entity graph can greatly improve GenAI output accuracy. First, before diving into RAG, I wanted to make a few observations based on our experiences with customers who’ve deployed GenAI solutions. A “successful” GenAI solution is one that achieves its desired outcomes. This will differ by use case. Agolo’s domain focus is on product support GenAI for consumer and industrial manufacturers. In this product support domain, , the desired outcomes usually include: The good news about GenAI is that it works. Achieving your desired outcomes, however, requires a few key project principles: These goals are impossible to achieve with a general purpose LLM. Most LLMs are built for general-use purposes and have been trained on all publically available data. Typically, they haven’t been trained deeply on a company’s products and issues. As a result, they don't know much - if anything - about a company’s product support data."
year_published = 2025
