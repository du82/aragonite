["https://ahrefs.com/blog/also-rank-for-study"]
title = "How many keywords can you rank for with one page? (Ahrefs’ study of 3M searches)"
description = "Tim Soulo is CMO at Ahrefs. With over 15 years in the digital marketing industry, Tim is the author of many data-driven studies and actionable marketing frameworks, some of which gained industry-wide recognition. He enjoys challenging conventional marketing knowledge and optimizing for simplicity and efficiency."
full_description = '''<img class="category-icon" src="https://ahrefs.com/blog/wp-content/themes/Ahrefs-4/images/categories/icons/data-studies.svg" alt="Data &amp; Studies" title="Data &amp; Studies"/>Data & StudiesHow many keywords can you rank for with one page? (Ahrefs’ study of 3M searches) By Tim Soulo May 9, 20177 min read<img src="https://ahrefs.com/blog/wp-content/uploads/2024/05/Tim_profile_pic-120x120.jpg" width="85" height="85" alt="Tim Soulo" class="avatar avatar-85 wp-user-avatar wp-user-avatar-85 alignnone photo" /> Tim Soulo Tim Soulo is CMO at Ahrefs. With over 15 years in the digital marketing industry, Tim is the author of many data-driven studies and actionable marketing frameworks, some of which gained industry-wide recognition. He enjoys challenging conventional marketing knowledge and optimizing for simplicity and efficiency. Article PerformanceData from AhrefsLinking websites 438 Sign up for AhrefsGet SEO metrics of any website or URL.The number of websites linking to this post.This post's estimated monthly organic search traffic.Get the week's best marketing content Email Subscription Subscribe Leave this field empty if you're human: Contents For anyone monitoring their traffic from Google, it’s not really a revelation that a single page can rank for hundreds (or even thousands) of relevant keywords. But how many keywords exactly will an average page rank for?That’s the question we wanted to answer (plus a few more), so we picked 3 million random search queries and looked at the top-ranking pages and how many other keywords they rank for.Let’s dive right in!<img decoding="async" alt="Beginner's guide to keyword research" src="https://ahrefs.com/blog/wp-content/uploads/2021/05/keyword.png">New to keyword research? Check out ourBeginner’s guide to keyword researchHow many keywords do the top20 ranking pages “also rank for”?Here are the average and median numbers of keywords that we saw top20 pages “also rank for” (studied across 3 million search queries):Sidenote. By saying “also rank for,” I actually mean “also rank for in top10.” For if you’re not in the top10 search results for a given keyword, you’re hardly getting any traffic from it.<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2017/05/00-median-number-also-rank-for-keywords2.png" alt width="900" height="619" class="alignnone size-full wp-image-15834" srcset="https://ahrefs.com/blog/wp-content/uploads/2017/05/00-median-number-also-rank-for-keywords2.png 900w, https://ahrefs.com/blog/wp-content/uploads/2017/05/00-median-number-also-rank-for-keywords2-768x528.png 768w, https://ahrefs.com/blog/wp-content/uploads/2017/05/00-median-number-also-rank-for-keywords2-618x425.png 618w" sizes="(max-width: 900px) 100vw, 900px">It looks like the average #1 ranking page will also rank in the top10 for nearly 1,000 other relevant keywords (while the median value is more than two times smaller - around 400 keywords).And the lower ranking pages tend to rank for less keywords.We have also studied three groups of keywords separately:all keywords in our sample;keywords with search volume over 1,000 searches per month;keywords with search volume over 10,000 searches per month.We wanted to know if ranking for a more popular keyword would result in ranking for a larger number of relevant keywords. Which appeared to be exactly the case.The outliersIt’s always fun to look at outliers, right?Sidenote. Outliers are the actual reason why we study average and median numbers separately. Quite a few pages rank for an enormous amount of keywords, which drives the “average” numbers up. For the previous experiment, we removed the biggest outliers to make the data more representative, but even then, the gap between average and median values was quite substantial. So let’s see which pages rank in Google for an enormous amount of keywords.Top10 pages by the number of “also rank for in top100” keywords (across all countries):(192184) nsfw(139245) http://www.vidtomp3.com/(131597) http://www.listentoyoutube.com/(118070) http://www.youtube-mp3.org/(113957) http://convert2mp3.net/en/(113927) http://www.clipconverter.cc/(108972) https://www.google.com/(104940) http://www.pcmag.com/article2/0,2817,2476563,00.asp(100558) http://keepvid.com/(91594) https://www.pizzahut.com/Top10 pages by the number of “also rank for at #1” keywords (across all countries):(49804) https://www.google.com/(34930) https://www.google.com/gmail/(30420) https://www.facebook.com/(27851) https://www.youtube.com/(25639) http://www.youtube-mp3.org/es(24769) nsfw(22078) nsfw(21588) https://translate.google.com/?hl=es(21584) http://www.youtube-mp3.org/(20613) https://translate.google.com/You can put any of these URLs into Ahrefs’ Site Explorer tool and navigate to the “Organic keywords” report to see all the keywords they rank for.And based on these outlier URLs, it looks like downloading content from YouTube is one of the primary issues that bother humanity these days:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2017/05/also-rank-for-in-ahrefs.jpg" alt width="900" height="615" class="alignnone size-full wp-image-15850" srcset="https://ahrefs.com/blog/wp-content/uploads/2017/05/also-rank-for-in-ahrefs.jpg 900w, https://ahrefs.com/blog/wp-content/uploads/2017/05/also-rank-for-in-ahrefs-768x525.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2017/05/also-rank-for-in-ahrefs-622x425.jpg 622w" sizes="(max-width: 900px) 100vw, 900px">How many high-volume keywords can you “also rank for”?There’s nothing surprising about ranking for thousands of long-tail keywords with a single page. But what about the high-volume keywords? How many of them can a single page rank for?To study this, we took all the pages from our sample that ranked #1 for a 10k+ keyword and looked at how many other 10k+ keywords these pages also ranked for (at position #1).We then replicated a similar experiment for pages that ranked #1 for 1k+ keywords.And here’s what we got:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2017/05/00-distribution-URLs-by-also-rank-for-keywords.png" alt width="900" height="1215" class="alignnone size-full wp-image-15827" srcset="https://ahrefs.com/blog/wp-content/uploads/2017/05/00-distribution-URLs-by-also-rank-for-keywords.png 900w, https://ahrefs.com/blog/wp-content/uploads/2017/05/00-distribution-URLs-by-also-rank-for-keywords-768x1037.png 768w, https://ahrefs.com/blog/wp-content/uploads/2017/05/00-distribution-URLs-by-also-rank-for-keywords-315x425.png 315w" sizes="(max-width: 900px) 100vw, 900px">Unsurprisingly, the majority of URLs have ranked #1 for a single high-volume keyword.But the raw numbers on the above graph might seem a little bit misleading, because it’s hard to put them on the same scale.So we have calculated what % of pages in our sample ranked at the top for one keyword, two keywords, three keywords, etc. And got these cool pie charts:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2017/05/00-ranking-for-high-volume-keywords.jpg" alt width="900" height="600" class="alignnone size-full wp-image-15838" srcset="https://ahrefs.com/blog/wp-content/uploads/2017/05/00-ranking-for-high-volume-keywords.jpg 900w, https://ahrefs.com/blog/wp-content/uploads/2017/05/00-ranking-for-high-volume-keywords-768x512.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2017/05/00-ranking-for-high-volume-keywords-638x425.jpg 638w" sizes="(max-width: 900px) 100vw, 900px">It turns out that ranking for 2-3 keywords with over 1,000 searches per month is quite common. While ranking for more than one 10k+ keyword with a single page is very rare.How can you rank for more keywords with your page? As you can probably tell by looking at the above-mentioned outliers, the best way to rank for more keywords is to choose the right topic.Certain topics tend to have a huge search demand and a ton of relevant search queries, while others simply aren’t popular enough to provide you with a variety of keyword searches.We’ve covered this in our guide to long-tail keywords, but I guess it won’t hurt to mention it again.Research traffic potentialWhen planning your content, don’t just look at the search volume of the primary keyword you’re targeting. You should pull the top-ranking pages for that keyword and see how many other keywords they also rank for and how much search traffic it brings them.I often use the keyword “I’m sorry flowers” to illustrate that.The monthly search volume of this keyword is only 250 searches per month, which may seem that it is not worth targeting.<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2017/05/search-volume-sorry-flowers.jpg" alt width="900" height="276" class="alignnone size-full wp-image-15858" srcset="https://ahrefs.com/blog/wp-content/uploads/2017/05/search-volume-sorry-flowers.jpg 900w, https://ahrefs.com/blog/wp-content/uploads/2017/05/search-volume-sorry-flowers-768x236.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2017/05/search-volume-sorry-flowers-680x209.jpg 680w" sizes="(max-width: 900px) 100vw, 900px">But if you look at the top-ranking pages for that keyword (which you can do with Ahrefs’ Keywords Explorer) you’ll see this:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2017/05/ahrefs-serp-analysis.jpg" alt width="900" height="499" class="alignnone size-full wp-image-15860" srcset="https://ahrefs.com/blog/wp-content/uploads/2017/05/ahrefs-serp-analysis.jpg 900w, https://ahrefs.com/blog/wp-content/uploads/2017/05/ahrefs-serp-analysis-768x426.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2017/05/ahrefs-serp-analysis-680x377.jpg 680w" sizes="(max-width: 900px) 100vw, 900px">The top5 ranking pages for the keyword “I’m sorry flowers” also rank for over 50 other relevant keywords, which brings each of them around a hundred highly targeted visitors per month.<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2017/05/also-rank-for-im-sorry-flowers.jpg" alt width="900" height="572" class="alignnone size-full wp-image-15861" srcset="https://ahrefs.com/blog/wp-content/uploads/2017/05/also-rank-for-im-sorry-flowers.jpg 900w, https://ahrefs.com/blog/wp-content/uploads/2017/05/also-rank-for-im-sorry-flowers-260x166.jpg 260w, https://ahrefs.com/blog/wp-content/uploads/2017/05/also-rank-for-im-sorry-flowers-768x488.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2017/05/also-rank-for-im-sorry-flowers-669x425.jpg 669w" sizes="(max-width: 900px) 100vw, 900px">Sidenote. We have a very large database of keywords at Ahrefs, but it is impossible to include all the existing search queries there. That is why Ahrefs always underestimates the amount of keywords that a page is ranking for and the amount of traffic it brings. Which means the actual search traffic to a given page will always be bigger than what we estimate. So if you stick with the old approach to keyword research, you’ll decide that it’s not worth ranking in top5 for the keyword “I’m sorry flowers.”And if you adopt this new strategy, you’ll be getting around a hundred highly targeted visitors per month from ranking anywhere in the top5 for this keyword.But apart from finding the topic with high traffic potential, what else can you do to maximize the amount of keywords that your page will rank for?Does content length help?To give you the answer to this question, we have distributed all pages in our sample size into 5 buckets by their content length and looked at the average number of keywords they “also ranked for in the top10”:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2017/05/00-content-length-general.jpg" alt width="900" height="600" class="alignnone size-full wp-image-15839" srcset="https://ahrefs.com/blog/wp-content/uploads/2017/05/00-content-length-general.jpg 900w, https://ahrefs.com/blog/wp-content/uploads/2017/05/00-content-length-general-768x512.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2017/05/00-content-length-general-638x425.jpg 638w" sizes="(max-width: 900px) 100vw, 900px">Looks like longer form content tends to rank for more keywords, which is not surprising in any way.But then we went a little more granular and looked at the amount of keywords that ranked at position #1 for each bucket:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2017/05/00-content-length-granular-1.jpg" alt width="900" height="600" class="alignnone size-full wp-image-15846" srcset="https://ahrefs.com/blog/wp-content/uploads/2017/05/00-content-length-granular-1.jpg 900w, https://ahrefs.com/blog/wp-content/uploads/2017/05/00-content-length-granular-1-768x512.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2017/05/00-content-length-granular-1-638x425.jpg 638w" sizes="(max-width: 900px) 100vw, 900px">And still longer form content performed better.Do backlinks help?There were quite a few studies (ours included) that showed a rather high correlation between the backlink factors of a page and its Google rankings.But I don’t think I’ve seen a study of how backlink factors correlate with the number of keywords that a page ranks for.So we created 5 buckets by URL Rating (which shows how strong the backlink profile of a given URL is) and looked at the average number of “also rank for in top10” keywords for each of them:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2017/05/00-URL-rating-general.jpg" alt width="900" height="600" class="alignnone size-full wp-image-15841" srcset="https://ahrefs.com/blog/wp-content/uploads/2017/05/00-URL-rating-general.jpg 900w, https://ahrefs.com/blog/wp-content/uploads/2017/05/00-URL-rating-general-768x512.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2017/05/00-URL-rating-general-638x425.jpg 638w" sizes="(max-width: 900px) 100vw, 900px">The above graph shows a pretty strong correlation between URL Rating of a page and the number of keywords that it ranks for in the top10.We also went a little more granular and looked at the keywords ranking at position #1:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2017/05/00-URL-Rating-granular.jpg" alt width="900" height="600" class="alignnone size-full wp-image-15848" srcset="https://ahrefs.com/blog/wp-content/uploads/2017/05/00-URL-Rating-granular.jpg 900w, https://ahrefs.com/blog/wp-content/uploads/2017/05/00-URL-Rating-granular-768x512.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2017/05/00-URL-Rating-granular-638x425.jpg 638w" sizes="(max-width: 900px) 100vw, 900px">And still, pages with a stronger backlink profile performed better.Sidenote. This is just a quick reminder that correlation does not imply causation. So the above research doesn’t allow us to say that backlinks help you rank for more keywords. All we can say is that pages with more backlinks tend to rank for a larger number of keywords.How unique are the “also rank for” keywords?What we wanted to study in this final experiment was how many search queries a page ran'''
