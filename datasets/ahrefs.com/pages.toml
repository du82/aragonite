["https://ahrefs.com/blog/anchor-text"]
title = "What Is Anchor Text? Everything You Need to Know (No Jargon!)"
description = "What is anchor text? Does it influence search engine rankings? How do you optimize it for SEO? Learn everything you need to know here."
full_description = '''Data & Studies, General SEO, Link BuildingAnchor Text: A Data‐Driven Guide (384,614 Web Pages Studied) By Joshua Hardwick ✓ Reviewed by Sam Oh , Si Quan Ong Updated: April 3, 202022 min read<img src="https://ahrefs.com/blog/wp-content/uploads/2019/10/meme-425x425.jpg" width="85" height="85" alt="Joshua Hardwick" class="avatar avatar-85 wp-user-avatar wp-user-avatar-85 alignnone photo" /> Joshua Hardwick Head of Content @ Ahrefs (or, in plain English, I'm the guy responsible for ensuring that every blog post we publish is EPIC). Article PerformanceData from AhrefsLinking websites 719 Sign up for AhrefsGet SEO metrics of any website or URL.The number of websites linking to this post.This post's estimated monthly organic search traffic.Get the week's best marketing content Email Subscription Subscribe Leave this field empty if you're human: Contents Everyone knows that links are a crucial ranking factor. But what about link anchor text? Here’s what Google’s John Mueller says:<img decoding="async" class="alignnone size-full wp-image-172946" src="https://ahrefs.com/blog/wp-content/uploads/2020/06/Screenshot-2024-03-18-at-12.18.30.png" alt="John Mueller says anchor text gives additional context" width="1108" height="664" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/06/Screenshot-2024-03-18-at-12.18.30.png 1108w, https://ahrefs.com/blog/wp-content/uploads/2020/06/Screenshot-2024-03-18-at-12.18.30-680x408.png 680w, https://ahrefs.com/blog/wp-content/uploads/2020/06/Screenshot-2024-03-18-at-12.18.30-768x460.png 768w" sizes="(max-width: 1108px) 100vw, 1108px">He seems to be implying that Google uses anchor text to help understand the context of the link and thus, it may be a “ranking factor.” That’s not a big surprise—Google’s original patent states that they use anchor text to influence rankings. (More on that later!)Here’s another tweet from John where he reiterates the importance of anchor text:<img decoding="async" class="alignnone size-full wp-image-172949" src="https://ahrefs.com/blog/wp-content/uploads/2019/02/Screenshot-2024-03-18-at-12.21.49.png" alt="Another tweet from John Mueller about the importance of anchor text" width="1188" height="490" srcset="https://ahrefs.com/blog/wp-content/uploads/2019/02/Screenshot-2024-03-18-at-12.21.49.png 1188w, https://ahrefs.com/blog/wp-content/uploads/2019/02/Screenshot-2024-03-18-at-12.21.49-680x280.png 680w, https://ahrefs.com/blog/wp-content/uploads/2019/02/Screenshot-2024-03-18-at-12.21.49-768x317.png 768w" sizes="(max-width: 1188px) 100vw, 1188px">The question is: what kind of anchor text should you use? Should you limit the use of a specific type of anchor text if you want to rank in search engines? Should you even be manipulating anchor text at all?In this guide, we’ll reveal what we found by studying the anchor texts of backlinks to 384,614 web pages. But first, let’s make sure we understand the basics.<img decoding="async" alt="Beginner's guide to link building" src="https://ahrefs.com/blog/wp-content/uploads/2021/05/backlinks.png">New to link building? Check out ourBeginner’s guide to link buildingWhat is anchor text?Anchor text refers to the clickable words used to link one web page to another.<img decoding="async" width="900" height="420" class="wp-image-25920" src="https://ahrefs.com/blog/wp-content/uploads/2019/02/anchor-text-example.png" alt="anchor text example" srcset="https://ahrefs.com/blog/wp-content/uploads/2019/02/anchor-text-example.png 900w, https://ahrefs.com/blog/wp-content/uploads/2019/02/anchor-text-example-768x358.png 768w, https://ahrefs.com/blog/wp-content/uploads/2019/02/anchor-text-example-680x317.png 680w" sizes="(max-width: 900px) 100vw, 900px">Example: In this sentence, the blue words are the anchor text.Types of anchor textSay that someone decided to link to our backlink checker.Our primary target keyword for that page is “backlink checker,” for which there are 80K global monthly searches according to Ahrefs’ Keywords Explorer.<img decoding="async" aria-describedby="caption-attachment-25925" class="size-full wp-image-25925" src="https://ahrefs.com/blog/wp-content/uploads/2019/02/backlink-checker-global-volume.jpg" alt width="900" height="333" srcset="https://ahrefs.com/blog/wp-content/uploads/2019/02/backlink-checker-global-volume.jpg 900w, https://ahrefs.com/blog/wp-content/uploads/2019/02/backlink-checker-global-volume-768x284.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2019/02/backlink-checker-global-volume-680x252.jpg 680w" sizes="(max-width: 900px) 100vw, 900px">Via Ahrefs’ Keywords ExplorerBut not every person will link to this page in the same way. Here are some of the anchor text variations they might use:Exact Match: the anchor text is the exact keyword or phrase for which we want to rank.Ahrefs’ Backlink Checker is one of my favorite SEO tools.Phrase Match: the anchor text contains the keyword phrase for which we want to rank.Ahrefs’ Backlink Checker is one of my favorite SEO tools.Partial Match: the anchor text has all words in the query, but not as an exact phrase.Ahrefs’ Checker de la Backlink is one of my favorite SEO tools.Branded: the anchor text is the name of our brand:Ahrefs’ Backlink Checker is one of my favorite SEO tools.Naked URL: the anchor text is the raw, ‘naked’ URL (i.e., as it would appear in a browser):Ahrefs’ Backlink Checker (https://ahrefs.com/backlink-checker/) is one of my favorite SEO tools.Random: the anchor text is an unspecific, generic phrase which does not include our target keyword (e.g., “click here,” “this site,” “this article,” etc.)Ahrefs’ Backlink Checker is one of my favorite SEO tools. Click here to try it for yourself!Image links: the anchor text is the alt text of the image (according to Google).<a href=”https://ahrefs.com/backlink-checker”> <img src=”/backlink-checker.png” alt=”Backlink Checker”/> </a>For example, if we check the Anchors report in Ahrefs’ Site Explorer for our backlink checker, we can see many of the anchor text types mentioned above.Site Explorer > Enter URL > Anchors<img decoding="async" width="896" height="555" class="wp-image-25934" src="https://ahrefs.com/blog/wp-content/uploads/2019/02/anchors-backlink-checker.png" alt="anchors backlink checker" srcset="https://ahrefs.com/blog/wp-content/uploads/2019/02/anchors-backlink-checker.png 896w, https://ahrefs.com/blog/wp-content/uploads/2019/02/anchors-backlink-checker-768x476.png 768w, https://ahrefs.com/blog/wp-content/uploads/2019/02/anchors-backlink-checker-680x421.png 680w" sizes="(max-width: 896px) 100vw, 896px">Now let’s take a look at how that medley of anchor texts may influence our rankings.How anchor text influences search engine rankingsGoogle uses external anchor text to help understand what your page is about and also, for which keywords it should rank. How do we know this?Here’s an excerpt from the original paper on which the Google algorithm is based:Google employs a number of techniques to improve search quality including page rank, anchor text, and proximity information.So if I linked to a page from this article with “dog biscuits” as the anchor text, that would indicate to Google that the linked page likely has something to do with dog biscuits.If other people do the same thing, then that will increase Google’s confidence that the page in question should potentially rank for “dog biscuits.” After all, what are the chances of two or more unrelated websites linking to the same web page with the same anchor text if the page doesn’t have anything to do with dog biscuits? Pretty slim, I’d say.Hopefully, you’re starting to see why anchor text makes sense as a ranking factor.But of course, nothing in SEO is ever that simple.Early Google’s (over) reliance on anchor textAnchor text was weighted heavily in Google’s original algorithm.In their 1998 paper, Google founders Sergey Brin and Larry Page explained:The text of links is treated in a special way in our search engine. Most search engines associate the text of a link with the page that the link is on. In addition, we associate it with the page the link points to. This has several advantages. First, anchors often provide more accurate descriptions of web pages than the pages themselves.Using anchor text also allowed Google to determine the topic of media formats where typical on-page signals couldn’t be used.Second, anchors may exist for documents which cannot be indexed by a text‐based search engine, such as images, programs, and databases. This makes it possible to return web pages which have not actually been crawled.The logic was sound, and the results were impressive, especially compared to the competition at the time—a fact that didn’t go unnoticed by the founders themselves.While a complete user evaluation is beyond the scope of this paper, our own experience with Google has shown it to produce better results than the major commercial search engines for most searches.But Google soon found that anchor text was VERY open to manipulation.To rank a web page for a query, people only have to point multiple links at it with their target keyword as the anchor.More keyword-rich anchor text links than your competitor = WIN.This led to some amusing examples of “Google Bombing”—where SEOs would show how easy it was to game Google by pointing anchor text links at non-relevant pages and ranking them.<img decoding="async" aria-describedby="caption-attachment-25929" class="size-full wp-image-25929" src="https://ahrefs.com/blog/wp-content/uploads/2019/02/google-bomb-george-bush.jpg" alt width="450" height="290">George Bush ranking #1 for the term “miserable failure” thanks to a successful “Google bomb.”Clearly, things had to change.Google fights back against manipulative anchor textIn April 2012, Google rolled out the first iteration of their now infamous Penguin algorithm.Anchor text was one of Penguin’s primary targets.Some websites that had been overly-aggressive with their exact-match anchor text links saw their rankings tank overnight. However, according to Google, it only affected 3.1% of search queries.But things didn’t stop there…Google continued to battle manipulative anchor text spam with subsequent Penguin updates.Most SEOs now seem to recommend using exact-match anchor text sparingly—usually between ~1% and 5%.<img decoding="async" aria-describedby="caption-attachment-25927" class="size-full wp-image-25927" src="https://ahrefs.com/blog/wp-content/uploads/2019/02/anchor-text-recommendation.png" alt width="531" height="88">Example of recommended exact-match anchor text % from another SEO blog.So what’s the truth? Should you keep exact-match anchors to a minimum? Should you avoid exact-match anchors altogether? What about phrase-match and other types of anchors—how should you be using those?To find out, we conducted two studies.Study 1: Anchor text influence across 19,840 keywordsTo study correlations between anchor text types and rankings, we looked at the top 20 search results across 19,840 keywords.That means we analyzed 384,614 web pages in total!Sidenote. Some of you may have noticed that 19,840 * 20 != 384,614, but rather 396,800. That’s because a few URLs rank for more than one of the keywords we studied. All of these keywords:Have 2K-5K monthly searches (randomly selected!);Consist of 2-4 English words;Contain no special characters (e.g., !#@);Are non-numeric (i.e., keywords like phone numbers are filtered out)Furthermore, we only selected keywords where the top 10 search results have similar URL Rating (UR) values. The aim of that was to “isolate” the anchor text variable.Let me explain with a crude example.Let’s say that the top 10 search results for “best protein powder” look like this:Exact anchor match %: 100%. UR score: 60Exact anchor match %: 90%. UR score: 55Exact anchor match %: 80%. UR score: 50Exact anchor match %: 70%. UR score: 45Exact anchor match %: 60%. UR score: 40Exact anchor match %: 50%. UR score: 35Exact anchor match %: 40%. UR score: 30Exact anchor match %: 30%. UR score: 25Exact anchor match %: 20%. UR score: 20Exact anchor match %: 10%. UR score: 15You can see that the percentage of exact-match anchor text correlates with rankings. From this, we could infer that the exact-match rate affects rankings.However, this is misleading because there’s also a correlation of UR.So it’s likely that the number and quality of backlinks (or internal links) is also part of the reason for this correlation.On the other hand, if the results look like this…Exact anchor match %: 100%. UR score: 30Exact anchor match %: 90%. UR score: 25Exact anchor match %: 80%. UR score: 32Exact anchor match %: 70%. UR score: 33Exact anchor match %: 60%. UR score: 28Exact anchor match %: 50%. UR score: 31Exact anchor match %: 40%. UR score: 31Exact anchor match %: 30%. UR score: 27Exact anchor match %: 20%. UR score: 36Exact anchor match %: 10%. UR score: 29… then the likeliness of any potential correlation being caused by backlinks (or internal links) is much lower.Make sense?Good. Let’s take a look at the results.Influence of exact-match anchorsFirst, we looked at the average and median percentage of exact-match anchored backlinks per ranking position—calculated against the total number of backlinks to the URL.<img decoding="async" width="900" height="887" class="wp-image-25917" src="https://ahrefs.com/blog/wp-content/uploads/2019/02/anchor_text_image_1a.png" alt="anchor text image 1a" srcset="https://ahrefs.com/blog/wp-content/uploads/2019/02/anchor_text_image_1a.png 900w, https://ahrefs.com/blog/wp-content/uploads/2019/02/anchor_text_image_1a-768x757.png 768w, https://ahrefs.com/blog/wp-content/uploads/2019/02/anchor_text_image_1a-431x425.png 431w" sizes="(max-width: 900px) 100vw, 900px">So it appears that there’s a pretty clear correlation here, right? Not so fast.The blue line that appears to show the correlation is the average. That is a ‘biased’ representation of the points that belong to each position because extreme values can easily skew the average.Did I lose you?Imagine that we have the following sample of pages for position #1:Page 1: 0% exact-match anchors;Page 2: 0% exact-match anchors;Page 3: 0% exact-match anchors;Page 4: 0% exact-match anchors;Page 5: 100% exact-match anchors;Average exact-match anchors for this sample = 20%.You can see that this isn’t very representative of the entire sample—one value is skewing the average quite dramatically. That’s why we also added the median values to the graph (orange line). You can see that the median for each ranking position is zero.Here’s what Loveme Felicilda—our data scientist—had to say about this: I would say the average is not a good way to represent correlation. That’s why I also show the median. The fact that the median across all positions is zero means there are lots of pages with no exact-match backlinks. If our median values were to show the same “pattern” as our average, then we would have a strong correlation. So if we want to present correlations, then we should plot all '''
