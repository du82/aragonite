full_description = "This report shows the domains that get the most organic traffic based on your seed keywords in your target country. Unlike the keyword ideas reports which only support up to 10 seeds, the Traffic share by domains report is generated based on up to 10,000 keywords. Enter a few relevant seed keywords (e.g, beard, beards) into Keywords Explorer and go to any of the keyword ideas report. We’ll go with the Matching terms report. Choose a few keywords from the list (up to 10,000) and enter them into the search bar again. Now go to the Traffic share by domains report. Here, you’ll see the domains that are ranking for the keywords you’ve entered. For this particular set of keywords, we see general sites like amazon.com, gillete.com, and gq.com. But also niche ones like beardbrand.com. This allows you to see what other lucrative pages and top keywords they’re ranking for, that you might also want to target. In the same example, we can see that Amazon and Gilette own a significant share of the traffic, which suggests the beard niche is one with a lot of transactional queries. While some queries related to “cooking” would show Youtube and other video-based websites, which means you’d need to create videos in addition to written content. An Ahrefs account is required to take this exam. Sign up for a free Webmaster Tools account or paid subscription if you don’t have one."
