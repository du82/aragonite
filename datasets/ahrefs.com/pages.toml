title = "Link Intersect"
description = "Learn how to find listicles to get links from and find websites to build citations for local SEO."
full_description = "Link Intersect is our competitive analysis tool that lets you see domains and pages which link to your competitors’ websites, but not yours. Let's say that we want to build links to our free AI writing tools. A perfect place to do that would be in listicles that mention other similar tools like ChatGPT, Jasper, and Copy.ai. Then hit Show link opportunities. This shows us all the referring pages that link to any of these homepages, but not to ours. Not all of them will be relevant. To narrow them down, click on the Links to competitors dropdown and select All competitors. To narrow in on just pages coming from authoritative websites, use the filters at the top. Select Do-follow and filter for DR: From 50. Then hit Show results. Let’s say that we want to build links for our fictional plumbing website. To do this, we first need to search on Google for plumbers in our city. Set all URLs to Exact URL mode since citation links usually point to the homepage of local service providers Then, hit Show link opportunities. This shows us a list of domains, many of which are clearly directories where you can add your company’s details. An Ahrefs account is required to take this exam. Sign up for a free Webmaster Tools account or paid subscription if you don’t have one."
