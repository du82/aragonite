["https://ahrefs.com/blog/web-explorer"]
title = "Introducing Web Explorer by Ahrefs"
description = "Showing you how to make the most out of Ahrefs. Mostly through: how-to videos, product updates, webinars, and brochures."
full_description = '''Product BlogIntroducing Web Explorer by Ahrefs By Andrei Țiț ✓ Reviewed by Rebekah Bek June 8, 20237 min read<img src="https://ahrefs.com/blog/wp-content/uploads/2022/03/Andrei-Tit-28_cropped.png" width="85" height="85" alt="Andrei Țiț" class="avatar avatar-85 wp-user-avatar wp-user-avatar-85 alignnone photo" /> Andrei Țiț Showing you how to make the most out of Ahrefs. Mostly through: how-to videos, product updates, webinars, and brochures. Article PerformanceData from AhrefsLinking websites 100 Sign up for AhrefsGet SEO metrics of any website or URL.The number of websites linking to this post.This post's estimated monthly organic search traffic.Get the week's best marketing content Email Subscription Subscribe Leave this field empty if you're human: Contents Ahrefs’ toolkit just got bigger with the release of a one-of-a-kind SEO tool: Web Explorer.ContentsWhat Web Explorer doesAt its core, Web Explorer lets you search through our search engine’s (yep.com) entire database of pages, domains, and links using search operators. But there’s more to it.1. See the web like search engines see it (for real)When we say you can search through yep.com’s database of 500 billion pages, we actually mean it.No search engine lets you do this. Not even Google.The “About xxx results” number that appears at the top of Google’s first page of search results is just an estimation, since Google only fetches one page at a time from its index. This means Google doesn’t know how many results there are until it reaches the last page. Hence, the estimate might be close or way off, like in the example below:<img decoding="async" width="1770" height="1432" class="wp-image-160843" src="https://ahrefs.com/blog/wp-content/uploads/2023/06/image11-1.jpg" alt="Number of search results on Google's first and last pages" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/06/image11-1.jpg 1770w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image11-1-525x425.jpg 525w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image11-1-768x621.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image11-1-1536x1243.jpg 1536w" sizes="(max-width: 1770px) 100vw, 1770px">However, with Web Explorer, you get to see all relevant search queries indexed by yep.com for your topic—including similar ones that might have been omitted on purpose by Google.And also specific properties that make the page appear here, like the presence of backlinks with a certain word in the anchor, word in the title, and so on.<img decoding="async" width="1999" height="888" class="wp-image-160844" src="https://ahrefs.com/blog/wp-content/uploads/2023/06/image17-1.png" alt="Search results for &quot;restaurants in singapore,&quot; via Ahrefs' Web Explorer" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/06/image17-1.png 1999w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image17-1-680x302.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image17-1-768x341.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image17-1-1536x682.png 1536w" sizes="(max-width: 1999px) 100vw, 1999px">2. Search pages by the anchor and URLs of their backlinks and outlinksWeb Explorer also makes it easy to find and access information about pages, backlinks, and outlinks in one place.Use it to quickly search a page’s anchors and URLs of their backlinks and outlinks.For example, (1) when you filter on outlink properties—such as pages with certain words in the anchor text of their outgoing links—you can (2) click on the “Matching linked pages” dropdown to see them.<img decoding="async" width="1999" height="952" class="wp-image-160846" src="https://ahrefs.com/blog/wp-content/uploads/2023/06/image1.png" alt="Filtering pages by outlink properties, via Ahrefs' Web Explorer" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/06/image1.png 1999w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image1-680x324.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image1-768x366.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image1-1536x732.png 1536w" sizes="(max-width: 1999px) 100vw, 1999px">Similarly, (1) when you filter on inlink properties—such as pages with certain words in the anchor text of their backlinks—you can (2) click on the “Matching referring pages” dropdown to see them.<img decoding="async" width="1999" height="996" class="wp-image-160847" src="https://ahrefs.com/blog/wp-content/uploads/2023/06/image7-2.png" alt="Filtering pages by inlink properties, via Ahrefs' Web Explorer" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/06/image7-2.png 1999w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image7-2-680x339.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image7-2-768x383.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image7-2-1536x765.png 1536w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image7-2-400x200.png 400w" sizes="(max-width: 1999px) 100vw, 1999px">This turns Web Explorer into a versatile research tool for various use cases, in particular link building–related ones. We’re going to touch on them later. But first, let’s go over the interface.How Web Explorer worksIn essence, Web Explorer is all about search and custom reports.To use it, type in a keyword and add the following advanced search operators under the “+” dropdown.<img decoding="async" width="1892" height="1348" class="wp-image-160848" src="https://ahrefs.com/blog/wp-content/uploads/2023/06/image14-1.png" alt="Advanced search operators, via Ahrefs' Web Explorer" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/06/image14-1.png 1892w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image14-1-597x425.png 597w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image14-1-768x547.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image14-1-1536x1094.png 1536w" sizes="(max-width: 1892px) 100vw, 1892px">Here are some advanced Web Explorer search operators:intitle: Find pages with certain words in their titles.indescription: Find pages with certain words in their meta descriptions.incontent: Find pages with certain words in their content.inh1: Find pages with certain words in their H1 tags.inh2: Find pages with certain words in their H2 tags.inurl: Find pages with certain words in their URLs.url: Limit results to those from a specific URL.site: Limit results to those from a specific website.outlinkanchor: Find pages with certain words in the anchor text of their outgoing links.outlinkcontext: Find pages with certain words in the anchor text or surrounding text of their outgoing links.outlinkurl: Find pages that link to a specific URL.outlinkdomain: Find pages that link to a specific website.backlinkanchor: Find pages with links from other websites that have certain words in their anchor text.backlinkcontext: Find pages with links from other websites that have certain words in their anchor text or surrounding text.backlinkurl: Find pages that are being linked to from a specific URL.backlinkdomain: Find pages that are being linked to from a specific website.Any of these operators can be combined. You can also use operators (AND, OR, +, –, and brackets) for nesting, much like Google search operators.<img decoding="async" width="1918" height="858" class="wp-image-160849" src="https://ahrefs.com/blog/wp-content/uploads/2023/06/image12-1.png" alt="Boolean search operators, via Ahrefs' Web Explorer" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/06/image12-1.png 1918w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image12-1-680x304.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image12-1-768x344.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image12-1-1536x687.png 1536w" sizes="(max-width: 1918px) 100vw, 1918px">For some quick ideas of how to use this tool, switch to the “Examples” tab, which contains the most common use cases as a set of predefined filters.Each use case is clickable and auto-completes itself as you type in a search input.<img decoding="async" width="1916" height="926" class="wp-image-160851" src="https://ahrefs.com/blog/wp-content/uploads/2023/06/image15-1.png" alt="Use cases, via Ahrefs' Web Explorer" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/06/image15-1.png 1916w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image15-1-680x329.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image15-1-768x371.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image15-1-1536x742.png 1536w" sizes="(max-width: 1916px) 100vw, 1916px">Once you hit search, you’ll get to the results page that is split into four sections.<img decoding="async" width="1999" height="1033" class="wp-image-160853" src="https://ahrefs.com/blog/wp-content/uploads/2023/06/image16-1.jpg" alt="Ahrefs' Web Explorer interface" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/06/image16-1.jpg 1999w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image16-1-680x351.jpg 680w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image16-1-768x397.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image16-1-1536x794.jpg 1536w" sizes="(max-width: 1999px) 100vw, 1999px">Filters – For further drilling on the pages that are of interest to you.Number of results – Based on the applied filters.Export feature – For the filtered results.Page report table – Has metrics such as word count, DR, UR, referring domains, external links, and so on.For custom search queries like this one that you’ve taken time to build, click on “Save report” to save them:<img decoding="async" width="1784" height="880" class="wp-image-160855" src="https://ahrefs.com/blog/wp-content/uploads/2023/06/image8.png" alt="Save custom reports, via Ahrefs' Web Explorer" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/06/image8.png 1784w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image8-680x335.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image8-768x379.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image8-1536x758.png 1536w" sizes="(max-width: 1784px) 100vw, 1784px">All saved reports will show up under the “My reports” tab on Web Explorer’s landing page.<img decoding="async" width="1854" height="1100" class="wp-image-160856" src="https://ahrefs.com/blog/wp-content/uploads/2023/06/image10-1.png" alt="Saved reports, via Ahrefs' Web Explorer" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/06/image10-1.png 1854w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image10-1-680x403.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image10-1-768x456.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image10-1-1536x911.png 1536w" sizes="(max-width: 1854px) 100vw, 1854px">Now that you’ve familiarized yourself with the interface, let’s get to some unique use cases.Use casesSince Web Explorer makes it possible to search for pages by anchors and URLs of their backlinks and outlinks, we’re going to cover some link building–related use cases.1. Find pages that contain certain keywords in the anchor text of their outgoing linksA great way to build links is to search for pages that link to topics you’ve already covered. Then reach out to the site owners to include your website as an outlink.For example, we’ve already written an article about how to perform a content audit that includes a template.To find potential link prospects on this topic, let’s use the search operator outgoinglinkanchor: followed by the words “content template audit.”What this does is show us pages whose outgoing link’s anchor text contains our desired keyword.<img decoding="async" width="1996" height="422" class="wp-image-160857" src="https://ahrefs.com/blog/wp-content/uploads/2023/06/image2-2.png" alt="Find pages with a certain keyword in the anchor text of an outlink, via Ahrefs' Web Explorer" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/06/image2-2.png 1996w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image2-2-680x144.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image2-2-768x162.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image2-2-1536x325.png 1536w" sizes="(max-width: 1996px) 100vw, 1996px">If we want to further refine our prospects, we could add a Domain Rating (DR) filter to only show pages coming from high-authority websites of, say, above DR 30. You can even specify the URL depth and language.<img decoding="async" width="1999" height="883" class="wp-image-160858" src="https://ahrefs.com/blog/wp-content/uploads/2023/06/image13-1.png" alt="Filters applied, via Ahrefs' Web Explorer" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/06/image13-1.png 1999w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image13-1-680x300.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image13-1-768x339.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image13-1-1536x678.png 1536w" sizes="(max-width: 1999px) 100vw, 1999px">2. Find unlinked brand mentionsAnother low-hanging fruit is to find unlinked brand mentions.And since the author has already mentioned your brand and is familiar with it, you’re already halfway to winning a link.So let’s search for “Ahrefs” first. We’ll exclude pages that already link to ahrefs.com by appending the search with -outlinkdomain:ahrefs.com, as well as those results from ahrefs.com through the search operator -site:ahrefs.com.<img decoding="async" width="2000" height="404" class="wp-image-160860" src="https://ahrefs.com/blog/wp-content/uploads/2023/06/image6-2.png" alt="Find unlinked brand mentions, via Ahrefs' Web Explorer" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/06/image6-2.png 2000w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image6-2-680x137.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image6-2-768x155.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image6-2-1536x310.png 1536w" sizes="(max-width: 2000px) 100vw, 2000px">And right away, we’ve got ~45 million pages that mention Ahrefs but don’t link back to us.<img decoding="async" width="1999" height="993" class="wp-image-160862" src="https://ahrefs.com/blog/wp-content/uploads/2023/06/image5-1.png" alt="Results for finding unlinked brand mentions, via Ahrefs' Web Explorer" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/06/image5-1.png 1999w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image5-1-680x338.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image5-1-768x382.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image5-1-1536x763.png 1536w, https://ahrefs.com/blog/wp-content/uploads/2023/06/image5-1-400x200.png 400w" sizes="(max-width: 1999px) 100vw, 1999px">It’s impossible to reach out to all of them. Also, some pages may belong to the same domain.So a better way to search meaningful domains is to click on the “Settings” dropdown and select “One page per domain,” along with the other settings. This will narrow down our li'''
