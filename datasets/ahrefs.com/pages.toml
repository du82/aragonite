["https://ahrefs.com/academy/how-to-use-ahrefs/competitive-analysis/content-gap"]
title = "Content Gap"
description = "Learn how to perform content gap analysis to find untapped keyword opportunities, find striking-distance keywords, and more."
full_description = "Content Gap is our competitive analysis tool that lets you see keywords which your competitors' websites rank for, but yours doesn’t. Perform content gap analysis when creating new content. This involves finding the keywords your competitors rank for, but you don’t – it’s one of the quickest ways to find hundreds of great keywords that your website should be ranking for First, open the Competitive Analysis tool and select “keywords”. Then add our blog at the top and a couple of our organic search competitors in the bottom section. Hit Show keyword opportunities, and we’ll see what keywords we have in common with Moz and SEJ where at least one of them ranks in the Top 10, but Ahrefs isn’t ranking anywhere in the Top 100. Not all of them will be a good topic for us to go after. To narrow them down, click on the Competitors positions dropdown and select All competitors to find keywords where both competitors rank, but we don’t. This brings us down to 202 keywords that we could potentially target, like “pillar page”, advanced seo”, and so on. This is one of the fastest methods to shortcut your way to position #1 without doing too much link building and on-page optimizations And hit Show results. Next, apply a Target filter for positions: from 2-10. We exclude keywords in position #1 on purpose since that’s where SERP snippets are found. This is one of the fastest methods to shortcut your way to position #1 without doing too much link building and on-page optimizations Then hit Show keyword opportunities. This shows us all keywords that we could include as potential subtopics in our soon-to-be live article. “Magento 2 seo” seems to be a recurring keyword variation, along with “magento agency/experts”. An Ahrefs account is required to take this exam. Sign up for a free Webmaster Tools account or paid subscription if you don’t have one."
