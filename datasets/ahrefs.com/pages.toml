["https://ahrefs.com/academy/how-to-use-ahrefs/account/navigating"]
title = "Navigating Ahrefs"
description = "Get a walkthrough of Ahrefs’ core tools, where each of them is located, and when to use them."
full_description = "In this lesson, we’ll walk you through Ahrefs’ core tools, so you know where each of them is located and when to use them. First up is the Dashboard – which is not a core tool in itself, but the starting point of your Ahrefs journey. The Dashboard shows key SEO metrics for your projects: domains, subdomains, subfolders, or URLs that you track automatically over time. Site Explorer is our competitive research tool that helps you reverse engineer your competitors’ content strategy, link building strategy, you name it. Keywords Explorer is our keyword research tool. Through it, you can generate thousands of keyword ideas from our 20.4 billion keywords database and gain valuable insights. Site Audit is our website auditing tool. Use it to run complete website audits on your or your clients’ websites for over 140 technical and on-page issues – then fix them to make sure your site is visible to both users and website crawlers. Rank Tracker helps you track keyword rankings for your target for over 190 countries and regions—both on desktop and mobile. It also supports local tracking. Content Explorer is our search engine made for marketers that contains close to 14 billion pages. Use it to discover top-performing content in your niche and qualified link prospects. Web Explorer allows you to search through our search engine, Yep.com’s, database of 500 billion pages for your topic, including pages, backlinks, and outlinks—all in one place. Competitive Analysis is the home for various competitive tools that help you find gaps between you and your competitors’ content and backlinks. Backlinks alerts – Track new and/or lost backlinks to a target—whether that’d be a domain, subdomain, subfolder, or URL. New keywords alerts – Track new keyword rankings and significant position movements for your target. Mentions – Discover pages that mention specific phrases, keywords, or queries. This is great for following your SEO metrics. 2. Batch Analysis pulls SEO metrics for up to 200 domains at once. Just paste them and you’ll get a bulk backlink analysis with all the metrics you need: AR, DR, number of referring domains, backlinks, and more."
