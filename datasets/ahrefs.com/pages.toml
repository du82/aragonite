["https://ahrefs.com/academy/how-to-use-ahrefs/keywords-explorer/search-suggestions"]
title = "Search suggestions"
description = "Learn how to use the Search suggestions report to find high-volume, low-competition keyword ideas, informational and transactional keyword ideas, and more."
full_description = "While Google only shows a handful of suggestions, we show nearly all keyword ideas along with SEO metrics. To ensure a more comprehensive report, we also include search suggestions that do show up in Google, but are not currently in our database. Set the search volume filter to a minimum value of 500 and the Keyword Difficulty (KD) filter to a maximum of 10. The numbers suggested for the search volume and KD filters will vary based on the breadth of your niche. Feel free to play around with the filters until you get a list of keywords you’re satisfied with. SERP features are anything in the search engine results pages that are not traditional search results. They provide additional and related information on the search query. Depending on your goals, you can filter for different types of SERP features. For example, you can filter for featured snippets, knowledge panels, people also ask boxes, and so on. Informational queries are those that searchers use to gain more knowledge on a topic. Typically, they have modifiers like: Click “Apply”, then “Show results” to see queries that include one or more of the modifiers in your list. Transactional keywords are queries where searchers likely have purchase intent (i.e., they're looking to buy something). Typically, they have modifiers like: Click the “SERP” button beside any keyword to see the SERP Overview. This shows the first page of search results for your keyword along with important SEO metrics. Check out this video to learn how to do keyword research, or read some of the articles on the Ahrefs blog: An Ahrefs account is required to take this exam. Sign up for a free Webmaster Tools account or paid subscription if you don’t have one."
