["https://ahrefs.com/academy/how-to-use-ahrefs/ahrefs-seo-metrics/keyword-and-search-traffic"]
title = "Keyword and search traffic metrics"
description = "Learn about Ahrefs' search and keyword metrics: search volume, organic traffic, top keyword, Keyword Difficulty, traffic potential, Parent topic, and more."
full_description = "Ahrefs has an extensive keyword database of 28,7 billion keywords (and the largest US keyword database: 2 billion keywords), covering 226 geographic regions – the most covered by any SEO tool. Search volume represents the average number of times people search for a query in a target country in a given month. We use Google Keyword Planner data as a base to build our model, which is the data that you see in every other third party keyword tool. You can change the search volume graph period from: last year, to last two years, to all time. This should help you visualize trends much more easily. This metric is calculated by counting all search queries a URL, subfolder, or domain ranks for in the top 100 search results. For example, if I search for “how to lose weight,” Healthline’s article appears at the top of Google. That’s one keyword. But they also rank for “how to lose weight fast,” “weight loss,” and over 6,000 keywords in the US alone. Our keyword rankings are grouped by country since search results will usually differ based on location and Google ccTLD. This metric is an estimation of how much organic search traffic your target website, subfolder or URL gets each month. We estimate the search traffic your target gets from each of those keywords based on its ranking position, monthly search volume and our estimated CTR for that position We don’t know all possible search queries a page ranks for. On a daily basis, 15% or around 500 million searches have never been seen before by Google's search engine. These four things contribute to discrepancies in search traffic estimations for our tools as well as any other tool providing a similar metric. However, these estimates work well for learning whether competitors’ websites get more or less organic search traffic compared to yours. Traffic value shows the value of the organic search traffic, if it were to be acquired via PPC in Google Ads. To calculate it, we take the estimated search traffic for a keyword and multiply it by the CPC value for that keyword. Then we sum the total values to come up with a total traffic value metric."
