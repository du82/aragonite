["https://ahrefs.com/academy/how-to-use-ahrefs/keywords-explorer/overview"]
title = "Overview"
description = "Learn how to see global search volume for any keyword, check its Keyword Difficulty and traffic potential, and more."
full_description = '''In this report, we give you all the in-depth SEO metrics you need to make quick and informed decisions about a keyword. For example, the query “how to lose weight” gets 60,000 searches per month in the United States alone. If we go with the same query as before, we’ll notice it has a global search volume of ~205,000 monthly searches. So if your customer base is global, you might want to look at global volumes rather than country-specific search volumes. Keyword Difficulty estimates how hard it will be to rank in the top 10 for a given keyword. It's scored on a scale from 0-100. To calculate it, we look at the number of referring domains pointing at the current top-ranking pages. If you hover over each KD score, you’ll see the estimated number of backlinks from different websites you need to rank on the first page for this keyword. Keyword Difficulty isn’t meant to discourage you from ranking for a particular keyword. It’s intended to help you estimate the resources required to rank for it. If ranking for a keyword is vital for your business, you may still want to pursue it, even if the KD score is high. Traffic potential shows the sum of organic traffic that the #1 ranking page for your target keyword receives from all the keywords that it ranks for. For example, the keyword “submit website to search engines” has a traffic potential of 6,200, even though it only has a volume of 500. For example, the query “Google founders” gets ~7,300 searches per month, but the search results are only clicked ~1,800 times. For example, if you search for “Google founders," you get an answer instantly, so there's no need to click on a result. In general, you can use the Clicks metric to decide if a keyword is worth targeting. If a keyword has a high search volume but a low number of clicks, you might not get much organic traffic, even if you rank well. The Cost-Per-Click (CPC) metric shows the average cost of a click on the paid search results for a given keyword.'''
