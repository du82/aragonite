["https://ahrefs.com/academy/how-to-use-ahrefs/ahrefs-seo-metrics/backlink"]
title = "Backlink metrics"
description = "Learn about Ahrefs' backlink metrics: backlinks and referring domains, URL rating, Domain Rating, and Ahrefs Rank."
full_description = "Ahrefs has the most trusted backlinks data in the SEO industry (according to Aira’s State of Link Building Report): We also have the #1 most active crawler in the SEO industry (according to CloudflareRadar) and our own search engine (Yep.com) which helps us improve our crawling speed and breadth. It is precisely this technology that allows us to have the largest index of 35.0 trillion external backlinks. The backlinks metric is a total count of all backlinks pointing at a target, while referring domains is the count of unique websites that point at a target. These numbers will fairly go up and down in tandem as new links are discovered and dropped. Because of this, it’s perfectly normal for our backlinks and referring domains metrics to be different from other tools since we all crawl the web differently. The total number of backlinks and referring domains is a so-called “bottom-level metric.” We use these to build more and more metrics like URL rating, which is our second link metric. URL rating represents the overall strength of a page’s backlink profile, measured on a logarithmic scale from 0 to 100. If you’re familiar with Google’s PageRank (PR) formula, it should be easy for you to understand Ahrefs’ URL Rating since we use similar principles in our calculations. Those similarities include: While UR and PR are similar in nature, URL rating is not a direct replacement. Our algorithm is simpler compared to Google’s, which has evolved quite a bit over the years. From our own studies, we’ve also found a clear positive correlation between URL rating and search traffic. This means that higher UR pages get more search traffic. Domain Rating represents the overall strength of a website’s backlink profile and considers both the size and quality of the links pointing at a website. Like UR, DR is also plotted on a logarithmic scale from 0-100. To calculate DR, we use nearly the same principles as URL Rating, but we look at links between domains instead of pages. The more unique websites a site links to, the less so called “DR equity” it’ll transfer to each of them."
year_published = 2025
