["https://ahrefs.com/blog/ai-features"]
title = "All of Ahrefs AI features, explained"
description = "Boost your productivity with Ahrefs AI features that automate keyword research, content optimization, and technical SEO processes."
full_description = '''Product BlogAll of Ahrefs AI features, explained By Andrei Țiț Updated: December 5, 20246 min read<img src="https://ahrefs.com/blog/wp-content/uploads/2022/03/Andrei-Tit-28_cropped.png" width="85" height="85" alt="Andrei Țiț" class="avatar avatar-85 wp-user-avatar wp-user-avatar-85 alignnone photo" /> Andrei Țiț Showing you how to make the most out of Ahrefs. Mostly through: how-to videos, product updates, webinars, and brochures. Article PerformanceData from AhrefsOrganic traffic 246Linking websites 78 Sign up for AhrefsGet SEO metrics of any website or URL.The number of websites linking to this post.This post's estimated monthly organic search traffic.Get the week's best marketing content Email Subscription Subscribe Leave this field empty if you're human: Contents Can Ahrefs be a reliable AI copilot for SEO, without chipping away at your creativity? Absolutely! Meet our latest AI features designed to boost your productivity by automating keyword research, content optimization, and technical SEO processes. Let’s dive in. 1. AI Keyword Suggestions Brainstorming keyword ideas can be challenging. New website entrants are fighting for long-tail keyword scraps, while established brands face saturation with popular search terms.Ahrefs’ built-in AI suggestions in Keywords Explorer can quickly kickstart your keyword research from a list of lateral keywords.Just click on the Ask AI search bar and choose from the available presets. I’ll go with “challenges and pain points” for a common keyword like “marketing”.Our AI keyword assistant will then brainstorm a list of common challenges faced across various types of marketing activities.<img decoding="async" width="1312" height="1132" class="wp-image-177678" src="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-3.png" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-3.png 1312w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-3-493x425.png 493w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-3-768x663.png 768w" sizes="(max-width: 1312px) 100vw, 1312px">The best part? This works with other languages too. Just make sure to type in the desired language at the end of the query, choose the location, and hit search.<img decoding="async" width="1312" height="368" class="wp-image-177679" src="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-4.png" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-4.png 1312w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-4-680x191.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-4-768x215.png 768w" sizes="(max-width: 1312px) 100vw, 1312px"> 2. AI Search Intent Search intent – the reason behind a search query – is often obvious (transactional in this case).<img decoding="async" width="1438" height="746" class="wp-image-177680" src="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-5.png" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-5.png 1438w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-5-680x353.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-5-768x398.png 768w" sizes="(max-width: 1438px) 100vw, 1438px">For queries with multiple intents or unclear ones, AI can help analyze the different types of search intents and show what content angles to tackle next.Let’s take the keyword “calligraphy”, scroll all the way down to the SERP Overview table in Keywords Explorer, and click the Identify intents button.<img decoding="async" class="alignnone size-full wp-image-177698" src="https://ahrefs.com/blog/wp-content/uploads/2024/07/2024-07-29_14-11-44.png" alt width="936" height="308" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/07/2024-07-29_14-11-44.png 936w, https://ahrefs.com/blog/wp-content/uploads/2024/07/2024-07-29_14-11-44-680x224.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/07/2024-07-29_14-11-44-768x253.png 768w" sizes="(max-width: 936px) 100vw, 936px">In addition to more granular user intents, our SERP AI will break down the percentage of total traffic that goes to each one of them – something no other SEO tool can do at the moment!<img decoding="async" width="1994" height="1376" class="wp-image-177681" src="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-6.jpg" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-6.jpg 1994w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-6-616x425.jpg 616w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-6-768x530.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-6-1536x1060.jpg 1536w" sizes="(max-width: 1994px) 100vw, 1994px">Use them as hints as to what content angles you can use to rank.For example, we could go all-in on targeting the “calligraphy” keyword with a definitional article about the history and types of calligraphy.Or even better, target multiple search intents with just one comprehensive article, covering all dominant intents in the recommended proportions:55% - Definition and background information34% - Learning calligraphy11% - Calligraphy supplies 3. Search Intents (AI-powered)Some of you may still prefer the traditional search intent “buckets”.We hear you! That’s why, using our internal LLM and AI models, we’ve enhanced the way we map search intent attributes for any given keyword.These include the classic categories—Informational, Navigational, Commercial, and Transactional—along with additional attributes like Branded and Local (e.g., “near me [x]” or “[city] keyword”) intents.Together, this enhanced mapping should help you align your content marketing strategy with every stage of your user’s buyer journey.NOTE: Organic keywords by intent graph To get a high-level view of the distribution of search intents across all the organic keywords your website ranks for, check out the Organic keywords by intent chart under the Overview report in Site Explorer.<img decoding="async" class="alignnone size-full wp-image-183106" src="https://ahrefs.com/blog/wp-content/uploads/2024/07/Search-intents-graph.gif" alt="Ahresf Search Intents Graph" width="2120" height="1080"> 4. AI Content Helper Standing out in search results used to be easy: create a decent piece of content, stuff it with keywords, and watch it climb rankings.But to see real success today, you need to create content that earns the trust of your audience, not just search engines.Here’s where AI Content Helper — our content optimization tool — steps in. But with a twist.<img decoding="async" class="alignnone size-full wp-image-183090" src="https://ahrefs.com/blog/wp-content/uploads/2024/07/AI-Content-Helper.gif" alt="Ahrefs AI Content Helper" width="1084" height="720">Rather than focusing on keyword density, we identify the core topics for your target keyword and score your – and your competitor’s content – against them, to make sure you’re filling in the gaps for comprehensive topical coverage.Here’s an example for the keyword “how to plan a trip to southeast asia” and an article written on it.<img decoding="async" class="alignnone size-full wp-image-183091" src="https://ahrefs.com/blog/wp-content/uploads/2024/07/2024-12-05_16-34-25.jpg" alt="Topics in Ahrefs AI Content Helper" width="1190" height="1654" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/07/2024-12-05_16-34-25.jpg 1190w, https://ahrefs.com/blog/wp-content/uploads/2024/07/2024-12-05_16-34-25-306x425.jpg 306w, https://ahrefs.com/blog/wp-content/uploads/2024/07/2024-12-05_16-34-25-768x1067.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2024/07/2024-12-05_16-34-25-1105x1536.jpg 1105w" sizes="(max-width: 1190px) 100vw, 1190px">Judging by the low topical score (68), we can see that the “budgeting and costs” topic needs improvement.Just click on Get recommendations under “View details”, and you’ll get word-for-word suggestions on how to address the topical gap in your existing content.<img decoding="async" class="alignnone size-full wp-image-183092" src="https://ahrefs.com/blog/wp-content/uploads/2024/07/AI-Content-Suggestions.gif" alt="Ahrefs AI Content Suggestions" width="1980" height="1080">NOTE: FREE WHILE IN BETA AI Content Helper is currently available for free in 174 languages, to all new paid plans. After the beta, it will be offered as a project add-on. RELATED READ: AI Content Helper: Content Optimization That Doesn’t Turn Your Brain Of 5. AI Overview Feeling anxious about Google’s rollout of AI Overviews? Don’t be.We now track AI Overviews in most of our core tools, so you can be prepared and rank ahead of your comeptition for keywords that trigger this new SERP feature.<img decoding="async" class="alignnone size-full wp-image-183114" src="https://ahrefs.com/blog/wp-content/uploads/2024/07/2024-12-05_18-04-45-scaled.jpg" alt="Ahrefs AI Overview" width="2560" height="1206" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/07/2024-12-05_18-04-45-scaled.jpg 2560w, https://ahrefs.com/blog/wp-content/uploads/2024/07/2024-12-05_18-04-45-680x320.jpg 680w, https://ahrefs.com/blog/wp-content/uploads/2024/07/2024-12-05_18-04-45-768x362.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2024/07/2024-12-05_18-04-45-1536x723.jpg 1536w, https://ahrefs.com/blog/wp-content/uploads/2024/07/2024-12-05_18-04-45-2048x964.jpg 2048w" sizes="(max-width: 2560px) 100vw, 2560px">According to Google, AI Overviews are designed to drive more clicks than traditional search results. This means your website could see an influx of more qualified traffic to your website. 6. AI Translations If you do international SEO, translating keywords for regional markets should be a top priority.The process is not that easy though. You’ll need to:Compile a keyword list with SEO metricsHire experienced translatorsTranslate keywords and make sure their localized nuances are preserved (a process called transcreation)Create a content plan based on the translated keywordsAhrefs’ AI translator can do all these at once, saving you time (and translator fees) to scale your content strategy globally.Start from a saved keyword list, choose a preferred language or dialect followed by the keyword location, and hit “Translate”.<img decoding="async" width="1176" height="720" class="wp-image-177687" src="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-12.gif">What sets it apart from other translation management tools is that you’ll get translated alternatives of each keyword, so you can choose the version with the highest keyword search volume.For example, there’s a bunch of different ways to say “popcorn” across Spanish-speaking countries. Our AI translator is able to detect the most popular variation in each country.<img decoding="async" width="1160" height="722" class="wp-image-177688" src="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-13.png" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-13.png 1160w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-13-680x423.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-13-768x478.png 768w" sizes="(max-width: 1160px) 100vw, 1160px">NOTE: FREE WHILE IN BETA Ahrefs AI translator currently offers automatic translations for 40+ languages and dialects in 180+ countries, with more coming soon. 7. AI Technical SEO Wouldn’t it be great if you could fix technical issues on your website, without asking developers for help?Soon, you’ll be able to do that with Patches.Patches are fixes that you can create and push by yourself in any of Site Audit’s reports.<img decoding="async" width="2048" height="924" class="wp-image-177689" src="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-14.png" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-14.png 2048w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-14-680x307.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-14-768x347.png 768w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-14-1536x693.png 1536w" sizes="(max-width: 2048px) 100vw, 2048px">For example, if an SEO crawl flags your website for too short meta descriptions, you can address the issue yourself. Instead of exporting data, writing a support ticket, and sending it to IT with the appropriate fixes, you could:Click on “Patch it”Enter a new meta descriptionAnd publish it on your websiteAll changes will be pushed live via JavaScript snippets and CloudFlare workers (coming soon), which means we’ll handle the whole backend so you can focus on the big picture.Cool story bro, but where’s AI? Just click on Ask AI for help with menial SEO tasks like rewriting titles and meta descriptions, speeding up your workflow even more.<img decoding="async" width="1298" height="1128" class="wp-image-177690" src="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-15.png" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-15.png 1298w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-15-489x425.png 489w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-15-768x667.png 768w" sizes="(max-width: 1298px) 100vw, 1298px">NOTE Patches and Ask AI are available as paid project boost add-ons. <img decoding="async" src="https://downloads.intercomcdn.com/i/o/dic5omcp/1251711075/a999f36015617459a68998142ffa/Patches.gif?expires=1733412600&amp;signature=2cbeb1a2c7db6df862601f861719b8441efeab9b33fc57d0b0b674bc24535b8d&amp;req=dSIiF85%2FnIFYXPMW1HO4zc5o8bRjp82dnmLZme%2FO%2FB0kPXJVTgZoV8oEzfoI%0A74ca%0A"> Bonus: Free Ahrefs AI features Most of the AI features mentioned so far can be accessed directly within Ahrefs’ interface, as long as you have a new Standard plan or higher (AI Content Grader is available only for Enterprise customers).Additionally, we have 40+ free AI writing tools as part of the Ahrefs ecosystem.<img decoding="async" width="2048" height="993" class="wp-image-177691" src="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-16.png" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-16.png 2048w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-16-680x330.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-16-768x372.png 768w, https://ahrefs.com/blog/wp-content/uploads/2024/07/word-image-177675-16-1536x745.png 1536w" sizes="(max-width: 2048px) 100vw, 2048px">These tools are primarily designed for copywriting, generating content on the fly in various tones and for various purposes, like SEO, content marketing, social media, and even product-related tasks.We’ve also got our own Word Counter, which use AI to help you extract keywords and entities out of a paragraph for '''
