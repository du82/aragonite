["https://ahrefs.com/academy/how-to-use-ahrefs/account/add-first-portfolio"]
title = "How to add and use portfolios"
description = "Learn what a portfolio is in Ahrefs, and how to add your first one."
full_description = "A portfolio is a list of target URLs that you can group together to further analyze their metrics in bulk. Depending on your plan, you can group up a list of URLs from up to 10 different domains and analyze their aggregate metrics on the Dashboard. Here, you can define the scope of each target URL—much like you would with a project. Then you can name the portfolio and share it with the appropriate team members. Once saved, the portfolio will be shown on your dashboard along with top-level metrics. Clicking on any of the metrics will take you to the corresponding report in Site Explorer. See the top winners and losers in terms of their top pages and keywords: (Top pages report > Traffic filter: Improved) Check out the pace at which they acquire new links and referring domains: (Backlinks report > Dofollow > New backlinks > Status: Newly published) Study their paid ads and paid keywords to understand which ones resonate with your target audience: (Paid pages report > Keywords and Ads nested tables) If you have an internal content team, create a portfolio for each content writer and track their performance over time. For example, our content lead, Joshua Hardwick, has written 147 articles, which rank for 46,000 keywords that generate close to 250,000 organic search visits a month. If you’re an agency, create a portfolio of your published content on your customer’s website and track the percentage (%) of organic traffic and backlinks it has generated compared to the rest of the website. For example, if we were to group our free tools into a portfolio, we’d notice they generate close to 1 million organic search traffic a month. An Ahrefs account is required to take this exam. Sign up for a free Webmaster Tools account or paid subscription if you don’t have one."
