["https://ahrefs.com/academy/how-to-use-ahrefs/ahrefs-crawler/crawl-budget"]
title = "Crawl budget"
description = "Learn about the trade-off between freshness and good coverage when building a big index of data like Ahrefs'."
full_description = "“Fresh index, good coverage, not get blocked. Choose two.”– Dmytro Gerasymenko, Founder & CEO of Ahrefs Freshness implies running regular crawls to keep information up-to-date. Good coverage implies crawling as many pages as possible. Yet, you can’t have both running at full capacity, otherwise you’d get blocked by webmasters and hosting companies. The answer to this is implementing a crawl budget, which refers to the number of URLs a crawler can and wants to crawl. Crawling a website too fast can add too much load to a server. Since this can lead to poor user experience or result in our crawler getting blocked, our crawl rate takes into account: Website size – Small websites with high-quality links will most likely be crawled in full as compared to larger websites with low-quality links that might get only partially crawled. Crawl demand, or crawl priority, represents the level of importance attached to crawling and recrawling pages on a website. URL popularity (URL Rating) – The higher the quality of the backlinks pointing to a page, the higher the priority. Website popularity (Domain Rating) – The higher the strength of a website’s backlink profile, the higher the priority. An Ahrefs account is required to take this exam. Sign up for a free Webmaster Tools account or paid subscription if you don’t have one."
