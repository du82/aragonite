["https://ahrefs.com/academy/how-to-use-ahrefs/dashboard/overview"]
title = "Overview"
description = "Learn about all the things you can do with Ahrefs' Dashboard: monitor the performance of multiple URLs, organize your keywords and projects, and more."
full_description = "Here, you’ll get a quick overview of all your projects, along with the growth, stagnation, or decline of important SEO metrics for each of them. Site Explorer metrics are updated every 24 hours, while Rank Tracker and Site Audit metrics are based on the latest update or last crawl. Clicking on Show competitors at the bottom of any project will expand the list of competitors added during project setup. The bolded metrics and deltas exceed the values of the main target. If you’ve connected your Google account with Ahrefs, click on the GSC performance tab to see your GSC data on the Dashboard. This shows the percentage of clicks that Google has filtered out to protect the privacy of the user making the query. This helps to paint a more accurate picture of the actual clicks landing on your website. For more information on anonymized clicks hidden by Google, read our article: https://ahrefs.com/blog/gsc-hidden-terms-study/ You can also group a list of URLs from 10 different domains in a portfolio and get a comprehensive view of their aggregated metrics (organic traffic, organic keywords, backlinks, referring domains, etc.). Just like with projects, clicking on any of the metrics will take you to the corresponding report in Site Explorer. Only this time, the metrics will be for all the aggregated URLs. Create author portfolios to spot which authors are bringing in the most traffic, which ones have a higher publishing pace, and so on Set up client portfolios to demonstrate how your published content is performing against your client's whole website You can set notifications for each project directly from the Dashboard and get emails straight into your inbox for: If you’re managing several projects but want to see the important ones fast, click on the “Star” icon. You’ll then be able to surface these projects fast by clicking on “Starred”. You can even pin them to the Dashboard by toggling on “Pin starred”. Sort projects into folders so that they're even easier to find and share. Choose to share specific folders with certain team members, but not others."
