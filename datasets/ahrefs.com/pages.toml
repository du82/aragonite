["https://ahrefs.com/blog/ecommerce-seo"]
title = "Ecommerce SEO: A Beginner's Guide"
description = "Chris is an SEO director who has 10 years of experience in SEO, agency side. When not involved in SEO, he enjoys messing around with vintage synthesizers, walks on sandy beaches, and a good cup of tea."
full_description = '''<img class="category-icon" src="https://ahrefs.com/blog/wp-content/themes/Ahrefs-4/images/categories/icons/general-seo.svg" alt="General SEO" title="General SEO"/>General SEOEcommerce SEO: A Beginner’s Guide By Chris Haines August 18, 2023<img src="https://ahrefs.com/blog/wp-content/uploads/2023/01/ChrisHaines_2x-120x120.jpg" width="85" height="85" alt="Chris Haines" class="avatar avatar-85 wp-user-avatar wp-user-avatar-85 alignnone photo" /> Chris Haines Chris is an SEO director who has 10 years of experience in SEO, agency side. When not involved in SEO, he enjoys messing around with vintage synthesizers, walks on sandy beaches, and a good cup of tea. Article PerformanceData from AhrefsOrganic traffic 977Linking websites 314 Sign up for AhrefsGet SEO metrics of any website or URL.The number of websites linking to this post.This post's estimated monthly organic search traffic.Get the week's best marketing content Email Subscription Subscribe Leave this field empty if you're human: Contents 22 min readSummarize for a quick grasp. Summarize Summary E-commerce SEO is the process of optimizing an online store to improve its visibility and rankings in search engines like Google. It focuses heavily on improving the performance of category and product pages, as these tend to be the most lucrative.Here's how to do ecommerce SEO in five steps:Give your store a good technical foundation. It should be secure (HTTPS), well-structured, and have correctly implemented faceted navigation.Do keyword research. Find the products and product types people are searching for with a keyword research tool like Ahrefs.Optimize your pages. Make sure they have a compelling title tag and meta description, descriptive URLs, and unique product and category descriptions.Build links. Get other websites to link to you to show Google that your store deserves to rank.Do content marketing. Target informational searches about products with a blog.This should be enough to get any store off on the right foot when it comes to SEO.This summary is not a substitute for reading the article in full, as you may miss out on important nuances.If you want to drive more potential customers from the search results to your online store, ecommerce SEO may be just the ticket.Keep reading to learn what ecommerce SEO is, why it’s important, and how to master it.ContentsWhat is ecommerce SEO?Ecommerce SEO is the process of optimizing an online store to improve its visibility and rankings in search engines like Google. It focuses heavily on improving the performance of category and product pages, as these tend to be the most lucrative.It’s generally a more cost-effective way to reach your customers rather than bidding on expensive paid advertising keywords.Chapter 1. Technical SEOTechnical SEO may seem the most daunting starting point, but it’s crucial for ecommerce sites. That’s mainly because of issues relating to faceted navigation, but there are also a few things to keep in mind. Let’s go through them.Secure your site with HTTPSHTTPS is a secure protocol for transferring data between websites and visitors. It prevents hackers from stealing sensitive information that visitors commonly share with online stores, such as their name, address, and credit card details.It’s also been a minor Google ranking factor since 2014.You’ll know if your store uses HTTPS because it’ll have a “padlock” icon in the address bar that looks like this:<img decoding="async" width="586" height="138" class="wp-image-164671" src="https://ahrefs.com/blog/wp-content/uploads/2023/08/image10-4.png" alt="HTTPS &quot;padlock&quot; icon in a Chrome browser ">Most popular ecommerce platforms use HTTPS, so it shouldn’t be a concern for most people. But if it is, make sure to fix it.Further readingWhat Is HTTPS? Everything You Need to KnowMake your site structure easy to navigateSite structure is how your website’s pages are organized and interlinked. Most ecommerce stores organize their pages roughly like this: <img decoding="async" width="1600" height="1738" class="wp-image-164666" src="https://ahrefs.com/blog/wp-content/uploads/2023/08/ecommerce-seo-1.png" alt="How to structure e-commerce sites " srcset="https://ahrefs.com/blog/wp-content/uploads/2023/08/ecommerce-seo-1.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2023/08/ecommerce-seo-1-391x425.png 391w, https://ahrefs.com/blog/wp-content/uploads/2023/08/ecommerce-seo-1-768x834.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/08/ecommerce-seo-1-1414x1536.png 1414w" sizes="(max-width: 1600px) 100vw, 1600px">Here are two reasons why this structure makes sense:It’s easy to navigate your ecommerce site architecture – Visitors can find what they’re looking for in just a few clicks.It helps Google and other search engines find your pages – Google can “follow” internal links from page to page.Getting your site architecture right from the start also means you’ll avoid the headache of redesigning your site structure later on. When it comes to internal links, it’s best to keep it simple to start with. You can use the arrows in the illustration above as guidance on how to interlink your pages.For example, your homepage should link to your category pages, which should link to the relevant subcategory pages, which should link to the relevant products.Further readingWebsite Structure: How to Build Your SEO FoundationImplement faceted navigation correctly to give your pages the best chance at ranking wellFaceted navigation allows visitors to filter the products on category and subcategory pages. Here’s what it looks like: <img decoding="async" width="976" height="1999" class="wp-image-164672" style="width: 390px; height: 800px;" src="https://ahrefs.com/blog/wp-content/uploads/2023/08/image22-1.png" alt="Faceted navigation example, via jbl.com " srcset="https://ahrefs.com/blog/wp-content/uploads/2023/08/image22-1.png 976w, https://ahrefs.com/blog/wp-content/uploads/2023/08/image22-1-208x425.png 208w, https://ahrefs.com/blog/wp-content/uploads/2023/08/image22-1-768x1573.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/08/image22-1-750x1536.png 750w" sizes="(max-width: 976px) 100vw, 976px">Despite its usefulness for visitors, it can cause serious SEO issues for ecommerce websites because filter combinations often create new parameterized URLs.For example, if you filter for on-ear headphones, it may create a URL like this:/headphones/?color=red&brand=sony&type=wiredEven if you only have a handful of filters, there can be thousands of combinations. That means thousands of new URLs that Google can end up crawling and potentially indexing.That isn’t good because it can: Weaken important pages’ ability to rank – Filter combinations can often lead to the creation of multiple URLs with the same content. Unless Google realizes this (which doesn’t always happen), ranking signals will get split between the duplicate pages.Prevent Google from crawling important pages – Google will only devote finite resources to crawling your site. If it has to crawl a load of junk, it may not have the resources to crawl all important pages. There are various solutions to these issues. For beginners and intermediates, a simple option is to canonicalize faceted URLs to their master category or subcategory.Some ecommerce SEO platforms do this out of the box. Check if this is the case for your site by installing Ahrefs’ SEO Toolbar, visiting a few faceted URLs, and checking the “Indexability” tab. If the canonical URL is non-faceted, chances are this isn’t an issue on your site.Here’s an example of this in action:<img decoding="async" width="1330" height="618" class="wp-image-164674" src="https://ahrefs.com/blog/wp-content/uploads/2023/08/image18-2.png" alt="Non-canonical URL example, via jbl.com " srcset="https://ahrefs.com/blog/wp-content/uploads/2023/08/image18-2.png 1330w, https://ahrefs.com/blog/wp-content/uploads/2023/08/image18-2-680x316.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/08/image18-2-768x357.png 768w" sizes="(max-width: 1330px) 100vw, 1330px">Further readingFaceted Navigation: Definition, Examples & SEO Best PracticesChapter 2. Keyword research for ecommerce websitesKeyword research helps you find relevant keywords and understand how people search for what you sell. You can use this knowledge to create category pages, subcategory pages and product pages on your ecommerce site that cater to search demand. Let’s look at how to do this.Get keyword ideas for subcategory pages with keyword researchSubcategory pages show the types of products you sell in a category. For example, a “headphones” category may have subcategories like “wired” and “wireless.”You probably already know some subcategories that make sense for your store. But as people search in many ways, it’s useful for SEO to create subcategories that align with those terms.Here’s how to find ideas for subcategories in Ahrefs’ Keywords Explorer:Enter a few broad keywords related to your categoryGo to the Matching terms reportLook for the types of things you sellHere are a few ideas for the “headphones” subcategories: <img decoding="async" width="828" height="1434" class="wp-image-164676" style="width: 414px; height: 717px;" src="https://ahrefs.com/blog/wp-content/uploads/2023/08/image21-1.png" alt="Subcategory ideas for a headphones e-commerce store, via Ahrefs' Keywords Explorer " srcset="https://ahrefs.com/blog/wp-content/uploads/2023/08/image21-1.png 828w, https://ahrefs.com/blog/wp-content/uploads/2023/08/image21-1-245x425.png 245w, https://ahrefs.com/blog/wp-content/uploads/2023/08/image21-1-768x1330.png 768w" sizes="(max-width: 828px) 100vw, 828px">Note that this isn’t all about search volumes. You should use common sense and choose terms that make sense as subcategories. For example, “audio technica open ear headphones” won’t be a suitable subcategory because it’s too specific. The same is true for “bone conduction headphones” unless you sell more than a couple of pairs.Here’s a quick cheat sheet for choosing subcategories for SEO:<img decoding="async" width="1600" height="2248" class="wp-image-164667" src="https://ahrefs.com/blog/wp-content/uploads/2023/08/ecommerce-seo-2.png" alt="How to choose e-commerce subcategories for SEO " srcset="https://ahrefs.com/blog/wp-content/uploads/2023/08/ecommerce-seo-2.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2023/08/ecommerce-seo-2-302x425.png 302w, https://ahrefs.com/blog/wp-content/uploads/2023/08/ecommerce-seo-2-768x1079.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/08/ecommerce-seo-2-1093x1536.png 1093w, https://ahrefs.com/blog/wp-content/uploads/2023/08/ecommerce-seo-2-1458x2048.png 1458w" sizes="(max-width: 1600px) 100vw, 1600px">Sidenote. Generally speaking, you shouldn’t choose more than a handful of subcategories. It makes your navigation messy and convoluted. Three to 10 is enough for most stores.Repeat the process for other categories.Find keywords for product pages with keyword researchEcommerce keyword research for products isn’t really a thing if you sell branded products, as people will search for the products themselves. For example, there are an estimated 622K monthly searches in the U.S. for “airpods pro.”<img decoding="async" width="922" height="770" class="wp-image-164678" style="width: 461px; height: 385px;" src="https://ahrefs.com/blog/wp-content/uploads/2023/08/image33-1.png" alt="Estimated U.S. monthly search volume for &quot;airpods pro,&quot; via Ahrefs' Keywords Explorer " srcset="https://ahrefs.com/blog/wp-content/uploads/2023/08/image33-1.png 922w, https://ahrefs.com/blog/wp-content/uploads/2023/08/image33-1-509x425.png 509w, https://ahrefs.com/blog/wp-content/uploads/2023/08/image33-1-768x641.png 768w" sizes="(max-width: 922px) 100vw, 922px">If you sell these headphones, your product page already targets that keyword.However, if you’re selling unbranded products or products from unknown names, you may want to find and target more descriptive terms that people search for.For example, let’s say you sell a pair of cat ear headphones. Unless people are specifically searching for the brand or model, it may be better to target a relevant keyword that people actually search for, such as “cat ear headphones.”<img decoding="async" width="950" height="788" class="wp-image-164680" style="width: 475px; height: 394px;" src="https://ahrefs.com/blog/wp-content/uploads/2023/08/image17-2.png" alt="Estimated U.S. monthly search volume for &quot;cat ear headphones,&quot; via Ahrefs' Keywords Explorer " srcset="https://ahrefs.com/blog/wp-content/uploads/2023/08/image17-2.png 950w, https://ahrefs.com/blog/wp-content/uploads/2023/08/image17-2-512x425.png 512w, https://ahrefs.com/blog/wp-content/uploads/2023/08/image17-2-768x637.png 768w" sizes="(max-width: 950px) 100vw, 950px">TipKeep search intent in mind when doing this. If the top search results for a keyword are all ecommerce category pages, this may indicate that searchers want a choice. In this case, it may be better to target the keyword with a subcategory page or faceted URL (more on those later).Chapter 3. Check On-page SEO (Using Google Search Console & Ahrefs)On-page search engine optimization is the process of optimizing the content on your page. It includes optimizations to the content you see and code under the hood. Let’s go through a few considerations and optimizations for ecommerce sites.Save time with title tag, meta description, and H1 templatesMost ecommerce stores use templates for their title tags and meta descriptions.Here’s an example of a meta description template.<img decoding="async" width="1076" height="516" class="wp-image-164682" src="https://ahrefs.com/blog/wp-content/uploads/2023/08/image41.png" alt="Example of templated meta descriptions on a Google SERP " srcset="https://ahrefs.com/blog/wp-content/uploads/2023/08/image41.png 1076w, https://ahrefs.com/blog/wp-content/uploads/2023/08/image41-680x326.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/08/image41-768x368.png 768w" sizes="(max-width: 1076px) 100vw, 1076px">Using a templated approach makes sense because writing unique copy for thousands of product and category pages is nobody’s idea of fun. Unfortunately, it can lead to stale, duplicate copy that doesn’t entice clicks.You can solve this with a hybrid approach where you use templates for most pages but unique ones for those with the most search traffic.Here’s how to find pages with the most search traffic in Google Search Console (GSC):Go to the Search results reportSelect the “Pages” tab<img decoding="async" width="1999" height="1066" class="wp-image-164684" src="https://ahrefs.com/blog/wp-content/uploads/2023/08/image32-1.png" alt="How to find top pages in Google Search Console " srcset="https://ahrefs.com/blog/wp-content/uploads/2023/08/image32-1.png 1999w, https://ahrefs.com/blog/wp-content/uploads/2023/08/image32-1-680x363.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/08/image32-1-768x410.png 7'''
