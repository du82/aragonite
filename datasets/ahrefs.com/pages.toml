["https://ahrefs.com/academy/how-to-use-ahrefs/keywords-explorer/traffic-share-pages"]
title = "Traffic share by pages"
description = "Learn how to use the Traffic share by pages report to see what’s dominating the search traffic for your keyword, the keyword topics for your niche, and more."
full_description = "This report shows the pages that get the most organic traffic based on your seed keywords in your target country. Unlike the keyword ideas reports which only support up to 10 seeds, the Traffic share by pages report is generated based on up to 10,000 keywords. Enter the keyword you’re targeting into Keywords Explorer (e.g. “affiliate marketing”) and go to the Traffic share by pages report. Here, you’ll see that the first result from Investopedia attracts a whopping 48% of clicks for this query. This is because it is a featured snippet. To get a decent amount of traffic from this keyword, it is likely you’ll have to try and get into the featured snippet position. Enter a bunch of relevant keywords into Keywords Explorer and go to the Traffic share by pages report. You’ll see that Keywords Explorer has grouped the list of queries into topics: “yoga classes”, “yoga mats”, “yoga poses for beginners”, etc. Look at the titles for unique topic ideas that would be appropriate for your site. Enter them in Keywords Explorer and go to the Traffic share by pages report to see how much their SERPs overlap. In the case of “whipped coffee recipe” vs. “whipped coffee without sugar”, it looks like the positions are far away from each other. So it’s safe to create individual pages for each. An Ahrefs account is required to take this exam. Sign up for a free Webmaster Tools account or paid subscription if you don’t have one."
