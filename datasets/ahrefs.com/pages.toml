["https://ahrefs.com/academy/how-to-use-ahrefs/keywords-explorer/matching-terms"]
title = "Matching terms"
description = "Learn how to use the Matching terms report to find high-volume, low-competition keywords, keywords for which your site doesn’t rank, and more."
full_description = "Toggle for “Questions” to see keywords phrased as questions or “All” to see all keyword ideas. Terms match - Shows you all keyword ideas that contain all the words from your query in any order. For example, if your seed keyword is “lose weight”, then “how much weight can you lose in a month” would appear here. Phrase match - Shows you all keyword ideas that contain your target keyword or phrase in the order it’s written. For example, if your seed keyword is “lose weight”, then “how to lose weight” would appear here. Set the search volume filter to a minimum value of 500 and the Keyword Difficulty (KD) filter to a maximum of 10. The numbers suggested for the search volume and KD filters will vary based on the breadth of your niche. Feel free to play around with the filters until you get a list of keywords you’re satisfied with. Let’s go with the same example from above: “how to lose weight”. Only this time, set a Lowest DR filter with a DR value of 30 and SERPs ranking in the Top 5. This will show us keywords where a website with a DR of 30 is ranking in the top 5. Keywords that have varying keyword difficulty scores. And if we expand one of the SERPs, you’ll notice there is a website there with a DR value below 30. This doesn’t mean you can’t be the first result to penetrate the top 5 or top 10 search results, if there are no low DR websites in the SERPs whatsoever. Type in your seed keyword. Then set the Target filter to show only keywords where your target doesn’t rank in top 10. For the first type, you’d typically create new content. For the second type, you can improve existing content. To prioritize which pages to improve, export the keywords and sort them using the “Position” column. You can also use the Target filter where your target website doesn’t rank in the top 100, to avoid topics that you’ve already covered. SERP features are anything in the search engine results pages that are not traditional search results. They provide additional and related information on the search query."
