["https://ahrefs.com/blog/canonical-tags"]
title = "Canonical Tags Explained: Why They Matter For SEO"
description = "Canonical tags help to combat duplicate content issues. They tell search engines like Google to index and rank the right pages. Here's how to use them."
full_description = '''<img class="category-icon" src="https://ahrefs.com/blog/wp-content/themes/Ahrefs-4/images/categories/icons/technical-seo.svg" alt="Technical SEO" title="Technical SEO"/>Technical SEOCanonical Tags Explained: Why They Matter For SEO By Joshua Hardwick ✓ Reviewed by Patrick Stox Updated: October 31, 202414 min read<img src="https://ahrefs.com/blog/wp-content/uploads/2019/10/meme-425x425.jpg" width="85" height="85" alt="Joshua Hardwick" class="avatar avatar-85 wp-user-avatar wp-user-avatar-85 alignnone photo" /> Joshua Hardwick Head of Content @ Ahrefs (or, in plain English, I'm the guy responsible for ensuring that every blog post we publish is EPIC). Article PerformanceData from AhrefsOrganic traffic 1.69KLinking websites 359 Sign up for AhrefsGet SEO metrics of any website or URL.The number of websites linking to this post.This post's estimated monthly organic search traffic.Get the week's best marketing content Email Subscription Subscribe Leave this field empty if you're human: Contents Canonical tags help prevent duplicate content issues that can hurt your SEO. Here’s how they work and when to use them.ContentsWhat is a canonical tag?A canonical tag (rel=“canonical”) is a snippet of HTML code that tells search engines which page version is the main one when there are similar or duplicate URLs. This helps ensure only the main version is indexed.Here’s an example canonical tag:<link rel="canonical" href="https://example.com/" />The URL you specify is the master version of the page that you want indexed.When should you use canonical tags, and why are they so important for SEO?You should use canonical tags whenever you have the same or similar content available at multiple URLs.Here are just a few of many reasons why this can happen:You have duplicate content at URLs with and without trailing slashes (e.g. example.com/ and example.com)You have duplicate content at desktop and mobile versions of pages (e.g., example.com and m.example.com)You have duplicate content at parameterized verisons of URLs (e.g., example.com and example?tracking-code)Sidenote. If you’re syndicating or republishing content on other sites, this is another time to use canonical tags. If you don’t, there’s a risk of Google treating the syndicated or republished version of the content as the original and ranking it ahead of your site in the search results.For example, say you have an ecommerce store selling widgets. You might have a category page listing all your blue widgets at this URL: example.com/widgets/blue/. But the exact same content might be accessible at an ugly URL like this when visitors apply product filters: example.com/widgets?color=blueUnless you specify the canonical, the “wrong” version of the URL might get indexed and appear in search results.Canonical tags also help ensure that ranking signals like links consolidate to one page. This is important because links are a confirmed Google ranking factor, and there’s a strong correlation between links and traffic.<img decoding="async" width="1678" height="1658" src="https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-2.png" alt="Our research shows that there's a clear correlation between backlinks and search traffic" class="wp-image-181739" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-2.png 1678w, https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-2-430x425.png 430w, https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-2-768x759.png 768w, https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-2-1536x1518.png 1536w, https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-2-120x120.png 120w" sizes="(max-width: 1678px) 100vw, 1678px">Too much duplicate content can also burn “crawl budget,” which is where Google wastes its resources crawling duplicate versions of content instead of new pages you actually want indexed. Sure, it will probably figure out eventually that it shouldn’t crawl pages regularly, but it has to crawl them initially to before it can do that—which is what wastes crawl budget.<img decoding="async" width="900" height="557" src="https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-3.png" alt="Google is smart and will stop recrawling duplicate content, but it has to crawl it initially to figure that out which wastes crawl budget" class="wp-image-181740" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-3.png 900w, https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-3-680x421.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-3-768x475.png 768w" sizes="(max-width: 900px) 100vw, 900px">How to add canonical tags to your siteYou can do this manually by adding <link rel="canonical" href="https://example.com"/> to the <head> section of your page’s code, but hardly anyone does that because it’s too much hassle. It’s usually way easier to do it through your website platform.However you choose to do it, make sure to follow these golden rules:Use absolute URLs. Google says not to use relative URLs (e.g., /sample-page/), even though they’re supported. This means you should specify full absolute URLs in canonical tags (e.g., https://example.com/sample-page/).Use the correct domain. If you switched over to SSL (you should have by now!), make sure that you don’t declare any non-SSL (i.e., HTTP) URLs in your canonical tags. Doing so can lead to confusion on Google’s part and unexpected results.Specify only one canonical per page. Google will ignore all declared canonicals if you declare more than one.Let’s take a look at the process for a few popular platforms.Setting canonical tags in WordPressInstall Yoast SEO, then scroll to the “Advanced” section on a page or post where you’ll see an option to specify a canonical.<img decoding="async" width="1192" height="812" src="https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-4.png" alt="Adding canonical tags to WordPress" class="wp-image-181741" style="width:555px;height:auto" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-4.png 1192w, https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-4-624x425.png 624w, https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-4-768x523.png 768w" sizes="(max-width: 1192px) 100vw, 1192px">Setting canonical tags in WixFollow their step-by-step guide. It’s a bit convoluted compared to WordPress, but it’s still possible.Setting canonical tags in ShopifyShopify handles canonicalization fairly well out of the box. Does that mean it’s always perfect? No. But most small and medium sized stores probably won’t need to add canonical tags manually. I’d recommend getting a developer’s help if you need to, as you’ll need to edit your theme’s code (.liquid files) directly.Setting canonical tags in SquarespaceGo to the advanced settings of your page and you can inject canonical tags into the header.<img decoding="async" width="1546" height="862" src="https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-5.png" alt="Adding canonical tags to Squarespace" class="wp-image-181742" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-5.png 1546w, https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-5-680x379.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-5-768x428.png 768w, https://ahrefs.com/blog/wp-content/uploads/2024/11/word-image-181737-5-1536x856.png 1536w" sizes="(max-width: 1546px) 100vw, 1546px">Other ways to declare canonical URLsCanonical tags are not the only way to declare a page’s canonical. You can use three other methods:Redirectrel=“canonical” in HTTP headerSitemapSidenote. If none of these are used, Google will rely on other signals like hreflang, internal links, and URL length to choose a canonical for you if it believes you have duplicate content.RedirectsGoogle says to use this only when depracating a duplicate page because it redirects Googlebot (and visitors) to a different URL. This is a particularly useful option for duplicate content caused by both HTTP and HTTPS pages being accessible.Further reading301 Redirects Explained: How They Impact SEOrel=“canonical” in HTTP headerFor documents like PDFs, there’s no way to place canonical tags in the page header because there is no page <head> section. In such cases, you’ll need to use HTTP headers to set canonicals.Here’s what that might look like for a PDF version of this blog post:HTTP/1.1 200 OKContent-Type: application/pdfLink: <https://ahrefs.com/blog/canonical-tags/>; rel="canonical"You can also use a canonical in HTTP headers on standard webpages.Further readingHow to Add the Canonical Tag to HTTP HeadersSitemapOnly canonical URLs should be listed in your sitemap, although Google says that doing so is a weak canonicalization signal.Sidenote. Links, both internal and external, are another canonicalization signal as John Mueller mentions in this video.Common canonicalization mistakes and best practicesCanonicalization can be complex. Because of this, there are a lot of misunderstandings and misconceptions about how to canonicalize properly.Mistake #1: Blocking the canonicalized URL via robots.txtBlocking a URL in robots.txt prevents Google from crawling it, meaning that it’s unable to see any canonical tags on that page. That, in turn, prevents it from transferring any “link equity” from the non-canonical to the canonical.Mistake #2: Setting the canonicalized URL to noindexNever mix noindex and rel=canonical. They’re contradictory instructions.John Mueller said on Reddit that Google will generally prioritize the canonical tag over the noindex tag, but it’s not a guarantee. Google’s official documentation says that noindex will completely remove the page from search. That may be the desired end result, but other canonicalization methods should have the same effect without the potential downsides (e.g., Google not being able to consolidate “link equity”).Mistake #3: Setting a 4XX HTTP status code for the canonicalized URLSetting a 4XX HTTP status code for a canonicalized URL has the same effect as using the noindex tag: Google will be unable to see the canonical tag and, therefore, can’t transfer “link equity” to the canonical version.Mistake #4: Canonicalizing all paginated pages to the root pageGoogle says not to canonicalize paginated pages to the first in the series.Sidenote. You should also use rel=prev/next tags for pagination. These are no longer used by Google, but Bing still uses them.Mistake #5: Not using canonical tags with hreflangHreflang tags are used to specify the language and geographical targeting of a webpage.Google states that when using hreflang, you should “specify a canonical page in the same language, or the best possible substitute language if a canonical doesn’t exist for the same language.”Mistake #6: Having multiple rel=canonical tagsHaving multiple rel=canonical tags will cause them to likely be ignored by Google. In many cases this happens because tags are inserted into a system at different points such as by the CMS, the theme, and plugin(s). This is why many plugins have an overwrite option meant to make sure that they are the only source for canonical tags.Another area where this might be a problem is with canonicals added with JavaScript. If you have no canonical URL specified in the HTML response and then add a rel=canonical tag with JavaScript then it should be respected when Google renders the page. However, if you have a canonical specified in HTML and swap the preferred version with JavaScript, you are sending mixed signals to Google.Mistake #7: Rel=canonical in the <body>Rel=canonical should only appear in the <head> of a document. A canonical tag in the <body> section of a page will be ignored.Where this can become a problem is with the parsing of a document. While the source code of a page may have the rel=canonical tag in the correct location, when the page is actually constructed in a browser or rendered by a search engine, many different things such as unclosed tags, JavaScript injected, or <iframes> in the <head> section can cause the <head> to end prematurely while rendering. In these cases a canonical tag may be accidentally thrown into the <body> of a rendered page where it will not be respected.How to find and fix canonical tag issues on your siteIt’s easy to make mistakes with canonicalization, so it pays to regularly audit your website for issues related to canonical tags and fix them ASAP.You can do this with Ahrefs’ Site Audit, which you can use for free with verified websites with an Ahrefs Webmaster Tools (AWT) account. It crawls your website for over 170 SEO issues, including those related to canonical tags.Here are the 14 canonical issues Site Audit may find, and how to fix them:1. Canonical points to 4XXOne or more pages are canonicalized to a dead (4XX) URL.Why it’s an issueSearch engines don’t index 4XX pages because they don’t work. As a result, they’ll ignore any canonical tags pointing to such pages and often end up indexing the wrong (non-canonical) version of the page.How to fixReview the affected pages and replace the dead (4XX) canonical links with links to working (200) pages that you want indexed.2. Canonical points to 5XXOone or more pages is canonicalized to a 5XX URL.Why it’s an issue5XX HTTP status codes indicate server issues, which result in an inaccessible canonical page. Google is unlikely to index inaccessible pages, so may ignore the canonical.How to fixReplace any erroneous canonical URLs with valid URLs. Check for server misconfigurations if the specified canonical seems correct. Note that this may be a temporary issue if the crawl occured when your site was down for maintenance or your site’s server overloaded.3. Canonical points to redirectOne or more pages is canonicalized to a redirected URL.Why it’s an issueCanonicals should always point to the most authoritative version of a page. This is not the case with redirecting URLs. As a result, search engines may misinterpret or ignore the canonical.How to fixReplace the canonical links with direct links to the most authoritative version of the page (i.e., one that returns a 200 HTTP status code and doesn’t redirect).4. Canonical URL has no incoming internal linksOne or more specified canonical URLs have no internal incoming links.Why it’s an issueCanonical URLs without internal links are inaccessible to website visitors. Somewhere on the site, they’re being directed to a non-canonical version of the page instead.How to fixReplace any internal links to canonicalized pages with direct links to the canonical.5. Canonical URL has no incoming internal linksThere are no internal links pointing to one or more declared canonical URLs.Why it’s an issueBecause there’s no way for people browsing your website to reach the canonical URL. Internal links are also a canonicalization si'''
author = "Joshua Hardwick"
year_published = 2024
year_updated = 2024
