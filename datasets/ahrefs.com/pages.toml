["https://ahrefs.com/academy/how-to-use-ahrefs/site-audit/introduction"]
title = "Introduction to Site Audit"
description = "Learn all about our website auditing tool that lets you run scheduled technical SEO audits."
full_description = "Shows a list of projects, along with a few crawl stats: last crawl date, status, and next scheduled audit. Shows all your crawls in an audit log, along with historical graphs for a few categories. To open it, click on a project’s name. Shows all the SEO issues found in an audit. To open it, click on one of the crawls in the audit log table. However, issues are not universal across all websites. For example, we classify orphan pages as errors, but this might not hold true for an ecommerce store that sells seasonal products and discontinues certain pages during off season. Since errors contribute to a lower website health score, you can solve cases like this by configuring issues to suit your website’s needs. Just click on Issue settings in Site Audit’s main page. To change an issue’s level of importance, click on the dropdown and select the importance level you see most fit. You can also toggle issues on and off globally, as well as choose whether to add the issue to future new projects. Turning an issue off will remove the issue from existing projects. If you disable Add to new projects, the issue will remain in the existing projects, but it won’t be added in future projects. To toggle issues on or off at a project level, click on Turn off for this project under Top Issues (Overview report) or the All issues report. Only internal HTML pages that return the 200 (OK) HTTP status code consume crawl credits. These are pages that are visible to both search engines and readers. To control your crawl credit usage, click on Open project settings under the gear icon and specify the Max number of internal pages. For each verified project, the first 5,000 crawl credits per month spent to crawl this project is free. This is available for users on all plans. An Ahrefs account is required to take this exam. Sign up for a free Webmaster Tools account or paid subscription if you don’t have one."
