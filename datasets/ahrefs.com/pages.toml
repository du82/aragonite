["https://ahrefs.com/academy/how-to-use-ahrefs/content-explorer/lb-use-cases"]
title = "Link building use cases"
description = "Learn how to use Content Explorer to do link building and find topics that generate a lot of links, broken link building opportunities, and more."
full_description = "From here, you can click on Referring domains, then go to Backlinks to reverse engineer how they got those links in the first place. To find such pages, search for a broad topic and filter for Only broken pages. Then use the Referring domains filter to exclude pages with few or no referring domains. Once you find a promising broken link building opportunity, click on Referring domains and go to the Backlinks tab. Unlinked brand mentions are a low hanging fruit: those mentioning you already talk about you, they just need a friendly nudge to link back to you. To find such opportunities, search for your brand and exclude mentions from your own website using the operator -site:[own website]. Then toggle the One page per domain setting and enter your own domain under Highlight unlinked domains. The websites that have never linked to you before will be highlighted, which means you can reach out to them and ask for the link. To toggle all unlinked mentions, hit the Export button and toggle the Only pages with highlighted domains option. An Ahrefs account is required to take this exam. Sign up for a free Webmaster Tools account or paid subscription if you don’t have one."
