["https://ahrefs.com/blog/link-building"]
title = "Link Building for SEO: The Beginner’s Guide"
description = "Tim Soulo is CMO at Ahrefs. With over 15 years in the digital marketing industry, Tim is the author of many data-driven studies and actionable marketing frameworks, some of which gained industry-wide recognition. He enjoys challenging conventional marketing knowledge and optimizing for simplicity and efficiency."
full_description = '''Link Building for SEO: The Beginner’s Guide By Tim Soulo October 9, 202329 min read<img width="650" height="400" src="https://ahrefs.com/blog/wp-content/uploads/2021/04/lb.png" class="attachment-header-thumbnail size-header-thumbnail" alt="" itemprop="image" srcset="https://ahrefs.com/blog/wp-content/uploads/2021/04/lb.png 1300w" sizes="(max-width: 650px) 100vw, 1300px" /><img width="650" height="400" src="https://ahrefs.com/blog/wp-content/uploads/2021/04/lb_mobile.png" class="attachment-header-thumbnail size-header-thumbnail" alt="" itemprop="image" srcset="https://ahrefs.com/blog/wp-content/uploads/2021/04/lb_mobile.png 1300w" sizes="(max-width: 650px) 100vw, 1300px" />SEO Guide 1How Search Engines Work 2SEO Basics 3Keyword Research 4SEO Content 5On-Page SEO 6Link Building 7Technical SEO SEO Guide 6Link Building 1. How Search Engines Work2. SEO Basics3. Keyword Research4. SEO Content5. On-Page SEO6. Link Building7. Technical SEO <img src="https://ahrefs.com/blog/wp-content/uploads/2024/05/Tim_profile_pic-120x120.jpg" width="85" height="85" alt="Tim Soulo" class="avatar avatar-85 wp-user-avatar wp-user-avatar-85 alignnone photo" /> Tim Soulo Tim Soulo is CMO at Ahrefs. With over 15 years in the digital marketing industry, Tim is the author of many data-driven studies and actionable marketing frameworks, some of which gained industry-wide recognition. He enjoys challenging conventional marketing knowledge and optimizing for simplicity and efficiency. Article PerformanceData from AhrefsOrganic traffic 10.47KLinking websites 1.19K Sign up for AhrefsGet SEO metrics of any website or URL.The number of websites linking to this post.This post's estimated monthly organic search traffic.Get the week's best marketing content Email Subscription Subscribe Leave this field empty if you're human: You’re here because you need links.You’ve likely heard that links (or backlinks) are what helps your website to rank higher in Google. And you need to learn how to build them.Well… we (Ahrefs) have been building tools for professional link builders for 10+ years now. So it would be fair to say that we know a thing or two about link building.In this guide, we have collected our best bits of knowledge and tried to explain all the intricacies of link building in simple terms so that you could easily put our advice to action.But before we dive in, here are just a few quick teasers insights to get things going:If you have a brand-new website, it’s best to kick things off by building a few dozen foundational links.It helps tremendously to have a prior relationship with a website owner before you ask for a link from them.People link to web pages that are interesting and useful. So if your page is not that, you’ll have a very hard time building links to it.Links from relevant pages on authoritative websites have the most influence on your rankings in Google (and possibly other major search engines).Contents SEO Guide 1How Search Engines Work 2SEO Basics 3Keyword Research 4SEO Content 5On-Page SEO 6Link Building 7Technical SEO <img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/svg/6.svg">Part 1The basics of link buildingYou can think of links as votes. When other websites are linking to your page, it tells Google that your page is somehow important. Which is essentially Google’s PageRank algorithm in a nutshell.So the more high-quality backlinks a page has, the higher it tends to rank in Google. And if you want to outrank it with your own page, you’ll likely need to get more links than it has.<img fetchpriority="high" decoding="async" width="1600" height="1189" class="wp-image-167429" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/backlinks-help-you-to-rank-higher-in-google.png" alt="Backlinks help you to rank higher in Google" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/09/backlinks-help-you-to-rank-higher-in-google.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2023/09/backlinks-help-you-to-rank-higher-in-google-572x425.png 572w, https://ahrefs.com/blog/wp-content/uploads/2023/09/backlinks-help-you-to-rank-higher-in-google-768x571.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/09/backlinks-help-you-to-rank-higher-in-google-1536x1141.png 1536w" sizes="(max-width: 1600px) 100vw, 1600px">Backlinks help pages rank higher in Google’s search results.I obviously oversimplified things quite a bit. Ranking #1 in Google is a lot more nuanced than just getting more links, because links aren’t the only ranking signal that Google uses. But it’s a very strong signal nevertheless, and it has a very direct influence on your search rankings.So what is link building, and how do you do it?Link building is the process of getting other websites to link to pages on your website. Its purpose is to boost the “authority” of your pages in the eyes of Google so that these pages rank higher and bring more search traffic.Let’s get a bit deeper into that.<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/svg/7.svg">Part 2How to build linksConceptually, most popular link building strategies fall into one of the following four buckets:Adding links – That’s when you go to some website and manually add your link there.Asking for links – That’s when you send emails to owners of relevant websites and ask them to link to you.Buying links – Same as above, but you offer them money (or some other form of compensation).Earning links – This refers to creating and promoting something so noteworthy that people would link to it naturally.<img decoding="async" width="1600" height="821" class="wp-image-167430" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/four-ways-to-build-backlinks.png" alt="Four ways to build backlinks" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/09/four-ways-to-build-backlinks.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2023/09/four-ways-to-build-backlinks-680x349.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/09/four-ways-to-build-backlinks-768x394.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/09/four-ways-to-build-backlinks-1536x788.png 1536w" sizes="(max-width: 1600px) 100vw, 1600px">How to get backlinks.You can also hire an experienced link builder (or a link building agency) to do it all for you. And that’s what a lot of digital marketers and business owners eventually end up doing because no matter which tactics you choose, building links is a lot of work.But even if you decide to outsource link building, it would be immensely useful to have some basic knowledge of how it’s done. This way, you would be able to see if the person you hired is doing a good job or not.So let’s take a closer look at each of the four buckets.1. Adding linksThis is when you go to a website that doesn’t belong to you and manually place your link there.The most common tactics that fit into this category are:Social profiles creation.Business directory submissions.Review site listings.Posting to forums, communities, and Q&A sites.Building links via those tactics is very easy to do. And for that exact reason, such links tend to have little to no value in the eyes of Google.Other than that, these kinds of links barely give you any competitive edge. If you can go to a website and manually place your link there, so can your competitors.And yet, this group of link building tactics should not be ignored completely. In fact, some professional link builders prefer to start with these kinds of links when they’re working with a brand-new website.They refer to it as building “foundational links.”Think about it. Most online businesses have branded accounts at the major social networks, as well as listings at major business directories and review sites (Yelp, Trustpilot, ProductHunt, Glassdoor, etc.). And all of these pages contain a link to their website.<img decoding="async" width="1170" height="676" class="wp-image-167431" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/link-from-our-twitter-profile.jpg" alt="Link from our Twitter profile" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/09/link-from-our-twitter-profile.jpg 1170w, https://ahrefs.com/blog/wp-content/uploads/2023/09/link-from-our-twitter-profile-680x393.jpg 680w, https://ahrefs.com/blog/wp-content/uploads/2023/09/link-from-our-twitter-profile-768x444.jpg 768w" sizes="(max-width: 1170px) 100vw, 1170px">Google clearly pays attention to these profile pages. If you look at the “Knowledge” panel for Ahrefs (see the screenshot below), you’ll notice the links to our social profiles featured there. And we weren’t the ones who added them. Google identified our social profiles on its own and linked them to the Ahrefs brand as part of its Knowledge Graph.<img decoding="async" width="2048" height="1262" class="wp-image-167432" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/links-in-the-knowledge-graph.png" alt="Links in the &quot;Knowledge&quot; graph" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/09/links-in-the-knowledge-graph.png 2048w, https://ahrefs.com/blog/wp-content/uploads/2023/09/links-in-the-knowledge-graph-680x419.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/09/links-in-the-knowledge-graph-768x473.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/09/links-in-the-knowledge-graph-1536x947.png 1536w" sizes="(max-width: 2048px) 100vw, 2048px">Yes, these kinds of links are either nofollow or very, very weak. Which means that they hardly move the needle when it comes to ranking in Google.But given that the “nofollow” attribute is now treated as a hint, there’s a chance that over time your profile pages will accrue some quality links of their own and might start bringing a bit of search engine optimization (SEO) value to your website.For example, Ahrefs’ profile page on Twitter boasts 11,000 backlinks, coming from over a thousand different websites. So I’m pretty sure it does have some “weight” in the eyes of Google.<img decoding="async" width="920" height="386" class="wp-image-167433" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/backlink-profile-of-our-twitter-profile-via-ahref.png" alt="Backlink profile of our Twitter profile, via Ahrefs' Site Explorer" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/09/backlink-profile-of-our-twitter-profile-via-ahref.png 920w, https://ahrefs.com/blog/wp-content/uploads/2023/09/backlink-profile-of-our-twitter-profile-via-ahref-680x285.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/09/backlink-profile-of-our-twitter-profile-via-ahref-768x322.png 768w" sizes="(max-width: 920px) 100vw, 920px">That being said, don’t go crazy listing your website in every imaginable social network and business directory there is. We’re talking about merely a few dozen of them where it is natural for your business to be listed. Anything beyond that would be a royal waste of your time.And the best way to find some quality websites to add your link to is to study the links of your competitors. Which we’ll discuss in more detail later in this guide.2. Asking for linksThis is when you reach out to other website owners and ask them for a link, which SEOs often refer to as “link outreach.”But you can’t possibly reach out to the folks at datasciencecentral.com and ask them to link to your page with cookie recipes, right? You need to pick websites that are somehow related to your page, since they are more likely to actually consider your request.The process of collating a list of relevant websites to reach out to is called “link prospecting.” And the more effort you invest into finding suitable outreach targets, the higher your success rate would be.But why would owners of other websites (even the relevant ones) care to link to your page anyways?Well, ideally, you want them to be so impressed with your resource that they would naturally want to share it with the visitors of their website (i.e., link to it).But not every page of your website is a one-of-a-kind masterpiece worthy of a thousand links. So SEO professionals have devised a set of tactics to persuade the owners of other websites to add links to their pages.Here’s a brief list of these tactics, along with the general reasoning behind them:Guest posting – Write an awesome article for their website, from which you can link to yourself.Skyscraper technique – Find an outdated (or somehow inferior) page that lots of websites are linking to. Create a much better one on your own website. Then show it to all the “linkers.”Resource page link building – Find pages that list resources similar to yours and request to be added there.Broken link building – Find a dead page that has lots of links. Create an alternative on your own website and ping all the linkers about it. That’s broken link building in a nutshell.Image link building – Find sites that have used your images without proper attribution and ask them for a link.HARO and journalist requests – Contribute an “expert quote” for their article.Unlinked mentions – Ask to turn the mention of your brand into a link.PR – Give them a killer story to cover.Here’s a caveat, though.The reasoning behind each one of these tactics might seem quite fair and logical, but you’ll be surprised how low the success rate is. I mean, if you manage to get five links out of a hundred outreach emails, you can be proud of yourself.But there’s one simple thing you can do to skew the odds in your favor. That is to build relationships with people in your industry way before you need something from them.Think about it. If today you got a cold email from a random person asking for a link, would you even bother replying? I doubt so. But what if that email comes from someone whom you’ve previously talked to on Twitter or maybe even met at some in-person event? You’ll be a lot more likely to pay attention, right?Thus, if you start connecting with folks from your industry in advance (and maybe even do small favors for them), you’ll have no issues reaching out with a link request at some point in future.Here’s a good example from my own experience. Gael Breton from Authority Hacker first reached out to me back in 2014. That was before I even joined Ahrefs:<img decoding="async" width="1170" height="386" class="wp-image-167434" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/2014-email-from-gael-breton.png" alt="2014 email from Gael Breton " srcset="https://ahrefs.com/blog/wp-content/uploads/2023/09/2014-email-from-gael-breton.png 1170w, https://ahrefs.com/blog/wp-content/uploads/2023/09/2014-email-from-gael-breton-680x224.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/09/2014-email-from-gael-breton-768x253.png 768w" sizes="(max-width: 1170px) 100vw, 1170px">I enjoyed Gael’s work, and we’ve kept in touch ever since. Which is one of the reasons why his website has 122 incoming links from ahrefs.com as of today:<img decoding="async" width="1342" height="770" class="wp-image-167435" src="https://ahrefs.com/blog/wp-content/uploads/2023/09'''
