title = "Mentions alerts"
description = "Learn how to use the Mentions alert to monitor the web for brand mentions, pages that mention your competitors but not you, and more."
full_description = '''Keep track of who's mentioning you and where. Just enter your brand name in the "search query" field. You can also expand your search by adding common misspellings of your brand name separated by the OR operator. To block alerts from specific domains such as your own, add them to the "Blocked domains" field as a comma-separated list. Finally, hit "Add." If they haven’t, and it makes sense for them to do so, consider reaching out and asking them to add a link to the mention. To do this, enter a few of your competitors' brand names using the plus (+) operator, then exclude your brand using the minus (-) operator. For example, if you were a new and budding email marketing company, you might want to monitor for pages that mention MailChimp and ActiveCampaign, but not you. The plus operator includes pages mentioning the specified word or phrase, while the minus operator excludes them. If people mention multiple competitors but not you, they likely don't know you exist. Consider reaching out and introducing your brand. Check out this video on finding quality backlink opportunities in real-time, or check out some of our guides on the Ahrefs blog: An Ahrefs account is required to take this exam. Sign up for a free Webmaster Tools account or paid subscription if you don’t have one.'''
