full_description = "Ahrefs monitors hundreds of millions of keywords in 189 locations, with over 171 million in the US alone. Our comprehensive data allows us to provide reliable estimations of a website's organic search traffic in Google. Ahrefs has the fastest backlink crawler in the industry and boasts the world's biggest index of live backlinks (over 14 trillion), offering access to 7+ years of historical data. Go back in time and see how long competitors have been bidding on a specific keyword through the Ads position history chart. Study their ad copy to better understand what resonates with your audience and track which pages they’re sending paid traffic to, so you can compare how paid traffic has evolved over time. Most of the reports above have a Date picker, which allows you to dig into a website's performance at any point in the past. You can also compare two historical snapshots to easily uncover which keywords and pages are responsible for the traffic spikes (or dips) you're seeing on the performance graph. The “Outgoing Links” section gives you an idea of any website’s linking patterns, like the type of websites it usually links to, the most-used anchors, and the predominant link types (redirects, images, affiliate links, etc.)."
