full_description = '''Affiliate MarketingHow to Build a Successful Amazon Affiliate Site (Step by Step) By Joshua Hardwick ✓ Reviewed by Sam Oh Updated: August 14, 202027 min read<img src="https://ahrefs.com/blog/wp-content/uploads/2019/10/meme-425x425.jpg" width="85" height="85" alt="Joshua Hardwick" class="avatar avatar-85 wp-user-avatar wp-user-avatar-85 alignnone photo" /> Joshua Hardwick Head of Content @ Ahrefs (or, in plain English, I'm the guy responsible for ensuring that every blog post we publish is EPIC). Article PerformanceData from AhrefsLinking websites 38 Sign up for AhrefsGet SEO metrics of any website or URL.The number of websites linking to this post.This post's estimated monthly organic search traffic.Get the week's best marketing content Email Subscription Subscribe Leave this field empty if you're human: Contents Do you want to make some extra dough promoting products on Amazon? Lots of people make money with Amazon affiliate sites. But for every success story, there are plenty who never quite get there. For example, this person on the /r/juststart subreddit claims to have hit $1K/month from Amazon within just six months: <img decoding="async" width="1452" height="250" class="wp-image-36793" src="https://ahrefs.com/blog/wp-content/uploads/2020/06/1-amazon-affiliate-site-success.png" alt="1 amazon affiliate site success" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/06/1-amazon-affiliate-site-success.png 1452w, https://ahrefs.com/blog/wp-content/uploads/2020/06/1-amazon-affiliate-site-success-680x117.png 680w, https://ahrefs.com/blog/wp-content/uploads/2020/06/1-amazon-affiliate-site-success-768x132.png 768w" sizes="(max-width: 1452px) 100vw, 1452px"> Whereas this person hit just $38/month after working on a site for over two years: <img decoding="async" width="1336" height="398" class="wp-image-36798" src="https://ahrefs.com/blog/wp-content/uploads/2020/06/2-amazon-affiliate-site-low-earnings.png" alt="2 amazon affiliate site low earnings" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/06/2-amazon-affiliate-site-low-earnings.png 1336w, https://ahrefs.com/blog/wp-content/uploads/2020/06/2-amazon-affiliate-site-low-earnings-680x203.png 680w, https://ahrefs.com/blog/wp-content/uploads/2020/06/2-amazon-affiliate-site-low-earnings-768x229.png 768w" sizes="(max-width: 1336px) 100vw, 1336px"> If you want your story to be more like that first screenshot and less like the second, this is the guide for you. Here’s everything you’ll learn:What the Amazon affiliate program isHow Amazon’s affiliate program worksHow to become an Amazon affiliateWhat an Amazon affiliate site isWhy SEO is important for Amazon affiliate sitesHow to build a successful Amazon affiliate siteNew to affiliate marketing?Read our beginner’s guide to affiliate marketing.What is the Amazon affiliate program? The Amazon affiliate program (Amazon Associates) lets people earn money by referring sales to Amazon.How Amazon’s affiliate program works When you sign up, Amazon gives you a unique tracking ID that looks something like this: yourname-20. You can add this to any Amazon product URL to create an affiliate link. Example: amazon.com/dp/B01K1C94E4 → amazon.com/dp/B01K1C94E4?tag=yourname-20 When someone clicks your link and buys something on Amazon within 24 hours, you’ll be paid a commission on the sale. Even better, they don’t have to buy the product you recommend. If you send them to a kitchen knife and they end up buying a tennis racket, you still get a commission. If they buy the kitchen knife, a tennis racket, and a bunch of other things, you earn commission on everything. This is partly why the affiliate program is so popular. Amazon sells most things, so it’s not unusual to see a good chunk of commissions come from products you’ve never even heard of.How to become an Amazon Affiliate Follow these steps:Go to the Amazon Associates homepage;Sign in with your Amazon account;Follow the on-screen instructionsDuring signup, Amazon will ask for your website address. Although you can enter a social media profile link here, you’ll want to set up an Amazon affiliate website if you’re serious about making money with Amazon Associates. What is an Amazon affiliate site? Amazon affiliate sites promote products for sale on Amazon in their content. If you’ve ever Googled something like “best [product type]” or “[product] review,” then you’ve almost certainly come across one of these sites. Just take a look at the top-ranking result for “best coffee grinder”: <img decoding="async" width="1600" height="913" class="wp-image-36787" src="https://ahrefs.com/blog/wp-content/uploads/2020/06/3-amazon-affiliate-links.png" alt="3 amazon affiliate links" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/06/3-amazon-affiliate-links.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/06/3-amazon-affiliate-links-680x388.png 680w, https://ahrefs.com/blog/wp-content/uploads/2020/06/3-amazon-affiliate-links-768x438.png 768w, https://ahrefs.com/blog/wp-content/uploads/2020/06/3-amazon-affiliate-links-1536x876.png 1536w" sizes="(max-width: 1600px) 100vw, 1600px"> These folks researched the best coffee grinders, summarized their findings in a blog post, and included Amazon affiliate links for visitors to buy the recommended products. It’s a similar story for a query like “aeropress review.” <img decoding="async" width="1600" height="1484" class="wp-image-36814" src="https://ahrefs.com/blog/wp-content/uploads/2020/06/4-product-review.png" alt="4 product review" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/06/4-product-review.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/06/4-product-review-458x425.png 458w, https://ahrefs.com/blog/wp-content/uploads/2020/06/4-product-review-768x712.png 768w, https://ahrefs.com/blog/wp-content/uploads/2020/06/4-product-review-1536x1425.png 1536w" sizes="(max-width: 1600px) 100vw, 1600px"> Both of these types of posts are useful for readers because they make life simpler and save time. If you’re in the market for a new coffee grinder, you can’t test dozens of products yourself. You have to rely on the research and testing done by others.Why SEO is the secret to a successful Amazon affiliate site Making money from an Amazon affiliate site requires traffic (visitors). Without traffic, nobody will click your affiliate links, which means no commissions. Now, there are tons of ways to get traffic. But most who experience success with Amazon affiliate marketing get the bulk of their traffic from SEO. Here’s why: If you promote your blog on social media, or in a newsletter, you’ll get a spike in traffic. But once your audience has seen your post, traffic drops back to zero. This is known as the “spike of hope,” followed by the “flatline of nope.” <img decoding="async" width="1600" height="840" class="wp-image-36815" src="https://ahrefs.com/blog/wp-content/uploads/2020/06/pasted-image-0-78.png" alt="pasted image 0 78" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/06/pasted-image-0-78.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/06/pasted-image-0-78-680x357.png 680w, https://ahrefs.com/blog/wp-content/uploads/2020/06/pasted-image-0-78-768x403.png 768w, https://ahrefs.com/blog/wp-content/uploads/2020/06/pasted-image-0-78-1536x806.png 1536w" sizes="(max-width: 1600px) 100vw, 1600px"> SEO has the opposite effect. If you rank in Google for keywords that people are searching for month after month, your traffic will be consistent—and should improve over time. <img decoding="async" width="1600" height="791" class="wp-image-36806" src="https://ahrefs.com/blog/wp-content/uploads/2020/06/pasted-image-0-79.png" alt="pasted image 0 79" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/06/pasted-image-0-79.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/06/pasted-image-0-79-680x336.png 680w, https://ahrefs.com/blog/wp-content/uploads/2020/06/pasted-image-0-79-768x380.png 768w, https://ahrefs.com/blog/wp-content/uploads/2020/06/pasted-image-0-79-1536x759.png 1536w" sizes="(max-width: 1600px) 100vw, 1600px"> It’s possible to get the same effect using paid ads, but there are a few problems with that:It costs money (and most people have more time than money)It’s very much all or nothing. As soon as you stop spending money, your traffic drops to zero.It’s hard to turn a profit as ad spend eats into your affiliate commissions.With that in mind, let’s look at how you can build an Amazon affiliate site that makes money month after month. How to build a successful Amazon affiliate site Everyone has a different idea of success. For some, it’s a site that makes $1,000/month. For others, it might be a more ambitious goal of $10,000/month. Whatever the number, the steps to success are the same.Choose a good nicheFind profitable keywordsCreate the “right” kind of contentDrive traffic to your site through SEOGet clicks on affiliate links1. Choose a good nicheHave you heard of The Wirecutter? It’s owned by The New York Times and is perhaps the most popular Amazon affiliate website. It has reviews for everything from knife sharpeners to standing desks and gets an estimated 3.9 million monthly visits from Google alone. <img decoding="async" width="1600" height="402" class="wp-image-36792" src="https://ahrefs.com/blog/wp-content/uploads/2020/06/5-wirecutter-traffic.png" alt="5 wirecutter traffic" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/06/5-wirecutter-traffic.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/06/5-wirecutter-traffic-680x171.png 680w, https://ahrefs.com/blog/wp-content/uploads/2020/06/5-wirecutter-traffic-768x193.png 768w, https://ahrefs.com/blog/wp-content/uploads/2020/06/5-wirecutter-traffic-1536x386.png 1536w" sizes="(max-width: 1600px) 100vw, 1600px">Sidenote. The Wirecutter has now been redirected to nytimes.com/wirecutter/. Many who are new to Amazon affiliate marketing see sites like these and try to replicate their success. Don’t make this mistake. Big sites like The Wirecutter have deep pockets and talented SEO teams. Trying to compete will be an uphill battle. Instead, you need to choose a niche to dominate. Here’s how:A. Find something you’re interested inLoss of motivation is arguably the most common reason why people fail at affiliate marketing, so it’s important to choose a niche that you find at least somewhat interesting. So, grab a pen and paper and note down a few ideas. If you’re struggling, this huge list of affiliate marketing niches might help. Alternatively, take inspiration from The Wirecutter’s categories. <img decoding="async" width="1600" height="684" class="wp-image-36801" src="https://ahrefs.com/blog/wp-content/uploads/2020/06/6-wirecutter-categories.jpg" alt="6 wirecutter categories" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/06/6-wirecutter-categories.jpg 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/06/6-wirecutter-categories-680x291.jpg 680w, https://ahrefs.com/blog/wp-content/uploads/2020/06/6-wirecutter-categories-768x328.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2020/06/6-wirecutter-categories-1536x657.jpg 1536w" sizes="(max-width: 1600px) 100vw, 1600px">B. Check commission ratesAmazon’s commission rates vary by product category. Here’s the current structure:Product CategoryCommissionsLuxury Beauty, Amazon Coins10.00%Digital Music, Physical Music, Handmade, Digital Videos5.00%Physical Books, Kitchen, Automotive4.50%Amazon Fire Tablet Devices, Amazon Kindle Devices, Amazon Fashion Women’s, Men’s & Kids Private Label, Apparel, Amazon Cloud Cam Devices, Fire TV Edition Smart TVs, Amazon Fire TV Devices, Amazon Echo Devices, Ring Devices, Watches, Jewelry, Luggage, Shoes, and Handbags & Accessories4.00%All Other Categories4.00%Toys, Furniture, Home, Home Improvement, Lawn & Garden, Pets Products, Pantry, Headphones, Beauty, Musical Instruments, Business & Industrial Supplies, Outdoors, Tools, Sports, Baby Products3.00%PC, PC Components, DVD & Blu-Ray2.50%Televisions, Digital Video Games2.00%Amazon Fresh, Physical Video Games & Video Game Consoles, Grocery, Health & Personal Care1.00%Gift Cards; Wireless Service Plans; Alcoholic Beverages; Digital Kindle Products purchased as a subscription; Food prepared and delivered from a restaurant; Amazon Appstore, Prime Now, Amazon Pay Places, or Prime Wardrobe Purchases0.00% If any of your niche ideas fall in the 0% category, cross them off your list. There’s no point in promoting products for no reward. I would also rule out categories with commission rates of 2% or less because it’ll take a lot of traffic to make decent money from those.Sidenote. Amazon’s commission rates have dropped significantly over the past decade or so. The most recent cut came in early 2020, which is what prompted the belief amongst some people that Amazon affiliate sites are dead. That’s not the case. They’re just not as lucrative as they once were. C. Check product pricesGenerally speaking, you’ll make more money on expensive products. For example, if someone buys a $4,000 PC, your 2.5% cut ($100) is going to be way higher than if someone buys some new RAM for $40 ($1). But this doesn’t mean you should enter an expensive niche. People are less impulsive when it comes to high-ticket items, which means that fewer clicks will turn into sales. This is known as your conversion rate. Now, there’s a lot of talk about the sweet spot when it comes to product prices, but the consensus seems to be an average between $30-$300. Go higher, and conversions will start to suffer. Go lower, and your cut will suffer. To get a sense of prices in your niche, search for a few products on Amazon.<img decoding="async" width="1600" height="1176" class="wp-image-36797" src="https://ahrefs.com/blog/wp-content/uploads/2020/06/7-amazon-product-prices.png" alt="7 amazon product prices" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/06/7-amazon-product-prices.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/06/7-amazon-product-prices-578x425.png 578w, https://ahrefs.com/blog/wp-content/uploads/2020/06/7-amazon-product-prices-768x564.png 768w, https://ahrefs.com/blog/wp-content/uploads/2020/06/7-amazon-product-prices-1536x1129.png 1536w" sizes="(max-width: 1600px) 100vw, 1600px">D. Estimate traffic requirementsNow that you know a bit more about the niche you want to enter, you can use that information to estimate how much traffic to “money pages” you’ll need to hit your monthly financial goal. If you’re not familiar with the term “money pages,” these are just the pages on your site that contain affiliate links. With Amazon affiliate sites, product roundups tend to be the best “money pages.” They’re the ones that list the best products in a category like this list of the best robot vacuums from The Wirecutter: <img decoding="async" class="alignnone size-full wp-image-36847" src="https://ahrefs.com/blog/wp-content/uploads/2020/06/best-robot-vacuums.gif" alt width="1181" height="989"> These te'''
