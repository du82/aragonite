["https://ahrefs.com/blog/link-building-strategies"]
title = "12 Link Builders Share Strategies That Work in 2024"
description = "I asked 12 SEOs for the link building strategy that's working best for them right now. Here are the tactics they shared and how to do them."
full_description = '''<img class="category-icon" src="https://ahrefs.com/blog/wp-content/themes/Ahrefs-4/images/categories/icons/link-building.svg" alt="Link Building" title="Link Building"/>Link Building12 Link Builders Share Strategies That Work in 2024 By Joshua Hardwick ✓ Reviewed by Ryan Law September 30, 202418 min read<img src="https://ahrefs.com/blog/wp-content/uploads/2019/10/meme-425x425.jpg" width="85" height="85" alt="Joshua Hardwick" class="avatar avatar-85 wp-user-avatar wp-user-avatar-85 alignnone photo" /> Joshua Hardwick Head of Content @ Ahrefs (or, in plain English, I'm the guy responsible for ensuring that every blog post we publish is EPIC). Article PerformanceData from AhrefsOrganic traffic 382Linking websites 441 Sign up for AhrefsGet SEO metrics of any website or URL.The number of websites linking to this post.This post's estimated monthly organic search traffic.Get the week's best marketing content Email Subscription Subscribe Leave this field empty if you're human: Contents I asked 12 SEOs for the link building strategy that’s working best for them right now. Here are the tactics they shared, how to do them, and tips for success. ContentsPitch “best of” listicles that feature multiple competitors, but not youThis has been my go-to link building strategy for quite some time now. What makes this approach very effective is that it touches multiple campaign objectives beyond just building topical authority and improving search rankings.<img decoding="async" alt="Jason Acidre" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/Jason-Acidre.png">Jason Acidre, CEO AvarisHow to do it Let’s say you were doing this for MailChimp. You might want to find listicles that feature brands like ConvertKit and Aweber but not MailChimp—like this one: <img decoding="async" width="1690" height="1174" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/list-of-the-best-email-marketing-software-that-fea.jpg" alt="List of the best email marketing software that features brands like ConvertKit and Aweber but not MailChimp" class="wp-image-180665" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/09/list-of-the-best-email-marketing-software-that-fea.jpg 1690w, https://ahrefs.com/blog/wp-content/uploads/2024/09/list-of-the-best-email-marketing-software-that-fea-612x425.jpg 612w, https://ahrefs.com/blog/wp-content/uploads/2024/09/list-of-the-best-email-marketing-software-that-fea-768x534.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2024/09/list-of-the-best-email-marketing-software-that-fea-1536x1067.jpg 1536w" sizes="(max-width: 1690px) 100vw, 1690px"> To find these, run this search in Ahrefs’ Content Explorer: [competitor 1] +[competitor 2] -[your brand] title:(best OR top) For example, to find listicles that mention Aweber and ConvertKit but not MailChimp, you’d search for: convertkit +aweber -mailchimp title:(best OR top) <img decoding="async" width="1394" height="1014" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/searching-for-listicles-in-content-explorer.png" alt="Searching for listicles in Content Explorer" class="wp-image-180666" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/09/searching-for-listicles-in-content-explorer.png 1394w, https://ahrefs.com/blog/wp-content/uploads/2024/09/searching-for-listicles-in-content-explorer-584x425.png 584w, https://ahrefs.com/blog/wp-content/uploads/2024/09/searching-for-listicles-in-content-explorer-768x559.png 768w" sizes="(max-width: 1394px) 100vw, 1394px"> If you spot a listicle where you feel you should be listed, find their email address and reach out to them. Here’s an example email Jason used: <img decoding="async" width="1600" height="1287" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/example-outreach-email-from-jason-acidre.jpg" alt="Example outreach email from Jason Acidre" class="wp-image-180667" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/09/example-outreach-email-from-jason-acidre.jpg 1600w, https://ahrefs.com/blog/wp-content/uploads/2024/09/example-outreach-email-from-jason-acidre-528x425.jpg 528w, https://ahrefs.com/blog/wp-content/uploads/2024/09/example-outreach-email-from-jason-acidre-768x618.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2024/09/example-outreach-email-from-jason-acidre-1536x1236.jpg 1536w" sizes="(max-width: 1600px) 100vw, 1600px"> I don’t recommend copying Jason’s email word for word, but here’s his and Alex Tachalova’s advice on what to include: Some key pointers for emails: Briefly highlight why your product or service merits inclusion on their list.Reference other reputable lists that have already featured your product or service.Inquire about their criteria and requirements for inclusion.Offer free tool access, complimentary products for review, or case studies that they can review (if you’re providing a service).<img decoding="async" alt="Jason Acidre" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/Jason-Acidre.png">Jason Acidre, CEO Avaris Our pitches generally include: The client’s previous features in listicle posts.A suggestion to collaborate on enhancing the quality of their listicle post, given the client’s industry expertise.An analysis of top-ranking listicle posts to identify missing tools or information that could offer a competitive edge and improve their post’s rankings. <img decoding="async" alt="Alexandra Tachalova" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/Alexandra-Tachalova.png">Alexandra Tachalova, Founder Digital Olympus As Jason points out, this strategy has benefits beyond improving rankings for your website. It also exposes your brand to more people as you’re consistently listed as a top option in your industry. For example, Jason got his client mentioned in nearly every top-ranking listicle for “best dropshipping suppliers.” That’s a lot of extra brand exposure! Create data-led campaigns about a trending topic, then pitch journalists Apart from the selfie battle I have with Tim Soulo, this is one of the most effective link-building strategies we’re using right now. <img decoding="async" alt="Jason Hennessey" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/Jason-Hennessey.png">Jason Hennessey, CEO Hennessey DigitalHow to do it Start by finding a trending topic journalists care about. Google News and Google Trends are good places to start. We start by identifying current trends using tools like Google Trends and monitoring industry news. <img decoding="async" alt="Jason Hennessey" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/Jason-Hennessey.png">Jason Hennessey, CEO Hennessey Digital We use lots of techniques from monitoring news sources in real time to conducting research with Google News to understand the types of topics that have been previously covered at specific times of year. <img decoding="async" alt="Amanda Walls" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/Amanda-Walls.png">Amanda Walls, Head of SEO & Digital PR Cedarwood Digital You can also use the Growth metric in Ahrefs’ Keywords Explorer. For example, if I enter “vaping” and sort by the Growth column, I see lots of lung health searches breaking out in the past three months: <img decoding="async" width="982" height="494" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/growth-for-terms-related-to-lung-health-and-vaping.png" alt="Growth for terms related to lung health and vaping in the past three months, via Ahrefs' Keywords Explorer" class="wp-image-180668" style="width:586px;height:auto" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/09/growth-for-terms-related-to-lung-health-and-vaping.png 982w, https://ahrefs.com/blog/wp-content/uploads/2024/09/growth-for-terms-related-to-lung-health-and-vaping-680x342.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/09/growth-for-terms-related-to-lung-health-and-vaping-768x386.png 768w, https://ahrefs.com/blog/wp-content/uploads/2024/09/growth-for-terms-related-to-lung-health-and-vaping-400x200.png 400w" sizes="(max-width: 982px) 100vw, 982px"> I also see this echoed in Google News: <img decoding="async" width="1708" height="822" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/google-news-results-for-vaping-features-many-stori.jpg" alt="Google News results for vaping features many stories about lung issues" class="wp-image-180669" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/09/google-news-results-for-vaping-features-many-stori.jpg 1708w, https://ahrefs.com/blog/wp-content/uploads/2024/09/google-news-results-for-vaping-features-many-stori-680x327.jpg 680w, https://ahrefs.com/blog/wp-content/uploads/2024/09/google-news-results-for-vaping-features-many-stori-768x370.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2024/09/google-news-results-for-vaping-features-many-stori-1536x739.jpg 1536w" sizes="(max-width: 1708px) 100vw, 1708px"> It’s then a case of sourcing some unique data, publishing it in an easy-to-utilize format, and sending it to journalists. Matt Diggity shared a few great sources with me: For government databases you have usa.gov for the states. Data.gov is another alternative. UK Data Service is the equivalent for the UK. Eurostat is great for other countries in the EU. And Statistics Canada is for… yeah, Canada. Internationally, World Bank Open Data and United Nations Data are treasure troves. Pew Research Center is great for social issues, public opinion, and demographic trends. FBI Crime Data Explorer is great for crime stats. And the CDC is great for health data. <img decoding="async" alt="Matt Diggity" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/Matt-Diggity.png">Matt Diggity, Founder Diggity Marketing Amanda also often uses freedom of information (FOI) requests for data, as she did for her piece on the UK’s illegal vape hotspots:<img decoding="async" width="2048" height="1590" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/uk-illegal-vaping-hotspots-campaign.jpg" alt="UK illegal vaping hotspots campaign" class="wp-image-180670" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/09/uk-illegal-vaping-hotspots-campaign.jpg 2048w, https://ahrefs.com/blog/wp-content/uploads/2024/09/uk-illegal-vaping-hotspots-campaign-547x425.jpg 547w, https://ahrefs.com/blog/wp-content/uploads/2024/09/uk-illegal-vaping-hotspots-campaign-768x596.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2024/09/uk-illegal-vaping-hotspots-campaign-1536x1193.jpg 1536w" sizes="(max-width: 2048px) 100vw, 2048px"> This campaign earned links from 72 referring domains and got featured in many online newspapers: <img decoding="async" width="1436" height="732" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/the-campaign-earned-links-from-72-referring-domain.png" alt="The campaign earned links from 72 referring domains according to Ahrefs" class="wp-image-180671" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/09/the-campaign-earned-links-from-72-referring-domain.png 1436w, https://ahrefs.com/blog/wp-content/uploads/2024/09/the-campaign-earned-links-from-72-referring-domain-680x347.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/09/the-campaign-earned-links-from-72-referring-domain-768x391.png 768w" sizes="(max-width: 1436px) 100vw, 1436px"><img decoding="async" width="1074" height="498" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/lancashire-post-article-that-links-to-the-campaign.png" alt="Lancashire Post article that links to the campaign" class="wp-image-180672" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/09/lancashire-post-article-that-links-to-the-campaign.png 1074w, https://ahrefs.com/blog/wp-content/uploads/2024/09/lancashire-post-article-that-links-to-the-campaign-680x315.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/09/lancashire-post-article-that-links-to-the-campaign-768x356.png 768w" sizes="(max-width: 1074px) 100vw, 1074px">Example feature in the Lancashire Post<img decoding="async" width="1084" height="608" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/ardrossan-and-saltcoats-herald-article-that-links-to.png" alt="Ardrossan &amp; Saltcoats Herald article that links to the campaign" class="wp-image-180673" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/09/ardrossan-and-saltcoats-herald-article-that-links-to.png 1084w, https://ahrefs.com/blog/wp-content/uploads/2024/09/ardrossan-and-saltcoats-herald-article-that-links-to-680x381.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/09/ardrossan-and-saltcoats-herald-article-that-links-to-768x431.png 768w" sizes="(max-width: 1084px) 100vw, 1084px">Example feature in the Ardrossan & Saltcoats Herand<img decoding="async" width="1082" height="604" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/south-wales-guardian-article-that-links-to-the-cam.png" alt="South Wales Guardian article that links to the campaign" class="wp-image-180674" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/09/south-wales-guardian-article-that-links-to-the-cam.png 1082w, https://ahrefs.com/blog/wp-content/uploads/2024/09/south-wales-guardian-article-that-links-to-the-cam-680x380.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/09/south-wales-guardian-article-that-links-to-the-cam-768x429.png 768w" sizes="(max-width: 1082px) 100vw, 1082px">Example feature in the South Wales Guardian How do you find journalists? Here’s Jason’s advice: We start by researching those who have previously covered similar topics or industries. We use tools like Muck Rack, Cision, or even X to find journalists by searching for keywords related to our story. We look at bylines in relevant publications to see who is writing about related subjects and review their past articles to understand their interests and writing style. <img decoding="async" alt="Jason Hennessey" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/Jason-Hennessey.png">Jason Hennessey, CEO Hennessey DigitalBuild relationships with journalists, then have your client respond to their requests Journalists are always looking for comments, tips and advice from thought leaders. Nurture these relationships and meet request deadlines, and you position yourself as the PR expert who can help during busy periods.<img decoding="async" alt="Eva Cheng" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/Eva-Cheng.png">Eva Cheng, Digital PR Consultant Eva Cheng PRHow to do it One way is to sign up for HARO and other alternatives, but Eva recommends a more proactive approach. She builds relationships with journalists relevant to her clients so they come directly to her for tips and quotes. How can you find these people? Eva uses keyword alerts: I have Google Alerts set up for relevant keywords related to a brand or topic. For example, I have the words “vet,” “dog behaviour,” and “cat behaviour” set up for a pet insurance brand so I can see the related coverage mentioning these words. <img decoding="async" alt="Eva Cheng" src="https://ahrefs.com/blog/wp-content/uploads/2024/09/Ev'''
