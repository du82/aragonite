full_description = "Ahrefs SEO Toolbar is a free extension for Chrome, Firefox and Safari that provides valuable SEO data about the pages and websites you visit. 200k+ SEO professionals across the world use it in their daily work. For JavaScript-powered websites, the Toolbar will compare the raw HTML vs. rendered titles and meta descriptions to show you any differences. The “HTTP headers” tab in Ahrefs SEO Toolbar can show you the complete redirect chain (if any) that leads to the destination page. It also shows the HTTP headers of any URL. These headers can contain X-Robots-Tags with the directives for crawlers and are often overlooked. The “Links” tab lists all outbound links found on a page. This tool can also check the status of the outgoing links on demand. This section also allows you to export the list of outgoing links with their attributes into a .csv file. See how search results look in different countries with a SERP country-changer built into Ahrefs SEO Toolbar. If you have a paid subscription with Ahrefs, you can instantly see important SEO metrics for each page and website you visit: Get a better sense of ranking difficulty and competition with SEO metrics for the top-ranking pages. Export metrics for the top 100 results in one click. On-page SEO (also called on-site SEO) is the practice of optimizing web pages to rank higher in search engines. Domain Rating (DR) is an Ahrefs metric that shows the relative strength of a website's backlink profile. Install Ahrefs’ SEO Toolbar and have the most important SEO information at your fingertips at all times."
