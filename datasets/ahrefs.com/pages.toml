["https://ahrefs.com/blog/affiliate-keyword-research"]
title = "How to Do Keyword Research for Affiliate Sites"
description = "Keyword research for affiliate sites is about finding high-volume keywords, where you can naturally plug product recommendations."
full_description = '''Affiliate Marketing, Keyword ResearchHow to Do Keyword Research for Affiliate Sites By Joshua Hardwick ✓ Reviewed by Sam Oh October 27, 20207 min read<img src="https://ahrefs.com/blog/wp-content/uploads/2019/10/meme-425x425.jpg" width="85" height="85" alt="Joshua Hardwick" class="avatar avatar-85 wp-user-avatar wp-user-avatar-85 alignnone photo" /> Joshua Hardwick Head of Content @ Ahrefs (or, in plain English, I'm the guy responsible for ensuring that every blog post we publish is EPIC). Article PerformanceData from AhrefsLinking websites 47 Sign up for AhrefsGet SEO metrics of any website or URL.The number of websites linking to this post.This post's estimated monthly organic search traffic.Get the week's best marketing content Email Subscription Subscribe Leave this field empty if you're human: Contents Most people approach affiliate keyword research all wrong. They look for low competition keywords, write a blog post, then shoehorn in as many affiliate links as possible.This approach tends to be lots of traffic, but no clicks, conversions, or revenue.Luckily, there’s a simple solution: find keywords with lots of searches that you can rank for, which are about topics where you can naturally plug product recommendations.<img decoding="async" width="900" height="827" class="wp-image-40391" src="https://ahrefs.com/blog/wp-content/uploads/2020/10/affiliate-keyword-research.png" alt="affiliate keyword research" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/10/affiliate-keyword-research.png 900w, https://ahrefs.com/blog/wp-content/uploads/2020/10/affiliate-keyword-research-463x425.png 463w, https://ahrefs.com/blog/wp-content/uploads/2020/10/affiliate-keyword-research-768x706.png 768w" sizes="(max-width: 900px) 100vw, 900px">The reason this is important comes down to search intent.For example, someone searching for “best protein powder” is likely in the market for a product but wants to weigh up each option’s pros and cons before pulling the trigger. As a result, they’re quite likely to click and buy linked affiliate products in your post.However, someone searching for “what is protein powder” is unlikely to make a purchase anytime soon. They’re probably just researching a paper or want to know the difference between the types of powder. It’s unlikely they’ll click and buy any linked affiliate products.In this post, you’ll learn about the four best types of affiliate keywords to target.General comparisonsBranded comparisonsProduct reviewsT&A keywords New to affiliate marketing?Read our beginner’s guide to affiliate marketing.1. General comparisonsIf you’ve visited The Wirecutter, you’ll already be familiar with general comparison keywords. They follow the “best [product name]” format.Here are a few examples:best strollersbest carriersbest baby bottlesIt’s super easy to recommend products in these types of posts because their entire purpose is to compare products, and searchers are almost always in the market to purchase that type of product soon. You just need to help them decide which to buy.To find them, start by searching for one or two broad keywords in Keywords Explorer. For instance, if your site reviews baby products, you might search for “baby” and “toddler.”<img decoding="async" width="1600" height="895" class="wp-image-40399" src="https://ahrefs.com/blog/wp-content/uploads/2020/10/1-seed-keywords.png" alt="1 seed keywords" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/10/1-seed-keywords.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/10/1-seed-keywords-680x380.png 680w, https://ahrefs.com/blog/wp-content/uploads/2020/10/1-seed-keywords-768x430.png 768w, https://ahrefs.com/blog/wp-content/uploads/2020/10/1-seed-keywords-1536x859.png 1536w" sizes="(max-width: 1600px) 100vw, 1600px">From here, go to the Phrase match report to see all keyword ideas that contain one or more of these words, then use the “Include” filter to find keywords that also contain the word “best.”<img decoding="async" width="1144" height="571" class="wp-image-40396" src="https://ahrefs.com/blog/wp-content/uploads/2020/10/include-filter-keywords-explorer.gif" alt="include filter keywords explorer">This should give you tons of topic ideas. If there are too many, you might want to narrow things down by filtering for keywords with low Keyword Difficulty scores, say under 10.<img decoding="async" width="1600" height="539" class="wp-image-40390" src="https://ahrefs.com/blog/wp-content/uploads/2020/10/2-keyword-difficulty-filter.png" alt="2 keyword difficulty filter" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/10/2-keyword-difficulty-filter.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/10/2-keyword-difficulty-filter-680x229.png 680w, https://ahrefs.com/blog/wp-content/uploads/2020/10/2-keyword-difficulty-filter-768x259.png 768w, https://ahrefs.com/blog/wp-content/uploads/2020/10/2-keyword-difficulty-filter-1536x517.png 1536w, https://ahrefs.com/blog/wp-content/uploads/2020/10/2-keyword-difficulty-filter-650x220.png 650w" sizes="(max-width: 1600px) 100vw, 1600px">Just know that you shouldn’t only target low KD keywords because many of them compare low-value products like baby bathtubs, lotions, and wraps. While these keywords can help generate revenue, it’ll be a volume game. For that reason, you’ll also want to go after some keywords relating to products with higher price tags like car seats.Of course, keywords comparing high-ticket items are often more competitive, but you can find relatively low-competition ones by looking for those that target a specific person or need. These usually follow the “best [product name] for [user]” format:best car seat for small carbest carrier for newbornbest stroller for travelTo find these, enter a few high-priced items into Keywords Explorer. If your site is about baby products, these might be “car seat,” “stroller,” and “crib.”From here, go to the Phrase match report and use the “Include” filter to find keywords containing the words “best” and “for.” Just make sure the “all words” tab is selected, so both words are included.<img decoding="async" width="1600" height="866" class="wp-image-40402" src="https://ahrefs.com/blog/wp-content/uploads/2020/10/3-include-filter.png" alt="3 include filter" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/10/3-include-filter.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/10/3-include-filter-680x368.png 680w, https://ahrefs.com/blog/wp-content/uploads/2020/10/3-include-filter-768x416.png 768w, https://ahrefs.com/blog/wp-content/uploads/2020/10/3-include-filter-1536x831.png 1536w" sizes="(max-width: 1600px) 100vw, 1600px">You should then see a list of keywords that contain at least one of your high-ticket products and the words “best” and “for.”However, these keywords don’t always have low KD scores, and that’s the case for “best car seat for 3 year old,” which has a KD score of 22. But if you click the SERP button, you’ll see that there’s a mix of search results. Some pages are specifically comparing car seats for 3 year olds, whereas others are more broadly comparing car seats.<img decoding="async" width="1600" height="935" class="wp-image-40403" src="https://ahrefs.com/blog/wp-content/uploads/2020/10/4-mixed-serp-pages.jpg" alt="4 mixed serp pages" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/10/4-mixed-serp-pages.jpg 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/10/4-mixed-serp-pages-680x397.jpg 680w, https://ahrefs.com/blog/wp-content/uploads/2020/10/4-mixed-serp-pages-768x449.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2020/10/4-mixed-serp-pages-1536x898.jpg 1536w" sizes="(max-width: 1600px) 100vw, 1600px">However, you’ll notice that most of the more specific posts rank with low website authority and few referring domains. In contrast, the broader posts have more referring domains and come from higher-authority sites.<img decoding="async" width="1600" height="934" class="wp-image-40392" src="https://ahrefs.com/blog/wp-content/uploads/2020/10/5-serp-domains.jpg" alt="5 serp domains" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/10/5-serp-domains.jpg 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/10/5-serp-domains-680x397.jpg 680w, https://ahrefs.com/blog/wp-content/uploads/2020/10/5-serp-domains-768x448.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2020/10/5-serp-domains-1536x897.jpg 1536w" sizes="(max-width: 1600px) 100vw, 1600px">Assuming that we keep our post explicitly focused on car seats for three-year-olds, this could be a good topic.2. Branded comparisonsBranded comparisons are keywords where the searcher wants to compare the differences between two branded products. For example:beats studio wireless vs bose qc35airpods vs airpods progalaxy buds vs airpodsThese keywords usually have lower search demand, but they convert very well because the searcher has already narrowed down their purchasing decision to just a couple of products.The easiest way to find them is to enter a list of brands into a keyword research tool like Keywords Explorer, then go to the Phrase match report and use the “Include” filter to find keywords containing “vs.”For example, if we wanted to find stroller comparisons, we could search for brands like Bugaboo, City Select, and Uppababy.<img decoding="async" width="1600" height="701" class="wp-image-40398" src="https://ahrefs.com/blog/wp-content/uploads/2020/10/6-stroller-brands.png" alt="6 stroller brands" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/10/6-stroller-brands.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/10/6-stroller-brands-680x298.png 680w, https://ahrefs.com/blog/wp-content/uploads/2020/10/6-stroller-brands-768x336.png 768w, https://ahrefs.com/blog/wp-content/uploads/2020/10/6-stroller-brands-1536x673.png 1536w" sizes="(max-width: 1600px) 100vw, 1600px">If you can’t think of any brands off the top of your head, check the categories and brand names on a relevant online store. In this case, we can check the navigation bar on buybuybaby.com, where there’s a “Shop by brand” category that lists a bunch of popular brands.<img decoding="async" width="1400" height="1196" class="wp-image-40401" src="https://ahrefs.com/blog/wp-content/uploads/2020/10/7-ecommerce-categories.png" alt="7 ecommerce categories" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/10/7-ecommerce-categories.png 1400w, https://ahrefs.com/blog/wp-content/uploads/2020/10/7-ecommerce-categories-497x425.png 497w, https://ahrefs.com/blog/wp-content/uploads/2020/10/7-ecommerce-categories-768x656.png 768w" sizes="(max-width: 1400px) 100vw, 1400px">From our results in Keywords Explorer, “uppababy cruz vs vista” seems like a good low-hanging topic given that these strollers retail for $500 to over $1,000. And if we look at the SERP, we see that many top-ranking pages come from low-DR sites and have few referring domains, so it looks like they can be beaten quite easily.<img decoding="async" width="1600" height="660" class="wp-image-40400" src="https://ahrefs.com/blog/wp-content/uploads/2020/10/8-low-competition-rankings.png" alt="8 low competition rankings" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/10/8-low-competition-rankings.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/10/8-low-competition-rankings-680x281.png 680w, https://ahrefs.com/blog/wp-content/uploads/2020/10/8-low-competition-rankings-768x317.png 768w, https://ahrefs.com/blog/wp-content/uploads/2020/10/8-low-competition-rankings-1536x634.png 1536w" sizes="(max-width: 1600px) 100vw, 1600px">Sidenote. If the company you’ve entered makes multiple types of products like car seats and bottles, then it might be better to use model names like ‘uppababy cruz’ and ‘uppababy vista’ as your seed keywords instead. 3. Product reviewsProduct reviews keywords are those where searchers are looking for detailed reviews of individual products. For example:bugaboo buffalo reviewuppababy vista reviewbabyjogger city select reviewThese are perfect targets for affiliate sites because searchers are usually very close to making a purchase. They’ve already done their research, and something about a particular model struck a chord with them. Now they just want to read an in-depth review before pulling the trigger.However, as with branded comparisons, search volumes for product reviews tend to be lackluster. So if you’re going to bother buying and reviewing products, make sure that you choose the ones people are actually searching for.To find them, enter a few brand names into Keywords Explorer, go to the Phrase match report, then use the “Include” filter to find keywords containing the words “review.”<img decoding="async" width="1600" height="723" class="wp-image-40395" src="https://ahrefs.com/blog/wp-content/uploads/2020/10/8-review-keywords.png" alt="8 review keywords" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/10/8-review-keywords.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/10/8-review-keywords-680x307.png 680w, https://ahrefs.com/blog/wp-content/uploads/2020/10/8-review-keywords-768x347.png 768w, https://ahrefs.com/blog/wp-content/uploads/2020/10/8-review-keywords-1536x694.png 1536w" sizes="(max-width: 1600px) 100vw, 1600px">All that’s left to do is assess ranking difficulty and review the products you think you can rank for.4. T&A keywordsIf you want to rank your pages in Google, you’ll need some level of page and website authority, which means getting backlinks. However, the types of keywords we’ve discussed so far are commercial, so it’s hard to get links to the pages that target them.The solution is to target T&A keywords, which stands for Trust and Authority. These are keywords about non-commercial topics where you can create content that educates and informs your visitors.There are two main benefits to targeting these keywords:Build trust with your audience. People are more likely to trust your product recommendations if you can demonstrate expertise in the topic.Build authority through links. People are generally more likely to link to useful, non-commercial content than pages that exist to line your pockets.To find T&A keywords, enter a few seeds into Keywords Explorer, then go to the Questions report to see informational topics. If we were doing this for our baby site, our seeds might be parenting, toddler, and newborn.Next, filter for keywords with a high Keyword Difficulty score of something high like 40.<img decoding="async" width="1600" height="982" class="wp-image-40404" src="https://ahrefs.com/blog/wp-content/uploads/2020/10/9-ta-keywords.png" alt="9 ta keywords" srcset="https://ahrefs.com/blog/wp-content/uploads/2020/10/9-ta-keywords.png 1600w, https://ahrefs.com/blog/wp-content/uploads/2020/10/9-ta-keywords-680x417.png 680w, https://ahrefs.com/blog/wp-content/uploads/2020/10/9-ta-keywords-768x471.png 768w, https://ahrefs.com/blog/wp-content/uploads/2020/10/9-ta-keywords-1536x943.png 1536w" sizes="(max-width: '''
