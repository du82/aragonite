full_description = 'Tags are a great way to group keywords by page type. For example, you may want to track keyword rankings for keywords of different categories separately. If you’re tracking keywords in more than one area, you can narrow down the list using the “Location” filter. Filter for keywords that rank in particular positions or those that have recently improved or declined. For example, if you want to optimize for featured snippets, you can click the “You don’t rank” radio button and select only “Featured snippet.” This shows you all keywords where a featured snippet is present in the organic search results, but you don’t currently rank for it. Generally speaking, ranking for more SERP features means more organic traffic. If they appear for your tracked keywords, consider pursuing them. Hit the “SERP features” tab to see the percentage of SERP features that you currently rank for across all tracked keywords. In the example above, you can see that 303 of our tracked keywords for our blog show featured snippets, yet we only rank for 32 (11%). Click on the “Position History” dropdown to see the ranking progress for any tracked keyword over time. Hit the "SERP" dropdown to see the first page of search results for your keyword, along with their SEO metrics. This allows you to quickly assess the top-ranking pages and understand why these pages are ranking where they are. An Ahrefs account is required to take this exam. Sign up for a free Webmaster Tools account or paid subscription if you don’t have one.'
