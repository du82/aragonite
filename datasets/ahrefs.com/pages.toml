title = "Backlinks alerts"
description = "Learn how to use Backlinks alerts to monitor your website for lost links, monitor new backlinks to competing pages, and more."
full_description = '''This alert notifies you via email when the specified domain, subdomain (e.g., blog.domain.com), subfolder (e.g., domain.com/blog) or URL gains or loses backlinks. If you're trying to rank for a competitive keyword, there's a good chance that the top-ranking pages are getting new backlinks regularly because of their ranking position. For a constant stream of new link prospects, set up a backlinks alert for these competing pages, then reach out and try and get your page mentioned instead. To set things up, paste one of the top-ranking pages into the "Domain or URL" field. Then set the mode to "Prefix" and the "Scope to "New backlinks." You can also do this for your competitors’ homepages. For example, if you’re a plumber, you can monitor other local plumbers’ homepages to see how they’re building backlinks and where they’re getting them from. Often, a page loses links because of accidental mistakes. That means some of them are potentially reclaimable. The first step towards doing this is to monitor for lost links. To do that, enter your domain or URL in the “Domain or URL” field, then choose "Lost backlinks" for the "Scope." Check out this video on finding quality backlink opportunities in real-time, or check out some of our guides on the Ahrefs blog: An Ahrefs account is required to take this exam. Sign up for a free Webmaster Tools account or paid subscription if you don’t have one.'''
