["https://ahrefs.com/blog/2024-roundup"]
title = "The Ahrefs Roundup 2024: New Features, Big Wins, and What's Coming Next"
description = "Discover 2024 highlights, from a bunch of exciting new AI tools to absolute game-changers like Content changes and Report Builder."
full_description = '''Product BlogThe Ahrefs Roundup 2024: New Features, Big Wins, and What’s Coming Next By Rebekah Bek Updated: December 18, 202410 min read<img src="https://ahrefs.com/blog/wp-content/uploads/2023/11/Image_Editor-425x425.png" width="85" height="85" alt="Rebekah Bek" class="avatar avatar-85 wp-user-avatar wp-user-avatar-85 alignnone photo" /> Rebekah Bek Developing content to help you understand, navigate, and love using Ahrefs. Article PerformanceData from AhrefsLinking websites 4 Sign up for AhrefsGet SEO metrics of any website or URL.The number of websites linking to this post.This post's estimated monthly organic search traffic.Get the week's best marketing content Email Subscription Subscribe Leave this field empty if you're human: Contents As 2024 winds down, it’s the perfect time to highlight all the biggest features Ahrefs has introduced over the past year. From a bunch of exciting new AI tools to absolute game-changers like Content changes and Report Builder, to taking our Site Audit tool to the next level, we’ll go through it all in this post.Plus, we’re not just reflecting on the past today – we’re also taking a glimpse into what’s coming soon to Ahrefs in 2025.Let’s go!(Short on time? Check out our changelog instead for a succinct list of new features.)AI toolsOur AI tools are designed to boost your productivity and save you time by automating keyword research, content optimization, and technical SEO tasks.AI Content HelperAI Content Helper is a more natural content optimization tool that focuses on comprehensive topical coverage rather than keyword stuffing.Instead of counting the number of keywords to include in your article, our Content Helper uses AI to identify the core topics for your target keyword. It then scores your content, along with your competitors’, against those topics in real-time as you write the article.You can also use AI features to brainstorm title tags, meta descriptions, and headings – and pretty soon, get internal linking suggestions to boost your content authority.AI Content Helper is free while in beta, so take it for a spin and let us know how we can improve it!Learn more about AI Content Helper →AI translationsTranslating keywords for regional markets for international SEO is not an easy process. You need to:Compile a keyword list with SEO metricsHire experienced translatorsTrancreate keywordsCreate a content plan based on the transcreated keywordsAhrefs’ AI translator can do all these at once, saving you time – and translator fees! – to scale your content strategy globally.Start from a saved keyword list, choose from 40+ preferred languages and dialects followed by the keyword location, and hit “Translate”.<img decoding="async" class="alignnone size-medium" src="https://ahrefs.com/blog/wp-content/uploads/2024/06/image5.gif" width="800" height="453">What sets it apart from other translation management tools is that you’ll get translated alternatives of each keyword, so you can choose the version with the highest keyword search volume (like the translation of the “popcorn” across various Latin-American countries).<img decoding="async" class="alignnone size-full wp-image-183306" src="https://ahrefs.com/blog/wp-content/uploads/2024/12/image4.png" alt width="1160" height="722" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/12/image4.png 1160w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image4-680x423.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image4-768x478.png 768w" sizes="(max-width: 1160px) 100vw, 1160px">AI Content GraderSimilarly to AI Content Helper, AI Content Grader automatically analyzes the top-ranking pages for an existing article and keyword and scores it against its competitors.It then paints a clear picture of the exact areas that require content improvements.<img decoding="async" class="alignnone size-medium" src="https://ahrefs.com/blog/wp-content/uploads/2024/03/ai-content-grader.gif" width="800" height="561">AI Content Grader also shows you suggestions on how to best cover subtopics, word-for-word, by providing a real-life example from a top-ranking page.<img decoding="async" class="alignnone size-full wp-image-183326" src="https://ahrefs.com/blog/wp-content/uploads/2024/12/image24.png" alt width="842" height="774" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/12/image24.png 842w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image24-462x425.png 462w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image24-768x706.png 768w" sizes="(max-width: 842px) 100vw, 842px">AI Search intentSearch intent – the reason behind a search query – can sometimes be obvious (transactional in this case).<img decoding="async" class="alignnone size-full wp-image-183305" src="https://ahrefs.com/blog/wp-content/uploads/2024/12/image3.png" alt width="1438" height="746" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/12/image3.png 1438w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image3-680x353.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image3-768x398.png 768w" sizes="(max-width: 1438px) 100vw, 1438px">When it comes to queries with multiple intents or unclear ones, our AI can help to analyze the different types of search intents and show what content angles to tackle next.We also break down the percentage of total traffic that goes to each one of them – something no other SEO tool can do at the moment. Use them as hints as to what content angles you can use to rank.<img decoding="async" class="alignnone size-full wp-image-183318" src="https://ahrefs.com/blog/wp-content/uploads/2024/12/image16.jpg" alt width="1994" height="1376" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/12/image16.jpg 1994w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image16-616x425.jpg 616w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image16-768x530.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image16-1536x1060.jpg 1536w" sizes="(max-width: 1994px) 100vw, 1994px">Learn more about AI Search Intent → Cross-toolContent changesWhat’s one of the hardest SEO problems to crack? Finding out what causes a change in organic traffic.Now, you can easily monitor one of the most hidden ones, page-level content changes, across various reports.Site Explorer > Overview performance chartJust turn on Content changes from the three ellipses.<img decoding="async" class="alignnone size-full wp-image-183329" src="https://ahrefs.com/blog/wp-content/uploads/2024/12/image27.png" alt width="1736" height="910" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/12/image27.png 1736w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image27-680x356.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image27-768x403.png 768w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image27-1536x805.png 1536w" sizes="(max-width: 1736px) 100vw, 1736px">Hover over these green bubbles to see the extent of content changes made on a page (moderate/major/overhaul) and their influence on traffic numbers. Hit View changes to open the Page Inspect tool and compare the content changes side-by-side to see exactly what changed.<img decoding="async" class="alignnone size-full wp-image-183310" src="https://ahrefs.com/blog/wp-content/uploads/2024/12/image8.png" alt width="1756" height="1058" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/12/image8.png 1756w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image8-680x410.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image8-768x463.png 768w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image8-1536x925.png 1536w" sizes="(max-width: 1756px) 100vw, 1756px">Site Explorer > Top pagesYou can also go broad and analyze top-performing pages via the Top Pages report across two different dates. Check whether content changes have impacted the traffic changes under the Traffic changes column.<img decoding="async" class="alignnone size-full wp-image-183312" src="https://ahrefs.com/blog/wp-content/uploads/2024/12/image10.jpg" alt width="1999" height="914" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/12/image10.jpg 1999w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image10-680x311.jpg 680w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image10-768x351.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image10-1536x702.jpg 1536w" sizes="(max-width: 1999px) 100vw, 1999px">Learn more about Content changes → Keyword search intentsGet ready to level up your keyword game – with the Search Intents column, you’ll instantly uncover what searchers are really looking for. See common search intents for keywords like: commercial, transactional, informational, and so on.We also break it down and show if keywords are:Branded: When searchers have a specific brand in mind.Local: When they’re looking for nearby services or locations.You’ll find keyword intents in Site Explorer and Keywords Explorer reports, Rank Tracker Overview 2.0, and Site Explorer Overview widgets.<img decoding="async" class="alignnone size-full wp-image-183304" src="https://ahrefs.com/blog/wp-content/uploads/2024/12/image2.gif" alt width="976" height="720">Learn more about keyword search intents → Site ExplorerSOV + SOTV in OverviewWant to measure your brand’s popularity and visibility across organic search?The share of voice (SOV) metric shows the percentage of traffic that your target website gets, compared to the traffic of other websites. Just add multiple competitors – up to 10! – in the Performance chart on Site Explorer > Overview.<img decoding="async" class="alignnone wp-image-183316 size-full" src="https://ahrefs.com/blog/wp-content/uploads/2024/12/image14.png" alt width="1999" height="873" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/12/image14.png 1999w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image14-680x297.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image14-768x335.png 768w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image14-1536x671.png 1536w" sizes="(max-width: 1999px) 100vw, 1999px">We’ve also added a Share of Traffic Value (SoTV) metric. This sums up the Traffic value of the target (the estimated cost of traffic it were to be paid for via PPC ads) and the specified competitors, then shows what percentage share the target and its competitors occupy.<img decoding="async" class="alignnone size-full wp-image-183314" src="https://ahrefs.com/blog/wp-content/uploads/2024/12/image12.png" alt width="1999" height="765" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/12/image12.png 1999w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image12-680x260.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image12-768x294.png 768w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image12-1536x588.png 1536w" sizes="(max-width: 1999px) 100vw, 1999px">Calculating the ROI of content is a hard task in itself. That’s why you can use this metric as a proxy to see how valuable your content is compared to existing organic competitors in the market landscape.Paid search tabThe Paid search tab in Site Explorer Overview gives you insights into your target’s:Top ads, along with the exact ad copy and key metricsTop paid keywordsTop paid pagesUse these to get a great overview of the exact keywords your competitors are bidding on and which keywords are sending them the most paid traffic, plus their best-performing paid pages.<img decoding="async" class="alignnone size-full wp-image-183317" src="https://ahrefs.com/blog/wp-content/uploads/2024/12/image15.png" alt width="1758" height="948" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/12/image15.png 1758w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image15-680x367.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image15-768x414.png 768w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image15-1536x828.png 1536w" sizes="(max-width: 1758px) 100vw, 1758px">Linking authorsTargeted link building just got more streamlined with the Linking authors report. Use this to see a list of authors who commonly link to your competitors, find journalists who commonly publish within your industry, and so on.You’ll see useful stats for each linking author like:Top DR, which tells you the highest DR out of all referring domainsNo. of referring pagesTotal estimated traffic from that authorNo. of links<img decoding="async" class="alignnone size-full wp-image-183328" src="https://ahrefs.com/blog/wp-content/uploads/2024/12/image26.png" alt width="1780" height="934" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/12/image26.png 1780w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image26-680x357.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image26-768x403.png 768w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image26-1536x806.png 1536w" sizes="(max-width: 1780px) 100vw, 1780px">Keywords ExplorerGrowth metricNeed to find trending keywords that are hot in your industry over the last few months? Use the Growth metric.The Growth metric in Keywords Explorer shows keywords’ search volume growth rate over 3, 6, or 12 months.<img decoding="async" class="alignnone size-full wp-image-183311" src="https://ahrefs.com/blog/wp-content/uploads/2024/12/image9.png" alt width="1584" height="712" srcset="https://ahrefs.com/blog/wp-content/uploads/2024/12/image9.png 1584w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image9-680x306.png 680w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image9-768x345.png 768w, https://ahrefs.com/blog/wp-content/uploads/2024/12/image9-1536x690.png 1536w" sizes="(max-width: 1584px) 100vw, 1584px">Or, filter for keywords that had a specific growth rate over a time period and sort results by growth.AI Overviews in SERP overviewIn the SERP overview in Site Explorer, Competitive Analysis, Keywords Explorer, and Rank Tracker, we now show SERPs with AI Overviews. Just expand it to see all the links and URLs inside.Filter presets for use casesWant to apply multiple filters for common use cases?Just use these filter presets. For example, to see trending keyword ideas for the seed keyword “iphone 16”, just select Presets and hit “Trending”.Site AuditWe have big plans for Site Audit in 2025 – we’re set to become the world’s first fully automated site audit tool, and these are the features we’ve rolled out (and a peek at what we’re working on!) to take us there.Autosubmit to IndexnowIndexNow is an open-source protocol that lets web publishers inform participating search engines when changes are made to a website, for faster indexing of content changes.Just enable Auto-submit to IndexNow in your Project settings, and Site Audit will automatically submit your site’s content changes to IndexNow during crawling. So, no need to submit changes manually anymore!<img decoding="async" class="alignnone size-full wp-image-183308" src="https://ahrefs.com/blog/wp-content/uploads/2024/12/image6.png" alt width="1562" height="624" srcset'''
