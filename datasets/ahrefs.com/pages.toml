full_description = 'Parent Topic determines if you can rank for your target keyword while targeting a more general topic instead. To identify the Parent Topic, we take the #1 ranking page for your keyword and find the query sending the most search traffic to that page. For example, we’re targeting the keyword “alternative search engines.” However, the Parent Topic tells us that we could rank for both “search engines,” and “alternative search engines,” with the same page. In this case, it might be worth optimizing for the Parent Topic, then adding the keyword to Rank Tracker. Hit the "SERP" dropdown to see the first page of the search results for your keyword, along with important SEO metrics. This allows you to quickly assess the top-ranking pages and understand why these pages are ranking where they are. An Ahrefs account is required to take this exam. Sign up for a free Webmaster Tools account or paid subscription if you don’t have one.'
