title = "Introducing: Portfolios"
description = "Ahrefs' Portfolios allow you to group URLs from 10 different domains and monitor their aggregated metrics in Site Explorer's reports."
full_description = '''Product BlogIntroducing: Portfolios By Andrei Țiț ✓ Reviewed by Rebekah Bek , En Ci Yap September 12, 20232 min read<img src="https://ahrefs.com/blog/wp-content/uploads/2022/03/Andrei-Tit-28_cropped.png" width="85" height="85" alt="Andrei Țiț" class="avatar avatar-85 wp-user-avatar wp-user-avatar-85 alignnone photo" /> Andrei Țiț Showing you how to make the most out of Ahrefs. Mostly through: how-to videos, product updates, webinars, and brochures. Article PerformanceData from AhrefsLinking websites 59 Sign up for AhrefsGet SEO metrics of any website or URL.The number of websites linking to this post.This post's estimated monthly organic search traffic.Get the week's best marketing content Email Subscription Subscribe Leave this field empty if you're human: Contents We’ve just launched a new view that’s useful for both in-house and client reporting: Portfolios.ContentsHow Portfolios workPortfolios allow you to group a list of targets (domains, subfolders, or URLs) and view their aggregated metrics in Site Explorer’s reports.<img decoding="async" class="wp-image-166553" style="object-fit: cover; width: 287px; height: 302px;" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/image8-6.png" alt="How to add a portfolio in Ahrefs " width="287" height="302">From here:1. Add URLs from up to 10 different domains2. Select the preferred protocol and target mode3. Name the portfolio4. Share it with the appropriate team members<img decoding="async" width="1280" height="1290" class="wp-image-166554" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/image10-4.png" alt="Portfolio setup bubble in Ahrefs " srcset="https://ahrefs.com/blog/wp-content/uploads/2023/09/image10-4.png 1280w, https://ahrefs.com/blog/wp-content/uploads/2023/09/image10-4-422x425.png 422w, https://ahrefs.com/blog/wp-content/uploads/2023/09/image10-4-768x774.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/09/image10-4-120x120.png 120w" sizes="(max-width: 1280px) 100vw, 1280px">Once saved, the portfolio will always be shown on your dashboard, along with top-level metrics.<img decoding="async" width="1999" height="709" class="wp-image-166556" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/image1-8.png" alt="Portfolio added on Ahrefs' dashboard " srcset="https://ahrefs.com/blog/wp-content/uploads/2023/09/image1-8.png 1999w, https://ahrefs.com/blog/wp-content/uploads/2023/09/image1-8-680x241.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/09/image1-8-768x272.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/09/image1-8-1536x545.png 1536w" sizes="(max-width: 1999px) 100vw, 1999px">Clicking on any of the metrics will take you to the corresponding report in Site Explorer.<img decoding="async" class="alignnone size-full wp-image-166596" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/asd.png" alt="Portfolio for ten competitors in Ahrefs" width="2274" height="1230" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/09/asd.png 2274w, https://ahrefs.com/blog/wp-content/uploads/2023/09/asd-680x368.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/09/asd-768x415.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/09/asd-1536x831.png 1536w, https://ahrefs.com/blog/wp-content/uploads/2023/09/asd-2048x1108.png 2048w" sizes="(max-width: 2274px) 100vw, 2274px">Now that you’re familiar with the interface, let’s jump into a few use cases.Use casesDepending on the target URLs added, you can use Portfolios to track the performance of:1. Your competitorsAdd your competitors’ websites to a portfolio to get extensive competitive intelligence insights:See the top winners and losers in terms of their top pages and keywords: (Top pages report > Traffic filter: Improved)<img decoding="async" class="alignnone size-full wp-image-166600" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/5-2.png" alt="Top pages report for 10 URLs in Ahrefs' Site Explorer" width="2834" height="960" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/09/5-2.png 2834w, https://ahrefs.com/blog/wp-content/uploads/2023/09/5-2-680x230.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/09/5-2-768x260.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/09/5-2-1536x520.png 1536w, https://ahrefs.com/blog/wp-content/uploads/2023/09/5-2-2048x694.png 2048w, https://ahrefs.com/blog/wp-content/uploads/2023/09/5-2-650x220.png 650w" sizes="(max-width: 2834px) 100vw, 2834px">Check out the pace at which they acquire new links and referring domains: (Backlinks report > Dofollow > New backlinks > Status: Newly published)<img decoding="async" class="alignnone size-full wp-image-166601" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/6-1.png" alt="Backlinks report for 10 URLs in Ahrefs' Site Explorer" width="2832" height="982" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/09/6-1.png 2832w, https://ahrefs.com/blog/wp-content/uploads/2023/09/6-1-680x236.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/09/6-1-768x266.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/09/6-1-1536x533.png 1536w, https://ahrefs.com/blog/wp-content/uploads/2023/09/6-1-2048x710.png 2048w" sizes="(max-width: 2832px) 100vw, 2832px">Study their paid ads and paid keywords to understand which ones resonate with your target audience: (Paid pages report > Keywords and Ads nested tables)<img decoding="async" class="alignnone size-full wp-image-166602" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/7.png" alt="Paid pages report for 10 URLs in Ahrefs' Site Explorer " width="2824" height="1042" srcset="https://ahrefs.com/blog/wp-content/uploads/2023/09/7.png 2824w, https://ahrefs.com/blog/wp-content/uploads/2023/09/7-680x251.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/09/7-768x283.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/09/7-1536x567.png 1536w, https://ahrefs.com/blog/wp-content/uploads/2023/09/7-2048x756.png 2048w" sizes="(max-width: 2824px) 100vw, 2824px">2. Your content writers and their portfoliosIf you have an internal content team, create a portfolio for each content writer and track their performance over time.For example, our content lead, Joshua Hardwick, has written 147 articles, which rank for 46,000 keywords that generate close to 250,000 organic search visits a month.<img decoding="async" width="1999" height="376" class="wp-image-166566" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/image2-4.png" alt="Joshua Hardwick's blog posts portfolio in Ahrefs " srcset="https://ahrefs.com/blog/wp-content/uploads/2023/09/image2-4.png 1999w, https://ahrefs.com/blog/wp-content/uploads/2023/09/image2-4-680x128.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/09/image2-4-768x144.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/09/image2-4-1536x289.png 1536w" sizes="(max-width: 1999px) 100vw, 1999px">You can also go one step further and compare your content team’s portfolios. This should help you with your overall content strategy and hiring decisions.3. Your published content on your client’s websiteIf you’re an agency, create a portfolio of your published content on your customer’s website and track the percentage (%) of organic traffic and backlinks it has generated compared to the rest of the website.The ROI of your content should be more transparent this way.For example, if we were to group our free tools into a portfolio, we’d notice they generate close to 937,000 organic search traffic a month.<img decoding="async" width="1999" height="376" class="wp-image-166568" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/image5-7.png" alt="Total organic traffic from Ahrefs' free tools " srcset="https://ahrefs.com/blog/wp-content/uploads/2023/09/image5-7.png 1999w, https://ahrefs.com/blog/wp-content/uploads/2023/09/image5-7-680x128.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/09/image5-7-768x144.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/09/image5-7-1536x289.png 1536w" sizes="(max-width: 1999px) 100vw, 1999px">That’s 34% of our total traffic of 2.7 million search visits.<img decoding="async" width="1999" height="397" class="wp-image-166570" src="https://ahrefs.com/blog/wp-content/uploads/2023/09/image7-6.png" alt="Total organic traffic from ahrefs.com " srcset="https://ahrefs.com/blog/wp-content/uploads/2023/09/image7-6.png 1999w, https://ahrefs.com/blog/wp-content/uploads/2023/09/image7-6-680x135.png 680w, https://ahrefs.com/blog/wp-content/uploads/2023/09/image7-6-768x153.png 768w, https://ahrefs.com/blog/wp-content/uploads/2023/09/image7-6-1536x305.png 1536w" sizes="(max-width: 1999px) 100vw, 1999px">Upcoming featuresPortfolios are available for new Standard, Advanced, and Enterprise plans.At the moment, Portfolios only work with Site Explorer. In the future, they will support:More Site Explorer reports (Best by links, Linked domains, etc.).APIv3 endpoints.We’re excited to see what other use cases you’re going to find for Portfolios!If you have any feature suggestions that could enhance the tool, let us know on our Canny page or Ahrefs community. Copy linkArticle PerformanceData from AhrefsLinking websites 59 Sign up for AhrefsGet SEO metrics of any website or URL.The number of websites linking to this post.This post's estimated monthly organic search traffic.Get the week's best marketing content Email Subscription Subscribe Leave this field empty if you're human: <img title="Andrei Țiț" src="https://ahrefs.com/blog/wp-content/themes/Ahrefs-4/images/authors/AndreiMarcelTit.jpg"><img src="https://ahrefs.com/blog/wp-content/uploads/2022/03/Andrei-Tit-28_cropped.png" width="140" height="140" alt="Andrei Țiț" class="avatar avatar-145 wp-user-avatar wp-user-avatar-145 alignnone photo" />Article by Andrei Țiț Showing you how to make the most out of Ahrefs. Mostly through: how-to videos, product updates, webinars, and brochures.'''
