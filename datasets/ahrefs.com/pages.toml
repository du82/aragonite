["https://ahrefs.com/academy/how-to-use-ahrefs/account/add-first-project"]
title = "How to add your first project"
description = "Learn the two main ways to add your first Ahrefs project, and about the faster option we recommend."
full_description = "To do so, hit the Import from GSC button, choose the Google email address your website is associated with, and then follow the on-screen instructions. In addition, your GSC data will be available in the Dashboard and Rank Tracker tools, where you can monitor your performance data for longer than the 16 months as limited by GSC itself. If you’d prefer to define your project settings in more detail, click on the “Add manually” button to start the manual process containing five steps: For example, if we type in “ahrefs.com” and choose “Subdomains” mode, the scope of the project is the entire ahrefs.com root domain. However, if we type in “ahrefs.com/blog” and choose “Path” mode, the scope of the project will be only pages that belong to that path. Hence, subdomains (like “www.ahrefs.com”) and other URLs not included in the path (like “ahrefs.com/site-audit/”) will be excluded. If you're having any issues with the other three methods, check out our tutorial on how to verify ownership. URL sources – Define your seed URLs. By default, we crawl your website from your project’s URL and automatically detect sitemaps. Crawl settings – Set speed settings, limits, and exclude certain links from your crawls (we’ll touch more on this in the Site Audit module). You can track the same keywords for multiple locations. This will consume two keywords from your tracked keywords allowance. The last step of the manual process is to define your competitors. These may not necessarily be your direct competitors. We automatically detect and suggest competitors based on the number of common keywords they have with your target, but you can also add them manually if you have specific competitors in mind. This data will then feed Rank Tracker’s competitor reports and compare your target’s rankings, share of voice, and other important metrics against your competitors’. An Ahrefs account is required to take this exam. Sign up for a free Webmaster Tools account or paid subscription if you don’t have one."
