["https://ahrefs.com/blog/long-tail-keywords"]
title = "Long-tail Keywords: What They Are and How to Get Search Traffic From Them"
description = "Tim Soulo is CMO at Ahrefs. With over 15 years in the digital marketing industry, Tim is the author of many data-driven studies and actionable marketing frameworks, some of which gained industry-wide recognition. He enjoys challenging conventional marketing knowledge and optimizing for simplicity and efficiency."
full_description = '''Keyword ResearchLong-tail Keywords: What They Are and How to Get Search Traffic From Them By Tim Soulo November 25, 202111 min read<img src="https://ahrefs.com/blog/wp-content/uploads/2024/05/Tim_profile_pic-120x120.jpg" width="85" height="85" alt="Tim Soulo" class="avatar avatar-85 wp-user-avatar wp-user-avatar-85 alignnone photo" /> Tim Soulo Tim Soulo is CMO at Ahrefs. With over 15 years in the digital marketing industry, Tim is the author of many data-driven studies and actionable marketing frameworks, some of which gained industry-wide recognition. He enjoys challenging conventional marketing knowledge and optimizing for simplicity and efficiency. Article PerformanceData from AhrefsOrganic traffic 1.19KLinking websites 1.73K Sign up for AhrefsGet SEO metrics of any website or URL.The number of websites linking to this post.This post's estimated monthly organic search traffic.Get the week's best marketing content Email Subscription Subscribe Leave this field empty if you're human: Contents People often say that long-tail keywords are easier to rank for and convert better. But is this actually true?It depends. There are two different types of long-tail keywords, and some are no easier to rank for than their short-tail counterparts.In this article, you’ll learn the differences between the two types of long-tail keywords and how to find them. But first, let’s dive into the key things we’ll cover:What are long-tail keywords?Why are they called long-tail keywords?What makes long-tail keywords so great?How to find long-tail keywords?The two types of long-tail keywordsWhat are long-tail keywords?Long-tail keywords are search queries that get a small number of searches per month. They tend to be longer and more specific than their “head” counterparts and, therefore, often have a higher conversion rate.For example, the keyword “meditation” is a “head” keyword because it gets 211k searches per month. The keyword “can meditation make you smarter” is a long-tail keyword because it only gets 50 searches per month.<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/1-meditation-head-and-long-tail-1-680x190.jpg" alt class="wp-image-137048" width="510" height="143" srcset="https://ahrefs.com/blog/wp-content/uploads/2021/11/1-meditation-head-and-long-tail-1-680x190.jpg 680w, https://ahrefs.com/blog/wp-content/uploads/2021/11/1-meditation-head-and-long-tail-1.jpg 750w" sizes="(max-width: 510px) 100vw, 510px">Why are they called “long-tail” keywords?Long-tail keywords got their name from their position on the “search demand” curve. If we plot all search queries that people have performed in Google in the course of a month and order them by their search volumes, it’ll look somewhat like this:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/2-search-demand-curve.jpg" alt="The search demand curve" ref="center">At the “head” of the curve, we have a tiny number of keywords with super high search volumes, while the “tail” consists of billions of keywords with very low search volumes.To be precise, in Ahrefs’ U.S. database (which is the biggest in the industry, by the way), there are just 31,000 keywords with search volumes of more than 100k searches per month; on the other hand, there are 3.8 billion keywords that have fewer than 10 searches per month.Here’s how this looks like in a pie chart:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/3-search-volume-distribution.png" alt="Search volume distribution for 4 billion keywords" ref="center">As you can tell, keywords with fewer than 10 searches per month account for almost 95% of our U.S. keyword database. This should not really come as a surprise, given that ~15% of daily Google searches are new and have never been searched before.95% of all search queries in the U.S. get fewer than 10 searches per month.But to qualify as “long-tail,” a keyword doesn’t necessarily have to get fewer than 10 searches per month. And there’s no specific search volume threshold, which would define a keyword as “long-tail.” It mostly depends on the “head” keyword that you’re comparing it to. What is a big mistake, though, is to define long-tail keywords by their length in words.The thing is, there are many one-word keywords that get fewer than 100 monthly searches. There are also keywords five words long (or more) with hundreds of thousands of monthly searches.<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/4-one-word-vs-five-word-keywords.jpg" alt="Long-tail keywords consisting of just one word" ref="center">So it is not the length of a keyword that makes it a long-tail. It’s the search volume of that keyword.What makes long-tail keywords so great?Here are three reasons why you should consider making long-tail keywords an integral part of your SEO strategy.Reason 1. Long-tail keywords are (generally) a lot less competitiveLet’s say you’ve just launched a blog about cryptocurrencies. There are lots of popular keywords with high search volumes that could potentially drive LOADS of traffic to your blog:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/5-bitcoin-popular-keywords-2-628x425.jpg" alt class="wp-image-137061" width="471" height="319" srcset="https://ahrefs.com/blog/wp-content/uploads/2021/11/5-bitcoin-popular-keywords-2-628x425.jpg 628w, https://ahrefs.com/blog/wp-content/uploads/2021/11/5-bitcoin-popular-keywords-2.jpg 632w" sizes="(max-width: 471px) 100vw, 471px">Those keywords are tempting to target. But let’s be real. What are the chances that your blog will rank for any of them anytime soon?All of the above keywords have a high Keyword Difficulty (KD) score. This means it’ll be incredibly hard to get to the first page of Google for any of them. And if your website is brand new, that feat will be plain impossible. Now let’s look at some of the less popular search queries for the topic of bitcoin:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/6-bitcoin-less-popular-keywords-1-680x413.jpg" alt class="wp-image-137062" width="510" height="310" srcset="https://ahrefs.com/blog/wp-content/uploads/2021/11/6-bitcoin-less-popular-keywords-1-680x413.jpg 680w, https://ahrefs.com/blog/wp-content/uploads/2021/11/6-bitcoin-less-popular-keywords-1-768x466.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2021/11/6-bitcoin-less-popular-keywords-1.jpg 834w" sizes="(max-width: 510px) 100vw, 510px">As you can see, this time, their KD score is low. This means that even a new website has a chance to rank in the top 10 search results and get a few visitors from those keywords.Reason 2. Long-tail keywords are (generally) easier to addressLet’s continue comparing the two sets of keywords above. “How to buy bitcoin” seems like a rather straightforward question to answer. But if you look at the top-ranking page for that search query, it is actually 3,400 words long. Conversely, the top-ranking page for “how to cash out large amounts of bitcoin” is just 1,000 words long.The thing is, the more general the search query is, the more details you’ll have to include when addressing it. But if the search query is specific, you can often answer it rather briefly and still satisfy the searchers.In other words, creating content for long-tail keywords generally requires less work.Other than that, you can actually look for groups of similar long-tail search queries and address them with pages that only have a few differences. For example, check out the following group of keywords:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/7-best-website-builder-keywords-1-541x425.jpg" alt class="wp-image-137064" width="541" height="425" srcset="https://ahrefs.com/blog/wp-content/uploads/2021/11/7-best-website-builder-keywords-1-541x425.jpg 541w, https://ahrefs.com/blog/wp-content/uploads/2021/11/7-best-website-builder-keywords-1-768x603.jpg 768w, https://ahrefs.com/blog/wp-content/uploads/2021/11/7-best-website-builder-keywords-1.jpg 830w" sizes="(max-width: 541px) 100vw, 541px">The same website builder software would likely suit therapists just as well as it would suit teachers or actors. This means you can target all these different searches with pages that have 80% similar content, while the remaining 20% will be tailored to each user profile.In other words, you can easily create a dozen pages in one day to address those similar long-tail searches.Reason 3. There are LOTS of themYes, each individual long-tail keyword won’t open floodgates of traffic to your website. But as you address more and more of them, the search traffic will eventually compound to something pretty substantial.And since there are lots of long-tail keywords in pretty much every industry, you’re unlikely to suffer from a shortage of them.Back to my example of “best website builder for __” keywords. A search in Ahrefs’ Keywords Explorer returns over a thousand of them:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/8-matching-terms-best-website-builder-1.jpg" alt class="wp-image-137070" width="598" height="639" srcset="https://ahrefs.com/blog/wp-content/uploads/2021/11/8-matching-terms-best-website-builder-1.jpg 922w, https://ahrefs.com/blog/wp-content/uploads/2021/11/8-matching-terms-best-website-builder-1-397x425.jpg 397w, https://ahrefs.com/blog/wp-content/uploads/2021/11/8-matching-terms-best-website-builder-1-768x821.jpg 768w" sizes="(max-width: 598px) 100vw, 598px">How to find long-tail keywordsThere’s a number of methods you can use to find long-tail keywords. Some are more tedious than others, some are a tad “unconventional,” and some are just plain incorrect.Let’s start with an incorrect one.1. Use Google Autosuggest… NOTSome SEO experts advise you to source long-tail keywords from Google Autosuggest by entering your target keyword followed by different letters of the alphabet.<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/9-google-autosuggest-meditation.jpg" alt="Google Autosuggest" ref="center">Well, Google Autosuggest is a feature designed to give you quick access to popular search queries. So if we check the search volumes of keywords in the above screenshot, most of them will have a rather decent number of searches.<img decoding="async" width="399" height="425" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/10-meditation-popular-keywords-1-399x425.jpg" alt class="wp-image-137076" srcset="https://ahrefs.com/blog/wp-content/uploads/2021/11/10-meditation-popular-keywords-1-399x425.jpg 399w, https://ahrefs.com/blog/wp-content/uploads/2021/11/10-meditation-popular-keywords-1.jpg 676w" sizes="(max-width: 399px) 100vw, 399px">In other words, Google Autosuggest is much more likely to offer you highly popular search queries rather than the coveted long-tails.The same goes for online tools like Answer The Public or Soovle that scrape Autosuggest to generate their lists of keyword ideas. A large number of their keyword suggestions will turn out to be rather popular and competitive.2. Use Ahrefs’ Keywords ExplorerUnlike the previous one, this method doesn’t require any tedious manual work. Just search for any word that defines your niche in Keywords Explorer and use the search volume filter to instantly see thousands of long-tail keywords.<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/11-matching-terms-report-meditation-1.jpg" alt class="wp-image-137078" width="598" height="724" srcset="https://ahrefs.com/blog/wp-content/uploads/2021/11/11-matching-terms-report-meditation-1.jpg 930w, https://ahrefs.com/blog/wp-content/uploads/2021/11/11-matching-terms-report-meditation-1-351x425.jpg 351w, https://ahrefs.com/blog/wp-content/uploads/2021/11/11-matching-terms-report-meditation-1-768x930.jpg 768w" sizes="(max-width: 598px) 100vw, 598px">If your website is brand new and barely has any “authority,” then I recommend you to use the KD filter, which helps you find the least competitive keywords.Also, make sure to try the “Questions” button. It often returns some cool long-tail search queries that are phrased as questions:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/12-questions-tab.jpg" alt="Questions report in Keywords Explorer" ref="center">3. See which keywords your competitors are ranking forAnother great source of long-tail keywords comes from your competitors. Ahrefs’ Site Explorer will help you see what long-tail keywords they are ranking for.Just take a website belonging to your competitor, plug it into Site Explorer and go to the Organic keywords report to see which long-tail keywords are bringing traffic to their website:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/13-organic-keywords-report-mindful.jpg" alt="Competitors' long-tail keywords in Site Explorer" ref="center">Repeat that with 5-10 of your competitors’ websites, and you’ll mine enough long-tail keyword ideas to keep you busy for months to come.4. Browse Reddit, Quora, and niche forumsWhenever people visit Google and fail to find a good answer to their question, they ask it at places like Quora and Reddit.For example, I was browsing the “marketing” topic on Quora and saw this post:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/14-quora-post.jpg" alt="Long-tails on forums" ref="center">A quick check in Keywords Explorer revealed that “marketing manipulation” is actually a long-tail keyword with a low KD score.<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/15-overview-market-manipulation.jpg" alt="Forum keyword check in Keywords Explorer" ref="center">The upside of this method is those forum threads may have some good discussions, which can be useful when creating a piece of content on that topic.The downside is mining long-tail keywords from forums is a rather tedious process. And you’ll still have to use an SEO tool like Keywords Explorer to check for the search volumes and KD of your keyword ideas.But the thing is, that same keyword can easily be discovered via Keywords Explorer in the first place:<img decoding="async" src="https://ahrefs.com/blog/wp-content/uploads/2021/11/16-matching-terms-report-marketing-1.jpg" alt class="wp-image-137084" width="677" height="789" srcset="https://ahrefs.com/blog/wp-content/uploads/2021/11/16-matching-terms-report-marketing-1.jpg 960w, https://ahrefs.com/blog/wp-content/uploads/2021/11/16-matching-terms-report-marketing-1-365x425.jpg 365w, https://ahrefs.com/blog/wp-content/uploads/2021/11/16-matching-terms-report-marketing-1-768x895.jpg 768w" sizes="(max-width: 677px) 100vw, 677px">The two types of long-tail keywordsNot all long-tail keywords are the same. Some of them represent a unique search query, while others are merely a less popular variation of a more popular search query.We call the former “topical long-tail keywords” and the latter “'''
