["https://ahrefs.com/academy/how-to-use-ahrefs/content-explorer/use-cases"]
title = "Content marketing use cases"
description = "Learn how to do content marketing with Content Explorer and find low-competition topics with high traffic potential, guest blogging opportunities, and more."
full_description = "If a page that targets a topic has little backlinks yet still gets lots of search traffic, then that is a low-hanging content opportunity. To find such topics, search for a broad topic and filter for pages with few or no referring domains that also get a good amount of monthly organic traffic. Such pages often revolve around uncompetitive topics, like “best backpacking trails in Colorado”. From here, you can see which keywords each page ranks for. Just click on Paid traffic, which will open the Organic keywords tab. Next, go to the Website tab and sort by the Authors column. The more authors a website has, the higher the probability that they accept guest blogging opportunities. You now have a list of websites that have covered this topic before and might be open to accepting a guest post on a similar topic. Get more views for your videos and improve their rankings on Google by targeting topics with video intent. To monitor how frequently your brand has been mentioned in the media lately, type in your brand and exclude mentions from your own website using the operator -site:[own website]. Then hit the News tab. And as you notice, there’s been a steady rise in pages talking about our brand in the beginning of 2023. You can use this strategy to analyze your competitor’s “popularity spikes” and reverse-engineer their PR and link building campaigns. For Ahrefs.com, we publish around 30–50 posts per month. You can also see we don’t just publish new posts—we strive as much as possible to keep our content up to date. To find them, we’ll take Ahrefs blog as an example and search for pages that have only been published once, which are older than 12 months and which get up to 50 search visits a month. An Ahrefs account is required to take this exam. Sign up for a free Webmaster Tools account or paid subscription if you don’t have one."
