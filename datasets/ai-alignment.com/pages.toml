title = "ALBA: An explicit proposal for aligned AI | by Paul Christiano | AI Alignment"
description = "In this post I propose an explicit procedure for aligning powerful learning systems with their users’ interests. The goal is to introduce minimal overhead or additional complexity, yet to safely…"
full_description = "ALBA: An explicit proposal for aligned AIPaul Christiano·FollowPublished inAI Alignment·18 min read·Feb 23, 2016--9ListenShareIn this post I propose an explicit procedure for aligning powerful learning systems with their users’ interests. The goal is to introduce minimal overhead or additional complexity, yet to safely scale up to extremely powerful systems.ALBA (algorithm learning by bootstrapped approval-maximization) is a method for providing rewards to reinforcement learners. It uses RL to train a reward function, rather than directly defining a simple reward function.ALBA alternates two steps:Amplification. We start with a fast and aligned agent. We allow this fast agent to think for a long time, and give it access to a large external memory and powerful computational aids. The resulting system is more powerful and much slower than the original agent.Distillation. We use this strong, slow agent to define a reward function, and use this reward function to train another fast agent. (This is conceptually similar to knowledge distillation.)Hopefully, each iteration increases the strength of the learner while maintaining alignment.We start off the process with a weak learner obtained by applying step [2] with a human in place of the strong learner.The rest of this post:Describes the necessary building blocks and offers candidate implementations.Makes this iterative process precise.Explains why we might expect ALBA to be aligned and efficient.Identifies key problems with this scheme and open questions about it.(This research was supported as part of the Future of Life Institute FLI-RFP-AI1 program, grant #2015–143898.)The problemALBA is designed to cope with the following problem.Existing ML techniques are much better at optimizing objectives that we can measure. For example, if we want to use gradient descent to find a good policy, we need to be able to measure how good a policy is.In general, we can’t measure what we really care about directly. Instead, we use rough proxies to assess how well a learned policy gets us what we really want. For example, we may search for a traffic-routing algorithm that minimizes total time spent on the road, or we may search for a user interface that maximizes reported user satisfaction.Because these proxies don’t capture everything we care about, we aren’t necessarily happy if they are creatively or ruthlessly maximized. Defining an appropriate objective becomes an arms race between the objective-setter and the objective-optimizer. Today the objective-setters are humans and the objective-optimizers are weak AI systems, so we don’t have serious trouble. But that situation may change as AI improves.ALBA addresses this problem by learning a sequence of increasingly complex objective functions, rather than working with a fixed objective specified by the user.The building blocksALBA relies on two building blocks:A “semi-supervised” reinforcement learning algorithm (which does all of the heavy lifting).A bootstrapping scheme for turning a weak agent into a strong agent.Reinforcement learningWe will apply reinforcement learners to a single-step problem:Given x ∈ {0, 1}ⁿOutput y ∈ {0, 1}ⁿReceive a reward r ∈ [0, 1]Observe z ∈ {0, 1}ⁿThe goal of the learner is to maximize its total score. Our agent should treat different decisions as completely independent, ignoring the non-information effects of each decision on future episodes (as in the usual formulation of bandit problems). This makes the learning problem significantly easier, and it is also important for alignment. The independence assumption can be formalized by comparing two different learners in the context of a fixed sequence of episodes (even if in fact the learner’s behavior in each episode influences the content of future episodes).For concreteness, we can imagine training a deep neural network f(x) = y by gradient descent, and learning a stochastic policy so that we can estimate the gradient of the expected reward as 𝔼[r(a)∂p(a)/p(a)]. (Realistically we will need to do a lot of work to cope with the challenging setup.)We add one complication to the traditional reinforcement learning problem. Rather than assuming that rewards are always available, we mostly work with “unlabelled” data: our algorithm sees many inputs x, but rarely sees the actual reward. We allow the algorithm to request to see the reward, but only on a small fraction of instances. When it doesn’t see the real reward, it can still observe the consequences of choosing a particular y, and use these consequences as side information to help build a model that can accelerate learning.For concreteness sake, we can assume that we are using a traditional reinforcement learning algorithm which ignores the unlabelled data, requests reward information for a large number of initial examples, and thereafter requests reward information with probability ε. We can accelerate learning with more clever active and semi-supervised learning. Hopefully we can accelerate it a lot.Finally, we assume that our reinforcement learner is “throttled” — we can control the capability of the system by some parameter c such as model capacity, training time, or computational resources. When c is small the system should be much weaker than its users, when c is large the system should be state-of-the-art, and performance should scale up continuously with c.We could also apply ALBA in this toy model of the AI control problem, with a human playing the role of the reinforcement learner.Bootstrapping protocolOur other key ingredient is a bootstrapping protocol. This protocol takes as input an agent A which is aligned, and produces a slightly more powerful agent B which remains aligned. We think of our agents as simple functions from {0, 1}ⁿ → {0, 1}ⁿ. Critically, the agent B may take much longer to run than the agent A.Intuitively, we’d like to just “give A more time to think.” We need a non-trivial bootstrapping protocol because we do not trust A to automatically generalize from a training environment where it has little time to think, to a test environment where we give it a long time to think. (And we can’t train A in cases where it has a long time to think, because we don’t have any way to produce a suitable training signal.)Roughly speaking, our procedure works as follows:We set up a simple computational environment.We provide A with a summary of the current environment, and it proposes an operation to perform next.We execute that operation, updating the computational environment, and return to step 2.Eventually, A decides to return a value.We describe an explicit computational environment, annotated functional programming, here. B is the computation implemented by annotated functional programming, when A acts as the controller.We could use a different framework for external memory / computational aids. Our only unusual requirement is that the framework be suitable for approval-directed training. That is, it must be easier to determine the correctness/suitability of a particular action than to actually run a whole computation. In particular, the correctness/suitability of an action cannot depend on the rest of the controller’s policy, as it would if we were doing end-to-end training. Annotated functional programming is designed to meet this requirement while remaining suitably expressive and as simple as possible.Recurrent modelsSo far I have described an agent A who makes a single decision, and an agent B who evaluates a single decision. We could extend this idea to sequences of actions, allowing A to be e.g. a recurrent neural network, and having B evaluate a whole sequence of actions.In this case, A still only cares about the payoffs within a single “episode,” which now consists of a sequence of decisions, and ignores effects on future episodes (as in the usual RL setup). But within each episode, A may behave strategically.From our perspective, the key difference between the external memory and the recurrent controller’s internal state is that the controller’s state is optimized to achieve high reward in future steps, while operations on the external memory are optimized to receive a high score.Note that B can maintain only external state between each query posed to it, for fundamental technical reasons (the cost of training would increase exponentially if we try to preserve internal state, or else we would have to rely on transfer learning from short computations to long computations). That is, when evaluating A’s first action, B can write some notes to itself. It can look at these notes when evaluating A’s second action. But the different questions correspond to separate episodes, with no internal state shared between them.Using a recurrent model is especially critical in the final distillation step, since training a recurrent model (rather than relying on external memory) might be necessary to achieve state-of-the-art performance.I’m going to continue to talk about the single-action case. But it is straightforward to translate the discussion in this post to the sequential case.Defining ALBAWe define two sequences of agents Aⁿ and Bⁿ, as follows. B⁰ is a human operator. ALBA’s external policy will be defined by the last agent Aᴺ; our hope is that it is both aligned and efficient.For 0 < n < N, the agent Aⁿ is a semi-supervised reinforcement learner which takes as input the current visible state of a computational environment, and outputs a computational action. We fix a sequence of constants cⁿ, and we throttle Aⁿ with the parameter cⁿ.The agent Bⁿ takes as input a (state, action, auxiliary data) triple, and outputs a real number in [0, 1]. This number will be used to define the reward function for Aⁿ⁺¹.The agent Aᴺ acts directly in the world, in any context that a typical reinforcement learning system could act in the world, with sparse rewards defined by Bᴺ⁻¹. Note for example that Aᴺ may operate arbitrary computational machinery — we can apply it wherever we would have applied a reinforcement learning subsystem.Distillation [approval-maximization]Agent Aⁿ is given a state s, picks an action a, and receives reward Bⁿ⁻¹(s, a, auxiliary data). Recall that this reward is only actually computed when Aⁿ asks for feedback — most of the time we don’t actually run Bⁿ⁻¹.As described here, we would like to augment this oversight by allowing Bⁿ⁻¹ to view the internal state of Aⁿ. I don’t have any concrete implementation of this idea.For now, I’ll just assume that the raw computational history (e.g. the activations of each layer) of Aⁿ is given to Bⁿ⁻¹ as the auxiliary input. More sophisticated algorithms may replace C by a more effective approach to transparency.(One reason this procedure is unsatisfactory is that some training procedures will result in C being optimized to make a look like a good action, or to obscure information that would allow the overseer to realize that a is a bad action. A working proposal will probably have to use an alternative to C that is actually optimized for being informative. Nevertheless, including C is better than nothing.)Amplification [algorithm learning]Agent Bⁿ is implemented by using Aⁿ as a controller for annotated functional programming. To evaluate a triple (s, a, C), we set up an initial computational state, with the goal/question:{Evaluate the quality of taking action {a}, after performing computation {C}, in a state summarized as {s}. Return the result as a real in [0, 1]},where C is a summary of the computation carried out by Aⁿ, and a, s, C are stored as terms in external memory.We then consult Aⁿ in order to produce an instruction, execute that instruction, and repeat (as described in the section Bootstrapping protocol). The output of Bⁿ is the result eventually returned by this process.The only free parameters are the constants cⁿ, and the free parameters in the reinforcement learning algorithm and bootstrapping scheme.Note that this bootstrapping process may involve consulting the user — we can easily extend our computational model to include actions to elicit user input. This is not technically needed for our analysis below. However, the ability to elicit user input significantly increases the meaningfulness of having an “aligned” AI system, for our definition of alignment.Discussion of alignmentWe’ll try to establish by induction that our systems are aligned with their users’ interest. I’ll postpone discussion of efficiency to the next section.When I say that a system is aligned at capacity c, what I mean is that it serves the user’s interests as well as an “optimally motivated” system with capacity c and access to the same information. I apologize for the fuzzy concepts.Bootstrapping Lemma: If Aⁿ is aligned at capacity cⁿ, then Bⁿ = Bootstrap(Aⁿ) is aligned at capacity significantly above cⁿ⁺¹.Oversight Lemma: If Bⁿ is aligned at capacity significantly above cⁿ⁺¹, then Aⁿ⁺¹ = ApprovalMaximization(Bⁿ) is aligned at capacity cⁿ⁺¹.Given these lemmas, and the starting condition that B⁰ = [a human] is aligned at capacity significantly above c¹, we can establish by induction that Aⁿ is aligned at capacity cⁿ. This is exactly what we want.Note that we can choose the sequences of constants cⁿ so that they increase extremely slowly; this makes the bootstrapping lemma more likely, without affecting the oversight lemma.Bootstrapping lemmaThis lemma feels intuitively very solid to me, though I don’t have any formal argument.Intuitively, Bootstrap(A) will behave “like a copy of A that gets to think for longer.” For example, if I imagine myself in the position of A, it seems clear that Bootstrap(me) is significantly smarter than I am, to roughly the same degree that thinking longer makes me smarter.If you don’t buy this, we can also make a slightly more conservative (though still informal) argument.Bootstrap(A) can always just directly appeal to A. So as long as A is aligned at high enough capacity to implement this strategy, Bootstrap(A) will be aligned at the same capacity.On top of that, Bootstrap(A) has access to many simple strategies that might let it outperform A. For example:It can use A to answer a large number of sub-questions and use the answers as features to help make a better decision.It can consult an ensemble of many slightly different copies of A, each using different strategies to think about the same problem.It can perform other expensive computations, and use them as features to help make a better decision.In order for Bootstrap(A) to outperform A, we only need one of these techniques to help as much as significantly increasing in A’s abilities.Oversight lemmaThe oversight lemma is discussed in my recent post adequate oversight.The rough argument:If B is aligned at capacity c’, then B’s estimates for the goodness of actions are the best possible for an agent at capacity c’, where “goodness” is defined by the user’s interpretation.If A knows that B is aligned at capacity c’, and A is throttled by capacity c < c’, then A doesn’t expect to be "
