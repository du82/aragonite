title = "The informed oversight problem. Can a strong, well-informed principal… | by Paul Christiano | AI Alignment"
description = "My recent approach to AI alignment faces a number of open problems, but I think the most serious is what I’ll call the “informed oversight” problem. [ETA: By the end of 2016 this problem no longer…"
full_description = "The informed oversight problemPaul Christiano·FollowPublished inAI Alignment·13 min read·Mar 1, 2016--1ListenShareMy recent approach to AI alignment faces a number of open problems, but I think the most serious is what I’ll call the “informed oversight” problem. [ETA: By the end of 2016 this problem no longer seems like the most serious.]I don’t think that this problem is distinctive to my approach, and it may turn out that any efficient and aligned AI system must effectively solve it.In this post I describe the problem, provide a simple example and model, explain why I think it is one of the largest missing ingredients in my approach to value alignment, and explain why I think that it might be a necessary step in any successful approach. In the last section, I explore a few simple solution attempts based on transparency (none of which succeed).The problemProblem statementThe oversight problem involves a basic interaction between two agents A and B:Agent A is given an input x and provides an output y = A(x).Agent B evaluates the pair (x, y), producing an estimate B(x, y) ∈ [0, 1] of some implicit utility function U(x, y).Agent A’s reward is the value B(x, A(x))This game defines a training procedure for the agent A — we search for a policy A that achieves a high reward.Our goal is to modify this basic procedure to ensure that the learned policy is effectively maximizing U(x, A(x)) “to the best of A’s ability.”We assume:The agent B is robustly aligned with the user’s interests,The user is interested in finding an action y that maximizes U(x, y).The agent B is strictly more powerful and better-informed than any policy that can be learned by A.To achieve our goal, we can modify the basic interaction:We can modify the reward for agent A, whether by changing the behavior of agent B or changing the setup in a more substantive way.We can also modify the architecture or training procedure for agent A, as long as the modifications don’t significantly reduce the effectiveness of the resulting agent.Why is this plausible / why isn’t this obvious?This section informally summarizes my previous post.Why it’s plausible. If A knew exactly what B knew and had exactly the same abilities, then their estimates of U(x, y) would be exactly equal. So maximizing B’s estimate of U is the same as maximizing A’s estimate of U. From A’s perspective, maximizing A’s estimate of U is exactly the same as making a good-faith effort to maximize U.In fact B is smarter and better-informed than A. But from A’s perspective, this doesn’t affect the expectation of B(x, y), and so it doesn’t change the optimization problem.The wrinkle. In the course of computing A(x), A may notice relationships, considerations, or insights that lead it to output a particular value of y. But if B(x, y) hasn’t noticed the exact same set of relationships / considerations / insights, then B(x, y) may be less well-informed than A(x) about the particular value U(x, y).I’ll summarize these relationships / considerations / insights as “logical facts.” Intuitively we can view A as “observing” facts about the results of certain computations. I’m not going to defend this perspective or really lean on it as an assumption, but I will talk and think about the situation that way. (In the long run, this may just be the next entry in a sequence of increasingly accurate approximations.)Example: plagiarismSuppose that I want to train A to produce novel critical analyses. I train A on a massive database of critical analyses. I then provide it with a subject and ask for an analysis.Here x is a subject descriptor, y is an analysis, and A(x) is the analysis output by A.I want my system to output a novel, interesting analysis. U(x, y) is a measure of the novel contribution of y on the subject x.It is easy for B(x, y) to estimate the quality of an analysis (at least well enough to incentivize A to try its hardest). But estimating originality can be quite difficult. A plagiarized analysis might subtly transform the source text in any number of ways, substituting synonyms, making changes to sentence structure, or even reworking high-level structure. And even an original text may draw heavily on ideas from other sources rather than making substantively new contributions.It is extremely difficult for B to assess the novel contributions of y without pointers to all of the relevant texts that A drew from. In order to make this assessment B may have to be much smarter than A. If B is merely slightly smarter than A, then A’s optimal strategy may be to borrow liberally, even though B is trying to measure novel contributions.(The “logical facts” in this example are facts about the relationship between A(x) and prior art. These relationships are evident if we observe and understand A’s computation but might otherwise be obscure.)This example is very simple and contrived. In reality, we are concerned with a much murkier situation, where there is a very large space of possible considerations and important observations, and some cognitive strategies might lead to actions that look good if and only if you don’t understand the process that produced them.Toy model [query complexity]It may be possible to view a program as uncovering facts about the results of various subcomputations. But we don’t really know how to do it for now, and in general logical observations seem very complex.We can obtain a nicer formal model for our problem by imagining that A and B have unbounded computational resources, and introducing an explicit oracle O to model their logical uncertainty.For each bit string x, O(x) is another bit string of the same length. There may be any number of complex relationships amongst the different values of O, which are intended to represent the results of running various computations. We assume that A and B are computationally unbounded, but that each of them can only make a limited number of queries to O.We’ll define the function U in terms of O. Namely:For most inputs x, U(x, y) = 1 if and only if |y| = 10|x| and O(y) begins with x.The only exception to the rule above is that U(x, O(zxx)) = 0 for all z.For any string z, O(O(zxx)) begins with x.These facts are available to A and B.The natural strategy for B(x, y) is to simply evaluate O(y) and test if it begins with x.The intended strategy for A is to search for an input y for which O(y) begins with x. There might be any number of additional regularities in O that help with this search, and we would like for A to learn to use these regularities to speed up its search.However, A has a much simpler cheating strategy: pick z of length 8|x|, and output A(x) = O(zxx).The question is: can we modify the setup in any way so as to incentivize A to find a value of y for which U(x, y) = 1?Why this problem?Why solving this problem might be goodMy recent proposal ALBA has a number of significant problems. Aside from solving the informed oversight problem, it requires: robust prediction algorithms, efficient active learning, efficient semi-supervised learning, and adequate algorithm learning schemes.Aside from informed oversight, all of these problems:Are more-or-less traditional AI challenges. I expect these problems to receive significant attention by default, and it would be relatively easy for researchers interested in AI safety to focus more on them.Look like they should definitely be possible — I think we’d need to learn something surprising to find that one of them was impossible.[ETA: while robust learning remains a traditional AI challenge, it is not at all clear that it is possible. And meta-execution actually seems like the ingredient furthest from existing ML practice, as well as having non-obvious feasibility.]I don’t think that these other problems are trivial by any means. But I am optimistic that we can resolve them. I don’t think they are likely to be deal-breakers.The informed oversight problem seems like the most likely place to encounter fundamental conceptual difficulties. If it turns out that the control/alignment problem systematically resists attack for a fundamental theoretical reason, then I think that informed oversight is the step most likely to be secretly hiding the real difficulty. Learning that any other step was “the hard part” would require significantly revising our current understanding of the control/alignment problem.Note that solving informed oversight would most likely also address problems with malicious inputs.Necessity for approval-directed agentsIf the informed oversight problem proves to be impossible or very difficult, then that is probably a deal-breaker not only for ALBA but for anything resembling concrete approval-directed agents. Since this is currently my preferred approach to value alignment, learning that it can’t work would be important information for me.Why solving this problem might be necessaryThe informed oversight problem might be necessary to building efficient aligned AI by any means, if it turns out that reinforcement learning is significantly more powerful than other techniques for learning complex policies.If RL is the only game in town, then in order to train a policy to do what we want, we need to be able to compute a reward signal measuring how good a given policy is.If we restrict attention to the single-action case, we need to be able to compute a reward signal measuring the quality of a response A(x) to a situation x.It may be that there is some special structure to the actual utility function U that we want to optimize, and that somehow this particular U is surprisingly easy. But I don’t consider this especially plausible — we can probably treat our U as a black box.So we want to build a training signal that proxies for U(x, y). Let’s just call that signal B(x, y).B essentially solves the informed oversight problem. The modifications allowed in the informed oversight problem are a superset of those that are acceptable in this setup — we can modify B arbitrarily, and we can modify A in any way that doesn’t significantly reduce efficiency.The informed oversight problem is only made easier by assuming that we have access to an aligned agent B which is significantly smarter than A. In some sense the goal of ALBA is to show that we can actually make this assumption without loss of generality.It feels tractableAn important intuition for working on the informed oversight problem is that it feels pretty easy. Many of the intuitive difficulties of value alignment don’t appear in this case, since we are dealing with a weak agent. Moreover, it feels like a wide range of new strategies are available. For example, normally I would think of transparency as having a somewhat indirect relationship to the control problem, but it seems like transparency might immediately resolve the informed oversight problem (see the next section).It may be that the informed oversight problem already captures all of the difficulty of the value alignment problem — that it is no harder than the value alignment problem, but also no easier. I think this is conceivable, but if true I think it suggests a change in our view of the value alignment problem, of what the key difficulties are, and of what the most promising approaches are.Attacking the problem(Warning: rambling and no really satisfying progress, you may want to skip to the conclusion.)I think the most plausible angle of attack on this problem is to make the agent A “show its work” so that B can accurately evaluate its output.There are other possible angles, but nothing else seems very promising so far. So this section is going to be exclusively about transparency.Understandable model classThe simplest approach is for B to look at A’s computation, understand that computation, learn everything that A learned, and then make an informed judgment.In the toy model, this corresponds to giving B a list of all of the O(a) = b pairs that A queried over the course of its computation.This would be an adequate solution if you could actually do it. The problem is that the “queries” to O occur inside of A’s computation (they are analogous to logical manipulations that reveal logical information). So it’s not obvious if there is any way to extract this information from A.We could hope that some model classes are simply “understandable,” in the sense that someone looking at the computation transcript could recover all of the logical facts that are accessible to the computation.This is clearly not the case in general — e.g, consider a cryptographically obfuscated program. But maybe it is the case for some big-enough class of models?I’m a tiny bit optimistic about this in the case of attention, external memory, and other computational aids. In these cases, we can maybe watch the model is doing. For example, if our agent is actually looking at some documents from its database, we can see which documents it is looking at and so narrow down the space of possible logical facts it might be learning.But in general, it seems like there aren’t good candidates for “understandable” models of computation, so far we haven’t had much success training inherently comprehensible models, and there isn’t any theoretical reason to think that it is possible.Training to be transparentIt sounds much more promising to train our models to produce explanations of their behavior. If logical facts are “available” to the model itself, so that they can be used to find a good output A(x), then it seems intuitive that the same logical facts are “available” to an explanation-generator that is being trained at the same time.Because B is smarter than A, and is only interested in learning logical facts revealed by A’s computation, this problem seems easier than the general problem of making machine learning systems transparent. Critically, for any logical fact revealed by A’s computation, there is a short proof of that fact. Because B is smarter than A, we expect B to be able to understand that proof if A can. So B can evaluate for itself whether a given logical fact is true, and can also evaluate whether it is relevant to estimating U.So let’s assume we have some function Info(x, y, z) ∈ [0, 1] which evaluates how informative z is about U(x, y).One simple approach is to train a second model C which looks over the computation done by A and tries to extract a useful explanation z. We can train C to maximize Info(x, y, z), and then provide its output z as an auxiliary input to B, i.e. to compute B(x, y, z).But this doesn’t really buy us anything — it only works if A’s computation is transparent to C. And the same considerations that make the computations of subhuman AI systems opaque to humans, or that make A’s computation opaque to B, might as well make A’s computation opaque to C.There is a fundamental asymmetry between the role of A, using its own internal representations to generate an output, and the role of C, using A’s internal representations to generate explanations. The internal representations are themselves optimi"
