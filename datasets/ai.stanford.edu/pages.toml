["https://ai.stanford.edu/research-groups"]
title = "Research Groups – Stanford Artificial Intelligence Laboratory"
description = "Chris Manning, Dan Jurafsky, Percy Liang, Chris Potts, Tatsunori Hashimoto"
full_description = '''Research Groups The Stanford AI Lab is dynamic and community-oriented, providing many opportunities for research collaboration and innovation. SAIL is committed to advancing knowledge and fostering learning in an atmosphere of discovery and creativity. Our faculty conduct world class research and are recognized for developing partnerships with industry and the business community. Learn more about the diverse research groups conducting pioneering research in all areas of artificial intelligence including: Biomedicine and Health, Computational Cognitive & Neuro-science, Computational Education, Computer Vision, Empirical Machine Learning, Human-Centered and Creative AI, Natural Language Processing and Speech, Reinforcement Learning, Robotics, and Statistical or Theoretical Machine Learning. AI faculty and research focus areas at a glance → Stanford undergrads, prospective postdocs, and visitors interested in working in research, please follow the link to learn more about opportunities in the various AI Labs. → Joint Faculty Labs & Groups Stanford Natural Language Processing (NLP) Group Chris Manning, Dan Jurafsky, Percy Liang, Chris Potts, Tatsunori Hashimoto Read More Stanford Vision and Learning Lab (SVL) Fei-Fei Li, Juan Carlos Niebles, Silvio Savarese, Jiajun Wu Read More Stanford Statistical Machine Learning (statsml) Group Emma Brunskill, John Duchi, Stefano Ermon, Emily Fox, Carlos Guestrin, Tatsu Hashimoto, Chelsea Finn, Jure Leskovec, Percy Liang, Tengyu Ma, Chris Ré, Greg Valiant Read More Individual Faculty Labs & Groups Dror Lab The Dror Lab a highly multidisciplinary group studying the spatial organization and dynamics of biomolecules and cells in order to develop better medicines and quantitatively explain the workings of living systems. Read More Bejerano Lab The Bejerano Lab focuses on a fundamental question in Human Genomics: the relationship between geno(me)type and phenotype. Read More Ermon Group We research innovative computational approaches to help address the societal and environmental challenges of the 21st century. Read More Leonidas Guibas Lab The Geometric Computation Group, addresses a variety of algorithmic problems in modeling physical objects and phenomena, and studies computation, communication, and sensing as applied to the physical world. Read More Khatib: Stanford Robotics Lab Headed by Oussama Khatib Professor, Computer Science Department Director, Robotics Lab. Oussama has made fundamental contributions to robotics, control, and human motion analysis. Read More Bohg: Interactive Perception and Robot Learning (IPRL) Lab Our work is at the intersection of Robotics, Machine Learning and Computer Vision applied to problems in Autonomous Robotic Manipulation. Read More Sadigh: Intelligent and Interactive Autonomous Systems Group (ILIAD) ILIAD develops algorithms for autonomous systems that safely and reliably interact with people. Read More Fedkiw: PhysBAM A multiphysics simulation library, capable of simulating rigid & deformable bodies, compressible & incompressible fluids, coupled solids & fluids, coupled rigid & deformable solids, as well as many other natural phenomena. Read More Genesereth: Stanford Logic Group The Stanford Logic Group is a multidisciplinary research group operating within the Stanford Computer Science Department. Read More Goodman: Computation and Cognition Lab Headed by Noah D. Goodman, Assistant Professor of Psychology, Linguistics (by courtesy), and Computer Science (by courtesy) at Stanford University. Read More Yamins: NeuroAILab Our research lies at intersection of neuroscience, artificial intelligence, psychology and large-scale data analysis. We seek to "reverse engineer" the algorithms of the brain, both to learn about how our minds work and to build more effective artificial intelligence systems. Read More Salisbury Robotics The researchers at the Salisbury Robotics Lab undertake a variety of robotics projects in the development of their work. The projects in the Salisbury Robotics Lab fall under five main categories. Read More Kochenderfer: Stanford Intelligent Systems Laboratory SISL researches advanced algorithms and analytical methods for the design of robust decision making systems. Read More Ng: Stanford Machine Learning Group Our mission is to significantly improve people's lives through our work in Artificial Intelligence. Read More Pavone: Autonomous Systems Lab We develop methodologies for the analysis, design and control of autonomous systems, with a particular emphasis on large-scale robotic networks and autonomous aerospace vehicles. Read More Christopher Re Lab Our lab works on the foundations of the next generation of machine-learned systems, including how machines can learn from increasingly weak forms of supervision and the mathematical foundations of such techniques, as well as how machine learning is changing how we build software and hardware. Read More Liu: The Movement Lab The goal of our lab is to recreate coordinated voluntary animal movements in the digital world and on robotic platforms. In particular, we focus on holistic motor behaviors that involve fusing multiple modalities of perception to produce coordinated, balanced, and precise whole-body movements to interact with the world. Read More Leskovec: SNAP Group The group is one of the leading centers for applied machine learning on networks. Our research focuses on modeling complex, richly labeled graphs and networks at all scales for large complex interconnected systems from information, biomedical, and social domains. Read More Finn: Intelligence through Robotic Interaction at Scale Lab We are interested in the capability of robots and other agents to develop broadly intelligent behavior through learning and interaction. To that end, we work on robotics and machine learning. Read More Affiliates Program Stanford AI Lab faculty and students enjoy chances to understand and solve the not-yet-doable pain points of industry. Get a chance to support and interact with SAIL’s brightest minds. Learn More'''
year_published = 2025
clearnet = "https://ai.stanford.edu/research-groups"
