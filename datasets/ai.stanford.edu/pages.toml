full_description = "All Posts PrivacyLens: Evaluating Privacy Norm Awareness of Language Models in Action Yijia Shao and Diyi Yang Having an agent handle tasks for you is cool. But does your language model agent respect privacy norms? Continue reading Productive Struggle: The Future of Human Learning in the Age of AI Rose E. Wang and Megha Srivastava What happens to human learning when superhuman intelligence is as accessible as a Google search? Continue reading MiniVLA: A Better VLA with a Smaller Footprint Suneel Belkhale and Dorsa Sadigh Reducing OpenVLA's parameters 7x, and improving the input and output representation space. Continue reading Stanford AI Lab Papers and Talks at NeurIPS 2024 Compiled by Ruhana Azam All the great work from the Stanford AI Lab accepted at NeurIPS, all in one place. Continue reading Unintended Impacts of Alignment on Global Representation Michael J. Ryan, William Held, Diyi Yang How language model alignment impacts performance along three axes of global representation Continue reading Stanford AI Lab Papers and Talks at EMNLP 2024 Compiled by Nitya Thakkar All the great work from the Stanford AI Lab accepted at EMNLP 2024, all in one place. Continue reading Crossing Linguistic Horizons: Finetuning and Comprehensive Evaluation of Vietnamese Large Language Models Sang T. Truong, Duc Q. Nguyen, Toan Nguyen, Dong D. Le, Nhi N. Truong, Tho T. Quan, Sanmi Koyejo Fine-tuning LLaMa-2, Gemma, Mixtral for Vietnamese and evaluation Vietnamese large language models across 10 tasks with 31 distinct metrics Continue reading Stanford AI Lab Papers and Talks at ICLR 2024 Compiled by James Burgess All the great work from the Stanford AI Lab accepted at ICLR 2024, all in one place. Continue reading Stanford AI Lab Graduates 2024 Compiled by Judy Hanwen Shen & John Hewitt A list of our excellent students graduating roughly in summer 2024. Continue reading Clover: Closed-Loop Verifiable Code Generation Chuyue Sun, Ying Sheng Clover paradigm checks consistencies among code, docstrings and annotations and enforces correctness in AI-generated code. Continue reading Next"
