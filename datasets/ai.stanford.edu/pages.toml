full_description = '''Stanford AI Lab The Stanford Artificial Intelligence Laboratory (SAIL) has been a center of excellence for Artificial Intelligence research, teaching, theory, and practice since its founding in 1963. Latest News Carlos Guestrin named as new Director of the Stanford AI Lab!We thank Christopher Manning for being Director of the Stanford AI Lab during a period of enormous growth for AI and SAIL from 2018–2025 and today welcome Carlos Guestrin, Fortinet Founders Professor of Computer Science, as the new Director of SAIL.Read MoreCongratulations to Prof. Fei-Fei Li for being one of the seven engineers who have made seminal contributions to the development of Modern Machine Learning awarded the 2025 Queen Elizabeth Prize for Engineering.Read MoreCongratulations, Emma for being elected as AAAI Fellow!Read MoreCongratulations to Chelsea Finn, Dorsa Sadigh, and Sanmi Koyejo for all winning a Presidential Early Career Award for Scientists and Engineers (PECASE), the highest honor of the U.S. government for outstanding early career scientists and engineers.Read MoreCongratulations to Sebastian Thrun for receiving honorary doctorate from Geogia Tech!Sebastian Thrun received an honorary Doctorate from Georgia Tech! This is Sebastian’s fourth honorary doctorate. Sebastian also served as a speaker for Georgia Tech’s Fall commencement ceremonyRead MoreEllen Vitercik received a Schmidt Science 2024 AI2050 Early Career Fellow AwardRead MoreTatsu Hashimoto and Shuran Song both received “Samsung AI Researcher of the Year” awardsRead MoreCongratulations to Stanford AI Lab PhD student Dora Zhao for an ICML 2024 Best Paper Award!Congratulations to Stanford AI Lab PhD student Dora Zhao for an ICML 2024 Best Paper Award for a paper from her work at Sony AI on: Measure Dataset Diversity, Don’t Just Claim ItRead MoreCongratulations to Aaron Lou, Chenlin Meng, and Stefano Ermon for an ICML 2024 Best Paper Award!Congratulations to Aaron Lou, Chenlin Meng, and Stefano Ermon