["https://ai.stanford.edu/about"]
title = "About – Stanford Artificial Intelligence Laboratory"
full_description = "About Us The Stanford Artificial Intelligence Lab (SAIL), founded in 1963 by Professor John McCarthy, continues to be a rich, intellectual and stimulating academic environment. Through multidisciplinary and multi-faculty collaborations, SAIL promotes new discoveries and explores new ways to enhance human-robot interactions through AI; all while developing the next generation of researchers. Our staff of dedicated professionals provide support to our academic and research groups, functioning as SAIL’s backbone. SAIL staff support helps our researchers, visiting scholars and students to advance new discoveries and innovation. All these groups working together add to the depth and breadth of our cutting-edge research. Download our Brochure → Letter from our Director Welcome to the Stanford Artificial Intelligence Lab The Stanford Artificial Intelligence Lab (SAIL) was founded by Prof. John McCarthy, one of the founding fathers of the field of AI. While the discipline of AI has transformed in many fundamental ways since its inception in the 1950s, SAIL remains a proud leading intellectual hub for scientists and engineers, an education Mecca for students, and a center of excellence for cutting edge research work. Read More Staff Maria David Faculty Administrator In office: Wed & Fri Supported Professors Stefano Ermon Edward Feigenbaum Oussama Khatib Andrew Ng Kenneth Salisbury Ludwig Schmidt Sebastian Thrun Suzanne Lessard Faculty Administrator In office: Tue & Thur Supported Professors Ron Dror Dan Jurafsky Percy Liang Chris Manning Carrie Petersen Faculty Administrator In office: Wed & Fri Supported Professors Emma Brunskill Leonidas Guibas Tengyu Ma Dorsa Sadigh Helen Roman Faculty Administrator In office: Mon & Thur Supported Professors Ron Fedkiw Fei-Fei Li Silvio Savarese Jiajun Wu SVL Group Eric Alejandro Pineda Faculty Administrator In office: Mon & Thur Supported Professors Emily Fox Carlos Guestrin Sanmi Koyejo Tatsunori Hashimoto Diyi Yang Kassie Rodriguez Faculty Administrator In office: Tue, Thu, & Fri Supported Professors Jeannette Bohg Chelsea Finn Mike Genesereth Cindy Duong Administrative Manager In office: Tue & Wed Contact Info We are located on the second floor of the Gates Computer Science Building. Gates Computer Science Building Stanford, CA 94305-9010 Directions Campus Map Parking If you are a prospective Ph.D. student, please apply via the CS admissions process. General Inquiries Prof. Chris Manning SAIL Director email: manning@stanford.edu Cindy Duong SAIL Website Questions email: duongc@stanford.edu Industrial Affiliates Program Joseph Huang Executive Director email: Joseph.Huang@stanford.edu Press Inquiries Jill Wu School of Engineering Director of Public Relations email: jillwu@stanford.edu Computer Science Graduate Admissions Phone: (650) 723-2300 Admissions : admissions@cs.stanford.edu"
