m, media or technology now known or later developed, for the full term of any rights that may exist in User Information. 6. USE OF COPYRIGHTED, TRADEMARKED OR OTHER PROTECTED MATERIAL The User may not post or attach any information or items to POZ.com that are copied, in whole or in part, from third-party sources without the third party’s authorization. This includes: scanning of images created by others, copying, modifying, and linking to code, images, sound recordings, audiovisual works or text created by others, any other activities that would infringe the proprietary rights of others. For further clarification, please see the U.S. Law on Copyrights, or see the websites of the U.S. Copyright Office or U.S. Trademark Office. Smart + Strong respects the intellectual property rights of others and requires that the User do so as well. Smart + Strong will terminate the acesss and use of the Service of users who are repeat infringers of the intellectual property rights of others. If a User or visitor to POZ.com believes his or her copyright or other intellectual property right has been infringed or violated by a posting on POZ.com, the User or visitor should send notification to Smart + Strong’s copyright agent, Ian Anderson, immediately. To be effective, the notification must include: A physical or electronic signature of a person authorized to act on behalf of the owner of an exclusive right that is allegedly infringed, Identification of the copyrighted work or other intellectual property claimed to have been infringed or violated, or if multiple allegedly infringed works at POZ.com are covered by a single notification, a representative list of such works at that site, Identification of the material that is claimed to be infringing or to be subject to infringing activity and that is to be removed or access to which is to be disabled, and information reasonably sufficient to permit Smart + Strong to locate the material, Information reasonably sufficient to permit Smart + Strong to contact the complaining party, such as address, telephone number and, if available, e-mail address at which the complaining party may be contacted, A statement that the complaining party has a good faith belief that use of the material in the manner complained of is not authorized by the copyright owner, its agent or the law, A statement that the information in the notification is accurate and, under penalty of perjury, that the complaining party is authorized to act on behalf of the owner of an exclusive right that is allegedly infringed or violated. Or contact Smart + Strong’s copyright agent via telephone, postal mail or fax: SMART + STRONG ATTENTION: IAN ANDERSON, COPYRIGHT AGENT 157 COLUMBUS AVENUE, SUITE 525NEW YORK, NY 10023-6082 Phone: (212) 938-2046 Fax: (212) 675-8505 Smart + Strong will then take appropriate remedial action, which may include the removal of said infringing or violative material or items, from POZ.com. Please make all notifications of alleged infringements or violations promptly and allow Smart + Strong at least 48 hours to review and, if appropriate, remove the infringing or violative materials or items. Smart + Strong is not responsible for material that is copied from the User’s profile or postings. 7. USER FEES, PAYMENTS, RENEWALS AND TERMINATIONS Although a substantial portion of the Service is currently available to users free of charge, paying Premium Members now have access to additional services of the Service as set forth in the POZ Personals area of the POZ.com website, including the ability to initiate and receive instant message communications with other Premium Members. The current membership options and rates for paying Premium Membership are also set forth in such POZ Personals area; any changes to such options or rates will be posted in such POZ Personals area. If you are or become a Premium Member you shall pay the membership fees for use of the Premium Membership in the Service at the rates in effect when the fees are incurred. Premium Members will receive advance notice of any rate change. Smart + Strong will automatically bill all applicable fees to your credit card, which you have a continuing obligation to keep up to date. Premium Membership fees will be billed at the beginning of each membership term and all renewal terms and are nonrefundable. Should you wish to use a different credit card for a renewal term payment, whether due to cancellation or expiration of the most recent card used, or otherwise, you may visit the Personals Menu on the POZ.com website and follow the instructions for changing credit cards. Your Premium Membership will automatically renew for the same term as the then current term at the then current rate unless prior to the expiration of the then current term you notify Smart + Strong of your desire to terminate your Premium Membership by email at cancel@poz.com or visit Personals Menu on the POZ.com website and follow the instructions for termination. Should the then current term of your Premium Membership be three (3) months, six (6) months, or twelve (12) months, Smart + Strong will, at least seven (7) days prior to the expiration of the then current term, notify you that it intends to renew your Premium Membership. In addition, while a substantial portion of the forums included in the Service are currently available to users free of charge, portions of the forums included in the Service are subscription based for either a seven-day, 30-day, or 90-day subscription. Subscriptions are not automatically renewed, although you may renew your subscription at your election. Subscriptions are non-refundable. 8. PASSWORD AND SECURITY Certain sections of the site require passwords. If required, the User will select a password upon completing registration. The User authenticates the User’s session by entering the User’s password and the User’s ID. The User is responsible for maintaining the confidentiality of the password and for all activities in connection with the User’s password. The User must immediately notify Smart + Strong of any unauthorized use of the User’s password or any other breach of security. Your profile or username may not include telephone numbers, street addresses, last names, URLs, e-mail addresses or other identifiable contact information. To keep the User informed about Smart + Strong’s latest offers, we may notify the User of current promotions, specials and new additions to POZ.com; we may also send the User service announcements and administrative messages. The User may not unsubscribe to this information as it is part of the User’s membership. The User can, however, terminate the User’s membership at any time by notifying Smart + Strong at cancel@poz.com of such termination; after such termination, the User will no longer receive such communications without the User’s prior consent. 9. ADDITIONAL USER RESPONSIBILITIES The User shall comply with all applicable local, state, national and international laws and regulations in connection with the User’s use of the Service, shall not impersonate any person or entity or falsely represent User’s identity, and shall not interfere with the use of the Service by others, including, without limitation, by submitting any virus or other mechanism to the Service, by transmitting junk mail, spam, bombs or unsolicited e-mail or by attempting to cause the Service to crash. The User shall be solely responsible for the content that the User publishes, transmits or displays on POZ.com and for all communications in connection with the User’s use of the Service. The User shall not use the Service to communicate any unlawful, annoying, harassing, defamatory, libelous, abusive, threatening, harmful, vulgar, obscene or tortious content (“content” for purposes of the Ts and Cs shall mean data, textual material, software, sound recordings, audiovisual works, photographs or other illustrations or other information or materials) of any kind or any content that invades, infringes or violates the personal or proprietary rights of any person or entity. The User shall not attempt to gain unauthorized access to other networks that may be connected to the Service. You shall not use the Service to: post or otherwise make available any content that promotes racism, bigotry, hatred or physical harm of any kind against any group or individual; harass or promote harassment of other users of the Service; send unsolicited e-mail; post or otherwise make available content you know to be inaccurate, illegal or misleading or that promotes conduct that is abusive, threatening, obscene, defamatory or libelous; post or otherwise make available content that exploits people under the age of 18 in a sexual, violent or other objectionable manner, or solicits personal information from anyone under the age of 18; in any way harm people under the age of 18; provide instructional content about illegal activities; post or otherwise make available content that you do not have the right to ma"
