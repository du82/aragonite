onnection with the User’s password. The User must immediately notify Smart + Strong of any unauthorized use of the User’s password or any other breach of security. Your profile or username may not include telephone numbers, street addresses, last names, URLs, e-mail addresses or other identifiable contact information. To keep the User informed about Smart + Strong’s latest offers, we may notify the User of current promotions, specials and new additions to POZ.com; we may also send the User service announcements and administrative messages. The User may not unsubscribe to this information as it is part of the User’s membership. The User can, however, terminate the User’s membership at any time by notifying Smart + Strong at cancel@poz.com of such termination; after such termination, the User will no longer receive such communications without the User’s prior consent. 9. ADDITIONAL USER RESPONSIBILITIES The User shall comply with all applicable local, state, national and international laws and regulations in connection with the User’s use of the Service, shall not impersonate any person or entity or falsely represent User’s identity, and shall not interfere with the use of the Service by others, including, without limitation, by submitting any virus or other mechanism to the Service, by transmitting junk mail, spam, bombs or unsolicited e-mail or by attempting to cause the Service to crash. The User shall be solely responsible for the content that the User publishes, transmits or displays on POZ.com and for all communications in connection with the User’s use of the Service. The User shall not use the Service to communicate any unlawful, annoying, harassing, defamatory, libelous, abusive, threatening, harmful, vulgar, obscene or tortious content (“content” for purposes of the Ts and Cs shall mean data, textual material, software, sound recordings, audiovisual works, photographs or other illustrations or other information or materials) of any kind or any content that i