m, media or technology now known or later developed, for the full term of any rights that may exist in User Information. 6. USE OF COPYRIGHTED, TRADEMARKED OR OTHER PROTECTED MATERIAL The User may not post or attach any information or items to POZ.com that are copied, in whole or in part, from third-party sources without the third party’s authorization. This includes: scanning of images created by others, copying, modifying, and linking to code, images, sound recordings, audiovisual works or text created by others, any other activities that would infringe the proprietary rights of others. For further clarification, please see the U.S. Law on Copyrights, or see the websites of the U.S. Copyright Office or U.S. Trademark Office. Smart + Strong respects the intellectual property rights of others and requires that the User do so as well. Smart + Strong will terminate the acesss and use of the Service of users who are repeat infringers of the intellectual property rights of others. If a User or visitor to POZ.com believes his or her copyright or other intellectual property right has been infringed or violated by a posting on POZ.com, the User or visitor should send notification to Smart + Strong’s copyright agent, Ian Anderson, immediately. To be effective, the notification must include: A physical or electronic signature of a person authorized to act on behalf of the owner of an exclusive right that is allegedly infringed, Identification of the copyrighted work or other intellectual property claimed to have been infringed or violated, or if multiple allegedly infringed works at POZ.com are covered by a single notification, a representative list of such works at that site, Identification of the material that is claimed to be infringing or to be subject to infringing activity and that is to be removed or access to which is to be disabled, and information reasonably sufficient to permit Smart + Strong to locate the material, Information reasonably sufficient to permit Smar