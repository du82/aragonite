full_description = "× Share Twitter Facebook Pinterest Tumblr Email Copy Link AIDSmeds.com Cookie Policy Cookie policy Our website uses cookies to distinguish you from other users of our website. This helps us to provide you with a good experience when you browse our website and also allows us to improve our site. By continuing to browse this site, you are agreeing to our use of cookies. What is a cookie? A “cookie” is a small file of letters and numbers that we store on your browser or the hard drive of your computer if you agree. Cookies contain information that is transferred to your computer’s hard drive. What cookies do we use? We use the following cookies: Strictly necessary/technical cookies. These are cookies that are required for the operation of our website. They make traffic control possible from the server to various users at a time. They include, for example, cookies that enable you to log into secure areas of our website, use a shopping cart or make use of e-billing services. Analytical/performance cookies. They allow us to recognize and count the number of visitors and to see how visitors move around our website when they are using it. This helps us to improve the way our website works, for example, by ensuring that users are finding what they are looking for easily. Functionality cookies. These are used to recognize you when you return to our website. This enables us to personalize our content for you, greet you by name and remember your preferences (for example, your choice of language or region). Targeting/advertising cookies. These cookies record your visit to our website, the pages you have visited and the links you have followed. These cookies allow implementing efficiency parameters in the advertisements offered in the websites, based on information about your behavior. We may also share this information with third parties for this purpose. You can find more information about the individual cookies we use and the purposes for which we use them in the table below: CookieDuration / TypePurposeMore InformationAIDSmeds.com & Personals.POZ.com Authentication/SessionPersistent, first partyUsed to maintain authentication for registered users on our website and web widget. These widgets may be deployed across our partner sites, but the cookies used within them are hosted on AIDSmeds.comInformation about AIDSmeds.com’s privacy policy and terms of service can be found on AIDSmeds.com/page/terms-use or AIDSmeds.com/page/privacy-policyGoogle AnalyticsPersistent, third partyUsed to collect information about how visitors use our site. We use the information to compile reports and to help us improve the site. The cookies collect certain information, including the number of visitors to the site, where visitors have come to the site from and the pages they visited.Click here for more information on Google Analytics.Google MapsPersistent, third partyUsed to store user information and preferences when viewing pages with Google Maps on them.Click here for more information about Google. Google Ad Network doubleclick.net googlesyndication.com 2mdn.net Persistent, session, and third partyIs used for loading ad content and other resources relating to ads for Google AdSense and Doubleclick from the Google CDN.Click here for more information about Google Ad Network. Double Verify doubleverify.com dvtps.com Persistent, session, and third partyUsed to provide third party measurement of our ad impression and website traffic for our advertisers.Click here for more information about Double Verify.FacebookPersistent, third partyUsed to collect information about how visitors use our site. We use this information to compile reports and help improve the site. It contains information, including the number of visitors to the site, where they’ve come from, and the pages they’ve visited.Click here for more information about Facebook.TwitterPersistent, third partyUsed to provide Twitter widgets (e.g. newsfeed widget) on our websites and can collect certain visitor information including where they’ve come from, IP address, browser type, and operating system.Click here for more information about Twitter.Cookie: AIDSmeds.com & Personals.POZ.com Authentication/SessionDuration / TypePersistent, first partyPurposeUsed to maintain authentication for registered users on our website and web widget. These widgets may be deployed across our partner sites, but the cookies used within them are hosted on AIDSmeds.comMore InformationInformation about AIDSmeds.com’s privacy policy and terms of service can be found on AIDSmeds.com/page/terms-use or AIDSmeds.com/page/privacy-policyCookie: Google AnalyticsDuration / TypePersistent, third partyPurposeUsed to collect information about how visitors use our site. We use the information to compile reports and to help us improve the site. The cookies collect certain information, including the number of visitors to the site, where visitors have come to the site from and the pages they visited.More InformationClick here for more information on Google Analytics.Cookie: Google MapsDuration / TypePersistent, third partyPurposeUsed to store user information and preferences when viewing pages with Google Maps on them.More InformationClick here for more information about Google.Cookie: Google Ad Network doubleclick.net googlesyndication.com 2mdn.net Duration / TypePersistent, session, and third partyPurposeIs used for loading ad content and other resources relating to ads for Google AdSense and Doubleclick from the Google CDN.More InformationClick here for more information about Google Ad Network.Cookie: Double Verify doubleverify.com dvtps.com Duration / TypePersistent, session, and third partyPurposeUsed to provide third party measurement of our ad impression and website traffic for our advertisers.More InformationClick here for more information about Double Verify.Cookie: FacebookDuration / TypePersistent, third partyPurposeUsed to collect information about how visitors use our site. We use this information to compile reports and help improve the site. It contains information, including the number of visitors to the site, where they’ve come from, and the pages they’ve visited.More InformationClick here for more information about Facebook.Cookie: TwitterDuration / TypePersistent, third partyPurposeUsed to provide Twitter widgets (e.g. newsfeed widget) on our websites and can collect certain visitor information including where they’ve come from, IP address, browser type, and operating system.More InformationClick here for more information about Twitter. Are there any third party cookies? Please note that third parties (including, for example, advertising networks and providers of external services like web traffic analysis services) may also use cookies, over which we have no control. These cookies are likely to be analytical/performance cookies or targeting cookies. How do I block or opt out of cookies? If you want to stop or restrict the placement of cookies or flush any cookies that may already be on your computer or device, please refer to and adjust your web browser preferences. Please note that cookie-based opt-outs are not effective on many mobile devices. Further information on cookies is available at http://www.allaboutcookies.org. By deleting our cookies or disabling future cookies you may not be able to access certain areas or features of our website or some of its functionality may be affected. By default, we set strictly necessary, analytic, and functionality cookies. You may manage advertising cookies on our Manage Cookie page. Effective: May 30, 2018 Last updated: May 10, 2022"
