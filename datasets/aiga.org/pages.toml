ion now, our net zero emissions by 2050 goal may slip out of our reach for good. Be Inspired by the AIGA Archives This rich online resource features more than 20,000 selections from AIGA’s design competitions dating back to 1924, as well as special collections of historic works from major American design firms and practitioners. Explore Keep In Touch with AIGA Sign up for email communications to be the first for updates on webinars, events, programs, and announcements. Subscribe There Is Value In Membership Join today to access networking through your local chapter and a wide variety of local and national programs and events. Join AIGA Next Up: Professional Development AIGA Webinars Explore our free-to-members webinar offerings, and learn from the comfort of your own home with live and recorded sessions. Explore AIGA Worldstudio Scholarships We believe all students should have access to design education. Learn More Competitions & Campaigns Explore opportunities to share your best work, from our longstanding competition 50 Books | 50 Covers to the reboot of 365: AIGA Year in Design. Explore"
