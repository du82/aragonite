["https://aiga.org/membership-community/diversity-equity-inclusion"]
title = "Diversity, Equity & Inclusion | AIGA"
full_description = "National Committees & Task Forces Diversity, Equity & Inclusion AIGA encourages diversity in design education, discourse, and practice to strengthen and expand the relevance of design in all areas of society. Follow Us on Instagram Join the AIGA Community Despite progress made over the course of AIGA’s 100-year history, there are vast opportunities to support a more diverse audience of design students, practitioners, managers, thinkers, enthusiasts, clients, consumers, and policy makers. Recent passionate conversations among AIGA members have catalyzed the Diversity, Equity, and Inclusion Initiative to augment ongoing AIGA programs with new ideas and resources that take a comprehensive approach, considering race, ethnicity, gender, sexual orientation, ability and disability, age, and other factors that shape creative perspective and professional experience. DEI Resources A Growing List of Resources for the Movement for Black Lives Resources, donation links, reading recommendations and Black designers to support. Illustration by Sophia Yeshi. Explore Resources A Growing Resource List in Support of the AAPI Community Resources, donation links, reading recommendations, and AAPI designers to support. Image by Zipeng Zhu. Explore Resources AIGA Design Journeys A curated collection of 40 stories about the professional lives, contributions, and portfolios of designers—contemporary and historical—from traditionally under-represented groups or backgrounds. Explore the Stories Introductory Learning List Curated by the Diversity, Equity, and Inclusion task force, this learning list is a great foundation for designers that are on the beginning of the social justice learning curve, and will help you to think critically about equity, inclusion, privilege, and bias throughout your work. Read the list Research Review current research in design which focuses on issues of diversity, and was produced by members of the AIGA Diversity & Inclusion task force. Learn More Articles & Books Discover new insights and points of view from these recommended reading materials spanning from D&I basics to academic research. Read More Scholarships AIGA Worldstudio Scholarships AIGA Worldstudio Scholarships benefit underrepresented and economically disadvantaged students who are studying photography, illustration, and design at colleges and universities in the U.S. Learn More This scholarship will allow me to continue focusing on my studies, involvement with student organization on campus, and give me the time to apply to master programs or graphic design positions. Miriam Flores 2021–2022 AIGA Worldstudio Scholarship Recipient Your Support Makes AIGA Worldstudio Scholarships Possible Since its inception in 1995, more than $1.3 million dollars has been awarded to 800+ college students of art and design. Donate Today More from the DEI Task Force Hiring and Retention Diversity & Inclusion in the Workplace Read more The Science of Stereotyping An Interview with Elizabeth and Stuart Ewen Read more Exploiting Stereotypes When Bad Is Not Good Read more Where Are the Black Designers? Maurice Cherry presents his SXSW 2015 talk Watch now Design and the Civil Rights Movement Bobby C. Martin, Jr. Read more Why Is Graphic Design 93% White? AIGA's landmark 1991 study Read more Diversity in Design Begins at HBCU Perry Sweeper Read more Why Black in Design Matters Learnings from the Harvard Conference Michele Y. Washington Read more Does Cultural Diversity Produce the Best Creative Solutions? From Ram Castillo's presentation for Herman Miller. Read more AIGA Diversity Statement Our commitment to a better design community. Learn More Diversity, Equity & Inclusion Task Force Chair Carlos Estrada AIGA Detroit George Garrastegui Jr. AIGA New York Impact Reports and Town Halls In 2016 and 2017, the AIGA Diversity, Equity, and Inclusion taskforce compiled an annual impact report—a summary of its key milestones and learnings that year. These reports are a testimony to the engagement of the task force and its influence in shaping the conversation around these issues across AIGA chapters and beyond. 2017 Impact Report In 2017, AIGA Diversity & Inclusion expanded its impact with new educational programming, including a webcast series, videos, and an all-new chapter guidebook. Read More 2016 Impact Report 2016 saw the advent of Diversity & Inclusion subcommittee, the creation of a dedicated staff position at the AIGA national office, and the award of a grant for the National Endowment for the Arts—all leading to greater presence and visibility. Read More Racial Justice by Design Town Hall: Unfolded Watch this video series on Racial Justice by Design led by experts in the fields of police reform, community engagement, and social impact design. Watch now Racial Justice by Design Town Hall: Poet Dominque Holder Gripping original poem performed by author and artist Dominique Holder. Watch now There Is Value In Membership Join today to access networking through your local chapter and a wide variety of local and national programs and events. Join AIGA"
