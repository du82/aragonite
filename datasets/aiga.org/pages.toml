title = "Talks | Adam Lucas | Adam Lucas: One Designer, One Work | AIGA"
description = "This virtual series features one designer showcasing a work that is personally meaningful. We'll hear what inspires, challenges and guides them. Expose yourself to new material by exploring with our guest, Adam Lucas. Adam will explore the book design of Walter Hamady. Hamady was a Midwest-based, Lebanese-American book artist, graphic designer, publisher, poet, and educator. His experimental approach to book design is an inspirational example of how one can find opportunities for creativity and play within established conventions."
