["https://aiga.org/inspiration/explore-new-skills"]
title = "Explore New Skills | AIGA"
full_description = "Inspiration Explore New Skills Cultivate lifelong learning and exploration of new skills with our collections of articles, talks and books. Join AIGA As Designers we aim to continually stretch... AIGA has numerous resources to support your journey to get inspired, learn more about the ever-evolving field of design and build connections, both personal and professional. A sampling are below to get you started! Professional Development AIGA Certificate for Creatives We asked, you told us—professional development and lifelong learning are critical for design professionals and to advance the profession. Resource Professional Practices Standards Principles of integrity define professional designer's expectations and distinguish AIGA members. Competition 50 Books | 50 Covers This time-honored competition aims to identify the 50 best-designed books and book covers every year. AIGA Design Conferences For decades, AIGA conferences have served as the mainstage for the diverse and ever-changing design community to gather together. Explore the variety of conferences AIGA now offers to designers at all points of their professional journey. Start the Journey AIGA Dialetic Journal Dialectic is a fully open access, biannual journal devoted to the critical examination of issues that affect design education, research, and inquiry into their effects on the practice of design. Dialectic is produced by the AIGA Design Educators Community, which supports design educators in preparing future designers of design practice, design theory and design writing while supporting the fundamental mission of AIGA. Find out more Explore Our Online Design Collections Discover the rich history of American communication design that AIGA maintains for inspiration, education and posterity. Let’s Go Keep Learning What Are You Doing Here? After 25 years working nonstop as a graphic designer and writer, it happens: Chip Kidd gets the commission of a lifetime. That should be a good thing, shouldn't it? Well, shouldn’t it?! Watch Now Why the (Business) World Needs Design More than Ever Mauro Porcini, PepsiCo’s first ever Chief Design Officer, ​shares how Pepsi embeds design into every aspect of their business, and how it drives the creation of new products and services. Watch Now Expand Your Realm for Success Bob Calvano shares his firsthand experience of how he turned a request to “hang a few pictures” into a new global-service offering. Get insight on how to transform your listening for hidden opportunities and know which ones to pounce on. Watch Now Business Perspectives for Creative Leaders This program, in partnership with Yale University, is designed to equip creative leaders to meet the challenges of management and give participants the skills and perspectives they need to reach the next levels in their careers. Instead of teaching management topics in separate, single-subject courses, Yale’s experienced faculty teach an integrated curriculum providing business frameworks and concepts in a rich, relevant context. Learn More Stay Inspired Do Good Design This book alerts us to the role design plays in persuading global audiences to fulfill invented needs. The book then outlines a sustainable approach to both the practice and the consumption of design. All professionals will be inspired by the message of how we can feel better and do better while holding onto our principles. Graphic Design Rules Graphic Design Rules is a handy guide for professional graphic designers, students, and lay people who incorporate graphic design into their job or small business. Packed with practical advice, this spirited collection of design dos and don'ts takes readers through 365 rules like knowing when to use a modular grid---and when to throw the grid out the window. Related reading, videos and opportunities Article Leadership Is THE Strategic Issue Most designers don't think of themselves as having a place in high councils of decision making. But that is where they are needed most. Talk What You Probably Didn’t Learn in Design School... In this compelling and humorous talk Leyla Acaroglu shares stories of design impacts (both intentional and unintentional) and illustrates a new narrative of design-led change. Talk Design Leadership: Developing a Roadmap Three creative leaders discuss their experiences from working with clients, internal and external stakeholders, to getting buy-in, establishing work plans, and executing their ideas."
