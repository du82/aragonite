["https://aiga.org/professional-development/competitions-campaigns/50-books-50-covers"]
title = "50 Books | 50 Covers | AIGA"
full_description = "Competitions & Campaigns 50 Books | 50 Covers Starting in 1923 as the Fifty Books of the Year competition, this time-honored competition identifies the 50 best-designed books and book covers of the year. Together, we celebrate powerful and compelling book design and the community‘s most inspired creations. DEADLINE EXTENDED: MARCH 14, 2025 Enter Now! Join AIGA for Lower Entry Rates Learn More Enter Now! 2023 Winner Announcement Fees and Payments Terms and Conditions FAQs How are jurors selected? Learn More In the News Winners Announced! Best Book and Cover Designs of 2023 Revealed Read More About AIGA 50 Books | 50 Covers This survey of book design represents perhaps the longest-standing legacy in American graphic design. Beginning in 1923, the Fifty Books of the Year competition was a yearly mainstay of AIGA. As dust jackets became more common, covers were added to the competition. AIGA is delighted to usher in another year of amazing book and cover design. Even in an era of digital books and Insta stories, AIGA understands the timeless, magnetic power of design to engage readers and encourage them to turn the page. That is why the AIGA 50 Books | 50 Covers competition continues to recognize the best of book and book cover design from around the world. Selections from past competitions have been added to the AIGA Design Archives—one of the richest online resources available to those who practice, study, and appreciate great design—as well as the physical archives at the Denver Art Museum (1980–2012) and at the RBML at Columbia University's Butler Library in New York City. From 2012–2018 Design Observer hosted the competition with AIGA through a joint venture and winners can be seen on Design Observer (2011–2017). Recent winner galleries include: 50 Books | 50 Covers of 2018, 50 Books | 50 Covers of 2019, 50 Books | 50 Covers of 2020, 50 Books | 50 Covers of 2021, and this year's 50 Books | 50 Covers of 2022. Winners Gallery 50 Books | 50 Covers of 2023 “For me, there was a greater overall sophistication in book design, with a mix of aesthetically beautiful and graphically brash approaches in the final choices.” —Andrew Satake Blauvelt, Cranbrook Art Museum Explore the Gallery Competition Details Entry Fees & Deadlines Notifications FAQs Entry Fees & Deadlines All deadlines are at 11:59 p.m. ET.Entry Fees(per book)Extended Final Deadline:March 14, 2025 AIGA Members$165 Nonmembers$200 Join to save!Learn More Notifications If work is selected by the jurors, an email notification will be sent to entrants of winning work in Summer 2024.Juror selections will be published in a collection on the competition website and shared across AIGA channels. Physical copies will be housed at the Rare Book and Manuscript Library at Columbia University's Butler Library (RBML) for future generations to enjoy.Recognition includes:Showcase in the online Winners Gallery;Official press release distributed to leading industry outlets and media providers;Official digital assets, including competition logo for winners to self-promote;Coverage on AIGA social media channels;Coverage in AIGA newsletters. FAQs Visit contact information and FAQs. Office hours for support are 9:00 a.m.–5:00 p.m. ET Monday-Thursday, 9:00 a.m.–1:00 p.m. ET Friday, (excluding holidays).There are three deadlines and member discounts to create multiple pathways for participation while also covering the costs of producing a competition at this scale, including admin, marketing and communications, platform fees, designer fees, and more. By entering early you save more and help us prepare for the judging phase.AIGA is a 501(c)(3) nonprofit organization with a mission to advance design as a professional craft, strategic advantage, and vital cultural force. As the largest contemporary membership association for design, AIGA connects and builds community through awards, advocacy, education, research, writing, and resources for every career stage. All entry fees support AIGA’s programs and move our mission forward.Learn more Call for Entries Cycle Call for Entries OpenDecember 16, 2024Call for Entries CloseMarch 14, 2025Earliest NotificationJune 2025Earliest AnnouncementAugust 2025 Learn More As a book designer, book lover, and book collector, I'm honored and thrilled to be returning to the 50 Books | 50 Covers jury this year as its Chair. 100 years is a significant milestone for any competition, but at a time when the future of the book is an ongoing topic, we saw last year the vibrancy and vitality of the book form in the hands of both new and expert designers shaping stories that demanded a broader audience with care and commitment. In our recognition, we not only selected for quality but also relevance to our time — why these books were deserving of this award today, and how offering it could help them go even further in finding passionate readers and audiences. It's been said that 'books make friends' — as much as this is a competition about great objects, it's also hopefully a catalyst for new relationships between publishers, creators, and the public. Rob Giampietro 50 Books | 50 Covers of 2023, Chair Book Competition Add your creations to the stacks. The AIGA 50 Books | 50 Covers competition recognizes the best of book and book cover design from around the world. Entries for 2024 now open! Learn More The exciting part about opening any new book for the first time is the power it has to influence your relationship to typography or images—by its placement, position or scale on a single page. Kelly Walters 50 Books | 50 Covers of 2020 Juror More to Explore Six Great Book Covers and the Stories Behind Them Design insights from the winners of this year’s 50 Books | 50 Covers of 2020 competition. Read More Shimmer, Neon, Nature—Here are the Trends That Have Defined the Year In Book Cover Design This winners of this year's 50 Books | 50 Covers of 2019 competition are a bold bunch. Read More What Goes Into Designing an Award-winning Book Cover? For these 50 Books | 50 Covers of 2018 winning designers, it’s all about bold typography, texture, and a ton of wit. Read More The 50 Books | 50 Covers Winners are Here! You’re just 50 titles away from a better-looking bookshelf. Read More Building Partnerships With A Vibrant Community The National Partnership Program is about leadership, relevance, and impact—with, within, and through design—to build and sustain programs, initiatives, and resources that champion a more contemporary and inclusive profession. Learn More"
