["https://aiga.org/competitions-initiatives/365-aiga-year-in-design"]
title = "365: AIGA Year in Design | AIGA"
full_description = '''Competitions & Campaigns 365: AIGA Year in Design A famed competition, redefined for today's designer. 365: AIGA Year in Design celebrates your passion, hard work, and dedication. For agencies big and small as well as those going it alone, we're recognizing excellence and representing innovation across all categories of communication design, from print to web to service to spaces—both physical and virtual. Enter Now Join AIGA for Member Rates Learn More Enter Now! 2023 Winners Announced | Read the Press Release Deadlines and Eligibility Categories and Criteria Fees and Payments Terms and Conditions FAQs In the News 365: AIGA Year in Design Winners Announced for 2023 | AIGA Celebrates a 360-degree View of Design over 365 Days Read More About 365: AIGA Year in Design Since its founding in 1914, AIGA has celebrated design excellence within the profession. Today, research shows design and design thinking are essential to innovation; design is at the heart of successful businesses. And we know competitions are a valuable benefit to our members. Competitions at the national, regional, and local level have been instrumental in identifying emerging and hidden talent within the design community, recognizing effective visual design solutions in the marketplace, and communicating the added value of design to adjacent industries around the world. As the largest contemporary membership association for design we are committed to creating pathways for you to get your latest work out in front of those you care about most—to help you stand out from the competition, reach wider markets, and fuel growth in your career. 365: AIGA Year in Design is a 360-degree view of design over 365 days. This competition publicly celebrates designers, design teams, and their clients for effectively working together to design creative solutions for challenges presented by businesses and organizations. Designers are key to solving complex problems, especially now as companies large and small are forced to adapt, pivot, or reinvent themselves to stay relevant. As your professional association, we want to celebrate your brilliance. Because so much work is shared through social media and different design platforms, it's easy to think that there is less of a role for design competitions. Historically, competitions were THE place where work was largely seen for the first time, as well as celebrated. With studios and individual designers having comparable access to getting their work seen, design competitions are put in a slightly different role of providing a critical look at the year in design. The 365: AIGA Year in Design competition provides the opportunity to filter, evaluate, and parse what projects stood out, what projects proved influential, and what amazing things fell off the radar and deserve a bigger platform. For all of us on the jury, we want to see the most interesting work so that we can create the most provocative picture of what the past year looked like. Surprise us so we can surprise you! Abbott Miller 365: AIGA Year in Design of 2023 Chair Competition Details Entry Fees & Deadlines Notifications FAQs Entry Fees & Deadlines All deadlines are at 11:59 p.m. ET.Entry Fees(per entry)Early Discount Deadline:February 3, 2025Regular Deadline:March 10, 2025Final Deadline:March 31, 2025AIGA Members$140$165$215Nonmembers$200$225$275 Join before you enter to save!Learn More and Enter Notifications If work is selected by the jurors, an email notification will be sent to entrants of winning work in Summer 2024.Juror selections will be published in a collection on the competition website and shared across AIGA channels. Recognition includes:Showcase in the online Winners Gallery;Official press release distributed to leading industry outlets and media providers;Official digital assets, including competition logo for winners to self-promote;Coverage on AIGA social media channels;Coverage in AIGA newsletters. FAQs Visit contact information and FAQs. Office hours for support are 9:00 a.m.–5:00 p.m. ET Monday-Thursday, 9:00 a.m.–1:00 p.m. ET Friday, (excluding holidays).There are three deadlines and member discounts to create multiple pathways for participation while also covering the costs of producing a competition at this scale, including admin, marketing and communications, platform fees, designer fees, and more. By entering early you save more and help us prepare for the judging phase.AIGA is a 501(c)(3) nonprofit organization with a mission to advance design as a professional craft, strategic advantage, and vital cultural force. As the largest contemporary membership association for design, AIGA connects and builds community through awards, advocacy, education, research, writing, and resources for every career stage. All entry fees support AIGA’s programs and move our mission forward.Learn more History Evolving over time, the competition was first launched in 1924 as "Contemporary Printing for Commerce." Since then, it has been called: "Printing for Commerce" (1925–1953); "Design and Printing for Commerce/Fifty Advertisements of the Year" (1954–1967); "Communication Graphics" (1968–2000); and "365: AIGA Year in Design" (2001–2011). Now—more than a decade later, and nearly a century since its inception, when so much in the world has changed—we look forward to celebrating you in 2022! Follow Us Call for Entries Cycle Call for Entries OpenJanuary 2025Call for Entries CloseMarch 2025Earliest NotificationJune 2025Earliest AnnouncementAugust 2025 Enter Now How are jurors selected? Learn More Contact Us: Competitions The collection of winners is eclectic and diverse which, in an interesting way, reflects the world we currently live in. Rafael Esquer Creative Director, Alfalfa Studio, New York, NY Call for Entries Now Open! 365: AIGA Year in Design is a 360-degree view of design over 365 days during the 2023 calendar year. We're recognizing excellence and representing innovation across all categories of communication design, from print to web to service to spaces—both physical and virtual. Enter Now Past Winners Say Hello to the Owners, 1985 Design firm: Herman Miller, Inc., Zeeland, Michigan Collections: Communication Graphics: 07 (1986) Format: Corporate communication, Annual report Client: Herman Miller, Inc. Learn More Results Marketing Logo, 1994 Design firm: Richardson or Richardson, Phoenix, Arizona Collections: Communication Graphics: 16 (1995) Format: Brand identity, Illustration, Logo Client: Results Marketing Learn More Target ClearRx, 2005 Design firm: Target, Minneapolis, Minnesota Collections: AIGA 365: 27 (2006) Format: Package Client: Target Learn More It's the best record created as a snapshot of the work from each year. Sean Adams 2014 AIGA Medalist and Chair, ArtCenter Undergraduate and Graduate Graphic Design, ArtCenter College of Design The 365 competition has been the go-to-showcase for everyone—client and practitioner—to view incredible work with incredible stories, its absence has been a major loss . . . and so its revival will be a major boon. Steven Heller 1999 AIGA Medalist and Co-Chair SVA MFA Design, The Designer As Entrepreneur Program Building Partnerships With A Vibrant Community The National Partnership Program is about leadership, relevance, and impact—with, within, and through design—to build and sustain programs, initiatives, and resources that champion a more contemporary and inclusive profession. Learn More'''
