["https://aiga.org/inspiration/aiga-design-archives-special-collections"]
title = "AIGA Design Archives & Special Collections | AIGA"
full_description = "Inspiration AIGA Design Archives & Special Collections AIGA’s archives and special collections identify, preserve, and make available works of enduring value. Your support makes it possible to increase access to resources, support research, and elevate the diverse and impactful stories of design and designers. Visit Us Online Resources AIGA History Timeline Online Design Collections Bibliographies Talks Design History Resources and Archives Inspiration Documenting the Shifting Aesthetics and Sensibilities of the Design Community for More Than a Century Installation view “AIGA 100: A Century of Design” at Museum of Design Atlanta (MODA). Photo: Bethany Legg Photography, courtesy of MODA (2014). Donate Explore our collections and discover the rich history of American communication design. AIGA’s institutional archive serves as the memory of the organization’s extensive history and association with the century’s most influential designers. The bulk of the collection consists of printed records created by and for AIGA, including exhibition catalogues and design annuals documenting the selections from AIGA competitions since 1915; newsletters and journals published by AIGA since 1922; AIGA conference materials produced since 1985; and flat files of prints, posters, publications, and more by AIGA Medalists and AIGA Chapters. Resources ONLINE AIGA Design Archives AIGA Design Archives represents the quality of work being created, as well as shifting aesthetics and sensibilities of the designers of the day. This rich online resource features more than 20,000 selections from AIGA’s design competitions dating back to 1924, as well as special collections of historic works from major American design firms and practitioners. Learn more about the design process and read the case study for the AIGA Design Archives. View the work and learn more about the collections, including selections that are housed at the Denver Art Museum. SPECIAL COLLECTIONS Denver Art Museum Gifted to the Denver Art Museum in 2006, the AIGA Archives at the Denver Art Museum recognizes award-winning entries made to AIGA’s annual competitions. The collection represents the largest and most comprehensive holding of contemporary American communication design in the world with approximately 12,000 physical artifacts. The archive reflects the major design trends as well as many of the leading design firms and individual designers that defined the 32-year period from 1980 to 2012. The physical objects are used within Denver Art Museum’s exhibiting collection and serve to educate future generations on the antecedents and evolution of art and commerce. SPECIAL COLLECTIONS Rare Book and Manuscript Library at Columbia University’s Butler Library The winning selections from AIGA’s longest-running annual book design competition, 50 Books | 50 Covers (formerly Fifty Books of the Year), held at the Rare Book and Manuscript Library (RBML) at Columbia University’s Butler Library in New York City, demonstrate the principles of good design and craftsmanship in the manufacture of contemporary American books. The collection of more than 5,000 books is currently being catalogued by the library and spans nearly a century of AIGA competitions. The library is available for on-site use by AIGA members and researchers. Follow Us Hours Due to the impact of COVID–19, we regret that we are unable to accept visitors at this time. Design Archives Support 1977 EPA Graphic Standards System A percentage of each sale supports the AIGA Archives. Get Yours Today FAQs Can I use work (image, text, media) from AIGA or AIGA Design Archives? All works are the copyright of their respective owners. Because AIGA supports copyright and privacy, AIGA is limited to distributing images, text, or media in the AIGA archives and on its websites. In many cases, AIGA does not hold the copyright to materials in its collections and cannot assume responsibility for determining their copyright status. To publish or quote from work in the AIGA archives and on its websites, it is your responsibility to secure express written permission from the appropriate rights holder. If work is in the archives and there are no copyright or access restrictions, work may be shared for non-commercial purposes, provided you credit AIGA and link to aiga.org. All work from the AIGA archives or its websites must be displayed with an appropriate credit line (work title, artist, year, link to where it lives on our website, and the source cited as: AIGA, the professional association for design). All requests for materials and permission to publish are subject to approval. Copyright restrictions may apply. Please direct inquiries to AIGA’s archivist. Due to COVID-19 and current backlogs, it may take up to 12 weeks to fulfill requests for digitization and/or permission to publish. We are unable to accommodate rush requests. AIGA's physical collections are stored offsite. There may be a fee for time and materials. By initiating the request for digitization and/or permission to publish, you agree to these terms and to indemnify and hold AIGA harmless from any and all claims, suits and expenses arising from the use of work from the AIGA archives and on its websites. What are the best resources to learn about AIGA Medalists? AIGA Medalist Essay Collection (see also Wayback Machine) AIGA Medalist Video Collection (see also YouTube) In addition to the AIGA Medalist essays, research guides are being compiled to surface related content from articles, books, exhibitions and events, websites and online collections, audio, and video. These research guides are located beneath each essay and are currently available for Saul Bass, Ivan Chermayeff and Tom Geismar, Milton Glaser, Leo Lionni, Herb Lubalin, Herbert Matter, Massimo and Lella Vignelli, and Henry Wolf. Research Guides can be a great information literacy assignment for students and educators? Contact AIGA’s archivist to learn more. Where can I learn more about U.S. Copyright? Visit: https://www.copyright.gov Identity: Chermayeff & Geismar & Haviv A percentage of each sale supports the AIGA Archives. Get Yours Today Related readings, videos, and collections Online Exhibition 2016 African American Culture and History: an AIGA Design Journey Selected works from AIGA's prestigious Design Archives and Design Journeys series, this collection celebrates African American history and culture throughout the last century of communication design. Online Exhibition 2016 AIGA Get Out the Vote 2016 A collection of posters by AIGA leaders across the U.S. representing Get Out the Vote 2016, an AIGA Design for Democracy campaign. Online Exhibition 2017 Across Borders: A Look at the Work of Latinx Designers Selected works from AIGA's Design Archives, Design Journeys, and video archives this collection focuses on and celebrates the contributions of Latinx designers to the field of communication design during the last fifty years."
