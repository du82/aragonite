title = "AIGA Medal | AIGA"
full_description = "AIGA Awards AIGA Medal The medal of AIGA—the most distinguished honor in the profession of communication design—has been awarded since 1920 to individuals in recognition of their exceptional achievements to the advancement of the field of design as a respected craft, strategic advantage, and vital cultural force. Medals have been awarded to individuals who have set standards of excellence over a lifetime of work or have made individual contributions to innovation within the practice of design. Nominations are now open! Submit a Nomination Join AIGA 2022 AIGA Medalists Andrew Satake Blauvelt “Expansion” Recognized for his vast work in the field of art and design in service of the public—a steward of design history, he has redefined the traditional role of the museum in the community and made innovative cultural and educational programming accessible to all Read More Emily Oberman “Achievement” Recognized for imprinting our visual culture with her wit and great fluency of style—highly influential, she is a north star for designers in business and ubiquitous as a graphic artist in entertainment Read More Louise Sandhaus “Enrichment” Recognized for her presence and voice in the community as an educator and author—brilliant yet accessible, her work elevates under-recognized designers through stunning publications, insightful storytelling, and an eye toward design in everyday life Read More Recognizing Excellence in Design and Designers for More Than a Century Your support impacts a vibrant community that we celebrate together. Make a Donation to Scholarshps 2022 Awards Selection Committee Chris Dingwall, Design Historian and Curator, Oakland University Sheharazad Fleming (Co-Chair), Director of Digital Design and Marketing, Office of L.A. City Mayor Karin Fong, Director + Designer, Imaginary Forces Maribeth Kradel-Weitzel (Co-Chair), Assistant Provost, Associate Professor and Program Director of MS Health Communication Design, Thomas Jefferson University Advisors to the Committee (non-voting): Ashleigh Axios, Chief Experience Officer and Partner, Coforma Returning committee members have been invited to participate in the committee deliberations as non-voting members to provide guidance on the criteria. Nominations and Selection Criteria Purpose and Goals Nominations Lens for Unique and Outstanding Contribution Selection Criteria Purpose and Goals To celebrate designers who represent the highest aspirations of our members by honoring inspirational individuals who have successfully enhanced the value and deepened the impact of design on business, society, and culture, through their unique and outstanding contributions in the practice of design, teaching, writing, or leadership of the profession. To increase public awareness and understanding of the critical and influential role of design and designers in business, culture, and our communities at large. Nominations AIGA members are invited to submit nominations to be considered by next year’s committee. To nominate an inspirational colleague, mentor, or individual who has made a significant impact in the U.S., simply complete the nomination form. Include the name of the nominee, a short paragraph about why the individual should be considered, and a link to their website or portfolio. Nominations are accepted on a rolling basis and are considered year after year for the next awards cycle. Each year, nominations for the AIGA Medal are reviewed by an awards committee to verify eligibility. Yearly recommendations for Medal awards are then presented to the AIGA National Board of Directors for majority approval. The Board approves a slate of Medalists, and does not propose or reject individual names recommended by the committee. Individuals who are honored may work in any country, but the contribution for which they are honored should have had a significant impact on the practice of communication design in the United States. Lens for Unique and Outstanding Contribution Achievement: With a focus on craft, eligible nominees will have made a historically significant contribution to the profession Enrichment: With a focus on community, eligible nominees will have set a new benchmark for service as community catalysts Expansion: With a focus on possibility, nominees will have pushed the envelope to broaden the scope of what we consider great design Selection Criteria The AIGA board of directors has issued the following instructions: Minimum of one and maximum of three medals will be awarded each year As a whole, the select group of Medalists should represent the design community’s diversity of design practice, gender, ethnicity, and geography While AIGA’s roots are founded in traditional forms of graphic design, the selected group of awardees should reflect the broad scope of where the profession of design is today Honor designers as exemplary, living role models of inspiration and aspiration to our members One Honorary Medal per year may be awarded at the discretion of the committee to recognize a designer posthumously. Recognition opportunities for posthumous awards may vary. Additional attributes for consideration: Exemplary service to AIGA and the broader design community Strong leader and role model for AIGA’s members and its mission of design as a professional craft, strategic advantage, and vital cultural force Public advocacy for the profession Consistent commitment to social change Follow Us Nominations Nominations Now Closed Nominations are now closed. Please check back for updates on future nomination cycles! Support a vibrant community! Your support makes our work possible. Donate Now Learn More AIGA Medalists 1950, 1969, 1970–2019 Essays A catalogue of essays about the life and work of AIGA Medalists. See their work and learn more about their unique and outstanding contributions to the profession. AIGA Medalists 1972, 1979, 2010–2019 Videos A catalogue of videos about the life and work of AIGA Medalists. See their work and learn more about their unique and outstanding contributions to the profession. 2021 AIGA Medalists Archie Boston, Jr. “Expanding voice” Recognized for his longstanding commitment to his students as an educator, mentor, and profound influence on the community of Los Angeles, as well as his bold, funny, polemical designs from a lifetime body of work. Read More Terry Irwin “Expanding envelope” Recognized for her vision and enduring provocation to shape design education and philosophy through Transition Design—the need for societal transitions towards more sustainable and plural futures. Read More Cheryl D. Miller “Expanding access” Recognized for her outsized influence within the profession to end the marginalization of BIPOC designers through her civil rights activism, industry exposé writing, research rigor, and archival vision. Read More Thomas Miller “Expanding recognition” Recognized posthumously for his tenacity and impeccable craft as a pioneering graphic designer and art director for global brands—based in Chicago, whose work culminated in the timeless DuSable Museum mosaics. Read More 2019 Medalists Alexander Girard Recognized for his effortless ability to move across innumerable surfaces and scales, his life-long innovative and inspirational cross-disciplinary design practice, and his undeniable impact on mid-century modernism in America. Watch Video Geoff McFetridge Recognized for deftly relating design to time-based considerations—film titles, music videos, envisioning of AI—and vibrant sculptural forms, and for welcoming graphically-charged outsider/street subculture into the mainstream conversation. Watch Video Debbie Millman Recognized for skillfully designing both the form and expression as principal of Sterling Brands, alongside the medium by which the designer's voice can be amplified and understood through her award-winning podcast, Design Matters; for actively designing the pedagogy for the next generation of practitioners at the School of Visual Arts (SVA), Masters in Branding; and for her years of service and commitment to AIGA. Watch Video Past Recipients 2022–2008 2022 Andrew Satake Blauvelt Emily Oberman Louise Sandhaus 2021 Archie Boston, Jr. Terry Irwin Cheryl D. Miller Thomas Miller 2019 Alexander Girard Geoff McFetridge Debbie Millman 2018 Aaron Douglas Arem Duplessis Karin Fong Susan Kare Victor Moscoso 2017 Art Chantry Emmett McBain Rebeca Méndez Mark Randall Nancy Skolos and Thomas Wedell Lance Wyman 2016 Ruth Ansel Richard Grefé Maira Kalman Gere Kavanaugh Corita Kent 2015 Paola Antonelli Hillman Curtis Emory Douglas Dan Friedman Marcia Lausen 2014 Charles S. Anderson Dana Arnett David Carson Kyle Cooper Michael Cronan Richard Danne Stephen Doyle Louise Fili Michael Donovan and Nancye Green Bob Greenberg Sylvia Harris Cheryl Heller Alexander Isley Chip Kidd Michael Mabry Abbott Miller Bill Moggridge Sean Adams and Noreen Morioka Kenneth Carbone and Leslie Smolan Gael Towey Ann Willoughby 2013 John Bielenberg Jonathan Hoefler and Tobias Frere-Jones William Drenttel and Jessica Helfand Stefan Sagmeister Lucille Tenazas Wolfgang Weingart 2011 Ralph Caplan Elaine Lustig Cohen Armin Hofmann Robert Vogele 2010 Steve Frykholm John Maeda Jennifer Morla 2009 Pablo Ferro Carin Goldberg Doyald Young 2008 Gail Anderson Clement Mok LeRoy Winbush 2007–1990 2007 Ed Fella Ellen Lupton Bruce Mau Georg Olden 2006 Michael Bierut Rick Valicenti Lorraine Wild 2005 Bart Crosby Meredith Davis Steff Geissbuhler 2004 Joseph Binder Sheila Levrant de Bretteville Charles Coiner The Coynes James Cross Jay Doblin Joe Duffy Martin Fox Caroline Warner Hightower Kit Hinrichs Walter Landor Philip B. Meggs James Miho Silas H. Rhodes Jack Stauffacher Alex Steinweiss Deborah Sussman Edward Tufte Fred Woodward Richard Saul Wurman 2003 B. Martin Pedersen Woody Pirtle 2002 Robert Brownjohn Chris Pullman 2001 Samuel Antupit Paula Scher 2000 Laurie Haycock and Scott Makela Fred Seibert Michael Vanderbyl 1999 Steven Heller Tibor Kalman Kat