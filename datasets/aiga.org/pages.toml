["https://aiga.org/eye-on-design/the-80s-are-back-baby"]
title = "The ’80s Are Back, Baby | AIGA"
full_description = "Eye on Design Categories Design Branding Books Digital Graphic design Illustration Magazines Packaging design Typography Design + Design + Art Design + Diversity Design + Education Design + Gender Design + Mental Health Design + Money Design + Music Design + Sexuality Design Series First Thing I Ever Designed Design History 101 The ’80s Are Back, Baby Branding In all their tight-type, neon-colored, advertorial glory Words by ​​ Elizabeth Goodspeed Published on December 7, 2022 Illustration by Tala SafiéThis story is part of our Weekend Reads series, where we highlight a story we love from the archives. It was originally published online in January, 2022.What are you seeing?Layered, type-driven design inspired by 1980s advertising is on the rise, and along with it, a worthy opponent (finally) for the sleek, buttoned-up visual world of the last decade. In its purest iteration, the throwback ’80s editorial trend is text-heavy, with layouts comprised of a single, often silhouetted or gradient-backed image, a punchy headline, and supporting narrative copy. The most recognizable component of the trend is arguably its widespread use of condensed serifs like ITC Garamond Condensed or Editorial New—typefaces that just a few years ago would have been relegated to body copy, and certainly never run large as headlines with such tight tracking—as well as the occasional bold sans (a holdover from the Lubalin era) like ITC Kabel.This aesthetic is most readily associated with 1980s advertisements by Apple, which pioneered the look with its launch campaign for the 1984 Macintosh, along with New Balance (Steve Jobs’ shoe of choice: a coincidence?) and car companies like Honda or Dodge. Arguably, this narrative approach to selling products can be traced back even further, to 1960s advertising titans like William Bernbach and David Ogilvy’s respective work for VW and Schweppes.A New Balance advertisement from 1988.The current trend also includes an increase in visual motifs that cue physicality and real-world materials, even within brands that are exclusively digital. Think: film grain, VHS dithering, airbrush art, and faux paper backgrounds. This interest in throwback textures even extends to art direction and styling, with more photoshoots incorporating old-school tech like fax machines, cassette tapes, and brick phones as props (an occurrence mirrored in the adjacent return of low-fi 2000s tech like wired earphones). Like all trends of the “big flat now” that is 2022, the ’80s editorial aesthetic has many sub-genres and close cousins, ranging from neon script to monochrome euro-luxe. But, at their core, these offshoots are all unified by a mutual renewed interest in a balanced relationship between copy and image, as well as a return to tactility. A New Balance advertisement from August 2021.A New Balance advertisement from October 2021.Honda’s 1982 advertisement.An old-school Macintosh ad, featuring a column of text.A Commodore advertisement from 1985.An advertisement for the Aime Leon Dore x New Balance collaboration from July 2021.Who’s using it?The trend has mostly appeared in brand identity and campaign work, particularly in the fashion and lifestyle worlds (which always seem to hit on a new visual style before it trickles down to consumer packaged goods and tech). Eighties editorial style design has been seen in recent campaigns from Skims, Nike Yoga, and Amélie Pichard, as well as, unsurprisingly, in a slate of recent New Balance collaborations, including Aime Leon Dore, Casablanca, and Staud. Still emerging is the trend’s appearance in a few new food brands, like the just-launched Graza or bespoke beverage brand Lark. Brooklyn creative agency Gander designed this advertisement for the 2021 launch of the olive oil company Graza.VHS grain, airbrush art and officecore prop use is too widespread to list every occurrence, though one particular spot of interest is how fully these motifs form the backbone of Coach’s Spring 2022 social campaigns, including ’80s- and ’90s-era details as specific as faux 1-800 numbers and the creation of an imaginary public access TV channel called Coach TV. Another fun example is Elana Schlenker and Élise Rigollet’s work for Los Angeles boutique Dreams, which combines airbrush art by Julia Dufossé with pixelated type and a mysterious phone number for a surreal 1980s result. Vacation, the sunscreen purveying arm of Poolsuite that launched in 2021, is probably the most fervent and therefore notable adopter of the ’80s editorial aesthetic to emerge over the past year. The brand, inspired by Miami leisure and the hyper-optimism of 1980s corporate culture, leans into many different visual tropes from the trend, including a condensed serif (Benton Modern), decorative italics, image borders, and paper textures that imply text on the other side of the page.What makes them stand apart from other use cases, however, is their holistic embrace of the ’80s lifestyle and its physical artifacts within their general brand strategy as well. The company advertises a Diner’s Club special, consumers can make their own faux Vacation business cards with job titles like “Cocktail Umbrella Designer,” and captions on Vacation’s social posts spin tales of imaginary corporate retreats and snorkeling employees. Their unwavering use of the registered trademark symbol on every occurrence of the word Vacation is also a nice, detail-oriented touch that helps sell through the holistic, immersive world they’ve recreated.An advertisement for Lark.A Skims advertisement from January 2022.Vacation branding, 2021.Dreams LA, 2021.Coach TV visual from September 2021.Maude advertising from April 2021.Why do designers love it?Two years into a pandemic, and it seems like the collective ennui of isolated life has somehow led us headfirst into indulgence; ego is out, id is in, we’re smoking cigarettes and doing whatever the fuck we want, even while the world burns around us. As Michael Scanlon, chief creative director at Chandelier Creative, puts it: “From the looks of it on Instagram, everyone under 40 has ditched their reishi smoothies for caviar and martinis. And why not? It’s grim out there and we’re all craving a bit more pleasure and wit to make us feel alive again.” Looking back at the past 50 years, what could embody this mindset better than the 1980s—a time of vibrant nightlife and rampant consumerism, all set against the bleak backdrop of Reaganomics and the AIDS crisis.“Everyone under 40 has ditched their reishi smoothies for caviar and martinis. And why not? It’s grim out there and we’re all craving a bit more pleasure and wit to make us feel alive again.”On a functional level (this is a design publication, after all), it almost goes without saying that in 2022, refined minimalist design is thoroughly passé. So it’s definitely natural that the swing toward an ’80s aesthetic is part of the typical “20-year trend cycle” and a move back to a more maximalist, intentionally inexact approach to design as well. Maristella Gonzalez, art director at Ceremonia, also points out that Gen-Z is the demographic to target at the moment, and their decade-jumping obsessions with the ’80s, ’90s, 2000s, and, soon, the 2010s, is driving the return of everything vintage, from Joan Jett’s mullet to Ashley Tisdale’s bootcut jeans. It’s no surprise then that brands have realized creating a pastiche of any of these aesthetics is a sure-fire way to attract the attention, and dollars, of these younger potential customers. Amélie Pichard advertisement, November 2021.But while ’80s design is certainly resonating, it seems likely that nostalgia as a concept (rather than an explicit love of condensed serifs) is what’s really driving this resurgence. Designer Stefanie Brückler suspects that in response to a myriad of worldwide crises like COVID-19 and climate change, society is experiencing a collective yearning for the “better times” of the ’80s and early ’90s.To her, “Millennials who had their early childhood in the ’80s, and those who experienced remnants of this era in the beginning of the ’90s, are yearning for places in their memory that feel safe, and remind them of parental love and protection.” It’s likely that these same Millennials, now 27–42 years old, are also at the helm of many of the creative teams tapping into this ’80s editorial aesthetic for contemporary branding and campaigns. For Gen-Z, who didn’t experience these decades firsthand, there’s still a deep romanticization of these periods (and their associated aesthetics) as simpler times, without cell phones and remote schooling.From a brand strategy perspective, the editorialized advertising of the ’80s can also feel like a welcome change from the subtleties of social media spon-con. Rather than a winking, implied recommendation for a product, these editorial copy–driven layouts are advertisements with a capital A: this is what perfection looks like, and you can have it too. At a time when everyone wants a better life, maybe we’re just hoping that brands can tell us how to get one."
