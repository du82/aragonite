["https://aiga.org/governance/constitution-bylaws"]
title = "Constitution & Bylaws | AIGA"
full_description = "Governance Constitution & Bylaws AIGA is a not-for-profit educational institution incorporated in the state of New York, under section 501.c.3 of the IRS code. The constitution and bylaws of AIGA have been written to assure an institution that is governed to honor the role of the board in advancing the interests of the profession. As adopted and amended by the AIGA Board of Directors on March 8, 2019. The name of this organization shall be The American Institute of Graphic Arts, a Corporation (hereinafter called “AIGA” or “the Corporation”), as provided for in the Certificate of Incorporation approved December 6, 1927, according to the Membership Corporations Law of the State of New York. The American Institute of Graphic Arts was founded February 17, 1914, when the Constitution was adopted. AIGA is a global community of design advocates and practitioners. AIGA advances design as a professional craft, strategic advantage and vital cultural force by connecting practitioners, enthusiasts and patrons through regional, national and global events and by creating and curating content that: Advocates for a greater understanding of the value of designers and design in government, business, media and the public Enhances professional development Defines global standards and ethical practices Inspires designers and the public Establishes criteria for design education that meets the needs of the profession Makes powerful tools and resources available and accessible Celebrates and enhances the value of design Mobilizes a global design movement Article I. Offices and Registered Agent Section 1. Registered Office. The Corporation shall have and continuously maintain in the State of New York a registered office, and a registered agent whose office is identical with such registered office. The registered office may be, but need not be, identical with the Corporation’s principal office in the State of New York. The registered agent or registered office, or both, may be changed from time to time by the Board of Directors. Section 2. Other Offices. The Corporation may have such other offices either within or without the State of New York as the Board of Directors may determine or as the affairs of the Corporation may require from time to time. Article II. Members Section 1. Class of Members. The Corporation shall have three classes of Members, to be designated as regular, affiliated and group. The Members of the Corporation shall consist of those persons or organizations, without limit as to number, who are interested in the objects and purposes of the Corporation. (a) Regular Members shall include all persons entitled to the full benefits of Membership. (b) Affiliated Members, such as student Members, are entitled to less than full privileges of Membership. They are not entitled to the voting privileges of a regular Member. (c) Group Members are provided to an organization or corporation; this class of Membership offers multiple regular or affiliated Membership privileges to a set of employees of an organization, corporation or affiliated group. (d) The privileges of Membership for each Membership class shall be recommended by the Executive Director as part of the annual budget and service plan and shall be approved by the Board of Directors by a majority vote of those present. Section 2. Categories of Membership. Categories of Membership and Membership fees shall be recommended by the Executive Director and approved by the Board of Directors by a majority vote of those present at the meeting of the Board at which the annual budget is adopted. Categories will be based on criteria that will encourage long-term growth in Members’ participation and support for the Corporation’s activities. For each class of Member referred to in Section 1 of this Article II, there may be several categories of Membership. Section 3. Election to Membership. Any individual or group eligible for Membership under Section 1 of this Article II of these Bylaws may be accepted for Membership following written application in such form as the Board of Directors shall from time to time determine. Section 4. Voting Rights. Each regular Member shall be entitled to one vote on each matter submitted to a vote of the Members. A group Membership shall be entitled the same number of votes as the equivalent number of regular Memberships to which it is entitled; the voting privileges will be assigned to the listed individual Members. Section 5. Duration of Membership and Resignation. Membership in the Corporation shall continue indefinitely until terminated by voluntary withdrawal as herein provided, or otherwise in accordance with these Bylaws. All rights, privileges, and interests of a Member in or to the Corporation shall cease on the termination of Membership. Any Member may withdraw from Membership, by giving written notice of such intention or by failure to pay monthly, quarterly or annual membership dues in a timely manner, consistent with the payment schedule elected by the Member. Unless otherwise determined by the Board of Directors, withdrawals shall be effective upon the 30th day after the date of such notice of withdrawal. Section 6. Termination of Membership. (a) The Board of Directors, by affirmative vote of 2/3 of the Members of the Board present at any meeting, may suspend or expel a Member for cause. (b) Any termination of Membership under this Section 6 or resignation of Membership under Section 5 of this Article II shall not relieve any Member of any outstanding obligation to the Corporation or any obligation assumed by the Member on behalf of the Corporation to any third party. Section 7. Reinstatement. Upon written request signed by a former Member, the Board of Directors may reinstate such former Member to Membership upon such terms as the Board of Directors may deem appropriate. Article III. Meetings of Members Section 1. Meetings of Members. All issues that might be raised in annual or special meetings of Members may occur in electronic text, aural or visual form and by internet functionality, if and when legally permitted, as well as by written communication, addressed to all Members with a means for Members to communicate openly and transparently with the Board and Executive Director and to authenticate their identity. Annual communications shall be sent to all members for the purpose of considering annual reports; the election of Directors; and for the transaction of such other business as the Board of Directors shall determine. Section 2. Quorum. One hundred Members entitled to vote and participating in an issue raised in electronic communications with members shall constitute a quorum at a meeting of the Members. When a quorum is present at any meeting of the Members, the affirmative vote of a majority of the votes entitled to be cast by the Members present shall decide any question brought before such meeting unless the question is one upon which by express provision of statute or the Articles of Incorporation or of these Bylaws a different vote is required. In the latter event, such express provision shall govern and control the decision of such question. Section 3. Order of Business. The order of business at all meetings of Members shall be as determined by the Chairman of the meeting, but the order of business to be followed at any meeting at which a quorum is present may be changed by a majority of the votes cast at such meeting by the Members present in person or electronically and entitled to vote at the meeting. Section 4. Voting by Mail or Electronic Communication. Any vote of the Members may be conducted by mail or electronic communications, if and when legally permitted, as determined by the Board of Directors. Article IV. Board of Directors Section 1. General Powers. The affairs of the Corporation shall be managed by its Board of Directors, which may also be called a Board of Trustees. The Board may adopt such rules and regulations, not inconsistent with the Certificate of Incorporation or the Bylaws or applicable laws, as it may deem proper for the conduct of its meetings and the management of the Corporation. Section 2. Delegation of Authority. The Board of Directors may delegate by resolution duly adopted in accordance with Sections 14 and 15 of this Article IV, to any one or more committees established pursuant to Sections 2 and 3 of Article VI or to any officers or employees of the Corporation, the power to exercise any portion of the authority of the Board of Directors in the management of the Corporation, provided that any delegation of authority shall require the committee or person to which Board authority is so delegated to provide egular and timely reports on their exercise of that authority. Such delegation shall not operate to relieve the Board of Directors, or any individual Director, from any responsibility imposed upon the Board or such individual by law. Futher, any delegation may be rescinded at the disgretion of the Board, and the Board reserves the right to amend or cancel any action of a committee or person to which any authority has been delegated, in the best interests of the Corporation. No Director or officer of the Corporation shall have any power to bind the Corporation of act on its behalf except as expressly set forth in these Bylaws or by resolution of the Board of Directors. Section 3. Number. The number of Directors shall be not fewer than three nor more than fifteen, not counting ex officio members, such number to be determined from time to time by resolution duly adopted by the Board of Directors. Section 4. Designation of Directors. The Board of Directors shall be constituted with a view toward representing the broad diversity of interests among the nation’s designers. Each Director shall be at least eighteen (18) years of age. Section 5. Classification and Tenure of Directors. (a) The Directors shall be classified with respect to the period during which they shall severally hold office, by dividing them into three classes, with the term of office of one class expiring each year. At each annual election, the successors to the class of Directors whose terms shall expire in that year shall be elected to hold office for the term of three years, so that the term of office of one class of Directors shall expire in each year, except as otherwise provided in this Article IV. (b) Any Director may be reelected for one additional consecutive term. A Director who has completed two consecutive three-year terms may not be elected for an additional term, except after an intervening period of at least one year; provided that service as a Director to complete an unexpired term upon election to a vacancy, shall not constitute a “term” for purposes of this Section 5(b). Section 6. Ex Officio Directors Ex officio Directors may be determined from time to time by resolution duly adopted by the Board of Directors. Ex officio Directors shall be invited to serve by the Board of Directors in order to represent their position or organization for a term coincident with their official position in the organization represented or otherwise to serve the interests of the Board. The Chapter Presidents’ Council Chair shall serve as a voting ex officio Director as long as the Chair remains the Chair of the Chapter Presidents’ Council. Section 7. Disqualification of Directors. A Director who ceases to be a Member shall be disqualified thereby from continuing to serve as such a Director immediately upon such cessation. A Director who is unable to attend more than two consecutive meetings of the Board may be disqualified thereby from continuing to serve as such a Director at the time of the third consecutive meeting which they have not attended, unless, in the opinion of the Board of Directors, it is in the interest of the Institute to retain that Director on the board. Section 8. Vacancies. Any vacancy occurring in the Board of Directors and any position to be filled by reason of an increase in the number of Directors, may be filled by the Board of Directors by a vote of no fewer than 2/3 of the Directors then in office from among a slate of one or more qualified candidates nominated by the Nominating Committee most recently appointed in accordance with Section 9 of this Article IV. A Director elected to fill a vacancy shall be elected for the unexpired term of their predecessor in office or for a term to be determined by the Board of Directors, not to exceed three years. A current member of the Board may be extended for up to two years under this Section 8, if that extension can be justified in the specific interests of current and planned Corporation activities and if the extension would not cause the maximum number of Directors defined in Section 3 to be exceeded. Section 9. Nominating Committee; Election of Directors by Ballot (a) Not less than one hundred fifty days before April 1 of each year, the President of the Board of Directors shall appoint a Nominating Committee with the approval of the Board. The nominating committee Members will consist of six Members who will serve for two years, with half of the six Members rotating off each year. It shall be the duty of the Nominating Committee to select and nominate a slate of candidates for all Director positions to be filled. In selecting the Members of the Nominating Committee, the President shall give consideration to the objective of including Members at large. Half of the committee Members shall have served on the previous year’s Nominating Committee. Any current Board Members appointed to the Committee shall be Members who are not eligible for a possible extension of their term nor a possible candidate for the President. (b) In making nominations, the Nominating Committee shall consider each potential nominee’s experience and qualifications and shall make such nominations as shall assure representation on the Board of Directors of individuals representing with leadership capacity and broad engagement in the issues of relevance to the Corporation. The candidates nominated need not be selected from the roster of the Members, nor design professionals, nor residents of the State of New York. (c) No later than one hundred and twenty days before April 1 of each year, the Nominating Committee shall send to each Member eligible to vote an invitation for Members to recommend candidates for consideration by the Nominating Committee and a description of the criteria being considered by the Nominating Committee. (d) The Nominating Committee shall propose to the Board a list of candidates for new Directors that consists of the number of available openings on the Board. The Board shall approve a slate of new directors from among the nominees on the list of candidates submitted by the Nominating Committee. The Election of nominees for all Director positions to be filled shall be held by electronic or internet polling which shall be sent to each Member eligible to vote not less than thir"
