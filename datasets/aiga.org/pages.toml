full_description = "AIGA and Phaidon Present: Designing Phaidon Books with Julia Hasting, Creative Director As Creative Director at Phaidon, the premier global publisher of the creative arts, Julia Hasting oversees the making of more than 50 unique books per year — many of which she also designs. Spanning creative disciplines from art and architecture to fashion and food, Phaidon’s illustrated books are treasured worldwide for their outstanding content and award winning design and production. In this virtual event, Lee-Sean Huang will interview Hasting about all things publication design and creative direction, with examples including Phaidon’s critically-lauded “WA: The Essence of Japanese Design,” the bestselling “Where” series, and the beloved monograph “Ettore Sottsass.”"
