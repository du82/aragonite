["https://aiga.org/competitions-initiatives/aiga-awards"]
title = "AIGA Awards | AIGA"
full_description = "Membership & Community AIGA Awards AIGA is dedicated to demonstrating the value of design. Founded in 1914, the national organization, its members, and its chapters in cities across the United States, recognize those who have made a significant impact to the field of design and are giving back to the community through their work. Nominations are now closed. Please check back for updates on future nomination cycles! Join AIGA Learn More AIGA Medal AIGA Corporate Leadership Award Steven Heller Prize for Cultural Commentary AIGA Fellows Recognizing Excellence in Design and Designers For More Than A Century Nominations for the AIGA Medal, AIGA Corporate Leadership Award, and the Steven Heller Prize are now closed. Join AIGA Overview Through national and regional peer nominations, AIGA honors design leaders, forward-thinking companies, and those who have inspired engaging commentary about design and culture. Each year, committees and panels assemble to review nominations and identify individuals and companies doing excellent work now. National Awards AIGA Medal AIGA Corporate Leadership Award Steven Heller Prize for Cultural Commentary AIGA Medal AIGA Medal The medal of AIGA—the most distinguished honor in the profession of communication design—has been awarded since 1920 to individuals in recognition of their exceptional achievements to the advancement of the field of design as respected craft, strategic advantage, and vital cultural force. Medals have been awarded to individuals who have set standards of excellence over a lifetime of work or have made individual contributions to innovation within the practice of design. Learn More AIGA Corporate Leadership Award AIGA Corporate Leadership Award Established in 1980, the AIGA Corporate Leadership Award recognizes the role of perceptive and forward-thinking organizations that have been instrumental in the advancement of design by applying the highest standards as a matter of practice and policy. Learn More Steven Heller Prize for Cultural Commentary Steven Heller Prize for Cultural Commentary Established in 2017, the annual Steven Heller Prize for Cultural Commentary spotlights a individuals who best exemplifies the tradition of prolific writing and boundless curiosity established by Steven Heller—who has contributed and inspired engaging commentary about design and culture for the past three decades. This award celebrates critical thinking about design and the profession, and encourages development in the next generation of design voices through a variety of media (book authors, editors, critics, reporters, copywriters, bloggers, podcasters, radio/video content creators, or filmmakers). Learn More Featured Chapter Awards AIGA Atlanta Fellow Award Learn More AIGA DC Fellow Award Learn More AIGA Minnesota Fellow Award Learn More AIGA San Francisco Fellow Award Learn More Follow Us Nominations Nominations Now Closed Nominations are now closed. Please check back for updates on future nomination cycles! Support a vibrant community! Your support makes our work possible. Donate Now More Scholarships & Competitions AIGA Worldstudio Scholarships Scholarships are awarded annually to encourage social and environmental responsibility and cultural awareness in the next generation of artists and designers. Learn More 50 Books | 50 Covers A time-honored tradition, this competition aims to identify the 50 best-designed books and 50-best book covers of the year. Learn More 365: AIGA Year in Design For agencies big and small as well as those going it alone, we're recognizing excellence and representing innovation across all categories of communication design, from print to web to service to spaces—both physical and virtual. Learn More Related readings and videos Norman Munder AIGA Medalist Who is Norman Munder, AIGA’s First Medalist? Fans of the great American printer include Frederic W. Goudy Corita Kent AIGA Medalist How to Fight the Power with Joy, a Lesson From Corita Kent In a time of political toxicity and divisiveness, what can we learn from the famed activist, nun, and graphic designer? Gail Anderson AIGA Medalist Design Legend Gail Anderson Answers Your Questions About Where Designers Should Live, Racism in the Workplace + Creating Social Impact “For a designer of color embarking on their first big design job, I’d say take a deep breath.” Pablo Ferro AIGA Medalist You’re Influenced by Film Title Designer Pablo Ferro and You Probably Don’t Even Know It From Dr. Strangelove to Beetlejuice and Men in Black, Ferro’s exciting work spawned a generation of bold experimenters Luis Fitch AIGA Fellow Luis Fitch | 2008 Gain Conference An esteemed Hispanic creative director, Luis Fitch has led award-winning branding efforts for top Fortune 500 companies including Target, Mervyn’s, Frito-Lay, Nash-Finch Company, Josten’s, Kimberly-Clark and MTV Latino. Elaine Lustig Cohen AIGA Medalist Celebrating Elaine Lustig Cohen, the Creative Polymath With an Unusual Path to Fame Lustig Cohen didn’t find professional success until after the death of her renowned husband. Now, we look back at her wide-reaching influence across disciplines. Lucille Tenazas AIGA Medalist + AIGA Fellow AIGA San Francisco Fellow Series Louise Sandhaus Interviews Lucille Tenazas: Fellow Series Gere Kavanaugh AIGA Medalist Gere Kavanaugh’s “Radically Upbeat,” Distinctly West Coast Style Didn’t Just Come Out of California California designer, American spirit"
