["https://aiga.org/membership-community/aiga-membership"]
title = "AIGA Membership | AIGA"
full_description = '''Membership & Community AIGA Membership AIGA offers you deep personal connections with creative professionals in your community and across the nation. By joining AIGA, you are supporting a network of creative changemakers, problem solvers, and design industry leaders. Join Now More About Membership Membership FAQs Member Special Offers Group + Corporate Membership About AIGA Chapters AIGA Community A Dynamic Community As an AIGA member, you will receive access to benefits including professional development, continuing education on a local and national level, discounted rates to exclusive programs and events, access to virtual webinars, leadership opportunities, special members-only savings — and unique connection opportunities with a network of mentors, influential designers, design educators, and industry leaders. Membership Benefits Professional Development Membership in AIGA provide opportunities to grow your skills and take your career to the next level. Take advantage of member-exclusive discounts to events, the AIGA Design Conference, AIGA Professional Design Certification, and Certificates for Creatives. Access to AIGA Community AIGA Members receive access to the new AIGA Community, a new virtual space to connect with AIGA Members from around the world. AIGA Community is a resource to share experiences and ideas that will inspire design discussions for designers of all levels. Leadership Opportunities Develop your leadership skills by volunteering for your local chapter, serving on task forces and committees, and recommend nominees for our awards programs. Students can also explore the realm of design beyond the classroom and take on leadership roles by joining their on-campus AIGA Student Group. Resources & Inspiration Gain free access to all of our resources, including designer toolkits, legal guides, and sample legal contracts. Get inspired by viewing popular conference talks or exploring our vast archive of design collections going back to the 1920's. Savings & Discounts Enjoy valuable savings and discounts on popular products and services from our partners. Receive member-exclusive discounts on AIGA resources and programming. Job Opportunities Benefit from access to complete job listings on AIGA Design Jobs and save up to $300 on job postings that will reach thousands of skilled AIGA designers. How to Join Find your community Every member is a member of both the AIGA national organization and one or more of the 60+ local chapters of their choice. Located internationally or just too far from an existing chapter? Choose "Member-At-Large" as your primary chapter during sign up.Find a chapter near you. Select a membership type We offer memberships for students and designers of all types and experience levels. See membership types below. Sign up for membership online The fastest way to membership is to create an online account and sign up online. During this process, we will ask if you are a student or an educator or if you have particular areas of interest. This will ensure that you benefit from any applicable discount and receive relevant communications from us. Membership Levels *Each AIGA Chapter is a wholly independent and self-sustaining 501(c)(3) organization. Some chapters may charge a separate nominal membership fee, which is paid directly to the chapter to support local programs. Any applicable chapter fees are clearly indicated in the payment process before you checkout. Student $50 /year A full-time K-12 student, or any full-time college or university undergraduate or graduate student enrolled in a two- or four-year program in design, visual communications, or related field of study. Emerging $150 /year A new designer who is one to four years past graduation or any new practitioner with less than a total of four years experience in the industry.**Members only qualify for this category for a maximum of four years. Professional $250 /year A design or related industry professional with five or more total years in practice. Leader $500 /year A professional designer, industry-adjacent leader, arts supporter, or firm owner who opts to make a greater investment in AIGA and the future of the profession. Educator $200 /year A full-time educator in design or related field of study in a K-12 school, college, or university. *Each AIGA Chapter is a wholly independent and self-sustaining 501(c)(3) organization. Some chapters may charge a separate nominal membership fee, which is paid directly to the chapter to support local programs. Any applicable chapter fees are clearly indicated in the payment process before you checkout. Join Now View our Group Membership Rates Read Our Membership FAQs Give the Gift of Membership A membership to AIGA makes the perfect gift for the designer in your life! Gift a Membership Read our membership FAQs for common questions about membership to AIGA. Get Involved Sign up for the AIGA Monthly Newsletter Get the latest in AIGA news, resources, competitions, and events. Learn more Explore Free Resources We empower designers through resources curated for creatives. Explore Attend an Event Explore upcoming events to network with designers nationally and locally. See events'''
