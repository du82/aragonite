title = "Business Perspectives for Creative Leaders | AIGA"
full_description = "Professional Development AIGA Business Perspectives for Creative Leaders Registration closes January 3, 2025 This executive education program, in partnership with Yale University, is designed to equip creative leaders to meet the challenges of management and give participants the skills and perspectives they need to reach the next levels in their careers. Instead of teaching management topics in separate, single-subject courses, Yale’s experienced faculty teach an integrated curriculum providing business frameworks and concepts in a rich, relevant context. Register Now! Use code AIGA for 15% off “I found the experience one of the most fulfilling and meaningful experiences of my professional and academic career.” Debbie Millman Founder and Host, Design Matters Podcast About Business Perspectives for Creative Leaders In 2008, Yale School of Management launched a program built for creative professionals, empowering them as leaders and educating them in business. Through a partnership with AIGA, Business Perspective for Creative Leaders (BPCL) was formed. Acting as the perfect blend of business and design, BPCL has since expanded to include a wide, rich network of architects, graphic designers, industrial designers, developers, and other creative professionals, all pushing the boundaries of their leadership potential in order to move themselves and their respective organizations forward. In this program, design-industry professionals broaden their management skills to complement their deep creative abilities and become well-rounded senior leaders. They strengthen strategic thinking to better tackle high-impact opportunities and drive innovation for growth. They develop soft skills to better influence, persuade, and negotiate with colleagues and clients. In addition, they learn how to lead change and learn the basics of accounting and finance to communicate better with their financial team. Participants have come from some of the most highly regarded firms in the industry, such as Google, Adobe, Microsoft, Nickelodeon, and MTV. Learners leave connected to a creative network of professionals who share a passion for leadership and innovation. Watch the Open House 2025 Program Program DatesRegistration closes: January 03, 2025Start date: January 30, 2025Register Now Program DetailsLength: 6 weeks, roughly 20 hoursCommitment: 5 – 6 hours weekly plus 3 – 4 hours of pre-workFee: $5,850Outcome: Develop managerial and leadership expertise to drive innovation, influence colleagues, and lead teams.This program is offered in a live, online format to create a highly engaging environment where participants are an active part of the program. Participant profile galleries within our learning platform enable learners to discover what they have in common with others. Break-out activities bring small, varied groups of people together in meaningful ways. Unique networking activities drive social connection with other passionate professionals to deepen learning and many of these budding connections bloomed into lasting relationships. Come immerse yourself in both content and networking with our live online delivery.Download the Program Brochure Curriculum The Yale Management curriculum is designed to accomplish two goals: first, to instill a general competency in meeting the challenges of management; and second, to facilitate the creative leaders’ development of their own personal career aspirations. Instead of teaching management topics in separate, single-subject courses, Yale teaches core subjects in an integrated way, providing frameworks and concepts in a richer, more relevant context. Faculty Rodrigo Canales Faculty Director James N. Baron William S. Beinecke Professor of Management, Yale School of Management Norman Bartczak Lecturer in the Discipline of International and Public Affairs, Columbia School of Public and International Affairs Michael Bierut Partner, Pentagram Heidi Brooks Senior Lecturer in Organizational Behavior Daylian Cain Senior Lecturer in Negotiations and Ethics, Yale School of Management Zoë Chance Assistant Professor of Marketing, Yale School of Management Emma Seppälä, Ph.D Lecturer in Management “If you’re a designer who wants to understand how business works—for both you and your clients—this [program] will change your life.” Michael Bierut Partner, Pentagram Design Next Steps Cancellation Policy Non-Discrimination Policy Next Steps Visit the registration page to start your application. Interested applicants will also need to submit: A current résumé A statement of intent explaining why you are applying to this program, how your experience has prepared you to enter this program, and how it will benefit you professionally Both documents can be uploaded as either a PDF or word document. Professional achievement and organizational responsibility are the main criteria for admission. There are no previous formal education requirements for admission. Acceptance is subject to the approval of Yale faculty members and AIGA leaders. Applications are reviewed in the order they are received, and you can expect to be notified within 1-2 weeks from submitting a completed application. Cancellation Policy There are no refunds for cancellations, since AIGA has no flexibility in the number of attendees we must provide to justify Yale’s investment in the curriculum development. Substitutions are subject to approval according to the selection criteria for the program. The program is subject to cancellation or change. Liability is limited to funds remitted for program registration and sponsorship fees. Faculty is subject to change without prior notice. If there are fewer spaces than qualified candidates, some applicants may be deferred until the following year’s program. Non-Discrimination Policy Yale is committed to a policy against discrimination based upon age, color, handicap or disability, ethnic or national origin, race, religion, religious creed, gender (including discrimination taking the form of sexual harassment), marital, parental or veteran status, sexual orientation, or the prejudice of clients. All employers using the school’s placement services are required to abide by this policy. “This program was just perfect. I’ve made connections that will last a lifetime and useful skills I’ve already applied to my day-to-day professional life.” John Militello Principal, Longblink"
year_published = 2025
