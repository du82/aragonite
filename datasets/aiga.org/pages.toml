["https://aiga.org/design/design-leadership"]
title = "Design Leadership | AIGA"
full_description = '''Design Design Leadership We help designers navigate the complexity of leading a design team, running a creative department, or owning a design studio. Through volunteer leadership opportunities, resources, and webinars, we can help you become a successful design leader. Join AIGA More Resources Professional Development Get Certified! Ascend to the next level in your career with the AIGA Professional Design Leader Certification. This new certification gives you the knowledge, tools, and credentials to achieve personal career growth as a design leader. Learn More Leadership Challenges for Designers Challenges in design leadership are complex and unique to the design industry. According to the AIGA Design Point of View Research Initiative, the key challenges experienced while leading designers are: Design solutions / Creating stronger concepts; Attention to detail; Time management; Productivity management; and Aligning the team around a vision. Through programs, initiatives, and learning, we empower designers to tackle these leadership challenges. Learn More about the Design POV AIGA Certificate for Creatives We asked, you told us—professional development and lifelong learning are critical for design professionals and to advance the profession Learn More Explore: Design & Leadership Article Listen and Members Tell You What You Need AIGA leaned into the power of data to find what mattered most to its members. EoD Editor's Pick Women Make Up Over Half the Design Industry—So Why Are There So Few at the Top? A conversation with some of the most formidable women in design who are working to give others a leg up. Talk Design Leadership: Developing a Roadmap Three creative leaders on their experiences working with clients, internal and external stakeholders, to getting buy-in, establish a plan, and execute their ideas. Leadership in Action: AIGA Fireside Chats Listen: Full Series Listen, learn, and be inspired. Join us for a series of talks with industry leaders helping to innovate and design the future. Listen on Apple Podcasts Kayo Roehm, 3M "I believe our future is held by the relationship between design and data." Listen Dantley Davis, Twitter "What excites me most about the future of design...the early career designers who are getting their sea legs. They have so much energy and are connected to culture and community." Listen Ben Williams, R/GA “Design allows us to carve the future that we want. Design can be that glimmer of hope. We can design systems that work better and for more people.” Listen Keep In Touch with AIGA Sign up for email communications to be the first for updates on webinars, events, programs, and announcements. Subscribe Leadership Course Business Perspectives for Creative Leaders The Business Perspectives for Creative Leaders curriculum presented by Yale School of Management is designed to equip creative leaders to meet the challenges of management and to give participants the skills and perspectives they need to reach the next levels in their careers. Learn More More to Explore Change It, Don’t Change It Keira Alexandra debuted Work-Order’s redesign of Kodak’s iconic logo at the conference. Sometimes it’s not a logo redesign, she says, but a brand reset. Watch Now Leadership Is THE Strategic Issue Today, as the country elects a new leader, consider the role of design leaders, too. Farson urges designers to see the world as CEOs do. Read More Whitepaper: Resilient Organizations This paper is intended to inform design professionals and educators of processes and concepts addressed by successful design practices. See the Report There Is Value In Membership Join today to access networking through your local chapter and a wide variety of local and national programs and events. Join AIGA'''
