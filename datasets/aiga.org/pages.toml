title = "Bibliographies | AIGA"
full_description = "Academic & Design Education Bibliographies These bibliographies for design educators and students address an eclectic array of topics: Cognition and Emotion, Cultural Studies, Design Planning, Education and Learning Theory and Interaction and New Media Design. Download Cognition and Emotion Bibliography The Cognition and Emotion Bibliography, compiled by Liz Sanders (Ohio State University), presents references from psychology and anthropology that refer directly to design practice and education. Download Cultural Studies Bibliography Andrew Blauvelt (North Carolina State University) brings together art history, identity politics and literary criticism among others in the Cultural Studies Bibliography to explore the multidisciplinary nature of modern cultural studies and design. Download Design Planning Bibliography In the Design Planning Bibliography , Ewan Duncan (Illinois Institute of Technology) explores the emerging field of design planning while integrating approaches from business strategy, social science research and design prototyping. Download Education and Learning Theory Bibliography Meredith Davis (North Carolina State University) covers a range of topics such as research on teaching and design experience in K-12 classrooms in the Education and Learning Theory Bibliography. Download Interaction and New Media Design Bibliography In Interaction and New Media Design Bibliography , Jessica Helfand (Yale University and New York Unversity) looks at new media through exploration of a wide variety of topics such as architectural theory, ethics and technology."
