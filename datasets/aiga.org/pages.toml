["https://aiga.org/competitions-initiatives/aiga-worldstudio-dd-scholarships"]
title = "AIGA Worldstudio D×D Scholarships | AIGA"
full_description = "Professional Development AIGA Worldstudio D×D Scholarships AIGA believes all students deserve access to design education. The AIGA Worldstudio D×D Scholarships aim to increase diversity in the design profession by creating equitable opportunities for the next generation of creative talent. Scholarships are awarded annually to students enrolled at colleges and universities in the U.S. who demonstrate a commitment to positive social change, environmental responsibility, and cultural awareness through the practice of visual communication, including photography, illustration or graphic design. Apply for a 2025-2026 Scholarship Contribute to the Scholarship Program AIGA Worldstudio D×D Scholarships Featured Work Work by Blanquita Sullivan. Graduate Student, Maryland Institute College of Art (MICA). AIGA Worldstudio Scholarship - Illustration and Design Contiuum Fund - AIGA DC View the Gallery The AIGA Worldstudio Scholarship will allow me to enter my senior year without the worry of paying my tuition out of pocket. I can solely focus on completing my senior thesis, rather than juggling work, my studies, and the most important project of my college career. Jonai Gibson-Selix AIGA Worldstudio DxD Scholarship Recipient #AIGATogether Show your support for the next generation of creative talent! Donate 2024–2025 Scholarship and Honorable Mention Recipients Since the inception of the AIGA Worldstudio Scholarship program in 1995, more than $1.4 million dollars has been awarded to more than 840 college students of art and design. Each student has demonstrated talent along with a commitment to giving back to their community through their work. They are creating books that present and embody the mostly-forgotten native Filipino language; exploring topics surrounding ethnical identity, embracing black designers who are responsible for much of our fashion, culture, and trends today and applying it to school magazine spreads; advocating for cultural, ethnic, sexual, and gender identity; situating representations of social injustices and resilience within intimate, reform-driven pieces; volunteering digital media support for anti-oppression organizations; using art as a way to heal, relate, and re-imagine the life around us; and more. We announced last year's winners in the video below, which originally aired at the 2024 AIGA Design Conference. Don't be afraid to get lost in the weeds of making and producing design work for yourself based on your interests or creators that you admire. There is so much value in finding THE passion in what drives your curiosity that I encourage the indulgence of trial and errors. Your small discoveries can lead you to find some buried through lines and unexpected influences that are totally worth further investigation. David Jon Walker Designer, Rhealistic Design /Associate Professor, Austin Peay State University 2024–2025 Jurors Thank you to the 2024-2025 jurors featured below. Stay tuned for the announcement of our 2025-2026 jurors. Illustration Antonio Alcala Founder and Creative Director, Studio A; Art Director, USPS, Stamp Development Communication Design Antionette Carroll President and CEO (Founder), Creative Reaction Lab and Institute of Equitable Design & Justice Illustration Alyah Holmes Illustrator & Designer Illustration Dian Holton Art Director Communication Design Womo Iyegha Product Design Leader, Intuit WorldStudio Tom Koken Designer, Worldstudio / Worldstudio Foundation Communication Design Doug Powell Executive Design Leader, former IBM & Expedia WorldStudio Mark Randall Associate Dean + Assistant Professor, Parsons School of Design Strategies; Founder + Creative Director, Worldstudio Communication Design Sadie Red Wing Assistant Professor in Faculty of Design OCAD U Photography Neebin Southall Communications Writer, Institute of American Indian Arts Communication Design Omari Souza Assistant Professor, University of North Texas Communication Design Kelly Walters Founder, Bright Polka Dot; Assistant Professor, The New School This scholarship has also shown me that my endeavors to create cultural bridges through my artwork and scholarship are valid. This is the first step in my journey as an academic and I am very grateful to AIGA for making this opportunity possible. Kofi Bazzell-Smith AIGA Worldstudio DxD Scholarship Recipient Increasing Access to Design Education for More Than 25 Years Your support has an immediate and lasting impact; it provides an opportunity for undergraduate and graduate students from underrepresented and economically disadvantaged backgrounds with positive social agendas to achieve their educational goals and give back to communities through their work. Donate I'm attracted to design, particularly interaction design, for its ability to combine art and engineering and psychology into one discipline that can create quantifiable social change. I want to leave the world a better place than I found it, and as a designer, I feel like I can do that. Olivia Quesada AIGA Worldstudio DxD Scholarship Recipient Building Partnerships With A Vibrant Community The National Partnership Program is about leadership, relevance, and impact—with, within, and through design—to build and sustain programs, initiatives, and resources that champion a more contemporary and inclusive profession. Learn More"
