["https://aiga.org/competitions-campaigns"]
title = "Competitions & Initiatives | AIGA"
full_description = "Professional Development Competitions & Initiatives AIGA’s design competitions celebrate exemplary design and demonstrate the power of effective design. Competitions call for entries now open! 50 Books | 50 Covers This survey of book design represents perhaps the longest-standing legacy in American graphic design. Beginning in 1923, the AIGA Fifty Books of the Year competition was a yearly mainstay. A time-honored tradition, this celebration of books design aims to identify the 50 best-designed books and the 50-best designed book covers of the year. call for entries now open! 365: AIGA Year in Design A famed competition, redefined for today's designer. Announcing the return of 365: AIGA Year in Design–celebrating your passion, hard work, and dedication. For agencies big and small as well as those going it alone, we're recognizing excellence and representing innovation across all categories of communication design, from print to web to service to spaces—both physical and virtual. Get Out the Vote Call for Posters Open AIGA Design For Democracy Design for Democracy is based on the premise that good design makes your choices clear. Scholarships 2024 Call for Applications Closed AIGA Worldstudio D×D Scholarships AIGA Worldstudio D×D Scholarships benefit underrepresented and economically disadvantaged students who are studying photography, illustration, and design disciplines in colleges and universities in the United States. Scholarships are awarded annually to encourage social and environmental responsibility and cultural awareness in the next generation of artists and designers. Awards AIGA Awards Through national and regional peer nominations, AIGA honors design leaders, forward-thinking companies, and those who have inspired engaging commentary about design and culture. Each year, committees and panels assemble to review nominations from the design community and identify individuals and companies doing excellent work now. Pay it Forward! Volunteer to serve on an AIGA Review Panel AIGA assembles panels of jurors and committees for its annual awards and competitions. Panels are composed of AIGA members and nonmembers and are key to reviewing competition entries, scholarship applications, and award nominations. Most panels are composed of design professionals and/or design educators who are qualified by their training, skills, and experience to represent the design profession and the greater design community today. AIGA considers geographic location, discipline/specialization, race and ethnic diversity, gender, age, and other factors that shape creative perspective and professional experience. As individuals and as a group, each panel provides guidance about the work submitted and recommends finalists. AIGA maintains a database to help us identify and select panelists for annual awards and competitions. Information collected may be shared with our 70+ AIGA local chapter leaders who have access to and share our resources. AIGA does not share this database or its information with third parties. Responding to some of the profile questions is voluntary. By completing this process you improve your chances of being invited to serve based on our needs, but does not guarantee an invitation to serve on a panel in the current year or in the future. To avoid a conflict of interest, jurors who have already submitted work to a competition/program they are invited to judge/review will be asked to withdraw their work (encouraged) or recuse themselves from voting on and advocating on behalf of their work. Through special dispensation, jurors will be eligible to enter work into the next year's call for entries/submissions. Panelists may also be recommended by AIGA board, committee, and staff members. All panelists must have an my.aiga.org account with AIGA to be eligible to serve. Login to update your AIGA profile account info, including: Career Information, Current Skills, Skills Interested in Developing, and Directory Information. Don't have an AIGA account? Create an account for free. Email [email protected] and include your name, title, company, city and state/country. Candidates who are a good fit for an AIGA panel will receive an invitation from AIGA by email. Please whitelist emails from @aiga.org. Update Your Profile to Volunteer Read About 50 Books | 50 Covers What Goes Into Designing an Award-winning Book Cover? For these 50 Books 50 Covers winning designers, it’s all about bold typography, texture, and a ton of wit. Read More The 50 Books | 50 Covers Winners are Here! You’re just 50 titles away from a better-looking bookshelf. Read More Shimmer, Neon, Nature—Here are the Trends That Have Defined the Year In Book Cover Design This winners of this year's 50 Books | 50 Covers competition are a bold bunch. Read More"
