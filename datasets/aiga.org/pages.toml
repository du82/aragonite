title = "Professional Development | AIGA"
full_description = "Professional Development AIGA supports designers at every stage, from students to seasoned professionals. Explore AIGA Professional Design Certification Get certified as an AIGA Professional Designer or AIGA Design Leader. AIGA Design Conference Join us for AIGA’s national gatherings of designers for learning and professional growth. Events Register for nationally and locally sponsored events, offered online and in-person. Executive Education Offered in partnership with Yale University, the Business Perspectives for Creative Leaders program equips design leaders with management skills. Competitions Learn more or enter your work to 50 Books | 50 Covers, 365: AIGA Year in Design, and more. Academic Scholarships Learn about scholarship opportunities for underrepresented and economically disadvantaged students in creative fields. Learning Directory Browse AIGA's Learning Directory to find the perfect program for you. Certificates for Creatives Join our online learning platform that offers on-demand courses. In this section Select a page AIGA Professional Design Certification AIGA Design Conference Events Executive Education Competitions Academic Scholarships Learning Directory Certificates for Creatives Learning Opportunities for all Career Stages For Students + Emerging Designers AIGA Membership Learn More Scholarships Learn More AIGA Design Conference Learn More For Professional Designers AIGA Professional Designer Certification Learn More Certificates for Creatives Learn More AIGA Competitions Learn More For Design Leaders AIGA Design Leader Certification Learn More Business Perspectives for Creative Leaders Learn More AIGA Design Conference Learn More Get Certified! AIGA’s online design certification program is open to design practitioners at every level who are committed to expanding their careers and the profession in all design modalities, including but not limited to graphic design, visual communications, interactive and web design, and UI/UX. Learn More Get Your Learning Journey Started Get Certified with AIGA Are you ready to grow your practice and differentiate yourself in a competitive marketplace? Download our free course catalog to dive deeper into the types of AIGA certification, steps to get certified, course descriptions, and portfolio assessment rubric for testing. Chart Your Learning Path If you're looking to take your design career to the next level but don't know where to start, booking a Learning Consultation with the AIGA Learning Team is the perfect first step. We will work with you to identify your strengths, areas for improvement, and goals, and help you choose the type of learning that's right for you. Browse the Directory Browse AIGA's Learning Directory to find the perfect program for you. Our extensive range of courses, certifications, and executive education programs cover everything from core design skills to real-world challenges, ensuring you have the knowledge and expertise to succeed in today's industry. Start your learning journey today and unlock your full potential. Keep in Touch with AIGA Sign up for email communications to be the first for updates on webinars, events, programs, and announcements. Subscribe There Is Value In Membership Join today to access networking through your local chapter and a wide variety of local and national programs and events. Join AIGA"
