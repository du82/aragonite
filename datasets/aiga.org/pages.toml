["https://aiga.org/resources/h1b-and-o1-work-visa-application-letters"]
title = "H1B and O1 Work Visa Application Letters | AIGA"
full_description = "Resources H-1B and O-1 Visa Application Letters for International Designers In order to qualify to work in the United States, you must obtain a written advisory opinion from an appropriate union or professional association confirming you are an individual of extraordinary ability in the field of Design. Read more to learn how AIGA can help support your next career step. Join AIGA Request an INS Letter Work Visa Requirement for International Designers The U.S. Citizenship and Immigration Services recognizes AIGA as an authority on documenting the qualifications of prospective visa applicants in terms of their communication design credentials, achievement and distinction. As a benefit of membership, AIGA assists in documenting the professional status and requirements of designers in an application for U.S. visas and work papers. These documents are called Consultation Letters, Advisory Opinion Letters, No Objection Letters, or INS Letters. We are committed to supporting you in this journey. Read our Frequently Asked Questions below for more information. Frequently Asked Questions What is a consultation letter? According to the USCIS, a consultation letter (also known as an Advisory Opinion Letter, No Objection Letter, or INS Letter) is from a U.S. peer group, labor organization, and/or management organization and is required for certain visa classifications. The purpose of a labor consultation letter is to determine whether artists from other countries, who are applying for a work visa in the United States, have the artistic ability and expertise to qualify for visa eligibility. The absence of the letter could alter an applicant’s case negativity. Who is eligible for a consultation letter from AIGA? AIGA offers letters in support of all designers working in communication design, graphic design, design education, research, web design, motion design, and more. In order to obtain a no objection letter for an O-1, O-2 and H-1B petition, the applicant must be a registered member paid in full for the year.Join AIGADownload the Request Form What are the requirements for a consultation letter? In order to obtain a no objection letter for an O-1, O-2 and H-1B petition, the applicant must be a registered member paid in full for the year. The applicant must also submit the attached request form, processing fee, and their resume and portfolio. Materials to submit: Membership payment (via my.aiga.org) Attached request form with payment for processing fee: $250 standard time (5-7 business days), $300 expedited service (1-3 business days) A resume or digital portfolio Download the Request Form What are the supported visa types? H-1B Visa According to the American Immigration Council, The H-1B is a temporary (nonimmigrant) visa category that allows employers to petition for highly educated foreign professionals to work in “specialty occupations” that require at least a bachelor’s degree or the equivalent. Jobs in fields such as mathematics, engineering, technology, and medical sciences often qualify. Typically, the initial duration of an H-1B visa classification is three years, which may be extended for a maximum of six years. O-1 Visa According to U.S. Citizenship and Immigration Services, The O-1 nonimmigrant visa is for the individual who possesses extraordinary ability in the sciences, arts, education, business, or athletics, or who has a demonstrated record of extraordinary achievement in the motion picture or television industry and has been recognized nationally or internationally for those achievements. The O nonimmigrant classification are commonly referred to as: O-1A: Individuals with an extraordinary ability in the sciences, education, business, or athletics (not including the arts, motion pictures or television industry); O-1B: Individuals with an extraordinary ability in the arts or extraordinary achievement in motion picture or television industry; O-2: Individuals who will accompany an O-1 artist or athlete to assist in a specific event or performance; and O-3: Individuals who are the spouse or children of O-1 and O-2 visa holders. What is the cost and timeline of a consultation letter? The cost for a letter is $250 standard time (5-7 business days) and $300 expedited service (1-3 business days). If you need an updated letter within a year of the previous, we can do so for a fee of $50. Please complete the request form, enclose the processing fee, attach design credentials, and return to [email protected]. Download the Request Form Can I expedite my consultation letter? Yes! Our normal processing time is 5-7 business days. We provide expedited service of 1-3 business days for an additional $50 fee. Please complete the request form, enclose the processing fee, attach design credentials, and return to [email protected]. Download the Request Form Who should I contact if I have additional questions? Please contact [email protected]. Additional Resources Working in the United States (U.S. Citizenship and Immigration Services) H1-B Specialty Occupations (U.S. Citizenship and Immigration Services) O-1 Visa: Individuals with Extraordinary Ability or Achievement (U.S. Citizenship and Immigration Services) Employment-Based Visa Categories in the United States (American Immigration Council) Download the Consultation (Advisory Opinion) Letter Request Form Requesting a letter is easy. Download our simple request form to receive a letter in as little as one business day. Download Research & Insights Insightful Research for the Design Community The AIGA Design POV represents a broad set of research components including in-the-moment pulse check surveys, in-depth qualitative interviews, a robust online survey, and triangulation of data from various other sources to provide insights into the current topics impacting the design community and create resources that can be used to better understand needs. Learn More Join Our Dynamic Creative Community As part of the largest professional membership association for design, you'll receive access to exclusive member resources, virtual courses, network-building and thought-provoking conferences, and an international network of design professionals. Your AIGA membership is an investment in yourself, your profession, and a network of creative changemakers, problem solvers, and innovators. Join Today"
