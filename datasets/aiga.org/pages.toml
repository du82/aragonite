title = "Online Design Collections | AIGA"
full_description = "Inspiration Online Design Collections Explore a selection of our online collections and discover the rich history of American communication design. These visual and educational collections help showcase the value of design in the community. Click through each collection to better understand the impact design can have on your world. Become a Member Increase Your Support Recent Juried Competition Selections Design Competitions Explore recent winner's galleries from our famed international design competitions. COMPETITIONS 2022 50 Books | 50 Covers of 2022 This time-honored competition aims to identify the 50 best-designed books and book covers of 2021. Jurors include: Ramon Tejada, Rob Giampietro, Renata Graw, and Xiaoqing Wang, and Andrew Satake Blauvelt (chair). COMPETITIONS 2021 365: AIGA Year in Design (2021) 365: AIGA Year in Design recognizes excellence and represents innovation across all categories of communication design, from print to web to service to spaces—both physical and virtual. Jurors include: Rafael Esquer, Min Lew, Clement Mok, Nakita Pope, Jan Wilker, and Ken Fox (chair). COMPETITIONS 2021 50 Books | 50 Covers of 2021 This time-honored competition aims to identify the 50 best-designed books and book covers of 2021. Jurors include: Laura Coombs, Brian Johnson, Kimberly Varella, and Silas Munro (chair). COMPETITIONS 2020 50 Books | 50 Covers of 2020 This time-honored competition aims to identify the 50 best-designed books and book covers of 2020. Jurors include: Jennifer Morla, Paul Sahre, Kelly Walters, and Gail Anderson (chair). COMPETITIONS 2019 50 Books | 50 Covers of 2019 This time-honored competition aims to identify the 50 best-designed books and book covers of 2019. Jurors include: Hilary Greenbaum, Lisa Lucas, Silas Munro, and Michael Bierut (chair). COMPETITIONS 2018 50 Books | 50 Covers of 2018 This time-honored competition aims to identify the 50 best-designed books and book covers of 2018. Jurors include: Daphne Geismar, Lucinda Hitchcock, Henk van Assen, and Jessica Helfand (chair). Curated Exhibitions Online Exhibitions AIGA partnered with Google Cultural Institute to present three curated online-exhibitions. With a focus on Diversity, Equity & Inclusion and Design for Democracy, these collections can be viewed from the comfort of home. Diversity, Equity & Inclusion 2017 Across Borders: A Look at the Work of Latinx Designers Selected from AIGA's Design Archives, Design Journeys, and video archives this collection focuses on and celebrates the contributions of Latinx designers to the field of communication design during the last fifty years. Design For Democracy 2016 AIGA Get Out the Vote 2016 A collection of posters by AIGA leaders across the U.S. representing Get Out the Vote 2016, the latest campaign of AIGA Design for Democracy. Learn more and download your favorite posters. Diversity, Equity & Inclusion 2016 African American Culture and History: An AIGA Design Journy Selected from AIGA's Design Archives and Design Journeys series, this collection celebrates African American history and culture throughout the last century of communication design. Design Excellence AIGA Medal The medal of AIGA has been awarded since 1920 to individuals in recognition of their exceptional achievements to the advancement of the field of design. AIGA Awards 1950, 1969, 1970–2019 AIGA Medalists Essays A catalogue of essays about the life and work of AIGA Medalists. See their work and learn more about their unique and outstanding contributions to the profession. AIGA Awards 1972, 1979, 2010–2019 AIGA Medalists Videos A catalogue of videos about the unique and outstanding contributions of AIGA Medalists. Be inspired by their stories. AIGA Design Archives AIGA Design Archives represents the quality of work being created, as well as shifting aesthetics and sensibilities of the designers of the day. This rich online resource features more than 20,000 selections from AIGA’s design competitions dating back to 1924, as well as special collections of historic works from major American design firms and practitioners. View the work and learn more about the collections, including selections that are housed at the Denver Art Museum, at Explore the Archives Recent Campaigns Get Out the Vote This civic engagement initiative wields the power of design to motivate the American public to register and turn out to vote in the general election, as well as local elections to come. DESIGN FOR DEMOCRACY 2022 AIGA Get Out the Vote 2022 In partnership with Nonprofit VOTE and the League of Women Voters, this collection is part of AIGA Get Out the Vote, an AIGA Design for Democracy initiative to increase civic participation through design. In 2022, members of AIGA design a posters to help increase voter registration and voter turn out during the midterm elections. DESIGN FOR DEMOCRACY 2020 Get Out the Vote: Empowering the Women's Vote In partnership with the League of Women Voters, this online collection recognizes the centennial of the ratification of the 19th Amendment, granting women the right to vote in 1920 with a special edition of Get Out the Vote: Empowering the Women’s Vote. This online collection of posters commemorates the first legislation for women’s voting rights. DESIGN FOR DEMOCRACY 2020 AIGA Get Out the Vote 2020 In partnership with Nonprofit VOTE, this collection is part of AIGA Get Out the Vote, an AIGA Design for Democracy initiative to increase civic participation through design. In 2020, members of AIGA were invited to design a poster. Curated Series Curated Series A selection of online collections exploring the history of design and the profession. Diversity, Equity & Inclusion 2020–2021 Hispanic Heritage Talks 2020 Curated by AIGA Unidos, a multi-chapter collaboration, this collection highlights Hispanic and Latinx creatives sharing their stories and work. Listen to conversations with creatives from different backgrounds and disciplines. Diversity, Equity & Inclusion 2019–2021 Beyond the Bauhaus Beyond the Bauhaus is a series that attempts to widen the canon of design education by highlighting design contributions from underrepresented cultural and social groups. Read the essays authored by members of the AIGA Design Educators Community (DEC). AIGA Eye on Design 2014–present Design History 101 Design History 101 is a collection of articles exploring the people, places, and objects that have impacted the design profession and our daily lives. Read the insightful words by AIGA Eye on Design editors, writers, and cultural commentators. DIVERSITY, EQUITY, INCLUSION 2008–2018 AIGA Design Journeys A curated collection of 40 poignant stories about the professional lives, contributions, and portfolios of traditionally under-represented designers—contemporary and historical. Documenting the Shifting Aesthetics and Sensibilities of the Design Community for More Than a Century AIGA’s archives and special collections identify, preserve, and make available works of enduring value. Your support makes it possible to increase access to resources, support research, and elevate the diverse and impactful stories of design and designers. Donate Related content Professional Development 50 Books | 50 Covers Membership & Community Diversity, Equity & Inclusion Membership & Community Design for Democracy Inspiration AIGA Archives & Special Collections"
