["https://aiga.org/governance/board-responsibilities"]
title = "Board Responsibilities | AIGA"
full_description = "Governance Board Responsibilities The board of directors is an elected body that holds the institution in trust for AIGA members past, present, and future, with a guiding principle of leaving the institution stronger at the end of each director's term than it was at the beginning. About Board Responsibilities The Board's special responsibility is to see that the Executive Director, who serves as CEO, is managing the association in a manner that responds to the expressed needs of members, and anticipated needs of the future profession. AIGA's Board is a working board, actively participating in leadership and governance, however, the Board does not serve in an operational or managerial role. Board members of AIGA are committed to a variety of obligations and responsibilities. Most of these are traditional in nature and are listed here. However, one obligation warrants special attention. Each board member is expected to maintain an AIGA membership at the highest level they are able for the duration of their term Primary Activities of National Board Members The national Board helps to define and redefine AIGA's evolving vision, reviews and approves operational policies from year-to-year, and reviews and approves the annual budget. National Board members are expected to act as brand ambassadors for AIGA during their term of service, and after their service. In general terms this means: Supporting the organization's vision of a community of design advocates and practitioners that advances design as a professional craft, strategic advantage and vital cultural force by connecting practitioners, enthusiasts and patrons; advocating for the value of designers and design in business, government, media and the public; enhancing professional development; defining standards and ethical practices; inspiring designers and the public; establishing criteria for design education that meets the needs of the profession; making powerful tools and resources available and accessible; celebrating and enhancing the value of design; and upholding and strengthening our values of diversity, equity and inclusion Balancing future orientation with appreciation of AIGA’s past legacy and evolving vision Developing and maintaining active communication with the design community, acting as an advocate for AIGA and the organization’s vision, policies, and programs Attending national and local AIGA events and being accessible at those events: listening to members, supporting and encouraging dialogue with the chapters, regions, councils and task forces Keeping Board leadership and professional management informed of any issues raised by members or chapter leaders, while retaining an objective role in representing the Board and management's positions in conversations with members and chapter leaders Encouraging colleagues to become active members of AIGA, and encouraging AIGA membership whenever possible Setting an example for other professionals by giving through the fundraising options available to the AIGA membership Actively participating in Board Committee work to support AIGA's goals and objectives: Committees have clear charters tied to the strategic plan and are key elements of the Board’s structure, providing all members with focused work and responsibilities Board Committee Chairs work in coordination with each other through the Executive Committee and support full board participation in decision-making In addition to Board Committee work, Board members are also called on to help secure adequate resources for the activities of the organization, which may mean assisting AIGA staff with sales outreach or fundraising, contributing money or time to AIGA events or programs, or making valuable introductions between AIGA staff and personal contacts to leverage larger sponsor relationships Board members must: Review and approve fiscal policy and boundaries, including budgets, and financial controls, and approve operational policies for AIGA's general course from year to year Know the provisions of the organization's charter, Constitution and Bylaws, and policies, and ensure that they are being followed Select, evaluate, appoint and, if necessary, terminate the Executive Director Assist in raising adequate resources for the activities of the organization Board members should not: Engage in the day-to-day operation of the organization or make detailed programmatic decisions more appropriately left to staff Direct, evaluate or hire staff other than the Executive Director Make any commitment of AIGA staff or financial resources except with the prior authorization of the full Board and the Executive Director Make any offer or commitment to allow exceptions to AIGA policies Time and Travel Commitments of National Board Members The national board has a monthly conference call that typically ranges from one to two hours. While not all monthly calls are designated as official board meetings, for which attendance is required, board members are encouraged to participate in every call and meeting. For both the calls and the official meetings, board members should schedule sufficient time in advance to review the call agenda and supporting materials to assure active, informed participation. Supporting materials can often be substantial, consistent with the fiduciary and governing responsibilities of a board of an established national institution. Whenever possible, materials will be provided no later than a week before the scheduled meeting. The national board holds regular in-person meetings three to four times each year. While participation by conference call is possible, in-person attendance is preferred. Board members are expected to make their own travel and lodging arrangements, and to cover their own travel and event registration costs to the extent possible. In order to encourage a diverse Board, some members' participation at in-person meetings may be subsidized from time to time. Incoming Board members will participate in either an in-person or virtual orientation session in early July. The session provides new directors with an overview of the organization, board work and responsibilities, and Board Committee activities and participation, and is designed to encourage their full engagement in the board. The board typically schedules in-person meetings to take place adjacent to any national events. In such cases, Board members should schedule time to attend both the board meeting and the events one of which is the AIGA Leadership Retreat. Occasionally, but not always, the board will schedule additional in-person meetings, in which case the date and location will be determined. If a board member misses actively participating in two consecutive official board meetings, the Board President and Board may ask them to step down. Financial Obligations of National Board Members Each national board member is expected to maintain an active AIGA membership at the highest level that they are able for the duration of their board service. As stated above, Board members usually cover their own travel and accommodations costs for all in-person board meetings (typically three to four per year). While AIGA may be able to offer preferential hotel rates for some of these meetings, it will be up to board members to book their own rooms and cover all hotel costs as well as flights, and travel expenses to the extent possible. National board members are expected to attend and support national AIGA events by purchasing an event registration and actively participating in the event and its promotion. Accountability Guidelines In general, the following guidelines are recommended for nonprofit organizations to reduce liability by strengthening the accountability of the board—board members should: Attend all in-person Board meetings and participate in monthly Board calls Support the organization's goals, objectives, and programs Read Board agenda and supporting materials prior to each Board meeting to assure active, informed participation Ensure the organization keeps permanent records of all board minutes and official actions Be certain the organization is fulfilling all aspects of its nonprofit and tax exempt status Know the budget, budget process, and financial situation of the organization Pursue the warning signs that something is wrong, and inquire if there is something you do not understand, or if something comes to your attention that causes you to question a policy or practice. Leadership is often defined as having answers, or taking charge, however, one of the most important forms of leadership that Board members undertake is simply to ask substantive questions Insist on meaningful Board meetings with full disclosure of operating results Communication and transparency: good communication is a key to effectiveness. Board members are encouraged to ask hard questions and get honest and complete answers Know and build relationships with the directors and officers of the organization and Board colleagues: Boards are social groups and each has its own distinctive culture. Boards that work well have incorporated governance and personal initiative into their organizational culture. They have enthusiasm, momentum, and flexibility. Effective leadership boards foster environments where directors trust and respect one another, communicate clearly and often, know their organizations well, care deeply about mission, and understand their legal and moral responsibilities, respect is crucial. Respect among the current Board for each other and for the Executive Director comes from acknowledging and honoring their mutual responsibilities for their work and for the organization. The AIGA Board should be a group that each member is proud to be part of Learn from conflict and constructive debate: willingness and ability to work through conflict strengthens the Board and the organization. The ability to disagree productively is one sign of a strong board culture. Constructive debate and dialogue results in decisions that are more fully thought out; diverse perspectives are encouraged Require the organization to engage competent legal counsel See that the organization maintains good credit and financial standing Review the organization’s insurance program Review and authorize appropriate indebtedness for major programs and contracts Adopt and follow sound business policies and practices Avoid conflicts of interest for the organization and its members Build high expectations into the culture; there are clear expectations that service to the board is a serious and demanding job There Is Value In Membership Join today to access networking through your local chapter and a wide variety of local and national programs and events. Join AIGA"
