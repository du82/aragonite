title = "The Bookshelf | AIGA"
full_description = "Design The Bookshelf Explore the latest contemporary topics, references and thinking in design, art, business, and culture from our publishing partners. Friends of AIGA receive exclusive discounts to collect and explore new titles for their book collections. Explore book discounts from AIGA Partners below! Photo: Stefan Sagmeister's book Now is Better, Phaidon Press AIGA Discount Save 25% at Artbook.com Artbook offers 25% off on their catalog of books on art, photography, design, architecture, film, music and visual culture. Explore more from Artbook below. Discount automatically applied. * If you are having trouble seeing the discount, use code AIGAMEMBER25 AIGA Discount Save 15% at GingkoPress.com Friends of AIGA receive 15% off their purchase at Gingko Press using code AIGA15! With cutting-edge collections on typography and graphic design alongside visually stunning lifestyle titles, there is something for every creative. AIGA Discount Save 20% at Phaidon.com Receive 20% off your purchase with code AIGA24 (Excludes signed and limited editions). Explore a selection of Phaidon books below. Featured Book Selections Infographic DesignGingko PressInfographics provide graphic visual representations of information or knowledge intended to present data quickly and concisely to a broad swath of users. Infographic Design explores the building blocks of infographics and data visualization starting with a brief history of the discipline followed by an examination of the most common contemporary approaches to visual representation. Use code AIGA15 for 15% off Seasons Greetings: Charming Holiday Cards from Paul RandArtbookAmerican graphic designer Paul Rand (1914–96)—a titan of midcentury design—is best known for the logos he created for companies such as IBM, UPS, ABC and many more. In addition to his commercial work, he was a dedicated letter writer. This set reproduces a selection of 24 holiday cards by Paul Rand held by the Letterform Archive collection. Some were made for friends and family, while others were hand-painted as commissions. Taken together, they represent an exciting and unseen facet of Rand’s oeuvre. Now available as a boxed set, you can send these carefully reproduced versions of Rand’s darling notecards to your own loved ones this holiday season. Use code AIGAMEMBER25 for 25% off I love it. What is it?Phaidon PressNo other design company has worked with as many significant brands as Turner Duckworth, the company behind the visual identities of Amazon, McDonald’s, Coca-Cola, and Metallica. I love it. What is it? showcases Turner Duckworth’s philosophies, learnings, and adventures from more than three decades of working with major brands and presents the firm’s inside scoop on what makes successful brands tick. Use code AIGA24 FOR 20% off Keep in Touch Subscribe to our email list to stay up to date on all AIGA offerings, including book events, new releases, and exclusive AIGA book discounts. Sign Up Featured Title, Milton Glaser: POP From 1954, when he co-founded the legendary Push Pin Studios, to the late ’70s, Milton Glaser was one of the most celebrated graphic designers of his day, whose work graced countless book and album covers, posters, magazine covers, and advertisements, both famous and little-known. Glaser largely defined the international visual style for illustration, advertising, and typeface design and interest in his legacy continues unabated, with modern creatives acknowledging his influence. Use code AIGA24 for 20% off Browse More Books Artbook Selections AIGA Discount Save 25% at Artbook.com Artbook offers 25% off on their catalog of books on art, photography, design, architecture, film, music and visual culture. Explore more from Artbook below. Discount automatically applied. * If you are having trouble seeing the discount, use code AIGAMEMBER25 Use code AIGAMEMBER25 Ellen Lupton Bauhaus Typography at 100 The Bauhaus looms large as one of the most influential legacies in 20th-century graphic design. Known for its bold sans-serif typefaces, crisp asymmetrical grids and clean use of negative space, the school emerged as the forebearer of a new look—one that seized the tools of mass production in the creation of a radical new art. Use code AIGAMEMBER25 Earthquakes, Mudslides, Fires & Riots Earthquakes, Mudslides, Fires & Riots is the first publication to capture the enormous body of distinctive and visually ecstatic graphic design that emanated from California throughout most of the twentieth century. Use code AIGAMEMBER25 How Many Female Type Designers Do You Know? A pioneering appraisal of female typographers, with historical research and interviews with contemporary practitioners. This important new book surveys the past and present of women working in typography. Gingko Press Selections AIGA Discount Save 15% at GingkoPress.com Friends of AIGA receive 15% off their purchase at Gingko Press using code AIGA15! With cutting-edge collections on typography and graphic design alongside visually stunning lifestyle titles, there is something for every creative. Use code AIGA15 Victionary A Book on Books From scrolls and sheets of papyrus to elaborate and expensive codices to the mass press-printed volumes as we know them today, books have come a long way since writing was first developed. A Book on Books showcases some of the best book design work from all over the world in celebrating the designers’ contributions to preserving reading culture, as they continue to make books eye-catching and exciting to read or own. Use code AIGA15 Tobias Revell + Hannah Stouffer Computer Generated Computer Generated represents a holistic, big picture view of contemporary, independent, artist-driven CG and features 210 artists from 39 countries. The collection takes a deep dive into the movement and showcases a cross-section of work from some of the most innovative, imaginative and influential contemporary CG creators. Use code AIGA15 Sarah Hyndman Why Fonts Matter Graphic designer Sarah Hyndman specializes in exploring how fonts influence us as type consumers; Why Fonts Matter synthesizes Hyndman’s 20 years of experience as graphic designer with her typographic research and the findings of experimental psychologists and neuroscientists. Phaidon Selections AIGA Discount Save 20% at Phaidon.com Receive 20% off your purchase with code AIGA24 (Excludes signed and limited editions). Explore a selection of Phaidon books below. Use code AIGA24 Annie Atkins Fake Love Letters, Forged Telegrams, and Prison Escape Maps A behind-the-scenes look at the extraordinary and meticulous design of graphic objects for film sets Use code AIGA24 Rossella Menegazzo, Stefania Piotti, Kenya Hara WA: The Essence of Japanese Design Through some 300 objects this book explores contemporary Japanese design: from everyday objects and packaging to interior design and lighting elements. Ultimately the book aims to explore the way in which Japanese design manages to harness its materials and at the same time combines respect for tradition with forward-thinking and experimentation. Use code AIGA24 Phaidon Editors Phaidon Archive of Graphic Design Born of the traditions of fine art and printing, graphic design is a form of visual communication that seeks to inform, identify or promote through the combination of word and image. But unlike the written word or a work of art, a graphic design operates exclusively in the context in which it will be seen, and mediates between the wishes of the client and the expectations of the public. Our Partners There Is Value In Membership Join today to access networking through your local chapter and a wide variety of local and national programs and events. Join AIGA"
