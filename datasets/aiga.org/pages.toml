["https://aiga.org/governance"]
title = "Governance | AIGA"
full_description = "Our Story Governance AIGA, the professional association for design, is a nonprofit professional membership organization founded in 1914 and headquartered in New York City. As a volunteer membership association, the energy and efforts of volunteer members are central to our mission. Our governance structure helps ensure that we stay focused on supporting our volunteer members. AIGA Board of Directors AIGA is governed by a board of directors that is accountable to the membership as a whole. The board consists of professionals from design and other fields and reflects a broad cross section of the profession in terms of design disciplines, geographic locale, ethnicity and gender. All board members serve in a volunteer capacity. Meet our Board of Directors Role of AIGA Chapters Local chapters are the fabric of AIGA, providing programming and services attuned to the needs of members in their area. Following a federated model, every chapter is a separately incorporated, nonprofit corporation with its own board of directors and bylaws. Chapter boards are led by dedicated volunteers and offer tremendous organizational leadership opportunities for local AIGA members. View our Chapter Directory Presidents Council The Presidents Council comprises all currently active presidents in good standing at local AIGA chapters. The Presidents Council connects the work of local chapters with national communities, councils, and task forces, as well as the AIGA Board and its Staff. The Presidents Council is led by a Chair and an Incoming Chair who serve staggering two-year terms. Meet our Presidents Council Chair National Committees & Task Forces AIGA has numerous other committees and task forces serving to adjudicate awards programs or to address a specific issue. Meet our committees More information Constitution & Bylaws of AIGA Board Responsibilities Board Conflict of Interest Policy Board Nominations & Committee Next Up Board of Directors"
