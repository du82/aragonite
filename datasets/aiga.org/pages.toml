title = "Community Values & Standards | AIGA"
full_description = "Membership & Community Community Values & Standards Our Commitment to Diversity AIGA, the professional association for design, is committed to creating an inclusive environment where diverse voices are active in all aspects of our organization. This requires a culture of inclusion in which all individuals feel respected and are treated fairly, and different viewpoints, opinions, thoughts, and ideas are encouraged and embraced. Read the statement Code of Conduct This policy is designed to clearly communicate our standards of behavior for our members and the process for reporting violations of these standards. We are committed to having an inclusive community embracing different perspectives and viewpoints. And we are equally dedicated to providing a safe and productive experience for everyone who participates in AIGA and to treating everyone with respect. Read the statement Standards of Professional Practice A professional designer adheres to principles of integrity that demonstrate respect for the profession, for colleagues, for clients, for audiences or consumers, and for society as a whole. Read the statement AIGA Position on Spec Work AIGA believes that professional designers should be compensated fairly for their work and should negotiate the ownership or use rights of their intellectual and creative property through an engagement with clients. Read the Position Statement Professional Standards of Teaching Serving as a complement to AIGA's Standards of Professional Practice, the AIGA Professional Standards of Teaching 1.0, define the expectations of a design educator and represent the distinction of an AIGA member teaching design. Read the document AIGA Internship Pledge AIGA supports the Fair Labor Standards Act and is proud to share the AIGA Philadelphia Chapter's statement in support of the ethical treatment of students and professional designers in the workplace. Read the document"
