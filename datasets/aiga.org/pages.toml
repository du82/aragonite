["https://aiga.org/our-story"]
title = "Our Story | AIGA"
full_description = "Our Story AIGA brings design to the world, and the world to designers. As the profession’s oldest and largest professional membership organization for design—with more than 70 chapters and more than 15,000 members—we advance design as a professional craft, strategic advantage, and vital cultural force. Join AIGA AIGA Year in Review Next Up Governance What We Do AIGA advocates for a greater understanding of the value of design and designers in government, business, and media. We inspire designers and the public by sharing the most exciting design work and engaging in thoughtful, provocative discussion on pressing issues. We aim to enhance professional development through enriching learning opportunities at all levels. Learn more about our membership and community Value of Design From content that defines the global practice to events that connect and catalyze, we work to enhance the value and deepen the impact of design across all disciplines on business, society, and our collective future. We do this by defining global standards and ethical practices and making powerful tools and resources accessible to all. Find professional resources Our History AIGA was founded in 1914 as a small club of graphic artists, printers, publishers and illustrators in New York City. Since then, the design community has evolved into a nationwide network of professional designers, educators, students and design enthusiasts served by more than 70 chapters. From our early history advocating for industry standards to launching journals and exhibitions, we continue to look to the future, to innovate, and to change the way we interact with the world around us. View our historical timeline Your Support Through meaningful programs and initiatives, we strive to enhance the design profession and empower designers. Your support today helps us continue this important work into the future. See the ways you can contribute There Is Value In Membership Join today to access networking through your local chapter and a wide variety of local and national programs and events. Join AIGA"
