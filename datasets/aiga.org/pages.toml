title = "Resources | AIGA"
full_description = "Resources We are committed to advancing the future of design within our communities, among our members, in small businesses and corporations, in educational institutions, and for individuals. Please use this community resource hub as a guide to some of the most critical needs our community faces today, and will face in the future. Need additional resources not listed? Contact us at [email protected] to start the conversation. Explore AIGA About AIGA Membership AIGA Professional Design Certification AIGA Eye on Design Design Teaching Resource AIGA Worldstudio Scholarships Competitions & Awards I am looking for resources about... Design Education & Academia Through the work of the Design Educators Community (DEC), we support education throughout the arc of a designer’s career. Image features Graduate Research Posters curated by the DEC. Learn more AIGA Professional Design Certification The AIGA Professional Design Certification represents a commitment to the design profession and to lifelong learning. This new online design certification program is open to design practitioners at all every level. Learn more Running a Design Business These resources, tailored to creative services small businesses, have been created to help you plan, manage, and operate your design firm more effectively. Photo: Omar Sosa in his Chinatown studio, photography by Zach Pontz. Learn more Mental Health for Designers Taking care of your mental health is important to stay balanced and centered. Explore resources to help you breathe through the stressful moments. Artwork by Kaitlyn Mason, from the AIGA Member Gallery Learn more Design Opportunities for Students Students, Recent Graduates, and those transitioning into the design field. Illustration by Caroline Rock Learn more AIGA Certificates for Creatives We asked, you told us—professional development and lifelong learning are critical for design professionals and to advance the profession. These new certificates the first step in building the AIGA learning portfolio. Learn more There Is Value In Membership Join today to access networking through your local chapter and a wide variety of local and national programs and events. Join AIGA Next Up: Inspiration AIGA Webinars Explore our free-to-members webinar offerings, and learn from the comfort of your own home with live and recorded sessions. Explore Design Archives & Collections Our archives and special collections identify, preserve, and make available works of enduring value to elevate the diverse and impactful stories of design and designers. Browse Inspiring Talks Enjoy our selection of talks for designers ranging from the history of branding to tax management. View Talks"
