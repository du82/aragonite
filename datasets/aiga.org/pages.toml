["https://aiga.org/2024-aiga-design-conference-faqs"]
title = "2024 AIGA Design Conference FAQs | AIGA"
full_description = '''2024 AIGA Design Conference FAQs AIGA Design Conference Office hours for support are 9:00 a.m.–5:00 p.m. ET (Monday-Thursday), 9:00 a.m.–1:00 p.m. ET (Fridays)Please be mindful of these times near deadlines. Emails received after 5:00 p.m. ET and prior to midnight the day of a deadline will be reviewed and resolved the following morning and registrations/refunds will be honored. If contacting AIGA, emailed is preferred.We are a small, but mighty team. We will respond in the order emails are received. Thank you in advance for your patience! Registration What is your cancellation policy? Conference rates are based on membership status at the time of registration. Memberships are non-transferable.2024 AIGA Design Conference tickets are nonrefundable.Sessions will be recorded and available to watch after the event. Am I eligible for the educator rate? We offer a discounted rate to active members at the Educator level. Click here to learn more about membership. Am I eligible for the student rate? We offer a discounted rate to active members at the Student level. Click here to learn more about membership. How can I advocate for my professional development and convince my boss there is value in my attendance at the AIGA Design Conference? There is value in AIGA membership, including discounts to the AIGA Design Conference. Use our Convince Your Boss letter to advocate for your professional development (and don’t forget to put in a good word for your colleagues too!). Can I volunteer at the Design Conference? AIGA is not recruiting conference associates for the 2024 AIGA Design Conference. AIGA will recruit current members to serve as volunteer conference associates to help in on-site event management at the 2025 AIGA Design Conference in Los Angeles. Conference associates work approximately 30 hours throughout the conference, and are able to attend conference sessions for free when not working. Can I pay for my conference registration via check or offline credit card? If you prefer to register by mail or pay offline with the assistance of an AIGA representative, an invoice can be created by request: please email [email protected]; a $25 per-person conference registration processing fee applies. Will conference sessions be available to watch later? All 2024 AIGA Design Conference sessions will be recorded and available to watch after the event. How do I become a conference speaker? For the 2024 AIGA Design Conference, we're seeking proposals that resonate with our theme for this year: "MARGINS." Margins represent spaces of opportunity, challenge, and innovation. Whether it's standing out in a crowded market, centering marginalized communities, embracing experimentation and failure, or redefining success, Margins encapsulates a spectrum of possibilities for design.We invite industry professionals, educators, and graduate students to submit proposals that connect with this theme.Proposals are due May 15, 2024. You can submit a proposal here. Learn More AIGA Design Conference'''
