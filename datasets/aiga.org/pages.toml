["https://aiga.org/media/press-releases/365-aiga-year-in-design-winners-announced-for-2023"]
title = "Press Releases | 365: AIGA Year in Design Winners Announced for 2023 | AIGA"
description = "AIGA Celebrates the Innovation and Inspiration of the Design CommunityNew York, NY—AIGA, the professional association for design, is pleased to announce the winners of 365: AIGA Year in Design, a 360-degree view of design over 365 days. The competition celebrates designers, design teams, and their clients for effectively working together to design creative solutions for challenges presented by businesses and organizations during the calendar year 2023."
full_description = '''New York, NY—AIGA, the professional association for design, is pleased to announce the winners of 365: AIGA Year in Design, a 360-degree view of design over 365 days. The competition celebrates designers, design teams, and their clients for effectively working together to design creative solutions for challenges presented by businesses and organizations during the calendar year 2023. This competition recognizes excellence and represents innovation across all categories of communication design, from print to web to service to spaces—both physical and virtual. With 506 entries from more than 26 countries around the globe, including the United States, Canada, Singapore, Australia, Taiwan, Germany, Greece, Netherlands, Mexico, Colombia, Georgia, Kenya, Japan, United Kingdom, and more, this year’s jurors selected 54 entries that represent excellence in design. "The jury’s selections from the 365: AIGA Year in Design competition provides a snapshot about the state of graphic design. In the pluralistic context of design today it's difficult to pinpoint trends or to see what stylistic traits are popping up, much less any traces of regionalism. But the competition format still yields strong work happening in a lively mix of categories”, said Abbott Miller, 365: AIGA Year in Design Chair. “Brand design is by far the largest category and this year's results reaffirm the extent to which typography is playing such a defining role in building strong brands. The exhibition design category also had some outstanding and ambitious projects that show how graphics and spatial design can support one another. The jury conversations led us to formulate a strong criteria about evaluating craft and innovation and context in our decisions about which projects belonged in the final selections. Thanks to all the designers and organizations that submitted work in the spirit of getting a chance to see what we have all been doing and where we are headed." AIGA thanks this year’s panel of esteemed jurors: Abbott Miller (chair), Partner, Pentagram; Dan Vlahos, Design Leader and Educator, Dan Vlahos Design, AIGA Boston and Merrimack College; Heather-Mariah Dixon, Partner, Creative Director, Overeasy; Jarrett Fuller, Partner, Assistant Professor of Graphic and Experience Design, North Carolina State University College of Design; Podcast Host, Scratching the Surface; Lucille Tenazas, Henry Wolf Professor of Communication Design, Parsons School of Design; and Anna Kulachek, Art Director, Graphic Designer, KULACHEK.'''
