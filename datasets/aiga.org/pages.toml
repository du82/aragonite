["https://aiga.org/perspectives/aiga-eye-on-design"]
title = "AIGA Eye on Design | AIGA"
full_description = '''Perspectives AIGA Eye on Design Presents: What It Means to Be a Designer Today What It Means to Be a Designer Today Reflections, Questions, and Ideas from AIGA’s Eye on Design Edited by Liz Stinson and Jarrett Fuller AIGA’s Eye on Design presents a provocative collection of essays and interviews that cover a wide-reaching examination of the profession of design today and its impacts on society and culture. Join AIGA Read the AIGA Eye on Design Archive Order Your Copy Amazon Barnes & Noble Books-A-Million Bookshop Amazon UK Indigo (CA) About the Book Eye on Design is an editorial platform from AIGA that has, for the last decade, covered the ins and outs of the design industry. From documenting bold new work from global designers to chronicling the field's most critical issues, their reported stories, op-eds, interviews, and conversations help designers make sense of the world and place their profession within a broader context. Weaving together original and previously published content from some of the most important writers in today’s design conversation, this book for designers encapsulates wide-reaching topics that strive to answer an essential question: What does it mean to be a designer today?Organized into three parts—Reflections, Questions, and Ideas—this book covers the most pressing issues and provocations that designers face in our current world, including:• The evolution of personal branding• Teaching design history• The cult of minimalism• The perils of hero worship• Designers’ role in conspicuous consumption• The meaning of visual sustainability• And more Contributors include the book's editors, Liz Stinson and Jarrett Fuller, and such outstanding design writers as Rick Poynor, Anne Quito, Briar Levit, Cliff Kuang, and many more. Accessible, engaging, and conversational, What It Means to Be a Designer Today is an enduring resource and vibrant gift book that speaks to design students and educators, working designers of all levels, and anyone interested in graphic design. About the Authors Liz StinsonLiz Stinson is a journalist and editor. She has covered the intersection of design, culture, and business for publications including WIRED, Fast Company, Architectural Digest, and more. She lives in Brooklyn, NY. Jarrett FullerJarrett Fuller is a designer, writer, educator, editor, and podcaster. He is an assistant professor of graphic design at North Carolina State University and the host of the podcast Scratching the Surface. He lives in Raleigh, NC. Advance Praise "Writing about graphic design is mistakenly perceived as a niche theme for practicing designers. Eye On Design proves that what it means to be a graphic designer has relevance for everyone interested in visual culture-which is just about everyone."– Steven Heller, Former Editor, AIGA Journal of Graphic Design "AIGA's Eye on Design has always been, to me, a refreshing outlier in the design-writing world. Honest, incisive, and important, its reporting rejected the adulation typical of the field, seeking out reality instead. This book speaks to its title statement with the publication's signature creativity and care-for its subject and its readers-capturing enduring ideas that may well impact us all."– Tiffany Jow, Editor-In-Chief, Untapped "Graphic design is a slippery, squishy blob. Is it dead or alive? Is it everywhere or nowhere? These smart, plucky essays show how graphic design oozes between disciplines, adding shimmer and shine to anything in its path."– Ellen Lupton, Author, Thinking with Type "From the start, Eye on Design has been committed to finding new voices in design, uncovering stories no one else noticed, and detecting the faint heartbeats of soon-to-be major trends. I find myself returning to it again and again."– Michael Bierut, Partner, Pentagram Order Now Amazon Barnes & Noble Books-A-Million Bookshop Amazon UK Indigo (Canada) Read the Stories Behind the Book Eye on Design publishes stories that cover the issues important to the global design world through untold histories, reported features, and op-eds. Our goal is to elevate the voices of contemporary designers as a way to build a more engaged and conscientious design community. Read More Explore AIGA Eye on Design How Can Designers Address Power Inequity? Start Small and Focus on the Local A look at the community-oriented practices of Bastion Agency, Nontsikelelo Mutiti, Nat Pyper, and Suzy Chan. The CIA Has Always Understood the Power of Design The agency's trendy rebrand isn't the first time it has used design to spread its message. Some Foundries Want to Restrict Usage of Their Fonts on Ethic Grounds Clauses written into licensing agreements could help designers have more control over their work. How Polished Branding Is Shaping the Next Generation of Public Parks Borrowing from the design language of startups, public spaces are positioning themselves as both destination and consumable experience. What Does It Mean to Decolonize Design? Writer Anoushka Khandwala dismantles design history 101. Glowy, Gauzey Graphics are the Self-help Books of the Instagram Age A new generation of graphic designers are using the medium to process our relentless age of anxiety. When Did Generic Grocery Store Branding Get So Good Looking? Private labels have gone from budget branding to minimal chic. You can thank consumer data for that. Prem Krishnamurthy on Design as a Generous Discipline For the designer, curator, and active preserver of design legacies, “design is inherently a facilitating discipline.”'''
