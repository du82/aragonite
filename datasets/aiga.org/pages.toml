description = "“Mentorship” is one one of those warm fuzzy words. We know we want it. We know it’s a good thing. But what exactly does mentorship mean, and how do we make it work for our own unique needs? How can we be more effective mentors and mentees? We explore these questions in this special edition of the AIGA Design Podcast. We also do a deep dive into AIGA NY’s Mentorship Program  to understand what it takes to structure and sustain meaningful professional relationships."
