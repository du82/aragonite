["https://aiga.org/membership-community/design-for-democracy"]
title = "Design for Democracy | AIGA"
full_description = "National Committees & Task Forces Design for Democracy Design for Democracy is based on the premise that good design makes your choices clear. Join us in 2024 to help get out the vote in your community for crucial midterm elections. GOTV posters designed by AIGA members are available for printing and public distribution by all. Learn More Join AIGA Learn More View Poster Gallery Add your own or download and print! Non-partisan Guidelines Nonprofit VOTE League of Women Voters Vote411.org In The News Hear what nonprofit leaders across the country have to say about voter advocacy Watch Now About AIGA Design for DemocracyStarting in 1998, AIGA’s oldest initiative has the mission to apply design tools and thinking to increase civic participation. By making interactions between the U.S. government and its citizens more understandable, efficient, and trustworthy, designers become more vocal citizens and make democracy more sound.In 2024, we continue to advocate for civic engagement through voter education, registration, and access. We turn design skills and aspirations into tangible actions that can make a difference. Important Dates for the 2024 Presidential Election August Voter History Month Sept 17 National Voter Registration Day Oct 7-11 National Voter Education Week Oct 29 Vote Early Day Nov 5 Election Day Call for Entries Poster Gallery Join AIGA Design for Democracy, Nonprofit Vote and the League of Women Voters to get out the vote for this year’s midterm elections. Submit your poster to our Creative Commons gallery and help educate and promote participation in shaping who represents us in the governor's office and our state and national legislatures. Learn More Resources Top 10 Election Design Guidelines These guidelines are derived from AIGA Design for Democracy’s best practices report on behalf of the U.S. Election Assistance Commission (EAC), “Effective Designs for the Administration of Federal Elections.” Learn More Top 10 Ballot Design Tips (for designers) This list is intended to orient new ballot designers to the complex U.S. ballot design landscape. Learn More Election Design History and Resources AIGA has increased the efficacy of ballots and election materials, serving U.S. election officials, election designers, and citizens nationwide. Learn More Talks Talk 2020 Get Out the Vote Get Out the Vote: Empowering the Women's Vote A conversation with Nancy Skolos, Kelly Salchow MacArthur, Kelly Walters, Maggie Bush, and Frances Yllana. Talk 2012 Gain Conference Design for Democracy Learn how you can get involved: Increase civic participation and help make interactions between the U.S. government and its citizens more understandable, efficient and trustworthy. Talk 2020 Get Out the Vote Get Out the Vote: Defense Against Disinformation A conversation with Marc Ambinder, Andre Banks and Deepthi Welaranta. Be Inspired by 2022 Get out the Vote Poster GalleriesAIGA has activated its community of designers across the U.S. and beyond to Get Out the Vote every four years since 2000. The campaign is part of Design for Democracy, an AIGA initiative to increase civic participation through design. In addition to voting, we invite AIGA members to inspire citizens to participate in the 2020 Census and to learn more about mail-in voting.Get inspired to participate by viewing 2022’s designs. View 2022 GOTV Poster Gallery Keep in Touch with AIGA Sign up for email communications to be the first for updates on webinars, events, programs, and announcements. Subscribe"
