full_description = "Our Story Careers at AIGA As the largest community of design advocates and practitioners, we not only enhance the design community, we also enhance careers. We are a dynamic group of individuals with a passion for design, living out the AIGA mission in all of the work we do and we are seeking smart, innovative changemakers who have the same passion. If you are looking to take the next step in your career, please view our current job openings below. Explore Design Jobs Follow Us on LinkedIn Next up Contact Us Current Opportunities AIGA does not have any job openings at this time. Please check back later. What We Offer A remote work environment A collaborative work setting with smart and goal-oriented professionals Opportunity to join a growing organization and expand your skills Medical, Dental, and Vision insurance Short-term & long-term disability insurance Life and AD&D insurance 403B Retirement Account Generous PTO and holiday schedule AIGA provides reasonable accommodations to qualified individuals who can perform the essential functions of their positions. If you need a reasonable accommodation for any part of the hiring process, please notify the Human Resources Department.AIGA is an Equal Opportunity Employer. AIGA does not discriminate with respect to employment, training, promotion, or activities on the basis of race, creed, color, religion, age, disability, marital status, partnership status, gender, sex, sexual orientation, gender identity, gender expression, genetic information, pregnancy, alienage or citizenship status, current or former participation in the uniformed services, status as a veteran, or national or ethnic origin, or on account of any other basis prohibited by applicable City, State, or Federal law."
