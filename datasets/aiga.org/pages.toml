title = "Member Special Offers | AIGA"
full_description = "AIGA Membership Member Special Offers Membership in AIGA has its benefits—including discounts on services and products, exclusive access to new job opportunities, and more! Join today to contribute to the influence of design, further your professional development, and connect with a welcoming community of peers. Join Now AIGA Member Savings and Special Offers 15% Off Death to Stock Membership AIGA Members now receive 15% off for the first 12 months of Death to Stock membership with code DTSXAIGA15! Death to Stock is a beautiful, premium media library that helps you build your own unique digital brand using high-quality and unique digital content. .design Domain Free for 12 Months For aspiring and established design freelancers, agencies, and design-driven brands, .design (“dot design”) is the domain name that matches exactly what you do. In collaboration with GoDaddy Registry, as a member of AIGA you will receive your first year of a .design domain registration and email hosting for free. 25% Interaction Design Courses Learn the entire spectrum of UX design from 40 beginner to advanced courses. Get taught by industry experts and gain recognized certificates to advance your career. Get 25% off Interaction Design Foundation Membership (IxDF) using the referral link here. $75 Off at Kickass UX Kickass UX is on a mission to reinvent UX education tailored to graphic designers. AIGA members get $75 off a subscription to Kickass UX’s UX UI Expert Pro or UX UI Expert DIY courses. Use discount code AIGA75 at checkout. OneDigital Financial Resources AIGA members receive access to a year of helpful financial content from our partners at OneDigital! Whether you’re a finance pro or just starting to think about your financial future, this content is designed to help you take control of your money and feel confident about your financial goals. 30% Off Skillshare Subscription Members will receive 30% off a premium Skillshare subscription and the ability to take a curated selection of classes. Click for the AIGA Member Link. 10% Off SuperHi Courses SuperHi offers portfolio focused, practical courses for creative people to learn the skills to stand out. AIGA members can enjoy expert-led creative tech courses while saving 10% off SuperHi courses using our referral link. Work Visa Assistance in the U.S. Are you applying for a work visa in the United States? AIGA Members have the ability to apply for an advisory opinion letter as part of their Visa application process. Click here for more information! Exclusive Design Jobs AIGA members get exclusive access to view full job postings and huge discounts for posting job opportunities on our AIGA Design Jobs board. Competition Discounts Members receive discounted entry fees for AIGA design competitions, like the famed 50 Books 50 Covers and the relaunched 365: AIGA Year in Design. Book Discounts for Designers Embark on a design odyssey with the AIGA Bookshelf and unlock boundless inspiration at unbeatable prices! Friends of AIGA enjoy major discounts on our curated collection – fuel your creativity, expand your horizons, and join us in celebrating the art of design. Healthcare Assistance AIGA members can utilize Association Healthcare Program's assistance in finding the most affordable insurance options in your state. Professional Development All AIGA members can access webinars produced with AIGA partners, as well as discounted rates for certificate courses and leadership workshops. Program & Event Discounts Members receive exclusive rates to national and local chapter programs, events, and webinars. News All members receive the AIGA Member Newsletter monthly, and can opt in to other newsletters such as Eye on Design, AIGA's blog for news on the world’s most exciting emerging and established designers, and Dialectic Journal from the Design Educators Community. Designer Directory Only AIGA members are listed in the AIGA Designer Directory. Please fill out your my.aiga.org profile with information you would like to be displayed. AIGA Resources Check out these other member benefits geared towards professional development and networking. Not a member? Join here! Design Jobs Resources Designer Directory Events AIGA Eye on Design"
