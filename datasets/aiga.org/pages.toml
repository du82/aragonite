full_description = '''Design Conferences AIGA Design Conference Tickets Live! Let’s come together to inspire change and shape the future! Tickets are now on sale to the 2025 AIGA Design Conference in LA. Learn more and register to secure your spot–discounted tickets are limited! Explore the Conference Experience Design Competitions Deadline Extended–More Time to Submit! Is your book or cover design among the best of 2024? Prove it by submitting your work to AIGA 50 Books | 50 Covers, the design competition that has celebrated the pinnacle of book and cover design for over 100 years. Learn More + Enter Design Competitions Enter Your Best Design Work Submit your work to AIGA: 365 Year in Design! The competition honors designers, design teams, and clients who collaborated to create impactful, innovative solutions in 2024. Regular Deadline: March 10, 2025 Learn More + Enter AIGA Membership Join for 2025! AIGA Membership offers a dynamic community through the virtual AIGA Community platform and local events. Network with peers, share insights, and tackle career challenges together while building a professional network to help you excel in your career. Learn More In The News AIGA Competitions Deadlines for 2024-2025 Announced! Read More Events Meet the Community View more events Dec 7 Virtual | 6 AIGA Portland's "WIP - Work in Progress" An opportunity for designers to give & receive constructive feedback on creative work prior to showing their team/client/stakeholders. View Details Mar 5, 2025 | Philadelphia Cheryl D. Holmes-Miller: HERE, Where the Black Designers Are Mar 5, 2025 | Raleigh AIGA Raleigh Community Meeting | March 2025 Mar 6, 2025 | Philadelphia Central PA Coffee with Creatives – March edition Mar 6, 2025 | Chicago ASK + GIVE: March 2025 View more events Explore AIGA Join Our Community Join AIGA today and become part of an exclusive network of design professionals with access to vital learning and career-building benefits on a local and national level. Learn More AIGA Design POV Report The Design Point of View (POV) research initiative is an in-depth analysis of the design profession. This industry research highlights industry demographics, marketplace intelligence, career pathways, and DEI. Download Now AIGA Design Conference: Call for Proposals Want to speak at the 2025 AIGA Design Conference in LA? We are currently accepting proposals for the theme Design + Performance. Apply by March 17! Listen Now Our Mission AIGA advances design as a professional craft, strategic advantage, and vital cultural force. Learn About Our Community Being a member of AIGA has given me access to educational resources for my professional development and business opportunities...it's opened the door to meaningful relationships with a diverse group of dedicated people with whom I'm proud to be in community with. John Hornsby AIGA Asheville AIGA Chapters Be a part of our local communities AIGA BALTIMORE Latino Design Histories Series AIGA Baltimore and the Society of Design Arts (SoDA) are hosting a series of events created to promote the rich and plural histories of Latin American production in design. Thank you to SoDa member, Raquel Castedo, AIGA Unidos, Stevenson University, the Vancouver Latin American Cultural Centre, and the Design History Society for partnering with us. AIGA LA AIGA LA x Los Angeles Unified to Inspire the Future of Design AIGA LA announces a partnership with the Los Angeles Unified School District’s Career Technical Education – Arts, Media & Entertainment (AME) program. Through this partnership, AIGA LA aims to work with LAUSD to inspire the next generation of designers and be a supportive resource for their students, programs, and teachers. AIGA Boston AIGA Boston Presents "The Boston Designcast" AIGA Boston shares how design is flourishing in Boston. From the boom of tech companies in the seaport district, to the tradition of print in Cambridge and everything in between The Boston Designcast is here to highlight the