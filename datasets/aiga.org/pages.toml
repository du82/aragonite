["https://aiga.org/black-history-month"]
title = "Black History Month | AIGA"
full_description = "Inspiration Black History Month February is Black History Month — a time to celebrate the achievements by Black Americans and a time to recognize their central role in U.S. history. To celebrate, AIGA has gathered some articles, interviews, and resources celebrating Black designers and creatives this month, and all-year. Be Inspired by AIGA Medalists 2008 AIGA Medalist LeRoy Winbush 2014 AIGA Medalist Sylvia Harris 2015 AIGA Medalist Emory Douglas 2021 AIGA Medalist Cheryl D. Miller Featured Resources Article Eye on Design “Where Are All The Black Designers?” Cheryl D. Miller, Mitzi Okou, and Maurice Cherry discuss the lineage of the question and why it's still being asked today. Article Eye on Design Jon Key Explores What It Means to Search For Identity as a Black Queer Designer Southernness, Blackness, Queerness, and Family emerged as my personal framework for navigating the world. Article Eye on Design The Power of Mapping, Naming, and Connecting Black Creatives Once a Google Sheet, Black Creative Ecosystems is now a vibrant digital garden that celebrates Black creative thought. Article Eye on Design Cheryl D. Miller Forged the Path Towards a More Inclusive Design Industry Design is a form of activism for the 2021 AIGA Medalist. Article Eye on Design Designer Rush Jackson on Making Work that Expands and Shapes the Black Cultural Lexicon Jackson’s practice centers on providing design services to Black, Brown, and queer initiatives and communities. Article Eye on Design The Design Collective Taking on Structural Racism in the Industry “Design to Divest” started as a group offering pro-bono work to activists, but it's shifting into something bigger. There Is Value In Membership Join today to access networking through your local chapter and a wide variety of local and national programs and events. Join AIGA AIGA Chapters Kansas City: Pick Posters AIGA Kansas City, Pick Progress, and Babes Helpin’ Babes are excited to announce Pick Posters, a poster series celebrating 30 days of black design. The series will run online from Jan. 31 to March 1, culminating in an in-person panel discussion and poster show event on March 2, from 6-8 p.m., at The AI Hub, 511 Delaware St., Suite 50, Kansas City, Mo. Read More Houston: Black History Month 2022The month of February is Black History Month, an annual celebration of the contributions and achievements of Black members of our communities. Read More San Diego: Celebrating Black History From science and architecture, sports and the humanities, to business and civil rights, it’s time to commemorate Black History and celebrate the contributions made by Black Americans. Read More Keep in Touch with AIGA Sign up for email communications to be the first for updates on webinars, events, programs, and announcements. Subscribe More Resources AIGA Diversity, Equity & Inclusion Task Force This group supports the Diversity, Equity and Inclusion Initiative in its mission to encourage diversity in design education, discourse, and practice to strengthen and expand the relevance of design in all areas of society. Rhea L. Combs: The Power of Image Rhea L. Combs, curator of photography and film at the Smithsonian National Museum of African American History & Culture discusses the power of image. Watch Video African American Culture and History: an AIGA Design Journey Selected from AIGA's prestigious Design Archives and Design Journeys series, this collection celebrates African American history and culture throughout the last century of communication design. Learn More AIGA Design Podcasts The Black Experience in Design Design Adjacent with Archie Boston Design Adjacent with Gail Anderson Fireside Chat with Maurice Cherry Design Adjacent with Regina Bain"
