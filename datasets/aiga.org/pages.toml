ject to change. Saturday, October 11 9:00-10:00 a.m. Design Dialogues10:30-12:30 p.m. Mainstage Presentations1:00-3:00 p.m. Workshops and Breakouts 3:30-5:30 p.m. Mainstage PresentationsAll times US Pacific. Schedule subject to change. Members Save More Join AIGA and Save BIG on Your Conference Ticket! Learn More About Membership 2025 In-Person Tickets Member Super Early Bird $799 per ticket *Available only to AIGA Members, quantities limited Nonmember Early Bird $1,299 per ticket Nonprofit/Gov't $699 per ticket Educator $399 per ticket Student $299 per ticket Tickets available soon! Sign up for emails 2024 Conference Partners Death to StockBored to death of the same old visuals? Death to Stock (DTS) offers brands and agencies fresh, trend-focused imagery that doesn’t just keep up with the culture—it helps you stand out. Our visuals reflect the shifts shaping today’s world, fueled by our monthly trend research and a tight-knit team of creatives crafting a distinct visual universe for your brand. Use code DTSXAIGA15 for 15% off for the first 12 months of membership!Learn More Interaction Design Foundation (IxDF)With over 171,000 graduates, the Interaction Design Foundation (IxDF) is the biggest online design school globally. Their courses cover the entire spectrum of UX design from beginner to advanced. It's the IxDF's mission to help democratize UX Design education by making it more affordable and accessible worldwide! In partnership with the AIGA Design Conference, IxDF is offering three months of free membership to attendees! Learn More MicrosoftMicrosoft’s mission is to empower every person and organization on the planet to achieve more. We meaningfully design inclusive products and experiences for all.Learn More PepsiCoPepsiCo products are enjoyed by consumers more than one billion times a day in more than 200 countries and territories around the world. PepsiCo generated more than $67 billion in net revenue in 2019, driven by a complementary food and beverage portfolio that includes Frito-Lay, Gatorade, Pepsi-Cola, Quaker and Tropicana. PepsiCo's product portfolio includes a wide range of enjoyable foods and beverages, including 23 brands that generate more than $1 billion each in estimated annual retail sales. Learn More EnvatoDelve into details, try stuff for the fun of it, make something by accident and then realize you love it. That’s what we’re here for – to create a space where you can’t help but get lost in your own creative flow.From music to mock-ups, photos to fonts and everything in between, Envato has the broadest range of creative asset categories, all in one place. So, if you’re looking to make work that stands out, come enjoy unlimited downloads and the best value in one subscription.Envato. For the creatively obsessed.Learn More There Is Value In Membership Join today to access networking through your local chapter and a wide variety of local and national programs and events. Join AIGA"
