full_description = '''Design Explore Big Ideas Join AIGA More Resources Design Innovations + Futurescapes Analyze Design POV Design POV presents AIGA's latest research into the Design profession including professionals insights, outline of key competencies and competency gaps, and top ways to create better workplaces for designers. Think About Eye on Design Explores the Power of Design The CIA has always understood the power of graphic design. Realize The Future of Conference Branding? Augmented Reality at Future Russia’s Strelka Institute's Architect symposium shows a possible direction for branding. Design Thinking Crossing Business Lines Billie Muraben talks in Eye on Design about corporate acknowledgement that design is important, design thinking is useful, and companies that successfully bring this into their overall business practice will become leaders in their field. Read on Better Design for Data James Cartwright discusses how better design for data means governmental transparency and accountability. “Our belief is that data is an enabler, it’s a tool, it’s something that helps us contextualize the world.” Find out more 2023 AIGA Design Conference Connect in-person with your design community at the AIGA Design Conference in the New York City, October 12–14, 2023. Get your ticket by May 11 to save. Save the Date Conversations Design for the Next Context Stuart Candy is a consulting futurist and a pioneer in experiential futures—interactions designed to evoke a sense of what various future scenarios might feel like to inhabit. Listen to his Pivot: AIGA Design Conference talk exploring the concept that ever act of design reinvents the world in some measure. Watch Now Retooling Our Political System Jake Dunagan, managing director and global foresight lead for verynice.co and research affiliate at the Institute for the Future speaks at Gain: AIGA Design and Business Conference about an unprecedented opportunity to rethink and redesign our systems of governance for the future. Watch Now Humanity of the Machine Brian David Johnson investigates how technology reflects the mission and values of the societies that design and create it at Gain: AIGA Design and Business Conference. His work called “futurecasting ” uses ethnographic field studies technology research trend data to provide Intel with a pragmatic vision of consumers and computing. Watch Now Business Perspectives for Creative Leaders The BPCL program, in partnership with Yale University, is designed to equip creative leaders to meet the challenges of management and give participants the skills and perspectives they need to reach the next levels in their careers. Learn More Expanding Design Thinking The Politics of Graphic Design Designer and Educator J. Dakota Brown is untangling the relationship between design and labor. "I think we should question how we define 'the designer.' The cast of characters in the history textbooks can seem a little arbitrary." Read The Solution to Deepfakes James Cartwright talks in Eye on Design about the contemporary conundrum: as deepfakes outsmart the systems designed to detect them, is increasing user literacy our best bet? Read Futurist Reading Recommendations Speculative Everything Anthony Dunne and Fiona Raby Write about how to use design as a tool to create not only things but ideas, to speculate about possible futures. MIT Press. How To Future Renowned futurists Scott Smith and Madeline Ashby teach you how to manage the daily flood of information and signals, and discern emergent patterns that have a direct impact on the direction of your business. Futuring is the art of anticipating and testing the trade-offs of different futures by making sense of key trends, signals and emerging patterns. FutureThink Future Think: How To Think Clearly In A Time Of Change by futurists Edie Weiner and Arnold Brown discusses concepts to challenge your internal assumptions and sensitize you to change. There Is Value In Membership Join today to access networking through your local chapter and a wide variety of local and national programs and events. Join AIGA'''
