title = "Positive Impact | AIGA"
full_description = 'Inspiration Positive Impact Designers can make their communities a better place for everyone through volunteering, values-driven design, and socially-focused work. Join AIGA Make an Impact with AIGA Diversity, Equity, Inclusion + Accessibility Design plays an essential role in the fight for diversity, equity, and inclusion. AIGA members are at the forefront of some of the most important initiatives to drive DEI in the workplace. Design for Democracy For the last two decades, Design for Democracy has applied design tools and thinking to increase civic participation. By making interactions between the U.S. government and its citizens more understandable, efficient, and trustworthy, designers become more vocal citizens and make democracy more sound. Value Design Education Pledge AIGA’s Design Educators Community (DEC) held a virtual roundtable—The Value of Design Education—in May 2020 to address two questions: 1) What value do we provide as design educators?; and 2) what are reasonable expectations to set for ourselves and our students? AIGA’s Standards of Professional Practice In 2010, AIGA amended its Standards of Professional Practice, which outlines the ethical and professional expectations for how designers conduct business. We believe professional integrity enables an industry built on respect for colleagues, clients, audiences or consumers, and for society as a whole. Read more Positive Impact Resources Looking for additional ways to design for good? This list of organizations and programs is a great place to start. Read more Volunteer with AIGA You can make a positive impact in your community by volunteering your time with AIGA. Learn more about opportunities to get involved with AIGA at the national, regional, and chapter level. Learn More AIGA Scholarships Meet the 2021 Scholarship Recipients The jurors of the 2021–2022 AIGA Worldstudio Scholarships reviewed more than 200 applications from students attending art and design programs at colleges and universities across the country. This year, AIGA awarded 16 scholarships and 7 honorable mentions to applicants whose work focuses on social, environmental, and cultural impact in three categories: illustration, photography, and graphic design. Read the Press Release AIGA Worldstudio Scholarships AIGA Worldstudio Scholarships benefit underrepresented and economically disadvantaged students who are studying photography, illustration, and design disciplines in colleges and universities in the United States. Scholarships are awarded annually to encourage social and environmental responsibility and cultural awareness in the next generation of artists and designers. Learn More Help Fund Design Education We believe all students should have the opportunity to pursue design education. Donate Related reading, videos and opportunities Conference AIGA Design + Business Conference Article Forest Young on Designing a More Inclusive Future "There is an urgent need for guardrails to ensure that future design isn’t framed by a privileged perspective." Talk The Culture We Make Ashleigh Axios discusses the importance of personal and professional values and how it shapes the culture around us.'
