["https://aiga.org/membership-community/about-aiga-chapters"]
title = "About AIGA Chapters | AIGA"
full_description = "Membership & Community About AIGA Chapters Members of AIGA are invited to join one of our 60+ dynamic local chapters. From the snowy slopes of Alaska to the sandy shores of Miami, we’ve got an opportunity for you to connect with designers in your area. Join AIGA AIGA Chapters, the Local Heartbeat of AIGAWe serve AIGA members through more than 60 chapters across the United States. Being an AIGA member affiliated with a chapter is a great way to support programming, networking and mentorship in your local design community. AIGA chapters offer a breadth of offerings including networking, programming, leadership training, local conferences, podcasts, among many other programs. Find a Chapter Volunteer Chapter Leadership At the heart of AIGA chapters are our dedicated volunteer leaders. Typical board positions can include President, VP, Secretary, Treasurer, and a variety of director-level positions ranging from communications to sponsorship (all subject to the needs of the chapter). Each chapter board is also supported by a national network of volunteers, including the AIGA Chapter Presidents Council, AIGA Board of Directors, and its staff. Presidents Council The Presidents Council connects the work of local chapters with national communities, councils, and task forces, as well as the AIGA Board and its Staff. The Presidents Council is led by a Chair and an Incoming Chair who serve staggering two-year terms. Learn More Student Groups Students represent the next generation of design leaders and the future of AIGA. Student groups have their own board, programming and needs for community, inspiration, and organization. Learn More Mentorship Programs for Every Career Level AIGA Chapters across the United States host mentorship programs for all levels. Whether you are a student looking to break into the industry, or a seasoned designer looking for a new path, explore all of the opportunities available. Discover more Meet Our Community Groups Design Educators Community (DEC) The AIGA Design Educators Community (DEC) seeks to enhance the abilities of design educators and educational institutions to prepare future designers for excellence in design at the undergraduate and graduate levels. Meet the DEC Steering Committee Diversity, Equity, & Inclusion Task Force AIGA encourages diversity in design education, discourse, and practice to strengthen and expand the relevance of design in all areas of society. Meet the DEI Task Force AIGA Unidos A multi-chapter collaboration, creating a space to empower and celebrate the lives, work, stories, and needs of creatives with a Latinx and Hispanic cultural heritage. Meet the Unidos Team “When I graduated from college, I entered into the job market at a time when UX design was a buzzword and there seemed to be a million jobs out there. I graduated with a mixed skillset including coding and design, and I wasn't sure where to apply my skills, or even what to look for in a job. That's where AIGA DC saved me. I found my local AIGA chapter and started attending events, meeting people, joined the SHINE Mentorship Program, and that was absolutely revolutionary for my growth as a young professional and designer. Since then, I've met the most incredible people through AIGA and it is a place that I look to for inspiration, collaboration, and the future of design. I'm honored to now serve on the Board of Directors for AIGA DC as a way to give back to this organization and community that has shaped my own growth, and I hope to empower young designers in the same way AIGA empowered me.” Radhika Bhatt, AIGA DC Civic Technologist and Human Centered Designer"
year_published = 2025
