["https://aiga.org/membership-community"]
title = "Membership & Community | AIGA"
description = "Membership & Community Page"
full_description = '''Membership & Community AIGA is your professional association, here to provide the networking, inspiration, and tools to help you thrive as a design professional. Explore Join Now AIGA membership gives you access to vital learning and career-building benefits to sharpen your skills and gain creative insights. About AIGA Membership Explore member benefits and options Chapters Find out about our chapters Student Groups Find a student group or start one at your institution Group & Corporate Memberships Receive a discounted membership rate with three or more members Design Educators Community Learn about initiatives to support design educators Diversity, Equity & Inclusion Learn about how we are encouraging diversity in design Community Values & Standards Our commitments to one another and our standards In this section Select a page Join Now About AIGA Membership Chapters Student Groups Group & Corporate Memberships Design Educators Community Diversity, Equity & Inclusion Community Values & Standards More About Membership A Welcoming Community As an AIGA member, you will receive exclusive benefits including access to professional development, continuing education on a local and national level, discounted rates to AIGA programs and events, virtual webinars, leadership opportunities, and members-only special offers — plus, connection to a diverse network of mentors, influential designers, design educators, industry leaders, students, and other creative professionals. Learn More Virtual Events Year-Round Join us for monthly webinars to inspire your best work, grow as a leader, and connect with designers across the world. Members receive free or discounted registration to all AIGA virtual events. Learn More Keep in Touch with AIGA Sign up for email communications to be the first for updates on webinars, events, programs, and announcements. Subscribe "Being a member of AIGA has been such a wonderful addition to both my personal and professional growth. It's given me access to educational resources for my professional development and business opportunities I wouldn't have otherwise. Most importantly though, it's opened the door to meaningful relationships with a diverse group of dedicated people with whom I'm proud to be in community with. I recommend AIGA to anyone who's work or passions intersect with design." John Hornsby AIGA Asheville chapter leader volunteer Membership Find a Chapter Membership in AIGA also includes membership to a chapter of your choice. AIGA Chapters create networking opportunities, strengthen and connect the local design community, and provide continuing education and advocacy programs for the professional creatives in their region. Chapters receive a portion of your annual membership dues to support their services and programs. Learn More There Is Value In Membership Join today to access networking through your local chapter and a wide variety of local and national programs and events. Join AIGA Next Up: Perspectives AIGA Webinars Explore our free-to-members webinar offerings, and learn from the comfort of your own home with live and recorded sessions. Explore Design Archives & Collections Our archives and special collections identify, preserve, and make available works of enduring value to elevate the diverse and impactful stories of design and designers. Browse Inspiring Talks Enjoy our selection of talks for designers ranging from the history of branding to tax management. View Talks'''
