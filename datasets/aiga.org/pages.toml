full_description = "Our Story Media As the profession’s oldest and largest professional membership organization for design, we advance design as a professional craft, strategic advantage, and vital cultural force. From content that defines the global practice to events that connect and catalyze, we work to enhance the value and deepen the impact of design across all disciplines on business, society, and our collective future. Media Contact Michelle Koenigsknecht Contact Michelle Press Releases January 14, 2025 AIGA Announces Book Design Competition Call for Entries October 02, 2024 Best Book and Cover Designs of 2023 Revealed August 20, 2024 365: AIGA Year in Design Winners Announced for 2023 August 01, 2024 AIGA Welcomes Six Members to the Board of Directors View all press releases AIGA Podcast Listen to an episode of our award-winning podcast! AIGA Design Adjacent is a 2022 Signal Award winner, Silver in Best Experimental Podcast category AIGA Design Adjacent Podcast This award-winning podcast explores groundbreaking topics shaping our future. Design can power the future and this podcast takes a surprising look at the ways in which design is helping to build a better future. AIGA in the News Article July 2023 Book Riot 50 Best Book Covers of 2022 Announced Article July 2023 Lit Hub These are the best book covers of 2022 you (probably) haven’t seen. Article June 2022 Fast Company See the 50 most striking book covers of the year Article June 2022 Literary Hub These are the best book covers of 2021 you (probably) haven't seen Article September 2021 ASAE: Associations Now Members-led Effort Will Bring Histories of Women, People of Color in Design to Wikipedia Article September 2021 Graphic Design USA AIGA Announces Hispanic Heritage Talks 2021 Article July 2023 It's Nice That “Simple, perfect”: The 50 best book covers of 2022, according to AIGA Article July 2023 Page According to AIGA, these are the best 50 book covers of 2022 Article October 2022 Graphic Design USA A