["https://aiga.org/contribute-to-aiga"]
title = "Contribute to AIGA | AIGA"
full_description = "Our Story Your Support Makes Our Work Possible Through meaningful programs and initiatives, we enrich the design profession and empower designers. Your support today helps us continue this important work into the future. Join Donate Learn More About AIGA Media & Press Annual Reports Board of Directors Follow Us Mission AIGA is a 501(c)(3) nonprofit organization. Our mission is to advance design as a professional craft, strategic advantage, and vital cultural force. Programs & Initiatives When you donate, remember to ask your employer about their company matching policy. General Support Your contribution supports a community in action. Together, we create meaningful programs and initiatives that nurture the next generation of design leaders, enhance professional development and leadership opportunities for designers, and advocate for diversity within the industry. Donations are unrestricted to support AIGA’s mission. DonateLearn More AIGA Worldstudio Scholarships AIGA’s scholarship program increases diversity in the creative professions. Your contribution has an immediate and lasting impact; it provides an opportunity for undergraduate and graduate students from underrepresented and economically disadvantaged backgrounds with positive social agendas to achieve their educational goals and give back to communities through their work. Boost your impact and elevate diverse voices with a monthly gift. Donate Learn More Named scholarships can be made in your name, your company’s name, or your chapter’s name when you donate $3,250 or more. Download the PDF form to submit by mail or email. Donor Form Ways You Can Give We’re grateful for the gift of you! Online Giving online is safe and secure. Select the corresponding program or initiative donate button above to complete the online donation form. If not specified, donations will be designated to the area of greatest need. Phone Please call 212–710–3145 to speak with the Director of Development. ACH AIGA is requesting donations be made via ACH direct-payment transactions instead of traditional paper checks. If ACH direct-payments are not possible, the contribution form must be included with your payment. Please email [email protected] to confirm our temporary mailing address or detailed instructions. Keep in Touch with AIGA Sign up for email communications to be the first for updates on webinars, events, programs, and announcements. Subscribe Qualified Charitable Contributions If you are age 70 1/2 or older, you may be able to take advantage of a simple, tax-saving way to support AIGA. Making a Gift (Qualified Charitable Distribution) From Your IRA is Simple: You can transfer up to $100,000 per year to one or more charitable organizations—such as AIGA–instead of taking your required minimum distribution. A qualified charitable distribution (QCD) is not subject to ordinary federal income taxes—the amount is excluded from your taxable income. QCDs are direct gifts from an individual retirement account to an eligible charity, and may reduce your adjusted gross income (AGI). IRA charitable contributions count towards your Required Minimum Distribution (requirement begins at age 72). Contact your IRA plan administrator or qualified tax advisor to discuss if an IRA gift, or Qualified Charitable Distribution (QCD), is right for you; they will help you determine the amount by which your QCD must be reduced. Choose an eligible account and select the investment and dollar amount that you would like distributed. Transfers must be made from a traditional IRA by your IRA administrator, payable to American Institute of Graphic Arts (AIGA). You cannot receive goods or services in exchange for your contribution. Contact Us Thank you for considering making a gift to AIGA from your IRA. While we are not financial advisors, we would be happy to speak to you about Qualified Charitable Distributions from your IRA. FAQs Is this a tax deductible donation? AIGA is a 501(c)(3) nonprofit organization. All charitable contributions to AIGA are tax-deductible to the extent the tax code allows. Please note that our legal name remains The American Institute of Graphic Arts. AIGA’s U.S. federal tax ID: 13–1623893 View AIGA’s 501(c)(3) determination letter from the IRS. View 990 documents at AIGA’s GuideStar profile. View AIGA’s Board of Directors. AIGA’s fiscal year ends September 30. To ensure year-end contributions meet the IRS tax-return deadline for the current year, receipt by AIGA must be no later than December 31. Refunds are not available for membership dues or charitable donations. We welcome the opportunity to speak with anyone interested in learning more about AIGA. Can I enroll in an automated contribution? Yes. The online form allows you to select donation frequency and define the number of payments. To enroll in an automated contribution, please select “Monthly.” At this time, donations made by phone or check are one-time only gifts. Can I make a gift in honor or in memory of an individual? Yes. When donating online, please select “Dedicate my donation in honor of or in memory of someone.” Or complete the Contribution Form to indicate the “Requested recognition” name dedicated or in memory of an individual and email it to [email protected]. Can my company match my donation? Yes. Ask your employer or human resources department about their matching gift policy. AIGA is currently registered with YourCause and Benevity to facilitiate your company match/employee giving programs. We’re happy to work with you! Please connect via your employee portal for information or assistance. YourCause and Benevity will provide a tax receipt for donations made through their platform, and they will disburse the company match to AIGA—typically at the end of the following month. Can I redirect a speaker fee/honorarium as a donation to AIGA? Yes. If the host company or organization is making the donation on your behalf, please email [email protected] to verify your intent and introduce the host company/organization contact. We will ask you and the host company/organization where the tax receipt should be sent. The Contribution Form will be provided to the host to authorize payment. Can I make a contribution with stocks? Yes. Email us at [email protected]. Please contact your tax professional regarding your contribution for potential tax deduction benefits. Can I include AIGA in my will, trust, or retirement account? Yes. Email us at [email protected]. To learn about other types of gifts, request information about AIGA’s gifts and acceptance policy. Please contact your tax professional regarding your contribution for potential tax deduction benefits. Can I donate design work to the AIGA Design Archives? Yes. Email [email protected] to share details about what you have to offer and to learn more about AIGA’s collection development policy. Are there other ways I can give back? Yes. You can give back to AIGA through: Membership Volunteering Resources Podcasts AIGA Eye on Design Chapter Directory Calendar of Events Donor Support There Is Value In Membership Join today to access networking through your local chapter and a wide variety of local and national programs and events. Join AIGA"
year_published = 2025
