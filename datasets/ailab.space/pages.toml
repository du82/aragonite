full_description = "New session of Intelligent Systems Lab Teaching / owh / September 8, 2024 The new session for ZA-3201 Intelligent Systems Lab started with this semester. This is a compulsory module for students majoring in AI and robotics, and applied AI. In the previous two sessions, we worked on the Niryo NED six dof robotic arm. This session, we are working on the Nao robot and the Stretch 2 […] New session of Intelligent Systems Lab Read More » MoH Innovation Lab visited Robolab Lab / owh / August 21, 2024 Officers from the newly established Innovation Lab in Ministry of Health visited. We discussed potential collaborations between MoH and School of Digital Science on projects in applications of AI and robotics in health care premises. MoH Innovation Lab visited Robolab Read More » Robolab received visitors from Swinburne University of Technology Sarawak Lab / owh / August 19, 2024 Prof Ida Fatimawati (Deputy Pro Chancellor Reasearch) and Dr Viknesh (Associate Director Research) from Swinburne University of Technology Sarawak visited Robolab. Robolab received visitors from Swinburne University of Technology Sarawak Read More » A visitor from Bristish High Commission Lab / owh / August 16, 2024 Robolab received a visit from Mr Morgan Kimber from the British High Commission @ukinbrunei. Mr Morgan came to get to know our works and shared with us his role in facilitating collaborations between Brunei and UK institutions. Thank you for dropping by! #robolab #ailabspace #ubdsds #ubd #brunei #ukinbrunei A visitor from Bristish High Commission Read More » Congratulations to Dr Usman, Hafiq and Nazrul! Students / owh / August 12, 2024 Usman received his PhD in Computer Science, congratulations Dr Usman! Hafiq and Nazrul received their Master of Digital Science (Artificial Intelligence) by research. Congratulations! Hafiq and Nazrul are the first graduates from our new Master of Digital Science (MDSc) by research. Hafiq has received the MSc with Distinction. Today also mark the graduation of the Congratulations to Dr Usman, Hafiq and Nazrul! Read More »"
