full_description = "ZA-2203 Robotic Systems Module Code: ZA-2203 Module Title: Robotic Systems Type of Module: Major Core for Bachelor of Digital Science Major in Artificial Intelligence and Robotics Modular Credits: 4MC Prerequisite: ZZ-1101 Mathematical Methods for the Sciences or equivalent knowledge of mathematics ZZ-1102 Programming Fundamentals or equivalent programming knowledge Anti-requisite: None Description This module introduces to the students the basics of modelling and control of robot systems and train them to develop planning and control software modules for robots like manipulators. (Module Outlines) Lecturers: Dr Ong Wee Hong, weehong.ong@ubd.edu.bn, Office: APB 2.43 Dr Ajaz Ahmad Bhat, ajaz.bhat@ubd.edu.bn, Office: APB 2.48 Class times: Two 2hrs sessions per week for 14 weeks. Assessments: Examination 30% Coursework 70% – one class test (10%), two assignments (10% each), one lab test (15%), one project (25%) References: (Textbook) Kevin M. Lynch and Frank C. Park, “Modern Robotics: Mechanics, Planning, and Control“, Cambridge University Press, 2017, ISBN 9781107156302 (Video lectures) Mark W. Spong, Seth Hutchinson, M. Vidyasagar, “Robot Modeling and Control, 2nd Edition”, Wiley, ISBN: 978-1-119-52404-5 Peter Corke, “Robotics, Vision and Control Fundamental Algorithms in Matlab, 2nd Edition”, Springer, ISBN: 978-3-319-54412-0 Richar M. Murray, Zexiang Li, S. Shankar Sastry, “A Mathematical Introduction to Robotic Manipulation”, Taylor & Francis, ISBN: 978-0-8493-7981-9 John J. Craig, “Introduction to Robotics: Mechanics and Control, Third Edition”, Pearson, ISBN: 978-1-292-04004-2 CS223A – Introduction to Robotics by Professor Oussama Khatib at Stanford University QUT Robot Academy video lectures by Professor Peter Corke at Queensland University of Technology Acknowledgement: I have made extensive reference and utilized materials from the above resources, as well as other online content, to prepare my course materials. In particular, most of the 