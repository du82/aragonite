full_description = "Syamimi’s paper presented at IEEE IV 2024 Research / owh / June 3, 2024 Our paper on vehicles adaptability of two major imitation learning pipelines for autonomous driving agents has been presented at the IEEE Intelligent Vehicles Symposium (IEEE IV) 2024 held at the Jeju Shinhwa World Landing Convention Centre, 2-5 June. The paper was presented in the poster session. IEEE IV 2024 showcased a diverse array of 511 […] Syamimi’s paper presented at IEEE IV 2024 Read More » Hafiq’s paper on social navigation accepted in UR 2024 Research, Students / owh / April 25, 2024 Hafiq’s paper on “Deep Reinforcement Learning-Based Mapless Crowd Navigation with Perceived Risk of the Moving Crowd for Mobile Robots” has been accepted to the 21st International Conference on Ubiquitous Robots (UR 2024) to be held at the Kimmel Center for University Life in NYU, Manhattan, New York, USA, from June 24 to 27, 2024. This Hafiq’s paper on social navigation accepted in UR 2024 Read More » Syamimi’s paper accepted in the IEEE IV 2024 Research, Students / owh / April 2, 2024 Syamimi’s paper on “A Comparison of Imitation Learning Pipelines for Autonomous Driving on the Effect of Change in Ego-vehicle” has been accepted to the 35th IEEE Intelligent Vehicles Symposium (IV) 2024. The conference will be held on 2-5 June in Jeju, South Korea. The IEEE IV Symposium is a premier conference in intelligent vehicles and Syamimi’s paper accepted in the IEEE IV 2024 Read More » Syamimi at Institute for Safe Autonomy, University of York, UK Research, Students / owh / February 7, 2024 Syamimi is having her research visit to the Institute for Safe Autonomy (ISA) in University of York (UoY), UK. She will be there for four months, Feb-May. She will work under the mentorship of Dr Fanta Camara in exploring the application of game theory in improving the safe autonomy of autonomous car agent. Syamimi’s visit Syamimi at Institute for Safe Autonomy, University of York, UK Read More »"
