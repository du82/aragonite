full_description = "Syamimi’s paper accepted in the IEEE IV 2024 Research, Students / owh / April 2, 2024 Syamimi’s paper on “A Comparison of Imitation Learning Pipelines for Autonomous Driving on the Effect of Change in Ego-vehicle” has been accepted to the 35th IEEE Intelligent Vehicles Symposium (IV) 2024. The conference will be held on 2-5 June in Jeju, South Korea. The IEEE IV Symposium is a premier conference in intelligent vehicles and […] Syamimi’s paper accepted in the IEEE IV 2024 Read More » A small upgrade of our autonomous driving sim rig Lab / owh / February 28, 2024 We have got a larger screen for our autonomous driving simulator rig. With a bit of adjustment, it is quite comfortable now. A small upgrade of our autonomous driving sim rig Read More » Syamimi at Institute for Safe Autonomy, University of York, UK Research, Students / owh / February 7, 2024 Syamimi is having her research visit to the Institute for Safe Autonomy (ISA) in University of York (UoY), UK. She will be there for four months, Feb-May. She will work under the mentorship of Dr Fanta Camara in exploring the application of game theory in improving the safe autonomy of autonomous car agent. Syamimi’s visit Syamimi at Institute for Safe Autonomy, University of York, UK Read More » Brunei Smart Mobility Expo 2023 Events / owh / December 12, 2023 The Robolab team together with other members from the School of Digital Science (SDS) showcased their projects at the Brunei Smart Mobility Expo 2023 held at the Bridex Hall, Jerudong on 8-10 December. The team was invited by the Brunei Innovation Lab (BIL) to showcase their research relevant to smart mobility. The team exhibited their Brunei Smart Mobility Expo 2023 Read More » Robot programming workshop at DevFest Brunei 2023 Events / owh / December 4, 2023 Hafiq, Nazrul and the Robolab gang delivered the “Exploring Robot Programming with Python” workshop at the Google DevFest Brunei 2023. . The DevFest Brunei 2023 was held on 1-3 Dec at Laksamana College of Business, Plaza Abdul Razak. This is the second year we participated in the DevFest Brunei. Details of the workshop can be Robot programming workshop at DevFest Brunei 2023 Read More »"
