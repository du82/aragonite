full_description = "Md Hafiq Anas During Hafiq’s undergraduate studies, he solved an indoor navigation problem by designing an autonomous navigation system on a customized mobile robot using ROS. He has also developed an Automatic Facial Expression Recognition (AFER) system. Currently, he is working on implementing a socially compliant navigation robot that can be deployed in crowded places using Deep Reinforcement Learning to imitate acceptable human behaviors. His research interests include robotics, machine learning, and the application of robots in the real world."
