full_description = "Congratulations to the CS class of 2023 Students / owh / August 21, 2023 Congratulations to CS class of 2023! Congratulations to Beng and Raziq! Both of them will pursue research in a master degree. Congratulations to the CS class of 2023 Read More » SDS welcomed visitors from UTM Lab, Students / owh / July 31, 2023 The School of Digital Science welcomed student visitors from the University of Technology, Malaysia. Hafiq, Syamimi, Nazrul and Azryl shared with the visitors their research works in AI and robotics. SDS welcomed visitors from UTM Read More » Upgraded our Turtlebot2 to ROS Noetic Lab / owh / July 23, 2023 We have upgraded our Turtlebot2 to ROS Noetic on Ubuntu 20.04. The Turtlebot2 was previously running on ROS Kinetic. . In the video above, the Turtlebot2 was mapping out the office floor of the School of Digital Science, UBD. It was controlled wirelessly with a PS3 controller. The video has been speeded up x2. Turtlebot2 Upgraded our Turtlebot2 to ROS Noetic Read More » Nazrul’s paper presented at UR 2023 Research, Students / owh / July 20, 2023 Nazrul’s paper with the title “Optimizing Odometry Accuracy through Temporal Information in Self-Supervised Deep Networks” has been accepted and presented at the 20th International Conference on Ubiquitous Robots (UR 2023) held in the Hawai’i Convention Center, Honolulu, Hawaii. In this paper, we propose a self-supervised deep recurrent convolutional network with a self-attention pipeline for LiDAR-Inertial Nazrul’s paper presented at UR 2023 Read More » Fixed the bumper of our Turtlebot2 Lab / owh / June 30, 2023 The bumper of one of our Turtlebot2 was jammed. The center and left side were jam and could not push in. It turned out that the fixture for center bumper mechanism came out of its holder. It was probably pushed up too much. It is now fixed. Kobuki has gone out of production and it Fixed the bumper of our Turtlebot2 Read More » Potluck at RoboLab Lab, Students / owh / June 30, 2023 We had a potluck lunch. The gathering also celebrated Eid Ul Adha. Potluck at RoboLab Read More »"
