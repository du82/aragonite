["https://ailab.space/ra-position-for-human-activities-discovery-project"]
title = "Research assistant position for human activities discovery project – AI Lab"
description = "Living with technologies ..."
full_description = "Research assistant position for human activities discovery projectResearch / By owh / November 30, 2022 / career, har, project We are hiring a full-time research assistant (RA) for our human activities discovery project. The work should start in Jan 2023. . The RA will implement the software system we have developed for unsupervised human activity discovery on a Turtlebot 2 mobile robot. This will involve integrating the software system alongside the Navigation stack in Robot Operating System (ROS). The anticipated outcome from your work is a mobile robot that will roam around the lab, discover and recognition human activities without supervision, i.e. without labelled data. We seek candidates who have excellent Python Programming skills and relevant background knowledge in mobile robotic navigation. Preference will be given to the candidates with research experience. Requirements: Minimum Bachelor degree in Digital Science, Computer Science, Computer Engineering, Engineering or a relevant field Python Programming and have studied robotics particularly mobile robot Demonstrated excellent written communication skills Demonstration of research experience is preferred Able to work full-time in the lab during working hours Interested candidates are to submit softcopies of the following documents to Dr Daphne Tech Ching Lai daphne.lai@ubd.edu.bn not later than 10th December 2022: Cover letter Detailed Curriculum Vitae (CV) Transcripts from your higher education Copy of National ID Copy of publications, project reports, and/or thesis Post advertisement is here: https://ubd.edu.bn/about/career-opportunities/non-academic-positions/full-time-research-assistant.html Project page: https://ailab.space/projects/unsupervised-human-activities-recognition/"
