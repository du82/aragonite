title = "Teaching – AI Lab"
description = "Living with technologies ..."
full_description = "New session of Intelligent Systems Lab Teaching / owh / September 8, 2024 The new session for ZA-3201 Intelligent Systems Lab started with this semester. This is a compulsory module for students majoring in AI and robotics, and applied AI. In the previous two sessions, we worked on the Niryo NED six dof robotic arm. This session, we are working on the Nao robot and the Stretch 2 […] New session of Intelligent Systems Lab Read More » Teleop and digital twin of Niryo NED 6-DoF robotic arm Lab, Students, Teaching / owh / December 12, 2022 The School of Digital Science has acquired a Niryo NED 6-DoF robotic arm. This added opportunities for us to experiment with manipulation tasks in robotic. The video below is our first project with the NED. This is a lab project by three third year students in the Bachelor of Digital Science: Firdaus, Luqman and Farah. Teleop and digital twin of Niryo NED 6-DoF robotic arm Read More » Upgraded the Raspberry Pi 4 firmware of Niryo NED 6-DoF robotic arm Lab, Teaching / owh / August 27, 2022 We are working on the Niryo NED 6-DoF robotic arm that the School of Digital Science has recently acquired. The RPi firmware that came with the NED is an older version and is not compatible with the latest version of Niryo Studio, 4.1.0. So, we upgraded the firmware to 4.1.0. Ref: https://niryo.com/docs/niryo-one/update-your-robot/update-raspberry-pi-image/ Download: https://niryo.com/download/ Upgraded the Raspberry Pi 4 firmware of Niryo NED 6-DoF robotic arm Read More » Final Robot Programming presentation for this semester Teaching / owh / November 30, 2021 The Covid pandemic second wave hit the country at the beginning of this semester. I was stuck in how to get going with the SS-4311 Robot Programming module where the students are supposed to have fun with the physical robot. Fortunately, there are just the sufficient number of robots for all the students. They have Final Robot Programming presentation for this semester Read More » New session of Robot Programming has started Teaching / owh / August 6, 2020 This time we are using the Alphabot2-Pi from Waveshare. It would be good to have fitted with an ultrasonic sensor, IMU and wheel encoders. New session of Robot Programming has started Read More »"
