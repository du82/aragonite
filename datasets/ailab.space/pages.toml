full_description = "New addition to Robolab: F-GT racing simulator cockpitLab / By owh / April 1, 2023 / robolab, robolabv3, self-driving We have added the Next Level Racing F-GT simulator cockpit to our lab. Together with the Logitech G920 steering wheel and pedal, they allow us to drive in the Carla simulator comfortably. This comes handy for data collection in our autonomous driving research. We certainly need a larger screen for our set up. . This facility has enabled our researchers to collect hours of data for training an autonomous driving model and build a self-driving car system to operate in Carla Town 5. More details will be shared soon."
