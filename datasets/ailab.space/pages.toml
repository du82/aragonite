full_description = "A visitor from Bristish High Commission Lab / owh / August 16, 2024 Robolab received a visit from Mr Morgan Kimber from the British High Commission @ukinbrunei. Mr Morgan came to get to know our works and shared with us his role in facilitating collaborations between Brunei and UK institutions. Thank you for dropping by! #robolab #ailabspace #ubdsds #ubd #brunei #ukinbrunei A visitor from Bristish High Commission Read More » New addition to Robolab: F-GT racing simulator cockpit Lab / owh / April 1, 2023 We have added the Next Level Racing F-GT simulator cockpit to our lab. Together with the Logitech G920 steering wheel and pedal, they allow us to drive in the Carla simulator comfortably. This comes handy for data collection in our autonomous driving research. We certainly need a larger screen for our set up. . This New addition to Robolab: F-GT racing simulator cockpit Read More » Logitech G920 steering wheel and pedal added to Robolab Lab / owh / November 10, 2022 We have gotten the Logitech G920 steering wheel and pedal for our self-driving car project. It is much more natural to drive with the steering wheel and pedal than the keyboard and mouse. It works in Carla and will be used in the data collection phase. This will be Syamimi‘s toy for a while. Logitech G920 steering wheel and pedal added to Robolab Read More » We have started with our physical lab meetings Lab / owh / September 19, 2022 It had been a few years we couldn’t have physical lab meetings. We have started with our physical lab meetings Read More » Another TurtleBot 2 added to Robolab Lab / owh / November 11, 2020 New robot member in Robolab V3. Another TurtleBot 2 added to Robolab Read More » Creality Ender 3 3D Printer added to Robolab Lab / owh / November 11, 2020 The Digital Science group has acquired a few 3D printers. One of them is stationed in Robolab V3. Creality Ender 3 3D Printer added to Robolab Read More » Fleet of robots in Robolab Lab / owh / February 5, 2020 Our