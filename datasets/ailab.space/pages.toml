full_description = "Hafiq at RSS 2024 Students / owh / July 21, 2024 Sharing a few photos from Hafiq. Hafiq attended the Robotics: Science and Systems Conference (RSS) 2024 as an Inclusion@RSS fellow. He was at the Netherland from 10/7 to 20/7. RSS 2024 was held at the Delft University of Technology, Delft, Netherlands. Inclusion fellows group photo outside Robo House has been taken from Khen Elimelech’s post […] Hafiq at RSS 2024 Read More » Hafiq will attend RSS 2024 Students / owh / June 13, 2024 Hafiq has been awarded the Inclusion Fellowship by the Robotics: Science and Systems (RSS). He will attend the 20th RSS conference that will be held at the Delft University of Technology, Delft, Netherlands in July 15-19, 2024. Congratulations Hafiq! I am a first-year PhD student in Robotics at the School of Digital Science, Universiti Brunei Hafiq will attend RSS 2024 Read More » Hafiq’s paper on social navigation accepted in UR 2024 Research, Students / owh / April 25, 2024 Hafiq’s paper on “Deep Reinforcement Learning-Based Mapless Crowd Navigation with Perceived Risk of the Moving Crowd for Mobile Robots” has been accepted to the 21st International Conference on Ubiquitous Robots (UR 2024) to be held at the Kimmel Center for University Life in NYU, Manhattan, New York, USA, from June 24 to 27, 2024. This Hafiq’s paper on social navigation accepted in UR 2024 Read More » ROBOTIS mentioned Hafiq’s work Research, Students / owh / October 24, 2023 Thank you for the mention. 強化学習の研究でTurtleBot3が使われていて，Gazebo上でのシミュレーション実験だけでなく，実機実験までやっていて凄い．#ROS #Gazebo #TurtleBot3 pic.twitter.com/LHcRCFx4HV — 東海林ファジィロボット研究所 所長 (@Toukairinn_FUZZ) October 28, 2023 ROBOTIS mentioned Hafiq’s work Read More » Hafiq presented his work at IROS 2023 workshop Research, Students / owh / October 7, 2023 Hafiq’s paper on “Deep Reinforcement Learning-Based Mapless Crowd Navigation with Perceived Risk of the Moving Crowd for Mobile Robots” was accepted to the 2nd Workshop on Social Robot Navigation: Advances and Evaluation (papers) held in conjunction with IEEE International Conference on Intelligent Robots and Systems 2023 (IROS 2023) on 5 October. We couldn’t travel to Hafiq presented his work at IROS 2023 workshop Read More »"
