["https://ailab.space/vanessa-attended-icra-2024-at-yokohama"]
title = "Vanessa attended ICRA 2024 at Yokohama – AI Lab"
description = "Living with technologies ..."
full_description = "Vanessa attended ICRA 2024 at YokohamaStudents / By owh / June 4, 2024 / conference, icra Vanessa attended the International Conference on Robotics and Automation (ICRA) 2024 held at Yokohama, Japan, 13-17 May. Vanessa is a 2nd year student in the AI and Robotics major of our Bachelor of Digital Science. Her attendance at ICRA 2024 was under the support of the IDEA (Inclusion, Diversity, Equity & Accessibility) grant from the IEEE Robotics and Automation Society (RAS). ICRA is one of the premier conferences in its field, alongside the International Conference on Intelligent Robots and Systems (IROS). Recipients of the IDEA award are sponsored by the IEEE RAS to travel and attend one of the conferences organized by the IEEE RAS. The IDEA award is a mentoring program, in which the awardees are paired with one or two mentors from the RAS WiE (Women in Engineering) Committee during the conference to help bring synergies with the RAS community. The awardees will assist and actively be involved in the organization team of one of the IEEE RAS WiE events at the conference. Read about Vanessa’s experience at https://ubdsds.substack.com/p/vanessa-at-the-2024-international."
