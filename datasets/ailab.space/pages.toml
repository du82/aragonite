["https://ailab.space/upgraded-our-turtlebot2-to-ros-noetic"]
title = "Upgraded our Turtlebot2 to ROS Noetic – AI Lab"
description = "Living with technologies ..."
full_description = "Upgraded our Turtlebot2 to ROS NoeticLab / By owh / July 23, 2023 / robolab, robot, robotics, ros, turtlebot, turtlebot2 We have upgraded our Turtlebot2 to ROS Noetic on Ubuntu 20.04. The Turtlebot2 was previously running on ROS Kinetic. . In the video above, the Turtlebot2 was mapping out the office floor of the School of Digital Science, UBD. It was controlled wirelessly with a PS3 controller. The video has been speeded up x2. Turtlebot2 is most supported in ROS Kinetic on Ubuntu 16.04, with many packages been upgraded to ROS Melodic (Ubuntu 18.04) and Noetic. However, documents found are mostly not updated and remain based on ROS Kinetic or older versions. We kept our notes of installing Turtlebot2 software on ROS Noetic from scratch or bare metal. The notes can be found at https://github.com/ailabspace/turtlebot2-noetic. Hopefully it will be helpful to those who want to upgrade their Turtlebot2 to work in Python3 and the Ubuntu 20.04 environment. We will update the notes as we add more functionalities."
