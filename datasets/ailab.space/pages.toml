["https://ailab.space/events/abu-robocon"]
title = "ABU Robocon – AI Lab"
description = "Living with technologies ..."
full_description = "ABU Robocon I can not recall any interest in robotics during my school time, and even until I graduated from the university with a control engineering degree. It was not until I attended a workshop at Bangkok that I started to gain interest in robotics. That was in May 2000. It was the “Regional Workshop on Industrial Applications of Control Technology: Mechatronics” conducted at the Thai-French Innovation Center, Bangkok, Thailand. During the workshop, I had the opportunity to see some robotic projects and visited some of their mechatronic facilities. Though brief, they were interesting exposures for me. In addition, the Indonesian participant in the workshop shared his experience in robotic projects. With his active participation in international robotic competitions, he has developed relationship and collaboration with researchers from Japan. Something that I would dream for. Few months later, in Sep 2000, I saw an exhibition of a Singapore university at the 1st APEC Youth Camp held at Ulsan, Korea. The Singapore university exhibited a student project on obstacle avoidance robot. That was interesting and more importantly seem doable for us. With these exposures, I initiated a project in Obstacle Avoidance Vehicle in the following year. It was a modification to a cheap remote control car and wasn’t really close to a ‘robot’. Nevertheless, an important start. I still remember the student vividly. Lee Kin Foo is the first student who worked on my robotic project. It was with Kin Foo that I learned to use the Eagle PCB Layout Editor and the Microchip PIC microcontroller. One day in January 2003, I was called to the Principal’s office. Cikgu Nazamshah, the Principal at that time, passed me two Takraw balls and asked if I would like to participate in the Asia-Pacific Broadcasting Union (ABU) Robot Contest (Robocon). Could this be a dream come true? Participation in an international (well, regional to be more specific) robotic competition?! I was informed that the Asia-Pacific Broadcasting Union (ABU) strongly encouraged Brunei to participate in its annual robot contest (Robocon), and that the balls reached MKJB, a college, after other local higher institutions declined to participate. I knew we only had about six months to work on it, from scratch. However, it was an opportunity that I didn’t want to miss. Without appropriate facility and without relevant knowledge and experience, apart from the Obstacle Avoidance Vehicle, we then had to make robots that would stand at 3 metres high. I picked my army and kicked start the project. Seven men, months of sleepless nights, we ventured into the Robocon! We shivered when we saw the others’ robots in the given demo CD. We were uncertain if we would make it to the competition as we were searching for parts and ideas, while others were creating and improving their robots. However, we persisted. It was this persistence that made us to carry Brunei’s flag, for the first time, in an international robotic competition. Since then robotic enthusiasts at MKJB, continued to work on robotic projects, as well as other engineering projects. Over the years in MKJB, Jemee (Norjemee Jenek) had became my best team mate after Terry (Terry Jayasuriya) moved to Brunei Shell Petroleum Company Sdn Bhd. As I try to learn more on robotics, my interest in it also grows. MKJB has represented Brunei in ABU Robocon for five consecutive years, and was unbeatable in Robocon locally. I participated, with my teams, in Robocon 2003, 2005 and 2006. I missed Robocon 2004 as I was at UK doing MSc. I joined UBD in March 2007. I started to plan for the Robocon project in UBD. I was then back to the situation that I was in five years ago. I had to build up the resources (space, facilities) from scratch and identify the team. After two years in UBD, I managed to start up robotics in the Faculty of Science (FOS) and set up a simple robotic lab. With a few students, we worked on Robocon and a few other robotic projects. The changing theme of Robocon each year introduces new challenges each year. Overcoming new challenges is a way to make progress. Having to work in conformation to the preset requirements/rules, rather than setting own requirements to work on, is what makes Robocon a tough challenge. Apart from the technical challenges, financial constraint is an inherent problem in every year. While in MJKB, I had support from the school, colleagues as well as the companies. While in UBD, I had support from the bursar office in expediting procurement of resources. While we require more fund than we could obtain, the supports from the various parties had allowed me to continue working on Robocon for quite a few years. Perhaps the biggest challenge is there is no place to get electronic and robotic parts in Brunei. We would have to order from overseas and the process is time consuming and expensive. In UBD, we worked for the 2009 Robocon and won the local competition to represent the country in the Asia-Pacific event in Japan. However, due to the H1N1 pandemic, we were not able to the attend the event. The team continued to work in 2010. For the first time a university in Brunei participated in the Asia-Pacific Robocon held in Cairo, Egypt. It was an eye opening and rewarding exposure for the students. I took a leave from UBD to do my PhD in 2010. My colleague Chong (Chong Kim Onn) continued to lead the Robocon and robotic team. They made significant advance in the robots and represented the country in ABU Robocon in 2011 and 2012. While we enjoyed the experiences, Robocon demands more technical skills, resources, time and dedicated team members than we can have in our current environment. I have to move on with other responsibilities after returning from my PhD after my last participation in Robocon in 2010. The Asia-Pacific Broadcasting Union Robot Contest (ABU Robocon) Asia-Pacific Broadcasting Union (ABU) Robocon is an annual robot contest starting from 2002, just for university/college students in the Asia-Pacific region. Under a common set of rules, participants will compete with their peers in other countries to create robots using their creative and technological abilities in an open competition. This contest aims to create friendship among young people with similar interests who will lead their countries in the 21st Century, as well as help advance engineering and broadcasting technologies in the region. This event will be broadcast in participating countries through an ABU member broadcaster. In Brunei Darussalam, Radio Television Brunei is a member broadcaster in ABU. The changing theme of Robocon each year introduces new challenges each year. Overcoming new challenges is a way to make progress. Having to work in conformation to the preset requirements/rules, rather than setting own requirements to work on, is what makes Robocon a tough challenge. – | 2002 | 2003 | 2004 | 2005 | 2006 | 2007 | 2008 | 2009 | 2010 | Wikipedia Info | – ABU Robocon 2002: “Reach for the top of Mt. Fuji” 31 Aug 2002 | Tokyo, Japan The aim of this contest is to compete for points by placing beach balls into seventeen “Tubes” which they have “reach the summit”, that is, when five consecutive “Tubes” are occupied in a diagonal line, which must also include the highest center “Summit” Tube(which represents the top of Mt. Fuji). The duration of each match is three minutes. The overall tournament involved preliminary and final rounds. This was the first ABU Robocon. RTB attended the event, however there was no Brunei participation. Rule Animation | Rule | This is Robocon [V2] | Top List ABU Robocon 2003: “Takraw Space Conqueror” 24 Aug 2003 | Bangkok, Thailand The aim of this contest is to shoot Takraw Balls into 9 baskets comprised of 3 nets in a triangular shape to compete for points. A team is considered the winner when the balls are shot into all baskets including 3 nets of centered basket or when one team scores more point than the opponent. The duration of each game is 3 minutes. This is the year we first learned about the ABU Robocon when the Science, Technology and Environment Partnership (STEP) Center in the Ministry of Education approached MKJB to solicit Brunei participation. This was the first time Brunei participated in Robocon. I supervised the team with the help from Jemee. Sarimah from STEP center and Iskandar from OGDC regularly visited us and brought us food and drink. The deputy principal, Affandy, was supportive and appeared often in our workshop at night. Terry visited us occasionally. Many friends were supportive and hoping for us to be able to deliver the robots. We have also received coverage by the ABU from Japan. They recorded the team at work as well as the daily life of one of the members, Khalid. We called our team SAMOT. A combination of SAMut (ants) and robOT, indicating our awareness of being small and calling for hardwork. The team struggled to build the robots without appropriate knowledge, skills and facilities. Imagine driving a 25kg machine with 3V motors. Well, that was how we started. This year, we were the only participating team from Brunei, and so SAMOT team from MKJB automatically represented the country. Despite being a really tough task, the SAMOT team gave their full commitment to deliver the robots. These robots had to pass stringent tests before they were allowed to play on the field. At Bangkok, Brunei drawn to play against Malaysia (represented by Univesiti Teknologi Malaysia) and Korea (represented by Chungnam National University). Both teams were much stronger than us, and practically beaten us. However, due to an accidental contact by the manual operator of the Korean team with our manual robot, the Korean team was disqualified and Brunei declared winner in this match. It wasn’t how we wanted to win a match. Rule Animation | Rule | Robot Check | This is Robocon [V2] | Results | Team Report | The Team | Photos | Documentary | Top List ABU Robocon 2004: “Reunion of Separated Lovers, ‘Gyeonwoo and Jiknyeo'” 11 Sep 2004 | Seoul, Korea The theme of this contest is based on a love story in Asian legend. A couple called ‘Gyeonwoo & Jiknyeo’ are forced to be apart from each other with the Milky Way between them due to their laziness. Magpies and crows which feel sorry for the couple fly up to the sky and build a bridge with their bodies to get the couple together. It is called ‘Ojak Bridge’ (Bridge of Crow and Magpie). The couple get together by crossing ‘Ojak Bridge’ once a year, on July 7th by lunar calendar. It always rains on this day and we say that it is the tears of joy from Gyeonwoo and Jiknyeo for their reunion. The aim of this contest is to compete for accomplishing “Reunion” by completing the unfinished bridge and carrying Golden Gift by Automatic Machine from “Gyeonwoo Zone (Zone A)” to “Jiknyeo Zone (Zone B)”. The duration of each match is three minutes. The second year MKJB represented Brunei at ABU Robocon. Another local institution, Sultan Saiful Rijal Technical College (or Maktab Teknik Sultan Saiful Rijal MTSSR) expressed interest in participating and an informal local competition (or selection) was held. MKJB’s robots appeared more convincing to the judges and was selected to represent Brunei at Seoul. This year, SAMOT team from MKJB played against Chungnam National University of Korea (again!) and Academic Center for Education Culture and Research of Iran. Despite having builded much better robots than the previous year, the opponent teams proved to be much stronger than us. We have a great deal to improve. I did not supervise the SAMOT team in 2004. SAMOT 2004 was supervised by Norjemee. Rule Animation | Rule | This is Robocon [V2] | Results | Team Report | The Team | Photos | Top List ABU Robocon 2005: “Climb on the Great Wall, Light the holy fire” 27 Aug 2005 | Beijing, China The Great Wall is one of the greatest feats of construction the world has ever seen. This ancient monument is not only a cultural heritage site with great significance for China, but also a major tourist attraction, known all around the world. Foreign tourists know that a visit to China is not complete without a trip to the Great Wall, a symbol of China’s ancient civilization and humankind’s powerful ability to shape our surroundings. There is an old Chinese saying: “You are not truly a strong man until you have climbed to the top of the Great Wall”. Now let’s climb up the Beacon Tower of the Great Wall and light the holy fire there! The aim of this contest is to climb the Great Wall and feed Fuel Balls into five Torches and four Bonfires by collaboration between Manual and Automatic machines. The duration of each match is three minutes. This year saw the most rewarding year for the SAMOT team. SAMOT team again defeated the team from MTSSR in a well organized local competition held at the auditorium of MTSSR. In the local competition, half game field was set up and each competing team complete the game independently. The higher scorer was declared winner. With extra-ordinary committment and determination from this year’s team members, SAMOT’s robots had seen great improvement. Five autonomous robots, fitted within an area of 1x1m, and one manual robot were builded. The team was determined to win in Beijing. Well. When we drawn to play against Vietnam and China in the preliminary round, we knew we were given tough challenge again. Vietnam was a two times champion in Robocon. Vietnam was represented by Hanoi University of Technology. China was represented by University of Scinece & Technology Beijing (and another team) which ended as 1st runner up in Robocon 2005. Despite losing to both teams, SAMOT had shown its great potential and was awarded the Toyota Award. Jemee and myself supervised the team in this year. Rule Animation | Rule | This is Robocon [V2] | RTB News | Results | Team Report | The Team | Photos | Documentary | Short Video | Top List ABU Robocon 2006: “Building the World’s Tallest Twin Tower” 10 Sep 2006 | Kuala Lumpur, Malaysia The 88-storey 452m high PETRONAS Twin Towers (KLCC) is currently the tallest twin towers in the world and the most prominent landmark of Kuala Lumpur City Centre. Located strategically in the heart of vibrant city of Kuala Lumpur, this largely steel and glass structure soon become a must-to-see place for visitors to the city. Interestingly, the two towers are connected by the skybridge for visitors who wish to have a glimpse of Kuala Lumpur from the top. Its completion in 1995 signifies one of the milestones towards Malaysia achieving Vision 2020.The twin towers house the PETRONAS corporate headquarters and offices. The Suria Mega Shopping Mall is designed as a hub of retail and entertainment. The contemporary offerings of the Dewan Philharmonic add the kaleidoscope of activities of the Twin Towers. Well planned parks, greens and gazebos reflect the possible harmonious balance of nature and steel that design can create. The main objective of this contest is "
