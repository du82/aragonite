full_description = "CO-2206 Introduction to Computer Organisation Students are expected to read both CO-2103 Introduction to Assembly Language and CO-2206 Introduction to Computer Organisation in parallel. The two courses complement each other. Acknowledgement: The course materials have been curated from various sources including books, online resources and teaching materials from other lecturers. Please see the acknowledgement in Introduction slides. Course Content (Lectures): Introduction Digital Logic Analog vs Digital Digital Systems Logic Signal Integrated Circuit (IC) Logic Gates Boolean Algebra Logic Circuit Design The Process Standard Forms Simplification techniques Algebraic manipulation Karnaugh Map (K Map) Quine-McCluskey method Implementation matters Circuit Implementation 2-level implementations XOR Implementation Hi-Z and Enable Combinational Logic Networks Design process refined Design example Combinational Functional Blocks Decoders / Encoders Multiplexers / Demultiplexers Arithmetic VHSIC Hardware Description Language Hardware Description Language VHDL History VHDL Characteristics Abstract Levels in IC Design Abstract Levels and VHDL VHDL – file structure, syntax VHDL Models: Structural, Behavioral Test Bench Sequential Logic Networks Basics Building Blocks: Latches and Flip-Flops Sequential Circuit Analysis Sequential Circuit Design Registers and Register Transfers Registers Register with Parallel Load Register Transfer Operations Microoperations Register Transfer Language Shift Registers Counters Register Cell Design Register Transfer Structures Serial Operations Computer Design Basics Digital Systems – Datapath and Control Unit Datapath Arithmetic Logic Unit Shifter Function Unit Control Word Control Unit Instruction Set Architecture Instruction Format Instruction Specification Single-cycle Hardwired Control Instruction Decoder Single Cycle Computer Issues RISC and CISC RISC vs CISC Pipelining RISC Implementation Modifications ISA Organization Da