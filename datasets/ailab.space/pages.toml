full_description = "Teleop and digital twin of Niryo NED 6-DoF robotic arm Lab, Students, Teaching / owh / December 12, 2022 The School of Digital Science has acquired a Niryo NED 6-DoF robotic arm. This added opportunities for us to experiment with manipulation tasks in robotic. The video below is our first project with the NED. This is a lab project by three third year students in the Bachelor of Digital Science: Firdaus, Luqman and Farah. […] Teleop and digital twin of Niryo NED 6-DoF robotic arm Read More » Research assistant position for human activities discovery project Research / owh / November 30, 2022 We are hiring a full-time research assistant (RA) for our human activities discovery project. The work should start in Jan 2023. . The RA will implement the software system we have developed for unsupervised human activity discovery on a Turtlebot 2 mobile robot. This will involve integrating the software system alongside the Navigation stack in Research assistant position for human activities discovery project Read More » SLAM has been implemented on the Wanderer-v1 Research / owh / November 2, 2019 Amirul has implemented the Simultaneous Localization And Mapping (SLAM) on our Wanderer-v1 robot. The implementation was done from scratch involving writing Python scripts for the kinematics, motion and sensor models, particle filter for localization and A-star search for path planning. Details of the project is available here. SLAM has been implemented on the Wanderer-v1 Read More » ROS based SLAM on our Eddie mobile robot Research / owh / October 22, 2019 Hafiq has completed the implementation of the navigation ability for our Parallax Eddie mobile platform. The above video was recorded outside the Robolab V3 in the Integrated Science Building in the Universiti Brunei Darussalam (UBD). There wasn’t a long indoor corridor in the building that we could run the robot. Details of this project is ROS based SLAM on our Eddie mobile robot Read More »"
