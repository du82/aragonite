full_description = "Usman Khalil – Ph.D. USMAN KHALIL is associated with the Virginia Tech Lab at Universiti Brunei Darussalam which is an international collaboration laboratory between Universiti Brunei Darussalam and Virginia Polytechnic Institute and State University (Virginia Tech-VT) United States. He obtained his Ph.D. and MS in Computer Science majoring in Cybersecurity and Data Science from Universiti Brunei Darussalam (UBD) in 2024 and 2019 respectively. With over fourteen years of professional experience in the telecom industry in Pakistan and Malaysia, Usman Khalil previously worked as a Telecom professional. His research interests focus on exploratory pattern recognition algorithms for the analysis, data mining, clustering, integration of the Internet of Things with cloud computing, and the integration of the Internet of Things with blockchain. He is serving as an invited Editor in the Innovative Informatics and Artificial Intelligence Research (IIAIR). He is also serving as an invited reviewer in reputed journals, including IEEE Access, Journal of Electrical Engineering & Technology, SN Applied Sciences, Bulletin of Electrical Engineering, and Informatics, PLOS ONE, Measurement Sensors, Cluster Computing, The Journal of Super Computing, Peer to Peer Networking and Applications, International Journal of Power Electronics and Drive Systems (IJPEDS), etc. Position (s) and affiliation (s): School of Digital Science, Universiti Brunei Darussalam, Jalan Tungku Link, Gadong BE1410, Brunei Darussalam. Google Scholar: https://scholar.google.com/citations?hl=en&user=93cFa4MAAAAJ ORCID: https://orcid.org/0000-0001-8550-1557 Research Gate: https://www.researchgate.net/profile/Usman-Khalil-4 LinkedIn: https://bn.linkedin.com/in/usman-khalil-80b21b46 EDUCATION – Ph.D. (Computer Science – Blockchain Architecture for NFT-based Secure Assets Authentication in Cyber-Physical Systems) – MSc (Computer Science – Machine Learning in Health Care for Pattern Recognition), BS (Information Technology) RESEARCH INTERESTS Cybersecurity & Forensics, Blockchain, Blockchain Tokenization, Network & Information Security, Machine Learning, Data Analytics/Big Data Analytics, Deep Learning, FUTURE PROJECTS BLOCKCHAIN FOR SECURING IOT ENABLED CYBER-PHYSICAL SYSTEMS & INFRASTRUCTURES BLOCKCHAIN FOR SECURE AND EFFICIENT MANAGEMENT FOR HEALTHCARE SYSTEMS DEEP LEARNING/LLM, AND DATA ANALYTICS FOR MULTIDISCIPLINARY PROJECTS. The projects related to decentralized networks in Cyber-Physical Systems for Smart City Architecure, Blockchain Tokenization, NFTs based authentication and authorization in Cyber-Physical Systems (such as health care, houses and Electric Grids etc.), and data analytics are available for discussion in domains specially digital healthcare. RECENT PUBLICATIONS Khalil, O. A. Malik, O. W. Hong, and M. Uddin, “A Novel NFT Solution for Assets Digitization and Authentication in Cyber-Physical Systems: Blueprint and Evaluation.” has been published in the IEEE Open Journal of the Computer Society I.F. 5.9, vol. 5, pp. 1–12, 2024. Available at https://ieeexplore.ieee.org/document/10474129 Khalil and M. Uddin “NFTs for the Unassailable Authentication of IoT Devices in Cyber-Physical Systems: An Implementation Study” [Accepted in Conference on Creativity, Technology, And Sustainability (CCST 2024). RECENT SUBMISSIONS (2024) A Dandoush, V Kumarskandpriya, M Uddin, U Khalil, “Large Language Models meet Network Slicing Management and Orchestration” has been submitted in the [IEEE Transactions on Network and Service Management – I.F. 5.3] A Dandoush, M Uddin, U Khalil, Shankar K “Mapping the Post-Quantum Landscape for Enhanced Resilience: A Survey of Advancements” has been submitted in the [Submitted – EURASIP Journal on Information Security – IF. 4.677] Khalil and M. Uddin “NFTs for the Unassailable Authentication of IoT Devices in Cyber-Physical Systems: An Implementation Study” [Accepted in Conference on Creativity, Technology, And Sustainability (CCST 2024). EXPECTED BOOK PUBLICATION (Feb 2025) Khalil, O. A. Malik, M. Uddin and, Abdulhalim Dandoush “Non-Fungible Tokens (NFTs) in Smart Cities: Advancements and Security Challenges” [Book under publication by IGI Global, Pennsylvania, USA] Book CFC can be viewed for further information at the following link –> “https://www.igi-global.com/publish/call-for-papers/call-details/7929” TOP PUBLICATIONS A Comparative Analysis on Blockchain versus Centralized Authentication Architectures for IoT-Enabled Smart Devices in Smart Cities: A Comprehensive Review, Recent Advances, and Future Research Directions has been published in MDPI Journals – Sensors I.F. 3.487. Available at Sensors 2022, 22(14), 5168; https://doi.org/10.3390/s22145168 & https://pubmed.ncbi.nlm.nih.gov/35890848/. A Blockchain Footprint for Authentication of IoT-Enabled Smart Devices in Smart Cities: State-of-the-Art Advancements, Challenges and Future Research Directions has been published in IEEE ACCESS – I.F. 3.476. Available at https://ieeexplore.ieee.org/document/9827661/authors#authors, Page(s): 76805 –76823, DOI: 10.1109/ACCESS.2022.3189998 U. Khalil, O. A. Malik, D. Lai and O. S. King, “Cluster Analysis for Identifying Obesity Subgroups in Health and Nutritional Status Survey Data.” https://www.ukm.my/apjitm/article/ec8ce6abb3e952a85b8551ba726a1227/DMO PUBLICATIONS A Comparative Analysis on Blockchain versus Centralized Authentication Architectures for IoT-Enabled Smart Devices in Smart Cities: A Comprehensive Review, Recent Advances, and Future Research Directions has been published in MDPI Journals – Sensors I.F. 3.487. Available at Sensors 2022, 22(14), 5168; https://doi.org/10.3390/s22145168 & https://pubmed.ncbi.nlm.nih.gov/35890848/. A Blockchain Footprint for Authentication of IoT-Enabled Smart Devices in Smart Cities: State-of-the-Art Advancements, Challenges and Future Research Directions has been published in IEEE ACCESS – I.F. 3.476. Available at https://ieeexplore.ieee.org/document/9827661/authors#authors, Page(s):76805 –76823, DOI: 10.1109/ACCESS.2022.3189998 Decentralized Smart City of Things: A Blockchain Tokenization-enabled Architecture for Digitization and Authentication of Assets in Smart Cities has been published in CCIOT ’22: Proceedings of the 2022 7th International Conference on Cloud Computing and Internet of Things, September 2022, Pages 38–47 Available at https://doi.org/10.1145/3569507.3569513 in the Association for Computing Machinery Digital Library. Khalil, O. A. Malik, O. W. Hong, and M. Uddin, “Leveraging a novel NFT-enabled blockchain architecture for the authentication of IoT assets in smart cities” has been published in Scientific Reports I.F. 4.997, 131, vol. 13, no. 1, pp. 1–26, Nov. 2023. Available at https://www.nature.com/articles/s41598-023-45212-1 K, Usman and Malik, Owais Ahmed and Ong, Wee Hong, and Uddin, Mueen, Dscot: An Nft-Based Blockchain Architecture for the Authentication of Iot-Based Smart Devices in Smart Cities. Available at SSRN: https://ssrn.com/abstract=4355848 or http://dx.doi.org/10.2139/ssrn.4355848 Usman Khalil, Owais Ahmed Malik, Ong Wee Hong, and Mueen Uddin. 2022. DSCOT: An NFT-Based Blockchain Architecture for the Authentication of IoT-Enabled Smart Devices in Smart Cities. arXiv 1, 1: 1–14. Retrieved March 30, 2023 from https://arxiv.org/abs/2211.04803v1 Khalil, O. A. Malik, O. W. Hong, and M. Uddin, “A Novel NFT Solution for Assets Digitization and Authentication in Cyber-Physical Systems: Blueprint and Evaluation.” has been published in the IEEE Open Journal of the Computer Society I.F. 5.9, vol. 5, pp. 1–12, 2024. Available at https://ieeexplore.ieee.org/document/10474129 Khalil, O. A. Malik, O. W. Hong, and M. Uddin, “Unlocking the potential of Novel NFTs for IoT asset authentication in cyber-physical systems: A perspective on design and implementation.” [Submitted to the Heliyon Journal I.F. 3.776] Khalil and M. Uddin “NFTs for the Unassailable Authentication of IoT Devices in Cyber-Physical Systems: An Implementation Study” [Accepted in Conference on Creativity, Technology, And Sustainability (CCST 2024). Khalil, O. A. Malik, O. W. Hong, and M. Uddin, “Non-Fungible Tokens (NFTs) in Smart Cities: Advancements and Security Challenges” [Book Proposal: Submitted to the Springer Nature] U. Khalil, O. A. Malik, D. Lai and O. S. King, “Profiling Obese Subgroups in National Health and Nutritional Status Survey Data using Categorical Principal Component Analysis – A Case Study from Brunei Darussalam” Available at https://biomedres.us/fulltexts/BJSTR.MS.ID.007641.php U. Khalil, O. A. Malik, D. Lai and O. S. King, “Cluster Analysis for Identifying Obesity Subgroups in Health and Nutritional Status Survey Data.” Available at https://www.ukm.my/apjitm/article/ec8ce6abb3e952a85b8551ba726a1227/DMO U. Khalil, O. A. Malik, D. Lai and O. S. King, “Identifying sub-groups of the obese from national health and nutritional status survey data using machine learning techniques,” 7th Brunei International Conference on Engineering and Technology 2018 (BICET 2018), Bandar Seri Begawan, Brunei, 2018, pp. 1-4. Available at https://ieeexplore.ieee.org/document/8732967 INDUSTRY EXPERIENCE Regional Operations Manager at UK General Traders Sdn. Bhd, Kota Kinabalu, State of Sabah, Malaysia. Executive Secretary to President at Rotary Club of Tawau, Tawau, State of Sabah, Malaysia. URL: https://www.facebook.com/rotaryclub.tawau/ Manager Sales & Service Centre at CMPAK Pvt Limited, 7th Mauve Area, G9/, Islamabad, Pakistan. URL: https://www.zong.com.pk/ Customer Services & Support Executive at Mobilink PMCL Ltd (A Vimplecom Company) Islamabad, Pakistan. URL: http://www.mobilinkgsm.com.pk Facilitator / Senior Network Engg at E – Knowledge Pvt Limited, (U.S.A based Company) Customer Care Executive at DVCOM LDI Pvt Ltd. Lecturer / Assistant Network Administrator at College of Physicians & Surgeons Pakistan (A PM & DC Accredited Education College) URL: http://www.cpsp.edu.pk _____________