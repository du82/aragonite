["https://ailab.space/syamimis-paper-accepted-in-the-ieee-iv-2024"]
title = "Syamimi’s paper accepted in the IEEE IV 2024 – AI Lab"
description = "Living with technologies ..."
full_description = "Syamimi’s paper accepted in the IEEE IV 2024Research, Students / By owh / April 2, 2024 / conference, publication, self-driving, syamimi Syamimi’s paper on “A Comparison of Imitation Learning Pipelines for Autonomous Driving on the Effect of Change in Ego-vehicle” has been accepted to the 35th IEEE Intelligent Vehicles Symposium (IV) 2024. The conference will be held on 2-5 June in Jeju, South Korea. The IEEE IV Symposium is a premier conference in intelligent vehicles and systems. This paper presents a comparison of the effect of change in ego-vehicle in two different pipelines of imitation learning for autonomous driving (AD) between direct control-based and waypoint-based pipelines. Control-based pipeline involves predicting control signals directly to control the car, whereas a waypoint-based pipeline predicts the future trajectory of the car and uses a controller module to generate the control signals from the predicted waypoints. In this study, CIL++ was used for the control-based method whereas TransFuser was used for the waypoint-based method. In our experiments, we used CARLA simulator and deployed both imitation learning models, without retraining or re-tuning the controller parameters, on various cars different from the car used during training. We used Town05 from CARLA’s Leaderboard benchmark to evaluate the performance based on driving score, the main metric used in the benchmark. Based on the experiment results, TransFuser is more robust in adapting to different ego-vehicles than CIL++. TransFuser performed better when deployed to different vehicles. However, the performance still suffered when there was a significant change in the car classes. The source code of this work is made publicly available at https://github.com/ailabspace/Comparison-of-Autonomous-Driving-IL-Pipeline-for-Ego-Vehicle-Changes. Project page: https://ailab.space/projects/improving-egovehicle-control-in-deep-learning-training-pipeline-for-autonomous-cars/."
author = "owh"
year_published = 2024
