title = "Syamimi will participate in the RSS 2023 – AI Lab"
description = "Living with technologies ..."
full_description = "Syamimi will participate in the RSS 2023Students / By owh / June 28, 2023 / conference, fellowship, rss, syamimi Syamimi will attend the Robotics: Science and Systems conference (RSS 2023) to be held between Jul 10 – Jul 14, 2023 at Daegu, Republic of Korea. Syamimi has been awarded the RSS Inclusion fellowship. Congratulations to Syamimi! Noorsyamimi Haji Abdur Ajak is an MSc in Computer Science student at the School of Digital Science, Universiti Brunei Darussalam. She is currently working on imitation learning in autonomous driving for her MSc research and is supervised by Dr. Ong Wee Hong and Dr. Owais Ahmed Malik in the Robotics and Intelligent Systems Lab (Robolab). Her research interests include autonomous driving, robotics, and machine learning in interdisciplinary fields. She received her BSc in Computer Science from Universiti Brunei Darussalam. Website: https://sites.google.com/seas.upenn.edu/inclusion-rss-2023/fellows"
