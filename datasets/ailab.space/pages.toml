["https://ailab.space/events/devfest2023"]
title = "DevFest Brunei 2023 – AI Lab"
description = "Living with technologies ..."
full_description = "DevFest Brunei 2023 Workshop: Exploring Robot Programming with Python Date: Sunday, 3rd December 2023 Time: 2pm-4pm Venue: Lecture Hall 12, Laksamana College of Business Speakers: Hafiq Anas, Nazrul Ismail Embark on a robot programming journey! Learn Python basics for robotic systems, hardware components, and programming functions. Programming a Raspberry Pi-powered miniature robot. Form teams, compete, and cooperate in a game. Limited to 10 robots; additional participants collaborate in groups for hands-on learning. About the speakers: Hafiq is a PhD in Robotics student in the Robotics and Intelligent Systems Lab (Robolab), School of Digital Science, Universiti Brunei Darussalam (UBD). During his undergraduate studies, he solved an indoor navigation problem by designing an autonomous navigation system on a customized mobile robot using Robot Operating System (ROS). He has also worked as a Research Assistant in the Robolab at UBD and developed an Automatic Facial Expression Recognition (AFER) system. Currently, he is working on implementing a socially compliant navigation robot that can be deployed in crowded places using Deep Reinforcement Learning to imitate acceptable human behaviors. His research interests include robotics, machine learning, and the application of robots in the real world. Nazrul Ismail is a PhD student in Artificial Intelligence at the School of Digital Science, Universiti Brunei Darussalam (UBD), and a member of the Robotics and Intelligent Systems Lab (Robolab). His research work is on Biosonar-inspired technology for understanding bat perception in the context of Simultaneous Localization and Mapping (SLAM). He has worked in both academia and industry, successfully addressing Computer Vision challenges for botanical biodiversity as a Research Assistant at UBD and Real-time vision monitoring system at Brunei Shell Petroleum (BSP). His research interest lies at the intersection of Machine Perception and Sensor Fusion, combining acoustic and optics sensors for localization, and incorporates Machine learning techniques. If you will be joining the workshop, you will need a laptop with VNC viewer installed. VNC viewer: https://www.realvnc.com/en/connect/download/viewer/ For more information and free registration, please visit: https://gdg.community.dev/events/details/google-gdg-brunei-darussalam-presents-devfest-brunei-2023/ Related posts: https://ailab.space/tag/devfest2023/. Resources: Presentation slides Lab sheet Challenge (project) sheet Source codes"
