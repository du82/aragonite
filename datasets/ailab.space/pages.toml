s at Brunei Cybersecurity Conference (CySec) 2023 held at Tarindak D’ Seni (Serambi Suluh Hall) on 14 Sep. Hafiq, Nazrul, Syamimi, Raziq and Azryl exhibited their research in AI and robotics. At CySec 2023 Read More »"
