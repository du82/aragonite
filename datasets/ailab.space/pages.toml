description = "Living with technologies ..."
full_description = "Authentication for decentralized Cyber-Physical Systems This work is motivated by the need for a suitable authentication mechanism for our proposed decentralized File-based Internet of Things (IoT) System. NFT-based Authentication for Cyber-Physical Systems in Smart Cities Context This is Usman’s PhD work. In this work, we proposed a novel authentication mechanism for decentralized Cyber-Physical Systems (CPSs) by integrating block-chain technology and IoT with an expansion to the Non-Fungible Token (NFT) attributes to cater for the needs in CSPs. People Usman Khalil Owais Ahmed Malik (main supervisor) Ong Wee Hong Data/Codes Publications U. Khalil, M. Uddin, O. A. Malik and O. W. Hong, “A Novel NFT Solution for Assets Digitization and Authentication in Cyber-Physical Systems: Blueprint and Evaluation,” in IEEE Open Journal of the Computer Society, vol. 5, pp. 131-143, 2024, doi: 10.1109/OJCS.2024.3378424. (pdf) Khalil, U., Malik, O.A., Hong, O.W. et al. Leveraging a novel NFT-enabled blockchain architecture for the authentication of IoT assets in smart cities. Sci Rep 13, 19785 (2023). https://doi.org/10.1038/s41598-023-45212-1. (pdf) K, Usman and Malik, Owais Ahmed and Ong, Wee Hong and Uddin, Mueen, Dscot: An Nft-Based Blockchain Architecture for the Authentication of Iot-Based Smart Devices in Smart Cities. Available at SSRN: https://ssrn.com/abstract=4355848 or http://dx.doi.org/10.2139/ssrn.4355848. (pdf) Usman Khalil, Owais Ahmed Malik, Ong Wee Hong, and Mueen Uddin. 2022. Decentralized Smart City of Things: A Blockchain Tokenization-enabled Architecture for Digitization and Authentication of Assets in Smart Cities. In Proceedings of the 2022 7th International Conference on Cloud Computing and Internet of Things (CCIOT ’22). Association for Computing Machinery, New York, NY, USA, 38–47. https://doi.org/10.1145/3569507.3569513 (pdf) Media"
