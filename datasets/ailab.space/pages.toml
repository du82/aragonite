full_description = "New addition to Robolab: F-GT racing simulator cockpit Lab / owh / April 1, 2023 We have added the Next Level Racing F-GT simulator cockpit to our lab. Together with the Logitech G920 steering wheel and pedal, they allow us to drive in the Carla simulator comfortably. This comes handy for data collection in our autonomous driving research. We certainly need a larger screen for our set up. . This […] New addition to Robolab: F-GT racing simulator cockpit Read More » Our NAO is back alive Lab / owh / December 17, 2022 The battery pack of the NAO robot has “intelligent” charging circuit that prevents the battery from charging when the battery’s voltage falls below a set value. This would deem the battery useless and call for replacement. Our NAO was idle for about two years when restriction on physical activities was in place due to the Our NAO is back alive Read More » Robotic workshop at GDG Brunei DevFest 2022 Events, Lab, Students / owh / November 28, 2022 Syamimi and Haifq with a few members of Robolab will be conducting a robotic workshop at the DevFest Brunei 2022 organized by Google Developers Group (GDG) Brunei and Women Techmakers Brunei. Exploring Robot Programming with Python 👩🏽‍💻 Suitable for: Beginners and Intermediates in Robotics ⏰ Time & Room allocation: 1:30 pm – 3:30 pm at Robotic workshop at GDG Brunei DevFest 2022 Read More » Logitech G920 steering wheel and pedal added to Robolab Lab / owh / November 10, 2022 We have gotten the Logitech G920 steering wheel and pedal for our self-driving car project. It is much more natural to drive with the steering wheel and pedal than the keyboard and mouse. It works in Carla and will be used in the data collection phase. This will be Syamimi‘s toy for a while. Logitech G920 steering wheel and pedal added to Robolab Read More » We have started with our physical lab meetings Lab / owh / September 19, 2022 It had been a few years we couldn’t have physical lab meetings. We have started with our physical lab meetings Read More »"
