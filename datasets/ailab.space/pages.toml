full_description = "Teleop and digital twin of Niryo NED 6-DoF robotic armLab, Students, Teaching / By owh / December 12, 2022 / niryo, project, robot, robotics, sds, student, ubd The School of Digital Science has acquired a Niryo NED 6-DoF robotic arm. This added opportunities for us to experiment with manipulation tasks in robotic. The video below is our first project with the NED. This is a lab project by three third year students in the Bachelor of Digital Science: Firdaus, Luqman and Farah. They developed a web-based and a mobile app to teleop the NED robotic arm over the network. A digital twin is embedded on the UI. The development was done on Unity coupled with the PyNiryo, the Python API for Niryo’s robots. We still have a lot to improve."
