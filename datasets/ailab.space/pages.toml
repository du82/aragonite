full_description = "New session of Intelligent Systems LabTeaching / By owh / September 8, 2024 / nao-robot, stretch-2, teaching, za-3201 The new session for ZA-3201 Intelligent Systems Lab started with this semester. This is a compulsory module for students majoring in AI and robotics, and applied AI. In the previous two sessions, we worked on the Niryo NED six dof robotic arm. This session, we are working on the Nao robot and the Stretch 2 from Hello Robot. It has been a while Nao was doing nothing. Given its age, the battery has lost its capacity. Its intelligent charger would not charge the battery. So, it needed a surgery to manually charge the cells. Oh, we have not mentioned that the School of Digital Science recently acquired the Stretch 2 from Hello Robot. It may be not look appealing in comparison with Nao, however it is a popular mobile manipulator robot for teaching and research."
