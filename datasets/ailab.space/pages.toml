full_description = "Hafiq’s paper on social navigation accepted in UR 2024 Research, Students / owh / April 25, 2024 Hafiq’s paper on “Deep Reinforcement Learning-Based Mapless Crowd Navigation with Perceived Risk of the Moving Crowd for Mobile Robots” has been accepted to the 21st International Conference on Ubiquitous Robots (UR 2024) to be held at the Kimmel Center for University Life in NYU, Manhattan, New York, USA, from June 24 to 27, 2024. This […] Hafiq’s paper on social navigation accepted in UR 2024 Read More » ROBOTIS mentioned Hafiq’s work Research, Students / owh / October 24, 2023 Thank you for the mention. 強化学習の研究でTurtleBot3が使われていて，Gazebo上でのシミュレーション実験だけでなく，実機実験までやっていて凄い．#ROS #Gazebo #TurtleBot3 pic.twitter.com/LHcRCFx4HV — 東海林ファジィロボット研究所 所長 (@Toukairinn_FUZZ) October 28, 2023 ROBOTIS mentioned Hafiq’s work Read More » Hafiq presented his work at IROS 2023 workshop Research, Students / owh / October 7, 2023 Hafiq’s paper on “Deep Reinforcement Learning-Based Mapless Crowd Navigation with Perceived Risk of the Moving Crowd for Mobile Robots” was accepted to the 2nd Workshop on Social Robot Navigation: Advances and Evaluation (papers) held in conjunction with IEEE International Conference on Intelligent Robots and Systems 2023 (IROS 2023) on 5 October. We couldn’t travel to Hafiq presented his work at IROS 2023 workshop Read More » Hafiq’s DRL-based robot is doing well in crowd navigation Research / owh / March 5, 2023 Hafiq’s Deep Reinforcement Learning-based robot is doing well in crowd navigation. The DRL model was trained in one crowd setting and tested in different unseen crowd settings. In simulation, we have tested with up to 12 moving obstacles at a speed close to the robot. In real-world, we have tested with 4 obstacles at a Hafiq’s DRL-based robot is doing well in crowd navigation Read More » SLAM has been implemented on the Wanderer-v1 Research / owh / November 2, 2019 Amirul has implemented the Simultaneous Localization And Mapping (SLAM) on our Wanderer-v1 robot. The implementation was done from scratch involving writing Python scripts for the kinematics, motion and sensor models, particle filter for localization and A-star search for path planning. Details of the project is available here. SLAM has been implemented on the Wanderer-v1 Read More »"
