title = "Hafiq will attend RSS 2024 – AI Lab"
description = "Living with technologies ..."
full_description = "Hafiq will attend RSS 2024Students / By owh / June 13, 2024 / conference, hafiq, rss Hafiq has been awarded the Inclusion Fellowship by the Robotics: Science and Systems (RSS). He will attend the 20th RSS conference that will be held at the Delft University of Technology, Delft, Netherlands in July 15-19, 2024. Congratulations Hafiq! I am a first-year PhD student in Robotics at the School of Digital Science, Universiti Brunei Darussalam (UBD). I am part of the Robotics and Intelligent Systems Lab (Robolab) where I work on Social Robot Crowd Navigation based on Deep Reinforcement Learning with my advisors, Dr. Ong Wee Hong and Dr. Owais Ahmed Malik. I received my BSc in Computer Science and MDSc in Artificial Intelligence with Distinction at UBD. My research interests include autonomous navigation, robotics, and machine learning in interdisciplinary fields. Inclusion@RSS Fellows: https://sites.google.com/view/inclusionrss2024/fellows"
