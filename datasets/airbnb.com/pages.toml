["https://airbnb.com/help/article/3227"]
title = "AirCover for guests and travel, reservation, or stay protection insurance - Airbnb Help Center"
description = "AirCover for guests is different from travel, reservation, or stay protection insurance. Find out more."
full_description = "AirCover for guests is different from travel or reservation, or stay protection insurance. AirCover for guests is included with every booking, while travel insurance for residents in parts of the EU (excluding France) and UK, travel insurance and assistance services for residents in the US, certain Canadian provinces, stay protection (for residents of Australia), or reservation insurance (for residents in France) can be purchased separately during checkout. If there’s a serious issue with your Airbnb that your host can't resolve, we’ll help you find a similar place, depending on availability at comparable pricing. If a similar place isn’t available or you’d prefer not to rebook, we’ll give you a full or partial refund. AirCover for guests provides support if your host cancels within 30 days of check-in, you’re unable to check-in, or the listing is significantly different than advertised and your host can’t fix it or you feel unsafe in your Airbnb. Travel is rewarding, but sometimes things don’t go as expected. People can get sick, flights can get canceled, and bags can go missing. To help protect you financially, there’s travel, reservation, or stay protection insurance. Don’t live in any of the above countries? Guests everywhere can purchase travel insurance outside of Airbnb, directly through a travel insurance company’s website or by shopping around on a comparison site. Here’s an example of how AirCover for guests and travel, reservation, or stay protection insurance can work together. You arrive at your destination and learn that the airline has sent your baggage to the wrong city and you won’t get it back for at least 24 hours. You then check-in at the place to stay and find out that the number of bedrooms at the place are less than advertised. In this situation, AirCover for guests can help you ﬁnd a new place to stay, depending on availability at comparable pricing. If you purchased travel, reservation, or stay protection insurance with your Airbnb reservation or booking, you can also ﬁle a claim with Generali, Europ Assistance, or Chubb to get reimbursed for certain extra things you have to buy while waiting for your baggage, like clothing and toiletries."
