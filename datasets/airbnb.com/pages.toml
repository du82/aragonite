["https://airbnb.com/resources/hosting-homes/a/how-to-find-a-co-host-on-airbnb-695"]
title = "Find the right co-host on Airbnb - Resource Center - Airbnb"
description = "Find and hire a local co-host to help manage your listing on the Co-Host Network. Get help with listing setup, cleaning, guest support, and more."
full_description = '''{"@context":"http://schema.org/","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Resource Center","item":"https://www.airbnb.com/resources/hosting-homes"},{"@type":"ListItem","position":2,"name":"New features & policies","item":"https://www.airbnb.com/resources/hosting-homes/t/new-features-policies-30"},{"@type":"ListItem","position":3,"name":"Find the right co-host on Airbnb","item":null}]}Resource Center New features & policies Find the right co-host on Airbnb Find the right co-host on AirbnbGet high-quality, local support through the Co-Host Network.By Airbnb on Oct 16, 2024 · 2 min readUpdated Oct 16, 2024Now you can easily find and hire a co-host to help take care of your home and guests, right in the app. Co-Host Network connects you with high-quality, local co-hosts who provide support based on your needs. Choose from a list of potential partners, see their experience, start working together, and share payouts.Find a co-hostA co-host can do the hosting for youYou can hire a co-host whether you’re a prospective, new, or seasoned host. Ask a co-host to handle specific tasks—or host for you. Their services can include:Listing setupSetting prices and availabilityBooking request managementGuest messagingOnsite guest supportCleaning and maintenanceListing photographyInterior design and stylingLicensing and hosting permitsCo-hosts may add other services, like landscaping, business analysis, and hospitality coaching. You’ll find details about the services a co-host provides on their profile.Co-hosts on the network are some of our best hosts. On average, co-hosts have an overall rating of 4.86 stars from guests and four years of experience on Airbnb. Today, 73% are Superhosts, and 84% host at least one listing that’s a Guest Favorite.Co-Host Network is currently available in Australia, Brazil, Canada, France, Germany, Italy, Mexico, Spain, the UK, and the US. The network will expand to more countries in 2025.It’s easy to use the Co-Host NetworkUse the Co-Host Network to search for and connect with someone who offers the services you need.Find a co-host:Enter your home’s address to search the network for someone nearby. You’ll see profiles of local co-hosts, ranked by factors like location, engagement, and quality.Select a co-host’s profile to find out more about them—their experience, past reviews, listings they host, pricing, and other details.Send a message to each of your top choices. Introduce yourself and share a bit about your needs.Consider asking additional questions and discussing your hosting expectations.Hire a co-host:Decide who you’d like as a co-host, and consider putting the details of your partnership in a formal agreement.Go to your listing on Airbnb. Send your new partner an invitation to co-host, and set up their permissions for your listing. They’ll have two weeks to accept.Choose to share part of your payout for each booking through Airbnb.*All the tools you need to collaborate with a co-host are in the app. You can:Message a co-host directly.Invite them to host your listing.Set their permissions for managing your listing.Share payouts on bookings with your co-host.*Find a co-hostLearn about becoming a co-host*Some restrictions apply, depending on the location of the host, co-host, and listing.Co-Host Network is available in France, Spain, Italy, Germany, the United Kingdom, Australia, Mexico (powered by Airbnb Global Services Limited), Canada, the United States (powered by Airbnb Living LLC), and Brazil (powered by Airbnb Plataforma Digital Ltda).Hosts on the Co-Host Network typically have high ratings, low cancellation rates, and established Airbnb hosting experience. Ratings are based on guest reviews for listings they host or co-host and may not represent the co-host’s unique services.Information contained in this article may have changed since publication.AirbnbOct 16, 2024Was this helpful?You might also likeJoin the Co-Host NetworkEarn money using the skills you’ve developed hosting.2 min readEarnings dashboard adds valuable new insights Now you can create custom reports and filter by earnings type.2 min readCommunicate more efficiently with messaging upgradesNew quick replies, threaded replies, and editing tools are coming soon.2 min readExplore more topicsGet started hostingWhy hostWhat it's like to hostCommon questionsYour spaceDesign inspirationCleanlinessAccessibilitySustainabilitySetup & amenitiesYour listingListing details & photosCalendar & booking settingsPricing strategiesHospitalityDelighting guestsCommunication & check-inRatings & reviewsPotential challengesGrow your businessMarketing & promotionSuperhostExplore moreAirbnb.orgHost Advisory BoardExperiencesProfessional hostingTools & featuresSuccess stories'''
