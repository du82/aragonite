["https://airbnb.com/aircover"]
title = "AirCover for guests - Airbnb Help Center"
description = "Every booking comes with AirCover for guests. If there’s a serious issue with your Airbnb that your Host can't resolve, we’ll help you find a similar place, depending on availability at comparable pricing, or give you a full or partial refund."
full_description = "Every booking comes with AirCover for guests. If there’s a serious issue with your Airbnb that your Host can't resolve, we’ll help you find a similar place, depending on availability at comparable pricing. If a similar place isn’t available or you’d prefer not to rebook, we’ll give you a full or partial refund. If anything comes up, your Host is your best point of contact; it’s likely they’ll be able to fix it. You can message your Host directly to let them know what’s going on. If your Host cancels before check-in, we’ll help you get rebooked. Our team can help you find a similar place, considering location and amenities, based on availability at comparable pricing. If a similar place isn’t available or you’d prefer not to rebook, we’ll give you a full refund, including service fees. When you have a confirmed reservation, you’ll have your Host’s email and phone number in the message thread for your trip. If you can’t get into your Airbnb on arrival and your Host doesn’t respond or can’t resolve the issue, we’ll help you find a similar place, depending on availability at comparable pricing. If a similar place isn’t available or you’d prefer not to rebook, we’ll give you a full refund, including service fees. If the listing is significantly different than advertised, your Host is a great resource to fix the issue. If the listing is significantly different than advertised and your Host can’t resolve the issue, we’ll help you find a similar place, depending on availability at comparable pricing. If a similar place isn’t available or you’d prefer not to rebook, we’ll give you a full or partial refund. If you ever feel unsafe, we're here to help you get priority access to specially trained safety agents who will assist you with your safety issues or directly connect you to local emergency authorities, day or night. AirCover for guests provides support for serious issues with your booking (e.g. Host cancels your reservation prior to check-in) or during your stay (e.g. The heating is not working in winter, the listing has fewer bedrooms than listed, it’s a different type of home – a private room instead of an entire home, a major advertised amenity such as a pool or kitchen is missing), but it doesn’t include more minor inconveniences, like a broken toaster."
year_published = 2025
