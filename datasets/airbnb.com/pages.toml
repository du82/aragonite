["https://airbnb.com/help/article/170"]
title = "If your host cancels your reservation - Airbnb Help Center"
description = "If your reservation is canceled by your host, you'll get a full refund. If the cancellation happens within 30 days of your check-in, we’ll help you rebook a similar place to stay, depending on availability at comparable pricing."
full_description = "While it’s rare, sometimes a host may need to cancel a reservation. We understand this can impact your plans in a big way. Rest assured, if your host cancels your reservation before check-in, you’ll receive a full refund. If your host cancels your reservation before check-in, you’ll receive a full refund, including service fees, if you choose not to rebook. Based on eligibility, you may receive Airbnb booking credit that can be used to make another reservation right away. If you don’t use it within 72 hours, you will automatically receive a full refund instead. If you are ineligible to receive booking credit, your refund will be issued immediately. Find out more about how booking credit works. Your refund will be sent to the payment method you used when you booked. How long it takes for you to receive the money depends on your bank or financial institution. Find the common refund timelines. Every booking made on Airbnb comes with AirCover for guests; support for guests who experience issues with their booking. If your host cancels, we’ll help you rebook a similar place to stay, considering location and amenities, based on availability at comparable pricing. When a cancellation occurs, you’ll get an email with full details, including your refund information. If your host lets you know that they can’t accommodate your stay anymore, don’t cancel for them. Instead, send them a message asking them to cancel. That way, you’ll be eligible to receive a full refund."
