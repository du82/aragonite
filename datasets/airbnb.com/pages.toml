.04em !important; } [data-section-id="12828975999932"] [data-element-name="subtitle"] { max-width: 312px; }FAQsFrequently asked questions For more questions visit the Help Center.Are gift cards physical or digital?Gift cards bought on Airbnb.com in the US can be purchased as eGift cards, which are sent via text or email, or physical gift cards that will be shipped to a recipient’s US address.Where can I buy a physical gift card?You can order a physical gift card here or buy at participating Target, Walmart, Best Buy, CVS, Walgreens, Kroger, Safeway, and Whole Foods store locations.Do gift cards expire?No, our gift cards don't expire.Where are gift cards available?Airbnb gift cards are available in many countries around the world. You can find the full list of available countries and applicable Gift Card Terms here.Can I send a gift card to someone who lives in a different country?Gift cards purchased in the US can only be redeemed by users who reside in the US. The gift card recipient must also have a valid payment method in the US.How can I check my gift card balance?Once you redeem your card and add the funds from the card to your account, you can go to Payment methods in your Account and check your balance.Which payment methods does Airbnb accept?We currently accept major credit cards and Apple Pay for gift cards purchased on Airbnb.For more questions visit the Help Center.'''
