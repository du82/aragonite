full_description = "If your country of residence or establishment is within the European Economic Area (“EEA”), Switzerland or the United Kingdom, the Terms of Service for European Users apply to you. If your country of residence or establishment is outside of Australia, the EEA, Switzerland, and the United Kingdom, the Terms of Service for Non-European Users apply to you. If your country of residence or establishment is within Australia, the Terms of Service for Australian Users apply to you. Section 22 of these Terms contains an arbitration agreement and class action waiver that apply to all claims brought against Airbnb in the United States. Please read them carefully. For convenience, we have set out above several terms and policies that are referred to in these Terms. However, it is important that you note that there are other supplemental policies and terms linked from our Additional Legal Terms and Policies pages, which apply to your use of the Airbnb Platform, and are incorporated by reference, and form part of the binding legal agreement between you and Airbnb. Your use of the Airbnb Platform is also subject to the Privacy Policy. These Terms of Service (“Terms”) are a binding legal agreement between you and Airbnb that govern the right to use the websites, applications, and other offerings from Airbnb (collectively, the “Airbnb Platform”). When used in these Terms, “Airbnb,” “we,” “us,” or “our” refers to the Airbnb entity set out on Schedule 1 with whom you are contracting. The Airbnb Platform enables users (“Members”) to publish, offer, search for, and book services. Members who publish and offer services are “Hosts” and Members who search for, book, or use services are “Guests.” Hosts offer accommodations (“Accommodations”), activities, excursions, and events (“Experiences”), and a variety of travel and other services (collectively, “Host Services,” and each Host Service offering, a “Listing”). As the provider of the Airbnb Platform, Airbnb (or its affiliates) does not own, control, offer or manage any Listings or Host Services. Airbnb is not a party to the contracts entered into directly between Hosts and Guests, nor is Airbnb a real estate broker, travel agency, or insurer. Airbnb is not acting as an agent in any capacity for any Member, except as specified in the Payments Terms of Service (“Payment Terms”). To learn more about Airbnb’s role see Section 15."
