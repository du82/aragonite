["https://airbnb.com/help/article/1523"]
title = "General questions about the Airbnb Community Commitment - Airbnb Help Center"
description = "Learn more about the comprehensive effort to fight bias and discrimination in the Airbnb community."
full_description = "I agree to treat everyone in the Airbnb community—regardless of their race, religion, national origin, ethnicity, disability, sex, gender identity, sexual orientation, or age—with respect, and without judgment or bias. If you decline the commitment, you won’t be able to host or book using Airbnb, and you have the option to cancel your account. You will still be able to browse Airbnb but you won’t be able to book any reservations or host any guests. You can review our host resources, which covers frequently asked questions by hosts about Airbnb’s Nondiscrimination Policy."
