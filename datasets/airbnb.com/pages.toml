["https://airbnb.com/help/article/248"]
title = "If you have a problem or issue during your stay - Airbnb Help Center"
description = "If anything unexpected comes up during your stay, message your host to discuss a solution first. It’s likely that they’ll be able to help you fix the issue. If your host can’t help or you’d like to request a refund, we’re here to support you."
full_description = "Though we always want hosts and guests to work things out directly if they can, we know it’s not always possible. If your host is unable to resolve the issue, doesn't respond at all, or declines your refund request, just let us know, click or tap Get Help from the reservation page. Someone from our team will step in to help resolve the issue. If we find it’s an issue that’s supported by AirCover for guests, we’ll help you find a similar place, depending on availability at comparable pricing. If a similar place isn’t available or you’d prefer not to rebook, we’ll give you a full or partial refund. In an emergency situation or if your personal safety is threatened, contact local police or emergency services immediately. If you're unfamiliar with local emergency services phone numbers, you can use Airbnb to dial emergency services now. For any other safety issues, you can always reach us through our dedicated 24-hour safety line. Contact us by phone, email, or chat to get priority access to specially trained safety agents."
year_published = 2025
