title = "AirCover for Hosts: Top-to-bottom protection. Always included, always free. Only on Airbnb."
description = "Get $1M in liability coverage, $1M in damage protection, and more. Always included and always free whenever you host on Airbnb."
full_description = "Aircover for HostsTop-to-bottom protection.Always included, always free.Only on Airbnb.Guest identity verificationOur comprehensive verification system checks details such as name, address, government ID, and more to confirm the identity of guests who book on Airbnb.Reservation screeningOur proprietary technology analyzes hundreds of factors in each reservation and blocks certain bookings that show a high risk for disruptive parties and property damage.$3M damage protectionIf guests do not pay for the damage caused to your home and belongings, Host damage protection is in place to help reimburse costs up to $3M USD, including these specialized protections:Art & valuablesGet reimbursed for damaged art or valuables.Auto & boatGet reimbursed for damage to cars, boats, and other watercraft that you park or store at your home.Pet damageGet reimbursed for damage caused by a guest’s pet.Income lossIf you have to cancel Airbnb bookings due to guest damage, you'll be compensated for the lost income.Deep cleaningGet reimbursed for extra cleaning services required to remove stains and smoke odors.$1M liability insuranceProtection in the rare event that a guest gets hurt or their belongings are damaged or stolen.24-hour safety lineIf you ever feel unsafe, our app provides one-tap access to specially-trained safety agents, day or night.Find complete details on how AirCover for Hosts protects you and any exclusions that apply.Only Airbnb gives you AirCoverAirbnbCompetitorsGuest identity verificationReservation screening$3M damage protectionArt & valuablesAuto & boatPet damageIncome lossDeep cleaning$1M liability insurance24-hour safety lineComparison is based on public information and free offerings by top competitors as of 10/22.Cars and other automobiles are protectedBoats and other vehicles are protectedPaintings and other artwork are protectedAntiques and other valuables are protectedCars and other automobiles are protectedBoats and other vehicles are protectedPaintings and other artwork are protectedAntiques and other valuables are protected0 of 0 items showingCars and other automobiles are protectedBoats and other vehicles are protectedPaintings and other artwork are protectedAntiques and other valuables are protectedCars and other automobiles are protectedBoats and other vehicles are protectedPaintings and other artwork are protectedAntiques and other valuables are protectedYour questions, answeredCan’t find what you’re looking for? Visit our Help Center.What is AirCover for Hosts?Is AirCover for Hosts free?Where is AirCover for Hosts available?What’s the difference between damage protection and liability insurance?How does AirCover for Hosts work with my personal insurance?Are there damages that aren’t covered?How do I get reimbursed for damage? How long does it take?Do guests get AirCover too?The super easy way to Airbnb your placeAirbnb Setup makes it easier to put your place on Airbnb, with hands-on help from a Superhost from your first question to your first guest.List your home"
