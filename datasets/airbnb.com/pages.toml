["https://airbnb.com/host/experiences"]
title = "Host an experience on Airbnb"
description = "Earn money leading people on activities you love."
full_description = "Host an experience on AirbnbEarn money leading people on activities you love.Let’s goLearn moreWhat’s an experience?It’s an activity that goes beyond the typical tour or class, designed and led by locals all over the world. Show off your city, craft, cause, or culture by hosting an experience.Let’s goCreate an activity, your wayFood tour by bike, light photography at night, tapas on a boat, or yoga (with goats). Create and curate a unique activity people want to try.Do what you love (and get paid)Scout for street art or surf at sunset, turn your passion into profit. Earn money without it feeling like a job.Get voices for your causeLead a hike with rescue dogs, or teach ethical fashion. Raise awareness of your cause in a whole new way.Show what you knowThere are experiences of every kind, like cooking, crafting, kayaking, and more. There’s no limit to what you can do. Explore these featured categories.Culture & HistoryShare the story behind famous landmarks in your city.Food & DrinkHost a food tour, cooking class, dining experience, and more.Nature & OutdoorLead nature hikes, water sports, mountain activities, and more.We’ve got your back, every step of the wayResources like articles and insights dedicated to your hosting needs, 24/7 customer support for you and your guests, exposure for your experience, and much more, to help you grow your business.TasksSchedulingPaymentsInsightsTools tailored to youA dashboard to give you insights, feedback on how to improve, visibility to guests from all over the world through search and filters, seamless payments, and much more.AirCover for Hosts covers Experiences, tooAirCover for Hosts includes $1M in Experiences liability insurance in the rare event a guest gets hurt during an Airbnb Experience. Always included and always free.Learn moreHow to get startedHere’s a quick overview of the process, from start to finish.1Learn our quality standardsMake sure your experience meets our bar for expertise, insider access, and connection.2Submit your experienceShare a description and high-quality photos of what you have in mind to show what your experience would be like.3Start hostingYour experience will be reviewed and if it is approved, you can add dates to your calendar and start welcoming guests.Let’s goFrequently asked questionsDo I have to host a home to host an experience?No. You don’t have to host guests overnight in your home or space to be an experience host. What’s the time commitment?You can host as often as you like—feel free to adjust your dates and times until you find what works best for you. Do I need a business license?Depending on activities involved, certain experiences may require a business license. Make sure to check local laws in your area to determine which licenses may be required for your experience, especially if there is food, alcohol, or transportation involved. Learn moreShow more"
