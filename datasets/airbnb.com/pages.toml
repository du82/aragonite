["https://airbnb.com/help/article/3472"]
title = "Find a co-host on the Co-Host Network - Airbnb Help Center"
description = "If you’re looking for a potential co-host, you may be able to connect with a high-quality co-host in your area."
full_description = "Need help hosting your place? In some countries, you can find a high-quality, local host to take care of your home and guests on the Co-Host Network.* Co-hosts can provide local expertise, on-site assistance, and more. They can take care of your home or help out with other tasks, from listing setup to guest support, depending on what you need and the services they offer. We've taken the work out of finding someone great to help you host—with high-quality hosts, local to you. You can stay in control of your listing while getting the level of help you need. Search the Co-Host Network to find someone local to your listing, check out their profile, and contact them. We recommend reaching out to more than one host. You’ll see all their replies in your Messages. After you message local co-hosts and find the right one for you, you'll have the option to invite the co-host to your listing and set up the permissions that work for you. Co-host Network is currently available in France, Spain, Italy, Germany, United Kingdom, Australia, Mexico (powered by Airbnb Global Services Limited), Canada, United States (powered by Airbnb Living LLC), and Brazil (powered by Airbnb Plataforma Digital Ltda). *Hosts on the Co-Host Network typically have high ratings, low cancellation rates, and established Airbnb hosting experience. Ratings are based on guest reviews for listings they host or co-host and may not represent the co-host’s unique services."
