["https://airbnb.com/help/article/1376"]
title = "Responsible hosting in the United States - Airbnb Help Center"
description = "We offer help for Airbnb Hosts to familiarize themselves with hosting responsibilities, and to provide a general overview of different laws, regulations, and best practices."
full_description = "We encourage Hosts to think carefully about their responsibilities. Hosting offers rich experiences, but it comes with a certain level of commitment. In addition to the basic requirements that we expect of all Hosts, here are some ways you can be a responsible Host.* Global information about Airbnb’s 5-step enhanced cleaning process can be found in general info about hosting places to stay. Indicate local emergency numbers and the nearest hospital. Provide a clear emergency contact number for yourself, as well as backup, for easy guest reference. Also make clear how you should be contacted if the guest has questions or issues arise. Ensure you have a functioning smoke alarm and carbon monoxide detector, and that your property meets government safety guidelines for your area (ex: International Building Code). Ensure you provide a functioning fire extinguisher and complete required maintenance. Go through your home to identify any areas where guests might trip or fall and either remove the hazard or mark clearly. Fix any exposed wires. Ensure stairs are safe and have railings. Remove or lock up any objects that may be dangerous to your guests. Ensure your home is properly ventilated and that temperature control is clearly marked and functional. Ensure guests are clear about how to safely use the heater. Always be mindful of your guests' privacy. Fully disclose whether there are security cameras, recording devices, or noise decibel monitors at your listing. Note that we do not allow security cameras or other recording devices inside of a listing.Make sure you are aware of and comply with applicable laws. Learn more about our approach to security cameras and recording devices. Ensure you relay your building's common area rules to your guests. You may want to even notify your neighbors that you will have guests, and remind guests not to bother your neighbors (ex: don't knock on their door or buzz them to let you in). If you don't allow smoking, we suggest posting signs to remind guests. If you do allow smoking, ensure you have ashtrays available in designated areas."
year_published = 2025
