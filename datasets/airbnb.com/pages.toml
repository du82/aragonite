["https://airbnb.com/airbnb-friendly"]
title = "Earn with Airbnb-friendly apartments"
description = "Live in an Airbnb-friendly apartment so you can earn extra money from Hosting on Airbnb when you're away."
full_description = "DiscoverAirbnb‑friendlyapartmentsRent a place to live. Airbnb it part-time.Explore near youExplore near youWe’ve partnered with Airbnb-friendly apartment buildings across the US to make it easier to Airbnb your place.We’ve partnered with Airbnb‑friendly apartment buildings across the US to make it easier to Airbnb your place.Sentral ApartmentsDenver, ColoradoPark 12 ApartmentsSan Diego, CaliforniaOld Town ApartmentsScottsdale, ArizonaPark 12 ApartmentsSan Diego, CaliforniaWest Midtown at Star MetalsAtlanta, Georgia525 Olive ApartmentsSan Diego, California“I can’t express how grateful I am that my building is Airbnb-friendly! Hosting has given me some financial freedom and a sense of control to invest in myself.”Hosts like Gina, in downtown San Diego, earned an average of $8,766 per yearReady to get started?First, browse Airbnb‑friendly apartments in your area.Next, find out how much you can earn on Airbnb.Then, we’ll help you contact the places you like.Explore near youExplore near youYour questions, answeredCan’t find what you’re looking for? Visit our Help CenterDoes Airbnb own or operate these buildings?No. This is a partnership between Airbnb and building owners to make it easier for renters to find apartments that let them host part-time. Airbnb does not own or operate these buildings.How often can I Airbnb my apartment?It’s up to you. You can host once a month or once a year, though local laws and building rules can affect how often you can host. It’s best to check with the building manager. Also, you don’t have to host if you don’t want to—it’s totally optional.Are there rules for how guests should behave?Yes. Building owners set community rules, such as quiet hours, that all Airbnb guests need to follow. Hosts can set their own rules for their listing as well. Airbnb also has a strict no party policy, and other policies related to guest behavior.How do I get paid?Your Airbnb earnings are paid directly to you through your Airbnb account. Your earnings do not get paid to the building owner as rent.Are there Airbnb-friendly apartments outside the US?Currently we’ve only partnered with buildings in the US and UK. There are, of course, other buildings that allow you to Airbnb your place that aren’t part of this program. You can sign up to be notified if a partner building becomes available near you.I’m a building owner ‑ can I join the program?To learn more about joining the program, and connect with an Airbnb representative, please visit our Real Estate Programs page.Find your Airbnb‑friendly apartment in another cityAre you a building owner?Learn more about making your apartments Airbnb-friendly.View AllDon’t see your city?Join the waitlistAre you a building owner?Learn more about making your apartments Airbnb-friendly.Explore near youExplore near you"
