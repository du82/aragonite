title = "What to do if a host isn’t responding - Airbnb Help Center"
description = "Once you have a confirmed reservation, you’ll find the host’s phone number in the message thread for your trip."
full_description = "Most hosts respond within a few hours, but time zones and lack of internet access might slow things down. Unless you’ve chosen a place with Instant Book, hosts have 24 hours to accept or decline a request to book. Find more about host response time. When you have a confirmed reservation, your host’s phone number will show in the reservation details for your trip so you can open the Airbnb app and call them. The host's phone number won't show up after your stay (or if the reservation is canceled), but you can still send them a message. Find out more about contacting hosts. If you’re wondering about check-in details and instructions, you’ll find them 48 hours before the check-in date on your reservation’s itinerary page."
