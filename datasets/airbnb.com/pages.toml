["https://www.airbnb.com/resources/hosting-homes/a/prepare-your-space-656"]
title = "Prepare your space - Resource Center - Airbnb"
description = "Learn how to get your space ready for guests as a new Airbnb Host. Adopt a cleaning routine, stock the basics, and add special touches."
full_description = '''{"@context":"http://schema.org/","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"First-Time Hosting","item":"https://www.airbnb.com/resources/hosting-homes/g/first-time-hosting-25"},{"@type":"ListItem","position":2,"name":"Prepare your space","item":null}]}First-Time Hosting Prepare your space Prepare your spaceAdopt a cleaning routine, stock the basics, and add special touches.By Airbnb on Jan 10, 2024 · 3 min readUpdated Jan 25, 2024First-Time HostingGetting your first bookingHelp your listing stand out Manage your calendarReview your priceGetting your first bookingHelp your listing stand out Manage your calendarReview your priceWelcoming your first guestsPrepare your spaceCommunicate effectivelyCreate a 5-star stayWelcoming your first guestsPrepare your spaceCommunicate effectivelyCreate a 5-star stayA five-star stay starts with attention to detail in your space. A welcoming home can lead to your first great reviews.Being meticulous about cleaning Successful Hosts suggest doing these three things to keep your place sparkling:Focus on high-traffic areas. Wipe down countertops, clean drains, and refill soap bottles. Double-check there’s no hair left behind.Refresh every room. Open windows, dust surfaces, and clean all floors, including under the furniture. Make beds with fresh linens and provide clean towels for every guest.Create a turnover checklist. Follow the same routine before every check-in to avoid overlooking anything.“I set six hours between bookings so that we can do a thorough clean,” says Daniel, a Host Advisory Board member and Superhost in the Canary Islands, Spain. “The space has to be exactly as you have it in your online listing.”Stocking the basics Guests expect your place to have essential amenities. These are:Toilet paperSoap (for hands and body)One towel per guestOne pillow per guestLinens for each guest bedHelp guests feel at home by providing convenient items in each room, such as:KitchenTable settings for your maximum number of guestsCoffee maker, tea kettle, pots and pans, and cooking utensilsSalt, pepper, and cooking oilDish soap, drying rack, and cloth or paper towelsLiving roomSeating for your maximum number of guestsTV with streaming serviceHouse manual with instructions on how to use devicesBathroomHand towels and a bath matToilet brush and plungerShampoo, conditioner, and hair dryerBedroomWindow coverings and bedside tables with lampsDrawers or hangers for clothes, and space for luggageExtra blanket and a fan or space heaterOnce you’ve set up your place, spend a night in it or ask friends to stay and provide feedback. You’ll quickly learn what’s missing.Adding extrasGuests appreciate when Hosts pay attention to detail and offer extras to make their stay more comfortable. These can include ear plugs, cotton swabs, board games, power adapters, and anything specific to your location, such as umbrellas or beach towels.Many experienced Hosts say they like to:Provide a welcome gift. Leave a handwritten note, basket of local goodies, or something to celebrate a special occasion.Create coziness with decor. Think about what helps you relax when you’re traveling. Wall art, plants, and throw pillows can add comfort and personality.Print the house manual. Put the manual where guests will easily find it, like on a countertop.Highlight special features. In your listing description, note anything you offer that meets certain needs, like a dedicated workspace or accessibility features.“I have a pack ’n play, a high chair, and books and toys,” says Elsie, a Host in Nashville, Tennessee.If you want more tips and haven’t received your first booking, you can get one-to-one guidance from a Superhost. They’re the top-rated and most experienced Hosts on Airbnb.Connect with a SuperhostInformation contained in this article may have changed since publication.First-Time HostingGetting your first bookingHelp your listing stand out Manage your calendarReview your priceGetting your first bookingHelp your listing stand out Manage your calendarReview your priceWelcoming your first guestsPrepare your spaceCommunicate effectivelyCreate a 5-star stayWelcoming your first guestsPrepare your spaceCommunicate effectivelyCreate a 5-star stayAirbnbJan 10, 2024Was this helpful?You might also likeThe amenities guests wantHelp your listing stand out with these popular features and amenities. 2 min readDecluttering your space to delight guestsAn orderly place is comfortable for guests and manageable for cleaners.3 min readWriting an effective listing description Help guests picture themselves in your space. 2 min readExplore more topicsGet started hostingWhy hostWhat it's like to hostCommon questionsYour spaceDesign inspirationCleanlinessAccessibilitySustainabilitySetup & amenitiesYour listingListing details & photosCalendar & booking settingsPricing strategiesHospitalityDelighting guestsCommunication & check-inRatings & reviewsPotential challengesGrow your businessMarketing & promotionSuperhostExplore moreAirbnb.orgHost Advisory BoardExperiencesProfessional hostingTools & featuresSuccess stories'''
