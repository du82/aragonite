["https://airbnb.com/help/article/1608"]
title = "Experiences liability insurance - Airbnb Help Center"
description = "Experiences liability insurance is a key component of AirCover for Hosts, which is top-to-bottom protection for Airbnb Hosts."
full_description = "Experiences liability insurance, a part of AirCover for Hosts, provides Hosts with $1 million in coverage in the rare event you are found legally responsible for a guest getting hurt or their belongings being damaged or stolen during an Airbnb Experience. People who help you host, like Co-Hosts, are also included, so you can feel confident hosting on Airbnb. You’re also covered while you’re preparing an area for an Experience or cleaning it up afterward, as well as when you’re hosting an Online Experience. If you need to file a claim, just fill out our liability insurance intake form. The info will be sent to our trusted third-party insurer, who will assign your claim to a representative. They’ll resolve your claim according to the terms of the insurance policy. AirCover for Hosts and its benefits are always included and always free. By simply agreeing to host or continuing to host an Experience, you are automatically covered whenever you host an Airbnb Experience. Email us from the email address associated with your Host account. Be sure to include the exact title of your listing, your full name, and the phone number associated with your Host account. Disclaimer: Experiences liability insurance doesn’t cover Hosts who offer experiences in Japan. For Hosts who offered experiences in mainland China, the China Host Protection Plan applies. Keep in mind that all coverage limits are shown in USD, and that there are other terms, conditions, and exclusions. If you’re hosting in the UK, the Experiences liability insurance policy is underwritten by Zurich Insurance Company Ltd., and is arranged and concluded at no additional cost for UK Hosts by Airbnb UK Services Limited—an appointed representative of Aon UK Limited, authorized and regulated by the Financial Conduct Authority. Aon’s FCA register number is 310451. You can check this on the Financial Services Register by visiting the FCA’s website or contacting the FCA on 0800 111 6768. FP.AFF.416.LC If you’re hosting in the EU, you can access the full details of the insurance intermediary here."
