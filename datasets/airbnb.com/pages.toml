["https://airbnb.com/resources/hosting-homes/a/improved-protections-for-hosts-and-guests-526"]
title = "How AirCover for Hosts works - Resource Center - Airbnb"
description = "AirCover for Hosts includes up to $3 million USD in Host damage protection, up to $1 million USD in Host liability insurance, and pre-trip protection."
full_description = '''{"@context":"http://schema.org/","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Resource Center","item":"https://www.airbnb.com/resources/hosting-homes"},{"@type":"ListItem","position":2,"name":"New features & policies","item":"https://www.airbnb.com/resources/hosting-homes/t/new-features-policies-30"},{"@type":"ListItem","position":3,"name":"How AirCover for Hosts works","item":null}]}Resource Center New features & policies How AirCover for Hosts works How AirCover for Hosts worksTop-to-bottom protection is always included and free, whenever you host.By Airbnb on May 11, 2022 · 5 min readUpdated Aug 16, 2024AirCover for Hosts provides top-to-bottom protection every time you welcome guests. It includes guest identity verification, reservation screening, $1 million USD Host liability insurance, and $3 million USD damage protection, with protection for your valuables, parked cars, and boats on your property.Guest identity verificationOur community is rooted in trust. That’s why all booking guests must complete our identity verification process. When we verify a guest’s identity, we verify certain personal information, such as their legal name, address, phone number, or other contact details.Once a guest has been verified, they’ll get an identity verified badge. This is shown across Airbnb as a red badge with a checkmark next to their profile photo. In addition, we may run background checks on US-based guests.Get more details about guest identity verificationReservation screening technologyOur Community Disturbance Policy prohibits unauthorized and disruptive parties. We use proprietary reservation screening technology to help enforce that policy and reduce the chance of disruptive parties.The system looks at a range of factors—including the type of listing being booked, the duration of the stay, the distance to the listing from the guest’s location, and whether the booking is last-minute, among many more signals—to determine whether a booking should be blocked.Get more details about reservation screening technology$3 million USD Host damage protectionFor over a decade, Airbnb has offered industry-leading damage protection for Hosts. Host damage protection, a part of AirCover for Hosts, includes these protections if a guest doesn’t pay for damage they cause to your home or belongings while staying at your place:$3 million USD damage protection: This includes both your home and its contents.Art and valuables protection: We protect fine art, jewelry, and collectibles, which may be reimbursed if damaged.Auto and boat protection: We provide damage protection for cars, boats, and other watercraft that you park or store at your property.Pet damage protection: We pay for damage done by four-legged guests.Deep cleaning: We reimburse for extra cleaning services required to remove stains and smoke odors.Income loss protection: We reimburse you for lost income if you cancel confirmed Airbnb bookings due to guest damage.24-hour safety line: If you ever feel unsafe, our app provides one-tap access to specially-trained safety agents, day or night.Get more details about Host damage protectionSubmit reimbursement requestSimple reimbursementIf a guest damages your place or belongings, you (or a Co-Host with full-access permissions acting on your behalf) can visit our Resolution Center to submit a reimbursement request in just a few steps, then easily track the process from submission through payout. Your request will first be sent to the guest. If the guest does not respond or pay within 24 hours, you’ll be able to involve Airbnb. Superhosts (with listings outside of Washington state in the US) get priority routing and faster reimbursements.$1 million USD Host liability insuranceHost liability insurance, part of AirCover for Hosts, protects you in the rare event that a guest is hurt or their belongings are damaged or stolen while staying at your place. People who help you host, like Co-Hosts and cleaners, are also included in this coverage.Host liability insurance covers you if you’re found legally responsible for:Bodily injury to a guest (or others)Damage to or theft of property belonging to a guest (or others)Damage caused by a guest (or others) to common areas, like building lobbies and nearby propertiesIf you need to file a claim, simply use our liability insurance intake form. We’ll send info you provide to our trusted third-party insurer, who will assign your claim to a representative. They’ll resolve your claim according to the terms of the insurance policy.If you’re a Host of an Experience, you’re covered by our Experiences liability insurance.Get more details about Host liability insuranceSubmit a claimAirCover for Hosts’ Host damage protection, Host liability insurance, and Experiences liability insurance don’t cover Hosts who offer stays or Experiences in Japan, where Japan Host Insurance and Japan Experience Protection Insurance apply, or Hosts who offer stays through Airbnb Travel LLC. For Hosts who offered stays or Experiences in mainland China, the China Host Protection Plan applies. Keep in mind that all coverage limits are shown in USD.Host liability insurance and Experiences liability insurance are underwritten by third-party insurers. If you’re hosting stays in the UK, the Host liability and Experience liability insurance policies are underwritten by Zurich Insurance Company Ltd., and arranged and concluded at no additional cost for UK Hosts by Airbnb UK Services Limited, an appointed representative of Aon UK Limited, who are authorized and regulated by the Financial Conduct Authority. Aon’s FCA register number is 310451. You can check this by visiting the Financial Services Register or contacting the FCA at 0800 111 6768. The Host liability and Experiences liability policies within AirCover for Hosts are regulated by the Financial Conduct Authority, the remaining products and services are not regulated products arranged by Airbnb UK Services Limited. FPAFF609LCIn the EU, these policies have been arranged and concluded at no additional cost for the benefit of EU Hosts by Airbnb Marketing Services SLU, an external collaborator of Aon Iberia Correduría de Seguros y Reaseguros, SAU, which is authorized and regulated by Autoridad de Control de la Dirección General de Seguros y Fondos de Pensiones, registered by the serial number of J0170. Aon Iberia Correduría de Seguros y Reaseguros SAU is acting as intermediary for the EU, participating in the distribution of insurance in EU countries under the freedom of services regime to provide services under the Spanish Insurance Distribution Law, the Insurance Distribution Directive, and other legal or regulatory provisions. Without prejudice to the authority of the host country where insurance distribution services are provided, the member state responsible for the supervision of Aon is the Kingdom of Spain and the Supervisory Authority, the General Directorate of Insurance and Pension Funds, at Paseo de la Castellana 44, 28046 – Madrid.Host damage protection isn’t insurance and isn’t related to Host liability insurance. For listings in Washington state, Airbnb’s contractual obligations under Host damage protection are covered by an insurance policy purchased by Airbnb. For Hosts whose country of residence or establishment is outside of Australia, these Host Damage Protection Terms apply. For Hosts whose country of residence or establishment is within Australia, Host damage protection is subject to the Host Damage Protection Terms for Australian Users.Information contained in this article may have changed since publication.AirbnbMay 11, 2022Was this helpful?You might also likeThe latest updates to Superhost assessmentsStart preparing now to meet all 4 criteria at the April assessment.2 min readAttract guests with the new wifi speed testFind out how to verify and showcase your wifi speed—a top Airbnb amenity.2 min readWhat you need to know about hosting petsGet details on pet fees, protection for pet damage, and Service Animals.3 min readExplore more topicsGet started hostingWhy hostWhat it's like to hostCommon questionsYour spaceDesign inspirationCleanlinessAccessibilitySustainabilitySetup & amenitiesYour listingListing details & photosCalendar & booking settingsPricing strategiesHospitalityDelighting guestsCommunication & check-inRatings & reviewsPotential challengesGrow your businessMarketing & promotionSuperhostExplore moreAirbnb.orgHost Advisory BoardExperiencesProfessional hostingTools & featuresSuccess stories'''
