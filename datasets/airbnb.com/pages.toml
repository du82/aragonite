["https://airbnb.com/help/article/3389"]
title = "How co-host payouts work - Airbnb Help Center"
description = "Hosts can set up co-host payouts to share payouts with a co-host on Airbnb."
full_description = "If you have co-hosts to help you with your Airbnb listing, you can set up and share payouts with them. Payouts may be set up for co-hosts with any permissions. Some regional limitations may apply based on the host’s or co-host’s location that limit the ability to use this feature. Only the host who is the listing owner can set up payouts for a co-host. Co-hosts cannot set up payouts for themselves or for other co-hosts. After a host has set up a co-host payout, the co-host has 14 days to confirm or decline. If the co-host declines but would still like to receive payouts, the host can send a new proposal. Once a co-host confirms their payouts, they'll be able to start getting payouts for bookings after guests check in. Any updates a host makes to existing payouts will only apply to the co-host’s payouts for bookings that start after the co-host confirms the update. To get paid, all hosts and co-hosts must set up at least one payout method, and, where required, verify their identity and submit any required taxpayer information. Hosts can only share payouts with a co-host for guest stays on Airbnb. Experience bookings, host damage protection reimbursements, and Resolution Center payouts aren’t included. Both host and co-host payouts will be sent about 24 hours after the guest checks in, and the host or co-host’s payout method will determine how long it takes for them to receive the money. If the reservation is a monthly stay, we’ll send the payout for the first month about 24 hours after the guest checks in, and we’ll send payouts monthly for the remainder of the guest’s stay. Once a booking is confirmed, you can find your earnings and co-host payout amount in your Earnings dashboard. Co-host payouts are calculated based on the amount of the host’s potential earnings for each booking. For hosts: To calculate the host’s potential earnings for a booking, multiply the nightly price by the number of nights, and add any additional charges to the guest, like a cleaning fee. Then subtract the host service fee and, if applicable, other taxes and fees."
year_published = 2025
clearnet = "https://airbnb.com/help/article/3389"
