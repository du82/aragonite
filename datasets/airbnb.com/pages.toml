title = "Buying an Airbnb gift card - Airbnb Help Center"
description = "Gift cards can be used for most stay and experience bookings on Airbnb. When you book, the balance from any gift card funds will be automatically applied."
full_description = "Airbnb gift cards can be used to give the gift of travel or a one-of-a-kind experience. They can be purchased online or in stores. You can get Airbnb gift cards in stores and online, or directly from us! Depending where you buy your gift card, you can get a physical card or digital card sent to you or your recipient. Gift cards purchased on Airbnb.com are digital only. The following countries are available for purchase: Australia, Austria, Belgium, Canada, Croatia, Denmark, Estonia, Finland, France, Germany, Greece, Ireland, Italy, Latvia, Lithuania, Luxembourg, Mexico, Netherlands, New Zealand, Norway, Poland, Portugal, Romania, Slovakia, Slovenia, Spain, Sweden, Switzerland, United Kingdom, and the United States. Brazil: Gift cards are unavailable for purchase on Airbnb.com, but can be purchased through third-party e-commerce retailers and in stores. You can buy a physical gift card at participating store locations. The following countries are available to purchase a physical gift card: Australia, Austria, Belgium, Canada, Finland, France, Germany, Ireland, Italy, Netherlands, New Zealand, Spain, Sweden, United Kingdom, and the United States. Important info: Currently, gift cards can only be purchased for someone within the same country or region as you, and the recipient must have a valid payment method within that country. If you’re in a country within the European Economic Area (EEA) region—Austria, Belgium, Croatia, Denmark, Estonia, Finland, France, Germany, Greece, Ireland, Italy, Latvia, Lithuania, Luxembourg, the Netherlands, Norway, Poland, Portugal, Romania, Slovakia, Slovenia, Spain, and Sweden—you can purchase a gift card for someone else in one of those EEA countries as long as the recipient has a valid payment method within that country. Gift cards purchased in the European Economic Area (EEA) and Switzerland can only be used to book accommodations; Experiences are not included. Gift cards never expire and once the gift card is added to your account, it can be used for any stay or Experience around the world. You can also check your balance at any time."
