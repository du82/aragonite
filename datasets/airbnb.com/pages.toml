description = "Most Hosts and guests are able to quickly resolve issues on their own. Explore ways to get the help you need before, during, or after a trip."
full_description = "Sending a message is usually the quickest and easiest way to resolve an issue with your listing or reservation. Or you could try calling them. If you need to securely send or request money for something that wasn’t included in a listing, visit the Resolution Center. We can also get involved if you need help working out the details with your Host or guest."
