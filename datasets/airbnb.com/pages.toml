["https://airbnb.com/help/article/2701/extenuating-circumstances-policy-and-the-coronavirus-covid19"]
title = "Major Disruptive Events Policy - Airbnb Help Center"
description = "Find details on how cancellations are handled when unforeseen events beyond your control arise after booking and make it impracticable or illegal to complete your reservation."
full_description = "In general, cancellations and refunds for Airbnb reservations are governed by the listing’s cancellation policy. In the rare circumstances that large-scale events prevent or legally prohibit completion of a reservation, the Major Disruptive Events Policy (the “Policy”) may apply. When this Policy applies, guests can cancel their reservation and receive a refund, travel credit, and/or other consideration regardless of the reservation’s cancellation policy, and Hosts can cancel without fees or other adverse consequences, although their listing’s calendar will be blocked for the dates of the canceled reservation. This Policy applies to reservations for both accommodations and Experiences, and is applicable to reservations that are ongoing or that have a check-in on or after the effective date, except as otherwise notified by Airbnb to users. The Major Disruptive Events Policy is not an insurance policy. The following events are covered under this Policy if they impact your reservation location, occur after the time of booking, and prevent or legally prohibit completion of a future or ongoing reservation (referred to in this Policy as “Events”): Declared public health emergencies and epidemics. Government-declared epidemics, pandemics, and public health emergencies. This does not include diseases that are endemic (for example, the flu) or commonly associated with an area (for example, malaria in Thailand). COVID-19 is not covered under this Major Disruptive Events Policy. Government travel restrictions. Mandatory travel restrictions imposed by a governmental agency, such as an evacuation order. This does not include non-binding travel advisories and similar government guidance. Military actions and other hostilities. Acts of war, hostilities, invasions, civil war, terrorism, explosions, bombings, rebellions, riots, and insurrection. Large-scale outages of essential utilities. Prolonged outages of essential utilities, such as heat, water, and electricity, impacting the vast majority of homes in a given location."
year_published = 2025
