["https://airbnb.com/help/article/3733"]
title = "AirCover for Hosts - Airbnb Help Center"
description = "AirCover for Hosts is a program that includes guest identity verification, reservation screening, $3M Host damage protection, $1M Host liability insurance, $1M Experiences liability insurance, and a 24-hour safety line."
full_description = "Airbnb's industry-leading Host protection program has evolved over the years. Now known as AirCover for Hosts, the program includes guest identity verification, reservation screening, $3M Host damage protection, $1M Host liability insurance, $1M Experiences liability insurance, and a 24-hour safety line. If you're not familiar with AirCover for Hosts, you can visit our Help Center for answers to most questions. Host damage protection protects your place and belongings every time you host on Airbnb. Like any kind of protection program, it has a few terms, conditions, and exclusions. Host damage protection isn't an insurance policy, and not all damage is included within its terms—so we suggest you also purchase personal insurance for any property damage caused by guests that we don't protect. With Host damage protection, Airbnb will reimburse you for certain damages caused by guests to your home and belongings if the guest does not pay for those damages. Host damage protection is also different from our Host liability insurance—you'll learn more about that in the next section. Lastly, please note that all limits shown are in USD. Any conversion from USD to other currencies is calculated on the date the reimbursement request is paid. Host liability insurance protects you in the unlikely event that you're found legally responsible for a guest being hurt or their property being damaged or stolen during an Airbnb stay at your place. It is underwritten by third party insurers and also comes with some terms, conditions, and exclusions, which you can learn more about in the comprehensive program summary. Please note that all limits shown are in USD. Any conversion from USD to other currencies is calculated on the date the claim is paid by the insurer. Experiences liability insurance protects you if you're found legally responsible for a guest being hurt or their property being damaged or stolen while you're hosting them during an Airbnb Experience. This only applies to Experiences, so Hosts of stays aren't included in this coverage. You can learn about any specific terms, conditions, exclusions, and details of the third party insurers in the comprehensive program summary. Again, all amounts shown are in USD. Any conversion from USD to other currencies is calculated on the date the claim is paid by the insurer."
year_published = 2025
