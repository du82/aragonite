full_description = 'MULTIFAMILY PROGRAMSAirbnb-friendly apartmentsDrive long-term resident demand at no cost, earn ancillary revenue and gain visibility into hosting activity on Airbnb.Get in touchTrusted by 18 of the Top 50 NMHC membersWe work with over 60 multifamily owners and operators to enable residents to host on Airbnb. The Airbnb-friendly apartments program offers full time renters the opportunity to generate additional income by hosting their home on Airbnb while adhering to the rules and guidelines set by the building.Maximizing value for owners and operators1Visibility and controlsYou can see who and when someone is hosting within your buildings. As a building owner, you can set community rules, such as quiet hours, for all Airbnb guests to follow.2Ancillary revenue and affordabilityYou can elect to earn a share of revenue on every booking. Your residents can also earn extra money on their rental apartment which can help with the rising cost of living.3Long-term resident demandIncrease net new demand by making your properties discoverable on Airbnb. Prospective residents can browse 400+ long term unfurnished rentals across 125+ cities where they can live and host.4.9 out of 5.0Average rating from Hosts on guests "Respecting House Rules"*4.9 out of 5.0Average rating from Hosts on guest stays*$3,226Typical Airbnb-friendly apartment Host earnings**$9.55 MillionTotal resident and owner earnings last year***View case studyView case study1 of 1 pages1 / 1“Hosting has opened up so many doors for us. We get to live in an incredible apartment building, with out of this world amenities, and earn money on our place when we’re away. We are having such a great time living and hosting in Denver that we extended for another year.”Ali and Eric"I’ve been a host on Airbnb for almost 7 years. It helped get me out of financial debt and kick started my journey to financial freedom. When my company moved me to Denver, I heard about a place that was Airbnb-friendly and jumped at the opportunity."Buddy"Hosting our apartment on Airbnb is helping us reach our financial goals. We cover our rent and get to explore the world. What could be better?"Tatiana and Mark“Hosting on Airbnb has allowed me to begin traveling the world while helping to pay for my apartment back home. The best way I can put it is flexibility.”MarkoAirbnb-friendly apartments in the newsAirbnb-friendly apartments turns oneAirbnb-friendly apartments widely available in the USAirbnb Adds Starwood to Program Offering Apartment RentalsGreystar drives financial success for residents through Airbnb-friendly apartments collaborationYour questions, answeredIf you still have questions, get in touch.I’m a building owner or manager, how can I join the program? To learn more about joining the program, and connect with an Airbnb representative please fill out this form and we’ll be in touch soon.What is the cost and time commitment to participate?There’s no cost to participate and there are no integration fees. Does Airbnb own or operate these buildings?No. This is a partnership between Airbnb and building owners to make it easier for renters to find apartments that let them host part-time. Airbnb does not own or operate these buildings.I’m a resident looking for a place to live and Host. Where can I find Airbnb-friendly apartments?Visit airbnb.com/airbnb-friendly to explore Airbnb-friendly buildings in your area.I’m a resident and I have a question about hosting, where can I find more information?For information about hosting, visit the Airbnb Resource Center or reach out to our Customer Service team. *According to internal Airbnb data across US Airbnb-friendly buildings between 7/1/12023 - 6/30/2024 on more than 38,000 reviews**Based on internal Airbnb data looking at ever-active AFA Hosts between 7/1/2023-06/30/2024. Typical refers to the median.*** Based on internal Airbnb data looking at ever-active US AFA Hosts between 7/1/2023-06/30/2024. Total earnings is the sum of owner earnings and resident earnings.'
