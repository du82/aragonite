["https://airbnb.com/help/article/2867"]
title = "Nondiscrimination Policy - Airbnb Help Center"
description = "Please review our Nondiscrimination Policy."
full_description = "Airbnb’s community is composed of millions of people from around the globe who bring with them different cultures, values, and norms. Our dedication to bringing people together by fostering meaningful and shared experiences rests on the principles of respect and inclusion. Along these lines, we ask that our users: We prohibit users, including co-hosts and co-travellers, from discriminating against others on the basis of the following protected characteristics: Airbnb users may not treat members of the Airbnb community differently or deny service to someone because of their protected characteristics or the perception that they have a protected characteristic. Some examples of this include: To help guests make informed decisions, hosts are welcome to provide information about the listing, but ultimately the decision as to whether a listing is appropriate for a guest, their family, or their co-travellers, is up to the guest. Below we include additional guidance on age and familial status, disability, and gender identity. Hosts are welcome to provide information about the listing to give guests with disabilities enough information to make a decision as to whether a listing is appropriate for themselves, their family, or other co-travellers. Airbnb expects our community to respect the self-identified gender(s) of our users. We consider an individual’s gender(s) to be whatever identity they express or prefer. If a user expresses a pronoun preference (for example, he/him, she/her, they/them), that preference should be respected. Our Terms of Service require users to understand and follow laws or regulations that apply to them. Additionally, where this policy provides more protections and does not conflict with applicable laws or regulations, we expect users to follow this policy. If you believe you have been discriminated against, or want to report a user, profile, listing, or message for discriminatory behavior, you have a few avenues available to make a report to us. You can:"
