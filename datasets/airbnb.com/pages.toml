title = "Your privacy choices - Airbnb Help Center"
full_description = "Legal termsYour privacy choicesOpt out of selling, sharing and targeted advertisingAirbnb does not sell personal information to third parties: we’re not a data broker and we don’t put personal information on the open market. However, we may share personal information with certain third parties to do targeted advertising or data analytics, which under California and certain other state privacy laws could be characterized as “selling,” “sharing,” or “targeted advertising”.If you're a US user and want to opt out of such data sharing, you can do so by pressing the button below.loadingI want to opt outYou can read more about how we use your personal information in our Privacy Policy.Related articlesLegal termsSupplements for California, Colorado, Connecticut, Utah, Vermont, and VirginiaIf you reside in California, Colorado, Connecticut, Utah, Vermont, or Virginia, this page applies to you and supplements the Airbnb Privacy Policy.How-toHow to exercise your data subject rightsRead about privacy and data protection and the ways you can manage your data, from how we communicate to data portability."
