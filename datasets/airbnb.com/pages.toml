["https://airbnb.com/resources/hosting-homes/a/how-much-does-airbnb-charge-hosts-288"]
title = "How much does Airbnb charge hosts? - Resource Center - Airbnb"
description = "Get the details about Airbnb’s service fees for hosts."
full_description = '''{"@context":"http://schema.org/","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Resource Center","item":"https://www.airbnb.com/resources/hosting-homes"},{"@type":"ListItem","position":2,"name":"Your listing","item":"https://www.airbnb.com/resources/hosting-homes/t/your-listing-6"},{"@type":"ListItem","position":3,"name":"Pricing strategies","item":"https://www.airbnb.com/resources/hosting-homes/t/pricing-strategies-9"},{"@type":"ListItem","position":4,"name":"How much does Airbnb charge hosts?","item":null}]}Resource Center Your listing Pricing strategies How much does Airbnb charge hosts? How much does Airbnb charge hosts?Understanding service fees can help you set a pricing strategy.By Airbnb on Nov 16, 2020 · 2 min readUpdated Sep 19, 2024Most hosts pay a 3% service fee per booking. Service fees are a percentage of:Your nightly price for the total number of nights in the bookingAny additional fees you set, like a cleaning fee or a pet feeYour service fee is automatically deducted from each payout. You either split the fee with guests or pay the whole fee yourself.Split feeThis fee structure is the most common. Most hosts with only one listing pay a split fee of 3%.*Most guests pay less than 14.2% of the booking subtotal, but various factors could make it higher. For example, if the guest pays with a different currency than the one set by the host for the listing, they may pay more.Host-only feeThis structure is less common. Hosts pay the whole service fee, typically 14% to 16% of the booking subtotal.**The host-only fee is required for traditional hospitality listings like hotels and serviced apartments. You also pay the host-only fee if you use property management software to connect to Airbnb—unless most of your listings are in the US, Canada, Mexico, the Bahamas, Argentina, Uruguay, or Taiwan.You can choose to pay the host-only fee as a pricing strategy if you’d like to simplify the price breakdown guests see.Update your pricingService fees Q&AWhy does Airbnb charge service fees?How do I find out what my service fee is?Can guests see their part of the split fee?Where can I learn more about service fees?*Some pay more, including some hosts with listings in Italy.**Hosts with super strict cancellation policies may pay a higher fee, and the fee for stays of 28 nights or more may be lower.Information contained in this article may have changed since publication.AirbnbNov 16, 2020Was this helpful?You might also likeHow you’ll get paid for hostingLearn the basics about when and how you’ll receive payment.2 min readWhat hosting regulations apply to you?Learn where to find info on local laws, taxes, and permits specific to Hosts.2 min readHow Hosts can benefit from upgrades for monthly guestsNew search tools and payment options can help more guests book longer trips.2 min readExplore more topicsGet started hostingWhy hostWhat it's like to hostCommon questionsYour spaceDesign inspirationCleanlinessAccessibilitySustainabilitySetup & amenitiesYour listingListing details & photosCalendar & booking settingsPricing strategiesHospitalityDelighting guestsCommunication & check-inRatings & reviewsPotential challengesGrow your businessMarketing & promotionSuperhostExplore moreAirbnb.orgHost Advisory BoardExperiencesProfessional hostingTools & featuresSuccess stories'''
