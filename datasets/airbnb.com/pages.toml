["https://airbnb.com/help/article/2868"]
title = "Rebooking and Refund Policy - Airbnb Help Center"
description = "Please review our Rebooking and Refund Policy."
full_description = "If a Host cancels a reservation prior to check-in, their guest is entitled to a full refund, and where appropriate, Airbnb will to help the guest find a similar place, depending on availability at comparable pricing. Airbnb will generally convert the guest's original payment into a booking credit to facilitate immediate rebooking, but guests can always request a refund to their original payment method instead. If the booking credit is unused after 72 hours, the amount of the credit will be refunded to the guest’s original payment method. Guests must report Reservation Issues within 72 hours after discovery. If we determine that a Reservation Issue has disrupted a guest’s stay we’ll give the guest a full or partial refund, or help the guest find a similar place, depending on availability at comparable pricing. Rebooking assistance or the amount refunded depends on several factors including the severity of the Reservation Issue, the impact on the guest, the portion of the stay affected, whether the guest vacates the accommodations, other mitigating factors, and the strength of evidence provided of the Reservation Issue. To request rebooking assistance or a refund, the guest who made the reservation must contact us or their Host within 72 hours after discovery of the Reservation Issue. Requests should be supported by relevant evidence such as photographs, videos, or confirmation of the conditions by the Host, which we will use to help determine whether a Reservation Issue has occurred. If a Host cancels a reservation or another Reservation Issue disrupts a guest’s stay, the Host will receive no payout or will have their payout reduced by the amount refunded to their guest. In most circumstances we will attempt to confirm a guest’s reported concern with their Host. Hosts can also dispute a guest’s assertion of a Reservation Issue by contacting us. This Policy is applicable to the maximum extent permitted by law, which may imply guarantees that cannot be excluded. When this Policy applies, it controls and takes precedence over the reservation’s cancellation policy. Before submitting a request to us, whenever feasible, the guest must notify the Host and try to resolve the Reservation Issue directly with their Host. In connection with resolving the issue, guests can request refunds directly from Hosts using the Resolution Center. We may reduce the amount of any refund or adjust any rebooking assistance under this Policy to reflect any refund or other relief provided directly by a Host. As part of providing rebooking assistance we may, but are not obligated to, pay for or contribute to the cost of new accommodations. We may also provide guests with the option of applying the value of a canceled reservation to new accommodations, or of receiving travel credit, in lieu of a cash refund."
