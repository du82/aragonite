["https://airbnb.com/host/co-hosts"]
title = "Find an Airbnb co-host to help manage your home"
description = "Discover qualified co‑host. Offering property management, cleaning, key handover, guest communication, maintenance and other support ‑ co‑hosts have you covered."
full_description = 'Find a co‑host near you who can host for youCo‑Host Network makes it easy to hire an experienced, local co‑host to take care of your home and guests.Find a co‑hostCo‑hosts can help with one thing or everythingListing setupSetting prices and availabilityBooking request managementGuest messagingOnsite guest supportCleaning and maintenanceListing photographyInterior design and stylingLicensing and hosting permitsAdditional servicesLocal co‑hosts do it bestCo‑hosts in your area can help navigate local regulations and make your place stand out.JoshuaManasquan, NJ4.97guest rating9years hostingJanieBoise, ID4.98guest rating3years hostingCaseyFullerton, CA4.97guest rating3years hostingFind a co‑hostIt’s easy to get started01Enter your home’s locationExplore available co‑hosts in your area, along with their profile and guest ratings.02Get to know some co‑hostsMessage as many co‑hosts as you like, and when you’re ready, invite one to become your co‑host.03Collaborate with easeMessage your co‑host directly, give them access to your calendar, and more.Frequently asked questionsWhat are the requirements for co‑hosts to join the Co‑Host Network?Is my place eligible?How do I pay my co‑host?{"@context":"http://schema.org/","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What are the requirements for co‑hosts to join the Co‑Host Network?","acceptedAnswer":{"@type":"Answer","text":"To be eligible to join the Co‑Host Network, hosts must have an average rating of 4.8, have hosted or co‑hosted at least 10 trips on Airbnb in the last year, and meet other requirements. <a href=\"/help/article/3727\">Learn more</a>."}},{"@type":"Question","name":"Is my place eligible?","acceptedAnswer":{"@type":"Answer","text":"You’re eligible to get help from a co‑host if you have an entire place that you’d like to list on Airbnb that’s located where a co‑host operates. As a reminder, it’s a host’s responsibility to make sure they know the hosting laws and regulations in their area, but a local co‑host may be able to help navigate them."}},{"@type":"Question","name":"How do I pay my co‑host?","acceptedAnswer":{"@type":"Answer","text":"You and your co‑host should agree on payment terms before they start helping you. You have the option to share a part of each booking’s payout with your co‑host directly through Airbnb. Some limitations may apply, depending on your location as well as the location of your listing and co‑host. <a href=\"/help/article/3389\">Learn how co‑host payouts work</a>."}}]}Find co‑hosts in your areasPopular locationsMore locationsParis Co‑hostsRome Co‑hostsMilan Co‑hostsToronto Co‑hostsLos Angeles Co‑hostsDenver Co‑hostsSão Paulo Co‑hostsGreater London Co‑hostsMississauga Co‑hostsLakewood Co‑hostsSan Diego Co‑hostsAtlanta Co‑hostsArvada Co‑hostsSeattle Co‑hostsWheat Ridge Co‑hostsDallas Co‑hostsVaughan Co‑hostsFort Lauderdale Co‑hostsRio de Janeiro Co‑hostsMálaga Co‑hostsNeuilly-sur-Seine Co‑hostsBoulogne-Billancourt Co‑hostsMiami Co‑hostsBellevue Co‑hostsGolden Co‑hostsMarkham Co‑hostsLondon Co‑hostsLevallois-Perret Co‑hostsFlorence Co‑hostsNice Co‑hostsPhoenix Co‑hostsCannes Co‑hostsOakville Co‑hostsMiami Beach Co‑hostsWest Hollywood Co‑hostsLecco Co‑hostsBeverly Hills Co‑hostsWestminster Co‑hostsClichy Co‑hostsBarcelona Co‑hostsMadrid Co‑hostsVincennes Co‑hostsRichmond Hill Co‑hostsScottsdale Co‑hostsSan Francisco Co‑hostsMexico City Co‑hostsFlorianópolis Co‑hostsIvry-sur-Seine Co‑hostsBrampton Co‑hostsHollywood Co‑hostsShow moreVélizy-Villacoublay Co‑hostsWrentham Co‑hostsMosman Co‑hostsSan Jose Co‑hostsWareham Co‑hostsBolingbrook Co‑hostsLa Crescenta-Montrose Co‑hostsPinellas Park Co‑hostsCarovigno Co‑hostsWestminster Co‑hostsPérols Co‑hostsAvila Beach Co‑hostsOakleigh Co‑hostsAtibaia Co‑hostsBeaufort Co‑hostsTwin Lakes Co‑hostsRoseville Co‑hostsAmerican Fork Co‑hostsMarin Co‑hostsLucinges Co‑hostsParramatta Co‑hostsPaiporta Co‑hostsSaint-Geours-de-Maremne Co‑hostsMedford Co‑hostsLake Arrowhead Co‑hostsAnn Arb