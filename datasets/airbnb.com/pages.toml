["https://airbnb.com/against-discrimination"]
title = "Fighting discrimination and building inclusion"
description = "Airbnb’s latest update on finding & fighting discrimination on Airbnb"
full_description = "2024 updateFighting discrimination and making travel more open to allProject LighthouseLaunched in 2020, Project Lighthouse is a tool we use in the United States that helps uncover and address potential disparities in how users of different perceived races may experience Airbnb. We developed Project Lighthouse with guidance from a number of leading civil rights and privacy organizations. Learn moreUsing real dataWe examine how guests and hosts use our platform. Statistical analyses help us find opportunities to make Airbnb more open to everyone.Protecting privacyWe analyze trends in aggregate and don’t associate perceived race information with specific people or accounts.Constantly improvingOur team continues to identify new ways to make Airbnb more open and equitable.Our ongoing workMaking Instant Book accessible to more peopleInstant Book—a feature that allows guests to book a listing without requiring hosts to approve a reservation request—is an important tool that can help reduce potential discrimination in the booking process by supporting more objective bookings. Recent changes that allow for a more holistic definition of a positive track record on Airbnb have helped increase the number of guests successfully booking reservations via Instant Book.Helping hosts respond to booking requestsNew steps that help hosts respond to booking requests in a timely manner also increased the booking success rate. These changes include making pending reservation requests more prominent for hosts. This decreased the number of reservation requests that previously went unanswered, effectively increasing the number of guests who successfully book a place to stay.Helping guests build a positive reputation on AirbnbGuests with reviews have a higher booking success rate. We’ve now made it easier for guests to add co-travelers with Airbnb accounts to their reservation, which enables these co-travelers to receive a review even if they did not book the stay.Supporting hosts and guests throughout their stayWe introduced a new feature allowing hosts and guests to display their preferred names on their profiles, after confirming their legal name. We’re also improving the process for hosts or guests who report being identified by the incorrect pronouns in a review. If a host or guest expresses this concern, the pronoun is replaced with the user’s preferred name.Strengthening our policies and proceduresWe’ve refined the process by which hosts decline a reservation request to help inform them about acceptable and unacceptable reasons for rejecting a booking request. We’ve also updated our Non-Discrimination Policy to make it more effective and incorporated new protections against caste discrimination. Lastly, we are implementing a series of changes to help enhance fairness when a host cancels an existing reservation.Sharing more information about economic empowerment opportunities available on AirbnbWe are expanding the Airbnb Entrepreneurship Academy, which introduces people from diverse and historically underrepresented communities to hosting on our platform in partnership with organizations including Hispanic Wealth Project, Brotherhood Crusade, and United Spinal Association. We’re also continuing to participate in Operation HOPE’s 1 Million Black Businesses (1MBB) initiative, which provides support and coaching for Black entrepreneurs to start, grow, or scale their businesses.Continuing our commitment to guests with mobility needsOur accessibility feature search filters make it easier for guests to find and book stays that meet their needs. Through Accessibility Review, we review every accessibility feature submitted by hosts for accuracy.Our commitment to fighting discriminationThis work follows a history of working to fight discrimination including one of the first Civil Rights Audits in 2016, an additional update in 2019, the announcement of Project Lighthouse in 2020, and our 2022 initial release of Project Lighthouse data. These updates covered a range of evolving initiatives and efforts to support everyone being successful on Airbnb.The Airbnb Community CommitmentSince 2016, we’ve asked everyone who uses Airbnb to commit to treating others with respect and without judgment or bias by agreeing to the Airbnb Community Commitment. Anyone who doesn’t agree is denied access to or removed from our platform.I will treat everyone in the community—regardless of their race, religion, national origin, ethnicity, skin color, disability, sex, gender identity, sexual orientation, or age—with respect, and without judgment or bias.Read the 2024 reportThe 2024 Project Lighthouse Update includes key Project Lighthouse findings and our complete data set, and progress we’ve made since 2016.View reportThis report follows updates on our work we issued in 2016, 2019 and 2022.Meet our partnersWe consult and collaborate with leading civil rights groups and privacy organizations, including these partners who have advised us on Project Lighthouse."
