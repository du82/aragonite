title = "ER-2 - AFRC | NASA Airborne Science Program"
full_description = "Current Status #806 600-Hour Inspection (ends 03/14/25) #809 GLOVE Download (ends 02/26/25) NASA operates two ER-2 aircraft as readily deployable high altitude sensor platforms to collect remote sensing and in situ data on earth resources, atmospheric chemistry and dynamics, and oceanic processes. The aircraft also are used for electronic sensor research and development, satellite calibration and satellite data validation. Operating at 70,000 feet (21.3 km) the ER-2 acquires data above ninety-five percent of the earth’s atmosphere. The aircraft also yields an effective horizon of 300 miles (480 km) or greater at altitudes of 70,000 feet. Consequently, ER-2 sensors acquiring earth imagery or conducting atmospheric sounding replicate spatial, spectral and atmospheric characteristics of data collected by earth observing sensors aboard orbiting satellites. Owner/Operator NASA Armstrong Flight Research Center Type Conventional Aircraft Duration 8.0 hours (payload and weather dependent) Useful Payload 2,900 lbs Gross Take-off Weight 40,000 lbs Onboard Operators 1 (including flight crew) Max Altitude 70,000 ft Air Speed 410 knots Range 5,000 Nmi Power 30 kVA, (115 VAC at 400 Hz) 10kVA (28 VDC) NASA SMD User Fee per Hour $3500 Point(s) of Contact John T. McGrath Work: (661) 276-2588 Mobile: (661) 802-3566 Individual Aircraft Details N806NA (NASA806) based at NASA AFRCYear built1981Year entered ASP/IOC service1981 N809NA (NASA809) based at NASA AFRCYear built1989Year entered ASP/IOC service1989 Aircraft Documentation Experimenters Handbook Links ER-2 Program 3D Virtual Model - N806NA 3D Virtual Model - N809NA"
