["https://airbornescience.nasa.gov/aircraft/WB-57_-_JSC"]
title = "WB-57 - JSC | NASA Airborne Science Program"
full_description = "Current Status #926 Open (Next Activity 03/04/25 Imagery Support (Placeholder)) #928 Major Inspection On Indefinite Hold (ends 12/31/25) #927 Open (Next Activity 03/19/25 Imagery Support (Placeholder)) The NASA Johnson Space Center (JSC) in Houston, Texas is the home of the NASA WB-57 High Altitude Research Program. Three fully operational WB-57 aircraft are based near JSC at Ellington Field. The aircraft have been flying research missions since the early 1970's, and continue to be an asset to the scientific community with professional, reliable, customer-oriented service designed to meet all scientific objectives. The WB-57 is a mid-wing, long-range aircraft capable of operation for extended periods of time from sea level to altitudes in excess of 60,000 feet. Two crew members are positioned at separate tandem stations in the forward section of the fuselage. The pilot station contains all the essential equipment for flying the aircraft while the sensor equipment operator (SEO) station contains both navigational equipment and controls for the operation of the payloads that are located throughout the aircraft. The WB-57 can fly for approximately 6.5 hours, has a range of approximately 2500 miles, and can carry up to 8,800 lbs of payload.Note: The Airborne Science Program has provided partial funding to support the annual fixed costs of operating the WB-57F aircraft. Within this limited scope, subsidized flight hour rates are available to science mission customers. Contact Airborne Science and WB-57F program management for details. Owner/Operator NASA Johnson Space Center Type Conventional Aircraft Duration 6.5 hours (payload and weather dependent) Useful Payload 8,800 lbs Gross Take-off Weight 72,000 lbs Onboard Operators 2 (Pilot and SEO) Max Altitude 60,000 ft and above (payload dependent) Air Speed 410 knots Range 2,500 Nmi Power 110V/60Hz AC, 110V/400Hz AC, and 28 VDC Point(s) of Contact Peter Layshock Work: (281) 244-1016 Individual Aircraft 