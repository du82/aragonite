["https://airbornescience.nasa.gov/program/news"]
title = "News | NASA Airborne Science Program"
full_description = "Breadcrumb Home News PACE-PAX: A Day in the Life of a NASA Field Campaign The breeze across the California desert kicks up some dust and sand. As a NASA research plane rolls down the runway and prepares for takeoff, its wings vibrate with the gust of wind. It’s a flight day for one of NASA’s most expansive and complex field campaigns.Read More NASA’s C-20A Studies Extreme Weather Events On a changing planet, where phenomena like severe hurricanes, landslides, and wildfires are becoming more severe, scientists need data to assess and model disaster impacts and to potentially make predictions about hazards. NASA’s C-20A aircraft is a significant asset that can carry key instruments for understanding the science behind these phenomena.Read More Validating PACE and Inspiring Future Scientists This story is from one of 63 virtual student engagement events held for NASA’s Plankton, Aerosol, Cloud, ocean Ecosystem Postlaunch Airborne Experiment (PACE-PAX). The mission used aircraft (the NASA ER-2 and CIRPAS Twin Otter) and waterborne research vessels (R/V Blissfully,R/V Shearwater, and R/V Fish) to calibrate and validate the data from the PACE satellite, which was launched in February 2024. California was the main hub for the mission, with most of the airborne and waterborne activities occurring in Edwards, Marina, Long Beach, and Santa Barbara.Read more High-Altitude ER-2 Flights Get Down-to-Earth Data Operating at altitudes above 99% of the Earth’s atmosphere, NASA’s ER-2 aircraft is the agency’s highest-flying airborne science platform. With its unique ability to observe from as high as 65,000 feet, the ER-2 aircraft is often a platform for Earth science that facilitates new and crucial information about our planet, especially when the plane is part of collaborative and multidisciplinary projects.Read More Twenty-one Hours a Day on a 30-Foot Floating Science Lab Research Vessel (RV) Blissfully is a 30-foot sailboat that is the science lab and home for two sailing scientists, Captain Gordon Ackland and myself, Dr. Bridget Seegers. The RV Blissfully is a recent addition to the fleet of research vessels. Previously, Blissfully’s days were primarily spent peacefully floating snug in a San Diego boat slip with an occasional day sail. However, Blissfully was volunteered to support the PACE-PAX campaign and therefore transitioned a month ago into RV Blissfully. Read More Day-in-the-Life of a PACE-PAX Mission Flight 06:00 Local Time: Go/No-Go Meeting We are in the field supporting PACE-PAX (Plankton, Aerosol, Cloud, ocean Ecosystem Postlaunch Airborne eXperiment), a multi-disciplinary mission that involves two aircraft—the NASA ER-2 and CIRPAS Twin Otter—and several mobile ocean assets, all helping to validate observations and data products from NASA’s new satellite observation platform, PACE. Our days typically start with an initial look at the weather in the area of operations and airport conditions during takeoff and landing. Both the ER-2 and Twin Otter will fly today since the weather is acceptable for launch, science, and landing. Read More Sailing Away for PACE Hello from sunny Santa Barbara, California, where the ship operations for the PACE-PAX campaign are underway!The PACE satellite went into orbit in February 2024. Its mission is to help us better understand how the ocean and atmosphere exchange carbon dioxide, as well as how aerosols can fuel phytoplankton blooms and help us track harmful algal blooms around the planet.PACE-PAX stands for Plankton, Aerosol, Cloud, ocean Ecosystem – Postlaunch Airborne eXperiment (see why we made it shorter?) We are using two airplanes and three ships, among other free-sailing instruments, to gather data that will tell us how well our shiny new satellite, PACE, is doing. We compare our planet-side data with the space-side data so we can make sure we are providing the very best information about the health of the world’s oceans.Read More NASA Earth Scientists Take Flight, Set Sail to Verify PACE Satellite Data NASA - More than 100 scientists will participate in a field campaign involving a research vessel and two aircraft this month to verify the accuracy of data collected by NASA’s new PACE satellite: the Plankton, Aerosol, Cloud, ocean Ecosystem mission.Read More NASA G-IV Plane Will Carry Next-Generation Science Instrument In June 2024, a new tail number swept the sky above NASA’s Armstrong Flight Research Center in Edwards, California. Pilots conducted flights of a Gulfstream IV (G-IV) to evaluate its handling characteristics and to familiarize pilots with it before it begins structural modifications. The research plane is joining the center’s fleet serving NASA’s Airborne Science program. Read more Beyond the Textbook: DC-8 Aircraft Inspires Students in Retirement In May 2024, Idaho State University’s class of 2025 received a new learning tool from NASA. The DC-8 aircraft served the world’s scientific community for decades as a platform under NASA’s Airborne Science Program before retiring to Idaho State University (ISU) to provide a hands-on learning experience for students in the university’s aircraft maintenance technology program.Read More NASA Aircraft Gathers 150 Hours of Data to Better Understand Earth Operating internationally over several countries this summer, NASA’S C-20A aircraft completed more than 150 hours of science flights across two months in support of Earth science research and overcame several challenges throughout its missions. Read more NASA Returns to Arctic Studying Summer Sea Ice Melt The NASA-sponsored Arctic Radiation Cloud Aerosol Surface Interaction Experiment (ARCSIX) mission is flying three aircraft over the Arctic Ocean north of Greenland to study these processes. The aircraft are equipped with instruments to gather observations of surface sea ice, clouds, and aerosol particles, which affect the Arctic energy budget and cloud properties. The energy budget is the balance between the energy that Earth receives from the Sun and the energy the Earth loses to outer space. Read more Second Stop: The 2019 Arctic Tundra Fire in Greenland July 29th, 2024 by Sonja Granqvist/University of Helsinki A combined team from the University of Helsinki (Environmental Change Research Unit), the Finnish Meteorological Institute (Atmospheric Composition Unit), and the Vrije Universiteit Amsterdam (Climate & Ecosystems Change) was on its way again to gather groundbreaking data on carbon and aerosol emissions from increasing fires in the northern high latitudes. Our journey began in boreal Quebec and now continues to Arctic Greenland.Read more First Stop: Sampling the 2023 Fires in Quebec This blog post is the first in a series to come. Our team, the Climate & Ecosystems Change research group from the Vrije Universiteit Amsterdam, is working in collaboration with the Environmental Change Research Unit from the University of Helsinki for a summer with lots of fire field work, science, and adventure. On this journey, our first stop was the Quebec province in Canada. I’m writing this post after our last day of fieldwork here.Read More NASA-Led Mission to Map Air Pollution Over Both U.S. Coasts This summer between June 17 and July 2, NASA will fly aircraft over Baltimore, Philadelphia, parts of Virginia, and California to collect data on air pollutants and greenhouse gas emissions. The campaign supports the NASA Student Airborne Research Program for undergraduate interns. Read more NASA Mission Flies Over Arctic to Study Sea Ice Melt Causes It’s not just rising air and water temperatures influencing the decades-long decline of Arctic sea ice. Clouds, aerosols, even the bumps and dips on the ice itself can play a role. To explore how these factors interact and impact sea ice melting, NASA is flying two aircraft equipped with scientific instruments over the Arctic Ocean north of Greenland this summer. The first flights of the field campaign, called ARCSIX (Arctic Radiation Cloud Aerosol Surface Interaction Experiment), successfully began taking measurements on May 28. Read More NASA Teammates Recall Favorite Memories Aboard Flying Laboratory After flying more than three decades and 158 science campaigns, just one flight remains. NASA’s DC-8 Airborne Science Laboratory will make its final flight May 15 to Idaho State University in Pocatello, Idaho, where it will be used to train future aircraft technicians by providing real-world experience in the college’s Aircraft Maintenance Technology Program. Read More Meet NASA Women Behind World’s Largest Flying Laboratory NASA’s DC-8 aircraft – the world’s largest flying science laboratory – began its science missions in 1987 and since then, has flown in service of the science community over places like Antarctica, Greenland, and Thailand. Aircraft like the DC-8 have enabled scientists to ask questions about life on Earth and explore them in a way that only NASA’s Airborne Science program can make happen. After 37 years, the DC-8 will retire to Idaho State University, where it will serve as an educational tool for students. As the DC-8 approaches its retirement, we highlight five of the women who have made the aircraft and program a success. Kirsten Boogaard, Nicki Reid, Carrie Worth, Erin Waggoner, and Wendy Bereda of NASA’s Armstrong Flight Research Center in Edwards, California, are building the legacy of women who are helping pave the way for the next generation.Read More NASA’s ORCA, AirHARP Projects Paved Way for PACE to Reach Space It took the Plankton, Aerosol, Cloud, ocean Ecosystem (PACE) mission just 13 minutes to reach low-Earth orbit from Cape Canaveral Space Force Station in February 2024. It took a network of scientists at NASA and research institutions around the world more than 20 years to carefully craft and test the novel instruments that allow PACE to study the ocean and atmosphere with unprecedented clarity. Read More NASA Selects New Aircraft-Driven Studies of Earth and Climate Change NASA has selected six new airborne missions that include domestic and international studies of fire-induced clouds, Arctic coastal change, air quality, landslide hazards, shrinking glaciers, and emissions from agricultural lands. NASA’s suite of airborne missions complement what scientists can see from orbit, measure from the ground, and simulate in computer models. Read more Hazy Skies in a Growing City Chiang Mai, the largest city in northern Thailand, is famed for having hundreds of Buddhist temples, some of which date to the city’s founding in the 13th century. This rich history—and easy access to hiking, waterfalls, and hot springs in the surrounding highlands, as well as being the setting of a hit movie in 2012—has turned the city into a hub of tourism that hosts as many as 10 million visitors per year. Read more Grappling with Thailand’s Seasonal Haze Each year in January and February, satellites begin to detect waves of smoke and fire in Southeast Asia, particularly in highland forests in Cambodia, Laos, Myanmar, and Thailand. Fire activity continues to increase through March and April, reaches a peak during the height of the dry season, and then fades in May with the start of the rainy season. Individual fires are usually small and short-lived. But they are often so numerous that smoke, along with air pollution from rural and urban areas, mixes to produce thick layers of haze that blanket the landscape. Such hazes contain mixtures of small airborne particles called aerosols and gaseous pollutants such as nitrogen dioxide, sulfur dioxide, carbon monoxide, and ozone that degrade air quality and have harmful health effects. In spring 2024, an international field campaign—ASIA-AQ (Airborne and Satellite Investigation of Asian Air Quality)—headed to Thailand to take a close look at the haze. During the last two weeks of March 2024, NASA’s DC-8 and Gulfstream III aircraft flew several flights over Chiang Mai, Bangkok, and rural areas surrounding the cities to sample air quality with several sensors. At the same time, satellites observed the haze from above.Read more NASA’s DC-8 Completes Final Mission, Set to Retire After 37 years of successful airborne science missions, NASA’s DC-8 aircraft completed its final mission and returned to the agency’s Armstrong Flight Research Center Building 703 in Palmdale, California, on April 1. Read More Langley Celebrates Women’s History Month: The Langley ASIA-AQ Team In honor of Women’s History Month, we caught up with the ASIA-AQ team on the other side of the Earth and asked the women from Langley about their inspirations and challenges as scientists. The ASIA-AQ (Airborne and Satellite Investigation of Asian Air Quality) mission is an international cooperative field study designed to address local air quality challenges. ASIA-AQ will contribute to improving the integration of satellite observations with existing air quality ground monitoring and modeling efforts across Asia. Read More NASA Leader Casey Swails Learns About Wildfire Work at NASA Ames NASA Deputy Associate Administrator Casey Swails views a demonstration on screen in the Airspace Operations Laboratory at NASA’s Ames Research Center in California’s Silicon Valley. Researchers presented the diverse, long-running efforts in aeronautics at Ames that have helped lay the foundation for agency work related to wildfire response. Read More NASA Collaborates in an International Air Quality Study NASA and international researchers are studying the air quality in Asia as part of a global effort to better understand the air we breathe. In collaboration with Korea’s National Institute of Environmental Research (NIER), the Airborne and Satellite Investigation of Asian Air Quality, or ASIA-AQ mission, will collect detailed atmospheric data over several locations in Asia. Read More NASA’s DC-8 to Fly Low-Altitude Over Central Valley, CA NASA Armstrong Flight Research Center’s DC-8 aircraft will fly over Central Valley and surroundings areas as part of an air quality field study. Residents in the areas below will see and hear the aircraft as it flies to achieve these measurements. Read More NASA Helps Study One of the World’s Most Diverse Ecosystems NASA satellite and airborne tools aid an international team studying biodiversity on land and in the water around South Africa. An international team of researchers spent October and November 2023 in the field studying one of the world’s most biologically diverse areas – South Africa’s Greater Cape Floristic Region. As part of the effort, researchers used NASA airborne and space-based instruments to gather complementary data to better understand the unique aquatic and terrestrial ecosystems in this region. Their findings will inform the capabilities of future satellite missions aimed at studying plants and animals. Read More NASA, Partners Explore Sustainable Fuel’s Effects on Aircraft Contrails Contrails, the lines of clouds from high-flying aircraft that crisscross the skies, are familiar sigh"
