["https://airbornescience.nasa.gov/content/The_Plankton_Aerosol_Cloud_ocean_Ecosystem_Postlaunch_Airborne_eXperiment_PACE-PAX"]
title = "The Plankton, Aerosol, Cloud, ocean Ecosystem Postlaunch Airborne eXperiment (PACE-PAX) | NASA Airborne Science Program"
full_description = "The Plankton, Aerosol, Cloud, ocean Ecosystem Postlaunch Airborne eXperiment (PACE-PAX) is a September, 2024, field campaign to gather data for the validation of the recently launched PACE mission. The operational area is Southern and Central California and nearby coastal regions. 84 flight hours are planned for NASA ER-2 operating out of the NASA Armstrong Flight Research Center and 60 for the CIRPAS Twin Otter flying out of Marina Municipal Airport. A NOAA vessel, the R/V Shearwater, will operate out of Santa Barbara. Flights will be coordinated between the aircraft, with PACE overflights, and with surface based observations including from the R/V Shearwater and other vessels and floats. A secondary objective is validation of observations by the recently launched ESA EarthCARE mission. Data will be made available within six months following the conclusion of the campaign. Read more Mission PACE-PAX"
