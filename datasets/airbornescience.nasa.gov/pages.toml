["https://airbornescience.nasa.gov/asp_document/Payload_Information_Form"]
title = "Payload Information Form | NASA Airborne Science Program"
full_description = "Document PayloadInfoForm.doc NASA Airborne Science Program (ASP) Payload Information Form (PIF) Purpose and General Instructions The purpose of the PIF is to allow instrument Principal Investigators (PIs) a simple and efficient method to provide NASA aircraft engineering (AE) with instrument or sensor information that is sufficient to start the instrument integration process. One PIF form is to be used for each instrument. Maintenance and updates of the PIF (e.g., as design maturity reduces unknowns or personnel changes) are the responsibility of the PI. The PIF is a standard ASP form and will be accepted by most NASA ASP aircraft organizations. Guidelines:Good information flows between the PI and AE is critical at all times in the integration process. Do not delay responding to queries or requests for additional information. If exact values are not known, provide estimates and so note. If no estimate can be given, annotate with TBD. Indicate N/A or NONE for items that don’t apply to your instrument. Include additional comments, notes, and references at the end of each section if necessary. While not specifically requested in the PIF, photographs of instruments, related hardware, or previous aircraft installations are encouraged. Submit the PIF to the appropriate aircraft platform POC. Category Other Documents"
year_published = 2017
year_updated = 2017
