["https://airbornescience.nasa.gov/content/Mishap_Preparedness_and_Contingency_Plan"]
title = "Mishap Preparedness and Contingency Plan | NASA Airborne Science Program"
full_description = "In addition to ensuring the proper 7900.3 airworthiness review is conducted, all Earth Science airborne activities shall ensure compliance with NASA Procedural Requirements for Mishap and Close Call Reporting, Investigating, and Recordkeeping (NPR 8621.1 current edition). Per paragraph 2.4.2 of NPR 8621.1, all aircraft operations mishaps and close calls designated high-visibility, Type A, or Type B shall be reported to the ASP Director and the cognizant Program Scientist (PS) within 24 hours. The ASP Director and PS will then notify ESD leadership within 24 hours of their notification. For more information visit the Office of Safety and Mission Assurance (OSMA) website. For a downloadable version of the full NPR 8621.1, click here."
year_published = 2019
year_updated = 2019
