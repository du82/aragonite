["https://airbornescience.nasa.gov/aircraft/Gulfstream_III_-_LaRC"]
title = "Gulfstream III - LaRC | NASA Airborne Science Program"
full_description = "Current Status Maintenance (ends 03/14/25) The NASA Langley Research Center received authorization from NASA Headquarters on September 18, 2017 to acquire three excess C-20B Gulfstream III aircraft from the U.S. Air Force. Two of these aircraft are used as parts support for the Agency, and the third aircraft is used for research. The research G-III (C-20B) aircraft, designated NASA 520, replaced the Dassault HU-25A Guardian aircraft (NASA 524). The research aircraft arrived at NASA Langley on December 7, 2017. NASA Langley has installed the following features: an engine hush kit; research power distribution system; intercom system; dropsonde capability; and, two nadir portals in the fuselage. The hush kit enables the aircraft to be Stage III noise compliant, allowing the aircraft to deploy nationwide and worldwide without requiring engine noise waivers. The nadir portals allow the aircraft to install earth science sensors, as is possible with the Center’s B200 King Air aircraft, NASA 529. Owner/Operator NASA Langley Research Center Type Twin Turbofan Business-class Aircraft Duration 7.5 hours (payload and weather dependent) Useful Payload 2,610 lbs Gross Take-off Weight 69,700 lbs Onboard Operators 10 Max Altitude 45000 Air Speed 459 knots Range 3,767 Nmi NASA SMD User Fee per Hour $3300 Point(s) of Contact Bruce Fisher Work: (757) 864-3862 James Moore Individual Aircraft Details N520NA (NASA 520) based at NASA LangleyYear built1986Year entered ASP/IOC service2020 Links 3D Virtual Model Document NASA Langley Gulfstream III Brochure, April 2020 Document Attributes of NASA Gulfstream III (N520NA), June 2024"
