full_description = "Current Status DUST Snow Storm (ends 03/03/25) The NASA C-20A (Gulfstream III) is a business jet that has been structurally modified and instrumented by NASA's Armstrong Flight Research Center to serve as a multi-role cooperative research platform for the earth science community and a variety of flight research customers. This particular aircraft, which carries the military designation of C-20A, was obtained from the U.S. Air Force in 2003. NASA802 can support a single science flight up to ~6.0 flight hours. In addition, NASA802 can also support two science flights in one day up to 9.0 total flight hours with one ground crew. Owner/Operator NASA Armstrong Flight Research Center Type Conventional Aircraft Duration 6.0 hours (payload and weather dependent) Useful Payload 2,500 lbs Gross Take-off Weight 69,700 lbs Onboard Operators 10 Aircrew Max Altitude 45,000 Air Speed 460 knots Range 3,400 Nmi NASA SMD User Fee per Hour $3200 Point(s) of Contact Starr Ginn Work: (661) 276-3434 Mobile: (661) 810-7356 Individual Aircraft Details N802NA (NASA802) based at AFRC/EdwardsYear built1983Year entered ASP/IOC service2008 Links 3D Virtual Model"
