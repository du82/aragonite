["https://airbornescience.nasa.gov/faqs"]
title = "Tutorials/FAQs | NASA Airborne Science Program"
full_description = 'Breadcrumb Home Tutorials/FAQs Topic(s) Title Sort by Post date Order AscDesc How to reset your passwordGo to the website and click on the "Log in" link In the window that pops up choose "Reset your password" In the Reset your password form, enter your username or email address and submit the form by clicking on the "Submit" button. If you receive an error that the username or email address you have entered is not recognized, and you believe that the account does already exist, please contact us for assistance. An email will be sent to you with instructions on how to log in and reset your password. Click on the link in the email, or copy and paste it into your browser and follow the instructions. See "How to use a one time link". If you don’t receive an email from us within an hour (be sure to check your spam folder), please contact us for assistance. How to update your instrumentOnce you’ve found your instrument, click on the name of the instrument, if you haven’t done so, to go to the instrument page. (For more details on how to search for an instrument see "How to find an instrument".) On the instrument page you’ll see an "Edit" tab. If you don’t see this tab please make sure you are logged in and contact the instrument PI to request access, or contact us. Clicking on the Edit tab will take you to the form where you can review and update the information that has been populated. Once you are done making changes use the "Save" button at the bottom of the page to save your work. Note only the fields with a red * are required to be able to save, so if you need to save it and return that is fine. This is your team’s page now. Please be sure to keep it up to date so that NASA Headquarters has access to current information. SOFRS: How do I get on the Call Letter Distribution list? The most current Call Letter can always be found on the ASP website below the left hand menu in the “Documents” box. If you submit a Flight Request you will be added to the list. Otherwise, you can contact the curators (Vidal Salazar, Sommer Nicholas and Stevie Phothisane at sofrs_curators@airbornescience.nasa.gov) to be added to the list. SOFRS: What is a Flight Report and how do I submit one? Flight Reports are used to update the total flight time used and remaining for a Flight Request, and should be filed after every flight. One flight report is sufficient for multiple short flights on the same day or for a long flight that covers more than one calendar day. Flight Reports for NASA aircraft are usually submitted by the aircraft lead or mission manager. If you are using a non-NASA aircraft, the PI, the FR Owner or one of the Associated Users will need to submit them. One report MUST be submitted for each day a flight is flown at https://airbornescience.nasa.gov/node/add/flt-reports. You will find “Submit Flight Report” under the “Platforms” heading on the ASP site. If you cannot see “Submit Flight Report”, check to be sure you are logged in to the site. If you still cannot submit the report, please contact the curators (Vidal Salazar, Sommer Nicholas, & Stevie Phothisane at sofrs_curators@airbornescience.nasa.gov) for assistance. SOFRS: What is the Approval Process for flight requests? Prior to the scheduled flights, your Flight Request will need to be “Approved”. Once your FR has a Funding Source identified (and a Science Concurrence, if necessary) and the aircraft manager or organization has provided the Cost and Flight Hour estimates, your FR can be sent through the approval process by the curators. The curators will contact the Funding Source to obtain his/her approval for the amount of funding to be provided. When that is obtained, if necessary, concurrence will be requested from the Science Concurrence to ensure that the FR is within NASA goals. If you are using an instrument that requires Instrument Concurrence (AVIRIS, UAVSAR) this will be obtained at this time. The ASP Director will then be contacted for approval. If you are using a NON-NASA aircraft, completion of a NASA Flight Safety Review will be required prior to approval by the ASP Director. Once approved, the curators will mark the FR approved and an automatic notification will be sent to the people listed on the request. SOFRS: If I just need a cost estimate for a proposal, how do I get it? By entering your FR and choosing “Placeholder” as the “Request Type” on the Flight Request form, you let the aircraft manager know that you are responding to a proposal. The contact information for each NASA aircraft manager can be found on the ASP site under “Platforms” or at: https://airbornescience.nasa.gov/aircraft by clicking the specific aircraft or through the call letter at the bottom left of the Airborne Science Program website. SOFRS: How do I know if the planes are available when I want to use them? Overview and detailed schedules of the NASA Airborne Science Program (ASP) aircraft are on the ASP site under “Platforms” or at: https://airbornescience.nasa.gov/aircraft_overview_cal https://airbornescience.nasa.gov/aircraft_detailed_cal These schedules will give you a general idea of the aircraft’s availability but you will need to discuss your schedule with the aircraft manager when they contact you. SOFRS: How do I edit an FR? From the SOFRS homepage, select “Flight Requests” from the menu on the left side of the page. This will present you with a list of Flight Requests you are associated with. Click on the FR you wish to edit. On the right side of each section of the FR are View and Edit links, click Edit and when you are finished click View. You can edit your FR until it has been Approved. After that, if you need to make changes, you will need to contact the curators (Vidal Salazar, Sommer Nicholas & Stevie Phothisane at sofrs_curators@airbornescience.nasa.gov). Be sure to put the FR log number in the title of all emails regarding FRs. SOFRS: I am using a Non-NASA aircraft so a Non-NASA Aircraft Review will be required. How do I get one? These are conducted by NASA Centers that have a Flight Operations organization, usually the one that processed the contract to obtain the aircraft service. A person from the appropriate center will contact you after your FR is submitted and prior to your flight dates. If your flights will take place in international territories, the process is likely take several months. SOFRS: When do I need to identify a Science Concurrence? If funding is from a NASA SMD source, no Science Concurrence is required. If you are requesting to use a NASA aircraft and your funding is NOT from NASA, you will need a Science Concurrence from the pull-down menu in order to obtain a NASA subsidized flight hour rate. Discuss this with your NASA aircraft manager when they contact you. You should speak with the individual who may grant your Science Concurrence early in the process so he/she has a good understanding of what you are trying to do and is sure he/she agrees that this effort aligns with NASA’s goals and the aircraft manager can then accurately determine the cost of the FR. SOFRS: What do I do if my funding source is not listed in the pull down list? Below the pull down menu of Funding Sources is a link to “Create a new Funding Source”. Click that link and fill in the Funding Source’s contact information. The Funding Source will then need to activate a SOFRS account. SOFRS: What if I don’t know a funding source?You can leave that field blank until you know who will be funding your flights. However, that information is required for Flight Request approval. SOFRS: What do the options under “Request Type” mean? A normal FR is a request for a planned flight opportunity; while a placeholder is for a project in the proposal process (this informs the program of anticipated need for purposes of scheduling missions and allows the PI to get a good cost estimate for the proposal). Piggyback is a no flight cost instrument addition to an existing approved Flight Request mission. Costs related to integration and other mission peculiar costs for the piggyback instrument will be the responsibility of the piggyback group. The goals of the piggyback instrument cannot change flight track. Flight tracks are determined by the host FR only and piggyback requests are usually accepted on a non-interference basis. SOFRS: Who can edit my Flight Request? The FRs are editable, after they have been submitted, by the “Owner” (the person who enters the FR), the PI and anyone who has been entered as an “Associated User” with the edit check box checked. SOFRS: What if I have to edit my Flight Request after it has been approved? Contact the curators (Vidal Salazar, Sommer Nicholas, & Stevie Phothisane at sofrs_curators@airbornescience.nasa.gov) and let them know the changes you need to make. They can return the status of the FR to OPEN so you can make changes, but your request will likely need to go back through the approval process to ensure all the stakeholders are aware of any significant changes. Be sure to put the FR log number in the title of all emails regarding FRs. SOFRS: Can I update a Flight Request after it has been submitted? Yes, a Flight Request can be edited until it has been approved. SOFRS: I am the PI. Can I have someone else submit a Flight Request for me? Yes, the person who submits the flight request is the owner, but they can list you as the PI and submit the request. You will then have access to go in and make changes to the FR as needed, otherwise the owner can continue to update the request. SOFRS: What information is required for filing a Flight Request?All of the information requested in the form is important for understanding your request, creating an accurate estimate, tracking and reporting progress throughout the life of your request, however, missing info will not necessarily hold up the submittal. There is, however, certain basic information (PI, aircraft, sensor, dates of data collection, mission location, funding source, and science concurrence) that is critical to ensure your request is properly routed, addressed in a timely manner and processed for approval. When a flight request is submitted without this important information, a reminder will pop up but you can still submit the request. SOFRS: How do I get a user account? Go to: https://airbornescience.nasa.gov/sofrs and click >Create New Account on the left side bar. Enter your email address and desired username. Check your email for a confirmation email and follow the instructions within to set your password. SOFRS: How do I file a Flight Request? Step by step instructions for filing a Flight Request can be found at the link on the SOFRS home page (https://airbornescience.nasa.gov/sofrs). Pagination Current page 1 Page 2 Next page Next › Last page Last »'
