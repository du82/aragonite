["https://airbornescience.nasa.gov"]
title = "About the Airborne Science Program | NASA Airborne Science Program"
full_description = "About the Airborne Science Program The Airborne Science Program within the Earth Science Division is responsible for providing aircraft systems that further science and advance the use of satellite data. The primary objectives of this program are to: Satellite Calibration and Validation Provide platforms to enable essential calibration measurements for the Earth observing satellites, and the validation of data retrieval algorithms. Support New Sensor Development Provide sub-orbital flight opportunities to test and refine new instrument technologies/algorithms, and reduce risk prior to committing sensors for launch into space. Process Studies Obtain high-resolution temporal and spatial measurements of complex local processes, which can be coupled to global satellite observations for a better understanding of the complete Earth system. Develop the Next-Generation of Scientists and Engineers Foster the development of our future workforce with the hands-on involvement of graduate students, and young scientists/engineers in all aspects of ongoing Earth science investigations. To meet these observing objectives ASP maintains and operates a suite of sustained, ongoing platforms and sensors on which investigators can rely from year to year. From these known capabilities the Science Mission Directorate can develop observing strategies. However, an ongoing capability will be resource-constrained and eventually technology-constrained, so that not all observing requirements will be met with the limited core capability. Therefore the program facilitates access to other platforms or sensors on a funds-available, as-needed basis, to accommodate unique and/or occasional requirements. The Program also looks for new or evolving technologies to demonstrate their applicability for Earth science. Depending on the success of the demonstrations and the observing needs, the core capability is expected to evolve and change over time. The speed and extent of change will be balanced against the need for established, known capabilities for long-term planning."
year_published = 2024
year_updated = 2024
