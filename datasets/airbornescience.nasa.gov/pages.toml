["https://airbornescience.nasa.gov/content/Arctic-Boreal_Vulnerability_Experiment_%E2%80%94_ABoVE"]
title = "Arctic-Boreal Vulnerability Experiment — ABoVE | NASA Airborne Science Program"
full_description = "Climate change in the Arctic and Boreal region is unfolding faster than anywhere else on Earth, resulting in reduced Arctic sea ice, thawing of permafrost soils, decomposition of long- frozen organic matter, widespread changes to lakes, rivers, coastlines, and alterations of ecosystem structure and function. NASA's Terrestrial Ecology Program is conducting a major field campaign, the Arctic-Boreal Vulnerability Experiment (ABoVE), in Alaska and western Canada, for 8 to 10 years, starting in 2015. ABoVE seeks a better understanding of the vulnerability and resilience of ecosystems and society to this changing environment. ABoVE’s science objectives are broadly focused on (1) gaining a better understanding of the vulnerability and resilience of Arctic and boreal ecosystems to environmental change in western North America, and (2) providing the scientific basis for informed decision-making to guide societal responses at local to international levels. Research for ABoVE will link field-based, process-level studies with geospatial data products derived from airborne and satellite sensors, providing a foundation for improving the analysis, and modeling capabilities needed to understand and predict ecosystem responses and societal implications. Visit Mission Website Mission ABoVE"
year_published = 2024
year_updated = 2024
