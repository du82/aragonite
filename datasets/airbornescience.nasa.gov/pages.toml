["https://airbornescience.nasa.gov/content/Validating_PACE_and_Inspiring_Future_Scientists_0"]
title = "Validating PACE and Inspiring Future Scientists | NASA Airborne Science Program"
full_description = "This story is from one of 63 virtual student engagement events held for NASA’s Plankton, Aerosol, Cloud, ocean Ecosystem Postlaunch Airborne Experiment (PACE-PAX). The mission used aircraft (the NASA ER-2 and CIRPAS Twin Otter) and waterborne research vessels (R/V Blissfully,R/V Shearwater, and R/V Fish) to calibrate and validate the data from the PACE satellite, which was launched in February 2024. California was the main hub for the mission, with most of the airborne and waterborne activities occurring in Edwards, Marina, Long Beach, and Santa Barbara. Read more Mission PACE-PAX"
