["https://aisafety.camp/research-outputs/aisc8-virtual-2023"]
title = "AISC8: Virtual (2023)"
description = "14 teams participated and worked on the following projects:"
full_description = "AISC8: VirtualMar - Jun, 202314 teams participated and worked on the following projects:Uncertainty -> Soft OptimizationDiscussing and Crystallizing a Research Agenda Based on Positive Attractors & Inherently Interpretable ArchitecturesCyborgismInterdisciplinary Investigation of DebateGPTSelf-consistency in LLMsBehavioral Annotation Framework for the Contextualized and Personalized Fine-Tuning of Foundation ModelsHow Should Machines Learn from Default Options?Literature Review of the Neurological Basis of Human Values and PreferencesMachine Learning for Scientific Discovery: Present and Future AI Science ModelsPolicy Proposals for High-Risk AI RegulationDeveloping Specific Failure Stories About Uncontrollable AIUncontrollable Dynamics of AGIUnderstanding Search in TransformersInducing Human-like Biases in Moral Reasoning LMsUncertainty -> Soft OptimizationResearch lead: Jeremy GillenTeam Participants’ names: Benjamin Kolb, Simon Fischer, Juan Azcarreta Ortiz, Danilo Naiff, Cecilia WoodShort write-up: For AISC 2023, our team looked into the theoretical foundations for soft optimization. Our goal at the beginning was to investigate variations of the original quantilizer algorithm, in particular by following intuitions that uncertainty about goals can motivate soft optimization. We ended up spending most of the time discussing the foundations and philosophy of agents, and exploring toy examples of Goodhart’s curse. Our discussions centered on the form of knowledge about the utility function that an agent must have, such that expected utility maximization isn’t the correct procedure (from the designers perspective). With well calibrated beliefs about the true utility function, it’s always optimal to do EU maximization. However, there are situations where an agent is very sensitive to prior specification, and getting this wrong can have a large impact on the true utility produced by the agent. Several other unrelated threads were pursued, such as an algorithm with high probability of above-threshold utility, and the relationship between SGD and soft optimization.Post: Soft-optimization, Bayes and Goodhart Discussing and Crystallizing a Research Agenda Based on Positive Attractors & Inherently Interpretable ArchitecturesResearch lead: Robert KralischTeam Participants’ names: Anton Zheltoukhov (TC), Sohaib Imran, Johnnie Pascalidis and David LiuShort write-up: For AISC 2023, our team worked on the explication and evaluation of two frameworks of alignment research progress, namely “Positive Attractors” and “Interpretable Architectures”. As an open-ended conceptual research project, our discussions included points at different levels of resolution, like the evaluation of a proposed novel cognitive architecture (Prop-room and Stage Cognitive Architecture), theory of abstractions, the interrelationships of values and objectives, and the theory of “ontogenetic training”.In conclusion, we found that “Interpretable Architectures” are a promising research framework for complementary progress on interpretability research, mainly bottlenecked by the time required to conduct research within this framework rigorously. The more time we have to conduct rigorous research, and the more the manual labor involved with scaling more symbolic systems can be partially and safely automated, the more relevant the arguments for this research framework become.As for “Positive Attractors”, we ascertained that this is a rich area for further discussion, offering both real promise for discovering (partial/full) solution candidates for the alignment problem, but also bringing additional danger in terms of encouraging fundamentally less safe research and potentially distracting from a strict security mindset. It appears that while there are safe potential projects like research on “checkpointing” during training to avoid the model from taking unintended shortcuts, a significant portion of research within this framework has to be especially careful and accountable, which may conflict with the researcher profile drawn to this agenda – therefore, we may require efforts to ensure better research epistemology before recommending positive attractors as a major framework for alignment research. Post: An Investigation of the Frameworks of “Positive Attractors” and “Inherently Interpretable Architectures CyborgismResearch lead: Nicholas Kees DupuisTeam Participants’ names: Dmitry Savishchev, Kanad Chakrabarti, Mikhail Seleznyov, Peter Hrosso, Simon Celinder, Ethan Edwards, Henri Lemoine, Mark Kamuda, Saumya Mishra, Robert Gambee, and Julia PerssonExternal Collaborators’ names: Arun Jose, Quentin Feuillade–Montixi, Hunar Batra, and Gabe MukobiShort write-up: During the AI Safety Camp, the team embarked on six main projects aimed at exploring innovative methods for interacting with language models, enhancing human cognition, and providing intuitive insights into the behavior of Large Language Models (LLMs).Scaffold Project: Led by Robert, the Generate Data team developed Scaffold (based on a tool by Gabe Mukobi with the same name), a React App simulating the Alignment Forum. This tool allowed users to interact with GPT to understand the type of comments they might receive on hypothetical posts. This project received significant contributions from Hunar.Cyberduck Project: Headed by Henri, the Prompt Libraries team created Cyberduck, an Obsidian plugin that prompted users with questions to stimulate constructive thinking. It also incorporated semantic search to retrieve relevant information from the Alignment Dataset. Arun provided invaluable assistance in this project.Peter’s Project: Peter’s initiative involved using semantic embeddings to facilitate a type of A* style search through text space, enabling users to guide text generation from GPT toward a specific objective.Simon’s Project: Simon’s experiment involved blending model outputs to apply the advantages of fine-tuning a small model to a larger model, without the need for fine-tuning the larger model. This project also aims to enable a user to better steer GPT generations.Kanad’s Work: Kanad led an experimental project that involved heavily using GPT to assist in the writing process, which resulted in two posts: “The Compleat Cybornaut” and “The Philosophical Cyborg.”Collective Identity Project: In addition to the projects above, the Cyborg Training team also produced a post on Collective Identity for the Alignment Contest.Across all projects, the team leveraged Loom to maximize the utility of the base model code-davinci-002, learning the skills of effective prompting and steering of base models, which differ significantly from chat models. Throughout this process, they received ongoing advice from Quentin, who brought in-depth prompt engineering experience.Despite the research lead falling ill right at the start of the camp, as well as often needing to prioritize other commitments, participants went above and beyond to make progress on Cyborgism in a wide variety of ways. The experience of working on these projects has not only refined the team’s understanding of LLMs but also generated lots of new ideas for how to design high-bandwidth interactions with language models to enhance human creativity and cognition.(Cyborgism summary written primarily by GPT-4) Interdisciplinary Investigation of DebateGPTResearch lead: Paul BricmanTeam Participants’ names: Elfia Bezou-Vrakatseli, Thomas Feeney, Yimeng XieShort write-up: The current AI paradigm is inherently empirical, with models being optimized to fit finite datasets. Just before AI Safety Camp, Paul attempted to train a language model more “rationally” by rewarding it for winning debates against itself. However, this novel training regime was riddled with questions: Is debate the appropriate way of operationalizing truth-seeking? Is coherentism the appropriate way of determining which party won a debate? What does it actually mean for a statement to support another? During AI Safety Camp, our team investigated these questions by measuring performance on custom benchmarks and by engaging with prior work in epistemology and metaphysics. These investigations helped uncover fundamental issues of the initial proposal and highlighted opportunities for improvement.Official project page Self-consistency in LLMsResearch lead: Jacob PfauTeam Participants’ names: Ole Jorgensen, Henning Bartsch, Domenic Rosati, Jason Hoelscher-ObermaierShort write-up: We conduct a series of behavioral experiments on LMs in cases of under-specification, and examine when LMs are self-consistent between answer and explanation in such cases. In particular, we examine cases where the posed question involves doing non-trivial arithmetical calculation – as opposed to simply being consistent in stating a proposition. As input data we curated a set of ambiguous integer sequences: initial sequences which may be continued in more than one way, i.e. sequence which could be generated via generating functions.We examine the following questions: 1. If a model prefers one answer under ambiguity, will it prefer the matching explanation when asked to explain in a separate context? 2. Given multiple possible continuations of an integer sequence, will the LM compute all possibilities, placing non-trivial probability mass on them? 3. If asked to verbalize all possible continuations, can the model successfully do this task?We find that cross-context self-consistency increases as a function of model capabilities. Whether this is desirable requires further interpretation: this may be desirable by increasing explanatory truthfulness of models, but at the same time it might be undesirable as a sign of increased self-knowledge in LMs. We also offer some initial thoughts on the conceptual question: to what extent can we behaviorally evaluate whether model explanations are introspection-based i.e. arrived at via eliciting latent computation, rather than via external features. To begin to answer this question, we compare the rate of model self-consistency against the rate at which the model’s choice under ambiguity can be predicted by a naive-bayes method using featurized prompts. We stress-test these results by conducting adversarial prompting experiments. Presentation on final weekend slidesFormal Write-up (Arxiv/Lesswrong post forthcoming) Behavioral Annotation Framework for the Contextualized and Personalized Fine-Tuning of Foundation ModelsResearch lead: Eleanor ‘Nell’ WatsonTeam Participants’ names: Lukas Petersson, Benjamin SturgeonExternal Collaborators’ names: Alex Almeida Andrade, Thiago Viana, Erick Willian, Shujun ZhangShort write-up: Recent advancements in Foundation Models have enabled more accessible, inclusive, and efficient approaches to prompt-driven processes, revolutionizing machine intelligence and broadening its applicability. However, the trustworthiness of machine intelligence remains constrained by its insufficient comprehension of personal context, cultural diversity, and customizable socialization, resulting in biased outcomes and risks to safety from restricted alignment. To improve personalization and enable sophisticated AI value alignment, there is a need for powerful, yet user-friendly tools that facilitate the identification, annotation, and simulation of examples across diverse cultural and situational contexts. This paper proposes a framework for personalizing such models, designed for the general public with minimal training effort, through the implementation of intuitive and accessible interfaces for example annotation, scenario generation, value/norm elicitation, and personalization. The framework employs prompt-driven semantic segmentation, automatic labeling of objects, scenes, and actors, and offers a pathway towards scenario generation capabilities, allowing users to fine-tune their preferences without annotating raw data. Additionally, the paper explores techniques such as swarm intelligence and prompt libraries, as well as essential user, tool, and system mechanics. A pilot study is presented to demonstrate the framework’s architecture and to begin to validate how the complexity of value elicitation and personalization can be significantly reduced, enabling ordinary individuals to participate and contribute to global AI value alignment efforts. Through these mechanisms our research presents a significant step towards democratizing access to fine-tuning and dataset generation, a precursor to improved value alignment efforts.Our Draft Towards PaperSlides from Closing Presentation How Should Machines Learn from Default Options?Research lead: En Qi TeoTeam Participants’ names: Lillian Jiang, Arthur LeeShort write-up:When inverse reinforcement learning (IRL) algorithms observe our choices, they assume that we have optimized the state of the world according to our preferences, but in reality we often make sub-optimal choices. One way through which people do so is that they tend to select the option that has been pre-set for them, even when another option would have maximized their utility. This path dependency bias has been exploited in a variety of behavioral nudges, ranging from organ donation opt-out clauses to tip amounts. We propose a model to penalize default options when learning about agents’ preferences. To inform our model, we first review the literature on the default option bias to identify causal mechanisms behind this bias, as well as learn about the exacerbating factors for it. We then model how default options may be taken into account and suggest a few proxies for IRL algorithms to learn about the attentional effort that has been devoted to a choice with preset options. This extends past research on how IRL algorithms should learn the preferences of biased agents. Literature Review of the Neurological Basis of Human Values and PreferencesResearch lead: Linda LinseforsTeam Participants’ names: Mateusz Bagiński, Oliver Bridge, Tim Gothard, Rasmus Herlo Short write-up:The goal of this project was to better understand the neurological basis of human values for two reasons. Firstly, human values are what we’re aiming to align future AIs with. Therefore it is possible that a better understanding of the underlying mechanics of human values will be helpful or even necessary for AI alignment to succeed. Secondly, most humans have pro-social values, i.e. we care about other humans. We currently don’t know how to build an AI that cares about humans. If we can understand how the brain solves this, maybe that will help us figure out how to instantiate these types of values in future AIs.Value-representations can be displayed on many different levels in human brains, agents and social networks, and each of these levels present possible leverage points for generating biomimicking value-representations in artificial neural networks. Hence, we took a system level approach to generate an systematic overview of how value-representations emerge on different levels in humans, a"
