title = "Home"
description = "AI Safety Camp \u000B10th edition"
full_description = '''AI Safety Camp 10th editionApplications have closed. To get a reminder when the 11th edition opens, leave your email address here.AI Safety Camp (AISC) is an online part time AI safety research program. You join AISC by joining one of the projects, and you join a project by applying here.This camp, we have 32 projects covering many different topics. Scroll down to see all of them. We recommend having a look at the projects to see which ones interest you. But you also have the option of filling out a generic application for all the projects at once. When you apply for a project, keep in mind that all collaborators are expected to work 10 hours/week and join weekly meetings. What is AI Safety?There are many perspectives on what is good AI safety research, stemming from different assumptions about how hard various parts of the problem is, ranging from "Aligning an AI with any human seems not too hard, so we should focus on aligning it focus on aligning it with all humans, and/or preventing misuse", to "Aligning fully autonomous AI to stay safe is literally impossible, so we should make sure that such AI never get built", and everything in between, plus the perspective that "We don't know WTF we're doing, so we should do some basic research".Our range of projects for this AISC reflects this diversity. All AISC projects have a plausible theory of change, under some reasonable assumptions. But different projects have different theories of change and assumptions.We encourage you, dear reader, to think for yourself. What do you think is good AI safety research? Which projects listed below do you believe in?Do you still have questions?See our About & FAQ page for more info, or contact one of the organisers.𝗔𝗽𝗽𝗹𝘆TimelineTeam member applications October 25 (Friday): Accepted project proposals are posted on the AISC website. Application to join teams open.November 17 (Sunday): Application to join teams closes. December 22 (Sunday): Deadline for Research Leads to choose their team. Program Jan 11 - 12: Opening weekend.Jan 13 - Apr 25: Research is happening.Teams meet weekly, and plan in their own work hours. April 19 - 20: Final presentations.AfterwardsFor as long as you want: Some teams keep working together after the official end of AISC.When starting out we recommend that you don’t make any commitment beyond the official length of the program. However if you find that you work well together as a team, we encourage you to keep going even after AISC is officially over.List of projectsStop/Pause AI(1) Growing PauseAI(2) transitioned to one-on-one collabs(3) AI Policy Course: AI’s capacity of exploiting existing legal structures and rights(4) Building the Pause Button: A Proposal for AI Compute Governance(5) Stop AI Video Sharing CampaignEvaluate risks from AI(6) Write Blogpost on Simulator Theory(7) Formalize the Hashiness Model of AGI Uncontainability(8) LLMs: Can They Science?(9) Measuring Precursors to Situationally Aware Reward Hacking(10) Develop New Sycophancy Benchmarks(11) Agency Overhang as a Proxy for Sharp Left TurnMech-Interp(12) Understanding the Reasoning Capabilities of LLMs(13) Mechanistic Interpretability via Learning Differential Equations(14) Towards Understanding Features(15) Towards Ambitious Mechanistic Interpretability IIAgent Foundations(16) Understanding Trust(17) Understand Intelligence(18) Applications of Factored Space Models: Agents, Interventions and Efficient InferencePrevent Jailbreaks/Misuse(19) Preventing Adversarial Reward Optimization(20) Evaluating LLM Safety in a Multilingual World(21) Enhancing Multi-Turn Human Jailbreaks Dataset for Improved LLM DefensesTrain Aligned/Helper AIs(22) AI Safety Scientist(23) Wise AI Advisers via Imitation Learning(24) iVAIS: Ideally Virtuous AI System with Virtue as its Deep Character(25) Exploring Rudimentary Value Steering Techniques(26) Autostructures – for Research and PolicyOther(27) Reinforcement Learning from Recursive Information Market Feedback(28) Explainability through Causality and Elegance(29) Leveraging Neuroscience for AI Safety(30) Scalable Soft Optimization(31) AI Rights for Human Safety(32) Universal Values and Proactive AI Safety Stop/Pause AI Let's not build what we can't control.(1) Growing PauseAIChris GerrbySummary This project focuses on creating internal and external guides for PauseAI to increase active membership. The outputs will be used by the team of volunteers with high context and engagement, including the key decision makers. Activism and advocacy has historically been cornerstones for policy and social change. A movement's size is critical to achieving its goals. The project's outcome will be an official growth strategy for PauseAI Global: an actionable guide for increasing active members (volunteers, donors, protesters) within 6-12 months.PauseAI currently lacks comprehensive growth strategies and tactics, and there's uncertainty about resource allocation soon. This project will delve into tactics that have aggressively accelerated growth for other movements, both historical and recent.By the end, we'll refine our findings, analyze PauseAI's current tactics, and recommend clear guidelines for immediate action. This guide will also include tactics applicable to national PauseAI chapters.Skill requirementsFamiliarity with doing research Working with uncertainty Social intelligence, high EQFull project plan(2) transitioned to one-on-one collabs(3) AI Policy Course: AI’s capacity of exploiting existing legal structures and rightsMarcel Mir TeijeiroSummary This project aims to build an AI Policy course that explores how traditional legal frameworks are increasingly outdated, providing no clear answers to AI capabilities and advances. The course will highlight the vulnerabilities in current regulations and the potential for corporations and authoritarian governments to use AI tools to exploit gaps in areas such as IP, privacy, and liability law.This course would focus on identifying and understanding these new legal gaps and critically exploring proposed solutions. This would be achieved through literature review, case law and ongoing legal disputes. It will explore, for example, how AI can be used to violate IP and privacy rights, or how current liability structures are weak against AI generated damages. This weak framework incentivises AI developers to take greater risks, increasing the chance of catastrophic consequences. It will also analyse the lack of regulation on adopting AI-driven decision-making systems in essential sectors. (E.g. employment, law, housing). Reporting the erosion of fundamental rights, socio-economic risk and the threat automation by algorithms pose to democratic procedures.Skill requirementsPolicy researcher:Strong writing and communicative skills.Strong research and analytical skills. In particular experience researching and reviewing one of two key areas:Law and policy:Case lawRegulationsPolicy reports Soft law and treatiesLegal analysis and commentary.Think tank (or similar entities) reportsSocio economic literature and data:Literature and reports on AI use impact on the legal areas identifiedReports and data on negligent AI use in the loophole areas identified.Other relevant data analysis or reportsThink tank (or similar entities) reportsWeb developerWeb building and design skills.Flexibility to make changes as the course structure and content develops.Allow the website to be editable by the team to allow more flexibility.Course materials designerEducational science skills. E.g. Previous experience or studies on developing educational materials. Teaching skills or experience.Curriculum development and instructional design skills to deliver the content in an engageful way. Full project plan(4) Building the Pause Button: A Proposal for AI Compute GovernanceThis project needs a project lead to go aheadSummary This project focuses on developing a whitepaper that outlines a framework for a global pause on AI training runs larger than GPT-4 scale. By addressing the underexplored area of compute governance, the project aims to prevent the emergence of catastrophically dangerous AI models. We will research policy measures that can restrict such training runs and identify choke points in the AI chip supply chain. The final output will be a comprehensive whitepaper, with potential supplementary materials such as infographics and web resources, aimed at informing policymakers and other stakeholders attending AI Safety Summits.Skill requirementsProject Lead (Joep Meindertsma / Johan de Kock): Manages the project’s overall direction, coordination, and ensures deadlines are met. Expertise in AI safety literature, compute governance, and technical policy evaluations.[Open position - project will only run if someone can take on this role. Receives stipend of $1,500 total.]Research Analyst: Conducts literature reviews and evaluates compute governance proposals. Expertise in AI safety literature, compute governance, and technical policy evaluations.Supply chain researcher: Focuses on the AI chip supply chain, identifies choke points. Has some basic knowledge of chip manufacturing.Policy Expert: Develops the policy framework and ensures it is actionable for international stakeholders. Experience with international regulatory frameworks and AI governance.Full project plan(5) Stop AI Video Sharing CampaignThis project needs a project lead to go aheadSummary The intention of this project is to be an engine for mobilisation of the Stop AI campaign. The goal is to get 1 million people a week to see a series of video ads composed of 30 sec/1 min videos. These ads will be video soliloquies by 1) famous people and/or experts in the AI field saying why AI is a massive problem, and 2) ordinary people such as teachers, nurses, union members, faith leaders, construction workers, fast food employees, etc. saying why they believe we need to Stop AI.Each ad will have a link attached which takes people to a regular mobilisation call. The attendees at this call will be presented with pathways to action: join a protest, donate, record a video ad, invite 3 people to the next call.Skill requirementsRolesProject lead: Will lead the video pipeline – from collecting, to editing, to posting videos on social media. Receives stipend of $1,500 total.Scout: Will receive a target demographic to research contact lists for. Will directly contact these people asking if they would like to participate in the campaign, either by phone, email, social media or all three.Canvasser: Will canvas in-person on the ground, asking people to contribute their video.Editor: Someone who can edit down phone camera recordings into easily watchable and relatable clips. Full project planEvaluate risks from AILet's better understand the risk models and risk factors from AI.(6) Write Blogpost on Simulator TheoryWill PetilloSummary Write a blogpost on LessWrong summarising simulator theory—a lens for understanding LLM-based AI as a simulator rather than as a tool or an agent—and discussing the theory’s implications on AI alignment. The driving question of this project is: “What is the landscape of risks from uncontrolled AI in light of LLMs becoming the (currently) dominant form of AI?” Skill requirementsAt least a basic understanding of AI safety theorySolid writing and communication skill(Optional) it would be good to have at least one person on the team who is not especially familiar with ML or LessWrong, but has generally good communication skill, and can act as a test audience to prevent the group from leaning too heavily on jargon and in-group assumptions.(Optional) deep understanding of Machine Learning for fact-checking. If we don’t find someone for this role, I will look for an external advisor.Time and willingness to participate!Full project plan(7) Formalize the Hashiness Model of AGI Uncontainability Remmelt EllenSummary The hashiness model represents elegantly why ‘AGI’ would be uncontainable – ie. why fully autonomous learning machinery could not be controlled enough to stay safe to humans. This model was devised by polymath Forrest Landry, funded by the Survival and Flourishing Fund. A previous co-author of his, Anders Sandberg, is working to put the hashiness model into mathematical notation. For this project, you can join up in a team to construct a mathematical proof of AGI uncontainability based on the reasoning. Or work with Anders to identify proof methods and later verify the math (identifying any validity/soundness issues).We will meet with Anders to work behind a whiteboard for a day (in Oxford or Stockholm). Depending on progress, we may do a longer co-working weekend. From there, we will draft one or more papers. Skill requirementsAs a prerequisite, you need to have experience in using math to model processes. The rest is up for grabs. Full project plan(8) LLMs: Can They Science?Egg SyntaxSummary There are many open research questions around LLMs' general reasoning capability, their ability to do causal inference, and their ability to generalize out of distribution. The answers to these questions can tell us important things about:Whether LLMs can scale straight to AGI or whether further breakthroughs are needed first.How long our timeline estimates to AGI should be.Whether LLMs can potentially do AI research, kicking off a cycle of recursive improvement.We can address several of these questions by directly investigating whether current LLMs can perform scientific research on simple, novel, randomly generated domains about which they have no background knowledge. We can give them descriptions of objects drawn from the domain and their properties, let them perform experiments, and evaluate whether they can scientifically characterize these systems and their causal relations.Skill requirementsThis should be a pretty accessible project for anyone with these skills:Comfort with writing straightforward Python code (or willingness to learn ahead of time)A basic understanding of LLMs, which needn't be deeply technical -- you should be able to describe in general terms what the following are and why they matter: attention heads, MLP layers, the residual stream.Optional bonus skills, absolutely not requirements:Experience with interpretability -- this project could include some interesting interp aspects if anyone is excited to go in that direction, but doesn't have to.An understanding of the underlying mathematics of latent space in transformers (understanding the contents of this 3Blue1Brown video is sufficient) Full project plan(9) Measuring Precursors to Situationally Aware Reward HackingSohaib Imran Summary This project aims to empirically investigate proxy-conditioned reward hacking (PCRH) in large language models (LLMs) as a precursor to situationally aware reward hacking (SARH). Specifically, we explore whether natural language descriptions of reward function misspecifications, such as human cognitive biases in the case of reinforcement learni'''
