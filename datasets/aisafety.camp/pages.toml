description = "Reccord many teams participated and worked on the following projects:"
full_description = '''AISC9: VirtualJan - Apr, 2024Reccord many teams participated and worked on the following projects:Stop or Pause AITowards realistic ODDs for foundation model based AI offeringsLuddite ProData Violations Reporting and TakedownsMILD: Minimal Item-Level DocumentationCongressional Messaging CampaignsMech-Interp & EvaluationsModelling Trajectories of Language Models (1)Modelling Trajectories of Language Models (2)Modelling Trajectories of Language Models (3)Ambitious Mechanistic InterpretabilityExploring toy models of agentsHigh-Level Mechanistic Interpretability Activation Engineering Library 🔥Out-of-context learning interpretabilityUnderstanding Search and Goal Representations in TransformersDelphi: Small LM Training & Evals Made EasyEvaluating alignment evaluationsMiscellaneousSteering of LLMs through addition of activation vectors with latent ethical valenceDoes sufficient optimization imply agent structure?The Science AlgorithmSatisfIA – AI that satisfies without overdoing itThe promisingness of automated alignmentHigh Actuation SpacesPersonal Fine-Tuning Implementations for AI Value AlignmentSelf-Other Overlap @ AE StudioAsymmetric control in LLMs: model editing and steering that resists control for unalignmentAI-Driven Economic Safety Nets: Restricting the Macroeconomic Disruptions of TAI DeploymentOrganise the next Virtual AI Safety UnconferenceStop or Pause AITowards realistic ODDs for foundation model based AI offerings Team members: Igor Krawczuk, Paulius Skaisgiris, Scott Bursese Arghya Sarkar, Tanvir IqbalProject Summary: We surveyed the literature and arrived at both relevant prior art and a GAODD framework that we think makes sense to use as a basis for writing specifications and scenarios for AI agent inWe have a benchmarking backend set up and are working on creating a useable demoWe are discussing communication strategies and next steps on how to continue work on the project post AISCRead more: WIP, will be published at https://github.com/orgs/genalgodds/ , email gaodd@krawczuk.eu for early access. AISC closing week slidesContact us: gaodd@krawczuk.eu, especially if you want to collaborate Luddite ProTeam members: Brian Penny, Edgardo Diaz, Jacob Haimes, Nichita CostaProject Summary: Luddite Pro is dedicated to discussing stories related to AI, data privacy, and Big Tech. In the first quarter of 2024, we covered:-Google News being flooded with AI-remixed stories w/ 404 Media-Adobe training Firefly on Midjourney images w/ Bloomberg-How AI is impacting the crochet and knitting industry-Interview w/ Dr Peter Park of StakeOut.AI w/ Into AI Safety podcast 🠔 https://linksta.cc/@intoaisafety-Examining Open-Source AI (see next page)-Following Andersen vs Stability AI lawsuitContact us: brian@thoughtforyourpenny.com Data Violations Reporting and TakedownsTeam members: Sajarin Dider, Sapir Shabo, Mrityunjay Mohan, Brian Penny, Alex Champandard, Remmelt EllenProject Summary: Saj is coding a form for reporting copyright and data privacy violations of generative AI models and the underlying training datasets. After submission, it generates an email text requesting the AI company to take down the violating content. Submissions by default get posted to a ‘wall of shame’, where journalists and class-action lawyers can gain common knowledge of the extent of each company’s legal violations.Read more: Presentation recordingContact us: remmelt@aisafety.camp MILD: Minimal Item-Level DocumentationTeam members: Marcel Mir, Alex Champandard, Remmelt EllenProject Summary: Large AI models are being trained on billions of texts, images, and recordings copied from the internet. However, most online content is copyrighted, personal, or else plain illegal. The EU has mandated AI providers to publish public summaries of their datasets. Each summary must be sufficiently detailed to allow stakeholders to exercise their rights. MILD specifies the minimal detail required, which can be documented using existing industry practices. First, a fingerprint is made of each item in the dataset, allowing detection of illegal content. Second, details are added on how each item was sourced (licensing information or webpage link), ensuring both copyright compliance and reproducible science.Read more: Policy PaperContact us: remmelt@aisafety.camp Congressional Messaging CampaignsTeam members: Tristan Williams, Felix De Simone, Gergő Gáspár, Dave Kasten, Marta Krzeminska, Jacob TurnerProject Summary: We studied a form of policy advocacy common to other issues, but uncommon for AI policy: Talking to Congress. We began by validating whether or not talking to congress is helpful for advocacy; we found good evidence that they are a best practice and wrote up our findings. We’ve now built a proof-of-concept website that can be used to guide those less familiar with reaching out to Congress through the process.Read more:Talking to Congress: Can constituents contacting their legislator influence policy?GuidedTrack: Talking to Congress: A Guide to Expressing Concern Over AI, Interactive ProgramContact us: tristan31500@gmail.comMech-Interp & EvaluationsModelling Trajectories of Language Models (1)Attempting to split up ‘parts’ of text, & trying to probe representation of future ‘parts’Team members: (Nicky Pochinkov), Einar Urdshals, Jasmina Nasufi, Éloïse Benito-Rodriguez, Mikołaj KniejskiProject Summary: We try to split text into “chunks/parts”, and find that taking the mean of various activations seems to store enough information, and have found methods that seem to work relatively reliably for splitting up texts to intuitive sections.We investigate to what degree we can do forwards prediction, but have yet to get anything that robustly works.Contact us: on Slack, or email: chat@nicky.pro, einarurdshals@gmail.com, jasminanasufi9@gmail.com, mikolajkniejski@tutanota.com, eloise_benito@zohomail.eu Modelling Trajectories of Language Models (2)Investigating to what degree different datasets use different neuronsTeam members: (Nicky Pochinkov), Tetra Jones, Rashidur RahmanProject Summary: We try to see if we can find larger trends to model activations, and if we can find any semblance of “modularity”. We try “selecting neurons” from MLP that “belong” to datasets, and investigate the degree of overlap & performance hit from ablation.We find that when there are drops in performance in different datasets from pruning, that they seem relatively intuitive.Read more: Paper draftContact us: Slack, or chat@nicky.pro, holomanga@gmail.com, rashidur92@hotmail.com Modelling Trajectories of Language Models (3)Investigating how to model neuron activations: Zero vs Mean vs Peak ablationTeam members: (Nicky Pochinkov), Ben Pasero, Skylar ShibayamaProject Summary: We look at neuron activations, and try to model their effects on the residual stream. We find that most neurons are zero-centered symmetric, but some are not.We run ablation experiments with attention neurons, and find that for GPT causal text transformers, peak ablation seems to move neurons out of distribution the least.Read more: Paper draftContact us: on Slack, or work@nicky.pro, benp992@gmail.com, skyshib@gmail.com Ambitious Mechanistic InterpretabilityTeam members: Alice Rigg, Jacob Goldman-Wetzler, Karthik Murugadoss, Leonard Bereska, Lucas Hayne, Wolodymyr Krywonos, Michael Pearce, Kola Ayonrinde, Gonçalo PauloProject Summary: We tried to do a wide variety of things and split off into different, not very connected projects, and as a result of this the team drifted apart. I still think there were a lot of good outputs, it would have been better if we stayed together and bonded over it.Some outputs: ghost gradients implementation, by JacobVarious Mamba interp things, by Goncalo & othersAtp* implementation, by KolaReverse engineering MNIST, by MichaelFollow up paper Hierarchical feature clustering, by AliceClustering features by their topology, by KarthikMech interp survey paper, by LeonardComputation in superposition extensions, by LucasContact us: on the Mech Interp discord: https://discord.gg/MbXBr7WbU3Exploring toy models of agentsTeam members: Paul Colognese, Ben Sturgeon, Narmeen Oozer, Arun JoseProject Summary: Our aim is to explore the hope that we might be able to detect future agentic AIs’ objectives via interpretability methods. Specifically, we take an RL model that pursues multiple objectives during a single episode and investigate whether we can detect information related to a model’s current objective via interpretability. Read more: See this post for prior work and subscribe to Paul’s LessWrong posts to be notified when we post the results of this project.Contact us: paul.colognese@gmail.com High-Level Mechanistic Interpretability Activation Engineering Library 🔥Team members: Jamie Coombes, Ardy Haroen, Fergus Fettes, Lukas Linauer, Shaheen Ahmed-Chowdhury, Vy HongProject Summary: We cleanly implemented part of Google PAIR's Patchscopes paper, and released it as a PyPI package. We hope this will enable researchers to more easily access the mechanistic interpretability methods that the Patchscopes framework captures, such as the logit lens and future lens, across a variety of tasks including layer-wise next-token prediction and feature extraction.Read more: GitHubContact us: Reach out at https://github.com/obvslib/obvs/discussions if you’re interested! Out-of-context learning interpretabilityTeam members: Victor Levoso Fernandez (lead), Luan Fletcher, Leo Mckee-Reid, Andrei Cristea, Florian van der Steen, Nikita Menon, Kunvar ThamanProject Summary: During this project we trained a model that exhibits out-of-context learning traits, then performed various mech interp methods to better understand these properties. Out-of-context learning is when a model learn to apply facts that it learned during training in another context. The model we trained and much of the project was inspired by the paper Out-of-context Meta-learning in Large Language Models, and we focused on studying the weak and strong internalization properties discussed in there. Read more: GitHubContact us: Contact Victor on Mech Interp Discord (https://discord.gg/F8Aky2kj5N) Understanding Search and Goal Representations in TransformersTeam members: Aaron Sandoval, Adrians Skapars, Benji Berczi, Bill Edwards, Joe Kwon, Jun Yuan Ng, Leon Eshuijs, Naveen Arunachalam, Tilman Räuker, Alex Spies, Michael IvanitskiyProject Summary: Working with autoregressive transformers trained on maze-solving tasks, we hope to build a mechanistic understanding of if and how these systems build internal world models (WMs) and search over them.Isolate and modify components within a WM, demonstrating how changes affect behavior consistently. Investigate activation steering to identify specific influences on WM and circuits, perform circuit analysis on path-following, and test the universality of these methods across various tokenization schemes.Explore methods for consistently directing model behavior using SAEs, and to investigate if circuits responsible for path-following can be linked to ensure correct path adherence.Read more: unsearch.org Contact us: team@unsearch.org Delphi: Small LM Training & Evals Made EasyTeam members: Alice Rigg, Gonçalo Paulo, Jai Dhyani, Jannik Brinkmann, Jett Janiak, Joshua Wendland, Rai (Phan Anh Duong), Siwei Li, Víctor Abia AlonsoProject Summary: Using Delphi, researchers can easily train and evaluate small LMs.We provide tools for standardized tokenizer training, dataset tokenization, model training and model evaluation. We took great care to make sure that the suite is user friendly and the results are reproducible. Delphi supports all 🤗 CausalLM architectures and any dataset. As a proof of concept, we trained a suite of 10 🐍 mambas and 10 🦙 llamas, ranging from 50k to 50m parameters, on the Tiny Stories dataset.Read more: https://github.com/delphi-suite/delphi Contact us: https://discord.gg/55yXuXfx Evaluating alignment evaluationsTeam members: Maxime Riché, Edoardo Pona, Harrison Gietz, Jaime Raldua Veuthey, Tiger DuProject Summary: We worked on clarifying what propensity evaluations are and (meta-)evaluating them. We focused on clarifying the characteristics of evaluations in general and of propensity evaluations in particular. Additionally, we started: an empirical (meta-)evaluation of whether we can trust current propensity evaluations, reviewing what are the existing meta-evaluation theoretical frameworks, and drafting some thoughts on improving upon those frameworks.Read more: Thinking About Propensity Evaluations; A Taxonomy Of AI System EvaluationsContact us: maxime.riche.insa@gmail.com MiscellaneousSteering of LLMs through addition of activation vectors with latent ethical valenceTeam members: Matthew Lee Scott, Aayush Kucheria, Tobias Jennerjahn, Sarah Chen, Eleni Angelou, Skye Nygaard, Rasmus Herlo (RL)Project Summary: Do ethical concepts have a steerable structure and geometry in latent space? Recent years have shown that it is possible to model singular and binary concepts in latent space and used these reduced dimensions to steer LLMs accordingly, however, ethical concepts are not just binary, they are ambiguous, conditional, complex and contextual. Here, we attempt to map the ethical landscape in latent space of simple LLMs, and with this structure we approach some of the fundamental questions of their ethical structure.Contact us: rasmusherlo@gmail.com Does sufficient optimization imply agent structure?Team members: Tyler Tracy, Mateusz Bagiński, Einar Urdshals, Amaury Lorin, Jasmina Nasufi, Alfred Harwood, Alex Altair (RL)Project Summary: Agents — that is, things which observe the world, form and track beliefs about it, make plans, and take actions to achieve some type of goals etc. — seem to be a very capable class of thing. But does it go the other way around? If you see some kind of entity reliably steering the world toward similar outcomes, does it follow that it has some kind of agent-like structure? If not, what other kinds of non-agentic structures are there that can also reliably achieve outcomes? In this project, we explored what happened when we attempted to apply different mathematical formalizations to different parts of the problem. For example, what is a valid way to formalize “reliably achieve an outcome”? How do we rule out entities that are essentially “giant lookup tables”? What are the implications of the environment class having certain kinds of symmetry?Read more: Towards a formalization of the agent structure problemContact us: alexanderaltair@gmail.com, or Alex_Altair on LessWrongThe Science AlgorithmTeam members: Johannes C. Mayer, Thomas Kehrenberg, Tassilo Neubauer, Negar Arj, Rokas Gipiškis, Matteo Masciocchi, Taylor Smith, Bryce Woodworth, Peter FrancisProject Summary: Our goal is to build an AI system capable of "doing science" — roughly, a system that can build a model of any world we care to operate within. This model should allow the AI to reason correctly about the world, e'''
