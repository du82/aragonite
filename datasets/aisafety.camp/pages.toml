full_description = "AISC3: Madrid26 Apr - 5 May, 2019The third AI Safety Camp took place in April 2019 in Madrid. Our teams worked on the projects listed below.Categorizing Wireheading in Partially Embedded AgentsTeam Embedded agents: Arushi, Davide, SayanThey presented their work at the AI Safety Workshop in IJCAI 2019.Read their paper here.AI Safety Debate and Its ApplicationsTeam Debate: Vojta Kovarik, Anna Gajdova, David Lindner, Lukas Finnveden, Rajashree AgrawalRead their blog post here. See their GitHub here.Regularization and visualization of attention in reinforcement learning agentsTeam RL Attention: Dmitry Nikulin, Sebastian Kosch, Fabian Steuer, Hoagy CunninghamRead their research report here.Modelling CooperationTeam: Jonas Müller, Miles Tidmarsh, Vasily KuznetsovSee visualisation of their mathematical model here.Robustness of Multi-Armed BanditsTeam Bandits: Dominik Fay, Misha Yagudin, Ronak MehtaLearning Models of MistakesTeam Mistakes: Lewis Hammond, Nikolas Bernaola, Saasha NairCooperative Environments with Terminal ConsequencesTeam CIRL Environment: Jason Hepburn, Nix Goldowsky-Dill, Pablo Antonio Moreno Casares, Ross Gruetzemacher, Vasilios MavroudisResponsible Disclosure in AI ResearchTeam AI Governance: Cynthia Yoon, Jordi Bieger, Laszlo Treszkai, Ronja LutzPsychological Distance and Group BlindspotsTeam Psychological Distance: Remmelt Ellen"
