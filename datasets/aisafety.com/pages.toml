["https://www.aisafety.com/stay-informed"]
title = "Stay informed"
description = "The AI safety space is changing rapidly. These information sources can help you learn more and keep up to date."
full_description = "Weekly briefing and occasional analyses of what matters in AI and AI policy. Written by Shakeel Hashim, ex-news editor at The Economist. A carefully curated and regularly updated YouTube playlist to help people gain an understanding of what's going on with AI. Hub for researchers to discuss ideas related to ensuring that transformatively powerful AIs are aligned with human values. Discussion ranges from technical models of agency to the strategic landscape, and everything in between. Online forum dedicated to improving human reasoning, containing a lot of AI safety content. AI Alignment Forum posts are cross-posted here so anyone, not just approved researchers, can engage with the research. Well-researched interviews with influential intellectuals going in-depth on AI, technology, and their broader societal implications. Hosted by Dwarkesh Patel. Visually-rich explanations of AI safety concepts – highlighting risks, clarifying advanced topics, and advocating for responsible development. Animated videos aiming to foster good thinking, promote altruistic causes, and help ensure humanity's future goes well – particularly regarding AI safety. YouTuber discussing the latest AI developments as they happen, offering clear explanations and in-depth analysis of important research and events. Interviews with AI safety researchers, explainers, fictional stories of concrete threat models, and paper walk-throughs. Interviews with technical AI safety researchers about their research, aiming to get a sense of why it was written and how it might reduce existential risk from AI. Blog by Zvi Mowshowitz on various topics including AI, often with detailed analysis, personal insights, and a rationalist perspective. A followable list of accounts on Twitter/X belonging to AI thinkers and organizations that discuss AI safety. Online forum where individuals dedicated to doing the most good converge to share research, debate ideas, and collaboratively develop strategies for addressing the world’s most pressing challenges – including AI safety."
