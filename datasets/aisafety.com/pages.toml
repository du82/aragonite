["https://aisafety.com/funders"]
title = "Funders – AISafety.com"
description = "Organizations providing financial support for AI safety projects."
full_description = "The most active large grantmaker for individuals and small projects aiming to positively influence the long-term trajectory of civilization. Provides financial support to organizations working to improve humanity’s long-term prospects for survival and flourishing. The largest funder in existential risk reduction. Most funding is done via proactive research, but there are also frequent requests for proposals in certain areas. Regranting platform where individual regranters have funding pools to direct towards listed projects. Also offers impact certificates. Aiming to promote the responsible development and deployment of frontier models, minimize risks, and enable independent, standardized evaluations of capabilities and safety. Incubator helping start new organizations that steer transformative technology towards benefiting life and away from extreme large-scale risks. Aiming to reduce catastrophic risks from advanced AI through grants towards technical research, policy, and training programs for new researchers. Funds researchers who will collaborate with the UK government to advance systemic approaches to AI safety. Two-year program for young people who want to build new things. Fellows skip or drop out of college to receive a US$100,000 grant and support from the Thiel Foundation’s network of founders, investors, and scientists. UK government R&D funding agency built to unlock scientific and technological breakthroughs that benefit everyone. Funding projects in 1) automating research and forecasting, 2) security technologies for securing AI systems, 3) neurotech to integrate with or compete against AGI, and 4) safe multipolar human AI scenarios. Aiming to increase the impact of effective altruism projects by increasing their access to talent, capital, and knowledge. Crowd-sourced charity evaluator and one-stop shop for AI safety funding applications. All applications are public and charities that receive the most support from donors with the best track records are ranked highest."
