["https://www.aisafety.com/projects"]
title = "Projects – AISafety.com"
description = "Online initiatives supporting the AI safety field and seeking volunteer help – all skill levels welcome."
full_description = '''Regularly scrapes all major sources of alignment data for use by the AI Safety Chatbot and other projects. Currently needs fixing, as well as someone to maintain it longer term. Search "alignment research dataset" on Hugging Face for details. Come along to the monthly call run by Alignment Ecosystem Development (AED) to find field-building volunteer projects you can contribute to or to pitch a project to other volunteers. A hub connecting AI safety volunteers and projects. Runs monthly calls for pitching and finding projects. Volunteer organization helping new people navigate the AI safety ecosystem, connect with like-minded people, and find projects that are a good fit for their skills. Seeking a webmaster, social media manager, and volunteer recruiter. Website: aisafety.quest Website (this one!) serving as the hub for resources for the AI safety community. Seeking assistance with user testing and research, promotion, SEO, and non-CSS development. Website: aisafety.com This new AI safety nonprofit is seeking volunteers to help them run their social media, sharing relevant news supporting concerned insiders at the frontier of AI. Ideal volunteers will have a background in AI or AI journalism, a strong grasp of AI concepts, and a keen interest in discussions that involve AI professionals addressing critical public concerns. Website: third-opinion.org An interactive tree-like map of AI safety research designed to make the research landscape more navigable. Looking for writers, programmers, and people to give feedback. Website: airesearchmaps.com Create multiple off-grid coliving and coworking spaces in reasonably secure, low-cost places around the world that are relatively resilient to global catastrophes. If desired, residents could rotate through living and working in each. Coordinate with Centre for Enabling EA Learning & Research (CEEALAR) and Bunker in Paradise. Create a comprehensive test of a person's understanding of AI risks. Include brief (30 second), moderate (3-10 minute), and thorough (11-30 minute) versions. See Clearer Thinking Artificial Intelligence Quiz and Clearer Thinking Long-Term Future Quiz.'''
