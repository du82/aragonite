["https://www.aisafety.com/donation-guide"]
title = "Donation guide – AISafety.com"
description = "A short guide on how to donate most effectively with the funding and time you have."
full_description = 'Donate to a fund, such as the AI Risk Mitigation Fund. Grantmakers evaluate projects on behalf of donors and choose the projects they think are most effective to fund. Alternatively, you can donate to a donor lottery which gives you a chance to direct a larger amount of money. With some time, you might be able to find good opportunities yourself. Otherwise you can delegate to experienced grantmakers. Either donate to a fund, such as the AI Risk Mitigation Fund, donate to a specific project that you think effectively tackles the issues of AI safety if you have one in mind, delegate to someone in your network if you know someone whose opinion in this area you trust, or send money via a donor lottery to give you a chance to direct a much larger amount and dedicate your time to researching where it should go. We recommend exploring Manifund, which allows you to "invest" in projects you think will be impactful, or nominate regrantors to decide on your behalf. GiveWiki and the Nonlinear Network are other platforms where you can choose projects to fund. By studying more before donating, you donate not just your money but your cognition to find and assess opportunities which big grantmakers – who have less time per unit of money – might miss. Read up to understand the problem, get involved in the community, and fund projects or individuals who you think are doing the best work. Either donate to a specific project that you think effectively tackles the issues of AI safety if you have one in mind, delegate to someone in your network if you know someone whose opinions in this area you trust, or send money via a donor lottery to give you a chance to direct a much larger amount and dedicate your time to researching where it should go. We recommend exploring Manifund, which allows you to "invest" in projects you think will be impactful, or nominate regrantors to decide on your behalf. GiveWiki and the Nonlinear Network are other platforms where you can choose projects to fund.'
year_published = 2025
