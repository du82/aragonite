["https://aisafety.com/courses"]
title = "Courses – AISafety.com"
description = "AI safety curricula and reading lists for self-led learning at all levels."
full_description = "Free online courses covering key concepts and research perspectives in AI safety. Comprised of two streams: Alignment and Governance. List of sequences curated by the AI Alignment Forum team, featuring work from Richard Ngo, Paul Christiano, etc. Covers a wide range of risks, including loss of control, misalignment, malicious use, accidents, and enfeeblement, while leveraging concepts and frameworks from existing research fields to analyze AI safety. Intensive 5-day course from AI Safety Fundamentals (AISF) helping people fast-track their understanding of AI’s impact on society and start taking their first steps in making a contribution to AI safety. Textbook used by various training programs systematically mapping the landscape of AI safety knowledge. Ideas are laid out in a carefully structured narrative where concepts build naturally on previous ones. A guide to the cluster of thought which expects solving the alignment problem in a way which scales to superintelligence to require well-specified proposals guided by strong theoretical understanding. Intensive 5-day course from AI Safety Fundamentals (AISF) designed to accelerate your understanding of key concepts in AI alignment. Intensive 5-day course from AI Safety Fundamentals (AISF) designed to accelerate your understanding of key concepts in AI governance and policy. PhD-level survey course on technical ML safety. Covers various technical topics to reduce existential risks from AI, including robustness, monitoring, control, and systemic safety. What is safe AI, and how do we make it? This course explores that question, focusing on the technical challenges of creating reliable, ethical, and aligned AI systems. Facilitates upskilling in machine learning engineering for the purpose of contributing directly to AI alignment in technical roles. Course from AI Safety Fundamentals (AISF) designed for economists who want to develop their understanding of transformative AI and its economic impacts. An introduction to cooperative AI, which is an emerging research field focused on improving the cooperative intelligence of advanced AI for the benefit of all."
