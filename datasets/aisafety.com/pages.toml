["https://www.aisafety.com/communities"]
title = "Communities – AISafety.com"
description = "Local and online groups involved in AI safety – including forums, Facebook, Slack, and Discord."
full_description = "Community of thousands involved in making AI safe. Includes channels dedicated to making introductions, finding study buddies, asking questions, and discovering opportunities. Forum dedicated to improving human reasoning and decision-making, and the primary online hub for long-form AI safety discussion and research. Building and maintaining digital infrastructure for the AI safety ecosystem (like this site) and connecting volunteers with opportunities to contribute. The Discord server for Rob Miles's YouTube channel, hosting discussions on AI safety and the development and content of the AISafety.info website. Campaign group dedicated to calling for an immediate moratorium on AGI development so as to prevent human extinction. Fortnightly meetings discussing AI safety papers. Organized through the AI Safety Danmark Facebook group. Helps people more easily navigate the AI safety ecosystem, connect with like-minded people, and find projects that are a good fit for their skills. The main online hub where researchers discuss ideas related to ensuring that transformatively powerful AI is aligned with human values. The main subreddit discussing AI safety. Note that it's not limited to the narrow sense of the control problem. Central point for connecting researchers and community organizers in Europe with opportunities and events happening in their vicinity. An always-active meeting ground for anyone who wants to both cowork with and get to know other effective altruists. The Discord server for Rational Animations, a YouTube channel posting animated videos about truth-seeking and the future of humanity. Discord server for the community participating in Apart Sprints, which are regular hackathons run by Apart Research. Online forum where individuals dedicated to doing the most good converge to work on the world’s most pressing challenges – including AI safety. Comprised of three channels: one for technical discussions and deep dives, one for general news and hot takes, and one for memes."
