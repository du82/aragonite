["https://www.aisafety.com/advisors"]
title = "Speak to an Advisor – AISafety.com"
description = "These organizations offer free guidance calls to help you discover how to contribute to AI safety, tailored to your unique skills and interests."
full_description = "Career advice by a well-connected and professional organization dedicated to helping people use their career for good. Does not accept all applications. Grassroots volunteer organization helping people contribute to reducing catastrophic risk from AI by directing them to the most relevant resources and communities. Helps those who want to have a meaningful impact with their careers brainstorm career paths, evaluate options, and plan next steps. Paused until April 2025. Personalized advice for experienced ML professionals (professors, PhD students, and industry researchers and engineers) who are interested in contributing to technical AI safety. The monthly Volunteer Opportunities Call connects people who want to volunteer with AI safety field-building projects that need volunteers. If you're feeling called to contribute to existential safety but are unsure how best to do so, the experienced advisors at CAES are here to help you help. Offers math, coding, and alignment research advice. Their consultations have had many positive reviews, and they are generally happy to have multiple calls. Provides advice to those interested in pursuing a career dedicated to reducing risks of astronomical suffering, also known as s-risks. Experimental program using emerging technology, behavioral science, and applied rationality to help people lead uncommonly impactful lives. Helping professionals transition to high-impact work by hosting collaborative peer discussions and individual advising sessions. The advising process is structured around cohorts. HIP's Impact Accelerator Program helps experienced professionals achieve an impact with their career, including through one-on-ones with like-minded professionals and facilitators. If you have an unusual background, interest, skill set, or other resources, then Søren Elverlin, a 10-year veteran in the AI safety field, may be able to point you in a productive direction. Free career advice for people who are considering starting an AI safety organization (technical, governance, meta, for-profit, or non-profit)."
