["https://aisler.net"]
title = "AISLER - Quick and affordable manufacturing for your Electronic Project"
description = "AISLER manufactures your electronic project within two business days and ships it to you world-wide at affordable prices."
full_description = "In need for a quick-turn PCB prototype, electronic parts, a small or large batch assembly? We have got you covered. We manufacture your electronic project within two business days and ship it to you world-wide at affordable prices. Upload your project now and try out the experience that turns your electronic project into a Powerful Project without blowing your budget. Printed Circuit Boards manufactured in one business day starting at just €12.18. Manufactured and delivered from Germany. 2 or 4 Layers, ENIG and HASL surface finishes and high quality base materials. The assembly service for prototypes. Made for speed and quick iterations. Manufactured within 6 business days. Iterate your project faster with Amazing Assembly. Your project's electronic components, delivered to your factory floor. Leveraged by AISLER's purchasing power to ensure the best prices for small and large quantities. The assembly service for larger batches. Made to simplify your supply chain and distribute a ready-made product to your customers. From small-scale series to complex box-build. Just a few days ago, KiCad 9 was released, and we are excited to announce that you can now order your designs created with this version by simply uploading your PCB or ODB++ file or using our plugin. Then this project Holger shared on Hackster.io may be for you. He designed a PCB which allows you to evaluate the TLE9371VSJ transceiver from Infineon. The published design files allow for easy adaption. Check it out here: https://www.hackster.io/holger/can-fd-shield-tle9371vsj-577ab1 Digital transistors integrate resistors, thus saving cost and board space. Turn-ON and Turn-Off are also defined in the datasheet, making designing with them simple. Have you tried them in your design yet? With our part professional program, you'll receive a discount on your PCB or assembly when using Diotec or Würth parts in your design."
