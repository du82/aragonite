["https://ajxs.me/blog/How_Far_Back_in_Time_Can_I_Take_My_Websites_Design.html"]
title = "~ajxs/How Far Back in Time Can I Take My Website's Design"
description = "A look back through web-browser history, as I test my site against the browsers of the past."
full_description = "How Far Back in Time Can I Take My Website's Design 2023.05.07 A look back through web-browser history, as I test my site against the browsers of the past. Tagged as: Programming The Small Web They say that a builder's home is never finished. This saying is certainly true of the website you're reading right now. All too often I find myself tweaking the padding of list elements, carefully calibrating the ratios between heading sizes, or painstakingly fussing over the contrast between different shades of green. All in an effort to make the site more 'readable'. After all, I don't want the task of reading this blog to any more painful for my dear readers than it needs to be. In this pursuit of 'readability', I've done my best to keep the site's design as straightforward as I can make it1. The content is squeezed into a single column as wide as the eyes can comfortably scan. There are no complex sidebars, calendars, or tag clouds cluttering up the layout, and the colour palette is chosen to minimise eye strain when reading in a darkened room. Recently I read this great article from interface designer Anthony Hobday, in which he lays out a list of easy to follow visual design rules that even a design-challenged technical person like myself can understand. I blame credit this article for inspiring me to (yet again) roll up my sleeves and get stuck into this blog's design. Between pruning container divs and removing collapsed margins the thought occurred to me that my site —with its spartan design and low-tech philosophy— could have remained pretty much identical since the internet's early days. This raised an interesting question: Exactly how far back in time could my site's design have remained the same? How far in the past could this site's current design have originated? 5 years? 10 years? more? The only thing to do now would be to put this strange idea to the test. What follows is a tedious account of my trial and error doing just that. If you're not interested in the technical play-by-play of testing my site against vintage browsers, feel free to skip ahead to the end section for some more personal content about my nostalgia for the web's early days, and what the small web means to me. Table of Contents A Few Ground Rules 2008: T Minus 15 Years 2003: T Minus 20 Years 1998: T Minus 25 Years 1993: T Minus 30 Years Nostalgia and The Small Web A Few Ground Rules # Before I begin, I should establish a few rules... The challenge is to amend the markup so the site —as it looks now— works on browsers from the past, not to come up with a good design that worked back then and now. The site needs to look more or less identical to the current design, on both contemporary, and modern browsers. It would be no good after all if I managed to make my site display correctly on antiquated browsers, only to have my dear modern audience (you) suffer for it today. Of course, there are some things I know will just never work no matter how much effort is applied, so I'm willing to make a few small compromises here and there, as long as the design of the site remains more-or-less identical. My site doesn't use any Javascript. For this reason I've decided not to consider any solutions using Javascript trickery to resolve compatibility issues. With the rules established, there was nothing left to do but jump right in. I'll dial the clock back five years at a time, documenting the difficulties as I go. Without any further ado, let's take a walk down memory lane... 2008: T Minus 15 Years # As it turns out, we have to dial the clock back 15 years before anything interesting starts happening. The year is 2008. Google have just released the beta of their new Chrome browser, and a much less cynical world is excited at the prospect of anything but Microsoft. Stack Overflow has just launched, and YouTube still looks like this. The cutting edge browsers on the market are Internet Explorer 7.0 and Firefox 3.0. AOL had very recently announced that they would be ending all support for the ailing Netscape Navigator, giving their users an endorsement of Firefox as a parting gift. Firefox 3.0 For what it's worth, I was an early Firefox adopter, and had already been a faithful user for several years by this point. While it wasn't the first browser to feature a tabbed interface, Firefox's reintroduction of tabs to the new generation of web browsers was an absolute game changer. Problem: Content Container Styling Status: Solved The cause of these layout problems didn't take long to track down: The 'rem' unit wasn't even part of the CSS standard in 2008. After converting them to 'px' with some crude 'Find+Replace' wizardry, things were starting to take shape. Funnily enough, even though no styling was actually applied to the blog item headings, the browsers falling back to their default heading styles made the page largely resemble its intended design. I guess my pedantic adherence to semantic markup might actually pay dividends after all. Problem: Mangled Page Header Status: Solved This turned out to be the result of Firefox applying a default inline style to the unsupported HTML5 <header> element. How browsers should, or even do actually handle unknown HTML elements is a matter of serious conjecture in the web design community. Reading the actual WHATWG specification for how this should work isn't for the faint of heart either. Understanding the standard wouldn't help us much at any rate, as the first browsers to support these rules would actually be Firefox 4.0, and Internet Explorer 10. Fortunately, Mark Pilgrim's fantastic Dive Into HTML5 has a comprehensive guide to how this actually works in practice across different browsers. Problem: <figure> elements not styled correctly Status: Unresolved The <figure> elements I had used in several articles were not rendering correctly either for the same reason as the difficulties I experienced above with the page header. Each of the individual entries in this blog is composed in plain HTML and stored in an SQLite database, before being rendered into the final product by my homegrown static-site generator. Rather than removing the <figure> tags from each individual article, I decided that I would just have to live with this problem and move on. Internet Explorer 7 Switching back to Internet Explorer, it was clear much more work needed to be done. Problem: Blog Index Styling Status: Solved At first I suspected there was no way IE7 supported the 'child combinator' CSS selector I was using to style the blog index's entries. It turned out I was underestimating Internet Explorer's CSS support. A mistake I'd make more than once writing this article. After a quick session of debugging trial and error I figured out this was another instance of the browser not recognising HTML5's futuristic semantic markup elements. As Mark Pilgrim's 'Dive Into HTML5' guide notes, when encountering an unknown HTML element Internet Explorer not only doesn't apply any styling to it, it doesn't apply styling to any of its descendants either! Changing the <section>, and <article> tags back into plain old <div> elements resolved these issues. Internet Explorer also added a default margins for lists, which I took the opportunity to reset. Problem: Inline-Block List Elements Status: Solved 'Inline-block' elements, such as the front page tag list, were being rendered as block. Between Firefox rendering block HTML5 elements inline, and IE rendering inline elements as block, it was all getting very confusing. Adding the zoom: 1; *display: inline; hack as per this helpful page from Mozilla resolved the issue. Somehow this doesn't seem to have any side-effects on other browsers, thankfully. Problem: Table Of Contents Item Numbering Status: (Partially) Resolved After putting in way too much time debugging, it looks like my use of the counters() function was breaking IE7's CSS parsing, causing it to stop applying any subsequent definitions from the stylesheet. Unsurprisingly, this caused a great load of other problems, like breaking the TL;DR block and code snippet styling. This function is used to create the item numbering in the 'Table of Contents' section used in articles. Unlike the native list-style property, using CSS counters allows creating numbering for the nested sub-lists, such as 2.1.1., and so forth. I tried various hacks to get this across the line. All in vain. Even using Internet Explorer's dreaded 'Conditional Comments' to include an IE-specific stylesheet couldn't accomplish much. This interesting article provides an extremely clever hack for implementing CSS numbering in early IE versions, however it seems fragile, and more work than it's worth. My options here seemed somewhat limited. After a lot of testing, it turns out that the counter() function (As opposed to counters) doesn't actually cause the same issue. Unfortunately this doesn't get us any closer to actual numbering, as IE7 and below didn't even support the ::before, and ::after CSS pseudo-elements, or the content property used to place the numbering in the first place. This solution also doesn't allow for the 'recursive' sub-list numbering on browsers that actually support counters, which was the whole point of using the function over the native list styling in the first place. After way too much messing around, I decided the best compromise was to revert to using the native list-style to number the Table of Contents items. This allowed for some numbering in both IE7, and other browsers. I apologise to anyone still suffering through this article. As if just to heap insult upon injury, the CSS outline property isn't supported in IE7 either, so my stylish double-border isn't going to show up either. I guess I'll just have to live without that one. Surprisingly, CSS counters were actually supported in IE as far back as 2009, so we only just missed out. 2003: T Minus 20 Years # Back in 2003 the browser landscape was like the wild-west. The browser wars were raging, and the internet was still an untamed frontier to be won. Browser vendors forged ahead on their own, breaking new ground wherever they could, resulting in such regrettable elements as <marquee>, <layer>, and even the infamous <blink>. 2003 would also see web developers Matt Mullenweg and Mike Little release the first version of the Wordpress Content Management System into the wild, irreconcilably entrenching PHP into the legacy of the entire internet. In case you're looking for who to blame, it's them. Internet Explorer 6.0 After dialling the clock back a full 20 years, things really began to fall apart. Problem: Main Page Styling Status: Solved At this point Internet Explorer 6 wasn't styling the front-page blog entries at all. I had a hunch, based on caniuse.com's suggestion, that this could be due to IE lacking support for the <ul> element... It turned out that this time it was actually IE's lack of support for the child combinator CSS selector. This now meant that I needed to explicitly prevent the nested 'tagged as' lists from picking up the styling of the main blog index entries. No problem, I guess. However this caused an issue on modern browsers where the nested lists do not behave correctly when the main blog index item is hovered. To remedy this without using child combinators I had to make judicious use of the background-color: unset; property on the nested list items. I guess that this is the kind of thing that still inspires hate for CSS. Problem: Index Entry Items Don't Highlight on Hover Status: Unresolved Unfortunately IE6 doesn't support the :hover CSS selector on arbitrary elements, so the front-page index blog entry elements no longer highlight when hovered over. I'm sure this would be easily resolvable with Javascript, but since that's out of the question we'll unfortunately just have to push on without it. Wrapping the entire index entry item in a link, and nesting the tag links creates all kinds of chaos, so we won't be considering that either. As the previous link notes, it's definitely possible to use some CSS positioning trickery to make the links appear visually nested. This is just a little bit too hacky for me though. This kind of CSS layout crime wizardry was definitely a hallmark of early 2000s web design, with its ubiquitous three column layouts precariously held together with the CSS equivalents of thumb-tacks and duct-tape. The Flexbox CSS layout method would eventually make this much more straightforward, but setting up a good vertical navbar in the 90s/00s was no laughing matter. Problem: Transparent PNG Support Status: Solved PNG transparency isn't supported in IE6. Unfortunately, there just wasn't anything else (reasonable) to do but convert the PNG images to transparent GIFs. Some quick imagemagick got the job done in no time, although the anti-aliasing effect of the PNG alpha channel is gone. I guess we can just make do like it's 2003 and live with that. Being confronted with the ghastly results of my hasty solution brought back memories of tweaking GIF image palettes in Paint Shop Pro (back when it was still owned by Jasc). It was pretty much standard in those days for any respectable site to have a page-width banner image in their header, and —of course— optimising them was serious business. Contemporary experts advised web designers to set total page size budgets stretching into the hundreds of kilobytes, the lion's share of which was often totally superfluous banner imagery. Thankfully those days of bloated, image heavy layouts are long gone... Only to be replaced instead by hundreds of kilobytes of bloated Javascript frameworks and analytics libraries. This epidemic of overweight websites has steadily declined into what the brilliant Maciej Cegłowski has so aptly titled The Website Obesity Crisis. In response to this worrisome trend, various sites have emerged encouraging those of us in the developer community to put our designs on a diet. Among them, the 1MB Club, 512kB Club, 250kB Club, and the truly daring 10kB Club. I don't quite make the cut for the latter, tipping the scales somewhere around the 20kB mark. Maybe this can be my next home-improvement project? Netscape Navigator 7.0 I didn't even have to wait for the Netscape 7.0 installation to finish before I'd start feeling nostalgic. The offer to install RealPlayer and Winamp was truly a blast from the past. Problem: Tag Item Hovered Background Colour Status: Unresolved Unfortunately, the issue I tackled above with the nested lists not picking up their parent list item's highlighted colour on hover was reoccurring in Netscape. The fix I used earlier of removing any implicit background colour didn't seem to accomplish anything here. Surprisingly, aside from this everything else was totally fine, so I was happy enough to write this one off and move on. As a side note, look at that interface! Check out the icons in the lower left-hand corner! 1998: T Minus 25 Years # Internet Explorer 5.0 To veterans of the browser wa"
