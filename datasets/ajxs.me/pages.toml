description = "An introductory technical analysis of the Yamaha DX7, detailing some of the known information about the synthesiser’s engineering."
full_description = '''Yamaha DX7 Technical Analysis 2021.04.23 An introductory technical analysis of the Yamaha DX7, detailing some of the known information about the synthesiser’s engineering. Tagged as: DX7 Musical Equipment Reverse Engineering Synthesizers Foreword # This article is intended to serve as an introductory technical analysis of the Yamaha DX7, detailing some of the known information about the synthesiser's engineering. This article doesn't intend to be an exhaustive repository of such information, or as reference material for technical means. Instead it intends to provide an informative overview of the subject. The intended audience for this article is people with a software-engineering or similar technical background who are interested in the technical aspects of synthesisers. Updates # Since this article was originally published, in April 2021, much new research into the DX7's technical implementation has taken place. Ken Shirriff managed the incredible feat of decapulsating the OPS chip, and analysing its functionality. This revealed, among other things, the format of the internal sine, and exponential ROM tables; I was able to disassemble, and document the DX7's firmware ROM, revealing many interesting technical details; Veteran audio-plugin designers Plogue released the groundbreaking Chipsynth OPS7. Representing what is likely the definitive emulation of the DX7 to date; and some of Yamaha's internal documentation about the DX7 surfaced. Providing some useful information about the synth's sound chips, and hardware. This article has been updated to reflect these new developments. Acknowledgements # The debt of gratitude this article owes to the hard work of others is so great that I would be remiss to even risk taking undue credit for their efforts. This article would not have been possible without the work of Acreil, Raph Levien, the Dexed team, and Steffen Ohrendorf. I would also like to thank MadFame for his fantastic research into the DX7's history. Table of Contents Introduction Hardware YM21280 YM21290 DAC Afterword and Going Further References Introduction # In 1983 Yamaha Corporation released the now iconic DX7 synthesiser. Featuring a novel form of digital synthesis called frequency modulation, it would introduce musicians to a new world of sounds not previously possible with its analog contemporaries. Its characteristic brassy, metallic timbres would go on to define the sound of the decade. By all accounts it was revolutionary. It would go on to sell over 200,000 units worldwide, becoming the first commercially successful digital synthesiser. The frequency modulation synthesis that forms the basis of the DX7 had its origins in the research of Stanford University professor John M. Chowning. Inspired by the groundbreaking work of Max Mathews at Bell Labs, Chowning shifted his course of study from music composition to focus on computer music. While experimenting with modulating a sound wave's frequency, Chowning discovered that as the frequency of the modulating wave increased into the audible spectrum, interesting harmonic partials appeared in the carrier tone, while still retaining the original note's pitch. He quickly realised this technique opened up a new world of tonal possibilities that contemporary analog synthesisers simply couldn't match. The significance of Chowning's discovery was not lost on his colleagues, who urged him to patent this remarkable new technique1. With the help of Andy Moorer from Stanford's Artificial Intelligence Lab, Chowning would publish the groundbreaking paper The Synthesis of Complex Audio Spectra by Means of Frequency Modulation, and United States Patent No. 4,018,121. In mathematical terms, FM synthesis is achieved by using the instantaneous amplitude of a signal (the modulator) to adjust the frequency of another signal (the carrier). This might make more sense when visualised: The above diagram demonstrates the variable rate of change in the phase angle of the modulated carrier wave's signal. There are many fantastic resources online that give a much better explanation of FM synthesis than I can. Here is a particularly informative resource that I recommend. Another more mathematical approach to frequency modulation can be found here, created by composer and synthesiser pioneer Barry Truax. By the mid-1970s, Stanford's Office of technology and licensing had yet to successfully find a prospective licensee for their breakthrough among American music technology manufacturers2. The investment required to pivot to digital technology was simply too big a financial risk to take for companies specialising in analog synthesisers. To find a licensee, Stanford would need to look abroad: Despite not having a significant market presence on American shores, Yamaha was at that time the largest manufacturer of musical instruments in the world. As fate would have it, one of their senior engineers —an expert in digital technology named Kazukiyo Ishimura— happened to be visiting their American branch at the time, apparently researching the very kind of integrated circuit technology that would make their future FM synthesis technology possible. He was willing to take a trip out to Stanford to hear Chowning's breakthrough for himself. In Chowning's own words: "In ten minutes he understood; he knew exactly what I was talking about" (Darter, 1985). Impressed with what they saw, Yamaha would go on to purchase an exclusive license to the technology from Stanford. The rest is history. For more information about Chowning and Yamaha's collaboration, a fantastic documentary on the history of the DX7's development can be seen here, put together by the amazing synth historian, and patch creator MadFame Roland Corporation's founder Ikutarō Kakehashi also met with Chowning to discuss his research. Unfortunately slightly too late to secure FM synthesis for Roland, with Stanford having signed an exclusive license with Yamaha only six months earlier. In his memoirs, Kakehashi admits that Yamaha were the right people for the job, given their capability to manufacture the LSI chips necessary to make the technology viable. (Kakehashi, 2002, pp. 194-195) Roland's technical R&D director Tadao Kikumoto —himself no stranger to innovation, having been the inventor of the iconic TB-303— spent a year poring over Yamaha's technical literature looking for a way to implement an FM synth without running afoul of patent infringement3, He would also invest considerable time searching high and low for prior art that would invalidate Yamaha's patent. A search that would ultimately not prove fruitful (Reiffenstein, 2004, pp. 275-276). However unsuccessful these efforts may have been, Roland's research in the area of digital synthesis would ultimately lead them to produce their own groundbreaking digital synth: The D50. Yamaha's approach to patenting their FM technology is by all accounts comprehensive. It's through these patents, service manuals, and the heroic reverse engineering efforts of some extremely talented engineers that we've been able to gleam what information we know of the DX7's internals. Hardware # The beating heart of the DX7 is a Hitachi 63B03RP microprocessor, an enhanced version of Motorola's 6800 series of 8-bit CPUs, built under license as a second-source supplier4. Clocked at around 1MHz, it provides the synthesiser a steady pulse, but not the kind of raw processing power required for real-time digital synthesis. The DX7's real capabilities lay inside two proprietary integrated circuits: the YM21280 FM-Operator Type S chip, otherwise known in Yamaha's technical literature as the OPS, and its counterpart the YM21290 Envelope Generator or EGS. As their names suggest, the OPS and EGS are responsible for operator and envelope generation respectively. We know from the service manual that the OPS processes all 16 six-operator voices in ~20.368032μs. From this we can determine that the synth's overall sample rate is 49096Hz. MIDI I/O is handled by the synth's CPU, while the scanning of the DX7's analog input (keyboard, foot pedal, and panel switch events) is handled by a separate "sub-CPU", a Hitachi 6805S 8-bit processor. The sub-CPU communicates with the synth's analog peripherals via a multiplexed A/D converter, and transmits this data to the main CPU via one of its IO ports using a complex handshake mechanism described in detail in the service manual. The DX7's smaller desktop module cousin, the TX7, has an entirely different design. It features a different microprocessor, the Hitachi HD63A03, and does not include a sub-CPU. All input scanning is performed by the main processor. The TX7's service manual —an incredibly detailed source of technical information— provides a memory map for the CPU, as well as a flowchart of the serial interrupt routine, timer interrupt routine, and main executive loop. The DX7's budget-oriented counterpart, the DX9 would also make do without the DX7's sub-CPU. YM21280 # Each of the DX7's six operators consist of a digital sine wave oscillator, with its own independent envelope. In technical terms, these are known as numerically controlled oscillators: A phase accumulator register is used to store an index into a lookup table of wave amplitude values stored in ROM. In this system the angular velocity of the oscillator's wave is controlled by incrementing the phase accumulator each sampling iteration with an amount proportional to the desired frequency. This implementation forms the basis of Direct Digital Synthesis, a technique used in a variety of different engineering disciplines. The above diagram illustrates the relationship between the phase accumulator register and the oscillator's sinusoidal output. 110hz, 220hz and 440hz waves are synthesised by varying the gradient of the phase increment. The diagram demonstrates that the phase accumulator value resembles a modulo-2n sawtooth wave when plotted, where n is the resolution of the wave lookup table. The YM21280's pre-calculated sine wave lookup table is stored in logarithmic format. Using a novel mathematical trick known to anyone familiar with a slide-rule, storing the oscillator's wave data in logarithmic format allows for scaling the wave's amplitude without the need for multiplication5. Given the logarithmic identity: log(xy) = log(x) + log(y), storing the operator's wave and envelope data in logarithmic form allows for replacing the multiplication of the wave's amplitude with the envelope gain with a relatively cheap addition operation. To convert the product of this calculation from logarithmic to linear format, the OPS stores a lookup table of exponential values. The remarkably talented Ken Shirriff has been able to decapsulate the YM21280, and reverse-engineer its internal implementation. From his amazing research, we know that the OPS' sine ROM uses a clever delta encoding mechanism to reduce the amount of die space needed to store the lookup table. The full details of which are available in his blog. He has also been able to demonstrate that the final format of the sine table is a 14-bit fixed-point representation. Taking full advantage of the sine wave's symmetrical property, the OPS stores only a quarter of the sine's full period. This quarter can be flipped and mirrored to assemble the full sine wave. Ken Shirriff's decapsulation on the OPS chip verified that the quarter log-sine table consists of 1024 samples, with a fully assembled sine wave having 40966. The best description I've found of the process of constructing the operator samples from the sine and exponential tables has been made by the amazing Steffen Ohrendorf, who has documented the process for the OPL3 here in a brilliant, mathematically correct notation. Prior to Ken Shirriff's decapsulation of the YM21280, two studious engineers Matthew Gambrell and Olli Niemitalo were able to decapsulate the YMF262 (otherwise known as the OPL3, a nineties-era 2-operator Yamaha FM sound-chip designed for use within PC sound-cards), and read the binary ROM data encoded in the chip's die. Their work provided much of the publicly known information about the implementation of Yamaha's FM sound chips. Once the correct phase data has been calculated for each of the operators, the actual frequency modulation is performed. The sinusoidal output of one operator (described in the patent as f(ωmt)) is then used to modulate the phase angle7 (Kωt) of another operator acting as a carrier. In the patent's poetic flourish: "...the sine wave table provides an instantaneous amplitude value of the frequency modulated signal, i.e., sin {Kωt + f(ωmt)}". The service manual provides a surprisingly in-depth description of how data is stored in the OPS' internal registers during the synthesis process (considering that no datasheet for the EGS or OPS is publicly available). Describing the process used in several different distinct algorithms in detail. Feedback The DX7's feedback mechanism is implemented by storing the result of processing an operator, and using it to modulate its own frequency over multiple iterations: The output amplitude of the last iteration is added to the phase accumulator value used as the input for the next. As the feedback iterations increase the sinusoidal operator output approaches the appearance of a sawtooth wave. For interested readers, US patent 4,249,447 contains a detailed description of the feedback synthesis process. The 'anti-hunting' filter mentioned in the patent literature is applied as an anti-aliasing measure, implemented by averaging the latest sample with the previous. This page, written by composer, and researcher Risto Holopainen, gives a very detailed overview of the hunting phenomenon described in the patent by Yamaha engineer Norio Tomisawa8. YM21290 # The YM21290 (EGS) chip is the entry point of the DX7's tone synthesis process. It receives voice data from the synth's firmware, then generates the frequency and envelope amplitude data used by the YM21280 to generate the actual tone. We know from the service manual and schematics that this frequency data has a word-length of 14 bits, and that the amplitude has a word-length of 12 bits, and that these are sent to the OPS over a parallel interface. According to Raph Levien, whose fantastic engineering serves as the basis of the highly acclaimed Dexed emulator: "Through measurement, it's clear that the 12-bit envelope value is a simple Q8 fixed-point representation of logarithmic (base 2) gain. Linear gain is equal to 2^(value / 256). The steps are particularly clearly seen in plots of amplitude for slow-decaying envelopes. This gives a total of about 96dB of dynamic range, in steps of approximately 6 / 256 = .0234 dB, which is smooth to the ear." The exact internal representation of this numerical data remains the subject of debate, however Raph Levien's conjecture above regarding the representation of numerical data stands up to scrutiny. As they say, the proof is in the pudding: These fo'''
