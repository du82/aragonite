full_description = "After finishing my article 'The Identity of The Sanctimonious Kid' , I couldn't help but wonder if there was still more information out there to be found. There were still a few loose ends that needed tying up, and a few promising leads to follow. I've found myself drawn back into Jack Black's world, searching through historic newspapers clippings for clues about the fate of the 'Sanctimonious Kid', and the characters who rode the rails with him in search of adventure and fortune. There are still a few escapees from Canon City prison to investigate, and a wealth of newspapers to search for clues about Black's other adventures. Eventually, if we're lucky, this might lead to another article. If you'd like to help with this research, please get in touch! Research is very time consuming, and working with the various state archives can be slow and difficult from outside of the United States. Any help on this project would definitely be appreciated. I've been doing a lot of work on my hobby operating system projects in Ada. I've been teaching myself about microkernels, and researching what kind of novel ideas might feature in next-generation kernels. I have lots of ideas, but unfortunately not enough time to write about them all. Here's a few random article ideas I've jotted down in my notepad, in no particular order: Some of these article ideas are more developed than others. I can't make any promises about finishing any of these articles, but if you'd particularly like me to work on them, please let me know!"
