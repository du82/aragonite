description = "A gentle introduction to reverse-engineering vintage synthesiser ROMs using the Ghidra disassembler."
full_description = "Introduction to Reverse-Engineering Vintage Synth Firmware 2024.03.18 A gentle introduction to reverse-engineering vintage synthesiser ROMs using the Ghidra disassembler. Tagged as: DX7 Musical Equipment Reverse Engineering Synthesizers In this article we're going to take a look at how to reverse-engineer vintage synthesiser firmware. The synthesiser I've chosen for us to look at is the Yamaha DX7 (See Appendix: Why Choose This Synth?). You don't need a DX7 to follow along at home, but you will need a copy of the DX7 V1.8 firmware (available here) and the Ghidra disassembler. Who is this article for? This article's intended audience is people from a technical background who are new to reverse-engineering, 8-bit architectures, or embedded development. If you come from an electrical-engineering or embedded-software background, you'll probably find the content here a little basic. You'll only need to know a little bit about low-level programming: A basic understanding of how binary and pointers work should be enough. You don't need to know assembly language, or understand any specific processor architecture. A few years ago I decided to give myself a crash course on what goes on inside synthesisers. I ended up writing the article Yamaha DX7 Technical Analysis about what I'd learned. In order to tease out some more details about the DX7's inner-workings, I decided to disassemble the synth's firmware ROM. I didn't have any experience with reverse-engineering binaries, so I had to figure it out as I went. I'm still by no means an expert (if you see any mistakes in this article, please let me know!), but I'd like to share what I've learned. All I had when I started was a copy of the firmware, a copy of the service manual, and a can-do attitude. I knew nothing about 8-bit systems, and absolutely nothing about electronics, but I was willing to give anything a shot. If this sounds like you, read on, and I hope you find this article helpful! Table of Contents Address Decoding Decoding the DX7's Memory Map The Firmware ROM RAM LCD Screen Wrapping Up Disassembling The Firmware The Reset Function Interrupts LCD Interface Going Further The MIDI Handling Routine Debugging the Firmware in an Emulator Final Words Appendix: Why Choose This Synth? Appendix: Documentation Reverse-engineering vintage synthesisers is a great introduction to embedded systems, and can be a lot of fun. In a lot of ways reverse-engineering is a bit like putting together a big jigsaw puzzle. Sometimes putting a new piece in place unlocks a lot of new progress, and like a jigsaw puzzle, the best place to start is at the edges. Address Decoding # The peripheral devices attached to the DX7's CPU, such as its LCD screen and sound chips, are memory-mapped. This means that the device has been allocated a specific address range in the system's memory, and the system communicates with the device by reading and writing data from and to these addresses. Before we can start disassembling the firmware ROM, we need to know what peripheral device is mapped where. To do that we'll need to look at the DX7's address decoding logic. The first place to start is with the schematics. The best version of the schematics I've seen is this version, created by the yamahamusicians.com user Miks. While you're at it, grab a copy of the service manual too. We won't be referencing it in this article, but it's a good resource to have. It explains certain details about the synth's architecture that aren't obvious from the schematics. Service Manuals: Most consumer devices from the 80s and 90s have service manuals available. These are technical documents written by the manufacturer to assist in servicing the device. They typically include schematics, diagrams, and lists of electrical components. The first place to start when reverse-engineering a device is looking for its service manual. If you're new to electronics, device schematics can look very intimidating, but once you understand the basics they're not actually as scary as they look! You can find a good introductory guide to schematics here. Background But first, what does address decoding actually mean? Address decoding refers to how a specific device is mapped to a specific address. In this section we'll figure out what peripheral is mapped to what address by tracing the address decoding logic in the synth's schematics. The total amount of memory addresses that a CPU can access is referred to as the CPU's 'address space'. This is limited by the width of its 'address bus'. The CPU's address bus is responsible for selecting addresses in attached memory devices, such as RAM, or peripheral devices with addressable registers. Each line in the address bus represents a single bit, with the total number of lines determining the address range the CPU can access. For example, a 16-bit address bus can address 216 unique memory locations, or 64KiB. When a CPU's address lines are exposed externally in the form of pins on the chip's package, this is called an external address bus1. These lines can be physically connected to external memory devices. Together with the CPU's data bus, this allow reading and writing binary data back and forth. When the CPU performs an instruction that reads or writes memory, like LDB 0x2001, several things happen: The CPU's external address pins are set to high and low logic levels according to the specified address. For address 0x2001 (0b0010_0000_0000_0001), address pins 0 and 13 will be high, and all the others will be low. The CPU's RW pin will be set high to indicate that this is a read operation, and... The CPU will prepare to accept the incoming data at 0x2001 over the data bus into the B register. But wait... If the CPU only has one set of address and data bus lines, how do you connect multiple memory devices to the CPU? This is where the 'Chip Select' interface comes in: Each device attached to the CPU's data/address buses has a 'Chip Select' pin, controlling whether the device responds to incoming signals. Consider the above (incredibly simplified) diagram: Two 8KiB 6264 RAM chips (U3 and U4) are connected to shared address and data buses on a Z80 CPU. U3's CE1 (Chip Enable) pin is connected to the CPU's A13 pin. The bar over the top of the label indicates that this pin is 'Active Low', meaning a low logic level will 'activate' its function. When the CPU selects an address between 0x0 and 0x1FFF, the A13 pin will be low, activating the U3 chip. U4's CE1 pin is attached to the CPU's A13 pin via a NOT gate, which inverts the signal coming from A13. When an address above 0x1FFF is selected, A13 will be set high, selecting the U4 chip. This effectively maps U3 to the first 8KiB of the system's memory, and U4 to the next. Can you spot the problem with this example? Since any address using A13 will 'select' U4, U4 is now mapped to every 8KiB block of memory above 0x1FFF. In reality, more sophisticated logic is used to map memory devices. Let's examine the real world example of the DX7's address decoding circuitry. Logic Gates: The DX7's address decoding logic is primarily implemented via the use of logic gates. If you're not familiar with logic gates, a good introduction to the topic can be found here. Don't worry though, we're not going to be going too in-depth. A basic understanding of what AND, OR, and NOT gates do is all you need. One particular type of component you'll encounter a lot inside vintage synthesisers are 7400-series logic chips. Decoding the DX7's Memory Map # Nearly all of the discrete electrical components that make up a DX7 are commonly available products. They're mass-manufactured and sold by a variety of different manufacturers. The best way to understand these components is to read the datasheets made available by the manufacturer. I'll provide links to these as we go. Note: The creator of the DX7 schematics used the logic symbols · and + to denote AND and OR gates, rather than the more standard ANSI, or IEC notations [pdf]. Other gates use the ANSI notation. The Firmware ROM # Let's start by taking a look at the firmware ROM, IC14. An excerpt from the Yamaha DX7's schematics, with the ROM address mapping logic highlighted. In the schematic we can see that IC14's CE1 pin is connected to the CPU's A14/A15 lines via an AND gate, and a NOT gate. What's going on here? The AND gate ensures that the signal is only high when both address lines are active, and the NOT gate inverts the signal so that it activates the active-low CE1 pin. If A14 and A15 being active on the CPU 'selects' the ROM chip, that means it's mapped to the address range 0xC000 - 0xFFFF2. Awesome! That wasn't so hard. Now we know where the ROM is mapped in memory. What's next? RAM # The address decoding logic for the RAM is a little more complicated. An excerpt from the Yamaha DX7's schematics, with the RAM address mapping logic highlighted. The DX7 features three 4KiB 5118P RAM chips (IC19, 20, 21). These are connected to the CPU's address bus via a 74LS138 demultiplexer (IC23). This demultiplexing circuit is used to select one of 8 individual output lines based on a 3-bit input signal. These output lines are labeled as Y0 - Y7, and the input lines as DA, DB, and DC. The OR gates used here are wired to the system clock output pin. Presumably to ensure the timing of read and write operations are valid. The 'Function Table' from the 74LS138P's datasheet, showing what combinations of input lines select which output line. The first RAM chip (IC19)'s chip select terminal is connected to the demultiplexer's Y2 line. The 'Function Table' from the 74LS138P datasheet shows that Y2 will be set low when input DB (connected to the CPU's A12) is high. Therefore, when the CPU selects address 0x1000, the first RAM chip will be selected. Y3 (connected to the second RAM chip, IC20) will be set low when inputs DA and DB (A11 and A12) are high, corresponding to an address of 0x1800. Likewise, Y4 (connected to IC21) corresponds to an address of 0x2000. By tracing this address decoding logic, we've successfully mapped the synth's RAM to 0x1000 - 0x2800. LCD Screen # The last peripheral we're going to look at right now is the synth's LCD screen. When you take your first peek inside a binary you'll be staring at an intimidating jumble of machine code. One of the few things that will stand out at a glance is ASCII strings. A good way to get a quick overview of the binary is finding out how these strings are printed to the screen, and where. The best place to start doing that is understanding how the CPU interfaces with the LCD controller, and working your way backwards to the code responsible for sending string data to it. Once you've found how strings are printed to the screen, you can easily see what's printed where to get a better understanding of the code. An excerpt from the Yamaha DX7's schematics, with the LCD address mapping logic highlighted. The LCD address mapping logic might look really complicated, but don't worry though. It's just more of the same logic as before. IC23's Y5 pin is connected to IC24, another 74LS138 demultiplexer. From the 74LS138 function table we know that Y5 goes low when inputs A, and C (A11 and A13) are high. So it looks like IC24 is mapped to 0x2800. Take a look at IC24: Inputs A, B and C are wired to A1, A2 and A3. That means that IC24 only maps 8 bytes. IC24's Y0 and Y1 pins are connected to an AND gate connected to the 'chip select' pin of IC12. What's happening here? This might seem a little confusing at first, but since the 74LS138P's outputs are active-low, this makes LCDCS active when either Y0 or Y1 are active. This maps IC12 to the four-byte range 0x2800 - 0x2803. Awesome. But what's IC12 doing? IC12 is an Intel 8255 Programmable Peripheral Interface (PPI). It provides 24 parallel, bidirectional IO lines3. An excerpt from the Intel 8255 datasheet showing its basic operations. The schematics show the LCD's parallel interface (DB0 - DB7) is connected to the PPI's port A (PA0 - PA7), and its control pins (E, RW and RS) to the PPI's port B (PB0 - PB2). The Hitachi LM016 LCD screen used in the DX7 features the ubiquitous Hitachi HD44780 LCD Controller. According to its datasheet (available here) it has two registers. When its RS line (connected to the PPI's PB0) is low, the instruction register is selected. When high, the data register is selected. Based on the HD44780 datasheet, and the above table from the 8255's datasheet, we can tell that the LCD's data register must be mapped to 0x2800, and its control register to 0x2801. We'll go into more detail about the LCD controller itself later in the article. Wrapping Up # Now we've got a pretty good idea of what's going on where in the memory map, and how this is discovered. To save you the trouble of going through the whole schematic, here are all the memory-mapped peripheral addresses. Address Range Peripheral 0x1000 - 0x2800RAM (External) 0x2800LCD Data 0x2801LCD Control 0x2802Sustain/Portamento Pedals, and LCD Busy Line 0x28038255 Peripheral Controller Control Register 0x2804OPS Mode register 0x2805OPS Algorithm/Feedback register 0x280ADAC Volume 0x280ELED1 0x280FLED2 0x3000 - 0x4000EGS 0x4000 - 0x5000Cartridge Interface 0xC000 - 0xFFFFROM These aren't the only peripherals attached to the system, the Hitachi 6303 CPU also features 'IO Ports'. These are memory-mapped input/output lines with their own dedicated functionality. We'll touch on these later in the article. Disassembling The Firmware # Now that we know the memory map, we can start disassembling the firmware. To do this we'll use a graphical disassembler called Ghidra4. It's a relatively new player on the scene, but it's free, open source, and very powerful. A great resource to keep handy while working with Ghidra is the Ghidra Cheat Sheet. Ghidra 6303 Support: As of the time of writing, Ghidra doesn't yet support the HD6303 architecture out of the box, so we'll need to install our own language specification. This repository contains a Ghidra language specification for the 6303 architecture. To install it, download the repository and copy the 6303 directory to the Ghidra/Processors directory inside your Ghidra installation. You'll need to restart Ghidra to see the new processor in the list. Once you've installed the language definitions, open Ghidra and create a new project. The first thing we're going to need to do is to import the firmware ROM binary. Select the '6303' language, and click 'OK'. Next, open up the Codebrowser. This is where all the action happens. Once the initial disassembly loads, the first thing you'll be looking at is row after row of hexadecimal. This is the actual machine code as it would appear to the CPU. Don't bother with analyzing the file. The first thing we're going to do is set up the memory map. Remember that thing we just did all that hard work figuring out? That's going to come in handy now. Press the 'Display Memory Map' icon in the top button bar, to open up the Memo"
