full_description = "How do I cancel my subscription? You can manage your paid subscriptions from the account page:https://akismet.com/account/ Note: Akismet uses WordPress.com user accounts for account management. In order to manage your Akismet plan, access Akismet billing information, or update Akismet payment methods, please log in using your WordPress.com account. If you have forgotten your WordPress.com account password, you can reset it here:https://wordpress.com/wp‑login.php?action=lostpassword On your accounts page, you will see an “Edit” link next to each subscription. Click that link to manage your subscription, including cancelling it. If you’re not able to cancel your subscription from your account page, please contact Akismet Support. How can I delete my account? Your Akismet subscription is connected to your WordPress.com account. Usually, if you’d like to stop using Akismet, it’s sufficient to cancel your Akismet plan — you don’t need to also delete your WordPress.com account. Deleting your WordPress.com account means you will no longer be able to use any connected services from Akismet, WordPress.com, Jetpack, or Gravatar. If you’d still prefer to delete your account, you can follow these steps: Log into WordPress.com. Navigate to Account Settings, scroll to the bottom, and click Close your account permanently: After a few weeks, your account data will be entirely purged from our servers, and the process cannot be reversed. Therefore, please be certain you want to cancel your entire WordPress.com presence before proceeding. If you have general questions about Akismet, please contact us. Related"
