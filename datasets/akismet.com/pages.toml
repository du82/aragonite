description = "While most people know about the Akismet plugin for WordPress sites, Akismet has also been integrated into other systems and libraries. Here are the ones we know about: Plugins WordPress plugins Contact forms Jetpack Contact Form 7 with Flamingo Gravity Forms Other contact forms E-commerce WooCommerce product reviews (for protection against fraudulent orders, you will need an…"
full_description = "Plugins and libraries While most people know about the Akismet plugin for WordPress sites, Akismet has also been integrated into other systems and libraries. Here are the ones we know about: Plugins WordPress plugins Contact forms Jetpack Contact Form 7 with Flamingo Gravity Forms Other contact forms E-commerce WooCommerce product reviews (for protection against fraudulent orders, you will need an anti‑fraud solution) Comments Official WordPress Plugin Donations GiveWP Other Content Management Systems (CMS) Drupal AntiSpam Module (Drupal) Antispam (Perch) AkismetKlik (Mediawiki) MediaWiki-Akismet (Mediawiki) Advanced Spam Cleaner (Moodle) SpamDetector (Piranha CMS) Forums discourse-akismet (Discourse) Spam-o-mattic (vBulletin) Akismet Anti-Spam Extension (phpBB) Spam Remover (phpBB) Other Piwigo Akismet Plugin for PHPList3 Libraries Dart: Dart Connector for Akismet Elixir: Akismet for Elixir Elixir: Exkismet JavaScript: Node.js bindings to the Akismet API JavaScript: Akismet for JS (Node.js): Prevent comment spam using JavaScript Kotlin/Java: Akismet for Kotlin/Java by Erik C. Thauvin PHP: Akismet Client Library for PHP by Omines Internetbureau PHP: laravel‑akismet (newer Laravel) PHP: Laravel 4 framework (older Laravel) PHP: Tiki Wiki CMS Groupware PHP: PHP 4 class by Bret Kuhns PHP: Fuspam PHP function Python: akismet: unofficial Python Akismet API library. Python: python-akismet Python: pykismet3: Python 3 Akismet client (used by Django forms) Ruby: RubyGem: Rakismet Ruby: RubyGem: Akismet (unofficial) Go: go-akismet .NET: Akismet: unofficial “dot-net” Akismet API library. .NET: AkismetApi.Net: another, more complete, unofficial “dot-net” Akismet API library. Perl: Net::Akismet: Perl interface to Akismet – comment and trackback spam fighter. Haxe: Akismet for Haxe Rust: Instant Akismet If you don’t see a suitable library for your language or framework, you may be able to use our OpenAPI specification to generate one. We recommend using OpenAPI Generator. If you’ve created your own Akismet integration using our API and want to be included on this list, please contact us. Note that since Akismet’s heuristics are heavily influenced by missed spam and false positive reporting, we expect your software to implement those features to be listed on this page. We might make an exception if the context for which you are programming does not provide you with a way to realistically integrate those endpoints. Related"
