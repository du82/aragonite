full_description = "Response error codes Akismet API response errors Learn about the different statuses and error messages An API response may include an error code in the X‑akismet‑alert‑code header. It is always accompanied by a X‑akismet‑alert‑msg header containing a message describing the error that can be shown to the end user, but the list below includes all of the currently active error codes for reference. 10001Your site is using an expired Yahoo! Small Business API key. 10003You must upgrade your Personal subscription to continue using Akismet. 10005Your Akismet API key may be in use by someone else. 10006Your subscription has been suspended due to improper use. 10009Your subscription has been suspended due to overuse. 10010Your subscription has been suspended due to inappropriate use. 10011Your subscription needs to be upgraded due to high usage. 10402Your API key was suspended for non-payment. 10403The owner of your API key has revoked your site’s access to the key. 10404Your site was not found in the list of sites allowed to use the API key you used. 30001Your Personal subscription needs to be upgraded based on your usage. Can we help with anything else? I need to update my credit card. I forgot my API key. I need to reset my password. I need to cancel my subscription. Priority support Want to get help even faster? Don’t forget that our Pro subscription includes priority email support. Related"
