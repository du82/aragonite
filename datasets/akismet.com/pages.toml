["https://akismet.com/support/getting-started/using-akismet-with-your-contact-forms"]
title = "Use Akismet with your contact forms – Akismet"
description = "Akismet integrates with several popular contact form plugins to help stop spam arriving via the forms on your site. Some of these integrations are automatic, but others require a bit of configuration. You will need an active Akismet subscription to use Akismet with your contact forms. Please note that once Akismet is activated on your…"
full_description = "Use Akismet with your contact forms Akismet integrates with several popular contact form plugins to help stop spam arriving via the forms on your site. Some of these integrations are automatic, but others require a bit of configuration. You will need an active Akismet subscription to use Akismet with your contact forms. Please note that once Akismet is activated on your site, it will check both blog comments and contact forms if you have them. It is not possible to activate Akismet on one but not the other. Protect contact forms automatically Jetpack Contact Form With Jetpack’s contact form (either the Form block, or the classic editor version), then all of your contact form submissions are automatically checked for spam by Akismet. No additional set‑up required! You can also manually mark comments as spam/not spam via the Feedback section of WP Admin. Configure contact forms to work with Akismet Contact Form 7 To use Akismet on Contact Form 7, please add some specific options to your contact form fields. Contact Form 7 doesn’t store contact form submissions on your site, so if you want the ability to manually mark them as spam/not spam, install the Flamingo plugin (from the same developer), which provides that ability. Gravity Forms Use Gravity Forms’ dedicated Akismet Add‑On which to integrate Akismet with any of your forms. You can also manually mark form submissions as spam/not spam. Elementor Forms Akismet is an available integration for users with an Elementor Advanced Plan or higher. To use Akismet with Elementor Forms, you’ll need to add an Akismet Anti‑spam filter to your forms. Ninja Forms To use Akismet with Ninja Forms, you’ll need to add an Akismet Anti‑spam Action to your form. Formidable Forms To use Akismet with Formidable Forms, you need to enable Akismet on each form where you want to use it. Fluent Forms To use Akismet with Fluent Forms, you need to enable Akismet in the global settings of the Fluent Forms dashboard. WS Form To use Akismet with WS Form, you need to configure each form to use Akismet. WPForms To use Akismet with WPForms, you need to configure each form to use Akismet. Forminator To use Akismet with Forminator, you need to configure each form to use Akismet. GiveWP GiveWP is a popular WordPress plugin to create donation forms. To use Akismet with GiveWP, you need to enable it in GiveWP settings. If you are using a GiveWP legacy form and find that Akismet is not catching spam donations, please try re‑saving the “Akismet enabled” settings in GiveWP. Caldera Forms As of April 5, 2022, Caldera Forms is no longer maintained. The following information is provided with that caveat. Please note that we’re not able to troubleshoot issues with Akismet related to this plugin. Caldera Forms offers an Akismet integration which requires you to have at least a name and email field in your form. You can configure the Akismet integration via the Processors tab on your form. Other plugins If you use another contact form plugin, please contact the plugin author to check if their plugin has an Akismet integration. Custom contact forms Akismet can work with custom contact forms as well. Here are some resources to help you get started: PHP examples in the API documentation for each of our Akismet endpoints. Existing libraries for Akismet We also provide an OpenAPI spec, which you can use for reference or to generate code. If you have general questions about Akismet, please contact us. Related"
