full_description = "Can Akismet check my old comments for spam? After you’ve activated Akismet, it will check all new comments for spam moving forward. If you have lots of existing spam comments sitting in your inbox, Akismet can check those for spam too! On your WP Admin dashboard, click on Comments. To check your existing comments for spam, click on the Check for Spam button. Akismet will begin checking through your existing comments. How long it will take depends on how many comments you have. If you have thousands of comments, the process might time out after a while, so you may need to come back and click the button again in order for Akismet to process through all of your comments. Related"
