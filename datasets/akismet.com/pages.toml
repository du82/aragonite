["https://akismet.com/support/billing/vat-invoice"]
title = "Can I Get a VAT invoice? – Akismet"
description = "Akismet and VAT Our services are subject to consumption-based taxes (sales tax) in many jurisdictions. Depending on your location, this can appear as Value Added Tax (VAT), Goods & Services Tax (GST), or Consumption Tax (CT). When making a purchase on Akismet.com, you are charged the relevant tax based on your billing address. The tax…"
full_description = "Can I Get a VAT invoice? Akismet and VAT Our services are subject to consumption‑based taxes (sales tax) in many jurisdictions. Depending on your location, this can appear as Value Added Tax (VAT), Goods & Services Tax (GST), or Consumption Tax (CT). When making a purchase on Akismet.com, you are charged the relevant tax based on your billing address. The tax will be displayed as an independent line item on the checkout screen. You can also find the tax charge listed on your billing receipt. Add VAT Information Add a VAT number to your account by following these steps: Navigate to the Profile section > VAT details. Enter your VAT details. Click ‘Validate and Save.’ Return to the Billing History tab to re‑send an email receipt with the VAT information included. Update VAT Information If you need to change an already saved VAT number, please contact support and provide: your company’s name business address VAT number Once we validate your information, we will send a VAT receipt to the email address on your account. Can I get an Invoice? We do not provide invoices as a request for payment. Instead, we issue receipts for payments that have already been processed. Our receipts can usually serve as a record of the transaction for tax purposes. You can view and download all past receipts by following the steps in this article: https://akismet.com/support/billing/where‑can‑i‑find‑my‑receipt/ Register your Tax‑Exempt Status If your organization is tax exempt, you can send us your tax exemption documentation, and we will add this to your account so that you will not be charged sales tax in future. Please contact support to get started and we will send a request for your documentation. If you have any other questions, please contact us. Related"
year_published = 2021
year_updated = 2024
