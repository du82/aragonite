description = "Download past receipts You can find and download receipts for all previous purchases in your account by following these steps: Start at https://wordpress.com/me/purchases/billing Look under 'Billing History.' Click the 'view receipt' link for each purchase or refund. When viewing a receipt, you can also add information such as your business address, under Billing Details before printing the…"
full_description = "Where can I find my receipt? Download past receipts You can find and download receipts for all previous purchases in your account by following these steps: Start at https://wordpress.com/me/purchases/billing Look under ‘Billing History.’ Click the ‘view receipt’ link for each purchase or refund. When viewing a receipt, you can also add information such as your business address, under Billing Details before printing the receipt. Value‑Added Tax (VAT) Our services are subject to consumption‑based taxes (sales tax) in many jurisdictions. Depending on your location, this can appear as Value Added Tax (VAT), Goods & Services Tax (GST), or Consumption Tax (CT). For more information on how we handle these taxes, please check out our aticle about How to Get a VAT Invoice. I Retrieve your transaction ID For each Akismet transaction, our payment processor generates a unique transaction ID to identify your transaction. It’s a string made up of both letters and numbers, and will look something like this: *AKISMET A1B2C3D4E5 We may request the transaction ID to look up your purchase, or to verify your account ownership. If you have any other questions, please contact us. Related"
