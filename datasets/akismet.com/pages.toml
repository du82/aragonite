description = "Subscription Upgrade Required Why am I receiving this error? Your service was suspended, as a Personal subscription is not appropriate for your current usage (multiple commercial sites). A warning message has appeared in your sites’ dashboards for several weeks regarding the problem. Which subscription should I choose? Our Pro subscriptions can be used on commercial…"
full_description = "Akismet Error #10006 Subscription Upgrade Required Akismet Error #10006 Why am I receiving this error? Your service was suspended, as a Personal subscription is not appropriate for your current usage (multiple commercial sites). A warning message has appeared in your sites’ dashboards for several weeks regarding the problem. Which subscription should I choose? Our Pro subscriptions can be used on commercial sites, with 4 different usage levels to choose from depending on your needs. You can add sites to a current Pro subscription by following these steps. If you need to use Akismet on a large network or multisite installation, one of our Business plans might be better for you. Please check out our plans page for the subscription that fits you best. What if an agency or studio set everything up? You can contact the folks who helped you get up and running, and let them know that their Akismet API key needs to be upgraded. Or – simply choose to register you own subscription and activate the Akismet plugin using your new API key. Can I just de‑activate Akismet? Yes. If you are currently using our WordPress plugin, go to the Plugins menu in your dashboard and click on the “Deactivate” link found directly under “Akismet.” If you happen to be using a different client, please refer to its documentation regarding deactivation. Note that your site(s) will then be left unprotected from spam, which is not recommended. Can we help with anything else? I need to update my credit card. I forgot my API key. I need to reset my password. I need to cancel my subscription. Priority support Want to get help even faster? Don’t forget that our Pro subscription includes priority email support. Related"
