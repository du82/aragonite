["https://akismet.com/support/features-2/stats"]
title = "Viewing your Akismet stats data – Akismet"
description = "All Akismet subscriptions include access to statistical data regarding their usage and activity. To access stats for any of your sites, please visit your account dashboard and scroll down to the Active Sites section. This section displays the top 500 sites associated with your key for the selected month. The sites are ordered by API usage. Click…"
full_description = "Viewing your Akismet stats data All Akismet subscriptions include access to statistical data regarding their usage and activity. To access stats for any of your sites, please visit your account dashboard and scroll down to the Active Sites section. This section displays the top 500 sites associated with your key for the selected month. The sites are ordered by API usage. Click on the three dots menu at the far right for access to more detailed stats for that site. (“See more stats.”) This will open the stats for that particular site in a brand new browser window. You can view monthly (monthly and daily if you have any subscription above Personal), annual, and historical stats. You can further customize the chart by selecting any data type (spam, ham, missed spam, or false positives) and removing it from view. You will also have access to a breakdown of your monthly stats: If you use Akismet on multiple sites and would like to see account‑wide stats, you can click on the “Check out account‑wide stats” link at the bottom of your Active Sites card. With a paid plan, you also have the option to download the stats by clicking the “Download data” button at the top of the dashboard. Downloading monthly stats data To download monthly stats data for your API key, visit your account dashboard and scroll down to the Active Sites section. Select a month and click the “Download CSV file” link. This will download a a CSV file containing the monthly API usage stats for the sites that were active during that month. If you have general questions about Akismet, please contact us. Related"
