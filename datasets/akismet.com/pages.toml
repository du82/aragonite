["https://akismet.com/contact"]
title = "Contact Us – Akismet"
description = "Contact us We're here to help. * You might wonder: if these guys are so good at blocking spam, why would they put a stupid question like this on their contact form to keep spam out? Well, Akismet is great at protecting contact forms; we use it on all our other sites, but on Akismet.com,…"
full_description = "Contact us We’re here to help. Please tell us more: I have a question about signing up or subscribing. I have a billing question. I have a technical support question. I think Akismet is catching my comments by mistake. I have an enterprise or large-scale question. I have a question about nonprofit accounts. Privacy: I want to opt my email address out of all long term tracking. You all are great! I have a question about developing an application or library with Akismet. I have a press/interview request. My site has been incorrectly classified as commercial. Your name Your email Company (optional) Your site URL (optional if you enter your API key below) API key (required only for paid priority support) Your message What is 14+7? * Submit * You might wonder: if these guys are so good at blocking spam, why would they put a stupid question like this on their contact form to keep spam out? Well, Akismet is great at protecting contact forms; we use it on all our other sites, but on Akismet.com, sometimes people use the contact form to tell us they’re being blocked by Akismet.If you think about that, blocking people when they’re trying to tell us they’re wrongly blocked would probably frustrate them, hence the math question. Immediate responses I need to update my credit card. I forgot my API key. I need to reset my password. I need to cancel my subscription. Priority support Want to get help even faster? Don’t forget that our Pro subscription includes priority email support."
