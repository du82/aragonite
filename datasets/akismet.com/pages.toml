full_description = "How do I change my account email address? To update your account email please visit your WordPress.com account settings page. There is a box where you can change your email address. After you update your email address remember to press the “Save Account Settings” button at the bottom of the page. The change will not become active right away. You will first need to confirm the change by clicking on the confirmation link in an email that will be sent to your new email address. A note for businesses using Akismet: we recommend that you use or create a general email address that will be accessible to the company, rather than an individual. (For example: akismet@yourbusiness.com.) This avoids the problem of your account becoming inaccessible should the person who created it leave the organization. If you have general questions about Akismet, please contact us. Related"
