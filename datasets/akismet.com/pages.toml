["https://akismet.com/billing/updating-payment-info"]
title = "How do I update my payment information? – Akismet"
description = "You can make changes to your Akismet billing settings, add and update payment methods, and reactivate cancelled plans by logging in to your Akismet account via WordPress.com. View and manage your payment methods To add or change payment methods for your Akismet plan, please follow these steps: First, log into your account:https://wordpress.com/me Go to your Purchases page.…"
full_description = "How do I update my payment information? Note: Akismet uses WordPress.com user accounts for account management. In order to manage your Akismet plan, access Akismet billing information, or update Akismet payment methods, please log in using your WordPress.com account. If you have forgotten your WordPress.com account password, you can reset it here:https://wordpress.com/wp‑login.php?action=lostpassword You can make changes to your Akismet billing settings, add and update payment methods, and reactivate cancelled plans by logging in to your Akismet account via WordPress.com. View and manage your payment methods To add or change payment methods for your Akismet plan, please follow these steps: First, log into your account:https://wordpress.com/me Go to your Purchases page. Click on Payment Methods. From there, you can delete existing payment methods, add new payment methods, assign a payment method to all of your plans, and assign a backup payment method. Add a new payment method: Click Add payment method and fill in the details. Optionally, you can also check/uncheck the box for Use this payment method for all subscriptions on my account. This will change the payment method for any subscriptions on your account. Assign a backup payment method: When the assigned payment method for a plan fails to renew its associated subscription, the billing system will then try to charge any of the listed backup payment methods. You can turn on this option by checking the box for Use as backup on any/all of your payment methods. Change or add a payment method to a specific plan If you would like to change/add the payment method for a specific plan, you can do so by: Go to https://wordpress.com/me/purchases. You should see a list of all of your active purchases. Click on the plan that you want to change/add the payment method on. Click Add payment method (or Change payment method if you have one already). Fill in the information. Optionally, you can also click the Use this payment method for all subscriptions on my account checkbox, and it will apply this new payment method to all of your plans. Payment methods For payment, we accept: All major credit and debit cards PayPal, in supported countries In some countries, we support additional local payment methods: Belgium: Bancontact China: Alipay, WeChat Pay Germany: Giropay The Netherlands: iDEAL Poland: Przelewy24 (P24) We cannot accept: Checks Cash Purchase or money orders Any payment that must be mailed Payment over the phone If you have general questions about Akismet, please contact us. Related"
year_published = 2013
year_updated = 2024
