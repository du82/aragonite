full_description = "How do I purchase a new Akismet plan? Note: Akismet uses WordPress.com user accounts for account management. In order to manage your Akismet plan, access Akismet billing information, or update Akismet payment methods, please log in using your WordPress.com account. If you have forgotten your WordPress.com account password, you can reset it here:https://wordpress.com/wp‑login.php?action=lostpassword Purchase a new plan If you need to purchase a new Akismet plan, please follow these steps: Visit the Akismet Pricing Page. When prompted, log into or create your account: https://wordpress.com/me/ Choose the plan that is right for you. Please note that purchasing a higher‑tier plan will not automatically cancel the lower‑tier plan. You can remove any plans you do not need by visiting your Purchases page in your account. If needed, please contact support to request that remaining credit from cancelled plans be applied to new purchases. Reactivate an expired plan If you had an Aksimet plan in the past but it has been canceled or expired, please follow these steps: Log into your Aksimet account. Under the Subscriptions section, click Edit next to the plan you would like to reinstate. This will take you to the Purchases page of your WordPress.com account. Click Renew now to go through the checkout process. If you have general questions about Akismet, please contact us. Related"
