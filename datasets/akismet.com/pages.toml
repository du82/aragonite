full_description = "How do I log into my Akismet account? Akismet uses WordPress.com user accounts for account management. To use Akismet you need to have a WordPress.com account. Already have a WordPress.com account? Great! Go ahead and sign into Akismet with your WordPress.com account. If you don’t remember your password for your WordPress.com user account, you can reset it using WordPress.com’s lost password form. Don’t have a WordPress.com account? If you don’t have a WordPress.com account, it only takes a few seconds to sign up and is totally free! Click “Sign in” on the Akismet.com homepage, and then click the “Create a new account” link. A note for businesses using Akismet: we recommend that you use or create a general email address that will be accessible to the company, rather than an individual. (For example: akismet@yourbusiness.com.) This avoids the problem of your account becoming inaccessible should the person who created it leave the organization. Not sure if you have a WordPress.com account? No problem! If you use VaultPress, Crowdsignal, Jetpack, IntenseDebate, or Gravatar, you can sign in with the same account you use for those services. You can contact Akismet support if you’re not sure and we’ll be happy to help! If you have general questions about Akismet, please contact us. Related"
