title = "A Better Way to Take Searchable Notes - Alastair Johnston"
description = "I needed to have a better way to retrieve useful information from my handwritten scrawls. A way that I could sit in a meeting, writing naturally with pen and paper, but at the same time be able to later use the information I had recorded. In other words, my notes…"
full_description = '''A Better Way to Take Searchable NotesApril 13, 2024I needed to have a better way to retrieve useful information from my handwritten scrawls. A way that I could sit in a meeting, writing naturally with pen and paper, but at the same time be able to later use the information I had recorded. In other words, my notes needed to be:HandwrittenIn my normal handwriting SearchableClear and concise for future recallI'd seen the Rocketbook note system before. A notebook (or printable templates) that could be scanned using a clever app and saved to email or cloud services like Dropbox. It was pretty clever. The app could also apply OCR to convert these scans into basic text files. Not bad, but not brilliant either. Formatting was a bit hit and miss, so required a fair amount of manual correction for typos, odd punctuation and clarity.The solution to this?A tool I've used a few times before - Claude AI. I uploaded the .txt file and asked Claude to "clean up the attached to be clearer and more concise." Whilst the final output was still plain text, it took little time to add the occasional bold, underline etc.So, by filing this text note, with the original pdf of the handwritten page, I ended up with useful, searchable notes, in double-quick time. Win-win!I think this is pretty cool. But if you're not convinced, maybe if I told you that I created this blog post using this very method, well what would you think then?Here's the original pdf...Here's the initial OCR text...And here's Claude's cleaned up text...Updated: May 11, 2024Tags:note takingtoolsShare this: Ten Arguments for Deleting Your Social Media Accounts Right Now - Book Review and Notes"You’re probably becoming more of an asshole, but you’re also probably sadder... your ability to know the world, to know truth, has been degraded, while...November 28, 2020 Digital Minimalism - book review & notesI recently read Cal Newport's latest book Digital Minimalism - On Living Better with Less Technology after being one of the volunteers who agreed to...January 29, 2020'''
