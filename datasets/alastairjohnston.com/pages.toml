["https://alastairjohnston.com/about"]
title = "About - Alastair Johnston"
description = "We don't beat the Grim Reaper by living longer, we beat the Reaper by living well and living fully, for the Reaper will come for all of us. The question is what do we do between the time we are born and the time he shows up. It's too late…"
full_description = '''AboutWe don't beat the Grim Reaper by living longer, we beat the Reaper by living well and living fully, for the Reaper will come for all of us. The question is what do we do between the time we are born and the time he shows up. It's too late to do all the things that you're gonna kinda get around to.- Randy Pausch, Carnegie Mellon Commencement Speech, 2008Hi, I’m Alastair JohnstonI write about living well.LIVING WELL?For me, it’s about doing good or meaningful work, living life to the full, being healthier, happier, living with a small footprint, simplicity, adventure - you know living a good life, which may or may not involve living something like The Good LifeWHY SHOULD YOU READ THIS BLOG?You should read this blog if you are interested in enjoying life, having more time, getting outside, having mini adventures, being healthier and happier, maybe finding meaning. But all of this from the perspective of a normal, middle-aged, family man. You see I'm not a sun-bronzed, perfect-teeth wielding American guru. Nope, not me I'm afraid. I have a job, wife, family, kids and dogs. I'm pretty ordinary. So any changes I can make, or any lessons I learn, will probably work for you dear reader too.BOASTING RIGHTSIn my day job I work at a major UK charity leading a team to recruit and support volunteers and fundraising groups - we've done pretty well! I've designed and shared a small planner method for the Bullet Journal community - yes I'm the Alastair who invented the Alastair method amongst other things. I'm a writer (here on this blog), photographer (you can buy my work here and here) and avid student of life.IS THIS YOU?How many times have you sat in your car, on a train, in a stuffy office and looked out of the window to a beautiful sunny day, or cold crisp frosty morning and thought "I don’t want to be here."Since I was in my 20’s I’ve often experienced that awful gnawing sensation in the pit of my stomach as I thought “Is this it?” Work, eat, sleep - rinse, repeat. 4 weeks holiday...This is a blog about life and living. About finding ways to have more time, more freedom, better health, more happiness, more contribution and more fun!So have you ever had the thought that “There’s more to life?”Yeah, me too.Finding that "more", well that's what this blog is all about...Updated: October 2, 2020Share this:'''
year_published = 2020
year_updated = 2020
clearnet = "https://alastairjohnston.com/about"
