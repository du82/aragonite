title = "Privacy Policy - Alastair Johnston"
description = "Please read the following statements carefully, as they address the rules of engagement between us. Your privacy is critically important to me. I want to assure you I respect your data protection rights in compliance with the latest EU General Data Protection Regulation (GDPR) requirements as of 25th May 2018."
full_description = "Privacy PolicyMay 20, 2018Please read the following statements carefully, as they address the rules of engagement between us.Your privacy is critically important to me. I want to assure you I respect your data protection rights in compliance with the latest EU General Data Protection Regulation (GDPR) requirements as of 25th May 2018.This Website is owned and operated by Alastair Johnston. The following terms and conditions govern your use of this site and products, some of which (but not all) are listed herein.For the purpose of this agreement and for ease of use, any reference to “my Websites” shall be a reference to any and all websites owned by Alastair Johnston, my respective products, and my employees and agents.My Websites include, but are not limited to: alastairjohnston.co.uk, alastairjohnston.com, alastairjohnston.ukBy accessing my Websites you are acknowledging and accepting the conditions of this Privacy Policy for all of the alastairjohnston website properties.These terms of use are subject to change at any time at the discretion of Alastair Johnston without notice. Your use of any of these websites after any changes are implemented constitutes your acceptance of the changes. As a result, I encourage you to consult the terms and conditions herein frequently.I have a few fundamental principles• I DO NOT actively collect sensitive information about you, including information about your health, racial or ethnic origin, political opinions, religious beliefs, sexual orientation or criminal history. I will take steps to appropriately protect any sensitive information I do receive.• I DO NOT share your personal information with anyone except to comply with the law, develop my products, or protect my rights.• I DO NOT store personal information on my servers unless required for the on-going operation and delivery of my services to you.• I store personal information only for as long as I have a reason to keep it.• On my Websites, I aim to make it as simple as possible for you to control what’s visible to the public, seen by search engines, kept private, and permanently deleted.• In my email communications I give you explicit options to not receive individual messages you’re not interested in. I also give you the option to unsubscribe from email communications with me at any time from the unsubscribe link at the bottom of my emails.Types Of Personally Identifying Information I CollectLike most website operators, I collect (via my Websites) non-personally-identifying information of the sort that web browsers and servers typically make available, such as the browser type, language preference, referring site, and the date and time of each visitor request.My purpose in collecting non-personally identifying information is to better understand how my website visitors use my Websites.I also collect potentially personally-identifying information like Internet Protocol (IP) addresses. I do not use such information to identify visitors, and do not disclose such information, other than under the same circumstances that I use and disclose personally-identifying information, as described above.Certain visitors to my Websites choose to interact with me in ways that require me to gather personally-identifying information like email address, name and surname (to name some). The amount and type of information that I gather depends on the nature of the interaction.I collect such information only insofar as is necessary or appropriate to fulfill the purpose of the visitor’s interaction with me. I do not disclose personally-identifying information other than as described below. And visitors can always refuse to supply personally-identifying information, with the caveat that it may prevent them from engaging in certain website-related activities.It is my policy to respect your privacy regarding any information I may collect while operating my Websites.Protection Of Certain Personally Identifying InformationI disclose potentially personally-identifying and personally-identifying information only to those of my employees, contractors and affiliated organizations that (i) need to know that information in order to process it on my behalf or to provide services available at my Websites, and (ii) that have agreed not to disclose it to others.Some of those employees, contractors and affiliated organizations may be located outside of your home country; by using my Websites, you consent to the transfer of such information to them.I will not rent or sell potentially personally-identifying and personally-identifying information to anyone. Other than to my employees, contractors and affiliated organizations, as described above, I disclose potentially personally-identifying and personally-identifying information, only when required to do so by law, or when I believe in good faith that disclosure is reasonably necessary to protect the property or rights of my Websites, third parties or the public at large.How I Use Your Personally Identifying Information If you are a registered user of any of my Websites and have supplied your email address, I may occasionally send you an email to tell you about new products/services you can access as well as my newsletter, solicit your feedback, or just keep you up to date with what I'm working on or thinking about.I am committed to delivering only information and products I deem will be relevant and of benefit to you. I expect to keep this type of email to a minimum.I take all measures reasonably necessary to protect against the unauthorized access, use, alteration or destruction of potentially personally-identifying and personally-identifying information.Aggregated StatisticsI may collect statistics about the behaviour of visitors to my Websites. I may display this information publicly but will not disclose personally-identifying information other than as described above.Cookies And Other Tracking TechnologiesCookies are small text files of information stored by your internet browser on your computer’s hard drive. I may use cookies to collect browsing data, for example, to keep track of your preferences and profile information and to collect general usage and volume statistical information. My website cookies do not collect personal, confidential information and are not spyware.You may set your internet web browser to refuse cookies or to remove cookies from your hard drive.A cookie is a string of information that a website stores on a visitor’s computer, and that the visitor’s browser provides to the website each time the visitor returns. My Websites use cookies to help the me identify and track visitors, their usage of my Websites, and their Website access preferences. Visitors who do not wish to have cookies placed on their computers should set their browsers to refuse cookies before using any of my Websites, with the drawback that certain features of my Websites may not function properly without the aid of cookies.AdsIf any ads appear on any of my Websites, they may be delivered to users by advertising partners, who may set cookies. These cookies allow the ad server to recognize your computer each time they send you an online advertisement to compile information about you or others who use your computer. This information allows ad networks to, among other things, deliver targeted advertisements that they believe will be of most interest to you. This Privacy Policy covers the use of cookies by my Websites and does not cover the use of cookies by any advertisers.Your ConsentBy using any of my Websites you consent to my collection and use of your personal information as described in this Privacy Policy.Choice/Opt-OutYou may choose to stop receiving my newsletter or marketing emails at any time, by following the unsubscribe instructions included in any of my emails, by updating your communications preferences via my email service provider, or you can contact me via my contact page.Testimonials/FeedbackIf you provide me with feedback, reviews or a testimonial, you give me your consent for the use of your name and the Service to be displayed on any of my Websites, or in my other marketing materials, together with the content of the testimonial that you provide.CommentsComments and other content submitted to my sites are not saved on my servers. You may remove a previous comment at any time, either through my comment system or by contacting me.TerminationI may cancel or terminate your right to use some or any of my Websites or any part of those sites at any time without notice, and at my discretion. In the event of cancellation or termination, you are no longer authorised to access the part or parts of the sites affected by such cancellation or termination. The restrictions imposed on you with respect to material downloaded from any of my sites, and the disclaimers and limitations of liabilities set forth in these Terms of Service, shall survive.Children’s PrivacyMy Websites are not intended for use by children under the age of 13. I will not knowingly collect personal information from them. If I discover that a child has provided me with personal information, I will use reasonable efforts to delete this information.If you have reason to believe I may have accidentally received personal information from a child under the age of 13, please immediately submit details through my Contact page.Access To InformationYou have the right under the Data Protection Act to access the information which I hold about you. If you wish to exercise this right, please send your request to me via my Contact page. In order to meet my costs in responding, I will charge you a fee of £10.Affiliate LinksI sometimes include affiliate links on this website. These earn me a small commission when you make a purchase.As an Amazon Associate I earn from qualifying purchases.About The Privacy PolicyThe entire contents of this Privacy Policy should be read in conjunction with any Terms of Services & Disclaimers on my Websites.If you do not understand any of the contents in this Privacy Policy, or if you have any questions or comments, I invite you to contact me via my Contact page.This Privacy Policy was last updated 19th May 2018.Updated: February 6, 2021Share this:"
