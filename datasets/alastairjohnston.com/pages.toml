["https://alastairjohnston.com/cracking-the-bullet-journal-forward-planning-problem"]
title = "Future Log: The Alastair Method - Alastair Johnston"
description = "I'm a recent convert to Ryder Carroll's Bullet Journal system for keeping on top of my tasks and projects while at the same time keeping a record of notes, thoughts, lists and observations. The system just seems to work for me. Low tech is good. But one of the problems…"
full_description = "Future Log: The Alastair MethodNovember 20, 2015I'm a recent convert to Ryder Carroll's Bullet Journal system for keeping on top of my tasks and projects while at the same time keeping a record of notes, thoughts, lists and observations. The system just seems to work for me. Low tech is good.But one of the problems with it is the difficulty in listing or planning future events. Without writing out a full year diary it's difficult to add events in a separate container, that is also easily updatable and quick to read.So I came up with my own solution.What I do is to write a series of columns for each month on the left. Here I chose the next 6 months.To the right I simply add in each future event with its exact date and then put a dot in the column that represents that month. It doesn't matter if the events are not added chronologically.When it's time to move these to your monthly planner page, all that's required is to quickly scan down the column of the month, locate the dots to signify entries for that month, then migrate the actual tasks to their dates in the monthly list.Simple and effective.A small request: A few years ago I designed and shared 'The Alastair Method' here. It became a huge hit and thousands of people have benefitted, many thanking me personally. I didn't mind sharing it freely. But since then my idea has been shared and shared, by other writers and bloggers, many of whom make some financial gain from my work. I don't mind this, but think maybe it would be nice to also benefit a little as the original creator? So I thought I'd ask, and see what happens via the kindness of (internet) strangers. So dear reader, if you've found my method useful, would you please consider buying me a coffee. Thank you.Updated: June 18, 2022Tags:bullet journalthe alastair methodtoolswritingShare this: Spined Calendar: The Alastair MethodHow can you fit a number of months into a two-page calendar spread whilst still keeping things legible? Although I use a variety of future...January 21, 2024"
