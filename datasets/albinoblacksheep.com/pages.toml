full_description = '''Promote Albino Blacksheep This site has been online since 2000 and spread by word-of-mouth only. ABS has never advertised to gain attention. The traffic was built by the visitors sharing the word in person and online. These days with a much bigger Internet full of mega-sites like Facebook and YouTube, Albino Blacksheep needs all the help it can get to spread the word. Add links to your site, and if you need graphics to do that, this page should have what you need. Logos Here's a PNG Albino Blacksheep logo that you can download and use anywhere you want to link to ABS. SVG Version logo.svg Pixelated version Made by Surn. Badges Mini-buttons Banners Made by atsakir. AOL Buddy Icons AOL Instant Messenger has been discontinued since December 15, 2017. These icons can be used for other purposes. Link Code <a href="https://www.albinoblacksheep.com/">Visit Albino Blacksheep</a>'''
