title = "Albino Blacksheep"
description = "Albino Blacksheep (ABS): Mostly Flash, Game and Video Media files for users and developers."
full_description = '''Fly Safe January 31 2025 Here are two projects I am working on. One is what I call an award badge generator. If you have a better term, let me know. The other is an interactive image stack requiring no JavaScript. I showed an early preview of both on X. Golden Era December 31 2024 Sonic Can't Spell The Shoebody Bop I've added code for a video backlight to all the playlists on the site. Enjoy the code for yourself. Black Goo October 31 2024 Opossum Scream (At Own Ass) Single Man Halloween Special One Halloween themed from Tom_FJM, and one brand new. Tom_FJM - Deal in Happiness Tom_FJM - Walk Again I would consider Kingdom to be a sequel. A Modern Odyssey Kingdom Head over to October 2023 for the typical Halloween animations. YouTube has a new social icon with a subtle change. I'm trying my best to keep track of all social icons. Sponsored: Discover the Secret to Unlimited Fun with Pokemon Go PokeCoins The new timeline July 19 2024 This is Weird Al music video is brand new. R. Wappin tells us, "we've come full circle". Weird Al - Polkamania! Totar Win Nuggets A new game by Surn, similar to Dungeon of Existential Surprise. Let's see how a non-Flash game compares. Space Treasure Albuquerque: THE MOVIE Everything You Know Is Wrong! After the Eclipse times June 12 2024 Yotam has been making these Yotam's Birthday animations since he was 15. Today he is 33. Yotam's 33rd Birthday i am zobny Looks like Tom_FJM may need his own page here if these videos become regular. Tom_FJM - Freud Method Music Unites All Still working on the Webmaster section. Before the Eclipse times March 29 2024 New from Yotam, ryoshenron and Tom_FJM. Domestic Biting I got SCAMMED again!! Billy Visit Him Granpappy Whilez He Gots a Big Ol' B*ner, Hoo-boy! Tom_FJM - I Wish You Knew St. Patty's March 17 2024 I remimnded myself to remind you to select the Minty Fresh theme for St. Patrick's Day. Select Theme I'll post some new files soon. Enjoy some St. Patrick's Day classics. Dwayne Gets Lucky Them Little Green People Feelin' Lucky Paddy and Murphy MicSploitation Pixelated Episode 2: The Irish, and Their Bad Reputation'''
