["https://albinoblacksheep.com/help/submit"]
title = "Submit Content | Help"
description = "Upload your original content to Albino Blacksheep."
full_description = '''Submit Content Submit original files to Albino Blacksheep that you created. You are submitting your content because you want your work published with Albino Blacksheep. How to Submit? Now you can send your content by E-mail. I will personally read your email message and then decide to screen your content, and assure that it follows the rules. <!-- Begin user = 'albinoblacksheep'; site = 'gmail.com'; site2 = 'gmail.com'; at = '&#64;'; document.write('<ul class="items"><li><a href=\"mailto:' + user + '@' + site2 + '\">'); document.write(user + at + site + '<\/a><\/li></ul>'); // End --> You need JavaScript enabled to see the email address correctly, but my username is albinoblacksheep and I use gmail if that helps. Rules and Guidelines It is now a requirement that you place "albinoblacksheep.com" somewhere in the animation to indicate that albinoblacksheep.com is granted permission to publish the file. Something along the lines of "permission to be hosted by albinoblacksheep.com" with a link in the corner of the play screen is fine. A link with the logo is the best. A link with a sheep logo that you draw yourself is the bestest. If you have a profile page on this site, the link should go to your page. Flash files should contain a preloader. You may use the ABS preloader or create your own. Use the correct tool for the job. Animations should be made in Flash and not in Windows Movie Maker or PowerPoint. Getting your content accepted ABS prefers to showcase content from its forum members and personal contacts. Send me a personal email to say hi when you submit your work. I get a lot of mass emails sent out to "undisclosed recipients". I delete those emails. ABS prefers smaller file sizes. You should be familiar with optimizing your file. Not everyone has super-fast high-speed fibre-optic directly-wired Internet, okay? ABS wants you to add something along the lines of "Presented by www.albinoblacksheep.com" in the your credits or optionally use the ABS Preloader. ABS prefers you bleep your swearing so your content can be shown to more age groups. You don't have to, though. Let me know if you are submitting the first episode of a series. Tell me how sure you are that it will be a series. I've been getting a lot of submissions with a small or unnoticeable play button to confuse or encourage the user into clicking something else. The play button is essential! I have rejected many submissions that try to obscure the play button. ABS highly suggests that you use original or royalty-free music to avoid any DMCA complaints that may arise in the future. You would not want the terms of your animation publication to be contolled by a record company, would you? I am assuming that when you send me a file, that it is new and has not been posted anywhere. If not, please tell me where and when it has been posted anywhere. Albino Blacksheep likes to keep things original and new, so consider posting here first, and then maybe other places. If there need to be any limitations on Albino Blacksheep's publishing rights for your submitted content, please let me know. If there is an audio streaming bit-rate limitation by a music artist in your work, or if the work cannot be authorized on mobile, YouTube, or Internet Explorer 6. If there is a fatwah against you, bans on all your work in certain countries, or any other limitation. Becoming a Featured author As a featured author you'll have your own profile page, and all the content you have worked on here, even as a small contributer, links back to your profile page. As well, your co-authors' profile pages link back to you. I also have to visit you if you are in my city or I am in yours. It's the rule. Featured authors have their work viewed more than regular authors, plus it's really nice to get a page with nice things said about you and your best work featured up front. I accept people to be featured authors who continuously submit their work to the site. You can become a featured author on your first submission if you send a collection of your past work.'''
year_published = 2025
