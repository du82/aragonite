title = "alec finlay | about"
full_description = "biographyAlec Finlay (Scotland, 1966) is an internationally-recognised artist and poet whose work crosses over a range of media and forms. Much of Finlay's work considers how we as a culture, or cultures, relate to landscape and ecology. Through permanent and temporary interventions, integrative web-based projects, and publications, Finlay weaves together generous experiential works, often collaborative, sometimes mapped directly onto the landscape, embedded socially or accessed online. Recently Finlay's work has focussed on place-awareness and ecopoetics.Selected Solo Exhibitions and Commissions 2018 Question & Answers (after Paul Celan), permanent public artwork, Southwark Park, commissioned by CGP Gallery ​ 2018 Retrospective, Arizona Poetry Centre 2017 - 2018 a far-off land, artwork, publication, for Macmillan Cancer Support 2017 th’ fleety wud, artwork, publication, comm by CABN, Scottish Borders Heritage Festival 2017 minnmouth, artwork, publication, funded by North Light Arts and FVU 2016 -2017 From Creag a’ Mhadaidh to Abhainn Choilltidh, public events, artworks, blog, publication, commissioned by Trees for Life and Common Ground 2016 A Variety of Cultures, permanent public artwork, publication, comm. by Jupiter Artland 2015 - 2018 Gathering, artworks and publication, commissioned by Hauser & Wirth for Fife Arms Hotel / Invercauld Estate, Braemar 2014 there were our own / there were the others, book and memorial walk, commissioned by National Trust ​ 2014 Taigh, National memorial for organ donors, Royal Botanic Gardens Edinburgh, commissioned by Scottish Government 2014 a-ga: on mountains, exhibition, sleeper gallery, Edinburgh 2014 100 flowers, permanent artwork, commissioned by New South Glasgow Hospitals 2014 wallflowers, permanent artwork and publication, Callendar House, Falkirk, commissioned by the Falkirk Community Trust 2014 Some Colour Trends, walks and publication, commissioned by Deveron Arts 2014 Global Oracle, permanent artwork, publication, audio, in collaboration with Chris Watson, commissioned by The University of Warwick 2013 Sweeney’s Bothy, permanent dwelling, in collaboration with The Bothy Project, funded by Creative Scotland 2013 The Bee Bole, multi-venue sculptural installations, artist blog, funded by ACE 2013 comhlan bheanntan | a company of mountains, artist blog & publication, commissioned by ATLAS Arts, Skye 2013 Vocable Orchard, animation, print & exhibition, comm. by Film & Video Umbrella 2013 today today today, animation, artist blog, booklet, embroidery, commissioned by Animate Projects 2013 Out of Books, walk, sculpture, artist blog, with Ken Cockburn, funded by NALD 2013 Duke’s Wood (bower construction, embroidery, blog), commissioned by Ordinary Culture 2013 I Hear Her Cry, sculpture & publication, private commission, Boston, NY 2012 Swarm (ASX), sculpture & artist blog, commissioned by 18th Biennale of Sydney 2012 The Bee Library, public artwork, Yorkshire Sculpture Park 2011 birdsong & the city’s a stonebook & SING/WILD/KIND/WOOD (permanent public artworks, web-audio work, print edition), Victoria Gardens, Leeds 2010 The Road North (public artwork, website, print, audio & exhibition) with Ken Cockburn 2010 Walking Within Langais Wood (permanent public artwork & word-map print), Langass, North Uist 2010 sky-wheels & Sky Colour Wheel, exhibition, commissioned by AV Festival 10, Hatton Gallery, Newcastle 2010 white peak / dark peak, walk, artist blog and publication, Derbyshire Arts Development Group, Peak District National Park ​ 2010 Rosary (poem garden), Castle Park Arts Centre, Frodsham 2009 Home to a king (3) (public artwork & field-guide), Yorkshire Sculpture Park; Durham University Botanic Garden; Springburn Park (Glasgow); St Andrews Botanic Garden (St Andrews); George Square Gardens (Edinburgh); Montgomery Street Gardens (Edinburgh); Castle Park Arts Centre (Frodsham); Cove Park (Kilcreggan). ​ 2009 Mesostic Interleaved (public artwork & publication), Edinb