full_description = "Some “real” cables on KM 2/8 wool slippery rayon: fabric flattens with pressing and remains that way a couple of twist samples: wool/rayon blend Fair Isle, any punchcard locked on a single row of every other stitch selection: there were whole books of HK patterns based on this idea, sequence of moving stitches can create a variety of secondary patterns. On the KM fair isle is essentially a slip stitch, short and skinny, tension needs to be loosened considerably to try this, stitches in cables cannot be brought out to “hold” position to ease knitting off on the next row, as this will affect the color pattern. Larger crossings are possible, but more difficult another FI and cable variant: mistakes are probably from needles that were out just a bit too far and knit in the alternate color a blast from the past: knit on my metal no punchcard bulky (first KM) and ribber more than 2 decades ago. Ribs at waist and armholes are hand knit twisted rib Posted on January 18, 2012August 9, 2013Author AlessandrinaCategories Cables and Twists, Hand Techniques, Machine knitting (MK), Swatches and Experiments"
