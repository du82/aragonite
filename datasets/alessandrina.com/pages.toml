["https://alessandrina.com/2023/05/30/a-return-to-plaiting-and-double-bed-hand-transfers"]
title = "A return to plaiting and double bed hand transfers – alessandrina.com"
description = "machine knitting and more"
full_description = "A return to plaiting and double bed hand transfers These two sweaters, by Denimist on the left, and Chloé on the right, led me to reconsider plaiting, and as usual, whether any repeat may be programmed to make tracking of any hand techniques easier. A review of plaiting on Brother machines. The black cells represent needles in work and knitting on the top bed. Cast on for every needle rib, change the configuration so that stitches on needles represented by white cells are transferred down to the ribber. Needles left empty after transfers are pushed back to position A, out of work/ OOW. The first repeat was planned for 30 stitches, but some of my tests were knit on slightly different stitch counts. The main bed is set to KCII. Any time empty needles are part of the design repeat, the end needle selection is canceled. The stitch count remains constant throughout. The main bed does not need to be set to slip stitch, it can be left set for plain knitting. The needle selection is used only as a guide to the transfers, which are made using a 2-prong tool in the direction of the arrows on the knit bed every 8 rows. The swatch on the left was knit using 2/8 wool and no-stretch serger thread for the plaiting yarn, on the right the thicker yarn is 2/15, with fiber content for the thin yarn no longer readable. An equal-thickness dark is added on the left, with visible color distribution issues. On the right, the light is a 2/28 Italian import, the red a 20/2 rayon, and I began to test the introduction of possible cable crossings along with considering the width of all knit vertical side borders. Varying the overall spacing and the number of rows knit before cable crossings, 4 on the left, 6 on the right. The yarn in the latter swatch is a thin, coarse, inexpensive wool. The cabled stitches were hard to knit on the next pass, the low color contrast in the finished surface makes the texture effect subtle. The instructions here in principle are as given above. The single stitch in the 1X2 cable crossings is always brought forward on the purl side prior to any transfers of the corresponding stitch pair. A single repeat segment imagining actions to be taken, and a full chart for the proof of concept, 34 stitches in width Stitches are moved after every 8 rows knit in the direction of the arrows using a 2-prong transfer tool, filling in a single empty needle to the right or left as indicated by arrows. The empty needles are pushed back to the out-of-work position after the transfers. The initial needle selection may be used for more than 8 rows at the bottom of the piece and the top if preferred. A 36-stitch programmable repeat shifts the 8-row repeats shown in the colored chart The blank cells on row 13 will serve as the area on which the 2X2 cable crossings are made. The initial setup after the first set of transfers groups of needles with no needle preselection serve as markers for the 2X2 cable crossings Bring needles with crossed stitches forward for easier knitting on the next carriage pass and continue knitting until needle preselection changes once more. A: fixed needle selection B: stitches moved with 2X2 cable crossings C: fixed needle selection once more. Switch yarn feeder to plaiting accessory, add plaiting yarn, with 2 yarns of equal thickness in use tension is adjusted D: stitches moved with 1X2 cable crossings E: stitches moved with 2X2 cable crossings Return to A selection. End the swatch matching the number of rows on the fixed needle selection at its start. Posted on May 30, 2023May 30, 2023Author AlessandrinaCategories Cables and Twists, Hand Techniques, Machine knitting (MK), Mixed stitch types"
