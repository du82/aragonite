full_description = "New swatches based on random sources of inspiration WORK IN PROGRESS I have had requests for detailed tutorials or videos on specific older samples. The most recent posts on any stitch type do not offer detailed instructions; blog searches lead to the historical development of the designs and present additional information. The blog index is an added source for browsing by topic and offers direct links. That said, it is due for an update with the addition of the blog topics added in the past several months. Proof of concept swatches usually follow the associated repeats. A reminder, most are knit on Brother km models and rely on its preselection feature, absent in other models, ie. Studio. Using the provided punchcard repeats to automate needle selections may require more than just shifting the starting row number to match the results. I endlessly encounter new sources of inspiration, adding them to the stack of saved stitches to explore, and reviewing old posts can spark new ideas as well. This post will not be restricted to any stitch type but will include knit structures that currently attract my attention. Tuck lace: all white columns correspond to needles out of work. Sometimes, subtle is enough; here, EON is taken out of work. The punchcard repeat is 24X36. The swatch was knit on 63 stitches that included 3 knit stitch borders on either side. The setup on the needle bed. The yarn used in the bottom was a 2/13 wool, the top a 2/8This chart illustrates a 24X40 repeat suitable for punchcard models. Although the minimum repeat segment suitable for electronic models is far smaller, I prefer to program based on the full number of stitches in use on the knitting machine and add row height to reduce the number of beeping reminders. My 29X50 swatch repeat, including added side border knit stitches repeated twice in height, knit in 2/18 wool. In the design, the yarn tucks for 4 rows, generally the limit for loop tolerance on 4.5 mm machines. The number of tuck loops can be reduced if planning to test thicker yarns, such as in this 3-row version. Using 4-row tuck designs and adding wider NOOW/needle out of workspaces: the 3 stitch NOOW columns are represented in this punchcard 24X40 repeat chart by the pale green vertical columns. The placement of the needles required to be in work may depend on which model knitting machine is used. The swatch was knit on 51 stitches, with added all-knit 2-stitch borders on each side. Returning to an EON setup: also suitable for punchcard machines, the 24X40 chart shows NOOW placements and locations for potential color changes The PNG for the test single color swatch, including 2 stitch knit columns on both sides, 63X24the test adding the second color; gentle blocking helps retain the 3D quality of the surface on the knit side The last swatch in the post on Building more textures in needles out of work spaces was executed with hand manipulation using short rows, following this charted concept. Frequently, more rows may be tucked with manipulating needles than with automatic pattern selection. The design was automated, reducing the tuck loops on any needles to no more than four. The proper needles must be pushed back out of work to produce a successful automated tuck lace knit. Depending on the machine models, the proper needles must be pushed back out of work, ie, 930 vs punchcard, the design may be automatically mirrored horizontally. The working chart was developed in a spreadsheet.The 24-stitch repeat may be used in a punchcard machine a 24X16 PNGmy programmed 51X16 repeat ensuring an all-knit vertical border on either side, the working needle arrangement the proof of concept using only one color and changing colors every 4 rows Slip stitch textures There are many ways to automate folds, including selecting the same needles for skipped stitches. The rule of having limitations on the height of the vertical white bars does not apply. The yarn creating the elongated slipped stitches must be strong enough not to break. Single bed tuck/ mostly slip stitch fabrics 3 included this chart and sample for deep folds interrupted by plain knit horizontal bands its 30X84 repeat Applying the concept to a more overall design the 47X72 PNG the swatch knit on 71 stitches, using a 2/8 wool and a lone variegated sock yarn ball from my ancient stash…. Posted on February 21, 2025March 1, 2025Author AlessandrinaCategories Uncategorized"
