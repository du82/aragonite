["https://alessandrina.com/2023/08/06/tuck-stitch-meets-knit-weaving"]
title = "Tuck stitch meets knit-weaving – alessandrina.com"
description = "machine knitting and more"
full_description = "Tuck stitch meets knit-weaving This video was recently shared on Facebook. The sample in the video was knit on a Studio/Silver Reed brand knitting machine and prompted the question about the possibility of knitting the same pattern on a Brother machine. Some techniques require infinite patience. A summary of observations made looking at the video: 1: the machine tucks for two rows 2: the card is set to elongation for weaving rows, where the pattern selection continues, but the carriage is set to knit the background for woven rows 3: the carriage is set to tuck once more to complete what are 8 or more rows of pattern 4: start the process again by knitting four rows of tuck followed by 2 rows of knit weaving until the top of the piece is reached, ending with two rows of tuck before binding off. Studio machines select as they knit each row, while Brother machines preselect each row as knitting continues after the initial preselection row. There cam buttons switch from tuck to knit, and the card rotation settings are changed frequently from single to double length on the repeat segment as given. To mimic the video, this is a chart for the adjusted repeat planning to knit a swatch on an electronic model using 2 knit carriages selecting needles with the pattern advancing one design row for each pass of the carriage. The cam button variations: the yellow cells mark tuck stitch rows. The red cells mark the knit-woven rows, where the carriage is set to knit with continued pattern selection, and a weaving yarn is brought into play for 2 rows. The knit carriage is then set to tuck once more, and the process repeats. Punchcard users working with a single knit carriage can punch all black cells in the width given in the chart, and twice its height for 48 rows, eliminating the need for elongation shown in the video. Using 2 knit carriages can eliminate cam button changes from tuck to knit and back. When using any pair of carriages to select needles, each carriage must be disengaged from the belt while the other carriage is being used to avoid breaking it, so extension rails are required. I began with the sample knit on 30 stitches on my 930. The carriage set to tuck operates from the left, the knit-weaving one from the right, with the first preselection row made from right to left. The 30-stitch test includes a one-stitch knit border vertically on either side. The main background yarn used for tuck rows color is a 3/9 wool, and the knit weaving carriage is threaded with a slightly thinner, darker yarn of unknown thickness. The weaving yarn is a worsted-weight wool. Changing the ground yarn to the same yellow 2/20 in both carriages, the pattern was first knit in tuck stitch alone, possible for 6 rows because of the yarn thickness, and then using the 2 carriages knit weaving at the same intervals resumed. A pair of some of the previous posts on using 2 knit carriages to select needles on Brother machines Knitting in pattern with 2 carriages vs color changer, Brother punchcard KMs 2 Knitting in pattern with 2 carriages, Brother punchcard KMs 1 The Punchcard used in the video Brother punchcard machines repeat the preselection of needles on the first pass with the carriage from the opposite side to advantage in reproducing the swatch. The two 892E carriages If a second punchcard carriage is not available but an electronic one is, the model year may affect the fit, but an electronic carriage can be used on a punchcard machine to advance the card and select needles. The first row on the Studio card is locked on row 3 to preselect the first tuck row on the Brother from right to left Rows 1-2: COL, set the carriage to tuck in both directions, make 2 carriage passes, ending COL with the carriage positioned on the extension rail, clearing the belt Rows 3-4: COR, begin with the second carriage set to KC and outside the set line, and do not push in any cam buttons. Prepare your weaving yarn. Knit to the left, the card does not advance. COL: weave the second row, move the carriage back ending COR on the extension rail, clearing the belt Rows 5-8: COL, the card does not advance on the first pass to the right, knit 4 rows of tuck stitches, ending COL on the extension rail, clearing the belt Rows 9-10: COR, repeat 2 rows of knit weaving reminder: any hesitation with movement back and forth of either carriage once it is on the knit bed and selecting, will advance the card one design row Repeat Rows # 5-10 twice to complete each full repeat segment Choose an ending pattern segment and bind-off. The proof of concept uses two slightly different yarn background shades again Other tuck-stitch combination fabrics Tuck stitch combination fabrics Combining tuck stitches with lace 2 (automating them) Combining tuck stitches with lace 1 Tuck and garter stitch: from hand knit to machine knit “Crochet” meets machine knitting techniques: working with short rows More on using multiple carriages Revisiting knitting with 2 carriages single bed, 910 vs Ayab so far Geometric shapes on ribber fabrics with tuck stitches 2; knitting with 4 carriages Ribber fabrics produced with 2 knit carriages selecting needles Posted on August 6, 2023July 22, 2024Author AlessandrinaCategories Hand Techniques, Knit-weaving, Machine knitting (MK), Mixed stitch types, Patterning with 2 knit carriages, Tuck Stitches"
