full_description = "Holding and “cables” Susan Guagliumi has written 3 books on hand techniques on the knitting machine her first classic her previously most recent published November 2014 On her website, some of her articles and Studio KM publications are available for free download. Included are ones discussing a horizontal cable, two-color electronic cable. 11/12/15 Please note: the site now requires subscription and login, links, as posted here as they are, will fail to connect. In creating large-scale cables in the past tension changes, supplemental threads, and other ways to compensate for moving a larger number of stitches on a metal bed (things start to get hairy when crosses become larger than 4X4) have been discussed. An interesting, clear, possible solution to produce textures or macro cables such as in this piece may be found in her books and may be viewed in her youtube video. Handknit interpretations that also add lace to the mix may be found in Shirley Paden‘s portfolio photos of garments, she is the author of Posted on December 21, 2011November 2, 2020Author AlessandrinaCategories Cables and Twists, Hand Techniques, Lace, Machine knitting (MK), Online Resources, Short Rows, Holding, Sites to See"
