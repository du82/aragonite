["https://alessandrina.com/2022/10/25/working-with-diagonal-patterning-in-machine-knitting"]
title = "Working with diagonal patterning in machine knitting – alessandrina.com"
description = "machine knitting and more"
full_description = "Working with diagonal patterning in machine knitting After a slow down in my blog posts for a variety of reasons I find myself playing catch up with the eternal list of knit fabrics that I wish to explore out of my own curiosity and the attempt to answer questions from knitters who contacted me directly via the blog or have asked them in the online forums in which I am a member. Stephen West is a prolific designer of colorful hand knits in a variety of techniques and complexity. This honey-striped scarf is an example. Slip-stitch patterning is a likely way of knitting a similar effect combined with the use of the concept familiar to many when making bias cast-on rags. A fixed number of stitches is cast on and positioned as far to one side of the machine as possible. They are then decreased on a fixed side and increased on the opposite one. The strip moves across the needle bed, when far enough on the side opposite to the starting one, it is returned to the original needle bed position and the process is repeated until the desired length is reached. If the moves to and from are performed on solid color rows matching needle selections may not be an issue. If the repeats in other cam settings are to match, then proper needle placement can be assisted by marking the metal bed, the factory-supplied needle tape, or a custom-printed one, and hand-selection for the first design row may be required and planned. This chart attempts to visualize the proposed movement using colored stripes. Stitches are bound off on one side and cast-on on the other to maintain a fixed width with shaped edges. If the goal is to maintain straight bias edges, the design repeat would need to be rendered wider in order to compensate for the shifts on the needle bed in turn modifying increases and decreases at a different rate The black cells represent the adjusted stitch counts needed for each pattern band. When an item such as a scarf is worn, both options will appear as diagonals. If any picture knitting is included and the direction of it matters when the piece is worn, appreciated particularly in representational fair isle, such accessories are best knit as 2 pieces knit from the bottom up, and grafted together at their center after the fact. Increases and decreases are calculated carefully based on the knit gauge for garments. The approach to accessories may be more casual. Stripe heights are varied to accommodate specific design motifs or cam settings, and they are, in turn, added to the base visualization charts. Here an attempt at 45-degree striping is made by beginning on a 3-stitch tab. Increasing on the carriage side creates loops, while those opposite the carriage form knots. Increases and decreases are indicated by arrows. Increases are made on alternating sides, opposite the carriage, to produce matching edges. The red cells in the chart represent the carriage side before each pass. Table cells have been rendered rectangular in a 4 to 3 ratio, estimating the difference in gauge between stitches and rows. Striping for an even number of rows matters if color changes are made on a fixed side ie if a color changer is in use. Yarn ends at color changes may be cut or the yarn can be carried up the side depending on preference and the number of rows involved. If carried up for long stretches, the alternate color yarn not in use may be secured by e wrapping it on the end needle periodically. Care needs to be taken that the float up the side is not so short as to have an effect on the swatch length and having an effort to remedy that will leave yarn ends too short to be secured. The result will not produce a proper square, garter stitch is the only knit stitch that results in approximately true square shapes. If the center of the needle bed is used for swatches while keeping an eye on the stitch formation. If loops are formed repeatedly on specific needles akin to tuck stitches or problem areas such as those in the center of this swatch are encountered, they can be caused by damaged needles or sticky latches that may result from frequent use. Diagonal lines in knits that maintain straight sides are also achieved using short row/holding intarsia techniques. Segments are planned in specific orders which can be varied to form added shapes. Chevrons would be more easily created by knitting separate strips and seaming as you knit or after the fact. The addition of small-repeat fair isle patterns is also possible. Keep in mind when bringing needles back into work to reverse shaping, needle preselection for accurate patterning in Brother machines needs to be maintained by hand selection. Some of the published punchcard patterns can serve as a source for diagonal lines that may be tiled and programmed for the full design in addition to being used for their original intent. Numbers 52, 384, and 328 (published with error), are suitable for tuck, slip, and FI with moderately wide floats, while 335 would fail as a tuck stitch. For added ways to develop diagonal patterns using brush fill see post on developing designs using pattern fill for use on a range of machine models Tiling as in any patterning will reveal errors, such as here for 328. The latter was edited to a 22-stitch wide repeat, becoming suitable for only electronic machine models. The charts with the red grid on the top row were rendered as tables in Numbers. Since their end use is different, they are the color-reversed version of the cards, whose screengrabs were in turn processed in Gimp to create knittable pngs. The smallest repeats suitable for electronics are given in the center row of images, the amended 328 cannot be reduced in size. The last row illustrates tiling for all files as BW images that may be opened and amended to suit the size of the pieces planned. Files in png formats for the group: if pngs generated by me in BW indexed mode are downloaded and opened in editors such as Gimp, they will open in RGB mode. To make them suitable for download programs, convert them to indexed BW mode again and save the result. There should be no loss of data. 384, 12X2412X48 144X144328, 22X44 176X176 335, 12X24 24X48 144X144 52, 8X16 24X48 192X192 The black lines formed by units 2 rows in height can be followed or erased to establish short rows shaping a stitch at a time every two rows, given at least 2X2 full repeats to check color placement. The method was used to isolate the previous ungridded color illustrations. Another instance of a published Toyota 901#11diagonal tuck card, in this case, incorporates a combination of 2 and 4-row tuck patterning. The repeat is 24X48 The previews may be used to replace color selections with those matching yarn colors used in the project to develop some idea as to how color shifts might affect the final piece. EON diagonal patterning surrounding blocks containing other shapes may be maintained with slight variations in the size of the shapes used to fill those blocks References published for weaving can be a source of charts usable for this type of design. The repeats are provided regarding width (shafts) and height (picks). For proper alignments, the provided charts must be reproduced in full, or in DIY adaptations careful editing with erasures or additions can still maintain the proper tiling. A page from an 1898 pub Playing with using #20 and #16 mirrored, isolating, erasing, or combining elements of each while keeping fixed some of the details that move diagonally to touch sides of the repeats, with the process illustrated in color. Consider the width of the floats if planning for fair isle patterning. Check the original for any errors, marked in the color chart in black. They are often not noticeable until the design is drawn in repeat. The editable PNG for the center 24X24 design is tiled on the far right above. It is also suitable for punchcards A 16X16 electronic repeat tiled to 128X128 Handweaving drafts such as those found at handweaving. net provides endless inspiration for designs, including diagonals. 8X812X12 drawn in repeat X712X12drawn in repeat X715X15 color reversed using color invert and quarter rotations to 30X30 16X16 16X16 16X24 drawn in repeat to 160X168 18X18 in repeat to 126X126 20X20 32X32 with rotated segments playing with rectangles, squares, and fill-ins24X24 30X30 A 32X32 diagonal DBJ design built with small color-reversed blocks 16X16 color-reversed A seasonal sample, 40X4148X48 The movement is not as evident until the tiled repeat becomes quite large, the start, 168X150 Chevrons can be developed from partial repeats. This is from Toyota 950#12, 24X20 drawn in repeat to 144X140 Combined with added shapes 28X32 56X32 rotated 180 degrees combined and trimmed to 56X62 tiled and with an added frame, 124X134 for a blanket-sized project Cropping the frameless large design in different places vertically could provide a collection of accessories ie scarves, ie in this start, 86X132 png with 2 stitch vertical borders on both sides Whether in use for a punchcard model or an electronic one, the convention if the end goal is a tuck stitch fabric, is to color reverse the design It is possible to generate DIY designs easily using ArahPaint. Taking diagonal patterning to the double bed for creating pintuck effects using the slip-stitch setting, this 24X48 repeat explores some of the potential spacings and the resulting ridges. The next 2 repeats tested, both 24 stitches X 48 rows: The red line is a reminder that the slipped stitches are being held for as many as 8 rows. It is best to use thin yarn that does not break easily and to watch for the knit stitches riding up. Slipping in one direction produces a very subtle texture, while the color-reversed design produces even-sized identifiable folds Adding lettering or small shapes and maintaining the diagonal can result in distortion of the motifs. One option to add such motifs is to form the knit by beginning on 3 stitches as in this shared swatch and planning the stripes to heights and widths that accommodate adding designs or fonts. Short-row intarsia will also produce diagonal striping, from simple to complex as seen in this chart, with knitting sequence numbered for each segment. A limited number of rows may be knit in stocking stitch in areas following shapes not simply to travel to the opposite side and reverse shaping, but also to add small rolls or hems. Another use might be to add small vertical motif details or patterning in their usual orientation. The limit appears to be a maximum of 8 rows of alternative patterns, in order to keep the short-rowed areas from developing into distorted edges, which may be variable depending on the yarn and pattern used. This first swatch was knit using progressively thinner yarns, wool, wool rayon, and a 2/24 acrylic in the FI segment. FI is a slip stitch that narrows the knit. The dark acrylic color stitch definition here gets lost. The band is seen pulling in the short-row segments on both sides. The shaping in both the top and bottom segments is by 2 stitches at a time. The result in different yarns of equal thickness, with the FI band knit at a tension one full number looser than the stocking stitch areas, with the top and bottom solid color segments now shaped 3 stitches at a time. There is a trick when making A-line skirts to change the triangles that would poke out normally at the bottom if shaping were to begin immediately used as a design feature in many runway knits recently. If between an inch or 2 are actually knit up straight before shaping starts, the problem is eliminated. Depending on the design this may be a solution or it may read as a patterning error. There are some conventions and “rules” for short-row techniques, but they do not always apply. Keeping good notes helps to make successful experiments reproducible. Two more tries began to experiment with working on the first and last groups in the holding techniques on a different number of stitches than the remaining shapes, noting differences. In the first an all-knit row is made across the short-row eyelets, reducing the planned FI band from 6 rows to 5. A rough spot in maintaining even stitches on one side is noticeable. Progress: holding happened at the start of the bottom wedge, the FI was knit at 2 tension numbers looser than the stocking stitch, for 6 rows. The goal in the short row shaping for the triangles is to maintain vertical edges that appear as straight as possible to the eye. One need not work on large swatches, small ones can provide clues as to differences resulting from variations in the starting side of the short-row shapings. Studying the results can lead to many variations. There are student theses and careers based on exploring limited techniques to the max. Building a theoretical true square or other predictable shapes is subject to the yarn and tension used. Beginning with a small sample, this shows the order of knitting 2 triangular shapes with the carriage beginning to knit each shape from alternate sides. In this case, 2 stitches are to be brought in and out of holding at a time. Because each color knits for 2 rows, small slits happen in the fabric resulting in eyelets. They may be used as design features, or attempts can be made to reduce their size. One way to do so is to have plain knit rows between holding selections to keep the small slits from intersecting and becoming double height. On the left swatch, one yellow row was knit to the left before reverse shaping in the same color. In the swatch on the right, in addition, 2 rows were knit in the blue prior to reverse shaping. Reviewing the concept and developing a chart for larger swatches: the cyan color cells represent stitches in the hold position and the white cells stitches that will be knit. At the top of the first wedge, most needles will be in the hold position, return them all to the B position manually before knitting the next row. With the carriage on either side, set it for KCI with the cam buttons to slip for a free pass to the opposite side, the first FI pattern row will pre-select. Holding need not be canceled, since no needles are brought far enough out for the technique. Cancel the slip setting, change the cam setting for FI knitting, place the pairs of colors in their corresponding feeders, and knit 6-8 rows of pattern. Bring all needles out to hold except for the first desired group, if the holding lever has been canceled, reset it and commence reverse shaping. Merrily knitting along and you forget to loosen the tension for the fair isle stripe: And what if the FI were to actually follow diagonal colored stripes? The approach is the same. I am right-handed, my default is often to begin on the right. Left-handed knitters can mirror charts as needed to make them easier to follow. The first triangle is shaped from the right toward the left, subsequent ones begin on the left, then to wrap or not wrap becomes the question. Review of wrapping, which does not disturb the stitch on or "
