["https://alessandrina.com/2021/09/17/arahpaint-meets-gimp-in-knit-design-1"]
title = "ArahPaint meets Gimp in knit design 1 – alessandrina.com"
description = "machine knitting and more"
full_description = "ArahPaint meets Gimp in knit design 1 Questions regularly turn up asking what software we use as individuals to design repeats for our knitting. Up to this point, I have worked exclusively on a Mac unless downloading to my Passap with Wincrea, an ancient laptop, and as old a version of Windows. I have been a Gimp user for eons, it is my go-to along with Numbers to create the charts in my blog and to graph my designs and ready them for download. ArahPaint is a free paint program, part of a far larger weaving one. I have used it intermittently for features not achievable in Gimp at all, especially prior to its latest Mac updates. My Gimp working notes may be found in blog posts including the latest 2021/07/18/gimp-update-for-mac-2/. The scope of AhrahPaint is smaller than that of a full photo editor, but its functions are well worth exploring from simple designs for use in any craft including hand knitting, cross-stitch, etc for scaling images to size, drawing in repeat, configuring those repeats in many arrangements easily, for color reductions, and much more for end-use in machine knitting. There is a very good downloadable manual, but not generous in providing small details applicable when working in a low-res bitmap such as that found in knit design. My goal here is to provide some starting ideas on using the program for new users and a few comparisons to Gimp features for those who have worked with that program in the past. Links for anyone wishing to try Arahpaint on a Mac (or Windows), including video tutorials Sept 20, 2021: a new version of the software is now available for download, it is larger in file size https://www.arahne.si/learn-support/software-demo/ A “fast pattern” supplement http://www.arahne.eu/pdf/fastpattern-EN.pdf, black and white images are used on pages 20-24, The user manual appears unchanged The drawing in the repeat window now offers new Preview, and Browse options. If Paint is part of the complete weaving program, there is a library of patterns for the user to browse through. If it is used as a stand-alone, the choice provides the opportunity for the user to browse through their library of images before continuing. The information available to me as I began this post: the download button is at the top left of the webpage https://www.arahne.si/…/softwar…/arahpaint-for-mac-os-x/ https://www.arahne.si/learn-support/ https://www.arahne.si/…/user…/detailed-users-manuals/ http://www.arahne.eu/pdf/apaint4-shortcuts-EN.pdf https://www.youtube.com/c/arahpaint4/search?query=arahpaint https://www.arahne.si/public/news/ with more info and videos on version 6 https://www.youtube.com/watch?v=daOsTulCKbk for anyone inspired by weaving drafts as a source of knitting pattern repeat Arah menu options provide a quick view of menu differences between it and Gimp Tools as listed in the shortcuts pdf, the order is slightly different than in the program view When exploring design potential in any paint program, it is best, to begin with, to use a small repeat that can be clearly identified when tiled in various configurations, resized, and pixel edited. If drawing is with the goal to produce a BW bitmapped image for download of 2-color patterns, drawings can happen in those colors to start with. If color separations are planned in the development of the design, then 2 color images including black may be preferable. The Arah default dot size for pixel drawing is 1X1. The 8-bit palette mode both for colors and greyscale uses up to 256 shades, greyscale values may also be measured in percentages of black ink coverage. Images may be converted from one color mode to another as in Gimp. Begin with a small image size To work on the image, magnification will be required. This may be achieved several on the Mac, one is to click repeatedly on the magnifying lens icon in the toolbox, and the other is to press any number from 0 to 9 on the keyboard, and the zoom will instantly change for 1 at 100%, to 6 for 600%, to 0 for 1000. The latter is minimal for building repeats on a viewable grid, the magnifying lens may be used to reach a comfortable starting view. The zoom level for both increases and decreases may be changed during drawing operations as well. In addition, the image may also be magnified to fill the window or by entering the full-screen selection on your monitor and the program may be used in full-screen mode on your device by making the very last selection in the View menu. At zoom levels higher than 300%, the program shows a grid between pixels, if the grid view is enabled. To show or hide the grid, choose View, Show Grid To change the grid properties, choose View, Grid Properties The grid color can be black, gray, or white. The second level grid determines how many thin lines a thicker one will be drawn Setting the grid: the default grid is subdivided, and grid color and spacing may be custom set through selections in the View menu Altering the thicker line placement to suit personal preferences or to match electronic or punchcard published repeats more easily, simply type in new values and close Punchcard knitters may use this feature to create a template on which draw. Factory-supplied Brother punchcards are by default 24 stitches wide, the maximum repeat width, and 60 rows high with the minimum design height of 36 rows for the card to advance continuously in the card reader. The grid spacing is 6X6. With values changed to 6, the template is created The default cell shape appears to be square, without the option to create rectangular cells. Changing the grid option to lose subdivisions: deselect show grid 2. In addition to the image grid, like Gimp, ArahPaint 6 also allows for positioning aids: guides. They are horizontal or vertical lines that are temporarily displayed on an image. To create a guide, double-click on the dark blue arrow displayed on one of the rulers in the main window. The guide is then displayed as a dashed line following the pointer. To move a guide after it has been created, hover a mouse pointer over the blue arrow and click and drag it to remove the guide to a new location. To delete a guide, double-click on the arrow. After a guide is created, another triangle in a different shade of blue appears below it. Use that to create the next guide, repeat as often as wanted both horizontally and vertically. To remove all guides choose View, Remove Guides. One use for the lines can be to mark plain knit rows between transfer markings in lace punchcards as illustrated in this Gimp image To test the program, draw a basic shape whose changes may be easily recognized. Color palette tools are in the palette areas. The foreground (upper square) and background color (lower square) are used in drawing operations. They are numbered 1 and 0, not to be confused with the same numbers assigned to colors in the working palette. The starting palette may be altered to include black. Double-click on the foreground color at the top, the #1, not in the space below the palette icon. A color selection window will appear, choose, and click OK. This change is lost if one quits the program. If satisfied with the drawn repeat, use the selection tool to isolate the final motif. The new working image after cropping to selection: Drawing in repeat instructions reproduced from the manual Starting with the single triangle: block alignment Standard brick alignment using offset in pixelsPillar repeat also using offset in pixels Other offset options through the use of fractionsPlaying with mirroring positions, producing a minimum 2 by 2 repeat, the result looks akin to the pillar repeat drawing above, but tiling again to check for alignment may yield surprises that can be viewed as design features or errors, Changes to mirroring arrows may be made when drawing in repeat on the top left of the window as well Once an image is drawn in the repeat of your choice, if only the Random option is used, with new picture left unchecked, the pencil may be used to draw on pixel cells, and changes will be made across all repeat segments. Each step may be undone individually. Many of these functions are paralleled in Gimp symmetry drawing. The possibilities are endless. As always, good note-taking helps in being able to reproduce your chosen process with new images. If you begin drawing a repeat using a single color on a white ground, then decide you would rather work in only black and white, simply double click on the foreground color, the palette window will appear, choose the new color, and all pixels in your repeat will then change to the selected one Repeats may be built in a more controlled manner using the image/duplicate X menu, its symbols immediately reminded me of the Passap Alter Direction options: Choose a simple repeat to start with. Here a diagonal line was drawn along the center of a square, the bottom half bucket filled a half drop was added and the repeat was tiled to test alignment The duplicate tool enables the repeat of an image or part of an image in a fast way. All duplicate tools with the exception of Mirror X-1 and Diamond work similarly to the drawing in repeat tool if the new picture option is enabled. The mirror X-1 works the same as the normal mirror, except the last pixel of the image is omitted from the image there is also the option for Y-1, here both mirroring options are in use, note the areas in both that retain double pixels, Eliminating those double pixels can be achieved by cropping. The first mirror is for Y-1, the cropped image is tested for tiling by drawing in repeat Drawing lines: use the straight-line icon button to activate the tool, select the line thickness by selecting a number of pixels to be used then move the mouse pointer to a line starting point on the canvas and press the left side of the mouse, dragging it until the line is of the desired length and angle. When the line is at that desired length release the mouse. A=1 pixel, B=2, C=4 with line dragged and released randomly, D= the line was moved and the mouse was not released until the steps were all the same size. The thick lines option works only at line width 1, which will keep the single pixels connected If you double-click on the line icon, the Straight-line icon is activated. Now you can draw horizontal, vertical, or diagonal lines. If you move a mouse horizontally—it doesn’t need to be perfectly straight, the drawn line is horizontal. If the angle between a line and the horizontal axis exceeds the angle of 23 degrees, the drawn line will be diagonal at 45 degrees. If you move the mouse toward the vertical axis, the line will be drawn as a vertical line. The straight-line tool may be used to draw clean diagonals. If the paint tool is then used to fill spaces between some of the drawn lines, the line tool reverts back to the original and will have to be reactivated if you wish to continue using it. The polygon is a series of straight lines whose ends are connected so that the end of one line is the beginning of the next. Move the mouse pointer to the starting point and left-click. Move (not drag) the mouse to the next point and left-click again, repeat this step until the desired polygon is drawn. Press the right button to stop the polygon drawing or the middle mouse button if available to erase the last polygon point. Returning to patterns with repeat constrained A: a new file is created for drawing a punchcard repeat 6 stitches wide by 60 rows high B: a freehand-drawn pattern C: the motif is drawn in repeat, X4 in width to match the 24-stitch repeat, and X2 in height to get a sense of vertical alignment D: as long as the new picture option is not checked, the image allows for live pencil drawing, E, with additions which may be edited and undone if needed. Work until satisfied, screengrab the enlarged image if the goal is to use it as a guide to punch cards, and scale print it to an easy-to-follow size. Electronic machine knitters use the Tools, Find the repeat option to isolate the minimum programmable final repeat, and exchange colors if needed The same process, using an 8X8 repeat drawn in repeat X3 in width to 24 stitches and X5 to 40 rows in height meeting the punchcard minimum height Again, electronic machine knitters use the Tools, Find repeat option to isolate the minimum programmable final repeat, exchange colors if needed Many knitters find inspiration for knit designs in weaving drafts. The Arah Youtube video on developing drawings for such repeats shows an option for preview in the draw in repeat window not available in my present version of only ArahPaint. The resulting working repeats are likely to be large. Reset allows for changing repeat mirroring arrangements. Using find the repeat may help develop a sequential series of repeat segments in different sizes, producing different tiling effects, and the option of hand selection of even smaller areas followed by cropping and processing is always possible. A sample effort producing a tenfold repeat of the original: Finding the repeat first on the complete resulting new image on left and testing its tiling, followed by finding the repeat again, cropping to the selection, and tiling that as well on the right If the goal is to knit a scarf, 72 stitches wide, crop either repeat to a chosen 72 stitches in width, tile in length in either program to visually check alignment. If knitting in DBJ for approximately 1200 rows is the goal, one may obtain a visualization of the results ie for 1296 consecutive rows. A black pixel border could be added to the 72 stitches by copying and pasting the image on a larger canvas that will accommodate that border, or the border may be added by filling in pixels vertically to the edges of the original. Some repeats to play with: the 120 X 96 png Its shorter, top half The bottom half, 120 X 48, isolated in Gimp, tiled in length X4 to get a sense of some of the possible differences I cI can see the process becoming addictive once a single personally pleasing starting repeat is developed, and its, in turn, becoming a possible source for collections of designs. October 2021: I have recently purchased both a PC and DAK software. At the moment I am not planning the purchase of any cables, the initial patterns developed using the lace module are adapted for use on Brother electronics for proof of concept swatches. Arah is an easy, accurate, quick way to develop accurate brick repeats for lace patterns, which can be complicated to produce accurately in other ways. One such repeat December 2021: in reviewing my post including lace mesh repeats, using the draw in repeat figure in Arah provides a quick way of filling in punchcard repeats from small electronic repeats for any fabric ie this lace repeat, 4 stitches wide by 8 rows high. Create a new picture in the same dimensions, fill in the proper cells deselect the pencil tool by randomly clicking on any other tool draw the repeat as given, 6 times in width, 5 times in height for a card 24 stitche"
