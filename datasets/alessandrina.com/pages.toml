["https://alessandrina.com/2022/07/15/arahpaint-and-gimp-in-knit-design-3"]
title = "ArahPaint and Gimp in knit design 3 – alessandrina.com"
description = "machine knitting and more"
full_description = "ArahPaint and Gimp in knit design 3 Previously published: ArahPaint and Gimp in knit design 2 ArahPaint meets Gimp in knit design 1 Subsequent posts on using Gimp Layers to process images: Using Layers in Gimp for color separations Layer/Transparency/Color to Alpha Gimp Update for Mac 3_more on color separations Gimp allows one to work on multiple images with only a single window open, left mouse clicking on any one of the images will bring it into view for editing. In the dark theme, it is hard to see the difference, but a lighter border actually surrounds the active image distinguishing it from the others, outlined here in yellow In Arah, multiple windows may be opened at any one time, and left-clicking on any one of them will bring it to the front for editing. When working using the same file in more than one window, the degree of magnification needs to match in each. Spreadsheets and paint programs may be used to achieve color separations for designs intended for specialty fabrics, many worked on the double bed. Two places to begin exploring them here are for knitting single-bed mosaics and double-bed jacquard in its form where each color in each design row knits twice. It is unlikely to happen often in knitting that more than 6 colors are used in any one fabric except perhaps in an elaborate color-changing fair isle. The palette that appears in Arah when opening a new file is random, as seen here when two new files of the same size are loaded If one’s preference is to reduce the number of colors, the specific number may be set by choosing from the colors menu, editing the number identified as that for the working palette, changing it to the new value, in this case, 6, and the palette reduction occurs as seen in A. For most knit repeats a black color is handy, any one of the 6 colors or more may be adjusted as described in the previous post, seen in B, where black has been added, replacing the color in position 1. More Gimp information: https://docs.gimp.org/2.10/en/gimp-palette-dialog.html Some of the related content in brief: the former versions of GIMP had a “Save palette” command. Palettes were stored in a specific folder via the preferences pane. Easy to do and manage. It no longer exists. To save the palette of an image, indexed or not, you must now import it from the image. The “Palettes” dialog is dockable: from the Image menu, select Window, Dockable Dialogues, Palettes. A few dozen more or less randomly chosen palettes are supplied with GIMP.“Import Palette” allows you to create a new palette from the colors in a gradient, image, or palette file. Right-click in the space to the right of the illustrated palettes to call up the import option, or for palette editing. It is not necessary to index the image, this image was used in RGB mode. A palette name can be assigned, and if previously used, a number will be appended by the program. The number of colors: the default is 256, you can set the number to any you choose. Gimp will try to create a palette by spacing the number of colors evenly across the range of the gradient or image. Each screengrab in the top row shows the initial selections for gradient or image, and the second row of screengrabs notes other changes made when choices were available and the results. White dots mark selections as seen while using the program. Using the same image, indexed to 5 colors, the custom palette is rendered in a one-step process. The gradient seen in the first position on the top left was randomly assigned by the program and does not influence the results. The Columns selection number settings only influence the way the palette is displayed and have no effect on the way the palette is used. The lower the number, the larger the display size of each color unit. Double-clicking on any palette color will magnify the palette view on the theme color background. Left-clicking on any color makes it available for drawing, the selection will have a dotted bounding line and the selected color will be assigned to the foreground position, Right-clicking on a color results in these options. The imported palette will be added to the Palettes dialog and is automatically saved in your personal palettes folder when you quit GIMP so that it will be available in future sessions. In Arah, the color palette will always display the colors of the active layer. The working image contains colors intended for use in my designs. In addition, please see the note from the developer in the comment at the end of the post. The palette tools: A: if you press this icon the program will underline the colors actually used in the image, since all colors are used in this case, each color is underlined in either white or black in this instance D: adds color(s) to the palette B: removes unused colors in the above palette, it would restore the original colors C: removes duplicate colors, not applicable in this instance E: removes the last unused color, will not work if all colors are used. Changing color positions in the palette: to switch the position of two colors in the palette, click the chosen color in the palette, move the cursor to the color you want to switch the position with, and press the left mouse button while holding the Ctrl key on the keyboard. In this instance, the color was duplicated in the new position. Knitters designing for dbj are likely to work with a limited range of colors, often 3 or 4 max, in specific palette ranges to ready images for download. If color separations for 3 or more colors are done in shades of grey in terms of technical details, you need a pattern image that is 8-bit greyscale, with each color in a range of 8-bit values. So for 4 colors, it would be 0-63 color 1; 64-127 color 2; 128-195 color 3; 196-255 color 4. Binary images have only 2 possible intensity values, normally displayed as black and white with values of either 1 or 255 for white, and often 0 for black. That convention may have led to the selection of white as color 1 in automatic separations such as the KRC Japanese one, where white is selected first. In a greyscale or color image, a pixel can take on any value between 0 and 255. Designing for fair isle, or when attempting to visualize and illustrate slip and tuck fabrics with frequent color changes, more colors may be required even though the final download will be in black and white. There is a quick way to add random colors assigned by the program and based on the initial palette: The magic wand tool allows you to work on consistently colored areas without having to select and outline each. To alter a single color using the bucket tool, click on the wand, then on the color single color area you wish to change, it will become outlined by bounding lines. Click on one of the colors in the expanded palette, and it will automatically appear in the foreground color position, and it may then be used to bucket fill the chosen area. Flatten the image using the merge-down tool. If the foreground color, in this case, white/0, needs to be changed, in order to choose all pixels in the foreground color, click on the wand, and use Tools > Select by color or Shift+W. This function works only on 8-bit pixel images. Click on the color you wish to use to replace the ground, and bucket fill with the newly selected color. Flatten the image using the merge-down tool. Changing multiple color blocks in the same color could be selected by the tool, but filling each of them one at a time was required. In Gimp a similar tool is the fuzzy select, which also allows for changing the color in a selected area or for selecting and changing all pixels in that color. Selected areas will also be outlined in dashed bounding lines. Bucket fill may then be used to replace color(s). The option is offered to choose either foreground or background for the fill. 2023 in Gimp 2.10.34 use and hold the shift key prior to selecting and using the bucket fill tool to change all the areas outlined by dashed lines. The bucket-fill tool itself now works again on any area with a defined boundary, no other, following action is necessary. Click on the rectangle select tool and then on any spot in the work area or on the image to set the image. The dashed lines will disappear. In terms of saving the palette in Arah for future use, I saw no specific directions in the manual. The color palette displayed is always the one used in the active layer. As a workaround: open the image, and the associated palette will be displayed. The repeat begins drawn 24 pixels in width, by 24 in height. Select clear from the edit menu, or bucket fill area with white If the size of your intended drawing area is different, choose the option Resize Image from the Image menu. With the chain link intact, the new canvases are created keeping the aspect ratio. Enter a new value for width/height, hit return, or move the cursor to the alternate value, and its number will automatically change to a matching one. Click OK to use the new canvas, or reset if you wish to return to the original 24 by 24 pixel one for a different edit. With a broken chain link as one of the two values is altered, a preview is available. If both values are to be changed, break the chain link, enter the two values in turn, and a preview appears for each step. Ok is used again prior to saving, or choose reset to return to the previously used setting. Color separations can make specialty fabrics possible to knit which are outside the possibility of doing so simply by changing cam settings. Two instances are mosaics and DBJ where each color in each design row knits twice. Separating each may be done in two ways. The first method, convenient for longer repeats, requires that the result be elongated X 2, whether in the repeat design software or after download to the machine or using the elongation X2 function in the punchcard models. For illustration purposes here I will be working to create files that do not require elongation. Mosaics and Mazes are constructed in similar ways and are sometimes referred to as floatless fair-isle even though technically speaking usually 2 stitch floats do appear on the purl side in the alternate color used with each color change. Many such repeats may be knit using both the slip and tuck settings, the latter is the more interesting of the two on the purl side. When learning structures it may be worth beginning with a published design. Kathleen Kinder decades ago published two books, one with 24 stitch repeats, the other with 40 stitch repeats, with the separations included as well This, by Barbra Walker and intended for hand knitting, offers a huge library of designs for inspiration and conversion Following specific rules it is also possible to develop DIY repeats from scratch. That said, the repeat used in this blog post happens to have a known value of 12 pixels by 12Magnification in Gimp is achieved by selecting or typing in new percentages at the bottom of the window. Entering and exiting the full screen may be controlled via the view menu To exit, it right-click at the very top of the window to expose menu options and select deselect full screen. In Arah, if you press any number from 0-9 on the keyboard, you will change the zoom directly to that level (1 means 100%, 6 means 600%, 0 means 1000%). The plus + and minus keys- as well as the magnifying lens icons, will zoom in and out To use the entire space available in the window, choose Fit to Window from the view menu or select Ctrl+zero. If working in more than one window this option makes repeats the most visible, scaling back can be done by counting the number of selections, helping to match the new picture magnification to the first. Press the escape key on the keyboard to return to the original 100% view. To work using the full screen, select the option from the view menu. To exit, right-click at the very top of the window to expose menu options, and select exit full screen Separating the design: ultimately the planned final graphic repeat would be a BW png used for electronic download, programmed as a fair isle one, but knit using tuck or slip settings, it may be drawn initially using only in those 2 colors. Black may need to be added to the palette selections. One may always draw on a large canvas and then crop as needed, but as a starting point, it may be easier to simply match canvas size to the published repeat being used. It is handy to have an extra column to help track image processing during the separation, the repeat above is identified as being composed of 12X12 pixels, one could begin with a 13X12 canvas. A second way to provide the 13th column is to work using 2 windows, matching magnification, and the second with a different, larger pixel measurement than the first. Copy the contents of the original work area and paste them into the larger canvas in the other window. Crop to new size if necessary. To illustrate the two-window process, here the original BW repeat has already been drawn and elongated X2 A. Use the rectangle-select tool to capture the whole image in the first window, bounding lines in the colors of the palette in use will outline the selected area B. Use the edit menu or command C to copy the selection, edit paste, or command V in the new window to place it. When pasting on a different size ground, the bounding lines will also appear in the new image, the contents remain moveable, C. Place the selection where desired on the new canvas, when satisfied use the X, merge down tool to flatten it. The quicker method begins with a canvas one pixel wider than the repeat, 13X12. Adjust magnification, for comfortable viewing in the editing process. View: show grid 2 Colors: set the number of colors to 6, and adjust the #1 color to black, white is in position 0 in the palette by default Activate the pencil tool, and draw a vertical line on the far right in an easy-to-see color choice other than white or black Using black, fill in pixels for your first draft of the pattern repeat Image multiply YX2, resulting in 13X24 Using the pencil tool fill in the first 2 design rows followed by every other pair with white. Magnify image A to a comfortable work viewing size. B and C: using the rectangle select tool, with the left mouse button, place the pointer on the purple pixel, drag the mouse across each pair of marked rows, release the mouse, and use Command I to color invert, and merge down to eliminate the bounding box. The purple pixels will change color as well, making it easier to track what rows have been altered already. D: crop the image, removing the row with colored cells for the final repeat If for some reason you are processing an image that is color reversed, the steps are identical, but tuck or slip stitch fabrics, black pixels or punched holes knit, white pixels or unpunched squares tuck or slip. For this reason, the cropped final result would need to be color inverted prior to knitting or punching holes. This separation for 2-color DBJ results in"
