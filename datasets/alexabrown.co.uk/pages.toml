  WritingAs a freelance writer, I can help develop your script or write a full script from scratch based on your brief.I recently collaborated with an author on her audiobook about health and wellness, which I also voiced. Some of my other projects include a range of how-to videos for Citi, award-nomination videos for Just Giving and explainer videos for Proxymity. Please don’t hesitate to get in touch to discuss your project or find out more.





















  
  
























  
  



  “Alexa’s scripts for our Just Giving projects were the perfect feel and tone. We couldn’t be happier with what she wrote and her voiceover delivery.”
  
  — BAD STUDIO






















  
  



  “I loved working with Alexa on the voiceover script for my underwater film The Coral Guardian. Her writing gave the perspective of nature so much warmth and personality. I hope to work with her again!”
  
  — DAVID I. DINÇER, BAFTA-NOMINATED UNDERWATER FILMMAKER




  Script EditingI am passionate about helping other writers get their scripts in the best possible shape.I studied Story for Script Development with John Yorke Story, where I gained a thorough grounding in the theoretical elements of script editing: how to use act structure, forces of antagonism and turning points to create emotionally invested work with believable characters (though I promise not to use any of these terms in my feedback).I write insightful, succinct and encouraging notes designed to help you get your draft to the next level.If you have any questions or would like to find out more, please get in touch.





















  
  
























  
  



  “Working with Alexa was a great experience. Her notes on my script were thorough, clear and well-articulated, which really helped me elevate the next draft.I would highly recommend her as a script editor.”
  
  — Tim Fellingham


  
  
  


  


      
                                
  
  
  
  
  
  


  
  



    
  
                    

