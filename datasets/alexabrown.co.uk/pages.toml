  “I don’t think I’ve ever worked with such a friendly, patient, candid, detail-oriented and flexible talent before. Alexa is a wonderful communicator, very open to feedback and delivers top notch work each round. She’s been dedicated to deliver her absolute best, allowed us to call-in for extra direction and was understanding at every turn. All in all, she’s helped us make a tricky project a LOT easier. We HIGHLY recommend working with her!  ”
  
  — WeAreListeners






















  
  



  “Alexa was great. We had a short deadline and she was always quick to answer. She delivered on the due date despite us having a delay in handing her the script, showing us patience, good mood and commitment. She got the tone and style we were looking for, and sent it to us with a good audio quality. We’d totally work with her again!”
  
  — Marila Pimento - Oz Produtora for Astrazeneca






















  
  



  “Unbelievable. I have hired 3 other talent for this project and after spending so much and countless hours of revisions because they could not get the words right, Alexa just nailed in on the first try! Unbelievable. I am definitely going to hire her for all of my global videos.”
  
  — Adri Odu






















  
  



  “Alexa’s voiceover work was outstanding. We worked together on a series of films for Save the Children on abused children in Bangladesh and Zanzibar. She added depth and concerned urgency to the storytelling without sentimentality or sensationalism, which was exactly the tone we discussed in the brief. She is brilliant at suggesting changes to the script to make the story and voiceover flow better.”
  
  — Mats Lignell - filmmaker for Save the Children






















  
  



  “Highly recommended voice over artist! Very professional and responsive. Excellent collaboration.”
  
  — Zedem Media






















  
  



  “Alexa is super professional and dedicated to her craft, yet she never lets that stop her sense of humour from shining through. This only added to making our scripts so much better. Given the chance we’d work with her again in a heartbeat.”
  
  — Adam Roberts & James Lightbown - director & producer of Captain Fawcett films






















  
  



  “Alexa was fantastic. She did a voiceover for me for a UN industrial development film and beautifully combined the serious tone needed for the background information about Liberia, and the more familiar tone needed for later parts of the film. A consummate professional and a pleasure to work with, I cannot recommend her highly enough.”
  
  — Bex Singleton - filmmaker for UNIDO






















  
  



