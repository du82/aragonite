title = "Who is She? Alexandra Kitty"
description = "Alexandra Kitty is an award-winning author, artist, educator, researcher, and scholar. She is an author whose work has appeared in Presstime, Quill, Current, Editor & Publisher, Elle Canada, Maisonneuve, Critical Review, Thorn Literary, Exterminating Angel, and Skeptic. She was a relationships columnist for the Hamilton Spectator and an advice columnist for the Victoria Times-Colonist. She"
full_description = "Alexandra Kitty is an award–winning author, artist, educator, researcher, and scholar. She is an author whose work has appeared in Presstime, Quill, Current, Editor & Publisher, Elle Canada, Maisonneuve, Critical Review, Thorn Literary, Exterminating Angel, and Skeptic. She was a relationships columnist for the Hamilton Spectator and an advice columnist for the Victoria Times-Colonist. She taught both art and communications at various colleges, was a true crime researcher for Cineflix’s A Time to Kill, and she was the first female recipient of the Arch Award from McMaster University. She has written numerous books over the years. She also teaches kintsugi. Her podcast guest credits can be found here. Her favourite band is still The Hives."
