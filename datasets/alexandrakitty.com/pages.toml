title = "Alexandra Kitty Alexandra Kitty - Page 2"
description = "Dream of Arts Studio"
full_description = "Another interview with me Right here. Things are moving a little slower than I’d like, but it is moving along. More information when they come. I was featured on Author Interviews You can read my bio here. You can read a sample of The Sport of Presidents here. And you can read an interview with me here. I was interviewed for an article in The Hill The piece was about US presidents and golf. My book is coming out July 2, but this was an unexpected surprise, and it is an interesting take on the sport well worth the read, and I was happy to be interviewed. I was a guest on Murder and Mimosas Subscriber-based episode This episode was more about my stint on A Time to Kill, but also about Murder in a Sundown Town. You have to be a subscriber to listen, but it was a comprehensive and enjoyable talk. I was a guest on the Roundhouse Podcast For International Women’s Day, I discussed my book A Different Track. You can listen to it here. I was a guest on the Murder and Mimosas Podcast I discussed my book Murder in a Sundown Town and you can hear it here. I was a guest on the New Books Podcast Talking about A Different Track here and the Substack post about it is here. I will be in the upcoming Sherlock Holmes magazine In the Winter 2024 edition, writing about Sherlock Holmes in the theatre, of course. The magazine is a print edition only."
