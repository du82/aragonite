["https://alexandrakitty.com"]
title = "Fighting to Win versus Fighting Not to Lose: Or why Canada is about to be liberated and enter its Golden Age Alexandra Kitty"
description = "The weak prey upon the strong. When someone tells you that you can't live without them, it is, in fact, the other way around. They are manipulating you to think that you are weak and they are strong, but that's a big lie. Misogynists play this game all the time and it's their only trick"
full_description = "The weak prey upon the strong. When someone tells you that you can’t live without them, it is, in fact, the other way around. They are manipulating you to think that you are weak and they are strong, but that’s a big lie. Misogynists play this game all the time and it’s their only trick in their little bag. They are innately incompetent and defective; so they want to trick a competent woman into doing all of his work, while he gets all the glory. He sees his prey as an exploitable unit to be harvested, meaning the sexist is a parasite. He may “run the business”, but it is his wife (and children who he sees as his free work force) who do all the work as he keeps moving the goalposts, never satisfied and always insulting them to keep them under siege so they believe they cannot survive without their parasite. The second the wife leaves, his business goes bust. Why? Because the weak prey upon the strong. And no one in the world is in a weaker position than Donald J. Trump. He is a salesman, and he vastly oversold what he can possibly deliver during the 2024 election. He did not win big in the election. This was no Mondale versus Reagan. There was less than 2% difference in the popular vote and Kamala Harris received more votes than Hillary Clinton in 2016. The House and the Senate were squeakers, too. So let’s not indulge in hyperbole. That’s propaganda used to psyche out the stronger force. The Democrats lost because they appealed too much to an extremist fringe and ignored the economy, losing the center vote. Had they remembered this fact, Trump would have lost. Trump didn’t win because of anything he did; he lost because the smug Democrats panicked and messed up. But it is easy to see why people thought Trump did something spectacular to earn his victory, which he did not. Trump ambushes and humiliates stronger people as a first strike. That’s his brand of trumpaganda. It’s not particularly impressive or original, and it only works on people with bloated egos who want to be liked by everybody. If you don’t care, it doesn’t work. And I don’t care. However, there is much childish fear-mongering going on right now. So the US hit Canada with tariffs (which aren’t completely in effect because there isn’t a way to collect it yet), and the Canadian politicians (with the exception of Doug Ford) and Canadian media are making a mess of things every step of the way. They are letting Trump set the rules of the game instead of upping the ante and striking first: they should have put 100% tariffs on US products first and banned US-based stores from operating in Canada. That would have showed the US regime that Canada knew its worth and how dependent the US was on Canada for their profits. In any case, someone has to be the voice of reason here, and it might as well be me. This is much ado about nothing. This is, in fact, a long overdue reset. Canadians are now canceling their Costco and Prime memberships and they are not buying US-based products. They need to find replacements, and considering they can be a self-contained nation, they can produce it themselves. Canada has talent and resources. There are billions of people in other countries where Canada can do business; so settle down. And we don’t have to have a depression or recession because of tariffs. If we fight to win rather than fight not to lose. Donald Trump is not fighting to win. He is fighting not to lose. The problem is he wanted a second term in the worst way and this is exactly how he’ll get it. So instead of our irresponsible journalists and politicians expecting the worse, they should be showing us Canadian-based businesses, and asking how they can help Canadian businesses — and not try to manipulate a situation by trying to make a frightened Canadian public dependent on them. Those days are done. Aim higher and expect more of your people or just get out of the way. Instead, the government could start by forgiving CEWS/CERB payments for one. They could not tax and regulate small businesses. They could give government contracts to Canadian small businesses instead of looking at US-based companies. We don’t have to lose a million+ jobs. We could gain over a million full-time jobs. Russia didn’t fall with sanctions during war; so why would Canada fall with a few measley tariffs in peace? Tariffs are a misdirection, and a form of propaganda meant to deflect attention away from the real show. Sure, Canada has more resources than the US; and the robber barons always want to take someone else’s hard work and blessings through trickery and abuse, and then claim they are Titans of Business and Great Men. No, you’re not. You’re just a parasite. Canada does have one psychological weakness: it believes in Daddy Government, and this is a fear-based defect, but it is not one that is hard to shake. The fear-mongering is an exploitative element in the narrative in order to try to manipulate citizens into obeying, which they should never do. Do not be predictable. Do not comply or capitulate. In 2020, COVID-19 was the sneaky way the Left tried to gain control and it backfired. In 2025, MAGA is the Right’s version of COVID-19, and it will fall apart much faster. There is no need to panic or think that the White House can win this war. Yes, this is economic terrorism and an act of war, but if you feel no terror, then terrorism falls flat. The analytical thinkers on the Left are frozen because they thought they were the One, and then reality showed them otherwise. The primal thinkers on the Right are sinking their own ship, and are, and have always been their own worst enemies. Worse, they are cognitively incapable of understanding that even if there is an economic implosion, they are not going to be able to manipulate all the women because they’ll have nowhere to turn. These men will show their deep incompetence because everything is falling apart as they are wearing the paper crowns, and then some other entity lead by a woman will scoop the country up and rule because you cannot fool all of the people all of the time. Why? Because we are in an emotional scaffolding. The Right absolutely know they they could not win unless the Independents voted for them, and there is now more than just buyer’s remorse: there is a silent revolution going on. The right are trying to impose a cringe narrative, and it’s not working. It’s transparent and very selfish. Trump’s parasites, better described as MAGAsites, made grand theories in their mommy’s basements and then used Rumble and SubStacks to kiss up to Trump in order to get patronage appointments. They are sugarbabies who marked Trump as their sugardaddy. They never made it in life, and blame everyone else but themselves. They may scoff at Criticial Race Theory, but their theories are a white bread version of it. So now they think if they try to rig the board with their untested theories, they will forever be in control and vindicate themselves. Ha ha ha! Except their theories are so full of defects and holes, they can’t work; so now it’s panic time, and they are trying to see which countries they can rob to keep their sinking ship afloat as they try to rid of any superior nation which woud serve as a control group to show just how bad they are at this whole ruling thing. The answer to their evil prayers is, of course, not Canada. If you threw a 150-year-old friend under the bus for a cheap quick fix, you have just announced to the entire multi-verse and all the deities that you are incapable of having friends or allies because you are a snake. And no snake has ever managed to procure a Garden of Eden. It will get you evicted in a heartbeat. Trump has made a deal with the devil the day he hooked up with the magasites, and no amount of trumpaganda is going to hide this Truth. No, his flimsy excuse of fentanyl coming to the US border from Canada is just a pseudo-moral lie. He has no moral compass. This is a smash and grab attempt at trying to keep his sugarbabies happy. The walls are closing in, and now let’s turn on our allies before it all comes crashing down. There is an old Serbian saying that those who dig graves for others are the ones who end up falling into it. Trying to destroy a nation qualifies. None of the current federal politicians in Canada or the wannabe Mark Carney are fit to lead this country. Not one. Doug Ford is a premier, and it is fitting that he is going up against Trump with gusto. Ford isn’t crying in his beer. He is fighting to win. Millions of Canadians have cancelled their US-based vacations, sold their US real estate, stopped buying US goods, and are now walking away from US-based stores. True North strong and free. Whatever you thought of the Freedom Convoy, it was Canadians, not Americans who put everything on the line and protested their government for days on end to break the government tyranny of lockdowns and mandates. Trump should remember that. Forunately, my fellow Canadians are fighting to win. Do not feel fear or despair. In this global game of roulette. we were, out of the blue, given a golden ticket to be serious players in the game, and we should take it and not look back. So any Canadian politician who says we are going to have “hard times” should be booted out for their treasonous, loser mindset. Any Canadian journalist who parrots this deceptive lie should be given a pink slip and kicked in the shins for being a toxic whiner. It’s not true and stop trying to make Canadians dependent on you so you can feel like you’re important. You’re just a person, and get over yourself. We can land on our feet. We can soar. Countries have flourished in times of war; so what’s our excuse? Don’t fall for propaganda. Don’t fear 47. He’s not worthy. If it weren’t for nepotism, they wouldn’t have let Trump operate a sock puppet from behind a piece of cardboard. Life is short and life is fleeting. There is never a good time to start something. That’s exactly why you start it. When everyone was hiding under the bed in 2020, I had four books published, and acocmplished a lot. I didn’t sit there waiting for wonderful things to happen. I made them happen. And now that I am an expert at living a happier and more productive life than jealous tyrants, I’ll be taking my act to the next level. In a world of 8 billion people, if I am going to be focussing on one person, it’s not going to be Trump. It’s going to be me. He’s just not important, and neither are his magasites. I didn’t fall for the propaganda of 2020, and I am not falling for the 2025 variety, either. Trump is this year’s Ozymandias, and you remember how that poem ended: And on the pedestal, these words appear: My name is Ozymandias, King of Kings; Look on my Works, ye Mighty, and despair! Nothing beside remains. Round the decay Of that colossal Wreck, boundless and bare The lone and level sands stretch far away."
