["https://alexandrefranke.com/floss"]
title = "AF does FLOSS - AF does stuff"
full_description = "I have been contributing to Free Software and the Commons since 2004. If you find my contributions helpful, consider supporting my work. Current focus My main activity these days centers around three areas. As a GNOME internationalisation (i18n) coordinator, I ensure our translation process is the best there is. Maintainers can rely on me to help them sort out any issue they face and get guidance from me when they need it. Translation teams have a smoother ride, as I’m here to organize their efforts and solve problems for them. On top of that, I coordinate the French translation team. I co-maintain Fractal, a Matrix client for GNOME. This entails way less code than I wish I wrote, and mostly takes the form of project management tasks, with some wordsmithing sprinkled on top. Bug squashing is, alongside translations, the first activity I participated in when I started working on Free Software. Ever since, I’ve been providing maintainers with some relief, by triaging their issues, implementing new strategies or improving existing ones if needed, and ensuring their trackers become more manageable. I sometimes highlight my recent achievements on Mastodon with the #AFdoesFLOSS hashtag. You can also see some of my activity on the GNOME GitLab. Past work Since I started getting involved, my work spanned a wide range of areas. Some highlights follow. I have organized conferences and hackfests ranging from a handful of people for a couple of days to thousands of visitors for a full week. I later used the expertise I gained in this domain to guide other organizers, and help select applicants for various events. A director of the GNOME Foundation for three terms, I represented my fellow members, and was the liaison with some internal committees and external entities. During that time, I was also Secretary of the Board, and improved the process for taking and publishing meeting minutes."
