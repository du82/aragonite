title = "20 years strong - AF does stuff"
full_description = "2017, August 17 20 years ago, Miguel and Federico created GNOME. We had an early party during GUADEC at the Manchester Museum of Science and Industry. I organized a local one in Strasbourg yesterday with the help of Marie-France, a student who was already behind the logistics of the Sympa hackfest. It was part of a string of similar events around the world. Marie-France baked us an awesome cake. We had a love wall, a longtime tradition at GNOME events that the locals weren’t used to, but they sure appreciated it! Stickers that I brought back from GUADEC got dispatched and brought smiles to the faces of attendees."
