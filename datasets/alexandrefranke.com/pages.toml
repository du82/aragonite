title = "Bug squash month returns - AF does stuff"
full_description = "2017, November 01 Today is the first day of November. Last year we started a new initiative called Bug Squash Month 🎃 and we’re running it again this year! Everyone can participate. We had a lot of newcomers last year and I got the same feedback from all of those I had a chance to hear from: it doesn’t take much to get started, it is rewarding and you see the impact you have immediately, it’s exciting! The transition to Gitlab will probably happen soon, so now is a good time to clean up the old bug tracker before we migrate anything. So join us on a Bug Squash Day 🌞, organize a local Bug Squashing Party 🎉, or try to triage your 5 🐛 a day."
