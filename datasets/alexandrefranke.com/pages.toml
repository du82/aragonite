["https://alexandrefranke.com/about"]
title = "About Alexandre Franke - AF does stuff"
full_description = "Born in a year that is also the title of a book, which unfortunately some powerful people seem to be drawing too much inspiration from. Alexandre remembers going to a store with his grandpa, seeing a computer for the first time, looking at that brand new Prince of Persia thing, timidly pressing the arrow key on the keyboard, and seeing the character move on the screen. Image courtesy of wikimedia That experience sparked his curiosity, and would set him out on a quest to find out how it worked. After a detour through preparatory class to buff up his math skills, he graduated with honors from the Institute of Technology at what is now known as the University of Strasbourg, earning a Professional Bachelor of Science in Software Engineering. Unsurprisingly, he started his career at a video game studio. Free Software, which he discovered as a student, was his calling though, and he left to pursue it. Outside of bending computers to his will, Alexandre is also a musician, a photographer, and a video game and board game enthusiast. He aspires to minimalism, got rid of his last car in 2009, transitioned to plant based eating in the late 2010s, and his main motivation in life is to leave the world better than he found it."
