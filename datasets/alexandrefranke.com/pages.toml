title = "DX hackfest, day 1 - AF does stuff"
full_description = "2016, January 27 I arrived yesterday evening in Brussels for the DX Hackfest. Many thanks to the GNOME Foundation for sponsoring this trip. Today we discussed plans for platform-overview, which I started working on. There's room for improvement. Two main goals have been defined: the tech-* pages need to become the entry point for libraries, not a gateway to an entry point the other pages need to be more straightforward, say less how amazing our tech is and more what you can actually do with it. I also prepared a userdocs branch for GNOME Builder to implement help infrastructure. 3.20 should have a basic manual!"
