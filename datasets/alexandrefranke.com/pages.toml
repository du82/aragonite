full_description = "2017, November 20 Just like last year, we organised a Bug Squashing Party in Strasbourg for Bug Squash Month. It happened yesterday at my place and was a bit low key as I didn’t have that much time to organize. Four guests were originally planning to come to Hackcendo HQ, but something came up at the last minute for two of them and we ended up with just three participants. We had a good run nonetheless and managed to close 14 reports, ask for more info on a handful, as well as update fields on quite a bunch of them. All of that was done in a cheerful atmosphere accompanied by Christollen brought by Jean, and infinite tea supplies from my stash. We’re only two thirds into the month, so it’s not too late to organise a BSP in your area. Happy squashing!"
