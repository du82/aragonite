title = "Okay, I really like WezTerm | Alex Plescan"
description = "A guide to configuring WezTerm using its Lua API. Focuses on appearance, keybindings, multiplexing, workspace navigation, and status bar (powerline) setup."
full_description = '''A while back my friend recommended that I try WezTerm. I’d been an iTerm 2 stalwart for the better part of a decade, but not to be too narrow-minded I conceded, started it up, and saw this: Does the job, sure, but doesn’t feel quite right. Okay then, experiment over. Back to iTerm… Fast forward a couple of months and I got the itch to try a new terminal again. I wanted to use one whose config was entirely text based so I could pop it in to my dotfiles and share it across my work and personal machines. A few terminals already do this, but whispers of WezTerm’s powerful API and Lua config got me particularly interested. I tried it again with a bit more patience and I’m glad I did. My terminal is prettier than it’s ever been, more functional, and I can finally justify my mechanical keyboard purchase with all the keybindings I’ve configured. This post is an introduction to configuring WezTerm based on the setup that I eventually landed on. I’d consider it relatively low-frills. Most of what I talk about here can already be found in WezTerm’s docs, but as they’ve got a large surface area, I’m hoping this post will be a useful jumping off point for WezTerm beginners. We won’t be looking at some of WezTerm’s key features, like custom hyperlinks highlighting rules, searchable scrollback, quick copy mode, and image support (you can find more details here). The feature I find most exciting about WezTerm is the flexibility of its Lua config, so we’ll be focusing on that. This includes configuring appearance, keybindings, multiplexing, workspace navigation, status bar setup, and dynamic theming. By the end of it all, we’ll have a terminal that looks like this: Subtly prettier than the default, and with some great features to boot. I use macOS, so what follows is focused on ergonomics that make WezTerm great there. I haven’t tested my config on other systems, but I’m not doing anything too bespoke so things should be portable (WezTerm works pretty much everywhere). tl;dr? Here’s a gist containing the config we’ll end up with. Pre-flight checks Start by installing WezTerm. Instructions for this are on WezTerm’s site. If you’re on macOS and reading this you probably have Homebrew installed, so $ brew install wezterm will do the trick. Now launch WezTerm, and you’re already winning. A note on Lua My favourite WezTerm feature is its use of Lua for defining config. Unlike terminals where your settings are adjusted via the UI (iTerm 2), your WezTerm config lives in your dotfiles and is portable across all your machines. And unlike other terminals where your configuration is written using a data serialization format like YAML or TOML (Alacritty, kitty), with Lua you can more easily achieve complex configs by leveraging dynamic scripts. Granted, Lua is a programming language so it is trickier to learn than YAML or TOML, but it’s still remarkably simple. If you’ve used another dynamic programming language (e.g. Ruby, Python, JavaScript) - you should be able to read the Lua code in this post easily. For achieving more complex configs, I’d recommend diving deeper into the language. Its Getting Started guide is a good place to… get started. Config files, and the best feedback loop in town WezTerm supports loading in its config from all the usual places on your system (docs). For this guide we’re going to be creating our config in $XDG_CONFIG_HOME/wezterm/wezterm.lua. On most systems (including macOS) this resolves to ~/.config/wezterm/wezterm.lua. Using a directory to store our config instead of dumping it in ~/.wezterm.lua will let us keep our config logically grouped as we split some of it out into different files. Create the wezterm.lua file on that path, and add this boilerplate to it: -- Import the wezterm module local wezterm = require 'wezterm' -- Creates a config object which we will be adding our config to local config = wezterm.config_builder() -- (This is where our config will go) -- Returns our config to be evaluated. We must always do this at the bottom of this file return config Save the file and all going well… nothing will happen. Well, at least nothing appeared to happen, but what WezTerm did behind the scenes is quite magical. It watched your config file, and when it changed it auto-reloaded instantly. This feature makes for a wonderfully tight feedback loop where you don’t need to restart your terminal to see the effects of your new config. We can quickly test this auto-reload by adding some invalid syntax and seeing what happens. Replace the call to wezterm.config_builder() with wezterm.config_builderZ(), save, and you should immediately see a window pop-up with: runtime error: [string "/Users/alex/.config/wezterm/wezterm.lua"]:2: attempt to call a nil value (field 'config_builderZ') stack traceback: [string "/Users/alex/.config/wezterm/wezterm.lua"]:2: in main chunk How’s that for a feedback loop? Fix the error and save the file again. This time, have your config log something: wezterm.log_info("hello world! my name is " .. wezterm.hostname()) Save. Now… where did that log go? Press CTRL + SHIFT + L to bring up the debug overlay (docs) and lo and behold, your beautiful log was waiting for you all along. Not only that but what you’re looking at is a full Lua REPL. Enter 1 + 1 and you’ll see the result. Enter wezterm.home_dir and you’ll see the result of accessing the home_dir entry on the wezterm module (docs). The combination of hot reloading and the debug overlay makes experimenting with WezTerm configs extremely low friction and low consequence. The feedback loop is so tight now it’s more like a feedback lp. Configuring appearance Okay enough gushing - let’s cut to the chase and make this thing prettier. Add a few lines to the config to start customising the look of the terminal. We’ll start with a colour scheme (docs): -- Pick a colour scheme. WezTerm ships with more than 1,000! -- Find them here: https://wezfurlong.org/wezterm/colorschemes/index.html config.color_scheme = 'Tokyo Night' Save, and you should immediately see it update. Thanks Wez! (if the hot config reload doesn’t work for whatever reason, you can manually reload it by pressing CMD + R). Many colours, all at once With over 1,000 colour choices to choose from, it’s tough to decide on your favourite. Why not outsource that work to your computer? Let’s explore the power of WezTerm’s dynamic config by randomly assigning a colour scheme for each new window you open: -- Creates a lua table containing the name of every color scheme WezTerm -- ships with. local scheme_names = {} for name, scheme in pairs(wezterm.color.get_builtin_schemes()) do table.insert(scheme_names, name) end -- When the config for a window is reloaded (i.e. when you save this file -- or open a new window)... wezterm.on('window-config-reloaded', function(window, pane) -- Don't proceed if the config has already been overriden, otherwise -- we'll enter an infinite loop of neverending colour scheme changes. -- If that sounds like your kinda thing, then remove this line ;) - but -- don't say you haven't been warned. if window:get_config_overrides() then return end -- Pick a random colour scheme name. local scheme = scheme_names[math.random(#scheme_names)] -- Assign it as an override for this window. window:set_config_overrides { color_scheme = scheme } -- And log it for good measure wezterm.log_info("Your colour scheme is now: " .. scheme) end) Open up a few windows (CMD + N on macOS) and each one will have a different colour scheme. A cornucopia of terminals, each more surprising than the last. We, my friends, are truly innovating now. But really, that was kind of a dumb idea meant to prove a point. Now that you’ve gotten a taste for dynamic config, you probably wanna remove those lines and stick to a colour scheme you do like. (You may find that after you remove that code and add your static color_scheme config back in, it doesn’t hot reload. That’s because our script set an override on the config specific to each window. To clear your overrides, you can go to your debug terminal and type window:set_config_overrides({}) - or you can just close and reopen your WezTerm window). Respecting the system’s appearance Light themes, dark themes… why not both? Let’s have the terminal’s colour scheme automatically change when the operating system’s appearance changes. While we’re at it, we’ll learn how to split up WezTerm config into different modules. Create a new file alongside wezterm.lua and call it appearance.lua. Add this to it: -- We almost always start by importing the wezterm module local wezterm = require 'wezterm' -- Define a lua table to hold _our_ module's functions local module = {} -- Returns a bool based on whether the host operating system's -- appearance is light or dark. function module.is_dark() -- wezterm.gui is not always available, depending on what -- environment wezterm is operating in. Just return true -- if it's not defined. if wezterm.gui then -- Some systems report appearance like "Dark High Contrast" -- so let's just look for the string "Dark" and if we find -- it assume appearance is dark. return wezterm.gui.get_appearance():find("Dark") end return true end return module Back in wezterm.lua: -- Import our new module (put this near the top of your wezterm.lua) local appearance = require 'appearance' -- Use it! if appearance.is_dark() then config.color_scheme = 'Tokyo Night' else config.color_scheme = 'Tokyo Night Day' end Toggle your system appearance between dark mode and light mode, and watch your theme change right before your eyes. Fonts Next up let’s look at fonts. WezTerm ships with the lovely JetBrains Mono, and Nerd Font Symbols (docs) so there’s nothing to complain about there. I do prefer Berkeley Mono at 13 points though, so: -- Choose your favourite font, make sure it's installed on your machine config.font = wezterm.font({ family = 'Berkeley Mono' }) -- And a font size that won't have you squinting config.font_size = 13 There’s good support for ligatures and other fancy font settings if you’re into that (docs), but I’m not so let’s move on. Window styling Let’s style our terminal’s window. This controls the chrome that appears around it, and can vary between operating systems. On macOS, I like the below: -- Slightly transparent and blurred background config.window_background_opacity = 0.9 config.macos_window_background_blur = 30 -- Removes the title bar, leaving only the tab bar. Keeps -- the ability to resize by dragging the window's edges. -- On macOS, 'RESIZE|INTEGRATED_BUTTONS' also looks nice if -- you want to keep the window controls visible and integrate -- them into the tab bar. config.window_decorations = 'RESIZE' -- Sets the font for the window frame (tab bar) config.window_frame = { -- Berkeley Mono for me again, though an idea could be to try a -- serif font here instead of monospace for a nicer look? font = wezterm.font({ family = 'Berkeley Mono', weight = 'Bold' }), font_size = 11, } Now, let’s do something a little kitsch. See that empty space to the right of our terminal’s tab bar? Let’s fill it with a powerline looking status bar. We’ll add an update-status callback: wezterm.on('update-status', function(window) -- Grab the utf8 character for the "powerline" left facing -- solid arrow. local SOLID_LEFT_ARROW = utf8.char(0xe0b2) -- Grab the current window's configuration, and from it the -- palette (this is the combination of your chosen colour scheme -- including any overrides). local color_scheme = window:effective_config().resolved_palette local bg = color_scheme.background local fg = color_scheme.foreground window:set_right_status(wezterm.format({ -- First, we draw the arrow... { Background = { Color = 'none' } }, { Foreground = { Color = bg } }, { Text = SOLID_LEFT_ARROW }, -- Then we draw our text { Background = { Color = bg } }, { Foreground = { Color = fg } }, { Text = ' ' .. wezterm.hostname() .. ' ' }, })) end) A few interesting things happening here: We just used WezTerm’s events API with wezterm.on. Events are things that happen to the terminal (e.g. window resize) that we can define callbacks for. The update-status event is emitted periodically when the terminal is ready to have its status updated. WezTerm manages this cleverly to ensure that only one such update can run at any given time, and if your code takes too long to execute, a timeout will be hit and your handler will be abandoned… protecting your terminal from bogging down. We’re grabbing the effective_config() of the window to get the “effective” configuration, which is the config with any overrides applied. From this we can get the resolved_palette, which is the currently active colour scheme. To see what this data looks like you can enter the debug overlay (CTRL + SHIFT + L) and execute window:effective_config().resolved_palette. We’re using the wezterm.format function (docs) to style our string with colours. Other ways you could format text include setting font weight, underlining text, and more. Finally, the wezterm.hostname() function (docs) gives us the hostname of the machine we’re running on. WezTerm ships with a bunch of useful functions for getting the state of your system, and also… we’re doing stuff in Lua - so you have full access to your file system, are able to make network requests, etc. Altogether this gives us a powerline…ish. It’s a bit sad with only one segment isn’t it? Don’t you worry, we’ll be adding more soon… Keys Here’s the part where we justify our mechanical keyboard purchases. Let’s set up some key assignments. During this section we’ll look at WezTerm’s deep key handling capabilities and ability to take action based on your input. By default, WezTerm defines some standard key assignments (docs). I leave them on because they’re very sensible, but if you wanna really wrest total control of your config, you can turn them off with config.disable_default_key_bindings = true. Our first key assignment will be a humble start for us macOS users… you might be used to Option + Left Arrow and Option + Right Arrow jumping between words on your terminal. That’s the default in iTerm 2 and Terminal.app, but not in WezTerm. However, we can map it! We do this by adding a keys table to our config: -- Table mapping keypresses to actions config.keys = { -- Sends ESC + b and ESC + f sequence, which is used -- for telling your shell to jump back/forward. { -- When the left arrow is pressed key = 'LeftArrow', -- With the "Option" key modifier held down mods = 'OPT', -- Perform this action, in this case - sending ESC + B -- to the terminal action = wezterm.action.SendString '\x1bb', }, { key = 'RightArrow', mods = 'OPT', action = wezterm.action.SendString '\x1bf', }, } By now you’ve probably figured out that you’re gonna be spending more time configuring WezTerm than doing actual work. There’s no shame in admitting this reality, so let’s encode it into our config. On macOS, the default shortcut for opening an application’s preferences is CMD + , - let’s make it s'''
