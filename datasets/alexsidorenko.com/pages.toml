title = "Does my React app render too often? | Alex Siodrenko"
description = "Worried some of your React components may be re-rendering too often?"
full_description = '''2 Apr 2022Does my React app render too often?Worried that some of your React components may be re-rendering too often? There are two simple ways to check this. The number of re-renders is not a performance metric. If you're concerned about potential performance issues, check out How Many Re-Renders are Too Many Quick visual overview The simplest way to check how many times React components render is by using the "Highlight updates when components render" option in React DevTools. However, this only provides a high-level overview of what's happening. It may not be efficient enough for cases with rapid updates. Detailed report for rapid updates For cases with rapid state updates, such as dragging or updates on mouse movement, the React Developer Tools Profiler is the best tool. It also provides additional information like the cause of re-renders, render time, and more. Record a profiling session In the flame chart, click on any particular component The sidebar will show every time this component was rendered and how much time every render took Alex Sidorenko@asidorenko_·FollowHTTPS localhost with Next.jsWatch on X12:23 PM · Aug 29, 20244.7KReplyCopy linkRead 99 replies'''
