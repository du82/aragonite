["https://alfa.com.tw/products/apcie-10ga"]
title = "APCIE-10GA – ALFA Network Inc."
description = """
APCIE-10GA is a 10G PCI Express network interface card based on Aquantia™ AQC107 chipset
The multi-gigabit APCIE-10GA network adapter supports auto-negotiation feature which allows optimal selection of the best possible speed (10/5/2.5/1 GbE or 100 MbE) over Cat5e, Cat6 or better cabling.
With PCI Express ×4 connector, this product has a great flexibility and is compatible with PCIe ×8 and ×16 interfaces.
Low profile design makes it possible to use the card in regular and small form factor PC. Software support for modern operating systems (Microsoft Windows and Linux) helps with seamless integration."""
