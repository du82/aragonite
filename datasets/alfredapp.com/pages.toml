["https://alfredapp.com/remote"]
title = "Alfred Remote for iOS - Command Centre for Your Mac"
description = "The ultimate iOS command centre for Alfred for Mac. Use Alfred Remote to send commands to your Mac from your iPhone or iPad."
full_description = "Alfred Remote The ultimate iOS command centre for Alfred. Your iPhone or iPad now becomes a perfect day-long companion to your Mac. Download on the App Store With a single touch on your iPhone or iPad, control the Alfred application on your Mac with Alfred Remote. Keep your frequently used actions at your fingertips; Whether at work or play, be more productive than ever! Use handy icons on your iOS device to control many Alfred actions on your Mac, replacing your hard-to-remember hotkeys and keywords. Launch apps, files and websites, control your music, keep useful text snippets at hand and boost your productivity by connecting Remote to your favourite Alfred workflows. How can I use Alfred Remote? Launch Apps & FilesIt's just one tap to launch the applications, files and folders you've defined on your Mac. Search the WebLaunch your favourite websites or custom searches, or show Alfred with a pre-filled custom search keyword. System CommandsCoveniently lock, restart, shut down, log out or sleep your Mac. Eject all devices, quit all apps and empty Trash. Control iTunesPlay, skip, rate your tracks, even start random albums through Alfred's iTunes Mini Player on your Mac. WorkflowsConnect Remote to your favourite Alfred workflows for almost limitless possibilities! Clipboard SnippetsPaste plain text snippets or your macOS clipboard's content to the frontmost application on your Mac. Feature requires the Alfred Powerpack. See what else Alfred Remote can do... Get Alfred Remote Download on the App Store To use Alfred Remote’s core actions, you’ll need Alfred 2 or higher on your Mac (available for free), and the ability to connect your Mac and iOS device to the same network. To control Alfred's Powerpack actions, and make the most of Remote, you'll also need a Powerpack license on your Mac. Alfred Download Alfred Alfred Powerpack Alfred Remote Workflows Change Log Resources Support Getting Started Tutorials Labs Community Our Blog Testimonials Forum Buy Goodies Company Twitter Facebook About Us Contact Us Newsletter Subscribe Sign up for updates, tips and sneak peeks. Privacy Policy."
