["https://alfredapp.com/help"]
title = "Alfred Help and Support"
description = "Get help and support with Alfred for Mac and Alfred Remote for iOS"
full_description = '''Alfred Help and Support This help and support site is here to help you get started with Alfred, as well as find answers to more advanced questions you might have. The sidebar gives you access to sections that mirror Alfred's preferences, as well as troubleshooting information and ways to contact us. Search Take a look at the cheatsheet for the default hotkeys, shortcuts and keywords. Getting Started with Alfred 5 You'll find some great Guides and Tutorials to get you started with Alfred's features. Take a look at what's new in Alfred 5 here. To take a look at Alfred's workflows, Powerpack users can take a look at the many Getting Started and Examples workflows, available under the [+] button in the bottom left of the Workflows preferences. We frequently post Tips & Tricks on the blog, which highlight new and interesting ways to make the most of Alfred. Where can I get help? Click the question mark icons throughout Alfred's preferences for help with a particular feature; Use the question mark shortcut in Alfred by prefixing your search term with a "?" Pop by the Alfred Forum for more specific questions or help with workflows; Ask us on Twitter @alfredapp and we'll be happy to help; Got a license-related or private question? If you can't find your answer here, contact us by email. Frequently Asked Questions What's new in Alfred 5? How can I migrate my preferences from an older version of Alfred? Alfred isn't finding the file or app I'm looking for How can I recover my Powerpack license? How do I create custom searches? How can I use Cmd + Space as my hotkey? How do I activate my Alfred Powerpack license? How can I sync my Alfred preferences? How can I do calculations in Alfred? What is the Powerpack? Why choose Alfred? Home Overview Getting Started Guides and Tutorials General Features Workflows Appearance Advanced Remote Powerpack Update Troubleshooting Recover License Report a Bug Contact Us Alfred Download Alfred Alfred Powerpack Alfred Remote Workflows Change Log Resources Support Getting Started Tutorials Labs Community Our Blog Testimonials Forum Buy Goodies Company Twitter Facebook About Us Contact Us Newsletter Subscribe Sign up for updates, tips and sneak peeks. Privacy Policy.'''
