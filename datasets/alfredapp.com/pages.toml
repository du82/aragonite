["https://alfredapp.com/help/contact"]
title = "Contact Us - Alfred Help and Support"
description = "How to get in touch with us"
full_description = "Contact Us Hello! We'd love to hear from you, so take a look at the different ways you can get in touch. Join the Alfred forum Not sure how to use a particular feature? Need help with a workflow? The Alfred forum is the fastest and best place to get help with Alfred. This is where our team will be able to answer your questions, and where our friendly community members share their own workflows, best productivity tips and ideas. Lost your license code? Take a look at how you can recover your license if you can't find your Powerpack license details. Reporting a bug? If you've found a bug, you'll find details on how to report it here. Press and corporate sales enquiries If you are a team member using a corporate license, please contact your in-house administrator as we are not able to issue corporate license details to individual team members. If you're a license administrator or are looking for more information about corporate licensing for your team, drop us a line on and we'll be happy to help. Find us online You can follow our Facebook page or say hi on Twitter @alfredapp, but please note that these are not official support channels. Still need to get in touch? It's quickest to look at the online help or ask your question on the Alfred forum, where our team and the community are actively participating and will be able to help you. For license-related questions, you can get in touch at . Powerpack users should use their registered email address to get a speedier response. If you have a private question that can't be posted on the forum, please email . Please note that technical questions, such as support with workflows and features, will be redirected to the forum. Keep in mind that we are based in the United Kingdom, so you'll receive a response during UK business hours within a few days. :)"
