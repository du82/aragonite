title = "Alfred 4 - Alfred Help and Support"
description = "Need to download Alfred 4? Grab it here."
full_description = "Alfred 4 Alfred 4 was superseded by Alfred 5 in July 2022. We now recommend using Alfred 5 to make the most of the latest features, but you can download Alfred 4 here. Alfred 4 requires macOS 10.11 El Capitan or higher, on either 64-bit Intel or Apple Silicon. Alfred 5 is recommended on macOS 13 Ventura and above. Discover what's new in Alfred 5! Upgrading to Alfred 5 To make your upgrade as smooth as possible, you'll see the Migration Assistant when launching Alfred 5 for the first time, which will help you migrate your Alfred preferences with you. We offer a discounted upgrade from older versions of Alfred, so you can enjoy the new features too! To upgrade, enter your existing Powerpack license details here: https://www.alfredapp.com/shop/upgrade/"
