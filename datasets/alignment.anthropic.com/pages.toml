["https://alignment.anthropic.com"]
title = "Alignment Science Blog"
description = """
We built a system of constitutional classifiers to prevent jailbreaks. A prototype version of our                system withstood over 3,000 hours of expert red teaming with no universal jailbreaks found. Newer                versions of our system also have minimal over-refusals and moderate run-time overhead."""
full_description = '''We built a system of constitutional classifiers to prevent jailbreaks. A prototype version of our system withstood over 3,000 hours of expert red teaming with no universal jailbreaks found. Newer versions of our system also have minimal over-refusals and moderate run-time overhead. We find that, when Claude models are presented with a harmful version of a task they can otherwise perform, they sometimes claim they lack the ability to perform the task, rather than simply refusing to do it. We discuss the implications of this behavior for AI safety. We introduce hierarchical summarization for monitoring and describe how we use it to protect Computer Use capabilities. Does training on documents which discuss (but do not demonstrate) reward hacks affect a model's propensity to reward hack? We present experiments where Claude often pretends to have different views during training, while actually maintaining its original preferences. We describe how to get started with experimenting with our demonstration of alignment faking, and present some ideas for future research. We describe how highly capable LLMs might disable their monitor, and evaluate the ability of current LLMs to do so in a toy setting. We're launching the Anthropic Fellows Program for AI Safety Research, a pilot initiative designed to accelerate AI safety research and foster research talent. We sketch out three hypothetical arguments one could make to rule out misalignment risks in powerful near-future models capable of sabotage. How well could AI models mislead us, or secretly sabotage tasks, if they were trying to? We describe a novel set of evaluations that test a model's capacity for sabotage. We show AI models can learn to hack their own reward system, by generalization from training in simpler settings. We study a long-context jailbreaking technique that is effective on most large language models, including those developed by Anthropic and many of our peers. We find that probing, a simple interpretability technique, can detect when backdoored "sleeper agent" models are about to behave dangerously, after they pretend to be safe in training.'''
year_published = 2025
