["https://alignment.anthropic.com/2025/summarization-for-monitoring/index.html"]
title = "Monitoring computer use via hierarchical summarization"
full_description = "Raj Agarwal, Nathan Bailey, Tim Belonax, Brian Clarke, Jasmine Deng, Kyla Guru, Evan Frondorf, Keegan Hankes, Jacob Klein, Lynx Lean, Kevin Lin, Linda Petrini, Madeleine Tucker, Ethan Perez, Mrinank Sharma This post introduces hierarchical summarization to monitor AI, then describes how we use it to protect computer use capabilities. We are sharing this as a promising technique to safeguard frontier AI, with the caveat that it is early research with room to improve and evolve. Anthropic’s October 2024 launch of computer use capabilities represented a shift from chatbots to AI capable of performing real-world tasks like process automation and market research. As with any advance in AI, introducing computer use required safety measures to mitigate known risks, such as spam and fraud. It also required careful consideration of the potential for emerging risks, which might only become apparent post-deployment. Large-scale computer usage presents an additional challenge: behaviors that appear benign in individual interactions may create harm in aggregate. For example, a user asking Claude to click a button on a website could be conducting UI testing – or running a click farm defrauding advertising systems. These two dynamics – the presence of “known unknowns,” and the possibility of harms arising from aggregate usage – presented serious challenges for standard approaches to AI monitoring, which typically train classifiers to identify individually harmful interactions. We addressed these issues by developing hierarchical summarization for monitoring. Our approach first summarizes individual interactions, then summarizes the summaries to provide a high-level overview of usage patterns. This improves triage and facilitates human review of potentially violative content, substantially increasing observability across both anticipated and emergent harms (importantly, all summaries are treated with the same access controls as the original text). In this post, we describe the method itself and how we employed it to monitor for abuse of our computer use capability."
