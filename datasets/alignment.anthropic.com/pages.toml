["https://alignment.anthropic.com/2024/safety-cases/index.html"]
title = "Three Sketches of ASL-4 Safety Case Components"
full_description = "The cleanest argument that current-day AI models will not cause a catastrophe is probably that they lack the capability to do so. However, as capabilities improve, we’ll need new tools for ensuring that AI models won’t cause a catastrophe even if we can’t rule out the capability. Anthropic’s Responsible Scaling Policy (RSP) categorizes levels of risk of AI systems into different AI Safety Levels (ASL), and each level has associated commitments aimed at mitigating the risks. Some of these commitments take the form of affirmative safety cases, which are structured arguments that the system is safe to deploy in a given environment. Unfortunately, it is not yet obvious how to make a safety case to rule out certain threats that arise once AIs have sophisticated strategic abilities. The goal of this post is to present some candidates for what such a safety case might look like. We look ahead at models at the ASL-4 capability level (explained below) and present some sketches of arguments that could be made as part of a larger safety case. These sketches are not official policies or predictions, but rather hypothetical examples that we put forth in order to evaluate their strengths and limitations and to get feedback about our thinking. Anthropic has not yet defined ASL-4, but has committed to do so by the time a model triggers ASL-3. However, the Appendix to our RSP speculates about three criteria that are likely to be adopted: All of these criteria suggest a high degree of agency and complex planning. For models with such agentic capabilities, one also needs to address the possibility that they would intentionally try to undermine the evaluations or procedures used to ensure safety. Following recent work by Benton et al. (2024), we group such concerns into the category of sabotage. Our sketches will be presented from the point of view of a hypothetical AI developer attempting to justify the deployment of an ASL-4 model. In this hypothetical scenario, we imagine that:"
