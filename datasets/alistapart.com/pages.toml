title = "Privacy Policy – A List Apart"
description = "This Privacy Policy describes how your personal information is collected, used, and shared when you visit or leave a comment at A List Apart (the “Site”). Personal Information We Collect We collect three basic types of information from you in conjunction with your use of the Site: (1) personal information, which is any information that…"
full_description = "Privacy Policy This Privacy Policy describes how your personal information is collected, used, and shared when you visit or leave a comment at A List Apart (the “Site”). Personal Information We Collect We collect three basic types of information from you in conjunction with your use of the Site: (1) personal information, which is any information that individually identifies you (e.g., your name, email address, telephone number, postal address, credit card information), (2) non-personal information, which is information that does not personally identify you but may include information about your interests, demographics (e.g., age, gender, occupation) and use of the Sites, and (3) device information, including information about your web browser, IP address, time zone, and some of the cookies that are installed on your device. We collect this information in the following ways: Information You Provide Directly To Us: We may ask you to provide your personal information, demographic information or information about your preferences or interests when you: Register to comment on the Site Sign up to receive email newsletters from us Participate in surveys or special promotions Participate on social media accounts involving our authors, articles, or brand Knowingly volunteer information on any other part of the Site (e.g., request for customer service, submit a job application) Information Collected Using Technology: When you visit the Site, we automatically collect certain information about your device, including information about your web browser, IP address, time zone, and some of the cookies that are installed on your device. Additionally, as you browse the Site, we collect information about the individual web pages or products that you view, what websites or search terms referred you to the Site, and information about how you interact with the Site. We refer to this automatically-collected information as “Device Information.” We collect Device Information using the following technologies: “Cookies” are data files that are placed on your device or computer and often include an anonymous unique identifier. For more information about cookies, and how to disable cookies, visit allaboutcookies.org. “Log files” track actions occurring on the Site, and collect data including your IP address, browser type, Internet service provider, referring/exit pages, and date/time stamps. “Web beacons”, “tags”, and “pixels” are electronic files used to record information about how you browse the Site. When we talk about “Personal Information” in this Privacy Policy, we are talking both about Device Information and Order Information. How Do We Use Your Personal Information? We use the Device Information that we collect to help us screen for potential risk and fraud (in particular, your IP address), and more generally to improve and optimize our Site (for example, by generating analytics about how our customers browse and interact with the Site, and to assess the success of our marketing and advertising campaigns). Your Personal Information We use Google Analytics to help us understand how our customers use the Site—you can read more about how Google uses your Personal Information here: google.com/intl/en/policies/privacy/. You can also opt-out of Google Analytics here: tools.google.com/dlpage/gaoptout We may also share your Personal Information to comply with applicable laws and regulations, to respond to a subpoena, search warrant or other lawful request for information we receive, or to otherwise protect our rights. Additionally, you can opt out of some of these services by visiting the Digital Advertising Alliance’s opt-out portal at: optout.aboutads.info. Do Not Track Please note that we do not alter our Site’s data collection and use practices when we see a Do Not Track signal from your browser. Your Rights If you are a European resident, you have the right to access personal information we hold about you and to ask that your personal information be corrected, updated, or deleted. If you would like to exercise this right, please contact us through the contact information below. Additionally, if you are a European resident we note that we are processing your information in order to fulfill contracts we might have with you (for example if you make an order through the Site), or otherwise to pursue our legitimate business interests listed above. Additionally, please note that your information will be transferred outside of Europe, including to Canada and the United States. Data Retention When you leave a comment on the Site, or sign up to receive our email newsletter, we will maintain your Personal Information for our records unless and until you ask us to delete this information. Changes We may update this privacy policy from time to time in order to reflect, for example, changes to our practices or for other operational, legal or regulatory reasons. Contact us If you have questions about this privacy policy, please contact us."
year_published = 2018
