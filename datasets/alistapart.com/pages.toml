["https://alistapart.com/article/how-to-sell-ux-research"]
title = "How to Sell UX Research with Two Simple Questions – A List Apart"
description = "It’s one reason why so many UX designers are frustrated in their job and why many projects fail. And it’s also why we often can’t sell research: every decision-maker is confident in their own mental picture. In this article, Sophia Prater shows you how to collaboratively expose misalignment and gaps in your team’s shared understanding…"
full_description = "Illustration by Tom Shannon How to Sell UX Research with Two Simple Questions by Sophia V. PraterOctober 21, 2021October 21, 2021 Published in User Experience, User Research Do you find yourself designing screens with only a vague idea of how the things on the screen relate to the things elsewhere in the system? Do you leave stakeholder meetings with unclear directives that often seem to contradict previous conversations? You know a better understanding of user needs would help the team get clear on what you are actually trying to accomplish, but time and budget for research is tight. When it comes to asking for more direct contact with your users, you might feel like poor Oliver Twist, timidly asking, “Please, sir, I want some more.” Article Continues Below Article Continues Below Share this:#section1Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window) Become a patron The open-source editor for front-end dev teams. Ditch the text editor and get real-time output and cross-team collaboration. A Book Apart: Brief books for people who make websites. Here’s the trick. You need to get stakeholders themselves to identify high-risk assumptions and hidden complexity, so that they become just as motivated as you to get answers from users. Basically, you need to make them think it’s their idea. In this article, I’ll show you how to collaboratively expose misalignment and gaps in the team’s shared understanding by bringing the team together around two simple questions: What are the objects?What are the relationships between those objects? A gauntlet between research and screen design#section2 These two questions align to the first two steps of the ORCA process, which might become your new best friend when it comes to reducing guesswork. Wait, what’s ORCA?! Glad you asked. ORCA stands for Objects, Relationships, CTAs, and Attributes, and it outlines a process for creating solid object-oriented user experiences. Object-oriented UX is my design philosophy. ORCA is an iterative methodology for synthesizing user research into an elegant structural foundation to support screen and interaction design. OOUX and ORCA have made my work as a UX designer more collaborative, effective, efficient, fun, strategic, and meaningful. The ORCA process has four iterative rounds and a whopping fifteen steps. In each round we get more clarity on our Os, Rs, Cs, and As. The four rounds and fifteen steps of the ORCA process. In the OOUX world, we love color-coding. Blue is reserved for objects! (Yellow is for core content, pink is for metadata, and green is for calls-to-action. Learn more about the color-coded object map and connecting CTAs to objects.) I sometimes say that ORCA is a “garbage in, garbage out” process. To ensure that the testable prototype produced in the final round actually tests well, the process needs to be fed by good research. But if you don’t have a ton of research, the beginning of the ORCA process serves another purpose: it helps you sell the need for research. ORCA strengthens the weak spot between research and design by helping distill research into solid information architecture—scaffolding for the screen design and interaction design to hang on. In other words, the ORCA process serves as a gauntlet between research and design. With good research, you can gracefully ride the killer whale from research into design. But without good research, the process effectively spits you back into research and with a cache of specific open questions. Getting in the same curiosity-boat#section3 What gets us into trouble is not what we don’t know. It’s what we know for sure that just ain’t so.Mark Twain The first two steps of the ORCA process—Object Discovery and Relationship Discovery—shine a spotlight on the dark, dusty corners of your team’s misalignments and any inherent complexity that’s been swept under the rug. It begins to expose what this classic comic so beautifully illustrates: The original “Tree Swing Project Management” cartoon dates back to the 1960s or 1970s and has no artist attribution we could find. This is one reason why so many UX designers are frustrated in their job and why many projects fail. And this is also why we often can’t sell research: every decision-maker is confident in their own mental picture. Once we expose hidden fuzzy patches in each picture and the differences between them all, the case for user research makes itself. But how we do this is important. However much we might want to, we can’t just tell everyone, “YOU ARE WRONG!” Instead, we need to facilitate and guide our team members to self-identify holes in their picture. When stakeholders take ownership of assumptions and gaps in understanding, BAM! Suddenly, UX research is not such a hard sell, and everyone is aboard the same curiosity-boat. Say your users are doctors. And you have no idea how doctors use the system you are tasked with redesigning. You might try to sell research by honestly saying: “We need to understand doctors better! What are their pain points? How do they use the current app?” But here’s the problem with that. Those questions are vague, and the answers to them don’t feel acutely actionable. Instead, you want your stakeholders themselves to ask super-specific questions. This is more like the kind of conversation you need to facilitate. Let’s listen in: “Wait a sec, how often do doctors share patients? Does a patient in this system have primary and secondary doctors?” “Can a patient even have more than one primary doctor?” “Is it a ‘primary doctor’ or just a ‘primary caregiver’… Can’t that role be a nurse practitioner?” “No, caregivers are something else… That’s the patient’s family contacts, right?” “So are caregivers in scope for this redesign?” “Yeah, because if a caregiver is present at an appointment, the doctor needs to note that. Like, tag the caregiver on the note… Or on the appointment?” Now we are getting somewhere. Do you see how powerful it can be getting stakeholders to debate these questions themselves? The diabolical goal here is to shake their confidence—gently and diplomatically. When these kinds of questions bubble up collaboratively and come directly from the mouths of your stakeholders and decision-makers, suddenly, designing screens without knowing the answers to these questions seems incredibly risky, even silly. If we create software without understanding the real-world information environment of our users, we will likely create software that does not align to the real-world information environment of our users. And this will, hands down, result in a more confusing, more complex, and less intuitive software product. The two questions#section4 But how do we get to these kinds of meaty questions diplomatically, efficiently, collaboratively, and reliably? We can do this by starting with those two big questions that align to the first two steps of the ORCA process: What are the objects?What are the relationships between those objects? In practice, getting to these answers is easier said than done. I’m going to show you how these two simple questions can provide the outline for an Object Definition Workshop. During this workshop, these “seed” questions will blossom into dozens of specific questions and shine a spotlight on the need for more user research. Prep work: Noun foraging#section5 In the next section, I’ll show you how to run an Object Definition Workshop with your stakeholders (and entire cross-functional team, hopefully). But first, you need to do some prep work. Basically, look for nouns that are particular to the business or industry of your project, and do it across at least a few sources. I call this noun foraging. Here are just a few great noun foraging sources: the product’s marketing sitethe product’s competitors’ marketing sites (competitive analysis, anyone?)the existing product (look at labels!)user interview transcriptsnotes from stakeholder interviews or vision docs from stakeholders Put your detective hat on, my dear Watson. Get resourceful and leverage what you have. If all you have is a marketing website, some screenshots of the existing legacy system, and access to customer service chat logs, then use those. As you peruse these sources, watch for the nouns that are used over and over again, and start listing them (preferably on blue sticky notes if you’ll be creating an object map later!). You’ll want to focus on nouns that might represent objects in your system. If you are having trouble determining if a noun might be object-worthy, remember the acronym SIP and test for: StructureInstancesPurpose Think of a library app, for example. Is “book” an object? Structure: can you think of a few attributes for this potential object? Title, author, publish date… Yep, it has structure. Check! Instance: what are some examples of this potential “book” object? Can you name a few? The Alchemist, Ready Player One, Everybody Poops… OK, check! Purpose: why is this object important to the users and business? Well, “book” is what our library client is providing to people and books are why people come to the library… Check, check, check! SIP: Structure, Instances, and Purpose! (Here’s a flowchart where I elaborate even more on SIP.) As you are noun foraging, focus on capturing the nouns that have SIP. Avoid capturing components like dropdowns, checkboxes, and calendar pickers—your UX system is not your design system! Components are just the packaging for objects—they are a means to an end. No one is coming to your digital place to play with your dropdown! They are coming for the VALUABLE THINGS and what they can do with them. Those things, or objects, are what we are trying to identify. Let’s say we work for a startup disrupting the email experience. This is how I’d start my noun foraging. First I’d look at my own email client, which happens to be Gmail. I’d then look at Outlook and the new HEY email. I’d look at Yahoo, Hotmail…I’d even look at Slack and Basecamp and other so-called “email replacers.” I’d read some articles, reviews, and forum threads where people are complaining about email. While doing all this, I would look for and write down the nouns. (Before moving on, feel free to go noun foraging for this hypothetical product, too, and then scroll down to see how much our lists match up. Just don’t get lost in your own emails! Come back to me!) Drumroll, please… Here are a few nouns I came up with during my noun foraging: email messagethreadcontactclientrule/automationemail address that is not a contact?contact groupsattachmentGoogle doc file / other integrated filenewsletter? (HEY treats this differently)saved responses and templates In the OOUX world, we love color-coding. Blue is reserved for objects! (Yellow is for core content, pink is for metadata, and green is for calls-to-action. Learn more about the color coded object map and connecting CTAs to objects.) Scan your list of nouns and pick out words that you are completely clueless about. In our email example, it might be client or automation. Do as much homework as you can before your session with stakeholders: google what’s googleable. But other terms might be so specific to the product or domain that you need to have a conversation about them. Aside: here are some real nouns foraged during my own past project work that I needed my stakeholders to help me understand: Record LocatorIncentive HomeAugmented Line ItemCurriculum-Based Measurement Probe This is really all you need to prepare for the workshop session: a list of nouns that represent potential objects and a short list of nouns that need to be defined further. Facilitate an Object Definition Workshop#section6 You could actually start your workshop with noun foraging—this activity can be done collaboratively. If you have five people in the room, pick five sources, assign one to every person, and give everyone ten minutes to find the objects within their source. When the time’s up, come together and find the overlap. Affinity mapping is your friend here! If your team is short on time and might be reluctant to do this kind of grunt work (which is usually the case) do your own noun foraging beforehand, but be prepared to show your work. I love presenting screenshots of documents and screens with all the nouns already highlighted. Bring the artifacts of your process, and start the workshop with a five-minute overview of your noun foraging journey. HOT TIP: before jumping into the workshop, frame the conversation as a requirements-gathering session to help you better understand the scope and details of the system. You don’t need to let them know that you’re looking for gaps in the team’s understanding so that you can prove the need for more user research—that will be our little secret. Instead, go into the session optimistically, as if your knowledgeable stakeholders and PMs and biz folks already have all the answers. Then, let the question whack-a-mole commence. 1. What is this thing?#section7 Want to have some real fun? At the beginning of your session, ask stakeholders to privately write definitions for the handful of obscure nouns you might be uncertain about. Then, have everyone show their cards at the same time and see if you get different definitions (you will). This is gold for exposing misalignment and starting great conversations. As your discussion unfolds, capture any agreed-upon definitions. And when uncertainty emerges, quietly (but visibly) start an “open questions” parking lot. 😉 After definitions solidify, here’s a great follow-up: 2. Do our users know what these things are? What do users call this thing?#section8 Stakeholder 1: They probably call email clients “apps.” But I’m not sure. Stakeholder 2: Automations are often called “workflows,” I think. Or, maybe users think workflows are something different. If a more user-friendly term emerges, ask the group if they can agree to use only that term moving forward. This way, the team can better align to the users’ language and mindset. OK, moving on. If you have two or more objects that seem to overlap in purpose, ask one of these questions: 3. Are these the same thing? Or are these different? If they are not the same, how are they different?#section9 You: Is a saved response the same as a template? Stakeholder 1: Yes! Definitely. Stakeholder 2: I don’t think so… A saved response is text with links and variables, but a template is more about the look and feel, like default fonts, colors, and placeholder images. Continue to build out your growing glossary of objects. And continue to capture areas of uncertainty in your “open questions” parking lot. If you successfully determine that two similar things are, in fact, different, here’s your next follow-up question: 4. What’s the relationship between these objects?#section10 You: Are saved responses and templates related in any way? Stakeholder 3: Yeah, a template can be applied to a saved response. You, always with the follow-ups: W"
