["https://alistapart.com/author/agustafson"]
title = "Aaron Gustafson – A List Apart"
description = 'As would be expected from a former manager of the <a href="http://webstandards.org/">Web Standards Project</a>, Aaron Gustafson has been working to make the web more equitable for nearly three decades now. He is a Principal Accessibility Innovation Strategist at <a href="http://www.microsoft.com/">Microsoft</a>. In a prior role, he worked on the Edge browser team with a focus on Progressive Web Apps and developer-focused user experiences. He penned the seminal book on progressive enhancement, <a href="https://adaptivewebdesign.info/"><cite>Adaptive Web Design</cite></a>, and has been known to have some opinions, many of which he shares at <a href="https://www.aaron-gustafson.com">aaron-gustafson.com</a>.'
full_description = '''Adaptive Web Design, Second Edition by Aaron Gustafson Building an elegant, functional website requires more than just knowing how to code. In Adaptive Web Design, Second Edition, you’ll learn how to use progressive enhancement to build websites that won’t break, work anywhere, are accessible by anyone—on any device, and are designed to work well into the future. ➝ Buy now Opportunities for AI in Accessibility February 07, 2024 Microsoft's Accessibility Innovation Strategist discusses AI's potential for accessibility, emphasizing the need for responsible use and diverse teams to mitigate harm and promote inclusion for people with disabilities. Request with Intent: Caching Strategies in the Age of PWAs November 21, 2019 Caching media files, especially images, seems like an obvious way to improve performance, but should we? To provide a more performant UX without abusing users’s network connections or hard drives, Aaron Gustafson puts a spin on classic best practices, experiments with media caching strategies, and shares smart Cache API tricks. From URL to Interactive October 25, 2018 When we think about it, our whole industry depends on our faith in a handful of "black boxes" few of us fully understand: browsers. We hand over our HTML, CSS, JavaScript, cross our fingers, and hope they render the experience we have in our heads. But knowing how they work can really get you out of a jam when things go wrong. That's why we've assembled a handful of incredibly knowledgeable authors to take us under the hood in this four-part series. Join us on this trip across the web, into the often foggy valley between code and experience. Conversational Semantics August 30, 2018 Semantic markup has always mattered, but with voice interfaces rapidly becoming the norm, it now matters more than ever. Aaron Gustafson shows us how simple HTML tags can have a huge impact with voice interfaces. The Illusion of Control in Web Design April 26, 2018 We think of our job as controlling the user’s experience. But the reality is, we control far less than we imagine. And that’s by design: it’s how the web, and the networks that serve it, are supposed to work. ALA’s Aaron Gustafson shows the many ways our medium conspires to break our carefully crafted experiences, and shares solid advice on what we can do about it.'''
year_published = 2024
