full_description = "New! May 30, 2024June 27, 2024 User Research Is Storytelling by Gerry Duffy · 71 Comments on User Research Is Storytelling How can user experience researchers make sure their voices are heard and their work is valued? By telling a good story. Gerry Duffy guides us through the thickets of research as storytelling by showing us how to recast an oft-maligned discipline as an opportunity to craft a convincing and exciting narrative. New! April 16, 2024April 17, 2024 To Ignite a Personalization Practice, Run this Prepersonalization Workshop by Colin Eagan, Jeffrey MacIntyre · 55 Comments on To Ignite a Personalization Practice, Run this Prepersonalization Workshop Looking to tailor your product to individual users’ needs? In this article, Colin Eagan and Jeffrey MacIntyre walk you through their approach to aligning different stakeholders toward the common goal of personalized user experiences. The Wax and the Wane of the Web by Ste Grainer Ste Grainer takes a brief look at the history of the web, where we are now, and how we can shape its future. State of the WebFebruary 29, 2024February 29, 2024 Opportunities for AI in Accessibility by Aaron Gustafson In this article, Aaron Gustafson muses on some of the many ways we can—and should—harness the capabilities of AI to create a more accessible world. AccessibilityFebruary 07, 2024February 10, 2024 I am a creative. by Jeffrey Zeldman A List Apart founder and web design OG Zeldman ponders the moments of inspiration, the hours of plodding, and the ultimate mystery at the heart of a creative career. CareerJanuary 29, 2024February 01, 2024 Humility: An Essential Value by Justin Dauer In this excerpt from In Fulfillment: The Designer’s Journey, Justin Dauer ruminates on the past and the importance of keeping an open mind. DesignJune 22, 2023June 21, 2023 Personalization Pyramid: A Framework for Designing with User Data by Colin Eagan, Jeffrey MacIntyre Colin Eagan and Jeffrey MacIntyre offer a “ground-up” appr