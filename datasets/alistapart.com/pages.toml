full_description = "About For People Who Make Websites A List Apart (ISSN: 1534-0295) explores the design, development, and meaning of web content, with a special focus on web standards and best practices. We began as a mailing list in 1997 and launched this website in 1998. You can visit the ghosts of ALA past by reading our history. See our Masthead to meet the current crew. Our content and code Our content is protected by copyright shared jointly by the magazine and its writers, but code used in articles is freely available to all. We also welcome translation. See Permissions & Copyright for details. Write for us Yes, you. We welcome thoughtful submissions from all kinds of web professionals: designers, developers, architects, strategists, writers, project managers, and assorted specialists. As long as you’ve got a big idea and an interesting voice, we want to hear from you. Visit the Write for Us page for guidelines. Talk to us We love to hear your opinions, but we can’t answer all your email. Use the comments section on each article, or tweet us @alistapart to provide feedback on our content. Have another sort of request? See our Contact page."
