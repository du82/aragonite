full_description = "From: Inside StoryWill the US withdraw its support for Ukraine?A public meeting between Presidents Donald Trump and Volodymyr Zelenskyy descended into a spat.Published On 1 Mar 20251 Mar 2025Video Duration 28 minutes 45 seconds play-arrow28:45 Ukrainians fear losing US support as Trump-Zelenskyy clash shocks worldA dramatic spat between the US and Ukrainian leaders raises concerns about continued US aid for Ukraine’s war effort.Published On 1 Mar 20251 Mar 2025 EXPLAINERWhy have Costa Rica and Panama agreed to take immigrants deported by Trump?Trump’s tariff threats and political pressures are believed to be reasons third countries agreed to receive deportees.Published On 1 Mar 20251 Mar 2025 Trump officials slam Zelenskyy, as Western leaders rally around UkraineUnited States officials have called for an apology from Zelenskyy, as several Western nations condemn Trump’s conduct.Published On 1 Mar 20251 Mar 2025 From: NewsFeedTrump cuts talks short with Zelenskyy after heated meetingUS President Donald Trump cuts talks with Ukrainian President Volodymyr Zelenskyy short after a contentious meeting.Published On 28 Feb 202528 Feb 2025Video Duration 01 minutes 17 seconds play-arrow01:17 World reacts after Donald Trump, JD Vance berate Ukraine’s ZelenskyyTrump wrote on social media that Volodymyr Zelenskyy was not ‘ready for peace if America is involved’.Published On 28 Feb 202528 Feb 2025 Key takeaways from the fiery White House meeting with Trump and ZelenskyyA news conference in the Oval Office has erupted into naked tension, as Trump yells at Zelenskyy to be ‘thankful’ to US.Published On 28 Feb 202528 Feb 2025 From: NewsFeedTrump and Zelenskyy in heated Oval Office discussionUS President Donald Trump and Ukrainian President Volodymyr Zelenskyy get in a heated argument.Published On 28 Feb 202528 Feb 2025Video Duration 01 minutes 27 seconds play-arrow01:27 EXPLAINERWhy has Mexico handed over drug cartel leaders to US? Who are they?Mexico’s largest handover in years comes days before Trump imposes tariffs on Mexican goods.Published On 28 Feb 202528 Feb 2025"
