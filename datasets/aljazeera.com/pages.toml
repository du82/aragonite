title = "World reacts after Donald Trump, JD Vance berate Ukraine’s Zelenskyy | Donald Trump News | Al Jazeera"
description = "Trump wrote on social media that Volodymyr Zelenskyy was not ‘ready for peace if America is involved’."
full_description = "News|Donald TrumpWorld reacts after Donald Trump, JD Vance berate Ukraine’s ZelenskyyTrump wrote on social media that Volodymyr Zelenskyy was not ‘ready for peace if America is involved’.US President Donald Trump meets with Ukrainian President Volodymyr Zelenskyy at the White House in Washington, DC, US [Brian Snyder/Reuters]Published On 28 Feb 202528 Feb 2025|Updated: 10 hours agoUkrainian President Volodymyr Zelenskyy’s meeting with United States President Donald Trump in Washington, DC, ended abruptly after the two leaders clashed in a heated exchange over Russia’s war against Kyiv. At the Oval Office on Friday, Trump and his vice president, JD Vance, berated Zelenskyy for being “disrespectful” and not thanking the US enough for its support.Recommended Stories list of 3 itemslist 1 of 3On Gaza, Trump proposing “three blunt war crimes”list 2 of 3Volodymyr Zelenskyy: A ‘dictator’, or a ‘Ukrainian Churchill’?list 3 of 3Trump and Zelenskyy in heated Oval Office discussionend of list “You’re gambling with the lives of millions of people,” Trump shouted. “You’re gambling with World War III, and what you’re doing is very disrespectful to the country – this country.” Zelenskyy, who was meeting with Trump to convince him not to side with Russian President Vladimir Putin and discuss possible US security guarantees for Ukraine in the event of a ceasefire, told Trump that there would be “no compromises with a killer on our territory”. As the Ukrainian leader left the White House shortly after the verbal match, Trump took to the Truth Social social media app, which he owns, to write that Zelenskyy was not “ready for peace if America is involved”. Advertisement “He disrespected the United States of America in its cherished Oval Office. He can come back when he is ready for peace,” he added. Zelenskyy posted on X after the meeting to thank the US for its support. “Thank you POTUS, Congress, and the American people. Ukraine needs just and lasting peace, and we are working exactly for that,” he wrote. US President Donald Trump meets with Ukrainian President Volodymyr Zelenskyy at the White House [Brian Snyder/Reuters] Here is how some world leaders reacted to the heated dispute: United States Republican Senator Lindsey Graham urged Zelenskyy to prioritise a rare earth minerals deal over security guarantees or a ceasefire with Russia. “I talked to Zelenskyy this morning – don’t take the bait. President Trump was in a very good mood last night,” Graham said outside the White House. A vocal Ukraine supporter and Trump ally, Graham called the meeting an “utter disaster” and questioned future US dealings with Zelenskyy. “I don’t know if we can ever do business with Zelenskyy again,” he said, adding that the Ukrainian president should apologise to Trump or for Ukraine to “get someone new” to lead the country. Top Democratic leaders condemned Trump’s handling of the talks. Senate Minority Leader Chuck Schumer accused him of doing Russian President Vladimir Putin’s “dirty work”, while House Minority Leader Hakeem Jeffries called the exchange “appalling”. “The United States must not reward Russian aggression,” Jeffries said. “We should stand with Ukraine until victory is won.” Advertisement Russia Dmitry Medvedev, the deputy head of the Russian Security Council, wrote on Telegram that Trump had given Ukraine a “strong slap on the wrist”. “For the first time, Trump told the cocaine clown the truth to his face: The Kyiv regime is playing with the Third World War. And the ungrateful pig received a strong slap on the wrist from the owners of the pigsty. This is useful. But it’s not enough – we must stop military aid to the Nazi machine,” said Medvedev, who is also a former Russian president. Maria Zakharova, the spokesperson for Russia’s Ministry of Foreign Affairs, also praised Trump for showing “restraint” with the Ukrainian leader, whom she called a “scumbag”. “I think Zelenskyy’s biggest lie of all his lies was his assertion in the White House that the Kyiv regime in 2022 was alone, without support,” she wrote on Telegram. “How Trump and Vance held back from hitting that scumbag is a miracle of restraint.” European Union European Commission President Ursula von der Leyen, European Council President Antonio Costa and European Parliament President Roberta Metsola all told Zelenskyy in a joint post: “Your dignity honors the bravery of the Ukrainian people. Be strong, be brave, be fearless. “We will continue working with you for a just and lasting peace.” The bloc’s foreign policy chief Kaja Kallas, meanwhile, said it was clear that “the free world needs a new leader.” “Ukraine is Europe! We stand by Ukraine,” she said in a social media post. “We will step up our support to Ukraine so that they can continue to fight back [against] the aggressor,” she added. “Today, it became clear that the free world needs a new leader. It’s up to us, Europeans, to take this challenge.” Advertisement France French President Emmanuel Macron told reporters in Portugal that Russia is the “aggressor” in the Ukraine war and Ukrainians are the “aggressed people”. “I think we were all right to help Ukraine and sanction Russia three years ago, and to continue to do so. We, that is the United States of America, the Europeans, the Canadians, the Japanese and many others,” Macron said. “And we must thank all those who have helped and respect those who have been fighting since the beginning. Because they are fighting for their dignity, their independence, their children and the security of Europe. These are simple things, but they’re good to remember at times like these, that’s all,” he added. Germany Outgoing Chancellor Olaf Scholz said, “Ukraine can rely on Germany and on Europe.” “No one wants peace more than the citizens of Ukraine! That is why we are jointly seeking the path to a lasting and just peace,” he said. Friedrich Merz, expected to be Germany’s next chancellor, addressed Zelenskyy on X, stating: “We stand with Ukraine in good and in testing times. We must never confuse aggressor and victim in this terrible war.” Johann Wadephul, a top legislator from Merz’s party, also backed Ukraine. “The scenes from the White House are shocking,” he wrote on X. “How can you stab the president of an invaded country in the back like this? Free Europe will not betray Ukraine!” United Kingdom Prime Minister Keir Starmer spoke with both Trump and Zelenskyy following their public fallout. According to a Downing Street statement, Starmer said he is looking forward to “hosting international leaders on Sunday, including President Zelenskyy”. Advertisement “He retains his unwavering support for Ukraine and is playing his part to find a path forward to a lasting peace, based on sovereignty and security for Ukraine,” the statement said. Ireland Prime Minister Micheal Martin said Ireland stands with Ukraine, recalling his visits to the country: “When I met with President Zelenskyy yesterday, I reiterated our full support for a just, durable and sustained peace.” Foreign Minister Simon Harris stressed that Ukraine is not responsible for the war, stating: “Ukraine is not to blame for this war brought about by Russia’s illegal invasion. We stand with Ukraine.” NATO NATO chief Mark Rutte told the BBC that the Ukrainian president must “find a way” to restore his relationship with Trump. Rutte said he talked to Zelenskyy and told him: “You have to find a way, dear Volodymyr, to restore your relationship with Donald Trump and the American administration.” Canada Prime Minister Justin Trudeau said Canada will continue to stand with Ukrainians in achieving a just and lasting peace. “Russia illegally and unjustifiably invaded Ukraine. For three years now, Ukrainians have fought with courage and resilience. Their fight for democracy, freedom, and sovereignty is a fight that matters to us all,” he wrote on X. Foreign Minister Melanie Joly encouraged NATO allies to band together “amidst all this unpredictability and sometimes even chaos”. “We believe in supporting Ukraine. Our position has not changed. We think Ukrainians are fighting for their own freedoms, but they’re also fighting for ours,” she said. Advertisement Norway Prime Minister Jonas Gahr Stoere condemned the events in the White House as “serious and disheartening”. “Ukraine still needs the US’s support, and Ukraine’s security and future are also important to the US and to Europe. “President Volodymyr Zelenskyy has strong support in Ukraine, broad support in Europe, and he has led his people through a very demanding and brutal time, under attack from Russia. That Trump accuses Zelenskyy of gambling with World War III is deeply unreasonable and a statement I distance myself from,” he said in a statement to Norwegian TV2. Denmark Foreign Minister Lars Lokke Rasmussen described recent events as a setback for Kyiv. Writing on Facebook, he said, “It’s a punch in the gut for Ukraine. … There must be room for robust conversations – even between friends. But when it happens in front of rolling cameras like that, there is only one winner. And he sits in the Kremlin.” Sweden Prime Minister Ulf Kristersson said on X: “Sweden stands with Ukraine. You are not only fighting for your freedom but also for all of Europe’s. Slava Ukraini!” Finland Prime Minister Petteri Orpo reaffirmed Finland’s commitment to Ukraine, pledging “our unwavering support and work towards a just and lasting peace”. Netherlands Dutch Foreign Minister Caspar Veldkamp reiterated his backing for Ukraine, saying he had spoken with his Ukrainian counterpart Andrii Sybiha. “I reiterated my full support for Ukraine: whatever it takes, for as long as it takes,” he said. Poland Prime Minister Donald Tusk wrote on X: “Dear Ukrainian friends, you are not alone.” Advertisement Spain Prime Minister Pedro Sanchez also expressed solidarity with Ukraine. “Ukraine, Spain stands with you,” he wrote on X. Portugal Prime Minister Luis Montenegro assured: “Ukraine can always count on Portugal.” Italy Prime Minister Giorgia Meloni proposed a meeting between the US and European leaders to reaffirm their bonds. “A summit without delay is needed between the United States, European states and their allies to talk frankly about how we intend to tackle today’s major challenges, starting with Ukraine, which together we have defended in recent years,” Meloni, a right-wing leader, said in a statement. Her deputy meanwhile expressed support for Trump. “Aim for PEACE, stop this war! Come on @realDonaldTrump”, Matteo Salvini wrote on X. Hungary Prime Minister Viktor Orban was among the few voices in Europe that backed Trump. “Strong men make peace, weak men make war. Today President @realDonaldTrump stood bravely for peace,” he wrote on X. “Even if it was difficult for many to digest. Thank you, Mr. President!” Vice President JD Vance, right, speaks with Ukrainian President Volodymyr Zelenskyy, left, as President Donald Trump listens in the Oval Office [Mystyslav Chernov/AP Photo] He later called on the EU to open direct talks with Moscow to end the Ukraine war and signalled it would oppose a bloc-wide agreement on the conflict at an upcoming summit, according to a letter obtained by AFP. “I am convinced that the European Union – following the example of the United States – should enter into direct discussions with Russia on a ceasefire and a sustainable peace in Ukraine,” Orban wrote to Antonio Costa, who heads the Council of the EU’s 27 member states. Advertisement Estonia Foreign Minister Margus Tsahkna wrote on X that the only obstacle to peace was President Putin’s “decision to continue his war of aggression”. “If Russia stops fighting, there will be no war. If Ukraine stops fighting, there will be no Ukraine. Estonia’s support to Ukraine remains unwavering. Time for Europe to step up,” Tsahkna wrote. Lithuania President Gitanas Nauseda expressed solidarity, writing: “Ukraine, you’ll never walk alone.” Latvia Prime Minister Evika Silina reaffirmed her country’s support, saying Latvia stands with Ukraine. Czech Republic President Petr Pavel wrote on X: “We stand with Ukraine more than ever. Time for Europe to step up its efforts.” Prime Minister Petr Fiala declared: “We stand with Ukraine and on the side of the free world.” Slovenia President Natasa Pirc Musar condemned the events in the Oval Office, warning they undermined international law and diplomacy. “We stand firmly in support of Ukraine’s sovereignty. We repeat, Russia is the aggressor. It is time for Europe to take the lead on the path to peace in Ukraine,” wrote Musar on X. Moldova President Maia Sandu wrote on X: “The truth is simple. Russia invaded Ukraine. Russia is the aggressor. Ukraine defends its freedom – and ours. We stand with Ukraine.” Ukrainian President Volodymyr Zelenskyy departs after a news conference with US President Donald Trump was cancelled [Brian Snyder/Reuters] Luxembourg Prime Minister Luc Frieden assured Ukraine of his country’s support, saying: “You are fighting for your freedom and a rules-based international order.” Advertisement Croatia Prime Minister Andrej Plenkovic said Croatia understands Ukraine’s struggle, noting: “Croatia knows from its own experience that only a just peace can last.” He added that Ukraine needs a peace that guarantees “sovereignty, territorial integrity and a secure Europe”. Romania Romania’s interim President Ilie Bolojan stressed Ukraine’s importance to European security, stating: “The security of Ukraine is crucial for the security of Europe. We all need to stand together to fight for our values, freedom, and peace.” Austria Austria’s caretaker Chancellor Alexander Schallenberg reaffirmed his support for Ukraine, while the country’s foreign ministry declared: “Russia is the aggressor and we share Ukraine’s commitment to a comprehensive, just and lasting peace!” Belgium Prime Minister Bart De Wever pledged solidarity with Ukraine, stating: “We stand behind Ukraine and the Ukrainian people in their historic fight to defend themselves against an unprovoked Russian aggression. Their fight is our fight. United we are strong.” Australia Prime Minister Anthony Albanese said in a statement: “We will continue to stand with Ukraine for as long as it takes, because this is the struggle of a democratic nation versus an authoritarian regime led by Vladimir Putin, who clearly has imperialistic designs, not just on Ukraine, but throughout that region.” New Zealand Prime Minister Christopher Luxon said his country remains “steadfast in its support for Ukraine as it defends itself in a war that Russia started”, adding that Ukraine is not only protecting its sovereignty but also upholding international law. Advertisement Amnesty International Amnesty International stressed that peace in Ukraine must be built on justice for those responsible for war crimes. “Nothing that was said today in the Oval Office changes the facts: Russia’s full-scale invasion of Ukraine was an act of aggression and a manifest v"
