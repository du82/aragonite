["https://aljazeera.com/sports/2025/2/28/icc-champions-trophy-2025-australia-reach-last-four-afghanistan-on-brink"]
title = "ICC Champions Trophy 2025: Australia reach last four; Afghanistan on brink | Cricket News | Al Jazeera"
description = "Australia reach Champions Trophy semifinals after washout with Afghanistan, who are left to wait on South Africa result."
full_description = "Sport|CricketICC Champions Trophy 2025: Australia reach last four; Afghanistan on brinkAustralia reach Champions Trophy semifinals after washout with Afghanistan, who are left to wait on South Africa result.Australia's Travis Head celebrates after scoring fifty during the ICC Champions Trophy match against Afghanistan [KM Chaudary/AP]Published On 28 Feb 202528 Feb 2025Australia reached the Champions Trophy semifinals after their last group game against Afghanistan was abandoned because of rain and a wet outfield. World Cup holders Australia, who achieved a record chase of 352 against England in the opening game, finished the group stage with four points after its last two games were washed out in Rawalpindi and Lahore.Recommended Stories list of 4 itemslist 1 of 4New Zealand and India in Champions Trophy semis as Pakistan make swift exitlist 2 of 4‘Cricket is dead in Pakistan’: Fans, experts berate Champions Trophy exitlist 3 of 4Pakistan end home Champions Trophy without win after Rawalpindi washoutlist 4 of 4Jos Buttler resigns as England captain after Champions Trophy exitend of list Afghanistan had three points and are on the verge of an exit. To advance, they need South Africa to lose by an improbable margin of more than 200 runs against already eliminated England in Saturday’s Group B game. Afghanistan were bowled out for 273 on the final ball of their innings on Friday and Australia cruised to 109-1 in 12.5 overs when the rain returned. The outfield became too sodden to continue. Groundmen cover the pitch as rain stops play during the ICC Champions Trophy match at the Gaddafi Stadium [Aamir Qureshi/AFP] Travis Head’s 34-ball half-century had provided Australia with a rollicking start against some scratchy Afghanistan fielding and poor fast bowling. Rashid Khan couldn’t hold onto a regulation catch when Head was on six. Head cut loose and motored Australia to 90-1 in the batting powerplay. Advertisement Substitute fielder Nangeyalia Kharote dropped Matthew Short off Azmatullah Omarzai, but was dismissed two balls later when Gulbadin Naib took a smart catch over his shoulder at mid-on while running backwards. Fast bowling allrounder Omarzai, who grabbed his maiden five-wicket haul in Afghanistan’s stunning eight-run win over England at the same venue, was smacked for 43 off his five overs while Fazalhaq Farooqi also erred a lot in his lengths and went for 32 off his three overs. Left-handed batter Sediqullah Atal (85) missed out on a century, but Omarzai held one end up with a 67-ball 63 that included five sixes. Spencer Johnson (2-49) and Ben Dwarshuis (3-47) struggled to control the swing with the new ball but both fast bowlers came back strongly with the old ball. Opener Rahmanullah Gurbaz fell early for the third consecutive time when Johnson yorkered him without scoring off his fifth legitimate ball. Afghanistan’s Azmatullah Omarzai boosted his side’s score but it was not enough [KM Chaudary/AP] Ibrahim Zadran, who recorded the tournament’s highest score of 177 against England at the same venue on Wednesday, made 22 and was gutted when he was caught at point in Adam Zampa’s (2-48) first over. Captain Steve Smith squeezed Afghanistan in the middle overs with his spinners as Matthew Short (0-21) conceded just one six in his tidy seven overs and Glenn Maxwell bowled a maiden while finding the edge of Rahmat Shah’s bat (12). Atal tried to accelerate after captain Hashmatullah Shahidi struggled to keep the scoreboard moving, but Atal was caught by Smith at short cover in Johnson’s return spell. Advertisement Mohammad Nabi and Gulbadin Naib went cheaply and Afghanistan slipped to 199-7. Omarzai farmed the strike and completed his half-century off 54 balls and boosted Afghanistan’s morale. Source: Al Jazeera and news agencies"
