title = "At least 11 killed in blasts at M23 rally in eastern DR Congo, rebels say | Conflict News | Al Jazeera"
description = "Rebel commander Corneille Nangaa says 65 people wounded in blasts as DRC’s presidency blames ‘a foreign army’."
full_description = "News|ConflictAt least 11 killed in blasts at M23 rally in eastern DR Congo, rebels sayRebel commander Corneille Nangaa says 65 people wounded in blasts as DRC’s presidency blames ‘a foreign army’.Hospital workers carry an injured man at Bukavu Provincial Hospital in Bukavu after two explosions rocked the city in the eastern DRC on February 27, 2025 [AFP]Published On 27 Feb 202527 Feb 2025|Updated: 27 Feb 202505:08 PM (GMT)At least 11 people have been killed and 65 wounded when explosions rocked the city of Bukavu in the eastern Democratic Republic of the Congo (DRC) during a rally for the M23 rebel group and their supporters, the leader of the rebel alliance says. The DRC’s presidency, which says neighbouring Rwanda is backing the rebels, said in a post on X that “several” deaths occurred on Thursday and blamed “a foreign army illegally present on Congolese soil”.Recommended Stories list of 3 itemslist 1 of 3Rwanda slams UK sanctions over DR Congo violencelist 2 of 3Fighting in eastern DRC killed about 7,000 people since January, PM sayslist 3 of 3What can stop M23 advance in Democratic Republic of the Congo?end of list Corneille Nangaa – who is the leader of the Congo River Alliance, which includes M23, and who had himself been present at the rally – said grenades were used in the explosions and were the same type used by Burundi’s army in the DRC. His claims could not be verified. The first explosion caused panic, sending attendees fleeing from the area before a second explosion rang out, according to the AFP news agency. Residents said the explosions were accompanied by gunfire. People ran through the streets, some bleeding and carrying limp bodies, video showed. Residents said they saw dead people. Advertisement The meeting was the first to be attended by Nangaa since his forces seized control of Bukavu, the region’s second largest city, nearly two weeks ago. Nangaa told the Reuters news agency by phone that neither he nor other senior rebel commanders were wounded in the attack. Bukavu is one of two key cities in the turbulent region seized in recent weeks by antigovernment M23 fighters, who United Nations experts said are backed by Rwanda. The armed group has been trying to demonstrate that it can restore order in the territory it has captured from the DRC’s army and has reopened ports and schools. M23 fighters have swept through the eastern DRC, seizing key cities and killing about 7,000 people. There have also been reports of sexual abuse of children and recruitment of minors as soldiers. The rebel advance has stirred fears of a regional war that could draw in the DRC’s neighbours, including Rwanda. The advance has been described as the gravest escalation in more than a decade of the long-running conflict in the eastern DRC, which is rooted in the spillover of Rwanda’s 1994 genocide into the DRC and the struggle for control of the DRC’s vast mineral resources. Rwanda has said it is defending itself against the threat from a Hutu militia, which it said is fighting with the Congolese military. Source: Al Jazeera and news agencies"
