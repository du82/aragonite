["https://www.aljazeera.com/about-us"]
title = "About Us | Today's latest from Al Jazeera"
full_description = "About UsWhen Al Jazeera launched from the Qatari capital, Doha, on Friday, November 1, 1996, it was the first independent news channel in the Arab world. Media in the Arab world, till then, was characterised by state-controlled narratives that denied audiences the right to know and the right to be heard. Al Jazeera pioneered a new paradigm for in-depth journalism that was relevant to its audience, giving them a broad and deep perspective on regional and international affairs, putting the human being directly at the centre of the news agenda. The Channel’s founding tagline, “The Opinion and the Other Opinion”, encapsulated bringing multiple angles to a story, informing and empowering its audiences, championing their stories, while maintaining the spirit of journalistic integrity. Al Jazeera introduced what came to be known as the “Al Jazeera Phenomena”. It was a turning point in the history of Arab and global media that inspired academics and researchers to study and analyse this phenomena for years to come. Al Jazeera is now one of the largest and most influential international news networks in the world. The road to success, however, has not been without its challenges. The Network and its journalists have been in the crossfire, and at times paid a heavy price for seeking to bring the truth to its audiences. In the face of these pressures on the Network, and its journalists, Al Jazeera continued on its journalistic mission and garnered international recognition and awards for its in-depth and uncompromising journalism. Over the years, Al Jazeera’s expansion into new channels, subsidiaries and digital content is a testament to its constant determination to evolve and deliver unmatched professional journalism to its audiences. The Network presents impartial news, programmes, current affairs, and in-depth investigations that push the boundaries of traditional media. Al Jazeera is also continuing to pioneer new and emerging storytelling techniques that cater to a new generation, presenting an ever-innovative portfolio of digital products that inform, empower, and educate, whilst maintaining its founding principles. Al Jazeera Media Network is ideally placed on the world stage with its headquarters in the Arab world, with over 70 bureaus around the globe, and more than 3,000 employees from more than 95 countries. Al Jazeera has extensive reach across the globe and is available in over 150 countries and territories in more than 430 million homes. Al Jazeera is an independent news organisation funded in part by the Qatari government. You can visit here for more information about Al Jazeera’s leadership."
