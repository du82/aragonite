["https://aljazeera.com/code-of-ethics"]
title = "Code of Ethics | Today's latest from Al Jazeera"
full_description = "Code of Ethics Being a globally oriented media service, Al Jazeera shall adopt the following code of ethics in pursuance of the vision and mission it has set for itself: 1. Adhere to the journalistic values of honesty, courage, fairness, balance, independence, credibility and diversity, giving no priority to commercial or political over professional consideration. 2. Endeavour to get to the truth and declare it in our dispatches, programmes and news bulletins unequivocally in a manner which leaves no doubt about its validity and accuracy. 3. Treat our audiences with due respect and address every issue or story with due attention to present a clear, factual and accurate picture while giving full consideration to the feelings of victims of crime, war, persecution and disaster, their relatives and our viewers, and to individual privacies and public decorum. 4. Welcome fair and honest media competition without allowing it to affect adversely our standards of performance and thereby having a “scoop” would not become an end in itself. 5. Present the diverse points of view and opinions without bias and partiality. 6. Recognise diversity in human societies with all their races, cultures and beliefs and their values and intrinsic individualities so as to present unbiased and faithful reflection of them. 7. Acknowledge a mistake when it occurs, promptly correct it and ensure it does not recur. 8. Observe transparency in dealing with the news and its sources while adhering to the internationally established practices concerning the rights of these sources. 9. Distinguish between news material, opinion and analysis to avoid the snares of speculation and propaganda. 10. Stand by colleagues in the profession and give them support when required, particularly in the light of the acts of aggression and harassment to which journalists are subjected at times. Cooperate with Arab and international journalistic unions and associations to defend freedom of the press."
