full_description = "Would US democracy survive a second Trump presidency?Video Duration 47 minutes 21 seconds play-arrow47:21 History, genocide and Israel’s war on Gaza: Mehdi Hasan and Benny MorrisVideo Duration 48 minutes 58 seconds play-arrow48:58 play videoplay videoVideo Duration 47 minutes 21 seconds play-arrow47:21Head to HeadInequality, corruption and police brutality in KenyaRead moreIn 2024, thousands of young Kenyans took to the streets to protest the country’s deepening cost-of-living crisis and the controversial finance bill proposed by the government of President William Ruto. Authorities responded to the protests with a brutal crackdown that killed dozens of Kenyans and injured hundreds. Meanwhile, a growing number of abductions have rocked the country – which human rights groups say Kenyan police are responsible for. So what lies ahead for the country and its president? Mehdi Hasan goes head-to-head with Kimani Ichung’wah, the majority leader of the Kenyan National Assembly, on President Ruto’s rule, the government’s clampdown on dissent and its economic crisis. Joining the discussion are: Awino Okech – Professor of feminist and security studies at University of London-SOAS Irungu Houghton – Executive director of Amnesty International Kenya Moses Langat – Kenya community leader in the diaspora, based in the UK. Published On 27 Feb 202527 Feb 2025"
