["https://aljazeera.com/news/2025/2/26/when-is-ramadan-2025-and-how-is-the-moon-sighted"]
title = "When is Ramadan 2025, and how is the moon sighted? | Interactive News | Al Jazeera"
description = "The first day of fasting for the Muslim holy month of Ramadan in Mecca will be Saturday, March 1."
full_description = "News|InteractiveWhen is Ramadan 2025, and how is the moon sighted?The first day of fasting for the Muslim holy month of Ramadan in Mecca will be Saturday, March 1.By Alia ChughtaiPublished On 26 Feb 202526 Feb 2025|Updated: 14 hours agoThe first day of fasting for the Muslim holy month of Ramadan in Mecca will be Saturday, March 1, following the sighting of the crescent by the moon-sighting committee in Saudi Arabia. Other countries follow their own moon sightings, and the crescent moon was not sighted in Malaysia, Bangladesh, India, Pakistan and several other countries across Asia making the first day of Ramadan March 2. BREAKING NEWS | The crescent moon has been sighted in Saudi Arabia.Therefore, Ramadhān 1446 will begin tonight. May Allāh ﷻ accept our siyām, qiyām & acts of worship, and may He grant us the ability to utilise the precious moments of this Blessed month to engage in that which… pic.twitter.com/F5HcJou7es — 𝗛𝗮𝗿𝗮𝗺𝗮𝗶𝗻 (@HaramainInfo) February 28, 2025 Recommended Stories list of 3 itemslist 1 of 3Ramadan and the Olympicslist 2 of 3Ramadan in Iraqlist 3 of 3In pictures: Ramadan’s holiest nightend of list Ramadan is determined by the Islamic lunar calendar, which begins with the sighting of the crescent moon. Saudi Arabia and other Muslim-majority countries rely on the testimonies of moon sighters to determine the start of the month. How is the Ramadan moon sighted? For the moon to be visible, the crescent must set after the sun. This allows the sky to be dark enough to spot the small sliver of the new moon. Advertisement After the sun sets on the night of February 28, the 29th day of Shaaban month in the Hijri calendar, moon sighters face west with a clear view of the horizon for a first glimpse of the crescent moon. In Saudi Arabia, testimonies of people who have spotted the moon are recorded, and the Supreme Court makes a decision on when Ramadan should begin. When does Ramadan begin in different countries? According to Crescent Moon Watch (PDF), a moon tracker run by the United Kingdom’s Nautical Almanac Office, Ramadan’s new moon will begin on February 28 at 3:45am Mecca time (00:45 GMT). On February 28, the new moon should be visible only in the Pacific, North America and parts of South America. It is unlikely that most of the world, including the Middle East, Europe, and South Asia, will be able to see the new crescent even with an optical aid. The new moon will most likely be seen without optical aid if the skies are clear across most of the world on March 1. For most countries in the Global South, the first day of fasting will most likely be March 2. Lunar months last between 29 and 30 days, depending on the sighting of the new moon on the 29th night of each month. If the new moon is not visible, the month lasts 30 days. Why is Ramadan holy? Muslims believe that Ramadan is the month when the first verses of the Quran were revealed to the Prophet Muhammad more than 1,400 years ago. Throughout the month, observing Muslims fast from just before the sunrise prayer, Fajr, to the sunset prayer, Maghrib. Advertisement The fast entails abstinence from eating, drinking, smoking, and sexual relations to achieve greater “taqwa”, or consciousness of God. Fasting is one of the five pillars of Islam, along with the Muslim declaration of faith, daily prayers, charity, and performing the Hajj pilgrimage to Mecca if physically and financially capable. In many Muslim-majority countries, working hours are reduced, and most restaurants are closed during the fasting hours. How do you wish someone for Ramadan? Various Muslim-majority nations have a personalised greeting in their native languages. “Ramadan Mubarak” and “Ramadan Kareem” are common greetings exchanged over the month, wishing the recipient a blessed and generous month, respectively. Source: Al Jazeera"
