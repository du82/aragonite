["https://allinonefilms.com/transcripts/angel.htm"]
title = "ALL IN ONE FILMS -Transcripts"
full_description = "ALL IN ONE FILMS -Transcripts <!-- --> <!-- body { margin-left: 8px; margin-right: 0px; margin-top: -8px; vertical-align: top; } --> Well it started in Greenhaven Prison in New York which is a maximum security prison where they have the electric chair. And it was a group of inmates who called themself the think tank concept who were trying to help younger men who were headed in the same direction. They had come to find better ways of dealing with violence in their lives. And ah they weren't having that much success in getting their ideas across. I think they were using largelyt the scared straight kind of approach. You know you continue with what you've been doing and you're going to end up where we are and this is what prison is like and so forth, which they didn't find a very motivational approach to actually changing behaviour. And ah because we had a Quaker worship group there in the prison they knew that during the Vietnam war years they'd heard that we had trained thousands of marshalls to go into demonstrations and help keep them non-violent. So they said could you come and teach us something about how to teach non-violence. And so the first workshop was born at Greenhaven at the request of inmates. And ah it was a very successful event. I mean they greatly appreciated what was given to them. The team for that was drawn from a rather wide area - as far south as Atlanta and out to the mid-west - individuals who had worked with the Quakers and with Martin Luther King in earlier years. And my sole connection with ..... workshop was that we - my wife and I served as host to Bernard Lafayette who was one of Martin Luther King's right hand people. And so he stayed at home and we had brief periods to visit with him during the three days the workshop took place. And I count that as a real privilege. Because he had a great deal to share about non-violence having lived through a great deal himself. My contacts with the program beyond that was for first workshop were rather sparse until they formed the corporation. I knew what was going on. I had - I heard some of the activities and wondered how they ever made any sense in prison and I didn't see how I could possibly be a part of such a process. But when the - it was necessary to form a corporation in 1979 I was asked to be one of the incorporators by Lawrence Apsey the founder and to serve on the board of directors which I was glad to do for Larry and also out of interest in the project. And that was just the beginning. I didn't know how involved I would become but -"
