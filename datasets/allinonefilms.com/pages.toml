["https://allinonefilms.com/transcripts/abraham.htm"]
title = "ALL IN ONE FILMS -Transcripts"
full_description = "LET'S BEGIN BY TALKING ABOUT HOW YOU CAME TO ALL THIS AND WHAT IMPORTANCE DID GROWING UP IN THE DEPRESSION, WHAT IMPORTANCE DID THAT HAVE IN SHAPING YOUR DEVELOPMENT? LET ME INTERRUPT YOU. CUT FOR A SECOND.SO WHAT IMPORTANCE DID THE DEPRESSION HAVE IN SHAPING YOUR IDEAS? Well because I grew up in the Depression, an awful lot of my understanding of being poor of course came from that. But I think probably the fact that in my way of thinking, the best way to help a poor person is to give them a meaningful job, to make them feel that I have something to give and to give them a chance to use their talents, their skills, creativity. And then of course they're developing other people's lives too besides their own. Because my dad was almost destroyed by the Depression. He had had as a young boy he'd been a messenger for the Western Union at 12 and then he worked for the Western Union for 34 years and then he and his two brothers were sent away at the time of the Depression. Then for the next 10 years, he had a job for a week, no job for two days, a job for a month, no job for another month and so he really could hardly enjoy that. And he felt that I'm the breadwinner and I'm not winning the bread. So he would always leave the house, no matter what, at 7:00 as if he were going to work and then he would just travel around Halifax looking for jobs and he was a very talented guy, physically I mean. he was a good painter, he was a good electrician. So he picked up a lot of odd jobs and but I could remember when dad would come home in the evening we could tell right away whether he had a job the next day or not because . So when I got here I felt that if I could make sure that the poor really felt you have something to contribute, that I would give them work as my way of trying to love and help them. So the Depression did that. I would never have had that insight. And then of course the other thing that it helped me a great deal on was ah when we were children all of us had to work so the girls were going and taking care of people's babies or what. I was delivering groceries, my older brothers were caddying at the golf course and we went through the whole cycle. But this gave us what I think a lot of young children don't have in Candian homes today. We really felt that the family needed us too, that mom and dad weren't giving us everything. We were adding our little bit. And so dad took me down to the bank when I was 9 years old and I opened up my own account and bought my own secondhand typewriter. So that all made me realize that if just as my friends in town who belonged to this extended family, the Mowari people, everybody in their family works. The kids come home from school, they go to the store, they you know, dump the paint tins or weigh out the nails or whatever. So they're helping from the time they're little ones of 8 or 9 years old."
