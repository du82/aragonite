title = "ALL IN ONE FILMS -Transcripts"
full_description = "ALL IN ONE FILMS -Transcripts <!-- --> <!-- body { margin-left: 8px; margin-right: 0px; margin-top: -8px; vertical-align: top; } --> MICKY, YOU HAVE SAID IN YOUR WRITING THAT DRUMMING HAS BEEN THE MOST IMPORTANT THING IN YOUR LIFE. TO A LOT OF OBSERVERS FROM THE OUTSIDE, A LOT OF ORDINARY PEOPLE, THEY MIGHT WONDER HOW COULD SOMETHING SO SIMPLE -- Simple? Drumming? Well, drumming isn't really simple. I mean but in a way sometimes it is and sometimes it isn't, it all depends where you take drumming. You know, if you become a virtuoso at drumming, well that takes many years of study, just like anything else, just like a brain surgeon, you know. If you just play in a drum circle, well you don't need any practise at all. You just sit there and play one one one one one, so it all depends what you mean by drumming. Let's put it this way. I fell in love with sound and rhythmic sound when I was a kid, sort of like a romance of the ear. You know and I got sucked in because it attracted me for some reason. I didn't know why then. I know why now. But I didn't really have much of a choice, so when you say drumming, well what's so important about drumming? Well, we live in a rhythmic universe. I mean you don't have to be a brain to realize that this is a rhythmic universe and we're embedded in it and drumming is one of the ways that we can express ourselves as a human, as a species, this is very important. It's not just drumming. Drumming is very important, or the study of rhythm is really important, or the enjoyment of rhythm or the following of the rhythm. Whatever you, however you appreciate rhythm. You don't have to drum to appreciate rhythm. AND DON'T GET ME WRONG. THAT WAS FAR FROM A PEJORATIVE REMARK BECAUSE IN YOUR WRITING, YOU'VE BROUGHT ALIVE THE COMPLEXITY OF YOUR DISCIPLINE, WHAT IS, WHAT YOU REGARD AS A SPIRITUAL SCIENCE ALMOST AND A DISCIPLINE, BUT LET'S FACE IT. YOU ACHIEVED SUCCESS AS A MUSICIAN QUITE EARLY ON IN YOUR CAREER AND YET YOU KEPT QUESTING, YOU KEPT INVESTIGATING, YOU KEPT ASSEMBLING THIS BODY OF KNOWLEDGE. WHY?"
