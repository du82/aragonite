["https://allinonefilms.com/transcripts/couture.htm"]
title = "ALL IN ONE FILMS -Transcripts"
full_description = "ALL IN ONE FILMS -Transcripts <!-- --> <!-- body { margin-left: 8px; margin-right: 0px; margin-top: -8px; vertical-align: top; } --> JOE, IN THE COURSE OF THIS PROGRAM WE'RE GOING TO LOOK OVER THE LAST 25 YEARS IN A NUMBER OF AREAS. IN TERMS OF THE NATIVE COMMUNITY, WHAT STANDS OUT FOR YOU IN THE LAST 25 YEARS. WHAT KIND OF DEVELOPMENTS HAVE WE SEEN? Well there's no simple answer to that but there are, I think, you know, like we were saying earlier sort of a general trend or there's a number of trends or characteristic tendencies. One of them, a majority of Indian thinkers, elders, academics would say that the bottom of the decline was the forties. And why then and not some other period in time? Well they brought back a number of veterans that had been all over the world and with that new ideas, new ways of talking, new dreams, new things to think about. And so 1945 would be the preliminary warming up phase to the late sixties and the late sixties would have been the moment when there was the explosion, sudden emergence of native organizations, political and service - political being the first. Yeah. There were ah like in Alberta which is the area I'm most familiar with there had been - the Indian Association of Alberta had existed for years as a volunteer organization which met once a year, drafted some resolutions and nothing ever came of it and then they met again a year later. Well in 1969 that changed with the election of Harold Cardinal. Then sudddenly there was a political movement in Alberta. That was paralleled in Saskatchewan and Manitoba at the same time at about exactly the same time - '69 or '70, '68. The same parallel on the service side, the Native Communications Society of Alberta was the first communications society - it was a year or two later. The Native Counselling Services of Alberta at about the same time. And ah as it travelled across the country over the next few years, just about at the same time, the same kind of phenomenon. DO YOU KNOW WHY? I MEAN WHY THEN? IF IT WAS HAROLD CARDINAL IN ALBERTA WHAT WAS IT IN THE OTHER PROVINCES?"
