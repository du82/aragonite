full_description = "ALL IN ONE FILMS -Transcripts <!-- --> <!-- body { margin-left: 8px; margin-right: 0px; margin-top: -8px; vertical-align: top; } --> We collect a lot of case studies which are are interesting they are anecdotal they can interest people in the field and bring them in but they don't prove anything and if all we do in the next five years is collect more case studies we're not going to convince anybody except the people that are already convinced. the scientific way to approach it is to study the phenomenon in a rigorous way with investigators pool the results so you can ask questions about the phenomenon. To everything, not only to the reporting of the incidents but to which incidents are studied. It's important that if you're going to exclude certain cases from being studied you decide beforehand how you're going to do that and it's in a way that makes sense. If you narrow the focus so that all your investigating or a particular narrow characterization of cases then that's all you're going to learn about and you may be excuding a whole bunch of other cases that may be relevent to your understanding of the wider phenomenon but you're not going to study them because you've decided that they don't effect what you're looking at. I think there needs to be a set of standards and practises there needs to be an agreed upon protocol for investigation and for therapy and I think that everybody that's working in this field has to subscribe to it has to abide by it and I think people after having collected the information in the same way with a mind to respect of the experiences and the help that they're rendering put all this information into a common data base. So that meaninful questions can be asked, questions that will address sceptical concerns like are these people fantasy prone, do a large majority of these people have sexual abuse in their background that kind of thing. It would be simple to answer those questions if we had a data base of information that was collected consistently across experiences that we could access. Right now we don't this guy has 20 cases that guy has 50 cases, they probably didn't ask the same questions or collect it in exactly the same way we don't know where their people came from it's all fragmented."
