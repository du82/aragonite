["https://allinonefilms.com/transcripts/gack.htm"]
title = "ALL IN ONE FILMS -Transcripts"
full_description = "I was in Virginia and I'd just begun to do lucid dreaming and I was enamoured with the idea of being able to find God in a dream thinking of entry into another world and all this stuff. And so one night I went to bed and I was thinking about, okay I'm going to dream and when I go to dream, I'm going to know I'm sleeping, do all the pre-sleep suggestions and I'm going to find God. I'm going to find my God. And so I get into bed and I'm asleep and I start - I realize I'm dreaming and the first thing I do is start flying. I flew up into the clouds and then I remembered I'm supposed to find my God and so I said that, okay, I want to find my God. And then suddenly I found myself sitting in the clouds cross-legged, looking in a mirror (chuckles) at myself. I'd like, dah, you know. So I just woke up you know. It was just like, oh krike, you know. I got it right away. The Liz Taylor dream, I was somewhere in the transition between, I think I was commuting to Iowa - it was a transition between lucid dreaming and native work basically. And I dreamt that Liz Taylor came up and I didn't know I was dreaming at this point. And she said, I know you, you're just like me. And I said, well I don't know and I'm not just like you. Oh yes you are. Oh no, I'm not. And I was thinking she's got all these boyfriends and my problems with fantasy lovers and that she's big and heavy and my problems with weight you know. And she kept insisting. I got to know I'm dreaming I guess in order to get out of this. And so I proceeded to know I was dreaming and I woke myself up, you know. The turtle dream was a marker dream in terms of my commitment to natives and it was where I discovered my totem animal though I didn't realize that until some time later. I was outside and it was a kind of open festival, something that was outside that was going to happen. And these children were going to come for whom I was responsible. And I looked in and there was this opening to an underground cavern on the ground so it went straight down. And ah I looked down on a rock about a quarter of the way through the way down was a sabre, this beautiful golden sabre and then there was this huge, into the cavern. And at this point it was very dark and I thought, I better get that sabre. If the kids see that they're going to try to get down there, they're going to fall, blah blah. So I tried to get down but it's loose shale and I started falling. And I thought, you know, what am I going to do and I couldn't because it was loose shale but there was the sabre and the kids were coming. And then suddenly from the bottom the cavern lit up. It was like bright gold and not real bright but gold, and this huge turtle. And I knew it was a female turtle came in to the bottom of the cavern standing on two feet like the teenage mutant Ninja type but it wasn't teenage mutant, she was a she and she didn't have any paraphernalia. I said could you get the thing for me, the sabre. And so she did; she went up and got it and gave it to me. And that was - I was later told that's - she's helping me, the turtle. And so I left and I went over and there was this room where people were sitting in it and there was a fire inside but nobody was hurt and I later realized it was a sweat but at the time I thought, this is strange, nobody's hurt and there's this fire. There's all this smoke, you know. And all these people walked out and this one colleague was part of the people who walked out and I remember looking at him and thinking, I'll never be as close to him as I'd like to be because I really admire him. And I woke up. When I saw him, the next time I saw him at a conference, I told him the dream. And he told me, which I had no idea about that he was editing a book on dreams and social action and would I write a chapter on my work with natives. And so I did and it was one of the first things that I've written about that work that I feel that clarified it, pulled it together, that it's a statement about what I'm trying to do."
