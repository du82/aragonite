["https://allinonefilms.com/transcripts/kripner.htm"]
title = "ALL IN ONE FILMS -Transcripts"
full_description = "LET'S BEGIN WITH BASICS BECAUSE YOU'RE KIND OF A DEAN OF DREAM WORK, SCIENTIFIC DREAM WORK. CAN I HIT YOU WITH A VERY BASIC QUESTION ABOUT WHAT DREAMS ARE. When we use the word dreams, we're actually talking about verbal reports, stories, narratives that people give us about their experienced dreaming. So we never dream - I'll start over. When we use the word dream we're actually referring to a report, a story that people are telling us about images that they have had when they were asleep that take a narrative form. In other words, we never really know 100% for sure what a person dreamed about, what the dream experience was. We're always dealing with something secondhand. The dream is totally rooted in an individual's experience. One individual will report the dream one way, another people - Environment and culture really shape the dream. We know that virtually everybody dreams. It's a biological necessity that we have these so-called rapid eye movement sleep periods every night in which most of our dreams take place. But the type of dream we have is shaped by daily experience and daily experience, of course, is shaped by the physical environment, the temperature, the climate, the food that we eat, whether we're hot or cold and also the cultural environment, the type of stereotypes in the culture, the mythology of the culture, the role that culture gives to men, women, children, adults. People in different cultures do dream differently in my opinion. A culture that has a very strong stress on achievement and motivation will have achievement and motivation dreams while a culture that's more laid back and more relaxed and unmotivated will have dreams a little bit more passive. And sometimes these cultures are side by side separated by only a few hundred miles and yet the dreams are very very different. YOUR LATEST WORK INVOLVES LOOKING AT DREAM STUDIES, A CROSS CULTURAL VIEW WITH TEN DIFFERENT NORTH AMERICAN - My research associate, April Thomson and I, have just studied 16 different native American dream systems. We've done this by going into the library, into the journals, into the books and seeing what was written about these cultures, mainly the anthropologists -"
