full_description = "ALL IN ONE FILMS -Transcripts <!-- --> <!-- body { margin-left: 8px; margin-right: 0px; margin-top: -8px; vertical-align: top; } --> More reading and those my daily meditation extended more how to say more time, more leisurely. Then that gives me some kind of satisfaction or some, good good good for me. So that's so really in India sometimes I visit some remote place and spend one week or two weeks without meeting new people just stay quietly and then they of course the daily routine is same as I mentioned just now you see. Then I have leisure as a more longer time about this practice and then reading reading. You see mainly of course in Tibetan Buddhists mainly Buddhist philosophy then in English my of course there are many fields where I have interests. Now for example the some simple explanation about cosmology that is very interesting to me. Then about biology these things also is very interesting. Then of course b......... and then also what so different thing. Then also explanation about nature I think what you call about the tree, about plants and birds, the different mammals in sea or sometimes the different people from different places. These mainly I enjoy read. That usually those birds who never create trouble for other birds I love more. So I sometimes I although I practise Buddha dharma and sometimes I have to make some discrimination of these birds. Sometimes more favorite some then so fond. Yeah. Those those bigger ones. There is one smaller you see, lot of them small small one feeding there is one big one come and then creates sometimes unpleasant atmosphere. So sometimes I how to say huhn? yes chase them. Some sometimes I use in order to protect the smaller one, sometimes I use what you call airgun air rifle. And then when I was in Tibet when I was young, one occasion I shot one small birds with what you call the air rifle, sad very sad. That my mistake. Every day I don't know. Now here I can't see much how to say result if I look daily experiences. Oh I mean I think it's daily, if I look at it daily, there is not much to see development. Then I compare, today is my how to say is way of thinking or behaviour compare five years back or ten years back, then I notice much change. So then I look, then I realize during my practice some change took place within myself. So that then you know my position I can't stand remote place for at least a few month, that kind of thing you see. At the moment difficult almost impossible. So therefore certain practice I can't practice."
