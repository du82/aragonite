title = "ALL IN ONE FILMS -Transcripts"
full_description = "ALL IN ONE FILMS -Transcripts <!-- --> <!-- body { margin-left: 8px; margin-right: 0px; margin-top: -8px; vertical-align: top; } --> MAN ALIVE ASTROLOGY 61-2-2002-8003 PRODUCER DAVID CHERNIACK OPERATOR wl TRANSCRIPTS BY TYPETRONICS - 465-0852 Well there are basically two answers that can be given to that question both of which are correct. Ah, there's a broad definition of astrology which simply postulates that everything in the universe is connected by a symbolic language and that the symbolic language is to be found both within the psyche and within nature. And that we use planets to judge the state of the symbolism in the universe simply because they're mathematically predictable. Ah, other things have been used flights of birds ah, I'm not necessarily saying this works, but ah, in principle it should just as valid a way of expressing the parallel symbolism of different plains of the universe as planets. A more narrow definition would be the historical one which is astrology is the art of observing planetary positions, casting horoscopes and checking the correlation with these and human events and human behaviour. The difference is the emphasis on casting of horoscopes there can be an astrology that does not involve horoscopes. The world view is so radically different from the prevailing world view which is comes to us largely out of science that to even evaluate astrology in terms of the scientific world view is basically to ask that you ah, ah, use baseball rules to play a game of soccer. Um, astrology, you see, postulates basically mystical world view. And I mystical in the rigorous sense of the word, not in the usual sense of the word that scientists use it. The scientist when he says mystical means befuddled, confused, weird. The technical definition of mystical is that the universe is basically one and that the diversity is an appearance. Ah, astrology comes from that point of view that the entire universe is basically one therefore all of the parts of the apparent diversity reflect the underlying oneness and the evolution of that oneness. Given a world view of this kind you find yourself asking not how does astrology work but how could it not work."
