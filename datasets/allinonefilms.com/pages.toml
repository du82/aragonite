["https://allinonefilms.com/transcripts/friedman.htm"]
title = "ALL IN ONE FILMS -Transcripts"
full_description = "WE WERE TALKING ABOUT THE ORDERS TO SHOOT IN 1952, ON THE TELEPHONE. DO YOU WANT TO TELL ME ABOUT THAT. [00:37:39] Yeah. Everybody knows that 1952 was a banner year for UFO sightings, especially the summer of '52. Blue Book, Project Blue Book had more reports for '52 than any other year in its 20 year existence roughly. [00:37:52] But in the summer of '52 there were sightings over the White House, over Washington, D.C., radar sightings, one of the biggest press conferences ever on July 29th about these sightings. [00:38:03] And it only came to light recently when I was digging more deeply into things about '52 because of my interest in the Flatwoods monster case which was September 1952. [00:38:15] I asked some associates for all the clipping I found find from 1952 and I was astonished to find that there were a number of clippings quoting air force officers saying pilots had been ordered to shoot down UFOs. [00:38:31] And this caused such a stir that there were even letters to the president of the United States from the head of the American Rocket Society - a guy named Farnsworth - saying he thinks that's a terrible idea. That's not the way to welcome our visitors, if there are visitors coming here. [00:38:45] And so that was the first thing. Several different articles, different guys quoted. Pilots have been ordered to shoot them down if they don't land when instructed to do so. And I can just see the cartoons, you know. [00:38:57] The pilot saying: down! And the UFO going - (laugh) It's just crazy. [00:39:03] But buried in this thing was a discussion with Gen. Roger Ramey, a major general by this time, the same guy who was connected with Roswell in '47. [00:39:13] THE GUY WHO DID THE BALLOON PRESS CONFERENCE. [00:39:15] Yeah. He had the big press conference, it's just a radar reflector-weather balloon combination. And now he was air defence command kind of thing and he is quoted in one newspaper as saying, we have scrambled jets after UFOs hundreds of time - hundreds of times - not just a few or several but hundreds of times. [00:39:40] So as you start looking around you also discover an awful lot of airplane crashes, jet interceptor crashes in 1952 including three cases where pilots who had over a hundred missions in Korea, where they were dodging Migs after all, who came back and crashed. [00:40:01] We also have a number of reports when you start looking in the New York Times and other places, little squibs about another plane goes down, ah where planes disappeared and the word disintegrated is used in several instances. [00:40:17] Now I had already heard of six different cases after my lectures in which people told me quietly -this was not public discussion - that when they were in the military more planes had gone up than came back down, after chasing UFOs. Two go up, one comes back; three go up, two come back, that sort of thing. [00:40:37] Now you know, once is one thing but when I hear six different independent stories - I don't use them in my lectures so there's no way they would know that I had heard these things before - if I've heard six there have to have been a heck of a lot more than that. [00:40:51] So considering that 1952 was a very nervous year for the United States. We anticipated that Joe Stalin, now that he had airplanes for delivering nuclear weapons and had already tested several nuclear weapons, each one more powerful than the previous one, and that we were occupied in Korea in '52 there were a lot of people who expected him to attack the United States. [00:41:14] I mean he trusted Hitler, that was a mistake. Why should he trust the United States, you know. So they were very nervous and this is where the ground observer corps was put into place. You know, like they're going to really save us. Hey, I just saw one going by, a Russian airplane! Get there in time, you know. [00:41:30] So you put all this together and I think that there was as period of time in which we were almost at war with aliens, that is wanting to shoot them down. And they seemed to only react in self-defence, according to the stories I've heard. [00:41:46] We attack. They say uh-uh we're not buying any of that kind of thing. And so - and I've heard stories, rumours out of the Soviet Union that they kept trying to shoot them down and that several of their boosters were clobbered on the pad later on in the space age. Now you say why would we want to shoot them down? Well to get hold of the technology I suppose and to prove that they couldn't fly over our territory without retaliation, you know. I'm the strong guy on the block kind of thing. [00:42:17] So I don't know what's going on there but I do know it's been very hard to get accident reports, so-called accident reports, planes disappeared and all this sort of thing. [00:42:29] But when you see the statements that UFOs are not a threat to the security of the United States, that's an official air force statement, you say, hey wait a minute. How about those pilots being told to shoot something down? You don't tell anybody to shoot something down unless he's a threat to the security of the country. [00:42:46] And then when you throw into this picture one more thing. General Carroll Bolander - [00:42:53] I WAS GOING TO ASK YOU ABOUT THE BOLANDER STATEMENT, YEAH [00:42:55] General Carroll Bolander had been an engineer on the air force side of the lunar excursion module. And we landed on the moon in July of '69. And so his next assignment - he'd been working 12 hour days before that - he was asked to look at the UFO business because the Condon Report had come out earlier that year, January, suggesting that Project Blue Book be cancelled because it was not contributing anything to science. [00:43:25] So Bolander was asked to review the situation. He had no previous involvement with UFOs so this is a completely disinterested, very competent individual. He was a brigadier general. [00:43:35] WHY WAS HE ASKED … SITUATION AGAIN? [00:43:38] Because the government wanted to take a position. The Condon people had said one thing. Let's have one of our guys look at this situation and what's going on here. [00:43:49] So his recommendation was what resulted in the closure of Project Blue Book. OH I DIDN'T REALIZE THAT. [00:43:52] -as a matter of fact. OKAY. [00:43:54] It came out in October and it was closed in December. But buried in his discussion and I don't have all the attachments - I have the original discussion - is a statement that reports of UFOs which could affect national security are made in accordance with joint army-navy-air force publication 146, air force manual 55-11 and are not part of the Blue Book system. That's a shocking phrase. [00:44:22] And two paragraphs later he says: if we close Project Blue Book the public won't have any place to report UFO sightings. However, as previously noted, reports which could affect national security would continue to be handled using the regulations established for that purpose. [00:44:39] Now I located General Bolander when I got a copy of this memo and I talked to him. It was clear he understood exactly what he was saying. You know, if a UFO flies down the runway at a SAC base, Strategic Air Command base where nuclear weapons are stored, that's a national security problem, you know, and who cares what you see standing at your driveway watching a light go by in the sky. That doesn't matter. [00:45:02] But for him to say this twice, the point was very, very clear. Now that is reinforced. If you look on the black vault website which has thousands of page of government documents on UFOs, the air force sent letters to John Greenwald who runs the site saying that we are no longer interested in UFOs. He's got several of these. [00:45:30] However, John managed to get pilot manuals for our most advanced fighter planes, within the last three years, it says, in which it gives specific instructions what they are to do should they encounter an unidentified surface ship, an unidentified aircraft or an unidentified flying object. [00:45:49] THEY DISTINGUISH BETWEEN UNIDENTIFIED AIRCRAFT AND UNIDENTIFIED FLYING OBJECT. [00:45:52] Definite distinction between those two. So on the one hand they're saying, we're not interested but here's the instructions to the pilots, with our latest equipment. They're not flying Beechcraft now. They're flying F16s, F18s, etc. [00:46:04] IT MAKES NO SENSE THAT THE ARMED SERVICES WOULD NOT BE INTERESTED IN ANYTHING THAT'S POTENTIALLY STRATEGICALLY COMPROMISING. IT MAKES NO SENSE WHATSOEVER. [00:46:11] They wouldn't use the term UFO. They'd say uncorrelated targets. [00:46:15] UNCORRELATED TARGETS. THAT'S A NEW TERM. [00:46:18] William Moore with whom I worked very closely on Roswell once made a request of the Air Defence Command. I want all your reports of uncorrelated targets for a six month period. [00:46:29] So he gets back a letter, very straight, saying, thank you for your request. As you know, there are search fees required for a response to such a request. Please sent your certified cheque. It was like $110,319 and one of my dreams has always been, what if somebody had sent a cheque? What would they have done? (chuckle) [00:46:49] But the kicker here may be one of terminology. We don't call them UFOs anymore. They're interstellar alien craft maybe, you know. [00:47:00] WHERE DO YOU FIGURE THAT, BECAUSE ISN'T THERE AN ARGUMENT THAT THIS STARTED TO HAPPEN AFTER THE ROBERTSON PANEL? DOESN'T THAT … KEVIN RANDALL'S BOOK ABOUT, IS IT BLUE FLY? [00:47:15] Well there's ah - there are two different - Moon Dust. [00:47:17] MOOD DUST, YEAH. [00:47:20] And there is another project whose name - [00:47:22] YEAH. WASN'T THIS POST-ROBERTSON PANEL THE REAL REPORTS - THE REAL GOOD REPORTS STARTED GETTING FUNNELLED NOT TO BLUE BOOK BUT SOMEWHERE ELSE. DIDN'T THAT START TO HAPPEN? [00:47:32] I think it happened before the Robertson panel because '52 was before the Robertson panel. And clearly there was somebody doing something somewhere with these accounts of pilots chasing UFOs. [00:47:45] OKAY, GOOD. LET'S MOVE ON. I THINK WE COVERED THAT ONE. Roswell - WHAT CAUSED YOU TO LOOK AT Roswell IN THE FIRST PLACE? IT WAS THE LATE '70s WHEN YOU BEGAN TO LOOK. [00:47:59] Well it's a little more complicated than that. [00:48:01] WHAT WAS THE IMPETUS? BECAUSE IT WAS LAYING DORMANT RIGHT? [00:48:05] Yeah, you won't find anything. Frank Edwards talks about it and totally wrong about just about everything. And there's a book on the UFO wave of 1947 and by Ted Blocher and he mentions it as an obvious hoax. He just looked at newspaper articles in cities where he played and various reviews and stuff. [00:48:25] It actually started in 1972. Talked to a forest ranger in California about his sighting and he said, you know, you ought to talk to my mom. She had a really good sighting down in New Mexico. [00:48:36] So fine, an associate and I talked to his mom, Lydia Sleppie, and she told us about her sighting which was a good report. And then she mentioned that when she was working at a radio station in Albuquerque they had a call from their Roswell affiliate who said a saucer has crashed and they're going to send it to Wright Field. I want to dictate a story. And she was not a journalist; she was in accounting. [00:49:03] But she handled the teletype machine. She was a good typist. So he's dictating and she's putting it on the teletype. And a bell rings and says, discontinue this transmission, FBI, and she tells him and he says, well I guess you better. [00:49:16] So I - [00:49:18] HOW IS THAT TECHNOLOGY POSSIBLE BY THE WAY? DID YOU EVER FIGURE IT OUT? DID YOU EVER LOOK INTO IT? [00:49:21] Yeah. The kicker here is that New Mexico was the home of an enormous amount of classified research. Two of the three nuclear weapons labs are there. White Sands missile range is there. Kirkland Air Force base was the biggest employer in the state. Roswell was the home of the only atomic bombing group in the world. [00:49:38] Surely the FBI was looking for spies and if there's one place you'd expect to find them it would be New Mexico. So what you want to do is make sure that nothing gets out that shouldn't get out. Inadvertent things happen. Once an airplane dropped an atomic bomb in New Mexico. It didn't go off fortunately. [00:49:54] But it's not the kind of thing you want to broadcast, you know. If somebody put out a report on that, hey, no way, he'll say. So I think they were monitoring. The Cold War was heating up there already in '47. [00:50:07] Anyway I talked to Lydia. She had some names. I tracked down several of these people. And I really ran up against a stone wall. One guy didn't remember anything. The other guy sounded like he remembered but wasn't going to tell me anything. What will I do now? [00:50:20] So it lay dormant but in the back of my mind. Then I was at a television station in Baton Rouge, Louisiana, to do three interviews prior to my lecture that night at Louisiana State University. And I'd done the first two and the third reporter was nowhere to be found. No cell phones back then and the station manager is giving me coffees, looking at his watch. He knew the person who brought me to the station, so he was embarrassed. [00:50:43] You know, he knew I had other things to do and here this reporter isn't there. SO out of the blue he says, you know, the guy you oughta talk to is Jessie Marcel. And brilliant investigator that I am, I said, who's he? And he says, oh he handled the wreckage of one of those saucers you're interested in. He was in the military. What?! [00:51:01] There's nobody else around. He was obviously being serious. It wasn't a joke. I said, well what do you know about him? Well he lives over in Homa, world ham radio buddies, great guy, you oughta talk to him. And then the reporter shows up. [00:51:14] So there was a half hour window of opportunity. I was busy the rest of the day. The next day from the airport, mind you, I called information in Homa, Louisiana. I've been there since. At that time I had no idea where it was. A pretty big town actually. And got a number for Jessie Marcel. I called him. He told me his story but he didn't know the exact date. [00:51:32] He was the base security intelligence officer and so forth. So what do I do with that? I file it. He said his picture was in papers all over the place and General Ramey told him not to say anything. [00:51:44] Okay, a few months later I'm in Bemidji, Minnesota. And after a lecture at Bemidji State College a couple comes up to me very quietly. We'd had a full house and it turns out, we find out later, they'd gone out and then came back. [00:51:59] And have you ever heard anything about a saucer crash in New Mexico? Well, yes. Tell me more. And they told me their story about a good friend of theirs had told them stumbling across a saucer, with bodies mind you. They didn't have a date either. [00:52:13] THIS IS BARNIE BARNETT. [00:52:16] Yes this is the Barnie Bar"
