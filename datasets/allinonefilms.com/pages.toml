title = "ALL IN ONE FILMS -Transcripts"
full_description = "ALL IN ONE FILMS -Transcripts <!-- --> <!-- body { margin-left: 8px; margin-right: 0px; margin-top: -8px; vertical-align: top; } --> this is one of several kinds of sets of anomalies that in the last 20 years or so has moved kind of in this way near death experiences will be another example that have recruited serious professionals into the study but whether in the long run that creates a new set of sort of marginalized professionals like parapsychology which has still not broken through but managed to do that recruitment quite a while ago or whether it changes the consensus in the academic world I don't know but here we do see that the consensus in the sort of our civilization at large is definitely shifting toward more openness more acceptance of these things, I think that the Ufologists occupy a position culturally that's much closer to and more influential on the popular mind than on the academic mind I guess we would have to say and that's natural because the academic world everything that goes into its intentional and unintentional isolation pushes the people interested in the anomalous things out and the only place to go out is into the regular world so publications tend to be carried more in the news media they tend to attract amateur interest more than professional interest etc. if you look back at before abductions, before near death experiences to early in the 70's as people were beginning to look seriously at death and you look at Elizabeth Kubler Ross a professional who's credited by most people as really changing the medical and academic view of death as something that needed to be that would repay serious attention it was not anomalous at that point, but a change in focus. As she began to work on it and other professionals began to look into thanatology they also particularly Kubler Ross though began to report back anomalous findings strange things and to say this is different from what we've always thought it was like and for a while a lot of people though ah thanatology is going to sort of turn medicine and the academic world on its head with regard to death. It didn't happen and it turned Elizabeth Kubler Ross's career on its head and it's very hard to tell except in retrospect whether professionals who make that sort of move can bring their colleagues with them or even remain committed to bringing their colleagues with them or whether in fact they create a sort of a new alternative community."
