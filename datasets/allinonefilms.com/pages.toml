full_description = "the word cult to me means a group that has a defined membership,a social group, that shares a specific set of beliefs, or you could call it an ideology also. And usually they also share a set of practices that they do together. Possession cult is a term that's important in anthropology because what's been found is that most of the world cultures have organized social groups that believe in and practise spirit possession. Some of the other features that are particular to possession cults are that there's ..people usually come into the cult because they come down with what is called a sort of spirit possession illness. In other words when the spirit possession first occurs, it occurs in sort of an uncontrolled disruptive way and people take it to be an illness. And so they go to the cult for healing. And what the healing usually consists of is a process of gaining control of the spirit possession, so it's not that the spirit possession ends in most cults, but that it becomes a controlled process. And then the cultic practice is mostly getting together and undergoing we're..and in..as a group usually in more or less ritualized way, people become possessed by the spirits. I think the one that's most familiar to Americans would probably be the sort of voodoo or spiritista cults in South America where basically people get together, do a lot of rhythmic drumming, have an alter, and start dancing. And then some of the dancers become possessed, and while they're possessed..while the possession is going on, that's the time when this..when the spirit can be used as a source of knowledge by people in the cult. They'll ask them questions, for prophecies and things like that.. ..make offerings to them of liquour or chickens or whatever. You know it depends. In different cultures it's different. Well they're much less..they're much less common in contemporary North America. I mean I think that the UFO abduction thing is the major..like is the major analogue for spirit possession cult. I mean an anthropologist named Erika Bourignon did a great deal of work surveying world cultures. And she found that actually in most areas of the world spirit possession cults were very common, except for North America and Europe. So.."
