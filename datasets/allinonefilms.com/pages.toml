["https://allinonefilms.com/transcripts/mullin.htm"]
title = "ALL IN ONE FILMS -Transcripts"
full_description = "I think all ancient traditions around the world consider the dream state to be every much as real as the waking state. And they also consider that learning to work with or retain consciousness in dreams and developing certain, if you will, abilities, to work with the dream state, to be every bit as important as the life skills we require during our waking life or during the waking state. So in the tantric tradition coming from India to Tibet when they talk about meditation or spiritual training or spiritual practice, essentially they divide it into three realms, working with the waking state, working with the sleep state and thirdly, working with the out of body state which they call bardo or the in between - in between life and death, the out of body state. Dream yoga, in particular dream training, is very, very important in all of these because, if you will, it's kind of a bridge between ordinary waking reality and the transcendental reality of our other side of our being, the other side of the coin of our waking life. Very similar I think in the Tibetan tradition to how say ancient traditions such as the aborigines of Australia, perhaps the Hopi in Navajo of the southwest here in North America, very similar attitudes. Perhaps a difference with the Tibetan tradition is that it has a very well documented and articulate map to how to work with these situations essentially because India was a highly literate civilization and therefore this was all written about, documented, studied, experimented with and so on in a very methodical manner. The dream yoga training or the dream doctrine training which is perhaps a more accurate translation there's the training in what one does during the day which is learning to (phone interruption) - Essentially what the - the yogi or the meditator is trying to do with the dream yoga is to access the very subtle body of dreams and to be able to use that body as a vehicle to travel to transcendental states of being, either inner psychological realms of one's own being to understand one's own deeper level of one's psyche or else to engage in out of body experiences. And for - I think for ancient civilizations there's nothing odd or unusual about the out of body experience. For us, we consider it to be ah something supernatural or paranormal. But actually it's totally normal in that everyone experiences it. We all have out of body experiences. We just don't have, in our civilization we don't have a - a code, if you will, to crack the meaning of what's going on or to be able to interpret those in our own waking life language, if you will."
