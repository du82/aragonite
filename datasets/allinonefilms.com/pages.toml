["https://allinonefilms.com/transcripts/bullard.htm"]
title = "ALL IN ONE FILMS -Transcripts"
full_description = "[00:20:35] SO MR. BULLARD, WHAT'S THE NATURE OF MYTH? [00:20:43] Myth is the absolute worst term to describe something because it has so many meanings. It ranges all the way from fundamental truth to a complete pack of lies. [00:20:59] The scholarly definition or one of them is a sacred narrative of fundamental truths. It's - but it has so many different meanings for other scholars and of course the popular meaning is that a myth is something that's completely a lie. [00:21:20] But in common usage and in scholarly usage as well, myth often comes to describe a whole complex of beliefs, a belief system. We can speak of the Star Trek universe as being a mythic system because you've got the, you know, you've got your characters, you've got worlds and aliens and situations. [00:21:47] And the whole thing - every part contributes to the other parts and it creates a sort of reality of its own that becomes quite believable. A myth is something of the same thing for say ancient people. [00:22:04] Of course they didn't think of their myths as myths. They thought of them as the way things really were, the explanatory truths of the universe. Ancient Egyptians saw their gods and their ah - their beliefs in the afterlife as being fundamental truths. [00:22:21] DON'T WE DO THE SAME THING? [00:22:22] We do exactly the same thing. The only difference we try to draw is that ah ours can be justified by experimentation and observation whereas myths tend to be less based on observation, more based on faith. [00:22:39] But in terms of say a UFO myth, we have once again a system that works together to explain a great deal of what goes on in history, in the everyday world. We have the idea that aliens came in the past and those ancient astronauts created the world we ah - the world of the past. [00:23:02] They explained a great deal about what the government does today in many people's beliefs. And in that sense what we have is a mythical system where one part explains another and we get kind of a whole, self-sustaining whole that explains everything we need to know about how things are and what they are. [00:23:24] WHEN YOU MENTION THAT MYTHS CAN BE VERY FUNDAMENTAL, VERY FUNDAMENTAL BELIEF SYSTEM, ARE RELIGIONS MYTH TOO? [00:23:36] Yes. Religions are all based on myth. Now of course some people would say that okay, it may be a myth but it's also a truth and we could say the same thing about science as a world view that has some of the same systematic quality of a myth, the same fundamental explanatory values that we subscribe to. [00:24:02] Of course we can argue that science is separate because it does have the obligations to confirm itself in accordance with nature and it does change to accommodate that, whereas ah the traditional myths tend to be supposedly self-evident, unquestionable and that's the way most religions are in fact. [00:24:28] MAYBE THAT'S A GOOD POINT TO - OR SHOULD WE SAVE IT TO THE END - TO GET INTO MYTHOS AND LOGOS AS COMPLEMENTARY FORMS OF KNOWLEDGE. LET'S SAVE THAT TO THE END. Okay. IT MAKES SENSE TO DO IT NOW BUT I'D RATHER DO IT AT THE END WHEN WE'RE NICE AND WARMED UP. Good enough. [00:24:52] THE RELATIONSHIP OF MYTH AND CULTURE. [00:24:56] Okay. Well, myth is the fundamental expression of cultural beliefs. Every culture has its myths, every - every culture has a need to explain, a need to validate its morality, its understanding, its way of life, its customs and in that sense myth provides a sort of narrative structure that provides a connecting link between everything that the people of a culture do. [00:25:39] Some cultures are of course much better organized than others. Ours tends to be a much more ah fragmented culture. To speak of it as a whole, in the term of a whole culture is probably difficult to do today whereas some ah less complex societies can have a very well organized mythical structure. [00:26:04] On the other hand there is a - one theory that myth is a sort of way of thinking that is fundamental to all peoples and that there is a structural pattern or at least a structural way of thinking that's common to all peoples. So it's a fundamental part of every culture. [00:26:28] CAN YOU ELABORATE ON THAT A LITTLE BIT? THAT WAS A VERY ABSTRACT POINT AND AH - Yeah okay, let's see. [00:26:35] I MEAN OBVIOUSLY WE'RE TALKING ABOUT SOMETHING THAT IS VERY ABSTRACT. [00:26:41] Yeah the - the mythic structure that is supposedly a part of the way we think, it's also a part of the way we create language and kinship structures, according to Claude Levi-Strauss. [00:26:57] It's simply inherent in us. It's how we organize all our thinking and with myth in particular it operates through the ah - through the narratives that people tell and it become a form of logic that organizes knowledge. [00:27:20] WHAT DO YOU MEAN BY NARRATIVES THAT PEOPLE TELL? WE CAN GO BACK TO HOMER. EVERYBODY IS FAMILIAR WITH THOSE NARRATIVES BUT AH I THINK WHAT YOU'RE REFERRING TO IS STORIES OF UFO REPORTS OR STORIES OF ANYTHING THAT ARE ANECDOTAL FIRSTHAND EXPERIENCE THAT SOMEHOW REFLECTS - REFLECTS A MORE FUNDAMENTAL TRUTH OR A FUNDAMENTAL LEVEL OF UNDERSTANDING. OR REFLECTS A FEAR ON ONE HAND OR SOME KIND OF WISH ON THE OTHER, NO? [00:27:53] In modern culture we have a great deal of reliance on abstract thinking. We tend to express things as logical propositions, mathematical equations. Scientific reasoning works that way. [00:28:11] But that's a very recent innovation. A lot of people in the past relied on narratives to provide the kind of organization that deduction now provides. The stories that people tell interrelate many different aspects of life - morality, the physical world, the - the divine or spiritual realm. [00:28:38] These things all put them together according to a supposedly inherent pattern and works just as well as logic by putting these, you know, these pieces of concrete imagery together in ways that, you know, they don't look like what we would consider a logical argument yet to the people who use them. [00:29:04] They have the same explanatory power, the same logical compulsion that you get in ah, in a deductive argument. [00:29:15] HOW DOES THAT WORK WITH UFOs, YOU KNOW, NARRATIVES OF UFOs. LET'S GET SOME CONCRETE EXAMPLES. [00:29:21] Okay. In UFO stories the idea - well many of them were just basically explanatory. You know, why don't we know what's going on with UFOs? Because the government is hiding a great secret. They don't want us to know some particular ah great disturbing fact. And so that explains a great deal of what goes on. [00:29:47] We even have these arguments that President Kennedy was assassinated because he was going to ah reveal the secret of UFOs. [00:29:57] These ah - these UFO stories become the basis of our fictitious literature. The movies, a great deal - like Independence Day. There again you have, not even the presidents knows that we have the captured alien spaceship from Roswell. [00:30:17] So a great deal of explanatory force goes into that. There's this huge conspiracy that explains everything the government actually does and it's all based on UFOs according to UFO believers. [00:30:31] The same thing with the ancient astronauts. How did the Egyptians build those pyramids or the Easter Islanders raise those huge statues? Well, it's the aliens that did it. It's an explanation that is very compatible with our ideas that there has to be a complex technology behind this, that primitive peoples couldn't do these great monumental works. [00:30:56] That aliens with ah laser saws and levitating beams would have no problem stacking, you know, huge mounts of blocks each weighing two and a half tons or more, into a pyramid. [00:31:11] So there again it - it's a fairly simplistic thing but the way that UFOs have become mythical in an explanatory sense. But it's still a part of the same - the same pie that we see all though history of people using myth as a way of thinking about the world. [00:31:36] THAT'S VERY GOOD. … YOU HAVE WRITTEN THAT REGARDING UFOs AND MYTHS THERE'S REALLY TWO DIFFERENT QUESTIONS AT WORK. Oh yeah. [00:31:57] Yes. Now there's no question that there is a mythology of UFOs. There's a tremendous belief system that surrounds the things. We have beliefs that certain events happen, that there was a Roswell, that ancient astronauts have come down to earth. We have all the particular stories. Many of them are elaborated, many of them are interpreted in terms that the myth supports. [00:32:28] We certainly do a lot of thinking about UFOs and much of what we say about UFOs involves that thinking and that thinking involves the beliefs of the mythical system. [00:32:40] But underlying all that there is still an experiential side as well. People do see things in the sky. People see some very strange things in the sky. [00:32:50] Some of them don't lend themselves readily to explanations in conventional terms. Btu we've sort of lost sight of that because the ah the mythology has become so pervasive. You can't go into the grocery store without looking at some tabloid that tells you about, you know the president is an alien or ah people are having, you know, babies from their alien spouses and such - [00:33:18] MY FAVOURITE TABLOID HEADLINE IS, I DON'T REMEMBER WHICH ONE IT WAS IN BUT IT WAS IN ONE. IT WAS DWARF RAPES NUN, ESCAPES ON UFO. [00:33:32] (laugh) Exactly. It's the kind of thing that's become such a part of our culture that you know, you could have alien head salt and pepper shakers. You could have postcards and birthday cards with alien greetings and cartoons in the newspaper. It's just everywhere. [00:33:50] There's just no getting around it. We have all these beliefs and these beliefs tend to cloud the actual experience of whatever people see. This has been true all through history. [00:34:01] Like in 1897 when people saw strange sights in the sky they called them air ships. They described them in terms of the air ships that people expected to see at that time. [00:34:14] In the 19- around the time of World War 1, people expected either, you know, German ah - the German airships or airplanes to be intruding on their territory and that's what people saw. [00:34:30] In the 1930s the ghost fliers were supposed - [00:34:33] '40S, '40S. GHOST ROCKETS. [00:34:36] In the 1930s were the ghost fliers. … [00:34:39] Yeah. Over Scandinavia. And they were supposed to be liquor smugglers. Big airplanes with headlights that would fly in blizzards and sometimes were seen to land in certain areas. [00:34:52] Then World War 2 you had German secret weapons. And then in - or in axis countries it was allied secret weapons. And then in 1946, ghost rockets again over Scandinavia, although they were fairly widespread that - [00:35:09] AND THIS WAS WHAT PEOPLE EXPECTED Exactly. -BECAUSE GERMAN - THE GERMAN EXPERIMENTATION AT PENIMA. [00:35:15] Yeah the V rockets. [00:35:18] AND THE WORLD WAR 2 V2 AND V1. [00:35:20] So there's been this - All through history there's been this sort of expectations. I mean you could even go back further than that, like the Romans didn't have - didn't see crosses in the sky. But as soon as Christianity became a ah became widespread the prodigies and portents that people saw turned into crosses oftentimes, sometimes elaborated to the point of seeing Jesus nailed to this aerial cross. [00:35:53] All sorts of, you know, battles fought in the sky. All part of the beliefs of the day, the expectations of the time. And that's what it's been then till now. [00:36:04] LET'S - IT'S A PERFECT - AND I WANT TO MOVE ON TO HOW THE MYTHOLOGY HAS DEVELOPED THROUGH THE COURSE OF THE UFO PHENOMENA THROUGH THE LAST 58 YEARS OR SO. BUT BEFORE WE DO THAT, LET'S GO BACK TO - BECAUSE I KNOW YOU'VE WRITTEN ABOUT THE AIR SHIPS. Yeah. [00:36:25] SO THAT'S ONE OF YOUR FAVOURITE TOPICS. SO LET'S GO INTO THE AIR SHIPS. [00:36:29] Okay. WHAT THE HELL WAS GOING ON THERE? HUNDREDS IF NOT THOUSANDS OF REPORTS TALKING TO INVENTORS AND PEOPLE COMING DOWN AND THEY'RE INVENTORS AND THEY EXPLAIN - YOU TELL ME ABOUT IT. WHAT WAS GOING ON? TELL ME ABOUT WHAT HAPPENED DURING THE BIG AIR SHIP WAVE OF 1896-97. [00:36:50] Yeah. From November of 1896 until, oh middle of summer of 1897, there was this massive wave of phantom air ship sightings all across the country. [00:37:03] WHAT DID THEY LOOK LIKE? [00:37:06] The air ships were described as very strange devices, I mean they were things that would never have flown. They combined the - the gas bag of the lighter than air air ship and a gondola or boat underneath. But they often also had flapping wings, sometimes very large flapping wings, bat wings and swallow tails on the thing. [00:37:31] So it was a very fantastic looking device. It also had a big headlight at the front and sometimes some smaller lights along the side. And - [00:37:44] WERE THERE ANY SKETCHES, BECAUSE ALREADY LIGHTER THAN AIR SHIPS Oh many of them -I THINK WERE ON THE DRAWING BOARDS. SO THERE WERE SKETCHES OUT THERE OF WHAT THE DIRIGIBLES WERE GOING TO LOOK LIKE ONCE PEOPLE GOT THEM UP. [00:37:57] Yeah. Ever since the Mungolfi 8 balloons went up in 1784, people started trying to design a steerable air ship. And the idea of an elongated balloon was something that came out quite early by 1800, that it was there. [00:38:15] The idea of a, of a flying machine was an expectation that was current throughout the entire 19th century, was supposed to be something that, well, it's obvious we're going to - we're going to accomplish this. [00:38:30] Yet all along with all these designs, every inventor in the country in some barn or backyard was designing and airship. Every town had had its little Darius Green and with his flying machine. And yet none of them flew. [00:38:47] You know you had all these other remarkable inventions that just popped up out of nowhere like the phonograph, the light bulb, the x-ray, things like that and people were just amazed at all the wonders. [00:38:58] Yet they were expecting the airship and it just wasn't - it just - it was always a disappointment. There were lots of people trying them and there were minor successes but there was never anything really spectacular, until late in the century you started getting these rumours. [00:39:18] Like in 1892 there was supposedly German airships flying over Russia and the Russians were even shooting at the things. And there was supposedly one that passed over Warsaw and showed a big searchlight in 1892. [00:39:33] And then in 1896-97 they started showing up in the United States - WHERE? [00:39:40] First over San Francisco. Then people would say that they could - [00:39:43] THERE'S A POINT THERE. [00:39:46] People could say that they could hear voices and they could see the design of the thing. Obviously someone had finally succeeded with this. And the story got out that, well ah he must be flying from California to Washington to patent the thing and is having fun showing people all the - showing people all over the country what t"
