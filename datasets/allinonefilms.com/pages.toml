["https://allinonefilms.com/transcripts/hawking.htm"]
title = "ALL IN ONE FILMS -Transcripts"
full_description = "ALL IN ONE FILMS -Transcripts <!-- --> <!-- body { margin-left: 8px; margin-right: 0px; margin-top: -8px; vertical-align: top; } --> I think I knew from about the age of 9 or 10 that I wanted to be a scientist. And probably from about the age of 15 that I wanted to be a physicist. Because I wanted to understand the basic problems of the universe. And try to understand how the universe works. I don't quite know how you define that. Most of my activity is like playing with model fireworks, or model railways or model planes. Or playing complicated games. I was angling at some way of finding out how the world worked around me. I was never very good with my hands. So my models did not work very well. But I was always interested in models that I could control. Where I think that nowadays I have translated that into studying physics. Because in a way if you understand the universe, then you have control of it. WHAT EXACTLY, LET'S BACK UP A LITTLE BIT OR LET'S START GETTING INTO PHYSICS, WHAT EXACTLY IS IT THAT A THEORETICAL PHYSICIST DOES? What a theoretical physicist does is try to construct mathematical models which represent the universe. And which describe the results of observations. And we can say a model is a good model if it has few arbitrary elements, and if it describes all the observation so far made. And if it predicts the result of new observations correctly. TRADITIONALLY, MUCH OF WHAT YOU SAY A PHYICIST DOES, TRY AND UNDERSTAND WHY THE UNIVERSE IS THE WAY THE UNIVERSE IS, HAS BEEN THE SUBJECT OF RELIGION, AND THERE HAVE OFTEN BEEN CONFLICTS BETWEEN ORGANIZED RELIGION AND THE CHURCH, GALILEOFOR INSTANCE, YOUR PREDECESSOR, 300 YEARS. 20TH CENTURY PHYSICS SEEMS TO HAVE MORE IN COMMON WITH MYSTICISM THAN MATERIALISM. WHAT ARE THE PRINCIPLE PHYSICAL IDEAS THAT HAVE OCCURRED IN THIS CENTURY THAT HAVE SHAPED THAT? I don't think physics has much contact with mysticism. In fact it's really the very opposite of mysticism. Physics aims to find a rational model for the universe. And mysticism aims to describe the universe basically as a mystery. I think in a way physics has been a progress away from mysticism. Towards a rational understanding of the universe."
