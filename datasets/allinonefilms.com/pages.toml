["https://allinonefilms.com/transcripts/ferguson.htm"]
title = "ALL IN ONE FILMS -Transcripts"
full_description = "ALL IN ONE FILMS -Transcripts <!-- --> <!-- body { margin-left: 8px; margin-right: 0px; margin-top: -8px; vertical-align: top; } --> YOU WERE TALKING ABOUT HOW PEOPLE LIKE TO WRITE A CHEQUE AND NOT A VERY BIG ONE. AND I, IN THE WEEK I'VE BEEN HERE, I'VE SPOKEN WITH PEOPLE WHO THINK THAT THAT'S WHAT'S REALLY AT THE HEART OF WHAT'S GOING ON. IF YOU HAD TO CUT AWAY THE CHANNELLERS AND THE CRYSTALS AND SOME OF THAT STUFF, WHAT'S REALLY AT THE HEART IS THAT PEOPLE HAVE COME TO THE REALIZATION THAT THEY HAVE TO DO IT. There is no free lunch. And I think I've lived in Los Angeles since 1968 and I remember how many times I have thought how many people in this city, if somebody said to them if you wrote out a cheque and you could make time payments for several thousand dollars over the next 5 or 10 years, this city would have clean air, how many people would do it. Because it's a very important part - it's a wonderful placse to live. And that's a really serious problem. I just came back from Brazil and in Brazil in San Paulo and Rio which used to have a terrible smog problem there is no smog problem because they went to alcohol fuel. And this is something they recommended in terms of part of the Clean Air Act but who knows how long it's going to take. I feel that ah living here on this particular hill that I live on in Los Angeles is a real education. Mount Washington which is this immediate neighbourhood was found in the 1960s with another Los Angeles community to be the most representative mix of ethnic groups, representing the entire country of any one community. And then later sociologists from Harvard came here in the sixties to study why there was no problem with integration. And so I think we have all the problems here. In a sense many of the problems of the world are represented right here in my neighbourhood. And we hae at the bottom of the hill we have graffitti and we have violence and we have in Los Angeles I think every - every problem of every ethnic group. When you see it and you deal with it and you read the newspapers day after day and do as I have done and read for international news as well and to begin to look for the patterns then you see that it's the same old stuff. So this gets to what I think is really the key which is understanding the human being. Since I started writing about the brain in the early 1970s and publishing .... my bulletin, I've been very very interested in learning how do we learn, how do we get emotionally sick, what do we have to do to get well? What goes on in the physical brain is reflected in the positive and negative experiences in the outer world. And what I saw was that for_example in the 1988 election in the Untied States there was a lot of critique during and after. And what all the critics wer e saying was - well there were two questions. Like where are the ideas or the vision and where are the values? And it didn't matter which party it was - the same thing applied, that the parties were not even really holding true to what they believed."
