title = "ALL IN ONE FILMS -Transcripts"
full_description = "Lucid dream simply means dreaming while knowing that you are dreaming at the time. So knowing that you're dreaming - Lucid dreaming means while knowing that you're dreaming. So that means while the dream is happening, you're fully aware of the fact that you are in a dream and therefore it's all in your mind and that you're independent of the world around you and that you can do anything that you can imagine essentially. Well in most dreams, we don't know that we're dreaming. We think we're awake. We don't think anything about it. We explicitly just assume we're awake just as right at this moment you assume you're awake, right? You make the same assumption while you're in a dream, until something strange happens perhaps and also if you know what your dreams are like enough, you're likely to naturally notice from time to time, oh yes, this is one of my dreams and realize it that way. Well, once you know that you are dreaming then you're able to make use of the unique opportunities of the dream state. You see, in the waking state, for example, there are various constraints on my behaviour such as the laws of society and the laws of physics. So I don't float into the air now because of the laws of physics and I don't float into the air now either because of the social contract of what we're doing here. But if I were to be in a dream now, I'd be doing the same thing unless I knew I was dreaming. Then I would stay awake. But there's no reason - this film isn't going to do us any good here so it wouldn't make sense to continue to follow that particular set of laws. So then I'd be free of the usual constraints that come in the dream from our assumptions that we assume that we're awake and therefore that the usual laws apply. For instance, in terms of the laws of society while we're awake and in public, we have - there are many things we cannot do. Whereas in privacy, we have much more freedom and a dream is the most private experience you might have but you have to know that it's a dream in order to make use of that opportunity."
