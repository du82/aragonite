title = "ALL IN ONE FILMS -Transcripts"
full_description = "I think we are today in a time of very exciting re evaluation of both sexuality and spirituality. I think we're all familiar with the conventional take on sexuality, which is, to put it mildly, not a spiritual one. What I mean by that, it's certainly not associated with the sacred. If anything, it's associated with the obscene. But I mean by that that it isn't even very often associated with what we consider spiritual connection, even any kind of a connection but with contempt for women, with violence, with hate, domination. And you know, it isn't just pornography or the sex and violence in the media. If you look at something that we take so for granted like that quote, innocent cartoon of the caveman, on one hand he's got the weapon, violence. On the other hand he's dragging a woman by her hair. So before a child can even form a ... picture, there it is, sex and violence, sex and domination. Nothing about sex and spirituality. BEFORE WE CONTINUE ON DOES THIS IN YOUR MIND EXTRAPOLATE OUTWARDS BEYOND RELATIONSHPS BETWEEN TWO PEOPLE. DO WE SEE IT AS IT REFLECTS SOCIETY AS A WHOLE TODAY? We see that and that of course is one of the central motifs of my work that sexuality, spirituality are how we perceive this, how we behave. It's not something that happens in a vacuum, it happens in a social context and that there is this interactive relationship between what I would call the social construction of sexuality and spirituality and the larger society. So yes, if you have this model of one half of the species dominating violence even as in that cartoon, the other half of the species, a child can internalize what is a model for all human relations on a very deep, unconscious level. And then it can become generalized to where any form of difference, not just gender based difference race, religion, it becomes automatically equated with superiority inferiority. Tremendously. And we're only beginning to look at values. You know, there's so much talk today about values. But the social construction of gender relations and sexuality of spirituality as a field of inquiry relating to economics is only beginning now. In periods of dominator what I call dominator regression, because I have two basic models that I talk about the partnership and the dominator models you begin to see a lack of funding, a withdrawal of funding for stereotypical women's work. Why? Because in the rigid dominator mind set, women's services caring for children, no money for those, right? Caring for the sick, again, quote women's work or environmental housekeeping, there the head of the households do for free. Now it's not conscious all of this but it's time we became aware of how all this interconnects."
