full_description = "ALL IN ONE FILMS -Transcripts <!-- --> <!-- body { margin-left: 8px; margin-right: 0px; margin-top: -8px; vertical-align: top; } --> When we began filing freedom of information requests in 1975, we didn't quite know what we were going to come up with. We were working with a lot of public material, material that some of it had appeared in national tabloids. In all, not the most credible sources, but we had many stories and we prepared requests using the regulations that we had studied on FOYA and the US code, and eventually we sent out several dozen letters to different agencies. I estimate at least a dozen different U.S. government agencies, and within weeks, we began receiving a flow of material. One in particular which was fascinating was a release from the joint chiefs of staff, a set of documents describing incidents in 1975 over flights of U.S. bases and I looked and said wow, where did this come from. So using material in the documents provided, I requested additional material from the air force and a flow began that didn't stop for about two years. We ended up with hundreds of pages of materials describing essentially UFOs, flying saucer type objects buzzing military installations in both the United States and Canada. And the incidents were regarded as quite serious. In some cases, the sightings could be explained, in my opinion, after studying the documents we saw reports of lights in the sky that could very well have been planets, stars, or whatever, but in other cases, you had objects of considerable size being seen in some cases, radar trackings occured, certainly couldn't say these were celestial objects. They were physical objects close to the base. The air force didn't have explanations for all of the sightings, and the sightings eventually disappeared after about three weeks and we were left with a big puzzle. Some of them leaked to the press. We found evidence of press coverage in Maine near Long air force base, in Montana near Malstrom air force base, which involve sightings near missle silos. But the sightings reported in the press never alluded a great deal to the military reports. There were civilian spillover reports, people outside the bases having seen the same objects without being aware that military personnel had reported the same thing. And it was made policy within the government that whenever sightings were discussed with military personnel, there would be no connection made between base sightings and civilian sightings. This to remove alarm."
