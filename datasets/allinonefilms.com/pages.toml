["https://allinonefilms.com/transcripts/harrison.htm"]
title = "ALL IN ONE FILMS -Transcripts"
full_description = "[00;40;37] IN YOUR BOOK YOU DISCUSS THE RELATIONSHIP BETWEEN SETI AND THE UFO PHENOMENA BUT YOU COME AT IT FROM A SLIGHTLY DIFFERENT WAY. [00;40;50] My discussion of UFO phenomena in my first book After Contact, the chapter on UFOs is called False Alarms. And essentially it's not a nasty but a very sceptical kind of discussion. [00;41;09] What people have to keep in mind is that there's a great desire within the SETI community to distance themselves from UFOs. I felt that it would be inappropriate to not mention UFOs at all. And I also am not particularly drawn to UFO bashing, making fun of UFOs. People believe in them, and take them seriously, we have to understand that. [00;41;31] But I think it is necessary to take sort of a sceptical stance in evaluating the evidence that's presented in favour of UFOs. [00;41;40] The scientists who are actually involved in SETI would be very happy if all notions of UFOs disappeared off the face of the Earth instantly. We have to look back at the history of SETI to understand this. [00;41;54] That is, if we go back to 1960 the idea of life out there was not accepted within science. It was not something that most scientists believed in. There were two watershed events, in 1959 and 1960. The first was a paper that showed that it was plausible to communicate over interstellar distances by means of microwave radio and the second was Frank Drake's actually search, Project Osma. [00;42;20] Now to gain recognition for this kind of activity, it was very important to establish it as science and to distant it from other kinds of activities that were associated with naïve and uncritical types of thinking. [00;42;36] So what we find within -within the history of SETI is a real desire to minimize association with UFOs. And this has manifested itself in different ways at different points in history. [00;42;50] I think what you find from SETI scientists now is largely non-responsiveness to the topic of UFOs as compared to ridicule and more assertive kinds of responses which tend only to excite the UFO community rather than to quell it. [00;43;05] So what we have is an interesting situation where we have two groups of people who hypothesize that we're not alone in the universe, have very different views on what constitutes evidence and standards of proof.Some have drawn conclusions that there's evidence of extraterrestrials while others are saying, well we're still looking and once we have confirmation we'll be happy to breakout the news. [00;43;34] So it's - [00;43;35] YOU USE THE WORD, YOU USE THE WORD POLITICAL. [00;43;38] Sure. I would use the word political because it has to do with institutional politics, getting money from the United States government, being accepted by the United States Congress, getting material into high quality journals, recruiting graduate students and getting them going in worthwhile careers. [00;44;03] Very definitely politics in terms of gaining support from the larger community as well as institutional politics within science itself. [00;44;11] WHAT ABOUT THE ASSUMPTIONS OF THE SETI SEARCH? THERE ARE SOME UNDERLYING - [00;44;15] Sure. The assumptions of the SETI search are minimal and this is one of the things that distinguishes it from Ufology. Within SETI there is the hypothesis really that extraterrestrial life exists. There's a lot of evidence that's circumstantial but no smoking gun. [00;44;38] SETI has a fairly long rationale with different pieces being fit in at different times and the overall rationale being strengthened and tweaked. There’s an assumption that this life can be detected by means of radio telescopes, and optical telescopes looking for laser flashes and if we look long enough and hard enough we'll find evidence of E.T. if in fact E.T. is there. [00;45;04] BUT E.T. IS SENDING SIGNALS TO - [00;45;06] E.T. would have to be sending signals in our direction, a beam that we can intercept. One of the exciting developments is new technology that's about to go online, particularly if they are able to actually develop the square kilometre array able to detect leakage of communications between two other civilizations. [00;45;30] We'd be able to detect leakage between two other civilizations and - [00;45;35] WAIT A MINUTE. ISN'T THERE A ROOT ASSUMPTION HERE THAT CIVILIZATIONS OUT THERE ARE COMMUNICATING USING THE ELECTROMAGNETIC SPECTRUM? [00;45;43] this is, this is one of the assumptions. [00;45;46] THERE IS ANOTHER ASSUMPTION THAT CIVILIZATIONS OUT THERE CANNOT BREAK THE SPEED OF LIGHT BARRIER. [00;45;54] There's that assumption also. But to deal with the first assumption that you mentioned, the standard response to that is that since we already have this equipment we can look right now. Now maybe there will be other kinds of communication technologies that we will discover. [00;46;13] When that happens we can try those techniques. But right now here's what we can do and here's methodology that we think will work. We hope that these civilizations are using our communications techniques. But if they're not, we're going to have a hard time finding them until we discover how they communicate. [00;46;39] THE SECOND ASSUMPTION BEING THAT THEY CAN'T GET HERE OR CAN'T GET ANYWHERE. [00;46;44] There's - [00;46;45] THAT ESSENTIALLY WE'RE ALL ISOLATED BY SOMETHING THAT FALLS OUT OF RELATIVITY. [00;46;52] Astronomers tend to be much more aware of the magnitude of interstellar distances than say you or I. And I think it's very, very hard to grasp what a light year is, never mind a thousand light years. [00;47;10] And we do know, for us right now space travel is incredibly expensive, particularly if you're in a rush. You can set something drifting for 70,000 years and it may eventually reach some place interesting. [00;47;24] But there may be ways around this. Things like worm holes and warp drives that are very controversial. They vary in terms of - [00;47;36] … SCIENCE FICTION BASICALLY. [00;47;39] Well, there are some people that are really working hard on worm holes. Claudio Macconi who is an Italian researcher, very much involved in SETI, very respected, is interested in the possibility of communicating through worm holes as is Eric Davis an astrophysicist in Texas. [00;48;03] Eric recently completed a study of various possibilities and people who did not read the studywere immediately outraged. Maybe also some people did read the study. [00;48;16] I'm not a physicist and I can't really evaluate all of the arguments, but what impressed me was he was that Eric was very careful to note some of the difficulties and problems in terms of energy requirements, weird kinds of matter that we can't make or we can make in very small amounts but not the required gargantuan amounts, and things like that. [00;48;41] And actually a conclusion is that worm holes seem to be the most promising, not that we could create one tomorrow. One of Eric’s desires is to do some experimental research on this. [00;48;54] I think that when we look at the whole idea of extraterrestrial visitation which is a loaded term so shall we say interstellar probes it would not be necessary for ET to launch thousands of probes in every direction for one to arrive here. [00;49;17] We're getting to a point now where we ourselves can target promising stars and planets. We can do this by looking at the kinds of chemical reactions that are going on near them. We can look for bio indicators, indications of life. We can look for chemical signatures that are suggestive of industrial activity. [00;49;41] And so as we get better at detecting these planets we can send probes off in their directions. [00;49;48] We are becoming good at creating small smart probes. We will be able to launch many probes off before too long if we so choose and some of them will have a chance of getting through. [00;50;07] By the way, since this is a conversation, are you looking at active SETI which involves broadcast and launching probes? This is one of the most controversial things going on in SETI right now. There’s very heated discussions going on in private and in public. [00;50;27] And it has to do with techniques where we broadcast our presence and there's been a number of such broadcasts, largely coming from the Ukraine, a number of cosmic calls sent out with a very high powered radar transmitter including such interesting contents as resolution passed by New Mexico legislators on dedicating the extraterrestrial highway - music, singers, flags, messages from individuals, greetings I believe from Hugh Downs. [00;51;10] And these are going out at fairly regular intervals. Oh, and a Theremin concert. Now the Theremin is an electronic device which emits various noises of different pitches and intensities depending on how you move your hands. [00;51;24] Peoplein the Americas, people know about the Theremin from science fiction and horror movies. Well Prof. Zeitsev who's been running these broadcasts has included a Theremin Concert for E.T. [00;51;42] And he chose the Theremin because - the way I describe it is it whistles its way through the universe. It seems to have nice radio characteristics - [00;51;51] WHOOO. [00;51;51] Exactly.Whooo-oo. And what's interesting to me is that in Russia the Theremin is a musical instrument of refinement and culture. It was supported by both Lenin and Stalin and believe me, they were the opinion leaders in the '20s and '30s. But in the U.S. it was largely used in movies about demented people and things like that. [00;52;12] But I'm sorry - [00;52;14] WE'RE ON ACTIVE SETI. WHAT INTERESTS ME ABOUT SETI IS THE WHOLE PRINCIPLE OF DESIRING EXTRATERRESTRIAL CONTACT. AND THAT BRINGS ME TO THE QUESTION, YOU AS A SOCIOLOGIST OF ASKING WHERE DO YOU THINK THIS DESIRE COMES FROM? [00;52;33] To me because I share fascination with the possibility of life beyond Earth. I think that SETI attracts many people because it - [00;52;45] I'M JUST TALKING ABOUT THE WHOLE IDEA OF EXTRATERRESTRIAL CONTACT WHICH IS MUCH OLDER THAN SETI. WHICH GOES RIGHT BACK TO THE GREEK (OVERLAP)… [00;52;52] Sure as far back as you can go to the earliest sky gods there's always been interest in superior forms of intelligence beyond Earth. [00;53;00] I think what's happening is that we're at a particular point in time where we think science can help us answer the kinds of existential questions that have been with us essentially forever: who are we? How did we get here? Are we alone in the universe? Religions once answered this. [00;53;23] Myths try to answer this. If you look at some of the UFO material it's thinly disguised religion with angels and demons coming down to guide us, warn us or whatever. And I think this helps make SETI very very attractive. [00;53;40] The scientists involved in SETI work very hard to distance themselves from myth and religion for the same reason that they try to distance themselves from Ufology, to maintain it as a strict scientific enterprise. But SETI too could tell us something about our origins, who else is out there and possibly our destination. [00;54;01] So you've got this quest which searchers see as a natural, logical progression in science, another step forward beyond Copernicus, beyond Darwin. A great leap forward to show that, that natural processes hold throughout the universe, not justlocally. [00;54;23] But it has all this extra meaning for so many of us. SETI people can keep themselves under control. The rest of us get enthusiastic and sometimes it's very easy to get carried away. You know, what about this, what about that? [00;54;39] WHAT WOULD HAPPEN THOUGH IF EXTRATERRESTRIAL VISITATION COULD BE PROVED IN THE NEAR FUTURE? [00;54;48] I think that - [00;54;49] THAT IT'S ACTUALLY BEEN GOING ON. [00;54;51] Sure that if it's been going on many people would not be surprised because roughly 50%, give or take a few, already believe that this is happening. To me a key factor would be how the news was broken. If it was a slow dawning realization that this was going on where one after another people start saying, gee, I think the evidence really points this way then it would not be catastrophic. [00;55;28] If people felt that the intelligence was roughly similar to ours, not something totally strange and unfathomable, if anthropocentric biases proved true, if they were like us, just like people in rubber suits or something like that, if they were not malevolent then I think it would go over well. On the other hand - [00;55;50] LET ME THROW YOU A WRENCH INTO THAT. WHAT ARE THE CHANCES OF THAT HAPPENING? I MEAN THEY COULD BE, YOU KNOW, CARBON BASED LIFE, BICAMERAL, YOU KNOW, … BICAMERAL BECAUSE THAT COULD BE BUILT INTO THE MORPHOLOGICAL LAWS OF A BIOLOGICAL FORMATION. BUT THERE'S NO GUARANTEE THAT THEY'RE GOING TO BE AT THE SAME LEVEL OF TECHNOLOGY AS WE ARE. IN FACT, THE CHANCES OF THEM BEING ANYWHERE REMOTELY CLOSE TO WHERE WE ARE ARE PROBABLY INFINITESIMALLY SMALL. THEY ARE LIKELY TO BE WAY AHEAD OF US AND IN WHICH CASE WHAT WOULD BE, YOU KNOW, THE GROUNDWORK FOR COMMUNICATION AND ARE WE NOT TALKING ABOUT IN TERMS OF ANY KIND OF DAWNING REALIZATION OF CONTACT ARE WE NOT TALKING ABOUT A SIMILAR KIND OF SITUATION WHEN … POLYNESIAN TRIBES ENCOUNTERED RELATIVELY TECHNOLOGICALLY SOPHISTICATED EUROPEANS. IT'S YOU KNOW, DISASTER TIME. [00;56;47] Yes visitation - certainly a lot of the assumptions and expectations that are attached to SETI go out the window if they show up. Particularly if it was sudden, particularly if they were very strange, particularly if we weren't sure how they were going to react towards us, it could be quite catastrophic in terms of the world as we know it. [00;57;15] But of course, if you look at SETI scientists they don't really expect this to happen. [00;57;19] WELL ONE OF THE ARGUMENTS WHICH I TOSSED AT ONE OF THE SETI ASTRONOMERS YESTERDAY WAS, YOU KNOW, WHY WOULDN'T THEY - IF THEY WERE HERE WHAT WOULD THE REASON YOU KNOW, AND HE SAID - HIS RESPONSE WAS WELL IF THEY WERE 