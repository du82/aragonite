title = "ALL IN ONE FILMS -Transcripts"
full_description = "I can say the drumming are inherited because I started very young. I start ...... I was 5. And ah they made me a small drum .... Then I sat behind them doing my own thing. At the age of 9, I started playing the big tall drum called achimavu. That is master drum. In fact that was that came just almost .... because the master drummer who was to play the drum went to school and we have to do some celebration for a religious dance. There is a celebration and they need a drummer. So I jump up, try to do my own thing and .... the first one to stop me but when they saw that I'm on the track, they were happy and they put blocks up for me to reach the top of the drum. That's how I started drumming at the age of 9, I started drumming. The drum drum and religion okay drum if I can say music and religion are inseparable. You can't separate them. They are one. They move together. We feel God work through music than anything else. So religion and music can't be separated. Yeah. In Africa, or let's say in Ghana especially my tribe, everybody takes part in drumming and dancing. So when we go for a performance or there is a drumming we see all the people almost all the people taking part in it. Ah music, as I have already said, is happiness. I feel happy when I'm playing music because it makes me forget everything especially anything which worries my mind. When I'm playing .... even if I'm sick, if I'm sick, I always play music. Sometimes the sickness go away entirely. So music is happiness to me as I've already said. WHAT DO YOU THINK OF WHAT WESTERN CULTURE, EUROPEAN CULTURE DID TO RHYTHM. THEY KIND OF THEY KICKED RHYTHM OUT OF THE BACK DOOR AND MADE IT NOT VERY IMPORTANT IN THE MUSIC EVEN THOUGH OF COURSE IT'S IN THE MUSIC ALL THE WAY BUT IT'S NOT IT'S NOT LIKE THE REST OF THE WORLD. I can say that Western music, what I've seen about it is that one thing, they haven't got a rhythm on which they build the music. They have to get a beat which will be part and parcel of every instrument. But that is not the case. All right, in the Western world too all they do is they respect I mean paper the paper in front of them more than the instrument which ... is no good. Because if you do away with that, it's something if you need it you can't do it. The song I'm going to sing is the instrument. You know it in your head. It's a matter of practising it and you can avoid the paper and concentrate on your music. But there is a way or there is a thing, you see them respecting the paper in front of them more than the instrument they are holding. And there will be a time maybe you are going to a place and all of a sudden that paper gets lost. Your instrument is with you. You get the instrument all right and the people are going to do a concert. The people are already around and the paper is not there, the instrument is there. Okay, right now the instrument will tell you, well now I am here, go on play your paper. You get what I mean? So something they can in fact I know I believe they can really change."
