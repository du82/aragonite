title = "ALL IN ONE FILMS -Transcripts"
full_description = "Well the mystery school is a convention that is also an experiential retreat where magicians, people who are interested in stage magic and also magic, can come and reflect upon their involvement and hopefully in the process discover new ideas and grow. And of course when we grow, things change. Yes, I think it is. Maybe not for everybody but I think for some people change is possible, you know. During the 20th century magic became - fell under the rubric of comedy and as the comedy quotient in a magic routine goes up, very often but not always, I mean there are exceptional cases but very often the msytery quotient goes down. And so we find ourselves at the end of the 20th century involved in conjuring magic, sleight of hand, stage magic wherein there's not very much mystry any more. It's all about comedy. And although I think that is wonderful, I think there's room for a lot of people at the table. And my work does have comedic elements certainly but I think there's mystery in life and in magic. I want to bring more of that into my own work. Magic is about mystery not tricks. Yes I think that's true. Ah magic takes places place in people's minds. The trick provides the catalyst for a magical experience sometimes. But again, if you're not aiming for a magical experience you just might get a laugh and a laugh is not always a magical experience, though on rare occasions it might be. In the sense that magic, magic is about mystery in the sense that magic like all human behaviour is representational and symbolic. It points beyond itself. When we look at, for instance, neanderthal barrios, these people being buried in certain ways with certain artifacts with them and then we discover that not only were they buried that way one place, they were buried that way several places separated in time and space. Well then we say, well look, this behaviour, this human behaviour, has to have had some meaning for the people who did it. Now whether we can recapture that meaning, that's a very different question but positing the fact that human behaviour is symbolic and meaningful for the people who perform it. Now magic is a symbolic activity as well. In the earliest forms of magic, shamanism, magic, you know, as we talk here, grew up around the fires, the camp fires of paleolithic hunter-gatherers. And their magic pointed beyond itself. The trick pointed beyond the trick to a larger mystery, a mystery about life, mystery in life. And that's what I mean when I say that magic is symbolic, that all behaviour is symbolic. It points beyond itself to meanings and that's part of what contemporary magicians have lost. They're looking for a laugh and they're not looking to connect their audience emotionally with larger meanings. Now of course there are exceptions and those exceptions are wonderful exceptions but they're few."
