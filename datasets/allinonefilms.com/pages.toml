title = "ALL IN ONE FILMS -Transcripts"
full_description = "ALL IN ONE FILMS -Transcripts <!-- --> <!-- body { margin-left: 8px; margin-right: 0px; margin-top: -8px; vertical-align: top; } --> Well the basic pattern that..as I've come to see it over all these years is extraordinarily common repeated over and over and over again. I mean it's a pretty absolute pattern. This begins in childhood. The person is abducted in infancy or early years. (ahem) The person is ..the child is taken from the crib or whatever a few times from the hospital as a newborn. And usually is somehow sampled because little scars appear from where evidently layers of cells are taken. And then that person is reabducted at intervals, as if he or she is now a sort of a tracked animal in some cosmic zoological experiment. In later years the physical examinations that take place when that person is taken involve a concentration on the reproductive system. Ova and sperm samples are apparently taken over and over again. And the ..actually the physical examinations concentrates in certain areas and completely skips other areas. For instance the reproductive as I said is always a subject of interest on the part of the UFO occupants, and the head. The nasal cavity, the ears and so on which we beleive are the paths by which implants are put in place. There has never been a case that I have ever run into in 17 years of doing this where the human heart is an object of interest part of UFO abductees which is very interesting becuase if this were fantasy, if this were some psychological thing, obviously our concern with the human heart and the cardiovascular system would mean that some people here and there would have fantasized alien interest, alien EEG's or something but that has never happened. The situation often moves into a more overtly reproductive pattern where a woman might be artificially inseminated, find herself pregnant usually assuming that it happened the normal way but in many many cases that is clearly impossible, there has been no sexual activity and yet the woman is in fact pregnant. And then she is re abducted and the developing fetus is removed, usually before the third month although we have a couple of reported cases that that has happened in the seventh month. And the final step in all of this is that very often the person is reabducted and is shown a small odd child. A kind of hybrid mix. And I know this sounds totally off the wall, which is true of the entire UFO phenomenon to begin with, but there seems to be part..a desire on the part of the UFO occupants to have that person hold the child in some sort of bonding procedure, as if they believe that human touch is efficacious in some way or other. (ahem) We don't know why or what this really means. But it's reported over and over again. That's a very interesting thing, that these little hybrid babies often have hair which is wispy and very pale. And often doesn't cover the whole skull. This is the way it's reported. And it's touching to me that I've had three different women in hypnotic regression sessions describing being handed a little baby with this strange hair but they're holding the child feeling it looks sad or ill or something of that sort. And three different women, all mothers in the real world have said the same thing. They say nobody brushes their hair. They don't brush these children's..they don't understand hair. Their hair is just sticking out. Because every mother would like to smooth and clean and groom and so forth a tiny child. But they don't do this. And that's again one of those little details which is hard to imagine fantasy in creating, cause you get that over and over again"
