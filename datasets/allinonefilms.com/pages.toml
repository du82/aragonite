full_description = "ALL IN ONE FILMS -Transcripts <!-- --> <!-- body { margin-left: 8px; margin-right: 0px; margin-top: -8px; vertical-align: top; } --> in my own heart of hearts, I know something is going on of extraordinary importance here. I don't claim to understand it, I don't even call it extraterrestrial. I don't have language for it. It just know that there's some kind of experiential energy force, beings, intelligence, whatever you want to say, that are entering people's lives, powerfully affecting them. They are authentically reacting with the extraordinarily intense emotions when you give them an opportunity to express, ah, express that. And there simply is nothing in the psychiatric field that can begin to account for it. It's a mystery of the most extraordinary proportions. And part of me, the naive, innocent part of me, says, Why doesn't the profession grasp this, why are they so busy trying to demonstrate that it's child abuse, it's, it's, you know, their parents did this, their mother did this, you know, they've been raped, and they've displaced it on to the - they know better. They know that displacement is an adaptive, coping function, it doesn't invent whole realms of being consistently among thousands of people who don't know each other. It's not what displacement does. They know better. And yet they are so , for some reason, frantically trying not to let this in as some kind of powerful, authentic mystery that they will make up the craziest stretchings of the familiar procrustian beds of their own field to try to fit this into it. And, you know, I'm just astounded at that, in part of my mind. The other part of my mind understands it completely. That's what people do, you know. That's the way ideology works, that's the way world views work . That's what wars are about, wars are about fighting over points of view. The early Christian church had this, ah, you know large numbers of people were excommunicated if not killed over whether Christ was one being, or two beings."
