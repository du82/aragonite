["https://allinonefilms.com/transcripts/jgeorge.htm"]
title = "ALL IN ONE FILMS -Transcripts"
full_description = "Well, I think it was because my wife had been in London where they met a few months before my family took a Land Rover safari across from England to India and which I joined. And when we got the Land Rover there, we hooked up with Trungpa and he stayed with us for three months at the end of 1968. And we went on pilgrimage of the major Buddhist holy places in the Christmas holidays, budgaya, ravini and all around Behara. He was a wonderful guide. And of course he was very young then. I think he might have been 20. But he knew a great deal and he felt a great deal and it was a very alive sort of pilgrimage for us all - Well, I don't think he changed much throughout his life in a way. There was this core of extraordinary sensitivity and ah at the same time as he said himself, all the Trungpas have had trouble with their emotions. And he was no exception certainly. WEll I think the most significant moment of that pilgrimage around northwest India - northeast India, was our visit to Sikkim. And he came with us and we were staying with the chogyil of Sikkim and it was at that time that Trungpa met again for the first time since they were in Tibet, Jilgo Gensai Rimpoche, one of his principal teachers. And we were part of that meeting and it was very touching. And many years later in 1987 we were again with Jilgo Gensai Rimpoche at the cremation of Trungpa at the Tail of the Tiger in Vermont, closing the circle. Well our relationship was at that time he was really part of the family. He was like one of my sons. And I had two others boys and a girl in tow who were a bit younger than him. And he was just part of the family and he would call my wife and I amala and pala. We were that sort of relationship. He had no other family really in exile. And we never specially regarded him as our teacher but we certainly learned a great deal from him and we definitely felt attracted to who he was and who he was becoming. TELL ME A LITTLE BIT ABOUT THAT? WHAT TIP-OFFS WERE THERE THAT THIS WAS SOMEBODY WHO WAS GOING TO BE OUT OF THE ORDINARY?"
