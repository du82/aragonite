full_description = "[00;00;28] LET'S BEGIN WITH THE CONTACTEES. (background talk) [00;00;46] WHAT WAS THE IMPETUS FOR THEM DO YOU THINK? [00;00;52] Inevitably when flying saucers came along there were different kinds of responses to them and one of them was going to be a religious response. [00;01;03] The contactee movement represented a kind of religious - mystical, religious response to the image of flying objects in the atmosphere from some other intelligence presumably. And the contactee movement insisted that these intelligences, or at least the bulk of them, were benevolent and they were God-like beings from other worlds who had come to save us from particular crisises - the particular crises of the atomic age. [00;01;37] Adamski, INTERESTING CHARACTER, FASCINATING CHARACTER. [00;01;43] George Adamski was one of the really fascinating characters of the period. He was a guy who had a long history as a kind of low rent guru in the southern California occult scene. And he later claimed that he had gotten into the mystical business because during Prohi- IT'S OKAY TAKE YOUR TIME. [00;02;04] -during Prohibition it provided him a cover to, to sell wine. But he got into flying saucers as so many of these characters from that period did, when UFOs came along. There was already a southern California occult scene where, because of the influence of the writings of Charles Forte, the great anomalist and the occult writings of Adamski and other theosophists, there was already before flying saucers came along the idea of people on other planets who interacted with the Earth. [00;02;41] So Adamski simply fused these pre-existing ideas with the flying saucers that came along beginning in the summer of 1947. [00;02;52] And in the late 1940s he was taking pictures from his little observatory of flying saucers in the atmosphere, flying saucers nears the moon and was actually publishing articles on his photographs of flying saucers. [00;03;10] This was all moving toward the climactic event on November 20th, 1952 when in the desert in southern California he encountered a landed flying saucer and met for the first time the Venusian, his friend named Orthon who was one of his primary contacts that continued for the next few years and were the subject of a couple of books that he wrote that were widely influential, excited people all over the world. [00;03;41] And in the 1950s, George Adamski was an international occult celebrity. [00;03;46] HOW MUCH DO YOU THINK HIS RESIDENCE ON MOUNT PALOMAR HAD TO DO WITH THE DIRECTION HE WENT IN? [00;03;52] Adamski worked in a restaurant that was at the foot of Mount Palomar, actually some distance, several miles from the actual famous observatory. But the association with Palomar caused many people to think that he actually was associated with the astronomical observatory. [00;04;13] And it gave him among people who weren't paying a lot of attention or who had been a little credulous the scientific association. He also had a telescope. He was an amateur astronomer and so people would believe that his little telescope had something to do with actual astronomers. [00;04;30] Of course the astronomers at Palomar were appalled (laugh) but that's the way it worked and Adamski milked that for all that it was worth. And it was worth a lot to him. [00;04;41] YEAH. IT REALLY MUST HAVE BEEN. I'M GIONG TO GO UP THERE ACTUALLY. I'M GOING TO TRY AND FIND THE SITE. ACTUALLY WE FOUND ONE OF THE WOMEN WHO IF NOT WERE PART OF HIS INNER CIRCLE BUT WERE JUST SLIGHTLY OUTSIDE. BUT SHE LIVES IN A TRAILER PARK NEAR TIMIKULA. [00;04;57] What's her name? [00;04;58] I'M TRYING TO REMEMBER. I'LL LOOK IT UP. SHE'S A GREAT OLD GAL. ACTUALLY TOM SUGGESTED TALKING TO HER. [00;05;04] Lucy McGinnis? [00;05;05] YEAH THAT'S HER. [00;05;07] She was part of the inner circle. [00;05;08] OH SHE WAS? Yeah. [00;05;09] OH OKAY. BUT SHE WASN'T ON THE, ON THE ORTHON JAUNT. [00;05;14] See that was the Williamsons and the Baileys. That's four of them, Alice Wells. God she may have been. I can't think of the sixth name. [00;05;24] I DON'T THINK SHE WAS ON THE ORTHON JAUNT. [00;05;27] OH well here. [00;05;27] WE HAVE A GOOD REFERENCE. [00;05;29] It happens. [00;05;30] … [00;05;34] Let's see. I have a big long thing on Adamski here. YEAH, YEAH, I KNOW. (looking through book) [00;05;40] Actually I'm very proud of the Adamski thing. I think it's one of the best short treatments of his career. Let's see here. [00;05;50] There was some speculation which I don't want to go on … that Adamski was gay. That he would meet with these like ah - when he was touring Europe he'd meet with these handsome kind of pretty blond-eyed young men that ah - [00;06;05] VENUSIANS. [00;06;07] Yeah, Venusians, that's better. Anyway, you read Lou Zinstock's book about her travels with Adamski and the naiveté is just hilarious. (laugh) The whole account is like there's a whole other way to read this. [00;06;24] (LAUGH) A MORE MODERN WAY TO READ IT. [00;06;30] Alice Wells, let's see here. [00;06;55] I guess I don't name them. I just mention the - but I know it was Williamsons and Baileys but I - but Lucy McGinnis was very - in fact she was the one who actually goes throughout some of his books I believe. ------------------------------------------------------------------------------------- [00;08;07] Mostly Adamski in his dealings with officialdom would make people mad because he misrepresented the, the ah - Adamski used everything that he could to enhance his credibility including misrepresentations of his encounters of FBI agents and so on and he infuriated Hoover over this. You don't - you don't want to infuriate Hoover. [00;08;31] (LAUGH) I'M SURE THE FILE THEY MUST HAD HAD - [00;08;35] Oh yeah. And also he made some fairly indiscreet, you know, political comments for the 1950s, you know. [00;08;43] YEAH, YEAH VERY MUCH SO. [00;08;44] All kinds of things so - [00;08;45] YEAH, YEAH. ANYTHING ELSE WE NEED TO SAY ABOUT THE CONTACTEES? THE EFFECT - THEIR EFFECT ON - [00;08;53] I could - yeah go ahead. [00;08;54] THEIR EFFECT ON UFOLOGY ACTUALLY. [00;08;57] Right, okay. Just the politics of it. [00;08;58] YEAH THE POLITICS OF IT, YEAH. [00;09;02] The contactees - yeah okay. The contactees infuriated the mainstream so-called serious Ufologists because their extravagant and often bogus claims made the whole idea of UFOs and interplanetary visitation look ridiculous. [00;09;20] And of course sceptics and debunkers played on this with glee and malice. And so the major mainstream Ufologists of the period such as Donald Kehoe and his organization NICAP, fought the contactees furiously. Challenged them to, for example, polygraph tests which they usually refused. [00;09;44] And ah stressed serious reports by pilots and scientists and clergy and other people with impeccable middle class credentials. Whereas the contactees really - to the contactees there weren't any UFOs. They were identified. They were spaceships flown by friendly people. [00;10;03] Now the contactee movement encompassed a wide range of people with a wide range of motives. Some of them were out and out conmen who were - found fertile territory and were planting new harvests. [00;10;17] Others were people who were - whose motives are a little hard to read. They were sincere about something but weren't reluctant to lie and create phoney evidence to advance their claims. Others were entirely sincere visionaries. These were people who didn't produce photographs of spaceships because you couldn't do that without faking photographs and therefore being at least in part a conscious hoaxer. [00;10;47] But people who channelled material from exotically named space people like Ashtar, these people tended to be sincere, that they were just visionaries. If it had been another time they would have been channelling gods or discarnantes or whatever kinds of superior entities fitted the particular cultural environment. [00;11;13] I SUSPECT THAT SOME OF THEM PROBABLY ENTERED ALTERED STATES SUCH AS THEY IMAGINED ALL KINDS OF THINGS WE WERE TALKING ABOUT EARLIER, SOME OF THEM. MAYBE EVEN Adamski. [00;11;28] No. [00;11;29] Adamski TOO. I KIND OF READ HIM THAT WAY. ALL THESE GUYS, A LOT OF THEM, THE OCCULTISTS, THERE'S A KIND OF AH ENDS THAT JUSTIFY MEANS ATTITUDE TOWARDS THINGS. THEY'RE NOT ABOVE FAKING THINGS IF THEY BELIEVE THE EXPERIENCE THEY'VE HAD IS A REAL ONE, THAT KIND OF THING. [00;11;47] Adamski in some ways, in many ways was just a bald-faced liar. But there were other aspects of his personality that are a little puzzling. He was sincere about something. He really believed on some level in what he was saying. And there are individual acts, private correspondence where he's really kind of letting his hair down and he doesn't come across as an entirely cynical conman. [00;12;17] I think that Adamski in ways contained multitudes, that he was sincere, he was a liar. He was a lot of different things, all competing with each other. But one thing I'm certain of and that is that all of his so-called evidence - the photographs, the footprints in the desert sand and all those things are fake and he was consciously faking them. [00;12;40] He wasn't the victim of someone else's con. It was his own con. But I think that in his heart he did have a sincere kind of mystical vision which incorporate benevolent space people coming to the Earth. [00;12;55] He couldn't prove it, so he faked it. He never got rich. He wasn't in it for the money. He was always poor. He just got by. He basically was the kind of guy who never picked up the tab at the restaurant. But people liked him and I don't think he - [00;13;14] He didn't con any little old lady out of her life savings or anything like that. I think that he was basically in his own way a benevolent man. [00;13;22] YEAH, YEAH. OKAY, GOOD. ANYTHING ELSE YOU WANTED TO SAY ABOUT THE CONTACTEES? I DON'T WANT TO GET INTO TOO MANY OF THEM. I'LL MENTION THEM ALL BUT HE'S THE KEY ONE. I THINK EVERYBODY KIND OF - [00;13;36] Well the other guy was George Van Tassel because Van Tassel was the guy who really organized the contactee movement. That Van Tassel was there just before Adamski and he was the guy who began organizing contactee meetings in southern California. [00;13;54] Van Tassel's at least initial contacts were channelled. [00;13;58] AND LOOK AT HIS RESIDENCE. [00;14;01] Yeah. Giant Rock, California, which really in the 1950s was the contactee centre of the universe. [00;14;07] YEAH;, YEAH. [00;14;08] Van Tassel also introduced the enormously influential channelling entity, Ashtar, who is channelled to this day by mediums and contactees all over the world. WHERE SHALL WE GO NEXT? [00;14;30] We could talk about the evolving theories about UFOs within Ufology. SURE THAT'S GOOD. [00;14;37] Evolving understanding. LET ME MAKE A LITTLE BIT OF AN ADJUSTMENT. YOU'RE MOVING AROUND. (END)"
