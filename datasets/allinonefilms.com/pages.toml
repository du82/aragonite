title = "ALL IN ONE FILMS -Transcripts"
full_description = "ALL IN ONE FILMS -Transcripts <!-- --> <!-- body { margin-left: 8px; margin-right: 0px; margin-top: -8px; vertical-align: top; } --> WHY DON'T WE BEGIN BY IF YOU COULD ASSESS THE IMPACT THAT BUDDHISM HAD ON THE BEAT MOVEMENT IN THE '50s. Well to begin with, the original '40s conjunction of beat poets as they are called now - Burroughs, myself and Kerouac and then say by 1950, Gregory Corso; in '55, Philip Whelan and Gary Snider. The original intention or original theme or the original insight was some kind of change of consciousness or new consciousness I think was the phrase that Kerouac was using back in 1945 or new vision. We were reading William Butler Yeats's book, A Vision, and Rimbeau's Season In Hell which talks about Christmas on earth, when should we be the first to see Christmas on earth. And the interest in marijuana and the early '50s peyote, you know the psychedelics by Kerouac or myself or Gary Snider was actually involved with that idea of exploring the nature of consciousness and the texture of consciousness. So about 1950, Kerouac began reading Buddhist texts and turned me on to them and turned me on to Chinese landscape painting. That was my reference and also to the Tibetan Book of the Dead and to the horrific deities, these guys appear. So that was sort of a natural growth. The merging of the ... search of consciousness - not for but of - or re-search - and the Buddhist techniques and teachers. There already was a devotional aspect. You know, there was a kind of sacramental relationship between myself and Kerouac and Burroughs. That was a word used back in the '40s. We were using in '45 and '46 - sacramental yes, sacred world. Not the phrase sacred world as Trungpa later used it but sacramental ah sacramental Dostoyevskian adoration of each other, the sense of real respect. Just as in Dostoyevsky the characters rush up to each other and say, oh Nikolai, Nikolai, how can we forget you. So there was a kind of common mind there. Then when we ran into Gary Snider, who was already studying Chinese and Japanese and had the haiku books by R.H. Blythe, it was just a natural meeting of minds, particularly between Kerouac and Snider because although Kerouac had no teacher and hadn't done any formal sitting, Gary thought that he, by hindsight said that he always thought Kerouac was so intuitively tuned in that he probably could solve koyans relatively rapidly. Ah and then it was that kind of wild wisdom that later is known in Buddhist circles as crazy wisdom. And it's really the old tolerant Bohemian with manic sutra style that merges with the traditional Eastern thought. Historically it's very appropriate because remember, the American transcendentalists looked to the East and there was always a little tincture of over soul or bramha or even Buddhist ah hint in the American tradition."
