full_description = "Two things happened actually, Mike. It was at the time of the '60s and the Second Vatican Council, and the Catholic church was really expanding and energizing in dynamic ways, and I realized that the future of the church lay with laity, the people of God. That was the pilgrim people of God was the great symbol that came for me out of the Second Vatican Council. And I thought that I could no longer hold to a vision of religious life that had come out of the 1950s where, you know, it was a sort of hierarchical thing. The next best thing to being a priest was being a nun and you could only - only those got married who couldn't manage to be celibate kind of thing. Marriage was an also ran thing. Whereas the Vatican Council put marriage as a way of holiness equal to that of being priest or nun. That was a real breakthrough. So that whole movement was one thing. And then also I met somebody with whom I fell in love, and we decided - he was studying to be a priest and so we decided that our future lay together. And we both decided to get married and that was the way in which we could live our religious life together. Yes. I think that a lot has come out. It's not as possible as one would like it to be, and there's been a backlash. There's been a movement against the liberalizing and the energizing trends of the Vatican Council, especially with this pope, who has reasserted celibacy as the norm of holiness, has tried to crush the rise of the feminine within the church. But at the grassroots level in the church and in theological circles, certainly the life and the dynamism is still continuing in the Catholic world. I think because of the idea that - well partly because the cloister itself was breaking down. That was one of the things I realized was the, the so to speak, the protections of religious life , the habit, the cloistering, the - the rules against too much - I was going to say intercourse. That's the wrong word, but too much going out into the world and into secular society. All of that in a way kind of protected the way of being as a religious. And I felt that if I was going to be outside and part of this pilgrimage of church, that I couldn't live - it would be a schizoid existence, trying to be at once celibate, cut off, a little distant and yet the whole movement of the church was, according to the Vatican Council, to be immersed, to be incarnated in the culture of the time. And it was - it was a - I would say it was a 360 degree turn in the spirituality in which I had gone into the convent, and I just couldn't live that spirituality any more."
