full_description = "ALL IN ONE FILMS -Transcripts <!-- --> <!-- body { margin-left: 8px; margin-right: 0px; margin-top: -8px; vertical-align: top; } --> Well, in 1971, I was just about to get my PhD in philosophy. In fact, it was about three days before I defended and it was -- I remember also it was Shakespeare's birthday, April 23rd, and I was listening with a friend of mine where we lived in Greenwich Village to a piece of music by John Crowtrain, called the Father, the Son and the Holy Ghost, a jazz composition, by eleven o'clock at night, a crystal-clear spring evening, looked out the window casually and noticed these lights dancing around the sky and it seemed at first almost in unison with the music. And in about a second or two, I realized that what I was looking at -- seemed impossible. And they were like clusters of brilliant lights, dancing, prancing and performing impossible manoeuvres in the sky. Not -- no. Rather like -- maybe the largest star, a cluster of brilliant stars. And they moved around at this incredible velocity, incredible patterns. I called my friend over to the window and I said hey, look at that, what on earth is that? And then at -- while both of us were watching this incredible sight, they stopped these movements and then shot in a straight line to the dome of the church across the street, a church called Our Lady of Pompeii, and hovered motionless over the cross. It beamed at us. Okay. And it was at that point clear to me -- I made the connection. I'm listening to the Father, Son and the Holy Ghost. Whatever the heck is out there knows that I'm listening, that we are listening to this piece of music. And then, as it were, they displayed themselves for a few seconds. And then from a stationary position shot up into the sky and in jagged, sort of classic UFO motions disappeared over the Empire State building. Well, I was electrified and we then -- we literally, by the way I should say -- there was a feeling of electricity in the room. That may have been subjective reaction here. My friend and I went up the roof. We were living on the top floor. And it so happened, there was a fellow up there who -- his name was Louie. He was a young jazz musician. And synchonisticially, I had just turned him on to John Crowtrain a couple of weeks ago. So he was up the roof star-gazing and he lunged at me did you see that? So he also saw the lights and he noted the fact that they sort of seemed to pass over the rooftop and was silent."
