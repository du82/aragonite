full_description = "I GUESS WHAT I WANT TO ASK YOU ABOUT FIRST IS JUST THE WORK THAT'S GOING ON ON THE RIVER HERE AND HOW YOU GOT INVOLVED AND WHAT THE STATE OF THE OYSTER RIVER IS NOW. Well there's several groups, like the Oyster River Enhancement Society and we just recently set up an Oyster River Watershed Management Committee which I think is an important group because it's made up of government representatives from Energy Mining and Petroleum Resources and Ministry of Environment federal and provincial Fisheries. And we sit down once every two months at the regional board in Courtney and discuss the watershed as a whole. And I came here from the Sola River in '69 and when I did move in here, there were wonderful still at the time good runs of coho, maybe 15,000 coho coming into the river, fairly good runs of pink salmon and steelhead were everywhere and cutthroat trout. And since I've been here, those runs have gradually disappeared and diminished until about five years ago, we were down to maybe 3,000 coho and very few pinks and steelhead runs have been depleted. And that's when the Oyster watershed, Oyster enhancement committee came into being. We wanted to do something about the river and we were really concerned about the logging that's been taking place in the upper watershed for the last 20 years or so. And I noticed that around 19, oh 1965-67 when they begin to log the upper watershed, that did affect the river. We got more sediment in the river and lower flows in the summertime, higher flows in the winter, flooding. And so that has been one of our concerns as far as the amount of stocks in the river. Well yes, not only on this river - see I had lived on the Sola River before and closer to Courtney, and I did notice we reconvened the Steelhead Society and we were looking around for certain projects which would be our key projects. And one of them was Mount Washington Copper which was exuding leachate into the Sola River. And almost all the salmon runs have disappeared from there. And as well, I noticed the Oyster River, the scarcity of steelhead, the scarcity of salmon when I came back, that's true."
