["https://allinonefilms.com/transcripts/dolan.htm"]
title = "ALL IN ONE FILMS -Transcripts"
full_description = "[00:31:16] SO HOW DO YOU SEE THE DEVELOPMENT OF THE PHENOMENON IN TERMS OF THE NATIONAL SECURITY STATE. [00:31:27] Well I look at the history of UFOs within the context of American history in particular as you can look at it culturally, you can look at it historically, but I do look at it in terms of how it affected what you might call the national security apparatus. [00:31:42] So, for example, I consider that there are military reports, seemingly quite serious military reports from the 1940s through the 1950s that describe technology, that describe confrontational encounters that U.S. military personnel had with ah, with these things. [00:32:02] What it looks like to me, just judging upon the official documents, the provable documents where you don't have to speculate at all is that this matter was taken very seriously and brought to very, very deep, secret levels early on. [00:32:17] It seems to me reasonably that there's strong interest in acquiring technology which presumably would be of great value to those people that would have access to and I think that's exactly what they've been attempting to do all these years. [00:32:30] What I would further argue is that the secrecy that has been necessitated by control over this information has done a kind of end run around the formal political process. And I think you can say has been a very subversive element of American and indeed just Western ah history. [00:32:54] The history of any kind of democratic society I think could be affected when you consider that something this big, this important, the proverbial elephant in the dining room is not allowed to be acknowledged. [00:33:06] I think it has probably involved a great amount of physical resources, I mean in terms of money and personnel, none of which, it seems to me, have any kind of true oversight by the public. [00:33:18] So there's a lot of things going on here. You've got national security, you've got public policy and the whole effects of secrecy as a kind of cancer on the democratic institution. [00:33:29] IN THE IMMEDIATE POST-WAR PERIOD ONE WOULD ASSUME THAT IT WAS A VERY DIFFERENT TIME THAN IT IS TODAY. TODAY I THINK VERY FEW PEOPLE HAVE CONFIDENCE THAT IN ANY OF THE WESTERN COUNTRIES THAT THEIR GOVERNMENT IS TELLING THEM COMPLETELY THE TRUTH. IT JUST BECOMES ALMOST AN UNSTATED MATTER OF FACT. THEY'RE LYING TO US ABOUT LOTS OF THINGS. That's exactly right. [00:33:57] BUT IN THE POST-WAR PERIOD IT WAS DIFFERENT WASN'T IT? [00:34:00] Ah the post-war - the post-World War 2 period in terms of public attitude toward government was entirely different than what we experience here in the 21st century across the board. [00:34:14] In the United States there is no question that people did - they loved their ah country, the political system America said that it had, this belief in progress, this belief that America was leading the world to a new and better form of life, a life of freedom and so on. [00:34:34] And that, that corresponded with a very strong level of - of belief in the value of that system and of the government and that government officials did not lie. [00:34:44] That didn't come out - that was - that took Vietnam and Watergate to break that down. So in 1947-48, ah I think there was - there was no competition to the word of the U.S. government regarding the so-called reality of UFOs. Air force and the government officials said there was nothing to this. [00:35:07] There was really not much that a private citizen could do to kind of get around that. There were no public, rather there were no private organizations that were significant yet to challenge the authority and there was really not much of a public inclination I think to do so either. I think there was a great amount of faith that people had in that era that is absolutely not in evidence any longer today. [00:35:30] WHERE DO YOU STAND ON WHAT THE GOVERNMENT KNEW AND WHEN THEY KNEW IT? [00:35:35] When you're dealing with a topic like UFO secrecy, we have got to realize that there are things we know and there are things we don't exactly know. But there are things which look like a certain way, okay, and that' at this point maybe the best you can do. But that's a lot. [00:35:53] What we know is that there were prominent members of the American National Security community who were pretty convinced - and I'm talking 1948-49-50 that the UFO phenomenon was involving technology that was not American, that was very advanced. [00:36:14] Now the documents that we have available - we do not have, even with all the freedom of information act releases and so on, we do not have truly top secret documents. We've got documents that are several cuts below. So I think the good stuff is still beyond our purview. [00:36:31] But there are lower levels of secrecy - secret documents that have been released, ah and what these indicate is a strong assessment of the situation that the UFOs are somebody's technology, they are not ours. [00:36:45] That they appear to evince or to show incredible capabilities -zigzagging, stopping on a dime, instant acceleration and so on. You don't have to be that brilliant to realize that they're implying they're not American, they don't appear to be Soviet. [00:37:03] There was a lot of work done on this, were the Soviets coming up with this and there was no affirmative conclusion to this. So you're running out of candidates very quickly. [00:37:12] And what we know is that there have - as long as there have been official government UFO studies there have been strong factions that developed toward the E.T. hypothesis, that is that these were extraterrestrial or interplanetary, as they would say. [00:37:26] And in every case that I can think of that faction was essentially squashed by the guys in charge. They said, no I don't want that, and you're gone. That happened more than one time. [00:37:37] THIS IS THE ESTIMATE OF THE SITUATION. [00:37:41] We're referring to the legendary estimate of the situation from 1948. THERE'S GOOD EVIDENCE THAT THE ESTIMATE OF THE SITUATION EXISTED. I MEAN RUPPELT WRITES ABOUT IT. [00:37:51] I think - I think that there is very excellent reason to accept ah the testimony of people like Captain Edward Ruppelt and Major ah - (overlap) Dewey Fournet, exactly, that this was a real document despite the fact that the original version has never - has never been found. [00:38:09] AND YET THE AIR FORCE HAS DENIED ITS EXISTENCE AS FAR AS I KNOW. [00:38:12] That is correct. The air force has - I'm not sure if I would go so far as to say that they've officially denied it, but they've never acknowledged that it was a real document, that is true. [00:38:22] But you've got that. Then you've got the story of Project Blue Book itself in 1951-52 which also went through a sort of crescendo period where the E.T. hypothesis was becoming a very significant factor there and Blue Book basically got broken to pieces by 1953. [00:38:42] BECAUSE? [00:38:43] Well what happened at the end of Truman's administration was that in the summer of 1952, throughout that year - this is a forgotten bit of history that's really quite important - UFO sightings within the general public and also within the military, U.S. military reached a tremendous peak. I mean so much so that Captain Ruppelt who ran the Blue Book operation back then said, hey, if you had come into, right past an air force base where we were doing the Blue Book reports, you would have thought that an alien invasion was underway. [00:39:16] The reports were coming in serious and Ruppelt in fact described high level discussions at the chief of staff of the air force, General John Sanford. This big argument broke out, why don't we just come out and say that this is E.T.? A big faction had done this. [00:39:34] And what happened though was that you had the several weekends in a row of sightings over the White House. Got very big press and got downplayed to the public in an official statement. But that didn't solve the problem, you see. [00:39:47] The CIA and air force intelligence realized that this problem in the classified world and in the military world had to be put to sleep. And I believe that they concluded that this had to be done before the end of the Truman administration which was due to end in January 1953. [00:40:03] THEIR REASONING BEING? [00:40:06] Well I'm speculating here, but I think it's reasonable to assume that since the UFO phenomenon became a public thing in the U.S. Harry Truman had always been president. The Democratic party had always been in charge of the White House. [00:40:19] It was very clear to any intelligent observer in 1952 that Dwight Eisenhower, if he were to receive the Republican nomination he was going to win. And I think that was a given; that was a political reality. [00:40:32] And so people who were in charge of dealing with this problem from that point of view, from a political point of view, it seems to me they recognized that there were going to be some changes. What would we do them to deal with these changes? Let's make sure, even though we may have reliable people coming in, ah I think it doesn't hurt to cover your bases here and to make sure that this problem is tidied up. [00:40:59] What I look at is the so-called Robertson Panel which was a CIA convened panel in January '53. This was the last bit of housecleaning of the Truman administration and that's a point of fact. It took place during the last weekend of Harry Truman's presidency. Two days after that panel ended, Dwight Eisenhower became president. [00:41:19] And what did the Robertson panel do? It - it ah ended up in severely downgrading the operation of Project Blue Book, removed most of the staff and issued a kind of directive to force UFO cases to be explained. The rate had been something like 20% up until then and almost immediately after that directives came down to get that number down. And within two years the numbers were down like 3 and 2% a year. [00:41:50] Methods of investigation did not change at all. Simply other explanations were trotted out and brought in. [00:41:56] THE FASCINATING THING ABOUT THE ROBERTSON PANEL IS THAT HIS REPORT SEEMS TO HAVE BEEN WRITTEN IN ADVANCE. [00:42:02] That's exactly right The Robertson Panel report, historical work done by other people who have gone into these records have concluded with high certitude that the panel's conclusions were written before the panel even convened. [00:42:16] And indeed, one of the primary members, Louis Alvarez, I believe it was Alvares - yes - did not arrive until the day before the panel even ended. [00:42:29] AND SEEMED VERY BORED BY THE PROCEEDINGS. [00:42:30] Absolutely. FROM WHAT I'VE READ. [00:42:33] The whole, the whole panel itself had something like 12 official hours to review some reports and we have a fair amount of information to be able to judge what happened. We've got the report itself and we've got testimony of our participants. [00:42:48] And it's very clear, and this includes Thornton Page who was one of the members of the panel and he himself said, you know, I don't think that the panel did a very thorough job in looking into this phenomenon. [00:43:01] So they did a - they did a slipshod job at best, despite the fact that these were Nobel calibre scientists. You've got to really wonder what's going on here? Why would such brilliant qualified men do such a horrible job in investigating this phenomenon? And I think when you consider the report conclusions were pre ah - pre-ordained, you've got your answer. [00:43:23] SO WHY WERE THESE PARTICULAR CONCLUSIONS PREORDAINED DO YOU THINK? [00:43:26] This was a rubber stamp, okay? The Robertson panel, ah men, scientists were brought in, I believe to rubber stamp a policy that was already in - that was already decided upon and that is to put the UFO problem to sleep within most of the classified world. [00:43:43] It was already ah handled as far as the public was concerned, but it was not handled sufficiently within military channels and intelligence channels. And the Robertson panel actually rectified this from a control point of view. Btu in order to make such a major policy change, it seems to me it helps to have fancy scientists coming in to rubber stamp this policy. [00:44:05] GOOD, VERY GOOD. ALRIGHT, SO THAT'S ESSENTIALLY OPERATIVE UNTIL WE HIT THE GREAT WAVE OF '63 TO '67. [00:44:15] Absolutely. What happened was that through the 1950s and early '60s there was one civilian organization known as NICAP led by retired Marine Corps Major Donald Kehoe and actually tried to work through the system to get congressional hearings. Every year this NICAP's plan. [00:44:32] We're going to get Congressmen to bring this up in public and we're going to do it. And every year at the eleventh hour something happened to prevent that from taking place. [00:44:39] The culmination was in 1962 when former CIA director Roscoe Hillincoter was going to go before Congress. This was planned for April of '62. Two months prior to that, Hillincoter backed out, resigned from NICAP. Told Kehoe, no we need to get off the air force's back here. They're doing everything they can. [00:44:56] So it looked like the UFO issue was kind of dead in the water. And then came those crazy 1960s. And I say crazy because not only was society in a tumult. In the 1960s, hey, it looked like everything was possible. But the UFO phenomenon went into a major crescendo in the U.S. and in Canada and worldwide. '65, '66, '67 in particular this was huge. [00:45:23] It was so big that in U.S. Congress by 1966 this was being widely discussed. Future president Gerald Ford discussed the fact that his constituents has a need to know what was going on and - [00:45:36] I WAS DOWN IN MICHIGAN - JUST TO INTERRUPT - I WAS DOWN IN MICHIGAN A WEEK AND A HALF AGO AT HILLSDALE COLLEGE FOR FOUR DAYS. Neat. [00:45:43] FILMING (OVERLAP) [00:45:43] It's an interesting place too. [00:45:45] ABSOLUTELY FASCINATING STORY. [00:45:46] Indeed. Ah, what happened as a result of the wave of 1966 is the U.S. air force which had never wanted to maintain Project Blue Book - really analogous really to the Canadian situation in which the UFO reports just got bounced around all these different departments. No one wanted it in the U.S. The air force was stuck with it and they could not unload it. [00:46:08] And now the case was that the air force was really losing credibility. There were jokes being made about the ridiculous air force explanations which were ridiculous. Everyone knew it. [00:46:20] So I think what you have is a case in which the air force very deftly handled the situation. Rather than have Congress deal with this through open investigations, which is a real danger, the air force said, don't worry, we've got a handle. We've selected on a university, the University of Colorado, which will do an objective, independent scientific analysis and whatever Colorado decides we will abide by, okay? [00:46:47] And e"
