["https://allinonefilms.com/transcripts/keith.htm"]
title = "ALL IN ONE FILMS -Transcripts"
full_description = '''ALL IN ONE FILMS -Transcripts <!-- --> <!-- body { margin-left: 8px; margin-right: 0px; margin-top: -8px; vertical-align: top; } --> You know, a lot of people in the UFO field hear the term "mythology" and, because ours is a culture that has lost touch with its mythologies in a conscious way, that is assumed to mean that the person talking about mythology is saying UFOs aren't real. They could very well be real objects from someplace, and there is a profoundly rich mythology around them now. One thing a myth is - a myth tells the story of origins. It tells the story of the first time. The garden of Eden. Creation stories are profoundly mythic. It tells about the first instance of something profound, usually that was done by the gods or goddesses, or the ancestors before time. And what makes a myth powerful is that it is repeated periodically and, through the repetition of a myth or performance of a mythic action or a ritual, a community is renewed. I think you waste your time trying to find the answer. And that is what UFOlogy - I was simply amazed as I did my research for my book, at the extent to which that is the driving force of the world of UFOlogy. And that means both sides, and that is roughly speaking proponents versus demoters. Both of whom I consider different classes of believers. There's essentially a belief dynamic going on. "What do you believe?" Both are strongly committed to a particular viewpoint. The debunker says this, in effect - you scratch all the other statements at their surface, and the statement that comes up for the debunker is: This isn't real, because it can't be real. UFOs aren't real because they can't be real. We know that there are no such things as craft that can go this fast, that can stop on a dime, that can avoid radar, and so forth ... we know that it can't be the case. And that's the guiding mythology of that side. The other side is: UFOs are real because they must be real. I mean, who's to say that we're the only ones in the universe? What arrogance for we humans to think that. And so, that becomes the mythology for that side. Both provide interesting arguments. But both tend to look for proof of their particular viewpoint. And there are enough cases that have enough rich aspects - a proponent can stand forth with 10 good cases for the UFO phenomenon. The debunker can take those same 10 cases and find details that cast doubt on the original reports and use those same 10 cases to negate them. Both sides end up with categorical proof of their viewpoint.'''
