["http://allinthehead.com/retro/351/openid-has-failed-so-whats-next"]
title = "OpenID Has Failed. So What's Next?"
full_description = "OpenID Has Failed. So What's Next? 37signals, a fairly early and significant adopter of OpenID, has announced that they’re dropping OpenID support from their products. Whilst one swallow doesn’t make a summer (or whatever the reverse of that is), it’s a fairly notable moment when a company like 37signals strips out a technology from their platform due to it causing more harm than good. They’re not just making it unavailable for new users, they’re migrating all users off OpenID and onto their native login system. They want it gone, citing the customer support issues it creates. You know what? It’s fine. OpenID has never really caught on in a major way. I use it pretty much only on StackOverflow and 37signals products, and I really like it. Regular (non-web-building) users find it puzzling, and don’t have a good understanding of URLs, let alone ownership of them. So it works for geeks, but not for the general populous, and therefore isn’t a good viable solution for most sites. That’s fine. No point fighting it. This iteration hasn’t worked, so let’s make a note of why it failed and start work on the next. The problem OpenID was attempting to solve hasn’t gone away. – Drew McLellan 08 March 2011 – 08 Mar 2011 tosh I believe we experience a transition from the cash&check era to credit cards. Chris Messina has a very good article on that from back in 2009: http://factoryjoe.com/blog/2009/04/06/does-openid-need-to-be-hard/ For the issue tracker we are currently working on we will support some of these (credit card-like) identity providers. Thinking about facebook, twitter, github, linkedin and google. Also OpenID might still make sense for us since we expect a tech savvy audience (mostly software developers). I am very interested in input on how to provide a good user experience while still supporting several identity providers. I doubt stackoverflow is as good as it gets. We don’t want to go the easy route and only support user/pass, but also don’t want to make it difficult for the user. Good to see there are still people who care about this topic!"
