["https://allinthehead.com/retro/69/sleight-of-hand"]
title = "Sleight of hand"
full_description = "Sleight of hand I’m sure most readers are aware of of youngpup’s Sleight code snippet for achieving PNG alpha transparency in Win IE 5.5+. If not, go look. You may find it useful. On a project today, we wanted to implement a translucent PNG effect on some dropdown menus. Youngpup’s code only deals with inline images, not background images so I had to roll my own. You can download it. The instructions are just the same as Sleight. Kudos to youngpup for the neat code, some of which I borrowed, some of which I replaced. It uses browser sniffing, which I’d normally avoid, but I think it’s okay in this context. It should fail gracefully if the sniff goes awry. Update: The script linked above is now a revised version. See my notes. – Drew McLellan 08 July 2003 – 09 Jul 2003 Nathan Pitman We’ve been doing some work on a large shopping site and have made use of Youngpup’s ’ypSlideOutMenus’ on the project. He is indeed a very clever man. 09 Jul 2003 Marcello Cerruti I didn’t know that snippet. If needed, the browser sniffing can also be replaced by IE 5 PC Conditional Comment. 11 Jul 2003 Bob Umm… OK, so I’m trying to use this to display PNGs as bg images in Hn tags in my style sheet, and while the PNGs are displaying in IE, they’re displaying with 100% opacity. I’d like for them to be at about 40% opacity to allow the image behind the Hn tags to show through. I’ve tried reading the AlphaImageLoader specs at MS, but they just confused me more. Help? Please? :-) 11 Jul 2003 Drew Have you saved your PNGs with the correct opacity? As a benchmark, try the page in Mozilla. 11 Jul 2003 Bob The page in question is located at www.websol.net/newlayout/ … I copied your script as-is into the head of the document, and changed the image url in the line ”document.all[i].style.backgroundImage = ”url(’img/bluegradbg.png’)”;” … 11 Jul 2003 Drew That image you changed (previously x.gif) needs to be a regular transparent GIF. Check over the instructions again if you’re still unclear."
