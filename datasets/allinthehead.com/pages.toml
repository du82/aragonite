["https://allinthehead.com/retro/223/armadillo-v2"]
title = "Armadillo v2"
full_description = "Armadillo v2 Welcome to the new and improved allinthehead. It’s been a long while in the making, but a change in hosting (welcome to Textdrive by the way) gave me the reason to get my arse in gear and finish the revamp. So here we are. First, a bit about the changes I’ve made. Apart from the obvious visual refresh, I’ve made some significant changes to the site’s architecture. Ever since this site launched it has been pretty much a single page, so for the first time we now have a main navigation bar at the top and a number of different sections. I’ve updated my About page (that was there before, but buried), and added an Archive page which lists the most recent 100 posts. I’ve tidied up the search results page and comments, and moved the links from the sidebar onto a page of their own. A bit on the side Creating a dedicated links page has opened up the space on the sidebar for a link-log: A bit on the side. This is a place for me to log interesting links without the requirement to post a whole article about them – I guess more of a traditional weblog idea. With A bit on the side comes new feeds – both RSS and ATOM. It’s still a work in progress however, and there are bound to be rough edges. I’ve not validated the templates yet, so there will be errors. So, I hope you like it. I’m by no means a designer, so any constructive feedback is welcome. I need to extend thanks to those who I’ve been bothering over the last few weeks, particularly Ethan and Dunstan for their comments, help and support, and Jon for his help with the link-log. Cheers guys. – Drew McLellan 21 August 2004 – 22 Aug 2004 kelly Nice looks Drew. Subtle colors, and a nice contrast make things easy to read. Good job from a fellow TextDriver! 22 Aug 2004 Hans Nice… Pretty in pink. You’re brave, man. The sidebar’s overflowing over the footer (Firefox 0.9.2 WinXP) and well… wait a minute, can oyu even call that a footer?! Fix it! ;) Finally the about page is actually accessible (for -every_one). Good pink highlights everywhere… But something about the text in the header image just doesn’t seem right. I miss the Silkscreen (-ish?) title."
