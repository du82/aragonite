["http://allinthehead.com/about"]
title = "About"
full_description = "About me Hello, I’m Drew McLellan and I’m a software engineer based in Bristol, UK. I currently work as an Engineering Manager for Snyk on their Snyk Learn product. Prior to this I worked mainly on web content management systems such as Perch and Perch Runway and designed and built the public speaker portfolio site Notist. I have done a lot of web development, but I don’t really develop websites at present. I develop tools that enable other people to publish websites more successfully, or help them work on strategies to get there. I speak at conferences and write articles, including writing on 24 ways, an advent project I created. In the past I’ve been involved with the Microformats core team, and was co-lead of The Web Standard Project from 2006-08. Back in the day I worked in Search Innovation for Yahoo!. When I manage to escape the computer screen, I like to run with my local club, ride my road bike up and down the West Country hills, and I take photos. Awkward third-person biography Drew McLellan is an Engineering Manager at Snyk and founder of Notist. Prior to this, he created small content management system Perch, was a Web Developer for Yahoo!, and from 2006-08 was Group Lead for The Web Standards Project. Drew has had articles published by A List Apart, Adobe, and O’Reilly Media, and writes at his personal site All in the head and, with a little help from his friends, at 24 ways. About this site This is a personal site, in a weblog format. I occasionally post something that I’ve been thinking about or relates to what I’m working on. The site is published using Perch Runway, which is the CMS I develop. It’s really good. I’ve been publishing here since March 2003, and before that at DreamweaverFever.com, but we don’t talk about that. The armadillo icon in the footer is by Amanda Sebastiani for The Noun Project. Contacting me By all means feel free to drop me a line. However, if you need help with something I’ve published I can’t guarantee I’m going to have time to look at it. As I have said before, my name is Drew, and this is my domain, allinthehead.com. You’ll have to figure it out from there. On Twitter, I’m @drewm."
