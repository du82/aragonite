["https://allinthehead.com/retro/336/html-and-web-standards-training"]
title = "HTML and Web Standards Training"
full_description = "HTML and Web Standards Training Since we began running our CSS beginners course last year, we’ve had a number of requests for an entry-level course on using HTML and web standards principals in general. It makes sense, as a working knowledge of basic HTML is really needed to take full advantage of the instruction we offer on CSS. So we’ve put one together. It’s a one-day course in which we’ll be covering all the basics of HTML 4, XHTML and briefly looking forward at the upcoming HTML 5. We’ll cover the principals of semantic markup, the separation of content, structure and presentation, the fundamentals of progressive enhancement and even microformats. Delegates will discover the impact of markup on SEO and Accessibility, and learn how best to work in order to benefit both. It’s actually a beginners course I’ve always wanted to see: Learn How to Do It Properly From the Start. If you’re not the sort of person who learns well from The School of View Source, then I think this would be a day well spent. I think it’s going to be perfect for those who have to use HTML as part of their job (like site managers, content editors or even clients!) as well as those wanting to take some initial steps into building for the web. We’ve scheduled the first one back to back with our CSS beginners course next month, and are offering a good discount to those who book on both days. Update: we’ve got a final few places left if you’re quick. – Drew McLellan 12 January 2009 – 12 Jan 2009 Gerard Keohane One day course for all that? Seems a trifle ambitious… I totally agree on the approach though – it’s definitely the way to learn in a ‘sustainable’ fashion. And the outline seems very thorough and hits all the right spots, and with a 5 to 1, student to teacher, ratio there’s certainly a better chance of focusing on work rather than getting stuck in misunderstood points etc… I’d love to read your thoughts on how it goes (after you’ve taught the course) and whether it is possible to fit so much into a one-day course…"
