["http://allinthehead.com/retro/324/london-web-week"]
title = "London Web Week"
full_description = "London Web Week Announced this week was an initiative called London Web Week, which will run from May 26th to June 2th this summer. It encompasses existing events like @media 2008 and BarCamp London 4 whilst providing a framework for other related geek events to be laid on. As part of LWW Frances Berriman and I are putting on a Microformats vEvent on Tuesday 27th May from 7pm. Dan Brickley (co-founder of FOAF) and Tom Morris (founder of Get Semantic) are each giving a presentation as part of what we hope will be a more broadly themed semantic web event. The rest of the evening is purely social, with the chance to mingle and chat with like-minded folks. Everyone is welcome, whatever your level of understanding of microformats, RDF, GRDDL etc. is. We hope that no matter your experience level, youâ€™ll find the evening informative, enjoyable and inspiring. Tickets are just Â£5, and must be booked in advance online from the above link. Also happening as part of LWW is a Web Standards Group meeting (which have been excellent in the past) and an event called Web Roots aimed at those aiming to break into the industry. Keep an eye on the LWW site for more. Not forgetting @media on the Thursday and Friday (still my favourite ‘formal’ web conference, and massively recommended) it looks like London Web Week is really shaping up to be an exciting event, and one well worth supporting. – Drew McLellan 05 April 2008 –"
