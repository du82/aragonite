["http://allinthehead.com/retro/354/ideas-of-march"]
title = "Ideas of March"
full_description = "Ideas of March When I started this site in 2003 — as best as I can tell it was 2003 — a individual’s personal site or blog was pretty much their primary method for joining the online conversation. If you had something you wanted to share, you wrote a blog post. Others would read it, and if they found it to be of value they might link to it in a post of their own. Or leave a comment. That’s how we all communicated. At that time there was an amazing wealth of content being posted to blogs, and truthfully, it was the primary way I picked up information around the subject of web design, and spurred me to form my own opinions on subjects I wouldn’t have otherwise thought about. Because you can’t blog without an opinion. One thing I’ve found over the last four-and-a-half years of using Twitter (where did that time go?) is that the opinions and ideas that I used to consider for a while and then focus into a blog post now get fired off into a 140 character tweet and forgotten. Twitter has in many ways replaced the role of blogs as the simplest outlet for the shared thought. Rather than going through the process of refining thoughts and reasoning into something (hopefully) coherent, we condense those thoughts into a single terse headline and move on. Whilst I really love Twitter, I do think it’s a shame that we now mainly get to hear people’s opinions, but without hearing the reasoning behind those opinions that you would normally find in a longer blog post. Not to mention that it’s far easier to tweet without an opinion, and I think the conversation is fundamentally weakened that way. We need a blog revival This isn’t a backlash against Twitter, however. There’s room for both — for quick headline thoughts and for more reasoned posts. I think it would be a shame to have only the former and none of the latter. As such, I’ve been making a bit more of an effort to dust off my own blog and to post some of the things I would normally just tweet. Prompted by Chris, I’m making the pledge to post more for the rest of March, as I have already begun to this last week. Here’s how you can join in the blog revival: Write a post called Ideas of March. List some of the reasons you like blogs. Pledge to blog more the rest of the month. Share your thoughts on Twitter with the #ideasofmarch hashtag. Let’s see if we can tip the scales back a little and find a better balance between tweets and posts. Will you join us? – Drew McLellan 15 March 2011 –"
