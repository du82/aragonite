title = "Folk Music Genre Overview | AllMusic"
description = '''
window.ramp.que.push(function () {
window.ramp.addTag("AllMusic_LB_Top");
});                                Folk                Overview                    Artists                                Albums                                Songs                
Each country has their own folk music, but the genre usually refers to American and British music that has been passed through the generations by oral tradition. It's simple, acoustic-based music that spins everyday events and common people into mythic status. Many traditional folksongs have no known author, they have simply evolved over the years. Most of the earliest recorded folk music was of this nature, but with Woody Guthrie, topical folk began making its way to record. Still, many artists, including the Weavers and Pete Seeger, chose to mix traditional songs with newer material, either written by the artists themselves or other contemporary musicians. Initially, Bob Dylan functioned in that style, but by his second album, =The Freewheelin' Bob Dylan,= he began relying entirely on original material, thereby ushering the modern era of folk, where most performers sang their own (usually personally and introspective) material, and only occasionally throwing in covers.                    Folk Artist Highlights                        More Folk                    Artists                                                                                                Pete Seeger                                                                                        Joan Baez                                                                                        Peter, Paul and Mary                                                                                        Lucinda Williams                                                                                        Rhiannon Giddens                                                                                        Townes Van Zandt                                                                                        Robin & Linda Williams                                                                                        Bert Jansch                                                                                