Latin music is a catch-all term for a number of diverse styles from different regions and countries in Latin America. Often, the term refers to Latin pop -- either dance-based or pop oriented-music sung in Spanish or Tejano. Tejano has a number of different styles, from romantic ballads to the narrative nortenos, and they're usually performed by large groups with acoustic instruments and horns. In the '80s and '90s, Tejano has also adopted smooth production techniques from American pop-rock and soft rock. Latin America is also known for such dance music as salsas and sambas, which have layers of percussion, blaring horns and an infectious sense of style. A related style to salsa is the bossa nova, a cool, laid-back style that crossed dance music with jazz. With the exception of tejano and mariachi, which is folk and pop based, most Latin music is defined by its strong rhythms.                    Latin Artist Highlights                        More Latin                    Artists                                                                                                Gloria Estefan                                                                                        Willie Colón                                                                                        Selena                                                                                        Rubén Blades                                                                                        Maná                                                                                        J Balvin                                                                                        Buena Vista Social Club                                                                                        Juan Gabriel                                                                                        Aventura                                                                                        Jenni Rivera        