In the Western world, "World music" refers either to music that doesn't fall into the North American and British pop or folk traditions or to hybrids of various indigenous musics. Certain styles -- such as Jamaican reggae or Latin pop -- grew large enough to be classified as their own genre, but everything else, from traditional Chinese music to African folk, is classified as world music. Worldbeat is something different than world music, since it's usually the result of Western hybrids and fusions, yet it still falls under the world music umbrella because it borrows styles, sounds and instrumentation from various indigenous musics.                    International Artist Highlights                        More International                    Artists                                                                                                Ali Farka Touré                                                                                        Nusrat Fateh Ali Khan                                                                                        Baaba Maal                                                                                        Ravi Shankar                                                                                        Värttinä                                                                                        King Sunny Ade                                                                                        The Chieftains                                                                                        Fela Kuti                                                                                        Toumani Diabaté                                                                                        Youssou N'Dour                                                                                        Paco de Lucía                                                                                        Ebenezer Obey                  