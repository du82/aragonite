description = "Answers to the most frequently asked questions about AllMusic"
full_description = "You may submit artist- and album-related corrections to Xperi editors using Submit Corrections links available at the bottom of artist and album pages, and corrections related to other types of data via our feedback form. Xperi prides themselves on accuracy, so please include your information source in your submission. Please do not contact AllMusic about the status of data corrections; we don't control which data is corrected or how long it takes to apply corrections, and we can't move up your correction in priority or within a specific time frame. Xperi appreciates the time you take to send this information to them, but due to the immense volume of correspondence they receive, they're unable to directly respond to most of your submissions. Xperi tries to add artist information, but can't make any promises about which artists and titles will receive this level of enhanced editorial coverage. However, you may send them your information for consideration by following the steps on the Product Submissions page. Xperi tries to add recordings, as well as review as many CDs possible, but can't make any promises about which artists and titles will receive this level of enhanced editorial coverage. However, you may send them your information for consideration by following the steps on the Product Submissions page. Spotify/MTV/iTunes /Billboard/Apple Music etc said I need to submit my album/info to AllMusic before it shows up on their site. The app is currently not available due to the cost of licensing the music information. We hope to bring it out of retirement at some point in the future. We understand that this was an important part of exploring and discovering music on the site and we're investigating other partnerships to try to bring the sound clips or streaming options back. Becoming a subscriber does not give access to stream full albums, to upload music, download music, change a band photo or alter the editorial content (reviews and biographies) provided on AllMusic."
