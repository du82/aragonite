full_description = 'Netaktion LLC (“Netaktion”) respects your right to privacy. This Privacy Notice explains who we are, how we collect, share and use personal information about you, and how you can exercise your privacy rights. This Notice applies to personal information that we collect through our website at https://www.allmusic.com, (“Website”) and which we collect when you use or interact with our products and services. If you have any questions or concerns about our use of your personal information, then please contact us using the contact details provided at the bottom of this Privacy Notice. Netaktion provides advertising technology products and services. We are headquartered in the U.S. For more information regarding our business, please visit the website link set out above. Certain of our products and services involve the provision of targeted advertising. This involves providing tailored advertising to online users based on their interests and behaviors. Crucially, our targeted advertising is conducted at an "audience" or a "segment" level (e.g., males in Chicago aged 25-34 who like cars) and so does not directly identify individuals. We do not intentionally collect information that identifies you (such as your name, address, phone number, or email address) as part of our targeted advertising activities, and we prohibit our partners from sharing this information with us. We act on behalf of our customers in providing any targeted advertising products and services. We and/or our customers may use technology that establishes connections among related devices (such as mobile devices and desktop computers) both to deliver advertising that may be more relevant to you, as well as for analytics and reporting purposes. This means that information about your use of websites or applications on one of your devices may be combined with information from your other devices. We may also partner with third parties to provide such cross-device technology to our customers, and in doing so, we may share anonymous identifiers with those third parties in order to make connections among related devices. We may also use your device’s IP address to infer connections among related devices within the same household. To opt out of our use of such technologies, please follow the instructions set out in the Opting-out of Cookies Usage div below.'
