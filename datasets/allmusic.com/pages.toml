Reaching back to grab the grooves of '70s disco/funk and the gadgets of electronic composition, Electronica soon became a whole new entity in and of itself, spinning off new sounds and subgenres with no end in sight two decades down the pike. Its beginnings came in the post-disco environment of Chicago/New York and Detroit, the cities who spawned house and techno (respectively) during the 1980s. Later that decade, club-goers in Britain latched onto the fusion of mechanical and sensual, and returned the favor to hungry Americans with new styles like jungle/drum'n'bass and trip-hop. Though most all early electronica was danceable, by the beginning of the '90s, producers were also making music for the headphones and chill-out areas as well, resulting in dozens of stylistic fusions like ambient-house, experimental techno, tech-house, electro-techno, etc. Typical for the many styles gathered under the umbrella was a focus on danceable grooves, very loose song structure (if any), and, in many producers, a relentless desire to find a new sound no matter how tepid the results.                    Electronic Artist Highlights                        More Electronic                    Artists                                                                                                Kraftwerk                                                                                        Daft Punk                                                                                        Tangerine Dream                                                                                        The Chemical Brothers                                                                                        DJ Shadow                                                                                        Suzanne Ciani                                                                                        Aphex Twin                                                                                        Mob