full_description = '''All Things Distributed Now Go Build! Articles @werner function myFunction(){var e=document.getElementById("myTopnav");e.className==="topnav"?e.className+=" responsive":e.className="topnav"}AI doesn't plant treesApril 21, 2023 • 147 wordsWhile I am a technologist, I know technology alone cannot solve all the problems the world is facing. That’s why I was immensely proud to join our our “Nurture the Future” campaign by local team in Vietnam and get my hands dirty to plant 1,000 mangrove trees in Can Gio. It was an awe-inspiring moment to see the beauty of nature up close, and witness firsthand the positive impact we can have on the environment!One thing that I have learned from this experience, is that no matter how advanced a technology system is, it can never replace the power of a community coming together for a common cause. As we celebrate the Earth Day today, I encourage you all, to take a break from the AI discussions, go get out there, and plant some real trees!Check out this video to learn more about the campaign: © 2025 All Things Distributed'''
