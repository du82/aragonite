["https://www.allthingsdistributed.com/2024/02/reading-list-since-reinvent.html"]
title = "What I've been reading since re:Invent | All Things Distributed"
description = "After a busy conference season, I've taken some time to catch up on reading and make a dent in the pile of books on my nightstand. Here's what I've started, finished, and picked up since re:Invent."
full_description = '''All Things Distributed Now Go Build! Articles @werner function myFunction(){var e=document.getElementById("myTopnav");e.className==="topnav"?e.className+=" responsive":e.className="topnav"}What I've been reading since re:InventFebruary 13, 2024 • 1340 wordsUpdated: March 6, 2024The months leading into re:Invent are exciting (and often exhausting). I spend most of my time doing research, meeting with brilliant engineers, and developing stories to share with you on stage. It’s wonderful. But it doesn’t leave me with much time to read exclusively for pleasure.So, in the weeks that follow re:Invent, I try to make time to work through the ever-growing pile of books accumulating on my nightstand and throughout my office. It’s a losing battle. Then again, when was it ever worth doing something easy?Here’s a short list of things I’ve started, finished, and recently added to the pile…The most important thing I’ve read recently was Right/Wrong: How Technology Transforms Our Ethics by Juan Enriquez. It clearly lays out how our ethics and morals change under the influence of technology in a fairly short amount of time. For example, using gene editing technology such as CRISPR to alter a child’s genome may be unethical right now, but our grandchildren might feel differently, knowing that we could have removed or edited a gene known to cause breast cancer. At a time of extreme polarization, this book challenges us to think about how quickly mainstream opinions can shift and why.In light of recent election results worldwide, and the upcoming presidential race in the United States, I decided to re-read The Age of American Unreason in a Culture of Lies by Susan Jacoby. It provides amazing historical insight into how politics and the politicians that represent us have shifted away from rational and intellectual debate to who can shout the loudest. It’s quite startling to see how much public language has devolved in the past few decades. If this is a topic you’re interested in, I urge you to read Richard Hofstadter’s 1964 Anti-Intellectualism in American Life.I finally had a chance to finish Down and Out in Paradise: The Life of Anthony Bourdain by Charles Leerhsen. As a fellow world traveler, with a similar view of how to live, I have always been inspired by Bourdain’s storytelling abilities. He was an empathetic narrator that focused on people and their experiences. This book is about the man behind the stories that helped bring these narratives to life.As many of you know, I am a lifelong AFC Ajax supporter, so I really enjoyed Zlatan Ibrahimovic’s biography Adrenaline: My Untold Stories. Zlatan started his international career at Ajax and his highlight reel from those days will do more justice than my words can:I picked up Atlas van een bezette stad 1940-1945 by Bianca Stigter, which covers the German occupation of Amsterdam in the form of an illustrated Atlas. It is mind-blowing to see the ways that the Nazi occupation still haunts the city. The book is in Dutch (sorry for now to my English readers), but it was adapted into a four-hour long documentary by Stigter’s partner Steve McQueen, called “Occupied City” which debuted at Cannes last year.I started reading Rust for Rustaceans: Idiomatic Programming of Experienced Developers by John Gjengset, but it’s a bit more advanced than I need at the moment, so I picked Command-line Rust: A Project-based Primer for Writing Rust CLIs by Ken Youens-Clark and it looks promising so far. I will provide an update as I progress.Just for fun, I bought the fourth book in John Burdett’s Sonchai Jitpleecheep series: The Godfather of Kathmandu. If you have ever spent any extended period of time in Bangkok, you’ll enjoy this series. The writing is absolutely brilliant. I’m not finished yet, but so far, it’s as good as the previous three books.The last thing I’ll leave you with is a paper I recently read from the Netflix Technology Blog, “Rebuilding Netflix Video Processing Pipeline with Microservices” by Liwei Guo, Anush Moorthy, Li-Heng Chen, Vinicius Carvalho, Aditya Mavlankar, Agata Opalach, Adithya Prakash, Kyle Swanson, Jessica Tweneboah, Subbu Venkatrav, Lishan Zhu — It goes into detail about rebuilding their video processing pipeline on their microservice-based platform Cosmos.If there’s something that you’ve read or are reading that you’d recommend, let me know on Twitter or LinkedIn.Reader recommendations Unsurprisingly, it turns out my readers are well read. I got recommendations on Twitter, LinkedIn, and from fellow Amazonians, on just about every topic imaginable. And with the hopes of getting through more than a handful of these this year (the ones I haven’t already read), I’ve created a consolidated list.Here’s what you’ve all recommended as of March 6, 2024:Autobiography of a Yogi by Paramahansa YoganandaBabel by R.F. KuangBarking Up the Wrong Tree by Eric BarkerBasic Category Theory from Computer Scientists by Benjamin C. PierreBiking Uphill in the Rain by Tom FucoloroBuilding a Second Brain: A Proven Method to Organise Your Digital Life and Unlock Your Creative Potential by Tiago ForteThe Coming Wave by Mustafa SuleymanCompetitive Engineering by Tom GlibA Conflict of Visions: Ideological Origins of Political Struggles by Thomas SowellThe Dancing Wu Li Masters by Gary ZukavDarkness at Noon by Arthur KoestlerDialog Mapping: Building Shared Understanding of Wicked Problems by Jeff ConklinThe Expectation Effect: How Your Mindset Can Change Your World by David RobsonFluid Concepts and Creative Analogies: Computer Models of the Fundamental Mechanisms of Thought by Douglas HofstadterGodel, Escher, Bach by Douglas HofstaderHidden Potential: The Science of Achieving Greater Things by Adam GrantHow Google works by Eric Schmidt and Jonathan RosenbergHow Infrastructure Works: Transforming our shared systems for a changing world by Deb ChachraHow To Do Nothing: Resisting the Attention Economy by Jenny OdellHypermedia Systems by Carson Gross, Adam Stepinski, et al.If Then: How the Simulmatics Corporation Invented the Future by Jill LeporeIllusions: The Adventures of the Reluctant Messiah by Richard BachInspired: How to Create Tech Products Customers Love by Marty CaganIntroduction to Logic: Propositional Logic by Howard PospeselThe Language of Creation: Cosmic Symbolism in Genesis: A Commentary by Matthieau PageauThe Life at the Bottom by Theodore DalrympleMeditations on the Soul: Selected Letters of Marsilio FicinoNaive Set Theory by Paul R. HalmosNarrative Economics: How Stories Go Viral and Drive Major Economic Events by Robert J. ShillerNoise: A Flaw in Human Judgment by Daniel Kahneman et al.Not the End of the World: How We can Be the First Generation to Build a Sustainable Planet by Hannah RitchieNotes of a Native Son by James BaldwinNotes Towards The Definition of Culture by T.S. EliotThe Other Pandemic by James BallThe PARA Method by Tiago ForteThe Phoenix Project: A Novel about IT, DevOps, and Helping Your Business Win by Gene Kim, Kevin Behr, George SpaffordPlaying to Win: How Strategy Really Works by Lafley & MartinPragmatic Thinking & Learning: Refactor Your Wetware by Andy HuntQuantum Healing by Dr Deepak ChopraQuiet Leadership: Winning Hearts, Minds and Matches by Carlo AncelottiScary Smart, the Future of AI and How You can Save Our World by Mo GawdatThe Sergeant: The Incredible Life of Nicholas Said: Son of an African General, Slave of the Ottomans, Free Man Under the Tsars, Hero of the Union Army by Dean CalbreathSoftware Engineering at Google: Lessons Learned from Programming Over Time by Titus WintersSoftware Exorcism: A Handbook for Debugging and Optimizing Legacy Code by Bill BlundenThe Splendid And The Vile: A Saga of Churchill, Family, and Defiance During the Blitz by Erik LarsonThe Tao of Physics by Fritjof CapraThink You’ll Be Happy: Moving Through Grief with Grit, Grace, and Gratitude by Nicole AvantThinking in Bets: Making Smarter Decisions When You Don’t Have All the Facts by Annie DukeThinking, Fast and Slow by Daniel KahnemanUnmasking AI by Dr. Joy BuolamwiniWeapons of Math Destruction by Dr. Cathy O’NeillWhy Buddhism is True by Robert WrightWhy We Sleep: The New Science of Sleep and Dreams by Matthew WalkerThe Wizard and the Prophet by Charles MannRelated posts The OS ClassicsTwo Recommended Essayists© 2025 All Things Distributed'''
