title = "Introducing the inaugural Now Go Build CTO Fellows | All Things Distributed"
description = "Earlier this year, I announced the Now Go Build CTO Fellowship. A program designed to empower leaders from nonprofits and social impact organizations solving hard human problems. Today, I'm excited to introduce the first two cohorts, focusing on Disaster Management and Climate Resilience."
full_description = 'All Things Distributed Now Go Build! Articles @werner function myFunction(){var e=document.getElementById("myTopnav");e.className==="topnav"?e.className+=" responsive":e.className="topnav"}Introducing the inaugural Now Go Build CTO FellowsNovember 21, 2024 • 1457 wordsFor the last five years, I’ve spent a lot of time listening to and documenting the stories of builders that are using AWS technologies to solve hard human problems for my series Now Go Build. Whether it’s providing an identity to previously unbanked rice farmers in Indonesia, using computer vision and machine learning to responsibly farm fish in Norway, or finding ways to pair cloud technology with human intuition to reforest parts of Hawaii, innovative folks around the world are showing that not everyone wants to be the next unicorn, and proving that it’s possible to do good and run a profitable business.However, realizing the full potential that technology offers to solve these pressing issues, such as disaster relief and climate change, takes more than just financial investment. It requires a dedicated focus on nurturing and developing the technical expertise and innovation capabilities of the leaders in these spaces. That’s why earlier this year at VivaTech, I announced the Now Go Build CTO Fellowship in collaboration with AI for Changemakers led by Tech To The Rescue.This fellowship is tailored for aspiring tech leaders in nonprofits and social impact organizations. It provides fellows with training, mentorship, and access to AWS experts to accelerate their growth and the development of tech solutions that can make a profound difference in areas such as disaster management, climate, health and beyond.Today, I’d like to announce the first two cohorts of the Now Go Build CTO Fellowship: Disaster Management, and Climate Resilience. These individuals and their organizations are taking on some of humanity’s hardest problems — and I’d like to introduce them to you (in their own words).Aleksandra (Ola) Bilicka, Help.NGO Based in: Poznań, PolandFrom a young age, I recognized the significant potential of technology to do good, from flying ultralight aircraft to witnessing drones identify at-risk penguin colonies. Hybrid edge computing and its ability to address some of the world’s most challenging humanitarian and development issues has been a driving force for me. In my current role, I’m fortunate to leverage these technologies as our team responds to crises and complex emergencies, ranging from hurricanes in Mexico and tornadoes in Kentucky to earthquakes in Turkey and conflict in Ukraine. Our team utilizes open-source AWS workloads to enable multinational organizations, local leaders, and first responders to understand field challenges, visualize data, make informed decisions, and communicate on the move. I hope the Fellowship will equip me with leadership skills and provide a deeper understanding of emerging technologies and their applications in emergency settings.Alicia Morrison, Mercy Corps Based in: Saint Paul, MN, USAMercy Corps is a global organization serving communities in over 40 countries, helping them rebuild after disasters, break cycles of poverty, and forge paths to prosperity in the face of injustice, instability, and climate change. We leverage digital technologies, remote sensing, AI, and cloud computing to develop and scale innovative solutions that enhance the effectiveness and efficiency of humanitarian aid. As Senior Director of Technology for Development, I spearhead efforts to identify new applications for technology and data, develop strategies for tech integration, and build internal technical capacity. The CTO Fellowship presents an extraordinary opportunity to learn from one of the world’s most innovative executives and elevate our ability to harness technology for social good.Ameesh Kapoor, 412 Food Rescue Based in: Pittsburgh, PAWith two decades of technology experience spanning diverse industries including gaming, finance, and now food recovery, I’ve been serving as the Head of Engineering at 412 Food Rescue/Food Rescue Hero for the past five years. During this time, I’ve helped expand the Food Rescue Hero (FRH) platform to engage over 50,000 volunteers across 20 North American regions. The FRH platform offers Food Recovery Organizations a comprehensive solution for efficient operations and volunteer management, aiming to streamline the food recovery process and make it as intuitive, equitable, and accessible as possible for all stakeholders. This Fellowship presents a unique opportunity to gain insights into the challenges faced by other innovative organizations in our field. Moreover, it will amplify our national reach and pave the way for our global expansion efforts.Carlos Saito, Green Xpo Lab Based in: Heredia, Costa RicaI’m deeply passionate about leveraging innovative technologies, remote sensing, image and data processing to create positive impact. As the CTO of qAIRa in Lima, Peru, and the CEO of Green Xpo Lab in San José, Costa Rica, I lead teams that harness remote sensing technology, data analytics, and AI models to develop solutions that empower our clients to make informed decisions. Our focus is on creating the ideal platform to present these results, ensuring our clients not only access the data they need but also gain valuable insights that drive continuous improvement of our offerings. The Fellowship represents an exciting opportunity for me to chart a clear path towards becoming an exceptional project and product manager, as well as a more effective technology leader. As I strive to lead my teams to success, I’m eager to acquire the tools and strategies necessary to guide our efforts and achieve our ambitious goals more effectively.Clemence Kyara, Code for Africa Based in: Ubungo, TanzaniaAs the CTO at Code for Africa, I lead teams that build civic tech solutions to empower communities and drive social change across the continent through data-driven initiatives. My passion lies in using technology to address social issues, focusing on developing accessible tools for citizen engagement, data analysis, and public service delivery. As an open-source advocate and seasoned technical leader, I’m committed to creating technology that serves those who need it most.Fermin Selva, La Coordinadora Regional de Investigaciones Económicas y Sociales (CRIES) Based in: Buenos Aires, ArgentinaGrowing up in Latin America, I witnessed firsthand the challenges our region faces. This experience fueled my desire to make a difference, leading me to a career in public affairs where I honed my skills in driving impactful change. However, I sought a way to apply these skills with greater precision and scale – like a surgeon needing a scalpel, not just a hammer. This pursuit led me to CRIES, where we leverage AI and OSINT to address critical issues such as arms trafficking, protecting indigenous community rights, combating disinformation, and preventing climate-driven conflicts. I believe the Now Go Build Fellowship will be instrumental in scaling our impact and developing an ambitious early warning system for the region.Kuldeep Bandhu Aryal, ACAPS Based in: Bangladesh and NepalWith nearly a decade of experience in innovation management within the humanitarian and development sectors, I focus on promoting open-source innovations and whole-of-community approaches to enhance resilience in resource-constrained environments. My expertise lies in leveraging social innovation, human-centered design, and the judicious application of frontier technologies to address challenges faced during humanitarian crises. As Chair of the UK Humanitarian Innovation Hub’s Advisory Group and a Fellow at the Ethereum Foundation, I bring a diverse perspective to the field. Currently, I’m spearheading efforts in exploration, strategy development, and rapid experimentation around Generative AI at ACAPS and BRAC.Petya Kangalova, Humanitarian OpenStreetMap Team (HOT) Based in: Bristol, UKI’m Petya Kangalova, Technology Partnership and Engagement Lead at the Humanitarian OpenStreetMap Team (HOT). At HOT, we provide map data that revolutionizes disaster management, mitigates risks, and contributes to achieving the Sustainable Development Goals. We develop a suite of open-source tools for collaborative mapping and geospatial data collection, including an AI-assisted mapping service that enhances efficiency for humanitarian mappers.As an open tech enthusiast, community builder, innovator, and advocate for diversity and inclusion in the tech industry, this Fellowship will empower me to strengthen my leadership skills and accelerate innovation in the open mapping and geospatial field. It will also facilitate connections and collaborations with other leaders in the tech and humanitarian sectors, enabling us to refine our technologies and create more sustainable impact in addressing today’s most pressing challenges.Vijay Solanky, Watershed Organization Trust (WOTR) Based in: Pune, IndiaAt WOTR, I spearhead initiatives that harness technology to enhance rural resilience and empowerment, addressing challenges in sustainable agriculture, food security, drought resilience, and climate adaptation. By integrating AI, satellite imagery, and mobile tools, we enable communities to make data-driven decisions and improve operational efficiency. The CTO Fellowship offers invaluable insights and connections that will help us scale our impact on rural livelihoods and environmental conservation.A call for future fellows While our inaugural Fellows has been selected, we are still recruiting fellows with a focus in these critical areas:HealthEducationEconomic DevelopmentVisit Tech to the Rescue to learn more about the Now Go Build CTO Fellowship and to apply.Now, Go Build!Recommended posts District heating: Using data centers to heat communitiesAI doesn’t plant treesHow Terraformation is using AWS technology to reforest the world© 2025 All Things Distributed'
