title = "Empowering builders with the new AWS Asia Pacific (Malaysia) Region | All Things Distributed"
description = "Builders are at the heart of AWS. Most recently, I visited Malaysia, the location of the newest AWS Region, our 34th globally, and home to a rapidly evolving technology sector, where businesses of all sizes are proving that solving hard human problems can be a profitable business model."
full_description = 'All Things Distributed Now Go Build! Articles @werner function myFunction(){var e=document.getElementById("myTopnav");e.className==="topnav"?e.className+=" responsive":e.className="topnav"}Empowering builders with the new AWS Asia Pacific (Malaysia) RegionAugust 29, 2024 • 582 wordsBuilders are at the heart of AWS. As Amazon’s CTO, one of the most rewarding parts of my job is meeting with builders from across the world to better understand the unique challenges that they’re encountering while building on AWS.Most recently, I traveled to Southeast Asia to dive into the region’s rising builder culture. One of the countries I visited was Malaysia, the location of the newest AWS Region, our 34th globally, and home to a rapidly evolving technology sector, where entrepreneurs, business owners, and a vibrant community of builders are proving that solving hard human problems can be a profitable business model.Tech for good Disaster relief is one of the most important areas where technology can make a profound impact on saving lives. When natural disasters or human-made crises occur, every second counts, and having the right tools and systems in place can significantly impact outcomes. In these scenarios, computer vision, machine learning, and cloud technologies paired with drones, environmental sensors, and other hardware advances have real potential to streamline disaster response, improve communication and coordination, and provide real-time data and insights that can guide rescue efforts and aid distribution.During this trip, I met with Aerodyne, a Malaysian-based drone and drone data company that got its start in aerial mapping data and imagery. When devastating floods struck the region in 2014, the company saw an opportunity to use its drone technology for search and rescue. They deployed their drones to map water flows and gather data, which aided in creating evacuation routes and mapping rescue paths. This pivot showed how the company’s innovative technology could create massive positive impact in times of crisis.Leveraging that experience, Aerodyne has continued finding new applications for its drone data platform to drive sustainable growth. Today, the company is focused on solving complex industrial challenges. By running its DRONOS software platform on AWS, Aerodyne can automatically analyze petabytes of aerial data using machine learning to deliver critical insights. In agriculture, this means quickly identifying issues like crop disease or lack of irrigation so farmers can rapidly respond – boosting yields by up to 67%. For telecom companies, Aerodyne uses drones to safely inspect and map cellular towers, accelerating 5G deployment by over 90% while reducing operational costs.What started as using drones for mapping has evolved into using drones to solve challenges around food security, disaster response, connectivity and energy security. It is a good example that a business with a noble purpose can grow sustainably, while continually finding new ways to create positive impact.A crucible for innovation I’ve seen this pattern repeated across Southeast Asia, where the emphasis isn’t always on becoming the next unicorn, but on solving the problems that directly impact people in their communities. I witnessed companies democratizing financial services, improving access to credit for underserved communities, and a relentless focus on providing educational resources to students of all ages.Even after numerous visits to this part of the world, I remain inspired by the region’s rapidly evolving technology sector and the vibrant drive for positive impact. To all the builders across Malaysia and beyond, your efforts to unlock new opportunities and solve pressing problems are truly inspiring. I eagerly anticipate returning to witness and celebrate your continued progress.Now, go build!Recommended posts Melbourne gets a region, a big trip, and a brain mapping startup¡Bienvenida España! Introducing the new AWS Europe (Spain) RegionThe new AWS Europe (Zurich) Region and 16 years of Swiss innovation© 2025 All Things Distributed'
