full_description = "A Nevernude Frog Guy Post author By Vishal Post date April 26, 2017 Tinkering with these drawing videos, I think I’ve figured out a pace I like. 2x timelapses seem to be a happy medium between the slow, methodical real-time videos, and the ultra-fast ones that are 4 or even 8x sped-up. For now I’m using the Hyperlapse app on my phone to easily spit out timelapses; it’s […] Tags creature design, hyperlapse, pencil, sketch, sketchbook, timelapse, video, youtube 14 Minute Belly Dancer, OR How Long Does a Practice Sketch Take? Post author By Vishal Post date April 24, 2017 I like to start most drawing sessions with a sketch in one of several practice or sketchbooks I have running at any time. Some of them are focused topic sketchbooks, such as my Creatures Sketchbook (more on that in a future post), and some are less so. Such is my current ‘Practice Makes Perfect’ sketchbook, […] Tags belly dancer, pencil, practice makes perfect, real time, sketch, sketchbook, video, youtube Practice 28 March 2014 Post author By Vishal Post date March 28, 2014 I need to start owning my process and acknowledging all the steps that it takes to get to a finished piece of work. So much of this gets lost in sketch books, and after a while you start to think you can do without it, much to your own peril. So now & then I’ll […] Tags Illustration, pencil, portrait, practice, sketch, woman Train Station – Foreground Inks Post author By Vishal Post date March 27, 2012 Foreground inks are done on my Train Station image for Today’s Doodle. I use a Zebra Calligraphy pen (aka my favourite pen ever) to do the figures. The calligraphy pen gives a nice bouncy, organic line that works well for living creatures. The thinner lines such as the fairy’s wings and the anatomy that shows through from behind it was done with a Uniball Pin 0.05 fine liner. I’ll be using this fine pen more as I get farther into the background, and of course for detail work later. V Tags elf, fantasy, Illustration, inking, pencil, sketch, train station, work in progress, zebra calligraphy pen"
