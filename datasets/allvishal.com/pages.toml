o re-do it several dozen times. I exaggerated the robotness of him a bit more than he is in the movies (where being played by a man in a suit does impose some restrictions on structure). Onward and upward. V PS No, I have no idea why he has a handbag either. Tags 26characters, c-3po, digital painting, droid, george lucas, graphics tablet, Illustration, mypaint, science fiction, star wars ← #26Characters – B for Batman → Adventures in Cheesy Baked Pasta & No-Knead Bread"
