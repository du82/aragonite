full_description = "Welcome Back to allVishal.com Post author By Vishal Post date April 9, 2013 The more things change, the more they stay the same. Welcome to allVishal.com again. Same-same, but different. New logo. Revamped Portfolio section. Comments are back (do leave one, say hello). Fewer pictures of me on a pink slide on the About page (I’m not sure if this is for the better). There’s still a bunch […] Tags blogging, site maintenance, Sitemonkey, web design Cleaning Up Post author By Vishal Post date September 1, 2010 As some of you may have noticed, the site is a shambles. Sure, it looks okay, but it’s now cobbled together from a pre-existing theme, ever since my old theme wasn’t going to work with the new Drupal upgrade. Since updating I’ve been inundated with comment spam. This is ironic, since I upgraded Drupal because I was getting comment spam. So for the foreseeable future, I’m shutting off comments on this site. Sorry about this. I’m hopping on a plane in less than twenty-four hours and do not have the time to deal with this right now. The site itself needs a total overhaul at some point soon, but hopefully comments will be back long before then. In the meantime, you can contact me by mail (allvishal at gmail) or on twitter. V Tags comment spam, General Nonsense, site maintenance, Sitemonkey"
