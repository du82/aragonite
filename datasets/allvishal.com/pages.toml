full_description = "Categories About Writing The Novemberist Post author By Vishal Post date November 1, 2021 This blog is now 20 years old. I know, because there’s a version of this post every few years, and the first of them appeared late in October 2001. I went and checked. You should not read your old writing. Doubly so, your old blog posts, but my excuse was research, and an anniversary, so […] Tags nanowrimo, novel writing, Writing Categories Praxis A Cheap Sketchbook & a Life in Progress Post author By Vishal Post date July 10, 2021 It is a truth universally acknowledged, by many a creative person, that expensive notebooks are traps. The beauty of them, the craft involved in making them, is not in question. But it is their very beauty and craft that makes a creative person pause, hesitate, worry, over what goes in it, be it scribble or […] Tags art practice, creatures, krita, orcs vs inks, practice makes progress, process, sketchbook, two terrible pages Categories Colophon Welcome to allVishal.com Post author By Vishal Post date July 10, 2021 This is my little corner of the internet, containing personal work in illustration & design, and idle musings. It aggregates a bunch of blogs going back all the way to 2001, but nobody really needs to read those. A selection of work can be found here. You can find me on a few social media […] Categories Praxis Drawing 100 Portraits with Krita – Milestone 15 Post author By Vishal Post date June 21, 2018 I’ve been doing one of those hashtag challenges that do the rounds of social media, in this case #100Heads or #100HeadsChallenge, where the aim is to do 100 portraits or character heads. I guess some people do it in a hundred days, but I am setting no such goals. Instead, mine are: 1 – To […] Tags #100heads, #100headschallenge, character design, concept art, digital painting, krita, portrait Categories Out & About Crowds & Men, Artists All Post author By Vishal Post date March 19, 2018 Last week I went to a couple of art exhibitions & a museum workshop, and they got me thinking about Art. Now, I try to think about Art as little as possible, regard it from the corner of my eye, never cohere it in my inner ear. It’s the background noise to my chosen occupation […] Tags art gallery, art retrospective, artist, csmv, Illustration, manu parekh, modern art, paper quilling, papercraft, papernautic, sameer kulavoor, samir bharadwaj, sketchbook, varanasi"
