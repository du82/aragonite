full_description = "Categories Praxis Drawing 100 Portraits with Krita – Milestone 15 Post author By Vishal Post date June 21, 2018 I’ve been doing one of those hashtag challenges that do the rounds of social media, in this case #100Heads or #100HeadsChallenge, where the aim is to do 100 portraits or character heads. I guess some people do it in a hundred days, but I am setting no such goals. Instead, mine are: 1 – To […] Tags #100heads, #100headschallenge, character design, concept art, digital painting, krita, portrait Lady with a Space Ermine Post author By Vishal Post date October 7, 2014 The other day I was looking for any excuse, as usual, to not do any work. I needed to try out some techniques on some new illustrations I’m working on, original pen & ink art that will be for sale, in fact (stay tuned for news on those!). As I was arranging my art supplies […] Tags ermine, Illustration, leonardo da vinci, pen & ink, pets, portrait, practice, retro, rocket, science fiction, sketch, space, space ship, space suit, woman Practice 28 March 2014 Post author By Vishal Post date March 28, 2014 I need to start owning my process and acknowledging all the steps that it takes to get to a finished piece of work. So much of this gets lost in sketch books, and after a while you start to think you can do without it, much to your own peril. So now & then I’ll […] Tags Illustration, pencil, portrait, practice, sketch, woman A Well-Rounded Breakfast Post author By Vishal Post date April 21, 2013 Final Sunday Sketch-a-thon entry, for @jyotishkaray, or as I will always call him in my head, @OldMonkMGM: Still can’t draw hands. V Tags portrait, sketch, south india, sunday sketch-a-thon, woman, zombie Practice Makes Perfect Post author By Vishal Post date April 26, 2012 Once in a while, I tell myself I should practice. It’s fine doing something with a goal like #26Characters, but in addition to more structured projects, you do need to spend some time just mucking about. Here’s the results of today’s mucking about, done in 15 minutes. I tried as best I could to get away from the dreaded “every character looks 28 years old” syndrome that affects many illustrators. It helps to pay attention to these sorts of common pitfalls, and nothing better than random sketches to exercise & exorcise those demons. V Tags digital sketch, graphics tablet, Illustration, mypaint, portrait, woman"
