full_description = "The Return of Sunday Night Sketch-a-Thon Post author By Vishal Post date June 1, 2015 I could barely believe it, but it’s been one and a half years since the last one. I do them for practice, challenging myself, to get the engines running after long periods of not drawing (which I have been in for the past few months). Only managed three of the ten or so prompts received on facebook and twitter, but I’m happy with all three of them. First request came in on twitter. I can always count on @koquettish for properly weird ones. https://twitter.com/koquettish/status/605060929307308032 I’d been talking about ‘Allo ‘Allo with friends, so someone on facebook asked for a Fallen Madonna with the Big Boobies. I had to oblige, with a twist, of course. Finally, a drawing of White Phoenix (or maybe it’s Dark Phoenix? Who can tell in black & white?) for @jayesh on twitter. Really happy pushing the foreshortening on this one, something I rarely do because I’m too scared. There were some more sketch topics, but only time & laziness will tell if I get around to them. 🙂 V Tags allo allo, boobies, fallen madonna, hair, horror, jean grey, pen & ink, sketch, sunday sketch-a-thon, weird, white phoenix of the crown, x-men By Vishal I design & create beautiful, useful, and not-so-useful things that delight. View Archive → ← One Logo (With a Ring) To Rule Them All → Blinky Spider-Man GIF"
