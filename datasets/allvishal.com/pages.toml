full_description = "A Bunch of Work from 2012 Post author By Vishal Post date January 2, 2013 I did a whole bunch of work last year, most of which I didn’t blog about here. So here is a roundup of some of the good stuff that came out of my brain in twenty-twelve. Though I spent most of January & February in India, I was also working on The Sarcastic Voyage Guide […] Tags animation, business card, christmas present, Design, dr. who, drunken time travel, elf, fantasy, Illustration, logo design, monsters, post atomic horror, sarcastic voyage, science fiction, star trek, story illustration, timelapse, video, werewolf Train Station — Completed Ink Drawing Post author By Vishal Post date April 3, 2012 Well, it’s done, for now. Quite happy how this turned out, considering how little planning went into it. V Tags beast of burden, concept art, elf, fantasy, Illustration, train station, woman Train Station – Foreground Inks Post author By Vishal Post date March 27, 2012 Foreground inks are done on my Train Station image for Today’s Doodle. I use a Zebra Calligraphy pen (aka my favourite pen ever) to do the figures. The calligraphy pen gives a nice bouncy, organic line that works well for living creatures. The thinner lines such as the fairy’s wings and the anatomy that shows through from behind it was done with a Uniball Pin 0.05 fine liner. I’ll be using this fine pen more as I get farther into the background, and of course for detail work later. V Tags elf, fantasy, Illustration, inking, pencil, sketch, train station, work in progress, zebra calligraphy pen Train Station – Pencils Post author By Vishal Post date March 26, 2012 (I’ll be posting work-in-progress and quick process updates here more often now. You know, what my blog was supposed to be about.) The latest drawing for the Today’s Doodle site, on the subject ‘Train Station’. I’m quite surprised that I not only managed to pull this off without any pre-sketch or thumbnail, but also within an hour. This sort of thing usually takes me two-to-three hours or hemming and hawing over every little detail. On to the inks! V Tags elf, fantasy, Illustration, pencil, sketch, train station, work in progress"
