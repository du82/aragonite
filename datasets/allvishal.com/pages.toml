full_description = "Welcome Back to allVishal.com Post author By Vishal Post date April 9, 2013 The more things change, the more they stay the same. Welcome to allVishal.com again. Same-same, but different. New logo. Revamped Portfolio section. Comments are back (do leave one, say hello). Fewer pictures of me on a pink slide on the About page (I’m not sure if this is for the better). There’s still a bunch […] Tags blogging, site maintenance, Sitemonkey, web design Cleaning Up Post author By Vishal Post date September 1, 2010 As some of you may have noticed, the site is a shambles. Sure, it looks okay, but it’s now cobbled together from a pre-existing theme, ever since my old theme wasn’t going to work with the new Drupal upgrade. Since updating I’ve been inundated with comment spam. This is ironic, since I upgraded Drupal because I was getting comment spam. So for the foreseeable future, I’m shutting off comments on this site. Sorry about this. I’m hopping on a plane in less than twenty-four hours and do not have the time to deal with this right now. The site itself needs a total overhaul at some point soon, but hopefully comments will be back long before then. In the meantime, you can contact me by mail (allvishal at gmail) or on twitter. V Tags comment spam, General Nonsense, site maintenance, Sitemonkey allVishal is now on Twitter! Post author By Vishal Post date December 27, 2008 I‘m not an early adopter. I’m not even a late adopter. So I’m probably the last person on the entire interwub who’s signed up to Twitter, but now I have! V Tags General Nonsense, Interwubbing, Sitemonkey, social networking, tweeting, twitter, Writing My Google Reader Shared Items Blog: Now with Added Value! Post author By Vishal Post date November 22, 2008 Just wanted to give you guys a heads up that I’m now using the Share With Note feature on my Google Reader Shared Items, so in addition to the widget in the sidebar providing you with the latest links on stuff I’m browsing, you can now check the blog itself (or subscribe to its own Atom feed) for little notes by me on each item (I’ll try to write more than just, “Cool, lookit!” — I swear!). I generally share things that I hope readers of this blog will like, so lots of stuff on design of all kinds, illustration, photography and of course, lots and lots of weird stuff. You can access my Google Reader Shared Items Blog by clicking here. V Tags blogging, cool links, google, google reader, Interwubbing, Sitemonkey"
