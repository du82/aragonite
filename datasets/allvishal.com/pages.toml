full_description = "A Thing About Dieter Rams Post author By Vishal Post date September 24, 2014 Tags Design, dieter rams, graphic design, joke, minimalism, poster, poster design A Bunch of Work from 2013 Post author By Vishal Post date January 1, 2014 I did less work than I would have liked in 2013. Various factors led to this, but mostly I spent the year either chasing client work that never came through, planning & putting work into personal projects that have yet to be realised (ahem, the webcomic, mostly), or actually enjoying myself with extended family. There […] Tags Design, Dubai, Food Photography, Illustration, logo design, pen sketch, Photographs, podcast, sketch, star trek, street photography A Bunch of Work from 2012 Post author By Vishal Post date January 2, 2013 I did a whole bunch of work last year, most of which I didn’t blog about here. So here is a roundup of some of the good stuff that came out of my brain in twenty-twelve. Though I spent most of January & February in India, I was also working on The Sarcastic Voyage Guide […] Tags animation, business card, christmas present, Design, dr. who, drunken time travel, elf, fantasy, Illustration, logo design, monsters, post atomic horror, sarcastic voyage, science fiction, star trek, story illustration, timelapse, video, werewolf A 10-minute Business Card Design Post author By Vishal Post date March 15, 2012 The other day, I had literally 10 minutes to design a business card. My dad needed to go to a trade show, and with no cards on hand, and no time to get a design offset-printed, we decided to just get it done from a copy shop, five sheets (50 cards) of 300gsm paper that I hand-cut later at home. I’ve used this method before, for my own business cards. It’s mainly because I don’t usually need many cards (I give out, maybe a few dozen a year), and because I can quickly and easily change info and designs, keep it fresh. So, coming back to this card, with 10 minutes there really isn’t a lot of time for fancy graphics or elaborate illustration. It needs to be strong, sharp and get the job done. But one needn’t stick to simply printing the name & info in a basic font against white, and being done with it. As you can see, there is a little bit of mood and identity to it, even without a logo. And judging by the very staid, sober cards I’ve seen from most Water Treatment industry types, it certainly stands out, a key factor with the identity of a consultant — and individual — as opposed to someone representing a corporation. It’s not the greatest piece of work I’ve done, but for 10 minutes, I’m satisfied, and most importantly, it did its job: to be given out at a trade show to the kind of people who still keep stacks of cards rather than some fancy digital solution. Already, I am told, at least one staid, sober water treatment industry type who saw this card remarked that it was ‘too bold’. I think he’s the kind that prefers plain Times New Roman on a white piece of paper. He’s probably Patrick Bateman, too. Tags business card, Design, graphic design, inkscape, vector"
