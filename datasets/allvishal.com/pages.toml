full_description = "Blinky Spider-Man GIF Post author By Vishal Post date March 14, 2016 Quick & dirty #SpiderMan GIF, since his ‘eyes’ moving in Captain America Civil War seems to be the topic-du-jour to bitch about on twitter. Yes, I know he doesn’t blink like this. Tags animated gif, captain america civil war, marvel, spider-man End of 2013 Mega Sketch-a-Thon! (Part 1) Post author By Vishal Post date December 26, 2013 In keeping with a tradition I’ve done… er, two or three times, sporadically, it’s time for another Sketch-a-thon! I set aside a whole weekend for this, and solicited sketch topics on both facebook & twitter. I got a ton, and am still working through most of them. But here’s the first eight. “Bear With Us” […] Tags bear, brush pen, crane, diver, dog, kaiju, magician, origami, pen sketch, sea serpent, sketch, spider-man, sunday sketch-a-thon, taxi, titanic, vigil idiot, wolverine, woman"
