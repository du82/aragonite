full_description = "#26Characters – F for Fandorin Post author By Vishal Post date May 15, 2012 Continuing this series with a bit of a quickie (as in, it didn’t take me three hours and several abandoned attempts), this is F for Fandorin. Erast Petrovich Fandorin is the protagonist of a series of novels by Boris Akunin. Fandorin is smart, stylish, and a talented (and lucky) detective. Fandorin is a bit of Sherlock Holmes, a bit of James Bond, and a bit of Batman. The novels he stars in are as enjoyable and witty as such a cocktail of ingredients is likely to produce. With this one speed was of the essence; even with a bit of dawdling, I completed it in under 90 minutes. I went for coloured linework instead of basic blacks this time, which gives it less of a graphic look than previous ones, but is one step further on the exploratory road that this project takes me on. V Tags 26characters, boris akunin, detective, digital painting, fandorin, graphics tablet, Illustration, mypaint, russia"
