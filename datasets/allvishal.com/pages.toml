full_description = "Categories Praxis Drawing 100 Portraits with Krita – Milestone 15 Post author By Vishal Post date June 21, 2018 I’ve been doing one of those hashtag challenges that do the rounds of social media, in this case #100Heads or #100HeadsChallenge, where the aim is to do 100 portraits or character heads. I guess some people do it in a hundred days, but I am setting no such goals. Instead, mine are: 1 – To […] Tags #100heads, #100headschallenge, character design, concept art, digital painting, krita, portrait #26Characters: H for Heckler Post author By Vishal Post date March 7, 2013 Growing up I didn’t have the ready access to new comics that most kids in more developed parts of the world did. Most of the ones I ended up reading were DC & Marvel stuff years out of date, fragments of larger stories I had no hope of being able to collect the full sets […] Tags 26characters, comic book, dc comics, digital painting, graphics tablet, heckler, mypaint, sketch, superhero #26Characters: G for Guybrush Post author By Vishal Post date January 3, 2013 Here, finally, is the next #26Characters post. When I started this project, one of the names on the list of characters pretty early on was that of Guybrush Threepwood, star of the Monkey Island series of games from LucasArts. The Secret of Monkey Island had a profound effect on me as a child. It was […] Tags 26characters, digital painting, graphics tablet, guybrush threepwood, monkey island, mypaint, sketch, video game #26Characters – F for Fandorin Post author By Vishal Post date May 15, 2012 Continuing this series with a bit of a quickie (as in, it didn’t take me three hours and several abandoned attempts), this is F for Fandorin. Erast Petrovich Fandorin is the protagonist of a series of novels by Boris Akunin. Fandorin is smart, stylish, and a talented (and lucky) detective. Fandorin is a bit of Sherlock Holmes, a bit of James Bond, and a bit of Batman. The novels he stars in are as enjoyable and witty as such a cocktail of ingredients is likely to produce. With this one speed was of the essence; even with a bit of dawdling, I completed it in under 90 minutes. I went for coloured linework instead of basic blacks this time, which gives it less of a graphic look than previous ones, but is one step further on the exploratory road that this project takes me on. V Tags 26characters, boris akunin, detective, digital painting, fandorin, graphics tablet, Illustration, mypaint, russia"
