full_description = "#26Characters: H for Heckler Post author By Vishal Post date March 7, 2013 Growing up I didn’t have the ready access to new comics that most kids in more developed parts of the world did. Most of the ones I ended up reading were DC & Marvel stuff years out of date, fragments of larger stories I had no hope of being able to collect the full sets […] Tags 26characters, comic book, dc comics, digital painting, graphics tablet, heckler, mypaint, sketch, superhero #26Characters: G for Guybrush Post author By Vishal Post date January 3, 2013 Here, finally, is the next #26Characters post. When I started this project, one of the names on the list of characters pretty early on was that of Guybrush Threepwood, star of the Monkey Island series of games from LucasArts. The Secret of Monkey Island had a profound effect on me as a child. It was […] Tags 26characters, digital painting, graphics tablet, guybrush threepwood, monkey island, mypaint, sketch, video game #26Characters – F for Fandorin Post author By Vishal Post date May 15, 2012 Continuing this series with a bit of a quickie (as in, it didn’t take me three hours and several abandoned attempts), this is F for Fandorin. Erast Petrovich Fandorin is the protagonist of a series of novels by Boris Akunin. Fandorin is smart, stylish, and a talented (and lucky) detective. Fandorin is a bit of Sherlock Holmes, a bit of James Bond, and a bit of Batman. The novels he stars in are as enjoyable and witty as such a cocktail of ingredients is likely to produce. With this one speed was of the essence; even with a bit of dawdling, I completed it in under 90 minutes. I went for coloured linework instead of basic blacks this time, which gives it less of a graphic look than previous ones, but is one step further on the exploratory road that this project takes me on. V Tags 26characters, boris akunin, detective, digital painting, fandorin, graphics tablet, Illustration, mypaint, russia #26Characters – E for Emma Frost Post author By Vishal Post date May 7, 2012 Well, it’s been a while. When I started this project I made a quick list of names from A-Z spanning fictional characters, mostly the first thing that sprung to mind. My friend @OldMonkMGM on twitter wondered if I was taking requests, and then asked if I could draw Emma Frost next. I said yes, of course — my earlier stand-in for E was pretty crappy anyway 🙂 That means this list is by no means permanent, so if you have a specific request, feel free to drop me an email or a tweet @allvishal. So far, the letters H & M are spoken for, but there’s plenty more alphabets to choose from. 🙂 Emma Frost, formerly of the villanous Hellfire Club, is now the leader of the X-Men. You may remember her from the excellent film X-Men First Class, where she was played — badly — by January Jones. Ms. Frost is known for her telepathic powers, her ability to turn into a diamond-like substance, and for her skimpy outfits. Seriously, many of her costumes are just lingerie, fur coats and boots. I went with what I am told is her latest incarnation, which at least has pants instead of a thong. I quite like the costume, especially the way the cape sits, and I’m a sucker for anything with opera gloves. (Now if only I could actually draw hands and feet) Much as I try, these take a lot longer to do right now, at my current skill level, than traditional drawing. So consequently, I’m never really happy with the results, and the same is true in this case. There’s several elements I like about this one, but much of it is the result of my hands getting tired. I wrestle with the tablet in ways I do not (and can not) with a real pen. Chalk it up to the combination of a hard plastic interacting with another hard plastic, and the disconnect between looking at a screen and moving your hand somewhere else. I may possibly need better hardware — my tablet is a simple, cheap one by Genius — but I know where this rabbit hole leads, and I’m not prepared to plonk down thousands of dollars for a Cintiq. I may have to get looser with these, more sketchy, more painterly, but the latter of those two is completely uncharted territory, and every time I try I end up with a mess. Oh well, this is nothing if not an excuse to fail, and then fail better the next time. And, overall, I think I am failing a little better with each one. V Tags 26characters, blonde, comic books, digital painting, emma frost, graphics tablet, Illustration, marvel comics, mypaint, woman, x-men"
year_published = 2013
