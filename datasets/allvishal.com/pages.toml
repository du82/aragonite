full_description = "Post Atomic Horror Podcast Supplemental 27 Cover Post author By Vishal Post date July 24, 2016 Client: AAlgar Production Year: 2016 With the release of the third ‘reboot’ film, Star Trek Beyond, came the opportunity to do a cover for The Post Atomic Horror Podcast’s special episode covering the film. I went with a variant of what I usually do for their between-season ‘supplemental’ episodes, a fake & humorous magazine cover, […] Post Atomic Horror Podcast Supplemental 16 Cover Post author By Vishal Post date March 30, 2014 As the Post Atomic Horror podcast moved into reviewing Star Trek: Deep Space Nine, I finally got a chance to tackle one of my all-time favourite characters from Trek, Jadzia Dax. Hand drawn & inked,coloured in inkscape. Doctor Who Fan Stories – The Witch Hunters Post author By Vishal Post date March 29, 2014 Client: Jason R Wallace Year: 2014 In addition to the logo I also did this cover art for the second installment of the Doctor Who Fan Stories. Main figures are hand-drawn, inked, and all other elements coloured & created in inkscape. Doctor Who Fan Stories Logo Post author By Vishal Post date March 29, 2014 Client: Jason Ryan Wallace Year: 2014 The Doctor Who Fan Stories are the audio adventures of an alternate 11th Doctor (played by Jason R. Wallace) and new companions. Given the wealth of Who-related iconography, I knew I had to evoke some of it, without being directly infringing on any current or past Who logos. I […] Drunken Time Travel & Post Atomic Horror Crossover 3 Covers Post author By Vishal Post date December 31, 2013 Client: AAlgar Productions, and the Drunken Time Travel Podcast Year: 2013 A slight break in the style of these supplemental covers. No fake magazine this time, since it would be the second annual crossover with Drunken Time Travel. Since the gentlemen were discussing their personal worst Star Trek & Doctor Who episodes, I decided to […] Tiger T-Shirt Graphic Post author By Vishal Post date Septembe