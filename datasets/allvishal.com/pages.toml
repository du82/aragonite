full_description = "Categories Out & About Crowds & Men, Artists All Post author By Vishal Post date March 19, 2018 Last week I went to a couple of art exhibitions & a museum workshop, and they got me thinking about Art. Now, I try to think about Art as little as possible, regard it from the corner of my eye, never cohere it in my inner ear. It’s the background noise to my chosen occupation […] Tags art gallery, art retrospective, artist, csmv, Illustration, manu parekh, modern art, paper quilling, papercraft, papernautic, sameer kulavoor, samir bharadwaj, sketchbook, varanasi The Subspace Cellist Post author By Vishal Post date February 6, 2015 Trying to be a good boy and posting these here on the blog more often. This is the latest cover for the Post Atomic Horror Podcast’s Supplemental episode. I don’t always use references, but I’ll often do a blind sketch keeping a picture of a subject on the screen, without actually aiming for accuracy. More […] Tags cello, chief o'brien, deep space nine, ds9, Illustration, inkscape, magazine cover, miles o'brien, pen & ink, post atomic horror podcast, sketch, star trek Lady with a Space Ermine Post author By Vishal Post date October 7, 2014 The other day I was looking for any excuse, as usual, to not do any work. I needed to try out some techniques on some new illustrations I’m working on, original pen & ink art that will be for sale, in fact (stay tuned for news on those!). As I was arranging my art supplies […] Tags ermine, Illustration, leonardo da vinci, pen & ink, pets, portrait, practice, retro, rocket, science fiction, sketch, space, space ship, space suit, woman The Birth of Ziggy StarDax Post author By Vishal Post date March 31, 2014 I mentioned in a previous post about how I should be cataloging my process, if not for pure posterity & narcissism, then at least as a counter to my own spotty memory. I’ve often hesitated to put a lot of this ‘junk’ on my blog, considering starting separate blogs or repositories for such things (on […] Tags animated gif, curzon dax, deep space nine, Illustration, inkscape, jadzia dax, magazine cover, post atomic horror podcast, process, sketch, star trek"
