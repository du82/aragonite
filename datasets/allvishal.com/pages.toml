full_description = "Constantine, Morpheus, Jerusalem Post author By Vishal Post date January 9, 2014 Sketchathon topics continue to be worked on. This was requested on facebook by brother-from-other-mother Jamie. Not great, but not terrible. I went through far too many drafts for this, most of which involved Spider behaving badly. I could do a whole series. Maybe even a mini comic. Night on the town stuff. V Tags comic book, dc comics, hellblazer, john constantine, morpheus, pen sketch, sandman, sketchathon, spider jerusalem, transmetropolitan, vertigo #26Characters: H for Heckler Post author By Vishal Post date March 7, 2013 Growing up I didn’t have the ready access to new comics that most kids in more developed parts of the world did. Most of the ones I ended up reading were DC & Marvel stuff years out of date, fragments of larger stories I had no hope of being able to collect the full sets […] Tags 26characters, comic book, dc comics, digital painting, graphics tablet, heckler, mypaint, sketch, superhero #26Characters – B for Batman Post author By Vishal Post date April 22, 2012 The #26characters project continues with the letter B, and of course, I couldn’t help but do Batman. The answer to most problems is Batman. If you ever find yourself at a crossroads, the answer is probably also Batman. If you ask yourself who you love the most, it is Batman. Batman Batman Batman. Batman is the alter ego of Bruce Wayne (or is that the other way around?) a caped crusader against some of the most vicious and wonderful villains of comic books in Gotham City. Do I really need to tell you Batman is? Still at the very earliest baby steps of learning how to do this, but having fun with it. V Tags 26characters, batman, comic books, dc comics, digital painting, graphics tablet, Illustration, mypaint, super hero"
