full_description = "A Nevernude Frog Guy Post author By Vishal Post date April 26, 2017 Tinkering with these drawing videos, I think I’ve figured out a pace I like. 2x timelapses seem to be a happy medium between the slow, methodical real-time videos, and the ultra-fast ones that are 4 or even 8x sped-up. For now I’m using the Hyperlapse app on my phone to easily spit out timelapses; it’s […] Tags creature design, hyperlapse, pencil, sketch, sketchbook, timelapse, video, youtube 14 Minute Belly Dancer, OR How Long Does a Practice Sketch Take? Post author By Vishal Post date April 24, 2017 I like to start most drawing sessions with a sketch in one of several practice or sketchbooks I have running at any time. Some of them are focused topic sketchbooks, such as my Creatures Sketchbook (more on that in a future post), and some are less so. Such is my current ‘Practice Makes Perfect’ sketchbook, […] Tags belly dancer, pencil, practice makes perfect, real time, sketch, sketchbook, video, youtube The Return of Sunday Night Sketch-a-Thon Post author By Vishal Post date June 1, 2015 I could barely believe it, but it’s been one and a half years since the last one. I do them for practice, challenging myself, to get the engines running after long periods of not drawing (which I have been in for the past few months). Only managed three of the ten or so prompts received […] Tags allo allo, boobies, fallen madonna, hair, horror, jean grey, pen & ink, sketch, sunday sketch-a-thon, weird, white phoenix of the crown, x-men The Subspace Cellist Post author By Vishal Post date February 6, 2015 Trying to be a good boy and posting these here on the blog more often. This is the latest cover for the Post Atomic Horror Podcast’s Supplemental episode. I don’t always use references, but I’ll often do a blind sketch keeping a picture of a subject on the screen, without actually aiming for accuracy. More […] Tags cello, chief o'brien, deep space nine, ds9, Illustration, inkscape, magazine cove