le afraid of this post going off the rails (and a wagon and a saddle) into non-stop gushing about Mad Men — which it still could — but the point is that fear is as present in an writer as it is the audience, and often ending something sooner than you think is better than never at all. I’ve had my share of frustrating, absurd anticlimaxes to things in my personal & professional life, and while that isn’t what we enjoy in fiction, prolonging and postponing things for the sake of word counts or writing traditions only delivers an ending that is nothing but absurd and anticlimactic. I thought that this blog post would end differently, with some grand proclamation of getting back on that saddle, of promising — as I have many times before — a valiant return to writing, to producing, to meeting word counts and doing heroic feats of typing & first-draftery. But really, all I’m looking for is an ending. And I’m going to go see if can find it. V Tags blogging, fiction, mad men, nanowrimo, writer's block, Writing ← Power Dressing for Fun & Devilry → Lost Ideas"
