["https://allvishal.com/journal/tag/emma-frost-774"]
title = "emma frost - Vishal K Bharadwaj"
description = "I make good things"
full_description = "#26Characters – E for Emma Frost Post author By Vishal Post date May 7, 2012 Well, it’s been a while. When I started this project I made a quick list of names from A-Z spanning fictional characters, mostly the first thing that sprung to mind. My friend @OldMonkMGM on twitter wondered if I was taking requests, and then asked if I could draw Emma Frost next. I said yes, of course — my earlier stand-in for E was pretty crappy anyway 🙂 That means this list is by no means permanent, so if you have a specific request, feel free to drop me an email or a tweet @allvishal. So far, the letters H & M are spoken for, but there’s plenty more alphabets to choose from. 🙂 Emma Frost, formerly of the villanous Hellfire Club, is now the leader of the X-Men. You may remember her from the excellent film X-Men First Class, where she was played — badly — by January Jones. Ms. Frost is known for her telepathic powers, her ability to turn into a diamond-like substance, and for her skimpy outfits. Seriously, many of her costumes are just lingerie, fur coats and boots. I went with what I am told is her latest incarnation, which at least has pants instead of a thong. I quite like the costume, especially the way the cape sits, and I’m a sucker for anything with opera gloves. (Now if only I could actually draw hands and feet) Much as I try, these take a lot longer to do right now, at my current skill level, than traditional drawing. So consequently, I’m never really happy with the results, and the same is true in this case. There’s several elements I like about this one, but much of it is the result of my hands getting tired. I wrestle with the tablet in ways I do not (and can not) with a real pen. Chalk it up to the combination of a hard plastic interacting with another hard plastic, and the disconnect between looking at a screen and moving your hand somewhere else. I may possibly need better hardware — my tablet is a simple, cheap one by Genius — but I know where this rabbit hole leads, and I’m not prepared to plonk down thousands of dollars for a Cintiq. I may have to get looser with these, more sketchy, more painterly, but the latter of those two is completely uncharted territory, and every time I try I end up with a mess. Oh well, this is nothing if not an excuse to fail, and then fail better the next time. And, overall, I think I am failing a little better with each one. V Tags 26characters, blonde, comic books, digital painting, emma frost, graphics tablet, Illustration, marvel comics, mypaint, woman, x-men"
