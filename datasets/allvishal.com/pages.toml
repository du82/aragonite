full_description = "A Nevernude Frog Guy Post author By Vishal Post date April 26, 2017 Tinkering with these drawing videos, I think I’ve figured out a pace I like. 2x timelapses seem to be a happy medium between the slow, methodical real-time videos, and the ultra-fast ones that are 4 or even 8x sped-up. For now I’m using the Hyperlapse app on my phone to easily spit out timelapses; it’s […] Tags creature design, hyperlapse, pencil, sketch, sketchbook, timelapse, video, youtube Crafty Samir’s Papernautic Video Adventures Post author By Vishal Post date April 26, 2017 Did you know that my brother Samir is almost as talented as I am? Did you know that both of us were taught origami by our father at a very young age, and that Samir has gone on to learn & create many great papercraft sculptures and origami? Did you know that he has both […] Tags crafting, origami, paper, paper craft, papernautic, samir bharadwaj, video, youtube 14 Minute Belly Dancer, OR How Long Does a Practice Sketch Take? Post author By Vishal Post date April 24, 2017 I like to start most drawing sessions with a sketch in one of several practice or sketchbooks I have running at any time. Some of them are focused topic sketchbooks, such as my Creatures Sketchbook (more on that in a future post), and some are less so. Such is my current ‘Practice Makes Perfect’ sketchbook, […] Tags belly dancer, pencil, practice makes perfect, real time, sketch, sketchbook, video, youtube Speedy Video of Monstrous Babies Oh My! Post author By Vishal Post date April 22, 2017 I’ve been using my youtube channel again. Ever since I got my LG G3 phone a couple of years ago, I’ve tried to use the great camera, UHD 4K video recording included, to take more video. Mostly this has been on weekend trips to the Indian countryside, but also I’ve used it to record to-camera […] Tags hyperlapse, practice, sketchbook, sketching, timelapse, video, youtube"
