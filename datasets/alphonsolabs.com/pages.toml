["https://www.alphonsolabs.com/how-contract-analytics-is-disrupting-financial-services"]
title = "How Contract Analytics Is Disrupting Financial Services"
description = "If there’s one industry that’s sure to know about contracts, it’s the financial services sector. From opening a bank account to applying for a loan, a contract exists for just about every process in the market. In days past, this would mean a financial services professional drawing up contracts and manually reviewing them over and over ..."
full_description = "If there’s one industry that’s sure to know about contracts, it’s the financial services sector. From opening a bank account to applying for a loan, a contract exists for just about every process in the market. In days past, this would mean a financial services professional drawing up contracts and manually reviewing them over and over again. Contract analytics software and contract AI are starting to cause quite a ripple in financial services. Contract analytics refers to the analysis of a contract. Naturally, however, for an industry that is rife with moving parts, it can get really complicated, really quickly. Not only is it a useful comparative tool that has the capability to quickly identify and report discrepancies between legal documents, but it also is often used by financial professionals to gain greater insights into their contracts. These aspects range from timeliness (insofar as comparing delivery and return dates), statistics (such as whether a contract is new, up for renewal, pending, or expired. This is because contract analytics software and contract AI frequently rely on programs such as natural learning processes to decipher and somewhat interpret the contents of contracts. This is a form of machine learning that allows these applications to determine what, exactly, a contract might be saying without requiring a financial services professional to review it as in depth as they might have previously. This also facilitates the extraction of clauses, phrases, and contractual terms and provisions for quicker review. In combination with some first and third party programs, given the contract analytics provider, this also means easier creation and deployment of visual references and dashboards. For a fast-paced industry, this provides a much-needed speed boost to some of the more administrative tasks that plague professionals. Naturally, this has some industry experts concerned about the disruption these programs are causing. Document review was once a more involved role in the industry, and some banks and financiers are eliminating these positions in favor of programs that are often viewed as less of an expense than employees."
year_published = 2019
year_updated = 2019
