title = "The Rise of VR"
description = """
The virtual reality (VR) market reached a global value of 3,382 million euros in 2016 thanks to the boost of the VR headsets, according to data collected by the specialized consultant BlueAttack, which expects this growth trend to be maintained in 2017 and the value market multiply by two, up to 6,012 million euros.
Specifically, the value of ..."""
full_description = "The virtual reality (VR) market reached a global value of 3,382 million euros in 2016 thanks to the boost of the VR headsets, according to data collected by the specialized consultant BlueAttack, which expects this growth trend to be maintained in 2017 and the value market multiply by two, up to 6,012 million euros. Specifically, the value of 3,382 million euros that the virtual reality market has reached in 2016 is distributed among mobiles (752 million euros), consoles (1,127 million euros) and computers (1,503 million euros). The consultant emphasizes that 2016 was “a key year” for virtual reality, since the main desktop helmets (Oculus, HTC Vive, PlayStation VR) arrived, technology proliferated in mobile devices (Daydream, popularization of Gear VR) and increased content creation companies specialized in RV. In this sense, he adds that 2017 will be an “even more promising” year and provides that the consolidation of the devices that are already on the market is accompanied by the arrival of new Virtual and Augmented Reality helmets. In addition, it affects that, far from stagnating the market value of more than 6,000 million euros planned for 2017, virtual reality will continue to grow in the coming years and will reach 37,957 million euros in 2020. The consultancy BlueAttack, a subsidiary of the Spanish computer manufacturer Mountain, emphasizes that the trend is “unstoppable”, since the headsets are for the first time within reach of almost any pocket and every day new tools and development studies appear that make possible the contents. According to data from the Statista analysis firm in November 2016, there were already 4.12 million virtual reality helmets from leading manufacturers in homes around the world. Specifically, there were 2.3 million Gear VR, 750,000 PlayStation VR, 450,000 HTC Live, 360,000 Oculus and 260,000 Daydream. The real inventors who have helped propel VR to new heights seldom come to the fore. Keith McMillen, one of the most prominent inventors of modern days, is a serial inventor and entrepreneur who has created multiple musical instruments and technologies that leverage the power of VR. His tech has become incredibly popular and is now widely regarded across the globe. McMillen sells a wide variety of musical instruments and has more than 40 years of experience in leveraging different kinds of technologies. From keyboards to MIDI Controllers and pads, he has a wide variety of instruments to offer."
