["https://www.alphonsolabs.com/a-basic-guide-to-five-pc-specs-you-must-know-about"]
title = "A Basic Guide to Five PC Specs You Must Know About"
description = """
In this day and age, it’s almost impossible to get by without having a dependable computer that you can use for your day-to-day needs. Computers have become more of a necessity for educational, professional, and entertainment purposes, which is why they are selling like hotcakes.
But if you prefer to have a computer that can cater to your every ..."""
full_description = "In this day and age, it’s almost impossible to get by without having a dependable computer that you can use for your day-to-day needs. Computers have become more of a necessity for educational, professional, and entertainment purposes, which is why they are selling like hotcakes. But if you prefer to have a computer that can cater to your every need, you should try to build a custom desktop. But of course, to do that, you’ll need to know your way around basic computer specs or how they function on their own and with one another. So, here are five PC specs to get you started: The Central Processing Unit or CPU acts as the brain of all the digital devices you’ve ever held—cell phones, computers, smartwatches, or even thermostats. The CPU is responsible for processing all the instructions it receives from the end-user, and it interacts with the other parts of the device to carry out functions. Without the CPU to command all the different parts of the computer, the rest of the specs written here would be pointless. That’s why you must first identify the right kind of CPU for your computer before you move forward to the other parts. The two primary manufacturers of processors are Intel and Advanced Micro Devices (AMD). Intel’s desktop CPUs are Celeron, Pentium, and Core. On the other hand, AMD’s CPUs are Sempron, Athlon, Phenom, and Ryzen. CPUs can come in single-core or multi-core processors, and they are classified based on generation chips. The Graphics Card, or more commonly known as GPU, is the processor that renders visuals on your computer display. This includes the images and videos that you see on your screen. Not all computers have a separate GPU; most of the time, the CPU will come with an integrated GPU, which is used for basic tasks and light entertainment. However, if you’re going to use your computer for heavy graphical processing, such as for gaming purposes, 3D visualization, or video editing, then it might be better for you to buy a dedicated GPU. That’s because the higher-quality GPU you have, the better your visuals will appear on the screen."
