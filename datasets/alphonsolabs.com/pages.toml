["https://www.alphonsolabs.com/expert-guide-the-12-basic-principles-of-animation"]
title = "Expert Guide: The 12 Basic Principles of Animation"
description = "The book Illusion of Life: Disney Animation reveals 12 basic principles of animation for the creative artist to follow for making incredible animations. If you follow the basic rules, you will be able to make characters and define their movements smoothly and more like a professional. These twelve principles are not only relevant for every ..."
full_description = "The book Illusion of Life: Disney Animation reveals 12 basic principles of animation for the creative artist to follow for making incredible animations. If you follow the basic rules, you will be able to make characters and define their movements smoothly and more like a professional. These twelve principles are not only relevant for every animation field but help animators in bringing finishing in their work. Let’s take a closer look at the principles and start making appealing animations. One of the most important principles involved in animation is squash and stretch. If you master this technique, you will be able to understand most of the animation. You have to take into account different principles of physics mixed into a touch of exaggeration. The principle of weight, density and mass all create an impact and the amount of force and pressure is involved in stretching an object, all play an equal role. When you practice squash and stretch, you have to keep the volume of your object constant. Upon stretching, your object should become thinner and it becomes wider upon squashing. Staging is an art. You can use it to attract the user’s eye and then make it move to the point, which you think is important. You actually make the eyeball move according to your will take it to the important areas. You can keep their focus on the most important aspect. Anticipation is the touch of technique where you make the viewer predict the next move. For instance, you bend your knees before you jump, the movement you bend your knees anybody near you will get an idea that you are about to jump. In the same way, anticipation is used in animation to predict the movement. To add a realistic touch in your character’s movement the principle of overlapping is used. In this technique, you have to keep the movements and their duration at different duration. For instance, if a character is running and comes to halt his hair will not stop moving just as he stands still. So, in this way, animators pay focus on different areas at the same time."
