["https://www.alphonsolabs.com/new-age-gaming-technology"]
title = "New Age Gaming Technology"
description = "It is hard to argue that gaming has made left its mark on the world that we know today. We have come a long way from the rudimentary games of the 80s and we have seen a massive jump in gaming technologies in the last few years alone. Technologies such as VR and Tobii Eye-tracking were merely a pipe dream in the nineteen-eighties, though they are ..."
full_description = "It is hard to argue that gaming has made left its mark on the world that we know today. We have come a long way from the rudimentary games of the 80s and we have seen a massive jump in gaming technologies in the last few years alone. Technologies such as VR and Tobii Eye-tracking were merely a pipe dream in the nineteen-eighties, though they are still fairly limited to your higher-end PCs. However, with all technologies that the gaming world has encountered over the years, they will hopefully become more accessible as processors and GPUs become more powerful and affordable. What exactly is Tobii Eye-tracker technology? Well, simply put it is a system that uses sensors and algorithms to control your device with your eyes. This sounds like something straight out of popular science fiction, but the Tobii software can accurately predict what you are looking at on your screen. This eye-tracking technology is still in its infancy and many people are still not aware of its existence. Furthermore, there are only a handful of games that actually support this technology and while the number of titles has grown since the early days, it still remains a drop in the ocean when it comes to the multi-billion dollar monster that is the gaming industry. The biggest names to support this technology are Tom Clancy’s Ghost Recon Wildlands and The Division, Watch Dogs 2 and the Assassin’s Creed franchise. So it’s clear to us that Ubisoft is the number one backer of this new technology. Hopefully more and more game developers will embrace this technology for future titles. While the eye-tracker technology is still fairly new, the world of VR has been around for a few years now and this seems to be the way that the gaming world is heading at the moment. The world of VR gaming is far older than most of us know, though things only really took off with the era of smartphones. Features such as motion sensors and gyroscopes have made it possible to track head, hand and body positions. The Google Daydream View and the Samsung Gear VR both rely on your smartphones for their gyroscopes and sensors to offer a VR experience. This allows the price to be far lower than the stand alone headsets such as the Oculus Rift and the HTC Vive. Though if you factor in the cost of a high-end smartphone then the prices are actually fairly similar. We are also seeing more and more VR ready laptops and prebuilt gaming computers on the market, and this is great if you can afford the higher price tags. The entry-level graphics cards in the mobile and desktop world are just not powerful enough to support VR gaming. Though, if we look at the current trend, the next generation of entry-level GPUs will be able to run VR gaming headsets."
year_published = 2017
year_updated = 2019
