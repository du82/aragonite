full_description = "While printers have been used to produce documents for several years, 3D printers can now create several things. It is no longer just about paper. As you will see, these devices are able to create just about anything you can think of, and they are being used for many purposes, as well. One of the ways in which 3D printing has been used can change the way you shop. We’ve all gone to the store for things like jewelry, mounts for our digital devices, and things for our home. People who like to play certain games, may even go to specialty shops to pick up their equipment. However, with a 3D printer, you can save the time, and trouble, of going to a store to buy those things. You can just make them. If you don’t have a 3D printer of your own, you can go to a location that has one, and order the very thing you need. It’s made specifically for your needs based on your own specifications. Those that teach in schools can also use it to create models for the classroom. Creating a visual for students will allow them to see what you are talking about. For example, you can create low-cost replicas of artifacts – like the sphinx or other historical objects – to get your children more interested in the lesson. If you teach older students, in middle and high school, you may even show them how to use the machine to create their own things. Helping them learn, and getting them involved will spark their imagine, and could lead to several other possibilities. If you are someone who likes to fix things such as a car, or you are a contractor who is building a house, you may already know about the wonders of 3D printing. Machines are already being used to create cars, and certain parts, which are lighter, and – in some cases – stronger. Those that are involved in housing are also starting to like the idea of 3D printed housing material. The technology currently does not allow for building huge structures, and there are issues with building code requirements. However, the technology does let you create cheaper parts for the structure, and it eliminates waste in the process. Many of them are also recyclable, which will help the environment. In the near future, these houses will also be able to be more personalized to fit your own need"
