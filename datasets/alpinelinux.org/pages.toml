["https://alpinelinux.org/posts/Alpine-3.21.0-released.html"]
title = "Alpine 3.21.0 released | Alpine Linux"
description = "Alpine Linux"
full_description = "2024-12-05 Alpine Linux 3.21.0 Released We are pleased to announce the release of Alpine Linux 3.21.0, the first in the v3.21 stable series. Highlights Linux kernel 6.12 GCC 14 LLVM 19 Node.js (lts) 22.11 Rust 1.83 Crystal 1.14 GNOME 47 Go 1.23 KDE Plasma 6.2 LXQt 2.1 PHP 8.4 Qt 6.8 Sway 1.10 .NET 9.0 Significant changes Initial support for loongarch64 was added. Upgrade notes As always, make sure to use apk upgrade --available when switching between major versions. OpenSSH service will automatically restart when upgrading to be able to accept new connections. The linux-firmware is now compressed with ZSTD. Users running custom-built kernels need to ensure that CONFIG_FW_LOADER_COMPRESS_ZSTD=y is present in the kernel configuration. Users with / and /usr on separate filesystems (which is unsupported) need take special care. See the wiki for details. Changes The full list of changes can be found in the wiki, git log and bug tracker. Credits Thanks to everyone sending patches, bug reports, new and updated aports, and to everyone helping with writing documentation, maintaining the infrastructure, or contributing in any other way! Thanks to GIGABYTE, Linode, Fastly, IBM, Equinix Metal, vpsFree and AlpineLinuxSupport.com for providing us with hardware and hosting. aports Commit Contributors 6543 Adam Jensen Adam Thiede Adrian Siekierka Ahmet Ibrahim Aksoy Aiden Grossman Alan Pope Alejandro Liu Alejandro Ojeda Gutiérrez Aleks Bunin Alex Alex Denes Alex Klinkhamer Alex McGrath Alexander Sharov Alexandre Mutel Alexey Yerin Alistair Francis Amelia Clarke Andrej Kolchin Andrej Kolčin Andres Almiray André Klitzing Andy Hawkins Andy Postnikov Angelo Verlain Angelo Verlain Shema Anjandev Momi Anri Dellal Antoine Martin Antoni Aloy Torrens Ariadne Conill Arnav Singh Aster Boese Atsushi Watanabe Axel Garcia K. Bart Ribbers Benjamin Chenebault Billy Moses Biswapriyo Nath Bobby Hamblin Bohdan Brad House Brandon Boese Brooss Teambb Bryce Vandegrift Callum Andrew C