full_description = "Alpine Linux Community Participation in the Alpine community requires adherence to the Code of Conduct. IRC (irc.oftc.net) #alpine-linux – For general discussion and quick support questions. #alpine-devel – For discussion of Alpine Linux development and developer support. #alpine-offtopic – For off-topic discussions with Alpine community members. The IRC channels are also accessible through the Matrix IRC bridge at #_oftc_#channame:matrix.org – for example, #_oftc_#alpine-linux:matrix.org. However, as Matrix messages are being “simplified” for IRC, replies, edits, or reactions should not be used to avoid confusion or spam. Mailing Lists Mailing lists for development, support, etc, can be found here: https://lists.alpinelinux.org/lists/~alpine Wiki Wiki has the documentation. https://wiki.alpinelinux.org Mastodon @alpinelinux@fosstodon.org X.com https://x.com/alpinelinux"
