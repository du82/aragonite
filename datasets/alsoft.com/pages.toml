["https://alsoft.com/support-masterjuggler"]
title = "MasterJuggler Support — ALSOFT"
full_description = '''MasterJuggler has been discontinued. If you already own a copy; you can still get support* from our Technical Support Department.* Note: When running from a supported version of Mac OS X. Please see System Requirements at the bottom of this page. MasterJuggler 3Owners of MasterJuggler versions 3.0-3.0.3 may download and use the free MasterJuggler 3.0.4 updater. In addition to OS X 10.4 (Tiger) compatibility, the updated version offers several new features and enhancements, including: • The speed of the sample view has been improved.• The speed of type-ahead selection has been improved in the samples view.• Sets now have icons that indicate whether a set is active or partially active.• The size of the text in the set and font lists can be changed.• Fonts with multiple bitmap sizes are now grouped in one row in the font list instead of one row for each size.• Folders can now be selected when using the "Examine Fonts" menu command.• Sorting the Files view by the last activated column now performs a secondary sort by file name.• Fonts activated by MasterJuggler in Classic can be more easily shared on a network.To download the updater, click here. MasterJuggler Pro 2.xMasterJuggler Pro and Mac OS XMasterJuggler Pro will run in Mac OS X's Classic environment. Please be aware that any fonts that you open will only be available to Classic applicationsUpdates to MasterJuggler Pro 2.0.4/2.1.1Free MasterJuggler 2.0.4/2.11 UpdateThese updates resolve an issue with MasterJuggler Pro versions 2.0.3 and 2.1 and the display of open font files when using MasterJuggler font sets. Anyone using sets with MasterJuggler 2.0.3/2.1 should update to 2.0.4/2.1.1. As with versions 2.0.3/2.1, versions 2.0.4/2.1.1 are compatible with Mac OS 9.Note that there are two updates, one that will update MasterJuggler 2.0 through 2.0.3 to 2.0.4, and another that will update MasterJuggler 2.1 to MasterJuggler 2.1.1. Both updates are free and available on our downloads page. The 2.0.4 updater and the 2.1.1 upgrade do not apply to versions of MasterJuggler supplied with Corel products. If you have a Corel version of MasterJuggler, please contact Alsoft directly for update information. System RequirementsMasterJuggler 3 requires OS X 10.1 through 10.6.x. OS X 10.2.x-10.6.x is recommended. MasterJuggler is not (at this time) compatible with OS X 10.7 through macOS 10.15.If your Mac is running Mac OS 9.2.2 or earlier, MasterJuggler Pro 2.1.1 would be required.'''
