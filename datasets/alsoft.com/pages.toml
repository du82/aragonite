["https://alsoft.com/terms-of-sale-upgrade"]
title = "Terms Of Sale (Upgrade) — ALSOFT"
full_description = '''Please read carefully and agree to the Terms of Sale at the bottom of this page. Terms of Sale:You may install and/or run the software on only one computer at a time but you may install and/or run the software on any computer owned by you. To install and/or run the software on more than one computer at a time, you will need a separately purchased copy of the software for each of those computers.You must accept the terms of the Alsoft License Agreement.All sales are final.In order to use your downloaded software, you will need your serial number, which will be sent to the email address on your order. If you need your software resent to you in the future, it will also be sent to this email address.Please make sure you use a valid email address that can accommodate the file size of the software you are purchasing. File sizes are shown on the order form where you will enter your email address.If you do not receive an email from us after placing your order, you may wish to check your "junk mail" or "spam" folder in case your confirmation has been incorrectly filed by your mail server or spam filter as unsolicited email.The software is compressed as a ZIP file. The manual for the software is included electronically in the download as a PDF file.If You Are Purchasing DiskWarriorDiskWarrior 5 supports any locally connected Mac OS Extended (HFS Plus) disk including Fusion Drives, RAID volumes, journaled disks, case-sensitive disks, FileVaults and Time Machine backups. DiskWarrior 5 supports both Apple Silicon and Intel Macs started in OS X 10.8 Mountain Lion through macOS 14 Sonoma. Apple File System (APFS) disks are not currently supported. Click here to learn how to identify an APFS disk.Repairing your usual startup disk requires that you start up from another disk. In order to use the download copy of DiskWarrior, you must start up from another disk capable of starting up in OS X 10.8 Mountain Lion through macOS 14 Sonoma, such as your Mac's built-in macOS Recovery (the Recovery HD). macOS Recovery is available in OS X 10.8 Mountain Lion and later. You will then need to run a copy of DiskWarrior from a disk that is not the disk you are repairing (such as a flash drive).All online orders will be shipped on a DiskWarrior flash drive via US Mail. Orders will ship within 1 to 2 business days.If you have an older Mac running Mac OS X 10.3.9 through 10.6, you may consider ordering DiskWarrior 4 which ships on a Mac OS X startup CD or DVD. DiskWarrior 4 requires that you start up in Mac OS X version 10.3.9 through 10.10.x. DiskWarrior 4 is not compatible with OS X 10.11 or later. DiskWarrior 4 can only be obtained by first contacting our Technical Support DepartmentIf you already own DiskWarrior and wish to upgrade to DiskWarrior 5, see the DiskWarrior Upgrade page for information on how to order the upgrade.Note: The “Startup Disk” of macOS 10.13 High Sierra through macOS 14 Sonoma cannot be rebuilt with DiskWarrior as they are automatically pre-loaded with Apple File System (APFS). Click here for System Requirements & Supported configurations. I Agree All Sales Are Final'''
