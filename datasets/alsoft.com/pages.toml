description = 'DiskWarrior DVD revision 1107 was released to start up the new MacBook Pros (introduced February 24, 2011) and the new iMacs (introduced May 3, 2011). Some newer iMacs with wireless keyboards have timing issues when starting up from any DVD. Instead of pressing the "C" key immediately upon'
