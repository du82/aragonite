title = "Guides — ALSOFT"
full_description = "Step-By-StepDiskWarrior Guides Note: The “Startup Disk” of macOS 10.13 High Sierra through macOS Sequoia (15.0) with SSDs (Solid State Drives) cannot be rebuilt with DiskWarrior as they are automatically pre-loaded with Apple File System (APFS). How to install DiskWarrior 5 on macOS 13.0 Ventura or macOS 14.0 Sonoma Note: For Intel Macs, the process is the same; however the Rosetta 2 Framework will not need to be installed. For best results do not have any other applications open or a problem Volume connected. To download a step-by-step PDF version of this guide, click here.Note: For macOS 10.13 High Sierra & 10.14 Mojave, the process is the same; however only the Security Extension must be allowed. For best results do not have any other applications open or a problem Volume connected. How to create a bootable DiskWarrior USB Flash Drive. To download a step-by-step PDF version of this guide, click here.Note: for macOS 10.14 Mojave and earlier, the process is the same; however the Permission to access “'Removable Drives” will not appear. DiskWarrior Recovery Maker is compatible with OS X 10.7 Lion through macOS 10.15 Catalina.For best results do not have any other applications open or a problem Volume connected. How to Update DiskWarrior 5 on macOS & the DiskWarrior USB Flash Drive. Note: On macOS 10.15 Catalina, you may need to allow access for the DiskWarrior 5 Updater to search for removable Volumes. DiskWarrior 5 Updater is compatible with OS X 10.7 Lion through macOS 10.15 Catalina.For best results do not have any other applications open or a problem Volume connected."
