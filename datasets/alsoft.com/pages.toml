["https://alsoft.com/archive-diskwarrior-4/2019/8/19/free-diskwarrior-42-disc-updater-available"]
title = "Free DiskWarrior 4.2 Disc Updater Available — ALSOFT"
description = "Owners of DiskWarrior 4 versions 4.0-4.1.1 can&nbsp; now &nbsp; download a free disc updater &nbsp;to update to DiskWarrior 4 version 4.2. This free updater application allows you to create a new startup disc (CD/DVD) with the latest version of DiskWarrior using your original DiskWarrior"
full_description = "Free DiskWarrior 4.2 Disc Updater Available Owners of DiskWarrior 4 versions 4.0-4.1.1 can now download a free disc updater to update to DiskWarrior 4 version 4.2. This free updater application allows you to create a new startup disc (CD/DVD) with the latest version of DiskWarrior using your original DiskWarrior 4.0 or 4.1 disc. This approach provides you with an instant update while maintaining your ability to start up from a disc containing the latest version of DiskWarrior.The DiskWarrior 4.2 Disc updater cannot update a disc created by any previous DiskWarrior updater. You must update your original (factory) DiskWarrior 4.0 or 4.1 disc. This limitation allows us to reduce the size and complexity of the updater. It also results in a significantly smaller test suite that permits us to issue updates more responsively.Please note that the new startup disc you create will start up the same set of Mac models as your current DiskWarrior disc (CD/DVD). Your new disc will not start up any Mac that your current DiskWarrior disc can not. If you need a new DiskWarrior disc that can start up the newest Mac models, please contact our Sales Department to order. Please note that you will receive a DVD even if your previous DiskWarrior disc was a CD. Taylor KriegbaumAugust 28, 2009 Facebook0 Twitter LinkedIn0 Reddit 0 Likes"
