full_description = "DiskWarrior 5.1 and DiskWarrior Recovery Maker 1.2 1) A free updater is available for owners of DiskWarrior 5.0.2) The updater will replace the DW partition on the DiskWarrior flash drive. The updated flash drive will contain DiskWarrior 5.1 and DiskWarrior Recovery Maker 1.2.3) The updater will also update any installed copy of DiskWarrior 5.0 that is located in the Applications folder.4) The updater will also update DiskWarrior 5.0 that is located on any attached recovery flash drives that were created with earlier versions of DiskWarrior Recovery Maker.5) Please click here to download the combo DiskWarrior 5.1 and DiskWarrior Recovery Maker 1.2 updater.6) Please click here to download the standalone DiskWarrior Recovery Maker 1.2 updater. Taylor KriegbaumMay 2, 2018 Facebook0 Twitter LinkedIn0 Reddit 0 Likes"
