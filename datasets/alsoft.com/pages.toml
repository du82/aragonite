["https://alsoft.com/support-diskwarrior-3"]
title = "DiskWarrior 3 — ALSOFT"
full_description = 'DiskWarrior 3 and Intel-based MacsIn order for DiskWarrior to rebuild the directory of an Intel-based Mac you will need to upgrade to DiskWarrior 4. DiskWarrior 3 and OS X 10.5 (Leopard) or LaterDiskWarrior 3 and earlier versions are not compatible with OS X 10.5 (Leopard) or later versions of OS X. Alsoft does not recommend running DiskWarrior 3 or earlier on a disk that has OS X 10.5 Leopard or later installed or a disk that has been attached to a computer running Leopard or later. DiskWarrior 3 and OS X 10.4.x (Tiger)In order to run DiskWarrior while started from OS X 10.4.x (Tiger) you will need to use DiskWarrior version 3.0.3, 4.0 or later.Earlier versions of DiskWarrior, while not compatible with Tiger, will not harm your disk. Attempting to rebuild a disk with DiskWarrior 3.0.2 or earlier, while started from Tiger, will result in an error stating that a "Mac OS Services" failure occurred.Attempting to rebuild a Tiger disk while started from a DiskWarrior 3.0.2 CD can also result in an error message stating that "This disk appears to have a newer version of the Mac OS disk format than this version of DiskWarrior." When started from earlier versions of the DiskWarrior CD, DiskWarrior may simply indicate that the disk cannot be repaired. In all cases, DiskWarrior 3.0.2 and earlier, will not harm your disk.Alsoft still has the DiskWarrior 3.0.3 CD Update available. This free updater allows owners of DiskWarrior 3.0, 3.0.1 or 3.0.2 to create a new startup CD containing the updated DiskWarrior application. To help you determine if you need to order an upgrade to DiskWarrior 4 or download the DiskWarrior 3.0.3 CD Update, please choose the scenario below that applies to you:If you already own DiskWarrior 3 (your CD is gold and white with the image of the DiskWarrior shield on it) AND......your current DiskWarrior CD will not start up your Mac, you will need to upgrade to DiskWarrior 5. Using the DiskWarrior 3.0.3 CD Update will NOT create a CD that will start up your Mac if your current DiskWarrior CD cannot....your current DiskWarrior 3 CD will start up your Mac, and you have access to a CD burner, download and use the free DiskWarrior 3.0.3 CD Update. In order to use the DiskWarrior 3.0.3 CD Update, you will need your original DiskWarrior 3.0 or 3.0.1 CD, a Macintosh computer running OS X 10.2.1 or later equipped with a CD burner, a blank CD-R disc, 650 MB of free disk space, and an administrator name and password.DiskWarrior 3.0.3 CD UpdateThe DiskWarrior 3.0.3 CD Update is a free updater that will allow you to create a new startup disk with the updated DiskWarrior application on it. If you cannot use the update (i.e. you do not have your original DiskWarrior 3 CD, a Macintosh computer running OS X 10.2.1 or later, or a CD burner, etc.), you will need to purchase an upgrade to DiskWarrior 5 or later. The updater will not update the version of OS X on your CD. The CD created by the updater will start up the same Mac models as your original DiskWarrior 3.x CD. It will not be able to start up new Mac models that your current CD cannot start up. To learn how to check your CD revision, click here.You may download the DiskWarrior 3.0.3 CD Update here.If you have DiskWarrior 2.1 or earlier (your CD has the image of an arm holding a sword on the CD), you need to order the DiskWarrior 4 or later upgrade. Please make sure you read and understand the product requirements before you order. If you have any questions, please contact our sales department for assistance.'
