["https://alsoft.com/support-faq"]
title = "FAQ — ALSOFT"
description = "DiskWarrior is a directory repair tool which can rebuild a drive with a supported file system that is not mounting or physically failing.Diskwarrior CANNOT recover deleted files, reformatted drives, or overwritten data.You will need a deleted file program for such a recovery."
full_description = '''Presale Questions: Can DiskWarrior recover deleted files? DiskWarrior is a directory repair tool which can rebuild a drive with a supported file system that is not mounting or physically failing.Diskwarrior CANNOT recover deleted files, reformatted drives, or overwritten data.You will need a deleted file program for such a recovery. What file systems can DiskWarrior repair? DiskWarrior can repair a macOS formatted drive. Supported Files Systems Include:Mac OS Extended (HFS Plus) with variations of Journaled, Case-Sensitive and Encrypted.APFS formatted drives are not currently supported. Please visit How To Identify an APFS disk to identify an APFS formatted disk.Windows formatted drives are not supported including: NTFS / EXFAT / FAT32 / FAT16Please visit the DiskWarrior Requirements page for more information. Is DiskWarrior Compatible with Apple Silicon (M1, M2, M3, etc.) Macs? DiskWarrior 5.3 is compatible with Apple Macs equipped with Apple Silicon processors. Will DiskWarrior work on my external hard drive? DiskWarrior 5 will attempt to rebuild the directory of a hard drive as long as it is formatted using the format of Mac OS Standard, Mac OS Extended, Mac OS Extended (Journaled) or Mac OS Extended (case-sensitive).Macs can read from and write to a variety of disk formats and many external disks come PC formatted from the factory. Did you reformat this drive when you first used it or did you use the drive as is?To double-check that the directory of the hard drive is readable by DiskWarrior in its current state, please open the Apple Disk Utility (located in any computer's Utilities folder or on the Apple Install CD/DVD under the Utilities menu or via the Recovery HD in Mac OS X 10.7.x Lion and later). Your drive should appear with two lines of data:-- The first line should state the manufacturer of the drive (LaCie/G-Drive/etc) and the size in gigabytes (GB) or terabytes (TB).-- The second line should be indented and have a volume name. This may be grayed out. This may not be the recognizable name of your drive. Instead you may see "untitled" or "disk1s2" (your specific numbers will vary).Select the second line. At the bottom of the screen you should see the line "Format". If the drive meets the formatting requirements listed above, DiskWarrior will work to rebuild the directory of the drive. However, if the drive reads as PC Exchange, ExFAT, FAT16 or FAT32, NTFS (and more) then the disk is PC formatted and you will need to recover your data using a Windows-based utility while the drive is connected under a Windows operating system. If the format is blank, click on the Info button at the top of Disk Utility. In the window that opens there will be a line "File System". This may also give you the format of the drive.DiskWarrior 5.x does not repair an APFS formatted drive.For all publicly available information regarding DiskWarrior 5 and macOS 10.13 (High Sierra), 10.14 (Mojave), 10.15 (Catalina) as well as the new Apple File System (APFS), please visit DiskWarrior and High Sierra/Mojave/CatalinaIf Disk Utility does not see the drive then there likely is a hardware failure. In this instance a data recovery company is likely your only option.If only one line appears (no indented volume info), then the drive's partition map is damaged. In many instances DiskWarrior 5 can automatically repair the partition map of a drive. Even if DiskWarrior 5 cannot repair the partition map, additional assistance through Technical Support can result in manual repair of the partition map as a step toward recovering the data on the disk.For further information; please visit the DiskWarrior Requirements page. Will DiskWarrior recover files from my SD Card? Most likely, no. SD cards tend to be used in cameras and other media devices which are formatted exFAT or some other non-HFS+ format. For this you would likely need a deleted file tool. Will DiskWarrior work on my internal Startup Disk? DiskWarrior 5 will attempt to rebuild the directory of a hard drive as long as it is formatted using the format of Mac OS Standard, Mac OS Extended, Mac OS Extended (Journaled) or Mac OS Extended (case-sensitive).To double-check that the directory of the hard drive is readable by DiskWarrior in its current state, please start up the computer from the computer's built-in Recovery HD (restart and hold the Command + R keys on the keyboard). Once started, launch Disk Utility from under the Utilities menu. The drive should appear with two lines of data:-- The first line should state the manufacturer of the drive (LaCie/Maxtor/etc) and the size in gigabytes (GB) or terabytes (TB).-- The second line should be indented and have a volume name. This may be grayed out. This may not be the recognizable name of your drive. Instead you may see "untitled" or "disk1s2" (your specific numbers will vary).Select the second line. At the bottom of the screen you should see the line "Format". If the drive meets the formatting requirements listed above, DiskWarrior will work to rebuild the directory of the drive. However, if the drive reads as PC Exchange, FAT16 or FAT32, NTFS (and more) then the disk is PC formatted and you will need to recover your data using a Windows-based utility while the drive is connected under a Windows operating system. If the format is blank, click on the Info button at the top of Disk Utility. In the window that opens there will be a line "File System". This may also give you the format of the drive.If Disk Utility does not see the drive then there likely is a hardware failure. In this instance a data recovery company is likely your only option.If only one line appears (no indented volume info), then the drive's partition map is damaged. In many instances DiskWarrior 5 can automatically repair the partition map of a drive. Even if DiskWarrior 5 cannot repair the partition map, additional assistance through Technical Support can result in manual repair of the partition map as a step toward recovering the data on the disk.DiskWarrior 5.x does not repair an APFS formatted drive.For all publicly available information regarding DiskWarrior 5 and macOS 10.13 (High Sierra), 10.14 (Mojave), 10.15 (Catalina) as well as the new Apple File System (APFS), please visit: DiskWarrior and High Sierra/Mojave/CatalinaFor further information; please visit the DiskWarrior Requirements page. Can I get my data off a failing hard drive? DiskWarrior is the most capable recovery and repair tool on the market. Judging just from what the issue is, Mac-formatted failing hard drive, the odds are favorable that the data can be recovered by DiskWarrior.Even if you can see your files in "Finder"; using "Finder" to move files from a failing drive is cumbersome and will frequently stop copying data, when it encounters bad blocks.The more attempts made to retrieve the data, the more potential there is for the hard drive to fail permanently. Run DiskWarrior once, and be done!One of DiskWarrior's main functions is to resolve this issue you are experiencing with transferring data from a failing hard drive.DiskWarrior is much faster at transferring files and will ignore these bad blocks to get your data transferred to another source.In the meantime, please do not run any other disk utility on this drive since it might erase critical information that DiskWarrior could have used as part of its repair.Finally, as DiskWarrior is both an emergency recovery software as well as a preventative maintenance tool, there are many other types of problem that can be prevented by utilizing the DiskWarrior software on a regular basis.Please visit the DiskWarrior Requirements page for more information. I keep getting error code 36 when transferring files in Finder, can DiskWarrior help? An error (-36) is an input/output error. A portion of a file resides on a damaged sector on a drive.There are essentially two parts to accessing a file - the directory entry and the file data itself.If the inability to copy comes from the directory entry, then running DiskWarrior may help recover the file.If the problem is in copying the file data itself, then there is no software that can force the physically failing portions to provide the data and make the file accessible. However, DiskWarrior can be used to copy the remaining valid files from a failing disk.There is no method to determine which is the cause of the problem for these specific files. Does DiskWarrior work on Solid State Drives (SSD)? The directory structure of a Solid State Drive, is the same as a more “traditional” hard drive - they both use HFS+ (Mac OS Extended).As such, DiskWarrior can be safely used with an SSD device running a supported File System such as HFS+.TRIM should be used and will have not have a negative reaction.Please visit the DiskWarrior Requirements page for more information. Does DiskWarrior work on Drobo? Drobo does not have a proprietary file system. They simply have a system which constantly moves data around a disk, in a special fashion.DiskWarrior can rebuild the directory of a Drobo that is formatted HFS+.Please visit the DiskWarrior Requirements page for more information.Please refer to the Drobo Support page regarding DiskWarrior: Drobo Support Can DiskWarrior Repair Permissions on my Mac? When running OS X 10.10 Yosemite and earlier, DiskWarrior can repair permissions from our "Files" tab in the application.Apple has removed the Repair Permissions function in OS X 10.11 El Capitan and newer. Is there a Free Trial for DiskWarrior? There is no free trial for DiskWarrior.All sales are final, a standard practice in the software industry.Please ensure you read the Requirements page and our Red Banner page for help in determining if DiskWarrior is the right tool for your situation.If you still have questions or concerns, please check our FAQ page or contact our Technical Support Department. What is the upgrade price for previous versions of DiskWarrior? Thank you for your interest in upgrading to DiskWarrior 5. The upgrade price from earlier versions of DiskWarrior is $59.95 USD plus s&h. Visit the DiskWarrior Upgrade page for more information. If I order the DiskWarrior upgrade, will I be able to download the new software immediately? When a new order is placed, the customer receives a brand new license with a brand new serial number. We do not have to verify any previous order details. However, when an upgrade order is placed, we must verify that the serial number is valid and that the registered owner is purchasing the software. It is these extra steps that cause a slight delay in processing the upgrade orders. Typically the software is sent via email by the next business day.Please understand that we appreciate your continued support and are working as quickly as we can to process and ship all pending orders. If you have any further questions about ordering, please contact our sales department directly.Sales Voice Toll-Free: 800-ALSOFT1, 800-257-6381 Sales Voice International: 281-358-4090 Sales Email: Sales.Info@Alsoft.com General Questions from DiskWarrior Users: How can I install DiskWarrior 5? Please visit the Guides page in the Support section of our website for step-by-step video instructions. How do I update the DiskWarrior software on my Mac? Please visit the Guides page in the Support section of our website for step-by-step video instructions. How do I create a DiskWarrior USB Flash Drive? Please visit the Guides page in the Support section of our website for step-by-step video instructions. How do I update the DiskWarrior software on the DiskWarrior USB Flash Drive? Please visit the Guides page in the Support section of our website for step-by-step video instructions. Where can I get my Serial Number if lost? The DiskWarrior 5.0 or later Serial Number can be found on a white sticker inside the plastic case your USB shipped in. For earlier versions of DiskWarrior, the Serial Number would have been printed directly on the CD/DVD.The Serial Number can also be located in the "About DiskWarrior" section of the application if you installed a serialized version.Otherwise, please contact our Sales Department at 1-800-257-6381 (US Toll Free), at 1-281-353-4090 (International), or you can email them at sales.info@alsoft.com. If you purchased DiskWarrior directly from Alsoft or registered the software, the Sales Department can retrieve your DiskWarrior serial number. I have lost my DiskWarrior USB Flash Drive / it no longer works. How do I get replacement? There is a ninety day warranty on the DiskWarrior USB Flash Drive which we shipped to you. Otherwise, there is a small replacement fee. Please contact the Sales Department for current pricing. This is available through our Sales Department at sales.info@alsoft.com or 1-800-257-6381Note: If you reside in Texas, Sales Tax will apply to this purchase.Alternately, using DiskWarrior Recovery Maker, you can create your own DiskWarrior USB Flash Drive, by supplying your own 2GB (or larger capacity) USB Flash Drive.You can then launch DiskWarrior Recovery Maker and click the Create button to create the device.If you need a copy of DiskWarrior Recovery Maker, it can be downloaded at the DiskWarrior Recovery Maker Update page. My DiskWarrior USB Flash Drive is corrupted. How do I recreate it? Try these steps in order:1) Re-download the DiskWarrior 5.2 Software:In the confirmation email you received, upon purchasing DiskWarrior, there are instructions on how to resend the DiskWarrior application (which will be the updated DiskWarrior 5.2 application) to your supplied email address. Utilize the following link to resend the DiskWarrior application to your email:http://secure.alsoft.com/cgi-bin/MakePage.acgi?SendMe.htmlIf you no longer have the confirmation email, you can contact the Sales Department to assist you with resending the DiskWarrior application to yourselfThey can be contacted at 1-800-257-6381 (US Toll Free) or at 1-281-353-4090 (International). You can also email them at "sales.info@alsoft.com", if you prefer.2) Restore the DiskWarrior.dmg to the DW partition of the DiskWarrior USB Flash Drive:Open the DiskWarrior.dmg image. Then Open Disk Utility.Select the External DW on the left side of Disk Utility. Select the "Restore" button at the top of Disk Utility. Select the Red "DW" from the list of restore choices. Click Restore. Wait for the restore to complete; if it fails repeat the restore again.3) Run DiskWarrior Recovery Maker:Please run DiskWarrior Recovery Maker to update the operating system on the USB Flash Drive.You will find the DiskWarrior Recovery Maker folder on the red "DW" partition of the USB Flash Drive. In the folder you will find the DiskWarrior Recovery Maker application. Launch the application, and click the Create button.Once you have updated the USB Flash Drive, use it to start up the computer and run DiskWarrior. What to do regarding ".plist" files found to be damaged in the DiskWarrior Files Test.? Move the ".plist" files to the Trash and empt'''
