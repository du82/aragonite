full_description = 'DiskWarrior 4 is required for Intel-based Macs. Learn about the new features of DiskWarrior 4 and how to upgrade by clicking here.Please note that to install DiskWarrior 4 onto your hard disk, your Mac must start up in OS X 10.3.9 through 10.10. DiskWarrior 4 is not compatible with OS X 10.11 or later.DiskWarrior 4 version 4.4 is now available on DiskWarrior DVD revision 1109. This DVD is a universal startup DVD that can start up both PowerPC and Intel Macs. All Mac models meeting the system requirements for DiskWarrior can be started from the DVD. The current DiskWarrior DVD cannot start up the new MacBook Pros introduced June 11, 2012. An updated disc that will also start up these recent Mac models will be released as soon as Apple, Inc. releases new startup files to Alsoft, Inc. and other developers. Some older iMacs with wireless keyboards have timing issues when starting up from any DVD. Instead of pressing the "C" key immediately upon start up, wait for the startup chime and then press the "Option" key. This will bring up the Startup Manager which will allow you to choose the DVD as a startup disk. If your wireless mouse is not working in the Startup Manager, use the arrow keys to choose the DVD, then press the "Return" key to continue starting up. Click here to learn how to repair the directory of a disk in a Mac model that cannot be started from the DiskWarrior DVD.Need support for DiskWarrior 3? Click here. DiskWarrior 4 Support News Archive.'
year_published = 2012
year_updated = 2014
clearnet = "https://alsoft.com/support-diskwarrior-4"
