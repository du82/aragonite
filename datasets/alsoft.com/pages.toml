["https://www.alsoft.com/DiskWarrior/requirements.html"]
title = "Requirements — ALSOFT"
full_description = "System RequirementsDiskWarrior 5 supports any directly connected Mac OS Extended (HFS Plus) disk including Fusion Drives, RAID volumes, journaled disks, case-sensitive disks, FileVaults and Time Machine backups. DiskWarrior 5 supports both Intel and Apple Silicon Macs started in OS X Mountain Lion (10.8.5) through macOS Sequoia (15.0) when rebuilding external disks*. Apple File System (APFS) disks are not currently supported. Click here to learn how to identify an APFS disk.Note: The “Startup Disk” of macOS 10.13 High Sierra through macOS Sequoia (15.0) with SSDs (Solid State Drives) cannot be rebuilt with DiskWarrior as they are automatically pre-loaded with Apple File System (APFS). Click here to learn more. Supported OS:macOS Sequoia (15.0) when rebuilding external disks**macOS Sonoma (14.0) when rebuilding external disks**macOS Ventura (13.0) when rebuilding external disks**macOS Monterey (12.0) when rebuilding external disks**macOS Big Sur (11.0) when rebuilding external disks*macOS Catalina (10.15) when rebuilding external disks**macOS Mojave (10.14) when rebuilding external disks**macOS High Sierra (10.13) when not rebuilding internal SSDsmacOS Sierra (10.12)OS X El Capitan (10.11)OS X Yosemite (10.10)OS X Mavericks (10.9)OS X Mountain Lion (10.8)Supported Configurations Include:FileVault 1 / FileVault 2**Core Storage (Fusion Drive)**Flash / SSD drives**Internal / External Volumes**Time Machine Volumes**RAID (Promise, G-RAID, Drobo, SoftRAID etc.)**Disk Images / Sparse bundle** Supported Macs include:MacBookMacBook AirMacBook ProiMac/iMac ProMac miniMac StudioMac ProSupported Ports Include:USB / USB 3.1 / USB-CThunderbolt / Thunderbolt 2 / Thunderbolt 3 / Thunderbolt 4SATA / eSATAFireWire 400 / FireWire 800Supported Files Systems Include:Mac OS Extended (HFS Plus) with variations of Journaled, Case-Sensitive and Encrypted.Supported Processors Include: Intel 64 BitApple Silicon M seriesSupported Startup (Boot) Methods:DiskWarrior Recovery Flash driveRecovery HD* (Apple Silicon not supported)Internet Recovery (Apple Silicon not supported)Target Disk ModeExternal Startup Disk * Support for all of the above is dependent on the hardware features of individual Mac models and the version of OS installed. **When formatted with a supported file system."
year_published = 2011
year_updated = 2014
