full_description = "DiskWarrior Recovery Maker 1.0.2 Released for OS X 10.11.2 El Capitan Compatibility DiskWarrior Recovery Maker provides a simple interface to perform the task of making a DiskWarrior Recovery disk from which you can start up your computer, and access the features of DiskWarrior 5. It will create a DiskWarrior Recovery Disk by copying the contents of an OS X Recovery disk and a serialized DiskWarrior application to a suitable flash drive. Once completed, you will be able to start up your computer from the DiskWarrior Recovery disk and run DiskWarrior.This update to DiskWarrior Recovery Maker is required for compatibility with OS X 10.11.2 El Capitan. Previous versions of DiskWarrior Recovery Maker are not able to create a DiskWarrior Recovery Disk from a 10.11.2 OS X Recovery HD. The update works with all versions of OS X starting from 10.7 Lion to OS X 10.11.2 El Capitan. A free update for existing owners of DiskWarrior 5 is available for immediate download. Taylor KriegbaumDecember 9, 2015 Facebook0 Twitter LinkedIn0 Reddit 0 Likes"
