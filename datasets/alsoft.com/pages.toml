["https://alsoft.com/support-news"]
title = "Support News — ALSOFT"
full_description = "DiskWarrior 5.3 Compatibility with macOS 14 Sonoma DiskWarrior 5.3 is compatible with macOS 14 Sonoma*. If you have an earlier version of DiskWarrior 5, please download the update to DiskWarrior 5.3. Please visit the DiskWarrior 5.3 & APFS page for more information. * Note: When rebuilding external HFS+ (macOS Extended) Volumes. Albert DionSeptember 26, 2023 DiskWarrior 5.2 Compatibility with macOS 11 Big Sur DiskWarrior 5.2 is NOT fully compatible with macOS 11.0 Big Sur. DiskWarrior Recovery Maker 1.4 is not compatible at all. Updates for full compatibility are coming soon. Please visit the DiskWarrior Compatibility with macOS 11 Big Sur page for more information. Taylor KriegbaumNovember 12, 2020 DiskWarrior 5.2 Compatibility with macOS 10.15 Catalina DiskWarrior 5.2 is compatible with macOS 10.15 Catalina*. If you have an earlier version of DiskWarrior 5, please download the update to DiskWarrior 5.2. DiskWarrior Recovery Maker 1.3 is not compatible and has been updated to version 1.4. Please visit the DiskWarrior 5.2 & APFS page for more information. * Note: When rebuilding external HFS+ (macOS Extended) Volumes. Albert DionOctober 8, 2019 DiskWarrior Recovery Maker 1.4 DiskWarrior Recovery Maker (DRM) version 1.4 has been released for compatibility with macOS 10.15 Catalina. All users of DRM 1.3 should download this update. Albert DionOctober 8, 2019 DiskWarrior 5.2 and Recovery Maker 1.3 Please click here for information about the free updates and compatibility with macOS 10.14 Mojave. You'll also learn about the upcoming ability to rebuild APFS disks. Taylor KriegbaumOctober 2, 2018 DiskWarrior 5.1 and DiskWarrior Recovery Maker 1.2 1) A free updater is available for owners of DiskWarrior 5.0.2) The updater will replace the DW partition on the DiskWarrior flash drive. The updated flash drive will contain DiskWarrior 5.1 and DiskWarrior Recovery Maker 1.2.3) The updater will also update any installed copy of DiskWarrior 5.0 that is located in the Applications folder.4) The updater will also update DiskWarrior 5.0 that is located on any attached recovery flash drives that were created with earlier versions of DiskWarrior Recovery Maker.5) Please click here to download the combo DiskWarrior 5.1 and DiskWarrior Recovery Maker 1.2 updater.6) Please click here to download the standalone DiskWarrior Recovery Maker 1.2 updater. Taylor KriegbaumMay 2, 2018"
