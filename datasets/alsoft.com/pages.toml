["https://alsoft.com/archive-diskwarrior-4/2019/8/19/diskwarrior-44-and-gatekeeper"]
title = "DiskWarrior 4.4 and Gatekeeper — ALSOFT"
description = 'Gatekeeper is a new feature of OS X 10.8 Mountain Lion that helps protect you from downloading and installing malicious software on your Mac. Developers can now digitally "sign" their applications so that they are identified as being produced by a known developer such as Alsoft. If a downl'
full_description = '''DiskWarrior 4.4 and Gatekeeper Gatekeeper is a new feature of OS X 10.8 Mountain Lion that helps protect you from downloading and installing malicious software on your Mac. Developers can now digitally "sign" their applications so that they are identified as being produced by a known developer such as Alsoft. If a downloaded application is signed by an identified developer, the default behavior of Gatekeeper is to allow you to use the application. Downloaded applications that are not signed cannot be used with a simple double click.As of today, all copies of DiskWarrior and the DiskWarrior 4 version 4.4 updater that are downloaded from the Alsoft site are digitally signed. This allows you to run these downloaded applications by simply double clicking as you normally would.What about older downloaded copies of DiskWarrior? Gatekeeper only checks to see if a downloaded application is okay to run if it has not been run before. So you don't need to do anything with older copies of DiskWarrior that you have installed and run prior to installing OS X 10.8 Mountain Lion. If you install an older downloaded copy of DiskWarrior after installing OS X 10.8 Mountain Lion then you can indicate to Gatekeeper that it's okay to run DiskWarrior by control (or right) clicking on the DiskWarrior application and choosing open from the pop-up menu that appears. You'll only need to control (or right) click the first time you run the older downloaded copy of DiskWarrior.What about DiskWarrior on a DVD or CD? Applications on DVD are not downloaded and therefore are not checked by Gatekeeper. Taylor KriegbaumJuly 25, 2012 Facebook0 Twitter LinkedIn0 Reddit 0 Likes'''
author = ""
year_published = 2019
year_updated = 2019
