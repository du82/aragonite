["https://alsoft.com/philanthropy"]
title = "Philanthropy — ALSOFT"
full_description = "Taking a Stand Against Childhood CancerThere are few things more terrifying to parents than learning that their child has cancer. Childhood cancer is the leading cause of non-accidental death in children in the United States and other developed countries. As an adult, I was diagnosed with renal cell carcinoma which is more commonly known as kidney cancer. I understand the pain and fear these children face but I had the advantage of knowledge and maturity to help me through my successful treatment.I have made fighting childhood cancer our number one philanthropic priority. A portion of every product sold is donated to Texas Children's Cancer and Hematology Center and Mothers Against Cancer. With the help of our customers, we've made a transformational gift to the Center The Texas Children’s Cancer and Hematology Center is world renowned for its work in pediatric cancer and hematology disorders. They offer innovative therapies for all forms of childhood cancer and blood disorders. Texas Children's takes the most severe cases from all over the United States and around the world. What they learn is shared with other hospitals so that children worldwide can benefit from their research. Mothers Against Cancer are a group of women that have raised millions for children's cancer research and patient/parent support. The money they raise makes them the single greatest monetary contributor to the cancer research program at Texas Children's. These women are all volunteers so you know your donation is not wasted. I can assure you that they take great care of every dollar. My wife, Melisa, and I are lifetime ambassadors for Texas Children's and Melisa is a member of Mothers Against Cancer. If you'd like to join us in taking a stand against childhood cancer, please make a donation to one or both of these organizations. Click the logos above to donate.Sincerely, Al DionPresidentAlsoft, Inc."
year_published = 1997
year_updated = 2014
