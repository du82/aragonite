title = "DiskWarrior Recovery Maker 1.1 Released for macOS 10.12 Compatibility — ALSOFT"
description = "DiskWarrior Recovery Maker provides a simple interface to perform the task of making a DiskWarrior Recovery disk from which you can start up your computer, and access the features of DiskWarrior 5. It will create a DiskWarrior Recovery disk by copying the contents of an macOS Recovery disk and a ser"
full_description = "DiskWarrior Recovery Maker 1.1 Released for macOS 10.12 Compatibility DiskWarrior Recovery Maker provides a simple interface to perform the task of making a DiskWarrior Recovery disk from which you can start up your computer, and access the features of DiskWarrior 5. It will create a DiskWarrior Recovery disk by copying the contents of an macOS Recovery disk and a serialized DiskWarrior application to a suitable flash drive. Once completed, you will be able to start up your computer from the DiskWarrior Recovery disk and run DiskWarrior.This update to DiskWarrior Recovery Maker is required for compatibility with macOS 10.12 Sierra. Previous versions of DiskWarrior Recovery Maker are not able to create a DiskWarrior Recovery Disk from a 10.12 macOS Recovery HD. The update works with all versions of macOS starting from 10.7 Lion to 10.12 Sierra. A free update for existing owners of DiskWarrior 5 is available for immediate download. Taylor KriegbaumSeptember 22, 2016 Facebook0 Twitter LinkedIn0 Reddit 0 Likes"
