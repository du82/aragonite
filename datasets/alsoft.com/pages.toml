["https://alsoft.com/in-depth/2019/8/16/what-other-features-are-there"]
title = "What Other Features Are There? — ALSOFT"
description = "DiskWarrior is the only program where there is never a risk of losing directory data and thus never a risk of losing access to your files.  Only DiskWarrior has all of these features:    Universal Binary for Intel and PowerPC Macs    Repairs invalid file permissions    Finds corrupted Preference (.p"
full_description = 'What Other Features Are There? DiskWarrior is the only program where there is never a risk of losing directory data and thus never a risk of losing access to your files.Only DiskWarrior has all of these features:Universal Binary for Intel and PowerPC MacsRepairs invalid file permissionsFinds corrupted Preference (.plist) filesOptimizes, repairs and rebuilds FileVaultsTests the length of path names for each item on your driveFully supports case-sensitive file namesRebuilds Attribute B-treesRepairs and rebuilds Access Control Lists (ACLs)Repairs Time Machine backupsUses directory data to quickly rebuild the directory structureEliminates risk of losing access to files – other disk "repair" utilities attempt to fix the directory by patching the directory structure and risk deleting sections of the directoryScavenges directory to find all salvageable file and folder data, even data contained in damaged nodesEliminates unseen directory errors, preventing minor directory errors from escalating into major problemsRecovers missing files and folders (Not deleted or overwritten files)Optimizes directory for maximum directory performance, speeding up overall disk performanceMonitors drive hardware for potential drive failureVerification of replacement directory ensures data integrityComparison of original directory with replacement directory tells you which files and folders may have been affected by directory damagePatented preview feature to view what the disk will look like after the directory is rebuilt, allowing you to view files and folders before any directory changes are written to diskRepairs damaged boot blocks and blesses the system folder to ensure that the computer will start from the repaired diskChecks custom icon files for corruption, eliminating a common cause of system crashesRepairs problems with wrapper volume System files caused when HFS Plus disks are initialized under Mac OS 9.0 - 9.0.4Safely permits interruptions of any kind, including power outagesAdvanced "Verify Reads and Writes" technology protects your dataSupports bad block sparing softwareSupports file journaling Taylor KriegbaumJanuary 15, 2019 Facebook0 Twitter LinkedIn0 Reddit 0 Likes'
