["https://alsoft.com/support-legacy-products"]
title = "Legacy Products — ALSOFT"
full_description = '''PlusOptimizer, PlusMaker & PlusMaximizer Support PlusOptimizer and Mac OS X (including 10.4.x and later)PlusOptimizer will not optimize disks that have been written to by Mac OS X 10.4 (Tiger) or later. PlusOptimizer will optimize Mac OS X 10.0 through 10.3.9 Extended disks while running under Mac OS 9.x. In order to optimize these disks (including your Mac OS X startup disk), you should start your computer from a Mac OS 9.x disk such as a Mac OS 9 CD or a Mac OS 9 partition. (Please note that a disk initialized using Mac OS X must have had Mac OS 9 drivers installed for it to be available in Mac OS 9.) PlusOptimizer can be run on disks that have journaling turned on (Mac OS X 10.2.2 through 10.3.9).PlusOptimizer cannot optimize any disks shared with Mac OS X while running under Classic. PlusOptimizer will not optimize UFS disks. Contact our Technical Support department if you need further assistance.PlusOptimizer Update for Mac OS 9.1 and LaterPlusOptimizer versions 1.0 through 1.2 will not function if you are running Mac OS 9.1 or later. This updater updates these versions of PlusOptimizer to version 1.3 for complete Mac OS 9 - 9.2.x compatibility and adds enhanced features when running under Mac OS 9 - 9.2.x.What's New in PlusOptimizer 1.3?PlusOptimizer 1.3 now optimizes Mac OS X Extended disks. It also recognizes when it is running in Mac OS X's Classic environment.Mac OS 9 added several new features, including the ability to handle files over 2 GB and have folders with more than 32,000 items. PlusOptimizer 1.3 adds the ability to handle files and folders with these characteristics while running under Mac OS 9 - 9.2.x.If you own an earlier version of PlusOptimizer, you can download the update now. This will update your copy of PlusOptimizer to version 1.3. This updated version is fully compatible with Mac OS 9 - 9.2.x, and utilizes the advanced file system features available when running under Mac OS 9 - 9.2.x. PlusMaker 1.0.3 Update for Mac OS 9.xPlusMaker versions 1.0, 1.0.1 and 1.0.2 will not convert disks if you are running Mac OS 9.x when converting.This updater updates versions 1.0, 1.0.1 and 1.0.2 of PlusMaker to version 1.0.3 for complete Mac OS 9 compatibility.Download the PlusMaker 1.0.3 Updater (157 KB)Note: If you are unsure about which version of PlusMaker you have, select the PlusMaker icon, choose "Get Info" from the File menu, and look under Version. PlusMaximizer Version InformationNo known issues at the moment. DiskExpress ProCurrent Version 3.0.2Free Updater Available'''
