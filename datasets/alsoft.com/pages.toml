["https://www.alsoft.com/diskwarrior-reviews-archive"]
title = "DiskWarrior Reviews Archive — ALSOFT"
full_description = '''Older DiskWarrior Reviews Product Review: DiskWarrior, by Alsoft – Disk Repair and Optimization LarryJordan.com (10.27.2020) Inaudible Discussion (01.23.20) DiskWarrior macOS Security Restrictions — “Diskwarrior still even two decades and change later is a lifesaver.” (Greg Grant) Macessence.com (08.24.18) DiskWarrior Files & Folders Check — It is another weapon in our clean running Mac arsenal. (Douglas Canning) HiroHonShuku.com (05.06.17) DiskWarrior – Must Have! (Hiro Honshuku) Silicon Summit (03.2015) DiskWarrior 5 — "DiskWarrior is an invaluable tool that everyone should have in their software tool chest." (L. Davenport) My Humble Blog. (07.29.2014) Repairing an Apple Macbook pro — “I don’t know what Alsoft knows for Apple’s file system that Apple doesn’t…” (Alex Kaltsas) Macworld (02.14.14) Bugs & Fixes: DiskWarrior to the rescue — “DiskWarrior can still save your bacon.” (Ted Landau) SechoDB (08.16.13) Using bootable Disk Warrior USB to rebuild the node structure. — “Disk Warrior 4 is one such application which saved the day for me.” (Devin S) Pictures Storyteller (05.27.13) Photographers: Diskwarrior and Reimage Keeps Your PC or Mac Like New (Stanley Leary) MacGroup-Detroit (12.11.12) Disk Utilities — “I seem to go back to Disk Warrior. It’s easy to use. It does only one thing, but it does it well.” (Phyllis Evans) The IT Nerd (08.22.12) Review: Diskwarrior For Mac 4.4 — “If you want something in your toolbox to protect the data on your Mac, you should get a copy of Diskwarrior before you actually need it.” DiskWarrior – A Safety Blanket for Your Data (David Eglin) App Storm (07.05.12) DiskWarrior – The ultimate tool for Mac Hard Disk Directory repairs Amsys (01.30.12) DiskWarrior- Hard drive Recovery for Mac — “I can't say enough good things about them.” (Ashton Price) Morph Productions (03.30.11) Macsolvers’ Blog (11.07.10) When a hard drive warns that it’s about to fail, replace it! (Dale) The Top Mac Hard Drive Utilities, 2010 Edition — DiskWarrior (Ryan Faas) Peachpit (08.04.10) Daring Fireball (03.15.10) An Ode to DiskWarrior, SuperDuper, and Dropbox — “Thanks to DiskWarrior, I lost nothing” (John Gruber) Feature Review: DiskWarrior the Mac Disk Utility — “If there is one utility tool that every Mac user should have, it’s DiskWarrior.” (Gary Hiebner) macProVideo (05.31.09) DiskWarrior great at damage control (Bob Levitus) Houston Chronicle (02.23.09) Day 14 – Disk Warrior — You never know when disaster will strike your hard disk, so when it does, save your files with Disk Warrior. Chuck Grimmett (01.14.09) Review: DiskWarrior 4.1.1 — "DiskWarrior is one of those rare programs that virtually every Mac user that considers their data to be important should have." MacEase (2009) Keys Out Of Order On MacBook, DiskWarrior To The Rescue jim arnold (10.2008) Sydney Morning Herald (09.14.08) Painful answers to the question mark of death — “After about 20 hours plugging away, DiskWarrior had salvaged most of my data” (Nick Galvin) Alsoft DiskWarrior saves the Time Machine drive Gigaom (05.28.08) Macworld (12.19.07) The 23rd Annual Editors' Choice Awards — “DiskWarrior remains as valuable today as it ever was.” (Rob Griffiths) Hands-On Report--DiskWarrior 4.0 (Universal) Macs Only! (12.2007) One of the oldest and most reliable tools for unrecoverably lost data storage has become faster and Universal Binary. (Marvin Tschechne) Mac Life (11.10.07) Digital Rebellion (11.08.07) Alsoft DiskWarrior — Now this is a piece of software no Mac user should be without. (Jon Chappell) DiskWarrior was just the best $100 I’ve ever spent. (Christopher Schmidt) Technical Ramblings (11.03.07) DiskWarrior 4 — Universal, new features, and a whole lot faster (Neil Ticktin) MacTech (2007) REVIEW: DISKWARRIOR 4.0 — "It doesn’t do everything, but it’s the best at what it does."﻿ Bob Buckley (07.2007) DiskWarrior 4.0 — "You need DiskWarrior when you need it" (The Computer Guy) Tek Speks (05.27.07) mymac.com (04.17.07) DiskWarrior 4 Review — Think of DiskWarrior as a relatively inexpensive insurance policy that can pay you back big dividends when something goes terribly wrong. (Russ Walkowich). REVIEW: DISKWARRIOR 4 BY ALSOFT — “I’d argue that everyone that has ANY file on their computer that they cannot afford to lose, be it a folder of 20,000 photos or simply an e-mail with important information, needs DiskWarrior.” MacEnstein (03.13.07) DiskWarrior 4 — “This may be one of the few programs that every Mac user should own.” (Kirk McElhearn) Macworld (02.02.07) Book Mystique Review: AlSoft DiskWarrior 4.0 - Mac Disk Diagnostic, Maintenance, And Repair Tool (Charles Moore) MacPrices (2007) Diskwarrior 4.0 is finally here! (Laurie A. Duncan) Engadget (12.06.06) Use DiskWarrior's Scavenge mode — “DiskWarrior is a key product in my Mac’s first aid kit.” (Rob Griffiths) Macworld (08.10.06) DiskWarrior 3: The One Disk Utility Every Mac User Should Have Low End Mac (05.30.06) Disk Warrior saves Mac disks (Gina Trapani) lifehacker (02.20.06) Recovering Disk Images with DiskWarrior bbum’s weblog-o-mat (02.19.06) My Friend, My Hero, Disk Warrior (Alan Levine) CopDogBlog (12.13.05) DiskWarrior proves useful to recover missing data on Macs (James Derk) Record Searchlight (11.20.05) DiskWarrior - A very useful disk repair tool — “DiskWarrior isn't cheap, and it doesn't do a ton of things ... but what it does, it does very well.” (Rob G.) Mac OS X Hints (10.11.04) Review of Disk Warrior 3.1 — “Disk Warrior gives users another level of insurance and peace of mind.” (Graham K. Rogers) eXtensions (12.2003) DiskWarrior 3.0 — “A tool that any serious Mac user -- and certainly every IT administrator -- should have.” (Stephan Somogyi) Macworld (10.01.03) Use DiskWarrior to save troubled iPods — “It recovered 100% of my music.” (Sean Wolter) Mac OS X Hints (09.30.03) DiskWarrior 3.0 — “Using Disk Warrior will help you solve most of your disk problems. The Pi Labs Annex is a believer.” Washington Apple Pi (2003) PowerBook Mystique Review: AlSoft DiskWarrior 3.0.3 - Mac Disk Diagnostic, Maintenance, And Repair Tool (Charles Moore) MacPrices (2003) DiskWarrior 3.0 Overview — “By far the most reliable & invaluable disk repair/recovery utility available for Mac.” (Scott Doenges) Univ. of Utah Student Computing Lab (2003) DiskWarrior 3.0 has OS X native directory rebuilding (Dennis Sellers) MacWorld (05.07.03) ALSOFT DISKWARRIOR 2.1 — A "must have" for every Mac tool kit (Daniel East) Apple Groups (2002) DiskWarrior 2.1 — “DiskWarrior works its optimization magic with a click of a button.” (Jeffery Battersby) Macworld (06.01.01) REVIEW: DISKWARRIOR 2.1 LIVES UP TO ITS NAME (Steve Becker) MacEase (2001) REVIEW: DISKWARRIOR 2.0 — “DiskWarrior is one of the best maintenance programs available.” (Eric Blair) ATPM (07.2000) DiskWarrior 2.0 — Reviewing the leader in Macintosh disk maintenance utilities (John C. Welch) MacTech (2000) Fighting Corruption with Alsoft’s DiskWarrior (John Christopher) TidBITS (06.21.99) Review – DiskWarrior 1.0.2 — If you only buy one piece of software this year, buy DiskWarrior. You won’t regret it. (Adam Karneboge) MyMac (05.02.99) DiskWarrior 1.0 — “DiskWarrior performs its one crucial function well and should be part of any collection of disk tools.” (Stephen Somogyi) Macworld (04.01.99)'''
