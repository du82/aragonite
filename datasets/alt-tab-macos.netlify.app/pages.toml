title = "AltTab - Release notes"
description = "Windows alt-tab on macOS"
full_description = "Preferences are now much simpler, full of visual illustrations, and should provide a much better experience. Pick between 3 styles (thumbnails, app-icons, titles), sizes, dark/light themes, high visibility options, and more! this rework should fix all sorts of issues when OS events happen in parallel: new windows, new apps, user shortcuts, etc. Here are example of use-cases that should work great now, without, and very quickly: Of course there is no free lunch, so this approach has its own issues. However from my work on it from the past week, I’m very optimistic! The thing I’m the most excited about actually is not the perf (because on my machine even v2 is instant; I have a recent macbook and no 4k displays), but the fact that we will finally have the thumbnails in order of recently-used to least-recently-used, instead of the order of their stack (z-index) on the desktop. It’s a big difference! There are many more limitations that are no longer applying also with this approach."
