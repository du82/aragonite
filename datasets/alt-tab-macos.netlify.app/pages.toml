full_description = "AltTab is available in many languages: Bahasa Indonesia, Basa Jawa, Català, Dansk, Deutsch, Eesti keel, English, Español, Français, Gaeilge, Galego, Hrvatski, Italiano, Kurdî, Lietuvių kalba, Limba română, Lëtzebuergesch, Magyar, Nederlands, Norsk Bokmål, Norsk Nynorsk, Oʻzbekcha, Polski, Português, Português (Brasil), Shqip, Slovenčina, Slovenščina, Suomi, Svenska, Tiếng Việt, Türkçe, Íslenska, Čeština, Ελληνικά, Български, Русский, Српски / Srpski, Українська, עִבְרִית, العربية, فارسی, हिन्दी, বাংলা, தமிழ், ಕನ್ನಡ, മലയാളം, ภาษาไทย, 日本語, 简体中文, 繁體中文, 한국어 You can run CLI commands directly on the executable inside the .app bundle (e.g. /Applications/AltTab.app/Contents/MacOS/AltTab) For this to work, you need AltTab.app to be running, to keep track of the state of windows, and execute the commands Before building my own app, I looked around at similar apps. However, none was completely satisfactory so I rolled my own. Also, the almost-good-enough apps are not open-source. There are also related apps which don’t really overlap in functionality, but target similar needs: Swish, Hookshot, Magnet, Spectacle, Rectangle, yabai, LayAuto, OptimalLayout, BetterTouchTool, BetterSnapTool, Moom, uBar."
