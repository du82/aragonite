["https://www.amazon.science/locations/aachen"]
title = "Aachen - Amazon Science"
description = "We’re looking for a Machine Learning Scientist in the Personalization team for our Edinburgh office experienced in generative AI and large models. You will be responsible for developing and disseminating customer-facing personalized recommendation models. This is a hands-on role with global impact working with a team of world-class engineers and scientists across the Edinburgh offices and wider organization. You will lead the design of machine learning models that scale to very large quantities of data, and serve high-scale low-latency recommendations to all customers worldwide. You will embody scientific rigor, designing and executing experiments to demonstrate the technical efficacy and business value of your methods. You will work alongside a science team to delight customers by aiding in recommendations relevancy, and raise the profile of Amazon as a global leader in machine learning and personalization. Successful candidates will have strong technical ability, focus on customers by applying a customer-first approach, excellent teamwork and communication skills, and a motivation to achieve results in a fast-paced environment. Our position offers exceptional opportunities for every candidate to grow their technical and non-technical skills. If you are selected, you have the opportunity to make a difference to our business by designing and building state of the art machine learning systems on big data, leveraging Amazon’s vast computing resources (AWS), working on exciting and challenging projects, and delivering meaningful results to customers world-wide. Key job responsibilities Develop machine learning algorithms for high-scale recommendations problems. Rapidly design, prototype and test many possible hypotheses in a high-ambiguity environment, making use of both quantitative analysis and business judgement. Collaborate with software engineers to integrate successful experimental results into large-scale, highly complex Amazon production systems capable of handling 100,000s of transactions per second at low latency. Report results in a manner which is both statistically rigorous and compellingly relevant, exemplifying good scientific practice in a business environment."
full_description = "Aachen Research in Aachen, Germany’s westernmost city, is focused primarily on Alexa. Teams at this location are conducting research and development in all aspects of conversational AI and natural-language processing to allow Alexa to understand user requests more accurately, in more languages, and for a more diverse set of skills. Researchers here are also working on various AWS projects such as Amazon Monitron and Amazon Transcribe. Share Share Copy link Email X LinkedIn Facebook Line Reddit QZone Sina Weibo WeChat WhatsApp 分享到微信 x 1 of 3 — Aachen office building The building closes a gap in the Via Culturalis, one of the city's most important and thriving urban spaces. Situated along the pedestrian footpath that connects the axis between the main train station and the inner city, this area is known for its series of public squares, or so-called “urban stepping-stones.” Amazon Science 2 of 3 — Aachen office building There is a restaurant for employees and their visitors on the second floor. Amazon Science 3 of 3 — Aachen office building The building also includes a locker room with showers, first aid room, multifaith space, mother's room, and wellness studio. Amazon Science Research areasScientists in Aachen conduct research in a variety of disciplines, including natural language understanding, speech processing, deep learning, and automatic speech recognition, among others.Working in AachenAmazon provides scientists room to take risks and fail; a community for collaboration and support for continued learning; and the opportunity to have an impact at global scale. Scientists are encouraged to engage with the research community in many forms, from attending conferences and writing research papers, to contributing to open-source, and public datasets.Aachen is the location of one of Europe's leading science and research institutions, RWTH Aachen University, which has more than 45,000 enrolled students who contribute to a lively city life. Aachen borders on the countries of Belgium and The Netherlands, also called the tri-border region, with diverse cultural and linguistic influences. Aachen is about an hour drive or train ride away from Cologne, and not far away from Maastricht and Brussels, neighbored by the beautiful hilly landscape and leisure areas of Eifel and Ardennes.CollaborationsOur Aachen scientists collaborate with universities and other institutions around the globe. To see a summary of some of Amazon’s scientific collaborations, visit our academic collaborations page.Open listingsCheck out the latest job listings available in Germany or visit our careers page to see all open science roles."
