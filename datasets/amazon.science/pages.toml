description = "Amazon partners with particular academic organizations across the world for deep and sustained collaborations in multiple research areas of mutual interest. Learn more about our ongoing collaborations."
full_description = "Columbia Center of Artificial Intelligence Technology The Amazon-funded Columbia Center of Artificial Intelligence Technology (CAIT) Hub supports research, education, and outreach programs that address the hardest challenges in AI and democratize access to the benefits of AI innovations. Learn more Official site Amazon and Hampton University Amazon is collaborating with Hampton University, a historically black college and university (HBCU) known for cutting-edge STEM research, to fund the establishment of a robotics degree program, including a senior capstone course where students will receive mentorship from leading Amazon researchers. Learn more Official site Amazon and Howard University Amazon is collaborating with Howard University, a historically Black college or university (HBCU), to fund research projects, with a focus on machine learning, natural-language processing, and robotics. This includes the creation of RoboLab, where students will engage in prototype development and feasibility testing. Learn more Official site Amazon IIT-Bombay AI-ML Initiative The Amazon IIT–Bombay AI-ML initiative is a collaboration to fund research projects, PhD fellowships, and community events, such as research symposia. The initiative, the first of its kind in India, will advance artificial intelligence and machine learning within speech, and language, and multimodal AI domains. Learn more Official site JHU + Amazon Initiative for Interactive AI (AI2AI) The JHU + Amazon Initiative for Interactive AI leverages world-class expertise in interactive AI to advance machine learning, computer vision, natural language understanding, and speech processing; democratize access to the benefits of AI innovations; and broaden participation in research from diverse, interdisciplinary scholars and other innovators. Learn more Official site Amazon and Max Planck Society Science Hub The Amazon and Max Planck Society Science Hub aims to advance the frontiers of research and broadly share benefits across all sectors of society. The collaboration includes sponsored and open research, co-supervised industrial fellowships, and events that enrich MPG and Amazon research communities. Learn more Official site Amazon and MIT Science Hub The Amazon and MIT Science Hub supports research, education, and outreach efforts via participation of diverse, interdisciplinary scholars, and other innovators. The Science Hub supports research, education, and outreach efforts with initial investments focusing on artificial intelligence and robotics innovations. Learn more Official site Amazon and Tennessee State University The collaboration includes funds for faculty research projects, with a focus on AI, robotics, and operations research. Faculty are assigned an Amazon research liaison who are technical subject matter experts who stay informed about the progress of the project and serve as a bridge to Amazon’s scientific community. Learn more Official site Amazon and UCLA Science Hub for Humanity and AI The UCLA Science Hub for Humanity and AI leverages industry and academic research on artificial intelligence to address challenges and develop solutions that ultimately benefit humanity. The collaboration supports doctoral fellowships, research projects, and community outreach programs. Learn more Official site Amazon-Illinois Center on AI for Interactive Conversational Experiences (AICE) The Amazon-Illinois Center on AI for Interactive Conversational Experiences is designed to take the next steps in conversational interfaces via research and expertise in artificial intelligence and machine learning. Ultimately, AICE will guide emerging technology into a more intelligent, multimodal form. Learn more Official site USC + Amazon Center for Secure & Trusted ML The USC and Amazon joint research center is focused on the development of new approaches to machine learning privacy, security, and trustworthiness. The Center for Secure and Trusted Machine Learning (in short, Trusted AI), supports USC and Amazon researchers in the development of novel approaches to privacy-preserving ML solutions. Learn more Official site UT Austin + Amazon Science Hub The UT Austin Science Hub drives collaboration between leading scholars, faculty, students, and entrepreneurs. It creates an environment for local, regional, national, and international communities to accelerate the advancement of science and jointly solve challenges of societal and real-world impact. Learn more Official site Amazon – Virginia Tech Initiative for Efficient and Robust Machine Learning Virginia Tech and Amazon are collaborating to advance research and innovation in AI and machine learning. The Amazon – Virginia Tech Initiative for Efficient and Robust Machine Learning supports research projects, doctoral student fellowships, and community outreach. Learn more Official site UW + Amazon Science Hub The UW+Amazon Science Hub underscores Amazon’s commitment to academic collaboration by addressing some of the hardest challenges in science and engineering. The funding supports annual PhD fellowships, research projects, and collaborative research events and activities. Learn more Official site Related content Amazon Robotics names 2024 Day One Fellowship Program recipients July 24, 2024 Program empowers uniquely merited scholars from backgrounds historically underrepresented in STEM to become industry leaders through scholarship, research, and career opportunities. Robotics Introducing the Amazon Trusted AI Challenge July 08, 2024 University students will compete for cash prizes in a competition to securely advance LLMs that code. Conversational AI Amazon and Max Planck Society announce recipients of gift awards March 15, 2024 The awards support four research projects exploring the intersection of fashion and AI. Machine learning Load more"
