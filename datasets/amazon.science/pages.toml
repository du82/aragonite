ist of potential search keyword completions as they type, enabling them to complete their queries faster. While the QAC systems in eCommerce stores generally use the Learning to Rank (LTR) approach optimized based on customer feedback, it struggles to provide diverse suggestions, leading to repetitive queries and limited Search and information retrieval Improving search for new product categories via synthetic query generation strategies Akshay Jagatap, Srujana Merugu, Prakash Mandayam Comar The Web Conference 2024 2024 Efficient retrieval and ranking of relevant products in e-commerce product search relies on accurate mapping of queries to product categories. This query classification typically utilizes a combination of textual and customer behavioral signals. However, new product categories often lack customer interaction data leading to poor performance. In this paper, we present a novel approach to mitigate this cold Conversational AI GLAD: Graph-based long-term attentive dynamic memory for sequential recommendation Deepanshu Pandey, Arindam Sarkar, Prakash Mandayam Comar ECIR 2024 2024 Recommender systems play a crucial role in the e-commerce stores, enabling customers to explore products and facilitating the discovery of relevant items. Typical recommender systems are built using n most recent user interactions, where value of n is chosen based on trade-off between incremental gains in performance and compute/memory costs associated with processing long sequences. State-of-the-art recommendation Machine learning Quantifying customer interactions on ML optimized page layouts Nikki Gupta, Prakash Mandayam Comar The 2023 International Conference on Advances in Social Networks Analysis and Mining (ASONAM 2023) 2023 In online businesses, personalization of site content is crucial for providing a better user experience and increasing customer engagement. Machine learning algorithms are often used to analyze customer data such as browsing behavior, purchase history t