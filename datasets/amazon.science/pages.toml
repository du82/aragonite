full_description = "PublicationsView all View all VIT-Pro: Visual instruction tuning for product images Vishnu Prabhakaran, Purav Aggarwal, Vishruit Kulshreshtha, Arunita Das, Venkata Sitaram Sruti Sahini, Anoop S V K K Saladi NAACL 2025 2025 General vision-language models (VLMs) trained on web data struggle to understand and converse about real-world e-commerce product images. We propose a cost-efficient approach for collecting training data to train a generative VLM for e-commerce product images. The key idea is to leverage large-scale, loosely-coupled image-text pairs from e-commerce stores, use a pre-trained LLM to generate multi-modal instruction-following Conversational AI RxLens: Multi-agent LLM-powered scan and order for pharmacy Akshay Jagatap, Srujana Merugu, Prakash Mandayam Comar NAACL 2025 2025 Automated construction of shopping cart from medical prescriptions is a vital prerequisite for scaling up online pharmaceutical services in emerging markets due to the high prevalence of paper prescriptions that are challenging for customers to interpret. We present RxLens, a multi-step end-end Large Language Model (LLM)-based deployed solution for automated pharmacy cart construction comprising multiple Computer vision HALLUCANA: Fixing LLM hallucination with a canary lookahead Tianyi Li, Erenay Dayanik, Shubhi Tyagi, Andrea Pierleoni NAACL 2025 2025 In this paper, we present HALLUCANA, a canary lookahead to detect and correct factuality hallucinations of Large Language Models (LLMs) in long-form generation. HALLUCANA detects and intervenes as soon as traces of hallucination emerge, during and even before generation. To support timely detection, we exploit the internal factuality representation in the LLM hidden space, where we investigate various proxies Conversational AI LongLeader: A comprehensive leaderboard for large language models in long-context scenarios Pei Chen, Hongye Jin, Cheng-Che Lee, Rulin Shao, Jingfeng Yang, Mingyu Zhao, Zhaoyu Zhang, Qin Lu, Ning Xie, Huasheng Li, Bing Yin, Han Li, Lingyun Wang NAACL 2025 2025 Large Language Models (LLMs), exemplified by Claude and LLama, have exhibited impressive proficiency in tackling a myriad of Natural Language Processing (NLP) tasks. Yet, in pursuit of the ambitious goal of attaining Artificial General Intelligence (AGI), there remains ample room for enhancing LLM capabilities. Chief among these is the pressing need to bolster long-context comprehension. Numerous real-world Conversational AI Tuning-free personalized alignment via trial-error-explain in-context learning Hyundong Cho, Karishma Sharma, Nicolaas Jedema, Leonardo Ribeiro, Alessandro Moschitti, Ravi Krishnan, Jonathan May NAACL 2025 2025 Language models are aligned to the collective voice of many, resulting in generic out-puts that do not align with specific users’ styles. In this work, we present Trial-Error-Explain In-Context Learning (TICL), a tuning-free method that personalizes language models for text generation tasks with fewer than 10 examples per user. TICL iteratively expands an in-context learning prompt via a trial-error-explain Conversational AI Load more Related content Training code generation models to debug their own outputs Varun Kumar February 20, 2025 Using large language models to generate training data and updating models through both fine tuning and reinforcement learning improves the success rate of code generation by 39%. Conversational AI Lightweight LLM for converting text to structured data Karim Bouyarmane February 06, 2025 Novel training procedure and decoding mechanism enable model to outperform much larger foundation model prompted to perform the same task. Conversational AI Unlocking insights from qualitative text with LLM-enhanced topic modeling Sreyoshi Bhaduri, Ph.D., Satya Kapoor December 11, 2024 LLM-augmented clustering enables QualIT to outperform other topic-modeling methods in both topic coherence and topic diversity. Conversational AI Amazon opens new AI lab in San Francisco focused on long-term research bets David Luan, Pieter Abbeel December 09, 2024 The Amazon AGI SF Lab will focus on developing new foundational capabilities for enabling useful AI agents. Conversational AI New Amazon Nova image- and video-generating models Ying Wang, Xiaohan Fei December 04, 2024 Amazon Nova Canvas and Amazon Nova Reel use diffusion transformers to deliver studio-quality visual content. Computer vision Amazon Nova and our commitment to responsible AI Christos Christodoulopoulos, Denis Foo Kune December 04, 2024 From reinforcement learning and supervised fine-tuning to guardrail models and image watermarking, responsible AI was foundational to the design and development of the Amazon Nova family of models. Conversational AI Load more"
