full_description = "Adelaide Research teams in Adelaide are developing state-of-the-art, large-scale machine learning methods and applications involving terabytes of data. They work on applying machine learning, and particularly computer vision, to a wide spectrum of areas, such as Amazon retail, seller services, and online video. Share Share Copy link Email X LinkedIn Facebook Line Reddit QZone Sina Weibo WeChat WhatsApp 分享到微信 x 1 of 3 — Adelaide office building The bike-friendly campus boasts footpaths along Frome Road, bike lanes on the North Terrace and the River Torrens Linear Park, 24/7 secure bike parking at Lot Fourteen, and end-of-trip facilities featuring lockers and showers. Amazon Science 2 of 3 — Adelaide office building Employees have access to shared outdoor spaces, including the Secret Courtyard. Hidden between the Margaret Graham and Eleanor Harrald buildings, it's the perfect spot to enjoy a quiet lunch break, host an informal meeting, or unite for a team catch-up around the BBQ. Amazon Science 3 of 3 — Adelaide office building The building also features the Margaret Graham Courtyard, a place to eat lunch beneath the trees or have a friendly match of table tennis with a colleague. Amazon Science Research areasScientists in Adelaide are conducting research in various disciplines including data science, machine learning, automated reasoning and computer visionWorking in AdelaideAmazon provides scientists room to take risks and fail; a community for collaboration and support for continued learning; and the opportunity to have an impact at global scale. Scientists are encouraged to engage with the research community in many forms, from attending conferences and writing research papers, to contributing to open-source and public datasets.Amazon’s office in Adelaide, which opened in 2021, is located at Lot Fourteen, a thriving innovation center that hosts organizations from the high-tech, defense, aerospace and creative industries. Located in the center of Adelaide, the campus is right next to the Adelaide Botanic Garden and near the University of South Australia and the University of Adelaide.CollaborationsOur Adelaide scientists collaborate with universities and other institutions around the globe. To see a summary of some of Amazon’s scientific collaborations, visit our academic collaborations page.Open listingsCheck out the latest job listings available in Australia or visit our careers page to see all open science roles."
