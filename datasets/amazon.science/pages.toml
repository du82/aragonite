["https://www.amazon.science/locations/san-francisco-bay-area"]
title = "San Francisco Bay Area - Amazon Science"
description = "We’re looking for a Machine Learning Scientist in the Personalization team for our Edinburgh office experienced in generative AI and large models. You will be responsible for developing and disseminating customer-facing personalized recommendation models. This is a hands-on role with global impact working with a team of world-class engineers and scientists across the Edinburgh offices and wider organization. You will lead the design of machine learning models that scale to very large quantities of data, and serve high-scale low-latency recommendations to all customers worldwide. You will embody scientific rigor, designing and executing experiments to demonstrate the technical efficacy and business value of your methods. You will work alongside a science team to delight customers by aiding in recommendations relevancy, and raise the profile of Amazon as a global leader in machine learning and personalization. Successful candidates will have strong technical ability, focus on customers by applying a customer-first approach, excellent teamwork and communication skills, and a motivation to achieve results in a fast-paced environment. Our position offers exceptional opportunities for every candidate to grow their technical and non-technical skills. If you are selected, you have the opportunity to make a difference to our business by designing and building state of the art machine learning systems on big data, leveraging Amazon’s vast computing resources (AWS), working on exciting and challenging projects, and delivering meaningful results to customers world-wide. Key job responsibilities Develop machine learning algorithms for high-scale recommendations problems. Rapidly design, prototype and test many possible hypotheses in a high-ambiguity environment, making use of both quantitative analysis and business judgement. Collaborate with software engineers to integrate successful experimental results into large-scale, highly complex Amazon production systems capable of handling 100,000s of transactions per second at low latency. Report results in a manner which is both statistically rigorous and compellingly relevant, exemplifying good scientific practice in a business environment."
full_description = "San Francisco Bay Area The San Francisco Bay Area, including offices in San Francisco, Palo Alto, East Palo Alto, Cupertino, Santa Clara, and Sunnyvale, offers scientific research opportunities that span many Amazon businesses. These include Amazon Web Services, Alexa, Prime Video, Amazon Search, Amazon Ads, Amazon Go, and Amazon Music.Scientists in the Palo Alto area contribute to features that are used by millions of customers around the world, including state-of-the-art algorithms and models that power 3D and augmented reality experiences.Cupertino, along with nearby Sunnyvale and Santa Clara, offers research opportunities across Amazon’s business. For example, scientists on the Amazon Go team are pushing the state of the art in computer vision, machine learning, distributed systems and hardware design. Sunnyvale is also home to research and development subsidiary Amazon Lab126. Share Share Copy link Email X LinkedIn Facebook Line Reddit QZone Sina Weibo WeChat WhatsApp 分享到微信 x 1 of 11 — San Francisco office building Amazonian parents can use the building's mother's rooms, each equipped with a hospital grade pump, pump wipes, storage bags, and nursing pads. There is also a prep room that offers lockers/cubbies, a microwave, refrigerator, and sink. 2 of 11 — San Francisco office building The interfaith prayer room located on the eighth floor is open to individuals of all faiths and religious denominations. Dog owners appreciate the convenience and flexibility of the office's dog-friendly policy. 3 of 11 — Palo Alto office building Building amenities include bicycle parking as well as locker rooms/showers on the ground floor. 4 of 11 — Palo Alto office building Each mother's room is equipped with a recliner, sink, refrigerator, and storage cabinets. Dog owners appreciate the building's dog-friendly policy. 5 of 11 — East Palo Alto office building Employees can grab a bite at Milliways Cafe on the third floor, which serves a variety of hot and cold lunch options, or stop by Amped Cloud Coffee Bar in the first floor atrium for freshly brewed coffee and espresso drinks, along with an assortment of rotating pastries, grab-and-go sandwiches, yogurt parfaits, packaged snacks, and bottled beverages. 6 of 11 — East Palo Alto office building Parents have access to baby changing stations located in the gender-neutral restroom on each floor, as well as mother's rooms equipped with a hospital grade pump, pump wipes, storage bags, and nursing pads. Amazonians of all faiths and religious denominations are invited to use the interfaith prayer room located on the fourth floor. 7 of 11 — Cupertino office building Amazonians enjoy 24/7 access to the building's onsite fitness center. Dining and retail options abound throughout the surrounding Cupertino neighborhood. 8 of 11 — Cupertino office building Each mother's room is equipped with a hospital grade pump, pump wipes, storage bags, and nursing pads. 9 of 11 — Santa Clara office building There is a fitness center onsite, available to Amazonians Monday-Friday, between 11:00 a.m. and 5:00 p.m. The facility is equipped with free weights, treadmills, ellipticals, weight machines, cardio equipment, etc. Amazonians of all faiths and religious denominations are invited to use the interfaith prayer rooms located on the second and fifth floors. 10 of 11 — Santa Clara office building Throughout the building, each mother's room is equipped with a hospital grade pump, pump wipes, storage bags, and nursing pads. Additionally, outside of each mother's room, there is a prep room that offers lockers/cubbies, a microwave, refrigerator, and sink. A quiet room is also available to employees who would like to have a peaceful moment to themselves, for a prayer or simply to unwind. 11 of 11 — Sunnyvale office building Employees enjoy access to a range of amenities, including an onsite fitness center, which features a junior Olympic pool, outdoor Jacuzzi, indoor basketball and volleyball courts, as well as state-of-the-art cardiovascular and strength training equipment on the fitness floor; an interfaith prayer room that welcomes individuals of all faiths and religious denominations; and a cafe and coffee bar. Research areasResearch in the Bay Area spans a variety of disciplines, including automated reasoning, conversational AI, data science, data privacy, hardware design, machine learning, personalization and recommender systems, natural language generation, natural language understanding, networking, speech recognition, machine translation, graph neural networks, deep learning, time series forecasting, and computer vision, among others.Working in San FranciscoAmazon provides scientists room to take risks and fail; a community for collaboration and support for continued learning; and the opportunity to have an impact at global scale. Scientists are encouraged to engage with the research community in many forms, from attending conferences and writing research papers, to contributing to open-source code, and public datasets.The San Francisco Bay area is home to many of the world's leading technology companies which reside in the Silicon Valley in the South Bay Area. In addition to beautiful weather, opportunities for outdoor adventures, and any number of cultural activities, Napa Valley wine tasting, Yosemite National Park, and Santa Cruz beaches are just a drive away.Palo Alto lies at the heart of Silicon Valley innovation, in close proximity to the prestigious Stanford University and Sand Hill Road. The area features the Stanford Shopping Center, the historic Stanford Theatre downtown, the Baylands Nature Preserve, and the Stanford Dish. Palo Alto is a beautiful gateway to the rest of the Bay Area – a train ride away from San Francisco, with the beaches of Half Moon Bay close by.In the center of Silicon Valley, Cupertino lies on the cutting edge of tech innovation, along with San Jose and Sunnyvale. Expansive hiking areas like Rancho San Antonio and Fremont Older Open Space are ready for exploration in Cupertino, as well as beautiful wineries.CollaborationsOur San Francisco Bay Area scientists collaborate with universities and other institutions around the globe. To see a summary of some of Amazon’s scientific collaborations, visit our academic collaborations page.Open listingsAmazon ranked second on the 2024 list of the best large workplaces to grow your career in the US. Visit our careers page to see all open science roles, both in the US and around the world."
