description = "Automated construction of shopping cart from medical prescriptions is a vital prerequisite for scaling up online pharmaceutical services in emerging markets due to the high prevalence of paper prescriptions that are challenging for customers to interpret. We present RxLens, a multi-step end-end Large Language Model (LLM)-based deployed solution for automated pharmacy cart construction comprising multiple"
full_description = '10 results found Sort Relevance Newest Oldest A - Z Z - A RxLens: Multi-agent LLM-powered scan and order for pharmacy Akshay Jagatap, Srujana Merugu, Prakash Mandayam Comar NAACL 2025 2025 Automated construction of shopping cart from medical prescriptions is a vital prerequisite for scaling up online pharmaceutical services in emerging markets due to the high prevalence of paper prescriptions that are challenging for customers to interpret. We present RxLens, a multi-step end-end Large Language Model (LLM)-based deployed solution for automated pharmacy cart construction comprising multiple Computer vision Uncertainty-aware fusion: An ensemble framework for mitigating hallucinations in large language models Prasenjit Dey, Srujana Merugu, Sivaramakrishnan (Siva) Kaveri The Web Conference 2025 2025 Large Language Models (LLMs) are known to hallucinate and generate non-factual outputs which can undermine user trust. Traditional methods to directly mitigate hallucinations, such as representation editing and contrastive decoding, often require additional training data and involve high implementation complexity. While ensemble-based approaches harness multiple LLMs to tap into the "wisdom of crowds", Machine learning Intent detection in the age of LLMs Gaurav Arora, Shreya Jain, Srujana Merugu EMNLP 2024 2024 Intent detection is a critical component of task-oriented dialogue systems (TODS) which enables the identification of suitable actions to address user utterances at each dialog turn. Traditional approaches relied on computationally efficient supervised sentence transformer encoder models, which require substantial training data and struggle with out-of-scope (OOS) detection. The emergence of generative Conversational AI Boosting entity recognition by leveraging cross-task domain models for weak supervision Sanjay Agrawal, Srujana Merugu, Vivek Sembium CIKM 2024 2024 Entity Recognition (ER) is a common natural language processing task encountered in a number of real-world applications. For common domains and named entities such as places and organisations, there exists sufficient high quality annotated data and foundational models such as T5 and GPT-3.5 also provide highly accurate predictions. However, for niche domains such as e-commerce and medicine with specialized Conversational AI Leveraging uncertainty estimates to improve classifier performance Gundeep Arora, Srujana Merugu, Anoop S V K K Saladi, Rajeev Rastogi ICLR 2024 2024 Binary classification involves predicting the label of an instance based on whether the model score for the positive class exceeds a threshold chosen as per application needs (e.g., maximizing recall at a precision bound). However, model scores are often not aligned with the true conditional probability of the positive class. This is especially true when the training involves differential sampling across Machine learning Improving search for new product categories via synthetic query generation strategies Akshay Jagatap, Srujana Merugu, Prakash Mandayam Comar The Web Conference 2024 2024 Efficient retrieval and ranking of relevant products in e-commerce product search relies on accurate mapping of queries to product categories. This query classification typically utilizes a combination of textual and customer behavioral signals. However, new product categories often lack customer interaction data leading to poor performance. In this paper, we present a novel approach to mitigate this cold Conversational AI Conformal prediction sets for ordinal classification Prasenjit Dey, Srujana Merugu, Sivaramakrishnan (Siva) Kaveri NeurIPS 2023 2023 Ordinal classification (OC), i.e., labeling instances along classes with a natural ordering, is common in multiple applications such as disease severity labeling and size or budget based recommendations. Often in practical scenarios, it is desirable to obtain a small set of likely classes with a guaranteed high chance of including the true class. Recent works on conformal prediction (CP) address this problem Machine learning Enhancing e-commerce product search through reinforcement learning-powered query reformulation Sanjay Agrawal, Srujana Merugu, Vivek Sembium CIKM 2023 2023 Query reformulation (QR) is a widely used technique in web and product search. In QR, we map a poorly formed or low coverage user query to a few semantically similar queries that are rich in product coverage, thereby enabling effective targeted searches with less cognitive load on the user. Recent QR approaches based on generative language models are superior to informational retrieval-based methods but Machine learning CoMix: Guide transformers to code-mix using POS structure and phonetics Gaurav Arora, Srujana Merugu, Vivek Sembium ACL Findings 2023 2023 Code-mixing is ubiquitous in multilingual societies, which makes it vital to build models for code-mixed data to power human language interfaces. Existing multilingual transformer models trained on pure corpora lack the ability to intermix words of one language into the structure of another. These models are also not robust to orthographic variations. We propose CoMix1, a pre-training approach to improve Conversational AI Recommending product sizes to customers Vivek Sembium, Rajeev Rastogi, Atul Saroop, Srujana Merugu RecSys 2017 2017 We propose a novel latent factor model for recommending product size fits {Small, Fit, Large} to customers. Latent factors for customers and products in our model correspond to their physical true size, and are learnt from past product purchase and returns data. The outcome for a customer, product pair is predicted based on the difference between customer and product true sizes, and efficient algorithms Search and information retrieval'
