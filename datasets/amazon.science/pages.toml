description = "We’re looking for a Machine Learning Scientist in the Personalization team for our Edinburgh office experienced in generative AI and large models. You will be responsible for developing and disseminating customer-facing personalized recommendation models. This is a hands-on role with global impact working with a team of world-class engineers and scientists across the Edinburgh offices and wider organization. You will lead the design of machine learning models that scale to very large quantities of data, and serve high-scale low-latency recommendations to all customers worldwide. You will embody scientific rigor, designing and executing experiments to demonstrate the technical efficacy and business value of your methods. You will work alongside a science team to delight customers by aiding in recommendations relevancy, and raise the profile of Amazon as a global leader in machine learning and personalization. Successful candidates will have strong technical ability, focus on customers by applying a customer-first approach, excellent teamwork and communication skills, and a motivation to achieve results in a fast-paced environment. Our position offers exceptional opportunities for every candidate to grow their technical and non-technical skills. If you are selected, you have the opportunity to make a difference to our business by designing and building state of the art machine learning systems on big data, leveraging Amazon’s vast computing resources (AWS), working on exciting and challenging projects, and delivering meaningful results to customers world-wide. Key job responsibilities Develop machine learning algorithms for high-scale recommendations problems. Rapidly design, prototype and test many possible hypotheses in a high-ambiguity environment, making use of both quantitative analysis and business judgement. Collaborate with software engineers to integrate successful experimental results into large-scale, highly complex Amazon production systems capable of handling 100,000s of transactions per second at low latency. Report results in a manner which is both statistically rigorous and compellingly relevant, exemplifying good scientific practice in a business environment."
full_description = "Los Angeles Scientists in the Los Angeles area, including offices in Culver City and Pasadena, have a particular focus on research related to Amazon Prime Video and Amazon Studios, as well as developing new products. The work scientists do here allows the use of innovative techniques to solve fascinating problems.Pasadena is also a hub for Amazon’s research on artificial intelligence and quantum computing, including the Amazon Web Services (AWS) Braket service. The AWS Center for Quantum Computing, a state-of-the-art facility located on the California Institute of Technology’s campus in Pasadena, opened in 2021. Here, hardware engineers, quantum theorists, and software developers work together to solve the challenges of building better quantum computers. Share Share Copy link Email X LinkedIn Facebook Line Reddit QZone Sina Weibo WeChat WhatsApp 分享到微信 x 1 of 5 — Culver City office building Amazonians enjoy a variety of amenities at this dog-friendly site, including an interfaith prayer room located on the first floor, onsite bike storage in the central parking garage, and locker rooms/showers located on P1 of the central parking lot. 2 of 5 — Culver City office building Dining options abound, whether you’re looking to pick up an on-the-go breakfast at the coffee bar, grab a snack at The Marketplace, or enjoy lunch with colleagues at The Grill, Street Eats, and Deli. 3 of 5 — Culver City office building Each fully furnished mother's room is equipped with a hospital grade pump, pump wipes, storage bags, and nursing pads. 4 of 5 — Pasadena office building Parents are welcome to use any of the building’s fully furnished mother's rooms, each equipped with a hospital grade pump, pump wipes, storage bags, and nursing pads. 5 of 5 — Pasadena office building Cyclists can utilize the bike racks located on the northeast exterior of the building near the entrance. Research areasResearch in the Los Angeles area spans a variety of disciplines, including data science, economics — including applied microeconomics and behavioral economics — forecasting, machine learning, quantum computing, computer vision, natural language processing, document analysis, speech analysis, speech-to-text, localization, mapping, and operational research, among others.Working in Los AngelesAmazon provides scientists room to take risks and fail; a community for collaboration and support for continued learning; and the opportunity to have an impact at global scale. Scientists are encouraged to engage with the research community in many forms, from attending conferences and writing research papers, to contributing to open-source code, and public datasets.With five of the 15 most populous counties in the United States, the Southern California metropolitan area, stretching from San Luis Obispo to the San Diego/Mexico border, is famed for its film and television industry, but the software, automotive, finance, tourism, biomedical, farming, and shipping industries all play a part in the region’s economy.Southern California is home to Disneyland, Legoland, SeaWorld, and Universal Studios. There are also thousands of festivals and events of every conceivable type, and a rich selection of national, state, and historic parks including the Mojave National Preserve.CollaborationsOur Los Angeles-area scientists collaborate with universities and other institutions around the globe. To see a summary of some of Amazon’s scientific collaborations, visit our academic collaborations page.Open listingsAmazon ranked second on the 2024 list of the best large workplaces to grow your career in the US. Visit our careers page to see all open science roles, both in the US and around the world."
