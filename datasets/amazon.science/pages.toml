["https://www.amazon.science/author/vishruit-kulshreshtha"]
title = "Vishruit Kulshreshtha - Amazon Science"
description = "General vision-language models (VLMs) trained on web data struggle to understand and converse about real-world e-commerce product images. We propose a cost-efficient approach for collecting training data to train a generative VLM for e-commerce product images. The key idea is to leverage large-scale, loosely-coupled image-text pairs from e-commerce stores, use a pre-trained LLM to generate multi-modal instruction-following"
full_description = "One result found Sort Relevance Newest Oldest A - Z Z - A VIT-Pro: Visual instruction tuning for product images Vishnu Prabhakaran, Purav Aggarwal, Vishruit Kulshreshtha, Arunita Das, Venkata Sitaram Sruti Sahini, Anoop S V K K Saladi NAACL 2025 2025 General vision-language models (VLMs) trained on web data struggle to understand and converse about real-world e-commerce product images. We propose a cost-efficient approach for collecting training data to train a generative VLM for e-commerce product images. The key idea is to leverage large-scale, loosely-coupled image-text pairs from e-commerce stores, use a pre-trained LLM to generate multi-modal instruction-following Conversational AI"
