title = "Careers - Amazon Science"
description = "At Amazon, we believe that scientific innovation is essential to being the most customer-centric company in the world. Our scientists' ability to have an impact at scale allows us to attract some of the brightest minds in artificial intelligence and related fields."
full_description = "Filters Filters Applied filters Reset × Job type Full Time (890) Internship (50) Country / region United States (734) India (70) United Kingdom (30) Canada (19) Luxembourg (14) Germany (13) Japan (12) China (9) Australia (7) Israel (6) Romania (5) United Arab Emirates (4) Spain (3) Netherlands (3) France (2) Ireland (2) Jordan (2) Poland (2) Austria (1) Italy (1) South Africa (1) Job category Business & Merchant Development (1) Business Intelligence (8) Data Science (162) Design (3) Economics (70) Hardware Development (4) Human Resources (1) Machine Learning Science (546) Marketing & Pr (1) Operations, It, & Support Engineering (3) Project/program/product Management Technical (1) Research Science (131) Software Development (7) Supply Chain/transportation Management (2) 940 results found Research Scientist, Weblab US, WA, Seattle Job ID: 2913726 Posted February 27, 2025 (Updated 0 days ago) Amazon's Weblab team enables experimentation at massive scale to help Amazon build better products for customers. A/B testing is in Amazon's DNA and we're at the core of how Amazon innovates on behalf of customers. We are seeking a skilled and experienced Research Scientist to help us build the future of experimentation systems at Amazon. About you: You have an entrepreneurial spirit and want to make a big impact on Amazon and its customers. You enjoy enabling intelligent decisions in the face of real-world, noisy data, and have a bias for delivering simple solutions to complex problems. You're a scientist looking for a career where you'll be able to build, to deliver, and to impress. You're a thought leader and you demonstrate this by delivering solutions, not just by having ideas. You challenge yourself and others to come up with better solutions. You develop strong working relationships and thrive in a collaborative and friendly team environment. About us together: We're going to help Amazon innovate faster and smarter by designing and delivering the next generation of data analysis tools and visualizations. Along the way, we're going to face seemingly insurmountable challenges. We're going to argue about how to solve them, and we'll work together to find a solution that is better than each of the proposals we came in with. We'll make complex decisions, but we'll all understand why. We'll be the dream team. We have decades of combined experience on the team in many areas of data science so it's a great environment in which to learn and grow. Many of us have university teaching experience and we're happy to teach. But, we're also like children playing at the edge of a vast unexplored territory; we have a lot to learn and we are all exploring together with a sense of awe and humility. Sr. Applied Scientist, Conversational AI ModEling and Learning CA, ON, Toronto Job ID: 2913729 Posted February 27, 2025 (Updated 0 days ago) Conversational AI ModEling and Learning (CAMEL) team is part of Amazon Devices organization where our mission is to build a best-in-class Conversational AI that is intuitive, intelligent, and responsive, by developing superior Large Language Models (LLM) solutions and services which increase the capabilities built into the model and which enable utilizing thousands of APIs and external knowledge sources to provide the best experience for each request across millions of customers and endpoints. We are looking for a passionate, talented, and resourceful Applied Scientist in the field of LLM, Artificial Intelligence (AI), Natural Language Processing (NLP), Recommender Systems and/or Information Retrieval, to invent and build scalable solutions for a state-of-the-art context-aware conversational AI. A successful candidate will have strong machine learning background and a desire to push the envelope in one or more of the above areas. The ideal candidate would also have hands-on experiences in building Generative AI solutions with LLMs, enjoy operating in dynamic environments, be self-motivated to take on challenging problems to deliver big customer impact, moving fast to ship solutions and then iterating on user feedback and interactions. Key job responsibilities As a Sr. Applied Scientist, you will leverage your technical expertise and experience to collaborate with other talented applied scientists and engineers to research and develop novel algorithms and modeling techniques to reduce friction and enable natural and contextual conversations. You will analyze, understand and improve user experiences by leveraging Amazon’s heterogeneous data sources and large-scale computing resources to accelerate advances in artificial intelligence. You will work on core LLM technologies, including Prompt Engineering and Optimization, Supervised Fine-Tuning, Learning from Human Feedback, Evaluation, Self-Learning, etc. Your work will directly impact our customers in the form of novel products and services. Member of Technical Staff, AGI Autonomy US, CA, San Francisco Job ID: 2913758 Posted February 27, 2025 (Updated 0 days ago) The Amazon AGI SF Lab is focused on developing new foundational capabilities for enabling useful AI agents that can take actions in the digital and physical worlds. In other words, we’re enabling practical AI that can actually do things for us and make our customers more productive, empowered, and fulfilled. The lab is designed to empower AI researchers and engineers to make major breakthroughs with speed and focus toward this goal. Our philosophy combines the agility of a startup with the resources of Amazon. By keeping the team lean, we’re able to maximize the amount of compute per person. Each team in the lab has the autonomy to move fast and the long-term commitment to pursue high-risk, high-payoff research. If you’re interested in our particular philosophy of AI progress, reach out via AGI-SFLab-Jobs@amazon.com. Key job responsibilities - Develop cutting edge multimodal Large Language Models (LLMs) to observe, model and derive insights from manual workflows for automation - Work in a joint scrum with engineers for rapid invention, develop cutting edge automation agent systems, and take them to launch for millions of customers - Collaborate with cross-functional teams of engineers, product managers, and scientists to identify and solve complex problems in GenAI - Design and execute experiments to evaluate the performance of different algorithms and models, and iterate quickly to improve results - Think big about the arc of development of GenAI over a multi-year horizon, and identify new opportunities to apply these technologies to solve real-world problems - Communicate results and insights to both technical and non-technical audiences, including through presentations and written reports - Mentor and guide junior scientists and engineers, and contribute to the overall growth and development of the team Applied science internship, Amazon University Talent Acquisition AT, Graz Job ID: 2912071 Posted February 26, 2025 (Updated 1 days ago) Are you a MS or PhD student interested in a 2025 Internship in the field of machine learning, deep learning, speech, robotics, computer vision, optimization, quantum computing, automated reasoning, or formal methods? If so, we want to hear from you! We are looking for students interested in using a variety of domain expertise to invent, design and implement state-of-the-art solutions for never-before-solved problems. You can find more information about the Amazon Science community as well as our interview process via the links below; https://www.amazon.science/ https://amazon.jobs/content/en/career-programs/university/science https://amazon.jobs/content/en/how-we-hire/university-roles/applied-science Key job responsibilities As an Applied Science Intern, you will own the design and development of end-to-end systems. You’ll have the opportunity to write technical white papers, create roadmaps and drive production level projects that will support Amazon Science. You will work closely with Amazon scientists, and other science interns to develop solutions and deploy them into production. You will have the opportunity to design new algorithms, models, or other technical solutions whilst experiencing Amazon’s customer focused culture. The ideal intern must have the ability to work with diverse groups of people and cross-functional teams to solve complex business problems. A day in the life At Amazon, you will grow into the high impact, visionary person you know you’re ready to be. Every day will be filled with developing new skills and achieving personal growth. How often can you say that your work changes the world? At Amazon, you’ll say it often. Join us and define tomorrow. Some more benefits of an Amazon Science internship include; • All of our internships offer a competitive stipend/salary • Interns are paired with an experienced manager and mentor(s) • Interns receive invitations to different events such as intern program initiatives or site events • Interns can build their professional and personal network with other Amazon Scientists • Interns can potentially publish work at top tier conferences each year About the team Applicants will be reviewed on a rolling basis and are assigned to teams aligned with their research interests and experience prior to interviews. Start dates are available throughout the year and durations can vary in length from 3-6 months for full time internships. Senior Applied Scientist, PubTech - Amazon Advertising US, WA, Seattle Job ID: 2913657 Posted February 26, 2025 (Updated 0 days ago) Amazon continues to invest in its Advertising business to tap into the growing online advertising market. The Publisher Technologies team builds and operates extensible services that empower 1P Publishers to optimize their customer experiences and improve monetization. We focus on creating flexible, standards-based solutions that allow Publishers to innovate while seamlessly interacting with other advertising technology providers—both internal and external. The Publisher Technology Data, Insights, and Analytics team accelerates data-driven decision-making by providing near real-time data, data management tools, actionable insights. Our machine learning models inform dynamic floor prices, and yield optimization in first and second price auction environments to optimize publisher revenue. Our data products equip Publishers and Monetization teams with the tools needed to understand advertising performance and support scalable machine learning initiatives. In this role, you will develop machine learning models that incorporate deep product and shopper understanding, and conduct A/B tests to ensure that we identify all useful and relevant advertisements and provide them to downstream systems for click-through prediction and ad auctions. We are looking for a passionate Applied Scientist with technical expertise in information retrieval, Natural Language Processing (NLP), Large Language Models (LLM), and recommender systems (RecSys) In addition to hands-on experience building ML-based solutions, an ideal candidate should be able to create and articulate a customer-centric science vision, show a willingness to continuously learn about new scientific approaches, and thrive in a startup-like environment. Key job responsibilities - Conduct deep data analysis to derive insights for the business, identify gaps, and uncover new opportunities. - Develop scalable and effective machine learning models and optimization strategies to solve business problems. - Run regular A/B experiments, gather data, and perform statistical analysis to optimize Publisher and advertiser experiences. - Collaborate closely with software engineers to deliver end-to-end solutions into production. - Enhance the scalability, efficiency, and automation of large-scale data analytics, model training, deployment, and serving. - Research and implement new machine learning models and techniques to improve advertising performance. Data Scientist, Amazon Advertising US, WA, Seattle Job ID: 2912293 Posted February 26, 2025 (Updated 1 days ago) Amazon Advertising is one of Amazon's fastest growing and most profitable businesses, responsible for defining and delivering a collection of advertising products that drive discovery and sales. Our products and solutions are strategically important to enable our Retail and Marketplace businesses to drive long-term growth. We deliver billions of ad impressions and millions of clicks and break fresh ground in product and technical innovations every day! As a Data Scientist on this team you will: - Lead Data Science solutions from beginning to end. - Deliver with independence on challenging large-scale problems with complexity and ambiguity. - Write code (Python, R, Scala, SQL, etc.) to obtain, manipulate, and analyze data. - Build Machine Learning and statistical models to solve specific business problems. - Retrieve, synthesize, and present critical data in a format that is immediately useful to answering specific questions or improving system performance. - Analyze historical data to identify trends and support optimal decision making. - Apply statistical and machine learning knowledge to specific business problems and data. - Formalize assumptions about how our systems should work, create statistical definitions of outliers, and develop methods to systematically identify outliers. Work out why such examples are outliers and define if any actions needed. - Given anecdotes about anomalies or generate automatic scripts to define anomalies, deep dive to explain why they happen, and identify fixes. - Build decision-making models and propose effective solutions for the business problems you define. - Conduct written and verbal presentations to share insights to audiences of varying levels of technical sophistication. Why you will love this opportunity: Amazon has invested heavily in building a world-class advertising business. This team defines and delivers a collection of advertising products that drive discovery and sales. Our solutions generate billions in revenue and drive long-term growth for Amazon’s Retail and Marketplace businesses. We deliver billions of ad impressions, millions of clicks daily, and break fresh ground to create world-class products. We are a highly motivated, collaborative, and fun-loving team with an entrepreneurial spirit - with a broad mandate to experiment and innovate. Impact and Career Growth: You will invent new experiences and influence customer-facing shopping experiences to help suppliers grow their retail business and the auction dynamics that leverage native advertising; this is your opportunity to work within the fastest-growing businesses across all of Amazon! Define a long-term science vision for our advertising business, driven from our customers' needs, translating that direction into specific plans for research and applied scientists, as well as engineering and product teams. This role combines science leadership, organizati"
