["https://www.amazon.science/locations/seattle-and-bellevue"]
title = "Seattle and Bellevue - Amazon Science"
description = "We’re looking for a Machine Learning Scientist in the Personalization team for our Edinburgh office experienced in generative AI and large models. You will be responsible for developing and disseminating customer-facing personalized recommendation models. This is a hands-on role with global impact working with a team of world-class engineers and scientists across the Edinburgh offices and wider organization. You will lead the design of machine learning models that scale to very large quantities of data, and serve high-scale low-latency recommendations to all customers worldwide. You will embody scientific rigor, designing and executing experiments to demonstrate the technical efficacy and business value of your methods. You will work alongside a science team to delight customers by aiding in recommendations relevancy, and raise the profile of Amazon as a global leader in machine learning and personalization. Successful candidates will have strong technical ability, focus on customers by applying a customer-first approach, excellent teamwork and communication skills, and a motivation to achieve results in a fast-paced environment. Our position offers exceptional opportunities for every candidate to grow their technical and non-technical skills. If you are selected, you have the opportunity to make a difference to our business by designing and building state of the art machine learning systems on big data, leveraging Amazon’s vast computing resources (AWS), working on exciting and challenging projects, and delivering meaningful results to customers world-wide. Key job responsibilities Develop machine learning algorithms for high-scale recommendations problems. Rapidly design, prototype and test many possible hypotheses in a high-ambiguity environment, making use of both quantitative analysis and business judgement. Collaborate with software engineers to integrate successful experimental results into large-scale, highly complex Amazon production systems capable of handling 100,000s of transactions per second at low latency. Report results in a manner which is both statistically rigorous and compellingly relevant, exemplifying good scientific practice in a business environment."
full_description = '''Seattle and Bellevue Research in Seattle and nearby Bellevue spans numerous disciplines, and multiple offices across the city and region. Seattle is home to teams conducting research across the breadth of Amazon businesses, from locker and counter pickups at Amazon Hubs to last-mile routing and driver support to research for a wide variety of Amazon initiatives, including Alexa, Amazon Ads, Amazon Fashion, Amazon Go, Amazon Music, Amazon Search, AWS, IMDb, Kindle, and Zoox. Share Share Copy link Email X LinkedIn Facebook Line Reddit QZone Sina Weibo WeChat WhatsApp 分享到微信 x 1 of 4 — Seattle office building Throughout the building, catering and dining options abound, from a cafeteria that offers global cuisine and grilling stations, to a coffee bar that brews Boon Boona, a local roaster that sources its beans from West Africa. Amazon Science 2 of 4 — Seattle office building Individuals of all faiths and religious denominations are invited to use the seventh floor's interfaith prayer room. Employees also have access to a quiet room, intended for one person at a time to escape, unwind, and enjoy a moment of solace. Amazon Science 3 of 4 — Bellevue office building Part of Amazon's Bellevue Campus, the "Everest" office building gets its name from the code name given to Annapurna Labs. Amazon Science 4 of 4 — Bellevue office building The dog-friendly office offers onsite dining options for employees to grab lunch or a quick coffee with colleagues. Amazon Science Research areasResearch in the Seattle area spans a variety of disciplines, including, applied mathematics, causal reasoning, computer vision, data science, deep learning, explainable AI, forecasting, mathematical optimization, applied microeconomics, behavioral economics, econometrics, natural language processing, natural language understanding, and recommender systems, among others.Working in Seattle and BellevueAmazon provides scientists room to take risks and fail; a community for collaboration and support for continued learning; and the opportunity to have an impact at global scale. Scientists are encouraged to engage with the research community in many forms, from attending conferences and writing research papers, to contributing to open-source code, and public datasets.Seattle, the Emerald City, is known for its year-round greenery. The area has much to explore, with a vibrant arts and theater community, acres of public parks, museums, several professional sports teams, and different outdoor activities for all seasons – like taking a day trip to hike Mount Rainier.Located only 10 miles from downtown Seattle, Bellevue offers the best of the Pacific Northwest. Downtown Bellevue offers the Bellevue Arts Museum, Botanical Garden, many nearby parks and is considered the jewel of the Eastside. Additional Eastside communities like Kirkland, Redmond and Issaquah are only minutes away and with highly rated public schools.CollaborationsOur Seattle-area scientists collaborate with universities and other institutions around the globe. To see a summary of some of Amazon’s scientific collaborations, visit our academic collaborations page.Open listingsAmazon ranked second on the 2024 list of the best large workplaces to grow your career in the US. Visit our careers page to see all open science roles, both in the US and around the world.'''
