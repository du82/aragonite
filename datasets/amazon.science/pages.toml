title = "Robotics | Research Areas - Amazon Science"
description = "Delivering a more convenient and consistent customer experience through a variety of technologies, including autonomous mobile robots, sophisticated control software, language perception, power management, computer vision, depth sensing, machine learning, object recognition, and semantic understanding of commands."
full_description = "Recent publicationsView all View all Applying bodystorming to human-robot interaction design William D. Smart, Kayla Matheus, Marlena Fraune ICSR 2024 2024 In human-robot interaction (HRI) design, it is critical to con-sider the needs of users early on in development. One ideation technique for doing so is bodystorming, in which participants act out the parts of humans and robots in a certain scenario. This practice allows potential users to draw on and express insights for how robot should help, or interact around, them in a given context. In this paper, Robotics Configurable embodied data generation for class-agnostic RGB-D video segmentation Anthony Opipari, Aravindhan K Krishnan, Shreekant Gayaka, Min Sun, Cheng-Hao Kuo, Arnie Sen, Odest Chadwicke Jenkins IEEE Robotics and Automation Letters 2024 2024 This paper presents a method for generating large-scale datasets to improve class-agnostic video segmentation across robots with different form factors. Specifically, we consider the question of whether video segmentation models trained on generic segmentation data could be more effective for particular robot platforms if robot embodiment is factored into the data generation process. To answer this question Computer vision Avoiding object damage in robotic manipulation Erica Aduh, Fan Wang, Dylan Randle, Kaiwen Wang, Priyesh Shah, Chaitanya Mitash, Manikantan Nambi IROS 2024 2024 The large-scale deployment of robotic manipulation systems in warehouses has highlighted the rare but costly problem of robot-induced object damage. We present a system that uses a classification model to predict whether an object will get damaged during robotic manipulation. The model uses object attributes retrieved from warehouse information systems as well as attributes available at our robotic workcell Robotics Simulation-assisted learning for efficient bin-packing of deformable packages in a bimanual robotic cell Omey M. Manyar, Hantao Ye, Meghana Sagare, Siddharth Mayya, Fan Wang, Satyandra K. Gupta IROS 2024 2024 Bin-packing is an important problem in the robotic warehouse domain. Traditionally, this problem has been studied only for rigid packages (e.g., boxes or rigid objects). In this work, we tackle the problem of bin-packing with deformable packages that have become a popular choice for fulfillment needs. We present a system that incorporates a dual robot arm bimanual setup, uniquely combining suction and sweeping Machine learning VLPG-Nav: Object navigation using visual language pose graph and object localization probability maps Senthil Hariharan Arul, Dhruva Kumar, Vivek Sugirtharaj, Richard Kim, Tony Qi, Rajasimman Madhivanan, Arnie Sen, Dinesh Manocha IROS 2024 2024 We present VLPG-Nav, a visual language navigation method for guiding robots to specified objects within household scenes. Unlike existing methods primarily focused on navigating the robot toward objects, our approach considers the additional challenge of centering the object within the robot’s camera view. Our method builds a visual language pose graph (VLPG) that functions as a spatial map of VL embeddings Robotics Load more Related content Amazon Robotics names 2024 Day One Fellowship Program recipients Staff writer July 24, 2024 Program empowers uniquely merited scholars from backgrounds historically underrepresented in STEM to become industry leaders through scholarship, research, and career opportunities. Robotics Scenario Diffusion helps Zoox vehicles navigate safety-critical situations Ethan Pronovost, Kai Wang February 20, 2024 Generative AI supports the creation, at scale, of complex, realistic driving scenarios that can be directed to specific locations and environments. Robotics Amazon Robotics names 2023 Day One Fellowship Program recipients Staff writer January 04, 2024 Program empowers students from diverse backgrounds to become industry leaders through scholarship, research, and career opportunities. Robotics Amazon and MIT announce Sci