title = "Automated Reasoning | Research Areas - Amazon Science"
description = "Focusing on the automation of formal logical reasoning to raise the bar on the security, durability, availability, and quality of Amazon’s products and services."
full_description = "Recent publicationsView all View all Formally verified cloud-scale authorization Aleks Chakarov, Jaco Geldenhuys, Matthew Heck, Mike Hicks, Sam Huang, Georges Axel Jaloyan, Anjali Joshi, Rustan Leino, Mikael Mayer, Sean McLaughlin, Akhilesh Mritunjai, Clément Pit Claudel, Sorawee Porncharoenwase, Florian Rabe, Marianna Rapoport, Giles Reger, Cody Roux, Neha Rungta, Robin Salkeld, Matthias Schlaipfer, Daniel Schoepe, Johanna Schwartzentruber, Serdar Tasiran, Aaron Tomb, Emina Torlak, John Tristan, Lucas Wagner, Mike Whalen, Remy Willems, Jenny Xiang, Tae Joon Byun, Joshua Cohen, Ruijie Wang, Junyoung Jang, Jakob Rath, Hira Taqdees Syeda, Dominik Wagner, Yongwei Yuan ICSE 2025 2025 All critical systems must evolve to meet the needs of a growing and diversifying user base. But supporting that evolution is challenging at increasing scale: Maintainers must find a way to ensure that each change does only what is intended, and will not inadvertently change behavior for existing users. This paper presents how we addressed this challenge for the Amazon Web Services (AWS) authorization engine Automated reasoning Producing proofs of unsatisfiability with distributed clause-sharing SAT solvers Dawn Michaelson, Dominik Schreiber, Marijn J.H. Heule, Benjamin Kiesl-Reiter, Mike Whalen Journal of Automated Reasoning 2025 Distributed clause-sharing SAT solvers can solve challenging problems hundreds of times faster than sequential SAT solvers by sharing derived information among multiple sequential solvers. Unlike sequential solvers, however, distributed solvers have not been able to produce proofs of unsatisfiability in a scalable manner, which limits their use in critical applications. In this work, we present a method Automated reasoning Neural model checking Mirco Giacobbe, Daniel Kroening, Abhinandan Pal, Michael Tautschnig NeurIPS 2024 2024 We introduce a machine learning approach to model checking temporal logic, with application to formal hardware verification. Model checking answers the question of whether every execution of a given system satisfies a desired temporal logic specification. Unlike testing, model checking provides formal guarantees. Its application is expected standard in silicon design and the EDA industry has invested decades Automated reasoning Model checking distributed protocols in must Constantin Enea, Dimitra Giannakopoulou, Michalis Kokologiannakis, Rupak Majumdar OOPSLA 2024 2024 Wedescribe the design and implementation of Must, a framework for modeling and automatically verifying distributed systems. Must provides a concurrency API that supports multiple communication models, on top of a mainstream programming language, such as Rust. Given a program using this API, Must verifies it by means of a novel, optimal dynamic partial order reduction algorithm that maintains completeness Automated reasoning Projective model counting for IP addresses in access control policies Loris D'Antoni, Andrew Gacek, Amit Goel, Dejan Jovanovic, Rami Kici, Dan Peebles, Neha Rungta, Yasmine Sharoda, Chungha Sung FMCAD 2024 2024 Zelkova is an AWS service that answers questions about Identity and Access Management (IAM) access policies such as “Does this policy allow public access?”. Zelkova formalizes IAM policies and the meaning of “public” as a logical query that can be solved using SMT solvers. Among other conditions, Zelkova defines a policy as public if it allows access from a number of IP addresses that exceeds a given threshold Automated reasoning Load more Related content Using SAT solving to optimize quantum circuit mapping Jiong Yang February 28, 2025 In experiments involving real quantum devices and algorithms, automated-reasoning-based method for mapping quantum computations onto quantum circuits is 26 times as fast as predecessors. Quantum technologies New AWS tool recommends removal of unused permissions Loris D'Antoni, Chungha Sung December 19, 2024 IAM Access Analyzer feature uses automated reasoning to recommend policies that remove unused accesses, helping customers achieve “least privilege”. Automated reasoning Better-performing “25519” elliptic-curve cryptography Torben Hansen, John Harrison September 10, 2024 Automated reasoning and optimizations specific to CPU microarchitectures improve both performance and assurance of correct implementation. Automated reasoning How the Lean language brings math to coding and coding to math Leo de Moura August 16, 2024 Uses of the functional programming language include formal mathematics, software and hardware verification, AI for math and code synthesis, and math and computer science education. Automated reasoning Formal verification makes RSA faster — and faster to deploy June Lee, Hanno Becker, John Harrison August 08, 2024 Optimizations for Amazon's Graviton2 chip boost efficiency, and formal verification shortens development time. Automated reasoning Amazon Scholar solves century-old problem with automated reasoning Larry Hardesty April 03, 2024 Solution method uses new infrastructure that reduces proof-checking overhead by more than 90%. Automated reasoning Load more"
