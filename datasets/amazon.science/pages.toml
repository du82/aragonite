["https://www.amazon.science/locations/edinburgh"]
title = "Edinburgh - Amazon Science"
description = "We’re looking for a Machine Learning Scientist in the Personalization team for our Edinburgh office experienced in generative AI and large models. You will be responsible for developing and disseminating customer-facing personalized recommendation models. This is a hands-on role with global impact working with a team of world-class engineers and scientists across the Edinburgh offices and wider organization. You will lead the design of machine learning models that scale to very large quantities of data, and serve high-scale low-latency recommendations to all customers worldwide. You will embody scientific rigor, designing and executing experiments to demonstrate the technical efficacy and business value of your methods. You will work alongside a science team to delight customers by aiding in recommendations relevancy, and raise the profile of Amazon as a global leader in machine learning and personalization. Successful candidates will have strong technical ability, focus on customers by applying a customer-first approach, excellent teamwork and communication skills, and a motivation to achieve results in a fast-paced environment. Our position offers exceptional opportunities for every candidate to grow their technical and non-technical skills. If you are selected, you have the opportunity to make a difference to our business by designing and building state of the art machine learning systems on big data, leveraging Amazon’s vast computing resources (AWS), working on exciting and challenging projects, and delivering meaningful results to customers world-wide. Key job responsibilities Develop machine learning algorithms for high-scale recommendations problems. Rapidly design, prototype and test many possible hypotheses in a high-ambiguity environment, making use of both quantitative analysis and business judgement. Collaborate with software engineers to integrate successful experimental results into large-scale, highly complex Amazon production systems capable of handling 100,000s of transactions per second at low latency. Report results in a manner which is both statistically rigorous and compellingly relevant, exemplifying good scientific practice in a business environment."
full_description = "Edinburgh Scientists in Edinburgh conduct research related to a variety of Amazon products and experiences, including machine learning, talent recruitment, and other consumer-facing services. Scientists here focus on real-world problems and own solutions end-to-end, from research to production. They work on multi-disciplinary teams with engineers, scientists, product managers, and user experience specialists. Share Share Copy link Email X LinkedIn Facebook Line Reddit QZone Sina Weibo WeChat WhatsApp 分享到微信 x 1 of 3 — Edinburgh office building Located in the heart of Edinburgh, Waverly Gate stands on the original site of the Theatre Royal (1768-1859). The original architect, Robert Matheson, designed the A-listed, High Renaissance-style building, and Prince Albert laid the foundation stone in 1861. 2 of 3 — Edinburgh office building Occupying the shell of the former General Post Office building, the current structure has eight floors, three of which sit below ground. The meticulously refurbished office complex features a rooftop deck and garden, which offers stunning views of Edinburgh Castle, Arthur's Seat, Calton Hill, and the Old Town. 3 of 3 — Edinburgh office building The building offers a variety of amenities, including locker rooms with showers, a first aid room, mother's room, wellness studio, and quiet space. Research areasScientists in Edinburgh are conducting research across a variety of disciplines, including AI interpretability, computer vision, explainable AI, advertising, recommender systems, deep learning, and reinforcement learning.Working in EdinburghAmazon provides scientists room to take risks and fail; a community for collaboration and support for continued learning; and the opportunity to have an impact at global scale. Scientists are encouraged to engage with the research community in many forms, from attending conferences and writing research papers, to contributing to open-source, and public datasets.Edinburgh has a rare balance of being a thriving capital surrounded by the coast and vast green spaces, so it has something for all tastes, lifestyles and ages. Amazon’s science facility here is located in the city center and boasts views of Edinburgh’s skyline, including Edinburgh Castle. The office is easily accessible via tram, train, bus, and bike, whether you choose to live in the bustling city center or the quieter coast/outskirts.CollaborationsOur Edinburgh scientists collaborate with universities and other institutions around the globe. To see a summary of some of Amazon’s scientific collaborations, visit our academic collaborations page.Open listingsCheck out the latest job listings available in the U.K. or visit our careers page to see all open science roles."
