full_description = '''Amazon announces Ocelot quantum chip Prototype is the first realization of a scalable, hardware-efficient quantum computing architecture based on bosonic quantum error correction. Read more ` Using SAT solving to optimize quantum circuit mapping In experiments involving real quantum devices and algorithms, automated-reasoning-based method for mapping quantum computations onto quantum circuits is 26 times as fast as predecessors. Read more ` The Amazon Nova family of models: Technical report and model card Training infrastructure, benchmarks, responsible-AI methodology, and more. Read more David Chang/Getty Images/iStockphoto ` Amazon opens new AI lab in San Francisco focused on long-term research bets The Amazon AGI SF Lab will focus on developing new foundational capabilities for enabling useful AI agents. Read more Amazon announces Ocelot quantum chip Using SAT solving to optimize quantum circuit mapping The Amazon Nova family of models: Technical report and model card Amazon opens new AI lab in San Francisco focused on long-term research bets Customer-obsessed science Research areas Automated reasoning Cloud and systems Computer vision Conversational AI Economics Information and knowledge management Machine learning Operations research and optimization Quantum technologies Robotics Search and information retrieval Security, privacy, and abuse prevention Sustainability From the blogView all The latest research from Amazon scientists. View all Training code generation models to debug their own outputs February 20, 2025 Using large language models to generate training data and updating models through both fine tuning and reinforcement learning improves the success rate of code generation by 39%. Conversational AI Benchmarking tool for graph-centric predictive modeling on databases February 14, 2025 Cloud and systems Lightweight LLM for converting text to structured data February 06, 2025 Conversational AI QKD and authentication: Separating facts from myths January 14, 2025 Quantum technologies The 10 most viewed publications of 2024 December 24, 2024 View all Featured news David Chang/Getty Images/iStockphoto Amazon AGI SF Lab Led by David Luan and Pieter Abbeel, the lab will focus on developing new foundational capabilities for enabling useful AI agents. Amazon Nova The company's new state-of-the-art foundation models deliver frontier intelligence and industry-leading price performance. Preskill wins prize for work on learning and quantum computing Caltech professor and Amazon Scholar John Preskill wins Bell Prize for applying both classical and quantum computing to the problem of learning from quantum experiments. PublicationsView all View all What matters when building vision language models for product image analysis? Ameni Trabelsi, Maria Zontak, Yiming Qian, Brian Jackson, Suleiman Khan, Umit Batur WACV 2025 Workshop on Physical Retail in AI 2025 This paper investigates multi-modal large language models (MLLMs) for predicting product features from images, comparing fine-tuned versus proprietary models. We introduce two domain-specific benchmarks: (1) Inductive Bias vs. Image Evidence (IBIE) Benchmark, which evaluates MLLMs’ ability to distinguish between image-derived features and latent knowledge, and (2) Catalog-bench, which assesses feature prediction Computer vision VIT-Pro: Visual instruction tuning for product images Vishnu Prabhakaran, Purav Aggarwal, Vishruit Kulshreshtha, Arunita Das, Venkata Sitaram Sruti Sahini, Anoop S V K K Saladi NAACL 2025 2025 General vision-language models (VLMs) trained on web data struggle to understand and converse about real-world e-commerce product images. We propose a cost-efficient approach for collecting training data to train a generative VLM for e-commerce product images. The key idea is to leverage large-scale, loosely-coupled image-text pairs from e-commerce stores, use a pre-trained LLM to generate multi-modal instruction-following Conversational AI RxLens: Multi-agent LLM-powered scan and order for pharmacy Akshay Jagatap, Srujana Merugu, Prakash Mandayam Comar NAACL 2025 2025 Automated construction of shopping cart from medical prescriptions is a vital prerequisite for scaling up online pharmaceutical services in emerging markets due to the high prevalence of paper prescriptions that are challenging for customers to interpret. We present RxLens, a multi-step end-end Large Language Model (LLM)-based deployed solution for automated pharmacy cart construction comprising multiple Computer vision Uncertainty-aware fusion: An ensemble framework for mitigating hallucinations in large language models Prasenjit Dey, Srujana Merugu, Sivaramakrishnan (Siva) Kaveri The Web Conference 2025 2025 Large Language Models (LLMs) are known to hallucinate and generate non-factual outputs which can undermine user trust. Traditional methods to directly mitigate hallucinations, such as representation editing and contrastive decoding, often require additional training data and involve high implementation complexity. While ensemble-based approaches harness multiple LLMs to tap into the "wisdom of crowds", Machine learning Latent diffusion shield - Mitigating malicious use of diffusion models through latent space adversarial perturbations Huy Phan, Boshi Huang, Ekraam Sabir, Prateek Singhal, Bo Yuan WACV 2025 Workshop on Synthetic Realities and Data in Biometric Analysis and Security 2025 Diffusion models have revolutionized the landscape of generative AI, particularly in the application of text-to-image generation. However, their powerful capability of generating high-fidelity images raises significant security concerns on the malicious use of the state-of-the-art (SOTA) text-to-image diffusion models, notably the risks of misusing personal photos and copyright infringement through the Computer vision Load more ConferencesView all View all AAAI 2025 February 25 - March 4, 2025 Philadelphia, Pennsylvania Machine learning WACV 2025 February 28 - March 4, 2025 Tucson, Arizona Computer vision WSDM 2025 March 10 - 14, 2025 Hannover, Germany Search and information retrieval ICLR 2025 April 24 - 28, 2025 Singapore Machine learning The Web Conference 2025 April 28 - May 2, 2025 Sydney, Australia Information and knowledge management NAACL 2025 April 29 - May 4, 2025 Albuquerque, New Mexico KDD 2025 August 3 - 7, 2025 Toronto, Ontario Information and knowledge management View all AcademiaView all Whether you're a faculty member or student, there are number of ways you can engage with Amazon. View all Gretchen Ertl Amazon Research Awards The program offers unrestricted funds and other resources to support research at academic institutions and non-profit organizations in areas that align with our mission. JORDAN STEAD/(JORDAN STEAD / Amazon) Amazon Trusted AI Challenge A global university competition to drive secure innovation in generative AI technology, which focuses on responsible AI and LLM coding security. Credit: Wolfram Scheible Research collaborations We partner with particular academic organizations across the world for deep and sustained collaborations in multiple research areas of mutual interest. Courtesy of Pai-Ling Yin Academics at Amazon We hire world-class academics to work on large-scale technical challenges, while they continue to teach and conduct research at their universities. View all'''
