description = "We’re looking for a Machine Learning Scientist in the Personalization team for our Edinburgh office experienced in generative AI and large models. You will be responsible for developing and disseminating customer-facing personalized recommendation models. This is a hands-on role with global impact working with a team of world-class engineers and scientists across the Edinburgh offices and wider organization. You will lead the design of machine learning models that scale to very large quantities of data, and serve high-scale low-latency recommendations to all customers worldwide. You will embody scientific rigor, designing and executing experiments to demonstrate the technical efficacy and business value of your methods. You will work alongside a science team to delight customers by aiding in recommendations relevancy, and raise the profile of Amazon as a global leader in machine learning and personalization. Successful candidates will have strong technical ability, focus on customers by applying a customer-first approach, excellent teamwork and communication skills, and a motivation to achieve results in a fast-paced environment. Our position offers exceptional opportunities for every candidate to grow their technical and non-technical skills. If you are selected, you have the opportunity to make a difference to our business by designing and building state of the art machine learning systems on big data, leveraging Amazon’s vast computing resources (AWS), working on exciting and challenging projects, and delivering meaningful results to customers world-wide. Key job responsibilities Develop machine learning algorithms for high-scale recommendations problems. Rapidly design, prototype and test many possible hypotheses in a high-ambiguity environment, making use of both quantitative analysis and business judgement. Collaborate with software engineers to integrate successful experimental results into large-scale, highly complex Amazon production systems capable of handling 100,000s of transactions per second at low latency. Report results in a manner which is both statistically rigorous and compellingly relevant, exemplifying good scientific practice in a business environment."
full_description = "Beijing Research in Beijing spans numerous efforts, including those aimed at powering personalized customer engagement for Amazon customers, and for Amazon Web Services (AWS). The Beijing office is home to the Greater China Solutions Research and Development Center, an important development resource for the AWS China team. The center’s main work is to continue to develop and launch reusable, proven, and easy-to-deploy solutions to help customers run workloads on AWS faster and fully realize the value of the cloud. Working in Beijing, you’ll be part of a growing team where you can influence the mission, direction, and how the team achieves its goals for high-impact, high-visibility products. Share Share Copy link Email X LinkedIn Facebook Line Reddit QZone Sina Weibo WeChat WhatsApp 分享到微信 x 1 of 3 — Beijing office building Employees and their guests can enjoy multiple dining options located within the building, from Starbucks to a hotpot restaurant. 2 of 3 — Beijing office building In addition to five on-site restaurants, a food court is located on the third floor of the INDIGO shopping center. 3 of 3 — Beijing office building The building offers a variety of amenities for employees, including a locker room and mother's room. Research areasScientists in Beijing are conducting research across many disciplines, including data science, deep learning, natural language processing, and using advanced machine learning models.Working in BeijingAmazon provides scientists room to take risks and fail; a community for collaboration and support for continued learning; and the opportunity to have an impact at global scale. Scientists are encouraged to engage with the research community in many forms, from attending conferences and writing research papers, to contributing to open-source code, and public datasets.Beijing is the capital city of China, as well as the country’s political, cultural, art, and educational center. Amazon’s corporate office in China is in the east side of the city, close to the central business district area.CollaborationsOur Beijing scientists collaborate with universities and other institutions around the globe. To see a summary of some of Amazon’s scientific collaborations, visit our academic collaborations page.Open listingsCheck out the latest job listings available in China or visit our careers page to see all open science roles."
