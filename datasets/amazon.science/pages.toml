["https://www.amazon.science/locations/pittsburgh"]
title = "Pittsburgh - Amazon Science"
description = "We’re looking for a Machine Learning Scientist in the Personalization team for our Edinburgh office experienced in generative AI and large models. You will be responsible for developing and disseminating customer-facing personalized recommendation models. This is a hands-on role with global impact working with a team of world-class engineers and scientists across the Edinburgh offices and wider organization. You will lead the design of machine learning models that scale to very large quantities of data, and serve high-scale low-latency recommendations to all customers worldwide. You will embody scientific rigor, designing and executing experiments to demonstrate the technical efficacy and business value of your methods. You will work alongside a science team to delight customers by aiding in recommendations relevancy, and raise the profile of Amazon as a global leader in machine learning and personalization. Successful candidates will have strong technical ability, focus on customers by applying a customer-first approach, excellent teamwork and communication skills, and a motivation to achieve results in a fast-paced environment. Our position offers exceptional opportunities for every candidate to grow their technical and non-technical skills. If you are selected, you have the opportunity to make a difference to our business by designing and building state of the art machine learning systems on big data, leveraging Amazon’s vast computing resources (AWS), working on exciting and challenging projects, and delivering meaningful results to customers world-wide. Key job responsibilities Develop machine learning algorithms for high-scale recommendations problems. Rapidly design, prototype and test many possible hypotheses in a high-ambiguity environment, making use of both quantitative analysis and business judgement. Collaborate with software engineers to integrate successful experimental results into large-scale, highly complex Amazon production systems capable of handling 100,000s of transactions per second at low latency. Report results in a manner which is both statistically rigorous and compellingly relevant, exemplifying good scientific practice in a business environment."
full_description = "Pittsburgh Pittsburgh is a key innovation hub for Alexa and for the International Technology (INTech) team. The Alexa Hybrid Science team builds automatic speech recognition and spoken language understanding models that run on resource-constrained devices. This team owns the research and model-building technology that enables an Alexa experience when there is no internet connectivity, or when serving the request locally improves the customer experience. Share Share Copy link Email X LinkedIn Facebook Line Reddit QZone Sina Weibo WeChat WhatsApp 分享到微信 x 1 of 2 — Pittsburgh office building Situated within a 123-acre riverfront development across from the Hot Metal Bridge, the building is located just minutes from Pittsburgh’s Central Business District. 2 of 2 — Pittsburgh office building Building amenities include a mother's room for parents. Amazonians of all faiths and religious denominations are invited to use the interfaith prayer room. Research areasScientists in Pittsburgh are conducting research in various disciplines, including natural language processing, automatic speech recognition, machine translation, information retrieval, spoken language understanding, edge computing, and text-to-speech.Working in PittsburghAmazon provides scientists room to take risks and fail; a community for collaboration and support for continued learning; and the opportunity to have an impact at global scale. Scientists are encouraged to engage with the research community in many forms, from attending conferences and writing research papers, to contributing to open-source code, and public datasets.With rapid job growth in technology, medicine, and education, Pittsburgh offers affordable housing and is annually ranked as one of America’s most livable cities. Visit world-class museums like the Andy Warhol Museum or stroll through hilly neighborhoods with renowned universities like Carnegie Mellon. With its three rivers and numerous parks, Pittsburgh offers outdoor recreation, from biking to kayaking and skiing.CollaborationsOur Pittsburgh scientists collaborate with universities and other institutions around the globe. To see a summary of some of Amazon’s scientific collaborations, visit our academic collaborations page.Open listingsAmazon ranked second on the 2024 list of the best large workplaces to grow your career in the US. Visit our careers page to see all open science roles, both in the US and around the world."
