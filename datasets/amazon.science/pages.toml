full_description = "Recent publicationsView all View all Parakeet: Emission factor recommendation for carbon footprinting with generative AI Bharathan Balaji, Fahimeh Ebrahimi, Nina Domingo, Gargeya Vunnava, Abu-Zaher Faridee, Soma Ramalingam, Shikha Gupta, Anran Wang, Harsh Gupta, Domenic Belcastro, Kellen Axten, Jeremie Hakian, Jared Kramer, Aravind Srinivasan, Qingshi Tu NeurIPS 2024 Workshop on Tackling Climate Change with Machine Learning 2024 Accurately quantifying greenhouse gas (GHG) emissions from products and business activities is crucial for organizations to measure their environmental impact and undertake mitigation actions. Life cycle assessment (LCA) is the scientific discipline for estimating the environmental impact of products throughout their entire life cycle, from raw material extraction to end-of-life. Measuring the emissions Sustainability Optimized demand-based charging networks for long-haul trucking in Europe Jan-Hendrik Lange, Daniel Speth, Patrick Plötz Environmental Research: Infrastructure and Sustainability 2024 Battery electric trucks (BETs) are the most promising option for fast and large-scale CO2 emission reduction in road freight transport. Yet, the limited range and longer charging times compared to diesel trucks make long-haul BET applications challenging, so a comprehensive fast charging network for BETs is required. However, little is known about optimal truck charging locations for long-haul trucking Operations research and optimization Cloud based simulation platform (CSP): A novel way to democratize simulation based experimentation Rohan Vaidya, Abhi Mittal, Ganesh Nanaware Winter Simulation Conference 2024 2024 Organizations today are integrating technologies such as cloud computing, and digital twin in their manufacturing and logistical processes. In a capital-intensive logistics industry, Discrete event simulation (DES) plays a crucial role in distribution center design, automation system performance analysis, optimization and operational planning. Developing and deploying DES models demands proficiency in various Cloud and systems A critical analysis of circular product attributes and limitations of product circularity assessment methods Junwon Ko, Gisele Bortolaz Guedes, Fazleena Badurdeen, I.S. Jawahir, KC Morris, Vincenzo Ferrero, Buddhika Hapuwatte, Ryan Bradley, Ardeshir Raihanian Resource, Conservation and Recycling 2024 The Circular Economy (CE) has been proposed as a strategy to promote the efﬁcient use of resources, maximizing the beneﬁts derived from materials and products through value recovery strategies, and minimizing waste generation. However, ambiguity remains in deﬁning what makes a product circular and its characteristics when adapting the CE concept for application at the product level. More clarity about the Sustainability Deploying reinforcement learning based economizer optimization at scale Ivan Cui, Bharathan Balaji, Jake Chen, Charles Prosper, Wei Yih Yap ACM BuildSys 2023 Workshop on RLEM 2023 Building operations account for a significant portion of global emissions, contributing approximately 28% of global greenhouse gas emissions, according to the International Energy Agency. With the anticipated increase in cooling demand due to rising global temperatures, the optimization of rooftop units (RTUs) in buildings becomes crucial for reducing energy consumption and associated emissions. We focus Cloud and systems Load more Related content Amazon Sustainability Report Amazon is committed to building a sustainable business for our customers and the planet. Learn more about the company's goals, strategies and policies in our sustainability report. View report Five ways the ABACUS label advances nature-based carbon removal Kyle Hemes, James Mulligan November 11, 2024 From more-accurate measurement of carbon dioxide removal to greater diversity in restoration design, the ABACUS label’s requirements help advance the integrity of restoration projects in the voluntary carbon market. Sustainability How Amazon achieved its 100% renewable energy goal Staff writer July 15, 2024 Investing in 500+ solar and wind projects, bringing carbon-free energy to dirty grids, and buying Renewable Energy Certificates all played a role. Sustainability Five ways Amazon is preparing for the energy demands of the future Staff writer June 25, 2024 From investing in new carbon-free energy projects to advocating for grid modernization and collaborating with key stakeholders around the world, Amazon is working toward a cleaner energy future. Sustainability Sustainability call for proposals — Spring 2024 Addressing the challenges associated with generating consistent, transparent, and accurate carbon measurements. Sustainability Decarbonizing paper packaging Nii Ofei Mante, Alan Jacobsen February 29, 2024 Amazon teams up with RTI International, Schlumberger, and International Paper on a project selected by the US Department of Energy to scale carbon capture and storage for the pulp and paper industry. Sustainability Load more"
