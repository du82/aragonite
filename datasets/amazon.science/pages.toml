ge management Large language model guided graph clustering Puja Trivedi, Nurendra Choudhary, Eddie Huang, Vassilis N. Ioannidis, Karthik Subbian, Danai Koutra LoG 2024 2024 Graph clustering on text-attributed graphs (TAGS), i.e., graphs that include natural language text as additional node information, is typically performed using graph neural networks (GNNs), which forego the text in lieu of embeddings. While GNN methods ensure scalability and effectively leverage graph topology, text attributes contain rich information that can be leveraged using large language models (LLMs Conversational AI BPID: A benchmark for personal identity deduplication Runhui Wang, Yefan Tao, Adit Krishnan, Chris (Luyang) Kong, Xuanqing Liu, Yuqian Deng, Yunzhao Yang, Henrik Johnson, Andrew Borthwick, Aditi Sinha, Davor Golac EMNLP 2024 2024 Data deduplication is a critical task in data management and mining, focused on consolidating duplicate records that refer to the same entity. Personally Identifiable Information (PII) is a critical class of data for deduplication across various industries. Consumer data, stored and generated through various engagement channels, is crucial for marketers, agencies, and publishers. However, a major challenge Information and knowledge management Load more Related content How Amazon DataZone helps customers find value in oceans of data John Roach October 05, 2023 The service, which is now generally available, uses machine learning to make it faster and easier to catalog, discover, share, and govern data. Information and knowledge management KDD 2023: Graph neural networks’ new frontiers Larry Hardesty August 04, 2023 Conference general chair and Amazon Scholar Yizhou Sun on modeling long-range dependencies, improving efficiency, and new causal models. Information and knowledge management Scaling graph-neural-network training with CPU-GPU clusters Da Zheng August 17, 2022 In tests, new approach is 15 to 18 times as fast as predecessors. Machine learning Amazon at WSDM: The future of graph neural networks Larry Hardesty February 17, 2022 Amazon’s George Karypis will give a keynote address on graph neural networks, a field in which “there is some fundamental theoretical stuff that we still need to understand.” Machine learning How to train large graph neural networks efficiently Da Zheng August 20, 2021 New method enables two- to 14-fold speedups over best-performing predecessors. Machine learning KDD: Graph neural networks and self-supervised learning Larry Hardesty August 13, 2021 Amazon Scholar Chandan Reddy on the trends he sees in knowledge discovery research and their implications for his own work. Information and knowledge management Load more"
