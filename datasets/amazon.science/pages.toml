 view of the picturesque Neckar waterfront and the Hölderlin Tower.CollaborationsOur Tübingen scientists collaborate with universities and other institutions around the globe. To see a summary of some of Amazon’s scientific collaborations, visit our academic collaborations page.Open listingsClick here to see the latest job listings available in Germany or visit our careers page to see all open science roles.'
