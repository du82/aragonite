ossible. Economics How Thomas Hoe helps Amazon understand European customers Sean O'Neill March 21, 2024 The principal economist and his team address unique challenges using techniques at the intersection of microeconomics, statistics, and machine learning. Economics How CloudTune generates forecasts for the Amazon Store John Roach October 10, 2023 The system has expanded from generating peak computation-load forecasts one year in advance to a series of forecasts that include per-minute forecasts several months into the future. Economics How economic data informs a more equitable employee experience at Amazon Staff writer October 05, 2023 Wharton professor Jessie Handbury lends her expertise to Amazon’s PXTCS Team as an Amazon Visiting Academic. Economics Load more"
