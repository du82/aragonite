full_description = "Related publicationsView all View all REACT: Residual-adaptive contextual tuning for fast model adaptation in threat detection Jiayun Zhang, Junshen Xu, Bugra Can, Yi Fan The Web Conference 2025 2025 Web and mobile systems show constant distribution shifts due to the evolvement of services, users, and threats, severely degrading the performance of threat detection models trained on prior distributions. Fast model adaptation with minimal new data is essential for maintaining reliable security measures. A key challenge in this context is the lack of ground truth, which undermines the ability of existing Machine learning Safe validation of pricing agreements John Kolesar, Tancrède Lepoint, Martin Schaef, Willem Visser ICSE 2025 2025 Pricing agreements at AWS define how customers are billed for usage of services and resources. A pricing agreement consists of a complex sequence of terms that can include free tiers, savings plans, credits, volume discounts, and other similar features. To ensure that pricing agreements reflect the customers’ intentions, we employ a protocol that runs a set of validations that check all pricing agreements Security, privacy, and abuse prevention Pre-training differentially private models with limited public data Zhiqi Bu, Xinwei Zhang, Sheng Zha, Mingyi Hong NeurIPS 2024 2024 The superior performance of large foundation models relies on the use of massive amounts of high-quality data, which often contain sensitive, private and copyrighted material that requires formal protection. While differential privacy (DP) is a prominent method to gauge the degree of security provided to the models, its application is commonly limited to the model fine-tuning stage, due to the performance Machine learning Enhancing security control production with generative AI Chen Ling, Mina Ghashami, Vianne Gao, Ali Torkamani, Ruslan Vaulin, Nivedita Mangam, Bhavya Jain, Farhan Diwan, Malini SS, Mingrui Cheng, Shreya Tarur Kumar, Felix Candelario 