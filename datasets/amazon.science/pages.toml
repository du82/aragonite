["https://www.amazon.science/faqs"]
title = "Amazon Science FAQs - Amazon Science"
description = "Explore our FAQs about Amazon Science to find answers to some of the most frequently asked questions, covering careers, research, conferences, and more."
full_description = '''General General Research Careers Collaborations General Research Careers Collaborations General What is Amazon Science? Science at Amazon is conducted to enable new customer experiences and address existing customer pain points, whenever there is limited or no existing prior art. Science complements engineering and product disciplines, and is a critical functional skill for all Amazon businesses focused on delivering increased value to their customers. Amazon Science is also a team within Amazon that supports the company's internal science community, and its approach to customer-obsessed science. Moreover, Amazon Science is the company's external website and social channels, featuring the latest news and research, and where you can find information about the conferences the company sponsors, the institutions the company collaborates with, its awards programs, career opportunities, challenges, and more. What is Amazon's unique approach to science? Amazon believes in hiring and developing world-class talent in science and engineering, and building teams with multi-disciplinary skills with clear charters and goals. These multi-disciplinary teams employ the company's working backwards method to identify long-term problems to solve on behalf of customers and a staged approach to ensuring teams make rapid progress towards their goals. The combination of world-class elastic computing resources available via Amazon Web Services (AWS), large-scale heterogeneous data resources, and teams' years of experience in building and deploying machine-learning algorithms is key to the science community's ability to deliver innovation at scale. Where can I find company information about Amazon? Please visit About Amazon, which is the company's corporate website, complete with international editions. It contains news announcements, original stories, and facts about Amazon, including a press center, sustainability report, and investor relations section. {"@context":"http://schema.org","@type":"WebContent","mainEntity":[{"@context":"http://schema.org","@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Science at Amazon is conducted to enable new customer experiences and address existing customer pain points, whenever there is limited or no existing prior art. Science complements engineering and product disciplines, and is a critical functional skill for all Amazon businesses focused on delivering increased value to their customers. Amazon Science is also a team within Amazon that supports the company's internal science community, and its approach to customer-obsessed science. Moreover, Amazon Science is the company's external website and social channels, featuring the latest news and research, and where you can find information about the conferences the company sponsors, the institutions the company collaborates with, its awards programs, career opportunities, challenges, and more."},"name":"What is Amazon Science?"},{"@context":"http://schema.org","@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Amazon believes in hiring and developing world-class talent in science and engineering, and building teams with multi-disciplinary skills with clear charters and goals. These multi-disciplinary teams employ the company's working backwards method to identify long-term problems to solve on behalf of customers and a staged approach to ensuring teams make rapid progress towards their goals. The combination of world-class elastic computing resources available via Amazon Web Services (AWS), large-scale heterogeneous data resources, and teams' years of experience in building and deploying machine-learning algorithms is key to the science community's ability to deliver innovation at scale."},"name":"What is Amazon's unique approach to science?"},{"@context":"http://schema.org","@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Please visit&nbsp;<a class=\"Link\" href=\"https://www.aboutamazon.com/\" target=\"_blank\" >About Amazon<\/a>, which is the company's corporate website, complete with international editions. It contains news announcements, original stories, and facts about Amazon, including a&nbsp;<a class=\"Link\" href=\"https://press.aboutamazon.com/\" target=\"_blank\" >press center<\/a>,&nbsp;<a class=\"Link\" href=\"https://sustainability.aboutamazon.com/\" target=\"_blank\" >sustainability report<\/a>, and&nbsp;<a class=\"Link\" href=\"https://ir.aboutamazon.com/overview/default.aspx\" target=\"_blank\" >investor relations<\/a>&nbsp;section."},"name":"Where can I find company information about Amazon?"}]} Research What areas of research does Amazon focus on? Amazon scientists are conducting cutting edge research in areas ranging from machine learning to operations, conversational AI, robotics, quantum computing, and more. Learn more on our research areas page. Are Amazon scientists encouraged to publish? Yes. Amazon scientists publish hundreds of publications that are accepted at major conferences each year. Find the latest research papers on our publications page. Where can I find Amazon's publicly available code and datasets? You can find some of Amazon's publicly available code and datasets associated with academic research in the code and datasets section, or via the Amazon Science accounts on GitHub and Hugging Face. {"@context":"http://schema.org","@type":"WebContent","mainEntity":[{"@context":"http://schema.org","@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Amazon scientists are conducting cutting edge research in areas ranging from machine learning to operations, conversational AI, robotics, quantum computing, and more. Learn more on our&nbsp;<a class=\"Link\" href=\"https://www.amazon.science/research-areas\" >research areas<\/a>&nbsp;page."},"name":"What areas of research does Amazon focus on?"},{"@context":"http://schema.org","@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Yes. Amazon scientists publish hundreds of publications that are accepted at major conferences each year. Find the latest research papers on our&nbsp;<a class=\"Link\" href=\"https://www.amazon.science/publications\" >publications<\/a>&nbsp;page."},"name":"Are Amazon scientists encouraged to publish?"},{"@context":"http://schema.org","@type":"Question","acceptedAnswer":{"@type":"Answer","text":"You can find some of Amazon's publicly available code and datasets associated with academic research in the <a class=\"Link\" href=\"https://www.amazon.science/code-and-datasets\" >code and datasets<\/a> section, or via the Amazon Science accounts on <a class=\"Link\" href=\"https://github.com/amazon-science\" target=\"_blank\" >GitHub<\/a> and <a class=\"Link\" href=\"https://huggingface.co/AmazonScience\" target=\"_blank\" >Hugging Face<\/a>."},"name":"Where can I find Amazon's publicly available code and datasets?"}]} Careers How can I apply for a job as a scientist at Amazon? You can find a list of available science jobs on our careers page. The company recruits talent from around the world for applied scientists, data scientists, economists, research scientists, scholars, academics, PhDs, and interns. Can I work part-time at Amazon while teaching or studying? Yes. Qualified applicants can join the company as an Amazon Scholar or Amazon Visiting Academic and work on large-scale technical challenges without leaving their academic institution. Amazon also offers a program for recent PhD graduates. Learn more about Academics at Amazon. Does Amazon have science internships? Yes. The company offers internships year round. Projects depend on a student’s area of research and interest, as well as the team they're placed with. View our open internships. Where do Amazon scientists work? Amazon scientists are located around the globe. You can learn more about some of our research locations by browsing the map located on our careers page. Does Amazon offer science education courses? Yes. Amazon offers a variety of free machine learning classes for everyone from beginners to more experienced practitioners. Visit our ML education page to learn more about these resources. What is it like to work as a scientist at Amazon? We’ve interviewed scientists in organizations across Amazon to ask them about their experiences. Visit our working at Amazon section to learn what scientists say about their experiences. {"@context":"http://schema.org","@type":"WebContent","mainEntity":[{"@context":"http://schema.org","@type":"Question","acceptedAnswer":{"@type":"Answer","text":"You can find a list of available science jobs on our&nbsp;<a class=\"Link\" href=\"https://www.amazon.science/careers\" >careers page<\/a>. The company recruits talent from around the world for applied scientists, data scientists, economists, research scientists, scholars, academics, PhDs, and interns."},"name":"How can I apply for a job as a scientist at Amazon? "},{"@context":"http://schema.org","@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Yes. Qualified applicants can join the company as an Amazon Scholar or Amazon Visiting Academic and work on large-scale technical challenges without leaving their academic institution. Amazon also offers a program for recent PhD graduates. Learn more about&nbsp;<a class=\"Link\" href=\"https://www.amazon.science/academics-at-amazon\" >Academics at Amazon<\/a>."},"name":"Can I work part-time at Amazon while teaching or studying?"},{"@context":"http://schema.org","@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Yes. The company offers internships year round. Projects depend on a student’s area of research and interest, as well as the team they're placed with. View our&nbsp;<a class=\"Link\" href=\"https://www.amazon.science/careers?q=&amp;f0=internship&amp;expandedFilters=Job%2520type%2CCountry%2520%2F%2520region%2CJob%2520category%2C\" >open internships<\/a>."},"name":"Does Amazon have science internships?"},{"@context":"http://schema.org","@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Amazon scientists are located around the globe. You can learn more about some of our research locations by browsing the map located on our&nbsp;<a class=\"Link\" href=\"https://www.amazon.science/careers\" >careers page<\/a>."},"name":"Where do Amazon scientists work?"},{"@context":"http://schema.org","@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Yes. Amazon offers a variety of free machine learning classes for everyone from beginners to more experienced practitioners. Visit our&nbsp;<a class=\"Link\" href=\"https://www.amazon.science/tag/machine-learning-ml-education\" >ML education<\/a>&nbsp;page to learn more about these resources."},"name":"Does Amazon offer science education courses?"},{"@context":"http://schema.org","@type":"Question","acceptedAnswer":{"@type":"Answer","text":"We’ve interviewed scientists in organizations across Amazon to ask them about their experiences. Visit our&nbsp;<span class=\"Link\">working at Amazon<\/span>&nbsp;section to learn what scientists say about their experiences."},"name":"What is it like to work as a scientist at Amazon?"}]} Collaborations Does Amazon fund academic research? Yes. Amazon funds research at academic institutions and non-profits worldwide through Amazon Research Awards and other initiatives. Does Amazon host any challenges? Yes. Alexa Prize is a series of competitions for university students dedicated to accelerating the field of conversational AI. This is just one of many challenges the company hosts or supports. Does Amazon collaborate with schools and universities? Yes. Amazon has a wide range of collaborations with academic institutions in a variety of research areas. Learn more about them on our collaborations page. Does Amazon provide any other resources? Yes, we support the science community through a number of resources and programs, including: Amazon ML University, Amazon ML Summer School (India), AWS Cloud Credit for Research, AWS Registry of Open Data