full_description = '''Related publicationsView All View All Personalised outfit recommendation via history-aware transformers Myong Chol Jung, Julien Monteil, Philip Schulz, Volodymyr Vaskovych WSDM 2025 2025 We present the history-aware transformer (HAT), a transformer-based model that uses shoppers’ purchase history to personalise outfit predictions. The aim of this work is to recommend outfits that are internally coherent while matching an individual shopper’s style and taste. To achieve this, we stack two transformer models, one that produces outfit representations and another one that processes the history Search and information retrieval A non-contrastive learning framework for sequential recommendation with preference preserving profile generation Huimin Zeng, Xiaojie Wang, Anoop Jain, Zhicheng Dou, Dong Wang ICLR 2025 2025 Contrastive Learning (CL) proves to be effective for learning generalizable user representations in Sequential Recommendation (SR), but it suffers from high computational costs due to its reliance on negative samples. To overcome this limitation, we propose the first Non-Contrastive Learning (NCL) framework for SR, which eliminates computational overhead of identifying and generating negative samples. However Information and knowledge management How to talk to language models: Serialization strategies for structured entity matching Haoteng Yin, Jinha Kim, Prashant Mathur, Krishanu Sarker, Vidit Bansal NAACL 2025 2025 Entity matching (EM), which identifies whether two data records refer to the same real-world entity, is crucial for knowledge base construction and enhancing data-driven AI systems. Recent advances in language models (LMs) have shown great potential in resolving entities with rich textual attributes. However, their performance heavily depends on how structured entities are "talked" through serialized text Machine learning Orbit: A framework for designing and evaluating multi-objective rankers Chenyang Yang, Tesi Xiao, Michael 