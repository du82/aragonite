title = "Amazon Research Awards (ARA) - Amazon Science"
description = "Amazon Research Awards was founded in 2015 and merged with AWS Machine Learning Research Awards (MLRA) in 2020. The ARA program oﬀers unrestricted cash awards and AWS Promotional Credits to fund research at academic institutions and non-profit organizations in areas that align with our mission to advance customer-obsessed science."
full_description = "Program news Program updates Find the latest news and announcements about the Amazon Research Awards. Credit: iStockphoto Call for proposals Check out the latest call for proposals, and find out how to apply. Resources for applicants andranik123 - stock.adobe.com Rules Before submitting your proposal, please check the eligibility criteria, and other rules. Credit: iStockphoto FAQs Have questions about program rules and eligibility? You can find the answers here. Recipients and projects USC Research stories Learn how researchers have leveraged Amazon Research Awards support to innovate faster. Recipients Amazon is proud to support the work of these researchers and their projects. The ARA support has substantially helped crystallize our group's formulations and algorithms for fairness in cloud services, efficiency in online advertising, and the tradeoffs between efficiency and fairness in online services. Aravind Srinivasan, University of Maryland, College Park Learn more This project has a huge impact on the society and healthcare because it allows to provide timely and accurate diagnosis of neurological speech disorders (e.g., dystonia). The MLRA enabled us to use cutting-edge GPU capabilities to develop, train and validate our deep learning models for diagnosis of neurological speech disorders. Kristina Simonyan, Harvard Medical School Learn more The generous award provide by AWS has helped us to pump-prime novel research on the interface of climate science and machine learning. It also allowed us to make significant progress in understanding the benefits of using the cloud for ML focused climate research (on clouds). Philip Stier, University of Oxford Learn more The award allowed us to scale up our experiments to learn traffic smoothing algorithms in high fidelity simulations. The RL policies learned from the work are now in the process of being transferred to actual vehicles for field operational testing on California freeways. Alexandre Bayen, University of California, Berkeley Learn more"
