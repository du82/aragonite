ber 05, 2024 New method leverages vision-language models to formalize a comparison that had previously required human judgment. Computer vision AWS VP of AI and data on computer vision research at Amazon Swaminathan Sivasubramanian July 19, 2024 In his keynote address at CVPR, Swami Sivasubramanian considers the many ways that Amazon incorporates computer vision technology into its products and makes it directly available to AWS customers. Computer vision A quick guide to Amazon’s papers at CVPR 2024 Staff writer June 13, 2024 As in other areas of AI, generative models and foundation models — such as vision-language models — are a hot topic. Computer vision Load more"
