full_description = "Tel Aviv and Haifa Tel Aviv and nearby Haifa are home to world-class teams tasked with conceiving, designing, and bringing to market features for exciting and innovative consumer electronics products such as Alexa and the Amazon Halo Band. Scientists and engineers in in this region contribute to research of new AI technologies to enable shopping in everyday life. Scientists and engineers here also work on challenges related to cloud computing and machine learning, particularly as it relates to computer vision. Share Share Copy link Email X LinkedIn Facebook Line Reddit QZone Sina Weibo WeChat WhatsApp 分享到微信 x 1 of 6 — Tel Aviv office building Amazon has a new home in Tel Aviv, within Israel’s tallest building, the Azrieli Sarona tower. It offers a unique and creative space in one of Tel Aviv's most exciting locations, covering 10 floors and approximately 25,000 square meters. 2 of 6 — Tel Aviv office building The building was built to accommodate growing business needs and has been carefully designed to provide a balance of amenities, such as adjustable desks, break-out spaces, flex and meeting rooms, and much more. 3 of 6 — Tel Aviv office building Outside, just a few steps away, employees can enjoy the popular Sarona Market, and a variety of shops, restaurants, and transport links. 4 of 6 — Haifa office building The building in Haifa is a brand-new, single-tenant building in the Haifa High-Tech and Industrial Center Matam Park. Conveniently located close to major arteries, it boasts spectacular views of the sea. Amazon Science 5 of 6 — Haifa office building The sixth floor's roof-deck offers comfortable seating areas, where employees can enjoy water views from the main balcony. Amazon Science 6 of 6 — Haifa office building Amenities include locker rooms with showers, a wellness space, mother's room, game lounges, and quiet rooms. Amazon Science Research areasResearch in Tel Aviv and Haifa spans a variety of disciplines, including natural language processing, computer vision, causal representation, deep learning, data science, and speech processing.Working in Tel AvivAmazon provides scientists room to take risks and fail; a community for collaboration and support for continued learning; and the opportunity to have an impact at global scale. Scientists are encouraged to engage with the research community in many forms, from attending conferences and writing research papers, to contributing to open-source, and public datasets.Tel Aviv is the second largest city in Israel, located on the country's central-west coast. Tel Aviv is a financial and cultural hub, with a strong focus on business and research. Thanks to its robust theater and nightlife scenes, the city is considered a primary go-to spot for tourism and entertainment.Haifa, the third largest city in Israel, is situated on the slopes and mountaintop of the Carmel Mountain. Haifa is one of the largest industrial centers in Israel and a hub for transport, trade, shipping, and tourism. It is home to world famous universities like the Technion, the University of Haifa, and other institutions for higher education and scientific research.CollaborationsOur Tel Aviv and Haifa scientists collaborate with universities and other institutions around the globe. To see a summary of some of Amazon’s scientific collaborations, visit our academic collaborations page.Open listingsCheck out the latest job listings available in Israel or visit our careers page to see all open science roles."
