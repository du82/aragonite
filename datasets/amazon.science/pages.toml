["https://www.amazon.science/locations/boston-cambridge-and-north-reading"]
title = "Boston, Cambridge, and North Reading - Amazon Science"
description = "We’re looking for a Machine Learning Scientist in the Personalization team for our Edinburgh office experienced in generative AI and large models. You will be responsible for developing and disseminating customer-facing personalized recommendation models. This is a hands-on role with global impact working with a team of world-class engineers and scientists across the Edinburgh offices and wider organization. You will lead the design of machine learning models that scale to very large quantities of data, and serve high-scale low-latency recommendations to all customers worldwide. You will embody scientific rigor, designing and executing experiments to demonstrate the technical efficacy and business value of your methods. You will work alongside a science team to delight customers by aiding in recommendations relevancy, and raise the profile of Amazon as a global leader in machine learning and personalization. Successful candidates will have strong technical ability, focus on customers by applying a customer-first approach, excellent teamwork and communication skills, and a motivation to achieve results in a fast-paced environment. Our position offers exceptional opportunities for every candidate to grow their technical and non-technical skills. If you are selected, you have the opportunity to make a difference to our business by designing and building state of the art machine learning systems on big data, leveraging Amazon’s vast computing resources (AWS), working on exciting and challenging projects, and delivering meaningful results to customers world-wide. Key job responsibilities Develop machine learning algorithms for high-scale recommendations problems. Rapidly design, prototype and test many possible hypotheses in a high-ambiguity environment, making use of both quantitative analysis and business judgement. Collaborate with software engineers to integrate successful experimental results into large-scale, highly complex Amazon production systems capable of handling 100,000s of transactions per second at low latency. Report results in a manner which is both statistically rigorous and compellingly relevant, exemplifying good scientific practice in a business environment."
full_description = "Boston, Cambridge, and North Reading The Boston region is an important research hub for Amazon, with offices in the city itself as well as in nearby Cambridge and North Reading. Scientists in the area work on technology related to AWS, Alexa, robotics, and quantum computing.The Amazon Detective team in Boston is tackling some of the most challenging problems at the intersection of cybersecurity, big data, and machine learning. The Cambridge office offers opportunities to work on AI and NLU for Alexa. And in North Reading, scientists work on fundamental challenges in the robotics field and how to solve them at real-world scale. Share Share Copy link Email X LinkedIn Facebook Line Reddit QZone Sina Weibo WeChat WhatsApp 分享到微信 x 1 of 3 — Boston office building Located within Boston's financial district, this dog-friendly office offers a host of amenities, including a food court on the seventh floor. Each mother's room is equipped with a hospital grade pump, pump wipes, storage bags, and nursing pads. The interfaith prayer room welcomes individuals of all faiths and religious denominations. 2 of 3 — Cambridge office building Individuals of all faiths and religious denominations can utilize the interfaith prayer room, located on the ninth floor. The room offers solace to any employee seeking a quiet moment or simply a place to escape when needed. The building also features a variety of amenities, such as locker rooms with showers, as well as fully equipped mother's rooms, which offer hospital grade pumps, pump wipes, storage bags, and nursing pads. 3 of 3 — North Reading office building The office is located in an outlying suburban town of Middlesex County, lying entirely within the Ipswich River watershed. The dog-friendly site offers employee shower facilities on the building's first floor. Amazonians have access to baby changing stations located in both the unisex and women's restrooms, as well as mother's rooms equipped with hospital grade pumps, pump wipes, storage bags, and nursing pads. Research areasResearch in the Boston area spans a variety of disciplines, including robotics — manipulation and grasping; autonomous mobility; multi-robot coordination and planning — cybersecurity, big data, machine learning, natural language processing, automatic speech recognition, graph analytics, quantum communications, and computer vision, among others.Working in Boston, Cambridge, and North ReadingAmazon provides scientists room to take risks and fail; a community for collaboration and support for continued learning; and the opportunity to have an impact at global scale. Scientists are encouraged to engage with the research community in many forms, from attending conferences and writing research papers, to contributing to open-source code, and public datasets.The Boston metropolitan area is an international center of education, medicine, and technology. The Charles River separates Boston from Cambridge, which is home to the Massachusetts Institute of Technology and Harvard University. North Reading sits about 15 miles north of Boston. It features Ipswich River Park a 49-acre site including a conservation area, restored wetlands, walking paths, sports fields and courts, playgrounds, and more.CollaborationsOur scientists in Boston, Cambridge, and North Reading collaborate with universities and other institutions around the globe. To see a summary of some of Amazon’s scientific collaborations, visit our academic collaborations page.Open listingsAmazon ranked second on the 2024 list of the best large workplaces to grow your career in the US. Visit our careers page to see all open science roles, both in the US and around the world."
