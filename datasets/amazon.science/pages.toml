full_description = "Recent publicationsView All View All CLOUD-CG: Clustering on longitudinal causal graphs Shinpei Nakamura-Sakai, Yuhe Gao, Chi-Hui Yen, Christoph Scheidiger, Jasjeet Sekhon AAAI 2025 Workshop on AI for Social Impact 2025 To the best of our knowledge, this work introduces the first framework for clustering longitudinal data by leveraging time-dependent causal representation learning. Clustering longitudinal data has gained significant attention across various fields, yet traditional methods often overlook the causal structures underlying observed patterns. Understanding how covariates influence outcomes is critical for policymakers Economics Adaptive experimentation when you can’t experiment Yao Zhao, Kwang-Sung Jun, Tanner Fiez, Lalit Jain 2023 Conference on Digital Experimentation @ MIT (CODE@MIT), NeurIPS 2024 2024 This paper introduces the confounded pure exploration transductive linear bandit (CPET-LB) problem. As a motivating example, often online services cannot directly assign users to specific control or treatment experiences either for business or practical reasons. In these settings, naively comparing treatment and control groups that may result from self-selection can lead to biased estimates of underlying Economics Performance of synthetic diff-in-diff models for geo-randomized experiments Paula Meloni, Stefan Hut, Mahnaz Islam 2024 Conference on Digital Experimentation @ MIT (CODE@MIT) 2024 There are different reasons why experimenters may want to randomize their experiment at a region level. In some cases, treatments cannot be turned on or off at the individual level, therefore requiring randomization at a group level, for which regions can be a good candidate. In other cases, experimenters may worry about network effects or other types of spillovers within a geographic area, and opt to randomize Economics Scalable heterogeneity detection in online experiments Hammaad Adam, Merlin Heidemanns, Doug Hains, James McQueen 2024 Conference