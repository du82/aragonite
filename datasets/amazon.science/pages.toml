["https://www.amazon.science/locations/luxembourg"]
title = "Luxembourg - Amazon Science"
description = "We’re looking for a Machine Learning Scientist in the Personalization team for our Edinburgh office experienced in generative AI and large models. You will be responsible for developing and disseminating customer-facing personalized recommendation models. This is a hands-on role with global impact working with a team of world-class engineers and scientists across the Edinburgh offices and wider organization. You will lead the design of machine learning models that scale to very large quantities of data, and serve high-scale low-latency recommendations to all customers worldwide. You will embody scientific rigor, designing and executing experiments to demonstrate the technical efficacy and business value of your methods. You will work alongside a science team to delight customers by aiding in recommendations relevancy, and raise the profile of Amazon as a global leader in machine learning and personalization. Successful candidates will have strong technical ability, focus on customers by applying a customer-first approach, excellent teamwork and communication skills, and a motivation to achieve results in a fast-paced environment. Our position offers exceptional opportunities for every candidate to grow their technical and non-technical skills. If you are selected, you have the opportunity to make a difference to our business by designing and building state of the art machine learning systems on big data, leveraging Amazon’s vast computing resources (AWS), working on exciting and challenging projects, and delivering meaningful results to customers world-wide. Key job responsibilities Develop machine learning algorithms for high-scale recommendations problems. Rapidly design, prototype and test many possible hypotheses in a high-ambiguity environment, making use of both quantitative analysis and business judgement. Collaborate with software engineers to integrate successful experimental results into large-scale, highly complex Amazon production systems capable of handling 100,000s of transactions per second at low latency. Report results in a manner which is both statistically rigorous and compellingly relevant, exemplifying good scientific practice in a business environment."
full_description = '''Luxembourg Scientists in Luxembourg solve problems for our global customers and collaborate with teams worldwide. With team members hailing from all around the world, the environment is multicultural. Much of the work in Luxembourg is focused on surfacing the right products to Amazon retail customers and delivering them as efficiently as possible. The Data Technology and Products (DTP) team in Luxembourg helps provide the data backbone behind Amazon’s successful European operations, particularly as it relates to supply chain optimization and delivery logistics. Share Share Copy link Email X LinkedIn Facebook Line Reddit QZone Sina Weibo WeChat WhatsApp 分享到微信 x 1 of 3 — Luxembourg office building Located in the city's Kirchberg area, the building is integrated in "The Square," a collection of four buildings designed to be both aesthetically pleasing and ethically minded. 2 of 3 — Luxembourg office building Employees can meet for breakfast, lunch, or coffee at Le Hub Café, located on the building's ground floor. The canteen also offers catering for meetings. 3 of 3 — Luxembourg office building Along with the on-site café, the building features locker rooms with showers, a mother's room, quiet room, multifaith space, and wellness studio. Research areasScientists in Luxembourg are conducting research across many disciplines, including data science, economics, operations research, inventory management, forecasting, computer vision, transportation logistics, and machine learning.Working in LuxembourgAmazon provides scientists room to take risks and fail; a community for collaboration and support for continued learning; and the opportunity to have an impact at global scale. Scientists are encouraged to engage with the research community in many forms, from attending conferences and writing research papers, to contributing to open-source, and public datasets.Quality of life, the location within Europe, a diverse, expat-friendly culture, and children’s international education are just some of the reasons why Amazonians enjoy working here. Luxembourg’s small size means Amazonians can live in, or close to, the city center; others prefer living in the nearby countryside; and still others prefer to commute daily to Luxembourg from the neighboring countries, as their commuting times by car are better than within many capital cities.CollaborationsOur Luxembourg scientists collaborate with universities and other institutions around the globe. To see a summary of some of Amazon’s scientific collaborations, visit our academic collaborations page.Open listingsClick here to see the latest job listings available in Luxembourg or visit our careers page to see all open science roles.'''
