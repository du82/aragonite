title = "Yiming Qian - Amazon Science"
description = "This paper investigates multi-modal large language models (MLLMs) for predicting product features from images, comparing fine-tuned versus proprietary models. We introduce two domain-specific benchmarks: (1) Inductive Bias vs. Image Evidence (IBIE) Benchmark, which evaluates MLLMs’ ability to distinguish between image-derived features and latent knowledge, and (2) Catalog-bench, which assesses feature prediction"
full_description = "3 results found Sort Relevance Newest Oldest A - Z Z - A What matters when building vision language models for product image analysis? Ameni Trabelsi, Maria Zontak, Yiming Qian, Brian Jackson, Suleiman Khan, Umit Batur WACV 2025 Workshop on Physical Retail in AI 2025 This paper investigates multi-modal large language models (MLLMs) for predicting product features from images, comparing fine-tuned versus proprietary models. We introduce two domain-specific benchmarks: (1) Inductive Bias vs. Image Evidence (IBIE) Benchmark, which evaluates MLLMs’ ability to distinguish between image-derived features and latent knowledge, and (2) Catalog-bench, which assesses feature prediction Computer vision DPA-Net: Structured 3D abstraction from sparse views via differentiable primitive assembly Fenggen Yu, Yiming Qian, Xu Zhang, Francisca Gil Ureta, Brian Jackson, Eric Bennett, Richard Zhang ECCV 2024 2024 We present a differentiable rendering framework to learn structured 3D abstractions in the form of primitive assemblies from sparse RGB images capturing a 3D object. By leveraging differentiable volume rendering, our method does not require 3D supervision. Architecturally, our network follows the general pipeline of an image-conditioned neural radiance field (NeRF) exemplified by pixelNeRF for color prediction Computer vision HAL3D: Hierarchical active learning for fine-grained 3D part labeling Fenggen Yu, Yiming Qian, Francisca Gil Ureta, Brian Jackson, Eric Bennett, Richard Zhang ICCV 2023 2023 We present the first active learning tool for fine-grained 3D part labeling, a problem which challenges even the most advanced deep learning (DL) methods due to the significant structural variations among the intricate parts. For the same reason, the necessary effort to annotate training data is tremendous, motivating approaches to minimize human involvement. Our labeling tool iteratively verifies or modifies Machine learning"
year_published = 2025
