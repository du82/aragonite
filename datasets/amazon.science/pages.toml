title = "Anoop S V K K Saladi - Amazon Science"
description = "General vision-language models (VLMs) trained on web data struggle to understand and converse about real-world e-commerce product images. We propose a cost-efficient approach for collecting training data to train a generative VLM for e-commerce product images. The key idea is to leverage large-scale, loosely-coupled image-text pairs from e-commerce stores, use a pre-trained LLM to generate multi-modal instruction-following"
full_description = "11 results found Sort Relevance Newest Oldest A - Z Z - A VIT-Pro: Visual instruction tuning for product images Vishnu Prabhakaran, Purav Aggarwal, Vishruit Kulshreshtha, Arunita Das, Venkata Sitaram Sruti Sahini, Anoop S V K K Saladi NAACL 2025 2025 General vision-language models (VLMs) trained on web data struggle to understand and converse about real-world e-commerce product images. We propose a cost-efficient approach for collecting training data to train a generative VLM for e-commerce product images. The key idea is to leverage large-scale, loosely-coupled image-text pairs from e-commerce stores, use a pre-trained LLM to generate multi-modal instruction-following Conversational AI AutoEval-ToD: Automated evaluation of task-oriented dialog systems Arihant Jain, Purav Aggarwal, Rishav Sahay, Chaosheng Dong, Anoop S V K K Saladi NAACL 2025 2025 Task-oriented Dialog systems (ToD) are essential in automating user interactions, but their complex design and dynamic nature make evaluation particularly challenging. Current evaluation methodologies heavily depend on human annotators, which can be inefficient, subjective, and expensive to scale. To advance the field, there is a pressing need for a reliable, scalable, and systematic evaluation framework Conversational AI MERLIN: Multimodal & multilingual embedding for recommendations at large-scale via item associations Sambeet Tiady, Arihant Jain, Dween Rabius Sanny, Khushi Gupta, Srinivas Virinchi, Swapnil Gupta, Anoop S V K K Saladi, Deepak Gupta CIKM 2024 2024 Product recommendations incentivize customers to make multiunit purchases by surfacing relevant products, leading to lower cost per unit for e-commerce stores and lower prices for their customers. However, the humongous scale of products, implicit co-purchase asymmetry and variation in co-purchase behavior across different categories, are orthogonal problems to solve. To address these problems, we propose Machine learning PEMBOT: Pareto-ensembled multi-task boosted trees Gokul Swamy, Anoop S V K K Saladi, Arunita Das, Shobhit Niranjan KDD 2024 2024 Multi-task problems frequently arise in machine learning when there are multiple target variables, which share a common synergy while being sufficiently different that optimizing on any of the task does not necessarily imply an optimum for the others. In this work, we develop PEMBOT, a novel Pareto-based multi-task classification framework using a gradient boosted tree architecture. The proposed methodology Machine learning Leveraging uncertainty estimates to improve classifier performance Gundeep Arora, Srujana Merugu, Anoop S V K K Saladi, Rajeev Rastogi ICLR 2024 2024 Binary classification involves predicting the label of an instance based on whether the model score for the positive class exceeds a threshold chosen as per application needs (e.g., maximizing recall at a precision bound). However, model scores are often not aligned with the true conditional probability of the positive class. This is especially true when the training involves differential sampling across Machine learning Boosting the performance of deployable timestamped directed GNNs via time-relaxed sampling Arihant Jain, Gundeep Arora, Anoop S V K K Saladi ECML PKDD 2023 2023 Timestamped graphs find applications in critical business problems like user classification, fraud detection, etc. This is due to the inherent nature of the data generation process, in which relationships between nodes are observed at defined timestamps. Deployment-focused GNN models should be trained on point-in-time information about node features and neighborhood, similar to the data ingestion process Machine learning Multi-task student teacher based unsupervised domain adaptation for address parsing Rishav Sahay, Anoop S V K K Saladi, Prateek Sircar PAKDD 2023 2023 In an e-commerce business, the ability to parse postal addresses into sub-component entities (such as building, locality) is essential to take automated actions at scale for successful delivery of shipments. The entities can be leveraged to build applications for logistics related operations, e.g. geocoding, assessing address completeness. Training an accurate address parser requires a significant number Conversational AI BLADE: Biased neighborhood sampling based graph neural network for directed graphs Srinivas Virinchi, Anoop S V K K Saladi WSDM 2023 2023 Directed graphs are ubiquitous and have applications across multiple domains including citation, website, social, and traffic networks. Yet, the majority of research involving graph neural networks (GNNs) focus on undirected graphs. In this paper, we deal with the problem of node recommendation in non-attributed directed graphs. Specifically, given a directed graph and query node as input, the goal is to Related: Biased graph sampling for better related-product recommendation Machine learning PAVE: Lazy-MDP based ensemble to improve recall of product attribute extraction models Kushal Kumar, Anoop S V K K Saladi CIKM 2022 2022 E-commerce stores face the challenge of missing and inconsistent attribute values in the product detail pages and have to impute them on behalf of their vendors. Traditional approaches formulate the problem of attribute extraction (AE) from product profiles as natural language tasks such as information extraction or text classification. Such models typically operate at high precision but may yield low recall Machine learning Recommending related products using graph neural networks in directed graphs Srinivas Virinchi, Anoop S V K K Saladi, Abhirup Mondal ECML-PKDD 2022 2022 Related product recommendation (RPR) is pivotal to the success of any e-commerce service. In this paper, we deal with the problem of recommending related products i.e., given a query product, we would like to suggest top-k products that have high likelihood to be bought together with it. Our problem implicitly assumes asymmetry i.e., for a phone, we would like to recommend a suitable phone case, but for Related: Using graph neural networks to recommend related products Machine learning 1 2 Next"
