tual advertising, computer vision, supply chain optimization, transportation logistics and automated reasoning, among others.Working in London and CambridgeAmazon provides scientists room to take risks and fail; a community for collaboration and support for continued learning; and the opportunity to have an impact at global scale. Scientists are encouraged to engage with the research community in many forms, from attending conferences and research publications, to contributing to open-source, and public datasets.Standing on the River Thames, London has been a major settlement for two millennia, its history going back to its founding by the Romans. Today, the greater London area is an international metropolis, blending historical sites with modern architectural landmarks, and a wide range of peoples, languages, and cultures with those of the Britons.Most famous for the university bearing the same name, Cambridge lies in East Anglia. Cambridge today is the heart of the high-tech “Silicon Fen,” with a large number of technology and bioscience companies calling the city home. As a university town, Cambridge has a thriving culture, including the famous Midsummer Fair that dates to 1211, the Cambridge Folk Festival, and the Cambridge Shakespeare Festival.CollaborationsOur London-area scientists collaborate with universities and other institutions around the globe. To see a summary of some of Amazon’s scientific collaborations, visit our academic collaborations page.Open listingsCheck out the latest job listings available in the U.K. or visit our careers page to see all open science roles."
