description = 'Large Language Models (LLMs) are known to hallucinate and generate non-factual outputs which can undermine user trust. Traditional methods to directly mitigate hallucinations, such as representation editing and contrastive decoding, often require additional training data and involve high implementation complexity. While ensemble-based approaches harness multiple LLMs to tap into the "wisdom of crowds",'
full_description = '6 results found Sort Relevance Newest Oldest A - Z Z - A Uncertainty-aware fusion: An ensemble framework for mitigating hallucinations in large language models Prasenjit Dey, Srujana Merugu, Sivaramakrishnan (Siva) Kaveri The Web Conference 2025 2025 Large Language Models (LLMs) are known to hallucinate and generate non-factual outputs which can undermine user trust. Traditional methods to directly mitigate hallucinations, such as representation editing and contrastive decoding, often require additional training data and involve high implementation complexity. While ensemble-based approaches harness multiple LLMs to tap into the "wisdom of crowds", Machine learning Predictive relevance uncertainty for recommendation systems Charul Paliwal, Anirban Majumder, Sivaramakrishnan (Siva) Kaveri The Web Conference 2024 2024 Click-through Rate (CTR) module is the foundation block of recommendation system and used for search, content selection, advertising, video streaming etc. CTR is modelled as a classification problem and extensive research is done to improve the CTR models. However, uncertainty method for these models are still an unexplored area. In this work we analyse popular uncertainty methods in the context of recommendation Machine learning Adversarial density ratio estimation for change point detection Shreyas S, Prakash Mandayam Comar, Sivaramakrishnan (Siva) Kaveri CIKM 2023 2023 Change Point Detection (CPD) models are used to identify abrupt changes in the distribution of a data stream and have a widespread practical use. CPD methods generally compare the distribution of data sequences before and after a given time step to infer if there is a shift in distribution at the said time step. Numerous divergence measures, which measure distance between data distributions of sequence Machine learning Conformal prediction sets for ordinal classification Prasenjit Dey, Srujana Merugu, Sivaramakrishnan (Siva) Kaveri NeurIPS 2023 2023 Ordinal classification (OC), i.e., labeling instances along classes with a natural ordering, is common in multiple applications such as disease severity labeling and size or budget based recommendations. Often in practical scenarios, it is desirable to obtain a small set of likely classes with a guaranteed high chance of including the true class. Recent works on conformal prediction (CP) address this problem Machine learning TrendSpotter: Forecasting e-commerce product trends Gayatri Ryali, Shreyas S, Sivaramakrishnan (Siva) Kaveri, Prakash Mandayam Comar CIKM 2023 2023 Internet users actively search for trending products on various social media services like Instagram and YouTube which serve as popular hubs for discovering and exploring fashionable and popular items. It is imperative for e-commerce giants to have the capability to accurately identify, predict and subsequently showcase these trending products to the customers. E-commerce stores can effectively cater to Machine learning Spatio-temporal multi-graph networks for demand forecasting in online marketplaces Ankit Gandhi, Aakankasha, Sivaramakrishnan (Siva) Kaveri, Vineet Chaoji ECML-PKDD 2021 2021 Demand forecasting is fundamental to successful inventory planning and optimisation of logistics costs for online marketplaces such as Amazon. Millions of products and thousands of sellers are competing against each other in an online marketplace. In this paper, we propose a framework to forecast demand for a product from a particular seller (referred as offer/seller-product demand in the paper). Inventory Related: Data on correlated products and sellers helps improve demand forecasting Machine learning'
