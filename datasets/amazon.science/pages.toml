title = "Amazon SURE - Amazon Science"
description = "The Amazon Summer Undergraduate Research Experience (SURE) aims to increase diversity in science and engineering fields by providing students from historically underrepresented communities with a unique summer research experience at a top-tier university. Amazon has initiated multi-year SURE program commitments with five top-tier universities."
full_description = 'Mindaugas Dulinskas/Getty Images/iStockphoto Carnegie Mellon At Carnegie Mellon University, SURE is a 10-week program that offers first- and second-year students from underrepresented groups in computer science the chance to collaborate with top computer science researchers for a summer. Learn more Credit: Eileen Barroso/Columbia University Columbia University This 10-week program in New York City provides an opportunity to engage in cutting edge research on campus at Columbia University, and be mentored by faculty and STEM professionals representing multiple career paths from academia and industry. Learn more Rob Hainer/Robert Hainer - stock.adobe.com Georgia Tech SURE is a 10-week program designed to attract qualified under-represented minority and women students into graduate school in the fields of engineering and science. It has a proud legacy of helping students enter into graduate programs, especially at the Georgia Tech. Learn more Courtesy of UCLA University of California, Los Angeles The UCLA SURE program provides students who are typically underrepresented in engineering and computer science an opportunity to conduct innovative and cutting-edge research for eight weeks on campus. Learn more Credit: USC University of Southern California The USC SURE program provides outstanding undergraduate students with the opportunity to spend eight weeks in Los Angeles, working on cutting-edge research projects in the field of artificial intelligence, computer science and engineering, and robotics. Learn more Latest news USC SURE student develops prototype algorithm to help automate spacecraft docking Staff writer February 14, 2024 Derek Chibuzor utilized his SURE experience to gain "exposure to an aerospace research project in a professional research environment." Computer vision Djordje Zlatanovic A new paradigm for partnership between industry and academia Prem Natarajan, Anne Szeto March 23, 2023 How Amazon is shaping a set of initiatives to enable academia-based talent to harmonize their passions, life stations, and career ambitions. Amazon expands SURE program to Carnegie Mellon and UCLA Staff writer March 16, 2023 SURE provides students from historically underrepresented communities with research experiences at top-tier universities. Load more'
