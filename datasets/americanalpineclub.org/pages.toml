title = "Ways to Give — American Alpine Club"
description = "The American Alpine Club is a 501(c)(3) charitable organization. Our vision is a united community of competent climbers and healthy climbing landscapes."
full_description = "Donate Donate Now Ways to Give Great Ranges Fellowship Photo by AAC member Luke Hall. Ways To GiveDonate today and support the AAC’s work. With your generosity, we will grow one step closer to our vision of a community of thriving climbers. Together, we share a passion for climbing, the community it inspires, and the wild spaces that host us. When we pool our passion together we have overwhelming power and possibility: to protect our public lands, climb to new levels, educate each other on safe climbing practices, and connect with climbers of every background. With this dream in mind, the Club offers grants, world-renowned publications, rescue and medical coverage, community gatherings, opportunities for advocacy, preservation of our climbing history, support for climbers experiencing grief, and more. Your gift will help make this possible.If you have questions or would like more information, we would love to talk with you! Please reach out to our VP of Development, Heidi McDowell, at [email protected] or (720) 372-0131. Popular Ways to Give One-Time Gift Monthly Giving Great Ranges Fellowship AAC Office Mailing AddressThe American Alpine ClubATTN: Development710 10th Street, Suite 100Golden, CO 80401Tax ID or EIN: 13-1611981 Monthly GivingJoin a growing community of monthly donors to sustain the AAC’s work year-round. Monthly giving makes an enduring impact, and you can adjust your gift anytime. Donor Advised FundDonor Advised Funds or DAFs are a simple and effective way to support the AAC while maximizing your tax benefits. Contributions to your DAF are immediately tax-deductible, but you have the flexibility to designate gifts later, allowing your contributions to grow tax-free. To make a gift from your DAF:Login to your DAF accountSelect The American Alpine Club as the recipientProvide our EIN and address. Your fund manager will handle the rest! Workplace Giving Many companies offer generous matching programs to double or even triple the impact of your gift! As a 501(c)3 nonprofit, all donations to the Club are 100% tax-deductible and eligible for matching. To find out if your company offers matches, check with your HR representative. Send us your completed matching gift form so we can be on the lookout for the match. Stock DonationsGifting appreciated stock is a tax-savvy way to support the programs you care about most. To facilitate a gift of stock, please use the following:Step 1: Initiate TransferThe first step is to contact your broker to initiate the transfer. Your broker can arrange to have the securities delivered electronically to the American Alpine Club through Charles Schwab & Co:Charles Schwab & Co DTC Number: 0164 code 40;the AAC's Account Number: 1544-4329Step 2: Notify the American Alpine ClubPlease provide us some information about the gift for audit and acknowledgment purposes. Notify the AAC now or send a letter with the following information:Donor's full name and complete addressName and number of securities transferredDate of the transferSpecific American Alpine Club program to which gift should be directed, if any Piolet SocietyThe Piolet Society honors individuals who include the AAC in their estate plans. Whether through a bequest in your will, a beneficiary designation of an IRA, or a life insurance policy, planned giving lets you leave a legacy as enduring as the mountains we love and strive to protect. Learn more about planned giving or reach out to Francine Mullen at [email protected] Learn more ABOUT PLANNED GIVING Donate Your Tax RefundTurning your Colorado state tax refund into action is simple:Decide how much of your state income tax refund you would like to designate to support the American Alpine Club.Enter American Alpine Club and our registration number 20023003512 in the Donate to a Colorado Nonprofit Fund line on your state tax return or tax software. You may also provide this information to your tax preparer. Your contribution ensures that critical programs at the American Alpine Club can continue. Working alongside our members and partners, we focus on critical issues such as keeping public lands pristine, wild, and open to human-powered recreation. Through our policy and advocacy efforts such as Climb the Hill and Hill to Crag, we have made significant headway towards our national policy goals.More information about the new state tax refund program and how you can support the AAC is available at RefundWhatMatters.org. There are many ways to support the American Alpine Club. If you have any questions or would like more information, we would love to talk with you! Please call our office at (303) 384-0110, email [email protected], or reach out to our VP of Development Heidi McDowell at [email protected]. SUPPORT THE AAC — DONATE TODAY"
