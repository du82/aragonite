["https://americanalpineclub.org/news/2025/2/27/connect-remembering-charlie-through-an-epic-on-mt-whitney"]
title = "CONNECT: Remembering Charlie Through an Epic on Mt. Whitney — American Alpine Club"
description = """
In this AAC Podcast episode, Live Your Dream grant recipient David Corvi 
relays an epic 24 hour day on Mount Whitney, a journey and challenge he 
took on to honor the memory of his stillborn son Charlie. David shares his 
story, reflects on the devastation and preventability of infant and child 
loss, and shares how the mountains have helped him process his grief in 
some small ways."""
full_description = "Hannah Provost February 27, 2025 CONNECT: Remembering Charlie Through an Epic on Mt. Whitney Hannah Provost February 27, 2025 In this episode, we’re sitting down with AAC member David Corvi to talk about his Live Your Dream grant experience—a beautiful day that turned into a 24 hour epic on Mt. Whitney in September of 2024. Getting off route, climbing through pockets of ice and show, and getting lost on the descent were only some of what the team experienced that day.Because there is another layer of complexity to this story, a mental load that added a unique weight to that experience. David’s trip to Whitney was also in memory of his stillborn son, Charlie. In the episode, David shares about his family’s experience with infant and child loss, how climbing and other forms of outdoor adventures have helped him process his grief and continue to parent Charlie even though he is gone, and likewise he reflects on how physical challenges, like half marathons and the Whitney trip, are a way to honor the life Charlie won’t ever get to experience. Dive into this episode to hear about your classic alpine day gone wrong, and just one way that grief and loss can be processed in the mountains. David and his wife with Charlie. David and his Whitney expedition partners Dan and Brian. Listen Now Episode Resources:Apply to the Live Your Dream Grant (Opening March 1st, 2025)Charles Martin Corvi Fund Website How to Buy the Book: “Dear Charlie...Letters to My Son: A Father's Journey of Loss, Grief, and Remembrance”Deep Survival by Laurence GonzalezResources On Infant or Child Loss:Healthy Birthday (Stillbirth Prevention Advocates)Star Legacy Foundation Now I Lay Me Down to Sleep"
