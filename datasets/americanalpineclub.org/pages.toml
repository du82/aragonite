full_description = "Hueco Rock Rodeo Hueco Rock Rodeo Hueco Rock Rodeo 2024 Rodeo Results The American Alpine Club will no longer host the Hueco Rock Rodeo. We’re thrilled with the impact this event has had over the years and the ways they connected the climbing community. The AAC hosted the Hueco Rock Rodeo event for over a decade, and we're proud to have played a role in responsibly introducing thousands of climbers from around the globe to this amazing landscape and world-class bouldering destination. The Rodeo focused on encouraging climbers to challenge themselves through friendly competition while fostering a strong sense of community. It was also an important vehicle to introduce many climbers to the ethics of respecting a fragile landscape and the Indigenous communities that share this land. We’re excited to continue to be a conduit for responsible climbing in Hueco through our iconic lodging facility, the Hueco Rock Ranch. We look forward to continuing to serve our members, engage local communities, and celebrate climbing through both new and existing initiatives. Please visit this page to learn more about the recently adopted AAC Strategic Plan. Explore Hueco Rock Rodeo ContentCheck out behind the scenes footage from our Instagram Reels below and all the sends from the 2024 Hueco Rock Rodeo in our Youtube Playlist. 2024 Hrr Youtube playlist View this post on Instagram A post shared by Creating Award-Winning Adventure Media (@louderthan11) View this post on Instagram A post shared by American Alpine Club (@americanalpine) View this post on Instagram A post shared by Creating Award-Winning Adventure Media (@louderthan11) View this post on Instagram A post shared by American Alpine Club (@americanalpine) The history of this region spans millennia and is rich with the cultures of several Native American tribes, including the Isleta Pueblo, Comanche Nation, Kiowa Tribe, and the Mescalero Apache Tribe. These communities have all contributed significantly to the vibrant tapestry of history and culture on this land. The Tigua people of the Ysleta del Sur Pueblo, in particular, have been stewards of this region for generations before we know it as it exists today. Texas State Parks along with the Ysleta del Sur Pueblo, a federally recognized Native American tribe and sovereign nation, protect the irreplaceable resources within this sacred place. As climbers, we acknowledge the immense privilege it is to engage with this land. We ask that you approach your time here with humility and gratitude, recognizing the deep heritage and spiritual significance it holds for the Native American tribes who have called it home for countless generations. Please travel lightly and respectfully, honoring the privilege of being guests on this sacred land. - Nicole Roque, Texas Parks and Wildlife DepartmentYsleta del sur PuebloHueco Tanks State Park and Historic Site Discover the atmosphere of past Rodeos:"
