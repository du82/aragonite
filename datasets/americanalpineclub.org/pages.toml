title = "The Prescription—Top-Rope Solo — American Alpine Club"
description = "In this month’s Prescription, an expert climber made two crucial errors in her rope ascension/top-rope solo system. She fortunately escaped with relatively minor injuries.    This accident was featured in the  2024 Accidents in North American Climbing.  Top-Rope Solo Fall | Device Jammed By Sli"
full_description = 'Lucy Hooper February 13, 2025 Educate The Prescription—Top-Rope Solo Lucy Hooper February 13, 2025 Educate Angel Wings in Sequoia National Park. Valkyrie (V 5.11+) climbs the sunlit buttress to the right of the highest summit in this image. Photo: Brandon Thau In this month’s Prescription, an expert climber made two crucial errors in her rope ascension/top-rope solo system. She fortunately escaped with relatively minor injuries.This accident was featured in the 2024 Accidents in North American Climbing.Top-Rope Solo Fall | Device Jammed By SlingSequoia National Park, Angel Wings Valkyrie takes the spectacular red line shown above. Clark’s accident occurred on the slab at the bottom of the climb. Photo: Brandon Thau On October 8, 2023 Whitney Clark was ascending a fixed rope at the start of Valkyrie (17 pitches, 5.11+) when her single ascension device was jammed by a sling. She fell 30 feet to the ground.Clark wrote to ANAC:“We woke at around 6 a.m. and made our way to the fixed line from the day before. The days were short and we had many pitches to do. My partner, Luka Krajnc, went first, using a Grigri to jug and then transitioning to climbing. About 40 feet up, he clove-hitched the rope to a bolt. I then started jugging with a single Micro Traxion. Thirty feet up, I leaned back on the rope. My body weight wasn’t supported because the sling around my neck [part of the top-rope solo setup] got sucked into the device and caught in the teeth of the Traxion. The rope was sliding against the sling. I hadn’t tied a backup knot.”Clark attempted to wrap the rope around her leg. But her rope was new, thin, and slippery. She wrote, “I grabbed the rope and slowly started sliding down. Eventually the rope burn was too painful and I let go. I hit the ground, landed on my feet, and fell backward. I struck my lower back and then my head. I was wearing a helmet. Because the ground was angled, some of the force was dissipated, though I landed six inches from a large rock spike.“I never lost consciousness but was in a bit of shock. Luka rappelled down and did a spinal exam. He got me comfortable, and I sat there for a while. I had pain in my back and my left ankle. I used my inReach to call for a rescue while Luka retrieved our stuff. I started crawling and butt-scooting to where a heli could reach me. I would have loved to have self-rescued, but it’s a 16-mile hike out. It took about 2.5 hours of crawling to make it to a flat place. Four hours later, a helicopter airlifted me to the Visalia Level III trauma center.” Whitney Clark’s progress-capture device failed when the as-yet-unused retention sling got stuck in the device as she was ascending. It is common practice to use a sling and an elastic connection to hold the progress-capture device upright as one climbs along a fixed rope. Photo: Luka Krajnc The Prescription—Video AnalysisTop-rope soloing is becoming increasingly popular. In this video, Pete Takeda, Editor of Accidents in North American Climbing, and IFMGA/AMGA guide Jason Antin are back to provide an accident analysis and give you some quick tips on how to mitigate risk when top-rope soloing.Top-rope soloing is an integral part of modern climbing. Currently, only one device (the El Mudo) is designed and commercially available for top-rope (and lead) soloing. There are many ways to configure these systems and we’ve demonstrated one possible solution here. Watch prescription videos ANALYSISSolo top-roping allows a climber to self-belay when no partner is available, for a team to work on individual sections of a route without the need for a belayer, or for two climbers to move simultaneously, as in this situation. The errors Clark made were using only one device to safeguard her progress and not tying a backup knot.“I was jugging by pulling on the rope, syncing up the slack, and sitting back,” Clark said. “The route was meandering and the fixed line didn’t allow me to readily climb, so I decided to jug straight up the initial blank slab. The sling around my neck was going to hold the Traxion upright [allowing the rope to feed freely] once I started climbing. I haven’t done any top-rope soloing since the accident. I probably will at some point, but I will definitely use two devices. This was the first time I only used a single progress-capture device.” (Source: Whitney Clark.) Support Our Work—Join the ClubEach membership is critical to the AAC’s work: advocating for climbing access and natural landscapes, offering essential knowledge to the climbing community through our accident analysis and documentation of cutting edge climbing, and supporting our members with our rescue benefit, discounts, grants and more. Plus, get the new 2025 member tee! Learn more Sign Up for AAC Emails {"secureUrl":"https://americanalpineclub.squarespace.com","formSubmitButtonText":"Submit","formSubmissionMessage":{"html":"<p>Thank you!</p>"},"submissionVerticalAlignment":"","buttonAlignment":"","submissionMessageTextStyle":"","formName":"Feb Prescription 25","collectionId":"568c4a76c21b86066af1de22","submissionAnimation":"","captchaTheme":1,"formId":"67ab7fa93a4a867321fb0648","useLightbox":false,"firstFieldHighlightType":"","successRedirect":"","useFormsJs":true,"submissionTextAlignment":"","formFieldFormats":{"countries":[{"name":"Afghanistan","code":"AF","phoneCode":"+93"},{"name":"Åland Islands","code":"AX","phoneCode":"+358"},{"name":"Albania","code":"AL","phoneCode":"+355"},{"name":"Algeria","code":"DZ","phoneCode":"+213"},{"name":"American Samoa","code":"AS","phoneCode":"+1"},{"name":"Andorra","code":"AD","phoneCode":"+376"},{"name":"Angola","code":"AO","phoneCode":"+244"},{"name":"Anguilla","code":"AI","phoneCode":"+1"},{"name":"Antigua & Barbuda","code":"AG","phoneCode":"+1"},{"name":"Argentina","code":"AR","phoneCode":"+54"},{"name":"Armenia","code":"AM","phoneCode":"+374"},{"name":"Aruba","code":"AW","phoneCode":"+297"},{"name":"Ascension Island","code":"AC","phoneCode":"+247"},{"name":"Australia","code":"AU","phoneCode":"+61"},{"name":"Austria","code":"AT","phoneCode":"+43"},{"name":"Azerbaijan","code":"AZ","phoneCode":"+994"},{"name":"Bahamas","code":"BS","phoneCode":"+1"},{"name":"Bahrain","code":"BH","phoneCode":"+973"},{"name":"Bangladesh","code":"BD","phoneCode":"+880"},{"name":"Barbados","code":"BB","phoneCode":"+1"},{"name":"Belarus","code":"BY","phoneCode":"+375"},{"name":"Belgium","code":"BE","phoneCode":"+32"},{"name":"Belize","code":"BZ","phoneCode":"+501"},{"name":"Benin","code":"BJ","phoneCode":"+229"},{"name":"Bermuda","code":"BM","phoneCode":"+1"},{"name":"Bhutan","code":"BT","phoneCode":"+975"},{"name":"Bolivia","code":"BO","phoneCode":"+591"},{"name":"Bosnia & Herzegovina","code":"BA","phoneCode":"+387"},{"name":"Botswana","code":"BW","phoneCode":"+267"},{"name":"Brazil","code":"BR","phoneCode":"+55"},{"name":"British Indian Ocean Territory","code":"IO","phoneCode":"+246"},{"name":"British Virgin Islands","code":"VG","phoneCode":"+1"},{"name":"Brunei","code":"BN","phoneCode":"+673"},{"name":"Bulgaria","code":"BG","phoneCode":"+359"},{"name":"Burkina Faso","code":"BF","phoneCode":"+226"},{"name":"Burundi","code":"BI","phoneCode":"+257"},{"name":"Cambodia","code":"KH","phoneCode":"+855"},{"name":"Cameroon","code":"CM","phoneCode":"+237"},{"name":"Canada","code":"CA","phoneCode":"+1"},{"name":"Cape Verde","code":"CV","phoneCode":"+238"},{"name":"Caribbean Netherlands","code":"BQ","phoneCode":"+599"},{"name":"Cayman Islands","code":"KY","phoneCode":"+1"},{"name":"Central African Republic","code":"CF","phoneCode":"+236"},{"name":"Chad","code":"TD","phoneCode":"+235"},{"name":"Chile","code":"CL","phoneCode":"+56"},{"name":"China","code":"CN","phoneCode":"+86"},{"name":"Christmas Island","code":"CX","phoneCode":"+61"},{"name":"Cocos (Keeling) Islands","code":"CC","phoneCode":"+61"},{"name":"Colombia","code":"CO","phoneCode":"+57"},{"name":"Comoros","code":"KM","phoneCode":"+269"},{"name":"Congo - Brazzaville","code":"CG","phoneCode":"+24