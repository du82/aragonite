title = "The Prescription: Your Monthly Dose of Climbing Accidents — American Alpine Club"
description = '''
We take climbing accidents from our renowned yearly publication "Accidents 
in North American Climbing" and distill important climbing lessons from 
them, thanks to expert accident analysis. Learn more about belaying 
accidents, rappelling accidents, trad anchor accidents, and more —and what 
you can do to avoid your own climbing accident.'''
full_description = '''Stories Stories The Line The Prescription THE PRESCRIPTIONYOUR MONTHLY DOSE OF ACCIDENTS IN NORTH AMERICAN CLIMBINGNow you won’t have to wait all year for fresh stories and lessons about climbing accidents and near misses. The Prescription brings you monthly unpublished accident reports, tech tips, links to new online educational resources, and much more—all aimed at helping you become a safer climber. THE PRESCRIPTION—FEBRUARY 2025On October 8, 2024 Whitney Clark was ascending a fixed rope at the start of Valkyrie (17 pitches, 5.11+). Although an expert climber, she made two crucial errors in her rope ascension/top-rope solo system when her single ascension device was jammed by a sling. She fell 30 feet to the ground. She fortunately escaped with relatively minor injuries. read february prescription THE PRESCRIPTION—JANUARY 2025It’s bouldering season in Hueco Tanks, Texas. While most consider bouldering relatively safe, it is perhaps the most accident and injury plagued facet of climbing. This month we bring you an accident that took place on a famous John Sherman highball called See Spot Run. On January 22, 2024, Pete Korpics was attempting to climb a long-standing project called See Spot Run (V6). He was well aware of the risks involved and that it would require ample padding. During an attempt, he fell from roughly fifteen feet up, with quite a bit of force. Despite ample padding, the fall resulted in an ankle injury. Read january prescription THE PRESCRIPTION—DECEMBER 2024 Utah County Sheriff’s Search and Rescue was dispatched at 11:09 a.m. on December 26 to aid an ice climber who had fallen from the first pitch of Finger of Fate (3 pitches, WI4+) in Provo Canyon. The climber, Tim Thompson (29), was nearing the end of the first pitch when ice sheared from under his left foot. He wrote to ANAC that he was “pushed forward into my ice tools and my relaxed grip caused me to fall.” Thompson’s uppermost screw pulled out of the ice, causing him to fall a total of 50 feet. Read December Prescription THE PRESCRIPTION—NOVEMBER 2024 This November, we have an accident involving an alpine quickdraw. Disturbing as it may sound, we get periodical reports of quickdraws becoming unclipped from bolt hangers. In 2023 alone, three accidents were reported in which a quickdraw unclipped or snagged on a bolt hanger. The latter instances resulted in broken carabiners. “My climbing partner and I went sport climbing at Pilot Mountain State Park in March 2023… [While cruxing] I got partially over the bulge and needed to make one more move but couldn't find a good handhold. I ended up falling off. Instead of stopping, I hit the ground after falling 20 feet. Both feet landed on a flat rock step on the main hiking trail. My belayer took up enough slack so that the rope started to catch right as my feet hit. After lying on the ground, overcoming the initial shock and pain, I realized that the alpine quickdraw that I had clipped into the third bolt was still clipped to the rope,” Alec Gilmore writes in his ANAC report. read November Prescription THE PRESCRIPTION—OCTOBER 2024 Cams might not be as bomber as you think. .We are stoked to kick off our Prescription video series by unpacking some magical thinking around cams. This video series will give you greater detail and visual insight into the accidents analyzed in our monthly Prescription newsletters. Featuring Accidents in North American Climbing Editor Pete Takeda, and IFMGA/AMGA Mountain Guide Jason Antin, these bite-sized lessons will get you thinking about how this accident analysis applies to you and your climbing. For Rocktober we have two accidents that represent a larger trend we noticed in 2023. This trend involves: 1) Placing an inadequate number of protection pieces and 2) Poorly placed camming protection. Read October Prescription THE PRESCRIPTION—SEPTEMBER 2024 On August 5, a party of two started up Simple J Malarkey (3 pitches, 5.7). On the final pitch, Danny Gerhart called down to his belayer, informing them that he was going to take a deliberate fall.He then let go and fell around 12 feet before loading the rope. The belayer reported having enough time to take in two to four feet of slack before hearing a very loud “gunshot” as the rope exploded. The belayer never felt the falling climber load the belay, and tragically, Gerhart fell approximately 130 feet to the ground, passing away at the scene. Read September Prescription THE PRESCRIPTION—AUGUST 2024 The following report describes an accident in the Canadian Rockies that will be published in the upcoming 2024 Accidents in North American Climbing. While reviewing last year’s accidents, a particularly improbable incident stood out. Almost exactly a year ago, a climber fell, unroped, from the fourth-pitch belay anchor of a 15-pitch climb. After tumbling 35 meters, he came to rest on a ledge three pitches above the ground, having suffered only minor injuries. One might attribute this incident to a form of benign intervention, a guidance bordering on the divine. Or it might have been simple good luck. Read on. Read August Prescription THE PRESCRIPTION—JULY 2024 Summer has officially arrived and climbers are turning their attentions to northerly latitudes, higher elevations, and lofty peaks. This month we feature two accidents that took place last summer on Teewinot (12,330 feet) in Grand Teton National Park, Wyoming. While these accidents differ in immediate cause and final outcome, they share a common origin: the use of hiking-specific applications for selection, preparation, and route-finding, versus the use of climbing-specific resources. Read the July Prescription THE PRESCRIPTION—JUNE 2024 Around 12:40 p.m. on September 28, Larsen Tormey (28) was pinned under a large boulder while hiking out after an attempt on the Evolution Traverse (VI, 5.9). His climbing partner, Jacob Ireland (35), was able to free him after several hours, prior to the arrival of SAR. The accident took place five miles from the trailhead. Lars was hiking ahead of me. I was at the top of Lamarck Col when I heard someone yelling. I figured this was Lars, but I couldn’t spot him. As I headed toward the sound the cries grew louder, and I knew that an accident had occurred. When I was directly above his voice, I could hear clearly, “I’m stuck! There’s a rock on me! Please help!” Read the June Prescription THE PRESCRIPTION—APRIL 2024 The Denali climbing season is imminent. The peak’s high latitude, extreme altitude, and arctic climate present hazards that challenge even the most experienced climbers. Our April “Prescription” is a Denali National Park accident summary, accompanied by an altitude illness report from the peak’s most popular route. While mishaps involving crevasses, avalanches, and falls plague climbers every year, altitude illness is the most preventable cause of incidents on Denali. Read the April Prescription THE PRESCRIPTION—MARCH 2024 On February 24, 2021, Dawson Riley (21) and his friend (19) were enjoying a day out at Mt. Woodson. Riley, an experienced climber, had taken this friend climbing a few times before. Riley first led the 35-foot route Robbins Crack (5.10a) and attached a quad anchor sling to the bolts atop the large boulder. His friend then followed, with Riley belaying from above on a Grigri. Riley then adjusted the position of the anchor so that they could lower each other and climb Lie Detector (5.12a/b), another crack route (the analog to Robbins Crack) that shares the same bolt anchor. Read the March Prescription THE PRESCRIPTION—FEBRUARY 2024 The ice and mixed season is in full swing. While offering a dazzling range of sights, sounds, and textures, winter climbing arguably presents the highest risk to life and limb of any crag-oriented climbing genre. Ice is an ever-changing medium. The clothing and tools required deprive climbers of the accustomed “feel” for the climbing medium—so critical to fair-weather rock climbing. This month we have two accidents from 2023. Both involved collapsing ice formations. One had an injury-free ending. The other ended in tragedy. Read the February Prescription THE PRESCRIPTION—JANUARY 2024 On November 9, 2023, Gibson McGee (19) was bouldering on White Rastafarian, a V2 (often graded V3) highball that has been the scene of many accidents. He fell from near the top and struck the ground, shattering his L1 vertebra, the highest bone in the lower back. Though Mountain Project describes White Rastafarian as “one of JTree’s finest (problems),” the climb is 25 feet tall—more a short route instead of a boulder problem. After the midpoint crux, the climber is faced with a tricky mantel topout. Read the January Prescription THE PRESCRIPTION—DECEMBER 2023 On October 14, Yutung “Faye” Zhang (18) fell 90 feet from the anchors of Misty (5.10b/c) while cleaning this route at Sand Rock in northeastern Alabama. It was her second time climbing outdoors. At around 12 p.m., Zhang, a new climber and part of a larger group, took a final top-rope lap on the route. She cleaned the quickdraws and reached the two-bolt anchor. The anchor was equipped with two mussy hooks plus a single locking carabiner that had been placed by one of the other climbers to prevent the rope from unclipping from the mussys. Read the December Prescription THE PRESCRIPTION—NOVEMBER 2023 On February 24, 2023, Steve Sagin (58) and Jerry Cagle (70) were climbing Wily Javelina (6 pitches, 5.9, PG-13) on Table Dome in the remote Mendoza Canyon, southwest of Tucson. On pitch five, Sagin broke a hold and took a long leader fall. Cagle recounted the following in a report to ANAC: “We began planning for this climb with a check of the predicted weather for the day: pleasantly warm around midday with an occasional light breeze. Our spouses were informed of our plans. Read the November Prescription THE PRESCRIPTION—OCTOBER 2023 On March 14, 2023, my friend (the belayer) and I (Liu Yuezhang, 26) headed to Time Wave Zero (2,000’, III 5.12a or 5.11 A0) in El Potrero Chico (EPC) to check out the approach and prepare for a full attempt a few days later. Our plan was to try the moves of the first two pitches before returning to the ground. While following the second pitch (95’, 5.11b, nine bolts), I experienced a belay failure from above, hitting my right lower back, head, and both elbows as I fell. I was rescued by the EPC rescue team and local climbers. Miraculously, I was not seriously injured. Read the October Prescription THE PRESCRIPTION—SEPTEMBER 2023 At 6:30 p.m. on October 16, 2022, the New York State Department of Environmental Conservation (DEC) rangers received a call from two climbers who were stranded on Moss Cliff in Wilmington Notch within Adirondack State Park. The two climbers had topped out on a four-pitch trad climb called Hard Times (5.9+) and had completed their first double-rope rappel from the bolted rappel station at the top of the final pitch. When the climbers went to pull their ropes after the first rappel, the rope would not budge. After repeated attempts to pull the ropes down, the climbers considered themselves to be stranded and used a cell phone to contact rangers. Read the September Prescription THE PRESCRIPTION—AUGUST 2023On June 28, at 10:59 a.m., Yosemite Dispatch received a report of a 42-year-old male who had taken an approximately 50-foot fall on The Prow (V 5.8 C2) on Washington Column. The climber’s plan had been a multi-day, aid-solo ascent. On the second pitch, the climber fell, ripped rock protection, and struck a ledge. He recalled, “I felt the sensation of falling—it was so sudden and so fast. Then I remember hitting a ledge hard, bouncing, sliding. I remember hitting two more small ledges on the way down.” Read the August Prescription THE PRESCRIPTION—JULY 2023 On August 12, 2022, a party of two climbers left the Hind Hut to ascend the North Ridge of Mt. Assiniboine (AD 5.5). By late morning, they had reached one of the steeper upper steps at about 3,500 meters (11,482 feet). The pair had soloed everything up to this point and arrived several minutes apart. The first climber to arrive (Climber 1) assessed the next step and determined they would likely use a rope due to the steep angle and sloping nature of some of the holds. When Climber 2 arrived, the pair took a break and considered their options. Meanwhile, a separate party downclimbed the step. This party was unroped. Read the July Prescription THE PRESCRIPTION—JUNE 2023 On July 6, 2022, Alex Satonik and Peter Haley climbed the classic East Ridge of Wolf's Head (10 pitches, 5.6). The climb was uneventful. Satonik wrote to the ANAC that, “We arrived at the summit around 11 a.m. We had a brief rest and then started the standard descent route." The way down started smoothly; the first two rappels were easy to find, and the cordage looked good on both. Upon arriving at the third rappel, it was difficult to see the entire cordage on the anchor. This was the first sign of danger. Immediately after weighting the anchor, Alex fell 50 feet. Read the june Prescription THE PRESCRIPTION—APRIL 2023On September 3, 2022, Kyra Harames (female, 24) was climbing with a group of friends at The Kitchen in Rock Canyon. After setting up a top-rope, she fell to the ground while rappelling from the two-bolt anchor. While this story has a happy ending, we cannot be absolutely certain of the accident’s cause. However, one theory seems to check all the boxes. Read the April Prescription THE PRESCRIPTION—MARCH 2023 On July 10, 2022, Will Toor (60) and his wife, Mariella Colvin (59), fell down the East Couloir (II, AI2 or 65°snow) on the north face of Flattop Mountain. At the top, a cornice collapsed, causing Toor to fall. The dislodged debris struck Colvin and they both tumbled 900 feet. Colvin left her immobilized husband to try to get help, bushwhacking nearly two miles despite having suffered broken ribs, a broken sternum, a broken wrist, and three fractured vertebrae. While she was gone, two climbers on an adjacent peak came over to assist Toor and summoned a National Park Service rescue. Toor was helicoptered out with a broken femur. Colvin was evacuated the next day. READ THE MARCH PRESCRIPTION THE PRESCRIPTION—FEBRUARY 2023 On June 7, 2021, Ryan Dozier (37) was top-rope soloing at Snowshed Wall at Donner Summit, near Lake Tahoe. Because of windy conditions, he decided to not use his normal back-up system in addition to his Micro Traction. Near the top, he fell, plummeting 50 feet before his system caught his fall. He landed 3 feet above the ground. He wasn’t wearing a helmet. Read the February Prescription THE PRESCRIPTION — JANUARY 2023 This month we have an indoor gym accident of a type that sadly occurs with some frequency. This accident has a happy ending and a powerful lesson. On December 14, 2022, Adam Herzog (43) miraculously survived a fall in which he suffered severe injuries after failing to clip into an auto belay in a climbing gym. Upon finishing the climb, he '''
