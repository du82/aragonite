full_description = "Our Work Advocacy Publications Lodging Events Grants Climbing Grief Fund Library GRANTSThe AAC has a storied legacy of funding climbing, conservation, and research projects in support of our mission. Through the years, AAC grants have been responsible for encouraging thousands of climbers to dream big and push their limits; for establishing hundreds of cutting-edge new routes of remote and major peaks around the world; for improving infrastructure at climbing areas across the country; and funding scientific research expeditions that have contributed valuable information to our understanding of the worlds mountain ecosystems.Today, with up to $100,000 in annual grant awards, the Club continues to support these endeavors and is proud to stand behind the individuals and their projects which seek the betterment of the climbing community and climbing landscapes. OPEN GRANTSJones Backcountry Adventure Grant & Live Like Liz AwardZack Martin Breaking Barriers Grant EXPLORE THE GRANTS Featured CLIMBING AND ADVENTURE GRANTS CONSERVATION AND RESEARCH GRANTS HUMANITARIAN GRANTS Climbing Grants box photo: AAC member Kalli Schumacher Explore Stories from Past Recipients News Apr 23, 2024 An Ultraneering Challenge in the Cordillera Blanca: A Story From the Live Your Dream Grant Apr 23, 2024 Read More → Apr 23, 2024 Apr 4, 2024 Immaterial Climbing: A Story From the Catalyst Grant Apr 4, 2024 Read More → Apr 4, 2024 Dec 13, 2023 New Route on White Sapphire Dec 13, 2023 Read More → Dec 13, 2023 Nov 20, 2023 Four New Routes on Baffin Island, Canada Nov 20, 2023 Read More → Nov 20, 2023 Oct 6, 2022 An Alaskan Dream: A Story from the Mountaineering Fellowship Fund Grant Oct 6, 2022 Read More → Oct 6, 2022 Mar 15, 2022 Despite the Obstacles: A Story from the Live Your Dream Grant Mar 15, 2022 Read More → Mar 15, 2022 Feb 15, 2022 Off Route but Overjoyed: A Story from the Live Your Dream Grant Feb 15, 2022 Read More → Feb 15, 2022 Feb 1, 2022 A Trip To Remember: A Stor