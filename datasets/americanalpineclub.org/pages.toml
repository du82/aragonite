full_description = 'Jobs Jobs Internships AAC Jobs Current OpeningsGrand Teton Climbers’ Ranch CrewGrand Teton Climbers’ Ranch Facilities & Grounds ManagerGrand Teton Climbers’ Ranch Operations & Guest Services ManagerNRG Community & Guest Services ManagerNRG Facilities & Grounds ManagerSam Pryor Shawangunk Gateway Campground, Campground AssistantRumney Campground Co-Managers All who love the AAC mission are encouraged to apply, including people of color and Black, Indigenous, transgender and non-binary people.The AAC is an equal opportunity employer. Your gender, religion, sex life, skin color, first language, and size and ability of your body do not factor into employment decisions here. Neither do your friends in high places. If you love our mission and are good at what you do, come as you are. AAC Staff in the Wild <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1671661184033-06NJVW6QMRVN3I0SUNQX/IMG_9096.jpg" alt="IMG_9096.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1518196890186-P0FISJGS4G0YZXEIYINN/Indian+Creek_PC_Whitney+Bradberry.jpg" alt="Indian Creek_PC_Whitney Bradberry.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1671661083837-MTY8KG50PY6FCWT5DXDR/IMG_5704.jpg" alt="IMG_5704.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1671661817059-NUOCY1HWLYBYUGAQ9Z4L/0F2A3349.jpg" alt="0F2A3349.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1518196753039-1WX3IUWC4I6WG4811Y0G/P1020446.jpg" alt="P1020446.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1671661688630-M1XEPQOEF6N9TAW2P0CM/IMG_7080.jpg" alt="IMG_7080.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1671661103832-MKYU7ZGTWWJ8Z1KQH22G/IMG_8901.jpg" alt="IMG_8901.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1