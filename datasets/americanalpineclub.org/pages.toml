["https://americanalpineclub.org/aac-events"]
title = "Events — American Alpine Club"
description = "The next United in Yosemite will be held in the Spring of 2025, stay tuned for exact dates! United in Yosemite is not just a climbing festival. It is a celebration of the growing affinity spaces in climbing across the globe. It is a place to connect to climbers of all genders, sexual orientations, abilities, and cultural/ethnic backgrounds."
full_description = "Our Work Advocacy Publications Lodging Events Grants Climbing Grief Fund Library Events Featured United in Yosemite The next United in Yosemite will be held in the Spring of 2025, stay tuned for exact dates! United in Yosemite is not just a climbing festival. It is a celebration of the growing affinity spaces in climbing across the globe. It is a place to connect to climbers of all genders, sexual orientations, abilities, and cultural/ethnic backgrounds. Annual Gala Coming to Denver on October 18, 2025: We are reimagining the Gala to be a more intimate event! The Gala has always been a chance for AAC members from across the country to come together—for old friends to reminisce and new friendships to be forged. In 2025, we’re evolving the event to reflect this spirit, crafting more opportunities for one-on-one connection. Craggin' Classics As of October 2024, the AAC no longer hosts the Craggin’ Classic Series. Across the 13 years of this series, we estimate that we've served over 30,000 attendees and nearly 8,000 clinic participants. Those same participants have given back to the local crags that host these events with well over 10,000 stewardship hours. Hueco Rock Rodeo As of October 2024, the AAC is no longer hosting the Hueco Rock Rodeo. We’re thrilled with the impact this event has had over the years and the ways they connected the climbing community. The AAC hosted the Hueco Rock Rodeo event for over a decade, and we're proud to have played a role in responsibly introducing thousands of climbers from around the globe to this amazing landscape and world-class bouldering destination."
