full_description = '''Our Work Advocacy Publications Lodging Events Grants Climbing Grief Fund Library AAC LibraryThe Henry S. Hall Jr. American Alpine Club Library, located at AAC headquarters in Golden, Colorado, houses one of the world’s finest collections of mountain-related artifacts, archives, rare books, maps, and media. A climbing bibliophile’s dream, the library contains more than 50,000 books and all the information you could ever want on mountain history, mountain culture, climbing routes, and more. For research questions, please email us at [email protected] with details about your topic. { "marqueeItems": [ { "text": "Researchers: please review our policies by clicking this text box •" } ], "linkTo": "https://americanalpineclub.org/policies-and-fee", "waveFrequency": 4, "waveIntensity": 0, "animationDirection": "left", "animationSpeed": 1.0, "textStyle": "heading-1", "textSize": { "unit": "rem", "value": 1.5 }, "itemSpacing": { "unit": "em", "value": 0.5 }, "blockId": "yui_3_17_2_1_1651851126396_10189", "estimatedDimensions": { "estimatedColumnSpanDesktop": 12, "sectionColumnsDesktop": 12, "estimatedColumnSpanMobile": 12, "sectionColumnsMobile": 12 }, "containerStyles": { "backgroundEnabled": false, "borderRadii": { "topLeft": { "unit": "px", "value": 0.0 }, "topRight": { "unit": "px", "value": 0.0 }, "bottomLeft": { "unit": "px", "value": 0.0 }, "bottomRight": { "unit": "px", "value": 0.0 } }, "padding": { "top": { "unit": "%", "value": 3.0 }, "right": { "unit": "%", "value": 0.0 }, "bottom": { "unit": "%", "value": 3.0 }, "left": { "unit": "%", "value": 0.0 } }, "stretchedToFill": false, "backgroundColor": { "type": "THEME_COLOR" } }, "featureFlags": { "useCLDRMoneyFormat": true } } Researchers: please review our policies by clicking this text box • Researchers: please review our policies by clicking this text box • Researchers: please review our policies by clicking this text box • Library Hours Beginning September 21st, the AAC Library will be closed for inventory, and preparing to move to a new location. View Library Hours Mountaineering Museum Hours: Mon-Fri | 10:00am - 4:00pmPlease check the museum website for closure. mountaineeringmuseum.org Museum Hours Library Address 710 Tenth Street, Suite 15Golden, CO 80401(303) 384-0112For any inquiries, please email [email protected] or call 303-384-0112. Search the catalog in the box below! Featured Find resource guides and guidebooks Use our catalog to find books, maps, films and archives collections. Access photos, videos, documents—many of them from the AAC's archives—that are now available online for the first time ever. Learn more about the library, its hours and policies. Frequently asked questions about the AAC library Find out how to support the library or donate Updates from your Library News Sep 1, 2023 Eleanor Davis, Humble Mountaineer Sep 1, 2023 Sep 1, 2023 Aug 27, 2020 Self-Powered Adventure 100 Years Ago Aug 27, 2020 An original self-powered adventurer, Albert Ellingwood, walked hundreds of miles, resoling his boots in each town, and climbing difficult routes when he reached each destination. He did this wearing hobnailed boots, low-tech clothing, and carrying a heavy pack. Aug 27, 2020 Mar 17, 2020 The Greatest Benefit to Membership Mar 17, 2020 Mar 17, 2020 Mar 1, 2019 Finding Women in the Collections of the American Alpine Club Library Mar 1, 2019 Does the AAC Library have books, artifacts and archives about women? Yes! Read more to find out what we have. Mar 1, 2019 Jan 11, 2019 Trip to the Library, January 4th 2019 Jan 11, 2019 Jan 11, 2019 Jan 3, 2019 Mountain Dont's Jan 3, 2019 In 1925 Albert H. MacCarthy had just led a successful first ascent of Mount Logan in Canada, composed of climbers from Canada, Britain and the United States. MacCarthy, an American and member of the American Alpine Club, wrote a number of reports and summaries of the expedition, including this list of Mountain “Dont’s.” Jan 3, 2019 Dec 17, 2018 Pitons Dec 17, 2018 Dec 