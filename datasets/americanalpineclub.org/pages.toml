title = "Rescue Benefit — American Alpine Club"
description = "The American Alpine Club is a 501(c)(3) charitable organization. Our vision is a united community of competent climbers and healthy climbing landscapes."
full_description = '''Membership Learn More Rescue Benefit Member Benefits Renew AAC Member Rescue Benefitpowered by Redpoint Travel ProtectionIf you are an active AAC member looking to initiate a rescue, please contact Redpoint Travel Protection at: +1 628-251-1510 $132,745 in rescue and medical claims paid out to members in 2024 by Redpoint. How do I use it? Where does it work? Member TEstimonials FAQs Terms and Conditions Inreach Instructions Which membership is right for you? *Student, military, and family membership discounts are available for the Partner membership level.*Great Ranges members receive Advocate-level rescue and medical coverage.Current AAC members can easily upgrade to the Leader membership to receive $300,000 in coverage—your existing membership will be prorated accordingly. Join Now & GET COVERED UPGRADE YOUR MEMBERSHIP How Does it Work? View fullsize Where Does it Work? View fullsize Member Testimonials "After a long negotiation with my primary insurance, the AAC [medical] coverage kicked in and was able to cover the rest of my out-of-pocket costs with minimal hassle. Such an awesome benefit."Bryan R., member since 2014"I had a significant rescue experience with Redpoint, including an evac from base camp on the south side of Mt. Everest. I was there as part of an IMG climb and we were all very impressed with Redpoint's on-the-spot availability and rescue capabilities. What more could one want from such a service."David G., member since 2019"The AAC Member Rescue Benefit is as crucial as having the right climbing gear. In June 2021, I had a bad fall that broke my pelvis and left me stranded in the Lost Creek Wilderness. The next day, I rolled out of the hospital with a $3,000 bill from my insurance deductible. Recovery was tough, but getting reimbursed for medical expenses through RedPoint was a breeze. The AAC helped me every step of the way, making sure I got my money back quickly and easily. Now, I always climb with AAC coverage and encourage my friends to do the same." Matthew P., member since 2018"AAC rescue benefits are a must. Dealing with accident recovery is difficult enough, but knowing there's financial assistance in case of an accident provides additional peace of mind. I found this out first hand after a fall and ambulance ride to the ER. I'm happy to say that working with the AAC and RedPoint to help cover my outstanding ambulance and ER costs was genuinely the easiest health care transaction I've ever had. Within days, RedPoint mailed me a check that covered the outstanding portion of my bills."Jarod S., member since 2006"In the spring of 2023, I took a tragic bouldering fall in Moab Utah trying the legendary Dean Potter line Zen Garden. Unfortunately, I broke my leg and tore most of the ligaments in my knee. That day was then filled with lots of time at the emergency room. Fortunately, my accident coverage through the American Alpine club helped cover my deductible and co-pay for all the medical bills from the day of the accident! It made a horrible situation just a little bit more manageable.”Nic R., member since 2017 Member Rescue BenefitClimbing can be a risky pursuit, but one worth the price of admission. With the newly enhanced rescue and medical expense coverage included in membership, you can tie in a little easier knowing the Club has got your back. If disaster strikes, this benefit can rescue you from the crag, get you to the hospital, and even help pay your direct medical expenses once you’re there.AAC Partner level members receive:$7,500 in rescue services: Designed to get you from the site of an accident away from home to the nearest appropriate medical facility and aimed at covering rescue, ambulance, and other transportation expenses along the way up to $7,500. Please see the FAQs below for exclusions and limitations.$5,000 in medical expense coverage: That's right; once you're at the hospital, your AAC benefit may reimburse up to $5,000 in medical expenses per incident (subject to conditions to be found in the FAQ and coverage description), and up to $10,000 per year. It’s important to note that you do not need to be rescued by Redpoint Travel Protection for your medical expense coverage to apply to an accident away from home. Medical reimbursement applies only for medical expenses incurred which are necessary for emergency stabilization due to a specific emergency incident. This program does not apply to continued care after a member is stabilized. Medical expenses must be necessary, reasonable, and customary charges determined solely by Redpoint. Please see the FAQs below for exclusions and limitations.Rescue expense reimbursement process: Let’s make sure you're not left holding the bill because you were unable to call Redpoint to arrange for a rescue. To ensure a seamless coverage experience and a well-coordinated rescue, it’s always best for you to coordinate with Redpoint during a climbing accident. However, if you are unable to contact Redpoint due to your medical condition or circumstances, you're now able to submit a request for reimbursement of up to $7,500 in rescue expenses after an eligible incident. Please see FAQ’s below for exclusions and limitations. Upgrade for $300k in coverageProtect yourself, and your wallet, with $300,000 in medical evacuation coverage—nearly guaranteeing that no matter where your accident takes place, your expenses will be taken care of.When you sign up for the Leader ($250/year) AAC membership, you’ll receive coverage for up to $300,000 in medical transport to your home country hospital of choice, in addition to the $5,000 in medical expense coverage. Current AAC members can easily upgrade to the Leader membership level—your existing membership will be prorated accordingly.Read our Rescue Benefit FAQ’s GET COVERED NOW UPGRADE MY MEMBERSHIP Terms & Conditions Rescue Benefit Terms & Conditions Medical Expense Terms & Conditions Hear One Member’s Accident and Rescue Benefit Story: Rescue and Medical Benefit FAQs [ Open All | Close All ] Q: How do I initiate a rescue? A: To initiate a rescue, contact Redpoint Travel Protection at +1 628-251-1510. Rescue services are intended to help you in the event of an accident while climbing or during other backcountry activities while away from home. Please contact Redpoint directly for the best service experience. If you are unable to contact Redpoint at the time of emergency due to unconsciousness, lack of communication capability, or other extenuating circumstances, you may request Redpoint retroactively pay for rescue services. Please visit redpointtravelprotection.com/contact/ to submit a reimbursement request. Learn more about the reimbursement request process below. Q: For what activities and where does the rescue benefit work? A: This coverage applies to any outdoor activity, other than flying or piloting or acting as the crew of any aircraft. The coverage applies anywhere in the world, including the domestic U.S. The only exclusions are above the Arctic Circle parallel north or below the 60th parallel south, unless your polar application has been approved and you have paid for the polar upgrade through Ripcord. Visit redpointtravelprotection.com/partner/aac to learn more about Ripcord insurance upgrades. AAC Members receive 10% off all purchases. Q: What is my policy number? A: There is no policy number for this coverage. Redpoint has access to the AAC member database to verify your status as an active member. To submit a claim for coverage, please visit: redpointtravelprotection.com/contact/. You can also access a proof of membership coverage letter inside of your member profile at profile.americanalpineclub.org Q: How does the medical expense coverage work? A: If you incur medical expenses as a result of a climbing accident while away from home, you are eligible for up to $5,000 in medical expense reimbursement. Upon receipt of any medical expenses relating to your climbing accident, please visit redpointtravelprotection.com/contact/ to submit for coverage. You must be away from your primary residence to be eligible. The medical expense benefit is designed to assist with climbing and backcountry activity accidents while away from your home. Reimbursement applies only for medical expenses incurred which are necessary for emergency stabilization due to a specific emergency incident. This coverage does not apply to continued care after member is stabilized. It is not intended to replace your health insurance policy. Please see below for exclusions and limitations. Q: How does the reimbursement process work? A: Redpoint’s rescue services are designed to provide services at the time of the emergency. For proper coordination during your rescue, and to ensure your rescue and medical expense coverage results in as seamless and easy of an experience as possible, it's important that you contact Redpoint to arrange your rescue. Members should only seek reimbursement of rescue services after the medical event if their medical condition or circumstance prevented them from contacting Redpoint at the time of the emergency. To start a claim, download and fill out the paperwork found in your member profile under Benefits > Rescue. When you submit for a reimbursement from Redpoint, Redpoint will, in their sole discretion, assess eligibility, medical need, and the amount for which they would have been able to execute the rescue had they been contacted. If approved, Redpoint may reimburse you for that amount up to $7,500. For example, say you did not contact Redpoint and incurred $5,000 in rescue and transportation costs. However, upon evaluation, Redpoint determines that they could have coordinated your rescue through their global network for a cost of $3,000 had they been contacted at the time of the incident. You would only be eligible for a $3,000 reimbursement based on Redpoint's evaluation. Payment for rescue services after the fact is not guaranteed, and Redpoint services are not insurance. Q: When would I be eligible for these benefits? A: Redpoint’s rescue and medical expense benefits are designed specifically for AAC members who experience a climbing or backcountry activity accident while away from home. These benefits do not replace members’ health insurance policies and are not designed for accidents at home, driving accidents, work accidents, chronic illnesses, dental treatments, or other non-climbing type medical needs. Q: How does Redpoint know if I’m an active member? A: Redpoint has access to the AAC membership database via API to determine whether you are an active AAC member, when you joined the Club, and what your contact information is. We do not share any unnecessary information with Redpoint, and they are only able to look up the information of members who request rescue services, rescue reimbursement, or medical expense coverage. Your membership status is verified using your full name and email address. Contacting Redpoint via Garmin inReach Devices Step 1. From the Garmin Explore portal online, add Redpoint Travel Protection as an emergency contact with the number +1 415-481-0600 and the email [email protected] (if available).Step 2. Add a preset emergency message that includes your name and AAC membership email. Step 3. Sync your Garmin device.Step 4. Contact Redpoint at the number above via a phone to request a test of your Garmin device. Additional Insurance As an active AAC member, you’ll have access to discounted travel insurance and rescue upgrades through AAC rescue partner Redpoint Travel Protection.Redpoint’s Ripcord Travel ProtectionRedpoint’s Ripcord Rescue Travel Protection program is the most comprehensive coverage plan available. For climbers and non-climbers alike, Ripcord’s dedicated team provides a full suite of travel protection services from travel assistance, to rescue and evacuation services, to comprehensive travel insurance, and more.AAC Members receive a 10% discount on their evacuation membership when they purchase further Ripcord travel programs—including comprehensive travel insurance for trip interruption/cancellation, baggage loss, search services, security evacuations, polar travel upgrades, and more. Visit redpointtravelprotection.com/partner/aac to upgrade your rescue coverage and receive a 10% discount on Ripcord Rescue Travel Insurance. Join the Club Learn more ABOUT AAC MEMBERSHIP'''
