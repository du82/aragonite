title = "AAC Membership — American Alpine Club"
description = "The American Alpine Club is a 501(c)(3) charitable organization. Our vision is a united community of competent climbers and healthy climbing landscapes."
full_description = '''Membership Learn More Rescue Benefit Member Benefits Renew El Capitan, Yosemite National Park, California. Photo by AAC member Calder Davey. American Alpine Club MembershipEach membership is critical to the AAC’s work: advocating for climbing access and natural landscapes, offering essential knowledge to the climbing community through our accident analysis and documentation of cutting edge climbing, and supporting our members with our rescue benefit, discounts, grants and more. Join the Club today, starting at only $45/year, and support the AAC in providing these critical resources for yourself and fellow members. United We Climb. JOIN TODAY UPGRADE YOUR MEMBERSHIP Which membership is right for you? *Student, military, and family membership discounts are available for the Partner membership level. JOIN NOW UPGRADE YOUR MEMBERSHIP Photo by Foster Denney. Free T-shirt With MembershipMembership levels: All membersSwag the crag. Rep the Club that reps you! Show pride in being a part of the largest community of climbers in the country with this limited edition AAC t-shirt, free with any Club membership. The t-shirt is made of a super soft tri-blend material (50% recycled polyester/38% cotton/12% rayon). Our 2025 member tee features artwork from Breann Bassler, an artist, climber, and high-liner based in Boulder, CO. JOIN NOW Member Rescue BenefitMembership levels: Partner, Leader, and AdvocateReady to send? Do your safety checks! In the AAC community, safety is paramount. Our rescue and medical expense coverage, powered by Redpoint Travel Protection, is designed with climbers in mind, and covers climbing and many other outdoor activities even when your insurance doesn’t. If disaster strikes, this benefit can rescue you from the crag, get you to the hospital, and even pay your direct medical expenses once you’re there. Climbers love adventure, but not being covered in the case of an emergency is one risk you shouldn’t have to take! It is only through the collective buying power of our member base that this benefit is available to climbers like you. Rescue Benefit DetailsClick below to expand details on each coverage item. [ Open All | Close All ] • $7,500 rescue benefit: Designed to get you from the site of an accident away from home to the nearest appropriate medical facility and aimed at covering rescue, ambulance, and other transportation expenses along the way up to $7,500. Please see rescue FAQ’s for exclusions and limitations. • $5,000 in medical expense coverage: That's right; once you're at the hospital, your AAC benefit may reimburse up to $5,000 in medical expenses per incident (subject to conditions to be found in the FAQ and coverage description), and up to $10,000 per year. It’s important to note that you do not need to be rescued by Redpoint Travel Protection for your medical expense coverage to apply to an accident away from home. Medical reimbursement applies only for medical expenses incurred which are necessary for emergency stabilization due to a specific emergency incident. This program does not apply to continued care after member is stabilized. Medical expenses must be necessary, reasonable, and customary for coverage to apply. Please see rescue FAQ’s for exclusions and limitations. • Rescue expense reimbursement process: Rescue expense reimbursement process: Let’s make sure you're not left holding the bill because you were unable to call Redpoint to arrange for a rescue. To ensure a seamless coverage experience and a well-coordinated rescue, it’s always best for you to coordinate with Redpoint during a climbing accident. However, if you are unable to contact Redpoint due to your medical condition or circumstances, you're now able to submit a request for reimbursement of up to $7,500 in rescue expenses after an eligible incident. Please see rescue FAQ’s for exclusions and limitations. • Upgrade for $300K rescue benefit: Protect yourself, and your wallet, with $300,000 in medical evacuation coverage—nearly guaranteeing that no matter where your accident takes place, you’re expenses will be taken care of. When you sign up for the Leader ($250/year) AAC membership, you’ll receive coverage for up to $300,000 in medical transport to your home country hospital of choice. Current AAC members can easily upgrade to the Leader membership level—your existing membership will be prorated accordingly. Please see our rescue page for exclusions and limitations. GET COVERED TODAY UPGRADE YOUR MEMBERSHIp Learn more ABOUT RESCUE Climbing BooksAccidents + American Alpine Journal PublicationsMembership levels: Partner, Leader, and Advocate. Both books are delivered in the fall to all members who opt to receive them. Essential knowledge for safety and inspiration. Club members enjoy printed or digital annual editions of two of climbing’s most historic and treasured publications: Accidents in North American Climbing and The American Alpine Journal. These books capture in-depth accident analysis and cutting edge ascents, respectively. You can’t find such robust reporting on climbing’s cutting edge, or such knowledgeable and comprehensive accident analysis, anywhere else in the world. When you become a member you help make these books possible, ultimately fueling essential climbing knowledge and safer climbers everywhere. The American Alpine Journal, published since 1929, documents mountain exploration and the year’s most significant ascents through first-person reports and photos—an essential historical record and a feast of inspiration. Learn more ABOUT THE AAJ Accidents in North American Climbing details the most noteworthy climbing and skiing accidents each year. Climbers, rangers, rescue professionals, and editors analyze what went wrong, so you can learn from others’ mistakes. Learn more ABOUT ANAC DiscountsMembership levels: All members, discounts vary by membership level. Supporter level members do not receive discounts at AAC lodging facilities.With our gear discounts you can pursue the sickest lines with the shiniest gear…and not break the bank. AAC members get deep discounts from 300+ outdoor brands, as well as savings at AAC lodging facilities, partner climbing gyms, and guide services across the country. Rocky Talkie - 20% offFriction Labs - 20% offSterling Ropes - 15% offBig Agnes - up to 40% offAsana - 25% offCotopaxi - up to 40% off Patagonia - 20% offRab - 20% offMountain Hardwear - 20% offBlack Diamond - 20% offOutdoor Research - up to 60% off OutletPrana - up to 50% offKAVU - 40% off JOIN THE CLUB VIEW ALL DISCOUNTS <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1717106848193-Y1WXP1VNIKQCL8SO4RLW/AMC.Katahdin29.013.jpeg" alt="AMC.Katahdin29.013.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1717106848132-AKW9JATCUBCNIALCG1ZO/AJG.B1A05.001.jpg" alt="AJG.B1A05.001.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1717107093982-C21XPTO0BL5KW3279B4S/AJG.B1A08.036+copy+2.jpg" alt="AJG.B1A08.036 copy 2.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1717107112428-4QDAOHMH3EZTTPLBRK22/Jensen+film+strip.jpeg" alt="Jensen film strip.jpeg" /> #block-yui_3_17_2_1_1717022571896_465530 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1717022571896_465530 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } American Alpine Club Library & ArchivesMembership levels: All membersFor climbing bibliophiles. The Club has one of the most extensive climbing libraries in the world, and many artifacts from climbing history that will make your jaw drop. The library is housed in Golden, CO, but we’ll ship you whatever you want to read, for free! Use the Guidebook Finder to check out a guidebook for your next climbing trip, or search the catalog for a good climbing book or video. Having a hard time finding beta for your research project, the new FA you’re dreaming up, or next trip? Our library staff will help you with your research! JOIN THE CLUB GrantsMembership levels: All membersFund your next climbing trip. The Club has a storied legacy of funding climbing-related projects—from expeditions to research—in support of our mission. With more than $175,000 in annual awards, you don’t have to be a pro to get your climbing dream funded. AAC grants are for climbers of all levels, from the first-timers heading outside, to climbers facing unique barriers to access and inclusion because of their identity, to experienced climbers putting up first ascents in the greater ranges. Scientific ResearchAids scientific endeavors contributing knowledge to our understanding of our climbing and mountain environments, global climber impacts, and sustainability. Live Your DreamSupports every-day adventurers looking to take their abilities to the next level, regardless of age, experience level, or discipline. Over $50k awarded each year to climbers like you!Cutting Edge GrantThe Cutting Edge grant supports advanced, seasoned climbers undertaking high-level climbing and mountaineering objectives. Join the Club VIEW ALL AAC GRANTS VIEW ALL MEMBER BENEFITS'''
