["https://americanalpineclub.org/benefits"]
title = "Member Benefits — American Alpine Club"
description = "The American Alpine Club is a 501(c)(3) charitable organization. Our vision is a united community of competent climbers and healthy climbing landscapes."
full_description = "Membership Learn More Rescue Benefit Member Benefits Renew MEMBER BENEFITSSave more than the Cost of your Membership each year.Gear. Clothing. Camping. Gym memberships. When you love the outdoors, expenses and logistics can really rack up. Here at the AAC, we know that every dollar spent on equipment, guidebooks, and insurance is one less dollar for your next big trip. Joining the AAC gives you access to discounts so you can spend more time and money doing what you love, all while supporting American climbing and making a difference in your local community. On top of your national discounts, you get deals at hundreds of gear shops, climbing gyms, guide services, and lodging facilities across the country. Not to mention discounted or free access to AAC events. Translation: free swag, new friends, good beer. AAC members receive rescue benefits ranging from $7,500 to $300,000 and $5,000 in medical expense coverage depending on membership level. AAC members get discounts on over 300 brands, including heavy-hitters like Patagonia, Backcountry.com, and Outdoor Research. Access your discounts at AAC lodging facilities and dozens of other locations in the AAC lodging network. Supporter level members do not receive discounts at AAC lodging facilities. The American Alpine Journal and Accidents in North American Climbing are included as part of Partner, Leader, and Advocate memberships each fall. Each year, the AAC gives over $100,000 toward climbing, conservation, and research grants to help you realize your climbing dreams and protect the places we love. Get discounts on subscriptions to Alpinist, Backcountry, & The Climbing Zine The AAC partners with gyms across the country to offer discounts at climbing gyms. AAC members have discounts on guide services across the country. As a climber, finding a decent insurance package can be a challenge. The AAC has partnered with some incredible companies to provide insurance packages that are actually designed for climbers. The Library, located in Golden, CO, provides you with all the information you could ever want on mountain culture and climbing routes. Heading on a roadtrip? Members can rent up to 10 books and five videos at a time. Renew JOIN THE CLUB"
