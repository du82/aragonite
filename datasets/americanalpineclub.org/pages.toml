full_description = "Dougald MacDonald February 27, 2025 Climb The Line: News From the Cascades to the Karakoram Dougald MacDonald February 27, 2025 Climb Binocular view of the crux fourth pitch of Borrowed Time on the west face of Sloan Peak. Photo: Michael Telstad. SLOAN PEAK, BORROWED TIMEThe west face of Sloan Peak, about 20 kilometers southwest of Glacier Peak in Washington’s North Cascades, has seen a flurry of winter climbing in the past five years. But one obvious plum remained: a direct route up the center of the face, with an intimidating crux pitch leading past steep rock to a hanging dagger. In January, Northwest climbers Justin Sackett and Michael Telstad picked that plum, climbing nearly 2,000 feet up the west face in a long day. We’re sharing Telstad’s report for AAJ 2025 here.The west face of Sloan Peak (7,835’) has been at the forefront of my mind for about as long as I’ve been winter climbing. Despite numerous attempts, the main face was unclimbed to the summit in winter until 2022, with the completion of Superalpine (IV WI3/4, Legallo-Roy). In 2023, the Merrill-Minton (a.k.a. The Sloan Slither, 1,600’, IV WI4+) climbed partway up the center of the face, then moved rightward to join Superalpine. A previous winter line on Sloan Peak, Full Moon Fever (IV AI4 R 5.8, Downey-Hinkley-Hogan, 2011), started on the west face then angled up the northern shoulder.Directly above the point where the Merrill-Minton cuts right to easier ground, a large hanging dagger is guarded by gently overhanging, compact gneiss. Known as one of the biggest unpicked plums in the North Cascades, the direct line past the dagger was going to get climbed sooner or later—it was just a question of by whom and in what style. When a perfect weather window arrived in the forecast, I convinced Justin Sackett to drive up from Portland for an attempt. The west face of Sloan Peak showing the line of Borrowed Time, climbed in January 2025. The climbers followed the Merrill-Minton Route (2023) up to the middle of the big rock band, then continued straight up where the Merrill-Minton veered right. Photo: John Scurlock. Early on January 19, 2025, we stepped away from the car and into the rainforest. We reached the base of the route at first light. Following the Merrill-Minton for the first three pitches, we encountered climbing up to WI5 R—a far cry from the moderate ice reported on the first ascent. Below the dagger, we took a short break and got ready for an adventure. I’d chosen to leave the bolt kit behind. This route deserved an honest attempt on natural gear before being sieged. No bolts on this mixed pitch: Michael Telstad zigzags up overhanging gneiss on the fourth pitch of Borrowed Time, the M7 crux of the route. Photo: Justin Sackett. After traversing back and forth a few times, I chose my line to the ice and started up. The rock on this portion of the wall is highly featured but compact and fractured. Just about every seam that might take gear was packed full of frozen moss; finding decent protection was a slow, agonizing process. A steep crux near the end of the pitch held potential for a huge fall, but an improbable no-hands rest allowed me just enough of a reprieve to get good gear. On the summit. Photo: Justin Sackett. Justin joined me in the sun above the dagger, and we continued up a pitch of perfect blue water ice to snow slopes. Rather than finish via the standard scramble route, we opted for an obvious corner system above us. Reminiscent of Shaken Not Stirred on the Mooses Tooth in Alaska, this narrow slot held steps of water ice broken by sections of steep snow—the ideal finish to an excellent climb. Arriving on the windless summit around 3:45 p.m., we took a short break and began our descent along the southeast shelf. After what felt like an eternity of steep downclimbing, we post-holed back to the cars, arriving a bit after 8 pm. Our direct new route is called Borrowed Time (1,900’, IV WI5 M7). RESCUE ON SLOAN PEAK In a sad footnote to the Sloan Peak story, a climber was severely injured in a long fall on the mountain about a week after the ascent reported above, apparently attempting one of the initial pitches on either this line or the Merrill-Minton route. The climber was pulled from the face in a dramatic helicopter mission—the five-minute video from Snohomish County Sheriff’s Office is a remarkable window into such rescues. We wish the climber well in his recovery. The third bivouac on the north pillar of Yashkuk Sar I. Photo courtesy of Dane Steadman. YASHKUK SAR FIRST ASCENTCrashhhhh! rang through the perfectly still night. To say this woke up August Franzen, Cody Winckler, and me would be a lie. How could we sleep? We were camped below the biggest objective of our lives, on our first trip to Pakistan, alone in the Yashkuk Yaz Valley aside from our two cooks and liaison officer back at base camp, surrounded by the most beautiful, terrifying, inspiring, and chaotic mountains we’d ever seen. Now, on the glacier beneath Yashkuk Sar I (6,667m), about a mile past our advanced base camp, I poked my head out the tent door to see a gargantuan avalanche roaring down the peak’s north wall, its powder cloud billowing toward us.“Should we run?” asked August. That’s the start of the article Dane Steadman has written for AAJ 2025. The new AAJ will be mailed to AAC members in September, but you can hear Dane talk about this climb right now in the latest Cutting Edge podcast. Along with Dane’s interview, you’ll hear alpinists Kelly Cordes and Graham Zimmerman, plus AAJ editor Dougald MacDonald, sharing their insights on this climb and the unique challenges and attractions of climbing in the Karakoram. The 2024 Yashkuk Sar I expedition was supported by a Cutting Edge grant from the American Alpine Club. The Line is the newsletter of the American Alpine Journal (AAJ), emailed to more than 80,000 climbers each month. Find the archive of past editions here. Interested in supporting this publication? Contact Heidi McDowell for opportunities. Got a potential story for the AAJ? Email us: [email protected]. Tagged: The Line"
