["https://americanalpineclub.org/news/2025/1/21/the-line-zanskar"]
title = "The Line: Exploring Zanskar — American Alpine Club"
description = "“In recent years, the peaks of Zanskar have seen increasing popularity with mountaineering expeditions. Despite this, there are still plenty of unclimbed summits from 5,500m to 6,500m….”     That’s the start of a report for AAJ 2025 from Matic “Matija” Jošt from Slovenia, who has completed four expl"
full_description = 'Dougald MacDonald January 23, 2025 The Line: Exploring Zanskar Dougald MacDonald January 23, 2025 “In recent years, the peaks of Zanskar have seen increasing popularity with mountaineering expeditions. Despite this, there are still plenty of unclimbed summits from 5,500m to 6,500m….”That’s the start of a report for AAJ 2025 from Matic “Matija” Jošt from Slovenia, who has completed four exploratory expeditions to Zanskar, in the southwest of Ladakh, India, in the last decade. Jošt’s detailed, photo-rich trip reports have prompted a lot of recent activity (including three additional reports in the upcoming AAJ). Below, we offer highlights from Jošt’s latest exploration, plus a brief Q&A with the man himself. The view from around 5,200 meters above the Chhogo Tokpo. At left is the south summit of T16, climbed in 2016 by Cosmin Andron and Cristina Pogacean from Romania. The main summit of T16, climbed in 2024 and named Skarma Mindruk Ri, is hidden to the left. At right is unclimbed T13 (6,436m). Photo by Matic Jošt. Chhogo Tokpo, Four First Ascents“Uroš Cigljar, Tilen Cmok, Boštjan Dečman, Nejc Škrablin, Tomaž Žerovnik, and I arrived on July 7 at base camp in the Chhogo Tokpo, the eastern branch of the Haptal Tokpo. [Tokpo is a word for “valley” in this area of India.] While several parties had visited adjacent valleys and climbed a few peaks on the watershed ridges with the Chhogo, the only reported climbing expedition to visit the Chhogo valley was an Indian-Romanian team in 2016 that climbed one peak and attempted another (AAJ 2017).“A very complex 6,431m mountain known as T16 was our main objective. [Peaks above various Zanskar valleys were numbered by Kimikazu Sakamoto, whose teams made exploratory expeditions in Zanskar from 2009 to 2016; Sakamoto published the first climber-friendly topographical sketches of these mountains.] The lower south summit was climbed by Romanians Cosmin Andron and Cristina Pogacean in 2016, but the easiest approach to the main top appeared to lie up the south slopes above the Khapang Glacier, east of the Chhogo valley. The big riddle was finding a suitable passage from the Chhogo to the Khapang, and we decided to devote part of our acclimatization to solving this problem. The final ascent to Skarma Mindruk Ri (6,431m), the peak formerly known as T16. Photo by Matic Jošt. “Aiming for a col on the ridge south of T16, we hiked up a side glacier, passing the route climbed by the Romanians, and climbed a 300m west-facing gully (300m, D+ 60° M3) to reach the col (5,836m). From there, it would be easy to descend to the gentle Khapang Glacier and traverse over to T16’s main peak. “The whole team returned to the col camp on the 14th, and the next day, in perfect weather, we climbed south-facing slopes above the Khapang Glacier and along the east ridge to the summit of T16 (600m, D+ 60°). Our expedition had been organized by a club from the Slovenian town Šentjur, so we named our route Šentjurka (900m, D+). We later encouraged people in the nearest village, Tungri, to suggest a name for the peak, and they came up with Skarma Mindruk Ri. (Skarma is “star,” and Mindruk is a specific star in the constellation of Pleiades.) Maybe the name will catch on.” Boštjan Dečman and Nejc Škrablin on the upper Khapang Glacier. The col they crossed to reach the glacier is just left of Škrablin. The huge rock fin behind leads to unclimbed T13 (6,436m). In back on the left is unclimbed Peak T11 (6,177m). Photo by Matic Jošt. Later in this expedition, Jošt and Žerovnik crossed a different col to reach the Korlomshe Tokpo, where a British team in 2015 had attempted what they called a “Matterhorn-like peak.” The Slovenians climbed the east face and south slopes to reach the 6,130m summit. “We named the route Charlatan De Balkan (500m, D+ 60° ice) after an album by a popular Slovenian group,” Jošt writes. “As the peak was absolutely nothing like the famous Swiss mountain, we named it Antimatterhorn.”Team members also attempted the west face of unclimbed Peak 5,435m, close to base camp, and made the first ascent rock tower east of camp, which was dubbed Ibex (5,321m). Below the east face of the Antimatterhorn (6,130m). Photo by Tomaž Žerovnik. By July 24, most of the party had left base camp. “Although I’ve been climbing around 45 years, I don’t have much experience with soloing, but I decided to try the north face of T9 (6,107m), which I had seen from the Antimatterhorn approach,” Jošt writes in his report. “I left base camp at 1 a.m. on the 25th, carrying two axes but no rope. The north face became icier and brittle the higher I climbed, but at 8:30 a.m. I reached the west ridge. The upper section of this ridge was rockier, but in one hour I was standing on the summit.” Uncomfortable with downclimbing the north face he had ascended, he headed down a couloir on the southwest face to a neighboring glacier, traversing the mountain, and made it back to base camp by 3 p.m. “The locals suggested the name Spao Ri for the peak. It means “brave mountain.” I named the route Old and Abandoned (700m, TD II/III 75° ice). Why? Because I’m not young anymore.”Jošt’s comprehensive report from the 2024 expedition, including some general notes on climbing in Zanskar, will be available at the AAJ website later this year. To see a copy sooner, email [email protected].—Matic Jošt, Slovenia Four Questions Matic Jošt, 55, first appeared in the AAJ in 1996 as a member of a Slovenian expedition to Gasherbrum I. His expeditions have taken him to high mountains throughout Asia, as well as climbs in Peru. Jošt climbing the north face of Planja in the Julian Alps of Slovenia. Photo by in Matjaž Dušič. Q. Where do you live in Slovenia and what do you do for work there?A. At the moment, I mostly live close to Celje in the central part of Slovenia. I am a self-employed engineer. In 2021, I applied for the IFMGA guide course and probably will finish this summer. So, last year I earned some money as an aspirant guide, too. I also sometimes do rope access work. Q. What is it about Zanskar that keeps luring you back? A. Easy logistics and some unexplored areas, nice local people. The mountains are not so high, and I can find easily something that fits my ambitions. It is not too expensive, and I can afford it. And after all, I am quite familiar with the geography of the region. Q. Are there issues with climbing there?A. The lack of quality maps in the area has partly been mitigated by navigation applications, but there is still confusion regarding peak names and, over the years, a general lack of systematic recording of activity. The IMF (Indian Mountaineering Federation) has a list of open peaks that includes geographical coordinates and altitudes, but they simply number the peaks; very few mountains on the list have names. I also think the IMF expedition policy for foreigners and their system based on “peak permissions” is out of date and quite inappropriate for such areas as Zanskar and other mountain ranges north of the main Himalayan divide. A more suitable management model would set boundaries within which climbers could choose any peaks they want to attempt.Q. Other than your trips to India, what have been your favorite international expeditions? And where is your favorite place to climb at home?A. All of my expeditions are my favorite. I am happy that from all the expeditions which I have participated in, we all came home alive. We have had some close escapes, accidents, and injuries, but we had luck. At home I really like Ojstrica (in the eastern Kannik Alps). It has nice north face above Logarska dolina (valley) to climb in summer, and nice southern slopes for skiing in winter. I also sport climb as much as I can to keep my fitness. The Line is the newsletter of the American Alpine Journal (AAJ), emailed to more than 80,000 climbers each month. Find the archive of past editions here. Interested in supporting this publication? Contact Heidi McDowell for opp