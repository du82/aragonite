quarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1458160080769-DCB4FSB75EMEFDJRAGGT/Comp+1.jpg" alt="Comp 1.jpg" /> #block-yui_3_17_2_1_1615925859808_20797 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -10px; } #block-yui_3_17_2_1_1615925859808_20797 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 10px; margin-bottom: 10px; } Craggin’ Classic Series The American Alpine Club will no longer host the Craggin’ Classic Series. We’re thrilled with the impact these events have had over the years and the ways they connected the climbing community. At the same time, we’re inspired by our new Strategic Plan and are confident that we are equipped to deliver even greater impact for climbers with this plan guiding the AAC’s activities for the next three years.The AAC ran the Craggin’ Classic Series for 13 years, and we're proud of the positive impact those events had on climbers and communities over that time. Nina Williams, AAC Board President, first connected with the Club through the Craggin’ series, and she is not alone. It is certainly true the Craggin’s were a party with a heart, and they truly epitomized bringing the community together over a passion for climbing. Across the 13 years of this series, we estimate that we've served over 30,000 attendees and nearly 8,000 clinic participants. Those same participants have given back to the local crags that host these events with well over 10,000 stewardship hours.We look forward to continuing to serve our members, engage local communities, and celebrate climbing through both new and existing initiatives. Learn more about the strategic plan Stories from the Craggins Craggin' Classic Series Climbers of the Craggin' Classic: Ozarks Craggin' Classic Series Craggin' Classic Series Craggin' Classic Series Climbers of the Craggin' Classics: Bishop Craggin' Classic Series Craggin' Classic Series Craggin' Classic Series Climbers of the Craggin' Classic: Moab Craggin' Classi