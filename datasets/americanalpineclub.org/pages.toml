["https://americanalpineclub.org/news/2025/2/13/educate-climbing-gear-innovations-then-and-now"]
title = "EDUCATE: Climbing Gear Innovations, Then and Now — American Alpine Club"
description = "This episode is for the gear nerds out there. The climbing world loves to reminisce on some of climbing’s great inventions of the past, but what’s happening in gear innovation right now? We put together some brief interviews with innovators past and present, to dive into tinkering in the climbing wo"
full_description = 'Hannah Provost February 13, 2025 Educate EDUCATE: Climbing Gear Innovations, Then and Now Hannah Provost February 13, 2025 Educate This episode is for the gear nerds out there. The climbing world loves to reminisce on some of climbing’s great inventions of the past, but what’s happening in gear innovation right now? We put together some brief interviews with innovators past and present, to dive into tinkering in the climbing world, then and now. We’ll start with an excerpt from Yvon Chouinard’s "Legacy Series" interview to hear him reflect on revolutionizing the ice axe. Next, we’ll take a massive leap forward into present-day sport climbing tactics, and chat with Will McNeill, of HangDog Climbing, whose ultralight clip-up device is becoming all the rage in the world of sport projecting. Next, we’ll chat with Brent Barghahn, of Avant Climbing Innovations, about squeaking out the last bit of efficiency for rope soloing systems and hard trad climbing. Then, we’ll take a step back in time again, and chat with Jack Tackle about the late John Middendorf’s legacy in innovating the A5 portaledge, to set us up for our last conversation, a discussion with Nathan Kukathas of Grade 7 Equipment. Nathan is known for inventing the G7 Pod, which many say has been one of the biggest innovations for alpine climbing in years.Through it all, we’ll talk about inspiration, what it takes to innovate in the climbing gear space, what could be next for climbing gear, and lots and lots about textiles, 3-D printing, and climbing harder. Listen Now Episode Resources: HangDog Climbing (Clip-up Device)Avant Climbing Innovations (Top-Rope Solo Lanyard and Flip-Stops)Grade 7 Equipment (G7 Pod)John Middendorf’s Gear History Website The Cutting Edge Podcast: Jannu North Face Tagged: Podcast'
