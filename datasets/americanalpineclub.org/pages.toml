full_description = 'Our Work Advocacy Publications Lodging Events Grants Climbing Grief Fund Library <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1568064658379-59BA8CLCW4SJ35RI6QQS/Screen+Shot+2019-09-09+at+3.30.51+PM.png" alt="MENTAL HEALTH DIRECTORY" /> MENTAL HEALTH DIRECTORY <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1568064964773-DADFXXK0NZ3EFSSBAPZH/LIZZY+SCULLY_6.jpg" alt="STORY ARCHIVE" /> STORY ARCHIVE <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1568065238501-6QZ19MNP4GGBDB3QT49K/Screen+Shot+2019-09-09+at+3.40.27+PM.png" alt="CLIMBING GRIEF GRANT" /> CLIMBING GRIEF GRANT <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1568065499829-KOTW4Q3DQDED7617PF77/Screen+Shot+2019-09-09+at+3.44.10+PM.png" alt="PSYCHOEDUCATION" /> PSYCHOEDUCATION <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1684270377064-U369HM5YKS4BZGV9J11H/2014fall-redrivergorge-0040.jpg" alt="WORKSHOPS " /> WORKSHOPS <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1684270418846-HCYPYGWGUC3XOTSO2KEG/20121129-indiancreekroadtrip-0122.jpg" alt="CGF TALKS " /> CGF TALKS #block-a0f29e269b0396958d06 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-a0f29e269b0396958d06 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } The Climbing Grief FundAt the American Alpine Club, we know that climbing is an inherently dangerous undertaking. We feel the risk is outweighed by the strong expression of selfhood that comes from moving up rock, snow, and ice, but danger can lead to injury and loss. We hope that the resources compiled here support you or someone you love to build the conditions needed for better integration of trauma or grief experienced. We hope that through increased visibility, education, and professional support concerning mental health in climbing, that we are creating a community better equipped to support one another on and off the rock and know when to seek professional care. Our MissionThe Climbing Grief Fund (CGF) connects individuals to effective mental health professionals and resources and evolves the conversation around grief and trauma in the climbing, alpinism, and ski mountaineering community. CGF acts as a resource hub to equip the mental health of our climbing community. The CGF Film: A Thousand Ways to Kiss the Ground “What conversations are we turning away from? What might it look like for our climbing community to fully engage with its collective grief? How do we presence ourselves with survivors and offer resources for individuals to better integrate their grief. I think it’s a beautiful thing that climbing offers us—to be present with the complexity of choosing to risk and being in honest relationship with our fragility and mortality.” — Grief Fund Founder Madaleine Sorkin Meet The Grief Fund TeamWe are deeply grateful for the hardworking volunteers and staff who make the Climbing Grief Fund happen. Trevor Davis | Therapeutic Manager of CGF Madaleine Sorkin | CGF Founder Climbing Grief Grant Committee | Trevor Davis, Lor Sabourin, Virginia Sanford, Lori Coyner, Eddie TaylorContact Us | [email protected] or call the AAC office at (303) 384-0110 Email Us DONATE TO THE GRIEF FUND'
