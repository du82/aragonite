["https://americanalpineclub.org/who-we-are"]
title = "Our Mission — American Alpine Club"
description = "The American Alpine Club is a 501(c)(3) charitable organization. Our vision is a united community of competent climbers and healthy climbing landscapes."
full_description = "About Our Mission Governance Awards Lifetime Members Privacy Policy 501(c)3 Statement Who We AreFounded in 1902, the American Alpine Club (AAC) is committed to providing climbers with resources that advance knowledge, inspiration, and advocacy. Through our rescue benefit and medical expense coverage, climbing and grief grants, campgrounds, and discounts, we are committed to empowering our members. We share knowledge and inspiration through the American Alpine Journal, Accidents in North American Climbing, and preserving climbing history in the AAC Library and Archives. Finally, we advocate for our members and the places we climb by breaking down barriers to climbing and seeking to preserve our climbing landscapes and public lands nationally and locally. At the AAC, we are connected through our passion for climbing. United We Climb.MissionProvide climbers with resources that advance knowledge, inspiration, and advocacy.VisionA community of thriving climbers.ValuesAdventureInspirationCuriosityInclusionCommitment Join Us! Donate to the Mission Banner photo: AAC member Jason Gebauer"
