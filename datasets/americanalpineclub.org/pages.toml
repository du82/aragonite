description = "The American Alpine Club is a 501(c)(3) charitable organization. Our vision is a united community of competent climbers and healthy climbing landscapes."
full_description = "Our Partners Brand Partners Organizational Partners UIAA Federation UIAA Member FederationThe American Alpine Club has been a Member Federation to the UIAA (International Climbing and Mountaineering Federation) since 1932. The AAC, and it's members, benefit from membership in the following ways:Eligibility for subsidized access to the UIAA Mountain Qualification Labels for leaders and instructors in climbing, mountaineering, ski-mountaineering and hill-walking.Option of sending athletes to compete in the UIAA Ice Climbing World Tour and the UIAA World Youth Ice Climbing Championships.Participation in the development of international standards, as part of the UIAA Safety Label, setting the highest standards for climbing and mountaineering equipment.Members can send participants to subsidized UIAA Global Youth Summit climbing and mountaineering events around the world.Sit on UIAA Commissions that work year-round on Access, Anti-Doping, Ice Climbing, Medical, Mountain Protection, Safety and Youth.Currently, the UIAA is the organization recognized by the International Olympic Committee for Ice Climbing Competition. Their goal is to see Ice Climbing represented in the 2022 Winter Olympics in Bejing, China. The steps to official competition will come through Ice Climbing Demonstration at the 2018 Winter Games in S. Korea and the Ice Climbing Demonstration at the 2020 Youth Games in Switzerland. For more information about the UIAA click the button below! UIAA For more information on the US Ice Climbing Team and competing in UIAA sanctioned ice climbing competitions, please click on the button below. U.S. ATHLETES Banner photo: Courtesty of UIAA"
