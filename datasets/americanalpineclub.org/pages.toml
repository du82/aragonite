title = "United in Yosemite Climbing Festival — American Alpine Club"
description = "United in Yosemite (UiY) is a climbing festival for climbers from backgrounds including queer and gender expansive, People of the Global Majority, and climbers with disabilities. A collaboration between the American Alpine Club and the Yosemite Conservancy, UiY aims to be active in the evolution of global climbing culture through the lenses of representation, Tribal engagement, stewardship, and celebration."
full_description = '''Climb United Climb United United In Yosemite Climb United—Route Name Principles Climb United Database A festival celebrating diversity in climbing.Most every climber, no matter their background or preferred discipline, can understand the allure of Yosemite granite. That’s why the AAC is so excited to partner with Yosemite Conservancy for a third year of the United in Yosemite festival.United in Yosemite is a festival dedicated to celebrating the growing diversity of the climbing community in one of climbing’s most beloved landscapes. The event takes care of the logistics of visiting Yosemite, and provides an inclusive space designed by affinity groups leaders, so that climbers from historically marginalized backgrounds—including Black, Indigenous, people of color, LGBTQ+, and people with disabilities—can connect, mentor each other, and share joy, without the stress of navigating barriers to access.Because this is a free, intimate event, dedicated to creating a tight-knit experience in the Valley, there are 100 spots available for attendees, available by lottery. Keep your eyes peeled for the lottery process, beginning in early March. This event is designed with new and intermediate Yosemite rock climbers in mind. 2024 Photo GalleryExplore the magic of United in Yosemite 2024 with the photo gallery shot by Sabrina Claros. <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721689597217-611N3A5BRD4D1A2NOKVZ/0F2A5151.jpg" alt="0F2A5151.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666907392-HADWHFERMVY1RENNNDLD/0F2A4947.jpg" alt="0F2A4947.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666927315-OZ215F5HCCIK95ZQU52P/0F2A5414.jpg" alt="0F2A5414.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666929311-C6UQDNTZ911SJP8OEIGD/0F2A5521.jpg" alt="0F2A5521.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666929312-0O979APODD4W1WZE00CH/0F2A5668.jpg" alt="0F2A5668.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666931639-27UWW2SS7VV4FEED3XTS/0F2A5728.jpg" alt="0F2A5728.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666931996-ZTJ94HJ3J0YM0QFKFS11/0F2A5753.jpg" alt="0F2A5753.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666933895-BY9JR1TFLYCXVKUQG7XH/0F2A5765.jpg" alt="0F2A5765.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666934378-GDMQ57VZ39778PIH6VSD/0F2A5852.jpg" alt="0F2A5852.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666935983-3099WMSHEXTC2IKYTNYF/0F2A5866.jpg" alt="0F2A5866.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666945727-TFVNCWZKHPXUPI1H7TI2/0F2A5893.jpg" alt="0F2A5893.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666947310-KZUK9S6HTSL9Y1IPGPTT/0F2A6023.jpg" alt="0F2A6023.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666948280-83NA6ICE4HXK2XKOJWHY/0F2A6026.jpg" alt="0F2A6026.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666949417-49K8OGXCBFKUZ2OGCVZD/0F2A6037.jpg" alt="0F2A6037.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666951855-BD56V345V0ZVNAH4RFOR/0F2A6106.jpg" alt="0F2A6106.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666956611-UYE43BUHASYF15M7ADRA/0F2A6150.jpg" alt="0F2A6150.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666969713-7FUO0L8ISUR9QOJX22Y5/0F2A6399.jpg" alt="0F2A6399.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666972992-MUGW2AFPBDKAP7XZ348H/0F2A6523.jpg" alt="0F2A6523.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666973752-GPEJLHACAU59R4VUDHD1/0F2A6538.jpg" alt="0F2A6538.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721690090277-AOBUZPBJU2K0LPQRCF5U/0F2A5348.jpg" alt="0F2A5348.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666975263-A20IYFQK8DAI6CX3CNJP/0F2A6550.jpg" alt="0F2A6550.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721689686590-U55AI8O3G6V7HOZYPE7B/0F2A5341.jpg" alt="0F2A5341.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666976755-AMWTDL93WVOG03MDM2FA/0F2A6807.jpg" alt="0F2A6807.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666978195-JBV1GFH7GJJID2OKKGKR/0F2A6960.jpg" alt="0F2A6960.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721690116781-4CXSJ763UXIZ3QDVUZWU/0F2A6618.jpg" alt="0F2A6618.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721690070149-9CAEH29LATSQIYJVI05W/0F2A5289.jpg" alt="0F2A5289.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1721666978725-M3SL92PIARNXJHMBEB9N/0F2A7080.jpg" alt="0F2A7080.jpg" /> Our MissionProvide meaningful and culturally appropriate mentorships for climbers from historically marginalized groups so they can be empowered to achieve their climbing goals, thrive amongst community, and develop strong relationships with the land. Our TeamUnited in Yosemite is a project of the American Alpine Club and Yosemite Conservancy. Clinics presented in partnership with Yosemite Mountaineering School and Yosemite Hospitality. Yosemite Mountaineering School is the official guide service of United in Yosemite. Visit each organization's page to learn more! United in Yosemite FAQs What is United in Yosemite? United in Yosemite (UiY) is a climbing festival for climbers from backgrounds including queer and gender expansive, People of the Global Majority, and climbers with disabilities. A collaboration between the American Alpine Club and the Yosemite Conservancy, UiY aims to be active in the evolution of global climbing culture through the lenses of representation, Tribal engagement, stewardship, and celebration. Is this event for me? Are you an individual with a historically marginalized identity or a multiple marginalized identities?Are you looking to learn about outdoor rock climbing or gain skills to help you access more complex climbing goals?Are you working for outdoor equity for yourself or in your community?Are you willing to be in a space with a diverse group of people, willing to listen and learn from their experiences, willing to be seen, and willing to show up for a transformation in climbing culture?If YES, then this is for you! Do I have to be an experienced rock climber to attend? Some experience climbing will be helpful! Programming is aimed at folks who are comfortable gym climbing and excited to branch into the outdoors, or intermediate outdoor climbers who are looking to level up their skills in Multi-Pitch Efficiency, Safety, and Aid Climbing. I’m a knowledgeable Yosemite climber from a marginalized background. Am I invited? We are looking for community members to volunteer in several roles throughout the festival! Check our volunteer page for more information. Why is United in Yosemite lottery based? Registration is limited at 100 participants. To ensure fairness and accommodate high demand, we conduct a two-week lottery registration process. Once the registration period concludes, we randomly select and extend invitations to 100 individuals.We save about 15% of spots for members of the seven traditionally associated Tribes of Yosemite.We save about 10% of spots for self-identified disabled or adaptive climbers. What is included in registration? Four nights of camping, 1 clinic and 1 workshop / participant, and dinner Friday and Saturday nights; access to intimate Vendor Village and affinity group spaces; and access to demo gear.During clinics with Yosemite Mountaineering School, shoes, helmets, and harnesses will be provided. Transportation and food are not included. What’s the best way to get around the Valley? The free Yosemite Valley shuttle system operates with service around Yosemite Valley. The shuttle bus is wheelchair accessible. For more information and a map of the shuttle stops, visit this page.Especially on a weekend in the summer, driving and finding parking can be stressful. If you can bring a bike and helmet, do it! Yosemite Hospitality rents bikes daily. Yosemite Conservancy offers a free bike share. There is not a bike lane for the entirety of the Valley loop road, but there is a bike path from Camp 4 to the Valley Visitor Center to Curry Village. Is this event rain or shine? It sure is! United in Yosemite will take place regardless of weather, though rain, excess heat, or smoke could change programming.Be prepared for changing weather, inclement weather, and be open to things changing due to weather conditions! Can I bring my pet? We ask you to please leave your pet at home. Can I bring my service animal? Service animals (dogs and miniature horses) are animals who have been trained to perform a specific task related to a physical or neurological disability. They are allowed wherever a person can go and will of course be welcome at Yellow Pines campground. They must be under control (leash 6 feet or less or verbal command) at all times.Under Department of Justice guidelines, emotional support, therapy animals, or companion animals are not considered service animals and are subject to the same regulations as pets (Yosemite National Park Pet Guidelines page). Additionally, service animals in training are not considered service animals under ADA and are subject to same regulations as pets.For more information, visit the National Park Service page on service animals. How will access needs be taken into account during the festival? Eight tickets will be reserved for folks with disabilities. Additional companion spots will be available for attendees with disabilities who would benefit from that assistance. If you require a companion to assist with your disability, you are responsible for finding that person. They do not need to be a member of one of the communities UiY serves, but rather someone who you feel comfortable with. For full details on accessibility in Yosemite National Park, please reference the Yosemite National Park Accessibility Guide. Will there be clinics about adaptive climbing? Instead of a specific adaptive climbing clinic, adaptive climbers are invited to join any clinic, and we will work with individuals to make sure we are preparing for their specific accommodations. There will be community members identified to support climbers at clinics if needed. Yosemite Mountaineering School guides are experienced with adaptive climbing accommodations and are psyched to help you get out there! Am I going to see a bear? Yosemite National Park is home to about 500 black bears. They can appear brown, cinnamon, honey, tan, and even black. The American black bear is curious, intelligent, and loves snacks. Their favorite snacks are grubs, berries, and roots — but their keen sense of smell leads them to human food. It is our responsibility as their neighbors to not allow them to get food or other scented products. A bear that has gotten human food can become aggressive in their hunt for calories, which can lead to their relocation or their unnecessary death. In the campground, there will be bear boxes where all scented items must be stored if they are not being used. If it goes in or on your body, it goes in the bear box. This includes food, bottles, drinks, cosmetics, soap, and ice chests (even if there’s no food in it!), and unwashed items used to prepare or eat food.For more information, visit the Yosemite bear safety page. Help keep bears wild! How is this a sustainable event? People can generate up to 50% more trash when traveling — small things like extra granola bars, a cup of coffee, to-go food containers add up! We aim to be a zero-waste event, and we all need to do our part by planning ahead and preparing to decrease our own footprint. We will have an organic waste dumpster in the campground, along with recycling and trash. We can reduce our impact by bringing reusable items whenever possible, and being mindful of the waste generated by food wrappers, gear, etc. Do I have to do a service project to attend? Stewardship projects are optional. Many individuals from non-dominant identities have spent much of their time and labor in contexts that were underpaid, overworked, and undernourishing. We do not offer stewardship projects with the expectation of garnering labor from individuals who are new to the space. Instead, we offer these service projects as a meaningful way of giving back if we have the capacity. Outdoor recreation and climbing can be seen as extractive – taking from land and original occupants without returning anything. We want to explore what does it look like to be a climber who tries to build a reciprocal relationship with land and original inhabitants.'''
