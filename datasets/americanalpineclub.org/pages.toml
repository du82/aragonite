description = "The American Alpine Club is a 501(c)(3) charitable organization. Our vision is a united community of competent climbers and healthy climbing landscapes."
full_description = "Our Work Advocacy Publications Lodging Events Grants Climbing Grief Fund Library PUBLICATIONSThe AAC’s two flagship publications are Accidents in North American Climbing (published since 1948) and the American Alpine Journal (published since 1929). Both books appear annually and are delivered in the fall to all members who opt to receive them. Books are just one part of the story. The AAC publications team also produces two monthly podcasts: The Sharp End and The Cutting Edge. Plus, the complete publications archives can be searched online—more than 25,000 articles and photos, topos, maps, and other resources that never appeared in print. New articles and special reports are published year-round: Follow Accidents and the AAJ on Facebook and Instagram for the latest news. Featured American Alpine Journal The 368-page AAJ documents the world’s most significant long climbs with first-person climber reports and hundreds of photos. Accidents in North American Climbing Climbers, rangers, and rescuers share accident reports and valuable lessons in this 132-page annual book. Publications Search Search the complete archive of AAJ and Accidents articles, maps, topos, and thousands of photos. Plus, find out how to submit your own stories. Sharp End Podcast Host Ashley Saupe interviews climbers and skiers about their accidents and lessons learned. New episodes the first of each month! Cutting Edge Podcast The AAJ editors interview climbers just back from great new routes around the world. The American Alpine Club Podcast That’s right. You can now take a deep dive into your favorite American Alpine Club content via your headphones, car stereo, and more. The drive to work—or your favorite hang board routine—just got way more interesting. MembersAre you receiving the AAC publications? Would you like to help the Club save resources by opting out of the print editions? (Digital/PDF copies are always available to members.) Review and update your current publications settings at your Member Profile.﻿Not a Member?You can buy print or digital (PDF) copies of the current and past editions of our books at the AAC store. Join the Club Donate"
