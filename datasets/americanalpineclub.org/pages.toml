["https://americanalpineclub.org/advocacy"]
title = "Policy & Advocacy — American Alpine Club"
description = "The American Alpine Club is a 501(c)(3) charitable organization. Our vision is a united community of competent climbers and healthy climbing landscapes."
full_description = '''Our Work Advocacy Publications Lodging Events Grants Climbing Grief Fund Library Policy and Advocacy Since its founding in 1902, the American Alpine Club has been a force in helping safeguard our country’s wild landscapes and natural treasures. Working alongside our members and partners, we focus on critical issues facing climbers and outdoor recreation nationally, such as keeping public lands pristine, wild, and open to human-powered recreation. All of us at the AAC find great joy and meaning in climbing, and we are committed to a thriving outdoor community sustained by healthy mountains and climbing landscapes for generations to come. Our Policy StrategyOur Vision: 5 million climbers empowered to protect climbing communities and ecosystems.Our Mission: The mission of the AAC Policy Department is to grow and convene the community of civically active climbers, empower them with information, and partner with them in advocacy.Our Strategy: Download this quick and dirty summary of how we are going to make that vision and mission happen. Join Today To Support this Work The Climber’s Advocacy Network (CAN)At the American Alpine Club, it is no secret that the power of our policy and advocacy work is fueled by passionate climbers from across the country. Regardless of who the individual may be or how they are connected to the Club, climbers are deeply engaged in the policy that affects the wild landscapes that they love. The initial Climber’s Advocacy Network Hubs. We believe that change happens when everyday climbers unite around a shared cause and are positioned to advocate for the interests of their community. That’s why we’ve spearheaded the Climbers' Advocacy Network (CAN), so we can better resource these grassroots advocacy initiatives cropping up in AAC communities across the country. Discover what the CAN volunteers are up to in each state, here. Learn more about the Climber’s advocacy Network Do you want to build community and at the same time, lend a hand to fight the good fight for public lands, equitable climbing access, and fighting climate change? Get Involved The CAN will equip volunteers and other climbers with information, and engage and represent climbers in advocacy. Our official policy strategy document, found here, illustrates in detail the various steps along the way we will utilize to facilitate this vision of an engaged network of informed climbers. <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1638222629222-XLGWAT1C7NRY0H2MYYQ5/IMG_1185b-75.jpg" alt="IMG_1185b-75.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1638222646469-KZ14MSYS3O83RY7HG1Y1/87897751_10217023058713605_7378383253339635712_n.jpg" alt="87897751_10217023058713605_7378383253339635712_n.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1638222662484-N7F7T5RVAL928701FPSK/Breashear%27s+Crack+II+by+Nic+Daughtry.jpg" alt="Breashear's Crack II by Nic Daughtry.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1638222683819-D65Z1MOF9G7RS2H2PY7F/IMG_3897.jpg" alt="IMG_3897.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55830fd9e4b0ec758c892f81/1638222704722-TZKK41G3SUC9SI7BJZUM/255863769_485087886068974_9113372176465540769_n.jpg" alt="255863769_485087886068974_9113372176465540769_n.jpg" /> #block-yui_3_17_2_1_1638222437108_12898 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1638222437108_12898 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Our Policy FocusThe future of climbing, and all outdoor recreation, depends on a bounty of healthy open spaces and the ability to visit and enjoy them. For this reason our policy focus areas are:● Protecting Public Lands To ensure that public lands remain public, that they are well-resourced and that important conservation tools (like the Antiquities Act) are preserved so climbers can continue to practice their craft on the lands we love.● Ensuring Lands are Open for Human-Powered RecreationTo streamline and update exclusionary permitting policies to ensure that climbers, guides and other organizations can get the permits they need to provide facilitated climbing experiences.● Safeguarding Fragile Mountain and Climbing EnvironmentsTo understand our mountain and climbing environments, to promote sustainable use and effective management and to bring awareness to the impacts of a changing climate on the landscapes that inspire us.● Combating Climate ChangeTo mitigate the effects of climate change through political advocacy, scientific research, and developing resources for members to make sustainable choices as they plan trips and expeditions. As an outdoor community whose ethos is inextricably linked to healthy mountain environments, the AAC is committed to fighting climate change. Become A Climbing Advocate With the AAC (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'advocacy-actionwidget-code')); Join our team of advocates and get your voice heard! We will send you opportunities: to fight for public lands, comment on climbing land management proposals and big wall permit regulations, as well as bills on the federal level that impact accessibility and the fight against climate change. Sign up to be in-the-know about the policy issues that matter most to climbers. Issue 006 The Summit RegisterThe Summit Register is the AAC’s digital zine focused exclusively on our policy and advocacy work, and how you as a climber can get involved. Each issue features the bills and initiatives the AAC is actively advocating for, as well as stories from a crag near you, and how local climbers are giving back to their climbing areas and communities. In our most recent issue, hear from Tommy Caldwell and our new Government Affairs Liaison, and dive deep into the conversation around conserving the Dolores River Canyon. Read the Summit Register Updates from Your Policy Team News EXPLORE Act Passes and NPS Discontinues Fixed Anchor Proposal Read More → Guidebook XII—AAC Advocacy Read More → A Long and Winding Road: An Update on the EXPLORE Recreation Package Read More → PROTECT: Amity Warme and a YOSAR Climbing Ranger Weigh In on The Yosemite Credo Read More → Outdoor Alliance and American Alpine Club Working Together to Protect Rock Climbing Landscapes Read More → AAC Submits Comment on Proposed Bears Ears Climbing Management Plan Read More → Characterizing the Effect of Elevation on Climate Records in Denali National Park, Alaska Read More → Grant Spotlight: The Cornerstone Grant Read More → Fixed Anchors: What's Next? Read More → Fix CRUS: Help Protect Public Access to Recreation in Colorado! Read More → Our Policy Sponsors'''
