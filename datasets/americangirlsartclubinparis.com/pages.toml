full_description = "Art, Books, Paris: The Hare with Amber Eyes Posted on November 30, 2011 by americangirlsartclubinparis The Hare with Amber Eyes by Edmund de Waal has been out in Picador paperback since this summer, but it took a personal recommendation by a fellow art history friend to get me to finally pick it up and read it. My friend and I toured the Stein Exhibit at the Grand Palais together a couple of weeks ago, and she couldn’t stop raving about this book. “Speaking of collectors,” she’d said, “there’s this fabulous book about a Jewish family’s collection of Japanese netsukes.” To which I said kind of sheepishly: “what’s a netsuke?” (De Waal pronounces it something like “netski.”) Source: http://www.edmunddewaal.com In case you don’t know either, netsukes are small wood or ivory carvings that originated in 17th century Japan. De Waal’s ancestor Charles Ephrussi, a wealthy art patron who lived in Paris at the height of the Belle Epoque, bought a collection of 264 netsukes when Paris was all abuzz about Japanese art. The Ephrussi collection now belongs to De Waal, and one of his favorites is the Hare with Amber Eyes, pictured above. De Waal’s netsukes were owned and treasured by truly fascinating people. The story begins with the rise of the Ephrussi banking family in Odessa, and follows them from late 19th century Paris to 20th century Vienna, through the horrors of World War II and beyond. Charles Ephrussi was a fashionable salon-going Paris aristrocrat, an “aesthete,” after whom Marcel Proust modeled his character Swann in Remembrance of Things Past. Charles Ephrussi was a friend and patron of Renoir, Monet, Cassat, Degas and more. The walls of his study on rue de Monceau were filled to the ceilings with impressionist paintings. When I read that Charles Ephrussi had been invited to be a model in Renoir’s painting The Luncheon of the Boating Party, I couldn’t resist pulling out my own tattered copy of the book of the same name by Susan Vreeland. (Another great art history/Paris read to add to your list if you haven’t already.) Charles is the man in the top hat with his back to the viewer. See the names I scrawled on the cover, as I worked to keep track of all of the characters? In fact, Vreeland’s website offers a summary of each model including Charles. Source: Parisian Fields Charles Ephrussi is such an interesting character it might be worth a field trip to 81 rue de Monceau to see the former Hotel Ephrussi and the Parc Monceau neighborhood. I think I will follow the lovely travel guide by a like-minded blogger Parisian Fields, whose photograph of the former Ephrussi home is pictured on the left. Getting to learn about Charles Ephrussi is just one of the many discoveries you will make while reading The Hare with the Amber Eyes. As the story moves on to 20th century Vienna, you will read about the rise of anti-semitism through the eyes of Charles Ephrussi’s cousin Viktor and his young beautiful wife Emmy, who received the netsukes from Charles as a wedding gift. Their children, including De Wall’s great uncle Iggie, grew up playing with the netsukes at their mother’s feet as she donned her gowns and jewelry. Before long, however, the Nazi’s seized power in Austria and stole nearly everything in the Ephrussi mansion, including their furniture, their extensive collection of books and their Old Master paintings. The family barely survived the war. The remarkable and heartbreaking story of how their netsuke collection survived the Nazi horrors is one you will just have to read for yourself. The latest news is that De Waal has just published an illustrated U.K. edition of The Hare with Amber Eyes, which I am dying to see. If you can’t get a hold of the U.K. edition, you can at least enjoy the photos of De Wall’s netsuke gallery on his website. They’re enchanting, just like the book. The Hare With Amber Eyes is a beautifully told story of art, family history and the connection between our lives and the objects we appreciate. Highly recommended. Share this:ShareEmailPrintTumblrFacebookTwitterLike Loading... Posted in Art History, Art History Site, Book Review, Literary History | Tagged Art History, Charles Ephrussi, Edmund de Waal, Luncheon of the Boating Party, Marcel Proust, netsukes, Palace Ephrusssi, Paris art history sites, Paris books, Remembrance of Things Past, Susan Vreeland, The Hare with Amber Eyes, Viktor Ephrussi"
