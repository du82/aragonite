["https://americangirlsartclubinparis.com/2014/01/09/fanny-and-louis-in-grez"]
title = "Fanny and Louis in Grez | American Girls Art Club In Paris. . . and Beyond"
description = "Nancy Horan, the bestselling author of Loving Frank, comes now with her long-awaited second novel, based on the nineteenth century love story between Fanny van de Grift Osbourne, a not-exactly-divorced American mother of three and the much younger writer Robert Louis Stevenson. The pair met in the summer of 1875 in Grez, an art colony…"
full_description = "Fanny and Louis in Grez Posted on January 9, 2014 by americangirlsartclubinparis Nancy Horan, the bestselling author of Loving Frank, comes now with her long-awaited second novel, based on the nineteenth century love story between Fanny van de Grift Osbourne, a not-exactly-divorced American mother of three and the much younger writer Robert Louis Stevenson. The pair met in the summer of 1875 in Grez, an art colony in France in the Fountainebleu Forest. Fanny had arrived in France the year before to escape her unhappy marriage and to study art alongside her 17 year-old daughter Belle. Fanny and Belle were enjoying their studies in the women’s drawing classes at the Académie Julian alongside other international students, including May Alcott, Louisa May Alcott’s little sister. (You can read more about May Alcott’s art studies and travels through France at my previous post, Little Women in Dinan.) After enduring an unspeakable tragedy in Paris, Fanny decides to bring her children to Grez for some quiet recovery time in the country. A fellow art student at the Académie Julian suggested a quiet place, “an inn at Grez, on the Loing River. It’s close to Barbizon but away from all the bustle, and cheap. It’s near the Fountainebleu Forest.” Fanny talks her estranged husband from California into supporting them for one more year in Europe. Nancy Horan describes Grez-sur-Loing well: [N]estled in the midst of vast farm fields, the village was a smattering of stone houses, a picturesque bridge, and a ruined twelfth-century tower with ferns growing in its cracked walls. During my year in France I loved to plan field trips to art history sites, and I just happened to spend a gray day in Grez myself. You can read another post (Visit an Art Colony in France: Grez-sur-Loing) about my trip to Grez, which includes directions and more information about the different artists who lived and painted there. Here are some photos of Grez that readers of Under the Wide and Starry Sky and fans of Robert Louis Stevenson might especially enjoy: Standing in front of the bridge at Grez-sur-Loing in 2012. The picturesque 12th century Tour de Ganne is in the background. The 12th century Tour de Ganne in Grez The Tour de Ganne in Grez as seen from the grassy walk down toward the river On the main street in Grez: Church of Our Lady and Saint Lawrence, 12th century In the book, Nancy Horan has Fanny’s friend Margaret Wright tell her about the Hotel Chevillon in Grez, “one of the most bohemian of the bohemian gathering places near the Fountainebleu Forest.” Says Margaret: Barbizon has become too fashionable. It’s overrun by poseurs more interested in the mis-en-scene than in producing any actual art. The real painters go to Grez. . . . And you needn’t worry. They will leave you alone, I think. Little did Fanny know that the bohemians who enjoyed the summer season at Hotel Chevillon were dismayed to hear that an American woman and her children had arrived at the inn. Bob Stevenson (Robert Louis Stevenson’s cousin, and an artist in his own right) arrived ahead of the group of “Glasgow Boys” from Scotland with the intention of chasing Fanny away. In the book, Bob Stevenson hints Fanny might want to find other more suitable accommodations: There’s an onslaught about to begin. . . . Once the others start to arrive you’ll discover this isn’t the place to be if you are hoping for a little peace. Madame Chevillon said you had come for the quiet. . . . There are places not far from here that would serve you much better if you are here to rest. . . . But things would turn out much differently than the Stevensons had planned. Within a few short weeks, both of the Stevenson cousins would have a crush on Fanny. Although Fanny was 10 years older than Louis, they found comfort in each others hearts and minds. In the meantime, Fanny’s 17 year-old daughter Belle fell in love with the Irish artist Frank O’Meara. The Hotel Chevillon still stands today, although it is not open to the public. It is a private art residency center operated by The Grez-sur-Loing Foundation in Sweden, which manages a stipend program for visiting artists, authors and photographers. There is even a Robert Louis Stevenson Fellowship available for interested writers (the application deadline for 2014 is February 28th, but it looks like it is limited to residents of Scotland.) Hotel Chevillon, the place where Fanny and Louis met, is still standing! It is located on rue Carl Larsson, which is named after the Swedish painter. It was restored in 1994 and serves as an art center and residency program. Hotel Chevillon from the street. A view of the back balcony of Hotel Chevillon from the nearby bridge. Just on the other side of this wall is where Fanny, Louis and their fellow bohemians gathered to paint and relax. The backyard of the Hotel Chevillon today. Can you picture Fanny and Louis back there back in the day? Source: Carol Ferrelly, http://www.scottishbooktrust.com/blog/writing/2013/11/five-things-robert-louis-stevenson-fellowship Hotel Chevillon by Sir John Lavery (1883), an Irish artist who visited Grez. This painting captures the feel of the garden at Hotel Chevillon back in the time of Fanny and Louis. Source: http://www.paintingmainia.com After their summer meeting in Grez, Fanny and her children returned to Paris, where they settled into an apartment in Montmartre. Louis would continue his pursuit of Fanny from Paris to California and beyond. They would finally marry in 1880 and spend their years traveling the world. John Singer Sargent would paint a strange but perceptive portrait of RLS and Fanny when they were all living in Bournemouth, England in 1885. Apparently, Fanny was not too happy about the way she is marginalized and made to look so Moorish in this painting. As for me, I find it fascinating. What an odd pair. Robert Louis Stevenson and His Wife by John Singer Sargent (1885) Under The Wide and Starry Sky is an interesting portrait of an unorthodox and artistic couple from history, not unlike the story of Frank Lloyd Wright and Mamah Cheney. However, this love story didn’t seem nearly as compelling as Loving Frank, and I’m not sure why. Neither RLS nor Fanny are particularly admirable people, but then, neither were Frank and Mamah. For some reason, it bothered me that Fanny lacked any substantial talent or drive as an artist, that she acted so passively in the face of her son’s serious illness, and that she waffled over her commitment to a horrible marriage. Maybe it’s my mistake, expecting a 19th century woman to act with as much agency as a 21st century woman, but still, it interfered with my ability to identify and sympathize with Fanny. I have to admit, I take strange delight in the take-down Fanny suffers under the paintbrush of John Singer Sargent. Even if Under the Wide and Starry Sky doesn’t measure up to Loving Frank, I would still recommend this book to fans of historical fiction, especially if you are interested in learning more about the writings of Robert Louis Stevenson or the 19th century art scene in Paris. And if you happen to be visiting Paris anytime soon, I highly recommend a day trip out to Grez. Share this:ShareEmailPrintTumblrFacebookTwitterLike Loading... Related This entry was posted in Art History, Art History France, Art History Site, Book Review, Literary History, Literary Site, Paris Books and tagged Art colonies in France, Day trips from Paris, Fanny van de Grift Osbourne, Grez-sur-Loing, Hotel Chevillon, Loving Frank, Nancy Horan, Robert Louis Stevenson, Under the Wide and Starry Sky by americangirlsartclubinparis. Bookmark the permalink."
