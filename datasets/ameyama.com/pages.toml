["https://ameyama.com/blog/not-so-great-expectations"]
title = "雨山"
full_description = '''Sometimes, we learn lessons in life, but then either forget them or fail to apply them in new situations. I recently noticed that I had done that very thing. One several occasions over the past year, my wife and I had spent time with some of our closest friends. Each time, a strange thing happened: I came away feeling irritated or even upset. The first time or two it happened, I chalked it up to sleepiness or to a particularly potent bout of introversion. But it kept happening and kept happening. In fact, it was infecting my marriage as well. My wife and I had always gotten along really well, but I began to notice that I was getting more and more irritated with her, too. Well, I quickly felt that this was just too much to bear. If I couldn't enjoy spending time with close friends and loved ones, then there probably wouldn't be too many more happy times left in life for me; and I didn't want to die a lonely, angry, old man. So, I spent some time sifting through my thoughts and feelings, trying to pinpoint the source of the problem. I've struggled with anxiety and depression for years, and I'm also an extreme introvert, so society is naturally a struggle for me. But I'd also had good, enjoyable friendships before, so I knew that this problem was something new and worse than whatever I'd struggled with in the past. And, after much introspection, I think I finally diagnosed the problem: I was trying too hard to control other people and my interactions with them. To be clear, I'm not a manipulative person, so I wasn't trying to force people to act a certain way; but I definitely experienced frustration when people didn't act as I expected them to act or feel as I expected them to feel. I'm agnostic and mostly skeptical about religion, but I do think that religions have accrued kernels of wisdom that can be useful for us. And Buddhism, I think, has something to say about this situation. If I've understood the basics of Buddhism correctly, then one of the Four Noble Truths is this: Life is suffering. That means two things, I think. First, it means that mere existence is, on average for most people most of the time, probably more painful than pleasurable. We're always in need of food, water, and shelter — as well as the instrumental goods which lead to those intrinsic goods — which means that we're always hunting for and competing for those things. Even in the very best of lives, the fear of our inevitable demise still hangs like an ominous cloud on the horizon, darkening what could otherwise be a sunny existence. But second, "Life is suffering" means that we cause ourselves a boatload of unnecessary suffering by having desires and expectations that fail to be fulfilled. We hang all of our hopes on getting some new job, and then feel crushed when someone else gets it. We wish secretly, in our heart of hearts, to find The One to be with for the rest of our lives, and then suffer every day in which we haven't found them yet. We cling desperately to the past, but find in the end that we can never regain it. And while it's not clear how much we can mitigate the first kind of suffering (though there are good reasons to think that it's at least possible in theory to reduce hunger, thirst, homelessness, and disease on a global scale), the second kind of suffering can perhaps be reduced pretty significantly by letting go of our unreasonable desires and expectations as much as possible, by revising the desires and expectations that can't be released, and by embracing whatever is actually happening to us instead of wishing futilely for some other thing to happen.'''
year_published = 2025
clearnet = "https://ameyama.com/blog/not-so-great-expectations"
