["https://ameyama.com/blog/2018-the-year-in-review"]
title = "雨山"
full_description = '''In some ways, 2018 was one of the hardest years of my life. A single set of events destroyed a whole chunk of my life in some pretty terrifying and agonizing ways. I've already written about that stuff a little bit, so I won't prolong your pain by rehashing it all here — and I'm not ready to discuss it in detail anyway. But let me just mention a few bits of the longer-term effects that those things have had on me. First, I continue to have nightmares about them, even though we're several months out from it all. The nightmares aren't as bad or as frequent as they used to be, but they still happen. I'm also, I've discovered, still very sensitive to anything that might signal a resurrection of that stuff. Second, my relationships with close friends and family have been strengthened immensely by having to rely on them, so I suppose that's an unexpected silver lining. So, what else happened this year? The primary thing that happened aside from the aforementioned stuff was that I discovered the Effective Altruism movement, which prompted me to leave education to look for work that would allow me to have a greater impact on the world. Applying for jobs at EA organizations was at times pretty depressing because I didn't have the requisite skill set to join even as a junior researcher, so I felt like I was mostly trying to convince people to give me a shot out of pity and charity. Fortunately, one company that focuses on mental health eventually gave me such a shot. I've been working with them as a web development contractor for a couple of months now. I'd still like eventually to work as a researcher (if doing so would allow me to have a greater impact), and I'm not sure whether they'll give me such an opportunity or not, but I at least feel like I'm heading in a better direction than before. I mentioned in a recent post that I have some skepticism about the exact causes that have been prioritized by the EA movement, but because EA is cause-neutral, I hope that they'll eventually turn their focus to more systemic issues. (After writing that "Values Update" post, I came across this paper, which attempts to show that anti-capitalism and EA are not only a compatible but also a desirable match. In it, the author gives what I think are two important criticisms of EA. First, he says that EA focuses too much on individual action and responsibility, and that it should instead consider putting more effort into changing groups and systems. And second, he says that EA tends to want to work within existing systems, even if those systems are inefficient or corrupt, and that it should instead consider replacing or destroying bad systems. I was very glad to have read it; it reified and justified some of the vague worries that had been floating around in my head for a while.)'''
