["https://ameyama.com/blog/2020-the-year-in-review"]
title = "雨山"
full_description = '''Obviously, this year has been hard for everyone because of COVID, so I'll skip over all of that. Besides that, what happened for me this year? This year, I got much more familiar with my mental landscape, especially with my depression and anxiety. I was on Prozac for almost the entire year, and it worked wonders for me. But in addition to having a more stable mood and less anxiety, I became much more aware of the differences between depression and anxiety. Those differences probably seem obvious to you, but I think I couldn't tell the difference for a long time primarily (I think) because they always seemed to show up at the same time. I could probably have described the differences, but now I'm pretty sure I can feel the differences. That's been useful because I recently stopped taking Prozac, and it's been interesting to notice how the landscape has shifted without it. (I got off both of my medications because I was tired of (1) the insomnia and weight gain from the Prozac and (2) the side effects from the medication that was supposed to mitigate the insomnia. My mood felt pretty stable anyway, and I wasn't experiencing any traumatic life events, so I figured it was a good time to try to wean myself off. I discussed it with my doctor, of course, and he gave his blessing.) My anxiety levels have risen a lot in the last few weeks, but my mood has stayed pretty stable. Weirdly, nothing in particular is making me anxious; I think I just tend to have a higher default anxiety level than most people. In fact, I'd say I mostly experience the physical symptoms of anxiety right now rather than the conscious symptoms when the anxiety kicks in: my heart rate increases, my muscles become more tense, I breathe faster, and I become super sensitive to bright lights and loud sounds...but I feel emotionally quite normal. I've also taken up meditation. I still haven't set aside a regular time for it yet, but I try to do it any time I have down time. I've actually been surprised at how quickly I've been able to notice changes in how I react to certain stimuli, especially to the impulse to eat. (I won't call that impulse "hunger" since I quite often eat out of sheer habit even when I'm not hungry, usually as a way to cope with anxiety.) I'd like to do more meditation in the coming year!'''
