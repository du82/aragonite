["https://ameyama.com/blog/2019-the-year-in-review"]
title = "雨山"
full_description = '''Well, another year has gone by. Somehow, this one seemed to fly past. Why, it seems like it was just yesterday that I was writing last year's "year in review" post! So, what's happened this year? The thing that's been taking up the majority of my time, energy, and mental space has been work. Mostly, that has involved personality research, though it's also included some web development and design stuff. I've learned a ton in the research vein — mostly in terms of linear algebra and statistics — but I've also improved a lot as a programmer, I think. The only downside is that I haven't spent as much time working on personal projects this year because I've wanted to be away from my computer any time I'm not working. I also finally started dealing with my mental health issues. I went to the doctor and got on some antidepressants, which have worked very well (aside from continuing insomnia). I should still probably take up something like meditation, but I haven't gotten around to it yet. And that brings me to a more general observation: I had hoped that the antidepressants would suddenly give me the motivation to exercise every day, eat right, and take up other healthy habits — but that hasn't happened, unfortunately. I desperately need to lose weight, but I haven't been able to get back on the intermittent fasting train (which is the only form of dieting that has enabled me to lose weight effectively so far in my life). So, although I'm glad that I've gotten back a lot of mental and emotional stability, I still need to figure out the whole diet and exercise thing. Speaking of diet, I've been trying to switch to a vegan diet and lifestyle. I suck at it so far; a lot of the time, it's more like vegetarianism than veganism and involves eating tons of carbs, the latter of which is contributing to my recent weight gain. But anyway, I've been convinced by the arguments around the ethics of animal consciousness, suffering, and value that we shouldn't use animal bodies or labor for anything without their informed consent — and since we can barely communicate with most animals, it makes sense to me that animals likely can't be properly informed and can't properly give consent. And, of course, because humans are animals, I believe that we also shouldn't use human bodies or labor for anything without their informed consent. With humans, we're better able to inform them and request their consent, but too many people are still used and abused against their will. I think that, where humans and animals differ, they only differ in degree, not in kind; which means that human rights and animal rights seem to me to be virtually identical.'''
