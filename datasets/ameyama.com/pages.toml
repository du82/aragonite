["https://ameyama.com/blog/chocolate-rage-and-self-efficacy"]
title = "雨山"
full_description = '''I've half-jokingly said before that I experience "chocolate rage." That is, when I eat too much chocolate, I become extremely irritable and even aggressive. I also feel an unusually high amount of fear and an overwhelming desire to be alone and to hide in a corner. I mean that literally, by the way. Like, if I could climb into a very tiny closet in the most remote part of the house and shut the door and turn off the lights while I'm in a chocolate rage, I'd gladly do so. I told my students about this problem once, and they laughed at me. They apparently had a hard time believing that mild-mannered Mr. Castle could ever get angry about anything. So, my "aggressive" may not look like someone else's...but my wife and daughter can surely attest to the fact that I really do become a quite different animal after consuming chocolate. And I'm not alone: chocolate rage is apparently a real phenomenon, though of course not everyone has that reaction. Anyway, I'm really writing this post to document a feature of anxiety and/or depression that I've noticed lately. Side note: isn't it interesting how we become more attuned to ourselves as we age, even well into adulthood? Several decades (and maybe even our entire lives) are spent learning to recognize our bodies' signals. My daughter, for example, doesn't recognize that she has to go to the bathroom until she's about to burst. But I find that I can notice that particular urge long before I hit critical mass, and I also have a pretty good sense for how long I can hold it. Similarly, we probably spend decades (and maybe even our entire lives) getting to know our own minds. I'm of the opinion that the mind is what the brain does, and that, because the brain is an organ and can get sick or break down like any other body part, the contents of our thoughts and feelings can become quite strange, terrifying, and alienating (though they may not always be perceived that way by the person entertaining them). It annoys me a little to have to defend this point, but I still know too many people who treat the mind as connected to or even perhaps synonymous with an immaterial soul and who therefore believe that minds are somehow unaffected by bodies. This view seems utterly untenable to me, since we've surely all known people whose minds were changed by mental illness, stroke, or head injury. I don't believe in souls; but even if I did, I'm sure I'd still believe that minds are completely disconnected from the soul and completely connected to the body because of how I've seen people's minds change as their brains change. But I say all that to say that introspection — the mind getting to know the mind — is a strange phenomenon, isn't it? Does your liver get to know itself? And to make introspection even more difficult, so much of what happens in our brains is inaccessible to us; i.e., a lot of it is subconscious. But maybe that's not so different from getting to know the rest of the body, you know? After all, it happily carries out its functions without our conscious regulation, and it's probably usually the case that we only become aware of its inner workings when something starts malfunctioning. So, maybe that's the best way of thinking about what prompts us to take stock of our mental states: when something starts malfunctioning, we start scrounging around for the owner's manual.'''
