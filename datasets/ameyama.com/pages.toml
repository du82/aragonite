["https://ameyama.com/blog/2017-the-year-in-review"]
title = "雨山"
full_description = '''For the past two years, I've done a year-in-review post, and this year is no different. Last year, I was surprised at how much had changed in a year. This year, the opposite is true: I'm surprised at how little has changed. Last year, before Trump's presidency had begun, I had described how awful I thought that he was and how awful I thought that things would be under his presidency. Over the course of this year, I've been shocked and horrified at his behavior and at the behavior of his cronies and of Republicans in general, but not quite surprised; they acted pretty much exactly as I imagined that they would. It has generated in me a deep cynicism about humanity. There are, of course, really good people that have risen up to combat them, but my cynicism revolves around the worry that humanity will always be fundamentally broken in this way, that the powerful will always exploit the weak, that power in general will always corrupt, that even the best political and social systems will not prevent the rise of despots, that inequality will never be undone. It makes me think about the manga / anime From the New World, which examines some of these and related problems, like the lengths to which a society would go to prevent violence and upheaval, and the depths to which they would sink in order to tolerate — and even encourage — oppression. I need to watch that show again. Good stuff. Anyway, these problems have spurred me to get involved in politics by volunteering for the Hood County Democrats and even running for my first office: precinct chair. But, on the other hand, I've become deeply depressed. A conversation from Lord of the Rings comes to mind. "So do I," said Gandalf, "and so do all who live to see such times. But that is not for them to decide. All we have to decide is what to do with the time that is given us." All right. Enough wallowing. Let's take a look at some of the other (and more positive) things that happened this past year. Teaching has been awesome this year. I've had so many good conversations with students. And our conversations have frequently included difficult, controversial topics, like abortion or gay rights. (These are controversial, of course, because I live in Texas.) I can tell that the students are genuinely engaged during these conversations, that they're really thinking hard and trying to find the truth. On my last test of the semester, I asked this question as a bonus: "What's the most interesting non-math thing you've learned in this class this semester?" Many of the responses were silly, but I did find a couple of really great responses. One girl wrote, "[I learned] that you can actually have thoughtful conversations with people who don't share the same opinions as you and not be immediately bashed for your beliefs." I could hardly have asked for a better answer. This is exactly what I've tried to do: neither to let a view receive punishment for mere expression nor to let a view go unexamined.'''
