["https://ameyama.com/blog/grief"]
title = "雨山"
full_description = "But due to a series of unfortunate events, we were unable to keep her. On her last day with us, I put her in her crate in the car and drove her through the cold and rain to the Humane Society of North Texas. She whimpered and shivered the whole way there, even though it was warm in the car. When I opened her crate, she didn't want to get out. When I opened the door to the building, she didn't want to go in. I filled out the relevant paperwork in something of a mental and emotional fog, but it wasn't until I was back in the car, quiet and alone, that the sadness finally washed over me. An hour later, I had to pick my daughter up from school and tell her the horrible news. She sobbed all the way home. Addie was such a sweet girl, and I know she's probably with another family now. She was young and cute and gentle and well-tempered, so she almost certainly got adopted by another family right away. My wife haunted the Human Society website to keep an eye on her posting until it disappeared again a short while later, and then we finally felt a little bit of closure. But I've been so sad about her lately, hoping she's okay, hoping she's having a good life wherever she is. A year and a half ago, my wife's sister, Anna, committed suicide. We were visiting my parents at the time, and my wife's parents called my mom and asked to speak to my wife. There was so much grief on both ends of the phone line that the conversation was almost unintelligible. And then we left immediately to drive late into the night to get home to be near her family. The whole car trip was spent in alternating weeping and silence. Anna's birthday was earlier this week, and her death has weighed especially heavy on my wife's mind for the past several days. She says that the sadness and anger and sense of loss are still as fresh as they were when it happened. Anna was a good person who fell on hard times in adulthood. Her marriage was rocky. She suffered from substance abuse and addiction. She had what seemed like a handful of mental health problems, though she was probably never officially diagnosed. Fortunately, I knew her for a few years before things got bad. But it's still so desperately sad that such a good person could feel that life was so horrible that it would be better not to be alive."
year_published = 2025
