["https://ameyama.com/blog/2016-the-year-in-review"]
title = "雨山"
full_description = '''So, 2016 is almost over. I read back over last year's year-in-review post, which made me realize how much can change in just one year. Last year ended on such a positive note, but this year ... oh, god, this year. Honestly, it's hard to think of all of the good things that have happened this year (and there have been plenty of them) because they've all been overshadowed by that horror that tinges most of my waking thoughts these days: Donald Trump. If nothing else, though, 2016 has roused me to a new political activism that I have never known or felt before. I had never voted before this election, even though I'd been capable of voting since the 2004 elections. I felt, and continue to feel more strongly every day, that he's a psychopath, a liar, a moron, a narcissist, a swindler, and a bigot. That such a person should be the most powerful man in the world is excruciatingly scary, though right next to it is my terror of my neighbors who believe that such a man is an idol, a person to be emulated, a person to be placed in a position of leadership and authority. I am utterly incapable of understanding such a viewpoint. I hear rumors that some people voted for him not because they like him but because he'll challenge the status quo or "drain the swamp" or whatever. But, of course, even if he manages to follow through on all his promises, voting for such a person is analogous to detonating a pack of C-4 in your house because you'd like to take up the carpet: maybe the carpet will be gone when you're done, but so will the rest of the house. And if he does follow through on all his promises (which may be doubtful, but nevertheless a possibility), then he'll undo years of progress for minorities, women's rights, international relations, energy reform, and a plethora of other absolutely vital issues. But anyway, other people have written about how terrible he is, so I'll leave it alone for now. I really only wanted to lead with that so that I could get it out of my system and talk about other things.'''
