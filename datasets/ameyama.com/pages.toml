["https://ameyama.com/blog/firewatch"]
title = "雨山"
full_description = '''So, I recently finished Firewatch by Campo Santo. It was really good! I have a few quibbles with some of the gameplay and technical elements, but otherwise, it was an excellent experience. Let's start with some of the reasons I was less than thrilled with the technical aspects of the game. First, I played the game on the XBOX One, and it was too large for my screen. Little icons would pop up from time to time right on the edge of the screen, and I could only see one half of them. There were no options to change the screen size in the game's settings. I tried to change the XBOX One's resolution, and I tried fiddling with the TV's resolution, but nothing worked. It wasn't a game-breaking problem for me, but it was nevertheless a small, persistent annoyance. Second, there weren't any sensitivity options in the controls settings. The horizontal look sensitivity was fine; it was the vertical sensitivity that drove me bonkers: it was way too slow. Looking up and down seemed to take an eternity. Again, it wasn't a game-breaking problem, and I got more-or-less used to it by the time the game was over, but it was still the sort of thing that occasionally interrupted my experience and reminded me that I was playing a game. Third, there were also a few weird moments where meshes would completely disappear from the world. Thankfully, these were very rare. Fourth, there were weird "freezes" throughout the game, especially early on. For the most part, the game ran fluidly, but there were little moments — usually as I ran — that the game froze for a fraction of a second. Since these occurred mostly when I was running, I suspect that they may represent moments in which parts of the (very large) map were being loaded into the game. For whatever reason, they became increasingly infrequent as the game progressed. Finally, the controls for running were pretty janky. I spent a ton of time moving around the map — in fact, that's probably 90% of what I did — and being able to move quickly and efficiently was paramount. On the XBOX One, I could either run by holding down a button (I forget which one) or pressing the X button once to toggle running. I forgot the button for the former option because I spent so much time using the latter one. But here's my problem with it: any time I slowed or stopped, the toggle became untoggled. So, if I stopped for a half-second to examine some part of the path and then started moving again, I'd have to re-toggle the running mode. I never got used to that problem, which meant that I felt as though I was stuck in molasses every time I started moving again. As I don't doubt that my fingers would've gotten tired from holding down a run button for hours, I'm sure that the run toggle button was a good idea ... but I wish that it had been a permanent toggle.'''
