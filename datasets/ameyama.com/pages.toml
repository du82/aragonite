["https://ameyama.com/blog/hope"]
title = "雨山"
full_description = '''When I was in high school (a private, Christian high school), we sang a song in choir that I loved called "Oh, How Can I Keep From Singing?" by Robert A. Harris. I could only find about two recordings of it on YouTube, and here's the better one. And here are the lyrics: I still think it's a beautiful song; some of the harmonies are quite haunting, and I'm a sucker for Picardy thirds approached step-wise. 😀 It actually took me a while to hunt down this recording; I couldn't remember who the composer was, and there are many different settings of the original text and many arrangements of the original hymn. As I was trawling through a billion YouTube recordings of the other settings, I noticed that they were all, well ... shallow and irritating, to be honest. Most of them were in major keys with moderate or fast tempos. There was even some syncopation! (*clutches pearls*) Admittedly, the Harris version was the first setting of the text I ever encountered, so it's quite natural that my opinion of what an "appropriate" setting of the text should sound like was inevitably shaped by him. However, I found even in my last few years in Christianity that "happy" songs rarely fit my experience. Life, as the Buddhists say, is suffering. If you believe that there's an all-powerful, all-knowing, all-good God out there who has your best interests at heart, who'll lift up the oppressed and punish the oppressors, and who'll save you from death by whisking you off to eternity in paradise with him after you die, then of course you have something to be happy about. But that doesn't negate the fact that our experiences while we're living can be quite close to the popular image of hell: eternal conscious torment. And, as C.S. Lewis said, sometimes loss is real; sometimes, things get lost in such a way that even God can't or won't bring them back, and they're simply gone forever. Harris' minor setting of the song captures some of that suffering and loss in a way that other settings don't. I'm not saying that all happy songs need to be minor, but I do think that songs that purport to examine the totality of experience shouldn't be flippant or blasé about the actual state of things.'''
