["https://ameyama.com/blog/a-pre-thanksgiving-cornucopia-of-updates-part-1"]
title = "雨山"
full_description = "NOTE: There are a few spoilers for the books, shows, and movies discussed, but I've colored over them in black in case you don't want to read them. If you do want to read them, just click on them! (For those of you reading in RSS readers, I have no idea whether the spoilers will be hidden or not! Good luck!) Over the past few months, I've started a bunch of drafts of long-form posts on various topics, but I haven't actually followed through and completed them. So, rather than allowing them to rot in my drafts folder for all eternity, I'm just going to dump them out here in short(er) form. I cover several unrelated topics, so don't feel pressured to read all (or any) of them if they don't interest you. Enjoy! A few months ago, I played through Hellblade: Senua's Sacrifice. I had hardly heard of the game before noticing it on sale for super cheap in the XBOX store; but after seeing that it got a 9/10 rating from IGN, I figured it might be at least worth trying. I think I can say without reservation that this game has the best opening act of any game I've ever played. I was utterly and absolutely riveted, glued to my screen, for at least the first 30 minutes (or maybe an hour; I was so focused I'm actually not sure how much time passed before I took my first break). I've never been sucked into a world so quickly and held there so firmly. And I've rarely rolled through such a spectrum of emotions in any game, movie, TV show, or book in such a short time. I wasn't prepared for any of it: the beauty and horror of the world, the way the world and Senua's state of mind reflect and affect each other, the perilous climb around the waterfall, the first vision of Druth, the first frantic fight with the Northmen, the dire warning above the gates barring the way to Hellheim. I've never been afraid of death in a video game before, but this game made me afraid of it. And that feeling of fear only intensified as the story progressed. Running frantically through the fiery forests in Surt's domain, getting turned around and lost in Valravn's keep, seeing the enormous and terrifying form of Hela crawling towards me over the bridge to Hellheim, creeping through the blindness and decay and misery of the shard trials, wading through the bloody sea of corpses, dashing between pools of light to avoid the terrors lurking in the shadows of Hellheim, and finally meeting Hela face-to-face — all of it was a blood-pumping, adrenaline-surging, heart-racing, exhausting, terrifying, beautiful fever dream of an experience."
