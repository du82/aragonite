["https://ameyama.com/blog/2021-the-year-in-review"]
title = "雨山"
full_description = "I only wrote one blog post this year?! That can't possibly be right. I guess I haven't written much this year because it hasn't felt like much has been happening. It was a sort of quiet, low-key year — which is no bad thing, of course. But I guess I also feel like I sort of stumbled through it with my head down, watching my feet but not really watching the path, if that makes sense. How did 2021 already slide by? The main thing I remember about this year is the progress I made overcoming grief and trauma. I started seeing a therapist (or counselor? I'm not sure which is the right term) sometime in June. She diagnosed me with PTSD from the shit that happened back in 2018. That diagnosis marked an important shift for me. It validated the struggles I was having with depression and anxiety, especially the panic I felt every time I thought back to 2018. And putting a label on the otherwise nebulous blob of memories and feelings made it easier to talk about and deal with. To treat the PTSD, my therapist recommended EMDR therapy. I didn't know anything about it, but I figured it couldn't hurt to try it. In the version we used, I held a little vibrating buzzer in each hand. My therapist controlled a little device that caused the buzzers to alternate their vibrations back and forth, left hand and then right hand. A typical EMDR session went like this: The results were astounding. Honestly, I was very surprised at how effective it was for me. After 8 weeks, I was able to think about the very worst memories from 2018 with virtually no emotional or physical response at all. I still felt sadness and resentment, but I no longer felt like I was going to have a panic attack. The grief remained, but the crises and out-of-control spiralings were defused. To be clear, I don't know which bits actually made the difference. My improvement could be attributed to EMDR, but it could also have been caused by talk therapy generally, or by spending time focusing on horrible memories in a safe space, or by being mindful of my mental and physical responses, or by the combination of all of the above. In other words, your mileage with EMDR may vary. But some combination of those factors was very effective for me."
year_published = 2025
