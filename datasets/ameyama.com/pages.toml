["https://ameyama.com/blog/2015-the-year-in-review"]
title = "雨山"
full_description = '''As I was browsing Twitter today, I saw that lots of people had been posting year-in-review posts, and I thought that I should do the same — not just because I always do whatever the crowd does, but also because I think that there's real value in reflection. So, what did I do in 2015? Well, 2015 was a relatively formative year for me for a variety of reasons. Chief among those reasons was the fact that I quit my job as a public school teacher after 3.5 years of suffering and transitioned into private lessons. Initially, I was worried that private lessons would be as painful as classroom teaching, but I was pleased to discover that my worries were unfounded. This transition led to a variety of confirmations of hypotheses that I had entertained about myself and about education. First, I finally concluded that performing the job called "classroom teacher," especially in a public school, actually requires one to be both a communicator and a policeman: classroom teachers must both communicate and reinforce information and processes and keep the students on track by enforcing rules. In direct relation to this, I finally concluded that I am not that kind of policeman: I have neither tolerance nor time for misbehavior. I won't put up with it and I won't take the time to manage it. (Nowadays, as a private instructor, if students misbehave, I simply don't teach them any more. It's glorious.) When my past administrators noticed my lack of classroom management, I'm sure that they thought that I was just lazy or ill-prepared or under-trained or overly-friendly with the kids or something — but really, I chose not to employ classroom management techniques simply because I believe that they shouldn't be necessary. Redirection and similar tactics are just a stall; what's really needed is for the students to learn respect. Respect is something that the students must learn how to give — it's not something that can be taken by a teacher — and so I focused my efforts on eliciting it from them by treating them with all of the respect I could muster. In other words, I tried my best to treat them like adults, like fellow human beings. I won't say that this was 100% successful, or even necessarily 50% successful, but I at least feel that I earned the respect of all but the douchebaggiest of students. I've learned, too, the truth of the leading-a-horse-to-water adage, which has changed my approach even in private lessons. I no longer try to control the direction of the lessons. Instead, I merely ask what the student wants to work on, and then attempt to guide them in the learning process. Again, to parents and administrators on the outside, this might look like lunacy. Let the students direct the lessons?! But I know that it works because I know that I can't force a student to work on something that they don't want to work on ... but I can try to harness as propulsion their natural interest in any particular topic. Second, I've read recently (though I can't find the link right now) that computer scientists that are self-taught tend to be more successful in the long run than those with just a college degree. Of course, this is probably only one instance of a broader principle about education and success, and it's surely controversial, but it at least seems to be true in my own life. Therefore, I've made it my mission in my private lessons to try to impart a desire and a toolkit for learning to the same degree to which I try to transmit the theory and practice of whatever subject it is that we're discussing.'''
