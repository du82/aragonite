["https://ameyama.com/blog/night-in-the-woods"]
title = "雨山"
full_description = '''You guys, I just finished Night in the Woods. Holy crap, you guys. Holy crap. This game. SO GOOD! I have so many things to say. I don't even know where to start. But here I go anyway. As with my Firewatch review, I need to start with the less-than-pleasant aspects of the game. They'll be quick, I promise. I really want to get to the good stuff! First, there were an ASS-TON of loading screens. Walk five feet in any direction — BOOM. Loading screen. Transition screens might've been acceptable at such frequencies, but loading screens (which typically lasted 3 to 5 seconds) were extremely annoying. A few seconds may not sound like a lot, but when you multiply it by an ass-ton, you get 3 to 5 ass-tons of seconds wasted in loading time. Personally, I've never made a commercial-scale game, so I'm not fully aware of all of the technical difficulties of asset loading, but other games have definitely figured out this problem and have designed fluid transitions between large level set pieces and/or between scenes. Second, there were some audio glitchings. It was hard to tell if these occurred because of some aesthetic choice to slow the music down, or because the engine's performance was suffering under some heavy load. I'm pretty sure it was the former, since I never noticed any performance hits on Mae's responsiveness. There were a couple of places at the edge of town where the music (played by a MIDI engine rather than as audio files?) was slowed down and faded out. At those times, the audio started glitching, clipping, and stuttering. Aside from those two things, the game ran really smoothly, and I never encountered any other bugs. Kudos to the developers! NITW is a game about choice and exploration. I've only played it once through, so I don't know how many variations in story there are, but my choices in dialogue and in how and where and when I explored the town clearly affected the shape of the plot. Like many games, NITW had "sidequests," but that term seems inadequate to describe the actual experiences of those parts of the game. In other games, sidequests are typically disconnected from the main plot line. This allows them to be optional for the player, who may not discover them, but it also makes them feel cheap, since they have no effect on the central story. But NITW's sidequests felt more like plot lines waiting to be discovered. They weren't easily or quickly wrapped up, and they instead ran alongside the main plot line for many days, frequently interacting with it by seamlessly weaving in new dialogue options and providing new places to explore.'''
