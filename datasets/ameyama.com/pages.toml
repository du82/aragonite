["https://ameyama.com/blog/4th-of-july"]
title = "雨山"
full_description = '''NOTE: I posted the following thoughts in Twitter form earlier today, but I wanted to post them in long form here. Enjoy. Happy 4th! I still believe in the American ideals, even if I don't believe in half of the American people right now. Remember, while your white nationalist neighbors are celebrating, that patriotism does not equal racism or bigotry of any kind. All humans are equal. Such bigots may think they're being patriotic, but they actually don't believe enough in the Constitution's values of equality. The same goes for Christian zealots who use America's heritage as a way to oppress religious minorities and attempt to marry church and state. May we learn to live up to our own ideals, and may we make America kind and noble and just and fair again. Let's "make America great again," but not in ways that increase inequality and injustice or that foment division or incite violence. Here are some relevant quotes from Dr. Martin Luther King, Jr. Sorry for being so preachy; it's just that there seem to be so many people for whom common decency and kindness are foreign concepts. I'm really thankful for those that are right now on the front lines of the struggle for "truth, justice, and the American way." I appreciate people from all parties who are willing to do the hard, uncomfortable work of reaching across the aisle and working together. I appreciate journalists and media organizations who work hard to shine the light of truth on corruption, incompetence, and dishonesty. I appreciate those who work hard to serve the public interests instead of their own interests, even if I sometimes disagree with particular policies. Okay, now I have to leave to do family things, so I suppose I'll wrap up this thread now. Thanks for tuning in. Happy 4th!'''
