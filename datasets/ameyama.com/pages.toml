["https://ameyama.com/blog/between-the-world-and-me"]
title = "雨山"
full_description = '''I recently finished Between the World and Me by Ta-Nehisi Coates. It was so powerful, so devastating. Here are a handful of my favorite quotes. "This leads us to another equally important ideal, one that Americans implicitly accept but to which they make no conscious claim. Americans believe in the reality of “race” as a defined, indubitable feature of the natural world. Racism ⁠— the need to ascribe bone-deep features to people and then humiliate, reduce, and destroy them ⁠— inevitably follows from this inalterable condition. In this way, racism is rendered as the innocent daughter of Mother Nature, and one is left to deplore the Middle Passage or the Trail of Tears the way one deplores an earthquake, a tornado, or any other phenomenon that can be cast as beyond the handiwork of men. But race is the child of racism, not the father. And the process of naming “the people” has never been a matter of genealogy and physiognomy so much as one of hierarchy. Difference in hue and hair is old. But the belief in the preeminence of hue and hair, the notion that these factors can correctly organize a society and that they signify deeper attributes, which are indelible ⁠— this is the new idea at the heart of these new people who have been brought up hopelessly, tragically, deceitfully, to believe that they are white." "I didn't yet realize that the boot on your neck is just as likely to make you delusional as it is to ennoble." "Poetry aims for an economy of truth ⁠— loose and useless words must be discarded, and I found that these loose and useless words were not separate from loose and useless thoughts. Poetry was not simply the transcription of notions ⁠— beautiful writing rarely is. I wanted to learn to write, which was ultimately, still, as my mother had taught me, a confrontation with my own innocence, my own rationalizations. Poetry was the processing of my thoughts until the slag of justification fell away and I was left with the cold steel truths of life."'''
