["https://ameyama.com/blog/passgen"]
title = "雨山"
full_description = "Hey! I noticed today as I was updating my projects page that I hadn't written about Passgen before. Passgen is a stateless password generator. In other words, you enter some information and it spits out a password for you. It'll always generate the same password for a given set of inputs. So, if you always enter the same domain, username or email address, and master password, it'll always generate the same password. A stateless password generator like Passgen is an alternative to using a stateful password manager (one that stores your data somewhere). I'm not sure yet whether or not I'm ready to use it for all of my passwords, though; I'm still testing it out. There are a few known limitations to stateless password managers. I'll explain the first one by giving an example. In a stateful password manager, you could generate a new password for this particular set of credentials without needing to change any of the information. However, in a stateless password generator like Passgen where the same inputs always generate the same password, you'd have to change at least one piece of information in order to generate a new password. You could make a change as simple as adding a number to the master password, changing it from helloworld to helloworld1, which would yield a completely new password that looks nothing like the last one: 2dee48fa3153902e1bf87a0d8decee7e. You could also generate a completely new password by changing the domain or username values instead of, or in addition to, the master password value. Well, that's great and all, but now you'd have to remember a new master password for this set of credentials. If you didn't change the master passwords for all of your other credentials to match this new master password, then after a while you'd probably end up in a situation in which you'd be remembering a different master password for each set of credentials, which is hardly better than not using a password manager at all. However, the one advantage of using a stateless generator even in such a scenario is that it's still possible to remember extremely simple inputs (changing them by (for example) only one character at a time (though I'm not necessarily recommending such a strategy)) and keep track of simple state changes in your head, while at the same time being able to generate completely different passwords for each credential set."
