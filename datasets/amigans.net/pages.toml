full_description = '''Forum Index Board index » All Posts Bottom Topic options View New posts View all topics View mode Oldest First (1) 2 3 4 ... 7332 » McFly Re: AmigaOS 4 Monthly Roundup - February 2025 Posted on: Today 4:49 #1 Just popping in @AmigaOldskooleranother great blog from you, thank you for the great reporting.Thumbs up for that GAP - German AMIGA PodcastGAP on facebook Topic | Forum TheMagicSN Re: AmigaOS 4 Monthly Roundup - February 2025 Posted on: Yesterday 21:30 #2 Just popping in It will be released VERY soon ;) there will of course be an announcement. Topic | Forum sailor Re: AmigaOS 4 Monthly Roundup - February 2025 Posted on: Yesterday 21:17 #3 Quite a regular @AmigaOldskoolerthanks for nice review@TheMagicSNand many thanks for GemRB - it looks great! AmigaOS3: Amiga 1200AmigaOS4: Micro A1-C, AmigaOne XE, Pegasos II, Sam440ep, Sam440ep-flex, AmigaOne X1000MorphOS: Efika 5200b, Pegasos I, Pegasos II, Powerbook, Mac Mini, iMac, Powermac Quad Topic | Forum white Re: QEMU GPU vfio-pci pass through Posted on: Yesterday 19:33 #4 Quite a regular Time passes inexorably and I would say that I have used AmigaOS in its time. 30 years have passed now.I will return to the topic of emulation when I see more concrete developments.So good work to everyone.In the hope of seeing new developments from everyone.Today I ordered 2x 16gb ( CORSAIR VENGEANCE RGB PRO 3600MHz 32GB ) they are not the best but they are what I was looking for and for the price paid they are fine.If I sell the ( 16gb of 8gb each 3600MHz CORSAIR VENGEANCE ) and add something a Radeon 580 card I could take it if this would fall within the right cards for emulation.I can not even say anything about the driver ( sm501 ) after all it was not designed for AmigaOS 4.1 but it was an intuition for emulation.And it's clear that it has its flaws.Okay see you soon Give him the strength to sing your hymns.He will work until he breaks his back.He will plow these immense fields.He will sow and reap the fruits of his labor.He will cut down woods, build houses and raise livestock.And when at nightfall he returns to his home destroyed by fatigue, joyful and happy, he will come to your temple to sing your glory, O Lord.Thank you for having taken our brother back into your flock.Make him worthy of your mercy and Illuminate his ephemeral existence with the light of his spirit."Brother Tobias"I like to be ironic, who knows if anyone has ever seen this film, they're old now What do you see when you close your eyes ?I see light, lots of lightI see you, dadAnd I see mommy tooAnd I see me and we are togetherAnd we play forever. Topic | Forum 328gts Re: AmigaOS 4 Monthly Roundup - February 2025 Posted on: Yesterday 19:16 #5 Home away from home thanks for another great roundup & looking forward to setting up Baldurs Gate ! _______________________________c64-dual sids, A1000, A1200-060@50, A4000-CSMKIIICatweasel MK4+= Amazing ! My Master Miggies-Amiga1000 & AmigaONE X1000 !mancave-ramblings Topic | Forum 328gts Re: 2025-February/ March-Gaming Competition- A Frog Game Posted on: Yesterday 19:12 #6 Home away from home @Mr_bytelooking forward to a good battle and may the best Frog win _______________________________c64-dual sids, A1000, A1200-060@50, A4000-CSMKIIICatweasel MK4+= Amazing ! My Master Miggies-Amiga1000 & AmigaONE X1000 !mancave-ramblings Topic | Forum TheMagicSN Re: AmigaOS 4 Monthly Roundup - February 2025 Posted on: Yesterday 18:33 #7 Just popping in Thanks again for the coverage here are still some fps numbers on Baldur’s Gate which were not ready in time for your report:A1222 Baldur’s Gate 118 fpsA1222 Planescape Torment24 fps(Same system seems torment is faster)And yes the game definitely runs on a1222though on a softfloat version. I actually plan to try if the same compiler optionscan make Heretic2 run on a1222.MicroAmigaOne 800 mhz8-10 fps (betatester said „still feels playable though“,Note he did only try one character, no full 6characters test on this one, neither on a1222)x5000 baldurs gate 2 1024x768Further x5000 specific optimization raised thisfrom 26 fps to 30 fps (remember 30 fps was the limit of the engine).And some news on the WarpOS Version (which willbe released at a later time than the os4 version though):Ragnarok g3 800 mhz overclocked to 1 ghzAll 4 games around 24-25 fpsI am actually extremely impressed by that WarpOS test. Topic | Forum rjd324 Re: Dear ImGui Posted on: Yesterday 17:53 #8 Quite a regular @Capehillhttps://github.com/3246251196/SpaceCadetPinball If liberty means anything at all, it means the right to tell people what they do not want to hear.George Orwell. Topic | Forum pjs Re: Something is going on Posted on: Yesterday 17:07 #9 Not too shy to talk Yeah, apparently ko-fi doesn't care much for Miggies...But I found at least the parts of the ko-fi page including thescreenshots will appear in IBrowse ONLY if you kill javascript*BEFORE* going to the page.Just go into IB prefs, URL settings and make an entry for#?ko-fi.com#? that deactivate JS.Aside from ko-fi, the work on Qt6 looks really impressive,I hope the apps are holding together well and we get to playwith them soon!...patience, patience, patience... ;D/me fires up loonix to go make a contribution...PJS Topic | Forum pjs Re: Airprint betatesting Posted on: Yesterday 16:31 #10 Not too shy to talk @Paul"BTW, I've noticed that several PDF's from Pagestream Amiga didn't print."Hi Paul,I meant to answer earlier about Pagestream and PDFs... I makea lot of PDF files with Pagestream (filling out forms for work)and I've found the built in "Save as PDF" never works well.OTOH, if you use the regular Pagestream printing system thenyou can make great PDF files. Just follow these steps:- In the Pagestream print set up window, set Pagestream to print in "Postscipt" mode- Select the PPD config file for the "HP/HPLaserJet4P-4MP300" (I found that's one of the best printer descriptions for doing this).- Set to have "Font unload" set for the document.- Set to send to disk file.- Obviously, in the setup window you set page formatting for your document.- With send to disk file, the main print window will show a "Save" button. When you click that, Pagestream will ask for a filename and then create a postscript file there of your Pagestream document.- With the AmigaOS ghostscript CLI program or with AmiGS you can then make a PDF file that will include all the fonts, etc. that Pagestream typically misses in the PDF files it makes. FYI, the command line for ghostscript I use (in an alias) is:gs -sDEVICE=pdfwrite -dNOPAUSE -dBATCH -sOutputFile=[PDF FILENAME] [PS FILENAME]- Obviously, you should also be able to print directly from ghostscript or AmiGS using their postscript outputs if the drivers and printers accept postscript input.You might even be able to use the same postscript printing method to print directly to airprint as if it were a postscriptprinter, but I haven't tried that yet. Just gotta get all thebits to work together! ;)Good luck,PJS Topic | Forum AmigaOldskooler AmigaOS 4 Monthly Roundup - February 2025 Posted on: Yesterday 15:51 #11 Quite a regular Hi everyone,March 1st today and time for a new edition of the AmigaOS 4 Monthly Roundup! Hope you'll enjoy browsing the news. Cheers! https://oldschoolgameblog.com/2025/03/ ... ly-roundup-february-2025/ Old School Game BlogThe AmigaOS 4 Monthly Roundup Topic | Forum MamePPCA1 Re: recommended PSU for X-5000 Posted on: Yesterday 13:40 #12 Quite a regular @GregorThank you very much!!!I will try then later Amiga 500 1MB Chip RAM with ACA 500+ACA1232,CD32,Amiga 1300 030/50 Mhz,32MB (now on my hands at least)and Amiga One G3 XE PPC 800 Mhz,ATI Radeon 9250 128 MB,256 MB RAM,Seagate 200 GB HD,2 working DVD drives,X-Arcade double for MAME,Sil0680,4 USB ports,LG Topic | Forum Gregor Re: recommended PSU for X-5000 Posted on: Yesterday 12:53 #13 Just popping in @MamePPCA1You can check the nearest dealers from this site:https://seasonic.com/locations/In my country the price of TX-650 varies between 225 and 250 eur (without shipping). Topic | Forum Capehill Re: Dear ImGui Posted on: Yesterday 12:19 #14 Just can't stay away @FlynnTheAvatarI suppose you mean the A500 emulator. Is it open source? I heard about that today so I can't say much.@afxgroupI'm planning to use this with some of my own software if I ever find time to work on those :/@jabiruloYes, need to investigate is it SDL3 or ImGui issue.@rjd324Cool. I have tried Spacecadet but didn't realize that at time. Does it use OpenGL context or SDL_renderer backend? I noticed ImGui's SDL_Renderer uses geometry calls which cannot be properly implemented with CompositeTags due to missing vertex colors. Of course software, OpenGL or OpenGLES2 work with SDL_renderer too. Topic | Forum MamePPCA1 MAME 0.106 doesn't open GUI Posted on: Yesterday 11:59 #15 Quite a regular Hello Amiga freaksWell to be honest don't know why after "stablashing" my AmigaOS 4.1 (now it boots ever without issues) I cannot run xMAME 0.106 GUI even asigning to it to the xMAME 0.106 route on Workbench.Also I have 4 or 5 different versions of MAME that sometimes runs and don't know if they are making the competence or in reality I think something happens.I have 3 user-startup files in S: One for xMAME 0.106,other for a version of MAME that I downloaded (not the version with the exe) 1084 roms without any pc emulator of this awesome piece of ar that is MAME.And of course the one that I am using now.Please someone help me,I am really suffering now the absence of this awesome emulator.For me MAME is all.Also Steffen if you are near,please mke for us the Amigan users a new version of MAME. Amiga 500 1MB Chip RAM with ACA 500+ACA1232,CD32,Amiga 1300 030/50 Mhz,32MB (now on my hands at least)and Amiga One G3 XE PPC 800 Mhz,ATI Radeon 9250 128 MB,256 MB RAM,Seagate 200 GB HD,2 working DVD drives,X-Arcade double for MAME,Sil0680,4 USB ports,LG Topic | Forum rjd324 Re: Dear ImGui Posted on: Yesterday 10:59 #16 Quite a regular Spacecadet Pinball which is on OS4Dev also uses a basic imgui gui. If liberty means anything at all, it means the right to tell people what they do not want to hear.George Orwell. Topic | Forum jabirulo Re: Dear ImGui Posted on: Yesterday 10:43 #17 Just can't stay away @CapehillWorks fine here on SAM460ex +RX550 Great job.example_sdl3_opengl3 opens in a minimal size window (100x150), the other ones open full size window Topic | Forum MamePPCA1 Re: recommended PSU for X-5000 Posted on: Yesterday 10:22 #18 Quite a regular @GregorMy AmigaOne X5000 tries to boot at first but it leads me to press 2 times the power button in order tom power onI want a 500W or 660W PSU one for my needs.Where can I buy it? And at which priceI am with this annoying and "unprofessional" issue since ages.Cheers Amiga 500 1MB Chip RAM with ACA 500+ACA1232,CD32,Amiga 1300 030/50 Mhz,32MB (now on my hands at least)and Amiga One G3 XE PPC 800 Mhz,ATI Radeon 9250 128 MB,256 MB RAM,Seagate 200 GB HD,2 working DVD drives,X-Arcade double for MAME,Sil0680,4 USB ports,LG Topic | Forum sailor Re: X5000 optimized code compile Posted on: Yesterday 9:53 #19 Quite a regular @msteedQuote:msteed wrote:It would also be nice to know if there's a single "-mtune=" option that gives the best average performance increase across all the superscalar CPUs used in Amigas while not causing any problems with those that aren't superscalar; something that could be used as a default 'tune' for a program that wants to run on any PPC Amiga.All powerpc CPUs are superscalar. And even M68060 is superscalar CPU - first one on Amiga world.But there are big difference between number of execution units, pipes parallelism and in many other parameters.It varies from 5 execution pipelines (603e, 440ep and 460ex) to 10 (G5) and 11 (G4).As corto said, probably the best solution is leave it to powerpc default.One thing which from my point of view is important: extensionsAltiVec, SPE and MACBut use it only for critical tasks like coding/decoding etc. and of course SPE also for FPU-heavy tasks.Also isel should be considered, but only together with above three.And only for code with this extensions we can play with -mtune. In real, all extensions are connected with certain CPU, so -mtune should be used only with PA6T for which gcc has no exact state machine. ( maybe also P1022, but e500v2 core is very close to e500v1 core in 8540 = SPE default cpu ). Edited by sailor on 2025/3/1 10:47:32 AmigaOS3: Amiga 1200AmigaOS4: Micro A1-C, AmigaOne XE, Pegasos II, Sam440ep, Sam440ep-flex, AmigaOne X1000MorphOS: Efika 5200b, Pegasos I, Pegasos II, Powerbook, Mac Mini, iMac, Powermac Quad Topic | Forum afxgroup Re: Dear ImGui Posted on: Yesterday 9:26 #20 Amigans Defender I've compiled a lot of software with ImGui. It is working very well under Gl4es i'm really tired... Topic | Forum Top (1) 2 3 4 ... 7332 » [Advanced Search] -- Select a Forum -- [Amigans website] Amigans information Amigans feedback [Software] AmigaOS4 Amiga Classic Amiga Emulation [Games] AmigaOS4 Amiga Classic Competitions [Hardware] AmigaOS4 Amiga Classic [Development] AmigaOS4 Amiga Classic [Software Support] AmiCygnix Amiga Bourne Compatibe Shell Official AmigaOS4 feedback AmiKit Cinnamon Writer CodeBench Digital Universe Dopus 5 E-UAE Gnash IBrowse JAmiga Odyssey OWB SmartFileSystem Timberwolf TouchDevice TuneNet Unsatisfactory Software Qt [Other] Too Hot to handle Free for all Classifieds Polls New Member Introduction OS4Depot feedback Amiga General Forum'''
