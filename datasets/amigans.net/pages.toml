full_description = "Publications : New articles on Obligement Posted by daff on 2025/3/1 15:27:36 (190 reads) The following articles have been added to the website of the Amiga magazine Obligement (http://obligement.free.fr) during the last two months: Read more... | 1832 bytes more | Comments? Amiga Events : The Revision Satellite Returns to Puçol! Posted by amigatronics on 2025/2/25 22:59:40 (259 reads) The Revision Satellite is back in Puçol from April 18 to 21, 2025! After a successful first edition, this event continues to grow as a key meeting point for Amiga and demoscene enthusiasts in Spain. As an official satellite party of the prestigious Revision Party in Germany, it brings the spirit of the legendary event closer to local fans. Read more... | 1171 bytes more | Comments? Publications : The Amiga Future magazine Issue 173 - preview is now available to view online Posted by AndreasM on 2025/2/25 10:41:37 (241 reads) These comprise of the full colour preview and excerpts of our Amiga Future issue 173 (March/April 2025) which can also be viewed online on the Amiga Future website. Read more... | 3416 bytes more | Comments? Software News : SQLite Manager updated to V0.6 Posted by lazi on 2025/2/17 17:41:59 (612 reads) Download OS4, MOS, OS3.1, Aros version from Aminet.It is still alpha, so feature requests, bug reports are welcome! Read more... | 996 bytes more | Comments? Hardware News : Analysis: New Keyboards for A1200 from AMIGAstore Posted by amigatronics on 2025/2/17 17:41:35 (266 reads) We analyze the new AMIGAstore keyboards for the A1200 on our blog, covering all the details about their features.https://bit.ly/4aZgamp Comments? Publications : Amiga Future: New full versions online Posted by AndreasM on 2025/2/14 0:18:46 (247 reads) The download area of the Amiga Future was updated today. So, you can now find the following full versions online:- Nippon Safes Inc- König Eduard- Jonathan Train It- Mars Tank Attack- Ts ImbissAn overview of the recent uploads and changes to the download database of Amiga Future is also available from this link:https://www.amigafuture.de/app.php/dlext/latest Read more... | 1580 bytes more | Comments? Publications : Old Amiga Future Issue 146 in german & english now online Posted by AndreasM on 2025/1/31 18:16:06 (323 reads) Since today you can read the Amiga Future issue 146 online on our webpage.In irregular intervals we provide older issues of the Amiga Future for free online. Read more... | 1189 bytes more | Comments? Internet News : New Ownership of Hyperion Entertainment CVBA – New Director Appointed Posted by walkero on 2025/1/20 22:14:34 (1453 reads) At a general assembly held on December 18, 2024, organized and convened by the temporary administrator, the shareholders of Hyperion Entertainment CVBA appointed Timothy De Groote as the company’s new director. Read more... | 804 bytes more | 9 comments Publications : Boxed version of Sky Shapers released Posted by AndreasM on 2025/1/20 14:04:21 (610 reads) We are pleased to announce that the boxed version of the new game Sky Shapers is now available in the APC&TCP online shop.The game is delivered on CD in a large cardboard box with a printed, detailed manual and an A3 poster. Read more... | 2007 bytes more | Comments? Software News : Warp 3D for PiStorm Posted by Nuder_Try on 2025/1/17 15:35:15 (651 reads) A kick starter to get 3D drivers for the PiStorm!https://www.indiegogo.com/projects/warp3d-for-pistorm/x/16302387#/ Read more... | 2 comments (1) 2 3 4 ... 320 »"
