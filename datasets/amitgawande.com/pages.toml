["https://amitgawande.com/blog/2025/20250218-2232"]
title = "18 February 2025 at 22:32 | Amit Gawande"
description = "I logged into my system today with a plan to jot down what I had in my mind. What I did was keep my mind numb and just strolled around the web. I hate …"
full_description = "18 February 2025 at 22:32 I logged into my system today with a plan to jot down what I had in my mind. What I did was keep my mind numb and just strolled around the web. I hate doing that, but I do that often to know something does not sit right. Inspiration. Motivation. All are just words. They don't appear silently. Even if they do, they don't help. I might be as inspired or motivated as I have been during my productive best periods, but it's all moot if I cannot get things rolling. Such have been the days recently. There are many drafts but few posts. Do I feel pressured? Not at all. I have never felt the pressure of unpublished words. After all, I don't write with any goal in mind. Disappointed? That I am. Disappointed that I am slowly losing the love for things that I once enjoyed. An observation without any dissection, for now."
