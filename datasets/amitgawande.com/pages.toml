full_description = "Hello 👋🏽, I am Amit GawandeA software developer by profession and a writer by interest, I work at & live in Pune. I read mystery, humour and philosophy. I write words for humans and machines with a passion for writing fiction.I professionally work building backend services, but I also love designing interfaces on the web. I grew up as an introverted kid in a town in the central part of India.This is no longer a blog; it is my website. I elaborate here. Start Here On Writing on Web 2024 On Feeling like Shit 2024 On Writing Less 2024 Avoiding the pain of doing nothing 2023 Be alone, get bored 2023 Interaction, not Reaction 2023 Thinking about Writing 2023 Not a natural blogger 2022 Stock and Flow 2022 A Lesson in Staying Positive 2022 What about Social Media is bad? 2022 Managing unreasonable expectations from time 2021 Why Do I Write? 2021 Perfectionism Isn’t Healthy 2020 Slow Down. Be Present. 2020 I am getting used to this new normal 2020 It’s just some bottled clay.. 2019 Walking through a foggy street 2019 Reflecting on the last 10 years 2019 Creativity and Parenthood 2018 Time. Those fleeting moments of time 2018 We Should All Write. Everyone Can. 2018 Pen is, still, mightier 2014 Stop overthinking 2013 Speechless 2007 Recent Posts No Navigation for Real Life February 27 Not Listening to Audiobooks February 26 Blogroll Conundrum February 16 Thoughts Confetti February 10 Rotting Links on the Web January 01"
