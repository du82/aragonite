["https://www.amitgawande.com/blog/2020/shuddering"]
title = "Shuddering - A flash fiction | Amit Gawande"
description = "Raghav woke up from his deep slumber; he wasn’t prone to these breaks in his sleep as long as there wasn’t a reason for that. He felt he heard a constant …"
full_description = 'Shuddering - A flash fiction Raghav woke up from his deep slumber; he wasn’t prone to these breaks in his sleep as long as there wasn’t a reason for that. He felt he heard a constant buzzing sound; he wasn’t hearing any now. He attempted to gain his full senses. He looked at the dimmed screen of his iPhone; it hadn’t woken him up as there were no new notifications. He wasn’t fully awake yet as he could hardly see anything around through his dizzy eyes. He attempted to see the time again on his iPhone; the screen read 03:28. He didn’t feel thirsty nor did he want to take a leak.He got up and tottered along the floor to the bathroom. "I am awake anyway, might as well go visit the bathroom". He got back to the still, dark room. The clock on the wall read 03:30 now.Just as he fell flat facedown on the bed, the sound hit him again. He could clearly hear the steady, deep buzzing noise that had woken him; he was absolutely certain it wasn’t coming from something in his room. He got up, this time fully awake, wide-eyed. He was convinced it was a sound he had heard before, a rattle of sorts on a wooden top. He got out of his bedroom; he was certain now that the sound was coming from downstairs. He tried to calm his mind, suspecting it was his loneliness that was playing games.Raghav stepped onto the first stair and the sound stopped with the first creak of the wooden stairs below his feet. The lack of sound now made him even more nervous. Did he make someone or something aware of his presence? Why did the sound stop? The lack of persistent hum was making his legs shake. He stood frozen on the stairs peering into the darkness beneath. It was lifeless, as it should be. But even the normal made Raghav quiver. He felt that the narrow staircase was closing in on him on both sides, becoming narrower with each second that he stood there."I cannot stand witless here anymore," he thought. He flicked at the switch panel. The light hadn’t even filled the staircase yet and the heavy hum filled the empty soundless surrounding again. He was sure now that his mind wasn’t playing any games with him; there was something rattling on the dining table in the kitchen. He took a deep breath and ran down the staircase. He stood at the entrance of the kitchen and peeked inside. It was pitch dark inside, except for the dancing light from a buzzing mobile phone on the dining table. Raghav was relieved it wasn’t an unexplainable sound. But the relief was only short-lived as the realization that the phone wasn’t his soon hit him.He ambled slowly towards the shuddering device; the screen visibly showed that there was an incoming call. Before he could see whom the call was from, the phone stopped ringing and fright struck him as the room went dark around him. He scuttled across the floor to the dining table, picked up the phone, and brought the screen back to life. He heaved a sigh as the faint light illuminated his surroundings. He hadn’t even exhaled the full sigh yet before the phone in his hand started to vibrate again. He slowly turned the now-brightened screen to face him; his face went white. The screen read Incoming call . . . Raghav iPhone.'
year_published = 2020
