title = "Speechless... | Amit Gawande"
description = "Speechless .... Thats how today's incident caught me. Really felt am i missing something? Am i really enjoying my life? Corporate world has indeed made me …"
full_description = '''Speechless... Speechless .... Thats how today's incident caught me. Really felt am i missing something? Am i really enjoying my life? Corporate world has indeed made me dry. Juiceless. Deprived of whatever fun element I had in my life. Saw the wetted earth today and there loomed the childhood days in front of me.Those hours I spent sitting on a sofa employing my eyes out at rain beaten roads. "Chai-Bhajji" or "Pohe" that i relished. Slightest sound of a rain drop that made me run towards the porch. Spellbound eyes of mine that tried to gulp up a sight of lush green fields. An enchanting effect that even a midget breeze created. The restlessness that a sight of river or even a small stream gave me. The dew-laden grass plates that endorsed the mesmerizing capacity of the nature. "Aai" who always dabbed me forcefully in the sweater and monkey-cap. Soothing effect that the cooler-chilled room created after returning from burning heat. Glasses of Rasna i gobbled. Waits for the "Chachaji-Sabu-Raka" Combo. Exchanges of comics and greedily moving through the pages, just to make sure we read the most. Carrom Games, Cards, Cricket matches that we played, ignorant of screeching sun, blowing winter or pouring rains. Dirty clothes that i washed so as to keep "aai" unaware of mud-ridden football matches. And the list just goes on, endless. I never knew what really allured me so strongly. But I do was.And today, here I am looking at the rain-hit porch from my AC cubical. Without a sofa, "Pohe"or "Chai Bhajji". Drops kept pouring, waiting for me to run into the porch. Lush-green lawn's spread out there, just to make me spellbound again. Gone are the rivers/streams and am in the middle of bulk of fountains. But these don't make me restless. "Aai Daddy" are there, always at the other end of phone line. Mirinda can't take the place rasna holds. Dan Brown or Sidney Sheldon can't surrogate "Raj or Diamond". "Batman-Superman" can easily be kneeled down by "Druv-Nagraj". Gone are the games. Gone are the friends. Gone are the fun-filled days. Nature's still out there. Calling me. Waiting to mesmerize me. With me completely oblivious.Thanks a lot, corporate world. Thanks a lot!!!'''
