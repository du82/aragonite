["https://www.amitgawande.com/surprise-me"]
title = "Spoiled by Choices | Amit Gawande"
description = "I have been writing a lot less recently, predominantly because I have to make a choice about where to write. Any hindrance between a thought and the place …"
full_description = "Spoiled by Choices I have been writing a lot less recently, predominantly because I have to make a choice about where to write. Any hindrance between a thought and the place to put it down kills the post for me. So many posts have died a violent death in this urge to choose.Kirby wants the title. I never thought it would be such a big deal, but it became a more significant issue than anticipated. I wish I could circumvent this forced restriction. I haven't explored whether I can—given all the control this platform provides on its different aspects, I won't be surprised if it does. But in my limited time reading around, I couldn't find an easy way to do that.I have a Scribbles blog that hosts some of my thoughts. It can host most of my posts, but I always question whether the post I am writing fits well there. Or if I should write it somewhere else. Why do I do that? Why do I question my writing so much?This is not the first time I have concluded that the tools don't matter. I should write the post anywhere I want and post it. What else is there to think about? Well, it is the reader.I overthink about making the post visible to more folks. Should the fact that I cross-post to social media matter? Even if I do not cross-post, does it matter how many people read my posts? Ideally, it does not.It does not matter how many people read what I write. It matters that some do. I sweat a lot (and unnecessarily) about that."
year_published = 2024
