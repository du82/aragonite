["https://www.amitgawande.com/blog/2020/slow-down-be-present"]
title = "Slow Down. Be Present. | Amit Gawande"
description = "I'm consciously slowing myself down recently while doing everything . I've spent too much time worrying about the small things, planning about things too …"
full_description = '''Slow Down. Be Present. I'm consciously slowing myself down recently while doing everything . I've spent too much time worrying about the small things, planning about things too far in future. I've realised I'm not living in the moment. That's not healthy. So, I'm taking time doing my regular day to day activities. Slow down. Take a pause. Be cognizant of the task am doing. Be present, doing it. Not think about 10 other things that I might have to do later in the day. That doesn't help. Keep things simple. I recently read this brilliant thought from Matt on Twitter. Fed up of the western idea of self-empowerment where you have to become a better you, discover your inner billionaire, get beach bodied, work, upgrade. It fuels a resistance to the present. It's self-loathing masquerading as empowerment. We need self-acceptance. Self-compassion.Matt Haig I can't agree more with Matt. I have decided to not be too harsh on myself. It's ok to not be "efficient" every time Not every activity needs to be done effectively. Or in the most time-effective way. Putting undue pressure on myself to plan things, multiple ones, so they can be grouped together. Nope, I am not ok to put myself through that anymore. All it does is adds to the already tall list of micro-stresses. Anyway, it's not as if I've too much work, too little time at hand.Do one thing at a time. Do it slowly. Be conscious. Be present.'''
