["https://www.amitgawande.com/blog/2017/walking-to-the-happy-place"]
title = "Walking to the Happy Place | Amit Gawande"
description = "Oas looked at the grumpy old sod again lying down in front of Sara’s picture. Well, at least that is what he thought Mr Marvel was. Somewhere deep down he …"
full_description = "Walking to the Happy Place Oas looked at the grumpy old sod again lying down in front of Sara’s picture. Well, at least that is what he thought Mr Marvel was. Somewhere deep down he knew he too was exactly the same — an old grumpy looking sod. And Marvel had made sure Oas is never allowed to forget that. He saw a human reflection in the feline every time he looked at him.But as Sara had wished, Oas had made him his buddy, his partner for years now. They were inseparable — waking up and cleaning together; cooking and eating together; reading and sleeping together. Marvel made sure he spent, with Oas, every single minute of the day, spreading happiness and contentment. And Oas always believed things would stay the same.Alas, the time has a way of unearthing one’ fallacies — putting one face-to-face with history. Didn’t Oas hold similar beliefs about his happy times with Sara? How can he have forgotten so quickly that they didn’t last him for the lifetime either? And today he woke up from the self-induced dreamy slumber again.Not by Marvel, but by the absence of him on his side. Oas trotted down the stairs to find him motionless in front of Sara. He knew the grumpy sod was done being grumpy. Sara would’ve been ululating next to Marvel’s body — that was if she had been alive. Now, she must be dancing with joy, with Marvel to her side, at whichever the place it is where people go to stop being the sad mortals.The thought cheered Oas up. He too was close to done being the grumpy old sod."
year_published = 2017
