["https://www.amitgawande.com/blog/2022/not-a-natural-blogger"]
title = "Not a natural blogger | Amit Gawande"
description = "I no longer am the prolific blogger that I once was. I won’t comment on everything that I read these days. Or post every thought I have.I read what a few …"
full_description = "Not a natural blogger I no longer am the prolific blogger that I once was. I won’t comment on everything that I read these days. Or post every thought I have.I read what a few people write and realize maybe I am not as natural a blogger as I thought at one point. Writing doesn’t come naturally to me. Knowing that English isn’t my primary language, I knew what I write in the language won’t sound natural either. In my school, even my English teacher didn’t speak in English. English became my primary communication language pretty late in my life. So I am aware that the way I use some words or the structure of my sentence must sound wrong to English-speaking readers.Not that I blame my struggle with this foreign language for my recent slump in writing. It’s true that I never wished to write perfect prose. The recognition that it conveyed what I wanted was good enough for me. But it’s equally true that writing is not easy for me. It takes effort.I would love to believe that my writing has improved over these 15 years. But I am also conscious that my desire to write frequently, differently, hasn’t improved. Instead, it has been impaired recently.I feel bad when I struggle to garner the drive to word my thoughts and I wrote about my frustration a few times recently. Looking at my blog without anything meaningful added newly makes me feel worse.Maybe this space needs a break. Maybe I do?"
year_published = 2022
