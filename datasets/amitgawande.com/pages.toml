["https://amitgawande.com/blog/2025/no-audiobooks"]
title = "Not Listening to Audiobooks | Amit Gawande"
description = "I am not listening to audiobooks anymore. There are many times when I need something to listen to, such as driving to the office, going for walks, or even …"
full_description = "Not Listening to Audiobooks I am not listening to audiobooks anymore. There are many times when I need something to listen to, such as driving to the office, going for walks, or even doing chores at home. Audiobooks, podcasts, or songs have fulfilled this need at various points earlier. Songs have been a constant, but audiobooks have been my choice for a long time. But recently, I have not been enjoying the books I listen to. I generally do not listen to nonfiction as I cannot highlight or take notes. Fiction is mostly entertainment, and I already have many other ways to enjoy myself. Audiobooks were exciting, but now I feel jaded listening to them. Picking books feels like a chore—almost like I’m downloading them only because I have credits to use up. It feels like I’m only getting through them to meet my annual reading goals. Hitting annual goals isn’t a good sole reason to do something—especially reading books. I like to think I read because I want to, not just to check a box."
