["https://www.amitgawande.com/blog/2016/the-other"]
title = "The Other | Amit Gawande"
description = "He walked back into the room, alone. He fancied such days. He was on his personal day-off when everyone else was at work. He had just finished his last …"
full_description = "The Other He walked back into the room, alone. He fancied such days. He was on his personal day-off when everyone else was at work. He had just finished his last chore. He did not remember the last time he had lived an afternoon so empty — empty in a good sense it was — empty because he didn’t have any items to cross off his planner. He was idle, and he was loving it. He closed the curtains to darken the room, turned on the switch and waved his hand to affirm he had the air-cooler lined to his liking. He settled on his chair, crossed his legs on to the desk, put his arms behind his head and admired the emptiness, the freedom the day was offering him. He closed his eyes and gasped out a smug sigh. He was waiting patiently for the doorbell to ring. About an hour ago He had a chore to deal with. He got on to the bike, kicked the side-stand and pushed the ignition switch. He looked at the crumbled paper in his hand, the notes he had made for himself. He still had time at his hand. He began driving to the home. He looked around him. The city looked empty to him, just as he liked it. He was’t surprised as it was extremely hot out there. As if the sun was seething with anger over the thankless job he got to do, with no day-off from. He was conscious of the feeling, but he didn’t worry about it today. About some minutes drive and he reached the home. It was a steep walk of four floors through the staircase. But he knew he just had to get it done with - then he can enjoy the freedom, in just the way he wanted, with just the one he wanted. He was, after all, waiting patiently for quite some time now. He knew soon his doorbell will ring. Eyes closed, his mind fell asleep. His ears though were awake in attention. The doorbell hadn’t even outed its first ring that he was on his sole. He dashed to the door and, panting visibly, opened it. He saw a tired, young man standing there. He realised it was extremely hot out there. He thought the other guy must have been running around the town in this heat to sweat so profusely. Such a thankless life full of hardships, he thought. He pitied the other guy for his condition and thanked god for the freedom he was bestowed upon. Anyway, all he cared about at this moment was the smartphone the other guy was here to deliver. He saw a panting, young man open the door. He realised the other guy was alone in there — in an empty house, with no one to talk to. Such a futile life full of loneliness, he thought. He pitied the other guy for his condition and thanked god for the freedom he was bestowed upon. Anyway, all he cared about at this moment was to deliver this parcel and reach home to welcome his wife, back from her mother’s place."
year_published = 2016
