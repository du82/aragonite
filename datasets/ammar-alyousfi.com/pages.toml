full_description = '''من أفضل الوسائل لتعلم اللغة الإنجليزية Nov 27, 2017 تعلم اللغة الإنجليزية أمر هام في هذا الوقت لمن يريد التعمق في الكثير من مجالات العلوم كعلوم الحاسب مثلاً، فمعظم الإنتاج العلمي -للأسف- باللغة الإنجليزية. خلال طريقي في تعلم اللغة الإنجليزية - و الذي لا أزال أسير فيه - جربت و اطلعت على العديد من القواميس و الخدمات التي تساعد متعلم الانكليزية. سأكتفي بوضع أفضل ما وجدت في هذا المنشور آملاً أن تفيدكم كما أفادتني. معلومة جانبية: مستواي في الإنجليزية جيد جداً و أحرزت 102 في امتحان TOEFL)، لكي تزداد ثقتك في هذه القائمة ؛) قواميس إنجليزي-إنجليزي Collins Dictionary قاموس ممتاز يعرض ترجمة الكلمات بطريقة تراعي السياقات التي تستخدم فيها مع أمثلة، ويمكّنك من الاستماع لنطق الكلمة، كما أنه يعرض درجة انتشار استخدام الكلمة عبر السنوات، وصيغة الفعل في الماضي والمضارع المستمر إلخ، ومرادفات الكلمة، وغير ذلك. Oxford Learner's Dictionary قاموس يعرض ترجمة الكلمات بطريقة تراعي السياقات التي تستخدم فيها مع أمثلة، ويمكن فيه الاستماع لنطق الكلمة، ويعرض صيغة الفعل في الماضي والمضارع المستمر إلخ، والكلمات التي عادة ما تستخدم مع الكلمة التي تم البحث عنها، وغير ذلك. إذا رأيت رمز مفتاح بجانب الكلمة التي بحثت عنها، فهذا يعني أنها من أهم 3000 كلمة انكليزية يمكن تعلمها. ملاحظة: إذا كانت الكلمة التي تم البحث عنها لها أكثر من استخدام، مثلاً إن كانت تستخدم كاسم وفعل مثل love، فإن الموقع يعرض ترجمة واحد من هذه الاستخدامات، ويعرض على اليمين لائحة تحوي الاستخدامات الأخرى حيث يمكنك النقر على أحدها ليقوم بعرض الترجمة الخاصة به. Merriam-Webster's Learner's Dictionary هذا الموقع يعرض الترجمة بطريقة مبسطة ومنظمة. Thesaurus.com هذا الموقع يعرض مرادفات الكلمة التي يتم البحث عنها، وكلما زاد التشابه في المعنى بين الكلمة وأحد المرادفات كلما كان لون خلفية ذاك المرادف أغمق. ويعرض أيضاً الكلمات المضادة في المعنى وكلمات أخرى متعلقة بالكلمة المبحوث عنها. Vocabulary.com هذا الموقع غير مشابه لبقية القواميس، فهو يشرح ترجمة الكلمة و يضرب أمثلة خلال الشرح كيف تفهم معنى الكلمة و كيف تُستخدم، و يوفر نطق الكلمة. بالإضافة لما ذكرت، تستطيع إنشاء قوائم بالكلمات التي تريد دراستها و تذكرَها، حيث تستطيع الدخول في تدريبات عليها، و تزداد نقاطك في الموقع و تُمنح أوسمة أرفع كلما درست فيه أكثر، ويعرض الموقع أفضل مستخدميه بناء على هذه النقاط، ، و غير ذلك. WordNet هذا المشروع من جامعة برينستون. هو عبارة عن قاعدة بيانات معجمية كبيرة تحوي على الكلمات الإنجليزية مرتبة في مجموعات، وكل مجموعة تعبر عن مفهوم معين. و هو يوفر الاطلاع على عدة علاقات بين الكلمات أيضاً، فمثلاً إذا كانت لديك كلمة "spoon" و التي تعني "ملعقة"، فإنه يتيح لك معرفة الكلمات التي تدل على معنى محدد أكثر منها مثل "teaspoon" و التي تعني "ملعقة شاي" أو "ملعقة صغيرة"، و يتيح أيضاً معرفة الكلمات التي تدل على معنى أوسع مثل "cutlery" و التي تعني "أدوات المائدة"، بالإضافة إلى علاقات أخرى. The Free Dictionary هذا الموقع يعرض ترجمة الكلمة المطلوبة من أكثر من مصدر مع أمثلة، و فيه قسم لإيجاد الكلمات المرادفة و المعاكسة في المعنى للكلمة المطلوبة، و فيه قسم لترجمة التعابير و المصطلحات. Google نعم Google. فهذا الموقع العظيم يمكنه أيضاً أن يقوم بالترجمة. فقط اكتب في مكان البحث "define" و بجانبها الكلمة أو المصطلح الذي تريد ترجمته ليقوم بعرض الترجمة و معلومات أخرى مثل مدى انتشار استخدام الكلمة عبر الزمن. Wiktionary هذا الموقع هو ابن عم Wikipedia. يعرض ترجمة موسوعية للكلمات، و يحتوي على ترجمة عربية. Macmillan Dictionary على الرغم من أن الموقع يبدو للوهلة الأولى عادياً و قد لا يجذب المستخدم، إلا أنني أجد نفسي أثق بهذا القاموس و ترجماته. هو يعرض الترجمة و كلمات مرادفة و أحياناً أمثلة. قواميس إنجليزي-عربي Reverso يعرض معاني الكلمة مع أمثلة مترجمة. sensagent يعرض عادة معان أكثر من السابق. Glosbe يتميز بترجمة المصطلحات. على العموم، أنا أستخدم Reverso و sensagent أكثر، ويغنونني غالباً عن بقية مواقع الترجمة من الإنجليزية للعربية. مواقع لإيجاد أمثلة و هذه مواقع يمكنك من خلالها إيجاد جمل تحوي الكلمة التي تريد إيجاد أمثلة على استخداماتها: Goodreads Quotes من هنا يمكنك البحث في الكثير من الاقتباسات المأخوذة من العديد و العديد من الكتب. Binary Quotes وهذا موقع يحتوي على الكثير من الاقتباسات عن الرموز و المشاهير و التي يمكنك البحث فيها أيضاً. Google Translate رغم أنه مخصص أساساً للترجمة، لكنه يوفر عدة أمثلة -يظهر أنها مُختارة- على الكلمة التي تقوم بترجمتها فيه. انزل في الصفحة لقسم الأمثلة (Examples) لتجدها.'''
