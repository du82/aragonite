title = "تعلم البرمجة بلغة بايثون - الدرس الخامس: كتابة وتشغيل برامج بايثون بدون تثبيت شيء على الجهاز | Ammar Alyousfi’s Blog"
description = "The personal website of Ammar Alyousfi which contains a blog about data science, data analysis, data visualization, machine learning, Python, and more."
full_description = "تعلم البرمجة بلغة بايثون - الدرس الخامس: كتابة وتشغيل برامج بايثون بدون تثبيت شيء على الجهاز Mar 31, 2020 رأينا في درس سابق كيفية تثبيت بايثون ومحرر نصوص برمجية على أجهزتنا لنتمكن من كتابة وتشغيل برامج بايثون. في هذا الدرس سنتعرف على طرق لكتابة وتشغيل برامج بايثون بدون تثبيت شيء على الجهاز. هذه الطرق يمكن أن تسهل الأمور في بداية رحلة تعلم بايثون، لكن في نهاية الأمر أعتقد أنه لا بد من تثبيت بايثون ومحرر نصوص على الجهاز خاصة أنها عملية سهلة كما رأينا في درس سابق. سنتعرف في هذا الجزء على طريقتين لكتابة وتشغيل برامج بايثون في متصفح الانترنت: Repl.it و Google Colab. 1. Google Colab هذه خدمة مجانية مقدمة من Google تمكنك من كتابة وتشغيل برامج بايثون في متصفح الانترنت مباشرة. عن طريق هذه الخدمة يمكنك كتابة كود بايثون وتشغيله ورؤية النتائج مباشرة ويمكنك أيضاً كتابة نص عادي في نفس الملف لشرح الكود مثلاً أو لتفسير النتائج. في Google Colab (غوغل كولاب): الكثير من حزم بايثون البرمجية المفيدة تأتي مثبتة بشكل مسبق فيمكنك استخدامها مباشرة ويمكنك تثبيت أي حزمة أخرى بسهولة (سنتعرف لاحقاً على الحزم البرمجية وكيفية استخدامها). أيضاً تمكنك هذه الخدمة من حفظ ملفات برامجك في حسابك في Google Drive ويمكنك فتح ملفات برامجك المخزنة هناك بشكل مباشر. وزيادة على ذلك فإن غوغل كولاب يوفر لك وحدة معالجة رسوميات (GPU) لاستخدامها في برامجك بشكل مجاني (هناك برامج معينة تعمل بشكل أسرع كثيراً باستخدام وحدة معالجة الرسوميات). موقع غوغل كولاب (Google Colab) 2. Repl.it هذا الموقع يمكنك - مجاناً - من كتابة برامج بايثون وتشغيلها ويوفر خطة مجانية محدودة بعض الشيء لكنها كافية للمبتدئين. يمكن عن طريق هذا الموقع إنشاء ملفات بايثون وحفظها وتثبيت حزم برمجية. ويمكنك التسجيل في الموقع للاحتفاظ بملفاتك. الخطة المجانية تعطيك 100 ميغابايت لتخزين ملفاتك وهي كافية لكتابة العديد والعديد من البرامج. موقع Repl.it تعرفنا في هذا المقال على طريقتين من أفضل الطرق لكتابة وتشغيل برامج بايثون على الانترنت. هناك العديد من الخدمات الأخرى المشابهة المتوفرة أيضاً. هذه الخدمات جعلت البرمجة ومشاركة البرامج التي تكتبها مع الآخرين أسهل مما سبق. يمكنك استخدام هذه الخدمات الآن لتجربة البرامج التي نكتبها في هذه الدورة ويمكنك تثبيت بايثون ومحرر نصوص على جهازك في أي وقت بسهولة باتباع التعليمات الموضحة في هذا المقطع من الدرس السابق (أو هذا المقطع إن كنت تستخدم نظام ماك). فيديو الدرس"
