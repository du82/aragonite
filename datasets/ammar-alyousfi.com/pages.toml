full_description = 'لماذا لا يجب عليك أن تتمرن لتقلل وزنك؟ Nov 27, 2017 مقالة منشورة على موقع Vox تقول بأن التمارين الرياضية ليست فعالة لخسارة الوزن كما هو منتشر. المقالة تعتمد على أكثر من 60 دراسة في ما تقوله. رابط المقالة على Vox المقالة طويلة، بإمكانك قراءتها، أو يمكنك قراءة هذا الملخص السريع :) قام Herman Pontzer بدراسة على إحدى القبائل البدائية في تنزانيا و التي تعتمد على الصيد و جمع الطعام في الحياة، و التي كان متوقعاً أن يكونوا كآلات حرق سعرات حرارية تمشي على الأرض. الصادم في الدراسة أن Pontzer وجد أن استهلاك الطاقة لدى أفراد هذه القبيلة ليس أعلى من استهلاك الطاقة لدى الأمريكيين و الأوروبيين. يقول الباحث Kevin Hall أنه إذا قام رجل يزن 95 كيلوجراماً بالركض (متوسط السرعة) لـ 60 دقيقة أربعة أيام في الأسبوع مع المحافظة على مستواه السابق لاكتساب السعرات الحرارية، و قام بذلك لمدة ثلاثين يوماً، سوف يفقد 2.25 كيلوجراماً فقط. هناك حد أعلى للسعرات الحرارية التي يمكن أن تحرقها من خلال التمرن: "كلما تمرنت أكثر كلما خسرت سعرات حرارية أكثر" مقولة غير صحيحة. إذاً ماذا تعمل لتفقد الوزن؟ دراسة من National Weight Control Registry أجريت على أكثر من 10000 شخص بالغ، كل منهم خسر على الأقل 13.6 كيلوجراماً و حافظوا على ذلك لسنة على الأقل. حللت الدراسة سماتهم و عاداتهم و سلوكهم لتجد أن هناك أفعال مشتركة بين هؤلاء الناس و هي أنهم يزنون أنفسهم على الأقل مرة في الأسبوع، و يحدّون من كمية اكتسابهم للسعرات الحرارية، و يبتعدون عن الأطعمة كثيرة الدهون، و يراقبون حجم وجباتهم، و بالإضافة إلى ذلك فإنهم يمارسون التمارين الرياضية بانتظام. لا يُفهم من الكلام السابق أن التمرين غير مفيد. بل إنه ممتاز لصحتك و لجسمك. إنه فقط الأداة غير المناسبة لتقليل وزنك.'
