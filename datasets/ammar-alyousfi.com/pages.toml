full_description = 'لماذا ترك الغرب الدين وراءه؟ - ملخص كتاب "ماذا خسر العالم بانحطاط المسلمين" Aug 1, 2018 مقدمة فيما يلي ملخص مختصَر - مع بعض التصرف - لكتاب رائع اسمه "ماذا خسر العالم بانحطاط المسلمين" من تأليف أبي الحسن علي الندوي. أفضل ما استفدته من الكتاب أنه عرفني أسباب وقصة وصول العالم وخاصة العالم الغربي إلى ما هو عليه اليوم من نسيان لأمر الآخرة ومن عدم وجود مكان للدين والإله في حياته ومن انطلاقه إلى علمه وبحثه مستنداً على المادية، ربما كردة فعل على أحداث تاريخية، وما سببه ذلك من تبعات. رابط الكتاب على Goodreads: https://www.goodreads.com/book/show/2905549 ما قبل الإسلام كان القرن السادس والسابع (لميلاد المسيح) من أحط أدوار التاريخ بلا خلاف، فكانت الإنسانية متدلية منحدرة منذ قرون، وما على وجه الأرض قوة تمسك بيدها وتمنعها من التردي، فقد زادتها الأيام سرعة في هبوطها وشدة في إسفافها، وكأنَّ الإنسان في هذا القرن قد نسي خالقه، فنسي نفسه ومصيره، وفقد رشده، وقوة التمييز بين الخير والشر، والحسن والقبيح، وقد خفتت دعوة الأنبياء من زمن، والمصابيح التي أوقدوها قد انطفأت من العواصف التي هبت بعدهم أو بقيت، ونورها ضعيف ضئيل لا ينير إلا بعض القلوب فضلاً عن البيوت فضلاً عن البلاد. العصر الذهبي للإسلام لم يتولى المسلمون الحكم في هذه الفترة إلا وقد تخلصت نفوسهم من أمراضها بعد تزكيتها وتربيتها على يد النبي صلى الله عليه وسلم. صار الورع والزهد والعفاف والأمانة وخشية الله والإيثار من جملة أخلاقهم. لم يفرقوا بين أبيض وأسود ولم يفضلوا عربياً على عجمي. النظرة الإسلامية للدنيا نظرة متوازنة، فلا ينظر المسلمون إلى الدنيا نظرة الماديين: فرصة وحيدة للتمتع والتنعم فيتسابقون ويتكالبون عليها بجشع وشراهة، ويقهرون الشعوب الضعيفة ويسرقون خيراتها ويقتلون أهلها. ولا ينظرون إلى الدنيا على أنها عقوبة وعذاب من الله فينصرفون عن إعمار الأرض وإصلاحها. بل يعدون هذه الحياة نعمة من الله هي أصل كل خير وسبب كل بر، يتقربون فيها إلى الله ويحاولون الوصول إلى ما يستطيعونه من كمال؛ يرونها فرصة عمل وجهاد {الذي خلق الموت والحياة ليبلوكم أيكم أحسن عملاً} عهد الأمويين والعباسيين وقع فصل بين الدين والسياسة عملياً، فإن خلفاء هاتين الدولتين بشكل عام لم يكونوا من العلم والدين بمكان يستغنون به عن العلماء وأهل الدين، واستعانوا بهؤلاء متى شاؤوا واستغنوا عنهم متى شاؤوا. إن العلماء المفكرين في ذلك العصر لم يعتنوا بالعلوم الطبيعية التجريبية والعلوم العملية المثمرة المفيدة اعتناءهم بعلوم ما بعد الطبيعة والفلسفة الإلهية التي تلقوها من اليونان وما هي إلا وثنيتهم القومية التي ترجموها في لغتهم الفلسفية، وقد أغنى الله المسلمين عنها وكفاهم هذا البحث والتنقيب، ولكن المسلمين لم يشكروا هذه النعمة، بل بذلوا قسطاً كبيراً من جهودهم وذكائهم فيها وفي مباحث الروح وفلسفة الإشراق ومسائل وحدة الوجود. إن ما وصل إليه المسلون في العلوم الطبيعية والتجريبية، فإنه وإن كان أرقى من العصور السابقة وأكثر ثروة في العلم والاختبار، إلا أنه لا يتناسب مع فتوحهم الواسعة في دوائر علمية أخرى، ولا يتلاءم مع المدة الطويلة التي تمتعوا بها في التاريخ. إن ما خلفوه من كتب في الطبيعيات والكونيات والتجارب العلمية، وإن كان مما استفادت منه أوروبا في نهضتها، فإنه يتضاءل أمام ما أنتجته أوروبا في القرنين السابع عشر والثامن عشر فقط. عهد العثمانيين تقول الكاتبة خالدة أديب هانم: “لما بدأ الغرب في دراسة الطبيعة بواسطة المشاهدة والاختبار والتحليل والتجزئة سقط في أيدي رجال الكنيسة، ولما وصل العلماء بطرق عملية إلى اكتشافات مهمة خاف علماء النصرانية على سيادة الكنيسة أن تنقرض، فحدث صراع عنيف بين الدين والعلم، وذهب كبار علماء الطبيعة الذين كانوا عاكفين على دراستهم وتحقيقهم ضحية علمهم. واضطرت الكنيسة النصرانية بعد المعارك الدموية بين الدين والعلم أن تواجه الواقع، فأدخلت علوم الطبيعة في برنامج مدارسها وكلياتها. وكان العلماء في تركيا العثمانية على الضد من ذلك، فلم يعنوا باكتساب العلوم الحديثة، بل منعوا الأفكار الجديدة أن تدخل في منطقتهم، وإذ كانوا متصرفين بزمام تعليم الأمة الإسلامية ولم يسمحوا لشيء طريف بأن يقرب منهم، فإن الجمود قد تغلب على نظامهم التعليمي. فلم تزل المدارس الإسلامية في القرن التاسع عشر المسيحي، كما كانت في القرن الثالث عشر المسيحي.” الغرب إلى الواجهة كان القرن السادس عشر والسابع عشر المسيحي من أهم أدوار التاريخ الإنساني الذي له ما بعده، قد استيقظت فيه أوربا من هجعتها الطويلة، وهبت من مرقدها مجنونة تتدارك زمان الغفلة والجهل وتفتح فتوحاً جديدة في كل علم وفن، ونبغ في هذه المدة القصيرة رجال ومبتكرون في كل علم وعبقرية مثل Copernicus و Newton وغيرهم. بداية، هناك حادثة عظيمة يجب أن يسجلها المؤرخ وينوه بها، وهي اعتلاء النصرانية عرش رومة الوثنية، وكان ذلك بجلوس قسطنطين الذي اعتنق النصرانية على سرير الأباطرة سنة 305م حيث وصل إلى الملك على جسر من أشلاء النصارى الذين نصروه وذبوا عنه. يقول درابر (John William Draper): “إن الجماعة النصرانية وإن كانت قد بلغت من القوة بحيث ولَّت فسطنطين الملك ولكنها لم تتمكن من أن تقطع دابر الوثنية وتقتلع جرثومتها، وكان نتيجة كفاحها أن اختلطت مبادئها، ونشأ من ذلك دين جديد تتجلى فيه النصرانية والوثنية سواء بسواء - هنالك يختلف الإسلام عن النصرانية، إذ قضى الإسلام على منافسه (الوثنية) قضاء باتاً، ونشر عقائده خالصة بغير غش. وإن هذا الإمبراطور الذي كان عبداً للدنيا والذي لم تكن عقائده الدينية تساوي شيئاً رأى لمصلحته الشخصية ولمصلحة الحزبين المتنافسين -النصراني والوثني- أن يوحدهما ويؤلف بينهما، حتى إن النصارى الراسخين أيضاً لم ينكروا عليه هذه الخطة، ولعلهم كانوا يعتقدون أن الديانة الجديدة ستزدهر إذا طمست ولقحت بالعقائد الوثنية القديمة، وسيخلص الدين النصراني عاقبة الأمر من أدناس الوثنية وأرجاسها لم تستطع هذه النصرانية الملقحة بالوثنية المشوهة التي فقدت روحها وجمالها أن تغير من سيرة الروم المنحطة وأن تبعث فيهم حياة جديدة، حياة دينية نقية طاهرة وأن تفتح عهداً زاهراً في تاريخ الروم، بل إنها ابتدعت رهبانية لعلها كانت شراً على الإنسانية والمدنية من بهيمية رومة الوثنية. وصار الناس بين الرهبانية العاتية والمادية الجامحة. وانتشر الفساد في المراكز الدينية، ويصف الراهب جروم (Jarum) انحطاط أخلاق البابوات وبيعهم المناصب وتأجيرهم أرض الجنة ومنحهم شهادات النجاة وإجازات حل المحرمات. لكن من أعظم أخطاء رجال الدين في أوربا أنهم دسوا في كتبهم الدينية المقدسة معلومات بشرية ومسلمات عصرية ربما كانت أقصى ما وصل إليه العلم تلك الأيام. وكان ذلك سبباً للكفاح المشؤوم بين الدين والعلم حيث أعلن علماء ذلك العصر عدم إيمانهم ببعض ما في الكتب المقدسة مما كان قد دسه رجال الدين، فقامت قيامة الكنيسة وقام رجالها بتكفير واستحلال دماء أولئك العلماء، وأنشؤوا محاكم التفتيش. هنالك ثار المجددون المتنورون وأصبحوا حرباً لرجال الدين ومقتوا كل ما يتصل بهم، وعادوا الدين المسيحي أولاً والدين المطلق ثانياً. انهزم الدين المختلِط بعلم البشر أمام العلم في تلك المعركة، وسقط رجال الدين سقوطاً لم ينهضوا بعده. وشر من ذلك أن أوربا أصبحت لا دينية. انصرف اتجاه الغرب إلى المادية بكل معانيها، فقام علماء الفلسفة والعلوم الطبيعية ينظرون في الكون نظراً مؤسساً على أنه على أنه لا خالق ولا مدبر ولا آمر، وليس هناك قوة وراء الطبيعة والمادة تتصرف في هذا العالم. وسموا كل بحث وفكر يعتقد بوجود إله ويؤمن به طريقاً تقليدياً لا يقوم عندهم على أساس العلم والحكمة، واستهزأوا به واتخذوه سخرياً، ثم انتهى بهم طريقهم الذي اختاروه وبحثهم ونظرهم إلى أنهم جحدوا كل شيء وراء الحركة والمادة. وأحدث الأدباء والمؤلفون، خصوصاً في ثورة فرنسا وبعدها، الثورة على الأخلاق القديمة، والنظم الاجتماعية، وزينوا للناس الإثم، ونشروا دعوة الإباحة، وإطلاق الطبائع من كل قيد، والفرد من كل مسئولية، ودعوا إلى إرضاء الشهوات، وانتهاب المسرات، وغلوا وأسرفوا في تقدير قيمة هذه الحياة وجحدوا كل شيء سوى اللذة العاجلة والنفع المادي الظاهر المحسوس. يقول الأستاذ محمد أسد (ليوبولد فايس سابقاً): "إن الحضارة الغربية لا تجحد الله في شدة وصراحة، ولكن ليس في نظامها الفكري موضع لله في الحقيقة ولا تعرف له فائدة ولا تشعر بحاجة إليه". وكان من نتائج هذه المادية الجارفة، والتربية اللادينية التي ليس فيها نصيب للأخلاق ومخافة الله عز وجل، والإيمان بالآخرة أن أصحاب المراكز الكبيرة، ورجال السياسة والمسئولية يرتكبون في بعض الأحيان جنايات لا يتنزل إليها أكبر الآثمين. وذلك لمصلحة سياسية وهمية لبلادهم وأمتهم أو لجاه شخصي أو ربح مالي مثل تأييد ترومان للصهيونية، ودولة إسرائيل في فلسطين، ومعارضته للقضية العربية التي لا غبار عليها، لأجل أن يكسب ود اليهود ويتمتع بنفوذهم السياسي والمالي والصحافي، وليكسب انتخابه، وتعاميه عن براهين الدولة العربية الساطعة، وسكوت أمريكا على فظائع فرنسا في الجزائر، ووقوفها بجوار هذه الدولة الجائرة في قضية الجزائر العربية الإسلامية، وتعاونها على الإثم والعدوان. إن البذرة الخبيثة التي ألقيت في تربة أوربا في نهضتها الثانية لم تأت عليها قرون حتى نبتت منها دوحة خبيثة، ثمارها حلوة ولكنها سامة، أزهارها جميلة ولكنها شائكة، فروعها مخضرة ولكنها تنفث غازاً ساماً لا يرى، ولكنه يسمم دم النوع البشري. إن رجل العصر قد لزم الحياد التام في مسائل الآخرة وصرف النظر عنها , فلا عليه إن كانت بعد هذه الحياة حياة ثانية وكانت الجنة والنار والثواب والعقاب والنجاة والهلاك أو لم تكن، لأن شيئاً من ذلك لا يمس مسائلة اليومية أو في آخر الشهر، ولا يتصل بشخصه وعياله في الساعة الحاضرة، فهو رجل جد وعمل، لا يعرف إلا حياة المصانع والإدارات وسير الماكينات ولا يهتم إلا بتسلية النفس وترويحها في آخر النهار والنوم الهادئ في آخر الليل والأجرة في آخر الأسبوع أو الراتب في أواخر الشهور وحساب الأرباح في آخر السنة وإعادة الصحة والشباب في آخر العمر وأما ما بعد الحياة فهو عنده مجهول ووهم من الأوهام: {بَلِ ادَّارَكَ عِلْمُهُمْ فِي الْآخِرَةِ بَلْ هُمْ فِي شَكٍّ مِّنْهَا بَلْ هُم مِّنْهَا عَمِونَ}. ذلك الضرب من الناس لم يترك اشتغالهم بالحياة الدنيا والعكوف عليها فراغاً لدعوة دينية، وإن الذين يدعوهم إلى الدين والحياة الأخروية ليتحير معهم فلا يجد منفذاً يدخل منه إلى عقولهم، ويدخل به دعوته الدينية إلى نفوسهم، فقد أقفلت الحياة المادية ومسائلها جميع أبوابها وسدت جميع نوافذ فكرهم. والذي مني بهذا الضرب من الناس يفهم السر في قوله تعالى: {خَتَمَ اللهُ عَلَى قُلُوبِهمْ وَعَلَى سَمْعِهِمْ وَعَلَى أَبْصَارِهِمْ غِشَاوَةٌ} ، {أَمْ تَحْسَبُ أَنَّ أَكْثَرَهُمْ يَسْمَعُونَ أَوْ يَعْقِلُونَ إِنْ هُمْ إِلَّا كَالْأَنْعَامِ بَلْ هُمْ أَضَلُّ سَبِيلاً} ولم يلق في شرحها وتعليلها ما لقيه المفسرون الذين لم يشاهدوا هذا النوع من صعوبة. بعد المادية لما طغى بحر المادية في العالم الإسلامي في العهد الأخير وفاض، كون رجال الدين جزراً صغيرة في بحر المادية المحيط، يلجأ إليها الفارون إلى الله والمتبرمون من الحياة المادية والغفلة، كان فيها رجال هم كمنارات النور في بحر الظلمات، فمثلاً كان السيد آدم البنوري الهندي (م 1053 هـ) دفين البقيع يأكل على مائدته كل يوم ألف رجل، ويمشي في ركابه ألوف الرجال ومئات من العلماء. وهذا الشيخ محمد معصوم (م 1079) ابن الشيخ الكبير أحمد السرهندي قد بايعه وتاب على يده تسعمائة ألف من الرجال، واستخلف في دعاء الخلق إلى الله وإرشاد الناس وتربيتهم الدينية سبعة آلاف من الرجال. وهذه ابنه الشيخ سيف الدين السرهندي (م 1096) كان يأكل على مائدته ألف وأربعمائة، ويقترحون الأطعمة ويتخيرونها… وهذه أمثلة التقطناها على عجل من تاريخ الهند الإسلامي ولمحات عابرة فيه؛ ولو ذهبنا نستقصي أمثلته وشواهده من تاريخ الإسلام العام ومن تراجم الرجال الدينيين وسيرهم في بلاد الشام ومصر والمغرب الأقصى والعراق لكان مجلداً كبيراً. واستمر هذا الإقبال على الدين والهجرة في طلب العلم النافع والعمل الصالح، وتجشم الأسفار والأخطار لزكية النفس وتهذيب الخلق والتوصل إلى معالم الرشد والاستعداد للآخرة إلى أول عهد الاستعمار الأوربي. استعمار الإنجليز للهند استعمر الإنجليز الهند ورسخت قدمهم فيها وأصبح نظامهم التعليمي - وهو من أكبر جنودهم - يؤتي أكله كل حين، وتسربت في الناس أفكارهم وميولهم، فصارت تقلب نظام الحياة ونظام الفكر في الهند رأساً على عقب من حيث لا يشعر أهلها فتقاصرت الهمم في الدين وخمدت جذوة القلوب وانطفأت شعلة الحياة الدينية، وانصرفت الرغبات والأهواء والتنافس الطبيعي من الدين والروحانية إلى المعاش والمادة. سرى الشك وسوء الظن في الأوساط الدينية والبيوت العريقة في الدين والعلم بتأثير المحيط وبتأثير التعاليم الإفرنجية وضعفت الثقة بالله وبصفاته وبمواعيده، فأصبح الآباء يضنون بأولادهم على الدين، ولا يخاطرون بأوقاتهم وقواهم في سبيل الدين وعلوم الدين، وأصبحوا يعلمونهم العلوم المعاشية واللغات الإفرنجية، لا رغبة في تحصيل المفيد النافع ولا دفاعاً عن الإسلام بل زهداً في الدين وفراراً من خطر المستقبل وخوفاً على أفلاذ أكبادهم من الضياع واستسلاماً للدهر المتقلب، وتسلط عليهم خوف الفقر حتى أصبحوا من خوف الموت في الموت. ماذا بعد؟ إذا كان العالم الإسلامي لا يرمي إلا إلى ما تراه أوربا من العرض القريب، ولا يطمح إلا فيما تطمح فيه أوربا من حطام الدنيا، ولا يؤمن إلا بما تؤمن به أوربا من المحسوسات والماديات، كانت أوربا بقوتها المادية أحق بالانتصار والسيادة من العالم الإسلامي الذي يتخلف عنها في القوة المادية تخلفاً شائناً ولا يفوقها في القوة المعنوية. فالمهم الأهم لقادة العالم الإسلامي، وجمعياته وهيئاته الدينية وللدول الإسلامية غرس الإيمان في قلوب المسلمين وإشعال العاطفة الدينية، ونشر الدعوة إلى الله ورسوله، والإيمان بالآخرة على منهاج الدعوة الإسلامية الأولى، لا تدخر في ذلك وسعاً، وتستخدم لذلك جميع الوسائل القديمة والحديثة. والقرآن وسيرة محمد صلى الله عليه وسلم قوتان عظيمتان تستطيعان أن تشعلا في العالم الإسلامي نار الحماسة والإيمان، وتحدثا في كل وقت ثورة عظيمة على العصر الجاهلي. ولكن مهمة العالم الإسلامي لا تنتهي هنا، فإذا أراد أن يضطلع برسالة الإسلام ويملك قيادة العالم فعليه بالمقدرة الفائقة، والاستعداد التام في العلوم والصناعة والتجارة وفن الحرب، وأن يستغني عن الغرب في كل مرفق من مرافق الحياة، وفي كل حاجة من الحاجات. إن العالم العربي لا يستطيع أن يحارب الغرب - إذا احتاج إلى ذلك ودعت إليه الظروف - وهو مدين له في ماله، عيال عليه في لباسه وبضائعه، لا يجد قلماً يوقع به على ميثاق مع الغرب إلا القلم الذي صنع في الغرب، ولا يجد ما يقاتل به الغرب إلا الرصاص الذي أفرغ في الغرب، إن عاراً على الأمة العربية أن تعجز عن الانتفاع بمنابع ثروتها وقوتها، وأن يجري ماء الحياة في عروقها وشرايينها إلى أجسام غيرها، وأن يدرب جيوشها وكلاء الغرب وضباطه، ويدير بعض مصالح حكومتها رجاله، فلابد للعالم العربي أن يقوم هو نفسه بحاجاته: تنظيم التجارة والمالية، وحركة التوريد والتصدير، والصناعة الوطنية، وتدرب الجيش، وصنع الآلات والماكينات وتربية الرجال الذين يضطلعون بجميع مهمات الدولة ووظائف الحكومة في خبرة ومهارة فنية، وأمانة ونصيحة. عن الحروب الإسلامية {الَّذِينَ آمَنُواْ يُقَاتِلُونَ فِي سَبِيلِ اللهِ وَالَّذِينَ كَفَرُواْ يُقَاتِلُونَ فِي سَبِيلِ الطَّاغُوتِ فَقَاتِلُواْ أَوْلِيَاء الشَّيْطَانِ إِنَّ كَيْدَ الشَّيْطَانِ كَانَ ضَعِيفاً}. هذه الحروب التي لم يشهد التاريخ أيمن منها وأقل إراقة للدماء وذهاباً بالنفس، ولا أعود منها على الإنسانية بالصالح العام والخير المشترك والسعادة جمعاء فلا يربو عدد المقتولين من الفريقين (المسلم والكافر) في جميع الغزوات والسرايا والمناوشات التي ابتدأت من السنة الثانية للهجرة، ودامت إلى السنة التاسعة على ألف وثمانية عشر نفساً 1018 المسلمون منهم 259 والكفار 759، أما المصابون في حرب 1914-1918 الكونية فيبلغ عددهم على الأصح واحداً وعشرين مليون نسمة، عدد المقتولين منهم سبعة ملايين. أما القنبلة الذرية التي جربتها أمريكا مرة في صحراء نيوميكسيكو، وثانية على رؤوس البشر في مدينة هيروشيما، وبعدها في نجازاكي المدينتين اليابانيتين، فقد أذاع رئيس بلدة (هيروشيما) في 20 أغسطس آب 1949 م أن الذين هلكوا في اليوم السادس من أغسطس آب 1945 م من اليابانيين يتراوح عددهم بين مائتي ألف وعشرة آلاف ومائتي ألف وأربعين ألفاً. ثم كانت الحروب الدينية الإسلامية حاقنة للدماء عاصمة للنفوس والأموال وفاتحة عهد السعادة والغبطة في العالم، أما حرب التنافس والحمية الجاهلية التي تدعى الحرب الكبرى فقد كانت مقدمة حروب متسلسلة. يقول الأستاذ جود (Joad): الانجليزي يعتقد أن الإنجليز أمة سلمية ويرمي اليابانيين بحب القتال والضراوة بالحروب. والإنجليز لا شك أمة سلمية، ولكن مسالمتهم مسالمة لص قد اعتزل حرفته القديمة، وقد أحرز شرفاً وجاهاً بفضل غنائمه السابقة، وهو يبغض الذين يدخلون جديداً في حرفته القديمة.'
