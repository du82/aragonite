full_description = "ملخص كتاب قوة التركيز Apr 9, 2017 العنوان الأصلي للكتاب :The Power of Focus Tenth Anniversary Edition: How to Hit Your Business, Personal and Financial Targets with Absolute Confidence and Certainty صفحة الكتاب على Goodreads: تقييم الكتاب وقت كتابة المنشور: 4.15. من ملاحظاتي على الكتاب عاداتك ستحدد مستقبلك. الأمر بهذه الأهمية فعلاً. إذا كنت تفعل شيئاً مراراً و تكراراً لمدة 30 عاماً، فربما لا تستطيع التخلي عنه في بضعة أسابيع قليلة. تذكر هذا – سلوكك الخارجي هو الحقيقة. في حين أن تصورك الداخلي لسلوكك غالباً ما يكون مجرد وهم. ادرس عادات الأشخاص الناجحين الذين تتخذهم قدوة. و هناك طريقة أخرى لدراسة الأشخاص الناجحين: اقرأ السير الذاتية الشخصية لهؤلاء الأشخاص. ابحث أيضاً عن الأفلام الوثائقية التي تقدم أشخاصاً ناجحين. صيغة العادات الناجحة: حدد بوضوح عاداتك السيئة أو غير المنتجة حدد عاداتك الناجحة الجديدة: العادة الناجحة هي في الغالب نقيض العادة السيئة بالضبط. ضع خطة تنفيذ من ثلاثة أجزاء. يقول المدرب دان سوليفان: “إذا أمضيت وقتاً طويلاً في التركيز على نقاط ضعفك، فكل ما ستنتهي إليه هو الكثير من نقاط الضعف القوية” و لتحدد بوضوح جوانب القوة لديك، اسأل نفسك بعض الأسئلة، ما الذي تجيد القيام به دون بذل مجهود – أي دون الكثير من الدراسة أو الاستعداد؟ و ما الذي تجيد القيام به و يجده الآخرون صعباً؟ هم يتعجبون من قدرتك و لا يستطيعون مضاهاتك في القيام به! ما الفرص المتوفرة في سوق العمل اليوم التي تطابق جوانب قوتك؟ ما الذي يمكنك تحقيقه باستخدام موهبتك الفريدة؟ إذا شعرت بأن المشاغل تغمرك، فاحصل على بعض المساعدة. تعلم أن تتخلى عن الأشياء غير المهمة في حياتك. فالأشخاص المتحكمون لديهم عقلية تخبرهم أن أحداً لا يستطيع القيام بالأمور بنفس كفاءتهم. و من الممكن أن يكون هذا صحيحاً. و لكن ماذا لو كان مساعدك يستطيع القيام بتلك المهام بكقاءة 75٪ في البداية؟ و مع التدريب المناسب و التواصل الجيد كل أسبوع، في النهاية سيقوم مساعدك الذي اخترته بعناية بكل تلك المهام بنفس كفاءتك. و سيتفوق عليك في أداء العديد منها. فكر في هذا الأمر، عندما تدفع في اتجاه تحقيق هدف ما، هل تكون أقرب لتحقيقه عندما يكون عقلك، و جسدك، و روحك، و مواردك بالكامل مركزة على النتيجة؟ أم عندما تكون مشتتاً و يتفرق انتباهك في مختلف الاتجاهات؟ و عند سؤاله [ أي بيتر دانيال ] عن الذي حول حياته من مديونية ثلاثية لنجاح لا مثيل له، أجاب: “أنا أنظم وقتي لأفكر. في الحقيقة، أنا أدخر يوماً كل أسبوع في جدولي لأفكر فقط. جميع أفكاري و فرصي العظيمة و مشروعاتي المربحة بدأت مع الأيام التي انطلقت فيها في التفكير. اعتدت أن أغلق على نفسي في خلوتي مشدداً على أسرتي ألا يتم إزعاجي تحت أي ظرف من الظروف” “بدء التمارين الرياضية” هو تعريف ضعيف جداً لهذا الهدف. إنه تعريف عام أكثر من اللازم، و لا يمكن قياسه. لذلك قلنا له: “كن أكثر تحديداً”. فأضاف: “أريد أن أمارس التمارين الرياضية لنصف ساعة في اليوم، أربع مرات في الأسبوع”. أتعلم ماذا قلنا له بعد ذلك؟ نعم: “كن أكثر تحديداً”. بتكرار هذا السؤال عدة مرات، تم إعادة تحديد هدفه الصحي كالتالي: أن يمارس التمارين الرياضية لنصف ساعة في اليوم، أربع مرات في الأسبوع: الاثنين، و الأربعاء، و الجمعة، و السبت، من السابعة صباحاً حتى السابعة و النصف. يحتوي نظامه على عشر دقائق لتمارين الإحماء، و عشرين دقيقة على عجلته الرياضية. يا له من اختلاف! الآن يمكننا بسهولة تتبع تقدمه. قرر ما الذي تريد إنجازه و لماذا. لتتحفز، اصنع قائمة بكل الأشياء التي تريد إنجازها في الخمسة أعوام القادمة. استمتع بذلك، و استعد لجميع الاحتمالات. تبنّ حماس الأطفال – لا تضع أية قيود على تفكيرك. كن محدداً، و أضف طابعاً شخصياً على قائمتك بأن تبدأ كل عبارة بقولك “أنا” أو “أنا سوف”… إليك بضعة أسئلة مهمة لتساعدك على التركيز: ما الذي أريد فعله؟ ما الذي أرغب في امتلاكه؟ إلى أين أريد أن أذهب؟ ما المساهمات التي أود تقديمها؟ ماذا أريد أن أصبح؟ ما الذي أرغب في تعلمه؟ من الذي أرغب في قضاء وقتي معه؟ كم أريد أن أكسب و أدخر و أستثمر؟ كم من الوقت أرغب في اقتطاعه للترفيه؟ ماذا سأفعل لأحصل على الصحة الأمثل؟ لتتأكد من أنك ستستمتع بأسلوب حياة صحي متكامل، اختر بعض الأهداف في كل من المجالات التالية: المهنة و العمل، و المجال المالي، و الترفيه، و الصحة و اللياقة، و العلاقات الشخصية، و المجال الشخصي و المساهمة، بالإضافة لأي شيء آخر له أهمية خاصة لديك. الخطوة القادمة هي ترتيب أولوياتك. اكتب رقماً بجانب كل هدف: عاماً واحداً أو ثلاثة أو خمسة أعوام. سيمنحك ذلك إطاراً زمنياً عاماً تعمل وفقاً له. [ استخدم طريقة سحب البطولات المذكورة في الكتاب لترتيب أولوياتك و ملخصها كالتالي: ابدأ مثلاً بالأهداف التي ستستغرق عاماً واحداً؛ اكتبها تحت بعضها، ثم فاضل بين كل اثنين على حدة، و بعدها فاضل بين كل اثنين من الأهداف التي اجتازات المفاضلة الأولى و هكذا، بطريقة مشابهة لما في الصورة التالية: ثم أعد العملية لأهداف الثلاثة أعوام و الخمسة أعوام… إلخ] إليك ملحوظة حيوية أخرى: قبل أن ترتب أولوياتك، دوّن أهم سبب ترغب في تحقيق كل هدف لأجله، و أكبر فائدة ستعود عليك من إتمامه. لتزيد من تركيزك على نمط الحياة الجديد الذي تريده، اخلق صوراً ملهمة لأهم أهدافك. هذه عملية ممتعة و يمكن للأسرة كلها الاشتراك بها. توفر شبكة الانترنت مصادر رائعة لإيجاد مثل هذه الصور. على مواقع مثل gettyimages.com، ستجد آلافاً من الصور. [ أقترح عليك Google Images ] من المهم حقاً أن تتخلى عن الأفكار المقيدة حول الشخص المفترض أن تكون أو لا تكون عليه. أفضل عشرة خيارات: بصرف النظر عن مدى صعوبة التحدي الذي يواجهك، اصنع قائمة بأفضل عشرة خيارات متاحة لك. قد لا يكون أول بضعة خيارات هي ما ترغب في تنفيذه؛ لكن دونها على أية حال. كن خلاقاً، و لا تكن ضيق الأفق. اسأل نفسك بعض الأسئلة التي تبدأ بـ “ماذا لو”. كن مستعداً للأمور غير المتوقعة. غالباً ما يكون الحل الأفضل هو إحدى أفكارك الأخيرة. يقول لاري: كلما قابلت شخصاً – أياً كان – سألته: “ما هو أكبر مشروع أو مشروعين تعمل فيهما في الوقت الحالي؟”. و يمكنك كذلك أن تسأل: “ما أهم مبادرتين أو تحديين تواجههما الآن؟ و كيف يمكنني مساعدتك؟”. ثم إذا أخبرك شيئاً يمكنك فعله حقاً، فانطلق و افعله… و إذا ما طلبت من هذا الشخص معروفاً بعد ذلك بثلاثة أشهر، فستكون هناك علاقة موجودة فعلياً و بإمكانك البناء عليها. و يشتمل تحضيره [ أي: قطب الأعمال وارن بافيت ] المكثف تحليلاً كاملاً للأرقام و خاصة ميزانية الشركة. و إذا ما حازت إعجابه يقضي وقتاً لا يستهان به في اجتماعات مع الأشخاص البارزين في المنظمة، يتعرف منهم كيف يديرون العمل، و يلاحظ فلسفتهم و كيفية تعاملهم مع العاملين و الموردين و العملاء لديهم. و عندما تكتمل هذه المهام، يسأل بافيت نفسه ثلاثة أسئلة حول هؤلاء الأشخاص البارزين: “هل أحبهم؟ هل أثق بهم؟ هل أحترمهم؟”. و إذا كانت الإجابة عن أحد تلك الأسئلة هي “لا”، تنتهي الصفقة دونما التفات لمدى كون الأرقام جيدة، أو للنمو المحتمل. العملاء الجوهريون هم جواز مرورك نحو النمو المستقبلي. و لسوء الحظ، غالباً ما يستهين الناس بهذه العلاقات المهمة، فيكون التوجه الذهني حيالها أن يقولوا: “إنه يطلب دائماً ألفي وحدة شهرياً، نحتاج إلى التركيز على عمل جديد”. إذ يقول [أي: ستيفن كوفي ] إن على المرء أن يعامل علاقاته الأكثر أهمية كما يعامل حساباً بنكياً. على سبيل المثال، كلما زادت ودائعك في حسابك البنكي للعلاقات الجوهرية، زادت قوة تلك الروابط. و خلال تلك العملية، ستصبح شخصاً ذا قيمة لهؤلاء الأشخاص. و مع عملائك المهمين في العمل، ربما ستقدم خدمات خاصة و كل الإضافات التي تجعل منك شخصاً فريداً. و قد يشمل ذلك نزهاً للعب الجولف أو حفلات عشاء أو رحلات خاصة… و ربما توفر لهم باستمرار إحالات جيدة ليتوسعوا في أعمالهم. و أحياناً يكون ذلك في صورة لفت أنظارهم إلى كتاب رائع، إو إرسال بريد إلكتروني لهم يحوي مقالاً حول هوايتهم أو تسليتهم المفضلة. لا تعط و تنتظر المقابل. جرب فقط المتعة المجردة للعطاء. – “ديان، كيف يمكنك تقييم أدائي كزوج خلال الأسبوع الماضي على مقياس من واحد إلى عشرة…” – “سأعطيك ثمانية” – “و ما الذي ينقصني لأحصل على عشرة؟” – “حسناً، كنت سأقدر لك مساعدتك لابننا في واجباته المدرسية يوم الأربعاء، فقد كنت مضغوطة بسبب درس الكومبيوتر في السابعة مساء، و شعرت بالذنب لأنني ذهبت دون الاعتناء به كما ينبغي…” – “شكراً لك. سأكون أكثر انتباهاً في المرة القادمة” ثم يتبادلان الأدوار. و هناك طريقان يمكنك أن تسلكهما لتبني حياة ناجحة؛ إما أن تسير في هذا الطريق وحيداً و أن تكون فردياً و مسيطراً، و إما أن تختار صحبة من الناس يمنحونك بعض المساعدة. و يتطلب الاختيار الأول الكثير من المحاولة و الخطأ، ستتعلم بالطريق الصعب، و تأخذ نصيبك العادل من الصدمات القوية و الكدمات. و ربما تحصل في النهاية على ما تريد، و ربما لا! الاختيار الثاني هو ما تستخدم فيه الدعم الاستراتيجي لتجنب بعض منعطفات الحياة الصعبة، كيف؟ بأن تجد الأشخاص المستعدين لإرشادك. و إليك طريقة مثبتة من ثلاث خطوات تساعدك على الاستمتاع بميزة الإرشاد: حدد الهدف: اختر مجالاً محدداً في حياتك تريد تحسينه. اختر مرشحيك من المرشدين. ضع خطتك الاستراتيجية: أول ما يجب عليك إدراكه أن ما بينك و بين الشخص الذي ترغب في مقابلته لن يزيد أبداً عن ستة أشخاص، بمن فيهم مرشدك نفسه. دعنا نراجع العناصر الأساسية في مكالمتك الأولى مع مرشدك. أولاً، ادخل مباشرة في الموضوع، فالأشخاص المشغولون يقدرون ذلك. لا تتصرف كما لو كنت تريد تكوين صداقات. التزم بنص تحضره جيداً و استخدم نغمة هادئة في الحوار. الأمر سيستغرق دقيقة واحدة، و من المهم أن تتحكم في المحادثة. قل ما شئت، و اسأل السؤال الختامي، ثم اصمت. عند هذه النقطة، تسمح لمرشدك المحتمل أن يتحدث. سامح نفسك. أسكت إلى الأبد تلك الأفكار السلبية من الإحساس بالذنب. الماضي تاريخ، و لن تتمكن من تغييره أبداً. و أحد أكثر المعتقدات المقيدة وضوحاً هذه الأيام هي فكرة أننا غير قادرين بشكل أو بآخر على تحقيق أهدافنا. و بالرغم من أن أفضل المواد التعليمية صارت متاحة، و بالرغم من عقود من المعرفة المسجلة عن كيفية إنجاز أي مهمة، فإننا نختار قول شيء آخر، فنحن نقول: “لا أقدر على فعل هذا، لا أعرف كيف، و لا يوجد من يدلني، و أنا لست ذكياً بما يكفي” و غير ذلك. و لكن ماذا لو قررت أن تقول بدلاً من ذلك: “سأتمكن من فعل هذا، أنا قادر، لقد قام به آخرون، و إن كنت لا أملك المعرفة فيوجد شخص في الخارج بإمكانه تعليمي”. عندما تصل ثقتك إلى أقل مستوياتها. ربما لأنك خسرت وظيفتك، أو لأن البنك حجز على منزلك أو لأنك أفلست. ثم ماذا؟ لتعزز من ثقتك، ابدأ بالنظر للخلف خلال حياتك و اكتب كل ما فعلته و كان ناجحاً. ابدأ بـ: تعلم المشي و تخرجك في الصف الأول… ثم عد إلى الخلف ثانية و انظر إلى كل الأشياء السيئة التي حدثت لك و أدرك أنك تغلبت على كل واحد منها. يجب أن تطرح دائماً سؤالاً ختامياً للحفاظ على العمل. لا تتردد أو تتجنب الدخول مباشرة في صلب الموضوع، أو الأسوأ من هذا و ذاك أن تنتظر حتى يقوم العميل المرتقب بالطلب. “هل تود المحاولة؟” يعد نوعاً من أنواع الأسئلة التي لا توحي بالضغط أو التهديد. اطلب تزكيات كتابية: التزكيات المكتوبة بشكل جيد، و الموجهة نحو النتائج، و الصادرة عن أشخاص محل تقدير، لها وقع قوي. فهي ترسخ جودة عملك، و تجعل منك شخصاً نزيهاً… اعرض على العميل أن تكتب خطاب التزكية بنفسك. هذا يوفر الوقت لعملائك… و عند إتمامك لهذا، أرسل خطاب التزكية مرة أخرى للعميل عن طريق البريد الالكتروني أو الرسائل النصية للحصول على موافقته، ثم اجعل العميل يطبع هذا الخطاب على ورق الخطابات الخاص به و يوقعه. و ثمة خيار جيد آخر [ غير عرض شهادات التزكية الخاصة بك بتعليقها في مكتبك أو غير ذلك ] و هو أن تأخذ أقوى جمل من بين عشر شهادات مختلفة و تضعها في ورقة واحدة إلى جانب أسماء العملاء. من الأفضل أن تدرج صورة صغيرة لكل عميل تعرض الرأس و الكتفين. يخسر العديد من الأشخاص آلاف الدولارات في مجال المبيعات كل عام لأنهم لا يملكون شيئاً آخر يعرضونه على العميل بعد عملية البيع الأولى. ابحث عن منتجات أو خدمات أخرى لتدرجها في حقيبة أعمالك. و احرص أيضاً على تطوير نظام لتحديد متى سيحتاج عملاؤك إلى المزيد من المنتج أو الخدمة الخاصة بك… و أسهل الطرق لتتمكن من تحقيق ذلك هو أن تسأل عملاءك عن الموعد الذي يتعين عليك فيه الاتصال بهم ليقوموا بإعادة الطلب. المصفوفة السحرية: هي عبارة عن شبكة تحتوي على قائمة عملائك في المحور العمودي الأيسر. و على امتداد المحور الأفقي في الجانب العلوي من الشبكة، اكتب قائمة بجميع المنتجات و الخدمات التي تقدمها. و أمام كل عميل، ضع علامة x في كل المربعات الموجودة في الشبكة و التي تمثل المنتج أو الخدمة التي تلقاها العميل منك. و من المفيد أن تحدد أيضاً موعد آخر عملية شراء قام بها العميل أمام كل منتج. ثم ألق نظرة على المربعات الفارغة في الشبكة، فهي تمثل فرصاً لبيع بعض المنتجات و الخدمات الأخرى التي تقدمها. في هذا العصر الذي تحتدم فيه المنافسة، فإن طلبك قد يضل طريقه في الزحام، دون أن يسمعه صانعو القرار الذين تتمنى الوصول إليهم. استخدم حسك الإبداعي لتأتي بطريقة عميقة الأثر لتقديم طلبك. إذا سلكت كل الطرق للوصول إلى ما تبتغيه، فمن المحتمل أن يمد لك البعض يد المساعدة عندما تطلب الدعم، أما هؤلاء الذين يطلبون المساعدة دون بذل أي مجهود فقلما يحالفهم النجاح. حقيقة مستخلصة من بحث قام به هربرت ترو: نسبة 94 بالمائة من جميع مندوبي المبيعات يكفون عن المحاولة بعد الاتصال الرابع. لكن نسبة 60 بالمائة من جميع المبيعات تمت بعد الاتصال الرابع. كل شيء في الحياة عبارة عن خيار. ربما يكون التنفس هو الاستثناء الوحيد. الواجبات تجعلك في موضع ضغط، في حين أن الاختيارات تجعلك في موقف قوة. عندما يميل أحدهم للانسحاب قبل تحقيق أهدافه، يسأله جيم [ جيم رون ] أربعة أسئلة: لماذا؟ لماذا تزعج نفسك؟ لماذا تعمل بجد؟ لماذا تفعل الكثير و الكثير؟ لماذا تضغط على نفسك؟ لماذا تستمر؟ لماذا؟ سؤال جيد! لماذا لا؟ لماذا لا تحقق كل ما في إمكانك تحقيقه؟ لماذا لا تقيس قدرتك؟ لماذا لا تكون ناجحاً؟ لماذا لا تستمتع بكل ما تقدمه لك الحياة، لماذا لا؟ لماذا ليس أنت؟ لماذا لا تكون أنت الذي يستمتع بنمط حياة رائع؟ آلاف الأشخاص يفعلون ذلك. لماذا لا تكون أنت الذي يرى العالم و يزور أماكن غريبة؟ لماذا لا تكون أنت الذي يتمتع بحرية و استقلال مالي؟ لماذا لا تكون أنت الذي يعيش في منزل جميل؟ لماذا لا تكون أنت الذي يحدث تغيرآً و يحفز الآخرين الذين يحتاجون لمساعدتك؟ لماذا لا تكون أنت الذي يعيش حياة النزاهة بينما يتخبط الآخرون؟ لماذا لا تكون أنت الذي يحقق أحلامه؟ لماذا ليس أنت؟ لماذا ليس الآن؟ ماذا تنتظر؟ لماذا تتراجع؟ ابدأ العملية الآن و استمر ف يالمضي قدماً، الأمس لا يمكن تعويضه… ليس هناك وقت أفضل. قريباً ستمر السنون و ذكرياتك إما أن تبهجك و إما أن تغضبك. إنه اختيارك! يوماً ما، بعد انقضاء عمر بأكمله في التفكير في يوم ما، و الندم على يوم ما، يصل هؤلاء المسوفون إلى نهاية حياتهم. و الجملة التي تطغى على أفكارهم و هم يتأهبون للرحيل هي: “ليتني قمت بالأشياء التي أردت القيام بها حقاً. كانت حياتي ستكون مختلفة للغاية”. هناك طريقتان في الأساس لتحفيز ذاتك: أن تبث في نفسك الخوف من عواقب عدم اتخاذك موقفاً حاسماً، أو أن تبث فيها الشعور بالإثارة من جراء التفكير في مكاسب و منافع كونك نشطاً. يقول سير جون تمبلتون: “لا تنس أبداً: سر صنع ثروة خاصة بك هو أن تصنعها لغيرك”. يقول سام بيكفورد: “من الجميل أن نحلم بأحلام كبيرة، لكن إذا لم تمتلك فرصة صغيرة بما يكفي لتعمل عليها في الوقت الحالي، فسوف تبقى أحلامك مؤجلة”، “التعليم هو أحد الأضلاع التي يمكن لشركة صغيرة استخدامها للتغلب على شركة أكبر و ممولة جيداً. منذ عشر سنوات حينما بدأت عملي كان أمامي منافس أكبر و أفضل في التمويل، فقررت أن ميزتي قد تكون أن أعرف أكثر. قرأت سبعمائة كتاب عن المبيعات و الأعمال و الدعاية و أي شيء آخر قد يمنحني معرفة أكثر منه. اليوم تقدمت شركتي إلى الصدارة بينما الشركة الأخرى تقريباً ما زالت في نفس المكان الذي كانت فيه منذ 10 سنوات”، “لا تفكر في أن اليوم قد انتهى عندما يقاطعك شيء ما، عد إلى العمل و استمر في المضي قدماً نحو أهدافك حتى و إن بدا أنك لا تتحرك من مكانك” يقول دون كامبل: “تخل عن فكرة التحكم في كل شيء و ركز على أفضل ما تستطيع فعله”، “ركز على إيجاد تخصص دقيق محدد تحبه بشغف، و امنح زبائن هذا السوق أدوات فريدة و قابلة للاستخدام لتزيد من شغفهم. كلما زاد اتساع السوق الذي اخترته، زاد منافسوك و صعب عليك التميز”، “امرح و كن جاداً: لا يعني المرح أن تكون سخيفاً، و إنما يعني أن تسترخي لتصبح صحبتك ممتعة، حتى عندما تكون جاداً. فإذا استطعت تقديم المعلومات الجادة لمجالك الدقيق بأسلوب مرح و مسل، فسيصطف الناس للعمل معك، أياً كان مجالك. من المبيعات الصناعية إلى تطوير البرمجيات، يبقى المفتاح واحداً؛ كن شخصاً يسترعي انتباه الناس”. ملاحظة: تم النقل ببعض التصرف. الكلمات بين [] من إضافتي."
