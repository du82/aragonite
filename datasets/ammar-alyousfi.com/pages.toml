title = "تعلم البرمجة بلغة بايثون - الدرس السادس: الثوابت والمتغيرات في بايثون | Ammar Alyousfi’s Blog"
description = "The personal website of Ammar Alyousfi which contains a blog about data science, data analysis, data visualization, machine learning, Python, and more."
full_description = "تعلم البرمجة بلغة بايثون - الدرس السادس: الثوابت والمتغيرات في بايثون Apr 6, 2020 في هذا الدرس سنتعرف بالتفصيل على الثوابت والمتغيرات في لغة بايثون مع أمثلة توضيحية. الثوابت (Constants) الثوابت هي قيم ثابتة قد تكون أرقاماً أو أحرفاً أو سلاسل نصية. يطلق عليها ثوابت لأنها لا تتغير. وهي أنواع: الثوابت الرقمية هي الأرقام التي نعرفها جميعاً مثل 2 و 5 و 4.6. الثوابت النصية هي حرف أو أكثر ضمن إشارتي تنصيص مثل “خالد” و “المدينة”. مثال: print(123) print('Hello') المتغيرات (Variables) هي أماكن في الذاكرة نستخدمها لتخزين بيانات برامجنا واسترجاعها في وقت لاحق، وكل متغير يجب أن نختار له اسماً. وكما رأينا سابقاً فلا يمكن أن تستخدم الكلمات المحجوزة لتسمية المتغيرات. ويطلق عليها المتغيرات لأننا نستطيع تغيير القيم المخزنة داخلها. مثال: x = 93.9 y = 26 في السطر الأول مثلاً نقول لبايثون أن تجد مكاناً خالياً في الذاكرة وأن تسميه x وأن تضع فيه الرقم 93.9. في السطر الثاني نقوم بفعل مشابه لتخزين القيمة 26 في متغير اسمه y. الآن إذا قمنا بتنفيذ الأمر التالي: x = 100 فإن ذلك يعني أننا سنشطب القيمة التي وضعناها مسبقاً في x وهي 93.9 وسنضع مكانها الرقم 100. تسمية المتغيرات يجب أن يبدأ اسم المتغير بحرف أو شرطة سفلية (underscore) _. يمكن أن يحتوي اسم المتغير على أحرف وأرقام وشرطات سفلية اسم المتغير حساس لحالة الأحرف وهذا يعني أن اسم val مختلف عن Val وكليهما مختلفين عن VAL. أسماء متغيرات صالحة للاستخدام: abc، var12، _text. أسماء متغيرات غير صالحة للاستخدام: 12var، $result، vip.text. يُنصح أن تكون أسماء المتغيرات معبرة عما تحتويه لتسهيل قراءة الكود فيما بعد وللمساعدة على تذكر وظيفة كل متغير. مثلاً هذا البرنامج: g33er9on1 = 14 g33er1on1 = 50.2 g33er5on1 = g33er9on1 * g33er1on1 print(g33er5on1) وهذا البرنامج: a = 14 b = 50.2 c = a * b print(c) لهما نفس النتائج ولكن قراءة وفهم الثاني أسهل بكثير من الأول. ولكن هناك طريقة أفضل لكتابة هذا البرنامج: days = 14 daily_rate = 50.2 pay = days * daily_rate print(pay) هذا البرنامج أفضل لأنه يعطي لكل متغير اسماً يعبر عن القيمة المخزنة فيه. فالمتغير الأول days (أي الأيام) يخزن عدد الأيام التي قام شخص بالعمل فيها، والمتغير الثاني daily_rate يخزن الأجرة المفروضة لكل يوم عمل، أما المتغير الثالث pay فهو يخزن المبلغ الذي ينبغي دفعه للعامل وهو ناتج ضرب عدد الأيام التي عملها بأجرة كل يوم. جمل الإسناد (أو جمل التعيين) جمل الإسناد هي الجمل التي نضع فيها قيماً داخل المتغيرات وقد رأينا عدة جمل إسناد من قبل، وهذا مثال آخر على جملة إسناد: x = 5.4 + 3 * (4 - x) تذكر أن الطرف الأيمن من الجملة يتم تنفيذه أولاً بشكل كامل ثم توضع النتيجة في المتغير الموجود في الطرف الأيسر، ولذلك يمكننا استخدام نفس المتغير في الطرفين بدون مشاكل. فيديو الدرس"
