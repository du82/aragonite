full_description = "ملخص كتاب العزيمة: قوة الشغف و المثابرة Apr 27, 2017 العنوان الأصلي للكتاب : Grit: The Power of Passion and Perseverance صفحة الكتاب على Goodreads: تقييم الكتاب وقت كتابة المنشور: 4.06. من ملاحظاتي على الكتاب: الموهبة ⨉ الجهد = المهارة ، المهارة ⨉ الجهد = الإنجاز الموهبة هي مدى السرعة التي تتحسن بها مهاراتك عندما تبذل جهداً. و الإنجاز هو ما يحصل عندما تأخذ مهاراتك المكتسبة و تستخدمها. بالطبع، تلعب فرصك – مثلاً، أن يكون لديك مدرب أو معلم رائع – دوراً مهماً جداً أيضاً… لا تتطرأ نظريتي إلى هذه القوى الخارجية، كما لا تتضمن الحظ. يقول نيتشه إن “تفاخرنا الزائف و حبنا لأنفسنا يروج لنظرية العبقري. لأننا عندما نعتبر العبقري كائناً عجيباً، لن نضطر إلى مقارنة أنفسنا به و بالتالي اكتشاف أننا نفتقر لخصائص مماثلة لخصائصه… عندها لن نحتاج إلى أن نتنافس معه”. بمعنى آخر، إضفاء طابع الأسطورة على الموهبة الفطرية يمكننا من الإفلات من المواجهة. يتيح لنا أن نسترخي في وضعنا الراهن. توصل نيتشه إلى نفس استنتاج دان تشامبليس، بأن الأشياء العظيمة ينجزها “أشخاص ينشط تفكيرهم في اتجاه واحد، و يستخدمون كل شيء كأدوات، و يراقبون الحياة الداخلية لأنفسهم و الآخرين بحماسة دائمة، و يلحظون المثل العليا و الحوافز في كل مكان، و لا يتعبون أبداً من دمج كل الوسائل المتوفرة لهم”. الحماسة شائعة؛ الثبات نادر. تخيل الأهداف في هرمية: في أسفل هذه الهرمية تقف معظم أهدافنا الملموسة و المحددة – الأعمال التي نضعها على قائمة مهامنا قصيرة الأجل: “أريد الخروج اليوم قبل الثامنة صباحاً”. تتواجد هذه الأهداف فقط كوسيلة لتحقيق غاية. بالمقابل، كلما كان الهدف أعلى في هذه الهرمية، كلما كان مجرداً و عاماً و مهماً أكثر، و كلما كان غاية بحد ذاته. التخلي عن الأهداف متدنية المستوى ليس أمراً يمكن التسامح عنه فحسب، بل و ضرورياً جداً أحياناً. يجب أن تستسلم عندما يمكن استبدال أحد الأهداف المتدنية المستوى بواحد آخر عملي أكثر، أو ذي فعالية أكبر، أو ممتع أكثر، أو منطقي أكثر. ما أعنيه بالشغف ليس فقط أن لديك شيئاً تهتم لأمره. ما أعنيه هو أنك تهتم لنفس ذلك الهدف المطلق بطريقة دائمة و حازمة و وفية. لست متقلباً. تسير في نفس الاتجاه، متلهفاً لكي تخطو حتى أصغر الخطوات إلى الأمام بدلاً من أن تخطو خطوة جانبية نحو وجهة أخرى… و تستمد معظم نشاطاتك أهميتها من ولائها لهمك المطلق، فلسفة حياتك. قصة بوب مانكوف الذي رفضت رسومه الكاريكاتورية من قبل “نيويوركر” ألفي مرة قبل أن تقبل رسمه لأول مرة. و فيما بعد، أصبح يعمل معها بالتعاقد. في دراسة تفهرس مميزات المتفوقين قامت بها طبيبة نفسية في ستانفورد تدعى كاثرين كوكس حيث درست التفاصيل المتعلقة بسيرة 301 شخصية بارعة بشكل استثنائي، منهم الشعراء و القادة السياسيون و العلماء و الجنود و الفلاسفة و الفنانين و الموسيقيين: وجدت الدراسة أن ما يميز المتفوقين عن بقية الناس كان مجموعة من أربعة مؤشرات. و قد ميزت تلك المؤشرات أيضاً بين العشرة الأوائل و العشرة الأخيرين من المتفوقين (أي بين المتفوقين بقوة و المتفوقين فحسب). جمعت كوكس تلك المؤشرات و أسمتها “إصرار الدافع“. يمكن بسهولة إعادة صياغة مؤشرَين كبنود شغف لمقياس العزيمة: – الدرجة التي يعمل بها مع الكائنات البعيدة في المستقبل (على عكس العيش من دون استعداد أو تخطيط) – ميل إلى عدم التخلي عن إنجاز المهام لمجرد قابلية تغييرها. عدم السعي وراء شيء جديد بحجة التجديد سألت هستر عما تعلمته من أحاديثها مع أكثر من مئتي شخص “ناجح جداً” مثلما وصفتهم خلال محادثتنا. أجابت: “هناك شيء يتم التطرق إليه كل مرة هو: ‘أحب ما أفعله’. و يعبر عنه الأشخاص بشكل مختلف…”. تبين الأبحاث أن الأشخاص سيكونون راضين أكثر بكثير عن وظائفهم عندما يقومون بشيء يلائم اهتماماتهم الشخصية. هذا هو استنتاج تحليل تلوي (أي تحليل إحصائي لنتائج عدة دراسات) جمّع بيانات من حوالي مئة دراسة مختلفة شملت راشدين يعملون في كل مهنة ممكن تخيلها. مثلاً، الأشخاص الذين يستمتعون بالتفكير بأفكار مجردة ليسوا سعداء في إدارة تفاصيل مشاريع معقدة لوجستياً؛ بل يفضلون حل مسائل رياضيات. و الأشخاص الذين يستمتعون حقاً بالتفاعل مع الاخرين ليسوا سعداء عندما تتطلب منهم وظيفتهم العمل بمفردهم أمام الكومبيوتر طوال اليوم؛ سيكونون أفضل بكثير عندما يعملون في وظائف مثل المبيعات أو التعليم. عندما بدأت بإجراء مقابلات مع أصحاب العزيمة الذين يحتذى بهم، افترضت أنه ستكون لديهم جميعاً قصص عن اللحظة الفريدة التي اكتشفوا فيها شغفهم فجأة، و أعتقد أن هذا هو أيضاً ما يتخيل المتخرجون اليافعون أنه سيحصل عندما يكتشفون شغف حياتهم. فلا تكون لديهم أي فكرة عما سيفعلونه في حياتهم، و فجأة، يصبح كل شيء واضحاً… لكن الواقع هو أن معظم أصحاب العزيمة الذين أجريت مقابلة معهم أخبروني أنهم أمضوا سنوات عديدة في استكشاف اهتمامات مختلفة، و أن الاهتمام الذي استحوذ في نهاية المطاف على كل تفكيرهم في اليقظة لم يكن واضحاً من لحظة الاكتشاف الأولى أنه سيكون نصيبهم من الحياة. لا تُكتشف الاهتمامات من خلال الاستبطان (و هو فحص المرء لدوافعه و مشاعره)، بل تحفزها التفاعلات مع العالم الخارجي… لا يمكنك أن تعرف من دون اختبار ما هي الاهتمامات التي ستتعلق بها و التي لن تتعلق بها. من السابق لأوانه في أي مسعى جديد أن تسأل نفسك بعصبية كل بضعة أيام عما إذا كنت قد عثرت على شغفك أم لا. و من النتائج المهمة التي توصل لها بلوم أن تطور المهارة يتم عبر ثلاث مراحل مختلفة، و كل مرحلة منها تدوم لعدة سنوات. و يتم اكتشاف الاهتمامات و تطويرها في ما يسميه بلوم “السنوات المبكرة”. هناك احتياجات تحفيزية مختلفة للخبراء و المبتدئين. ففي بداية أي مسعى، نحتاج إلى تشجيع و حرية لكي نعرف ما الذي نستمتع به، و نحتاج إلى انتصارات صغيرة، و نحتاج إلى تصفيق. نعم، يمكننا تحمل قليل من الانتقاد و الملاحظات التصحيحية. نعم، نحتاج إلى تمرن. و لكن ليس كثيراً جداً و ليس باكراً جداً. مارس ضغطاً على مبتدئ و ستقضي على اهتمامه الناشئ. يملك بعض الأشخاص خبرة عشرين سنة، بينما يملك البعض الآخر خبرة سنة واحدة… عشرين مرة متتالية. إذا كنت قد قرأت بحث إريكسون (و هو الطبيب النفسي الإدراكي الذي أمضى حياته المهنية في دراسة كيف يكتسب الخبراء مهارات من الطراز العالمي) الأصلي، ستعرف أن عشر آلاف ساعة من التمرين على فترة عشر سنوات هو مجرد معدل وسطي تقريبي، فالمطلوب ليس بضع ساعات أو عشرات أو مئات الساعات، بل آلاف و آلاف ساعات التمرن على امتداد سنوات و سنوات. لكن البصيرة الحاسمة في بحث إريكسون ليست أن الخبراء يتمرنون لعدد أكبر من الساعات، بل أنهم يتمرنون بشكل مختلف. فخلافاً لمعظمنا، يسجل الخبراء آلاف و آلاف الساعات مما يسميه إريكسون “تمرن متعمَّد“. كل واحد من المتطلبات الأساسية للتمرن المتعمد غير جدير بالملاحظة: – هدف مرن معرّف بوضوح – تركيز و جهد كاملان – ملاحظات مباشرة و مثقِّفة – تكرار مع تفكير و تحسين لكن كم عدد ساعات التمرن التي يقوم بها معظم الأشخاص و تستوفي كل هذه المتطلبات الأربعة؟ أظن أن العديد من الأشخاص لا يقومون بأي ساعة تمرن متعمد في اليوم. عليك اكتشاف متى و أين تكون في أقصى درجات راحتك لكي تقوم بالتمرن المتعمد. و بعدما تختار ما يناسبك، قم بالتمرن المتعمد هناك و في ذلك التوقيت كل يوم. لماذا؟ لأن الروتين أفضل شيء عندما تتعلق المسألة بإنجاز شيء صعب. تبين مجموعة هائلة من الدراسات، بما في ذلك بعض دراساتي الشخصية، أنه عندما تصبح معتاداً على التمرن في الوقت نفسه و في المكان نفسه كل يوم، ستكون بالكاد بحاجة إلى التفكير لكي تبدأ بالعمل، بل ستقوم به بكل بساطة. عندما بدأ بلوم بمقابلة رياضيين و فنانين و علماء رياضيات و علماء من الطراز العالمي منذ ثلاثين سنة، عرف أنه سيتعلم شيئاً عن كيفية وصول الأشخاص إلى قمة حقول اختصاصاتهم. فرغم الفروق السطحية في نشأتهم و تدريبهم، مر كل الأشخاص المذهلون في دراسة بلوم في ثلاث فترات مختلفة من التطور. و قد ناقشنا ما يسميه بلوم “السنوات الأولى” في الفصل 6 عن الاهتمام و “السنوات الوسطى” في الفصل 7 عن التمرن. و قد وصلنا الآن إلى المرحلة الثالثة و الأخيرة و الأطول في طراز بلوم – “السنوات اللاحقة” – عندما، على حد تعبيره، يصبح “الهدف و المعنى الأكبر” للعمل واضحاً أخيراً. فكرة الهدف في جوهرها هي فكرة أن ما نفعله مهم لأشخاص غير أنفسنا. و أنت في عملك، يمكن أن تعتبر نفسك في وظيفة (مجرد شيء عليك فعله)، أو مهنة (شيء سيؤدي إلى مزيد من النجاح الشخصي)، أو رسالة (عمل يربطك بشيء أكبر بكثير من الذات). لدي ثلاث توصيات للبدء بصقل إحساس بالهدف: – التفكير كيف يستطيع العمل الذي تقوم به حالياً أن يؤثر إيجابياً على المجتمع – التفكير كيف يمكنك، بطرق صغيرة لكن ذات معنى، تغيير عملك الحالي لتحسين ارتباطه بقيمك الجوهرية – إيجاد إلهام في قدوة هادفة يفترض أولئك الأشخاص المؤيدون للنمو أنه من الممكن، مثلاً، أن تصبح أذكى إذا حصلت على الفرص و الدعم المناسبَين و إذا بذلت جهداً كافياً و إذا كنت مقتنعاً أنه يمكنك فعل ذلك. و بالعكس، يظن بعض الأشخاص أنه يمكنك أن تتعلم مهارات، كركوب الدراجة مثلاً، لكن لا يمكنك تدريب قدرتك على تعلم المهارات – أي، موهبتك. المشكلة في امتلاك عقلية الثبات الثانية هذه – و العديد من الأشخاص الذين يعتبرون أنفسهم موهوبين يمتلكونها – هي أنه لا يوجد طريق من دون مطبات، و سوف تصطدم بمطب في نهاية المطاف. عندها، يصبح امتلاك عقلية ثابتة عائقاً كبيراً. عندما تسأل كارول من أين تأتي عقلياتنا، ستشير إلى التاريخ الشخصي للأشخاص في النجاح و الفشل و كيف تفاعل الأشخاص الذين من حولهم، بالأخص أولئك المتواجدين في موضع سلطة، مع تلك النتائج. خذ مثلاً ما قاله لك الأشخاص عندما كنت طفلاً و قمت بشيء جيد حقاً. هل أشادوا بموهبتك؟ أم أشادوا بجهودك؟ في كلا الحالتين، الأرجح أنك تستخدم نفس اللغة هذه الأيام عند تقييمك الانتصارات و الهزائم. يقول ببيل ماكناب الذي يشغل منصب المدير العام لفانغارد، و هي أكبر مزود في العالم لصناديق الاستثمار: “الأشخاص الذين حققوا نجاحاً هنا بقوا على مسار نمو. و يستمرون بمفاجأتك حول مقدار نموهم. لدينا أشخاص هنا إذا نظرت إلى سيرتهم الذاتية عندما جرى توظيفهم ستقول لنفسك “غريب!، كيف استطاع هذا الشخص أن يحقق كل هذا النجاح؟”، و لدينا آخرون جاءوا بتوصيات مدهشة و يجعلونك تتساءل “بماذا لم يحققوا الكثير؟”. هناك دراسات لا تعد و لا تحصى تبين أن الأولاد المنخرطين أكثر في نشاطات خارج المنهاج الدراسي ينجحون أكثر في كل قياس يمكن تخيله. المدرسة صعبة، لكنها ليست مثيرة للاهتمام جوهرياً بالنسبة للعديد من الأولاد. الدردشة النصية مع الأصدقاء مثيرة للاهتمام، لكنها ليست صعبة. و ماذا بشأن النشاطات خارج المنهاج الدراسي؟ إنها يمكن أن تكون مثيرة للاهتمام و صعبة في نفس الوقت. أهمية النشاطات اللامنهجية عندما يستمر الطالب فيها لفترة طويلة هي أنها تدريب على العزيمة. كان ويلينغهام و علماء آخرون في هيئة الاختبارات التعليمية (ETS) يعرفون بأن العلامات المدرسية و مجاميع النقاط في الاختبارات غير دقيقة كثيراً في توقع النجاح لاحقاً في الحياة. فغالباً ما ينتهي المطاف بطالبين يحملان علامات مدرسية و مجاميع نقاط متشابهة في الاختبارات بأن ينجحا بشكل مختلف جداً لاحقاً في الحياة. لذا فالسؤال البسيط الذي انطلق ويلينغهام للإجابة عليه كان “ما هي الصفات الشخصية المؤثرة الأخرى؟”. لمعرفة الجواب، قام فريق ويلينغهام بمتابعة عدة آلاف من الطلاب لمدة خمس سنوات، بدءاً من سنتهم الأخيرة في المدرسة. عندما جاءت كل البيانات أخيراً، كان ويلينغهام واضحاً و جازماً بشأن ما تعلمه. من بين أكثر من مئة صفة شخصية تم اختبارها، كان لإحدى الصفات قدرة أكبر بكثير من غيرها على توقع النجاح لاحقاً. هذه الصفة هي الاستكمال أو المتابعة حتى النهاية. فقد شارك الطلاب الذين نالوا أعلى تصنيف استكمال في نشاطين مختلفين خارج المنهاج الدراسي للثانوية لعدة سنوات، و قد تحسنوا بشكل كبير في كل نشاط من ذينك النشاطين. كانت القوة التوقعية للاستكمال مدهشة: فبعد التحكم للعلامات المدرسية و مجموع النقاط في اختبار SAT، تمكن استكمال النشاطات خارج المنهاج الدراسي في الثانوية من توقع أن يتخرج الطالب من الكلية بمرتبة شرف أكاديمية أفضل مما توقعه أي متغير آخر. بشكل مماثل، كان الاستكمال أفضل قياس لتوقع أن يشغل الطالب موضعاً قيادياً في مرحلة الشباب. و أخيراً توقع الاستكمال، بشكل أفضل من كل الصفات الشخصية التي قاسها ويلينغهام، أن يحقق الشباب إنجازات ملحوظة في كل الميادين. مبدأ التماثل: تابع برنت و معاونوه في إحدى الدراسات ألف مراهق في نيوزلندا و هم يدخلون مرحلة البلوغ و يبحثون عن وظائف. على مر السنوات، انتهى المطاف بالمراهقين العدائيين بأن يشغلوا وظائف أقل هيبة و يواجهوا مصاعب في تسديد فواتيرهم. أدت تلك الظروف بدورها إلى زيادة مستويات العداء لديهم، مما زاد من تآكل فرص عملهم. بالمقابل، دخل المراهقون المحبوبون أكثر دورة حميدة في التطور النفسي. فقد أمن أولئك “الأولاد اللطفاء” وظائف مرموقة أكثر قدمت لهم أماناً مالياً أفضل – و هذه نتائج حسنت ميلهم نحو الاختلاط الاجتماعي. إنني أدرك أن هناك مقايضات لأي خيار، و يمكنني تقدير كيف ينطبق ذلك على العزيمة. فمن غير الصعب ذكر حالات يكون التخلي فيها هو أفضل قرار يقوم به المرء. حسب خبرتي الشخصية، كان قراري بالتخلي عن البيانو عندما أصبح واضحاً أنني لا أملك أي اهتمام أو موهبة به قراراً رائعاً. ملاحظة: تم النقل ببعض التصرف. الكلمات بين [] من إضافتي. نسخة الكتاب الموجودة في الصورة أعلاه لم تعجبني ترجمتها كثيراً؛ إن استطعت قراءة الكتاب بالانكليزية فذلك أفضل."
