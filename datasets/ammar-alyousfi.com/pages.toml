title = "My notes from The Hundred Years’ War on Palestine | Ammar Alyousfi’s Blog"
description = "Book Full Title: The Hundred Years’ War on Palestine: A History of Settler-Colonial Conquest and Resistance, 1917-2017."
full_description = "My notes from The Hundred Years' War on Palestine Jan 6, 2024 • Category: Books Tags: Book summary, History. Book Full Title: The Hundred Years’ War on Palestine: A History of Settler-Colonial Conquest and Resistance, 1917-2017. Book page on Goodreads: The Hundred Years’ War on Palestine: A History of Settler-Colonial Conquest and Resistance, 1917-2017. Book in A Paragraph The book talks about the history of the conflict in today’s Palestine and Israel since its beginning in the 19th century. The author is a professor of modern Arab studies at Columbia university; the book cites many authentic sources and archival materials. The book is divided into parts where each part talks about a significant period of time in the conflict. Impressions I started reading the book after the current episode of the conflict started in October 2023. Although I’m familiar with the situation as I’m from the region, this book gave me a lot of new information about the history of the conflict. I liked that it cites many references including many western and Israeli sources and archives, not only Palestinian and Arabic sources. I think it’s a must-read for anyone who wants to understand the conflict and its important history. My Notes I took a lot of notes while reading the book: it was filled with important details and historical material that are essential to understanding the conflict as a whole with the right context. So I ended up with 64 pages of notes! I thought it’s not practical to share all of them here in a blog post. So I used GPT-4 on ChatGPT to summarize the notes of each chapter in quick bullet points. They give a good idea about what the chapter is about. However, they are definitely not a replacement for reading the book. Here are the AI summarized notes from each chapter. Introduction Early Zionist Congresses: The first two Zionist congresses occurred in Basel, Switzerland, in 1897 and 1898, marking the formal beginning of the Zionist movement. European Jewish Settlers in Palestine: The earliest European Jewish settlers arrived in Palestine in the late 1870s and early 1880s, beginning the process of Jewish immigration to the region. Theodore Herzl’s Views: Theodore Herzl, the founder of Zionism, contemplated the colonization of Palestine as early as 1895. He considered the gentle expropriation of private property and the discreet removal of the impoverished local population to facilitate Jewish settlement. Palestine as a Colonial War Zone: The author shows the history of Palestine as a colonial war against the indigenous population, driven by various parties aiming to establish another people in the region against the will of the locals. Zionism’s Biblical Appeal: Zionism, seen as a colonial-national movement, gained support particularly in Great Britain and the United States due to its biblical connections, which overshadowed its modern, colonial nature. Misrepresentation of Palestine’s History: There is a significant amount of literature attempting to portray pre-Zionist colonization Palestine as barren, empty, and backward, often riddled with historical inaccuracies and bigotry. Herzl’s Reference to Palestinian Arabs: In a letter to Yusuf Diya, Herzl referred to Palestinian Arabs, who constituted about 95% of the local population, as the “non-Jewish population.” The 1917 Balfour Declaration: This British cabinet declaration committed to the creation of a Jewish homeland in Palestine but failed to mention the Palestinian majority. This omission set the course for the region’s future. Denial of Palestinian Existence in Literature and Culture: The denial or negation of Palestinian existence is a recurrent theme in some Western and Israeli popular culture, literature, and political discourse. Zionism’s Colonial Roots: Many early Zionists, including Ze’ev Jabotinsky, openly acknowledged the colonial nature of their project. This perspective was dominant until the post-World War II era, when colonialism became widely discredited. Zionism’s Institutional Foundations: The social and economic institutions established by early Zionists, essential to the movement’s success, were understood and described as colonial. The Jewish Colonization Association was a key example. Rebranding of Zionism: Following World War II, in an era of decolonization, Zionism and Israel distanced themselves from their colonial origins. Zionism, previously supported by British colonialism, rebranded itself as an anti-colonial movement, especially after the British limited Jewish immigration with the 1939 White Paper. 1. The First Declaration of War, 1917–1939 The chapter “The First Declaration of War, 1917–1939” from the book “The Hundred Years’ War on Palestine” discusses the impacts of World War I and subsequent British policies on Palestine, leading to a prolonged conflict with the Palestinian people. Ottoman Empire’s Heavy Losses in WWI: The Ottoman Empire suffered the heaviest losses of any major combatant in WWI, with over three million deaths, mostly civilians. This included the Armenian, Assyrian, and other Christian massacres. Palestinian Experience of Ottoman Rule’s End: Palestinians, after 400 years under Ottoman rule, faced the disconcerting shift to alien rule and learned of the Balfour Declaration amidst great suffering and loss. Balfour Declaration (1917): The British cabinet, led by Arthur James Balfour, expressed support for a Jewish national home in Palestine, promising only civil and religious rights to the non-Jewish communities. This declaration ignored the political or national rights of the Arab majority, who constituted 94% of the population. British Strategic Interests and Zionist Support: Britain’s support for the Zionist movement was motivated by geopolitical strategic interests, religious sentiments, and the desire to reduce Jewish immigration to Britain. This was not an act of altruism but served Britain’s imperial ambitions. Colonial Conflict Initiated: The Balfour Declaration effectively started a colonial conflict, aiming to establish a Jewish majority at the expense of the Arab population. Palestinian Reaction to Balfour Declaration: The news of the declaration reached Palestinians slowly, causing shock and protest. They began to organize politically, opposing both British rule and Zionist movement. Palestinian National Identity Emergence: Palestinian identity emerged in response to various stimuli, including opposition to European control and Zionism. Local newspapers and memoirs of the time reflect this growing national consciousness. Palestinian Political Efforts: Palestinians held a series of congresses and established an Arab executive to demand independence and oppose the Balfour Declaration, but their efforts were largely ignored by the British. Popular Palestinian Resistance: There were multiple instances of spontaneous popular resistance against British support for Zionist aspirations, leading to demonstrations, strikes, and riots. League of Nations Mandate for Palestine (1922): This mandate formalized British governance and amplified the Balfour Declaration, further marginalizing Palestinians by ignoring their historical connection to the land. Jewish Population Growth and Nazi Persecution: The Jewish population in Palestine grew, particularly with the rise of the Nazis in Germany and the resulting Jewish immigration. Palestinian Revolt (1936-1939): A massive grassroots uprising, including a six-month general strike, led to the formation of the Arab Higher Committee. The British, however, suppressed this revolt with severe force, weakening the Palestinian position significantly. British Attempt at Appeasement (1939): In response to the revolt and international pressure, Britain issued a White Paper proposing limits on Jewish immigration and land sales and promising self-determination, but these promises were not fully implemented. Persistent British Reluctance to Modify Policy: Despite Palestinian protests, British policies remained largely unchanged, influenced by obligations to the Zionists under the League of Nations Mandate. 2. The Second Declaration of War, 1947–1948 Palestinian Displacement: By 1949, a large portion of the Palestinian population, approximately 720,000 out of 1.3 million, became refugees due to forced displacement, with the new state of Israel emerging in the territory. Global Power Shifts: Post-World War II, the United States and the USSR emerged as dominant powers in the Middle East, influencing the Palestinian situation. The U.S., in particular, became a significant external actor in the region. Zionist Movement and the Biltmore Program: The Zionist movement, under David Ben-Gurion, anticipated this power shift. The 1942 Biltmore Program marked a pivotal moment, openly advocating for a Jewish state in Palestine, gaining significant American support and public opinion, partly due to the Holocaust’s impact. Anglo-American Committee of Inquiry (1946): This committee’s formation and its recommendations, favoring the entry of Jewish refugees into Palestine, indicated a shift in control from Britain to the United States in the region. The Palestinians, lacking a central state system and effective allies, were at a disadvantage against the organized Jewish Agency. British Withdrawal and UN Intervention: Britain’s diminishing role led to the UN’s involvement, with the United States and the USSR playing dominant roles. The UN’s partition plan in 1947 favored the Jewish minority, igniting further conflict. The Nakba: This period saw the systematic expulsion and flight of Palestinians, termed the Nakba. Notable events included the ethnic cleansing of major Arab urban centers and massacres, such as the one in Dayr Yasin. Israeli State Formation and Arab Response: The formation of Israel on May 15, 1948, led to further military confrontations, with the new Israeli army defeating the Arab armies. The Palestinians’ military and diplomatic weakness was evident. Personal Accounts: The author shares personal stories, like that of his grandparents being displaced from their home. Israel and International Dynamics: Post-1948, Israel did not immediately receive extensive American support. The United States often condemned Israeli military actions at the UN, reflecting a complex international stance. Palestinians in Israel: The minority of Palestinians who remained in Israel faced martial law and land expropriation, transforming Palestine into a predominantly Jewish state. Jordan’s Role and Regional Fear of Israel: Jordan’s Arab Legion was the only effective Arab force against Israel in 1948. The Arab world’s fear of Israel’s military strength was profound. Israeli Military Actions and International Reactions: Israeli reprisals and attacks on Palestinians and their neighbors often led to UN condemnations. Notable incidents include the Qibya massacre and the Suez War of 1956, where Israel, alongside Britain and France, attacked Egypt. Aftermath of the Suez War: The Suez War’s political outcomes were unfavorable to the aggressors, with superpower pressure leading to their withdrawal. Israeli actions in Gaza during this time were condemned internationally. 3. The Third Declaration of War, 1967 Misconception of Israeli Vulnerability (1967): Contrary to the prevalent myth of Israel being a small, vulnerable state in 1967, the reality was different. U.S. officials, including McNamara and Johnson, acknowledged Israel’s military superiority over Arab states. 1967 War and Military Superiority: The war unfolded as predicted by the CIA and Pentagon, with Israel’s air force striking first and gaining air superiority. This advantage allowed Israel to swiftly conquer territories including the Sinai Peninsula, Gaza Strip, West Bank, Arab East Jerusalem, and the Golan Heights in six days. Causes of the War: The war’s roots lay in various factors, including the rise of Palestinian commando groups and Israel’s diversion of Jordan River waters, leading to regional tensions. Fatah’s attack on a water-pumping station in 1965 was a significant event. Egypt’s Provocation and Israel’s Response: Despite its military being stretched in the Yemeni civil war, Egypt provoked Israel by moving troops into the Sinai Peninsula and expelling UN peacekeepers, which Israel used as a casus belli for its preemptive strike. US and Soviet Union Roles: The U.S. realigned its Middle Eastern priorities, moving closer to Israel, while the Soviet Union sought to protect its interests and allies in the region, as seen in the Security Council’s actions. Security Council Resolution 242: This resolution, which followed the war, emphasized the “inadmissibility of the acquisition of territory by war” but linked Israeli withdrawal to peace treaties with Arab states. Its ambiguous language left loopholes regarding the territories Israel could retain. Palestinian Erasure and Israeli Diplomacy: Post-war, Israeli and international narratives often ignored or denied Palestinian identity and rights. The Palestinian struggle for recognition and rights faced significant challenges. Palestinian Resistance and PLO’s Role: Palestinian resistance groups like Fatah and the PFLP played significant roles in regional politics and the evolution of the Palestinian identity. The PLO, under Arafat’s leadership, gained prominence but also faced complex strategic and diplomatic challenges. Israeli and US Strategies: Both Israel and the U.S. worked to divide and weaken Arab unity and influence, often exploiting internal Arab rivalries. Assassinations and Political Violence: The period saw numerous assassinations and acts of violence, including those targeting Palestinian leaders and figures by various parties, including Israel’s Mossad and conflicting Arab regimes. Palestinian Diplomacy and Struggle for Recognition: Despite challenges, the PLO achieved some diplomatic successes, gaining recognition and presenting the Palestinian cause on international platforms. Shifts in Palestinian Objectives: Over time, Palestinian political objectives evolved, moving from the idea of a single democratic state to the concept of a Palestinian state alongside Israel. Arab States’ Stance and SC 242: Arab states gradually accepted Security Council Resolution 242, which indirectly amounted to recognizing Israel within its 1949 armistice lines. Complex Regional Dynamics: The chapter also highlights the intricate and often conflicting interests of regional players like Egypt, Jordan, Syria, and Lebanon, and their interactions with Palestinian groups and Israel. 4. The Fourth Declaration of War, 1982 This chapter focuses on Israel’s invasion of Lebanon in 1982, particularly against the Palestine Liberation Organization (PLO). Initial Assault: Israel’s invasion began with an intense aerial bombardment of Beirut and southern Lebanon, followed by a massive ground assault on June 6, leading to the occupation of much of Lebanon. Casualties and Scale: The invasion resulted in nearly 50,000 casualties in "
