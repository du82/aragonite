description = "The personal website of Ammar Alyousfi which contains a blog about data science, data analysis, data visualization, machine learning, Python, and more."
full_description = 'كيف تتعلم وتستفيد من خبرة وتجربة غيرك أو كيف تعرف من أين تبدأ Nov 27, 2017 يقول نيوتن : If I have seen further than others, it is by standing upon the shoulders of giants. والذي يمكن أن يترجم إلى: " إن كانت رؤيتي أبعد من رؤية الآخرين، فذلك بوقوفي على أكتاف العمالقة". إذا أردت تعلم مهارة ما، أو أردت أن تدرس فرعاً من فروع العلم لوحدك، أو ما شابه ذلك، فهناك نصيحة من الممكن أن تختصر عليك جهداً وتفكيراً ووقتاً، وهي أن تستفيد من الخبراء في المجال الذي تنوي الدخول فيه. فمثلاً ابحث عن شخص قام بما تريد القيام به ونجح فيه ثم انظر ما هي الخطوات التي اتبعها والطرق التي سلكها حتى وصل. ويمكن أن نستفيد من الإنترنت وخدماته التي يقدمها والأبواب التي يفتحها في ذلك. لنفترض أنك تريد تعلم تطوير الويب (web development)، ولكنك لا تعرف من أين تبدأ ولا المواد التعليمية التي تختارها خاصة مع وجود العديد والعديد من مصادر التعليم في الوقت الحاضر (طبعاً أقصد المصادر الانكليزية، أما العربية فهي قليلة). فما عليك فعله هو التوجه إلى Google والبحث عن: How I became a web developer أو ما شابهها، وسيظهر لك في نتائج البحث تجارب لآخرين يشاركونك فيها الطريق الذي سلكوه ليصبحوا على ما هم عليه، وقد يظهر لك دليل كتبه خبير في هذا المجال. ابحث وتصفح نتائج البحث وقارن بينها واختر أفضلها ثم ابدأ طريقك وثابر عليه. لا أعرف إن كانت هذه الطريقة مجدية في كل الحالات، ولكن أنا جربتها في طريقي لتعلم web development وأنا الآن ما زلت أتعلم وفق مقالة ظهرت لي عندما بحثت باستخدام الطريقة المذكورة. يمكن تطبيق هذه الفكرة في العديد من المجالات، وليس فقط في تعلم البرمجة. أياً كان ما تريد تعلمه، استخدمها لتطلع على نتاج خبرات الآخرين. الصورة من تصوير Ethan Sykes'
