description = "The personal website of Ammar Alyousfi which contains a blog about data science, data analysis, data visualization, machine learning, Python, and more."
full_description = '''تعلم البرمجة بلغة بايثون - الدرس الثامن: أنواع البيانات في بايثون Apr 20, 2020 في هذا الدرس سنتعرف على أنواع البيانات في بايثون وسنرى أمثلة على كل نوع وسنرى طريقة لمعرفة نوع البيانات داخل برامج بايثون. أنواع البيانات (Data Types) في بايثون هناك ثلاثة أنواع رئيسية للبيانات والمتغيرات: رقم صحيح (Integer) مثل 2 رقم عشري (Floating-point Number) مثل 3.5 سلسلة نصية (String) مثل "نص" بايثون تعرف الفرق بين هذه الأنواع. مثلاً العامل + إذا تم استخدامه بين رقمين سيقوم بعملية الجمع بينما إذا تم استخدامه بين سلسلتين نصيتين سيقوم بدمجهما معاً كما يلي: >>> dd = 1 + 8 >>> print(dd) 9 >>> ee = 'hello ' + 'Ahmad' >>> print(ee) hello Ahmad لكن ماذا لو استخدمت + بين سلسلة نصية وعدد كما في المثال التالي: >>> gg = 'hello ' + 'Ahmad' >>> gg = gg + 1 في هذه الحالة بايثون لن تستطيع تنفيذ هذا الأمر وستظهر رسالة خطأ: تخبرك رسالة الخطأ بنوع الخطأ وفي أي سطر وقع وتخبرك بسبب الخطأ. في هذه الحالة السبب يقول أنه يمكن دمج سلسلة نصية مع سلسلة نصية أخرى فقط وليس مع عدد. بايثون توفر لنا دالة (function) اسمها type() تمكننا من معرفة نوع البيانات كما في المثال التالي: >>> type(1234) int >>> type('ammar') str >>> type(11.44) float >>> x = 'text' >>> type(x) str فكما ترى في السطر الأول نضع عدداً صحيحاً فتخبرنا بايثون أن نوعه int وهي اختصار كلمة Integer وتعني عدد صحيح. في السطر الثاني نضع سلسلة نصية فتخبرنا بايثون أن نوعها str وهي اختصار كلمة String وتعني سلسلة نصية. في السر الثالث نضع عدداً عشرياً (أي فيه فاصلة عشرية) فتخبرنا بايثون أن نوعه float اختصاراً لـ Floating-point وتعني الفاصلة العائمة وهي طريقة تمثيل الأعداد العشرية في الحاسب. نرى أيضاً أنه يمكننا باستخدام هذه الدالة معرفة نوع المتغير حيث قمنا بتعريف متغير اسمه x ووضعنا سلسلة نصية بداخله ثم عرفنا باستخدام الدالة أن نوعه str. فيديو الدرس'''
author = "Ammar Alyousfi"
year_published = 2020
