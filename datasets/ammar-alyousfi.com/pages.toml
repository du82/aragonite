title = "ملخص كتاب التقليل الرقمي: اختيار حياة من التركيز في عالم كثير الضجيج | Ammar Alyousfi’s Blog"
description = "انتهيت مؤخراً من قراءة كتاب Digital Minimalism: Choosing a Focused Life in a Noisy World - وهو ما يمكن ترجمته إلى التقليل الرقمي: اختيار حياة من التركيز في عالم كثير الضجيج - لمؤلفه كال نيوبورت الأستاذ المساعد في علم الحاسوب في جامعة جورج تاون الأمريكية ومؤلف عدة كتب أخرى لاقت نجاحاً واسعاً."
full_description = "ملخص كتاب التقليل الرقمي: اختيار حياة من التركيز في عالم كثير الضجيج May 14, 2020 انتهيت مؤخراً من قراءة كتاب Digital Minimalism: Choosing a Focused Life in a Noisy World - وهو ما يمكن ترجمته إلى التقليل الرقمي: اختيار حياة من التركيز في عالم كثير الضجيج - لمؤلفه كال نيوبورت الأستاذ المساعد في علم الحاسوب في جامعة جورج تاون الأمريكية ومؤلف عدة كتب أخرى لاقت نجاحاً واسعاً. أحببت الكتاب وأعجبتني الكثير من الأفكار التي يطرحها والتي لها أهمية عظيمة في وقتنا هذا حيث ازداد توغل التكنولوجيا في حياتنا إلى حد غير مسبوق. في هذه التدوينة سأشارك أكثر ما أحببته في الكتاب (مع تصرف بسيط لجعل المحتوى مناسباً للتدوينة). ملاحظة: قمت بإنشاء مقطعي فيديو لخصت فيهما الكتاب ، لمشاهدتهما انظر أسفل الصفحة. صفحة الكتاب على موقع Goodreads الخاص بالكتب: Digital Minimalism. الكتاب غير مترجم إلى العربية بعد. ما هي مشكلتنا مع التكنولوجيا الحديثة؟ إن الانجذاب الذي لا يقاوم للشاشات يقود الناس للإحساس بأنهم يتخلون عن الاستقلالية والقرار الذاتي بشأن كيفية توجيه انتباههم وتركيزهم. لقد قاموا بتحميل التطبيقات بدوافع جيدة لكنهم اكتشفوا لاحقاً أن هذه التطبيقات بدأت بتدمير القيم التي دفتعهم لتحميلها في بداية الأمر: لقد انضموا لفيسبوك للبقاء على تواصل مع الأصدقاء في أماكن بعيدة لكن انتهى بهم الأمر وهم لا يستطيعون إجراء محادثة متصلة بدون مقاطعة مع صديق يجلس أمامهم. ما يجعلنا نشعر بعدم الراحة هو الإحساس بفقدان السيطرة، وهذا الإحساس يتجلى في عدة مواقف كل يوم، مثلاً عندما نشرد مع هواتفنا خلال وقت استحمام طفلنا أو عندما لا نستطيع الاستمتاع بلحظة جميلة بدون أن تأتينا رغبة جنونية لتسجيلها لجمهور افتراضي. إن الرغبة في تفقد تويتر أو تحديث صفحة فيسبوك أصبحت كارتعاش عصبي يمزق الوقت إلى أجزاء صغيرة جداً لا تصلح لبناء الحياة كما نخطط لها. العديد من التطبيقات والمواقع التي تدفع الناس بشكل لا يقاوم لتفقد هواتفهم وفتح صفحات انترنت جديدة تستغل شيئين في طبيعتنا البشرية: التعزيز الإيجابي غير المنتظم (أو المكافئة غير المنتظمة) والرغبة في تحصيل القبول الاجتماعي. المكافآت التي تُعطى بشكل غير منتظم مغرية أكثر بكثير وتجعل أجسادنا تفرز دوبامين أكثر من تلك التي تعطى وفق نمط معروف؛ عندما ينشر الناس شيئاً على وسائل التواصل الاجتماعي يصبح حالهم مثل المقامرين: هل سيحصل المنشور على إعجابات (أو قلوب أو إعادة تغريد) أم أنه سيقبع بدون رد فعل من أحد؟ التطبيقات الشائعة التي ظهرت في العقد الأخير تشكل مناخاً ملائماً جداً لتطور الإدمان السلوكي مما يقود الناس لاستخدام هذه الخدمات أكثر بكثير من الحد النافع أو الصحي. وكما تم الكشف عنه من قبل باحثين مثل Tristan Harris و Sean Parker و Leah Pearlman و Adam Alter: فإن هذه الخدمات - في حالات كثيرة - مصممة خصيصاً لإحداث حالة الإدمان السلوكي. إذن فالاستخدام القهري لهذه الأدوات ليس نتيجة خلل في الشخصية ولكنه نتيجة لخطة تجارية هائلة. الحل: التقليل الرقمي التقليل الرقمي يعبر عن فلسفة لاستخدام التكنولوجيا مبنية على أن تقوم بتركيز وقت الإنترنت عندك على أنشطة قليلة ومُحَسّنة ومختارة بعناية تخدم الجوانب ذات القيمة لديك، وأن لا يكون عندك بعدها مشكلة في أن يفوتك أي شيء آخر على الإنترنت. أي شخص يدرس الاقتصاد يعرف قانون العوائد المتناقصة (diminishing returns) والذي يُطبق عند تحسين عمليات الإنتاج. يقول القانون أن زيادة الاستثمار في تحسين العملية الإنتاجية لا يمكن أن يزيد العوائد إلى ما لا نهاية؛ في وقت ما ستصل إلى حد تقل فيه العوائد التي تكسبها من الزيادة في الاستثمار. الرسم التالي يوضح هذا القانون: في البداية وحتى حد معين: كلما زدت الاستثمار في زيادة القوة العاملة والآليات إلخ ستحصل على عوائد أكبر بشكل ملحوظ. بعد ذلك الحد ستحصل على عوائد أقل وأقل مع زيادة استثمارك في تحسين العملية الإنتاجية. وإذا استمريت في زيادة الاستثمار ستصل إلى مرحلة تبدأ فيها العوائد بالتناقص كما يظهر في الرسم. معظم الناس يستثمرون طاقة قليلة جداً لتحسين حياتهم الرقمية (التكنولوجية). أي أنهم لا يزالون في المنطقة الأولى في الرسم أعلاه: في المنطقة حيث محاولات التحسين تعطي عوائد عظيمة. وهذه الحقيقة هي ما يدفع الأشخاص الذين يتبعون نظام التقليل الرقمي ليركزوا ليس فقط على الخدمات التكنولوجية التي يستخدمونها ولكن أيضاً على كيفية استخدام هذه الخدمات. عملية تقليل الازدحام الرقمي قم بأخذ استراحة من “الأدوات التكنولوجية الاختيارية” لمدة ثلاثين يوماً. فأول خطوة إذن في تقليل الازدحام الرقمي هي تحديد هذه الأدوات الاختيارية، أي الأدوات التي لست مضطراً لاستخدامها بسبب العمل مثلاً. عندما نقول “أدوات تكنولوجية” فالمقصود التطبيقات والمواقع والأدوات الرقمية الأخرى والتي يتم التعامل معها عن طريق شاشة حاسب أو شاشة هاتف محمول. بعد مرور ثلاثين يوماً: قم بإعادة إدخال الأدوات التكنولوجية التي تحقق الشروط التالية إلى حياتك مرة أخرى: أن تقدم الأداة خدمة تتعلق بشيء مهم حقاً بالنسبة لك أن تكون الأداة هي الطريقة الأفضل لخدمة ذلك الشيء المهم بالنسبة لك أن تضع قواعد تحدد متى وكيف ستستخدم هذه الأداة العزلة وأهميتها قبل أن نناقش موضوع العزلة نحتاج لأن نفهم معنى العزلة. لذلك سنتجه إلى Raymond Kethledge و Michael Erwin واللذان كتبا كتاباً عن العزلة. أخذ منهما الكتاب سبع سنوات ولكن جهودهم توجت في عام 2017 بإصداره تحت عنوان Lead Yourself First. المؤلفان يذكران بدقة تعريف العزلة في كتابهما. العديد من الناس يربط العزلة بالعزلة الجسدية مثل الذهاب إلى الجبال إلى مكان بعيد لا بشر فيه. لكن المؤلفان يوضحان أن العزلة متعلقة بما يحدث داخل عقلك وليس بالبيئة المحيطة بك. وبناء على ذلك يعرفان العزلة أنها الحالة التي يكون فيها عقلك خالياً مما يأتي من عقول الآخرين. فطالما تركت عقلك يتعامل مع أفكاره الخاصة فأنت في عزلة. ولكن العزلة تزول عندما تسمح لمُدْخَلات من عقول الآخرين أن تقتحمها مثل أن تقوم بمحادثة مع شخص آخر أو تقرأ كتاباً أو تشاهد التلفاز أو تفعل أي شيء له علاقة بشاشة هاتفك. يقول بليز باسكال العالم الفيزيائي والرياضي المعروف: كل مشاكل البشرية تنشأ من عدم قدرة الإنسان على الجلوس بهدوء في غرفة لوحده. هناك عدد متزايد من الأبحاث التي تشير إلى أن وقت التأمل والتفكير الهادئ الذي أمضاه الرئيس الأمريكي السابق أبراهام لينكون في كوخ كان يأوي إليه قد يكون لعب دوراً أساسياً في مساعدة لينكون أن يتعامل مع صدمات الحرب الأهلية الأمريكية وأن يعالج القرارات الصعبة التي واجهها. يساور الناقدَ الاجتماعي الكندي مايكل هاريس القلقُ من أن التكنولوجيا الجديدة تساعد على إنشاء ثقافة تمسح وقت انفراد الشخص مع أفكاره ويقول أن الأمر في غاية الخطورة عندما يكون هذا الوقت تحت الخطر. إن قضاء فترات منتظمة من العزلة بين أوقات نشاطاتنا الاجتماعية هو أمر ضروري للنجاح والازدهار. وفهم هذه الحقيقة أمر ملح الآن أكثر من أي وقت مضى لأن العزلة - ولأول مرة في التاريخ - قد بدأت بالاختفاء من حياتنا كلياً. الحرمان من العزلة أو فقدان العزلة الحرمان من العزلة يتحقق عندما يكون الوقت الذي تنفقه لوحدك مع أفكارك وبدون مدخلات الآخرين شبه معدوم. حتى التسعينات من القرن الماضي (1990-1999) كان فِقدان العزلة أمراً يصعب تحقيقه. كان هناك العديد من الأحوال التي تجبرك على البقاء وحيداً مع أفكارك سواء أردت ذلك أم لا، مثلاً عند الانتظار في طابور وعند الدخول في طريق شديد الازدحام و عند المشي في الشارع إلى بيت صديقك إلخ. أما اليوم فإن فقدان العزلة صار أمراً منتشراً. آثار فقدان العزلة لمعرفة آثار فقدان العزلة فإنه من الأجدى أن ندرس ذلك على الأشخاص المولودين بعد عام 1995 لأن هؤلاء الأشخاص هم المجموعة الأولى التي دخلت سنوات ما قبل المراهقة مع توافر الهواتف المحمولة والأجهزة اللوحية واتصال دائم بالإنترنت؛ تلك المجموعة تستخدم التكنولوجيا بصورة مفرطة أكثر من غيرها، وأفراد هذه المجموعة متصلون بشكل دائم بالإنترنت. كنت أتحادث مع المسؤولة عن خدمات الصحة النفسية في جامعة معروفة جيداً حيث كنت مدعواً للحديث في تلك الجامعة. أخبرتني هذه المرأة أنها بدأت برؤية تغيرات كبيرة في صحة الطلاب النفسية. حتى وقت قريب كان قسم الصحة النفسية في الجامعة يتعامل مع المشاكل النفسية الشائعة على مدى العقود الماضية مثل الحنين للأسرة والوطن ومشاكل الاضطراب في الأكل وبعض الاكتئاب وأحياناً الوسواس القهري. ثم تغير كل شيء: أصبح عدد الطلاب الذين يطلبون إرشاداً نفسياً أكبر بكثير وظهرت مشكلة جديدة كانت فيما قبل نادرة نسبياً لكنها تفوقت على كل المشاكل الأخرى السابقة، وهي القلق (anxiety). عندما سألتها عن السبب الذي أدى لهذا التغير برأيها قالت بدون تردد أن السبب على الأرجح يتعلق بالهواتف المحمولة. تزامن ظهور الارتفاع المفاجئ في المشاكل المتعلقة بالقلق مع دخول الطلاب الذين نشؤوا على الهواتف المحمولة ووسائل التواصل الاجتماعي إلى الجامعة. لاحظت المسؤولة أن هؤلاء الطلاب كانوا يستقبلون ويرسلون الرسائل بشكل مستمر وجنوني. لقد بدا لها بوضوح أن هذا الاتصال المستمر كان يؤثر على كيمياء عقول أولئك الطلاب بشكل سلبي. بعد سنوات قليلة تم تأكيد حدس هذه المسؤولة من قبل أستاذة علم النفس في جامعة ولاية سان دييغو جين تونج (Jean Twenge) والتي تعد من أبرز الخبراء في العالم بالتغيرات في أجيال الشباب الأمريكي. تقول جين في مقالة لها نشرت عام 2017 أنها درست هذه التغيرات لأكثر من 25 سنة وأن هذه التغيرات كانت دائماً تظهر وتزداد بشكل تدريجي. ولكن بدءاً من عام 2012 لاحظت تحولاً يمكن وصفه بأي شيء إلا التدريجية في قياسات الحالات العاطفية للمراهقين: كانت هناك تغيرات ملفتة بالنسبة للشباب المولودون بين 1995 و2012، ومن أكبر هذه التغيرات وأكثرها إثارة للقلق التغيرات في الصحة النفسية لهؤلاء المراهقين. تقول جين أن نسب الاكتئاب والانتحار زادت بشكل حاد بين هؤلاء المراهقين بسبب الارتفاع الهائل في اضطرابات القلق على ما يبدو. وتقول أيضاً أن هذه التغيرات في الصحة النفسية ترتبط تماماً بالوقت الذي أصبح فيه امتلاك هاتف محمول أمراً شائعاً في أميركا. لقد فقد أولئك المراهقون القدرة على معالجة مشاعرهم وفهمها، وفقدوا القدرة على التفكير والتأمل في أسئلة مهمة مثل “من نحن؟” و “ما هي الأشياء المهمة حقاً؟”، وأيضاً فقدوا القدرة على بناء علاقات قوية، ووصلوا لدرجة أنهم لا يستطيعون إعطاء أدمغتهم وقتاً للراحة وإطفاء الأجزاء المتعلقة بالاتصال الاجتماعي حيث أن هذه الأجزاء ليست مُعَدّة للعمل بشكل متواصل. ادمج مراسلاتك بدلاً من أن يظل هاتفك متاحاً طوال الوقت يستهلك انتباهك ويقاطع أوقات تركيزك، بدلاً من ذلك اجعله دائماً في وضعية عدم الإزعاج (Do Not Disturb). هذا الوضع متاح على أجهزة آيفون وأندرويد. هذا الوضع يطفئ الإشعارات فلن تأتيك إشعارات عند وصول رسائل أو مكالمات جديدة أو غيرها. وإذا كنت قلقاً بشأن حالات الطوارئ أو بشأن مكالمات هامة من ابنك أو زوجتك مثلاً فيمكنك اختيار أرقام ليتم استثناؤها. ويمكنك أيضاً اختيار أن يتم تفعيل هذا الوضع أوتوماتيكياً في أوقات محددة. يمكنك مثلاً أن تختار تفعيل هذا الوضع طوال اليوم ما عدا ساعة محددة. الآن مع تفعيل هذا الوضع يمكنك تخصيص أوقات محددة للرد على الرسائل دفعة واحدة حيث تقوم بمراجعة جميع الرسائل التي أتتك منذ آخر مرة تفقدت فيها الجهاز والرد على ما تريد منها ويمكنك أيضاً أن تتحادث لوقت قصير قبل أن تعتذر لأنك تريد الذهاب وتفعل وضعية عدم الإزعاج مرة أخرى وتعود لإكمال يومك. لقد تعلمت طريقة من مدير تنفيذي في وادي السيليكون تمكنك من أن تحظى بمكالمات ذات جودة عالية مع العائلة والأصدقاء. فالمكالمات تعد ذات قيمة تواصلية أعلى من مجرد المحادثات النصية التي تفقد الكثير من عناصر التواصل الغنية. يقوم هذا الشخص بإخبار عائلته وأصدقائه أنه متاح للتحدث معه الساعة 5:30 كل يوم عمل (من الاثنين إلى الخميس في أميركا) وأنه لا حاجة للتنسيق معه مسبقاً، فقط اتصل به. كان هذا الموعد (5:30) هو الوقت الذي يبدأ فيه رحلة عودته إلى المنزل من العمل في طريق مزدحم. رأيت أشخاصاً آخرين يقومون بفعل أشياء مشابهة مثل “ساعات المقهى”. في هذه الطريقة تقوم باختيار وقت كل أسبوع للجلوس في مقهى تحبه مع صحيفة أو كتاب جيد؛ الصحيفة أو الكتاب فقط للاحتياط. وتقوم بإخبار الناس الذين تعرفهم أنك موجود دائماً في ذلك المقهى خلال الوقت الذي اخترته. احظ بوقت فراغ ذي جودة عالية وقت الفراغ ذو الجودة المنخفضة هو وقت تنفقه على سبيل المثال في تصفح مواقع التواصل الاجتماعي بدون أي هدف. في العالم المهني: العديد من أصحاب الإنجازات العظيمة استراتيجيون دقيقون. إنهم يضعون رؤية لما يحاولون إنجازه على عدة مراحل زمنية بحيث يصلون بين الهدف النهائي الذي يسعون إليه وبين القرارات المتعلقة بالأشياء اليومية التي يفعلونها. لقد قمت بممارسة هذه الأنواع من الاستراتيجيات المهنية لعدة سنوات وكتبت عنها أيضاً. أقترح أن تضع استراتيجية للتخطيط لوقت فراغك عن طريق وضع خطة فصلية وخطة أسبوعية. بالنسبة للخطة الفصلية: يمكنك وضعها ثلاث مرات في السنة (كل أربعة شهور) أو أربع مرات في السنة إلخ. الخطة الفصلية تحتوي الخطة الفصلية على نوعين من العناصر: الغايات والعادات. كلاهما له علاقة بالحصول على وقت فراغ ذي جودة عالية. مثال: غاية: تعلم عزف كل أغاني فرقة س على الغيتار. الاستراتيجيات: صيانة الغيتار وتعديل أوتاره، إيجاد المخططات الوترية للأغاني وطباعتها ووضعها في مغلف بلاستيكي جميل العودة إلى عادتي القديمة في التدرب بشكل منتظم على الغيتار كمحفز: تنظيم حفلة في نوفمبر أقوم فيها بعزف هذه الأغاني عادة: القيام بأنشطة ذات جودة منخفضة في وقت فراغي لمدة لا تزيد على ساعة يومياً. عادة: قراءة شيء في السرير كل ليلة. عادة: حضور فعالية ثقافية كل أسبوع. لا يوجد خط فاصل واضح بين العادات والغايات. في المثال أعلاه يمكن للمخطِّط أن يضيف عادة “التدرب على الغيتار مرتين في الأسبوع” إلى قائمة العادات بدلاً من وضعها في قسم الغايات. الخطة الأسبوعية لكل غاية من الغايات في الخطة الفصلية: قم بالتفكير في الأفعال التي يمكنك القيام بها خلال الأسبوع القادم للتقدم في طريق الوصول إلى تلك الغاية ثم حدد مواعيداً للقيام بهذه الأفعال. تحديد المواعيد أمر مهم. هل تجعلنا وسائل التواصل الاجتماعي أكثر اتصالاً؟ في دراسة قام بها فريق كبير من تخصصات متنوعة ونشرت في “المجلة الأمريكية للطب الوقائي” المرموقة في 2017. في هذه الدراسة قام بريماك وفريقه باستطلاع رأي عينة تمثل الراشدين الذين تتراوح أعمارهم بين 19 و 22. وجدت الدراسة أنه كلما ازداد استخدام الأشخاص لوسائل التواصل الاجتماعي زاد احتمال كونهم وحيدين. “إنها وسائل تواصل! ألا يجدر بالناس أن يشعروا بالاتصال عند استخدامها؟” لكن البيانات كانت واضحة: كلما زاد الوقت الذي تنفقه في “الاتصال” عبر هذه الوسائل زادت فرص أن تصبح وحيداً. الملخص في فيديو"
