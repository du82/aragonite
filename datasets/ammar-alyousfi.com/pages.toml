["https://ammar-alyousfi.com/2020/youtube-trending-videos-analysis-2019-us"]
title = "Analysis of YouTube Trending Videos of 2019 (US) | Ammar Alyousfi’s Blog"
description = "The personal website of Ammar Alyousfi which contains a blog about data science, data analysis, data visualization, machine learning, Python, and more."
full_description = "Analysis of YouTube Trending Videos of 2019 (US) Jul 6, 2020 • Category: Data science Tags: Data science, Data analysis, Data visualization, Video analysis, Data science project, Python, Pandas, Matplotlib, Youtube analysis. This analysis was featured on: The Hustle newsletter (lead story), TechCrunch, Hacker News, The Growth Newsletter (issue #021), Social Blade, Data Science Weekly newsletter (Jul 09 2020's issue), Weekly, Tubefilter, Younes Talk, and more. Around 1.5 years ago, I did an analysis of YouTube trending videos in US. That analysis was performed on trending videos of some months in 2017 and 2018. The analysis received a lot of interest on Kaggle and Reddit; I also received some emails praising the work done. That was 1.5 years ago. Today, I present an improved and expanded version of that analysis. This analysis is more advanced and contains new interesting elements. In this analysis, All trending videos for the whole year of 2019 were analyzed (More than 70,000 videos). Titles, descriptions, thumbnails, tags, views, likes/dislikes, and comments were all analyzed to produce the results shown in this post. Continue reading to know more about the analysis and the data or you can jump directly to the results section. Summary of Some Key Results of the Analysis What are YouTube Trending Videos? Tools Used Code Used Data Source Data Size and Description Analysis Results Trending Videos and Views How Many Views Videos Had When they First Became Trending? Trending for 30 days! Trending Videos Titles Number of Fully-Uppercase Words in Titles What are the Most Common Words in Video Titles? What are the Most Common 2-Grams in Video Titles? Titles Lengths Trending Channels Trending Videos Categories When were Trending Videos Published? Trending Videos and Comments How Many Comments Videos Had When they First Became Trending? Trending Videos and Likes.. and Dislikes How Long Does it Take a Video to Become Trending? Trending Videos Descriptions How Long is the Description? Most Common Words in Trending Videos Descriptions Does Trending Videos Descriptions Contain Hashtags? Trending Videos Tags Most Common Words in Trending Videos Tags Correlations of Trending Videos What are the Most Used Colors in Trending Videos Thumbnails? What’s Inside Trending Videos Thumbnails? Conclusion Summary of Some Key Results of the Analysis The main goal of the analysis is to find interesting facts and patterns by exploring the data and by using effective visualizations. If you don’t have time to read the full analysis, here are some of the insights that were extracted from the data along with links to their sections in the analysis: Linus Tech Tips (a technology channel) was the channel that produced most trending videos in 2019. It is a technology (not entertainment nor music) and personal (not corporate) channel. More than that, the 2nd and 3rd channels after Linus Tech Tips were cooking channels. While a video might stay on the trending list for one day or less, there are 6 videos that appeared on the list for 30 days. BTS’ song “Boy With Luv” was the most viewed, liked, and commented video. However, it was also the 5th most disliked video. Some videos appeared on the trending list when they had only around 50,000 views. Words like “official”, “video”, “2019”, “vs”, “trailer”, “music”, “game”, “new”, “highlights”, “first”, and “challenge” were among the most common in trending video titles. So if you include the current year in your title, does that increase trending chances? 🔥 was the most common emoji in trending video titles. While the minimum was 3 and the maximum was 100, most trending videos have titles lengths between 36 and 64 characters. There was a video that became trending when it had only 7 comments. YouTube Rewind videos of 2018 and 2019 were the 1st and 2nd most disliked videos. On average, videos take 1.5 days to appear on the trending list for the first time. While the allowed maximum is 5,000 character, most trending videos have their descriptions length between 500 and 1500 characters. A lot of trending videos put social media links in their descriptions. Almost all trending videos use tags. On average, 21 tags. By running an object-detection algorithm on the thumbnails of trending videos, it turned out that a person is the most common object in the thumbnails. So you might consider adding a person photo in your next video. Do you want to see the most common colors in video thumbnails that were extracted after a lot of processing? The analysis covers much more as you will see soon… What are YouTube Trending Videos? YouTube, as you know, is the most popular and most used video platform in the world today. YouTube has a list of trending videos. I’ll quote the description of trending videos from YouTube itself: Trending helps viewers see what’s happening on YouTube and in the world. Trending aims to surface videos that a wide range of viewers would find interesting. Some trends are predictable, like a new song from a popular artist or a new movie trailer. Others are surprising, like a viral video. Trending isn’t personalized and displays the same list of trending videos in each country to all users. The list of trending videos is updated roughly every 15 minutes. With each update, videos may move up, down, or stay in the same position in the list. Tools Used This analysis was performed using Python and a powerful group of Python libraries including Pandas, Matplotlib, NLTK, ImageAI, WordCloud, and more. The analysis were performed in a Jupyter Notebook. Code Used You can find all the code used for this analysis in a Jupyter notebook on this link. Feel free to read the code and re-use it however you want. Also note that the notebook contains more analyses than the ones shown here in this post, so if you want to see everything, refer to the notebook after you finish reading this post. Data Source The data used in this analysis was retrieved using YouTube API. A script was scheduled to run each day throughout 2019 and fetch data from YouTube API about the trending videos of that day. The script would then process the data received from YouTube and store them in text files. The scraping script is not my work. It can be found on Github: Trending-YouTube-Scraper. I put the script on a AWS EC2 instance and scheduled it—using Crontab—to run every day at a specific time. After 2019 ended, I connected to the AWS instance using FileZilla application and downloaded all the data produced by the script. There was a file for each day of 2019. To perform the analysis, I needed to process the data in order to merge the files into a single CSV file. Data Size and Description In this post, United-States trending videos will be analyzed, which constitute a total of 72,994 videos. YouTube usually place 200 videos in the trending list each day which would mean that we should have 73,000 (365 x 200) videos. We have 72,994. This is probably because on a few days, the number of Trending videos was slightly less than 200. So we have data on 72,994 trending videos to analyze. On YouTube, the same video might appear on the trending list for many days. This means that the 72,994 videos are not unique videos. In fact, among the 72,994 videos, we have 11,177 unique videos. In other words, 11,177 videos showed on the trending list throughout 2019. Some of them might have stayed on the list for 10 days, some for 20 days, etc. We will see later in the analysis more info about this. The following table shows an example of the data that we have for each video: As we can see, we have the ID of the video which is a unique value for the video across YouTube (No two videos have the same ID). We also have the title of the video, its publishing date and time, the channel that published it, its category, and its description and tags. We also have the number of the views, likes, dislikes, and comments of the video. There are also a few more data shown in the table. We can see that there is a field named “trending_date”. This field specifies the date on which this video was trending. As we said earlier, the same video might appear on the trending-videos list for more than one day. This means that we might find another record in the data for the same video ID but with different “trending_date” and maybe different number of views, comments, likes, etc. (because those numbers are likely to increase from one day to another). If you want to download the data used in this analysis which describes 2019's trending videos in the United States, you can buy it securely on Gumroad on this link or by using the button below. Along with United States, you'll also get trending-videos data for United Kingdom, Canada, Denmark, Malaysia, Saudi Arabia, and other countries as well. Analysis Results Now let’s start the best part of this post, let’s see the analysis results. Please note that for the following analyses, unless otherwise stated, we applied the analysis on all of the 72,994 trending videos, not on the unique trending videos only. The reasoning behind this is that we are interested in videos considered trending by YouTube. So if a video is considered trending for 3 days, then we believe that it has more trending power and more trending characteristics than a video that was trending for 1 day only; thus, it should have more weight. So we include the 3 occurrences of that video in the analysis. For some analyses, considering only unique videos is more appropriate. When that is the case, you will see a note telling you about that. Trending Videos and Views The Trending Video with the Highest Number of Views is a song by BTS band named “Boy With Luv”. The video was published on 12/April/2019 and on 23/04/2019, it appeared on the trending list with 195,376,667 views which is the highest number of views a trending video had in 2019. In the table below, you can see the top 3 trending videos based on the number of views. These trending videos had views when they appeared on the trending list more than any other trending video. This table was produced by considering unique trending videos only (For more). And now we will look at the distribution of views for trending videos. The histogram below shows this distribution: Notice that the y-axis is log scaled. It is 10, 100, 1000… not 10, 20, 30… We can see that the vast majority of trending videos had less than 20 million views when they became trending. In fact, when they became trending, around 94% of trending videos had less than 10 million views and around 99.9% had less than 100 million views. Now, we might ask: What are the trending videos with the least amount of views? The table below shows the 3 trending videos with the lowest number of views when appearing on the trending list. This table was produced by considering unique trending videos only (For more). You can see that these three videos appeared on the trending list on the same day they were published on. Maybe they received a high number of views in the first few hours after they were published which sent them to the trending list. How Many Views Videos Had When they First Became Trending? We mentioned earlier that there were many videos that appeared on the trending list on more than one day. We now want to consider the first appearance only of each video. We want to know how many views a trending video had when it became trending for the first time. The following graph shows the distribution of the number of views of trending videos when first appearing on the trending list: Notice that the y-axis is log scaled. It is 10, 100, 1000… not 10, 20, 30… We can see that there is one video that became trending when it had ~150 million views. We can see another one that became trending when it had ~60 million views. But most of the videos became trending when they had less than ~30 million views. In fact: 90% of trending videos became trending for the first time when they had less than 2,752,317 views. The minimum number of views a video had when it first became trending was 53,796 views. The average number of views a video had when it first became trending was 1,387,466 views. The median (the 50th percentile value) was 777,510 views. Trending for 30 days! Some videos don’t appear on the trending list for only one day, nor for two days. There are some videos that appeared on the trending list for 30 days. The following table shows the videos that appeared on the trending list the most. There are 6 videos that appeared for 30 days on the trending list. And this is how these 6 videos appear today on YouTube: Trending Videos Titles Titles constitute an important part of each video. They describe the video for people before deciding to click on the video or not. And because of that, video title is one of the important factors in video success; video title plays an essential role in determining video click-through-rate (CTR). Here are some interesting facts about 2019’s trending-videos titles. 6% of trending-videos titles are fully uppercase (LIKE THIS). Numbers, symbols, and emojis are not taken into account for this. For example, all the following titles are considered fully uppercase: “FIRST TITLE”, “2ND TITLE”, “#3 TITLE 🎉”. Number of Fully-Uppercase Words in Titles If we count the number of fully-uppercase words in each of the trending-videos titles we get the following distribution graph: This means that around 50% of trending videos have no fully-uppercase word in their titles, around 20% have 1 fully-uppercase word in their titles, around 10% have 2 fully-uppercase words in their titles, etc. What are the Most Common Words in Video Titles? Are there some words that occur in trending video titles more than others? To find out the answer, I analyzed the titles of all trending videos and counted the occurrences of each word in those titles. Before that, symbols were removed from the words and contractions were replaced with their expansions. For example, “aren’t” and “we’ll” were replaced with “are not” and “we will” respectively. Here is a word cloud of the most common 100 words in the trending titles. The size of the word reflects how common it is: You can see that the most common word is “the” because it is the largest. You can also see large “a”, “to”, and “in”. Such words are called stop words. Stop words are words that are very common in a given language (English in our case). To get better results, we will exclude stop words from our analysis. After excluding stop words, we get this word cloud: We can now see more meaningfully the most common words in trending-videos titles. To see the exact commonness (frequency) values, the following table shows the most common 15 words with their frequencies: For more details on the process, method used for word tokenization, stop words specifications, etc., please review the code in the project notebook. Now let’s see what are the most common symbols in the titles of trending videos. Previously, we ignored symbols to produ"
