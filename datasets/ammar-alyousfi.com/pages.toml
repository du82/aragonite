title = "تعلم البرمجة بلغة بايثون - الدرس الثالث: مدخل إلى برامج بايثون (1) | Ammar Alyousfi’s Blog"
description = "The personal website of Ammar Alyousfi which contains a blog about data science, data analysis, data visualization, machine learning, Python, and more."
full_description = "تعلم البرمجة بلغة بايثون - الدرس الثالث: مدخل إلى برامج بايثون (1) Mar 15, 2020 في هذا الدرس سنأخذ لمحة عن برامج بايثون وعن نمط بايثون التفاعلي وأيضاً سنتعرف على الكلمات المحجوزة في بايثون. لندخل إلى نمط بايثون التفاعلي (عن طريق كتابة python في برنامج PowerShell في ويندوز أو كتابة python3 في برنامج Terminal في نظام ماك) ونكتب بعض أوامر بايثون: >>> x = 1 >>> print(x) 1 >>> x = x + 1 >>> print(x) 2 >>> exit() في السطر الأول نرى أمر تخزين قيمة - وهي 1 - في متغير أو variable اسمه x. المتغير ببساطة هو جزء من الذاكرة نقوم بتخزين ما نشاء فيه. فمثلاً في السطر الأول نقول لبايثون خذي جزءاً من الذاكرة وسمه x وضعي 1 بداخله. في السطر الثاني نقول لبايثون أحضري القيمة المخزنة في x واطبعيها على الشاشة، وبالطبع فإنها ستطبع 1 لأننا وضعنا 1 في x في السطر السابق. في مثالنا هذا يبدو هذا الأمر بلا فائدة ولكن لاحقاً عندما نكتب برامج حقيقية سيكون هناك استخدامات مفيدة أكثر لهذه الأوامر. في السطر الثالث نقوم بأخذ القيمة الموجودة في x ثم نضيف لها 1 ثم نخزنها مرة أخرى في x. وعندما نطبع ما في داخل x في السطر الرابع نرى أنه تم طباعة 2 بعد عملية الجمع التي قمنا بها في السطر الثالث. وفي السطر الأخير نخرج من نمط بايثون التفاعلي. لو قمت بكتابة أي من الأوامر السابقة بشكل خاطئ فإن بايثون ستنبهك بأنك قمت بخطأ في كتابتك للأوامر. الكلمات المحجوزة في بايثون لدينا في بايثون شيء يسمى الكلمات المحجوزة (reserved words). ما هي الكلمات المحجوزة؟ هي كلمات لها وظائف محددة في بايثون وعندما نستخدم هذه الكلمات في برامجنا يجب أن تعني الشيء الذي تتوقعه بايثون بالضبط، أي أنه لا يمكننا استخدام هذه الكلمات لأي غرض آخر: لا يمكن مثلاً أن تسمي متغيراً باسم كلمة محجوزة. هذه قائمة بالكلمات المحجوزة في بايثون: متى نستخدم نمط بايثون التفاعلي؟ نمط بايثون التفاعلي (interactive mode) مفيد لتجربة أوامر بايثون بشكل سريع أو لتشغيل برامج صغيرة جداً تتكون من 3-4 سطور. معظم البرامج تكون أطول بكثير من ذلك ولذا فإننا نقوم بكتابتها في ملف باستخدام محرر النصوص ثم نطلب من بايثون أن تقوم بتشغيل الملف وتنفيذ الأوامر الموجودة فيه. هذا الملف الذي يحتوي على برنامج بايثون يطلق عليه سكريبت (script)، وسنضيف إلى اسم هذا الملف “.py” وهذا يعني أن هذا الملف يحتوي برنامج بايثون. فيديو الدرس ملاحظة: ربما تقول في نفسك أن البرامج التي تراها حتى الآن ليس لها فائدة وهذا صحيح لأننا ما زلنا في البداية نتعلم الأساسيات والقواعد البدائية لكني أؤكد لك أنك عندما تتعلم بايثون بشكل جيد ستستطيع فعل العديد والعديد من الأمور الهامة والمفيدة التي تختصر عليك وقتاً وجهداً أو تجلب لك ربحاً مالياً أو تمكنك من تقديم فائدة للآخرين."
