full_description = 'تعلم البرمجة بلغة بايثون - الدرس الثاني: تثبيت بايثون ومحرر نصوص وكتابة أول برنامج Mar 8, 2020 لكي نستطيع كتابة وتشغيل برامج بايثون (Python) على أجهزتنا علينا تثبيت بايثون ومحرر نصوص برمجية. نحتاج إلى تثبيت بايثون كي نتمكن من تشغيل البرامج المكتوبة بلغة بايثون، ونحتاج محرر نصوص لنكتب البرامج فيه. بشكل عام هناك نسختان من بايثون: بايثون 2 وبايثون 3. بايثون 2 هي نسخة قديمة وتوقف دعمها في بداية عام 2020. لذلك نسخة بايثون التي سنقوم بتثبيتها هي بايثون 3. هناك نسخ فرعية من بايثون 3؛ النسخة الحالية هي 3.8.2، ولكن أي نسخة من بايثون 3 ستعمل بدون مشاكل. مُحَرِّر النصوص هو برنامج شبيه بالمفكرة أو برنامج وورد (Word) ولكنه مخصص لكتابة نصوص البرامج أو ما سنطلق عليه من الآن وصاعداً “الكود”. مثلاً الصورة المتحركة أدناه تعرض محرر نصوص اسمه Visual Studio Code وهو المحرر الذي سنستخدمه في هذه الدورة. تعريف “كود”: نص برمجي هناك العديد من من محررات النصوص المتوفرة لتثبيتها ولكن سنختار Visual Studio Code أو اختصاراً VS Code لأنه محرر متميز متوفر على جميع أنظمة التشغيل ومجاني تماماً وفيه العديد من الميزات المهمة التي تساعدنا عند كتابة البرامج. طبعاً يمكن استخدام VS Code لكتابة برامج بأي لغة برمجة وليس فقط برامج بلغة بايثون. سنتطرق في هذه التدوينة إلى: كيفية تثبيت بايثون و VS Code وكتابة برنامج بايثون على نظام ويندوز كيفية تثبيت بايثون و VS Code وكتابة برنامج بايثون على نظام ماك كيفية تثبيت بايثون و VS Code على نظام ويندوز سوف أذكر الخطوات هنا باختصار. لمشاهدة كيفية التثبيت خطوة بخطوة شاهد فيديو الدرس. قم بتحميل بايثون من موقع بايثون الرسمي. قم بتثبيت الملف الذي قمت بتحميله وخلال التثبيت تأكد من اختيار أن يتم إضافة بايثون إلى ال PATH كما هو موضح في الصورة أدناه. وإذا عرض عليك بعد ذلك أن يتم تغيير الطول الأقصى لل PATH فقم بذلك. الآن أصبحت بايثون مثبتة على جهازك. قم بتحميل VS Code من موقعه الرسمي ثم قم بتثبيته كأي برنامج آخر. الآن بعد أن قمت بتثبيت بايثون ومحرر النصوص شغل برنامج PowerShell وهو برنامج يأتي مع نظام ويندوز. قم بتشغيله عن طريق كتابة اسمه في قائمة ابدأ. واجهة البرنامج تشبه الصورة في الأسفل. برنامج PowerShell هو برنامج مهم يمكننا من كتابة أوامر لينفذها نظام التشغيل ويسمى واجهة سطر الأوامر أو Command-Line Interface. ضمن PowerShell اكتب python واضغط Enter للدخول إلى برنامج بايثون التفاعلي وهو يمكنك من كتابة أوامر بلغة بايثون ورؤية النتائج مباشرة. يمكن استخدام هذا البرنامج التفاعلي لتجربة أوامر بسرعة فهو غير مناسب لكتابة برامج طويلة. في برنامج بايثون التفاعلي اكتب: print("Hello") ثم اضغط Enter. هذا الأمر هو أمر طباعة وسيطبع كلمة “Hello”. للخروج من نمط بايثون التفاعلي اكتب exit() واضغط Enter أو اضغط Ctrl + Z. عندما نريد أن نكتب برامج حقيقية فإننا سنكتبها في محرر النصوص الذي قمنا بتثبيه. افتح برنامج محرر النصوص Visual Studio Code ثم اكتب بداخله نفس أمر الطباعة الموجود في الأعلى واحفظ الملف على جهازك (يجب أن تكون صيغة الملف .py وهي صيغة ملفات بايثون). بعد ذلك اذهب إلى PowerShell وتأكد أنك خرجت من نمط بايثون التفاعلي كما ذكرنا في الأعلى ثم اكتب: python path/to/file.py لكن استبدل path/to/file بمكان وجود الملف الذي حفظته من محرر النصوص ثم اضغط Enter وسيتم تشغيل البرنامج الذي كتبته في محرر النصوص وسيتم طباعة “Hello”. هكذا تكون قد كتبت وشغلت أول برنامج بايثون لك. كما ذكرت سابقاً: لرؤية التفاصيل خطوة بخطوة قم بمشاهدة فيديو الدرس. كيفية تثبيت بايثون و VS Code على نظام ماك أنظمة ماك تأتي وبايثون مثبتة مسبقاً عليها لكن النسخة المثبتة تكون بايثون 2 وهذه النسخة من بايثون قديمة وتوقف دعمها كما هو مذكور أعلاه لكن ما زالت تأتي مع أجهزة الماك. لذلك سنحتاج لأن نثبت بايثون 3 إلى جانب بايثون 2. ولا نريد أن نحذف نسخة بايثون 2 الموجودة على الجهاز لأن هناك برامج في النظام قد تعتمد عليها. سوف أذكر الخطوات هنا باختصار. لمشاهدة كيفية التثبيت خطوة بخطوة شاهد فيديو الدرس. قم بتحميل بايثون من موقع بايثون الرسمي وقم بتثبيت بايثون كأي برنامج آخر. قم بتحميل VS Code من موقعه الرسمي ثم قم بتثبيته كأي برنامج آخر. ملاحظة هامة: لأننا الآن لدينا بايثون 2 وبايثون 3 سوية: عندما نريد تشغيل بايثون 3 سنكتب python3 وليس فقط python. سنوضح هذا الأمر لاحقاً لكن فقط أحببت التنبيه الآن احتياطاً. الآن بعد أن قمت بتثبيت بايثون ومحرر النصوص شغل برنامج Terminal وهو برنامج يأتي مع نظام ماك. ستجده في مجلد Utilities الموجود في مجلد Applications. واجهة البرنامج تشبه الصورة في الأسفل. برنامج Terminal هو برنامج مهم يمكننا من كتابة أوامر لينفذها نظام التشغيل ويسمى واجهة سطر الأوامر أو Command-Line Interface. ضمن Terminal اكتب python3 (انتبه أنها python3 وليس python) واضغط Enter للدخول إلى برنامج بايثون التفاعلي وهو يمكنك من كتابة أوامر بلغة بايثون ورؤية النتائج مباشرة. يمكن استخدام هذا البرنامج التفاعلي لتجربة أوامر بسرعة فهو غير مناسب لكتابة برامج طويلة. في برنامج بايثون التفاعلي اكتب: print("Hello") ثم اضغط Enter. هذا الأمر هو أمر طباعة وسيطبع كلمة “Hello”. للخروج من نمط بايثون التفاعلي اكتب exit() واضغط Enter أو اضغط Ctrl + Z. عندما نريد أن نكتب برامج حقيقية فإننا سنكتبها في محرر النصوص الذي قمنا بتثبيه. افتح برنامج محرر النصوص Visual Studio Code ثم اكتب بداخله نفس أمر الطباعة الموجود في الأعلى واحفظ الملف على جهازك (يجب أن تكون صيغة الملف .py وهي صيغة ملفات بايثون). بعد ذلك اذهب إلى Terminal وتأكد أنك خرجت من نمط بايثون التفاعلي كما ذكرنا في الأعلى ثم اكتب: python3 path/to/file.py لكن استبدل path/to/file بمكان وجود الملف الذي حفظته من محرر النصوص ثم اضغط Enter وسيتم تشغيل البرنامج الذي كتبته في محرر النصوص وسيتم طباعة “Hello”. هكذا تكون قد كتبت وشغلت أول برنامج بايثون لك. كما ذكرت سابقاً: لرؤية التفاصيل خطوة بخطوة قم بمشاهدة فيديو الدرس. الفروق بين ويندوز وماك هناك - كما رأينا - بعض الفروق البسيطة بين ويندوز وماك أهمها: في ويندوز نستخدم PowerShell كواجهة سطر الأوامر بينما في ماك نستخدم Terminal. في ويندوز عندما نريد الدخول إلى بايثون في واجهة سطر الأوامر (PowerShell) أو عندما نريد تشغيل برنامج بايثون موجود في جهازنا فإننا نكتب python بينما في نظام ماك نكتب python3. وذكرنا أسباب ذلك في الأعلى. لذلك عندما أشرح الدروس القادمة اكتب بناء على نظامك: إذا كنت تستخدم ويندوز اكتب python في PowerShell وإن كنت تستخدم ماك اكتب python3 في Terminal كما هو موضح أعلاه. كيفية كتابة وتشغيل برامج بايثون بدون تثبيت شيء على جهازك على الرغم من أنه يفضل تثبيت بايثون ومحرر نصوص على جهازك لكن يمكنك كتابة وتشغيل برامج بايثون بدون فعل ذلك حيث تتوفر عدة خدمات تمكنك من كتابة وتشغيل برامج بايثون عن طريق متصفح الإنترنت. هذه الخدمات لا تغني عن تثبيت بايثون ومحرر نصوص على جهازك لكن يمكنك استخدامها في الدروس القليلة القادمة لأنها دروس بسيطة أو عند الحاجة لكن بعدها عليك تثبيت بايثون ومحرر نصوص على جهازك. بعض هذه الخدمات: Google Colab: هذه خدمة رائعة مقدمة من Google تمكنك من كتابة وتشغيل كود بايثون في متصفح الإنترنت وتمكنك من استخدام ملفاتك المخزنة على حسابك في Google Drive ومن حفظ الملفات التي تنشئها هناك أيضاً. هناك العديد من الأشياء التي يمكن تعلمها عن هذه الخدمة لذلك سأتكلم عنها في درس منفصل. Repl.it: هذا الموقع يمكنك من كتابة وتشغيل كود بايثون في المتصفح ويمكنك أيضاً رفع ملفات من جهازك لاستخدامها في برامجك. النسخة المجانية منه محدودة لكن كافية لبرامج صغيرة. ـ فيديو الدرس'
