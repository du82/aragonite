title = "مقتطفات من “الدليل المطلق لتصبح أفضل ما يمكن أن تكون عليه” | Ammar Alyousfi’s Blog"
description = "The personal website of Ammar Alyousfi which contains a blog about data science, data analysis, data visualization, machine learning, Python, and more."
full_description = 'مقتطفات من "الدليل المطلق لتصبح أفضل ما يمكن أن تكون عليه" Jan 7, 2018 هناك مقالة اشتُهرت على الإنترنت بعنوان "The Ultimate Guide to Becoming Your Best Self: Build your Daily Routine by Optimizing Your Mind, Body and Spirit" تتحدث عن تطوير روتين يومي في سبيل الوصول إلى تحسين نفسك إلى أعلى الدرجات، وهنا أضع بعض المقتطفات من هذه المقالة الطويلة؛ هذه المقتطفات لا تعتبر ملخصاً للمقالة. سأعبر عن المقتطفات بطريقتي بعيداً عن الترجمة الحرفية: من فوائد أن تضع روتيناً يومياً أنه سيعطيك الدافع في الأيام التي لا تشعر فيها بالرغبة في العمل والتخطيط، وأنه سيقلل اعتمادك على التحفيز وقوة الإرادة. قل لنفسك شيئاً إيجابياً أول ما تستيقظ مثل "اليوم سيكون أفضل يوم على الإطلاق إن شاء الله"؛ يساعد هذا على توجيه عقليتك وذهنك نحو الوجهة الصحيحة. تصور نجاحك وتخيله لتسخر قوة عقلك الباطن. اكتب ثلاث صفحات تفرغ فيها ما في عقلك؛ ليس من الضروري أن تكون مرتبة متناسقة الأفكار؛ فقط فرغ ما في رأسك. خذ قيلولة خلال يومك. استناداً إلى مؤسسة النوم الوطنية فإن قيلولة مدتها 20-30 دقيقة يمكن أن تساعد على تحسين المزاج والانتباه وحتى الأداء. قم بأداء تنفس الطاقة ثلاث مرات في اليوم، في كل مرة قم به عشر مرات. طريقة التنفس هي أن تقوم بالشهيق لمدة خمس ثوان ثم تحبس النفس لمدة عشرين ثانية ثم تقوم بالزفير لمدة عشر ثوان. يمكن أن تعدل هذه الفترات كما تشاء، المهم أن تحافظ على النسبة فيما بينها. اشرب 13 كوباً من الماء إن كنت رجلاً، و9 إن كنتِ امرأة؛ هذه هي الكميات الموصى بها من قبل المنظمة الطبية Mayo Clinic. تقول كلية هارفرد الطبية أن البوليفينولات الموجودة في الشاي له عدة فوائد لجسمك مثل كونها مضادة للالتهابات وكونها تعطي فوائد شبيهة بفوائد مضادات الأكسدة. اشرب شاياً. هناك مخاطر للجلوس طويلاً. يُنصح بأن تقف كل عشرين دقيقة لتقليل المخاطر. تحرك. قم بأداء تمارين الدقائق السبع والتي يقول العلماء بفعاليتها. هناك تطبيقات مجانية على أجهزة الهاتف المحمول ترشدك بوضوح إلى كيفية أداء هذه التمارين. قم بالنوم والاستيقاظ في نفس الوقت كل يوم ما أمكنك ذلك. لا بد أن تمارس التأمل؛ فكر فيه على أنه وقت هادئ للجلوس مع نفسك. استعد لجني فوائده. كن شاكراً. سؤال جميل يساعدك على معرفة كمية النعم في حياتك: إذا استيقظت غداً وعندك فقط الأشياء التي كنت شاكراً عليها اليوم، فماذا سيكون عندك؟؟ ابدأ صغيراً. الرابطة الأميركية لعلم النفس تقترح أنه لكي تحسن نجاحك، تحتاج لأن تركز على هدف أو تغيير واحد في وقت ما. المقالة تحتوي على أكثر مما ذكرت، وبتفصيل أكثر. يمكنك الاطلاع عليها، لكن ما رأيك إن بدأت بفعل شيء من الأشياء المذكورة أعلاه وجعله عادة من عاداتك أولاً؟'
