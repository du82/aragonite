full_description = "ملخص كتاب براهين النبوة Feb 22, 2024 كتاب من عنوانه يعرض براهين نبوة سيدنا محمد صلى الله عليه وسلم ويناقش اعتراضات المعترضين. وفي هذا المنشور أعرض المقتطفات التي انتقيتها من الكتاب، وهي لا تعتبر ملخصاً للكتاب ولكل الجوانب التي تناولها، لكنها الأشياء التي أحسست بأهميتها الأكبر من وجهة نظري. الكتاب أكثر من 600 صفحة وهذا الملخص صفحات قليلة، لذا ستجد في الكتاب معلومات وتفاصيل أكثر. المؤلف أتاح تحميل الكتاب كاملاً مجاناً من هنا: https://almobadarah.com/books/baraheen.ar.pdf. صفحة الكتاب على موقع Goodreads الخاص بالكتب: براهين النبوة والرد على اعتراضات المستشرقين والمنصرين. حفظ القرآن والسنة لقد شهد لميزة حفظ السيرة النبوية في تاريخ الأنبياء المستشرق بنيامين بوزمورث سمث - أحد أساقفة الكنيسة المشيخية في أمريكا - حيث ذكر في كتابه (محمد والمحمدية) أننا لا نعلم الكثير عن حياة موسى وعيسى وبوذا وغيرهم أما الإسلام فأمره كله واضح وفي أيدي الناس تاريخه الصحيح ويعلمون من أمر محمد صلى الله عليه وسلم الكثير. ص77. شهادة المستشرق اليهودي برنارد لويس المعروف بمواقفه السلبية من الإسلام: «…ولكن نقد علماء الحديث الدقيق للأسانيد وجمعهم الدقيق للاختلافات… يعطي لعلم التأريخ العربي في القرون الوسطى مهنية ومراساً لا نجد له نظيراً في القديم ولا مماثلاً في القرون الوسطى في الغرب… بل حتى علم التاريخ في العالم المسيحي اليوناني، والذي هو أكثر تقدماً وتعقيداً، يقصر هو أيضاً عن مضاهاة الأدبيات التاريخية الإسلامية من نواحي الحجم والتنوع والعمق التحليلي». ص81. شهادة المؤرخ النصراني اللبناني (أسد جبرائيل رستم): «أول من نظم نقد الروايات التاريخية ووضع القواعد لذلك علماء الدين الإسلامي، فإنهم اضطروا اضطراراً إلى الاعتناء بأقوال النبي، وأفعاله لفهم القرآن وتوزيع العدل… فانبروا لجمع الأحاديث ودرسها وتدقيقها فأتحفوا علم التاريخ بقواعد لا تزال، في أسسها وجوهرها، محترمة في الأوساط العلمية حتى يومنا هذا». ص82. السيرة لم تؤلف في القرن الثالث الهجري، وإنما قد ازدهر فيه جمع أخبار الرسول صلى الله عليه وسلم في مؤلفات علمية تخصصية بأسانيد يبلغ طرفها الآخر الرسول صلى الله عليه وسلم، وهذه الأسانيد يمكن الحكم عليها وفق الأصول التي وضعها عباقرة أهل الحديث. وقد نقل العلماء كل ما وصل إليهم سواء كان صحيحاً أو ضعيفاً أو حتى موضوعاً. ‏أبعد الناس عن إحسان الظن برواة الأخبار هم علماء الحديث، ‏إذ يمكن القول أن علم الحديث قائم في الحكم على الرواة على سوء الظن بالرواة لا التسليم الأولي بعدالتهم، حتى قال الإمام المحدث (عبد الرحمن بن مهدي) في القرن الثاني الهجري: «خصلتان لا يستقيم فيهما حسن الظن: الحكم والحديث». قال الإمام (ابن القطان): «لم نر أهل الخير في شيء أكذب منهم في الحديث» فلم يكن هم المحققين من المحدثين تصحيح روايات أهل الورع والصلاح. ص88-89. ولم يقتصر علماء الحديث على تقسيم الرواة إلى ثقات وضعفاء وإنما ميزوا الثقات إلى طبقات، والضعفاء رتبوهم في دركات. حديث: «من كذب علي متعمداً فليتبوأ مقعده من النار» رواه بضعة وسبعون صحابياً، منهم العشرة المبشرون بالجنة، ولم يرو حديث عن النبي صلى الله عليه وسلم بهذه الكثرة. كما روى أربعة وعشرون صحابياً حديث: «نضر الله عبداً سمع مقالتي فوعاها، فبلغها من لم يسمعها» وهو في الحض على الرواية الصادقة التي تذيع خبر الوحي. اعترف المنصّر (ويليام موير) قائلًا: «قرآنٌ واحد كان سائدًا بين المسلمين، والاستخدام المتزامن لنفس السّفر من جانبهم جميعًا في كل عصر حتّى يومنا هذاء هو دليل حاسم أن ما بين أيدينا الآن هو النص عينه الذي تمّ إعداده بأمر الخليفة المظلوم. يبدو أنّه لا يوجد أي عمل آخر ظل اثني عشر قرنا بهذا النقاء كنص». [من كتاب Life of Mohamet: from original sources] الاتفاق حاصل بين جميع علماء النقد النصيّ أنه لا سبيل للوصول بطريق مباشر أو من خلال التراث الشفهي أو المخطوطات إلى نص التوراة، بالإضافة إلى أنّنا نملك ثلاث روايات متأخرة ومختلفة للتوراة في عدد من نصوصها: التوراة العبرية، والتوراة السامرية، والترجمة السبعينية اليونانية. وأما العهد الجديد (الإنجيل مجازًا) فقد انتهت (Institut für neutestamentliche Textforschung) - أهم مؤسسة علميّة عالميّة مهتمة بتركيب أفضل نص يوناني للعهد الجديد ‏- في نسختها اليونانية الأخيرة (NA 28) إلى أن آخر رجائها في البحث التاريخي النقدي أن تصل إلى أقدم نص ممكن للعهد الجديد لا النص الأصلي، لامتناع استعادة النص الأوّل. البحث التاريخي أثبت وجود العديد من الأخطاء في العهدين القديم والجديد، بعضها مذكور ص544 وما بعدها. الكتاب المقدس وفقدان الأسانيد: يتكون الكتاب المقدس من 66 سفراً عند البروتستانت أو أكثر عند الكاثوليك والأرثودكس. وهذه الأسفار كلها بلا استثناء فاقدة للإسناد المتصل، بل هي عند التحقيق بلا إسناد أصلاً. علم المستشرقون - بداهة - أن قبول السيرة كلية أو بالجملة لا بد أن يؤول إلى الإقرار بنبوة محمد صلى الله عليه وسلم، ولذلك كان مبدأ النظر الاستشراقي في السيرة البحث عن بدائل غير الميراث الحديثي، وقد تولى كبر هذا الأمر (إجناتس جولدتسيهر)، ثم اتسع الأمر وتفرعت مسالكه. ولا يملك القارئ الجاد إلا العجب من هذه البدائل التي يطرحها المستشرقون بعدما ردوا الروايات المسندة المصفاة من كدر الشبهة، فهي مراجع صامتة لا تُبين، أو مشبوهة لا تستأمن على خبر التاريخ وعلى رأسها: الكتابات المبكرة لغير المسلمين: رغم إغراء العثور على مصدر تاريخي خارجي “محايد” في قراءة التاريخ الإسلامي، إلا أن هذا المذهب فاسد من أوجه كثيرة أهمها: المصادر غير الإسلامية المبكرة لا تكاد تقدم معلومات تاريخية تذكر عن الإسلام، وإنما هي عبارات قليلة جداً، وعامة جداً. ولعل النظر في أكبر مؤلف اليوم قام بجمع الشهادات غير الإسلامية المبكرة، وهو: Seeing Islam As Others Saw It، يشهد بوضوح لما نقول؛ فالشهادات التي جمعها لا تكاد تدل على غير وجود دين جديد ظهر في بلاد العرب، وأن أصحاب هذا الدين يغزون الأمم المجاورة. الكتابات المذكورة قائمة على السماعات البعيدة والإشاعات، وليس فيها شيء تقريباً من البحث التاريخي والتحقيق العلمي المعتبر، خاصة أنها كتبت بيد رجال عاشوا خارج دولة الإسلام لم يخالطوا المسلمين بصورة مباشرة، ولا يعرفون اللغة العربية. الكتابات المذكورة غير محايدة، إذ عامة كاتبيها خصوم للإسلام، منهم رجال دين نصارى، وأصحاب مصالح سياسية وعرقية يرفضون الفتح الإسلامي برمته. الآثار القديمة المعاصرة للبعثة أو القريبة منها: كانت الحياة وقتئذ قائمة على المساكن البسيطة من خيام وغيرها مما لا يورث الأمم التالية شواهد واسعة من نقوش ومنحوتات تورخ للحضارات وعقائدها، إلا ما ندر في اليمن. فكيف يفلح الجهد الاستشراقي في تعقب تاريخ رجل واحد عاش قبل قيام الدولة مغموراً أو محارَباً، وبعدها في زهد بعيداً عن العمائر والدواوين الإدارية؟! الخيال والوهم التآمري: ذهب بعض المستشرقين إلى رد جميع التراث التاريخي الإسلامي. ص99. صدق النبي صلى الله عليه وسلم إن نفي الصدق عن (محمد) يلزم منه أن يكون هذا الرجل أعظم مفتر ومخادع سعى على الأرض؛ إذ كان يفتعل القرآن عند كل حادثة حتى إنه يأتي بأفعال وحركات شديدة بدعوى الاستجابة لعارض الوحي كما كان يفتعل الإخلاص لإفراد الربٌ بالعبادة والتمجيد وكان يخدع من يلازمه من أصحابه ويفتعل النزاهة في معاملاته ويخدع حتى نساءه في بيته بافتعال الصدق والنزاهة. خلاصة البرهان المطلوب من منكر طابع الصدق في شخصية نبي الإسلام هو أن يوضح كيف استطاع رجل ظاهره الحماسة لإفراد الربّ بالطاعة وتنزيه القلوب عن الشرك والزهد في الملاذ والسعي لصلاح معاش الناس ومعادهم - وهو الأمر الذي شهد به من عاشره في الليل والنهار والحل والارتحال والغضب والرضى والسلم والحرب والضيق والفرج - أن يبطن في قلبه عكس ذلك فهو يحب الكذب ويمعن فيه ولا يجد سبيلاً لما يريد إلا به. يقول المستشرق المُنَصّر المخاصم للإسلام (ويليام موير): «إن من أعظم معززات صدق محمد أن أوائل المعتنقين للإسلام كانوا أقرب أصدقائه إليه وأهل بيته وهم الذين لهم صلة وثيقة بحياته الخاصة فلا يخفى عليهم ملاحظة تناقض الحال الذي لا يخلو منه - بصورة كبرت أو صغرت - المخادع المنافق عندما يكون في ملأ ويكون في بيته». ما الذي يطمع فيه مدعو النبوة غير المجد الدنيوي والتسلط على رقاب الناس والتنعم بخيراتهم؟! فهل في حياة النبي صلى الله عليه وسلم شيء من ذلك؟ انظر إلى حجراته اليوم في المدينة وقارنها بما كان لدى الأكاسرة والقياصرة، واقرأ الأحاديث الصحيحة في زهده التام في مكة وفي المدينة حين القوة ص129-130. إنه لا تجتمع في الإنسان أمانة تامة وخديعة ماكرة، وحرص على هداية الخلق وسعي لإضلالهم.. ولذلك فثبوت الكمال الخلقي البشري خاصة خلة الصدق ينقض مخالِفَه ضرورةً. إن الناظر في حال نبي الإسلام القائم بالليل متهجدًا بالقرآن، في خشوع وذلَ وإخبات حتّى تشققت منه القدم، لا يسعفه خيال الشكّ السادر أن يرى في روح هذا الرجل الخاشع بعض طيف الخديعة والمكر. إنه يرى روحًا تذوب مع كلمات القرآن، ومعاني التوحيد، وصور القيامة، ومشاهد البعث المهيبة. أقوال عن النبي صلى الله عليه وسلم: لقد بحثت في التاريخ عن الإنسان النموذج ووجدته في محمد. الشاعر الألماني الكبير جوته. ربما علينا أن نتساءل - إذا أخذنا في الاعتبار كل المعايير التي من الممكن أن تؤخذ في الحسبان لقياس عظمة الإنسان - إن كان هناك أحد أعظم من محمد. الشاعر الفرنسي الكبير Alphonse de Lamartine. معجزات النبي صلى الله عليه وسلم المعجزات مخالفة لتجربة الإنسان مع الطبيعة وليست مناقضة لهذه التجربة، فهي من الممكنات العقلية، وإثبات المعجزة بذلك مسألة تاريخية وليس مسألة فلسفية. عن المعجزات: إن كان المخالف لا يصدق غير الأخبار المتواترة فقد ثبت في السيرة معجزات متواترة. والتواتر هو ما رواه جمع غفير عن مثله إلى منتهاه، تحيل العادة تواطؤهم على الكذب، ويكون مستندهم الحس. وهو على نوعين: لفظي وهو ما تواتر لفظه عن الرواة، ومعنوي وهو تواتر معنى مشترك ككرم حاتم الطائي وشجاعة عنترة فهي أمور لا نشك فيها وإن كنا لا نجزم بصحة الأحداث الفردية لكرم حاتم وبطولات عنترة. ومجموع روايات معجزات النبي صلى الله عليه وسلم تصل إلى التواتر المعنوي إذ تمنع العادة أن يتواطأ هذا الجم الغفير من الرواة على الكذب في نقل خوارق نبي الإسلام. ولا يقتصر خبر معجزات النبي على تواتر جنس الخارقة، وإنما ثبت بالتواتر عدد من المعجزات المخصوصة بعينها، نقلها عدد كبير من الصحابة، وعنهم عدد أكبر من التابعين حتى مؤلفي الدواوين التي صنفت لجمع الحديث النبوي: قتل عمار والفئة الباغية: تواتر عن الرسول قوله للصحابيّ «عمّار بن ياسر»: «تقتلك الفئة الباغية». ومعلوم بيقين أن «عمّارًا» قد قتلته طائفة (معاوية) بعد وفاة الرسول، سنة 37هـ، وقد بغت طائفته على الخليفة المبايع زمانه «علي بن أبي طالب».قال (السيوطي): «هذا الحديث متواتر رواه من الصحابة بضعة عشر»؛ فقد رواه (خزيمة بن ثابت) و(أبو سعيد الخدري) و(عمرو بن العاص) وابنه (عبد الله)، و(أم سلمة) و(أبو هريرة) و(معاوية)، و(عمرو بن حزم) و(حذيفة) و(أبو أيوب) و(أبو رافع) و(أبو اليّسَر) و(ابن مسعود). انشقاق القمر: ثبت عن جمع من الصحابة وقوع حادثة انشقاق القمر. قال صاحب «نظم المتناثر من الحديث المتواتر»: «قال التاج ابن السبكي في شرحه لمختصر ابن الحاجب الأصلي: الصحيح عندي أن انشقاق القمر متواتر منصوص عليه في القرآن مروي في الصحيحين وغيرهما من طرق من حديث شعبة عن سليمان بن مهران عن إبراهيم عن أبي معمر عن ابن مسعود، ثم قال: وله طرق أخرى شتى بحيث لا يُمترى في تواتره. وقال في الشفا: أمَا انشقاق القمر فالقرآن نص بوقوعه. وأخبر بوجوده. ولا يعدل عن ظاهر إلا بدليل، وجاء برفع احتماله صحيح الأخبار من طرق كثيرة. وفي «أمالي» الحافظ (ابن حجر): أجمع المفسرون وأهل السير على وقوعه. قال: ورواه من الصحابة: عليّ وابن مسعود وحذيفة وجبير بن مطعم وابن عمر وابن عباس وأنس. وقال (القرطبي) في «المفهم»: رواه العدد الكثير من الصحابة ونقله عنهم الجم الغفير من التابعين فمن بعدهم. وفي المواهب اللدنية: جاءت أحاديث الانشقاق في روايات صحيحة عن جماعة من الصحابة منهم: أنس وابن مسعود وابن عباس وعليّ وحذيفة وجبير بن مطعم وابن عمر. حنين الجذع: حادثة رواها جم غفير من الصحابة. قال صاحب «نظم المتناثر من الحديث المتواتر»: «أورده في الأزهار من حديث: سهل بن سعد وجابر بن عبد الله وابن عمر وأبي بن كعب وبريدة وابن عباس وأبي سعيد الخدري وأنس وأم سلمة والمطلب بن أبي وداعة السمهي، عشرة أنفس. قلت: قال عياض في الشفا: أمره مشهور منتشر والخبر به متواتر؛ أخرجه أهل الصحيح، ورواه من الصحابة بضعة عشر، ثم ذكر منهم العشرة المذكورين. وقال الحافظ ابن حجر في «أماليه»: طرقه كثيرة. قال البيهقي: أمره ظاهر؛ نقله الخلف عن السلف، وإيراد الأحاديث فيه؛ كالتكلف؛ يعني: لشدة شهرته. القرآن كتاب يأبى التفسير المادي قد يقول المخالف: . . نعم. . قد تحدّى القرآن المخالفين؛ واستفز نفوسهم للرد. . لكن ليس في ذلك برهان لإعجازه؛ إذ قد اجتمعت له من الأسباب التاريخيّة ما جعله كتابًا فريدًا فرادة سونيتات (شكسبير). ولكل عصر مؤلفاته الأدبيّة النادرة التي من الممكن تفسير تميّزها بخدمة الأوضاع الثقافية والاجتماعيّة لشخصيّة كُتابِها بصقل مواهبهم وتنمية ملكات الإبداع الفكري في نفوسهم. . كل شيء قابل للتفسير المادي، حتى ما يُدّعى من إعجاز القرآن! ونقول: .. بل كان القرآن في جميع أمره مخالفاً لفرادة سونيتات (شكسبير)؛ فقد تحدّى العرب أهل الفصاحة والذلاقة أن يأتوا بمثله رغم أنّ كلّ ما احتف به من تفاصيل وسياقات تاريخيّة تمنع أن يبلغ الحدّ المتوسّط من البلاغة، فضلًا عن أن يبلغ أعلى درجاتها البشريّة، فهو كتاب يأبى التفسير المادي لأمور: القرآن كتاب أظهره للناس رجل أمئّ لم يجلس ليتعلّم القراءة أو الكتابة، ولا تلقّى دروسًا في صناعة الأفكار وتحبيرها، وتأصيل الدرس اللاهوتي وترتيبه. وأمًا (شكسبير) مثلاً فقد دخل المدارس وتعلّم اليونانيّة واللاتينية. وكانت الكتب متوافرة أمامه يأخذ منها ويذر، كما التقى المدرّسين المبرّزين وأخذ عنهم، وتصفّح الكتب الوفيرة واغترف منها. نبي الإسلام لم يتعلّم الشعر، ولم ينظمه، ولم يشتهر به. ومعرفة الشعر وإتقانه مقدمةٌ ضرورية لدخول عالم الأدب، ولذلك جاءت الآيات في نفي معرفة الشعر عن النبيّ قاطعة للريبة ونافية للتهمة في محضر الصديق والخصم الذين عرفوا تفصيل حياته ومدارج عمره: { وما علمناه الشعر وما ينبغي له إن هو إلا ذكر وقرآن مبين }. سونيتات (شكسبير) مثلاً لم تبلغ من الجمال مبلغًا واحدّا، وإنّما البراعة فيها تتفاوت، فمرّة تعلو، وفي أخرى تسفل دون ذلك. وأمَا القرآن، فقطعة واحدة من البيان المعجب. يقول الإمام (حازم القرطاجني) عن القرآن: «إِنَّ الإعجاز فيه من حيث استمرّت الفصاحة والبلاغة فيه من جميع أنحائها في جميعه استمرارًا لا توجد له فترة ولا يقدر عليه أحد من البشر…». قال بلغاء مكّة لنبي الإسلام: إن هذا الكتاب من بنات أفكارك فتحدّاهم صراحة أن يأتوا بمثله، وأشهر هذا التحدي في كل مكان بلغه صوته. قال تعالى: { أم يقولون تقوله بل لا يؤمنون. فليأتوا بحديث مثله إن كانوا صادقين }. لم يزعم أحد لسونيتات (شكسبير) مثلاً صفة فوق طبيعية، فهي عند محبّى أدبه أثر عن ذكاء عقل ورهافة حس. وأمّا القرآن فقد وصفه خصوم نبي الإسلام وشانئيه أنه من جنس السحر، والسحر ليس من كسب العقول وإنّما هو عندهم - فيض من فعل كائنات خارقة هي الجنّ. ولمًا أراد واحد من زعامات الكفر أن يقول فى القرآن ما يكشف أصله، ويفضح سرّه، اجتهد كل الاجتهاد، ثم نفى بشريّته وقال بسحريّته، قال تعالى: { إنه فكر وقدر. … إن هذا إلا قول البشر }. القرآن نظمٌ على طريق جديد يخالف معهود الشعر والنثر: من المعلوم أن أعسر أبواب الإبهار الأدبي أن تجعل الجديد الطريف مقبولًا مألوفًا. العصر الذهبي للبيان العربي: نزل القرآن في عصر وبيئة كان الشعر فيها يخفض أقدار الرجال ويرفع، أمّة تميّزرت عن غيرها بظاهرة «شعر النقائض»: نزل القرآن في أمّة من الناس مولعة بالمعارضات الشعريّة لأشهر القصائد. وكان التحدّي القرآني بذلك يجري في مضمار تلك الظاهرة المألوفة في سوق الأدباء. ومعلومٌ عامةً أن صنائع الأدب في كلّ أمّة أنه إذا استحسنت اتبعت؛ وإذا استُملحت قصدت، فكيف والعرب في القرن السابع قد اتخذوا المعارضات الشعريّة سُنة أدبية؟! كيف يكون هذا القرآن من نتاج صحراء القرن السابع ميلاديًا النائية، وهو مع ذلك يفيض خيرًا على البشريّة في مجالات التشريع إلى اليوم، ويأخذ بألباب كبار القانونيين الغربيين حتى القرن الواحد والعشرين رغم أنهم لم يلجوا أعماقه الدفينة بعد؟! نقولات عن قانونيين يصفون عظمة تشريع الإسلام ص450-451. معارضة القرآن نقل القرآن اعتراضات المشركين، وكرّر خبر كبيرها وصغيرها. ولو كان في المعارضات ما هو أهل لفخر أهل مكّة لشاع خبر الاستشهاد به، ولألزم القرآن أن يرد عليه، لا أن يكرّر القرآن عرض التحدّي ونقل عجز بلغاء المشركين دون نكير من المخالفين. ولذلك قال المستشرق (إدوارد هنري بلمر): «مسألة عدم نجاح أفضل الكتّاب العرب في إنتاج أي شيء قريب في الخصاصة من القرآن نفسه ليس شيئًا مفاجئًا». ولا يصحّ تاريخيًا فى المعارضة إلا القليل النادر. وقد عاش فى بلاد المسلمين خصوم حاقدين اجتهدوا في الطعن في نبوة (محمد) صلى الله عليه وسلم، ولم يستعلن منهم واحد بكتاب معارض للقرآن رضي عنه مخالفو الإسلام في عصره وبعده، ومن هؤلاء (ابن الراوندي) الذي ألّف «الفريد» فى الطعن فى نبوّة (محمّد) صلى الله عليه وسلم والقدح في معجزاته، و«التاج» في قدم العالم، و«الزمرّد» في إبطال النبوّات، وهي كتب نشرها في العلن، وراجت بين الناس. الفرصة إذن كانت قائمة لظهور الكتاب المعارض المتحدّي للقرآن، ولرواجه إذا بدا فيه ما يستحقّ التقديم والتبجيل. صوّر القاضي (عبد الجبار) - الذي عاش في النصف الثاني من القرن الرابع الهجري وبداية الخامس انتشار كتب الزنادقة الطاعنين في الإسلام بقوله: «و"
