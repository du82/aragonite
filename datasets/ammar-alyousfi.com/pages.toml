title = "وأظلمت المدينة - مقتطفات من كتاب | Ammar Alyousfi’s Blog"
description = "The personal website of Ammar Alyousfi which contains a blog about data science, data analysis, data visualization, machine learning, Python, and more."
full_description = "وأظلمت المدينة - مقتطفات من كتاب Sep 27, 2019 وأظلمت المدينة - مقتطفات من كتاب قرأت كتاب “وأظلمت المدينة” لنزار الريان وهو كتاب قليل الصفحات يسرد وقائع أيام وفاة النبي صلى الله عليه وسلم بناء على الأحاديث الصحيحة والحسنة فقط. في هذا المنشور سأشارك بعض ما أثار اهتمامي أو أثر بي في هذا الكتاب. كان آخر شيء أوصى به عليه الصلاة والسلام “الصلاة وما ملكت أيمانكم”. هل كون هذه آخر الوصايا يجعل هذين الأمرين - أي الصلاة وملك اليمين - في غاية الأهمية؟ غالباً نعم. ذهب ملك اليمين ولم يبق إلا الصلاة نتمسك بها. لكن لماذا ملك اليمين - دون غيره - مع الصلاة؟ لفت نظري أيضاً قول أحد الصحابة (سيدنا أنس بن مالك) أنهم أنكروا قلوبهم بعد دفن النبي صلى الله عليه وسلم أي أحسوا بتغيرها وأحسوا بنقص الصفاء والنورانية التي كانت في حال حضوره الأنور وقال صحابي آخر (سيدنا أبي بن كعب): “كنا مع رسول الله صلى الله عليه وسلم وإنما وجهنا واحد، فلما قبض نظرنا هكذا وهكذا”. أحسست بألم الصحابة وإحساسهم بفقدان النبي صلى الله عليه وسلم؛ تخيلت نفسي في ذلك الزمان وتخيلت ألمي وحزني وإحساسي بعد فقد من كان وجوده رحمة ونوراً وأماناً وهدى. قرأت كيف بكى سيدنا ابن عباس حتى بلل الأرض عندما كان يحكي عن اشتداد وجع رسول الله صلى الله عليه وسلم “يوم الخميس، وما يوم الخميس؟!” وكيف بكى سيدنا أبو بكر على المنبر عندما بدأ يحكي عن حادثة في عهد النبي صلى الله عليه وسلم وكيف كان يبكي كلما أراد أن يذكر الحادثة. قرأت حديث أبي مويهبة مولى رسول الله صلى الله عليه وسلم: “أنبَهني رسولُ اللهِ صلَّى اللهُ عليْهِ وسلَّمَ منَ اللَّيلِ فقالَ : يا أبا مويْهِبةَ إنِّي قد أُمِرتُ أن أستغفرَ لأَهلِ البقيعِ ، فرفعَ يديْهِ ، فاستَغفرَ لَهم طويلًا ثمَّ قالَ : ليَهْنَ لَكم ما أصبَحتُم فيهِ مِمَّا أصبحَ فيهِ النَّاسُ ، أقبلتِ الفتنُ كقِطَعِ اللَّيلِ المظلِمِ ، يتبعُ آخرُها أوَّلَها ، الآخرةُ شرٌّ منَ الأولى ، يا أبا مويْهبةَ إنِّي قد أعطيتُ مفاتيحَ خزائنِ الدُّنيا والخُلدَ فيها ثمَّ الجنَّةَ ، فخيِّرتُ بينَ ذلِكَ وبينَ لقاءِ ربِّي والجنَّةِ فقلتُ : يا رسولَ اللهِ بأبي أنتَ وأمِّي ، فخُذ مفاتيحَ الدُّنيا والخُلدَ فيها ثمَّ الجنَّةَ فقالَ : واللهِ يا أبا مويْهبةَ لقدِ اخترتُ لقاءَ ربِّي والجنَّةَ . ثمَّ انصرفَ رسولُ اللهِ صلَّى اللهُ عليْهِ وسلَّمَ . فلمَّا أصبحَ ابتُدئَ بوجعِهِ الَّذي قبضَهُ اللهُ فيهِ” قرأت عن الرائحة التي لم تشم السيدة عائشة أطيب منها عندما فاضت روح النبي صلى الله عليه وسلم. سعدت لما قرأت قول النبي صلى الله عليه وسلم للسيدة فاطمة بعد أن قالت “واكرب أباه” لما شاهدت ما يصيبه في مرضه “ليس على أبيك كرب بعد اليوم”. صلى الله عليه وسلم"
