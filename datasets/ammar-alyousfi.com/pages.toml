["https://ammar-alyousfi.com/ar/2020/learn-programming-with-python-1-11-arabic"]
title = "تعلم البرمجة بلغة بايثون - الدرس الحادي عشر: الشروط في بايثون | Ammar Alyousfi’s Blog"
description = "The personal website of Ammar Alyousfi which contains a blog about data science, data analysis, data visualization, machine learning, Python, and more."
full_description = '''تعلم البرمجة بلغة بايثون - الدرس الحادي عشر: الشروط في بايثون May 10, 2020 في هذا الدرس ستتعرف على الشروط في بايثون: سنعرف معناها واستخداماتها وسنرى أمثلة عنها. باستخدام الجمل الشرطية نبدأ بإضافة شيء من “الذكاء” لبرامجنا، نجعل برنامجنا يختار الذهاب لليمين أو اليسار بناء على حدث معين. الجمل الشرطية هي جزء أساسي في جعل أجهزة الحاسب تبدو ذكية. ومفتاح الجمل الشرطية هي if وهي الكلمة المحجوزة التي تعلن أننا نريد أن نفعل شيئاً شرطياً. مثال: x = 5 if x < 10: print('Smaller') if x > 20: print('Bigger') print('Finished') في المثال أعلاه الشرط الأول هو x < 10. فإذا تحقق الشرط وكانت قيمة x أقل من 10 يقوم البرنامج بتنفيذ الجملة التالية: print('Smaller') وإذا لم يتحقق الشرط فإن البرنامج يتجاوز الجملة ولا يقوم بتنفيذها. لاحظ كيف أن الجملة التابعة للشرط الأول منزاحة قليلاً إلى اليمين. هذا الانزياح يدل على أن الجملة تابعة لجملة if التي فوقها. يمكن أن يكون لدينا أكثر من جملة واحدة لتنفيذها إذا تحقق الشرط، لكن في مثالنا هذا لدينا جملة واحدة. إذن وبكلمات أخرى: عند جملة if يتم طرح سؤال: “x أقل من 10؟” وجواب هذا السؤال إما “صحيح” (True) أو “خطأ” (False). إذا كان الجواب True يتم تنفيذ الجمل التابعة للشرط أما إذا كان الجواب False يتم تجاوزها. في المثال: قيمة x عند التحقق من الشرط هي 5 وهي أقل من 10 لذلك سينفذ البرنامج الجملة التابعة للشرط ويطبع "Smaller". بالنسبة للشرط الثاني: x < 20 فإن هذا الشرط غير متحقق في مثالنا بما أن قيمة x هي 5 ولذلك فالبرنامج لن ينفذ الجملة المرتبطة بهذا الشرط وهي: print('Bigger') بالنسبة للأمر الأخير: print('Finish') فسيتم تنفيذه دائماً مهما كانت قيمة x لأنه غير متعلق بأي شرط. كما رأينا في المثال فإن الجمل التابعة لشرط معين تكون منزاحة إلى اليمين قليلاً حتى تعرف بايثون أن هذه الجمل تابعة لذلك الشرط. مقدار الانزياح الموصى به هو 4 فراغات. ولتوضيح المثال السابق أكثر نعود لهذه الصورة والتي رأيناها في درس سابق عندما شرحنا النمط الشرطي في برامج بايثون: فيديو الدرس'''
