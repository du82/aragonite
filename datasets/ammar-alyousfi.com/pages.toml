full_description = "YouTube Trending Videos Analysis (40,000+ Videos) Oct 11, 2018 • Category: Data science Tags: Data analysis, Data science, Data visualization, Data science project, Python, Exploratory data analysis. YouTube is the most popular and most used video platfrom in the world today. YouTube has a list of trending videos that is updated constantly. Here we will use Python with some packages like Pandas and Matplotlib to analyze a dataset that was collected over 205 days. For each of those days, the dataset contains data about the trending videos of that day. It contains data about more than 40,000 trending videos. We will analyze this data to get insights into YouTube trending videos, to see what is common between these videos. Those insights might also be used by people who want to increase popularity of their videos on YouTube. The dataset that we will use is obtained from Kaggle here. It contains data about trending videos for many countries. Here we will analyze USA trending videos. Goals of the analysis We want to answer questions like: How many views do our trending videos have? Do most of them have a large number of views? Is having a large number of views required for a video to become trending? The same questions above, but applied to likes and comment count instead of views. Which video remained the most on the trendin-videos list? How many trending videos contain a fully-capitalized word in their titles? What are the lengths of trending video titles? Is this length related to the video becoming trendy? How are views, likes, dislikes, comment count, title length, and other attributes correlate with (relate to) each other? How are they connected? What are the most common words in trending video titles? Which YouTube channels have the largest number of trending videos? Which video category (e.g. Entertainment, Gaming, Comedy, etc.) has the largest number of trending videos? When were trending videos published? On which days of the week? at which times of the day? To see the answers of these questions and more, with tables and many visualizations, and with the code used step-by-step, visit the analysis notebook on Kaggle: YouTube Trending Video Analysis If you like the analysis, please consider voting for it."
