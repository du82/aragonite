title = "تحليل المباريات الدولية بين عام 1872 و 2018 (أكثر من 40,000 مباراة) | Ammar Alyousfi’s Blog"
description = "The personal website of Ammar Alyousfi which contains a blog about data science, data analysis, data visualization, machine learning, Python, and more."
full_description = "تحليل المباريات الدولية بين عام 1872 و 2018 (أكثر من 40,000 مباراة) Feb 14, 2020 في هذا المنشور سأعرض نتائج تحليل البيانات للمباريات الدولية التي أقيمت بين عام 1872 وعام 2018 (147سنة). وأعني بالمباريات الدولية المباريات بين المنتخبات الوطنية مثل منتخب البرازيل والمنتخب الألماني ومنتخب السعودية إلخ. يعتمد تحليل البيانات هذا على مجموعة بيانات منشورة على موقع Kaggle. تحتوي هذه المجموعة على معلومات عن أكثر من 40,000 مباراة دولية كما ذكرنا. المعلومات المتوفرة لكل مباراة هي تاريخ المباراة والفريقين المتباريين ونتيجة المباراة والبلد الذي استضاف المباراة والبطولة التي أقيمت ضمنها المباراة (مثل كأس العالم وكأس الأمم الأوروبية إلخ) ومعلومات أخرى. الصورة أدناه تعرض السطور القليلة الأولى من مجموعة البيانات هذه. ملاحظة: لقد قمت بإجراء تحليل البيانات هذا وكتبت عنه باللغة الإنجليزية في مدونتي الإنجليزية وحقق انتشاراً جيداً (انظر هنا وهنا وهنا)، وهنا أنشره باللغة العربية عسى أن يلقى قبولاً من الجمهور العربي. أهمية هذا التحليل هذا التحليل يقدم نتائج تهم محبي ومتابعي كرة القدم حول العالم لأنه يستخلص نتائج مثيرة للاهتمام من بيانات متفرقة عن عدد كبير من المباريات ويقدم النتائج عن طريق رسوم بيانية جميلة. فالرسم البياني الواحد يلخص لك معلومات موجودة في أكثر من 40,000 سطر. أهداف التحليل هذا التحليل يهدف إلى الإجابة عن الأسئلة التالية: ما هو الفريق الذي لعب مباريات أكثر من غيره من الفرق عبر التاريخ؟ ما هو الفريق الذي لعب مباريات أكثر من غيره في كأس العالم؟ ما هو الفريق الذي حقق أكبر عدد من الانتصارات عبر التاريخ؟ ما هو الفريق الذي تكبد أكبر عدد من الخسارات عبر التاريخ؟ ما هو الفريق الذي أحرز أكبر عدد من الأهداف على مر السنين؟ ما هو الفريق الذي أحرز أكبر عدد من الأهداف في كأس العالم؟ ما هي الفرق التي تكرر لعبها ضد بعضها أكثر؟ هل عدد الأهداف في المباريات الودية أقل من عددها في المباريات غير الودية؟ ما هي البطولة التي يتم إحراز أكبر عدد من الأهداف فيها؟ ما هي نسبة المباريات التي انتهت بالتعادل عبر التاريخ؟ ما عدد المباريات التي تم لعبها في كل بطولة عبر التاريخ؟ كيف يتغير عدد المباريات من سنة إلى أخرى؟ هل كان عدد المباريات في ستينات القرن الماضي أكثر من الآن؟ ما هو الشهر من السنة الذي أقيم فيه أكبر عدد من المباريات عبر التاريخ؟ هل هو آب؟ هل هو كانون الثاني؟ هل يتغير عدد المباريات بشكل ملحوظ من شهر لآخر؟ ما هو يوم الأسبوع الذي أقيم فيه أكبر عدد من المباريات عبر التاريخ؟ هل هو الخميس؟ هل هو السبت؟ هل يتغير عدد المباريات بشكل ملحوظ من يوم لآخر؟ كيف تم إجراء هذا التحليل؟ تم إجراؤه بشكل رئيسي باستخدام لغة بايثون (Python) البرمجية؛ تم استخدام حزمة Pandas لقراءة البيانات وتحليلها وتخزينها؛ تم استخدام حزمة Matplotlib لإنشاء الرسوم البيانية. وتم إجراء التحليل بكامله ضمن Jupyter Lab. الكود المستخدم لإجراء التحليل يمكن الوصول إلى الكود المستخدم لإجراء التحليل وشرح العمليات التي تم إجراؤها عن طريق هذا الرابط على موقع Github. والآن لنبدأ بعرض نتائج التحليل. نتائج التحليل ما هو الفريق الذي لعب مباريات أكثر من غيره من الفرق عبر التاريخ؟ السويد هي من لعبت مباريات أكثر من جميع الفرق الأخرى. ليست البرازيل، وليست ألمانيا، بل السويد! لعبت 1,004 مباريات، ويليها إنجلترا التي لعبت 999 مباراة، ثم البرازيل والأرجنتين حيث لعب كل منهما 966 مباراة. الرسم البياني يعرض أيضاً عدد المباريات التي تم لعبها في البطولات. مثلاً، يمكن رؤية أن معظم مباريات السويد كانت ودية (friendly) وأنها لعبت عدداً لا بأس به من المباريات في بطولتي كأس العالم )(FIFA World Cup) وكأس الأمم الأوروبية (UEFA Euro). ما هو الفريق الذي لعب مباريات أكثر من غيره في كأس العالم؟ إذا أخذنا بعين الاعتبار بطولة كأس العالم فقط فإن كلاً من ألمانيا والبرازيل يأتي في المركز الأول حيث لعب كل منهما 109 مباريات في كأس العالم. ويليهما إيطاليا التي لعبت 83 مباراة ثم الأرجنتين التي لعبت 81 مباراة. ما هو الفريق الذي حقق أكبر عدد من الانتصارات عبر التاريخ؟ نرى أن البرازيل حققت أكبر عدد من الانتصارات عبر التاريخ حيث فازت في 617 مباراة. بعد البرازيل تأتي إنجلترا التي حققت 565 انتصاراً ثم ألمانيا التي حققت 548 انتصاراً. ما هو الفريق الذي تكبد أكبر عدد من الخسارات عبر التاريخ؟ فنلندا هو الفريق الذي خسر مباريات أكثر من جميع الفرق الأخرى؛ لقد خسر في 395 مباراة. بعد فنلندا تأتي سويسرا التي خسرت 342 مباراة ثم إيرلندا الشمالية التي خسرت 329 مباراة. الانتصارات - الخسارات رأينا أن هناك فرقاً انتصرت أكثر من الأخرى وأن هناك فرقاً خسرت أكثر من غيرها. الآن سنطرح عدد مرات الخسارة لكل فريق من عدد مرات فوزه ونرى النتائج. هذا سيتيح لنا أن نرى الفرق التي فازت أكثر مما خسرت والفرق التي خسرت أكثر مما فازت. الرسم البياني يعرض الفرق العشرين الأولى بناء على القيمة المطلقة لـ (الانتصارات - الخسارات). نرى أن البرازيل تأتي في المقدمة بقيمة 461 وهذا يعني أنها فازت 461 مرة أكثر مما خسرت. ثم تأتي إنجلترا بقيمة 372 ثم ألمانيا بقيمة 349. هذه الفرق كلها فازت أكثر مما خسرت، ولذلك رسمت باللون الأخضر. على الضفة الأخرى هناك فرق خسرت أكثر مما فازت عبر التاريخ، وهي مرسومة باللون الأحمر. في مقدمة هذه الفرق تأتي لوكسمبورغ بقيمة -276 وهذا يعني أنها خسرت 276 مرة أكثر مما فازت، ثم مالطا بقيمة -228، ثم فنلندا بقيمة -212. ما هو الفريق الذي أحرز أكبر عدد من الأهداف على مر السنين؟ كما يظهر في الرسم: فريق إنجلترا هو من أحرز أهدافاً أكثر من أي فريق آخر؛ أحرز 2,170 هدفاً، ويليه فريق البرازيل الذي أحرز 2,091 هدفاً، ثم فريق ألمانيا والذي أحرز 2,116 هدفاً. ما هو الفريق الذي أحرز أكبر عدد من الأهداف في كأس العالم؟ بالنظر إلى مباريات كأس العالم فقط فنرى أن البرازيل هي أكثر من أحرز أهدافاً في كأس العالم برصيد 229 هدفاً ثم ألمانيا بـ 226 هدفاً، ثم الأرجنتين بـ 137 هدفاً. ما هي الفرق التي تكرر لعبها ضد بعضها أكثر؟ كما يظهر في الصورة فإن الفريقين اللذين تواجها في مباريات أكثر من غيرهما هما الأرجنتين والأوروغواي حيث تواجها في 175 مباراة عبر التاريخ. بعدهما يأتي فريقا النمسا وهنغاريا حيث تواجها 133 مرة، ثم بلغاريا وهولندا اللذين تواجها 125 مرة. إذا نظرنا إلى خريطة العالم نجد أن هذه الأزواج تقع بجانب بعضها: فالأرجنتين تقع بجانب الأوروغواي والنمسا بجانب هنغاريا وبلغاريا بجانب هولندا كما يظهر في الصورة أسفله. هل عدد الأهداف في المباريات الودية أقل من عددها في المباريات غير الودية؟ كما نرى في الرسم فليس هناك فرق يذكر بين متوسط عدد الأهداف في المباريات الودية وبين متوسط عدد الأهداف في المباريات غير الودية. ما هي البطولة التي يتم إحراز أكبر عدد من الأهداف فيها؟ كما يُظهر الرسم فإن مباراة في البطولة البريطانية (British Championship) يتم تسجيل 3.5 أهداف بها في المتوسط. ومتوسط عدد الأهداف في مباريات تصفيات كأس الكاريبي (CFU Caribbean Cup qualification) قريب جداً من ذلك. بعد ذلك، فإن متوسط عدد الأهداف في مباريات بطولة ميركادا (Merdeka Tournament) هو 3.3. أيضاً يمكننا رؤية أن المباريات الودية يتم تسجيل أهداف بها أكثر من مباريات كأس العالم، وكذلك نرى أن مباريات تصفيات كأس العالم يتم تسجيل أهداف بها أكثر من مباريات كأس العالم. ما هي نسبة المباريات التي انتهت بالتعادل عبر التاريخ؟ نسبتها 23.1٪ كما هو ظاهر. ما عدد المباريات التي تم لعبها في كل بطولة عبر التاريخ؟ من رسم الخريطة الشجرية أعلاه (حيث يمثل حجم المستطيل عدد المباريات لكل بطولة) نرى أن أكثر المباريات الدولية التي تم لعبها كانت ودية (friendly) حيث تم لعب 16,795 مباراة ودية من إجمالي عدد المباريات البالغ 40,407 مباراة. بعد المباريات الودية تأتي مباريات تصفيات كأس العالم (FIFA World Cup qualification) ثم مباريات تصفيات كأس الأمم الأوروبية (UEFA Euro qualification). كيف يتغير عدد المباريات من سنة إلى أخرى؟ هل كان عدد المباريات في ستينات القرن الماضي أكثر من الآن؟ من رسم المخطط الشريطي (bar chart) أعلاه نرى أنه بشكل عام فإن عدد المباريات يزداد عبر السنين. كانت سنة 2008 السنة التي شهدت أكبر عدد من المباريات بحصيلة 1,091 مباراة. كيف يتغير عدد الأهداف من سنة لأخرى؟ يظهر الرسم أن عدد الأهداف يميل للزيادة عبر السنين أيضاً. لمشاهدة العلاقة بين عدد المباريات وعدد الأهداف عبر السنين بشكل أسهل شاهد الرسم أدناه والذي يعرض الرسمين السابقين مع بعضهما. ما هو الشهر من السنة الذي أقيم فيه أكبر عدد من المباريات عبر التاريخ؟ هل هو آب؟ هل هو كانون الثاني؟ هل يتغير عدد المباريات بشكل ملحوظ من شهر لآخر؟ كما نرى فإن عدد المباريات يختلف من شهر لآخر. كان شهر حزيران (June) الشهر الذي شهد مباريات أكثر من باقي الشهور حيث شهد 5,706 مباراة على مر السنين من أصل 40,407 مباراة. في نهاية القائمة يأتي شهر كانون الثاني (January) حيث شهد 2,148 مباراة فقط. ما هو يوم الأسبوع الذي أقيم فيه أكبر عدد من المباريات عبر التاريخ؟ هل هو الخميس؟ هل هو السبت؟ هل يتغير عدد المباريات بشكل ملحوظ من يوم لآخر؟ نرى أن يوم الأحد شهد مباريات أكثر من باقي الأيام حيث أقيم فيه 9,943 مباراة، وبعده يأتي يوم الأربعاء بفارق بسيط. في نهاية القائمة نرى يوم الاثنين حيث شهد 2,313 مباراة فقط. ملخص للنتائج هذا الملخص لا يغني عن النتائج المعروضة أعلاه لكن قد ينفع لتذكر بعض الأشياء في هذا التحليل. خلال الفترة بين عام 1872 و2018: السويد 🇸🇪 لعبت مباريات أكثر من الفرق الأخرى ألمانيا 🇩🇪 لعبت مباريات في كأس العالم أكثر من الفرق الأخرى البرازيل 🇧🇷 فازت أكثر من الفرق الأخرى فنلندا 🇫🇮 خسرت أكثر من الفرق الأخرى البرازيل 🇧🇷 حققت 461 فوزاً صافياً: أكثر من أي فريق آخر لوكسمبورغ 🇱🇺 حققت 276 خسارة صافية: أكثر من أي فريق آخر إنجلترا 🏴󠁧󠁢󠁥󠁮󠁧󠁿 أحرزت أهدافاً أكثر من الفرق الأخرى البرازيل 🇧🇷 أحرزت أهدافاً في كأس العالم أكثر من الفرق الأخرى الأرجنتين 🇦🇷 والأوروغواي 🇺🇾 تواجها أكثر من أي فريقين آخرين 23.1٪ من المباريات انتهت بالتعادل شهر حزيران جرى فيه مباريات أكثر من الشهور الأخرى يوم الأحد شهد مباريات أكثر من الأيام الأخرى العمل المستقبلي زيادة على ما تم عمله هنا يمكن إجراء تحليلات أكثر عمقاً. مثلاً يمكن أن يتم تحليل أداء المنتخب المصري على مر السنين ومعرفة سنوات تميزه وسنوات ذبوله. أو يمكن أن يتم إجراء تحليل للفرق الخليجية وإجراء مقارنات بينها. يمكن أيضاً مقارنة القارات ببعضها، وأمور أخرى. إذا كنت ترغب برؤية تحليلات كهذه أو غيرها أخبرني بذلك عبر بريدي الإلكتروني أو حسابي في تويتر. إذا أعجبك هذا العمل شاركه مع غيرك 📲. إذا كنت من سكان الإمارات يمكنك أيضاً متابعة حساب جديد يعرض نتائج تحليل بيانات تتعلق بالإمارات العربية المتحدة على Instagram أو Twitter."
