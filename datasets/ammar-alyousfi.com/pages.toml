["https://ammar-alyousfi.com/2024/my-notes-from-100m-leads-how-to-get-strangers-to-want-to-buy-your-stuff"]
title = "My Notes From: $100M Leads: How to Get Strangers To Want To Buy Your Stuff | Ammar Alyousfi’s Blog"
description = "Book Full Title: $100M Leads: How to Get Strangers To Want To Buy Your Stuff."
full_description = "My Notes From: $100M Leads: How to Get Strangers To Want To Buy Your Stuff Feb 18, 2024 • Category: Book notes Tags: Business, Startups, Marketing. Book Full Title: $100M Leads: How to Get Strangers To Want To Buy Your Stuff. Book page on Goodreads: $100M Leads: How to Get Strangers To Want To Buy Your Stuff. Book in A Paragraph The book is about getting engaged leads. It covers the core four advertising methods: warm outreach, post free content, cold outreach, and run paid ads. It also covers the four lead getters: customer referrals, word of mouth, agencies, and affiliates. The book is written by Alex Hormozi who is a serial entrepreneur and has founded and scaled three companies to $120M+ in cumulative sales across four different industries without taking on outside capital. My Notes Here are my notes from each chapter of the books. How I Got Here My offer was simple. I’ll fill your gym in 30 days for free. You pay nothing. I pay for everything. I sell new members and keep the first 6 weeks of membership fees as payment. You get everything else. If I don’t fill your gym, I don’t make money. You spend nothing either way. It was an easy offer to sell. The Problem This Book Solves You’re not getting as many leads as you want because you’re not advertising enough. Period. In a nutshell: I will show you how to get strangers to want to buy your stuff. Leads Alone Aren’t Enough A lead is a person you can contact. That’s all. If you bought a list of emails, those are leads. If you get contact information from a website or database, those are leads. The numbers in your phone are leads. People on the street are leads. If you can contact them, they are leads. Leads alone aren’t enough. We want engaged leads: people who show interest in the stuff you sell. If someone gives their contact information on a website, that is an engaged lead. Engaged leads are the true output of advertising. Engage Your Leads: Offers and Lead Magnets Often, a business promises to give its product or service in exchange for money. This is a core offer. Sometimes, though, people want to know more about your offer before they buy. This is common for businesses that sell more expensive stuff. If that’s you, then you’ll often get more leads to engage by advertising with a lead magnet first. A lead magnet is a complete solution to a narrow problem. It’s typically a lower-cost or free offer to see who is interested in your stuff. And, once solved, it reveals another problem solved by your core offer. This is important because leads interested in lower-cost or free offers now are more likely to buy a related higher-cost offer later. Think of it like salty pretzels at a bar. If somebody eats the pretzels, they’ll get thirsty and order a drink. The salty pretzels solve the narrow problem of hunger. They also reveal a thirst problem solved by a drink, which they can get, in exchange for money. Your lead magnet should be valuable enough on its own that you could charge for it. A person who pays with their time now is more likely to pay with their money later. Types of lead magnets 1) Reveal Their Problem. Think “diagnosis.” If your audience has a problem they don’t know about, your lead magnet would make them aware of it. These lead magnets work great when they reveal problems that get worse the longer you wait. Example: You run a speed test that shows their website loads at 30 % below the speed it should. You draw a clear line between where they should be and how much money they lose by being below standards. 2) Samples And Trials. You give full but brief access to your core offer. You can limit the number of uses, time they have access, or both. This works great when your core offer is a recurring solution to a recurring problem. 3) One Step Of A Multi-Step Process. You can give them one step in a multi-step process that solves a bigger problem. Leads have to notice your lead magnet before they can consume it. Like it or not, this means how we present it matters more than anything. For example, improving the headline, name, and display of your lead magnet can 2x, 3x, or 10x your engagement. Here’s what you do next-you test. The three things you’ll want to test are the headline, the image(s), and the subheadline, in that order. People buy stuff based on how much value they think they’ll get after they buy it. And the easiest way to get them to think they’ll get tons of value after they buy is … drum roll please … to provide them with value before they buy. Once the leads consume the lead magnet, some of them will be ready to buy or learn more about your offer. This is the time to give a Call To Action (CTA). Good CTAs have two things: 1) what to do and 2) reasons to do it right now. Let’s say you make $10,000 of profit on your core offer. And it costs you $1000 in advertising to get someone on a call for it. If you close one out of three people, it costs you $3000 in advertising to get a customer. Imagine you advertise a free lead magnet instead of your core offer. Your lead magnet costs you $25 to deliver, and because it’s free to them, more will engage. The extra engagement means it only costs $75 in advertising to get someone on a call. All in, it’s $100 per call. Now, let’s say one out of ten folks who get the lead magnet buys your core offer. This means your new cost to acquire a customer is $1000 ($100 x 10 people). We just cut our cost to get a customer by 3x. The Core Four Advertising Methods: #1 Warm Outreach When I make an offer from scratch, I refer to the value equation. If you’re wondering ‘what’s the value equation?’-it was the core concept of my first book $100M Offers. The goal is to maximize the first two and minimize the second two. So all you have to do now is show someone: You have exactly what they want They’re guaranteed to get it Insanely fast Without lifting a finger or giving up anything they love. So let’s do just that with a real-life offer:… By the way, do you know anybody who is (describe their struggles) looking to (dream outcome) in (time delay)? I’m taking on five case studies for free, because that’s all I can handle. I just want to get some testimonials for my service / product. I help them (dream outcome) without (effort and sacrifice). It works. I even guarantee people get (dream outcome) or I work with them until they do. I just had a girl named XXX work with me (dream outcome) even though she (describe the same struggle your contact has). I also had another guy who (dream outcome) and it was his first time. I’d just like more testimonials to show it works across different scenarios. Does anyone you like come to mind? (Pause if on the phone) … and if they say no … Haha, well … does anyone you hate come to mind? (ha) This helps break any awkwardness. There’s an important feature here. We’re not asking them to buy anything. We’re asking if they know anyone. And of the people who say yes, most say they are interested. #2 Post Free Content Part I Building an audience is the most valuable thing I’ve ever done. Leila bought me four calls with a big influencer who had the type of audience I wanted to build. She paid $120,000. On my first call, he told me to post regularly on every platform. So, that’s what I did. Twelve months later, my audience grew by more than 200,000 people. On my second call, he noted the progress. But I wanted more. He said, “Bro, anyone telling you there’s some secret is trying to sell you something. We just put out as much as we possibly can. Pull up your Instagram and pull up my Instagram… Look. You’ve posted once today. I posted three times. Pull up your LinkedIn … Look. You posted once this week. I posted five times today.” Simple. Not easy. Over the next six months I put out ten times the content. And over the next six months, I added 1.2M people to my audience. Free content makes all other advertising more effective. If you reach out to someone and they can’t find content related to your services, they’re less likely to buy. On the other hand, if they find lots of valuable content, they are more likely to buy. #2 Post Free Content Part II Switch from “How to” to “How I.” From “This is the best way” to “These are my favorite ways” etc. (especially when starting out). Narrow the focus of your content. If you have a small local business, you probably shouldn’t make general business content. Not at first, at least. Why? The audience will listen to people with better track records than you. But you can narrow your topics to what you do and the place you do it. Example: plumbing in a certain town. If you do that, you can become king of that puddle. Over time, you can expand your plumbing puddle to the general local business pond. Then the lake of brick & mortar chains and so forth. First, we start with warm outreach. We reach out to every person we have permission to contact. Second, we post publicly about the successes and lessons we have from our first clients. We post testimonials. We provide value. Then occasionally ask. We commit to doing both of these activities every day. #3 Cold Outreach Cold outreach has one key difference from warm outreach: trust. Strangers don’t trust you. Cold outreach is a numbers game. The more people you reach out to the more engaged leads you get. Once we figure out how much outreach it takes to engage a lead, then we only have one thing to do … more. There are three different ways I get my targeted lead lists. First, I use software to scrape a list of names. Second, I pay brokers to assemble me a list of targeted leads. And if neither of those work, I manually scrape a list of names myself. Find your scraping tool by searching “outbound leads scraping tool” or “database lead scraping.” There are two important factors I emphasize to get strangers to engage: personalization and big fast value. This is important because they don’t know us and they don’t trust us. We’ve gotta overcome both issues in a matter of seconds. A) They Don’t Know Us → Personalize (Act Like You Know Them). This comes in handy for personal subject lines on emails, the first few messages in chat, or the first few sentences someone hears. B) They Don’t Trust Us → Big Fast Value. We’re not trying to tickle their interest, we’re trying to blow their minds in under thirty seconds. It needs to be BIG FAST VALUE. If it’s not, or it’s mediocre, you’ll blend in with the ocean of people trying to get their attention. Give away something for free people would normally pay for and they will want it. Note: I didn’t say, “so good they should pay for it,” I said, “stuff they actually pay for.” Pro Tip: 50% Email Response Rate Bump I took our cold outreach template and re-wrote it below a third grade reading level. The results: 50% more leads responded. I recommend running all scripts and messages through a free reading level app online. I won’t recommend one because they go out of business all the time, but I promise you can find one. Make your messages easier to understand and more people will respond. #4 Run Paid Ads Part I: Making An Ad With warm and cold outreach we have to do more stuff to reach more people. To reach more people with free content, we depend on the platform or audience sharing it if they feel like it. Paid ads are different. The reach is guaranteed. But getting your money back isn’t. So it’s a game of efficiency rather than reach. This chapter reveals how I create more efficient paid ads by finding needles in the haystack. I start with the entire world as my audience (haystack) then narrow down to get a higher percentage of engaged leads (needles). First, I pick a platform that contains my ideal audience. Second, I use whatever targeting methods that exist within the platform to find them. Third, I craft my ad in a way that repels anyone else. Finally, I tell whoever’s left standing to take the next step. People overcomplicate it. But that’s it. Once we advertise profitably in a small puddle of an audience, we expand to a pond, then a lake, then an ocean. And as the audience gets bigger it does have more of the wrong people, but it has more of the right ones too. …instead of spending $1000 to make $10,000 with $9000 in profit, you spend $100,000 to make $300,000 with $200,000 in profit. Your ratio goes down, but you make more money. Modern advertising platforms have two ways to target. You can use them separately or combine them: 1) Target a lookalike audience. Modern platforms can show your ad to an audience that is similar to, and much bigger than, a list you provide. 2) Target with factors of your choosing. Targeting options include: age, income, gender, interests, time, location, etc. What should the ad say? → Call Out + Value + Call to Action (CTA) Call Out: People noticing your ad is the most important part of the ad … by a lot. My advertising became 20x more effective when I focused the majority of my effort on the first five seconds. We need the audience’s eyes and ears just long enough for them to realize “this is for me, I’ll keep paying attention.” People want to work with people who look, talk, and act in ways familiar to them. So if you serve a broad customer base use more ethnicities, ages, genders, personalities etc. in your ads. If you serve a narrow customer base (ex: medical devices for seniors), then use people who look like them. Dream Outcome: A good ad will show and tell the maximum benefit the prospect can achieve using the thing you sell. Opposite-Nightmare: A good ad will also show them the worst possible hassles, pain, etc. of going without your solution. Lower perceived risk by minimizing or explaining away past failures, emphasizing the success of people like them, giving assurances by authority, guarantees, and how what you have to offer will at least give them a better chance of success than what they currently do, etc. A good ad will also show them how slow their current trajectory is. A good ad will show and tell how much faster they will get the thing they want. A good ad will also show them the amount of work and skill they’ll need to get the result without your solution. A good ad tells and shows how you can avoid the stuff you hate doing, do more of the stuff you love doing. Make your landing pages match your ads. People click an ad because you promised them some benefit. So carry that same look and language over to your landing page. In Robert Cialdini’s seminal work, Influence, he shows that people like to think of themselves as consistent. So, if you remind them of the action they just took (CTA), and show how taking the next action aligns with it, you’ll get more people to take the second action (Contact Info). For example, “Now that you just did A, you need to do B to get the most of A.” Or “Doing A makes you a ‘doing A’ kind of person. Doing A kind of people, do B.” To be clear, we aren’t selling anything. We are asking if they’re interested in the stuff we sell. And if they’re interested, they’ll give us a way to tell them more about it. And when t"
