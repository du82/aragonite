description = "homepage, document, webpage, page, web, net, amo berkeley, experimental atomic physics at Lawrence Berkeley National Lab: dynamics of atomic and molecular reactions, correlation, photoionization, high harmonics, strong laserfields, synchrotron, free electron laser, momentum spectroscopy, reaction microscope, COLTRIMS"
full_description = 'This person is a member of the experimental Atomic Molecular and Optical Sciences (AMOS) Group: "Many Particle Momentum Spectroscopy with Synchrotron Radiation and High Harmonic Laserpulses as well as Electron Impact" The paragraph about my research interests is still under construction. There is more information coming soon. Anyways, in our group we use the COLd Target Recoil Ion Momentum Spectroscopy COLTRIMS. Please see the picture below for a schematic drawing of the experimental setup Figure 1: Schematically drawing of the momentum spectrometer: The target molecules, prepared in a supersonic jet going from the bottom to the top, are intersected with the pulsed photon beam in the middle of the copper rings which define a homogenous electrical field. The big coils represent a Helmholtz pair which establishes a homogenous magnetic field in parallel to the spectrometer axis. The nuclei are guided to a position sensitive detector to the left while the electrons get spiraled to the right (due to their low mass in the magnetic field). All experiments are carried out at the Lawrence Berkeley National Laboratory. We do measurements at several beamlines of the Advanced Light Source ALS (see about_the_ALS for more information about this 3rd generation synchrotron ring) and at our laser labs in building 2. Purpose of this Web Site: Presentation of information about the member of the experimental Atomic Molecular and Optics Workgroup of the Chemical Sciences Division at LBNL. Exchange of files and folders for scientific related research. Infringement of Industrial Property Rights: If you assume that one of your patent rights is hurt on this website please communicate immediately via electronic mail, so that remedy can be created briskly. Please note: The time and money consuming engagement of a lawyer for issuing a warning liablity does not correspond to my real or presumed will. Area of Resposibility: The impressum is only valid for the following website: http://amo-csd.lbl.gov/ASGatton including all subfolders'
