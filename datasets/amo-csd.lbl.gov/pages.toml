["https://amo-csd.lbl.gov/locations.php"]
title = "AMOS Experiment at LBNL"
description = "homepage, document, webpage, page, web, net, amo berkeley, experimental atomic physics at Lawrence Berkeley National Lab: dynamics of atomic and molecular reactions, correlation, photoionization, high harmonics, strong laserfields, synchrotron, free electron laser, momentum spectroscopy, reaction microscope, COLTRIMS"
full_description = "Lawrence Berkeley National Laboratory (Berkeley Lab) has been a leader in science and engineering research for more than 70 years. Located on a 200 acre site in the hills above the University of California's Berkeley campus, adjacent to the San Francisco Bay, Berkeley Lab holds the distinction of being the oldest of the U.S. Department of Energy's National Laboratories. The Lab is managed by the University of California, operating with an annual budget of more than $500 million (FY2004) and a staff of about 3,800 employees, including more than 500 students. Berkeley Lab conducts unclassified research across a wide range of scientific disciplines with key efforts in fundamental studies of the universe; quantitative biology; nanoscience; new energy systems and environmental solutions; and the use of integrated computing as a tool for discovery. It is organized into 17 scientific divisions and hosts four DOE national user facilities. Details on Berkeley Lab�s divisions and user facilities can be viewed here. The Lab was founded in 1931 by Ernest Orlando Lawrence, winner of the 1939 Nobel Prize in physics for his invention of the cyclotron, a circular particle accelerator that opened the door to high-energy physics. It was Lawrence�s belief that scientific research is best done through teams of individuals with different fields of expertise, working together. His teamwork concept is a Berkeley Lab legacy that has yielded rich dividends in basic knowledge and applied technology, and a profusion of awards. Today there are eleven Nobel Laureates associated with Berkeley Lab. A history of Lawrence and his laboratory can be viewed here. Information about the Nobel Laureates at Berkeley Lab can be viewed here. The Advanced Light Source (ALS), a division of Berkeley Lab, is a national user facility that generates intense light for scientific and technological research. As one of the world's brightest sources of ultraviolet and soft x-ray beams - and the world's first third-generation synchrotron light source in its energy range - the ALS makes previously impossible studies possible. The facility welcomes researchers from universities, industries, and government laboratories around the world. It is funded by the U.S. Department of Energy's Office of Basic Energy Sciences."
