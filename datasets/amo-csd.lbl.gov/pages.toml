["https://amo-csd.lbl.gov"]
title = "AMOS Experiment at LBNL"
description = "homepage, document, webpage, page, web, net, amo berkeley, experimental atomic physics at Lawrence Berkeley National Lab: dynamics of atomic and molecular reactions, correlation, photoionization, high harmonics, strong laserfields, synchrotron, free electron laser, momentum spectroscopy, reaction microscope, COLTRIMS"
full_description = "The experimental Atomic Molecular and Optical Science group is a working group of young investigators active in the field of atomic, molecular and optical physics. Conicident electron and recoil-ion (momentum) spectroscopy is used to investigate many particle problems induced by the fragmentation of small atoms and molecules with light (photons from synchrotron, short laser pulses and high harmonics) and slow electrons. The experimental AMOS Group is part of the Chemcial Sciences Division of the Lawrence Berkeley National Laboratory (LBNL) which is operated by the University of California Berkeley (UCB) for the U.S. Department of Energy (DOE). The experimental group is led by Dr. Daniel Slaughter and Dr. Thorsten Weber and conducts experiments at the Advanced Light Source (ALS) and laser facilites in building 2 of LBNL. Use this website to get information about the research field(s) and the network the AMOS group is active in. Please note: This webpage is optimized for Microsoft Internet Explorer. Certain buttons will not work if you are using Firefox or Netscape for instance. We are sorry for the inconvience - please switch to Microsoft Internet Explorer when you experience any problems. Thanks."
