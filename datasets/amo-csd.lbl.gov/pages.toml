["https://amo-csd.lbl.gov/scientific.php"]
title = "AMOS Experiment at LBNL"
description = "homepage, document, webpage, page, web, net, amo berkeley, experimental atomic physics at Lawrence Berkeley National Lab: dynamics of atomic and molecular reactions, correlation, photoionization, high harmonics, strong laserfields, synchrotron, free electron laser, momentum spectroscopy, reaction microscope, COLTRIMS"
full_description = 'Today we are aware of the importance of the micro cosmos, which is made of atoms and molecules. All objects around us consist of these tiny particles which in their detail are oblivious for us. But it is their interaction, i.e. their chemistry which has a direct effect on our daily life: For instance, special materials make vehicles faster and more effective. New drugs help us to live longer and healthier and many more� There is a clear potential for improving our life styles and solving global problems like energy and hunger once we are in control of this microscopic world. But in order to conserve our resources and cure diseases, detailed knowledge of the interaction of electrons, atoms, and molecules is indispensable. We have to answer questions like "what kind of characteristics, such as geometry and reactivity, do these particles have and how can we use them to design new compounds with the properties we desire?". For this reason we need to get a deep insight into atoms and molecules, which means single particles have to be studied experimentally and theoretically in order to understand how existing structures break-up and new bindings develop. The crux is that the micro cosmos is hard to access. In most cases the tiniest measuring probes or projectiles, which we can handle today, are of the same order of magnitude than the samples themselves since they are electrons or ions or short (laser) light pulses. However, since projectile and target have similar properties this fundamental kind of physics becomes comparable to a billiard game: The scientist shoots the white cue-ball with his cue onto a formation of colored balls which collide and diverge into different pockets. From the final state of these balls, i.e. the pockets they sunk-in and the initial velocity of the cue ball scientists like to calculate the trajectories of the particles. This provides knowledge about the structure and property of the target. In this classical picture modern physics can treat collisions of two balls exactly, which means there exists a mathematical solution that enables us to predict the trajectories and the outcome of the carom. Once there are more than two balls involved it becomes very difficult to make any prediction of the way the particles are going to take on the table. The understanding of many body dynamics is crucial since in most cases there are fore sure more than just two particles involved.'
year_published = 2025
clearnet = "https://amo-csd.lbl.gov/scientific.php"
