["https://amo-csd.lbl.gov/collaborations.php"]
title = "AMOS Experiment at LBNL"
description = "homepage, document, webpage, page, web, net, amo berkeley, experimental atomic physics at Lawrence Berkeley National Lab: dynamics of atomic and molecular reactions, correlation, photoionization, high harmonics, strong laserfields, synchrotron, free electron laser, momentum spectroscopy, reaction microscope, COLTRIMS"
full_description = "The experimental AMOS group is in close collaboration with the theoretical group around Prof. Dr. C.W. McCurdy and coworkers. Experiments are inspired by their calculations and vice versa. Both, the experimental as well as the theory group, are located in the same building (building 2 of LBNL) and usally go for lunch together at the Cafeteria having inspiring dicsussions and exchange of ideas. Since 1997 there is a strong collaboration between international AMO experimentalists using the COLTRIMS method to study the dynamics of many particle systems in the gas phase and on sold state surfaces. Many successful joint projects have been carried out during two-bunch-mode at the Advanced Light Source of the Lawrence Berkeley National Lab. There is a dedicated set-up which houses a reaction microscope at LBNL and which is operated and maintained through the experimental AMOS group. In addition there is friendly connection to two other COLTRIMS groups: Prof. Dr. Joachim Ullrich is one of the founders of this kind of atomic and molecular imaging technique, which has beend useed and further developed in many successful experiments at the Advanced Light Source two times a year (two-bunch-mode) since 1997. The group of Prof. Dr. Kiyoshi Ueda conducts experiments at SPring8 in Kansai/Japan. The COLTIRMS collaboration exchanges many ideas and experiences with his friendly group."
