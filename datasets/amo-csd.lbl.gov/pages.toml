["https://amo-csd.lbl.gov/about.php"]
title = "AMOS Experiment at LBNL"
description = "homepage, document, webpage, page, web, net, amo berkeley, experimental atomic physics at Lawrence Berkeley National Lab: dynamics of atomic and molecular reactions, correlation, photoionization, high harmonics, strong laserfields, synchrotron, free electron laser, momentum spectroscopy, reaction microscope, COLTRIMS"
full_description = "Get some general information about AMOS physics and learn about the Atomic Molecular and Optical Sciences group in the Chemical Sciences Division of Lawrence Berkeley National Laboratory: Atomic, molecular, and optical physics is the study of matter-matter and light-matter interactions on the scale of single atoms or structures containing a few atoms. The three areas are grouped together because of their interrelationships, the similarity of methods used, and the commonality of the energy scales that are relevant. Physicists sometimes abbreviate the field as AMO physics. All three areas include both classical and quantum treatments Atomic Physics:Atomic physics studies the electron hull of atoms. This branch of physics is distinct from nuclear physics, despite their association in the public consciousness. Atomic physics is not concerned with the intra-nuclear processes studied in nuclear physics, although properties of the nucleus can be important in atomic physics (e.g., hyperfine structure). Current research focuses on activities in quantum control, cooling and trapping of atoms and ions, low-temperature collision dynamics, the collective behavior of atoms in weakly interacting gases (Bose-Einstein Condensates and dilute Fermi degenerate systems), precision measurements of fundamental constants, and the effects of electron correlation on structure and dynamics. Molecular Physics:Molecular physics focuses on multi-atomic structures and their internal and external interactions with matter and light. Molecular physics is the study of the physical properties of molecules and of the chemical bonds between atoms that bind them into molecules. Its most important experimental techniques are the various types of spectroscopy. The field is closely related to atomic physics and overlaps greatly with theoretical chemistry, physical chemistry and chemical physics. Additionally to the electronic excitation states which are known from atoms, molecules are able to rotate and to vibrate. These rotations and vibrations are quantized, there are discrete energy levels. The smallest energy differences exist between different rotational states, therefore pure rotational spectra are in the far infrared region (about 30 - 150 �m wavelength) of the electromagnetical spectrum. Vibrational spectra are in the near infrared (about 1 - 5 �m) and spectra resulting from electronic transitions are mostly in the visible and ultraviolet regions. From measuring rotational and vibrational spectra properties of molecules like the distance between the nuclei can be calculated and vice versa."
