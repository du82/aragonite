full_description = '''This person is a member of the experimental Atomic Molecular and Optical Sciences (AMOS) Group: "Many Particle Momentum Spectroscopy with Synchrotron Radiation and High Harmonic Laserpulses as well as Electron Impact" The key note of my research is the investigation of many (or few, e.g. 2, 3, ..., 10) particle problems in quantum mechanics. Although the explicit motion of particles in and in-between atoms and molecules is not subject of this very well tested and successful theory (instead a probability density function is introduced which obscures the appreciation), it is the correlated dynamics of electrons which for instance is responsible for the formation of Cooper-pairs, e.g. the elements of the fractionate Hall effect and heavy Fermi-particles. However, the main idea or focus is to uncover the entangled motion of electrons in unperturbed atoms, molecules, clusters and surfaces. Or in other words to answer the question: What makes the collective motion in bound many particle systems tick ? Since it is not possible to peer inside an atom, molecule or any other many particle system without altering it, it is very difficult to cotton on to this important question. The fundamental idea is to probe an atom or molecule (or surface) in a manner that preserves most of its internal motion which can be detected in a kinematically complete experiment, e.g. an experiment where all final state momentum vectors of all particles are known with 4 solid angle at best (in most cases without knowledge about the spin). The key value in the description of the dynamics of these complex systems is the three dimensional momentum vector of each particle. Therefore a device is needed that visualizes the trajectories of all particles in the 'explosion' (e.g. ionization or fragmentation) of the target. Once all momentum vectors of the outcome are obtained, highly differential cross sections (triple, quadruple or higher differential in angles and energies) reveal the information of the entangled motion of the particles. The coincident momentum spectroscopy of electrons and recoiling ions, which has been used by the applicant very successfully in the past and which is known as COLd Target Recoil Ion Momentum Spectroscopy COLTRIMS or reactions microscopy (described below), is able to elucidate what is going on here.'''
