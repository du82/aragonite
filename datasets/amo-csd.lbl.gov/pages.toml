["https://amo-csd.lbl.gov/projects.php"]
title = "AMOS Experiment at LBNL"
description = "homepage, document, webpage, page, web, net, amo berkeley, experimental atomic physics at Lawrence Berkeley National Lab: dynamics of atomic and molecular reactions, correlation, photoionization, high harmonics, strong laserfields, synchrotron, free electron laser, momentum spectroscopy, reaction microscope, COLTRIMS"
full_description = "In this section some of the ideas mentioned above shall be seized and explained in little more detail. Visions and hot topics are rendered briefly; technical problems and their possible solutions will be mentioned: In the past the momentum spectroscopy method was used to investigate single photon interaction with small and fundamental atomic and molecular targets (He, H2, N2, CO, C2H2�) in order to study ionization mechanism, Auger electron emission, internal properties and many body problems and so on. There are still many open questions, thus these very successful experiments will be continued in the future; but it is important to extend the studies to bigger and life sustaining molecules or clusters. The first step would represent the fragmentation of water molecules. In the long run it is the dream to ionize a K-shell electron of one atom of a chemical bond (like a DNA molecule) which triggers a confirmation change which can be studied time resolved (see also next paragraph). In order to study a real three body problem the triple ionization of Lithium with synchrotron radiation would be very interesting: Since a single photon couples to only one of the target electrons three body interactions of the final state as well as correlation effects could be studied very well. The ionization mechanisms and correlation effects as well as the three body dynamics are sensitive to the energy of the incoming light. Thus experiments with a broad range in photon wavelengths are highly desirable. However, the cross section for triple ionization is very small and the (multihit-)detection efficiency is not very high either. Therefore a dense target has to be set up. A promising remedy is the combination of a Magnetical Optical Trap (MOT) with a momentum spectrometer. This has been done before in other work groups (Denmark, Michigan and Kansas) but only recoiling ions have been measured so far. Also the fragmentation of heteronuclear molecules is very interesting since CPT violations could be studied nicely using circular polarized light."
