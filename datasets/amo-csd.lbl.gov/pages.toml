["https://amo-csd.lbl.gov/vacancies.php"]
title = "AMOS Experiment at LBNL"
description = "homepage, document, webpage, page, web, net, amo berkeley, experimental atomic physics at Lawrence Berkeley National Lab: dynamics of atomic and molecular reactions, correlation, photoionization, high harmonics, strong laserfields, synchrotron, free electron laser, momentum spectroscopy, reaction microscope, COLTRIMS"
full_description = "The working group does active experimental reseach in atomic molecular and optical sciences (many-particle-momentum-spectroscopy). See for instance our COLTRIMS flyer: COLTRIMS FLYER. There are many exciting tasks in the form of a master/diploma and Ph.D. work, which contain the following fields (or parts of it): What you need to bring: Curiosity, play-instinct, fun against tinkering and improvising, desire on teamwork, interest in the project of the team colleague, the study of physics (see also Physik-studieren-in-Frankfurt.pdf for German diploma students) or chemistry Since there is no University professor directly working in the experimental Atomic Molecular and Optics Science group at LBNL you would have to find an offical supervisor i.e. Professor by yourself. Possible candiadtes are: Prof. Dr. Bill McCurdy (LBNL/UC Berkeley/UC Davis), Prof. Dr. Ann Orel (UC Davis), Prof. Dr. Reinhard Doerner (University of Frankfurt/Germany), Prof. Dr. Joachim Ullrich (Max Planck Institut Heidelberg/Germany), Prof. Dr. Allen Landers (Auburn University/Alabama), or any other Professor who is interested in AMO sciences and willing to support you. Just get in contact with them and tell them about your intention. Note that Dr. Weber is an affiliate professor of the Auburn Physics department and he gladly hosts and supervises summer, bachelor, masters and Ph.D. students. Interested students are encouraged to contact Thorsten directly (Email: Thorsten Weber). Please infer more information from the following columns: [Master or Diploma], [PhD], [Post Doctoral] Already Master or Diploma projects can cover a complete experiment (idea, design, set-up, execution and analysis). Besides this it is however possible to take care of a subproject (like construction, design, set-up and test of existing apparatuses as well as intricate data analysis). Assignments in position sensitive detector and laser techniques are also conceivable. It is even possible to do joint projects with the University of Frankfurt/Germany (Institut-fuer-Kernphysik) or the Auburn University (College of Sciences and Mathematics). A Master or Diploma student has to learn to approach an open scientific question, to do considerations and estimates, to plan and design the apparatus, to operate the system and process the detector signals as well as to read and analyse the data. The student should learn to work independently and as a member of an international team. It is worth while to approach the AMOS group in an early stage of the study in order to get insight into the work and projects and plan the training phase. We are always able to find individual (custom-made) tasks for the applicant."
year_published = 2025
