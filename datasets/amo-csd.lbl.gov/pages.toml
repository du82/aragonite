title = "AMOS Experiment at LBNL"
description = "homepage, document, webpage, page, web, net, amo berkeley, experimental atomic physics at Lawrence Berkeley National Lab: dynamics of atomic and molecular reactions, correlation, photoionization, high harmonics, strong laserfields, synchrotron, free electron laser, momentum spectroscopy, reaction microscope, COLTRIMS"
full_description = 'This person is a member of the experimental Atomic Molecular and Optical Sciences (AMOS) Group: "Many Particle Momentum Spectroscopy with Synchrotron Radiation and High Harmonic Laserpulses as well as Electron Impact" My current research interests are in electron and positron interactions with atoms and molecules. My current and recent projects include the development of a reaction microscope (based on the COLd Target Recoil Ion Momentum COLTRIMS approach) for positron-impact ionisation studies and the investiging the dynamics of dissociative electron attachment to polyatomic molecules, where we measure 3D momentum distributions to determine the dynamics of dissociating molecular ions and reaction intermediates. Purpose of this Web Site: Presentation of information about the member of the experimental Atomic Molecular and Optics Workgroup of the Chemical Sciences Division at LBNL. Exchange of files and folders for scientific related research. Infringement of Industrial Property Rights: If you assume that one of your patent rights is hurt on this website please communicate immediately via electronic mail, so that remedy can be created briskly. Please note: The time and money consuming engagement of a lawyer for issuing a warning liablity does not correspond to my real or presumed will. Area of Resposibility: The impressum is only valid for the following website: http://amo-csd.lbl.gov/DSSlaughter including all subfolders No Liability: The contents of this Web project were carefully examined and provided after best knowledge. But for the information presented here no gurantee for completeness, topicality, quality and correctness can be given. No responsibility for damage can be taken, which results from the confidence on the contents of this Website or their use. Cross-References: In some countries it has been declared by law that one takes complete or part resposibility of Websites one is refering to unless one explicitly forbear from their contents. Therefore I, DANIEL S. SLAUGHTER who is the responsible contact person of this webpage, declare that I never had influence on the formats, contents or links on the Websites I am referring to. They do not represent my opinion.'
