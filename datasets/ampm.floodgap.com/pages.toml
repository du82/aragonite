["https://ampm.floodgap.com/www/1200.htm"]
title = "AMPM's Alpha Micro AM-1200 Series Page @ Floodgap Retrobits"
full_description = '''Despite its improvements over the AM-1000's idiosyncrasies, the AM-1200 is still the rarer unit (I do own two as it happens, but both are currently in varying states of non-operation). For this reason, it is not quite the landmark that the AM-1000 is. Like the AM-1000, the AM-1200 came in several derivative models, including the base 20MB hard drive-equipped AM-1200B, the 35MB AM-1200E and the 70MB AM-1200XP, the latter two having eight additional serial ports; we will illustrate both the vanilla 1200B and the 1200XP, which also has the 5.25" floppy drive option factory-installed (AM-210 FDC on an AM-220 I/O board). Portrait, of the AM-1200XP, but the 1200B is the same. Admittedly, this is where the 64:64C analogy breaks down, since the form factor was intentionally the same and the two units from the outside looked pretty much identical. The front panel, however, is different. The reset button is a more stylish black recessed job, and a disk activity light was added; unlike the AM-1000, the specific variant letter is not stamped on the badge. The floppy drive in the AM-1200 series is the same as the AM-1000, using an AM-210 compatible FD controller, which is on an AM-220 board. Rear ports, first of the AM-1200B. The base 1200B has five serial ports, one of which is a DB-25 (for some reason) and the others being "DB-9" (DE-9), and a single parallel port. The VCR interface is on the right. The bottom right cover plate is for a Centronics-style external interface, which is connected but not in use on this unit. On the AM-1200XP (and AM-1200E), the port layout is the same but eight new ports are added on the lower right. If we slide off the top, we get a look at the mainboard, which is fairly and unsurprisingly similar to the AM-1000 (take my word for it). The elongated DIP at the right next to the open position is the CPU; more about that in a second. This is of the AM-1200XP, but the AM-1200B is almost identical. Click the image for a 132K enlargement in a new window.'''
year_published = 2025
clearnet = "https://ampm.floodgap.com/www/1200.htm"
