["https://ampm.floodgap.com/www/e300.htm"]
title = "AMPM's Alpha Micro Eagle 300 Page @ Floodgap Retrobits"
full_description = '''The Eagle 300 is the first of the line, making it a landmark model. In addition to its other evolutionary hardware features, the '030 CPU is a big plus and gives great processing oomph -- especially since AMOS works so efficiently even on the lowliest 68000. You can imagine that this box screams by comparison to an AM-1000. These are pictures of the very E300 that is serving you this very page. It used to be a point of care system for a party store many moons ago, and was a chance find on eBay. It is the first fully functional Alpha Micro system I ever owned personally. For a successor to this design, see the Eagle 100 page. For an even beefier Eagle, see the Eagle 450 page. Front of the unit as I first acquired it. Notice that it resembles an oversized PC tower case, but it has no 3.5" bays (instead it has four 5.25"). The AM-626 tape streamer (actually a Tandberg 3820) and 2GB Seagate Hawk ST31051N drive were factory-installed. The AM-626 takes standard QIC-525 cartridges. It is unusual given when this particular Eagle was manufactured (1997) that a CD-ROM was not standard equipment ... ... but an external one can be connected easily to the rear SCSI port, and in fact I later installed an Alpha Micro-branded external Toshiba XM-5401B CD-ROM drive (picture at the end), and replaced the AM-626 with an AM-628 (Tandberg 4200) so I could use 2GB cartridges. There is also an RJ-45 Ethernet port (available also as an AUI port, but they are the same interface), two DB-25 parallel ports, and "eight slots" (actually four, more in a moment). This unit has 16 serial ports installed. There is also a second fan but I did not see this in the E100; presumably this is due to the split board design (see below). You can't see it here, but the official model number is AM-3500-E300; all Eagles that I have seen are officially "AM-3500" series models. Inside view, showing the AM-319 I/O sideboard and the AM-172 CPU motherboard. This dual board design is probably why there are two fans. The AM-172 motherboard has several chips of note; the large black one with trim closest to the bottom left corner is the 68EC030, and the chip behind it is the Symbios Logic 53C710 SCSI controller. The board copyright is 1993. Click the picture for a larger, different angle (150K).'''
