["https://ampm.floodgap.com/www/1000.htm"]
title = "AMPM's Alpha Micro AM-1000 Series Page @ Floodgap Retrobits"
full_description = '''This is the original model Alpha Micro 1000 main unit and housing, with the optional 5.25" floppy, and standard 10MB internal hard disk. Although Alpha Micro refers to it as "lightweight" this should only be interpreted in comparison with Alpha Micro's other boxes; this case is fairly thick steel and kicking it is likely to damage your foot. No crapola mini-tower construction, this. Rear ports. Three DB-25 serial ports are at the top left, with the five video control and data lines above the cooling fan, and four additional serial ports provided by an AM-336 on the right with an external SASI interface (more on that in a bit) below them. No AM-1000 series unit I have encountered has a serial number on its backplate (compare with the AM-1200 and the AM-1001 below), and the back is a black enamel colour instead of the typical brushed metal. Unscrewing the side screws, removing the top and removing the top row of screws on the rear enables the motherboard to lift up like this. The 68000 CPU is the very large chip left of centre. A daughterboard connects to the top right. Internal view. The AM-336 serial card and ports are at lower right with a ribbon cable connecting them to the mainboard. From left to right, the other boards are the AM-213 floppy drive controller (sitting on the power supply), the 800K 5.25" mech itself, and the SASI hard disk. And, finally, the front panel. When started up, POST codes flash on the LED (more about that in the Potpourri section), culminating in 'b' which indicates the system has passed POST and is looking for a bootable system on the floppy or HD. The 'b' disappears when booting is in progress: see Potpourri below for important notes on testing these units out! This unit appears to be in mostly working order, but I haven't finished fully restoring and testing it. It seems to fail a few things on the built-in self test but does find and load a system image on the main disk with no obvious errors. More on that when I get it cleaned fully and hooked up to its own terminal.'''
