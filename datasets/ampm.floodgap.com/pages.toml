["https://ampm.floodgap.com/www/e100.htm"]
title = "AMPM's Alpha Micro Eagle 100 Series Page @ Floodgap Retrobits"
full_description = '''Like any AM system, you should take especial care to make sure that the units you buy on the used market have all the devices and options you want already installed. That goes double for things like the Eagle 100 where the good stuff like Ethernet was not factory-installed in the base model, and this is a big reason why the E300 is doing work in my server rack and the E100 sat inert in my project area. I have since acquired an Ethernet card for it and a second unit I intend to use for experiments. The Eagle 100 came in a series of special market models (the pictures below are of the base eight-port, one-slot, Ethernet-less Eagle 100); these models include the 100LC, which had only four ports and lacked any slot expansion of any kind; the 100TX, a pure terminal server with Flash AMOS and no disk; the 100NX, which had Ethernet but no slot either and also only four ports; and the 100MX, with Flash AMOS but a disk option and Ethernet. These special versions never found wide distribution and most Eagle 100s you will encounter will be variations on the base model below. Unit portrait. Like the E300, the E100 is essentially stuffed into a PC minitower case, the same case used in other systems like the E450, with a standard mix of 3.5" and 5.25" bays of the day (this unit was manufactured in 2000). The AM-626 tape streamer (Tandberg 3820) was factory-installed and takes standard QIC-525 cartridges. The backplate of the E100 is nearly identical to the E300, except that the AUI and 10bT Ethernet punchouts are blocked, and there is only one parallel port. There is external SCSI (with terminator) and the AUI Ethernet punchout is below that (the circle is where the 10bT jack would have been, and the boot DIP switches are below the circle). You can't see it here, but the official model number is AM-3500-E100; all Eagles that I have seen are officially "AM-3500" series models. The extra punchouts below the eight serial ports are for additional serial ports if you have the single expansion slot occupied with a serial card. I put the arrow on the case so I could remember where the console was.'''
year_published = 2025
