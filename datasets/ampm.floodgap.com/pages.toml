["https://ampm.floodgap.com/www/amos.htm"]
title = "AMPM's Primer to AMOS @ Floodgap Retrobits"
full_description = '''This document talks about some of the basics with starting up, setting up, using, administering and shutting down the typical AMOS-based system. By typical, I mean specifically AMOS/32, the most common version, which runs on the majority of 68K-based Alpha Micro systems; despite this, however, this document is still largely applicable to AMOS/L and the oldest S-100 WD-16 systems (less so for the most current Windows XP/EAMOS systems, which are well-documented and have their own unique characteristics). Note that this document does not cover complex administration tasks, nor does it cover the entire length and breadth of the AMOS command set, nor does it cover tools such as VUE and MULTI in anything but an elemental sense. This document assumes you have some working knowledge of use and basic administration of a multi-user system such as Windows NT/Windows Server or a Unix or Un*x derivative operating system. AMOS has some unusual features for an operating system. One of the most unusual is that the 68K, a big-endian chip, is run effectively in little-endian mode due to bus line swaps needed for preserving data file compatibility with the WD-16 systems. Although the kernel (called the "monitor") preemptively multitasks, AMOS is also a strictly real-memory operating system: it does not use an MMU, nor does it require one. Memory is partitioned into fixed segments and programs are expected to be relocatable to whatever address they are loaded without any patching. Programs can also be marked as "reentrant" and/or "reusable," i.e., respectively, that their memory image(s) can be run simultaneously by multiple users without interference, and/or that the image can be held and called again with the expectation it can self-initialize without being explicitly reloaded. On the Alpha Micro DB-9 side, this is the wiring schedule (with 8P8C colours) for RJ-45 female to 25-pin RS-232 DB-9 (DE-9) male. Both the DB-9 (DE-9) and DB-25 modular converters can easily be found at places like Fry's for a few bucks. Colours refer to the wires within the adaptor. In this orientation, the female RJ-45 "lock snag" is at the bottom with line 1 on the left, and the male DB-9 (DE-9) has pin positions 1-5 on the top row with pin 1 on the left.'''
year_published = 2025
clearnet = "https://ampm.floodgap.com/www/amos.htm"
