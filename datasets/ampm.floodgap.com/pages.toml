["https://ampm.floodgap.com/www/s100.htm"]
title = "AMPM's Alpha Micro S-100 Page @ Floodgap Retrobits"
full_description = "Since most of the S-100 systems are largely minor variations on a theme, I have chosen to subsume them all into this grab-bag page. Most AM S-100 boards are fairly vanilla technically except for the AM-100 itself, which uses some of the S-100 lines for DMA and many not be generally compatible with later systems. For that matter, while most of the other cards are properly bus-compatible, they may not be case-compatible: some of these cards are quite large and may not fit in anything other than a real Alpha Micro card cage. This is an AM-1041, a fairly typical S-100 system, although it appears to have been upgraded to what is effectively an AM-1042 (I'll discuss the difference in a moment). It comes as two large, heavy! rackmount boxes; I purchased it from a collector (hi, Bob!) which was in fact the first such unit I have seen on eBay in close to a decade. The bottom is the disk box. Both the top and bottom boxes have the reset button, status window and power keyswitch, which I don't have keys for; the reset button is not connected in the disk box. The left slot goes to a really rusted out tape drive, and the 32MB Winchester hard disk is in the middle. Rear ports. The S-100 card box has a staggering full 16 ports, the maximum for this form factor, and all of them are active. The disk box is exactly the same except the (obviously) non-functional ports are blocked off. Inside the disk box. This drive was a fairly lately manufactured Winchester-type drive, with an installation date of 1987. The tape streamer and hard disk are under the same cage. Back to the card box now. There are six cards installed in the AM-919 motherboard in this unit, two visible here; from front to back, they are an AM-710 memory board, an AM-100/L 68000 CPU board, an AM-500 hard disk controller and three AM-300 serial boards. The AM-300 serves a whopping six serial channels, so three gives us eighteen potential ports, of which the backplane has only room for the 16 we saw! As for the AM-500, it's a fairly straight-forward DMA-based HAWK HDC with a Zilog Z80 CPU."
year_published = 2025
