["https://ampm.floodgap.com/www/e450.htm"]
title = "AMPM's Alpha Micro Eagle 450 Page @ Floodgap Retrobits"
full_description = '''Probably the most notable of these unusual architectural attributes is the choice of CPU: the E450 and descendants are based on the Motorola ColdFire, though using the "bridge" MCF5102, which maintains full compatibility with 68K code and in this implementation looks like a regular 68040 to application software. (This isn't an accident: the MCF5102 started life as the 68040VL.) The OS does need to be patched for ColdFire support, however, which is why only 2.3A is supported on these machines. The '040 core in the MCF5102 is slightly lower performance at the same clockspeed as a regular '040, so it is not faster than the bigger 40MHz 68040 or the 68060 machines (and it only runs at 33MHz). On the other hand, it's lower power, lower cost and lower temperature, all of which are advantageous in these smaller systems. The E450 was the first Alpha Micro system with this architecture and one of the earliest ColdFire systems extant. The E450 also introduces 68-pin SCSI-3 for substantially faster I/O throughput, as the benchmark below demonstrates. This is the fastest Alpha Micro in my collection, easily eclipsing the E300 serving this page and its lower-cost descendant E100, and was a generous donation from Douglas Peelle (thanks, Doug!). It used to work in a 9-1-1 dispatch center but now is my test machine and acts as hardware backup for the E300. I'll talk briefly about how I broke into it as an educational aid to other people who might find one of these blue-collar machines in the wild. For more commentary on the Eagle machine line, see the Eagle 100 page and its ancestor Eagle 300 page. As it arrived to my lab after I did a bit of cleaning up. The DAT was factory installed and is supported directly by AMOS. It is in the standard PC mini-tower case Alpha Micro was using around this time, including for the E100. The backplate of the unit, however, is very different from the E100/E300. The power supply is mounted sideways and there is a second cooling fan for the drive bays up top. It has connectors for Ethernet (the AUI is blocked off), parallel, UPS monitoring (old school DB-9) and the factory-installed 8 RJ-45 terminal serial ports. The external SCSI connector is 68-pin instead of 50-pin and wired directly into the bus. There are also no boot DIP switches like there are on the E100/E300 because boot options are set in CMOS (see below).'''
year_published = 2025
clearnet = "https://ampm.floodgap.com/www/e450.htm"
