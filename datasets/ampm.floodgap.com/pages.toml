["https://ampm.floodgap.com/www/links.htm"]
title = "AMPM's Alpha Micro Links and Resources @ Floodgap Retrobits"
full_description = '''Jump to: Official Resources | User Groups and SIGs | Other General Sites | Software Vendors | Hardware Vendors and VARs The official Alpha Microsystems home page. I don't know if anyone's on the other end, and the site has been "under construction" for a long time, but if anyone's taking orders they'd be here. A massive collection of product announcements, data sheets, hardware and product manuals and even some third-party support stuff. Worth mining even if you have an old unsupported system as there are quite a few legacy items mixed in, and even a fair bit of the new hardware and software documentation is still broadly applicable. AMUS at one time was one of the biggest, most important user support groups for AM owners. Consultant and president Jeff Kreider informed me that he was considering options for resurrection, but the domain name is up for sale, so I consider AMUS defunct. I have posted what I have of the AMUS Network Library to our Gopher server; see the Downloads page. This is not only a very useful and interesting emulator, but Mike also helpfully offers AM-100 AMOS ready to go and a nice stack of documentation files. VAM is in fact the only Alpha Micro-approved emulator available. I am a regular exhibitor at the Bay Area Vintage Computer Festival, and a couple of years an AM-1000 turned up with two terminals to play with, owned by Bob Fowler. Among other commercial offerings (and being the current vendors of COOL.STF's venerable ZTERM terminal emulator for Windows), MicroSabio offers the inventive A-Shell package which acts like an AMOS simulator: a collection of standard commands, VUE, even the dot prompt, and a full implementation of the AlphaBASIC compiler and runtime. This means you can take your legacy software with you to a modern operating system without rewriting it from scratch. A-Shell runs on Windows, AIX and Linux/x86 (with packages for Red Hat and CentOS). VPSi offers their commercial VersiCOMM-Plus AMOS serial communications package to use your AMOS system as a terminal itself, and Z/Archive, a commercial archiving and compression utility that generates self-extracting archives.'''
year_published = 2025
