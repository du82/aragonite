["https://ampm.floodgap.com/www/downld.htm"]
title = "AMPM's AMOS Freeware Downloads @ Floodgap Retrobits"
full_description = "To the best of my knowledge, these programs and packages are freely distributable. If you can assert otherwise, please contact me at ckaiser@floodgap.com. GAMBLE's home is, of course, on the main Gopher server. If you don't have a Gopher client for your desktop system, try a Firefox extension or using our helpful proxy. Most of you will want ANSI.TDV, which is the one I also use primarily, or possibly VT100.TDV. KAISER.TDV is my customized terminal driver, born of necessity when I originally discovered in horror that there was no support for VT100 compatible terminals in AlphaTCP 1.3. Although the others work better in most cases, it might be useful if you need to hardcode a terminal size. I use all of these with Mac OS X Terminal and they work great, but they also work with PuTTY and should work fine with most xterms. To install, copy the .TDV driver(s) you want to use into DVR:. If the TDVDEF line in AMOS32.INI does not load all drivers (i.e., if it's not TDVDEF *), add the new one(s) to the TDVDEF line and check it with MONTST. Either way, you will need to reboot after the TDV is installed. You can then Telnet to your machine and select ansi, vt100 or kaiser as the terminal type, depending on which one(s) you've installed. KAISER.TDV expects an 80x40 window since this is the normal size I work in. If you want to change this, edit byte offset $000e-f and change the bytes $28 $50 to your desired rows and columns respectively. I have not tried this driver with a real VT100-compatible serial terminal connected to one of the serial ports, but if you do, please let me know how it works. At some point some wag is going to ask how you get Kermit itself onto the Alpha Micro, to which I can only suggest careful prayer. Jokes aside, you might be able to get the source code on there with a simple text transfer ... Like most versions of Kermit, Alpha-KERMIT is freely distributable. I have provided the source for M68 but you do not need the source code to run the program. It will run on just about any Alpha Micro system, even an AM-1000 running AMOS/L 1.2. (1.3D or up is needed for assembly from scratch.)"
