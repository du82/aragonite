["https://ampm.floodgap.com"]
title = "ampm.floodgap.com - The Alpha Micro Phun Machine @ Floodgap Retrobits"
full_description = "I gratefully appreciate and acknowledge the help of Sellam Ismail, Michael Roach, Mike Noel, Steven Lawson, Jeff Kreider and Rod Hewitt for their contributions to this site, and in particular Bob Fowler for his generous donation of time, access to his documents archive, and software. Send me your comments and remembrances at ckaiser@floodgap.com. -- Cameron Kaiser Although modern Alpha Micros are essentially customized commodity PCs and bear little hardware resemblance to their ancestors, they continue to offer backwards compatibility and high performance running the newest AMOS and a wide range of business-critical applications even today. Despite its impressive performance, Western Digital did not believe there was much future in Wilcox's little project and allowed him to buy the chips and sell it himself; thus was Alpha Micro formed, with the help of investor Bob Hitchcock, to expand and capitalize upon Wilcox's design. Developing in Wilcox's garage with Glade and fellow engineers Rich Notari and John French, the engineers turned Wilcox's original five-chip set into the S-100 based AM-100, a two-card CPU that could then be connected to any variety of S-100 cards with an initial addressing limit of 64K, expandable in 16K banks later. To drive their hardware, Wilcox took his previous operating system project and turned it into AMOS, with its strong DEC influence intact. For user applications, Alpha Microsystems wrote their own BASIC compiler and included it with the operating system, with assembly-written native applications also supported. (The similarities with DEC's operating systems, particularly TOPS-10, were not lost on Digital Equipment Corporation and they did eventually haul Alpha Micro into court in an ultimately unsuccessful lawsuit.) Although popular as a small multiprocess server and poor man's mini, the WD-16 was a limiting architecture and Alpha Microsystems switched to the Motorola 68000 for their next generation. Executable incompatibility being bad enough, Alpha Micro did not want to alienate users with the 68000's native byte ordering also making their data files incompatible and swapped CPU and address lines to allow them to transfer unchanged; various custom assembler features were also employed to aid in the transition. First released as a CPU board for their S-100 systems (which they also expanded to 16-bits using a proprietary mechanism), the 68000-based AM-100/L used the new AMOS/L operating system, which was rewritten for the new architecture."
year_published = 2025
