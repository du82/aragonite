full_description = "A book about how to make next-generation public services a reality Buy from London Publishing Partnership Buy from Amazon The word 'seminal' came to mind when reading this book. While, as a non-native speaker, I had to look it up to be sure, it is exactly the right word for Richard Pope's book: one that 'will strongly influence later developments'. The book is also simply a joy to read, being both practical and philosophical at once. Siim Sikkut Managing Partner at Digital Nation / former Government CIO of Estonia A resourceful, well-evidenced and easy-to-read guide applying state-of-the-art design thinking to digital public service, based on a deep knowledge of the technically possible, and all without ever ­losing sight of the ‘public’ bit: that citizens should expect simplicity, efficiency and empathy in their interactions with government Morgan Currie Senior Lecturer in Data and Society, University of Edinburgh Clear, concise and full of solid examples – this book will really help policymakers understand how to improve the use of technology in public services. No prior specialist knowledge is needed to understand the wealth of good advice in this book. Richard Allan Baron Allan of Hallam Anyone involved in the reform of public services must read Platformland. Must, not should. This extraordinary book represents a quantum leap in thinking around public service reform. I cannot recommend it highly enough Tom Loosemore Partner, Public Digital What Richard Pope has achieved in Platformland is quite simply extraordinary. A lyrical call to restore humanity to the centre of public service design and delivery – a call that must be heeded by governments if we are to solve some of the huge societal issues we face. Emer Coleman former Deputy Director Government Digital Service, and architect of the London Datastore For decision makers the question should not be ‘Have your read Platformland?’: it should be ‘Why haven’t you read it yet?’ Theo Blackwell MBE Chief Digital Officer for London About the book The aim of most public sector digitization programmes is the status quo, delivered more cheaply. Rather than saving the public from bureaucracy, digital has created new administrative burdens. The public are engaged as consumers in a way that misunderstands the nature of what makes public services public. Instead of digital being recognised as critical to the operation of a modern state, it is too often an afterthought. It’s time to share the benefits of digital with the public more fully. This book describes the types of interaction we should expect from the next generation of public services, the digital platforms and infrastructure they will be built with, and the public sector design values needed to make them a reality. It includes thirty illustrated design patterns, ten strategic interventions, and global examples of emerging patterns in digital government. It also highlights some foundational ideas in computer science, design and public policy to show how the challenges posed by the digital state are neither novel nor new. The book will enable more policy professionals to think like technologists and designers, and it will help more technologists and designers to think about public policy. About the author Richard Pope was part of the founding team of the UK Government Digital Service and the first product manager for GOV.UK. He created many of the initial design concepts for both GOV.UK and the digital account for Universal Credit (the UK’s social security service). He was a senior fellow at Harvard in 2018/2019, researching and lecturing on ‘Government as a Platform’."
