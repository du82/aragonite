%2Fswitch%2Fsearch%2Fswitch-step-3-update.svg&amp;w=256&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Keep creatingUpload new audio or video episodes here. Spotify for Creators is the only hosting platform that supports both formats.Switch to the platform that has it allUnlock full access to video on Spotify, RSS distribution, 24/7 creator support, and monetization in select markets. Plus, get proprietary tools to connect with fans, track your performance, and stand out on Spotify — all in one place, all for free.Switch nowCome for the free hosting, stay for all the perks<img srcSet="/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fmonetize-update.cbeb9b33.webp&amp;w=1200&amp;q=75 1x, /_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fmonetize-update.cbeb9b33.webp&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fmonetize-update.cbeb9b33.webp&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Get paid for your passion Explore ads, fan support options, and more ways to monetize your show, no matter what size your audience is. Plus, get free episode uploads and storage.<img srcSet="/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fvideo.d07e71de.jpg&amp;w=1200&amp;q=75 1x, /_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fvideo.d07e71de.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fvideo.d07e71de.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Full access to video on SpotifyGet the power to schedule and monetize your videos on Spotify, and publish audio versions everywhere you have RSS distribution. See how video can boost your engagement and audience retention on Spotify.<img srcSet="/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fanalytics.f76aa00d.jpg&amp;w=1200&amp;q=75 1x, /_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fanalytics.f76aa00d.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fanalytics.f76aa00d.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Better insights, better engagementGet detailed stats on episode retention and demographics. Find out where on Spotify you’re being discovered with impression analytics. And manage it all from one comprehensive dashboard.Switch nowBrand LogoCompanyAboutPress & MediaCareersContact UsFine printLegalPrivacy CenterPrivacy PolicyCookiesCreator toolsHelp CenterMegaphoneSpotify for ArtistsFindaway VoicesFollow usGet the app<img alt="Apple Store badge" srcSet="/_next/image?url=%2Fimages%2Fmarketing-pages%2Ffooter%2Fapp-badges%2Fapple%2Fen%2Fapp-store-badge.svg&amp;w=256&amp;q=75 1x, /_next/image?url=%2Fimages%2Fmarketing-pages%2Ffooter%2Fapp-badges%2Fapple%2Fen%2Fapp-store-badge.svg&amp;w=640&amp;q=75 2x" src="/_next/image?url=%2Fimages%2Fmarketing-pages%2Ffooter%2Fapp-badges%2Fapple%2Fen%2Fapp-store-badge.svg&amp;w=640&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="Google Play badge" src