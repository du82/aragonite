840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="Rohbau Schäferwagen" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F73f8ad62-56e3-414f-bb7d-18a9626dafe4_20220105_112202.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C512%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=1200&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F73f8ad62-56e3-414f-bb7d-18a9626dafe4_20220105_112202.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C512%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F73f8ad62-56e3-414f-bb7d-18a9626dafe4_20220105_112202.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C512%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="Schäferwagen in der Produktion" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F1fcf0eb0-3287-4dae-a6c5-a002dcf8cdbd_20220103_211419.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D464%2C0%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=1200&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F1fcf0eb0-3287-4dae-a6c5-a002dcf8cdbd_20220103_211419.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D464%2C0%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F1fcf0eb0-3287-4dae-a6c5-a002dcf8cdbd_20220103_211419.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D464%2C0%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="Stauraum im Schäferwagen" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F6939dfd3-e565-452b-9e1c-68774c569253_20220206_010225.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C143%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=1200&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F6939dfd3-e565-452b-9e1c-68774c569253_20220206_010225.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C143%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F6939dfd3-e565-452b-9e1c-68774c569253_20220206_010225.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C143%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="Animation wie sich die Türen des Schäferwagens schließen" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2Fd89a010b-0db2-4141-8141-13ac5fd920c7_IMG-20220219-WA0044-Kopie.gif%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2Fd89a010b-0db2-4141-8141-13ac5fd920c7_IMG-20220219-WA0044-Kopie.gif%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2Fd89a010b-0db2-4141-8141-13ac5fd920c7_IMG-20220219-WA0044-Kopie.gif%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Durchdacht bis ins DetailZweigeteilte Tür an der Rückseite des WagensAnders als beim traditionellen Schäferwagen befindet sich die zweigeteilte Tür an der Rückseite des Wagens. Der große Vorteil dabei ist, dass ein großer Dachvorsprung über der Tür möglich ist, ohne den Luftwiederstand des Wagens negativ zu beeinflussen.Außerdem wird dadurch der Bereich vor der Türe als Außencampingbereich nutzbar, ohne Einschränkung der Bewegungsfreiheit durch die Zugdeichsel. Um einen bequemen Einstieg zu ermöglichen und die Optik zu perfektionieren, haben wir uns etwas ganz Besonderes einfallen lassen.Die Beleuchtungsanlage verschwindet durch das herunterklappen der Eingangsplattform vollständig.<img alt="Schäferwagen in der Produktion" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F1fcf0eb0-3287-4dae-a6c5-a002dcf8cdbd_20220103_211419.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 1x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F1fcf0eb0-3287-4dae-a6c5-a002dcf8cdbd_20220103_211419.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Optimale BauweiseStabilität bei geringem GewichtDie Sandwichbauweise vereint enorme Stabilität und optimale Wärmedämmung bei geringem Gewicht. Das feuerverzinkte Fahrgestell haben wir speziell für diesen Wagen konstruiert und angefertigt. Die gefederte Achse samt Zugeinrichtung eines namhaften deutschen Herstellers in Verbindung mit Stoßdämpfern ermöglichen die Zulassung bis 100 km/h. Individuelle Trägersysteme ermöglichen den bequemen Transport von Fahrrädern bis hin zum Motorrad. Individuelle GestaltungsmöglichkeitenVom Ausbauwagen bis zum vollausgestatteten Schäferwagen „Schwarzwaldwagen“ ist alles möglich. Jetzt Details anfragen<img alt="Der Schwarzwaldwagen" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F495f0c18-2050-4da6-938f-abca4abf81ae_IMG-20220219-WA0042.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F495f0c18-2050-4da6-938f-abca4abf81ae_IMG-20220219-WA0042.jpg%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F495f0c18-2050-4da6-938f-abca4abf81ae_IMG-20220219-WA0042.jpg%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Unsere Modelle"Schwarzwaldwagen"Der „Schwarzwaldwagen“ ist das Flaggschiff unserer verschiedenen Modelle. Der Wagen ist komplett ausgebaut und autark. Somit ist auch eine längere Standzeit ohne Stromanschluss kein Problem. Der sehr geräumige Innenraum besticht durch seine gemütlich-rustikale Optik, und bietet dennoch alles was zum komfortablen Reisen nötig ist. <img alt="Stauraum im Schäferwagen" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F030e9839-327a-4445-96a8-cf4c0d6585d4_20220211_223413.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D299%2C0%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=1200&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F030e9839-327a-4445-96a8-cf4c0d6585d4_20220211_223413.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D299%2C0%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F030e9839-327a-4445-96a8-cf4c0d6585d4_20220211_223413.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D299%2C0%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>StauraumViel Platz und Stauraum bietet der Wagen sowohl im Innenraum als auch in dem von außen zugänglichen Staufach.<img alt="Stromversorgung im Schäferwagen" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2Feedb16ee-7cbb-4b3e-98b0-bf715ef5d4ec_20220205_145052.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D299%2C0%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=1200&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2Feedb16ee-7cbb-4b3e-98b0-bf715ef5d4ec_20220205_145052.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D299%2C0%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2Feedb16ee-7cbb-4b3e-98b0-bf715ef5d4ec_20220205_145052.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D299%2C0%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Eigene StromversorgungDer Schwarzwaldwagen verfügt über eine Solaranlage, in Verbindung mit Speicherbatterien und Spannungswandler, und hat somit eine eigene Versorgung mit 12 V und 220 V.<img alt="Gasanlage im Schäferwagen" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2Fab9c8cdf-330d-4add-a204-e1f59bbfc2c9_20220205_145044.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C301%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=1200&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2Fab9c8cdf-330d-4add-a204-e1f59bbfc2c9_20220205_145044.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C301%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2Fab9c8cdf-330d-4add-a204-e1f59bbfc2c9_20220205_145044.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C301%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>GasanlageAußerdem ist eine geprüfte Gasanlage verbaut, über diese werden Heizung, Kochfeld und eine Gasaußensteckdose betrieben.Der Schwarzwaldwagen im Überblick:Maße innen: 3,40 m x 2,00 m x 2,15 mLeergewicht nur 1500 kg, bei einem zulässigen Gesamtgewicht von 1900 kg.Straßenzulassung mit 100 km/hSolaranlage, Speicherbatterien und Spannungswandler 12V / 220V.Geprüfte Gasanlage, für Heizung, Kochfeld und Gasaußensteckdose.Gas-Heizung TRUMA platzsparend unter der Bank verbaut.Küchenzeile bestehend aus 2-Flammenherd und Spülbecken mit fließend Wasser durch 12V Pumpe, Frisch- und Abwasserkanister unter der Spüle. Sparsamer Kompressor-kühlschrank mit Gefrierfach und Kältespeicher.Camping-WC nicht sichtbar im Schrank integriertSitzgruppe für 4 Personen, kann mit wenigen Handgriffen zum Gästebett 120 x 200 m umgebaut werdenSchlafplatz 120 x 200 cmSprossenfenster mit FensterlädenZweigeteilte EingangstürRobustes Blechdach aus TitanzinkGroßes Staufach außenBeleuchtungsanlage klappbarBeim Schwarzwaldwagen mit hier beschriebener Vollausstattung beläuft sich der Kaufpreis auf ca. 30.000 €.Mach dir selbst ein BildMiete den SchwarzwaldwagenDu möchtest den Schwarzwaldwagen testen, oder einfach nur ein paar schöne Tage in der Natur erleben, dann bist du hier genau richtig. Auch auf jedem Campingplatz bist du ein echter Hingucker. Um dich und den Wagen optimal abzusichern, kannst du den Wagen über paulcamper.de mieten oder mit uns Kontakt aufnehmenSchreib Uns<img alt="Schäferwagen in der Produktion" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F342d835f-16b3-432c-886c-b996bab6431c_20220103_140222.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 1x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F342d835f-16b3-432c-886c-b996bab6431c_20220103_140222.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Unsere ModelleSchäferwagen zum SelberausbauenDer Schäferwagen zum Selberausbauen von Anders on Tour ist die perfekte Möglichkeit deiner Kreativität freien Lauf zu lassen und deine eigenen Ideen zu verwirklichen. Der Schäferwagen zum Selberausbauen ist äußerlich komplett (Fahrgestell und Aufbau) inkl. F'
