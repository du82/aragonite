full_description = 'MenüDer SchäferwagenÜber UnsKontaktZusammen starkDas Team hinter Anders on Tour<img alt="Zimmermann Joni Anderson bei der Arbeit" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F69eccf35-f7ff-4961-a0a8-3e7698799c09_20220211_163713.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C324%2C1800%2C1200%26w%3D1800%26h%3D1200&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F69eccf35-f7ff-4961-a0a8-3e7698799c09_20220211_163713.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C324%2C1800%2C1200%26w%3D1800%26h%3D1200&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F69eccf35-f7ff-4961-a0a8-3e7698799c09_20220211_163713.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C324%2C1800%2C1200%26w%3D1800%26h%3D1200&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Joni AndersonZimmermann seit dem 16. Lebensjahr, mit Montagebau im Nebenerwerb, und Erfahrungen in den Bereichen Elektrik und Metallbearbeitung, durch das restaurieren alter Fahrzeuge mit meinem Vater. <img alt="Linda Anderson beim Streichen des Wagens" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F2075edae-192a-4633-87a8-8154cf2d992b_20220114_004243.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C218%2C1800%2C1200%26w%3D1800%26h%3D1200&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F2075edae-192a-4633-87a8-8154cf2d992b_20220114_004243.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C218%2C1800%2C1200%26w%3D1800%26h%3D1200&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F2075edae-192a-4633-87a8-8154cf2d992b_20220114_004243.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C218%2C1800%2C1200%26w%3D1800%26h%3D1200&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Linda AndersonGelernte Kauffrau für Büromanagement, kümmert sich um alles rund ums Büro, Verkauf und Vermietung. Darüber hinaus unterstützt sie tatkräftig die Produktion, und hat ein großes Talent für Farbe und Anstriche.Kim KröningIst gelernter Klempner und Blechbearbeitung ist sein Element! Durch seine langjährige Erfahrung in vielen handwerklichen Bereichen ist er für unsere Produktion unverzichtbar und ist von Anfang bis Ende dabei.Michael AndersonGelernter Kfz Mechaniker-Meister und handwerkliches Allround-Talent in vielen Bereichen. Mit seinem kritischen Auge sorgt er dafür, dass Qualität und Sicherheit immer auf dem höchsten Stand sind. Renate und Jessica AndersonUnterstützen bei Farbe und Finish und überall wo’s nötig ist. Darüber hinaus sorgen sie dafür, dass es dem Team an nichts fehlt.Große Unterstützung erhalten wir von Peter Kuhn, dem Geschäftsführer und Inhaber von ORMOCAR Reisemobile, der uns großzügig seine technischen Möglichkeiten und sein Fachwissen zur Verfügung stellt. <img alt="Zimmermann Joni Anderson bei der Arbeit" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F69eccf35-f7ff-4961-a0a8-3e7698799c09_20220211_163713.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F69eccf35-f7ff-4961-a0a8-3e7698799c09_20220211_163713.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F69eccf35-f7ff-4961-a0a8-3e7698799c09_20220211_163713.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Der Weg zum WagenMit 16 Jahren habe ich angefangen einen ausgebrannten Bauwagen von Grund auf neu aufzubauen, um damit auf Schleppertreffen und in den Urlaub zu fahren. Schon damals war mir Funktionalität und eine stimmige Optik sehr wichtig. Es entstand der Wunsch eines Tages einen Wagen in Schäferwagenoptik zu bauen mit dem man auch weitere Strecken bequem zurücklegen kann. Vorerst blieb es bei dem Wunsch, da mir das passende Team und der nötige Platz fehlte. Durch meine Frau Linda lernte ich Peter kennen, der Geschäftsführer und Inhaber von ORMOCAR, ein Premium-Hersteller von Reisemobilen. Dadurch entstanden nun neue Möglichkeiten und mein Wunsch Schäferwagen zu bauen, den mittlerweile auch Linda teilte, flammte wieder von neuem auf. Mit der Langzeiterfahrung von meinem ersten Wagen und der langjährigen Berufserfahrung als Zimmermann, in Verbindung mit den technischen Möglichkeiten von Peter und der Unterstützung meiner Familie, nahm ich nun die Planung auf. Stück für Stück fügten sich die Ideen wie Puzzleteile zusammenEs entstand ein durchdachter und funktioneller Wagen mit toller Optik. Als ich in dieser Zeit Kim – der von Beruf Bauflaschner und mittlerweile wichtiger Bestandteil in unserem Team ist – kennenlernte, war auch das runde Blechdach kein Problem mehr. So begannen wir mit der Umsetzung und bauten unseren ersten Schäferwagen. Das funktionierte aufgrund der sorgfältigen Planung viel besser als gedacht, und wurde zu einem vollen Erfolg. Dieser Wagen legte den Grundstein für Anders on Tour.info@andersontour.deWasenstr. 5675382 OttenbronnDer SchäferwagenÜber UnsKontaktImpressum'
