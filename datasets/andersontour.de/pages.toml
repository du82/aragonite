7953f5117_bike.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>So individuell wie duUnser SchäferwagenAngelehnt an die stimmige Optik eines traditionellen Schäferwagens, haben wir einen funktionellen Campingwagen geschaffen, der den modernen Anforderungen von heute gerecht wird.Jetzt Details anfragen<img alt="Geschäftsführer Joni bei der Arbeit" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F2fa96623-ddf7-40bd-8cb4-e1a6b856e212_20210607_205733.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 1x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F2fa96623-ddf7-40bd-8cb4-e1a6b856e212_20210607_205733.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Das macht uns ausQualität durch echte HandarbeitQualität, Stabilität und Langlebigkeit ist uns sehr wichtig. Deshalb setzen wir auf Handarbeit und vereinen dabei traditionelle Handwerkskunst und moderne Technik.<img alt="Schäferwagen in der Produktion" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F1fcf0eb0-3287-4dae-a6c5-a002dcf8cdbd_20220103_211419.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 1x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F1fcf0eb0-3287-4dae-a6c5-a002dcf8cdbd_20220103_211419.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Was uns wichtig istGenau für dich gemachtMit technischem Verständnis und Liebe zum Detail kannst du mit uns deinen Traum vom Schäferwagen verwirklichen. <img alt="Sonnenuntergang" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F0803886e-c4ba-44db-b310-83d2b1cffde7_dawid-zawila--G3rw6Y02D0-unsplash.jpg%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F0803886e-c4ba-44db-b310-83d2b1cffde7_dawid-zawila--G3rw6Y02D0-unsplash.jpg%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F0803886e-c4ba-44db-b310-83d2b1cffde7_dawid-zawila--G3rw6Y02D0-unsplash.jpg%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F0803886e-c4ba-44db-b310-83d2b1cffde7_dawid-zawila--G3rw6Y02D0-unsplash.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F0803886e-c4ba-44db-b310-83d2b1cffde7_dawid-zawila--G3rw6Y02D0-unsplash.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F0803886e-c4ba-44db-b310-83d2b1cffde7_dawid-zawila--G3rw6Y02D0-unsplash.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F0803886e-c4ba-44db-b310-83d2b1cffde7_dawid-zawila--G3rw6Y02D0-unsplash.jpg%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F0803886e-c4ba-44db-b310-83d2b1cffde7_dawid-zawila--G3rw6Y02D0-unsplash.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F0803886e-c4ba-44db-b310-83d2b1cffde7_dawid-zawila--G3rw6Y02D0-unsplash.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" loading="lazy"/>Camping mal anders – Anders on TourEgal ob am Waldrand, am Strand oder auf dem Bauernhof, mit diesem Wagen bist du nicht nur auf dem Campingplatz willkommen. Aber auch dort ein echter Hingucker. Unser Schäferwagen<img alt="Schäferwagen am Auto" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2Fcd075f36-ecbd-4a25-8faf-6201b937a851_IMG-20220219-WA0023.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D199%2C0%2C1200%2C1200%26w%3D1200%26h%3D1200&amp;w=1200&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2Fcd075f36-ecbd-4a25-8faf-6201b937a851_IMG-20220219-WA0023.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D199%2C0%2C1200%2C1200%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2Fcd075f36-ecbd-4a25-8faf-6201b937a851_IMG-20220219-WA0023.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D199%2C0%2C1200%2C1200%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Straßenzulassung mit 100 km/h möglichDamit du mit deinem Schäferwagen jeden deiner Lieblingsorte erreichen kannst, bieten unsere Wägen eine Straßenzulassung mit 100 km/h. Dadurch sind auch weit entfernte Ziele bequem zu erreichen.<img alt="Stauraum im Schäferwagen" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F6939dfd3-e565-452b-9e1c-68774c569253_20220206_010225.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C191%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=1200&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F6939dfd3-e565-452b-9e1c-68774c569253_20220206_010225.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C191%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F6939dfd3-e565-452b-9e1c-68774c569253_20220206_010225.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C191%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>So individuell wie duMit Fachwissen und Kompetenz erschaffen wir deinen persönlichen Traumwagen. Innovativ, flexibel und mit Liebe zum Detail gehen wir gerne auf deine persönlichen Wünsche ein.<img alt="Schäferwagen" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F495f0c18-2050-4da6-938f-abca4abf81ae_IMG-20220219-WA0042.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D194%2C0%2C768%2C768%26w%3D768%26h%3D768&amp;w=828&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F495f0c18-2050-4da6-938f-abca4abf81ae_IMG-20220219-WA0042.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D194%2C0%2C768%2C768%26w%3D768%26h%3D768&amp;w=1920&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2F495f0c18-2050-4da6-938f-abca4abf81ae_IMG-20220219-WA0042.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D194%2C0%2C768%2C768%26w%3D768%26h%3D768&amp;w=1920&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Transport von ZweirädernIndividuelle Trägersysteme ermöglichen den bequemen Transport von Fahrrädern bis hin zum Motorrad.<img alt="Schäferwagen in der Produktion" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2Fdef94003-81b4-4984-bf6e-c772c8273cf8_20220104_105925.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C560%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=1200&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2Fdef94003-81b4-4984-bf6e-c772c8273cf8_20220104_105925.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C560%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fandersontour%2Fdef94003-81b4-4984-bf6e-c772c8273cf8_20220104_105925.jpg%3Fauto%3Dcompress%2Cformat%26rect%3D0%2C560%2C1800%2C1800%26w%3D1200%26h%3D1200&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Einzigartig andersDie Sandwichbauweise vereint enorme Stabilität und optimale Wärmedämmung bei geringem Gewicht.Details zum Schäferwageninfo@andersontour.deWasenstr. 5675382 OttenbronnDer SchäferwagenÜber UnsKontaktImpressum'
