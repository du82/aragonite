["https://andrealazzarotto.com/privacy"]
title = "Informativa sulla privacy — Andrea Lazzarotto"
description = 'Mi chiamo Andrea Lazzarotto e sono il titolare del trattamenti dei dati elaborati dal sito web andrealazzarotto.com. Di seguito vi fornisco, in modo sintetico, le informazioni richieste dall’articolo 13 del GDPR. Per qualsiasi evenienza potete contattarmi all’indirizzo privacy@andrealazzarotto.com. Al fine di consentire la consultazione del sito, sono trattati alcuni dati personali la cui trasmissione èContinua a leggere "Informativa sulla privacy"'
full_description = "Informativa sulla privacy Mi chiamo Andrea Lazzarotto e sono il titolare del trattamenti dei dati elaborati dal sito web andrealazzarotto.com. Di seguito vi fornisco, in modo sintetico, le informazioni richieste dall’articolo 13 del GDPR. Per qualsiasi evenienza potete contattarmi all’indirizzo privacy@andrealazzarotto.com. Al fine di consentire la consultazione del sito, sono trattati alcuni dati personali la cui trasmissione è implicita nel funzionamento del web. Tali dati di navigazione (es. indirizzo IP, user agent) sono automaticamente comunicati dal dispositivo dell’utente al momento dell’accesso. Gli stessi dati sono anche trattati per: verificare il funzionamento del sito e garantirne la sicurezza; elaborare statistiche sull’utilizzo del sito, in forma anonima (mediante eliminazione degli ultimi 8 bit dell’indirizzo IP). Al fine di commentare gli articoli pubblicati sul blog, l’utente deve indicare il nome che intende sia pubblicato nell’apposita sezione e un indirizzo e-mail. L’inserimento di questi dati è obbligatorio. L’indirizzo e-mail non è in alcun modo divulgato, ma è trattato, unitamente all’indirizzo IP anonimizzato (mediante eliminazione degli ultimi 8 bit) per motivi di sicurezza e per consentire una più rapida approvazione di commenti successivi. L’utente può anche indicare il proprio sito web (che genererà un collegamento ipertestuale sul nome pubblicato nella sezione commenti) e scegliere che i predetti dati siano memorizzati in cookie tecnici. Su richiesta dell’utente, e a sua totale discrezione, l’indirizzo e-mail inserito può essere utilizzato per l’invio di notifiche in caso di risposte al commento e/o in caso di pubblicazione di nuovi articoli (a tal fine l’utente può iscriversi anche su altre pagine del sito). Non saranno mai inviate comunicazioni indesiderate. L’invio facoltativo di messaggi agli indirizzi e-mail indicati sul sito, oppure per mezzo dei form di contatto, comporta il trattamento di dati personali comuni (es. nome, cognome, indirizzo di posta elettronica) e di ogni altro dato fornito dall’utente, al fine di dar corso alla sua richiesta di preventivo o informazioni. Sono destinatari dei dati trattati i fornitori dei servizi di web hosting, posta elettronica e notifica via e-mail, che ai sensi dell’articolo 28 del GDPR rivestono la qualifica di responsabili del trattamento. Il sito web non carica nessuna risorsa da server esterni, di conseguenza i dati di navigazione non sono comunicati a terze parti. I contenuti eventualmente incorporati negli articoli vengono visualizzati solo a seguito dell’esplicito e libero consenso dell’utente. L’attivazione volontaria del servizio di notifica via e-mail comporta il trasferimento dell’indirizzo di posta elettronica al di fuori dello Spazio Economico Europeo. I dati di navigazione sono conservati per 10 giorni ai fini di sicurezza e 180 giorni ai fini di statistica. Il nome associato al commento sul blog (linkato all’eventuale sito web) sarà visualizzato fintantoché il commento risulterà pubblicato. L’indirizzo IP (anonimizzato) e l’indirizzo e-mail associati saranno conservati fino all’eliminazione dell’articolo o del singolo commento. L’indirizzo e-mail è conservato per l’invio delle notifiche fino al momento della disiscrizione dal servizio. I dati contenuti nelle richieste di preventivo e informazioni sono conservati per 10 anni. L’utente ha sempre diritto di: revocare il proprio consenso, ove rappresenti la base giuridica del trattamento, senza pregiudicare la liceità dei trattamenti già compiuti; accedere ai propri dati personali e ottenerne copia, ai sensi dell’articolo 15 GDPR; chiederne la rettifica e l’eventuale integrazione, ai sensi dell’articolo 16 GDPR; ottenerne la cancellazione, senza ingiustificato ritardo, ove ne ricorrano i presupposti, ai sensi dell’articolo 17 GDPR, nei limiti ivi indicati; ottenerne la limitazione del trattamento, ove ne ricorrano i presupposti, ai sensi dell’articolo 18 GDPR; riceverli in formato strutturato, di uso comune e leggibile da dispositivo automatico, ove ne ricorrano i presupposti, ai sensi dell’articolo 20 GDPR; opporsi in qualsiasi momento al trattamento, ove ne ricorrano i presupposti, ai sensi dell’articolo 21 GDPR; L’utente ha anche diritto di proporre reclamo all’Autorità di Controllo competente, ai sensi dell’articolo 77 GDPR, oppure proporre un ricorso giurisdizionale, ai sensi dell’articolo 79 GDPR, qualora ritenga che un trattamento violi il Regolamento Europeo. Informativa sui cookie Di base il sito web non utilizza cookie. L’utente, al momento dell’inserimento di un commento su un articolo del blog, può scegliere di memorizzare i propri dati nei seguenti cookie tecnici: comment_author_[id] della durata massima di 1 anno comment_author_email_[id] della durata massima di 1 anno comment_author_website_[id] della durata massima di 1 anno L’utente, al momento dell’attivazione facoltativa dei contenuti esterni (embed) negli articoli del blog, può scegliere di memorizzare le proprie preferenze nei seguenti cookie tecnici: embed-privacy della durata massima di 1 anno L’utente può in ogni momento cancellare i predetti cookie dalle preferenze del browser utilizzato."
year_published = 2025
year_updated = 2023
