title = "Chi sono — Andrea Lazzarotto"
description = 'Mi chiamo Andrea Lazzarotto, sono un consulente informatico forense e sviluppatore software full stack (desktop, web e mobile). Se desiderate fruire dei miei servizi professionali potete contattarmi tramite questa pagina. Opero principalmente nelle province di Vicenza, Treviso e Padova, tuttavia la natura del mio lavoro mi permette di erogare servizi in tutta Italia e nonContinua a leggere "Chi sono"'
full_description = "Chi sono Mi chiamo Andrea Lazzarotto, sono un consulente informatico forense e sviluppatore software full stack (desktop, web e mobile). Se desiderate fruire dei miei servizi professionali potete contattarmi tramite questa pagina. Opero principalmente nelle province di Vicenza, Treviso e Padova, tuttavia la natura del mio lavoro mi permette di erogare servizi in tutta Italia e non solo. Ho lavorato per clienti in Germania, India e Stati Uniti. Curriculum Vitae LinkedIn Questo spazio web contiene articoli riguardanti principalmente l’informatica forense e il software libero. Ci sono diversi tipi di contenuti, come ad esempio guide, recensioni, notizie e annunci di eventi specifici. I miei post vengono pubblicati senza una frequenza precisa e di solito gli articoli sono scritti con un taglio colloquiale. Metodi per seguire gli articoli Oltre a visitare periodicamente il sito, ci sono altri modi con i quali restare aggiornati sui contenuti del blog e tenersi in contatto. In particolare, potete usare i feed RSS. Questi sono uno strumento comodo, totalmente gratuito e facile da utilizzare per ricevere direttamente sul proprio lettore RSS gli ultimi articoli man mano che vengono pubblicati. Oltre a questo, potete seguirmi su Facebook, Twitter, Mastodon o LinkedIn. Se volete scrivermi per suggerimenti o consigli, visitate la pagina dei contatti. Feed RSS Facebook Twitter Mastodon LinkedIn Per chi preferisce seguire gli articoli via email c’è anche questa possibilità: Indirizzo e-mail Iscrizione Unisciti a 667 altri iscritti Breve biografia Sono nato nel 1991 e vivo a Cassola (VI). Sono da sempre appassionato di informatica intesa come scienza e come mezzo per risolvere problemi di ogni tipo. Da diversi anni mi interesso in particolare al software libero e alla cultura “open”. Nel 2010 ho conseguito il diploma di perito in informatica industriale all’ITIS Fermi di Bassano del Grappa, con voto 100 centesimi. Nel 2013 ho ottenuto la laurea triennale in Informatica all’Università Ca’ Foscari di Venezia, con voto 110 e lode. La mia tesi triennale sul data mining dei condensed colocation pattern è leggibile su Scribd. Ho svolto anche un periodo di studio presso la Technical University of Denmark, nell’ambito del programma Erasmus. Nel 2016 ho conseguito la laurea magistrale in Computer Science, sempre a Ca’ Foscari, con voto 110 e lode. La mia tesi magistrale verteva sulla ricostruzione di file system con metadati danneggiati ed è consultabile e scaricabile su Dspace, l’archivio tesi di ateneo. Il software RecuperaBit, che ho creato per ricostruire le partizioni NTFS, è disponibile su GitHub. Da febbraio a luglio 2015 ho svolto un altro periodo di studio all’estero studiando presso la Eindhoven University of Technology, nell’ambito del programma Erasmus+. Dopo gli studi ho iniziato l’attività lavorativa come sviluppatore software e consulente informatico forense. Da anni aiuto i clienti ad affrontare i casi che coinvolgono reati informatici e prove digitali. Sviluppo inoltre diverse tipologie di applicazioni."
