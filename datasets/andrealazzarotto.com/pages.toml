full_description = '''Analisi dei file di log negli incidenti informatici a SecureBiz 2024 Pubblicato daLazza2 Maggio 202413 Febbraio 2025Pubblicato in: Digital forensics, Sicurezza informaticaTag:eventi, evento, onif Questo mese si terrà il primo evento congiunto organizzato da AIP (Associazione Informatici Professionisti) e ONIF (Osservatorio Nazionale Informatica Forense), che ormai da diversi anni sono associazioni di riferimento nei settori della sicurezza informatica e della digital forensics. Il convegno SecureBiz 2024 si svolgerà Venerdì 10 maggio (09:30–18:00) e sabato 11 maggio 2024 (09:30–13:00), presso il Florence Visitor Center situato in Piazza della Stazione 4 a Firenze. Il programma è molto nutrito e si articola su due giornate in cui diversi professionisti affronteranno gli aspetti cruciali per trattare gli incidenti informatici in azienda: prevenzione, mitigazione, analisi e gestione. Sarò presente con un intervento intitolato “Ottenere risposte immediate dall’analisi dei file di log con SQLite”, dedicato all’estrazione rapida di informazioni chiave da una mole di dati spesso corposa: Gli accertamenti tecnici relativi ad accessi abusivi e furti di dati informatici richiedono spesso l’analisi di grandi quantitativi di log, con migliaia di righe dalle quali è necessario riconoscere elementi ricorrenti e isolare le anomalie. Si rivela altresì importante correlare e incrociare log provenienti da fonti diverse. L’intervento ha lo scopo di mostrare come utilizzare SQLite per l’analisi dei log e ottenere risposte in modo rapido ed efficace. Si tratta di uno strumento apparentemente semplice, ma molto potente che consente di ridurre il tempo necessario per ricostruire ciò che è avvenuto. Verranno mostrati due esempi pratici relativi ad accessi abusivi a sistemi informatici. Maggiori informazioni sul programma e le modalità di iscrizione sono disponibili direttamente sul sito dell’evento e su EventBrite: Sito ufficiale Pagina di iscrizione La partecipazione all’evento è totalmente gratuita, ma è obbligatorio registrarsi. Al momento sono ancora disponibili dei biglietti, perciò vi consiglio di non lasciarvi sfuggire questa opportunità! Materiale Potete scaricare le slide cliccando qui, mentre il video è disponibile su YouTube e qui sotto. Non dimenticate di seguire il canale di AIP, per accedere a tutti gli altri interventi della conferenza. Se vi serve una consulenza tecnica a scopo legale sull’analisi dei file di log o sul furto di dati, potete richiedere questo tipo di servizio tramite la pagina dedicata. Display "Andrea Lazzarotto" from YouTube Clicca qui per mostrare contenuto da YouTube. (leggi la privacy policy del servizio) Mostra sempre i contenuti da YouTube var _oembed_b003aa6c4ff2c904d94038b271357136 = '{\"embed\":\"&lt;iframe title=&quot;Andrea Lazzarotto&quot; width=&quot;750&quot; height=&quot;422&quot; src=&quot;https:\\/\\/www.youtube-nocookie.com\\/embed\\/Hnr4RswoshA?start=24&amp;feature=oembed&quot; frameborder=&quot;0&quot; allow=&quot;accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share&quot; referrerpolicy=&quot;strict-origin-when-cross-origin&quot; allowfullscreen&gt;&lt;\\/iframe&gt;\"}'; Condividi: Share on Email Share on Facebook Share on X (Twitter) Share on Mastodon Share on LinkedIn Share on Telegram Share on WhatsApp Share on Pocket Pubblicato daLazza2 Maggio 202413 Febbraio 2025Pubblicato in: Digital forensics, Sicurezza informaticaTag:eventi, evento, onif'''
