description = "As mentioned, in September I'm leaving Automattic and my full-time role supporting contributors and programs in the WordPress open source project. (I've been overwhelmed by the number of people who've taken the time to tell me that I've had a positive impact on them or on their experience in WordPress. Thank you so much, friends!…"
full_description = "Letters to an open source contributor As mentioned, in September I’m leaving Automattic and my full-time role supporting contributors and programs in the WordPress open source project. (I’ve been overwhelmed by the number of people who’ve taken the time to tell me that I’ve had a positive impact on them or on their experience in WordPress. Thank you so much, friends! It means so much to know that I made a difference.) Also as mentioned: I keep waking up at 4:18am with a list of things I urgently want to tell people.— Andrea Middleton (@andmiddleton) September 3, 2021 One of kinds of “invisible” work I do as a leader in an open source project is to coach or mentor contributors who are new to WordPress, or who are looking to grow in this community/ecosystem. If you’re thinking “I’ve worked with Andrea before, and she never told me what to do!” then it might be that I had feedback that I was waiting for the right moment to share. It’s also possible I was shadowing YOU and hoping to learn how you do cool stuff around WP. Anyway, I have a lot of stored up counsel, that I want to share with a bunch of people before I go on my possibly-forever hiatus. And what do we do in WordPress when we have something to say? Well, we blog about it of course. 🙂 “Letters to a Young Poet, by Rainer Maria Rilke” by elycefeliz is licensed under CC BY-NC-ND 2.0 So please stay tuned for a series of articles, which will include possibly-sassy versions of the advice I generally tailor to individual needs and moments. I hope that sharing my observations about what works and doesn’t work, when trying to accomplish things in WordPress, will result in some assets that help open source contributors, even when I’m not around. As you can see from this title, I’m going to try to humbly channel Rilke. Is that even possible? Stay tuned to find out! Share this:FacebookTwitterLike Loading... Related Posted byAndrea MiddletonSeptember 7, 2021Posted inwordpressTags:open source advice Published by Andrea Middleton Currently at Reddit, I spent 10 years as a community organizer on the WordPress open source project. I'm also an avid reader, wine enthusiast, and parent of two. View all posts by Andrea Middleton"
