title = "Food – The Thing With The Stuff"
description = "Posts about Food written by Andrea Middleton"
full_description = "Caramel curry popcorn I love popcorn. I especially love home-popped popcorn, and I extra-especially love this funny concoction I’ve made up: caramel curry popcorn. Here’s how I make it. Take 2-3 tablespoons of butter and put it in a microwaveable dish. I usually use a mug. Add one tablespoon of your favorite curry powder to the mug with the butter. Add a heaping tablespoon of brown sugar to the mug as well. Microwave the mug containing the butter, spices, and sugar, on half power for about 2 minutes. You might want to cover the mug with a paper towel or something — sometimes butter will explode in the microwave. When you take out the mug, the concoction should look like this: Real talk: this isn’t proper caramel. But it’s close enough for my purposes. While you’re at it, pop the popcorn. I like the stovetop method. When the popcorn is popped, pour it into a big bowl. Then drizzle the caramel over the corn. This works best if it’s still quite bubbly; if it subsides for too long, the sauce will “break” a little and the spice and sugar won’t disperse itself as evenly through the popcorn. So if your sauce is a little broken (if you can see the butter separating from the brown stuff), put it back in the microwave on high for 15-30 seconds. Salt (and pepper!) to taste, and then toss the popcorn in the bowl to spread the curry caramel around as thoroughly as it will let you. I tend to eat this with a dish towel close at hand, because it’s on the sticky/greasy side. Pair with a lager, a white wine on the sweetish spectrum, a light Gamay, sangria, or a cocktail. Enjoy! Share this:FacebookTwitterLike Loading... Posted byAndrea MiddletonMay 10, 2020Posted inFoodTags:popcorn, recipeLeave a comment on Caramel curry popcorn Dinner wins: Mexican Pizza ‪Last night’s dinner was Mexican pizza, which is definitely neither Mexican nor pizza, but was very delicious and actually reheated quite well for lunch today! Spread one burrito-size flour tortilla with refried beans (as much as 2 cups) and sprinkle with a little shredded cheese (maybe a cup). Lay the loaded tortilla in a warmed large frying pan with a little — maybe a teaspoon or so — oil in it (if you have some leftover bacon grease around, this is a good use for it). You’ll want medium heat for this. Top with another flour tortilla and, when the bottom tortilla is golden and crispy, carefully flip over. (I use one of those wide fish spatulas.) Top the crispy side with more shredded cheddar and other toppings that appeal to you. Last night, I cooked off a little chorizo and opened a can of sliced olives and sprinkled all that on top. Cover with a lid and remove from heat, to let the cheese melt. Once the bottom tortilla is crispy and the cheese is melty, carefully lift or slide the “pizza” out of the pan and onto a cutting board. If the bottom is getting too brown but the cheese hasn’t melted, it’s ok to remove from heat early and let it rest, covered, on the cutting board until melting happens. Slice like a pizza and serve with salsa and sour cream or whatever you like on a taco. Yum! Share this:FacebookTwitterLike Loading... Posted byAndrea MiddletonMay 3, 2020Posted inFoodLeave a comment on Dinner wins: Mexican Pizza"
