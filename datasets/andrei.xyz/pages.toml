["https://andrei.xyz/lost-in-translation/de"]
title = "Lost in Translation > -- Deutsch - andrei.xyz"
description = """
Deutsch: Verloren in der Übersetzung German translation was made by Æero.
Hallo! Ich überlege gerade, was ich in diesem Beitrag gleichzeitig auf Englisch und Rumänisch schreiben soll, und ich weiß schon, dass ich Probleme haben werde, dieselbe Botschaft in mehreren Sprachen zu vermitteln, aber ich denke, das ist ja der Sinn dieses Beitrags. Ich weiß, dass die meisten Blogger auf Englisch schreiben, um die Mehrheit der Menschen auf der Erde anzusprechen, während einige andere einfach in ihrer Muttersprache schreiben, sei es Englisch, Französisch oder eine andere, weil ihre Leser geografisch näher sind."""
full_description = '''This post in other languages Prologue English / original Română Deutsch Svenska Nederlands Français ქართული ენა / Georgian русский / Russian Arabic / اَلْعَرَبِيَّةُ 한국어 / Korean Srpski / Serbian Deutsch: Verloren in der Übersetzung German translation was made by Æero. Hallo! Ich überlege gerade, was ich in diesem Beitrag gleichzeitig auf Englisch und Rumänisch schreiben soll, und ich weiß schon, dass ich Probleme haben werde, dieselbe Botschaft in mehreren Sprachen zu vermitteln, aber ich denke, das ist ja der Sinn dieses Beitrags. Ich weiß, dass die meisten Blogger auf Englisch schreiben, um die Mehrheit der Menschen auf der Erde anzusprechen, während einige andere einfach in ihrer Muttersprache schreiben, sei es Englisch, Französisch oder eine andere, weil ihre Leser geografisch näher sind. Ich glaube, das erste Mal, dass ich erlebte, wie die Bedeutung einer Übersetzung verloren ging, war, als ich vor etwa 20 Jahren das Musical Notre Dame de Paris sah (es ist immer noch mein Lieblingsmusical!) und darüber lachte, dass der Satz „entre chien et loup“ wörtlich mit „zwischen Hund und Wolf" übersetzt wurde, obwohl es eigentlich eine Redewendung für „in der Dämmerung" war, denn zu dieser Tageszeit kann man den Unterschied nicht sehen. Ich habe früher viel auf Rumänisch geschrieben, bis 2012 oder so, aber seit ich hier wieder aktiv schreibe, hat sich sowohl in meinem Leben als auch in der Blogosphäre viel verändert, und mein Publikum ist jetzt nicht mehr in Rumänien konzentriert. Auch wenn zwei Menschen aus verschiedenen Ländern oder mit unterschiedlichem Hintergrund eine gemeinsame Sprache sprechen können, gibt es viele Gelegenheiten, bei denen die Sprache ein so starkes Werkzeug ist, dass sie mehr Mauern als Brücken baut, weil sie den Zugang zu Wissen, Kultur, Kunst oder Menschen und ihren Ideen einschränken kann. Große Unternehmen wie Youtube und Netflix schränken Inhalte oft nach geografischen Gesichtspunkten ein und errichten damit eine weitere Mauer zwischen dem Leser und den Informationen. Wenn Sie zum Beispiel ein Rumäne sind und in Westeuropa leben, können Sie auf Netflix keine rumänischen Filme sehen, die Sie in Rumänien sehen können. Sie werden Ihren Freunden also Dinge empfehlen, zu denen sie keinen Zugang haben, es sei denn, sie reisen tatsächlich dorthin. Irgendwie dumm, denn wir leben ja im digitalen Zeitalter, auch wenn es VPNs gibt. Wenn Sie also einen Blog, eine Website, ein Unternehmen oder eine Community betreiben, dann sperren Sie die Leute nicht aus, nur weil die anderen dort sind, wie es Staples.com für Besucher aus der Europäischen Union tut. Bei der Arbeit, in Foren, beim Lesen von Blogs, beim Chatten in IRC-Kanälen oder beim Spielen von World of Warcraft hatte ich die Gelegenheit, wunderbare Menschen aus aller Welt kennenzulernen und ihre Kultur, Musik, Filme, Bücher, Ideen, Vorbilder, Superstars und Legenden zu erkunden, was meinen Horizont über meine Vorstellungskraft hinaus erweitert hat. Das World Wide Web wird jeden Tag größer, und schließlich ist es nur eine persönliche Entscheidung, in diesem unendlichen Raum mehrsprachig zu sein. Man kann Englisch, Japanisch oder sogar Klingonisch sprechen, wenn man will, es ist alles eine Frage der persönlichen Entscheidung, und irgendwann geht es gar nicht mehr um die Sprache. Es geht darum, zu verstehen, wer dein Publikum ist und ob es dir wichtig ist, deine Botschaft, deine Kultur und dein Wissen über einige Grenzen hinaus zu verbreiten, die von einigen Königen vor zweitausend Jahren willkürlich auf einer Landkarte festgelegt wurden. Anstatt also zu viel darüber zu philosophieren, was es bedeutet, im Internet mehrsprachig zu sein, halte ich es für das Beste, wenn ich den Rat gebe, man selbst zu sein und zu lernen, über den Tellerrand hinauszuschauen, denn die Dinge, die man entdecken könnte, sind vielleicht wunderbar. Wenn man den Geist offen hält, bleibt auch das Internet offen. Ich danke Euch! This post in other languages Prologue English / original Română Deutsch Svenska Nederlands Français ქართული ენა / Georgian русский / Russian Arabic / اَلْعَرَبِيَّةُ 한국어 / Korean Srpski / Serbian The more you know who you are, and what you want, the less you let things upset you. — Bob #lost in translation #multilingualism by Andrei on 2024-10-27 · 583 words · 3 mins read · 🖨️ · 🌐 Webmentions Webmentions allow conversations across the web, based on a web standard. They are a powerful building block for the decentralized social web. If you write something on your own site that links to this post, you can send me a Webmention by putting your article's URL in the form and it will appear in a list, below. Comments Leave a Comment! 58 plus 11 equals'''
