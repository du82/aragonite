full_description = "As you might remember, back in October I posted an article named “Lost in Translation” which got published in ten languages. In the follow up post, Lost and Found in Translation I said how I’m going to ask some friends more things about their country and their language. The first person to be feature is ma chère Marine, who also did the French translation, available ici. Enjoy! Tell me something about your country or your language that people always get wrong People always assume that we all eat frogs, well it’s wrong :p (some maybe, but not everyone) Tell me something you would recommend a tourist to try in your country or city I’d say to try either a “plateau de fromage” (several kind of cheeses cut in one part to try) or a real big croissant !!! Recommend me a song in your language As i’m more a rock person, i recommend this song : KYO - Dernière Danse Recommend me a movie in your language Les Visiteurs is a great and fun movie ! # Recommend me a book in your language For a book i’d recommend André Gide - La Symphonie Pastorale What’s your current phone or computer wallpaper? Does it have a particular meaning? This is my current wallpaper on my computer, it is a friend and I during an event in World Of Warcraft and I really like how the picture turned out 😄 Send me a representative photo for your country or language And for a representive photo for my country I think the Eiffel Tower with the Olympic Games rings is pretty representative :p Read the other interviews The more you know who you are, and what you want, the less you let things upset you. — Bob #multilingualism #multiculturalism #lost in translation #lost and found in translation #interview #francais #french by Andrei on 2024-11-22 · 271 words · 2 mins read · 🖨️ · 🌐 This article is part of a series on: Lost and Found in Translation Français – Marine Deutsch — Æero Irish – Draí English (UK) – Appollina Arabic – Amber Dutch – Maria Serbian – 3enit Webmentions Webmentions allow conversa