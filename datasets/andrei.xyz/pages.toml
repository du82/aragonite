full_description = "For relaxing times, make it Suntory time. — Bob Prologue As you might remember, back in October I posted an article named “Lost in Translation” which got published in ten languages, with the help of some really great friends, which I want to thank once more. And while I was looking at the article, I thought that this could be a launching ramp on a cultural journey that I can take, so I devised a set of questions, some more generic, others a bit more personal, in order for me to discover more about these wonderful people and their culture. So over the next few weeks, I’m going to have the honor to publish a few articles with their answers. I’ve also spoken with some friends that declined the initial invitation to translate the article, and some have accepted this challenge and will soon respond to my questions. Because I wrote the article in English and translated it into Romanian, I asked some friends to cover for me in regards to those languages and the articles will be published soon. Hope you like them as much as I do and hope there’s something to learn for everyone of us! Français – Marine Deutsch — Æero Irish – Draí English (UK) – Appollina Arabic – Amber Dutch – Maria Serbian – 3enit"
