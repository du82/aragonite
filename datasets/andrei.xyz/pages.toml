title = "Cool Stuff on the Internet - andrei.xyz"
description = "sugar, spice, and everything not nice"
full_description = "Watch out! Some of the Feed links are either broken, not updated or missing. Also all the Feed links are http, not https, use whatever you want. Also the order of the links is merely alphabetical based on how they show in my feed reader, so it’s easier for me to update it from time to time. Sites marked with 🇷🇴 are written mainly in Romanian. Sites with 🇷🇴* are sometimes in Romanian. I started this list thinking about the really nice sites I used to read in the RSS Reader and the nice blogs I was following. While some are very interesting resources, some are just plain fun and time wasters. Enjoy! Personal Websites This hits a bit, because out of the 60 personal blogs I followed, none of them are still online or updated, or relevant. It kinda shows how the really personal part of the internet has been offloaded to big companies like facebook and instagram. So I’ll have to start again and add some new ones! 💕 Devastatia 💕 — Your Internet Girlfriend. Great blog about web development, internet, culture, and tits. Link | Feed Alex Plugaru — Software engineer, entrepreneur and dreamer. One of the best tech guys I’ve ever met and worked alongside with. Link | Feed Bacardi55’s Web Cave — Really good technical writing here. Link | Feed basement blog — blog of the basement community, run by orchids Link | Feed Brad Woods Digital Garden — One of the best informative and also best looking sites on the internet. This is a masterpiece. Link | Feed 🇷🇴 Catalina Popa — Very good friend of mine, posts about travel, photography, blogging, and many more. Also check her YT channel. Link | Feed 🇷🇴 Dan Byron — Frontman of [byron] band, blogger and a great human Link | Feed Duncan Moran — Duncan has a really nice blog and I really like the way he’s writing, wish he’d write more. Link | Feed earendelmir — Great blog of an Italian computer engineer dreaming of living a hobbit life. Link | Feed Fabien Sanglard — Software developer and cool blogger Link | Feed foosel.net — Blog of Gina Häußge, developer and geek Link | Blog Feed | TIL Feed 🇷🇴 Forever Folk — Website that is focusing on the Romanian Folk music scene. Concerts, tickets, festivals, all Folk in one place. Link | Feed foreverliketh.is — I met Eden on Agora road and has one of the best websites out there. Definitely a great site. Link | Feed Glyphy — Dmitri Vasilenko — Backend developer with a good informative website. Love this. Link | Articles Feed | Notes Feed | Links Feed James’ Coffee Blog — writing about technical and non-technical matters, James holds a nice and interesting blog. Link | Feed Jess is typing — is a writer and teacher with a very cool blog. Link | Feed Jo’s Blog — a passion project focused on fun and self-expression, Jo’s blog is always a good read. Link | Feed Juha-Matti Santala — Community Builder. Dreamer. Adventurer. A good blogger and a good coder as well. Link | Feed LNX GFX — Personal website of Arkdae. A lot of great technical posts there and also cool projects. Link | Feed localghost — Sophie Koonin — Great looking blog with a ton of informative articles and some really good link dumps. Link | Feed maerk — Great blog of Mark about games, computers and other geek stuff. Link | Feed Manuel Moreale — Developer and designer. Writes great, a lovely person to follow. Link | Feed 🇷🇴 Marius Matache — Folk singer, doctor in chemistry, rugby enjoyer, all in all a great person and a great blogger. Link | Feed microbyte — Another old-school website with really nice content, definitely worth reading. Link | Feed risingthumb — Aaron’s website is another piece of great cozy internet space. Make sure you go there for a nice read any time. Link | Feed Sean of the South — Columnist, novelist, great writer. Link | Feed 🇷🇴* Seb.page — Programmer by day, improv, art, books, movies, music, cooking, chess, puzzles aficionado by night, Seb is not only a good writer, but also an awesome person. Link | Feed 🇷🇴 Somn — This is the blog of a former co-worker where he posted about the stuff he did and the sleep he got. One of the best blogs on the internet. Link | Feed sy.st — Blog about security, formerly known as 1337.⚫️. Wish it was updated more often Link | Feed 🇷🇴 Tanasisme — Singer of Tapinarii and Salajan-based superstar, writes about movies, music and pop culture. Link | Feed Tangible Life — Blog of Steven, father, writer, coffee drinker. Make sure to also check his ▲ of the Mind newsletter! Link | Feed The Copetti Site — Website of Rodrigo Copetti, architect and developer of mobile applications, with a few masterpiece articles about the architecture of consoles. I love his passion and attention to detail Link | Feed Westley Winks — Westley has a very interesting blog and is also serving in the Peace Corps. Make sure to check that section out. Link | Feed whitevhs.xyz — Hayden’s site is a huge blast from the past. Love its old-school design that blends perfectly with great written content. Link | Feed zinricky — The site of Riccardo is not very often updated, but the content he adds to his site is always read-worthy. Also he hosts the great Agora Feed. Link | Feed Design and Development Blogs and Sites Coding Horror — Blog about the horrors of programming. Or “programming”. If you use npm something, this is directed at you. Link | Feed Syntax Error — is a monthly newsletter that helps software developers turn a stressful situation into a joyful exploration. Link | Feed The Daily WTF - Founded in 2004, this is your how-not-to guide for developing software. Here you can find tales of disastrous development, from project management gone spectacularly bad to inexplicable coding choices. Link | Feed Webpages that suck — As its name says, websites that suck. However, the author stopped posting in 2016, which I honestly think it was the day the internet died and most (all?) sites started to suck. Link | Feed Comics Another Halo Comic Strip — Very funny comic about the Halo video game. Link | Feed Carbot Animations — Good Youtube channel featuring short animation videos from popular video games. As a Warcraft/Diablo fan, their videos are bonkers! Link 🇷🇴 Comics Ceva Marunt — Made by people that also do stand-up comedy, these are either funny, either so silly they’re funny (if you’re Romanian). Link | Feed Ctrl+Alt+Del Comics — Comic about videogames. Started as the adventures of Ethan and Lucas, and developed quite a while. Another comic with a long history. Link | Feed Dilbert Daily Strip — Great comic about the workplace. Cancelled because some pussies were too butthurt that the creator said something at some point. Discontinued, but archive available online Explosm.net — Cyanide & Happiness — Nice raunchy comics, not for the faint of heart. Feed is no longer updated. Found a new 3rd party feed. Link | New feed Fredo and Pidjin. — Two pigeons set to destroy the world. Or rule it. Link | Feed Gone With the Blastwave — Probably one of the best comics out there. Updated every once in a while, it has 80 pages and it’s great! Feed is no longer updated. Link Grumpy Website — a world-leading media conglomerate of renowned experts in UIs, UX and TVs, reporting on infinite scrolls, cookie banners and unnecessary modal dialogs since 2017. Link | Feed 🇷🇴 Grupul De Lucru — Youtube channel of some guys dubbing Transformers as people from Transylvania. Romanian humour. Proceed with caution. Link | Feed Hamlet’s Danish — Some older funny comics. Make yourself a favour and read them. Lols ensured. Link | Feed 🇷🇴 Micul TOMA — One of the best stand-up comics in Romania, he also does other fun and funny content, one of my favourite Romanian youtubers. He is also one of the guys that built CevaMarunt. Link Poorly Drawn Lines — A thrice-weekly webcomic written and illustrated by Reza Farazmand, featuring some simple-drawn characters in very funny situations. Definitely worth checking Link | Feed Questionable Content — Twenty years in the making, this is one of the longest running comics online. Link | Feed Savage Chickens — Funny comic about chickens. Yes, chickens. Talking chickens. Link | Feed The Oatmeal — From creator of Exploding Kittens and some of the best comics on the Internet. Must read all the comics. Link | Feed The Register: Bastard Operator from Hell — The Bastard Operator from Hell is still alive and doing his old shenanigans. One of the best reads on the interwebs. Link | Feed They Can Talk — Ever wondered what animals are saying to each other? Well, wonder no more! Link | Feed Twit-ha — Some nice comics about internet, social media and failwhales Link | Feed VGCats — Cats and videogames Link | Feed What If? — From the creator of xkcd, a nice collection of “what if X?” Also XKCD is a great source of great comics about science Link | Feed | xkcd feed WuMo — Originally named after their creators, Wulff & Morgenthaler, comics ranging from intelligent satire to slapstick, usually in supremely unusual situations. Link | Feed Changelog 2023-07-06 — Initial list 2023-08-13 — Removed Abduzeedo, Toxel, Smashing Magazine, Awwwards due to the amount of crap they publish. Added 8 sites in the “Personal Websites” category. Ordered all feeds by name. Added 🇷🇴 to blogs written in Romanian. 2023-12-28 — Added 9 more sites in the “Personal Websites” and 3 more in the “Comics”. Removed one link from Tech blogs. 2024-03-11 — Added 10 sites to the “Personal Websites” and cleaned some older links. 2024-05-18 — Added 7 sites to the “Personal Websites”, threee to the “Design & Dev” and one to “Comics”. [to be continued] #cool stuff #internet links 2023-07-06 · 1680 words · 8 mins read · 🖨️"
