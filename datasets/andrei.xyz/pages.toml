full_description = "This post in other languages Prologue English / original Română Deutsch Svenska Nederlands Français ქართული ენა / Georgian русский / Russian Arabic / اَلْعَرَبِيَّةُ 한국어 / Korean Srpski / Serbian 한국어 / Korean: 번역에서 길을 잃다 This version was translated by Kyunghun Jeong. Thank you Ruxandra for helping this happen! 안녕하세요! 저는 이 글에서 영어와 루마니아어로 동시에 무엇을 쓸지 생각하고 있지만 다른 언어로 같은 메시지를 전하려고 할 때 문제가 발생할 수 있다는 것을 이미 알고 있습니다. 하지만 결국, 그것이 이 글의 요점이라고 생각합니다. 대부분의 블로거는 영어로 글을 쓰면 지구상의 대부분의 사람들에게 어필할 수 있고, 반면 일부 다른 블로거들은 지리적으로 가깝다는 이유로 영어, 프랑스어 등의 모국어로 글을 쓰기도 합니다. 제가 번역에서 의미를 잃어버린 경험을 처음 한 것은 약 20년 전 뮤지컬 노트르담 드 파리(지금도 제가 가장 좋아하는 뮤지컬입니다!)를 보면서 “entre chien et loup”라는 문구를 문자 그대로 “개와 늑대 사이”로 번역한 것인데, 실제로는 ‘황혼에서’라는 뜻의 관용어였기에 그 차이를 알 수 없어 웃었던 적이 있습니다. 2012년 정도까지는 루마니아어로 글을 많이 썼지만, 이제 다시 활발하게 글을 쓰기 시작하면서 제 인생과 블로고스피어에 많은 변화가 있었기 때문에 제 독자는 더 이상 루마니아에 국한되지 않습니다. 서로 다른 나라 출신이거나, 배경이 다른 두 사람이 같은 언어를 공유할 수는 있지만, 언어라는 도구가 너무 강력한 나머지 지식, 문화, 예술 또는 사람과 아이디어에 대한 접근을 제한하는 장벽을 쌓기도 합니다. 유튜브나 넷플릭스와 같은 대기업은 종종 지리적 위치를 기반으로 콘텐츠를 제안하여 독자와 정보 사이에 또 다른 장벽을 쌓습니다. 예를 들어 당신이 서유럽에 거주하는 루마니아 사람이라면 루마니아에서는 볼 수 없는 루마니아 영화를 루마니아에서 볼 수 있습니다. 따라서 실제로 그곳에 가지 않는 한 절대 볼 수 없는 영화를 친구에게 추천할 수 있습니다. VPN이 존재하는 디지털 시대에 살고 있기 때문에 조금 이상하기도 합니다. 따라서 블로그, 웹사이트, 회사 또는 커뮤니티를 운영하는 경우, staples.com이 EU에서 오는 방문자에게 하는 것처럼 지리적 위치에 기반하여 사람들을 차단하지 마세요. 직장에서, 포럼에서, 블로그를 읽거나 IRC 채널에서 채팅을 하거나 월드 오브 워크래프트를 플레이하면서 전 세계의 멋진 사람들을 만나 그들의 문화, 음악, 영화, 책, 아이디어, 롤모델, 슈퍼스타, 전설을 탐구할 기회를 가졌고, 이를 통해 제 시야를 상상 이상으로 넓히는 데 도움이 되었습니다. 월드와이드웹은 매일 더 넓어지고 있으며, 결국 이 무한한 공간에서 다국어를 구사하는 것은 개인적인 선택일 뿐입니다. 원한다면 영어, 일본어, 심지어 클링온어로도 이야기할 수 있고, 이는 모두 개인의 선택에 달려 있으며 어느 순간에는 언어가 전혀 중요하지 않습니다.청중이 누구인지, 2천 년 전 어떤 왕들이 임의로 설정한 국경 너머로 메시지와 문화, 지식을 전파하는 데 관심이 있는지 파악하는 것이 중요합니다. 따라서 인터넷에서 다국어를 구사한다는 것이 무엇을 의미하는지에 대해 너무 많은 철학을 갖기보다는, 나 자신이 되라는 조언을 나누고 지평선 너머를 바라보는 법을 배우는 것이 가장 좋다고 생각합니다. 왜냐하면 여러분이 발견할 수 있는 것들이 훌륭할 수도 있기 때문입니다. 마음을 열어두면 인터넷도 열린 상태로 유지됩니다. 감사합니다! This post in other languages Prologue English / original Română Deutsch Svenska Nederlands Français ქართული