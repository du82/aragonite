["https://andrei.xyz/lost-in-translation/ru"]
title = "Lost in Translation > -- русский / Russian - andrei.xyz"
description = """
русский / Russian: Трудности перевода Russian version was translated by Мария.
привет! Я думаю о том, что написать в этом посте одновременно на английском и румынском языках, и я уже знаю, что у меня возникнут проблемы при попытке отправить одно и то же сообщение на нескольких языках, но, думаю, в конце концов, в этом и заключается смысл поста. Я знаю, что большинство блоггеров пишут на английском, чтобы быть более привлекательными для большинства людей, живущих сейчас на Земле, в то время как некоторые другие просто пишут на своем родном языке, будь то английский, французский или любой другой, потому что их читатели географически ближе."""
full_description = "русский / Russian: Трудности перевода Russian version was translated by Мария. привет! Я думаю о том, что написать в этом посте одновременно на английском и румынском языках, и я уже знаю, что у меня возникнут проблемы при попытке отправить одно и то же сообщение на нескольких языках, но, думаю, в конце концов, в этом и заключается смысл поста. Я знаю, что большинство блоггеров пишут на английском, чтобы быть более привлекательными для большинства людей, живущих сейчас на Земле, в то время как некоторые другие просто пишут на своем родном языке, будь то английский, французский или любой другой, потому что их читатели географически ближе. Я думаю, что впервые я столкнулся с потерей смысла при переводе, когда смотрел мюзикл “Собор Парижской Богоматери” около 20 лет назад (это по-прежнему мой любимый мюзикл!) и смеюсь над тем, что фраза “entre chien et loup” была переведена буквально как “между собакой и волком”, хотя на самом деле это идиома, означающая “в сумерках”, потому что в это время дня разницы не видно. Когда-то, примерно до 2012 года, я много писал на румынском, но с тех пор, как я начал активно писать здесь, многое изменилось как в моей жизни, так и в блогосфере, теперь моя аудитория больше не сосредоточена в Румынии. И хотя два человека из разных стран и с разным опытом могут говорить на одном языке, во многих случаях язык является настолько мощным инструментом, что возводит больше стен, чем мостов, потому что он может ограничить ваш доступ к знаниям, культуре, искусству или людям и их идеям. Крупные компании, такие как Youtube и Netflix, часто ограничивают контент на основе схем геолокации, возводя еще одну стену между читателем и информацией. Например, если вы румын, живущий в Западной Европе, вы не сможете посмотреть на Netflix фильмы на румынском языке, которые вы можете посмотреть, находясь в Румынии. Итак, вы собираетесь порекомендовать друзьям что-то, к чему у них никогда не будет доступа, если они не поедут туда физически. Довольно глупо, поскольку мы живем в эпоху цифровых технологий, даже несмотря на существование VPN. Так что если вы используете блог, сайт, компанию или сообщество, не блокируйте людей, основываясь только на том, где располагается большинство, как делает staples.com для посетителей, приезжающих из Европейского Союза. На работе, на форумах, читая блоги, общаясь в чате на IRC-каналах или играя в World of Warcraft, я встречался с замечательными людьми со всего мира, изучал их культуру, музыку, фильмы, книги, идеи, ролевые модели, суперзвезд и легенды, и это помогло расширить мои горизонты за пределы моего воображения. Всемирная паутина с каждым днем становится все шире, и, в конце концов, быть многоязычным в этом бесконечном пространстве - это всего лишь ваш личный выбор. Вы можете говорить по-английски, по-японски, даже по-клингонски, если хотите, все зависит от вашего личного выбора, и дело даже не в языке вообще. Все дело в понимании того, кто ваша аудитория, и заботитесь ли вы о распространении своего послания, своей культуры и своих знаний за пределы границ, которые были произвольно установлены какими-то королями на карте две тысячи лет назад. Поэтому вместо того, чтобы слишком много философствовать о том, что значит быть многоязычным в Интернете, я думаю, будет лучше, если я поделюсь советом оставаться самим собой и научиться заглядывать за горизонт, потому что то, что вы можете обнаружить, может оказаться замечательным. Открытость ума делает Интернет открытым. Спасибо! The more you know who you are, and what you want, the less you let things upset you. — Bob #lost in translation #multilingualism by Andrei on 2024-10-27 · 535 words · 3 mins read · 🖨️ · 🌐 Webmentions Webmentions allow conversations across the web, based on a web standard. They are a powerful building block for the decentralized social web. If you write something on your own site that links to this post, you can send me a Webmention by putting your article's URL in the form and it will appear in a list, below. Comments Leave a Comment! 58 plus 11 equals"
