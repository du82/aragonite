full_description = "The flexi disc (also known as a phonosheet, Sonosheet or Soundsheet) is a phonograph record made of a thin, flexible vinyl sheet with a molded-in spiral stylus groove, and is designed to be playable on a normal phonograph turntable. Flexible records were commercially introduced as the Eva-tone Soundsheet in 1962. They were very popular among children and teenagers and mass-produced by the state publisher in the Soviet government. I was able to find in the family, among other many nice records of Hungarian Folklore Music a Colorvox flexi disc. It seems that Hungarians did way more pressings that the Romanian counterparts (shown here and here). A pretty big collection of them can be found on discogs, as Publishing House of the Art Foundation (Képzőművészeti Alap Kiadóvállalat) also released, under the Cityvox label, a series of circular flexi-discs, with a normal cover. uses • posts • bundles • statistics movie wall • ratings dump • checklist 288 • Photographs • 50 themes of 2023 • 365 project of 2023"
