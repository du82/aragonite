description = """
Returning to the original translators of &ldquo;Lost in Translation&rdquo;, today we meet Amber, who did the Arabic translation and now tells us more about the Arabic countries and language.
Enjoy!
Tell me something about your country or your language that people always get wrong When it comes to things that people get wrong about Middle Eastern’s that the world think we are rich AF. Unfortunately that truth is far from reality, probably only 5% are rich AF and remains 95% of people are regular people, some barely affording something or can leave their country."""
full_description = "Returning to the original translators of “Lost in Translation”, today we meet Amber, who did the Arabic translation and now tells us more about the Arabic countries and language. Enjoy! Tell me something about your country or your language that people always get wrong When it comes to things that people get wrong about Middle Eastern’s that the world think we are rich AF. Unfortunately that truth is far from reality, probably only 5% are rich AF and remains 95% of people are regular people, some barely affording something or can leave their country. If we were rich AF our houses would be made out of bricks of gold, but the majority of people here are regularly people across the world paying taxes or bills and having normal life with different stories. Tell me something you would recommend a tourist to try in your country or city Nothing at least from how I see, because personally I don’t enjoy the hot weather nor the desert. Tried camping but wasn’t for me, thus why I would only recommend the Middle East if you enjoy desert camping, and it’s perfect during winter times aka December to February, depending on where you live ofc. Some areas in Saudi Arabia had mountains and it’s decent in summer, not scorching hot in other areas like UAE with their humidity level. Recommend me a song in your language I will link the song it’s lovely you can see how older versions of Arabic songs looks like National Arab Orchestra - Alf Leila wi Leila / الف ليلة وليلى - Mai Farouk / مي فاروق Recommend me a movie in your language Arabic movies aren’t my cup of tea, its either hit or miss but you can probably say the best country that do make decent arabic movies is Egypt. The majority of Egyptian movies are funny few taking the type of Tom Cruise hitman and such but not that amazing and it’s like cheap like Amazon VS Shein type of thing. Recommend me a book in your language Gosh, like the worst thing you can ask me is reading something in arabic, lol. It’s not for me tbh thus reading ANYTHING in arabic is hard for me I will admit its not impossible but I’m slow reader but when it comes to English yeah I can withstand my ground. Recommend me a website or a blog from your country (in your language or in English) I barely read arabic news or blogs there’s none in my mind, tbh. What’s your current phone or computer wallpaper? Does it have a particular meaning? It’s Neltharion :p The Aberrus wallpaper or patch picture basically . Send me a representative photo for your country or language The best picture you can use is actually mainly everything i talked about in this blog(ish?) Was about (Cooperation Council for the Arab States of the Gulf) or also known as the Gulf Cooperation Council (GCC; Arabic: مجلس التعاون الخليجي ) and it means Bahrain, Kuwait, Oman, Qatar, Saudi Arabia, and the United Arab Emirates. Read the other interviews The more you know who you are, and what you want, the less you let things upset you. — Bob #multilingualism #multiculturalism #lost in translation #lost and found in translation #interview #irish by Andrei on 2024-12-09 · 511 words · 3 mins read · 🖨️ · 🌐 This article is part of a series on: Lost and Found in Translation Français – Marine Deutsch — Æero Irish – Draí English (UK) – Appollina Arabic – Amber Dutch – Maria Serbian – 3enit Webmentions Webmentions allow conversations across the web, based on a web standard. They are a powerful building block for the decentralized social web. If you write something on your own site that links to this post, you can send me a Webmention by putting your article's URL in the form and it will appear in a list, below. Comments Leave a Comment! 58 plus 11 equals"
