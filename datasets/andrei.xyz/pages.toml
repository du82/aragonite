["https://andrei.xyz/lost-in-translation/ro"]
title = "Lost in Translation > -- Română - andrei.xyz"
description = """
Română: Pierdut în traducere Romanian translation was done by me, as it&rsquo;s my native language.
Salutare! Mă gândesc despre ce voi scrie în acest articol și în română și în engleză, și deja știu ca voi întâmpina probleme încercând să transmit același mesaj în mai multe limbi, dar cred că ăsta e și scopul acestui articol, la urma urmei. Știu că foarte mulți bloggeri scriu în limba engleză pentru a fi mai atrăgători către majoritatea oamenilor care trăiesc acum pe Pământ, în timp ce alții scriu doar în limba nativă, fie engleză, franceză, sau oricare alta, cititorii lor fiind din aceeași zonă geografică."""
full_description = "This post in other languages Prologue English / original Română Deutsch Svenska Nederlands Français ქართული ენა / Georgian русский / Russian Arabic / اَلْعَرَبِيَّةُ 한국어 / Korean Srpski / Serbian Română: Pierdut în traducere Romanian translation was done by me, as it’s my native language. Salutare! Mă gândesc despre ce voi scrie în acest articol și în română și în engleză, și deja știu ca voi întâmpina probleme încercând să transmit același mesaj în mai multe limbi, dar cred că ăsta e și scopul acestui articol, la urma urmei. Știu că foarte mulți bloggeri scriu în limba engleză pentru a fi mai atrăgători către majoritatea oamenilor care trăiesc acum pe Pământ, în timp ce alții scriu doar în limba nativă, fie engleză, franceză, sau oricare alta, cititorii lor fiind din aceeași zonă geografică. Cred că prima dată când am sesizat pierderea înțelesului unei fraze prin traducere a fost în timp ce urmăream musicalul Notre Dame de Paris acum vreo 20 de ani (încă musicalul meu preferat!) și amuzându-mă de faptul că expresia “entre chien et loup” a fost tradusa mot-a-mot ca “între câine și lup”, când aceasta este un idiom pentru “la apus”, pentru că la acea oră e greu să vezi diferența. Am scris foarte mult în limba română înainte, cam până prin 2012, dar de cand am reînceput să scriu mai mult, s-au schimbat destul de multe în viața mea, dar și în blogosferă, iar audiența mea nu mai concentrată în România. Deși două persoane care provin din țări și culturi diferite pot să împărtășească o limbă vorbită în comun, se ivesc multe ocazii unde limba e o unealtă atât de puternică încât construiește mai multe obstacole decât soluții, pentru că poate restricționa accesul la cunoaștere, cultură, artă, oameni și ideile lor. Companiile mari, ca Youtube și Netflix, deseori îngrădesc conținutul pe baza unor setări de geolocalizare, creând încă o barieră între cititor și informație. De pildă, dacă ești un român care locuiește în vestul Europei, nu poți urmări pe Netflix filmele românești pe care le poți vedea când ești pe teritoriul României. Și așa ajungi să recomanzi prietenilor niște lucruri la care ei nu vor avea poate niciodată acces, decât dacă vor fi fizic acolo. Cam stupid, dacă te gândești că trăim într-o eră digitală, chiar și luând în considerare existența VPN-urilor. Așadar, dacă ai un blog, un site, o companie sau o comunitate, nu încuia lumea pe afară doar bazându-te pe locul de unde vin, cum face staples.com, de exemplu, pentru vizitatorii din Uniunea Europeană. La serviciu, pe forumuri, citind bloguri, conversând pe canale de IRC sau jucând World of Warcraft, am avut ocazia să întâlnesc oameni minunați din întreaga lume, să le explorez cultura, muzica, filmele, literatura, ideile, modelele de viață și legendele, ajutându-ma să-mi extind orizonturile dincolo de orice imaginație. World Wide Web-ul devine din ce în ce mai vast, dar în cele din urmă, a fi multilingual sau nu în acest spațiu infinit e o alegere personală. Poți vorbi engleză, japoneză, sau chiar klingoniană dacă vrei, totul e decizia ta personală, iar la un moment dat, nici nu mai e vorba despre limbă. E despre a înțelege cui te adresezi și dacă vrei să împărtășești mesajul, cultura și cunoștințele tale dincolo de niște granițe ce au fost trasate arbitrar de niște regi pe o hartă acum două mii de ani. Așa că în loc să filozofez prea mult despre ce înseamnă să fii multi-lingual pe Internet, am să vă sfătuiesc să fiți voi înșivă, să învățați să priviți dincolo de orizont, pentru că lucrurile pe care le puteți întâlni acolo pot fi minunate. Păstrând o minte deschisă putem păstra un internet deschis. Mulțumesc! This post in other languages Prologue English / original Română Deutsch Svenska Nederlands Français ქართული ენა / Georgian русский / Russian Arabic / اَلْعَرَبِيَّةُ 한국어 / Korean Srpski / Serbian The more you know who you are, and what you want, the less you let things upset you. — Bob #lost in translation #multilingualism by Andrei on 2024-10-27 · 58