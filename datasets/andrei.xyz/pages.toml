description = """
Arabic / اَلْعَرَبِيَّةُ: ضائع في الترجمة Translation in Arabic kindly provided by Amber
سلام عليكم انا قاعد افكر بشنو راح أكتب في هذا المقال باللغتين الإنجليزية والرومانية في نفس الوقت، واعرف إن رح أواجه مشاكل في محاولة إرسال نفس الرسالة بلغات متعددة، بس أعتقد أن هذه هي النقطة الأساسية في المقال، بعد كل شيء. أعرف أن معظم المدونين يكتبون باللغة الإنجليزية ليكونوا أكثر جاذبية لغالبية الأشخاص الذين يعيشون الآن، بينما يكتب البعض بلغتهم الأم، سواء كانت الإنجليزية أو الفرنسية أو أي لغة أخرى، لأن قرائهم أقرب جغرافيًا."""
full_description = '''This post in other languages Prologue English / original Română Deutsch Svenska Nederlands Français ქართული ენა / Georgian русский / Russian Arabic / اَلْعَرَبِيَّةُ 한국어 / Korean Srpski / Serbian Arabic / اَلْعَرَبِيَّةُ: ضائع في الترجمة Translation in Arabic kindly provided by Amber سلام عليكم انا قاعد افكر بشنو راح أكتب في هذا المقال باللغتين الإنجليزية والرومانية في نفس الوقت، واعرف إن رح أواجه مشاكل في محاولة إرسال نفس الرسالة بلغات متعددة، بس أعتقد أن هذه هي النقطة الأساسية في المقال، بعد كل شيء. أعرف أن معظم المدونين يكتبون باللغة الإنجليزية ليكونوا أكثر جاذبية لغالبية الأشخاص الذين يعيشون الآن، بينما يكتب البعض بلغتهم الأم، سواء كانت الإنجليزية أو الفرنسية أو أي لغة أخرى، لأن قرائهم أقرب جغرافيًا. اتوقع ان المرة الأولى التي شفت فيها ضيعت المعنى في الترجمة كانت لما شاهدة مسرحية Notre Dame de Paris الموسيقية منذ حوالي 20 عامًا (لا تزال مسرحيتي الموسيقية المفضلة!) والضحك لأن عبارة “entre chien et loup” ترجمه الحرفية هي “بين الكلب والذئب"، بينما كانت في الواقع تعبيرًا اصطلاحيًا عن “عند الغروب"، لأنه في ذلك الوقت من اليوم، لا يمكن للمرء أن يرى الفرق. كتبت وايد باللغة الرومانية من قبل، حتى عام 2012 أو نحو ذلك، بس من بدأت اكتب، تغير الكثير في حياتي وفي عالم المدونات، والآن لم يعد جمهوري يتركز في رومانيا. وعلى الرغم من أن شخصين قادمين من بلدان أو خلفيات مختلفة يمكن أن يتشاركا لغة مشتركة، فهناك العديد من المناسبات حيث تكون اللغة أداة قوية جدًا لدرجة أنها تبني جدرانًا أكثر من الجسور، لأنها يمكن أن تحد من وصولك إلى المعرفة أو الثقافة أو الفن أو الأشخاص وأفكارهم. غالبًا ما تقيد الشركات الكبرى مثل Youtube وNetflix المحتوى بناءً على مخططات تحديد الموقع الجغرافي، مما يضع جدارًا آخر بين القارئ والمعلومات. على سبيل المثال، إذا كنت شخصًا رومانياً تعيش في أوروبا الغربية، فلن تتمكن من مشاهدة الأفلام الرومانية على Netflix التي يمكنك مشاهدتها أثناء وجودك في رومانيا. لذا فإنك ستوصي أصدقاءك ببعض الأشياء التي لا يمكنهم الوصول إليها أبدًا، ما لم يذهبوا إلى هناك فعليًا. شئ غبي بصراحه ، لأننا نعيش في العصر الرقمي، حتى مع وجود شبكات VPN.، إذا كنت تدير مدونة أو موقعًا إلكترونيًا أو شركة أو مجتمعًا، فلا تستبعد الأشخاص بناءً على مكان تواجدهم، كما تفعل شركة staples.com للزوار القادمين من الاتحاد الأوروبي. في العمل، وفي المنتديات، وقراءة المدونات، والدردشة على قنوات IRC أو لعب World of Warcraft، أتيحت لي الفرصة لمقابلة أشخاص رائعين من جميع أنحاء العالم، و أكتشفت ثقافتهم وموسيقاهم وأفلامهم وكتبهم وأفكارهم ونماذجهم ونجومهم وأساطيرهم، وقد ساعدني هذا في توسيع آفاقي إلى ما هو أبعد من خيالي. تتوسع الانترنت قاعد يكبر كل يوم، وفي النهاية، هو مجرد اختيار شخصي لكوني شخص متعدد اللغات في هذه المساحة اللانهائية. تقدر ان تتكلم باللغة الإنجليزية واليابانية وحتى الكلينجونية إذا تبي، الأمر كله متروك للاختيارك الشخصي، وفي مرحلة ما لا يتعلق الأمر باللغة على الإطلاق. يتعلق الأمر بفهم من هو جمهورك وما إذا كنت مهتمًا بنشر رسالتك وثقافتك ومعرفتك خارج بعض الحدود التي وضعها بعض الملوك بشكل تعسفي على خريطة منذ ألفي عام. لذا، بدلاً من الإفراط في الفلسفة حول ما يعنيه أن تكون متعدد اللغات على الإنترنت، أعتقد أنه من الأفضل أن أشاركك النصيحة بأن تكون على طبيعتك وأن تتعلم النظر إلى ما هو أبعد من الأفق، لأن الأشياء التي قد تكتشفها قد تكون رائعة. إن إبقاء العقل منفتحًا يبقي الإنترنت مفتوحًا. شكرا This post in other languages Prologue English / original Română Deutsch Svenska Nederlands Français ქართული ენა / Georgian русский / Russian Arabic / اَلْعَرَبِيَّةُ 한국어 / Korean Srpski / Serbian The more you know who you are, and what you want, the less you let things upset you. — Bob #lost in translation #multilingualism by Andrei on 2024-10-27 · 505 words · 3 mins read · 🖨️ · 🌐 Webmentions Webmentions allow conversations across the web, based on a web standard. They are a powerful building block for the decentralized social web. If you write something on your own site that links to this post, you can send me a Webmention by putting your article's URL in the form and it will appear in a list, below. Comments Leave a Comment! 58 plus 11 equals'''
