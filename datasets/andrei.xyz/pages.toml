Nederlands: Verloren in vertaling Translation in Dutch was kindly provided by Maria.
Hallo! Als ik denk aan wat ik moet schrijven in deze blog, denk ik tegelijkertijd in het Engels en Roemeens. Ik weet nu al dat het lastig zal zijn om deze boodschap te versturen in meerdere talen, maar dat is dan ook de boodschap van deze blog. Ik weet dat de meeste bloggers in het Engels schrijven om zo veel mogelijk mensen op aarde te bereiken, terwijl anderen juist in hun moedertaal schrijven, of dat nu Engels, Frans of welke dan ook is, omdat hun lezers zich geografisch gezien dichterbij bevinden."""
full_description = "This post in other languages Prologue English / original Română Deutsch Svenska Nederlands Français ქართული ენა / Georgian русский / Russian Arabic / اَلْعَرَبِيَّةُ 한국어 / Korean Srpski / Serbian Nederlands: Verloren in vertaling Translation in Dutch was kindly provided by Maria. Hallo! Als ik denk aan wat ik moet schrijven in deze blog, denk ik tegelijkertijd in het Engels en Roemeens. Ik weet nu al dat het lastig zal zijn om deze boodschap te versturen in meerdere talen, maar dat is dan ook de boodschap van deze blog. Ik weet dat de meeste bloggers in het Engels schrijven om zo veel mogelijk mensen op aarde te bereiken, terwijl anderen juist in hun moedertaal schrijven, of dat nu Engels, Frans of welke dan ook is, omdat hun lezers zich geografisch gezien dichterbij bevinden. Ik geloof dat tijdens het kijken naar Notre Dame de Paris (nu nog steeds mijn favoriete musical!), zo’n 20 jaar geleden, het de eerste keer was dat ik iets in vertaling verloren zag gaan. Ik moest lachen omdat de uitdrukking “entre chien et loup” letterlijk vertaald werd naar “tussen hond en wolf” terwijl het “bij schemering” betekent, omdat op dat tijdstip niemand het verschil zou kunnen zien. Ik schreef in die tijd veel in het Roemeens, tot ongeveer 2012. Maar sinds ik hier weer meer ben gaan schrijven, is er veel veranderd in mijn leven en de blogosphere. Nu zitten mijn lezers niet langer alleen in Roemenië. Hoewel 2 individuen uit verschillende landen kunnen komen of verschillende achtergronden hebben, kunnen zij wel een taal delen. Er zijn veel situaties waarin taal een middel is dat eerder muren dan bruggen bouwt omdat het toegang tot kennis, cultuur, kunst en mensen en hun ideeën in de weg staat. Grote bedrijven als Youtube en Netflix beperken vaak hun content gebaseerd op locatie, zodat er wederom een drempel opgeworpen wordt tussen de lezer en de informatie. Bijvoorbeeld, als een Roemeen woonachtig in West Europa kun je op Netflix niet de Roemeense films bekijken die je in Roemenië wel zou kunnen zien. Dus zou je aan vrienden dingen aan kunnen raden waar zij helemaal geen toegang toe hebben tenzij ze er fysiek heengaan. Behoorlijk dom, want we leven in een digitale wereld waarin ook dingen als VPNs bestaan. Dus of je nou een blog, website, bedrijf of gemeenschap runt, sluit mensen niet uit zoals staples.com doet bij bezoekers van buiten de Europese Unie. Op het werk, op fora, het lezen van blogs, bij het chatten op IRC channels en het spelen van World of Warcraft, heb ik de mogelijkheid gehad om geweldige mensen uit de hele wereld te leren kennen met daarbij hun cultuur, muziek, films, boeken, ideeën en rolmodellen, sterren en legendes. Dit hielp mij mijn horizon te verbreden tot ver buiten mijn verbeelding. Het wereldwijde web wordt elke dag een stukje wijder, maar tenslotte blijft het een keuze om meertalig te zijn in een oneindig grote plek. Je kunt Engels, Japans of zelf Klingon spreken als je wilt, het is allemaal een persoonlijke keuze. Op een gegeven moment gaat het niet meer over de taal die je spreekt, maar over het begrijpen van je publiek en of je het belangrijk vindt om je boodschap, je cultuur, je kennis buiten de landsgrenzen te delen die er tweeduizend jaar geleden door enkele koningen zijn neergelegd. Dus in plaats van op het internet te filosoferen over wat het betekent om meertalig te zijn, kan ik beter adviseren om vooral jezelf te zijn en over de horizon heen te kijken, omdat de dingen die je dan ontdekt fantastisch kunnen zijn. Met een open geest houd je het internet ook open. Bedankt! This post in other languages Prologue English / original Română Deutsch Svenska Nederlands Français ქართული ენა / Georgian русский / Russian Arabic / اَلْعَرَبِيَّةُ 한국어 / Korean Srpski / Serbian The more you know who you are, and what you want, the less you let things upset you. — Bob #lost in translation #multilingualism by Andrei on 2024-10-27 · 577 words · 3 mins read · 🖨️ · 🌐 Webmentions Webmentions allow conversations