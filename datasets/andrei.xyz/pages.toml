["https://andrei.xyz/lost-in-translation/fr"]
title = "Lost in Translation > -- Français - andrei.xyz"
description = """
Français: Perdu dans la traduction The French translation was provided by ma chère Marine.
Bonjour ! Je réfléchis à quoi écrire à la fois en anglais et en roumain et je sais déjà que je vais avoir des difficultés pour essayer de transmettre le même message dans différents langages, mais je crois que c’est le sujet de ce post après tout. Je sais que la plupart des bloggeurs écrivent en anglais pour être plus attractif pour la majorité des personnes sur Terre, alors que d’autres écrivent simplement dans leur langue maternelle, que ce soit l’anglais, le français, ou autre, parce que leurs lecteurs sont géographiquement plus proches."""
full_description = "This post in other languages Prologue English / original Română Deutsch Svenska Nederlands Français ქართული ენა / Georgian русский / Russian Arabic / اَلْعَرَبِيَّةُ 한국어 / Korean Srpski / Serbian Français: Perdu dans la traduction The French translation was provided by ma chère Marine. Bonjour ! Je réfléchis à quoi écrire à la fois en anglais et en roumain et je sais déjà que je vais avoir des difficultés pour essayer de transmettre le même message dans différents langages, mais je crois que c’est le sujet de ce post après tout. Je sais que la plupart des bloggeurs écrivent en anglais pour être plus attractif pour la majorité des personnes sur Terre, alors que d’autres écrivent simplement dans leur langue maternelle, que ce soit l’anglais, le français, ou autre, parce que leurs lecteurs sont géographiquement plus proches. Je pense que la première fois que j’ai expérimenté d’avoir été perdu dans le sens de la traduction c’était en regardant la comédie musicale Notre Dame de Paris il y a à peu près 20 ans (c’est toujours ma comédie musicale préférée !), et d’avoir rigolé que la phrase « between dog and wolf » a été littéralement traduite par « entre chien et loup », alors que c’était une expression pour dire « au crépuscule » car à ce moment de la journée, on ne peut pas voir la différence. J’ai beaucoup écrit en roumain à l’époque, jusqu’en 2012 à peu près, mais depuis que j’ai recommencé à écrire ici, beaucoup de choses ont changé que ce soit dans ma vie ou dans la blogosphère maintenant que mon audience n’est plus centralisée en Roumanie. Bien que deux personnes venant de pays différents ou de milieux différents, ils peuvent partager une langue commune, il y a beaucoup de moments où le langage est un outil si puissant qu’il construit plus de murs que de ponts, et restreint l’accès au savoir, la culture, l’art, ou les gens et leurs idées. Les grandes entreprises comme YouTube et Netflix restreignent du contenu selon un schéma de géolocalisation, mettant un autre mur entre le lecteur et l’information. Par exemple, si vous êtes un Roumain vivant dans l’Europe occidentale, vous ne pourrez pas voir les films roumains sur Netflix que l’on peut voir en étant en Roumanie. Vous allez donc recommander à des amis des choses qu’ils ne pourront même pas voir, à moins d’être physiquement là. C’est un peu idiot, sachant que l’on vit à l’ère digitale, avec l’existence des VPN. Donc si vous tenez un blog, un site internet, une entreprise ou une communauté, n’excluez pas les gens en fonction d’où ils sont, comme fait par exemple staples.com pour les visiteurs venant de l’Union Européenne. A travers le travail, les forums, en lisant des blogs, en chattant par IRC (Internet Relay Chat = discussion relayée par internet) ou en jouant à World of Warcraft, j’ai eu l’occasion de rencontrer des personnes merveilleuses venant des quatre coins du monde, d’apprendre leur culture, leur musique, films, livres, idées, leurs modèles, superstars et légendes, et ça a aidé à étendre ma vision au-delà de mon imagination. Le World Wide Web s’agrandit de jour en jour, et finalement c’est juste un choix personnel d’être multilingue dans cet espace infini. Vous pouvez parler anglais, japonais, même klingon si vous le vouliez, ça ne dépend que de votre choix personnel, et à un moment donné, ce n’est même plus du tout une question de langue. C’est la compréhension de qui est votre audience et si vous tenez à diffuser votre message, votre culture et votre savoir au-delà des frontières qui ont été faites arbitrairement par quelques rois sur une carte il y a deux mille ans. Alors au lieu de trop philosopher sur ce que signifie être multilingue sur internet, je pense que c’est mieux que je partage le conseil d’être soi-même, et d’apprendre à voir au-delà de ce que nous pensons connaitre, parce que les choses que vous pourriez découvrir peuvent être incroyable. Garder l’esprit ouvert garde l’Internet ouvert. Merci ! This post in other languages Prologue English / original Română Deutsch Svenska Nederlands Français ქართული ენა / Georgian русский / Russian Arabic / اَلْعَرَبِيَّةُ 한국어 / Korean Srpski / Serbian The more you know who you are, and what you want, the less you let things upset you. — Bob #lost in translation #multilingualism by Andrei on 2024-10-27 · 640 words · 4 mins read · 🖨️ · 🌐 Webmentions Webmentions allow conversations across the web, based on a web standard. They are a powerful building block for the decentralized social web. If you write something on your own site that links to this post, you can send me a Webmention by putting your article's URL in the form and it will appear in a list, below. Comments Leave a Comment! 58 plus 11 equals"
