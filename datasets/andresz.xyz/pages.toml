description = "Lainring is a decentralized webring created by the users of Lainchan; an anonymous image board."
full_description = '''Lainring Ándros 2023-07-24 164 words One minute Contents How to join The Lainring Lainring is a decentralized webring created by the users of Lainchan; an anonymous image board. Lainring is quite a big reason of why I have a website in the first place. Ever since visiting the Lainring, I fell in love with the concept, and wanted to be part of it. So here we are. Being in a webring does NOT mean I endorse or support the points of views or contents of the websites in said webring. How to join Go to the Lainchan thread and link your website. Add a 240x60 button. This page requires JavaScript to be enabled in your web browser. The Lainring Here’s the Lainring in all its glory. ... Loading, please wait ... document.addEventListener("DOMContentLoaded", function(event) { /* Try to retrieve the json file */ fetch('/lainring.json').then(res => res.json()).then((data) => { let out = ''; /* For each element in the JSON, build an anchor-image DOM structure */ data.items.forEach(element => { /* This string is split in multiple lines for readability */ out += '<a title="' + element.title + '" ' + 'href="' + element.url + '">' + '<img src="' + element.img + '" alt="' + element.title + '" /></a>'; }); /* Inject the DOM structure into the element with the id 'lainring' */ document.getElementById('lainring').innerHTML = out; }).catch(err => { /* throw an error */ throw err }); }); Thanks to Sizeof(cat) for, like much of my site, helping me learn how to show this. If you want to add the Lainring to your site, go check out his version of the lainring. He includes there a quick guide on how to set it up. Updated on 2023-07-24 Read Markdown Webrings, Lain, Lainchan, Community Back | Home Links I love Technology'''
