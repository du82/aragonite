full_description = "I love Technology Ándros published on 2023-07-26Always and Forever Read More Technology, Personal, Education, Cs, Computers, Computer, Science, Engineering Lainring Ándros published on 2023-07-24Lainring is a decentralized webring created by the users of Lainchan; an anonymous image board. Read More Webrings, Lain, Lainchan, Community What I've learned from setting up this website Ándros published on 2023-07-23This was so hard. Read More Software, Webdev, Learning The road of the aspiring Software Engineer Andros published on 2023-07-20 It feels quite interesting to be writing a blog post for the first time in my life. This website was actually an assignment from a course on Computer Science I’m going through. But I figured it was quite a good chance to actually get my homepage up and running. It is widely believed that a Computer Scientist or Software Engineer or whoever working in this industry needs* a personal website; not only to stand out and have a way to easily share your work and skills with other people, but also, the existence of the website itself shows some of your skills. This is good and all and I needed to catch up with other Software Engineers by also having my own website; but leaving aside what I’ve mentioned, I have to say it is also a pretty great feeling to have something to call my own. My own little corner of the internet. Even if no one reads it. Read More Update, Personal, Software, Engineering"
