["https://andresz.xyz/projects"]
title = "Projects - Ándros"
full_description = "Projects Ándros 2023-08-08 448 words 3 minutes Contents Personal projects Hidden message encoder and decoder in PNG Files Web Personal website Online courses / self learning Projects Blog App with Django CS50 finance School Projects Stop and Wait ARQ implementation Using speech recognition to play songs on Spotify Intro Here’s a list of the projects I’ve worked on. I might start adding projects as I start working on them. Here’s right away a link to my GitHub in case you just want to quickly jump there: Github Personal projects Hidden message encoder and decoder in PNG Files Command Line program that takes a message from the user and hides (encodes) it inside a seemingly normal PNG image. Intermediate level project written in Rust. Web Personal website My personal website, the one you’re reading right now. Hosted at https://www.andresz.xyz Server is running OpenBSD 7.4 Powered by Hugo Online courses / self learning Projects Blog App with Django Implemented a Blog app for writing and reading posts. Posts have tags and the readers can find other posts that share the same tag clicking on every tag. All users can read posts but only the admin can write new posts or add new tags. Includes a working user authentication system. Posts can be edited by the author. This web app uses Python (Django), HTML, SQLite3 and some basic CSS. It was a good learning exercise especially for Django. CS50 finance Implemented a simulator for managing portfolios of stocks, for Harvard’s CS50 online course. Users can “buy” and “sell” stocks from real companies (with the stock’s real prices) and see their balances and total cash. The information of the stocks gets pulled from Yahoo Finance. This web app uses Python (Flask), HTML + Jinja, SQLite3 and some basic CSS. Code: https://github.com/UberChili/CS50Finance (You can also check out my GitHub profile from there) School Projects I did many school projects but I either lost the code for many of them, or don’t think they’re important or interesting enough to be included here. Stop and Wait ARQ implementation Also referred to as alternating bit protocol, is a method in telecommunications to send information between two connected devices. It ensures that information is not lost due to dropped packets and that packets are received in the correct order. Wrote both a Server and a Client for the correct functionality. Some tests consisted in disconnecting the internet connection between the client and the server. The program was able to successfully transfer files of large sizes between the server and the client, even when the connection was lost. Written in C for my Computer Networks course. Code: https://github.com/UberChili/Stop-wait (You can also check out my GitHub profile from there) Using speech recognition to play songs on Spotify Just a simple project for my AI Laboratory. I used some Python libraries like SpeechRecognition, Spotipy, Pyautogui and some others to receive and recognize speech from the user using the microphone and play the desired song through Spotify. Code: https://github.com/UberChili/spotify-player-by-speech-recognition Updated on 2023-08-08 Read Markdown Projects, Software, Software Engineering, Engineering, Tech, Coding Back | Home Resume Two sum in C"
