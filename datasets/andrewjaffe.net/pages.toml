full_description = "Music Wussy (Best Band in America?) Music defjaf · May 5, 2016 It’s been a year since the last entry here. So I could blog about the end of Planck, the first observation of gravitational waves, fatherhood, or the horror (comedy?) of the US Presidential election. Instead, it’s going to be rock ’n’ roll, though I don’t know if that’s because it’s too important, or not important…Read More Songs about f*&%ing Music defjaf · Jun 21, 2013 First, my apologies that I couldn’t resist the almost not-safe-for-work title, especially to those expecting posts about astrophysics and cosmology rather than a reference to a 1987 record by Big Black (which it’s worth pointing out can be found in its entirety on YouTube). But this is not a post about Big Black. Rather, it’s…Read More SDSS 1416+13B Music, Science defjaf · Dec 12, 2012 It’s not that often that I can find a reason to write about both astrophysics and music — my obsessions, vocations and avocations — at the same time. But the recent release of Scott Walker‘s (certainly weird, possibly wonderful) new record Bish Bosch has given me just such an excuse: Track 4 is a 21-minute…Read More Harmony in the Universe Music, Science defjaf · Oct 21, 2012 Cosmology fans in and around London: Please come here my colleague Jean–Philippe Uzan, visiting us from Paris, who will talk about “ Harmony in the Universe: between science and music” this coming Thursday, 25 October 2012 in the Huxley Building here at Imperial College. It’s free, but please contact us at astro-outreach@imperial.ac.uk if you’re going…Read More Cage 100 Music defjaf · Sep 5, 2012 Today (September 5), John Cage would have been 100 years old. A few weeks ago, I went to the John Cage Centenary Celebration at the BBC Proms. Cage is probably best know for 4′33″, his infamous 1952 piece consisting of four minutes and thirty-three seconds of silence (originally in three movements — although he eventually…Read More Expat playlist Music defjaf · Jul 4, 2012