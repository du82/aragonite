full_description = "Miscellanea The Only Gaijin in the Onsen Miscellanea defjaf · Jan 15, 2025 After living in Japan for about four months, we left in mid-December. We miss it already. One of the pleasures we discovered is the onsen, or hot spring. Originally referring to the natural volcanic springs themselves, and the villages around them, there are now onsens all over Japan. Many hotels have an onsen, and most…Read More Discovering Japan Miscellanea, Science defjaf · Dec 17, 2024 My old friend Marc Weidenbaum, curator and writer of disquiet.com, reminded me, in his latest post, of the value of blogging. So, here I am (again). Since September, I have been on sabbatical in Japan, working mostly at QUP (International Center for Quantum-field Measurement Systems for Studies of the Universe and Particles) at the KEK…Read More It’s been a while Blog, Miscellanea, News, Politics, Science defjaf · May 20, 2024 If you’re reading this, then you might realise that I haven’t posted anything substantive here since 2018, commemorating the near-end of the Planck collaboration. In fact it took us well into the covid pandemic before the last of the official Planck papers were published, and further improved analyses of our data continues, alongside the use…Read More Python Bug Hunting Miscellanea defjaf · May 19, 2017 This is a technical, nerdy post, mostly so I can find the information if I need it later, but possibly of interest to others using a Mac with the Python programming language, and also since I am looking for excuses to write more here. (See also updates below.) It seems that there is a bug…Read More The Sick Rose Art, Miscellanea defjaf · Jun 24, 2016 O Rose thou art sick. The invisible worm, That flies in the night In the howling storm: Has found out thy bed Of crimson joy: And his dark secret love Does thy life destroy. —William Blake, Songs of ExperienceRead More Atheism, naturalism, and the way things ought to be Miscellanea, Politics defjaf · Mar 9, 2015 In an occasionally thoughtful but mostly silly attempted takedown of the so-called New Atheists (Dawkins, Dennett, Harris and such), philosopher John Gray writes that there is an irresolvable contradiction between viewing religion naturalistically — as a human adaptation to living in the world — and condemning it as a tissue of error and illusion. -John…Read More Oscillators, Integrals, and Bugs Miscellanea, Science defjaf · Nov 24, 2014 [Update: The bug seems fixed in the latest version, 10.0.2.] I am in my third year teaching a course in Quantum Mechanics, and we spend a lot of time working with a very simple system known as the harmonic oscillator — the physics of a pendulum, or a spring. In fact, the simple harmonic oscillator…Read More Loncon 3 Miscellanea, Science defjaf · Aug 15, 2014 Briefly (but not brief enough for a single tweet): I’ll be speaking at Loncon 3, the 72nd World Science Fiction Convention, this weekend (doesn’t that website have a 90s retro feel?). At 1:30 on Saturday afternoon, I’ll be part of a panel trying to answer the question “What Is Science?” As Justice Potter Stewart once…Read More Around Asia in search of a meal Miscellanea defjaf · Mar 10, 2014 I’m recently back from my mammoth trip through Asia (though in fact I’m up in Edinburgh as I write this, visiting as a fellow of the Higgs Centre For Theoretical Physics). I’ve already written a little about the middle week of my voyage, observing at the James Clerk Maxwell Telescope, and I hope to get…Read More TimeWave — Quest for the Grail: An International Adventure Game Art, Miscellanea defjaf · Apr 9, 2013 About a year ago, I wrote about TimeWave a festival of art, science and technology coming this May to London, with tendrils snaking out to New York and LA. As part of the festival, we’re organising Quest for the Grail: An International Adventure Game, later this month: from noon to 5pm in London and right…Read More 1 2 3 … 11 Next Page Search Search Recent Posts The Only Gaijin in the Onsen