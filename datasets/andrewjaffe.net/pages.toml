full_description = "Coming November, 2025 from Yale University Press Author defjafPosted on 26 February 202526 February 2025Format StatusCategories Uncategorised First loaf in six months. (Needs work.) Author defjafPosted on 4 February 2025Format StatusCategories Uncategorised I am very excited to be sitting down with a cup of coffee and an actual print copy of the Sunday New York Times (for all its well-documented faults of late). Author defjafPosted on 26 January 202526 January 2025Format StatusCategories Uncategorised R.I.P. Garth Hudson. The Band has meant a lot to me over the years. Author defjafPosted on 21 January 2025Format StatusCategories Uncategorised We have somehow managed to schedule our train from Virginia to New York for today, requiring us to travel into DC on inauguration day. Trying to retain a sense of charity toward my fellow Americans Author defjafPosted on 20 January 2025Format StatusCategories Uncategorised In DC, on a Capitol tour with my expat family. Easy & appropriate to be cynical about symbols of democracy 5 days before the awful inauguration. But somber & moving, even—or especially—speeches by senate Democrats excoriating Republican tax cuts for the wealthy disguised as populism. Author defjafPosted on 16 January 2025Format StatusCategories Uncategorised Done: Long-tail boat, ferry, taxi, dash through the airport, 2-hour flight, taxi, hotel, food court dinner, pool, taxi, 9 1/2-hour flight, 6-hour airport hotel sleep. Still to come: 14-hour flight, back in the USA. Author defjafPosted on 14 January 2025Format StatusCategories Uncategorised On the bus from Siem Reap (Cambodia) to Bangkok. Author defjafPosted on 2 January 2025Format StatusCategories Uncategorised We were some of the first travellers on the new Ho Chi Minh City metro, open less than a week. Author defjafPosted on 29 December 2024Format StatusCategories Uncategorised Overnight train from Da Nang to Ho Chi Minh City. Author defjafPosted on 26 December 2024Format StatusCategories Uncategorised"
