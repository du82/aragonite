full_description = "Art The Sick Rose Art, Miscellanea defjaf · Jun 24, 2016 O Rose thou art sick. The invisible worm, That flies in the night In the howling storm: Has found out thy bed Of crimson joy: And his dark secret love Does thy life destroy. —William Blake, Songs of ExperienceRead More TimeWave — Quest for the Grail: An International Adventure Game Art, Miscellanea defjaf · Apr 9, 2013 About a year ago, I wrote about TimeWave a festival of art, science and technology coming this May to London, with tendrils snaking out to New York and LA. As part of the festival, we’re organising Quest for the Grail: An International Adventure Game, later this month: from noon to 5pm in London and right…Read More Causerie – The Creation: On Cosmogony and Cosmology Art defjaf · May 30, 2012 A quick alert to any friends or followers in or near Rotterdam this weekend: I’ll be participating in a series of dialogs supporting The Humans, a piece of theatrical performance art sponsored by and shown at the Witte de With Center for Contemporary Art. The production, which will encompass a series of symposia with the…Read More TimeWave Art defjaf · Apr 4, 2012 I’ve recently become involved in TimeWave, a theatre, art and technology festival to be inaugurated up in Manchester this coming November 19-24. It has been set up by the excellent lonyla (London-NY-LA) artists’ network founded by J. Dakota Powell, another American transplanted to London, taking advantage of the connections that we rootless cosmopolitans have gathered…Read More Constellations Art, Science defjaf · Jan 19, 2012 Many plays about science suffer from trying to do too much, telling a story while teaching science, but Nick Payne‘s two-hander “Constellations“, now on at the Royal Court Theatre in London, has science and a scientist at its center, adding to the drama, not distracting us with jargon or science fictional twists. “Constellations” is the…Read More The Controversy about Hypothesis Testing Art, Science defjaf · Dec 20, 2011 I spent a quick couple of days last week at the The Controversy about Hypothesis Testing meeting in Madrid. The topic of the meeting was indeed the question of “hypothesis testing“, which I addressed in a post a few months ago: how do you choose between conflicting interpretations of data? The canonical version of this…Read More Urban Sputnik, Live at Imperial Art, Science defjaf · Nov 4, 2011 Urban Sputnik, our collaboration with Vanessa Harden and Dominic Southgate of Gammaroot Design is currently on display at Imperial College in the main entrance of the Norman Foster-designed business school, located on Exhibition Road in London, just up the street from the Science Museum, the V&A Museum and the Natural History Museum. I’ve discussed the…Read More Watch Me Move Art defjaf · Aug 21, 2011 I took a bit of time out from the astrophysics this week to head over to the Barbican for the “Watch Me Move” exhibition: more than a hundred years of film and video animation. From an 1880s hand-coloured “Pierrot” and Winsor McCay‘s 1911 animated version of his newspaper comic Little Nemo, to Toy Story and…Read More Urban Sputnik Art, Science defjaf · Jul 22, 2011 Urban Sputnik is a new interactive cosmology exhibit currently showing at the Royal Institution. It was created by Vanessa Harden and Dominic Southgate of Gammaroot Design collaborating with some Imperial Astrophysicists: me, Dave Clements and Roberto Trotta. Unlike my other recent foray into the science/art overlap, this one is a bit more didactic (that is,…Read More Beyond Entropy and Ourselves Art, Science defjaf · May 4, 2011 Last summer, I helped make a (fake) time machine, an exercise in “creative misinterpretation” (in the words of my architect partner, Shin Egashira). This was part of the Beyond Entropy project organized by the Architecture Association — we showed it then in Venice but now Londoners will get a chance to see the work in…Read More 1 2 3 … 6 Next Page Search Search Recent Posts The