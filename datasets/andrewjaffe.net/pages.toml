title = "The Random Universe – by Andrew Jaffe"
full_description = "Andrew Jaffe I am a cosmologist and astrophysicist, in the Department of Physics at Imperial College London, where I am also the Director of the Imperial Centre for Inference and Cosmology. I am especially interested in the interpretation and analysis of cosmological data using principled Bayesian statistical techniques. I have written a book, The Random Universe: How Models and Probability Help Us Make Sense of the Cosmos, due out in November 2025 from Yale University Press! I also occasionally express my opinions on music, politics, parenthood, or technology. Twitter/X: @defjaf Mastodon: @jaffe@mastodon.social Bluesky: @defjaf.bsky.social Threads: @defjaf Blog: Leaves on the Line Microblog"
