title = "Leaves on the Line – Page 3 – The Random Universe"
full_description = "Spring & Summer Science Science defjaf · Apr 9, 2014 As the academic year winds to a close, scientists’ thoughts turn towards all of the warm-weather travel ahead (in order to avoid thinking about exam marking). Mostly, that means attending scientific conferences, like the upcoming IAU Symposium, Statistical Challenges in 21st Century Cosmology in Lisbon next month, and (for me and my collaborators) the usual…Read More Gravitational Waves? Science defjaf · Mar 20, 2014 [Uh oh, this is sort of disastrously long, practically unedited, and a mixture of tutorial- and expert-level text. Good luck. Send corrections.] It’s been almost exactly a year since the release of the first Planck cosmology results (which I discussed in some depth at the time). On this auspicious anniversary, we in the cosmology community…Read More Around Asia in search of a meal Miscellanea defjaf · Mar 10, 2014 I’m recently back from my mammoth trip through Asia (though in fact I’m up in Edinburgh as I write this, visiting as a fellow of the Higgs Centre For Theoretical Physics). I’ve already written a little about the middle week of my voyage, observing at the James Clerk Maxwell Telescope, and I hope to get…Read More Observing, days 3-4: galaxies and blank fields Science defjaf · Feb 21, 2014 After a couple of days of lousy weather, the sky cleared up and dried out Wednesday. Eventually, we got down to τ<0.08 — not quite the best possible conditions, but good enough for almost anything we might want to do. We started out slightly worse than that, but that meant we got to observe more…Read More Observing, days 1-2 Science defjaf · Feb 19, 2014 I am sitting in the control room of the James Clerk Maxwell Telescope (JCMT), 14,000 feet up Mauna Kea, on Hawaii’s Big Island. I’m here to do observations for the SCUBA-2 Cosmology Legacy Survey (CLS). I’m not really an observer — this is really my first time at a full-sized, modern telescope. But much of…Read More meTube Academia, Science defjaf · Jan 22, 2014 Some time last year, Physics World magazine asked some of us to record videos discussing scientific topics in 100 seconds. Among others, I made one on cosmic inflation and another on what scientists can gain from blogging, which for some reason has just been posted to YouTube, and then tweeted about by FQXi (without which…Read More Academic Blogging Still Dangerous? Academia defjaf · Dec 5, 2013 Nearly a decade ago, blogging was young, and its place in the academic world wasn’t clear. Back in 2005, I wrote about an anonymous article in the Chronicle of Higher Education, a so-called “advice” column admonishing academic job seekers to avoid blogging, mostly because it let the hiring committee find out things that had nothing…Read More Teaching mistakes Academia defjaf · Oct 8, 2013 The academic year has begun, and I’m teaching our second-year Quantum Mechanics course again. I was pretty happy with last year’s version, and the students didn’t completely disagree. This year, there have been a few changes to the structure of the course — although not as much to the content as I might have liked…Read More Songs about f*&%ing Music defjaf · Jun 21, 2013 First, my apologies that I couldn’t resist the almost not-safe-for-work title, especially to those expecting posts about astrophysics and cosmology rather than a reference to a 1987 record by Big Black (which it’s worth pointing out can be found in its entirety on YouTube). But this is not a post about Big Black. Rather, it’s…Read More The next generation of large satellites: PRISM and/or eLISA? Science defjaf · May 24, 2013 Today was the deadline for submitting so-called “White Papers” proposing the next generation of the European Space Agency satellite missions. Because of the long lead times for these sorts of complicated technical achievements, this call is for launches in the faraway years of 2028 or 2034. (These dates would be harder to wrap my head…Read More Previous Page 1 2 3 4 5 … 58 Next 