full_description = "Net JSONfeed Net defjaf · May 19, 2017 More technical stuff, but I’m trying to re-train myself to actually write on this blog, so here goes… For no good reason other than it was easy, I have added a JSONfeed to this blog. It can be found at http://andrewjaffe.net/blog/feed.json, and accessed from the bottom of the right-hand sidebar if you’re actually reading this…Read More Not-quite hacked Net defjaf · Feb 3, 2013 This week, the New York Times, The Wall Street Journal and Twitter, along with several other news organizations, have all announced that they were attacked by (most likely) Chinese hackers. I am not quite happy to join their ranks: for the last few months, the traffic on this blog has been vastly dominated by attempts…Read More Future Science Bloggers Wanted Academia, Net, Science defjaf · Jul 1, 2012 Attention Imperial Postgraduates*: I’ll be helping lead a course in Science Blogging this Friday, 6 July 2012 at Imperial, along with a couple of fellow (science) bloggers: biophysicist Professor Stephen Curry and biostatistician (and actual graduate student!) Erika Cule, both of whom write at Occam’s Typewriter, an excellent grassroots network of scientist bloggers. Imperial students…Read More More from the Spherical Cows Net, Science defjaf · May 8, 2011 In a very different way of translating scientific ideas into other forms and media, my friend, colleague and collaborator Lloyd Knox is back with a new series of short video documentaries under the auspices of his Spherical Cow Company. After a hiatus of a few months, they set themselves a challenge of producing three videos…Read More Consider a Spherical Cow (Company) Net, Science defjaf · Sep 29, 2010 One of my old friends from graduate school, and a colleague to the present day, Lloyd Knox — whom you may remember from such cosmology hits as the Dark Energy Song — has started an initiative to create “short documentary videos to demonstrate the explanatory power of simple physical models and to help us understand…Read More Talking and blogging to ourselves Net, Science defjaf · Jul 21, 2010 (Warning, scattershot blogging echo-chamber post follows.) Last week I went to the Science Blogging Talkfest sponsored by the Biochemical Society and led by Alice Bell from Imperial’s excellent Science Communication program. Partially because the event was mostly attended by science bloggers themselves, there was a bit of a preaching-to-the-converted sense to the proceedings. (I tried…Read More Training Scientists: What’s the Point? Net, Politics, Science defjaf · Jun 28, 2010 My colleagues and I spend what is probably an inordinate amount of time complaining about the occasional lapses of the basic skills of our students, their inability to take notes, their obsession with marks and what’s going to be on the exams. Because, like everyone else, we like to complain. But pretty often I get…Read More Sympathy for the Music Industry Music, Net defjaf · May 7, 2010 A couple of my friends have got into a bit of a spat on the internet. Megan McArdle, a writer for the Atlantic Monthly, wrote “The Freeloaders”, arguing that file sharing, as practiced by today’s 20-something young adults, is destroying the music industry. Marc Weidenbaum, who writes the wonderful disquiet blog, first first answered in…Read More Flat rotation curves and Facebook Net, Science defjaf · Apr 11, 2010 (See below for an update.) In one of the more bizarre meta-experiments that have come out of the latter-day social web, Trieste astrophysicist Paolo Salucci is trying to use Facebook to spread some astrophysics, not to the public, but within the astronomical community. Specifically, he’s trying to “eliminate the deep-routed [sic] wrong misconception [sic] of…Read More Blogging Anniversary, and Other Celebrations Net, Science defjaf · Aug 25, 2009 I was sitting in the lecture theatre of the Royal Institution at the Science Online London meeting (of which I hope to write more later, but you can retroactively follow the day’s tweets or just search for the day’s tags) when I realized I had missed the fifth anniversary of this blog this past July.…Read More 1 2 3 … 7 Next Page Search Search Recent Posts The Only Gaijin in the Onsen Discovering Japan It’s been a while The Milky Way Planck: Demographics and Diversity Categories Academia (64) Art (57) Blog (1) Miscellanea (103) Music (71) Net (63) News (28) Politics (110) Science (333) Uncategorized (4) Archive Archives Select Month January 2025 December 2024 May 2024 March 2024 August 2018 July 2018 May 2018 December 2017 October 2017 May 2017 January 2017 November 2016 June 2016 May 2016 March 2015 November 2014 August 2014 June 2014 April 2014 March 2014 February 2014 January 2014 December 2013 October 2013 June 2013 May 2013 April 2013 March 2013 February 2013 January 2013 December 2012 November 2012 October 2012 September 2012 August 2012 July 2012 June 2012 May 2012 April 2012 March 2012 February 2012 January 2012 December 2011 November 2011 October 2011 September 2011 August 2011 July 2011 June 2011 May 2011 April 2011 March 2011 February 2011 January 2011 December 2010 November 2010 October 2010 September 2010 August 2010 July 2010 June 2010 May 2010 April 2010 March 2010 February 2010 January 2010 December 2009 November 2009 October 2009 September 2009 August 2009 July 2009 June 2009 May 2009 April 2009 March 2009 February 2009 January 2009 December 2008 November 2008 October 2008 September 2008 August 2008 July 2008 June 2008 May 2008 April 2008 March 2008 February 2008 January 2008 December 2007 November 2007 October 2007 September 2007 August 2007 July 2007 June 2007 May 2007 April 2007 March 2007 February 2007 January 2007 December 2006 November 2006 October 2006 September 2006 August 2006 July 2006 June 2006 May 2006 April 2006 March 2006 February 2006 January 2006 December 2005 November 2005 October 2005 September 2005 August 2005 July 2005 June 2005 May 2005 April 2005 March 2005 February 2005 Janu