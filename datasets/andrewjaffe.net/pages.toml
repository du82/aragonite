full_description = "The Only Gaijin in the Onsen Miscellanea defjaf · Jan 15, 2025 After living in Japan for about four months, we left in mid-December. We miss it already. One of the pleasures we discovered is the onsen, or hot spring. Originally referring to the natural volcanic springs themselves, and the villages around them, there are now onsens all over Japan. Many hotels have an onsen, and most…Read More Discovering Japan Miscellanea, Science defjaf · Dec 17, 2024 My old friend Marc Weidenbaum, curator and writer of disquiet.com, reminded me, in his latest post, of the value of blogging. So, here I am (again). Since September, I have been on sabbatical in Japan, working mostly at QUP (International Center for Quantum-field Measurement Systems for Studies of the Universe and Particles) at the KEK…Read More It’s been a while Blog, Miscellanea, News, Politics, Science defjaf · May 20, 2024 If you’re reading this, then you might realise that I haven’t posted anything substantive here since 2018, commemorating the near-end of the Planck collaboration. In fact it took us well into the covid pandemic before the last of the official Planck papers were published, and further improved analyses of our data continues, alongside the use…Read More The Milky Way Science defjaf · Mar 30, 2024 Read More Planck: Demographics and Diversity Academia, Science defjaf · Aug 13, 2018 Another aspect of Planck’s legacy bears examining. A couple of months ago, the 2018 Gruber Prize in Cosmology was awarded to the Planck Satellite. This was (I think) a well-deserved honour for all of us who have worked on Planck during the more than 20 years since its conception, for a mission which confirmed a…Read More (Almost) The end of Planck Academia, Science defjaf · Jul 19, 2018 This week, we released (most of) the final set of papers from the Planck collaboration — the long-awaited Planck 2018 results (which were originally meant to be the “Planck 2016 results”, but everything takes longer than you hope…), available on the ESA website as well as the arXiv. More importantly for many astrophysicists and cosmologists,…Read More Leon Lucy, R.I.P. Academia, Science defjaf · May 18, 2018 I have the unfortunate duty of using this blog to announce the death a couple of weeks ago of Professor Leon B Lucy, who had been a Visiting Professor working here at Imperial College from 1998. Leon got his PhD in the early 1960s at the University of Manchester, and after postdoctoral positions in Europe…Read More WMAP Breaks Through Science defjaf · Dec 4, 2017 It was announced this morning that the WMAP team has won the $3 million Breakthrough Prize. Unlike the Nobel Prize, which infamously is only awarded to three people each year, the Breakthrough Prize was awarded to the whole 27-member WMAP team, led by Chuck Bennett, Gary Hinshaw, Norm Jarosik, Lyman Page, and David Spergel, but…Read More The Chandrasekhar Mass and the Hubble Constant Science defjaf · Oct 24, 2017 The first direct detection of gravitational waves was announced in February of 2015 by the LIGO team, after decades of planning, building and refining their beautiful experiment. Since that time, the US-based LIGO has been joined by the European Virgo gravitational wave telescope (and more are planned around the globe). The first four events that…Read More JSONfeed Net defjaf · May 19, 2017 More technical stuff, but I’m trying to re-train myself to actually write on this blog, so here goes… For no good reason other than it was easy, I have added a JSONfeed to this blog. It can be found at http://andrewjaffe.net/blog/feed.json, and accessed from the bottom of the right-hand sidebar if you’re actually reading this…Read More 1 2 3 … 58 Next Page Search Search Recent Posts The Only Gaijin in the Onsen Discovering Japan It’s been a while The Milky Way Planck: Demographics and Diversity Categories Academia (64) Art (57) Blog (1) Miscellanea (103) Music (71) Net (63) News (28) Politics (110) Science (333) Uncategoriz