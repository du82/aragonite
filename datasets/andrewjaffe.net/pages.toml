fatherhood, or the horror (comedy?) of the US Presidential election. Instead, it’s going to be rock ’n’ roll, though I don’t know if that’s because it’s too important, or not important…Read More Atheism, naturalism, and the way things ought to be Miscellanea, Politics defjaf · Mar 9, 2015 In an occasionally thoughtful but mostly silly attempted takedown of the so-called New Atheists (Dawkins, Dennett, Harris and such), philosopher John Gray writes that there is an irresolvable contradiction between viewing religion naturalistically — as a human adaptation to living in the world — and condemning it as a tissue of error and illusion. -John…Read More Oscillators, Integrals, and Bugs Miscellanea, Science defjaf · Nov 24, 2014 [Update: The bug seems fixed in the latest version, 10.0.2.] I am in my third year teaching a course in Quantum Mechanics, and we spend a lot of time working with a very simple system known as the harmonic oscillator — the physics of a pendulum, or a spring. In fact, the simple harmonic oscillator…Read More Loncon 3 Miscellanea, Science defjaf · Aug 15, 2014 Briefly (but not brief enough for a single tweet): I’ll be speaking at Loncon 3, the 72nd World Science Fiction Convention, this weekend (doesn’t that website have a 90s retro feel?). At 1:30 on Saturday afternoon, I’ll be part of a panel trying to answer the question “What Is Science?” As Justice Potter Stewart once…Read More More events: me and my friends Science defjaf · Jun 4, 2014 A quick heads-up on some recent and upcoming events: A couple of weeks ago, I delivered my long-delayed (if not actually long-awaited) inaugural lecture, “The Random Universe“. A video is currently available through Imperial College’s media library so you can hear me opine on how we learn about the history and evolution of the Universe…Read More Previous Page 1 2 3 4 … 58 Next Page Search Search Recent Posts The Only Gaijin in the Onsen Discovering Japan It’s been a while The Milky Way Planck: Demographics and Di