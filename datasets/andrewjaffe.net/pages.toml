full_description = "News It’s been a while Blog, Miscellanea, News, Politics, Science defjaf · May 20, 2024 If you’re reading this, then you might realise that I haven’t posted anything substantive here since 2018, commemorating the near-end of the Planck collaboration. In fact it took us well into the covid pandemic before the last of the official Planck papers were published, and further improved analyses of our data continues, alongside the use…Read More Planck 2013: the PR News, Science defjaf · Mar 22, 2013 Yesterday’s release of the Planck papers and data wasn’t just aimed at the scientific community, of course. We wanted to let the rest of the world know about our results. The main press conference was at ESA HQ in Paris, and there was a smaller event here in London run by the UKSA, which I…Read More Higgs vs Religion on the Radio: no contest News, Science defjaf · Jul 4, 2012 The Higgs day continues (and I’m not even a particle physicist). At about 5pm, just as I was dialling into one of my several-times-a-week Planck teleconferences, I had an email from Tim at the BBC, who works with the World Service “World Have Your Say” show, coming on at 6pm. Would I be able to…Read More Bad memory. Bad law? News defjaf · May 12, 2012 (Warning: this post is pretty far outside of my usual bailiwick…) I was reading today’s Guardian and came across Zoe Williams‘ sketch (in UK newspapers, this is a short, often humorous, descriptive piece, usually about an event like a parliamentary debate or court proceedings), “Rebekah Brooks lays bare the secret of her success“, recounting the…Read More Bayes in the World II: Million Pound Drop News, Science defjaf · Dec 17, 2010 Embarrassing update: as pointed out by Vladimir Nesov in the comments, all of my quantitative points below are incorrect. To maximize expected winnings, you should bet on whichever alternative you judge to be most likely. If you have a so-called logarithmic utility function — which already has the property of growing faster for small amounts…Read More Bayes in the World I: Wikileaks News, Politics, Science defjaf · Dec 16, 2010 I’ve come across a couple bits of popular/political culture that give me the opportunity to discuss one of my favorite topics: the uses and abuses of probability theory. The first is piece by Nate Silver of the New York Times’ FiveThirtyEight blog, dedicated to trying to crunch the political numbers of polls and other data…Read More Ada Lovelace Day — Henrietta Leavitt Academia, Miscellanea, News, Politics, Science defjaf · Mar 24, 2009 Today is Ada Lovelace Day, “an international day of blogging to draw attention to women excelling in technology.” I — along with more than a thousand other people — have pledged to write about a female role model in technology. Ada Lovelace was Byron’s daughter and worked with computer pioneer Charles Babbage on his “Computing…Read More Health Care at Home and Abroad News, Politics defjaf · Dec 3, 2008 By far the best article I’ve read about the British healthcare system, appeared this morning… in the New York Times. It discussed the NHS‘s National Institute for Health and Clinical Excellence (NICE), the organization that rations pharmaceuticals in the UK (although you’ll rarely hear the word “ration” used). When NICE’s decisions are discussed in the…Read More Holy Cow Miscellanea, News, Politics defjaf · Aug 15, 2007 I would like to think that the passing of one Scooter — Phil Rizzuto, Yankees Shortstop and broadcaster — was of greater cultural significance than the pardonning of the other one (since they didn’t manage to indict the likely mastermind behind the plot before he could resign. Probably not.Read More Floods: It’s not just the UK News defjaf · Aug 8, 2007 Flooding cripples New York subway system: Flooding from torrential overnight rains crippled the New York City subway system this morning. Delays of at least 30 minutes were reported on all subway lines, and customers were urged to forgo the subways entir