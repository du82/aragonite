title = "Politics – The Random Universe"
full_description = "Politics It’s been a while Blog, Miscellanea, News, Politics, Science defjaf · May 20, 2024 If you’re reading this, then you might realise that I haven’t posted anything substantive here since 2018, commemorating the near-end of the Planck collaboration. In fact it took us well into the covid pandemic before the last of the official Planck papers were published, and further improved analyses of our data continues, alongside the use…Read More Knightian Uncertainty Politics, Science defjaf · May 3, 2017 [Update: I have fixed some broken links, and modified the discussion of QBism and the recent paper by Chris Fuchs— thanks to Chris himself for taking the time to read and find my mistakes!] For some reason, I’ve come across an idea called “Knightian Uncertainty” quite a bit lately. Frank Knight was an economist of…Read More Electoral woes and votes Politics defjaf · Nov 22, 2016 Like everyone else in my bubble, I’ve been angrily obsessing about the outcome of the US Presidential election for the last two weeks. I’d like to say that I’ve been channelling that obsession into action, but so far I’ve mostly been reading and hoping (and being disappointed). And trying to parse all the “explanations” for…Read More Atheism, naturalism, and the way things ought to be Miscellanea, Politics defjaf · Mar 9, 2015 In an occasionally thoughtful but mostly silly attempted takedown of the so-called New Atheists (Dawkins, Dennett, Harris and such), philosopher John Gray writes that there is an irresolvable contradiction between viewing religion naturalistically — as a human adaptation to living in the world — and condemning it as a tissue of error and illusion. -John…Read More Science as metaphor Politics, Science defjaf · Dec 18, 2012 In further pop-culture crossover news, I was pleased to see this paragraph in John Keane’s review of Alan Ryan’s “On Politics” in this weekend’s Financial Times: Ryan sees this period [the 1940s] as the point of triumph of liberal democracy against its Fascist and Stalinist opponents. Closer attention shows this decade was instead a moment…Read More STFC and UKSA Politics, Science defjaf · Sep 4, 2011 Funding for space missions in the UK was split from the Science and Technology Facilities Council to the the UK Space Agency earlier this year. Very roughly, UKSA will fund the missions themselves all the way through to the processing of data, while STFC will fund the science that comes from analysing the data. To…Read More Industrial Action? Academia, Politics defjaf · Mar 23, 2011 This week is the 100th anniversary of one of the most important events in the Labor movement (at least back in the US): the Triangle Shirtwaist Factory fire, a disaster in which the garment factory’s sweatshop conditions led to the death of almost 150 workers, mostly Jewish immigrant women, locked by their bosses into their…Read More Bayes in the World I: Wikileaks News, Politics, Science defjaf · Dec 16, 2010 I’ve come across a couple bits of popular/political culture that give me the opportunity to discuss one of my favorite topics: the uses and abuses of probability theory. The first is piece by Nate Silver of the New York Times’ FiveThirtyEight blog, dedicated to trying to crunch the political numbers of polls and other data…Read More Science is Vital Academia, Politics, Science defjaf · Oct 2, 2010 I don’t suppose that there are many readers of this blog who are not aware of the Science Is Vital campaign for the support of UK science, but just in case: in response to the likelihood of continuing cuts to the UK science budget as spun by business secretary Vince Cable, we in the science…Read More “Public Service Review”? Politics, Science defjaf · Sep 19, 2010 A few months ago, I received a call from someone at the “Public Service Review”, supposedly a glossy magazine distributed to UK policymakers and influencers of various stripes. The gentleman on the line said that he was looking for someone to write an article f