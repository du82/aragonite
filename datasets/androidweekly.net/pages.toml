full_description = "Alex Lockwood's post gives an in-depth analysis of shared element transitions and their role in the Activity and Fragment Transitions API. This is the third of a series of posts he's written on the topic. Here's a deep look at Java annotation processors by Hannes Dorfmadd, including making them work with Android build processes. The focus for version 1.1 is bug fixes. However, in addition to the bug fixes there are some notable improvements, including mipmap resources on new projects, new lint checks and new templates for creating watch faces. In this article Mark Allison takes the VectorDrawable animations a step further and looks at how to actually animate the contents of the path elements. Riyaz Ahamed was working on redesigning an android app. In this post he describes all the thought process involved in redesigning a particular screen. Fyza Hashim describes how she and the rest of the Trello team gave their Android app a Material design makeover. In this second tutorial, Taylor Ling shares his experiences in applying easing into the Material UI animations made with Photoshop. Mobile ticketing right now is where photo sharing was five years ago (i.e. awful). We're changing that. We’ve come a long way already, but we still have so much more we want to do! Join our team and help us build an Android app that defines sports and music on the platform. Trello is looking for brilliant developers to help us make our Android app even more awesome. Trello for Android is fully native, minSdkVersion is 15, and we are an Editors' Choice. If you're a RxJava addict with experience making highly interactive applications, come join us! If you are: green, approx. 0.53 meters tall and feed upon well-crafted code (or all of the above at least at heart) then we need you! Notion is a mobile startup looking to hire an experienced Android developer. You will be joining a small and ambitious team who's goal is to change the face of messaging. You will be a technical lead and mentor. You will guide project teams by creating technical designs, writing user stories, and grooming the backlog. You will promote and champion best technical practices with both our clients and the development team. AND, you get to code!"
