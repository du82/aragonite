full_description = "The common feature of video applications is to display a video with customized media player controls. This article shares some knowledge and show some ideas around video playing on Android. This article shows how to use Retrofit together with RxJava and emphasizes the possiblity to combine and chain REST calls using rxObservables to avoid ugly callback chains. It gives you a nice example of using RxJava in order to write less and cleaner code. This post by Wolfram Rittmeyer gives you an introduction to the RecyclerView, it’s many internal classes and interfaces, how those interact and how you can use them. Donn Felker discusses how crash data can help you fix the most critical crashes with minimal effort and create happy users and customers for your business. This post will put you on the right path to releasing and Android library to bintray (JCenter) or maven.org (MavenCentral). It will show you how you can create a maven compatible release of your Android library project. Most of the applications in the Market store credentials (username/password or a hash) in the application to avoid prompting the user continuously asking him for the authentication. Here's one way to encrypt this data. So, you switched to Gradle and just finished you new shiny Android library (or java library). And of course you want to share it with the community. Here's a quick guide for those who never published their libraries before. Access the latest tools, developer guides, SDKs, APIs and sample code. Learn how to optimize for Qualcomm® Snapdragon™ processors. Get tips for using dev platforms for augmented reality, mobile graphics, minimizing power consumption, and maximizing the Internet of Everything. Juhani Lehtimaki revisit the Yahoo Weather app and take a look at another new app with an eye for what works and what doesn't in the designs. Join us at the heart of the SF tech scene - we're a rocket ship taking the sports world by storm, up 30x in six months and build