full_description = "Getting Started with CameraX in Jetpack Compose Jolanda Verhoef shows how to integrate the camera-compose APIs in your app and some of the delightful UI experiences that integration with Compose unlocks. How modifiers order affects Compose UI appearance Marcin Moskała explains with clear examples how Compose UI modifiers work. FilterChip Dropdown selector in Jetpack Compose Manpreet Kunnath creates a FilterChip dropdown selector in Jetpack Compose. Top 3 Most Common Animations You Can Use in Your Jetpack Compose Project Enhance your app’s user experience with Dobri Kostadinov's simple and effective animation techniques in Jetpack Compose. Tap to focus: Mastering CameraX Transformations in Jetpack Compose Jolanda Verhoef teaches using the Compose gesture system, graphics, and coroutines to implement a visual tap-to-focus. Understanding SOLID Principles with Kotlin Examples Ignacio Carrión looks at how the SOLID principles form the foundation for building robust and scalable software. Android Dynamic Animated SVGs (with Lottie Dynamic Properties) Paul Blundell explains Lottie Dynamic Properties, a way of controlling different parts of your animation at runtime. Compose Design Systems: Have a Plan Mark Murphy considers using Material's design system for Compuse UI versus building your own. (Trying to) take notes from the lock screen Thomas Künneth examines the NOTES role in Android 14 which supports the note-taking feature and increases productivity of Android tablets. Mastering Kotlin Coroutine Channels in Android: From Basics to Advanced Patterns Ioannis Anifantakis shows how using the channel type that suits your use case helps to create robust, scalable Android apps free from callback spaghetti. Client is King! Kotlin Multiplatform architecture for native UI — Part 1 In this first post, Benedict Pregler gives an overview of the cross-platform workflow architecture and what the API on the clients look like. aspecto Aspecto is a grid layout that perfectly preserves each item's aspect ratio for the Jetpack Compose / Compose Multiplatform."
