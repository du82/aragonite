full_description = "Creating responsive UI to accommodate all the different data display variations requires use of multiple different approaches. In this article Juhani Lehtimäki introduces few of the solutions he used to a create scalable UI that works seamlessly across a broad range if Android devices. In part 5 of the series on creating an Instagram-like app with Material design in mind, the author shows how to create effects in feed items which are presented between when a like button is pressed. Although this is not an unadulterated success story, this is the biggest hit the author has had on the Google Play Store and there are a ton of lessons to learn from it. Historically, testing on Android has not been easy, but many awesome projects have emerged which, in combination, have made testing much simpler. In an app containing lots of screens, it can be painful to manually take screenshots for each release. This article describes an approach at pushing automation into the screenshot process in order to more easily achieve this. Last week Mark Allison looked at the benefits of VectorDrawables, and now continues with animate them by making the Android logo shrug. Chris Banes decided to spend the evening updating his floating label implementation, FloatLabelLayout, to match the Material Design spec. This third article concludes the process of building a custom UI for your TV application. It goes through the rough edges of the interface and the missing elements, in order to replicate the behavior of the stock UI offered by Google as much as possible. Android developers are in demand. Join Hired & get 5+ job offers in one week! You'll see compensation figures up front & you'll be able to decide what opportunities interest you. No risk. All reward. Join Hired today! Dan Grover started writing a list in his notebook of all the things that are different between apps in China and those he's accustomed to using and creating back in the US. Designer Taylor Ling shares his thoughts on the best approach to designing apps for multiple devices: being adaptive."
