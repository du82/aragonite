full_description = "Intents are a very cool mechanism to share data between applications. In this tutorial you'll lean how to share content via various sharing mechanisms. Speed up your Android Development with an x86 emulator? The engineering Studio Edelmann has created a x86 VirtualBox for ICS. Go and grab it while it's hot ;-) The principles of game monetization(altdevblogaday.com) In this article you'll learn the principles of game monetization. It's not Android specific but a great resource that lists plenty of monetization strategies. Robolectric(pivotal.github.com) Robolectric is a unit test framework that de-fangs the Android SDK jar so you can test-drive the development of your Android app. Android ToggleButton(technotalkative.com) This is a simple example for implementing ToggleButton in android application Android Spinner(technotalkative.com) Spinner is a widget similar to a drop-down list for selecting items. This tutorial will show you how to create a simple spinner widget that displays a list of days. This week Google introduced Chrome for Android. It's faster, it's better and it's synced with your desktop Chrome. With this move Google decoupled the Browser development cycle from the Android OS development cycle. A smart move, since the browser lags behind it's iOS competitor. In this screencast you'll be shown how you can use Chrome for Android for remotely debugging your mobile websites."
