full_description = "Recently at Google I/O, Google announced a comprehensive set of new features that will allow IT organizations to easily deploy and manage Android devices in enterprise environments. These features will be built into the upcoming Android L release. In this tutorial you will learn how to implement a material design ripple, elevation and reveal effect for your views. In this post by Dmytro Danylyk you'll learn how to create live templates to generate boilerplate code (in this case Parcelable.Creator). In this tutorial you'll learn how to create a floating action button like in the new Gmail app. There is a Gist so that you can directly embed this component in your project. In this blog post for beginners you'll learn how to create an AutoCompleteTextView that gets its suggestions by a web service. James Barr from Two Toasters has written an article how to dive into Watchface development. They also released a Watchface template on Github. Riyaz Ahamed has posted a rant on splash screens that do nothing beside annoying the user. We strongly agree! At Venmo, we build products that make payments easy. We view engineering as a craft, and want our software to be as elegant as the end user experience. We're looking for Android engineers to help make our app become the easiest way to pay anyone, anywhere, at any time. Over 1,000 companies compete for experienced Android Developers every week on Hired. From startups to public corporations, you'll get multiple, diverse job offers with salary & equity numbers upfront. No risk. All reward. Join today! If you want to develop a Watchface for Android Wear then this might be your starting point. Be sure you also read Two Toasters blog post about wear development. This library enables you to create a window icon similar to Facebooks chat icon, and also similar to the Link Bubble app. We've published an update to our custom watch face. It now works properly on the LG G Watch too. Be sure to checkout the code on GitHub."
