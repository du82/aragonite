["https://androidweekly.net/issues/issue-660"]
title = "Android Weekly - Free weekly Android & Kotlin development newsletter"
description = "Android Weekly is a free newsletter that helps you to stay cutting-edge with your Android Development."
full_description = "Migrating to the Compose PullToRefreshBox Joe Birch discusses the new experimental PullToRefreshBox composable in Jetpack Compose, highlighting its improved discoverability, readability, and reduced boilerplate compared to the previous pullRefresh modifier approach. BasicTextField bubble wrap Zach Klippenstein introduces a technique to add dynamic content padding to Jetpack Compose’s BasicTextField, enhancing user experience by adjusting padding based on scroll position. Effective Map Composables: Collections of Draggable Markers Uli Bubenheimer demonstrates managing collections of draggable markers in android-maps-compose, focusing on marker state and collection changes. Exercise Caution When Using runBlocking on Android Jaewoong Eum advises caution when using Kotlin’s runBlocking in Android development, explaining that it can block the main thread and lead to Application Not Responding (ANR) errors, thereby degrading user experience. Seamless shimmer integration with existing Compose code Igor Escodro presents a method to integrate a shimmer effect into existing Jetpack Compose codebases with minimal modifications, utilizing a custom Modifier. Draw sleep timeline graph in Compose Viktor Mykhailiv provides a guide on creating a custom sleep timeline graph in Jetpack Compose, illustrating how to represent various sleep stages such as awake, REM, light, and deep sleep using the Canvas composable and DrawScope API. Dealing with READ_MEDIA_IMAGES Permissions in Android Dobri Kostadinov explains Android 13’s READ_MEDIA_IMAGES permission changes and demonstrates using a DialogFragment for image selection. The future is adaptive: Changes to orientation and resizability APIs in Android 16 Android 16 is removing the ability for apps to restrict orientation and resizability at the platform level, and shifting to a consistent model of adaptive apps that seamlessly adjust to different screen sizes and orientations. Production-ready generative AI on Android with Vertex AI in Firebase The Vertex AI in Firebase SDK lets you access Google’s Gemini Cloud models (like Gemini 1.5 Flash and Gemini 1.5 Pro) and add GenAI capabilities to your Android app."
