["https://androidweekly.net/issues/issue-109"]
title = "Android Weekly - Free weekly Android & Kotlin development newsletter"
description = "Android Weekly is a free newsletter that helps you to stay cutting-edge with your Android Development."
full_description = "You may have noticed a new support library called Palette which allows you to extract colors from images for use in your UI. Chris Banes share some insight into how to use it. Google Play Services 5.0 which just launched contributes over twenty thousand methods to your app. 20k+. One third of the limit! Now that is scary. The Palette class is an awesome tool to make improve UX with dynamic, content-based colors. The performance impact is small (at least on a relatively high-end device), and the benefits look great, especially with the new theme and animation possibilities in the L dev preview. Google Play services 5.0 is now rolled out to devices worldwide, and it includes a number of features you can use to improve your apps. This release introduces Android wearable services APIs, Dynamic Security Provider and App Indexing, whilst also including updates to the Google Play game services, Cast, Drive, Wallet, Analytics, and Mobile Ads. Blender is a new annotation processor that was introduced to speed up Guice performances at runtime. RoboGuice is the first library to benefit of it : 30-70% speed gain, 30% memory gain. With each Android release, Google issues an API differences report, outlining things that were added, changed, or removed in a new API level compared to the previous one. Mark Murphy takes a look at some of the changes in the L preview. Things are changing so rapidly in mobile hardware that we are starting to enter an era where no longer will there a difference in feature sets or capabilities between what your phone can do, and what a high end PC can do. The difference will simply be how much power the chips are allowed to consume. ogle I/O this week brought a lot of exciting news about Android, and we probably need quite some time to get used to what Android L is bringing. Antonio Leiva has been playing with RecyclerView lately, and will give you a little presentation of what he discovered so far. Using touch to swipe between different views in an app has become one of the most popular navigation design patterns. In this blog, we will go through the steps necessary to create an app with lateral swipe navigation."
year_published = 2025
