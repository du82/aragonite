full_description = "Publishing with Gradle (meedamian.com) Damian Mee shares what he learned about moving from Eclipse to Android Studio with Gradle. Play Store Compatibility Across Various Versions (plus.google.com) Newer versions of Android allow for much richer experiences in apps. Kirill Grouchnikov shares approaches to cross version compatibility and how it's implemented in the Play Store app. Kirill Grouchnikov shows how the side navigation drawer can be compatible with a transparent ActionBar. Chris Lacy Shares His Thoughts On Android (www.androidpolice.com) Chris Lacy, the man behind Action Launcher, Tweet Lanes, and most recently, Link Bubble took some time to answer a few questions and share his experiences developing apps for Android. Stacking notifications with the Android Wear Developer Preview is really simple—it requires only a few lines of extra notification code. Bluetooth LE – Part 6 (blog.stylingandroid.com) Previously in this series Mark Allison looked at the various steps needed to begin to get temperature and humidity notifications from a TI SensorTag. In the final article in this series he’ll complete things by registering to receive notifications, and receiving them. Top 7 Tips for RxJava on Android (blog.futurice.com) From Timo Tuominen: It was clear the reactive way was the right way and anything else would have felt but an ugly compromise. That is, in fact, the funny thing about reactive — no matter how hard it is in the beginning, it always feels it is worth it. Using Custom Compound Views in Android (ryanharter.com) This articles shows how to encapsulate view functionality in a custom view, which would be reusable throughout an app, and would allow to easily test the encapsulated functionality. Working with Google Analytics API v4 for Android (benwilcock.wordpress.com) For v4 of the Google Analytics API for Android, Google has moved the implementation into Google Play Services. As part of the move the EasyTracker class has been removed, but it still possible to get a fairly simple ‘automatic’ Tracker up and running with little effort. This post will show you how."
