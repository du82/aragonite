["https://androidweekly.net/issues/issue-661"]
title = "Android Weekly - Free weekly Android & Kotlin development newsletter"
description = "Android Weekly is a free newsletter that helps you to stay cutting-edge with your Android Development."
full_description = "Comparing FileProvider vs. MediaStore + Top Interview Questions Leo N compares Android’s FileProvider and MediaStore, detailing their roles in file sharing and storage, and offers guidance on implementing each within applications. Clip or Cut or Mask a Composable with a Custom Shape Souvik Sarkar demonstrates creating custom shapes and masking user profile pictures within these shapes using the Modifier.drawWithContent function in Jetpack Compose. Simplify ViewBinding in Android with ViewBindingPropertyDelegate 2.0 Kirill Rozov introduces version 2.0 of the ViewBindingPropertyDelegate library, highlighting key changes such as the transition from lifecycle-based to component callbacks, removal of state checks, and updates to the artifact ID and base package. Designing Effective UI Components in Jetpack Compose Jaewoong Eum discusses best practices for designing UI components in Jetpack Compose, emphasizing effective use of modifiers, state management, and creating flexible, reusable components. Kotlin Constants in Android: Top-level vs. Companion-enclosed Aung Thiha analyzes the impact of declaring constants as top-level versus within companion objects in Kotlin, examining their effects on performance, APK size, and memory usage. Creating a Modern Bottom Navigation Bar with a Curved Cut-Out Souvik Sarkar provides a step-by-step guide to designing a modern bottom navigation bar in Jetpack Compose, featuring a curved cut-out for a docked floating action button. A more flexible Checkbox in Material3 Nav Singh shows a new API in Material3 that allows developers to customize the stroke of the checkmark and checkbox outline in Jetpack Compose’s Material3 Checkbox component. Parallelism with Android SQLite Pierre-Yves Ricau explores SQLite’s parallelism limits in Android and suggests strategies to avoid thread contention for better performance. Mesh Gradients in Jetpack Compose sinasamaki shows how to implement beautiful Mesh Gradients on Android. Using Apollo Kotlin in Android Applications - Part I A hands-on course to learn the basics of Apollo Kotlin: set up the SDK, configure code generation, and send your first queries!"
