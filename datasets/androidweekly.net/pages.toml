full_description = "In this post by Razvan Ltu you will learn some insights about building a driving assistance app. The app makes a lot of use of the NDK and the OpenCV platform. On using JaCoCo code coverage reporting framework, which integrates quite nicely with Gradle and Robolectric. With the introduction of Android L, developers now have an easy way to change the color of drawables to match the theme of their app. Despite this, many developers will need to support earlier Android versions in their apps, so this article shows a technique for changing drawable asset colors using Picasso for both local and remote assets. Colin Miller announces the release of a new local data framework for Android that he's been working on called SimpleNoSQL. It's an easy way to store and retrieve objects to/from disk without dealing with files or SQL. Gabriele Mariotti shares a simple implementation of an adapter with section headers for the new RecyclerView. Tips to connect Android Wear running as an emulator to an Android Phone, also running as an emulator. Push the boundaries of what mobile can do. See what’s next in mobile imaging, virtual reality gaming, and the Internet of Everything. Qualcomm Developer Network has the support and solutions to help you define the next generation of mobile experiences. Karma's vision is to make getting online seamless and headache-free by putting WiFi in the palm of your hand. We're looking for our first full-time Android engineer who will have the opportunity to own new features from day one, and build an Android experience that is second to none. We've created a cross-platform mobile framework, YAPL, that uses native controls. The Android implementation isn't quite up to our standards and we'd love your expertise to help it get there! With over 2M users, we're looking for an Android developer to help us scale! Checkout is a library for Android In-App Billing (v3). The main goal is to reduce work which should be done by developers who want to integrate in-app purchases in their products. The project is inspired by Volley library and is designed to be easy to use, fast and flexible."
