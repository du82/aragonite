full_description = '''The author basically wanted to keep the main aesthetics of his Holo app, but upgrade it to Material Design in a meaningful way. This is a short documentation of how he managed to do this. An article on how to create a Gradle project that successfully builds and runs Robolectric tests in Android Studio. Chiu-Ki Chan shares how to set up RecyclerView to auto fit the number of columns similar to GridView. Tonic Artos finally got around to rewriting StickyGridHeaders for RecyclerView. However, this rewrite completely changed everything, so he started a new open source project called SuperSLiM. Google developer Colt McAnlis will be sharing some new information on getting the best performance from your Android apps. Interceptors are a new feature of OkHttp 2.2. There isn't much mechanism: two interfaces and four methods, but leads to very powerful possibilities. Joe Zapata turned his architecture from the first part of the article into an open source library, and describes the updates he made. This post has three parts: A quick primer on what an event bus is, implementing the event bus with RxJava, and parting thoughts on this approach Etsy is set on redefining what mobile, person-to-person commerce means for the entire world. We’re a mobile first company that is focused on scaling Android and iOS app development throughout our whole organization. 2015 is going to be a huge year for apps at Etsy. Want to be a part of it? We are a rapidly growing Columbus based technology firm working with high profile clients in the field healthcare. We are looking for an Android Developer to join our existing mobile team and work in cutting edge development. This is a full time position with full benefits and vacation. RideCell (YC W12) is looking for an Android engineer to help us make transportation systems as scalable as computing. An Android 7+ backport of VectorDrawable. Basic, simple vector drawables are working now. Please lend your support to help complete some of the roadmap. Native Android "sample of all samples" for beginners and experienced, 14+, with focus on lollipop and Material. Your help is needed to add a few more examples to the project.'''
