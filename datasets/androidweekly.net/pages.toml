["https://androidweekly.net/issues/issue-662"]
title = "Android Weekly - Free weekly Android & Kotlin development newsletter"
description = "Android Weekly is a free newsletter that helps you to stay cutting-edge with your Android Development."
full_description = "Brushed Metal UI in Jetpack Compose Sina Samaki demonstrates how to create a skeuomorphic brushed metal effect in Jetpack Compose by layering radial and sweep gradients, enabling developers to design metallic UI components with customizable highlights and textures. How many threads your network client uses? Marcin Moskała analyzes thread usage in Kotlin network clients, highlighting how Ktor Client is more efficient than Retrofit and Fuel. Three Dots Loading Animation with Jetpack Compose Souvik Sarkar demonstrates creating a three-dots loading animation in Jetpack Compose by utilizing rememberInfiniteTransition for staggered animations and applying a shared Modifier to achieve bouncing and fading effects. Android Performance — Overdraw Gokul Raja T S explains overdraw in Android, how to detect it using “Debug GPU Overdraw,” and techniques to reduce unnecessary rendering for better performance. Loading Initial Data properly with MVI Maxime Michel explores best practices for loading initial data in MVI architecture, comparing ViewModel initialization with LaunchedEffect in Jetpack Compose. Using Ktor In Jetpack Compose. A Full Fledged Explanation Tomer Pacific provides a comprehensive guide on integrating Ktor into Jetpack Compose applications, covering setup, client instantiation, making network requests, and deserializing JSON responses. Kotlin Multiplatform Architecture Best Practices for Mobile Apps Ignacio Carrión outlines best practices for architecting Kotlin Multiplatform mobile applications, emphasizing a multi-module project structure and the application of Clean Architecture principles to enhance scalability and maintainability. Random Musings on the Android 16 Beta 2 Mark Murphy shares insights on Android 16 Beta 2, discussing deprecations like elegantTextHeight, new APIs for UI jank detection, and the introduction of AdvancedProtectionManager for enhanced security. A Visual Guide to TopAppBar Variants in Jetpack Compose Alex Zhukovich provides a visual guide to various TopAppBar components in Jetpack Compose’s Material 3 library, detailing their default typography, heights, and use cases to help developers choose the appropriate variant for their designs."
