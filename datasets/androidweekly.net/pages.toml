full_description = "A neat roundup presentation about what android developers can do to optimize their apps battery drain. The primary target audience of this article are fresh computer science graduates who are thinking about becoming professional Android developers. In it you'll see a roundup of facts and resources that will give you a clear picture of your future work scope. In this article Mark Allison continues his series on Material apps, and looks at styling the text and also take a look at CardView. This post covers making an Android sender app to cast videos to a receiver app for displaying content on a television. All code for this example can be found on GitHub. SoundCloud changed their terms of service and politely asked the author to remove my Android app from the Play Store. This blog post is the interesting journey from idea to success. He also open sourced it and you can get it from GitHub. Facebook now sees more than half a billion people connect each month from more than 10,000 different Android device models. They've come up with an interesting system for classifying devices. We've created a cross-platform mobile framework, YAPL, that uses native controls. The Android implementation isn't quite up to our standards and we'd love your expertise to help it get there! With over 2M users, we're looking for an Android developer to help us scale! Trello is looking for brilliant developers to help us make our Android app even more awesome. Trello for Android is fully native, minSdkVersion is 15, and we are an Editors' Choice. If you're a RxJava addict with experience making highly interactive applications, come join us! Centralway is looking for experienced Android Developers to join our team in Zurich, as part of Numbrs. Come and help us to revolutionise the banking industry. If you thrive in intense, rapidly-changing environments and are fascinated by technology then we look forward to hearing from you. Foursquare is looking for experienced Android engineers to help architect, build and manage both of our mobile applications, Foursquare and Swarm. You'll be part of a fast-paced team driving ongoing product iteration and working in the competitive space of consumer-facing location-based services."
