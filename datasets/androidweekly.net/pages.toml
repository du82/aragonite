title = "Android Weekly - Free weekly Android & Kotlin development newsletter"
description = "Android Weekly is a free newsletter that helps you to stay cutting-edge with your Android Development."
full_description = '''A nifty little code snippet that includes build number in Android APK. Especially when you automating a lot of things it's really awesome to know this number for Q&A. Updated your Mac to Yosemite? Having trouble to get your Android Emulator working again? Use this code to make the emulator run smooth again. In this post you'll learn how to integrate testing as part of your app development. You'll see which parts of testing you can automate and which you have to cover manually. In his talk Matthias Käppler gave some insights into how he rethought the app architecture from the ground up. He show where the complexity lies in the application and how to use the Reactive Extensions (Rx) to gain the upper hand back on dealing with the representation and composition of asynchronous data flows. He also introduced propeller, a storage library which fits snugly into a reactive architecture. As soon as Chris Renke saw the transforming, flipping glyph in the Google Photos app, he thought "I can do that." His article describes in detail how he went about recreating the beautiful transformation. The Like button is the quickest way for people to share content with their friends. A single click on the Like button will 'like' pieces of content from your app and share them on Facebook. Integrate the Like Button in your Android app today! Over 1,300 companies compete for the best Android developers on Hired. You'll receive multiple, transparent offers from top tech companies before you interview. You'll decide who you want to talk to. Qualcomm® AllPlay™ Click SDK is a collection of API documentation, sample source code and a binary library to help developers create mobile apps that work consistently across compatible devices, brands, and platforms. It allows the opportunity to create a more consistent streaming sound experience. Juhani Lehtimäki takes a look at how navigation drawers are changing in Google apps and moving towards the Material specifications. We are looking for experienced Android engineers to join our team in Zurich, as part of Numbrs. Come and help us to revolutionise the banking industry. Zurich is at the technological forefront, much like our cutting edge banking app Numbrs.'''
