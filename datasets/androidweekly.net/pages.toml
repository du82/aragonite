title = "Android Weekly - Free weekly Android & Kotlin development newsletter"
description = "Android Weekly is a free newsletter that helps you to stay cutting-edge with your Android Development."
full_description = "Looking for a way to further polish your Android app on Lollipop? One option a lot of developers overlook is the Overview Screen While it's difficult to get Chrome installed in an emulator, you do have access to Chromium Test Shell, which is Chromium without Chrome’s Chrome. Ryan Harter looks at one of the most powerful, yet sometimes overlooked, features of Android: the Intent system. Android’s Intents allow apps to interact with each other, without intimate knowledge of each other. Grids basically consist on splitting the user interface in a bunch of aligned squares that can be merged together to create blocks . This article by Cyril Mottier gives you some tips and tricks to better manage dynamic grid-base UI. The previous article began the migration from ListView to RecyclerView by moving the Adapter implementation to RecyclerView.Adapter. This article completes the migration and resolves an easily fixable problem along the way. This post is part of a series of posts showing Android implementation of an app with Material Design concept. This articles implements a transition between feed and comments Activities. Google announced Pie Noon, a simple game created to demonstrate multi-player support on the Nexus Player. Pie Noon is an open source, cross-platform game written in C++ which supports: Up to 4 players using Bluetooth controllers, Google Play Games Services sign-in and leaderboards and more. Google introduced RecyclerView as a part of the support library as the next-gen ListView. This step-by-step guide will show you how to migrate from an existing ListView (or GridView / StaggeredGridView / ExpandableListView), replacing the implementation with a RecyclerView. This tutorial goes over creating a widget to silence a phone with one click, and in Lollipop it will place the phone into priority mode and silence the ringer, allowing the user to still get their notifications without a vibration. Android Lollipop now has CSS-style fontFeatureSettings, aka arbitrary OpenType features, in TextView and XML. Chiu-Ki Chan shows how to take advantage of this in code."
