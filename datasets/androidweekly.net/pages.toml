["https://androidweekly.net/issues/issue-121"]
title = "Android Weekly - Free weekly Android & Kotlin development newsletter"
description = "Android Weekly is a free newsletter that helps you to stay cutting-edge with your Android Development."
full_description = "Learn about how Android saves state in general in order to be able to restore an application in the exact same state the process was prior being killed because of a low memory condition or a configuration change. In this talk Cyril Mottier mainly focuses on the Parcelable and Parcel objects and how Android uses them to save/restore some important stateful information such as the complete UI state. In this article, Thomas Devaux shows how to customize dividers in a Settings activity with your brand color. Almost every app mobile need to synchronize data with a server and their are many ways to do it : AlertManagers & Services, SyncAdapter, JobScheduler. Mathieu Calba shows how each technique works. Previously in this series Mark Allison built a Wear app designed to time football matches. In this concluding article of this series he looks at how to package up the app, and also discover a pitfall on the way. In part 1 Dan Lew went over the basic structure of RxJava, as well as introducing you to the map() operator. In this article he goes through an example to introduce you to more operators. Jens Driller describes how to build and publish multiple API level specific flavors of a library project to Maven Central. This is a series of 6 blog posts which explains about Fragment Oriented Architecture in Android applications. In this first post, the author explains what is Fragment Oriented Architecture and why you should care. Over 1,200 companies compete for the best Android developers on Hired. You'll receive multiple, transparent offers from top tech companies before you interview. You'll decide who you want to talk to. And once you sign the perfect offer, we'll send you a 2,000 Dollar thank you bonus. Join today! Trepn™ Plug-in for Eclipse is designed to help you build power- optimized Android apps and integrate directly into your development workflow. This helps you see how much power an app consumes, pinpoint issues, and resolve them quickly. Download our Trepn whitepaper or view this short video."
