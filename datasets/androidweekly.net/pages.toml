["https://androidweekly.net/issues/issue-125"]
title = "Android Weekly - Free weekly Android & Kotlin development newsletter"
description = "Android Weekly is a free newsletter that helps you to stay cutting-edge with your Android Development."
full_description = "VisionMobile has just launched their latest Developer Economics survey and is tracking developer trends across platforms, app revenues and dev tools - as well as investigating the emerging IoT market. The key findings from the survey will become available in the form of a free research report in February. An interesting article about what happens when Google removes your app (because of a policy violation). Good news for all hybrid app developers. The WebView is now unbundled from Android and can be automatically updated from the Google Play store. In this post on Google+ by Ian Lake he explains how to get around the DEX limit by using MultiDex support. But he notes that you should try Proguard before going down the MultiDex rabbit hole. Android Lollipop introduced a lot of sweet new classes. In this post you'll lean how to use AnimatedVectorDrawable. In this post by David Gonzales you'll learn how to build applications for Android TV. He'll walk you though the subtle differences comparing to developing a smartphone or tablet app. A few slides by Andy Dyer about which libraries (like Dagger and Mockito) to use for test automation. In this post by Andy Dyer you'll learn how to prepare some code on Github to be easily included via gradle. Wouldn't it be nice if companies applied to you? On Hired, that's exactly how it works. Android developers are in demand, so let us introduce you to 1,300+ companies in one week. Join today. Android App Makers wanted! Come join a team building the next-generation of financial apps for Capital One. If Jelly Bean and KitKat make you think of ViewPagers and Fragments instead of tasty treats, then you need to come check us out! We're looking for developers with 2+ years Android experience. We are looking for experienced Android engineers to join our team in Zurich, as part of Numbrs. Come and help us to revolutionise the banking industry. Zurich is at the technological forefront, much like our cutting edge banking app Numbrs. Tried the Android Lollipop SDK? You may have noticed that Palette's API has been updated. As before, Palette allows you to extract colors from images for use in your UI."
