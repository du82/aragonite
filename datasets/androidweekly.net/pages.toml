full_description = "Android Tips Round-Up is a five part series by Dan Lew is a five part series that gives you nice tips about Android development. Lots of time savers in there. This post summarizes a two month long journey in the depths of Android’s Bluetooth Stack. It wasn’t nice. Alex Fu was recently working on an Android app that contained a variety of solid colors, all ranging from dark to light. During the development, he was finding myself repeating a very specific task over and over again… so he shared this code for calculating it automatically. There are quite a few open source libraries that Dario Penic uses on a daily basis. Here is a selection of five of his favorite ones and a list of links where you can find others. Between process management of the system at large and user behavior, there are a handful of methods through which your Android application process may terminate. There's a lot of buzz surrounding the possibility of using NFC-enabled smartphones to replace transit smartcards. The introduction of Host Card Emulation for Android (standard on OS 4.4 KitKat) is starting to fuel the development of many applications that could be used for mobile payments, access control, and smartcard emulation. One of the challenges developers have to face when writing UI tests is waiting for asynchronous computations or I/O operations to be completed. This post describes how that problem can be solved using the Espresso testing framework and a few gotchas the author learned. In this second part in a series, Antonio Leiva dives into some simple examples of using Dependency Injection in an Android app. Here's a look at the Android version distributions over the years, with some analysis of how version usage changes over time. Previously in this series Mark Allison looked at improving the UI of an app to display temperature and humidity obtained from a TI SensorTag device, but in this article he turns his attention to the UX. Testdroid is a family of development and testing products for Android and iOS apps and games. With the help of 300+ real devices and test automation at Testdroid Cloud, you can easily test mobile apps, pinpoint bugs and errors, and get detailed logs and screenshots in a matter of minutes."
