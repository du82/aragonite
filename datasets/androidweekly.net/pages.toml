full_description = '''The author recently ran into a huge pitfall with Parcelable objects, and writes about how to create proper unit tests for them. In this article Mark Allison continues developing a Bluetooth LE app, and looks at changing the background color according to the measured temperature by the LE device. When it comes to networking, there are tons of ways to do the requests. Most of the time you will end up with a lot of boilerplate code, or endless scripts containing transformations and stuff into useable code. Actually there’s a smarter way of doing that, namely by using Square's Retrofit library. There are times when using default Android views just don't cut it and you need to create your own View. So how exactly do you do that? Zarah Dominguez show you how. This new series will explain what dependency injection is, what its main purpose is and how to use it on an Android project by using Dagger, the best know implementation designed with Android in mind. In his continuing quest to get code out of Android Activities, Matt Swanson has implemented the traditional "Form Model" pattern in a recent project with great success and wanted to share my thoughts. With Apple introducing Swift, a new and easier to learn programming language, the Android ecosystem needs to even up. Cédric Champeau's explains in his blog post how to develop Android application using Groovy, a programming language similar to Ruby. Thanks to its API, Podio is an easily extendable work tool that helps teams organize the work they do everyday. Now it is expanding its customization capabilities with beta mobile SDKs for iOS and Android. Learn more at developers.podio.com. A deep dive on the tools and techniques for building Android applications that follow the Android Design guidelines. This talk presents patterns and protips for implementing the Holo visual language with it's content first philosophy and responsive design approach. A few weeks ago, Roman Nurik and Timothy Jordan were chatting about designing apps for wearables to validate some of the content they’re planning for Google I/O 20141. Here a post about everything they did to design an wearable app from scratch.'''
