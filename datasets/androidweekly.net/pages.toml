full_description = "Lot's of new code samples in Android Studio 1.0. Ranging from how to implement a message service til how to use the Leanback library for Android TV. Introduced alongside KitKat and enhanced with the Lollipop release of the v4 Android support library, a working implementation of the Swipe to Refresh UI pattern is included, called SwipeRefreshLayout. Mark Allison continues with the transition to RecyclerView and the drag & drop reordering implementation. In this part, Mark Allison show an example of how the RecyclerView offers simpler customization over ListViews. Here are four simple steps to follow to enable deep linking into your app from Google search results. This second article will show a few key aspects that you need to consider if you want to build a custom UI for your TV application. With Google Play services version 6.5 or later, it is possible for you to include Google Play services in your application using a number of smaller client libraries. We've created a cross-platform mobile framework, YAPL, that uses native controls. The Android implementation isn't quite up to our standards and we'd love your expertise to help it get there! With over 2M users, we're looking for an Android developer to help us scale! Join Ireland's largest classified websites mobile team, maintaining and improving our android app and mentoring team members, while using the best technologies to develop the fastest growing lifestyle app. Streak (YCombinator 2011) is a Gmail extension dedicated to better email. 200k+ downloads and a 4.5+ rating means we need Android! You'll have 10s of thousands of users from day 1. We're still small so you'll build both the App and your team. Do it your way with no legacy code. Ownership + equity! Gilt Senior Software Engineer Kevin Schultz has just released android-proguard-snippets: Sample ProGuard configurations for common Android libraries. Android Studio 1.0 is out. It's been quite a ride since it was first released to the public one year ago. Grab it while it's hot!"
