full_description = "There was a lot of discussion in the Pixite team about how to encourage people to rate the app without being annoying. Here are some of the things they considered and learned. Glide is an open source media management framework for Android that wraps media decoding, memory and disk caching, and resource pooling into a simple and easy to use interface. It is specifically designed not only to be easy to use, but also to make scrolling lists of images as smooth and pleasant to use as possible In this series of posts, we will be focused on the low-level details involved in building your own LayoutManager implementation, to do something a bit more complex than a simple vertical or horizontal scrolling list. Previously in this series we’ve looked at the software design decisions and the main timer engine for our Android Wear app to time do football (soccer to our American cousins) matches. In this article Mark Allison looks at how we can wake up periodically in order to update the user. Fernando Cejas decided that was a good time to write an article about architecting android applications. The purpose of it is to show you a little approach he had in mind in the last few months plus all the stuff I have learned from investigating and implementing it. FFMPEG is a beast when it comes to compiling it manually. This article explains how you do it for Android including the x264 codec. Maximize performance wherever you use native C/C++ code in your Android apps with the Qualcomm® Snapdragon™ LLVM Compiler. Optimized for Snapdragon processors, it’s another tool from the Qualcomm Developer Network to help you enhance your apps more efficiently and effectively. Google refreshed the Beautiful Design collection with their latest favorite specimens of delightful design from Google Play. As a reminder, the goal of this collection is to highlight beautiful apps with masterfully crafted design details such as beautiful presentation of photos, crisp and meaningful layou