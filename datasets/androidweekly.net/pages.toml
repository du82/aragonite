["https://androidweekly.net/issues/issue-120"]
title = "Android Weekly - Free weekly Android & Kotlin development newsletter"
description = "Android Weekly is a free newsletter that helps you to stay cutting-edge with your Android Development."
full_description = "Erik Hellman delves into one of the most severe issues for Android app developers today -- the dreaded 64k method reference limit that exists in the DEX file format. Instagram Engineering spent the last year reimagining and redesigning their Android app to work better for users, no matter what phones they use or where they are located. Google Play services 6.1 adds Enhanced Ecommerce analytics support from Google Tag Manager and offers new improvements to the Google Drive Android API. The latest release also includes a refresh of the Google Fit developer preview, so that you can test your fitness apps on any Android device. RequestHandler is a new public class that can be subclassed by Picasso users to extend the library with custom image loading logic. RxJava is the new hotness amongst Android developers these days. The only problem is that it can be difficult to approach initially. The goal of this three-part series is to get your foot in the door. Dan Lew just want you to become interested in RxJava and how it works. Top Android developers are in demand, so we built Hired---the marketplace where companies compete for YOU! You'll get multiple, transparent offers with salary & equity disclosed upfront. You'll decide who you want to talk to. No risk. All reward. Join Hired today! Qualcomm® TrepnTM Profiler is designed to let you profile the performance and power consumption of Android apps running on devices featuring Qualcomm SnapdragonTM processors. It’s designed to help optimize code for CPU usage & frequency, memory statistics (virtual & physical) and network usage. A post on the official Android Developers Blog about how to integrate messaging for Android Wear with your application. If your app has notifications the system does the heavy lifting for you - but it's very interesting to add custom actions or even custom layouts. We are looking for an Android Developer to be at the cutting edge of mobile tech at App Annie, driving forward our presence on Android by developing our portfolio of apps. App Annie is the global industry leader in app store market intelligence and analytics. We'd love to hear from you!"
