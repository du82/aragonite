full_description = "Using new Camera extensions API by Victor Brandalise Victor Brandalise explores the new Camera Extensions API, highlighting its support for advanced features like Night and Bokeh modes through Camera2 and CameraX. Collection Processing Guessing Game! Marcin Moskala tests your understanding of Kotlin collection processing. Widgets with Glance: Displaying images Katie Barnett explains how to incorporate images into Android widgets using Jetpack Glance, while ensuring efficient background image loading and proper state handling. Jetpack Compose and Edge-to-Edge on Android 15 Dobri Kostadinov looks at how Android 15’s edge-to-edge feature impacts Jetpack Compose development. Performance Class helps Google Maps deliver premium experiences Nevin Mital takes a look at how Google Maps was able to tailor a feature launch to best fit each device with Media Performance Class. Apps adopt Transformer to support more performant media editing Caren Chang discusses how the Jetpack Media3 library’s Transformer module offers reliable and high-performance APIs for media transcoding and editing, enabling operations like trimming, applying video effects, and format conversion. Kotlin Design Patterns - Part 3 In this third installment, Ignacio Carrión covers Memento, Command, Visitor, Chain of Responsibility, and Mediator patterns. Using SVGs on Canvas with Compose Multiplatform Eevis Panula demonstrates how to convert SVG images into paths for use in Compose’s Canvas, providing flexibility in rendering vector graphics across Compose Multiplatform. Running Specific Android UI Tests using TestParameterInjector via a Regex Sam Edwards sheds light on the relatively uncommon tests_regex instrumentation argument, which allows tests to be run based on a regular expression. The Power of SKIE Subplugins Tadeas Kriz shows how to generate Swift code for your Kotlin Multiplatform project using SKIE subplugins. Jetpack-Compose-preview-creator An Android Studio plugin to quickly create jetpack compose preview functions"
