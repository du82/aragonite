title = "Reflections on 2020 as an independent researcher | Andy Matuschak"
full_description = "Reflections on 2020 as an independent researcher2020 was my second year as an “independent researcher.” I’m grateful for the freedom that strange job title entails, but it’s certainly not well-defined. I’ve needed to grope around in the dark for patterns and structures which pre-existing institutions and roles would ordinarily provide. To kick off 2021, I’ll share some of what I’ve learned, as well as of the outstanding questions which seem most pertinent. These observations are necessarily quite personal, but I hope they’ll be of interest or use to others considering similar paths.1. Why work independently?I’m not interested in independence for its own sake. I’m interested in inventing environments which significantly expand what people can think and do. That aspiration is what drives my work, rather than a particular title, role, or practice. When I use phrases like “independent researcher” to describe my work, the title is a loosely-held shorthand for what I really value: freedom of inquiry.For that matter, I’m skeptical that “independent researcher” is a stable or desirable long-term identity. Independence offers freedom, but it’s also quite limiting, as I’ll discuss in more detail later in this essay. If the work goes well, an independent researcher will likely find compelling opportunities to evolve into some higher-leverage institution—a studio, a foundation, an academic center, a business. If the work doesn’t go well, most independent researchers would have trouble staying afloat.In my case, the aspiration isn’t just to solve the object problem of, say, forgetting what you read. I want to more deeply understand the properties of enabling environments—principles of operation, design procedures and patterns, relationship to individual and social cognition—to foster a community which routinely invents new environments of this kind. Field creation will almost certainly involve institution creation. But my understanding is too weak right now to see much further.Why not start a startup?I understand theories by making software, and I live in San Francisco, so people often expect that I’m planning to launch a startup. But my interests are misaligned with a startup’s fundamental drive: growth. I’m interested in generating insight, not in generating growth, except insofar as growth is necessary to understanding the ideas I’m trying to explore.Some companies figure out how to align these aspirations so that marginal revenue/usage enables marginal fundamental insight, which enables marginal revenue/usage, and so on, in a virtuous cycle. Pixar is a good example. Cutting-edge graphics research enables new kinds of storytelling, which in turn funds more research. To be sure, many startups do uncover fundamental insights, but usually as an inconsistent means, rather than as an end. A steady loop like Pixar’s is quite rare. You need a specific theory about why a given business model is connected to a given type of insight generation. You also need to explain why marginal insight remains an ongoing prerequisite to marginal business, rather than a “nice to have” which can be cut when convenient. I don’t have a theory like this for my own work yet. Such flywheels are particularly rare in my domain, since novel interface ideas are typically public goods. Their development might require significant investment, but once created they can often be copied cheaply by others, limiting returns to the inventor.A related question I’ve had to straighten out for myself: am I really aiming for insight, or for impact? Is my goal only to invent such environments—or also to operationalize, scale, and spread them? Well, it’s true that my work is use-inspired; I identify more with applied researchers than with basic scientists motivated purely by discovery. So I wouldn’t want to work on a project without the possibility of transformative impact. But so long as I have some persuasive theory of how that impact could happen, I prefer to focus on producing insight through prototypes. I’d rather let others operationalize those insights into scaled products.To put this another way, I’ll invoke a common trope about startups: “ideas are cheap; execution is what matters.” It’s a decent if overstated rule of thumb—but not because new ideas are unimportant. Startups are fragile. They usually focus on niches where execution is the primary factor because they have to. They tend to die if they tackle a niche which continuously demands both outstanding execution and also deep, original insight. This lens suggests a useful way to frame my goal: developing ideas far enough that they become “obvious,” the banal fodder for half a dozen companies in a future YC batch.Another key misalignment makes me hesitant to consider a startup: culture. Tech culture is different from research culture, and I’m already quite overweight on tech culture. Anyone working in an industry for a while tends to adopt elements of that culture—its processes, its norms, its values, its tacit knowledge. Much of this is incredibly valuable, of course, but these norms also create constraints.For example, tech culture is calibrated to a much faster pace than research culture. A “huge project” for a Silicon Valley tech person may be a year or two long; a “huge project” for a researcher may last a decade. Persistence with a difficult problem may require tens of hours for a tech person and hundreds (or thousands) of hours for a researcher, no matter how quickly try to work. It’s not that the tech people are constitutionally lazy or something like that: in industry, it usually is, in fact, a bad idea to spend many hundreds of hours thinking about a single problem. Better to create an 80/20 solution or try a different approach. But foundational insights often do require more patient, focused thought than heuristics from tech culture would naturally encourage. Coming from the tech industry, my expectations around the pace of progress are often seriously miscalibrated for many problems I’m tackling. I’ll feel like I’ve been banging my head against a question forever, but it’s only been a few tens of hours. That’s nothing! With this mindset, I’ll miss the results I seek and, as a bonus, drive myself nuts. I’m working to become much more comfortable slowing down.Why not become an academic?If I’m interested in freedom of inquiry and focused on generating insight, why not join academia? There are some boring stock answers: publish-or-perish, the grant treadmill, overbearing administrative responsibilities, conservatism, etc. But the real reason is my choice of field. My goals, values, and practices align poorly with the academic discipline which would most naturally host my work, human-computer interaction (HCI). If, in some alternate universe I were interested in a different topic, there’s a good chance I’d have become an academic.That’s a dispassionate way to put it. A subjective and inflammatory way to put it is that I feel academic HCI discourages vision and imagination. Part of the trouble seems to be that the field’s trying too hard to be a science. It emphasizes an empirical approach, often producing elaborate artificial evaluations of uninteresting systems. Peer reviewers seem to reward analysis and data over ingenuity and compelling direction. The field disincentivizes building systems significant enough to explore new paradigms; published systems are rarely driven by a serious context of use. I read the major conferences’ proceedings every year, yet I learn much more about HCI from studying game designers and idiosyncratic Twitter tinkerers. Of course, there are a few researchers who do great work in spite of the field’s challenges. It’s hard not to be inspired by people like Hiroshi Ishii or Ken Perlin. And I should be clear that these are comments about the field, not about the individuals in it, who have consistently struck me as kind and well-intentioned. The headwinds just seem too strong to justify.I’ll share one more story about the field. I noticed a professor’s name on several papers I enjoyed, so I invited them to chat. We had a friendly, wide-ranging conversation about topics in the field. Then at one point, I asked: “How do you balance pressing your own long-term research agenda in your lab with supporting the inquiry of your grad students?” They replied with some consternation: “Oh, no no, you have it wrong. I view my primary role as helping students pursue their own research projects. I’m not trying to push any long-term agenda of my own.” I suspect they exaggerated their stance here. Beneath the surface, I can see some consistent theories threading through the students’ papers. But if all professors really operated according to this one’s belief, we can see the problem that would be induced. The entire field would consist of nothing but student work, without any venue for senior researchers to develop an idea of their own over time. I’m sure that’s not actually what’s happening, but qualitatively, the sense I get reading the major conference proceedings isn’t so different. It feels like skimming a sea of churning froth—tiny isolated studies rarely accreting into a broader current.I criticize academic HCI not out of ill will but out of genuine perplexity. I honestly don’t understand why the field behaves as it seems to behave. I’d really love to be wrong. If you think I’ve misunderstood something, I’d love to read your comments. Maybe the problem is that I’m actually trying to start a field which doesn’t exist yet, so of course HCI looks misaligned. Maybe this is my version of Bryan Caplan’s sour grapes. Maybe I’m too arrogant or closed-minded.So I work independently. Not because that’s an ideal arrangement, but because I don’t see a good alternative. I don’t yet know how to create or join an institution which would enable better work. Part of the trouble comes from working in a proto-field, without methodology or principles solid enough to effectively support a pipeline of new investigators. In fact, I don’t understand yet my own projects well enough to effectively coordinate a large team around them, though I could certainly put a few more hands to good use. The most concrete incremental constraint is, of course, funding. Let’s talk about funding.2. The unexpected success of crowdfunding researchWhen I left Khan Academy in early 2019, my (very understanding) wife and I made a rough plan: in 2019, I’d focus on the work and avoid thinking about funding at all; in 2020, I’d figure out some plan for sustainability and begin moving towards it; hopefully by the end of 2021, we’d stop burning cash. My collaborator Michael Nielsen suggested we set up a Patreon to solicit funding for our work, and I agreed, not thinking much of it. He’s now moved on, but I’m quite grateful to him for that early nudge.Less than two years later, my patrons have crowdfunded roughly a graduate student’s fellowship grant. It’s not lucrative, but it’s enough to cover my living expenses. That’s an important milestone! So long as this income stream continues, my runway has been extended indefinitely—or at least until I start getting nervous about not being able to save. My goal was to end 2020 with a plan for how to eventually fund my work, but I’m astonished to now find myself ending 2020 with solid funding in hand.Is this a model which other independent researchers could use? My story doesn’t necessarily generalize, but I’ll share some observations which might be useful to others interested in experimenting with crowdfunded research.Growing a crowdfunded research grantFirst, we should examine the dynamics of growth and churn. The funding must be stable if it is to be a viable source of independent research. In Technology and Courage, Ivan Sutherland describes courage as one of the key ingredients for research and notes:I find that I have only so much room for taking risks. When I can reduce the risk in some places in my life, I can more easily face risk in other areas. I provide myself the courage to do some things by reducing my need for courage in other areas.This certainly matches my experience, not just with Patreon but with marriage, home ownership, investments in well-being, and so on.These charts depict the shape of monthly revenue and membership count growth over 2020 (the differences are due to volatility in the distribution of patrons’ pledge sizes):On the whole, then, my Patreon experience has been characterized by modest but steady growth. To understand how stable the funding is, we should understand the dynamics of churn, which these charts don’t depict. The story there looks decent: monthly new patron rate (median, 25–75th %ile) was 9% (8–15%); monthly departing patron rate was 3% (2–4%). This suggests reasonable stability, though departure numbers should increase over time since the Patreon is new, while new patron growth may decline as I saturate my interested audience.Annual billing has been a helpful boon for me. Roughly a quarter of new patrons elect to pledge on an annual basis. Assuming steady revenue growth, then, these patrons’ annual commitments let me fast-forward about three months into the future along my growth curve. Annual pledges also offer a helpful extra measure of stability.On my Patreon, I offer three funding tiers: $5, $20, and $100. The tiers are mostly arbitrary for now—the only difference is that the $100 tier comes with public attribution (which no sponsor seems to care much about). But the tiers give people a way to modulate their support according to their interest and capacity. I’m quite happy with how the price mix has worked out. Most of my revenue comes from $5 members, while a smaller number of more generous sponsors’ contributions boost my funding considerably. In aggregate, that mix generates a grant large enough to live on, while freeing me from worries about any individual funder. This does wonders for my peace of mind. At Khan Academy, we were often quite dependent on a small number of huge-value donors, and we’d regularly fret about appeasing them; when one would decline to offer another grant, it would create tremendous stress. The “grassroots” situation creates a much healthier interpersonal relationship with funders, some of whom are personal friends—I’d hate for anyone to feel like they need to keep funding me out of some sense of guilt.Patron growth appears to be roughly linear, but you’ll notice a discontinuity in the slope of the graph around May. That’s when I decided to try sharing more exclusive writing with patrons. This does seem to have worked as an enticement, though I’m actually not sure how important exclusivity is. I expect the articles drive new patron growth in part because they create repeated opportunities for others in patrons’ networks to stumble upon my work. Is the higher rate of growth because people want to unlock the paywall, or because articles create traffic? I hardly promote the Patreon at all—I’m not yet sure how to do that "
