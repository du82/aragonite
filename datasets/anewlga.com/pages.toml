["https://www.anewlga.com/about-the-project"]
title = "About the Project - LaGuardia Redevelopment"
description = "A Whole New Airport for New York"
full_description = "The Project The New LaGuardia Airport Terminal B Terminal C An Ambitious Vision A Whole New LGA In 2015, a comprehensive plan to construct a whole new LaGuardia Airport was unveiled with the goal of creating a world-class, 21st century passenger experience featuring modern customer amenities, state-of-the-art architecture, more spacious gate areas and a unified terminal system. The $8 billion project, two-thirds of which is funded through private financing and existing passenger fees, broke ground in 2016. The New LaGuardia Airport The comprehensive redevelopment of LaGuardia Airport represents one of the most significant airport redevelopment projects in the United States in more than 20 years. LaGuardia Airport is being transformed into a unified airport with new terminals, better transportation access, additional airside taxiways and best-in-class passenger amenities. Read More Terminal B Led by LaGuardia Gateway Partners (LGP), the $4B LaGuardia Terminal B project is the largest public-private partnership in US aviation history. The redevelopment includes a new 35-gate terminal, a Central Hall, a parking garage, related roadways and supporting infrastructure – all with innovative construction phasing, including building over-top of the current operation, to allow the terminal to remain fully functional while under construction. Read More Terminal C Building on the $2 billion Delta Air Lines has invested in New York over the past seven years, Delta will develop, construct, operate and maintain a new, state-of-the-art home to replace Terminals C and D. Delta broke ground on construction of the new $4 billion terminal in August 2017. Read More An Ambitious Vision This represents one of the most significant airport development projects in more than 20 years. The comprehensive redevelopment of LaGuardia Airport involves transforming LaGuardia into a unified airport with new terminals, better transportation access with future AirTrain, additional taxi-lanes and best-in-class passenger amenities. The Challenge Create a new airport atop an existing airport while minimizing customer inconvenience and any inconvenience to the communities surrounding LaGuardia’s uniquely small geographic footprint. The Solution LaGuardia Airport will be transformed into a single, unified facility with expanded transportation access, significantly increased taxiway space and best-in-class passenger amenities. By moving the unified airport closer to Grand Central Parkway, the project will increase airport taxiways by more than two miles and reduce airport ground delays. This will allow for a more efficient circulation of aircraft and reduced taxi-in and taxi-out times, which will yield shorter and fewer gate delays – a dramatic difference from today’s LaGuardia. In addition, this change will produce an overall reduction in carbon emissions from idling aircraft. The airport will be intuitive for passengers to navigate, and will facilitate efficient movement throughout the facility, offer state-of-the-art amenities, and expanded public transportation. The Execution The plan for reconstructing LaGuardia Airport includes complex, multi-phased components in which old facilities are demolished while new facilities are being constructed. The successful execution of the transformation is carefully planned around the ongoing full operation of the airport without disruption. In addition, roadway access to the airport continues to be improved as we’ve already seen with the recent opening of the Grand Central Parkway Exit 7 (EB). Explore More Interactive Maps News + Media Milestones Residents"
year_published = 2025
year_updated = 2022
clearnet = "https://www.anewlga.com/about-the-project"
