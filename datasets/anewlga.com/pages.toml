title = "Milestones - LaGuardia Redevelopment"
description = "A Whole New Airport for New York"
full_description = "Redevelopment Milestones Making LaGuardia Airport ready for a multi-billion dollar redevelopment takes thoughtful planning and we’re proud of the progress made so far. 2022 June Opening of Delta’s Terminal C, marking substantial completion of whole new LaGuardia Airport. April Solar rooftop is unveiled on western parking garage, generating 1.34 megawatts of renewable energy. January Completion of Terminal B’s passenger facilities including its second pedestrian skybridge as one of the airport’s signature architectural features. 2021 December Terminal B wins UNESCO’s prestigious 2021 prix Versailles for best new airport in the world. December Reach milestone of record $2 billion in contracts awarded to minority and women-owned businesses. July Terminal B is the world’s first airline terminal to earn LEED v4 gold certification for sustainability. 2020 December Contracts awarded to certified MWBEs at the LaGuardia Airport Redevelopment Program have exceeded $1.58 billion, the largest for any public-private partnership project in New York State. August On August 5, the first seven new gates in the new Western Concourse opened, welcoming more travelers through LaGuardia’s Terminal B with a world-class passenger experience. JULY New concourse and gates opened at LaGuardia’s Terminal B, making a summer of progress on airport’s complete redevelopment JULY Construction of the steel frame for Delta’s new arrivals and departures hall was completed, an important milestone marked by a traditional “topping out” ceremony. June Terminal B Arrivals and Departures Hall opens with advanced security protocols and COVID-19 safety protocols in place 2019 November New Terminal C’s first concourse, Concourse G, opens to the public November These bridges increase capacity for traffic exiting Delta Terminals C & D October New Terminal C Headhouse steel erection begins October LGA AirTrain receives PA Board Project Authorization of $2.05 Billion August This bridge allows Terminal B access from GCP WB, and future Terminal C & D access July Steel erection for Terminal B Concourse A North completed March New bridge allowing inbound airport access and recirculation This bridge allows for inbound airport access from 102nd Street as well as recirculation for Delta Terminals January Terminal C – Concourse G Delta’s new Terminal C will consist of 37 gates and will replace the existing Terminals C and D. The new Terminal C will have 4 concourses – D, E, F and G – with Concourse G being the first in the new terminal to open. January Pile driving for the New Terminal C frontage roadways begins 2018 December Concrete structure of the new Rooftop Electrical Substation complete November Eastern Concourse Opening Opening of First New Concourse Featuring Wide Array of New York-Inspired Dining and Retail Marks Initial Phase of LaGuardia’s $8 Billion Complete Rebuild with a Focus on 21st Century Customer Experience October Temporary bridge for Terminals C & D activated The temporary Acrow bridge connecting the departures levels for existing Terminals C & D is activated and enables demolition of the exit ramp from Terminal D and entrance ramp to Terminal C, facilitating Headhouse construction. October Terminal C/D departures-level roads re-aligned September Concourse G curtain wall commences August Central Hall Steel Erection begins July Opening of Exit 7 Flyover to New Exit 7 Bridge With nearly 18,000 vehicles traveling to LGA daily, the eastbound Grand Central Parkway Exit 7 flyover is anticipated to handle 20 percent initially of the airport’s total inbound traffic. This entry is one of four current access points to LaGuardia, with the others being Grand Central Parkway Westbound Exit 7, 94th Street northbound for local traffic and Marine Terminal Drive off 82nd Street, also for local vehicles. The new flyover is designed to provide a more direct route for vehicles traveling to the eastern side of the airport, where Delta Air Line’s gates and operations are located. May Car Services move to Terminal B Garage for Passenger Pick Up April Pile driving for the New Terminal C Headhouse begins February Concourse G structural steel erected February Terminal B – Concourse B The new Terminal B includes the construction of 2 “island” concourses accommodating 35 gates. The new Concourse B will be the first section of the terminal to open. February Opening of Terminal B Parking Garage The Terminal B Parking Garage is located west of the LaGuardia Air Traffic Control Tower (ATCT). The garage has seven levels, totaling 1,143,540 sq. ft. of parking area, with 3,129 parking spaces. The garage footprint (300 feet wide, 545 feet long) covers almost 4 acres and its foundation is composed of approximately 1,000 18” steel taper tube piles. The garage opened in February 2018 and has 3 entry lanes and 7 exit lanes. 2017 October Flyover Steel Bridge First set of steel for the Flyover bridge across Grand Central Parkway eastbound is installed. September Delta Air Lines lease agreement approved September Terminal B Parking Garage Precast Erection Precast erection is completed in the Terminal B Parking Garage. August Terminal C Groundbreaking for Delta Air Lines Delta Air Lines groundbreaking event July New Bridge Steel Erection Steel erection for the new bridge begins for the Grand Central Parkway service road westbound. June Eastern Concourse Steel Truss Corner steel truss is set inEastern Concourse. Installation of metal decking on interior level is complete. May Headhouse Steel Erection Steel erection begins on the Headhouse. The Port Authority of NY & NJ selects Parsons Brinkerhoff to create feasibility study for new AirTrain. April Central Heating and Refrigeration Plant Steel Installation Begins Steel installation begins for the Central Heating and Refrigeration Plant (CHRP) which will house the heating and cooling equipment for the New Terminal B. April LGA AirTrain Planning Consultant Contract Awarded to WSP February RFP for AirTrain Planning and Preliminary Design Services Issued The Port Authority of NY & NJ issues a Request for Proposals (RFP) for AirTrain planning and preliminary design services January Terminal B Parking Garage Precast Terminal B Parking Garage precast erection begins. January Eastern Concourse Steel Erection Steel erection begins on Eastern Concourse. 2016 December P2 Parking Garage Demolition Complete Demolition of the P2 Parking Garage primary structure is complete. October Terminal B Pile Driving Pile driving commences to begin constructing the foundation for the New Terminal B August Roadway Construction Roadway construction begins to reconfigure airport roads in preparation of the new Terminal B. June Terminal B Groundbreaking for LaGuardia Gateway Partners Governor Andrew Cuomo and Vice President Joe Biden announce groundbreaking on new LaGuardia Airport. Construction begins on a new 1.3 million square foot, state-of-the-art 35-gate terminal, along with a new Terminal B Parking Garage and other supporting facilities. June PANYNJ & LaGuardia Gateway Partners The Port Authority of New York and New Jersey and LaGuardia Gateway Partners reach financial close on the Public-Private Partnership (PPP). LaGuardia Gateway Partners begins managing and operating Terminal B, as part of a 35-year lease agreement. The lease also includes the construction of a New Central Hall, a key recommendation of Governor Andrew Cuomo’s airport advisory panel, and supporting infrastructure, including new roads and a parking garage. March Terminal B Parking Garage Construction Construction commences on the Terminal B Parking Garage that will provide LaGuardia Airport with 3,129 parking spaces, seven levels, electric car charging stations and low-emissions preferred parking."
