title = "Terminal C - LaGuardia Redevelopment"
description = "A Whole New Airport for New York"
full_description = "Terminal C In June 2022, Delta Air Lines opened its new, state-of-the-art and world-class home at LaGuardia Airport, where the $4 billion new Terminal C replaced the airline’s two antiquated and undersized terminals. The expansive new Terminal C, nearly twice the combined size of the former terminals C and D, features soaring floor-to-ceiling windows that fill the terminal with natural light by day, while providing panoramic views of Flushing Bay and CitiField to the east. The soaring spaces of Terminal C set the stage for an inspiring array of artworks from a wonderfully diverse group of highly respected, local artists, commissioned by Delta in partnership with the Queens Museum. Inspiring public art works have become a hallmark of the Port Authority’s transformative airport redevelopment projects. Throughout the new Terminal C, cutting edge technology, unmatched security features and an exciting selection of locally-inspired concessions featuring iconic New York brands are a demonstration of our relentless focus on providing a truly best-in-class passenger experience. The new terminal includes 37 flexibly sized gates that can accommodate Delta’s full fleet, distributed among four concourses connected by a centralized check-in lobby, security checkpoint and baggage claim. Dual taxi lanes between the concourses will greatly improve airfield efficiency, resulting in reduced taxi time to and from the gate before take-off and after landing. Concourses E and G are complete. Concourses D and F will open in phases. Terminal C’s new concourses offer larger gate areas and more seating, as well as 30 percent more concessions space than what passengers found at the terminals it replaced. A new Delta Sky Club – Delta’s largest — will feature a Sky Deck with airfield views, locally inspired food options, artwork from emerging New York artists, and other unique amenities. The terminal includes improved roadways and drop-off/pick-up areas, as well as a curbside check-in bypass leading directly to the security checkpoint. The overall terminal design integrates sustainable technologies and improvements in energy efficiency. Throughout the overall $8 billion LaGuardia redevelopment project, the Port Authority and its private partners – Delta at Terminal C and LaGuardia Gateway Partners at the new Terminal B — have championed an intensive outreach to Minority and Women Owned Business Enterprises, resulting in more than $2 billion in MWBE contracts, the largest participation by such firms in any public-private partnership in New York’s history. LaGuardia’s redevelopment has also awarded $850 million in contracts to local, Queens-based businesses. The New LaGuardia Airport The comprehensive redevelopment of LaGuardia Airport represents one of the most significant airport redevelopment projects in the United States in more than 20 years. LaGuardia Airport is being transformed into a unified airport with new terminals, better transportation access, additional airside taxiways and best-in-class passenger amenities. Read More Terminal B The Port Authority of NY & NJ selected LaGuardia Gateway Partners to modernize and redevelop Terminal B, including updating it with environmentally friendly parking options. LGP broke ground on construction of the new $4.2 billion Terminal B in June 2016. Read More About the Project The comprehensive redevelopment of LaGuardia Airport involves transforming LaGuardia into a unified airport with new terminals, better transportation access, additional taxi-lanes and best-in-class passenger amenities. Read More"
