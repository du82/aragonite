full_description = "Job Opportunities Explore new opportunities at LaGuardia Airport. Thank you for visiting our Job Opportunities site and for your interest in employment at LaGuardia Airport. JOB SEEKERS – CAO PROVIDES FREE OF CHARGE: Job search assistance and referral to prospective employers Career counseling Orientation for success in employment Skills training opportunities Internship/Apprenticeship opportunities Click logo to view more Job Opportunities at Port Authority New York New Jersey. Program Manager Under the direction of the Senior Program Manager, the successful candidate will be responsible for assisting in the development, coordination and delivery of the overall LGA Capital Plan and Operating Major Works portfolio. The incumbent will coordinate with the Facilities Planning Division, as well as the airport’s Operations and Maintenance Units in determining short- and long-term objectives. The day to day responsibilities include, but are not limited to: supervising the daily activities of Senior Project Managers and Project Managers in the initiation, planning, executing, monitoring and close out for assigned projects; identifying offsets to allow additional projects entered into the plan, ensuring compliance with the developed contract award plan. Click logo to view more Job Opportunities at LaGuardia Gateway Partners Terminal Operations Specialist The Terminal Operations Specialist monitors and coordinates daily tasks that are intended to ensure the safe and efficient movement of passengers throughout the terminal while also emphasizing commitment to providing a world-class guest experience. Responsibilities include trouble-shooting service level failures, monitoring critical systems, responding to calls and conducting terminal and safety inspections. The focus of this role is to support the Terminal B operation by attending to the requests and concerns of airport tenants, staff, customers, and government agencies. It further includes oversight facilities-related contract management. This role reports to the Operations Manager and requires the ability to work autonomously while exercising sound judgment with a focus on operational excellence. Click logo to view more Job Opportunities at OTG Starbucks Baristas Baristas at LaGuardia Airport are responsible for delivering the OTG Starbucks experience to all guests and fellow crewmembers. This job creates a great experience by providing guests with prompt service, quality beverages, and products and maintaining a clean and comfortable store environment. To be successful in this role, the barista should enjoy working with others as exhibited through great guest experiences, and be motivated to keep the store cleaned and stocked. Click logo to view more Job Opportunities at SKANSKA Accounts Payable Coordinator (Construction) Skanska is searching for a dynamic Accounts Payable Coordinator. This is a great opportunity to start a career with a company that builds things that matter and values its team. We are proud to share our culture of diversity and inclusion. Payroll Administrator Skanska is searching for a dynamic Payroll Administrator. This is a great opportunity to start a career with a company that builds things that matter and values its team. We are proud to share our culture of diversity and inclusion. Accounts Payable Administrator Skanska is searching for a dynamic Accounts Payable Administrator. This is a great opportunity to start a career with a company that builds things that matter and values its team. We are proud to share our culture of diversity and inclusion. Click logo to view more Job Opportunities at Delta Airlines Aircraft Maintenance Technician The Aircraft Maintenance Technician (AMT) is a critical TechOps role at Delta. In this role, you will maintain the proper and safe functioning of Delta’s fleet, ensuring customers have an exceptional travel experience. AMTs maintain aircraft, aircraft engines, and aircraft components and avionics systems according to Delta and FAA specifications; perform inspections during assembly of parts and after repair or installation of components; document maintenance procedures including component damage, origin, and condition; and practice safety conscious behaviors in all operational processes and procedures. Apprentice – Aircraft Support Mechanic-(LGA) The Apprentice – Aircraft Support Mechanic (ASM) is a critical TechOps role at Delta Air Lines. In this role, you will get on-the-job training that provides practical experience with the procedures, practices, materials, tools, and equipment generally used. You will serve as part of the crew that helps maintain the proper and safe functioning of Delta’s fleet, ensuring customers have an exceptional travel experience. ASMs will assist Aircraft Maintenance Technicians (AMTs) in technical or non-technical functions related to aircraft interiors (or other areas as needed). Click logo to view more Job Opportunities at Prime Flight OVERNIGHT Janitorial Cleaner To perform this job successfully, an individual must be able to perform each essential function satisfactorily. The requirements listed in this Job Description are representative of the knowledge, skill, and/or ability required. Reasonable accommodations may be made to enable individuals with disabilities to perform the essential functions. OVERNIGHT Aircraft Cleaner To perform this job successfully, an individual must be able to perform each essential function satisfactorily. The requirements listed in this Job Description are representative of the knowledge, skill, and/or ability required. Reasonable accommodations may be made to enable individuals with disabilities to perform the essential functions. Aircraft Cleaner Supervisor Supervise the aircraft cleaning processes in order to provide a clean aircraft to our airline customers and their passengers, and the activities of workers involved in cleaning all assigned aircraft thoroughly and efficiently by performing duties Senior Supervisor The Duty Manager assists the day-to-day activities of the operation and must be able to assume the responsibility of their shift. The specific duties vary by location, at the direction of the Station Management Passenger Service Agent Serve customers in a courteous, efficient, friendly, and professional manner. Promote and sell air travel to the traveling public. Provide assistance with passenger check-in and successfully interpret government rules and requirements for domestic and international travel. Click logo to view more Job Opportunities at Hudson Group Starbucks Hiring Event Hudson, North America’s largest travel retailer is hosting a Starbucks Hiring Event for LaGuardia Airport Thursday, November 2nd from 10am-1pm LaGuardia Airport Terminal B Bus Level, in front of the Dunkin Donuts Store Positions Paying Up to $19.00/hour + $300 Sign-On Bonus Tuition Assistance Program Health/Vision/Dental Insurance 401K Up to a $500 Employee Referral Bonus Click logo to view more Job Opportunities at HMS Host Bartender – IL Viaggio The Bartender is responsible for greeting customers, taking drink/food orders, mixing ingredients such as liquor, soda, water, and sugar to prepare cocktails and other drinks, as well as serving beer and other beverages, and completing transactions; communicating ticket times and potential problems to the manager on duty and the servers as necessary; providing the highest quality of service to customers and associates at all times; performs all other responsibilities as directed by the business or as assigned by management. Cocktail Server – IL Viaggio The Cocktail Server is responsible for taking food and beverage orders; entering orders quickly and in proper sequence; serving food and beverages for guests in their section as well as other sections; coordinating with the kitchen to ensure timely service and quality of the food; and providing the highest quality of service to the customer at all times; performs all other responsibilities as directed by the business or as assigned by management. This is a non-exempt position and typically reports to the Store Manager, Assistant Store Manager, or General Manager depending up local requirements.. Cook – IL Viaggio The Cook is responsible for preparing cooked foods, and must be able to perform all station functions of Fry, Flat Top Griddle, Pantry, and cooking eggs; communicating ticket times and potential problems to the manager on duty and servers as necessary; providing the highest quality of service to customers and associates at all times; performs all other responsibilities as directed by the business or as assigned by management. This is a non-exempt position. Crewmember – IL Viaggio The Crew Member is responsible for performing a variety of duties within a fast food establishment which may include cleaning the food or stock areas, operating fryers & microwaves, manning food preparation production line, assisting in the kitchen area, and maintaining inventory; performs all other responsibilities as directed by the business or as assigned by management. This is a non-exempt position. Cashier – La Chula The Cashier is responsible for completing sales transactions within the establishment and performing other support functions which may include cleaning the food, display and/or stock areas and assisting with stocking activities; performs all other responsibilities as directed by the business or as assigned by management. Utility – Food and Beverage – HMS Host Responsible for cleaning equipment, floors, workstations, utensils, pots and pans using specific chemicals to ensure sanitary standards; checks ice levels, keg beers, bib sodas and Co2 containers and replaces if necessary; loads and unloads supply trucks. Crew member – Shake shack The Crew Member is responsible for performing a variety of duties within a fast food establishment which may include cleaning the food or stock areas, operating fryers & microwaves, manning food preparation production line, assisting in the kitchen area, and maintaining inventory; performs all other responsibilities as directed by the businessor as assigned by management. This is a non-exempt position. Assistant General Manager – Shake Shack The purpose of the Assistant General Manager (AGM) position is to assist Branch management in tactically executing complex QSR or Casual Dine or similar restaurant management operations. The AGM ensures the restaurant is clean, ready for business, staffed, and operates to high operational standards. The AGM uses prescribed policies and procedures to make management decisions.. Cook-La Chula The Cook is responsible for preparing cooked foods, and must be able to perform all station functions of Fry, Flat Top Griddle, Pantry, and cooking eggs; communicating ticket times and potential problems to the manager on duty and servers as necessary; providing the highest quality of service to customers and associates at all times; performs all other responsibilities as directed by the business or as assigned by management. This is a non-exempt position. Assistant General Manager The purpose of the Assistant General Manager (AGM) position is to assist Branch management in tactically executing complex QSR or Casual Dine or similar restaurant management operations. The AGM ensures the restaurant is clean, ready for business, staffed, and operates to high operational standards. The AGM uses prescribed policies and procedures to make management decisions. Bar Steward – Admirals Club Lounge The Admirals Club Bar Steward is responsible for taking orders, mixing and serving alcoholic and non-alcoholic drinks to guests at the bar and dining areas, coordinating and maintaining an orderly appearance of all lounge spaces, as applicable. Provides support and assistance for all lounge services (i.e. serving refreshments, arranging furniture, arranging snack, breakfast, lunch and dinner service and other lounge related services). Cook-American Airlines Lounges The Lounge Cook I is responsible for preparing, cooking and plating hot and cold food items, following all food safety and standards, monitoring food quality, and cleaning kitchen and work equipment. Floor Attendant- Admirals Club The Admirals Club Floor Attendant is responsible for cleaning and maintaining the dining and/or buffet area within the lounge and serving guests food AA Admirals Club (Bar Captain) The Flagship Bar Captain is responsible for taking orders, mixing and serving alcoholic and non-alcoholic drinks to guests at the bar and in the dining areas, coordinating and maintaining an orderly appearance of all lounge spaces, as applicable. Provides support and assistance for lounge all services (i.e. serving refreshments, arranging furniture, arranging snack, breakfast, lunch and dinner service and other lounge related services, as applicable). LA Chula (Sous Chef) The Sous Chef assists with overseeing a kitchen with difficult to complex operations and managing the kitchen’s food and production processes. This position participates in the preparation, seasoning and cooking of food, supervises kitchen staff, and performs all other responsibilities as directed by the business or assigned Management of which associate is capable of performing. This is an exempt position and typically reports to the Restaurant Chef, depending on local requirements. Crew Member (HMS Host) The Crew Member is responsible for performing a variety of duties within a fast food establishment which may include cleaning the food or stock areas, operating fryers & microwaves, manning food preparation production line, assisting in the kitchen area, and maintaining inventory; performs all other responsibilities as directed by the business or as assigned by management. This is a non-exempt position. Food & Beverage Manager – American Airline The purpose of the Manager F&B Lounge Ops is to support the Director, Lounge Operations and/or General Manager F&B Lounge Ops in the management of all the daily functions of assigned lounge(s), directing resources, driving continuous operations improvement, achieving high customer service satisfaction, and achieving the financial goals of the airline and HMSHost. This is a management position and reports to the Director, F&B Lounge Operations or Sr Dir/Director of Operations, depending on local requirements with a dotted line to the Senior Director, National Lounge Operations. American Airlines – Floor Captain The Floor Captain is responsible for assisting management in monitoring the day-to-day activities of associate productivity, assigning responsibility, providing work directions and monitoring the schedule for adequate shift coverage. Responsible for maintaining lounge spaces and complying with established service standards of customer service, staffing, appearance, cleanliness, and food and beverage. Click logo to view Job Opportunities at SSP Suppliers Click Logo to view Job Opportunities at Marshall Retail Group Costumer Service Ass"
