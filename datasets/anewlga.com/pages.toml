["https://www.anewlga.com/faq"]
title = "FAQ - LaGuardia Redevelopment"
description = "A Whole New Airport for New York"
full_description = "FAQs (Frequently Asked Questions) When was LaGuardia Airport built? Opened in 1939, LaGuardia Airport was built on the site of the old Gala Amusement Park. Once called the Overseas Terminal, and then the Marine Air Terminal, Terminal A was the original airport terminal building, serving international flights throughout the 1940s. Terminal B, also known as the Central Terminal Building, opened in 1964 followed by Terminals D and C in 1983 and 1992, respectively. How do I apply for a job at the airport? The Council for Airport Opportunity www.caonynj.com has placed thousands of qualified candidates in positions within the Aviation industry. CAO offers free employment services and works with job seekers to refine their resumes, prepare for job interviews and identify appropriate job opportunities. Visit their website at www.caonynj.com for more information. How do I seek assistance in case of emergency? LaGuardia Airport is committed to ensuring the safety of all of its employees and customers. Please call the Port Authority Police Department (PAPD) – 718-533-3911 – to report any emergency or suspicious activity. How do I report an item I lost at LGA? Call LGA’s Lost & Found – 718-533-3988 Other useful numbers: LGA Operations – 718-533-3700 PAPD Police Tips Line – 800-828-7273 For additional travel information please visit www.laguardiaairport.com"
