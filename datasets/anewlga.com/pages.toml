["https://www.anewlga.com"]
title = "Home - LaGuardia Redevelopment"
description = "A Whole New Airport for New York"
full_description = "Terminal C Photos and Video Redevelopment Milestones Forbes Travel Guide 2024 Best U.S. Airport Forbes Travel Guide’s first Verified Air Travel Awards survey, based on 5,000 hospitality and travel experts and well-traveled fliers, names LaGuardia Airport the 2024 Best U.S. Airport. The Verified Air Travel Awards are based on real-world experience and real-world accountability, recognizing that a customer’s journey is just as important as their destination. This accolade underscores the LaGuardia’s $8 billion transformation from what was once the nation’s worst airport into what is now its best Passenger Rated as Best Airport in its Class Our passengers have spoken and recognized the successful efforts of our redevelopment program in elevating customer experience at LaGuardia Airport. The Airports Council International (ACI) announced that LaGuardia has earned the 2023 Airport Service Quality (ASQ) Award for Best Airport of 25 to 40 Million Passengers in North America. ACI World’s annual ASQ Awards recognizes airport excellence in customer experience worldwide based on data collected from passengers from ASQ’s renowned Departures and Arrivals Surveys. The awards are delivered in partnership with Amadeus, one of the world’s top travel technology companies. Skytrax Winner In 2023, LaGuardia’s Terminal B was named the world’s best new terminal based on feedback from customers around the world surveyed on factors including check-in, shopping, security, terminal comfort and ambiance, and choice of bars and restaurants – making its airline terminal the first in America to achieve the highest global 5-Star Airport Terminal Rating from Skytrax. UNESCO Prix Versailles Winner In 2021, LaGuardia’s Terminal B won UNESCO’s Prix Versailles, the global architecture and design award, for best new airport in the world. This prestigious award underscores the agency’s promise to transform what was once regarded as the nation’s worst airport into a world-class facility ranking among the best in the nation. A World-class Transformation The $8 billion investment to transform LaGuardia Airport is paying off in every way with an elevated customer experience and nation-wide recognition. When we said A Whole New LaGuardia, we meant it. And when we said it will be worth it, our passengers and the nation are affirming it. The opening of the award-winning Terminal B was the first milestone on our journey from worst to best. Terminal B’s dual skybridges overlooking an active aircraft taxiway, makes LaGuardia the first airport in the world to have such an amenity. Add to that the terminal’s brand-new second concourse, and passengers are offered a one-of-kind experience from gate to curb. Delta’s brand-new Terminal C opened to passengers in June of 2022 – expansive and nearly double the size of the two terminals that it replaced. By consolidating 37 gates into one spacious facility with a single Arrivals and Departures Hall with soaring floor-to-ceiling windows, 21st century technology and locally inspired concessions, the terminal offers passengers high quality dining options in a world-class atmosphere. As travelers are enjoying the whole new LaGuardia, The Port Authority of NY & NJ turns its attention to setting a new standard for air travel at Newark Liberty International Airport and complete transformation of John F. Kennedy International Airport. Learn more at EWRRedevelopment.com and ANewJFK.com. Explore See All Redevelopment Milestones Interactive Maps News + Media In The Community See All In the Neighborhood Job Opportunities Contracting Opportunities Events View Calendar Business Opportunities Contracting Opportunities The Port Authority of New York & New Jersey is invested in developing minority, women-owned and small business enterprises. Our partners, LaGuardia Gateway Partners, the operator of Terminal B and Delta Air Lines, the operator of Terminals C & D, are seeking certified Minority and Women-owned Business Enterprise (MWBE) contractors, vendors and consultants for the construction associated with the redevelopment project and operations and maintenance of the terminals. Learn More Job Opportunities We work with the Council for Airport Opportunity (CAO) whose mission is to identify and address the critical employment needs of the communities surrounding the New York and New Jersey Metropolitan airports, while at the same time responding to the hiring needs of the airport tenants and the aviation industry. Learn More"
