. Opportunities exist in design and construction, professional services, operations and maintenance and in airport concessions (ACDBEs). To learn about current and upcoming opportunities at Terminal B, visit: www.laguardiaB.com/supplier-diversity Terminal C Contracting Opportunities Delta Air Lines is building a new, state-of-the-art home at LaGuardia Airport. Building on the $2 billion Delta has invested in New York over the past seven years, the airline will develop, construct, operate and maintain a new terminal to replace Terminals C and D. For contracting opportunities, contact: Cassandra Hill General Manager, MWBE Program | Outreach Regional Alliance for Small Contractors LGA Airfield Reconfiguration Program Office: (929) 270-4551 Mobile: (917) 880-1822 Email: [email protected] Terrence Benthall Manager, M/WBE Program | Contract Compliance Regional Alliance for Small Contractors LGA Airfield Reconfiguration Program Office: (929) 270-4552 Mobile: (917) 841-9224 Email: [email protected]"
