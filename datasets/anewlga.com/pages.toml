["https://www.anewlga.com/about-the-project/the-new-laguardia-airport"]
title = "The New LaGuardia Airport - LaGuardia Redevelopment"
description = "A Whole New Airport for New York"
full_description = "A New Airport for New York The Port Authority of New York and New Jersey is paving the way for a new era for LaGuardia Airport that will transform the nation’s premier domestic airport into a world-class transportation hub. The Port Authority operates LaGuardia Airport and is leading the modernization and redevelopment of the airport to meet the needs of the 21st century. The comprehensive redevelopment of LaGuardia Airport involves transforming LaGuardia into a unified airport with new terminals, better transportation access, additional taxi-lanes and best-in-class passenger amenities. Construction of the new unified airport includes new terminals for the existing terminals B, C and D, an improved roadway system, new parking infrastructure and other associated projects. LaGuardia Gateway Partners – a consortium company of airport experts – will design, build, manage and maintain LaGuardia’s terminal B under a 35-year lease agreement with the Port Authority of New York and New Jersey. Delta Air Lines will develop, construct, operate and maintain the new terminal to replace terminals C and D in a new lease agreement with the Port Authority of New York and New Jersey through 2050. Terminal B The Port Authority of NY & NJ selected LaGuardia Gateway Partners to modernize and redevelop Terminal B, including updating it with environmentally friendly parking options. LGP broke ground on construction of the new $4.2 billion Terminal B in June 2016. Read More Terminal C Delta Air Lines will develop, construct, operate and maintain a new terminal to replace Terminals C and D. Delta Air Lines broke ground on construction of the new $4 billion terminal in August 2017. Read More About the Project The comprehensive redevelopment of LaGuardia Airport involves transforming LaGuardia into a unified airport with new terminals, better transportation access, additional taxi-lanes and best-in-class passenger amenities. Read More"
