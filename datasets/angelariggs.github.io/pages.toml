full_description = "Navigating Stormy Seas Anyone can hold the helm when the sea is calm. – Publius Syrus Read More Imposter Syndrome I often write about things I’ve learned, but this blog post is about how I’ve felt. Specifically, it’s about how I was feeling last fall as I was ramping up at my new job. Read More Job Search Template I’ll start this post by saying that if you’re one of the thousands of employees impacted by tech industry layoffs over the last year - I’m so sorry. I know how much it sucks. I was laid off last May, and I know how hard it is. If you’re still processing, I wrote about that too; I hope it can be something that helps you. Read More Onboarding Practices: The First Month As I’m wrapping up the fourth week at my new job, I figured this was a good time to reflect on how I approach onboarding to a new role, team, and company! Read More Episode 10: Visualizing Metrics, a Messy Business Previously on Tales From a Journey Around Metrics Read More An Analogy for Product-Engineering Metrics Mojtaba brings us another great guest post about using real estate investment as an analogy for thinking about product engineering metrics! Read More Measuring Outcomes and Activities When deciding to come up with metrics to measure, it is helpful to distinguish between activities and outcomes and their associated metrics. One leads into another and one is best assessed in the context of another. Read More Hierarchy of Metrics In a previous post, Mojtaba introduced us to the 5 categories of engineering metrics. These are appropriate for engineering teams. When combined with product and design, and looking at the organization and business as a whole, it’s important to distinguish between various levels of metrics. Read More Episode #9: Workload Metrics Baby Steps The One Where Crude Team Workload Metrics Led to Fruitful Conversations Read More Episode #8: Measuring Workload To Articulate Pain-Points The One Where Team Workload Helped an Under-Served Team Advocate for Itself Read More Team Workload Metrics: What are they good for? Out of the 5 category of engineering metrics, the most used are often Service Level metrics, Team Performance metrics, and Customer metrics. The least used are often Team Workload and Team Happiness/Engagement metrics. Read More Episode #7: Indirectly Measuring Impact of Technical Debt The One Where We Used Metrics to Increase Autonomy of Development Teams Read More Talking About Layoffs We don’t really talk about layoffs. When you hear someone say they got laid off, it’s likely the next thing you hear from them is about the new job they’re starting. But we don’t talk about what it’s like in between those two events - which means we’re not acknowledging how traumatic it is to be laid off. Read More Service Level Metrics Last week, Mojtaba taught us about the 5 categories of engineering metrics. In this post, he dives deeper into one of these categories: Service Level Metrics. Read More Transparency in Communication As an IC and as a manager, I’ve always advocated for proactive, transparent communication from leadership. I recently heard someone say “companies always think they’re being transparent”, and it made me stop to think about what that really meant and how it affected the way that I’ve typically thought about transparency. Read More Job Search! I’m currently in search of a new role - please read through and get in touch if you think I would be a good fit for your organization! Read More Episode #6: Paying Back Technical Debt With Help From Metrics Previously on Tales From a Journey Around Metrics Read More The 5 Categories of Engineering Metrics As Mojtaba Hosseini helps guide Zapier toward being a more data- and metrics-driven engineering organization, and as teams continue to add and use metrics, he finds that they sometimes come across this question: What other metrics should I be looking out for and using? Read More Episode #5: Bad Metrics The One Where We Discover That Bad Metrics Can Lead to Good Questions Read More Episode #4: Nothing In Nothing Out The One Where We Realize There is a Step 0 Before the First Step Read More Episode #3: A Vicious Cycle Previously on Tales From a Metrics Journey… Read More Episode #2: The First Taste of Metrics The One Where Executives React to Their First Metrics Dashboard Read More Episode #1: Going On an Adventure! The First Step Earlier this year I had a fantastic guest post from Mojtaba Hosseini, a Director of Engineering at Zapier, talking about the 12 pitfalls of engineering metrics. As Mojtaba is guiding his current company through their journey of becoming a more metric-driven engineering organization, he’s reflecting back on his previous experiences around metrics in the hope that those lessons learned can help inform the journey at Zapier (and hopefully help you, too 😄)! So grab your favorite snack and settle in for the first flashback episode in Mojtaba’s metrics series 🍿 Read More Manager README 👋🏼 Hello! Read More Iterating My Interview Process Over the last year, I’ve been iterating my interview process as a QE manager at The Zebra. This has been my first time hiring consistently as a manager, so it’s the first time I’m really reflecting on my practices as a hiring manager and evaluating my process. I’ve written about a few things in their own blog posts where I offer more detail, but I also wanted to share a summary of the various changes I’ve made, as well as the intended mpact behind those changes. Read More Learning Manager Skills Through the Lessons of Skincare I woke up this morning with an odd train of thought running through my brain - skincare as a metaphor for being a new manager. It was too interesting to put off for later so I did a tweet thread while I was getting ready (yes, in between skincare steps!), but I wanted to expand some thoughts and write it up in a more shareable format. Read More Reading Roundup No. 5 🌈 Welcome to Reading Roundup 5! Read More Staying Organized as a Manager Staying organized as an IC was pretty easy - for the most part, the things I needed to track and accomplish were on my team’s Jira board. As a manager, it’s a little more complicated. My work is sometimes more abstract, there’s more of it and more kinds of it, and I don’t have a built-in place to track it. Here are some of the tools and methods I use to stay organized and accountable for the work I do! Read More More Inclusive, Less Stress: Updating Panel Interviews Interviewing can be super stressful, even under the best of circumstances or the best intentions. I really want my hiring practices to be as collaborative as possible, and trying to reduce the stress of interviewing is part of that. A few weeks ago I wrote about updating our technical assessment with the promise of an upcoming Part 2 about the changes I made to panel interviews - Reader, this is that Part 2 I know you’ve been waiting for! Read More Engineering Metrics: 12 Pitfalls [Today’s article is a guest post from Mojtaba Hosseini, a Director of Engineering at Zapier!] The reasons and motivations for having metrics in engineering are well-known and well-documented, but it may suffice to refer to this quote: “What gets measured, gets managed.” However - the full quote is “What gets measured gets managed — even when it’s pointless to measure and manage it, and even if it harms the purpose of the organisation to do so”, something this post will also touch on later. The purpose of this is to share some lessons learned and pitfalls along the “metric journey” for an engineering organization. Read More 2021: Year in Review As I was thinking back over this year, I really debated with myself whether to write this. I don’t have a pithy saying to wrap up what this year has been like. There’s no overarching theme or lessons learned that I’m grateful for. It has mostly been a very, very tough year for me. I ended last year’s review post wishing everyone a 2021 filled with warmth and light and optimism and love, and I don’t really feel like that happened for me. I’m generally an optimist, but it was really hard to find that part of myself this year. Read More Updating Our Technical Assessment Hiring is a constant part of any manager’s job, but I think it can be one of the hardest parts to do well. Thinking about hiring practices usually isn’t a priority until you’re actively hiring. And by the time you’re actively hiring, you’re more likely to use the system in place rather than think about whether that system could be improved. Read More Reading Roundup No. 4 ✍🏼 Welcome to the fourth installation of my Reading Roundup series! I’ve got a couple of blog posts simmering on curiosity and hiring process, but in the meantime here are some of the articles and events that have caught my eye recently! Read More A Guide to Writing Better Goals I’ve had some form of regular goal-setting at most of my jobs, and it’s always been a pretty lackluster process. The purpose of setting a goal was unclear, I wasn’t sure what a “good goal” was or how to figure that out, and sometimes I was required to make it relevant to the company’s goals which didn’t always connect to what I wanted. Read More Speaking up: How to Have Hard Conversations Technology is inherently a people-oriented industry, and doing our jobs well requires constant communication. We communicate all the time in big and little ways, and these collaborative conversations help us to be more successful in our work. Read More Reading Roundup No. 3 Welcome to another reading roundup! I have to say, I’m really enjoying these. It’s great to get a writing “win” in spite of having some writer’s block / never-ending pandemic fatigue on my longer articles, and I like getting to share and support other people’s work! Wins all around 🥰 Read More Reading Roundup No. 2 🌈 Welcome to the second reading roundup! Read More Reading Roundup No. 1 While avoiding my other in-progress blog post, I decided that it would be fun to do a “reading roundup” of various articles, panels, conference talks etc that I think are interesting or useful (it’ll also be good for keeping me accountable to my ever-growing reading list)! These roundups will mostly be tech-related, but I reserve the right to throw in some curveballs every now and then 😄 Read More Empathy is a Technical Skill If you look up the word technical, you’ll see it defined as “relating to a particular subject, art, or craft, or its techniques.” Nothing about that description indicates that understanding programming is a technical skill and understanding people is not - yet somehow the idea of technical skills has come to mean just that, with the inverse being soft skills. This distinction between so-called technical skills and soft skills sets up an unbalanced system where people with technical skills are assumed to be valued in a way that non-technical people aren’t, and does a real disservice to the importance of soft skills. Read More 2020: Year in Review As my old Grandpappy used to say, experience is what you get when you didn’t get what you wanted. And whew, 2020 has certainly been a year of experience, hasn’t it? There have been good moments, but I can’t quite bring myself to say that it’s been a good year. Read More Reflecting on Mentorship Someone asked me today who my mentors have been, and it was an unexpected opportunity to reflect on who’s helped shape my career. Thinking back, I knew immediately that it wasn’t mentorship in a specific technology or career path that made a difference, but more generally in a way of working. Read More The Future of Quality at Instrument was 35 Days Long The Call On September 3rd, I got a DM from the VP of Engineering asking me to hop on a quick call with him and the VP of People Operations (Instrument’s version of HR). Read More Looking for Work! I’m currently in search of a new role - please read through and get in touch if you think I would be a good fit for your organization! Read More The Future of Quality At Instrument For the past six months, I’ve been leading a new initiative at Instrument: creating an internal Quality Engineering discipline within our larger Technology discipline. Read More Resources for Self-Education and Allyship I’m seeing a lot of non-Black folks seeking ways to support their Black friends and coworkers, to advocate against racism and police brutality and the systems of oppression that are becoming harder for people with inherent privilege to ignore. Read More New Managers: Effective Management Welcome to the fifth and final post in my New Managers series! I’ve talked about creating a supportive culture, tips for self-care, and what your responsibilities might look like as a new manager. For this last post, I want to talk about how to manage people effectively so that you and they can succeed! Read More It's Okay Not to be Okay That’s it. That’s the post. (Well, almost.) Read More New Managers: Being a Manager Congratulations, you’re a manager 🎉 First step off the IC path, first rung of the leadership ladder - exciting career changes! Read More New Managers: Support & Self-Care Hello there 👋🏼 This is the third article in my “Advice for New Managers” series! If this is your first stop, you may want to check out the original post that I wrote after getting a ton of awesome feedback on Twitter, and you can read the second article on creating culture as a new manager here. Read More New Managers: Creating Culture Last week, I wrote about the new manager advice I received on Twitter. A lot of the responses fell into a handful of themes, one of which was Culture. By culture, I mean the culture that I cultivate for my people as their manager. What sort of environment do I want to offer them? What kind of culture am I building? What are my values, and how do I communicate them? Read More Advice for New Managers I’ve recently started in my first role as a manager! I recognize that this isn’t just a promotion from being an individual contributor (IC) - it’s a separate career path, and it requires a different way of working. As a new manager, I want to learn from the experiences and expertise of other managers! So last week, I asked a question on Twitter: Tech managers, what is something you wish you’d done differently in your early manager roles? Read More 2020 Conferences I’m super excited for my 🌟 2020 conference lineup 🌟 I’ll be giving my Beginner’s Guide to Test Automation talk at three different conferences, and they’re all new conferences for me! It’ll be a different experience giving the same talk at each conference - unlike 2019, when I gave 3 different talks at 4 different conferences, with 2 of them being brand new talks 😅 Read More Self-Reflection and Lessons on Useful Advocacy Through a series of conversations and interactions dealing with white supremacy and advocacy on Twitter, I’ve learned some lessons on what it means to begin being a useful advocate. I wrote a short thread on some of those lessons, but I wanted to write them down in a more"
