["https://angelariggs.github.io/articles/black-lives-matter"]
title = "Angela Riggs | Engineering & People Leader"
description = "I’m seeing a lot of non-Black folks seeking ways to support their Black friends and coworkers, to advocate against racism and police brutality and the systems of oppression that are becoming harder for people with inherent privilege to ignore."
full_description = '''Resources for Self-Education and Allyship [ twitter advocacy ] I’m seeing a lot of non-Black folks seeking ways to support their Black friends and coworkers, to advocate against racism and police brutality and the systems of oppression that are becoming harder for people with inherent privilege to ignore. I’m also seeing a lot of great resources out there for self-education and allyship, so I thought I’d compile some of them into one place. This is intended to be a living article, so I’ll update it as I continue to learn and engage. If you have resources for any category that you would like me to include, please drop by Twitter to DM me or send me a tweet at @AngelaRiggs_. If it’s a resource that someone else created, please make sure to include the appropriate way to credit them! Effective advocacy & support 3 Steps for Leaders to Take in Emergencies: Lara Hogan’s article on things you should prioritize as a leader in order to support your team https://larahogan.me/blog/3-steps-for-leaders-in-emergencies/ Tatiana Mac’s Twitter thread full of tips about how to usefully engage on social media when you’re pushing back against orgs or people who are being racist https://twitter.com/TatianaTMac/status/1267252980882997249 Maki’s Twitter thread for non-Black folks on how to check in on your Black friends without adding to their fatigue or stress https://twitter.com/makirollOFC/status/1267114319772372993 Black Tech Pipeline’s article sourced from Black people on how they want to be supported by their employers https://blacktechpipeline.substack.com/p/hey-employers-do-black-lives-matter Educate yourself Curated book list from Baratunde Thurston on a variety of themes related to race and history https://bookshop.org/shop/baratunde A variety of anti-racism resources, compiled by Sarah Sophie Flicker and Alyssa Klein http://bit.ly/ANTIRACISMRESOURCES Why “Black” is capitalized when we’re talking about race https://www.mic.com/p/yes-black-is-capitalized-when-were-talking-about-race-19208252 The History of Black Wall Street https://www.oneunited.com/the-history-of-black-wall-street/ History of the Tulsa Massacre https://www.washingtonpost.com/news/local/wp/2018/09/28/feature/they-was-killing-black-people/ Context around the change from referring to the Tulsa Massacre as a riot https://www.tulsaworld.com/news/local/racemassacre/tulsa-race-massacre-for-years-it-was-called-a-riot-not-anymore-heres-how-it/article_47d28f77-2a7e-5b79-bf5f-bdfc4d6f976f.html Black Trauma and Showing Up https://www.refinery29.com/en-us/2020/05/9841376/black-trauma-george-floyd-dear-white-people Rihanna’s NAACP Image Awards speech on the importance of Black issues being everyone’s issues https://www.refinery29.com/en-us/2020/05/9841376/black-trauma-george-floyd-dear-white-people Stats That Matter, an animated episode series from Titus Animates https://www.instagram.com/p/CA51NLcBIU5/ Mapping Police Violence https://mappingpoliceviolence.org/ Donate Note: As Kimberly Bryant pointed out, donating isn’t just about the immediate needs of bail funds - it’s about funding grassroots organizations that are working for systemic and community changes. Code 2040 http://www.code2040.org/ Hack the Hood https://www.hackthehood.org/ Project Include https://projectinclude.org/ INTech http://www.code2040.org/ Black Girls Code https://www.blackgirlscode.com/ Rachel Cargle’s Loveland Foundation https://thelovelandfoundation.org/ways-to-give/ Black Visions Collective (BLVC) https://blackvisionsmn.org Reclaim the Block https://reclaimtheblock.org/home Campaign Zero https://www.joincampaignzero.org/ Police Use of Force Project http://useofforceproject.org/ The Bail Project https://bailproject.org/ Autostraddle’s list of bail funds: http://autostraddle.com/43-bail-funds-you-can-absolutely-support-right-now/ Act Blue bail fund that allows you to easily split your donation across multiple funds: https://secure.actblue.com/donate/bail_funds_george_floyd George Floyd Memorial Fund https://gofundme.com/f/georgefloyd I Run With Maud https://gofundme.com/f/i-run-with-maud Action 5 Calls: Demand reform on police use of force https://5calls.org/issue/police-use-of-force-reform Consistently support Black-owned businesses! Here’s a great roundup for Portland from Stephen Green and Built Oregon https://siliconflorist.com/2020/03/03/missing-the-daily-black-history-month-tweets-about-portland-founders-me-too-relive-them/ Written on June 1, 2020 var disqus_shortname = 'angelariggs'; (function() { var dsq = document.createElement('script');dsq.type = 'text/javascript';dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); Please enable JavaScript to view the <a href="http://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
