title = "Angela Riggs | Engineering & People Leader"
description = "I’m super excited for my 🌟 2020 conference lineup 🌟 I’ll be giving my Beginner’s Guide to Test Automation talk at three different conferences, and they’re all new conferences for me! It’ll be a different experience giving the same talk at each conference - unlike 2019, when I gave 3 different talks at 4 different conferences, with 2 of them being brand new talks 😅"
full_description = '''2020 Conferences [ conferences ] I’m super excited for my 🌟 2020 conference lineup 🌟 I’ll be giving my Beginner’s Guide to Test Automation talk at three different conferences, and they’re all new conferences for me! It’ll be a different experience giving the same talk at each conference - unlike 2019, when I gave 3 different talks at 4 different conferences, with 2 of them being brand new talks 😅 It won’t be exactly the same presentation at each conference - some time slots are longer so I can add more content, and some conferences have a specific theme that I’ll be adjusting the talk to match. It’ll be good experience for me to give the same talk a few times - one of my goals for public speaking is to be more comfortable and less nervous, and having the same topic for several conferences will let me focus on improving my delivery and connecting more with my audience. So if you’re interested in getting started with test automation, this talk is for you! If you need help convincing people that test automation is a worthwhile investment, this talk is for you! If you aren’t sure how to choose the right automation framework, this talk is for you! If you don’t know which tests you should start automating, this talk is for you! You can come see my talk at these conferences in 2020: TSQA Feb 27 | Durham, NC | Conference info STPCon March 30 - April 2 | San Diego, CA | Conference info Agile Testing Days USA June 21 - 25 | Chicago, IL | Conference info Written on December 28, 2019 var disqus_shortname = 'angelariggs'; (function() { var dsq = document.createElement('script');dsq.type = 'text/javascript';dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); Please enable JavaScript to view the <a href="http://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
