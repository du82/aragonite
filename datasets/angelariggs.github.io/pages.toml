["https://angelariggs.github.io/articles/five-categories-engineering-metrics"]
title = "Angela Riggs | Engineering & People Leader"
description = "As Mojtaba Hosseini helps guide Zapier toward being a more data- and metrics-driven engineering organization, and as teams continue to add and use metrics, he finds that they sometimes come across this question: What other metrics should I be looking out for and using?"
full_description = '''The 5 Categories of Engineering Metrics [ guest-post metrics series-metrics-categories ] As Mojtaba Hosseini helps guide Zapier toward being a more data- and metrics-driven engineering organization, and as teams continue to add and use metrics, he finds that they sometimes come across this question: What other metrics should I be looking out for and using? Let’s join Mojtaba in another guest series as he explores the 5 categories of engineering metrics that can help teams diversify and balance their metrics! But first, an analogy… An Analogy Think of a car’s main dashboard: There are many indicators and dials, each helping the driver in different ways: Speed and performance: how fast is the car going? How hard is the engine working? Maintenance: engine health, oil and battery health, gasoline level, engine temperature. Status: doors, trunk, hood open/close, lights on/off, indicators on/off, hand-brake on/off. The more complex the car, the more dials and dashboards within these categories. If a driver only has access to one category, they can damage the car (or worse). The 5 Categories of Engineering Metrics There are arguably 5 categories of metrics that engineering teams can use. 1. Customer Metrics These metrics are focused on gauging how the team’s customers are doing. Metrics in this category include: Customer Net Promoter Scores (NPS) Product HEART metrics: Happiness, Engagement, Adoption, Retention, Task Success Service Level Indicators (SLI) around how quickly we respond to customer queries These are often considered some of the most important metrics for a team since they are concerned with the team’s customers. However, these metrics can be lagging indicators and may not give a team enough insight into why customers are happy (or not). 2. Team Workload Metrics Some teams find it useful to measure the workload of the team and gain insight into the various categories of workload. For example: % of feature work vs non-feature work Support load on the team and its impact on capacity Bug-fixing load on the team and its impact on capacity % Tactical vs Strategic work These metrics can help teams understand and articulate their pain-points, and can even sometimes be tied to customer metrics. They can also sometimes reveal issues and bottlenecks outside of the team that impact the workload placed on the team. 3. Team Performance Metrics If Team Workload metrics measure the input of work into a team, Team Performance metrics aim to see how well the team is dealing with their workload. For example: Cycle Time and Throughput and Work-In-Progress (WIP) size: how a team works through its workload 4 DORA metrics: how quickly and often a team deploys to production and the quality of those deployments Team Velocity: the average velocity of completing stories These metrics are typically the ones most in danger of being incorrectly used by management - and at worst weaponized. When used properly, they are great companion metrics to Team Workload and Customer Metrics. 4. Service Level Metrics Software teams can also measure the health of the services they own. For example: Resource usage (CPU/Memory): how much the service uses resources, typically viewed over time (Cloud) cost: the cost of resources (typically broken down further) and typically viewed over time Service uptime: the % of time a service is up Service error rates: how often a service errors out or times out See this article from Amazon on the various levels of service metrics and creating dashboards for operational visibility. Note that for some teams, these service metrics have direct or indirect relationship to customer metrics - and may even be customer metrics when customers are the direct user of a service. 5. Team Happiness/Engagement Another category of metrics revolves around the team’s engagement and happiness. Some examples include: Employee engagement surveys High Functioning team surveys Ambiguity of workload and strategy surveys These metrics aim to balance some of the performance, workload, and customer metrics with team engagement. For example, engaged teams often are high-performing teams. How to Use the 5 Categories Tune in to the next post to get ideas on how you use these five categories of metrics to balance each other! [ Guest post from Mojtaba Hosseini ] Written on May 10, 2022 var disqus_shortname = 'angelariggs'; (function() { var dsq = document.createElement('script');dsq.type = 'text/javascript';dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); Please enable JavaScript to view the <a href="http://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
