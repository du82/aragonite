["https://angelariggs.github.io/articles/a-knot-of-toads"]
title = "Angela Riggs | Engineering & People Leader"
description = "I just finished my first week as a toad!"
full_description = '''A Knot of Toads [ learning ] I just finished my first week as a toad! I started my internship at Metal Toad on Monday. I had been expecting an October start, but Randi - their wonderfully exuberant Director of People - asked if I could start earlier. So a few weeks earlier than expected, I hopped (get it?) on the Yeon Building elevator and pressed the orange toad button for the 4th floor! I started by diving into the documentation - getting to know all of the bits and pieces of setting up at workstation at Metal Toad. After spending a few hours doing the process longhand, Cesar let me in on a script that one of the other devs wrote, that installs pretty much everything I’ll ever need. As an intern, my workload will likely be split about 50/50, between QA for various client projects, and working on an internal project. I started QA for a client project on my first, so I got to experience setting up my local environment for a Drupal project. My dev lead, Slavko, walked me through the process and explained everything. (Thinking of future Angela, I took notes on it all and typed it up on Google Drive.) After I got the project set up, Jordan got me started with testing. I spent some solo time working with Behat, getting practice writing tests. After a couple of hours of Googling and Stack Overflowing, I did some troubleshooting with Jordan and we realized that my tests should have been passing. We think it was something with the version of Behat that I was using. So I started looking into unit testing for JavaScript, since my interest is in front-end, and I’ll start putting it into practice on another project next week. I also resolved a JIRA ticket, and made my first Git commit on a project! I had some downtime from the first project, so Cesar directed me toward another project that had some front-end work to do. Kyle found me a JIRA ticket that needed front-end work. I used my notes from the project setup with Slavko earlier (thanks, past Angela!) and set up the environment for the new project. I dove into the Sass files to fix some padding issues across a few of the site pages, and then - and this is the real moment of triumph - I committed my changes to the repo without breaking anyone else’s code! My first week has been such a fantastic experience! I realized that the people who work at Metal Toad are more than just colleagues - they’re a family. They work together, but they also respect each other and want to help everyone succeed. Everyone has work of their own, but they all made time to stop and answer my questions, or to direct me toward the person who could. They have a Slack channel dedicated to shoutouts, and they use it every day. I got a round of applause from the team at my first code review. Day by day, everyone has made a point to introduce themselves to me individually and ask how I’m doing in my first week. I’m so excited to a part of the Metal Toad family, and I can’t wait to see how the next four months begin to unfold! Written on September 27, 2015 var disqus_shortname = 'angelariggs'; (function() { var dsq = document.createElement('script');dsq.type = 'text/javascript';dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); Please enable JavaScript to view the <a href="http://disqus.com/?ref_noscript">comments powered by Disqus.</a>'''
