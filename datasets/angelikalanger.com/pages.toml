["https://angelikalanger.com"]
title = "AngelikaLanger.com - Angelika Langer's Home Page - Angelika Langer Training/Consulting"
full_description = 'I am the author of the Java Generics FAQ , an online resource covering new language features in Java 5.0, and I am currently working on the Lambda/Streams Tutorial & Reference . I am co-author with Klaus Kreft of several books, among them " C++ Standard IOStreams and Locales " (Addison Wesley, 2000). We are authors of countless magazine articles, including a series of articles initially entitled " Effective Java " for the German JavaMagazin. I enjoy speaking at conferences all over the world. I am an observing member of the ISO/ANSI C++ standards committee and the Java Community Process JCP. Available on this website is the information listed below. SCHEDULE COURSES Information about the Java and C++ seminars I offer, including abstracts, open enrollment schedule and a registration form. TALKS Information about presentations and workshops that I will be giving at conferences, users group meetings and other events. ARTICLES Articles and papers on Java and C++ written by Klaus Kreft and Angelika Langer. GENERICS Information related to Java Generics, a language feature added to Java in release 5.0. LAMBDAS Information related to lambda expressions in Java, a language feature added to Java in release 8.0. IOSTREAMS Information related to our book "Standard C++ IOStreams and Locales" such as errata list, reviews, etc. ABOUT Contact information, imprint and curriculum vitae.'
