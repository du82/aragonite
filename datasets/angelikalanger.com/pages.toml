["http://www.angelikalanger.com/Courses.html"]
title = "AngelikaLanger.com - Course Curriculum - Angelika Langer Training/Consulting"
full_description = "All courses are availabe as ON-SITE training, some of them are additionally offered as OPEN ENROLLMENT courses. Further information on either type of course can be found below. Feel free to send requests for open enrollment, on-site seminars, or further information per EMAIL or use the REGISTRATION form. Available Seminars Download the Course Descriptions OVERVIEW Check out Open Enrollment SCHEDULE 4 days Discusses traps and pitfalls in Java as well as advanced Java features such as lambdas, generics, and reflection. 4 days The most up-to-date seminar on concurrent programming in Java; includes in-depth coverage of memory model. 4 days Programming for performance: covers programming, monitoring, profiling, and tuning techniques. 4 days Overview of new language features since Java 8 covering lambdas, streams, date/time, module system, switch expressions, records, sealed types. 3 days Programming with lambdas und streams in Java 8. Explains all new language features and provides an in-depth coverage of the stream API. 1 day Overview of the Java Platform Module System (JPMS) added in Java 9. 1 day In-depth coverage of the Java Memory Model (JMM), i.e. memory effects related to volatile, final, and atomic variables. 1 day Profiling and tuning of memory related performance issues such as memory allocation, memory leaks, and garbage collection. 5 days An introduction to Java for programmers with experience in an object-oriented language. 3,5 days Discusses traps and pitfalls in C++, including memory leaks, const-correctness, sequence point problems, and many more. 3 days In-depth coverage of the STL, from introduction over traps & pitfalls to advanced topics such as functors and allocators. 3 days Covers state-of-the-art template programming techniques, from generic programming to template meta programming. 3 days Comprehensive coverage of IOStreams and internationalization in C++, based on our IOStreams book (see BOOK ). 5 days An introduction to C++ for programmers with experience in C or an object-oriented language."
