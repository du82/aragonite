title = "AngelikaLanger.com - About Angelika Langer - Angelika Langer Training/Consulting"
full_description = "Currently my preferred fields of interest are training, coaching, and mentoring in the area of software development in C++ and Java. I am most interested in development of explanatory material, including course material, multimedia training, books, and articles and I enjoy passing on my expertise in lectures, seminars, and workshops. My area of expertise is advanced C++ and Java programming, the development of these programming languages, concurrent programming, performance analysis and tuning, and many more. For further information go to my CURRICULUM VITAE , or read the INTERVIEW I gave for the HEROES OF JAVA series."
