["https://angelsaremathematical.neocities.org/lolita.html"]
title = "Lolita"
full_description = "There's this new video game Balatro, it's a roguelike deck-builder and turn-based strategy. Here is how you play: you’re dealt a hand of nine normal playing cards, and then you play the best poker hand you can muster from them: flush, straight, three of a kind, etc. The goal is to maximize the profit with the resources you're given. It's just... so, so good... I've been playing it a ton recently. Yesterday I had a dream: I was putting together lolita coords, but each piece of clothing was also a playing card, and besides having to put together a cohesive look, I also needed the items to form a poker hand. The dresses in my dream looked similar to these: I feel like, as a chronically online girl, I always knew about lolita, but never even entertained the thought that you can actually buy and wear these clothes, and they aren't inaccessible or super expensive. I'd say they are not much more expensive than the current mass market junk — at least, not the certain burando pieces. So, I started collecting my own lolita wardrobe not so long ago. I'm in no rush, and it will probably take many years before I end up with a wardrobe of my dreams, and that's fine with me! I'm a slow-fashion enthusiast anyways. I enjoy spending a lot of my time on searching for well-constructed clothes that'll hold up for longer, and I'm fine with paying more for quality and durability. As for the specific flavor of lolita I like — I'd describe my taste in general as liking simple and minimalistic things, but with a cute twist. The lolita pieces I like are usually in solid color, with some subtle details and a beautiful silhouette. The dresses I like the most are usually from early 00s, falling into the oldschool lolita category. This is an Innocent World dress I bought recently, it reminds me of the sailor suits that royal children wore. It hasn't arrived yet and I can't wait! It's going to be my first burando piece. I love the little bows on the collar!"
