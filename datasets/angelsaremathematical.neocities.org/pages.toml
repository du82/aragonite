["https://angelsaremathematical.neocities.org/uni.html"]
title = "Halfway through my math degree"
full_description = "Finished another semester, now i crossed the equator. I'm not enjoying academia at all, it's a source of constant suffering in my life. Summer and winter breaks feel like a breath of fresh air, I'm reliably happy and finally able to do the things I love. And when another semester starts, it's like I hit a rough patch. And it's not like I chose a wrong degree, i actually really enjoy doing math. I had a lot of fun with some of the subjects at university. But the way the educational process is set up is completely alien to me and makes all of my weaknesses stand out. The thing is, I'm really bad at time management. I might do more than your average student and then my grades are worse. I might do the assignment, and then, say, simply forget to submit it... Or slack it too much. Or fail at planning for doing multiple things, put too much effort in one of them and completely abandon the other one. A recent example of this, that furthermore poisoned my already pathetic academical life for at least a year (or, in the worst case, until i graduate): in my university at a certain point every student gets assigned to a department and then chooses a professor from this department to write a term paper under this prof's supervision. I examined the list of all of the available professors well in advance, before the departments were assigned, found the one I really liked and contacted him. He briefly interviewed me and agreed to take me under his supervision. We even chose a topic for my term paper. And then... I forgot to fill out the google form for choosing the department. Did the research to figure out under which of the profs i'll be able to work on the stuff that is the most interesting for me, contacted several profs, set everything up with one of them, the nicest one – and forgot to fill out a simple form where you write what department you want to be assigned to. I went to the dean, asked what to do and if they can help me to get into the desired department. The dean refused. They said it's my fault (it is) and now I'll be assigned to a random one. And I ended up in literally the worst department, the one that was the last thing I could ever want. It's full of my most hated professors. And it's the department of mathematical physics. I hate physics, lol."
