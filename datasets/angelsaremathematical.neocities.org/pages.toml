["https://angelsaremathematical.neocities.org/exams.html"]
title = "The Ultimate Academic Failure"
full_description = '''There was something happening in my life for the past half of the year: I faced The Ultimate Academic Failure — I failed 4 exams in the spring (complex and vector analysis and two compsci subjects). That put a strain on me, to say the least, because the possibility of getting expelled got very real. I wish I cared less, but the constant stress spoiled my summer, I couldn't let go of the thought that September will come, and I'll have to deal with something that seemed absolutely unfeasible. Well, so, I passed everything. Neither I nor people that were aware of the situation expected me to deal with all four at once, so I'm really proud of myself. I'm liberated and able to breathe freely again. I think, that could very well be a core event in my life because I had to change a lot in my way of living in order to make it through. There are two main reasons I failed my exams: I struggle to get organized and force myself to do things. That significantly and chronically impairs numerous aspects of my life, especially academic performance, but also hobbies and relationships with people. I think, I figured out how to be more organized. I used to always be late, forget stuff that I needed to do, miss deadlines. For years, there always has been someone in my class who'd micromanage and mother me for that reason. In high school that was my friend I have known for more than a decade, in university — my classmate who I became really good friends with. Both of them would remind me to do my homework, tell me where to go, what to do, etc. And both of them would be astonished at just how exactly messy and scatterbrained I can sometimes be. This time I really had to put my life in order, so I got a daily planner. I can't believe how good it works and I don't understand how I was living without it. I got to the point when "if it's not in my planner, it doesn't exist". I don't have to care about remembering things anymore, it's all externalized, and that's such a liberating feeling. If your head is full of plans and tasks, it's too crammed for new ideas to emerge.'''
year_published = 2025
