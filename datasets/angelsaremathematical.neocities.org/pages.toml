["https://angelsaremathematical.neocities.org/subconscious.html"]
title = "Пуанкаре о роли бессознательного в математическом творчестве"
full_description = "Бессознательное или, как еще говорят, подсознательное «я» играет в математическом творчестве роль первостепенной важности; это явствует из всего предшествующего. Но это подсознательное «я» обычно считают совершенно автоматическим. Между тем мы видели, что математическая работа не есть простая механическая работа; ее нельзя доверить никакой машине, как бы совершенна она ни была. Дело не только в том, чтобы применять известные правила и сфабриковать как можно больше комбинаций по некоторым установленным законам. Полученные таким путем комбинации были бы невероятно многочисленны, но бесполезны и служили бы лишь помехой. Истинная творческая работа состоит в том, чтобы делать выбор среди этих комбинаций, исключая из рассмотрения те, которые являются бесполезными, или даже в том, чтобы освобождать себя от труда создавать эти бесполезные комбинации. Но правила, руководящие этим выбором, — крайне тонкого, деликатного характера; почти невозможно точно выразить их словами; они явственно чувствуются, но плохо поддаются формулировке; возможно ли при таких обстоятельствах представить себе решето, способное просеивать их механически?"
