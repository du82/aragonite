["https://angelsaremathematical.neocities.org/bestway.html"]
title = "Single best way to educate children"
full_description = 'For paradoxically there exists an agreed-upon and specific answer to the single best way to educate children, a way that has clear, obvious, and strong effects. The problem is that this answer is unacceptable. The superior method of education is deeply unfair and privileges those at the very top of the socioeconomic ladder. It’s an answer that was well-known historically, and is also observed by education researchers today: tutoring. I think the most depressing fact about humanity is that during the 2000s most of the world was handed essentially free access to the entirety of knowledge and that didn’t trigger a golden age. Think about the advent of the internet long enough and it seems impossible to not start throwing away preconceptions about how genius is produced. If genius were just a matter of genetic ability, then in the past century, as the world’s population increased dramatically, and as mass education skyrocketed, and as racial and gender barriers came thundering down across the globe, and particularly in the last few decades as free information saturated our society, we should have seen a genius boom—an efflorescence of the best mathematicians, the greatest scientists, the most awe-inspiring artists. If a renaissance be too grand for you, will you at least admit we should have expected some sort of a bump? And yet, this great real-world experiment has seen, not just no effect, but perhaps the exact opposite effect of a decline of genius. Consider how rare true world-historic geniuses are now-a-days, and how different it was in the past. In " Where Have All the Great Books Gone?" Tanner Greer uses Oswald Spengler, the original chronicler of the decline of genius back in 1914, to point out our current genius downturn: There are a bunch of other analyses (really, laments) of a similar nature I could name, from Nature’s "Scientific genius is extinct" to The New Statesman’s "The fall of the intellectual" to The Chronicle of Higher Education’s "Where have all the geniuses gone?" to Wired’s "The Difficulty of Discovery (Where Have All The Geniuses Gone?)" to philosopher Eric Schwitzgebel’s "Where are all the Fodors?" to my own lamentation on the lack of leading fiction writers.'
