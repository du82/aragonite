["https://angelsaremathematical.neocities.org/azone.html"]
title = "Azone doll and other things"
full_description = '''When i just got internet access, I looked at pictures of beautiful bjd dolls online and dreamed of one.. now i actually can have a beautiful doll.. little me would be so happy. I found her on Amiami. Getting the doll into sanctioned Russia wasn't straightforward, Amiami doesn't ship to Russia and our cards don't work in the rest of the world, so I asked my friend from Georgia to help me with the purchase (thank you, Daniel!). Yesss, the fact that i can't directly order an anime doll will definitely help to overthrow putin. I can feel the quality of my life increasing from purchasing the doll. Every time I see her on my desk, I get a micro spike of happiness. I have a confession... I get attached to things a lot and I'm very materialistic. I feel genuinely sad and it ruins my day (maybe month..) when something happens to them and then i remember it forever. Would love to someday build a collection of something precious to me. But a small one. It's cool when people have entire dedicated rooms full of racks to showcase their collectibles, but personally, I think it sort of devalues individual items. They get "lost" among everything else. I'd rather have a couple of shelves with things so beautiful they take my breath away, than a room full of stuff that is just pretty cool. Dad got me a pink Casio F-91W for new year. I absolutely love it. I also really love the fact that the wiki article for this model has a paragraph called "Usage in terrorism".'''
