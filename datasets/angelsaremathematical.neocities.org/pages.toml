["https://angelsaremathematical.neocities.org/hike2.html"]
title = "Сamping at the Black Sea"
full_description = '''I only got around to writing about my summer adventures in the winter... This summer me and my friends from university went camping to the shore of Black Sea. I took a sleeper train to the nearest town — it was my first time traveling alone. Not going to lie, it was very romantic. Friends picked me up from there and what happened next wasn't just a short drive to the shore, but a journey to another reality that lives by its own laws. The whole trip was otherworldly and feels like a dream. We camped on the mountainside by the sea. Every day we went swimming and cannonballing from the pier, in the cleanest water of the most beautiful turquoise color I've ever seen, and you could often see schools of tiny little fishes gliding through the water. We often jumped off the pier right into the schools of fish! This time we chose to sleep in hammocks instead of tents because of the heat, and when we were sleeping, we looked like giant pupae in silk cocoons hanging between the trees. Hammock sleep is very comfy, actually, if you do it right. You need to hang it between trees at such a distance that the hammock is stretched enough to be almost a flat horizontal surface, and then you have to lay in it sort of diagonally, so it's even more stretched out. I slept like this for several days and never had any pain in my back. I was always the first one to wake up in the morning. Every day I woke up around 7, brushed my teeth and went to the beach alone to stare at the waves. One day on my way back from the water source I found... a turtle! I've never saw a turtle in the wild before, yet alone such a big one! I carefully grabbed it and rushed with it to our camp, where everyone was still asleep. I raised it over my friend's hammock and screamed, "WAKE UP! WAKE UP!!!" He slowly opened his eyes, stared at the turtle for some time and then it dawned on him that he is looking AT A FUCKING TURTLE. Then I woke up everyone else in the camp the same way :^) After I showed the turtle to all of my friends, I ran with it back to the place where I found it and gently put it on the ground.'''
