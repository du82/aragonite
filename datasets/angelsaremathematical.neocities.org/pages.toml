["https://angelsaremathematical.neocities.org/proof.html"]
title = "Доказательство"
full_description = "Доказательство — рассуждение с целью обоснования истинности некоторого утверждения. Доказательство ассоциируется с математикой, а школьники связывают его прежде всего с геометрией. Истинно ли доказанное утверждение? — Конечно, что за вопрос… Нам все, что больше трех, требуется сосчитать: предметы или звуки. Непосредственное, без тренировки, пространственное и временное распознавание числа объектов простирается не далее 4 или 5. Это врожденное свойство: “нейронное” изображение чисел от 1 до 3 в “единичной” системе счисления (вертикальными или горизонтальными черточками) совпадает практически во всех культурах, различия в изображении чисел начинаются с числа 4. Нейронного запаса человеку оказалось мало, и он пополнил его. Сначала появился счет с применением стандартных счетных предметов: пальцев, камешков или раковин. Затем стали употреблять знаки: узелки, черточки, зарубки. Для уже привычных групп счетных знаков возникли знаки языка – числительные. Римляне надели камешки (calculus – отсюда калькулятор) на стержни – получились счеты. Счеты неявно ввели позиционную систему счисления. Нуль в этой системе не требовал изображения и не мог его иметь. Для записи результатов счета потребовались средства письменности — иероглифы и буквы алфавита. В Древнем Египте иероглифами записывали числа до десяти миллионов."
