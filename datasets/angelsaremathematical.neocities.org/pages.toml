["https://angelsaremathematical.neocities.org/beauty.html"]
title = "Life isn't a beauty contest"
full_description = "I grew up with a Barbie doll. Not a toy — a mother. She was a model, raven-haired, green-eyed, statuesque, with unrealistically perfect proportions, but there they were. Like the doll, my mother had an extensive wardrobe; Mom’s even included a couple of mother-daughter outfits. Were they fetching? I don’t remember. I do remember gazing at the two of us dressed alike: one, a full-blown goddess, larger-than-life, a voluptuous Renoir; the other, a skinny, freckle-faced tadpole, an anonymous, unfinished pencil sketch. It was in the shifting of that gaze — Mom, me, me, Mom — that my comparing mind was born. As far as my appearance was concerned, I was undefined except in relation to another woman. Whereas my mother was full and round and complete, I was thin, angular, and inchoate. My mother’s hair was wavy and thick, always perfectly coiffed. Mine was straight and fine, my bangs always uneven. Clothes clung languidly to my mother’s curves like an exhausted lover. My clothes, like worn-out color forms, refused to stick to me; elastic waistbands were sewn into my skirts to keep them from falling down. Though today I’m no Renoir, neither do I have trouble keeping my skirts up: It’s a 51-year-old body I live in. I’ve finally matured. But my comparing mind has not. It’s stubbornly stuck at 6, and if I were to follow its voice, I would feel once again like a tadpole among women. Though I’m full-grown, in my comparing mind I almost always come up short. So when it clamors to be heard, I listen as I would to a recalcitrant child, and then quiet it. Here’s what I mean: As I’m walking down a crowded city street, a gorgeous young creature in her thirties, sleek and glossy as a black cat, crosses my path. “Bad luck for you!” cries my comparing mind. “You’ll never look like that again! You’re old and invisible!” The woman and I are stopped at a curb. Her beauty imbues her with a mild haughtiness. In a regal kind of way, she turns her head in my direction. I catch her eye."
