["https://angelsaremathematical.neocities.org/collectors.html"]
title = "Коллекционеры - счастливые люди"
full_description = "Гёте однажды сказал, что коллекционеры - счастливые люди. Мне кажется, что подлинно и почти бесперебойно наслаждается нематериальным тот, кто хочет большего только от вещей, строит ожидания только относительно вещей и мечтает познакомиться с ещё какими-нибудь вещами. Морально выиграет желающий через год изменить интерьер в комнате, а не образ мыслей соседей, допустим. Когда твои эмоциональные бури спроецированы на мир вещей, ты безразлична к недостаткам окружающего мира и ещё больше любишь его достоинства, потому что отчетливо понимаешь, насколько построение человеческой гармонии сложнее самой редкой покупки. Ты благодарен вообще за всё, что нельзя купить. Ты избегаешь оценивания людей, потому что оцениваешь предметы. А они тебе несут только радость. Не люблю культ экзистенциальных кризисов, почти что обязательная демонстрация которых есть якобы абсолютный синоним глубины. Я люблю падких на предметы роскоши, занимающихся охотой на них или их созданием. Как минимум из-за наблюдения, согласно которому охотящиеся коллекционеры меньше сплетничают. Не забивают голову чужими недостатками и занятые мастера. (К тому же, вещизм коллекционеров является гарантией сытой жизни этих самых мастеров)."
