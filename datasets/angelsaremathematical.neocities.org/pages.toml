["https://angelsaremathematical.neocities.org/maps.html"]
title = "GPS messes with our ability to navigate"
full_description = "I love maps and orienteering. The location services on my phone don't work properly because of the custom rom I installed, so I'm forced to figure out my location on the map manually, by the things i see around, since GPS is not an option. That way every time I'm going somewhere new turns into a fun game. When I spent a year with dumbphones, every time i needed to go to an unfamiliar place, I'd look up the route beforehand and draw a little map on a piece of paper, highlight the landmarks and write notes. It was SO fun. I'm not doing some boring chores that involve moving around the city anymore, I'm a fucking pirate with an old treasure map instead. I think, dependence on GPS messes with our ability to navigate for ourselves. If you are blindly following the directions given by your navigational app, you aren't actually navigating, you aren't forming a 3D map of the area in your head and you aren't linking the pieces together. Navigation is a very useful skill that anyone can learn and improve through work, and when you are simply following the instructions, that skill atrophies. But why is this skill still useful now? It was crucial back in the day, because you must know where to find water, what areas are dangerous, where you already gathered, how to come back home from afar and so on. But now, when all of us have smartphones with GPS and you can ask somebody for directions in the city, it's impossible to get lost, so navigation skills should become practically obsolete. Why do I think that it's still a very good thing to know? Well, it's most likely a core skill for humans that contributed to our success as a species, and therefore it should be really beneficial for the brain to employ it, especially for spatial thinking. Creating mental maps in your head is also really fun and as a result, your phone's battery will drain slower... I'm certainly not saying we should abolish GPS and never use it again, but sometimes it can be really fun and beneficial to abandon it for a while and to exercise your brain to figure out the route without an app telling you where to go turn by turn. You'd also remember more from your trips and walks, if you relied less on automated directions."
year_published = 2025
