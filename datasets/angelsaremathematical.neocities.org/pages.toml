["https://angelsaremathematical.neocities.org/clay.html"]
title = "Polymer clay figure"
full_description = "I've been looking at garage kits (resin kits of unassembled parts you have to glue together yourself and paint) and thinking of getting one, but then i realized I can probably sculpt an anime figure myself.. That's how this project was started. I watched some videos of people doing it, roughly estimated what I'll need, went out and bought clay. There are other material options apart from polymer clay. One is air dry clay, it's based on cellulose and is water-soluble. Another option is to sculpt the figure with something like Monster Clay (it's an oil based sculpting medium and it doesn't dry or harden), make a silicone mold and cast the figure in resin. I decided to make Chii from Chobits. I spent the whole winter break on sculpting her. I'd wake up, brush teeth, make coffee, grab the mug and start sculpting right away, without even having breakfast. It felt surreal how concentrated I was, I'd make almost no breaks at all and sculpt until late at night. That was a very fun and fulfilling winter break. Having a PROJECT✨is so nice. I had a ton of fun autistically researching the technical details, trying to follow the best practices, troubleshooting and coming up with my own ways and techniques. I started with drawing what I approximately want to get in the end and then made a metal wire skeleton. Made a lot of mistakes with it. I wrapped a second layer of thinner wire over the base of stronger wire in order to make the whole structure sturdier, also to give the clay something to grip onto, so it doesn't slide off the armature. And I, uh, tried too hard. The armature ended up being too bulky and the wire would show through the clay later on. The foil would show through the clay. It would tear. Small pieces would mix with clay and make it unusable. Eventually I gave up, disassembled what I've already done, cut the baked parts with a knife, removed most of the wire and foil and started over. Can't underestimate the importance of the armature for structural integrity. I inserted wire into fingers on one hand and didn't for the other hand, thought it's going to be okay regardless. Then I accidentally dropped the figure several times and everything stayed in place, except for the fingers that didn't have wire in them."
