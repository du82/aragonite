["https://angelsaremathematical.neocities.org/sports.html"]
title = "Sports"
full_description = '''So, I achieved my goal! I am now able to do unassisted pull-ups! I wanted to learn them so badly, and I got them after just 3 months of training. In the beginning I couldn't even bend the elbows, but now I am able to do a proper pull-up with flawless technique, no kipping, chin over the bar. When I was hanging out with classmates during the break, one of them asked me if I'm still going to the gym, and I was like "yeah, actually I learned pull-ups yesterday!" and showed him the video. All other boys joined watching it, and everyone was so impressed. One of them said that he had never before in his life met a woman able to do a pull-up, and another one replied with "women who can are usually ex child athletes, but sonya never was one, she just randomly decided to learn them and succeeded." All dudes shook my hand and congratulated me. The whole thing was such a highlight, literally felt like that one Evangelion scene where everyone's clapping and congratulating Shinji. So proud and happy I go to the gym for roughly 2 months now, and in the beginning random exercises caused me wrist pain. It's my weak spot and I regularly complained about them hurting after holding a barbell. Yesterday I realized that it's been a while since i felt any pain in my wrists :) I strengthened them, they don't hurt anymore. I made some progress in pull-ups too! I lack strength. I might have the technical skill to do certain movements, but don't have the muscles for it. One ability that I lack the most is being able to do a pull-up. Necessary everywhere, obviously crucial for rock climbing, urbex would be much easier if I could climb into windows without asking friends for assistance. So, it's been my goal since the summer of 2023, but I would train for it only sporadically with the resistance bands at my climbing gym, if I remembered to do it, and the progress was very slow. Did banded and negative pull-ups this summer too, but without a lot of consistency. I recently started going to a regular gym and building a good strength training routine, and my main goal is to learn to do unassisted pull-ups. This is currently the most important and energy-consuming part of my workouts. I'm doing them on the assisted pull-up machine, it's a machine that subtracts from your bodyweight. I can now do a pull-up with minus 10 kg from my weight, so I'm not that far away from my goal!'''
