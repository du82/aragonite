["https://angelsaremathematical.neocities.org/coincidence.html"]
title = "Как появляются невероятные совпадения?"
full_description = "1. Как сказал Август Де Морган: «Все может случиться, если сделать достаточное количество попыток». Важным является то, что вы не видите всех попыток, а значит не можете корректно оценить невероятность события. Это отлично демонстрирует Джордан Элленберг в своей книге «Как не ошибаться». Он рассказывает такую историю: однажды вы получаете рассылку от фондового брокера из Балтимора в которой он пишет, что завтра определённые акции вырастут в цене. Так и происходит, и на следующий день приходит новое предсказание: он указывает на другие акции, на этот раз предсказывая падение. И это предсказание сбывается. Так продолжается неделю, и брокер ни разу не ошибается. Ну что вы уже хотите купить подписку на предсказания этого сводного брата Уорена Баффета? А если бы вы узнали, что в первый день он отправил 10 тысяч предсказаний, в половине из которых он обещал рост акций, а в другой половине падение? А затем отсекая из рассылки тех, для кого его прогнозы не сбылись продолжал делать так же всю неделю? 2. Но насколько хороша наша интуиция в статистике и теории вероятностей? Apple shuffle - случайное воспроизведение песен, изначально вызывал поток жалоб от пользователей. Люди говорили, что похожие песни или песни одного исполнителя шли подряд. И это абсолютно нормально для случайности, но не ощущается как случайность. Эплу пришлось переделать систему заставив её избегать случайных патернов, которые наш мозг воспринимал неслучайными. Стив Джобс про это сказал: «мы сделали apple shuffle менее случайным, чтобы он казался более случайным»."
