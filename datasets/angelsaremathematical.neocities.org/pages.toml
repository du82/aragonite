["https://angelsaremathematical.neocities.org/hike.html"]
title = "My first hike"
full_description = "Students of my university organized one and I was invited, there were 9 of us. It was an EXPERIENCE. Never had hiked before. Bought a hiking backpack, borrowed a tent, sleeping bag and pad from friends. I also bought military MREs for me and my best friend, but apparently we weren't hungry enough for them to become edible... dumped them right into the trash. We took a long-distance train to a town called Goryachy Klyuch. The train went all night long, we arrived in the morning, had breakfast and set off. My backpack ended up weighing around 14 kilograms, I thought I would die carrying it up the mountains, I'm small.. But it was actually very fun. My backpack is good for distributing the weight more or less evenly on the back, so my shoulders didn't hurt, but every easiest and mundane action turned into a fun physical challenge. A simple act of walking becomes engaging, as balancing yourself gets much more difficult. My favorite things to do with a heavy backpack were: 1) crossing a mountain stream by walking on stones. the stones are wet and slippery. one wrong move and you're in the water. 2) climbing over fallen trees. I thought everything (walking with a lot of weight, setting up a tent, etc) is going to be much harder, but every single thing that I feared turned out to be really easy and exciting. Our destination was a small waterfall with some tiny caves deep in the woods. We built our camp on top of it. Someone carved holds everywhere and I had a ton of fun climbing the rocks there. The water cut out something like a basin in the rocks and I was using it as a bath.. I took disposable soap sheets and washed myself with them. Felt so good to bathe in a waterfall when birds sing and everything is so green. In the morning I went down to the beginning of the waterfall, sat down on a mossy log and brushed my teeth, it was awesome.. I took drip coffee bags to the trip and was treating everyone with tasty coffee that everyone loved. One day me and my friend didn't want to wait until the kettle boils and boiled the water for cofe in my steel mug on a tablet of dry alcohol."
year_published = 2025
