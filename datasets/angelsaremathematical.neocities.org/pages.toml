["https://angelsaremathematical.neocities.org/neural.html"]
title = "о наглости"
full_description = "для того, чтобы делать такие полезные (на самом деле паразитарные) вещи как улучшение показа рекламы и распознавание картинок — для капчи ли или автопилотируемых автомобилей — хитрые менеджеры от айти придумали заставлять самих пользователей распознавать капчу с картинками. люди из восточной азии, во всяком случае из китая, на три головы в этом плане порядочнее европейцев и американцев. там надо совместить две фигуры, или перечислить заполненные/пустые фигуры, или что-то такое. но ушлые люди с запада именно сливают на обычного пользователя работу, за которую не хотят платить деньги. я эту систему терпеть не могу, уже писал раньше, что могу потратить 5 минут вместо 5 секунд на ввод капчи, лишь бы скормить нейросети хоть один неправильный результат. верю и надеюсь, что капля за каплей накопится море под названием человеческие жертвы из-за обучения по неправильному датасету — а судя по тесле, для небольших трагедий даже необязательно скармливать плохими данными нейросеть, программисты справляются сами. к сожалению, со временем мне приходится сдаться, потому что визуальное обучение сейчас находится на относительно высоком уровне. дело в том, что система заранее знает, какие ответы правильные, и ее знание становится все лучше, поэтому сходу очень трудно угадать, о каком неверном варианте система уже знает. но наглецы пошли дальше."
