["https://angelsaremathematical.neocities.org/state.html"]
title = "Государство"
full_description = 'Давно хотел написать об этом, но как-то в разгар войны не хотелось. Теперь, когда война если не идёт к завершению, то по крайней мере стала общим привычным фоном, наверно можно и написать. А суть вот в чём. Есть два типа людей — одни боятся собак, другие нет. Я собак боюсь. Рационально я могу понять, что в 99% случаев для собаки я не представляю интереса и что большинство собак дружелюбны, а если даже собака лает, то это ещё не значит, что она собирается укусить и т.д. — я всё это понимаю. Но когда прохожу мимо бесхозной свободной собаки (или не дай бог — нескольких собак), я как минимум всегда напрягаюсь. Если же собака делает движение в мою сторону — я напрягаюсь сильнее. Если она гавкнет — у меня на миг душа уходит в пятки, потом как правило я вижу, что собака теряет ко мне интерес и гавкнула она просто от скуки, и я, постепенно удаляясь от неё, постепенно же и успокаиваюсь. Ну да, у меня было пару неприятных эпизодов с собаками в детстве, но они меня даже ни разу не кусали. Я знаю людей, которых собаки именно что кусали и они тем не менее их совсем не боятся. То есть тут просто какие-то особенности психики, которая так перекручивает восприятие такого явления как "собака", что в итоге возникает либо страх, либо безразличие, либо любовь.'
