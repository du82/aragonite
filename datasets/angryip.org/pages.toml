title = "Angry IP Scanner - Download for Windows, Mac or Linux"
full_description = '''Current Download version 3.9.1 below or browse previous releases or even older releases. Windows installer - includes Java runtime (recommended) Stand-alone executable - requires a separate installation of 64-bit OpenJDK/Java 11+ Last version to run under Java 8 is 3.7.6. Legacy This is an older generation of Angry IP Scanner. Download version 2.21 below (120 kb) or browse all 2.x releases ipscan.exe for Windows 98/ME/2000/XP If you get warnings about viruses or trojans, read this FAQ entry. No installation is needed. However, you may use the Install program... from the Utils menu in order to create shortcuts, etc. Download version 3.9.1 below or browse previous releases or even older releases Bundle for Mac Intel - right-click and Open for the first time Bundle for Mac ARM (M1/M2) - right-click and Open for the first time Running The zip file contains Mac application bundle: just save it and double-click to extract. On first run right-click and select Open or go to Settings/Security and allow installing apps from other sources besides Mac Store. See FAQ entry for more info. You can then run it by double-clicking the Angry IP Scanner icon. Or drag it to Applications menu in Finder if you want. Java Runtime is included in bundles above, no separate Java installation is needed. Download version 3.9.1 below or browse previous releases or even older releases. x86 64-bit DEB Package for Ubuntu/Debian/Mint x86 64-bit RPM Package for Fedora/RedHat/Mageia/openSUSE Any arch DEB Package for Raspbian/Debian (e.g. 32-bit or ARM), see below Executable Jar - you need to provide your own swt.jar to classpath Running Make sure you have at least Java 11 or OpenJDK installed - check your distribution. Last version with Java 8 support was 3.7.6. DEB and RPM packages will install appropriate 'desktop' files, so Angry IP Scanner will appear in Applications menu, under either Internet or Networking. Alternatively, you can just type ipscan to launch the application. Jar files are launched by either double-clicking or typing java -jar jar-file. Note for Raspbian/32-bit ARM: to run the "any" architecture package above, you will need an older 32-bit build of SWT, as current versions provided by Bullseye dropped 32-bit support.'''
