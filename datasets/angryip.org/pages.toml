["https://angryip.org/faq/virus.html"]
title = "Angry IP Scanner - Is the program infected with a virus?"
full_description = "Important: There are no trojans or viruses in Angry IP Scanner’s ipscan.exe. Review the source code if you wish to check yourself. Some antivirus software vendors (McAfee, Symantec, and some others) are identifying Angry IP Scanner as ‘potentially unwanted program’ or risky ‘hacktool’. Their programs often delete Angry IP Scanner from the disk during virus scanning. The reason behind this is the will to bloat ‘virus databases’ and show unreal high number of detected ‘viruses’ in order to impress their customers. So they include everything they can find on the Internet, including many security tools, such as Angry IP Scanner."
