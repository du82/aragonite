title = "Animatable | Create HTML5 / CSS3 animations and advertising"
description = "Animatable is an easy to use, browser-based application to create HTML5 / CSS3 animations and advertising for Android, BlackBerry QNX, iOS and WebOS."
full_description = "Dear friends of the web, We're truly sorry to inform you that Animatable is no longer being developed. We were ridiculously excited by about our vision (and development to date) for the product, but unfortunately due to each of our personal responsibilities – being many client projects, running of our own businesses, writing, and speaking events – we just haven't managed to give Animatable the time it so needs and deserves. The last thing we want to do, is to release a sub-standard product to you, as we know just how important this would be to your workflow. Our apologies, and best wishes, Andy, Dan, Mircea, and Naomi Mircea is the brains behind the wonderful coding of Animatable. If anyone would like to talk about investing in, or developing this further – please feel free to contact him at mircea@typefolly.com"
author = "Andy Clarke | @malarkey"
year_published = 2025
