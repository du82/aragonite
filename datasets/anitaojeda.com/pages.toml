["https://anitaojeda.com/looking-for-a-novel-set-in-burma-during-world-war-ii"]
title = "Looking for a Novel Set in Burma During World War II? | Anita Ojeda"
description = "Are you looking for a novel set in Burma during World War II? Darkness Calls the Tiger will grab you and keep you engaged until the last page. #DarknessCallsTheTiger #Amreading #bookreview #burma #WW2 #inspirational #historicalnovel #myanmar"
full_description = "Anita Ojeda I receive free electronic advanced reader copies of these books through an arrangement between the publishers and NetGalley in exchange for my honest opinion on NetGalley’s website. I only review books on my blog that I really love. Are you looking for a novel set in Burma during World War II? Darkness Calls the Tiger will grab you and keep you engaged until the last page. I Dare You to Name a Novel Set in Burma During World War II! Even as a history major in college, no one ever talked about Burma (today known as Myanmar). And despite my love of historical novels, I’ve yet to see a novel set in Burma. Most people focus on Hitler and the war in Europe or Pearl Harbor and the Philipines. I confess I didn’t know much about the Japanese until I read Unbroken by Laura Hillenbrand and listened to The Indomitable Florence Finch: The Untold Story of a War Widow Turned Resistance Fighter and Savior of American POWs by Robert Mrazek. What happens when American citizens travel to faraway countries, such as Burma, and find themselves in the crossfire of warring nations? This new release by Janyre Tromp tells such a tale. If you love historical fiction and you enjoy learning about unusual historical details, you’ll love Darkness Calls the Tiger. Darkness Calls the Tiger By Janyre Tromp, Kregel Publications, May 14, 2024, 352 pages. Although an American by birth, Kailyn Moran has never traveled to America. Instead, she’s spent her life alongside the Kachin people in the mountains of Burma. Her missionary parents’ heart for service forms Kailyn’s core beliefs. But when her mother dies, her loving father turns into a man she scarcely recognizes. Her caring, adopted Kachin family stands in the place of the parents she used to have. When rumors of war make their way to their secluded village, her father’s young missionary associate, Ryan McDonough, realizes two things—he has feelings for his supervisor’s brilliant daughter and will do anything to prevent harm from befalling those he cares about, even if it means taking up arms against the Japanese. When Kailyn’s father leaves the safety of Tingrabum to help other Kachin tribes, Ryan and Kailyn find themselves in charge of defending the village and assisting the Allies. Ryan plans to lead the villagers to safety higher up and then lead refugees, including Kailyn, into India. Despite their valiant efforts, two of the most important villagers die at the hands of the Japanese. Before Ryan shares his plans with Kai, she disappears into the jungle, consumed with guilt and thirsting for revenge against the brutal Japanese. As World War II slogs on, Ryan and Kai forge their own roads. Ryan enlists with the OSS and uses his knowledge and skills of the jungle, people, and language to help recruit Kachin warriors to the Allies’ side. Kai becomes a one-woman guerilla warfare unit that stalks her prey with precision and stealth, earning her the name of Sharaw, the legendary man who turns into a tiger. What will happen when their paths meet? What I Loved About This Book If you’ve never heard of the China-Burma-Indian theater of World War II, this heart-pounding story will bring it to you like none other. Tromp weaves beauty with violence and lush prose to create a tapestry depicting the horrors of war—especially for non-combatants. Characters experience the hell of war and struggle with their personal demons and choices—whether to forgive and follow Karai Kasang’s path or heed the call of the tiger and the darkness within. Readers who’ve experienced trauma and upheaval will identify with Kai and Ryan as they struggle to forgive God and man. Trigger warning—if you’ve experienced violence to your person, this book may trigger you. Tromp writes the scenes carefully and doesn’t glorify the violence, but the implications are clear and may trigger some readers. Don't miss this lush and moving novel from @JanyreTromp and @KregelBooks! #WW2Novel #amreading Click To Tweet I'd love it 