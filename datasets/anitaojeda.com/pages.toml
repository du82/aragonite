["https://anitaojeda.com/introverted-you-need-to-read-this-book"]
title = "Introverted? You Need to Read this Book! | Anita Ojeda"
description = "Introverted? Don't miss this new release by Holley Gerth. She'll take you behind the science of why you feel the way you feel in a crowd and guide you through how to embrace your differences. You have a purpose only YOU can fulfill. #introvert #purpose #extrovert #personality #selfcare #amreading #bookreview"
full_description = "Anita Ojeda Introverted? Don’t miss this new release by Holley Gerth. She’ll take you behind the science of why you feel the way you feel in a crowd and guide you through how to embrace your differences. You have a purpose only YOU can fulfill. I receive free electronic advanced reader copies of these books through an arrangement between the publishers and NetGalley in exchange for my honest opinion on NetGalley’s website. I only review books on my blog that I really love. You Know You’re Introverted When… During a recent Twitter party, a friend lamented having to take the COVID test. I sped-read her tweet, and saw the words COVID and AWFUL and immediately commiserated. Then I read her tweet again, and realized she didn’t think the TEST was awful, she thought having to self-isolate while she awaited the results of the test was awful. You know you’re introverted when you see a tweet like hers and think, “Nice! Mandatory self-isolation sounds marvelous right about now!” While I felt sorry for all of my friends who bemoaned the self-isolation, I secretly gloated that I had so. much. time. alone. And then I’d feel guilty. Introverted people aren’t supposed to gloat. Introverted people should…well, what should they do? For a long time, I’ve felt like a party-pooper married to the life of the party. But now I see myself differently. Introverted, but powerful. All because of Holley Gerth’s new book. The Powerful Purpose of Introverts: Why the World Needs YOU to BE YOU By Holley Gerth, Revell, September 15, 2020, 208 pages. If you’ve wondered why you don’t fit the world’s mold for most of your life, you need to read this book. Maybe you’ve been working against your God-given character traits instead of with them for your entire life. Perhaps you hang on the outskirts of life thinking you’ve done something wrong because what everyone calls ‘fun’ doesn’t seem like fun to you. Maybe God created you as an introvert, and not an extrovert. Gerth, an introvert, takes readers through the science of why we have no desire to be the life of the party (or even at the party). She urges introverts to practice self-coaching (not self-criticism or self-pity). Gerth defines self-coaching as ‘kindness and empathy plus action.’ Introverts rarely find it difficult to treat others with kindness, but we spend a lot of useless energy beating ourselves up for who we weren’t meant to be. Gerth also gives practical advice for designing our days to take into account the draining each activity will exact from our system. She cheers the introverts on, helping them see that different doesn’t equal better or worse—just different. The world needs quiet, contemplative people. The world needs introverts. This book will help introverts shine the way God intended them to shine. Now, if I can just get my extroverted spouse to read the book so he understands me a bit better! I'd love it if you share what you like on your social media platforms!Click to share on Facebook (Opens in new window)Click to share on Pinterest (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on WhatsApp (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Reddit (Opens in new window)Click to email a link to a friend (Opens in new window)MoreClick to print (Opens in new window)Click to share on Pocket (Opens in new window)Click to share on Telegram (Opens in new window)Like this:Like Loading... Related"
