["https://anitaojeda.com/welcome-to-the-write-28-days-blogging-challenge"]
title = "Welcome to the Write 28 Days Blogging Challenge | Anita Ojeda"
description = "Looking for a blogging challenge to chase away the mid-winter blues? Check out the #write28days writing challenge! Are you in? #blogger #writer #challenge #writerslife #amwriting"
full_description = "Need a blogging challenge to chase away the mid-winter blues? Join us for the 2023 #write28days blogging challenge. Sign up for the emails, set your goals, and start writing! Looking for a blogging challenge to chase away the mid-winter blues? Join us for a writing challenge that will not only flex your creative muscles but help you learn the discipline of writing and posting consistently. If you’re new to blogging, you’ll love the added benefit of having 28 new posts in your blog! The Skinny on #write28days Here’s how it works. You commit to writing and posting EVERY DAY in February. Twenty-eight days of writing and posting. Between February 1 and 5, you’ll be able to click here to link up your landing page (or first post). Check back often during that week and find someone else writing about a topic that seems interesting to you. Visit their post and leave a comment, letting them know that you’re part of the challenge, too. On social media (Facebook links, Instagram, Twitter, Pinterest, etc), use the hashtag #write28days to make it easier to find each other, connect, and cheer each other on (after all, what’s the fun in a challenge with no cheerleaders?). Join the Facebook Group if you’d like to engage even more. We’ll have daily share threads and accountability opportunities. Don’t worry. There are no #write28days police out there, making sure you post every day. No one will knock at your door at midnight if you haven’t hit publish yet. In fact, no one will knock on your door if it takes you longer than 28 days to write 28 posts. Or if what you have to say takes longer than 28 days to say (that happened to me one year…it was more of a ‘#write41days’ challenge). The History The idea of having a writing challenge started almost a decade ago with a blogger called The Nester, who issued the challenge in October. She eventually turned the reins over to Crystal Stine, who announced in November 2018 that that would be the final year of the #write31days October challenge. I participated for five years, and I can attest that participating in the challenge was the best thing I ever did for my blogging. I’d been writing to an audience of mostly crickets for an entire year. When I joined the challenge, I suddenly discovered a community. The friends I made during that first challenge are still my friends. We hang out in each other’s spaces, promote each other’s writing, and cheer each other on through sickness and health, job loss, and life changes. I hope you’ll also find community and encouragement for your writing journey. For the Five-Minute Friday Fans If you’re a Five-Minute Friday regular, you know all about writing with prompts. Once again, I’ll have 28 writing prompts you may use Each word has been carefully selected for SEO (search engine optimization). That means tens of thousands of people are looking for posts with those words, but very few people have used those words in the titles or content of their posts. That makes the words a win-win for you and for readers as far as gaining organic traffic goes. If you have any questions, email me at anita at anitaojeda.com, and I’ll happily help you! Looking for a writing challenge? This 28-day blogging challenge will get your creative juices flowing! #amwriting #challenge #blogging #instagram Click To Tweet Sign up below to receive the challenge’s prompts, updates, and news! If you’d like the prompts in advance, make sure you sign up below! I’ll send out seven prompts each week starting on January 15. I know some of you love to get ahead of the game! I'd love it if you share what you like on your social media platforms!Click to share on Facebook (Opens in new window)Click to share on Pinterest (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on WhatsApp (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Reddit (Opens in new window)Click to email a 