full_description = "About MeWho is Anita Ojeda? Anita Ojeda juggles writing with teaching high school English and History at a small private school for Native Americans. She writes about her caregiving journeys over at her blog Blessed (but Stressed). When she’s not lurking outdoors looking for and photographing rare birds in odd places, you can find her hanging out with her husband, camping with her kids, or mountain biking with her students. Her MA degree in English awakened her to the bliss of gracious grammar and she struggles to keep her Sharpie in her pocket when she sees misplaced apostrophes. She is a published and listed author with the Society of Children’s Book Writers and Illustrators and has guest posted on Stand Up to Cancer’s blog. Her stories and articles have appeared in professional journals as well as niche magazines. I'd love it if you share what you like on your social media platforms!Click to share on Facebook (Opens in new window)Click to share on Pinterest (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on WhatsApp (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Reddit (Opens in new window)Click to email a link to a friend (Opens in new window)MoreClick to print (Opens in new window)Click to share on Pocket (Opens in new window)Click to share on Telegram (Opens in new window)Like this:Like Loading... 80 % Business Coaching 75 % Personal Development 86 % Carrier Advice 90 % Physical Coaching Proud Member of Blog About .bttk-team-holder-modal{ display: none; } jQuery(document).ready(function($) { $('.bttk-team-holder').click(function(){ $(this).siblings('.bttk-team-holder-modal').addClass('show'); $(this).siblings('.bttk-team-holder-modal').css('display', 'block'); }); $('.close_popup').click(function(){ $(this).parent('.bttk-team-holder-modal').removeClass('show'); $(this).parent().css('display', 'none'); }); });"
