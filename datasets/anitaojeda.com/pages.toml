["https://anitaojeda.com/2021-write-28-days-blogging-challenge-link-up-page"]
title = "2021 Write 28 Days Blogging Challenge Link-up Page! | Anita Ojeda"
description = "Looking for an Instagram or blogging challenge to chase away the mid-winter blues? Check out the #write28days challenge! Twenty-eight days, 28 posts. You can DO this! #blogger #writer #bloggingchallenge #writingchallenge #instagramchallenge #Write28Days"
full_description = "Anita Ojeda Looking for a blogging or Instagram challenge to chase away the mid-winter blues? Check out the #write28days challenge! Twenty-eight days, 28 posts. You can DO this! A Blogging Challenge for YOU! If you land here before February 1, 2021, you’re an early bird! And I like birds. The link-up will open officially at 4 am, Mountain Standard Time (or Arizona time–we don’t observe Daylight Savings Time here in Arizona, so we live in a state of perpetual confusion about what time it is in neighboring states). A Word About Categories and Community This year, there are just two categories: Blog posts and Instagram posts. We’re keeping it simple, my friends! Once you link up, please, please, pretty please take a few minutes to visit the person who linked up before you. Leave a kind and encouraging comment on their post and let them know you’re their friendly neighbor from the #write28days challenge. It takes a lot of dedication and self-discipline to write and post 28 days in a row. We can use all the encouragement we can get. Tomorrow, or the next day, make sure you come back to the page and visit whoever linked up AFTER you, too! Hopefully, they’ve already visited you, and kind bloggers make an effort to return visits. While you’re there, hit the [Tweet] button and share the post on your social media. If you do Pinterest, share there, too! If you’d like to join the group Pinterest board for the #Write28Days Challenge, visit this link. You’ll need to follow me on Pinterest and then message me to let me know you want to join up (make sure you include your Pinterest name, so I can find you if it’s different from your name). Speaking of community, you can also join the #Write28Days Facebook group, where we’ll have daily share threads (you leave a link and visit the person before you and after you). Share threads are a great way to find new friends and kindred spirits. I’m so excited to see each of you here and I can’t wait to see what beautiful words you have to share with the world! Good for you for making a commitment to follow your dreams and write. If you want to sign up for the #write28Days email, sign up here! Bloggers, Link Up Here! If you have a blog, here is where you leave the landing page for your first post! You are invited to the Inlinkz link party! Click here to enter Instagrammers, Link Up Here! For those who want to write short form and spend time growing your Instagram, you can link up here! You are invited to the Inlinkz link party! Click here to enter Resources If you’re new to blogging, you can still participate. In fact, this is a great way to start and build your blog. By the end of the month, you’ll have 28 beautiful posts. This link will take you to a series I did last year on how to improve your blog with 28 small changes. I have other posts on blogging (I don’t just write about self-care, although that’s what I do the most!) here. If you’ve never linked up before using Inlinkz, this post will walk you through the steps. Wondering how to gain traction on Instagram? Check out my friend Ruthie Gray’s free Instagram challenge. If writing fiction is more your thing, my friend Kirsten Oliphant is an indie author with multiple best-selling books on Amazon (under her pen-name, Emma St. Clair). She has a podcast and blog with all the information you need to produce quality books on a shoestring budget (the good writing is up to you, of course). The Five-Minute Friday Connection My good friend Kate Motaung over at Five-Minute Friday hosts a weekly Twitter party and link-up where bloggers get together to chat on Thursday nights. At the end of the chat, Kate gives us a writing prompt, and we scurry to our blogs and write for five minutes and then hit [publish]. It’s a great community and a wonderful way to flex your writing muscles. For those of you who like writing from a prompt, Kate and I have researched and selected 28 prompts. Kate will reveal the prompts of February 5, 12, 19, and 26 (the Fridays of the blogging challenge) at the end of her Thursday-night Twitter parties. All you have to do to join the Twitter party is show up on Twitter at 6:45 (MST) and search for the hashtag #fmfparty. Jump right in and introduce yourself. Make sure you let everyone know you are participating in the #write28days challenge, too! I’ve found it’s easiest to keep up with the party action if I use an app like TweetDeck to organize and follow the hashtag #fmfparty in real time. Join us! It’s a hoot! If you’d like the rest of the prompts, just sign up for the #Write28days Blogging Challenge emails: I'd love it if you share what you like on your social media platforms!Click to share on Facebook (Opens in new window)Click to share on Pinterest (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on WhatsApp (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Reddit (Opens in new window)Click to email a link to a friend (Opens in new window)MoreClick to print (Opens in new window)Click to share on Pocket (Opens in new window)Click to share on Telegram (Opens in new window)Like this:Like Loading... Related Blogging Challenge February 2021 Instagrammer Write28Days Writer Writing"
