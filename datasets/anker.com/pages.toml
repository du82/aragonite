full_description = "PRIVACY NOTICE Last Updated: November 30th, 2023 This Privacy Notice is issued by Anker Innovations Technology Co., Ltd and its affiliates (together, “Anker”, “we”, “us” and “our”) and is addressed to individuals outside our organization with whom we interact, including customers, visitors to our Sites, users of our Applications, recipients of any of our other products or services (together, “you”). Defined terms used in this Privacy Notice are explained in Section (16) below. This Privacy Notice applies to all of Anker’s brands, including Anker, AnkerMake, AnkerWork, Eufy, Mach, Nebula, Roav, and SoundCore, as well as any specific device, website, or application that references or links to this Privacy Notice. We may update this Privacy Notice to reflect changes to our information practices. If we make any material changes, we will notify you by email (sent to the e-mail address specified in your account) or by means of a notice on Anker's Application or Site you used prior to the change becoming effective. All changes shall be effective from the date of publication unless otherwise provided. We encourage you to periodically review this page for the latest information on our privacy practices. You may also have certain rights regarding the information we collect about you. Specifically, the rights of Data Subjects under the GDPR are explained in Section (9) below. Similarly, U.S. residents in general and California Residents in particular may find information on their rights as a consumer in Section (15) below. List of Contents 1. Collection of Personal Data 2. Creation of Personal Data 3. Categories of Personal Data We Collect and Process 4. Purposes of Processing 5. Legal Basis for Processing 6. Disclosure of Personal Data 7. International Transfer of Personal Data 8. Data Retention 9. Your Privacy Rights 10. Direct Marketing 11. Details of Controllers 12. Business Information and Links to Other Websites 13. Cookies, Analytics and Tailored Advertising 14. Contact Us 15. Additional United States Privacy Disclosures 16. Definitions 1. Collection of Personal Data Depending on how you use our Sites, Applications, products or services, we may collect or obtain Personal Data about you from the following sources: Data you provide to us: We obtain Personal Data when you provide those data to us (e.g., when you register an account with us; where you contact us via email, telephone, or by any other means; or when you provide us with your business card). Account creation details: We collect or obtain Personal Data when you register or create an account to use any of our Sites or Applications. Relationship data: We collect or obtain Personal Data in the ordinary course of our relationship with you (e.g., when we provide a service to you). Site or Application data: We collect or obtain Personal Data when you visit or use any of our Sites or Applications, or use any features or resources available on or through our Sites or Applications. Content and advertising information: If you interact with any third-party content or advertising on our Sites and/ or Applications (including third-party plugins and cookies) we allow the relevant third party providers to collect your Personal Data. In exchange, we receive Personal Data from the relevant third-party provider relating to your interaction with that content or advertising. Data you make public: We may collect the content you publish, or otherwise manifestly made public about us through our Apps and platforms, your social media, or any other publicly available platforms. Third party information: We collect or obtain Personal Data from third parties who provide it to us (e.g., single sign-on providers and other authentication services you use to connect to our services, third-party providers of integrated services, your employer, other Anker customers, business partners, Processors, and law enforcement authorities). Data automatically collected: We and our third-party partners automatically collect information you provide to us and information about how you access and use our Sites, Applications, products or other services when you visit our services, read our emails, or otherwise engage with us. We typically collect this information through a variety of tracking technologies, including (i) cookies or small data files that are stored on an individual’s computer and (ii) other, related technologies, such as web beacons, pixels, embedded scripts, mobile SDKs, location-identifying technologies and logging technologies (collectively, “tracking technologies”) and we may use third-party partners or technologies to collect this information. Information we collect automatically about you may be combined with other personal information we collect directly from you or receive from other sources. For more information on which data we collect, please also refer to the table in Annex I. 2. Creation of Personal Data We also Process and retain Personal Data about you in certain circumstances, such as records of your interactions with us, details of your past interactions with us, and inferences or predictions about your characteristics or interests. We may also link Personal Data collected from any of our Sites, Applications, products, or services, including where those data are collected from different devices. 3. Categories of Personal Data We Collect and Process When you first register for an Anker account, we may collect the following categories of Personal Data about you: username and password, email addresses and/ or phone numbers. After successfully creating your Anker account, you can use it to log in across Anker’s various Sites and Applications without needing to create an account for each specific Site or Application. When using our Sites, Applications, products, or services, we may also collect and/or process the following categories of Personal Data about you: Contact information: including first and last name, preferred name, phone number, email address, mailing address. Account information: including first and last name, date of birth / age, alias, user ID, country, language preferences, email address, phone number, avatar, account credentials or one-time passcodes, single sign-on authentication tokens, loyalty and incentive program credits / rewards, and the products or services you purchased or have otherwise used. Transaction information: including records of purchases and prices, consignee first and last name, shipping address and contact information, shipment tracking details, details of returns, and warranty details. Payment details: such as invoice / payment records, payment amount, payment date, billing address, payment method. Please note that we use third-party payment providers, including Shop Pay, Stripe, Amazon Pay, PayPal, and Google Pay, to process payments made to us. We do not receive or retain any personally identifiable financial information such as payment card numbers; rather, all such information is provided directly by you to our third-party payment providers. The payment provider’s use of your personal data is governed by their privacy policy. Information collected from third-party authentication services or other third-party accounts you link to our services: some of our Sites, Applications, products, or services may allow you to log in through a third-party social network or authentication service, such as Amazon, Apple, Google, and Facebook. When you use these single sign-on services to access our Sites, Applications, products, or services, we do not receive your login credentials for the relevant third-party service. Instead, we receive tokens from the single sign-on service to help identify you in our system (such as by your username) and confirm you successfully authenticated with the single sign-on services. In addition to authenticating your identity, these services will, in most cases, provide you the option to share certain Personal Data with us, which could include your name, email address, address book, friend list and other contacts, or other information in your public profile (e.g., profile picture, age range, gender, language, country). The data we receive is dependent on that third party’s policies and your privacy settings on that third-party site. Product-specific information: we collect or otherwise facilitate the processing of the following types of information in connection with certain of our Sites, Applications, products and services, such as customer content, entertainment-related service information, home-related services information, car-related services information,Baby-related services information,Health-related services information, biometric services information. The specific information collected may vary depending on the product you use. For more information on which product-specific data we collect, please also refer to Annex 2. Information about your device and network: including the device type, operating system, IP address, browser type, user ID and UUID, or your network (including, for example, a persistent device identifier or advertising ID). Information about the way individuals use our services and interact with us: including the site from which you came, the site to which you are going when you leave our services, how frequently you access our services, whether you open emails or click the links contained in emails, whether you access our services from multiple devices, and other browsing behavior and actions you take on our services (such as the pages you visit, the content you view, the communications you have through our services, and the content, links and ads you interact with). We employ third-party technologies designed to allow us to collect detailed information about browsing behavior and actions that individuals take on our services, which may record your actions down to the level of mouse movements, scrolling, clicks, and keystroke activity on our services. Event, contest, promotion, and survey information: including information provided when you sign up for an event, enter a contest or promotion, complete a survey or submit a testimonial. Feedback and support information: including the contents of custom messages sent through the forms, email addresses, photographs or videos you file, or other contact information we make available to customers, as well as recordings of calls with us (where permitted by law). To collect some of the Personal Data set forth above, we may need to request permission to access such Personal Data through your mobile device. You are in control of the permissions you grant us, and you may change your permission settings at any time in the setting dashboard of your device. Note that revoking permissions may affect the provision and performance of our Sites, Applications, products, and services. 4. Purposes of Processing We may use the Personal Data we collect for the following purposes: Fulfill our contractual obligations, to deliver the products and services you have requested, including facilitating your messages to other users or groups and for account and contract management (including customer support); Communicate with individuals, including via email, text message, social media and/or telephone and video calls; Review our business performance; Market our products and services to businesses and individuals, including through email, direct mail, phone, text message or online advertising. This may include targeted advertising and retargeting; Administer, improve and personalize our products and services, including by recognizing an individual and remembering their information when they return to our Services and analyzing our customer base; Process payment for our services; Conduct market research; Opportunity tracking, conversion and lead generation; Test, enhance, update and monitor the products and services, or diagnose or fix technology problems; Help maintain the safety, security and integrity of our property, products and services, technology assets and business; Enforce our contractual rights, including without limitation, and to the extent applicable, the Anker Terms of Service, General Terms and Conditions, Software Terms of Service; any addenda thereto or other applicable terms. Resolve disputes, carry out our obligations and enforce our rights, and protect our business interests and the interests and rights of third parties; Prevent, investigate or provide notice of fraud or unlawful or criminal activity; and Enable functions of our Sites or Applications, including creating profiles, using our online-shop and rating products. Display certain functionalities of our Sites or Apps in connection with third parties, such as the trusted shop banner, shipment tracking or product videos; Enable you to use certain functionalities of our products； Offer discounts to certain groups, such as students; Decide whether to enter into a business partnership, such as the affiliate program or the merchant program; Comply with legal obligations. You can find more information about how we Process your Personal Data in the table in Annex I. 5. Legal Basis for Processing The purposes for which we Process Personal Data, if you are Subject to the GDPR, and the legal bases on which we perform such Processing, are as follows: Perform our contractual services or prior to entering into a contract with you: If you order products or services from us or if you contact us to request our products or services, we use your Personal Data to provide you with these products or services, including for account and contract management, to facilitate user benefits and services, including customer support and process payment for our products and services or with information that may be relevant for you to decide on whether you want to order our products and services; Justified by our legitimate interests: The usage of your Personal Data may also be necessary for our own business interests. For example, we may use some of your Personal Data to update and monitor the services, or diagnose or fix technology problems; help maintain the safety, security and integrity of our property and services, technology assets and business; enforce our terms, resolve disputes, carry out our obligations and enforce our rights, and protect our business interests and the interests and rights of third parties; and prevent, investigate or provide notice of fraud or unlawful or criminal activity. Consent: In some cases, we may ask you to grant us separate consent to use your Personal Data. In this case, you can revoke your consent at any time with effect for the future. Compliance with legal obligations: We are obligated to collect or retain certain Personal Data because of legal requirements, for example, tax or commercial laws, or we may be required by law enforcement to provide Personal Data on request. You can find more information on the legal basis in the table in Annex I. 6. Disclosure of Personal Data We may also share, "
