full_description = "Ann’Art FactoryAtelier de Peinture décorative murs – meubles – boiseries et décoration d’intérieur dans l’ouest lyonnais Un travail dans les règles de l’art suppose un décapage complet, un démontage intégral et une préparation minutieuse des supports (avec parfois de la restauration). Ces étapes sont indispensables pour obtenir un beau rendu final, solide, durable. Mon travail est un peu plus que du « relooking ». Le décapage des supports est indispensable pour un travail effectué dans les règles de l’art. Cela assure la durabilité et la solidité de votre projet décoratif. Cela suppose de retirer les anciennes finitions (vernis, cire, peinture). Le bois est décapé puis poncé. Le meuble est entièrement démonté, les ferrures sont nettoyées. De multiples réparations sont également nécessaires (même si votre meuble vous paraît en bon état, les défauts apparaissent après le décapage). Ainsi préparé, le support est prêt pour la mise en peinture avec le projet décoratif de votre choix. TARIFS INDICATIFS (qui varient en fonction de l‘état du meuble, des réparations, de sa finition pour le décapage, de votre projet décoratif et de la mise en peinture intérieure ou non). A partir de 550 € (avec enlèvement et livraison + décapage et patine + matières premières) – temps de travail indicatif : 20h A partir de 750 € (avec enlèvement et livraison + décapage et patine + matières premières) – temps de travail indicatif : 30-35h A partir de 1250 € (avec enlèvement et livraison + décapage et patine + matières premières) – temps de travail indicatif : 45-50h A partir de 1500 € avec mise en peinture intérieure partie haute (avec enlèvement et livraison + décapage et patine + matières premières) – temps de travail indicatif : 50h et plus Sur devis uniquement après visite à domicile. Le tarif dépendra du nombre de portes, des caissons, des champs et des matériaux (bois, mélaminé) et des options choisies (mise en peinture des crédences, béton ciré sur les plans de travail…)."
