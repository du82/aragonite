["https://annartfactory.fr/2021/08"]
title = "août 2021 - Atelier Peinture décorative relooking meubles et boiseries peinture murale et décoration d'intérieur"
description = "Le stockage ou l’accès technique est strictement nécessaire dans la finalité d’intérêt légitime de permettre l’utilisation d’un service spécifique explicitement demandé par l’abonné ou l’utilisateur, ou dans le seul but d’effectuer la transmission d’une communication sur un réseau de communications électroniques."
full_description = "Publié le août 27, 2021septembre 13, 2024 par Rhea — Laisser un commentaireLe style pop et les meubles peints Pour préparer une rentrée colorée et funky j’ai décidé, en cette fin août, de vous présenter le style pop et les meubles peints. Pour relooker le bureau des enfants (ainsi, il travaillera forcément mieux à l’école…) ou créer chez soi un intérieur créatif et ludique, le style pop est tout indiqué ! Petit tour d’horizon de ce style déco… C’est parti. Un intérieur pop, chic et rouge Un intérieur pop ludique et multicolore Un intérieur pop en camaïeu de orange sur fond blanc Un intérieur style pop fun et girly Dans le style Pop, les espaces et les volumes sont ouverts, décloisonnés, souvent hauts de plafond, avec des mezzanines, des cuisines américaines. Dans ces espaces, on « vit au ras du sol » (les assises sont basses). Dans le cas de logements avec des petites pièces, on peut percer des ouvertures pour unifier l’espace.Les couleurs sont vives, saturées et souvent primaires (rouge, jaune, bleu), mises en valeur par des murs blancs et des sols clairs pour plus de contrastes. Elles peuvent également être secondaires, mais flashy et acidulées (vert pomme, rose, violet, turquoise, orange…).Les matériaux doivent s’inspirer des innovations design des années 1960-1970 avec le plastique (opaque ou translucide), le PVC, le simili cuir, le métal brillant et chromé. Les tapis à poils synthétiques épais sont également les bienvenus.C’est au niveau du mobilier et des accessoires que l’on peut vraiment imprimer un style très personnel. Ici on privilégie le flashy et le psychédélique avec du mobilier laqué, coloré ou à motifs géométriques, des canapés, fauteuils et poufs aux assises basses (rappelez vous, on « vit au ras du sol ») et aux formes arrondies, globulaires et ludiques (chaise Eggs ou Tulipe, tabouret Tam Tam). Les objets déco et les accessoires sont marqués par le Pop Art et les œuvres d’Andy Warhol et de Roy Lichtenstein, pour ne citer que les plus célèbres. Les objets déco comme les sculptures en plastique sont les bienvenus (inspiration de Niki de Saint Phalle par exemple).Enfin, en ce qui concerne l’éclairage, une fois n’est pas coutume, on peut se permettre l’éclairage entièrement artificiel, à grands renforts de néons, de lampes à bulles, de luminaires à poser (le must, la lampe Nesso orange) ou de gros lampadaires. Ainsi, contrairement aux autres styles déco que j’ai déjà abordés, même un intérieur très sombre supportera facilement une déco pop.Quelques objets indispensables et emblématiques du style pop inspirés de designers célèbres … Une chose est sûre, les années 1960-1970 sont LA référence ! Le fauteuil Egg La lampe Nesso La chaise Tulipe La chaise Vitra Le rangement Componibili Bibliothèque circulaire et modulable Luna Regardons maintenant ce que l’on peut réaliser sur nos meubles peints et relookés pour obtenir un style pop dans notre intérieur.Nous identifierons deux manières de travailler ici : soit par collage/transferts d’images soit en peinture en privilégiant les laques et peintures franchement brillantes. On peut également marier les deux techniques. Enfin, avis aux tapissières en herbe, jouer avec les tissus peut être ici une solution très pratique pour un très bel effet ! Enfilade vintage avec collage et peinture laquée noire Pour réaliser ce type de meuble facilement on se procure des posters ou des images transférables sur du bois (ou tout autre support d’ailleurs). De nombreux sites en propose (cf. Pinterest et Etsy). Il faut en effet éviter les images imprimées sur notre petites imprimantes de bureau dont les couleurs passeront dès les premiers soleils. On peut également les faire imprimer chez un imprimeur si on souhaite une grande taille. On utilise ensuite une colle spéciale qui permet de transférer l’image sur le bois ou bien on la colle comme un papier peint en évitant soigneusement les éventuelles bulles d’air. On applique ensuite un vernis brillant en plusieurs passes (3 c’est l’idéal). Les produits de transferts d’images sont de plus en plus populaires dans les magasins de bricolage ou ceux de loisirs créatifs. Cette technique est simple, peu couteuse et elle permet de relooker son meuble sans forcément être une pro de la peinture ! On évitera en revanche le décopatch, bien trop ethnique dans un style pop. Buffet Andy Warhol et Twiggy - Couleurs contrastées et rayures Petit buffet fuchsia et jaune avec transfert Roy Lichtenstein Pour réaliser ces petits meubles on choisit des couleurs complémentaire et des peintures brillantes. Les couleurs mates ou satinées renvoient bien moins la lumière et ici on souhaite au contraire des reflets qui claquent ! On peut également appliquer une laque brillante en finition (là aussi en plusieurs passes). Il n’y a pas de réelles difficultés, en revanche il faut veiller à égrainer à chaque couche. La moindre aspérité gâche l’aspect laqué que l’on souhaite obtenir. On évite absolument les effets vieillis, patinés, usés. Le bois brut est proscrit ! Si on souhaite une style plus sobre, on peut opter pour les formes géométriques et/ou psychédéliques. Dans ce cas on réalise les motifs grâce à du scotch de masquage : du Tesa, c’est le mieux, mais pour éviter les bavures, le top c’est le Frog (jaune ou vert). Pour les moins courageuses, les stickers décoratifs pour meubles sont parfaits. Enfin, pour des réalisations simples, on peut s’inspirer des motifs et des couleurs de Mondrian. Stickers décoratifs pour meubles Facile à reproduire, le style Mondrian Les meubles de récup’ inspirés des années 60 sont parfaits pour être relookés dans le style pop. En revanche de nombreux petits meubles de formes simples et sans cachet particulier pourront convenir. On peut également créer une enfilade avec des caissons de bois et des pieds inclinés (qui se trouvent maintenant sans problèmes dans les magasins de bricolage). Et puis on peut oser un style plus marqué avec les meubles et objets un brin baroque comme ci dessous… Il suffit ensuite d’accessoiriser ! Miroir baroque laqué blanc dans un intérieur pop Commode baroque laquée rouge et noire Pour terminer ce tour d’horizon des meubles relookés dans le style pop, il faut absolument présenter quelques fauteuils, très à la mode en ce moment (pour les tapissières, je l’ai dit plus haut). Le tissu permet une grande variété de motifs et d’images carrément pop ! Franchement design en rose et BD Baroque bleu turquoise et rose girly Pop et orange brillante... Ma préférée ! Vous l’aurez compris les fauteuils et chaises de style baroque ou de style Louis Philippe seront parfaits pour un relooking pop ! Alors chinez, choisissez bien vos couleurs et peignez !! A bientôt pour un prochain article et un prochain style. N’hésitez pas à liker, commenter, partager et abonnez vous à la newsletter. Catégorie : Uncategorized"
