["https://annartfactory.fr/2022/02"]
title = "février 2022 - Atelier Peinture décorative relooking meubles et boiseries peinture murale et décoration d'intérieur"
description = "Le stockage ou l’accès technique est strictement nécessaire dans la finalité d’intérêt légitime de permettre l’utilisation d’un service spécifique explicitement demandé par l’abonné ou l’utilisateur, ou dans le seul but d’effectuer la transmission d’une communication sur un réseau de communications électroniques."
full_description = "Publié le février 13, 2022septembre 13, 2024 par Rhea — Laisser un commentaireJacques Emile Ruhlmann – Décorateur et ensemblier Arts Déco Une fois n’est pas coutume, je laisse de côté ce mois-ci les meubles peints et la décoration d’intérieur, pour vous présenter un décorateur et ensemblier que j’affectionne particulièrement, pour son style art déco et ses créations de mobilier : Jacques Emile Ruhlmann. J’espère que vous serez séduits, comme moi, par son travail (très complet) et que vous ne regretterez pas les meubles peints. Vous retrouverez tous mes anciens articles sur le site. Comme pour mes précédents posts, je vous livre quelques mots clés si vous souhaitez, chez vous, vous inspirer de l’univers de ce designer encore tellement moderne et avant-gardiste : luxe, raffinement, rêve, art-déco, doré, contrastes, clair obscur, obscurité. En cadeau, en fin d’article, une planche déco qui vous montrera comment adapter (très modestement et avec des enseignes connues) le style Art Déco chez vous !Jacques Emile Ruhlmann, c’est parti !SON PARCOURS :Jacques Emile Ruhlmann est issu d’une famille de peintres industriels en bâtiment ; il est très tôt influencé par l’Art décoratif et après son service militaire il commence à dessiner ses propres meubles largement inspirés du XVIII° siècle. Il réalise un apprentissage chez un décorateur peintre, rencontre de nombreux architectes et prend goût au dessin. En 1907 il prend la direction de la société familiale et en 1919 il fonde la Société Ruhlmann et Laurent. Largement autodidacte, Ruhlmann devient peu à peu un acteur majeur du style Art Déco des années 1920-1930. Hôtel du collectionneur – Pavillon Ruhlmann – 1925SON APPROCHE : Pour Ruhlmann, la fabrication des meubles modernes doit être inspirée des œuvres du XVIII° siècle. Ses meubles aux formes modernes , épurées et élégantes, sont fabriqués par des artisans du Faubourg Saint Antoine. Si ses lignes sont sobres, ses matériaux sont en revanche luxueux (palissandre, acajou, amarante, ébène mais aussi nacre, peau de crocodile pour la marqueterie…). Ainsi il cherche en permanence le raffinement, ses finitions se veulent toujours impeccables et il séduit grâce à cela une clientèle aisée de banquiers, couturiers, industriels, écrivains et comédiens à la mode. Il est également influencé dans la conception de ses meubles par Joseph Hoffman, membre de la Sécession viennoise (retour à la ligne et à la clarté, utilisation de grandes surfaces lisses, lignes profilées et élancées). Il ne cherche pas seulement la fonctionnalité mais aussi la création d’un style. Il veut faire renaître la grande tradition française de création de style. Sa décoration d’intérieur constitue un écrin pour son mobilier (et ça, pour moi, c’est une merveilleuse inspiration qui guide mon métier !).Le pavillon du collectionneur – Décoration d’intérieur et mobilier par RuhlmannRuhlmann – Carnet de dessin Ruhlmann – Carnet de dessinSON INFLUENCE : Il sera très influent vis-à-vis des critiques et des médias et son audience lui permettra de connaître le succès. Son esthétique moderne et les formes élancées de ses meubles influencent fortement la décoration et le design d’intérieur. Il incarne l’Art Déco à la française des années 1920-1930. Il acquiert une célébrité internationale lors de la réalisation du pavillon « L’Hôtel du Collectionneur » à l’Exposition des Arts Décoratifs et Industriels de Paris en 1925. Ce qui fait alors son succès : sa décoration d’intérieur spectaculaire aux formes nouvelles qui met en valeur des meubles luxueux. Il revisite et modernise les décors classiques, il joue sur les contrastes entre les matières et les harmonies de couleurs. Il utilise les tons gris et argent, noir et or et parfois des couleurs plus chaudes (tonalités de terres naturelles) comme pour la Décoration du palais Laprade à l’exposition coloniale de 1931. Il remet à la mode des matériaux comme la peau de serpent (et la couleur verte), le galuchat, la nacre et l’ivoire. Il participe au Salon des Artistes Décorateurs de 1911 à 1933 (où il expose ses papiers peints), au Salon d’Automne de 1913 à 1932 (où il expose une salle à manger, des tissus, des papiers peints) et à de nombreuses expositions internationales. Il devient ainsi un designer à succès. Voici quelques unes de ses plus célèbres réalisations. Enjoy !Le Pavillon Ruhlmann ou « Hôtel du Collectionneur » décoré et aménagé pour l’exposition des Arts Décoratifs de 1925 compte parmi ses plus beaux ensembles. Il réalise ici une œuvre d’art totale en mêlant architecture, décor intérieur, mobilier, sculpture, peinture et objets d’art. Grand Salon – croquis de RuhlmannGrand Salon Boudoir – Croquis du RuhlmannBoudoir Salle à manger – Croquis de Ruhlmann Salle à mangerEntre 1927 et 1929 Ruhlmann, reçoit de prestigieuses commandes privées et s’occupe par exemple du design intérieur du Paquebot Ile de France mais également de la Chambre de Commerce de Paris. Salon de thé – Première classe – Paquebot Ile de France Fauteuils du salon de thé – Paquebot Ile de France – Frêne, bronze doré et veloursSalon de thé – Première classe – Paquebot Ile de France Vase éclairant – Céramique de Sèvres En 1931, Ruhlmann décore le salon ovale Paul Reynaud au Palais Laprade (palais de la Porte Dorée) pour l’exposition universelle et coloniale. Il utilise alors des matériaux précieux et exotiques pour apporter du prestige au lieu et mettre en valeur les produits rapportés des colonies. Salon ovale avec ses fauteuils « Eléphants » en maroquin brun et ébèneBureau en ébène de macassar, galuchat et ivoireSes croquis d’intérieur, riches et colorés nous permettent se saisir son style luxueux, avant-gardiste aux lignes sobres. Ruhlmann – Croquis salle à mangerRuhlmann – Croquis Hall de librairieRuhlmann – Croquis Boudoir de librairieRuhlmann – Croquis Chambre à coucherRuhlmann – Croquis Chambre à coucherRuhlmann – Croquis, détail, NicheRuhlmann – Croquis, détail BoudoirEnfin, quelques meubles phares sortis de son atelier d’ébénisterie Ruhlmann et Laurent. Le « Meuble au char » est sans doute le plus célèbre avec ses lignes épurées, ses matériaux précieux et son motif tout droit inspiré de l’art crétois. La Desserte dite « Meuble au char »- bois d’amarante, ébène d’Indonésie, marqueterie en ivoireCroquis annoté, motif de la femme au char – RuhlmannCe meuble imposant (109 x 225 cm) a été réalisé par Ruhlmann pour sa propre salle à manger puis décliné en 6 exemplaires. Il est composé d’ébène de macassar, d’ivoire et d’amarante. Le pied fuseau est la marque de fabrique de Ruhlmann, crée en 1913. Décentré ici pour apporter de la légèreté. Chiffonnier Cabanel – Chêne, ébène et ivoireCabinet « vide poche »Meuble triplanVoilà pour ce petit tour d’horizon d’un designer, ensemblier et artiste complet. J’espère que vous aurez été sensible à son style si moderne mais également à cette période si flamboyante et bien éloignée de nos décorations d’intérieur aseptisées et sans personnalité… Comme promis en introduction, une petite planche tendance pour trouver l’inspiration et faire entrer les arts déco chez soi. Un gros faible pour le vert et le doré pour moi ! A bientôt dans un prochain article ! Catégorie : Uncategorized"
