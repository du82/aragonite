title = "mai 2022 - Atelier Peinture décorative relooking meubles et boiseries peinture murale et décoration d'intérieur"
description = "Le stockage ou l’accès technique est strictement nécessaire dans la finalité d’intérêt légitime de permettre l’utilisation d’un service spécifique explicitement demandé par l’abonné ou l’utilisateur, ou dans le seul but d’effectuer la transmission d’une communication sur un réseau de communications électroniques."
full_description = "Publié le mai 3, 2022septembre 13, 2024 par Rhea — Laisser un commentaireLe style provençal et les meubles peints Avec l’arrivée du printemps, j’ai eu envie de vous présenter un style déco ensoleillé, chaleureux et lumineux qui j’espère, vous séduira… même si la tendance actuelle est au scandinave et au minimalisme ! Le style provençal qui évoque la chaleur du sud, la garrigue, les herbes aromatiques et les pierres sèches peut aisément se décliner dans nos intérieurs, à conditions, comme souvent, que notre logement présente déjà un certain cachet (ancienneté, aspect rustique, grandes pièces, hauteur sous plafond, poutres en bois, cheminée…). Peut être est-il judicieux de le mettre en œuvre dans une maison de campagne avec terrasse et jardin… On peut aussi apporter quelques touches sans adopter forcément le « total look ». Etudions ensemble les possibilités qui s’offrent à nous avec ce style décoratif puis intéresserons nous, ensuite, au mobilier, ses caractéristiques et sa mise en peinture. Comme pour mes précédents articles sur les thèmes déco, je vous propose une liste de mots clés auxquels se reporter pour garder notre ligne directrice : clarté, lumineux, soleil, authentique, floral, chaleur, naturel, élégant, raffiné, douceur de vivre, mas, bastide, pierres, bois massif et patiné…Salle à manger avec vaisselier vitré – style provençal Salon avec portes patinées – style provençalChambre avec murs à la chaux – style provençalDans le style provençal les espaces et les volumes donnent la place de choix au salon et à la salle à manger. Petits ou vastes, ces espaces constituent le cœur de la maison pour leur coté chaleureux et convivial. Ainsi, une disposition traditionnelle de l’espace est conservée ; l’aménagement supporte d’être assez dense. Le salon et la salle à manger peuvent, ou pas, être communicants. Les hauteurs sous plafonds restent toutefois importantes. Ce style s’adapte tout particulièrement dans les maisons de campagnes à l’aspect un peu rustique. Les couleurs se regroupent en trois grandes catégories, même si elles ne sont pas exclusives. Les ocres peuvent se décliner du jaune safran ou rouge orangé en passant par toutes les nuances de brun rouge. Elles rappellent la terre, les épices, la chaleur. Pour choisir nos couleurs, arpentons donc les sentiers des Ocres dans le Roussillon ! Même si c’est un peu « cliché », les bleus en camaïeu nous rappellerons ici la lavande, culture phare en Provence. Le bleu lavande pour les boiseries (volets, boiseries par exemple) reste un bon choix. Les tons verts (tendres ou foncés) évoqueront ici la couleur des oliviers. Le vert sauge est également prisé. Attention toutefois à la quantité de couleurs, et assurez vous de marier ces teintes avec des murs à la chaux blancs, beiges ou taupes. Enfin, le style provençal pourra s’accorder à toutes les couleurs surannées, empreintes de douceur et d’authenticité. Les matières valorisent le naturel comme le bois (vieilli ou peint c’est mieux), la pierre, la céramique, l’osier, le lin et la toile. Elles doivent rappeler la nature chaude et ensoleillé du sud de la France et rester élégantes. Au sol, les tomettes, les dallages en pierres naturelles et de tailles conviendront parfaitement. Aux murs, privilégiez les enduits à la chaux ou les boiseries peintes et patinées. Le mobilier et les accessoires doivent être soigneusement choisis (pour garder de l’unité) et l’intérieur ne doit pas avoir l’air trop encombré… même si le style provençal n’est pas minimaliste ! Les meubles se doivent d’être traditionnels et en bois massif, souvent avec des vitrages (armoires, buffets). Les grandes tables en bois agrémenteront une cuisine chaleureuse. Attention toutefois que ce mobilier ne soit pas trop lourd (un bureau aux pieds fins et galbés peut tout à fait convenir). Les rideaux en voilage délicat, les nappes en dentelles, les plaids en matières naturelles (lin, coton), des coussins aux couleurs naturelles ou pastel seront du plus bel effet (à motifs fleuris, à rayures). On peut également opter pour des plats et vases en bois ou en céramique, des paniers décoratifs en osier remplis de fruits. Aux murs, les miroirs stylisés en bois, les cadres avec natures mortes, scènes rurales ou motifs floraux complèteront aisément notre décoration provençale. Les plantes (lavande bien entendu) et les herbes (aromatiques surtout) sont les bienvenues. Les luminaires, comme les bougeoirs, les lampes d’appoint sur pieds (bois et tissus) et les lustres en fer forgé apporteront la clarté nécessaire. La lumière se doit d’être abondante et naturelle pour rappeler le climat largement ensoleillé de la Provence. Les grandes fenêtres et les baies vitrées sont indispensables. Avant de s’intéresser à la mise en peinture de nos meubles, faisons un petit descriptif de ce qu’est le « mobilier provençal ». La Provence a une typologie de meubles bien elle (panetière pour le pain, manjadou comme garde manger, escudelié pour les écuelles, estagné pour les faiences et les étains, verriau pour la verrerie). Les meubles provençaux étaient produits au départ à Arles puis dans la région du Gard et des Bouches du Rhône et vendus notamment à la foire de Beaucaire par les ébénistes. Ces meubles ont des caractéristiques communes comme l’emploi du style Rocaille (début période Louis XV), les formes galbées et les moulures, les pieds en escargot, l’utilisation de motifs floraux (acanthe), de rameaux d’olivier ou de laurier. Ils sont réalisés à partir de bois de qualité comme le noyer, le poirier, l’olivier ou le murier. Les ferrures sont en général richement ouvragées. Selon les périodes et les lieux, des formes variées se développent. Ainsi, le style de Fourques, plus sobre emploie les coquilles et des moulurations en corne de Bélier. Plus tard c’est le style Louis XVI plus sobre et rectiligne qui inspirera certains fustiers. Voici quelques exemples de meubles de tradition provençale. Commode tombeau Commode en arbalèteBuffet à glissant Buffet desserteVerriau Armoire de mariagePétrin et panetière Ces meubles peuvent paraître démodés et trop sombres, mais peints ou ramenés au bois naturel, ils donneront allure et cachet à notre intérieur. Commode tombeau peinte – ocre et vert pastel Armoire à motif peint – fond à la colle de peau et motifs à l’huile – Uzès Regardons maintenant ensemble ce qu’il est possible de réaliser sur nos meubles pour obtenir, chez soi, le style provençal. Bien entendu, si le meuble provençal n’est pas aisé à trouver, on pourra utiliser des meubles d’inspiration Louis XVI ou des meubles de facture rustique. Les couleurs qui conviendront ici sont les tons de beige, blanc cassé, taupe cités plus haut pour les murs mais également le trio des ocres, des bleus et des verts. Les finitions doivent être absolument mates (pas de vernis brillant) mais également patinées et usées. Les patines à superposition de couleurs seront du plus bel effet. Le motif peint a ici toute sa place, par exemple pour souligner les motifs végétaux réalisés par les ébénistes ou pour agrémenter les panneaux d’armoires (bouquets, grotesques…). Par tradition, les meubles provençaux étaient souvent peints (influence italienne), notamment dans la ville d’Uzès (voir ci-dessus). Armoire de mariage – camaïeu de bleus Armoire de mariage – Patine blanc casséeArmoire de mariage provençale Armoire de mariage provençale – inspiration pour la patineArmoire de mariage provençale – inspiration pour la patineSur cet exemple deux tons sont utilisés : un blanc cassé et un bleu clair rabattu. L’armoire est d’abord peinte entièrement en beige puis du bleu est passé par dessus sauf sur les moulures. Ensuite, en ponçant ou abimant le fond on retrouve la couleur blanc cassée du dessous voire le bois. Un patine au vernis ou à la cire teintée au pigment (une ocre) permet ensuite de salir le travail. Desserte patinée beige, blanc et taupe en superpositionBien plus Louis XVI que Louis XV mais provençal tout de même dans l’inspiration …Patine dans les tons ocres pour cette commode Vaisselier patiné bleu pale et ocreImpossible de traiter de ce style déco sans avoir abordé la cuisine… Alors, vous me direz, la cuisine provençale n’a plus forcément la côte depuis que nous voulons tous des intérieurs clairs, aseptisés et minimalistes… Et pourtant, il est possible de créer de belles réalisations et relativement modernes (quoique typées). Quelques visuels d’inspiration à reproduire chez soi…Bleu et beigeJauneBleu et ocre patinéeRouge et jauneAlors, avant de condamner définitivement vos « chapeaux de gendarmes », investissez dans une rénovation en affirmant un style bien à vous !! A bientôt pour un prochain article. Catégorie : Uncategorized"
