title = "Ann'Art Factory | Réalisations Murales à La Chaux | Tassin / Lyon"
description = "Le stockage ou l’accès technique est strictement nécessaire dans la finalité d’intérêt légitime de permettre l’utilisation d’un service spécifique explicitement demandé par l’abonné ou l’utilisateur, ou dans le seul but d’effectuer la transmission d’une communication sur un réseau de communications électroniques."
full_description = "Ann’Art FactoryAtelier de Peinture décorative murs – meubles – boiseries et décoration d’intérieur dans l’ouest lyonnais Retrouvez sur cette page toutes mes réalisations murales : les enduits traditionnels à la chaux (enduit bâtard et lichette de chaux), les chaulages, les badigeons, les eaux fortes et les patines à la chaux pour des murs rénovés et qui respirent. Les nombreux avantages de la chaux ne sont plus à démontrer ! Découvrez également les réalisations murales à la caséine avec des couleurs illimitées et sur mesure. Mise en œuvre d’un enduit chaux/sable sur trois murs dans une chambre livrée blanche d’un appartement neuf. La couleur a été obtenu avec un mélange de pigments et l’enduit a été texturé pour un aspect contemporain. Un glacis doré a été appliqué de façon aléatoire pour renforcer l’aspect chaleureux de la couleur. Le quatrième mur a reçu un enduit chaux sable puis un stuc gravé d’un sgraffito en roseaux. La couleur est ici un peu plus claire mais réalisée avec le même mélange de pigment. L‘aspect très lisse du stuc contraste avec l’enduit très texturé des trois autres murs. Rénovation et mise en peinture à la chaux et à la caséine d’une entrée et de deux couloirs d’accès qui desservent les différentes pièces de la maison. Les murs, anciennement jaunes et blanc cassé sont unifiés grâce à un badigeon teinté à la terre d’ombre naturelle d’Italie. En résulte des tons de nude tout en nuances et douceur. Les portes et encadrements ont été peints à la caséine teintée au même pigment mais deux tons plus clairs. Le contraste des murs un peu plus foncés et des portes et encadrements plus clairs apporte de la modernité. Enfin, les anciennes plinthes en carrelage, un peu datées ont été assorties à la résine. Un ensemble doux et chaud bien plus unifié. Rénovation et décoration des murs d’une chambre parentale en bleu pétrole et blanc. Le bleu a été mis au point grâce aux pigments oxyde bleu et noir d’ivoire. Pour le blanc il s’agit de caséine naturelle blanche. Le parti pris est de ne peindre que deux murs en bleu et de laisser les autres en blanc. Deux petites rayures verticales bleu souligne un renfoncement de la pièce."
