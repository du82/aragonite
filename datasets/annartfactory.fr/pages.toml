["https://annartfactory.fr/mes-services"]
title = "Ann'Art Factory | Peinture Mobilier et Peinture Murale | Lyon/Tassin"
description = "Découvrez mes prestations et tarifs en relooking de mobilier sur mesure et peintures murales à la chaux. Créations personnalisées et sur mesure."
full_description = "Ann’Art FactoryAtelier de Peinture décorative murs – meubles – boiseries et décoration d’intérieur dans l’ouest lyonnais L’atelier Ann’Art Factory, situé à Tassin la Demi Lune dans l’ouest lyonnais, vous propose de restaurer et peindre votre mobilier ou vos objets déco, anciens ou chinés en brocante. Les prestations sont réalisées en peinture naturelles, créées à l’atelier.Pour vos murs l’atelier vous propose des enduits et peintures à la chaux pour un intérieur unique et authentique. Nous définissons ensemble votre projet décoratif sur mesure (couleurs, patines, effets de matières et/ou croquis), je vous fais parvenir un devis gratuit. La plupart des meubles sont transportés à l’atelier pour être peints puis livrés une fois terminés. Dans le cas de très gros meubles, ou de boiseries, j’interviens à domicile. Les peintures et enduits à la chaux apportent authenticité et chaleur à votre décoration d’intérieur. Aussi je vous propose pour vos murs différents « laits de chaux » : chaulage, badigeon, eau forte et patine mais également des enduits fins et des stucs. J’utilise de la chaux aérienne en poudre entièrement naturelle et je peux adapter vos murs à la chaux si le support ne le permet pas (enduit d’interposition et lichette de chaux). A l’atelier je fabrique toutes mes peintures, enduits, vernis et cire de façon traditionnelle comme les faisaient les Anciens. Cela vous garantit un résultat durable, authentique et le moins polluant possible. La chaux par exemple, laisse respirer les murs. La patine sur meubles est celle qui se pratiquait en Europe depuis des siècles. La décoration d’intérieur se doit, aujourd’hui, d’être la plus écoresponsable possible et la tendance à la seconde main est de plus en plus en vogue. Aussi, je vous propose d’intégrer la mise en peinture de vos meubles à un projet global de décoration d’intérieur. Ensuite, les peintures murales à la chaux permettent de parfaire votre intérieur avec authenticité et chaleur. Je crée donc pour vous des projets déco alliant murs, meubles et accessoirisation. Je m’adapte en fonction de vos besoins (dessins côtés, plans, croquis et vues d’ambiance, planches déco)."
