title = "Ann'Art Factory | Espace Presse | Tassin/Lyon"
description = "La presse et les clients parlent de l'atelier Ann'Art Factory. Evènements et actualités : Foire De Lyon, JEMA, salons..."
full_description = "Ann’Art FactoryAtelier de Peinture décorative murs – meubles – boiseries et décoration d’intérieur dans l’ouest lyonnais J’ai choisi une formation initiale en histoire et patrimoine, portée par ma passion pour la marque du temps et les arts décoratifs. De mes études et de mes voyages, j’ai gardé l’amour des peintures murales de l’antiquité, la couleur de la pierre des châteaux médiévaux, les temperas de la Renaissance tout autant que la douce décrépitude des maisons coloniales cubaines aux couleurs pastel et surannées. Aussi, pour reproduire cette patine, je me suis formée à un métier d’art : la peinture sur mobilier et la peinture décorative en techniques traditionnelles. Ainsi je transforme vos meubles, vos murs et vos boiseries grâce aux méthodes ancestrales de la peinture (enduits et peintures à la chaux pour les murs, colle de peau et caséine pour les meubles et boiseries). J’ai forgé un style personnel empreint d’authenticité et marqué par l’histoire, l’amour du patrimoine, l’esprit brocante. Je peux aussi, en fonction des désirs de mes clients, donner un côté plus baroque à mes réalisations en mêlant couleurs vives et motifs, parfois en relief. Je joue alors avec la complémentarité des couleurs, les camaïeux, les différents types de contrastes colorés… et les mélanges de pigments. J’ai à cœur d’accompagner mes clients à chaque étape de la métamorphose de leur intérieur. Artisane coloriste et décoratrice d’intérieur, je peux mener des projets de décoration d’intérieur complets. Lorsque l’on me confit un meuble j’ai à cœur de réaliser un travail dans les règles de l’art, dans le respect du bois et du travail de l’ébéniste qui m’a précédée. J’affirme ma volonté de préserver les meubles anciens du remplacement systématique propre à notre époque, et je vais plus loin, créant mes peintures à partir de matières naturelles et appliquant les techniques de la peinture décorative du XVIIIe siècle (caséine, chaux, colle de peau de lapin)."
