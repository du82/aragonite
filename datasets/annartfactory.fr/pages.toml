["https://annartfactory.fr/2021/10"]
title = "octobre 2021 - Atelier Peinture décorative relooking meubles et boiseries peinture murale et décoration d'intérieur"
description = "Le stockage ou l’accès technique est strictement nécessaire dans la finalité d’intérêt légitime de permettre l’utilisation d’un service spécifique explicitement demandé par l’abonné ou l’utilisateur, ou dans le seul but d’effectuer la transmission d’une communication sur un réseau de communications électroniques."
full_description = "Publié le octobre 22, 2021septembre 13, 2024 par Rhea — Laisser un commentaireLe style baroque et les meubles peints Ce mois-ci, je vous propose de traiter d’un style qui me tient à cœur pour son originalité, ses couleurs tranchées, ses motifs et son ornementation souvent chargés, son côté « too much » : le style baroque. C’est un style d’antiquaire. Bien mis en œuvre sur nos meubles peints (et chinés correctement) ce style apporte une touche originale et singulière à notre intérieur. Et ici, nous aurons vraiment la possibilité de personnaliser au maximum nos créations tant il y a de possibilités. Il faudra faire toutefois attention de ne trop charger la décoration, notamment les accessoires, sous peine de sombrer dans un style kitch ou carrément gothique… Et mieux vaut privilégier quelques pièces de qualité plutôt que de nombreux accessoires à pas cher ! Commençons par un petit tour d’horizon des caractéristiques de ce style en décoration d’intérieur avant d’étudier en détail sa réalisation sur les meubles peints. Les mots-clés à suivre ici pour le style baroque : exubérant, étonnant, diversifié, coloré, dynamique, contrasté, brillant, glamour…Un salon baroqueUne salle de bain baroqueUne chambre baroqueDans une décoration baroque l’espace et les volumes, conservent une organisation traditionnelle des pièces, à destination identifiée : salon, salle à manger, entrée… De cette manière on obtient de petits espaces cosy et raffinés. Il est possible de réaliser une décoration baroque dans un « open space » mais attention, dans ce cas, on risque d’être franchement too much et TRÈS (trop ?) typé. Donc, évitons l’accumulation. En effet, nous ne possédons pas tous un château et dans une maison ou un appartement il vaut mieux rester sobre. Les murs peuvent être mis en avant grâce à des lambris à mis hauteur, des peintures sombres qui mettent en valeurs meubles et objets déco, des papiers peints à motifs ou figuratifs (paysage, reproduction d’œuvre d’art, animaux…).Au niveau des couleurs, on peut oser et le choix est immense ! Le noir, le blanc, le rouge, le violet, le bleu canard, le moutarde, le fuchsia, l’argenté, le doré conviennent parfaitement. Le tout, est d’arriver à créer de forts contrastes colorés, en couleur complémentaires par exemple. On peut par exemple utiliser des couleurs sombres ou très vives sur les murs pour mettre en avant le mobilier et les accessoires. Un seul mur ou un pan de mur peut être coloré. Les tons tranchés conviennent bien dans le style baroque. Le noir et le blanc avec une touche argentée ou dorée seront du plus bel effet.En ce qui concerne les matières, le velours aura une grande importance, pour les canapés, les rideaux, les coussins tandis que le bois peint et laqué (meubles et/ou lambris) apportera la touche baroque que l’on souhaite obtenir (nous y revenons dans quelques lignes). Le métal et le verre ont leur place pour apporter un esprit plus contemporain. Enfin, certaines peaux de bêtes (en synthétique bien entendu) peuvent trouver leur place, à condition d’éviter le « léopard » (résolument too much ici et trop vu et revu) et de privilégier le noir ou le blanc.Pour le mobilier et les accessoires, votre antiquaire est ici votre meilleur ami ! C’est grâce à de jolies pièces chinées que l’on obtiendra un style baroque authentique et que l’on évitera le style baroque cheap ! Bien entendu, si c’est hors de prix on chinera soit même on restaurera ! Les assises confortables et capitonnées (canapés, fauteuils, poufs) seront privilégiées et peuvent être déclinées en de nombreuses couleurs. Les consoles, les commodes en tombeaux, les grands miroirs ouvragés et stylisés, les cadres, les luminaires à pampilles de cristal, les chandeliers et les vases anciens permettront la mise en œuvre du style baroque. Attention toutefois, pas d’accumulation… On privilégie quelques pièces de qualité mais pas trop et on assortis correctement.Enfin, le style baroque peut s’accommoder sans peine d’un faible éclairage, La faible clarté peut même apporter un coté mystérieux qui correspond bien à l’ambiance baroque. Des lampes d’appoint à poser et des lustres imposants viendront apporter la lumière artificielle. Si l’on dispose d’une vaste pièce bien éclairée, l’aspect sera simplement plus contemporain.Venons-en maintenant à nos meubles peints. Quels types de meubles peuvent être chinés et peints ? Voici une petite sélection de ce que l’on peut acquérir.Commode de style baroque.Ce style de commode (en tombeau ou en arbalète) est parfait pour créer un intérieur baroque chez soi. Attention toutefois, ce type de meuble reste assez cher et nombreux sont ceux qui pensent que peindre un tel meuble est un sacrilège. Il me semble au contraire, que dans une époque où l’on se débarrasse souvent des meubles anciens et démodés, c’est une solution durable, responsable et originale.Si cet achat est trop onéreux, des commodes bien plus récentes sont en vente très régulièrement sur les sites de biens d’occasion. C’est le cas ci-dessous.Chevets d’inspiration baroquePetite commode d’inspiration baroqueLes meubles de style Louis XV (dont tout le monde, ou presque, souhaite se débarrasser) conviennent également bien pour mettre en œuvre le style baroque. C’est le cas ci-dessous.Petite console ouvragée de style Louis XVConsole de style Louis XVTable basse de style Louis XVChevets style Louis XV qui peuvent être détournés en bout de canapésFauteuil style cabriolet Louis XVOn a donc beaucoup de choix et certaines de ces occasions ne coûtent vraiment rien sur le Bon Coin, Ebay ou dans les vide-maisons et vide-greniers.Regardons maintenant quelles couleurs et quelles finitions privilégier pour mettre en œuvre le style baroque sur nos meubles peints remis au goût du jour.Les couleurs vives citées précédemment (violet, rouge, bleu canard, moutarde) ainsi que le noir, blanc, argenté et doré seront à privilégier. Les vernis brillants et laqués peuvent être utilisés sans modération. Attention toutefois de bien choisir les vernis dans les magasins de bricolage, de poncer systématiquement le support entre chaque couche et d’éviter toute poussière au moment de la réalisation. L’alternance de vernis mat et brillant est également une bonne solution. Les motifs peuvent être obtenus grâce à un large choix de pochoirs à motifs baroques vendus dans le commerce. Les rayures apportent la touche chic ; attention au choix du scotch de masquage, dans ce cas, pour éviter les bavures. Si on met en œuvre un meuble à motifs et rayures, dans ce cas on opte pour un revêtement de mur unis. En revanche dans le cas d’un meuble peint de couleur unie, on peut créer un contraste avec un papier peint à motifs. Enfin, les ferrures des meubles peuvent être conservées et peintes : pour plus de facilité, optez pour une impression pour métaux et une peinture en bombe par la suite. Sinon, un très grand choix de poignées et de boutons de portes pourront être assortis avec votre meuble peint.Voici quelques exemples… Commençons par du « soft » …Console baroque noire et liseré doréConsole baroque laqué blancFauteuil style Louis XV – Peinture argent et tissu velours noirsCommode baroque laquée rougeChevet style Louis XV rayures argent et blanc – Finition brillanteEt puis, si comme moi, vous aimez l’originalité, les motifs et un style qui sort de l’ordinaire, on peut aller plus loin… bien plus loin ! Dans ce cas, on s’arme de patience pour venir à bout de notre meuble peint… Et surtout, si on part sur un projet décoratif très chargé, les murs doivent être de couleurs unis et on utilise ensuite peu d’accessoires.Commode baroque motifs losanges blancs et noirs – ferrures argentéesMotifs zèbreEt quelques créatrices que j’aime bien… Et qui réalisent des meubles peints magnifiques et originaux ! Pour vous inspirer, n’hésitez pas à les suivre sur Instagram !Motifs – rayures – vernis matNoir et léopard (juste une touche…)Motifs, rayures et transferts – moulures doréesPour les fauteuils, voici ce que l’ont peut réaliser si on veut une touche baroque plus marquée…Noir et violet – Franchement baroqueTissu zébré et peinture argentéeEt enfin les miroirs. Ils apporteront une touche résolument baroque à votre intérieur.Miroir encadrement ouvragé doréEn turquoiseEn fuchsiaEt en noir…Vous l’aurez compris, avec le style baroque, on peut vraiment créer du mobilier sur mesure, au gré de nos envies et mettre en œuvre une décoration originale et personnalisée.A bientôt pour un prochain style. N’hésitez pas à lire les autres articles pour découvrir toutes les possibilités de mobilier peint qui s’offrent à vous. Catégorie : Uncategorized"
