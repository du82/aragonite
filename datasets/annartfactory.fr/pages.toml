title = "mars 2022 - Atelier Peinture décorative relooking meubles et boiseries peinture murale et décoration d'intérieur"
description = "Le stockage ou l’accès technique est strictement nécessaire dans la finalité d’intérêt légitime de permettre l’utilisation d’un service spécifique explicitement demandé par l’abonné ou l’utilisateur, ou dans le seul but d’effectuer la transmission d’une communication sur un réseau de communications électroniques."
full_description = "Publié le mars 15, 2022septembre 13, 2024 par Rhea — Laisser un commentaireLe rouge pompéien en décoration et en peinture sur mobilier Ce mois-ci j’ai décidé de vous présenter une couleur que j’affectionne particulièrement, tant pour sa vibrance et sa saturation que pour son symbolisme historique : le rouge « pompéien ». Passionnée d’histoire romaine et notamment de celle de la vie quotidienne, de la domus et de l’urbs, je voudrais vous faire partager un peu de l’émerveillement que je ressens à chaque fois que j’admire l’intérieur d’une maison romaine reconstituée ou photographiée dans les catalogues des musées nationaux. Certes, il faut parfois beaucoup d’imagination tant la marque du temps et les dégradations sont importantes, mais en fermant les yeux un instant, on y parvient. Nous commencerons par un bref rappel historique pour nous pencher ensuite sur l’utilisation que nous pourrons faire, en peinture sur mobilier et en décoration, de ce fameux rouge de Pompéi et de toutes ses déclinaisons. Parvenu à la même notoriété que le « rouge cerise », le « vert billard », le « gris fumée », le « terracotta », le « vert cèdre », je passerai ici volontairement sous silence l’action nocive du Vésuve qui pourrait avoir transformé de l’ocre jaune… en rouge cramoisi … Je préfère rêver en rouge ! Sans compter que le rouge de Pompéi incarne aujourd’hui à lui seul la peinture pariétale romaine. Bref rappel historique Dès le milieu du XVIII° les premiers archéologues à fouiller le site de Pompéi ont été frappés par la décoration des pièces mais également par l’omniprésence d’une couleur rouge éclatante. Cette teinte a été baptisée « rouge pompéien » même si elle était utilisée ailleurs dans l’empire. Pour les Romains, le rouge est la couleur par excellence, celle de la beauté, de l’apparat et du pouvoir (l’empereur ne se teignait il pas le visage en rouge lors des Triomphes ?). Ce rouge provient du minerai de cinabre (sulfure de mercure rouge), finement broyé et que les Romains appelaient « minium ». Il était extrait en Espagne, traité à Rome et d’un coup très élevé. Broyé et mélangé à un liant il donnait des rouges orangés, des nuances cannelles et briques, des cramoisis, des pourpres (ce qui sera intéressant pour nous en déco). A Pompéi il était appliqué sur les fonds alors qu’en général de l’ocre rouge était d’usage car quinze fois moins couteuse. Cela dénote de la richesse des propriétaires des maisons pompéiennes. Les fresques de Pompéi étaient réalisées sur un mortier frais ; c’est la réaction de l’air et de la chaux éteinte du mortier qui permettait de fixer les couleurs. Fresque des mystères dionysiaques - Villa des Mystères - Pompéi Jeune femme se coiffant - Villa des Mystères - Pompéi Amours dans des scènes de la vie quotidienne -Villa des Vetii - Pompéi Fresque des Augustaux - Lutte d'Hercule et Achéloos - Herculanum Fresque du caldarium de la villa de Poppée - Oplontis Fresque du triclinium de la villa de Poppée - Oplontis Alors, me direz vous, c’est bien ancien tout ça ! Et comment appliquer de tels décors à nos meubles ou à notre intérieur ? Regardez les reconstitutions ci dessous : en premier le décor de la « salle à manger » de la villa de Poppée à Oplontis et ensuite celui du péristyle de la villa de Diomède à Pompéi. Reconstitution de la fresque du triclinium de la villa de Poppée - Oplontis Reconstitution du décor peint du péristyle de la villa de Diomède - Pompéi Lorsque le décor mural est ainsi scandé (panneaux de différentes couleurs alternant blanc, rouge et doré) il apporte beaucoup de modernité. Alors comment meubler ou aménager son intérieur avec le rouge pompéien ?Le rouge pompéien (dans toutes ses nuances, du brun à l’écarlate, en passant par les rouges orangés) est de plus en plus utilisé pour peindre les murs de la maison, en tissus d’ameublement ou comme couleur sur les meubles. La saturation si importante de cette teinte rend son utilisation toutefois délicate. Par exemple en mural on pourra alterner deux teintes : rouge et blanc, rouge et beige, rouge et marron , rouge et gris. L’ambiance sera alors différente. Un seul mur peint permet d’attirer l’attention sur un point précis de la pièce (une entrée, un angle mort, un couloir voire un coin salon). Dans la cuisine, un mur ou des éléments de décoration rouge pompéien seront modernes, mariés à du blanc, tandis que dans la salle de bain les tomettes rouge brique apporteront douceur et chaleur. En revanche, dans les chambres cette nuance sera parfois déconseillée… si l’on souhaite se reposer. Il faudra toujours avoir à l’esprit que c’est une couleur qui aura un impact fort dans la décoration, qui attirera l’attention avec une symbolique lourde (amour, passion) et une tendance néoclassique affirmée. Carrelage en damiers rouges bruns- Cuisine Le rouge en mural dans une cuisine Le rouge dans une entrée Le rouge dans un couloir Le rouge dans une chambre à coucher Tomettes ocre rouge dans une salle de bain Si l’on souhaite rester plus « soft » on peut également opter pour des touches de rouge dans son intérieur. Dans ce cas on privilégie coussins, plaids, tapis, objets décoratifs (cadres, vases, bougeoirs…). Qu’en est t’il maintenant de notre mobilier ? Comment le revaloriser en rouge ? Quels pigments utiliser ? Comment intégrer ce mobilier rouge dans notre intérieur ? Pour créer un joli « rouge pompéien » on peut tout d’abord utiliser le même pigment que les Romains dans l’antiquité. En effet le rouge cinabre se trouve facilement. On peut également employer le « Sinope » (aujourd’hui oublié) c’est à dire les terres et ocres rouges naturelles. Elles sont nombreuses à la vente. Ensuite, on pourra se servir des pigments « rouge Herculanum », « terre de Pouzzoles », « rouge de Vérone », « Rouge vénitien », « rouge bohème », « rouge anglais » qui nous apporteront toutes les nuances du rouge pompéien (évoquées plus haut). La liste n’est pas du tout exhaustive, ce ne sont que quelques pistes. Il faut toutefois obtenir une teinte soutenue, chaude et intense. Et une patine salie (au vernis, à la cire, à l’encaustique) sera du plus bel effet ! Le rouge supporte également très bien les finitions vernies brillantes ou laquées. Voici quelques exemples de meubles rouges (inspiration de Pinterest) que nous pouvons insérer facilement dans notre intérieur. Dans ce cas, on peut privilégier des murs blancs et des objets déco aux teintes sobres (beige, noir, blanc). Ce qui est intéressant avec cette teinte rouge si facilement déclinable, c’est qu’elle s’adapte à de nombreux styles de déco (baroque, campagne, classique, ethnique…). Il suffit d’accentuer l’ocre rouge pour amener à un style campagne ou appuyer le rouge profond (tendance « bigarreau ») pour donner un style baroque ou classique. Console bombée - rouge vieilli mat Commode baroque - rouge laqué Petit meuble d'appoint à tiroir - rouge soutenu brillant Meuble de métier - rouge soutenu brillant Buffet vaisselier deux corps - rouge brun mat Buffet deux corps rouge et cire teintée noire Meuble d'appoint à tiroir - ocre rouge - effet usé Voilà pour ce petit tour d’horizon (sans prétention) du « rouge pompéien » et de ses utilisations en décoration et en peinture sur mobilier. N’hésitez pas à me solliciter si vous souhaitez plus de précisions. Et n’oubliez pas, peut être qu’en fait il s’agissait d’ocre jaune… A bientôt dans un prochain article. Catégorie : Uncategorized"
