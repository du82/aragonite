full_description = "Ann’Art FactoryAtelier de Peinture décorative murs – meubles – boiseries et décoration d’intérieur dans l’ouest lyonnais L’atelier de peinture décorative Ann’Art Factory, situé à Tassin la Demi Lune dans l’ouest lyonnais, peint vos murs, vos meubles et vos boiseries dans un projet global de décoration d’intérieur. Les techniques traditionnelles utilisées vous garantissent un résultat authentique, durable et entièrement sur mesure. Découvrez les possibilités infinies qui s’offrent à vous en peintures et patines anciennes pour le relooking de vos meubles et la décoration de vos murs à la chaux. Travail réalisé dans les règles de l’art. Passionnée de décoration, de peinture, de mobilier ancien et d’art j’ai décidé de faire de ma passion un métier. Ma formation initiale en histoire de l’art et patrimoine m’a apporté une solide base de connaissances à exploiter dans ce domaine. Je vous propose désormais mes services pour restaurer et patiner vos meubles mais également vos murs et créer un intérieur harmonieux. Décoratrice d’intérieur, je crée également pour vous des projets déco complets incluant plans, coupes, vues d’ambiance et planches déco. Je suis également convaincue que nous devons modifier nos modes de consommation. Restaurer et patiner des meubles anciens et en faire des pièces uniques et à votre image est, pour moi, une bonne façon de respecter davantage notre environnement. Les enduits à la chaux traditionnels que je vous propose pour vos murs découlent de la même volonté de préserver la nature avec des techniques ancestrales et non polluantes. Ainsi j’utilise des peintures naturelles, fabriquées par mes soins, à faible impact sur l’environnement, ainsi que des patines traditionnelles à la chaux, caséine et colle de peau. Revenir aux techniques picturales des Anciens me passionne. N’hésitez pas à me contacter en cas de besoin ou si vous avez des questions, je serai ravie de vous aider."
