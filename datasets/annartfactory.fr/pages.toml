full_description = "Ann’Art FactoryAtelier de Peinture décorative murs – meubles – boiseries et décoration d’intérieur dans l’ouest lyonnais En accompagnement de votre mobilier peint je peux mettre au point un accompagnement déco sous forme de planches déco ou planches shopping. Grâce à ces deux planches, je vous donne une idées des ambiances possibles autour de votre mobilier. Les accessoires, les luminaires, les couleurs, les matériaux et éventuellement le petit mobilier complémentaire ne sont pas définitifs, ce sont des propositions pour vous projeter. Des visuels et des mots clefs apporteront un éclairage à l’ensemble. Prestations déco et tarifs (à mettre dans la nouvelle section comme indiqué ci-dessus à la suite de l’intro) – phase esquisse – Réalisation de deux planches matériaux, couleurs, accessoires, luminaires, petit mobilier de deux styles différents. Grâce à ces deux planches de style différent, je vous donne une idées des ambiances possibles autour de votre mobilier en terme de matériaux, couleurs, accessoires, luminaires… Un tableau liste toutes les références (prix, dimensions, fournisseurs, lieux d’achat) pour que vous puissiez effectuer vos achats seuls, en boutique ou sur internet. – phase APS – Réalisation de deux planches matériaux, couleurs, accessoires, luminaires, petits mobiliers de deux styles différents ainsi qu’un croquis d’ambiance Grâce à ces deux planches, de style différent, je vous donne une idées des ambiances possibles autour de votre mobilier en terme de matériaux, couleurs, accessoires, luminaires. Un tableau liste toutes les références (prix, dimensions, fournisseurs, lieux d’achat) pour que vous puissiez effectuer vos achats seuls, en boutique ou sur internet. Le croquis couleur vous permettra de vous projeter dans votre futur intérieur. Je peux également mettre en œuvre des projets déco plus vastes. Dans ce cas les prestations s’effectuent sur devis. En revanche vous trouverez ci-dessous les différentes prestations pour un espace à aménager de – de 40 m²."
