full_description = '''Ann’Art FactoryAtelier de Peinture décorative murs – meubles – boiseries et décoration d’intérieur dans l’ouest lyonnais A l’Atelier, je fabrique toutes mes peintures à base de caséine,chaux, colle de peau, œuf. Je les teinte ensuite avec des pigments naturels, seuls ou mélangés. Je fabrique également tous mes produits d’apprêt et de finition : gomme laque, cire naturelle bio, encaustique, vernis dammar… Je possède donc, comme une sorcière, mon grimoire, livre de recettes magiques de la peinture naturelle… Je crée alors des couleurs et des patines authentiques, uniques et personnalisées. Parce que recréer la marque du temps sur un meuble (ou tout objet déco) est devenu, pour moi, une passion. ​ Cela vous offre un choix infini de couleurs, d’effets, de matières et de patines pour votre projet décoratif. A l’Atelier je vous propose également des nuanciers ainsi qu’un vaste choix de couleurs. Des échantillons permettent enfin de vous faire une idée des patines et couleurs proposées. Toutes les nuances couleurs des nuanciers peuvent être adaptées en peinture murale à la chaux et en caséine murale. Ainsi il est possible d’assortir meubles, murs et boiseries pour un ensemble cohérent et harmonieux. var gCaptchaSibWidget; var onloadSibCallbackInvisible = function () { var element = document.getElementsByClassName('sib-default-btn'); var countInvisible = 0; var indexArray = []; jQuery('.sib-default-btn').each(function (index, el) { if ((jQuery(el).attr('id') == "invisible")) { indexArray[countInvisible] = index; countInvisible++ } }); jQuery('.invi-recaptcha').each(function (index, el) { grecaptcha.render(element[indexArray[index]], { 'sitekey': jQuery(el).attr('data-sitekey'), 'callback': sibVerifyCallback, }); }); };'''
