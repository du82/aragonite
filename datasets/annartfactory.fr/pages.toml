full_description = '''Publié le juillet 21, 2021septembre 13, 2024 par Rhea — Laisser un commentaireLe style scandinave et les meubles peints Contrairement aux styles « Campagne chic » et « ethnique » vus précédemment, le style scandinave n’est pas le plus adapté à des meubles peints (en tous cas avec des couleurs vives). En revanche, vu l’omniprésence du bois dans ce style décoratif, nous pouvons aborder ici les techniques de finitions sur bois brut, les meubles peints en blanc et surtout la tendance « Scandicraft », bien plus intéressante que le style IKEA !Petite présentation du style scandinave…Comme pour mes précédents articles je vais commencer par lister les mots clés de la décoration scandinave qui nous permettent de conserver un fil directeur dans notre déco. Ici nous retiendrons « sobre, fonctionnel, élégant, clarté, lumineux, légèreté, naturel, ordre, rangement ». Stule scandinave épuré et contemporain Style scandinave cosy et chaleureux Les espaces et les volumes sont vastes et épurés. La circulation est fluide entre des espaces sans cloisonnement ni séparation (un vaste espace cuisine/salon/salle à manger par exemple sans seuil au sol). En clair, il y a de la place et peu de meubles.Les couleurs sont naturelles avec beaucoup de blanc (murs et plafonds) et la couleur naturelle du bois clair (chêne, hêtre clair, boulot, pin…). Les coloris s’organisent en camaïeux de beiges, gris clairs voire taupe ou ocre. Quelques touches de noir sont possibles.En ce qui concerne les matières, c’est le bois qui domine ! Il est partout… Sur le mobilier certes, mais aussi au sol avec des parquets, en cloison, en lambris, en placage aux murs, en poutres au plafond… Parallèlement des matières naturelles se rajoutent : des tissus pour les canapés, plaids, coussins, de la poterie (blanche et émaillée notamment), des fourrures pour réchauffer l’atmosphère.Un mot d’ordre pour le mobilier et les accessoires : la fonctionnalité ! Le mobilier (bois clair surtout) est marqué par des lignes sobres, il doit être vaste pour faciliter le rangement. On peut même essayer de chiner une création d’un célèbre designer scandinave (Alvar Aalto pour ne citer que lui). Les accessoires, aux couleurs claires et naturelles, restent peu nombreux pour ne pas gêner les circulations : coussins, plaids, tapis à motifs, quelques plantes vertes.En ce qui concerne la lumière, l’éclairage naturel est primordial avec de larges ouvertures en baies vitrées par exemple. Les voilages et rideaux sont ici superflus. Des luminaires d’appoint s’ajoutent notamment avec des lustres en matériaux clairs, quelques appliques. Un intérieur "scandicraft" - Récup', artisanat et matières naturelles Je ne suis pas là pour donner mon avis mais la décoration scandinave me semble souffrir de sa trop grande diffusion (coucou IKEA…). Elle est trop vue et revue… aussi, aujourd’hui se modifie-t-elle avec des tendances nouvelles : « Japandi » ou « scandicraft ». Et c’est cette dernière que je vais vous présenter rapidement ici (car elle nous intéresse pour notre mobilier relooké).Le scandicraft (craft= artisanat) permet de créer un mix entre meubles/objets d’inspiration scandinave et pièces artisanales chinées en brocante par exemple. Cela ramène un peu de vie dans notre intérieur, cela réchauffe, dynamise, tout en racontant une histoire. Ici on mise sur l’authenticité, le mélange de genres, de styles et de matières. Ce qui est intéressant ici, c’est également la dimension responsable (très chère à mon Atelier de peinture sur mobilier) puisque l’on chine du mobilier et des objets déco originaux que l’on retape et rénove. Et là, de nombreux matériaux s’adaptent à cette tendance scandicraft : le cannage, le rotin, la paille, la terre cuite… en mobilier, luminaires, panières, tapis, tableaux, miroirs… En bref, on apporte une touche gypsy récup’ au style scandinave ! On peut même s’inspirer du style ethnique (voir mon article sur le sujet) mais sans les couleurs trop vives. Un intérieur "scandicraft" - Bois, récup' et camaïeux de beiges On réchauffe notre intérieur avec des teintes plus chaudes, des plantes vertes, du macramé… Un espace "scandicraft" vintage Maintenant que la présentation est faite, passons à nos meubles pour mettre en œuvre le style scandinave ou scandicraft dans notre intérieur. Pièces à chiner… enfilade, buffet, secrétaire… à pieds compas et vintage (années 50). Ils seront parfaits pour le style scandinave. Ici tour d’horizon des meubles d’occasion trouvé dans des dépôts vente, sur Le Bon Coin et dans des ressourceries. Pour préparer notre meuble, on ponce le bois à blanc (c’est à dire jusqu’à retrouver la couleur initiale du bois). On ne pourra garder aucune ancienne finitions dessus. C’est un travail fastidieux mais nécessaire. Ainsi on décire un meuble ciré, on décape un meuble peint ou vernis. Le ponçage (avec un grain de plus en plus fin) est obligatoire pour terminer de préparer le support. Ensuite, un produit appelé « fond dur » permettra de donner un aspect plus noble au bois que l’on souhaite garder brut. Donc DÉCAPAGE + PONÇAGE + FOND DUR. Voilà la base.Les finitions sont peu nombreuses et simples (attention, la cire, l’encaustique ou le vernis fonceront votre bois).1- La finition cirée : La cire naturelle donnera toujours un très bel aspect à votre bois tout en le protégeant. Elle peut être lustrée après séchage si vous souhaitez un aspect légèrement brillant ou non lustrée pour un aspect mat. L’encaustique peut remplacer la cire mais elle fonce davantage le bois brut.2- La finition vernie : Elle assure également une bonne protection des meubles. Choisissez un vernis mat ou satin de préférence mais pas de vernis brillant qui rappellerait davantage le style montagne. Deux couches de vernis polyuréthane (à l’eau) seront nécessaires pour une bonne protection.3 – La finition peinte : ici le blanc sera la couleur phare mais certaines couleurs plus vives pourront avoir leur place (jaune citron, vert pomme…) et donneront une petite touche acidulée. la couleur devra être posé en aplat bien lisse (pas de finition usée). Dans le cas de meubles plaqués ou en mélaminé n’oubliez pas le primaire d’accroche spécial au risque que la peinture n’adhère pas correctement. Et un léger ponçage grain fin au préalable pour griffer le support et favoriser une meilleure accroche. La finition peinte peut s’accompagner de tissus ou papier peints (en façades, à l’intérieur). Les poignées des meubles peuvent être changées (optez pour des poignées différentes pour une touche décalée). Enfin, sachez que l’on peut rajouter des pieds aux meubles pour leur donner le fameux look scandinave (pieds compas en bois ou métal dans les boutiques de bricolage – on en trouve en métal ou bois et les formes sont très variées).Voici quelques visuels qui peuvent nous guider dans le cas de meubles peints. Enfilade deux portes et tiroirs - bois clair et pochoirs blancs style tapisserie Enfilade bois et blanc (tiroirs et pieds compas) Buffet pieds compas jaune et noir Buffet année 50 pieds compas bleu et intérieur tapissé Buffet bas graphique bois, gris, blanc Qu’en est-il maintenant de la tendance scandicraft ? Encore quelques exemples pour vous montrer que l’on peut adoucir un peu la tendance scandinave si on la trouve froide et impersonnelle. On peut notamment ajouter du cannage sur les portes ou les tiroirs de nos meubles. Buffet bois et portes en cannage Buffet bois brut avec tiroirs et poignées dépareillés L'éternel buffet parisien peut également s'insérer dans notre déco scandicraft Dans le style scandicraft la tendance est donc à la récup’ et au recyclage. alors pensez également aux palettes ou aux caisses en bois qui offrent des possibilités immenses. Table en bois recyclé Cloison / étagère en caisses à pommes Cet article est terminé, j’espère qu’il vous aura plu. N’hésitez pas à liker, partager, me faire part de vos commentaires et abonnez vous à la newsletter. A bientôt. Catégorie : Uncategorized'''
