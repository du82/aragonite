full_description = "Publié le janvier 25, 2022septembre 13, 2024 par Rhea — Laisser un commentaireLe style loft et les meubles peints Pour cette rentrée 2022, je vous propose d’étudier ensemble un style prisé et populaire (trop ?) depuis plusieurs années : le style loft (ou style indus). Si les pages de magazines nous proposent des lofts absolument magnifiques, il est difficile, pour nous de mettre en œuvre cette déco de façon efficace si l’on ne possède pas déjà un intérieur plein de caractère… et dans ce cas, le risque est d’avoir un style loft de pacotille ! Comme pour mes précédents articles, je vous propose de faire un tour d’horizon rapide des caractéristiques de cette esthétique pour nous intéresser ensuite à notre mobilier (peint ou pas, récupéré, transformé…). Citons enfin nos mots clés pour ne pas dévier de notre « intention industrielle loft ». Ici nous retiendrons : minimaliste, épuré, ouvert, lumineux, industriel, vintage, authentique, usine, grand, espace. Bonne lecture. Une salle à manger style loft Un salon style loft Ce qui permet de mettre en œuvre chez soi un style loft authentique c’est l’espace. C’est en ce sens qu’il est compliqué de créer une atmosphère indue dans une pièce traditionnelle avec 2.4 m de hauteur de plafond… En effet les volumes doivent être vastes, communicants, lumineux et ouverts avec une hauteur sous plafond élevée. La circulation doit être fluide. Les mezzanines seront alors prisées et peut-être la solution pour élever les plafonds pour tous ceux qui ne possèdent pas un ancien plateau industriel dans une usine réhabilitée ! Gardons à l’esprit toutefois que pour réussir ce type de déco, notre intérieur doit déjà disposer d’un certain cachet ! Mezzanine, plafonds élevés, verrière Les couleurs dominantes sont le rouge vieilli et le blanc des parements muraux en briques mais également le noir du métal, les teintes marron du bois (mobilier et parquet) et du cuir. Les camaïeux de gris sont également les bienvenus avec par exemple un béton ciré au sol voire sur certains murs. Certains tapis plus colorés peuvent venir compléter ces teintes, à conditions que ce soit des couleurs cassées, rabattues. On évitera ici les couleurs trop vives ou alors par simples touches (jaune, rouge par exemple qui rappelle le monde industriel).Les matières seront principalement le bois, le métal, le cuir et les tissus bruts naturels (tapis, coussin, plaids en lin, laine grossière ou toile de jute). L’emploi du métal et du bois rappelle le monde industriel du XIX° et du début du XX°. L’inspiration, c’est l’âge des manufactures ! Alors inutile de chercher des matières douces, travaillées, polies. On veut du brut, de l’industrieux !Le mobilier et les accessoires seront impérativement authentiques. Préférez chiner et récupérer plutôt qu’acheter, cela garantira une déco réussie ! Les canapés vintage et les fauteuils club en cuir patiné seront du plus bel effet, assortis de tapis anciens, légèrement usés. Les grandes tables en chêne et les chaises ou tabouret de bar en métal seront privilégiés, tout comme les anciens tourets. Le mobilier de récup’ apportera l’authenticité dont a besoin ce style de déco. Les cadres d’époque, les vieilles horloges de gare, les échelles de bois, les armoires métalliques s’intègreront à merveille. Les verrières sont quasi indispensables, en métal noir de préférence, en fenêtres, velux ou en cloisonnement intérieur. Récup' et éclectisme - intérieur style loft - verrière Enfin, la lumière n’est pas forcément une priorité. En effet le style loft s’accommode aussi bien de clarté naturelle que de lumière artificielle. Si l’on possède de grandes verrières la lumière naturelle sera parfaite. En revanche, dans le cas d’un intérieur plus sombre (appartement non traversant par exemple) les luminaires d’appoint remplaceront parfaitement la clarté du jour, sous forme de rampes de spots, de luminaires cloche en métal vieilli, d’appliques discrètes à l’éclairage tamisé. Intérieur loft - éclairage artificiel et tamisé Passé cette rapide présentation du style loft/indus, étudions de plus près, le mobilier à chiner puis celui à transformer soi même. Les canapés et fauteuils club en cuir vintage se trouvent aisément dans les brocantes ou chez les antiquaires. On préfèrera les acquérir d’occasion plutôt que d’aller les chercher chez Maisons du Monde ou La Redoute Intérieurs ! Fauteuil club vintage - Occasion Canapé cuir - Occasion Les armoires métalliques récupérées dans les anciennes usines permettront des rangements vastes et pratiques tout en apportant la touche industrielle dont on a besoin. Elles peuvent être en métal brut vieilli ou colorées. Rien ne nous empêche non plus de venir vieillir le métal pour plus d’authenticité ! Armoire métallique chinée Armoire casier métallique jaune - chiné Les étagères d’ateliers, d’usines, de garages pourront également compléter notre mobilier de rangement tout en apportant du cachet. Les meubles de métier, à multiples tiroirs, produiront le même effet. Casiers bois style meuble de métier chiné Meuble de métier style indus noir patiné Ce ne sont que des exemples rapides mais si vous vous référez aux mots-clés énoncés en introduction, il vous sera facile de chiner mobilier et accessoire ad hoc. Qu’en est-il maintenant de notre mobilier à transformer nous-mêmes ? Tout d’abord certains styles de mobilier seront à éviter. Les « Louis » (XV, XVI et Philippe), à quelques exceptions près, ne conviendront pas forcément tandis que les meubles années 20 à 50 (style 1925, mobilier design scandinave) seront hors sujet. On préfèrera les meubles de métier, les rangements d’atelier, ou du mobilier rustique détaché de tout style précis. Quelques exemples de ce que l’on peut réutiliser (avant notre intervention de peinture, ponçage, vieillissement…). Privilégiez ici les formes simples et carrées ainsi que les nombreux tiroirs pour rappeler les meubles de métier. Les établis de menuisier pourront également être transformés en table ou en console dans le style loft. Les meubles de métiers apporteront beaucoup d’authenticité à notre intérieur loft. On peut les chiner déjà restaurés (mais cela reste relativement cher) ou les remanier nous-mêmes. Je ne montre ici que quelques bases car les meubles et accessoires à chiner de style indu sont très nombreux (étagères bois et métal, caisses en bois, tourets, tabourets métalliques ou en cuir…).Intéressons nous maintenant aux finitions à mettre en œuvre sur notre mobilier pour obtenir ce fameux style indus. Attention toutefois de rester sobre et authentique sous peine de tomber dans une mise en peinture « Castorama » avec des produits tout prêts qui n’ont le charme… que du neuf ! Et c’est ce que l’on souhaite éviter… comme toujours. C’est la différence entre « relooking » (le gros mot…) et « peinture sur mobilier ».Dans ce style on évitera les peintures satinées et brillantes ainsi que les couleurs vives et pastel. Le bois brut vieilli ainsi que le mariage du noir mat et du bois sont deux incontournables. Les effets métalliques ou l’adjonction de parties métalliques fonctionnent bien également (traverses, clous, roulettes, poignées de meubles). Toutes les teintes de bois, du plus clair au plus foncé peuvent convenir, à condition, pour les plus clairs, de les vieillir un peu (glacis gris, beige ou marron par exemple). Toutes les nuances de noirs (si si, il y en a plein… allez voir Soulages !) et d’anthracite sont également prisées ici. Etabli et casier noirs avec miroir style indus Dans cet exemple l’établi est simplement décapé et poncé. On a ajouté des casiers métalliques en métal noir. Le miroir carré à croisillons et la lampe sur pied accessoirisent l’ensemble. Buffet imitation métal noir brossé Ce petit buffet de style parisien revêt le style indus grâce à une patine noir imitation métal et des clous de tapissier qui rappelle les rivets des tôles métalliques. Il est très facile de reproduire cet effet avec des laques mates noires et anthracite (en alternant les couleurs dans le frais). Des roulettes peuvent être ajoutées comme c’est le cas ici. Les tabourets et les luminaires apportent la touche finale. Meuble de métier style indus Ici encore, les tiroirs sont décapés et poncés. Il faut pas oublier d’y adjoindre fond dur et vitrificateur mat. Des poignées coquilles noires complètent l’ensemble. Le corps du meuble se pare d’une laque noir mate et d’un vitrificateur mat. On peut envisager également de poncer les arêtes pour un effet vieilli. On évitera cependant les pochoirs de style indus « tout prêts » qui ne font qu’apporter un effet « quincaille ». Meuble de métier noir mat, arrêtes usées et plateau bois On peut envisager également, sur certaines parties du meuble, de marier une couleur marron foncé et un glacis orange foncé passé au frottis ou à l’éponge pour recréer l’effet du métal rouillé. Attention les effets « métal » peuvent se faire aux poudres métalliques mais si on ne maîtrise pas… mieux vaux faire appel à un pro ! Effet métal que l'on peut reproduire grâce aux poudres métalliques et différents glacis colorés Bar et salon style loft Sur ce visuel c’est un bar qui est peint et patiné en noir mat tandis qu’une malle de voyage ancienne sert de table basse. L’effet cuir de cette table est également reproductible par un professionnel de la peinture sur mobilier puisqu’il traite des effets matières. Salon/salle à manger style loft Dans cet exemple une table basse rustique à la patine ancienne marque l’espace. Pour obtenir cette patine on réutilise du bois ancien et abîmé pour le plateau, on le ponce, on ajoute une gomme-laque sombre (ou du brou de noix) puis une cire. Une grande table en chêne occupe l’espace salle à manger. Pour l’obtenir, on décape et on protège avec un fond dur et un vitrificateur polyuréthane solide (nettoyage des outils au white-spirit).Enfin, je signale ici que de nombreuses créations de mobilier en palettes ou conçu à base de caisses de rangement vintage en bois peuvent être mises au point. Pinterest regorge d’articles de ce type. Je vous laisse chercher !Voilà ! J’espère vous avoir aidés pour vos meubles peints dans le style loft. N’hésitez pas à commenter ou à m’envoyer vos questions.À bientôt pour un prochain article. Catégorie : Uncategorized"
