title = "septembre 2021 - Atelier Peinture décorative relooking meubles et boiseries peinture murale et décoration d'intérieur"
description = "Le stockage ou l’accès technique est strictement nécessaire dans la finalité d’intérêt légitime de permettre l’utilisation d’un service spécifique explicitement demandé par l’abonné ou l’utilisateur, ou dans le seul but d’effectuer la transmission d’une communication sur un réseau de communications électroniques."
full_description = "Publié le septembre 22, 2021septembre 13, 2024 par Rhea — Laisser un commentaireLe style romantique et les meubles peints Une chambre au style romantique Une salle de bain style romantique L’automne arrivant, nous allons étudier en détail ce mois-ci un style cocooning et féminin : le style romantique ! Non, non … Ne pensez pas tout de suite à froufrous et dentelles ! Au niveau des meubles, de très belles réalisations/acquisitions sont possibles tant en peinture sur mobilier qu’en chine et brocantes ! Et surtout, comme j’aime à le rappeler, on peut créer dans ce thème un intérieur AUTHENTIQUE ! Comme toujours, commençons par un tour d’horizon de ce style pour ensuite nous intéresser aux meubles eux mêmes.Les espaces et les volumes, une fois n’est pas coutume, supportent une certaine « densité » (attention, pas d’entassement non plus , cela donnerait le style « boudoir meringue »…). Pour laisser respirer, on ménage par exemple un espace central plus vaste et on repousse mobilier et accessoires sur les bords de la pièce (comme c’est le cas dans le salon et chambre avec salle de bain ci-dessus). En somme, c’est une organisation de l’espace assez classique.Les couleurs sont dominées par le blanc, les teintes douces et les pastels (beige, rose poudré, vert amande, marron clair…). Elles peuvent fonctionner en camaïeux mais tout en gardant le blanc prédominant (murs, plafond, pièces de mobilier). Elles doivent amener un effet un peu suranné.Pour les matières, les tissus et les voilages sont indispensables (comme dans la chambre ci-dessus). Les plaids, les coussins en tissus voire les pompons viennent compléter l’ensemble. La dentelle a également toute sa place, mais attention à se procurer de la dentelle de qualité ou chinée en brocante (en ligne sur Instagram c’est aussi possible) pour plus d’authenticité. elle pourra servir alors de couvre lit ou d’encadrement de fenêtres. Les textiles utilisés doivent être élégants (plaid en coton, rideaux en lin…). Les parquets en bois clairs ou foncés et les bois patinés apporteront une touche chaleureuse tandis que le for forgé, l’osier et les bouquets de fleurs séchées dissémineront des touches colorées.Pour le mobilier, optez pour des objets qui ont du vécu ! La charmante armoire du premier visuel, blanche et légèrement usée, la banquette et la baignoire dans la salle de bain ou la table de nuit sur le dernier visuel en sont de parfaits exemples. Le mobilier en osier ou en fer forgé peut également apporter un très bel effet. Même inspiration pour les accessoires, privilégiez la récup, la seconde main et la brocante, notamment avec des cadres dorés aux contours moulurés, les paniers de rangement en osier, les vases et chandeliers aspect blanchi, les lustres à pampilles légèrement baroques.Enfin l’éclairage doit être naturel au maximum, si l’espace est trop sombre on risque de tomber une nouvelle fois dans le style « boudoir » qui manque de modernité. On peut toutefois apporter une lumière artificielle tamisée avec des luminaires au plafond : lustres en fer forgé, luminaires en tissu voire en papier, chandeliers. Une salle à manger de style romantique Maintenant que les grandes lignes sont fixées, étudions de plus prêt les meubles que nous pouvons intégrer et avec quels types de projets décoratifs (c’est quand même cela le cœur de mon métier !). Tous les meubles anciens peuvent convenir ici, à part les enfilades et petits buffets de style scandinave, trop typés. On peut tout d’abord simplement décaper nos meubles et les garder en bois brut. Pour connaître tous les secrets du décapage, reportez vous à mon article « Le style campagne et les meubles relookés ». Dans ce cas, il suffit ensuite d’agrémenter le meuble avec des accessoires blancs ou pastels. Bois décapé et blanchi par endroit pour cette petite armoire Bois brut et clair pour cette armoire sculptée Dans les intemporels, on retrouve le meuble blanc patiné avec un effet légèrement usé que l’on obtient avec une peinture blanche mate ou une peinture à la craie. L’usure s’obtient avec un corps gras (une bougie souvent) frottée sur les arêtes. L’usure peut être légère ou bien plus prononcée. Attention, pour tous les projets peints, utilisez des peintures mates et surtout pas brillantes et satinées. Vous retrouverez plein d’astuces sur ce style dans mon article « Campagne chic ». Buffet deux portes patiné blanc Armoire verte patinée vert pâle On peut également donner un aspect légèrement blanchi à un meuble pour laisser le bois apparent. Dans ce cas on le peint (une seule couche) et on vient poncer ensuite la totalité du meuble en insistant plus à certains endroits qu’à d’autres. On peut aussi le peindre mais en laissant de nombreux manques et en essuyant les surplus. Les nuances de blancs conviennent le mieux dans ce cas, comme ci-dessous. Buffet bois légèrement blanchi Si on souhaite une finition plus usée on peut accentuer le ponçage ou augmenter la couche de corps gras avant la dernière couche de peinture. Une cire teinté apportera la marque du temps comme dans le petit chevet ci-dessous. Chevet patiné beige et blanc En ce qui concerne les styles de meubles, on dispose de plusieurs possibilités. Le style Louis XV, souvent désuet, vieillot et passé de mode pourra parfaitement convenir, à condition d’être peint. La banquette ci-dessous en gris foncé mat est juste parfaite pour le style romantique. Les chaises Louis XV seront aussi très bien intégrées avec une patine blanche ou beige légère. Banquette patinée gris taupe Le style Louis XVI s’harmonise également très bien avec la décoration romantique. Les meubles seront alors simplement décapés (avec fond dur et vitrificateur) ou bien peints dans les tons blancs et/ou pastels. Pensez bien à la finition mate. Salle à manger bois grisé Petite coiffeuse blanc mat poudré Parmi les accessoires, les miroirs et psychés agrémenteront joliment votre décoration d’intérieur romantique. Les mises en peinture simple (blanche ou couleur pastel) et les patines usées seront parfaites comme sur les exemples ci-dessous. On applique le corps gras sur les moulures. Miroir avec entablement - peinture blanc mat et usure des reliefs et moulures (corps gras et ponçage) Psyché ton ivoire Enfin, si on chine, il est possible de se procurer des persiennes et de les détourner. Dans un style romantique cela donne beaucoup de cachet. On peut alors s’en servir de paravent, de panneau mural pour délimiter un espace ou de tête de lit. On prend soin alors de les décaper/poncer ou de les peindre (beige ou blanc mat). Persiennes peintes en guise de tête de lit Voilà, ce petit tour d’horizon du style romantique et des meubles/objets peints est terminé. N’hésitez pas à consulter les autres articles et à vous promener sur le site pour prendre connaissance de mes réalisations. A bientôt. Catégorie : Uncategorized"
