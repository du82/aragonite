“We have a habit in writing articles published in scientific journals to make the work as..."""
full_description = "10 quotes about writing “We write to taste life twice, in the moment and in retrospect.”―Anais Nin “We have a habit in writing articles published in scientific journals to make the work as finished as possible, to cover up all the tracks, to not worry about the blind alleys or describe how you had the wrong idea first, and so on. So there isn’t any place to publish, in a dignified manner, what you actually did in order to get to do the work, although, there has been in these days, some interest in this kind of thing.”―Richard P. Feynman “There comes a point in your life when you need to stop reading other people’s books and write your own.”―Albert Einstein “A writer is not a writer because he has written some books. A writer is not a writer because he teaches literature. A writer is only a writer if he can write now, tonight, this minute.”―Charles Bukowski, On Writing “And so now you will begin to work at your writing. Remember these things. Work with all your intelligence and love. Work freely and rollickingly as though they were talking to a friend who loves you. Mentally (at least three or four times a day) thumb your nose at all know-it-alls, jeerers, critics, doubters.”―Brenda Ueland, If You Want to Write “You have to write the book that wants to be written. And if the book will be too difficult for grown-ups, then you write it for children.”―Madeleine L’Engle “As a result, most of us try to write too carefully. We try to do it “right.” We try to sound smart. We try, period. Writing goes much better when we don’t work at it so much. When we give ourselves permission to just hang out on the page. For me, writing is like a good pair of pajamas—comfortable.”―Julia Cameron “You must stay drunk on writing so reality cannot destroy you.”―Ray Bradbury, Zen in the Art of Writing “The only way you can write the truth is to assume that what you set down will never be read. Not by any other person, and not even by yourself at some later date. Otherwise you begin excusing yourself. You must see the writing as emerging like a long scroll of ink from the index finger of your right hand; you must see your left hand erasing it.”―Margaret Atwood, The Blind Assassin “Advice? I don’t have advice. Stop aspiring and start writing. If you’re writing, you’re a writer. Write like you’re a goddamn death row inmate and the governor is out of the country and there’s no chance for a pardon. Write like you’re clinging to the edge of a cliff, white knuckles, on your last breath, and you’ve got just one last thing to say, like you’re a bird flying over us and you can see everything, and please, for God’s sake, tell us something that will save us from ourselves. Take a deep breath and tell us your deepest, darkest secret, so we can wipe our brow and know that we’re not alone. Write like you have a message from the king. Or don’t. Who knows, maybe you’re one of the lucky ones who doesn’t have to.”―Alan Wilson Watts"
