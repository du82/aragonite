["https://anniemueller.com/posts/painting-yourself-into-a-corner"]
title = "Painting yourself into a corner - annie's blog"
description = """
When you’re interested, you find interesting things. 

I am slowly downloading a portion of my 753 Kindle books from the clutches of Amazon. I have two book-related hobbies: One is..."""
full_description = "Painting yourself into a corner When you’re interested, you find interesting things. I am slowly downloading a portion of my 753 Kindle books from the clutches of Amazon. I have two book-related hobbies: One is reading books, and the other is collecting books. 753 is a dumb, dumb number. Amazon is dumber. A license to the content, my ass. First of all, it’s a book not “content.” Second, I purchased the book. I haven’t read all of my Kindle books. I certainly won’t be downloading all of them. But I am going through the whole list and pulling out the ones worth keeping, so I can run them through the AntiDRMinator and be able to read them anywhere I’d like. I’m working my way from the oldest to the newest. One book caught my eye: downloaded in 2012, written by a blogger I followed then. I drifted off as my interests and views changed, and didn’t keep up with his stuff. I was curious. Wonder if he’s still blogging. So I looked him up. Shiny new site, at least from the last time I’d checked it out. And in the “Articles” section, at the top, a post about Why I am no longer blogging. I scanned it. Closing down the blog, he says. Time for something new; Blogging doesn’t feel like it used to; Moving to Substack. All my writing will be there from now on, he says. There’s no date on the post, but I follow his Substack link and see he’s been writing there since 2021. He has over 50,000 subscribers so I guess it’s working out, though of course I have no idea what his numbers were for his own blog. I scan a few of his last articles and out of pure idle curiosity (and procrastinating on what I should be doing) I click into the Notes tab on his profile. There, up near the top. In January, just a few weeks ago, a note from him: “I don’t find the Internet to be that interesting anymore. What am I missing?”"
