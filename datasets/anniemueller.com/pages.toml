full_description = "12 things to avoid for better conversations The vague offer instead of the specific ask Saying “I’m sorry about ” when I need to say “I’m sorry I did _.” Engaging in ‘Who’s the bigger victim’ comparisons Telling my own little story that’s related to your story when maybe I could just ask you a few questions about your story instead of needing to find some sort of personal anecdote to share as if we’re not connecting in a satisfactory way if I don’t find and explain immediate similarities with every micro-topic that arises Making jokes out of resentments Snide little put-downs about subjective personal preferences Asking for feedback when I’m really asking for approval Rushing to fill the silence Giving unsolicited advice Making myself sound agreeable no matter how deeply and thoroughly I disagree Policing tone and ignoring content (a.k.a. using socially correct expectations to shut down uncomfortable conversations) Policing content and ignoring tone (a.k.a. willfully misunderstanding or ignoring the emotional context)"
