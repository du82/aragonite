["https://anniemueller.com/posts/a-good-night-for-old-cartoons"]
title = "A good night for old cartoons - annie's blog"
description = "I’m sitting on the couch. 30 minutes ago I finished an episode of Broadchurch and was getting up to do the last little puttering around things before bed. Then Lily..."
full_description = "A good night for old cartoons I’m sitting on the couch. 30 minutes ago I finished an episode of Broadchurch and was getting up to do the last little puttering around things before bed. Then Lily came in and asked me to quiz her for a Spanish test. So we went over the alphabet and the days of the week and numbers up to 30 and some basic questions like Como te llama Y de donde eres y cuantos años tienes. Then she wanted to look up the Spanish alphabet video they used in class so we did and then followed a little YouTube rabbit trail (as one does) to episodes of the Pink Panther, animated, circa 1972. This kid loves older cartoons and it’s so lovely and specific, her interest in them. She has very strong opinions about animation styles on the various versions of Tom and Jerry. She favors particular episodes of Looney Tunes from the 80s. She loves old Popeye cartoons. (One time I bought a “nostalgic” cartoon collection specifically because she likes the older animation so much and then had to do some heavy editorial oversight because WOW racism.) She’s also really into anime so she’s not a vintage-only person. It’s fascinating to me how she notices differences and similarities in animation styles across decades and genres. She knows what she likes and I think that’s really cool. Anyway she’s laying here with her legs stretched out over me watching just one more episode. I’m typing this on my phone. Bed can wait, who even needs sleep? Life feels gentler lately. But also horrific. Gentle in my personal spaces. Horrific in the public spheres. Both true at the same time. And also, speaking of nostalgia, I have been hit by several waves of that nasty stuff lately. I don’t appreciate it. I’d like to stay neutral or even detached, not swamped by some yearning sadness. Ugh. Hearts. What a mess. Also who am I kidding, I’ve never been detached about a single experience in my entire life. And what has that gotten me? All that messy, messy involvement and caring and being affected and attached? Lots of good shit. Actually. Like this moment here. Watching old cartoons with my kid."
year_published = 2025
