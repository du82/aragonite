full_description = "✍️ Guestbook Guestbook? More like FRIENDBOOK amirite?!(I am.) If we are already friends, say hello. If we are not yet friends, also say hello and then we can be friends. Easy peasy! And you will create A RIPPLE EFFECT OF JOY THAT WILL REVERBERATE THROUGH THE INTERWEBS.What could be better? (Nachos.)In lieu of nachos, sign my guestfriendbook. I’m already so excited. Also a little hungry. (Note that your signing won't appear on the page immediately, as I have to review each entry to keep my guestbook free of spam.) hell yeah I'm into sending joy across space and time via digital tools Hello from Brazil, Annie! :-) Just read “I’m gonna keep making shit and I hope you will too”. I really needed to read something like that today. Thanks for writing that post. <3 “Talk about the thing itself” got me thinking about my attempts bringing people aboard the Fediverse. I’m more of a technical profile, it’s important to me to improve the way I communicate with people from other walks of life. I’ll follow your RSS feed. Guilherme keshav Bjørn Einar Bjartnes Brian Thanks for making (good) shit! I love to read it. It’s all I can do as well, right now: make a blog. Paint. Meditate. Lead some meditation. Make soup. Snuggle with animals. Call my people. The quiet, joyful life is a revolution right now. Sending deep breaths. Kelly Darren Niko Hello, Annie. I accidentally discovered your site via some Micro.blog clicking. I found Anne-Laure’s post on Interstitial Journaling when reading your Four Thousand Weeks post (which reminds me… I have to rescue that book from my bookshelf and actually read it!), so thank you and I’m looking forward to finding out more about interstitiality. Anyhow, hello from Ireland. I love your guest-friend-book idea, so here’s my contribution to it. Chris Murphy “So you have to build something. If you lose the structure you trusted, you have to construct something new. Tough work. Slow work. Nice work, if you can get it.” You left off the most important part of that riff. “And you can get it if you try!” I appreciate your posts. Just sayin’ … 👍🏿 George Hollie Mandaris Hi Annie, I’m so happy that I found your blog on Pika. Your posts are a pleasure to read and your writing style is superb. Love it. Peter Chihiro Davey Your words are important. They gave me some hope this morning. Daniel When I have imaginary Internet parties in my head, I always make sure that you get an invitation. Thanks for being the friendly and encouraging person you are. Lou Plummer Keep on blogging! Glad I found you. ✌️ cliff538 Sibu I love guestbooks. Arjun Basu Loved your take on creativity in the P&B interview! I’m inspired to write and put myself out there. JW What a brilliant idea. At this point, what might I say to someone I have only met eyes with from “across the room.” Before I go to the buffet, I will saunter over and say hello. Karen Wieckert XANGA! And pop goes a whole can of early-zeros nostalgia. Thank you for your lovely interview, I’m glad I discovered your site. Zinzy Ty hi annie, found your blog through Manu’s blog. i don’t see guestbooks on sites all that often so I like to sign them whenever I can! Sadiq I am a VERY BIG FAN of people unapologetically asking for comments. Thankyou for an interesting blog, and have a wonderful day, week, and indeed life. matt Ciao Annie! Just read your P&B interview and liked your take on blogging. I think you’ve earned a new reader. Take care Nicola Love your blog Annie! Thanks a lot for keeping the spirit of indieweb alive! Rishi Annie I love reading your posts; I find them heartwarming, poignant and prescient. Thank you from the bottom of my heart. Blessings, Julian Julian Summerhayes Greetings from Meanjin (Brisbane, Australia)! I enjoyed your interview with Manu on People and Blogs. Looking forward to reading more of your posts. Aleem previousnext 👋 email | micro.blog | mastodon | omg.lol 💃"
