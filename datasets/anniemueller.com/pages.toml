["https://anniemueller.com/posts/a-good-day-for-love"]
title = "A good day for love - annie's blog"
description = "I have long thought of Valentine’s Day as a good precursor to a better day following when a lot of chocolate goes on sale. But it’s a nice concept, as..."
full_description = "A good day for love I have long thought of Valentine’s Day as a good precursor to a better day following when a lot of chocolate goes on sale. But it’s a nice concept, as holidays go, if you ignore the commercialization. Celebrating love! Good stuff. The last Valentine’s Day I celebrated while in a relationship was in 2020. I didn’t have any expectations for today other than a normal day working, a little more time with the kids (who are off school, I don’t know why, I don’t ask questions about the school schedule anymore—I just accept it), and a quiet evening at home. A lovely plan. Then early this morning I got a text from my best friend. Her husband is sick. She has dinner reservations. Will I join her….? Um, Yes. So I picked her up and we went to this sprawling restaurant that also has: An arcade and hatchet throwing and pool tables and corn hole and ski ball and 54 beers on tap and we ate the Valentine’s Dinner Three Course Special and drank beer and laughed and talked and talked and laughed and it was very good. And now I’m home. Quiet. The kids occupied, with remnants of their Valentine’s treats scattered around. Cats purring. Window cracked: Cold air and warm blankets are the best combination. Soon, sleep. Right now, gratitude. Contentment. Love. Tomorrow: Chocolate at a discount."
