["https://anniemueller.com/posts/asking-too-much-of-the-fediverse"]
title = "Asking too much of the fediverse - annie's blog"
description = """
Connection between people requires time and care and a bit of vulnerability. 

Typical social media is frenetic and shallow by design. It’s a firehose of urgency that encourages consumption over..."""
full_description = "Asking too much of the fediverse Connection between people requires time and care and a bit of vulnerability. Typical social media is frenetic and shallow by design. It’s a firehose of urgency that encourages consumption over connection, and now it’s so algorithmed and hyperbolic that I find it mostly useless. I enjoy dipping into Micro.blog and Mastodon, and I’ve gotten to meet and interact with people I wouldn’t have encountered otherwise. But I think we’re putting an undue amount of pressure on the fediverse to provide community for us. No platform can build or provide community. People are the only ones who can build community, and we do it by nurturing individual connections with each other. We can use the fediverse as a tool for this, just like we can use our own blogs, and email, messaging, phone conversations, video calls, streaming interactions, and in-person visits. Time spent together concurrently or asynchronously. Care offered via digital or physical expression. We have more tools and methods for connecting with other humans than we have ever had before. Social networks are a place of potential connections. But we have to do the work ourselves to move a connection from potential to actual. The kitchen doesn’t make the meal: the kitchen holds the ingredients and tools, and I can use those things to make a meal. Or I can stand there and be upset that my presence in the kitchen hasn’t been enough to produce the meal I’m craving."
