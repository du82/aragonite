title = "Let’s talk about the fediverse - annie's blog"
description = """
The goal: Get people started. Encourage action—action is investment. They only need to understand enough to take the next action. 

Names• Try other names; fediverse sounds dumb af when you..."""
full_description = "Let’s talk about the fediverse The goal: Get people started. Encourage action—action is investment. They only need to understand enough to take the next action. Names Try other names; fediverse sounds dumb af when you first hear it. Just say social media or social network. Use the name of your preferred instance. Say Mastodon. I know Mastodon is not the whole fediverse. Understanding > precision. Use the name of the app you use like Ivory or Ice Cubes or whatever. “Have you tried Ivory?” “No, what is it?” “Oh, it’s a social network app.” “How do you use it?” “Just download it, then sign up for a Mastodon account.” “What’s Mastodon?” “Oh, that’s what the network is called.” “Why does the network have a different name than the app?” “Don’t worry about it. Here it is, see? Just download, then… Yeah… Tap there to set up your account. Cool! Yeah. Now you can find hashtags and people…” Associations & analogies It’s like a big house with a lot of little rooms you can visit. Social media platforms are the fast food options — on every corner, easy, convenient, but pretty gross. This is like a home-cooked meal. Takes a bit more work but it’s way tastier and more satisfying. Commonalities What are they looking for? What do they care about? How will they find it on the fediverse? Book recommendations Geeking out over specific interests Watch parties Making things Sharing art Creative writing Blog carnivals + challenges Experts on cool stuff What do you love about it that’s a shared interest with the person you’re talking to? What are they into? Go digging. Find some cool stuff — experts, hashtags, communities, things they can plug into. Benefits > features See what your friends are sharing. Control what’s in your feed. Framing Political Tired of Musk? Try Mastodon! Not into nazis? Check out this social network. Disgusted by [fill in the blank]? You’ll dig this app, check it out. Social glory days Miss the old Twitter? You’ll love Mastodon/the fediverse/[name of the instance I like]. Like [….] but without the […..]. Like FB but without the algorithm. You choose what you get to see. Like [….] but with […..]. Reminds me of Twitter but with better filters. Translate the terminology Don’t make them learn new words. You do the work — find a way to share the ideas in ways that are familiar. Onboard them Find their special interest hashtags Introduce them to your network Help them find people to follow Show them how to mute and set up filters NOT ALL AT THE SAME TIME 👋 email | micro.blog | mastodon | omg.lol 💃"
