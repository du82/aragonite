title = "A fierce and unrelenting joy - annie's blog"
description = """
May fierce joy lead me.
May I grow out of this righteous anger
Into something more powerful:
A wild and holy joy 
That returns as it is given
That replenishes..."""
full_description = "A fierce and unrelenting joy May fierce joy lead me.May I grow out of this righteous angerInto something more powerful:A wild and holy joy That returns as it is givenThat replenishes as it is spentThat clears the old, the mess, the weight of past mistakesBoth collective and individual. oh! What cleansing there could be(the gentle unstoppable force of soft rain) Not with the violence of harsh wordsNot with brutality disguised as civilized contemptNot with terrible games of defense and offense, weapons and barriers, scores and sides and screaming, winners and losers (all of us losers; the game is fixed)Not with displays of strength to intimidateNot with displays of rightness to shameNot with displays of greater pain to invalidateNot with displays of spiritual largeness, put on like a robe, To make others feel small.These worn-out ways offer no cleansing.It is rearranging bodies on the battlefield.It is mopping up blood with more blood. Let me be something different than a fighter. I have been a warrior:noble and seasoned, ready and wise, tired exhausted ravaged wornby the weight of my battle-strength.It is so heavy. Let me be something different.Let me accept the terrifying vulnerability ofRemoving armor, piece by pieceLaying down weapons, one by oneStanding still—naked, free, unashamed—in the midst of this fury and roar. May the sound of my stillness deafen a room. May the steadiness of my breath issue a higher command. May the quiet of my presence the openness of my heartthe raw softness of my soulshow (with unavoidable clarity, like a scream frozen in air, like the shape of a sunrise, like the movement of planets)the triviality of all these swords clashing. Let me make a different music.Let me sing old, old melodiesThat reverberate through the cosmos andReturn to us, call forth our child-selves,Shatter our wallsWake us from this deadly sleep. Let me be a healer, a weaver, a knitter together of disparate things, a planter of seeds, a seer of connection, a speaker of oneness.Let me dance it in a universal language.Let me speak it in a hundred forms of beauty.Let me give it with each soul-exposing act of work.Let me call it forth:This warrior strengthBuilding instead of breaking apart. I honor the breaking apart. I honor the anger. I honor the warrior spirit.I honor all who stand, who kneel, who sit, who speak, who meet each gaze Eye-to-eyeUnflinchingWhen they are told to Lay down Be quietLook downBe quietSimmer downBe quietKeep it downBe quiet. Quiet imposed must be broken apartTo make way forMusic. We have fought wars we did not relishWe have borne burdens we did not createWe have killed even what we lovedWe have left behind homeland Left behind safety Left behind identityLeft behind comfortTo trek across a bitter soul-piercing body-breaking wastelandTo make our wayTo make our own wayTo make our own way forward. We are more than resistance.We are evolution. May we listen to the pull of the starsThe voice of the SpiritThe music of rebirth. (oh! Almighty musicForce unstoppableMelody divineSacred flowSource and life and pattern and chaos Sustaining, creatingCycles of beingEbb and flowWave and sandWe are caught upWe are releasedWe are the energyWe are the soundWe are hereWe are.) May we hear the next wordand follow it.The word is notFight. What is the word?You can only hear it in the pervading stillness Of your soul. It is the hush and awe of your own divinity.It is the overpowering force of peace.It is the bright-hot cleansing of desire.It is the unfettered savage beautiful power of joyA fierce and unrelenting joy. (It will get you called all sorts of names.)It is an arrow straight to the heartIt is the ultimate weaponIt does not repressIt revealsIt does not defendIt dancesIt does not conquer It creates. (My greatest battle is my own rebirth.)"
