Getting up early• Why this habit?


  • I feel better when I get up early. I sleep better when I get up early. Even if..."""
full_description = "Habits Habits I’m building: February 2025 Getting up early Why this habit? I feel better when I get up early. I sleep better when I get up early. Even if I get less sleep, I tend to have more energy throughout the day when I get up early. I like being awake early, before the kids, before everything starts rumbling along. How will I pay attention? Journal - note time when I start the page Habit tracker app - Check off “wake up early” if I get up on time How will I make it easier? Take naps :) Try to get to bed earlier Put the coffee on a timer Keep coming back to it rather than aiming for perfection. Remember my body needs time to adjust to a new sleep pattern. Morning miles (running) Why this habit? Motherfucker, I don’t know. Running is the most miserable thing I love. I’m not built for it. I’m a short woman with short legs. I’m not good at it. But dammit I get so sad when I don’t run. How will I pay attention? Use Strava to track runs Set a target: 60 miles total in February Track weekly mileage (15mi/wk will get me there) Week 1: 15.09 miles Week 2: 10.87 miles Week 3 Week 4 How will I make it easier? Public announcements :) Getting up early is really the key. If I’m up early, I’m gonna run. Set out running clothes WIP writing sessions Why this habit? I want to write a book before I die. Or maybe several books. But I’m busy. It will never be convenient. I want to establish a regular writing routine now instead of waiting until some future ideal time that will probably never happen. How will I pay attention? Weekly accountability calls, setting a goal for the week ahead Log when I have a writing session and what I write in my daily note How will I make it easier? Schedule it into my calendar, treat it like an appointment Have a list of writing tasks to do so I’m not facing the “what to write” challenge Any amount counts. Full points for sitting down for some amount of time even if I write very little. The goal is to establish a routine, not produce a lot of words. 👋 email | micro.blog | mastodon | omg.lol 💃"
