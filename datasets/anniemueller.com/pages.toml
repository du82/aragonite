["https://anniemueller.com/posts/11-tips-for-better-conversations"]
title = "11 tips for better conversations - annie's blog"
description = "1. Listen with full attention OR walk away from the conversation. Stay away from the muddy middle ground of tolerating a conversation you don’t want to be in or giving..."
full_description = "11 tips for better conversations Listen with full attention OR walk away from the conversation. Stay away from the muddy middle ground of tolerating a conversation you don’t want to be in or giving half-hearted attention instead of excusing yourself. Commit or quit. Answer the questions that have been asked and answer the questions that need to be answered but haven’t been asked. Don’t over-answer. Adding too much information (even when it’s related) causes confusion and forces the person to sort through all the information to find what they need. Drop filler words like just, very, really. (More applicable in written conversations.) Drop filler apologies. (More applicable in spoken conversations.) Ask for what you need or want directly and clearly. “Will you explain more about this problem in detail?” “Can you give me an example of what you need?” “Will you be there to help?” “What time works for you?” “I need to know when this will be completed.” “I want to help. Can I [do xyz thing]?” Use shared terminology. If the terms are different, use their term first and then equate it with your term. This is a form of education (for customer conversations) and a way to find common ground (in other conversations). Acknowledge their position and name their opinions and feelings. Try not to be an ass about it. Use your intelligence to convey understanding without condescension. And remember: Acknowledgement is not agreement. Gaining clarity is not condoning. If they’re saying shit you don’t want to listen to, kill it with a word or two: No thanks. Too far. Whoa. Hold up. Rewind. Back up. I’m out. Consider your goal for the conversation: A. To connect (relational) B. To learn (informational) C. To teach (eeeehhhh careful) D. To win (asshole-ational) E. To avoid social censure (survival) F. To have fun (i.e. you’re an extrovert) G. To hoover up attention however you can get it (#narctok) H. To be a bigger person, which is just D or a self-righteous C I. To make someone else comfortable, which is just E but you’re probably pretending it’s A J. To keep the party / date / meeting / holiday gathering from lapsing into tense silence which is framed as F but is most likely E If things get really uncomfortable/you get bored, consider a spontaneous interpretive dance. It’s amazing how quickly people can exit a conversation when they really want to. Me after 3.7 minutes of small talk"
