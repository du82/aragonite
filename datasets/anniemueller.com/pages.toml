["https://anniemueller.com/posts/burn-build-bridge"]
title = "Burn, build, bridge - annie's blog"
description = """
Change requires three types of work:
Burn down the old things.
Build up the new things.
Bridge the gap between old and new.&nbsp;
This is helpful to keep in mind at a couple of levels.&nbsp;"""
full_description = "Burn, build, bridge Change requires three types of work: Burn down the old things. Build up the new things. Bridge the gap between old and new. This is helpful to keep in mind at a couple of levels. ↑ Excerpt ↑ The small scope of my own life, when I want to change things for myself in some way, I need to look at the whole picture. I need to do all three types of work. Sometimes I burn something down but don’t build anything to replace it. That’s dangerous. Sometimes I build a new thing (or plan to step into something better, already built) but don’t give myself a way to get there, no bridge to cross the chasm between Old Thing and New Thing. I keep requiring myself to jump across, to make these big leaps. It’s exhausting, even when it’s possible. And often it’s not even possible. Then there’s the larger scope of, y’know, everything. It’s easy to criticize. Easy to point, easy to blame. Interestingly, none of that sideline stuff counts as work. None of it moves us toward meaningful change. Burn, build, or bridge: that’s the work. If somebody’s burning down the old stuff and you want to build the new stuff, start building. Don’t bash the people tending those fires. Or maybe you want to stand in those gaps, reach across, help people move from an old thing to a new thing. That’s great, that’s important. Don’t bash the people building the new things; don’t spend your energy or waste their time pointing out how they could improve the structure. If you want to work on building the new thing, get in there and build. Improve the structure yourself. Think people are burning things too fast, going too far? Help contain and direct the fire yourself. It’s messy work, difficult work, dangerous work. Not easy to do. Less critiquing. More contributing."
year_published = 2024
