["https://anniemueller.com/posts/urgencies-are-yappy-little-dogs"]
title = "Urgencies are yappy little dogs - annie's blog"
description = """
The law of urgency tells us this:

By default, whatever screams the loudest will get the quickest response.

Whatever generates the most discomfort (real or imagined) will get the most..."""
full_description = "Urgencies are yappy little dogs The law of urgency tells us this: By default, whatever screams the loudest will get the quickest response. Whatever generates the most discomfort (real or imagined) will get the most attention. The loudest things get the most attention, whether they deserve it or not. But urgency does not equal importance. If I don’t pay careful attention to what gets my attention, I’ll run around chasing meaningless alarms, while the higher priority people and plans will get little or nothing from me. Urgency fuels anxiety and is fueled by fantasy How hard it is to tune out the urgent to focus on the important. I struggle with this daily. Urgency fuels my anxiety, which in turn supports my belief in urgency. There are many things that feel urgent to me, and it seems impossible to relax until I get all the urgent things done. It seems impossible to settle in, to focus on the IMPORTANT things, while there are urgent things waiting for me, screaming at me. It seems like the right thing to do, the responsible thing to do, is to tackle the urgent things. Solve the loudest problems. React to the crisis. Enter the realm of the urgent, sword in hand, and start slashing away. That’s what heroes do, right? They face things head-on. They find the enemy and attack. Slash! Slash! Slash! It’s courageous and noble. Or, at the very least, it’s responsible and correct. Maybe it’s not heroic, exactly… but it’s mature. I’m doing my duty. I’m being an adult. I’m dealing with it. But something doesn’t quite work, does it? The urgent things are never done. Squash one and two more erupt. There are some fantasies at work in the realm of the urgent: The fantasy that I can ever “get done” with all the urgent things. The fantasy that I’ll be able to relax, focus, enter some better and higher mode of being once I finally reach this ideal state of being done with the urgent things. The fantasy that these things are urgent at all. They’re not, really. It is very, very rare that a situation of actual urgency requiring immediate action happens in my life. I’m a writer, not a paramedic. Even the stuff my kids bring me is rarely urgent. Sometimes it’s time sensitive. Time sensitive is not the same as urgent. No one dies if I don’t solve this problem, answer this email, pay this bill, respond to this text, write this paragraph, or make this appointment right now, right this very minute. Urgencies are a certain class of things, like yappy little dogs. If you have and love a yappy little dog, I hope you will not be personally offended by this analogy. But the thing with yappy little dogs is that they’re always yapping for no good fucking reason except that they want to, or they’re deeply insecure, or they’re having a panic attack, or they think they’re big shit when in fact they are very small shit. Or all of the above, all at the same time. Urgencies seem like the heads of the Chaos-Hydra. They seem like important problems we must solve, big enemies we must face. In fact, they are yappy little dogs snarling and snapping at our heels, with no power except their power to claim our attention. So maybe we treat them as such: Don’t take them seriously. Put them in funny little sweaters. And tune them out while we focus on what is important."
