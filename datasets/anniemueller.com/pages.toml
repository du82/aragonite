full_description = "21 ways to pray Say hello to a tree. Sit on a beach and watch the waves. Straighten your spine and relax your shoulders. Refill the water dish. Turn notifications off. Send that funny thing to your friend. Delete several events from your calendar. Savor the perfect drink. Sweat. Open the curtains. Admire a patch of moss. Let the smile you don’t feel disappear from your face. Ignore the crumbs on the floor. No one cares. If they do care, point to the broom. Point out the fluffiest clouds. Make a really good snack. Leave a few minutes earlier for the appointment. Walk straight out of a boring conversation. Wear headphones in the grocery store. Stretch. Wear your favorite color. Make a list."
