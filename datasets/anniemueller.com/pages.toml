Right before you go to sleep, note your feelings about humanity on a scale of 1 - 10,..."""
full_description = "An interesting experiment Part 1. Spend your normal amount of time on social media today. Right before you go to sleep, note your feelings about humanity on a scale of 1 - 10, with 1 being “would exterminate most” and 10 being “humanity is wonderful.” YOU HAVE TO BE HONEST OR THIS WON’T WORK. You can’t mark down what you wish you felt, or what you want to feel, or what you hoped to see, or what you think you should feel toward humanity. Mark what you actually feel. Then note your feelings about yourself on a scale of 1 - 10, 1 being “less than a worm, lowest of the low” and 10 being “functioning at a superhuman level of awesome.” Part 2. Take a break from social media for at least 24 hours. Even better, a whole weekend. Spend time with real people, focused on them. Face to face! Have actual conversations. Go places and be there, in the place, instead of in the place staring at your phone. Do stuff in the world. Interact. Meet people. Pay attention to your surroundings. Engage your body and mind. Get bored! What a shocking experience that will be. Then do that same scale 1 - 10 of how you feel about humanity. What’s changed? Anything? Now the scale 1 - 10 of how you feel about yourself. Is your feeling different? Worse? Better? I don’t know what your results will be. I know what mine are. Now we think about why."
year_published = 2015
