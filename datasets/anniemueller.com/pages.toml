["https://anniemueller.com/posts/im-glad-i-was-married-and-im-grateful-to-not-be-married-anymore"]
title = "I’m glad I was married, and I’m grateful to not be married anymore - annie's blog"
description = """
I started writing a comment in reply to Derek Sivers’ latest article. After the 3rd paragraph I realized it was a blog post, not a comment. So here it is. 

“Some..."""
full_description = "I’m glad I was married, and I’m grateful to not be married anymore I started writing a comment in reply to Derek Sivers’ latest article. After the 3rd paragraph I realized it was a blog post, not a comment. So here it is. Some of us want deep roots and stability, to live in the same place, with the same person, for life. I prefer variety, though I like the joke that goes: “I’ve slept with hundreds of women, and all of them were my wife.” That sounds nice. In all of my worldly adventures, a real marriage is one experience I’ve never had. —Derek Sivers, Have I been married I met the man I married when we were both young, just entering high school. We didn’t date1 then but had a thing for each other. We grew up as friends. Our families were close. We married after I graduated college. We set up house. Had babies. I expected to share my life, grow old, and meet death by his side and I was happy with that future. Sometimes I chafed at the restrictions, craved newness, wondered what might-have-been. But those feelings were irritations, periodic, minor. I loved growing up and growing old with someone, witnessing each other change, being close, building our family, intertwining our dreams, planning together, working to build what we dreamed and planned, having adventures with a partner, supporting each other, the comfort and warmth of years together, belly laughs with our kids, the depth of shared history. There are always new things to discover, too, but you have to go beyond the surface level to discover and learn with someone you know well. You have to care and seek and ask and really listen. I liked that challenge and the rewards of it: intimacy, not as a state you reach or a status you share but as an ongoing experience, something you nurture, something that grows and changes with you. And we both changed a lot over the course of our marriage, all 16 years of it.2 We left the church. Left Christianity. Moved far away. With great relief (and also a lot of guilt), I quit homeschooling and started working full-time. Built my own business. New places, new people, new community, new lifestyle, different roles, changed outlooks, but we were still together. Partners in life, whole-hearted, committed, growing together. Perhaps I should have seen it coming. But I didn’t. I was shocked and heartbroken when he revealed that he was no longer happy with our life, our marriage, with me. The pain of separation was visceral. I was fully committed to us, and had not bothered to keep any parts of myself separate or safe. I don’t think I could have even if I’d tried. We met so young, we married so young, and I hadn’t learned how to maintain myself while being intimate with another. I was quite binary in my relationships: off or on, in or out. Separating felt like emotional psychological disembowelment. Like a ripping apart, with all my tender insides spilling out, in pieces. Keeping myself separate and slowly disentangling my life, and then my self, from my marriage was excruciating. All that to provide context for this, the simple statement I wanted to make when I started writing that comment: I’m glad I was married. I’m glad I had that experience. It was good. It was worth the pain of that bitter end. I learned how to love deeply and well. I spent years living in intimacy with one person and was still thrilled to wake up beside him. What a special, unique experience. Whether our relationship was healthy, and good, and should have lasted as long as it did? Those are other questions. Questions I’ll be asking and attempting to answer for a while yet. Maybe always. I don’t know. For months it was all I could think about. Now it’s a small stream in a much larger current. That’s the other statement I wanted to make: I’m glad I was married and grateful for the experience of it. But I also realize now that much—perhaps all—of what I valued and enjoyed in marriage is available outside of marriage, as well. That’s been a really lovely surprise over the last 5 years. And it keeps unfolding. I feel like I keep receiving gifts, things I thought I had lost with marriage. They come in different forms, different wrappings. And many times they are offered in ways that are richer and deeper and freer than what we were capable of giving each other in our marriage. That has more to do with who we were, my then-husband and my then-self, than with marriage as a concept. But what is marriage except the two people who form it? I’m so thankful I didn’t stay with my first big love. I’ve had such wonderful relationships since then, beyond the ones named here. —Derek Sivers, Have I been married? One thing I don’t have the experience of, yet: romantic relationships with depth and intimacy outside of a marriage. I haven’t dated anyone seriously. I haven’t dated much at all. For a while it was unthinkable. Then I dated as a distraction from loneliness. Not a great approach; I decided I preferred loneliness. Now my life is full and I don’t have a lot of time to put into dating, let alone into a relationship. Also, I love my solitude. Loneliness comes and goes, but I know it will go; it doesn’t scare me like it used to. I value the quiet contentment of my life right now. I love the peace of making my own decisions, simple and unfettered. I love having all the space I want for my own dreams and plans. I love working slowly for what I want to experience, bringing little bits together, building my life with care and ease and a kind of openness that truly I have never experienced before. I am curious about what a relationship could be, at this point in my life, as who I am now. I miss romance and companionship and physical affection and having sex on a regular basis. I’d like to make space and time for those things without losing what I love about my life now. I imagine it’s possible. But it’s new territory for me, and I don’t have a map. It will be a learn-as-I-go process. I’m not sure it’s a process I want to begin now, or even soon, but at some point I will. I don’t expect I’ll ever want to marry again, though. There’s no wrong way to live a life except to not live it fully. We’re here and now. It’s joy and pain. I think happiness comes when we can be open to it all, the good and bad parts. I wouldn’t change the choices I’ve made or the life I’ve lived. Even the painful memories are precious. Endings we don’t expect are always on the horizon, and we don’t know which choices will lead to which endings. The map is not the territory. Everything is a risk. But love is always worthwhile. And we don’t know what an ending can begin. The reason I didn’t date at all—in high school or in college—is a whole different blog post but here’s a post by someone else that covers the basics. My experience was very similar. ↵ Technically we were married for 17 years but I don’t count the last year; we were separated 2 months after our 16th anniversary. The divorce process took over a year. ↵"
