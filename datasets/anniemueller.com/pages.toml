["https://anniemueller.com/posts/a-good-day-for-sandwiches"]
title = "A good day for sandwiches - annie's blog"
description = """
This morning I slept until a child whispered at me: “Mom. Mom. Almost 8. You gotta take me to school.” 

Right. On it. Rolled out of bed, threw on sweats,..."""
full_description = 'A good day for sandwiches This morning I slept until a child whispered at me: “Mom. Mom. Almost 8. You gotta take me to school.” Right. On it. Rolled out of bed, threw on sweats, blessed myself for having coffee ready to go. I respect all of y’all with the more elaborate high-quality coffee but I need a pre-set basic brew that percolates on a timer. Coffee in mug, out the door. We got to school before the coaches so we sat in the car for a few minutes. I did my little word games and texted my scores. My dad and brother-in-law and I have a group chat solely for texting our daily Wordle and Connections scores. I’m the worst at Wordle but the best at Connections so I got that going for me. Zeke now sent off to wrestling meet. I went home and stared at my unmade bed for a hard minute. Too late. I’m up and moving and half a mug of coffee into this day now. Shower, dress in real-people clothes, errands. Bought myself some new shoes which I’ve been meaning to do for like 6 months. Then it was time to meet my best friend for brunch at our standard spot, a diner called Uncle Bill’s that hasn’t been redecorated or updated in anyway (except prices) since like 1987. It’s glorious. I ate chicken-fried steak smothered in gravy and eggs over easy and we discussed all the important and dumb and good and infuriating and mundane details of life so now I’m okay for another week or so. Came back home and picked up Lily to go birthday shopping for friends. This is a mega-birthday weekend. Three different friends, three birthday celebrations: Friday night, Saturday overnight, then Sunday afternoon. Thinking about it makes me exhausted. If I had three friends who had three birthday parties on the same weekend I would just have to pick the one I liked most and send a card to the others. Lily’s up for it, though. She informed me that we no longer shop at Target because they are dropping a lot of minority-owned brands and their entire DEI program. I’m glad she’s keeping up with this stuff. We fume over things, find presents elsewhere, and scream FUCK YOU RACISTS at Target as we drive by. Maybe this is not the healthiest approach to living in these times but maybe it is also not the unhealthiest. Back home again. Chatted with Rob about his plans for the day. Lost my phone, spent 10 minutes looking for it. Found it on the bookshelf by the door. Snapped Mara a sped-up video of Gooby the cat purring. I have rudimentary Snapchat skills, used only to send my children 1 ) selfies of me while waiting in the car to pick them up and 2) random videos of our cats. I choose to believe that my snaps are the highlight of their every day. Rob left to go play pool. Lily got picked up for birthday party #2. I ordered groceries. Fiddled around on my computer. Cleaned the bathroom. Thought about making dinner. Realized no children are at home. Made popcorn. Watched an episode of Idris Elba being hijacked on a plane. Q: Can you be hijacked in other places or is hijacked a word we only use for planes? A: to commandeer (a vehicle in transit) BUT ALSO often, specifically : to commandeer (a flying airplane) usually by coercing the pilot (Merriam Webster). Hijack is a weird word. Phone buzzed. Zeke almost back, time for pick up. “Please don’t be late Mom, I’m so tired.” Hmm. He doesn’t usually mention being tired, it’s just a given after 10 hours at a wrestling meet. Okay. Threw on my giant foam emoji cloud slides because I’m not getting out of the car anyway, grab keys and phone, out the door. Pulled into school at the exact time the bus did from the opposite direction which gave me a disproportionate amount of joy. Child in car, heading home. Child tired. Child… sad? Not using that word, but yes. “Really tired,” and “Tough day.” Pit stop at the sandwich shop. I didn’t make dinner. I must feed my sad child. He waits in the car. I order the biggest sandwich with all the toppings and another smaller version for myself. Sit and wait. I left my phone in the car. A man paces, waiting for food. Paces. Paces. Paces. He looks unhappy. I wonder what can be so terrible about waiting for a delicious sandwich to be made for you. Another man walks in, leans against a wall. He looks nervous. He keeps checking the bay for his order. Two women walk in, talking. They order, stand to the side, chat, smile. One dances a little bit. The other grins. Unhappy man takes his order and leaves. He was here for about 10 minutes and didn’t smile the entire time. I hope the sandwich helps. I take my sandwiches and drive the short distance home. Zeke tells me about some of the parents at the meet. I start to hear the subtext of “tired.” I’m saying parents to try to be, um, diplomatic but it’s not parents. It’s dads, specifically. Zeke observing as a teammate loses a match then has to endure being berated by an angry father. How Dare You Lose A Match. As if this kid wasn’t trying. As if this kid lost on purpose. I have observed this phenomenon myself and found it deeply disturbing. I never know what to do. Zeke’s dad is not like this at all; when he’s there, he’s encouraging and supportive. Other dads, many, are there more often but it seems like it might be better if they weren’t there so often. Or at all. What is this? Zeke says, “Thanks for not being like that Mom, Some of those parents are real ops." I say Sure, of course. Then I say, “Name 5 feelings you had today.” Zeke says, “You’re being an op.” I say, “Yeah. Do it. Not getting out this car until you do.” It takes a few minutes. Tired, like angry, is the name for the feeling we put on top of so many other feelings. Home is warm and safe. I pour a glass of wine. The plane is still hijacked but the sandwiches are good.'
