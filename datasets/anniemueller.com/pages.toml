["https://anniemueller.com/posts/reading-notes-february-2025"]
title = "Reading notes: February 2025 - annie's blog"
description = """
The Mountain Between Us by Charles Martin   Meh.

Read this in one day. It was easy to read and I ended up skimming a lot of boring parts (all the flashbacks..."""
full_description = "Reading notes: February 2025 The Mountain Between Us by Charles Martin Meh. Read this in one day. It was easy to read and I ended up skimming a lot of boring parts (all the flashbacks to the main character’s relationship with his wife). The ending was not a surprise. Overall, just a big meh to this book. The survival situation was what interested me and there was some good stuff but a lot of it was skimmed over. “I made a sled out of the wing.” Okay, HOW? How did you make a sled out of the wing? You just pulled it off the plane? The medical parts were detailed and interesting, I don’t know how accurate though. I mean, I feel like they’d have both been dead by day 3 realistically but I wasn’t exactly there for the realism. Both characters were okay. I don’t know. They didn’t grab me. If they had died, I’d have felt nothing much. As it was, they survived but AT WHAT COST TO ME, THE READER? The dog was great, at least. Their whole love story was just trauma bonding, for real, and the guy’s I have big emotional barriers and am closed off to love schtick was not intriguing but DUMB and the ending was also dumb. I feel like this could have been a good book if it was mostly completely different. Be Not Far from Me by Mindy McGinnis Easy read, YA, teen girl main character. Set-up for our protag’s experience is annoying only because I myself am not a teenager. The survival parts (what I went for) are detailed and gritty, which I liked. Great? No. Enjoyable? Yes. The Nature of the Beast by Louise Penny She turned away and listened as Clara talked about what had happened. To Peter. It was a story Myrna knew well. She’d been there. But still she listened, and she’d listen again. And again. And with every telling Clara was letting go of a bit of the unbearable pain. The guilt she felt. The sorrow. It was as though Clara was pulling herself out of the ocean, dripping in grief, but no longer drowning. Can’t go wrong with Inspector Gamache. The Warbler by Sarah Beth Durst It’s okay to be optimistic, but I can’t let myself feel the stab of every disappointment—or I’ll leak from all the holes in my heart. Pretty writing, hometown magic vibe, slightly dark edges but happy resolution. No surprises, sweet characters. The emotional themes were hammered in about 40% more than needed, I felt. I skimmed a good bit. The Valley of Horses by Jean M. Auel Well, hm. So I love how Auel describes the landscape, the scenery, the seasons, the slow but inevitable huge shifts happening in nature. And I enjoy the detail of “bushcraft” provided (even with the unbelievable coincidences that happen with finding just the right thing at just the right time). Beyond that, the characters are okay, the dialogue is so-so at best and absolutely awful at worst. And then there are the sexy times. Look, I don’t mind a little spicy action in a book, but I can only read about “his manhood” so many times in one book. DNF Neom by Lavie Tidhar Interesting world but just not the feel/mood for me right now. Couldn’t get into it. The writing is great. I might revisit this one at some point. Gideon the Ninth by Tamsyn Muir Might come back for this one another time. She didn’t. She got the depression. She lay in her cell, picking at life like it was a meal she didn’t want to eat. The Crash by Freida McFadden Fine. Okay. I got bored. Radical Compassion by Tara Brach This book could have been a blog post."
year_published = 2025
