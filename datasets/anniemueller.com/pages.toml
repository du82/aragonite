["https://anniemueller.com/posts/talk-about-the-thing-itself"]
title = "Talk about the thing itself - annie's blog"
description = """
God help me, fediverse, we have got to stop being so pedantic. 

In university, I got a degree in English. I expected lots of reading, lots of writing, and lots..."""
full_description = "Talk about the thing itself God help me, fediverse, we have got to stop being so pedantic. In university, I got a degree in English. I expected lots of reading, lots of writing, and lots of talking about reading and writing. I was pretty excited to get past my first year courses and into the really good stuff, where it would be mostly classes full of students who, like me, wanted to do lots of reading and writing and talking about reading and writing. And all that turned out to be true but my friends in college turned out to be not those students1 in those classes with me. Because they were all annoying as hell. Reading wasn’t about stories and beauty and truth and shared human experience but about picking apart the tiniest details of symbolism and word choice and layers of self-referential literary context. Writing was about showing off how much you knew about all that stuff. Discussions mostly devolved into who could cite the most obscure literary references. BOOOOOOOOOORING. Look, I love a good sentence diagram (truly). Obviously, context matters. And sure, a big part of studying literature and writing is understanding the forms and rules of the craft. But those things form the structure built around the thing itself. The thing itself is reading and writing. The magical thing we do, as humans, of communicating across time and space and culture and lifetime and language via the written word. The structure exists to support and serve the thing itself, not the other way around. Here are two things I see all the time on the fediverse: Discussions/posts about the structure of the fediverse Discussions/posts about how dumb/awful it is to use non-federated anything Both of those things are swell, unless they’re used as introductory material to the fediverse. The structure of the thing is not the thing When I introduce you to my friend, I don’t say: “This is Angela. She’s made of bones that connect to each other with cool joints so she can bend her skeleton. On top of the bones, she’s got muscles! And then there’s skin, which is the part you see now! The skin is important because it holds everything together and lets you interact with Angela without being all grossed out.” I say something like: “This is Angela. I know her from college. She’s into geology, like you.” Name. Commonality. That’s all you need to form the beginnings of a connection. Not an explanation of Angela’s inner structural workings, thank you very much. From the perspective of a U.S. English speaker, here are some words that people outside the fediverse are mostly not familiar with: instance federated interoperate decentralized protocol servers microblogging and definitely not activitypub, good God. They’re familiar with (some of) those words, but they’re not using them the way you are, inside the fediverse. Federated means something about the government. Instance means a kind of generic example and is mostly used in the phrase for instance. Servers are people who work in restaurants. Understanding first, precision later I understand that many people on the fediverse are part of building and maintaining the structure of it. That is so important and amazing. I am not trying to demean that work. Obviously, without it, we wouldn’t have the fediverse at all! And I would be very sad about that. When you know the inner workings of a thing and you want to talk about it with other people who also know the inner workings, you use precise terminology. You have to, in order to communicate effectively in the context of shared, specific knowledge. But other people—i.e. most of the global population—do not need such specificity. They need basic understanding. Using precise terminology with a general audience hinders understanding. Plus, it makes people feel dumb. People don’t like to feel dumb. To teach a new concept, you need to link it with a known concept. Start with broad terms; use analogies; link ideas; establish basic understanding and generate interest. Then, and only then, can you start introducing precise terms. But you probably don’t even need to go that far. You don’t get people excited about a novel by describing how the author uses varying sentence structures and layered symbolism. You get them excited about the book by describing the plot, the characters. What is the plot of the fediverse? Who are the characters? What is the hook? An invitation, not a soapbox Demeaning people because they use non-federated platforms is the dumbest marketing ploy I have ever seen. By which I mean: It is anti-marketing. You are alienating your audience. Quit talking about how bad other places are and focus on how awesome the fediverse is. What people are really looking for is connection, community, and cool stuff on the internet. Tell them about how they can find those things on the fediverse. Tell them about the connections you’ve found. The communities you’re part of. The cool stuff you see and share. Humans have an amazingly high tolerance for predictably awful situations. We want things that are familiar. We are risk averse, as a species, and change is inherently risky. People who are still on Instagram or whatever may dislike a lot about those platforms, but two things are true: 1) They’re still getting some value, and 2) They know what to expect. To motivate them to move into something familiar, don’t explain how awful what they’re doing is. They already know and they’re still using it2. At a basic level, people take action to escape pain (or the threat of pain) and to get rewards. But action itself has a cost: Energy. Action that induces change has a reverberating energy cost plus the (risk of) pain: It’s often destabilizing, upsets our routines, creates uncertainty, creates confusion, makes normal things more difficult, removes access to things we enjoy, changes our social connections, and takes away familiarity. So there’s a formula3 (don’t @ me, I’m not a mathematician) that’s something like: The pain you’re escaping (PAIN) has to exceed the cost of taking action (C0ST). If COST > PAIN, no action. And/or the reward you’re expecting (REWARD) has to exceed the cost of taking action (COST). If COST > REWARD, no action. There’s also the value they’re still receiving (VALUE) factor. If VALUE (of staying) > REWARD (of changing), no action. Or some combo, right: If VALUE - PAIN > REWARD - COST, no action. I’m sure that’s not the correct way to write it out, sorry, you get it. When you say things like: “HEY THAT PAIN IS PAIN! WHY ARE YOU STILL BEING IN THE PAIN?” It’s not really helpful. They know it’s pain.4 They’re already in the pain. It’s just not painful enough yet, OR they don’t know how to escape the pain, OR the value (perceived or real) is greater than the pain, OR the cost of changing is greater than the reward for changing, etc. Things that do help: Minimize the cost of taking action. (Make it easy. Make it simple. Make it fast. Make it certain.) Demonstrate equal value. (You can get the same or equivalent thing here that you’re getting there.) Hype up the reward. (It’s fun! Niche interests! Find your people! Make cool friends! Share your interests! Supportive communities! Jokes! Neat discussions! Etc!) For most people, social media is a low-stakes game. It’s an easy way to be entertained and feel connected. They don’t want to think about it. They don’t want to work at it. They want to use it without effort. They have to put effort and thought and work into a lot of other things, high-stakes things, like My Job and My Health and My Family and so on. They don’t want to adopt a new philosophy or learn a new terminology and this is perfectly okay. They want to watch cat videos and laugh and feel a little less alone and maybe learn something cool. You and I can help them do that in a better place by easing the transition from the familiar pain of social media platforms to the unfamiliar potential of the fediverse. But please, I am begging you, let’s find better words words than “a decentralized federated social network of independently hosted instances” to do it. 🙃 Here are some other suggestions. 📨 🔁 💬 Respond via email / Mastodon / Micro.blog With one exception: Angela. She was a student in English with me and she was cool then and she’s cool now and we haven’t seen each other in decades but we stay vaguely connected via…. non-federated social media. Yep. That’s right. ↵ If they don’t know or perceive the slop of algorithmed, corp-owned social media as painful, my take is: This is not your target audience. Save your fediverse-converting energy for the folks who, at minimum, share enough values with you to recognize at least some of the same pain points. ↵ Please see Platform Switch Decision Formulas from Alexander for a much better version. ↵ If they don’t know or perceive the slop of algorithmed, corp-owned social media as painful, my take is: This is not your target audience. Save your fediverse-converting energy for the folks who, at minimum, share enough values with you to recognize at least some of the same pain points. ↵"
