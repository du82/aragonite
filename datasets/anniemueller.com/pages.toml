title = "Inconclusive neck region - annie's blog"
description = """
“Wisdom is the reward for surviving our own stupidity.

—Brian Rathbone”

Why is entropy so boring?

Here's a thing that happens to me sometimes: I am doing something mundane, perhaps..."""
full_description = '''Inconclusive neck region Wisdom is the reward for surviving our own stupidity. —Brian Rathbone Why is entropy so boring? Here's a thing that happens to me sometimes: I am doing something mundane, perhaps tying my shoe or reaching for an object or using my eyes to look at the world around me and in that simple task I do a thing that my neck doesn't like. What is the thing? I don't know. It seems to be "moving my neck" or perhaps it is "not moving my neck when I should be moving my neck." Communication from the neck region is inconclusive. Pain from the neck region: conclusive. Conclusive that whatever it is I did (or didn't do) is displeasing to the neck region. I did it again this morning. In the three-minute interval between getting out of bed and walking into the other room I had the audacity to think I could clothe myself without injury. Nope. I'm not sure if it was my bra or my socks or my goddamn yoga pants but the neck region did NOT enjoy the putting-on process of at least one of those items. Side curse: you will always say "goddamn yoga pants" now. You cannot ever say yoga pants again without saying (or at least thinking) "goddamn" first. And! You cannot SEE yoga pants without thinking: "goddamn yoga pants." Enjoy. The angry pain of the neck region will fade in a few hours or a few days, if the pattern holds. And I'll forget about it, until the next time I do something crrrrrrazy like bend from the waist to pick up my shoe. If my body is going to respond with extremes when I do basic movements, couldn't we have something cooler than weird neck pain? Like: what if I sprouted feathers (temporary) instead? Or one arm had blue stripes for a while? Or my knees made a weird squeaking noise for a few days? Or what if I could hover, but only for a few seconds at a time and not consistently? It would make aging a lot more exciting. Goddamn yoga pants.'''
