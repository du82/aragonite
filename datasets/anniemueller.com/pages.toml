["https://anniemueller.com/posts/if-you-dont-somebody-else-will"]
title = "If you don’t, somebody else will: - annie's blog"
description = """
WorryYou can worry about everything in the world or you can let somebody else do that. There are always eager volunteers for the worry patrol.

Either way, it won’t make..."""
full_description = "If you don’t, somebody else will: Worry You can worry about everything in the world or you can let somebody else do that. There are always eager volunteers for the worry patrol. Either way, it won’t make a difference except for how often you get headaches. Freak out Go ahead. Sometimes you want to. Sometimes you need to. But if you don’t want to, you can let somebody else take over the freak-out role and you can take a nap instead. Handle shit Might be your own shit. Might be someone else’s. That seems like a key distinction to make. Set your boundaries Parents set boundaries for their children, usually. Sometimes in a good way, sometimes not so good. Then the children grow up and find with shock, “Wait? What? I have to set my own boundaries now?” It can be hard to do if you haven’t had any practice. And there are plenty of people who will do it for you, if you’d like! Usually, letting someone else set your boundaries means you don’t actually have any boundaries. You’re permeable. And you get taken advantage of, even by well-meaning people. This leads to resentment. Resentment kills all sorts of things, including relationships. Anyhow, if you don’t solve the set-your-own-boundaries thing, the cycle will repeat. Why should someone else be responsible for your boundaries? Decide what things mean Nothing has meaning except for the meaning you believe it has. You can decide that for yourself. Or you can adopt-a-meaning. There are many places to find ready-made meanings for anything at all, ever. If you like those meanings, great. Be aware, though: predetermined meanings come with obligations and expectations. DO YOU WANT THOSE, TOO? Set your mood Maybe you’re up. Maybe you’re down. Letting somebody else set your mood can be great: you’re down, they come and raise your spirits. Letting somebody else set your mood can be awful: you’re up, they come and rain negativity and anger until everybody’s down, down, down. Maybe you’re down, and you need to deal with some shit in that down-space, and you need to learn how to give yourself space and time and permission to not-be-okay when you’re not okay. Maybe you’re up, and you need to learn how to pull back from emotional vacuums enough to stay up, stay in your own mood, stay where you want to be no matter where someone else is. This is difficult. I think it may get easier with practice. Run your life It’s true. If you don’t, somebody else will."
