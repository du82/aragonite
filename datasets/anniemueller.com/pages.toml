["https://anniemueller.com/posts/a-brief-history-of-my-blogging"]
title = "A brief history of (my) blogging - annie's blog"
description = "Xanga. The gateway blogging drug for me. College years, so 1999-2003. What did I blog about? I have no idea. My memories are…. very sparse. I remember using Xanga, having..."
full_description = "A brief history of (my) blogging Xanga. The gateway blogging drug for me. College years, so 1999-2003. What did I blog about? I have no idea. My memories are…. very sparse. I remember using Xanga, having friends who used Xanga, and ostensibly regularly posting there. I’m sure I had really wonderful insightful things to say. Alas, we will never know. Then a foray into Linux and Joomla. That was… something. I got married in 2004 and my shiny new husband was super-into Linux and convinced me to try it and so I did and now I can say I tried. The things we do for love. The useful knowledge I accrued during this experience: How to get my own domain and set up hosting. We set up a little family domain that we kept for several years and is now lost to the ravages of time. This is not a great loss. (Because Joomla.) What did I blog about? Not much. I did a good bit of writing but it was mostly offline. (Because Joomla.) 2006-ish onward: Wordpress. I had enough of Linux at some point, moved from a desktop to a laptop, and found Wordpress. What a revelation. It was clean, simple, intuitive, fun to use. I set up my own domain and started a blog. What did I blog about? How to be a good Christian wife and (soon thereafter) mother. I was deep in religion. I was earnest. I was trying so very hard. Alas, these stellar posts which were (I’m sure) full of absolute gems of wisdom are now lost forever. Let us have a moment of silence (and breathe a sigh of relief). 2012-ish: I was done having babies and freelancing as much as possible while raising the babies I’d had and decided it was a good time to start another blog. Because of course. So I did. I bought another domain, set up another Wordpress site, and was off and running: FreakishlyProductive.com. The domain is enough to tell you where my head was at. (Hint: Nowhere very balanced, or sane.) This is such a crazy time to look back on. I gave birth to four children between 2006 and 2011. That is the definition of freakishly productive. So I guess I was just going with the theme. So in 2012, while raising four kids under the age of 6, I was like: Hell yeah I’m gonna blog more! One time my therapist was like, “I think you’re kind of an all-or-nothing person,” and that makes more sense now. Anyhow. That domain and its contents are now lost, also, as far as I know. If you search freakishly productive you’ll get some Annie Mueller references. Those were fun times, really. Freelancing and maintaining a blog while raising (and then homeschooling) a bunch of kids is absolutely unhinged, in retrospect. But at the time it was also what kept my brain intact, gave me something that felt like mine, helped me protect the parts of myself that often felt absolutely drowned in diapers and dinner and playgrounds and tantrums and trying to match tiny socks and so! much! laundry! and never enough sleep, etc. Somewhere in there, maybe 2014-15, I bought my own name domain: anniemueller.com. Shortly before we moved to Puerto Rico in 2016, I shut down my productivity site. I started blogging at anniemueller.com, on and off, with varying themes and varying consistency, but that’s where I’ve been since. I stuck with Wordpress and was moderately happy with it until about 2018 (because Gutenberg). Since then I’ve been jonesing for elsewhere but life kept being life and blogging was not high enough on the list of things-to-deal-with to get that kind of attention. Now, apparently, it is. And that is lovely to me, because it’s something I’ve loved since I discovered it, and I’ve stumbled and meandered my way through my own evolution to right now: having gotten past the survival stage of parenting, having experienced some unexpected and unwanted yet ultimately positive changes, having cleared a good bit of clutter out of my own life, which means having more time for what I like doing. And now, with that time: having moved my blog to Pika and being delighted with the simplicity and ease of it, having connected with many delightful people who also value blogging, I am having a good time. I hope you are too! 📨 🔁 💬 Respond via email / Mastodon / Micro.blog"
year_published = 2024
