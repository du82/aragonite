full_description = "Blog challenge - Music edition 🎶 This was fun. I was tagged by @mb (here’s his) and it only took me like 3 weeks to finally get it done. 🎶 What are five of your favorite albums? Alanis Morissette, Jagged Little Pill (1995) Ms. Lauryn Hill, The Miseducation of Lauryn Hill (1998) Future Islands, Singles (2014) System of a Down, Toxicity (2001) Rainbow Kitten Surprise, How to: Friend, Love, Freefall (2018) Honorable mention: Black Sabbath, Paranoid (1970) Moby, Play: The Complete Recordings (1999) Sudan Archives, Natural Brown Prom Queen (2022) ZZ Ward, Til the Casket Drops (2012) Lola Young, This Wasn’t Meant For You Anyway (2024) It’s so hard to choose, here’s a longer list. What are five of your favorite songs? Lady Lamb, We’ve Got a Good Thing Going Elvis Costello, She Mac Miller, Good News Nina Simone, Feeling Good Dio, Holy Diver Favorite instrument(s)? Guitar. And cello. What song or album are you currently listening to? Peaches by grandson and K. Flay Do you listen to the radio? If so, how often? I have not listened to the radio voluntarily since I got bluetooth capabilities in my car. How often do you listen to music? All day, every day. For work, I’ll listen to instrumental music if lyrics get distracting: Electronic (techno, trance, drum and bass, lofi hip hop, downtempo), cello, guitar. I also love a good selection of 1970’s soul and/or belt-it-out powerhouse women for my making dinner soundtrack. How often do you discover music? And how do you discover music? I add to my playlists and follow new (to me) artists frequently. My kids share stuff with me. My friends share stuff with me. I ask people what they like. I lurk on Album Whale. And occasionally Spotify will throw me a winner. What’s a song or album that you enjoy that you wish had more recognition? Three albums: Alejandro Aranda, Unplugged - he’s a great musician and this album is beautiful. Dorian Electra, Fanfare - I listen to this album on repeat and usually end up stomping around the room in a joyful rage. Cherry Glazerr, Apocalipstick - grungy garage rock with floaty vocals, what’s not to love. What’s your favorite song of all time? This is an impossible question and I refuse to answer it. Favorite song for what? Taking a roadtrip? Having a good cry? Dancing till I collapse? Car karoake? Feeling all the feels? Cooking up a vat of stew? Casting a few spells? Smoking on the balcony? Walking briskly in the crisp fall air? Lazing by the lake on a summer afternoon? AS IF I COULD PICK ONE SONG. Has your taste in music evolved over the years? Well I’ve always loved strong vocals and grungy guitar riffs. And a couple of my favorites (Alanis and Lauryn) have been with me since my high school days. But I’m definitely more expansive in what I listen to and enjoy. 📨 🔁 💬 Respond via email / mastodon / micro.blog"
