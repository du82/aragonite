["https://anniemueller.com/posts/despite-the-horrors-the-laundry-must-be-done-despite-the-laundry-the-horrors-must-be-faced"]
title = "Despite the horrors, the laundry must be done; Despite the laundry, the horrors must be faced. - annie's blog"
description = """
What’s the situation, and what can I do about it?

There are two steps I need to take when there’s something upsetting but complex to deal with: a situation outside..."""
full_description = "Despite the horrors, the laundry must be done; Despite the laundry, the horrors must be faced. What’s the situation, and what can I do about it? There are two steps I need to take when there’s something upsetting but complex to deal with: a situation outside of my scope, or a crisis, an emergency, financial issues, global changes or things I don’t understand or relational conflict or whatever. I remind myself of a few things. I try to approach it with two specific tools in hand. First step: Reminders to self These are the things I need to be reminded of when I am in the midst of an upsetting, confusing, overwhelming situation: I have made a choice to not let fear be the dominating force of my life. My life is better when I believe in free will. I set the trajectory of my own life with each tiny decision I make. How I feel does not have to determine how I act. Action without clarity tends to increase confusion. There are a few other things but those are the main ones. Second step: Fight with tools The two little alliterative phrases below are shorthand for four beliefs I’ve chosen to adopt that help me live the way I want to live. Absolute acceptance Absolute acceptance means I do not avoid the reality of the situation. I need to assess what is happening, being as honest as I can. I need to quit trying to pad the sharp edges or painful parts of what is unfolding. I need to avoid exaggerating anything, either. Along the way, as big feelings or fears rise up in response to that honesty: I allow them, note them, but try not to dwell in them. Radical responsibility I am the only person responsible for my life: my choices, the way I use my time, my perspective, the roles I allow myself to take on, the way I use my resources, what I say Yes to, what I say No to, how I think, what I allow myself to dwell on, what I offer, how I honor my own limits, how I care for myself, how I contribute to my community, how I allow others to treat me, what I tolerate, what I stand up for, what I believe (both conscious and unconscious) and how those beliefs drive my behavior, etc. What’s the situation and what can I do about it? Absolute acceptance helps me find clarity. For any situation, there are three points of clarity to look for: What’s the situation? The factual reality unfolding. Who is doing what, when, how, why; what are the effects? What’s my reaction? My feelings, fears, initial thoughts, and instincts. What’s the reality? The limits/scope of the situation, and where I fit in. Once I have clarity, I’m able to move into figuring out what I can do about it. What can I do? What’s within my power? What am I responsible for that is part of this situation? Where do I have authority, and where am I encroaching on someone else’s authority? What (of mine) needs to be protected in this situation? What am I responsible for that is outside of this situation? How will involving myself in this situation affect my life in other areas? How will failing to involve myself in this situation affect me or others? Who do I want to be in this situation? What can I offer? What am I not able to offer? This seems like a long process, but it can go pretty quickly. Here’s an example from a recent situation (modified to hide personal details). I usually just open up a blank note and start writing. Someone I love is facing a major health issue. It’s been diagnosed and is resolving but recovery is very slow. Their energy and abilities will be very limited for months. This will be super tough; they are a busy, active person with a lot of responsibilities and interests. (That is the situation.) I empathize deeply with this person. I know it will be very difficult for them to rest, to release their normal routines and responsibilities, to accept help, to do less. I want to offer to step in and take things on. I want to help by providing some of the energy and ability they don’t have right now. I want to ease the situation as much as possible by filling in some of those gaps. (That is my reaction.) I have many responsibilities of my own. When I actually look at my calendar, there is very little open time in it. I don’t have time or ability to take on more ongoing tasks or responsibilities without shirking my own. This isn’t a quick-fix situation where I can put my stuff on hold for a few days and then catch up. (That is the reality.) I can’t do as much as I want. I can do this: visit, bring a little treat, sit and listen, text and check in. I can listen to the frustrations as someone outside the immediate circle who’s not affected by them. I can offer an outlet (as I’m able to provide that attention & emotional space). At some point, when they’re up to it, I can schedule and plan an activity they like so it’s not a burden, just an enjoyable break. (This is what I can do.) Am I overthinking it? Maybe. I don’t think everyone needs this kind of process. But I know that I do. For most of my life, when I’ve faced upsetting or confusing situations, I have acted according to whatever I believed would ease the tension, avoid the conflict, make people comfortable (even if I made myself terribly uncomfortable), and get us back to the familiar, normal, predictable places. In other words, my reaction was to seek safety in the ways I knew how. That’s a great response mechanism sometimes. It’s a terrible response mechanism all of the time. It’s a good response mechanism if, in that situation, safety is the highest priority. Otherwise, it’s a terrible response mechanism. To keep myself defaulting to this response, to make needed changes in my own life, to escape the cycles of placating and self-martyrdom and other dumb shit, I’ve had to get really specific with myself. I need to spell out the way I want to respond to things so I don’t fall back into the way I used to respond to things. So that’s what I do now. The horrors and the laundry Russia invaded Ukraine in 2022. Russia, under the leadership of dictator Putin, is actively trying to take over the independent nation of Ukraine. The current president of my country has just, like a diabolical puppet, attacked, accused, and denigrated President Zelensky. The current president of my country is clearly on Russia’s side, having been bought by their interference in elections. My beloved country recently sided with fucking North Korea. My beloved country is being used by Putin for his own ends and everyone at high levels of government is either okay with it or seems helpless to counteract it. The lack of support from the U.S. may well result in Ukraine losing this war to Russia, after fighting so valiantly for so long. My beloved country is a tool for dictators. My beloved country is being ransacked by billionaires. (This is the situation.) I am sick with the knowledge of it. I feel helpless and enraged. I am sad and sick and disgusted. The more I hear about what the republican regime is doing, the more sick and overwhelmed and disgusted and enraged I feel. I am afraid of what four years of this administration will do. I am so afraid of the damage that will be done, both here at home and around the world. I am afraid of what will be lost that cannot be recovered. I don’t know how to talk to republican regime supporters about this. I don’t know how to talk to my own family members. I feel as if we have become so separated; our worldviews seemed to have some overlap before but now seem to only be opposed. I don’t know where to find common ground. I am grieving the loss of hope in my country, trust in my fellow citizens, and closeness with people I care about. (That is my reaction.) My own powers in this situation feel minimal. The pressures and responsibilities of my own life have not eased up. In fact, if anything, they have increased in urgency. I don’t know what I can depend on as I try to care for myself and my children, so I’m trying to earn a little more and save a little more in case we, say, lose our health insurance. Meanwhile, every single day there is new ego-fueled, disgusting, destructive, thoughtless bullshittery rolling out of the White House. If I allow much attention to go into keeping up with each nauseating development, I will not be able to maintain the energy, ability, focus, and calm I need to be there for my kids, do my job, and live my life. Despite the horrors, the laundry must be done. My time, attention, and money are very limited resources; I have important (for me) responsibilities and commitments; my scope is small. Yet I also have other responsibilities. Despite the laundry, the horrors must be faced. I have important roles in this reality, as overwhelming as it is: As a citizen of my communities, to protect those who are hurt/in danger as I am able; as a citizen of my country, to influence it for good in whatever way I can; as a citizen of my world, to be a good neighbor to the extent of my power. (This is the reality.) What can I do? I can make 5 phone calls. I can make donations, however small, to Ukraine, to the Internet Archive, to Advocates for Trans Equality, to other worthy causes. I can speak up in any conversation I’m part of. I can refuse to overlook or normalize hatred. I can call out bullshit as bullshit. I can get to know my neighbors more and make sure they know I am a safe person if they are in danger or need help. I can make sure my kids let their friends know the same. I can keep talking to my kids to make sure they have key vocabulary and concepts to accurately parse the information they receive. I can keep stockpiling certain medicinal items that may not continue to be available. I can remove my money from cowardly corporations that decide to endorse racism. I can remove my attention from billionaire bullshit platforms and choose carefully where I put it. I can be led by those living the experience so that my support is effective and meaningful. I can get real fucking radical about protecting my time, attention, and resources so that I’m not wasting them on things that don’t have an impact. I can focus my efforts without guilt, and be okay if others don’t understand my choices. I can write and keep writing. I can create and keep creating. I can encourage others to do the same. I can check in on my friends. I can keep trying to have conversations with the people I care about who see things differently because we all need to face the horrors so we can turn this thing around. I can keep learning and being open so I can find more ways to take action and still get the laundry done. I’ll keep adding to this list. Please feel free to share your own links, ideas, actions if you’d like. 📨 🔁 💬 Respond via email / Mastodon / Micro.blog"
