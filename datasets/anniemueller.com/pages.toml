title = "In praise of creating crap - annie's blog"
description = """
See also: Share your shit, and Don’t wait for tomorrow - Start now, and Please please please please please please share your big dumb beautiful self with the world

Humans are easy..."""
full_description = "In praise of creating crap See also: Share your shit, and Don’t wait for tomorrow - Start now, and Please please please please please please share your big dumb beautiful self with the world Humans are easy to make fun of. We are silly creatures. We are so obsessed with being creative that we give ourselves panic attacks, and freeze up. It’s not a problem with skill. No, really, it isn’t. A skill can be gained, learned, improved. A skill is used or not used. It’s the desire to be creative that fucks it all up. The worry, the nagging doubt, the uncertainty that we are creative… it locks us up. It makes using our favorite skills an absolutely torturous experience. No, it’s definitely not a problem with the skill. It’s a problem with expectations. Expectations, in general, are annoying and boring and a drag. They slow us down. But the “I need to be creative” expectation, well, it’s a real winner. A special one. It’s a heavy expectation, but it’s based on a vague goal. It sets a standard we can’t clearly see. Then it says: Meet that standard or you are not worth shit. This is like deciding to run a race with no idea how long the race will be, then feeling bad about yourself if you don’t win. Being creative has gathered all sorts of connotations and associations. It feels like the epitome of what we want to do with these skills we love and have worked hard to gain. We don’t want to sell out! We don’t want to make shoddy stuff. We don’t want to be poor craftspeople. We don’t want to be cheap. We don’t want to be hacks. But what does it mean to be creative? That’s the standard we’ve set, but it’s a tough standard to define. So let me save us all some trouble and define it: To be creative is to be someone who creates. To create is to bring (something) into existence. If you bring a truckload of color-by-number Elvis paintings into existence, you have been creative. If you write twenty-seven haikus about your dog’s vomit, you have been creative. If you pick up the guitar gathering dust in the corner and pluck a few strings and hum a few notes, you have been creative. If you write an utterly predictable listicle about the 30 best kinds of cheese with click-bait headlines and poorly chosen GIFs, you have been creative. (That’s actually a listicle I’d be interested in reading, so if you write it… let me know.) If you open a blank document and write your own name 100 times, you have been creative. If you make a delicious meal of macaroni and cheese, you have been creative. If you build a sculpture out of dried-up Sharpies and junk mail, you have been creative. Something did not exist. You made it exist. You are a god. You have the power. You created. This is all there is to it. I am super proud of you and I wish you would relax and treat all your creative work exactly this way. You were born creative, you moron. You don’t have to do anything to be good at it. You don’t have to do anything else but keep creating. Sit down (or stand up, whatever) and use your skill to make whatever kind of crap seems interesting to you in the moment. All the rest: the hazy ideas of originality, the vague standards, the flags we wave, the fancy words we spew, the disconcerting feeling that everything’s been done before… All of those are trash. I mean, that disconcerting feeling is spot on. Everything has been done before, one way or another. Humans have been creating since we figured out how to make pointy sticks. We’ve been carving stuff on stone, painting shit in caves, sculpting giant things, turning clay into pots, composing epic poems about monsters and battles and love, weaving baskets and stories, and we’ve never stopped. Why would we? It’s fun. It’s how we invented our civilizations (which, to be fair, are still quite a work in progress, with major bumps on the road; however, we persist). All of this is being creative. Listen. This is important, so pay attention. The value of creativity is not in the quality of what you create. The value is in the act of creativity itself. The value is in the energy you spend, and the fact that you spend that energy bringing something into being rather than tearing something (or someone) apart. Creativity is a force. It is a power. It is the path toward light and growth. If you are creating, you are not doing other negative stuff with your energy (like destroying or criticizing or sinking into a lethargy so deep that even a new pack of Sharpies won’t pull you out). I don’t care what you create. I care that you create. Something. Anything. I don’t care if anybody likes it. I don’t care if you like it. I don’t care if you like what I create. I get a huge kick out of creating. I’m going to keep doing it. I create all kinds of stuff. A few things maybe are lasting and good and will stick around. Most of them are crap. That’s okay with me. I like creating and I’m going to keep creating more. I hope you will, too. Being creative is part of being human. It’s how you know you’re alive. And it’s how you contribute. How you influence. How you have some input about the civilization we’re currently building. I am optimistic by nature. I am optimistic even when I should probably be realistic. I am optimistic to the point that I could be laying on the ground with a knife sticking out of my chest and blood bubbling from my lips and I’d probably be murmuring, “I feel okay, it’s not that bad, just give me a sec,” right up to the moment I died. But listen. The world we build is up to us, all of us. And I don’t know a lot about a lot of things, but I do know this: In order to build something, like a better world, we have to believe it can exist. We have to believe it is possible. So I am going to keep on being entirely too fucking optimistic, because that is part of what I am here to bring to the world. And you? You are here to bring yourself to the world. As for me and my house, we will remain optimistic. And I will keep making crap until the day I die. Because it’s not enough to believe. We have to do. We have to make. We have to build. How professional you are doesn’t matter. The heart of it is what matters. Now go make some crap. This was originally a newsletter back in April 2019 that I sent to maybe 50 people. Anyway I’m closing down the Substack archive and moving the good stuff over here so I brushed this one off and polished it up and took some stuff out and added a bit here and there and anyway, here it is now, again. 📨 🔁 💬 Respond via email / Mastodon / Micro.blog"
