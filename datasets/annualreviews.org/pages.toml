["https://annualreviews.org/content/journals/10.1146/annurev-psych-030123-113559"]
title = "The Moral Psychology of Artificial Intelligence | Annual Reviews"
description = "Moral psychology was shaped around three categories of agents and patients: humans, other animals, and supernatural beings. Rapid progress in artificial intelligence has introduced a fourth category for our moral psychology to deal with: intelligent machines. Machines can perform as moral agents, making decisions that affect the outcomes of human patients or solving moral dilemmas without human supervision. Machines can be perceived as moral patients, whose outcomes can be affected by human decisions, with important consequences for human–machine cooperation. Machines can be moral proxies that human agents and patients send as their delegates to moral interactions or use as a disguise in these interactions. Here we review the experimental literature on machines as moral agents, moral patients, and moral proxies, with a focus on recent findings and the open questions that they suggest."
full_description = "Home A-Z Publications Annual Review of Psychology Volume 75, 2024 Article Annual Review of Psychology Volume 75, 2024 Review Article Open Access The Moral Psychology of Artificial Intelligence Jean-François Bonnefon1, Iyad Rahwan2, and Azim Shariff3 View Affiliations Hide Affiliations Affiliations: 1Centre National de la Recherche Scientifique (TSM-R), Toulouse School of Economics, Toulouse, France; email: [email protected] 2Center for Humans and Machines, Max Planck Institute for Human Development, Berlin, Germany 3Department of Psychology, University of British Columbia, Vancouver, British Columbia, Canada Vol. 75:653-675 (Volume publication date January 2024) https://doi.org/10.1146/annurev-psych-030123-113559 First published as a Review in Advance on September 18, 2023 Copyright © 2024 by the author(s). This work is licensed under a Creative Commons Attribution 4.0 International License, which permits unrestricted use, distribution, and reproduction in any medium, provided the original author and source are credited. See credit lines of images or other third-party material in this article for license information info Info Article information Full-Text Figures & Tables References (152) Cited By Supplemental Material list Sections PDF + 7-day HTML access to article Article file format pdf download PDF build Tools Tools Add to my favoritesFavourites Create Publication Alert Create Citation Alert Create Correction Alert Export citation BibTEX Endnote Zotero Medlars RefWorks Mendeley Recommend to library Permissions share Share Share Abstract Moral psychology was shaped around three categories of agents and patients: humans, other animals, and supernatural beings. Rapid progress in artificial intelligence has introduced a fourth category for our moral psychology to deal with: intelligent machines. Machines can perform as moral agents, making decisions that affect the outcomes of human patients or solving moral dilemmas without human supervision. Machines can be perceived as moral patients, whose outcomes can be affected by human decisions, with important consequences for human–machine cooperation. Machines can be moral proxies that human agents and patients send as their delegates to moral interactions or use as a disguise in these interactions. Here we review the experimental literature on machines as moral agents, moral patients, and moral proxies, with a focus on recent findings and the open questions that they suggest. Keyword(s): agent, AI, AI-mediated communication, algorithmic bias, artificial intelligence, blame, cooperation, delegation, ethical dilemmas, humanization, morality, patient, psychology, value alignment Article metrics loading... /content/journals/10.1146/annurev-psych-030123-113559 2024-01-18 2025-03-05 Download as PowerPoint Full text loading... /deliver/fulltext/psych/75/1/annurev-psych-030123-113559.html?itemId=/content/journals/10.1146/annurev-psych-030123-113559&mimeType=html&fmt=ahah [Citing articles] [Web of Science] [Medline] Literature Cited Angwin J, Larson J, Mattu S, Kirchner L. 2016. Machine bias. ProPublica May 23. https://www.propublica.org/article/machine-bias-risk-assessments-in-criminal-sentencing [Google Scholar] Awad E, Dsouza S, Bonnefon JF, Shariff A, Rahwan I. 2020a. Crowdsourcing moral machines. Commun. ACM 63:348–55 [Google Scholar] Awad E, Dsouza S, Kim R, Schulz J, Henrich J et al. 2018. The Moral Machine experiment. Nature 563:772959–64 [Google Scholar] Awad E, Levine S, Anderson M, Anderson SL, Conitzer V et al. 2022. Computational ethics. Trends Cogn. Sci. 26:5388–405 [Google Scholar] Awad E, Levine S, Kleiman-Weiner M, Dsouza S, Tenenbaum JB et al. 2020b. Drivers are blamed more than their automated cars when both make mistakes. Nat. Hum. Behav. 4:2134–43 [Google Scholar] Beckers N, Siebert LC, Bruijnes M, Jonker C, Abbink D. 2022. Drivers of partially automated vehicles are blamed for crashes that they cannot reasonably avoid. Sci. Rep. 12:16193 [Google Sc