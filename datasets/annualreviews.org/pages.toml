["https://annualreviews.org/content/journals/10.1146/annurev-soc-121919-054614"]
title = "Climate Change and Society | Annual Reviews"
description = "Climate change is one of the greatest ecological and social challenges of the twenty-first century. Sociologists have made important contributions to our knowledge of the human drivers of contemporary climate change, including better understanding of the effects of social structure and political economy on national greenhouse gas emissions, the interplay of power and politics in the corporate sector and in policy systems, and the factors that influence individual actions by citizens and consumers. Sociology is also poised to make important contributions to the study of climate justice across multiple lines of stratification, including race, class, gender, indigenous identity, sexuality and queerness, and disability, and to articulate the effects of climate change on our relationship to nonhuman species. To realize its potential to contribute to the societal discourse on climate change, sociology must become theoretically integrated, engage with other disciplines, and remain concerned with issues related to environmental and climate inequalities."
full_description = "Home A-Z Publications Annual Review of Sociology Volume 46, 2020 Article Annual Review of Sociology Volume 46, 2020 Review Article Free Climate Change and Society Thomas Dietz1, Rachael L. Shwom2, and Cameron T. Whitley3 View Affiliations Hide Affiliations Affiliations: 1Sociology and Environmental Science and Policy Program, Michigan State University, East Lansing, Michigan 48824, USA; email: [email protected] 2Human Ecology and Rutgers Energy Institute, Rutgers University, New Brunswick, New Jersey 08901, USA; email: [email protected] 3Department of Sociology, Western Washington University, Bellingham, Washington 98225, USA; email: [email protected] Vol. 46:135-158 (Volume publication date July 2020) https://doi.org/10.1146/annurev-soc-121919-054614 First published as a Review in Advance on March 09, 2020 Copyright © 2020 by Annual Reviews. All rights reserved info Info Article information Full-Text Figures & Tables References (193) Cited By Supplemental Material list Sections PDF + 7-day HTML access to article Article file format pdf download PDF build Tools Tools Add to my favoritesFavourites Create Publication Alert Create Citation Alert Create Correction Alert Export citation BibTEX Endnote Zotero Medlars RefWorks Mendeley Recommend to library Permissions share Share Share Abstract Climate change is one of the greatest ecological and social challenges of the twenty-first century. Sociologists have made important contributions to our knowledge of the human drivers of contemporary climate change, including better understanding of the effects of social structure and political economy on national greenhouse gas emissions, the interplay of power and politics in the corporate sector and in policy systems, and the factors that influence individual actions by citizens and consumers. Sociology is also poised to make important contributions to the study of climate justice across multiple lines of stratification, including race, class, gender, indigenous identity, sexuality and queerness, and disability, and to articulate the effects of climate change on our relationship to nonhuman species. To realize its potential to contribute to the societal discourse on climate change, sociology must become theoretically integrated, engage with other disciplines, and remain concerned with issues related to environmental and climate inequalities. Keyword(s): climate change, climate justice, environmental sociology, global environmental change, human ecology Article metrics loading... /content/journals/10.1146/annurev-soc-121919-054614 2020-07-30 2025-03-05 Download as PowerPoint Full text loading... /deliver/fulltext/soc/46/1/annurev-soc-121919-054614.html?itemId=/content/journals/10.1146/annurev-soc-121919-054614&mimeType=html&fmt=ahah [Citing articles] [Web of Science] [Medline] Literature Cited Adepoju A 2019. Migrants and refugees in Africa. Oxford Research Encyclopedia: Politics W Thompson 1–26 London: Oxford Univ. Press [Google Scholar] Adua L, Clark B 2019. Even for the environment, context matters! States, households, and residential energy consumption. Environ. Res. Lett. 14:6064008 [Google Scholar] Andreoni M, Londono E 2019. Despite world's outrage, farmers in Amazon remain defiant. New York Times Aug. 27:A4 [Google Scholar] Attari SZ, DeKay ML, Davidson CI, De Bruin WB 2010. Public perceptions of energy consumption and savings. PNAS 107:3716054–59 [Google Scholar] Ballew MT, Leiserowitz A, Roser-Renouf C, Rosenthal SA, Kotcher JE et al. 2019. Climate change in the American mind: data, tools, and trends. Environ. Sci. Policy Sustain. Dev. 61:34–18 [Google Scholar] Benegal SD 2018. The spillover of race and racial attitudes into public opinion about climate change. Environ. Politics 27:4733–56 [Google Scholar] Bidwell D 2016. Thinking through participation in renewable energy decisions. Nat. Energy 1:16051 [Google Scholar] Black R, Arnell N, Dercon S 2011. Migration and global environmental change—review of drivers