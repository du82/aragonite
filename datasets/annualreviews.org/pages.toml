title = "Global Access | Annual Reviews"
full_description = "Home Global Access Save Email Share Global Access About What We Do Founder & History Our Team Careers Press Center News Global Access Directory Help/FAQs Contact Us Annual Reviews participates in three international information access programs. International Network for the Availability of Scientific Publications INASP is an international development charity working with a global network of partners to improve access, production and use of research information and knowledge, so that countries are equipped to solve their development challenges. Through their access program, INASP works with universities, research organizations and their associated library consortia to help them build their own negotiation and licensing skills. As a founding publisher partner, Annual Reviews has delivered free access to our entire collection of journals, including our Electronic Back Volume Collection, to institutions in eligible countries since 2002. Research4Life Research4Life is the collective name for four programs of United Nations agencies that provide institutions in the developing world with free or low cost access to academic and professional peer-reviewed content. These programs include: The Health InterNetwork Access to Research Information (HINARI) program of the World Health Organization (WHO); The Access to Global Online Research in Agriculture (AGORA) program of the Food and Agriculture Organization (FAO); The Online Access to Research in the Environment (OARE) program of the United Nations Environment Program (UNEP); and The Access to Research for Development and Innovation (ARDI) program of the World Intellectual Property Organization (WIPO) As an original publisher partner, Annual Reviews has contributed our entire collection of journals, including our Electronic Back Volume Collection, to institutions participating in Research4Life for more than a decade. We continue to provide our complete history of science to hundreds of beneficiary institutions in over 50 countries in the developing world through Research4Life. Partnership with Google Scholar Annual Reviews is partnering with Google Scholar on a pilot program to improve the search experience of Research4Life users from over 200 institutions in six countries (Bangladesh, Democratic Republic of Congo, Laos, Malawi, Nepal, and Rwanda)."
