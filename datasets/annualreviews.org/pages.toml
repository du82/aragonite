["https://annualreviews.org/S2O"]
title = "Subscribe to Open | Annual Reviews"
full_description = "Home >Subscribe to OpenEmailShareSubscribe to OpenThe Goal of Open AccessOpening access to the knowledge generated by researchers from all disciplines is of immediate and practical application in creating and implementing solutions to the world’s most pressing challenges, from health and education equity to climate change to inclusive economic growth and the commitment to democracy.S2O - A Goal AchievedWe successfully converted all 2023 and 2024 journal volumes to open access using S2O, resulting in a 2-to-3 fold increase in global readership. Our 2025 volumes are currently in production, and with continued support for S2O, will convert to OA as they publish. Ensuring continued successAdoptionby other publishers.Join the Community of PracticeSubscribersour loyal customersSupportFrom the communityAdvocacyFrom researchers to their librariansDownload infographic (CC-BY-SA 1.0 ) and share with attribution What is Subscribe to Open (S2O)?Through the innovative OA model called Subscribe to Open (S20), developed by Annual Reviews, existing institutional customers continue to subscribe to the journals. With sufficient support, every new volume is immediately converted to OA under a Creative Commons license and is available for everyone to read and re-use. In addition, all articles from the most recent nine volumes are also accessible to all. If support is insufficient, the paywall is retained.What are the benefits of S2O?For subscribers For authors For the community S2O Resource centerLearned Publishing White Paper&nbsp;S20 Launch Panel DiscussionMarketing FlyerGet more informationFor further information contact your Annual Reviews representative.Email [email protected]"
