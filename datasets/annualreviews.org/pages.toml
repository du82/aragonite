["https://annualreviews.org/content/journals/criminol"]
title = "Annual Review of Criminology | Annual Reviews"
description = "An agent-based model is a form of complex systems model that is capable of simulating how the micro-level behavior of individual system entities contributes to macro-level system outcomes. Researchers draw on theory and evidence to identify the key elements of a given system and specify behaviors of agents that simulate the individual entities of that system—be they cells, animals, or people. The model is then used to run simulations in which agents interact with one another and the resulting outcomes are observed. These models enable researchers to explore proposed causal explanations of real-world outcomes, experiment with the impacts that potential interventions might have on system behavior, or generate counterfactual scenarios against which real-world events can be compared. In this review, we discuss the application of agent-based modeling within the field of criminology as well as key challenges and future directions for research."
full_description = "Home A-Z Publications Annual Review of Criminology Annual Review of Criminology Navigate this Journal Home About Current Early Publication Previous Volumes Editorial Committee eISSN: 2572-4568 AIMS AND SCOPE OF JOURNAL: The Annual Review of Criminology provides comprehensive reviews of significant developments in the multidisciplinary field of criminology, defined as the study of both the nature of criminal behavior and societal reactions to crime. Published Since 2018 Journal Status Active Impact Factor 6.3 Highlights from the Journal Agent-Based Modeling in Criminology https://doi.org/10.1146/annurev-criminol-022222-033905 An agent-based model is a form of complex systems model that is capable of simulating how the micro-level behavior of individual system entities contributes to macro-level system outcomes. Researchers draw on theory and evidence to identify the key elements of a given system and specify behaviors of agents that simulate the individual entities of that system—be they cells, animals, or people. The model is then used to run simulations in which agents interact with one another and the resulting outcomes are observed. These models enable researchers to explore proposed causal explanations of real-world outcomes, experiment with the impacts that potential interventions might have on system behavior, or generate counterfactual scenarios against which real-world events can be compared. In this review, we discuss the application of agent-based modeling within the field of criminology as well as key challenges and future directions for research. Algorithmic Bias in Criminal Risk Assessment: The Consequences of Racial Differences in Arrest as a Measure of Crime https://doi.org/10.1146/annurev-criminol-022422-125019 There is great concern about algorithmic racial bias in the risk assessment instruments (RAIs) used in the criminal legal system. When testing for algorithmic bias, most research effectively uses arrest data as an unbiased measure of criminal offending, which collides with longstanding concerns that arrest is a biased proxy of offending. Given the centrality of arrest data in RAIs, racial differences in how arrest proxies offending may be a key pathway through which RAIs become biased. In this review, we evaluate the extensive body of research on racial differences in arrest as a measure of crime. Furthermore, we detail several ways that racial bias in arrest records could create algorithmic bias, although little research has attempted to measure the degree of algorithmic bias generated by using racially biased arrest records. We provide a roadmap to assist future research in understanding the impact of biased arrest records on RAIs. My Unexpected Adventure Pursuing a Career in Motion https://doi.org/10.1146/annurev-criminol-070224-123926 My interest in criminology grew as the Vietnam War escalated. I applied to two Canadian graduate schools and flipped a coin. The coin recommended the University of Toronto, but I chose the University of Alberta, which had a stronger criminology program. I wrote a dissertation about criminal sentencing, which led to an Assistant Professorship at the University of Toronto. Dean Robert Pritchard of Toronto's Law School encouraged my work and later successfully nominated me for a Distinguished University Professorship. My interests continued to grow in international criminal law. A MacArthur Distinguished Professorship at Chicago's Northwestern University and the American Bar Foundation facilitated my research at the Tribunal for the Former Yugoslavia. I followed this by studying the crime of genocide in Sudan and later the trial of Chicago's Detective Jon Burge. Burge oversaw the torture of more than 100 Black men on Chicago's South Side. US Attorney Patrick Fitzgerald prosecuted Burge when Illinois prosecutors would not. Despite many good things about Chicago, the periodic corruption of the government and police was not among them. Beyond the Seductions of the State: Toward Freeing Criminology from Governments’ Blinders https://doi.org/10.1146/annurev-criminol-111523-122321 Criminology is haunted by state-structured biases. We discuss five. (a) With the spatial boundaries and the binary deontology they use to count crime, governments draw researchers into ecological fog and sometimes fallacy. (b) All legal systems encourage criminologists to promote untenable implications of socially stratified criminality. (c) To degrees that vary by time and place, the scope of criminological research is compromised by methodological nationalism. (d) State agencies use chronologies that repeatedly draw researchers away from examining the nonlinear temporalities that shape variations in criminal behavior. (e) State agencies produce data that facilitate explaining the why of crime, but scientific naturalism would first work out what is to be explained. We recommend a criminology that begins by describing causal contingencies in social life independent of governments’ labeling of crime. Black Political Mobilization and the US Carceral State: How Tracing Community Struggles for Safety Changes the Policing Narrative https://doi.org/10.1146/annurev-criminol-111523-122329 This review integrates recent scholarship outside of criminology with primary source material from a broadened source base to trace underappreciated histories of political struggle to secure safety and address harm in Black communities. Much of the existing literature in criminology and related social science fields tends to overlook bottom-up sources and the creative safety practices and sites of safety provision that exist and, in so doing, contributes to a lopsided empirical narrative of policing in the United States. This review, however, highlights the centrality of Black-led political mobilization, formal and informal, to articulating alternate visions of safety beyond policing and building alternate structures to transform the legal system and challenge racial criminalization. Examples include community patrols, the efforts of Black police to confront violence in their own departments and stand up structures of responsiveness, and national campaigns to challenge punitive legislation and offer alternatives. Unearthing these often marginalized and misrecognized histories and sources of Black-led struggle for community safety enables an analysis of not only the forms that community-led practices and interventions can take but also the ongoing state-produced conditions—referred to in this review as safety deprivation—that give rise to them. More broadly, this review uses these histories as a lens through which to consider how empirical narratives of policing and safety are transformed when community-derived, bottom-up knowledge sources are accounted for both substantively and methodologically and offers the field a guide of available databases. Most Read This Month Article content/journals/criminol Journal 10 5 false en"
