["https://annualreviews.org/about/our-team"]
title = "| Annual Reviews"
full_description = "Home Save Email Share About What We Do Founder & History Our Team Careers Press Center News Global Access Directory Help/FAQs Contact Us Annual Reviews is run for researchers, by researchers. There are three branches of leadership: the Board and Board Committees, Editors and Editorial Committees, and Management of the organization. Our Board of Directors The Annual Reviews Board of Directors is comprised of people who have risen to the top of their respective field of research or other endeavor, such as business and philanthropy. They volunteer their time as a public service to increase the sum of expert scientific knowledge. There is a full Board meeting and an Executive Committee meeting every year to conduct Board business and Board members participate on a monthly basis in the development of the organization Karen S. Cook Co-Chair Ray Lyman Wilbur Professor of Sociology Vice President for Faculty Development and Diversity Stanford University kcook @ stanford.edu Sandra M. Faber Co-Chair Professor Emerita of Astronomy and Astrophysics University of California, Santa Cruz faber @ ucolick.org The Board Peter F. Carpenter Founder Mission and Values Institute peterfcarpenter @ gmail.com Susan T. Fiske Eugene Higgins Professor of Psychology and Public Affairs Princeton University sfiske @ princeton.edu Richard Gallagher President and Editor-in-Chief Annual Reviews rgallagher @ annualreviews.org Toby Green Publisher and Co-Founder Coherent Digital toby.green @ coherentdigital.net Samuel Gubins Director Emeritus sgubins @ annualreviews.org Steven E. Hyman Director, Stanley Center for Psychiatric Research Broad Institute of MIT and Harvard stevehy @ broadinstitute.org Raymond Jeanloz Professor Department of Earth and Planetary Science University of California, Berkeley Jeanloz @ berkeley.edu Roger D. Kornberg Mrs. George A. Winzer Professor in Medicine Department of Structural Biology Stanford University School of Medicine Kornberg @ stanford.edu Andrew W. Lo Charles E. and Susan T. Harris Professor Sloan School of Management Massachusetts Institute of Technology alo-admin @ mit.edu Sharon R. Long Wm. Steere-Pfizer Professor of Biological Sciences Department of Biological Sciences Stanford University sharon.long @ stanford.edu Michael E. Peskin Professor of Particle Physics and Astrophysics SLAC National Accelerator Laboratory Stanford University mpeskin @ slac.stanford.edu Sabeeha S. Merchant Warren C. Eveland Endowed Chair in Biological Sciences Professor of Plant Biology Professor of Biochemistry, Biophysics and Structural Biology University of California, Berkeley merchant @ chem.ucla.edu Vesla M. Weaver Bloomberg Distinguished Professor Political Science & Sociology Johns Hopkins University Vesla @ jhu.edu Our Business Affairs Committee This group includes thought leaders from business and academia. The committee’s primary role is to assist the Board of Directors in overseeing the development, approval, and implementation of financial policies and budgets that support the mission, values, and strategic goals of the organization. It also reviews the organization’s financial performance against its goals and proposes major transactions and programs to the Board. The Business Affairs Committee Peter F. Carpenter Chairperson Founder Mission and Values Institute peterfcarpenter @ gmail.com Richard Gallagher President and Editor-in-Chief Annual Reviews rgallagher @ annualreviews.org Sean Ballard Chief Executive Officer EigenVector Matthew Barney Founder and CEO LeaderAmp matt @ leaderamp.com Stephen A. DeLateur Retired Silicon Valley Executive stevedel @ pacbell.net Raymond Jeanloz Professor Department of Earth and Planetary Science University of California, Berkeley jeanloz @ berkeley.edu Virginia Steel University Librarian Young Research Library University of California, Los Angeles vsteel @ library.ucla.edu Our Journal Editors Annual Reviews enjoys a close working relationship with leading researchers who serve as journal Editors and Co-Editors. They meet with their fellow Editorial Committee members once a year to select the most compelling topics and authors, with the resulting volumes cataloging the accumulated knowledge of science. The Journal Editors Paul W. Bohn Co-EditorAnnual Review of Analytical Chemistry Nancy L. Allbritton Co-EditorAnnual Review of Analytical Chemistry Harris A. Lewin Co-EditorAnnual Review of Animal Biosciences R. Michael Roberts Co-EditorAnnual Review of Animal Biosciences Donald Brenneis Co-EditorAnnual Review of Anthropology Karen B. Strier Co-EditorAnnual Review of Anthropology Robert C. Kennicutt Co-EditorAnnual Review of Astronomy and Astrophysics Ewine F. van Dishoeck Co-EditorAnnual Review of Astronomy and Astrophysics Suzanne Pfeffer EditorAnnual Review of Biochemistry Russ B. Altman EditorAnnual Review of Biomedical Data Science Martin L. Yarmush Co-EditorAnnual Review of Biomedical Engineering Mehmet Toner Co-EditorAnnual Review of Biomedical Engineering Jané Kondev EditorAnnual Review of Biophysics Scott A. Armstrong Co-EditorAnnual Review of Cancer Biology Laura D. Attardi Co-EditorAnnual Review of Cancer Biology Ruth Lehmann EditorAnnual Review of Cell and Developmental Biology Michael F. Doherty Co-EditorAnnual Review of Chemical and Biomolecular Engineering Rachel A. Segalman Co-EditorAnnual Review of Chemical and Biomolecular Engineering Tyrone D. Cannon Co-EditorAnnual Review of Clinical Psychology M. Cristina Marchetti Co-EditorAnnual Review of Condensed Matter Physics Andrew P. Mackenzie Co-EditorAnnual Review of Condensed Matter Physics Naomi Ehrich Leonard EditorAnnual Review of Control, Robotics, and Autonomous Systems Tracey L. Meares Co-EditorAnnual Review of Criminology Robert J. Sampson Co-EditorAnnual Review of Criminology Avshalom Caspi Co-EditorAnnual Review of Developmental Psychology Sandra R. Waxman Co-EditorAnnual Review of Developmental Psychology Katherine H. Freeman Co-EditorAnnual Review of Earth and Planetary Sciences Raymond Jeanloz Co-EditorAnnual Review of Earth and Planetary Sciences Douglas J. Futuyma EditorAnnual Review of Ecology, Evolution, and Systematics Philippe Aghion Co-EditorAnnual Review of Economics Hélène Rey Co-EditorAnnual Review of Economics Nicole M. Gerardo Co-EditorAnnual Review of Entomology Christina M. Grozinger Co-EditorAnnual Review of Entomology Arun Agrawal Co-EditorAnnual Review of Environment and Resources Ashok Gadgil Co-EditorAnnual Review of Environment and Resources Thomas P. Tomich Co-EditorAnnual Review of Environment and Resources Hui Chen Co-EditorAnnual Review of Financial Economics Matthew Richardson Co-EditorAnnual Review of Financial Economics Jonathan B. Freund Co-EditorAnnual Review of Fluid Mechanics Howard Stone Co-EditorAnnual Review of Fluid Mechanics D. Julian McClements EditorAnnual Review of Food Science and Technology Tatjana Piotrowski EditorAnnual Review of Genetics Aravinda Chakravarti Co-EditorAnnual Review of Genomics and Human Genetics Eric D. Green Co-EditorAnnual Review of Genomics and Human Genetics Wayne M. Yokoyama EditorAnnual Review of Immunology Carol A. Heimer EditorAnnual Review of Law and Social Science Mark Liberman Co-EditorAnnual Review of Linguistics Colin Phillips Co-EditorAnnual Review of Linguistics Craig A. Carlson Co-EditorAnnual Review of Marine Science Stephen J. Giovannoni Co-EditorAnnual Review of Marine Science Ram Seshadri EditorAnnual Review of Materials Research Howard Rockman EditorAnnual Review of Medicine Susan Gottesman EditorAnnual Review of Microbiology Mary E. Hatten Co-EditorAnnual Review of Neuroscience Botond Roska Co-EditorAnnual Review of Neuroscience Wick C. Haxton Co-EditorAnnual Review of Nuclear and Particle Science Michael E. Peskin Co-EditorAnnual Review of Nuclear and Particle Science Rudi Balling Co-EditorAnnual Review of Nutrition Patrick J. Stover Co-EditorAnnual Review of Nutrition Frederick Morgeson EditorAnnual Review of Organizational Psychology and Organizational Behavior Kathleen Burns Co-EditorAnnual Review of Pathology: Mechanisms of Disease Jayanta Debnath Co-EditorAnnual Review of Pathology: Mechanisms of Disease Mel B. Feany Co-EditorAnnual Review of Pathology: Mechanisms of Disease Paul A. Insel EditorAnnual Review of Pharmacology and Toxicology Theodore Goodson Co-EditorAnnual Review of Physical Chemistry Anne B. McCoy Co-EditorAnnual Review of Physical Chemistry Mark T. Nelson Co-EditorAnnual Review of Physiology Kenneth Walsh Co-EditorAnnual Review of Physiology Gwyn A. Beattie Co-EditorAnnual Review of Phytopathology Sabeeha S. Merchant EditorAnnual Review of Plant Biology Margaret Levi Co-EditorAnnual Review of Political Science David Stasavage Co-EditorAnnual Review of Political Science Susan T. Fiske EditorAnnual Review of Psychology Jonathan E. Fielding EditorAnnual Review of Public Health Gordon C. Rausser Co-EditorAnnual Review of Resource Economics David Zilberman Co-EditorAnnual Review of Resource Economics Douglas S. Massey Co-EditorAnnual Review of Sociology Mary C. Waters Co-EditorAnnual Review of Sociology Nancy Reid EditorAnnual Review of Statistics and Its Application Terence S. Dermody EditorAnnual Review of Virology David H. Brainard Co-EditorAnnual Review of Vision Science John H.R. Maunsell Co-EditorAnnual Review of Vision Science Our Management Team The entire staff at Annual Reviews is dedicated to providing content of the highest quality and outstanding customer service. The organization is led by a management team that has substantial cumulative experience in scholarly publishing. Our goal is an effective, efficient, and tight knit organization. Richard Gallagher President and Editor-in-Chief rgallagher @ annualreviews.org “Annual Reviews is a cherished resource. It publishes the most insightful overviews from the leading researchers across almost all of the sciences. I have been an avid reader since the first volume of the Annual Review of Immunology was published in 1983, and it still gives me chills to look at those articles today. As President and Editor-in-Chief I enjoy working with the staff, Boards and Editorial Committees to further develop the services that Annual Reviews provides for the scientific community.” The Management Team Liz Allen Director of MarCom & Strategic Development lallen @ annualreviews.org Paul Calvi Director of Technology pcalvi @ annualreviews.org Eva Emerson Editor-in-Chief, Knowable Magazine eemerson @ annualreviews.org Leah Hinds Executive Director, Charleston Hub lhinds @ annualreviews.org Jennifer Jongsma Associate Editor-in-Chief & Director of Production jjongsma @ annualreviews.org Andrea Lopez Director of Sales, Partnerships & Initiatives alopez @ annualreviews.org Jonathan Michael Chief Financial Officer jmichael @ annualreviews.org Lisa Wucher Director of Human Resources lwucher @ annualreviews.org Find information on all members of our staff by searching the Annual Reviews Directory. × Close"
