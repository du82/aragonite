["https://annualreviews.org/about/our-founder-and-early-history"]
title = "Founder & History | Annual Reviews"
full_description = "Home Founder & History Save Email Share Founder & History About What We Do Founder & History Our Team Careers Press Center News Global Access Directory Help/FAQs Contact Us “We shall cope with the information explosion, in the long run, only if some scientists are prepared to commit themselves to the job of sifting, reviewing, and synthesizing information; i.e. to handling information with sophistication and meaning, not merely mechanically1.” These words, published in 1963, are as pertinent today as they were over 50 years ago showing that the challenge of scientific information overload is nothing if not persistent. Annual Reviews’ founder J. Murray Luck In 1930, overwhelmed by the amount of time it would take to read all the relevant literature, J. Murray Luck, then Professor of Chemistry, Stanford University brought his colleagues together to create the first Annual Review of Biochemistry (published in 1932). The genesis of his original idea for Annual Reviews is summed up in this excerpt from Confessions of a Biochemist which Dr. Luck, then Professor of Chemistry Emeritus, Stanford University, wrote in celebration of the 50th anniversary of Annual Reviews. “In mid 1930, I inquired of about 50 well-known biochemists in the United States and abroad whether an annual volume of critical reviews on the research of the preceding year or two in biochemistry would be a useful addition to the biochemical literature. The volume, of course, would be international in scope and the 30 or so cooperating authors would have, so it was hoped, the necessary expertise to satisfy the expectations of their fellow biochemists the world over. The number of biochemical abstracts published by Chemical Abstracts in 1979 was over 148,000, the increase being attributable to a more comprehensive coverage of the literature, a more expansive definition of the subject, and an enormous increase, worldwide, in the number of research projects being pursued in biochemistry.” For four decades, Dr. Luck taught biochemistry to Stanford medical students and led advanced courses for graduate students. His specialty was the role of proteins in carcinogenesis. He published more than 200 scientific papers. Here are some additional resources for those who wish to learn more about Dr. Luck: Confessions of a Biochemist (Autobiographical chapter from the Annual Review of Biochemistry, Volume 50) Reminiscences (PDF) List of Publications (PDF) The influence of the Annual Review of Biochemistry spread far and wide, including its use as a teaching aid by WWII POW Samuel Perry. This excerpt is taken from Perry's obituary in the Daily Telegraph, 2010:“His love of biochemistry, helped to sustain him during his 1,165 days as a prisoner. He ran courses in biochemistry and agricultural chemistry, and requested that some biochemical literature be sent out to him in prison in Padula. With the help of the Red Cross, the Annual Review of Biochemistry of 1942, volume 11, reached the camp. After each of his failed escapes he miraculously managed to retrieve the book, even took it home with him to Britain after liberation. This much-travelled volume, now in the archives of of the Biochemical Society, became, as he drily put it, ‘a monument to my incompetence as an escapee’”.1“Science, Government and Information: The Responsibilities of the Technical Community and the Government in the Transfer of Information,” issued by the U.S. President’s Scientific Advisory Committee."
