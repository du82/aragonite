["https://annualreviews.org/about/what-we-do"]
title = "What We Do | Annual Reviews"
full_description = "Home What We Do Save Email Share What We Do About What We Do Founder & History Our Team Careers Press Center News Global Access Directory Help/FAQs Contact Us The mission of Annual Reviews Annual Reviews is a nonprofit publisher dedicated to synthesizing and integrating knowledge for the progress of science and the benefit of society. Annual Reviews is a 501 (c)(3) nonprofit organization. Reviews “with attitude” &nbsp; Our service to the research community &nbsp; Our crucial role in stimulating discussion about science Annual Reviews articles: Capture current understanding of a topic, including what is well supported and what is controversial; Set the work in historical context; Highlight the major questions that remain to be addressed and the likely course of research in upcoming years; and Outline the practical applications and general significance of research to society. Who uses Annual Reviews? Researchers who want to keep abreast of their field and integrate this information with their own activities; Researchers who want an introduction to new fields, with a view to developing an interface between different areas of research; Students at all levels who want to gain a thorough understanding of a topic; and Business people, journalists, policy makers, practitioners, patients and patient advocates, and others who wish to be informed about developments in research. Expert content curation Annual Review articles hold a unique place in the scholarly communication ecosystem because they transfer expert knowledge synthesized from the expanding corpus of scientific literature to scholars and society. To create this impactful content, we bring together expert Editorial Committees in each covered discipline and facilitate meetings where members can discuss trends in each field and select relevant topics for review. Authoritative authors are then invited to submit reviews, and they readily accept the challenge to help shape and define their field as a service to scholars and society. The number of Annual Review journals continues to grow over a broad range of disciplines within the Biomedical, Life, Physical, and Social Sciences, including Economics. The creation of a new title indicates that the amount of original research in a field has reached a critical mass. Year Journal Discipline 2019 Developmental Psychology 2018 Biomedical Data Science 2018 Control, Robotics, and Autonomous Systems 2018 Criminology 2017 Cancer Biology 2015 Vision Science 2015 Linguistics 2014 Virology 2014 Statistics and Its Application 2014 Organizational Psychology and Organizational Behaviour 2023 year in review Download Report."
