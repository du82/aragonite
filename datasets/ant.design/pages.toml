["https://ant.design/docs/spec/lightweight"]
title = "Keep it Lightweight - Ant Design"
description = "Fitts's Law is an ergonomic principle that ties the size of a target and its contextual proximity to ease of use. In other words, if a tool is close at hand and large enough to target, then we can improve the user's interaction. Putting tools in context makes for lightweight interaction."
