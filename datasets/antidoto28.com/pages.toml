title = "SERIGRAFÍA ARTESANAL – antidoto28"
description = "Blog de consulta e información para interesados en la técnica de impresión manual Serigráfica. La Serigrafía como medio de reproducción de la obra plástica es la técnica más utilizada en este siglo, método sencillo y aplicable a todo tipo de materiales, formas, colores y situaciones la convierte en idónea para la difusión de obra gráfica."
full_description = 'SERIGRAFÍA ARTESANAL RSS MASCARILLAS IMPRESAS - July 31, 2020 Mascarillas personalizadas con tu logo. <img src="//www.antidoto28.com/cdn/shop/articles/mascarillas_promo_1_1024x1024.jpg?v=1596220610" alt="Mascarillas personalizadas con tu logo." /> Mascarillas personalizadas con tu logo impreso en serigrafía con laca biodegradable a un color. Mascarilla Lavable(60 ° C) y reutilizable y muy cómoda de usar. Read more Curso de serigrafía artesanal - February 01, 2018 CURSO DE SERIGRAFÍA ARTESANAL D.I.Y. <img src="//www.antidoto28.com/cdn/shop/articles/a28_seri_banner_a96165ac-4307-4142-899e-8ad13265da84_1024x1024.jpg?v=1517514683" alt="CURSO DE SERIGRAFÍA ARTESANAL D.I.Y." /> TALLER DE ESTAMPADO TEXTIL ARTESANAL BARCELONA. El objetivo de nuestros talleres es que aprendas a imprimir en casa o pequeño taller con un costo mínimo de inversión. El método que enseñamos es muy práctico, sencillo y económico. Utilizarás una técnica de estampado con grandes posibilidades y campos de acción. El curso esta dirigido a la impresión textil y sobre papel. Lo puede realizar cualquier persona, tanto aficionados como profesionales. El taller consiste en cuatro clases de 3hs. También tenemos un intensivo personalizado de dos clases de 4hs. en horario a convenir con el alumno.Solicita mas información por tel., e-mail o... Read more Proceso serigráfico paso a paso - January 23, 2018 PROCESO SERIGRFICO PASO A PASO <img src="//www.antidoto28.com/cdn/shop/articles/curso_serigrafia_5_1024x1024.jpg?v=1516742658" alt="PROCESO SERIGRFICO PASO A PASO" /> CUAL ES EL PROCESO DE ESTAMPADO SERIGRÁFICO ? El proceso se lleva a cabo en 7 pasos básicos: > Originales Mecánicos.- Realización del trabajo creativo > Emulsionar .- Aplicación de emulsión ( Bicromato y Sericrom ) a la malla. > Quemar.- Exposición de la malla previamente emulsionada en la mesa de luz. > Revelar.- Aplicación de agua a la malla, después de haberse expuesto, y se seca la malla por medio de aire. > Encintar.- Se encintan las partes no deseadas de la malla. > Registro.- Es la forma de mantener la impresión en el mismo lugar. > Tiraje.- Se... Read more Que es la serigrafía ? - January 23, 2018 QUE ES LA SERIGRAFÍA ? <img src="//www.antidoto28.com/cdn/shop/articles/curso_serigrafia_8_-_copia_1024x1024.jpg?v=1516742552" alt="QUE ES LA SERIGRAFÍA ?" /> Procedimiento de impresión utilizado para hacer reproducciones de arte o anuncios, que consiste en filtrar los colores a través de una trama de poliéster, mientras que se recubren con una cola de emulsión fotosensible impermeabilizadora las partes que no deben filtrar. La técnica es sencilla y permite reproducir temas decorativos sobre cualquier material: papel, metal, madera, porcelana, tela, etc. de manera artesanal y de muy bajo coste, ideal para desarrollar nuestros propios proyectos. Read more Tags All Curso de serigrafía artesanal MASCARILLAS IMPRESAS Proceso serigráfico paso a paso Que es la serigrafía ?'
