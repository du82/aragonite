full_description = '''Reports¶ Read official ASF reports and statements from the ASF including annual reports, diversity reports, and more. Plus One Newsletter¶ Plus One is the ASF's monthly bulletin to showcase major milestones, news, events, and activities across the ASF project ecosystem. At the bottom of the blog, you can subscribe to get real-time notifications when a new edition is released. The Apache Way¶ Our consensus-driven, open development process was refined over the past 20 years and produced some of the largest and longest-lived Open Source projects that have revolutionized the industry. Community Over Code¶ "Community Over Code - or C/C - is our annual flagship conference offering unparalleled educational, networking, and collaboration opportunities.'''
