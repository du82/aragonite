["https://apache.org/foundation/individual-supporters"]
title = "Individual Supporters | Apache Software Foundation"
description = "Home page of The Apache Software Foundation"
full_description = "Support ASF: Individual Giving Programs¶ ASF’s open source software is used ubiquitously around the world. Individual Supporters enable the Apache Software Foundation to serve as the global home for hundreds of software projects, and to incubate the next-generation of open source innovations. We thank all current ASF Individual Supporters for their loyalty and contributions, and look forward to welcoming new donors as we continue to expand our community. One-Time or Recurring Donations¶ Giving to Apache is easy! You can donate with a debit or credit card, bank transfer, PayPal, or Google Pay. If you'd like to mail a check, see instructions below. Donations are tax-deductible in the U.S. The ASF is recognized by Charity Navigator and cited with the Gold Seal of Transparency by GuideStar. Thank you in advance for your generosity! Donate Now Corporate Matching Gifts¶ Matching gift programs amplify corporate contributions and help further support the ASF. Employers such as American Express, AOL, Bloomberg, IBM, and Microsoft match contributions and volunteer hours made by their employees. Check with your employer’s Human Resources department to learn how you can double or triple your support of the ASF through a corporate matching gift program. Contact us at fundraising@apache.org to see how your contribution to the ASF can be generously increased. FAQ¶ How will my donation be used?¶ As a US 501(c)(3) not-for-profit charitable organization, the ASF depends on a variety of funding sources to sustain its day-to-day activities. Tax-deductible contributions from corporations, foundations, and private individuals help offset day-to-day operating expenses that include Infrastructure services; Marketing and PR/AR; and Legal, Accounting, and Operational support. We spend less than 10% of our annual budget on overhead. 75% of the ASF's US $1.5M annual budget supports running our critical infrastructure (mailing lists, code repositories, bug tracking systems, Web servers, continuous integration servers, bandwidth, electricity, cooling, administrative staff, and more) that keeps the Foundation and its projects functioning 24x7x365. The annual cost is less than US $5K per project. We are proud to highlight the ASF's diverse accomplishments in our Annual Reports. Many of these successes were made possible by your support. Are Individual Supporter donations tax-deductible?¶ Yes, the Apache Software Foundation is a 501(c)(3) not-for-profit entity so contributions are tax-deductible in the U.S. As regulations vary, we encourage you to consult a qualified advisor experienced with your local tax law pertaining to donations. What is the ASF’s tax identification number?¶ The ASF's tax identification number is 47-0825376. Where can I mail a check?¶ As of 1 November, 2024, we will no longer be accepting mailed-in donations using physical (paper) checks. To make a one-time or recurring donation to the ASF online using ACH (electronic money transfer) or eCheck (electronic check), please visit https://donate.apache.org/ and follow the prompts at “Individual and One-Time Corporate Donations (any amount)”. Here you may make a recurring (monthly, quarterly, or annually) donation as well. We will issue you a tax receipt via email upon successful processing of your donation(s). I have a question. Who do I contact?¶ For more information, please contact us at fundraising@apache.org."
