title = "Brand Guidelines | Apache Software Foundation"
description = "Home page of The Apache Software Foundation"
full_description = '''ASF Brand Guidelines¶ The ASF’s brand guidelines and trademark policy ensure consistent use of our brand logo and assets to help people easily identify the Foundation and its work. All uses of ASF trademarks, service marks, and graphic logos must abide by our Identity Style Guide and Trademark Policy. ASF Graphics Foundation Logos - the formal ASF logo Powered By Apache Logos - for Apache projects Apache Badges — pictorial marks of the Apache Feather with taglines Community Over Code Logos - the official Community Over Code event logo Foundation Logos¶ Foundation Logo¶ ASF Logo without URL - SVG ASF Logo without URL - PDF ASF Logo without URL - EMF Foundation Logo with URL¶ ASF Logo with URL - SVG ASF Logo with URL - PDF ASF Logo with URL - EMF Wide Foundation Logo¶ ASF Logo with URL - SVG ASF Logo with URL - PDF ASF Logo with URL - EMF "Established 1999" Foundation Logo¶ ASF Logo with Estd. 1999 - SVG ASF Logo with Estd. 1999 - PNG Feathers¶ Feather SVG Feather PDF Feather EMF Powered By Apache Logos¶ The “Powered By Apache” logo was created in 2014 to celebrate the Apache Software Foundation's 15th Anniversary and promote the ASF's then-more than 200 projects. The logo was updated in January 2016 to reflect the new ASF brand identity. This logo was specially created to maintain the unique identity of each ASF project whilst identifying all projects under the Apache umbrella. The Apache community at-large are encouraged to display “Powered By Apache” assets on their websites, documentation, and other marketing materials. Guidelines for the appropriate use of the “Powered By Apache” logos include: The “Powered By Apache” circular banded logo may be used standalone with just the feather logo (denoting general use of an ASF project) or in combination with an official/authorized ASF Project logo. The official/authorized Project logo may not be altered in any way other than removing/separating the name(s) where applicable as approved by the associated Project Management Committee. The appropriate trademark symbol(s), such as ® or ™, associated with the project's logo must be included in the logo. The logo's circular band format, font, and color must not be altered in any way. The logo and/or its contents must not be rotated, animated, distorted, or otherwise altered, nor should it be used as a graphic element, background, or pattern. The logo and/or its contents must not be translated or localized, nor should it have versioning numbers or other unauthorized words added to it. The preferred background color for the logo is white, however, the logo may appear on colored, black, or image/photographic backgrounds providing the logo's legibility is not compromised. The logo may be sized and produced in multiple file formats as required by the Project Management Committee, with a preferred minimum size of 80 pixels high in Web/online applications (where possible) to ensure legibility. The logo may not, under any circumstances, be incorporated with a third party's company name, product name, or logo(s), or adopt marks and/or logos that are confusingly similar to or imply improper association with The Apache Software Foundation. Third parties and programs are not allowed to use official Apache project logos and/or create alternate logos or identifying marks relating to any Apache project without written permission from the associated Project Management Committee and/or ASF Brand Management. We have a trademark use policy for the "Powered By" phrase In addition, official Apache Project pages and documentation on apache.org must utilize the appropriate trademark symbols on the respective Project logo, along with the following footnote: "Apache, Apache [PROJECT NAME], and the Apache [PROJECT NAME] logo are registered trademarks or trademarks of The Apache Software Foundation in the U.S. and/or other countries." "Powered By" Logo¶ Powered By Apache Logo - PDF Powered By Apache Logo - SVG Powered By Apache Logo - EMF Project "Powered By" Logos¶ Logos for individual projects, such as the ones below, are available in jpg, png, and psd format. They can be retrieved by requesting http://www.apache.org/foundation/press/kit/poweredBy/pb-PROJECTNAME.jpg, or http://www.apache.org/foundation/press/kit/poweredBy/pb-PROJECTNAME.png, http://www.apache.org/foundation/press/kit/poweredBy/pb-PROJECTNAME.psd. For example, the Powered by Logo for Apache Tomcat can be retrieved from poweredBy/pb-tomcat.jpg, poweredBy/pb-tomcat.png and the poweredBy/pb-tomcat.psd If you are unable to find the logo you are looking for, try inspecting the directory listing. If you still can't find what you need please contact the project's mailing list. Template for "Powered By" Logos¶ Build Your Badge canvas#canvas_poweredBy_1, canvas#canvas_poweredBy_2, canvas#canvas_poweredBy_3 { display: none; } .poweredBy_canvas_container img { margin: 0 20px 20px 0; float: left; max-width: 350px; } input#btnLoad { padding: 2px 5px; background: white; border: thin solid black; font-family: "Super Grotesk"; } With this handy tool you can create your own Project Powered By Badge. Select your logo saved in a square format. (Non square images may result in improperly cropped results.) Your logo will be displayed in the Powered By badge. Now you can save it and use as needed. Sorry, your browser settings do not support JavaScript! The new blank template for the “Powered By” logos as well as select project “Powered By” logos can be downloaded on our template site. The old template (black “powered by” band) is deprecated and should not be used for any current graphics use. ASF Badges¶ Badges containing pictorial marks of the Apache Feather with various taglines and colors are available for broad community use. These images can be used in any application. ¶ Violet Orange Magenta Indigo Gray Goldenrod Crimson CMYK AIEPSPDFSVG AIEPSPDFSVG AIEPSPDFSVG AIEPSPDFSVG AIEPSPDFSVG AIEPSPDFSVG AIEPSPDFSVG RGB AIEPSPDFSVG AIEPSPDFSVG AIEPSPDFSVG AIEPSPDFSVG AIEPSPDFSVG EPSPDFSVG AIEPSPDFSVG Community Over Code Logo¶ The official event logo for Community Over Code, ASF's flagship annual event. Community Over Code AI Community Over Code PNG Community Over Code SVG'''
