["https://apache.org/dev"]
title = "Developer Information"
description = "Home page of The Apache Software Foundation"
full_description = '''Developer information¶ Overview¶ Here are resources pertinent to developers, committers, release managers and Project Management Committee (PMC) members contributing to any Apache project. If you can't find information here, ask on your project's mailing list, or contact the Community Development project's mailing list for more general questions. There are many experienced ASF people ready to help. Infrastructure Committers and Contributors Pasting data to share with others URL shortener for committers Project Management Committees (PMC) Version control Websites Releases Issue tracking Mailing lists Licenses and legal issues Board of Directors and ASF Governance Apache Infrastructure¶ Here are links to high-level information about The ASF's infrastructure, and the Infrastructure team (Infra) that maintains it. infra.apache.org has more detailed information for projects, contributors, and committers: Policies and guidelines Services and tools for projects How to become an Infra Volunteer Host and service status monitor. Infa has already been alerted if a service shows as down. Machine and host list of Apache servers Infra's Confluence Wiki area has detailed technical information, script snippets, and other resources to help Project Management Committees do what they need to do. If you cannot find the resource or guidance you need, contact Infra. Committers and Contributors¶ How the ASF works (See also Contact Apache FAQ and ASF FAQ ) Guide for project contributors Email etiquette tips for contributors Guide for project committers How committers can publish a personal website General Committers FAQ Crowd funding Community funding disclaimer Project Management Committees (PMCs)¶ The project PMC must be involved in any requests for Infrastructure assistance. Remember that PMCs can handle many infrastructure items themselves. Read the PMC FAQ. Learn how to... ...create an ASF Top-Level Project ...choose names for ASF projects and products ...request a new committer account ...request karma ...report issues and request project resources ...manage your project website Learn the duties of the PMC Chairs Licenses, Trademarks, and Legal issues¶ About the Apache License License FAQ Legal policies, forms, and information for Apache Committers ASF source header and copyright notice policy "How-to" guide for assembling LICENSE and NOTICE Rationale for how to apply the Apache License, Version 2.0 (descriptive, not policy) Apache trademark policy - for outside parties Apache project branding requirements - for projects Version Control¶ Subversion and Git source code repositories Using proper SVN eol-style Git Access to Apache Code repositories Apache Project Websites¶ How to manage your project website update the apache.org website Software Product Releases¶ Release Policy Release distribution policy Release creation process Release download pages Apache Maven Jar repositories Signing releases How to Use OpenPGP for key management How to transition to a longer key Releases from Incubating projects Issue and Bug Tracking¶ Each project uses an issue tracker of their choice to track bugs, enhancement requests, and other action items - typically GitHub Issues, Jira, or BugZilla. Check the website of the project in which you are interestaed to learn what they use. Mailing Lists¶ Please read the Public Forum Archive Policy before posting on any Apache mailing list! Subscription instructions and netiquette for all Apache mailing lists. All Apache projects have their own set of project-specific mailing lists. There are some other non-project mailing lists, such as legal-discuss@, community@ and various announcement lists. Privacy notes about non-public lists and about balancing confidentiality and public discussion. Email etiquette tips for contributors How to moderate Apache mailing lists All Apache mailing lists are archived: Read most Apache list archives on mail-archives.apache.org by going to the specific project list, then append the mbox filename to the URL (e.g. mail-archives.apache.org/mod_mbox/httpd-dev/201210.mbox) Raw mbox archive files are available for every mailing list. Each project website has a "mail" directory, e.g. httpd.apache.org/mail/ (see notes). For top-level/non-project mailing lists see www.apache.org/mail/ directory. Apache URL Shortener Service¶ Infrastructure hosts the s.apache.org URL shortening service for our committers. When including URLs in PMC reports, please use this service and not other URL shorteners.'''
year_published = 2025
