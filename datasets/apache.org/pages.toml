description = "Home page of The Apache Software Foundation"
full_description = "Contact Us¶ Before sending mail to the address below, make sure that the information on the FAQ doesn't already address your issue. If it is, the only response you'll receive is a pointer to that page. Project Contacts¶ All technical questions and questions about a specific ASF project should be addressed to the appropriate project-specific mailing list. Security Contacts¶ Visit the ASF Security page to learn how to report a security vulnerability. Academic Researchers¶ To ensure that our communities are respected, and to make it easier for researchers to find the right information, our volunteers maintain a Research Information Portal. Foundation Directory¶ Inquiry Contact Technical Support If you believe you’re experiencing a technical issue, visit the Technical section of our FAQ first before reaching out. Hosting a project with ASF Apache Incubator Press and analyst inquiries Newsroom press@apache.org Sponsorship or donation inquiries Foundation Sponsorship Individual Supporters fundraising@apache.org Trademarks or service marks including all Apache project names and logos Trademark Contacts Legal and Licensing Licensing FAQ Legal Affairs Committee Infrastructure Infrastructure Contact Website Issues with a specific Apache project's website should go to that project's dev@ mailing list. For issues with the foundation top-level website apache.org or news.apache.org: press@apache.org DMCA Designated Agent DMCA Agent Exports Exports Mailing Address¶ The Apache Software Foundation 1000 N West Street, Suite 1200 Wilmington, DE 19801 U.S.A. Important. If you are not the State of Delaware, a sponsor, or a supplier, it is extremely likely that you should use one of the above email aliases instead of faxing or postal mail. Please read the first part of this page, and email apache@apache.org if in doubt."
