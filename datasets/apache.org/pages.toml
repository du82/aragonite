description = "Home page of The Apache Software Foundation"
full_description = "Licenses¶ The Apache Software Foundation uses various licenses to distribute software and documentation, and to accept regular contributions from individuals and corporations and larger grants of existing software products. These licenses help us achieve our goal of providing reliable and long-lived software products through collaborative, open-source software development. In all cases, contributors retain full rights to use their original contributions for any other purpose outside of Apache while providing the ASF and its projects the right to distribute and build upon their work within Apache. Licensing of ASF Products¶ All software produced by The Apache Software Foundation or any of its projects or subjects is licensed according to the terms of the documents listed below. Page Description Apache License 2.0 Our current license ¶ Apache License 1.1 The 1.1 version of the Apache License was approved by the ASF in 2000 ¶ Apache License 1.0 This is the original Apache License ¶ Contributor License Agreements¶ For information regarding our CLAs, please consult the ASF Contributor License Agreements page. Page Description CLAs ASF CLAs ¶ Software Grant One-off software license to the ASF ¶ How To How to submit CLAs/Software Grant ¶ Other Legal Info¶ Page Description ASF Export Classifications U.S. Export Classifications ¶ ASF Trademark Use Policy Policy on using ASF Trademarks ¶ Questions?¶ For answers to frequently asked licensing questions, please consult our Licensing Frequently Asked Questions page."
