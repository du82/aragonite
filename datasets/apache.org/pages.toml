["https://apache.org/press"]
title = "ASF Newsroom | Apache Software Foundation"
description = "Home page of The Apache Software Foundation"
full_description = 'ASF Newsroom¶ Recent News¶ Go to Foundation Newsroom View Reports Publicity Guidelines for ASF Top-Level Projects¶ ASF top-level projects (TLPs) and their communities are encouraged to actively build awareness of their project and activities through marketing and communications activities such as public relations, email, content, social media, website, and branding. Educational opportunities include Community Over Code, meetups, videos, podcasts, articles, third party conferences, and related community events. TLP participants are invited to review the guidelines in the internal ASF wiki page. Third Party Press Release Support¶ Press releases that refer to the ASF and/or its projects must be approved by the VP Marketing and Publicity prior to distribution. Please allow for a minimum of 10 business days to complete the review. We are sensitive to internal approval processes and will expedite feedback when possible. The ASF is vendor-neutral and does not provide testimonials that endorse, promote, or advertise the capability, credibility, or quality of any technology, product, or service. Joint announcements are rarely issued. Examples of such releases include instances where a major industry milestone or initiative takes place, or announcing ASF Platinum Sponsorships. You may request a quote for your ASF-related press release. Quotes may not be included unless approved by the VP Marketing & Publicity. Third-party press releases must not include the ASF boilerplate, dateline location, logo, or media contacts. No formal press releases or announcements can be made by a third party on behalf of an Apache project, e.g., "Company ABC announces new features in Apache Project Name" or mentioning the project as part of upcoming features/support in their own products. Interested parties may issue supporting announcements with pointers to news originated by ASF or the project, e.g. a link to the corresponding mailing list, webpage or blog post. Third-Party Brand Support¶ Organizations are responsible for adhering to ASF trademark policies. For questions about branding and trademark, please visit https://apache.org/foundation/marks/contact. The publicity/brand/communications guidelines created by Databricks serve as a "good practice" model for other ASF-focused organizations to emulate. Contact Us¶ press@apache.org'
