full_description = "Community Resources¶ Your Awesome List of community programs and resources. Resource Details ASF Code of Conduct We expect everyone who participates to honor our code of conduct. ASF Committer Directory An index of projects and committers for every ASF project. ASF Memorials Valued members we have lost. Apache Local Community (ALC) ALCs are local groups of ASF / open source enthusiasts in towns/cities around the world. Community Over Code ASF’s flagship community event in North America, Europe, and Asia. Community Events Calendar of upcoming community and ASF events. Contributor Getting Started The best place to learn how to get started contributing to ASF projects. Committer Getting Started Details on how to move from Contributor to Committer. Google Summer of Code (GSoC) A global, online mentoring program focused on introducing new contributors to open source software development. ASF is registered as a mentoring organization for GSoC. Mentoring Mentoring is the process of actively bringing someone along in a discipline - investing your time into influencing the future. Travel Assistance ASF provides financial assistance to those who would otherwise be unable to attend various Community Over Code events. Working Groups Working groups are informal groups who are working on specific tasks or topics. Each group has a mission, and operates independently, reporting back to the PMC on any activities that it wishes to make visible to the ASF Membership."
