["https://apache.org/asf25years"]
title = "Celebrating 25 Years at The ASF"
description = "Home page of The Apache Software Foundation"
full_description = "Apache IoTDB¶ In 2022, Deutsche Bahn started a multi-year project, BZ-NEA, to migrate backup power sources from fossil fuels to fuel cells, an energy efficient and carbon neutral alternative. IoTDB enables Deutsche Bahn to monitor and manage its railway infrastructure systems while meeting Germany’s security regulations for any software that is used in critical infrastructure. Apache Storm¶ CommonCrawl, a project powered by Apache Storm, publishes data freely and openly for the greater good. One part of the datasets is a collection of news archives produced by StormCrawler, an open source distributed web crawler under ASF license. Apache Airflow¶ Genomic algorithms are highly demanding of CPU, RAM, and storage. The data engineering team at C2i Genomics uses Apache Airflow to enable high-scale orchestration of genomic algorithms for cancer research. Watch Video → Apache Superset¶ The City of Ann Arbor uses Apache Superset to deliver high-quality data reporting for its public-facing dashboards including rain gauges, air quality, and traffic crash reporting – saving the city 94% in costs. Read More → Recently Graduated Projects¶ Apache EventMesh Apache Flagon Apache Kvrocks Apache OpenDAL Apache SeaTunnel Apache Attic¶ If a project is no longer being supported by an active community, it’s retired to the Apache Attic for preservation including code, mailing lists, and all other project communications in the event that those artifacts become useful again in the future. Recent projects that entered the Attic include: Apache OODT, Apache Giraph, Apache MXNet, Apache Any23, and Apache jUDDI."
