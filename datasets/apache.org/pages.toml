full_description = '''Our Sponsors¶ The Apache Software Foundation could not exist without the continued generous support from the community. We would like to take this opportunity to thank our sponsors. If you are interested in sponsoring the ASF, please read our sponsorship page. Foundation Sponsors¶ Platinum Sponsors:¶ Apple Amazon Web Services Facebook GEICO Google Huawei Microsoft Pineapple Fund VISA Yahoo! Gold Sponsors:¶ Aiven Anonymous Baidu Bloomberg ByteDance Cloudera Confluent IBM Union Investment Workday Silver Sponsors:¶ American Express Capital One Indeed LY Corporation Red Hat, Inc. Salesforce Snowflake Bronze Sponsors:¶ Canva Engineering CarGurus Curity Datastrato GridGain Grist Labs Libriciel RX-M RenaissanceRe Sentry The Blog Starter Trace Machina Targeted Sponsors¶ ASF Targeted Sponsors provide the Foundation with contributions for specific activities or programs, such as donating cloud services, funding a project hackathon, providing legal services, offering a community member benefit, underwriting expenses for our flagship event, or something entirely new. It's the Apache way of recognizing the sponsors that we rely on every day outside of and often in addition to funding our general operations. Targeted Platinum Sponsors:¶ Amazon Web Services CloudBees DLA Piper Gradle JFrog Microsoft OSU Open Source Labs Yahoo! Sonatype JetBrains Fastly GitHub Targeted Gold Sponsors:¶ Atlassian Datadog Docker PhoenixNAP DinoSource Targeted Silver Sponsors:¶ NetApp Instaclustr Xiaomi Targeted Bronze Sponsors:¶ Bloomberg Education Networks of America Google Hopsie No-IP PagerDuty Peregrine Computer Consultants Corporation Sonic.net SURFnet Virtru var ar = ['platinum','gold','silver','bronze','targetedplatinum','targetedgold','targetedsilver','targetedbronze']; var co = [ 2, 3, 5, 6, 2, 3, 5, 6 ]; // column counts for (y in ar) { var ul = document.getElementById(ar[y]) // randomise platinum (and platinum targeteded sponsors) if (ar[y] == 'platinum' || ar[y] == 't