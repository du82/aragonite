title = "Our Sponsors | Apache Software Foundation"
description = "Home page of The Apache Software Foundation"
full_description = '''Our Sponsors¶ The Apache Software Foundation could not exist without the continued generous support from the community. We would like to take this opportunity to thank our sponsors. If you are interested in sponsoring the ASF, please read our sponsorship page. Foundation Sponsors¶ Platinum Sponsors:¶ Apple Amazon Web Services Facebook GEICO Google Huawei Microsoft Pineapple Fund VISA Yahoo! Gold Sponsors:¶ Aiven Anonymous Baidu Bloomberg ByteDance Cloudera Confluent IBM Union Investment Workday Silver Sponsors:¶ American Express Capital One Indeed LY Corporation Red Hat, Inc. Salesforce Snowflake Bronze Sponsors:¶ Canva Engineering CarGurus Curity Datastrato GridGain Grist Labs Libriciel RX-M RenaissanceRe Sentry The Blog Starter Trace Machina Targeted Sponsors¶ ASF Targeted Sponsors provide the Foundation with contributions for specific activities or programs, such as donating cloud services, funding a project hackathon, providing legal services, offering a community member benefit, underwriting expenses for our flagship event, or something entirely new. It's the Apache way of recognizing the sponsors that we rely on every day outside of and often in addition to funding our general operations. Targeted Platinum Sponsors:¶ Amazon Web Services CloudBees DLA Piper Gradle JFrog Microsoft OSU Open Source Labs Yahoo! Sonatype JetBrains Fastly GitHub Targeted Gold Sponsors:¶ Atlassian Datadog Docker PhoenixNAP DinoSource Targeted Silver Sponsors:¶ NetApp Instaclustr Xiaomi Targeted Bronze Sponsors:¶ Bloomberg Education Networks of America Google Hopsie No-IP PagerDuty Peregrine Computer Consultants Corporation Sonic.net SURFnet Virtru var ar = ['platinum','gold','silver','bronze','targetedplatinum','targetedgold','targetedsilver','targetedbronze']; var co = [ 2, 3, 5, 6, 2, 3, 5, 6 ]; // column counts for (y in ar) { var ul = document.getElementById(ar[y]) // randomise platinum (and platinum targeteded sponsors) if (ar[y] == 'platinum' || ar[y] == 'targetedplatinum') { for (var i = ul.children.length; i >= 0; i--) { ul.appendChild(ul.children[Math.random() * i | 0]); } } // force the correct number of columns var cols = co[y]; // we divide by cols+1 to allow for spacing between elements var minwidth = (1000 / (cols+1)) | 0; var style = "display: inline-block; min-width: " + minwidth + "px;"; for (var i = ul.children.length-1; i >= 0; i--) { ul.children[i].setAttribute("style", style) } ul.setAttribute("style", "margin: 0 auto; max-width: 1000px; list-style: none;") } Sorry, your browser settings do not support JavaScript!'''
