["https://apartresearch.com"]
title = "Apart Research"
description = "Apart Research is an independent research organization focusing on AI safety. We facilitate and run fellowships and events in AI security research."
full_description = "Apart Research is a non-profit AI safety lab. We host open-to-all research sprints, publish papers, and incubate talented researchers to make AI safe and beneficial for humanity. This week, we celebrate ICLR conference oral awards for two of our papers, launch our Women in AI Safety hackathon, and more. Apart Research's newest paper Rethinking CyberSecEval: An LLM-Aided Approach to Evaluation Critique looks at LLM-assisted benchmark analysis. Jacob Haimes*¹, Cenny Wenner*¹, Kunvar Thaman¹, Vassil Tashev¹, Clement Neo¹, Esben Kran¹, Jason Schreiber¹¹Apart Research, *Lead Authors Luke Marks∗†, Amir Abdullah∗† ♢, Clement Neo†, Rauno Arike†, David Krueger□, Philip Torr‡, Fazl Barez∗‡ †Apart Research, ♢Cynch.ai, □University of Cambridge, ‡Department of Engineering Sciences, University of Oxford Luke Marks∗†, Amir Abdullah∗† ♢, Clement Neo†, Rauno Arike†, David Krueger□, Philip Torr‡, Fazl Barez∗‡ †Apart Research, ♢Cynch.ai, □University of Cambridge, ‡Department of Engineering Sciences, University of Oxford Jacob Haimes*¹, Cenny Wenner*¹, Kunvar Thaman¹, Vassil Tashev¹, Clement Neo¹, Esben Kran¹, Jason Schreiber¹¹Apart Research, *Lead Authors Our core team makes the magic happen! Contact any of us if you are interested in our work or would like to join the core team. See our open research process on our Discord server. Create different datasets with vastly differing types of data and fine-tune language models on these to see which domains lead to better alignment and analyze the different value groundings of the models. Study the decay of aggressive action in the face of rule / context change in simulated agents, i.e. have agents fight in fighting game and let the same characters collaborate with the same control scheme in another type of game. How quickly do they adapt and is it easier in one direction than the other? Create an overview of the main ways neural, probabilistic models are different from symbolic, logical AI safety problems. Relate to contemporary models and use cases."
