["https://apartresearch.com/lab"]
title = "Apart Lab"
description = "Join our research sprints and create MVPs for research projects within evals, governance and interpretability to be invited for the Apart Lab program."
full_description = "This 8-week program is designed for Sprint participants who want to test their fit in the AI safety space, are excited by their hackathon idea, and want to make the most of it. While polishing your hackathon work, and ideating onimpactful research directions, you will learn from experienced colleagues in AI safety. As a member of Apart Lab, you will have access to our resources and be part of our global community. If your work here is a great fit for our Fellowship—which offers a deeper dive into your topic—you may be invited to our Apart Lab Fellowship program. This 4-6 month program is for developing your research proposal into a fully realized, high-impact research project. In the fellowship, you'll dive deep into your project, and develop fundamental skills for AI safety research, including experimental design, and scientific communication, as well as expertise tied to your specific project, like LLM evaluation design, or working directly with model internals. You will draft a research paper, receive feedback from peers and Apart's community of researchers, and polish your work before submitting to top conferences. The Lab has hosted 80 researchers to date, with over 30 active researchers at any given time. Our talented team focuses on high-impact research areas such as evaluation methodologies, benchmarking, interpretability, and AI control. Most of their work aims for peer-reviewed publications, and some of their research has been utilized by prominent organizations like the former OpenAI Superalignment team, the UK AI Safety Institute, and Anthropic.Meet some of our fellows below and explore our publications here. Join our research sprints and create MVPs for research projects within evals, governance and interpretability to be invited for the Apart Lab program. Projects are selected in collaboration with our senior mentors. You will receive an invitation if a new cohort is starting and your project looks promising. During a meeting with one of the mentors, we decide the deadlines and first steps towards realizing your project!"
