["https://apartresearch.com/about/partners"]
title = "Partners | Apart Research"
description = "Make your events impactful with our research platform designed for original AI safety research sprints. Flexible contribution and in-kind support welcome."
full_description = "We specialize in accelerating frontier AI safety research towards real impact. Partner with us to share your message with thousands of highly talented AI safety researchers and support top-tier teams to make original research. Make your events impactful with our research platform designed for original AI safety research sprints. Flexible contribution and in-kind support welcome. Accelerate your research agenda with high-quality pilot research from hundreds of participants. Directly support AI safety. Flexible contribution and in-kind support welcome. Support research teams to create and publish original research within your impactful domain. Make your ideas go live at top-tier ML conferences, within our AI lab network, and with other AI safety organizations. Support our research and events by becoming a long-term compute sponsor, tool sponsor, or resources sponsor. Goodfire AI wanted to beta test their new interpretability research platform and find the many potential uses for their work. We hosted a research sprint for them where 277 participants submitted 27 original research projects using Goodfire's interpretability research API. Today, Goodfire continues to support research teams as they ready their research for publication. We hosted a sprint for METR where 168 researchers authored more than 120 specifications and implementations of tasks to test AI for autonomous capabilities. The resulting submissions contributed to their task suite along with existing contributors, such as the UK AI Safety Institute, among others. It was a great chance for METR to engage with the research community and improve their bounty system. CAIF needed to create a large collection of examples where multi-agent AI systems may cause large risks. To accelerate this work, we engaged 155 participants to submit 21 pilot research projects where several teams ended up contributing to a large report on multi-agent risk that is still under development. Make your money count with a direct donation to Apart Research. You will directly support our work to accelerate talented researchers into the field of AI safety and publish impactful technical research to make AI safe and beneficial for humanity.You can donate in a variety of international currencies and crypto currencies. We are a fiscally sponsored US 501(c)3 non-profit project."
year_published = 2025
