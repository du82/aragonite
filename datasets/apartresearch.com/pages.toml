["https://apartresearch.com/event/hardware-challenge"]
title = "Hardware Challenge: Verify & Protect AI Hardware"
description = "Join us to verify and protect compute hardware with real experimental equipment and data. $2,000 in prizes available."
full_description = '''Join us for an innovative hardware security hackathon focused on building new methods verify and protect AI hardware! Work with cutting-edge side-channel monitoring equipment, collaborate with experts in hardware security, and help develop crucial tools for AI governance. $2000 in prizes available across builder and breaker tracks. This hackathon brings together hardware experts, security researchers, and AI safety enthusiasts to develop and test verification systems for detecting AI training activities through side-channel analysis. Participants will work with state-of-the-art hardware setups to create innovative solutions for monitoring compute usage. In the Builder track, you will create new methods to detect stealth AI training runs and new verification protocols to ensure responsible use of compute. In the Breaker track, you'll be tasked to evade classification algorithms with new types of training, making it more difficult for the Builders (and at the same time showing us how easy it might be to evade existing verification methods). Free accommodation, food and co-working stations provided! Location: 36 York Street, Blackpool, FY15AQ. Please register through our Luma event page so we know you're coming! Free accommodation, food and co-working stations provided! Location: 36 York Street, Blackpool, FY15AQ. Please register through our Luma event page so we know you're coming! AI Safety Bulgaria & Resonator are hosting a physical location for all interested bulgarians guests of Sofia. See you at Pette Kyosheta, ul. "20-ti april" 13, 1606 Sofia. AI Safety Bulgaria & Resonator are hosting a physical location for all interested bulgarians guests of Sofia. See you at Pette Kyosheta, ul. "20-ti april" 13, 1606 Sofia. AI Safety Bulgaria & Resonator are hosting a physical location for all interested bulgarians guests of Sofia. See you at Pette Kyosheta, ul. "20-ti april" 13, 1606 Sofia. AI Safety Bulgaria & Resonator are hosting a physical location