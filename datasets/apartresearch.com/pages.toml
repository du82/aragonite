["https://apartresearch.com/event/women-in-ai-safety-hackathon"]
title = "Women in AI Safety Hackathon"
description = "Join us for the Women in AI Safety Hackathon during International Women's Day weekend! This unique event brings together diverse perspectives to tackle crucial challenges in AI alignment, governance, and safety. Work alongside leading experts, develop innovative solutions, and help shape the future of responsible AI development. Open to all skill levels and backgrounds"
full_description = "Shape the future of safe and ethical AI development! Whether you're a researcher, developer, policy enthusiast, or new to AI safety - join us for an empowering weekend of innovation and collaboration. No prior AI safety experience required. Together, we can build the foundational tools and frameworks needed for responsible AI development. We're thrilled to partner with Women Who Do Data (W2D2), a member-led community dedicated to supporting diverse talent in AI technology development, to bring you this unique hackathon during International Women's Day weekend. Together, we're working to increase the presence of underrepresented groups in AI safety and technical AI development. We're excited to announce that Lambda Labs will be providing $400 in computing credits to each participating team! This generous support will give you access to powerful cloud instances (including A100s) to help bring your ideas to life. Each track will have a $600 prize for the winning team, with a total of $1,800 in prizes across all three tracks! The Women in AI Safety Hackathon brings together talented individuals to tackle crucial challenges in AI development and deployment. This event particularly encourages women and underrepresented groups to contribute their unique perspectives to critical areas of AI safety, including alignment, governance, security, and evaluation. As AI systems become increasingly powerful and pervasive, diverse perspectives in their development and safety mechanisms are more crucial than ever. This hackathon provides a platform for participants to: We're excited to announce that Goodfire, a pioneering research lab in AI interpretability, will be sponsoring our Mechanistic Interpretability track! We're also thrilled to have Myra Deng, Founding PM at Goodfire, join us for a HackTalk on understanding and steering AI models. 1. Understanding AI Model Internals: Dive deep into the inner workings of large language models using state-of-the-art sparse autoencoder techniques. Learn to map and understand model behavior at a granular level, while developing tools to interpret and visualize neural features. This track focuses on creating innovative approaches to understand what's happening inside these complex systems."
