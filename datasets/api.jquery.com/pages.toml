full_description = 'ajaxComplete event Categories: Ajax > Global Ajax Event Handlers .on( "ajaxComplete", handler )Returns: jQuery Description: Register a handler to be called when Ajax requests complete. This is an AjaxEvent. version added: 1.7.on( "ajaxComplete", handler ) "ajaxComplete" Type: string The string "ajaxComplete". handler Type: Function( Event event, jqXHR jqXHR, PlainObject ajaxOptions ) The function to be invoked. This page describes the ajaxComplete event. For the deprecated .ajaxComplete() method, see .ajaxComplete(). Whenever an Ajax request completes, jQuery triggers the ajaxComplete event. Any and all registered ajaxComplete handlers are executed at this time. To observe this method in action, set up a basic Ajax load request: 1 2 3 <div class="trigger">Trigger</div><div class="result"></div><div class="log"></div> Attach the event handler to the document: 1 2 3 $( document ).on( "ajaxComplete", function() { $( ".log" ).text( "Triggered ajaxComplete handler." );} ); Now, make an Ajax request using any jQuery method: 1 2 3 $( ".trigger" ).on( "click", function() { $( ".result" ).load( "ajax/test.html" );} ); When the user clicks the element with class trigger and the Ajax request completes, the log message is displayed. All ajaxComplete handlers are invoked, regardless of what Ajax request was completed. If you must differentiate between the requests, use the parameters passed to the handler. Each time an ajaxComplete handler is executed, it is passed the event object, the XMLHttpRequest object, and the settings object that was used in the creation of the request. For example, you can restrict the callback to only handling events dealing with a particular URL: 1 2 3 4 5 6 $( document ).on( "ajaxComplete", function( event, xhr, settings ) { if ( settings.url === "ajax/test.html" ) { $( ".log" ).text( "Triggered ajaxComplete handler. The result is " + xhr.responseText ); }} ); Note: You can get the returned Ajax contents by looking at xhr.responseText. Additional Notes: As of jQuery 1.9, all the handlers for the jQuery global Ajax events, including those added with .on( "ajaxComplete", ... ), must be attached to document. If $.ajax() or $.ajaxSetup() is called with the global option set to false, the ajaxComplete event will not fire. Example: Show a message when an Ajax request completes. 1 2 3 $( document ).on( "ajaxComplete", function( event, request, settings ) { $( "#msg" ).append( "<li>Request Complete.</li>" );} );'
