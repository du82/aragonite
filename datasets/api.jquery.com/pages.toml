full_description = "Traversing > Miscellaneous Traversing .add() Create a new jQuery object with elements added to the set of matched elements. Traversing > Miscellaneous Traversing .addBack() Add the previous set of elements on the stack to the current set, optionally filtered by a selector. Attributes | Manipulation > Class Attribute | CSS .addClass() Adds the specified class(es) to each element in the set of matched elements. Manipulation > DOM Insertion, Outside .after() Insert content, specified by the parameter, after each element in the set of matched elements. Ajax > Global Ajax Event Handlers ajaxComplete event Register a handler to be called when Ajax requests complete. This is an AjaxEvent. Deprecated > Deprecated 3.5 | Ajax > Global Ajax Event Handlers .ajaxComplete() Register a handler to be called when Ajax requests complete. This is an AjaxEvent. Ajax > Global Ajax Event Handlers ajaxError event Register a handler to be called when Ajax requests complete with an error. This is an Ajax Event. Deprecated > Deprecated 3.5 | Ajax > Global Ajax Event Handlers .ajaxError() Register a handler to be called when Ajax requests complete with an error. This is an Ajax Event. Ajax > Global Ajax Event Handlers ajaxSend event Attach a function to be executed before an Ajax request is sent. This is an Ajax Event. Deprecated > Deprecated 3.5 | Ajax > Global Ajax Event Handlers .ajaxSend() Attach a function to be executed before an Ajax request is sent. This is an Ajax Event. Ajax > Global Ajax Event Handlers ajaxStart event Register a handler to be called when the first Ajax request begins. This is an Ajax Event. Deprecated > Deprecated 3.5 | Ajax > Global Ajax Event Handlers .ajaxStart() Register a handler to be called when the first Ajax request begins. This is an Ajax Event. Ajax > Global Ajax Event Handlers ajaxStop event Register a handler to be called when all Ajax requests have completed. This is an Ajax Event. Deprecated > Deprecated 3.5 | Ajax > Global Ajax Event Handlers .ajaxStop() Register a handler to be called when all Ajax requests have completed. This is an Ajax Event."
