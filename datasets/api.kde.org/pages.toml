["https://api.kde.org/polkit-qt-1/html/index.html"]
title = "PolkitQt-1 - Polkit-qt-1 - Qt wrapper around polkit-1"
description = "KDE products API documentation"
full_description = '''KDE API Reference PolkitQt-1 PolkitQt-1 /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ var searchBox = new SearchBox("searchBox", "search/",'.html'); /* @license-end */ /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ $(function() { codefold.init(0); }); /* @license-end */ /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ $(function(){initNavTree('index.html',''); initResizable(true); }); /* @license-end */ Polkit-qt-1 - Qt wrapper around polkit-1 Overview NotePlease note that if you're developing an application which can rely not just on Qt modules, but also Qt extensions like from the KDE Frameworks, you might want to use instead KAuth from KDE Frameworks. polkit-qt-1 aims to make it easy for Qt developers to take advantage of polkit API. It is a convenience wrapper around QAction and QAbstractButton that lets you integrate those two components easily with polkit. polkit-qt-1 is not a direct replacement of polkit-qt: it is based on polkit-1, which is not backwards compatible in any way with Policykit <= 0.9, which was the backend of polkit-qt. You are encouraged to port polkit-qt applications to polkit-qt or KAuth (from KDE Frameworks), since PolicyKit <= 0.9 is no longer maintained. polkit-qt-1 is split in three libraries: polkit-qt-core-1, polkit-qt-gui-1 and polkit-qt-agent-1 polkit-qt-core-1 lets you control actions and authentication without a GUI, with some very simple functions. It also lets you retrieve and control useful information on the polkit authority. You will be mostly interested in the Authority class. polkit-qt-gui-1 lets you easily associate GUI items with polkit actions. Through some simple wrapper classes you are able to associate QAction and QAbstractButton to a polkit action, and get their properties changed accordingly to polkit's result. It includes the classes Action, ActionButton and ActionButtons polkit-qt-agent-1 lets you write your own polkit authentication agents in a very simple way. A sample usage of polkit-qt-1 can be found in Polkit-qt-1 usage example Alphabetical Class List Class Hierarchy This file is part of the KDE documentation. Documentation copyright © 1996-2025 The KDE developers. Generated on Fri Feb 28 2025 11:59:15 by doxygen 1.13.2 written by Dimitri van Heesch, © 1997-2006 KDE's Doxygen guidelines are available online.'''
