["https://api.kde.org/marble/html/index.html"]
title = "Marble - Marble"
description = "KDE products API documentation"
full_description = '''KDE API Reference Marble Marble /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ var searchBox = new SearchBox("searchBox", "search/",'.html'); /* @license-end */ /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ $(function() { codefold.init(0); }); /* @license-end */ /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ $(function(){initNavTree('index.html',''); initResizable(true); }); /* @license-end */ Marble Marble is an application that displays a view of the earth. It is both a valuable application in its own right, but also an example program that shows how you can use the Marble widgets in your own applications. We have designed Marble so that you can use its components easily to enhance your application with geo services. This manual enumerates the components and describes how to use them in your own application. The Marble application makes use of the following classes and widgets: MarbleWidget, the main widget in any application using the Marble framework. This widget displays a view of the earth or any other globe, depending on which dataset is used. The user can navigate the globe using either a control widget, e.g. the MarbleNavigator, or the mouse. MarbleModel, the data storage class that holds the data that is visualized in the MarbleWidget. The MarbleModel is created internally and can be accessed using the model() method. This data model contains several separate datatypes, among them: tiles which provide the background map, vectors which provide things like country borders and coastlines and placemarks which can show points of interest, such as cities, mountain tops or the poles. These two classes provide the core of the classes that comprise the Marble framework. You can use only them and get a very capable application. In addition to this, there is also a simple control widget called the MarbleNavigator that controls panning and zooming. This control widget can be used in simpler application where theming, searching and other advanced controls are not needed. To help you get started, we provide small example programs which you can find in the examples/cpp directory of the sources. They are also available online at KDE TechBase. See alsoMarble::MarbleWidget Marble::MarbleModel Marble::MarbleNavigator KDE TechBase: MarbleCPlusPlus This file is part of the KDE documentation. Documentation copyright © 1996-2025 The KDE developers. Generated on Fri Feb 28 2025 11:54:48 by doxygen 1.13.2 written by Dimitri van Heesch, © 1997-2006 KDE's Doxygen guidelines are available online.'''
