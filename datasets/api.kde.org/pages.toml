full_description = '''KDE API Reference Phonon Phonon /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ var searchBox = new SearchBox("searchBox", "search/",'.html'); /* @license-end */ /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ $(function() { codefold.init(0); }); /* @license-end */ /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ $(function(){initNavTree('index.html',''); initResizable(true); }); /* @license-end */ The Phonon Library API Reference Overview | Development Phonon provides a Qt-style interface for audio and video. It is aimed at the average desktop application, whether that is a game that needs sound effects or a full-blown multimedia playback application like Amarok or Bangarang. If you writing a Qt program and want audio or video playback, then Phonon is almost certainly the right choice for you. It provides an API that any Qt developer will be comfortable with, and uses the native multimedia frameworks on Windows and MacOS. On UNIX systems, where there is no one standard multimedia system, it offers GStreamer and VLC backends. However, Phonon is not aimed at professional audio applications (in the style of Audacity, say). For these applications, you will probably want more control over the audio layer than Phonon will give you, and you should probably be using something like JACK. Author(s)Matthias Kretz <kretz.nosp@m.@kde.nosp@m..org> Ricardo Villalba <rvm@e.nosp@m.scom.nosp@m.posli.nosp@m.nux..nosp@m.org> Ian Monroe <ian@m.nosp@m.onro.nosp@m.e.nu> Colin Guthrie <phono.nosp@m.n@co.nosp@m.lin.g.nosp@m.uthr.nosp@m..ie> Martin Sandsmark <marti.nosp@m.n.sa.nosp@m.ndsma.nosp@m.rk@k.nosp@m.de.or.nosp@m.g> Harald Sitter <sitte.nosp@m.r@kd.nosp@m.e.org> Nokia Corporation and/or its subsidiary(-ies) Maintainer(s)Harald Sitter <sitte.nosp@m.r@kd.nosp@m.e.org> License(s)Libraries: LGPLv2 Examples: MIT Backends: 