["https://api.kde.org/krita/html/index.html"]
title = "Krita - Krita Painting application"
description = "KDE products API documentation"
full_description = '''KDE API Reference Krita Krita /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ var searchBox = new SearchBox("searchBox", "search/",'.html'); /* @license-end */ /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ $(function() { codefold.init(0); }); /* @license-end */ /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ $(function(){initNavTree('index.html',''); initResizable(true); }); /* @license-end */ Krita Painting application Krita is an advanced and modular painting application. Krita is built around two core libraries: pigment and kritaimage. The pigment library abstracts colorspaces and color transformations. ColorSpaces provide functions to manipulate pixels. The kritcolor library loads colorspace plugins to extend the range of available colorspaces. The kritaimage library abstracts the storage, creation, inspection and manipulation of pixels stored in a rectangular area. It provides layers, filters, iterators and painters. Filters and paint operations are provided as service plugins loaded through the appropriate trader queries. There are the following types of plugins filters generators tools brush engines colorspaces import/export filters view plugins: plugins that extend krita with dockers, dialogs etcetera This file is part of the KDE documentation. Documentation copyright © 1996-2025 The KDE developers. Generated on Fri Feb 28 2025 11:53:39 by doxygen 1.13.2 written by Dimitri van Heesch, © 1997-2006 KDE's Doxygen guidelines are available online.'''
