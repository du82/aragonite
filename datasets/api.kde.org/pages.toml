full_description = '''KDE API Reference LibKmahjongg LibKmahjongg /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ var searchBox = new SearchBox("searchBox", "search/",'.html'); /* @license-end */ /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ $(function() { codefold.init(0); }); /* @license-end */ /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ $(function(){initNavTree('index.html',''); initResizable(true); }); /* @license-end */ libkmahjongg API Reference libkmahjongg is a library used for loading and rendering of Mahjongg tilesets and associated backgrounds, used by KMahjongg and KShisen. Shared data is installed to {kdedir}/share/apps/kmahjongglib/* Contents: -kmahjonggtileset.cpp/.h : implementation of the KMahjonggTileset class -kmahjonggbackground.cpp/.h: implementation of the KMahjongBackground class -tilesets: Directory for svg files and .desktop data describing the metrics of tiles -backgrounds: Art and .desktop description for backgrounds The tilesets and backgrounds are also used by Kajongg. Please remember that when you change their format. Questions? Contact Mauricio Piacentini mauri.nosp@m.cio@.nosp@m.tabul.nosp@m.eiro.nosp@m..com This file is part of the KDE documentation. Documentation copyright © 1996-2025 The KDE developers. Generated on Fri Feb 28 2025 12:01:47 by doxygen 1.13.2 written by Dimitri van Heesch, © 1997-2006 KDE's Doxygen guidelines are available online.'''
