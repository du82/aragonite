["https://api.kde.org/kdepim/index.html"]
title = "API Documentation"
description = "KDE products API documentation"
full_description = "KDE API Reference KDE PIM KDE PIM KDE PIM provides a set of libraries and applications to access and manage personal information like emails, contacts, events, etc. KDE PIM provides a set of libraries to parse and interact with various standardized PIM data formats, like RFC822 (KMime), ICAL (KCalendarCore) or VCARD (KContacts). The backbone of the entire suite is Akonadi, the PIM storage framework. Akonadi provides unified API to access and manage any kind of PIM data regardless of the actual storage backend. There are quite a few other libraries that provide PIM-specific widgets and utilities and can be useful for application developers who need to work with PIM data in their projects. Please note that unless stated otherwise, none of the libraries have stable API or ABI as of now. We are trying to keep the changes small and we always announce big changes ahead on the mailing lists, but as the project evolves we might need to adjust some API here and there. List of the libraries Framework Maintainer Android FreeBSD Linux Windows iOS macOS Akonadi PIM Storage Framework The KDE Community Android FreeBSD Linux Windows iOS macOS Akonadi Calendar Akonadi Calendar library The KDE Community Android FreeBSD Linux Windows iOS macOS Akonadi Contacts Akonadi Contacts library The KDE Community Android FreeBSD Linux Windows iOS macOS Akonadi Mime Akonadi Mime library The KDE Community Android FreeBSD Linux Windows iOS macOS Akonadi Search Akonadi indexing and searching library The KDE Community Android FreeBSD Linux Windows iOS macOS CalendarSupport Calendar Support library The KDE Community Android FreeBSD Linux Windows iOS macOS Eventviews Event views library The KDE Community Android FreeBSD Linux Windows iOS macOS GrantleeTheme KDE PIM Grantlee theme support library The KDE Community Android FreeBSD Linux Windows iOS macOS Gravatar Gravatar Support Library The KDE Community Android FreeBSD Linux Windows iOS macOS Incidenceeditor Incidenceeditor library The KDE Community Android FreeBSD Linux Windows iOS macOS KCalUtils The KDE calendar utility library The KDE Community Android FreeBSD Linux Windows iOS macOS Kgapi Implementation of APIs for various Google services The KDE Community Android FreeBSD Linux Windows iOS macOS KIdentityManagement Manage PIM identity The KDE Community Android FreeBSD Linux Windows iOS macOS KIMAP A job-based API for interacting with IMAP servers The KDE Community Android FreeBSD Linux Windows iOS macOS KIMAP2 A job-based API for interacting with IMAP servers The KDE Community Android FreeBSD Linux Windows iOS macOS KItinerary Itinerary extraction and data model The KDE Community Android FreeBSD Linux Windows iOS macOS KLdap LDAP support library The KDE Community Android FreeBSD Linux Windows iOS macOS KMbox MBox library support The KDE Community Android FreeBSD Linux Windows iOS macOS KMime The KMime Library The KDE Community Android FreeBSD Linux Windows iOS macOS KontactInterface Kontact Plugin Interface Library. The KDE Community Android FreeBSD Linux Windows iOS macOS KPimTextEdit Advanced text editor which provide advanced html feature. The KDE Community Android FreeBSD Linux Windows iOS macOS KPkPass PkPass file support The KDE Community Android FreeBSD Linux Windows iOS macOS KPublicTransport Public transport data querying API The KDE Community Android FreeBSD Linux Windows iOS macOS KSMTP SMTP library The KDE Community Android FreeBSD Linux Windows iOS macOS KTnef An API for handling TNEF data The KDE Community Android FreeBSD Linux Windows iOS macOS Libkdav2 The KDav library The KDE Community Android FreeBSD Linux Windows iOS macOS Libkdepim KDEpim Library The KDE Community Android FreeBSD Linux Windows iOS macOS Libkleo Kleopatra certificate management library The KDE Community Android FreeBSD Linux Windows iOS macOS Libksieve Sieve Script Library The KDE Community Android FreeBSD Linux Windows iOS macOS Mailcommon MailCommon Library The KDE Community Android FreeBSD Linux Windows iOS macOS MailImporter Mail Importer Library implements importing of emails from various other email clients The KDE Community Android FreeBSD Linux Windows iOS macOS MailTransport Manage mail transport The KDE Community Android FreeBSD Linux Windows iOS macOS Messagelib Messagelib Library which contains MessageComposer, MessageCore, MessageList, MessageViewer, MimeTreeParser, TemplateParser and WebEngineViewer The KDE Community Android FreeBSD Linux Windows iOS macOS Pimcommon PimCommon Library which contains PimCommon, PimCommonAkonadi The KDE Community"
