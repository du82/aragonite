description = "Get started with the basics of the TMDB API."
full_description = "Getting StartedGet started with the basics of the TMDB API. Suggest EditsWelcome to version 3 of The Movie Database (TMDB) API. This is where you will find the definitive list of currently available methods for our movie, tv, actor and image API. If you need help or support, please head over to our API support forum. To register for an API key, click the API link from within your account settings page. Please note that the API registration process is not optimized for mobile devices so you should access these pages on a desktop computer and browser. Before being issued an API key you will have to agree to our terms of use. You can read that here. A few useful tips... The configuration methods are useful to get the static lists of data we use throughout the database. You can find things like the languages, countries, timezones and translations that we use. The configuration method also holds useful image information. Understanding the basics of our authentication is useful. You can read about this here. We enforce some amount of rate limiting on the API. You can read about that here. Updated about 1 year ago Table of Contents A few useful tips..."
