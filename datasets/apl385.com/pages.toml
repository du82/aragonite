["https://apl385.com/gilling/history/heraldry.htm"]
title = "Heraldry in Gilling Castle"
description = """
Pictures of heraldic
shields from the Great Chamber of Gilling Castle, North Yorkshire."""
full_description = "This page compiled by Gill Smith 1996-99, as an Appendix to glossary of heraldic terms for reference. There are approximately 100 shields illustrated, and I am also considering adding shields for the wapentake panels. Most of the heraldic shields are found in the stained glass windows of the Great Hall or Chamber which is now used as the school’s dining hall; it is open to the public at certain times. There are three windows: the main, bay window contains mainly Fairfax family connections, culminating in the arms of Sir William Fairfax himself; the South window contains the arms of the Stapletons and their connections (Sir William’s second wife was Jane Stapleton); the East window contains shields relating to the Constable family (Sir William’s son Thomas married Catharine Constable of Burton Constable) — this window is a little later than the other two. The Fairfax and Stapleton windows are by Bernard Dininckhoff; a small panel records his signature and the date 1585. Some of the glass has been moved, and some is damaged or patched, but in general the shields of the successive generations are remarkably complete. There are informative panels in the glass which give details such as “Jaine Stapletone doughter & heire of Brian Stapletone esquire, who maried S Willm Fairfax Knight, biwhome he had issue Thomas Fairfax esquire”. There are also shields over the main fireplace in the Hall, showing the Royal Arms of Elizabeth I; Fairfax quartered with Malbis, Etton, Carthorpe, Ergham and Folyfayt; and four small shields impaling Fairfax with respectively Bellasys, Curwen, Vavasour and Roos. It should be noted that at some time the Carthorpe and Bellasys arms have been re-painted in the wrong colours. This is very understandable as the smoke from the fire has darkened everything almost to black! The frieze round the Great Chamber contains the famous “Wapentake Panels”. As Bilson says “The arms in the frieze as now painted are even less authentic than Elizabethan heraldry generally is, from the fact that errors and alterations have been made in repainting.” Partly because of this, partly because there is an enormous number of shields, and partly because the arms represented are not closely connected with the Fairfaxes and Gilling Castle, I have not included them here, though I may do so in future. Details can be found in Bilson’s article, and also in an excellent booklet by Hugh Murray on the Great Chamber, available from the Ampleforth Abbey/College bookshop."
year_published = 2025
clearnet = "https://apl385.com/gilling/history/heraldry.htm"
