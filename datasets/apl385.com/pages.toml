["https://apl385.com/Hardanger/norway09.htm"]
title = "Norway 2009"
full_description = "This was a 7-day trip exploring the inner Hardangerfjord, with walks on most days. I have split the pictures into blocks: We arrived on the train from Bergen. The following day we went up the cable car to the plateau above the town and then walked up towards the telecommunications mast on Lønahorgi – but didn’t make it as we didn’t want to miss the last cable-car down, which leaves at 5pm (the first one in the morning is 11am, which seems to give you a bit of a short day on the tops). Station clock at Voss. Plateau above Voss – the walking was remarkably similar to the moors at home! ...but the views were better... and Yorkshire cows don’t wear bells! View down over Lønavatnet. The moorland may have been like ours, but the flora contained several plants we don’t have, such as this starry saxifrage Saxifraga stallaris, which is only about half an inch across. As you can see, it likes it boggy. This was the furthest point we reached, just beyond the mountain hut Kvilahytta. Coming back down in the cable car this paraglider sailed overhead (there is a take-off point just beyond the top station). No idea what it means but this road sign caught my eye. This is part of the Voss Folkemuseum, a preserved collection of traditional wooden farm buildings. We walked along the old post road connecting Granvin to Ulvik which climbs up over a pass, via a lake, and then drops down to the fjord at Ulvik, going through orchards. Ulvik is right at the north-eastern tip of the Hardangerfjord, and despite being miles inland still has a tide of 3-4ft, which I found very strange. Unfortunately the weather deteriorated for this walk up the Husedalen, a valley with a sequence of four spectacular waterfalls (well, more what I would call steep rapids) one above the other. The walk itself was mostly along a gravel track, which wasn�t particularly exciting, but we did not fancy the alternative steep path straight up the hillside as it went across bare rock, and we thought it might be slippery in the rain."
year_published = 2025
