["https://apl385.com/anglesey2010/index.htm"]
title = "The Anglesey Outing 2010"
full_description = "All told, we did better for weather here than the Ryder Cup in south Wales. Anglesey has the great virtue of being low-lying and as far west as you can get, so there is nothing to provoke the clouds into raining. It also has some very pretty coastline and glorious expanses of sand with very few people to spoil your view. The coastal path really does track the shore for long stretches, only sometimes being forced inland by caravan parks which value their privacy. The stretch west of Benllech is mostly carboniferous limestone, and has some good exposures with fossils aplenty and a very clear basal conglomerate where it runs out into very much older rock. Looking at this sky, it is quite hard to believe that rain was not too far away, and that we would get quite damp on the return journey. Never mind, the Bay Cafe does a good Welsh Stew and an excellent pint of Guinness to make you feel better about the odd wet day. Over to the mainland for a bit of castle-spotting. It cleared just as we started working our way around the walls at Caernarfon, so a few good photo-opportunities. Unfortunately Beaumaris was less kind, so on the homeward run we just have Rhuddlan to offer you. Time for an amble down the coastal path towards the mainland, with some hope of finding the base of the limestone going this way too. Unfortunately the marked track into a very handy quarry was totally brambled up, so we backed off and climbed up here to enjoy the view. The next outing was to South Stack, around the corner from Holyhead. Lots of much older rock, and the birder in the party was suitably choughed to meet the local residents. Incidentally we think you should pronounce Chough as in Slough when it does a fair job of mimicking the very characteristic calls! Then back to Din Lligwy which we had looked at in the rain the day before, and wanted to see in better light. This is a very well-preserved romano-british settlement with workshops and two very grand roundhouses, the whole thing walled in by a polygonal line of boulders on edge. The nearby burial chamber and the henge and mound at Bryn Celli Ddu round off the history tour."
year_published = 2025
clearnet = "https://apl385.com/anglesey2010/index.htm"
