["https://apl385.com/leutasch/index.htm"]
title = "Photo album from Leutasch 2005 trip"
full_description = "These notes are a brief summary of 7 days’ walking in the Tyrol near Seefeld. The weather was very kind, being mostly cool, clear and sunny. Ideal for mountain views, in fact. Adrian got to play with his new toy (the Nikon D50) and the boys got to fool around building arches and taking stereo pairs. We arrived mid-afternoon from Munich in comfortable time for a walk up the hill above the village. M�sern is set right on the edge of the main Inn valley, and the Inntaler Hof is the last building in the village, so has splendid views over the valley. As you will see from the later pictures, there was definitely some weather on the way in from the west. At breakfast it was raining quite hard, but by the time we set off it was mostly just dripping from the trees. We took a slightly deviant route here (easy and recommended) going over the shoulder of Hohe Munde to the Rauthh�tte and on up as far as the Zugspitzeblick which has a splendid view over the upper Gaistal and is a perfect lunch stop. On the way down it really did rain, but had cleared nicely in time to take some dramatic shots of the little church opposite the Hotel Xander as we arrived. Yes, that really is snow all over Hohe Munde and its pals. Never mind, we reckoned on it melting by the time we had hiked up the track to Wangalm, and had our eye on the summit of the Gehrenspitze if the clouds stayed away. As it happens, we timed it about right, taking on the path up through the last of the snow. By the time we came down, most of the snow had gone, which made keeping your feet a lot easier. Definitely a loafing day - we ignored the walking notes and just ambled down the riverbank for a day’s skimming practice and waterworks construction. The Gehrenspitze was worth about 3 nutcase points - this little hike was definitely at the upper end of the nutcase scale (but worth it). Not recommended unless you are feeling very fit, know you have all day, and trust the grips on your boots on the way down. However it is well worth investigating the lower and middle sections of the Bergleintal even if you don't make the Stempl at the hut."
year_published = 2025
clearnet = "https://apl385.com/leutasch/index.htm"
