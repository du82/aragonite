["https://apl385.com/azores/index.htm"]
title = "The Azores"
full_description = "I visited the Azores for a week in May 2006. Unfortunately the weather was not particularly good, which is not too surprising in the middle of the Atlantic. We had a depression coming through in the middle of the week, with low cloud/fog and no good views of the landscape which was a pity, especially on São Jorge. Capelinhos volcano museum. This small museum has displays relating to the 1957/8 eruption of a new volcanic cone at the western end of Faial, known as Capelinhos. The eruption started offshore, building up an island which later became joined to the main island. The ash produced buried several houses and damaged the lighthouse at the (original) end of the island, covering its base with at least 2m of debris. Sadly I did not manage to see the rare Azores bullfinch or priolo, but did spot quite a few species including hearing the Cory’s shearwaters (known locally as cagarros) wailing at night, a very strange sound. I was surprised how few seabirds there seemed to be with the exception of the shearwaters and terns (garajau); all common terns, though I was on the lookout for roseate terns as well. house sparrow blackbird ssp. azorensis blackcap ssp. gularis goldfinch ssp. parva canary starling ssp. granti grey wagtail ssp. patriciae chaffinch ssp. moreletti robin goldcrest ssp. azoricus (on S. Miguel) buzzard ssp. rothschildi domestic pigeon/rock dove wood pigeon ssp. azorica tern (common) Cory’s shearwater gull (yellow-legged) With the exception of the chaffinches, which were noticeably bluer than ours, the subspecies were “identified” by location – although the blackbirds and blackcaps both sounded subtly different from British birds as well. I also saw sperm whales, bottle-nosed dolphins and a green turtle on a whale-watching trip; and more dolphins and a flying fish from the ferry between S. Jorge and Faial."
year_published = 2025
