["https://apl385.com/gilling/stonegrv.htm"]
title = "Heraldry in Stonegrave Church"
description = "Heraldry in Stonegrave Minster, North Yorkshire."
full_description = "Stonegrave is a small village near Helmsley in North Yorkshire (the North Riding for die-hard traditionalists!). The church, commonly known as Stonegrave Minster, is interesting, dating back to Saxon times. It has many treasures including a magnificent carved stone cross of probable 9th century date. My interest is in the heraldry, and recently I helped my father with a survey of the various achievements in the church. The arms above are from one of the wall monuments, and show Comber quartered with Thornton, overlain by a shield of pretence of Arbuthnot quartering Hassell. The blazons are given below if you are interested! Two special features must be mentioned, both concerned with the generations. The first is “showing off”. When a man has many titles, he will have the right to display many different coats. This quickly becomes self-defeating on a shield, so the display is packed together in a series of rectangles. This is what has happened high up on the south wall of the Choir [the Thornton achievement]. We have identified some but by no means all of the families. The problem is magnified by the difficulty in reading the colours. The second is a statement of intent; If a man marries above his station, he will display his wife’s coat as a small shield on top of his own. This occurs at Stonegrave in three impressive and very similar [Comber] monuments, one on the north wall of the choir, and two on the west wall. Those on the west wall show the arms of Wilson (left) on one of the quarterings of the main shield. Early drawings like the strange creature in the small frame on the north wall occur in early heraldic rolls; it is suggested that the artist is trying to draw an animal which he has never seen. We might blazon it as Arg. a lion statant Gu. This could be for Clare, Clarke, Petit or Quesnes, but does not appear to be for de Stonegrave as suggested (at least according to Papworth � but see below). An early history is suggested by the little framed cards, and the two tombs [only one has a recognisable shield], on the wall of the north aisle. I can find no trace of [arms for] St. Leonard, but it was common to invent arms for the early saints. Note that St. Leonard is the patron of prisoners, presumably hence the broken chains in the ‘attributed’ arms sable 2 [broken-ended] chains in saltire or [The picture is dark and the colours unclear; one of the chains could well be argent]."
year_published = 2025
clearnet = "https://apl385.com/gilling/stonegrv.htm"
