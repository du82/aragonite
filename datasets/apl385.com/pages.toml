["https://apl385.com/boating2006/index.htm"]
title = "Boating in the Shires - June 2006"
full_description = "Collect boat, add bags, unpack beer into fridge. Off we go at 4:20. No pix for this stretch, but simple climb up through 7 wide locks to Buckby wharf. Arrived just after they stopped serving food, so ate on the boat instead. Eleanor at the second lock of the set of 4. Once up the flight there is very little to do except watch the country go by. This is all totally rural, and looks like it is managed 50% for sheep and cows and 50% for hunting. After a quick phone call, diverted up the Welford arm to watch the England game in the pub at the end. Good pub, excellent company, wrong result. Back down the arm, and pulled up just past the tunnel for a short walk into Husbands Bosworth where there was big-screen TV and very good cheap food. As I just said, this is as 'shires' as you can get. Hardly any villages, just a few big farms and lots of access bridges for cows. Here we are working down Foxton flight. This is two staircases of 5 locks each, and is a serious tourist trap for Leicester day-trippers. As it happens, we got the 40-minute wait in the middle to pass 2 upcoming boats so breakfast was served halfway. Time for a wander over to the remains of the inclined plane and generally fool about with the camera. I can see that you could get seriously held up here, but the queue is very well managed by the lock-keeper and we had no trouble at all. At the bottom of the flight, turn sharp right and head off for Market Harborough which follows an abortive attempt to build a sensible canal from Leicester direct to Northampton. Instead they got an insane canal with all wide locks except for the two aforementioned staircases to the linking summit piece. Then they built an even more insane steam-powered inclined plane (which did take wide boats) but only at the Foxton end of the link. Oddly it never got enough traffic to be useful and got cut up for scrap after only 20 years. Ah well. The basin at Harborough is very nicely re-done, with flats (including boat-mooring) facing restaurants and shops."
year_published = 2025
