["https://apl385.com/cyprus/index.htm"]
title = "Cyprus September 2005"
full_description = "I visited Cyprus in September on a walking tour which started in the centre of the island in the pine-clad Troodos mountains, taking in the Caledonian Waterfall trail near Platres and then a long day’s route from the Trooditissa monastery to Foini, Omodos, Ayia Mauri and Lofou, crossing several sub-parallel ridges on the way. Then we transferred to the Akamas, the claw-shaped peninsula at the north-west tip of the island for more walking, from Drouseia to Neo Chorio and thence down to the coast near the “Baths of Aphrodite”. Much of the walking, especially in the Troodos mountains and Akamas, was on well-maintained nature trails set up by the Cyprus Forestry Department, who keep them clear and provide signposts, information boards and small wooden posts with the names of plants (and rather tmore surprisingly, rock types) in Greek and English, with the international “Latin” binomial for the plants as well. The island has many interesting plants and animals – my lists are below. I flew into Pafos (or Paphos depending on the transcription of the Greek phi!), and had a couple of days unwinding in a beach-side hotel, with the chance to swim in the remarkably warm sea. In autumn when I was there there were relatively few plants in flower, but there were seedheads, some of them quite ornamental such as the giant carline thistles. The fruits of the exploding cucumber were extraordinary – about the shape and size of gherkins, if they are touched when ripe they do indeed explode – you can hear the seeds landing all around you several feet from the plant! Many of the plants have (or had) medicinal or industrial uses, for example the wild peony was used for medicine, and the cistus species provided “ladanum” gum. The wood of the arbutus is very hard, and was used for (tobacco) pipes and making chairs. Some, such as the bramble, yellow-berried hawthorn, thyme, oregano and caper, have culinary uses. Other plants are poisonous and to be avoided, for instance the colchicum."
year_published = 2025
