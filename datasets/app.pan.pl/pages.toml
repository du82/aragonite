["https://app.pan.pl/news.html"]
title = "News - Acta Palaeontologica Polonica"
full_description = "Please note that starting with the issue 69(1) Acta Palaeontologica Polonica is an online only journal. All subsequently accepted papers will be issued in online only format once their galley-proof process is completed. Thanks to this change all colour figures will be free of charge. The Instructions for Authors section has been amended accordingly. We are also working on upgrading the submission system. In the meantime, during submission and acceptance you may encounter an information about charge for colour figures, please disregard such information, the charge will be not applied. Still, a modest page fee will be required for papers over 10 typeset pages in amount of EUR 22 (VAT included) per page. Following changes in the publishing market and acting towards diminishing our carbon footprint, Acta Palaeontologica Polonica decided to move to an online only publication model. The last printed issue of APP will be published in December 2023. All subsequently accepted papers will be issued in online only format once their galley-proof process is completed. Thanks to this change all colour figures will be free of charge. A modest page fee, however, will be required for papers over 10 typeset pages in amount of EUR 22 (VAT included) per page. Papers above 100 typeset pages and congress/symposium proceedings will be published as a supplement to APP (under Palaeontologia Polonica subtitle) with full indexing capacity. APP fulfills the requirements of ICZN and ZooBank (http://zoobank.org/) for online publications and all nomenclatural acts published in APP will be formally valid. Registration of your new taxa in Zoobank is mandatory since APP issue 64(1). The Production Department of APP will still be maintained within the Institute of Paleobiology PAS to facilitate flexibility of the publication process and assure a high quality of service. After six years of distinguished service as an Editor of Acta Palaeontologica Polonica, Olivier Lambert is stepping down from the position. He is replaced by Eli Amson."
year_published = 2025
clearnet = "https://app.pan.pl/news.html"
tags = ["acta", "news", "online", "palaeontologica", "polonica"]
language = "en"
