["https://app.pan.pl"]
title = "Journal - Acta Palaeontologica Polonica"
description = "Acta Palaeontologica Polonica"
full_description = "In-depth studies of all kinds of fossils, of the mode of life of ancient organisms and structure of their skeletons are welcome, as those offering stratigraphically ordered evidence of evolution. Work on vertebrates and applications of fossil evidence to developmental studies, both ontogeny and astogeny of clonal organisms, have a long tradition in our journal. Evolution of the biosphere and its ecosystems, as inferred from geochemical evidence, has also been the focus of studies published in the journal. The language of the journal is English. Submissions may be in the form of articles, brief reports, discussions, or paper/book reviews. Acta Palaeontologica Polonica accepts papers of moderate length. Longer manuscripts should be directed to the monographic series Palaeontologia Polonica. All submitted manuscripts are reviewed initially by editorial staff. Manuscripts with insufficient priority for publication are rejected promptly. Other manuscripts are sent to at least 2 independent expert consultants for peer review. Manuscripts are evaluated on the originality of data, interpretations, and ideas, and on the degree to which their findings can be generalized. In case of contradictory opinions additional reviewers are sought. Native speakers are asked to suggest linguistic improvements. To verify originality of articles iThenticate detection software can be used. Articles accepted for publication are instantly published in the forthcoming papers section. In printed version they usually appear in order of acceptance. Exceptions are made for papers of particular scientific significance, and for manuscripts which fully comply with editorial requirements given in the instruction for authors and require only minor changes. Acta Palaeontologica Polonica is indexed in AGRO Poznan, Biological Abstracts, BIOSIS Previews, Current Contents/Physical, Chemical and Earth Sciences, Geological Abstracts, GeoRef, Index Copernicus, Petroleum Abstracts, VINITI RAN, Science Citation Index Expanded, SciSearch, Scopus, Zoological Record. Contents of current issues are available at http://app.pan.pl and through digital repositories and portals: Web of Science, EBSCO, AGRO Poznań, Polona and CEON - Library of Science (Biblioteka Nauki). Acta Palaeontologica Polonica is a member of CrossRef."
year_published = 2025
clearnet = "https://app.pan.pl"
tags = ["acta", "factor", "impact", "palaeontologica", "polonica"]
language = "en"
