["https://app.pan.pl/instruction.html"]
title = "APP Editorial System - Scientific manuscripts submission and peer review"
full_description = '''Instructions for Authors [last update on January 3rd, 2024] Acta Palaeontologica Polonica accepts papers of moderate length. Longer manuscripts, i.e., above 100 typeset pages and congress/symposium proceedings will be published as a supplement to APP (under Palaeontologia Polonica subtitle) with full indexing capacity. Once you have prepared your manuscript according to the instructions below, please visit the online submission system. You will be treated as a corresponding author. Please prepare the following documents before clicking on the 'register' button: cover letter text file of your manuscript (Word format document), figures and tables (as separate files) if applicable, you may also include a document with Supplementary Online Material. By using this service you will guarantee fast and safe submission of your manuscript, and speed the assessment process. If you have any questions regarding the submission you can contact the APP Technical Editor at tech_editor@twarda.pan.pl or click Feedback sign at the bottom of the page. Contents of this document: General submission requirements Cover letter Organisation of the manuscript General information Title Abstract Key words Introduction Material and methods Results/ Systematic palaeontology Discussion Conclusions Authors' contributions and acknowledgements References Appendix Tables and figures Supplementary Online Material Review process Acceptance for publication Proofs Reprints Copyright policy 1. General submission requirements Articles consist of a title, abstract, keywords, authors’ mail and e-mail addresses, ORCID digital identifier number, introduction, main text, conclusions, acknowledgements, and references. Brief reports (2000-3000 words, ca. 12 double-spaced pages including illustrations). Brief reports consist of a title, bold first paragraph of the introduction that provides the rationale for the work and summarises the main results, main text, acknowledgements, and references, authors’ mail and e-mail addresses, ORCID digital identifier number. Comments, Discussions (1000-1500 words, ca. 6 double-spaced pages), Paper/Book reviews, Prefaces (500-1500 words, ca. 3 double-spaced pages). ). Monographs (50 000-75 000 words, ca. 300 double-spaced pages including illustrations) published as a supplement to APP (under Palaeontologia Polonica subtitle). For more information on the organisation of these types of submissions, please see examples in recent APP issues. Editors' choice. This heading will receive papers of wide topical interest significantly increasing the knowledge of the fossil record and/or evolutionary processes. It will typically contain 2-4 papers (c. 15% of the volume) per issue which will be fast-tracked after acceptance for the speediest possible publication. All submissions are subject of screening against plagiarism. For details see http://www.crossref.org/crosscheck/index.html Financial information. There are no charges for submission of an article. There are no obligatory page charges for papers up to 10 typesetted pages (approximately 30 double-spaced manuscript pages, 12 points Times New Roman font; assuming no illustrations), although any financial support for publication is welcome. For longer papers, a page charge of EUR 22 (VAT included) will be requested for each page over the 10 free pages. Colour figures are free of charge starting with APP issue 69(1). We are inclined to provide exceptions for authors of papers of extreme scientific value if they are lacking financial support. Appeal for a cost reduction may be made to the Editor in Chief. Joint Data Archiving Policy. Acta Palaeontologica Polonica requires, as a condition for publication, that all of the data underlying or supporting the results in the paper should either be made available as Supplementary Online Material (see section 5), or be archived in an appropriate public archive, such as Dryad (http://www.datadryad.org/), MorphoBank (www.morphobank.org) or GenBank (http://www.ncbi.nlm.nih.gov/genbank/). Data are important products of the scientific enterprise, and they should be preserved and usable for decades in the future. Authors may elect to have the data publicly available at time of online publication, or, if the technology of the archive allows, may opt to embargo access to the data for a period up to a year after publication. Exceptions may be granted at the discretion of the editor, especially for sensitive information such as human subject data or the location of endangered species. Editorial announcement. Following the recommendation of the Society of Vertebrate Paleontology we decided that until the human rights situation in Myanmar is resolved, we will not publish papers on Burmese amber collected from 2017 onwards. Authors who wish to publish on Burmese amber specimens are expected to supply the APP editors with adequate proof to satisfy any and all editorial concerns regarding the provenance of the specimens, in the form of certification or other demonstrable evidence, that they were acquired before the date both legally and ethically. Any manuscript submitted that fails to meet these criteria will, at the discretion of the editors, not receive further consideration by APP. This decision is effective from April 23rd, 2020. 2. Cover letter The cover letter should be no longer than one side of A4 (max words count 300), and it should provide the background for the problem or question your research answers. The focus of the first paragraph is to explain why your research was needed and clearly state the question your research answers. The corresponding author must give written assurance that neither the submitted material nor portions thereof have been published previously or are under consideration for publication elsewhere. Any closely related material currently in press should be submitted with the manuscript. It is assumed that the corresponding author represents all co-authors in certifying that all listed authors participated meaningfully in the study and that they have seen and approved the final manuscript. 3. Organisation of the manuscript General information The journal publishes in English. Authors are asked to use either British or American spelling consistently throughout. Authors whose English is not fluent are urged to seek linguistic help from native English-speakers before submitting the manuscript. For the general usage of scientific English, please consult Scientific Style and Format: the CBE Manual for Authors, Editors, and Publishers (6th Edition), Cambridge University Press. APP uses the iThenticate software to detect instances of overlapping and similar text in submitted manuscripts. Double-space the entire manuscript, including abstract, text, references, tables, figure captions, and appendices. Number all pages, beginning with the title page. Use a standard font (Times New Roman), 12 points only. Do not justify or break words at the right margin. Figures and tables should normally be cited in consecutive order in the text. In general, use no more than three levels of heading. Capitalise references to illustrative material within the text (e.g., Fig. 18K; Table 2), but put in lower case those from other publications (e.g., Kowalski 1890: 26-27, fig. 29, pl. 2: 2, 3, pl. 3: 6; Müller 2001: pls. 1-5). Author names and dates are required in the manuscript text only for taxa that are formally treated in the Systematic palaeontology section. For these taxa, the authorities and dates should be included in the manuscript text after the first usage within each major section, and citations of the relevant papers must be included in the bibliography. Taxa with two authors should be separated by ampersand (&) rather than “and” (as it is in the regular citations). Multiple authors can be abbreviated by “et al.” providing that all authors are listed in the reference list. For new taxa (e.g., new species and genera) the abbreviations "sp. nov." and "gen. nov." should be used throughout the manuscript text. Spell out generic names at the beginning of sentences and when used with "sp." Generic and subgeneric names may be abbreviated after being given in full within a major heading and if there is no chance of confusion with other names. Generic names may be abbreviated, when used in the combination of Agenus cf. A. species. Do not abbreviate specific and subspecific names Formally proposed and accepted time and lithostratigraphical designations (e.g., Middle Ordovician, Late Cretaceous) are capitalised, whereas informal designations (e.g., late Paleozoic, middle Pliocene) are not. Use past tense for published works that are cited in the text (e.g., "Kowalski (1900) noted that...") Do not add a space between a question mark and a generic name (e.g., Homo?). Question marks should follow the name in doubt (e.g., Homo? sapiens - questions the generic assignment, Homo sapiens? - questions the species assignment, and ?Homo sapiens - questions the entire identification). When listing entries in a sentence, use the lower case Roman numbering: (i)...; (ii)...; (iii).... The submission system will generate a pdf with figures and tables. Lines will be numbered automatically. Numbers and measurements: Spell out whole numbers zero through nine, except when associated with an abbreviated unit of measurement (e.g., 5 mm); use Arabic numerals for numbers 10 and greater. All numbers beginning a sentence are spelled out. Numerical ranges can be given as "size is 5-8 mm". Provide all measurements in metric units in full units rather than fractions (“length 15–18 mm” rather than “length 1.5–1.8 cm” and so on) Title Titles should be in capital and lowercase letters. A title should be informative, but also as brief as possible. Do not use terms or names that may not be known to most readers, for instance those introduced in the paper for the first time. Avoid abbreviated words, names of high systematic rank or stratigraphic units given in parentheses, and authorities and dates. Example: Instead of the title: "Occidensbaatar hutchisoni gen. et sp. nov. (Multituberculata, Allotheria, Mammalia) from the Upper Cretaceous Lance Formation at Bug Creek, Wyoming, with some remarks on its bearing on the taxonomy and evolution of Multituberculata as a whole", write: "A new Late Cretaceous multituberculate mammal from Wyoming and its evolutionary implications". Abstract Provide a structured abstract of min 100, max 300 words summarizing methods, results, and conclusions of the study in terms accessible to the general reader. All newly described taxa must be given by name in the abstract. Except in unusual circumstances, references should not be cited in the abstract. Key words Authors have to choose topics from the list provided in the submission form. Additionally they may suggest 3 to 8 key words identifying the nature of the subject matter. Please include stratigraphic and geographic information, where applicable. Use Latin names for higher taxonomic units. Introduction The introduction should be concise and intelligible to a professional palaeontologist or geologist, and preferably to an educated lay reader. Provide the minimum background information that will orient the general reader, and do not engage in a literature review. Institutional abbreviations.—Provide institutional abbreviations used in the text in alphabetic order: abbreviation, name of the institution, town, country. Other abbreviations.—Provide an explanation of any other abbreviations used frequently in the text in alphabetic order. Nomenclatural acts.—Starting from APP issue 64(1) the registration in ZooBank (http://zoobank.org/) of nomenclatural acts published in APP is mandatory prior to online publication. Please register your new taxa in due time and provide Zoobank number in Systematic palaeontology section. New plant taxa should be registered in IPNI (https://www.ipni.org/). Material and methods In accordance with the recommendations of the International Codes of Zoological Nomenclature (ICZN) and International Code of Nomenclature for algae, fungi, and plants (ICN), all illustrated and described fossils should be deposited in a appropriate museum or collection to permit free access by other researchers in perpetuity. Collection numbers must be quoted, preceded by an institutional abbreviation. Results/ Systematic palaeontology Present your results in a logical sequence in the text, tables, and illustrations. Do not repeat in the text all the data in the tables or illustrations; emphasise or summarise only important observations. For papers dealing with taxonomy, authors and editors are, by general agreement, obliged to accept the rules governing biological nomenclature, as laid down in the International Code of Nomenclature for algae, fungi, and plants (ICN), and the International Code of Zoological Nomenclature (ICZN). Authors should ensure that the diagnosis distinguishes the taxon in question from all morphologically similar taxa. Use differential diagnoses for new taxa, including comparisons with all other closely related species or genera. Alternatively, a short diagnosis containing only apomorphies of the new taxon, followed by a "Differential diagnosis", is also acceptable. The number of taxon authors should be kept within reasonable limits, preferably not exceeding three. Organisation of sections in formal taxon descriptions: Genus: Etymology (for new gen.), Type species (including authority, locality, and age), Species included (for new gen.), Diagnosis (for new gen.), Remarks (optional), Stratigraphic and geographic range (for new gen.). New species: Species name, Figures, Etymology, Type material (Holotype, Paratypes), Type locality, Type horizon, Material, Diagnosis, Description (this section may split into separate headings for different anatomical parts, or ontogenetic stages if desired), Remarks (comparisons with other taxa should be placed here), Stratigraphic and geographic range. Previously described species: Species name, Figures, Synonymy, Material (required), Description, Remarks, Stratigraphic and geographic range (obligatory, unless in open nomenclature). Synonymy (example): 1956 Martellia ichangensis sp. nov.; Wang 1956: 11, pl. 2: 1-5. 1974 Martellia ichangensis Wang, 1956; Xu et al. 1974: 148, pl. 65: 5-7. 1977 Martellia ichangensis Wang, 1956; Zeng 1977: 47, pl. 15: 7, 8. 1977 Martellia orbicularis sp. nov.; Zeng 1977: 47, pl. 15: 10-12. 1978 Martellia ichangensis Wang, 1956; Xu et al. 1978: 296, pl. 116: 14. 1984 Martellia ichangensis Wang, 1956; Xu and Liu 1984: 196, pl. 12: 27-29, 31; text-fig. 12. Taxon authority is treated as part of the name, not a citation. If the source publication needs to be cited then the taxonomic discussion has to be phrased appropriately, e.g., "... Pallas (1778) based (Lepus europaeus) on..." Consequently, we do not associate co-authors of the publication with the author of the taxon name. This is in agreement with ICZN: "If it is clear fr'''
