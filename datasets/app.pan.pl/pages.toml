full_description = "Acta Palaeontologica Polonica is published by Institute of Paleobiology, Polish Academy of Sciences (a green publisher according to Sherpa/Romeo website). Acta Palaeontologica Polonica authors retain the copyrights of their papers. Articles are distributed under the terms of the Creative Commons Attribution License (CC BY), which permits unrestricted use, distribution, and reproduction in any medium, provided the original author and source are credited. For licence details please see http://creativecommons.org/licenses/by/4.0/. Acta Palaeontologica Polonica follows the priciples and recommendations of Committee on Publication Ethics (https://publicationethics.org) The use of general descriptive names, trade names, trademarks, and so forth in this publication, even if not specifically identified, does not imply that these names are not protected by the relevant laws and regulations. While the advice and information in this journal are believed to be true and accurate on the date of its going to press, neither the authors, the editors, nor the publisher can accept any legal responsibility for any errors or omissions that may be made. The publisher makes no warranty, express or implied, with respect to the material contained herein."
