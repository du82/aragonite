title = "A-Apple II Software Hits"
description = "CONTENTS Introduction The Post-Newsstand Magazine Era Notes INTRODUCTION The magazine Softalk tracked sales of Apple II software during it years of publication from 1980 to 1984. This information w…"
full_description = "The magazine Softalk tracked sales of Apple II software during it years of publication from 1980 to 1984. This information was tabulated in a monthly column, “Softalk Presents The Best Sellers”, which included a “Top Thirty” list, as well as top selling programs in several specific categories. Further, in April of each year (1981 through 1984) they presented a list of the top new programs for the previous year, as voted by Softalk readers. For the monthly compilations they contacted a sample of Apple-authorized retails stores throughout the country, and asked the store managers what programs were doing well and how many copies they were selling. This gave somewhat more useful information than what could be learned from contacting the software companies themselves; they would only be likely to know how many copies of a program were shipped, and not necessarily be relied upon to tell how many were returned unsold. Softalk used a formula that created an index number for each program, determining its position on the Top Thirty list. The index number also gave an indication of the relative strength of each program’s sales. Another service provided by Softalk each month, beginning in the May 1982 issue, was a column called “Fastalk”. Here were listed new program releases, as well as other older Apple II programs that continued to enjoy popularity and good sales. The introduction for the column stated the following: “Fastalk is a quick guide to popular, specialized, new, and classic software. When you need a particular kind of program or just want to see what’s new, Fastalk is the place to look for fast answers.” They listed new programs with a check mark, and if it failed to gain popularity, it was dropped after three months. A “bullet” marked program titles that Softalk magazine designated as a classic, “based on its ability to stand up over time, its significance for its time (breaking new ground, or introducing a new genre), or its archetypical qualities.” They went on to mention that some programs listed in “Fastalk” were included simply because they met a need that no other software package could, even if they were not high volume sellers."
year_published = 2010
year_updated = 2010
