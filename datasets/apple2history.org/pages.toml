["https://www.apple2history.org/appendix/ahb/ahb6"]
title = "1996-2003"
description = "1996 1996 January GEnieLamp A2Pro ceases publication. II Alive ceases publication. Juiced.GS magazine begins publication. Two surviving prototypes of the “Mark Twain” Apple IIGS (cancelled at the l…"
full_description = "Two surviving prototypes of the “Mark Twain” Apple IIGS (cancelled at the last minute at the September 1991 user group satellite conference) are discovered in different places around the country and discussed online. General Electric sells the GEnie online service to Yovelle Renaissance Corp., which changes the name to “Genie”, and promptly makes significant hikes in the monthly fees. A group of investors purchase Delphi back from News Corporation, begin to transform it into an ad-supported online service. Yovelle decides it cannot afford the large number of customers moving to the “Genie Lite” plan, and cancels it. Bright Software changes its name to Fast Eddie Labs, and announces the release of a beta version of its Apple IIGS emulation software, code-named Fast Eddie, and written by Henrik Gudat and Andre Horstmann.[1] Mac OS 7.6 released, the first version to bear the “Mac OS” name. It was released to support the Macintosh “clones” that Apple had now authorized, and establish a brand name for the Macintosh operating system, just as Microsoft had done with Windows. The new system features include OpenDoc and Macintosh Run-Time Java (MRJ).[2],[3] KansasFest keynote speaker Gary Utter points out the coming need for a new online home, as Genie was beginning to fail. At KansasFest, Andy Nicholas of Apple Computer demonstrated a personal project he had written on his own time, a Macintosh-based Apple IIGS emulator, Gus. Ultimately, Apple management prevents this from being released even as an unofficial product. GenieLamp A2 is the only digital newsletter in the GenieLamp series still being produced and distributed each month. Many Genie members are migrating to CompuServe or Delphi, due to the changes made in the costs of the service. Syndicomm starts A2 and A2Pro forums on Delphi, patterned after the same-named Roundtables from Genie. Tiger Electronics test markets the Tiger Learning Computer, an Apple-authorized clone of the Apple IIe. Seven Hills Software releases Spectrum Internet Suite, written by Geoff Weiss and Ewen Wannop. These enhancements for the Apple IIGS terminal program Spectrum make it possible to access graphic Internet web pages directly with a IIGS using a dial-up shell account."
year_published = 2010
year_updated = 2010
