["https://www.apple2history.org/2010/07/27/got-blue"]
title = "Got Blue?"
description = "Thanks to the dedicated efforts of Gerry Doire, I’ve had a beautiful copy of the classic Apple II “Red Book” manual available for download for quite a while. He actually re-tooled…"
full_description = "Thanks to the dedicated efforts of Gerry Doire, I’ve had a beautiful copy of the classic Apple II “Red Book” manual available for download for quite a while. He actually re-tooled most of the pages in that book to make it look classic, but actually be more legible than it ever was. I have not take the extra, careful time that Gerry did, but I have scanned in my prized copy of the Apple II “Blue Book”, the first Applesoft manual released by Apple Computer, Inc., and thanks to the help of Bill Martens and his Apple Archives project for A.P.P.L.E., the scanned pages were assembled into a beautiful PDF copy of this rare manual."
