["https://www.apple2history.org/appendix/ahb/ahb2"]
title = "1978-1981"
description = "1978 Exidy sells the Sorcerer ($895), with a Z-80, 8K RAM, 12K ROM, and serial, parallel, and cassette interfaces. It could use plug-in ROM cartridges and had user-definable characters. Epson relea…"
full_description = "Applesoft I is released on cassette (the manual is dated November 1977, but the software was not ready to release until January). Ward Christensen, a member of the Chicago Area Computer Hobbyist Exchange (CACHE) starts the Computer Bulletin Board System (CBBS) in order to allow members to communicate and exchange information. It runs on an S-100 computer system, and connects callers at 110 and 300 baud.[6] Applesoft II released on cassette, adding hi-res graphics commands.[8]. The revised manual (“Blue Book”) does not come out until August. Disk II floppy disk drive introduced (DOS 3, still buggy, not released, Jun 29, 1978).[9],[10], [11],[12] Orange Computer, one of the first Apple II clones, appears at the Third West Coast Computer Faire.[17] Apple President Mike Scott tells Apple employees not to use typewriters any longer; only computers are to be used for all office functions.[24] Applesoft Firmware Card released for Apple II, making it possible for these older computers to use Applesoft.[28] William von Meister announces The Source, the first consumer-oriented online service for personal computer users equipped with modems.[30] CompuServe makes its computer network available for non-peak (evening and weekend) use as a commercial online service called MicroNET, offering bulletin boards, databases,and games for users of personal computers equipped with modems.[33] Macintosh project formally begins, although some preliminary work was done as early as late 1978. It is given the code name “Macintosh”, since project leader Jef Raskin’s favorite apple was the Mcintosh. The name misspelling was done on purpose to avoid conflict with an audio manufacturer, McIntosh Labs. Programmers for Apple’s Lisa project writing their Pascal code on Apple II computers are running out of space, having filled up the available 64K space on a Language card-equipped Apple II. Burrell Smith designs a Language Card with an additional 16K of RAM, creating one of the earliest bank-switched memory cards for the Apple II to allow it to exceed the 64K barrier.[38]"
year_published = 2010
year_updated = 2010
