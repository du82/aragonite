["https://www.apple2history.org/2010/08/21/a-declining-moon"]
title = "A Declining Moon"
description = "I wanted to discuss just a little further the problem that took me offline for several days last week. [singlepic id=655 w=320 h=240 float=right]Typically I don’t like to point out negative t…"
full_description = "Ken G. August 23, 2010 I’m sorry to hear you had this experience, Steve. As you said, I had switched to Lunarpages on your recommendation some years ago and, like you, was satisfied for the service for many years. Then, just over a year ago, one of my sites became popular from Digg, and Lunarpages responded by disabling PHP on all my accounts. Not only did this shut down my dozen WordPress sites, but it also exposed my MySQL passwords to the public. I was mortified. Just as stupid was that Lunarpages would not restore my service unless traffic to my sites had died down after 48 hours. As you can imagine, with my WordPress completely disabled, my traffic was almost nil from the moment they disabled PHP — yet the 48-hour rule was immutable. Every hosting company has its shortcomings, DreamHost included. But Lunarpages went from being acceptably fallible to being utterly negligent. I would neither recommend nor trust them again. Reply"
year_published = 2010
year_updated = 2010
clearnet = "https://www.apple2history.org/2010/08/21/a-declining-moon"
