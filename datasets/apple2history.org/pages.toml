title = "Laine Nooney and Apple History"
description = "This entire web site is focused on preserving and telling the story of microcomputers, focused with insane depth on the Apple II. I’ve been telling it for 20 plus years, and have a book about…"
full_description = "Ken Gagne August 20, 2015 Awesome! Thanks for the heads-up. For more on Sierra, I recommend the writing of Open Apple alumnus Jimmy Maher — specifically, these two posts: Splendid Isolation: Sierra at Mid-Decade Leisure Suit Larry in the Land of the Lounge Lizards Reply This entire web site is focused on preserving and telling the story of microcomputers, focused with insane depth on the Apple II. I’ve been telling it for 20 plus years, and have a book about it. So I know what I know quite well, and if any of you who have taken the time to either read the story on this web site or in the book also know what I know. But I always enjoy learning more about the era of the Apple II and its competition and getting new information or new points of view. The Open Apple podcast, which focuses on news and interviews about the Apple II is often a source of stories that expand my knowledge, and episode #49 for July 2015 is a particularly fascinating listen. They have an extended conversation with Laine Nooney, a person who is way too young to have been involved with the Apple II when it was new and exciting. Her research for a dissertation brought her to look into Online Systems / Sierra Online, as well as with other software companies of the day, and the conversation they have drifts over into the impact of the computer on homes and families, and what she has learned about it. When I think I know so much that there is not much more to learn, a gem like this interview comes along, and I realize levels of computer history that go beyond my extremely specific area of knowledge. It is well worth a listen. Addendum: Here is a link to Nooney’s research on Sierra Online, as much as she has made publicly available at this time. Read it. For more on Sierra, I recommend the writing of Open Apple alumnus Jimmy Maher — specifically, these two posts:"
