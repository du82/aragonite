title = "1981"
description = "MOST POPULAR SOFTWARE Of 1981 (Softalk Reader’s Poll)   The Top Thirty: Raster Blaster by Budge, BudgeCo; arcade. “First realistic pinball game. Softalk readers’ Most Popular Prog…"
full_description = "Laura September 8, 2010 I was wondering if anyone has heard of the 1980’s childrens school game called Piccadilly Pear or something like that… Have been searching and searching about it and cant find anything on it? Please help if you know what game im talking about. Reply Chase September 13, 2010 I remember this game. It was a matching game, right? I spent hours in the computer lab playing this. No luck finding it on the net though… Would love to know if you’ve dug anything up! Reply JF May 22, 2019 Well, after reading everyone else’s response, I found this; apparently it was Pick-a-dilly Pairs: Reply Antun November 2, 2011 Hi there, I remember this game too it used to be on the schools computer. Large floppy disk. I would love to find it too. Reply Amy June 3, 2013 My grandfather was involved with making that game. That and a racing one: Race Car Classic. He designed all graphics, sound, animation, etc. Movement and sound together were pretty new then. I used to play both games for hours. Piccadilly Pear is the first color game I can remember playing. I recently asked if they still have copies of it at their home and my grandmother said they do, new in boxes. I wanted to look into finding a way to play it. 🙂 My grandfather turned 85 yesterday – he still works almost full time. I see this post was a long time ago… but thought I’d answer anyhow. Reply Serge Ulankin April 8, 2019 I feel like Jawbreaker is missing from the list https://rawg.io/games/jawbreaker It might be a Pac-Man rip-off but it was a good rip-off! Also, the Pac-Man itself might be included to the list too. I might be wrong, but it probably was released for Apple II in the beginning of 1981 too. Reply"
