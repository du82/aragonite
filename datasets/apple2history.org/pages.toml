["https://www.apple2history.org/2013/10/14/micro-design-can-give-mega-results"]
title = "Micro-design Can Give Mega-results"
description = "I’ve had the opportunity in the past couple of weeks to listen to two podcasts in which game designers were interviewed. (I recommend you listen, also – ANTIC, The Atari 8-Bit Podcast #…"
full_description = "I’ve had the opportunity in the past couple of weeks to listen to two podcasts in which game designers were interviewed. (I recommend you listen, also – ANTIC, The Atari 8-Bit Podcast #4 has an interview with Chris Crawford, who wrote games for the Atari 2600, Commodore PET, and Atari 400/800; No Quarter classic arcade podcast #52 has an interview with Brian Collin, who helped create the arcade game Rampage.) It brought back to mind similar stories like the making of Wolfenstein 3D for the Apple IIGS. In all of these situations the programmers had a limited space in which to do their work. They were limited in graphics abilities or limited in memory, or both, and yet they managed to create (or duplicate) games that were considered to be state-of-the-art in their day. It brings to mind the problem on modern computers with what has been called “bloatware” – code that is large, takes up a lot of space in memory or storage or both, and often does only a little more than its predecessors. The advantage of the small memory footprint and simpler processors in the micros of the 1970s and 1980s is that it was necessary to write compact, efficient code. The graphics had specific limitations that had to be honored. These programmers had to come up with tricks to get around those limitations, to push the boundaries to achieve the desired effect. The programmers mentioned in the above three examples sometimes had to buck the accepted knowledge that said what they wanted to do was not possible. Brian Collin overcame memory limitations on Rampage by re-using the graphics layout for one of his monsters to create another one. Eric Shepherd had to almost re-invent how the graphics of Wolfenstein 3D were implemented in the Apple IIGS, in order to make it work. And Chris Crawford, like all who made games for the Atari 2600, had a tiny memory footprint in which to put the game itself as well as its graphics. This limitation did not only apply to games. AppleWorks’ creator Rupert Lissner created memory management techniques that made a 64K or 128K computer and made it look like a much larger computer."
year_published = 2013
year_updated = 2013
