["https://www.apple2history.org/2012/07/19/being-blue"]
title = "Being Blue"
description = "A year ago, a KFest acquaintance named Stavros Karatsoridis gave me a printed copy of his version of the Apple II “Blue Book”, the first Applesoft manual. His was the version that was w…"
full_description = "A year ago, a KFest acquaintance named Stavros Karatsoridis gave me a printed copy of his version of the Apple II “Blue Book”, the first Applesoft manual. His was the version that was written in November 1977, for the January 1978 release of Cassette Applesoft. The version that I have already had available on this site for download was the August 1978 edition, which had the changes for Applesoft II, the revised edition of that language. I’ve had the papers for about a year, and as I got ready to come to KFest this year I finally scanned them in, and have completed the work. It is now also available in the Apple II History downloads page here. Now you can get digital copies of both of these rare manuals."
