["https://apple2history.org"]
title = 'The story of "the MOST personal computer"!'
description = 'The story of "the MOST personal computer"!'
full_description = "I have not looked at the Links page here for some time, and sadly some of them were far from fresh. I have inserted links from the Wayback Machine when possible, and if not possible, have removed them. Everything there should at least now be working! Gary Graham continues to create his modern recreations of classical Apple II items. This time, he has a number of disk sleeves from various Apple II software companies from the early days, as well as a poster created in honor of APDAlog. You can access these from the Files section of the web site, or from the two links below. Poster in honor of APDAlog, the magazine of the Apple Programmers and Developers Association. Created by Gary Graham, khaibitgfx@gmail.com. Gary Graham, under the Sphere Studios and khaibitgfx names, here offers reproductions of floppy disk sleeves, featuring A.P.P.L.E., Datasoft, Electronics Boutique, Origin Systems, Roger Wagner Publishing, Softdisk, and Videx. Also included are disk labels for Ultima IV and Zaxxon. Like his work on the Apple II Red Book, these are not scans, but are reproductions made to look as closely as possible to the originals. If you enjoy these, please drop him a message at khaibitgfx@gmail.com and thank him for his work. Years ago I was sent a PDF of the original Apple II Reference Manual, known as the Red Book. Back in 2008, Gerry Doire had not only provided for me a scanned version of the manual, but he cleaned it up so it was more readable and useful as a reference. I recently received a message from Gary Graham, who has taken Doire’s original files and updated them to fix some typographical errors. He also fixed the font sizes, and did other work on it. He asked that I replace the old version with this better version. It is still a work in progress (still says it is the 35th anniversary edition), but he has more work he plans to do with it, and will keep me up to date with the better edition when it is available. (By the way, in making this available to download, I discovered that my Files (Download) page had somehow lost all of its entries. I will fix that, but I wanted to get this out for people to see.)"
