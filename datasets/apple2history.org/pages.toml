["https://www.apple2history.org/2013/03/17/a-cover-up"]
title = "A Cover Up"
description = "We have a penultimate (possibly ultimate) cover for the book. I think this is looking pretty nice!"
full_description = "Ralph Hyre March 17, 2013 For something as weighty as a book cover, the power indicator must look like an non-plus Apple II (looking like any other key)… Reply Steven March 17, 2013 You make an excellent point. Only problem is trying to find a pretty picture of an Apple II, of appropriate dpi (300). I’ll have to see where the graphic artist found the photo. Reply Egan March 18, 2013 The Apple II+, IIc, IIe, etc… where all IIs. I don’t think it needs to be just a plain-old “II” for the cover. I am willing to bet that most identify with the II+ or IIe. Reply CapeJim March 31, 2013 I started later than some, but would lean toward the //e (mine was pre-enhanced when I bought it, but later did the kit upgrade, and later bought a IIgs), so I would agree with Egan (especially the latter…). 😉 (Still have the //e (enhanced), a Woz IIgs and another IIgs) Reply Mitchell Spector April 4, 2013 That was the first thing that caught my eye, the flush-with-case power light (typical of the Apple II Plus and late model II) as opposed to the raised power key. A tell-tale sign of an original Apple II. Well…I have an original Apple II with the raised power key (circa 1978, serial #11985). Want a photo for the cover? 🙂 I can try and duplicate the angle of the shot if need be. I actually took the Apple IIc Plus photos on Wikipedia. If you need any other vintage Apple II odds and ends photographed, feel free to contact me. It’d be fitting, since it was your Apple II History files (read way back in 1991) that inspired my Apple II collecting! More so, that particular Apple II was my *first* piece! Reply D Finnigan April 9, 2013 Another idea that might be neat would be to arrange all the models of Apple around a central axis, like a pinwheel, and take the photograph from above. Reply Steven April 9, 2013 I would love to see a photograph like that! However, it would require a single individual actually owning a nice version of each model in order to take such a photo. Probably to keep things “simple” for Simplicity & Sophistication, having a single model would be best for the cover. Reply"
