["https://www.apple2history.org/appendix/parodies/a-visit-from-saint-woz"]
title = "A Visit From Saint Woz"
description = "© c. 1989 Marty Knight (Parody of “A Visit From Saint Nicholas” by Clement Moore) This is not one that I wrote, but it is such a good parody of the classic Christmas poem that I wanted …"
full_description = "This is not one that I wrote, but it is such a good parody of the classic Christmas poem that I wanted to include it. I do not have any way of contacting Mr. Knight, but I do not think he will mind it being posted just one more time. Interestingly, I have found two versions of this on the Internet, so will reproduce them both here. The earliest version to it that I can find is a Usenet post from December 23, 1989 (found on Textfiles.com). The author of that post (“unknownuser”) said that he was posting it with permission of the author: ‘Twas the night before Christmas, sounds all through the house, the printer a’buzzing; the clicking of mouse. The floppies were stored in their cases with care in hopes that St. Wozniak soon would be there. The children were nestled, all snug in their beds, while TransWarp GS’s[1] danced in their heads. I need 3 megs more, but RAM costs a mint. I’m nodding off, waiting for my printer to print. When out on the lawn there arose such a clatter, I woke with a start, “Now what’s the matter?” Awakened from slumber I jumped up to see, tripped over the dog and fell on my knee. The moon shining onto the new fallen snow formed a non-standard palette[2] with objects below. When what to my poor bloodshot eyes should appear but SHR[3] graphics! Stereo sound do I hear! With a sixteen bit chip and new bug-free GS/OS, I knew right away that it must be Saint Woz. More rapid than Transwarp, his menus they came. He clicked and he dragged and he called them by name. “Now Pulldowns, now Buttons, now Dialogs, too. On Finder, Mac Interface, we’re faster than Mac II! Blue slips for marketing! DTS[4] better not scoff! ProDOS format for Technotes or I’ll lay you all off! You know lame excuses make customers sad; well Macs in the schools make Applers mad.” So up to the housetop his menus they flew with a sack full of RAM chips and Saint Wozniak, too. I listened intently with my two little ears to true stereo sound spreading holiday cheer. As I was scratching head and was turning around down the chimney Saint Wozniak came with a bound."
