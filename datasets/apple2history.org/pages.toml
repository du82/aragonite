full_description = "That annual Apple II conference is only a month away, and yes, I’ve got another music parody for it: Come down and help me make it better with live action! I have seen a few reviews of my Sophistication & Simplicity book appear on Amazon.com, and I appreciate the kind words that have been posted so far. Interestingly, one of the commenters marked the book down because of the chapters about peripherals, etc, that were interspersed… Back in the late 1980s, Apple II developers and users were dissatisfied with the amount of attention that Apple as a company was devoting to the Apple II. Despite its position as the real breadwinner for the company (the Macintosh was still struggling to… Ken Gagne of Apl2bits.net reminded me of another parody involving the Apple II series that would be right for the Parodies section in the Appendix of the History. Written by Marty Knight, the “A Visit From Saint Woz” parody of Clement Moore’s famous Christmas poem often… I’ve combed YouTube looking for videos about the Apple II series, and have found additional movies to add to the Museum. There are now two categories for videos: A general category, for videos like the dealer video I mentioned in my last post, and… Going through the emails that I have accumulated in the past ten years, I’ve mined some gold that has been languishing in my archive: Update to Chapter 17, by adding a little more information about the Logo language on the Apple II and IIGS…."
