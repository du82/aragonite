["https://www.apple2history.org/appendix/ahb/ahb5"]
title = "1990-1995"
description = "1990 Motorola introduces 68040 processor. IBM introduces the PS/1. Commodore introduces the Amiga 3000 ($3300). ARPANET, the first data network, is shut down. 1990 January Call-A.P.P.L.E. ceases pu…"
full_description = "Macintosh Classic, Macintosh LC, and Macintosh IIsi introduced. The Mac Classic replaces the Mac Plus and Mac SE.[11] Apple IIGS System Software v5.0.3. It fixes some bugs and speeds up the ImageWriter driver. However, there were problems with this driver under low memory situations, so it was not widely distributed.[13] America Online adds a client for MS-DOS users, in addition to its existing Apple II and Macintosh customers. Westcode introduces InWords, which allows text digitized with the Quickie hand-scanner to be turned into text files. Apple StyleWriter ($599) and Apple Personal LaserWriter LS ($1299) released. At the time of the announcement, neither can work on the Apple II or IIGS. Mac System 7.0 released, the first major rewrite of the Mac operating system. It intoduced features such as the ability to use an “alias”, as well as TrueType fonts, file sharing, and QuickTime video software.[18] The first availability, by FTP, of software needed to use the Internet with CERN’s Hypertext Transfer Protocol (HTTP). This lays the foundation for the World Wide Web.[19] Apple’s first User Group Television live satellite broadcast. A new Apple IIGS is almost announced, but the project is killed by Apple management at the last minute. SuperDrive interface card for Apple II released. It can use 1.4 MB capacity 3.5 disks on an Apple IIe or IIGS, making it possible (when translation software is made available) to read and write even MS-DOS disks. Apple IIGS System Software v6.0 released. It includes a driver to allow the Apple StyleWriter printer to be used on the IIGS. The A2 Roundtable on GEnie announces its Lost Classics project, coordinated by sysop Tim Tobin, which has the object of locating and re-releasing older Apple II software that has disappeared from the marketplace. MODZap 0.6 and soniqTracker 0.3 MOD music players released for IIGS, starting a friendly rivalry between the two programmers, each trying to top each other. Fourth A2Central Summer Conference (KansasFest); it celebrated the 15th anniversary of the release of the Apple II."
