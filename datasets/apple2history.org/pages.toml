["https://www.apple2history.org/2014/01/24/macintosh-forever-uh-oh"]
title = "Macintosh Forever? Uh-oh…"
description = "<snarky mode enabled> Jason Snell, writing for MacWorld today about the 30th anniversary of the launch of the original 128K Macintosh, gave a quote by Phil Schiller. He said: “There is a supe…"
full_description = "Antonio Rodríguez January 24, 2014 In the last times we have seen more and more signs of the Mac becoming the new Apple II. But in 2014, things are a bit different. Contrarily to what happened with the Apple II, Apple does not need the Mac to fund iOS’ development. But they will not, they can not kill the Macintosh, at least in a few years. Because iOS isn’t self-hosting, and they need a development platform for it. But they can (and will, I’m afraid) let the Macintosh ecosystem die a slow death, and continue updating only the base OS and XCode. Reply Apple II user March 26, 2014 Isn’t a classic Mac already dead? The current Macs have Intel CPUs and OS X. These Macs cannot run the old software. In essence, they are Macs in name only… Reply John Link May 7, 2014 Yesterday I reviewed current Mac offerings for possible purchase by a friend. The performance of all models could be surpassed by building a PC with off the shelf components that are commonly available to anyone. The containers are superbly designed, for sure, but the capabilities of what is inside are just as necessary to maintain innovation as the aesthetics. Apple’s new hire of the former CEO for Burberry reminds me of the hire of John Sculley so many years ago. The “toner-heads” that once ruled Xerox are getting the upper hand. Reply Antonio Rodríguez May 7, 2014 As Jobs once said, “A players hire A players; B players hire C players”. I hope to be wrong, but Apple is taking the same paths it took in 1985 after the forced exit of Jobs. And, sadly, this time Jobs can’t return to save the company. If history teaches us something, in a few years, after Android (the new PC) has eroded enough market share, Apple will engage in a price war with Android handset makers, and the customers that love Apple for its quality will flee. That is, if Tim Cook doesn’t stop it (IMHO, Jonathan Ive would have made a better CEO, as he had a lot of affinity with Jobs, but that’s another matter). Reply"
year_published = 2014
year_updated = 2014
clearnet = "https://www.apple2history.org/2014/01/24/macintosh-forever-uh-oh"
