["https://www.apple2history.org/2014/06/11/when-the-apple-ii-was-new"]
title = "When The Apple II Was New"
description = "I’ve been so busy recovering from birthing my book (the stitches have come out, thank you) that I have not paid attention to anniversaries. I was reminded by the post on Cult of Mac yesterday…"
full_description = "Antonio Rodríguez June 11, 2014 There is another fact that makes the Apple II unique: it spawned a whole generation of programmers. Its combination of simplicity and power allowed your skills to grow. Many seasoned Microsoft and Google engineers learned to program and developed their abilities on an Apple II. Without the Apple II, there wouldn’t be so much quality software in other (unrelated) platforms! Reply James Leatham June 12, 2014 I purchased # 000105 in El Paso TX. I also got the simulated leather carrying bag. I still have that. The logo on it has no bite out of the apple. I see no mention of it in any of the ads or documentation. Why is that? Reply Steven June 12, 2014 You are right; the carrying bag is a part of the experience of those early adopters of the Apple II. I guess amongst all of the other details of the computer, I neglected to include this fact. I honestly do not know how long this was offered with the Apple II. Strictly speaking, it was likely not really a useful item; I mean, how many people actually carried their desktop computer from place to place using that bag? Reply"
