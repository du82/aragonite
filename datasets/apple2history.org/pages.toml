full_description = "It’s exciting to see something that has involved so much work, long term and short term, come to pass. But it’s even more exhilarating to see others share in it. I’ve had a number of Twitter and Facebook posts from people who were saying… It’s December 2nd, and although Amazon still has the book listed as for “pre-order”, I want to confirm that it really does exist. My supply came in a box from UPS today. They insisted on posing for a picture: After further conversations with my publisher, we have decided it will be acceptable to leave the current Apple II History content on the site as it is. The caveat is that there is some material in the book that has been updated or expanded… In the process of announcing my book, I made mention about this web site that I guess was unclear. I have had some concerned emails sent my way asking about it, and so I decided that I had better explain what I meant. When… Not a dream! Not an alternate reality! Not a hoax! Yes, the book is finally and truly available on Amazon for pre-order (see link below), and should be available for delivery after December 1, 2013. The book was submitted to the printer during the… I myself have placed an order for the Sophistication and Simplicity book, so I would get announcements from Amazon about it. Tonight I got the email that says the order has been cancelled, and Amazon apologizes for the inconvenience. Don’t listen to them!! It is… It has taken almost two years of travel to get to this point. I left my starting point in my packed up wagon of info about the Apple II, and slowly made my way west towards the new land of print media. Along the… The book is in the final editing stage now, so it’s getting really close. Those who have pre-ordered it are probably getting messages from Amazon that say, “Are you sure you still want this? It’s still not available.” Please be sure to tell Amazon… For those who are wondering when this wondrous and highly informative chronology of the Apple II and its culture will actually be available for purchase, rest assured that progress continues on the editing and polishing process. It is later than I’d hoped, but I…"
