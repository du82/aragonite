["https://www.apple2history.org/category/apple2"]
title = "Apple II"
description = 'The story of "the MOST personal computer"!'
full_description = "Long ago I included a quote from Jerry Manock about what color was used on the Apple II series. Clearly, the correct answer is “Pantone 453” like he said, right? Well, perhaps it’s not that simple. Ben Zotto did some deeper research, and posted… A few years ago I saw posted info on Geek Culture/Joy of Tech on how to make a cake that looked like the Smithsonian Apple-1 computer: Now, Mike Maginnis has posted in the Apple II Enthusiasts group on Facebook a link to pictures of… This entire web site is focused on preserving and telling the story of microcomputers, focused with insane depth on the Apple II. I’ve been telling it for 20 plus years, and have a book about it. So I know what I know quite well, and… That annual Apple II conference is only a month away, and yes, I’ve got another music parody for it: Come down and help me make it better with live action! One of the first things I did when I first had access to an Apple II Plus back in 1981 was to enter programs in Applesoft BASIC, typed from a listing in Nibble magazine. With time and the help of technical info I learned from All… I’ve been so busy recovering from birthing my book (the stitches have come out, thank you) that I have not paid attention to anniversaries. I was reminded by the post on Cult of Mac yesterday (here) that it was on June 10, 1977 that the… Ten years ago, I received an email from a gentleman named Moses Weitzman. He wanted to know if I was interested in some old Apple II manuals and other materials that he had, but wanted to get rid of. He preferred to not just… Category: Apple II, Apple II Plus, MagazinesTags: Apple, Apple DOS, catalog, documents, magazine, printer card Last year was noteworthy as the 35th anniversary of the release of the original Apple II. This year, 2013, has its own significant anniversary to commemorate. It was 35 years ago this coming July that the Disk II floppy drive was made available for… Ray Thompson of Dallas, Texas, was involved with the formation of one of the earliest Apple User Groups. He has made a video telling his personal story, clips from historical interviews with Steve Jobs and Steve Wozniak, and the formation and development of the…"
