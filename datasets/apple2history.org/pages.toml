["https://www.apple2history.org/2013/07/26/krazy-kansasfest"]
title = "Krazy KansasFest"
description = "If you have looked over the content on this site, you have found the various song parodies I have created over the years. This year, I am inspired to make one for the annual Apple II gathering, Kan…"
full_description = "Wade July 29, 2013 I think my favourite line is ‘Trace out that object code and try to find the glitch’. Reply If you have looked over the content on this site, you have found the various song parodies I have created over the years. This year, I am inspired to make one for the annual Apple II gathering, KansasFest. This year has been outstanding! I didn’t have my book ready to distribute as I was hoping, but that’s actually a good thing. The keynote speaker, Randy Wigginton, provided some insight to events that I didn’t previously have. Additionally, Steve Wozniak attended and, like Wigginton, stayed to listen to some of the sessions, including mine. Very exciting! Anyway, I felt ready to create a parody for KansasFest itself, and here is what I have to share. Enjoy! Roll out those lazy, hazy, crazy days of KFest Those days of ProDOS and BASIC and bytes Roll out those lazy, hazy, crazy days of KFest Dust off the Apple IIGS, don’t sleep at night. Just fill your luggage up with floppy disks and cables Then buy your ticket, now you’re set And at the dorm, you’ll see the hackers at their tables Making their projects; I don’t think they’re finished yet! Roll out those lazy, hazy, crazy days of KFest Bring out the II Plus and plug in your gear Roll out those lazy, hazy, crazy days of KFest You’ll wish that KFest could always be here! Roll out those lazy, hazy, crazy days of KFest Plug in some slot cards, and flip on the switch Roll out those lazy, hazy, crazy days of KFest Trace out that object code and try to find the glitch Don’t need to tell a coding fella ’bout a RAM chip Or some confusing address scheme Why, from the moment that his file starts to unzip You’ll see his winner of a program on the screen! Roll out those lazy, hazy, crazy days of KFest Just get your IIc to plot out a sphere Roll out those lazy, hazy, crazy days of KFest You’ll wish that KFest could always be here"
