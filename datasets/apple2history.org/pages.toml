full_description = "The 1991 Apple II Achievement Awards, sponsored by Resource Central and inCider/A+ magazine with cooperation from Apple Computer, Inc., were presented Friday, April 3rd, 1992, in a national online conference on America Online, winner of the 1990 Achievement Award for Best Online Service. A prestigious panel of Apple II industry watchers, including representatives from inCider/A+, A2-Central, Apple Computer, America Online, CompuServe, GEnie, GS+ magazine and Nibble, recently nominated awards in a number of categories designed to recognize excellence in products for the Apple II family of computers during the period from November 1, 1990 through the present. Those products recognized as the best by the panel were nominated for Awards. A panel of over 100 Apple II community members was entrusted with selecting the best of the best during balloting between March 3rd and March 27th, 1992. Those selected receive the 1991 Apple II Achievement Award, a lead crystal disk engraved with “1991 Apple II Excellence” and an Apple logo on a crystal base. The complete list of Apple II Achievement Award categories and recipients is as follows (Note: some of these were not quite available until early 1992, and therefore did not make the above list as being released in 1991)[1] :"
