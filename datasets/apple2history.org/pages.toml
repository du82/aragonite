["https://www.apple2history.org/appendix/ahb/ahb1"]
title = "1969-1977"
description = "1969 Intel designs the 4004 microprocessor. The name is derived from the approximate number of transistors that it replaced, and indirectly was a measure of its complexity, as it handled 4 bits of …"
full_description = "Devscrap March 1, 2015 The Sweet16 paper was published in 1977 november issue of Byte Magazine. Byte Magazine Volume 02 Number 11 – Memory Mapped IO (November 1977): p.150 SWEET16: THE 6502 DREAM MACHINE [theme Software] [author Wozniak] Reply The Department of Defense’s Advanced Research Project Agency funds the creation of ARPANet, to make it possible for their various research facilities to communicate with each other from around the country. It begins with only three host computers, and eventually evolves to become what is now known as the Internet. ARPA’s Network Working Group designs “telnet”, a protocol that allowed users to logon remotely to any computer on the ARPANet network.[3] Intel introduces the 8008 microprocessor, which runs at a speed of 200 kHz (or 0.2 MHz), and sells for $360.[11] First public demonstration of ARPANet at the International Conference on Computer Communication, held in Washington, DC.[12] The Micral computer is released in France. It is the first computer built around a microprocessor, the Intel 8008. Designed by François Gernelle, and sold by the French company R2E for $1,750, fully assembled, it did not have any impact in the U.S.[17] Radio Electronics magazine prints a construction article called “TV Typewriter” by Don Lancaster. This project allowed users to create a video terminal that worked with a standard television, and would allow them to connect to a mainframe computer — if they had one available.[18] It could display 16 lines of 32 uppercase characters.[19] Vint Cerf and Bob Kahn publish a paper proposing the use of a transmission-control protocol (TCP) to make it possible to share information between different computer networks.[23] The July issue of Radio Electronics introduced the Mark-8, the first computer kit to build at home.[24] It uses the Intel 8008 chip, which by this time was selling for only $120. A group of eight engineers and marketers, including Bill Mensch and Chuck Peddle, leave Motorola to work for MOS Technology, at that time the world’s largest manufacturer of calculator chips. They begin to design a microprocessor for the company to sell.[25]"
year_published = 2015
