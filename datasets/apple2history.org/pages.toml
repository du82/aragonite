["https://www.apple2history.org/2014/01/13/centossa-the-apple-ii-that-never-was"]
title = "Centossa – The Apple II That Never Was"
description = "I have seen a few reviews of my Sophistication & Simplicity book appear on Amazon.com, and I appreciate the kind words that have been posted so far. Interestingly, one of the commenters marked …"
full_description = "Antonio Rodríguez January 13, 2014 It could be said that even the Apple IIc had the power supply at the left side: that’s where the internal DC-DC onverter was located. Reply Olivier Guinart January 13, 2014 Not his email, but his Twitter ID is @gassee. And it’s Jean-Louis Gassée, not Gassè (not just the missing e but also the wrong accented e). Reply Mike Maginnis January 13, 2014 The Computer History Museum posted a video of a chat given in 2007 by Bob Brunner and Jerry Manock. At the 35:20 mark, Brunner mentions the IIsi and shows the picture from AppleDesign. He only stays on it a few seconds and is vague, saying that it never shipped and “only made it to tooling” and then moves on. It was this clip that motivated the call to Tony during Open Apple. Reply Mike Maginnis January 13, 2014 Manufacturing terms have slightly different meanings for different companies and industries obviously, but the second definition for “tooling” at Dictionary dot com is “b. the planning and arrangement of tools for a particular manufacturing process.” Reply françois January 13, 2014 In AppleDesign book , the word “concept” is often used in description / comment of the pictures. i.e Apple IIs page 100 , and page 109 concerning the Apple II GS. Reply Mike Willegal January 15, 2014 Tooling means you are making the tools required to build the product in a production environment. This is usually done after a prototype is built using custom methods. Reply Unnamed Engineer April 8, 2014 I worked on the Mark Twain. It has a 20 MB hd and a 3.5 floppy built in with an external scsi port on the back. Up until about a year ago I had serial number 47 in my attic. The reason that it was killed was that the first year projected sales were 70k units and there were 70k LC II’s sitting in the warehouse. The fear was that MT would canobolize these sales. This battle, the IIGS lost, and so ended an era. Reply Mitchell Spector June 11, 2019 I would disagree with Tony’s assessment (above) that the casing is a merely a crude wooden mock-up. Judging by the photograph in the book, it is clearly an ABS plastic injected case mold, and finalized to the point where we see very fine access cut outs for a LED, floppy and even an Apple badge. Also note the official “Apple IIsi” name is machine silk-screened on, something even the Mark Twain prototypes lack. Whether a prototype motherboard had been built at this stage is questionable, but it is clear Apple was serious about this project. I’m betting, at least on paper blueprints somewhere, a rudimentary computer design exists along with a set goal of planned features. It should also be pointed out, this isn’t the only prototype Apple II concept that never made it past the development stage. There is the “Apple IIp”, a successor of sorts to the Apple IIc, which would have had a built-in LCD screen, battery, hardisk, a case handle and included AppleWorks pre-installed. The Mark Twain prototype is what frustrates me the most. I knew of its existence way back in 1990, when a seeded prototype was given to LCSI (Logo Computer Systems Inc) here in Montreal, Canada. The interesting thing is the information leaked to me back then, not only described bit-for-bit what we know of the Mark Twain today, but several more advanced features not present (e.g. an enhanced VGC and Ensoniq, plus speedier 65C816). Either the original design was scaled back due to costs/internal politics, or someone was pulling my leg. Either way though, I cannot imagine the ROM 3 or Mark Twain (as was discovered) is the best Apple engineers could think up over the six year lifespan of the Apple IIGS. I’m quite sure there are lost designs and prototypes not yet discovered. Reply"
year_published = 2014
year_updated = 2014
