full_description = "For those who are wondering when this wondrous and highly informative chronology of the Apple II and its culture will actually be available for purchase, rest assured that progress continues on the editing and polishing process. It is later than I’d hoped, but I believe the extra time being taken will result in a final manuscript that will be better for the extra care being taken. It will be ready when it is fully fermented, the water has boiled, and we’ll get there when we get there, so sit back and enjoy the scenery. As for now, I am preparing to head to KansasFest, where I expect another amazing week of Apple II retrocomputing, things old and new revealed, surprises and fun with other similar-minded enthusiasts. Hope to see you there!"
