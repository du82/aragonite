["https://www.apple2history.org/2010/10/23/the-competition-part-1"]
title = "The Competition, Part 1"
description = "In the late 1970s, when the personal computer revolution was taking off, there were a large number of platforms all vying for consumer acceptance. Each company had their proponents and critics. Con…"
full_description = "Time Tracking October 28, 2010 Wow! I had a TRS-80 when I was a kid, and then moved into my first Apple. I’d never really thought about the advantages/disadvantages to each machine, as at the time, it was whatever I could get mom and dad to buy for me. Great trip down computational memory lane here, and thanks for the pros/cons of each machine. Reply In the late 1970s, when the personal computer revolution was taking off, there were a large number of platforms all vying for consumer acceptance. Each company had their proponents and critics. Consider today’s Mac vs PC wars fought out in television ads and blog sites, and then multiply that by twenty or more, and you have the environment of the day. In that day it was fought out in advertising, in the early magazines, in small user groups, and in computer store show rooms. This was the pre-IBM PC era, but the post-Altair-built-it-yourself era. Computers had begun to be simple enough to purchase, plug in, and start to use, but were still far from easy to manage. I have written extensively about the computer platform I knew the best, the Apple II series. I have not really ever commented on any of the other available non-Apple computers of the day, and how they differed from the Apple II. With most of them I did not have more than a passing acquaintance, perhaps trying them out in a store. What I have failed to do in the past was to discuss how these products compared and contrasted with the brainchild of Woz and Jobs. Between 1977 and 1982, several important computer platforms were launched that each had an impact on the early home computer landscape. Many offered features that were missing from the Apple II series, and deserve a brief profile here. The year 1977 saw the release of three important computer platforms: The Commodore PET, the Apple II, and the Radio Shack TRS-80 came out, all within a month or two of each other. In 1979, Atari released its home computers. Commodore came out with the VIC-20 in 1980 and the Commodore 64 in 1982. I am specifically choosing to NOT discuss the IBM PC (other than in passing), as it was actually the introduction of the new generation and style of personal computers."
year_published = 2010
year_updated = 2010
