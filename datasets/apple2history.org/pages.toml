["https://www.apple2history.org/2014/02/22/oriental-apples"]
title = "Oriental Apples"
description = "In part 13 of the History on this web site (and in Chapter 15 of Sophistication & Simplicity, available at fine booksellers everywhere), there is a short section discussing Apple’s first …"
full_description = "Johnson Lam July 14, 2014 There’s another more powerful Chinese card name ?? which use input method Cangjei (??). At that time even the TV broadcasting subtitle use it, a lot of Music Video in YouTube still can see the Chinese characters produced by it. YouTube video: 8dHRCGZNy-o Reply In part 13 of the History on this web site (and in Chapter 15 of Sophistication & Simplicity, available at fine booksellers everywhere), there is a short section discussing Apple’s first foray into sales targeting the Far East. The Apple II j-Plus was a slightly redesigned Apple II Plus, with a character ROM chip modified to display Japanese Katakana characters with the appropriate POKE to $C05C to activate them. A reader of this web site who lives in Hong Kong, Wyatt Wong, recently sent me an email asking why I didn’t mention anything about a Chinese “language card” for the Apple II in this part of the History. I had not heard of it before, and so he helped educate me about this hack that let Chinese-speaking (and writing) individuals use an Apple II in years past. Further information came from Lim Thye Chean of Singapore. While in school in the 1980s, Wong was exposed to a Far Eastern Apple II clone. Like those from Japan, the use of this Apple II required some knowledge of English to do programming or to use the large library of software available from the United States. Yet, there was desire to make it work for the numerous Chinese logograms used in that written language, and hackers in that part of the world worked to create a solution that would work for this computer. The result was referred to as the Chinese language card. The Giantek Technology Corporation of Taiwan was founded in 1982, and produced English-Chinese terminals for Taiwan and mainland China. In 1983 the company came out with the Giantek Chinese Interface Card for the Apple II, officially called the Zon Ding Chinese System, or simply Han Card (Han means “Chinese”). Despite the “Chinese language card” name used to refer to it, this was not a RAM card like the 16K Apple Language Card. It was much more complicated."
