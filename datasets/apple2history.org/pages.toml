["https://www.apple2history.org/2010/09/04/doug-engelbart"]
title = "The origins of interface"
description = "[This post is courtesy guest blogger Ken Gagne.] Today’s home computers seem to evolve more incrementally than computers of a few decades ago. When the Apple II was new, innovations abounded …"
full_description = "Antoine September 14, 2010 Six months ago, I acquired an Apple mouse prototype which is described at http://www.brutal-deluxe.fr/projects/mouse/ Thank you for that news that is very interesting, antoine Reply Today’s home computers seem to evolve more incrementally than computers of a few decades ago. When the Apple II was new, innovations abounded as technology was applied and created in ways never before imagined. There were more “firsts” back then, such as the first electronic spreadsheet, VisiCalc, which cemented the computer’s place in businesses nationwide. The genius of those early pioneers is evident, but what is sometimes overlooked are the giants upon whose shoulders they stood. The Apple II adapted and borrowed from what had come before, and one of its most significant pieces of hardware was the mouse. This input device was popularized by the Macintosh in 1984 and introduced for the Apple II a year later, but it was not an invention of Apple Computer Inc. The mouse was designed decades earlier by Doug Engelbart, with assistance by Bill English, both of the Augmentation Research Center at the Stanford Research Institute in Menlo Park. It was in 1968 that Engelbart made his first public demonstration of the mouse. It was one part of a much longer presentation that included several other hardware and software innovations. On December 9, 1968, Douglas C. Engelbart and the group of 17 researchers working with him in the Augmentation Research Center at Stanford Research Institute in Menlo Park, CA, presented a 90-minute live public demonstration of the online system, NLS, they had been working on since 1962. The public presentation was a session in the of the Fall Joint Computer Conference held at the Convention Center in San Francisco, and it was attended by about 1,000 computer professionals. This was the public debut of the computer mouse. But the mouse was only one of many innovations demonstrated that day, including hypertext, object addressing and dynamic file linking, as well as shared-screen collaboration involving two persons at different sites communicating over a network with audio and video interface."
year_published = 2010
year_updated = 2018
