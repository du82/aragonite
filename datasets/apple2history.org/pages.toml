["https://www.apple2history.org/2015/08/01/kfest-as-seen-by-an-outsider"]
title = "KFest, as seen by an outsider"
description = "While at KansasFest this year, we had two new people show up, for the purpose of doing a news story about the event. I had not heard of their publication, Motherboard, prior to this, and I will adm…"
full_description = "While at KansasFest this year, we had two new people show up, for the purpose of doing a news story about the event. I had not heard of their publication, Motherboard, prior to this, and I will admit I was a little skeptical about how this would turn out. I have seen interviews and stories before that were done with a particular purpose in mind, and sometimes the final result is not flattering. I must applaud the writer of the piece, Jason Koebler, for a job well done. He did capture the essence of the event, and did it as someone who has not been there before, and in fact someone who does not really know anything about the Apple II. You can read the article here. The style reminds me of the audio stories I hear on NPR’s weekly program, This American Life, which I mean as a compliment, as I feel that most of those stories as well done, and good listens."
