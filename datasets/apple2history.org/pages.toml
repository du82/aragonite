["https://www.apple2history.org/appendix/ahb/ahb3"]
title = "1982-1985"
description = "1982 Intel announces the 80286 processor. Kaypro introduces the Kaypro II portable, with 9-inch screen and software included, to compete with the Osborne. The term Internet is first used to describ…"
full_description = "Radio Shack introduces the TRS-80 Model 16, with both 68000 and Z-80 processors, 128K RAM, and 8-inch disk drive ($4999).[4] Franklin Computer Corporation releases the Franklin Ace 1000, a copy of the Apple II Plus, with 64K of RAM built-in.[8] Apple sues Franklin Computer Corporation for patent and copyright infringement in the creation of its Franklin Ace line of computers. The ruling that came from this trial is initially found in favor of Franklin.[9] Business Solutions introduces The Incredible Jack, the first integrated software program for the Apple II. It did word processing, personal filing, mailing labels, and had spreadsheet (“Calc”) functions. It ran under DOS 3.3 and worked on the II Plus.[11] Commodore 64 released, with a 6510 processor, 64K RAM, 20K ROM with Microsoft BASIC, color and custom sound chips, and serial interface, for $595.[13] Apple throws a “Billion Dollar Party” for its employees to celebrate the milestone of being the first personal computer company to reach a $1 billion annual sales rate.[20] Franklin Computer demonstrates the Franklin Ace 1200 at the CP/M ’83 show. It includes a built-in Z80A processor, CP/M card, 128K RAM, an 80-column text card, and a Disk II-compatible drive, all for $2200. [27] On January 1st, every site connected to ARPANET had to have completed conversion to the use of TCP/IP for interconnection.[28] Apple UniFile and DuoFile disk drives for the Apple III announced. Also called the Apple 871 drive, it used disks with a capacity of 1702 SOS blocks (which were the same size as ProDOS blocks). They were to sell at $1000 for the UniFile, and $1700 for the DuoFile. The drives were advertised as being ideal for backing up the ProFile 5 MB hard drive for the Apple III. Undoubtedly they didn’t move to the Apple II during the post-Apple III era because the smaller 3.5 inch drives were coming for the Mac, and had the potential of holding 800K of data (almost as much as these) and would cost less.[32] Radio Shack Model 100 released. Considered by some to be the first laptop computer, it was developed in Japan and marketed in different parts of the world under different names (and slightly different features). With nearly a full-sized keyboard and a 8 line by 40 column LCD display, it could run for several hours on four AA batteries, and featured a word processor (written by Bill Gates), telecommunications program, address book, telephone dialer, and Microsoft BASIC, all in ROM.[35]"
