["https://www.apple2history.org/2017/07/26/kansasfest-2017-postlude"]
title = "KansasFest 2017 Postlude"
description = "I know that my posts here in the past few years are often just saying “Hey, I was at KansasFest” and not much else, but, hey, what can I say, there’s not much new in Apple II hist…"
full_description = "Michael August 5, 2017 Awesome!! CEEMAC is something that still fascinates me to this day. Do you know if there is a programming reference scanned for it anywhere? I couldn’t turn up anything :/ Reply Steven Weyhrich August 6, 2017 There is somewhat of a programming reference ON the CEEMAC disk, but I do not know of any printed reference. Reply I know that my posts here in the past few years are often just saying “Hey, I was at KansasFest” and not much else, but, hey, what can I say, there’s not much new in Apple II history these days. That being said, I’m going to feature something written by someone else. My KFest roommate this year was Dave Rogers, a newcomer to the event. He writes a blog, “Nice Marmot”, and has a good, comprehensive discussion of his experiences at this year’s event. You can see what he thought about it here, and it is well worth a read. Dave also made a discovery that passed me by completely. Way back when, Brooke Boering had a company called Vagabondo Enterprises, and created a visual programming language called CEEMAC. It allowed creation of hi-res graphics animations on the Apple II. Back around 1982 or so, he released a demo disk that highlighted the capabilities of CEEMAC, and called that demo “Fire Organ”. It was intended to be a self-running demo, with some ability to interact and change how it worked. I had a copy of Fire Organ back in the day, but never spent the money to get the CEEMAC programming language disk. What does this have to do with KFest? Well, for the Apple IIe that I brought along, I neglected to include any disks to boot it with. Or I thought I had not done so. When I plugged it in and turned it on, I discovered that it did boot up something, and found there was a copy (so I thought) of Fire Organ in the disk drive. Oh, cool, I thought; I’ll just run this as an interesting visual demo in my room here. (Okay, green-screen monitor, so less interesting than it could have been, but…) Dave saw this at some point during the week, and took a closer look at the disk. He pointed out to me that this was not the Fire Organ demo, but was a copy of CEEMAC v1.61 (beta), meaning that this was actually the programming language used to create the Fire Organ demo! I literally have no idea where I got this, but he made sure it got into the hands of 4am, so it could be imaged for the Internet Archive, as it appeared to be different from the version that was already there."
year_published = 2017
year_updated = 2021
clearnet = "https://www.apple2history.org/2017/07/26/kansasfest-2017-postlude"
