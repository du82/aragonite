full_description = "That annual Apple II conference is only a month away, and yes, I’ve got another music parody for it: Come down and help me make it better with live action! I’ve combed YouTube looking for videos about the Apple II series, and have found additional movies to add to the Museum. There are now two categories for videos: A general category, for videos like the dealer video I mentioned in my last post, and… Thanks to the abilities of WordPress to easily post links to videos, I have a new Museum section specifically for Apple II-related videos. This page shows links to three segments of a promotional video for use by Apple dealers in preparation for the 1984… Going through the emails that I have accumulated in the past ten years, I’ve mined some gold that has been languishing in my archive: Update to Chapter 17, by adding a little more information about the Logo language on the Apple II and IIGS…."
