["https://www.apple2history.org/2013/03/06/polishing-apples"]
title = "Polishing Apples"
description = "I haven’t said much about the upcoming book for a while, primarily because I’ve been busily at work making corrections, revisions, and in some cases additions to the material. The edito…"
full_description = "I haven’t said much about the upcoming book for a while, primarily because I’ve been busily at work making corrections, revisions, and in some cases additions to the material. The editor going over the material is not an Apple II person, which is actually a Really Good Thing. He has questions about things that were obvious to me (and to my generation of Apple II users), things which are less obvious to a potential present-day audience. It is likely that the revisions and polishing are going to push back the potential release date from April 1st to a later date (and no, that date was not selected as an anniversary of the founding of Apple). But the final product will actually be better than what I had originally envisioned, so hang in there!"
