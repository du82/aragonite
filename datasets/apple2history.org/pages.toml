["https://www.apple2history.org/appendix/parodies/wreck"]
title = "Wreck Of The Apple ]["
description = "© 1994 Steven Weyhrich (with significant help from Doug Cuff) (Sung to the tune of “The Wreck of the Edmund Fitzgerald” by Gordon Lightfoot) [audio:wreck.mp3] The legend lives on from t…"
full_description = "The legend lives on from the management on down In the big town they call Cupertino[1] At Apple, it’s said, they will shoot products dead When the stocks and the market turn gloomy With a load of RAM chips, forty-eight thousand bytes[2] fit That the Apple ][ main board weighed loaded That good CPU was a bone to be chewed When reality distortion[3] came early The ][ was the pride of Wozniak’s side Of the Homebrew Computer Club meeting As the new units went it was better than most With a ROM and dot graphics well reasoned Concluding some terms with that Microsoft firm It shipped fully loaded with firmware But within a few years we confirmed our worst fears It would be the Mac wind we’d be feeling The blurbs out in print made it seem we were safe When they said the Mac‘s RAM was too tiny But the Mac team knew, as their Captain[4] did, too That the Apple ][‘s cash they’d be stealing The IIe came late[5], sixteen bits[6] had to wait While the Mac and its sales they were flailing[7] When ’86 came the GS[8] staked its claim In the face of a hurricane Mac blitz When ’91 dawned, the ROM 04[9] was spawned And on satellite link[10] they would show ya But with a last minute cut, the ][‘s shut down began We thought, GS, it’s been good to know ya MacWeek[11] wrote again, the old ][ would just end It’s publicity still was an outrage By late ’93, when more Macs came in sight Came the end of the Apple ][ voyage Does anyone know where the brains of men go When cash for promotion’s allotted? The reviewers all say she’d be here today If they’d put some more ad space behind her It might have VGA, a big hard drive inside Perhaps thirty-two bits[12] with SIMMs[13] in ‘er But all the remains are the faces and the names Of the millions who’ve known and have loved her Microsoft rolls, Intel sings In the 95 Windows[14] promotion Ol’ IBM steams with its OS/2[15] dreams The Mac clones all try for their portion And farther below, the World Wide Web goes Taking in what the modems can send her But the Apple folk go (at least we hope so) With mistakes of the A2[16] remembered"
year_published = 2010
year_updated = 2010
