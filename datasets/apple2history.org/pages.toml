title = "Point To Point"
description = "At a recent gathering to celebrate the 30th anniversary of the introduction of the Macintosh, a video recording was taken of a conversation between Dan Kottke, Rod Holt, and Steve Wozniak discussin…"
full_description = "At a recent gathering to celebrate the 30th anniversary of the introduction of the Macintosh, a video recording was taken of a conversation between Dan Kottke, Rod Holt, and Steve Wozniak discussing the preparation of the original Apple II prototype. In the video, Kottke expresses his surprise that Holt, a photographer, never took any pictures of the Apple II prototypes, and neither did Steve Jobs. There are apparently no photos of the Apple II during its design process. Woz also clarifies that his prototyping method in those days was to use point-to-point soldering, rather than the more commonly used wire-wrapping technique. In the latter part of the video, he discusses how he put the pieces together and soldered them, on both the Apple-1 and the Apple II."
