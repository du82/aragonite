["https://www.apple2history.org/2013/05/12/bell-howell-not-just-black"]
title = "Bell & Howell: Not Just Black"
description = "Every so often, a new bit of Apple II trivia comes my way. I was recently sent a message asking about whether Bell & Howell had made a beige version of its computer. David Bohrman had pictures …"
full_description = "Every so often, a new bit of Apple II trivia comes my way. I was recently sent a message asking about whether Bell & Howell had made a beige version of its computer. David Bohrman had pictures of this, and informed me so. I asked for some clarification, and he kindly sent me several pictures (which I have placed in the photo Museum here). With further photos, Bohrman discovered that what he had was a product made by Bell & Howell for their black Apple II computer that made it more useful for schools, but one that had been made to match the color of a standard beige Apple II. This backpack was actually a great add-on to the Apple II, and would have been a good device for Apple to have included as an option to sell to customers. As uncommon as this item is, I suspect that Bell & Howell did not sell too many. See the entry in the Museum for a couple more pictures. Thanks to Mr. Bohrman for this interesting bit of history!"
