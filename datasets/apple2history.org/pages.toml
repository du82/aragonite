["http://apple2history.org/history/ah08"]
title = "8-The Apple IIc"
description = "CONTENTS Steve Jobs & Macintosh Apple IIc: Beginnings Hardware Firmware Product Introduction Success? Overcoming Limitations Enhancements Timeline Notes PRELUDE: STEVE JOBS AND MACINTOSH To dis…"
full_description = "Guilloip April 8, 2012 I used to have a chipper Taiwan manufactured version of Apple ][+ called Micro ][. And I remember the Apple //c as a new beautiful and powerful portable computer everybody wanted. The mouse, also seen in some ][e, its size, its look, its power. Reply Steven December 17, 2013 I went ahead and approved this, but you might get more hits on comp.sys.apple2 newsgroup, or the Apple II Enthusiasts group on Facebook or Google Plus. Reply To discuss the smallest Apple II, the IIc, it is necessary to look at the environment and other events that were happening at Apple Computer, Inc. in the years preceeding the release of this model. Recall from Chapter 7 that it was shown how Apple’s Lisa project was designated as the computer that was considered to be the future of Apple. From a series of parallel processors and a “bit slicing” architecture, to a focus on the Motorola 68000 microprocessor as the controller of this advanced computer, the project had been progressing very slowly. It was begun back in 1979 with the same focus as any other Apple product: Frank Rose, in his book West Of Eden, explained the environment at Apple this way: “Both [Apple III and Lisa] had been conceived of as nifty pieces of hardware rather than as products to appeal to a specific market: At Apple you designed a box and people bought it because it was neat, not because any thought had been given to what it would do for them.”[1] However, a significant change occurred in 1979 when Xerox bought a large chunk of Apple stock. In return for being allowed this stock purchase, Xerox authorized the use of some of their research ideas to be in the design of an office computer. Jef Raskin, one of Apple’s early employees, had seen the work being done at Xerox’s Palo Alto Research Center (PARC), and encouraged the Lisa design team to take Xerox up on its offer. Steve Jobs went on that visit to PARC, and was significantly impressed with the Xerox Star computer and its user-interface, with its icons, bit-mapped graphics-based text characters, overlapping windows, and a pointing device called a “mouse”. The Lisa design goals were changed to utilize these revolutionary features, and the project finally took on the distinct personality that made it possible to become the ultra-computer Apple needed. This was important, since by 1981 Apple executives were getting sweaty palms worrying about the future. The Apple III was clearly not taking the business world by storm."
year_published = 2012
year_updated = 2018
