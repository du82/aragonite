title = "SCSI !"
description = "© 1993 Steven Weyhrich (Sung to the tune of “Dizzy” by Tommy Roe) (In order to “get” this, you have to remember that the term “SCSI”, an acronym for Small Comput…"
full_description = "(In order to “get” this, you have to remember that the term “SCSI”, an acronym for Small Computer Systems Interface, is often pronounced as “Scuzzy”. Just say “Scuzzy” everywhere it reads “SCSI” and it will make more sense. Also, when you see “][“, pronounce that as “two” — referring to the Apple II computer — and it will fit just fine.) I’m so SCSI, my disk is spinnin’ Like a FOR/NEXT[1], it never ends And it’s you, ][, makin’ it spin You’re making me SCSI! When first I saw your processor I knew that I just had to make you mine But it was hard to “talk” to you With DOS 3[2] hanging ’round you all the time With me you’d have some power, yet You kept playing hard to get Goin’ around in circles all the time! I’m so SCSI, my disk is spinnin’ Like a FOR/NEXT, it never ends And it’s you, ][, makin’ it spin You’re making me SCSI! I finally got hooked up to you, And told you just exactly how I felt And then you shared your RAM with me, BSAVEd[4] it, and my bits began to melt ][, you’ve got control of me, And I’m so SCSI I can’t see We need to call CAT.DOCTOR[5] for some help! SCSI, my disk is spinnin’ Like a FOR/NEXT, it never ends And it’s you, ][, makin’ it spin You’re making me SCSI !"
