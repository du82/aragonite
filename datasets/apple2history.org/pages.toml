full_description = "This table shows in an abbreviated format the approximate dates of product release and product discontinuation during the Apple II era. Generally, the left half of the table deals with the 6502/65816 Apple II series of computers (and the closely related Apple III), and the right half deals with the 680×0 Lisa and Macintosh series, and events outside of the Apple part of the personal computing universe. Each year is divided up into four lines in this table; so each year is divided up into quarters. Events shown as happening in the first quarter of a year refer to Jan-Mar, the second quarter Apr-Jun, and so on. For a product introduction, the top of the colored box where the name appears represents the date it was released. In the case of several revisions in the same product line, these models are designated in the same vertical box, but with a change in color. I want to thank Hisham Muhammad, and his Portuguese-language web site, Lode’s Land – Apple ][ Brasil for permission to use his excellent idea for creation of an HTML-based, colored timeline to display this geneology data. This is much better than the text-only version that I had displayed here previously!"
