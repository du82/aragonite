["https://www.apple2history.org/2012/09/23/the-apple-ii-guide-and-mark-twain"]
title = "The Apple II Guide and Mark Twain"
description = "Back in the late 1980s, Apple II developers and users were dissatisfied with the amount of attention that Apple as a company was devoting to the Apple II. Despite its position as the real breadwinn…"
full_description = "Back in the late 1980s, Apple II developers and users were dissatisfied with the amount of attention that Apple as a company was devoting to the Apple II. Despite its position as the real breadwinner for the company (the Macintosh was still struggling to support itself), the Apple II was not getting much corporate love or resources. Attendees to the first KansasFest (Apple II Developer’s Conference) in 1989 made a point of letting Apple know of this disparity. And Apple promised to make things better. It happened to some extent, but not to the extent that the Apple II community wanted. One of the things that did appear in the year after KansasFest 1989 was a publication from Apple (yes, they were $19.95, but many were given away for free) that specifically told anyone interested in the Apple II what that computer could do. The Apple II Guide first appeared in the fall of 1990, and provided information about the Apple II for users new and old. It had a historical timeline, explained the basics of the currently selling models (Apple IIe, Apple IIc Plus, and Apple IIGS), discussed productivity tools such as AppleWorks, hypermedia (featuring HyperCard IIGS), and the Video Overlay Card. It further discussed Apple II and Macintosh data exchange, troubleshooting, customer support, dealers (with a nation-wide listing of authorized Apple dealers in every state in the U.S.), talked about ProDOS and GS/OS 5.0, listed user groups and popular software, and even featured popular books, periodicals, and online services that could be used as Apple II resources. It also included capsule stories about how people who had Apple II computers were using them for business, education, and home use. Notice on the cover photo the various bits of Apple II paraphernalia and history that is displayed. We have a Woz-signature Apple IIGS, a photo of an Apple-1, a photo of kids using an Apple II (again, the focus on education that Apple had in their corporate mindset at the time), a copy of a button from the Apple II Forever event that launched the Apple IIc back in 1984, and a button from Apple’s “Kids Can’t Wait” program, in which they donated computers to schools."
year_published = 2012
year_updated = 2012
