["https://www.apple2history.org/2013/04/12/a-tale-of-the-disk-ii"]
title = "A Tale of the Disk II"
description = "Last year was noteworthy as the 35th anniversary of the release of the original Apple II. This year, 2013, has its own significant anniversary to commemorate. It was 35 years ago this coming July t…"
full_description = "Last year was noteworthy as the 35th anniversary of the release of the original Apple II. This year, 2013, has its own significant anniversary to commemorate. It was 35 years ago this coming July that the Disk II floppy drive was made available for the Apple II. As much as the Apple II was itself groundbreaking, the release of the Disk II was a similar watershed event in the history of Apple as a company and specifically for the Apple II. It is noteworthy that the keynote speaker at KansasFest for 2013 is Randy Wigginton, an important figure in the foundation of the Disk II and Apple DOS. As with most such events, there is back story that often does not get repeated. And though tech news usually does not pay attention to history, the Disk II was recently a topic of blog posts. CNET News posted a story about the origins of Apple’s first disk operating system, specifically the original DOS for the Apple II. The story came to light because of a donation made to the DigiBarn Computer Museum in Boulder Creek, California. Though Randy Wigginton created the core RWTS (read/write/track/sector) routines that interfaced with the disk drive, it was Paul Laughton who was the primary author of Apple DOS. Laughton recently donated some of his original papers about the project to DigiBarn. Specifically, he gave them copies of the letters between Apple and Shepardson Microsystems, for whom he worked, and also source code listings for the original versions of DOS that were delivered to Apple in June 1978. According to the story Laughton tells on his web site, he had a background working at IBM for a number of years, where he worked on all aspects of the operating system on the IBM 360 computer. This gave him a deep understanding of a how a computer should interact with various devices (telecommunications, disks, printers, and more). One of the first jobs Laughton did for Shepardson was to work on writing a BASIC interpreter for a computer that Apple was designing in early 1978, code named “Annie”. Though this project was eventually canceled, it did bring Laughton into contact with Steve Wozniak."
year_published = 2013
year_updated = 2013
