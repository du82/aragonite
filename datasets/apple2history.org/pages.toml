["https://www.apple2history.org/appendix/parodies/a2pie"]
title = "Apple II Pie"
description = "© 1992 Steven Weyhrich (Sung to the tune of “American Pie” by Don McLean) NOTE: To read these lyrics properly, the phrase “Two-E” refers to the “Apple //e” compu…"
full_description = "Dee March 19, 2011 Being only in my early teens back then, I actually read this parody in the GravenStein Apple Users Group’s big newsletter several years before I’d ever heard the song itself! Almost 20 years later, I still think of it whenever I hear the song on the radio; re-reading its references brought back a lot of fun memories of things I’d forgotten. Reply NOTE: To read these lyrics properly, the phrase “Two-E” refers to the “Apple //e” computer. It wouldn’t come out sounding right if I’d put “IIe” in it’s place; it might be read as “eye-eye-e”. https://www.apple2history.org/audio/apie.mp3 A long, long time ago, I can still remember how those programs Used to make me smile. And I knew if I had my chance, That I could make those users dance And maybe they’d be happy for a while. November breezes made me shiver With every upload I’d deliver Bad news on the desktop I couldn’t make the text stop. I can’t remember if I cried When I read about our faltered pride But something touched me deep inside The day the Two-E died. So, bye, bye to my Apple II pie Hooked my RamFAST to the SCSI[1] But the SCSI was fried And hackin’ boys drank Mountain Dew and sighed, Typin’ “This’ll be the day that I die. This’ll be the day that I die.” Do you know your Apple’s core? Do you have faith in Woz’s lore If the Red Book tells you so? Do you believe in ROR[2] and ROL Can BASIC save your mortal soul And can you tell me why Pascal runs so slow? Well, I know you love that Lisa hack ‘Cause I saw you mousin’ in the back Well, MacWrite[3] was big news But AppleWorks got great reviews, oooh I was a twenty-something computer fan With a loaned assembler and some program plans But I knew I’d be just an “also-ran” The day the Two-E died. I started singin’ Bye, bye to my Apple II pie Hooked my RamFAST [4] to the SCSI But the SCSI was fried And hackin’ boys drank Cola Jolt and sighed, Typin’ “This’ll be the day that I die. This’ll be the day that I die.”"
