["https://applevis.com/forum/accessibility-advocacy/innosearchai-accessible-shopping-flights-blind"]
title = "innosearch.ai (accessible shopping and flights for blind) | AppleVis"
description = "There’s a relatively new website called innosearch.ai"
full_description = '''By Ash Rein, 12 February, 2025 Forum Accessibility Advocacy There’s a relatively new website called innosearch.ai This website allows you to search for any product. And the results are aggregated using basically the entire web. Amazon, Walmart, Best Buy, and whatever third-party website beyond that. Anywhere that the product is sold will be shown. Add free with free shipping. Usually, they honor the fastest shipping possible (1 or 2 day). As mentioned, completely add free with no sponsored ad. All the relevant information is provided without any distractions or the extra fluff that you’ll find on Amazon or Walmart or Best Buy. Everything is marked with headings. This includes the product title, cost, description, reviews. There is also a section Where you can ask for more information about the product and it is provided quickly and in an accessible format. You can also track the shipping of the product you buy on the website. Returns are also free and completely accessible. Looking at, comparing, and purchasing Airline tickets around the United States is also available on innosearch.ai This is also made completely accessible. There is no need to actually sign up or login. However, that has its own perks and discounts. Prices are usually set at the lowest rates available. I have personally used the website multiple times to buy different things. I’ve bought Bluetooth keyboards, cologne, pants, and even cookies. All shipped quickly and arrived with no hassle. The couple of times I actually had to return Something was also very quick and easy. They are planning an iOS application. And of course, you can use a Windows based device to go on the website. They are also extremely receptive to feedback and encourage it. I think this is a great idea. It works well and simplifies the online shopping experience. If you haven’t tried it, I definitely recommend that you take a look. If you do have experience with it, I’d love to hear what you think. Options Log in or register to post comments Comments Very cool! By Kevin Shaw on Thursday, February 13, 2025 - 15:17 Thanks for this. I've signed up. Whoever did the accessibility for this really did their homework. One little focus bug when you type in the city for your flight. Focus bounces you out of the box and you have to navigate back, but not a showstopper. Haven't Used it Yet But... By Ekaj on Thursday, February 13, 2025 - 15:17 The Torpeys did an episode about this company not long ago. I forget the show number off the top of my head, but you can go to http://www.eyesonsuccess.net and search for it. Regarding Innosearch itself, I had a brief look at the site and I think it's a great idea. I'm excited for their app as well. Now that I think about it, this probably would've come in handy when a life-skills coach and I purchased an album by The Weeknd. But at the time I didn't think to try out the website. This is neat, but would prefer an app over the web site By Missy Hoppe on Thursday, February 13, 2025 - 15:17 I'm not sure why, but in most cases, I prefer apps over web sites. I've played around with the web site a little bit on my computer, but as a general rule, for some reason, it seems easier to use apps on my phone as opposed to web sites. I'll be eagerly anticipating an official innosearch app. If/when that becomes available, it'll probably become my go-to shopping app. heard about this By Tara on Thursday, February 13, 2025 - 15:17 Hi, I've heard about this on various podcasts. I've checked out the website and it looks pretty good. I haven't bought anything with it yet because I mostly use Amazon and their site is pretty accessible. I was particularly interested in the ability to purchase flights through it. I looked for flights recently here in Europe, and I found what I wanted. I'm interested in using this when an inaccessible platform I'm trying to use doesn't work with a screen reader. I'm thinking of airline websites in particular. The airlines I use have useable enough apps and websites. I'm looking forward to their app too. Web Wrappers By kool_turk on Thursday, February 13, 2025 - 15:17 These days apps are more like websites, so in most cases it would be pointless. Having said that, this site, for me at least, on iOS lags quite a lot. So having an app instead probably would be better. I guess it all depends on how they build the app. love this site By Alicia Krage on Thursday, February 13, 2025 - 15:17 I love this site, they get all of my time and money. I prioritize companies that prioritize us. First Purchase By Kevin Shaw on Thursday, February 13, 2025 - 15:17 I purchased some soap on the site to test out the purchase experience. It's very simple and straight forward and I was able to purchase using Apple Pay. The website performs really well in Safari. I also tested flight booking, even though I'm not going anywhere. I was able to set departure and arrival cities, passengers and dates in a very quick and efficient way using keyboard commands. I wrote a note to the team to tell them about my purchase experience and to give them a UI suggestion. I heard back and found out several of their team members have sight loss and are designing the site to solve the problems they (and by extension all of us) have with shopping sites. I'll definitely be supporting them where i can. How are they making money? By mr grieves on Friday, February 14, 2025 - 15:17 I've heard about this on Double Tap a few times, and it's possible they answered this question and it fell out of my old man brain, but how are they making money? It sounds like they are showing results from Amazon, and then you effectively get prime delivery and there's no mark-up. So where are they making money? Is it through affiliation or something? I did have a play with it but had this suspicion that it was all too good to be true and managed to scare myself out of actually buying something. Innosearch interview and how they make money By peter on Friday, February 14, 2025 - 15:17 Here is a link to the audio and show notes for the episode of Eyes On Success that featured an interview with the developers: 2445 Shopping Made Simple with Innosearch AI (Nov. 6, 2024) Show Notes Discover how Innosearch AI is revolutionizing online shopping for the visually impaired. Hosts Nancy and Peter Torpey talk with Patrick Long and Bryan Vuong, co-founders of Innosearch AI, about their AI-powered platform designed to make shopping easier and more accessible with a simplified interface and the ability to ask questions of the AI. As for how they make money, they are essentially the front end distributors for places like Amazon, Best Buy, Wal Mart, etc. and Innosearch essentially gets a few percent back from those companies. Sort of like how credit cards make money! There web site is very accessible and easy to use with a screen reader, they offer free returns on all items, and they are adding features and improvements all the time. If you sign up through the link on the Eyes On Success web site (www.EyesOnSuccess.net) you'll get a discount on your first order. --Peteand @peter By mr grieves on Friday, February 14, 2025 - 15:17 Ah OK - so must be like some sort of affiliate thing. I think with Amazon you can create an affiliate link and if anyone uses it then you get a small cut out of what they buy. OK maybe I will give it a go next time. Maybe we can invite them to come on this website and talk about By Ash Rein on Friday, February 14, 2025 - 15:17 I think it’d be great for them to get on here and talk more about the website and their plans. I could see this being very very useful for us not just now but in the future. I wonder if the applevis team would be interested in reaching out to them Not that I have any say in… By Brian on Friday, February 14, 2025 - 15:17 Not that I have any say in the matter, but that would make for an awesome podcast. :-) Another passionate user of the website By Rixon Smith on Friday, February 14, 2025 - 15:17 I also have been using this for the last few months. As to the last comment about a special podcast reach out through their website yourself and see if they will do that? They’re always looking for places to reach out to connect with the blind community. As to the question about how this has come to be one of the people who are doing the actual coding in creating the website is also blind. One of my favorite features for this website is the ability to use the AI itself to track down the absolute best deal of all the deals that pulls up. sounds stupid By Gokul on Friday, February 14, 2025 - 15:17 But is it available? Like everywhere in the world? Asking because there're many e-commerce platforms have country-specific varients like amazon.ca or amazon.in for instance. So how do they manage this? Sorry if it sounds stupid, and sorry for asking without first using the website. Replying to last comment By Rixon Smith on Friday, February 14, 2025 - 15:17 Considering that Jaws is the most versatile screen reader is not available everywhere in the world because it’s not available in China and other countries have to get it through various means so why would you ask such a question about a sight that specifically works with companies that are not everywhere in the world makes no sense to top it all off you criticize a company that specifically is working to make your life easier and dealing with websites that are so cluttered up with stuff that people can automatically see to get through that we have difficulty with because of screen readers. Please look at the website and hold your criticism. Current state By WellF on Friday, February 14, 2025 - 15:17 Currently, the site only works for the US and Canada I think. Regions By mr grieves on Friday, February 14, 2025 - 15:17 It is available in the US, Canada, Australia and the UK. There is a dropdown list at the top with a list of regions in it. Also I think the first answer to the question was unnecessarily harsh. I didn't read it as a criticism at all, just a question. And I think applevis should be a safe haven for asking questions without fear of reprimand. Appreciative but Skeptical By Michael Hansen on Friday, February 14, 2025 - 15:17 I like the concept of Innosearch and appreciate the efforts of anyone who wants to improve access for people with disabilities, but... I have some questions. Shipping time is a big one for me. I have an Amazon Prime membership for the shipping benefits, and obviously Innosearch doesn't tie into my Amazon account or Prime benefits. (I cannot imagine Amazon ever letting a company do this, so it just is what it is.) I also am a little hesitant about using a third-party company to place an order on a retailer's website, but I admit fully that this latter point may just be me. If Innosearch can partner with retailers to get customers the faster shipping options, I might be more inclined to use the services; but as it stands right now, I more see myself going directly to the retailer if I can make their website work. Michael Hansen By Gokul on Saturday, February 15, 2025 - 15:17 please, please, please don't be so roodly critical of a service that is making cluttered spaces accessible for you :P I mean, I don't know how people end up seeing criticism where it was not at all intended; I can understand them not having the time, attention span or whatever to read through and understand what was written; but why make remarks in that case? and anyway, even assuming that the nature of a comment was ccritical, who put a bann on such critical comments (albeit on a "useful" service) so long as that criticism is constructive? And while we're on the subject, I do believe that this website should expand to other regions of the world. I mean, I come from a country which is home to the 40% of the world's blind population. so, even if I were to mention the fact that it should consider expanding to my country, how is it bad? Off-topic but... By Gokul on Saturday, February 15, 2025 - 15:17 @Rixon Smith "JAWS is the most versatile screen reader"? Who says? On what authority? some thoughts By Tara on Saturday, February 15, 2025 - 15:17 I would love it if Innosearch was available in other parts of the world apart from just the UK, the US, Canada and Australia. So many useful services only end up being available in a few countries, most notably the US and the UK. It's a real shame because blind people around the world miss out on potentially beneficial services. iOS application is coming By Ash Rein on Saturday, February 15, 2025 - 15:17 From what I’m told, and iOS application is coming this year. I would actually say that it’s important to reach out to the website developers as they actually respond to all feedback, especially requesting that the service be made available in other countries. For right now, I would say that the website works best on the window side. Although the iOS side also works OK With some minor issues. I don’t know about android. Ultimately, I do think that if it gets popular enough, they will probably adopt a subscription model. Which I am not against. And if it. IllegallySighted did a vid on this By Brian on Saturday, February 22, 2025 - 15:17 Check it out here: https://youtu.be/FhyGGg6wHuU?si=ZP9ZzNR7E8n0NWZc Placed first order By mr grieves on Saturday, March 1, 2025 - 17:17 I've got to say - the web site is so much easier to navigate than Amazon. I was trying to find something to give me a couple more usb ports on the Mac and just got thoroughly lost and confused on Amazon - I had given up a couple of times. So thought I'd try innosearch and it was pretty good. I'll probably still end up with the wrong thing as I really have no idea but it was a good experience and it will be interesting to see how quickly it turns up. I looked at the email and it has a label saying "Estimated Delivery" but no actual date, and I can't find anything on the order about it. Still, not too fussed as long as it appears eventually. Delivery was free as well which was good. I'll definitely give the app a go when it arrives. Michael Hansen By Holger Fiallo on Saturday, March 1, 2025 - 17:17 Agree with him. This time. There is AI and email responses are good By Ash Rein on Saturday, March 1, 2025 - 20:17 There is an AI feature on the bottom of the page that allows you to ask it questions. You can literally ask it how many USB ports it has and it actually provides really worthwhile answers. Similarly, there is an orders page that lets you track the order and get the tracking number. Also, if you email them, they do give you the information pretty quickly. My experience on a Windows computer By SSWFTW on Sunday, March 2, 2025 - 13:17 My experience was quite good on a PC . Really enjoy the way that the website is organized and how simple it is to go through items by heading level. I have only ordered ones using the website the time I did I received the expected delivery notifications on the day of and did not receive an expected delivery tim'''
