title = "hooray for iOS 18.3 | AppleVis"
description = "somebody just sent me a text that included a picture of a poster. My SE 2022 read the whole poster beautifully. Just a few months ago, I wouldn’t have gotten the laugh that this poster created. Thanks, Apple."
full_description = '''By honest nan, 4 March, 2025 Forum iOS and iPadOS somebody just sent me a text that included a picture of a poster. My SE 2022 read the whole poster beautifully. Just a few months ago, I wouldn’t have gotten the laugh that this poster created. Thanks, Apple. Options Log in or register to post comments Comments Yeah, don't know when things… By Justin Harris on Tuesday, March 4, 2025 - 01:17 Yeah, don't know when things changed, but I've noticed descriptions being a lot better lately. It's rather nice. I find the iOS photo descriptions a lot better than the ones generated by apps like facebook, and would honestly prefer to skip the fb ones entirely and just get the ones generated by Voiceover. You can skip them By Yung Chris on Tuesday, March 4, 2025 - 11:17 Go to VoiceOver settings > Commands and assign a gesture to Describe Image. Now, when you perform that gesture, it’ll interrupt speech and give you an image description of the currently VoiceOver-focused item. You can also use this on non image items in any app. Ah, good to know. Thanks. :) By Justin Harris on Tuesday, March 4, 2025 - 14:17 Ah, good to know. Thanks. :) Dual use for three finger tap By Brian on Tuesday, March 4, 2025 - 15:55 I posted this a while back, but there is a pretty neat trick with the three finger single tap gesture on iOS. By default, three finger single tap will tell you where voiceover is relative to your screen. Interestingly enough, this is hardcoded into iOS, so you can change that and make the three finger single tap image description. However, if you tap and hold three fingers on the screen, you will still get the location info of voiceover focus. For example, if I am on my first home screen, and I focus on the camera app: 1. A three finger tap will give me, "an illustration of a cassette tape above text". 2. A three finger tap and hold ,will give me, "Group Camera row 2, column 3, Home, Page 1 of 2 Top of screen, Double tap to open". Just thought I would share that with the class. 🙂 Dude, I'm making that change… By Justin Harris on Tuesday, March 4, 2025 - 16:56 Dude, I'm making that change seriously as soon as I hit submit on this message. Thanks professor. :) Sure, no problem By Brian on Tuesday, March 4, 2025 - 21:56 I just wish the 4 finger single tap was the same way. I would love the 4 finger single tap at the top and bottom of the screen to be hard coded into iOS, so I could remap the 4 finger single tap gesture from the custom/touch gesture option, and still be able to jump to the top or bottom of the screen when needed. How do I achieve the same?… By TheBlindGuy07 on Wednesday, March 5, 2025 - 03:07 How do I achieve the same? This seems to be really really useful. I have image description turned on.'''
