description = "Founded in 2010 by David Goodwin, AppleVis is the go-to resource for blind, DeafBlind, and low vision users of Apple technologies. A proud member of the Be My Eyes family, AppleVis' mission is to empower people who are blind, DeafBlind, or who have low vision to access the maximum potential of Apple hardware, software, and services. What We Offer AppleVis offers a number of free resources to assist and empower blind, DeafBlind, and low vision users of Apple products and related applications:"
full_description = "Founded in 2010 by David Goodwin, AppleVis is the go-to resource for blind, DeafBlind, and low vision users of Apple technologies. A proud member of the Be My Eyes family, AppleVis' mission is to empower people who are blind, DeafBlind, or who have low vision to access the maximum potential of Apple hardware, software, and services. What We Offer AppleVis offers a number of free resources to assist and empower blind, DeafBlind, and low vision users of Apple products and related applications: App Directories Our App Directories provide a list of iOS, macOS, Apple Watch, and Apple TV apps tested for accessibility by members of the AppleVis community. This includes a listing of iOS and iPadOS apps developed specifically for people who are blind or who have low vision. Discussion Forum The AppleVis Forum is open to any and all Apple-related discussion. * In 2024, AppleVis expanded its forums to include new areas dedicated to Assistive Technology, Windows, Android, and Smart Home Tech and Gadgets. This decision followed a successful pilot project and was made in response to our growing community's diverse interests and needs. Many members had expressed a desire to discuss technology topics beyond our traditional Apple-centric scope but still relevant to empowering people who are blind, DeafBlind, or who have low vision. While Apple accessibility is our primary focus, these new forum areas allow our community to share their expertise on a wider range of technologies. Podcasts The AppleVis Podcast features community-submitted app demonstrations, interviews with developers, and a monthly Apple news round-up. More information on submitting a podcast for possible inclusion on the AppleVis Podcast may be found here. Blog The AppleVis Blog features both editorial content and news of interest to blind, DeafBlind, and low vision users of Apple products. Guides The Guides and Tutorials section contains a comprehensive collection of community-contributed articles that provide helpful tips, tricks, and step-by-step instructions on how to use various Apple products and related items. Hardware and Accessory Reviews The Reviews section provides honest and informative member contributed reviews of various hardware and accessories that can be used with Apple products. Get Involved The best way to contribute to our community is by sharing your knowledge on the forums, app directories, or through user-submitted content. Your insights empower fellow members to access the maximum potential of Apple hardware, software, and services. You can also help more blind and low vision Apple users discover our community by sharing links to AppleVis on your website, blog, or social accounts. Word of mouth is impactful too, so tell others about the support and information here. Together we can build an even stronger community of Apple enthusiasts who exchange expertise to enhance accessibility and support each other in getting the most from Apple technologies. About the AppleVis Editorial Team AppleVis is operated by a small team of both paid employees and dedicated volunteers. Our Editorial Team is responsible for ensuring the smooth operation of day-to-day functions of the AppleVis website, including content moderation. In addition, our Editorial Team creates content to inform the community about the latest developments in the Apple ecosystem, including blog posts and roundtable podcasts. To contact the AppleVis Editorial Team, please use our Contact Form. Members of the AppleVis Editorial Team Scott Davert Thomas Domville Dave Nason Tyler Stephen Geovanni Bahena Michael Hansen Follow AppleVis on Social Media Follow AppleVis on X Follow AppleVis on Mastodon Visit and like the AppleVis Facebook Page"
