title = "Audio Game Hub | AppleVis"
description = "Audio Game Hub is a set of eight experimental arcade videogames that use audio as their primary interface – making them accessible for both sighted and non-sighted users. Dive into a rich world of sounds and experience the unique collection of mini audio games. Close your eyes and let your imagination flow. Play in the casino, attend the medieval archery contest, escape the dark labyrinth, fight the finest samurai warriors and improve your memory at the animal farm. Play it on your smartphone, tablet or computer."
full_description = "Category Games Description of App Audio Game Hub is a set of eight experimental arcade videogames that use audio as their primary interface – making them accessible for both sighted and non-sighted users. Dive into a rich world of sounds and experience the unique collection of mini audio games. Close your eyes and let your imagination flow. Play in the casino, attend the medieval archery contest, escape the dark labyrinth, fight the finest samurai warriors and improve your memory at the animal farm. Play it on your smartphone, tablet or computer. Audiogames: - Slot Machines (Casino) - Archery - Hunt - Samurai Tournament (up to 4 player) - Samuari Dojo (up to 4 player) - Labyrinth - Memory (Animal Farm) - Blocks (Bejeweld) Think you can do it with your eyes closed? Version 1.1.3 Free or Paid Free Apple Watch Support No Device(s) App Was Tested On iPhone iOS Version 9.3 Accessibility Comments very accessible, and easy to use. Contrary to the opening statement, VoiceOver does not need to be disabled. VoiceOver Performance Not applicable for this app. Button Labeling Not applicable for this app. Usability The app is fully accessible without the use of VoiceOver Other Comments the sounds are well done, and the games, while easy, are a good time waster. App Store Link https://itunes.apple.com/us/app/audio-game-hub/id1101972684?mt=8 Developer's Website http://www.audiogamehub.com/ Developer's Twitter Username @audiogamehub Related Podcast https://www.applevis.com/podcast/episodes/introduction-audio-game-hub-2-ios Recommendations 32 people have recommended this appMost recently recommended by Piotr Machacz 1 year 3 months ago Options Log in or register to post comments Comments A problem I am having By lelia on Thursday, May 5, 2016 - 15:27 I noticed that when I try to double tap to select an option I can't do it it's like it's locked up or something. I am using an iPhone 6S with the latest update. So I guess I can't play the games and less other people have any tips. Thank you Fun game but have a suggestion. By JeffB on Thursday, May 5, 2016 - 15:27 Hi this is a fun game! Can you add a way to go back to different menus? For example if am playing one game there is no way for me to go back and pick a different game without closing out the app. using the scrub gesture would work well here. going back. By Faerie on Thursday, May 5, 2016 - 15:27 hello. to go back, you have to find the very left hand corner of the screen. it should say return. double tap their. if you double tap anywhere else it won't work. it takes some getting used to but it works eventually. as for the double tapping, where are you when you try and it fails? i am also on an iPhone six with the latest iOS Thanks By JeffB on Thursday, May 5, 2016 - 15:27 Got it thanks still wish it was a scrub. lol same By Faerie on Thursday, May 5, 2016 - 15:27 same. in general actually i wish the double taps could be less precice. love this By Ornella on Thursday, May 5, 2016 - 15:27 I love this app very much. I know I wil have fun. 1 question about the casino table how to get it to say what's on the wheels after I pull the handle? it's through the sounds. By Faerie on Thursday, May 5, 2016 - 15:27 listen to the sounds. their should be one to the left, one middle, and one right. those represent the symbols. if the sounds match, or if their is a slightly longer chord like sound, you will win. hope this is helpfull. A great game By David Standen on Thursday, May 5, 2016 - 15:27 I really love this game. I have only tried the blocks, memory game and labyrinth so far but plan to try the others very soon. very neet concept By Joseph on Thursday, May 5, 2016 - 15:27 very neet concept. I wanna se more games like this. You answered my question. Thank you By lelia on Thursday, May 5, 2016 - 15:27 In reply to going back. by Faerie When double tapping then you have to double tap right where you need to double tap you can't tap like in the middle of the screen or anything like that if I have that right thank you score uploading issue By HarmonicaPlayer on Thursday, May 5, 2016 - 15:27 when I went to where you can upload your high scores to the audiogamehub.com site it says page don't exist:( thanks By Ornella on Thursday, May 5, 2016 - 15:27 this helps. I like how they have a few games to choose from. I like the casino table memory, blocks. and I have to learn the rest of games. I hope to get more games like this in the future. My favorites are By DMNagel on Thursday, May 5, 2016 - 15:27 Archery, hunt, samurai tournament, samurai dojo and labyrinth so far. Same as DMNagel By tunmi13 on Thursday, May 5, 2016 - 15:27 I've played only the same games that DMNagel has said. I like the Samurai Dojo one, that's cool. Also the labyrinth is a really creepy game, you can hear monsters and stuff, it's crazy. And the hunt one is cool, the raccoon almost escaped from me, but with my handy bow I shot it. So this is a great app, and also, it's free!! No in-app purchases. the memory game By Ornella on Thursday, May 5, 2016 - 15:27 when I reach down to the last 2 boxes to open, it sometimes won't move. I just hear the tapping sound. I hope it could be fixed sometime. I also like archery My demonstration By tunmi13 on Thursday, May 5, 2016 - 15:27 I've created a demonstration of all games. Click the Dropbox link to listen to it. Dropbox Link: https://www.dropbox.com/s/22pni6u5c3fnu4s/Audio%20Game%20Hub%20Demo%20All%20Games.mp3?dl=0 Recording Duration: 1 hour, 3 minutes, 14 seconds I'm experiencing the same issue By David Standen on Thursday, May 5, 2016 - 15:27 In reply to the memory game by Ornella I am also experiencing the same issue with the boxes. On the whole, though, this is a cool little collection of games. It would be cool if more titles could be added in the future. Anyone who won the archery game yet? By DMNagel on Thursday, May 5, 2016 - 15:27 The end seen is quite funny. I got By Igna Triay on Thursday, May 5, 2016 - 15:27 I got to the final round of the archery contest, but I didn't make it. Will continue trying though. By the way, has anyone managed to beat the samurai dojo? It is very hard, I mean, the game is simple enough, the hard thing is tapping as fast as you can. Lol. my thoughts By kool_turk on Thursday, May 5, 2016 - 15:27 Samurai tournament is kind of pointless. All it does is test your reaction. Wait for the sound, then tap the screen. Dojo on the other hand is a bit more tricky, cause you need to tap the screen a certain amount of times within the alotted time. Archery is just like audio archery by l-works, only this one is a little different. The concept is the same, only different scoring and the target doesn't only move from left to right. Hunt is easy once you get use to loosing your arrow when the beeps are fast enough, the animals don't need to be in the exact centre. Memory is fun, while blocks, I found to be confusing. I couldn't manage to get out of the laberinth yet, but I will eventually come back to that one eventually. I'm trying to finish the archery tournament. I can make it to the finals, but keep bowing out when my target score is 24, 25. The casino is based on luck so I didn't spend much time playing that one. I also had the same issue when trying to post my score. I just did a podcast on the By KE7ZUM on Thursday, May 5, 2016 - 15:27 I just did a podcast on the game. You can check the feed at feeds.feedburner.com/tffp I also had the same trouble when posting the score. Blocks was easy, memmory was a bit harder, the maze was driving me nuts. Archery was easy, hunting I didn't quite get. And I was kind of having fun with the slots. Have fun. Yes i finished the dojo. By DMNagel on Thursday, May 5, 2016 - 15:27 The end boss doesn't say how many hits are required, but i guess it's between 360 and 365. I just managed to get a little over the limit with 371. I'll have to try that game By KE7ZUM on Thursday, May 5, 2016 - 15:27 I'll have to try that game out. I didn't do it as I wanted to keep the demo very very short, like under an hour lol! I clocked in at 38 minutes 45 seconds for the 5 games I demoed. Take care all and have a hppy Monday. I also beat him By David Standen on Thursday, May 5, 2016 - 15:27 Yes, I also beat him. It's challenging, but fun. Great app! By Clare Page on Thursday, May 5, 2016 - 15:27 Hi! After reading about Audio Game Hub here yesterday, I decided to install the app, and I'm glad I did. I've tried out all the games except Labyrinth and the two samurai games, and I like them all, even though I'm definitely better at some than at others: for example, I could say that animals are relatively safe from me in the hunting game, given the amount of times I miss them! As was pointed out above, the positions of buttons and other objects on the screen in these games can be very precise, but playing these games fairly regularly should help me get used to that. I have not tried posting high scores yet, but here's hoping my high scores from yesterday are saved when I reopen the app so I know in future whether I've beaten them or not. Boss By tunmi13 on Thursday, May 5, 2016 - 15:27 Boss has 360 hits. The disciples have 30, 60, 120, and 180 hits. yep By Joseph on Thursday, May 5, 2016 - 15:27 Yep. so the double basically wit heach one. I would've loved to see what would've happened if the devs had taking the original number, say for ecample 30, and squared it, then the next one up and so forth. THat would be a hell of a challenge. hope it can have more and more games to come By ming on Thursday, May 5, 2016 - 15:27 hi! all, all I can say it's agreat app. and I hope it can have more types of games comming. for example shooting zombi, fighting with monstor ... esectra. I actually got a high score By KE7ZUM on Thursday, May 5, 2016 - 15:27 I actually got a high score of 5555 on blocks. I kid you not. That was not recorded as that was played at like 2 am this morning. Still though it was fun. A cool thing for hunting game By tunmi13 on Thursday, May 5, 2016 - 15:27 There should be something where there is multiplayer on that hunting game and you must try to hunt all the animals before the other ferson does or something like that that would be cool. Another thing, in the Samurai Dojo, I wish there are actual fights and if you give the person 30 hits they are defeated or something instead of tapping as fast as you can, but that could be an option. And there is realistic sound to go with the battle, and you can block by holding two fingers down on the screen or something. But I don't know if all of this is possible. Hi Tunmi By Ornella on Thursday, May 5, 2016 - 15:27 That would be nice but maybe you could contact the developers and give your suggestions. I was checking for reviews on the app store but there wasn't any. Yeah I'll do that By tunmi13 on Thursday, May 5, 2016 - 15:27 Yeah I'll do that, otherwise I wonder if the developers are even on the AppleVis site. Glad i downloaded this!! By TamagotchiTune on Thursday, May 5, 2016 - 15:27 This is fun!!!! Memory is the hardest game for me though. Lol. But I like playing all these games. the memory game By Ornella on Thursday, May 5, 2016 - 15:27 I don't like when sometimes I double tapping on the boxes and it not opening. Same problem with Memory Game By Clare Page on Thursday, May 5, 2016 - 15:27 I have the same problem with the Memory game in Audio Game Hub, namely that I tap the boxes as instructed but they don't always open sstraight away. I assume that each box is very precisely positioned, so we need to tap exactly the right point on the screen to get each box to open: it can take patience sometimes, but thankfully there is no time limit on this game as far as I can tell, so, if it takes a bit longer to open a box than I thought it would, that's definitely not a deal-breaker for me. Same thing here By tunmi13 on Thursday, May 5, 2016 - 15:27 That's why I stopped playing that game ever since the boxes wouldn't open when I double tapped on them. I had to like double tap three times to get one of them open. And I wish the app spoke the row the box is in so then could easily determine if the box is on the left or right side of the screen. For the boxes to open By Igna Triay on Thursday, May 5, 2016 - 15:27 For the boxes to open, you have to tap in the exact spot where the box you want to open is. that's what i By Ornella on Thursday, May 5, 2016 - 15:27 That's what I did. But I'm thinking that the boxes move. I only have that problem coming down mainly to the end where there might be the last 2 to open. Actually the boxes have a By KE7ZUM on Thursday, May 5, 2016 - 15:27 In reply to Same thing here by tunmi13 Actually the boxes have a pitch to them so you can tell where you are. The higher the pitch the higher on the screen you are. And there is a time limit. I hit it on 20 boxes. Lol! boxes By Faerie on Thursday, May 5, 2016 - 15:27 In reply to Actually the boxes have a by KE7ZUM also you can hear whether they're right or left on the screen if you are using head phones. i keep getting stuck on twenty boxes as well. I do that qoo By tunmi13 on Thursday, May 5, 2016 - 15:27 I do that too I tap in the exact spot but still doesn't work I'll have to keep trying and the blocks game is pretty fun too, you have to put the same boxes in the same slot in three rows. I got stuck on By Igna Triay on Thursday, May 5, 2016 - 15:27 I got stuck on 24 boxes. Ironically, I managed to finish the level, but time ran out. I get stuck By Joseph on Thursday, May 5, 2016 - 15:27 I get stuck on the labyrinth all the time. the sound you're supposed to follow isn't in mono and not all that loud to begin with, so it's challenging to say the least. still fun though. stuck on By Ornella on Thursday, May 5, 2016 - 15:27 I got stuck on 24 boxes as well when the time ran out. Yeah, the funny thing was By Igna Triay on Thursday, May 5, 2016 - 15:27 Yeah, the funny thing was that I had already opened the last box. Perhaps I did it too late? No clue By tunmi13 on Thursday, May 5, 2016 - 15:27 No clue, but I'm on 16 boxes now. link to the mac version By destructatron on Thursday, May 5, 2016 - 15:27 please can you give a link to the mac version of this app. Try looking at their website. By KE7ZUM on Thursday, May 5, 2016 - 15:27 Try looking at their website. It is I think listed in this thread. There is no mac version, you some how play on their website via a web interface, or so I read on the app description. No online play By David Standen on Thursday, May 5, 2016 - 15:27 I just checked their website. You cannot play online. As well as IOS, the game is available for Windows And Android. I think By Ornella on Thursday, May 5, 2016 - 15:27 I think someone posted a link of the game version for a mack. but it isn't in this thread Pagination Page 1 Page 2 Page 3 Next page Last page"
