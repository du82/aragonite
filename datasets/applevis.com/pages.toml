["https://applevis.com/apps/ios/games/dice-world-play-friends"]
title = "Dice World® Play with Friends | AppleVis"
description = "DiceWorld® voted Game of the Year by AppleVis.com! 6 great dice games in a friendly gaming community for everyone to enjoy! As always it is completely accessible to the visually impaired, allowing EVERYONE to play on a level playing field! #everyoneplays! The fun going viral around the globe! Join in and meet new people while playing new dice games! Includes Farkle, Yatzy, Pig, Threes, Balut and 1-4-24! Easy tutorials for all games!"
full_description = '''Category Games Description of App DiceWorld® voted Game of the Year by AppleVis.com! 6 great dice games in a friendly gaming community for everyone to enjoy! As always it is completely accessible to the visually impaired, allowing EVERYONE to play on a level playing field! #everyoneplays! The fun going viral around the globe! Join in and meet new people while playing new dice games! Includes Farkle, Yatzy, Pig, Threes, Balut and 1-4-24! Easy tutorials for all games! Play friends, play tournaments, play funny computer players, play online or offline, play however and whenever you want. On YOUR schedule! Key Features: • Daily Tournaments! • Turn based game play. There is no need for both players to be online at the same time. • Leaderboards – Are you good enough to make it onto the worldwide leader board? Represent your country! • Chat with your friends during game play! • Offline? No problem - play some games against the computer opponents to hone your skills! • Detailed help for each game to help new players get up to speed. We are constantly improving this game. Our goal to provide the best dice gaming experience available. Give it a try!! We look forward to you joining us in Dice World! The AppA11y End User License Agreement (EULA) can be located here: https://www.appa11y.com/Terms.htm And our Privacy Policy is located here: https://www.diceworldgame.com/helpupdate/privacypolicy.htm Version 19.02 Free or Paid Free With In-App Purchase Apple Watch Support No Device(s) App Was Tested On iPhone iOS Version 15.5 Accessibility Comments As far as game play goes, this app is fully accessible with voiceover reading all buttons, Country flags for you and your apponent are shown but not spoken. VoiceOver Performance VoiceOver reads all page elements. Button Labeling All buttons are clearly labeled. Usability The app is fully accessible with VoiceOver and is easy to navigate and use. Other Comments If you enjoy dice games, you'll enjoy dice world. This app has been updated and works great with voiceover. the rules and help for each game are very easy to understand. Unlike IFarcle and similar games, with dice world you are playing human opponents. Many folks on applevis play dice world so ask any question if you should have issues figuring out how to play. App Store Link https://itunes.apple.com/us/app/dice-world-farkle-yatzy-balut/id553269986?mt=8 Developer's Website http://diceworldgame.com/dw/ Developer's Twitter Username @Dice_World Recommendations 39 people have recommended this appMost recently recommended by Michael Hansen 2 months 1 week ago Options Log in or register to post comments Comments Accessibility By Tara on Tuesday, March 5, 2013 - 15:16 I agree with everything Ryan has said in his previous post. This is a fun game with a few little issues. I have actually been corresponding with the Developers and they have asked me to test upcoming releases. Ryan if you are interested in helping with this let me know so I can give them your email. Anyone else interested in helping please contact me as well. I can be found on Twitter @tarafair App slow on iPhone 4 By blusword on Tuesday, March 5, 2013 - 15:16 I have the version with the advertisements on it, still. I am finding the app to be slow as though it is hanging up. Is it because of the ads? Thanks. Sometimes I did find that the By ryan perdue on Tuesday, March 5, 2013 - 15:16 Sometimes I did find that the add slowed things down, depending on which add it was. advertisements thank you By blusword on Tuesday, March 5, 2013 - 15:16 In reply to Sometimes I did find that the by ryan perdue Hello again, Thank you for letting me know that you have had lag issues with the app because of the advertisements. I would be interested in helping to beta test the game too. Going to fix those adverts and buy the app. Game is gone By AnonyMouse on Tuesday, March 5, 2013 - 15:16 Not certain why but it has appeared that this game is now has been removed from the App Store. There are no indications of why it has been removed on the developers site. So I will try to contact the developer and see what happend. Minor Glitch and Will Return Soon By AnonyMouse on Tuesday, March 5, 2013 - 15:16 In reply to Game is gone by AnonyMouse The developer of Dice World was very quick in getting back to me. Here is what they had to say why it was removed from the App Store. "We had a major technical issue that was causing issues for new players. We had to pull the game to get it fixed. The new version has been submitted to Apple.. And we are just waiting for them to release. Sorry for the hassle." No hassle with me! ;) Just glad to see this had a minor glitch and will be returning to the store soon. So I will let everyone know when this is back up in the store. Dice World By Lino Morales on Tuesday, March 5, 2013 - 15:16 I think Apple pulled the app from the the app store. Wife told me about it a couple of days ago, but I didn't see it their. Its a shame. Previous Comment By AnonyMouse on Tuesday, March 5, 2013 - 15:16 In reply to Dice World by Lino Morales Not certain if you hadn't read Comment #6 that I left? In a nutshell the developer of the game had to pull their app out of the store. So it wasn't Apple that pulled it. It was pulled to a major glitch with the logon. This has been corrected and they are currently waiting for Apple to approve the app for its return. So I am excited about it. We have also discussed about seeing how we can improve this app. So hpefully this will happen as I really love this game. diceworld By ryan perdue on Tuesday, March 5, 2013 - 15:16 Yes, definitely don't give up on dice world, I received a smimilar note on why the developers pulled the app. There are loads of people playing and the developers are very responsive and really want everyone to have a level playing field. Back By Tara on Tuesday, March 5, 2013 - 15:16 DiceWorld is back in the App. store. Hopefully those of us who are signed up to help the developers will have some good news as far as new VO fixes. new version issues By ryan perdue on Tuesday, March 5, 2013 - 15:16 In reply to Back by Tara having major error issues on the update, they are definitely trying to work out bugs. message from developers on fb By ryan perdue on Tuesday, March 5, 2013 - 15:16 In reply to new version issues by ryan perdue If you have installed the update and you are getting an error about your roll not being submitted, un install the app and just install again, acording to dice world's fb page, this will fix the problem. Developer notes. By Tara on Tuesday, March 5, 2013 - 15:16 If you get a message when trying to play a game saying, something to the effect you need to resubmit your roll again, but you get an error doing so...then you will need to uninstall and reinstall...the­n things should be cleaned up. We are putting in some code to catch network errors and didn't get a chance to test it as fully as we should have due to the Facebook issues that came up. Anyway, uninstalling and reinstalling should fix it. Thanks for sticking with us! Is it available for Ipad? By Maya on Tuesday, March 5, 2013 - 15:16 In reply to Developer notes. by Tara Hi to all. Please is this game available for Ipad as well? I have read in the app store that Ipad user can play it. My friend, who has Ipad, cannot find it in the app store for some reason. Thank you for your help in advance. on iPad. By Faerie on Tuesday, March 5, 2013 - 15:16 I play it on an iPad. It works fine. I think this app was temperarily removed from the App Store, but now it is back. Also, your friend may check when searching for this app if the "Iphone apps," button is checked in the App Store when searching. Has anyone played Yatsi? I don't understand. Yahtzee on dice world By ryan perdue on Tuesday, March 5, 2013 - 15:16 In reply to on iPad. by Faerie I do play Yahtzee on there I'm using an ipod tuch 5th gen What are you having issues with, hopefully I can help yatsi By Faerie on Tuesday, March 5, 2013 - 15:16 I don't really understand the screen layout. Good things on the way! By Dice World on Tuesday, March 5, 2013 - 15:16 Hi Everyone. First off I would like to say thank you for the tremendous support that some of you have given us in testing Dice World. We are really excited about improving the accessibility of the game. Our goal is to make the playing field between sighted and non sighted players completely level. There will be an update coming out in the next week that has some pretty good voice over upgrades for Farkle. We really hope you like it. Also, we are currently working on improving Pig and Yatzy. Those will be out in about 2 weeks. Balut is a bit tough.. but we will figure it out very soon. If you have any comments or suggestions, free to reach out to me at [email protected]. We read every e-mail.. and take all ideas seriously (even the dumb ones). Thanks.. and keep on Dice'n! Dice World Removing Ads By Kelly Sapergia on Friday, April 5, 2013 - 15:16 I just started playing this game, particularly the version of Farkle, and so far really like it. However, I'm wondering if there's a way to get rid of the ads? I found a button somewhere that said "Remove Ads", but it didn't seem to do anything when pressed. Kelly. They charge $1.99 US By Lino Morales on Friday, April 5, 2013 - 15:16 Kelly. They charge $1.99 US as in app purchace to remove the adds. Upgraded to Ad-Free Version By Kelly Sapergia on Friday, April 5, 2013 - 15:16 Thanks for the message. I had a feeling an in-app purchase was involved, but couldn't get the button to work propperly. When I pressed it, another button would activate or something, so I'm assuming it was somehow obscured by an ad. The only way I got it to work was to press the Messages button, or at least the button next to the word Messages, then it worked after closing that screen. Regardless, I'm glad I paid for the upgrade. Version 2.2 By AnonyMouse on Friday, April 5, 2013 - 15:16 This Version is about 90% accessible and the next version that is coming out will be 100% accessible. I absolutely love this game. It is addictive and a lot of fun. So if you want a great dice game. This is a must have! What's New in Version 2.2Feedback Forums! Give us your ideas from within the game!Chat Fixes!Voice Over improvements for Yatzy and Pig! Some interesting issues By ftealucard on Friday, April 5, 2013 - 15:16 In reply to Version 2.2 by AnonyMouse Hello all I got myself and my girlfriend accounts and we atempted to play each other in pig. I've been noticing however that after someone ends their turn, a few things may happen. The game will continue normally, display an add and then let us continue or: 1. Everything seems to disappear on the screen and VO can't find anything but the status bar. Once the app is closed and restarted, the next turn can be taken. 2. Most offen, the next turn appears but no buttons will click. VO states they are not dimmed. The practice mode works fine however. Will this game let players take turns instantly or must each player wait some time between turns? My GF just picked up an iPhone tuesday and she is looking for some free games. Hope we can fix these issues, has anyone else had them? We are both using the 4s. These issues also occur when playing anyone else online, at least on my phone. Otherwise, pretty awesome games, considering they are free. Thanks again to the developer for taking the time to make these games accessible. All we need now is a collection of uno/crazy eights etc. The problems with buttons and things By Faerie on Friday, April 5, 2013 - 15:16 In reply to Some interesting issues by ftealucard I have experienced those problems as well, and I think i can help with one of them. When no buttons will click, there is an add in the way, usually a link. You can either remove the adds, or click the link that will take you to the app store and then go back to the app. I don't know why the status bar thing happens, maybe its an add too? Anyway, I hope that helps. Great app! By Clare Page on Friday, April 5, 2013 - 15:16 In reply to The problems with buttons and things by Faerie Hi! I've had DiceWorld for quite a while now, the free version at first, then the paid one as the ads were annoying me. For me, closing the free app between turns lessened the annoyance of the ads a bit, but it didn't take me long to decide to get the paid version of this app.. I play all four games in this app these days: Balut was unfamiliar to me, but it's based on Yahtzee, with less categories but fore places to fill in for each one. As for the accessibility of this app, it's definitely improved for all the games except Balut, but I can understand why that's harder to work on as the layout is more complicated than ordinary Yahtzee. DiceWorld is definitely one of my favourite IOS gaming apps these days, that's for sure! Version 2.3 By AnonyMouse on Sunday, May 5, 2013 - 15:16 The game is now completely accessible. The only thing I have found that you won't be able to see are the country flags that your opponents are from in the Stats page.What's New in Version 2.3Critical Facebook Authentication Fix.Improved Facebook integration.Huge performance fix!Additional Voice Over Support!Option to turn Voice Over Farkle Hints off!Bug Fixes The information about By Cliff on Sunday, May 5, 2013 - 15:16 In reply to Version 2.3 by AnonyMouse The information about accessibility given in the description above should absolutely be updated, since the app has gone through some vast changes accessibilitywise since it was originally posted. Just saying... ;) Dice World Yahtzee By Chris Chaffin on Sunday, May 5, 2013 - 15:16 In reply to The information about by Cliff I love Dice World and all of the games, but I am just having a hard time figuring out the layout of the Yahtzee game screen. If anyone could help explain the Yahtzee screen layout I would appreciate it. kind of a pain to use with braille By Scott Davert on Sunday, May 5, 2013 - 15:16 I'm actually finding that the lay-out of this app leaves a lot to be desired. Wouldn't it make more sense to have all the dice in a row next to each other instead of scattered around the screen? It would be nice to be able to just flick left and right to monipulate the dice. email their support By patrick kelly on Sunday, May 5, 2013 - 15:16 In reply to kind of a pain to use with braille by Scott Davert Seeing as I don't have a display, email their support address at [email protected]. The guy's usually pretty responsive to VO suggestions and as far as I know accepts testers for upcoming betas. Suggestions and Advice By AnonyMouse on Sunday, May 5, 2013 - 15:16 Hello Chris and Scott, I do have a podcast on this game that goes in to details how the layout works if you like to listen. It can be found here on AppleVis at: http://applevis.com/podcast/episodes/dice-world-fun-and-addictive-dice-game-family-and-friends Think of the Yahtzee page in three columns. The left side is your side. Your opponent is on t'''
