description = "Accessible iPhone, iPad, Mac, Apple Watch, and Apple TV apps for blind or low vision users"
full_description = "At AppleVis, we seek to simplify the search for accessible apps for Apple devices, including iOS, iPadOS, Mac, Apple Watch, and Apple TV. Browse and search our app directories, get recommendations from others, and discover iOS and iPadOS apps honored in our Hall Of Fame. Browse View the latest App Directory Entries Latest iOS/iPadOS apps Latest Mac apps Latest Apple Watch apps Latest Apple TV apps Browse by Category Browse iOS/iPadOS apps by category Browse Mac apps by category Browse Apple Watch apps by category Browse Apple TV apps by category Browse by Name Browse iOS/iPadOS apps by name Browse Mac apps by name Browse Apple Watch apps by name Browse Apple TV apps by name iOS and iPadOS Apps Developed Specifically for Blind or Low Vision Users Here is our list of iOS and iPadOS apps which have been developed specifically for blind or low vision users Search Still haven't found what you are looking for? Then try one of our Advanced Searches: Search the iOS/iPadOS App Directory Search the Mac App Directory Search the Apple Watch App Directory Search the Apple TV App Directory App Recommendations Whilst browsing the iOS & iPadOS App Directory, we encourage all registered site members to flag the apps that they would recommend to others. These are apps that are not only accessible, but are also very good at what they are designed to do. View the latest app recommendations View the most recommended apps Hall of Fame The AppleVis iOS & iPadOS App Hall of Fame is where we acknowledge and celebrate the apps that exemplify all that is great about owning an iOS or iPadOS device. Visit the Hall of Fame Additionally, we stage an annual award for the “AppleVis Golden Apples” that seeks to provide an opportunity for blind and low vision users of Apple products to recognize and acknowledge the hard work and dedication which developers have put into making and maintaining great and accessible applications over the given year. You can view the complete list of Golden Apple award winners here. Reporting inaccessible apps to developers We encourage you to reach out to app developers if you experience any accessibility issues. Developers are usually responsive to polite and clear requests for accessibility improvements. For effective communication with app developers regarding accessibility issues, we suggest you provide the following information: Briefly describe the problem Indicate the frequency of the issue (e.g. always, sometimes, rarely) Outline the steps to reproduce the problem Specify your desired outcome after taking the steps Explain the actual outcome after taking the steps Provide information on your device and software Consider including a screen recording of the issue (if possible) in your email."
