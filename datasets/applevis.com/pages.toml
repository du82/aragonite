full_description = '''Hardware & Accessory Reviews Displaying 1 - 20 of 188 Filter by tag - Any -Bluetooth KeyboardsBluetooth or AirPlay SpeakersBraille DevicesCasesMiscellaneousSpeaker DocksWired headphonesWireless headphones/Earbuds Belkin Auto-Tracking Stand Pro with DockKitPosted on Saturday, September 28, 2024 by kevinchao89A friend who is also blind told me about this really cool accessory that can auto-track ones face, which is excellent for blind people who are needing to do selfies or video meetings. Belkin Auto-Tracking Stand Pro with DockKit has been out for a bit, my friend got it first, I tried it at his house, then I got one for myself, and have used it for both video meetings and selfies. …0 comments : last update or comment 5 months ago JLab Go Air Pop True Wireless Earbuds: Great and InexpensivePosted on Tuesday, September 10, 2024 by divakitty418 Introduction I have had the JLab Go Air Pop earbuds for over a year and a half now, and they are amazing, especially for something that costs only around $20 or $30! I typically use them for listening to music, and it's a very good experience! What really stood out to me in these earbuds were their long battery life, three different sound settings, and the magnetic charging case that actually comes with a USB cable built-in! Physical Description Since these are true…0 comments : last update or comment 5 months 3 weeks ago Orbit Writer custom case review from turtle back Posted on Monday, July 1, 2024 by Dennis LongThis case is designed so you don’t have to remove the writer for any reason other than if you had to send the unit in for repairs the top compartment is made of a stretchable material that will fit a charging cable. Note it will only fit the charging cable and not a charging cable and charger block. For best results I would recommend using a wire tie to tie up your cable. An example of wire ties you could use can be found at the following link. …4 comments : last update or comment 8 months ago The Humanware NLS eReader: a free braille device available only to patrons in the USPosted on Wednesday, April 10, 2024 by Scott DavertThe following review is an adapted version of this evaluation to suit the AppleVis website. You can read the full review on the Technology, Research and Innovation Center's Blog The linked expanded evaluation includes a comprehensive review of the internal applications and how well the device works with other screen readers not within the Apple ecosystem…9 comments : last update or comment 10 months 2 weeks ago Seleste Smart Glasses ReviewPosted on Friday, April 5, 2024 by emasseyHardware The Seleste glasses feel similar to regular sunglasses, except that the arms are thicker to hold the electronics, and there is a small camera right between the eyes. There are also two buttons on the right arm, and a touchpad on the right arm near the hinge. Both arms have a wide and thick part near the front, and a significantly narrower part resting above your ears that curves at the end. In addition, there's a speaker built in to the right arm. The glasses come with a protective…17 comments : last update or comment 10 months 2 weeks ago Bose Ultra Open Earbuds Review: A Compelling Offering for Those Who Prioritise Environmental Awareness, but at a PricePosted on Saturday, February 24, 2024 by David GoodwinWith the release of the Ultra Open Earbuds featuring an unconventional open-ear design that attaches around the ears to let in environmental sounds, vital for situational awareness and spatial orientation for blind users like myself, Bose offers an intriguing alternative to other open-ear buds like Sony's LinkBuds, bone conduction headphones such as…7 comments : last update or comment 1 year ago Speed dots tactile screen protector review. Posted on Wednesday, January 3, 2024 by Kushal SolankiHi guys. I recently purchased the tactile screen protector by speed dots. Speed dots is a company that makes tactile screen protectors for iphones and Ipads. There are 3 types of screen protector layouts. The standard layout which has dots on all the keys of the keyboard as well as standard iphone controls. The advanced layout which has dots on F and J keys as well as the standard iphone controls. The phone keypad layout which is used when your using the…0 comments : last update or comment 1 year 2 months ago Amazon Echo Frames, Third Generation. A Review from a blindness perspectivePosted on Monday, January 1, 2024 by DrewWeberI’ve had the echo Frames third generation from Amazon for a couple weeks now, and I can confidently say they have changed the way I go about my day to day life. When you haven’t yet lived with something, it’s hard to understand living with it. If you were to tell me, well, you have Alexa wherever you are, I wouldn’t really grasp that, as generally speaking I haven’t lived with Alexa in a wearable. As I have now done so, I don’t think before asking Alexa something. It’s become, automatic.…4 comments : last update or comment 1 year 2 months ago my review of the tribit XFree tune headphonesPosted on Wednesday, December 13, 2023 by TroyThis is my review of the tribit xfree tune headphones. I bought these through the harbolt company as he seems to be the only one carying them right now, everyone else was sold out. Not sure if these have been discontinued? Wireless Audio to Amplify Your Life! Superior HI-FI Sound These over ear headphone deliver true stereo HD sound with rock-solid bass and super-crisp treble. The dual 40mm drivers and extended frequency range bring you the best music experience…0 comments : last update or comment 1 year 2 months ago Universal adjustable neck and cross body nylon phone lanyardPosted on Sunday, November 5, 2023 by TroyYou can get this from the harbolt company. If you can get this at other places please feel free to let me know. I haven’t had much experience with this yet but it’s not as bulky as the silicone one with the small card pocket. I'll provide my experience so far and what I know about it. It comes with an adhesive patch and a lanyard. The adhesive patch is rectangular shape. Attached to the top of the patch is a plastic ring. This is where you attach the included lanyard. It…9 comments : last update or comment 1 year 3 months ago Sleep Headphones & Sleep Mask & Bluetooth Headband 3 in 1Posted on Friday, September 22, 2023 by TroySleep Headphones & Sleep Mask & Bluetooth Headband 3 in 1: Bluetooth sleep headphones feature a headband design with wireless headset inside, allow you to enjoy hands free music, and protect you from being disturbed by your mess hair and sweat. Wireless sleep headphones is perfect suitable for nap, air travel, gym, workout, running, yoga as well as sleeping. Ultra Thin Speakers, Perfect Sleep Headphones for Side Sleepers: Bluetooth Headband built-in 2 ultra-thin speakers,…0 comments : last update or comment 1 year 5 months ago the tribit stormbox blast bluetooth speakerPosted on Friday, June 16, 2023 by TroyThis is my review of the tribit storm blast box bluetooth speaker. This bluetooth speaker goes for $199.00 but I was able to get it on amazon as a prime lightening deal for $155.00. This is a retro boombox design that I remember as a child. It is very very sturdy. This speaker has the following features: 90W Loud Stereo Sound with XBass, IPX7 Waterproof, LED Light, PowerBank, Bluetooth5.3&TWS, Custom equalizer, High Fidelity Sound, and 30 Hours of Playtime. In the box you…2 comments : last update or comment 1 year 8 months ago A Review Of The Active Braille 2021Posted on Thursday, March 2, 2023 by Scott DavertThe following review is an adapted version of this evaluation to suit the AppleVis website. You can read the full review on the Technology, Research and Innovation Center's web page. This expanded evaluation includes a comprehensive review of the internal applications and how well the Active Braille works with other screen readers not within the Apple ecosystem. Introduction There are a large…0 comments : last update or comment 1 year 11 months ago So Much Sound In A Small Form Factor: My Experience with the JBL Charge 4 Posted on Saturday, December 31, 2022 by tunmi13Intro I am not usually one for purchasing Bluetooth speakers. However, one of my goals is to balance out my music. Before purchasing this speaker, I was quite skeptical. Doing tons of researching, watching YouTube videos, and generally checking out reviews from other websites was making me wonder if purchasing this speaker was a good idea, and whether this $100 speaker was really worth my time. The downside to a speaker or any sort of sound review, is that every…6 comments : last update or comment 1 year 3 months ago Anker nano 736: the only charger you really needPosted on Sunday, April 24, 2022 by techluverWhen I first found out that this was going to be coming out, when it was announced in January, I was super jazzed. I knew I was upgrading to a MacBook Pro 14, and I knew that needed a 100W adapter. Most 100W adapters are huge. They can be the size of an iPhone and don't fit anywhere without taking up a whole wall outlet to itself. Not the Anker nano 736. It was released a few days ago and I really, really needed to have one. Size: Although it has a 100W…4 comments : last update or comment 2 years 10 months ago Powering up accessibly: a review of the Energrid VS820PDPosted on Thursday, April 7, 2022 by Scott DavertAs I integrate more technology into my daily routine, one of the challenges I face is providing power to all of the equipment. Along with my iPhone and braille display, I frequently carry other things that need to stay charged such as the external microphone used with my hearing aids. This device is essential, maintaining my ability to communicate with companions or the general public in complex settings. Recent unofficial support for connecting some braille displays to iPhones over USB is…30 comments : last update or comment 2 months 3 weeks ago Solving the Bard Mobile "I can't hear my book over my Voiceover" problem with a bluetooth IOS remotePosted on Thursday, March 24, 2022 by Voracious P. BrainIt's midnight. You're listening to a book on your phone to help you go to sleep. You realize that suddenly the character you've been following is now 80 years old and in the process of finally vanquishing her arch enemy that you've never heard of. How long were you asleep? Time to rewind--again. You take the phone off its charger, unlock it, swipe to hopefully land in the Bard app rather than the home screen, explore by touch to rewind (rewind kind of sucks in Bard, as an…0 comments : last update or comment 2 years 11 months ago Sony LinkBuds Review: The Best Headphones Yet for Full Ambient Awareness Without Compromising on Performance or FeaturesPosted on Tuesday, February 22, 2022 by David GoodwinFor anybody wanting to be able to hear the world around them while listening to music; podcasts; audiobooks; guided navigation or VoiceOver, my likely recommendation over recent years would be either bone-conduction headphones that leave your ears uncovered or headphones with some form of ‘transparency’ mode that uses built-in microphones to process ambient sounds. This changed last week with the launch of Sony's newest set of fully wireless earbuds, the Sony LinkBuds. Priced at US$…12 comments : last update or comment 1 year ago A Review of the Orbit Reader 40Posted on Thursday, October 21, 2021 by Scott DavertIn January of 2018, I reviewed the original Orbit Reader 20 From Orbit Research. It was “intended primarily as a braille display for reading braille files and for connecting to external devices. With a much lower price point than other 20-cell displays, the Orbit Reader 20 does not have onboard translation options, Cursor Routing Buttons or many of the other features found in braille devices that cost thousands of dollars more.” Fast…8 comments : last update or comment 1 year 9 months ago Xiaomi Mi Body Composition Scale 2: better than I expectedPosted on Monday, August 30, 2021 by WellFIntroduction I bought this on Mercado Livre for R$212. Quite expensive for a bathroom scale, but I was looking for something I could use without sighted help and this Xiaomi model seemed like a good bet. Other smart scales cost the double or even more. Unboxing It came faster than I thought it would, well packed. There were no issues on this matter. usage I had some minor difficulties with the Mi Fit…4 comments : last update or comment 3 years 6 months ago Pagination Page 1 Page 2 Page 3 Page 4 Page 5 Page 6 Page 7 Page 8 Page 9 … Next page Last page'''
