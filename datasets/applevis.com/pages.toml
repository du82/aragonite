["https://applevis.com/blog/apple-introduces-new-ipad-air-m3-processor-new-magic-keyboard-model-updated-entry-level-ipad"]
title = "Apple Introduces New iPad Air with M3 Processor, New Magic Keyboard Model, Updated Entry-Level iPad | AppleVis"
description = "Apple has today released new 11-inch and 13-inch iPad Air models, as well as a new Magic Keyboard for the iPad Air and an updated entry-level iPad. The new iPad Air comes in 11-inch and 13-inch screen sizes and features the Apple M3 Chip. According to Apple, the iPad Air with M3 is nearly 2x faster than iPad Air with M1 and up to 3.5x faster than iPad Air with A14 Bionic."
full_description = "By AppleVis, 4 March, 2025 Apple has today released new 11-inch and 13-inch iPad Air models, as well as a new Magic Keyboard for the iPad Air and an updated entry-level iPad. The new iPad Air comes in 11-inch and 13-inch screen sizes and features the Apple M3 Chip. According to Apple, the iPad Air with M3 is nearly 2x faster than iPad Air with M1 and up to 3.5x faster than iPad Air with A14 Bionic. Aside from the upgraded processor, it does not appear that the new iPad Air contains any major changes from the previous generation. Storage for the new iPad Air starts at 128GB, with 256GB, 512GB, and 1TB configurations also available. The new iPad Air comes in blue, purple, starlight, and space gray. Starting pricing is $599 for the 11-inch Wi-Fi model and $749 for the 11-inch Wi-Fi + Cellular model; and $799 for the 13-inch Wi-Fi model and $949 for the Wi-Fi + Cellular model. Discounted pricing is available for education customers. The new iPad Air is available to pre-order now, with deliveries beginning to customers and in-store availability beginning March 12, 2025. Alongside the new iPad Air, Apple also introduced an all-new Magic Keyboard. The new Magic Keyboard for iPad Air features a new function row of 14 keys, giving users access to features like volume controls and screen brightness; it also includes a larger built-in trackpad. The Magic Keyboard connects automatically with the Smart Connector and includes a machined aluminum hinge and a USB-C port for charging. The new Magic Keyboard is available for $269 for the 11-inch model and $319 for the 13-inch model, with a discount available for education customers. In addition to the iPad Air and Magic Keyboard, today Apple also updated its entry-level iPad; known simply as 'iPad'. iPad now comes with double the storage (starting at 128GB) and the A16 chip. It appears that the new iPad does not support Apple Intelligence. The new iPad is available in 128GB, 256GB, and 512GB storage options and comes in blue, pink, yellow, and silver. Pricing starts at $349 for the Wi-Fi model and $499 for the Wi-Fi + Cellular model, with a discount available for education customers. Like the new iPad Air, the new iPad is available for preorder now and will begin arriving to customers and be available in-store beginning March 12, 2025. Tags Apple iPad News Options Log in or register to post comments Comments Just when I was thinking… By TheBlindGuy07 on Tuesday, March 4, 2025 - 18:24 Just when I was thinking apple can't do worst... Vision Pro was literally the last success of this company."
