["https://applevis.com/forum/ios-ipados/new-ai-app-describing-images-video-piccybot"]
title = "New AI app for describing images and video: PiccyBot | AppleVis"
description = "Hello guys, I have created the free app PiccyBot that speaks out the description of the photo/image you give it. And you can then ask detailed questions about it. I have adjusted the app to make it as low vision friendly as I could, but I would love to receive feedback on how to improve it further! The App Store link can be found here: https://apps.apple.com/us/app/piccybot/id6476859317"
full_description = '''By Martijn - Spar…, 1 March, 2024 Forum iOS and iPadOS Hello guys, I have created the free app PiccyBot that speaks out the description of the photo/image you give it. And you can then ask detailed questions about it. I have adjusted the app to make it as low vision friendly as I could, but I would love to receive feedback on how to improve it further! The App Store link can be found here: https://apps.apple.com/us/app/piccybot/id6476859317 I am really hoping it will be of use to some. I have earlier created the app 'Talking Goggles' which was well received by the low vision community, but PiccyBot is a lot more powerful and hopefully useful! Thanks and best regards, Martijn van der Spek Options Log in or register to post comments Comments @Martijn By Brad on Tuesday, March 5, 2024 - 15:12 I'll check out the app but we do already have one that is powered by chat gpt4, it's BeMyEyes AI feature. My thoughts on the app. By Brad on Tuesday, March 5, 2024 - 15:12 First, BeMyAI gives you what a subscription to this app would: detailed descriptions. Second: the voice is nice, it's Open AIs chat gpt4 mail voice, you can unlock more voices with a $2 monthly subscription. Thirdly, you can't share images with the app like you can with BeMyEyes. Over all; this app doesn't do anything that's new, so I'd recommend sticking with BeMyEyes. The only thing I actually like a lot more over BeMyEyes is the app uses the chat gpt4 voices, I wish BeMyEyes did that. Thanks for the thoughts By Martijn - Spar… on Tuesday, March 5, 2024 - 15:12 Hi Brad, thanks for the thoughts on my app. It's a first version so all feedback is very welcome! I can add the share image and/or share description with the next update the coming week. It was in my earlier app, Phoice, which I launched a few months ago. But the idea of Piccybot is for you to ask details about the image, have a conversation with the Bot about it. Phoice just gave a single description. I am a bit rusty in developing for the community, my app Talking Goggles is now ten years old. But it is very rewarding to do and I aim to further improve PiccyBot fast. Cheers, Martijn Be my ai? By Erick on Tuesday, March 5, 2024 - 15:12 I use Be my AI a lot, so I don't really see any reason to use this app but I will check it out just in case. Re: PiccyBot By Malcolm13 on Tuesday, March 5, 2024 - 15:12 One thing that would be useful is if it was possible to review the description with VoiceOver. Having the descriptions read out is fine but it cannot be reviewed. Another feature that would be nice to have By Brennen on Tuesday, March 5, 2024 - 15:12 It would be nice if there is a way that you could be guided into taking a picture. For example, if you’re going to take a picture or something and have it described, it would be helpful if there was some kind of a sound or voice telling you if you were on the right track and aiming the camera or not or if there is enough light or not to get a good picture in my opinion, that would make this app stand out over Be My Eyes for sure personalization By Gokul on Tuesday, March 5, 2024 - 15:12 one handy feature which'd be nice to have would be the ability to save and then identify people. Say, if I'm loging in from an account and if I'm able to save the images of people with specific names, say from my family/work place etc, and whenever next a picture is clicked with those people in the frame, the app should be able to identify the people and automatically use the names in the describtion. Perfect By OldBear on Tuesday, March 5, 2024 - 15:12 Lottie wrote, "I like posting Alt Text on Mastodon and forgetting to attach the image!" Oh, that's good... Making the sighted see with their imagination, not their eyes. just bought the lifetime subscription By Daniel Angus M… on Tuesday, March 5, 2024 - 15:12 when I herd there is a subscription, I was interested to see what it offers from the free tear. some apps have a lifetime option, which this app thankfully does. the voice choice is the main selling point, it seems, with some other settings I haven't played around with. nice app so far. Copy/review descriptions By Martijn - Spar… on Tuesday, March 5, 2024 - 15:12 Thank you for the suggestions, looking at them closely! Regarding the copying and reviewing of descriptions, is the share feature not sufficient for that? You can share the text to a file or any other app and process it there? What can I do to improve on that? Re: Copy/review descriptions By Malcolm13 on Tuesday, March 5, 2024 - 15:12 Hello, Once the descriptions are retrieved it would be useful if one could review the results with VoiceOver sharing to another app or file is a clumsy way of accessing the results. Other apps let you review their results and this is useful. Thanks for the app and keep up the good work. might check app out By HarmonicaPlayer on Tuesday, March 5, 2024 - 15:12 i was a talking goggles user. i found that the apps mentioned above i used occationally as well and might give your new app a spin sometime Language By IPhoneski on Tuesday, March 5, 2024 - 15:12 “I have one remark - the app provides descriptions in English. I’m familiar with it, but the description should be given in the system’s set language.” piccybot By Michael on Tuesday, March 5, 2024 - 15:12 I just purchased a lifetime subscription to the app even before trying it out because I want to support the developer. I had one question. Most if not all my photos I'd be getting described are all in my camera roll and I noticed piccybot is not available in the share sheet to have those photos described. Can we get this added on please? Lifetime subscription for me as well By Missy Hoppe on Tuesday, March 5, 2024 - 15:12 I've just played around with this app a little. I like that the voices it uses are unique, but would like it if we could hear samples of each voice while in settings. Also, the ability to change speech rate doesn't seem to be working as expected, or, if it is, I couldn't figure it out. I had a bit of a tough time trying to ask follow-up questions, but I think that's more of a server problem than any fault of this app. In any case, I think it's a great start, and I always like to welcome new vision assistance apps to my arsenal. More feedback By Michael on Tuesday, March 5, 2024 - 15:12 I am finding the follow up question and answer very inconsistent. For instance, I asked it what the hair of the individual in the photo was. rather than telling me the hair color, it kept repeating the previous description. In addition, I do not like that one has to hit the return key to send the message. We need a dedicated send button similar to the one found in be my AI. Finally, the descriptions provided are not showing up when you swipe through. If you missed the description spoken aloud, you can review it as there is no text. I would like this to be made available as well. App update is available By Martijn - Spar… on Tuesday, March 5, 2024 - 15:12 Hi guys, Based on the feedback you have given me, I have updated the app. It is available in the Apple app store now: https://apps.apple.com/us/app/piccybot/id6476859317 The main change is that it will now display the text description as well as speak it out, so it can be read again using VoiceOver. I have also added a preview sample of the voices, as was requested by you. The duration of the output can now be selected in steps instead of a slider, so it works properly using VoiceOver. I have also added a new AI model to the app, Claude 3. This model has only been launched last week and is on par with GPT4. So now you have a choice of AI models: GPT4, Google Gemini or Claude 3. I don't believe any app offers this as yet. Each model has their advantages. GPT4 is more witty, Gemini can recognize people best, and Claude 3 can be very descriptive. I really appreciate the feedback I have been getting from you guys, please continue so together we can create a great vision app! Cheers, Martijn Thanks for the update, very welcome. By Malcolm13 on Tuesday, March 5, 2024 - 15:12 Thanks Martijn for implementing our suggestions I’m sure there will be more in the future, keep up the good work. Another update available By Martijn - Spar… on Friday, March 8, 2024 - 15:12 Based on the feedback from Brad and Michael, I have implemented the share sheet for the app. So now you can go to your camera roll and share any picture directly to PiccyBot to describe it for you. The update is available now in the Apple app store. The default language must be selected By Emre TEO on Friday, March 8, 2024 - 15:12 Artificial intelligence supports many languages for description, but the application gives English description by default for each query, this setting should be edited from within the application as in chat gpt. In addition, support for a siri shortcut can be quite useful. I agree. By Brad on Friday, March 8, 2024 - 15:12 I already have an ap for me if I need images described but I do agree. People should be able to select their language at settup or in setttings. Language selection By Martijn - Spar… on Friday, March 8, 2024 - 15:12 I'll see what I can do about the language setup. But note that if you ask a question about the image in a particular language (I tried Dutch and French), PiccyBot will answer your question in that language. And at least my native Dutch is sounding very good actually. This only works if you have selected OpenAI or Claude 3 as model though, Google Gemini defaults to English. changes By Michael on Friday, March 15, 2024 - 15:12 Firstly, I want to take the time to thank the developer for implementing the feedback in such a timely fashion. I wanted to inquire about the quality of the descriptions. When I have chat gpt enabled, I find that the quality of descriptions is still different than be my eye. Can the developer explain why might this be the case? is it a different llmversion? Secondly, can you have an option to disable text to speech with descriptions? Now that we have text descriptions, I am more than happy just reading the text using voiceover. Lastly, a dedicated send button would be nice as I am finding the search button in the text box unreliable. For instance, when I tried it this morning, I found that double tapping on the send or return didn't actually send the message. Promising App By Laurent Cadet … on Friday, March 15, 2024 - 15:12 Thanks Martijn for developing this app. While I believe that Be My AI from Be my Eyes certainly does the job, Piccybot has a more premium feel/sound to it. It feels like its still a young app, with BeMyAI having a smoother feel to it at the moment, but you appear to be a very responsive developer, so I'm confident that wrinkles will be ironed out very soon and so bought the lifetime subscription with no hesitation. For only $14, its great value and I'd encourage everybody to do the same if you can. Also, the app has a 1 star rating on the appstore. It certainly deserves more than that, so please show the dev some love and rate. I don't need this app but. By Brad on Friday, March 15, 2024 - 15:12 I'm going to buy a lifetime subscription to support the dev. I love the voice that's used, if I'm correct, it's the chat gpt4 voice isn't it? 11labs is amazing but I wish it had a voice like that. I'd honestly love it to be a screen reader option. I did it. By Brad on Friday, March 15, 2024 - 15:12 I hope it helps you guys who use the app. I'd love for these voices to come to our screen readers one day, I can only hope. Thanks all, new update available By Martijn - Spar… on Friday, March 15, 2024 - 15:12 Thanks for the amazing feedback and support, Brad, Laurent and Michael! The latest update covers the point Michael raised, by offering a 'no voice' option. The performance of the app will be better, and you can use your own VoiceOver on the text. I still feel the OpenAI voices (correct, Brad) are nice and keeping those in. 11Labs is pricey but can see what I can do there. Michael, regarding the difference between BeMyAI and PiccyBot when using GPT4, I am not sure. It could be the initial question sent to OpenAI is simply different. The other thing the update handles is localisation of the result. PiccyBot will use the default language set in your iPhone/iPad to present the text and voice in that language. In a future update I will make the language selection fully free within the app itself. The update gives some minor adjustments in the interface. It's now faster to switch between AI models and compare their output. Also, you can swipe between image and text. I get that swiping is not low vision friendly, will look into that further. Let me know what you guys think? does it give you more comprehensive answer once you subscribe? By LaBoheme on Friday, March 15, 2024 - 15:12 right now, the descriptions seem a bit stingy to me. it only give me the bare essential; either it is stingy by nature or it is afraid to say the wrong thing? OpenAI VS Claud Responses By Laurent Cadet … on Friday, March 15, 2024 - 15:12 Hi! I've found that the default OpenAI responses tend to end abruptly, i.e. starting to read something and then ending mid-thought, like saying that there is a list, and ending by saying "1". The Claud responses on the other hand are often brilliant, but take longer to generate. Has anybody else noticed this? Martijn, anything you know of that might be making the OpenAI responses cut off? Cutting off responses By Martijn - Spar… on Friday, March 15, 2024 - 15:12 Thanks for letting me know Laurent. The duration setting determines the number of tokens used for the response. The 100% should give a lengthy response from GPT4 but I see what you mean about the incompleteness. Will look into it. In general, Claude 3 can give very elaborate responses though. Which can be great but takes time. So depending on your need you can choose a model and a duration. LaBoheme: The default setting for the response is 40%, with a fixed voice and model. After upgrading you can adjust the response length and set different voices and models. quite good actually By LaBoheme on Friday, March 15, 2024 - 15:12 after subscribing, it is now very generous, no longer stingy. if you can add an option to prevent screen lock, that would be even better. when the analysis takes a longer time or the answer is a bit longer, sometimes the screen locks due to inactivity. either add a prevent lock option or make the system thinks the user is actively touching the screen. getting a 404 By Michael on Friday, March 15, 2024 - 15:12 I have my AI engine set to claude3, and getting a 404 when I try having a photo described. Claude 3 error By Martijn - Spar… on Friday, March 15, 2024 - 15:12 Michael, thanks for the heads up. There was an issue with the server routing the requests, it should all be working again. LaBoheme, will look into avoiding screen lock. You should always remain in control, agreed. landscape mode? By LaBoheme on Friday, March 15, 2024 - 15:12 when taking a picture.'''
