title = "FEER | AppleVis"
description = "Tune your ears in to the ZOMBIES or you will die. Save the white FAIRIES and they will give you light. But don´t ever STOP. The first endless runner game for visual impaired and sighted gamers @equal rights. Only the ones with the best ears survive in this dark and foggy world and can save the fairies. simple TOUCH interface to interact multiple MISSIONs let the challenge never end fascinating RETROstyle Graphics immersive SOUND No ADS, No In-App purchase, FULL ENDLESS GAME"
full_description = '''Category Games Description of App Tune your ears in to the ZOMBIES or you will die. Save the white FAIRIES and they will give you light. But don´t ever STOP. The first endless runner game for visual impaired and sighted gamers @equal rights. Only the ones with the best ears survive in this dark and foggy world and can save the fairies. simple TOUCH interface to interact multiple MISSIONs let the challenge never end fascinating RETROstyle Graphics immersive SOUND No ADS, No In-App purchase, FULL ENDLESS GAME Designed from the scratch to be fully accessible with VoiceOver, incl. tutorial and menu Version 1.1.8 Free or Paid Paid Apple Watch Support No Device(s) App Was Tested On iPhone iOS Version 13.6 Accessibility Comments Fully accessible game like it's written in the app description. VoiceOver Performance VoiceOver reads all page elements. Button Labeling All buttons are clearly labeled. Usability The app is fully accessible with VoiceOver and is easy to navigate and use. Other Comments Fun and interesting endless runner with kind of a missions, upgrades and addictive gameplay to waste some time. App Store Link https://itunes.apple.com/app/id1422421760 Developer's Website http://www.feer.at Developer's Twitter Username @RtheFee Related Podcast https://applevis.com/podcasts/run-your-life-feer-ios-game Recommendations 28 people have recommended this appMost recently recommended by Casey 3 months ago Options Log in or register to post comments Comments A really good game By jrjolley (not verified) on Friday, October 5, 2018 - 15:27 I'm on mission 4 and enjoying it. It's not as easy as you might think either.Qq Yeah By lirin on Friday, October 5, 2018 - 15:27 This is not that easy but after a while you'll use to it. I am glad you are enjoying the game. I was testing the game and i did my best to make it as much fun as I could providing my comments and thoughts. The game costs 1.99$ for two days only so grab it while it's cheap, after that it will be something like 6.99$ Awesome game By Sabrina on Friday, October 5, 2018 - 15:27 This game rocks! It is a lot of excitement. I have a tendensy to start screaming out loud when I am about to die. I am going to have my staff try this later. I love the missions. They are so cool. I love that it goes faster and faster. The sounds are awesome. It is not as easy as it sounds. Especially on the fast parts where I need to manage my reflexes because otherwise I will D I E. I am going to have my seighted staff try this. Wow! Just Wow! By Lulu Hartgen on Friday, October 5, 2018 - 15:27 When I saw the word zombies I thought, oh not again! I'm right up to here with zombies and I hate them anyway. Anyone who knows me knows my views about games in which you don't have to fight and I wasn't thinking this was going to be anything I wanted to play, but oh boy! Was I wrong or what! I just love the whole concept of this. The game is challenging, but easy to pick up, you're not puzzling out how to play so long that you just give up in disgust. It's by no means easy but controlling your runner is simplicity itself, and the touch interface is so responsive and light that even my wonky arthritic fingers are having no trouble with it, and I've played a lot of games which rely on swiping gestures about which I couldn't say the same. I'm only just starting, so maybe there's more to find, but I love the idea that not only do you have to run from the baddies, you can collect the good, that really sold me on this game, and it's not dreary stuff, practical though it may be, it's fairies! That really added the touch of lightness that made me want to play. I'm loving the sounds, both dark and light, in fact I'm just loving everything. If I had one slight comment I'd say that the language in the mission quests could be a little bit clearer, in some of them, only some, I wasn't clear what I was meant to be doing till I did it. This is a great game, I love that it doesn't end, you just get better. Or not. That's fine with me. Now where did I put my adrenaline pills? Oh, and my headphones. Laters. Brilliant game By David Standen on Friday, October 5, 2018 - 15:27 I agree with all comments. I started playing this on my way home from work this afternoon. Very addictive. I'm up to mission 3. I can honestly say other games have taken a back seat. Thank you so much for creating this game, and to all the beta testers who took the time and effort to make this game what it is today. I'm stuck on mission 8. By kool_turk on Friday, October 5, 2018 - 15:27 I'm stuck on mission 8. There is a quest that says you can skip any quest you want, not sure on what you're suppose to do. You can't skip it because that option is disabled for this particular quest, not that I needed to skip quests until this point. So far I'm liking this game, although if I can't get past this level, trying to beat my high score will be the only thing wirth playing for. Mission 8 By matheus rheine on Friday, October 5, 2018 - 15:27 In reply to I'm stuck on mission 8. by kool_turk To skip it you’ll need to get enough lights, for example: it’ll say skip quest for 800 lights. So you have to play to collect them. If you flick right a few times you can check how many you have. IPad By Sabrina on Friday, October 5, 2018 - 15:27 I can even play this game relyable on my iPad though sometimes I accidentally activate the multitasking gestures but thankfully it pauses. Is there a way to make multitasking gestures not working on the screen but working on thbe keyboard? iTunes isn’t working today. By Diego Garibay on Friday, October 5, 2018 - 15:27 I click the link and the application does not come up. It’s probably temporary though. oh no By Sabrina on Friday, October 5, 2018 - 15:27 I already have the game but tried the link and it just says it can not connect to the app store. Hope it is temporary. A rather simple way to get it By DMNagel on Friday, October 5, 2018 - 15:27 Just go to the App Store manually and type FEER the game of running blind into the search field. It worked for me. Losing Lights! By Lulu Hartgen on Friday, October 5, 2018 - 15:27 Hey guys, I've hit a serious problem here and it's spoiling the game for me. I'm losing lights. Now I know, from Twitter, that it's happening to others and there is a fix for one part, but I'm losing them elsewhere too and I don't know how to stop it. Apparently there is a patch on its way to fix the part they know about but … anyway, let me start at the beginning here. So, when I was playing before I wanted to upgrade my power ups, checked my lights and thought I had plenty, but when I went back to look I noticed I only had three hundred or so. That's weird, I thought. I haven't done any save me or anything. So I saw today that if you hit the play again button in the center of the screen you lose lights, but if you hit it where it's supposed to be, which is the bottom right of the screen you don't lose them. So I've played that way and the lights stay. So I saved up my 1500 lights, upgraded a power up and that was all good. Then I saved up 1500 more, went to upgrade and … everything was disabled again. So I checked my lights and saw I had only 1,480. Oh, I thought, I must have made a mistake, only I knew I hadn't. I played another game, got a good run on lights and had plenty more, 1,600. Went back to upgrades and … I had lost 800 of my hard earned lights just like that. I hadn't touched the play again button which was supposed to be the problem. Now I don't know about you, but I played my butt off to save up for upgrades and not getting them because of a game bug is getting old. Is anyone else seeing this? I'm loving this game so much and really hope this problem can be fixed, because for some of us with slower reflexes, the lower parts of the leader board is all we're ever going to see, but doing the missions and getting the upgrades is addictive and fun. Light Bug is fixed - Update is at Apple´s for revision By mentalhome.eu on Friday, October 5, 2018 - 15:27 The bug of loosing lights, while double tapping is fixed, the Update is on its way to you all. (at least to all, that have it already installed) scoring By Sabrina on Friday, October 5, 2018 - 15:27 How does the scoring work? And wich things give score? update By Sabrina on Friday, October 5, 2018 - 15:27 Hi Lulu. The lost light bug is now gone. I tried this and I even upgraded my light doubler powerup and it worked just fine. One Request for the Game By Roxann Pollard on Friday, October 5, 2018 - 15:27 During the game-play, sometimes I forget which noise means what; specifically, the light doubler and other similar sounds. I would like to see a way to just listen to the different sounds in a list and have their appropriate names attached as a reminder. I think this would be especially helpful for beginners of the game. worth it! By roman on Friday, October 5, 2018 - 15:27 this is a very nice game, I ever played. thanks for making this game. 2$.99 is tottaly worth. very good sound effects! I just tooke it! By roman on Friday, October 5, 2018 - 15:27 In reply to Yeah by lirin hello! this is Roman, and thank you somuch for making this great game! i hope that you will make other audio games in the future. thanks! A feature request By Sabrina on Friday, October 5, 2018 - 15:27 When I am ruhnning very fast and die but can use save me, I would like it to say how much score I actually have because I want to know if I am close to high score. Canadian App Store? By Yokose on Friday, October 5, 2018 - 15:27 This app does not appear to be in the Canadian App Store. My question is, will it be coming to the Canadian store? I'd be interested in playing. Edited I'd like to thank the next commenter for the helpful information, I was able to get the game finally. If you type feer the game of By kool_turk on Friday, October 5, 2018 - 15:27 If you type feer the game of running blind into your app store it should come up as the first result. I just tested it to make sure, and it works, unless of course it isn't in your app store. I'm in australia and it's definitely available here. Good game, but with a couple of problems for me! By Clare Page on Friday, October 5, 2018 - 15:27 Hi! I installed FEER last Thursday, and i'm enjoying the game, even though I'm pretty lousy at it: I'm probably right near the bottom of the scoreboard right now, since it's very rare that I get more than 400 points per run. One reason for this is that I plainly don't slide at the right moment when the ravens fly over me, as it's "game over" for me whenever they arrive. I'm happy with the new update, in that I don't necessarily have to go to the bottom right-hand corner of the screen to double-tap Play Again any more, but sometimes, after my usually rather short runs end, I can't get the Next button to respond, so that I can't even get to the screen where we hit the Play Again button. I don't know whether this is a new bug with the app, or whether my ageing iPhone 6 is being obstinate, or whether my finger simply isn't in exactly the right place, but thankfully I can get the button to work again either by toggling VoiceOver off then on again, or restarting the app completely, so my problem with activating buttons isn't a deal-breaker, and I still like the game in spite of not being very good at it. RE: Good game, but with a couple of problems for me By Roxann Pollard on Friday, October 5, 2018 - 15:27 Hello Clare Page. Let me see if I can help a bit. 1. For the sliding action, all I do is slowly slide my finger downward on the screen until the ravens give up and go away. This is quite successful for me, except for when the game mechanics decide it's time for me to get eaten. Then they catch me no matter what. 2. For the Next and Play buttons... First of all, did you know that you can turn off Voiceover and play with the voice that is built in? This is what I have chosen to do. Now I don't know if this makes any difference or not, but, while using the built in voice, when it is time to hit either the Next or Play buttons, all I do is one finger swipe to the right. This highlights the buttons and then a single finger double tap activates either button without problem. 3. As far as not getting many points in a run, don't forget to upgrade your power ups as you can. This will help to progress the game more for you. Hopefully, these tips will help you to progress further in the game. Happy running. Sometimes the buttons don't By kool_turk on Friday, October 5, 2018 - 15:27 Sometimes the buttons don't register while voiceover is speaking. That's a unity thing, not a voiceover thing, because I've seen it with other games that use this unity plugin for accessibility. I tend to flick quickly rather than slide my finger, especially when the game speeds up, because trust me, when it speeds up, you won't have time to slowly slide your finger across the screen. I know there are others better than me, judging by the leader boards, I tend to be around the top 30 mark. feer running blind - is the key to the appstore By mentalhome.eu on Friday, October 5, 2018 - 15:27 In reply to Canadian App Store? by Yokose search with "feer running blind" that should lead you to the app in appstore ( since one week we are daily in communication with apple developers, without any success, to make the search better) Loving this game even more now! By Clare Page on Friday, October 5, 2018 - 15:27 Thanks to the tips above, and me getting more used to the game in general, I enjoy it even more as I continue to play it. At the time of writing this, I'm only on Mission 3, and I often still get killed far sooner than I should simply because I don't react fast enough, but this is an excellent game. I do have one suggestion, though: could we have a sounds tutorial somewhere, in the main menu or the options perhaps, where we could go to be reminded which sound means which event? I obviously have no trouble recognising lights or zombies or groping hands or ravens, but when I get power ups I sometimes forget which sound means which power up, so I might miss my opportunity of killing zombies or whatever; This is just a suggestion, and I hope it's possible, but if it isn't, I'll just have to take my chances at power up time till I've fully memorised which sound means which power up. I have a suggestion! By roman on Friday, October 5, 2018 - 15:27 hello every one! I am falling love to our FEER-audio version of subway surfers, and temple run. but I have a suggestion. they could add music in this game. like in the movie, if some one is running, they play music. I means not so loud obviously! app store By kev lyon on Friday, October 5, 2018 - 15:27 I have tried every variation I can think of to search for this game in the app store on my phone, including those above, and it is not there. I'm in the UK. very frustrating. if I try using the the website instead, it's there, but tells me it's only available via the app on my phone. I have a suggestion'''
