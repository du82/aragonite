 iOS 18.3 and iPadOS 18.3; Bringing Changes to Apple Intelligence and Bug FixesPosted on Monday, January 27, 2025 by AppleVisApple has today released iOS 18.3 and iPadOS 18.3 to the public; bringing changes to notification summaries on Apple Intelligence-capable devices and several bug fixes. It was also reported previously that this update enables Apple Intelligence automatically on supported devices. It can be disabled if you wish after installation by going to Settings > Apple Intelligence & Siri, and…25 comments : last update or comment 3 weeks 6 days ago Apple Releases tvOS 18.2.1 with Data Synchronization FixPosted on Thursday, January 16, 2025 by AppleVisAs reported by MacRumors, Apple has today released tvOS 18.2.1 to the public. According to an Apple Support Document, tvOS 18.2.1 resolves an issue with data synchronization across devices: This update addresses an issue where data may not sync correctly across devices. At this time, we…0 comments : last update or comment 1 month 2 weeks ago [Closed] Share Your Apple Vision Accessibility Experience and Opinions: The 2024 AppleVis Report Card Survey is Now OpenPosted on Monday, January 13, 2025 by AppleVisWe are very excited to announce our third annual Apple Vision Accessibility Report Card and invite you to participate in the survey that will determine the ratings. Plus, participants who complete the survey will be entered into a drawing to receive a $200 gift card, thanks to Be My Eyes. Launched in 2023 for the 2022 year, the aim of the Apple Vision Accessibility Report Card is to present valuable insights to Apple and our community from…1 comments : last update or comment 1 month 1 week ago Apple Releases iOS 18.2.1 and iPadOS 18.2.1 with Bug FixesPosted on Monday, January 6, 2025 by AppleVisApple has today released iOS 18.2.1 and iPadOS 18.2.1 to the public. According to Apple's release notes, iOS 18.2.1 and iPadOS 18.2.1 contain 'important bug fixes': This update provides important bug fixes and is recommended for all users. As iOS 18.2.1 and iPadOS 18.2.1 are point releases and appear to have been released to address a specific issue or issues, we…9 comments : last update or comment 1 month 3 weeks ago Announcing the Winners of the 2024 AppleVis Golden Apples and David Goodwin AwardPosted on Thursday, January 2, 2025 by AppleVisAppleVis and Be My Eyes are pleased to announce the winners of the 13th annual AppleVis Golden Apple Awards and the inaugural David Goodwin Award. Since their launch in 2012, the AppleVis Golden Apple Awards have afforded blind, DeafBlind, and low vision users of Apple products an opportunity to recognize and acknowledge the hard work and dedication which developers have put into…15 comments : last update or comment 2 months ago AppleVis Unlimited: What's New and Noteworthy for December 2024Posted on Tuesday, December 31, 2024 by AppleVisWelcome to the December 2024edition of AppleVis Unlimited, your monthly digest of the latest and most notable content on the AppleVis website. This edition features a curated selection of community-submitted content, including new app entries; updates; news; how-to guides; popular discussions; and podcasts. New and Noteworthy App Entries Accessible Math Match (iOS, US$0.99) Math Match – Challenge Your Mind with Math Put your mental…0 comments : last update or comment 2 months ago [Closed] Cast Your Votes Now for the AppleVis Golden Apples of 2024 and David Goodwin AwardPosted on Friday, December 13, 2024 by AppleVisWe are very pleased to announce that voting for the AppleVis Golden Apple Awards of 2024 is now open. We are also excited to announce the launch of a new award to recognize a developer who has made a significant and enduring impact for our community. First launched in 2012, the AppleVis Golden Apples is an opportunity for blind, DeafBlind, and low vision users of Apple products to recognize and acknowledge the hard work and dedication which developers have put into making and…0 comments : last update or comment 2 months 1 week ago Apple releases macOS Sequoia 15.2, tvOS 18.2, and HomePod software 18.2Posted on Wednesday, December 11, 2024 by AppleVisApple has today released macOS Sequoia 15.2, tvOS 18.2, and HomePod software 18.2 to the public. As with iOS 18.2 and iPadOS 18.2, macOS Sequoia 15.2 brings Siri and Writing Tools integration with ChatGPT, Image Playground, and some accessibility fixes for blind, DeafBlind, and low vision users. Our experience is that the following accessibility bugs have been resolved or meaningfully improved in this release: …37 comments : last update or comment 2 months ago Apple releases iOS 18.2 and iPadOS 18.2; Bringing Fixes and Refinements for VoiceOver and Braille UsersPosted on Wednesday, December 11, 2024 by AppleVisApple has today released iOS 18.2 and iPadOS 18.2 to the public; bringing several accessibility fixes and feature refinements for blind, DeafBlind, and low vision users. iOS 18.2 also brings Siri and Writing Tools integration with ChatGPT, Genmoji, Image Playground, and Image Wand to Apple Intelligence-capable devices; as well as Visual Intelligence to iPhone 16 models. For VoiceOver and braille users, our experience is that the following accessibility bugs have been resolved or…37 comments : last update or comment 2 months 2 weeks ago A Warning to VoiceOver Users Regarding Volume Issues in watchOS 11.2Posted on Wednesday, December 11, 2024 by AppleVisUpdate: A member of our community has shared a workaround for the volume issue discussed below. This involves using the new Volume item in the Control Center to raise the system's master volume. While this is a reliable workaround for those who are already on watchOS 11.2, we stand by our recommendations in the original post. Original Post: Apple announced that today…34 comments : last update or comment 1 month 3 weeks ago Pagination Page 1 Page 2 Page 3 Page 4 Page 5 Page 6 Page 7 Page 8 Page 9 … Next page Last page'''
