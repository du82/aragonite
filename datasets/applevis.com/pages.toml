["https://applevis.com/apps/ios/lifestyle/be-my-eyes"]
title = "Be My Eyes | AppleVis"
description = "People who are blind or have low vision now have three powerful tools in one with Be My Eyes. Worldwide more than half a million people who are blind use the innovative Be My Eyes app through their smartphone to get visual description when they need it. Connect with more than 7 million volunteers. Or use the latest AI image describer. Or connect with dedicated company representatives to help with their products. All in one app. Connect with Be My Eyes volunteers speaking 185 languages and available – for free – 24 hours a day, 7 days a week."
full_description = '''Category Lifestyle Description of App People who are blind or have low vision now have three powerful tools in one with Be My Eyes. Worldwide more than half a million people who are blind use the innovative Be My Eyes app through their smartphone to get visual description when they need it. Connect with more than 7 million volunteers. Or use the latest AI image describer. Or connect with dedicated company representatives to help with their products. All in one app. Connect with Be My Eyes volunteers speaking 185 languages and available – for free – 24 hours a day, 7 days a week. Our newest feature, ‘Be My AI’, is a pioneering AI assistant integrated in the Be My Eyes app. You can send images via the app to Be My AI, which will answer questions about that image and provide conversational AI generated visual descriptions for a wide variety of tasks in 36 languages. Be My AI is powered by artificial intelligence and is able to provide assistance in a wide variety of situations, from checking makeup before a night out to translating text from hundreds of different languages. Lastly, our ‘Service Directory’ section allows you to connect directly with a wide range of companies for support with their products and services as well as organizations within the blindness community FREE. GLOBAL. 24/7. Be My Eyes Key Features: • Get assistance on your own terms: call a volunteer, chat with Be My AI or contact a company representative. • Volunteers and Be My AI available globally 24/7 • Always free of charge • 185 languages worldwide in 150+ countries What can Be My Eyes help you with? • Using home appliances • Reading product labels • Matching outfits and identifying clothes • Helping to read product expiration dates and cooking instructions • Reading digital displays or computer screens • Navigating TV or game menus • Operating vending machines or kiosks • Sorting music collections or other libraries • Sorting and dealing with paper mail What the World is Saying About Be My Eyes: “It was just amazing that someone from the other side of the world could be in my kitchen and help me with something.” - Julia, Be My Eyes user “Having access to Be My AI has been like having an AI friend by my side all the time describing things to me, giving me unprecedented access to the visual world and helping me be more independent.” - Roberto, Be My Eyes User “The tie-up between Be My Eyes and Microsoft is fantastic! I don’t know what I would have done to fix my PC issues without their help. Well done!” - Gordon, Be My Eyes User Selected Awards: • Mentioned in the 2023 Time Magazine best inventions • 2021 Apple Design Award for best Social Impact app • 2020 Dubai Expo Global Innovator. • 2018 Winner of the Dr. Jacob Bolotin Award at the NFB National Convention. • 2018 Winner of AbilityNet Accessibility Award at the Tech4Good Awards. • 2017 Winner of World Summit Awards - Inclusion and Empowerment. Version 6.0.1 Free or Paid Free Apple Watch Support No Device(s) App Was Tested On iPhone iOS Version 18.1 Accessibility Comments Very simple to use. Connected to somebody after about 60 seconds, and they were able to answer my question about something in my food larder. So, essentially, this works as advertised (smiles) VoiceOver Performance VoiceOver reads all page elements. Button Labeling All buttons are clearly labeled. Usability The app is fully accessible with VoiceOver and is easy to navigate and use. App Store Link https://apps.apple.com/us/app/be-my-eyes/id905177575 Developer's Website https://www.bemyeyes.com/ Developer's Twitter Username @BeMyEyes Related Podcast http://www.applevis.com/podcast/episodes/be-my-eyes-virtual-sighted-assistance-… Recommendations 34 people have recommended this appMost recently recommended by Matt M 2 weeks 4 days ago Options Log in or register to post comments Comments I think the description By KE7ZUM on Thursday, February 5, 2015 - 15:29 I think the description shoudl be amended slightly from As a sighted user you don't need to worry about missing a call and 'leave a blind person hanging' - you are a part of the bigger Be My Eyes helper-network and we will find the next available sighted person in the network. The challenges that the blind person needs help with can be anything from knowing the expiry date on the milk to getting help crossing the street. to the following As a sighted user you don't need to worry about missing a call and 'leave a blind person hanging' - you are a part of the bigger Be My Eyes helper-network and we will find the next available sighted person in the network. The challenges that the blind person needs help with can be anything from knowing the expiry date on the milk and more. Note do not use this app to get help crossing a street. Your life can be at wrist if this action is attempted. Use good mobility skills. Just my thoughts. is there a way you can submit this change to the dev for the itunes description? I'm worried that many of us that don't or will not get mobility will be seriously hurt. This is a bad oversite on the devs part. First experience By Jessica Brown on Thursday, February 5, 2015 - 15:29 I wanted a can of apple juice. So I grabbed a can out of the fridge and connected to be my eyes. I waited for about 5 minutes then hung up thinking it was over loaded from everyone trying to try it out all at the same time. I ended up drinking root beer instead. But that's ok. I like it as well. What I am worried about is after I disconnected and pressed the home button to get back to the home screen, VoiceOver sounded muffled and to fix it I had to go into the app switcher and close be my eyes. Once I did that, VoiceOver was its old self again. Crossing The Street By Michael on Thursday, February 5, 2015 - 15:29 I thought the same thing when I first read that statement on their website. I totally agreed with the comment left here about using the app to help one cross the street. I was so concerned that I sent an email to the developers, who immediately got back to me via email and changed the statement on their website. What you just experienced is By KE7ZUM on Thursday, February 5, 2015 - 15:29 In reply to First experience by Jessica Brown What you just experienced is voice over failing to switch profiles. It was using what I think is called the phone profile. It sounds horable. Good luck and hope your next attempt is better. That's good, but the By KE7ZUM on Thursday, February 5, 2015 - 15:29 In reply to Crossing The Street by Michael That's good, but the description on iTunes needs to be changed to reflect that, something like what I said in the comment I posted. iTunes Change By Michael on Thursday, February 5, 2015 - 15:29 Yes, the iTunes description should be changed as well. I will let them know, and hopefully their response will be as quick. Volunteer checks By Mr Potato Head on Thursday, February 5, 2015 - 15:29 Interesting to see that in the 12 hours since I installed this app, the number of sighted volunteers it reports as being registered has risen from 1900 to 4600. Part of me is thrilled to see so many people getting involved. However, there’s another part which is concerned that this suggests that there is no checking of volunteers being carried out. If true, I would be worried that it won’t be too long before we start hearing of some bad experiences from people using the app. Here’s hoping that I am wrong. Or, even better, that some form of checks are carried out before volunteers are able to receive questions. Does anybody know if this is the case? It's a Free App By Darrell Hilliker on Thursday, February 5, 2015 - 15:29 Let's keep in mind this is a free app operated by a nonprofit organization. They probably don't have the bandwidth to check volunteers. Having said that, my understanding is that there is a way to rate blind people and volunteers so, presumably, those ratings impact things somehow? i love this app! By dezzi on Thursday, February 5, 2015 - 15:29 I just tried the be your eyes app for the first time today, and I'm really impressed with it. I was able to tell the difference between two containers which feel the same, and the person was really great about detail. bad experience By Usman on Thursday, February 5, 2015 - 15:29 I've already had bad experience on my first attempt at using this app. I wanted to know the name of the medication bottle. I knew what it was, but did it to test the person. As it turned out, the person gave me the wrong information. I was told that I held a bottle of vitamin c tablets. The bottle actually contained aspirin. Looks like I will not be using this service in an important situation. Please be sure to report all issues. By Darrell Hilliker on Thursday, February 5, 2015 - 15:29 In reply to bad experience by Usman There are bound to be kinks as many new blind users crowd into the system. Please be sure to report all issues you find. Misidentification of medication is rather serious. Yikes! Agreed. if there is truly a By KE7ZUM on Thursday, February 5, 2015 - 15:29 In reply to Please be sure to report all issues. by Darrell Hilliker Agreed. if there is truly a rating system please rate and if comments are aloud, make a comment. Yeah that is a serious error on your helper's part. Yikes indeed. getting medication wrong is By alex wallis on Thursday, February 5, 2015 - 15:29 getting medication wrong is quite serious, but also remember one issue with this app it is rather dependent on what the camera focuses in on, so perhaps it wasn't pointed properly at the actual label so the person had a guess based on looking at the actual bottle. Just out of curiosity to the person who had the medication identified wrongly have you tried doing the same experiment with tap tap see to see what happens? personally I think for important stuff like that I would resort to knfb reader or if that didn't work talking goggles to try to read the bottle first. medication bottle By Usman on Thursday, February 5, 2015 - 15:29 Yes, the camera was focused properly on the bottle's label. I even made sure with the person that it was lined up properly so she can see it and be sure as to what the label is. Needless to say, I was disappointed. Hmm. Did you report the issue By KE7ZUM on Thursday, February 5, 2015 - 15:29 Hmm. Did you report the issue and say the problem is not listed, then type the happenings in to the box? I'm sure if they get enough of those they will either get a talking to, or quit. yes By Usman on Thursday, February 5, 2015 - 15:29 I reported it. Only time will tell if more such problems occur. Well that's a start AGain By KE7ZUM on Thursday, February 5, 2015 - 15:29 Well that's a start AGain mixing up meds is not cool and you did have the camera right. I'm a nitpick with that stuff as well. Hard to Get Help. Server upgrades. By Darrell Hilliker on Thursday, February 5, 2015 - 15:29 I have noticed that it can take well north of 10 minutes to get help, despite there being reportedly more than 12 thousand volunteers. This morning, the Be My Eyes team announced they are performing server upgrades. Let's see if that helps. I have high hopes for Be My Eyes! Great podcast Darrell. I also By Joe on Thursday, February 5, 2015 - 15:29 Great podcast Darrell. I also have hopes for this, but I wonder long term if it will remain. Good experience with drinks distributors By Elena Brescacin on Thursday, February 5, 2015 - 15:29 Hello, here in my office I have an automated distributor. Those machines which have coins or a prepaid key where to buy snacks and drinks. The issue is that "coke man", the guy who fills in the machines when they are empty, always changes the positions of things to buy. So, what's on number 11 a first time, a second time may result in 22 position and, you cannot see the remaining credit on your prepaid key as it's on a screen. Well, Be my eyes app, helped me and I managed to have credit read; I did not try to make me help for reading the snacks in the numbers on the food's machine, as there are too few Italian volunteers and I'd never had asked help in a context full of Italian words, to a person who cannot speak the language. It creates difficulty to who should give me a help. Today evening I think I am going to ask help for my computer which does not start, the old windows machine. But, there is a but: I have the same doubts many people have here. What happens to people who tell wrong info or abuses of the service? There is not a check on volunteer's honesty. It's true it's a free app for now, but, this must not be a reason to forget misuse. I use a service, I want that service to work, it's not because it's free so let's forgive whoever gives me a wrong information! And, from the blind users' side, we must be polite too! it would not be nice if, for example, a blind person profits of Be my eyes for telling the volunteer, such as Please stay here to watch this film with me as it is not audio described! Or, if a girl has her period, call them and say, please look if my underwear is dirty! Or, worse, asking for help but not saying Thank you if the help has been useful, not to give a positive rate, or so. Politeness is the most important ingredient for making such a service work. It has all pros and cons of a human-driven service, so, by our part we are humans and we can help make it better for what we can do; so, both blinds and helpers, must help each other to improve the service. I also hope this will be extended to other platforms in future, as, especially for sighted people, having it on a droid device or even a smart tv, could be a better resource. Be My Eyes Has Returned By Darrell Hilliker on Thursday, February 5, 2015 - 15:29 It would appear the Be My Eyes team has completed their server upgrades. The app appears to be back online. Has anyone confirmed this and have wait times decreased? Got help after just 1 minute! By Darrell Hilliker on Thursday, February 5, 2015 - 15:29 Used Be My Eyes over lunch and got help in about a minute! Wow! Awesome! Anyone else noticing improved responsiveness? Be My Eyes must be in the foreground. By Darrell Hilliker on Thursday, February 5, 2015 - 15:29 I have discovered that, in order for the volunteer to see the video from the phone's camera, the Be My Eyes app must actually be in the foreground on the screen. If Be My Eyes is in the background, the volunteer will hear audio but will see nothing. Makes sence. It's the same By KE7ZUM on Thursday, February 5, 2015 - 15:29 In reply to Be My Eyes must be in the foreground. by Darrell Hilliker Makes sence. It's the same with facetime. If you put the camera in the back round, the frame freezes to what it showed last, and no more video is transmited. Be mindful By Nolly on Thursday, February 5, 2015 - 15:29 I don't think it was mentioned in the podcast, but also be mindful of what is in the background. I generally use the same place if possible when taking pictures or videos of things I need help identifying. I'm sure many of us remember '''
