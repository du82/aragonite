["https://applevis.com/apps/mac/games/cyclepath"]
title = "Cyclepath | AppleVis"
description = "In this game you're riding on a motorcycle and your goal is to avoid other cars while jumping on ramps to pick up coins which can be used to unlock faster bikes and more varied locations to drive in. The game features Binaural audio (like PapaSangre) as well as environmental effects."
full_description = '''Category Games Description of App In this game you're riding on a motorcycle and your goal is to avoid other cars while jumping on ramps to pick up coins which can be used to unlock faster bikes and more varied locations to drive in. The game features Binaural audio (like PapaSangre) as well as environmental effects. Version 0.1 Free or Paid Free Version Of macOS App Was Tested On 10.12.6, 10.14 Accessibility Comments Sometimes you may need to turn VoiceOver off and back on to get speech to work. Alternatively, as with Dark Defender, you can switch to "web TTS" from the options menu. Usability The app is fully accessible with VoiceOver and is easy to navigate and use. Other Comments You can either download the game as an application, or play it on-line (which works in any browser, tested using Chrome and Safari. Developer's Twitter Username @dragon1424 Developer Website https://iamtalon.me/cyclepath/ Recommendations 11 people have recommended this appMost recently recommended by Piotr Machacz 2 days 15 hours ago Options Log in or register to post comments Comments tts By themusicman08 on Saturday, August 5, 2017 - 15:12 I have set the tts up for the game but, when I next check to see that it is infact on, it says that it is off. Why does it keep changing my preferences after I save? Downloaded this game last night By David Standen on Saturday, August 5, 2017 - 15:12 I downloaded this game last night. I'm not very good at it yet as I have only obtained 42 coins but I'll get there. However, I can't seem to enable the ramps option in setup. Pressing space and using left and right arrows to attempt to enable this option doesn't work. Has anyone else experienced this issue? I enabled Web TTS and was able to change settings in the Options Menu without a problem. I am playing this on my iMac. Ramps By Piotr Machacz on Saturday, August 5, 2017 - 15:12 You need to unlock the ability to unlock ramps. You can do that by completing an achievement (I believe it's after passing 500 cars). Just keep playing the game, and you'll eventually get a notification that you unlocked ramps. Then you'll be able to set the switch to on. Thanks for that By David Standen on Saturday, August 5, 2017 - 15:12 Thanks for that. I'm off to play now. I'm glad to see another accessible game for the Mac. this game is awesome!!!! By Joseph on Saturday, August 5, 2017 - 15:12 I love the hell out of this game. It's very well done and very, very addictive. Nice Game By Ekaj on Saturday, August 5, 2017 - 15:12 I just downloaded this game but am having some issues with the in-game TTS I think. I'm able to read some things with VoiceOver in the game, but I haven't been able to set preferences yet. Perhaps it's a matter of me changing some settings though on my Mac. I'll keep trying. As far as the game itself, it seems pretty awesome for a beta version. The game website works nicely with VO. need some help By Igna Triay on Saturday, August 5, 2017 - 15:12 Hi, I downloaded this game a while ago, but I cannot seem to get the speech set up, i move through the menus, but the game doesn't say anything. How do I get the speech set up? thanks for any help problem solved but By Igna Triay on Saturday, August 5, 2017 - 15:12 I unlocked the ramps, and have them on, but how do i know i'm on a ramp, does it have some sort of sound to indicate that you are getting close to a ramp. Love this game!!! Ramps By David Standen on Saturday, August 5, 2017 - 15:12 The ramps make a definitive sound which rises in pitch. Hth. Need help opening the game By DrummerGuy on Saturday, August 5, 2017 - 15:12 I am not able to open the game. I get a message saying that it cannot be opened because it is not from the App Store or an Apple certified website. I opened Dark Defender before but I don't remember how I did it and I would like to be able to Play Cycle Path for I am hearing it is very addictive. Any help will be greatly appreciated. Thank you in advance. Opening cycle path for the first time By David Standen on Saturday, August 5, 2017 - 15:12 Firstly, you need to go to System Preferences. After opening System Preferences, go to Security and Privacy settings. Navigate through the options and a dialogue should appear which gives you the option to open the game. Hope this makes sense. i'm confused with some of the options By Igna Triay on Saturday, August 5, 2017 - 15:12 In the options screen there is an option that says gyro, what does this do? And what is the difference between clasick and modern turning mode? cyclepath podcast By cjackson on Saturday, August 5, 2017 - 15:12 I can't figure out how to play this game. Has someone done a podcast on it? Att: David Standen By DrummerGuy on Saturday, August 5, 2017 - 15:12 Thank you for the directions on how to open this game for the first time. I really appreciate it. Thank you. Have a nice day. A few answers By Piotr Machacz on Saturday, August 5, 2017 - 15:12 The Gyro option is only used if you're playing the game on a phone. If it's on, Cyclepath uses the gyroscope for determining how far you've tilted the phone, and with it off it instead uses the accelerometer. Every iPhone starting with the 4 has a gyro, so there's no reason to turn this option off on any iOS device as the gyro is much more precise. On a computer, this option will obviously have no effect as you're turning with the keyboard. Re: classic VS modern turning: In classic, pressing a key makes you Move right or left at a fixed speed, which is how other games of this type have done it (IE light Cars). In modern turning, the arrow keys actually make you turn your bike. This lets you move across the road faster, but it's also harder because you need to straighten the bike out after completing a turn (listen out for the sound of your wheels, if they're in the center you are going in a straight line) Re: Podcast, I can record one, but it will take some time as I'm on holidays for a few weeks. But, to get you started, once you start the game for the first time and selected a bike and world, press space to start moving forward, then simply use the left and right arrow keys to turn away from incoming cars which you can hear in stereo. If one is in front of you, it means it's about to crash into you so you want to move away from it. And finally, if you hear coins on the track, you want to pick them up (by moving toward them) as they are used to buy more bikes and worlds. is the game By Igna Triay on Saturday, August 5, 2017 - 15:12 Is cyclepath available for ios yet? re: iOS By Piotr Machacz on Saturday, August 5, 2017 - 15:12 You can play the browser version on iOS, just go here with Safari: http://cyclepath.dragonapps.org Note that this version is very experimental. It works best with VoiceOver off, but you need it on to turn on web speech API so it may be necessary to either 3d-touch the screen or use double-tap and hold passthroughs to initially navigate the menus. For navigation in the iOS version, swiping right and left navigates menus, swiping up and down changes selectors, tapping *once* activates the current menu option and tapping and holding for a split second scrolls text forward. the game is very resource intensive, so you need a recent iOS device to play it comfortably. I know for a fact that it works fine on an iPhone 7, and doesn't work at all on an iPad Air which is comparable to an iPhone 5s. You can also turn the effects off in the options menu if you experience crackling. You can expect the mobile support to get better over time. Web speech By Mitchell on Saturday, August 5, 2017 - 15:12 How do you turn on Webspeech on iOS? I'mnot exactly sure, so any help would be greatly apreciated. New Beta Works Pretty Well Online By Ekaj on Thursday, October 5, 2017 - 15:12 I just tried playing the new online beta version in Chrome, and it works pretty well. I was using Chromevox, and it read all the dialogs just fine. Needing some help with IOS By Joey G on Sunday, November 5, 2017 - 15:12 Hi all. I need some help with Cyclepath. So, I have downloaded this app to my mac, and it works like a dream. However, when I try to play with Safari on IOS, I am having some issues. I can use 3 d touch to move down the list of menu options. I can find and activate the options menu. I cannot, however, get web TTS to work, no matter how hard I try. Plus, when I am in the game, my bike will not turn, even though my gyroscope is on. My web TTS is also set to on, but it is a no go. Any help will be greatly appreciated in this matter. Thanks. How do I select a bike? By DrummerGuy on Tuesday, December 5, 2017 - 15:12 I cannot figure out how to select a bike. It says bike zero and I cannot select one. Please help. re, selecting bike By Igna Triay on Tuesday, December 5, 2017 - 15:12 once it says the bike you want, it will already be selected by default, for instance, when it says bike 0, bike 0 is the one you'll use. if you want to select another bike, use the left and right arrow keys to move through the different bike options. Hth Thank you, Igna Triay By DrummerGuy on Tuesday, December 5, 2017 - 15:12 In reply to re, selecting bike by Igna Triay I will give it another shot. I tried playing this morning but I cannot even hear my bike moving. I checked the statistics and everything is on zero. I hear cars, trucks, and everything else passing by except my own bike. The statistics say that I haven't traveled not even a meter yet. LOL. I guess I am doing something very wrong. Anyway, thank you very much for your help. Like I said, I will give it another shot and, hopefully, it will work. Take care. Happy things giving day. This game is absolutely fantastic. By DrummerGuy on Tuesday, December 5, 2017 - 15:12 Thank you for such an awesome game. I am really having a good time. Great game. Very addictive. Excellent sound effects. Not being able to play the iOS version. By DrummerGuy on Tuesday, December 5, 2017 - 15:12 I followed the link provided to play the browser version for Cycle Path and I am not able to start the game. I can't have axis to the main menu or, at least, I cannot read it. I am using an iPhone X and running the latest iOS version. I don't know if just like for the Mac version I can enable the web TTS for the game and turn VoiceOver off. Thank you in advance for your help. I really would like to play this game on my iPhone. Happy Thanksgiving day, everyone. iOS? By Diego on Tuesday, December 5, 2017 - 15:12 Hello guys! I'm trying to play on iOS, but it does not start, even though I reload Safari several times. My internet is good, and even connected in other places, it does not work. I disabled the virtual surrownd and effects. I'm using an iPhone 5c with iOS 10.3.3. What can I do? iOS By Ghorthalon the… on Monday, March 5, 2018 - 15:12 Hello, I've recently updated the game to work properly on iOS. You may or may not need to clear your cache, all the options are accessible, including entering your name, etc. with VoiceOver enabled. I'm working on caching the sounds for offline play, and when Apple introduces progressive web apps with iOS 11.3 or 12 you'll be able to fully enjoy the game even when offline and without using data. Make sure you head into options and enable Gyro, otherwise you won't be able to turn. When this is enabled, hold your phone in portrait. When you first load, tap on touch here, the rest is self explanatory until you get to start your bike, which you also do by double tapping on touch here. Then you tilt left or right to move left and right, it's like holding the arrow button until you straighten the phone out. Thank you for all the encouraging words. There will definitely be a lot more games in the future. IOS version By TheBlindDragon on Monday, March 5, 2018 - 15:12 Hi, I am trying to play the iOS version and I’m stuck on a screen that says loading 0 village. It’s after you pick your bike and options. Also, how does the web TTS work? I tried turning off VoiceOver and the tts didn’t talk. Thanks. Hello! I tried to open the By Maranatà on Sunday, May 5, 2019 - 15:12 Hello! I tried to open the link to play from the iPhone but the browser gives me an error message. Why? Cyclepath has moved By Piotr Machacz on Sunday, May 5, 2019 - 15:12 I got an email from Applevis today reminding me about this entry. Since the time I posted it, the game has moved websites. You can find the main page by looking at the developer website link at the top of the page. The direct link to the web version is now: https://cyclepath.iamtalon.me/ Hello! I tried the game from By Maranatà on Sunday, May 5, 2019 - 15:12 Hello! I tried the game from iphone but can't play. I only hear the sound of a motorcycle and the cars avoid me without me doing anything; but shouldn't it be the other way around? I practically never die, even with the gyroscope activated, when nothing happens, I only hear the bike and the cars passing around me. Practically the game goes by itself, I can't interact. Having The Same Problem By Zoe Victoria on Thursday, September 5, 2019 - 15:12 I'm having the same problem as Maranatà. I know it's because the bike's going slow and I need to speed it up but don't know how. It only said how to do it on a computer. Can anybody help us? How do I use the tunnels? By Jackie on Saturday, October 5, 2019 - 15:12 So, I have been playing this game for a while on my Mac. I have unlocked the ability to use tunnels, I have tunnels turned on, but I don’t know what they sound like, and I don’t know how to use them. Are there coins in the tunnels? I figured out the ramps. They are pretty cool. Thanks. Thanks great game By Maria on Saturday, October 5, 2019 - 15:12 I really like this game. I am quickly getting the hang of it I think. Thanks for another accessible game for the mac. I have 1 question. Can anyone explain what the difference is between the classic and modern turning? I can't seem to navigate as well in the modern option. Downloading cycle path to Mac By natalija Lambert on Thursday, March 5, 2020 - 15:12 Hey everyone. I was just curious as to how you actually download this game as their isn’t any kind of download link available. If someone could let me know, that would be great. Thanks Natalija This game seems to work… By TheBlindGuy07 on Monday, February 17, 2025 - 15:12 This game seems to work pretty well even in 2025 on the mac. You just have to enabled tts navigating with the usual vo commands. I didn't know that before so I by mistake skipped the tutorial that I don't seem able to get back even after reinstalling on my mac so if you have any advice. Like I unblocked the bike 1 and highway by pure guess work I don't know the sound reference. As somebody said above, great, insane sound design work for a web game. Very nice stuff and honestly pure joy of a gameplay. That's awesome. Considering… By Brian on Monday, February 17, 2025 - 15:12 That's awesome. Considering how old this game is, the fact it plays at all is simply outstanding. My gosh I love this game! It… By The'''
