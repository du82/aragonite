title = "Spotify finally appears fixed!!! | AppleVis"
description = "As of Spotify for iOS v9.0.22 the app appears to be fixed with VoiceOver. It’s not jumping or skipping anymore. I've tried every test I could think of to break it. I'm only 1 person of course, please do test when you install the update and let me know if its fixed for you as well?"
full_description = "By danno5, 5 March, 2025 Forum iOS and iPadOS As of Spotify for iOS v9.0.22 the app appears to be fixed with VoiceOver. It’s not jumping or skipping anymore. I've tried every test I could think of to break it. I'm only 1 person of course, please do test when you install the update and let me know if its fixed for you as well? Options Log in or register to post comments Comments I don't use the app By allabtech on Wednesday, March 5, 2025 - 02:29 I don't really use the app. Instead I use youtube.com to listen to music because it lets me do anything that the app would let me do now. Spotify, yes please! By Medved Mitarev on Wednesday, March 5, 2025 - 05:00 Great! Spotify was really bad when it came to breaking things but very original in fixing them. Let's hope they've fixed it definitively this time. I'm going to try the app without premium mode. Lately I've been thinking more and more about returning to Spotify, considering how they treat us in Apple Music, at least regarding accessibility. Apple music By Icosa on Wednesday, March 5, 2025 - 10:11 Reason I've stuck with Spotify is Apple Music is just unreliable on Windows, it frequently stops working. Glad the issues seem fixed, though when I retried the DJ earlier that was having an annurism for some reason but that's not an accessibility problem. Yes it's finely fixed! By Joker Alice on Wednesday, March 5, 2025 - 15:11 I use spotify all the time, so I was annoyed at all the work arounds we had to do for a while; however, I did update the app yesterday, I tried all the ways that the player would end up jumping through the songs in the ways it was affecting me, I can say for sure it's not jumping anymore. would end up jumping through… By Joker Alice on Wednesday, March 5, 2025 - 15:12 would end up jumping through the songs in the ways it was affecting me, I can say for sure it's not jumping anymore. Tried all of them By danno5 on Wednesday, March 5, 2025 - 15:17 Yep, me too, I tried all of them, and it didn't go mad. Its so nice to be able to use it again, although I was actually convinced they never were going to bother with it"
