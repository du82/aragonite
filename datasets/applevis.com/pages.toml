["https://applevis.com/blog/apple-vision-accessibility-2024-applevis-report-card"]
title = "Apple Vision Accessibility: The 2024 AppleVis Report Card | AppleVis"
description = "AppleVis is pleased to unveil our 2024 Apple Vision Accessibility Report Card. The only report of its kind to focus specifically on the needs of people who are blind, DeafBlind, or who have low vision, the Apple Vision Accessibility Report Card provides valuable insights into the lived experiences and opinions of this user group."
full_description = '''By AppleVis, 26 February, 2025 AppleVis is pleased to unveil our 2024 Apple Vision Accessibility Report Card. The only report of its kind to focus specifically on the needs of people who are blind, DeafBlind, or who have low vision, the Apple Vision Accessibility Report Card provides valuable insights into the lived experiences and opinions of this user group. Inspired by the Six Colors Apple Report Card and now in its third year, the aim of the Apple Vision Accessibility Report Card is to present information to Apple, our community, and other key stakeholders about the real-world user experience for Apple product users who are blind, DeafBlind, or who have low vision. In so doing, it is our hope that this report card will be the starting point for constructive discussions about the current state of accessibility on Apple’s platforms; influence Apple’s 2025 accessibility roadmap; and be a force for positive change. To compile the ratings and comments included in this report card, we conducted a comprehensive survey where blind, DeafBlind, and low vision participants rated their experience using Apple's major platforms (iOS, iPadOS, macOS, watchOS, and tvOS) with the available vision accessibility features provided in the software. (visionOS was not included in the survey at this time.) The ratings were on a scale of 1 to 5, with 1 being the least favorable rating and 5 being the most favorable. Additionally, we invited participants to provide detailed written feedback and suggestions for enhancing Apple's vision accessibility features and user experience. The survey also included questions that assessed Apple's performance in addressing vision-related bugs, as well as the new vision accessibility features added in 2024. The report card is separated into the following sections (all navigable by heading): Ratings Snapshot: This section gives an overview of the highest and lowest ratings across all surveyed platforms and vision accessibility options, including a listing of the most-changed ratings in 2024. VoiceOver: This section presents ratings and selected participant comments regarding VoiceOver features and user experience across Apple’s platforms. Braille: This section presents ratings and selected participant comments regarding braille features and user experience across Apple’s platforms. Low Vision: This section presents ratings and selected participant comments regarding low vision features and user experience across Apple’s platforms. Other Ratings and Comments: This section presents: Ratings and comments regarding the new accessibility features for blind, DeafBlind, and low vision users introduced by Apple in 2024; Ratings and comments regarding Apple’s performance in 2024 in addressing VoiceOver, braille, and low vision-related bugs; Comments on how Apple can improve their vision accessibility experience and better serve their blind, DeafBlind, and low vision customers; and Additional feedback on the experience of using Apple products as a person who is blind, DeafBlind, or who has low vision. Each rating includes the corresponding values for 2022 and 2023, allowing readers to compare changes over time. Ratings were also assigned a letter grade; the grading scale may be found at the end of this report under the “Grading Scale” heading. In addition to rating the vision accessibility features on Apple’s platforms, we asked survey participants to provide comments on each of the aspects being rated. Included with each rating is a curated selection of the responses we received. Participants were asked whether they would like their comments to be quoted anonymously or attributed to their AppleVis user name. To ensure accurate and authentic representation of community voices, AppleVis did not edit the content (diction, grammar, spelling, etc.) of participant comments. Comments were lightly formatted to ensure consistency of presentation. We hope you find our 2024 Apple Vision Accessibility Report Card to be both helpful and informative. If you have questions or feedback, please feel free to post a comment below. For media inquiries, please see the “Media Inquiries” section. Ratings Snapshot Below is a listing of the categories which received the highest and lowest ratings across all surveyed platforms and features, as well as a listing of the most-changed ratings in 2024: Highest Ratings: iPadOS Low Vision User Experience (4.5) iOS VoiceOver Features (4.4) iOS VoiceOver User Experience (4.3) iOS Braille Features (4.3) iOS Low Vision Features (4.3) iOS Low Vision User Experience (4.3) Lowest Ratings: MacOS VoiceOver Features (3.5) watchOS Braille Features (3.5) tvOS Low Vision User Experience (3.5) macOS Braille User Experience (3.3) macOS VoiceOver User Experience (3.2) Apple's Performance in 2024 in Addressing VoiceOver, Braille, and Low Vision-Related Bugs (3.2) Notable Increases in Satisfaction: The New Accessibility Features Introduced in 2024 for Blind, DeafBlind, and Low Vision Users (4.0, 3.7 in 2023) tvOS VoiceOver User Experience (3.8, 3.5 in 2023) iOS VoiceOver User Experience (4.3, 4.1 in 2023) iPadOS VoiceOver User Experience (4.2, 4.0 in 2023) watchOS VoiceOver User Experience (4.1, 3.9 in 2023) iOS Braille Features (4.3, 4.1 in 2023) tvOS Braille User Experience (3.6, 3.4 in 2023) Apple's Performance in 2024 in Addressing VoiceOver, Braille, and Low Vision-Related Bugs (3.2, 3.0 in 2023) Largest Decreases in Satisfaction: tvOS Low Vision Features (3.7, 4.3 in 2023) macOS Low Vision Features (4.2, 4.7 in 2023) macOS Low Vision User Experience (4.0, 4.5 in 2023) tvOS Braille Features (3.6, 4.0 in 2023) tvOS Low Vision Features (4.1, 4.5 in 2023) tvOS VoiceOver Features (3.7, 4.0 in 2023) watchOS Braille User Experience (3.6, 3.9 in 2023) watchOS Braille Features (3.5, 3.7 in 2023) macOS Braille User Experience (3.3, 3.5 in 2023) VoiceOver VoiceOver Features Grade: B Satisfaction with VoiceOver features on iOS and iPadOS increased somewhat compared to 2023, while macOS, tvOS, and watchOS saw decreases in user satisfaction. The highest level of satisfaction was with VoiceOver features on iOS (4.4), while the lowest was with VoiceOver features on macOS (3.5). Overall: B (4.0) iOS: A (4.4) 2023: A (4.3) 2022: A (4.5) Satisfaction with VoiceOver features on iOS rose slightly from 2023 to 2024, but is not as high as it was in 2022. iPadOS: B (4.2) 2023: B (4.1) 2022: B (4.2) Satisfaction with VoiceOver features on iPadOS rose slightly from 2023 to 2024 but is at the same level as in 2022; suggesting that user satisfaction has remained nearly constant since our first report card. macOS: C (3.5) 2023: C (3.6) 2022: C (3.6) Satisfaction with VoiceOver features on macOS declined slightly in 2024 compared to 2023 in 2022. This is also reflected in participant comments. watchOS: B (4.0) 2023: B (4.1) 2022: B (4.1) There was a slight decrease in satisfaction with VoiceOver features on watchOS in 2024 when compared to 2023 and 2022. tvOS: B (3.7) 2023: B (4.0) 2022: C (3.5) Satisfaction with VoiceOver features on tvOS decreased somewhat from 2023 but is not as low as it was in 2022. Selected Comments on VoiceOver Features Summary: Overall, survey participants expressed satisfaction with the VoiceOver features available on iOS. Several participants expressed a desire for deeper AI integration for functionality like image description, photo labeling, voices, and screen recognition. Multiple participants expressed dissatisfaction with the VoiceOver features available on macOS, particularly when compared to iOS. People who use devices in languages other than English reported particular issues with VoiceOver unique to their language. Multiple participants expressed a desire for Apple to prioritize fixing existing bugs before introducing new features. “Voiceover on iOS is consistantly more reliable, more stable, and more up-to-date with features such as screen recognition and live recognition. Its web rendering is infinitely better with no responsiveness issues, and overall it is a thoroughly pleasant experience. Voiceover on the Mac could not be more different. It is lagging far behind alternatives on Windows in terms of features, particularly OCR, screen / image recognition, and performance within applications.” – Ashley “Over the last few years, the standards set by apple for accessibility in their products appears to be slipping; even as new issues are created in areas like basic browsing etc, the approach in addressing them have been lackadaisical, at the same time, my personal view is that apple hasn't at all utilized new aveniews offered by newer developments like AI for making their products accessible fully.” – Gokul “I think it would be good if they consolidate the rotor features such as character, word, line, and heading into one setting where you can flick one finger up and down to choose between them.” – Anonymous “IOS is definitly the most full featured apple product. There are so many in fact that even though I have been using IOS VoiceOver for 7 years now, I am still discovering new ones that I didn't know about. In particular, Screen reconition has gotten me past many spots which just fell short of accessible. I also love and use Braille screen input every day, which also helps me keep my braille skills up. I personally still love the VO experience on Mac OS, dispight all its objective flaws, but I must admit that it does suffer when comparing its feature set to IOS. I would especially like to see more of the new AI reconition features added to IOS (I would think my M3 powered MacBook would have more AI then my old Iphone SE). I think a native equivlent to braille screen input using the keyboard would also be cool to have on Mac OS. Still, it seems like Apple is slowly moving in the right direction with the last few updates, I just discovered recently that they had added a speak indention feature to Mac OS which makes coding much much easier.” – AERobert “1. VoiceOver fails to auto-switch to Persian even when Persian Dariush, or Espeak Persian, gets selected as the TTS engine. In other words, unlike most other languages, users have to switch to a Persian voice manually, via the Rotor, whenever Persian text is encountered. 2. VoiceOver lacks comprehensive online, AI-based image description features. It can't describe the current screen this way either. Android screen readers are ahead in this arena.” – Amir Soleimani “The VoiceOver features on iOS encompass a wide range of uses, which is very commendable. The Mac still falls behind.” – Devin Prater “The features aren't consistent across devices. For instance, screen recognition isn't available on macOS, but it is on iOS - not a major issue for me, but it might be for some users.” – Jason White “I think it would be extremely useful to have more Voices, especially with AI natural voices coming more into the mainstream. Regarding Voiceover, I feel that more screen reader customization would make the Mac experience even more powerful. In terms of Voiceover overall, I would like stronger and smoother connectivity with non Apple bluetooth devices. At the moment, Voiceover lags with certain headsets and smart glasses.” – DarkWingsRaven “As am an egyptian user, I need the arabic language to be improved liek the english” – Ramy “They are pretty good but it would be great if bugs were worked out before release.” – Grace “Mac Voiceover features are very deficient and rudimentary. It seems Apple does not expect blind users will be buying any macbooks and so doesn't care to improve it. Voiceover on Iphone is however quite good.” – Simply “Could do with an injection of, you guessed it, AI, I'm thinking especially in the photos app. Automatic detailed labelling of images could be a very powerful feature. On that matter, VOCR, should be purchased by apple for a billion pounds and integrated. It's the evolution of mac voiceover that apple seems to have given up on. I'd also like some more good voices like the microsoft voices, though I forget the names of them. Not a must have, but a little good variation would be appreciated. I still don't think keyboards voiceover and iPad work well together, though I've not tried for some time. I feel that, more and more, iPad is becoming the device most of us need but, in terms of reliability for accessibility, behaviours in things like safari, navigation, text editting, it is stil rough around the edges.” – Oliver “They are exceptionally good. An improvement would be to be aable to hear text attributes when reading, such as underlining, boldface, etc. I know these are available in apps like Pages, but it could be helpful to have access to this kind of information anywhere.” – Christo “Fantastic standard built-in functionality I could not do without.” – Anonymous “I have always been grateful to Apple for adding accessibility functions including VoiceOver to each device. However, as the functions of the system become more and more complex, and many design ideas of the system are now completely from a visual-friendly perspective, it is difficult for VoiceOver users. What we feel is that many of the system's new features are either not supported by VoiceOver or are very awkward to use.” – Anonymous “When it comes to iOS, Apple have knocked it out of the park in terms of new features this year with the release of iOS 18. The new Braille Screen input features are incredible, and the VoiceOver tutorial has been needed for a long time and will be a huge help to new users of the iPhone.” – Callum Stoneman “I appreciate that Apple is trying to provide access to new visual features like genmoji as they have with other features throughout the years. Generally VoiceOver features are equalizers for me. I'd much rather experience fixes and adjustments for focus and other reported issues with VoiceOver.” – Jenine “Several positive moves were made in this direction in 2024, such as the VoiceOver tutorial and revamped Braille Screen Input experience in iOS 18, as well as the unified command customization model and revamped VoiceOver tutorial in macOS Sequoia. Apple also gets credit in this category for finally including a "What's new in VoiceOver" sheet in VoiceOver Settings on iOS, something that's long been requested and that could increase the discoverability and overall awareness of new VoiceOver features. Apple's documentation of these, and other features, in my opinion, could still be improved, however their inclusion directly into the operating system is a step in the right direction.” – Tyler “Voiceover has definitely made it possible to use my iPhone and overall it's been a gamechanger. The features are very customizable especially the lock screen (Customizing the lock screen should have been implemented eons ago.) Voiceover has enabled me to use the iPhone in ways that I couldn't have imagined.” – Ann Marie B “navigating through the island isn't always acurat or even there at all. I am aware that this feature will disappear when there i'''
