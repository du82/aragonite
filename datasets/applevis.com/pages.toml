h information but don't want to deal with widgets or the Weather app. To add weather information to your Mac's menu bar, go to System Settings > Control Center, and choose "Show in menu bar" from the "Weather" popup menu. The temperature for your current location, if the Weather app has previously been granted access to it,…Podcast FileAppleVisPodcast1637.mp3 (3.94 MB) Quick Tip: Sending Messenger Messages Hands-Free with Siri on iOSFriday, January 10, 2025 In this episode, Jessica Dale demonstrates how to send Messenger messages using Siri on iOS and iPadOS. To set this up, go to Settings > Apps > Messenger > Apple Intelligence & Siri, and toggle the "Use with Siri requests" switch on. To send a message, engage Siri and say something like "Use Messenger to message [person]." Siri should then prompt you for the contents of the message and then offer to send it, as it does when sending a message using the built-in Messages…Podcast FileAppleVisPodcast1636.mp3 (2.78 MB) Apple Crunch December 2024: The Air Flop and the Return of the Bend Gate Friday, January 3, 2025 In this edition of Apple Crunch, Thomas Domville, John Gassman, and Marty Sobo discuss recent Apple news and other topics of interest. Chapters: Introduction Results of the AppleVis Golden Apples Award for 2024 Apple iOS 18.2 Goes Public Let's Talk Apple Hardware Rumors for Spring Let's Talk Apple Hardware Rumors for Fall Closing Resources: …Podcast FileAppleVisPodcast1635.mp3 (75.23 MB) Unlock the World of Internet Radio with Broadcasts for iOSMonday, December 30, 2024 In this podcast, Dennis Long showcases the Broadcasts app for iOS, a lightweight and user-friendly tool for streaming internet radio and organizing stations into a personalized library. Broadcasts supports a variety of online radio formats, enabling users to explore and enjoy their favorite stations from around the globe. Key features of the app include: - Custom Libraries: Easily curate and organize your favorite stations for quick access. - Cross-…Podcast FileAppleVisPodcast1634_0.mp3 (15.71 MB) Personalized Emojis Made Easy: Genmoji on iOS ExplainedTuesday, December 17, 2024 In this episode, Thomas Domville demonstrates how to use Genmoji on iOS. Genmoji, introduced in iOS 18.2, is an AI-powered feature that allows users to create custom emojis simply by describing them in text. This innovative tool enables personalized and unique emojis, going beyond the standard set to enhance self-expression in messaging and other apps. How to Create a Genmoji: Update Your iPhone: Make sure your device is running iOS 18.2. Go…Podcast FileAppleVisPodcast1634.mp3 (22.21 MB) Apple Crunch November 2024: Where's the Intelligence Exactly?Tuesday, December 3, 2024 In this month's edition of Apple Crunch, Thomas Domville, Marty Sobo, and John Gassman discuss recent Apple news and other topics of interest. Chapters: Introduction Results of the AppleVis First Ever Survey by the Community Apple Intelligence has Arrived with iOS 18.1 Looking Forward to iOS 18.2 Apple is reportedly moving away from annual launches Closing Resources: …Podcast FileAppleVisPodcast1633.mp3 (85 MB) A Demonstration and Overview of iPhone MirroringSaturday, November 2, 2024 In this episode, Tyler demonstrates the basics of using iPhone Mirroring, a feature that allows you to use your iPhone from your Mac, with VoiceOver. Topics covered in this demonstration include: General description of the feature and its current issues and limitations System requirements and setup Navigating and dealing with various elements of the iOS user interface, such as the Home Screen, rotor actions, and context menus, using macOS Controlling…Podcast FileAppleVisPodcast1632.mp3 (10.52 MB) AppleVis Extra 101: Future Echoes - In conversation with the team behind Echo Vision smart glassesWednesday, October 30, 2024 Welcome to AppleVis Extra 101, where Dave Nason is joined by Xiaoran Wang and Huasong Cao from Agiga, the team behind the upcoming Echo Vision smart glasses. Check out some early demos, with more to come, on their YouTube channel at: https://www.youtube.com/@AgigaAi/videos And learn more on their website at: https://echovision.agiga.ai/ The team would love to hear your feedback, so please comment below, or contact them through the website. Transcript Disclaimer: This…Podcast FileAppleVisPodcast1631.mp3 (36.14 MB) From Friendly to Professional: The Power of iOS Writing ToolsSunday, October 27, 2024 In this episode, Thomas Domville demonstrates how to use Writing Tools in iOS 18.1. Writing Tools, released as part of the first set of Apple Intelligence features in iOS 18.1 is an impressive feature that allows users to rewrite text in different tones, such as friendly, professional, and concise, with an added proofread option. To use this feature, open the text you want to edit and highlight it. Within the Edit section of your Rotor, you'll find the Writing Tools option. Different…Podcast FileAppleVisPodcast1630.mp3 (22.6 MB) Get More Out of Your iPhone: Recording and Transcription on iOSSaturday, October 26, 2024 In this episode, Thomas Domville demonstrates the call recording and transcription feature in iOS 18.1. This update brings an exciting built-in call recording capability to iPhones. Recording a call is straightforward: just double-tap the Record button in the top left corner during a call (note that you might need to hide the keypad to see the button). A voice message will notify all participants that the call is being recorded. These recordings are saved directly in the Notes app, which…Podcast FileAppleVisPodcast1629.mp3 (11.36 MB) How to Use Audio Ducking on iOS for Clearer VoiceOverFriday, October 4, 2024 In this podcast, Thomas Domville showcases the Audio Ducking feature on iOS. Audio Ducking automatically reduces the volume of background audio when a foreground sound, such as a notification or VoiceOver, is played. This feature is particularly beneficial for accessibility, ensuring that important sounds or speech are clearly audible without being overshadowed by other audio. To adjust the Audio Ducking settings on iOS, follow these steps: Open Settings: Launch the…Podcast FileAppleVisPodcast1628.mp3 (14.68 MB) Apple Crunch September 2024: Where's the Apple Intelligence?Friday, September 27, 2024 In this month's edition of Apple Crunch, Thomas Domville, John Gassman, and Marty Sobo discuss recent Apple news and other topics of interest. Topics featured in this episode include: AppleVis Returns and AppleVis Unleashed Gets a new Name Thoughts on the Apple's "It's Glowtime" Product Line At Last the iOS 18 is Out Where's the Apple Intelligence? Apple working on a cheaper Apple Vision headset, a second gen Apple Vision Pro, and…Podcast FileAppleVisPodcast1627.mp3 (86.81 MB) Enhance Accessibility: Adding Voices to VoiceOver Rotor Voices on iOSWednesday, September 25, 2024 In this podcast, Thomas Domville reviews and demonstrates the Voices feature, which allows you to customize multiple VoiceOver voices to suit your needs. You can quickly access these voices using the Rotor Actions or the VoiceOver Quick Settings. How to Add VoiceOver Voices to the Voices Feature on iOS Open Settings: Start by opening the Settings app with a double tap on your iOS device. Go to Accessibility: Scroll down and double tap on "Accessibility."…Podcast FileAppleVisPodcast1626.mp3 (23.81 MB) How to Customize the Lock Screen on iOSSaturday, September 21, 2024 In this episode, Tyler demonstrates how to customize the lock screen on iOS, specifically how to remove the flashlight and camera buttons and replace them with other controls. In addition to viewing the time, date, and notifications, the Lock Screen can be customized to remove or replace the camera and flashlight buttons with other controls, or show certain types of information at a glance, such as upcoming calendar events or current weather conditions. To customize the Lock Screen,…Podcast FileAppleVisPodcast1625.mp3 (9.53 MB) A Demonstration and Walkthrough of VoiceOver Command Customization on macOSMonday, September 16, 2024 In this episode, Tyler demonstrates some of VoiceOver's command customization capabilities on macOS. If you find a particular VoiceOver command difficult to perform, or discover a function in the Commands menu that doesn’t have a default command, you can assign your own custom command to it. In addition, you can configure commands to open apps and run scripts, so you don’t have to locate them manually. Commands can be configured by going to VoiceOver Utility > Commands,…Podcast FileAppleVisPodcast1624.mp3 (13.87 MB) What's New in iOS 18 for AccessibilityMonday, September 16, 2024 In this episode, Thomas Domville gives us an overview of new accessibility features for blind, DeafBlind, and visually impaired users in iOS 18. Topics covered include: Live Recognition Comes to the Rotor Voices Rotor Improvements to Audio Ducking VoiceOver Tutorial VoiceOver Startup Haptic Feedback Delay Before Selection New…Podcast FileAppleVisPodcast'''
