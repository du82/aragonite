["https://applevis.com/forum/ios-ipados/wine-iphone-ipad-mac"]
title = "wine for iPhone iPad and mac | AppleVis"
description = "Who would I have to contact in order to get wine, the windows compatibility layer, to run good on both mac, if it doesn't already, and on iPhone and iPad? We don't need a full blown windows virtual machine running just to play jim kitchen's games with sapi5 tts such as decTalk or a future sapi5 bestSpeech tts otherwise known as humanWare braille-note classic Keynote Gold tts, we just need a compatibility layer to do that. It has been done before on Linux and even android. So why not mac and iPhone and iPad?"
full_description = '''By Josh Kennedy, 2 March, 2025 Forum iOS and iPadOS Who would I have to contact in order to get wine, the windows compatibility layer, to run good on both mac, if it doesn't already, and on iPhone and iPad? We don't need a full blown windows virtual machine running just to play jim kitchen's games with sapi5 tts such as decTalk or a future sapi5 bestSpeech tts otherwise known as humanWare braille-note classic Keynote Gold tts, we just need a compatibility layer to do that. It has been done before on Linux and even android. So why not mac and iPhone and iPad? though you would need a bluetooth keyboard to play Jim Kitchen's games running under wine. And, since wine is not a full-blown windows OS running in a virtual machine, this means the games would run at the speed of the mac or iPhone or iPad itself because you are not installing a full version of windows in a virtual machine, (vm). You are just using a compatibility layer, the minimum stuff needed to make the games and the sapi5 tts to get up and running... and wine is also open source and supports software going back to windows 3.1. Winie is good for running individual windows apps, apps that do not need a full-blown copy of windows in a virtual machine (vm). Options Log in or register to post comments Comments no By jim pickens on Monday, March 3, 2025 - 13:31 no so how could it be done? By Dennis Long on Monday, March 3, 2025 - 14:31 So how could it be done on the Mac? No. By Devin Prater on Monday, March 3, 2025 - 14:31 No. It's already on the Mac. I… By jim pickens on Monday, March 3, 2025 - 14:31 It's already on the Mac. I think it was discontinued, but you might have some luck running it. And there's always crossover if you're willing to pay. how much is crossover? By Dennis Long on Monday, March 3, 2025 - 14:31 Is it a one off or a subscription? wine for iphone By Josh Kennedy on Monday, March 3, 2025 - 15:31 now all we need is wine for iPhone and iPad, or crossover for iPhone and iPad. Probly will never happen By Joshua on Monday, March 3, 2025 - 15:31 Apple is to restrictive for this, it’s just how they are, this is I like android better Homebrew was, Wine for iPhone iPad and mac By Dominique Stansberry on Tuesday, March 4, 2025 - 16:53 I can't speak for iPhone or iPad, but Homebrew on Mac could install Wine. Try that. "brew install Wine" ... Removing the quotes of course. if you have Home Brew installed. wine for mac By Josh Kennedy on Tuesday, March 4, 2025 - 17:21 I have a windows pc, not a mac. It would be nice if wine were on the iPhone and iPad app store.'''
