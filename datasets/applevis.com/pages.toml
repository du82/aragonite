["https://applevis.com/forum/ios-ipados/introducing-anytime-podcast-app-seeking-voiceover-feedback"]
title = "Introducing Anytime podcast app and seeking VoiceOver feedback | AppleVis"
description = "Hi everyone, I have developed a free and open source podcast app, called Anytime Podcast Player, which is available for iOS and Android. I've been working on improving accessibility within the app and particularly the screen reader support, but I know there is more improvements to be made and I was recommended this forum - thank you Robert. I would be very grateful for any feedback, tips or suggestions that can help me improve the accessibility in Anytime and make it a better app if anyone would like to try it."
full_description = '''By Ben Hills, 10 April, 2024 Forum iOS and iPadOS Hi everyone, I have developed a free and open source podcast app, called Anytime Podcast Player, which is available for iOS and Android. I've been working on improving accessibility within the app and particularly the screen reader support, but I know there is more improvements to be made and I was recommended this forum - thank you Robert. I would be very grateful for any feedback, tips or suggestions that can help me improve the accessibility in Anytime and make it a better app if anyone would like to try it. It's available on the App Store: https://apps.apple.com/us/app/anytime-podcast-player/id1582300839#?platform=iphone Many thanks, Ben. Options Log in or register to post comments Comments Very cool! By Mlth on Sunday, April 7, 2024 - 15:17 I'm looking forward to giving it a spin! It's always wonderful to experience a developer who considers accessibility and solicits feedback from the community - kudos from here! Best M please use actions where appropiate By Dennis Long on Sunday, April 7, 2024 - 15:17 rotor actions allow things to get done quickly. Please add these where appropiate. Will do By Dave Nason on Sunday, April 7, 2024 - 15:17 Hi Ben, Thanks for reaching out on this. I had read about the app on Mastodon so had been meaning to check it out. I’ve just downloaded it, so will send on some more feedback in the coming days, but a couple of things I’ve noticed straight away: In Settings, VoiceOver doesn’t call out headings, so I don’t know what is a section heading and what is a selectable item. When I opened the Search Provider option, I can’t back out of it unless I change my current selection. The layout options do not tell me which one is currently selected. Where there are switches, such as Dark Theme, it’s nicer if the item and the switch are contained in a single VoiceOver element. On a related note, it’d be nice if light / dark mode could also simply follow my system choice. i.e. choose Light, Dark or System. Outside of accessibility, will there be global settings for things like how many episodes of a podcast to keep, playback speed, and ability to stream rather than download? One thing I like straight away is that the Discovery section appears to be localised, that’s the one thing that annoys me in Overcast, which just seems to promote what’s popular in America. Cheers, Dave Thank you for the initial feedback By Ben Hills on Sunday, April 7, 2024 - 15:17 Thanks everyone for the initial feedback. Dennis - after I received your email the other day, I have been looking into the rotor features within VoiceOver. Unfortunately, it looks like the tools I use to build this app do not currently support Rotor. I'm still researching this, and I'm hoping there is a solution. Dave - thanks for the feedback around the UI, I will implement all of those fixes. There is also an open issue for updating the theme handling to default to the system theme, so that will be fixed too. Outside of the accessibility issues, yes, I do have plans for things like auto downloads and keeping only so many episodes. Anytime does support different playback speeds, and it is a global setting, but it is accessed from the main player screen - if you adjust the speed for one podcast, it will stick with that speed for all. Anytime will stream an episode by default, unless you have previously downloaded it. One piece of feedback I received is that, with the download and play buttons next to each episode in the list, it takes a lot of swipes to move through the episodes. I'm looking at ways I can improve this. I've not tried it yet but... By Brad on Sunday, April 14, 2024 - 15:17 I think sounds might be nice, kind of like how downcast does it. they have a similar issue where you have episode one, then a more info button about episode 1 so you do have to do a lot of flicking. Of course you'd be able to turn the sounds on and off too, I might like sounds but others won't, and they should be very short too. I'll check this out once a couple more things have been added. It would be really nice if you could use the rotor actions to speed things up quite a bit, I understand from your point of view it would probably be very annoying to remake the app and change the language/framework its built in, and if that's not something you're willing to do I understand but it would make things quite a bit faster for us. Unfortunately as far as I know; that rotor kind of thing doesn't exist with android so if you want to keep it the same across the board that's also understandable. Re By Dave Nason on Sunday, April 14, 2024 - 15:17 Thanks Ben, sounds good. Glad there is a speed setting, though personally I prefer when there is a global setting and a per podcast setting. This is because there are certain podcasts I always listen to at a higher speed. I appreciate though that this is not a VoiceOver accessibility thing. Yes, the multiple swipes to get through a list is a frustration. The Actions menu would definitely be the most elegant and user friendly approach for VoiceOver users if it can be done. Brad is incorrect, TalkBack on Android does also support Actions, though I’ve no idea how similar or different the implementation is. Another option could be to put such controls into a context menu, but that may not work so well for non-VoiceOver users, unless there’s a way around that. Dave Oo, cool. By Brad on Sunday, April 14, 2024 - 15:17 I'm glad I'm incorrect. I did end up downloading the app and have noticed when importing an OPML file there's no import from overcast or downcast options, could that be a thing that's added? I hope this podcast app becomes what I need, I don't mind paying for apps but free is always great :) Another thing is volume boost, that's a big paid for feature on overcast and I believe downcast too. Oh and also it would be nice if we could leave and read reviews on podcasts as you can't seam to do that with overcast and downcast. You might want to also think about adding a donate button to help keep the app up on the app stores. Chapters in podcasts? By kool_turk on Sunday, April 14, 2024 - 15:17 I can't seem to find the chapters for some of the podcasts I'm subscribed to. I'm wondering if it supports chapters, because I don't see it with Voiceover. But I do like the fact that I can import and export OPML files, something you can't do with Apple's native Podcasts app. UI/UX enhancements By Ben Hills on Sunday, April 14, 2024 - 15:17 Brad - the sounds idea is an interesting one. I might pick up a copy of Downcast and see how it does it. The Rotor support is a bit frustrating, though I will do some more research. In my limited testing with it, the words & characters options do seem to work on blocks of text. OPML import at the moment launches the file selector for you to pick a file. What I plan to do is support sharing so, for example, you can do an export in Downcast as a share and pick Anytime as the app to share with. Dave - At the moment, each episode item line displays the episode image, title details with the download and play buttons to the right. Double tapping an episode line expands to show further controls. One idea I have had, is to move the download and play controls into the expanded section. This means that each swipe right would move down another episode. When you want to play an episode, double tap to expand the options and swipe to play. I would also make this UI change an option within settings. What do you think of that idea? Brad - volume boost is on the to-do list. I have this working on the Android version, but have yet to get it working on iOS - but I'll get there :) kool-turk (great handle). Anytime supports Podcasting 2.0 chapters, but not chapters embedded in the MP3 which is how I think Apple Podcasts handles them. For episodes that have PC2.0 chapters, there will be an additional tab entry in the main player. I'll stick to overcast for now. By Brad on Sunday, April 14, 2024 - 15:17 But this is a great start and can hopefully only get better from here. re: UI/UX enhancements By kool_turk on Sunday, April 14, 2024 - 15:17 Your idea sounds like a better way to quickly scroll through episodes. It would certainly cut down on the swipes just to get to the next episode. I was wondering if there is a way to refresh podcasts manually. I prefer to update my feeds manually and most podcast clients that I have used have a refresh button. On Windows, I'm currently using Grover Podcast, and it meets my needs. It just doesn't have a volume booster or a caption option. Although, I think captioning podcasts is more of an Apple thing, unless podcasters do it themselves. I only know of one podcast that does it, and he was captioning his podcast before Apple decided to add captions to podcasts in their directory, but only for podcasts in their directory. That's the clincher - they have to be in the Apple Podcast directory before they can be captioned by their AI. Wow, talk about going off on a tangent. I haven't tried exporting podcasts yet with this app, I mean, it seems easy enough. I'm wondering how I would get the OPML file from my phone to, say, a Windows PC. I guess I'll just have to play with it some more. OMPL import & export By Ben Hills on Sunday, April 14, 2024 - 15:17 A manual refresh is possible by performing a pull-down gesture on the podcast details page; however, this doesn't work well with VoiceOver or TalkBack and it's not very obvious. I will add a manual refresh option to the menu button to the right of the follow/unfollow button. The new Apple transcript generation does only work in Apple Podcasts, but if there is an external Podcasting 2.0 transcript in the feed, Apple will honor that. I am hoping this will start to bring the price of transcript services down so more podcasters can use them and they can appear in more apps - not just Apple Podcasts. To export an OPML file from Anytime and get it in to Grove, the way I would do it is to setup a folder share on the Windows PC. Then, in the Apple Files app, use the 'Connect to server' option to connect to that share. Once that is in place, the files app should remember that share from then on. In Anytime (or any podcast app that can export) you can select the OPML Export option and share it with the files app. In the files app, navigate to the share on the Windows PC and save the file there. In Grove you can then import the OPML file from that share. It's a bit of a fiddle to setup, but once done it's a useful way to get the files across. I use this method myself quite a lot, when I need to transfer OPML files between Android & iOS when I am testing. UI and other feedback By Dave Nason on Sunday, April 14, 2024 - 15:17 Hi again. 1. Yes, I think that idea of moving all controls into the expanded section would work pretty well. The way VoiceOver is currently speaking on these list items is a problem however. On each item, VoiceOver first speaks "Episode list item, showing image, summary and main controls", before speaking the episode title etc. This kind of verbosity is incredibly irritating and would immediately put me off using the app. VoiceOver should just speak the episode details. At the end of the details, you could have it simply say something shorter like "Controls collapsed" or "Controls expanded". But it'd be important this is after the episode title etc, not before them. 1a. It's probably still worth exploring the Actions menu in the rotor as it's a very familiar control, but the above could work well I reckon. Yes, you should get the likes of Characters, Words etc in the rotor for free so to speak, but I don't know what is required to get Actions. Hopefully other developers can help you. 1b. When I do expand the full controls, and then select the More button, a couple of things confuse me. A control says "Collapsed, double tap to expand" - I can't tell what this does as nothing further seems to expand beyond what is already. Also, if I swipe to the last item, it is something VoiceOver calls "Scrim" - what is this? 2. When on the main screen for a podcast with the list of episodes, there is a button next to Unfollow and Options Menu called Sleep Timer. Is this an incorrect label? The items in the menu seem to be an episode filter feature. Plus this menu also includes something called Scrim. 3. There's a default VoiceOver gesture called the "scrub" which acts as Escape / Back. Often it would be our equivalent to swiping from left to right to go back, that sighted users would do. While that sighted method is working in the app, I've noticed the VoiceOver scrub gesture though is not, meaning we have to find the Back button to go back. 4. I'm having problems scrolling long lists. 4a. Firstly, when I scroll a list of episodes using the three finger up / down gestures (our equivalent to swiping up / down with one finger for sighted users), I'm not getting the normal sound, spoken or haptic feedback I'd expect. 4b. There is no vertical scrollbar on the right of the screen. I don't know about anyone else, but I find this incredibly useful for quickly scrolling long lists. 5. I had some issues importing an OPML file. I found the option and selected the file no problem. However the import got stuck at 10% progress, with the name of a podcast on screen. My best guess is that the podcast it got stuck on no longer exists in the iTunes library or whatever, but I had no option to simply skip it. I had to cancel the whole operation, and was left with only 10 of the 80 or so podcasts I was trying to import. Cheers, Dave re: UI/UX enhancements By Ernesto melendez on Sunday, April 14, 2024 - 15:17 I think the developer didn't get the concept of what the router option actions does for us. So the facebook app is an example of how actions work. Not a good one, but still. Visually, the app shows the like, comment and more buttons to the right of posts like the episode list does for the player, but to Voiceover, you have to set the router to the actions option and swipe up and down to see the set of options, like, comment etc, Too voiceOver the visual like comment and more button's aren't shown. once the post is opened, the facebook post has all the buttons shown. but on the list of posts it uses the actions router option. so For the podcast player, you could have the actions to play, download, etc in the voiceover actions menu, and not in the way of scrolling through episodes or podcasts. Maybe someone can explain this much much better than i can, but hopefully this kind of helps a bit. Re: UI and other feedback By Ben Hills on Sunday, April 14, 2024 - 15:17 Hi Dave, Thank you for the detailed feedback, I really appreciate it. 1. Thanks. I will experiment with moving the controls around, or maybe taking a leaf out of Overcast's book and moving the controls to a popup menu when the screen reader is on. I will re-work and reduce the amount of speech on the items and move the more prominent information to the start '''
