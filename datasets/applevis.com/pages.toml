full_description = "Guides Displaying 1 - 20 of 161 Filter by tag - Any -AccessoriesApple TVApple WatchBrailleGamingiOSiOS and iPadOS AppsiPadiPadOSiPhoneiTunes SoftwareMac AppsmacOSMiscellaneousPhotographyProgramming (iOS)Programming (macOS)VoiceOver Finding Your Way Home in a (Home) Buttonless World: Using an iOS Device Without a Home ButtonPosted on Friday, February 28, 2025 by Scott DavertIntroduction With the recent release of the new iPhone 16e, this means the end of the Home Button for iPhone users. Those who have been using iPhone SE's for years will now have to face not having a phone on the market which has the Home Button. We can't bring Touch ID back, but we can do something about duplicating the function of the Home Button. While many users have adapted in various ways,…21 comments : last update or comment 3 days 13 hours ago The better way to control your iDevice from your macPosted on Monday, February 24, 2025 by Levi GobinIntro For those who may not like the current implementation of iPhone mirroring, there is a free solution to do the same thing, which might be even easier compared to the iPhone mirroring app. As a bonus, this method also works on iPads as well. How it works: This approach uses a free app called Keypad, which is free for one device. The in app purchase unlocks the ability to…1 comments : last update or comment 4 days 20 hours ago a Guide to Verbosity Options in macOS VoiceOverPosted on Saturday, February 1, 2025 by Levi GobinFor macOS Sequoia 15.3 Intro This guide discusses the many ways you can change verbosity options in macOS VoiceOver, and how they work. The Purpose of This Guide This guide is here to explain in great detail how the plethora of verbosity options can affect the way VoiceOver behaves. If VoiceOver is or isn't speaking something you want it to, this guide will hopefully allow you to configure VoiceOver the way you want it to behave. Speech and…11 comments : last update or comment 1 month ago Managing Credentials and Securing Accounts with Apple Passwords on iOSPosted on Monday, April 8, 2024 by TylerFor iOS 18 Intro If you’re like most people, you likely have many online accounts with usernames and passwords. In this guide, I will describe how Apple Passwords, the password manager built into iOS, iPadOS, and other Apple platforms, can help you create, use, and manage strong credentials for your online accounts. While Apple Passwords is also available on macOS, as well as Chromium-based browsers on other operating systems, this guide will focus primarily on how…2 comments : last update or comment 4 months 1 week ago Add Widgets to Your Desktop in macOS SonomaPosted on Monday, February 19, 2024 by SebbyOne of the marquee features of macOS Sonoma is widgets on the desktop. The widgets can come from Mac apps, just as they could before in previous versions of macOS, where they appeared in Notification Centre. New to Sonoma, they can now also come from select iPhone apps running on your nearby iPhone. This is a pretty cool and useful feature, as it goes, for those…2 comments : last update or comment 2 months 4 weeks ago A Guide to Information Security and Privacy on macOSPosted on Monday, January 22, 2024 by TylerFor macOS Sequoia Intro If you own a computer or mobile device, you probably know that while it can do some amazing things, the fact that it is used to store and handle some of your most personal and sensitive data makes securing it essential. In this guide, I will give an overview of some of the security, privacy, and anti-malware features included in macOS, in order to give you a clearer understanding of what you should and shouldn’t use in your situation. Keep in mind…4 comments : last update or comment 3 months ago Managing Credentials and Securing Accounts with Apple Passwords on macOSPosted on Monday, December 18, 2023 by TylerFor macOS Sequoia Intro If you’re like most people, you likely have many online accounts with usernames and passwords. In this guide, I will describe how Apple Passwords, the password manager built into macOS and other Apple platforms, can help you create, use, and manage strong credentials for your online accounts. While Apple Passwords is also available on iOS and iPadOS, as well as Chromium-based browsers, this guide will focus primarily on how to use it with…3 comments : last update or comment 4 months 1 week ago Turning your MacBook into a CCTV using your iPhonePosted on Monday, October 2, 2023 by Tyson ErnstGreetings Applevis-ionaries. (visionaries) I wanted to share a method I devised this morning while working with a low vision client for turning your MacBook into a CCTV using your iPhone. You will need to have a camera stand which can hold your iPhone at about 10 inches above the item you are wanting to magnify. I used a folding, portable old-style scan stand unit with an internal light strip I’ve had for over a decade by now, and it worked beautifully. An external monitor is…1 comments : last update or comment 1 year 5 months ago Working with the iOS User GuidePosted on Tuesday, September 5, 2023 by Deborah ArmstrongDid you know that you can read the entire iPhone user manual through your browser online? This is also true for Mac, iPad, Apple watch and even the older iPod. This quick guide though focuses on iPhone. When you pull up the manual, the default is the current iOS, iOS 16 as of this writing. But a drop-down box lets you select an older version of the user guide. It will change to a newer iOS as the default when that is released. One big advantage of reading the user guide on…0 comments : last update or comment 1 year 5 months ago Mac VoiceOver keystrokes with alphabet and function keys in macOS 13 Ventura.Posted on Monday, September 4, 2023 by AryaDear All, I have attempted to cover all the mac voiceover keystrokes in combination with the alphabet keys, function keys and along with the modifier keys in the form of a table for ready reference. Mac VoiceOver keystrokes with alphabet keys in macOS 13 Ventura VO key + Alpha keys Action VO key + Shift key + Alpha keys Action 2 VO key + Command key + Alpha keys Action 3 VO key + Command key + shift…4 comments : last update or comment 1 year 4 months ago Adding Polish to Your pages DocumentsPosted on Friday, August 18, 2023 by Kevin ShawIn my last 3 guides, I described how easy it is to create a document in Pages that looks aesthetically pleasing to a sighted user. If you have been following the series, you have learned pages is an extremely powerful word processor for the Mac. You can produce everything from letters, to flyers to fully laid out books that are ready for electronic or print publishing. The last 3 guides focused on the basics of formatting, using styles, adding keyboard shortcuts and using the…1 comments : last update or comment 10 months ago Labeling Elements on iOS and iPadOS: Uses and How To Do It Posted on Saturday, July 22, 2023 by Lily RoseHello, There will always be apps with one or more unlabeled elements or elements that have unclear labels. When we encounter an app of this nature, we may resign ourselves to deleting the app and maybe contacting the developer and hoping they'll fix it, but that's not the it's useful to know what they do, but sometimes you may want to take a step further and label the unlabeled elements. This has come in very useful for me and today I'd like to tell you all how to…11 comments : last update or comment 8 months 3 weeks ago macOS Beta Testing for the BeginnerPosted on Monday, July 3, 2023 by TylerIntro Each year in June, Apple previews the next major version of macOS, along with updates to its other software platforms, at its World Wide Developers Conference (WWDC.) At this event, Apple announces and demonstrates a select number of headlining new features, and makes a prerelease version available to developers so they can test the new software and provide feedback before the public release in October. This is important because when substantial feature additions and…4 comments : last update or comment 1 year 8 months ago iOS and iPadOS Beta Testing for the BeginnerPosted on Monday, July 3, 2023 by TylerIntro Each year in June, Apple previews the next major versions of iOS and iPadOS, along with updates to its other software platforms, at its World Wide Developers Conference (WWDC.) At this event, Apple announces and demonstrates a select number of headlining new features, and makes prerelease versions available to developers so they can test the new software and provide feedback before the public release in September. This is important because when substantial feature…0 comments : last update or comment 1 year 3 months ago A Quick Guide to the System Settings App in macOS VenturaPosted on Monday, October 24, 2022 by TylerIn macOS Ventura, Apple replaced the familiar System Preferences app with a new app called System Settings. This app is fully accessible with VoiceOver, however the interface is quite different and many settings have been relocated, which may at first be disorienting to longtime Mac users. However, the new layout may feel familiar if you’ve used iOS or iPadOS, and you may eventually find that the increased parody between the two platforms makes the experience of locating and changing…16 comments : last update or comment 3 months 2 weeks ago Directly editing text under Braille Screen Input without moving the rotorPosted on Sunday, October 9, 2022 by Paweł MasarczykIntroduction The following guide has been inspired by this episode of the Apfel-Fleger Podcast, a podcast in German for blind users of Apple products. All credit goes to Jürgen Fleger and his friend for discovering and presenting this little trick. One thing that Braille Screen Input apps for Android, the likes of Soft Braille Keyboard or Advanced Braille…15 comments : last update or comment 2 years 4 months ago Personal Power: Getting The Most From iOS as a Totally Blind userPosted on Friday, April 29, 2022 by Michael FeirHello, everyone. Two years and literally thousands of changes later, the second edition of Personal Power is now available. It's an ebook which I wrote and am giving away freely. Basically, the book takes people from setting up their iPhones to thriving in the iOS environment. It teaches how to use VoiceOver, the various parts of iOS, and a whole lot of apps. In fact, one of my major goals with this book was to point newcomers to a large collection of accessible apps. Many people get…15 comments : last update or comment 2 years 5 months ago Playing classic audio games on the Mac (including m1 architectures)Posted on Tuesday, April 12, 2022 by techluverHello everyone! Ever since I switched to the Mac, I've only really had one regret. I wished to play some of my old favorite audio games on the Mac. Parallels is a bit overcomplicated and resource heavy for my needs, but I've discovered with crossover by code weavers: https://www.codeweavers.com/crossover one can actually play a lot of audio games on the Mac. Some caveats: 1. anything that needs…0 comments : last update or comment 2 years 10 months ago Even More Formatting Fun with PagesPosted on Saturday, September 4, 2021 by Kevin Shaw In my first Pages guide, I described what certain typographic elements looked like such as bold text and underlining. In my second guide, I provided a crash course in how you can quickly apply styles in your Pages documents. In this guide, let’s tackle some more complex concepts. You can apply these to…10 comments : last update or comment 10 months ago Get access to a digital copy of your Covid-19 Vax card, on the flyPosted on Tuesday, August 24, 2021 by DrewWeberAs time rolls on, the digital Covid-19 Vax Card is one you may need to show quickly in ore places and situations. Though it may be saved in your photo library, how do you grab it quickly without searching? Though their are no doubt multiple ways to accomplish this, I will cover, using the Shortcuts, app, to make this happen. You first need a photo of your Vax card. If you took it on the day you got your final dose of the vaccination, look back at your photos library and it may be…0 comments : last update or comment 3 years 6 months ago Pagination Page 1 Page 2 Page 3 Page 4 Page 5 Page 6 Page 7 Page 8 Page 9 Next page Last page Browse by Category Accessories (9) Apple Watch (2) Braille (14) Gaming (20) iOS (83) iOS and iPadOS Apps (39) iPad (62) iPadOS (19) iPhone (73) iTunes Software (3) Mac Apps (37) macOS (56) Miscellaneous (21) Photography (3) Programming (iOS) (5) Programming (macOS) (3) VoiceOver (87) Site Information About AppleVis About Be My Eyes Download Be My Eyes From the App Store Newsletter FAQ Contact Unless stated otherwise, all content is copyright AppleVis. All rights reserved. © 2025 | Accessibility | Terms | Privacy | A Be My Eyes Company"
