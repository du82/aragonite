title = "Adventure To Fate: Core Quest | AppleVis"
description = "The follow-up to TouchArcades 2024 Game of The Year! Descend into the Core of the Dungeon, where the dark entity Thanatos awaits, spreading corruption and chaos. Adventure To Fate: Core Quest is a casual yet deeply strategic turn-based RPG featuring roguelike gameplay, endless customization, and an extensive bestiary that tracks every foe, their stats, skills, and loot. Uncover the secrets of six hand-crafted zones, collect powerful spirits, and wield legendary weapons forged by your own hands. The fate of the dungeon is in your hands, can you survive the quest to the Core?"
full_description = "Category Games Description of App The follow-up to TouchArcades 2024 Game of The Year! Descend into the Core of the Dungeon, where the dark entity Thanatos awaits, spreading corruption and chaos. Adventure To Fate: Core Quest is a casual yet deeply strategic turn-based RPG featuring roguelike gameplay, endless customization, and an extensive bestiary that tracks every foe, their stats, skills, and loot. Uncover the secrets of six hand-crafted zones, collect powerful spirits, and wield legendary weapons forged by your own hands. The fate of the dungeon is in your hands, can you survive the quest to the Core? -Features- Endless Character Customization -12 Playable Classes – Knight, Wizard, Rogue, Shadow Ranger, Cleric, Illusionist, Monk, Ancient Archer, Assassin, Witch, Paladin, Naturalist --Mystical Classes (Assassin, Witch, Paladin, Naturalist) bring a roguelike twist, offering unique skills and unpredictable battles -20 Races – Includes classic and new additions like Goblins, Night Elves, and Phantoms -30+ Spirits – Found during your journey, these mystical allies can now equip powerful items and spells, further customizing your strategy Custom Forge – Create Your Own Gear -Craft any weapon or item with a custom name, stats, and picture -Equip legendary gear across 12 slots (Weapons, Armor, Accessories & More) In-Depth Combat & Bestiary System -Robust Monster Tracker – Log every enemy’s stats, skills, and loot drops -700+ Spells & Skills – Master physical attacks, magic, summons, buffs, healing, and more -Multiple Playstyles – Choose between Classic RPG progression, Skill Trees, or Roguelike-style upgrades on level-up Explore a Handcrafted Dungeon World -6 Expansive, Hand-Crafted Zones – Each with its own atmosphere, secrets, and lore -Battle through nightmarish realms, from cursed crypts to molten wastelands, before facing Thanatos himself at the dungeon’s Core Endless Arena – Build Your Own Battles -Custom Dungeon Mode – Handpick any monsters, set the battle order, and create your own arena challenges -Take on wave-based survival fights and test your best builds A Fully Accessible RPG – Built for Immersion Adventure To Fate: Core Quest isn’t just accessible, it’s designed from the ground up to be a deeply immersive experience for blind and visually impaired players -VoiceOver Support – Every menu, battle, and exploration element is fully narrated -Designed for Touch Navigation – Smooth, intuitive controls ensure seamless gameplay -Immersive Audio Cues – From enemy attacks to loot drops, custom sound design enhances every interaction -Accessible Combat System – Strategic turn-based battles designed for precision, depth, and enjoyment without visual barriers -World-Building with Accessibility in Mind – Explore the dungeon’s handcrafted environments through detailed narration, audio-rich surroundings, and clear directional guidance Epic RPG Rock Soundtrack & Sound Design -Original RPG-Themed Rock Soundtrack by Aaron Cloutier -100s of new immersive sound effects to bring every battle and environment to life More Features -Fully accessible for the blind & vision-impaired (VoiceOver supported) -Hundreds of hours of gameplay with endless class combinations -Retro pixel art & immersive rock soundtrack -Auto-save system for quick pick-up-and-play gaming -Custom portrait design for comfortable play The Core of the Dungeon awaits, will you conquer it or become another lost soul in Thanatos' domain? Download Adventure To Fate: Core Quest and begin your journey today! Thank You for Supporting Accessible Gaming!!! By playing Adventure To Fate: Core Quest, you’re supporting indie gaming that puts accessibility at the forefront. Your support helps bring deep, immersive RPG experiences to all players, regardless of vision ability! Version 1.0 Free or Paid Paid Apple Watch Support No Device(s) App Was Tested On iPhone iOS Version 18.3.1 Accessibility Comments The game is fully accessible. VoiceOver Performance VoiceOver reads all page elements. Button Labeling All buttons are clearly labeled. Usability The app is fully accessible with VoiceOver and is easy to navigate and use. App Store Link https://apps.apple.com/us/app/adventure-to-fate-core-quest/id6529525011 Developer's Website https://adventuretofate.com/ Recommendations 2 people have recommended this appMost recently recommended by Mark P 10 hours 17 minutes ago Options Log in or register to post comments Comments Character Deletion By Mark P on Tuesday, March 4, 2025 - 16:46 This game is wonderful but I am a bit worried as a friend of mine was playing as an level 9 elf when his character vanished from the game. It sounds like he closed the game in the right way, as far as I know. Anyone else heard of this happening?"
