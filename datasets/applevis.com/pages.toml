["https://applevis.com/forum/android/iphone-16e-androids-pov"]
title = "Iphone 16E (From an Android's POV) | AppleVis"
description = "So, ... In many ways, this new iPhone 16E from Apple , reminds me of the old Galaxy S10E from back in the day. And could this be the year I at least have a modern iPhone unlocked to go along with my S23+ device as a daily driver? Who knows really... Magsafe isn't a dealbreaker if I did go back to it. I'm sure several manufacturers will make cases with Magsafe rings. I mean hey..."
full_description = '''By Trenton Matthews, 19 February, 2025 Forum Android So, ... In many ways, this new iPhone 16E from Apple , reminds me of the old Galaxy S10E from back in the day. And could this be the year I at least have a modern iPhone unlocked to go along with my S23+ device as a daily driver? Who knows really... Magsafe isn't a dealbreaker if I did go back to it. I'm sure several manufacturers will make cases with Magsafe rings. I mean hey... With Samsung making S24 users wait till at least April to get OneUI 7on their devices (and my S23+ most likely not getting Android 15 till May), Apple picked a good time to launch this. Options Log in or register to post comments Comments Magsafe By Brian on Thursday, February 20, 2025 - 15:30 MagSafe should not be the end all, be all, reason to buy or not buy a device. I am currently running an iPhone SE 2022, and it has MagSafe capability now, thanks to the lovely case I bought for it several months back. Overall I am liking the design of this latest iPhone. I would consider buying that as my next upgrade. That is, of course, assuming I don't go with my original plan, and switch to a Pixel 9 (or 10) Pro. Also, I am very glad this model will, "not", have a camera button. I know a few people that purchased the iPhone 16 when it first released, and absolutely hate that feature on their phones. The one thing i miss from iphone By Joshua on Thursday, February 20, 2025 - 15:30 Getting updates at the same time all around the world, Samsung should really do this i think Brian By Holger Fiallo on Thursday, February 20, 2025 - 15:30 Have the 16 pro max, I would not say I hate the camera button but it would had been better if Apple made the action button more flexible.Regarding the Pixel, keep hearing is good. The issue with android phones is that not all will work well with talkback such as 1, 2, 3 and others. They look nice when I listen to Flossy Carter reviewing them but not sure about them. Like 1+. Accessibleandroid… By TheBlindGuy07 on Thursday, February 20, 2025 - 15:30 Like 1+. Accessibleandroid have a "great" article about the new phones. I was furious when I first heard that magsafe isn't natively available but completely forgot that myself I had to buy a magsafe along for my iphone 14 for maximum compatibility. Nice workaround that magsafe users also do I think for the most part. I got a friend who has a… By Brian on Thursday, February 20, 2025 - 15:30 I got a friend who has a Pixel 8 Pro. Has this case with this little disc shaped thing in the middle, I am not sure if it's a sticker, or actually part of the case. Either way, it does like my iPhone case does, gives MagSafe to his android. Just because a device does not come with MagSafe built-in, means absolutely nothing. Nothing! 🤨 @Brian By Justin Harris on Thursday, February 20, 2025 - 15:30 Agreed, magsafe should not be a reason to buy or not buy a device. As for the camera button, I like it. Once you go in to settings, and turn off some of the slide controls for zoom and the like, and you make it where the button only opens the camera and takes a picture/video, it is actually quite nice. I've still not mastered taking good pics, but I do find the button placement good. And if for no other reason, it is handy in Be My Eyes. If Apple isn't going to give us a feature like Guided frame, I would love to see someone pull it off with an app. I'm glad I already have the regular 16, but if I didn't, I think I would be trying to get my hands on the 16E. @Brian. By Brad on Thursday, February 20, 2025 - 15:30 What is making you think about switching from Apple to android and the Pixel 9? i'm apple all the way for now but might be convinced, so go on, give it your best shot, make me want to buy one tomorrow even though I have no money for it at the moment. @"TheBlindGuy07" By Brad on Thursday, February 20, 2025 - 15:30 putting a quote around something like, "great" makes it sound really sarcastic. It's like you're saying, the article is crap. I just read it and wow, that brand sounds terrible. @Brad By Brian on Thursday, February 20, 2025 - 15:30 Oh, I've been wanting to play around with a Pixel device since last year, when a friend of mine got herself a Pixel 8 Pro. She set up a temporary profile for me, kind of like adding a second user on Windows or macOS for example, and she turned on TalkBack and let me play with her phone for a few hours while she hung out over my place and watch Netflix and such. Anyways, I had a blast playing with her phone. It was incredibly snappy, and I love some of the Android exclusive features, like the smart voice control feature where you swipe right and then up (I believe), and it will temporarily disable the screen reader and allow you to give the phone a voice command for a single action. It is super handy, and I so wish iOS had that feature. Sadly, I am also a bit bored and disgruntled with Apple. I have not liked the directions the models of iPhone have gone over the past number of years, although I will admit the 16E is looking very promising. That is why I stick with the SE models, because I am kind of old-school, and prefer the older design. So to summarize, the reason I want to try Android is because I am bored with Apple, I do not appreciate the newer look and feel of iPhones, and I really like some of the Android exclusive features that come with the Pixel devices. On a sidenote, when I was messing around with my friends device, I did not have to adjust any settings, nor did I have to download an alternative screen reader, or anything. Talkback on Pixel Pro devices is very snappy, and works just fine out of the box. I understand a number of people have experienced sluggishness, or lag, while using android devices, I do not doubt this, I am simply saying my experience was vastly different, which is another reason I would like to have a Pixel device, if nothing else then for a back up device. Who knows, maybe I will just get myself a Pixel tablet. Fair enough. By Brad on Thursday, February 20, 2025 - 15:30 If it works for you and you enjoy it, great Have fun with whatever phone you choose. I'm not a huge fan of the way apple is going either,, they jumped on the hipe train with the AI stuff, making things that hardly anyone uses, summeries of texts and notifications? great! Let's make people lazier. they won't be bothered to read and will have more ideas fed to them and will not be able to think for themselves. I really feel sorry for the kids/teens growing up in this time. I know google has AI too but as far as I know; it's not this, hand holdy. Camera button By Chamomile on Friday, February 21, 2025 - 15:30 Just a comment about the camera button: It is largely useless. But I have managed to reprogram it so it activates the QR code scanner, since that was a pain in the butt trying to scan QR codes with the camera or trying to activate the code scanner with Siri. I feel like a lot of blind people will whinge about the lack of a home button/TouchID. Like, guys, FaceID isn't that bad (just turn off attention awareness). The iPhone 16e sounds okay, Apple Intelligence isn't anything to write home about just yet (I do like the Chat GPT integration with Siri). It is pretty damn expensive ($1000 AUD). For $1,000 By Brian on Friday, February 21, 2025 - 15:30 It had better wake me up each morning with a fresh cup of coffee and yummy bagel! 😒 With regards to TouchID vs FaceID, we like TouchID because we can unlock our device without ever taking it out of our pocket. Good for those times you try to send off a quick text via Siri, only to be told, "You will have to unlock your device first". Trust me, its not that FaceID is bad, it is just that TouchID is far, far more useful. True story. 🤷 Brian By Holger Fiallo on Friday, February 21, 2025 - 15:30 Yes. Do not get why apple just do not add it. I give it to android, they have both. I actually like face id… By Justin Harris on Saturday, February 22, 2025 - 15:30 I actually like face id better than touch id. I usually find it faster, as well as the gesture navigation to just be really nice. After having that, then going back to a home button for a bit, then back to gesture navigation and face id, I'm much happier. I can confirm that using… By TheBlindGuy07 on Saturday, February 22, 2025 - 15:30 I can confirm that using ipod touch after iphone xs was very very weird, not the best thing to compare the iphone with but still valid for the home gesture which is more intuitive. Remember that you still can assign the go to home script to any of the backtap if needed. I can't confirm but I am sure you can find a clever to assign it to the action button as well probably. For faceID, my first touchID device is my current mac and if it was that good on the iphones than I can completely get why people miss it even outside the little blind community. Home for Action Button By Brian on Saturday, February 22, 2025 - 15:30 Yes. Completely doable. I had this shortcut, in fact, for the short, short time I owned my iPhone 15 Pro-PaperWeight. RIP touch ID By Holy Diver on Friday, February 28, 2025 - 03:30 So I daily drive a pixel 7 pro and have an iPhone sE 3. You want to know my favorite part of the SE? Touch ID in the home button. So nice to just unlock the darn thing in my pocket, do whatever I need done and then forget about it. I know a few androids have tactile fingerprint readers but why more companies don't just put that reader in the power button I'll never understand. I'll get another iPhone at some point but if I were in the market now I have no idea why I'd buy this over a used 15 pro for the same price. Not cheap enough to be that SE value banger -- I still marvel at the A15 in my 2022 SE -- too compromised to be a full flagship. IDK. Aesthetically speaking, the… By Brian on Friday, February 28, 2025 - 06:30 Aesthetically speaking, the 16E is like having a standard 15, with an Action button, and one less back camera. According to Michael Hansen's review, the real difference is on the inside. He states that both the bottom and earpiece speaker is even better than his daily driver; a 16 Pro Max. Personally I am waiting to hear feedback on Apple's new modem. Like you, I also am using a SE 3rd Gen, and will indeed miss the home button convenience, once time comes yet again to upgrade ...'''
year_published = 2025
