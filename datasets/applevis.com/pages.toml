description = "Accessible Apps, News, Podcasts, Guides, and Discussion for Blind and Low Vision Users of iPhone, Mac, Apple Watch, and Other Apple Products"
full_description = "Welcome to AppleVis AppleVis is the go-to resource for blind, DeafBlind, and low vision users of Apple technologies. A proud member of the Be My Eyes family, AppleVis' mission is to empower people who are blind, DeafBlind, or who have low vision to get the most from Apple products and services. With an active, engaged user base and a vast collective understanding of vision accessibility on Apple's platforms, members of our community support each other in accessing the maximum potential of Apple hardware, software, and services. Getting Started With Your First Mac, iPhone, iPad or Apple Watch Getting started with a new Apple product can be overwhelming. To help, we offer curated lists of selected content from our website to help you familiarize yourself with the accessibility features of your device, and answer many of your initial questions. Whether you're new to Apple or an experienced user, these lists will provide valuable information to help you start using your device with confidence. Getting started with your first Mac Getting started with your first iPhone or iPad Getting started with your first Apple Watch These lists offer just a sample of the wide range of help and information available on AppleVis. They are intended to provide a starting point for learning about your new Apple product, but there is much more to discover. We encourage you to explore the rest of the website, take advantage of the community support and resources available, and continue to learn as you use your device. Also be sure to browse our iOS & iPadOS, Mac, Apple Watch, and Apple TV App Directories, in which you will find information submitted by our community on the accessibility of 1000s of applications. If you are looking for iOS and iPadOS apps which have been developed specifically for blind or low vision users and which will help you in your daily life, you can find our list of these here.Latest Apple Posts And Updates Filter by type - Any -Apple TV App DirectoryApple Watch App DirectoryBlog PostForum TopicGuideHardware or Accessory ReviewMac App DirectoryPodcastiOS and iPadOS App DirectoryiOS or iPadOS Bug ReportmacOS Bug Report iPhone keeps randomly restartingForum Topic by soni6 comments. Last update or comment 18 seconds ago Spotify finally appears fixed!!!Forum Topic by danno56 comments. Last update or comment 5 minutes 58 seconds ago innosearch.ai (accessible shopping and flights for blind)Forum Topic by Ash Rein37 comments. Last update or comment 10 minutes 40 seconds ago Introducing Anytime podcast app and seeking VoiceOver feedbackForum Topic by Ben Hills112 comments. Last update or comment 2 hours 35 minutes ago iOS Web Browser OpinionsForum Topic by divakitty4185 comments. Last update or comment 4 hours 36 minutes ago A new audio game I've just discovered called blind fallForum Topic by Edvard5 comments. Last update or comment 9 hours 18 minutes ago Apple Vision Accessibility: The 2024 AppleVis Report CardBlog Post by AppleVis27 comments. Last update or comment 10 hours 44 minutes ago What is a good OS Text to Speech reader for PDFs?Forum Topic by KBSmith2 comments. Last update or comment 12 hours 15 minutes ago hooray for iOS 18.3Forum Topic by honest nan7 comments. Last update or comment 12 hours 16 minutes ago Hands On with the iPhone 16e: My First ImpressionsBlog Post by Michael Hansen14 comments. Last update or comment 14 hours 24 minutes ago How to go to beginning / end of the document in pycharm on mac?Forum Topic by TheBlindGuy070 comments. Last update or comment 18 hours 9 minutes ago Second developer betas for iOS and iPadOS 18.4, macOS Sequoia 15.4, tvOS 18.4, visionOS 2.4 and watchOS 11.4 are outForum Topic by TheBlindGuy0711 comments. Last update or comment 19 hours 25 minutes ago What is the current state of Chrome accessibility on macOS Sequoia?Forum Topic by Punnaphoj0 comments. Last update or comment 20 hours 32 minutes ago Apple Introduces New iPad Air with M3 Processor, New Magic Keyboard Model, Updated Entry-Level iPadBlog Post by AppleVis1 comments. Last update or comment 20 hours 59 minutes ago wine for iPhone iPad and macForum Topic by Josh Kennedy9 comments. Last update or comment 22 hours 2 minutes ago View more Apple posts Latest Non-Apple Posts Forum - Any -Assistive TechnologyWindowsAndroidSmart Home Tech and Gadgets HID Braille Support for Braille Displays Is Coming SoonPosted to Android by allabtech0 comments. Last update or comment 15 hours ago worried about laptop batteryPosted to Windows by treky fan16 comments. Last update or comment 19 hours 24 minutes ago Audible & Meta Ray BansPosted to Assistive Technology by Brian2 comments. Last update or comment 1 day 22 hours ago New Amazon Eccho Subscription Service (A Lady Plus)Posted to Smart Home Tech and Gadgets by mr grieves8 comments. Last update or comment 2 days 12 hours ago Accessible thermostatPosted to Smart Home Tech and Gadgets by Laura3 comments. Last update or comment 2 days 16 hours ago Meta Ray-Ban Slight Feedback Noise Posted to Assistive Technology by Kyler G3 comments. Last update or comment 3 days 12 hours ago free accessible games for AndroidPosted to Android by Daybreaker2 comments. Last update or comment 3 days 23 hours ago Thorium ebook reader and NVDA browse modePosted to Windows by Nut13 comments. Last update or comment 4 days 8 hours ago Experiences with ARM SnapDragon Laptops?Posted to Windows by Maldalain31 comments. Last update or comment 5 days 8 hours ago Iphone 16E (From an Android's POV) Posted to Android by Trenton Matthews18 comments. Last update or comment 5 days 9 hours ago View more non-Apple posts"
