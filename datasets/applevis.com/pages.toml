title = "BlindSquare | AppleVis"
description = "BlindSquare makes you sense what's around you. The only thing you need to do is listen. BlindSquare is a new solution that combines the latest technology to help the blind with their daily lives. It has been developed in collaboration with blind people and carefully field tested. You need either an iPhone or an iPad to get started. It also supports some additional accessories to enhance the experience. How does it work? BlindSquare uses GPS and the compass to locate you. It then gathers information about the surrounding environment from FourSquare."
full_description = '''Category Navigation Description of App BlindSquare makes you sense what's around you. The only thing you need to do is listen. BlindSquare is a new solution that combines the latest technology to help the blind with their daily lives. It has been developed in collaboration with blind people and carefully field tested. You need either an iPhone or an iPad to get started. It also supports some additional accessories to enhance the experience. How does it work? BlindSquare uses GPS and the compass to locate you. It then gathers information about the surrounding environment from FourSquare. BlindSquare has some unique algorithms to decide what information is the most relevant and then speaks it to you with high quality speech synthesis. “What's the most popular café within 200 meters radius? Where is the post office or the library?” Using BlindSquare as a GPS solution: When you start the app, it will start telling you the interesting places and street crossings around you. By changing the radius, you can limit the area you are interested in. You can also search by search term or by category. You can select an interesting place from the search results and perform the following tasks: 1) Get contact info (address, phone number) 2) Open twitter feed or restaurant menu (if provided) 3) Make a phone call 4) Start tracking the place (BlindSquare will assist you by repeating the distance and the clock face direction) 5) Start your favourite navigator for turn-by-turn instructions (TomTom, Navigon or Apple Maps) BlindSquare is aware of when you travel by car, bus or train and starts to report interesting places in front of you (for example, the next stops) and street crossings when you are passing them. You can also save your own private places to iCloud so they will be found with your every device. Using BlindSquare as a FourSquare client: If you like to play FourSquare, you can do the following with BlindSquare: 1) Get a list of nearby FourSquare venues 2) When you are in a place, you can check in by shaking your device 3) Do a check in with commenting and twitter/facebook sharing 4) Correct the location of the place BlindSquare supports the following languages: English, Spanish, French, German, Italian, Dutch, Finnish, Swedish, Norwegian, Danish, Czech, Russian, Estonian, Polish, Arabic, Turkish, Portuguese, Japanese, Greek, Romanian, Croatian, Hungarian, Korean and Bulgarian. VoiceOver usage is supported but it also includes higher quality additional speech synthesis by Acapela Text-To-Speech from Acapela Group. Instructions in English: http://help.blindsquare.com/instructions and http://blindsquare.com/faq Please note: This app retrieves data in real time from Foursquare and Open Street Map. Use of a flat rate data plan is highly recommended. Having only been released in May 2012, BlindSquare has already received several prizes and awards: - GSMA: Global Mobile Awards 2013, Best Mobile Health Product or Service - Apps4Finland 2012 - OpenCities App Challenge 2012 - The Finnish Information Processing Association: Best Product 2012 Please note: To use BlindSquare, your iCloud account has to be active so BlindSquare can access it to save your settings and places. Continued use of GPS running in the background can dramatically decrease battery life. Version 4.26 Free or Paid Paid Apple Watch Support Yes Device(s) App Was Tested On iPhone iOS Version 10.3.1 Accessibility Comments This app is fully accessible with VoiceOver. All buttons and controls are clearly labelled, and once you have familiarized yourself with the interface it is fairly easy to navigate and use. VoiceOver Performance VoiceOver reads all page elements. Button Labeling All buttons are clearly labeled. Usability The app is fully accessible with VoiceOver and is easy to navigate and use. Other Comments There is nothing but good things to say about this app. This is hands down one of my most favorite navigation app to use. It offers so much for so little cost. Now that it works in conjunction with the FREE Google Maps. You really should try this out first before buying in to those other very expensive accessible GPS navigations. App Store Link https://itunes.apple.com/us/app/blindsquare/id500557255?mt=8&ign-mpt=uo%3D4 Developer's Website http://blindsquare.com/support Developer's Twitter Username @BlindSquareGPS Related Podcast http://www.applevis.com/podcast/episodes/introduction-and-overview-blindsquare-… Recommendations 42 people have recommended this appMost recently recommended by Casey 9 months 3 weeks ago Options Log in or register to post comments Comments Version 1.12 released By David Goodwin on Tuesday, June 5, 2012 - 15:20 What's New in Version 1.12New feature: Better direction awareness when traveling fast (by bus, cycling etc.)New feature: You can select how directions are reportedNew feature: Better algorithm when doing second foursquare checkin by shaking inside a big venueFix: Help addedFix: Nearest crossing bug fixed Version 1.14 released By David Goodwin on Thursday, July 5, 2012 - 15:20 A new update has just been released. I've not had an opportunity to take it for a test drive yet, but some of the new features look good:What's New in Version 1.14NEW FEATURE: Cross street tracking on busNEW FEATURE: Auto-blanking of screen can be disabledNEW FEATURE: Italian language addedNEW FEATURE: Bouncing table starts WhereAmI query (for non-VoiceOver users)NEW FEATURE: Rating addedNEW FEATURE: "Look around" reports also nearest crossing in each directionNEW FEATURE: When editing My places, you can reset locationNEW FEATURE: You can start/stop tracking a place from Own placesNEW FEATURE: In settings you can control how shake gesture is usedCHANGE: Compass renamed as "Look around"CHANGE: Settings-button renamed as "Other"FIX: Poor GPS or network connectivity announcements doesn't cut out speaking but wait for it's turnFIX: Changing radius with VoiceOver has smaller resolution New version By Borostar on Thursday, July 5, 2012 - 15:20 In reply to Version 1.14 released by David Goodwin Hi. I'm going to try the new version today. One of my concerns was that street crossings weren't automatically announced when travelling on the bus. New update By Borostar on Thursday, July 5, 2012 - 15:20 In reply to New version by Borostar Hi. I've just tested the new update and would like to thank the author for including the ability to listen to street crossing announcements when traveling in a car or on a bus. I would like to point out one minor glitch and that is when you fire up the app by selecting it in the app switcher! The app no longer announces street crossing. I had to remove the app from the app switcher and re-start it again for it to function as normal. Ghost BlindSquare Website By Doug on Thursday, July 5, 2012 - 15:20 I just clicked on the link included for the so-called blindsuare developer's website and got taken to google groups. I did try this even before the purchase but though it might have been fixed, no such luck. App support is via Google Groups By AppleVis on Thursday, July 5, 2012 - 15:20 In reply to Ghost BlindSquare Website by Doug The link points to the developer's support forum, which, yes, is on Google Groups. BlindSquare GPS Very Annoying And Disappointing By Doug on Thursday, July 5, 2012 - 15:20 I've played with this app for about a month and first of all, find that voice they use on top of the IPhone most annoying and obtrusive. I did attempt to turn it off in settings but it always turns itself back on again. When searching around the screen,, things suddenly go blank and one most lift the finger and give several pokes to get things touchable again. The so-called help file is little more than the usual yadayadayada about use of advanced technology and such. I'll keep it a while longer but probably try for a refund though according to what I read on the apple website, such seems not possible. Further, like many data-sucking GPS packages, it seems to insist on using up my data every time it needs map info, rather than downloading maps even though on initial start-up, it asks to use my location to which I agreed. I should have become suspicious when I saw it was placed in the medical category; we blind are not sick unless there are health problems. Somewhat disappointing Experience With Blindsquare, Latest versi By Doug on Thursday, July 5, 2012 - 15:20 I've read all available post and information before and after my purchase of Blindsquare. First, I have not been able to turn off that most intrusive voice which insists on tromping all over that of voiceover. There is often unwanted interference from Miss SilverTongue when I'm exploring the screen. Next, seems that many developers of GPS have lots of money to spend on their programs constantly eating up cell air time by not downloading maps specific to the area, even though they have asked, and I have accepted, using my location. So, in order to get help, I have to subscribe to yet another social group? If these situations don't change, I will be asking for a refund from apple, more on principal than the small abount of money involved which I'd much rather give to applivis for the excellent website. Contrary to what I have read bout navigon, I find the buttons totally accessible and that review will be entered separately. Hello! I'm developer of By ilkkapirttimaa on Thursday, July 5, 2012 - 15:20 In reply to Ghost BlindSquare Website by Doug Hello! I'm developer of blindsquare. Thank you for pointing this out. I have changed links to point official blindsquare site, http://blindsquare.com Thanks for feedback By ilkkapirttimaa on Thursday, July 5, 2012 - 15:20 In reply to BlindSquare GPS Very Annoying And Disappointing by Doug Thank you for the feedback. I have to say that 90% of feedback is positive so it's good to get also negative feedback and learn from your use cases. BS has basically two modes. In active mode you use user interface to do things. I know in that case it might be annoying when second TTS is speaking over VO. There is no way for app to know when VO is speaking. I have some ideas how to make it better and it's planned to version 2.0. VO-only mode is also under planning. If I manage to do that I can publish lite-version without cost of TTS. Another mode is to keep your device in pocket and just let BS to speak for you. You can set radius to minimum and deselect categories you are not interested. You will hear your location, crossings and most popular places around you when you are moving. If you have marked your own important locations (for example bus stop where you need to get off), you will be informed when you get near. If you don't need the app as it is now, you should be able to return it and get refunded. Flat rate By ilkkapirttimaa on Thursday, July 5, 2012 - 15:20 In reply to Somewhat disappointing Experience With Blindsquare, Latest versi by Doug No, I do not have lots of money to spend, but flat rate data plan. Most of the data is fetched from FourSquare. It is not allowed to store data in device for long time. Still, they allow caching for short period of time and I'll add this to list of tings that needs to be taken care of. For now, I have added following text to app description: Please notice: This app get's data in realtime from FourSquare and Open Street Map database. Flat rate data plan is highly recommended. PS. Version 1.15 is waiting for review, You can learn more about new features from this blog posting: http://blindsquare.com/2012/06/sneak-preview-to-blindsquare-version-1-15-let-me-introduce-you-to-the-recent-places/ Despite Earlier Comments, Truly awesome potential By Doug on Thursday, July 5, 2012 - 15:20 In reply to Flat rate by ilkkapirttimaa AS is the case with all GPS apps I have, and am still currently testing, I'll continue to work with a developing product. Since the only support for blindsquare seems only available through the author's monitoring of applevis, or by registering with facebook (and I have no other reason/desire to do so) my present issue lies with the blindsquare disappearing, at least when touching and moving around the screen. This is more likely to happen on the top right section of the screen. Since I have not experienced this with other apps, I think there is a problem here. Perhaps I should uninstall and reinstall again? If that screen was stable and reliable to touch exploration, other issues I've raised may be more easi to manage. As for cell flat rate, I am already spending $60 per month with a one GB limit on my data download and like many folks, my budget will not allow more (I know, boohoohoo but's what it is.) So, assuming I spend 5 hours a day out and about with blindsquare as my guide, what the total amount of data download add up to in a month? That may be an unfair question and perhaps apple, or GPS app developers need to add a feature which will keep track of such data. I suspect that this lies more in Apple's domain since then we could know whic apps are racking up the highest proportion of the data download. And indeed, I'll be sending this app data count to Apple. newbie By rdfreak on Thursday, July 5, 2012 - 15:20 I installed this app yesterday and thought I'd switch it on this morning while on the train to work to see how it went. Despite my not being in pedestrian mode, it announced every station I was approaching and told me what points of interest were around. I couldn't figure out how to mark it so as to give me an option to show me how to get to the POI but I am now going to read the instructions above so all should be good. I did find the voice intrusive over Vo but I think when one is walking along, one won't need to be using VO anyway. I'm a little confused after reading the comments, is the maps not installed on our phones with the program at all? Yes I do realize that four square is used but it doesn't contain names of streets etc. If not, wow, yeh imagine the data being chewed up. Anyway overall, good GPS device, and am sure it will only get better. I haven't got Navigon; I should go and check it out. Sorry, I didn't read the By rdfreak on Thursday, July 5, 2012 - 15:20 In reply to newbie by rdfreak Sorry, I didn't read the deveopper's comment answering my question I also had about the maps. Is there any reason why we can't store maps on the phone? We could download the ones we'll be using only to reserve space; that'd be awesome. Disapearing of BS can be changed from settings By ilkkapirttimaa on Thursday, July 5, 2012 - 15:20 In reply to Despite Earlier Comments, Truly awesome potential by Doug Support has never been via Facebook -- Link went to Google Forums. I have changed support link to be http://blindsquare.com/support/ -- It lists all channels you can use for support (not AppleVis though :-). If your BS is disappearing, it's caused by proximity sensor. It uses that sensor to blank screen when BS is placed to pocket. For some people it doesn't work (for example 2 people with low visi'''
