description = "Hey guys! so I'm after finding this awesome game called blind fall. It is an adventure where you play as a totally blind character guided by your 10 year old fully sighted girl called Kaytie. At the moment there is only first episoad out. Unless there is a second one released already can anyone let me know? So far it has been a great game and I can't wait for the secont part! You guys should check it out too!!!!!!"
full_description = "By Edvard, 24 February, 2025 Forum iOS and iPadOS Gaming Hey guys! so I'm after finding this awesome game called blind fall. It is an adventure where you play as a totally blind character guided by your 10 year old fully sighted girl called Kaytie. At the moment there is only first episoad out. Unless there is a second one released already can anyone let me know? So far it has been a great game and I can't wait for the secont part! You guys should check it out too!!!!!! Options Log in or register to post comments Comments You have my attention... By Bo on Tuesday, February 25, 2025 - 15:17 I will have to check this one out. I'm very curious. Thanks for the tip. Is this a demo, or ... ? By Brian on Tuesday, February 25, 2025 - 15:17 Are the developers releasing one episode at a time, or is this a demo? Link for Game By allabtech on Tuesday, February 25, 2025 - 15:17 Can you'll please post the link to the game? Reply By Edvard on Wednesday, February 26, 2025 - 15:17 It is just the first Episode and yes, I think the developers are releasing one episode at a time the game might be just out. I’m not sure. In the meantime, here is the link. https://apps.apple.com/ie/app/blindfall-episode-one/id6469836397 Yeah, just finished second… By TheBlindGuy07 on Wednesday, March 5, 2025 - 06:05 Yeah, just finished second episode after paying. The gameplay is very very weird and unintuitive each action is guess work but nice work on the sounds and plot. You have my attention... By Bo on Tuesday, February 25, 2025 - 15:17 I will have to check this one out. I'm very curious. Thanks for the tip. Is this a demo, or ... ? By Brian on Tuesday, February 25, 2025 - 15:17 Are the developers releasing one episode at a time, or is this a demo? Link for Game By allabtech on Tuesday, February 25, 2025 - 15:17 Can you'll please post the link to the game? Reply By Edvard on Wednesday, February 26, 2025 - 15:17 It is just the first Episode and yes, I think the developers are releasing one episode at a time the game might be just out. I’m not sure. In the meantime, here is the link. https://apps.apple.com/ie/app/blindfall-episode-one/id6469836397"
