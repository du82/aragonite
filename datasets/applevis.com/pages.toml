title = "BARD Mobile | AppleVis"
description = "CARRY A LIBRARY IN YOUR POCKET Access tens of thousands of books—from current best sellers to much-loved classics, popular magazines, and music instruction and scores in audio and electronic braille formats, with new selections added daily. HOW DO I GET STARTED? This app allows access for eligible users who have enrolled in the National Library Service for the Blind and Print Disabled (NLS) at the Library of Congress. To enroll call 1-888-NLS-READ (1-888-657-7323) and follow the prompts for your state."
full_description = '''Category Books Description of App CARRY A LIBRARY IN YOUR POCKET Access tens of thousands of books—from current best sellers to much-loved classics, popular magazines, and music instruction and scores in audio and electronic braille formats, with new selections added daily. HOW DO I GET STARTED? This app allows access for eligible users who have enrolled in the National Library Service for the Blind and Print Disabled (NLS) at the Library of Congress. To enroll call 1-888-NLS-READ (1-888-657-7323) and follow the prompts for your state. You can also request enrollment information at https://www.loc.gov/thatallmayread. If you are already registered for NLS service, contact your cooperating NLS library to request your BARD account. You can find your library by visiting https://www.loc.gov/nls/braille-audio-reading-materials/find-a-local-library/. WHO IS ELIGIBLE? BARD Mobile is a service of NLS. NLS provides free audio and braille reading materials to residents of the United States and American citizens living abroad who cannot read standard print. If you are blind or have temporary or permanent low vision or a disability that prevents you from reading or holding the printed page, you may be eligible for this program. For more information on eligibility, visit https://www.loc.gov/nls/about/eligibility-for-nls-services or contact your cooperating network library. WHAT EQUIPMENT DO I NEED? Audio materials downloaded from BARD can be played directly on your iPhone, iPad, or iPod touch. To read braille materials, you will need to connect a refreshable braille display to your device using Bluetooth. Version 2.2.1 Free or Paid Free Apple Watch Support No Device(s) App Was Tested On iPhone iOS Version 17.2 Accessibility Comments This app is wonderfully easy to use. All you do for example for yoru wish list if you have books there is double tap the book and when it is done downloading you will hear a door bell like sound telling you the downloading of your book is done. I have not tried the itunes method yet but will get around to it. VoiceOver Performance VoiceOver reads all page elements. Button Labeling All buttons are clearly labeled. Usability The app is fully accessible with VoiceOver and is easy to navigate and use. Other Comments The app seems to work well with iOs 9 but watch you registrations and the number of books you have. You are limited to 100 a month and for some reason when you remove a book it does not take that registration away. The only way to fix is to reinstall the app and redownload your books or et them in to the app via dropbox or file browser. App Store Link https://itunes.apple.com/us/app/bard-mobile/id705229586?mt=8 Developer's Website https://nlsbard.loc.gov/apidocs/BARDMobile.userguide.iOS.1.0.html Developer's Twitter Username @librarycongress Related Podcast http://www.applevis.com/podcast/episodes/we-read-you-loud-and-clear-demonstrati… Recommendations 31 people have recommended this appMost recently recommended by Michael Hansen 2 months 1 week ago Options Log in or register to post comments Comments Amazing By Unregistered User (not verified) on Saturday, October 5, 2013 - 15:28 I've been waiting for this app for years now, and it's just as amazing as I had hoped it would be. It has an inbuilt web browser so you can download the books right to the phone. No messing with iTunes, no hastle, just awesome. If anybody here represents or works for the nls or this dev team, thanks for all your hard work. You have delivered us an amazing experience with this app. I would encourage anybody who has an extra 2 minutes to either write an app store review, or email to the nls letting them know your thoughts. This app has added functionality to my iphone that is simply, and I cannot put too fine a point on this, amazing. As much as I love and have used my nls player, it does tend to be a bit bulky, and can't fit in a pocket. To have such a huge portion of my library right in my pocket makes the iphone as good as any e reader out there. This is awesome, and I am extremely greatful to the nls for this great app!!! Finally!!!!! By Ali Gamez on Saturday, October 5, 2013 - 15:28 In reply to Amazing by Unregistered User (not verified) Thank you, thank you, thank you!!!!!!!! I've been waiting for this app since I heard it was going to be developed and I cannot tell you how happy I am it's finally here! Most of the reading I do is with BARD, and it is just awesome that I can now read from my phone. Well Worth the Wait By Jen on Saturday, October 5, 2013 - 15:28 I am loving everything about this app. It's been a long time coming, but the wait really has paid off. Fantastic app! Thank you NLS Bard! By Eileen on Saturday, October 5, 2013 - 15:28 Great app, , so convenient to get books, and Yay I won't have to buy another expensive device to have NLS books on the go! Love NLS Bard the books are great and now getting a book is easier than going to a public library! smile BARD Mobile App By Lynne on Saturday, October 5, 2013 - 15:28 this is a brilliant app. Kudos to the NLS Team! Only one thing---wish it had a sleep timer. It really was worth the wait. Perhaps it does and I just haven't found it. question By Kyle on Saturday, October 5, 2013 - 15:28 if the devs are on here, do we know if or when there is going to be a bard app for android? i'd much rather download stuff on my 32 gb nexus than my 16 gb iphone. Re: Sleep Timer By Travis on Saturday, October 5, 2013 - 15:28 In reply to BARD Mobile App by Lynne There is no sleep timer. However, if you go to your clock app, you can set a timer. If you set that timer's sound to "Stop Playing," the setting at the bottom of the sounds list, you will effectively have a sleep timer for whatever duration you want. Once you have the setting for the timer as stop playing, you can even have Siri turn on the timer for you. File Extraction Problem By Travis on Saturday, October 5, 2013 - 15:28 I have had a few books that I have tried to download give me an error that the file failed to extract. Has anyone else experienced this? Any ideas on fixing that problem? Not yet but some of the ones By KE7ZUM on Saturday, October 5, 2013 - 15:28 In reply to File Extraction Problem by Travis Not yet but some of the ones I zipped from my flash drive and i put on there say that I"m not authorised to play this book. I'm a bit confused by this. Oh no, I know that that means, I just want to know why. Over all the app is very very good. This is a brilliant app. A By Tristan on Saturday, October 5, 2013 - 15:28 This is a brilliant app. A real thumbs up to the developers at NLS who put work into this -- it's a true modernized facsimile of the NLS digital players! One problem I have had is that even with "Background Playback" toggled to on in audio settings, I still can't use a two finger double tap gesture to pause and play the active book. If I do a two finger double tap, or simply press the center button on a set of earpods, the book stops playing and is replaced by my music. I have to then go back into the BARD app to restart the book. The two finger double tap also doesn't seem to work inside the actual app itself. Anyone else encountering this? I'm on an iPhone 5 running iOS 7. 2 Finger Double-Tap By Travis on Saturday, October 5, 2013 - 15:28 In reply to Amazing by Unregistered User (not verified) I have had the 2 finger double-tap problem where the app playes my music and kicks me out. However, I have had this problem with iCatcher, as podcast app, as well. For me, it is not a problem I can make happen 100% of the time. Tapping on the agree button By Deborah Armstrong on Saturday, October 5, 2013 - 15:28 Tapping on the agree button to accept the license terms did not work at first; had to split-tap after locating the button manually (without flicking.) Probably just a small VO bug. Only usable for U.S. citizens who have a BARD account, this app gives access to the digital talking books that are provided by the NLS free reading program. You can directly view the recently added books and download any you wish. But for older books, they need to first be added to your wishlist. This is easily accomplished with any browser on any accessible platform. The app also lets you view magazines and Braille, downloading recently added or wishlist items as well. Of course the app also plays downloaded titles, including playing audio in the background. The listener can adjust the tone and speed of the audio. The daisy books from the NLS don't include text. Visual settings let you customize screen layout if you are low vision. A clearly written and lengthy user guide is included and can be read offline. It's an HTML document with a table of contents that includes links to each section, making it easy to find the help information you need. The app makes prolific use of VO hints, enabling even a beginner to download and read. Unlike many apps which seem "thrown together" this one is carefully designed, well thought out and thoroughly documented. I'm a little surprised that I, an average user was the first one in the Applevis community to notice its availability. adding items to wish list! By Jim D on Saturday, October 5, 2013 - 15:28 You can actually add items to your wish list from within the BARD Mobile app. On the Get Books tabk, you will find a link to browse the BARD website. This website is almost identical to what you would find on a desktop browser. The only difference, where you would normally find links to download a book or magazine, you will find a link to add this item to your wish list. Once you have done that, you can go to the wish list button, also under the get books tab and download the title to your device. I really enjoy the ability to download and read NLS content without the need for SD cards and cartridges! Jim Failed to decode audio file problem By Human.Chess on Saturday, October 5, 2013 - 15:28 I was listening to James Patterson's 3rd Degree when I had this problem. The book has multiple parts and when I got to part 4 I got this error "failed to decode audio file". All other parts of the book played normally. Has anyone else seen this problem? Any ideas how to fix the problem? RE: Failed to decode audio file problem By Travis on Saturday, October 5, 2013 - 15:28 In reply to Amazing by Unregistered User (not verified) I had the same problem with a book that I downloaded as well. I have no idea why. I am using an iPhone 4, but should have enough memory to have all things covered. Anybody have any ideas? I have just downloaded the By Bahzad on Saturday, October 5, 2013 - 15:28 In reply to Not yet but some of the ones by KE7ZUM Hi, Marrie. I have just downloaded the books that were on my flash drive to the phone, which worked successfully. Perhaps doing that on your end may resolve the problem. Good luck. Those were on the flash drive By KE7ZUM on Saturday, October 5, 2013 - 15:28 In reply to I have just downloaded the by Bahzad Those were on the flash drive I had. I got unable to play this unauthorised book on the player or what ever it was. I had to redownload *all* the books and add them. It sucked but thanks to itunes I did it rather quickly, with in about 20 minutes. NLS app By Carlos Alonso on Saturday, October 5, 2013 - 15:28 In reply to Those were on the flash drive by KE7ZUM Awesome app, like others have said, well thought out and instantly one of my favorite apps - THANK YOU NLS for putting this out and hitting a home run with your implementation Sleep Timer By Lynne on Saturday, October 5, 2013 - 15:28 My only regret is that there is no sleep timer. Do folks have any ideas about setting one? Thanks in advance for your suggestions/comments. Hi all, just wondering is use By alex wallis on Saturday, October 5, 2013 - 15:28 Hi all, just wondering is use of this app only available exclusively to US citizens? had a look at the website but couldn't see any information about if people from the UK can use the app. Reason I am not sure is because it is available in the UK app store. I emailed the support email address but so far have had no reply. Guess if its only available to US citizens I will have to start asking my sources about getting details. This app goes to show how seriously behind the RNIB is compared to the US now both in terms of technology and in the range of titles available. Only Available in the U.S. By Michael Hansen on Saturday, October 5, 2013 - 15:28 In reply to Hi all, just wondering is use by alex wallis Hi Alex, Yes, BARD Mobile is only available to elegeable U.S. citizens who receive services from the National Library Service (NLS). Regards, Michael Downloading to phone By Skyhook on Saturday, October 5, 2013 - 15:28 In reply to I have just downloaded the by Bahzad Hi Bahzad How did you get titles from your flash drive to your phone? Thanks Probably zipped each of the By KE7ZUM on Saturday, October 5, 2013 - 15:28 In reply to Downloading to phone by Skyhook Probably zipped each of the books, then copied them all via itunes file sharing. This is how I did it with mine. Tc. sleep timer By billy lei on Tuesday, November 5, 2013 - 15:28 In reply to BARD Mobile App by Lynne Sleep timer. If you wish to have BARD Mobile’s audio playback turned off after a specific amount of time, you can do this with your iOS device. In the device’s clock application, select the timer tab and then activate the When Timer Ends button. You will be presented with a list of sounds in alphabetical order. Select Stop Playing, which is the last item on the list and is not a sound. After selecting this, you can set the timer for the desired length of time and BARD Mobile’s audio playback will stop playing when the time is up. If Siri is active on your device, after Stop Playing is selected, you can use Siri to tell your device “set timer for 30 minutes,” if you would like. List end no wishlist By soni on Tuesday, November 5, 2013 - 15:28 For some reason, I can not access my wishlist on my ipod or phone. It shows as zero items. When I check on the site, they are there. Anyone else having this problem? You need to wait until it By KE7ZUM on Tuesday, November 5, 2013 - 15:28 In reply to no wishlist by soni You need to wait until it refreshes. Did you try that and see, it should take no more then 30 seconds for the app to refresh. Take care. This app By billy lei on Tuesday, November 5, 2013 - 15:28 This app is excellent I use everyday It's happening to a bunch of folks By Toonhead on Tuesday, November 5, 2013 - 15:28 In reply to no wishlist by soni Seems there's an issue with the API that the BARD app uses to access the website, so you can try going to the get books tab and it'll try to access the website but the request times out. Since there's not a lot of support available for obvious reasons I hope the problem magicly fixes itself. This happened once before a few days ago and the problem was solved somehow, so hopefully it'll happen again. :) refreshing By soni on Tuesday, November 5, 2013 - '''
