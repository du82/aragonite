["https://applevis.com/apps/ios/games/blind-legend"]
title = "A Blind Legend | AppleVis"
description = "It’s the first-ever mobile action-adventure game without video – where ears replace eyes! Discover the original, innovative sensory experience of binaural 3D sound. HEADPHONES ARE COMPULSORY! Your eyes will be of no help. So close them, sharpen your hearing and your blade… And embark on an epic, perilous rite of passage. How do you play? Put on your headphones and use your smartphone’s touchscreen like a joystick:"
full_description = '''Category Games Description of App It’s the first-ever mobile action-adventure game without video – where ears replace eyes! Discover the original, innovative sensory experience of binaural 3D sound. HEADPHONES ARE COMPULSORY! Your eyes will be of no help. So close them, sharpen your hearing and your blade… And embark on an epic, perilous rite of passage. How do you play? Put on your headphones and use your smartphone’s touchscreen like a joystick: - to move around freely; - to fight using your sword; - to defend yourself and protect yourself with your shield; - to repel your enemies and perform combos! Live the adventures of Edward Blake, the famous blind knight! Guided by your daughter Louise, you must find your way and avoid the many traps that lie in store in the High Castle Kingdom, while confronting dangerous enemies! The game is fully accessible to visually impaired people, and is aimed at anyone who’s eager for an original, immersive sensory experience through a ground-breaking video game. And because the player is the character, it will help raise public awareness of this kind of disability. It was co-created thanks to support from a community of fans who helped with the crowdfunding campaign (www.ulule.com/a-blind-legend) and in a co-production with France Culture, a Radio France station. This type of hack-and-slash game, with a heroic-fantasy flavour, harnesses the innovative technology of binaural sound, which delivers a gripping 3D soundscape and brings characters and actions vividly to life around the player – as if they were actually in the game! Listen to the official trailer: https://www.youtube.com/watch?v=-i_CcH5Bd30 Version 1.2 Free or Paid Free Apple Watch Support Not Known Device(s) App Was Tested On iPhone iOS Version 9.3.2 Accessibility Comments Of course, this game is fully accessible as it has been built mainly for blind folks. These binaural sounds give the player an amazing feeling of reality. VoiceOver Performance Not applicable for this app. Button Labeling Not applicable for this app. Usability The app is fully accessible with VoiceOver and is easy to navigate and use. Other Comments Sure, there are many great audio games out there, but they are all exclusively developed in English. For us, French users, it's the first real adventure audio game in our native language. I hope You'll enjoy it as I do. :) App Store Link https://itunes.apple.com/us/app/a-blind-legend/id973483154?mt=8&ign-mpt=uo%3D4 Developer's Website http://www.ablindlegend.com/en/home-2/ Developer's Twitter Username @ablindlegend Related Podcast http://www.applevis.com/podcast/episodes/embark-epic-perilous-rite-passage-blin… Recommendations 37 people have recommended this appMost recently recommended by Rafaela Freundt 2 months 2 weeks ago Options Log in or register to post comments Comments I downloaded and installed By alex wallis on Monday, October 5, 2015 - 15:15 I downloaded and installed the app, I then launched it and it went and downloaded English souns, but now nothing happens it just says loading then I hear a heartbeat sound anyone else get this? You just By Igna Triay on Monday, October 5, 2015 - 15:15 You just had to wait for the file to finish loading. It may take a while, but when the heartbeat stops, you will be able to play. It is a pretty cool game so far. Can't access anything By Sean Terry on Monday, October 5, 2015 - 15:15 Hi, I got the game and was able to get the English sounds and voice. But, I can't access any of the menu options. Every time I flick left to right it will say the option, but I can't double tap on the screen to except that menu auction. It just repeats the menu choice again. disable voice over By Nick Apostolidis on Monday, October 5, 2015 - 15:15 Hi Sean. Have you tried after disabling voice over? it should work. That's odd it works well By Igna Triay on Monday, October 5, 2015 - 15:15 That's odd it works well for me with voiceover on. I don't have any trouble pressing the options. Selecting Options By Ka Yat Li on Monday, October 5, 2015 - 15:15 Do a two-finger double tap to select the option once you've flicked to it. Speaking of options, I find it strange that it says to ask a sighted person for help to get the in-app purchases even though it's accessible with Voiceover. How long" is the download By Ken Downey on Monday, October 5, 2015 - 15:15 How long" is the download supposed to take? Been downloading for an hour now... ... ... It depends on By Igna Triay on Monday, October 5, 2015 - 15:15 It depends on your Wi-Fi network. Mine took about 15 minutes. OK, sounds good. But how do By Sean Terry on Monday, October 5, 2015 - 15:15 OK, sounds good. But how do you back out of, say the options screen with voiceover on? I can't figure that one out. the download finished for me By alex wallis on Monday, October 5, 2015 - 15:15 the download finished for me in about 10 or 15 minutes, but how long is the loading supposed to take? I gave up after about 5 minutes, I did try restarting the phone and the app, note I am talking about the game actually loading so you can use it, not downloading of sounds. language question By charles on Monday, October 5, 2015 - 15:15 Is this able to be played by people who do not speak French? Thanks. Bilingual game, downloaded but not yet played by me By Clare Page on Monday, October 5, 2015 - 15:15 Hi! I've just installed A Blind Legend myself, downloading the files it asked me to download, but I haven't actually played the game yet at the time of writing this post. Before downloading the files, you can choose which language to play the game in, the choices being French and English: as I'm in France, I could have chosen French, but I chose English instead. A few times the game told me to tap twice to continue and that didn't always work the first time, but in the end I got the files downloaded, which took about ten minutes for me at the most. I expect I'll return to this thread after I've actually played the game at least a bit. The download could be quite By Sof on Monday, October 5, 2015 - 15:15 The download could be quite long indeed. But once all the required data downloaded, it should start quite immediately, at least in French. I don't have tested it in English yet but I'll do it if it can help once I'll figure out how to back to the main menu. I'm not even sure we can change the language once the game has started... I wish to all of you who haven't been able to play yet you'll do soon. It's a great game. It's young and still need improvements but its developers are really enthusiast. :) Wow, what a game so far! I'm By Sean Terry on Monday, October 5, 2015 - 15:15 Wow, what a game so far! I'm in the fishermen's village and it's a bit hard here. But it is very well done! I love this one! crashed before the third tutorial faze By hanif naufal h… on Monday, October 5, 2015 - 15:15 I've downloaded this game and it sounds pretty great. but the problem is, on my 4S, I got to the part when blake told how to draw or remove his sword, I do a double tap to use the sword and then I hear a scene that the soldier is coming back and then I hear that the game is loading and after that, it puts me back to my home screen. is it a bug with the 4S or the game doesn't support my device? Found a huge bug. By kingdekka on Monday, October 5, 2015 - 15:15 This one's pretty far in the game but, It is when you're in the forest going to find ademon to cure a poison arrow attack. You are being guided by a person from the temple, and once you get to a certain point in the forest where the path is streight in front of you, you are unable to move foward. the only thing you are able to do at this point is turn, draw your sword, and raise your shield. It's pretty much not passable. CuriousI don't By Igna Triay on Monday, October 5, 2015 - 15:15 I don't think it's a bug. I already got past that part. I really love this game! I By Sean Terry on Monday, October 5, 2015 - 15:15 I really love this game! I just keep going back to it. I love the fact that you can buy a set amount of lives, and if you die a few times the life counter gets replenished overtime. Nice game! By Toonhead on Monday, October 5, 2015 - 15:15 I had no trouble getting the game installed and downloading the necessary sounds. For those having trouble with the language option, the game figures out what language you're using, and installs that language. If you want to choose French, you simply swipe to the left and choose that. and then when you double-tap, the language is chosen, and the sounds will download. You'll hear a heartbeat sound as the sounds download. on my FIOS connection they took about close to 10 minutes, although that's just an approximation. I didn't actually time it. But if you don't hear anything for a while, sit tight and you'll get verbal indications that the sounds are downloading. Just give it some time. Once the sounds are installed you can begin playing. I'm not exactly sure why the game mentions having a sighted person help you, as we should be able to purchase things ourselves, I'd sure think? I haven't bought any in-app purchases yet. Nice game, and in the beginning parts, you are told to double-tap on the screen just like VoiceOver, so people should be right at home. Does this By Igna Triay on Monday, October 5, 2015 - 15:15 Does this game have survival mode? I mean after you complete the story? Not that I have... Yet. How? By kingdekka on Monday, October 5, 2015 - 15:15 In reply to CuriousI don't by Igna Triay I can't seem to move at all aside from turning around. Can you tell me what I'm doing wrong? I'd be greatly appreciative. Walk by By Igna Triay on Monday, October 5, 2015 - 15:15 To move put one finger on the screen and swipe your finger up, while still pressing it on the screen. Why the game crashes on the By hanif naufal h… on Monday, October 5, 2015 - 15:15 Why the game crashes on the Iphone 4S? I got to the second tutorial level and then when it loads the next tutorial level(after blake has been told how to draw the sword), it says loading and when it's finished loading it simply crashed. What's wrong? No idea By Igna Triay on Monday, October 5, 2015 - 15:15 No idea it might be that the game does not support iPhone 4 S. I have a iPhone five, and it works perfectly well It's a shame, I can't play By hanif naufal h… on Monday, October 5, 2015 - 15:15 It's a shame, I can't play the whole game when this thing is not supported. The first 2 tutorial level are fine, but when the game is loading the third level it closes. I think I have to wait for an update and when it still doesn't work I will delete it Hi, I'm on the scene where By Sean Terry on Monday, October 5, 2015 - 15:15 Hi, I'm on the scene where they're throwing the arrows. The third part of that where this big monster comes, I don't know how to fight it. I can't figure that one out at all. If anyone can give help, that would be awesome. Thanks a lot! Killing the third monster By Igna Triay on Monday, October 5, 2015 - 15:15 To kill the marauder you need to know his pattern. That is, first he sort of growls, and then he starts walking towards you. Block at that when he growls, and after he makes the first strike, attack him quickly. Hope this helps. Well, finally I finished the By Igna Triay on Monday, October 5, 2015 - 15:15 Well, finally I finished the game. It is very cool. However, it would be cool if there was a survival mode. Does anyone know how to contact the developers by email instead of Twitter? Any help would be appreciated. I'm playing this on my 4S. By Shersey on Monday, October 5, 2015 - 15:15 In reply to It's a shame, I can't play by hanif naufal h… I'm not having too many issues. I think I had the game crash once at that exact same spot when you get your sword, but taking the game out of the app switcher and loading it again fix that problem. I would highly suggest with the game like this that you have nothing except it running. Even if the apps in your app switcher don't say that they're active, close them anyway. Good luck, and I hope this helps you. Thanks, Shersey Wow thanks, I will reinstall By hanif naufal h… on Monday, October 5, 2015 - 15:15 Wow thanks, I will reinstall it and see if this trick will work. Hack'n'slash meets Sangre! By Ken Downey on Monday, October 5, 2015 - 15:15 Hack'n'slash meets Sangre! Love this! Also, I think they updated it because I got progress notifications as it downloaded. Instead of just saying download in progress, it said ten percent etc. I could wish it were more challenging than it is, but I'm not all the way through, so maybe it'll get even harder, but I also know people have finished already. It needs difficulty levels or something I think. The sound is very well done, and I'm wondering if they used the Papa engine. It sure sounds like it! Great game for sure. it still doesn't work even By hanif naufal h… on Monday, October 5, 2015 - 15:15 it still doesn't work even when I close it from the app switcher and loading it again. what should I do? I'm using iOS 9.0 I guess contact the By KE7ZUM on Monday, October 5, 2015 - 15:15 I guess contact the developers if that's not the case then it does not support your device, at least it's not supposed to. how do I contact the By hanif naufal h… on Monday, October 5, 2015 - 15:15 how do I contact the developer of the game? I go to it's website but I don't found the contact link. Impressed so far By Clare Page on Monday, October 5, 2015 - 15:15 I got started with actually playing A Blind Legend yesterday, and I'm very impressed with it so far: I have had no problems running it on my iPhone 6. I admit hat I haven't got very far yet, just to the level where I learned the sword-drawing gesture, as I tested the game late last night and didn't want to stay awake half the night playing it, but I'll definitely be going back to the game later today. The sound is very immersive, definitely a good thing: I can picture myself as Blake going through the places Louise leads him through, and I like the fact that if you're not sure where to go you put your finger on the screen for a second and Louise will tell you to go in whatever direction she is. I'm also pleased to see that buying extra lives is not expensive: as I am the kind of person who tends to get killed in these adventurous games, I decided to buy twenty lives, and that only cost me 2.99 euros. My one big criticism of this ggame is the "get someone to help you" label on some options: this should perhaps be changed to something like, "If you are blind, VoiceOver will be needed". Otherwise, I personally think this game is well worth getting: I expect it'll get harder later but I'll face the harder scenes when they come. Agreed with the last comment By Joseph on Monday, October 5, 2015 - 15:15 I agree with the last comment posted here. It's a wonderful game. And for free, too. Who the hell can complain about that kinda price tag? :) Hanif, to answer your question By sockhopsinger on Mo'''
