title = "iPhone 16 E announced starting at $599/£599 | AppleVis"
description = "Quick take aways: Single 48 mp camera. No magsafe. Action button but no camera button. Custom modem with (best battery ever seen in a 6.1 iPhone) Apple Intelligence Face ID (no home button) Starting price for 128 gb storage, $599/£599 Now the line up is: i16 E: 599 15: 699 (better cameras and MagSafe but no apple intelligence) 16: 799 16 +: 899 16 pro 999."
full_description = '''By Oliver, 19 February, 2025 Forum iOS and iPadOS Quick take aways: Single 48 mp camera. No magsafe. Action button but no camera button. Custom modem with (best battery ever seen in a 6.1 iPhone) Apple Intelligence Face ID (no home button) Starting price for 128 gb storage, $599/£599 Now the line up is: i16 E: 599 15: 699 (better cameras and MagSafe but no apple intelligence) 16: 799 16 +: 899 16 pro 999. Options Log in or register to post comments Comments excellent buy By Dennis Long on Thursday, February 20, 2025 - 15:31 I think it is an excellent buy. Yeah, it's what I'd suggest… By Oliver on Thursday, February 20, 2025 - 15:31 Yeah, it's what I'd suggest for a blind user, certainly. I imagine there will be cases that come out with the magnets in to simulate MagSafe as there are for the iPhone SE. I'm not sure why they're still selling the iPHone 15. That seems like a very poor deal now. I know some will be disappointed with the price. It's no longer an affordable phone, it's simply the base phone of the lineup. Plus the iPhone SE is now discontinued. By Levi Gobin on Thursday, February 20, 2025 - 15:31 This marks the official end of iPhones with a home button, from June 29, 2007, to today, February 19, 2025.. Although I myself have gotten used to iPhones without the home button, the idea of it was very simple and easy to comprehend, rather than some gesture you have to use. It kinda hits home when you realize this. No more home buttons. I highly doubt Apple will ever bring this back. Long live the home button! $600 with taxes By Holger Fiallo on Thursday, February 20, 2025 - 15:31 Why not just get the 16. Or, turning that on it's… By Oliver on Thursday, February 20, 2025 - 15:31 Or, turning that on it's head, why bother getting the 16? its 33% more expensive for more cameras, MagSafe and the camera button. I'm not sure I think that's worth it. On the SE, I'm hoping there will be some good deals on the 2022. My mum is rocking an iPHone 7. She's sighted but really likes the formfactor and the home button. To be honest, part of me, if it's the right price, fancies the smaller phone too. Oliver By Holger Fiallo on Thursday, February 20, 2025 - 15:31 People need to check any deal with their phone company. I am sure they will give special deals. Myself got went from 13 pro to 16 pro max. Happy. Re: 16e By Brian on Thursday, February 20, 2025 - 15:31 Thank God it does not have a camera button. Personally thought that was one of the worst ideas Apple ever incorporated into the iPhone model. One of those "great on paper, not so great in execution". I would absolutely buy this phone. Regarding MagSafe, you can simply get a case to enable MagSafe. My current iPhone, SE 2022, has MagSafe capability thanks to the case I'm using. I'm also very happy with the single camera design. I actually feel good about this models overall design and functionality. Brian By Holger Fiallo on Thursday, February 20, 2025 - 15:31 Agree. They blew it. They could just givin the action button more power by making it more flexible. My next model By WellF on Thursday, February 20, 2025 - 15:31 I won't be able to change devices in the near future but it's very likelly I'll buy one of these 16E. A reminder, there is no real… By Oliver on Thursday, February 20, 2025 - 15:31 A reminder, there is no real such thing as a deal with carriers. You are still paying for the phone though maybe over a longer period. If you can, and you are interested in any of apple's phones, I always suggest either buying outright, though that is difficult for most, or taking them up on their 0 % payment plan. In this case, here in the UK, it is around £24 a month for two years. You then can shop around for sim cards. It is a little more work but you'll get a far better deal over all without being tied into a cellular contract. Yes, Brian, it was your case I was thinking of. I also wonder, considering it is the 16 e, do you think they might move forward with a 17 E the same time next year? It feels like they may be using up old stock to make these, IE, over produced the 14 chassis and repurposed it for the 16 E. I wonder if they won't do the same with the 15 casing etc. I'll Wait for 2nd gen By David Lai on Thursday, February 20, 2025 - 15:31 I'll wait for Apple's second gen cellular modem chip. I'm sure the C1 inside the 16E won't be as powerful as the Qualcomm chips traditionally found on iPhones. I'm not sure 'powerful'… By Oliver on Thursday, February 20, 2025 - 15:31 I'm not sure 'powerful' really matters. I'm not looking for a monster downloader in my phone, much better that it increases efficiency, as this one seems to do, there by extending battery. I'm excited to see how this translate to battery on the 17s... But I'm a very sad and boring person. what case are you using that has magsafe capabilities? By JC on Thursday, February 20, 2025 - 15:31 Hi, What case are you useing that has magsafe capabilities? I have an iPhone 14 pro with magsafe, and it even includes a case with magsafe, however, I don't think it'll fit the iPhone 16E, as it only supports the pro. also, I'm not sure if I can hold on to it much longer, as it still includes lightning, which has been removed completely in favor of USB-C. And since my Macbook includes USB-C, I may as well upgrade in future. You can get the apple USB-C wired earpods which will not only work with the iPhone 16E, but will also work with macs with USB-C ports. I will provide a link By Brian on Thursday, February 20, 2025 - 15:31 Give me a moment and I will dig up the link to the case I have. These cases go from the iPhone SE models, which I have the 2022 version, all the way up to iPhone 15 and/or 16. Will the cases work with the iPhone 16E? By JC on Thursday, February 20, 2025 - 15:31 Awesome! Will the cases work with the iPhone 16E? Camera button on iPhone 16 By Missy Hoppe on Thursday, February 20, 2025 - 15:31 I've had my ultramarine iPhone 16 since January 28, and all things considered, I think it's the best iPhone I've ever had. I simply use the action button as I did the mute switch on previous models. As for the camera button, I like it a lot! For me, it makes taking pictures a lot easier, and more importantly, I was able to take the camera app out of my doc; I always kept it in the last dock position so that it would be easier for friends and family to access it if need be. Now, I'm able to put the eZ fair app there which I use for buying paratransit tickets. So far, battery life has exceeded expectations, although my iphone 13 pro's battery life was getting pretty sad by the time I traded it in. I'm trying to do a better job of following best practices guidelines with my new phone to keep it's battery in good shape for as long as possible. My only concern is wireless charging. Obviously, it's safe since they've had it as a feature for years now, but I can't help thinking that I remember reading somewhere that wireless charging is harder on phones. I'm using a wireless charger for now, but have a USBC cable near by as well in case I decide to charge that way instead. Then again, the apple watch can only use wireless charging, and my Apple Watch Ultra from 2022 is still doing reasonably well for its age. Anyway, if I hadn't just gotten my iPhone 16, I might have considered this 16E model, but it probably doesn't come in the beautiful ultramarine color, and since I appreciate having the camera button available, I don't regret my purchase. It depends. Magsafe for… By TheBlindGuy07 on Thursday, February 20, 2025 - 15:31 It depends. Magsafe for starter will already do huge difference with less dissipation and energy loss so less heat. Then, I have the 10000ma external battery pack from ugreen and it heats less than other qi chargers I've tried. Here is my case By Brian on Thursday, February 20, 2025 - 15:31 Here is the case I currently use. As I have the product red model iPhone SE 2022, I have the clear case, so I can show off its beauty to anyone who can see it. 😇 https://www.amazon.com/dp/B0CNK5NK1Y?ref=ppx_pop_mob_ap_share Upon further review By Brian on Thursday, February 20, 2025 - 15:31 It appears they have updated their inventory, and now even carry cases for the new iPhone 16(E) model! 😃👍 No uwb and about the price By Abdulwahab on Thursday, February 20, 2025 - 15:31 This is something I haven’t seen people talk about here, I think uwb is important. Also the price is ment to push people to get the 16 instead. The 16 in my country launched at about 150$ overprice, now it’s down to the official 800$ on some sites. I expect the 16e to launch overpriced too! So that would be a tough choice given that the price difference would be less than 200$ may be 100$ or 150$ Not for me. By Brad on Thursday, February 20, 2025 - 15:31 I'm probably not going to buy it this year but I'd choose the smaller phone every time. Sure the speakers might be better in the bigger phones but I don't need amazing speakers. I did grow up with smaller phones so that might be the reason why but i've always enjoyed small phones over bigger ones any day. Having said that; I like big laptops. Our brains can be strange sometimes. I don't think small phones… By Oliver on Thursday, February 20, 2025 - 15:31 I don't think small phones are coming back. It's like they want them to take over our lives or something. Remember, with a lot of this stuff, we're the product, not the customer. I know that sounds really tinfoil hat, but apple provides a platform for businesses to access you, serve you, and take your money or data. Apple works as a window between us, the product on one side, and their real customers, businesses on the other paying large amounts through app store taxation etc. They want that window to be big, to be clear, to remind you it is there in your pocket so you reach for it without even thinking. This is why small, subtle phones won't return. Down with conformity! By Brian on Thursday, February 20, 2025 - 15:31 All embrace simplicity. All embrace mindlessness. All embrace the abacus! Oh, and if I could have my way, I would have my iPhone SE 2022 forever! 🥸 I'm in a bit of a pickle. My… By Oliver on Thursday, February 20, 2025 - 15:31 I'm in a bit of a pickle. My mum desperately needs a new phone, she's on an iPhone 7, and I'm looking at the SE 2022. I guess there will be another couple of years of support for it, 2028 on the outside? I really don't think the 16 E wil give her anything she cares about. What's the battery like on the 2022 SE if I can get a new one? I know I could get her a battery case, but rather avoid it as she's got qi charging in her car. She's certainly not a heavy user. @Oliver By OldBear on Thursday, February 20, 2025 - 15:31 I went from a 7 to an SE 2022. The battery gets me through a day on a charge, unless I do a lot of Seeing AI scanning that uses the phone light or something like that. That's good to know. Thank… By Oliver on Thursday, February 20, 2025 - 15:31 That's good to know. Thank you. Modem By Travis Roth on Thursday, February 20, 2025 - 15:31 I'll be interested to see how the new in-house Apple modem performs in the real world. They claim it is more efficient. That is all well and good, but when I hear more efficient I also hear lower power. This is also probably fine in 90% of situations, but around here we have some rural areas pretty far from towers and it takes the best modems and considerable battery power. Hopefully someone else tests it before my family has to. Re: Battery By Brian on Thursday, February 20, 2025 - 15:31 Hey Oliver, There are a number of settings you can toggle to gain an optimal battery life on an iPhone SE 2022. If you'd like, I could post a list of what I have done with my device, either here or through a private message, just let me know. I am guessing your mother has eyesight? Not that it matters, just knowing this will help me to know what to avoid, like VoiceOver settings for example. Thank you for the offer. I… By Oliver on Friday, February 21, 2025 - 15:31 Thank you for the offer. I think I'm decided on the 16E though. Squeezing battery life, especially for my mum, who is indeed sighted, yet tech adverse, might be a losing battle. she does tend to enjoy tech after a while, but she's not good at acclimating to it. As I said in the other thread, long term support, battery and the difficulty of actually finding a new 2022 unit, has pushed me to the 16E. She'll be very happy with it, I'm sure, after the usual several days of her being very quiet about it. She wanted a laptop about 16 years ago and, being young and foolish, I decided to get her the first iPad instead. It did not go down well. there were even tears. A month later she came back to me and said sorry and that it was amazing and absolutely perfect for her. I'm hoping this is less of a tempestuous transition. Screen By Travis Roth on Friday, February 21, 2025 - 15:31 Sighted peoples love big screens for the most part. My mom barely cares about tech but if we shrunk her phone's screen she'd be upset. SO I bet the bigger screen will be a win for you. Fair enough By Brian on Friday, February 21, 2025 - 15:31 I only offer because you said she liked the form factor of her iPhone 7. As you know, the SE 2022, is essentially the same form factor as the iPhone 7. 🤷🏽‍♂️ difference between magsafe and conventional wireless charging? By Missy Hoppe on Friday, February 21, 2025 - 15:31 Just curious what the difference is between magsafe and older versions of wireless charging. I just got a couple of 3-in-1 wireless chargers from Amazon, and now I'm wondering if I should have made sure to get something magsafe specific instead. I truly plan to keep my iphone 16 until it's no longer functional/supported, so I want to do everything I can to treat it right. Is using a non-magsafe charger going to hurt it? Should I just use USBC charging instead? Can authentic magsafe charging only be through chargers sold by Apple? Thanks to anyone who can help this whole topic become less confusing. MagSafe uses magnets on the… By Tyler on Friday, February 21, 2025 - 15:31 MagSafe uses magnets on the back of supported iPhones and compatible accessories to ensure optimal placement for fast charging. Other Qi certified wireless chargers should also work normally and safely with all recent iPhones, albeit with lower wattage and thus slower charging speeds. magsafe By Holger Fiallo on Friday, February 21, 2025 - 15:31 It helps the phone center from my understanding. This help charge fast and avoid taking forever. Someone will let us know if this is right. Hope she likes it By OldBear on Friday, February 21, 2025 - 15:31 And let us know what you think of it, Oliver. I don't use wireless charging, but I think magsafe charges a lot faster than the old kind, @Missy Hoppe. Thanks! By Missy Hoppe on Friday, February 21, 2025 - 15:31 Well, if charging speed is the only difference, then it sounds like the wireless chargers I got are safe for my new phone. They ha'''
