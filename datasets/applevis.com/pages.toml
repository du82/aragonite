["https://applevis.com/apps/ios/education/voice-dream-text-voice"]
title = "Voice Dream - Text to Voice | AppleVis"
description = "Apple Design Award Winner! Voice Dream - Screen Reader lets you listen to PDFs, textbooks, Web pages, emails, and books using advanced AI Text To Speech! Featured by Apple as Best New App and App of the Day in 81 countries. Voice Dream - Screen Reader is also part of App Store Permanent Collections in Education. ---------------------------------------------------------------------------------------------------- “Both experts recommend Voice Dream Reader as the best app in the text-to-speech space.” - Wired"
full_description = '''Category Education Description of App Apple Design Award Winner! Voice Dream - Screen Reader lets you listen to PDFs, textbooks, Web pages, emails, and books using advanced AI Text To Speech! Featured by Apple as Best New App and App of the Day in 81 countries. Voice Dream - Screen Reader is also part of App Store Permanent Collections in Education. ---------------------------------------------------------------------------------------------------- “Both experts recommend Voice Dream Reader as the best app in the text-to-speech space.” - Wired “This app is one of the best educational finds of my entire career.” - Forbes “As a user myself and as a mother of a child with dyslexia, I am blown away by the features of Voice Dream.” - Quartz “Voice Dream Reader is hailed by many as the best mobile text-to-speech (TTS) app.” - Examiner ---------------------------------------------------------------------------------------------------- Text-to-Speech - 36 built-in iOS voices in 27 languages are also available for free. - 200+ additional premium voices in 30 languages from Acapela, NeoSpeech and Ivona available through in-app purchases. - Correct pronunciation with your own pronunciation dictionary. - All voices work offline and play in the background even with the screen locked. Supported Document Formats - PDF, Plain text, MS Word, MS PowerPoint, RTF, and Google Docs. - Textbooks - Web articles. - Bookshare Books. - EPUB eBooks. (DRM-free books only. Kindle, iBooks and most commercial eBook platforms are not supported.) - DAISY text-based books and audiobook. - Audiobooks in MP3, MP4 or zipped MP3 format. - Rich text and image support for all documents. Built-in Scanner - Scan paper documents with the camera for text-to-speech. - State-of-the-art A.I. is fast and accurate, even in poor lighting conditions. - Works entirely on device: No need for internet and your data stays private. - Only languages using Latin alphabets are currently supported. Reading Styles - Tee-up a list of articles and play while you drive, walk or run. - Spoken word is highlighted to improve comprehension and retention. - Auto-scrolling and full screen, distraction-free mode to help reader focus. - Finger reading. For beginners to read by at running a finger under each word. - Pac-Man. Harvard and MIT developed speed-reading method for everyone to read at 2x speed with no loss of comprehension. - High contrast and large font size for low vision readers. - Optimized for VoiceOver, Braille and switch control. Tools - Recognize text for scanned PDF documents. - Bookmarking, text highlighting and annotation. Highlights and notes can be exported. - Full-text search. - Built-in dictionary. - Automatically skip text in PDF header and footer. Content Sources - Native support for Dropbox, Google Drive, iCloud Drive, Pocket, Instapaper and Evernote. - Native access to Bookshare. - Safari extension to save Web pages and Web addresses. - Support for Box and OneDrive via iOS Document Picker. Library Synchronization - Your entire library, including folders, reading locations, bookmarks and annotations are synchronized across all your devices using iCloud Drive Terms of Use: https://www.apple.com/legal/internet-services/itunes/dev/stdeula Version 4.23.4 Free or Paid Requires Subscription Apple Watch Support Yes Device(s) App Was Tested On iPhone iOS Version 15.6 Accessibility Comments This is a very accessible app, and the developers seem truly committed to improving it. Organizing content is somewhat difficult and may require sighted assistance, but downloading and reading content works very well. As of the latest release, 2.7.2, the developer has fixed the issues noted below with regards to the inaccessibility of the text box. It is now possible to read by words, characters and lines through the text with voiceOver. VoiceOver Performance VoiceOver reads all page elements. Button Labeling All buttons are clearly labeled. Usability The app is fully accessible with VoiceOver and is easy to navigate and use. Other Comments The samples for peter (happy) and peter (sad) which previously did not play are now working properly. App Store Link https://apps.apple.com/us/app/voice-dream-reader/id496177674 Developer's Website http://www.voicedream.com/ Developer's Twitter Username @voicedreamapp Related Podcast http://www.applevis.com/podcast/episodes/voice-dream-reader-powerful-and-award-… Recommendations 40 people have recommended this appMost recently recommended by Michael Hansen 2 months 1 week ago Options Log in or register to post comments Comments which voices are available as By alex wallis on Saturday, January 5, 2013 - 15:12 which voices are available as in app purchases? Any names we might recognise? Acapela voices By Tangela on Saturday, January 5, 2013 - 15:12 All of the Acapela voices are available as in-app purchases. Read2Go, the official bookshare app, gives access to two of the US english voices, but their are tons more in this app, and they're only 2 dollars compared to the 10 or 20 that most apps charge for downloading those voices. You can preview all the Acapela voices at http://www.acapela-group.com/speech-synthesis-voices.html Not easy to navigate inside the book. By Igor on Saturday, January 5, 2013 - 15:12 One thing, which is definitely missing in this app is an ability to easily navigate inside the reading book. I have not find the way to skip back or forward a small amount of text. It is possible to use the slider at the buttom of the App to move by 10 percents of the book, however to skip several minutes, no chance, or at least I did not find the way to do so even after reading the help. Would be wanderful to have buttons to move back or forward for the predefined amount, would be even better to be able to configure those buttons in settings. Or at least to be able to fast forward or rewind while press and hold keys at the buttom of the book page. Will try to contact developer to see, if such changes could be implemented. predefined bookmarks and search feature By Tangela on Saturday, January 5, 2013 - 15:12 Although a fast forward option would be quite useful, their are actually two ways of navigating through books. First, the search feature lets you search for specific text in the book. Each result is followed by a play button which you can press to instantly move you to the specified location in the book. Furthermore, in formatted books, such as those downloaded from bookshare, their is a button called "bookmarks" when you are inside the book, most easily accessed by touching the play-pause button and 1-finger flicking to the left. There you can access either predefined bookmarks, such as chapters, or user defined custom bookmarks. Hope this helps. I have just contacted the By Igor on Saturday, January 5, 2013 - 15:12 In reply to predefined bookmarks and search feature by Tangela I have just contacted the developer of the App, so hopefully they will be able to provide the ability to skip some text inside the reading book. The ability to search and bookmarks are definitely useful features, however I don't think, they will help if you need to skip backward or forward 2 pages, or I just realized, I have missed something at the beginning of last page and would like to come back to re-read it. I question the legality of bookshare integration By synthesizer101 on Saturday, January 5, 2013 - 15:12 Do any of you know whether bookshare has sanctioned the use of voice dream reader to read out the bookshare books? Given the fact that they have their own app, they may not allow third-party developers access. I don't know. Other apps out there which read Bookshare content. By Shersey on Saturday, January 5, 2013 - 15:12 In reply to I question the legality of bookshare integration by synthesizer101 There are other apps out there which read bookshare content, such as Indaisy and Daisy Worm. At least, I'm pretty sure these two apps are supposed to be able to read Bookshare content. Maybe they got permission from Bookshare before putting that functionality into their app. I don't know. Thanks, Shersey Version 2.7.0 By Tangela on Tuesday, February 5, 2013 - 15:12 In reply to Other apps out there which read Bookshare content. by Shersey (taken from the ITunes app store) What's New in Version 2.7.0 - Availability of new voices from NeoSpeech: Paul and Julie. - New voices from Acapela: Will, Micah, and Raul. - Localization for French, Spanish, Catalan, Chinese, and Russian. (Big thanks to volunteers who did this!) - Add bookmark button. - 30-second rewind and fast forward buttons. - Go-to-percent button next to the slider when VoiceOver is on. - Export full text. - Export highlighted text. - Share what you're listening to via Facebook, Twitter, SMS, and email (iOS 6 only) - Open in Safari for items that originated from Web pages. - Bookmarks for the built-in Web Browser. - Increased maximum font size. - Marking multiple articles "Unread" in edit mode. - Option for Pocket full synch: Archived or deleted articles in Pocket will be deleted in Voice Dream. - Bluetooth headset and speaker controls for play and pause are enabled. - Voice download now possible over mobile data network (3G/4G). - Focused Reading Mode now available on iPhone and iPod touch. Pinch the text area to activate. - Disabled idle timer when the Reader is open so the screen won't auto-lock. - Minor improvements for use with VoiceOver. - Advanced Setting: You can now turn off going to full-screen automatically. - Advanced Setting: You can disable rewind button from ever changing the reading location. This is now the default behavior. - Advanced Setting: You can assign rewind and fast forward button on the remote control to the 30 second rewind and fast forward. - Fixed: Deleted articles not removed from the home screen when offline. - Fixed: Occasionally losing the reading location. - Fixed: Some articles from Pocket causing the app to crash. - Fixed: Sleep timer activation invoking Play-Pause button first. ... worth picking up By Signaltonoise on Tuesday, February 5, 2013 - 15:12 Is this app worth picking up? It's free to try, so go for it By mehgcap on Tuesday, February 5, 2013 - 15:12 In reply to worth picking up by Signaltonoise The app is free to try, so download it and give it a whirl. I did, and even hooked my Bookshare account up and grabbed a few books. My personal problem with the app is that I really hate A Capella voices, but if the dev offered other solutions, even free ones like ESpeak (yeah, I know most people hate it) I'd probably buy it. There is no daisy navigation, so that's something to keep in mind; the app is an article/book reader, not a daisy reader at present. Still, as I said, you can try it out to see if you like it, then buy the full version if you want to. The trial has full functionality, but it stops reading after a couple sentences, so you have to keep hitting play to read more. I just bought the app a few By Sean Terry on Tuesday, February 5, 2013 - 15:12 I just bought the app a few hours ago, I cannot get the Peter happy, Peter sad, and will voices to play the demos. So I don't know whether I would want to download them. Is anyone else having this problem? Hi Sean By Joe on Tuesday, February 5, 2013 - 15:12 In reply to I just bought the app a few by Sean Terry Hey Sean my peter voices played. I didn't buy them, but the preview did work. I really like this app, but one feature I liked was broken this update the sleep timer. It now looks like the timer in tune in where I can see strt or cancil but no flicker itum. In the older app it worked which was pretty sweet. Now however I have the Paul voice, so I guess its a trade off. Same problem with preview By David Goodwin on Tuesday, February 5, 2013 - 15:12 In reply to I just bought the app a few by Sean Terry I have the same problem with the preview not playing for those voices. The two additional Peter voices have never previewed since I bought the app several weeks ago. Strange that they work for others. Possibly it's a geographical problem, and might depend upon your location. I don't like the Peter voice anyway, and I'm guessing that having him happy or sad wouldn't alter that. Voice Dream Reader--Inapp purchases By Ketan on Tuesday, March 5, 2013 - 15:12 In reply to Same problem with preview by David Goodwin I have purchased several voices for the app but do not have VIFI and hence want to download them on PC using Itunes. Can I? How? Please do help. Ketan Not all there yet, but still worthwhile By Weary Mouse on Tuesday, March 5, 2013 - 15:12 In reply to Voice Dream Reader--Inapp purchases by Ketan Here is a really beautiful reader that is not fully accessible, Contrary to what is stated above. Most specifically, as is stated in their own help document, there is no VoiceOver access yet to the text screen which is what will be needed to be able to fine tune reading to the sentence and paragraph level, look up words, copy text, etc. They state that this will be available in the future and I look forward to it. I would appreciate it if the person who contacted the developers would share how they did so, as I am not easily finding that information. It connects beautifully with Bookshare once you enable that feature with your Bookshare ID. You don't get Bookshare descriptions of books as you do in Read2Go, but you can use Safari for that and I don't think that's what we need the app for. What we get in this app is the ability to read books using other voices besides the iPhone voices and the heather voice in Read2Go. The default voice in Voice Dream Reader is also Heather. To my ear, their implementation of Heather is more fluid than in read2Go. What we also get is the ability to read other documents and articles with these voices. Of particular value, is the ability to read books and documents in other languages using these more human sounding voices. I personally prefer less human voices in English, my first language, but if I want to read in Spanish, where I do have some skill, I struggle with any of the iphone voices. Even with the current lack of control we have using this app, I think its worth the price. For those who got stuck in trying out the Peter voices, download the lite version of the app. There are no demoas but if you tap on the option to try them, which is free in that version, they will download and work. One thing missing, however, is the option to really try out their more expensive voices, Paul and Julie, which are not in the lite version. Since the voices really sound different at the speed I prefer I can't really tell if I like them enough to actually use them if purchased. podcast By Joe on Tuesday, March 5, 2013 - 15:12 In reply to Not all there yet, but still worthwhile by Weary Mouse I can do a podcast demoing voices and such if it would be helpful. I have Paul anyway, so at least you could hear it. Paul and Julie By Tangela on Tuesday, March 5, 2013 - 15:12 In reply to podcast by Joe h'''
