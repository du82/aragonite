full_description = "The AppleVis Bug Tracker is a database of VoiceOver, braille, and low vision-related bugs on iOS and macOS. Important Notes This area of AppleVis lists accessibility-related bugs which members of the AppleVis Editorial Team have personally verified and reported to Apple. Each bug listed has been given a severity rating; these ratings are based upon what we believe to be the implications for accessing and using features and functionality, whether there is an effective workaround, and the level of impact on the overall user experience. However, as these ratings are subjective, it is very possible that they may not reflect your own opinion or use case. We make no claims on the completeness or accuracy of our testing. We are only a small team, and it is simply impossible for us to test all devices, configurations, applications, and use cases; this is especially important to note as Apple's ecosystem continues to expand. Some of the bugs listed here will be specific to a certain device, configuration, or use case. Consequently, it is entirely likely that you will not encounter all of what we list; and it is also probable that you will encounter bugs that we have not identified or listed here. It is important that you let Apple know of any additional bugs that you find during your own use of your Apple devices. This post explains why you should report bugs directly to Apple, as well as the best ways to do so. iOS,iPadOS, & macOS Bug Lists Active Bugs Active iOS & iPadOS Bugs Active macOS Bugs Fixed Bugs Fixed iOS & iPadOS Bugs Fixed macOS Bugs"
