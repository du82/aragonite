["https://applevis.com/forum/app-development-programming/how-go-beginning-end-document-pycharm-mac"]
title = "How to go to beginning / end of the document in pycharm on mac? | AppleVis"
description = "First, even though the accessibility can be rough on the edges, I completely understand now why pycharm is loved on mac, the experience is incredible with voiceover in the editor especially, getBrains understand that coders want to stop at each symbol and not at the beginning / end of a word like the systemwide option left / right arrow keys. It's just so awesome!"
full_description = "By TheBlindGuy07, 4 March, 2025 Forum App Development and Programming First, even though the accessibility can be rough on the edges, I completely understand now why pycharm is loved on mac, the experience is incredible with voiceover in the editor especially, getBrains understand that coders want to stop at each symbol and not at the beginning / end of a word like the systemwide option left / right arrow keys. It's just so awesome! So I have a little small useless to the society project I'm trying to do in python for learning purposes like most junior devs do when they have a mac aside the fact that I will probably never be digital nomad (which means even less than the trendy word ai we have everywhere since 2022) and will not be tweeting my macbook stickers, which don't have anyway. :) When I press command up/down arrow in the editor in pycharm, I seem to move between a navigation bar and the actual text editor. Very useful, but how do I move in the document itself, from beginning to the end? Thanks! PS: I don't know java enough to understand the joke itself but it seems cool and I saw this in the mailing list of stormux where the admin and founder has random email signature, probably yet another automation on top of the linux nerd with pgp keys. If Java had a good garbage collector, it would remove itself. Options Log in or register to post comments"
year_published = 2025
