title = "Adventure To Fate: Core Quest | AppleVis"
description = "Hi, I am the developer of the Adventure To Fate series. I appreciate all the support I get on this site and its forums. Note: I made a similar post to this last year for the last game I released so it may sound similar."
full_description = '''By Adventure To F…, 10 February, 2025 Forum iOS and iPadOS Gaming Hi, I am the developer of the Adventure To Fate series. I appreciate all the support I get on this site and its forums. Note: I made a similar post to this last year for the last game I released so it may sound similar. The game has been in development for about 9 months now (using the game engine I built over the last 10 years) and is approaching release on February 27th. I have worked with a group of about 15-20 VoiceOver testers to make this game as accessible as possible. Once again the game should have large improvements over the previous ones (New soundtrack. more sfx. more written descriptions for monsters, items, and spells! The game is not just accessible but built and functioning with accessibility as the main focus. It still isn't perfect but should always be getting better! Anyways the game is now open for pre-orders on the App Store here. https://apps.apple.com/us/app/adventure-to-fate-core-quest/id6529525011 I will try to post a little preview of the game content and story every few days as well as a little behind what is new to this game compared to the previous game Lost Island. If you have any questions feel free to ask here or join the discord here for more direct access: https://discord.com/invite/tksWbSnThu Note this is a premium paid game with no ads or IAP or anything like that. Everything is fully unlocked from the start. I understand not everyone has money to spend on ios games so if you need some assistance getting the game let me know after release and I will work with anyone from this forum to get them a copy. Thanks for your time and support! Options Log in or register to post comments Comments Is there a lot of map stuff in this game? By Brad on Tuesday, February 11, 2025 - 15:17 I think your last game had a lot of map stuff where you had to remember where you'd gone and go through portals to get to other floors? Is this game like that? Or is it this game and I've just forgotten it. The maps are easier to navigate. By Adventure To F… on Tuesday, February 11, 2025 - 15:17 The maps in this game should be much easier to navigate. This is a much more simple layout. You are basically going down a dungeon. Every floor has an up and a down staircase. In some of the later end-game levels, there is a bit of exploring outward but otherwise most VoiceOver users think it's much more simple to navigate. That is not to say you cant explore and find stuff but the actual completion of the dungeon is a lot more straightforward. There is also a system in place that tells you if you have visited the room or not. As well as checking the rooms around you (to the north east south and west) if they have been visited. Interesting. By Brad on Tuesday, February 11, 2025 - 15:17 I'd like to try it for free please, i could then pay for it if I like it. Sounds good By Adventure To F… on Wednesday, February 12, 2025 - 15:17 @brad yes I will send you an early copy early next week so you can check it out yourself! Great! By Brad on Wednesday, February 12, 2025 - 15:17 I'm looking forward to it. how's the audio and sounds like ? By ming on Wednesday, February 12, 2025 - 15:17 does it have immersive audio and sounds? to let us enjoy the game more? Audio and sounds By Tayo on Wednesday, February 12, 2025 - 15:17 Hi, I've been testing this game for quite some time now. The music is great. New sounds are included for different spell types, collecting spirits, and the like. Attacks still sound pretty generic but I expect that will changein future updates. Sound and new build By Adventure To F… on Thursday, February 13, 2025 - 15:17 @ming Yes I had a musician compose the whole sound track and as for sound effects I have about 90 different sounds. @brad I messaged or or will try to on this platform so I can send you an early build to check out. Adventure To Fate: Core Quest Class Preview By Adventure To F… on Thursday, February 13, 2025 - 15:17 Adventure To Fate: Core Quest Class Preview Here is a little preview of the Classes in the new Adventure To Fate: Core Quest game. Wizards are masters of raw magic, bending the elements to destroy and defend. Core Stats: Int, Wis Knights are a bastion of strength, wielding mighty weapons and clad in impenetrable armor. Core Stats: Str, Agi Rogues are a shadow in the night, striking unseen with ruthless precision. Core Stats: Agi, Str Shadow Rangers are spectral hunters, bonded to spirits and deadly from afar. Core Stats: Agi, Str Monks are a living weapon, striking with blinding speed and unwavering focus. Core Stats: Agi, Wis Ancient Archers are wielders of primordial forces, turning arrows into elemental fury. Core Stats: Agi, Int Clerics are healers and protectors, channeling faith to mend wounds and banish darkness. Core Stats: Int, Wis Illusionists are cunning tricksters, using deception and stolen power to bewilder foes. Core Stats: Int, Wis Paladins are a Mystical Class. Paladins are holy crusaders, wielding divine magic to smite foes and shield allies. Core Stats: All Stats Assassins are a Mystical Class. Assassins are hired killers, trained in the art of silent, deadly execution. Core Stats: Agi, Str Witches are a Mystic Class. Witches are masters of dark sorcery, weaving shadow, and arcane power into battle. Core Stats: Int, Wis Coming In First Major Update: Naturalist (A mystical druid-like class) As you can tell there is a little overlap from the previous games but all of these classes new or old have new skills, abilities, items etc. If anyone wants to know more about a class in particular let me know. I'll be tinkering with this a bit later on today. By Brad on Friday, February 14, 2025 - 15:17 I've tried it for a bit and I honestly don't think it's for me, perhaps it's just the game stile, but at the same time I can't deny it's fun, odd, huh? It's the map/chess like movement. Having said that, tonnes of voiceover fixes have been added compared to previous games, you do get to know if you've explored a square already and like I said, I sort of like it. I'll give it another go later on today and decide then. Thanks for letting me try the game for free anyway, I understand you lose out on money and that's a big thing for a small developer so I really do apreciate it. Do you have a donation page in case I decide the game isnt' for me? I really respect the voiceover work that has gone into this. OK, I tried it and yeah. By Brad on Friday, February 14, 2025 - 15:17 It's not for me,so if you do have a donation link, let me know. Thanks Brad By Adventure To F… on Sunday, February 16, 2025 - 15:17 Hey brad thanks for giving it a try and sorry you couldn't get too into it. I appreciate you enjoyed the extra work I put into the voiceover though! I don't have a donation link but if you change your mind when the game comes out you can always purchase it down the road. Streaming on Twitch Tomorrow 2-15-25 Sunday 10 AM PST By Adventure To F… on Sunday, February 16, 2025 - 15:17 I plan on streaming the new game as well as answering any questions about the game on Sunday 10AM PST. So if you have questions about the new game or just want an overview of what is new and included in the game tune in. https://www.twitch.tv/touchmint Submitting Final Build Soon! By Adventure To F… on Wednesday, February 19, 2025 - 15:17 Hey guys just another a quick update. I finished up the Apple promo material (screens, videos, etc). Now I am just on to final testing and hopefully submitting the final build later today or tomorrow to Apple! For those who didn't listen to the stream I posted it up on youtube here is a link for it. https://www.youtube.com/watch?v=FUDteY06ZfA&t=711s I will likely do another stream next Sunday covering a different class a bit later in the game so people can get some end game feel. I will also continue posting about whats new in this game as launch nears so if you have questions please let me know! From a quick glance at the… By TheBlindGuy07 on Wednesday, February 19, 2025 - 15:17 From a quick glance at the video I understand that this is a sorte of rpg, is it a card driven or action driven rpg game? ... I have nothing against card games but what I'd really want is some real immersive in-game interactibility and for whatever reason it's increasingly harder to see such audio / blind accessible games nowadays. It's a fighting RPG. By Brad on Wednesday, February 19, 2025 - 15:17 Basically you go around fighting monsters with spells and upgrades and all that. It's weapons and magic, not cards and traps. @Adventure To Fait. By Brad on Wednesday, February 19, 2025 - 15:17 I understand if you say no but would I be able to get another test flight link to the ap? I've realised after deleting it that I don't have to play it all at once and that I actually do enjoy the game in small doces. I think that's one of my issues, I feel the need to play something now now now, instead of sitting and waiting on things. I'll have to work on that. Either way, i'll be buying the game to support the voiceover development. If a comparison to… By TheBlindGuy07 on Thursday, February 20, 2025 - 15:17 If a comparison to shadowrine, a hero's call or similar is appropriate then I'll be buying this for sure. @theblindguy hmm, no, i'd not make that comparison. By Brad on Thursday, February 20, 2025 - 15:17 It's a game where you go around the map having turn by turn battles. You do upgrade your character and learn skills so that might be something you like. @Adventure to fait, have you thought about making the game a game where you can try one or two flaws and then pay for the wrest? I think people would enjoy that a lot more so that they know what they're getting into. About the game By Adventure To F… on Saturday, February 22, 2025 - 15:17 Hey folks, I have been busy prepping for the launch, sorry I missed a few questions here. The game is a full RPG with 12 classes, 20 races and 6 professions to choose from at the start. 8 of the classes are traditional RPG type classes. You gain skill points every so levels and you choose which skills you want your character to have. 4 of the classes are setup like a roguelike where you get to select from 3 different skills or stats when you level up. Once you get into the game its set up with floors and those floors contain a 5x5 grid of rooms. You move around that 5x5 grid and explore these rooms. These rooms could contain all sorts of things a classic RPG would have. Shops, npcs with dialog, monsters you need to battle, treasures, etc. When you find a room with enemies you will enter the battle section of the game where you are able to turn based fight against hundreds of different enemies. they all have unique skills, drops, descriptions, etc. The goal of the game is to make it to the bottom of the dungeon where you will face the final boss. I have worked extensively with voiceover users to make sure navigation is top notch. I have had a team of 15+ voiceover players testing this game and the previous games for years. Each room and floor is labeled as well as what is on the square and where the next stair case down is that you need to reach. The game even tells you if you have visited a square or not so you don't get lost. I would like to think this game while very deep is extremely approachable and designed from the ground up for voiceover users. this isn't just me labeling a few things and saying it's accessible. Beyond the general RPG I described above the game has some really cool unique features. There are forges where you can create your own items. Name it, add images (optional), choose stats etc. The really cool thing is once you forge an item it has a chance to show up for your other characters in shops. It becomes part of the game. You also have an account vault where you can share items with your other characters. Lastly and a voiceover favorite is the endless arena. Once you beat the game it doesn't just end but you go to a place where you can select any monsters from the game to fight again. So you can create your own battles. At launch this will only be avabile once you beat the game. However for the first update I am working on it so you can just go straight to the endless arena and play the game there in there if you don't want to explore. I understand even with all the work I've done some people don't want to explore so I want that option from the start. There is much much more to this game but the main point here is that the game is not just accessible but built from the ground up to be played using voiceover. This is a full rpg that is extremely deep with tons of game modes, classes to explore, things to unlock etc. While it has all that I believe it is very approachable and a casual game you can pick up and play at any time since it autosave and you can make as many characters as you want. Brad By Adventure To F… on Saturday, February 22, 2025 - 15:17 I am working on a new build right now and I will send you a new copy hopefully later today. As for making the game free to start and then IAP to unlock. I may do another free version down the road but for voiceover users ads are often confusing or break voiceover so I have moved away from that for now. if possible may i also have… By Karok on Saturday, February 22, 2025 - 15:17 if possible may i also have a testflight link? i only am asking as found the other games in the series not very friendly whereas this one seems fabulous!! Thank you, Will @adventure to fait. By Brad on Saturday, February 22, 2025 - 15:17 Thanks, I'll pay for it when I get paid but will enjoy playing it. I have no idea how it's done but you don't have to have adds, you could do something where only the 1st to 3rd floor is playable. Apps have done this in the past. Honestly these games aren't usually for me but the amount of work that's gone in to this one is completely worth it. I really do think making it a app with the ability to unlock the rest of the floors will get blind people and others who want to try before they buy to buy it, especially after they see the work you've done to make it playable. Perhaps you should run a pole of some kind. Looking forward to this one By Brian on Saturday, February 22, 2025 - 15:17 Hi, I am really looking forward to this game's release. I have played a few of the earlier "Adventure to Fate" games, and while they were interesting, did not hold my interest for very long. I am an old school gamer, coming from the original Final Fantasy days on Nintendo, then later on the Playstation, and have longed for a decent JRPG title that was VoiceOver accessible for a long, long time. I am hopeful this will be the one! 🙂 Exactly like shadowrine… By TheBlindGuy07 on Saturday, February 22, 2025 - 15:17 Exactly like shadowrine basically where after completion we get exclusive rooms unlocked... It seems very very interesting. other languages By Daniil Gusev on Sunday, February 23, 2025 - 15:17 Are you considering translating this game into oth'''
