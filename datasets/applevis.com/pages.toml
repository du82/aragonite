["https://applevis.com/forum/assistive-technology/meta-ray-ban-slight-feedback-noise"]
title = "Meta Ray-Ban Slight Feedback Noise | AppleVis"
description = "Good evening! I've noticed a quirk in the Meta Ray-Bans, mostly in BARD Mobile but sometimes with other audio content, that when playing content with lower frequencies (i.e. audiobooks with deeper voices), the left speaker of my Metas starts to make a slight buzzing noise that's barely noticeable unless you're in a semi-quiet room. Has anyone else noticed this? I don't remember getting anything on the speaker and I've already tried a factory reset. TIA! Kyler"
full_description = "By Kyler G, 11 January, 2025 Forum Assistive Technology Good evening! I've noticed a quirk in the Meta Ray-Bans, mostly in BARD Mobile but sometimes with other audio content, that when playing content with lower frequencies (i.e. audiobooks with deeper voices), the left speaker of my Metas starts to make a slight buzzing noise that's barely noticeable unless you're in a semi-quiet room. Has anyone else noticed this? I don't remember getting anything on the speaker and I've already tried a factory reset. TIA! Kyler Options Log in or register to post comments Comments Some suggestions By Brian on Wednesday, January 15, 2025 - 15:30 Heya Kyler, Try adjusting the following settings, and see how your audio goes. 1. In Meta View, go to settings, your glasses, and toggle Microphone Troubleshooting to either on or off (basically the opposite of whatever you currently have it set to). 2. This time go to settings, audio, and toggle adaptive volume to either on or off (again, set it to the opposite of whatever you currently have it set to). 3. Turn the power off on your Meta's, leave them off for at least one minute, then turn them back on. The power button is on the inside of the left arm, right next to the hinge. Just switch it to the opposite direction that it is when they're on, and vice versa. HTH. Did you fix the issue? By Shane on Sunday, March 2, 2025 - 01:30 Hi Kyler, I'm experiencing the same issues with my glasses and was wondering, did you get this issue fixed and how? TIA. Shane @Shane By Kyler G on Sunday, March 2, 2025 - 03:30 Hey there! Thanks for asking! I got the glasses back in December and noticed the issue in January, and while it was annoying for a couple of days, within the next 2 weeks I noticed it less and less. I'm now wondering what caused the issue in the first place because they're working fine for me now. I'm thankful to God that I didn't have to return them like some people in my area were suggesting; that could've been weird! Some suggestions By Brian on Wednesday, January 15, 2025 - 15:30 Heya Kyler, Try adjusting the following settings, and see how your audio goes. 1. In Meta View, go to settings, your glasses, and toggle Microphone Troubleshooting to either on or off (basically the opposite of whatever you currently have it set to). 2. This time go to settings, audio, and toggle adaptive volume to either on or off (again, set it to the opposite of whatever you currently have it set to). 3. Turn the power off on your Meta's, leave them off for at least one minute, then turn them back on. The power button is on the inside of the left arm, right next to the hinge. Just switch it to the opposite direction that it is when they're on, and vice versa. HTH."
