title = "Episode 17 - Special Guest Jared Atchison, WordPress 3.9, ACF v5 - Apply Filters"
description = "Jared Atchison joins us for Episode 17 to talk about his work, contributing to bbPress, the recent WordPress 3.9 release, and more"
full_description = "April 24, 2014 Apply Filters Episode 17 - Special Guest Jared Atchison, WordPress 3.9, ACF v5 Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 55:44 Share Share Link Embed Download file | Play in new window | Duration: 55:44Joining us for episode 17 is Jared Atchison, a well-known developer in the WordPress development world with an impressive portfolio of work. Along with learning about Jared’s day to day work, his recent projects, and what he does on the side, we spend some time discussing WordPress 3.9, the new DemoWP Pro service, bbPress, and how massive plugin upgrades can be handled well or poorly by the developer or team of developers. This episode was sponsored by WP Ninjas, a leading WordPress plugin development team that is constantly innovating and building excellent tools for the rest of us. Recently they announced their new DemoWP Pro system that allows plugin and theme shops to easily setup live demo environments where potential customers can quickly log in and give the plugin or theme a test drive. In their own words: Do you sell a WordPress plugin or theme? Do you have a demo site that allows potential customers to try out your product? If you don’t, you’re missing a critical tool for reaching customers. If you do, how did you build it? If you’re like most developers, you had to cobble together snippets of found code, backup services, restriction plugins, and prayer. Hoping that the demo would work like some magically imbued golem. Not only is this method sloppy, hard to manage, and a pain in the butt to update, but it doesn’t even make a good demo. What if two users are editing the same part of your demo at the same time? They might think that your plugin is broken because their changes don’t stick. Cross pollination sucks. DemoWP PRO offers a new way for customers to try out your products. Every time a user visits your demo site, they are given a fresh, clean sandbox version of your demo. In this quarantined environment, they can test every nook and cranny of your product without ever messing with anyone else’s data. You can decide how long a sandbox gets to live, and once it’s grown up and reached the end of its life, all traces of its existence disappear from your demo. Much like a sad, disenchanted golem. Show Notes: Special guest Jared Atchison Our recent projects: Pippin: Launching AffiliateWP and building a custom app for Pebble Brad: Released XDebug Log Filter and attending MicoConf Jared: Finishing ShareASell blog re-launch WordPress 3.9 TinyMCE 4.0 now included in WordPress 3.9 TinyCE 4.0 migration guide bbPress bbPress Trac Advanced Custom Fields plugin ACF v5 beta Transcript PIPPIN: Hello, everyone, and welcome to Episode 17 of Apply Filters, the podcast all about WordPress development. I’m your host, Pippin Williamson. Joining me, as usual, is my cohost, Brad Touesnard. BRAD: Hey, everybody. PIPPIN: And with us today, we have a special guest, Jared Atchison. JARED: Howdy, guys. PIPPIN: All right. So today we’ve got a few things that we want to talk about, and we’ll jump in. Primarily we’re going to let Jared tell us all about himself. First, we want to give a nice shout out to the WP Ninjas and their new product that they’re working on launching called DemoWP. It is a system or it is a plugin that allows you to easily set up a demo environment for your plugins or your themes where potential customers can log in and log into the admin and view all the features of your theme or your plugin in a real environment. And so it’s DemoWP.pro. Go check it out. They’re going to be launching here within a couple of days. Sign up for the newsletter, and keep and eye on it. I played with it today. It’s really slick. BRAD: Yeah, that’s awesome. JARED: I’m going to have to check that out. PIPPIN: Yeah. If you ever sold a plugin or if you’ve ever sold a theme, it’s — I mean, we get requests for this all the time where people just went, like, hey, can I have a demo of the plugin? Do you have a live demo I can log into? And setting that kind of environment up is really challenging for a variety of reasons. One, because you have to think about, well, how do I reset my database every couple of days so that people don’t just see tons of junk data? BRAD: Yeah. PIPPIN: And that’s what this takes care of, which is pretty cool. BRAD: Right. So it sets up like separate, private kind of environments for each user, right? PIPPIN: Right. So I haven’t seen behind the scenes entirely how it works, but what I’ve heard from them is that you install it on a multisite setup. And each time that a user requests a demo, basically they fill out a form, and it generates a demo for them. It actually creates a new site within the multisite based off of an existing setup. So it basically clones a site for them, and then they can log into that as an admin of that site with some special privileges and go do anything they want. BRAD: Okay. PIPPIN: And then that sandbox site gets automatically wiped out after a certain period of time. BRAD: That’s nice. JARED: That’s definitely a different take than what I guess we’ve normally seen for demos. BRAD: Yeah. PIPPIN: Yeah, for sure. BRAD: Well, I’ve seen sandboxes before, but it’s like a kind of catchall where everyone ends up in the same sandbox. And it’s like — PIPPIN: Right. BRAD: — just a mess, right? PIPPIN: Right. And that’s how I’ve always done my demos, maybe because I’m lazy, and it kind of works. It usually works for like the first week, and then test users go and muck around with the data enough that it just becomes not very good anymore. BRAD: Yeah. PIPPIN: So this one will actually give you, give every single user a unique sandbox from the standard starting point. BRAD: Right. That’s awesome because — PIPPIN: Which is pretty cool. BRAD: — I’ve set these, something like that up before, but it was just on a Cron, so it would just blow stuff away. So a user could be like in the middle of doing something, and then all of a sudden their data would be wiped out. PIPPIN: That’s awesome. BRAD: So not my…. PIPPIN: Call it a feature. JARED: Right. BRAD: Yeah, I guess so. Cool. PIPPIN: Yeah, so that’s DemoWP.pro. Go check it out. BRAD: Awesome. PIPPIN: All right. Jared, you want to tell us a little bit about yourself? JARED: Do the intro spiel? BRAD: Yeah. PIPPIN: Yeah. Who are you? JARED: Yeah. I’m an independent WordPress developer. I’ve been working in some capacity with WordPress for probably about the past, oh, seven years or so. I guess the past five years has been when I’ve really gotten into the, you know, nitty-gritty, under the hood development type of stuff. So, yeah, I’m just a developer. I do theme work, plugin work, work with bbPress when I can. I just started doing membership sites recently, I guess, and just kind of, you know, I won’t say jack of all trades because I don’t really like that connotation, but just kind of all things WordPress right now. BRAD: Cool. What are you using for the membership sites? JARED: So for the membership sites, I started doing them about six months ago. And the reason is I’ve been trying to find kind of a niche to focus on. Originally about a year and a half ago, I tried getting into bbPress, which I absolutely loved working with. However, the demand for bbPress isn’t really that high, so then I decided to take a stab at membership sites. I follow Chris Lema, and I know that, you know, he kind of predicts that membership sites are up and coming, so I figured that was something for me to take a stab at. So when I first got into them probably about six to eight months ago, I tried a variety of different plugins: off course Pippin’s Restrict Content Pro, Premise, S2. And so I’ve kind of — I’ve tried a variety of them, and the one that I had settled on, which I’ve been using recently, was MemberMouse. And the thing I did find out is they all have their pros and cons, right? So before I decide on one, I kind of talk to the client and figure out their needs and make sure that we’re going to put them on the right platform for what they need. But recently, it’s been MemberMouse. However, with that said, I’ve been dying to take a look at the new iThemes Exchange. The stuff they’ve added recently has just sounded — PIPPIN: It’s really slick. JARED: Yeah. I mean, the whole idea of having the membership sites or the platform and then, of course, you know, there is a degree of ecommerce in there if needed, which sounds really good because I’ve gotten that request before on membership sites. And, of course, you know the team, Cory and the crew at iThemes are just, you know, absolutely amazing people. And I haven’t looked under the hood of the code yet, but I’m sure it’s great, and extendable, which that’s kind of one of the downsides of MemberMouse, I guess, is they’re not WordPress folks. They’re kind of like enterprise coders, which has its pros and cons. But one of the cons is a lot of the things they do kind of isn’t the WordPress way. So when I need to extend stuff, it just takes a little bit more time to get familiar with their systems. PIPPIN: Yeah. They don’t have nearly as many hooks or filters in their collection. JARED: Exactly. PIPPIN: …with — JARED: Eric. PIPPIN: Eric from MemberMouse recently because I was doing an integration with my Affiliate WP plugin. I wanted to really easily track referrals on new membership signups and things like that. And it took me a while to figure it out because I didn’t have those standard hooks and filters. But it turns out that there was a way to do it. JARED: Yeah. PIPPIN: The nice thing about Eric and MemberMouse is that he’s super friendly. JARED: He’s super smart too. PIPPIN: And he told me, like, any time if you have a filter in action, you need to just tell me. They’re not necessarily things that we intuitively add, but if there’s ever a clear reason to have one, more than happy to add it. JARED: Yeah, and that’s kind of why I went and in the past I’ve been using MemberMouse is so I originally started out using Premise, which I won’t really go into that, but I didn’t have great experiences with that at all. So after kind of getting burned on that and shifting to something else, then I just wanted like the, you know, I guess MemberMouse is kind of considered the Cadillac. They have the most — even though they take away some of the extendibility, they offer like kind of the most out of the box, I guess, by the up-sells and the down-sells and all that type of stuff. So I’ve really been pushing. PIPPIN: It’s a super … for sure. JARED: Yeah, I’ve really been pushing that recently, but I think on my next project, unless there’s some feature that doesn’t let me, I’m really going to try out Exchange. I’m really looking forward to that, so. BRAD: Have either of you guys tried Memberful? The Theme Foundry guys, I think do that one. JARED: No, I haven’t. Chris has talked about it a little bit, but I honestly haven’t ever really used it. PIPPIN: I haven’t actually played with the system yet. We are looking at integrating with it for Affiliate WP. It’s a little different though, I think. BRAD: It’s more of a SAS, I think. PIPPIN: It’s like a hosted service, isn’t it? BRAD: Yeah, I think so. JARED: Yeah, exactly. That was my understanding anyways. PIPPIN: Yeah. I’m not entirely sure how it works in terms of like providing the membership content. But it’s definitely something, considering who is behind Theme Foundry; it’s obviously something that should be looked at because — BRAD: Yeah. PIPPIN: The Theme Foundry being behind it is good enough for me to go take a look at it. BRAD: Yeah, yeah. Those guys just scream quality, right, like the stuff they do. PIPPIN: Yeah. They’re pretty awesome. JARED: That’s the thing. I mean, I think right now that people who need a membership site, they’re probably in the best position that they’ve been in, you know, ever, right? I mean, there are some really solid platforms out there now depending on your needs. I mean, Chris has covered those in depth on his site and has even done some infographics that help you decide which one is potentially the best for your needs or whatever. But if you look at the state of those platforms now versus like three years ago, right, all you had was Wishlist, S2, and a couple other things. You were basically screwed. At least now you have some alternatives that, you know, are fairly robust. PIPPIN: Oh, yeah. BRAD: Yeah. PIPPIN: Well, three years ago is right about when I started building RCP. And that’s why I built it because I was — because I wanted to run a membership site. BRAD: Yeah. JARED: And you knew better to use what else was out there. PIPPIN: Yeah. And also, I also worked for a company that was running a big membership site, and they were running on A-Member at the time, and we really wanted to get them off of A-Member. And now they’re still running RCP, and it’s working great for them. I do really like that now there are a lot of options when it comes to memberships because there is no one size fits all. JARED: Absolutely. PIPPIN: Honestly, I think that’s part of the problem that we used to have with membership systems is that the systems that were available were trying to be one size fits all. And from a developer standpoint, I really don’t like that mentality. I have no problem telling somebody that, hey, RCP is not for you, or MemberMouse is not for you, or this is the one that you should be using because that’s always going to create a better experience — JARED: Oh, yeah. PIPPIN: — for the user and the customers. JARED: Well, we know what happens when you bolt on the kitchen sink, right? We were just talking about that yesterday on some plugin I won’t mention. PIPPIN: Oh, yeah. JARED: So. BRAD: Oh, I know the one. JARED: It doesn’t take much to figure it out. BRAD: Ah, yeah. PIPPIN: I really — I haven’t looked at the membership portion of iThemes Exchange, but I’ve played with the code base of the base plugin, and it’s really nice. JARED: Yeah, I think they kind of are taking to the model of what you said, right. Instead of trying to do the kitchen sink, they’re just picking out selective features, that kind of 80/20 rule and just doing them well. PIPPIN: They are doing them really well. I’m not going to lie. Some of their features with the membership stuff makes me jealous because I’m like, man, I would like to do that. And I’m like, ah, you know what? There’s not enough time. But that’s okay. BRAD: Cool. So, Jared, do you do — do you release plugins on the .org repo? Do you have any plugins…? JARED: I sure do. It’s not something I do as much as I would like to because a lot of the cool stuff I write is really just made specifically for a project or a client. So to go back and kind of like rework that code to make it generic or, you know, to work in general use case, a lot of times I just don’t have the time to do that. But I do have plugins on .org. My user name is JaredAtch. Le"
