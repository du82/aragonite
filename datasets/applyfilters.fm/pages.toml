title = "Episode 67: Business updates, marketing tips, and cashflow - Apply Filters"
description = "Apply Filters is looking for a new sponsor! If you are interested, please contact us. Sponsors help us keep the show running and get a shoutout. Today’s episode focuses on updates from Brad and Pippin,..."
full_description = "September 6, 2016 Apply Filters Episode 67: Business updates, marketing tips, and cashflow Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 50:10 Share Share Link Embed Download file | Play in new window | Duration: 50:10Apply Filters is looking for a new sponsor! If you are interested, please contact us. Sponsors help us keep the show running and get a shoutout. Today’s episode focuses on updates from Brad and Pippin, as well as mailbag questions. Brad’s Update Brad is testing a new product called Mergebot. It’s coming along well. It hit some snags, but no major issues. They started working on scaling and they’re getting really close to finishing the internal testing. Brad explained database sharding and how that works in the WordPress world. They’re testing the 1.2 release of WP Offload SP and doing a site redesign. Pippin’s Update Pippin: Pippin has been working on RCP updates, including rebuilding RCP into a standalone product. They released an add-on called RCP Grout Accounts to benefits schools and small teams. These groups can purchase a group membership for convenience and savings. They’re also approaching the beta version of Affiliate WP 1.9 and putting out software licensing for EDD version 3.5. Brad and Pippin answer some mailbag questions. Some of the topics covered include: Marketing tips for plug-in offers. Tips on how to write for your audience. Information on sales trends and the ebb and flow that Brad and Pippin notice. How to deal with slow periods when sales are declining. Links and Resources Brad’s article about Mergebot Ash’s article on why CDM isn’t a silver bullet for performance Gilbert’s article on scaling a cron Pippin’s article on rebuilding the dying product EDD Software Licensing Add-On on Twitter Learn more about sponsoring Apply Filters If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Welcome back to Apply Filters, Episode 67. Today, Brad and I are going to go over some updates on things that we’ve been working on, and then we’re going to jump into some mailbag questions from listeners that you guys have been kind enough to send us. First, however, if you’re interested in sponsoring this show, you can do so at ApplyFilters.fm/sponsorship. It helps us to cover the production costs and to bring you this. It’s greatly appreciated, and we can give you a little shout out for your team, your product, or your service. Brad, what have you guys been up to in the last couple of weeks? BRAD: We’ve been testing our new product, Mergebot. PIPPIN: Is testing coming along well? BRAD: Yeah, we’ve hit some snags, but no kind of major brick walls, I like to say. We hit quite a few brick walls throughout the year while we were developing it, which really kind of slowed things down. Yeah, the bugs have been relatively minor in comparison to those, and so we’re just working through them. We started working on scaling, thinking about scaling and how that’s all going to work. Yeah, it’s coming along and we’re getting really close to finishing up our internal testing. PIPPIN: Can you elaborate a little bit on how you’re testing the scaling? I’m assuming in this case you’re talking about when you have a site that has a massive database. BRAD: Yeah. If you have a massive database, that doesn’t really matter because we don’t store your whole database. We only store the changes that are made. As you make changes locally, we store those in our cloud app. PIPPIN: Okay, so the scaling in this case, the number of changes that have to be done? BRAD: The number of changes that have to be done and the number of users that are uploading those changes to our app, so the more people we bring on and are using it simultaneously. PIPPIN: Oh, right. I forgot that you guys have the hosted side of this. BRAD: Yeah. Yeah, so these queries are going to go up to our cloud app. That’s actually kind of the problem is the difficulty with scaling is writes. Database writes are hard to scale. Reads are much easier to scale because you can have a master database to do the writes to the database. Then you can have clones that are read only, so the master replicates to the clones. You can scale the read only ones fairly easily, but you can’t really duplicate the master database. Then you have to get into what’s called database sharding. Anyway, our plan is I think we can get away with using Amazon RDS for quite a while before we have to build out database sharding. That’s the plan is to start with RDS and then scale. Scale the app as needed, I guess. Have you ever heard of database sharding before? PIPPIN: I’ve heard of it several times. I’m not really familiar with it. BRAD: Yeah. PIPPIN: I think I know the basic concept, though I would be afraid of being poorly wrong if you asked me to explain it to you. BRAD: Yeah, I’m not terribly well versed in it because I’ve never done it, but from what I’ve read. An example in the WordPress world is you know how in WordPress, WordPress MU, each set of tables has a different prefix? PIPPIN: Yeah. BRAD: Right. Theoretically you could put a set of tables on a different database server and then reference that server and that prefix on that server. That’s kind of the idea behind sharding. That’s one way of doing it. PIPPIN: Splitting it up so that the entire database isn’t on a single resource. You split it up into little shards and so you can have it kind of offloaded. BRAD: Right. PIPPIN: Okay. BRAD: Then the app can reference the data on server X, Y, Z, depending on where it’s sitting. Yeah, that’s the basic idea of database sharding. But, yeah, we’re not going to do that right away. That’s kind of like the next level stuff. Anyway, we’ve been doing that, and we’ve been testing the 1.2 release of WP Offload S3, which is a big change for that plugin. We used to store the Amazon S3 URLs in the database. If you uploaded an image to your media library and then inserted that into a post, the URL in the post would be the Amazon S3 URL, the CloudFront URL, or however you have it configured. But we’re no longer doing that. We’re no longer storing that URL in the post content. We’re going to instead use filtering to change it on the fly. PIPPIN: Which I believe we talked about quite a while back. BRAD: Yeah. PIPPIN: On some of the pros and cons of doing that. BRAD: Yeah. Yeah, we had a debate about it and stuff. Anyway, we’re well down that path. I think we started like six months ago working on this, so. PIPPIN: Have you been able to definitively prove that one is faster than the other? BRAD: Oh, yeah. It’s definitely better to do it the way we’re changing it to because, for example, let’s say you change one of your settings that affects the URLs. Well, right now we have to do a find and replace on all your content. If you have 10,000 posts and an equal number of media library items, that’s going to take a really long time to go through all that to do the find and replace. Whereas with this new system, it’s instant because we don’t have to run that find and replace and we’re doing it on the fly. You change your settings and they take effect immediately. PIPPIN: Would I be right in saying that that will be minutely slower for loading a page that has those resources on it, but in terms of the overall server resources and usage it’s significantly faster? BRAD: Yeah. Yeah, it’s barely even significant because there’s already filtering going on in WordPress. This is just like another little tack onto that, really. You think about short codes, responsive images. All that stuff is filtering. The important point is to have caching in place and not have every request have to run all this filtering. Caching is important for better performance here. I’ve also been spending a lot of my time on the redesign of our site. That’s been tying me up. I also wrote an article about Mergebot and how it would work and posted it on our blog a couple weeks ago. PIPPIN: Go back one step. You said you guys are doing a site redesign. BRAD: Yeah. PIPPIN: Are you doing the site redesign? Is it someone else in house? Are you shipping that out to someone? BRAD: Yeah. We had hired a designer to design it, and then I hired a front end coder to cut it up into responsive design. Now we’re applying that to our WordPress theme. We’re doing that part ourselves, and it’s taking a long time. I just went through all of the “my account” stuff, like the checkout. The designer didn’t design any of that, so I’ve been kind of using his design as a guide and just applying it. PIPPIN: Yeah. We’ve been in the process of redoing the Affiliate WP site. I always forget just how big that project is, any project, when you rebuild a site. BRAD: Man, it’s so crazy. PIPPIN: I don’t think I’ve really talked to Andrew in months because he’s just been in his zone building this site, and it takes forever. There’s so many pieces. BRAD: Yeah. I’d like to eventually have dedicated members of the team to the site, just to the site. Their full-time job wouldn’t be just working on the site. I think they’d run out of work. But maybe– PIPPIN: Maybe they own that. BRAD: Yeah, it’s like half of their time or something would be spent working on the site or something. PIPPIN: Yeah. We’ve done that with both Andrew and Sean across our four to five sites. BRAD: Right. PIPPIN: I think it works really, really well. BRAD: Yeah, I’m looking forward to that because right now it’s just me and as much time as I can steal from Ian Poulson, who is also working on Mergebot, and so it’s kind of crazy right now to be pushing two. We’re pushing Mergebot forward, but I also want to get the redesign out, and it’s just competing priorities that are both high. Yeah. Mergebot has been kind of edging over the redesign. PIPPIN: Once Mergebot is out, I’m sure a lot of that time will get freed up. BRAD: Oh, yeah. I’m sure once Mergebot is out, there’ll be nothing to do on it after that. As much as I’d love to believe that. PIPPIN: Yeah, that’s never going to happen. But at least you should be over the hurdle of the massive development of building the dang thing. BRAD: Yeah. Yeah, yeah. Yeah, I agree. Yeah. I think once we have paying customers for Mergebot, we’re going to have to start hiring probably and start scaling up that part of the business. But that’s going to take resources to do as well, right? It’s like a chicken and egg problem. A couple other articles that we published on our blog to take a look at: Ash wrote an article that a CDN isn’t a silver bullet for performance. The reason that he wrote that is because we were getting a lot of people buying WP Offload S3 thinking that it was going to magically make their site super fast, but they’re running their site on not great Web hosting and doing a lot of things that they could have fixed. PIPPIN: Right. It is an improvement, but it is not a “be all, end all” of site performance. BRAD: Yeah, there’s a lot of things you should do before you bother investing in a CDN. There’s tons of stuff, and so Ash lays that all out in that article so that now we can point people to that when they come to us thinking we’re going to solve their site performance issues. That’s a really great article. It’s going to help us out. Gilbert told the story about his side project, so Web Uptime. His article was about scaling a cron, so checking hundreds of sites every minute using cron. One of the things I had no idea about is that with cURL, you can allow it to fire off a bunch of asynchronous requests in one call. I had no idea. Did you know about that? PIPPIN: I do a little bit. I haven’t played with it, but I was skimming the article. I think that this is related to some of the improvements that were being put into WordPress 4.6 with the WP HTTP API. WordPress core replaced the HTTP class with a request library that– BRAD: RIMAQ, yep. PIPPIN: RIMAQ. There we go. That’s the name I was looking for. That he wrote and I believe it works kind of similar to this where it allows you to do asynchronous requests because that was one of the big benefits of that improvement that they put into core. And so that was the first time I had ever heard of it, and then this is now the second time. BRAD: In WordPress 4.6, the request class got included into core. I think all of the HTTP stuff is kind of proxying to that library now. Have you had any issues with that? We’ve been running into a few issues. PIPPIN: I haven’t seen anything that we’ve definitively tracked down to be due to that. We have had a couple of weird issues where all of a sudden requests don’t work for somebody. For example, we have a customer using MailChimp and suddenly their requests to MailChimp don’t work. They just get, like, a 500 error coming back. We haven’t tracked it down, but the speculation was that it might be related to those changes. BRAD: Right. We’re still trying to figure out the problems. It seems like a lot of our Australian customers are having problems for some reason. I don’t know if it’s a certain host in Australia or something to do with DNS in Australia or what. We’re still trying to figure it out, but it’s a weird one. Otherwise it would be an easy one. Anyways, what have you been up to? PIPPIN: Just like usually for the last five months, we’ve been cranking out some more RCP updates. My focus really for the last few months has been to rebuild RCP into a premier product that stands on its own and it’s kind of at the same level as Affiliate WP and EDD. Anyway, just a few days ago, we released one of the next big updates that is moving us further in that direction. That was group accounts. We released a new pro add-on called RCP Group Accounts that allows organizations, whether you are a school, a corporation, a small team, or whatever, to buy an account on a membership website and then add sub-members to that account. Let’s say that I’m a teacher. I want to buy access to an education course for all the students in my class. I, as a teacher, would go register an account, and then I can add all of my students to that account. Then they are linked directly to my account, so when my account expires, they expire. If I upgrade my account, they get those privileges as well. But the sub-members don’t have any billing. They don’t have anything like that. And so we released that, and that’s something we’ve been working on quite a while. I’ve been working on it a little bit in some for or other for about two years now. I originally built it for CGCookie, my brother’s website, for that exact purpose of them being able to sell school accounts, basically. Then it sat for a while. Then about a month ago we brought it back and started working on it to make it a standalone plugin that we can release. And so we released it, and so far the feedback has been really pos"
