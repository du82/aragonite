title = "Episode 83: Finale - Apply Filters"
description = "This is the last episode before we retire the podcast. Many people have enjoyed the podcast and we’ve had a lot of great feedback and a lot of fun, so we’ve been asked why we’re..."
full_description = "October 10, 2017 Apply Filters Episode 83: Finale Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 42:35 Share Share Link Embed Download file | Play in new window | Duration: 42:35This is the last episode before we retire the podcast. Many people have enjoyed the podcast and we’ve had a lot of great feedback and a lot of fun, so we’ve been asked why we’re retiring. Ultimately, we just needed to make a change and it’s time to move on. Be sure to listen to hear about how things have changed over the past couple of years and why those changes have led to us retiring the show. For our last episode, we’ve decided to answer some of our listeners’ questions. Some of the highlights of the show include: Regrets that Brad and Pippin have had regarding not building a plugin they’ve had an idea for. Why it’s important for companies to start new projects frequently. Advice Brad and Pippin wish they could give their younger selves when it comes to development, projects, and processes. Some thoughts on pricing: How data, psychology, and strategy play into it. Takeaways Brad and Pippin have learned that have come about by sharing business ideas with others. Thoughts on hiring developers and setting salaries. Links and Resources: Pippin’s Blog Post: Get Better at Saying No Derek Sivers: Hell Yeah or No Brad’s Blog Pippin’s Blog Apply Filters on Twitter ApplyFilters.fm Amazon SES service Blog Post on Why It Took So Long to Release WP Migrate DB Pro 1.8 Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Welcome back to Episode 83 of Apply Filters. This is going to be our last episode before we retire the podcast. We announced about two weeks ago that we were going to retire the podcast and stop recording episodes, and so this is the last one. When we announced that, the predominant question we got was, “Why? Why are we retiring?” There have been a lot of people that have enjoyed the podcast. We’ve received a lot of great feedback over the last two years or so that we’ve been doing it, and it’s been a lot of fun, so let’s start by answering that question. Brad, why are we retiring? BRAD: Yeah. I think there’s probably a few reasons. It’s funny. I think we should maybe let people know that we knew something had to change, for sure. We’ve been discussing that for quite a while that something had to change. We discussed getting our teams involved in the podcast and having them run the show, maybe. Then ultimately we came to a point where we were just like, maybe we should just let it go. Maybe we should just retire it, and we could do something else later if it made sense. That’s kind of where we ended up. We felt that it was time to move on. We’ve been doing this for a couple years now. When we started, it was a lot of fun. It was very exciting and new. I know I personally was in a very different place than I am now. When we started this, I had just launched Migrate DB Pro, like a few months earlier, and I had one developer. Now we’re up to nine developers, or nine people: one marketer and eight developers. My days are mostly managing that team, whereas back then I was writing code, and I had my hands dirty every day. And so it was really easy to talk about development challenges and things that we were struggling with. It was just easy to jump on a call with you, Pippin, just hit record, and just talk about what’s been going on for the last couple weeks. PIPPIN: Yeah. We could very easily just chatter on, “What did you work on this last two weeks? What was the code that you were working on?” because you were the developer, and I was the developer. I think we have very similar changes that have happened over time, like my day is not made up of code any more. My day is managing and overseeing the overall projects. Then most of my team members write most of the code now. When I get to write code, it’s a pleasure, for sure, but it’s not very often. That made it a little more challenging to talk about code every day because we’re not in it any more. It’s funny to me because I actually got some criticism from somebody online the other day about how, in this podcast, we’ve talked about code, best practices, and lots of different things over the last couple years, and how we espouse these great development practices. Then he went back and looked at some of my old and new code and was like, “This is not great.” I’m like, well, yeah, because, number one, it’s like four to five years old. But, two, that right there is a perfect illustration of part of the problem that we’re running into with recording these episodes now is that I’m not in the code any more, but we’re still trying to talk about development. I think that right there is probably one of the biggest reasons. There are a couple of other reasons that we talked about, though. One was time. Time is challenging. There’s the cliché, there’s never enough hours in the day, but at least for me that is more true now than it’s ever been. I think it used to be pretty easy, especially when we were living in the code all day, to jump on every two weeks, a scheduled call, a scheduled two hours of the day every other week, and record an episode. We started to find that it was challenging to do that. We would delay a day. We’d delay a day. We’d delay a day. All of a sudden we’ve delayed two weeks, and we’re not able to record episodes every two weeks. Now we’re recording once every month and a half. BRAD: Mm-hmm. PIPPIN: That definitely continued to get worse. BRAD: Yeah. For me, I definitely came to the point where it felt forced to record an episode, right? I mean I’m sure there’s a lot of things that go into that feeling, like time, but also having to plan the episode and the extra effort that it takes to plan an episode because I’m not in the code every day. There’s all these things that go into it. But, ultimately, it stopped being as fun as it used to be, and it felt more forced. Then you take a step back, and you’re like, well, why am I doing this? Right? Then the answer is, maybe I shouldn’t be. Right? PIPPIN: I think one of the pieces of advice that I always see people, like as they grow further in their personal lives or in their companies, whatever they choose to do, it’s to get better at saying no. I wrote a blog post about this. I should be doing better at this and, at some point, realized, you know what? We don’t need to do this any more. We need to say no because it’s not as fun as it was; so let’s say no. Let’s take a break. BRAD: Right. That’s a great point. I think I’ve talked about that on this podcast before because there’s a great blog post by Derek Sivers. The title is Hell Yeah or No. If you can’t say, “Hell yeah I want to do that!” then just say no. Don’t say, “Yeah, I guess so.” There’s no half way. If you have that problem where you find yourself saying yes a lot and then not enjoying yourself or whatever, then it’s an interesting exercise to try that. I tried it for a whole year, and I found that I ended up probably saying no too often. [Laughter] I was a little bit too disciplined in the practice, and so I had to scale that back since. I think it is a worthwhile practice if you have that problem, for sure. PIPPIN: I think it is. I think it’s something to be very mindful of. BRAD: Yeah. PIPPIN: There’s your answer. That’s why Apply Filters is retiring. We may come back in the future. We may not. There is no decision being made other than we’re going to stop recording for now. We did have a concern about will the episodes stay up. There are some people that like to go back and re-listen. There are people still discovering the podcast. And so, yes, the episodes are going to stay on the air. They’re going to stay on the website. We have no intention of taking the website down. If you ever notice that it’s broken, let us know, and we’ll fix it. BRAD: Right. You can follow us. Pippin still writes on his blog, and I still write on the Delicious Brains blog. You guys can still follow us on Twitter. I pretty much post– PIPPIN: And come chat with us in Post Status Slack. BRAD: Yeah, Post Status Slack. I don’t really participate much in there. But if I get a ping from somebody, I’ll answer it. Do you participate in Post Status Slack a lot, like in the conversation? PIPPIN: More now than I used to. BRAD: Okay. PIPPIN: I tend to focus mostly in the business channel and every now and again the e-commerce channel and the heavy dev channels. BRAD: Gotcha. PIPPIN: Not all of them, though. I typically look in. I’ll open it a couple times a day; see what kind of conversation is going on. If it piques my interest, I’ll pop in. BRAD: Right. See, that’s that hell yeah or no thing. That was one of my nos. I have to reevaluate that. [Laughter] PIPPIN: All right. When we decided that we were going to do this last episode, we had to come up with some content. We knew that we were already struggling with producing development oriented content, so we decided to go back to our listeners. All of you have been awesome in sending us questions over time, and so we still have a series of questions to go through. We had some that were submitted after we facilitated this last batch of questions. We’ve got some that have been sitting around for a little bit, so we’re going to run through those, and we’re going to jump through one last mailbag episode and say, adios. BRAD: Yeah, for sure. PIPPIN: Brad, do you want to start us off? BRAD: Yeah. Just before that, I want to make a note that all the episodes will be staying up on ApplyFilters.fm. We don’t have any plans to take it down. Yeah, we’ll be keeping everything up there indefinitely. If you ever need to refer back to an episode or something, it should stay up there as long as we’re still building websites, I think. Right, Pippin? PIPPIN: Yeah, as long as my hosting…. [Laughter] BRAD: Yeah, exactly. Maybe not forever – forever, but– [Laughter] PIPPIN: I’m still waiting on that free…. BRAD: Yeah, there you go. Right, so should we start off with the questions? PIPPIN: Yeah, let’s do it. BRAD: The first question is from Luis Rock. He asks, “Is there any idea of a new plugin you had but not followed and now, after several years after, you regret that you didn’t?” I think what he’s asking is, is there some plugin that we didn’t build that we regret not building. PIPPIN: I think I’ve got a couple of little ones. BRAD: Yeah? PIPPIN: Actually, I’ve got two that I’ll mention. One of them I did build and the other one me and my team ended up not building, but I kind of wish that we had, and maybe we still will. The first one is actually my event calendar plugin, my Sugar Event Calendar. That was a little plugin that I built with the intension of being this little tiny plugin that is very simple and does a very basic event calendar. There’s a part of me that wishes I had built that out bigger and made it a lot bigger. Now I say that, and I’m going to give you full disclosure that that is on the agenda is building that plugin out to be a full-fledged event calendar plugin. But I can look at it now and say, like, this plugin has sat here as this very minimal thing for five years. What if I had built it much bigger? Today, would it have an ecosystem? Would it be comparable to our other products? I wonder about that because also then I’m thinking about this, like I’m getting ready to dive in and work on rebuilding it, and I have worries. Am I wasting effort? Is this a bunch of time and money and resources that we’re just going to throw away? If I had built it up a lot longer ago, say five years ago, that wouldn’t be a question. We would know; and so that’s one. The other one, one of our biggest challenges with all of our plugins, our main three–Easy Digital Downloads, Restrict Content Pro, and Affiliate WP–is emails. Emails are terrible. Email delivery is terrible just in terms of, like, overall reliability on Web hosting accounts, especially when you get into lower end accounts. One of the projects that we talked about building one time was a dedicated email delivery service that our platforms could tie into automatically. There are a lot of services out there–Mandril, Mailgun, SendGrid, SES, et cetera–that help solve this problem, but none of them are user friendly – not one. Every single one of them is developer oriented, and you’re expected to understand API keys, and you’re expected to understand what the actual problem is to begin with. Let’s be honest. Most people’s understanding of the problem is, my email didn’t show up. I don’t understand how the tubes work or how the channels work for the email to get there. I just know my email didn’t show up. We were looking at building a system to solve that. To try to solve it, anyway. I think one of the reasons we didn’t build it is because it turned into a much bigger challenge than we had anticipated. But I still kind of wish that we’d gotten a little further with it. I think it’d be an interesting project, and I think it is very doable. How about you, Brad? BRAD: Hmm. What about just building on top of one of those platforms and just making it easier? PIPPIN: I think that’s what we would have done. BRAD: Right. PIPPIN: But there were still a number of hurdles. We were looking at using SES, Amazon Service, Simple Email Service, for that. There ended up being just a number of hurdles that didn’t prohibit us from doing it, but took away some of the advantages of building it in the first place. Some of the biggest challenges come in with things like domain verification for verifying domains, spam control, and things like that. When you put those into the equation, you lose some of the ease of use that you’re trying to create, and so maybe you don’t have that benefit any more. I think there’s still a chance that we’ll build it, and we’ll find out. BRAD: Right. Cool. I like it. PIPPIN: Do you have anything? BRAD: I think if I go back in time far enough, probably the thing that I regret not doing is when I was running a Web hosting company kind of part time. My business partner was running it full time, and I was just kind of chipping away at the sides kind of thing. One thing we had discussed is focusing on WordPress and hosting WordPress sides, like a managed WordPress host, essentially. That was back in, like, 2005, probably, 2006, maybe. It was really early on and, honestly, it probably would have been a little too early. Actually, it might not have been that early on that we were talking about it. It might have been closer to 2008, actually, which the timing would have been better at that time, I guess. Yeah, anyway, I remember when we were talking about it, the timing did seem very right. We just didn’t. It would have been a lot of — we had a lot of other, higher priority things, and we just never did it, which is usually the reason you don’t execute on a new ide"
