title = "Episode 80: Retargeting, Focus, and Other Listener Questions - Apply Filters"
description = "Today we’re going to be talk about updates on what we’ve been up to recently. Then we’ll answer some of the questions that have come in from our readers and listeners. Sit back and enjoy..."
full_description = "May 16, 2017 Apply Filters Episode 80: Retargeting, Focus, and Other Listener Questions Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 38:04 Share Share Link Embed Download file | Play in new window | Duration: 38:04Today we’re going to be talk about updates on what we’ve been up to recently. Then we’ll answer some of the questions that have come in from our readers and listeners. Sit back and enjoy the show! Some of the highlights of the show include: The two areas that Pippin has decided to focus on in 2017: Business growth and polishing all of the products. Thoughts on retargeting: What programs Brad and Pippin use, how the results are measured, and how to evaluate the trends over time. How a price increase at Easy Digital Downloads has affected interactions between customers and the EDD team and the revenue. Some of the new EDD add-ons that the team is breathing new life into. Information on the new employees at both Easy Digital Downloads and Delicious Brains. How Brad found their new marketer by defining exactly what they were looking for. Some of the limitations of Mergebot Beta and what DB will be doing before the launch. The process of moving attachments to another bucket in the upcoming WP Offload S3 1.5. Some of the conferences that Brad and Pippin have been to and are planning to go to. The proper way to give attribution when borrowing license codes rather than starting from scratch for a particular project. Whether it’s important to have an index.php file in every directory within your plugin. Links and Resources: Perfect Audience AdRoll Optimize Reflection on a Price Increase Laravel If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. BRAD: Welcome to Episode 80. This time Pippin and I will be going over updates on what we’ve been up to and, if we have any extra time, we’re going to answer a couple of listener questions. Pippin, would you like to start us off? What have you been up to, man? PIPPIN: Sure. It’s been a while. It’s been at least a month since our last episode. And I believe it’s been three to four months since we last gave updates, so there’s a number of things that we’ve been working on. I’ll start off the top. First, this whole year, 2017, really, we decided that we’re going to focus a lot more on two areas of the business, and this was largely what I’m working on and what a couple of my team members are working on with me. That is business growth and polishing all of the products. We have a habit of working very fast, pushing out a lot of new things, pushing out updates a lot. We are going to rein that back a little bit and focus primarily on polishing things. We want to make things a lot smoother. We want to make things work better for people. We want to make the onboarding better. So there’s a lot of focus in that area, and that’s going to be throughout the rest of the year as well. There are some initial results coming out of that already. Then the other one is focusing on business growth, and we’re really starting to do a marketing push for our products, which is something that we’ve never really done before. I mean I like to tell people that I’m a terrible marketer, which is completely true. We are trying to actually take a new look at how we can utilize a really good marketing effort for the company. Then there’s two little things that we’ve done recently that have had some pretty interesting results. The first one is I played with retargeting ads for the first time. I don’t know why it took me so long to play with them because it took about five minutes to set up. The results are pretty fascinating. If you haven’t done it and you have a product, I would definitely recommend at least testing them out. BRAD: Are you using Facebook’s retargeting or are you using Perfect Audience? PIPPIN: We are using Perfect Audience. BRAD: Okay. Yeah. AdRoll is the one we use, but it’s very simple. I’ve tried Perfect Audience, and AdRoll and Perfect Audience are almost the same. PIPPIN: Yeah, that was my understanding as well. I chose Perfect Audience just purely based on a recommendation from somebody else. The biggest issue that we’ve had with it so far is being able to accurately determine how much revenue does it actually generate because here’s the problem. Let’s say that you serve a thousand impressions of your ads and that generates $500 in sales. Then you spend $100. Okay, so you have a 5:1 ROI. Well, that’s awesome, but did you actually make $500 because of the retargeting ads, or did some of that revenue come from customers that were going to purchase anyway, but just happen to see the ad somewhere in between? This is something that we’re trying to come up with a good way of measuring. Right now we’re doing it through an experiment of turning the ads on; turn them off; turning them on; turning them off; turning them on; turning them off. For like a week or two at a time, so on for a week, off for a week, on for a week. Then, over time, be able to look at a graph and see, okay, are there definite spikes when the ads are on versus off? If that’s the case, perfect. BRAD: That’s the best way, what you just mentioned. That’s the best way to test any ads that you’re running are working. But you have to do — that’s all you can do. You can’t change your website at that time. You can’t change any. You know what I mean? Because if anything else changes, then you’re not — it’s not a controlled experiment, right? PIPPIN: Right. BRAD: Other things could be affecting it. PIPPIN: Though, even with some changes, if you do it long enough, like let’s say that you do — you alternate weeks for a year at a time. If it is a significant result, that should be pretty clear over the course of a year, even if there are other changes with it. But it’s a long game. BRAD: Yeah. It depends on the magnitude of those changes, though, too, I think. PIPPIN: So like our first week of retargeting we had — according to Perfect Audience, we had a 2000% ROI, which was awesome. But we’re like, is this actually accurate? I’m not really sure. But anyway, that’s been one thing that we’ve been having fun with. The other one is we recently started A/B testing with Google Optimize. Optimize is a new product from Google. I think it’s new in the last, like, six-ish months, at least in terms of like a public product. It is stellar. If you want to go set up an A/B test on your site, go check out Optimize.Google.com. It is super easy to set up and works incredibly well so far. It’s also super tightly integrated with Google Analytics, which makes it even better. That’s been a pretty fun little project. BRAD: Very cool. PIPPIN: All right, so beyond that there’s one big thing that we worked on over the last four months, and this is a price increase. We’ve talked about this a couple of times. I know we’ve mentioned it in previous episodes. In March, I published a big blog post on a reflection of our price increase for EDD. Our price increase for EDD went live on December 12th. Then we had a price increase for Affiliate WP and Restrict Content Pro that went live on March 1. I’m not going to talk too much in depth about that because we could — I could easily talk for an hour or more on it. If this interests you, you should go check out the blog post, which is linked in the show notes. But I want to give you a couple or more like ten quick stats on how this has affected our three products. Since December 12, the support tickets, the number of tickets submitted to EDD have gone down 3%. Not a huge change. However, the number of tickets handled per day, so this is like the number of tickets you reply to, that you close, that you open, tickets are opened and closed, et cetera, has decreased by 46%. The number of customers that we interact with has gone down by 36%. The number of tickets that we touch per day has gone down 47%. And our revenue for EDD is up 18+% in that time period. That was the ultimate goal here was to decrease our support tickets and raise our revenue. At minimum, decrease support and keep revenue steady. It’s been a pretty stellar result so far. Affiliate WP and Restrict Content Pro had some similar results. Now these ones have not been live quite as long, so Affiliate WP and Restrict Content Pro had their price change go live on March 1. They also had a much less drastic price change. EDD, for example, had some pretty significant increases in price. The other two plugins was a flat $50 increase across the board and that was it. But here’s the quick stats. For Affiliate WP, tickets submitted has gone down 5%. The number of customers that we interact with–and by customer interactions that is purely in a support capacity–has gone down 8%. The number of tickets that we interact with per day has gone down 5%. And our revenue is up 56.8%. For Restrict Content Pro, the number of tickets submitted is down one percent. The number of tickets that we interact with in support is down 9%. The number of tickets submitted per day has not changed. But our revenue is up 32.6%. Those are the quick stats. It really comes down to, at least for EDD, a very significant decrease in support with an 18% increase in revenue. Affiliate WP, a small decrease in support, but a 56% increase in revenue. And RCP, a small decrease in support and an increase in revenue of 32%. That’s the effect of our price change, and you can read more about that on the blog post that I published, which will be in the show notes. It’s been a pretty interesting last couple of months because of it. It’s something that I would definitely recommend business owners consider. I think we need to be careful, though. We don’t — we don’t just increase prices just to increase prices. There’s a reason for it. For example, our reason was support was too much of a burden, and we had done everything that we could think of. We had attacked it from every angle to decrease that burden. Raising prices was the last one that we went with, and it was very, very effective. BRAD: Yeah. Surely another reason to increase prices is that, I mean, you guys have been iterating on all of your stuff for how many years without changing the price? PIPPIN: Yeah. BRAD: You know? PIPPIN: A lot. Well, and that’s an important point. We would get comments from people that say, look, this is not. This thing is way too good for the price that it’s at. And it’s because of that iteration, because we had built something very simple early on, and now it was something very powerful, after three to four years. And so with that eventually should come a natural change or progression in price. And so we took a little too long to get to it. And so when we did get to it, it was a little more drastic than I think some people expected. But it’s been a pretty positive experience so far. If you own a product or a business of any kind, go check out the blog post. If you have any thoughts or reactions to that price increase or anything that you’ve done or anything else you’ve heard, I would love to hear your thoughts. Then I have four other quick little updates I’m going to give, and then, Brad, I’d love to hear what you’ve been up to. In the EDD world there’s a bit of news for us. As of a couple days ago, we acquired a large set of EDD add-ons from a developer that has been around in the ecosystem for a long time. We actually bought seven of his plugins from him and have brought them into the company so that they are owned, maintained, supported, and developed 100% by our team. These are add-ons that have been pretty instrumental in a lot of EDD’s presence and growth over the last four years. But unfortunately, due to various obligations, have not been able to have some of the attention that they could really use. And so we’ve brought them into our team, and so we’re hoping to breathe a bunch of new life into them, and we’re pretty excited to see what comes out of those. Then we recently hired Kyle Maurer, who joined us full time for helping out with EDD support, marketing, and various other things that we throw at him. He’s actually been working with us for about two years now, but in a part-time capacity just in his spare time, his evenings, his weekends. And he agreed to come on with us full time about a month ago, which has been pretty exciting. Then we also brought on a new person for Affiliate WP, Ginger Coolidge, who has been around the WordPress and Genesis community for a long time. Has come on to help us out with Affiliate WP support. She’d actually been working with us part time since December. But, about a month ago, also decided to come on with us full time, and that’s been awesome so far. That’s what we’ve been up to. Brad, how about you? What have you and your team been working on? You guys are always releasing new things. BRAD: Yeah. Yeah, so I’d say, in the last four months, I’ve spent about 20% of my time on hiring. I track my time, and it’s pretty much — it’s exactly 19%, so I mean that’s pretty crazy. I couldn’t believe it, actually. I thought I was making a mistake. But the results of that have been excellent. We hired a new developer to work on WP Offload S3, so we have three developers on that team. We also hired a marketing manager, so this is the first non-developer hire that we’ve had. That’s been excellent as well. We actually have a developer on trial right now as well. The idea there is that they would put in 20 hours a week to work on our site, which is pretty neglected because all the other developers work on the products, and it’s hard to justify stealing away their time from working on the products to work on our site. But sometimes it has to be done, right? That’s Evan Mattson is our developer on Offload S3. Liz Lockhart is our new marketing manager, so it’s pretty exciting. It’s a huge change for us to have someone helping us out with marketing because that’s an area that’s been on my plate, solely on my plate, and I’ve really been dropping the ball with it. PIPPIN: Yeah. That sounds all too familiar. BRAD: Yeah. Yeah, that’s how it is. I mean when you’re the founder, you have so many different hats. I mean you can only wear one for so long at a time, right? And usually the hats that you don’t like to wear, those are usually the ones that you wear the least often. For me that was marketing. PIPPIN: How did you go about finding Liz? You’re very much a developer. I’m very much a developer. One of the things I’ve always told myself about why it took me so long to really, like, get a hard look at marketing, whether it’s with a team member or me, is that I have no idea what a good marketer is. I don’t know how to hire that person. I don’t know how to find that person, so let me ask you how you did it. BRAD: It was a very difficult process. I felt like I was, you know, stum"
