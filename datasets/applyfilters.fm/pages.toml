title = "Episode 74: Looking Back at 2016, and Ahead to 2017 - Apply Filters"
description = "2016 had been a year filled with challenges, achievements, and good experiences for both Pippin and Brad. Today, we’re going to talk about the year in review, both professionally and personally. We’ll also think ahead..."
full_description = "January 17, 2017 Apply Filters Episode 74: Looking Back at 2016, and Ahead to 2017 Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 50:01 Share Share Link Embed Download file | Play in new window | Duration: 50:012016 had been a year filled with challenges, achievements, and good experiences for both Pippin and Brad. Today, we’re going to talk about the year in review, both professionally and personally. We’ll also think ahead to what we are hoping to continue, change, and accomplish as we look forward to a dynamic and successful 2017. Sit back and relax to a fun hour of reminiscing, goal-setting, and chatting about various topics. Some of the highlights of the show include: Fun stats for Apply Filters: How many episodes, how many downloads, and which episodes were the most popular. Some of the challenges in 2016. One major one for Pippin was that the growth of EDD seemed to have stalled. Brad’s challenges. One is that he realized that he’s taking on so many different tasks that he’s not doing them all well. Thoughts on deciding when to hire someone and how to hire the right person. Brad’s highlights from 2016: the Better Search Replace plugin, new team members, a retreat in Vienna, a huge increase in revenue, and more. Goals that Pippin met during 2016, including going to New Zealand and turning on automatic subscriptions for all of his primary products, as well as some highlights from the year, both professional and personal. Insights on what Brad and Pippin want to achieve in 2017, including hopes for hiring, conferences, and personal goals. Links and Resources: Episode 55 Episode 66 EDD 2016 Year in Review Post Better Search Replace plugin Pippin.com If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. BRAD: Welcome to Episode 74 of Apply Filters. This time Pippin and I will be looking back at 2016 and also looking forward to 2017. Pippin, how about you get us started off? How has your 2016 been? PIPPIN: Yeah. So we’ve got a few things that we want to go over. First of all, I think there were some interesting challenges that we both faced in 2016 on personal levels and business, in the business world, development, et cetera. We had some good highlights, and we have some good goals going forward in 2017. Before we get into those, because we’re doing a podcast, I think it makes sense that we go ahead and give a couple of quick fun stats that we just looked up from 2016 for Apply Filters. First of all, in 2016, we managed to record 21 episodes. That’s a little bit more than one episode per month. Episodes were downloaded over 50,000 times. And Episode 55 and 66 were the most popular with about 1,800 downloads each. As we learned today for the very first time, there is actually more than one person listening to this podcast, which is kind of cool. BRAD: Yeah. We averaged about 1.75 episodes per month, actually, so that’s not too bad. PIPPIN: No. We try to record once every two weeks. Every now and then we get delayed a few weeks. One of us gets sick or on a trip or something like that, but 1.7, that’s pretty close. BRAD: That’s why I thought, like, the average would be much lower, much closer to one per month, so I’m happy with that. Challenges in 2016, do you want to start? PIPPIN: Sure. Over the course of the year there was one big challenge that was consistently on my mind, both from a business perspective, a personal perspective, and a development. That was that the growth of EDD, at least in terms of the revenue that we were able to bring in from the project, seemed to have kind of stalled. I wrote up a big year in review post and published it last week or earlier this week. I think I published it on Monday and gave a whole bunch of details on it. Basically, we had started to see, maybe towards the end of 2015 and all of 2016, that EDD had been really skyrocketing up at a pretty good clip. Maybe not skyrocketing, but at least going upwards pretty consistently. It was for the first time that we really saw it level out and even go down. That was not necessarily a bad thing. That’s a pretty natural thing to happen, especially as a product reaches maybe four years old, which is about what EDD is, somewhere between four and five. But it was still challenging to deal with, especially because, in 2016 and 2015, we’ve actually risen our cost of maintaining the project quite a bit. It got to a point where we were actually spending more to maintain the project than the project was bringing in. Number one, we’re looking at it from a business perspective of, hey, is there something that we’ve done or something that we need to do to help improve this, to bring up the revenue or lower down the cost? And, at the same time, we’re looking at it from a development perspective because maybe there’s a lot of areas of the product that we need to improve, whether it’s from UI design to efficiency to whatever to the features that we have in the product. Kind of looking at all of those, so that was an overall challenge for 2016. I think we found various answers to a lot of different parts of it. We’re not really worried for the future of the project going forward, but it was — I don’t want to say it was a new experience for me because I’ve had projects that have slowed down and not necessarily died, but definitely slowed down in the past. But this was the first time that we’d seen it for EDD because, over the last four to five years, EDD has been our poster child, basically, for our projects. That was interesting. There was a lot of good exercises, a lot of good things to remember when we’re looking back on them, and a lot of hard learned and valuable lessons there. I think, beyond that, we had two other. At least for me, there was two other main challenges that I saw in 2016. The first was we grew our team by six people in 2016. A lot of those were during the year, and then two of them were actually right at the very end of the year. You could probably claim that two of those are 2017, but those team members came on at the end of 2016, but really started in 2017. But anyway, so I have always been a do it myself kind of person. Ever since I was a kid, I was raised with this mentality of we’re going to do everything ourselves whether it’s repairing the plumbing in the house to building something that we want to learning how to run a business to going to school, whatever. I’m going to do it myself. Trying to step out of that mentality and learn how to adequately run a larger team–our team is now up to about 15 people–was a challenge. It’s been a challenge ever since my first employee. I don’t think it’s gotten exponentially more difficult or challenging, but there are new challenges every time we bring on somebody new. Since we brought on six new people in 2016, this was definitely a year of learning lessons firsthand. Then the last one that I’d like to share is really something that I think, Brad, you probably feel as well being the head of your company and being a developer at heart is, over the last three years, every single month or as we’ve moved further and further along, I have continually lost my role as the lead developer. All of the projects that we run today started with me as the developer. I’ve always been the developer. I’ve written most of the code for our code bases up until not too long ago. As our team has grown, as our products have grown, I have started to step further and further out of that role. I write less code than I do today. I still write code, but I don’t write nearly as much as I used to, and I’ve started to really appreciate, understand, and miss the fact that my time spent writing code is not the best way for me to spend my time. I don’t know if I would say it’s been unexpected. I didn’t expect it three years ago. But it didn’t blindside me in any way. But it has been a gradual shift. Honestly, I don’t entirely know how I feel about it. There are certain days when I love running the company. There are certain days when I really just miss being the guy sitting there in the dark writing code. We’ll see where this goes in 2017 and beyond, whether I’ve transitioned my role back into development or if I continue to step further and further away from it. How about you, Brad? Anything you want to share or comment on for 2016? BRAD: Yeah, my challenges, well, one of my challenges was very similar to that. Well, I’ve hired all developers. Our team is all developers, so they handle the development. They handle support. They write blog posts for the blog. They write documentation. They do a lot of different things. But I do pretty much everything else like marketing and human resources, just basically everything else that is not that much fun. I think, over time, it has certainly worn away, like I’ve gotten kind of sick of it. And I’ve realized also, to make matters even worse, that I’m not doing any of those things very well. Because I don’t really enjoy doing them and because I’m doing so many different things that I don’t do any one of them very well. There’s a few things I do. PIPPIN: You’re doing them because it’s your job because it’s not anyone else’s job. BRAD: Exactly. Exactly. What I’ve realized is that I need to make some changes. I’m the founder. I run the company. I have the power to do whatever I want to do, like to change things. I have to do that this year and make sure that that happens because otherwise things won’t get better and I’ll continue struggling with motivation. I think another part of it was that I was feeling overwhelmed. I had a list of issues that are kind of top of my plate that I was planning to tackle that day. Then, as the day went on, more and more issues just came in and ended up on the top of the stack and pushed the other ones down. By the end of the day I had two. I got through the new issues, but I had two others added, so it’s just like the stack just kept getting bigger no matter what. Yeah, I think being overwhelmed was part of the problem there too, but then again I think I’m in control of that as well. I can hire people to help me out with that and stuff. We’ll be looking to do that this year. PIPPIN: Something I realized that I had done in 2016, and I didn’t realize that I had done this at all until I was sitting down and writing our 2016 review post that I published earlier in the week, as you said, as the founder and as the owner of the company, you have the power to make changes. One of those changes that I think we decide to make is whether to hire somebody to fill a role, to expand a role, to replace a role or what have you. Something I realized I started doing in 2016 was being much quicker to recognize when it’s time to hire somebody new. I think for all of 2015 and 2014, I was very reluctant to hire somebody new until it was really, really necessary. Perhaps maybe it’s just because I’ve now hired enough people that I’ve gotten used to the process and a little bit better at recognizing the value that they provide and the potential value, or maybe it’s just because I realized that I don’t want to work 18 hours a day. BRAD: Yeah. Yeah. I get you. That’s exactly what I think it is. It gets to a point where you’re just like I have to hire somebody. It’s the only way out. PIPPIN: Yeah. I think maybe that should be a general goal is we shouldn’t be waiting until we have to hire someone. BRAD: Right. Try to identify it earlier on. Yep, absolutely. PIPPIN: Yeah, exactly. Yeah. BRAD: Well, speaking of hiring, one of the other challenges I had this past year was hiring freelancers. I had some trouble, so I had one developer that was going to help out with work on our site. They said, okay, I’ll get started next week. Then next week came and went. Then two weeks came and went and three weeks. Then I had to start over. Looked for another freelancer. We managed to get things done, though. At least automatic renewals did get launched on our site with help from a freelancer. That was good, but there were some hiccups in that, in that deal as well, unfortunately. PIPPIN: Do you think that’s just because of the particular freelancers that were hired or because of communication errors, all of the above, or something else? BRAD: Probably all of the above, I would say. Yeah. I’ll just leave it at that. We’re on good terms now and everything, so I think it’s fine. But, yeah, mostly miscommunication kind of stuff. We looked at hiring a QA person, someone to come on and help test our products, and that was kind of a similar thing where it was like a week came and went, two weeks came and went, and nothing was happening. It’s just like I don’t know if the freelancers I end up finding are good, so good that they’re so busy that they just over-commit themselves and can’t make their commitments or what. I feel like I had terrible luck in 2016 with freelancers. Yeah, it’s something I guess I have to keep working at. I might try hiring for part-time instead of freelancers. Maybe that’ll help a little bit. I’m not sure. PIPPIN: I think there’s only one or two freelancers that we hired in 2016. Overall, they were a good experience. Everyone else that we’ve brought on, maybe as a freelance role, is considered a part-time person. They’re actively brought in. They’re not just here for a single project. BRAD: Right. Right. I like that because then whatever they learn today can be used tomorrow and in a month and in two months. Whereas if you’re just recycling through freelancers, you lose that knowledge. Our site is pretty kind of– PIPPIN: Well, and every single freelancer that you bring on, there’s an onboarding process with that. Everything from getting them in, getting billing agreements worked out, getting contact information, to even getting them exposed to the projects that they’re working on. BRAD: Right. Yeah, there’s some overhead there for sure. Yeah, so anyway that was one thing. Kind of the last challenge was that I hired a designer to redesign our site in November 2015, and it’s still not out, in case you’re wondering. Anyway, they completed their work in a timely fashion. I think by February I had a design that was done. Then I hired a freelance front-end developer. That was done in a timely manner. I think they delivered around April/May. Then I dropped the ball. I failed to allocate resources properly because what needed to happen — we had the front-end development done, so all we needed to do was integrate it into our theme. But there ended up being a lot more work than anticipated there. The designer had used placeholders, so all the screenshots had to be done. A lot of content had to be reworked or new content written. A lot of that fell on my plate. Then a lot of the development work, like integration work, someone else had to help me with that, b"
