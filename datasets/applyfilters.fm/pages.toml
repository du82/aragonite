full_description = "October 10, 2016 Apply Filters Episode 69: Maintenance Services and Page Builder Plugins Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 45:33 Share Share Link Embed Download file | Play in new window | Duration: 45:33Today’s podcast episode is sponsored by SearchWP. This search plug-in takes the WP search engine and supercharges it, giving you complete flexibility. It allows you to search your e-commerce files, build custom search engines, have multiple search engines on your site, and so much more. Go check them out to learn about all of their features. Brad’s Update Brad recently had a challenging week at home, because his wife was traveling and he had to take over all of the childcare duties, but he managed to get through it while still running his company. At work, there was a problem with customers not being able to connect to the API. It turned out to be an IPV6 issue. Brad is also organizing Big Snow Tiny Conf, an annual snowboard and ski conference for people with web-based business. Pippin’s Update AffiliateWP 1.9 release went out, and there were a couple of little hiccups, so a few point releases also went out. An update for the Group Accounts update of Restricte Content Pro is ready to go out soon. Pippin put out a new blog post about how to sell services with EDD. There is also a new update for the free downloads plug-in. Some of the topics discussed today include: Why WP developers and product companies should sell monitoring and maintenance services with websites. Pippin’s thoughts on page-builders, including his process for evaluating various ones. The three top page-builders, according to Pippin’s research and the user experience. Links and Resources: Big Snow Tiny Conf Hey WordPress Developers, Sell Maintenance Service With Your Sites Escrow.com Selling Services With Easy Digital Downloads WP Page Builder Plugins: A Critical Review Tailor Page-Builder Pootle Page-Builder Beaver Builder If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Welcome back to Episode 69 of Apply Filters. Today Brad and I are going to go over some of the updates that we’ve been up to, as well as some plans that are coming up for various things. But first, this episode is sponsored by SearchWP, a wonderful plugin from Jonathan Christopher. SearchWP takes the WordPress search engine and supercharges it. It gives you complete flexibility that allows you to make your search forms search within e-commerce orders, PDF files, and custom post type and whatever other kind of content you have on your website. It allows you to build custom search engines that are specific to the exact needs that you have. You could even have multiple search engines on your site. For example, you could have one that does e-commerce orders, you could have one that does products, and you could have one that does blog posts. It’s a powerful search plugin, and it’s available at SearchWP.com. BRAD: One thing I love about SearchWP is that you can just drop it in and it just works. It just makes the search better. PIPPIN: Yeah, which is awesome because it’s got all of the extra features in it that allow you to do things like the e-commerce data or the PDF files. But those are completely optional. BRAD: Yeah. That’s right. Yeah. Great piece of software. I also like the attention to detail that Jonathan has put into the user interface. I remember when I first installed it and it started to do its indexing. It shows that progress bar of the indexing. Yeah, it’s pretty nicely– PIPPIN: That’s another thing to mention is that because of the index, it keeps a complete index of all of the content on the site. I believe it has a separate index for each search engine that you build. It means that searching is actually much more performant because we’re not actually doing raw database queries of your content. It’s actually looking at an efficient index. BRAD: Yeah, that’s right. PIPPIN: All right, Brad. How was your last two weeks been? What have you been up to? What can you tell us? BRAD: Well, a couple weeks ago my wife was away, so I had both kids. That week was challenging to say the least having to deal with both kids. My son is in, like, preschool now, so I have to make him lunch as well every day. There’s like all these things that my wife and I split the labor on, and so having to her half of the labor was pretty challenging. But I managed to get through it. PIPPIN: While simultaneously running the company. BRAD: Yeah, while still get some work done. Yeah, I think I figured out that I probably lost almost a day of work that week. PIPPIN: That seems about right. BRAD: That’s insane, though, when you think about I don’t know how single parents do it, like a single parent with two kids. You really get an appreciation for how much, how crazy their lives are. PIPPIN: Every time that my wife leaves or she goes. She works part time, and so then I go home with the kids, and I always think, like — I go home early in the afternoon, and then I always think that, oh, yeah, I’ll be able to get the rest of my work done for the day. Don’t even try. It’s just probably not going to happen. Maybe a little bit. Maybe five minutes here or five minutes there, but that’s it. It’s okay. That’s just part of it. BRAD: Yeah. I used to try to do little bits of work on the weekend and stuff, and I actually found it really stressful because I get frustrated when I have to drop what I’m doing to help with the kids. We’ve got a better system now where my wife just takes them for, like, a block of time. Then I take them for a block of time. We can both get a little bit of work done on the weekends. That’s been nice. Then last week I was sick all week, which was pretty awesome now that we’re into the “sick season.” That would be great if that was the last sickness for the winter, but I feel like it’s just the tip of the iceberg. PIPPIN: I hope it’s the last one for you, for your sake. BRAD: Yeah. Yeah, that’s right. Do you get sick quite a bit during the winter down in Kansas? PIPPIN: I didn’t. I personally didn’t used to until around high school. I used to have a really, really great immune system and I very rarely got sick. Then I had about a week where I had pneumonia and mono at the same time and it shot my immune system. And so I actually get sick a lot more easily now than I used to. About once every two months, once a month or so during the winter, and a couple times during the summer too. BRAD: Yeah. I used to be pretty healthy during whatever season, but when my kids started going to daycare, that’s when everything turned upside down. Daycare is like a cesspool. PIPPIN: Yeah. BRAD: The kids are just kind of locked in a room all day. PIPPIN: Eh, just think of it. You’re building up your immune system and his immune system for years to come. BRAD: Yeah, I do. I do actually think it’s probably a good thing for the kids to get that stuff in now, but anyway I don’t know if it’s so good for me at this point. Anyways, we ran into this weird issue. Customers were having a hard time connecting to or they were just not able to connect to our API, to our website’s API. PIPPIN: For WP Migrate WP Pro or one of the other plugins? BRAD: It doesn’t matter. They all connect to the same API. PIPPIN: Okay. Is this for the licensing side and updates? BRAD: Yeah. Yeah. Yeah, so like checking the version number and downloading an update. All that stuff goes through our API, and so they were having trouble, like customers in Australia, for some reason. We thought it was something to do with Australia and, like, the DNS in that part of the world or something. We didn’t know why just Australians were experiencing this issue or at least they were the only ones reporting it. It turned out it was an IPv6 issue, which I don’t even know very much about IPv6, so I had to actually figure it out. It turns out what happened is when we set up our VPSs at Linode or DigitalOcean, usually the instructions for that are to set up IPv6 networking. If someone is on a network that supports IPv6 and that network will try to connect to our network using IPv6. Our DNS was all set up for IPv6, and so they were trying to connect. But I hadn’t configured Nginx to actually work with IPv6. That’s why it wasn’t working. They were connecting to our network. But then when they’d hit our server, it would just be like, well, there is no services for this IP version 6 IP address. Configuring Nginx with IPv6 totally fixed the issue. PIPPIN: How long has this been an issue? BRAD: Forever, apparently. I think what happened is some Internet service providers in Australia have switched over to IPv6, but none have done that in North America, I don’t think, or very few, anyway. Mine hasn’t. I tried. I had to actually SSH into our server and try to connect from our server to our other server to use IPv6 because my ISP doesn’t support it. We had a hard time just debugging it. Anyway, that was fun. Yeah. I’ve also been working to organize Big Snow Tiny Conf. It’s our annual ski/snowboard conference for people with Web based businesses. If you own a Web based business and you ski/snowboard, we all get together in Vermont. We’ve been doing this for, like, the last three, four years now. I think this is the fourth year. We chat about our businesses, and we ski and snowboard, and chat about our businesses, and so on. There’s a sauna that’s pretty cool. PIPPIN: It sounds like a horribly rough conference. BRAD: Yeah. PIPPIN: That sounds awesome. BRAD: Yeah, it’s a really great time. Last year we added a second event. Dave Rodenbaugh started an event in Beaver Creek, Colorado, so there was a Big Snow Conf West in addition to the Vermont trip that I organize with Brian Castle. This year myself and Craig Hewitt of Podcast Motor, who also actually edits this podcast and posts it to our site, we will be hosting an event in Charmonix. Mont Blanc is the name of the mountain. It’s the biggest mountain in Europe in France. PIPPIN: Oh, wow. BRAD: Yeah, so we’re going to do that in — what are the dates for this? The Mont Blanc, Charmonix trip is the first one. That’s January 16th to the 19th. Then the Vermont and Beaver Creek trips are the same dates, so 6th to the 9th of February for both of those. Yeah, so check it out, BigSnowTinyConf.com if you’re interested in any of those. We’d love to add some new faces this year. Tickets are going to go — well, tickets are already on sale for the France trip. The other two will go on sale October 10th. PIPPIN: Is the Colorado one going to happen again this year? BRAD: Yes. Yep. Yep. We’re going to have three events this year. Beaver Creek, Colorado, Sugar Bush Mountain in Vermont, and Mont Blanc, France. France: I’m saying it the French way. France. It’s France. PIPPIN: Yeah, that’s fantastic. I might have to try to make it to the Colorado one. BRAD: Yeah. PIPPIN: And just show off how bad my snowboarding skills are. BRAD: Nice, man. That would be great if you can make it out. I won’t be there, unfortunately. I can’t be. There’s no way I can convince my wife of three snowboarding trips in one year. Oh, and I wouldn’t be able to anyway because they’re the same. They’re at the same time this year. Yeah, so you can’t do both. Then I wrote a blog post–it was the other thing I did–called Hey, WordPress Developers, Sell Maintenance Service with Your Sites. That’s exactly what it sounds like. I was just making the case for developers that work on client sites to also sell a maintenance package or a service with that site. When you build it, you also maintain it – kind of thing. PIPPIN: I agree with you completely. Okay, I kind of see a couple of different. There’s a few different kinds of WordPress developers/agencies. There are those that go in, build a site, and they’re done. There are those that go in. They build the site. Then they continue to update it, and they continue to take care of that client on an ongoing basis. Then maybe some mixture of the two. What I don’t think we see often enough, and what we don’t see proposed enough as, like, something that freelancers especially and agencies should do is some kind of agreement that includes those kind of updates. I know that when I was a freelancer it was just kind of implied that I was going to be around to help take care of the site, and I would just charge you my hourly rate going forward, which is okay. But depending on what your workload is, that might be really tough to balance. Let’s say you have a big, new project come on and then all of a sudden a client that you finished a site for three months ago comes and needs a bunch of updates and support and things like that. And so unless you have a formal agreement or set up in place, that might get tricky. And so I really like what you’re proposing, the idea of having a formalized maintenance service that is paid for by the client that helps guarantee X, Y, and Z. BRAD: Certain things have to be done regularly, right? I mean I guess you could go hourly, and you could say, okay, I could charge by the hour. But I’m going to have to update your site probably on a monthly basis when new versions of WordPress come out, when new versions of the plugins come out. Those need to be updated. Then your site needs to be tested. Ideally, we need to do this on a staging site first to make sure everything goes smoothly and then do it on the production site when we’re confident that nothing is going to break when we do these updates. It’s fairly easy to sell this to customers that these things need to be done whether you pay for it now. Well, if you don’t pay for it now, you’re going to end up paying for it later when your site is down and your customers aren’t able to buy your products or whatever the site does for that company, right? PIPPIN: I think the point that you made about why you should sell maintenance as opposed to just pointing people to places like WP Site Care or some of the other maintenance services that are available, especially like WordPress specific ones, is the recurring revenue aspect. I know so many freelance developers who want to make a transition into, say, the product business because of the idea and that lure of recurring revenue. It’s not necessarily always recurring revenue, but the sense that of we have recurring revenue and suddenly I am not — my revenue is not directly tied to the hours that I work. It’s a very, very important concept and is one of the things that we see in product-based services that we don’t see as much in contract services. But, if you put a maintenance plan like this into place, then, as you said, a productized service for your business and now you have a little bit of both worlds. BRAD: Yeah. That’s right. There’s all kinds of stuff that you can d"
