title = "Episode 70: Mailbag - Plugin Pirating, Caching, Project Management - Apply Filters"
description = "Today’s episode is brought to you by SearchWP. This is a plugin for WordPress that improves search functionality within the platform, allowing you to create distinct search engines, assign priority, and much more. Check out..."
full_description = "October 24, 2016 Apply Filters Episode 70: Mailbag - Plugin Pirating, Caching, Project Management Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 44:43 Share Share Link Embed Download file | Play in new window | Duration: 44:43Today’s episode is brought to you by SearchWP. This is a plugin for WordPress that improves search functionality within the platform, allowing you to create distinct search engines, assign priority, and much more. Check out SearchWP.com for this very powerful plugin. On today’s podcast, Brad and Pippin are answering questions from our listeners and followers. Here is some of what you will hear answered: Plugin piracy: How Pippin and Brad deal with it. Marketing and sales flows: How Brad and Pippin manage their marketing. How Redis Cache can be used for WordPress and an explanation of object caching. The recommended roadmap for a PHP developer to become a WordPress plugin developer. Technical information about plugin updaters, slugs, and what takes precedence with WordPress.org. How Brad and Pippin handle project management and how they decide on features. Links and Resources: Redis Cache BuddyPress A CDN Isn’t a Silver Bullet for Performance Trello GitHub Slack Zapier Baremetrics Calculate What Feature to Build Next If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. BRAD: Welcome to Episode 70. This time Pippin and I will be answering listener questions. But first– PIPPIN: This episode is sponsored by SearchWP, a plugin for WordPress that dramatically improves search functionality within WordPress. It allows you to create custom search forms to search within files such as PDF files or text documents. It allows you to create distinct search engines, so you could have, say, one search form that searches your products and then another search form that searches your blog posts or the other pages on your site. You can weight searches so that you can say that, like, taxonomy terms are more important than meta values or post content. It’s a really powerful search plugin from Jonathan Christopher, and it is available at SearchWP.com. If you haven’t checked it out yet, definitely go take a look. BRAD: Awesome. Let’s get right into it. I’ll read the first question here. “How do you deal with plugin pirating? Any thoughts to share?” PIPPIN: Well– BRAD: Oh, boy. PIPPIN: I think anybody who has built a commercial plugin that has received any more than maybe five customers has probably dealt or seen pirating to some degree. Now we should probably be careful on using the word “pirating” because technically sharing GPL code is not really pirating. But, overall, the general idea is you have a commercial plugin that you sell, whether it’s through your own site or CodeCanyon or any other website, and somebody either buys it or obtains a copy somehow and then resells it or redistributes it through another source without giving you compensation for it is what I think people are typically referring to when they say plugin pirating. What’s your experience been? BRAD: We’ve only had one that I’m aware of, one instance of this. And what the person did is they took WP Migrate DB Pro. PIPPIN: Hold on. Do you mean only one instance that you know of where your plugins where ever redistributed or only one that was problematic? BRAD: Yeah, that’s — I don’t know of anyone else sharing our plugin. I’m sure it’s happening. I just don’t think it’s gotten enough attention that I’ve become aware of it because–I don’t know–I don’t go out there hunting for these folks, right? I don’t make it kind of my philosophy. It’s just to just kind of accept that a little bit of that is going to happen, right? It’s always happened with software, right? Anything digital is going to get passed around. So, okay, fine. When it becomes a problem for us is when someone would take it and then they pass it off as their own work and don’t change our name, don’t change the name of the product. And so they’re essentially infringing on our trademark, and so that’s where it’s kind of a legal problem, really. But it’s still really hard to enforce, I’ve found. And I don’t want to even say the name of this person that’s doing it or even say the name of the project that they’ve renamed it to, and the reason I don’t want to do that is because what I’ve found is that it makes it worse. It makes it worse when you bring more attention to this person because most of the time these people, that’s what they’re looking for, right? They’re looking for attention. What I’ve learned is that every time that I try to fight it, it gets worse instead of better. So I just try to leave it alone and just hope that it kind of just dies out because the other thing is — so this person is distributing our paid product for free, so they’re not getting anything from it. So they have very little incentive to keep doing it. And it seems like the only incentive they have is to be anarchistic or contrarian. Right? That’s their motivation for doing it. Because we’re offering it as a paid subscription, they see that as wrong and so they’re doing it kind of to fly in our face, I guess. By giving them more attention, that’s exactly what they want, right? You’re playing into their hands. So I’ve tried to just ignore it. That’s been my kind of strategy lately. PIPPIN: I think that’s my strategy as well. I’m not convinced that actively trying to fight it, trying to get people’s hosting accounts discontinued or trying to get them to take plugins down or however they’re doing it, I’m not convinced that it’s worth it in any way. I think we have to realize that piracy or, in this case, like we said earlier, it’s not exactly piracy, but we’ll use that term for now, it happens in every industry, and it has an impact on business owners, but I think that impact is largely proportional to how you choose to fight it. If you decide that you’re going to actively fight piracy, and you’re going to try to take down every offender, and you’re going to try to strictly protect all of your code to make sure that nobody can do it, I think you’re just wasting time. I think it is a — in my opinion it’s kind of a disservice to the people that are actually paying for your products because you’re putting time and effort into the wrong place. Personally, my answer is I do nothing with a couple of exceptions. Every now and then if we see somebody redistributing one of our plugins while also trying to do it underneath our brand or, like, using our brand or our trademarks, then we will go after them for that. But that is only in protection of our branding, not for the actual code itself. We don’t care about the code. We care about the branding and the reputation that goes with it. BRAD: Right. It might be interesting for people to hear, like, what we have actually tried in the past. I’m willing to share that. PIPPIN: I’m willing to share. BRAD: Yeah, so I’ve contacted GitHub in the past and this was before I actually had any trademarks, any registered trademarks. Technically, if you’re selling something with a name, technically you already have a trademark. It’s just not registered yet. You have to register it with the USPTO to make it more official, and I guess it’s easier to start legal action if you actually have a registered trademark. We have those now, but at the time I didn’t have anything. But the person who was copying our software, they were also copying all of our marketing materials off our website, and that’s copyright infringement. So I submitted a copyright infringement claim to GitHub, and they took the repository down for a short time. Then they let the guy put the stuff back up with tweaks to the marketing copy. I still find that’s a little soft of GitHub to just give them a slap on the wrist for copyright infringement. It seems like it should be a bit more severe of a punishment than that. When the repo came back online, all of the traffic to that repo was still flowing, right? So they didn’t have to start over, right? So I feel like they could have been more harsh than they were. Then I realized that the owner of this repo was also pushing people to a copy of our software that had our trademark in it, and so he was still using — technically distributing our software with our trademark name in it. I submitted that to GitHub, but they passed it through their legal department, and they didn’t see it as a trademark violation, which– PIPPIN: Interesting. BRAD: Yeah. I don’t agree, obviously, but it is what it is. And so that’s been my experience with this. PIPPIN: We’ve done kind of in the same way you submitted to GitHub, we’ve submitted to hosting accounts, hosting companies before, so if we find a website that has taken our branding. And again we don’t care about the plugins themselves. We just care about the branding and any trademarks. Then we’ve gone to the hosting companies before and said, “Hey, this account, this URL that’s hosted on your systems are violating our trademarks and our copyrights. Please take them down. We have had some success with getting those discontinued sometimes. The bigger one where we get really adamant about it, though, is if we discover that somebody is doing that and they’re also committing fraud at the same time. So like we have found — we’ve had customers that have come to our sites, bought all of our plugins using a stolen credit card, and then redistributed through their own site. Obviously we block that customer. But then you can report those to the hosting account. And if you have proof that it’s fraud, then that’s a lot easier to take down because it’s not just somebody trying to fork. It’s legitimate theft at that point. That will act very harshly against, so we’re pretty quick to block those. But beyond that, I’m not very interested in spending time fighting plugin redistribution. BRAD: Yeah. We’ve got other things. I feel like– PIPPIN: Yeah. BRAD: –the energy you put into that kind of stuff is much better spent. If you spent the same amount of energy, like, moving your products and your company forward. PIPPIN: Absolutely. BRAD: Yeah. PIPPIN: I would much rather spend one hour and earn two new customers than spend one hour and maybe take down a bad apple. BRAD: Yeah, exactly. PIPPIN: So, all right. We probably better move one before we go on too much of a tangent and use our whole episode. BRAD: Yeah. PIPPIN: Okay. Our next question is, “I’d love to hear you guys talk about marketing and sales flows. How do you promote your plugins? Where do you advertise, if you do, and what tools do you use to manage your marketing sales funnels?” I think we’ve talked — we answered this question in some form or other on some previous episodes, so maybe we’ll keep it a little bit brief, but what do you do for your, Brad? Do you have any advertising tools that you use or specific marketing flows that you use? BRAD: Yeah, we primarily do what you would call content marketing. So we post on our blog every week, and we try to do really high quality content for our blog, so not just fluffy articles that have very little substance, which I feel like there’s a lot of that out there these days. That’s how we try to– PIPPIN: The ten best plugins to run your business. BRAD: Yeah, that’s the one. We try to differentiate from that by doing, like, in-depth tutorials and, like, really substantive articles. PIPPIN: I think that’s easily the best return we’ve ever found on any “advertising” investment. BRAD: Right. Then, of course, we also publish this on Facebook and Twitter and Google+ just because I don’t know what Google+ does, but it’s Google, so you’ve got to play their game, man. They want you to use Google+, then we’re going to use Google+. Then we also boost the Facebook article using Facebook’s ad platform, and we spend $35 to run it for a week, and that’s just to get new eyeballs on our site and stuff. Then we also have remarking running. So if you come to our site, and then you end up anywhere else on the Web, you’re going to see our banner. PIPPIN: Every now and then I see your ad pop up. I’m always like, dang it, he’s following me! BRAD: Yeah. Yeah, it’s kind of annoying and kind of creepy, remarketing, but it works pretty well. PIPPIN: I believe it. BRAD: Yeah. PIPPIN: All right. Okay, this one is for you, Brad. “Hi. I was thinking if you guys can talk about what Redis Cache is, how to use it for WordPress, and what kind of performance improvement we can get out of it.” BRAD: Oh, I don’t know about performance improvement. PIPPIN: I think you’re a little bit more familiar with this than I am, so what can you tell us? BRAD: Well, yeah. I wouldn’t say I know Redis very well because I don’t. I know of object caching, which is what we use Redis for in WordPress. I mean maybe you want to explain what — you know what object caching is, right? PIPPIN: I do. I will say that any time I get into a caching discussion is that I typically put my foot in my mouth because I get something wrong. BRAD: That’s okay. We’re winging it here. Yeah, so object caching is essentially let’s say you’re querying. You load a page and it’s querying for a post in the database. Well, with object caching, a persistent object cache, the next time a visitor comes to that same page and instead of querying the database, it’s going to pull that data right out of memory, which is where Redis keeps it. That was kind of a weird explanation, but hopefully that made sense. Then Redis is just a key value store, essentially, and it runs on the server, and WordPress essentially connects to the Redis server, and it can pull stuff out of it. Prior to using Redis, I think we used something called APC, which was an extension for PHP, so you would build PHP 5.6, let’s say, with APC, and then you would use that system to manage your object cache, your persistent object cache. But with PHP 5.7, it got rid of — did I say 5.7? I meant PHP 7, it got rid of APC, and so we didn’t have an object cache any more, so now we use Redis to do our object caching. That’s why you’ve heard of Redis more recently. I think people were experimenting with Redis, like, prior to PHP 7 being released, but I think PHP 7 really pushed Redis as the persistent object cache for WordPress kind of forward. Does any of that make sense, Pippin? PIPPIN: Yeah, I think that was nice and clear. BRAD: Okay. Do you have any questions about it, or is it good enough? PIPPIN: I’d be curious to know what your own performance improvement measurement was, if you were able to do it, like, with it on versus off because I think it’s important to note that any time you’re talking about caching of any kind or any kind of system that is designed to improve performance is that it can vary dramatically from system-to-system, from hosting account to hos"
