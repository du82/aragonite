description = "Today’s episode is sponsored by SearchWP, a powerful plugin to enhance your WordPress search experience. One of its main features is its ability to build custom search engines. It also has the ability to search..."
full_description = "November 7, 2016 Apply Filters Episode 71: Growing Through Strategic Acquisitions Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 42:39 Share Share Link Embed Download file | Play in new window | Duration: 42:39Today’s episode is sponsored by SearchWP, a powerful plugin to enhance your WordPress search experience. One of its main features is its ability to build custom search engines. It also has the ability to search within PDF files, office documents, and other types of files. You can get a free three-day email course that explains how SearchWP can improve your search function at SearchWP.com. Today we are talking about various updates. Here are some of the highlights: Brad has acquired Better Search Replace Pro earlier this year, but he’s announcing it now because he wants to build some of its features into Migrate DB Pro. He answers some questions from Pippin about the acquisition process and what it will look like going forward. Brad also talks about some other updates and changes to Migrate DB, as well as his process for walking people through the Mergebot beta testing process. Pippin has pushed through a few updates and has brought on a new support technician to help with support. He’s also put out a free add-on called Limited Quantity Available that limits the number of times a subscription can be purchased. He talks about some other updates to EDD, including add-on release updates. Pippin tells listeners about the process of discovering a free Stripe plug-in that caused some confusion, acquiring the plug-in, and deciding to discontinue the product. Pippin put out a new version of the iOS app for EDD. It has more features than the old version, with much more information available. It’s also compatible with the Apple Watch. Links: Episode 44 with Jonathan Christopher Big Snow Tiny Conf WordCamp US 2016 If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Welcome back to Apply Filters, Episode 71. Today Brad and I are going to talk about a few plugin updates that we’ve done as well as a couple of conferences and various other updates. But first– BRAD: This episode is sponsored by SearchWP, a powerful plugin for WordPress that dramatically improves the default search engines inside of WordPress. One of the main features, it has the ability to build custom search engines. For example, you could build a search form that’s specific to your e-commerce products or your health documentation or any other kind of content that’s on your website. It even has the ability to search within PDF files, office documents, and other kinds of files on your server. SearchWP right now has a free three-day email course that you can sign up for from SearchWP.com that will help explain how SearchWP can improve your site. We had Jonathan Christopher on the show, the creator of SearchWP, back in Episode 44 if you’d like to listen to an interview with him. Be sure to thank him for sponsoring this episode and upcoming episodes by going to SearchWP.com and checking out the plugin. PIPPIN: It’s well worth the effort and the price tag. BRAD: Yeah. Awesome. PIPPIN: All right. So Brad, I know you guys have pushed out a couple of updates recently. Want to tell us about them, or if you have anything else you want to go over first? BRAD: Yeah, so the cat is out of the bag that we actually acquired a plugin. We acquired Better Search Replace Pro from Matt Shaw back in January. And I didn’t announce it until now because I wanted to build in some of the features of Better Search Replace Pro. I wanted to build them into Migrate DB Pro and kind of announce our plans for that. And so this release is the start of that. This release is kind of the first big feature of Better Search Replace Pro that we’ve added to Migrate DB Pro. It is in place, search and replace, so you can run a search and replace on the current site that you’re currently on. That was not possible before with Migrate DB Pro, and now it is in version 1.7. An example of why you would use that is so let’s say you’re developing. You have a local development environment, and you have a staging site that eventually is going to become the live site, so there’s currently no live site or you’re replacing a live site, or something like that. Well, when you go to turn that staging site into a live site, you can just use the find and replace feature to change all the URLs from the staging site URL to the live site URL. That’s pretty common. I know I’ve done that quite a few times. PIPPIN: Oh, I’ve had to do that so many times. BRAD: Yep. That’ll be– PIPPIN: I think it’s a … feature. BRAD: Yeah, that’ll be pretty handy. PIPPIN: I’ve got a couple of questions for you about Better Search Replace and kind of that acquisition process and what it’s going to look like going forward. There are two versions of the Better Search Replace plugin. There’s the free one on WordPress.org, which is now owned by Delicious Brains, your company, and also Matt Shaw, I believe. And then there is Better Search Replace Pro. Better Search Replace right now has over 100,000 active installs, and I would assume the pro version has a pretty decent sized customer base, based purely on the active installs of the free version. What are your plans for that plugin? Are you guys going to — are you going to deprecate it over time? Are you going to slowly discontinue it? Or are you going to maintain them side-by-side? BRAD: We did acquire the free version as well, so we acquired the copyright and that kind of stuff and control of the free plugin. We’ve acquired kind of the whole thing from Matt. If Matt decided to move on tomorrow, for example, we would still have control over BSR and BSR Pro. The plan is to consolidate the code bases because there’s a lot of overlap between Better Search Replace and WP Migrate DB, and so it doesn’t make sense for us to be duplicating our efforts by maintaining two separate code bases. The plan is to eventually be able to create a build of Better Search Replace Pro and Better Search Replace from the WP Migrate DB code base. By that I mean running a script that doesn’t include certain files in the zip and includes certain files that it doesn’t include in Migrate DB and that kind of thing. We actually — we’ve opened sourced our build script, so I can link that up in the show notes for people to check out if they’re interested. PIPPIN: With that build script, you’re planning to actually — you’re going to maintain one code base, but actually distribute two products? BRAD: That’s right. Yep. PIPPIN: Ha! BRAD: Yeah. PIPPIN: Cool. BRAD: The build script will actually change the branding too, so it’ll still be called Better Search Replace and Better Search Replace Pro, and it will be different than the other products. We’re not just changing the name and repackaging it. PIPPIN: Do you think there’s a danger of the two products getting confused or customers being unclear on what is what? If the features of Better Search Replace are inside of WP Migrate DB Pro, it wouldn’t make sense for somebody to own both of them. Do you think there’s a possibility of confusion there? BRAD: I don’t think so. The way I look at it is Better Search Replace Pro is kind of a less feature rich version of Migrate DB Pro. And so it’s kind of like Migrate DB Pro’s little brother in a way, and it’s priced accordingly. Because it’s not as feature rich, it’s going to have a lower price tag. And so if, for example, you are someone who finds Migrate DB Pro to be too expensive for your needs, but you still want some kind of tool to help you with your finding and replacing, with your migrations and deployments, and all that stuff, maybe Better Search Replace Pro is a better option because of the price tag. PIPPIN: Will you provide customers a way to upgrade or downgrade between the two? BRAD: Maybe in the future. Not right now we don’t. As an example, we just did this release this week. One of the comments on our blog was that, “Oh, I just bought Better Search Replace Pro. Now you’ve added this feature to this plugin. Oh, man.” And so I just replied, like, “Just send an email to support. We’ll give you a refund for Better Search Replace Pro. No problem.” We can get around this. So if, for example, someone has Better Search Replace Pro and they want to upgrade to Migrate DB Pro, we can create a coupon, like a discount code for them so that they can get the same price. PIPPIN: Certainly. You will allow customers to upgrade and move between the two. BRAD: Yeah. PIPPIN: At least for now there’s not a one click upgrade or anything like that. BRAD: That’s right. That’s exactly right. PIPPIN: Which I think is perfectly reasonable, especially considering they’re on different websites. One of them is on WooCommerce. One of them is on EDD. I think that’s a perfectly fine approach. BRAD: Yeah. Yeah. Yeah, I could see eventually consolidating everything onto one site. But right now it’s just too much hassle. PIPPIN: Yeah. BRAD: For now we’ll leave it at that. PIPPIN: Welcome to the challenges of acquiring an existing product. BRAD: Yeah. Exactly, yeah. PIPPIN: It’s rarely ever a super smooth process. BRAD: Yeah. Yeah, so anyway, the bottom line is like anyone that has Better Search Replace Pro, they shouldn’t have to worry. We’re going to be maintaining this indefinitely, and Better Search Replace Pro is going to stick around. It’s going to have all the features it currently has. PIPPIN: Do you plan to keep the free version around too? BRAD: Yep. Yep, the free version will stick around. I mean that was one of the main reasons we purchased it because, I mean, look how well it’s doing on WordPress.org. PIPPIN: Right. There’s a lot of value there. I mean 100,000 active sites, great reviews, I mean let’s see. It’s got 125 five-star reviews and only less then 10 one- and two-star reviews, so it’s pretty stellar. BRAD: Yeah. I mean that’s a testament to Matt and the work that he did there, so yeah. I was happy. It was an interesting conversation. I wasn’t — I had very little hope of actually doing an acquisition. It was kind of more in the back of my mind. It wasn’t like I called him and said, “Do you want to sell?” It was more like, “Hey, Matt. How’s it going? How are things?” And kind of like maybe halfway through the call I was like, “Have you ever thought of selling?” you know, and kind of approached it that way. Yeah, it was an interesting chat. PIPPIN: Cool. Anything else in the new 1.7 release of WP Migrate DB Pro that you want to share? BRAD: We also have a find and replace sub-command for WP CLI now. And that’s built into Migrate DB and Migrate DB Pro, so you can use that command to do a search and replace in place. And it has a few advantages, like the question people would have there is, like, why wouldn’t you just use WP CLI search and replace command? Our search and replace offers multiple values, so you can comma separate multiple values, and so you can do a find for multiple things and replace it with multiple things. Then there’s also a little bit more — it’s a little safer because we duplicate all the tables and run it against the duplicated tables before replacing. Then there’s save profiles as well, so you can actually save your find and replace profile if you can remember…. PIPPIN: That’s the one I was wanting to comment on. I think that right there is an important piece because if you have, whether it’s a staging site or some kind of routine process that you want to do find and replaces a lot and it’s always the same values, having those saved profiles can be huge. It’s just a really nice little timesaver there. BRAD: Yeah, so you’re not always typing out these long commands. Yeah. One of the nice things is that we’re also handling HTTPS to HTTP. If you’re developing locally on MAMP and you didn’t set up HTTPS, but the staging and live sites have HTTPS. Well, when you migrate to those sites, to and from those sites, you need to change the protocol on all the URLs from HTTPS to HTTP. You were able to do this in the past by adding an additional find and replace, so manually adding it when you’re setting up your migration. But now we just handle it for you. We detect the protocol on each side and it’s just handled, so you don’t have to worry about it any more in 1.7. Another little thing that we added is a copy to clipboard button for the connection information. It copies to the clipboard, but it also keeps it all on one line so that it’s to just paste into your terminal. PIPPIN: Thank you for addressing one of my biggest complaints whenever I copy commands in the terminal. If the line break, it like goes, executes the first one, and then it loses the rest of the command. BRAD: Yep, that’s nasty, so we wanted to fix that and make it easier. And so it’ll still work with our box as well, our connection info. Like if you paste it in, it’ll still work. So it works both on the command line and in our UI. PIPPIN: Very cool. BRAD: And we also did a little bit — we added — we did release a new version of the CLI add-on, so a major update. We added a new sub-command, so you can actually change the settings, Migrate DB settings from the command line now. You can update the license. You can add your license key from the command line. You can turn on push and pull permissions. In the settings tab in Migrate DB Pro, you’d be able to set those settings from the command line now. People that were trying to automate the setup of their sites, this was a big missing piece for them. They had to do some hacky stuff set those settings. Now it should be nice and clean to do it that way. PIPPIN: I’ll be honest with you. It makes me jealous sometimes of the people that set up all these new sites all the time because they get to use it. I would love to use this tool more often, but I don’t set up new sites all the time. BRAD: Right. Well, I’m kind of in the same boat. I don’t really use it either. I rarely use it. PIPPIN: I guess I just need to get better at updating all of my staging sites automatically so that I get to use it. BRAD: Yeah. PIPPIN: Every time I use it, it’s a great experience. BRAD: That’s a funny thing, right? You and I, I think our products are scratch your own itch products. Yet, at this point we barely even use our own products. I guess you use EDD quite a bit. PIPPIN: We use EDD extensively. BRAD: Yeah. PIPPIN: Some of our other plugins we don’t use as much. We’re trying to really focus on the ones that we use. BRAD: Right. Yeah. Okay, and the only other thing is the profiles. We also added a profiles sub-command, so you can actually view the profiles that exist on the command line so that you don’t have to go to the UI to see what profiles you have set up. Yeah. What else have I been up to? I’ve been do"
