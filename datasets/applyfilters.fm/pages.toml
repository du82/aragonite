["https://applyfilters.fm/podcast/episode-49"]
title = "Apply Filters 49: Drew Jaynes, WordPress 4.2 Release Lead - Apply Filters"
description = "With our sponsor WP Ninjas soon to be releasing Ninja Forms 3.0 we wanted to share this NinjaForms preview video.  Check out what you can expect in the upcoming release of Ninja Forms 3.0. Today..."
full_description = "October 5, 2015 Apply Filters Apply Filters 49: Drew Jaynes, WordPress 4.2 Release Lead Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 53:09 Share Share Link Embed Download file | Play in new window | Duration: 53:09With our sponsor WP Ninjas soon to be releasing Ninja Forms 3.0 we wanted to share this NinjaForms preview video. Check out what you can expect in the upcoming release of Ninja Forms 3.0. Today we welcome Drew Jaynes to the show. Drew recently led the launch of WordPress 4.2, and we’re excited to get his insights into that process. Before we get into the show, we want to take a moment honor the memory of Alex King, who we recently lost after a battle with cancer. Pippin’s fondest memory was a dinner they shared together a few years ago, and was struck at how humble he was, despite his experience. Drew shares this sentiment, and his memory is from a panel discussion at WordCamp a few years ago in which Alex was the moderator. Brad remembers meeting Alex at Pressnomics, and remembers how genuine and caring he was about everyone’s individual contributions to WordPress. In the past weeks there have been several very good articles remembering Alex. We particularly liked: https://ma.tt/2015/09/remembering-alex-king/ https://poststatus.com/alex-king/ https://wptavern.com/alex-king-founder-of-crowd-favorite-passes-away Drew Jaynes is a Platform Engineer at 10up, giving him the sole responsibility of managing all things WordPress core and community within the company. This includes revamping and continuing to build out the Developer Portal. Drew just completed the successful launch of WordPress 4.2. Making the transition from a contributor to a release to being Release Lead means being more of a project manager than digging into the details of the code. In fact, Drew just passed 1,000 commits to WP core. WP 4.2 development started in January and was released in April of this year. The major updates in this release include: Press This revamp Customizer theme switching AJAX plugin updates utf8mb4 Shared term splitting Beyond the nuts and bolts of Drew’s experience in this most recent release, we dig into his experience as a core contributor within WordPress. These include: What’s it like leading development of community built software as far reaching as WordPress The Best and Worst parts of being WP core Release Lead What are bug scrubs and were the implemented successfully in 4.2? Thoughts on language packs for plugins to aid translation What role do custom tables have in plugin development? Term Meta GlotPress as a plugin If you like skiing, snowboarding, talking software, and business then you should check out Big Snow Tiny Conf. This year it will be January 25-28 in Sugarbush, VT. If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. BRAD: Welcome to Episode 49. Today, Pippin and I welcome Drew Jaynes, who led the release of WordPress 4.2 earlier this year. Drew, welcome to the show. DREW: Thanks for having me. PIPPIN: It’s awesome to have you on. BRAD: Yeah. Before we dig into the challenges of leading the 4.2 release, I was thinking I’d like to take a few minutes to raise a glass to Alex King, who we lost to cancer last week. Alex was a huge influence in the WordPress community and a very successful entrepreneur as well. But, rather than list his achievements, I thought we could just share our stories of Alex. Pippin, how did you know Alex? PIPPIN: I actually had the opportunity to meet him a couple of times, several times just kind of in passing at different WordCamps, and had always been impressed with him. I had been familiar with some of his work or a lot of his work, really. He was very, very prevalent throughout the WordPress community and outside. But, I also had the opportunity to sit down and have dinner with him once, I think at either PressNomics or WordCamp Phoenix. It was one of those times when you — have you ever been in a place where you sit down or are in a close space with somebody who you’ve looked up to for years and years and years? It’s a really cool experience, and so I got to sit down and have dinner with Alex. I just remember being so incredibly humbled by how friendly, conversational he was. Here’s this guy, Alex, who everyone in the WordPress world knows, a lot of people outside, he’s had amazing influence throughout the development world. Here he was just a very casual, nice conversation, and I remember being extremely humbled and honored that he actually knew me by name. I felt like a nobody, and here’s Alex. To me, that was a really great symbol for who Alex was that he was always so friendly to everybody. He was an awesome person. BRAD: Yeah. I remember someone saying to me something like, “Hey, he’s just a geek. He’s just like us. He’s totally geeking out on dev stuff with me.” PIPPIN: Yeah, absolutely. BRAD: But he’s running this big profile agency, dev agency too. Yeah, I think that was an interesting comment that someone made. I was like, yeah, I guess I never thought of it that way. I guess some people thought that Alex was more of a businessperson, right? I guess he was. He was both. PIPPIN: He clearly ran a very successful business that’s still around today, Crowd Favorite. I think he was the original founder of that. BRAD: Yes, that’s right. PIPPIN: But, yeah, he was a geek. BRAD: Yeah. PIPPIN: Drew, did you have an opportunity to spend time with him ever? DREW: Well, you know it’s funny you mentioned Crowd Favorite because I always knew Alex as the incredibly intimidating owner of Crowd Favorite, which here is the local shop, right? PIPPIN: Right. DREW: I met him a couple years ago, finally, and he wasn’t intimidating at all, but it seemed so intimidating to work for Alex’s team. You know he was the originator of WordCamps in Denver. He and Crowd Favorite ran the first two WordCamps in 2009 and 2010. We had him on as a moderator for this really, really successful UX panel in 2013, and I had an opportunity to bond with him then. Honestly, he told us the worst thing about panels is that they have terrible moderators. We said, well, that’s why we picked you. PIPPIN: Nice. DREW: He was a great guy, and he was immensely talented. PIPPIN: I just read — Matt Mullenweg posted a really nice “Remembering Alex King” post. Something that I had never known was that Alex had actually been around in the WordPress world since before WordPress. He started on B2, and that was news to me. I knew that Alex had been around for a long time, but he was literally here from the beginning. It’s amazing. BRAD: Yeah, that’s a really good post that Matt made, actually, about Alex. PIPPIN: Yeah, it was awesome. BRAD: I thought it was really well done. Yeah, we’ll link that up in the show notes so everyone can take a look. PIPPIN: There are two other really nice posts for Alex that you should check out. We’ll link them as well. That was one that Brian Krogsgard wrote up on Post Status and then another one from Jeff Rowe at the WPTavern. We’ll link them all in the show notes. BRAD: Cool. PIPPIN: Yeah. BRAD: I just want to say that I met Alex for the first time at PressNomics, actually. He was very enthusiastic about the WP App Store, and he was emailing with me back and forth before I even met him in person and kind of helping me along a little bit. That was really cool. I was super humbled by that. I was like, what? Alex is reaching out to me? I’m nobody. PIPPIN: Yeah. BRAD: We played a round of golf at PressNomics as well, and we both shared kind of a passion for sports, and golf in particular. That was pretty special to be able to do that. PIPPIN: Yeah, he definitely left his mark on the community. BRAD: Yeah. PIPPIN: Alex was awesome. BRAD: Yep, so he will be missed for sure. PIPPIN: Yep. Drew, let’s dive into you for a little bit. We want to talk about some of your experiences leading WordPress 4.2 and some more generic kind of open topics around the aspects of leading development for large community-driven projects such as WordPress. Before we do that, though, I believe your technical title is Platform Engineer at 10up. DREW: That’s right. PIPPIN: What does that mean? DREW: I’m actually the originator of this title, and this actually hasn’t been announced yet. PIPPIN: Ahh! Whoops! DREW: Well, yeah. Whatever. It essentially means that I am solely focused on one platform that 10up relies on, which in this case, of course, is WordPress. The standard titles at 10up are Web Engineer, Senior Web Engineer, whatever. As I moved from them donating basically half of my time to now 100% of my time, we had to come up with something better than Web Engineer. PIPPIN: That’s so cool. BRAD: Platform Engineer, that title hasn’t been announced? Is that what you said? DREW: That’s right. BRAD: But you’ve updated your Twitter profile already. DREW: I have. Yeah. Let’s just say it should have been announced already. PIPPIN: Okay. BRAD: I see. DREW: It should be soon. PIPPIN: There are a few people listening to this podcast. DREW: Yeah. PIPPIN: We’ll be fine. BRAD: You’re 100% on WordPress core, right? DREW: WordPress core and community because it’s not just core, but yeah. BRAD: Right. PIPPIN: That’s awesome. In this case, does community mean things like WordPress.org itself with the meta team? DREW: Yeah. PIPPIN: Basically anything involved with the WordPress project? DREW: Yeah. I’m pretty active on three or four different teams: core, docs, meta. Then there are a whole bunch of projects that I work on that are hybrids of all three of those things, like the developer hub for instance. PIPPIN: Very cool. BRAD: What’s that? What’s a developer hub? DREW: Developer hub is part of the docs roadmap that we formulated a couple years ago in Cincinnati. That’s the code reference. There’s a dashicons reference. There are the theme and plugin developer handbooks. PIPPIN: Right. It’s developer.wordpress.org, right? DREW: Right, the developer…. PIPPIN: The new version of the codex. BRAD: Ahh, I see. I see. DREW: Yeah. BRAD: That’s separate. Right, it’s a new version of the codex. It’s separate from the make blog stuff. DREW: Yeah. BRAD: Right. DREW: It’s separate from the make network. It’s essentially, the different between the codex and the developer hub or the developer reference is, the codex is community documentation and the developer reference is official documentation. BRAD: Ahh, okay. PIPPIN: Am I right that at some point the plan is to actually remove the codex completely? DREW: That’s right. PIPPIN: Cool. DREW: Eventually. That’s not going to be any time soon. PIPPIN: That’s a long process, for sure. DREW: Yeah. PIPPIN: I am impressed with how far the developer.wordpress.org site has come since it first launched not even that long ago. Is it even a year old at this point? DREW: Well, it’s actually been up for a while, but I think Matt announced it during the State of the Word at WordCamp San Francisco last year. PIPPIN: Okay. DREW: But it was up for probably six months before he announced it. PIPPIN: Sure. It’s definitely progressing very fast, it seems. DREW: Absolutely. As part of the work that I do on core as the docs committer, the developer reference is displayed from parsed documentation that comes from the source, and that’s why we had to have sort of somebody managing and maintaining the source documentation because it goes directly into the code reference. PIPPIN: Got it. That’s very cool. Let’s move on and talk about WordPress 4.2, which is the release that you led back in January of this year, I believe, 2015. DREW: Yeah, I think it was January to April. PIPPIN: You led that release, and this was a big release that had a couple of significant improvements. Customizer theme switching was one, ajax plugin updates. I believe this was the first part of the shared term splitting timeline and was also the big emoji release, emoji/utf8mb4, and also Press This. DREW: Right. PIPPIN: What does leading a release really entail? Obviously development happens because new features are built, bugs are fixed. But, as a release lead, you’re not doing all that development. What does a release lead really do? Maybe tell us a little bit about that. DREW: I think a good sort of parallel is if anyone has ever organized a WordCamp or organized an event. I think that’s maybe a good parallel to what a release lead does. You’re essentially wrangling resources. You’re a project manager. BRAD: Right. You’re herding cats. Is that another metaphor? DREW: Sometimes, sure. I think it’s definitely managing your resources. And, in a project where everyone is a volunteer, that can be a challenge. It helps to have a good base of knowledge in terms of how previous releases worked, things that maybe didn’t work in previous releases that you want to try and improve on. But it’s largely project management. You’re working; you’re keeping track of so many different details that you can’t even imagine. BRAD: Right. How much development do you do personally? Do you get into the code during that time, or do you keep out of it? DREW: You can. It depends on what your focuses are going to be during the release. Scott Taylor has been doing — he’s beating all of us in terms of development in 4.4, so it’s not like you can’t be involved in development. PIPPIN: He’s the release lead for 4.4, isn’t he? DREW: That’s right, and he has, I think, almost 400 commits in this release. PIPPIN: Wow! BRAD: Yeah. DREW: It’s pretty ridiculous. PIPPIN: Speaking of commits, I believe, Wednesday, you had just passed your 1,000th commit to WordPress core. DREW: Yes, it was. PIPPIN: Congratulations. DREW: Thank you. PIPPIN: That’s awesome. BRAD: The millennium. DREW: The really, really cool thing about that, I think, is that probably 950 of those were docs commits. PIPPIN: Which is really, really awesome because the inline and developer docs are just not something that a lot of projects see, maybe people have varying levels of appreciation for. But I will tell you, personally, I absolutely love the docs, the work that you put into internal docs in WordPress core. DREW: Yeah. I think at last count I added or fixed something like 35,000 lines of documentation in core. In 1,000 commits, that’s what you get, a 1:3 ratio. BRAD: Just to be clear, we’re talking mainly about doc block comments, like above functions and that kind of thing, right? DREW: That’s right. BRAD: Okay. Cool. You’ve been going through and fixing a bunch of inconsistencies, I guess, and adding probably new documentation where it’s missing. DREW: Right. Initially, the reason I was originally granted guest committer status in the first place was because I was leading the effort to document all the hooks in core. BRAD: Right. DREW: That spanned the 3.7, 3.8, and 3.9 releases. When th"
