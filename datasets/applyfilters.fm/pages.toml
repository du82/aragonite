description = "Today we’re going to answer questions from listeners. We’re focusing on development today, and if we don’t get to your question, we will get to it soon, so go ahead and get in touch if..."
full_description = "January 31, 2017 Apply Filters Episode 75: Your Development Questions, Answered Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 42:09 Share Share Link Embed Download file | Play in new window | Duration: 42:09Today we’re going to answer questions from listeners. We’re focusing on development today, and if we don’t get to your question, we will get to it soon, so go ahead and get in touch if you have a question that you would like answered. We also apologize because our sponsorship form wasn’t working, but we’ve got it fixed now. If you’re interested in becoming a sponsor, please check out our Sponsorship page and fill out the form. Some of the highlights of the show include: How nonces are used: their fully defined used, how else they’re used, and where meta boxes fit in. We also discuss some of the security issues that nonces can help with. Steps for a PHP developer to take to become a WordPress plug-in developer. Advice on coding WP with PSR standards. A discussion of object-oriented programming versus procedural, particularly the benefits of OOP. The tools that we use regularly and what helped us level up as developers. The best practices for making your own plug-ins and codes. Links and Resources: WP API Libraries: https://wp-api-libraries.com https://github.com/wp-api-libraries/wp-api-libraries.com PSR standards If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Welcome back to Apply Filters, Episode 75. Today we’re going to answer a whole bunch of questions from listeners. We’re trying to focus on purely development questions today, so we’ll try to get through them all. If we don’t get to everything, then we’ll add on another episode here in a week or two with some more. Before for we do that, though, a quick housekeeping note. We found out last week that the topic submission form and also the sponsorship submission form on ApplyFilters.fm were not working. If you wanted to submit a sponsorship or if you wanted to submit a topic idea, please try again. Sorry about the hiccup. It’s all working now though. BRAD: Cool. PIPPIN: All right. Do you want to start us off with our first question? BRAD: Sure thing. Our first question is from Brian Wall. He says, “Hey, guys. Not sure if this qualifies as a whole episode topic, but I’m trying to understand nonces with some difficulty. I understand that wp_nonce_field creates a hidden field with a unique value inside a form that can be validated after the form is submitted. But when working with meta boxes, you also use nonces to remember which meta boxes are closed and their position. This seems like a big diversion from the intended purpose of nonces. Why are nonces used for this purpose? It doesn’t seem like a security use case. What is true, fully defined use of nonces? How else are nonces used?” PIPPIN: I like this question a lot. There is an error in the question, but it’s good because it points out some of the confusion around nonces. I think a lot of people struggle to understand how nonces are used and what they’re used for. I know it was a topic that took me a long time to really grasp. Nonces are used for security purposes. It stands for a number used once. It’s just a quick way to help validate a form. Now it’s not the only thing you should be using, but it’s one more thing that you can help to use. It also can help prevent resubmissions of forms. In terms of them being used for storing meta box positions, that’s what’s not actually correct. When you drag a meta box into a new area on a post edit screen or somewhere else, it fires off an AJAX request to the admin AJAX file and then stores that position. That request that gets fired does include a nonce, but the nonce itself is not actually used to save that position. The position and the state of it, either open or closed, is actually stored in user meta. There’s a user meta key called meta-box-order_ the post type. And so if you’re on a page post type, it’s going to save the order of all the meta boxes on that post type for you, so it’s user specific. Then if you’re on, say, a product post type, then it’s going to have another row in user meta with the other values. That nonce is just used to help validate that AJAX request. BRAD: Cool. What are some of the security vulnerabilities, I guess, that nonces protect us against? PIPPIN: One of them is making sure that you have a valid form submission. Let’s say that I have a form on the front end of a website, and I then have something that’s going to process the submission of that form. You can use nonces to help prevent spoofed submissions. For example, it’s a little bit harder to do a fake submission from, say, the command line or an API tool like Postman for a form that includes a nonce because, in order for that nonce check to pass, you have to generate a valid nonce. That means in order for me to spoof that request, I have to find a way to generate a valid nonce for that form and then include it with my request. Certainly doable in certain cases, but it is a little bit harder. BRAD: Right. PIPPIN: In some cases a lot harder. BRAD: I think it’s also used for certain links. Like if you click on a delete link, I think, in WordPress, I believe it also has a nonce on it because– PIPPIN: Yes, it does. BRAD: I think the reason for that is so that if someone tried to trick you into clicking on a delete link, they would need the nonce. They would need to generate a valid nonce for that link in order for it to actually delete something. PIPPIN: In that case, like WordPress or the plugin that’s processing that delete link is looking at the variables and the URL, the request variables. Let’s say that you have an action called delete. You could trick somebody to click on a URL that has action delete, post ID equals 57, to attempt to try to delete it. But that’s only going to succeed if you have a valid nonce on it. There’s actually a helper function in WordPress called WP Nonce URL specifically for attaching a nonce to a URL. BRAD: Right. Cool. I think that pretty much covers it. PIPPIN: All right. This comes from Praveen. This question was, “What would be a recommended roadmap for a PHP developer to become a WordPress plugin developer? What are the steps?” BRAD: Hmm. PIPPIN: Do you want to start us off with this one? BRAD: Sure. Yeah, that’s a tricky one. I think the best thing — the thing I would probably suggest is just to work on an open source plugin. Check out Easy Digital Downloads, for example. Maybe dig through some issues and try to fix a bug that’s outstanding. I think that would be a really good way to get into it. I think also another way would be to take a look at, like, for example, if you were interested in writing your first plugin. A good way to do it would be to get a plugin boilerplate. I believe there’s one from Tom McFarland that’s pretty popular. Use that because that plugin has kind of all of the best practices kind of baked into it already. And so it gives you that kind of proper framework to start from that a PHP developer may not be aware of. Right? I’ve seen some plugins that have been written by developers who are not WordPress, familiar with WordPress development, and they look kind of funny. I’m sure you’ve probably seen a few of those yourself, Pippin. PIPPIN: Oh, yeah. I think another thing that’s important is to think of WordPress as, I mean it is, a framework. Now it’s not necessarily a development framework, but it is an application framework, and so there are certain things, certain ways that you do things, built in internal APIs, et cetera. You want to try to become familiar with those. The biggest thing for writing plugins is you need to become familiar with the actual plugin’s API. A plugin’s API is an actual API within WordPress for building plugins. Really, what it refers to is the action and filters system within the system. If you want to start building plugins, the first thing you need to do, assuming you already know PHP, in my mind is you need to understand how action hooks and filter hooks work. From there, once you have that down, it’s pretty easy to go from there. BRAD: Yeah. The best way for me to learn, I find, is by doing something, like doing an exercise of some sort, because just reading, I find I can read a little bit, but then I have to do something with that information or it doesn’t stick. For me, reading a programming book, like if I read a Ruby on Rails book or something, that would do me almost no good. I would be much better off to try to stumble my way through building my first Rails app. I would learn so much more doing that than reading the book. The book is, for me, a complement. It’s something that I could refer to or go through and implement parts of it. Yeah, anyway. PIPPIN: I learn very much the same way. I have to learn by doing. Maybe some of it is muscle memory. It’s not exactly muscle memory, but it’s similar. I could read a tutorial on how to do something a thousand times and not really get it until I actually sit down and write it myself. BRAD: Yeah. Agreed. PIPPIN: Even if I’m literally copying and pasting the code. Well, maybe not copy and pasting, but actually writing every single character myself. Copy/pasting doesn’t actually help me learn. Copy/pasting, it to me is like reading it. But the moment that I actually hit all of the keystrokes to write it out, it kind of cements it in my brain. BRAD: Yeah. It’s like if you were setting up a new server and someone just gave you all the commands to put in the command line. You’re not actually learning anything. You’re just running commands. Yeah, you kind of have to understand what those commands are to understand what they’re doing. PIPPIN: All right. This next one comes from Brandon Hubbard. It’s actually more of a comment than a question, but it was something that I think is very worthwhile to share. He wrote, “I work for a small WP design agency and have a small team of developers. I notice that we work with a lot of third party APIs, and it felt like we were recreating the wheel on client projects. So I created an organization on GitHub to create PHP API libraries specifically built to be used for WordPress projects.” We will include a link in the show notes. “As APIs are constantly changing and being updated, I thought having dedicated libraries can be a way to improve standards and help developers stay up to date. I wanted to know what you would suggest as far as guidelines and rules for this project and getting other developers involved. I have a few generic guidelines written out in the GitHub read me. Also considering your teams have worked with third party APIs, if there was any code that can be contributed to this project.” WPAPIlibraries.com is where you can find it. I could see he did actually have a question in there as well. Brad, do you want to start off with trying to answer his question? BRAD: What was the question, like whether or not this is a good idea, I guess, basically? PIPPIN: No. How to get other developers involved, really. BRAD: Oh, okay. Okay. PIPPIN: He’s built this asset, this repository of libraries that they use over and over again. Basically, I think the goal of this is so that other people can use it and so they can become more of a common thing. BRAD: Yeah. PIPPIN: Number one, sharing the fact that they have resources available. And number two, how to get more people involved. BRAD: Yeah. I think first I want to comment on whether or not it’s a good idea because I feel like I like the idea in some ways, but in other ways I feel like the people that own the APIs themselves, it’s really their responsibility to have libraries available for those. Those are the people that are best positioned to keep those libraries up to date and make sure that they continue to work, right? And it’s in their best interest to do so if they want people to use those APIs. The problem, though, is that we end up with generic PHP libraries that have a bunch of stuff in them. For example, the Amazon Web services library. It includes Guzzle. WordPress doesn’t really use Guzzle, right? It has its own kind of HTTP request API thing. Basically, if you’re using that in a WordPress plugin, you’re adding additional libraries that are doing the same thing. I think what he’s saying here is that these are libraries specifically for WordPress that are designed to work really well with WordPress. PIPPIN: Mm-hmm. Here’s an example that he gives. Right now he’s got three, no four libraries. One of them is completed, production ready, one is in progress, and two of them are tagged as needing help. One of them is an extension of the IDX API. I believe IDX, I could be completely wrong, but I feel like is one of the main real estate servers. Is that wrong? BRAD: Oh, I have no idea. PIPPIN: That’s totally wrong, I think. Okay, well, there’s an IDX RESTful API. Honestly I don’t know what that is. It has a full API, and so then the IDX broker API that he’s provided here is basically an extension of that API designed for within a WordPress installation, perhaps to make it a little bit easier to use. BRAD: Right. I agree that I wish there were API libraries that were specifically made for WordPress and not just PHP. But I feel like this is a super ambitious project. PIPPIN: I think it’s super ambitious for sure. BRAD: Yeah. PIPPIN: If it can be well maintained and get some traction, I think there’s some good possibilities here. I have an example of an API that I have always kind of rewritten myself every time and having an official API library would be quite useful, or an official WordPress version of it. The main thing that I want to see in a WordPress API library is the usage of wp_remote_post, remote_get, remote_head, et cetera, because those methods are so much easier to use and understand than, say, straight up cURL requests. They’re much, much simpler. For example, since we do a lot with e-commerce, we work with things like the PayPal API, authorize.net, Stripe, et cetera. Now Stripe is an exception here because their API is wonderful. The PayPal API and the authorize.net API and some of the other merchant processors are a little bit trickier to set up. I have actually rewritten some of the API libraries numerous times to work with wp_remote_post and get. It would be really cool to see, say, like a wrapper to the PHP SDK with the WordPress helper functions for remote requests. That’s one example. BRAD: Yeah. I mean I’m 100% onboard with the idea of putting a library written up on GitHub and sharing it with the world and inviting people to collaborate on it and keep it up to date. I think that’s an awesome idea. I think the trouble he might run into is trying to build a massive repo of these libraries. That’s going to"
