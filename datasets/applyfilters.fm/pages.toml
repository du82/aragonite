title = "Episode 54: Carrie Dils on Genesis Theme Development - Apply Filters"
description = "Carrie Dills is our guest today. Carrie is currently doing web development with Crowd Favorite by day and dabbling in a variety of things tech by nite. She has been working around computers her whole life, and began freelancing straight out of college. About five years ago was introduced to WordPress and that was the beginning of her present story. She is currently a team lead and software developer at Crowd Favorite."
full_description = "February 4, 2016 Apply Filters Episode 54: Carrie Dils on Genesis Theme Development Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 29:34 Share Share Link Embed Download file | Play in new window | Duration: 29:34Welcome to today’s episode and we’d like to thank WPNinjas for supporting us all year and everything they’ve done to help us produce this podcast. We do have an open sponsorship available, check out the website for information on the opportunity. Carrie Dills is our guest today. Carrie is currently doing web development with Crowd Favorite by day and dabbling in a variety of things tech by nite. She has been working around computers her whole life, and began freelancing straight out of college. About five years ago was introduced to WordPress and that was the beginning of her present story. She is currently a team lead and software developer at Crowd Favorite. In today’s episode we’ll will talk about: The challenges of going from an independent contractor to working as part of an enterprise Work/life balance Carrie’s Utility Pro Theme Office Hours FM Podcast Courses offered by Carrie On Genesis… When Carrie’s being just Carrie she’ll head outdoors to bike or just take a walk. If she happens to land at a craft brewery in town, that would be okay too. A mystery-thriller is a great way to end her day. You can visit her at carriedils.com or you can find her hanging out at Twitter @cdils. Resources mentioned in this podcast: Utility Pro Office Hours FM lynda.com If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Hello, and welcome to Episode 54 of Apply Filters. This episode is sponsored by the WP Ninjas, the creators of Ninja Forms, Ninja Demo, and a few other plugins. They’ve been exceptionally gracious over the last year and sponsored countless episodes, so we want to thank them for all of the kindness that they’ve given us and help that they’ve provided to help us produce this podcast. Today is the last episode, for a while, that they’ll be sponsoring, so we do have an open sponsorship. If you’re interested, go ahead and get in touch with us from the sponsorship page. But, again, a most sincere thanks to the WP Ninjas for everything they’ve done to help us produce this podcast. All right, we’re going to go ahead and dive right in. Today, we have Carrie Dils with us. She is pretty well known throughout the WordPress community, so if you aren’t familiar with Carrie, you can find more information about her on her website and obviously today in this episode. Carrie, do you want to say hello? CARRIE: Hey, Pippin. How’re you doing? PIPPIN: I’m doing great. It’s awesome to have you on. CARRIE: Thanks for having me. PIPPIN: Well, Carrie, why don’t we go ahead and start by having you just give yourself a quick introduction, tell us briefly what you do, maybe where you work, and anything else you feel like throwing out. CARRIE: Oh, sure thing. Let’s see. I’m based out of Texas. I am presently doing Web development for a company called Crowd Favorite. We do a lot of enterprise level WordPress projects as well as some other tech, so that’s my day job. By night, I do lots of other things. I dabble in creating some of my own products and so forth. Anyways, CarrieDils.com is my website, but I’m usually always hanging out on Twitter @CDils if you want to say hello. PIPPIN: Fantastic. Crowd Favorite is just a small, little, tiny company. CARRIE: Just a little one. PIPPIN: Just little. I want to cover a few things. I want to hear more about your work at Crowd Favorite. I want to hear about some of your side projects and some of the other things that you do. Let’s start by diving into a little bit of your back story, maybe how you got into Web development, WordPress, or anything that kind of led up to it. What’s your history? CARRIE: I grew up around computers. My dad worked for a computer company, so always, from a very young age, I have been interested in computers and that sort of thing. Straight out of college, I began freelancing, just doing really simple, goofy websites and, like, front page, and stuff like that. That was, like, 20 years ago. Obviously technology has changed, thankfully, since then. I guess it was about five years ago, a fellow I was working with turned me onto WordPress, and it’s been downhill, in a good way, ever since. PIPPIN: Did you go to college for anything related to Web or computers? CARRIE: No. I am of an era where they didn’t offer those courses at college yet when I was in school, so my degree is in nothing relevant, not even computer science. Yeah, I just picked it up as a hobby. PIPPIN: Do you mind if I ask what your degree actually was? CARRIE: Criminal justice. PIPPIN: Very cool. Totally different. CARRIE: Yeah, I call it a degree in nothing useful. It was very, very interesting to study, but is nothing professionally. PIPPIN: Sure. When you first got into WordPress, what was kind of your path into it? Was it you learned about it and you started building it or using it for your own website? Did you start building client sites on it? How did you get from the introduction of WordPress to what you do now? CARRIE: Yeah. At that time, I had a client that had been a long-time client, but they were looking at a website redo. Originally for them, I had just done a hand crafted CMS that was pretty crappy. If I would have looked at it now, I would cringe. When I found out about WordPress, that was really a perfect fit for this client, so I immediately kind of had a project to go to town on and just kind of learning as I went. Most of the work was on the front-end side. Initially, it’s just kind of figuring out how WordPress works, how the data is structured. Even just in the admin area, getting around and getting familiar with the lingo. Yeah, just sort of getting my feet wet. Then, yeah, like I said, mostly on that front-end side, so theme development, not really delving much, not at all custom plugins at that point in time. It was just like iPhone apps. There’s a plugin for that, so just used a lot of other people’s code. PIPPIN: Cool. That sounds like a pretty familiar experience for a lot of people, myself included. All right, so you now work at Crowd Favorite, and what’s your position there? What’s your day-to-day work? What’s that kind of look like at Crowd Favorite? CARRIE: Sure. I’m not super big on titles, but they do provide some context. I’m a team lead/software developer. I lead a team of three developers who are actually all incredibly more talented developers than I am, but my role is to sort of sit between them and Chris Lema, who is our CTO, and work across multiple projects where sometimes my team is working as a unit and sometimes my team is disbursed over other projects and dabbling with other teams. Really, it is a lot of communication and a lot of coding. I’d say it’s probably about 50% of each. PIPPIN: And do you think that you do more development now at Crowd Favorite or when you were working independently? CARRIE: I would say I’m probably doing less now, but what I am doing is much more interesting than what I was doing independently. I’d kind of gotten in a rut where I was doing basic $5,000 to $10,000 client projects, and it was just sort of the same thing over and over just making some theme tweaks, throwing in a few custom post types and templates and that kind of stuff. They were all very vanilla projects, and I have no complaints because that paid my bills, but I was sort of getting bored with that. Moving into Crowd Favorite and getting the chance to work on much larger scale projects, what’s come with that is just exposure to new tools, new ways of doing things, and just a lot of learning that’s been really fun. PIPPIN: That’s awesome. What do you think are some of the challenges of transitioning from an independent contractor working, I believe, primarily with yourself, not with additional subcontractors? What are some of the challenges going from that to an enterprise company? Most of Crowd Favorite’s work is all in the enterprise. What’s some of the transitional pains that have come with that? CARRIE: Sure. Well, one of the biggest ones was just administrative, and that is tracking my time. I’d gotten pretty lax about that as a freelancer, and I did project-based billing, not hourly stuff. And so, going to work for Crowd Favorite, I’m accountable for every bit of my time because it’s billed against either a certain project, an internal cost, or whatever, so just getting in the habit of keeping track of my time and knowing where it’s going. But I have to say it’s actually been a really good habit. It wouldn’t have hurt me as an independent to know how much time it was actually taking me to do stuff. That was one kind of hurdle to overcome. Then the other one on the technical side is using Git in a collaborative manner. Before Crowd Favorite, most of my work in Git had not been with other developers, so if I completely do things wrong or just have a really, really messy commit history, it doesn’t matter because it’s just me. PIPPIN: Right. Suddenly your Git workflow matters a lot more. CARRIE: Yes, it matters a lot more, and the etiquette. That’s been a little bit of a learning curve, but again a good one. PIPPIN: Now, you mentioned that you work with or you run a team of three other people, and I would assume that there are numerous teams inside of Crowd Favorite. Is the majority of everybody remote, or is there a centralized office where everybody works from and then a few remote people? I believe you work remotely, don’t you? CARRIE: I do. Yeah, that’s a great question. Crowd Favorite has, I believe, five or six offices worldwide and headquartered out of Denver. I know there are a handful of people that work in that Denver office. I think our Phoenix office probably has the most staff present on any given day. But, the majority of folks are remote and located all over the globe. PIPPIN: I really like your comment on how time tracking was both an adjustment, both a little bit of a pain point, but also a good thing. Do you think that by doing that, and by working in this maybe a little bit more controlled or structured environment, that it has made you better at managing your own time, not just in terms of when you’re working on projects or not working on projects, but also when you’re not at work, like when you’re done for the evening or you’re taking a day off or on the weekends? Do you find that there’s a better separation between work and non-work time? I know that as independent contractors, that is something that most of us struggle with, especially if we work from a home office. Do you think that that kind of structured environment improves that? CARRIE: I wish it did. I’ll tell you my setup. I have two Mac books. One is my company machine and the other is my personal machine. I have one Thunderbolt display. Most of the day, I’ve got my work laptop plugged into the Thunderbolt display. When I’m done with that, I kind of tease. I talk to my dogs. They’re the only ones around to listen to me, but that I’m going to my next job. I plug in my other laptop and start working off of that one. I don’t know that that separation is quite there. I still have a ways to go on a great work/life balance. PIPPIN: Sure. That’s largely because you’re still working on some of those side projects, which actually I think is something I’d like to get into. You have several other things that you do outside of Crowd Favorite, and I believe these are all things that you did before Crowd Favorite as well. Let’s start with: you have a theme called Utility Pro that you sell. I believe that is a Genesis Theme, correct? CARRIE: It is. Yep. PIPPIN: Awesome. CARRIE: I released the initial version of Utility a couple years back. Then I completely overhauled it and relaunched it as Utility Pro. I’ve been doing active development on that, and that’s been a really fun project. PIPPIN: What is the main selling point or purpose behind Utility Pro, aside from just another theme? Is there a specific focus for it? Is it meant to be a base theme? CARRIE: Yeah. PIPPIN: Give me your quick sales spiel on Utility Pro. CARRIE: Well, I named it Utility because it is a utilitarian theme, so it’s not specific to any niche. The key selling point or one of the things I’m most proud about is the fact that it’s fully accessible and meets the WCAG 2.0 accessibility standards, which, at the time I released it, it was the first premium Genesis Theme on the market that met that standard. PIPPIN: That’s fantastic. I don’t think there are actually very many themes at all that can claim that. If we look at the number of themes out there versus the number that can make that claim, it’s a very small number, for sure. CARRIE: It is a small number. Encouragingly, though, like the amount of free themes in the WordPress repo that meet that standard have increased. I think here were, like, seven as of three years ago. I don’t know what the exact count is now, but it’s exponential. PIPPIN: Excellent. CARRIE: Exponential – it’s 90 themes, but still. PIPPIN: Still significantly more. CARRIE: Yes. Then the other thing about Utility Pro, while you can just install it, use it out of the box, I was really hoping for it to be kind of a playground for developers. I sell a developer version of the theme that’s based of SaaS and Grunt. I’m about to release or add in Composer support in this next iteration, but really wanted it to be a way for people to stop reinventing, either stop reinventing the wheel with every project, so find a base theme and really settle into it and, number two, stop working on a bajillion different themes. A lot of people, I think, especially in the Genesis space, because there are so many really nice looking themes to choose from, every project is a different theme, and it’s not very efficient. Like with Utility Pro, I encourage anyone that buys that developer edition to go through, strip out the stuff you don’t want, add in the stuff you do that makes your workflow and your life easier. Yeah, I have it showcased over on the site, and it’s really fun to see how people have used it. PIPPIN: That’s excellent. I see that you offer a setup service for the theme as well, which is an add-on to the store. Do you find that that’s something that people take you up on that is a nice service that people really enjoy or anything else about it? CARRIE: That’s pretty much useless, and I should remove it from the website. PIPPIN: Okay. Why? CARRIE: It seemed to be par for the course. You look around at what other people are doing and you see, okay, well other people are offering these setup services. I don’t think anybody has ever bought one of the basic site setups. Truthfully, the cu"
