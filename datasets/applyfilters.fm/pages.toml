title = "Episode 60: Solving the Problem of Database Merging - Apply Filters"
description = "Update 2016-08-16: “Data Hawk” referenced in this cast has been renamed to Mergebot. Check out the latest news about Mergebot We would like to thank Gravity Flow for sponsoring today’s podcast. Gravity Flow allows sites to automate business..."
full_description = "May 4, 2016 Apply Filters Episode 60: Solving the Problem of Database Merging Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 40:28 Share Share Link Embed Download file | Play in new window | Duration: 40:28Update 2016-08-16: “Data Hawk” referenced in this cast has been renamed to Mergebot. Check out the latest news about Mergebot We would like to thank Gravity Flow for sponsoring today’s podcast. Gravity Flow allows sites to automate business processes for internal routing, scheduling, reporting and more. You can go to GravityFlow.io to learn more. Today, we are talking about what’s been going on with Brad and Pippin and hearing about a problem (and a potential solution!) commonly experienced by those who are merging databases. Brad’s Update: During the last episode, Brad had said that he expected Migrate Pro 1.6 to release by the time the podcast went out, but listeners who were looking for it might have realized that it released a bit late. There was a bug that they had to work through, and it ended up going out on April 25. The good news is that they’ve gotten lots of great feedback, and Brad is happy to announce that renewals have spiked. In other news, Brad is working on the next version of WP Offload S3, which will be a big change to the way they store URLs in the content of the site. In addition, they’re reorganizing the site’s theme and are in the process of hiring another developer. They have a new developer on trial right now. Pippin’s Update: Pippin recently went to San Diego for work and had a great time. The convention was held in a great location in an awesome venue, and there was a good attendee list. His Q&A session was called “Ask Me Anything About Plugins,” and he had a lot of people asking questions about plugin development as well as business development. In all, it was a great time to meet some developers and catch up with team members that he doesn’t see often. Pippin also announced that AffiliateWP 1.8 is being launched next week, and that Content Pro 2.5 shipped the morning that the podcast was being recorded. In addition, Pippin updated to Zapier, which is a great program for those needing to connect apps and automate tasks. On today’s podcast, you’ll also hear about: Brad’s follow-up on last week’s episode about the full-screen UIs. There are several plugins available to take over the whole dashboard of WordPress. They include Coming Soon Pro and Kanban for WordPress. Brad’s explanation of why database mergers can turn into a big headache, particularly with ecommerce systems. An overview of how people generally keep track of the changes that they’re making during these mergers, and why they tend not to work very well. A new solution that Brad is working on! It’s called Mergebot, and it will save the changes that are made to a WP site in a cloud app, which you can later apply to your live site. Pippin’s technicals questions (and Brad’s answers) about Mergebot. An announcement that people who sign up for Mergebot will get a license for Migrate DB Pro, and another announcement that they are going to need Beta testers, so if you are interested, go sign up at Mergebot.com. Links and Resources: Coming Soon Pro Kanban for WP Zapier Mergebot Brad on Twitter Email Brad About Mergebot If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Welcome back to Apply Filters, Episode 60. Today, Brad and I are going to go over some of our recent updates. But then, more importantly, we want to talk about the problem of database merging. We’re going to cover that in depth. First– BRAD: This episode is sponsored by Gravity Flow, an advanced add-on for Gravity Forms that allows you to automate your business processes, whether you need to set up workflows for purchase orders, job applications, admission forms, project initiations, vacation requests, or any other kind of workflow that involves advanced feedback loops, approvals, or anything like that. Gravity Flow allows you to do this easily by leveraging the power of Gravity Forms. You can find out more at GravityFlow.io. Once again, thanks very much for sponsoring this episode. PIPPIN: Thank you, for sure. All right, Brad. Do you want to start us off by telling us a little bit about what you guys have been up to in the last couple of weeks? BRAD: Yes. Well, in the last episode I mentioned that Migrate DB Pro 1.6 would be released when that episode was published, but it actually wasn’t because we ran into a kind of last minute bug. It was a scaling bug, so when you would try to migrate with, let’s say, 10,000+ media files, so if you had 10,000-attachments-plus in your media library. If you tried to migrate a site with that many attachments, it would add them all to the DOM and your browser would start to get either really slow or crash depending on how powerful your laptop is. That was a problem, so we had to– PIPPIN: Just a minor problem. BRAD: Yeah. Yeah, so we had to not add all of the attachments. We’re talking just about adding list items, just the file name to the UI, but 10,000 file names. Yeah, we stopped doing that. Now I think we add, like, 100 and then we just have a note at the bottom that the rest are hidden. That’s done, and we ended up releasing that version on April 25th instead. PIPPIN: I’ve got to say the new UI is pretty. BRAD: Awesome, yeah. PIPPIN: Yeah, the progress bars, the way that it shows the progress for each individual table, I’ve got to say I wish that I had a reason to use it right now because I want to play with it. BRAD: Yeah. We’ve gotten lots of great feedback on it. Interestingly enough, our renewals have spiked because of it. I looked at last year’s major release, version 1.5, and there was no spike in renewals. PIPPIN: Interesting. BRAD: I think people like the shiny new. PIPPIN: People like pretty things. BRAD: Yeah, exactly. We’re going to try to do that in future versions more often. This is the first kind of UI update since we launched three years ago, so we’re going to try to do some UI refreshes. PIPPIN: A bit crazy that it’s been three years. BRAD: Yeah, I know. Right? It’s crazy. What else? We’ve been working on the next version of WP Offload S3. That version is going to be a big change to the way we store URLs in the content. Right now, when you insert an image, for example, into content, it adds the S3 or CloudFront or CDN URL in there. Then say you uninstalled our plugin. Well, those URLs would still be in there, so you’d have URLs to S3, CloudFront, or wherever. What we’ve decided, and we were kind of inspired by the responsive images addition to WordPress and the way they filter the content to add the SRC set stuff. We were inspired by that and just decided: Why don’t we do that; why don’t we just filter the content and replace the URLs when the page generated rather than insert them directly into the content? That’s going to be a big change. PIPPIN: That means you were doing it all on the fly, as opposed to you weren’t previously? BRAD: Exactly. Exactly, so we’re going to be replacing the URLs on the fly rather than inserting– PIPPIN: Now, does that mean that you’re only replacing the URLs, or you’re also handling the transmission of the file to S3? BRAD: Oh, yeah. We’re doing both, for sure. PIPPIN: Well, but the transmission to S3, is that when the image is first uploaded, or when the image is rendered on the page? BRAD: It’s when it’s first uploaded, so when you drag and drop a file into WordPress, when it uploads to your server and then uploads it to S3, like right after. That’s how that works. It’s kind of like a little relay. I guess the reason we’re doing this is because, when you change a setting, like one of the settings, maybe you changed the URL structure or something, it has to do a find and replace in the background. It just takes forever to do that. But, with doing this on the fly, you change that setting; it’s instant. Any else that’s generated on the fly, it’ll be the new setting. The thing we ran into just recently is caching. There’s actually a really expensive query that we have to run, so you can imagine when you’re doing this on the fly, so you’re going through the content. You’re identifying a local URL that is referencing an image. Then you have to search for that image path in the database. We’re hitting the post meta table searching for that string, that kind of the file path string. Well, you know, Pippin, that querying full text on the post meta table is bad news, right? PIPPIN: What do you mean? It’s like the fastest query there is. BRAD: Right. PIPPIN: Yeah, no. No, bad news for sure. BRAD: Yeah, so what we decided is to cache that. This week, we kind of reassessed it. We were going to cache all the URLs and, like, what S3 URL that it maps to. But then we decide, oh, but then we have to purge that cache whenever the settings are updated and it gets real messy. So we decided just to cache it kind of at the lower level where the select is happening to define the ID for that because the chances that the ID is going to change is almost nil, right? PIPPIN: Right. BRAD: And we’re not caching it in a typical sense. We’re not using the WordPress object cache. We’re just going to cache it in, I believe, a transient. No, that’s not true. That was one of the ideas, but what we decided is to attach a cache meta, just a piece of meta data, to the post itself, so we can just look that up and we can find the URL in that cache array. It should be pretty performant and just avoid having to run those queries more than once – ever. That’s kind of one of the things we’ve been working on. PIPPIN: Great. BRAD: What else? We’ve been reorganizing our site’s theme. The theme has kind of just been thrown together. When we first launched, we were in startup mode, so we were just like “blah,” you know. It wasn’t pretty. We’ve refined it over time, but there was just a ton of logic code in the theme itself. PIPPIN: This sounds very familiar. BRAD: Yeah. Yeah, I mean you always neglect– PIPPIN: I’m sure a lot of other people can relate to this as well. BRAD: Yeah, well, I mean it’s not — your site is not something you release, so you can neglect it. You can do as many hacks as you want. No one will ever see them besides you and your team, so it tends to be the biggest patchwork of things. PIPPIN: Absolutely. BRAD: Yeah. PIPPIN: We just recently did the exact same thing. We launched a new version of the EDD site about a month ago now. Part of that project was scrapping everything and starting from scratch to get everything organized, get our CSS in order, et cetera. That was a big project. BRAD: Yeah. Yeah, it’s not too bad. It hasn’t been too bad so far. What we decided to do — well, first of all, one of the goals with the redesign is to be able to roll back to the old design instantly if we are having trouble with the new theme for some reason. The idea is to create two themes. But, to do that, we don’t want to duplicate all the code that’s running the theme. We thought about moving it to a plugin, but that’s a little dangerous because plugins can be deactivated, intentionally or unintentionally. What we decided is move it to an MU plugin, which they can’t be deactivated. That’s what we’re going to do. We’re going to have most of our code in an MU plugin, and then we’ll have two themes that use that code. It seems to be the right way forward, but time will tell. We’re hiring another developer. That’s the other thing we’re doing. We actually have someone on trial right now. PIPPIN: Very cool. BRAD: Yeah. PIPPIN: You’re hiring almost constantly, it seems. BRAD: Yeah. It takes us a long time to hire someone, though, so it’s kind of an illusion. PIPPIN: True. Yeah, so even if you’re hiring this week, and you’re hiring in three weeks, it doesn’t mean that you added a new person between those times. BRAD: Exactly. It means that we’re still looking. PIPPIN: Yep. BRAD: Yeah. What about you? What have you been up to? PIPPIN: Last week, I was in San Diego for WordCamp San Diego. That was this last weekend, and that was a great time. The organizers there did a tremendous job, the same as last year. It’s a great location, awesome venue, really good selection of speakers and really good attendee list, so that was a good time. I was able to spend a few extra days out there. One of my team is out there, as well as several teams that we’ve done some work with–third party developers–and so it was nice to go out and get some face-to-face time with them. BRAD: Right. Were you one of the speakers? PIPPIN: Yes, I did a session on “Ask me anything about plugins,” so it was kind of an open QA session where I gave a quick background and told a little bit about what I do, what I’ve worked on, and then opened it up for any questions about anything related to plugins from the audience. BRAD: That’s cool. PIPPIN: It was a lot of fun. BRAD: Did you have some questions primed to get things rolling? I found that, in the past, QA sessions, sometimes you open up the floor and it’s just like crickets, you know? PIPPIN: Absolutely. I talked to the organizers and said, “Hey, I want to prepare for this and make sure that if we get crickets, let’s make sure that there’s somebody there to ask some questions,” and so I had a few people that I knew were in the audience prepared to ask something if no one piped up. But, we actually didn’t have any trouble at all getting questions. We had questions immediately, and we probably could have gone significantly over our time slot. BRAD: Were they mostly about development or business? What were they? PIPPIN: There were development questions, there were business questions, and there were user questions. BRAD: Right. PIPPIN: So, we had a nice range of everything. BRAD: Right. Did you feel you got more of one than the others? PIPPIN: Maybe more business questions related to my own experience, my personal history with plugin developments and people asking about some of that history or how we got from A to B. Business development questions, really, those were probably, I think, the most common. Beyond that, we are just about done with Affiliate WP 1.8, which is an update we’ve been working on for quite some time now. It’s getting close to being done, and we’re hoping for a release next week. Restrict Content Pro got version 2.5.3 shipped this morning. That fixed a slew of both minor and important bugs. There were a couple important bugs related to proration and multiple subscription levels, erroneous multiple subscription levels. For example, somebody could subscribe, and their previous subscription was supposed to be cancelled in the merchant processor, but it was left active, so then they have one subscription on the site, but they have two in the merchant account – a couple"
