title = "Episode 73: MergeBot and WordCamp US Updates - Apply Filters"
description = "Today’s episode is sponsored by Post Status. It’s a great resource for news, updates, and other things happening in the WordPress ecosystem. You can subscribe to the site to get additional resources, like interviews, podcasts,..."
full_description = "December 27, 2016 Apply Filters Episode 73: MergeBot and WordCamp US Updates Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 55:33 Share Share Link Embed Download file | Play in new window | Duration: 55:33Today’s episode is sponsored by Post Status. It’s a great resource for news, updates, and other things happening in the WordPress ecosystem. You can subscribe to the site to get additional resources, like interviews, podcasts, posts, and even a Slack channel where you can talk to others about all types of topics. Members also get an email that is perfect for busy people who want to see the most important information and astute observations. Go check it out at poststatus.com. Some of the topics you’ll hear about today include: Brad’s trip to Scotland to meet up with the UK contingent of the Delicious Brains team. He got to go to a local WordPress meetup in Edinburgh. Brad’s updates: Feedback on the beta version of Mergebot has been good, but the public launch is still a ways off. Also, Brad attended contributor day at WordCamp US and started hacking away at a plug-in to relegate image resizing to a background process. Pippin’s updates: They’re hoping to launch a few updates next month. There have been some nuances in the way that category-level restrictions and redirects work in Restrict Content Pro that will be changed in the 2.7 update, for example. They’ve also released Zapier for AffiliateWP, and Brad and Pippin discuss Zapier’s uses. EDD 2.7 will also hopefully be released in January. Announcements that came out at WordCamp US: One of the most important was that WP is not doing scheduled releases anymore. Instead of updates being released every three months, there will not be any more set dates for major version updates. Brad and Pippin discuss some concerns about the Calypso dashboard. Links and Resources: Mergebot WordCamp US 2016 Image resizing plug-in Zapier Calypso If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Welcome back to Episode 73. This time Brad and I are going to go over some updates and then talk a little bit about some things that were announced at WordCamp US last month in Philadelphia, or actually earlier this month in Philadelphia. But first– This episode is sponsored by Post Status. Post Status is a project by Brian Krogsgard and is a resource for news, updates, and other things happening in the WordPress ecosystem. It is a wonderful website to kind of pay attention to what’s going on. Brian also has a members’ only section where you can subscribe to the site and get access to special resources that include video interviews, additional podcasts, blog posts, as well as a Slack channel where you can jump in and talk with other members of the Post Status community on everything from development to e-commerce to life and health and many, many other subjects. It’s one of my favorite resources for WordPress news, updates, and conversations. Brad, I believe you’re also a member, aren’t you? BRAD: I am. I am a member, and I love Post Status. I love the emails that Brian sends out to club members so that we can get — it basically just condenses all the news down to, like, little bite sized pieces that you can consume quickly, and so it just saves you from having to kind of troll through all of the WordPress news sites and figure out and separate kind of the noise from the signals. PIPPIN: Yeah, when time is a premium, which it always is, those summaries are awesome. BRAD: Yeah. It’s good to get his, like, viewpoint on things too. I really appreciate that. PIPPIN: Yeah. Brian has been around for a long time, so he’s got some pretty astute observations and pays really close attention to what’s going on. One thing I did want to mention real quick is that Brian just posted an interview that he did with Matt Mullenweg shortly after WordCamp US and talked a little bit about a new WordPress development cycle, the WordPress Rest API and more. Go check out PostStatus.com and give Brian some love. Alrighty. Mr. Brad, what have you been up to in the last couple of weeks? BRAD: Well, I think we haven’t done updates for, like, four or five weeks, actually. Quite a bit has happened for me. I’ve been to Scotland for the first time to meet up with the U.K. contingent of the Delicious Brains team, and we tried to do– PIPPIN: How many team members do you have over there? BRAD: We’ve got four, four guys that live in the U.K. Yeah, we met up. None of them are from Edinburgh, so we all met up in Edinburgh, and there was a WordPress meet up one of the evenings that we were there, so we went to that. It was cool to kind of meet the local WordPress community in Edinburgh, so that was pretty neat. Then, I mean, there’s castles all over the place and experiencing the culture and everything, yeah, it was a nice trip. PIPPIN: How long were you guys there? BRAD: Four days, I think, four or five days. Yeah, it was awful, though, the flights. I had three flights it took me to get there, and if I could fly direct, it would have been like a five-hour flight. On the way home it took me 23 hours to get home. PIPPIN: Because normally that would only be, like, a ten-hour flight across the Atlantic, I would think. BRAD: Oh, like a five-hour flight, I think. PIPPIN: Wow! BRAD: I think…. PIPPIN: What route did you take to get there? BRAD: I had to fly — normally it would be like Halifax. Like a Halifax to London flight would be like five hours. But this was Halifax to Boston, Boston to Dublin, Dublin to Edinburgh. With all the layovers and everything else, it was, yeah, it was ridiculous. On the way home– PIPPIN: That’s intense. BRAD: Yeah. It was worth it in the end, but it was a process. And then I attended WordCamp US just a couple weeks ago. You were there, other people were there, and so that was cool. Oh, and my team was there, so the North– PIPPIN: I thought you had either your whole team or most of your team there. BRAD: Yeah. Yeah, the North American contingent of my team, so two Canadians and two from the U.S. We all met up in Philadelphia and ate some food, hung out, went to WordCamp US, and all that stuff, so it was pretty cool. PIPPIN: It was a really, really great event. BRAD: Yeah. PIPPIN: I think it was probably better than last year, and last year’s was really good too. BRAD: Yeah. I enjoyed it more last year. I think it’s because I didn’t stay up so late or something because I was just so exhausted, like, after the first day and I just didn’t recover. And so this year it was tougher for me. PIPPIN: Yeah, see, I did the opposite. Last year I was– BRAD: Right. PIPPIN: –super late every night, and this year at 10:30, nope, I’m out, folks. BRAD: Right. I remember that because you guys had — wasn’t it called the Post Status House? You were staying with– PIPPIN: Last year, yeah, we had the Post Status House. BRAD: Yeah, the Post Status/EDD House. You and Krogsgard had a house. Wasn’t Strebel staying there too? PIPPIN: Yeah, I think there was about 20 of us there. We technically had three floors of this house that had been turned into apartments, so we had three different apartments, each one with like five to eight people in it. BRAD: Right. Right, so you guys– PIPPIN: It was a lot of fun. BRAD: Yeah. PIPPIN: But it also just meant that we had a lot of late nights. BRAD: Right. Yeah. Cool. What else happened? Mergebot launched beta on– PIPPIN: I’ve been seeing your emails coming through. BRAD: Yeah. PIPPIN: And it looks like you’re adding a lot of new beta testers to it, aren’t you? BRAD: Yeah, we’re up to 110, about, beta testers right now, which is excellent. We’re getting lots of feedback coming in. The good news about the feedback too is that the majority of the feedback is stuff that we’re already working on that’s kind of at the top of our priority list, so we have to knock those things off to kind of see what’s next, what are the other issues people want to see resolved next. That’s kind of how betas go, right? PIPPIN: I find that betas are a lot of times hit or miss because sometimes you release a beta and you don’t get any feedback. BRAD: Right. PIPPIN: Maybe one or two. How has it been for you so far with this one? Are you getting a lot of genuine feedback? BRAD: I wouldn’t say we’re getting– PIPPIN: Are you getting bug reports? BRAD: I wouldn’t say we’re getting a lot. We’re getting a trickle, I would say. But the feedback that we are getting has been good so far. What I’m anticipating is, once the first month rolls around and subscriptions start renewing, I suspect people to either cancel their subscription or ask for a refund because they’re not using it. Then we can start to have those conversations or at least I’ll have more conversations at that point about, like, why are they canceling, what would they like to see. PIPPIN: Are you able to see, of those beta testers, what percentage of them are actually testing it and using it? Because you have this set up as a service, so do you have those kind of activity logs and such? BRAD: We do, but it’s pretty raw. We don’t have nice reports that I can run. I pretty much just ask the guys, you know, is this person active? Give me a list of people that are active. They would have to run their own kind of custom query to figure out what users are active, which users are inactive, and stuff like that. It’s pretty raw at this point. It would be nice to have reports that show that, but I mean, you know, priorities, right? I think what I’m going to do is start reaching out to customers in the new year that are using it and those that aren’t using it just to nudge them to see. Maybe they’re stuck. Maybe I need to help them get unstuck, right? Just reaching out, I think, will help a lot with that. PIPPIN: Of those 110 beta users, are those users all signed up for a subscription, so are they going to automatically convert into paid subscribers after the beta period is done? BRAD: Oh– PIPPIN: Or are they free accounts or anything like that? BRAD: The beta is actually not free. PIPPIN: Ah! BRAD: We are actually charging $9 a month right now for the beta. That’s why I was saying, like, when people cancel after a month then I’ll know. Maybe they cancel because they weren’t getting enough value out of it. Maybe they weren’t using it. Why weren’t they using it? I can have those conversations when they stop paying, right? Yeah, that’s why. That’s the main reason I decided to charge. I mean $9 a month is — I kind of regret not charging more, a more realistic figure. PIPPIN: Sure, but it’s still going to let you get rid of some of the fluff in the beta users. Anybody who signs up for a beta, whether they actually go through with it or not, at least have the intention of utilizing it because otherwise they wouldn’t pay for it. BRAD: Yeah. I guess my concern with charging the small amount is that some people might just keep paying it just to keep the grandfathering because I’ve promised all the beta users that get in at $9 a month that they keep that plan at $9 a month. They’re not going to be subject to price increases in the future as kind of a thank you for helping us out early on, right? They might just hold onto it for the whole year because it’s not very much money in the grand scheme of things just to hold onto that grandfathering. But anyway, we’ll see what happens. It’s a good experiment nonetheless. PIPPIN: Okay. Now you’re, what, three weeks into the beta period? Do you have a realistic public launch in mind yet? BRAD: No, not yet. I think we’re a ways off from that yet with some pretty hefty issues. But we don’t know. We feel they’re hefty issues, but we need people to tell us that they’re hefty issues, right? That’s going to determine when launch can be, right? If people tell us, “Okay, this is a problem,” that we didn’t even think was a big problem for people, we might have to tackle that before launch. Right now we just don’t have a good feel of what people need in the app, right? PIPPIN: From the beta period, do you have anybody who is giving you either small or large success stories? Or is it too early to say? BRAD: It’s a little early. PIPPIN: You’re still only three weeks in. BRAD: Yeah, it’s pretty early to tell. It’s funny. I was talking to people at WordCamp US. We had launched the beta on Tuesday, and some people had left for WordCamp US on Tuesday or Wednesday, so no one — people told me they had an invite, that they got in or had a subscription, but they hadn’t used it yet. It was a little frustrating. I was like, “Oh, I wish we had launched the beta a week earlier because I could have these one-on-one conversations with people about Mergebot after they’ve used it for a week or so.” Hindsight, 20/20, right? PIPPIN: Sure. Well, it sounds like things are progressing pretty nicely with it. BRAD: Yeah. PIPPIN: I’m excited for you. It’s going to be a cool product when it comes out. BRAD: Yeah. One of the issues that has come up actually kind of involves EDD a little bit. PIPPIN: Ah! I’m sorry– BRAD: No, no. It involves pretty much every plugin, but it’s interesting how it involves EDD. When EDD installs, doesn’t it go through all the users and adds something, a capability or something? PIPPIN: We do add a couple of capabilities to the site, but it doesn’t go through all the users. BRAD: It doesn’t go through all the users. PIPPIN: It’ll go through. We have a couple of user roles. For example, we have a shop manager role that we create. We have a shop administrator. We have a shop worker. We have a shop accountant. And so these various roles are basically given to user roles with certain capabilities so that they can edit products, edit other people’s products, edit store settings, view reports, et cetera. BRAD: Does it go through certain users and assign them those capabilities? PIPPIN: It will go through. It’ll assign it to administrators. That’s the only– BRAD: Right. PIPPIN: –default role that gets edited. BRAD: Right. Okay. When it installs, it runs that routine that queries for all administrative users and adds that capability. PIPPIN: Well, technically it doesn’t add it to the users. It adds it to the role, but which in turn adds it to the users. BRAD: Yeah, okay. Whatever. But right, so what happens, though, is let’s say you’re running Mergebot and you install EDD locally and it does that. Well, let’s say on the live site some new users get added, right? On the local site, Mergebot is going to record those changes that happen that EDD makes. It’s going to record those capabilities that get added to those users. But if any new users get added to the live site between when you recorded and when you deploy, those new users won’t end up with the capability because Mergebot only knows about the ones that were recorded locall"
