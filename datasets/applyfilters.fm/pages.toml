full_description = "March 28, 2017 Apply Filters Episode 78: Payment Gateways, Tax Season, and Other Listener Questions Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 37:22 Share Share Link Embed Download file | Play in new window | Duration: 37:22Today’s episode is sponsored by Pagely, the original gangsters of WordPress hosting. They’ve been around for a long time, but they’ve gone from humble beginnings to hosting huge brands. They’ve been able to figure out who their customers are and why they come to them. If you have scaling, security, or other “unsolvable” challenges, you can count on this solution-finding company. Go check them out at Pagely.com. Today we will be dipping into our mailbag to answer questions. We’ll be doing this again, so if you have a question that hasn’t been answered, be sure to send it in! Some of the highlights of the show include: The best way to set up recurring payments, with or without a plug-in or an affiliate program. What OS to go with when building custom routes in the REST API for a mobile app. Suggestions on the best process for entrepreneurs to prep for taxes, including tips on how to keep all of your paperwork under control, preferably with the help of a bookkeeper. How to track the users of the plugins, how they’re using it, what features they’re taking advantage of, and so on. A payment gateway in addition to Stripe and PayPal. Information about the update API for plugins, and how to hijack the update process. Tips on project management: tools, validation, features, etc. Links and Resources: Pagely WooCommerce Paid Memberships Pro Easy Digital Downloads WP Affiliate Platform WP Offload S3 Recurly Google Wallet Amazon Pay Moneris Freemius Slack Trello GitHub If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. BRAD: Welcome to Episode 78. This time Pippin and I will be digging into our mailbag and answering people’s questions. But first– –This episode is sponsored by Pagely, undoubtedly the original gangsters of managed WordPress hosting. They’ve been around for a long time, but man have they evolved over the last few years. From humble beginnings to now hosting huge brands like Disney, Visa, Comcast, ebay. I could go on. They’ve also figured out who their customers are. They realized that people come to them with complex scaling, deployment, and security challenges, challenges deemed unsolvable by other providers. And so they made that their niche. That’s what they do. They provide solutions to these challenges. Over the years their technology has seen big improvements as well. One of the biggest changes they ever made was moving all of their hosting onto Amazon Web services, and it has paid off big time for them. In fact, there was an S3 outage just recently, and they were able to stay operational. There was even a tweet I remember from Scott Bollinger. I looked it up and it reads, “Impressed that while AWS is down, my @Pagely site with AWS infrastructure is still up. Redundancy ftw” (for the win). So if you have a big scaling problem, a big hosting scaling problem, you should definitely get in touch with the great folks over at Pagely. They’d be more than happy to chat with you and find a solution to your scaling problem. Also, check out Pagely.com for more details about their services and contact details. PIPPIN: All right, so we’ve got a number of questions today. We’re just going to go down the list. If we get through all of them, awesome. If we don’t then we will keep cataloging them for future episodes. This first one comes from Bharat Mandava. And I’ll apologize ahead of time if I or Brad butcher anybody’s names. Sorry. This question is, what’s the best way to set up recurring payments: self-hosted versus third party affiliate solutions such as Affiliate WP or ShareASale? I think there’s really two questions in here. First, he’s asking about, like, setting up recurring payments, I would assume how to actually collect those recurring payments, how to create subscription records, how to let your customers purchase subscription. And also then how to integrate those with an affiliate program. Well, first, there’s a number of different ways that you can set up recurring payments. I mean for example all of the major e-commerce plugs and a lot of the membership plugins have recurring options: WooCommerce, Easy Digital Downloads, Restrict Content Pro, Member Press, Paid Memberships Pro, and a whole lot of others. First of all, I would look at a plugin like that for setting up recurring payments. Then for an affiliate program, I think it’s Affiliate WP and WP Affiliate Platform from Tips and Tricks are the only two that I’m aware of that have built in support for recurring referrals. So like if you want to give an affiliate a referral on every payment that gets processed. Both of those do support a lot of the membership and e-commerce plugins. There are other ways to do it too. You don’t have to use a plugin for it. I mean for example you could actually do a recurring payment directly through PayPal without ever using a plugin. Brad, do you have anything you want to add to that? BRAD: No, I think you pretty much covered it. I mean you’re the e-commerce expert, I think. PIPPIN: Now I believe you guys have recurring subscriptions, don’t you? BRAD: We do. PIPPIN: Or you’re working on them? BRAD: They’re fairly new. I think we launched four months ago or something. But yeah, we built our own subscriptions add-on for WooCommerce to do it. We’ve had our own subscriptions add-on since basically day one, but it just didn’t have the ability to automatically renew people’s subscription. They had to manually click, click a couple buttons to renew their subscription. Yeah, that’s what we did. I don’t recommend it. PIPPIN: I think one of the most important things when you’re going about setting up recurring payments, and this applies to any kind of e-commerce stuff, is just figure out what your needs are and then figure out which solutions meet those needs. Don’t just assume that solution X or solution Y is going to work for everything. For example, EDD and its recurring payments plugin might work for some, but it won’t work for all situations. Figure out what you need and then start looking at the solutions that proposedly provide those. BRAD: Yep. Good advice. All right, our next question is from Jonathan Perlman. He says, “When building custom routes in rest API for a mobile app what auth would you go with, cookies, oauth2?” Hmm. Custom routes in the REST API for a mobile app. PIPPIN: I’m not sure that the authentication method you use really matters too much depending on the custom routes. I mean your authentication is going to be the same whether you’re using the default routes or custom routes, typically. I mean unless you are — maybe if you are building custom routes that get access to information that uses different user capabilities than, say, your default routes. But typically the authentication would still be the same, wouldn’t it? Which, I mean, you could use the same authentication for either one. BRAD: Yeah. I mean it really depends what he’s talking about here, right? If he’s talking about allowing your API to be accessed by a variety of different apps, that’s usually OAuth. It’s usually where the user goes to a screen and then says, “Yes, please allow AirBnB to use my Facebook account,” right? Like that kind of thing. PIPPIN: Mm-hmm. I think OAuth is probably the best, if you can set it up. I’m not actually too familiar with the cookies authentication, so I honestly have not used that one. We did it a little bit differently in Affiliate WP recently. We extended the core REST API to add in our own routes and we also add our own authentication on top of it. We struggled with the idea of using OAuth for a little while and then ended up deciding not to use OAuth. We implemented a variation of Basic Auth. Basic Auth is the simplest authentication, but it’s also one of the least secure because it requires putting in your user name and password basically into every single HTTP request. What we ended up doing, we used Basic Auth, but we did it with API keys. So inside of Affiliate WP we created an API keys table called Consumers, and then any user that wants to interact with the API gets a set of user API keys created for them. Then those are the API keys that are provided as a user name and password inside of your HTTP request, which is then used to authenticate that request. But if those API keys get stolen or exploited in any way, you can revoke the API keys easily. The other thing is that those API keys don’t provide any kind of other capabilities within WordPress. It is limited to the Affiliate WP data. Let’s say that you were able to get a hold of my API keys because I was sending them in HTTP request, it wouldn’t allow you to really do anything. I mean you could manipulate the affiliate data, but you couldn’t reset a password. You couldn’t change an email. You couldn’t create posts. You couldn’t update anything like that. It was kind of a nice middle ground for us. BRAD: Yeah. I mean that’s a pretty typical authentication mechanism. I mean if you look at something like Amazon Web Services, that’s what they give you, right? When you create a user there and you want that user to use the API, then you get two keys, two separate keys. One is called the secret key and one is–I don’t know–the key/key or something. PIPPIN: The public or the access key, I think. BRAD: Yeah. Yeah, that’s right: access key. And so, yeah, I think that’s pretty typical setup. And to your point about Basic Auth not being that secure because of passing through the authentication details each time, I mean you kind of have to do that no matter what, right? You have to pass something back to authenticate, right? As long as you do it over HTTPS, I don’t think it’s that risky. PIPPIN: Well, and especially if the credentials that you are passing are very limited in scope. BRAD: Right. Yeah. PIPPIN: Like for example when you’re using Amazon S3, you can create an IAM user. Then when creating that user, you can actually specify the exact capabilities that they have. BRAD: Exactly. PIPPIN: Which is then going to limit what those API keys can do, even if they get into the wrong hands. BRAD: That’s right. That’s why they don’t recommend creating root keys that have global access to everything, which is kind of what everyone used to do until, you know, the horror stories came up where people ended up posting their root keys on their GitHub account by accident or something. Then some hackers got it and started filling up their S3 with tons of data and firing up EC2 instances and sending out spam email and all this stuff. Now we don’t do that any more, right? We don’t use root keys any more. That’s bad practice. PIPPIN: Yeah. We updated our Amazon S3 plugin for EDD. We didn’t actually update the plugin itself. We updated the documentation in the settings screens to indicate that you should create an IAM user because originally it was recommending the root user. BRAD: It’s not as ideal for plugins in a way because if you need to get them to do something or if you need to do something with their AWS account, you may not have access to do it through the plugin. Then you have to tell them, oh, don’t actually have access to do this, so now you have to go back to AWS console, go in, edit your user, edit their permissions. It’s a lot of steps to get them to add permissions, but what’s the alternative? One thing we thought about doing in our Offload S3 plugin is, on the first setup step, basically, get them to use their root keys, go them to go to their AWS account, get some root keys. But then as soon as they click next, we set up everything that needs to be set up in their AWS account, so create another IM user with restricted permissions. Then delete the root keys as kind of the final step to clean it up. I don’t know if that’s possible. We haven’t actually even looked at if it’s possible for a root key to delete itself, but it’d be cool if it was because then you could do all those. You could do all the manual steps for people and then just clean up after yourself kind of a thing. That’s something we’re looking at doing in the future. PIPPIN: This next one is actually pretty much the same question. I guess authentication with the REST API is a popular subject. Morten Rand Hendriksen asked, for a standalone mobile app, OAuth2, which is tricky right now with lack of support? And this is true. OAuth2 is not super well supported yet in the REST API. It’s also, at least the last time I checked, it seems to be lacking in documentation. So I would — for Morten, I would, well, go back to the last ten minutes. BRAD: Yeah, right. The next question is from our friend Brian Krogsgard. He asks, “What’s your process for prepping for taxes?” Wah-wah-wah. I added that last part. That wasn’t part of Brian’s question. PIPPIN: It’s not really a development question, but Tom McFarland extended it and makes a good point. He says, “I think it would be neat for a lot of us self-employed in the WordPress world to answer as well.” Basically, look, everybody has got to do taxes. Whether you’re a developer, a business owner, a designer, or whoever you are, everybody has got to do taxes. I guess our answers are going to be a little bit different. For one, you’re in Canada. I’m in the United States. And then listeners around the world. So I guess take it with a grain of salt. What’s your process? BRAD: Well, I have a bookkeeper and an accountant, separate. Usually what happens is the accounting firm emails a checklist. Then I get my bookkeeper involved. Then if there’s anything else they need from me that they’re missing, then I get it for them, whatever it is. Like a missing invoice of some kind of statement or something. My bookkeeper really has access to pretty much everything, though. It’s usually just something that gets sent to my private mail. She doesn’t have access to that. Yeah, it’s just a little bit of odds and ends from me. But usually it’s just my bookkeeper and the accountant that work together and sort everything out. Then I just have to sign some documents and I’m done, kind of thing. PIPPIN: That’s pretty much the exact same process for us. I have an accountant that does bookkeeping work for us every single month. Keeps everything up to date. Then at the end of the year she sends everything off to the tax people, and they double check it. They send us back a checklist of everything they need, everything they have. Then they end up doing all the filing for us. I think maybe the best piece of advice I can give you for prepping for taxes is if you run a business or you are self-employed, don’t do your own taxes. BRAD: Yes. "
