title = "Apply Filters 48: Managing Custom Tables - Apply Filters"
description = "This week Brad and Pippin dive into the topic of managing custom tables in WordPress. This is a powerful tool to help extend the capabilities of core WordPress."
full_description = "September 18, 2015 Apply Filters Apply Filters 48: Managing Custom Tables Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 48 Share Share Link Embed Download file | Play in new window | Duration: 48This week Brad and Pippin dive into the topic of managing custom tables in WordPress. This is a powerful tool to help extend the capabilities of core WordPress. If you need to take a plugin past the point that Custom Post Types can take you, then this might be a good option for you. This episode was sponsored by WP Ninjas, the creators of Ninja Demo and the highly popular Ninja Forms plugin. Updates Brad Has been busy at work Promoting WP Offload S3. Since it launched officially in the middle of holiday season in August, he’s been holding off doing a lot of direct marketing. How he’s been out talking to potential customers about its use cases and how it would benefit certain customer situations. WP Offload S3 does have some specific pricing structures, which are a good talking point with customers. Pippin Just got back from a trip with the family to WordCamp South Africa. He spoke twice, one presentation and one workshop. AffiliateWP 1.7 and RCP 2.3 updates are both updating soon. Custom Tables We’ve covered the topic of custom tables twice in previous episodes. The first was in Episode 12 of the podcast, where we gave an in depth intro to tables, when you should use them, and when you shouldn’t. In Episode 32 we discussed upgrade routines to transition to custom tables and where AffiliateWP and EDD may use them. More recently, both Brad and Pippin have been writing about custom tables too. Pippin’s blog post series is just getting off the ground and will cover this in depth over a series of a few posts. Brad’s blog post gives some insight into his previous experience with Custom Tables and some code around how he’s managed them. There are a few Responsibilities you need to keep in mind when working with custom tables too Security Caching Maintenance APIs for Custom Tables dbDelta() is a great helper function to create and manage custom tables in plugins Creating Custom Tables with Plugins Here are a few helpful examples of how Pippin uses database classes in EDD Pippin’s base DB class Customer DB class get_customers() function If you like skiing, snowboarding, talking software, and business then you should check out Big Snow Tiny Conf. This year it will be January 25-28 in Sugarbush, VT. If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Welcome back to Apply Filters, Episode 48. Today’s episode, as usual, is sponsored by the WP Ninjas, the creators of Ninja Forms. They do a lot of awesome stuff over there, so go check them out. Today, Brad and I are going to be talking about custom tables. This is something that we’ve talked about quite a bit in the past, but we’re going to go a little bit further because I think it’s a very important subject. Before we dive into custom tables, though, Brad, why don’t you give us an update on some of your recent projects? BRAD: Yeah, sure. I started promoting WP Offload S3, finally. We’ve had it launched kind of quietly for a month because it was the end of August. We didn’t want to promote it while people were on vacation. And so, yeah, we started blogging about it and stuff. I’ve been emailing with potential customers a lot that were confused about our pricing because we’re pricing based on the size of the media library instead of per number of sites, like most WordPress plugins do. There’s a little bit of education that’s required there. We do have all the answers in the FAQ. But, as you know, people don’t always read the FAQ. PIPPIN: Yeah, people don’t read the FAQs. BRAD: What they do, they send us an email, and then I send them a link to the FAQ in a very polite way. PIPPIN: My favorite aspect of people not reading FAQs is that, if you don’t have them, you get bitched and moaned at for not having FAQs. BRAD: Right. PIPPIN: But, when you have them, they’re not read. BRAD: Right, right. PIPPIN: It’s impossible to please. BRAD: I have never done a heat map of the pricing page with the FAQs on them, but I betcha people do read them, right? PIPPIN: Absolutely. We know that whether it’s people complaining that you don’t have FAQs or people that didn’t read FAQs, most of those are probably outliers. BRAD: Yeah, exactly. PIPPIN: Let me be clear. I am not saying that we should not have FAQs. I think this is very important. BRAD: Right. One thing I realized, just preparing this episode, is that I never really explained what WP Offload S3, what we’re selling with the upgrade, the Pro version, or whatever you want to call it. One of the things in the free version that’s missing is the ability to upload your existing media library. If you’re just starting a site that’s empty, then it’s fine. You just use a free plugin and start adding items to your media library, and they’ll get sent to S3. But, if you have an existing site with thousands of media library items already, you have to upload those to S3 somehow. The pro version has a tool to do that, and we’ve taken great pains to make it robust enough to handle massive media libraries. PIPPIN: That’s awesome. BRAD: Yeah, and so one of the things that it does is find and replace URLs and content as it uploads stuff to the media library. Let’s say you have a media library with 100,000 items, which is not uncommon. Maybe you have 10,000 posts, let’s say, in your posts of content, blog posts, or whatever. Well, after it uploads to S3, that file, it queues it up, the find and replace, because you can imagine how long it would take to upload 100,000 media library items if you were also running a find and replace on 10,000 posts, and for each one of them. PIPPIN: Yeah. That’s not going to work very well. BRAD: Yeah, so we’re dealing with some pretty massive scaling issues throughout this project. That’s one of the reasons it took so long to hammer out properly. Those are two major things in the pro version. You can control your files in S3 from the media library. On each item in the media library, you can copy it to S3. There’s a link or a button for that. You can remove it from S3 if it’s already up there. If you copy it to S3 already, and you’ve removed it from your local server, there’s a function to copy it down from S3 and back onto your local server. PIPPIN: That’s great. BRAD: Yeah. PIPPIN: How well does it integrate with plugins that work with the media library? For example, you have a plugin that either adds or removes items from the media library using some of the core functions inside of WordPress. Does it pick up on those? BRAD: Yeah, it works perfectly with those plugins. We love those plugins. PIPPIN: Awesome. BRAD: What we don’t love is the plugins that create their own functions to upload files to WordPress, but not into the media library, or they add them to the media library in some weird way that doesn’t use the core functions, and they don’t fire the hooks. Then people expect our plugin, of course, to work with it. That’s just not realistic. We can’t cover every plugin that does their own thing, right? What we’ve decided is, for those cases, if there are enough requests from customers, for example, NextGen Gallery. It’s hugely popular, and it uses its own system for managing the galleries of images. We’re going to do an add-on for that that will send those files to S3 and serve them from S3 within WordPress and on the front-end of the site. That’ll have to be custom, a custom add-on that hooks into NextGen’s hooks because they do their own thing. Yeah, we can’t. It’s not going to work for every situation, but we’ve done some funny things to make it work in most situations. PIPPIN: It’s really the best you can do. BRAD: Yeah. PIPPIN: When you find a new situation, you see if you can account for it, but there are so many vast ways of doing things. It sounds like you’ve already covered the primary basis. BRAD: Yeah. Yeah, I think so. Ian came up with a really cool little hack. I wouldn’t call it a hack. I don’t know. You be the judge what it is. We’ve had plugins. A lot of plugins expect the local file to exist. We have an option to remove the local file once the file has been uploaded to S3. Just wipe it from the server. But, a lot of plugins expect that file to be on the local server to whatever, to manipulate it or do whatever, right? PIPPIN: Yep. I’ve done that in a plugin. BRAD: Sure. Ian was trying to figure out a way to satisfy all those situations. What he did is he built a stream wrapper. In PHP, there’s this concept called stream wrappers. You can create– I’m probably going to botch this explanation, but basically you know how, in PHP, when you file? What’s the function: file_get_content? That function. PIPPIN: Yeah. BRAD: You can add a URL in there or a local file, like a file on the local file system or different protocols. You can register your own protocols in there. What we’ve done, we’ve registered S3 as a protocol. When you use the file system functions, it’ll replace the path to the file, the local file, with the path to S3, with the path to the file. PIPPIN: Wow! That’s awesome! BRAD: Yeah. PIPPIN: That’s super smart. BRAD: It’ll actually just download that file, stream it down to the server, and then do whatever it needs to do with it: open it or whatever. I thought that was a pretty clever little solution. PIPPIN: Yeah, that’s super clever. BRAD: I’m pretty impressed with that. Yeah, some other stuff is just add-ons. We’ve got an assets add-on that’ll upload all your CSS, JS, images, fonts, all that stuff from themes and plugins to S3 and start serving them from there. We’ve got a WooCommerce add-on that’ll allow you to serve your downloads in WooCommerce from S3. It’ll upload them and then set the file as private and then allow you to serve it from there with a secure URL. And we have the same, very same or similar functionality with Easy Digital Downloads. We have an Easy Digital Downloads add-on. PIPPIN: Hurray! BRAD: Which you may be familiar with. PIPPIN: I’ve used it once or twice. BRAD: Yeah, and so we’re planning on having more add-ons, like I said, to do similar things. PIPPIN: It’s very cool. BRAD: Yeah. PIPPIN: Now that you guys have this out, is there a potential that it will become maybe on par with WP Migrate DB Pro in terms of what your focus is? Is it going to be a side project? Is it going to become the primary project, or somewhere in between? BRAD: Yeah, interesting. I don’t know. That is a tough one to answer because I don’t feel like we have– PIPPIN: It’s too new. BRAD: That and I guess my feeling is that we don’t really — the plans for the future is to not have any flagship product. It’s just to have a bunch of successful products. That’s what I would love, right? But it may be that Migrate DB Pro will always be our kind of baby or our flagship product, and all the others will be kind of in its shadow or something. PIPPIN: Even if it’s not officially your flagship product, let’s be honest, it’s the one that really puts you guys on the map for creating these really amazing plugins that kind of go way up and above and beyond what we’re kind of used to seeing with some of these. Really, it has really advanced tools for not just developers, but for sites. Just as an example, there are tons of plugins that would allow you to export a database, but to do it in the way that WP Migrate DB Pro does is so much more polished and refined. Anyway, props on that. BRAD: Thanks, man. That’s very kind of you to say. PIPPIN: I’m very excited to see the product launched, and I wish that I had a site that really justified using it. I don’t actually use S3 for any of my sites. BRAD: Right. PIPPIN: But I’ve been tempted to just to play with it. BRAD: Yeah. To answer the rest of that question, the plan right now is to assign two full-time developers to each project to continue to push it forward. That’s kind of the long-term plan. PIPPIN: Yeah, I think that’s something we pretty much have to do as companies get more products under their belt because otherwise you just get ones that they either lose focus, don’t get as much attention. I’ve definitely found that with Affiliate WP, EDD, and Restrict Content Pro. Aside from myself, we have five people that work full time on EDD. We have one that works full time on Affiliate WP. For that reason, EDD gets a lot of the focus. BRAD: Right, I see. Yeah. PIPPIN: But I think, as we grow, I think we’re going to get another developer, for example, that does nothing but work on Affiliate WP or, like, 90%. BRAD: Yeah, I think that makes sense to give it a little bit more of a push forward. Yeah. PIPPIN: Yeah. BRAD: What have you been up to? PIPPIN: Well, WordCamp South Africa was this last week, and my family and I flew to South Africa for a weeklong vacation/WordCamp, which was awesome. I’ve got to say, South Africa is a beautiful, beautiful country, and we were in Capetown, which was where WordCamp was. It’s just an awesome city, if anybody is considering going or looking for somewhere to go, put that one on the map. It’s definitely worth it. Depending on where you are in the world, it’s a few long flight. I think we had– BRAD: I don’t think it depends where you are from. I think, for most people, it’s a long flight – for most people. PIPPIN: If you are anywhere in Europe, North or South America or, say, Australia, it’s going to be a really long flight. Actually, most of Asia will be a really long flight as well. It was about 31 hours of travel time to get there for us and about 28 hours to get back. Which, if you’ve ever traveled with a toddler and a one-year-old, it’s a little bit longer than 31 hours in terms of how it feels like. BRAD: Yeah, it’s a good thing you spent the week. You mostly bounced around Capetown, or did you get out of the town? PIPPIN: Yeah, we spent almost all the time in Capetown. Well, with one day we traveled down to Cape’s Point, which is the southern most point of Africa, which is just absolutely beautiful. It’s right there by the Cape of Good Hope. Anyway, we had WordCamp South Africa, which was there. We had a mini vacation and really didn’t do a whole lot while I was there in terms of work-wise. But, as soon as I got back, then it’s full steam ahead on getting two major releases pushed out. Affiliate WP 1.7 is getting wrapped up, hopefully today, actually. After I jump off this episode, I’m going to see if I can finish up the release and wait for Mr. Andrew to wake up–since he’s in New Zealand, he’s currently sleeping–so he can test all my changes. Then, Restrict Content Pro 2.3 is slated for release. I was hoping for it today, but probably won’t happen. It’s got a little bit more work to do on it, so that’s "
