title = "Episode 50: PHP7 and What It Means To You - Apply Filters"
description = "Welcome to Apply Filters, Episode 50.  Today we’re talking about the upcoming launch of PHP7 and what it could mean to you as a WordPress theme and plugin developer.  This update to the framework will..."
full_description = "October 22, 2015 Apply Filters Episode 50: PHP7 and What It Means To You Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 53:12 Share Share Link Embed Download file | Play in new window | Duration: 53:12Welcome to Apply Filters, Episode 50. Today we’re talking about the upcoming launch of PHP7 and what it could mean to you as a WordPress theme and plugin developer. This update to the framework will bring massive performance improvements, but along with that will come several adjustments to how we handle code, compatibility, and interaction with other plugins. This show is sponsored by WP Ninjas, makers of Ninja Forms and Ninja Demo. Updates: Pippin New site for Restrict Content Pro with a lot of help from Andrew Munro Rolling out Mailchimp automation, especially with EDD to get people into a drip campaign Initiative to increase happiness scores in HelpScout and overall customer service performance Team Retreat around Pressnomics in March in Phoenix. Brad Been troubleshooting ads in Adroll OffloadS3 – managing compatibility with popular other plugins via add-on licenses to base plugin MigrateDBPro New UI based on Backbone.js Multisite integration Company retreat – around WordCamp Europe in Vienna, Austria next year. PHP7: Release date expected to be November 12 Performance improvements with PHP7 will be significant (2-3x improvement over PHP5) Exception handling – errors will be caught as exceptions Testing tools are available to forward test your code against the new framework. To take a look at the documentation around PHP7 check out the Zend blog at www.zend.com/en/resources/php-7. The Make blog in WordPress has been chronicling the upcoming changes to PHP7 and what it may mean to WordPress theme and plugin developers. The most recent article from them is at https://make.wordpress.org/core/2015/09/10/wordpress-and-php7/. If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Welcome back to Episode 50 of Apply Filters. This episode, as usual, is sponsored by the WP Ninjas, the creators of Ninja Forms, Ninja Demos, and a few other great WordPress plugins. You should go check them out at WPNinjas.com. They’re doing some really cool stuff with their new Ninja Forms 3.0 that they’ve been previewing, so go check it out. Their YouTube channel has some previews of it, if that’s something that you’re interested in. We definitely appreciate all their support. It helps us to put this show together for you guys. BRAD: For sure. If you are running a little WordCamp and having trouble getting sponsorship, you should reach out to us because we’re looking to help out kind of the smaller WordCamps that are having trouble. If you’re a small WordCamp, yeah, let us know. We can try to help you out. PIPPIN: Yeah, it’s going to be really fun to try and help some of the smaller ones. In the last few years, I’ve gone to a lot of different WordCamps, and some of the small ones have been some of my favorites. They’re a little more intimate. I like to see people that are just getting a WordCamp started and, yeah, so we’d love to help out in any way that we can. BRAD: Awesome. What have you been up to, Pippin? PIPPIN: I’ve been doing a few things. It’s been two and a half, three weeks since our last episode. I know we’re a couple days behind. I was traveling over the weekend and had some things come up during the week last week, so we’re a few days behind. During that time, we just launched a new website for my Restrict Content Pro plugin. This is my membership plugin that I’ve worked on for the last four and a half to five years. BRAD: Oh, yeah. I saw that last week. This site looks great. PIPPIN: Fantastic. I’m glad you like it. BRAD: Yeah. There’s like little animations here and there that are– PIPPIN: There are. Yeah. That’s all Andrew Monroe’s work. He’s my partner on Affiliate WP. He’s been working on EDD for the last three years or so. He did the Affiliate WP website. He did my new PippinsPlugins.com site that we launched about eight months ago, and so now he’s done Restrict Content Pro. BRAD: Yeah, so if you go to that site, make sure when you get to the bottom at the sign-up form, hover over the little dragon mascot, and he flies. He starts to fly. PIPPIN: Yeah. BRAD: It’s a nice, little– PIPPIN: That was one of my favorite little aspects of the site that we kind of put in a little Easter egg. It actually took, I think, three or four days for anyone to notice, or at least anyone to notice it and said anything. BRAD: Yeah. Yeah, that’s awesome. PIPPIN: I’m excited to have this site launched finally. The plugin, Restrict Content Pro, has been sold under the PippinsPlugins.com site for the last two and a half years. Before that, it was sold on Code Canyon. It’s never really had its own dedicated home. It’s always had a single page within my main website, and sometimes I think that has caused it to lose a little bit of focus or to not get as much attention as maybe it could have. I’m excited that we have the new site. We’re going to continue to expand it over the next few months. This was kind of our soft launch. The plugin is actually still purchased on PippinsPlugins.com. This is more like a really extensive landing page. But, eventually everything is going to get moved over as well. BRAD: Right. It kind of legitimizes it as more of a real product, it seems. PIPPIN: Right, and that’s one of the big reasons for doing it. BRAD: Yeah. I mean you have some really great customers using that product, and so it definitely deserves– PIPPIN: Yeah, there are some very large sites using it. BRAD: Yeah. PIPPIN: That’s been one of my goals for the last six months or so was to focus on the plugin a little bit more and to try and really grow it. The plugin has always done really well for me. Ever since it was on Code Canyon, it’s always been one of my staple products. But, after Easy Digital Downloads and Affiliate WP came out, it started to lose a little bit of the focus. It never grew as much as either of those did, and it was kind of my hobby project. I want to take it and, over the next year, bring it up so that it’s not a hobby project anymore; that it is a full-fledged business on its own. It won’t necessarily have its own legal business entity. It’ll still be under the Pippins Pages brand, but it is a full-fledged project that will hopefully be — yeah, I want to grow it a lot more. I want to double or triple its size in the next month. Sorry. Not month. A month would be amazing. That’s not going to happen. That would be crushing. But, in the next year, I’d like to really bring it up. Beyond that, which did take a while, I’ve been doing a bunch of work with MailChimp automation, so I’ve done this in the past, and I’ve written about it a couple of times. We’re doing a lot of automation, especially with Easy Digital Downloads, with sending, getting people into kind of a cycle whenever they purchase specific products for EDD that then follows them up with, whether it’s documentation or things that they can do to go further with a product. We’ve had some of these in place for a while now for RCP and Affiliate WP and, like, a generic EDD one. Now we’re starting to expand it a lot to go to specific EDD products. If you purchase front-end submissions, which is one of our primary add-ons, you’re going to get a series of emails that are catered specifically to that. With about 100 primary extensions that we manage, that means a lot of different MailChimp campaigns that we’re putting together. We’re trying to go through and do the top 10 or 20 of them. BRAD: Are those opt-in or are they mandatory if you purchase? PIPPIN: They’re automatic the moment you purchase. BRAD: Right. Okay. PIPPIN: But you can opt out at any time. BRAD: Right. PIPPIN: Then two other things that have been my focus for the last week or so, well, this one is new, but we started. At the end of last week, we decided to kind of put together a team challenge and look at our support quality. Not just our support quality, but also our efficiency, how well we’re doing with our happiness ratings, how quickly were we responding, how quickly we’re getting tickets solved, and we kind of made a challenge for ourselves. We set a goal for a month from today, or a month from the day that we had set this up, to improve various stats by a certain percentage. I’ll run through these really quick just to give you an idea. We wanted to improve. We wanted to decrease the number of replies sent, like the total emails that we send by, say, like 2%. We want to increase the number of tickets that get resolved on the first reply. Right now we’re at about 48%. We want to get it above 50%. We want to get our handle time, an average, like right now we have an average handle time of 5 minutes and 30 seconds. We want to get it down below that. We want to drop it. BRAD: I could tell you how you could get it really low. You just set up a workflow in Help Scout to send every message to the trash. PIPPIN: That does in fact work. Unfortunately, that impacts a different part of our goal, which is to improve our happiness scores. BRAD: Right. PIPPIN: And so I have a feeling that would probably make them go down. BRAD: Yeah, yeah, and probably sink your business too. PIPPIN: Yeah, it might not do very well. We started looking at this, and so we kind of looked at a whole bunch of stats and decided that, every month, we want to set a goal. I’ve always had this maybe unfortunate habit of just kind of assuming things are going really well in support and assuming that we don’t necessarily need to make improvements or maybe there’s not improvements to make. We want to start improving it. Even if it’s great today, we want to make it even better, so we decided to look at all the stats and then set a goal. Every 30 days, we’re going to reanalyze our stats, and we’re going to set goals. We’re going to see if we can achieve those in various manners, whether that means using more canned replies, just taking longer to answer an initial ticket, or getting more people onboard, whatever it is. Those are our goals, so that was a big focus for the end of last week, and we’ll see how it goes over the next 30 days before we reassess. I’m sure we’ll talk about. Once we kind of figure out, once we see what our stats are on the first review, we’ll talk about it on an episode, I’m sure. Well, anyway, Brad, how about you? What are you up to? BRAD: I’ve been working on hiring. Actually, we’re going to hire another full-time developer. I posted on Authentic Jobs, and we got over 100 submissions, so going through those and reviewing code and stuff has just been really time-consuming. Then I’ve had this problem with AdRoll, the ad platform that we use. It wasn’t serving our ads for, like, two weeks. They changed something on their end, just stopped serving ads, and we had no way of knowing. I logged in one day, and I noticed that the graphs were looking funny, kind of flat. It turns out they weren’t serving our ads. PIPPIN: Oh, no. BRAD: Yeah. PIPPIN: Were they charging you for ads that you weren’t being served? BRAD: No, at least they weren’t charging us. PIPPIN: Well, that’s good, at least. BRAD: Yeah, but we would have figured that out pretty soon when the bills came back and it was like, you know, nothing. It was a little disappointing that it took them so long to fix it. I told them on, like, a Thursday, I think it was, and it didn’t get resolved until, like, Tuesday or Wednesday last week, or something. And so that was a little disappointing and frustrating, but it’s done now, so we’re out of the woods. I’ve been working with the team on Offload S3, 1.0.2, which is just a bunch of bug fixes and stuff. One interesting decision we’ve made for that is around add-ons. We were previously going to just add compatibility code into the core. Here’s a real example. The plugin is not, by default, compatible with Meta Slider, which is a super popular, free slider plugin on .org. And so we have to add some code to get it to work, some very specific code for that particular plugin to get it to work with our plugin. We decided to make those add-ons, so to take that code and put them in add-ons, and there are a few reasons for that. PIPPIN: What is the reasoning for doing that instead of putting it into the core plugin? BRAD: Yeah, well, the advantage of putting it in the core plugin is it just works, right? No one will ever notice a problem with those, with Meta Slider, for example. That’s a big advantage there. The disadvantage, though, is that all the people that aren’t using Meta Slider, which is a significant portion of people, have that code in there that’s not going to be used, which is not a big deal. PIPPIN: Right, as long as the code isn’t loaded when it’s not needed, who cares? BRAD: Yeah, exactly. PIPPIN: Yeah. BRAD: But then again, it depends how much code is required to make it compatible, right? If it’s 1,000 lines of code or something, that’s not really great to be distributing that, and that’s just for one plugin compatibility. What if we have two dozen plugins that we need to be compatible with, and we have to add compatibility code? That’s one thing. The other thing is that it’s not very publicly visible. We could list it somewhere in our documentation that we make it compatible with Meta Slider. PIPPIN: Sure. Releasing an add-on is kind of that extra visibility, so people searching for Meta Slider find your add-on, and then they say, “Oh, this is cool.” BRAD: Yes, exactly. And it’s kind of a pledge as well. Because you’re releasing it as an add-on and it’s very public, it’s not like tomorrow you’re going to just say, “Oh, we don’t support that anymore,” right? It’s much more difficult, at least, to do that because that’s what they bought into. They bought into you supporting that add-on, right? It’s kind of part of the deal, right? It becomes more part of the deal than just kind of a footnote in your documentation. That’s kind of why we tipped– PIPPIN: Will you be releasing those as free plugins on WordPress.org, or will they be available for paid license key holders only? BRAD: Paid license only. Some of these compatibilities are extremely time-consuming to deal with. PIPPIN: Sure. That’s also an upsell for you to get people to upgrade to the paid…. BRAD: Exactly. Exactly, yeah, like some of our licenses will be compatible with a dozen popular plugins, right? PIPPIN: Right. BRAD: WPML is another one that we will be supporting as of this service. PIPPIN: Oh, man, I can imagine that one will be super tough. BRAD: Yeah. PIPPIN: Maybe not tough, but extensive. BRAD: Yeah. They have add-ons for their plugin too, so it’s not just WPML. It’s WPML and their media extension or whatever. PIPPIN: Right. We had t"
