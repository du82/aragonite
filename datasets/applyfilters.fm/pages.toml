full_description = "February 21, 2017 Apply Filters Episode 76: Advanced Strategies vs. Just Shipping, and Other Listener Questions Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 29:20 Share Share Link Embed Download file | Play in new window | Duration: 29:20We don’t have a sponsor this episode, but we are celebrating 100,000 downloads! With a sponsorship, about 2,100 people will listen to your ad. If you’re interested, visit applyfilters.fm to check it out. Today, Pippin and Brad will answer questions from the audience. You’ve asked some great questions through Twitter, email, and Post Status Slack. Some of the highlights of today’s show include: Working in advanced strategies vs. just shipping. Is it better to just get the item out the door, or to get the product perfect and smooth out all of the rough edges before offering it? Brad and Pippin have different philosophies on this, and they discuss their thoughts on finding the balance between polishing and speed. Considerations to keep in mind when a feature is released and it’s not being used. Is it because it’s too unpolished, or because it’s just not a worthwhile feature? Two development areas where the advanced strategies vs. just shipping question applies and needs to be carefully considered. Tips on debugging front-end performance and what to do if JavaScript is using too much CPU. What PHP features would make WordPress development easier if WP were no longer restricted by supporting PHP 5.2. Recommended plug-in templates. Tips on handling and encouraging responsible disclosure of security vulnerabilities. Links and Resources: Apply Filters on Twitter https://php.net/manual/en/migration53.new-features.php Boilerplate Generator Boilerplate If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. BRAD: Welcome to Episode 76. This time Pippin and I will be answering questions from our audience that gave us questions through Twitter, Post Status Slack, and email. But first, we do not have a sponsor this episode, but we are celebrating 100,000 download. We have ticked over. We’re like 101,000 or something, isn’t it, Pippin? Something like that. PIPPIN: One hundred and fifteen thousand. BRAD: One hundred and fifteen thousand. Ooh, that’s even better. Yes, so if you are interested in sponsoring, you can get this spot right at the top of the show for about $300, and that will get you about 2,100 unique downloads, so about 2,100 people will listen to your ad. That’s about $0.14 per person, so a pretty good value there, I think. Yeah, if you’re interested in sponsoring the show, we have a form at ApplyFilters.fm, so check it out, and we’d be happy to talk about most products. Not every product, but most products. Pippin, shall we proceed? PIPPIN: Yeah, let’s dive in. We’ve got a number of questions from people this time. Some were left over from when we asked for questions a couple weeks go. We’re going to start with one from Travis Northcutt. He asked a really good question in Post Status Slack this morning. It might take up our full time, and so if we end up just talking on this one for a while, then we’ll go ahead and get to the rest of the questions the next episode and who knows however many after that. Anyway, I’m going to read to you what Travis wrote, and then we may rephrase it just a little bit. Travis said, “So if you think it’s going to be an interesting discussion, perhaps talking about working in advanced strategies vs. just shipping. I often get excited about learning some new techniques or tools, but it’s easy to get sucked into over-optimizing for perfection as opposed to just getting something built. You could spend hours and hours using all the latest best practices, but that doesn’t mean you’ll ship your product.” Really, I think what Travis is really asking here is having a discussion on the philosophy of just ship it, basically get the MVP out the door as early as possible, versus getting your product, whether it’s a 1.0, a 2.0, a 3.0 perfect and getting all of the rough edges smoothened out and making sure that it’s really well polished. I think this is an excellent topic and something we’ve known for a while, but we just got reminded of this at the beginning in our pre-show discussion is that Brad and I actually have different philosophies about this. I think Brad, you and your team tend to do a lot more polishing before shipping something. I’m not saying that my team and I don’t polish things, but for me, my personal philosophy has always been: Let’s just ship it. Let’s get it live. It should be fully functional. It should be good to go, but it doesn’t necessarily have to be perfect because I really like the approach of release often, iterate quickly. BRAD: Right. I think what you just said is fair. I think we do polish things. We tend to polish things quite a bit before we release. I do think that it’s a balance, though. I mean that’s the whole thing, right? How much do you polish it? You have to polish it a little bit, don’t you? It can’t be a complete unusable thing, right? PIPPIN: Obviously it can’t be broken. BRAD: Yeah. PIPPIN: And it can’t be completely disjointed. There needs to be some form of polish to it. But I think the real discussion there then is how far is enough and how far is too much before you get yourself into a trap. There was a followup comment from another Post Status member, Darren Ethier, who said, “Seriously, though. The discussion is a good one. Part of the tension is that until you ship, you don’t really know if the idea you have is crap. The difficulty with possibly shipping too early is determining whether it’s crap because of the idea or the implementation. So it’s a good segue into measuring the right data to help you answer the right question,” which is a really important point. You could very easily work on a product for months and months and months, or not necessarily a product. It could be a feature. It could be a UI design change. You could spends months or years doing it and then ship it only to discover that you did something terribly wrong because you misunderstood what your customers wanted or how your customers used a product. I think anybody that has ever built a feature into a product and then later on realized that nobody used it or that the feature didn’t fulfill the need the customers had, understand that pain. BRAD: Yeah, absolutely. I mean it’s tricky, though, when you’re talking about a feature, right? Let’s say you launch a feature. You go the “just ship it” approach and just get it out as pretty rough. You’re measuring usage, and no one is using it, or people use it and then stop using it immediately. Is that because it’s not very good, or is it because the feature is just a feature that no one wants? If you don’t polish it to your own satisfaction, then you can’t really write off that idea. PIPPIN: I have an example of this, I think, from EDD. In, I want to say, version 1.5, which was 2.5, 3, maybe even 4 years ago at this point–I’m not sure how long ago it was–EDD did not originally ship with anything to collect sales tax. Number one, because I had the philosophy of, look, I’m just going to ship something early and we’ll add features as we go. But then we did decide to add sales tax, but we added a ridiculously simple implementation of sales tax, like to the point where it was almost useless for a lot of people. That implementation was definitely an example of, hey, let’s just ship it and we’ll iterate later. But the feedback that we got from customers after that was basically nobody used it because it was broken. They didn’t not use it because they didn’t need it. They just didn’t use it because it was broken. And so that’s one case where we should have polished it a lot more before ever releasing it. But then again, on the flipside, by releasing a broken feature, we better knew that people really did need the real feature. BRAD: Right. That’s a really good point. We kind of did the same thing with Mergebot. When we pushed out Mergebot there was a lot of limitations, let’s just say. There was a lot of things that we hadn’t done yet that we were very sure that people were going to — not 100% sure, but pretty sure that people are going to want these things, right? That they’re not going to be able to even do very much without these things. When we launched it, that’s the feedback we got. These things are things people need. And so although we launched and people couldn’t use it right away because of those things, it did at least give us that confidence that we’re pushing forward on the right path, that our priorities are in order, and that these are things that we absolutely do need to knock out that people need. Yeah, I mean I see the value of just shipping it, for sure, and I wouldn’t have done — I think doing Mergebot differently, if we had tried to polish everything before getting people’s feedback, I think that would have been probably worse because we probably would have done some stuff that would have been unnecessary. PIPPIN: I think there’s two kinds of maybe development areas where I think that these two philosophies can really apply. One is adding features or changing an existing product, whether it is removing or adding features or changing features. The other one is shipping brand new products. I think the most dangerous trap is when you’re shipping a brand new product like Mergebot, for example. You spend months or years building this thing and only to discover that people don’t actually want it as much or that people wanted something different than you built. What you guys did with Mergebot was probably very, very smart by not only releasing a beta version, but also being very clear with what you were trying to build into it and getting that feedback from people. BRAD: Yeah. I think if we were to start Mergebot again today, like if we could go back in time kind of thing, I think we would have even narrowed the problem space down to an even smaller thing so that we could get something out a lot sooner because it did take over a year in development to get the first beta out of this. Because the scope of what we were trying to fix was so big, that’s how long it took. But if we had to narrow that scope to, let’s say, solving the merging problem for WooCommerce or EDD or some plugin or some very small subset of data, I think that would have been maybe more manageable and we could have shipped in maybe 4 months or something instead of 18 months. It’s tricky. It’s easy to say now, right? But it’s hard to foresee that when you’re in the moment. PIPPIN: Another aspect, as developers and product creators, or really any kind of crafts person that works on things whether you’re talking about code or construction or some kind of hobby project or art project, when you work on the same thing for a really, really long time you get tired of it. You can get burnt out on it. You can stop seeing the value in it for what the value really is. One of the things that I think is really, really healthy for creators to do is build new things a lot. Sometimes I think it’s really healthy to just sit down and hammer out something completely new and then just let it go. Basically build something, put it there, whether it’s on a piece of paper, on a screen, in a code editor, or in some kind of like physical art form. Just doing it and pushing it out to people can be really, really healthy for us as creators, especially as developers because I think too often we get caught up in thinking about the, “Oh, I needed to do that one. I need to figure out that. I needed to take care of that problem. I need to add this, or I need to add this before it’s ready.” I think the effects not just on having somebody else come and use what you’ve built, but the internal mental effects of just building something and pushing it out and releasing it right away is really, really good for us. There was a follow-up comment from John Jacoby in the Post Status Slack this morning on the same topic. John was at LoopConf where I was also last week, and he gave a talk about some Unix philosophies. He mentioned this in his comment. Anyway, here’s what he said. BRAD: Hang on. Is this Unix like the operating system Unix? PIPPIN: I would assume so. Yes. BRAD: I guess the design of that operating system, so these are some of the philosophies in there? PIPPIN: Some of the philosophies they use in building Unix. BRAD: Okay. PIPPIN: Yes. BRAD: Okay. Yes. PIPPIN: Here’s what John said. “One of the Unix philosophies I talked about at LoopConf is about prototyping early. I think that applies to both agencies and individuals. What doesn’t always happen with either group is the additional polish necessary to take an idea from prototype to production ready. The reasons for which could be time, budget, stress, personal, professional experience, et cetera. The best part of shipping is the byproduct. What did you learn? What other things did you do to do the thing that you tried to do?” Then there’s a follow-up comment, but first need to give a little bit of info. John and I actually sat down at LoopConf and had a little code session for about eight hours in a bar. I had presented him with an idea of something I wanted to build, and we ended up just saying, hey, why don’t we go sit down and build it? And so we ended up building this plugin called WP Meta Manager. Anyway, here’s what John said about that. “The byproduct of Pippin and I jamming on WP Meta Manager at LoopConf was feeling energized about writing crappy, raw code again.” I think there’s two really important takeaways, at least for me in this. Number one is he’s right. A lot of people do just ship something and then don’t have the follow-through to actually continue polishing it to make it really production ready. They build a prototype and that’s as far as it gets. On the flipside, sometimes just building a prototype and not worrying about the polish can be really, really healthy. What John said was feeling energized about it. It was really fun to just sit down and throw crappy code on the screen and just make something work out of nothing. That’s something I think some people get too caught up on with the polish. Now, when it comes time to actually release that as a final product, I think it is still really great if you can take the time to go ahead and find that polish. BRAD: Right. You guys, I’m guessing you guys weren’t writing unit tests for your code. PIPPIN: No, we didn’t write unit tests, but we were striving to write testable code, and I think we mostly did. BRAD: Right. That’s good. That’s cool. PIPPIN: Anyway, I think it’s an excellent discussion. If anybody listening has any follow-up comments or questions related to ship it versus polish, let us know. BRAD: Yeah. I mean "
