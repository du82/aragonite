title = "Episode 65: Automatic Renewals, Monsters in the Database, and Client License Ownership - Apply Filters"
description = "Today’s sponsor is Network Solutions. If you are looking for a managed hosting platform with an emphasis on security, consider their product, Secure WordPress. Your plugins will stay updated and you won’t have to worry..."
full_description = "July 20, 2016 Apply Filters Episode 65: Automatic Renewals, Monsters in the Database, and Client License Ownership Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 46:02 Share Share Link Embed Download file | Play in new window | Duration: 46:02Today’s sponsor is Network Solutions. If you are looking for a managed hosting platform with an emphasis on security, consider their product, Secure WordPress. Your plugins will stay updated and you won’t have to worry about malware. Even better, their tech support is available 24/7, so your questions won’t have to go unanswered. You can learn more at getnetsol.com/applyfilters. This week, we’re hearing from Pippin and Brad about what they’ve been up to, and both will talk about one of their respective blog posts that have gone up recently. Pippin’s Update Pippin’s main update is that Restricted Content Pro 2.6 went live. It was a smooth release, and it has a few great new features. First, they rebuilt the user interface and how content restriction is set up. There is new metadata and APIs, and they’ve replaced PDF invoices with HTML to help save space during downloads. Finally, they’re using Drip Content, a new add-on that will eliminate the problem of people signing up for one month of the program, downloading all of the content, then cancelling. Brad’s Update Brad has recently released the version of 1.6.1 Migrate DB Pro. Most of the differences are bug fixes. It’s now WordPress 4.6 compatible. They’ve launched automatic renewals. Perhaps one of the most important fixes is that the version number is now in the name of the file to make it more usable with JavaScript. Other topics that are discussed include: Pippin explains his post, “The Monster That Is a Poor Database Schema.” He talks about the importance of an abstraction layer. Brad explains his post, “Hey, WordPress Developers, Your Clients Should Own Their Plug-In Licenses.” He discusses the pitfalls of developers using their own licenses for plugins on client sites. Links and Resources: Getdrip.com The Monster That Is a Poor Database Schema Hey WordPress Developers, Your Clients Should Own Their Plugin Licenses If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. BRAD: Welcome to Episode 65. This time Pippin and I will be talking about what we’ve been up to and we’ll be covering some of the articles we’ve recently written and kind of going into detail on some of those topics. But first– I registered my first ever domain name in 1999, 17 years ago. Back then there was one place to register domain names, a company called Network Solutions. Many of you probably already know this, but did you know that Network Solutions also has a WordPress hosting platform? They do. It’s called Secure WordPress. It’s a managed WordPress hosting platform with an emphasis on security. They automatically keep WordPress core and your themes and plugins up to date. They have daily backups. They provide malware scanning and removal. And they put your site behind a data center class firewall to protect against zero day hacks and DDoS attacks. They have expert tech support available 24/7 via chat and phone. Network Solutions takes care of keeping your site locked down and up to date, so you can focus on your business. Visit GetNetSol.com/ApplyFilters today to get started. And now back to the show. Okay, Pippin. What have you been up to, man? PIPPIN: Well, once again, kind of like just about every other week, we’ve got a couple of plugin updates that went out. This week was in the Restrict Content Pro land. We pushed out Restrict Content Pro 2.6, which I believe I had mentioned we had released the beta in the last episode, and so that update went live a few days ago. So far it’s been a pretty smooth release. We have pushed a couple of very, very minor point releases since then just to fix a couple of small issues. This is one of the big updates that we’ve been working on for about four or five months now, and we’re pretty excited to get it out. It doesn’t have a ton of new user facing features, but it has a lot of improvements behind the scenes that, in the long run, will make a very significant difference. A couple of the main things that we did is we rebuilt the user interface for how content restriction settings are setup on posts and pages. Let’s say that you write a tutorial or you write a blog post, and you want to restrict that to paid subscribers, there’s an interface on the edit screen for the posts on how you do that. It’s always been a little bit of a confusing interface. It’s never been super smooth, and some of that is just because, as the plugin developed over time, we added new features to it. We added new ways to restrict content. We just kind of piled them on. Anyway, we decided to look at that interface, throw it all away, and rebuild it from scratch with we thought was a new, much better interface. Which, in the long run, will hopefully do two things, primarily. Number one, it will reduce friction for new users and make it more intuitive for them to set up the plugin for the first time. As most people are familiar with, the first impression that somebody has of a product, of a person, of a thing has a very long-lasting impact on their long-term opinion of it. And so with this being one of the very first parts of the plugin that users interact with, we felt it was very, very important that we give it some more attention. BRAD: You’ve redone the UI. What does the process look like? How do you guys iterate? Does someone do mockups, or do you just start right away with code? How does it work? PIPPIN: There’s a few different ways we would do it, and there’s no set in stone or standard way. In this particular case, my team member, John, and I. John is the primary team member that works on Restrict Content Pro. He actually flew into Kansas a few weeks ago, and we spent a week working together onsite. One of our goals was to come up with this new UI while we were both in the same place. BRAD: Whoa! You were in person, so what did you do? Used a chalkboard or you went old school? PIPPIN: No, we did it a little bit differently. He used it on his computer. I used it on mine, and I put together a quick proposal, actually just coding up an HTML mockup and said, “Hey, John. Take a look. What do you think?” Then he had some suggestions, made some tweaks, and then repeat that through out the day. Then once we had kind of put together what we felt was a decent UI, we then sent that off to some of our other team members who are not even necessarily involved with Restrict Content Pro but are familiar with it, and so they were kind of our test users, our test case to say, “What do you think of this UI? Does this make sense to you?” Okay. Now we sent it to somebody else who was very familiar with the old UI and said, “Now does this make sense? Is this an improvement?” We spent about three or four weeks doing that. Hopefully, in the long run, it will turn out to be a positive. We think it will. The second goal is that if you make users happier, you give them a better experience from the get go. Not only are they more likely to be long-term customers, they’re also going to open less support tickets. One of the number one support tickets that we would get prior to the 2.6 release, a customer would come to us and say, “This content that I’ve restricted is still accessible to non-subscribers. What’s going on?” In almost every instance it was due to the restriction settings being configured incorrectly. We decided the fact that this happens all the time, it is not user error. It’s a product error, and we need to fix that. That was part of the goal as well. A couple other things that we added to it is just some polishing, things like making the whole admin area fully responsive, adding a few additional features to some of the payment gateways, for example like Stripe checkout, which is the modal window that Stripe offers. It has some really nice integrations with Bitcoin and a couple other payment processors like bank transfers and Alipay – Alipay being the number one payment processor in China. We added support for those or, specifically, we added support for Alipay and then some other refinements. Then there were also some improvements behind the scenes, three primarily. One being we added metadata to subscription levels and payment records, which is something that we’ve needed for a long time, primarily at the subscription level because let’s say, for example, Affiliate WP has an integration with Restrict Content Pro. One of the things that site owners want to do a lot of the time is to set up custom commission rates on different subscription levels. You can say anybody that an affiliate refers to the gold level gets 20%. Anybody that you refer to the silver level, you get a 10% commission, et cetera. Prior to 2.6, we didn’t have any good way for other plugins to store metadata on subscription levels, so you had to kind of figure out your own way to do it. Store them in the WP options table or come up with something else. And so we’ve introduced metadata of APIs for those two, which will make it a lot easier for us to introduce new add-ons in the future. BRAD: I’m curious how Restrict Content Pro integrates with Easy Digital Downloads because it looks like Restrict Content Pro is pretty much an e-commerce system kind of on its own, right? PIPPIN: Yes and no. It’s kind of funny, and this happened entirely by accident, but we get that question a lot in both RCP and EDD support. Usually it’s people coming and asking, “Hey, how do they integrate?” because the natural assumption is that they are directly integrated with each other because they come from the same company. The truth of the matter is that they’re actually completely independent platforms that just happen to be built by the same team now. They were both built to serve different purposes, and those purposes have slowly kind of moved together to overlap a little bit. There are some very distinct differences, like for example Restrict Content Pro, you would never sell products through it. You might sell access to one product, but probably not multiple products. One of those reasons is that members are limited to one subscription. You don’t have five subscriptions through Restrict Content Pro as a customer. You have one. What you sell needs to be within those confines. BRAD: Right. I was kind of thinking like it might make sense to share payment gateway stuff, like the Stripe library or whatever, the Stripe add-on. There’s got to be quite a bit of overlap in that. PIPPIN: There definitely is. BRAD: Yeah. PIPPIN: There’s feature overlap. There’s library overlap. There’s lots of overlap that there can be. Right now we’ve chosen to keep them almost completely separate because they are distinct platforms and neither one of them requires the other, and we want to keep it that way. What we’re working to do is to make it a little bit more seamless. And so if a site is running both of them, there’s shared interfaces. There’s some shared features, et cetera. But that’s a slow process. Right now it’s pretty minimal. BRAD: Right. Makes sense. PIPPIN: My favorite feature in 2.6 is not really a feature, but is a change. We used to have PDF invoices, so if a customer had a payment record, they could download a PDF invoice for that. We ripped it out – or sort of. We replaced it with an HTML invoice. Have you ever looked at the size of PDF libraries? BRAD: They’re large. PIPPIN: Monstrous. One of the problems that we used to have a lot was somebody would buy Restrict Content Pro, and then they’d try to upload it to their site. They’d get an error that says the file size is too big because, on tons of shared hosting, your maximum file size is one, two, three, or four megabytes. Because of the PDF libraries, the Restrict Content Pro file size unarchived was 12 megabytes. Once we removed the PDF libraries, now it’s like 1.5 or less, and it’s just because those PDF libraries are so enormous. And so we said we’re moving away from the PDF libraries. We’ll move to HTML versions only, and we’ll dramatically reduce our footprint. BRAD: Right. PIPPIN: We’re very excited to have that finally done. BRAD: You’ve got a logo in the invoice that people can add, I’m assuming? PIPPIN: Yep. BRAD: Yeah. If people upload just a regular GIF, PNG or whatever, those are generally 72 dots per inch when printed, so there should be like a hint there that they either have to upload a much larger size and then you can resize it to be smaller so that when it prints it comes out clear and crisp. That’s something I ran into, I think– PIPPIN: That’s an excellent point. BRAD: Yeah. PIPPIN: Something I had not considered. BRAD: Yeah. Yeah, I think I ran into that when I was billed ten years ago or something when I was building the invoices for the Web hosting company that I was running at that time. Yeah. Yeah, if you just print a regular image off a Web page, it comes out fuzzy because the dots per inch is very low for Web. PIPPIN: Makes sense. BRAD: Yeah. PIPPIN: The last thing that we’ve been doing was also related to RCP, and that was a new add-on, a new professional add-on that’s available to the professional and ultimate license holders for dripped content. One of our number one feature requests ever since 1.0 has been the ability to have dripped content. And so, as of Tuesday, that is now available and we’re pretty excited for it. BRAD: What is dripped content exactly? PIPPIN: Sure. All right, so let’s say that you have a membership website, and somebody subscribes to your paid plan. They now get access to all of your content. Well, that usually works fine for most sites. BRAD: It’s a little overwhelming though. PIPPIN: Yeah. It can be overwhelming because suddenly you just have this massive library of content, assuming it’s a large site. But there are also some disadvantages to it. Let’s take my brother’s website for example. CGCookie.com is a large membership website. When you buy a subscription, you get access to a whole bunch of courses. You get access to file downloads and things like that. A perpetual problem that CGCookie and every other large membership website faces are customers that come in, buy an account, download all the resources, copy all the courses, and cancel their account. Then they’ve paid whatever the monthly fee is or the yearly fee and kept all of that content and then possibility redistribute it. One of the ways that you get around this is dripped content. Dripped content is the idea that instead of getting immediate access to everything, you get access to stuff on a schedule. Let’s say that you could set it up on a category basis, and so you could have your categories first month, seco"
