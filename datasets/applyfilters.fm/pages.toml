["https://applyfilters.fm/podcast/episode-57"]
title = "Episode 57: Product Releases and PressNomics Highlights - Apply Filters"
description = "Today we have updates on our latest projects as well highlights from the recent PressNomics event."
full_description = 'March 14, 2016 Apply Filters Episode 57: Product Releases and PressNomics Highlights Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 35:08 Share Share Link Embed Download file | Play in new window | Duration: 35:08A big thank you to a new sponsor of ApplyFilters, Gravity Flow. Head over to GravityFlow.io to find out how they’re changing the way business processes are streamlined and automated. Gravity flow enables WordPress sites to automate custom processes both for internal routing, reporting, and scheduling, as well as customer facing collaboration tools. Today we have updates on our latest projects as well highlights from the recent PressNomics event. Brad announces the release of WP Offload S3 1.1. which includes these new features and changes: A change to the way license usage is calculated to make it less confusing and more fair to customers A new download tool for all files Public-private toggling for use when viewing an attachment’s details The ability to define any and all of the plugin’s settings via a constant More docs and a new addon which integrates with the advanced custom fields image crop plugin Pippin has three main areas he is focusing on currently: A lease on an office space, moving him outside of working from his home-based office with the hope it creates a better separation between work and home An update on Recurring Payments 2.4.2 after information-gathering Release of AffiliateWP 1.7.15, which includes small enhancements and minor fixes Highlights from PressNomics: Discussions on piggybacking on a feature plugin that needs background processing The benefits of meeting like-minded individuals and team meet-ups Pippin’s speech based on his blog post titled, Be a Little Selfish, which has led him to determine that in order for his team to take care of its customers they need to focus on what they build as opposed to what other developers have built. Brad concludes today’s episode with some thoughts on conversations he had with some people from SiteLock concerning the security of storing passwords in the cloud. They believe while not ideal, it offers a pretty secure option when passwords are encrypted. When he asked about passwords in regard to using Google Spreadsheets the response was not so positive and he explains. If you attended PressNomics we’d love to hear your thoughts about it, or feel free to reach out to us on any other topic. Resources mentioned in this podcast: Sponsor: Gravity Flow WP Offload S3 1.1 Released PressNomics Apply Filters Episode 56: Background Processing] Background Processing in WordPress by Ashley Rich Pippin’s blog post which his talk was based on: Be a Little Selfish SiteLock If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. BRAD: Welcome to Episode 57. This time, Pippin and I will be talking about what we’ve been up to and a little recap of PressNomics. But first– PIPPIN: This episode is sponsored by Gravity Flow, and advanced add-on for Gravity Forms that allows you to automate your business processes, whether you need to set up workflows for purchase orders, job applications, admission forms, project initiations, vacation requests, or any other kind of workflow that involves feedback loops, approvals, et cetera. Gravity Flow allows you to do this easily while also leveraging the power of Gravity Forms. You can find out more information at GravityFlow.io. Be sure to thank them for sponsoring this episode. BRAD: Awesome. PIPPIN: All right, Brad. What have you been up to? BRAD: Well, we just actually released a major release this week. WP Offload S3 1.1 was released. PIPPIN: What is new in that? BRAD: Lots of stuff, but I’ll give you kind of the highlights. One of the big things is that we moved to kind of the same model we used for Migrate DB Pro. That is that the upgrade, the pro upgrade version is a replacement for the free version. When you upgrade, you have to actually kind of drop in this other plugin and deactivate the other plugin. PIPPIN: It wasn’t that way before? BRAD: No. It was a bolt-on. The upgrade was a bolt-on to the free, so you had to run them both. What we realized was that it was a pretty big advantage, actually, to have it run on its own as a standalone because then we could release the free version, then test the pro version for a week, and then release the pro version. In that kind of time span, if there were any issues discovered by the free plugin users, we could fix those and roll them into a patch and patch the free version. Then when the pro version goes out, those fixes are in it for our customers, so the customers get that extra little benefit. That doesn’t mean that we’re going to not test the free version and just push out crummy code, but we still test the free version thoroughly, of course. But, it’s just nice for our customers to get that kind of benefit of the free version being out there for a while first. PIPPIN: Is there going to be any kind of upgrade pains for changing that model for existing customers? BRAD: We did run into an issue. I guess we didn’t quite test all the scenarios quite right because if you deactivate one plugin and activate the other plugin. Anyway, there was some scenario where things didn’t work. When we pushed out the free version, things broke, so we had to roll it back right quick and do some fixes. Then we rolled out the fixes. PIPPIN: Yeah, that’s always frustrating when that happens. BRAD: Yeah. PIPPIN: Welcome to development. BRAD: Yeah. Exactly. It’s to be expected. To be fair, my team did an awesome job of recognizing the problem and containing it, so we only actually had ten people complain to customer support. That’s a win in my book. PIPPIN: Yeah, that’s good. BRAD: Yeah, so kudos to my team for that. We’ve also changed the license, the way we calculate usage of the license, so the usage is based on the media library size. It was just that, so no matter if you had offloaded any of your media library to S3 or not, it would count the full size of your media library. Some people didn’t like that. A lot of people expected it to only count the files that you had actually offloaded to S3 towards the limit. Yeah, some people were put off by that. We said, "You know what? You guys are kind of right. It should be farer to only count the files that you’re actually offloading to S3." PIPPIN: Right. It makes more sense to price it on how you’ve actually used it as opposed to how you might use it. BRAD: Yeah. The whole idea of that licensing model was to kind of capture the size of the site and relate what you pay to the size of your site so that bigger sites pay more kind of thing. But I could see why people didn’t quite like that idea. PIPPIN: Yeah, for sure. BRAD: So, we changed it up. We also added a download tool, so you can download all your files that you do upload to S3. You can download them all back to your server. There’s an option. PIPPIN: Download them as in download a big archive of them or download them as in import them back into your media library? BRAD: Yeah, so what happens is there’s an option in our plugin that says, "Remove files from server," so when you upload a file to S3, it’ll actually remove it from your local server. A lot of people used it because, if you have gigs and gigs of files, you probably don’t want to be taking up your local hard drive space. PIPPIN: Right. Point of the point of offloading them to S3 is to actually offload them. BRAD: Yeah, exactly. PIPPIN: Not just clone them. BRAD: Exactly. The download tool allows you to download all of those files in bulk back to your server. For example, if you wanted to stop using our plugin at some point, you could use this tool to do that. Actually, one of the reasons we built the tool is because some people wanted to start over. They messed something up when they were setting up the plugin. Things got out of whack, so they just wanted to download everything back to their server, just uninstall the plugin, start over, and re-upload everything. This allows them to do that. It does find and replace as well. It gives you the option when you click "Begin download." It’ll prompt you saying, "Do you also want to do a find and replace on all your content and revert back to using local file URLs in your content?" Referencing the local file. Yeah, that’s kind of like an uninstaller, I guess, but we couldn’t make it part of the typical WordPress uninstaller because it needs to be batched. We couldn’t do 200,000 media library items, for example, in the uninstall process that WordPress provides. PIPPIN: No. It would just die. BRAD: Yeah, exactly. The other thing was private toggling, private/public toggling. You can actually set a file as private on S3 just by clicking the link when you’re viewing the attachment details. That’s for like if you’re dealing with a third party plugin that wants, say, EDD for example, that wants the files to be private. Then that’ll work. Oh, this one is cool for developers, and this was a request. We didn’t get tons of requests for this, but a few people requested it and we thought it was a good idea. You can actually define any setting that you can set in the UI you can now define in code in your wp-config. PIPPIN: I saw that in your blog post. Of all the features you put in, that’s the one that really captured my attention. BRAD: Yeah. PIPPIN: As a developer, let’s say I run a lot of sites and I always use the same configuration. That’s awesome. BRAD: Yeah, exactly. Exactly. That’s who it’s for, right? One of the things that we did kind of above and beyond was we locked the UI. The UI will actually show what the setting is, but it will be grayed out, and it will say, "Defined in wp-config.php." PIPPIN: That’s great. Kind of like how if you defined the site URL or the home URL for WordPress in wp-config, those settings, in general, cannot be changed. They show you what they are, but they can’t be changed. BRAD: Exactly. PIPPIN: That would be great for people running client sites that don’t want clients possibly changing the settings. BRAD: Exactly! That was the request. That was the request that we were getting. PIPPIN: That’s very cool. BRAD: People didn’t want their clients screwing with the settings and screwing up their site. This allows them to at least see the settings. Actually, what we did, we told people what they could do easily enough. It’s just using WordPress’s filters; you could remove our menu item and stuff. But they were like, eh, well, it would be nice if we could still see the settings. PIPPIN: Yeah. BRAD: So why not. Then we just did some UI updates, lots of docs, and we added a new integration: Advanced Custom Fields Image Crop plugin. That’s an add-on to Advanced Custom Fields. We integrate with that now so that they work together. Yeah, that’s about it. It’s a pretty big release, like I said. PIPPIN: Yeah, that’s huge, man. BRAD: Those are the highlights. PIPPIN: Congrats on getting it out. BRAD: Yeah. Thanks. What have you been up to? PIPPIN: Well, I’m just getting back from PressNomics. I’ve had kind of three main focuses. These were partially on the plane ride home and then also once I actually got home. The first one is that just before I left for PressNomics, I signed a lease on an office space, so I am in the process of moving out of my home office. I rented an office near downtown where I live. I’m working on setting that up. I’ve got all of my Internet set up and configured yesterday. Now all I have to do is move furniture. I actually worked from the office most of the day yesterday on a card table. BRAD: I can picture it now, Pippin putting on his suit in the morning, going into an office, brewing himself a cup of tea or a cup of coffee. It’s probably not going to go like that, right? PIPPIN: Not quite, mostly the whole suit process. This is something I’ve been actually wanting to do for a while now. One of my struggles that I’ve always had, and I think most people that work from home have this, whether they recognize it or not, is the difficulty in separating work from home. I have a home office. It’s a separate room, and I try to treat it as: if I’m in the office I’m working; if I’m not in the office, I’m not working. But, that’s pretty difficult. I find myself working at the breakfast table or working from the couch in the evening, or various things like that. That can easily put strains on family time or just in not taking enough breaks. It’s too easy to work too much, and so one of the things that I’ve wanted to do is create a better separation. Part of that is to get an out-of-house office. Also, I’m going to use it as or another reason why I’m excited for this is I strategically picked the spot that is perfect biking distance from my house. As long as the weather is nice, my goal is to bike to work every single day. Biking there and back once a day will be something like ten miles. While it’s not a huge distance, it’s enough that it’ll help to take care of my physical health. BRAD: Right. PIPPIN: I’m excited for that. BRAD: Yeah, man, I struggle with that. PIPPIN: It’ll be an experiment. BRAD: I struggle with that stuff as well, and I have considered getting an office as well, but I love — I love every morning when I can just go from downstairs in the kitchen, after breakfast, to upstairs. I’m always thankful for that, especially when it’s miserable outside. PIPPIN: Absolutely. BRAD: Yeah. PIPPIN: The nice thing is that even with a dedicated office space, I can still do that because I have the freedom of, you know what? Today, I’m going to work from home. BRAD: That’s true. Yeah. PIPPIN: But one of the problems that I have with my home office is that I think I am too quick to go straight from I wake up, to the office, and not taking time to enjoy the morning, not taking time to really get ready, not taking enough time for me and family in the morning because the office is right there. And so, it takes a little less commitment to go and get started, in a way. BRAD: Is your family home a lot of the working day for you as well? PIPPIN: Yes. Yes, almost every day. BRAD: Right. That makes a big difference. I would definitely be getting an office if that were the case. My wife and kids are gone during the day. PIPPIN: Okay. Sure. BRAD: It’s kind of a different situation. PIPPIN: Yeah. BRAD: When my wife was home on maternity leave, and there was a crying baby in the house too, that was some trying some times. I almost got an office during that period, so I can sympathize. PIPPIN: Yeah. In one way, we can look at it as an out-of-home office allows you to remove distractions. In another way, because you’re removing distractions, it means that it takes a lot less time in the day to get things done, which means I can quit earlier. It means I c'
