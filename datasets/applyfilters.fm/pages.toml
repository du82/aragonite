title = "Episode 79: WordPress Development Challenges, Hiring Developers, and Other Listener Questions - Apply Filters"
description = "We’re going to answer some listener questions today. We’ve been getting a lot of great ones, and we thank you! We will continue answering questions in future episodes. If you have questions that you’d like..."
full_description = "April 11, 2017 Apply Filters Episode 79: WordPress Development Challenges, Hiring Developers, and Other Listener Questions Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 42:04 Share Share Link Embed Download file | Play in new window | Duration: 42:04We’re going to answer some listener questions today. We’ve been getting a lot of great ones, and we thank you! We will continue answering questions in future episodes. If you have questions that you’d like to submit, you can do so on the form on our website, or you can Tweet us or send an email. Some of the highlights of the show include: Pippin’s and Brad’s least favorite parts of developing for WordPress and why. How Composer and Bower can help with single plugin development as opposed to when working with a team. Also, Brad’s and Pippin’s thoughts on using auto-loading for classes and plugins. Whether new plugins should use API to insert new posts, or whether Brad and Pippin prefer WP Insert. Thoughts on debugging Admin Ajax and making it faster. Which plugins are the most likely to be hogging resources and slowing it down? How to determine a good price to pay for a plugin, as well as how to approach a plugin creator with a specific offer price. Tips on hiring developers, where to find them, managing them, determining salaries, and working remotely. Links and Resources: Apply Filters question form Apply Filters on Twitter Composer Bower WP Insert Admin Ajax Debug Bar Actions and Filters Query Monitor AuthenticJobs.com WeWorkRemotely.com If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Welcome back to Episode 79 of Apply Filters. Today Brad and I are going to go over some more listener questions. We’ve been getting quite a few from everybody. Thank you all for submitting them via Twitter and email. If you have any questions that you would like to submit, you can go to our website at ApplyFilters.fm. There’s a form there to submit your question, or you can reach out to us in any way that you know how to, whether it’s Twitter, email, other websites, et cetera. We love to get your questions. We’ve got quite a few to go over today, and we will try to get to all of them. If we don’t, then we’ve got more episodes coming. Brad, do you want to take us away with the first one? BRAD: The first question is from Darren Spence. He asks, “What is your least favorite part of developing for WordPress and why?” Huh. PIPPIN: Plugins. BRAD: I think for — yeah. What? Isn’t that your whole business? PIPPIN: Yes, sir. Let me expand on that a little bit. BRAD: Okay. PIPPIN: Okay, so I think one of the most awesome things about the WordPress industry, world, community, whatever you want to call it today is the fact that we have such a thriving plugin ecosystem. There are 50,000-plus plugins that do anything and everything from full blown solutions that transform your website to little tiny things that put quotes on a page. There’s a plugin for just about anything, and anybody can get into building plugins. It’s a free for all. You can — you have a plugin you want to build, build it. You can release it for free. WordPress.org provides a great infrastructure from which to do that. It gives you an opportunity to put it in front of people and find an audience for it. It’s obviously been successful for us, as both you and I, Brad, have been able to build successful companies on top of the WordPress plugin industry. But because of the success, it is also sometimes super painful to build plugins within WordPress and build them reliably so that they always work. I mean I think if you look into any commercial plugin or theme or any WordPress business, their biggest support burden is probably people having problems on their site using your plugin, your theme, et cetera. And a lot of the time it’s because of some kind of conflict with another plugin, whether it is a, like, PHP error, if it is notices from another plugin, or if it’s simply two plugin clashing in their design or what their outputting on the front of the page. Basically, it’s an uncontrolled environment, and sometimes, depending on the day, sometimes it is so brutal I want to walk away. We’re like, “Why do we do this?” But most of the time — I mean most of the time I genuinely enjoyed it. But if you could think about the difference between building products, free or commercial, in a controlled environment, think of like a SaaS, versus building in a free for all where you never would know what the environmental variables are, the latter is far more difficult and painful for a lot of obvious reasons. That’s my least favorite part. BRAD: Yeah. I think plugins are like your most favorite part and the least favorite part at the same time. You know? PIPPIN: Yeah, absolutely. BRAD: Yeah. It’s like with great power comes great responsibility. Sometimes people don’t get the last part right. PIPPIN: Yeah. BRAD: The responsibility part. PIPPIN: Well, and I think that it’s so common because there are so many different developers out there and it’s so easy to release a plugin. Sometimes because it’s so easy you get a lot of plugins that are released. We see this on the WordPress.org plugin repository every single day in plugin submissions. A lot of people are building plugins that I don’t want to say that they have no business building plugins because I believe everybody has the opportunity, but they simply don’t have the experience to know what they’re doing is problematic because this is the first time they’ve ever released it. It’s a trial by fire, but it means that there’s thousands of those where somebody just builds a little thing that was fun and they released it. But then somebody else came along and installed it without knowing that this thing is garbage on the inside. Not necessarily by intention, but maybe lack of experience. Then that causes problems. BRAD: This is a whole other kettle of fish, probably. I’m opening up a can of worms here. Do you think that the WordPress.org repo should be more — either it should, like, identify plugins that are — I don’t know. Somehow identify the ones or highlight the fact that certain plugins aren’t following the rules or best practices or something. I don’t know. Would that help? PIPPIN: It’s tricky. BRAD: Maybe not even — on the, like, extreme end of that, maybe like not even let them into WordPress.org and say, you know, go on GitHub until you get better. That’s the extreme end. PIPPIN: Yeah. BRAD: I’m not saying I’m for it. PIPPIN: I can see the positives of that. The official .org policy is, basically, look, anybody deserves the right of being able to release a plugin here. We are not to judge you how well you write your plugin. Yes, there are things that are disallowed. I mean for example you can’t put a fatal error in your plugin. That’s going to be rejected. Ideally it doesn’t throw PHP notices. Ideally it uses proper prefixing and/or name spacing. As long as you do all of those things, like, the rest of the quality of your plugin is not for us to judge. That’s the general rule that we go with. BRAD: Anyways, I guess we’ll leave it at that and not open the kettle. PIPPIN: What’s your least favorite part? BRAD: I’m probably going to say, like, so this is my favorite part. Again, it’s like a favorite part and a least favorite part at the same time. It’s backwards compatibility. You know having to support PHP 5.2 still is pretty painful for WordPress developers, I think. Not being able to use a lot of the features and even PHP 5.3, which is, you know, ten years old now, that’s pretty painful. You can’t use name spaces. We covered all of the things that we would get as soon as we’re able to draw up support for PHP 5.2. We covered that in a previous episode. We’ll link that up in the show notes, the previous episode that we covered that in. I think another thing was closures, so being able to write anonymous functions would be something that we would gain by dropping 5.2 support. Just all those things, I think, just make it less fun to develop for WordPress, right? I’m certainly not the first person to say that. I think it’s a pretty popular opinion, right? Like I said, it’s also one of the best parts about WordPress that it just works, and it doesn’t break for people. I guess I said backwards compatibility, but that’s not really backwards compatibility, right? That’s support for PHP 5.2, old versions of PHP. PIPPIN: But that is coming from a commitment to backwards compatibility. BRAD: Yes. Yeah. I still like backwards compatibility. I mean I wouldn’t say that’s one of my least favorite parts. I kind of like the challenge of trying to build something new, but still works for anyone that does it the old way kind of thing, you know, and then deprecating things. It’s just — I feel like that’s just the responsible way of doing development. I kind of like backwards compatibility, but I’m not opposed to, you know, breaking it at some point. PIPPIN: Sure. BRAD: Where it makes sense. Anyways. PIPPIN: Alrighty. Thank you, Darren, for the question. The next one comes from Josh Eby. He said, “I would like to get your thoughts on using Composer and Bower in terms of plugin development. I understand the benefits of Composer when working with a team or using it to manage an entire website, but how can it be used when developing a single plugin? Do you use auto loading for your classes in your WordPress plugins? Why or why not?” There’s a couple of different questions in here. Do you want to start us off, Brad? BRAD: Sure. Composer, why — so how do you use it when you’re developing a single plugin? Well, let’s give a concrete example. WP Offload S3, it uses the Amazon AWS or the AWS SKD, right? That’s part of the plugin. That’s a library that’s included in the plugin. We use Composer to manage that, to manage that inclusion in the plugin. I can’t remember. What’s the Composer command line thing? Composer something. PIPPIN: Composer update. Like if you want to update, if you want to update your libraries? BRAD: Yeah. Whatever. Your Composer file that has the version numbers in it, you just change the version number, do a Composer update, and it just updates it. Commit that to Git. Commit your Composer file to Git and away you go. I mean that’s basically how we use it in our plugin. Do you guys do something similar, Pippin? PIPPIN: We do, not in all of our plugins, but some of them. One of the main examples would be like our Stripe payment gateway, both for Restrict Content Pro and Easy Digital Downloads. Those both rely on the Stripe PHP SDK that they provide, and so we have that set up with Composer. Any time that we push out a new update, we can just run Composer update and it goes ahead and pulls in the latest SDK from Stripe and sets up the auto loader for it and it works great. That’s the main time that we use it. We have used it before for other kinds of dependencies, say like if we have one of our own shared libraries that we use across plugins. We’ve used it for pulling those in, pulling sub-modules in before, but pretty rarely. Honestly, we don’t use it very often. We do have some– BRAD: What about for unit tests? I think we use it for that as well. When the unit tests run, I think Composer runs as well. PIPPIN: Well, we do have it set up so it pulls in, like, the latest version of WordPress, the latest version of…. BRAD: Right. PIPPIN: –from GitHub, et cetera. That is all inside of our Travis config for Travis CI. BRAD: Oh, okay. PIPPIN: But in terms of the rest of, like, using it to manage our plugins, we don’t use it very much. BRAD: Yeah, so it is composer.json. PIPPIN: Yeah. BRAD: I was … my instinct was right. PIPPIN: In terms of Bower, I’ve never used Bower before. BRAD: Oh, yeah. PIPPIN: I’ve never used it. I can’t really answer much on that. I know it’s another package manager. I know a lot of people that do use it, but I couldn’t given any answer on to how to use it or what’s the best way to use it. BRAD: Do you use auto loading for your classes in your WordPress plugins? Why or why not? PIPPIN: Only when it’s part of a Composer install. Like with the Stripe API for example, whenever you do Composer update, it actually pulls in the latest version. That then all we have to do is load one Stripe PHP file, which then has an auto loader inside of it for the rest of the SDK. But that’s the only time. We have never built an auto loader into any of our plugins. BRAD: Right. Any reason for that, or is it just you just never bothered? PIPPIN: Originally it was because of PHP 5.2 support. I mean, yes, we could build like a pseudo auto loader, but like a true auto loader, we’ve never done. I think, honestly, it’s just left over from not doing it for old PHP versions, and we just haven’t adapted to moving in that direction. It has never been that much of a need. There are a lot of things that we can focus on and that we can spend a lot of time and effort on, and auto loading has never been a priority. If you have a great reason for why we should, I’d love to hear it. BRAD: Yeah. I mean I guess the argument for doing it is so that you’re not loading unnecessary files into memory, right? You’re not making PHP do extra work for nothing, you know. That’s probably the argument, but I don’t know. When you’re talking about a plugin, you know, loading a few extra files, is it really worth all the overhead of adding auto loading for that, right? PIPPIN: I have not yet been convinced it is. BRAD: Yeah. PIPPIN: If somebody has a case or an example of why it is or a different example of why there’s a significant advantage to it, please do share. BRAD: Yeah. I like auto loading. I’ve written some auto loading. I wrote the one for our website. Our website does some auto loading. I hate having requires, like a giant block of requires sitting in a functions.php file. It just looks funny to be just requiring that many files at once. And a lot of times they’re not even necessary. They’re not even going to be used in this particular request, right? I don’t think we do it for most of our plugins either. Yeah, it’s probably something that we should, we should eventually get to. The next question comes from Theron, and he says — he has some API related questions and he asks, “Should new plugins use the api to insert new post or wp_insert? PIPPIN: I would assume this is asking whether we should use the REST API and the creation endpoints through that to create new posts, or should we use things like wp_insert_post? BRAD: Right. Right. That’s what I get as well. PIPPIN: I would think it’s really going to depend on the context. I mean if you are running a process inside of PHP, you use wp_insert_post because I don’t see any reason to fire off a remote request to the same API when you alrea"
