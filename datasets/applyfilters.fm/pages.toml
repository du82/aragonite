title = "Episode 66: WordPress 4.6 Release - Apply Filters"
description = "Today’s sponsor is WP Pusher, a product that allows for “pain-free deployment of WordPress themes and plugins directly from Git.” WP Pusher is offering 20% off to our listeners; just use the code “applyfilters.”  ..."
full_description = "August 10, 2016 Apply Filters Episode 66: WordPress 4.6 Release Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 53:04 Share Share Link Embed Download file | Play in new window | Duration: 53:04Today’s sponsor is WP Pusher, a product that allows for “pain-free deployment of WordPress themes and plugins directly from Git.” WP Pusher is offering 20% off to our listeners; just use the code “applyfilters.” In today’s episode, we find out what Brad and Pippin are up to and delve deep into WordPress 4.6. Pippin’s Update In an effort to really build up Restrict Content Pro, they have released two new plugin add-ons: Woo Commerce Member Discounts and Restrict Access Content. Brad’s Update Brad had a big release of the Assets add-on for the WP Offload S3. They have also improved the user experience to include better feedback. Some of the topics you’ll hear about include: Why Pippin is promoting WooCommerce despite EDD having its own e-commerce products. Pippin and Brad discuss WordPress REST API vs admin-ajax.php. Meta-environment: what it means, and why it’s important. A discussion of the upcoming launch of WordPress 4.6, which includes: How meta registration works and why it’s helpful. Changes pertaining to persistent comment caches. WP post type changes. Native fonts. Shiny updates: to get rid of the “bleak screen of sadness.” Resource hints, which are optimizations of the browsers. Translation improvements. Improvements made to the customizer API. Bootstrap/load updates. Multi-site changes. Links and Resources: WP Pusher review on DeliciousBrains.com Comparing WordPress REST API Performance to admin-ajax.php Git Repositories WP 4.6 Field Guide WP Resource Hints If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. BRAD: Welcome to Episode 66. This time Pippin and I will be talking about what we’ve been up to and dig deep into WordPress 4.6. But first– PIPPIN: This episode is sponsored by WP Pusher. WP Pusher is a pain free deployment for your WordPress themes and plugins directly from GitHub or Bitbucket. With WP Pusher, you’ll never have to manually copy files over FTP again or manually create zip files. If you enable automatic updates, your client websites will automatically be updated every time you push a change to one of your GitHub or Bitbucket repositories. Right now, for a limited period of time, as an Apply Filters listener, you can get 20% off your purchase of WP Pusher by using the discount code APPLYFILTERS. That’s all one word. I’ve got to say, I think this is a really slick system. Not too long ago we turned on GitHub deployments for all of our plugins, so any time that we released a plugin update for EDD, Affiliate WP, Restrict Content Pro, et cetera, it gets deployed directly from our GitHub repositors. And I’ve got to say, it is probably one of the best timesavers we’ve implemented in a long time. Our releasing an update, no matter how big or small, went from a 20-minute process of carefully making sure that we build the zip file and all those things and upload it to 30 seconds. We simply tag, select, and we’re done. It’s awesome. BRAD: Yeah. When you go from something like that taking 20 minutes to not at all, you really appreciate it. PIPPIN: And you realize how much time, especially if you release a lot of updates, that those updates actually take. It was interesting. When we switched over to using get deployments, I originally had always thought about, like, you know that that’s cool, but not really a big deal. It’s just a couple minutes. It doesn’t matter. Oh, my gosh! No. I was so wrong. The amount of just stress that it removed from not having to do all of that, and it suddenly made pushing the smallest point release pain free that you don’t even worry about it at all. BRAD: Yeah, exactly. Yeah. We actually reviewed WP Pusher on the Delicious Brains blog a few months ago. If anyone missed that, go check it out. PIPPIN: That’s for kind of like a companionship between WP Migrate DB Pro and WP Pusher, right? BRAD: Yeah. Yeah, they do. They do complement one another quite a bit. They’re both in the realm of deployment. They work well together. There’s no seamless deployment with them both. It’s not like you could push your database and it would automatically deploy your code or something like that. Although, there are hooks in Migrate DB Pro that you could do that, I’m sure. I think Jeff gets into that a little bit in our blog post. Anyways, check it out. PIPPIN: Very cool. Thanks, Peter, for sponsoring. It’s a great looking product. Go check it out. Remember, it’s APPLYFILTERS as a coupon code to save 20% off your purchase. BRAD: Yeah, thanks, Peter. All right, so what have we been up to? PIPPIN: Well, just in the last two weeks or so, we’ve been doing some more Restrict Content Pro updates. That’s kind of where some of our, the majority of our focus. At least the focus that we’re telling people about so far has been. As I’ve mentioned a few times in the past, we’ve been really working over the last four months to rebuild RCP as a product, bring it back to life, and do cool things with it. And so we’ve released two plugin updates for it, two new professional add-ons. The first one is WooCommerce member discounts, and so if you want to run a club site of any kind with WooCommerce, or you want to give paid subscribers an additional discount or something like that, you can now do that. You can simply go, create a coupon code, and say, “I want to automatically apply this to any subscriber of my gold plan.” And so if you go and you are a paid gold subscriber, you can have the discount automatically applied to your purchase, so of anything that you purchase through the WooCommerce store. That was actually released just yesterday and it’s pretty sweet. Then we also released another add-on called Restrict Past Content. Certain membership sites sometimes want to limit the content that subscribers have access to and make it so that you only get access to content published on or after your registration date. So anything that was published in the past, you don’t get access to. There are some kind of unique scenarios on when people want to be able to do this, but we released an add-on that now supports that. And so if you publish content all the time, but you want to make sure the subscribers only get access to the content published after their registration date, that’s what this add-on does. BRAD: Cool. For the WooCommerce add-on, I’m curious. I think some people might think, “Why is Pippin peddling WooCommerce add-ons for Restrict Content Pro instead of trying to push people towards Easy Digital Downloads?” What’s your answer to that? PIPPIN: Well, there are a couple of answers. First of all, we’ve had the EDD version of this member discounts plugin for two years. BRAD: Right. PIPPIN: If we wanted to think about it that way, we’ve been ignoring WooCommerce for two years. BRAD: Right. Okay. PIPPIN: Which is not the truth. We’ve just finally got around to building the Woo version as well. The real answer, though, is that it’s good business. Look. There’s a huge number of people running WooCommerce out there, there are a lot of people running Restrict Content Pro, and there’s a lot of people running them both at one time. For us to say we’re not going to support WooCommerce just because we build our own e-commerce plugin would just be playing favorites, and that’s not something that we’re here to do. So we want to not only take advantage as a business of the customer base that WooCommerce provides us, but we also want to make sure that our WooCommerce users are taken care of. BRAD: Right. Well said. Cool. PIPPIN: How about you? What have you guys been up to over there? BRAD: We had a big release of the assets add-on for WP Offload S3, so that add-on allows you to offload your CSS, JavaScript, font files, pretty much all your theme assets, including anything else that’s enqueued by WordPress, so JavaScript libraries, CSS, or whatever. And anything enqueued by plugins, it scans for all that stuff, puts it on S3, and serves it from S3 or CloudFront depending on how you configure it. Anyway, we’ve had a big release of that add-on. We updated the user experience to be a little bit nicer. It now gives you better feedback, so like when it’s scanning for those files, it’ll show you. It provides a UI that gives you the progress of how much has been scanned and how much is left to go, and how much has been uploaded and how is left to go – that kind of thing. It gives you a status of what’s happening right now with this add-on, like is it scanning, is it serving files, you know, what’s happening. We’ve done quite a bit to expose all of that information, so it’s a little bit more friendly for users. We’ve added a feature to exclude files from Minify. We had a filter for this, but we found that there’s quite a few CSS files that Minify screws up, and then it screws up their site. PIPPIN: You know that’s always been my experience with any plugin that minifies scripts and styles is that there’s always some file that just breaks. I don’t know why, but it always seems to happen. BRAD: Yeah. PIPPIN: So that’s a great feature. BRAD: Yeah, so we just have a switch, on/off switch, and you can just punch it in. PIPPIN: I’m curious. BRAD: Yeah. PIPPIN: Since you guys probably have quite a bit of experience, like seeing those conflicts on certain files that don’t minify right, do you have any insight into what causes it? Is it a syntax error in the CSS? Is it something else? Why doesn’t it work? BRAD: I don’t know, man. I wish I knew. I wish I could tell you. PIPPIN: Okay. I’m glad I’m not the only one. BRAD: Yeah, I don’t have a silver bullet answer. I remember at one point we were looking. We used to get CloudFlare’s minifier would screw up our CSS, like the CSS of our plugin, and we knew that our plugin CSS was fine. It was fine running it through the standard Minify gem or whatever – the grunt task or whatever. We just chalked it up to CloudFlare’s minifier sucking. That was our explanation for that. Yeah, I don’t know. There’s no rhyme or reason to it, I don’t think. Some other features: Force HTTPS, we added that option in there. And another option: Until this release, there was really no way in your theme to ask for an asset. Let’s say you had an image in your theme, hard coded, like an image tag hard coded into your theme. Well, what you would normally do there is you would put in echo get_template_directory_uri and then the path to the image in your theme files, right? Well, that’s where it’s going to get served from because we’re not going through and doing a find and replace on any of that stuff, right? That would just be too taxing on the server to do output buffering, finding and replacing, and all that. We just didn’t bother doing it. But now we have a filter that you can pass in the URL of your asset, like the URL of your image, and the filter will switch that to the CloudFront URL. We specifically made it a filter, so there was some debate about whether we should have a template function to get the URL or not. We decided on a filter. Ian Jones actually brought this up, and I thought it was pretty clever. With a filter, let’s say we disable or someone disables our plugin. WP Offload S3 gets disabled or deactivated. The theme will still work, right? PIPPIN: Right. Yeah, that’s smart. That way you can use the filter without the plugin being active. And so anybody who wants to just natively support your plugin can just pass the filter in and never have to worry about doing a function exist check. BRAD: Exactly. Yep. PIPPIN: Smart. BRAD: Yeah, nice and clean. Yeah, I thought that was a nice way to do it. It would be even nicer if there was a standard filter that WordPress encouraged people to use for that kind of thing. PIPPIN: I think that goes into the discussion of standard action hooks in themes as well. BRAD: Right. PIPPIN: Which, if you want to go read a long history, go find a track ticket on that and it just goes and goes and goes and goes and goes. BRAD: Is that right? PIPPIN: Yeah. BRAD: Oh, man. Good times. Track can be fun and exhausting. PIPPIN: Yep. Yep. BRAD: What else did we do? We published a new blog post. Matt Shaw did a nice blog post about where he compared the WordPress REST API to– PIPPIN: I really like this post. BRAD: –to admin-ajax.php and the performance gap between them. I was actually surprised by the results of this that there wasn’t a bigger gulf in the results. PIPPIN: I have a couple comments on that. I was initially surprised too. I thought it was going to be more substantial. I think there was a comment on the post that mentioned this as well that I think you need to test it with a few more plugins to be sure. Here’s just an example. I checked the other day. The EDD website has 108 plugins active. I bet you our admin-ajax is significantly slower than the REST API. BRAD: Right. PIPPIN: And so I think your guy’s test compared zero plugins compared with a site running ACF, Askismet, Black Studio TinyMCE, WP Migrate WP Pro, WP Super Cache, and Yoast SEO, which is a pretty common set of plugins that most sites are going to see. But I do wonder if once you get in a lot more plugins in there and plugins that are adding things to admin-ajax and doing various things, I wonder if there’d be a bigger gap in performance. BRAD: Yeah. Yeah, it would be interesting to see at least an e-commerce plugin in there with some extensions to that e-commerce plugin. PIPPIN: Yeah. For example, if we could prove that using the REST API endpoint was twice as fast as admin-ajax, like for us in EDD, and on a bigger site that has a log of plugins, has a lot of data, et cetera, then that would immediately be beneficial for us to do that because it could be a substantial improvement for big sites and a small improvement for everybody. BRAD: The gap here is like 40 milliseconds, and that is actually still significant, right? PIPPIN: Oh, yeah. BRAD: It seems like a little, but when we’re talking about milliseconds in the lifecycle of a page load, 40 milliseconds is a long time. PIPPIN: Right. Well, and I mean don’t forget this is on a relatively clean site, not just in terms of the plugins and the stuff that are running, but also the database. Take a database that is significantly larger and imagine that you have maybe post lookups or post meta lookups or user lookups that are happening during admin-ajax. If your database has thousands or hundreds of thousands or millions of rows, that might have a very different impact than on more of a clean database. BRAD: Right. Yep. Agreed. PIPPIN: I think it’s something I would like to test on our site specifically just to see, like, does it give us a signif"
