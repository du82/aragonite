title = "Episode 56: Batch and Background Process - Apply Filters"
description = "In today’s show, we discuss background or batch processing which is used when performing large database upgrades, migrating data, changing data structure, or anything that requires a lot of API calls or database queries. You..."
full_description = 'March 1, 2016 Apply Filters Episode 56: Batch and Background Process Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 36:07 Share Share Link Embed Download file | Play in new window | Duration: 36:07In today’s show, we discuss background or batch processing which is used when performing large database upgrades, migrating data, changing data structure, or anything that requires a lot of API calls or database queries. You want to do this in a way that doesn’t crash your server. There are a lot of different definitions of batch and background processing. Pippin recently introduced a batch process reset tool to Easy Digital Downloads that resets and calculates earnings and sales records. This process is a site administration user action, and it displays a progress bar as it proceeds. If there are 1000 records, they do 10 at a time, so there are 100 batches. A good example of background processing is SearchWP by Jonathan Christopher. When the plugin is installed it creates a database that is an index of everything on the site. The plugin shows a progress bar of the indexing process, but if you close it the plugin continues indexing or processing in the background. WP Offload S3 goes through content and updates URLs of media files to the S3 URLs. If there are thousands of posts, you want this to happen in the background. It has to be efficient and reliable and not use too much memory. In order to conserve memory, it does one process at a time then starts the next one. This is a background processing system. In today’s episode we talk about: How WordPress 4.3 uses cron to run a term splitting background process Distinctions between scheduled tasks and background processes The difference between a true cron job and running an event through wp-cron What are the characteristics of a good background processing system WP Offload S3 uses a chaining process to conserve memory use How WordPress would be better served if there was a centralized background system built into the core Building in fail safes for critical background processes such as payment processing Resources mentioned in this podcast: SearchWP WP Offload S3 Laravel Techcrunch WP Async Task Background Processing in WordPress by Ashley WordCamp Atlanta 2016 If anybody wants to get started with background processing, the library Ashley wrote is a good place to start. If you have any questions, let us know. We are also excited that Apply Filters is a sponsor of WordCamp Atlanta 2016. If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Welcome to Apply Filters, Episode 56. Today, Brad and I are going to discuss background processing. Background or batch processing is something that a lot of times you’ll use if you need to perform a large database upgrade, migrate some data, change some data structure, or do anything that requires a lot of API calls or queries to the database, et cetera, and you need to do it in a way that is hopefully not going to kill a server or prevent a website from running. Brad, maybe jump in here and see if we can have a basic discussion of what is batch and background processing. I think we should first put out that there are a lot of different definitions of it. There are a lot of things that kind of fit, maybe others that don’t. And so there’s no, maybe, rigid definition of what this is. BRAD: Yeah. I think we could probably start off by kind of just visualizing a process that you might run. Don’t you have a process in Easy Digital Downloads that you guys did recently where you updated a bunch of user accounts or something – wasn’t it? PIPPIN: We do. We actually have a couple. One that we did recently is we introduced a recount tool that allows you to go in and either reset or recalculate earnings and sales stats for products and customers. One of them goes through and reconnects purchase records, if they’re missing, or if stats are incorrect, for all of your customers. BRAD: Right. Does that show a progress bar or anything like that? PIPPIN: Yes. This one is a user or site administrator initiated action, and then it will display a progress bar as it proceeds. This is maybe a little bit more of what we might call a batch process as opposed to background processing because it’s something that it shows a status. I think this is maybe an important distinction for us to make. BRAD: For that to run, do I have to keep that page open and let it run? PIPPIN: Yes. BRAD: Okay, so basically you’re just using ajax calls or something to do ten records at a time or something like that, right? PIPPIN: Yep. Yep, that’s exactly it. Let’s say we have 1,000 records. We do 10 at a time, so we have 100 batches. BRAD: Right. That’s a good example of batch processing, but it’s not background processing. PIPPIN: Correct. Right. BRAD: Because, if I close that thing down, it shuts down the process, and you have to start it up again. PIPPIN: There’s a good example of background processing in the WordPress world. If you’ve ever used SearchWP from Jonathan Christopher, he has a really excellent background processor in there. When you install his plugin, it creates a database that has an index of all of the content on your site. It can show a progress bar that shows how it’s proceeding. But, if you close it, it continues on its own, and so it doesn’t matter whether you’re on the page or if you’re even on your website. That process continues to run in the background, and so that would be a really good example of a background process. BRAD: Right. That’s an excellent example, and I really love the way he shows the progress of that background process. The first time I saw that, I think it was the first time I’d ever seen a background process in WordPress with a UI displaying the progress as well. PIPPIN: If it wasn’t the first one I’ve seen, it was the best one I’ve seen. BRAD: Yeah, exactly. PIPPIN: Yeah, it’s really well done. You should definitely check it out if you haven’t. BRAD: Yeah. PIPPIN: And the plugin itself is just stellar. BRAD: Yeah. Yeah, we use it. Yeah, I think that pretty much takes it, doesn’t it? That pretty well defines what batch processing is versus background processing. PIPPIN: Mm-hmm. I think so. Maybe this will continue our discussion a bit, but do we have a good example of where WordPress Core uses background processing? BRAD: Yes, and it’s a recent example in WordPress 4.3. WordPress 4.3 had term splitting, so I won’t get into it. We talked about the taxonomy roadmap on the show before and splitting terms and all that stuff. In 4.3, they have a background process that goes through, finds any shared terms, and then splits them. That thing uses wp-cron, and it’s got a locking mechanism so that it won’t queue up a bunch of background processes. PIPPIN: That’s a background process introduced in 4.3. Let’s say that you have 10,000 terms in your database and 5,000 of them are shared. It’s going to go through and do ten terms at a time, and this process will continue to run in the background until all the shared terms are split. Is that correct? BRAD: That’s correct. That would be 500 times in that case, so it could take quite a long time for it to run, especially if it’s a low traffic site that hasn’t been configured to run cron every minute or every five minutes. PIPPIN: If this is using cron, what’s the difference between, say — maybe we should have a quick discussion on this. A cron job is not exactly a background process. It is in a way in terms that it’s background, so maybe what’s the relation or different distinction between a cron job that just happens to run behind the scenes and this particular background processing? BRAD: Yeah. We were talking about this before the show. I’m starting to think that, well, the original position I took was that, well, it’s a scheduled task. It’s not really a background process because a background process needs to kind of run at length, and it’s kind of a one-time thing. But really, it’s a process that runs in the background, still. PIPPIN: Maybe a distinction that we could make is that background processing, at least in the realm of, say, upgrading databases or performing a lot of queries, is kind of like a one-time thing in that we have a set of data, and we need to perform some kind of manipulation on it. Once we’ve gone through all the data, we’re done, and we don’t need to run this again. It’s not something that’s going to run every single day forever. It’s going to run until it’s completed, and then we’re done. BRAD: Yeah. I guess someone might argue also, though, that if you schedule a post in WordPress that it’s just going to run that one time to publish that post, so it kind of is like a background process too, so I don’t know. PIPPIN: Yeah. There’s definitely some overlap. BRAD: Yeah, I don’t know if there is a distinction or not. The background processing in core that’s in there now for term splitting, it’s kind of interesting the way they did it. It does a batch of ten; it looks for ten shared terms. If it doesn’t find any, then it just sets some flags that it’s already done the term splitting, and then it cleans up a couple of things that it stuck into the options table, so it cleans that up. But, if it does find some shared terms, it’ll split those, and then it’ll schedule wp-cron to run again in two minutes. In your example, you said 5,000 shared terms. Doing 10 at a time, so that’s 500 times it would need to run. That’s 1,000 minutes. I don’t know how many hours that is, but that’s quite a few. That’s only if wp-cron is configured to run every two minutes. If wp-cron isn’t set up to run every two minutes, it could take even longer than that. PIPPIN: Yeah, so on an active site that has consistent traffic throughout the day, it could take up to 16, 24 hours if you have approximately that many terms. BRAD: Right. Which, for this, for this particular example is perfectly fine because splitting terms is not high on people’s priorities list. PIPPIN: Right, it’s not something that has to happen immediately. BRAD: Exactly. PIPPIN: This uses the wp-cron system. I think most WordPress developers know that wp-cron is notoriously finicky, and not necessarily for any fault of wp-cron. It’s just because of the way the system works and, because of a huge number of less than stellar hosting systems out there, it can be a little bit unreliable. Do you think there are disadvantages to relying on wp-cron for a background process like this? BRAD: Yeah, I think there is. Maybe you should explain. Do you want to quickly explain the problems with wp-cron and basically how it works, like in its default state, and then how you can configure it to maybe be a bit more dependable? PIPPIN: Yep. Okay, so let’s first cover really quickly how cron itself works on a server, normally. Cron is a scheduled task system so that, let’s say, you want to run an action every single hour. What happens is the server knows that you want to run that task, and it executes the task from the server. Many times that’s simply calling a URL. It executes it, and it’s initiated by the server itself, which is very, very important. That’s how standard cron works. Wp-cron doesn’t have the ability to or there are limitations on setting up a true cron job on a server, so it has a kind of roundabout way of doing it. What it has is, basically, when you schedule a cron event through wp-cron, it stores that event in the database with a time stamp. It says this is the time that it should execute. Then, every single time your site is loaded by a visitor, WordPress goes and looks to see, "Do I have any scheduled events that need to occur?" It queries the database and says, "Okay, I have a scheduled event that needs to happen right now. Let’s run it." BRAD: Right. Except if you have a low traffic site. PIPPIN: Right, and so here’s where the problem comes in. Let’s say, for example, that you schedule an event at 5:30 p.m. tomorrow. However, your site is low traffic, so the first visitor that loads your site at 7:30 p.m. the next day, because there was no traffic to trigger the cron to run at 5:30, the cron job gets missed. What happens then is, at 7:30, WordPress says, "Oh, look. I missed this event. Let’s go ahead and fire it. It’s better to run it two hours late than to not run it at all." This is the reason that scheduled posts in WordPress are notoriously unreliable for scheduling exactly when you want them if you have a low traffic site. If you have a high traffic site, it works pretty well because, if you have people loading your site every minute or every couple of minutes, most of the time you can rely on wp-cron pretty well for things like that. One of the ways that people fix wp-cron is they set up a true cron job on their server that fires an actual request to the wp-cron.php file every five minutes, every ten minutes, every minute, or something like that, so it simulates a request to load the site, which then fires off the scheduled event system in WordPress. BRAD: Yeah, and that usually works pretty well, right? PIPPIN: Yeah. BRAD: Yeah. There’s another problem with wp-cron in its default state, so without setting the server cron job. That is if you have a really high traffic site. Let’s say a cron needs to run, and three people hit it at exactly the same time. That cron will run three times because of the locking mechanism. If three people hit it at exactly the same time, the lock hasn’t been set for those three requests, and so it actually will fire the cron three times. That’s a huge problem on high traffic sites as well. A huge problem for your server too if you have three processes running that really should only be one running. Yeah, I think that might be a problem here as well because the term splitting is using a wp-cron. They do have a locking mechanism, but I don’t see how a race condition would be avoided. I took a quick look at the code. It looks to me like it could end up spawning three instances. If three people hit at the same time, it could try to split the same terms three times, but I think that would probably be okay. PIPPIN: Yeah. I think that would be okay, and I would guess that, in terms of the decision for how the term splitting was done, is that it’s a minimal enough risk that it’s okay. It’s something to be very aware of if you were relying on wp-cron or similar to perform very, very important actions. One example of that would be if you are processing payments through cron. If you need to initiate a charge or something like that through an API, be very careful about using cron or something like that because of the possibility that you might create duplicates or run into a race condition because of high traffic. Race conditions are a whole lot of fun. BRAD: Oh, yeah. I just can’t wait u'
