description = "Welcome to Apply Filters, Episode 55.  We’d like to let you know that we do have an open sponsorship available. You can sponsor an episode, a series, whatever works for you –  check out our Sponsors..."
full_description = 'February 18, 2016 Apply Filters Episode 55: Automatic Renewals, Vagrant vs. Docker, and Varnish Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 56:36 Share Share Link Embed Download file | Play in new window | Duration: 56:36Welcome to Apply Filters, Episode 55. We’d like to let you know that we do have an open sponsorship available. You can sponsor an episode, a series, whatever works for you – check out our Sponsors page for more information on the opportunity. It’s been awhile since our last update episode and we’ve been pretty busy so we’ll do our best to get it all in. Today we’ll also be talking about automatic renewals for our plug ins and the challenges of implementing automatic renewals for code. Pippin’s update: Pippin returned from New Zealand after a two week trip to visit his teammate Andrew Monroe, who works on Easy Digital Downloads and Affiliate WP with him and is the master behind the site design for Affiliate WP, Pippin’s Plugins, and Restricted Content Pro. While down there, he expanded his team by two. He also brought on a developer to do some work on the next version of Restricted Content Pro. All these additions have been instrumental in getting the recurring payments plugin for EDD built. He’s also added an update to WP for Sign-Up Referrals and is now available for free download. Brad’s Update Just welcomed a new full time developer, Matt Shaw. They just did two major releases last week, the first was Assets Add-On 1.1 for WP Offload S3 and it’s a big improvement. Ashley wrote a blog post about the release. They also released a Multi Site Tools Addon 1.1. It allows you to push a subsite from a multisite install to a single site install, so basically spin out a subsite as it’s own standalone. And it goes the other way-from a single site install you can pull in a multisite install. Brad’s team has also been busy blogging, a recent one comparing Vagrant to Docker, one of the most popular recent posts. Ashley did a post and published a library on Github for doing background processing on WordPress themes, Jeff did a review on WPPusher, and Brad’s looked into Varnish Cache. They also had the opportunity to check out the Day of Rest Conference on which they’ve written a review. In today’s episode we’ll will talk about automatic renewals What exactly is an automatic renewal Combining licenses into one key Issues and solutions with Paypal Resources mentioned in this podcast: Sign-Up Referrals Plugin A Day of Rest Review Vagrant Vs. Docker Background Processing on WordPress Themes Varnish If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. BRAD: Welcome to Episode 55. This time Pippin and I will be talking about whether or not we should have automatic renewals for our plugins and the challenges of implementing automatic renewals in code. I guess we’re going to give our updates first, and it’s been a long time, right? How are you doing, Pippin? PIPPIN: I’m doing good. It’s definitely been a long time since we’ve done an update. Our last episode was with Carrie Dils, and we kind of jumped right into the subject matter there, so I know we’ve been busy for the last, well, it’s been at least a month to a month and a half since we’ve done an update. I’m sure you guys have been just as busy. BRAD: Yeah, man. I’ve got all kinds of stuff to share. I had to cut some stuff out. PIPPIN: Yeah, we can’t get everything in either. BRAD: Yeah, it’s right. But first, I just want to mention that we have a sponsorship spot available for kind of like ongoing, like if you want to sponsor our show for X number of episodes or kind of semi-permanently, we have a spot available. PIPPIN: Or a single episode. BRAD: Yeah, or a single episode. Whatever. PIPPIN: Just shoot us an email from the website, especially if you have a product or a service that you would like us to check out. We’d be more than happy to review it. BRAD: Cool. What have you been up to, then, Pippin? PIPPIN: Well, as I mentioned in the last episode, I got back from a trip to New Zealand. Maybe our last episode was right before I went to New Zealand. Dang! Now I don’t even remember, but I went to New Zealand for about two weeks. My wife and kids and I went down, and we visited my teammate Andrew, Andrew Monroe, who works on Easy Digital Downloads and Affiliate WP with me. He’s also the master behind all of the site design for Affiliate WP, Pippins Plugins, and Restrict Content Pro. Went down and visited him and visited, just explored New Zealand for a while. It was awesome. BRAD: Cool. Were you on the north island or the south island? PIPPIN: North island, so we were in Auckland, which is one of the main cities, and we stayed in Auckland the whole time. We ventured out and went to various places. BRAD: Okay. I did quite a bit of touring around the north island. I haven’t gotten to the south island. PIPPIN: Oh, fantastic. BRAD: Did you check out Tulum while you were there? PIPPIN: No, that doesn’t ring a bell. BRAD: I think it’s called Tulum. I might be wrong. That’s where I did a skydive. Tulum is like a big crater, basically. It was like the biggest — you know what? It’s not Tulum. Tulum is in Mexico. PIPPIN: Slightly different part of the world. BRAD: Yeah. No, it’s something like that though. Anyway, I’ll describe it. It’s like this giant lake that was created by the largest volcanic eruption ever recorded. PIPPIN: I have heard of that. BRAD: The Chinese, in ancient times, recorded it in their history books and, at the same time, the Roman Empire did as well. It was a huge event. There it is: Taupo, Lake Taupo. PIPPIN: I’ve heard of that. BRAD: Yeah. PIPPIN: I think Andrew mentioned it to us and was definitely an option to go look at, but we didn’t make it up there. BRAD: It’s pretty far from Auckland. PIPPIN: Sure. I really want to go back now. I want to go explore all of the south island and more of the north island. It was a great time. Definitely looking forward to going back again. One of our other contributors is down there, Lisa Gibson. She does a lot of work on Affiliate WP and starting to do more on EDD and the other projects as well, and so she’s also in Auckland, and got to go meet her face-to-face for the first time, and it was nice to put a face to a name. It’s a good time. While we were down there, we also expanded our team. We added two new part-time support people to Easy Digital Downloads. BRAD: You just went to New Zealand and just started hiring the first people that you saw or what? PIPPIN: Well, one is in the U.S. and one is Canada, so I had to leave the country to hire them. BRAD: Okay. PIPPIN: Yeah, so we went down, and it was actually kind of unplanned, but we had an impromptu team meeting and just decided, "You know what? We’re a little overwhelmed. We need more people onboard. We need to get some more help in support," and so I sent out some quick messages, and we got a couple of people interested. We had them going the next day. BRAD: Are those people that were already contributing somehow to EDD? PIPPIN: Yes. Yes. Barbara Atkinson, she joined us. She is the developer of a theme called Square Code that’s been on ThemeForest for a while, as well as many other themes. She and her husband run a themed business called Creative. Square Code is actually an EDD marketplace theme, so she was already very well versed in EDD, knew the system pretty well, and so it was a no-brainer pick for us. Then the other one is Phil Johnston, who is the owner of Mint Themes and Mint Plugins, and has also done a lot of EDD work over the last couple of years, and so again was pretty much a no-brainer pick when both of them emailed back that they were interested. And so, they’ve now been working in the support for EDD for three weeks now, and everything is going great. It’s made an amazing difference. It actually was just kind of cool. I wanted to look and see what does adding two people do to our stats in terms of, like, our ticket stats. I realized that it has improved the number of emails that we send out by 30%. It has increased the number of tickets that we close by 30%, and has decreased the number of tickets that each individual person handles by like 30% or 40%. BRAD: Wow. That’s impressive. PIPPIN: It was definitely, I think, the right move for us at the time. We also, about the same time, or actually just a little later, a couple of days ago we brought on another part-time developer to at least do a four-week development period to work on RCP (Restrict Content Pro) for about 15 hours a week to do some major improvements and see if we can get our next major version pushed out in the next month or so. That will be great as well. All of that has also been very, very helpful in allowing us to get a big project wrapped up, which has been the rebuild of our recurring payments plugin for EDD that we’ve had. We’ve had a recurring payments plugin for EDD for nearly three years now, but it was always kind of lackluster. It never did quite what I wanted. To me, it felt like an NVP and not much more than that. BRAD: Was that plugin, were you using that yourself on your site? PIPPIN: We have never used it ourselves. BRAD: Okay. What do you guys use then? PIPPIN: For which? BRAD: For automatically renewing licenses and stuff. PIPPIN: Well, that’s a brand new thing, which I guess we’re going to get into here in a little bit. That was one of the reasons for completely rebuilding recurring payments. BRAD: Oh, right, so people don’t actually automatically renew. They get the email, and then they manually renew. PIPPIN: Right. Our license renewals have always been manual. BRAD: Right. PIPPIN: We’ll get into this discussion a little bit, but we’ve wanted to turn them into automatic renewals. In order to do that through Easy Digital Downloads, we needed to rebuild the system to make it not just possible. It was already possible, but we needed to make it a whole lot better. It had some serious weak points and some issues, and so we decided to rebuild it from the ground up. We basically said, "Let’s ignore backwards compatibility. Let’s ignore everything that was the plugin, and let’s build it the way that we want it to be. Then, after it’s done, let’s see what we can do about backwards compatibility." That was kind of a cool experiment for us because we’ve never done it that way. We’ve always gone with the, "We’re going to maintain backwards compatibility throughout the entire development process." In this particular case, we decided that the changes that had to be made were so drastic that we would cripple ourselves if we did that. BRAD: Right. Was it also a matter of looking at how many people were using it and was that a factor? PIPPIN: No. BRAD: No? Okay. PIPPIN: No. BRAD: There are a lot of people that are going to– PIPPIN: Recurring payments is in our top three most popular plugins. BRAD: Okay. PIPPIN: Yeah, so it’s a huge plugin for us. This rebuild is going to dramatically boost it much, much further because, honestly, it’s not even the same plugin. We actually considered even launching it as a new plugin. Ultimately, the reason we didn’t is because we wanted to make sure that every existing customer could still get access to it without us having to do a bunch of work to add things to their accounts and such like that. BRAD: Right. Are you going to release this and just tell people that currently have it, "You can’t upgrade yet, but we’re working on it," kind of thing? PIPPIN: Well, we’ve done a few things. Number one, I told you that we broke backwards compatibility, and it’s kind of a lie because, after the fact, we went through and it all works. We built an upgrade routine, and it all works. We’ve tested migrating over 20,000 subscriptions on a site to the new system, and it works perfectly. One of the main challenges is that the original plugin only supported one subscription per user account, and we wanted to support multiple subscriptions per user account. Well, to do that, we decided that the best option — the old version stored, basically, subscription data in user meta, so it gave them an expiration date, a status, and a couple of other things. We decided to move everything to a custom table, so we have precise control over our data schema, and so we took all of those records from user meta into a custom table. We took records from our payments data, which is stored in WP Post and a couple of other places, and moved it all into a custom table, and so that was a migration routine that we had to do. We also had to go in and account for, because the old system was, to put it frankly, really crappy, we found that we had a lot of cases where we’d have subscriptions that have missing data, so they wouldn’t have a payment profile ID from Stripe or PayPal. It was just missing for some reason. And so, in our upgrade routine, we built out calls to the actual Stripe and PayPal APIs to go and retrieve that information so that we can not only move data, but fix data as well. BRAD: Oh, yeah. That’s really nice. PIPPIN: There is a couple of places where we have broken backwards compatibility, but only on a very minor scale. BRAD: If you could let people know about that somehow, like by showing a little notice after they run their migration that says, "Oh, by the way, we fixed these things that you didn’t even know about," because you’re doing it. But, if you don’t let people know, they’ll never know that you’ve done this awesome extra work. PIPPIN: Yep, that’s absolutely true. BRAD: Yeah. PIPPIN: Yeah, we should probably consider doing that. BRAD: Yeah, it seems to me communicating that you’re doing something awesome is always the part I feel like developers always leave out because it’s extra work to add that notice, so why do it. PIPPIN: There are a few things that we did break backwards compatibility on in terms of a couple of code things. We tried to make them work as best we can, but there are some nuances to it. For example, we had some helper functions that would retrieve a customer status. Well, suddenly if you have one subscription and now you have five subscriptions on a customer, what status do you retrieve? Do you retrieve the status of the first subscription or the last subscription? There were a few things like that. We ended up writing up a big blog post that detailed every single change that we made that was breaking or could affect people in some way, and published that on our developer blog. We’ll put that in the show notes. Then we also wrote up a preview post recently that just shows all of the new things that are coming in the plugin and very excited about it. It was nice to finally get it built. It’s been about a six- to eight-month process, plus another six months of kind of planning. The planning for this releas'
