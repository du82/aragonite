title = "Episode 58: Releases, Growing Our Teams, and the Dangers in Assumptions - Apply Filters"
description = "In this episode of Apply Filters we both update you on our projects. We’ve both made exciting progress including Brad’s upcoming Costa Rica trip (a goal of his for 2016). Listen in as we discuss..."
full_description = 'April 5, 2016 Apply Filters Episode 58: Releases, Growing Our Teams, and the Dangers in Assumptions Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 40:10 Share Share Link Embed Download file | Play in new window | Duration: 40:10In this episode of Apply Filters we both update you on our projects. We’ve both made exciting progress including Brad’s upcoming Costa Rica trip (a goal of his for 2016). Listen in as we discuss releases, support, staffing challenges, and much more. Special thanks to our sponsor Gravity Flow, check them out here and follow them on Twitter. Episode Highlights: What goes into a release? Providing support in multiple time zones. WordPress site setup with one command? New team members Thoughts on working from an in-home vs. out of home office Migrating to a subscription model The challenges of managing an outsourced developer. BIG changes for RCP Also Brad shares his experience with a lesson in “Don’t make assumptions.” Resources: Accelerated Mobile Pages Project (AMP) Check out the new site for Restrict Content Pro Follow Brad and Pippin on Twitter. If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Welcome back to Apply Filters, Episode 58. Before we get started, I want to give a quick word about our sponsors. This episode is sponsored by Gravity Flow. It’s an advanced add-on for Gravity Forms that allows you to automate your business processes whether you need to set up workflows for purchase orders, job applications, admission forms, project initiations, vacation requests, or any other kind of workflow that involves advanced feedback loops, approvals, et cetera. Gravity Flow allows you to do this pretty easily while also leveraging the power of Gravity Forms. It’s a really powerful add-on, and you can find out more at GravityFlow.io. They’re extremely generous to sponsor this episode, so be sure to give them a thanks through Twitter, their website, or any other way you feel like getting in touch with them. BRAD: Thanks! Thanks, Gravity Flow. PIPPIN: Okay, Brad. What have you been up to? BRAD: Yeah. Lots. We’re actually in the testing phase right now for Migrate DB Pro 1.6, which is a bit UI update, so we’re getting close. Probably the next couple weeks, we should get it out, unless there’s some crazy thing that comes up. PIPPIN: How long has this version been in development? BRAD: Way too long. It’s been, I think, six or eight months. It’s been way too long. What happened was I added way too many new features to that one release, and so that’s why it took so long. This year, we kind of minimized the number of new features going out in a release, so we can get more releases out sooner. PIPPIN: I think that’s a really smart way to do it. I think that’s probably something that every developer of major projects encounters at some point. I know we’ve run into it before. As a developer, my favorite releases are those that are large releases, but they don’t necessarily look very big because we’ve just made a ton of improvements that they don’t go unnoticed, but they’re not in-your-face improvements. BRAD: Yeah. It’s an ongoing challenge too because, as you’re working on a release, you might start out with a nice, small scope for the release, and then things come up. People report bugs or whatever, and they could have wide-ranging implications that you have to overhaul this or that. Then it’s just like things tend to kind of snowball, right? PIPPIN: I think our next major release for EDD has something like 100 issues milestoned for it, and we’re going to have to go through and trim those down to maybe 30 or 40. BRAD: Right. PIPPIN: It just happens. BRAD: Yeah. Sometimes we do three or four passes through our issues and boot them, like boot them to the next milestone. PIPPIN: Yeah. Oh, absolutely. I know that we’ll usually do kind of like an initial pass when we start working on a release and just get rid of things that we know either are not important or less important, or something like that. Then definitely towards the end of the release, we realized we still have a ton of issues here. We’ve got to figure out what’s going and what’s staying. BRAD: Right. Yeah. Yeah, it’s pretty typical, I think. PIPPIN: Cool. What’s your timeframe for 1.6? BRAD: Well, probably in the next couple weeks. We’re in the testing phase. We’re trying to get an outside QA firm to kind of step into our testing process so that we’re not testing ourselves the whole time, and that does two things. It frees us up and it also gets an outside perspective so that it’s not such a hemogenous environment. We all kind of use the same tools and stuff, so by having someone outside the company do it maybe they’re using something different, a different environment or whatever. PIPPIN: Yeah, that’s right. BRAD: Yeah, we’re trying to get the QA firm slotted in, but it’s been a bit of a challenge so far, so we’re going to keep working with that. We have actually got another developer on trial at the moment, so we’re in the process of hiring as well. PIPPIN: How many developers are you up to now? BRAD: We have six full time, and so this will be the seventh full-time developer. The reason we’re hiring, I was kind of hoping to put a freeze on hiring for a little while, but every time I try to do that it seems like it just happens that we need to hire again. The main reason is that we’ve got four people in the U.K. and two full time in the U.S., but most of our customers are in the U.S. So, for like half the day, those two guys in the U.S. are getting slammed with a huge number of support tickets. PIPPIN: Right, so you need somebody else that’s not necessarily in the U.S., but in the U.S. time zone. BRAD: Yeah, in the North America time zone is kind of what I’ve been shooting for, although I guess Brazil could work too, right? PIPPIN: Yeah, all of South America is on similar time zones, South and Central. BRAD: Yes, so in this quadrant of the earth, basically. Yeah, yeah, that’s a bit of an adjustment because previously I was just hiring based on merit. It didn’t matter where you were located. Now we have to kind of filter down based on location. PIPPIN: Yeah. I know that’s something that we definitely like to get. We have one guy that’s in the U.K. He’s very much part time because he’s very involved with schoolwork at the moment, but I’d love to have another person in that time zone just so that we can help take care of more tickets or issues while we’re sleeping. We have two that are in New Zealand, which is awesome, but New Zealand is yet a different time zone from the U.K. If we could have another one somewhere in the U.K. time zone in that part of the world, then we would have three major times during the day covered, which should be great. BRAD: Yeah. We actually had one guy. Ian was actually in the U.K., one of our Ians. He was in New Zealand, sorry. He just recently moved back to the U.K., so we lost that kind of Pacific Rim coverage for our support. But, honestly, it hasn’t been an issue, and I don’t expect it to be. The amount of customers we have in that area of the world is pretty small compared to the rest. PIPPIN: Yeah, the majority of ours are in the Americas. BRAD: Yeah. People in New Zealand, Australia, and that part of the world, they’re kind of used to waiting for support too. I’m sorry to say that, but it’s kind of true. I lived in Melbourne for a year, and it’s kind of a fact that if you’re watching TV or sports events or something that are going on in the U.S., it’s just everything is out of whack. PIPPIN: Well, we thank every one of you for your patience. BRAD: Yeah, exactly. Yeah. PIPPIN: Awesome. Well, what else have you been up to? BRAD: I think I mentioned before we’re redesigning our site, so I’ve had a front-end coder working on that. We’re in that phase now, and so that’s getting closer. Daniel Espinoza has been taking up the task of working on our WooCommerce subscriptions add-on, which is a custom add-on we use to do our subscriptions, so renewing your license and stuff. It handles that kind of stuff. PIPPIN: Are you guys already doing automatic renewals or is that in progress still? BRAD: That’s what Daniel will be working on. PIPPIN: Cool. BRAD: Yeah, that’s kind of the…. PIPPIN: Is that built off of the standard WooCommerce subscriptions add-on or a completely custom one? BRAD: It’s completely custom. We use the software add-on for WooCommerce that they sell, but we do our own subscriptions add-on completely, separately. Oh, and monthly recurring is the other, kind of the next step after that. I want to be able to do monthly recurring subscriptions with it. PIPPIN: All right. When you get to that phase, we should have a discussion on that because I would love to hear some of your insights, and I’m sure a lot of people that are listening would love to kind of dive into that. I know there’s a lot of questions and caveats that come up when you look at yearly versus monthly renewals, especially for software. BRAD: Yeah. Yeah, exactly. PIPPIN: We’ll have an episode on that when it comes time. BRAD: Yeah, for sure. Also, built a new server for DeliciousBrains.com and moved everything, moved our site over to it. PIPPIN: It’s super speedy. BRAD: Yeah, it’s running PHP7 now and Nginx. I took Varnish out of the stack, so no more Varnish. Yeah, it’s going much faster. It’s running on basically the same hardware, so same number of CPUs, RAM, and stuff. But, yeah, it’s just faster because PHP7, man, it’s so much faster. Yeah, got that running. We’ve been blogging a bit, so Jeff wrote a post on Amp, so Amping Up Your WordPress Site with Google’s Accelerated Mobile Pages. It was pretty interesting. I really had nothing. I had no knowledge of Amp until I read Jeff’s article, so it was pretty cool. PIPPIN: I’ve still only seen some of the summaries. I haven’t really dove into it yet. BRAD: Yeah. It’s kind of a weird thing, Amp, isn’t it? My first, my knee-jerk reaction when I heard about it, I was like, "Oh, that’s just WAP in 2016." Remember Wireless Access Protocol? PIPPIN: I do. BRAD: Back in the day when people had Palm Pilots. They built this second Internet. That’s the other thing. I hated the idea of a second tier Internet. But then I thought about it some more, and this Amp thing is really no different than you consume Facebook in a browser or using a mobile app. There are different views that you could use to consume Facebook. This is kind of just another way to consume articles, right? I don’t really see it as a second tier of the Internet anymore, but anyway. I wrote a summary of PressNomics 4. It’s kind of just mostly highlights, a few highlights, and Matt wrote a really cool post about automating, setting up WordPress sites locally. PIPPIN: Yeah. I read that one, and that was awesome. BRAD: Yeah. PIPPIN: It was fantastic. BRAD: I think most of us have probably thought about doing it. Just never got around to it, right? PIPPIN: I have always looked at it as, you know, if I’m bored some Saturday morning and I want to just get super nerdy, it’s something that I want to do, but it never actually happens. BRAD: Yeah, yeah, yeah. PIPPIN: Now I really want to do it. BRAD: Yeah. Just so people know, you’re able to set up a WordPress site just by running one command, so you could run Matt’s script, which is install.wp. Then you give it a site name, and then it’ll create the database. It’ll download WordPress for you. It’ll do everything and set up the site on your local server. That’s pretty cool. I’ve suggested to Matt that he could do additional ones where he automates it some more so like maybe it also configures MAMP for that site and stuff like that, so that’s like completely automated so that you run that command, and then you’ve got your site running and ready to go. Yeah, I want him to do that because then I want it. I want it for myself. I’m heading to Costa Rica next week for a week long vacation. PIPPIN: Fantastic. Which part of Costa Rica are you going to? BRAD: We’re flying into San Jose and then kind of making our way up to the northwest coast in Tamarindo. On the way, we’re going to stop by the volcanos in Arenal. PIPPIN: Arenal is beautiful. BRAD: Yeah. PIPPIN: The whole country is beautiful. BRAD: You’ve been to Costa Rica? PIPPIN: Once. I went when I was in my second or third year of high school. My brother and I and my parents went down for about a weeklong trip and traveled all over the country. I’ve wanted to go back ever since. BRAD: Yeah. Yeah, it sounds good. I’ve never been there, so this will be our first time. And, our first time my wife and I have traveled in four years without any kids, so it should be an actual vacation versus a family vacation. PIPPIN: It’s just your wife and you? BRAD: Yeah, just my wife and I. PIPPIN: Yeah, that’ll be fun. BRAD: It should be good. Anyway, what have you been up to? PIPPIN: We’ve had a few things going recently. This last week has been a bit hectic for me and everybody on the team. We’ve had a couple of very long-term projects that all wrapped up in the last week, and so I’ll tell you about those in a moment. The first thing, we also have been in hiring mode, so we brought on Drew James to come work with us on Affiliate WP full time. Drew was previously working at 10up and was ready for a change. He reached out to me, and we decided it was a perfect fit. BRAD: Yeah, that’s huge. We’ve had Drew on the show before, I think, when he was the WordPress core release lead. Is that right? PIPPIN: Yes, for WordPress 4.3, I believe, or 4.2. BRAD: Right. Cool. PIPPIN: He should probably smack me for being wrong if I’m forgetting what it was, but yeah. We’re pretty excited to have Drew on. He brings some excellent skills to the table, and he’s working on Affiliate WP development full time, as well as developer docs and other things as we kind of go through and figure out where we want him to focus and what he wants to focus on. We’re pretty excited to have him. He started on Monday, and so we’re through the first week. Two weeks ago, I moved into a new office space. I’ve worked from home in my home office for almost ten years, ever since I started freelancing. I guess I would have been in college working from my dorm room, then from my apartment, and then from my house, up until about two weeks ago in my home office. I decided to go ahead and rent an office space in the downtown area of the city I live in and move my office out of house for the first time. I’ve been here for about a week and a half, and it’s been an interesting change, for sure – mostly good. I’m enjoying it a lot. I’ve always loved working at home. I love being around the family the whole time and having everybody there. It’s been different being by myself, comple'
