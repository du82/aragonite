title = "Episode 68: Plugin Uninstalls, Companies are People, Apple, and Updates - Apply Filters"
description = "Today’s episode is brought to you by SearchWP. This is a WordPress plugin. Its main feature is the ability to create a custom search engine specific to your ecommerce product, health documentation or other content..."
full_description = "September 20, 2016 Apply Filters Episode 68: Plugin Uninstalls, Companies are People, Apple, and Updates Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 42:53 Share Share Link Embed Download file | Play in new window | Duration: 42:53Today’s episode is brought to you by SearchWP. This is a WordPress plugin. Its main feature is the ability to create a custom search engine specific to your ecommerce product, health documentation or other content on your website or server. You can take a free three-day email course by visiting searchwp.com. Brad’s Update Although it’s in the works, WP Upload S3 1.2 hasn’t been released yet. They had to delay the release because there were issues having to do with uninstalling and installing it. They’re going to trickle the release rather than push it all at once, and that should happen in about a month. Pippin and Brad had a conversation about common issues with plug-ins being deleted by users but still leaving data behind. Pippin’s Update Pippin had three big updates go out last week. EDD Message has some upgrades pertaining to how emails are sent within the platform. Upload File allows people to upload files more easily. Finally, version 2.5 of Stripe Gateway for EDD led to some improvements with Stripe checkouts. Some of the topics discussed include: NinjaForms 3 released earlier this month Dot Org forums were migrated to a new version of dB Press. ManageWP was acquired by GoDaddy A new 2017 WP business theme was announced. iPhone 7 has killed off the headphone jack. iOS 10 was released. watchOS 3 was released. Stripe is working with Apple Pay. Slack has a new beta version available for download. Links and Resources: Apply Filters Episode 44 NinjaForms 3 Carrie Dils Blog Post Joshua Strebel Blog Post If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. BRAD: Welcome to Episode 68. This time Pippin and I will be talking about what we’ve been up to and touch on a whole bunch of news. But first– PIPPIN: This episode is sponsored by SearchWP, a powerful plugin for WordPress that dramatically improves the default search engines inside of WordPress. One of the main features it has is the ability to build custom search engines. For example, you could build a search form that’s specific to your e-commerce products or your health documentation or any other kind of content that’s on your website. It even has the ability to search within PDF files, office documents, and other kinds of files on your server. SearchWP right now has a free three-day email course that you can sign up for from SearchWP.com that will help explain how SearchWP can improve your site. We had Jonathan Christopher, the creator of SearchWP, on Apply Filters back on Episode 44 if you would like to listen to an interview with him, and be sure to thank him for sponsoring this episode and upcoming episodes by going to SearchWP.com and checking out the plugin. BRAD: Nice. Well done. PIPPIN: We use it on all of our sites. It works really, really well. BRAD: Yeah, we do also, and we use it to power the search on DeliciousBrains.com for the documentation. PIPPIN: Nice. And you know not only is SearchWP an awesome plugin, but he’s also just a darn good guy. BRAD: Yeah, he’s all right. PIPPIN: Always makes me happy when you have a great product supported by a great person. BRAD: Yeah, that’s right. PIPPIN: What have you been up to, Brad? BRAD: Well, actually, WP Offload S3 1.2, I think we talked a bit about that last time about what was in that release. Well, it hasn’t been released yet. We actually delayed the release, and it’s not because there’s anything wrong necessarily with the release itself, but with uninstalling and installing it. The way we were planning to release it is to allow our customers to download it from my account, by not actually push the update to people’s dashboards to kind of trickle the release out kind of gradually rather than kind of push it out all at once. Have you ever done that, Pippin? PIPPIN: Not really. BRAD: No. PIPPIN: But I’ve seen people do it. I know it can work well. BRAD: Yeah. Gravity Forms did it recently, and I was like, huh. I liked that idea that you kind of trickle the release out rather than do one big release and everybody gets it. This way they had to download it from my account and upload it to their dashboard kind of manually. PIPPIN: Trickling that out disables the auto updates? BRAD: Sorry? It disables the auto updates? PIPPIN: I don’t use the auto updates for to update…? BRAD: Yes, exactly. PIPPIN: (Indiscernible) BRAD: Yeah, if you wanted to update, you have to do it manually kind of thing. PIPPIN: Got it. BRAD: Then later on we would turn on the automatic updates, so you could get it then. PIPPIN: Kind of, hey, let’s get the people that are very serious about updating, get them updated to, in a way, beta test the update, and then, once everything is confirmed to go well, we release separately. BRAD: Yeah. PIPPIN: That’s kind of the idea? BRAD: That’s the idea. Exactly. And so the problem with that idea, though, is: What would you do if you did manually upgrade? Well, you would probably go to your dashboard to the plugins page, deactivate the plugin, delete it, and then upload the zip of the new version and activate it, right? A lot of people would do that. Well, unfortunately, when you deactivate or when you delete the plugin, it will actually delete the data as well, so it would blow away all of their related data, all their WP Offload S3 data — you know, uninstall the plugin. And so what we ended up doing is we released a– PIPPIN: That’s because you have uninstalled a PHP file of the plugin? BRAD: Yeah, we have uninstalled that PHP. Yeah, we had. We just released a point release that removed the uninstall features so that people won’t lose their data. We were planning to do that in 1.2 anyway, but then it’s too late, right? They’ve already installed 1.2 the manual way and lost all their data, so we had to do this point release first. We did that, so we’re actually just waiting now to release that. We’re just waiting, like, probably four or five weeks until everyone upgrades to the point release, and then we’ll release 1.2. PIPPIN: …this a while ago in EDD. I think it’s now been about two years ago. What we ended up doing was adding an option to our settings screen, like a checkbox, basically. You had to enable the deletion of data. Now, this is still a little bit misleading because even if you have that, so basically … you say, I want to delete all the data on install because we have found the number of people that delete a plugin and then upload a new version is a lot higher than we originally thought it was. And people get really mad when you delete all their e-commerce data. BRAD: Yeah. PIPPIN: Understandably. BRAD: Yeah, understandably. Yeah. PIPPIN: So we added that option. But it’s still a little bit misleading because even if you have that option enabled or disabled and then you include a check for that option and uninstall before doing anything, there’s no UI feedback to a user. Like when you go to delete a plugin, it still says it’s going to delete all its data even though it’s not going to. BRAD: Right. I see. No matter what you check or uncheck in the settings, it’s always going to say that it’s going to delete the data because the uninstall.php is there. PIPPIN: Right. BRAD: Yeah. PIPPIN: And it detects uninstall PHP file. BRAD: Right. Interestingly, in WordPress 4.6, that prompt that used to show up on kind of like a separate page, I think it was the page of sadness or something they called it. PIPPIN: Page of bleakness, I think is what it was. BRAD: Yeah. Well, it no longer goes to that page any more. You get a JavaScript popup that asks, are you sure you want to delete whatever the plugin name is and its data. That “and its data” shows up no matter what now, even if the uninstall is there or not. And so I opened a Trac ticket about this. The feedback was kind of, you know, somebody said that just because the uninstall is there doesn’t necessarily mean that it’s actually going to delete the data. That was your point, so I’m not sure what the solution is there. PIPPIN: I kind of want — I looked over your Trac ticket just before we jumped into this episode, and I’m kind of tempted to dive onto it and see if we can hopefully make something happen with it because I would love to have that message conditional. I kind of feel that there should be a filter or some method for a plugin to actually indicate whether uninstall.php will do anything because the simple presence of uninstall.php is really crappy, to be honest. Users should have an option to delete data, but not be required to delete data. Right now it’s very binary in terms of the way that WordPress core thinks about it. You either delete it or you don’t. There is no decision by a user to do that. BRAD: Yeah. There’s another ticket much older than mine. I think it’s like eight years old, four years old, basically new in WordPress Trac ticket terms. The point of the ticket is to allow users to delete a plugin without uninstalling. If you read through the comments, I think what people are getting at is that the UI should give them the option of running the uninstall or not running the uninstall. Basically you just have a checkbox or something. The prompt would say, are you sure you want to uninstall this plugin, and then maybe add a checkbox in there that says, I would also like to uninstall the data, or something like that. I think that would be much more clear to the users what’s happening and give them that control over what they choose to do. It seems a little dangerous, at the same time. I don’t think we would even have the option there. If we could put a checkbox there to uninstall the data, I think we would probably still leave it out because it’s just so dangerous to delete that data. I really want them to jump through extra hoops to get rid of that data. PIPPIN: It’s kind of funny. I used to think that it was dangerous enough that we shouldn’t include it. Then the number of people that got irritated at us for not cleaning up after ourselves when they removed the plugin surprised me. I originally looked at it as kind of, well, it’s a lesser of two evils, kind of. BRAD: Right. Our solution to that is to send them to a doc that gives them instructions on how to uninstall the data, and that’s like the extra hoops that they have to jump through. Hopefully those people will be okay with that and they’ll understand that. But, yeah, it might be a case where people are just super not happy with us for leaving the garbage behind. PIPPIN: Right. Well, and I think most of the time what it is, is people that install a plugin and then realize it’s not what they wanted, and so they go ahead and deactivate it. Then they find out that there was stuff left in their database, which is a perfectly legitimate concern. BRAD: Yes and no. I think if they’re going to be trying plugins, they should probably be doing it in dev or staging environment, in my opinion. PIPPIN: I don’t disagree with that. BRAD: Yeah, and then they don’t have to worry about garbage being left behind. They just blow away their database and get the latest live copy. PIPPIN: It’s definitely an area that could use some improvement. That’s for sure. BRAD: Yeah. All right, man. What have you been up to? PIPPIN: Well, we’ve got three big updates that went out this last week. The first one is we released a new extension for EDD called EDD Message. It’s a nice little extension that kind of extends some of the core EDD functionality to a little bit of the CRM territory–just barely–that allows you to send an email to customers, vendors, and also for vendors to send emails to customers directly from inside the EDD dashboard. So like you can go to a customer’s page in EDD and then send them a message. And you can write out a message. You can add your attachments. You can define all your headers. It’s a pretty simple little plugin, but it has a lot of really legit use cases that a lot of people have wanted. The other main use case for it is in like a multi vendor marketplace. We’ve had a ton of requests for vendors being able to communicate with their customers, and so this option now adds an ability for a vendor to email a customer directly from their dashboard. This could happen with or without knowing the customer’s email address. That’s a new extension that’s been released. It was developed by Kyle Maurer at Real Big Marketing / Real Big Plugins, and it’s now available, and it’s pretty sweet. BRAD: Right. We had Kyle on the show. I don’t remember the number, the episode number, but yeah, it was a while ago. PIPPIN: When was that? It was. Yeah, Kyle is a great guy, and he’s been doing a bunch of work for us. He does some support work for us. He does some overall. He participates in all of our team meetings and is really good at giving us really excellent feedback and building some really good plugins. The other thing that we did, we just released a new update for an extension called Upload File. This is an extension that allows customers to upload files onto the checkout page or onto the purchase confirmation page. Imagine for example that you are selling a service where maybe you do logo design and you want somebody to upload the mock ups for the logo that they’re purchasing from you or perhaps like a T-shirt design or something like that. This extension is what would allow you to very easily do that. It got completely rewritten. It’s a whole lot more intuitive. It’s got a few new features. That update went out last week. Then two other things: The first one is we just released version 2.5 of our Stripe payment gateway for EDD. This was a pretty important update that we were really happy to finally have live. Since the very beginning, in EDD, if you processed credit or debit card payments on site, you were required to collect the billing address from the customer. And this billing address was then sent to the merchant processor, so Stripe, PayPal, whatever. A lot of people have always wanted to remove some of those billing address fields or remove them completely. Now there are various arguments for and against removing billing address fields, but a lot of people really wanted to do it, and so we decided to do it. So we’ve new settings that allow you to say, I don’t want any billing address fields, or I only want country and zip, or I want the full address. It now gives the site owners the onus to define the simplicity or complexity of their checkout field, which is pretty important, I think. Then the next thing that we did is we added support for the Strip checkout payment modal window, which is a super slick system from Stripe. I"
