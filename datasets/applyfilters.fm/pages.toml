full_description = "December 5, 2016 Apply Filters Episode 72: WPForms with Jared Atchison Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 53:53 Share Share Link Embed Download file | Play in new window | Duration: 53:53Our sponsor today is Post Status. Post Status is an industry news site that covers the WordPress ecosystem for professionals and enthusiasts. There’s also the Post Status club, which gives you a news-filled email, access to a WordPress directory, a Slack community, member-exclusive deals and so much more. Check them out at poststatus.com. Today we have a special guest, Jared Atchison, the owner of Atchison Consulting and WordPress developer. He’s been writing code for over a decade and growing his business for about five years. He’s also the lead developer of WPForms. Today he gives us some great insights from the perspective of a developer. Some of the topics you’ll hear about today include: Some of the changes and highlights in Jared’s personal life and business since he was on the show two years ago. How Jared would describe WPForms: It’s a form plug-in which focuses on the user and usability. He goes into more detail about what to expect with this plug-in and what sets it apart. What made Jared want to dive into such a competitive market and how he navigated the process of developing and releasing the plug-in. Some of the challenges Jared had when developing WPForms. The primary marketing channels for WPForms; the biggest one is content marketing. Jared’s favorite and least favorite parts of developing WPForms. Links and Resources: Post Status (Sponsor) Draft Podcast Episode 17 with Jared WPForms Behind the Scenes of WPForms blog post WPBeginner Jared on Twitter If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. BRAD: Welcome to Episode 72. Today we are joined by a special guest, Jared Atchison. Say hello, Jared. JARED: Hey, guys. PIPPIN: Glad to have you. JARED: Absolutely. Thanks. Thanks for having me on. PIPPIN: It’s going to be our pleasure. So before we jump into talking to Jared about a bunch of different things, this episode is sponsored by Post Status. Post Status is an industry news site devoted to covering the WordPress ecosystem for professionals and enthusiasts. It is a news site run by Brian Krogsgard, but it’s much more than a news site. He also has the Post Status Club, which gives you access to a special members notes newsletter, which is a handwritten WordPress news and insights email delivered multiple times per week. It gives you access to a WordPress directory. Think of like a LinkedIn style profile where you can go and be listed along with all the other Post Status members. He’s got a Slack community on there and as well as member exclusive deals for people that join the Post Status Club. There’s also both myself and my products from Pippins Plugins, as well as the products from Brad and WP Migrate DB Pro are included in that members deal. Brian also has a podcast called Draft. Post Status is a pretty sweet site, so we really want to thank Brian for his sponsorship of the episode today. I believe all three of us are members of his Post Status Club. Let’s talk a little bit about what does the club benefits give you guys. What do you think? BRAD: I use the email newsletters. As soon as I get it, I usually open it up and see, you know, Brian’s take on news that’s happening in the WordPress community. The way he breaks down the newsletter is just like little — I especially like the little — I can’t remember what they’re called. I think they’re just called notes. PIPPIN: Footnotes? BRAD: Yeah. Yeah, and he just summarizes, like, what it is, so it’s usually a sentence, right? I don’t know. It just saves you so much time than digging around on a bunch of different sites to try to figure out what’s going on. PIPPIN: The newsletter that he sends out is one of my favorites, and it’s actually one of the very few newsletters that I read every single one without fail. One of the reasons that I think it’s so valuable is not just the summary of news that’s happening, but are the insights that he includes with it. Brian has been around for a long time in the WordPress community. I think he’s actually probably one of the very first people I ever got to know inside of WordPress, and so his insights are really, really good on any topic. And so that’s where I see huge value all the time. JARED: Yeah, definitely. For me it just comes down to my time is very precious. Having a two-year-old running around now and having multiple kind of ventures that I’m dealing with and everything, I just don’t have time to keep up with everything any more. I’m not connected all the time, which is for the better, but that also means I don’t have time to keep up with everything. Just having kind of the digest, you know, sent to me in a nice format that’s easily scannable and, of course, his two cents and his long form stuff is great too, but just being able to keep up with everything at a glance and not having to read a bunch of different resources. I mean I still follow like the make blogs and stuff like that, but Brian does an excellent job just keeping everyone informed without having to just invest a ton of time. That’s probably the thing I like most about it, but also I also like the Post Status chat or the Slack. I don’t read it all the time just because of time constraints, but I find particularly the Heavy Dev is one of the channels in there, and I find that really valuable on getting insights from other really good developers. I think all the Human Made folks are in there and some other just really good developers, so just kind of going back every day and reading some of the conversation in there has proved to be a really good asset. Then sometimes in my own development, if I have a question and Stack Overflow is not doing the job or just Google isn’t turning up anything, especially for some of the really oddball technical stuff, I’ll hit up that channel. Usually I’ll get some really great answers that save me a lot of time, so it’s definitely by far totally worth it. BRAD: I see one of your comments in the WP Business channel, Jared. You were congratulating or just mentioning Jason Cohen for his insights on business stuff. JARED: Oh, yeah, that’s the other, my second favorite room is the WP Business. Being in the product space now, just kind of being a fly on the wall in that room, so to speak, it’s really great seeing the different — everyone in there. A lot of people discuss their products and how business is going and their trends for this time of year and how to handle refunds. You name it, there’s been discussion that kind of goes on in that room, and not just for products. For services too, there’s a bunch of agency owners in there. That’s another great room. I just kind of sit in there and, when I get time at lunch or I need a break, I’ll just do some back reading. There’s a lot of knowledge that gets posted in there. PIPPIN: It’s like a constant mastermind. It’s awesome. JARED: Exactly. BRAD: I don’t participate very much myself either, but it’s really nice to have when I need feedback on something. I can just pop into the business channel, ask about a marketing question or something, and there’s just so many knowledgeable people in there. It’s also crazy that it’s only $99 a year to join the club, right? That’s– JARED: Yeah, it’s a no-brainer. BRAD: Yeah, I definitely get $100 a year worth of value out of it. I think that’s — yeah. JARED: Yeah, I pay a lot more for things that I get a lot less value out of. I’ll say that. BRAD: That’s right. PIPPIN: All right. Should we jump in and talk about you, Jared? JARED: All right. I’m ready to go. PIPPIN: All right. We had you on back in Episode 17, which crazily was two and a half years ago back in April of 2014. I know a lot has changed for Brad and I, but also for you, Jared. Maybe give us a quick rundown of maybe what are some of the major changes since 2014, some of the highlights, or major things that you would like to talk about. JARED: Yeah, definitely. It’s crazy because two and a half years ago is forever ago, but it doesn’t seem like that long that, you know, I was on the podcast with y’all talking about all sorts of fun things. But, yeah, since then there’s been a lot with me that’s changed. I’ve since released a plugin that I’m in with, with Syed Balkhi, and so that’s kind of been an ongoing shift that came out earlier this year, officially, and so that’s been the biggest change is kind of going from services to products. Really, yeah, that’s been the biggest one. Since then, on the personal side of things, we had a daughter who is now two. She came around, you know, towards the end of 2014, so I hadn’t experienced that yet either when I was on the podcast. It’s been a lot of changes since then, but all good. I wouldn’t change anything, and I’m very happy with the direction of where things are, both personally and professionally. BRAD: Are you full time on WPForms now? JARED: I am more or less full time. I’m about to basically declare myself full time. As WPForms was released, I was kind of splitting time and still doing client work and everything like that. But it’s now to the point where really just to stay afloat it needs my undivided attention. Luckily the general reception of the plugin has been extremely positive. We’ve been growing month-over-month and everything is the direction we want to see, which has allowed me, moving forward, I’ll be basically focusing on that full-time. I still have some long-term clients that come to me for work and stuff that I’ll still be taking on and doing jobs like that. But as far as new work, moving forward, it’s not really something I’m going to be actively seeking. PIPPIN: How would you describe WPForms to somebody who doesn’t know what it is? Let’s say that they’re a WordPress user, but they’re not familiar with the plugin. They know what plugins are and they know how to use them, but WPForms is new to them. What’s the elevator pitch you give them? JARED: WPForms is a form plugin, our contact form plugin just at its core, so to speak, which really focuses on the user and usability. We all know that there’s a ton of really good form solutions out there. There’s Ninja Forms and, of course, the leader in the forms space, which is Gravity Forms, Formidable Pro. Then there’s a bunch of the free options like Contact Form 7, which is just a monster and has, you know, over a million active installs. And so there’s no shortage of options, but really what we do is we try to focus on doing things, I guess I would say, the right way and in a way that is intuitive and not necessarily providing users with the kitchen sink, so to speak. If a user is looking to be able to just do a ton of different things and just be provided the option to do everything under the sun, at this point we probably wouldn’t be the best fit. But that’s not necessarily who we’re catering to. We’re catering to the mom and pop type shops, the individual users and stuff that just want the plugin to let them install and manage a form, whether it’s a contact form, a simple donation form, anything like that. Just provide them with a really good experience that kind of gets out of the way, but yet provides them with all the basic options that they would expect to kind of handle that. PIPPIN: Do you think that that focus on the simplicity and not trying to do everything under the sun is what sets WPForms apart? JARED: Absolutely. Like I said, there’s a ton of different options and the forms space is very competitive. But I think what has allowed us to differentiate ourselves and be successful, even in a niche that is as crowded as forms, is that we took a different approach that really at this point I would say no one else has quite done or at least not with the focus that we have, which is just providing users with — I mean in many cases it comes back to the WordPress motto of decisions and not options. That’s something that I regularly, as the lead developer of the plugin, am constantly reevaluating when we get feature requests, suggestions, or anything like that. It’s like, okay, well, is this something that’s going to benefit 90% of our users, or is this something that is going to only benefit a small portion, and then for the other portion is this going to be a confusing setting that they’re not going to understand? Those are really things that I evaluate when working on the plugin. So far our users have been very vocal as far as everything is well received. That’s by far, you know, the common gist that we get and feedback is that the users that understand what we’re trying to do, they really like it because they don’t need crazy solutions. They’re not looking for almost a full e-commerce solution, which is what you can do with Gravity Forms. Their pricing and payment stuff is, like, you can do some crazy awesome things. But we’re not trying to do that at this point, so I think that is what separates us. PIPPIN: With the forms market being so competitive, I mean as you mentioned there is Gravity Forms, there is Ninja Forms, there’s Formidable Pro, there’s Contact Form 7, there’s Caldera Forms. There’s numerous others as well. What really got you guys into this? What made you and Syed want to dive into such a competitive market? Was it you saw a need? Was it just you knew that the fishbowl was big enough for another fish? How did this project come about? How did you start? And maybe even how did you and Syed get together on this? JARED: Yeah, sure. The whole kind of story of how this came to be is a fun and interesting story. Syed actually has a blog post if anyone wants to look it up on his blog that’s called Behind the Scenes of WPForms, My New WordPress Plugin, and that sort of gives a little overview with some pictures and everything. I have been doing my freelance consulting now for a long time. I think this is probably year six or probably seven, at least, that I’ve been doing it, so I’ve been well tenured in that regard, and so I’ve been doing that. Years ago, probably the very first PressNomics, this was four or five years ago since PressNomics 5 is next year, I got to be really good friends with Thomas Griffin. I was, at the time, a developer focusing on kind of Genesis oriented projects that leveraged the Genesis framework, and so Thomas basically was about a year behind me as far as, like, getting started and everything. I became really good friends with him and we kind of had like a little private chat. We were always talking about just our current projects and, you know, pinging each other to talk shop and everything like that. A couple years into him doing freelance, he tested the waters with Soliloquy, which is, you"
