full_description = "July 6, 2016 Apply Filters Episode 64: Plugin Updates, Team Retreats, Automated Testing Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 49:40 Share Share Link Embed Download file | Play in new window | Duration: 49:40Today’s sponsor is Network Solutions, maker of Secure WordPress. This platform is great for those wanting the ultimate in security. With 24/7 tech support and the ability to update plugins, backup daily and scan for malware, Secure WordPress is worth considering. Check them out at getnetsol.com/applyfilters. On today’s podcast, we’re talking about our updates and some of the blog posts we’ve written recently that we’ll go more into on another date. Pippin’s Update Pippin released EDD 2.6 next week. He talks about all of the new features, including the native import options for payments and products, the ability to make refund payments easier, and a new customer metadata table. He also tells us about the big update coming to Restricted Content Pro, which entailed rewriting the entire interface to make it more intuitive and user-friendly, added support for payments through Alipay and Stripe, and a new add-ons page. Brad’s Update Brad just got back from a company retreat in Vienna, where they got together to attend WordCamp Europe. He got to meet lots of great people and is looking forward to the next regional retreat, which they decided should happen every year. Some of the topics discussed on today’s podcast include: Why adding more links to your pages can help your readers and users understand more about your product. The pros and cons of testing with several people vs. automated testing. Why refactoring can cause bugs. Brad is getting a new full-time team member who will help with support on Migrate DB Pro. Brad and Pippin talk about some of their recent blog posts. Links and Resources: Alipay Rock-Solid Software Testing Without Hiring an Army Hey WordPress Developer, Your Clients Should Own Their Plugin Licenses The Monster That Is a Poor Database Schema Escaping the Tyranny of My Desk Extending the WP Metadata API If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Welcome back to Apply Filters, Episode 64. Today, Brad and I are going to talk about some of the things that we’ve been up to, a few blog posts that we’ve either written or read recently, some of Brad’s trip to WordCamp Europe in Vienna. But before we do that, let’s have a quick word from our sponsors. BRAD: I registered my first ever domain name in 1999, 17 years ago. Back then there was one place to register domain names, a company called Network Solutions. Many of you probably already know this, but did you know that Network Solutions also has a WordPress hosting platform? They do. It’s called Secure WordPress. It’s a managed WordPress hosting platform with an emphasis on security. They automatically keep WordPress core and your themes and plugins up to date. They have daily backups. They provide malware scanning and removal. And they put your site behind a data center class firewall to protect against zero day hacks and DDoS attacks. They have expert tech support available 24/7 via chat and phone. Network Solutions takes care of keeping your site locked down and up to date, so you can focus on your business. Visit GetNetSol.com/ApplyFilters today to get started. That’s GetNetSol.com/ApplyFilters. And now back to the show. All right, Pippin. What have you been up to, man? PIPPIN: Well, the last couple weeks have been pretty busy with a couple of big plugin updates. We’ve been working on Easy Digital Downloads 2.6, which has been in progress since, I think, January is when our last major release, 2.5, was. It’s been about a 6-month development period, obviously with point releases in between. When we measure our development periods, we usually go major release to major release, so it’s been about six months for that. We got that pushed out last week on Thursday, I believe, and so far it’s been a very smooth release. I’m very pleased. We have done two little point releases, 2.61 and 2.62, since then, but they were really to fix pretty minor issues. They weren’t even necessarily user or customer facing bugs. They were things that we realized that we needed for ourselves, and so we went ahead and pushed out updates. 2.6 is an update that we’re pretty happy with. It does a couple of things that have been on our want list for a long time with two major ones. The first one is we introduced native import options for payments and products. Previously, let’s say that you had a CSV file of purchase records or products and you wanted to import those into your site. We had this free plugin called EDD CSV manager, and it’s one that one of our other team members and I wrote almost three years ago, two years ago, something like that. It worked okay, but it was outdated. It hadn’t progressed along with the rest of EDD, and it was pretty cumbersome and unreliable to use, especially on certain hosting environments. We’ve been wanting to dramatically improve those, and so we did. We’ve introduced new import options that are directly in the core plugin for importing payments and products. They work off of our batch processing API that we’ve used pretty extensively throughout the plugin now so that they’re designed to be able to handle massive CSV files, hundreds or thousands or many, many thousands of products in the majoring of hosting cases. There are still some environments where we’ll have trouble processing massive files, but usually it works pretty well. BRAD: I’m just looking at the user interface for this import tool. Has this been updated or has always been the same UI? PIPPIN: Are you looking at the new one or the old one? BRAD: I’m not sure. It’s the screenshot that’s in your release note, so I’m assuming it’s the new one. PIPPIN: Okay, so that’s the new interface. BRAD: Right. PIPPIN: That’s only showing one stage of it. If you go to that screen, the first thing it’s going to show you, it’s going to ask you to upload a file. It’s going to then upload that file using AJAX upload. Then once it uploads a file, it does a couple things. First, it reads all of the columns from the CSV file. Then, two, it also reads the first row of the CSV to get sample data. Then what you’re given is you’re given a list of fields to map. And so for either payments or products, we have each of the fields. If we’re talking about payments, let’s say you’re going to have a currency code. You’re going to have an email address, a mount, a products purchased, the date it was purchased, a status of the purchase, IP address, various things like that. Those are the ones that EDD needs to create the payment. Then you go into a mapping column and you pick each of the columns from the CSV that correspond to the EDD field. BRAD: Is that new or is that what it was like before? PIPPIN: The old UI had a similar mapping system, but it wasn’t as smooth or as reliable. BRAD: Yeah. It looks good, man. This interface looks really intuitive. PIPPIN: We think it’s pretty smooth, and then everything is AJAX, so there’s no page reloads for any of it, including the import process. So far we’ve been testing it, and it’s pretty reliable. We found one little issue with it that we’ll probably have to push out a point release again in a day or so, but otherwise not too bad. There are two or actually three other major features that we added. First was we added support for customer records to have multiple email addresses, so everybody has multiple email addresses – almost everybody. You have maybe a personal email, a work email. Maybe you have multiple work emails or let’s say that there’s a team and so then there’s a billing@. There’s a support@. There’s an info@, et cetera. And so customers very frequently will purchase with multiple email addresses even though they’re the same person or team. We’ve added support for tracking multiple email addresses on a single customer record, and so then, regardless of which email it’s purchased from, it all gets tracked properly, so there’s kind of one canonical source as opposed to having three duplicated customers with different emails. Then we added the ability to refund payments for PayPal Standard directly inside of EDD. It makes the refund process a little less painful. We figured nobody likes processing refunds, but at least we can make it a little bit easier and less painful, so we did that. Then we also added a customer metadata API. Previously, if you wanted to store metadata for a customer such as a second email address, you had kind of two options for where to store it. You could store it on a purchase record or you could store it on user meta. Well, neither one of those were very good because, number one, a customer could have 20 payment records, so you don’t want that metadata duplicated. Then user meta is no good because not every single customer has a user account, so we introduced a new metadata table that you can store metadata for customers now. We had some other things that were just kind of nice little improvements, and you can check them out at the release post. Beyond that, now actually there is one other thing that we did in 2.6. Actually, this wasn’t really in 2.6. It was 2.61 and 2.62. Since about two and a half years ago, EDD has had a usage tracking system in it, so a customer or a user installs EDD on their website and then they are given an option to opt-in to data tracking. When they do this, it sends a report to our site. We log it in a database and then, once a week, their site checks in. As long as EDD is active and as long as they’re still opted into data tracking, their site will check in once a week. We’ve been running this for a while. We’ve collected a whole ton of data from about 75,000, 80,000 websites and it’s been very, very valuable for us. We’ve recently been working at aggregating our data and making it easier to query so that we can use it better. Well, when we rebuilt our internal data system, we rebuilt the database, basically, and migrated it from one database to another database. When we did this, we realized a problem. We discovered that our weekly check-ins were never working, so the only data we actually had was from unique sites. We had 75,000 unique sites that had checked in, but we never had updated data from any of them, even if they had been running for two years because we discovered a couple of bugs in the way that our weekly check-in worked. We figured it out and we pushed out an update that fixed it. We made a couple of changes. Number one, we made it so that any time you install an update now, it fires a check-in. Even if your weekly cron isn’t working, it’ll check in each time you update. That way we have updated information with the EDD version that’s used, the plugins that are on that site, et cetera. It’s revealed some really interesting insights. First of all, we had graphs that we’ve built out that show us the breakdown of things like EDD versions, PHP version, locals, WordPress versions, server system, Apache, Nginx, et cetera. Originally most of our data was not very useful because, since we had about 75,000 websites and some of the data we had added in, things like the local, the server system, and the EDD version were not originally in our data tracking. We added them, so that meant that the only sites that we had that data for were the new ones, which was about maybe 2,000 websites. And so we had another 73,000 sites tracked that didn’t have any up-to-date information about them. What’s been pretty cool to watch is, after we pushed out the 2.6 update, that data has just been flowing in insanely fast. We have a graph that shows our check-in, the number of check-ins per day and, over the last two years, it’s averaged around 652 check-ins a day of data being pushed to our site. Most of those were all brand new check-ins, so that’s about 600, 650 new installs or new opt-ins per day. That’s not per day. It’s around a few thousand a week. Well, the moment we pushed out 2.62, that went from 635 on a graph point to over 2,000, which has then proceeded up to over 3,400. In the last 5 days we have updated something like 6,000 records on our site with up-to-date information about the data tracking, which is going to be very, very valuable for us because what it means now is, over the course of another month or two, as we get more and more sites updated to 2.62 and we get our data tracking working, we will have much more accurate information about the kinds of sites that are running EDD. Now, there’s no personal information tracked. It’s only things like the EDD version, the other plugins installed, the WordPress version, et cetera. But it’s going to start giving us some pretty cool insights that we didn’t have before because our tracking wasn’t working properly. BRAD: Right. As an example of a decision you could make there is you could look at, for example, how many people are using PHP 5.3 — what is it, the lowest one? PIPPIN: Yep, 5.3 right now is 1% of the sites that we know about. BRAD: Right, so if you drop 5.3 support for whatever reason, if you guys wanted to, it would affect– PIPPIN: How many people does that affect, basically? BRAD: Very, very few people. PIPPIN: Right. Well, in a way. All right, so I’m going to give you a couple of examples because I think it’s fascinating. Of our PHP versions, right now we have over 75,000 sites. We have stats on 75,000 sites. Now, 91% of those are unknown. We don’t know the PHP version on them due to that because we didn’t originally track the PHP version. A week ago, that 69,000 was at 75,000, so we know the stats for 6,0000 sites in the course of a week. In another two weeks, three weeks, or four weeks, we’ll have a much better percentage. But just to give you an idea, right now of the sites running EDD on PHP 5.2, there’s 161 known sites. 5.3 is 778 known sites. 5.4 is 2,772 known sites, PHP 7 is 269. The majority of sites right now are running PHP 5.4. Now here’s another one that I think is fascinating, and this is one that’s super valuable for us. We want to make sure that we’re now only catering to the people that we maybe talk to the most or that we’re the most familiar with, a.k.a. English speakers. We want to make sure that we’re international friendly. What do you think is the biggest local aside from English for us? BRAD: Chinese. PIPPIN: Incorrect. Farsi. BRAD: Oh, wow. PIPPIN: Yeah, so Farsi is the number two language that we know of for EDD installs, which tells us something very, very important. We need to make sure that our right to left support is perfect. These are the kinds of decisions that we can make when we start to have this accurate data. I’m really excited for the insights we’ll be able "
