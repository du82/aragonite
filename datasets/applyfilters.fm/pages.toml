title = "Episode 81: Matt Mullenweg - #WorthIt - Apply Filters"
description = "Today, Brad and Pippin will be talking to Matt Mullenweg. Matt is the founder of WordPress and the CEO of Automattic. We will be talking about the history of Automattic and what Matt does in..."
full_description = "June 13, 2017 Apply Filters Episode 81: Matt Mullenweg - #WorthIt Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 36:59 Share Share Link Embed Download file | Play in new window | Duration: 36:59Today, Brad and Pippin will be talking to Matt Mullenweg. Matt is the founder of WordPress and the CEO of Automattic. We will be talking about the history of Automattic and what Matt does in his spare time. We’ll also talk about what Matt feels is not talked about enough inside of WordPress. Some of the highlights of the show include: Matt’s announcement that he will be leading WordPress development: how the CEO of such a large company can lead this huge open source project. The tipping point where Matt decided he wanted to get back into the development side. Why Matt thinks there has been no progress on powering the WP Admin by the REST API and why this is one of his priorities. What Matt would like to see happen with the WP Admin to make it most successful. What Automattic looked like in its early days when the team was only a handful of people, as well as what Matt would change if he could go back in time. How Matt recommends people learn about management and communication. What Matt chooses to work on when he’s working on code and why. The things that Matt is most concerned about today. What Matt feels is lacking attention and interest in the WordPress world. Links and Resources: Automattic Matt on Linkedin Harvard Business Review Andreessen Horowitz podcast Building Jarvis – Mark Zuckerberg blog post Ubiquiti Unify If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Welcome back to Episode 81 of Apply Filters. During this episode Brad and I were joined by a very special guest, Matt Mullenweg, the cofounder of WordPress and the CEO of Automattic. In this conversation we talked a bit about Matt’s recent role as a WordPress development lead and how the progress of the REST API, the new editor, and the other focus features are coming along in 2017. We’re also able to touch on some of the history of Automattic and how it’s changed over the years and look a little bit at what Matt chooses to work on when he’s able to find a little bit of time to code. At the end, we touch a little bit on what Matt feels is not talked about enough inside of WordPress. What are some of the conversations that need to happen? Listen in to our discussion with Matt Mollenweg. Mr. Matt Mollenweg, thank you for joining us today. MATT: Glad to be here today. PIPPIN: All right, so we’re going to have a number of questions for you. Mr. Brad, do you want to start us off? BRAD: Yeah, let’s start off. Six months ago at WordCamp U.S., you made a big announcement that you were starting to lead the WordPress development again. I think people are pretty excited about it, but there was some skepticism as well. I was wondering, can a CEO of a 500+ person company also lead this huge, open source project? Matt, is it possible? Are you okay over there? MATT: It’s definitely, you know, prior, over kind of the year prior to taking that over, I did make some changes to make it more possible, to make more time because it does take a good amount of time. I want to make sure that, just personally, I had set aside that time. That’s why, for example, I stopped doing new investments through Audrey Capital because I need to make the time to essentially invest in the WordPress community. In terms of how it’s going is, I think it — I’ve been very happy with it thus far. There’s a great set of folks. The focus leads have been really fantastic to work with, and that’s part of the key to how this model is going to work. Incremental, you know, when you think about it, I’m already running something that’s over 550 people, so adding an additional 20 to 40 people sort of working with to make some cool things happen actually isn’t that different from what I do, what I spend the rest of my day doing. BRAD: What is your role exactly right now in the WordPress? Are you leading WordPress development as a product manager? How does it work? MATT: I don’t know if there’s necessarily an existing term which maps perfectly to it because it does kind of move from being high and low level as well. I’m looking at track tickets, commenting on things, and reading threads. People are definitely bringing a lot to me that they weren’t maybe bringing to me before. Actually, right before this, I had a great call with a few folks from the theme review team talking about kind of what’s next there. You know the primary thing is these core releases around the three focuses, and so that’s going to be getting the new editor out and getting the customizer out to me are the top, top, top priorities. But beyond that, I think, after the announcement, people started to say, well, these other parts of WordPress that haven’t been really moving or that have been stuck, and time and time again I’ve been finding that it’s not really new ideas. It’s things that were proposed 17 months ago. You know syntax highlighting that ticket is seven years old. It’s things that have been around for a while. We have the good ideas. We just haven’t executed on them. A big part of what I’m doing is debugging, so seeing, why didn’t we do it? Why isn’t it done already? Why are things moving slowly when they could be moving faster? The answer is not a simple one. It’s not. There was one thing we needed to do differently and one new policy we should adopt, and one person who was wrong. It’s often very interlocking and very complex. But I think that this year, especially with how fast the editor has been going, we’ll have some very recent and relevant examples to how fast we can move when we really align with each other, when we really decide on priorities, and when people communicate, to do big things. My hope is that–you know we haven’t made any plans for 2018 yet. I don’t know if I’ll be able to do this beyond this year–we’ll have kind of a new baseline for our productivity and our ability to iterate and tackle actually some pretty large problems in the WordPress community versus always saying, “Oh, that’s big. That’s hard. It’s a medium level. We can’t work on that,” you know. PIPPIN: You’ve obviously been in WordPress for a long time. Obviously since the beginning. I think, as the project got older and as other ventures like Audrey and Automattic came around, you pulled back a little bit. Now you’ve kind of come back in to that lead role. Do you think there was a tipping point anywhere where you decided, I need to get back in, or at least for a short time? Was it a tipping point, like there was just maybe, for example, the 2015 Community Summit? Do you think that played a role in deciding to come back in? MATT: I’ve been personally frustrated by how long it’s taken to do some things that I think should be relatively simple. Hearing that from other release leads over the past few years, and seeing some of the frustration because we have these rotating release lead philosophy. I would typically interact with that person a fair amount through the course of it, and whether that was Helen or … whoever it was. And so hearing them voice some of the same frustrations, I was like, okay, maybe this is something more with how the project is organized versus something that I personally am having trouble with. We had a couple of years of releases that were a little uninspiring from the point of view of, like, moving the needle forward for its adoption, even though they did a lot of great things and people worked really hard on them, and we closed 700 tickets, and had 130 or 150 contributors. We were beating or we were doing a good job on a lot of metrics that we were tracking, but, on the whole, I think it really started to feel like WordPress was falling behind the state of the art in the world. I think it’s easy to become complacent because we’re far ahead of many of our open source competitors. But, you know, if we think of sort of the state of the art around everything that’s on the Web or on mobile devices, we weren’t necessarily pushing that any more and haven’t for maybe two or three years. BRAD: I wonder if the problem was kind of that there was no vision, no one pushing kind of a vision and, like, things that needed to get done but no one kind of wanted to do them. It’s usually someone at the top that pushes those things through, you know. And so not having that, that could have been part of the problem, right? MATT: I wouldn’t say it’s not having the vision because, like I said, a lot of these things that we’re doing were proposed years ago. The vision was there. It’s a lot of it of execution. I think, if I had to point to one thing that is maybe our both greatest strength and one of our potential Achilles heels, it’s kind of concensus driven decision making, whether that’s in the different teams, like the theme review team and the plugin review team, whether it’s with core, whether it’s with committers, whether it’s, you know. We’re doing hard work often, and work that reasonable people will disagree on around priorities or that, you know, reasonable people might feel like we’re doing the complete wrong thing. When these discussions get kind of heated, it’s easier for people to withdraw or even point responsibility to a committee versus, like, taking something on the vigilance that I think this should happen. I’ll take responsibility, and I’ll also take the heat if you disagree with it. If the 14 years of WordPress has given me anything, it’s thick skin, and so I’m comfortable with people thinking I’m an idiot, saying I’m disconnected, saying whatever, or that this is totally arbitrary or it’s some secret conspiracy to benefit Automattic. I’ve heard it all for over a decade now, and so I can separate that out from more critical or useful feedback that is going to help us build the next version of what we want to do. BRAD: You gave an update. I can’t remember. It was a few weeks back. It was the first quarter check-in update. MATT: Yeah, the beginning of April, so almost two months ago now. BRAD: Right. Right, but one of the things in there that was surprising, I thought, was that there was basically no progress whatsoever being made on powering the WP admin by the REST API. I was personally surprised by that. Why do you think that is? Why do you think there hasn’t been any traction there? MATT: I don’t know exactly. I think that some people who — you know, some of the contributors who had worked really hard to get the content endpoints in aren’t as passionate about getting the content endpoints used necessarily. A lot of the debate for whether to bring those in or not, to me, the only argument against it is, is this something that is actually going to be useful in the real world or be adopted in the real world, because we’ve seen other excellent REST driven APIs in the past not get adopted? A great example would be the Atom API, and that one definitely had support from more than just one vendor. Our content endpoints essentially are like a single vendor API. Atom API was standardized. It was supported by Google. It was supported by us. It was supposed by Movable Type, Typepad, LiveJournal, and a bunch of people who came together, both to create and implement the API. It just didn’t get the adoption. I think that’s a sort of meta question. Secondarily is like, is the API that we’ve created — can we use it for these things or, when we implement it, do we run into something that maybe we didn’t anticipate when purely in the design phase, or using it more like it’s been very successful thus far, which is like developers or agencies doing custom code driven things, you know, where there’s like a custom integration, custom authentication, you know, pretty advanced, I would say, usage of both of REST API and the content endpoints? That is kind of where we’re at. It’s also a little bit my failing as a project lead because, I mean, the fact that it doesn’t and it hasn’t moved ultimately reflects poorly on me as the person leading this for this year. It’s something that I’m going to be looking at priority wise. I’ve been prioritizing the editor, and that will continue until the editor is in kind of an in-trunk state. But beyond that, it’s definitely something on my mind that, when we get to the end of 2017, I want to say that we’ve got some real great first party usage of the content endpoints. PIPPIN: Something like the REST API is definitely challenging because you have this kind of catch 22 where, in order to build it, you need to make sure that you have the adoption, right? I mean because obviously we don’t want to build this massive thing and not have people actually use it that much. But, at the same time, in order for people to actually use it, we have to have it all the way built. If we could look at it and wonder if there’s progress that’s stymied by not having it 100% complete, and this is kind of just an open-ended comment, not necessarily a question, but I think it is an interesting problem. MATT: Yeah. I mean I personally was pushing for us to not integrate it until it was 100% complete, so I definitely see the value of that argument. But something that I try to demonstrate in Automattic, and also I think that is a good community principle for us to keep in mind, is disagree and commit. Right? This idea that even though I disagreed with some of the things going in, the moment it was committed it became — I was advocating for it as strongly as anything else. The fact the historical thoughts or ideas or whatever I had don’t really matter at this point. It’s in, so I want to work to make it as widely adopted and successful as possible. That’s the commit part of it, which is funny because, in an open source side, commit obviously has a double meaning. But if you think about it, you can apply this to all parts of your life. Debate vigorously and have lots of arguments. Bring up all your worries or thoughts or concerns and hash it out. But once a decision has been made and the decision was made to bring the content endpoints in, don’t re-litigate it. That’s not really helpful to anyone. Most of all, don’t sabotage it. It’s in, so let’s make it successful. I don’t want to– PIPPIN: I think that’s a great piece of advice right there. MATT: Yeah. BRAD: What would you like to see happen with the WP admin? Would you like to see, let’s say, the posts listing screen? If we could, if someone could, AJAX-ify that and connect it to the REST API to load in the data, is that something? What could be done there? MATT: When I think of what would make it most successful, something like that I would happily accept, to be honest. Like that would be — it would be nice to have something. There was a lot of talk before, y"
