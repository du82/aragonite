title = "Episode 59: WordPress 4.5 and Imposter Syndrome - Apply Filters"
description = "We would like to thank the sponsor of today’s show, Gravity Flow. Gravity Flow allows sites to automate business processes for internal routing, scheduling, reporting and more. You can go to GravityFlow.io to learn more...."
full_description = 'April 20, 2016 Apply Filters Episode 59: WordPress 4.5 and Imposter Syndrome Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 51:55 Share Share Link Embed Download file | Play in new window | Duration: 51:55We would like to thank the sponsor of today’s show, Gravity Flow. Gravity Flow allows sites to automate business processes for internal routing, scheduling, reporting and more. You can go to GravityFlow.io to learn more. In today’s podcast, we’ll update you on what’s been happening, we’ll discuss some of the great changes that go along with the WordPress 4.5 update, and we’ll talk about the common condition of imposter syndrome. Brad’s Update Brad recently returned from his trip to Costa Rica. It was the first time in four years that he and his wife had been able to get away without this kids, and they had a great time kayaking at the base of a volcano and hiking up a steep, dormant volcano. He purposely took only his tablet, which is uncomfortable to work on, so he’d have a deterrent to spending too much time trying to get work done while on vacation. While he was away, his company released the free version of WP Migrate dB 0.8. He expected that Migrate 1.6 Pro would be releasing by the time this podcast came out. Ian from Delicious Brains put up a long tutorial post about Backbone JS, which is great to refer to for more information about this. The other Iain, aka “Beardy,” wrote a post about using Codeception to automate WordPress plugin testing, which is another valuable resource. Pippin’s Update Last weekend was pretty eventful, as Pippin discovered a big bug in a recurrent payments plugin. This was an emergency situation requiring an immediate fix: There was a fatal error in an upgrade routine that led to incorrectly assigning customer IDs within the accounts of customers using Stripe to make payments. Between finding the problem, fixing the code, contacting the affected customers and cancelling the affected orders, the problem took over 48 man-hours to solve. The good news is that it is finally solved, and no further reports of the problem have been made. Pippin says that in this case, hindsight was 20/20, as it was one line in the coding that was the culprit. Braces were not used on a condition, which is a simple enough error to make, but one that had serious consequences. More pleasant big news is that Easy Digital Downloads just celebrated their four-year anniversary! Pippin wrote a post about it on the Pippin’s Plugins blog. Occurring at about the same time was the one millionth download for EDD! In This Episode Some of the great new features in WP 4.5. These include the capability to have custom logos, filters to add devices, a way to toggle between different screen sizes, better image compression and so much more. We highly recommend reading through the WP 4.5 field guide by Aaron Jorbin and checking out the support forums at WordPress.org to find out even more. All about imposter syndrome, which is the idea that you are an imposter, or inferior to others in your field. This is so prevalent among WP developers, and in many other industries as well. Links and Resources: Building Reactive WordPress Plugins Using Codeception to Automate WordPress Plugin Testing Easy Digital Downloads Is Four Years Old WP 4.5 Field Guide WP Support Forums If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. BRAD: Welcome to Episode 59. This time Pippin and I will be talking about what we’ve been up to, we’ll dig into WordPress 4.5, and we’ll talk a little bit about something called imposter syndrome. But first– PIPPIN: This episode is sponsored by Gravity Flow, an advanced add-on for Gravity Forms that allows you to automate your business processes whether you need to set up workflows for purchase orders, job applications, admission forms, project initiations, vacation requests, or any other kind of workflow that involves advanced feedback loops, approvals, et cetera. Gravity Flow allows you to do this easily while also leveraging the power of Gravity Forms. You can find out more at GravityFlow.io and once again thank them very much for sponsoring this episode. BRAD: Whoo. PIPPIN: All right. Brad, I believe you just got back from Costa Rica. Why don’t you take a few minutes and give us the rundown on how that went? BRAD: Yeah, so it was my first time in Costa Rica, and it was the first time in four years that my wife and I had gone on a trip together without our kids. We were able to do things like kayaking Lake Arenal at the base of a volcano and hiking up a super steep dormant volcano. Some pretty cool stuff, right? You’ve been to Costa Rica, right? PIPPIN: I have, and I went to Mount Arenal when I was there. Was it active? BRAD: It was. You’re not allowed on Mount Arenal. I think it’s just called Arenal Volcano. PIPPIN: Yeah, I think that’s right. Yeah, when we were there, we were staying in a little kind of resort at the bottom or somewhere near the bottom of it. I remember just sitting on the back patio and watch as some of the lava rocks come flying down, and it was pretty cool. BRAD: What?! PIPPIN: Especially at night. BRAD: Oh, you were there at a good time then. The volcano must have been very active. It’s active in that it’s still dangerous enough that no one is allowed on the volcano, but, yeah, I don’t think you can see any lava flow or anything these days. PIPPIN: Oh, yeah. Okay. We could at night. We didn’t necessarily see any during the day. During the day it was just smoking. But, at night we would see little trickles, and we’d see rocks come down every now and then. BRAD: How long ago were you there? PIPPIN: It was when I was in high school. I was 16, so about 10 years ago. BRAD: Oh, yeah. Okay. I did read some comments from 2008, I think, and you could still see lava and stuff then. But, yeah, when I was there I’m pretty sure there — anyway, I didn’t know about it, so we didn’t see any of that. But, yeah, we did that and just went on some hikes and stuff and saw lots of animals and stuff, so it was pretty awesome and, yeah, a much needed vacation. I only took my tablet with me. I’ve got a ten-inch Samsung tablet, and I just took that with me, so I was just working on that. It was a great deterrent to not work because it’s tiny, a tiny screen. And the keyboard, I have an external keyboard for it, but the keyboard kind of sucks. It’s like plastic, cheap plastic, and it’s small and cramped. I kind of did that intentionally so that I don’t like using it. PIPPIN: Yeah, you’re not tempted to work. BRAD: Yeah, exactly. PIPPIN: I found that I actually really, really enjoy working on a tablet in certain environments. Number one, in places where I’m not supposed to be doing a lot of work and maybe just have a few very focused tasks to do because it takes away so many potential distractions. Because you’re limited in what you can do, you kind of get done what needs to be done and that’s it. BRAD: Yeah. I found it good for just keeping up with emails and keeping up with the conversations that are going on in Slack, just kind of keeping up, in general, but not really producing a whole lot so that when I came back, I didn’t have this mountain of stuff to go through. It worked out pretty good. While I was away, we actually released 0.8 of WP Migrate DB, the free version. And, by the time that this airs, actually, we’ll probably have released Migrate DB Pro 1.6, which is a big UI update, so check that out. We’ve been blogging, as usual. Ian wrote a great post about backbone JS and building a dashboard widget using Backbone and using just the ajax, typical ajax endpoint in WordPress. What is that called? Admin ajax, admin-ajax, right? Yeah. Check that out. It’s pretty cool, especially if you haven’t done a lot of Backbone. It’s a great primer for getting into Backbone. PIPPIN: It’s a massively long post too. BRAD: It is a very long post. It is what you would call a tutorial post because it’s one of those ones that you might want to break it up and do it on several sittings. But it’s cool. It’s got all kinds of code samples and stuff, and he explains things really, really clearly, so it’s good. Then we had another Ian–Beardy, we call him–he did a post called Using Codeception to Automate WordPress Plugin Testing, which is pretty neat. Codeception allows you to automate some of the manual tests that you would run. So, unlike unit tests, tests like log into this thing and do this action with your mouse, that kind of thing, Codeception allows you to basically script those actions. It’ll perform them and then test to see if the result is what is expected. He dives into that and kind of shows how to set it up, so it’s pretty cool. PIPPIN: Very cool. BRAD: Yeah. Anyway, what have you been up to? PIPPIN: Well, last weekend we discovered a severe bug in one of our plugins, in our Recurrent Payments plugin, actually, for EDD. It was one of those that you discovered on a Sunday night, and you realize this doesn’t wait until Monday. We have to fix this immediately. It took us until Monday evening or Tuesday to actually get it fixed. I think it was late Monday, so we had an upgrade routine that ran on our new version. The upgrade routine only applied to people that had been running previous versions of it. The new version was 2.4. It only applied to people that were running 2.3 or earlier for an extended period of time, and also only applied if you were running our Stripe payment gateway. In our upgrade routine, we had this process that looped through and recreated new subscription records. Our new version of the plugin introduced a whole new database for subscription records, and we had to pull all the old data and put it into the new database. And so, in that process, we would query it. We would query all customers, and then we would loop through each one and create the subscription records as necessary. Well, we had a fatal error. I don’t mean like an exception type error in PHP. I mean a fatal oops in our upgrade routine where we had a variable that referred to the ID of the customer inside of a Stripe account. That variable did not get reset on each loop or each iteration of the loop. It didn’t get reset because, on every single beginning of every single iteration of the loop, we actually re-queried that variable. Well, we discovered that there was a particular case or two cases, actually, where that query, to get a new customer ID or get the customer ID for this particular subscription record, didn’t happen, such as a customer that had paid through PayPal standard or, for whatever reason, their customer ID in Stripe couldn’t be discovered. What happened is we accidentally assigned the same customer ID to multiple records in our database. Then what would happen is, let’s say that one of those customers who had the incorrect ID assigned to them went to make a purchase. Their new subscription that they purchased would get assigned to the wrong customer in the Stripe account. Also, their debit or credit card would get added to the wrong customer in Stripe as well. Oops! We discovered that on a Sunday evening, and we realized, uh-oh, we have to fix this immediately. This is not something that can be delayed. This is not a minor fix. This is immediately we are onboard until we have this fixed, and we did. We fixed it. Not only did we fix it; we also wrote an upgrade routine that went through and resolved it for any customer record that was affected. We sent out a detailed email to every single customer of the plugin and said, "Hey, here’s how you know if you’re affected. Here’s what you do if you need to fix it, et cetera. Here are the possible consequences and worst-case scenario." We worked directly with several customers to get it fixed on their site as kind of a beta test for it. Hindsight is 20/20. The entire problem was resolved by one little line of code to reset a variable. It makes you realize why there are standardization rules in development environments, things like why we have guidelines that say you always use braces around conditionals as opposed to the non-brace style conditionals in PHP. BRAD: Would those have avoided this? PIPPIN: Yes. BRAD: Oh. How so? PIPPIN: Well, not braces in this case, but all we had to do was to say, "Profile ID = empty string," at the beginning of the loop and the problem would have never occurred. And so, if we had either reset all of our variables that we were setting up on each loop at the beginning or unset them at the end, the problem would have never occurred. And so, it was a one-line mistake. Now, the crazy thing about it is that in order to fix that one line that we didn’t put in, it took over 450 lines of code and 37 to 48 man-hours of development. For us, it was a good reminder and lesson of: These are why rules that sometimes may seem silly exist. It reminded me of about a year or so ago when the big Apple security flaw came out, and it was discovered that it was due to somebody who had not used the braces on a conditional. When you look at it and it seems perfectly fine, but then you discover that, I mean, it’s why we have defensive coding is things like this. BRAD: Right. PIPPIN: That was fun. BRAD: Did you say it was about 48 hours, it took? PIPPIN: I think it took — from the time that we realized exactly what it was to when we had it fixed and deployed was about 48 hours. BRAD: Most of the work there involves trying to figure out a way to fix everybody’s install that got kind of screwed up. Is that right? PIPPIN: Right. It was how do we fix anybody who was affected by the bug and go through and update customer records to make sure they’re correct, make sure that no charges can be put on incorrect cards, make sure that if there was a subscription purchased that got assigned to the wrong customer in Stripe, make sure that that is removed and they don’t accidentally have a subscription that, to them, came out of nowhere, all of those things. BRAD: Right. Was that running as a background process, or do they have to run that actively? PIPPIN: No, it was a manual upgrade. We gave a notice that says, "Hey, you need to update this database, and you’re going to see it run." BRAD: Right. You’re going to sit here until it’s done. PIPPIN: Right. Well, so one of the unfortunate caveats of it, and it’s one of the reasons why it actually made it such a bad bug to fix was, let’s just say that a customer purchased a subscription and their subscription got assigned to the wrong customer in Stripe. That subscription actually had to be cancelled in Stripe because there’s no way to move a subscription from one customer to another. And so, one of the problems that we spent the most time trying to figure out is how do you identify subscriptions in the Stripe account th'
