["https://applyfilters.fm/podcast/episode-77"]
title = "Episode 77: How to Build a Batch Processing System with Drew Jaynes - Apply Filters"
description = "Today’s episode is sponsored by Pagely, who are the original gangsters of managed WordPress hosting. They come from humble beginnings, but now they host huge brands like Disney, Visa, eBay and more. They know their..."
full_description = "March 14, 2017 Apply Filters Episode 77: How to Build a Batch Processing System with Drew Jaynes Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 48:55 Share Share Link Embed Download file | Play in new window | Duration: 48:55Today’s episode is sponsored by Pagely, who are the original gangsters of managed WordPress hosting. They come from humble beginnings, but now they host huge brands like Disney, Visa, eBay and more. They know their customers well and they understand and provide solutions for the complex challenges of scaling. Check them out at Pagely.com for more information. Our guest today is Drew Jaynes. He works for Sandhill Development with Pippin, and today we’re going to talk about batch processing. Drew will talk about his recent projects, and he’ll share tips on batch processing, data sets, and more. Some of the highlights of the show include: What batch processing is and why it’s important, including examples of why you might need to use it with your WP site. Challenges Drew ran into when building a new batch processor with API. The differences between batch processing and step processing. Detailed information on how Drew’s new batch processing works and how it’s an improvement over the last one. Also, he goes into Ajax callbacks. Examples of things Drew has done that depend on PHP 5.3 or later. Possible applications that the batch processor might be used for in the future. How a batch-processing failure is handled. Advice that Drew would give to someone who is building their first batch processor with their plugin. Links and Resources: Pagely Episode 49 AffiliateWP batch processing API: https://github.com/AffiliateWP/AffiliateWP/blob/master/includes/admin/utilities/class-batch-process.php https://github.com/AffiliateWP/AffiliateWP/blob/master/includes/interfaces/interface-batch-process.php https://github.com/AffiliateWP/AffiliateWP/blob/master/includes/interfaces/interface-batch-process-with-prefetch.php https://github.com/AffiliateWP/AffiliateWP/blob/master/includes/admin/utilities/class-batch-process-registry.php https://github.com/AffiliateWP/AffiliateWP/blob/master/assets/js/admin.js#L209 https://github.com/AffiliateWP/AffiliateWP/blob/master/includes/admin/utilities/class-batch-migrate-wp-affiliate.php If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. PIPPIN: Welcome back to Episode 77 of Apply Filters. Today we’re going to talk again to Mr. Drew Jaynes. But before we do that– BRAD: This episode is sponsored by Pagely, undoubtedly the original gangsters of managed WordPress hosting. They’ve been around for a long time, but man have they evolved over the last few years from humble beginnings to now hosting huge brands like Disney, Visa, Comcast, eBay. I could go on. They’ve also figured out who their customers are. They realized that people come to them with complex scaling, deployment, and security challenges, challenges deemed unsolvable by other providers. And so they made that their niche. That’s what they do. They provide solutions to these challenges. Over the years their technology has seen big improvements as well. One of the biggest changes they ever made was moving all of their hosting onto Amazon Web Services and it has paid off big time for them. In fact, there was a S3 outage just recently and they were able to stay operational. There was even a tweet I remember from Scott Bollinger. I looked it up and it reads, “Impressed that while AWS is down, my @Pagely site with AWS infrastructure is still up. Redundancy ftw” (for the win). If you have a big scaling problem, a big hosting scaling problem, you should definitely get in touch with the great folks over at Pagely. They’d be more than happy to chat with you and find a solution to your scaling problem. Also, check out Pagely.com for more details about their services and contact details. PIPPIN: I’ll vouch for them personally. They host all of our websites and have been nothing but awesome for the last several years as we’ve hosted Affiliate WP, Easy Digital Downloads, Restrict Content Pro, and actually a whole bunch of other sites that a lot of people don’t know about all on Pagely and have worked absolutely swell for us. All right, so today we’re going to talk with Drew Jaynes. Drew Jaynes actually joined us previously back on Episode 49. Back then Drew worked as a platform engineer at 10up and now, full disclosure, Drew actually works for Sandhills Development, which is my company, on our Affiliate WP product. We wanted to bring Drew in today to talk about batch processing. Brad and I have covered batch processing in various ways over the last–I don’t know–quite a few episodes. We keep touching on it here and there with some of the work that Brad and his team have been doing and some of the work that we’ve been doing on our side. Anyway, we thought it would be good to bring Drew in and get his take on batch processing and ask him some hopefully harder questions about the process of building a batch processing API. One of Drew’s projects for the last six months or so was to completely rebuild the batch processing API in Affiliate WP so that we could do things with big data sets. Anyway, he went to town on it and he made it happen. Say hi, Drew. DREW: Hello. PIPPIN: Nice to have you on. BRAD: Okay, Drew. Let’s get into this thing. What’s batch processing anyway? Can you just give a basic overview of what that means? DREW: I don’t know. I guess the elevator pitch of a batch processor would be cycling through a big data set in batches, essentially. Performing some action on batches of data so that you can cycle through a big data set and tiny little pieces. PIPPIN: Are there any quick examples maybe why we use batch processors that listeners would be familiar with, within the WordPress ecosystem? DREW: Actually, I can give an example from just a couple, like the last major release of Affiliate WP. We added a database upgrade routine that uses a batch processor. I think it cycled through every affiliate in the database for the current site in and recalculated unpaid earnings or something. But the point is that we have no way of knowing if a customer site has 10 affiliates or 10,000 affiliates, right? You don’t want to try to run one process against 10,000 affiliates. We’d much rather want to run 10,000 processes, obviously pretty quickly, but one at a time instead of all at once. PIPPIN: I guess one of the main things that batch processing really achieves is the ability to handle big data sets. Are there any examples from, say, the wider WordPress ecosystem, more WordPress Core where a batch processor is used to do something? DREW: Yeah, I think that probably the best example of where you could already interact with some stripe of batch processor would be the network upgrade tool, like when you upgrade WordPress and you need to upgrade something like across your multisite network. There’s like a poor man’s batch processor built into Core that cycles through every site in your network and upgrades them all one at a time. BRAD: There’s also one for metadata as well or the taxonomy. DREW: Right. Yeah. BRAD: Didn’t they get rid of one of the tables or something? I can’t remember. It’s been a while since I looked at that. DREW: Yeah. They consolidated stuff for the taxonomy roadmap. But, yeah. But see the difference is that Core uses — I called it a poor man’s batch processor and that’s because it uses page refreshes, right? So like every single step that the page has to refresh. BRAD: Oh, man. Yeah, that’s ugly. Like the whole page, it just feels super clunky, right? Now that you say that, I remember now what it looks like when you upgrade a network install, and it’s just like clunk– DREW: Exactly. BRAD: –clunk– DREW: Yeah. BRAD: –clunk. For like every single site it does that. Oh, man. DREW: I mean it gets the job done, but it’s definitely not very modern in the way that it’s architected. PIPPIN: I know we’ve used some old batch processors like that in various plugins. EDD, for example, used a page refresh for a long time. It was a constant challenge trying to get big sites upgraded. The idea of that batch process was to handle big data sets. Yet, it would still fail because we were still relying on the page refresh. Even if you architected in a way that is designed to avoid the maximum number of redirects, it can still happen. Going into this, Drew, one of your goals was to write a new batch processing API, and now Affiliate WP actually already had one. We had built a batch processing API that was originally used for a database migration tool to import data from previous affiliate programs, other plugins and then also to, say, import a user’s database and create affiliate accounts for them. What was wrong with that batch processor? What were some of the limitations of it, and what were some of your kind of goals of building the new API? DREW: If I remember correctly, because I didn’t build it, I think it followed the page refresh format, first of all, right? I don’t remember exactly, but I think that’s right. We also used it for like as a user migration tool. I think there was a batch process for that too. Again, it was sort of clunky because it relied on page refreshes, which meant that there wasn’t a really great way to track progress. You could sort of see which step you were on, but all the context was lost, right? You would know which step you were on, but you didn’t really know what was going on, and so you would have to just wait until it finished to see if it did what it said it did. I mean it was a good effort. I think it was just in some ways inflexible. A big one, and this is kind of a big piece, was that I think we had one batch processing base class or something like that that lived outside of the APIs that they were extending. So you had this problem where, if you wanted to create a batch processor, rather than hooking into the export, like the export API had to write a new export batch process base class or something like that. It seemed like it was just a little clunky in terms of implementing new ones. But it got the job done for what we had, I think. BRAD: Can we back up just a sec about batch processing? We mentioned that one of the reasons for batch processing is that we have this giant data set that we need to operate on, but I think another dimension of this is the action. The action that needs to be performed on each item of that data set, that action can be a very quick thing. It could be a very small process to execute, or it could be a very large one, right? There are two things at play here. You could end up with a giant data set where every single thing that you need to operate on is actually quite a bit of processing, either power or time as well. That’s just something else to consider, I guess, when you’re designing a batch processing system, right? DREW: Well, and I think it might be worth, Pippin, differentiating between the batch processor we had before and the one we have now. I think before maybe a better characterization would be a step processor, right? Whereas now we have a batch processor, which we have a lot more flexibility to process one or many items. Whereas before it was sort of like one data set and then you were stuck with stepping through them, but there was a lot less control over one versus many. But yeah, I think maybe calling the older one a step processor would be better, a better differentiation between the two. PIPPIN: I think that’s a really accurate description. Like in the old one and what we had previously built, not just in Affiliate WP, but also in EDD and other places. It really did work as a step processor where we said, okay, based on the amount of data we have, we have 500 steps and we’re going to do 30 items per step. Most of the time that literally translated to the post per page parameter of WP Query. DREW: Well, and another way, another thing, too, I think a big difference with the other one was that — so, Brad, just to give you some perspective here, like, when we’re talking about a batch processor, we’re talking about polling for a set of data and then performing batch processes against it, but generally working toward a goal of whatever that is, like a set goal, like a finite point that we already know about. Whereas with like a step processor, we would like do the query on every step, but we would just set the offset, for instance, for whatever the per step value was. Let’s say we’re doing something where we have to query affiliates. We would query 30 affiliates and then, in the next step, we’d query the next 30. But the problem that we would have is that, over time, it was hard to track your progress because unless you were proactively storing the total number of items finished as you go, at the end we had no way of determining the total number of items that had been affected. BRAD: You weren’t actually — when you’d finish operating on a set of data or an item, you wouldn’t store a piece of metadata that said this one has been processed? That kind of thing? DREW: Right. We didn’t really have a standardized temporary storage, data store going on. PIPPIN: It was honestly an assumption of, hey, we’re on step 55, and so that means that we have supposedly processed 30 times 55 records, and that was it. DREW: Right. BRAD: Okay. DREW: Yeah. BRAD: Right. PIPPIN: Yeah. BRAD: You could end up, in that scenario, processing the same thing twice? Is that right? PIPPIN: Definitely. DREW: Yeah, and you could also end up in a scenario where you would give them bad information about what you’d actually processed on the other end because you don’t actually know what you’ve processed. BRAD: Right. Right. Okay. All right, so that sets the stage pretty well, I think, for the improvement. What does the new batch processor do? Let’s start with that. How does it keep track of what it’s processed? DREW: Well, actually, we can give an example for something that just got merged in for the next release. We had this tool for recounting affiliate stats, like we can recount paid earnings based off of paid referrals or unpaid earnings or the total number of referrals associated with an affiliate or the total number of visits, let’s say, right? In the old way we would have basically just pulled down all affiliates. In the tool, you choose one. You choose one of those four things to recount for an affiliate or for all affiliates. In the past, we would have pulled down affiliate objects for all affiliates and then looped through them one at a time, but maybe only processed like 10% of those, maybe. But we would still have to pull down all of them. With this new system, and we had a discussion about this and there was some confusion. That was essentially that the new ba"
