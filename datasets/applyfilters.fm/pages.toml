description = "Today, Brad and Pippin will be talking about what they’ve been up to the past few months, including things that have been going well and things that they’ve struggled with. Some of the highlights of..."
full_description = "August 1, 2017 Apply Filters Episode 82: The Future of EDD, Mergebot Updates, and Creating Your Own SSL Cert Play Episode Pause Episode Mute/Unmute Episode Rewind 10 Seconds 1x Fast Forward 10 seconds 00:00 / 45:47 Share Share Link Embed Download file | Play in new window | Duration: 45:47Today, Brad and Pippin will be talking about what they’ve been up to the past few months, including things that have been going well and things that they’ve struggled with. Some of the highlights of the show include: The challenges that EDD faced when developing Commissions beta 3.4, as well as why the release was planned and developed. What EDD is planning to release over the next year or two. Brad’s newest blog post about creating your own certificate authority. Details about Mergebot’s launch. How Serialized Editor has helped Brad. Details of the 2.8 release of EDD’s core plugin. The status of the Migrate DB Pro release, including details of the new import feature. The importance of not working in a vacuum. The features of Restrict Content Pro 2.9. Links and Resources: Commissions Easy Digital Downloads Development How to Create Your Own SSL Certificate Authority Pippin’s Plugins Mergebot Laraval Spark Serializededitor.com EDD 2.8 Migrate DB Pro Restrict Content Pro 2.9 If you’re enjoying the show we sure would appreciate a Review in iTunes. Thanks! Transcript INTRO: Welcome to Apply Filters, the podcast all about WordPress development. Now here’s your hosts, Pippin Williamson and Brad Touesnard. BRAD: Welcome to Episode 82. This time Pippin and I will be talking about what we’ve been up to in the past couple months, some things that worked out for us, some things that we struggled with. Pippin, what have you been up to, man? PIPPIN: Well, it’s been, I think, almost a month and a half to two months since our last episode when we interviewed Matt Mullenweg, so quite a bit has actually happened in that month to month and a half. I kind of forget how fast things move until you look back and think, that wasn’t very long ago, and then you look at all the different things that happened in that time. We’ve had three major updates that we pushed out in the last couple of days. Actually, all of this week, I think. Two of them went live yesterday and one the day before that were all the culmination of anywhere from one to six months of work. All right, let me give you a quick back story. Five years ago, we started Easy Digital Downloads. And, like a lot of people in the WordPress world, we were very excited about what custom post types allowed us to do. There was this general philosophy that proliferated the WordPress development world that you should use custom post types for anything and everything, and so we used custom post types and post meta to store transactional data for Easy Digital Downloads: payment records, logs, et cetera. Well, that was five years ago. As a lot of people who have used a WordPress e-commerce plugin, whether you’re talking EDD or WooCommerce or any of the others that also use custom post types or any similar scenario, we’ve discovered that there are significant problems and side effects posed by putting that data in that database. It basically comes down to you’re storing a whole lot of data in a super inefficient manner in a way that it was never designed to be used for. You’re putting a square into a round hole is what you’re trying to do, basically. The reason we did it, the same reason everybody else did it, is that it was super, super easy to do. There was almost zero learning curve to do it, and we could do it. Anyway, that was five years ago. We’ve had serious — there’s been a lot of serious problems caused by it, especially with performance and scaling. Well, for the last two years, we’ve been planning how to get that data out, how to move it into custom database tables that are precisely designed for the schema that we need, precisely designed for the purpose that the data has, what it is, where it needs to be stored, what we need to store, how we need to store it, what kind of relationships we need, et cetera. We’ve been working on slowly planning this out for two years, and yesterday we shipped the first one, the first migration. We have a plugin called Commissions that allows store owners to track commission earnings for vendors on their website. If you have a website that has products from multiple vendors, you can track earnings through this Commissions plugin. All of those records were stored as a post type, just like a lot of other data inside of EDD and related plugins. We shipped our first, the first beta of version 3.4 yesterday, and it includes a migration into a custom table designed specifically for the purpose of commission tracking. We first started testing this about three weeks ago on our own sites. We first did it on a very small site that had a little bit of data, a few thousand records at most. We tested the migration, and then we tested also just the general functionality of the plugin. Like after the data is migrated, does everything still work? We tested the migration. Then we also have been working on building a backwards compatibility layer. Then, when all that was done and everything was working on that small site, we put it onto our big site, EasyDigitalDownloads.com. Our main store site has been running this custom database table for commission records for two weeks now. Anyway, so far it’s been a super successful project. BRAD: Cool. Yeah. Did you guys find it really challenging to do this release, to make sure that everything is backwards compatible, or was it not that bad? PIPPIN: Well, okay, so yes and no. I mean I think there’s a couple of major challenges. Your first major challenge is how do you successfully get all the data migrated safely, not only to make sure that you have data integrity, but also make sure, like, is this going to work on low end hosting accounts? That was one challenge. That was definitely difficult. However, it’s something that we’ve been doing a lot of in the last three years. We’ve got pretty solid batch processing and upgrade scripts that we can use now that take care of that. Okay, so first of all, let me tell you what we did for backwards compatibility. We built a complete layer, so all of the data used to live in the WP post and the WP post meta. We tried to look at all of the data that other plugins or people/developers might be querying and they might be using. We wanted to make sure that those queries still worked even when the data did not exist inside of the WordPress post table any more. For example, if you call get_post_meta on a meta key that was associated with an EDD commission post entry and that data no longer exists, your query will still work. We wanted to build a backwards compatibility layer that made sure that nobody’s data became inaccessible even if they were using the old API. That was challenging mostly in trying to predict what people are doing. The actual compatibility layer is not that challenging. That’s pretty simple, honestly. All you’re doing is rerouting queries. The problem is that you really do have to try to predict what cases you need to account for. You can say, well, we have these known meta keys. We know where that data used to live, and we know where the data lives now. We can do that. But what if somebody has registered their own custom meta key and we don’t have any way to know about that? We have to then think, okay, maybe we can provide a way for developers to register a compatibility key, so like to say, “Hey, I have an old meta key. I want you to reroute my calls for me.” Okay. We can do that. We built that. What about when somebody tries to update an old meta value that no longer exists? What happens? Well, it just works. That was challenging making sure that all of that kind of stuff happens. BRAD: That’s a compatibility layer that you’ve added to the get_post_meta, update_post_meta, delete_post_meta, those. There’s hooks inside those WordPress functions, and so you’ve hooked into those, and you’re looking for specific keys. And I guess you’re probably looking up the post that’s being referenced. PIPPIN: Uh-huh. BRAD: And to check that it’s an EDD post type, I guess. PIPPIN: Yes. BRAD: Okay. PIPPIN: But keep in mind that that data doesn’t exist any more because, once it’s migrated out, it’s deleted. BRAD: You’re not keeping a record of that ID, like what it used to be? PIPPIN: We keep a legacy ID. BRAD: Right. PIPPIN: We have that stored. That is there. BRAD: Right. PIPPIN: But it doesn’t belong in WP post any more. BRAD: Right. But is that what you do? PIPPIN: Yeah. BRAD: …compatibility layer. PIPPIN: Yeah, we basically look it up to say, hey, is this a legacy ID? BRAD: Right. PIPPIN: Okay. We need to move it over. BRAD: Right. Right, and because you have that in a custom table in its own column, I’m assuming, then it’s a nice, quick lookup, I’m guessing. PIPPIN: Yeah, it’s pretty easy to look it up. BRAD: Yeah. Okay, that’s pretty cool. PIPPIN: So far it’s been pretty successful. For our test site, we migrated 36,000 records. That migration took about 30 minutes to do, maybe 45. It was kind of cool. We looked at the stats and, when we finished the migration, our amounts were off by like one penny. Sorry. They were off by like $10. We were wondering, where did the $10 come from? Well, what we realized is that we were doing this on a live site, and we had a sale come through during our migration. And so the existing — even as we were migrating that data, it still worked. It put that new sale and got recorded in the new table while we were inserting all of this old back history into it. At first it freaked us out because we were like, where did it come from? Like, why do we have extra? It turns out it worked perfectly, and we had everything down to the penny, down to the exact number of records, et cetera. This is one piece of a much larger project. Our project for 2017 was to get all of our data out of custom tables, and we basically have four sets of data– BRAD: Out of the post tables, you mean. PIPPIN: Out of the post tables. BRAD: Right? PIPPIN: Yeah, sorry. BRAD: Into custom tables. PIPPIN: Into custom tables. BRAD: Yeah. PIPPIN: There is basically four major sets of data. There’s commission records. There’s license keys. There’s log entries. And there’s payment records. This is our first one to do because it’s the smallest, and so it was — if something is going to go wrong, we’d rather it happen here. This being the first one, we’re then going to be able to do our next ones. We’ll do license keys. We’ll do payment records. And we’ll do logs. All of those will happen during this year still. Well, because of the old database schema where you’re using WP post and WP post meta, and those tables are not designed for this kind of data, what it really means is that you have really severe bloating of your database. As an example, “one” entry in the database, in the old schema, would actually take up 11 rows in your database, or maybe 20 rows, or maybe 5 rows because of all the meta data stored as separate rows that really should belong in its own column. When we ran this migration, we moved 36,000 records. Doing that allowed us to delete over 250,000 rows from the database. That’s the smallest of our four data sets. So when we do our next ones, we’re going to delete another 300,000 to 500,000 rows from our database. This is just our database. This is not counting everybody else’s who have much bigger sites than us. Then when we do the next one, we’re going to delete a million rows from the database. BRAD: Right. PIPPIN: It’s crazy. BRAD: What is your strategy, or maybe you haven’t even thought about this yet–I don’t know–about taking out the backwards compatibility layer. Is that ever going to come out, or are you just going to leave it in there? PIPPIN: Yeah, it’ll probably come out at some point. Or, at a minimum, we’ll put it in there to throw hard notices to get it to see when it’s used to make sure that– BRAD: Does it throw out deprecated notices for now? PIPPIN: Right now, if you have debug on and you’re signed in as an admin, you will get a “doing it wrong” notice. But it only happens if you’re logged in as an admin and debug is enabled because we don’t want to cause any unexpected behavior for customers. But, yeah, so I think eventually we will absolutely hard deprecate them to the point where they either — maybe they don’t work and they always throw a notice because, if we migrated the data and you still have the old methods in place a year and a half later, it’s time to get those fixed. I don’t know if it’s a year. I don’t know if it’s two years. But, yes, it will happen. BRAD: Yeah, eventually. Clean up time. PIPPIN: Yep. BRAD: Yeah. The migration routine looks like — does that just reload the page, or is it Ajax? PIPPIN: It is. There are two ways to run this. Our standard upgrade routine inside of EDD uses a combination of Ajax and page reloads to do a batch processing that can, even on slow servers, go through tens of thousands of steps. BRAD: Oh, is it the same library that Drew was on this very program talking about? PIPPIN: Very similar. When Drew came on a few months ago to talk about batch processing in Affiliate WP, the batch processor that he built was used to some of the EDD batch processing as a starting point. BRAD: Right. PIPPIN: But it’s not the same one, but it is similar. BRAD: Gotcha. PIPPIN: But we also added the option to run the migration via WPCLI, which is definitely the recommended way. BRAD: Yeah. I love that. That’s a smart move because, yeah, if you have a giant site, you don’t want to have to do it via the UI. PIPPIN: No. No. BRAD: You’re just asking for trouble. PIPPIN: Yeah, like our site, we moved 36,000 commission records, removed 230,000 records from the database. That took us about 30 to 45 minutes via WPCLI. If we had done that in the UI, it probably would have been three hours, easily. BRAD: You guys didn’t take your site down temporarily– PIPPIN: No. BRAD: –to run this? PIPPIN: No, we ran it live. BRAD: Oh, man. PIPPIN: We wanted to make sure that it worked live. BRAD: You guys — yeah, you guys are gutsy, man. PIPPIN: We tested it on our staging site first. BRAD: This is a big, big step for you guys. I think this is going to be a huge advantage over the other e-commerce plugins that are out there because, I mean, are there any other e-commerce plugins that actually use custom tables? PIPPIN: WP eCommerce does. BRAD: It does? PIPPIN: They’ve used custom tables since day one. BRAD: Okay. Yeah, and it was really controversial, wasn’t it? PIPPIN: It was. Right. They are actually, I believe — Justin, if you’re listening, I’m sorry if I’m wrong on this, but I believe WP eCommerce was actually one of the reasons that a lot of people preached for using custom tables for all of this kind of data because they’re like, “Why would you use custom tables? That"
