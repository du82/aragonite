["https://apps.ankiweb.net/index.html"]
title = "Anki - powerful, intelligent flashcards"
full_description = '''Anki is a program which makes remembering things easy. Because it's a lot more efficient than traditional study methods, you can either greatly decrease your time spent studying, or greatly increase the amount you learn. Anyone who needs to remember things in their daily life can benefit from Anki. Since it is content-agnostic and supports images, audio, videos and scientific markup (via LaTeX), the possibilities are endless. For example: SynchronizationUse the free AnkiWeb synchronization service to keep your cards in sync across multiple devices. Media-RichEmbed audio clips, images, videos and scientific markup on your cards, with precise control over how it's shown. "The single biggest change that Anki brings about is that it means memory is no longer a haphazard event, to be left to chance. Rather, it guarantees I will remember something, with minimal effort. That is, Anki makes memory a choice." "No other application [...] comes remotely close to Anki in terms of the number and power of features, flexibility in study, or implementation of spaced repetition." "I've been using Anki for two years now, and I just wanted to thank you personally for contributing to the single most obvious improvement in my quality of life. I'm not being hyperbolic: consistent use of Anki has opened more doors for me intellectually than I could have imagined two years ago. And being a poor student, I'll be forever grateful that you've provided this software open-source and free of charge." If you have a recent Mac, pick the Apple Silicon version for better performance/battery life. Older Macs will need to use the Intel version instead. Anki's source is available on GitHub. There are instructions for building in the docs/ folder. If you encounter problems with the build system please let us know, but please note the expectation is that you are able to dig into basic issues by yourself. If you have no programming experience, please use the packaged version instead. If you encounter bugs while running Anki from source, please check to see if you can reproduce them in the packaged version, as the Qt version or other libraries on your system can be the cause of some problems.'''
