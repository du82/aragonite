["https://aprs.fi/page/linking"]
title = "Linking to aprs.fi – aprs.fi – live APRS map"
full_description = "This is a list of supported deep links and URL parameters for aprs.fi. Please use these methods to link from your web page to this site - these are the ones that are likely to stay around longer. The above method only works with targets which consist of numbers, letters and the minus (-) character. No spaces or other non-APRS-callsign characters are permitted in this short link format. If you wish to link to a non-callsign target (like an item, object or AIS vessel with spaces) you need to use the longer format and remember to URL encode the callsign (a space becomes %20 - look up the target name by entering it in the tracking form and check what appears on the URL bar of your browser): Up to 20 callsigns can be tracked at the same time by specifying a comma-separated list (call=N0CALL,N1CALL,N2CALL). If you wish to specify a time range for the track line, enter it in the timerange parameter as seconds (again, this won't work in the short link format): If you wish to show other stations around the station being looked up, set the others parameter to 1: Enter the latitude and longitude in the lat and lng parameters, in decimal format. Latitude in the southern hemisphere is negative, and so is longitude in the west. You can look up the decimal coordinates using the map view by selecting decimal coordinates from the Options. Zoom level (url parameter z) is specified as an integer value: 1 is completely zoomed out, showing the whole world, 19 is the maximum zoom level. https://aprs.fi/?lat=40.6914&lng=-74.0160&z=19&mt=roadmap https://aprs.fi/?lat=62.9030&lng=27.6677&z=11&mt=terrain A label can be specified for the initial coordinates. A marker will be shown at the given latitude and longitude, and a balloon containing the label will pop up. This link does not have any other URL parameters. If the callsign has spaces or other special characters, they need to be URL encoded. https://aprs.fi/weather/OH2KXH https://aprs.fi/weather/OH2KXH/day https://aprs.fi/weather/OH2KXH/week"
year_published = 2025
