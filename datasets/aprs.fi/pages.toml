["https://aprs.fi/page/api"]
title = "aprs.fi Application Programming Interface – aprs.fi – live APRS map"
full_description = "The aprs.fi API (Application Programming Interface) allows application developers to query the aprs.fi database from their own web applications. To use the API you need to sign up for an user account on aprs.fi - your API key can be found in the account settings (My account). The API is supposed to be used for developing applications which add value to the data collected by aprs.fi. It may not be used to simply copy all of the data to another site providing exactly the same features as aprs.fi. If you wish to set up a clone site, please collect your data directly from the APRS-IS - it's easy to parse using Ham::APRS::FAP. The API limits the rate of requests to a sensible level, which can be adjusted if needed. The limits are designed to protect aprs.fi from too heavy load, and to protect the database contents from harvesting. If your application hits the limits and you'd like to have a larger quota, please get in touch and describe your application's needs in detail. Most requests should normally be served within tens of milliseconds, since they do not usually require any disk access. In any case, you should write your application so that it will time out requests in a few seconds. If multiple requests fail in a row, your application should assume that the service is not available and slow down the rate of attempts using an exponential backoff algorithm. The API returns data in either JSON or XML format, JSON being the default and recommended format since it has much smaller overhead when compared to XML. XML responses can be easily twice as large as the equivalent JSON responses. See json.org for parsing instructions. If you're programming in PHP, json_decode is your friend. This document lists all the API calls available. If a function is not listed here, it is not there; unfortunately there are not hidden gems to be found. The API URLs have been updated. They all point to https://api.aprs.fi/api/ now, instead of http://api.aprs.fi/api/. Please upgrade your applications. The old plaintext URLs will still work for the foreseeable future, but using https will keep your API keys safe. Thank you!"
year_published = 2025
clearnet = "https://aprs.fi/page/api"
