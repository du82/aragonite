["https://aprs.fi/page/faq"]
title = "FAQ – aprs.fi – live APRS map"
full_description = "You can also enter the tracking mode by clicking on start tracking in the info balloon after clicking on an icon on the map. The positions of the amateur radio operators and their vehicles are received from the APRS-IS network on the Internet. Most of them are originally transmitted on amateur radio frequencies (typically around 145 MHz), and received and forwarded to the APRS-IS by igate stations run by clubs and individuals around the world. The positions of ships are received from the AIS frequencies by receiving stations around the world. If you wish to receive AIS transmissions and provide them to the service, you're more than welcome to do so. Data accuracy varies greatly. Usually the data is fairly accurate, but quite often it is not, and there are no guarantees that it would be valid at all. It's trivial, on the AIS and amateur radio APRS networks, to impersonate someone or send invalid data, it can happen intentionally, and it often happens accidentally. A lot of data is corrupted before it reaches the service - there is no end-to-end error detection or real authentication in the APRS network. For technical reasons (digipeater, igate, APRS-IS or aprs.fi issues) position packets sometimes take minutes to reach the service. Very frequently some GPS receivers give out incorrect position fixes, and cars jump tens of meters or hundreds of kilometers away from their real position. These jumps cause very strange speed readings. GPS receivers are also pretty inaccurate when reporting altitude. Specifically, the data is so inaccurate that it is in no way useful for giving speed tickets. The service can be used for entertainment and hobby purposes, it is not good for professional, governmental or mission-critical use. Although the aprs.fi service is relatively stable and usually accurate, the global APRS network is run by individual users on their spare time, and it's availability, accuracy or performance is not guaranteed. Email communications can be easily forged, and I have no way of making sure you're really asking me to delete your data. Also, I do not have much time to manually respond to requests by individual users - there are tens of thousands of users who each have different kind of unique needs. Instead, I prefer to use my time to develop software features which benefit hundreds or thousands of users."
year_published = 2025
clearnet = "https://aprs.fi/page/faq"
