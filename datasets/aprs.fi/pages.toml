["https://aprs.fi/doc/guide/guide.html"]
title = ""
full_description = "The aprs.fi web service collects information from the Automatic Packet (or Position) Reporting System Internet System (APRS-IS). APRS is used by amateur (ham) radio operators to transmit real-time position information, weather data, telemetry and messages over the radio. A vehicle equipped with a GPS receiver, a VHF transmitter or HF transceiver and a small computer device called a tracker transmits its location, speed and course in a small data packet, which is then received by a nearby iGate receiving site which forwards the packet on the Internet. Packets are also retransmitted on the radio channel by digipeaters to enhance the coverage of the system. Systems connected to the Internet can send information on the APRS-IS without a radio transmitter, or collect and display information transmitted anywhere in the world. In addition to that, aprs.fi also displays AIS data transmitted by most large ships. AIS transmissions are received by volunteers at numerous sites, but most areas are largely uncovered. This guide aims to become a comprehensive manual for the aprs.fi web site, and as such does not attempt to describe the APRS or AIS systems in detail. To get started with APRS, please consult the following pages: The aprs.fi service has been translated by volunteer users to numerous different languages. The language shown to you will be selected based on your browser's language preference settings. If you wish to preview the site in different languages, please prepend the two-letter language code to the site URL, for example: The site also supports different measurement units (metric, imperial and nautical), which can be selected in the preferences. Each page has a set of navigation links at the top of the page, and another at the bottom. On the real-time map, the links are provided in the navigation bar at the right side of the map, which can be hidden by clicking the button in the top right corner of the page. The general idea is that the links on the top provide links to different data views. If you have already looked up a specific station, the links will contain that callsign, and clicking on the weather link when viewing the info page of a weather station will give you that station's weather history graphs."
year_published = 2025
clearnet = "https://aprs.fi/doc/guide/guide.html"
