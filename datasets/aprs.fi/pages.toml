["https://aprs.fi/doc/guide/aprsfi-real-time-map.html"]
title = ""
full_description = "The real-time map which opens up first when you arrive on the site displays, in nearly real time, APRS and AIS data on top of maps or satellite images provided by Google Maps. By default, it opens up showing the real-time situation in an area which should be relatively near your current location. The location guess is based on your IP address and it is a bit rough, but usually it opens up at least in the correct country. It is possible to select and save an initial view, but more on that later. On the left side of the map you'll find the familiar Google Maps map controls which can be used to zoom and pan around the map. You can also use the mouse to drag the map, and the wheel of a mouse (if you have one) to zoom. On the top of the map there is a box showing the coordinates and locator currently under the mouse pointer, a controls to switch between different map layers (street map, terrain map, satellite images and hybrid satellite+street map), and a control to enable additional layers on top of the map (traffic info, bicycle routes, and so forth). On the right side of the map is a menu area containing the search boxes, links to switch views, links to information pages, and possibly some advertisements or links to news about the aprs.fi site. Near the bottom, right above the advertisement is a small status box which indicates the rather frequent updates of the real-time map data. The updates normally happen once every few seconds. Clicking on any of the ship or vehicle symbols will open up an info balloon showing current information on that tracking target. The callsign / name labels shown on the map have colors which mostly match the APRS symbol attribute colors in Bob Bruninga's original APRS software. Near the top right corner there is a drop-down selection for the amount of history shown. When looking at the real-time view of an area (and not tracking a station), the maximum setting is 24 hours. Beware – if you're looking at a busy area, or have zoomed out to see a lot of APRS stations, selecting 24 hours will likely make your browser slow down to a halt, just because it needs to display so many symbol graphics and path lines."
year_published = 2025
clearnet = "https://aprs.fi/doc/guide/aprsfi-real-time-map.html"
