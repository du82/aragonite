["https://aprs.fi/doc/guide/aprsfi-weather.html"]
title = ""
full_description = "This is a section of the aprs.fi user guide. Here, we describe weather-related functions of the site. aprs.fi collects and displays weather reports transmitted on the APRS-IS and the CWOP networks. Weather stations are shown on the real-time map with a blue WX symbol, and clicking on the marker will show the latest weather report received from that station. If there are weather stations visible in the real-time map view, an average current weather report for the area is calculated from their reports and shown on the right side of the map, just below the address search input form: Weather stations with a CW-prefixed, numbered callsign are taking part in the Citizen Weather Observer Program (CWOP). Most other weather stations are amateur radio operators with a weather station. Some information is also converted by individuals from publicly available sources like airport weather reports. The weather report page displays the current weather report for a single weather station, and history graphs for the values measured by that station. It can be easily accessed from the real-time map by clicking on the show weather charts link in the info balloon of the station."
year_published = 2025
