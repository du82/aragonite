["https://aprs.fi/doc/guide/aprsfi-common-features.html"]
title = ""
full_description = "This is a section of the aprs.fi user guide. Here, we describe features which are common to all views of the site. The site has been translated to a number of languages by it's users. The language is selected in your web browser's preferences, which in turn take their default settings from your operating system. If you have selected Norwegian as your operating system's language, aprs.fi should by default come up in Norwegian. To switch to another language, change the language preference for all web sites in your browser's settings. Most of the tables shown on the aprs.fi web site can be sorted by most or all columns shown. Just click on the column title to sort in ascending order (a small arrow pointing down will appear), and click again to sort in descending order. If you don't know the exact callsign or name of the target, you can try to search for it using wildcard characters. The * character will match any number of any characters, and the ? character will match any single character. For example: These searches will bring up a wildcard search result page. Because the original search was made from the real-time map which supports displaying information for multiple targets at the same time, you can either click on a single callsign to view that stations' position, or check the checkboxes on the left side of the callsigns and click on Show selected to start tracking multiple stations at the same time. Many views on aprs.fi, like the Weather page, do not support multiple targets at the same time, in which case the checkboxes do not appear on the wildcard search result page. Some pages, including the weather and telemetry pages, support selecting an arbitrary date/time range. The start and end dates must be entered in numeric year-month-day format. 2010-11-12 stands for the 12th of November, 2010. Leading zeroes can be omitted, so 2010-5-3 will bring up the 3rd of May."
