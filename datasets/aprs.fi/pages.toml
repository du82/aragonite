["https://aprs.fi/doc/guide/aprsfi-info-pages.html"]
title = ""
full_description = '''The info page summarizes most information aprs.fi has on an APRS station, item, object or AIS vessel. It shows the collected information in a table and provides links to other pages with more details and history. If the packets seems to have originated from the RF side of the network, the path advisor will comment on the relative "goodness" of the packets APRS path settings. The advisor report appears right after the Last path on the info page. It will count the amount of total hops the packet seems to have traversed, and if the number is higher than 3, the path is considered suboptimal. The advisor also suggests using the New-N paths of WIDE1-1,WIDE2-1 or WIDE1-1,WIDE2-2 which seem to be the most commonly accepted paths. It also gives advice on invalid usage of RELAY and WIDE1-1 when they're not the first component of the path, and suggests replacing RELAY with WIDE1-1. There are different opinions on "good" settings, and there are regional differences too. I believe the settings offered are good for most environments. It doesn't really matter so much if one uses TRACE or WIDE, as long as the total amount of digipeaters isn't very large. 2 is good in areas with good coverage digipeaters and igates, 3 is usually good elsewhere. 5, 6 or 7 is, well, not good. The info page also gives advice if the packet transmit rate seems high. It calculates the arithmetic mean (average) interval between recently transmitted packets. If the average interval falls below 30 seconds, the following advice is shown: This station is transmitting packets at a very high rate, which causes serious congestion in the APRS network. This could be considered an abuse of the network resources. Up to last 50 packets from a station are considered, but the backwards-going lookup stops at the first 1-hour gap between packets, the intention being to look at the last or current trip of a vehicle. The interval is only calculated if there are at least 3 packets in the last trip. Because an average is used, this shouldn't trigger too easily from bursts generated by Smart Beaconing.'''
year_published = 2025
clearnet = "https://aprs.fi/doc/guide/aprsfi-info-pages.html"
