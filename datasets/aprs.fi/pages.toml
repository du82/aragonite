["https://aprs.fi/page/privacy"]
title = "Privacy policy – aprs.fi – live APRS map"
full_description = "Just like most other web sites, aprs.fi uses third-party mapping, analytics and advertisement systems to implement core features of the service, collect statistics on its use, and to provide some advertising revenue to cover the cost and work involved in providing the service. Through the use of these third-party services, and with the help of cookies, we share information about your use of our site with our social media, advertising and analytics partners, including Google and Twitter. Although cookies have been in wide use since the 90's, new law and policies set by the EU and Google require aprs.fi to display a prominent warning to visitors from the EU regarding the use of cookies. Nothing in the use of cookies has changed lately, it's just a new warning box that you need to click. Sorry about that. Cookies are a technology which can be used to provide you with tailored information from a Web site. A cookie is an element of data that a Web site can send to your browser, which may then store it on your system. You can set your browser to notify you when you receive a cookie, giving you the chance to decide whether to accept it. Cookies are used by this site to distinguish users and store configuration settings selected by the user. The compact policy is sent by the Web server along with the cookies it describes. For more information, see the P3P deployment guide at http://www.w3.org/TR/p3pdeployment."
year_published = 2025
