["https://aprs.gids.nl/nmea"]
title = "GPS - NMEA sentence information"
full_description = '''Example 1: $GPBOD,099.3,T,105.6,M,POINTB,*01 Waypoint ID: "POINTB" Bearing 99.3 True, 105.6 Magnetic This sentence is transmitted in the GOTO mode, without an active route on your GPS. WARNING: this is the bearing from the moment you press enter in the GOTO page to the destination waypoint and is NOT updated dynamically! To update the information, (current bearing to waypoint), you will have to press enter in the GOTO page again. Example 2: $GPBOD,097.0,T,103.2,M,POINTB,POINTA*52 This sentence is transmitted when a route is active. It contains the active leg information: origin waypoint "POINTA" and destination waypoint "POINTB", bearing between the two points 97.0 True, 103.2 Magnetic. It does NOT display the bearing from current location to destination waypoint! WARNING Again this information does not change until you are on the next leg of the route. (The bearing from POINTA to POINTB does not change during the time you are on this leg.) Name Example Data Description Sentence Identifier $GPGGA Global Positioning System Fix Data Time 170834 17:08:34 Z Latitude 4124.8963, N 41d 24.8963' N or 41d 24' 54" N Longitude 08151.6838, W 81d 51.6838' W or 81d 51' 41" W Fix Quality: - 0 = Invalid - 1 = GPS fix - 2 = DGPS fix 1 Data is from a GPS fix Number of Satellites 05 5 Satellites are in view Horizontal Dilution of Precision (HDOP) 1.5 Relative accuracy of horizontal position Altitude 280.2, M 280.2 meters above mean sea level Height of geoid above WGS84 ellipsoid -34.0, M -34.0 meters Time since last DGPS update blank No last update DGPS reference station id blank No station id Checksum *75 Used by program to check for transmission errors hhmmss.ss = UTC of position llll.ll = latitude of position a = N or S yyyyy.yy = Longitude of position a = E or W x = GPS Quality indicator (0=no fix, 1=GPS fix, 2=Dif. GPS fix) xx = number of satellites in use x.x = horizontal dilution of precision x.x = Antenna altitude above mean-sea-level M = units of antenna altitude, meters x.x = Geoidal separation M = units of geoidal separation, meters x.x = Age of Differential GPS data (seconds) xxxx = Differential reference station ID'''
year_published = 2025
clearnet = "https://aprs.gids.nl/nmea"
