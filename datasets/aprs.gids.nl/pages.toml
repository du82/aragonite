["https://aprs.gids.nl/t813"]
title = "T813 Teletron ombouw beschrijving"
full_description = "De Telefunken Teletron T813 bestaat uit 3 delen. Een zend/ontvanger- een audio- en voedings-deel. Als je de zender enkel wil inzetten voor packetradio of sstv is een enkelkanaals uitvoering gemakkelijk te realiseren met enkel het zend/ontvanger deel. Originele website is te vinden bij : Jeroen de PE1MWB. Deze data is puur voor eigen gebruik en archief. Zelf gebruik ik een deel van deze modificaties voor APRS gebruik. Op de site van Jeroen PE1MWB staat wellicht nieuwere informatie. Handleiding 0. Voorzie de achterwand van de T813 van een doorvoer. Plaats een 4aderig afgeschermde kabel met 5polige DIN steker. (gebruikelijke aansluiting voor een packetradio-modem) Plaats een PC-uitbreidingsslot-afdekplaatje (wat een woord!) als afscherming naast de antenneleiding op de hoofdprint. Uiteraard de print en het afdekplaatje ter plaatse goed schoon krabben, voor vertinnen en met een stevige bout solderen. Zie detail foto. 1. DATA ANALOG OUTPUT (discriminator output) Schroef de ZF-unit uit, zoek knooppunt R11=100ohm met C17=1.8nF Plaats 2k7, 1nF en 4.7uF(tantaal) Een afgeschermde leiding gata naar de DIN plug pen4. De afscherming wordt in de buurt van de 15 polige subD connector op de hoofdprint aan massa verbonden en niet op de ZF unit. Detail foto: Aansluiting op de ZF - Trap 2. DATA ANALOG INPUT (varactor input) Schroef de Oszillator-unit uit, zoek knooppunt R08=15k met R11=47k (instelpotmeter) Onderbreek deze verbinding naar R11. (Hiermee is het normale audiocircuit uitgeschakeld) Plaats 4.7uF(tantaal) (beter nog via smoorspoel 22uH) op R08 Een afgeschermde leiding gata naar de DIN plug pen1. De afscherming wordt in de buurt van de 15 polige subD connector op de hoofdprint aan massa verbonden en niet op de Oszillator unit. Detail foto: Aansluiting op de Oszillator 3. PTT INPUT Zoek aan onderzijde van B02 (Teiler-unit) op de basisprint P23 en P25. Plaats BC557B (geen A type!), 1k en 1k8. Een leiding gaat naar de DIN plug pen 3. Detail foto: PTT op de hoofdprint 4. 10V voorziening Zoek de M3 bout op het koelblok naast de imbus slotbout waarmee de T813 in een frame wordt vastgezet. Plaats een spanningsregelaar 7810 en 2x 4.7uF Detail foto: IC 7810 op de hoofdprint 5. FREQUENTIE instelling Schroef de Teiler-unit uit. Verwijder R06, 10, 14, 16t/m20 en C10t/m14. Plaats draadbrug op de plaats R06, R10 Verwijder V01, V02, plaats draadbrug op hun b-e aansluiting R05 nazien, die moet 6k8 zijn. Details op PLL schema en een foto"
