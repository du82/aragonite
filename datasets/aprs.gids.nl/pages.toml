title = "JavAPRS Live TNC Data"
full_description = "Thanks to the TNC server Dale wrote, javAPRS can now connect to his TNC, and show the live data coming off his LAN. javAPRS now has zoom and scroll capability. To use it, first click on the map, so that Netscape sends keystrokes to the applet. The letter d (or PgDn) will zoom down, u (or PgUp) will zoom up, and the arrow keys scroll. Also, opening the Java Console (in the Options menu) will show the TNC data as it comes through. Pressing L will dump a station list to the console. (the Applet window must be in front (i.e. pressing L while the console window is topmost does nothing)."
