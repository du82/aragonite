["https://apt.izzysoft.de/ark"]
title = "IzzySoft Ark Repositories"
description = """
DBAHelper is a collection of scripts to ease the daily
maintenance work of Oracle database administrators. Examples are moving objects
between tablespaces, analyzing schemata, and rebuilding invalid indices.
Additionally included is a little framework to simplify the use of RMAN (this
framework depends on the use of Oracle 10g with the Recovery Area enabled and
properly sized, so all backups go here).
Architecture: ALL"""
full_description = "Though we do not (yet) provide a real ArkLinux repository, you can at least find the corresponding PKGBUILD files for some of our packages here. For your convinience, to always get the PKGBUILD file of the latest version available without checking manually for its version number, simply use the package name without extensions - to e.g. get the PKGBUILD file of the latest ext3undel, simply request https://apt.izzysoft.de/ark/ext3undel - symlinks are set to fulfil your request."
year_published = 2008
clearnet = "https://apt.izzysoft.de/ark"
