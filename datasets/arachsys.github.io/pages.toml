["https://arachsys.github.io/webmidi"]
title = "Web MIDI tools"
full_description = "The following tools are self-contained web applications which interact with attached MIDI instruments using the Web MIDI API. Each tool runs entirely client-side, depends on no resources outside the single static HTML file which implements it, and is MIT licensed for ease of code reuse. Choose MIDI input and output ports from the drop-down selectors in the header bar, then enter complete MIDI commands in hexadecimal byte format at the prompt to send them. Received messages will be logged to the screen in green. For example, f0 7e 00 06 01 f7 will send a universal identity request, which should trigger an identity reply from a compliant instrument. The shell supports basic command-line editing including history, and the clear command clears the log of received messages but leaves the command history intact. The display filter drop-down narrows the recorded data to system exclusive messages, all system common and channel data, or all messages including real time bytes. Note that if enabled, real time chatter from active sensing bytes and time clock messages can result in a very large log in the browser. This tool is a simple instrument-specific patch librarian, demonstrating automatic instrument detection and system exclusive dump/restore. It scans for an attached Yamaha Montage or MODX synthesizer by sending universal identity requests on all available outputs and monitoring for known replies. When a suitable instrument is connected, the model and version are indicated in the header bar. Use the rightward arrow to fetch the current performance from the instrument’s edit buffer. Alternatively, use the upward arrow to load a performance from a file in raw sysex dump format, or just drag the file onto the page. For each received or loaded performance, a scratchpad row will be inserted with its name, a leftward arrow to return it to the instrument’s edit buffer, a downward arrow to save it to a file, and an X to delete the row from the scratchpad. For convenience, some simple keyboard shortcuts are defined. The = or > key fetches the current performance from the instrument, equivalent to clicking on the rightward arrow. The digits 1 to 9 send one of the last nine rows back to the instrument, equivalent to clicking on the left arrow for that entry, with 1 corresponding to the most recent performance."
author = "Chris Webb, chris@arachsys.com"
year_published = 2025
