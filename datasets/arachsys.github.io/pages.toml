["https://arachsys.github.io/nobmc"]
title = "NoBMC"
full_description = "Remote management interfaces offered by off-the-shelf servers are invariably clunky, unreliable and a security horror show. Can we retrofit something better? Despite the feature incontinence of vendor BMCs, their only useful interfaces are the power/reset controls and the serial-over-LAN console, which allows remote access to the UEFI BIOS setup menus, the UEFI shell and the console of a running Linux system. When serial-over-LAN redirection is disabled, the same serial console is instead available through the RS232 port. Extending this with the ability to reliably reset the host and control power would turn it into a clean but complete remote management solution. Electrically, RS232 is a simple bit stream where the line is driven positive between +3V and +15V for a logical 0, and negative between -3V and -15V for a logical 1. 8-bit bytes are preceded by a start bit (always 0) and followed by one or two stop bits (always 1). When idle, the line is driven negative, corresponding to logical 1. Thus during normal operation, a serial line is never continuously positive for more than 90% of the time because it must fall negative for stop bits and when idle. The otherwise-invalid constant positive state is a serial break which is typically used to represent an out-of-band exception such as a modem disconnect. Breaks are easy to detect without decoding a serial stream or even knowing its baud rate and other parameters. Charge a capacitor slowly through a resistor when the line is high and discharge it quickly through a parallel diode when the line is low. The charge potential only exceeds the positive gate threshold of an n-channel MOSFET during a break of sufficient duration; otherwise it stays negative and the MOSFET remains off regardless of serial traffic. The following simple circuit implements this idea, using breaks of different lengths to control the reset and power buttons of a server from its serial console input. Component values are chosen so a standard 250ms break on RXD will pull RST to ground. If it continues beyond 550-600ms, PWR will also be pulled down."
author = "Chris Webb, chris@arachsys.com"
year_published = 2025
clearnet = "https://arachsys.github.io/nobmc"
