["https://arachsys.github.io"]
title = "Chris Webb"
full_description = "This is Chris Webb’s home page. The best way to contact me is by email to chris@arachsys.com. You can also follow me as @arachsys on Bluesky, as @dairychris on Twitter, or find me on Facebook. A number of my free software projects are available on GitHub, BitBucket, Codeberg, GitLab and Sourcehut. You might be looking for: This package is a minimalist implementation of containers for Linux, making secure containers as easy to create and use as a traditional chroot. It comprises three utilities, contain, inject and pseudo, which use the kernel support for user namespaces merged in Linux 3.8. See also ucontain, a simplified shell script reimplementation. The British Cattle Movement Service run a tracing database for farmers to record cattle births, deaths and movements. This command-line interface to their XML-over-HTTP API is an alternative to the clunky web frontend. A lightweight init suite used in Arachsys Linux, this is a toolkit of small utilities including a daemon wrapper supporting asynchronous dependencies and listening sockets, a simple but flexible syslog implementation, an elegant replacement for the increasingly bloated udev daemon, and a template /etc/init written as a simple shell script. This builds cleanly without autotools on both musl and glibc, using either clang or gcc. On musl systems it doesn’t need extra argp, fts or obstack libraries, just zlib for handling compressed ELF sections. I sometimes used to work on an Apple machine running macOS, and it was convenient to use the built-in IMAP mail client. It isn’t too bad for reading mail, but whilst it once emitted nice RFC2646 format=flowed message bodies, recent releases horribly mangle plain text with a quoted-printable transfer encoding. MailFlow monkey-patches Apple Mail to emit format=flowed plain text messages, also fixing problems with displaying leading whitespace, and quoting/attribution in replies. MailWrap is an earlier plugin to add a manual line-wrapping and paragraph filling shortcuts in the message composer. Unfortunately, plugins like these are no longer possible on the most recent releases of Apple Mail, though the bugs and problems they worked around are still glaringly obvious."
author = "Chris Webb, chris@arachsys.com"
