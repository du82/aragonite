["http://arbtt.nomeata.de/doc/users_guide/arbtt-import.html"]
title = "arbtt-import"
full_description = "arbtt-import reads data from standard input and adds the entries to the logfile. It supports the Show format as well as the JSON format, and can be used in a streaming fashion (i.e. it will write entries as they are read from standard input). By default, this program completely overrides the existing file, therefore it will refuse to work if the log file already exists. If you want to overwrite a file, please delete it before running arbtt-import. If you want to extend an existing file, use the --append option."
