["https://arbtt.nomeata.de/doc/users_guide/arbtt-stats.html"]
title = "arbtt-stats"
full_description = "arbtt-stats reads the samples that were recorded so far by arbtt-capture from the log file, filters them according to the users specifications and generates one or more reports from the data. The order in which filters (--exclude, --only, --also-inactive and --filter) and reports are passed to the program is irrelevant: All filters given on the command line are active for all reports. Skip this tag or category when printing statistics. Only affects the reports --total-time and --category. To distinguish tags and categories, the latter have to be entered followed by a colon. Can be given more than once. Prints statistics only for the specified tag or category. Only affects the reports --total-time and --category. To distinguish tags and categories, the latter have to be entered followed by a colon. Can be given more than once. Specify the report output format, may be one of: text, csv (comma-separated values), tsv (TAB-separated values). Default format: text. Various bits of information about the recorded data, such as total time recorded, number of records etc. In this report, “time recorded” is the sum of all samples, including inactive and those that are disabled by the filter, while “time selected” is the sum of the samples that are matched by the given filters. For all tags, print the part of the selected time with this tag applied to, both as an absolute value and a percentage of the selected time. For the given category, give the textual equivalent of a pie chart: For each possible value of the category, including one for “no tag of this category present”, give the absolute time and fraction. Entries which are not displayed because of the option --min-percentage are aggregated. This report lists all periods of consecutive time intervals where the given tag has been applied to, or where the given category has the same value. This report will give wrong results if an activity has been carried out at the end of a session and right at the beginning, as the intermediate time is thought to be part of the interval. Inactive times while arbtt-capture is running will separate the results as expected."
