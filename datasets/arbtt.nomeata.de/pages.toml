title = "arbtt-dump"
full_description = "arbtt-dump reads the data samples recorded by arbtt-capture(1) and writes them so the standard output in an ascii based format. This format is intended for human inspection, but not for further processing. Hence, it may change in new versions of arbtt without notice. Example output: This is the default serialization format of Haskell's Show type class, one entry per line. This can be useful if the data is to be processed by further Haskell code. Example output, with indentation added manually: For interoperability, arbtt supports dumping its data to JSON, which can easily be parsed by many different programming languages. Some level of backward-compatibility will be provided, as far as possible. Default output, again with indentation and spacing added manually:"
