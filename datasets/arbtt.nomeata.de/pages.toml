["http://arbtt.nomeata.de/doc/users_guide/index.html"]
title = "arbtt – The Automatic Rule-Base Time Tracker"
full_description = "Abstract arbtt is a background daemon that stores which windows are open, which one has the focus and how long since your last action (and possibly more sources later), and stores this. It is also a program that will, based on expressive rules you specify, derive what you were doing, and what for. It is comparable to the window trackers RescueTime, selfspy, TimeSnapper, and Productive Peach; but it differs from the manual timetrackers like Project Hamster which require the user to type a description of their activities. WarningThe log file might contain very sensitive private data. Make sure you understand the consequences of a full-time logger and be careful with this data."
