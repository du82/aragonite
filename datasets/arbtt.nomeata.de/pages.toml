["https://arbtt.nomeata.de/doc/users_guide/release-notes.html"]
title = "Release Notes"
full_description = "Support for the $hidden and $wdesktop variables in the configuration file, thanks to Tomáš Janoušek. Markus Hauck contributed the != operator, the “$now” variable and the condition construct (as well as other code cleanup). The command arbtt-import now supports reading JSON records, and can be used to append to an exising log file in a steaming fasion. arbtt-dump can now show the data in other formats as well, as suggested by Waldir Pimenta (option --format). This includes a human-readale output and JSON. When dumping samples with arbtt-stats or arbtt-dump (in human-readable mode), times are printed in the local time zone, as suggested by Oren Gampel. The name of the current desktop (or workspace) is also recorded, and available as $desktop (issue #56). Arbtt now has a proper testsuite integrated into Cabal, and an automated test infrastructure on Travis. Make sure that the log file is only readable by the current user. Thanks to Joey Hess for pointing that out. Massive memory footprint reduction, due to processing the data in one run. See my blog post for technical information. Support comparing a string to a list of strings, or matching it against a list ofregular expressions. The command arbtt-stats now supports the csv (comma-separated values) and tsv (TAB-separated values) report output formats in addition to text. (Muharem Hrnjadovic) Implement a custom compression method greatly reduce the file size of the log file. Run arbtt-capture to compress the previous samples as well. Use fetchName from xmonad instead of xFetchName, as it works with unicode characters in window titles. In the absence of _NET_CLIENT_LIST, look for application windows as children of the root windows. This should work for users of window managers like i3 without EWHM support. Be smarter when figuring out what window is active. Thanks to CJ van den Berg for investigating the issue. Read _NET_CLIENT_LIST for the list of applications, for compatibility with window managers such as metacity"
