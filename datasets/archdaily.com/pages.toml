title = "Stone House / Esquadra Arquitetos | ArchDaily"
description = "Completed in 2021 in Brasília, Brazil. Images by Joana França. The house is located near the city of Brasília, in SMDB, a predominantly individual residences sector, with its plot neighboring a park, a..."
full_description = '''document.getElementById('single-content').setAttribute('data-io-article-url', window.location.href); #newsroom-picture-att-id-67bca7fc2fe1ca0189a56622 { --featured-height: 426px; aspect-ratio: auto 640 / 426; @media (min-width: 769px) { .mini-content & { --featured-height: auto; max-width: 250px; float: left; margin: 0 20px 5px 0; } } } @media (max-width: 768px) { #newsroom-picture-att-id-67bca7fc2fe1ca0189a56622 { --featured-height: auto; } } Save this picture!© Joana França+ 29 Curated by Susanna Moreira Share ShareFacebookTwitterMailPinterestWhatsappOrhttps://www.archdaily.com/1011664/stone-house-esquadra-arquitetos Clipboard "COPY" CopyHouses•Brasília, Brazil Architects: Esquadra Arquitetos Area Area of this architecture project Area: 580 m² Year Completion year of this architecture project Year: 2021 Photographs Photographs:Joana França Manufacturers Brands with products used in this architecture project Manufacturers: Florense, Ikê Pedras, Light Design, Multipedras, Talentus Esquadrias, Tozetti, kings Lead Architect: Filipe Monte Serrat Project Team: Guido Saboya, Marcelo Gonçalves, Gabriela MedeirosConstruction: Tecna ConstrutoraLandscape Design: QuintaAutomation: MP AudioCity: BrasíliaCountry: BrazilDid you collaborate on this project?More SpecsLess Specs Save this picture!© Joana França Text description provided by the architects. The house is located near the city of Brasília, in SMDB, a predominantly individual residences sector, with its plot neighboring a park, a preservation area of the cerrado biome that reinforces the bucolic scale adopted by the city for this purpose. The project takes advantage of its location and context to establish guidelines, being the last plot of the condominium with a road system that uses a cul-de-sac, transforming the access to the terrain by vehicles a lighter route with less flow.Save this picture!© Joana França .related-products__loader--wrapper { grid-template-columns: repeat(4, calc(25% - 12px)); grid-template-rows: repeat(2, 200px); } @media (max-width: 767px) { .related-products__loader--wrapper { grid-template-columns: repeat(2, minmax(130px, 1fr)) !important; grid-template-rows: 200px 200px 250px !important; margin-bottom: 40px; } .related-products__loader--item-big .related-products__loader--img.product-placeholder__image { width: 100% !important; height: 350px !important; } .related-products__loader--wrapper .product-placeholder:nth-child(4), .related-products__loader--wrapper .product-placeholder:nth-child(5) { display: none; } } The design was built upon this smoother access, incorporating a port’cochère and considering the immediate surroundings, allowing views of the neighboring park, and the solar orientation to open the house towards it, utilizing minimal protective elements. Save this picture!© Joana FrançaSave this picture!Plan - Ground floorSave this picture!© Joana FrançaIn the garage, the use of the port-cochère allowed shelter for a greater number of vehicles, an open space that, besides its obvious use, enables various family activities. Within this area, a cabinet was designed for storage and housing some household equipment, alongside accommodating the eletric vehicles charging stations.Save this picture!IsometricThe materiality of the house expresses through the use of natural elements, whose textures and colors draw nature’s purest forms, even within the concrete in its composition. The stone appears in the divisions between exterior and interior spaces, allowing glimpses through these areas at certain points in the house. Concrete is present in the house’s volume and structural elements, forming its perception of rationalization through modulation. The wood is incorporated into protection panels, louvers, ceiling and deck flooring, its selective use aimed to achieve balance among the elements in the house’s composition, highlighting each one of them at different moments.Save this picture!© Joana França A large exposed concrete slab is supported by two inverted beams that stand out across the entire length of the house. A solid block upon these beams, resembling a massive stone, housing the office, of the predominantly single-story house, in a mezzanine with a view of the protection area.Save this picture!© Joana FrançaThe rhythm proposed by the placement of wooden louvers translate the arrangement of the house’s program, prevalent in bedroom areas and enclosed spaces, and open in the leisure area, allowing an unobstructed view of the garden and the park beyond. The shadows cast by these elements create diverse patterns throughout the day, offering new experiences in each period.Save this picture!© Joana França'''
