["https://archdaily.com/1027255/saint-jean-de-luz-cultural-center-dominique-coulon-and-associes"]
title = "Saint-Jean-de-Luz Cultural Center / Dominique Coulon & associés | ArchDaily"
description = "Completed in 2023 in France. Images by Eugeni Pons. The environment in which this cultural centre emerged is both magnificent and complex. The building enjoys splendid views of Saint-Jean-de-Luz Bay,..."
full_description = '''document.getElementById('single-content').setAttribute('data-io-article-url', window.location.href); #newsroom-picture-att-id-67bf405d258099018838d5e6 { --featured-height: 528px; aspect-ratio: auto 640 / 528; @media (min-width: 769px) { .mini-content & { --featured-height: auto; max-width: 250px; float: left; margin: 0 20px 5px 0; } } } @media (max-width: 768px) { #newsroom-picture-att-id-67bf405d258099018838d5e6 { --featured-height: auto; } } Save this picture!© Eugeni Pons+ 36 Curated by Hadir Al Koshta Share ShareFacebookTwitterMailPinterestWhatsappOrhttps://www.archdaily.com/1027255/saint-jean-de-luz-cultural-center-dominique-coulon-and-associes Clipboard "COPY" CopyTheaters & Performance•France Architects: Dominique Coulon & associés Area Area of this architecture project Area: 3250 m² Year Completion year of this architecture project Year: 2023 Photographs Photographs:Eugeni Pons Project Manager: Dominique Coulon & associés Structures: Batiserf Ingénierie Acoustics: ESP-DB Silence Architect: Dominique CoulonProject Supervision: Jean SchererWorksite Supervision: Jean Scherer, Hugo MauriceElectricity: BET Gilbert JostFluids: SOLARES BAUENEconomics: E3 ÉconomieScenographic Design: Changement à VueCountry: FranceMore SpecsLess Specs Save this picture!© Eugeni Pons Text description provided by the architects. The environment in which this cultural centre emerged is both magnificent and complex. The building enjoys splendid views of Saint-Jean-de-Luz Bay, only 500 metres away. The structure is not considered a single unit, but rather a series of fragments in which the different functions of the architectural programme are based. This spatial principle reflects the site's dimensions. It made it possible to freely play around with the sizes of the building's different parts and to reach the right balance.Save this picture!© Eugeni PonsSave this picture!Ground Floor PlanSave this picture!© Eugeni Pons .related-products__loader--wrapper { grid-template-columns: repeat(4, calc(25% - 12px)); grid-template-rows: repeat(2, 200px); } @media (max-width: 767px) { .related-products__loader--wrapper { grid-template-columns: repeat(2, minmax(130px, 1fr)) !important; grid-template-rows: 200px 200px 250px !important; margin-bottom: 40px; } .related-products__loader--item-big .related-products__loader--img.product-placeholder__image { width: 100% !important; height: 350px !important; } .related-products__loader--wrapper .product-placeholder:nth-child(4), .related-products__loader--wrapper .product-placeholder:nth-child(5) { display: none; } } An atrium stretches up, like a self-evident feature, between two parts: to its east, a vast theatre; to its west, three levels that contain superimposed sections – a music school, theatre rooms and dance studios. This triple height gives the place a noble aspect. The atrium stands out as the centre's beating heart that unites all the functions of the architectural programme within a collective structure and a site for sharing – a centre for togetherness and coexistence.Save this picture!© Eugeni PonsNatural light floods the interior. The glazed portions are invitations to discover the different spaces. This place is designed to create bonds. And it offers beautiful views of its garden. Indeed, this garden embellishes the cultural centre, showcasing it wonderfully. A small open-air theatre has been made in this outdoor space and two large rooms for collective practice lead outside generously. The layout, at once simple and elaborate, has the advantage of making the whole place, organised in this particular way, pleasantly compact.Save this picture!© Eugeni PonsSave this picture!© Eugeni PonsSave this picture!SectionsSave this picture!© Eugeni PonsThe centre combines practicality with poetic expression and the building's density ensures wonderful fluidity inside: to get around the interior, you cover short distances in hallways bathed in natural light. With its arrangement of rooms, put together in an abundance of light, this centre invites you to journey through it and underlines the different aspects of its rich architectural programme.Save this picture!© Eugeni Pons'''
