full_description = '''document.getElementById('single-content').setAttribute('data-io-article-url', window.location.href); #newsroom-picture-att-id-67b7d4fb7cae7a384c02f991 { --featured-height: 580px; aspect-ratio: auto 386 / 580; @media (min-width: 769px) { .mini-content & { --featured-height: auto; max-width: 250px; float: left; margin: 0 20px 5px 0; } } } @media (max-width: 768px) { #newsroom-picture-att-id-67b7d4fb7cae7a384c02f991 { --featured-height: auto; } } Save this picture!© Junaid Hasan Pranto+ 29 Curated by Miwa Negoro Share ShareFacebookTwitterMailPinterestWhatsappOrhttps://www.archdaily.com/1027218/amore-omor-residence-shatotto Clipboard "COPY" CopyHouses•Nikunjo, Bangladesh Architects: Shatotto Area Area of this architecture project Area: 145 m² Year Completion year of this architecture project Year: 2024 Photographs Photographs:Junaid Hasan Pranto Lead Architects: Prof Rafiq Azam Principal Interior Designer: Ar. Zannat JuiAssociate Architects: Jamal Hossain Shaon, Anika Asif, Md. Kamrul AlamStructural Engineer: Akter Hossen, Mohiminol IslamCity: NikunjoCountry: BangladeshMore SpecsLess Specs Save this picture!© Junaid Hasan Pranto Text description provided by the architects. Amore, love of a lawyer couple. This residence has been designed as a place of carnation for two busy young lawyers coming back home after a hectic day and turns into music lovers, art connoisseur, nature, and pet lovers. Although the lot size is only around 200 sqm, the design effectively accommodates both tangible and intangible functions, meeting the couple's desires. The thoughtful arrangement maximizes space, balancing functionality and personal needs while ensuring comfort and practicality within the limited area.Save this picture!© Junaid Hasan PrantoSave this picture!Basement Floor PlanSave this picture!© Junaid Hasan Pranto .related-products__loader--wrapper { grid-template-columns: repeat(4, calc(25% - 12px)); grid-template-rows: repeat(2, 200px); } @media (max-width: 767px) { .related-products__loader--wrapper { grid-template-columns: repeat(2, minmax(130px, 1fr)) !important; grid-template-rows: 200px 200px 250px !important; margin-bottom: 40px; } .related-products__loader--item-big .related-products__loader--img.product-placeholder__image { width: 100% !important; height: 350px !important; } .related-products__loader--wrapper .product-placeholder:nth-child(4), .related-products__loader--wrapper .product-placeholder:nth-child(5) { display: none; } } The basement is basically housing the music practice area, with light coming from the sky with sounds of water. The ground floor is primarily dedicated to parking, but features a green patch and water elements, complemented by a naturally lit lobby. The walls display carefully chosen artworks, setting a poetic tone for the house's entrance and creating a welcoming, visually striking atmosphere. The entrance gate, designed for both pedestrians and cars, is painted by artist Anukul Chandra Majumdar.Save this picture!© Junaid Hasan PrantoSave this picture!© Junaid Hasan PrantoSave this picture!Ground Floor PlanSave this picture!Second Floor PlanSave this picture!© Junaid Hasan PrantoSave this picture!© Junaid Hasan PrantoThis new initiative seamlessly integrates art and architecture, reflecting their harmonious connection and adding an artistic touch to the functional aspects of the entrance, enhancing the overall aesthetic of the house. Breaking social conventions, the design places all formal spaces on the top two floors, rather than the traditional lower levels. This unique approach challenges norms and redefines spatial hierarchy, offering a fresh perspective on the layout and function of the home. These spaces are seamlessly connected to open sky terraces, where lush, untamed greenery flourishes under the warmth of the western sunlight, evoking a sense of joy.Save this picture!© Junaid Hasan PrantoSave this picture!© Junaid Hasan PrantoAt the third level, a Delonex Regia (Krishnochura) tree has been planted, symbolizing the summer with its vibrant, fiery red blooms, adding a burst of color and energy to the environment, and celebrating nature's exuberance.Save this picture!© Junaid Hasan Pranto'''
