["https://archdaily.com/1027261/herfst-house-renovation-tweestroom-architecten"]
title = "Herfst House Renovation / tweestroom architecten | ArchDaily"
description = "Completed in 2024 in Belgium. Images by Nick Claeskens. Designing is about creating order by narrowing down abundant possibilities into conscious choices. When approaching a building, we begin by..."
full_description = '''document.getElementById('single-content').setAttribute('data-io-article-url', window.location.href); #newsroom-picture-att-id-67b91b0d2fe1ca0189a55f8b { --featured-height: 425px; aspect-ratio: auto 640 / 425; @media (min-width: 769px) { .mini-content & { --featured-height: auto; max-width: 250px; float: left; margin: 0 20px 5px 0; } } } @media (max-width: 768px) { #newsroom-picture-att-id-67b91b0d2fe1ca0189a55f8b { --featured-height: auto; } } Save this picture!© Nick Claeskens+ 21 Curated by Hadir Al Koshta Share ShareFacebookTwitterMailPinterestWhatsappOrhttps://www.archdaily.com/1027261/herfst-house-renovation-tweestroom-architecten Clipboard "COPY" CopyHouses, Renovation•Belgium Architects: tweestroom architecten Area Area of this architecture project Area: 61 m² Year Completion year of this architecture project Year: 2024 Photographs Photographs:Nick Claeskens Manufacturers Brands with products used in this architecture project Manufacturers: Sto, Koffie en Staal Structural Engineer: Jo Deflander Design And Execution: Katrien DelespaulDesign: Kristin Smets, Annelies BelemansExecution: Frédéric GijsenGeneral Contractor : Bouwbedrijf HustingsExternal Joinery: Baeten-Van EsInsulation: Peter De HertogKitchen: OlivanderMORTEX: DewecoCountry: BelgiumDid you collaborate on this project?More SpecsLess Specs Save this picture!© Nick Claeskens Text description provided by the architects. Designing is about creating order by narrowing down abundant possibilities into conscious choices. When approaching a building, we begin by considering what can be preserved, followed by quick wins. Major interventions are only made when they offer value on multiple fronts. Our focus is on balance, simplicity, and efficiency, intervening only when necessary. This approach reduces new material use and creates financial space for architectural creativity.Save this picture!© Nick ClaeskensSave this picture!PlanSave this picture!© Nick Claeskens .related-products__loader--wrapper { grid-template-columns: repeat(4, calc(25% - 12px)); grid-template-rows: repeat(2, 200px); } @media (max-width: 767px) { .related-products__loader--wrapper { grid-template-columns: repeat(2, minmax(130px, 1fr)) !important; grid-template-rows: 200px 200px 250px !important; margin-bottom: 40px; } .related-products__loader--item-big .related-products__loader--img.product-placeholder__image { width: 100% !important; height: 350px !important; } .related-products__loader--wrapper .product-placeholder:nth-child(4), .related-products__loader--wrapper .product-placeholder:nth-child(5) { display: none; } } Creativity through limitation - Good elements should be given a second life. Despite the need for a full renovation, the clients agreed to limit our intervention to the ground floor, handling the rest themselves. This freed up budget for more creative decisions. Discovering untapped potential - The unused west-facing facade and the 6.45-meter building width, which were not fully utilized, were key to the design. The terrace, while in good condition, was too small to be functional. One intervention with high impact - The existing extension was replaced by a grid of beams and columns, with a glass facade in between. This intervention adds value by: reducing the interior-exterior divide, allowing more evening sun, expanding the terrace, and enhancing the connection with the garden. The sloping roof of the extension maximizes northern light without causing overheating, giving the house a serene, airy atmosphere.Save this picture!© Nick ClaeskensSave this picture!© Nick ClaeskensBalanced facade composition - The house forms the end of a row of similar homes, with subtle brick detailing around the front door. We chose not to disrupt the street's unity by adding external insulation. Instead, we made subtle changes to enhance the existing facade. We lowered the ground-floor window to improve connection with the neighborhood. The west-facing facade, shaded by trees from the nearby park, benefits from improved insulation, using a simple ETICS system with a finish that matches the texture of the front facade. Extension and joinery – opaque and clear materials - The combination of steel and concrete in the extension's beams and columns balances the massiveness of the existing house with the lightness of the new glass facade. The joinery features grey anodized aluminum, complemented by red-brown wood accents, which add warmth to the design.Save this picture!© Nick ClaeskensSave this picture!SectionSave this picture!© Nick ClaeskensLimited interior finishes - The existing ceiling and walls were stripped to expose the raw concrete slabs and bricks. Together with the client, we carefully selected areas to plaster, leaving the new structure exposed. The floor was slightly raised to accommodate underfloor heating, finished in light grey Mortex. The kitchen materials follow a consistent color palette, with reinforced glass in the cabinet doors, interior doors, and garage door. The design maintains balance, with red-brown wood accents complementing the terrazzo countertop. The shapes are coordinated, with (semi)round door handles matching the curve of the island. The interior, a mix of new and secondhand items, was carefully curated by the client, with color accents that enhance the overall palette.Save this picture!© Nick ClaeskensSave this picture!© Nick ClaeskensFun detail - The cat's dish and the front door pull are made from the cutouts of the terrazzo countertop.Save this picture!© Nick Claeskens'''
