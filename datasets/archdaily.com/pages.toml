porary art from the 1960s to the 1990s. Rising above the cliff like a lighthouse, it appears to float in the air, resting on a water basin. Facing Rio de Janeiro’s Guanabara Bay in Brazil, its circular lines and revolutionary double-curved form stand out on the horizon, offering an open plaza of 2,500 square meters alongside a reflective pool that gives the structure a remarkable sense of lightness.+ 33https://www.archdaily.com/1027132/a-lighthouse-in-rio-de-janeiros-landscape-the-niteroi-contemporary-art-museum-by-oscar-niemeyerAgustina IñiguezSaveRead more » Post Office House / Cidade Branco ArquitectosMarch 01 #newsroom-picture-att-id-67c0fbef258099018838dee4 { --featured-height: 384px; aspect-ratio: auto 640 / 384; @media (min-width: 769px) { .mini-content & { --featured-height: auto; max-width: 250px; float: left; margin: 0 20px 5px 0; } } } @media (max-width: 768px) { #newsroom-picture-att-id-67c0fbef258099018838dee4 { --featured-height: auto; } } © David Pereira+ 35 Houses•Portugal Architects: Cidade Branco Arquitectos Area Area of this architecture project Area: 240 m² Year Completion year of this architecture project Year: 2024 Manufacturers Brands with products used in this architecture project Manufacturers: Azulcer, Cantinho do Vintage, Viúva Lamego, aNeveshttps://www.archdaily.com/1027485/post-office-house-cidade-branco-arquitectosAndreas LucoSaveRead more » Shanxia Cultural Station / MUFU Architectural Performance StudioMarch 01 #newsroom-picture-att-id-67b3c9cb003c6c018840e081 { --featured-height: 580px; aspect-ratio: auto 435 / 580; @media (min-width: 769px) { .mini-content & { --featured-height: auto; max-width: 250px; float: left; margin: 0 20px 5px 0; } } } @media (max-width: 768px) { #newsroom-picture-att-id-67b3c9cb003c6c018840e081 { --featured-height: auto; } } © Chen Xi Studio+ 28 Cultural Center•China Architects: MUFU Architectural Performance Studio Area Area of this architecture project Area: 418 m² Year Completion year of this architecture