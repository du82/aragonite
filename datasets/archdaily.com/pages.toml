full_description = '''document.getElementById('single-content').setAttribute('data-io-article-url', window.location.href); #newsroom-picture-att-id-67abd679ea72f10188034bdf { --featured-height: 478px; aspect-ratio: auto 640 / 478; @media (min-width: 769px) { .mini-content & { --featured-height: auto; max-width: 250px; float: left; margin: 0 20px 5px 0; } } } @media (max-width: 768px) { #newsroom-picture-att-id-67abd679ea72f10188034bdf { --featured-height: auto; } } Save this picture!© Giorgos Sfakianakis+ 20 Curated by Hadir Al Koshta Share ShareFacebookTwitterMailPinterestWhatsappOrhttps://www.archdaily.com/1026828/pinewood-international-school-anatolia-college-an-tombazis-and-associates-architects-plus-micromega-architecture-and-strategies Clipboard "COPY" CopyEducational Architecture, Schools•Pylaia Thessaloniki, Greece Architects: A.N. Tombazis & Associates Architects, Micromega Architecture & Strategies Area Area of this architecture project Area: 3800 m² Year Completion year of this architecture project Year: 2024 Photographs Photographs:Giorgos Sfakianakis Manufacturers Brands with products used in this architecture project Manufacturers: EGGER, Alumil, ABB, Abas, Abopart, Air Grilles, Airtechnic, Akritas, Aquatherm, Bauder, Belimo, Bisol, CBI, Cablel, Caparol, Courbi, Daikin, Duropal, EKA Hellas, Electrocanali, +39Elvan, Erse, Feron, Fotiadis, Frantzis, Hikvision, Honeywell, Icel, Inim, Isomat, Kassinakis, Kentec, Kiskinidis, Kleemann, Knauf, Kostal, Kouvidis, LG Air Conditioners, Lafarge, MDD, Metal Trade Comax, Metallodomi, Nexans, Ninz, Novair, Optima, Panduit, REHAU, Ruck Ventilatoren, SMAY, Sanelco, Soleco, Solomonidi Marbles, Steelcase, Stone Group, TECHLUMEN, Tarkett, Vanerum, WILO-39 Structural Design: METE SA Structural Design and Engineering Electrical Design: INSTA Consultants Engineers - N. Prounias Lighting Design: IFI Lighting construction company: ETETH S.A. Acoustics consultant: Dr G.Schubert Lead Architects Micromega Team: Alexandros Zomas, Mara Papavasileiou, Margarita MichaArchitects Micromega Team: Natalia Tsakalaki-Karka, Dimitris Karanasios, Dimitris Papageorgiou, Anna TsokaLead Architects An Tombazis & Associates Architects Team: Stavros Gyftopoulos, Yiannis RomanosDesign Team An Tombazis & Associates Architects Team: K. Varvitsiotis, Avgi Chatzipetrou, Vassiliki Makrozachopoulou, Ellie Karakatsani, Myrto Koutroupi, Kontsantina Frantzeska NafpliotiOwner: Anatolia College Board of TrusteesCity: Pylaia ThessalonikiCountry: GreeceMore SpecsLess Specs Save this picture!© Giorgos Sfakianakis Text description provided by the architects. Pinewood School in Anatolia Campus: blending contextual design and vibrant aesthetics into an inclusive experience. The new Pinewood School represents a contemporary architectural landmark within the historic Anatolia College campus in Pylaia, on the outskirts of Thessaloniki. Emphasizing experiential education and sustainable design, the building offers a vibrant learning environment tailored to prepare students for a globalized future.Save this picture!© Giorgos SfakianakisSave this picture!© Giorgos SfakianakisSave this picture!Floor PlanSave this picture!© Giorgos Sfakianakis .related-products__loader--wrapper { grid-template-columns: repeat(4, calc(25% - 12px)); grid-template-rows: repeat(2, 200px); } @media (max-width: 767px) { .related-products__loader--wrapper { grid-template-columns: repeat(2, minmax(130px, 1fr)) !important; grid-template-rows: 200px 200px 250px !important; margin-bottom: 40px; } .related-products__loader--item-big .related-products__loader--img.product-placeholder__image { width: 100% !important; height: 350px !important; } .related-products__loader--wrapper .product-placeholder:nth-child(4), .related-products__loader--wrapper .product-placeholder:nth-child(5) { display: none; } } Designed to serve students from grades 6 to 1, the school reflects a multicultural ethos, fostering social interaction and spontaneous gatherings. Its modern architectural expression combines bold colors, light steel structures, concrete elements, and expansive curtain walls. Despite its contemporary language, the design harmonizes with the campus's existing buildings and the historic garden.Save this picture!© Giorgos SfakianakisLocated on a sloping site descending east to west, the school respects the campus's historic axis. This circulation axis connects the main building to the open stadium, passing through a preserved historic garden with centennial trees. To maintain the integrity of this axis, the school's primary functions are distributed across two wings, linked by an elevated promenade. This lightweight steel structure not only unites the wings but also offers sweeping views of the stadium and surrounding landscape.Save this picture!© Giorgos SfakianakisSave this picture!© Giorgos SfakianakisEach wing is further divided into two linear modules, ensuring optimal south-facing orientation for classrooms. This layout creates two atriums—one open and one enclosed—that enhance spatial flexibility and encourage seamless interaction between indoor and outdoor environments. The enclosed atrium features a striking canopy supported by steel columns resembling trees, evoking a playful metaphor for the "Pinewood" name.Save this picture!© Giorgos SfakianakisThe gym, positioned on the lower level, connects seamlessly to both an outdoor courtyard and the stadium. Sustainability lies at the heart of the project. Bioclimatic principles minimize energy consumption while maximizing natural light and ventilation. Energy-efficient glazing, shading systems, and thoughtful landscaping contribute to thermal comfort and a pleasant year-round microclimate. The new Pinewood School exemplifies the integration of innovative design and environmental responsibility, creating a space that supports academic excellence and community engagement.Save this picture!© Giorgos Sfakianakis'''
