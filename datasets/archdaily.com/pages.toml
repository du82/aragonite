["https://archdaily.com/1023349/vila-do-chapeu-henry-teixeira-arquitetura-e-urbanismo"]
title = "Vila do Chapéu Square / Henry Teixeira Arquitetura e Urbanismo | ArchDaily"
description = "Completed in 2024 in São Gonçalo do Amarante, Brazil. Images by Felipe Petrovsky. HT Arquitetura e Urbanismo has been designing and building a wide variety of projects and skateparks over the last few years. In this case, we have a..."
full_description = '''document.getElementById('single-content').setAttribute('data-io-article-url', window.location.href); #newsroom-picture-att-id-672e6a481aabc50001a9c209 { --featured-height: 426px; aspect-ratio: auto 640 / 426; @media (min-width: 769px) { .mini-content & { --featured-height: auto; max-width: 250px; float: left; margin: 0 20px 5px 0; } } } @media (max-width: 768px) { #newsroom-picture-att-id-672e6a481aabc50001a9c209 { --featured-height: auto; } } Save this picture!© Felipe Petrovsky+ 16 Curated by Susanna Moreira Share ShareFacebookTwitterMailPinterestWhatsappOrhttps://www.archdaily.com/1023349/vila-do-chapeu-henry-teixeira-arquitetura-e-urbanismo Clipboard "COPY" CopyPublic Space•São Gonçalo do Amarante, Brazil Architects: Henry Teixeira Arquitetura e Urbanismo Area Area of this architecture project Area: 3775 m² Year Completion year of this architecture project Year: 2024 Photographs Photographs:Felipe Petrovsky Lead Architects: Henry Teixeira City: São Gonçalo do AmaranteCountry: BrazilMore SpecsLess Specs Save this picture!© Felipe Petrovsky Text description provided by the architects. HT Arquitetura e Urbanismo has been designing and building a wide variety of projects and skateparks over the last few years. In this case, we have a very specific solution for the design of the central square of the "Vila do Chapéu" gated development, located on Taíba beach, 74 km from the city of Fortaleza, capital of the state of Ceará, Brazil. The space has 2 skateparks, 2 beach tennis courts, communal toilets, 1 coconut grove, 1 children's playground and a gym.Save this picture!© Felipe PetrovskySave this picture!© Felipe Petrovsky .related-products__loader--wrapper { grid-template-columns: repeat(4, calc(25% - 12px)); grid-template-rows: repeat(2, 200px); } @media (max-width: 767px) { .related-products__loader--wrapper { grid-template-columns: repeat(2, minmax(130px, 1fr)) !important; grid-template-rows: 200px 200px 250px !important; margin-bottom: 40px; } .related-products__loader--item-big .related-products__loader--img.product-placeholder__image { width: 100% !important; height: 350px !important; } .related-products__loader--wrapper .product-placeholder:nth-child(4), .related-products__loader--wrapper .product-placeholder:nth-child(5) { display: none; } } Morro do Chapéu is one of the beaches of Taíba, which is a tourist destination in the Brazilian state of Ceará. It has 10 km of beautiful beaches, with a wide strip of sand, dunes and sandstone reefs, many cliffs, natural pools and is populated by a native population that exploits fishing and tourism. With this in mind, the design solution was inspired by the exuberant nature that exists there and seeks to integrate with it.Save this picture!© Felipe PetrovskyThe design solution focused on creating a meeting point for users to integrate with the space, as it is a famous surfing break. In this way, there was an integration between skateboarding and surfing, where the 2 tracks are designed for "carver skateboarding", but without restricting the use of all sports such as bmx or rollerblading. In this way we have a small track, focused on learning, in the wave format and a large track for the more advanced user in the snake format.Save this picture!© Felipe PetrovskySave this picture!© Felipe PetrovskyTo complement the sports for the users, two beach tennis courts and a gym were designed, which were made with sand from the land itself, using a natural transition from the site, in rolled pebbles, to the concrete floors that dominate the general setting. In the specific case of the gym, a wooden equipment solution was adopted, in this case for better performance against the sea air and to fit in with the natural style of the sand floor.Save this picture!© Felipe PetrovskyDesigned in the shape of a surfboard, the overall design also includes play areas such as a leisure slope, a children's playground, as well as open walks and a coconut grove. Together with the sports areas, these items complement the appropriation and use of the space by an entire family, given that the space is a tourist and leisure destination.Save this picture!© Felipe Petrovsky'''
