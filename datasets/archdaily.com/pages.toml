title = "Guanyun Qiantang City / Aedas | ArchDaily"
description = "Completed in 2024 in China. Images by Arch-Exist. The project is located in the Olympic Sports Expo City area, adjacent to the Qiantang River on the west and Olympic Sports Expo Centre on the South...."
full_description = '''document.getElementById('single-content').setAttribute('data-io-article-url', window.location.href); #newsroom-picture-att-id-67ab7adbdae348018ae8897b { --featured-height: 480px; aspect-ratio: auto 640 / 480; @media (min-width: 769px) { .mini-content & { --featured-height: auto; max-width: 250px; float: left; margin: 0 20px 5px 0; } } } @media (max-width: 768px) { #newsroom-picture-att-id-67ab7adbdae348018ae8897b { --featured-height: auto; } } Save this picture!© Arch-Exist+ 22 Curated by 韩爽 - HAN Shuang Share ShareFacebookTwitterMailPinterestWhatsappOrhttps://www.archdaily.com/1026807/guanyun-qiantang-city-aedas Clipboard "COPY" CopyOffice Buildings, Commercial Architecture•China Architects: Aedas Area Area of this architecture project Area: 334 m² Year Completion year of this architecture project Year: 2024 Photographs Photographs:Arch-ExistDesign Director: Dr. Andy Wen, Global Design Principal; Nicole Liu, Executive DirectorClient: Boee Real Estate, Zheshang Industrial IntegrationCountry: ChinaMore SpecsLess Specs Text description provided by the architects. The project is located in the Olympic Sports Expo City area, adjacent to the Qiantang River on the west and Olympic Sports Expo Centre on the South. Perched on a providential position, the project enjoys excellent cityscape view and well-connected transportation network.Save this picture!© Arch-ExistSave this picture!© Arch-Exist .related-products__loader--wrapper { grid-template-columns: repeat(4, calc(25% - 12px)); grid-template-rows: repeat(2, 200px); } @media (max-width: 767px) { .related-products__loader--wrapper { grid-template-columns: repeat(2, minmax(130px, 1fr)) !important; grid-template-rows: 200px 200px 250px !important; margin-bottom: 40px; } .related-products__loader--item-big .related-products__loader--img.product-placeholder__image { width: 100% !important; height: 350px !important; } .related-products__loader--wrapper .product-placeholder:nth-child(4), .related-products__loader--wrapper .product-placeholder:nth-child(5) { display: none; } } Andy shares, 'The Guanyun Qiantang City is a landmark commercial building that integrates cultural context, offering a unique experience for the city.'Save this picture!© Arch-ExistSave this picture!© Arch-ExistThe design draws inspiration from the aphorism of 'setting sail'. It assimilates the towers into the plot and the river in a sailboat form, emblematic of a riding wave of prosperity. The towers feature a unique overall image, with varying heights and overlapping layers that create a vibrant silhouette, resembling the dynamic posture of sails catching the wind. It echoes the surrounding development and forms a skyline along the Qiantang River.Save this picture!© Arch-ExistSave this picture!Plan - ZoningSave this picture!© Arch-ExistThe tower symbolises sail and wind, combined with the staggered glass curtain walls. The flowing river currents are reflected in the curves of the podium, together forming a tall and lightweight architectural silhouette that harmoniously blends with the greenery along the waterfront, presenting a beauty of natural harmony.Save this picture!© Arch-ExistThe overall plan places a strong emphasis on the connection with nature. 5 towers are ingeniously laid out to secure permeability and maximise views to the Qiantang River. Through public spaces like pedestrians paths, the Guanyun Qiantang City is well-connected with the nature and creates a multi-dimensional waterfront plaza and terraced green space.Save this picture!© Arch-Exist'Guanyun Qiantang City showcases a distinctive architectural form and a people-centric experience, offering an immersive engagement with the city.' Nicole says.Save this picture!© Arch-ExistSave this picture!© Arch-Exist'''
