full_description = "Lands of RuneQuest: Dragon Pass, Ossi Hiekkala 2024 Lands of RuneQuest: Dragon Pass October 10, 2024 Chaosium has released a new sourcebook, Lands of RuneQuest: Dragon Pass, for which I have done not only the cover but also a great amount of interior art! Read More In News, Illuminations Tags Roolipeli, RQ, Runequest, Roleplaying game, Art, Book Cover, cover, Illustration, Illustrator, Kansi, kansikuva, Kuvitus, Kuvittaminen, Digitaalinen, Digital, peli, Pelit, Fantasy, Fantasia, News, Uutisia Comment Lunar Soldiers, Ossi Hiekkala 2023 The Lunar Way May 23, 2024 Chaosium has released Cults of RuneQuest: The Lunar Way, featuring the first two illustrations I've done for Chaosium's books since I started as a staff artist last October. Read More In Illuminations, News Tags Kuvittaja, Kuvitus, Roolipeli, Roleplaying game, Illustration, Illustrator, Runequest, peli, Fantasy, Fantasia, Digitaalinen, Digital, Chaosium Comment Mythology: Wedding Vows October 16, 2023 What you see here is an Orlanthi wedding ceremony. The man, representing Orlanth, the god of the storm, is kneeling before the woman, representing Ernalda, the goddess of earth and fertility. Read More In News, Illuminations Tags Illustration, Illustrator, Fantasy, Fantasia, Kuvitus, Kuvittaja, RQ, Runequest, Digitaalinen, Digital, News, Uutisia Comment Valind’s Glazier. Illustrations for Cults of RuneQuest: The Lightbringers & The Earth Goddess August 21, 2023 Chaosium Inc. has released two new sourcebooks for RuneQuest RPG, Cults of RuneQuest: The Lightbringers and Cults of RuneQuest: The Earth Goddess, Read More In Illuminations, News Tags Roolipeli, Roleplaying game, RQ, Chaosium, Illustration, Illustrator, Kuvittaja, Kuvitus, Fantasy, Fantasia, Ruoka, Food, Digitaalinen, Digital, News, Uutisia Comment Burger King Pride Week 2023 June 27, 2023 Burger King assigned me to do an another Pride Week illustration. This time the King is showing their colours. Read More In News, Illuminations Tags Illustration, Illustrator, Kuvittaja, Kuvitus, Mainos, Advertisement, Digital, Digitaalinen, News, Uutisia Comment"
