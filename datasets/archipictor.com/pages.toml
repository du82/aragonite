["https://archipictor.com/about-contact"]
title = "About / Contact — Archipictor"
full_description = 'View fullsize About I have been working as a professional illustrator since 2005. I do illustrations for advertisements, packaging, board games, editorials and books, etc. I have special interest and expertise in characters, food, history and storytelling.Archipictor means "master painter" in Latin, and he was the head illustrator of illuminated manuscripts in medieval monastary.Olen toiminut kokopäiväisenä kuvittajana vuodesta 2005 alkaen. Kuvitan mm. mainoksia, pakkauksia, lautapelejä, lehtiä ja kirjoja. Olen erityisen kiinnostunut hahmoista, ruoasta, historiasta ja tarinankerronnasta.Archipictor tarkoittaa "maalarimestaria" latinaksi, ja hän oli kuvakäsikirjoitusten pääkuvittaja keskiaikaisessa luostarissa.“[A] style that bridges the gap between classic and modern”- Jamey Stegmeyer, Stonemaier Games ContactArchipictorOssi HiekkalaOritmurronkuja 43 A04430 JärvenpääFinland+358 50 524 5802ossi@archipictor.comRepresentation in FinlandNAPA Arts & Licencing Agency+358 40 701 4093info@napa-agency.finapa-agency.fi/kuvittaja/ossi-hiekkala/LinksInstagramFacebookArtstationCustomersMy customers include:Alley Cat GamesAltiaArlaBoogie SoftwareBurger KingChaosium Inc.Crime TimeDr. Finn’s GamesFazerHartwallHelsingin SanomatHSLIngmanKaristoKeskoKoneLautapelit.fiOolanninOtavaPostiRenaultRenegade Game StudiosSaarioinenSnellmanS-RyhmäTaffelTiedeTGG GamesSuomen UNICEFVaasanValio'
