["https://archive-it.org/collections/7253"]
title = """
Archive-It - 
  
\t      Chicago Music Scene Web Archive"""
full_description = "The Chicago Music Scene web archive hopes to capture the “scene” in the Chicago musical community by documenting the web presence of specific ensembles, venues, festivals and publications. Before the utility of the Internet, musical activity was publicized in print publication, on broadsides, in pamphlets and in other ephemeral material. An understanding of the support and activity within a musical culture (or scene) is demonstrated in archival collections that hold this kind of material. Today, a music scene is represented on the web. As a searchable database, this archive offers the ability to learn about the current music scene in Chicago as it develops. Statement of Bias in Metadata: Metadata is the language used in Northwestern University Libraries’ (NUL) catalog, online tools, archives, and digital collections to describe and manage resources and enable their discovery and ongoing access by the scholarly community. NUL acknowledges the reality that our metadata and practices reflect a white supremacist and discriminatory culture. For additional information and to submit suggestions, questions, or comments, see: https://libguides.northwestern.edu/c.php?g=1152430 Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: The website for a-pe-ri-od-ic, a performance ensemble based in Chicago. A-pe-ri-od-ic explores various musical elements and performs innovative, experimental interpretations of post-Cagean pieces. Description: The website for Double Door, a bar and music venue in Chicago's Wicker Park neighborhood that hosted live shows from 1994-2018. Events at Double Door included comedy shows, DJ sets, and live concerts across many genres. Description: The website for The Empty Bottle, a bar and music venue in Chicago's Ukrainian Village neighborhood. Since its founding in 1992, the Empty Bottle has risen to prominence in Chicago's alternative music scene, and became open seven days a week with performances and special events nearly every night."
