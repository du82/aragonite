full_description = "The COVID-19 pandemic, also known as the coronavirus pandemic, was caused by a viral strain of the severe acute respiratory syndrome coronavirus 2 (SARS-CoV-2) which was first identified as an outbreak in Wuhan, China in December 2019. The United States’ first documented case of the virus was in January 2020 and the World Health Organization categorized the outbreak as a pandemic on March 11, 2020. In an effort to minimize transmission of the virus, Northwestern University responded by transitioning to remote education and services early in the pandemic and participating in research related to the virus and treatments. This collection of web archives documents the COVID-19 pandemic through the lens of Northwestern University. Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages."
