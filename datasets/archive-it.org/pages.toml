full_description = "The American Legion was founded in 1919 by World War I veterans to help meet the needs of veterans and their family in communities across the nation. This collection contains websites, videos and documents primarily created by the American Legion National Headquarters. The Library and Museum at the American Legion is charged to collect, maintain, and make available the historical documents and artifacts relating to The American Legion National Organization. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. The American Legion Centennial Celebration website launched in 2013 as a platform for American Legion posts to share their history and current activities. American Legion post officials have the opportunity to include a timeline of events, photos and upcoming post activities. The American Legion Child Welfare Foundation, Inc. founded by The American Legion as a separate nonprofit corporation in 1954. As a charitable organization, the main priority is to provide other nonprofit organizations with the means to educate the public about the special needs of children across this nation. The website provides a brief overview of the foundation plus details of awards, grants and recipients. The Citizens Flag Alliance (CFA) established in 1994 is a broad-based, nonpartisan, nonprofit, national organization, which was formed to persuade Congress to pass a constitutional amendment that would return to the American people the right to protect their flag. A collection of websites that document the e-commerce activities of the Emblem Sales Division, which produces products to promote and support the activities of the organization. A community platform launched in 2009 to promote the organization’s activities to honor and aid America’s veterans, their families and community. A collection of American Legion websites to promote the work of the organization including the promotion of fundraising campaigns and the planned giving program."
