full_description = "The Northwestern University Web Archives is dedicated to the documentation and preservation of Northwestern's online records of enduring historical and administrative, legal, or cultural significance. These archived websites complement manuscript collections and record groups held at the Northwestern University Archives and include content created by individuals associated with Northwestern including faculty, staff, students, and alumni, as well as Northwestern-related publications, associated entities within the local community, and other pertinent content. The Northwestern University Archives has selected these websites to document academic, administrative, research, athletic, public service, and social activities and reflect the evolving nature of the university's web presence. Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: A website providing information about a series dedicated to Northwestern faculty seeking online resources for digital scholarship. Description: A website representing the Northwestern Alumni Association, which is a community dedicated to providing resources to alumni such as event information, networking opportunities, and community involvement. Description: Web archive of Anthony Opal's website. Anthony Opal is the author of Action and a founding editor of The Economy, and a Northwestern alum in the Creative Writing MFA program. Description: A&O Production web archives. A&O is a student group at Northwestern that organizes events for the student body, such as concerts, film viewings, and speaker events. Description: The web archives of the Northwestern Associated Student Government (ASG). ASG is devoted to serving the student body by understanding the needs of the community and liasing with the university to ensure that Northwestern is acting in the interests of its constituents. Des