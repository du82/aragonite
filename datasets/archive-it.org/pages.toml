\t      Rio Grande Watershed and Texas Water Issues Web Collection"""
full_description = 'Websites and blogs addressing water issues in Texas and throughout the Rio Grande/Bravo Watershed. This collection is inactive and is no longer being crawled by UTSA Special Collections. Past crawls are still accessible. Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: A blog with ideas for conserving water, specifically ideas for Texas. This website ceased to exist sometime between March 2013 and January 2014 Description: Provides regular updates on drought status in the Barton Springs/Edwards Aquifer Conservation District Description: Blog featuring news updates and opinion pieces on water issues in Texas and the Southwest. Description: The mission of the Rio Grande International Study Center is to "preserve, protect, and foster respect for the Rio Grande-Rio Bravo, its watershed, environment and cultures through research, education, binational stewardship, and alliances with individuals, agencies, and organizations." Description: The Rio Grande Institute is working to foster appreciation of the unique economic, cultural and natural resources of the Rio Grande/Rio Bravo border and to facilitate informed action to conserve those resources and use them for the public good. Description: Blog for a 2009 class taught by Mark McGinley on the cultural and biological history of the Rio Grande. Description: A blog featuring periodic updates on news related to water use in the Rio Grande Watershed. Description: The project seeks to restore and conserve the historical functions and vitality of the Rio Grande in Colorado for improved water quality, agricultural water use, riparian health, wildlife and aquatic species habitat, recreation and community safety. Description: The Rio Grande Regional Water Planning Group (Rio Grande RWPG) is one of 16 local bodies established under Senate Bill 1 to coordinate long-range water supply planning by bringing together local stakeholders. It includes Maverick, Webb, Zapata, Jim Hogg, Starr, Hidalgo, Willacy, and Cameron counties.'
