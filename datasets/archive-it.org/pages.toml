["https://archive-it.org/organizations/304"]
title = """
Archive-It - 
  
\t      Columbia University Libraries"""
full_description = "The Columbia University Libraries (CUL) web resources collection program archives selected websites in thematic areas corresponding to existing CUL collection strengths, websites produced by affiliates of Columbia University, and websites from organizations or individuals whose papers or records are held in CUL's physical archives. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. A growing collection of museum and gallery websites documenting art exhibitions, focusing on exhibitions for which supplementary publications (such as exhibition catalogs) are not readily available. This web archive aims to preserve these sites as a way of documenting the exhibitions and making the relevant information available and discoverable for current and future researchers. When available, artists’ names are included in the website descriptions to facilitate keyword searching. At present, the collection focuses on exhibitions featuring BIPOC artists. Click here to recommend a website for inclusion in this collection. A collection of websites associated with organizations for which the Burke Library at Union Theological Seminary also holds physical archival materials. These websites therefore augment or help contextualize the other archival materials and collections. In 2020 the ongoing partisan struggle in the United States between advocates for voting rights and official proponents of voter suppression measures came to a head during a bitter presidential election campaign conducted amidst the substantial additional challenges to participatory democracy posed by the global pandemic. The election saw historic turnout, but also a sustained effort by the defeated incumbent to challenge the election’s legitimacy, spurring a violent insurrection on the Capitol on January 6, 2021 to attempt to disrupt the U.S Congress from certifying the Electoral College results. As the Biden administration gets underway with narrow Democratic Party control of the House and Senate, while legislatures in multiple states are advancing new voter restrictions, structural democracy reform and voting rights will be at the heart of major legislative debates in 2021 and beyond. Columbia University Libraries has initiated a new thematic web archive collection devoted to documenting these historic debates and any ensuing legislation, both at the national and in selected local contexts, focusing on democracy reform and voting rights and subtopics including: campaign finance reform; electoral college reform (including the National Popular Vote interstate compact); the equal-time rule; gerrymandering; ranked-choice voting; universal voter registration; voter identification; voter suppression; DC Statehood; Puerto Rico Statehood; and Supreme Court expansion/reform."
year_published = 2025
