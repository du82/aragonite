full_description = "Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. BOYS, BOYS, BOYS! Violence, car games, and way more. Are YOU READY TO ROCK!!? Some games include was simulations. You are a cdharacter in the war and get to choose your armor and defense. It's violent, but it's only virtual and it's all in fun. Nobody really gets hurt. Some games are sports and in arenas. You might get killed but only online and you get to have another life and play again. Most games have you start with three lives, and that's two more than the real thing. Don't try this at home!! Subject: Arts & Humanities, Computers & Technology, Society & Culture, Gaming & Entertainment for Boys, Guy Games! Now you can also look at Class 5-302A's funny videos made for a contest titled BrainyFlix. We were supposed to define SAT words and make a humorous video about the word. Vanessa & Latanya made a video for the word Intrepid and it rocked! Watch them now! Maria and Siva have a video for Pugnacious which is an editor's top pick. Want to know what rancid and abduct mean? We have videos for that. Raheel and Shalom made a video so we'll understand what juvenile means. Michaela is unique -- and so is her video and embellish your life with Gagandeep's definition (and video design). Don't know what canvas means? Anton and Aaron will show you. We all use an alias online but Isha has perfected with her video definition. Identifier: funny,SAT words, hilarious, kids,videos,contest,pugnacious,rancid,intrepid,abduct,juvenille,canvas I chose this website because I am an entomologist and like to learn more about the newest bug around the world. On these sites you can learn about bug identification, you get to post new findings to share with the science community, and your posts can be answered in the form of a blog. It's a message board, blog, and information resource all in one series of sites."
