full_description = "Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. The Andrew Seager Archive of the Built Environment, A Division of University Libraries located in the Libraries located in the Estopinal College of Architecture and Planning, contains over 120,000 original architectural drawings, landscape plans, blueprints, photographs, models, and building remnants that tell the stories of Indiana’s sites and structures. This repository contains websites that are deemed historically relevant but are not affiliated with Ball State University, Delaware County, or the Andrew Seager Archive of the Built Environment. Named for former Ball State history professor Althea L. Stoeckel, the Stoeckel Archives contains documentation on Muncie and Delaware County, Indiana, including records of business and industry, churches, clubs and organizations, education, genealogy, government, personal and family papers, photographs, and oral histories. The Ball State University Archives serves as the official memory of the institution, ensuring access to and preservation of the records of Ball State University that have long-term historical, legal, fiscal and administrative value."
