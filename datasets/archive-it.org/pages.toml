["https://archive-it.org/organizations/66"]
title = """
Archive-It - 
  
\t      Library of Virginia"""
full_description = "The Library of Virginia serves as the Commonwealth's archival agency, the reference library at the seat of government, and as one of the nation's premier research institutions for Virginia history, politics and culture. The library holdings attract researchers from across the country and worldwide to their Richmond location and to their digital resources available on the web. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. On March 23, 2020, Virginia Governor Ralph Northam issued Executive Order No., 53 that ended all in-person instruction at K-12 schools in the Commonwealth’s 132 school divisions. With schools now closed for the remainder of 2019-2020 academic year, each school division determined how learning would continue. The Virginia Department of Education (VDOE) issued guidance to help school divisions execute plans to continue instruction. In order to capture the implementation of VDOEs changing guidance, this collection archives each school division’s website as well as any COVID-19 specific sites from April 2020 to August 2022. Also included are COVID-19 specific websites for Virginia’s colleges and universities and the Virginia Department of Education website. This collection of over 500 websites documents the digital divide and the need for rural broadband, the importance of schools providing meals to students, mask and quarantine policies, and the use of a variety of digital platforms used for online learning. Subject: Spontaneous Events, Universities & Libraries, Government, COVID-19 (Disease), Public Schools - Virginia, Education - Virginia., Virginia. Dept. of Education., Virginia. Governor (2018-2022 : Northam), Higher education - Virginia. Rights: This content is freely available online. No restrictions on access. , The copyright status of this material is not known. Users are responsible for determining whether the material may be re-used for publication."
