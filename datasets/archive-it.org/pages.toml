full_description = "The American College of Surgeons (ACS) is a scientific and educational association of surgeons that was founded in 1913 to improve the quality of care for the surgical patient by setting high standards for surgical education and practice. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. The ACS Bulletin Brief weekly newsletter began in 2020 and was renamed to the ACS Brief on May 3, 2022. The American College of Surgeons (ACS) publishes a variety of newsletters targeted toward specific interests of the surgical community. Browse our full collection of titles, and stay up to date on topics ranging from quality cancer care to health care advocacy. The first Congress in 1910 lasted from Nov. 7th to 19th and was attended by 1300 surgeons who sought tickets to clinics throughout Chicago to observe operations in galleries and amphitheaters at hospitals choosing to participate. From the second year, daily newspapers were produced for each of 5 days of the second Congress in 1911. This collection holds the most recent online iterations of CC News from 2018 - present. Issues include daily news on programs, special events, program details, etc. Earlier issues can be found at www.facs.org/archives"
