\t      Middlebury Web Archives"""
full_description = '''Blogs, social media presences, websites, and other Web media representing life and activity surrounding - but not necessarily hosted by - Middlebury College. From the lighter side of student life to deep critical engagement with campus culture, this transinstitutional collection is intended to document life at Middlebury outside the official channels of communication, to archive diverse points of view and student activities, and to create a historical record of dynamic and engaging discussions that define our collective experience at Middlebury College. Subject: Society & Culture, Blogs & Social Media, Spontaneous Events, Campus culture, Social justice, Student organizations, Student activism, Critical discourse, Humor, Campus politics, College activities, Student life Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: A website with more information on the Middlebury College branch of 180 Degrees Consulting. Description: Addison County Independent article on Charles Rainey's experience with anonymous social media harrassment via Yik Yak. Description: In this editorial for The Addison Independent, Ata Anzali, a professor of religion, reflects on the events of the March 2nd protest. He looks back on his experience as a student at Iran Polytechnic University, specifically on an occasion when right-wing student groups prevented the reformist Abdol-Karim Soroush from speaking. He argues that by denying Murray the chance to speak, student protesters at Middlebury "took the tremendous amount of freedom that they had for granted," especially by not paying attention to the fragility of such rights in a global and historical context. Subject: Charles Murray, Free speech, Student activism, Academic discourse, March 2nd protest, Abdol-Karim Soroush Description: An open letter by a pseudonymous former student of Middlebury College, in which the author describes their experience as a victim of sexual violence on campus.'''
