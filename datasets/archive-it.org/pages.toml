full_description = "A four-year private Christian university, Abilene Christian University provides exceptional academics in a Christ-centered community. It includes the colleges of Arts and Sciences, Biblical Studies, Business Administration, Education and Human Services, Graduate and Professional Studies, and Honors; the Graduate School of Theology; and the schools of Information Technology and Computing, Nursing, and Social Work. ACU is affiliated with the Churches of Christ and is one of the largest private universities in the Southwest. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. The CHARIS website hosted conversations of and about Churches of Christ. In partnership with the ACU Library and the Siburt Institute for Church Ministry at Abilene Christian University (Abilene, TX), the website was supported and led by the Center for Heritage and Renewal in Spirituality (CHARIS) at ACU. The Center’s mission was to renew Christian spirituality through engagement of Christian heritage, at Abilene Christian University and beyond. The views expressed on the CHARIS website are those of the various authors, and do not necessarily represent the views of Abilene Christian University or CHARIS at ACU. The CHARIS website is no longer active and this serves as a preservation and use version of the website."
