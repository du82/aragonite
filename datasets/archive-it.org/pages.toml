full_description = '''Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: This website gives information of the other branch of Mexico's ancients the Aztecs. They followed much of the Maya's rules, but there are many distinguishing features, and this website will give you information about it. It'll make you an expert on Aztec history. Description: This site not only gives information about Christian Culture, it gives information and a "definition", or simply a thinking process about the word culture, and what it means to other people and cultures. It gives prayers and how the world (in Christian culture) was made. Description: This website describes the feats of the infamous Jesus, his followers, his principles and more. It gives information about many figures in the feild of Christian culture. Description: Music is part of who we are and expresses culture too. This website explains in detail how music is associated with culture, and some projects you can do witht hem. Description: This website provides a thorough examination of African culture, from which area of Africa practices which religion, the two main cultures, Islamic Culture, and Christian Culture. It gives information about the 7 main parts of Africa too. Description: The infamous nature museum, with special exhibits from Brains, to the great theorem from Charles Darwin. There are kids exhibits, and the famous dinosaur fossils and moon exhibit greets you every time you visit. There is a kids area, but you don;t need to live in NYC to hear about the AMNH! Description: This website weaves in the infamous American Museum of Natural History. It gives information of the latest exhibits (which ranges from art to science). There are kids exhibits, with fun learning tools, a gadget to purchase tickets and more! This museum is a landmark in NYC, if not the whole of New York! Description: Food integrates with culture beautifully- and dietary issues raises more awareness. For example, in Jewish culture, Kosher is integrated- you can't drink milk and eat meat at the same time- and in Hindu culture, you cannot eat the cow, which is sacred to the gods.'''
