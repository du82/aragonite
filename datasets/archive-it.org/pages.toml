full_description = "Starting in March 2020, the Robert Crown Law Library was closed due to the outbreak of COVID-19. As result, library staff switch focus from in-person services on how to provide services and resources to be put online. This collections of urls are microsites developed by Reference and Access Services Librarians to meet the need of our users. Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: This consist of the cookbook collection that is located on the second floor of Robert Crown Law Library. Students can check these cookbooks out by clicking on and requesting a pickup. Description: Student who apply to Stanford Law School, were asked what book that they would like to add to the library. Robert Crown Law Library has added many of the chosen books to our collection. This site features a select number of those publications from the incoming class of 2023. Description: In response to injustice to Breonna Taylor and Eric George Floyd. Lists of anti-racist books have proliferated. The Robert Crown Law Library has digital access to many of the books that were feature on these lists. The Robert Crown Law Library has centralize these books for our users. Description: The Robert Crown Law Library and the Stanford Federalist Society work in collaboration on creating this site. The site has a listed of books from our collection about the conservative legal tradition. Description: The Robert Crown Law Library and the Stanford Latinx Law Students Association work in collaboration on creating this site. The site has a curated list of books in RCLL collection written by Latinx authors. The books listed on this site are only a sampling of the Stanford Libraries' collection. Description: The Robert Crown Law Library and the Black Law Students Association work in collaboration on creating this site. The site listed a sampling o