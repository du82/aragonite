\t      Social Justice Movements in Virginia"""
full_description = 'This collection seeks to document the community based social movements across the entirety of Virginia. Virginians organize themselves in a variety of ways, but this collection focuses on community organizations specifically. Community organizing is understood to exclude political campaigns and labor union struggles and instead encompasses neighbors fighting for their community and groups of people mobilizing around their common identities. Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: "A leading nonprofit advocate for a just economy and healthy environment in the Appalachian region and a driving force in America’s shift from fossil fuels to clean, renewable energy." Description: "The Chesapeake Climate Action Network (CCAN) is the first grassroots, nonprofit organization dedicated exclusively to fighting global warming in Maryland, Virginia, and Washington, D.C. Our mission is to build a diverse movement powerful enough to put our region on the path to climate stability, while using our proximity to the nation’s capital to inspire action in neighboring states, regions nationwide, and countries around the world. " Description: "The vision of the Deaf Grassroots Movement (DGM) is for Deaf people to: have equal access and quality of care and services in all major facets of living; to have a nationally recognized and respected natural language of the Deaf for our primary communication access; to live in our American society without being judged, belittled or minimized; to have equal quality of education for all Deaf children and students as our nondeaf counterparts; to work towards and eventually achieve economic viability within our broader society; and, to honor and cherish diversity among the Deaf community with respect to life, liberty, and the pursuit of equality." Description: "Friends of Nelson’s mission is to protect property rights, property values, rural heritage and the environment for all the citizens of Nelson County, Virginia."'
