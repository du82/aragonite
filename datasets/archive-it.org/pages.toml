["https://archive-it.org/organizations/89"]
title = """
Archive-It - 
  
\t      Internet Archive Global Events"""
full_description = "These collections of global events have been created by the Archive-It team in conjunction with curators and subject matter experts from institutions around the world. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. On July 24, 2019, Governor of Puerto Rico’s Ricardo Roselló announced he was resigning from office effective August 2nd. It was the culmination of two weeks of mass protests in Puerto Rico calling for his resignation amid corruption scandals and the leak of a chat between Roselló and his inner circle that included homophobic and sexist language, where the casualties of Hurricane María were mocked, and where possible illegal activities were commited. This is a collection of web resources documenting the events that led to the governor’s resignation, and the protests that were characterized by the social media hashtag #RickyRenuncia. It covers the period between July 11 to August 2nd, and includes news reports, opinion articles, and social media content. El 24 de julio de 2019, el gobernador de Puerto Rico Ricardo Roselló anunció que renunciaba a su puesto efectivo el 2 de agosto. Este anuncio se da luego dos semanas de protestas masivas en Puerto Rico exigiendo su renuncia debido a escándalos de corrupción y la filtración de un chat entre Roselló y sus ayudantes cercanos que incluye comentarios homofóbicos y sexistas, donde se toma ligeramente las muertes causadas por el huracán María, y donde se cometen posibles violaciones a leyes de administración pública. En esta colección se documentan los eventos que llevaron a la renuncia de Ricardo Roselló y las protestas caracterizadas en redes sociales por el hashtag #RickyRenuncia. Cubre el período del 11 de julio al 2 de agosto de 2019, e incluye noticias, artículos de opinión y contenidos de las redes sociales. In August of 2014, the Archive-It team put out a call for URLs related to the August 9th shooting of Michael Brown in Ferguson, MO. Soon after we were joined by Archive-It partner Washington University in St. Louis, MO who contributed lists of URLs and solicited URLs from communities in and around Ferguson. Maryland Institute for Technology in the Humanities contributed a significant number of URLs extracted from tweets about Michael Brown and Ferguson. In December we expanded the collection to include content related to the July 17th chokehold death of Eric Garner in Staten Island, NY, and the reactions around the country to the acquittal of the police officers in both cases. The collection then progressed further to reflect the movement building in reaction to police violence against people of color. Today the #blacklivesmatter Web Archive contains news articles, blogs, social media, and other websites related to Ferguson, Michael Brown, Eric Garner, protests and demonstrations around the country, and seeks to document the movement as it grows and evolves. Note: Many of these sites contain videos, some of which may not play back in the page. To view archived videos click on the Videos link in the yellow banner at the top of the archived web page."
year_published = 2025
clearnet = "https://archive-it.org/organizations/89"
