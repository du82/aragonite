full_description = "New York City is the center of the U.S. pandemic and Queens has seen the highest numbers of diagnosed cases and hospitalizations: 33,468 and 9,729 respectively, as of April 13. The borough is experiencing high concentrations of COVID-19 cases, with Elmhurst Hospital and its surrounding neighborhoods at the epicenter of the crisis. As the New York Times reported on April 9, the communities of Corona, Elmhurst, East Elmhurst and Jackson Heights have a combined population of 600,000 but had recorded more than 7,000 coronavirus cases. This web archive collection captures news and other coverage from a variety of sources on the disproportionate impact the pandemic has had on Queens and the ways in which Queens residents are adapting during this moment in history. Captures for this collection are one-time captures. Collecting began in April 2020 and is ongoing. Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages."
