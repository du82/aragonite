title = """
Archive-It - 
  
\t      Vermont Freedom to Marry Web Archive"""
full_description = "This collection explores the Web presence of Vermont Freedom to Marry (VFM), a non-profit volunteer organization that successfully led efforts to secure same-sex couples' the freedom to marry in Vermont. Founded in 1995 by Middlebury lawyers Susan Murray and Beth Robinson, the organization fostered grass roots support for legal equality of same-gender relationships through educational outreach. Vermont Freedom to Marry continued to promote marriage equality nationally and internationally until 2015 when the organization ceased operation and generously donated their records to Middlebury College Special Collections and Archives, including both print and Web-based resources spanning twenty years. Subject: Blogs & Social Media, Politics & Elections, Society & Culture, LGBTQ advocacy, Marriage equality, Vermont politics Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: Main website for Vermont Freedom to Marry, providing news and resources from 2009 through 2015. Description: Archive site for the Vermont Freedom to Marry Task Force, which was later renamed Vermont Freedom to Marry. Contains information, news, and other resources from 2008-2011."
