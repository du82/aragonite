full_description = "Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. This collection includes websites of historic preservation organizations in the United States, many of whose archival records are stewarded by Special Collections and University Archives (SCUA) at the University of Maryland. SCUA is also the home of the National Trust for Historic Preservation Library Collection. This collection represents websites of labor organizations in the United States, including organizations whose records arestewarded by Special Collections and University Archives at the University of Maryland. Our labor collections are comprised of AFL-CIO Department records, trade department records, international union records, union programs, union organizations with allied or affiliate relationships with the AFL-CIO, and personal papers of union leaders. We also have extensive photo documentation of labor union activities from the 1940s to the present in the photographic negative and digital collections. Additionally, collections of graphic images, over 10,000 audio tapes, several hundred films and videotapes, and over 2,000 artifacts are available for research and study. The University of Maryland emphasizes the collecting of archival resources and other collections that document the history of the labor movement in North America and the Washington, DC/Maryland region. These materials help researchers better understand pivotal social movements in this country, including those to gain rights for women, children and minorities. This collection contains websites, web-based publications, and documents created by the State of Maryland, particularly those related to state planning. Special Collections and University Archives at the University of Maryland collect a variety of items to support the study of the state of Maryland, and acts as a depository library for the State Publication Depository and Distribution Program (SPDDP)."
