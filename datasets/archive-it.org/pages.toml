full_description = "The University of Iowa Libraries is the largest library system in Iowa and 14th in materials expenditures among U.S. public research libraries. The University’s Main Library, Hardin Library for the Health Sciences, 5 branch libraries, and the Law Library contain more than 5 million volumes. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. University of Iowa Web pages created in the aftermath of the historic June, 2008 flood, including photographs, information about flood recovery services, financial aid, changes in class and activity schedules, and other related information. The following sites complement the scope of the Iowa Women's Archives at the University of Iowa Libraries. Inspired by the vision of its founders, the Louise Noun – Mary Louise Smith Iowa Women’s Archives nourishes creative research, learning, and teaching by providing collections and a separate space dedicated to the women of Iowa and their history. The Archives fulfills its mission by collecting and making available primary sources about the history of Iowa women from all walks of life. It undertakes a robust outreach program to gather and preserve the history of groups underrepresented in archives. Through its programs and online resources, the Iowa Women’s Archives serves a broad audience ranging from students and scholars to the general public. IWA special projects highlighting women's history in Iowa include the Mujeres Latinas, Jewish Women in Iowa, and Women's Suffrage projects. Subject: Universities & Libraries, Society & Culture, Politics & Elections, women's history, Iowa history, civic engagement Selected Web sites of the University of Iowa, based on enduring historical, administrative or legal value."
