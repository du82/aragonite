title = """
Archive-It - 
  
\t      Digital Liberal Arts at Middlebury Web Archive"""
full_description = '''Representing a wide range of efforts by staff, students, and faculty to foster digital liberal arts scholarship and pedagogy. The DLA at Middlebury Web Archive has been established by Middlebury College Special Collections and Archives in order to preserve digital projects. The collection includes projects funded by grants from the DLA initiative of the Center for Teaching, Learning, & Research (CTLR) as well as artifacts from broader digital scholarship work within the Middlebury Community. Subject: Universities & Libraries, Arts & Humanities, Computers & Technology, Student research, Faculty research, Digital humanities, Digital liberal arts Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: From the website: "Fifty Years of Green is a timeline-based digital exhibit documenting the environmental studies curriculum at Middlebury College. The students of HIST 222 created this exhibit in Spring 2015 as part of the commemoration of the 1965 creation of the ES Major at Middlebury. Nine teams of historians created timeline-based exhibits covering the period roughly from 1961 to 2010. Although each team took its own approach, all sought to document Middlebury's changing curriculum, environmental debates and activities on the college's campus, and some broader events in national and global environmental history." Creator: Hope Kuchinski, Liddy Renner, Gigi Miller, Eileen Daley, Aidan McClaughlin, Ethan Sivulich, Ali Cook, Sarah Dohan, Adrian Leong, Robert Engel, Esteban Arenas, Katie Hill, Ben Harris, Victoria Buschman, Kathryn Morse, Maddy Berkman, Emily Nuss, Danny Nigh, Joseph Mutter, Laura Bashor, Parker Peltzer, Parker Peltzer, Ash Babcock, Austin Stevens, Katherine Hobbs, Alexis Hughes, Lilia Namsing, Natalie Cheung, Kate Leib, Simon Willig Description: This site hosts video clips complementing Complex TV: Th