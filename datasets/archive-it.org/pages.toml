\t      Virginia Tech: Crisis, Tragedy, and Recovery Network"""
full_description = "Virginia Tech, with funding from the US National Science Foundation through grant IIS-0916733, is leading an international consortia to build a human and computing network to collect, archive, organize, and provide ready access for scholars, professionals, and the public interested in supporting ongoing recovery of communities that have faced a crisis or tragedy. In scope are school shootings and all other types of man-made or natural disasters. We welcome involvement of those with relevant content or who are interested in developing collections, as well as those seeking or promoting deeper understanding of CTR. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. The April 16 Web Archive captures a wide variety of content related to the April 16, 2007 tragedy at Virginia Tech. It includes memorial and tribute sites, commercial and non-commercial media, and other relevant web-based materials. This collection was specifically developed as a complement to the April 16 Archive (www.april16archive.org), which is dedicated to collecting and preserving individual stories, images, and files related to the events of April 16. Subject: Spontaneous Events, Government - Cities, bombing, marathon, Boston, Boston marathon, bombs, Tamerlan Tsarnae The URLs in this collection were harvested from Twitter feeds, Google news, and Reddit pages and threads using Virginia Tech's newly developed URL harvesting tool As a part of the CTRnet project we are adding here the information which can be used in case of an emergency and the services which are provided by several agencies in emergency situations The 2010 Chile earthquake occurred off the coast of the Biobio Region of Chile on Saturday, 27 February 2010, at 03:34 local time (06:34 UTC), having a magnitude of 8.8 on the moment magnitude scale, with intense shaking lasting for about three minutes. It ranks as the sixth largest earthquake ever to be recorded by a seismograph"
