full_description = "Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: Women in New York Fashion: A Research Agenda is a three-year research project initiated in 2013 at Parsons School of Design, with funding from the Geraldine Stutz Trust. At its core it investigates and acknowledges the work of Geraldine Stutz (1924 – 2005), who served as President of Henri Bendel, a major fashion specialty store in New York City, for 29 years. This project places her work and accomplishments alongside those of other under-recognized women who were key to the development, business, and creative impact of New York fashion retailing in the twentieth century. Description: Guatemala Después is a curatorial research project developed between The New School (School of Media Studies & Sheila C. Johnson Design Center) and Ciudad de la Imaginación, a contemporary arts organization based in Quetzaltenango, Guatemala. From an interdisciplinary and transnational perspective, the project explores the ways in which political and social realities in contemporary Guatemala have affected its artistic and cultural production in the aftermath of the “inner armed conflict” (1970-1996). Description: This is the archive and supplemental content site for select exhibitions at the Sheila C. Johnson Design Center (SJDC) Galleries at Parsons School of Design/The New School."
