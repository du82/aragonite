["https://archive-it.org/collections/8655"]
title = """
Archive-It - 
  
\t      Interactive Fiction in Queer Digital Culture"""
full_description = 'New digital platforms and tools for creative expression have transformed the landscape in experimental fiction and led to the emergence of a queer interactive fiction scene that pushes against mainstream commercial literary and gaming culture. LGBTQ writers are using tools that democratize development (because they require few programming skills) to create interactive fictions that take up questions of race, class, LGBTQ identity, mental and physical health, and a host of other issues. Because these works of interactive fiction are independently produced and often made freely available online, there are few mechanisms for preservation, and significant examples can disappear from defunct personal websites. We are collecting websites by individual authors/creators, examples of interactive fiction, and other publicly contextual available information about this form of queer digital culture. Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: A curated/researched collection of information of LGBTQ content in digital games from 1980s-present. Description: Professional portfolio and blog for Bonnie ("Bo") Ruberg, a scholar of digital media and gaming. Description: Queerly Represent Me is "a research organisation and consultancy agency who connects with creators, event organisers, and workplaces to improve their representation and company culture." They specialize in queer representation in the games industry. Description: Professional portfolio for Dietrich Squinkifer, writer, programmer, musician, and visual artist'
