["https://archive-it.org/organizations/1243"]
title = """
Archive-It - 
  
\t      American Academy of Pediatrics"""
full_description = "The American Academy of Pediatrics (AAP) is an organization of 67,000 pediatricians committed to the optimal physical, mental, and social health and well-being for all infants, children, adolescents, and young adults.​ This web archive preserves selected content produced by the AAP. This collection augments the collection holdings at the Gartner Pediatric History Center. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. The AAP Equity Agenda was built on the recommendations of the Task Forces on Diversity and Inclusion and Addressing Bias and Discrimination convened from 2015-2017 and 2017-2019, respectively. The AAP Board of Directors approved the AAP Equity Agenda and first workplan in fall 2020 to guide the Academy’s efforts to achieve health equity and actualize our goals to become an equitable, diverse, and inclusive organization. The Equity Agenda workplan sets forth explicit and intentional action to support the Academy’s commitment to equity, diversity, and inclusion (EDI) and health equity and ensures this action permeates all aspects of the Academy’s functioning. The National Resource Center for Patient/Family-Centered Medical Home (NRC-PFCMH) is a cooperative agreement between the Maternal and Child Health Bureau and the AAP. It is a national technical assistance center that aims to enhance the patient/family-centered medical home. The webpages collected here focus on state level initiatives. Advocacy on behalf of the health of all children is in the organizational DNA of the American Academy of Pediatrics. It was an original goal of the founding members of the AAP to build an organization dedicated to advocating for children. Since the development of pediatrics as a specialty field, pediatricians have played a powerful role in creating lasting and meaningful change for the patients they serve. We’ve compiled a timeline of some of the most significant moments in our long history of advocacy and our look toward the future of children’s health."
