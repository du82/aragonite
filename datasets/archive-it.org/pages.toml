["https://archive-it.org/collections/6152"]
title = """
Archive-It - 
  
\t      Smith College Websites"""
full_description = "The Smith College Archives documents the history of Smith College from the 1860s to the present by collecting materials created by students, faculty, administrative and departmental staff during the course of their time here. The Archives houses the official records of the College, including its publications. In addition, the College Archives collects materials from alumnae relating to their undergraduate years at the College. This web archive collection includes the College’s official websites and Smith alumnae and student groups. Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: Exhibits created by Smith College Libraries' Special Collections using the Omeka platform Description: A network of students, faculty and staff, and community members who support Smith divesting from the fossil fuel industry. Description: Charlie Diaz (he/him, Smith College ‘22) created this website to collectively design a new future for Smith College and to bear witness to the injustices experienced by BIPOC and other marginalized groups. Description: A journal by Smith Students in and for the World, supported by the Smith College Lewis Global Studies Center Description: The Library Sign Lab provides avenues for whimsical wayfinding within in the current structure of Neilson Library. The project consists of creating signs using a vinyl cutter and installing them throughout the library that lead students to useful and sometimes-hidden library spaces and resources, surprising and delighting them in the process. Description: This course offers an interdisciplinary, historical, critical examination of race in the United States. Although race is no longer held by scientists to have any biological reality, it has obviously played a central role in the formation of legal codes (from segregation to affirmative action), definitions of citizenship, economics (from slavery to discriminatory loan arrangements), culture (music, dance, literature, fashion), and identities. Where did the concept of race come from? How has it changed over time and across space? What pressures does it continue to exert on our lives? How does it intersect with other registers of identity like class, gender, sexuality, and disability? By bringing together faculty from a variety of programs and disciplines, and by looking at a range of cultural texts, visual images, and historical events where racial distinctions and identities have been deployed, constructed and contested, we hope to give students an understanding of how and why race matters."
year_published = 2025
