full_description = "Everglades Explorer is a library, archive and research service with customized search engines. Everglades Explorer's mission is to provide easier location of quality and specific information, and improve quick access to data, publications and maps buried or scattered across the shallow and deep web. The portal also provides records, links and archives connecting directly to video, sound recordings, pamphlets, books, photos, art, curriculum material, government reports, theses and dissertations, scientific data sets, and more. 1) An open source discovery system (eXtensible Catalog) collecting and housing thick metadata in MARCXML and Dublin Core linking directly to diverse academic digital resources; 2) The Internet Archive, collecting and linking searchers to Everglades related documents, reports and other resources in .pdf and media formats, mostly harvested from government and non-government organizations(NGO). 3) A targeted Google API searching across thin Everglades metadata and real-time Content Management System (CMS) websites of partners, and other select organizations and government agencies. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. An archive of reports and PDF formatted material representing the Greater Everglades watershed and adjacent ecosystems, including areas north of Lake Okeechobee (The North Everglades) and south of the peninsula, including Florida Bay, the Florida Keys, and the various adjacent national parks Subject: Science & Health, Government - US States, Government - US Federal, Watersheds -- Florida, Wetlands, Science & Health, Society & Culture, Government, Everglades National Park, Fla., Restoration Ecology -- Florida -- Everglades, Swamp Ecology -- Florida, Environmental Education, Biosphere -- Ecology -- Watersheds, Florida -- Wetlands Contributor: Nation