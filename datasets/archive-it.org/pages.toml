title = """
Archive-It - 
  
\t      Northwestern University Libraries"""
full_description = "Northwestern University is a private institution founded in 1851. The school has campuses in Evanston, IL, Chicago, IL, and Doha, Qatar. Northwestern's approximately 190,000 alumni include leaders in government, law, science, education, medicine, and performing arts. The Northwestern University Libraries use Archive-It to document online academic, administrative, research, athletic, public service, and social activities and reflect the evolving nature of the university's web presence. Metadata is the language used in Northwestern University Libraries’ (NUL) catalog, online tools, archives, and digital collections to describe and manage resources and enable their discovery and ongoing access by the scholarly community. NUL acknowledges the reality that our metadata and practices reflect a white supremacist and discriminatory culture. For additional information and to submit suggestions, questions, or comments, see: https://libguides.northwestern.edu/c.php?g=1152430 Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. The COVID-19 pandemic, also known as the coronavirus pandemic, was caused by a viral strain of the severe acute respiratory syndrome coronavirus 2 (SARS-CoV-2) which was first identified as an outbreak in Wuhan, China in December 2019. The United States’ first documented case of the virus was in January 2020 and the World Health Organization categorized the outbreak as a pandemic on March 11, 2020. In an effort to minimize transmission of the virus, Northwestern University responded by transitioning to remote education and services early in the pandemic and participating in research related to the virus and treatments. This collection of web archives documents the COVID-19 pandemic through the lens of Northwestern University. The Chicago Music Scene web archive hopes to capture the “scene” in the Chicago musical community by documenting the web presence of specific ensembles, venues, festivals and publications. Before the utility of the Internet, musical activity was publicized in print publication, on broadsides, in pamphlets and in other ephemeral material. An understanding of the support and activity within a musical culture (or scene) is demonstrated in archival collections that hold this kind of material. Today, a music scene is represented on the web. As a searchable database, this archive offers the ability to learn about the current music scene in Chicago as it develops."
