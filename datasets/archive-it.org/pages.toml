["https://archive-it.org/team"]
title = "Archive-It Blog – Team"
description = "Meet the team Archive-It is run by the Archiving & Data Services group at Internet Archive. To see all our services, visit our Products & Services webpage. Archiving & Data <i>...</i>"
full_description = "Meet the team Archive-It is run by the Archiving & Data Services group at Internet Archive. To see all our services, visit our Products & Services webpage. Archiving & Data Services Staff Fran Alba, Partner Services Lead Jefferson Bailey, Director Karl Blumenthal, Senior Web Archivist Tegan Broderick, Software Engineer Bridget Collings, Web Archivist Martin Cyzgan, Open Data Engineer Alex Dempsey, Senior Engineering Manager Derek Enos, Senior Software Engineer Helge Holzmann, Senior Data Engineer Jeff Klein, Senior Software Engineer Monique Lassere, Program Officer Adam Miller, Senior Crawl Engineer Barbara Miller, Software Engineer Gretchen Leigh Miller, Software Engineer Neil Minton, Software Engineer Thomas Padilla, Deputy Director Sylvie Rollason-Cass, Senior Web Archivist Kay Savetz, Program Manager Sarah Beth Seymore, Program Officer Nate Smith, Senior Software Engineer Tanya Ulmer, Web ArchivistLinda Wagner, Product Support Specialist Kyrie Whitsett, Program Officer Kody Willis, Product Operations Manager Mike Wilson, Senior Software Engineer Alumni Gemma W. Batson Program Manager Gemma joined the Archive in 2008, as a scanner at the Natural History Museum in London. She then moved on to become the Satellite Coordinator, where she worked with many of the fascinating libraries and collections we’re working with around the world. She worked to make the Internet Archive accessible to new institutions and archives globally. Gemma was born in the UK, but grew up the fine state of Texas, where she graduated from the University of Texas. She returned to the UK in 2008, and spent her time there digitizing, meeting amazing people, and perfecting the perfect muffin recipe. Daniel Bernstein Application Developer While creating tools to help librarians and archivists archive and analyze vast swaths of the Internet, Daniel cultivates the habit of asking himself the following question: What things, among all that can be saved, are truly worth saving? Daniel graduated from Columbia University with BA in History. Mirage Berry Business Development Manager Mirage joined the archive in 2021 to drive new partner outreach for Internet Archive’s Web Archiving and Data Services division, providing a suite of paid and free products focused on the archiving, management, analysis, and accessibility of digital information, with the ultimate goal of furthering universal access to all knowledge. Mirage is passionate about supporting the national and international community and a range of different institutions and stakeholders advancing scholarship, learning, cultural heritage, open information, and the social good. She previously worked at Backstage Library Works and has a dual BA in Global, International, and Area Studies (GIAS) & Political Science from UNC Charlotte. In her free time you can find her making a mess in the kitchen, gardening, or on the weekends, keeping up with her dog while hiking the Appalachian trails. Aaron Binns Senior Software Engineer Aaron worked with the Internet Archive to bring full-text search to the archives, as well as an elevated sense of sartorial excellence to the archivists. Previously, he had worked at various technology start-ups in San Francisco and outside of Washington D.C. Aaron graduated from Case Western Reserve University with a B.S in Computer Science. Madeline Carruthers Program Officer in Community Programs Madeline Carruthers joined the team in 2019 to manage service agreements, onboarding, and introductions to the Archive-It community of partners. She brought experience from Chronicle Books with her and is now glad to reconnecting with libraries and research institutions, having worked previously in circulation and development at the UC Santa Cruz Libraries. Madeline earned her BA in the History of Art and Visual Culture from UCSC. She grew up in the Bay Area and it’s unlikely that she will ever leave. In her free time, you can find her exploring and camping along the California coast with her sweet but stubborn basset hound named Bonnie. Dominic Dela Cruz Web Crawl Engineer Dominic studied Political Science at the University of California at Riverside because he wanted to figure out why democracies succeed. He still can’t tell you why, but he can tell you that restricting access to information is the first step in their failure. Dominic joined the Internet Archive in April 2008. Before that, he worked for the independent online news magazine Salon.com as a software engineer. The Archive lets him play with his favorite technologies like Gnu/Linux and internet-based applications. He is also a mammal who enjoys running, biking, and reading about the history of science/technology. Lori Donovan Community Programs Manager Lori managed community-focused service provision, training and cohort development for programs that enable collaborative digital preservation work amongst public libraries, museums, and other cultural heritage organizations who have a focus on local or regional history. Lori has a Masters of Science in Information from the University of Michigan, specializing in Archives and Digital Preservation. In her spare time, Lori enjoys cooking, running after her 2 kids, and reading fantasy, science fiction, or otherwise dreaming about different worlds. Catherine Falls Program Officer in Community Services Catherine Falls joined the team in 2021 as Programs Officer in Community Services. The community focus is what attracted her to this role, and she’s engaged by the idea of local communities being able to self-document the way they see themselves through the program. Prior to Community Webs, she worked as an Archivist for the Archives of Ontario and York University. Before that, she had earned two Master’s degrees from the University of Toronto in Art History and Library and Information Studies/History of the Book. She recently relocated from Toronto to Los Angeles, where she enjoys hiking and spending as much time as possible by the ocean. She also finds Zen in learning to weave on a loom that her mother shipped her from Canada during the pandemic. And once it subsides, she looks forward to exploring the Arts scene in the Los Angeles area. Raven Germain Web Archivist Raven Germain joined the Archive-It team in 2020 as Web Archivist and is excited to help partners build and grow their web archive collections. She holds a Master of Library and Information Studies from the University of Alberta and first began with the Internet Archive in 2019. With a Bachelor’s in English and History, Raven is drawn to working with primary documents and is particularly interested in the challenges of archiving traditionally ephemeral materials. In her spare time, she can be found playing the piano, reading fantasy, watching horror movies, and exploring the beautiful Maritimes from her home in New Brunswick. Vinay Goel Senior Data Engineer Vinay joined the Internet Archive’s Web Group in 2006. At the Archive, he ran focused crawls, deployed web archive access and index infrastructures, and developed automated tools to help improve the quality of web crawls, and to extract and analyze large portions of the Web Archive. He also administered the Web Group’s Hadoop clusters and applied big data solutions to gain insights from web scale datasets. He graduated from Lehigh University with a M.S. in Computer Science. While at Lehigh, he researched techniques to combat web spam, and mobility management schemes in Disruption Tolerant Networking. Outside the office, he enjoys exploring the outdoors and has a thorough love of food, movies and books. Mary Haberle Web Archivist Mary joined the program staff of the Archive-It team in October 2016. Her prior work experience included processing archival collections at the Academy of Motion Picture Arts and Sciences and the University Club of New York, as well as contributing to digitization projects at the American Jewish Joint Distribution Committee and Franklin Furnace Archive. Mary earned her Master of Library and Information Studies degree from McGill University in Montreal, Canada. She relocated to Los Angeles from Brooklyn, where she loves hiking with her labradoodle Winnie and never having to check the weather. Kristine Hanna Director of Digital Services and Programs Kristine focused on developing collaborative and long lasting relationships with partner organizations, and worked in the U.S. and around the world to fund and implement digital preservation projects and programs; including Archive-It, which she worked on since it’s inception in early 2006. Previously Kristine worked as a Visual Effects Producer at Lucasfilm, where she received multiple Emmy nominations, and later as the Co-founder of GirlGeeks Inc., a website for women in technology. Kristine lives in Marin county with her family and dogs, loves running on Mt Tam and skiing when she can get away. Kelsey Hawley Web Application Developer Kelsey graduated University of California, Santa Cruz with a bachelors in Computer Science. She enjoys working with new technologies to build web applications, recognizing that web is the way of the future. She often brought her dog, Patches, to work with her, who frequently reminds Kelsey to get up and stretch multiple times during the day. Patches also watched her owner and other engineers, wondering why humans sit still so long. On her free time, Kelsey takes Patches for long walks and enjoys knitting multiple types of projects including socks, gloves, hats, and blankets. James Kafader Engineering Manager, Webgroup and Archive-It James joined the Archive-It team at the Internet Archive in 2014 to develop its 5.0 web application and backend database. Previously, he had led web development and managed programming efforts for publishers, artists, and non-profit institutions. James earned his BFA in Conceptual Art from the Maryland Institute College of Art and serves on the advisory board for the open source TRSST secure and distributed blog platform. Michelle Kimpton Director of Web Archive Michele Kimpton was a Director at the Internet Archive for four years. In her role, she works closely with national libraries, archives and universities to provide technical expertise and services in web archiving. She has developed partnerships with several of these institutions to collaborate on web archiving activities, including co-founding the International Internet Preservation Consortium. Prior to the Internet Archive, Michele worked in the high-tech-industry, mainly for-profit sector, for the last 20 years. Before coming to the Internet Archive she was one of the co-founders of an online digital imaging company, which was subsequently bought by one of the larger photo imaging companies. For the last ten years of her career she has worked primarily in technical management and business development. She has worked and lived in both Europe and Asia during her career.Michele has a Masters in mechanical engineering from Lehigh University, and a Masters of Business Administration from University of Santa Clara. Ilya Kreymer Web Application and Wayback Developer Ilya worked on the presentation aspects of Archive-It, including the Wayback Machine, from 2011 to 2014. Previously, he worked in a wide variety of fields, including extensive work in video games at Big Huge Games and LucasArts, and also worked with creating writing projects exploring new mediums. Ilya is a big fan of all types of eastern European music and plays Accordion around San Francisco. Carissa Kuo Partner Support Associate Carissa supported the Archive-It team in the finance department. She grew fond of the idea of preservation during her time spent living in Rome. She received a Bachelors of Arts in Sociology from University of California Santa Cruz and has since explored her passion of the finance and accounting sector. Whenever there is time to spare, she fills it with either her love of music or spending time in the kitchen making baked goods for anyone and everyone. Peggy Lee Program Manager Peggy Lee brings a background working on social change to the Archive-It team. Peggy has worked on education projects as wide-ranging as Made by Girls, Digital Media Academy, and Waylink. She has also worked in academia, at Johns Hopkins University (where she earned her master’s Degree in Public Health), researching game and mobile-based innovations for social change, and coordinating projects for audiences in Africa and Asia; and at the University of California, San Francisco, developing and facilitating a national sensitivity training program for community organization providers on the topics of HIV, Substance Abuse, and Asian/Pacific Islander populations. When she’s not advocating for social change, Peggy can be found brewing (award winning) beer, listening to Bruce Springsteen, writing poetry or crushing pop culture trivia nights. Noah Levitt Lead Engineer Noah worked at the Internet Archive from 2007 to 2020. He did development and operations mostly around the Archive-It service and the Heritrix crawler. Previously he worked at Columbia University on digital library projects. Before that, in 2001, he got his BS in computer engineering from the University of Michigan. Noah is an advocate of all things free and open, including software, information, and society in general. Jillian Lohndorf Web Archivist Jillian joined Archive-It in 2016. Previously, she worked in the Archives and Special Collections at DePaul University and Rotary International, and as Web Services Librarian for The Chicago School of Professional Psychology. She holds a Master of Science in Library and Information Science from the University of Illinois at Urbana-Champaign. As much as she loves the internet, on most weekends you can find her in a tent in the woods, with no wifi to be found. Pete Mitchell Technical Support Specialist Pete helped Archive-It partners to collect an ever-changing and challenging web. He is a certified member of the Oregon Trail Generation — the kids that still had rotary phones, taped live radio onto cassette, and came of age as the Internet was doing the same. He has been using the Wayback Machine as long as he can remember. Pete enjoys wasting time on the Internet (frequently via Reddit), as well as video and board games, Dungeons & Dragons, sci-fi and fantasy in all forms of media. He is a passionate supporter of the Seattle Sounders and a tortured fan of the San Jose Sharks. He also loves pinball and skeeball, mini golf, camping, and spontaneous road trips. Courtney Mumma Web Archiving Programs Manager Courtney joined the Internet Archive in September of 2015 as Program Manager, with a focus on collaborative partnerships, grants management, community development, research initiatives, new services and sustainable innovation in web archives. Her career has been dedicated to building and fortifying the digital cultural heritage preservation sector. Courtney helped to build the Archivematica open source digital preserv"
year_published = 2025
