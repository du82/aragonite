["https://archive-it.org/organizations/1011"]
title = """
Archive-It - 
  
\t      University of Michigan Library"""
full_description = "Organization URL: https://www.lib.umich.edu/collections/collecting-areas/special-collections-and-archives/web-archives The University of Michigan Library's mission is to support, enhance, and collaborate in the instructional, research, and service activities of the faculty, students, and staff, and contribute to the common good by collecting, organizing, preserving, communicating, and sharing the record of human knowledge. The materials in the University of Michigan Library Web Archives reflect our mission as we seek to preserve online resources in specific topical areas. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. The Belarusian Art web collection archives online resources associated with contemporary (post-1991) protest art of Belarus. The collection aims to preserve the context around this art for future researchers through the archiving of gallery websites and bibliographies. Both the Hatcher Graduate Library and the Special Collections Library have significant children’s literature collections. In recent years, there has been a growing awareness of the importance of diversity in children’s literature among authors, publishers, librarians, and readers. Therefore, a web archive focused on Diversity in Children’s Literature will complement current collection strengths across the Library and will serve future researchers by documenting an important movement in the field of children’s literature. The centrality of social media to the movement, and as a site for ongoing conversations, makes web-archiving a particularly appropriate mechanism for documenting the diversity in children’s literature “discussion.” We hope that, as much as possible, the scope of the archive focuses on the authentic voices of content creators. Formats collected will include social media accounts, blogs, organizational websites, selected publishers’ websites, selected awards websites and other digital content."
