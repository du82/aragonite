["https://archive-it.org/organizations/159"]
title = """
Archive-It - 
  
\t      Stanford University, Social Sciences Resource Group"""
full_description = "Stanford Library's Social Sciences Resource Group supports research, instruction and collection development within the social sciences, including subject areas like political science, economics, sociology, anthropology, psychology, communication, environmental and public policy. The SSRC also includes CA state, local, US Federal and International government information, data and statistics. SSRC's Archive-it collections will focus on San Francisco bay area governments, IGO/NGO working papers, and other areas of interest to Stanford social scientists. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. This collection provides access to the archived Web sites and publications of the special districts, local and regional governments geographically centered around the San Francisco bay area. Specific emphasis is on the city, counties and special districts within San Mateo and Santa Clara. Selectively included are government agencies, especially those dealing with transportation, housing, urban planning, air, water and other natural resources from the cities and counties of San Francisco, Marin, Sonoma, Napa, Contra Costa, Solano, and Alameda are also included. If you have questions, suggestions or would like to tell us how you are using this collection, please contact us at govinfolib AT lists DOT stanford DOT edu. Subject: Government - Cities, Government - US States, Government - Counties, San Francisco Bay Area (Calif.)--Politics and Government, Local government--California--San Francisco Bay Area, San Francisco Bay Area (Calif.), Government information--California--San Francisco Bay Area CDE curriculum frameworks, instruction, and standards. We're extremely interested -- for purely academic reasons -- in how this collection is being used and would be grateful if users would share that information with us. Please email James Jacobs, Government Information Librarian, at jrjacobs AT stanford DOT edu. User privacy is extremely important so of course any stories and personal information will be kept strictly confidential."
