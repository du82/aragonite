["https://archive-it.org/collections/8632"]
title = """
Archive-It - 
  
\t      Diversity in Children's Literature"""
full_description = 'Both the Hatcher Graduate Library and the Special Collections Library have significant children’s literature collections. In recent years, there has been a growing awareness of the importance of diversity in children’s literature among authors, publishers, librarians, and readers. Therefore, a web archive focused on Diversity in Children’s Literature will complement current collection strengths across the Library and will serve future researchers by documenting an important movement in the field of children’s literature. The centrality of social media to the movement, and as a site for ongoing conversations, makes web-archiving a particularly appropriate mechanism for documenting the diversity in children’s literature “discussion.” We hope that, as much as possible, the scope of the archive focuses on the authentic voices of content creators. Formats collected will include social media accounts, blogs, organizational websites, selected publishers’ websites, selected awards websites and other digital content. Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: "In 1991, the Outreach Council of the African Studies Association accepted a proposal from Africa Access to establish awards honoring outstanding books on Africa published or republished in the United States. The first Children’s Africana Book Awards were presented in 1992. Annually since that time awards are presented to authors and illustrators in two categories, Young Children and Older Readers." Description: "In 1991, the Outreach Council of the African Studies Association accepted a proposal from Africa Access to establish awards honoring outstanding books on Africa published or republished in the United States. The first Children’s Africana Book Awards were presented in 1992. Annually since that time awards are presented to authors and illustrators in