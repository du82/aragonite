\t      University of Wyoming"""
full_description = "Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. The Abe Morris papers contain material relating to his career as one of the first African-American bull riders to be on the professional rodeo circuit. He was also a rodeo announcer, television commentator, and he was a writer for various rodeo-related magazines. Darrell Van Citters was an American director, animator, and author known for his significant contributions to animation. Born in Ann Arbor, MI in 1956, Van Citters trained at the California Institute of the Arts in the Disney-sponsored Character Animation program. He began his career with internships at Chuck Jones' studio and Filmation Studios, then joined Walt Disney Studio, where he worked on The Fox and the Hound and directed Fun with Mr. Future. He also contributed to the development of Who Framed Roger Rabbit and directed Soccermania. In 1987, Van Citters transitioned to Warner Bros. Animation, where he worked on Daffy Duck’s Quackbusters and directed Box Office Bunny, the first new Bugs Bunny short in 26 years. In 1992, he founded Renegade Animation, which produced numerous commercials and became a pioneer in internet animation, winning an Annie Award in 2001 for Elmo Aardvark: Outer Space Detective. The company also produced shows like The Mr. Men Show and Hi Hi Puffy AmiYumi. Later in his career, Van Citters directed episodes for The Tom and Jerry Show and Tom and Jerry in New York for HBO Max. Additionally, he authored a book on Mister Magoo’s Christmas Carol, providing a behind-the-scenes look at the first prime-time animated Christmas special. Rights: The researcher assumes full responsibility for observing all copyright, property, and libel laws as they apply. This collection contains the records of the Eatons’ Ranch and the Eaton family. Included are financial record books, guest books and information, as well as photographs, pamphlets, booklets, newsletters, newspaper clippings, and a website related to the Eatons’ Ranch. Also included are a guest book and pamphlets for Custer Trail Ranch and Eaton family information, including photographs and biographical material of Howard Eaton and his brothers. Information about the Howard Eaton Trail in Yellowstone National Park is also included in this collection."
