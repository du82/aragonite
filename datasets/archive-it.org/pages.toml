["https://archive-it.org/collections/9430"]
title = """
Archive-It - 
  
\t      Water Politics in Michigan"""
full_description = '''The state of Michigan has seen numerous crises and controversies surrounding the protection of its lakes and rivers as well as the responsibility to provide safe, clean water to residents. The Flint water crisis; the price increases and subsequent water shut-offs in Detroit; and the reaction of local communities to the Enbridge Mackinac pipeline have sparked debates about racism, environmental justice and water as a basic human right. This collection attempts to capture the dialogue about access to clean water taking place on websites and social media between government officials and community organizations. Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: Volunteer organization that directs disaster relief, designs public health education campaigns and mobilizes rapid response service teams to vulnerable communities in Flint. Description: Detroit Water Brigade is a "volunteer-led alliance of compassionate citizens of Detroit and their international allies working to bring emergency relief to families facing water shut offs while advocating for an income-based Water Affordability Plan in Detroit." Description: A press release from the Department of Environment, Great Lakes, and Energy (known as the Department of Environmental Quality when this press release was published) discussing the testing of Ann Arbor groundwater for 1,4-Dioxane. The press release includes potential health hazards from 1,4-Dioxane, phone numbers to contact for more information, and possible vectors of communication (such as migration from shallow groundwater to indoor air). Description: An emergency rule issued in 2016 by the Michigan Department of Environment, Great Lakes, and Energy (known as the Department of Environmental Quality when the rule was first released). The emergency rule addresses 1,4-dioxane contamination in Ann Arbor's groundwater, and includes two phone numbers to contact for more information.'''
year_published = 2025
clearnet = "https://archive-it.org/collections/9430"
