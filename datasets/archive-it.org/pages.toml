full_description = "The State Policies on Book Challenges in Schools and Libraries Collection examines the often “lost” or “hidden” documentation behind book challenges and bans in schools and libraries. The collection pulls policies from most of the states and has a special focus on collecting both policies and contextual sources from the state of Michigan. While collected materials may touch on other institutions such as commercial entities, universities and colleges, and cultural institutions such as museums, the majority of the materials concern public schools and libraries. Collected materials consist of proposed bills; past legislation referred to in challenges; school board meeting minutes; school or district-level policies; press releases; and other related documentation. Many of the materials archived here are publicly available but where necessary, we have collected materials that are essential to the narrative around book bannings and challenges, such as Ron DeSantis’ press releases or news articles concerning book challenges and bans in the state of Michigan. This collection is in conjunction with the Diversity in Children’s Literature collection. Subject: Government - US States, Government, Politics & Elections, Government, Policies, Libraries, Education Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Institution Affected: K-12 school library, K-12 school, Public library, Correctional Facility, School Vendor Policy Name: Florida Statutes: Title 46: Crimes, Chapter 847: Obscenity, Section 12: Harmful materials; sale or distribution to minors or using minors in production prohibited; penalty [OR] Florida Statute 46.847.012 Policy Name: Florida Statutes: Title 48: Early Learning-20 Education Code, Chapter 1006: Support for Learning, Section 40: Use of instructional materials allocation; instructional materials, library books, and 