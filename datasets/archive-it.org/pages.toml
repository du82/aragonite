\t      Everglades Explorer -- EAPRA (Assorted PDF & Report Archive)"""
full_description = "An archive of reports and PDF formatted material representing the Greater Everglades watershed and adjacent ecosystems, including areas north of Lake Okeechobee (The North Everglades) and south of the peninsula, including Florida Bay, the Florida Keys, and the various adjacent national parks Subject: Science & Health, Government - US States, Government - US Federal, Watersheds -- Florida, Wetlands, Science & Health, Society & Culture, Government, Everglades National Park, Fla., Restoration Ecology -- Florida -- Everglades, Swamp Ecology -- Florida, Environmental Education, Biosphere -- Ecology -- Watersheds, Florida -- Wetlands Contributor: National Park Service, South Florida Water Management District (SFWMD), South Florida Information Access (SOFIA) -- US Geological Survey, Florida Coastal Everglades LTER (Long-Term Ecological Research) Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: Brief summary of the history of negotiations and agreements between federal and state government and stakeholders of the everglades. Description: Magazine article about the role of academic scientists and students in Everglades restoration Subject: Population Growth -- Impact, Everglades Restoration, Southeast Environmental Research Center Description: Information on research, data, publications, etc. from the Florida Coastal Everglades (FCE) Long Term Ecological Research Program (LTER) Description: THE CHIEF PURPOSE OF ADULT MIGRANT EDUCATION, AS DISCUSSED IN THIS REPORT, IS TO ELIMINATE POVERTY BY PREPARING THE MIGRANT FOR PROFITABLE PARTICIPATION IN SOCIETY. THE FLORIDA STATE DEPARTMENT OF EDUCATION STATES THAT THE PURPOSE OF THE IMMOKALEE MIGRANT ADULT EDUCATION PROJECT IS TO PROVIDE ADULT BASIC EDUCATION AND PRE-VOCATIONAL EXPERIENCES FOR UNEMPLOYED MIGRANTS AND SEASONAL WORKERS. TO GAIN THIS END, 8 SPECIFIC PROJECT OBJECTIVES AND 10 CURRICULUM OBJECTIVES ARE DEFINED. CRITERIA FOR SELECTION OF STUDENTS, STIPEND INFORMATION, DAILY SCHEDULES, TEACHING OBJECTIVES IN THE SUBJECT AREAS OF LANGUAGE ARTS, INDUSTRIAL ARTS, HOME ECONOMICS, HEALTH AND SCIENCE, AND MATHEMATICS AND CONSUMER EDUCATION ARE PRESENTED. THE EDUCATIONAL PROGRAMS OF CURRICULUM, GUIDANCE, COUNSELING, TESTING, AND AUXILIARY SERVICES ARE OUTLINED. INCLUDED ARE CHARTS OF ADMINISTRATIVE ORGANIZATION, TEST DATA, ENROLLMENT AND ATTENDANCE OF STUDENTS AND STAFF. EXAMPLES OF APPLICATION BLANK, ENTITLEMENT QUESTIONNAIRE, CERTIFICATES OF MERIT, COMPLETION, AND RELEASE OF LIABILITY ARE INCORPORATED INTO THE REPORT. LISTS OF CONSULTANTS, ADVISORY COMMITTEES, PROJECT PUBLICITY, STAFF AND DIRECTOR SUMMARIZATION AND RECOMMENDATIONS ARE INCLUDED. (JH)"
