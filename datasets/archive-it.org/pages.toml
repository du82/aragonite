\t      Robert Crown Law Library’s Websites"""
full_description = "This collections consist of web crawls capturing the Robert Crown Law Library. The Robert Crown Law Library is the legal research center of Stanford University. The library’s website has relevant information regarding access, research support, and outlines services available. The website is arranged as produced. There is an bi-annual collection of the official Robert Crown Law Library’s website. Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: The Financial Crisis Inquiry Commission (FCIC) created a website dedicated to reporting on matters related to its mission and purpose but by federal mandate the operations of the FCIC ceased to exist on February 13, 2011. However, the FCIC believed it was in the public interest to allow information related to its findings to continue to be made available on a publicly available website. In this capacity, the Rock Center for Corporate Governance at Stanford University and the Robert Crown Law Library at Stanford Law School (SLS) have agreed to host the new website and make the data more accessible in the coming years. Description: This consist of web crawl for the Robert Crown Law Library’s Special Collections page. Description: This web crawl consists of the Robert Crown Law Library’s blog called “LIBOR Litigation”. LIBOR Litigation blog focus on tracking legal cases of banks and individuals that manipulated the London Inter-bank Offered Rate (LIBOR). The LIBOR Litigation blog ran from 09/18/2012 to 08/10/2015."
