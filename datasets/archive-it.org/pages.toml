["https://archive-it.org/organizations/1002"]
title = """
Archive-It - 
  
\t      William & Mary"""
full_description = "Swem Library's Special Collections Research Center (SCRC) at the College of William and Mary is a learning lab for students, much like a science lab, except the raw materials we offer for your experimentation and observation are original manuscripts, photographs, rare books, sheet music, maps, and other unique or rare treasures documenting humanity's history and culture. Focused on Virginia history, our collections include diaries, letters, and other records of the daily lives of Americans of all backgrounds. The University Archives collects materials documenting the history of the College from the 1600s to the present. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. This collection contains past online exhibits created by William & Mary students and library staff members. Capturing experiences related to COVID-19 on the campus of William & Mary and in the Williamsburg, Virginia area. For more archived websites, visit webrecorder.io/WMLibrariesSCRC/covid-19-pandemic. Subject: Spontaneous Events, Society & Culture, Science & Health, Communicable diseases, Epidemics, Coronavirus infections, COVID-19 (Disease), Quarantine, Social distance This collection seeks to document the community based social movements across the entirety of Virginia. Virginians organize themselves in a variety of ways, but this collection focuses on community organizations specifically. Community organizing is understood to exclude political campaigns and labor union struggles and instead encompasses neighbors fighting for their community and groups of people mobilizing around their common identities. Special Collections Websites focuses on websites connected to existing collections in manuscripts and rare books, and on websites that align with our primary collecting areas. The University Archives Web Archive Collection captures websites in the wm.edu domain to document the history and important events of the university. Websites for this collections were selected for their representation of William & Mary and their documentation of the interests and activities of the students, faculty, staff, alumni, and leadership."
