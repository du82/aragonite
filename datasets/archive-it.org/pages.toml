["https://archive-it.org/organizations/1068"]
title = """
Archive-It - 
  
\t      Queens Public Library"""
full_description = "The Queens Public Library serves 2.3 million people from 62 locations plus seven Adult Learning Centers and two Family Literacy Centers. It circulates among the highest numbers of books and other library materials in the country. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. This collection is one of Queens Public Library's original three web archiving collections and is focused on various groups that record Queens history. It consists of recurring crawls of the sites of local historical societies, museums, blogs, beautification groups, and select newspapers. Each crawl is done on either a weekly or a monthly basis. Archiving for this collection began in September 2016 and is ongoing. This is one of Queens Public Library's original three web archiving collections. This group of crawls is centered on the web and social media presence of QPL, and more specifically, the Queens Memory program and the Digital Archives, as well as on general Queens news in the form of local newspaper content. All crawls in this collection are captured on either a weekly, monthly, or quarterly schedule. Archiving for this collection began in September 2016 and is ongoing. New York City is the center of the U.S. pandemic and Queens has seen the highest numbers of diagnosed cases and hospitalizations: 33,468 and 9,729 respectively, as of April 13. The borough is experiencing high concentrations of COVID-19 cases, with Elmhurst Hospital and its surrounding neighborhoods at the epicenter of the crisis. As the New York Times reported on April 9, the communities of Corona, Elmhurst, East Elmhurst and Jackson Heights have a combined population of 600,000 but had recorded more than 7,000 coronavirus cases. This web archive collection captures news and other coverage from a variety of sources on the disproportionate impact the pandemic has had on Queens and the ways in which Queens residents are adapting during this moment in history. Captures for this collection are one-time captures. Collecting began in April 2020 and is ongoing."
