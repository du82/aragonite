["https://archive-it.org/collections/13472"]
title = """
Archive-It - 
  
\t      Elections in Africa"""
full_description = "This collection captures online activities associated with electioneering in Africa. Web accounts associated with elections in Africa provide a rich platform for capturing events as they occur in their regions. The various sources ranging from professional journalism to freelance authorship and from partisan political parties to activism make the medium a rich resource. Nonetheless, much of Web activities emerge in the periods preceding elections and fizzle out or disappear altogether after elections. This archive attempts to maintain a record of these momentous activities across a continent that is undergoing extraordinary changes nearly a century after the wave of independence swept across the nations. Since the dawn of independence in the middle of the twentieth century, African countries have gone through varying degrees of democratic freedom ranging from single-party rules to military takeovers, rapid successions, and failed states. This archive is dedicated to capturing these events as they unfold. Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: Website with communications from the general director of elections of Senegal, including press releases related to the July 31, 2022, legislative elections. Description: Official website for the center-left party's 2020 election platform including presidential candidate Eddie Komboïgo. The Congress for Democracy and Progress was the ruling political party in Burkina Faso until 2014. Description: Government agency In charge of the organization and supervision of electoral and referendum operations in Burkina Faso. Description: The Coalition of Domestic Election Observers (CODEO) is an independent and non-partisan network of civil society groups, faith-based organizations and professional bodies which observe Ghanaian elections. It was established in the year 2000 under the auspices of the Ghana Center for Democratic Development (CDD-Ghana) to mobilize citizens of Ghana to actively participate in the electoral process and to complement the efforts of Ghana’s Electoral Commission in ensuring transparent, free, fair and peaceful elections."
year_published = 2025
