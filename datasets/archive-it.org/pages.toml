full_description = '''Romance fiction represents a significant portion of the publishing industry, and the online community of readers and authors is extremely active, but the works themselves are not widely collected by academic libraries. This web archive includes review sites, blogs, Twitter hashtags, and other web content focused on romance fiction and the online communities that have developed around it. Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: A statement from the International Association for the Study of Popular Romance criticizing the Romance Writers of America's sanctioning of Courtney Milan Description: The main page for chapter #19 of the Romance Writers of America. Their page has a statement criticizing the Romance Writers of America's punishment of Courtney Milan. Description: A blog post arguing that criticism of racist works is justified because even casual racism affects people's attitudes, using Courtney Milan's accusations of racism as an example of justified critique. Description: A list of books withdrawn from the RITA awards by their authors as a way to protest the Romance Writers of America's punishment of Courtney Milan. Description: Women of Color in Romance is a website that promotes authors of color in romance fiction. Description: An article discussing Courtney Milan's accusations of sexual harassment against former Judge Alex Kozinski. Her role in speaking out against the former Judge is compared with her criticism of racism in the romance community. Description: All About Romance is a blog that offers "unbiased book reviews, author interviews, industry commentary and much more to romance readers." Description: A list of Romance Writers of America local chapters that posted statements regarding the RWA board's sanctioning of Courtney Milan. Description: This blog post contains a detailed explanation and critique of the procedure behind the Romance Writers of America placing sanctions on Courtney Milan, as well as a recommendation that the RWA board resign and thoroughly audit their ethics committee.'''
