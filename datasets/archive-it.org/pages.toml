title = """
Archive-It - 
  
\t      Asia Art Archive"""
full_description = "Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. Conceived and initiated during his residency at Asia Art Archive in October 2011 and January 2012, Beijing-based artist Song Dong spent more than a year to realise his first solo exhibition in Hong Kong, 'Song Dong: 36 Calendars'. This ambitious participatory project involved the re-writing of the last 36 years of history (1978-2013) from his personal perspective in the form of 36 years of hand-drawn, wire-bound annual household wall calendars. Each of the 432 months was accompanied by a sketch of a significant historical event, relaying Song's long-time interest in socio-political history, individual experience, and art history. During the exhibition opening on 21 January 2013, the artist invited over 400 members of the public to collaborate with him to complete the project by adding, changing, or editing individual months according to their own memories of historical events. Alongside Song's version of the calendar, participants' creations added another layer to the artwork, on display throughout the exhibition period. This exhibition was co-presented by Asia Art Archive (AAA) and Mobile M+ of the West Kowloon Cultural District Authority at ArtisTree, TaiKoo Place, Island East in Hong Kong from 22 January to 8 February 2013. 關於 > 簡介 此項目的概念源於2011年10月及2012年1月在文獻庫的駐場計劃，駐北京藝術家宋冬以超過一年的時間籌備於香港舉辦的首個個展《宋冬：三十六 曆》。於這個龐大項目中，他以手繪的家居鐵線圈掛曆，重寫記憶中過去36年（1978-2013）的歷史。這432個月中，每一個月份他都繪畫一件重大的歷史事件，反映了藝術家對社會政治歷史、個人經驗以及藝術史等議題的長期關注。於2013年1月21日展覽開幕當日，藝術家邀請了超過400位公眾，按個人經歷增刪補改掛曆的內容。展覽分別展出宋冬原初的版本，以及經公眾參與修改的另一版本。是次展覽由亞洲藝術文獻庫（文獻庫）與西九文化區管理局M+進行合辦於香港太古坊 ArtisTree 舉行，展期為2013年1月22日至2月8日。"
