["https://archive-it.org/collections/6150"]
title = """
Archive-It - 
  
\t      Sophia Smith Collection: Women's History Archive"""
full_description = '''The Sophia Smith Collection is an internationally recognized repository of primary sources in women's history. The holdings document the historical experience of women in the United States and abroad from the colonial era to the present. Subject strengths include birth control and reproductive rights; U.S. and international women's rights; suffrage; the contemporary women's movement and social justice activism across race, class, and sexual orientation; U.S. women working abroad; the arts; and the professions. The collections are rich in manuscript, printed, and visual, as well as digital sources. The web archive features selected websites of organizations and individuals whose collections are held in the Sophia Smith Collection. Subject: Society & Culture, Arts & Humanities, Science & Health, Women--History, Reproductive rights, Women’s health services, Feminists--United States--History Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: Grassroots advocacy, low-income rights and social justice organization based in Springfield, Massachusetts. Description: "Sluts Across America" is the collective voice of the women and men in this country who use or support birth control in the face of attempts to limit the availability of essential services to women, men, and families who need access to them to live healthy, productive lives. The version of the site archived here is a re-creation of a project by media artist Roopa Vasudevan. Originally launched in April 2012 as an anonymous collective storytelling project, the website went viral in the first few months of its release and amassed close to 9,000 responses from birth control advocates all over the country (and the world). Description: The Women’s Alliance for Theology, Ethics and Ritual (WATER) is feminist educational center and network of justice-seekers. WATER sponsors programs and publications, liturgical planning and consultation, workshops and retreats, counseling and spiritual direction.'''
