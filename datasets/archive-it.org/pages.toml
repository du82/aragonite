["https://archive-it.org/organizations/1008"]
title = """
Archive-It - 
  
\t      Smith College"""
full_description = "Smith College opened in 1875 and is among the largest women’s colleges in the United States, with students from every state and 60 countries. The Smith web archiving program is administered by the Smith College Libraries and aims to collect and preserve web content associated with Smith College, as well as selected websites of organizations and individuals whose records and papers are held in the College Archives and Special Collections. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. The Smith College Archives documents the history of Smith College from the 1860s to the present by collecting materials created by students, faculty, administrative and departmental staff during the course of their time here. The Archives houses the official records of the College, including its publications. In addition, the College Archives collects materials from alumnae relating to their undergraduate years at the College. This web archive collection includes the College’s official websites and Smith alumnae and student groups. The Sophia Smith Collection is an internationally recognized repository of primary sources in women's history. The holdings document the historical experience of women in the United States and abroad from the colonial era to the present. Subject strengths include birth control and reproductive rights; U.S. and international women's rights; suffrage; the contemporary women's movement and social justice activism across race, class, and sexual orientation; U.S. women working abroad; the arts; and the professions. The collections are rich in manuscript, printed, and visual, as well as digital sources. The web archive features selected websites of organizations and individuals whose collections are held in the Sophia Smith Collection. Subject: Society & Culture, Arts & Humanities, Science & Health, Women--History, Reproductive rights, Women’s health services, Feminists--United States--History"
