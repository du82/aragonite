\t      Art Practical"""
full_description = "Art Practical was founded in 2009 as an online arts publication based in San Francisco. In 2020, Art Practical described itself as a visual arts publishing organization that was people-forward and equitable. The organization published with passion, rigor, and integrity through initiatives that included online arts discourse, podcasts, books, educational programs, and public events. As a platform, Art Practical embraced these many forms to connect diverse regional voices and amplify underrepresented perspectives from the Bay Area and broader West Coast. Art Practical was founded by Patricia Maloney, who served as its director through 2016. Michele Carlson was director from 2016–2019. Christina Linden took up the directorship in the fall of 2019. The content published by Art Practical and Daily Serving, a sister publication that was published by Art Practical from 2013 through 2017 (when the two merged) represents hundreds of artists, galleries, arts institutions, and projects in the voices of over 450 writers and contributors. From 2014 to 2020, Art Practical was published through California College of the Arts (CCA) in San Francisco. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. This archive includes all published material produced by Art Practical, a visual arts publishing organization based in San Francisco, between its founding in 2009 and its departure from a partnership with California College of the Arts (CCA) which lasted from 2014–2020. It also includes content published by Daily Serving, a sister publication that was published by Art Practical from 2013 through 2017, when the two merged. Subject: Arts & Humanities, American Art, Art Criticism, Artists, Blogs & Social Media, Communication and the arts, Contemporary Art, Exhibitions, Museum Exhibits, Museums, Online arts publication, San Francisco Bay Area, Society & Culture, West Coast, Art Practical"
