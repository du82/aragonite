\t      5. New School Publications (2016-2024)"""
full_description = "Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: The online counterpart to Eleven and a Half, the student-run literary magazine of Eugene Lang College of The New School. Description: Founded in 1962 as the first peer learning community in the United States, IRP has been an integral part of The New School University since its inception. IRP members have long been encouraged to explore and share their creative endeavors in IRP Voices, an annual magazine of arts and letters. Since 2011 Voices has been produced as an online venture. Originally conceived as a venue for written works, Voices Online added a well received section of photography. Publisher: New School for Social Research (New York, N.Y. : 1919-1997). Institute for Retired Professionals Description: This website seeks to explore and interrogate the past at a school dedicated to the new. Contributions by students, staff, faculty, alumni, and researchers. Description: This website seeks to discover, figure out, and interrogate the past at a school dedicated to the new. Students are mining recently recovered archival materials and have put together much of the material on the website. Click on “History” to obtain information about many of the school’s acclaimed historical moments, including the University in Exile, the building of 66 West 12th Street, and the murals of José Clemente Orozco and Thomas Hart Benton. “Voices” features the newest discoveries from the archives from scholars, students, and New School aficionados. Check out the “Reader” with its long and varied list of articles, books, music, artwork and dance created by thinkers and artists associated with the university. Note: SoundCloud mp3s from Plots(s) Multimedia section were downloaded separately; contact archivist@newschool.edu for access. Note: Individual magazine issues have been stored separately from Issuu as PDFs, as many do not open via the archived site. Contact archivist@newschool.edu for access."
