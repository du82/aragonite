["https://archive-it.org/organizations/1053"]
title = """
Archive-It - 
  
\t      Middlebury College"""
full_description = "With a history spanning across more than two centuries, Middlebury College is a unique institution, among the most highly regarded liberal arts colleges, with a reach extending from our main campus in Vermont's Champlain Valley to specialized and graduate programs located around the world. Special Collections and Archives at the Middlebury College Library serves as a research laboratory for both the Middlebury community and independent scholars. As part of our firm commitments to open scholarship and to preserving a deep historical record of the Middlebury College community, we excited to be able to collect and share relevant Web content with people around the world via Archive-It. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. The murder of George Floyd on 5/25/2020 by Minneapolis police officers inspired mass uprisings in dozens of American cities against police brutality and the systemic oppression of Black people in the United States. This collection includes responses and reactions from individuals and organizations that make up the Middlebury community to George Floyd's murder, the ensuing protests, Black Lives Matter, and the broader struggle taking place throughout the country in support of civil rights and social justice for Black people in the US. Subject: Society & Culture, Spontaneous Events, Blogs & Social Media, Campus culture, Student activities, Student life, College activities, Civil rights, Social justice, Student activism, Black Lives Matter, George Floyd, Police violence, Campus politics, Racism on campus, Racism Representing a wide range of efforts by staff, students, and faculty to foster digital liberal arts scholarship and pedagogy. The DLA at Middlebury Web Archive has been established by Middlebury College Special Collections and Archives in order to preserve digital projects. The collection includes projects funded by grants from the DLA initiative of the Center for Teaching, Learning, & Research (CTLR) as well as artifacts from broader digital scholarship work within the Middlebury Community."
year_published = 2025
clearnet = "https://archive-it.org/organizations/1053"
tags = ["accessing", "anti-black", "archive", "archive-it", "archived", "archives", "archiving", "arts", "collecting", "collector"]
language = "en"
internal-references = ["none"]
