full_description = "Mount Holyoke College Archives and Special Collections (ASC) documents, preserves and shares the stories of the Mount Holyoke community — its people and its physical places — from the school’s founding in 1837 to the present day. Through its web archiving program, ASC selectively captures web content produced by or about the Mount Holyoke community. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. Archives and Special Collections is charged with collecting and preserving the historical records of the College. Much of the information collected in paper form now resides on college websites. Additionally, websites demonstrate the public facing communication of the college. Encompassed in this collection are websites created by college offices, departments, centers, and student organizations. Beginning in 2013, we began the first phase of our effort to collect this information by harvesting websites on the college web domain. The list of sites collected continues to grow, providing a fuller picture of the Mount Holyoke webspace and of the college itself."
