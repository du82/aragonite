full_description = "The Archives of Ontario (AO) is one of Canada’s largest provincial archives, and a premier source of information about the history of the land we now call Ontario and its people. Our collections document the decisions, functions and activities of the Government of Ontario as well as individuals, businesses, and organizations whose records carry enduring provincial significance. Since the web sphere is a key venue for interactions between the province’s government and its citizens, the goal of the AO’s web archives collection is to preserve provincially significant web-based information resources and make them available for current and future generations. We began collecting in early 2021. Sites and collections from this organization are listed below. Narrow your results at left, or enter a search query below to find a collection, site, specific URL or to search the text of archived webpages. This collection contains archived content from websites of Ontario government ministries and agencies. This collection contains archived content from Ontario Public Inquiries, Commissions, and Independent Reviews websites"
