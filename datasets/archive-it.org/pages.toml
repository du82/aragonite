["https://archive-it.org/collections/1757"]
title = """
Archive-It - 
  
\t      New York City Places and Spaces"""
full_description = '''A growing collection of websites selected by the Avery Architectural and Fine Arts Library staff for web archiving preservation by the Columbia University Libraries' Web Resources Collection Program. Website captures began in 2010 and are ongoing; in 2020, to reflect the collection's evolving subject focus, the collection title was changed to 'New York City Places and Spaces' (from the original 'Avery Library Historic Preservation and Urban Planning'). The collection's principal thematic focus is documenting the evolution of the built environment and public spaces in and around New York City through the interaction of historic preservation efforts and new development projects within urban planning debates. Selected websites are mostly published by non-profit groups or individuals based in the New York City area, including historic preservation groups, neighborhood associations, community development groups, public policy organizations, parks and open space conservancies, and both sponsors and critics of ongoing development projects. Subject: Arts & Humanities, Government - Cities, Society & Culture, Community development, Public spaces, Parks, City planning, Historic preservation, Architecture Sites for this collection are listed below. Narrow your results at left, or enter a search query below to find a site, specific URL or to search the text of archived webpages. Description: "The 161 Street Business Improvement District is committed to improving the community for those who live, work, visit and shop on 161 Street in the Bronx. Our goal is to keep the streets clean, promote commerce and enrich the area through special events and cultural projects. 161 Street is an exciting area for tourists, residents and employees alike. It is a neighborhood best known for Yankee Stadium, but it’s also filled with great restaurants, recreation sites, municipal resources and unique shops and services." Description: "Founded in May of 2015, Access Queens is a coalition of local New York City residents committed to sustaining vibrant, diverse communities. We know that the success and economic stability of our communities and our borough, depends on access to appropriate infrastructure that supports and enables Queens to thrive. As infrastructure goes hand in hand with responsible development, and as Queens continues to grow, we will advocate for the needs of our borough."'''
