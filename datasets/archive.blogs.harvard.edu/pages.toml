["https://archive.blogs.harvard.edu/melarat"]
title = "Articles and Book Reviews"
full_description = "Book Review: “Changing Minds: The Art and Science of Changing Our Own and Other People’s Minds” by Howard Gardne Gardner presents seven powerful “levers” for changing minds, examining their application across various levels of mind change. The first lever is reasoning, highlighting the persuasive power of logical and rational arguments. By employing reasoning, individuals can classify information, develop theories, and employ analogies to create compelling models. The second lever is research, emphasizing the importance of using relevant data to sway minds. Gardner highlights how impactful data can capture people’s attention and influence their perspectives. Continue reading → This entry was posted in Uncategorized on June 29, 2023 by Mel Arat. Change Anything “Change Anything: The New Science of Personal Success” offers a groundbreaking approach to personal transformation and achieving lasting change. Authored by a team of renowned experts including Kerry Patterson, Joseph Grenny, Ron McMillan, Al Switzler, and David Maxfield, this book provides invaluable insights and practical strategies to overcome obstacles and create meaningful change in various aspects of life. The authors introduce six sources of influence that play a vital role in driving personal success. Each source of influence is explored in-depth, offering powerful tactics and techniques to transform negative behaviors, enhance skills, and cultivate a supportive environment conducive to personal growth. The first source of influence, “Love What You Hate,” challenges the belief that change requires a lifetime of self-denial. The authors encourage readers to change their perspective by making their likely future more salient, poignant, and real. By doing so, individuals can learn to develop a positive outlook and love what they once disliked, enabling them to sustain their motivation and commitment to change. Continue reading → This entry was posted in Uncategorized on June 28, 2023 by Mel Arat."
year_published = 2023
