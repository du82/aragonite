["https://archive.blogs.harvard.edu/blog/tags/news"]
title = "news |  Weblogs at Harvard"
full_description = 'Page 1 of 5 next Read-only archive As of July 31, 2023, this blog network is a read-only archive. Read the announcement of the shutdown here: http://blogs.harvard.edu/blog/2023/03/02/blogs-harvard-edu-shutting-down/ This archive is hosted by Automattic in coordination with the Berkman Klein Center in an effort to keep this important historic piece of the internet online. If you are an owner of a blog on this network and would like to request an export of your content to move to another platform or report a technical issue with one of the blogs, please reach out to us using the form below. If you are in the Harvard network and would like to set up a new site, visit https://sites.harvard.edu. Request Support for Your Blog Your full name(required) Your current email address(required) Link to blog you’re contacting us about(required) Email address associated with your blog (If different) What do you need from us?(required) Export my site Delete my site Something else Details of request Contact Us Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); [Updated 7/1/2023] Blogs.harvard.edu Shutting Down June 30, 2023; Sites.harvard.edu available for Harvard community members Update 7/1/2023 We are deferring the shutdown of blogs.harvard.edu until July 31, 2023. During this period, the blog server will be placed into a read-only mode to allow blog users additional time to migrate and for the potential creation of an online archive. The deferred shutdown and archive would also provide link integrity and continuity for blogs that are not being migrated to other platforms. Thank you to the blogging community members who signaled to BKC the importance of the blogs platform and the significance of those blogs in the history of blogging. We appreciate your kind thoughts, connections and actions. Please stay tuned for a more detailed update and for ways in which you could help. Original Notice 3/2/2023 After a successful twenty-year run, we are decommissioning the blogs.harvard.edu platform effective June 30, 2023 in order to pivot to new challenges at the Berkman Klein Center in a time when blogging platforms are ubiquitous and widely available. Users of the blogs.harvard.edu platform who are current Harvard community members and who wish to continue blogging under the Harvard.edu domain are asked to migrate their blog(s) to the new HUIT platform, sites.harvard.edu, hosted on CampusPress and managed by Harvard Web Publishing (HWP). Users can request assistance from HUIT and HWP to create a new site and migrate content from blogs.harvard.edu. More information starting this process can be found in HUIT KB article KB0018446. Users of the blogs.harvard.edu platform who are not current Harvard community members and would like to save the contents of their site, should export their content prior to June 30. We recommend migrating to a free WordPress.com site. Helpful information on importing a site on to WordPress.com or more general information on moving and/or exporting your site and its content can be found on WordPress.com’s support pages. In 2003, the Berkman Center for Internet & Society (now the Berkman Klein Center for Internet & Society) began an unusual experiment: we launched a blogging platform. That seems quaint today in the age of ubiquitous access to services that facilitate the sharing of user-generated content. But it was an uncommon achievement at the time. Twenty years in, a blogging platform is no longer an experiment. Blogging platforms are ubiquitous on the internet, content hosted and created on the WordPress platform makes up more than 40 percent of all websites, and gaining access to a blogging platform is easier than ever for people and organizations wanting to create an online presence. The blogs.harvard.edu platform has undergone various changes in its management and now exists in an environment where users have innumerable ways to put content online, including for free. Blogs.harvard no longer offers a unique opportunity for online engagement. In addition, it is antiquated in its policies for customization and available extensions when compared with contemporary, streamlined platforms. We look back on the early days of the platform with a measure of nostalgia, and echo the enthusiasm expressed in 2004 about the role the platform played in the birth of podcasting, or in providing a platform to former students like Ory Okolloh (who went on to found Ushahidi), or—generally—in allowing an extraordinary array of “students, faculty, fellows, staff and alumni of Harvard” to “cut their teeth” by posting, commenting, and engaging with one another. From Creative Commons, to Global Voices, to PRX, the Center has specialized in playing the role of incubator, where new platforms and other technologies can be piloted before they are spun out to operate in the proverbial wild. It is bittersweet to close an era of blogging on blogs.harvard.edu. Temporary limitation of registration URLs In an effort to curtail recent abuse of the platform, effective immediately, access to the URLs used to create a new account or a new blog will be limited to on-campus or VPN clients only. This change should not affect any of the blogs.harvard.edu normal day-to-day users or public viewers. This change should only affect users that wish to create a new account or a new blog. If you are off-campus and would like to create a new blog or new account, please use the Harvard VPN to obtain access. For more information on using the Harvard VPN, please refer to the HUIT IT Help knowledge base articles on using and/or installing the VPN, or your school’s specific help desk documentation for its use. We are currently working toward the integration of Harvard Key with the blogs.harvard.edu platform. At the time that the integration is complete, the restriction of the registration URLs will be removed. We thank you for your patience and apologize for any inconvenience this may cause in your normal workflow. Upcoming Changes in the Blogs.Harvard Blogging Platform 7/13/2018 In 2003, the Berkman Center for Internet & Society (now the Berkman Klein Center for Internet & Society) began an unusual experiment: we launched a blogging platform. That seems quaint today in the age of ubiquitous access to services that facilitate the sharing of user-generated content. But it was an uncommon achievement at the time. That platform—blogs.law.harvard.edu (now blogs.harvard.edu)—allowed registered users from the Berkman and broader Harvard communities, including some from outside those communities, the freedom to reach a wide audience with messages of their choosing without hand-coding html or resorting to Dreamweaver. Recall that Facebook did not launch until February 2004 (with registrations limited to Harvard students). Jack Dorsey posted his first Tweet in March 2006, and Twitter went live for the general public that July. Tumblr arrived on the scene in February 2007. “Weblogs@Harvard,” as it was known, was lauded as the first service of its kind in higher-education. The Center’s former Executive Director, John Palfrey, recounted the story of the platform’s design and development seven years ago (and eight years after its launch) in a detailed 2011 post. He recalled that it began with the idea that “we should encourage Harvard’s academics to start blogging.” The Harvard Crimson’s contemporaneous coverage of the launch back in 2003 quoted former Berkman Center fellow Dave Winer, who responded to those who might criticize blogs as “frivolous soapboxes” by noting that one never knows “when a great news story might come out from someone who last week was just whining.” (Interestingly enough, the Crimson also quotes blogging pioneer and current Vox luminary Matthew Yglesias, then a student at Harvard College.) The platform’s ease of use helped introduce individuals and organizations Harvard-wide to the world of online discourse. It is currently home to more than two thousand blogs and nine thousand bloggers. And the platform has an audience in over 100 countries, peaking at over a half of a million page views per month. Perhaps not surprisingly, the growth and maturation of our blogging platform has mirrored the phenomenon of blogging more generally. Although garnering attention has become trickier, there is now more opportunity than ever before for individuals to reach audiences. Our platform no longer offers a unique opportunity for online engagement. And it is technically antiquated when compared with contemporary, streamlined platforms that offer more advanced tools for social interactions. While this fact gave us reason enough to think about finding a new home for the platform within Harvard’s central IT department—we first set the gears in motion to do so about four years ago!—a second issue occasions our greasing those gears. The aforementioned 2011 post noted that the Center had managed the platform through terms of use that addressed users rights and responsibilities and that “[t]he call for dispute resolution has been minimal.” This has changed over time as the platform has scaled. The Center is increasingly faced with the types of thorny content moderation decisions that many online platforms that are subjects of our research face every day. Making discretionary judgments about speech (including offensive speech) within the context of an academic institution which maintains a commitment to academic freedom, with such a wide range of users (some much more and some much less connected to Harvard), on a platform that bears that institution’s name, at a time where alternative options abound, has become a tricky business. It should come as no surprise that a research center like ours is a fantastic place to study the online ecosystem—including the ecosystem for content moderation—but is less well-equipped to operate a platform at scale either technically or substantively. With these two sets of issues in mind, we will end our operation of the blogs.harvard.edu platform in favor of a new platform managed by Harvard University’s Information Technology team. Specifics of that transition are being worked out, and we expect to roll out plans in collaboration with HUIT over the coming weeks. In the meantime, in anticipation of that transition, the Berkman Klein Center is taking steps to cabin the universe of users with blogs on the platform. In the earliest days of the platform, policies about what users could have blogs were fairly liberal. In April 2007, the platform was migrated from the Userland Manila Web Publishing System to WordPress. At that time, restrictions were put in place to only allow account creation on the new WordPress platform by users having a harvard.edu or affiliated (HBS, HMS, etc) email address. But, early users were grandfathered in and allowed to maintain their existing blogs. At this point, for all of the reasons set out above, we feel that the time for hosting content from non-Harvard-affiliated bloggers on Harvard servers has passed. We are giving non-Harvard users with active blogs the opportunity to export existing content over the coming weeks. Those users will then be transitioned off the platform. We look back on the early days of the platform with a lot of nostalgia and echo the enthusiasm expressed back in 2011 about the role the platform played in the birth of podcasting, or in providing a platform to former students like Ory Okolloh (who went on to found Ushahidi), or—generally—in allowing an extraordinary array of “students, faculty, fellows, staff and alumni of Harvard” to “cut their teeth” by posting, commenting, and engaging with one another. From Creative Commons, to Global Voices, to PRX, the Center specializes in playing the role of incubator, where new platforms and other technologies can be piloted before they are spun out to operate in the proverbial wild. We are thus happy to turn over the keys to Harvard’s elite technical team to keep things up and running alongside many other University-wide services. We look ahead with the knowledge that the platform, in its new form, will be well cared for. Plugin updates – Multilingual and form plugins The WPML plugin, which allows for the multilingual functionality within WordPress, and the Gravityforms plugin, which allows for the addition of user input forms on blogs, were updated this morning. A selection of blogs using the plugins were tested for compatibility with the updates and no adverse changes were noticed. If you do experience an issue with the update, please let us know via the contact form. WordPress upgraded to 4.6 We’re now running wordpress 4.6.1, the latest and greatest from Automattic. This is a minor release change from the previous version we were running. It does incorporate some new features, like new native fonts and editor improvements, but mostly it is a necessary update because of security fixes. Version 4.6 of WordPress, is named “Pepper” in honor of jazz baritone saxophonist Park Frederick “Pepper” Adams III. For more info about the new features in this release, check out Automattic’s news release. Along with this update, various plugins and themes were updated to their latest revisions. There were no major version changes, all of the themes and plugins versions only changes by minor versions. If you experience any issues with the updates, please drop us a line via the contact us link on the homepage (note: you must be logged in to submit the form). Happy blogging! WordPress upgraded to 4.4 We’re now running wordpress 4.4.2, the latest Automattic WP release. This is a minor release change from the previous version we were running. It does incorporate some new features, like enhancements that make your, and your readers’ experience more connected and responsive, and a new twenty theme: Twenty Sixteen. The update also includes a set of security fixes, which are always a good addition. Version 4.4 of WordPress, is named “Clifford” in honor of jazz trumpeter Clifford Brown. For more info about the new features in this release, check out Automattic’s news release. Blogs.harvard.edu is now live As mentioned in a previous update, Harvard blogs were slated to move from blogs.law.harvard.edu to their new home at blogs.harvard.edu, which would establish the platform as the official University-wide system. The migration was successfully completed last night. You should not need to take any action as a result of this shift (besides clicking on ‘update’ banner if you have Jetpack enabled) and you should not notice any change in service (besides a new, shorter URL). If you do, please drop us a line with and explanation of the problems you are experiencing. The next step in the update to the blogs system will be to migrate the ownership and support of the platform from the Berkman Center for Internet & Society to HUIT. We will keep you posted as this effort unfolds. Server migration and a few bugs with CSS You may have noticed earlie'
