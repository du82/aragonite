["https://archive.blogs.harvard.edu/revision"]
title = "Robert John Bennett - Revision - Harvard Novel"
full_description = "A Journal of 2019 – 2 ø Robert John Bennett - January 4, 2023 @ 6:25 pm · Filed under Novel 2018.03.09 Some Tweets: @Pontifex “The Catholic Church has, in fact, been about the last bastion of the Socratic principle in the modern world. Clearly, if – in fact – its authority contradicts itself at a deep level, something has gone wrong.” – James V. Schall, S.J. https://goo.gl/tf8Qwp @Pontifex This pope tweets, “We can support one another, and face every kind of challenge with courage and hope, when we draw our strength from Jesus.” That is really true when faced with the challenge of rebuilding the Church, ruined by the errors and confusion of this papacy. @Pontifex Cardinal Sarah has been saying this kind of thing (https://goo.gl/w3fjm9) for some time. I have often wondered how long it will be before the pope punishes him, as others have been punished for speaking in support of Church teaching and the Gospel. @Pontifex “IN THE CHURCH’S 2000 YEAR HISTORY OF HERESIES BERGOGLIANISM WILL BE KNOWN AS ONE OF THE MOST DEADLY BECAUSE OF THE POWER OF SOCIAL MEDIA TO SPREAD THE VIRUS” https://goo.gl/F69ac5 @Pontifex “Invite children of divorce to Cupich’s Amoris Laetitia seminars” (https://goo.gl/C1yHdP) @Pontifex In response to a papal Tweet: The season of Lent each year is a chance for this pope to return to God in every aspect of his life, and to stop spreading error and confusion in the Church. @Pontifex “A looming demographic disaster is facing the Church in the United States.” https://goo.gl/71usqs @Pontifex A delusion of the devil? (https://goo.gl/K92MBK} This is also a delusion created by the “Paradigm Shift” or the “New Paradigm” that Cardinals Cupich and Parolin and others are now promoting, and that Cardinal Müller and Archbishop Chaput and others are condemning. @Pontifex Fasting reminds us that God alone can satisfy our hunger, and He alone can send us a good pope, one who is faithful to the teachings of the Church, one who can rebuild the Church and free it from this pope’s errors and confusion. @Pontifex A response to the Pope: fidelity to Church teaching and to the Gospel helps us recognize our neighbor as our brother or sister, and to acknowledge that what we possess never belongs to the pope alone. It belongs to the 2,000-year-old history and teaching of the Church. @Pontifex So, this pope is having a movie about himself produced, now, during his lifetime. What enormous humility! Dear God, why are You punishing Your Church? What did we do to deserve this? Please, dear God, send us a good pope, one who will rebuild Your ruined Church. @Pontifex This pope tweets, “When you meet other people in the Lord, you can be sure God’s surprises will follow.” And when you encounter almost anything this pope writes, you can be sure confusion will follow. @Pontifex Mother of God, why is your Son punishing us by allowing so many homosexuals in the Vatican and elsewhere in the hierarchy and the clergy? Why is He allowing them to go on trying to influence Church teaching? Mother of God, help us. @Pontifex This pope, this man of humility, uses Catholic movie director Wim Wenders (who is now married to his fifth wife) to produce a “documentary” about – I am not making this up – himself. @Pontifex In response to a papal Tweet: Let us recognize what leaves a good and lasting mark on our hearts, i.e., faithfulness to Church teaching, to the truth of the Gospel, knowing this comes from God, without the error and confusion that has marked this pontificate up to now. Cardinal Wuerl noted: priests should respect the decisions made in conscience by individuals who act in good faith. ( https://goo.gl/443r6F ) So if an individual decides in conscience to receive Communion despite committing adultery, sodomy, incest, or pederasty, that’s fine? @Pontifex What would the martyrs of The White Rose say about today’s world, about today’s Church? “With every day that you still hesitate, that you do not resist this spawn of hell, your guilt increases like a parabolic curve higher and higher.” (https://goo.gl/AACA3L) @Pontifex “St. Cloud Is 4th Minnesota Diocese to Declare Bankruptcy Amid Abuse Lawsuits” (https://goo.gl/tAHGWD) You have to wonder if this sort of thing would have happened without “the spirit of Vatican II” (or whatever that “spirit” was). @Pontifex In response to a papal Tweet: if sometimes error, confusion, anger, vindictiveness, and the refusal to follow Church teaching flame up in the heart of this pope, God and His Blessed Mother protect the Church and the people of God from such a man. @Pontifex O Lord, teach this pope the truths of the Gospel and Church teachings. Stop him from spreading any more error and confusion in the Church. Have him correct his errors, and keep away from him those evil cardinals who constantly lead him into error. Please, Lord. @Pontifex This video https://goo.gl/F2enfU is a masterpiece. That’s the only word for it. When Michael speaks about these truths and in this way, he creates a brilliant masterpiece of Church teaching, and an elegant tapestry of the teachings of Christ. @Pontifex In response to a papal tweet: I thank all decent clerics who strive to build a clean and pure Church, free of this pope’s error, confusion, anger, and vindictiveness, and free of the monstrous acts and perverted teaching of some in the hierarchy. @Pontifex This pope says, “Even the fleeting life of the least of beings is the object of God’s love.” (https://goo.gl/kq76pq) Yes, even the fleeting life of a pope who spreads error and ruin in the Church, hiding his pride and anger behind “mercy” and a show of humility. @Pontifex This pope hopes that many will be “celebrating the sacrament of Reconciliation.” (https://goo.gl/ahVbnD) But with a “paradigm shift” where everyone is “accompanied” and then follows his or her own conscience, does sacramental confession even mean anything anymore? ———————————————————————————————————————————————————– 2018.03.11 St. Alphonsus writes of Our Lord’s “compassion for the necessities of the souls of poor sinners who are deprived of Divine grace.” (https://goo.gl/YJPQ62) With saints like that in heaven, why should we be afraid of clerics and prelates with their fake “mercy” and “paradigm shift” and their “accompaniment” and “discernment,” which, as Bishop Athanasius Schneider points out, while sounding “beautiful” really amount to a permission to sin. (https://goo.gl/UN1GCH) There is probably no connection between this “paradigm shift” thinking and the perversions reportedly practiced by Vatican clerics, but St. Alphonsus is here to protect the Church against them, just in case. Along with Our Lady, crushing the head of the serpent with her heel. With such protection, together with that of St. Michael, we have little to fear from the errors, the confusion, the destruction, and all the other horrors of the present pontificate. Watching the new film, “The Death of Stalin,” it occurred to me that there are these two lessons, among other of course, that we can learn from history: one, even the most monstrous evil is in the end ridiculous and laughable, certainly sub specie aeternitatis; and two, every period of governance, in every institution and in every country, no matter how awful it may be, does not last forever. —————————————————————————————————————————————————— 2018.03.14 You have to wonder if Archbishop Hebda believes (https://goo.gl/bz4VEL) it might be the duty of the hierarchy to avoid the kind of bankruptcy the Archdiocese of St. Paul and Minneapolis has confronted, a bankruptcy involving $156 million in claims by sex-abuse survivors. You also have to wonder if the archbishop believes it might be the duty of the hierarchy to avoid the kind of error and confusion of the current pontificate, error and confusion that seem to have begun after the propagation of the “spirit” of Vatican II and probably played a role in the sex-abuse crisis. Might it also be the duty of the hierarchy, therefore, to represent and support the traditional teaching of the Church and the Gospel? After all that’s been done, then might be the time for the archbishop to ask the laity to represent the Catholic faith in the public arena. ———————————————————————————————————————————————————– 2018.03.15 @Pontifex This pope tweets: “In the Sacrament of Reconciliation we find our way to the Lord, and discover the meaning of life,” unless we’re a victim of the “paradigm shift.” Then is there a need for confession? After “accompaniment,” and we can follow our own conscience, right? @Pontifex This pope tweets: “In the Sacrament of Reconciliation we find our way to the Lord, and discover the meaning of life,” unless we follow the “paradigm shift.” Then there’s no need for confession – after some “accompaniment,” we can just follow our own conscience, right? @Pontifex More from Cardinal Eijk in the Netherlands (https://goo.gl/hP5Fdj). He’s utterly right, of course, but I’m afraid that if he keeps it up, this pope will be shipping him off to Tierra del Fuego or someplace. Or demoting him to a parish priest in Bangladesh. @Pontifex I listened to Michael’s hard, splendid comments in this Vortex (https://goo.gl/7qGM2P, and I thought how few people can understand and accept the truth of such ideas. I also thought of some lines from “Four Quartets”: “….human kind / Cannot bear very much reality.” @Pontifex “Confessors should help young people discern vocations, Pope says” (Vatican News) But how are they going to do that after the “paradigm shift” that pretty much does away with confession by telling people to follow their conscience? Oh, right, there’s “accompaniment.” @Pontifex Cardinal Onaiyeken of Nigeria said he’s astonished that leaders of the Church in the West are concentrating their energies on the status of Catholics who are divorced and remarried, at a time when “the churches are getting more and more empty.” https://goo.gl/oWZhXB @Pontifex If this pope dedicates more time to prayer, his heart will reveal the lies with which he deceives himself, and he will find true consolation in God, while at the same time ceasing to promote error and confusion in the Church and stopping the protection of evil prelates. @Pontifex And what will happen to this pope if he does not seize the God-given opportunity to start over again and create a new pontificate, faithful to the Gospel and to Church teaching, without error, confusion, ruin, anger, and vindictiveness? @Pontifex St. Alphonsus writes of Our Lord’s “compassion for the necessities of the souls of poor sinners who are deprived of Divine grace.” (https://goo.gl/YJPQ62) With saints like that in heaven, why should we be afraid of clerics with their “paradigm shift” and fake “mercy.” @Pontifex This pope tweets, “Living the encounter with Jesus means allowing yourself to be turned inside out by Grace every day.” That’s nonsense. Living the encounter with Jesus means – for this pope – being faithful to the Gospel and Church teachings and not spreading error. @Pontifex Aid to the Church in Need reports “Christians are the victims of at least 75 percent of all religiously motivated violence and oppression.” The report adds that some 215 million Christians face severe persecution, mostly at the hands of Muslims. https://goo.gl/P2asDs @Pontifex This pope tweets: “When we allow Jesus to enter our lives we discover the secret to keeping alive the flame of our spiritual life.” That appears to be a secret this pope has yet to discover, along with the secret of preventing error and being faithful to Church teaching @Pontifex “Vatican Hires Pro-Homosexual Law Firm to Shut-Down Pro-Family, Catholic Website” https://goo.gl/G3AvQV How long, O Lord, will You be silent in the face of this evil? @Pontifex “Vatican Hires Pro-Homosexual Law Firm to Shut-Down Pro-Family, Catholic Website” https://goo.gl/G3AvQV How long, O Lord, will You be silent in the face of this evil? With a prayer that the works of the Demon and his allies will soon be brought to an end. @Pontifex “‘…This pope is a man with profound philosophical and theological formation….” Wow! Next we’ll hear that he’s a world-class polylinguist, an orator comparable to Churchill, a strategist on a par with Napoleon. We Catholics are just so lucky.” https://goo.gl/92QcJF @Pontifex In response to a papal Tweet: If we encounter Jesus and our brothers and sisters every day, we will remember how important the Gospel and Church teaching are. We will remember eternity, not simply the present moment. @Pontifex You have to wonder if Archbishop Hebda believes (https://goo.gl/bz4VEL) it might be the duty of the hierarchy to avoid the kind of bankruptcy the Archdiocese of St. Paul and Minneapolis has confronted, involving $156 million in claims by sex-abuse survivors. @Pontifex Numerous USCCB statements have absolved Islam of the crimes committed in the name of Islam. Instead of naming the religious ideology that motivates the terrorists, Church officials echo the mantra that terrorism has nothing to do with Islam. https://goo.gl/RqTCUc @Pontifex “When viewed objectively, it is surely hard to reconcile the conciliar doctrine on conscience presented in Gaudium et Spes with the novel teachings of Cardinal Cupich and Pope Francis.” https://goo.gl/Twv8az (Will another Catholic professor soon be fired?) @Pontifex “Vatican doctored photo of letter by Pope-emeritus Benedict” https://goo.gl/wew1xG And what else was doctored in this letter? The text as well? @Pontifex “Cardinal Parolin: joy, mercy, and evangelization are the major themes of this pontificate” (Vatican News) Yes, along with error, confusion, anger, and vindictiveness toward anyone who dares disagree with this pope. @Pontifex “True reform entails ‘missionary transformation of Church,’ Vatican cardinal says” (Fides) Some might say that true reform entails support of the the Gospel and Church teaching. @Pontifex “In order to prepare a truly human future, it is not enough to reject evil.” ,No, it is also necessary to reject the error, the confusion, the destruction, and the sheer evil of this horrendous pontificate, together with this pope’s anger and vindictiveness. ———————————————————————————————————————————————————– 2018.03.19 I guess I’m kind of stupid, but I have never understood Matthew 1:19: “Joseph her husband, since he was a righteous man, yet unwilling to expose her to shame, decided to divorce her quietly.” By “divorcing” her, i.e. ending the betrothal, wouldn’t Joseph have exposed her to MORE shame? She would then have been simply an unwed mother. If he had wanted NOT to “expose her to shame,” wouldn’t his first reaction have been to MARRY her, rather than taking steps “to divorce her quietly”? —— Thank you for taking the time to respond to my comment. You’re right when you say that the New Theological Movement site doesn’t really offer an answer to my question. The site says, “He (Joseph) made up his mind to divorce her quietly, seeking to preserve both her good name and his justice.” I still "
