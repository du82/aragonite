full_description = "Temporary limitation of registration URLs In an effort to curtail recent abuse of the platform, effective immediately, access to the URLs used to create a new account or a new blog will be limited to on-campus or VPN clients only. This change should not affect any of the blogs.harvard.edu normal day-to-day users or public viewers. This change should only affect users that wish to create a new account or a new blog. If you are off-campus and would like to create a new blog or new account, please use the Harvard VPN to obtain access. For more information on using the Harvard VPN, please refer to the HUIT IT Help knowledge base articles on using and/or installing the VPN, or your school’s specific help desk documentation for its use. We are currently working toward the integration of Harvard Key with the blogs.harvard.edu platform. At the time that the integration is complete, the restriction of the registration URLs will be removed. We thank you for your patience and apologize for any inconvenience this may cause in your normal workflow."
