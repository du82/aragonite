description = "Venture Innovation Fellow –   Technology and Entrepreneurship Center at Harvard – Harvard Paulson School of Engineering and Applied Sciences"
full_description = "Bio Jorge is a Venture Partner at NLC, Europe’s largest Healthtech Venture Builder. A serial entrepreneur, Jorge has founded 6 startups (5 exits and one shut down) in 3 countries and 5 industries. He has been CEO 7 times in 6 industries. His innovations in healthcare technology include inventing the first precision medicine software platform (2014), the first vendor-neutral digital pathology dicomizer (2012), and the first commercially available augmented reality system for surgery (2009). As an educator, he has delivered keynote talks at events like HIMSS and RSNA, guest lectures at institutions like Oxford, Harvard, MIT, and Stanford, while having taught innovation at the Polytechnic University of Valencia and the Open University of Catalonia. At Harvard, Jorge serves as Innovation Fellow at the Technology & Entrepreneurship Center at Harvard (TECH) in the John A. Paulson School of Engineering and Applied Sciences (SEAS), and also serves as an Expert-in-Residence at the Harvard Innovation Labs (Hi). He’s also a former professional basketball player, member of the European Commission Expert Group on Venture Philanthropy and Social Investments and UBS’ Industry Leaders Network. Educated at the University of Oxford (Computer Science graduate), MIT (Entrepreneurship Development Program), and the University of Valencia (postgraduate in Clinical Genomics), he has received innovation and academic awards by: NASA, HIMSS, IBM, Digital Pathology Association, Frost & Sullivan, and the Wall Street Journal. LinkedIn | Resume | Personal Blog | Personal Website Jorge is a Venture Partner at NLC, Europe’s largest Healthtech Venture Builder. A serial entrepreneur, Jorge has founded 6 startups (5 exits and one shut down) in 3 countries and 5 industries. He has been CEO 7 times in 6 industries. His innovations in healthcare technology include inventing the first precision medicine software platform (2014), the first vendor-neutral digital pathology dicomizer (2012), and the first commercially available augmented reality system for surgery (2009). As an educator, he has delivered keynote talks at events like HIMSS and RSNA, guest lectures at institutions like Oxford, Harvard, MIT, and Stanford, while having taught innovation at the Polytechnic University of Valencia and the Open University of Catalonia. At Harvard, Jorge serves as Innovation Fellow at the Technology & Entrepreneurship Center at Harvard (TECH) in the John A. Paulson School of Engineering and Applied Sciences (SEAS), and also serves as an Expert-in-Residence at the Harvard Innovation Labs (Hi). He’s also a former professional basketball player, member of the European Commission Expert Group on Venture Philanthropy and Social Investments and UBS’ Industry Leaders Network. Educated at the University of Oxford (Computer Science graduate), MIT (Entrepreneurship Development Program), and the University of Valencia (postgraduate in Clinical Genomics), he has received innovation and academic awards by: NASA, HIMSS, IBM, Digital Pathology Association, Frost & Sullivan, and the Wall Street Journal. LinkedIn | Resume | Personal Blog | Personal Website"
