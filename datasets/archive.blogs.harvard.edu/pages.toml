["https://archive.blogs.harvard.edu/jorgecortell/2022/11/10/concert-lecture-lunch-office-hours-game"]
title = "Concert, lecture, lunch, office hours, game | Jorge Cortell blog @Harvard"
description = "Venture Innovation Fellow –   Technology and Entrepreneurship Center at Harvard – Harvard Paulson School of Engineering and Applied Sciences"
full_description = "On Monday, October 31st, I attended a chamber music concert by Howard Skempton, marking his 75th birthday with Carson Cooman on piano/organ, and David von Behren on violin, at Harvard’s Memorial Church. Honestly, more impressive than the music, is the sad memorial of the long list of students that lost their lives fighting in WWII. Then again, the USA population was mostly spared from the horrors that Europe brought unto itself. But I guess that wasn’t enough to learn, and here we are, not even a century later, fooling around with fascism again. Will we ever learn? That’s the question I asked myself as I walked down the main corridor of Harvard Law School, where I had lunch with Harvard neighbors friends. All those state men, brilliant people that made history, warning us to keep fighting and not take anything for granted. Because, yes, it can also happen here. Or rather, it is also happening here. On a lighter note, a day after my Expert in Residence office hours at the Harvard Innovation Labs on Wednesday, I attended an Entrepreneurship class by Prof. John Boyce at the Sanders theater (it was the only way to catch him, Prof. Paul Bottino and Prof. David Weitz at the same time). It’s almost hard to concentrate while sitting on the oak benches that host 1,000 students. The last time I attended a class there, I was an undergrad student, and we were discussing Metaphysics. How things change! On Friday I took my daughter to a high school football game, and on Saturday to the Harvard vs Columbia game. We keep making the same rookie mistake: showing up early, getting tired, and leaving in the last quarter right before the game takes a dramatic turn. I guess the pros show up at half-time, and the hardcore fans stick it up all the way ‘til the end. Lesson learned."
year_published = 2022
