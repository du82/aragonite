description = "Mulching the present to feed the future"
full_description = "Blogs.harvard, wrapped: an ecosystem snapshot as the lights go out Friday June 30th 2023, 1:37 pm Filed under: citation needed,fly-by-wire,indescribable,meta,Not so popular,null ¡Blogs.harvard is closing its doors for good! Today is nominally the last day it will be editable, though it will stay up for archiving and export for another month. The WordPress dashboard lately has hadan expandable bar in the corner titled ‘Recent Updates’, but I’d never expanded it to see that it was local news about the platform, so this came as a surprise. Checklist: 1) ping people who still need to migrate 2) draft final blog post, honoring the network In the early days of blogging, Dave Winer was an energetic advocate of the form, as something important for writing and communication and not just another modern pastime. He set up the first version of Blogs@Harvard while he was a Berkman fellow (a Manila instance hosted by the Berkman Center, at blogs.law.harvard.edu), and started blogging there as well as at Scripting News. It moved to WordPress in 2007. The community revisited it in 2011 to reaffirm the value in keeping it online. (JP, as the head of the center, warmly summarized the project history to date at that point) Over the next decade, new blogs were only created by Harvard affiliates. In 2014, technical maintenance of the blogs moved to the Harvard Library’s Office for Scholarly Communication, and the domain changed to blogs.harvard.edu. In 2018 its maintenance shifted to Harvard University Information Technology, and any old blogs run by authors who were not affiliates were closed [and taken offline, if they had not set up an archive]. This also affected a number of past affiliates who no longer had university or alum email addresses, including the pathbreaking info/law and j’s scratchpad, blog of the founding organizer of the Blogging Group. Now the rest are being shut down. While bloggers still at Harvard can migrate to the existing sites.harvard.edu, with a bit of effort, they are not being migrated by default, and most have not migrated. Those without new posts in the past year were not notified of the change. This also affects people like Doc Searls, a long-time pillar of free software and the open web who we’ve been lucky to have in the local eddy, whose active projects live on nearby. There are plans for a full archive to be preserved; let’s make it one befitting this decentralized community, which has hosted many students and practitioners of digital creation and archiving. Going through the archiving process myself reminds me of the [extraordinary, wonderful] service of the Wayback Machine, which may also let us restore former blogs currently hidden behind its veil. Checklist: 3) Salvage old drafts 4) Make a proper export It is a curious sensation to revisit my old tempo of posting by seeing the proportionate tempo of unpublished drafts; some quite good and close to completion, but written in a week or month when many other works were going out. These days I would publish a good three-section post without hesitation. Most drafts removed or published; new “unfinished draft” category added. I am also reminded that fully half of the links from over 5 years ago are no longer online; other websites having a much shorter time-to-linkrot than this blog family. Again, Wayback is not only a default salvation but one of the only options; if it disappeared, readers, researchers, and historians would be entirely out of luck (short of bring up one of the Wayback mirrors). If you are in a position to host a full mirror (currently around 100PB), please get in touch with the archiveteam or the Internet Archive. Exports should be easy, though mine is not small. Preserving the directory structure on import requires a target style that uses the same schema for dated posts. Alternately, I could scrape the entire site into a .wacz file and restore its public appearance exactly as it stands today, then move to a different format for a future blog. I’d like something more collaborative by nature; easy to have a cohort working together. I have hopes that Tana could be turned towards this end, as shared writing is naturally a more social activity than just linking to one another’s blogs (and even here some of the best outlier blogs here have been multi-author, during times when many were active together) https://blogs.harvard.edu/project-info/ Comments Off on Blogs.harvard, wrapped: an ecosystem snapshot as the lights go out Right to the City on Communities over mere Commodities Monday May 08th 2023, 9:00 pm Filed under: Glory, glory, glory,popular demand Right to the City maintains a Homes for All campaign that has done some excellent research into city housing crises across the US. My favorite report from their network is this catalog of alternative models and their uses, which has gotten hard to find online: People-driven alternatives to an unjust housing system (2018) (local copy) (more…) Comments Off on Right to the City on Communities over mere Commodities Elementary creature cards: a funny game of math and logic Thursday April 20th 2023, 4:02 pm Filed under: chain-gang,noetic,Seraphic,zyzzlvaria I’m trying to track down physical creature cards, a logic puzzle that started w/ the Elementary Science Study project (in Newton!) & was riffed on for decades. The visual and mathematical puzzles became quite involved; including combinations of shading, geometry, topology, number theory, and more. Creatures were also creatively named: Mokes, Snorpes, Gligs, Wibbles, Shlooms, Bleeps, Quarks, Trugs, Zyzzes, Mellinarks… If you run across these somewhere, please reach out and get in touch. I would like to reprint some of the professionally done sequences, and perhaps expand on the idea. Example (via Amber Case). Discussion: https://twitter.com/metasj/status/1584695567846109184 Comments Off on Elementary creature cards: a funny game of math and logic Kostoff, reprised: peer review secured again, everything is fine. Wednesday May 11th 2022, 10:18 am Filed under: chain-gang,citation needed,metrics,poetic justice,unfinished draft In the end, Elsevier retracted Kostoff’s anti-vax article, along with a pro-ivermectin study in the same issue that was similarly statistically-challenged. (It was that ivermectin study that led me to discover the issue in the first place, via scite.ai) But not before his article dominated media and social media references to the Journal for months; and the author parlayed his peer-reviewed work into a DailyClout essay that was even more extreme, and did a tour on the social media anti-vax circuit. Thousands of people spent time debunking this nonsense, including a dozen on PubPeer alone. Millions of people saw references to it on social media. The editor-in-chief who regularly published his own articles (or added himself as author to articles in his journal) stepped down as EIC, but continues to edit other toxicology journals and publish research at a healthy clip of three articles a month. Global understanding of COVID-19 is advancing steadily, with no further confusion or misdirection whatever. Everything is fine 🐶🔥 Comments Off on Kostoff, reprised: peer review secured again, everything is fine. The Kostoff knowledge: Elsevier fakes peer review of COVID click-bait Thursday September 30th 2021, 9:54 pm Filed under: chain-gang,fly-by-wire,knowledge,meta,poetic justice,Rogue content editor,Uncategorized,zyzzlvaria The Kostoff knowledge v.14 Updates: Elsevier retraction (5/9), concern (12/17). EIC Tsatsakis removed. (~3/25). Analyses by Schneider (10/6) & Morris (10/14). Kostoff’s article is top 1% by Altmetric. K. publishes 3× more extreme version (10/13). Tox.Rep’s CiteScore grows 5% in Oct. 15 of Kostoff’s last 18 papers written w. Tsatsakis, the other 3 in Tsatsakis journals. Earlier this month, Elsevier‘s Toxicology Reports (CiteScore 6.4, top quintile) published a special issue on the COVID-19 pandemic. Its includes a remarkable article by Kostoff, et al., claiming that getting a COVID-19 vaccine is, “extremely conservatively“, 5x as likely to kill people over 65 as it is to save them, and even more harmful to younger people. (Kostoff, et al., Tox. Rep. (2020), 7, 1448-1458) This echoes the fraudulent claims of German homeopath Harald Walach, who briefly published a similar article in MDPI Vaccines in June, before it was promptly retracted. A few of the most outrageous claims are listed below. None of this is subtle – unbelievable assertions start in the second paragraph of the abstract; the lead author has no past experience in the field; and the article puts “pandemic” and “vaccine” in scare quotes, and makes regular use of bold italics to emphasize points that are exaggerated. This is why we have peer review, and editors, to distinguish research from polemic. Access to a reliable + competent body of reviewers is, in theory, a primary service that giant publishers like Elsevier offer to editors. Another is their name: being an Elsevier journal means you will be taken seriously out of the gate, and added to the major indices. We should all be concerned that our publishing model allowed such a deceptive essay to be given the veneer of legitimacy – for weeks now, without correction. And we must hold both journals and publishers accountable for fraud that they support or legitimize – through deceptive practice, lack of claimed review, or inaction. I want to come back to this, and discuss ways to remedy this, and some current steps in the right direction. But first let’s look at this instance in detail – as the errors were the most obvious that I’ve seen, related papers have been retracted in recent months, and it is impossible to imagine even casual peer review missing them. And because, as we will see, this particular Elsevier journal has been gaming the system for some time. Article-level fraud (by the authors) 1. Extensive misuse of VAERS data: VAERS is an open public registry of unvetted self-reports of health events occurring after vaccination. Most events are not caused by vaccines, but this is a starting point for further analysis. Doctors are supposed to report any deaths or hospitalizations occurring within a week of vaccination, regardless of potential causal link. The very openness of this data has led to it being widely cited in anti-vax propaganda, misinterpreting VAERS as a catalog of known harms and side-effects. (“Don’t Fall for VAERS scares“) (more…) 14 Comments FSF splits up, dithering til only a Stallman corps remains Thursday April 01st 2021, 12:34 pm Filed under: %a la mod,chain-gang,Uncategorized The FSF, bastion of advocacy for free & open software and the need for copyleft in general, split up last week – dividing its community in a lasting way. At the end of the 2021 LibrePlanet conference, surprising staff and speakers and attendees, RMS announced he was returning to the Board. In the immediate aftermath, all of the external conference keynotes, some former FSF trustees, and a number of other free software community leaders, published an open letter calling on the entire FSF Board to resign. Since then: * A number of large organizations withdrew their support for the FSF, including Mozilla, RedHat, EFF, and Creative Commons * A number of GNU and other free software projects have signed the letter, including GCC, GNU Radio, GNU Mailman, X.org, and Tor * A number of FSF staff gave notice, including the ED, Deputy ED, CTO, and President. * Their most meticulous board member resigned. * A member of the FSF staff was appointed to the Board. Some 3000 people signed the open letter; another 4500 6000 signed a letter in support of Stallman. That split is likely to last, and to define the Foundation as it hires new leadership and looks for new Trustees. (more…) Comments Off on FSF splits up, dithering til only a Stallman corps remains Teaching a poodle to make certain requests of his human partner Sunday November 01st 2020, 1:06 pm Filed under: Uncategorized The following is a lovely essay by John Lubbock on learning to communicate better with dogs by teaching them language to express concepts. It was first published in Nature in 1885 and included in his delightful On the Senses, Instincts, and Intelligence of Animals (1888) That the dog is a loyal, true, and affectionate friend must be gratefully admitted, but when we come to consider the psychical nature of the animal, the limits of our knowledge are almost immediately reached. I have elsewhere suggested that this arises from the fact that we have tried to teach animals, rather than to learn from them—to convey our ideas to them, rather than to devise any language or code of signals by means of which they might communicate theirs to us. The former may be more important from a utilitarian point of view, though even this is questionable, but psychologically it is far less interesting. Under these circumstances it occurred to me whether some such system as that followed with deaf mutes, and especially by Dr. Howe with Laura Bridgman, might not prove very instructive if adapted to the case of dogs. I have tried this in a small way with a black poodle named Van. I took two pieces of cardboard about 10 inches by 3, and on one of them printed in large letters the word [ F O O D ], leaving the other blank. I then placed two cards over two saucers, and in the one under the “food” card put a little bread and milk, which Van, after having his attention called to the card, was allowed to eat. (more…) Comments Off on Teaching a poodle to make certain requests of his human partner Forging Social Proof: the Networked Turing Test Rules the First AI War Friday September 25th 2020, 2:51 pm Filed under: citation needed,fly-by-wire,Uncategorized A few years ago I wrote about how our civilization was forfeiting the zeroth AI war — allowing individual attention hacks, deployed at scale, to diminish and replace our natural innovation and productivity in every society. We gained efficiency in every area of life, and then let our new wealth and spare time get absorbed by newly-efficient addictive spirals. Exploit culture This war for attention affects what sort of society we can hope to live in. Channeling so much wealth to attention-hackers, and the networks of crude AI tools and gambling analogs that support them, has strengthened an entire industry of exploiters, allowing a subculture of engineers and dealmakers to flourish. That industry touches on fraud, propaganda, manipulation of elections and regulation, and more, all of which influence what social equilibria are stable. The first real AI war Now we are facing the first real artificial-intelligence war — dominated by entities that appear as avatars of independent, intelligent people, but are artificial, scripted, automated. What is new in this? Earlier low-tech versions of this required no machine learning or programming: they used the veil of pseudonymity to fake authorship, votes, and small-scale consensus. In "
