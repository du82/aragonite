["https://archive.blogs.harvard.edu/jorgecortell/2022/09/01/appointed"]
title = "Appointed Innovation Fellow: t-92 | Jorge Cortell blog @Harvard"
description = "Venture Innovation Fellow –   Technology and Entrepreneurship Center at Harvard – Harvard Paulson School of Engineering and Applied Sciences"
full_description = "On June 1st, 2022 I was appointed Innovation Fellow at the Technology & Entrepreneurship Center at Harvard (TECH) in the John A. Paulson School of Engineering and Applied Sciences (SEAS), and a few days later also as an Expert-in-Residence at the Harvard Innovation Labs (Hi). My wife, my daughter and I had 92 days to get ready and go. Here’s a quick and simplified list, in no particular order, of what we had to do, obviously in parallel: Logistics: Plane tickets Pack the house Cancel utilities Find a new home for our kittens (thank you, sis!) Get an apartment in Cambridge (deal with realtors, landlord, inspections, fees, deposits, etc) Open a bank account in Cambridge Get a Visa: Fill out Harvard online form for HIO DS2019 DS-160 barcode I-901 and Pay SEVIS fee US Embassy appointment + pay fee Report Embassy appointment to HIO Translations Solvency certificate Embassy Interview Receive Visa Shopping (small sample): Mattresses Beds Desks Couch Sheets Towels Kitchen utensils Groceries Plates, silverware Night/coffee tables, etc Buy a car: Choose one “Assignment of Title” on the back of the vehicle’s “Certificate of Title” Insurance Transfer title and Registration at DMV (title and registration Application for Registration and Title Form TTLREG100, with stamp to certify insurance) Title and registration fees License plates or stickers Safety and emissions inspection at a Massachusetts Inspection Station within 7 days of completing registration Correct RMV registered address Parking permit Register my daughter in her new school: Birth Certificate Immunization Record Health History Form Proof of Cambridge Address (signed lease) Proof of Occupancy (dated within 30 days) Previous school transcript Language placement test And so much more I don’t even want to remember it! But here we are, settled, and living an experience of a lifetime, again."
