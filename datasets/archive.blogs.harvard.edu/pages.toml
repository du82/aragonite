title = "WordPress upgraded to 4.6 |  Weblogs at Harvard"
full_description = "WordPress upgraded to 4.6 We’re now running wordpress 4.6.1, the latest and greatest from Automattic. This is a minor release change from the previous version we were running. It does incorporate some new features, like new native fonts and editor improvements, but mostly it is a necessary update because of security fixes. Version 4.6 of WordPress, is named “Pepper” in honor of jazz baritone saxophonist Park Frederick “Pepper” Adams III. For more info about the new features in this release, check out Automattic’s news release. Along with this update, various plugins and themes were updated to their latest revisions. There were no major version changes, all of the themes and plugins versions only changes by minor versions. If you experience any issues with the updates, please drop us a line via the contact us link on the homepage (note: you must be logged in to submit the form). Happy blogging!"
