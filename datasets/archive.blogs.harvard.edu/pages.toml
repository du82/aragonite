title = "jorgecortell | Jorge Cortell blog @Harvard"
description = "Venture Innovation Fellow –   Technology and Entrepreneurship Center at Harvard – Harvard Paulson School of Engineering and Applied Sciences"
full_description = "One of the things I like the most about being a Harvard Fellow is that I get to attend SO many amazing events! The problem is that as wonderful as they are, it takes a lot of time, so I can’t keep up with my blogging. Some events I’ve attended (or I wanted to but Read More In 2005 I gave a talk at a Linux conference in Madrid (in Spanish) and a similar one a year later at the Hackers On Planet Earth 6 congress in New York (in English available also for purchase and for free) about a concept I called ‘Selfness’. 18 years later, an attendee writes me to Read More Attending a Harvard Men’s Basketball game, finally joining Harvard Athletics, first real snow, and putting together my awesome new Framework laptop: After a few days in Spain, celebrating the Winter solstice with family and friends (as always with very balmy weather and delicious food), when we returned to Cambridge we went to cheer for #onecrimson, Read More The Harvard Innovation Labs invited me to join their annual Gong-a-thon celebration, held at the Queen’s Head Pub, where different teams share the joy of their progress, learnings, and the whole community enjoys food and fun. It was very enjoyable, and a wonderful opportunity to catch up in a very enjoyable social setting. Thank you! I had the honor to be invited by Professor Randolph Cohen to judge Field X student startup project pitches at Harvard Business School. It was fascinating to see all those talented students pitch their project. While most were very early on, barely more than an idea, some had a lot of potential and very motivated teams behind Read More On Monday, October 31st, I attended a chamber music concert by Howard Skempton, marking his 75th birthday with Carson Cooman on piano/organ, and David von Behren on violin, at Harvard’s Memorial Church. Honestly, more impressive than the music, is the sad memorial of the long list of students that lost their lives fighting in WWII. Read More On Tuesday I was invited to attend a Workshop at MIT, held office hours for students at the Harvard Innovation Labs, and attended a Reception at Harvard… all before heading to the airport to fly to London! First, I attended the MIT Digital and Strategy Conference Workshop, organized by the MIT Startup Exchange and the Read More"
