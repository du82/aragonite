title = "Blogs.harvard.edu is now live |  Weblogs at Harvard"
full_description = "Blogs.harvard.edu is now live As mentioned in a previous update, Harvard blogs were slated to move from blogs.law.harvard.edu to their new home at blogs.harvard.edu, which would establish the platform as the official University-wide system. The migration was successfully completed last night. You should not need to take any action as a result of this shift (besides clicking on ‘update’ banner if you have Jetpack enabled) and you should not notice any change in service (besides a new, shorter URL). If you do, please drop us a line with and explanation of the problems you are experiencing. The next step in the update to the blogs system will be to migrate the ownership and support of the platform from the Berkman Center for Internet & Society to HUIT. We will keep you posted as this effort unfolds."
