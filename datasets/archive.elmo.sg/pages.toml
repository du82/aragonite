["https://archive.elmo.sg/posts/ctfs/2022/tisc-2022"]
title = "TISC 2022 | a rant of my adventures"
description = "The Information Security Challenge 2022"
full_description = '''TISC 202210 Sep 2022Table of ContentsLEVEL 1: Slay The DragonBasic Analysis of the GameFight A BossMine GoldVisit ShopExploiting the GameLEVEL 2 - Leaky MatricesFiguring out wthek is going onGuessing to the solutionLEVEL 3 - PATIENT0Part 1Part 2LEVEL 4A - One Knock AwayReverse Engineering our kernel moduleTrying to get the flagLEVEL 5A - Morbed, Morphed, MorbedLEVEL 6 - PwnlindromeThe ChallengeThe Information Security Challenge (TISC) is an annual Capture The Flag (CTF) competition hosted by the Centre for Strategic Infocomm Technologies (CSIT) in Singapore.The CTF features a series of 10 levels over the span of 2 weeks, covering various CTF topics including, but not limited to, Web Pen-testing, Forensics, Reverse Engineering, Binary Exploitation, Cryptography, and Mobile Security.In order to unlock levels, you had to clear all the levels before. At level 4 and 5, a choice was given to the participants to pick between RE or Cloud/Web challenges. I opted for the RE challenges which my writeup below will cover.The CTF also featured a total prize pool of $30,000SGD for participants who solved level 8 and above.Although I managed to quickly climb the leaderboard to stay in 1st place for majority of the CTF, I eventually got hardstuck at 7 and finished at 5th place.p.s. this writeup is not an exact representation of my thought process and steps taken to solve the challenges mentioned. it is merely a much more simplified and bite-sized summary to guide the reader through my solutionLEVEL 1: Slay The DragonFiles attached: slay_the_dragon.zipBasic Analysis of the GameUpon running the program provided to us, we are presented with a menu in a game.As a player, we are allowed to FIGHT A BOSS, MINE GOLD or VISIT SHOP.Fight A BossWe as a player (with 10 HP) have to defeat 3 bosses (slime, wolf and dragon) in order to win the game and get the flag.Naturally, defeating the boss by normal means is impossible as the dragon will one-shot you.Mine GoldIt takes around 5 seconds to mine 5 gold, with a small probability of dying to a creeper explosion.Visit ShopWe can purchase a sword which increase our attack from 1 to 3. The damage does not stack even with multiple swords.We can also purchase a health potion which increase our HP by a small fraction. Exploiting the GameSome people will immediately jump to try to call functions such as print_flag or increase the damage of the player by 10000. However, it is not so simple.Looking into the source code, how the game works behind the scenes is that the client will send a bunch of data (corresponding to the user’s actions) to the server, and the server may validate the data sent by the client.If we look at the source code for the mining event for example,# server side mining code class WorkService: def __init__(self, server: GameServer): self.server = server def run(self): self.server.game.player.gold += WORK_SALARY # client side mining code CREEPER_ENCOUNTER_CHANCE = 0.2 class WorkEvent: def __init__(self, client: GameClient) -> None: self.client = client def run(self): if random() <= CREEPER_ENCOUNTER_CHANCE: self.__die_to_creeper() self.__mine_safely() def __mine_safely(self): screens.display_working_screen() x = input("how many mine?") for _ in range(int(x)): self.client.send_command(Command.WORK) We can see that the long wait time for mining for gold is due to the client side code display_working-screen() and is not enforced on the server side. This is the same for the chance to encounter a creeper.This means we can simply comment out these lines to get as much gold as we want easily without waiting or dying.However, this is trivial and does not help us to defeat the dragon. Let’s get straight to the juice of the challenge which is the battle event.# client side code while True: self.__display() match self.__get_battle_command(): case Command.ATTACK: self.__attack_boss() if self.boss.is_dead: break case Command.HEAL: self.__use_potion() case Command.RUN: self.client.send_command(Command.RUN) return case _: continue self.player.receive_attack_from(self.boss) if self.player.is_dead: break self.client.send_command(Command.VALIDATE) self.__send_next_boss() while True: self.history.log_commands_from_str(self.server.recv_command_str()) match self.history.latest: case Command.ATTACK | Command.HEAL: self.history.log_command(Command.BOSS_ATTACK) case Command.VALIDATE: break case Command.RUN: return case _: self.server.exit(1) match self.__compute_battle_outcome(): case Result.PLAYER_WIN_BATTLE: self.__handle_battle_win() return case Result.BOSS_WIN_BATTLE: self.server.exit() case _: self.server.exit(1) As we can see, the outcome of the battle is determined through a stack-like history structure.The client send some Commands to the server-side, which upon receiving, the server will add to their history.The server will then check the latest entry in the history to determine whether the boss should attack or not. How it works goes like this:Client sends a Command.ATTACK to the server.The server receives the Command and add it to the history.The server will check the last entry of the history and determine that the boss should return an attack. Hence it will add a BOSS_ATTACK to the history.After the battle has ended, the server will iterate through the history to determine the outcome.So far, the code looks clean and logical. Let’s look into the code behind the logging.class Command(Enum): ATTACK = "ATTACK" #... @dataclass class CommandHistorian: commands: List[Command] = field(default_factory=list) def log_command(self, command: Command): self.commands.append(command) def log_commands(self, commands: List[Command]): self.commands.extend(commands) def log_command_from_str(self, command_str: str): self.log_command(Command(command_str)) def log_commands_from_str(self, commands_str: str): self.log_commands( [Command(command_str) for command_str in commands_str.split()] ) Interestingly, the log_commands_from_str function that was used by the server to get the user command reads in multiple commands at once, delimited by a whitespace, and concatenates it to the history.The flaw here is that since the server only checks the last command in the history to determine whether the boss should attack, we can send multiple ATTACK commands, and the boss will only attack us once.Hence, if we send enough ATTACK to kill the boss before it gets to attack us back, we will win the game.This can be easily done by modifying the script slightly.We will just change our client battle service code to the following: def run(self): self.boss: Boss = self.client.fetch_next_boss() while True: self.__display() match self.__get_battle_command(): case Command.ATTACK: # attack hundred times to kill dragon before it kills us self.client.connection.send("ATTACK "*100 + "ATTACK") break case Command.HEAL: self.__use_potion() case Command.RUN: self.client.send_command(Command.RUN) return case _: continue self.player.receive_attack_from(self.boss) if self.player.is_dead: break With that, we can easily run the script and get our flag.TISC{L3T5_M33T_4G41N_1N_500_Y34R5_96eef57b46a6db572c08eef5f1924bc3}LEVEL 2 - Leaky MatricesAttached File: 2WKV_Whitepaper.pdflol, crypto is my worst category but let’s get into it anywaysFiguring out wthek is going on2WKV operates on the basis of symmetric key cryptography. A 64 bit key must be securely generated and distributed to both endpoints before the algorithm can per form any verification. This 64 bit key represents the 8×8 binary matrix that will be used to perform mathematical operations in GF(2) during the Key Verification procedures.With a little googling, we can find a wikipedia page and see that GF(2) simply means that we will be working with binary arithmetic (addition/multiplication).By playing around with the service a litte, we see that it takes in 8 binary (0 or 1) of length 8, and returns a corresponding length 8 binary string.It then challenges us by giving us some binary and asking us for our answer.The server essentially generates a random 8*8 matrix as the key and use the key for the server to verity the client vice versa.With a little thinking, we probably would’ve to leak something (as hinted by the challenge name) in our first 8 inputs, and then solve the challenges given to us based on what we have leaked.Guessing to the solutionHonestly, after looking at everything, my brain was still empty (noob mather) but an idea came to me.If I have 8 inputs of length 8, could I possibly leak something that corresponds with each bit (sound something like masking) and see what I can do with it?At this point, I was willing to try anything to avoid having to think of math so that’s what I did.I inputted 8 inputs with only one bit enabled for each input and recorded the corresponding output:00000001 -> 11101010 00000010 -> 01110001 00000100 -> 01010111 00001000 -> 10001000 00010000 -> 00010101 00100000 -> 00100010 01000000 -> 10000111 10000000 -> 10111001 Then I was challenged to return a correct response vector for the challenge 01111100.I decided to try to take the corresponding output vector to each bit and add them up together.For the challenge vector 01111100, 00000100 -> 01010111 00001000 -> 10001000 00010000 -> 00010101 00100000 -> 00100010 01000000 -> 10000111 10000111 + 00100010 + 00010101 + 10001000 + 01010111 = 01101111 and it magically worked!!!I then decided to automate it with pwntools.from pwn import * p = remote('chal00bq3ouweqtzva9xcobep6spl5m75fucey.ctf.sg', 56765) arr = [] for i in range(8): payload = b'0'*i + b'1' + b'0'*(7-i) p.sendlineafter(b'<--', payload) p.recvuntil(b'--> ') arr.append(int(p.recvuntil(b'\n', drop=True), 2)) for i in range(8): p.recvuntil(b'--> ') chall = p.recvuntil(b'\n', drop=True) tmp = [] for j in range(8): if chall[j] == ord('1'): tmp.append(arr[j]) ans = tmp.pop(0) for k in tmp: ans ^= k p.sendline(bin(ans)[2:].zfill(8).encode()) p.interactive() TISC{d0N7_R0lL_Ur_0wN_cRyp70_7a25ee4d777cc6e9}LEVEL 3 - PATIENT0Part 1Attached File: PATIENT0Downloading the file, we can see that it is a NTFS file system.PATIENT0: DOS/MBR boot sector, code offset 0x52+2, OEM-ID "NTFS ", sectors/cluster 8, Media descriptor 0xf8, sectors/track 0, FAT (1Y bit by descriptor); NTFS, physical drive 0xab3566f7, sectors 12287, $MFT start cluster 4, $MFTMirror start cluster 767, bytes/RecordSegment 2^(-1*246), clusters/index block 1, serial number 05c66c6b160cddda1 Opening it up in Autopsy, we can extract a file files:broken.pdfmessage.pngmessage.png:$RANDIf we look at the broken.pdf, we can extract a hint1. The BPB is broken, can you fix it? If we search up BPB regardint NTFS, we can find this wikipedia page which identifies BPB as the BIOS Parameter Block, which can be found between offset 0xB - 0x50 of the file.If we look at the hex at these offsets of the file in 010editor, we can see the followingAs we can see, most of the hex in the BPB are uninteresting, however we can see TISC in an unused segment of the NTFS BPB block.If we try to submit the hexadecimal for the next 4 bytes that come after it, we get our flag for part 1.TISC{f76635ab}Part 2Now if we look at message.pngWe see that it has a BASE32 (i initially tot it was base64 but cyberchef said otherwise) which decoded to give us our second hint)_2. Thirsty for the flag? Go find the stream. If we keep digging around, we find more hints at the start and the end of the message.png:$RAND file.3. Are these True random bytes for Cryptology? 4. If you need a password, the original reading of the BPB was actually Checked and ReChecked 32 times! At this point I was rather stuck and confused about how to proceed.I figured that hint 4 pointed to a CRC32 checksum but I could not seem to find a collision to get the original 4 bytes that was used as the flag in part 1.At this point of the competition, many people were hardstuck at this level which pushed the organizers to release new hints.The organizer released this image as one of the hint:which can be easily identified as truecrypt logo with a simple google search. Then it occurred to me that this was what hint 3 was pointing to.If I had to guess, hint 2 probably pointed to the message.png:$rand byte stream.Could it be that the stream of bytes were encrypted with TrueCrypt??I removed the part 3 and part 4 hints from the start and end of the stream, then threw it into TrueCrypt while using the flag in part 1 as the password.This presented me with the following picture:It hinted to finding a key and had empty blanks for the last word. It was obvious that the missing word is collision, however since all the other words on the piece of paper were in leetspeak, we can expect the word collision to be in leetspeak as well.This is where the final hint comes in. If we need a password (the key in this context), the original reading of the BPB was CRC32-ed. This meant that the flag to part 1 is the CRC32 of the leetspeak version of collision.To verify our assumptions, we can write a script to get a leetspeak collision to generate the same crc32 hash.from zlib import crc32 from hashlib import md5 OUTER = "the ch3cksum h1des m4ny keys but the tru3 key re5embles an eng1ish w0rd wh1ch d3scribe5 th3 c0ndit1on of hash {}" WORD = list("collision") CRC32 = 0xf76635ab PERMUTATIONS = ["collision"] LEET = {"o": ["0", "o"], "l": ["1", "l"], "i": ["1", "i"], "s": ["5", "s"]} for idx in range(len(WORD)): PREV_PERMUTATIONS = PERMUTATIONS[:] if WORD[idx] not in LEET: continue for x in PREV_PERMUTATIONS: PRIOR = list(x) perms = LEET[PRIOR[idx]] for char in perms: PRIOR[idx] = char if "".join(PRIOR) not in PERMUTATIONS: PERMUTATIONS.append("".join(PRIOR)) for EACH in PERMUTATIONS: if crc32(EACH.encode()) == CRC32: print(EACH) which gave us an output of c01lis1on as the key/password.However, where is the hidden door where we can use this key?My first assumption was that it would be a stegotrick with the image, which led me to try various steganography methods which took passwords such as steghide. However it was all to no avail.Demoralized and confused me was just trying everything possible, and when I tried to use the key to decrypt the same stream of bytes in TrueCrypt again, I was presented with a different decrypted file!!I was shocked when it happened but ¯\_(ツ)_/¯ magic only possible with the ancient TrueCrypt.Anyways, the decrypted file was a powerpoint macro-enabled slide which played a music and had the text: flag is md5 checksum of the audio clipThis was trivial, and was easily solved by extracting the contents of the powerpoint and finding a file with a .mp3 or .wav extension.❯ 7z x flag.ppsm 7-Zip [64] 17.04 : Copyright (c) 1999-2021 Igor Pavlov : 2017-08-28 p7zip Version 17.04 (locale=en_US.UTF-8,Utf16=on,HugeFiles=on,64 bits,2 CPUs x64) Scanning the drive for archives: 1 file, 1166196 bytes (1139 KiB) Extracting archive: flag.ppsm -- Path = flag.ppsm Type = zip Physical Size = 1166196 Everything is Ok Files: 40 Size: 1218992 ❯ find . -name '*.mp3' | md5sum 2bf2c64ad4b1047e324a08dcf77e98f2 - TI'''
