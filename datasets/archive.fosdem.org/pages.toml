["https://archive.fosdem.org/2015"]
title = "FOSDEM 2015 - Home"
full_description = "Every year, thousands of developers of free and open source software from all over the world gather at the event in Brussels. Please tell us about your FOSDEM experience at feedback@fosdem.org. All your feedback and suggestions for next year will be greatly appreciated. As pointed out during the opening talk, we have a completely new recording and streaming workflow this year. After some teething problems this morning, we're happy to report that most things are now working! We would really like some more volunteers, particularly for crowd control and infodesk duty (selling t-shirts, being helpful, etc). Last year we turned off IPv4 on our main FOSDEM wireless network. They idea is to confront developers with the IPv6-reality and encourage them to fix bugs. Progress has been made, but there is a lot of work left to do! Just like previous editions, we will have two freely bookable rooms for open source communities to use (BoF rooms), as well as an announcement corner and job corner. See below for the details."
