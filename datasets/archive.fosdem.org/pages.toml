title = "FOSDEM 2013 - Home"
full_description = "It is renowned for being highly developer-oriented and brings together 5000+ geeks from all over the world. A big, enourmeous massive thanks to all the volunteers, speakers and visitors for making it so awesome. Before we hibernate for half a year, we want to know one thing from you: what did you like, what didn't you like? For years, the main FOSDEM Infodesk has been at the entrance of the H building. This year, we've decided to move it to the K building. The venue for the keysigning will be the same as last year: the foyer on the second floor of the U building. Follow the signs for Chavanne. We start at 14:00 sharp on Sunday. Be on time and come prepared!"
