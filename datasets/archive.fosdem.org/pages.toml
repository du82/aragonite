["https://archive.fosdem.org/2012"]
title = "fosdem.org"
full_description = "Front page AboutFOSDEM Sponsors FAQ SchedulePrintable schedule Grid Saturday Grid Sunday TracksKeynotes Main Tracks DevRooms Lightning Talks Stands All Speakers Printable Schedule Mobile Contact Practical informationVenue & travel The New Building Catering During the event Streaming Video Certification Exams Job Corner Keysigning Accommodation Friday Beer Event Spouses / partners tour Press & Promotion MediaSpeaker Interviews Videos Archives These pages have been archived. For information about the latest FOSDEM edition please check this url: http://fosdem.org We love feedback! Please take a minute to fill out our online feedback form, or send us a mail at info@fosdem.org. We are pleased to announce that the first video recordings of FOSDEM 2012 have been uploaded to our master server; they should be available shortly as our mirrors synchronize with our main server. You can browse the contents through video.fosdem.org. Please note that this is only the first batch; there are many more videos to come. We will make an announcement when all videos have been uploaded; meanwhile, please bear with us as we continue with transcoding and fixing up of the remaining videos. Our video team is hard at work to make the video recordings available. No news yet on exactly when they will appear online, but stay tuned! For those of you interested in the technical aspect of the video streaming, have a look at http://grep.be/blog/en/life/fosdem/2012_video . FOSDEM would like to thank all volunteers who helped make our conference possible again. The bussload of students that helped with the setup, the numerous volunteers that reacted to the call for volunteers, the people who spontaneously showed up at the infodesk offering their services. The regular veterans, the new blood. You all did a splendid job and we sincerely hope to see you all again next year. Thanks, guys. Couldn't have done it without you! We have discovered that the printed schedules end about an hour before the conference is scheduled to end. We are still trying to decide whether the schedule is too long or the paper too short. Note that at 17:00 in Janson, Bdale Garbee will present his Freedom, Out of the Box! keynote. This will be followed immediately by the closing talk and FOSDEM dance. Be there ... or be elsewhere!"
