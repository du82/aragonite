["https://archive.fosdem.org/2010"]
title = "fosdem.org"
full_description = "Front page AboutFOSDEM Sponsors Contact SchedulePrintable schedule Grid Tracks Main Tracks DevRooms Lightning Talks Stands Practical informationAccommodation Transportation Catering Certification Exams Friday Beer Event Keysigning Spouses / Partners Tour MediaSpeaker Interviews Smartphone schedule Videos Archives These pages have been archived. For information about the latest FOSDEM edition please check this url: http://fosdem.org You might have noticed the videos of the Main Tracks and Lightning Talks are already online on our different mirrors. Round robin loadbalancing is performed using the following link: http://video.fosdem.org. From now on we also publish the videos on YouTube. Google upgraded our account so we can now upload videos without time-limitation. This means you can watch any video streamed and in one single part.Our official channel page is: http://youtube.com/fosdemtalks. We are trying to collect recordings of the many developer rooms. Another FOSDEM is behind us, and this edition was the best ever! This was in no small manner aided by our enthousiastic army of volunteers who helped with the setup, moderation, infodesk and various crucial tasks. I would like to take a moment to thank them for all their effort. Without you guys this would not have been possible. Thanks, volunteers! I'm looking forward to working with you again next year... The video recordings should be online in approximately one week. They will be released in an adequate Creative Commons license. O'Reilly Books Olivier Nicolas Etienne Saliez The above persons can email aburet@fosdem.org to know the details on how to get the books. Nokia N900 Alex Dulaunoy Michael Sawicz Luca Capello Luca was present this Sunday, so he has already received his new phone ... Alex and Michael will be contacted by email. Linux Magazine The FOSDEM 2010 keysigning party is now taking place outside. If you were in room Ferrer on time, you would have been able to read the master hashes from the projector. If not, find them on https://fosdem.org/2010/keysigning."
