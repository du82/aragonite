["https://archive.fosdem.org/2008"]
title = "FOSDEM | Free and Open Source Software Developers' European Meeting"
full_description = "Front page About FOSDEM Sponsors Donate Contact Schedule Printable schedule Grid Main Tracks DevRooms Lightning Talks Stands Practical information Transportation Accomodation Catering LPI exams BSDA exams Friday Beer Event Keysigning Press & Promotion Media Live Stream Speaker Interviews Videos Pictures Archives Wiki These pages have been archived. For information about the latest FOSDEM edition please check this url: http://fosdem.org If you see this message in your RSS reader, please correct your RSS link to the following URL: http://fosdem.org/rss.xml. Two weeks after FOSDEM and we are proud to publish most of the slides and videos from this year's edition. All of the material from the Lightning Talks has been put online. We are still missing some slides and videos from the Main Tracks but we are working hard on getting those completed too. We would like to thank our mirrors: HEAnet (IE) and Unixheads (US) for hosting our videos, and NamurLUG for quick recording and encoding. The videos from the Janson room were live-streamed during the event and are also online on the Linux Magazin site. We are having some synchronisation issues with Belnet (BE) at the moment. We're working to sort these out. If one of these things is yours, contact info@fosdem.org. Please keep in mind only valuable things will be sent back. The other items will be brought back at the next edition: FOSDEM 2009. Click the more button to see the list. To thank our donators, we had some nice packages provided by some of our sponsors to give away: magazine subscriptions, books, Nokia N810 devices and Sun Workstations ... and the winners are ... FOSDEM lives thanks to its visitors. Please tell us what you think about it and help us make it better. The online registration for LPI exams at FOSDEM has now been closed. If interested in having a LPIC-1/2/3 or Ubuntu certification at a discounted rate at FOSDEM, you may still apply on site. Every exam session lasts 1.5 hours with a break of 30min in between, which is the best moment to go to Guillissen (in the U building) and register. Note that the 1st session on Saturday is already fully booked."
