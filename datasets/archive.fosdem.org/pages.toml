["https://archive.fosdem.org/2023"]
title = "FOSDEM 2023 - Home"
full_description = "FOSDEM is a free event for software developers to meet, share ideas and collaborate. Every year, thousands of developers of free and open source software from all over the world gather at the event in Brussels. You don't need to register. Just turn up and join in! Navigate the schedule on this website or using one of the mobile apps. We have not printed schedule booklets this year although we still have general information booklets. There's a list of late amendments. Rooms with popular talks might fill up. When this happens, please don't queue outside or block the corridors. Watch the live stream on your device or select an alternative talk and catch up later by watching the video afterwards. We've scheduled over 350 hours of content this year. Watch sessions online and interact using matrix. Afterwards, videos will be uploaded and linked to the page for each talk. A few talks are happening only online. These are clearly indicated and are shown in rooms beginning with D for Digital. Please use the links under each event to provide feedback to the speakers. Send more general feedback - good as well as bad - to feedback@fosdem.org. With great pleasure (and an apology for missing the deadline by seven days), we can announce the following projects will have a stand at FOSDEM 2023 (4 & 5th of February). FOSDEM takes place at the ULB Solbosch Campus, Brussels, Belgium, Europe, Earth. If you aren't there, you may watch the live streams from the main tracks and developer rooms. Note that talks in rooms beginning with D are pre-recorded and only accessible online."
year_published = 2023
clearnet = "https://archive.fosdem.org/2023"
