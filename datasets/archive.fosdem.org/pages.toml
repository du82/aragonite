["https://archive.fosdem.org/2018"]
title = "FOSDEM 2018 - Home"
full_description = "Every year, thousands of developers of free and open source software from all over the world gather at the event in Brussels. Please tell us about your FOSDEM experience at feedback@fosdem.org. All your feedback and suggestions for next year will be greatly appreciated. You may also submit feedback on individual talks by following the link at the bottom of each event page in the schedule. Many videos are already available this year! You'll find them on the web pages for the individual talks when they are ready, or download them from video.fosdem.org or view our YouTube channel. Processing status. It's several months after FOSDEM by now, but our video transcoding infrastructure is still up and running, in order to deal with the long tail of videos with issues that was still outstanding. This will change next week. FOSDEMx is a small scale spin-off of FOSDEM, combining a workshop track geared towards students and anyone interested in the topic, with a main track for a broader audience. FOSDEMx 0 will take place on Thursday the 3rd of May 2018 at ULB Campus de la Plaine from 16:00 onward. This first edition will introduce attendees to the Python ecosystem."
year_published = 2018
