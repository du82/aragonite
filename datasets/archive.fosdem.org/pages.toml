["https://archive.fosdem.org/2022"]
title = "FOSDEM 2022 - Home"
full_description = "Every year, thousands of developers of free and open source software from all over the world gather at the event in Brussels. FOSDEM 2023 will take place on Saturday 4th and Sunday 5th of February 2023. We are aiming for a physical conference. We know that many of you are waiting on your FOSDEM T-shirt and hoodie. We finally have some news, but first we would like to apologize not only for not delivering your T-shirt in time, but also for not communicating or informing you of the status of your order. FOSDEM 2022, our second fully virtual conference, is only several hours away. Now would be an excellent time to check our full schedule and mark down all talks that interest you! To get a preview of how everything looks and works, visit our FOSDEM 2022 Matrix space and look around! You can also visit our virtual conference floor to see all the talks and stands."
