["https://archive.fosdem.org/2024"]
title = "FOSDEM 2024 - Home"
full_description = "FOSDEM is a free event for software developers to meet, share ideas and collaborate. Every year, thousands of developers of free and open source software from all over the world gather at the event in Brussels. You don't need to register. Just turn up and join in! We are adding a video of each talk to its web page when it is ready. See the processing status of individual talks. For everything available so far, look in the right-hand column of the complete schedule, or download from video.fosdem.org/2024 (arranged by room name). Please use the links under each event to provide feedback to the speakers. Send more general feedback to feedback@fosdem.org. All your feedback, good or bad, and suggestions for future years will be greatly appreciated. FOSDEM 2025 will take place on Saturday 1th and Sunday 2nd of February 2025. This will be our 25th anniversary. FOSDEM takes place at the ULB Solbosch Campus, Brussels, Belgium, Europe, Earth. If you aren't there, you may watch the live streams from the main tracks and developer rooms. Note that talks in rooms beginning with D are pre-recorded and only accessible online."
