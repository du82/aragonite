["https://archive.fosdem.org/2009"]
title = "FOSDEM | Free and Open Source Software Developers' European Meeting"
full_description = "Front page About FOSDEM Sponsors Donate Contact Schedule Printable schedule Grid Main Tracks DevRooms Lightning Talks All Speakers Stands Practical information Transportation Accomodation Catering LPI exams Friday Beer Event Keysigning Spouses Tour Press & Promotion Media Speaker Interviews Videos Pictures Archives These pages have been archived. For information about the latest FOSDEM edition please check this url: http://fosdem.org You might have noticed the videos are already online on our different mirrors. Round robin loadbalancing is performed using the following link: http://video.fosdem.org. From now on we also publish the videos on YouTube. Google upgraded our account so we can now upload videos without time-limitation. This means you can watch any video streamed and in one single part.Our official channel page is: http://youtube.com/fosdemtalks. FOSDEM was a success again, not in small part thanks to the efforts of the army of volunteers who helped us run things smoothly. Thank you all for your enthousiasm and your energy. We couldn't have managed without you. Working with you guys & gals was refreshing as always, and I hope we can do this again next year. But first, some hard needed rest! FOSDEM 2009 is over. We hope you enjoyed it and we are looking forward to seeing you again next year. Right now, rest is needed. The rooms of the Main Tracks are not correct in the booklet The website is correct, here's the correct information: Janson : Kernel Track (Syslinux, ext4, System slow) Chavanne : Collaboration (MediaWiki, Zarafa, CalDAV) Sorry for the inconvenience FOSDEM lives thanks to its visitors. Please tell us what you think about it and help us make it better. Feedback form closed. Thanks for all your input! We are now processing the comments. Like previous edition we are proud to announce companies will be able to inform you (our visitors) about job opportunities in open source or free software. The job corner will be around the end of the main hallway (H building). Read more to check the rules."
