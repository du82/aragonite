["https://archive.fosdem.org/2007"]
title = "FOSDEM | Free and Open Source Software Developers' European Meeting"
full_description = '''Front page About FOSDEM Sponsors Donate Contact Schedule Grid Tracks Main Tracks Lightning Talks Speakers Booths DevRooms Practical information Transportation Accomodation LPI exams Friday Beer Event Keysigning Press & Promotion Media Speaker Interviews Videos Pictures Archives Wiki The long awaited first batch of slides from the Main Track talks are available. You can find them at http://www.fosdem.org/2007/schedule/events under the header "Media". We will try to collect the missing slides as soon as possible. The winners will be contacted (around end of March) concerning their prize. Here you already have the pictures of the winners of a Sun Ultra-20 Workstation, and 2 x a Nokia N800 Click on the link below to see all the names. The video recordings are now all available at the following URL: http://fosdem.org/2007/media/video Further linking with other pages on the website (i.e. the schedule pages) will happen soon. FOSDEM 2007 is behind us and from the feedback we got it appears that it was a very nice edition. We've surely enjoyed it too and we'd like to thank all visitors, speakers, sponsors, contributors, donators -- basically everyone involved. You can already enjoy some of the main track presentations in the video section (Ogg Theora format), and the pictures have been trickling in as well (send us more either trough flickr or by emailing pics at fosdem dot org). If you have additional feedback for us, please enter it in our wiki. We have noticed that the FOSDEM entry on Wikipedia is severely out of date. Since we are too busy organizing the conference at the moment, we would like to ask you, dear visitor, to help out with updating the entry for us. If you happen to have five minutes between talks or in the hacker room, head over to Wikipedia and fix our entry! Thanks! For logistical reasons, the LPI exam registrations for FOSDEM have been closed. For last minute participation, contact Klaus Behrla (who runs and oversees the exam sessions) directly, in the exam room (Lameere).'''
