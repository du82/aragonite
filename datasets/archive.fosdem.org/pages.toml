["https://archive.fosdem.org/2019"]
title = "FOSDEM 2019 - Home"
full_description = "Every year, thousands of developers of free and open source software from all over the world gather at the event in Brussels. Please tell us about your FOSDEM experience at feedback@fosdem.org. All your feedback, good or bad, and suggestions for next year will be greatly appreciated. You may also submit feedback on individual talks by following the link at the bottom of each event page in the schedule. As we prepare for our 20th edition next year, we would also like to receive any interesting photos or stories you have of earlier years that you would be willing to share at the event. We'd also like to hear any interesting perspectives you can share about the impact of FOSDEM and changes within the domains of activity that were represented at the event during this period: memories@fosdem.org. We are adding videos of talks to the web pages for the individual talks when they are ready. To see everything available so far, look in the right-hand column of the complete schedule, download from video.fosdem.org/2019 or view our YouTube channel. With only one week left until FOSDEM 2019, we have added some new interviews with our main track and keynote speakers, varying from a keynote talk about the dangers of the cloud to the use of Matrix in the French state and the inner workings of the ZFS Adaptive Replacement Cache: As of the end of 2018, the ULB campus Solbosch is located within the Brussels Low Emission Zone (LEZ). Drivers of cars registered abroad are required to register before entering the LEZ, or risk being fined. Registration is free of charge."
