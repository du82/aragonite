["https://archive.gyford.com/2018/01/08/www.gyford.com/phil/about"]
title = "About me (Phil Gyford’s website)"
full_description = "I live in London, UK. I mostly make things on the internet. I have also spent a lot of time learning to act, but haven’t done much actual acting. In the past I learned to be a futurist in Houston, Texas, worked briefly as a modelmaker for animation, attempted to be a freelance illustrator, and studied graphic design at university in Bristol. I grew up in Witham, Essex. Creative Technologist at Berg, developing new sites and services, creating tools for developers, a little bit of delivery management (2013-14). Several other personal online projects such as Twelescreen, Today’s Guardian, Crazy Walls and Our Incredible Journey."
