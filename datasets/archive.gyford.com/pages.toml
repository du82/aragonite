["https://archive.gyford.com/2000/atbyrio.port5.com"]
title = "...and the 'blog' you rode in on"
description = "The good, the bad and the very, very ugly of weblogs."
full_description = '''Sunday, June 25, 2000 Oh, Paul... you showed such promise, and gave us such promises. But you've been talking pretty tough for someone whose site's been nigh-on empty for the past month and a half. Enough of this transitional bullshit, get back to producing stuff we might actually want to read. Yours, a decreasingly loyal audience. [Chris Carp] I thought clicking the links on our own weblog might yield return traffic in this incestuous and obsessive world. Little did I imagine it would be a mere two days before someone examined their logs and peeked at our new-born site. Maybe our lack of interest in Mr Anderson's life and our yearning for hard genetic facts clouded our judgement a tad (although given the site's title we also yearn for a transglobal Trade Descriptions Act). However, we're horrified at the thought someone imagines we're attempting to surpass the achievements of Bloat, a site that served its cosy demographic all too well. And while Robot Wisdom has covered its author's personal life on various occasions they were frequently eccentric and enlightening projects. Our knowledge of this shallow little world is all too deep, believe us (and this is not, we know, something to be proud of). [Steven Sturgeon] Friday, June 23, 2000 Our cochleas had barely recovered from the Ben Brown song when I'm sorry to say I found the Blog Song. Insane masochists try to rescue such trash with a laugh ("it's so bad it's good!") but this drone is far beyond the reach of kitsch's lifebelt. Being young is no excuse, even if you have won an award no one has heard of. [Steven Sturgeon] BoyCaught doesn't like those "half-hearted" souls who use Blogger for something more than "links and short comments". Good job really, since his own half-arsed effort is as derivative as it can get. There's a better tool for producing something that dull and ugly: it's called bookmarks.html. [Geraldine Gudgeon] All it takes is one person to pay 25 cents to all her favourite people and suddenly everyone is talking about nothing else. Personally I'd only use PayPal if I could ensure the recipients never published again. That would be micropayments well spent. [Steven Sturgeon]'''
