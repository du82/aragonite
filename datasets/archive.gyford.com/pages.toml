["https://archive.gyford.com/2013/03/25/www.septivium.com"]
title = "Septivium - Learn about everything"
full_description = "Over on The Online Photographer the host Mike Johnston recently wrote about a list of books he’s been compiling for some time: The list started when my son decided at age ten or 11 that he didn’t like to read. As an inveterate reader and bibliophile, this consternated me deeply—how do you learn about the world if you don’t read? Books are where you find most of what humans know, and have learned, and have thought; they are where, mostly, the great glorious life of the mind resides. So, taking a cue from our epic read-aloud traversal of the Harry Potter series when my fine lad was in single digits, I got a bright idea. I figured I’d just pick a bunch of the best books I know for finding out about the world, and read them aloud to him. Who says you can only read aloud to little kids? I had started thinking about which books would be worth reading aloud to him…and by extension which books would be worth reading if you could only read a few… …Think about it; they had to be comprehensible to a teenager, they had to be interesting and fun to read, but I wanted them to contain some education, too—some wisdom and useful information—some measure of truth about humans and our lives in the world. My idea was, if they end up fated to be the only books he ever reads, which ones should those be? Although Mike doesn’t share his list with us (currently at 266 titles, it’s not yet finished) the post is a pleasantly interesting ramble around the idea of what such a list means. And focusing on books that are to be read aloud is also a novel twist. Over at Cool Tools, they’re running a competition to find the most useful books about particular activities. From an earlier post: Help us fortify our library of useful books by submitting your favorite text for a particular subject including an explanation of why you think it’s essential. We want to feature that dog-eared book that you wouldn’t lend to a friend for fear you wouldn’t get it back. It can be the best beginner’s guide, or a slightly more advanced technical manual detailing materials or techniques. If you can, please include scans of pages that we can use to illustrate the book’s content. This has been done before but never with any insight or explanation of what makes the book useful or cool."
