title = "Overmorgen"
full_description = "Bye for now By Phil Gyford on 15 April 2009, 6:42 pm I’m going to stop posting things here. When I started up again a few months ago I had a fair amount of free time but I’ve realised I can’t keep it up. Although I’m still interested in all this stuff I don’t have the time to run a decent blog dedicated to it. These days there are plenty of better ones. And, not only is it annoying (for me) to have a blog that limps along, it’s harder to write for — the longer I go without posting, the more worthwhile the next post needs to be (or so it feels). So I’ll close the site for the moment, once again. Some things I write on my personal website might be related but it may not be worth following that if you’re purely interested in futures stuff. However, I’m going to try storing links to interesting future-y things in my Delicious account, tagged with ‘overlinks’ (RSS feed). So keep an eye on that. We’ll see how it goes. If it turns out I save plenty of interesting stuff I may pump it through to Overmorgen. So, bye for now. Categories: Misc Tags: housekeeping Master of Design in Strategic Foresight and Innovation By Phil Gyford on 7 April 2009, 6:23 pm I’m not clear whether this is new or not but, via the Futures weblog, the Ontario College of Art and Design offers a Master of Design in Strategic Foresight and Innovation: The Master of Design in Strategic Foresight and Innovation integrates knowledge and methodology from a number of disciplines: design, business, science and technology, and the social sciences. Design provides the crucial link between these areas, drawing on its essential competencies of design thinking, strategic and iterative methodology, and a deep commitment to understanding human needs, wants and behaviour. Through holistic thinking in a co-creative environment, the designer, the business person, the social scientist and the engineer will develop together the skills required for true socio-technological innovation. The course is two years, part time, and it sounds like at least some of the classes are in the evening, much like I assume the descendent of the course I did in Houston still is. (It’s now clumsily called the Master of Technology in Futures Studies in Commerce.) Anyway, it’s interesting to find another futures course, particularly one angled toward design. Categories: News Tags: canada, courses, degree, design, education, masters, ocad, ontario Wrong Tomorrow By Phil Gyford on 1 April 2009, 5:59 pm It’s getting linked to from many places today but that’s no reason not to mention it here… Wrong Tomorrow is a site on which you can record the predictions made by pundits about the future in order to look back and see which came true. It looks like a handy way to puncture the certainty attention-grabbing folk make. As I’ve probably said several times here, futurists in the sense that I think of them don’t make predictions like this because we know such predictions are worthless — the future is always too uncertain. The site’s author, Maciej Ceglowski, describes the reasoning behind creating the site on his weblog. Good stuff. Categories: Misc Tags: maciej ceglowski, predictions ETech 09: The Real Time City By Phil Gyford on 13 March 2009, 6:12 pm Andrea Vaccari, from Senseable City Lab, MIT, late on Wednesday aftenroon at ETech 09. Massive amounts of data about people and cities are available these days which will help us to see how cities are used. Once we thought that technology would make cities obsolete — distance working — but we’re seeing the opposite. New York Talk Exchange. Visualisation to show how New York is connected to places around the world. She shows another visualisation growing/shrinking countries on a world map depending on the amount of telephone traffic between countries. One more: something about how different regions of New York are connected to other parts of the world. WikiCity. Real Time Rome — Visualiation of activities in the city, cellphones, buses, etc. A map of cellphone activity in Rome around the World Cup Final. Obama — One People (Probably launching on Monday). Showing phone activity around the inauguration. The World’s Eyes — Showing Flickr photos, taken when and where and by who. eg, photos by Britons tagged with “party” in a particular area. Using geotags on Flickr photos to plot peoples’ movements around Spain. Digital Water Pavilion — Can reconfigure the spaces of the building by switching the water walls on and off, and use the walls as a new medium to display patterns and messages. Tracing the Visitor’s Eye — With Flickr photos again, tracking where tourists go and what they take photos of. See what things interest tourists, something we could never have done before. PlaceRank Is this the correct URL? — When you move while on the phone your call is moved from one cell to another. They analysed this data [in some unspecified way] to determine which locations are more popular, analagous to Google PageRank. Raster Cities — Looking at 3D buildings. Shadow casting, seeing where their shadows are. How tall can a building be to enable a minimum amount of light. How much can be seen from a building. MIT Enernet [?] — Seeing how people fill the space of a building at different times of the day. CurrentCity — Amsterdam. To help police monitor emergencies and major events by analysing cellphone activity. You can get a baseline of normal activity across the city and then unusual events stand out. Categories: Technological Tags: andrea vaccari, cellphones, cities, etech, etech09, visualisations ETech 09: Frameworks for Spatial Mediation By Phil Gyford on 13 March 2009, 5:49 pm Ben Cerveny, “The New ‘Situation’: Frameworks for Spatial Mediation” on Wednesday afternoon at ETech 09. There were various chunks of this that I failed to note, so these notes are a bit more broken than usual. Systems for Urban Scale Interactions. The software for the built environment of humans has existed for thousands of years — that’s what civilization is. We’ve formalised a vocabulary for social interactions. Gone from defining computing as social, to social objects, and now defining environments as social. Massively multiparticipant models. Some people now understand how to interact with each other in the spaces of MMORPGs, spaces which are becoming increasingly actualised in our everyday lives. With MOOs people were being empowered to be creative and create objects and environments, creators of their narrative experiences. They began to build out larger worlds, a long tail explosion of user-generated content. We move on to Game Neverending which became Flickr. The design of the original game was about discovering new areas. Players would have to come together to decide how to provision that space, how to govern it, etc. There’s the What of the space, and the Who of the space, the politics of it. Playground Foundation [Can’t find a URL]. The mandate was to aggregate data about Amsterdam into a platform accessible by everyone so that people could access information about the city. A model that curated about the city by its own residents. A collaboratively constructed representation of the city that, in a way, floats above it. To provide an information infrastructure in the same way the government provides a transportation infrastructure. Area/code’s Crossroads game. People running around streets to get away from a thing they can only see on their phone. AFK. Wovenspace. [Can’t find URLs for these either.] Building amusement park(s) in Dubai. Building an amusement park that’s “alive”. What does it mean if we have a higher resolution understanding in the park? If we have a higher resolution model based on sensors and can make changes based on this information. On the smaller scale, handheld devices that communicate with the network. Then small devices in the architecture configured to be input or output nodes. Mix and match sensors and actuators. All of this creates a realtime model of urban scale space and activate things based on this information. Architectural adjustments, changes to handheld devices, etc. In order to occupy a space that has these capabilties you need to trust the space and the people who are participating in it. The first problem that needs to be solved in rolling these capabilities out to urban environments is a social/political one, of whether you trust the control of these technologies. Online there’s always a problem with how privacy is handled, eg, Facebook and privacy. Like Facebook (but unlike an urban environment) somewhere like an amusement park is opt-in. If you trust the park to keep you safe on a roller coaster you’ll probably trust them to track you around the park. [Missed a bunch of stuff at the end as I was a bit dazed by everything.] Categories: Technological Tags: amusement parks, ben cerveny, etech, etech09, games, gaming, privacy ETech 09: Networks from mobile phone data By Phil Gyford on 12 March 2009, 4:29 pm Tony Jebara from Columbia University and Sense Networks, “Mobile Phones Reveal the Behavior of Places and People” on Wednesday morning at ETech 09. [Missed a few minutes.] Stuff about making social networks in Facebook etc. How do we capture these networks in the real world? Sense networks using data from iPhones, TomTom, cellphones, etc. Lots of data being collected all the time. They monitored people who commuted into the San Francisco financial district. A correlation [looked very small] between how early people arrived at work and the state of the Dow Jones. Monitored the hours people go out in the evening. Again a correlation with the Dow Jones [couldn’t understand the graph at a glance so not sure how much there was]. CitySense.com — real-time density of users at every street corner. Poisson models find the most active bars and restaurants. Gives you a “sixth sense” of where people are in the city. So you can see if lots of people are gathering somewhere. [Oh, only in San Francisco.] What’s next? Filter it for where people like you are. Different colours for different types of people, a heat map of “where’s my crowd?” They currently have 20 different tribes. Colour bars at the top of the screen indicate which tribe you belong to most at the moment, changing over time depending on your behaviour. They build a network of people from location data. Like Facebook’s network of people but without the self-reporting. You’re connected to someone because you’re co-located with them. And building links with people who hang out in similar kinds of places, eg, two people who visit Starbucks in two different cities at similar times of day have a connection. The only data they have are GPS tracks for people. They need to translate the raw latitude and longitude into semantic data; what does it mean to be in a particular location at a particular time. They build a network of places, identifying similar places no matter where they are. To identify this similarity they use three kinds of information: the commercial and demographic activity (using government databases), plus flow analysis. Flow analysis data: If several people arrive in two places from similar sources and then leave to go to similar destinations, this indicates similarity between the two places. So you can tell that two bars in different parts of the city are probably the same kind of place as they attract people who go from and to similar locations. Commerce data: Standard Industrial Categorization (SIC) Code. Assigns a number to a building depending on its commercial use. To work out the profile of an individual they analyse the Flow, SIC and demographic data for the places they go. He shows a table with rows for hours (168 for every hour of the week), and columns of different flow, SIC and demographic types. The table cells show the percentage chance of a person being in a particular column in a particular hour of the week. At this point in the process the GPS data is thrown away. The matrix is adjusted over time as the user changes their behaviour. They only store the current matrix for a person. People can be connected by their similar behaviours. Uses: Churn — eg, a mobile phone company sees one person has left their network, they might then promote themselves to connected people to stop them leaving too. Advertising — Marketing — Collaborative Filtering — Demogrpahics — If people go to car dealerships often enough they can be identified as potential purchasers. These people can be broken down into high or low-end car purchasers depending on which dealerships they go. [This is all starting to sound a bit evil, rather than fun.] They get very good predictions of how someone will respond to ads. [I think that was right.] [For all that stuff about how anonymised the data is earlier on, it sounds like if they have a client that’s say a phone company, they are able to tell the phone company about an individual’s behaviour. Which, of course, the phone company need to to provide a useful service to their clients, but it does sound rather evil (or “commercial”, depending on your point of view).] One example of a less “depressing” application (in response to a question): if you go to a new city they could recommend places you would like, rather than just recommending exactly the same places to everyone. They claim around four million users. Categories: Technological Tags: advertising, cellphones, etech, etech09, mobile phones, networks, tony jebara ETech 09: Art with Lasers, Sensors and the Net By Phil Gyford on 12 March 2009, 4:18 pm Aaron Koblin, “Making Art with Lasers, Sensors, and the Net” on Wednesday morning at ETech 09. A lot of this was just showing us cool stuff, so there’s not many notes to take, but still… Shows visualisations of flight patterns. Work with NYTE showing flow of data round the world. Population types in Manhattan. Quantity of SMS messages sent around Amsterdam. Having people on Amazon’s Mechanical Turk draw thousands of sheep or parts of a $100 bill. Radiohead video using a rotating laser device. It spins and records where the lasers hit as a 3D space that can be manipulated live. Google Code page — all the video data is released to play with. Things he’s learned: Looking at something ordinary in a new way can make it interesting. Combining multiple visualisation techniques. Think about the data, not “the real world.” Don’t get hung up on what you think it “should” look like. You don’t have to use all the data. Let your data free. More than 100,000 downloads of the Radiohead data. Work with Radiohead. His new project is Bicycle built for Two Thousand, again using Mechanical Turk. Had people record themselves imitating a single sound from the song, out of context. These were then put together to create an aggregated version of the song. [He seems surprised that the aggregate song sounds intelligible, and that the $100 bill looks like a $100 bill. But I’d have been surprised if they weren’t. Isn’t this what you’d expect from averaging out many things? But still, t"
