["https://archive.gyford.com/2018/01/08/www.gyford.com/phil/comments"]
title = "Comments written on other sites (Phil Gyford’s website)"
full_description = "Ah, yes, council wards would make sense, good thinking. Knowing nothing about a place you’d think they would be good names to use to refer to areas. Apart from no one using them. Maybe that year listening report URL will work tomorrow… maybe “Last year” means 2017’s visuals won’t show until 2018? We’ll have to wait and see. I’ve done a lot of acting classes in London over the years and while many have been good, those at the Salon Collective are my favourite, and I keep going back. I completed the Stage 1, 2 and 3 Meisner Technique training and benefited hugely from the perceptive, kind and challenging teaching. The other students are committed and talented and it’s always a pleasure to return to more Drop-In classes or regular classes and see familiar and new faces ready to enjoy working. https://medium.com/@tomwhitwell/52-things-i-learned-in-2014-91fb546741cc https://medium.com/fluxx-studio-notes/52-things-i-learned-in-2015-c5c74eed24e0 https://medium.com/fluxx-studio-notes/52-things-i-learned-in-2016-299fd1e6a62b “For instance, isn’t it true that Kanye West can neither play any traditional instruments nor sing? And Jeff Koons has apprentices actually make his sculptures.” I’m not sure these examples help your point… A lot of popular music hasn’t relied on instrument or voice skill for, what, 30 years, give or take? Someone can make great, and successful, popular music using other skills; they’re still skills. And the same for contemporary art - the named artist might be a great draughtsperson but could still create brilliant art without demonstrating that. Neither West or Koons are unskilled, untrained amateurs in their field in the way a complete non-photographer snapping with their iPhone is. Sorry if I sound a little ignorant but, as an outsider, I’m not entirely sure what you mean when you say “GOV.UK content”. “GOV.UK” to me means “all government websites”. So is this an API that will encompass the Met Office, HMRC, TfL, etc? Or, does “GOV.UK” mean something more specific to you that isn’t entirely clear to me?"
