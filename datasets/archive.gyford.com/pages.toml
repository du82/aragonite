["https://archive.gyford.com/2018/01/08/www.gyford.com/phil/about/work"]
title = "About my work (Phil Gyford’s website)"
full_description = "I’ve been planning, designing, editing and programming great websites since 1995. On the front end I aim for responsive and accessible HTML, CSS/Sass and JavaScript, including some D3.js. On the back end I usually use Python (mainly Django, sometimes Flask), occasionally PHP and, inevitably, WordPress. I am available to work on a freelance basis, so if you have an interesting project please do email me. With Good, Form & Spectacle for the Museum of Modern Art, exploring 60 years of exhibition data, built using Django and D3.js. Learn more… With Good, Form & Spectacle for the British Museum, a Sinatra-based site bringing a unique collection to the screen. Learn more… From 2014-15 I was at Citizens Advice, developing prototypes of new digital services and content using PHP (Laravel), JavaScript and Sass. Before I began freelancing I worked in a range of capacities at companies such as Wired magazine (Alpha Geek), Capital Radio (Deputy Editor) and UpMyStreet.com (Creative Technologist). I have also created and run several personal projects such as The Diary of Samuel Pepys, Twelescreen, Today’s Guardian, Our Incredible Journey, Crazy Walls, Pretend Office, Septivium, Overmorgen and Haddock."
