["https://archive.gyford.com/2005/05/19/www.overmorgen.com"]
title = "Overmorgen"
description = "A weblog focussing on the medium- to long-term future. Trends, events, forecasting, scenarios and futurist resources."
full_description = '''Anyone following this weblog will know that it's been sporadic at best for a long time. It seems sensible to make it officially dead, rather than occasionally trickle a couple of posts in every few months. So there'll be no more posts here for the foreseeable future. Even though I rarely post anything here, I feel that I should every time I happen across something vaguely future-oriented elsewhere. But reposting things friends have found and posted to their sites doesn't make for a worthwhile weblog, and I'd prefer to relieve myself of that nagging obligation. Keeping a topic-specific weblog going is a lot more work than a personal weblog in my experience -- research takes more time and there's more of a pressure to maintain a standard for one's peers. I can't hope to devote the time to this. Also, these days, there are far more sites posting futures stuff than when I started the site, so it's not hard for people to find interesting things elsewhere. Maybe Overmorgen well get going again someday, but for now it's definitely closed. The archives will stay as they are. I've switched off the ability to post comments on this site -- there's not much happening here these days and I spend far more time deleting spam comments than I do researching and writing stuff to post. (Yes, even with MT-Blacklist installed, it's not worth the trouble to allow comments.) If, unlike me, you've been keeping up with this stuff, this probably isn't news. But if you're like me then this is quite "wow, this could be cool...": A demonstration of augmented reality computer graphics, laying computer-generated imagery over views of the real world. There's another demo available here. I didn't quite realise it had come so far. I can't wait to see what the games industry does with it in the real world. One day. (via Haddock I think.) I don't think I've seen this before: The Long Now Foundation has a series of lectures available free for download on a variety of, long-term issues (they suggest you umake a donation if you like them).'''
