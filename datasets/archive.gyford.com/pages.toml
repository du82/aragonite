title = "Whit Stillman | The unofficial website about the director"
full_description = "← Older posts The New Yorker Movie of the Week: ‘Barcelona’ Posted on 7 August 2014 by Eric Burritt Richard Brody at the The New Yorker has picked Whit Stillman’s Barcelona for the movie of the week. And that’s why “Barcelona” is a comedy, and why the romance that drives it is so subtle and so complex. Stillman’s current project is a pilot for a Web series set, once more, among American expatriates, this time in Paris; it’s called “The Cosmopolitans,” and I’m jumping out of my skin with impatience to see it. Posted in News | Tagged Barcelona, Chris Eigeman, Mira Sorvino, Richard Brody, Taylor Nichols, The New Yorker | Leave a comment Subarashii! Whit Stillman ホイット・スティルマン Posters & Flyers From Japan Posted on 28 July 2014 by Eric Burritt 一番! Please enjoy these Whit Stillman posters, flyers & VHS covers from Japan: Posted in News | Tagged Barcelona, Japan, Japanese, Metropolitan, The Last Days of Disco, ホイット・スティルマン | Comments Off METROPOLITAN à Paris: Derniers Jours Avant le Cinéma Ferme Pour les Vacances Août Posted on 27 July 2014 by Eric Burritt METROPOLITAN à Paris: derniers jours avant le cinéma ferme pour les vacances Août. Séances proches de Paris Posted in News | Tagged A3, cinema, Metropolitan, séances proches de Paris | Comments Off Whit Stillman’s Novel ‘The Last Days of Disco’ is one of Vogue’s Summer Page-Turners Posted on 27 July 2014 by Eric Burritt Whit Stillman’s award winning novel: The Last Days of Disco, With Cocktails at Petrossian Afterwards (in Francais: Les Derniers Jours Du Disco) is on Vogue’s summer page-turners. Whit Stillman : The Last Days of Disco (Tristram) Having just made the film, starring Chloë Sévigny, director Whit Stillman adapted his screenplay into a book. The Last Days of Disco follows a group of young people in the early 1980s at the Club in Manhattan, an alter ego of Studio 54. With intertwining love lives and existential doubts, Whit Stillman‘s portrays a changing time when disco symbolizes the innocence of a city and a new generation that will soon be lost. A gripping book, both as funny as it is melancholy By Nelly Kaprièlian, translated by Ruby Norris and Isabelle Granger Posted in News | Tagged book, Les Derniers Jours Du Disco, magazine, novel, reading, summer reading, The Last Days of Disco, Vogue, With Cocktails at Petrossian Afterwards | Comments Off Whit Stillman’s Amazon Show ‘The Cosmopolitans’ is Coming Soon Posted on 23 July 2014 by Eric Burritt Whit Stillman’s Amazon Show, The Cosmopolitans is coming soon. No news yet on an exact date, but it is scheduled to premiere later in August. Before it comes out you can check out this FAQ page on what is known about the show. Photo of Adam Brody, Chloe Sevigny & Adriano Giannini From: @WhitStillman Posted in News | Tagged #thecosmopolitans, Adam Brody, Adriano Giannini, Amazon, Amazon Studios, Carrie MacLemore, Chloe Sevigny, Dree Hemingway, The Cosmopolitans | Comments Off ← Older posts"
