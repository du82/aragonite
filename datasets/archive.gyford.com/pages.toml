["https://archive.gyford.com/2001/04/01/www.overmorgen.com"]
title = "Overmorgen"
full_description = '''Tuesday2001-03-13 Environmental futures research grants available The National Center for Environmental Research is looking for grant applications for futures-related work. Lots of money for educational and non-profits apparently available for futures research in Natural Sciences and Socio-Economics.Found via Haddock. Monday2001-03-05 Future Feed Forward I've been meaning to post this for months. A series of news stories from the distant future which you can also have sent via email. Usually funny, cynical and thought-provoking jabs at the way society could be progressingFound via Nettime. The future of the information revolution A RAND report on the Net twenty years out, and particularly America's place within it: "American ideals, with modest refinements, would write the constitution of a global civil society, even as the American state itself would lose its primacy." Found via Telecom-Cities. Friday2001-02-02 Past visions of the future A brief look at past visions of the future that never quite happened: The House of Tomorrow, The Dymaxion Car, The City of the Future, The Lustron and The House of the Future.Found via Telecom-Cities. Sunday2001-01-14 What is IT? Everyone whose fingers have been near a keyboard this week seems to have asked this question, so I post this merely for the sake of completeness. IT is a mystery new invention that will apparently change the world, although no one but a select few knows what it is. Dean Kamen, the inventor, has previously designed a revolutionary wheelchair and has filed patents for personal vehicles. Global Trends 2015 Subtitled "A Dialogue About the Future With Nongovernment Experts" this is the USA's National Intelligence Council's look at what the world may be like in 2015, and the role of the United States within it. One criticism could be that its real purpose is merely to justify budget increases for the agencies concerned. Saturday2000-12-30 Arthur C. Clarke looks ahead 1000 years The author looks at a few potential wildcards, why we should be exploring space, and more.'''
