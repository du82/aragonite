title = "Phil Gyford’s website"
full_description = "Flickr and Getty Images, the stock photography giant, are launching a new scheme which enables people to market some of their Flickr photos as stock photography through Getty. I’ve no idea how new it is — the selection of some of my photos as candidates is the first I’ve heard of it — but it’s not launched properly yet (the help says “early next year” which I’m guessing means 2009). There are lots of interesting things about this arrangement: The struggling stock photography industry attempting to make money from sources that threaten it; The co-opting of net-enabled amateur photographers into the established method of monetising photographs; The development of activities people used to do just for fun, as hobbies, into semi-professional pastimes. All that kind of thing. But what immediately struck me was the incompatibility of Creative Commons licenses with the new scheme. If you have a photo accepted for the Flickr/Getty library and it’s CC-licensed it will automatically be changed to “All Rights Reserved”. This is understandable for CC licenses that allow for free commercial use — Getty will struggle to sell a photo that is also free for any use. But it’s a great shame that I can’t have a photo licensed as free to use on a non-commercial basis and have it for sale on Getty. But my feedback would be that it’s a shame photos can’t still be licensed as Creative Commons. I’d be happy to take part and allow my photos to be up for sale so long as they can still be used for free on a non-commercial basis, as they are at the moment. I don’t take photos to make money out of them and I’m just pleased whenever anyone wants to use them, whether they pay or not. I realise that for others photography is a full or part-time business and this conflict won’t be an issue for them. But it’s a shame there’s no flexibility — allow a photo to be featured on Getty, purchasable by those who are able to pay for commercial use, but still CC licensed for free use by non-commercial concerns. From my point of view that’s not a conflict."
