title = "UCI Machine Learning Repository"
description = "Discover datasets around the world!"
full_description = "Privacy Notice This privacy notice explains what information we collect through your use of the UCI Machine Learning Repository and how we use that information. By using the UCI Machine Learning Repository, you acknowledge and accept that these are the privacy practices governing the UCI Machine Learning Repository. General The UCI Machine Learning Repository website is made available to you to provide access to our collection of datasets. You can browse our site or download datasets without providing any personal information such as your name, mailing address, email address, phone number, or social security number. Non-Personal Information When you access and use our website, some information is automatically collected. For example, we may collect information about your computer’s operating system, Internet Protocol (IP) address, access times, browser type and language, and the website that referred you to us. We also collect information about your usage and activity on our site. Cookies When you visit our web sites, you may be issued a “cookie,” which helps track your session while online. Cookies are small data files stored on your hard drive. Among other things, cookies help to make your site visit more relevant and personalized for you. We use cookies to see which areas and features are popular and to count visits to our sites. Most browsers are initially set to accept cookies. If you would prefer, you may set your browser to refuse cookies or alert you when cookies are being sent; however, it is possible that some parts of our sites will not function properly if you do so. Web Beacons Web sites and any communications sent by UCI may contain electronic images (generally, single pixel “.gif” images) called “web beacons.” These web beacons allow UCI and third parties authorized by UCI to monitor and collect certain information about the viewer of a web page, email message or other communication, such as the type of browser requesting the web beacon, the device identifier of the device the web beacon is sent to and the time the web beacon was viewed. Web beacons may be used to count unique users, visits and page views; monitor traffic and conversion patterns; personalize your experience when you visit the sites, including advertising and content you see; and determine whether or not messages were opened, links were clicked and/or notifications/offers were acted upon. Third-Party Advertising We may also allow third parties to use cookies or other tracking technologies to collect non-personal information about your use of our sites, including your IP address, pages viewed, and conversion information. This information may be used, among other things, to deliver advertising targeted to your interests and to better understand the usage and visitation of our sites and other sites tracked by these third parties. This privacy notice does not apply to, and we are not responsible for, third-party cookies or other tracking technologies. We encourage you to check the privacy policies of advertisers and/or ad services to learn more about their privacy practices. If you would like more information about third-party advertising or to opt out of having your information used in this way, please visit theNAI Consumer Opt-Out Tool. Heat Maps UCI sites may utilize heat map technology services in order to better understand our users’ needs and to optimize the user experience of our websites. These services help us understand what elements users view and engage with on UCI web pages by observing behavior such as what a user clicks on and how far down a page a user scrolls. These services may also collect non-personal and device information and described in Non-Personal Information. Google Analytics We also use Google Analytics to collect data on how users are using the UCI Machine Learning Repository. Please see the following resources from Google for information on how Google handles these data: Privacy Policy Terms of Use How Google uses information from sites or apps that use its services Personal Information We also collect personal information that you voluntarily provide to us when you sign up for an account with the UCI Machine Learning Repository. We collect your first name, last name, email address, and (optionally) institution, and institutional address. We use this information to attribute donated datasets and submitted edits to users. Links to Other Sites You may encounter links to web pages of entities not managed or maintained by the UCI Machine Learning Repository. Those web pages may have privacy policies that differ from this one. You also may encounter links to websites of organizations not directly affiliated with the University of California, Irvine. Please be aware that the University of California, Irvine is not responsible for the information practices of external organizations. We recommend you review the privacy statements of each web page that collects personal information. Updating Personal Information Questions regarding your options to review, modify, or delete previously provided personal information should be directed to ml-repository@ics.uci.edu. Changes to this Privacy Notice The UCI Machine Learning Repository may revise this privacy notice at its sole discretion. Please check this page regularly for our current practices. If you have any questions about this privacy notice, the practices of this site, or your dealings with this site, you can contact ml-repository@ics.uci.edu."
