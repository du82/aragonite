["https://archive.ics.uci.edu"]
title = "UCI Machine Learning Repository"
description = "Discover datasets around the world!"
full_description = 'Welcome to the UC Irvine Machine Learning Repository We currently maintain 674 datasets as a service to the machine learning community. Here, you can donate and find datasets used by millions of people all around the world! View Datasets Contribute a Dataset Popular Datasets Iris A small classic dataset from Fisher, 1936. One of the earliest known datasets used for evaluating classification methods. Classification 150 Instances 4 Features Heart Disease 4 databases: Cleveland, Hungary, Switzerland, and the VA Long Beach Classification 303 Instances 13 Features Wine Quality Two datasets are included, related to red and white vinho verde wine samples, from the north of Portugal. The goal is to model wine quality based on physicochemical tests (see [Cortez et al., 2009], http://www3.dsi.uminho.pt/pcortez/wine/). Classification, Regression 4.9K Instances 12 Features Breast Cancer Wisconsin (Diagnostic) Diagnostic Wisconsin Breast Cancer Database. Classification 569 Instances 30 Features Adult Predict whether annual income of an individual exceeds $50K/yr based on census data. Also known as "Census Income" dataset. Classification 48.84K Instances 14 Features Bank Marketing The data is related with direct marketing campaigns (phone calls) of a Portuguese banking institution. The classification goal is to predict if the client will subscribe a term deposit (variable y). Classification 45.21K Instances 17 Features See More Popular Datasets New Datasets Lattice-physics (PWR fuel assembly neutronics simulation results) This dataset encompasses lattice-physics parameters—the infinite multiplication factor (k-inf) and the pin power peaking factor (PPPF)—modeled as functions of variations in fuel pin enrichments for the NuScale US600 fuel assembly type C-01 (NFAC-01) [NuScale FSAR]. These critical parameters were computed using the MCNP6 code, a Monte Carlo-based tool for nuclear reactor criticality simulations. Fuel pin enrichments were uniformly sampled within the range of 0.7–5.0 weight percent (w/o) U-235 to generate the dataset. The dataset contains 39 features, each representing the enrichment of a specific fuel rod in a one-eighth symmetry of the NFAC assembly. The outputs of interest are the k-inf and PPPF values associated with these enrichments. Regression 24K Instances 39 Features Gas sensor array low-concentration This dataset contains 6 gas responses collected by a sensor array consisting of 10 metal oxide semiconductor sensors, with gas concentrations at the ppb level (below the minimum detection limit of the sensors) Classification, Regression, Clustering 90 Instances 0 Features Twitter Geospatial Data Seven days of geo-tagged Tweet data from the United States with exact GPS location and timestamp. Classification, Regression, Clustering 14.26M Instances 4 Features CAN-MIRGU A Comprehensive CAN Bus Attack Dataset from Moving Vehicles for Intrusion Detection System Evaluation This dataset includes CAN bus attacks collected from a modern automobile equipped with autonomous driving capabilities, operating in real-world driving scenarios. The dataset encompasses physically verified attacks to enhance the comparison and validation of in-vehicle network Intrusion Detection Systems. Classification 48 Instances 0 Features Assessing Mathematics Learning in Higher Education MathE is a mathematical platform developed under the MathE project (mathe.pixel-online.org). The dataset has 9546 answers to questions in the Mathematical topics taught in higher education. The file has eight features, named: Student ID, Student Country, Question ID, Type of answer (correct or incorrect), Question level (basic or advanced), Math Topic, Math Subtopic, and Question Keywords. The question level was associated with the professor who submitted the question. The data was obtained from February 2019 until December 2023. Classification, Regression, Clustering 9.55K Instances 8 Features Turkish Crowdfunding Startups This dataset contains data on crowdfunding campaigns in Turkey. The dataset includes various characteristics such as crowdfunding projects, project descriptions, targeted and raised funds, campaign durations, and number of backers. Collected in 2022, this dataset provides a valuable resource for researchers who want to understand and analyze the crowdfunding ecosystem in Turkey. In total, there are data from more than 1500 projects on 6 different platforms. The dataset is particularly useful for training natural language processing (NLP) and machine learning models. This dataset is an important reference point for studies on the characteristics of successful crowdfunding campaigns and provides comprehensive information for entrepreneurs, investors and researchers in Turkey. Classification, Regression, Clustering 1.63K Instances 37 Features See More New Datasets'
