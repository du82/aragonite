full_description = 'Iris Donated on 6/30/1988 A small classic dataset from Fisher, 1936. One of the earliest known datasets used for evaluating classification methods. Dataset Characteristics Tabular Subject Area Biology Associated Tasks Classification Feature Type Real # Instances 150 # Features 4 Dataset Information What do the instances in this dataset represent? Each instance is a plant Additional Information This is one of the earliest datasets used in the literature on classification methods and widely used in statistics and machine learning. The data set contains 3 classes of 50 instances each, where each class refers to a type of iris plant. One class is linearly separable from the other 2; the latter are not linearly separable from each other. Predicted attribute: class of iris plant. This is an exceedingly simple domain. This data differs from the data presented in Fishers article (identified by Steve Chadwick, spchadwick@espeedaz.net ). The 35th sample should be: 4.9,3.1,1.5,0.2,"Iris-setosa" where the error is in the fourth feature. The 38th sample: 4.9,3.6,1.4,0.1,"Iris-setosa" where the errors are in the second and third features. Has Missing Values? No Introductory Paper The Iris data set: In search of the source of virginica By A. Unwin, K. Kleinman. 2021 Published in Significance, 2021 Variables Table Variable NameRoleTypeDescriptionUnitsMissing Values sepal lengthFeatureContinuouscmno sepal widthFeatureContinuouscmno petal lengthFeatureContinuouscmno petal widthFeatureContinuouscmno classTargetCategoricalclass of iris plant: Iris Setosa, Iris Versicolour, or Iris Virginicano Rows per page 510152025 0 to 5 of 5 Baseline Model Performance Accuracy Precision Dataset Files FileSize bezdekIris.data4.4 KB iris.data4.4 KB iris.names2.9 KB Index105 Bytes Papers Citing this Dataset Sort by Year, desc Title Year Venue Journal A Constructive Approach for One-Shot Training of Neural Networks Using Hypercube-Based Topological Coverings By W. Daniel, Enoch Yeung