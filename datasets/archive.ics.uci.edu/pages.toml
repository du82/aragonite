full_description = "Assessing Mathematics Learning in Higher Education Donated on 7/10/2024 MathE is a mathematical platform developed under the MathE project (mathe.pixel-online.org). The dataset has 9546 answers to questions in the Mathematical topics taught in higher education. The file has eight features, named: Student ID, Student Country, Question ID, Type of answer (correct or incorrect), Question level (basic or advanced), Math Topic, Math Subtopic, and Question Keywords. The question level was associated with the professor who submitted the question. The data was obtained from February 2019 until December 2023. Dataset Characteristics Tabular Subject Area Engineering Associated Tasks Classification, Regression, Clustering Feature Type Real, Categorical, Integer # Instances 9546 # Features 8 Dataset Information Has Missing Values? No Introductory Paper Dataset of mathematics learning and assessment of higher education students using the MathE platform By Beatriz Flamia Azevedo, M. F. Pacheco, Florbela P. Fernandes, Ana I. Pereira. 2024 Published in Data in Brief Variables Table Variable NameRoleTypeDescriptionUnitsMissing Values Student IDFeatureIntegerno Student CountryFeatureCategoricalno Question IDFeatureIntegerno Type of AnswerFeatureBinaryno Question LevelFeatureCategoricalno TopicFeatureCategoricalno SubtopicFeatureCategoricalno KeywordsFeatureCategoricalno Rows per page 510152025 0 to 8 of 8 Additional Variable Information More information is available at: https://www.sciencedirect.com/science/article/pii/S2352340924002075?via%3Dihub https://dados.ipb.pt//dataset.xhtml?persistentId=doi:10.34620/dadosipb/PW3OWY Class Labels MathE is a mathematical platform developed under the MathE project (mathe.pixel-online.org). The dataset has 9546 answers to questions in the Mathematical topics taught in higher education. The file has eight features, named: Student ID, Student Country, Question ID, Type of answer (correct or incorrect), Question level (basic or advanced), Math Topic, Math Subtopic, and Question Keywords. The question level was associated with the professor who submitted the question. Dataset Files FileSize MathE dataset (4).csv1 MB Reviews There are no reviews for this dataset yet. Login to Write a Review Write a Review 0 Comments Submit Cancel Download (44.2 KB) Install the ucimlrepo package pip install ucimlrepo Import the dataset into your code from ucimlrepo import fetch_ucirepo # fetch dataset assessing_mathematics_learning_in_higher_education = fetch_ucirepo(id=1031) # data (as pandas dataframes) X = assessing_mathematics_learning_in_higher_education.data.features y = assessing_mathematics_learning_in_higher_education.data.targets # metadata print(assessing_mathematics_learning_in_higher_education.metadata) # variable information print(assessing_mathematics_learning_in_higher_education.variables) View the full documentation Cite 1 citations 28137 views Citation Flamia Azevedo, B., Pacheco, M., P. Fernandes, F., & Pereira, A. (2024). Assessing Mathematics Learning in Higher Education [Dataset]. UCI Machine Learning Repository. https://doi.org/10.34620/dadosipb/PW3OWY. Style: APAMLAChicagoVancouverIEEEBibTeX Keywords education Creators Beatriz Flamia Azevedo Politechnic Institute of Bragança M. Fátima Pacheco Politechnic Institute of Bragança Florbela P. Fernandes Politechnic Institute of Bragança Ana I. Pereira Politechnic Institute of Bragança DOI https://doi.org/10.34620/dadosipb/PW3OWY License This dataset is licensed under a Creative Commons Attribution 4.0 International (CC BY 4.0) license. This allows for the sharing and adaptation of the datasets for any purpose, provided that the appropriate credit is given."
