["https://archive.is/faq"]
title = ""
full_description = "The same time as to load a page into your browser. Although, saving the pages with heavy scripts or the pages full of Ads may take up to few minutes. There is 5 minutes timeout, if page is not fully loaded in 5 minutes, the saving considered failed. It is not often, but it happens. The archive runs Apache Hadoop and Apache Accumulo. All data is stored on HDFS, textual content is duplicated 3 times among servers in different datacenters and images are duplicated 2 times. All datacenters are in Europe. Virtually forever. We have a lot of free space and although the archive grows with time, the storage and bandwidth get cheaper. Pages which violate our hoster's rules (cracks, porn, etc) may be deleted. Also, completely empty pages (or pages which have nothing but text like “502 Server Timeout”) may be deleted. It is privately funded; there are no complex finances behind it. It may look more or less reliable compared to startup-style funding or a university project, depending on which risks are taken into account. I cannot make a promise that it will not. With the current growth rate I am able to keep the archive free of ads. Well, I can promise it will have no ads at least till the end of 2014. Each page has short url http://archive.is/XXXXX, where XXXXX is the unique indentfier of a page. Also, the page can be refered with urls like Year, month, day, hours, minutes and seconds can be separated with dots, dash or colons to increase readability: http://archive.is/newest/http://reddit.com/ There is also http://archive.is/oldest/http://reddit.com/ add hashtag with the scroll position as a number between 0 (top of the page) and 100 (bottom). For example http://archive.is/FWVL#40% select some text on the page and get URL with hashtag referring to the selection. For example http://archive.is/FWVL#selection-1493.0-1493.53 No. But you can keep bookmarks to archived pages in one of the existing bookmark managers, like Delicious, Google Bookmarks, … Because it is not a free-walking crawler, it saves only one page acting as a direct agent of the human user. Such services don't obey robots.txt (e.g. Google Feedfetcher, screenshot- or pdf-making services, isup.me, …)"
