title = "About CODA - CODA - Library at California Institute of Technology"
description = "The Caltech Collection of Open Digital Archives (CODA): the Institute's collections of faculty research publications and other content supporting the mission of the Institute."
full_description = '''We have merged multiple separate collections into the main document repository, CaltechAUTHORS, to consolidate publications by Caltech researchers together into one database. They can be retrieved by browsing the Collections in CaltechAUTHORS : We have merged multiple separate Caltech-hosted conference collections into one repository, CaltechCONF. They can be retrieved by browsing by Conference in CaltechCONF: The archives are compliant with the Open Access Initiative-Metadata Harvesting Protocol (OAI-PMH), which makes them visible in “deep web” search engines (e.g. OAIster, D9). In addition to accessing the archives directly from the Caltech CODA website, the major general web search engines (Google Scholar, Scopus, and MSN Search, among others) routinely index the site. "CODA" is an acronym for the Caltech Collection of Open Digital Archives, which contain Caltech's institutional collections for faculty research publications and other content supporting the mission of the Institute. The mission of the Caltech Collection of Open Digital Archives is to collect, manage, preserve and provide global access over time to the scholarly output of the Institute and the publications of campus units. CODA as a whole has been active since 2001. CaltechAUTHORS and CaltechTHESIS are the largest and most dynamic repositories within CODA. Some items have access restrictions. The largest class of material with access restricted to the Caltech campus are dissertations written since 1977, in cases where the author has not yet been contacted to secure permission for global distribution.The library responds to all requests for access by contacting the author or the author's heirs in pursuit of that permission. On March 16, 2009, the Faculty Board unanimously approved a motion that Caltech Faculty support the creation of the Caltech Collection, and that the library be charged to create and maintain this collection. Studies show that the increased visibility of openly accessible papers leads to greater uptake in a broad range of human activities. The committee believes that the establishment of a Caltech Collection is valuable because:'''
year_published = 2025
