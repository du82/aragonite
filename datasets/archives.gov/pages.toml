["https://archives.gov/about/plans-reports"]
title = "NARA Reports | National Archives"
description = "Strategic Plan NARA's Strategic Plan describes where we are headed. We use the 4-year Strategic Plan as our guide for aligning priorities and assigning resources. With the help of our staff and stakeholders, we take stock of accomplishments, make adjustments when needed, and improve the way we measure our success along the way. Performance Budgets NARA's Performance Budget is submitted to Congress with the President's budget in early February each year."
full_description = "Strategic Plan NARA's Strategic Plan describes where we are headed. We use the 4-year Strategic Plan as our guide for aligning priorities and assigning resources. With the help of our staff and stakeholders, we take stock of accomplishments, make adjustments when needed, and improve the way we measure our success along the way. Performance Budgets NARA's Performance Budget is submitted to Congress with the President's budget in early February each year. Included with this transmittal are our budget justification and tables, as well as our performance plan, providing a direct link between strategic goals, annual accomplishments, and funding levels. Annual Performance Plans & Reports NARA's Performance Plan links the agency's strategic goals to what we plan to accomplish in a fiscal year. Our Annual Performance Report describes NARA's performance results toward achieving our strategic goals and objectives. Capital Planning The Federal Acquisition Streamlining Act of 1994 and the Clinger-Cohen Act of 1996 require a business case for investments to ensure that those investments are tied to the mission, goals, and objectives of the agency. Exhibit 300 is designed to document this relationship, as well as implement other requirements such as the Government Paperwork Elimination Act and E-Gov Act implementation and overall investment project management. Action Plan to Advance Customer Experience at NARA The Action Plan to Advance Customer Experience at NARA details how we will increase organizational capacity to manage customer experience and improve service delivery. The priority actions outlined in the plan also contribute to achieving NARA’s Strategic Goal 2: Connect with Customers and better position the agency to fulfill Executive Order 14058 Transforming Federal Customer Experience and Service Delivery to Rebuild Trust in Government. Open Government Plan The Open Government Plan provides a road map for strengthening the culture of transparency, participation, and collaboration at the National Archives."
year_published = 2016
year_updated = 2025
