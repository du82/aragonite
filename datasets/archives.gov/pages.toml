["https://archives.gov/calendar"]
title = "Calendar of Events | National Archives"
full_description = '''Director, screenwriter, and showrunner, Rod Lurie will share a fascinating, behind-the-scenes look at presidential portrayals in film and television, including Geena Davis as MacKenzie Allen in “Commander in Chief.” Join us for a brief chat on Julia Child's involvement as a spy during WWII, followed by a free showing of the movie "Julia and Julia" New York Times culture and arts critic Wesley Morris will explore what made American film exceptional in the 1990s (particularly 1999) and the lasting impact of ’90s films on American popular culture Join us for a book discussion and sale with Yanek Mieczkowski, author of "Surviving War, Oceans Apart." Join us for a book discussion and sale with Yanek Mieczkowski, author of "Surviving War, Oceans Apart." The Central Arkansas Library System presents An Evening with Jeffrey Toobin, author of The Pardon: The Politics of Presidential Mercy, moderated by Dr. Jay Barth, Director of the Clinton Presidential Library. This exhibit delves into the cinematic portrayal of fictional and non-fictional presidents as symbols of the nation's spirit, values, and historical destiny using original costumes, props, and other memorabilia. Series of mini-teacher workshops offered to area educators. The first of these two-hour workshops will take place on January 15, 2025. WILD ABOUT HARRY!, the premier fundraising event benefiting Harry S. Truman’s presidential library and legacy. Journey through time to explore one of the most significant archaeological discoveries of the 20th century, returning to the U.S. after nearly a decade Check our Facebook pages and Twitter or call 301-837-0700 in the DC area. Nationwide Federal government operating status updates are available on the OPM website. Live captioning will be available online and in the William G. McGowan Theater. If you require an alternative or additional accommodation for an event (such as a downloadable transcript or a sign language interpreter), please send an email to public.program@nara.gov or call 202-357-5000 in advance.'''
year_published = 2016
year_updated = 2017
