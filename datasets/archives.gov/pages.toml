["https://archives.gov/contracts"]
title = "Doing Business With The National Archives | National Archives"
description = "Guidance on the impact of the Coronavirus (COVID-19) outbreak for contractors doing business with the National Archives FAR Deviation PCD 22-01 EO14042 for contractors doing business with the National Archives CAO message to Contractors on Updated Health and Safety Protocols for contractors doing business with the National Archives Integrated Acquisition Environment See our initial inventory of all service contracts awarded by the National Archives: 2015 Appendix B Appendix C Archive of Previous Reports 2014 Appendix B Appendix C Contract Type Service Contract Inventory 2010 20"
full_description = "Guidance on the impact of the Coronavirus (COVID-19) outbreak for contractors doing business with the National Archives CAO message to Contractors on Updated Health and Safety Protocols for contractors doing business with the National Archives GSA's Business Partner Network (BPN) We currently participate in all but two of these portals. The Business Partner Network is the single source for vendor data for the Federal Government. The BPN is a search mechanism that provides unprecedented views into several key data bases across Federal Agencies. These are all useful websites that generally save much time and money. The portals we commonly use follow: SAM Central Contract Registration (CCR) and Beta.SAM.gov Central Contract Registration is the single registration point for all of industry for Government contracts. If a firm does not register at this site, they will not be eligible for Federal Government awards. Federal Business Opportunities This is the single point for industry to view Government requirements. Vendors can search by a number of different categories, go in and see what each Federal Agency or Defense Agency intends to buy, and industry can also register for notification of requirements. Small Business Administration (SBA) The SBA Home Page provides a myriad of information to and for small businesses, in addition to providing useful information on small businesses to Government Agencies. Excluded Parties Listing System (EPLS) The EPLS is checked prior to each contract award to ensure that no award goes to a vendor which is currently on the Excluded Parties List. EEO Pre-Award Clearance This site assists the Government contracting officer in being able to determine the responsibility of offerors before making a contract award. This site lists those specific plants/facilities of each vendor that are in compliance with EEO regulations. Online Representations and Certifications Access (ORCA) This site eliminates a lot of repetitive submissions of representations and certifications for vendors. Rather than submit representations and certifications for each and every solicitation, a vendor can do it just one time in the ORCA database."
year_published = 2016
year_updated = 2022
