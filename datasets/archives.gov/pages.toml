["https://archives.gov/about"]
title = "What is the National Archives and Records Administration? | National Archives"
description = "En Español The National Archives and Records Administration (NARA) is the nation's record keeper. Of all documents and materials created in the course of business conducted by the United States federal government, only 1%-3% are so important for legal or historical reasons that they are kept by us forever. Those valuable records are preserved and are available to you, whether you want to see if they contain clues about your family’s history, need to prove a veteran’s military service, or are researching a historical topic that interests you. Learn more  New to the Archives?"
full_description = "The National Archives and Records Administration (NARA) is the nation's record keeper. Of all documents and materials created in the course of business conducted by the United States federal government, only 1%-3% are so important for legal or historical reasons that they are kept by us forever. Those valuable records are preserved and are available to you, whether you want to see if they contain clues about your family’s history, need to prove a veteran’s military service, or are researching a historical topic that interests you. Learn more Contact Us · Accessibility · Privacy Policy · Freedom of Information Act · No FEAR Act · USA.gov"
