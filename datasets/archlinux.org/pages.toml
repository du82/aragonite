title = "Arch Linux - Downloads"
full_description = "Arch Linux Downloads Release Info The image can be burned to a DVD, mounted as an ISO file, or be directly written to a USB flash drive. It is intended for new installations only; an existing Arch Linux system can always be updated with pacman -Syu. Images for installing Arch can be downloaded via BitTorrent or right here in your browser from one of the Arch HTTP(S) mirrors down below. Current Release: 2025.03.01 Included Kernel: 6.13.5 ISO Size: 1.2 GB Installation Guide Resources: Issue tracker Mailing List Existing Arch Users If you are an existing Arch user, there is no need to download a new ISO to update your existing system. You may be looking for an updated mirrorlist instead. BitTorrent Download (recommended) If you can spare the bytes, please leave the client open after your download is finished, so you can seed it back to others. A DHT capable client is required. A WebSeed capable client is recommended for fastest download speeds. Magnet link for 2025.03.01 Torrent for 2025.03.01 Netboot If you have a wired connection, you can boot the latest release directly over the network. Arch Linux Netboot Vagrant images Vagrant images for libvirt and virtualbox are available on the Vagrant Cloud. You can bootstrap the image with the following commands: vagrant init archlinux/archlinux vagrant up Docker image The official Docker image is available on Docker Hub. You can run the image with the following command: docker run -it archlinux VM images Official virtual machine images are available for download on our GitLab instance, more information is available in the README. HTTP Direct Downloads In addition to the BitTorrent links above, install images can also be downloaded via HTTP from the mirror sites listed below. Please ensure the download image matches the checksum from the sha256sums.txt or b2sums.txt file linked below. Checksums and signatures File integrity checksums and PGP signatures for the latest releases can be found below: ISO PGP si