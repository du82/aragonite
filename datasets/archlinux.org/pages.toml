full_description = 'Arch Linux Logos and Artwork Logos for Press Usage The following Arch Linux logos are available for press and other use, subject to the restrictions of our trademark policy. Two-color standard version Also available in print-quality PNG and scalable SVG formats. Two-color inverted version (for dark backgrounds) Also available in print-quality PNG and scalable SVG formats. One-color standard version Also available in print-quality PNG and scalable SVG formats. One-colour inverted version (for dark backgrounds) Also available in print-quality PNG and scalable SVG formats. Logos and Artwork for the Community Official logos and artwork are also available directly from the repositories. Currently, these packages are: archlinux-artwork - official logos, icons and CD labels archlinux-wallpaper - a variety of desktop wallpapers for standard and widescreen resolutions archlinux-themes-kde - KDE themes and icons archlinux-themes-kdm - KDM login themes archlinux-themes-slim - SLiM login themes Alternatively, you can download the source files. Former Logos Arch has gone through a few generations of branding and what follows are some of our past logos. Although these images are no longer used frequently, they remain subject to license restrictions. Email trademarks@archlinux.org with any questions. Original Ribbon Series "Arch Blue" Series "Arch Aqua" Series Release-specific Series Copyright © 2002-2025 Judd Vinet, Aaron Griffin and Levente Polyák. The Arch Linux name and logo are recognized trademarks. Some rights reserved. The registered trademark Linux® is used pursuant to a sublicense from LMI, the exclusive licensee of Linus Torvalds, owner of the mark on a world-wide basis.'
