["https://archlinux.org/news/making-dbus-broker-our-default-d-bus-daemon"]
title = "Arch Linux - News: Making dbus-broker our default D-Bus daemon"
full_description = "Making dbus-broker our default D-Bus daemon 2024-01-09 - Jan Alexander Steffens We are making dbus-broker our default implementation of D-Bus, for improved performance, reliability and integration with systemd. For the foreseeable future we will still support the use of dbus-daemon, the previous implementation. Pacman will ask you whether to install dbus-broker-units or dbus-daemon-units. We recommend picking the default. For a more detailed rationale, please see our RFC 25. Copyright © 2002-2025 Judd Vinet, Aaron Griffin and Levente Polyák. The Arch Linux name and logo are recognized trademarks. Some rights reserved. The registered trademark Linux® is used pursuant to a sublicense from LMI, the exclusive licensee of Linus Torvalds, owner of the mark on a world-wide basis."
