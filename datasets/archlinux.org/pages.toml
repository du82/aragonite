["https://archlinux.org/news/glibc-241-corrupting-discord-installation"]
title = "Arch Linux - News: Glibc 2.41 corrupting Discord installation"
full_description = "Glibc 2.41 corrupting Discord installation 2025-02-03 - Frederik Schwan We plan to move glibc and its friends to stable later today, Feb 3. After installing the update, the Discord client will show a red warning that the installation is corrupt. This issue has been fixed in the Discord canary build. If you rely on audio connectivity, please use the canary build, login via browser or the flatpak version until the fix hits the stable Discord release. There have been no reports that (written) chat connectivity is affected. UPDATE: The issue has been fixed in Discord 0.0.84-1. Copyright © 2002-2025 Judd Vinet, Aaron Griffin and Levente Polyák. The Arch Linux name and logo are recognized trademarks. Some rights reserved. The registered trademark Linux® is used pursuant to a sublicense from LMI, the exclusive licensee of Linus Torvalds, owner of the mark on a world-wide basis."
