title = "Arch Linux - RSS Feeds"
full_description = "RSS Feeds Several RSS feeds are available for consumption from the Arch website. The majority of these are package-related and allow feeds to be customized for the updates you care about. News and Activity Feeds Grab the news item feed to keep up-to-date with the latest news from the Arch Linux development staff. The Arch Wiki: Recent changes feed is also available to track document changes from the Arch Wiki. Package Feeds If you are interested in all package updates, then grab this feed. All Arches any x86_64 All Repos Feed Feed Feed All Stable Repos Feed Feed Feed All Testing Repos Feed Feed Feed Core Feed Feed Feed Core-Testing Feed Feed Feed Extra Feed Feed Feed Extra-Testing Feed Feed Feed Gnome-Unstable Feed Feed Feed KDE-Unstable Feed Feed Feed Multilib Feed Feed Feed Multilib-Testing Feed Feed Feed Testing Feed Feed Feed A newest packages feed is also available from the Arch User Repository (AUR). Recently added packages. All Arches any x86_64 All Repos Feed Feed Feed All Stable Repos Feed Feed Feed All Testing Repos Feed Feed Feed Core Feed Feed Feed Core-Testing Feed Feed Feed Extra Feed Feed Feed Extra-Testing Feed Feed Feed Gnome-Unstable Feed Feed Feed KDE-Unstable Feed Feed Feed Multilib Feed Feed Feed Multilib-Testing Feed Feed Feed Testing Feed Feed Feed Recently removed packages. All Arches any x86_64 All Repos Feed Feed Feed All Stable Repos Feed Feed Feed All Testing Repos Feed Feed Feed Core Feed Feed Feed Core-Testing Feed Feed Feed Extra Feed Feed Feed Extra-Testing Feed Feed Feed Gnome-Unstable Feed Feed Feed KDE-Unstable Feed Feed Feed Multilib Feed Feed Feed Multilib-Testing Feed Feed Feed Testing Feed Feed Feed Release Feed Grab the ISO release feed if you want to help seed the ISO release torrents as they come out. Development Feeds Subscribe to any of the following to track issues and feature requests from the Arch Linux GitLab: Project Issues Packages Feed Release Engineering Feed Pacman Development Feed AUR Feed Cop