["https://archlinux.org"]
title = "Arch Linux"
full_description = "A simple, lightweight distribution You've reached the website for Arch Linux, a lightweight and flexible Linux® distribution that tries to Keep It Simple. Currently we have official packages optimized for the x86-64 architecture. We complement our official package sets with a community-operated package repository that grows in size and quality each and every day. Our strong community is diverse and helpful, and we pride ourselves on the range of skillsets and uses for Arch that stem from it. Please check out our forums and mailing lists to get your feet wet. Also glance through our wiki if you want to learn more about Arch. Learn more... Latest News Cleaning up old repositories 2025-02-17 Around two years ago, we've merged the [community] repository into [extra] as part of the git migration. In order to not break user setups, we kept these repositories around in an unused and empty state. We're going to clean up these old repositories on 2025-03-01. On systems where /etc/pacman.conf still references the old [community] repository, pacman -Sy will return an error on trying to sync repository metadata. The following deprecated repositories will be removed: [community], [community-testing], [testing], [testing-debug], [staging], [staging-debug]. Please make sure to remove all use of the aforementioned repositories from your /etc/pacman.conf (for which a .pacnew was shipped with pacman>=6.0.2-7)! Glibc 2.41 corrupting Discord installation 2025-02-03 We plan to move glibc and its friends to stable later today, Feb 3. After installing the update, the Discord client will show a red warning that the installation is corrupt. This issue has been fixed in the Discord canary build. If you rely on audio connectivity, please use the canary build, login via browser or the flatpak version until the fix hits the stable Discord release. There have been no reports that (written) chat connectivity is affected. UPDATE: The issue has been fixed in Discord 0.0.84-1. Critical rsync security release 3.4.0 2025-01-16 We'd like to raise awareness about the rsync security release version 3.4.0-1 as described in our advisory ASA-202501-1. An attacker only requires anonymous read access to a vulnerable rsync server, such as a public mirror, to execute arbitrary code on the machine the server is running on. Additionally, attackers can take control of an affected server and read/write arbitrary files of any connected client. Sensitive data can be extracted, such as OpenPGP and SSH keys, and malicious code can be executed by overwriting files such as ~/.bashrc or ~/.popt. We highly advise anyone who runs an rsync daemon … Providing a license for package sources 2024-11-19 Arch Linux hasn't had a license for any package sources (such as PKGBUILD files) in the past, which is potentially problematic. Providing a license will preempt that uncertainty. In RFC 40 we agreed to change all package sources to be licensed under the very liberal 0BSD license. This change will not limit what you can do with package sources. Check out the RFC for more on the rationale and prior discussion. Before we make this change, we will provide contributors with a way to voice any objections they might have. Starting on 2024-11-19, over the course of a week, … Manual intervention for pacman 7.0.0 and local repositories required 2024-09-14 With the release of version 7.0.0 pacman has added support for downloading packages as a separate user with dropped privileges. For users with local repos however this might imply that the download user does not have access to the files in question, which can be fixed by assigning the files and folder to the alpm group and ensuring the executable bit (+x) is set on the folders in question. $ chown :alpm -R /path/to/local/repo Remember to merge the .pacnew files to apply the new default. Pacman also introduced a change to improve checksum stability for git repos that … Older News 2024-07-01 The sshd service needs to be restarted after upgrading to openssh-9.8p1 2024-04-15 Arch Linux 2024 Leader Election Results 2024-04-07 Increasing the default vm.max_map_count value 2024-03-29 The xz package has been backdoored 2024-03-04 mkinitcpio hook migration and early microcode 2024-01-09 Making dbus-broker our default D-Bus daemon 2023-12-03 Bugtracker migration to GitLab completed 2023-11-02 Incoming changes in JDK / JRE 21 packages may require manual intervention 2023-09-22 Changes to default password hashing algorithm and umask settings 2023-08-19 ansible-core >= 2.15.3-1 update may require manual intervention Package Search: Recent Updates (more) dbus 1.16.2-1 x86_64 lib32-dbus 1.16.2-1 x86_64 lib32-libnm 1.52.0-1 x86_64 networkmanager 1.52.0-1 x86_64 git-cinnabar 0.7.0-1 x86_64 gnome-terminal 3.54.4-1 x86_64 vte3 0.78.4-1 x86_64 linux-hardened 6.12.17.hardened1-1 x86_64 gnome-software 48rc-1 x86_64 gnome-connections 48rc-1 x86_64 gnome-calendar 48rc-1 x86_64 evince 48rc-1 x86_64 tuba 0.9.2-1 x86_64 cairo-dock-plug-ins 3.5.1-1 x86_64 gnumeric 1.12.59-1 x86_64 Documentation Wiki Manual Pages Installation Guide Community Mailing Lists IRC Channels Planet Arch International Communities Support Donate Products via Unixstickers T-shirts via Freewear T-shirts via HELLOTUX Tools Mirrorlist Updater Mirror List Mirror Status Development Getting involved Projects in Git Developer Wiki Package Groups Todo Lists ISO Release List Visualizations Differences Reports People Developers Package Maintainers Support Staff Developer Fellows Package Maintainer Fellows Support Staff Fellows Signing Master Keys More Resources Press Coverage Logos & Artwork News Archives RSS Feeds Copyright © 2002-2025 Judd Vinet, Aaron Griffin and Levente Polyák. The Arch Linux name and logo are recognized trademarks. Some rights reserved. The registered trademark Linux® is used pursuant to a sublicense from LMI, the exclusive licensee of Linus Torvalds, owner of the mark on a world-wide basis."
