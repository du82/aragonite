["https://archlinux.org/news/mkinitcpio-hook-migration-and-early-microcode"]
title = "Arch Linux - News: mkinitcpio hook migration and early microcode"
full_description = "mkinitcpio hook migration and early microcode 2024-03-04 - Morten Linderud With the release of mkinitcpio v38, several hooks previously provided by Arch packages have been moved to the mkinitcpio upstream project. The hooks are: systemd, udev, encrypt, sd-encrypt, lvm2 and mdadm_udev. To ensure no breakage of users' setup occurs, temporary conflicts have been introduced into the respective packages to prevent installing packages that are no longer compatible. The following packages needs to be upgraded together: mkinitcpio 38-3 systemd 255.4-2 lvm2 2.03.23-3 mdadm 4.3-2 cryptsetup 2.7.0-3 Please note that the mkinitcpio flag --microcode, and the microcode option in the preset files, has been deprecated in favour of a new microcode hook. This also allows you to drop the microcode initrd lines from your boot configuration as they are now packed together with the main initramfs image. Copyright © 2002-2025 Judd Vinet, Aaron Griffin and Levente Polyák. The Arch Linux name and logo are recognized trademarks. Some rights reserved. The registered trademark Linux® is used pursuant to a sublicense from LMI, the exclusive licensee of Linus Torvalds, owner of the mark on a world-wide basis."
