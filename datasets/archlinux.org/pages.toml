["https://archlinux.org/mirrors/status"]
title = "Arch Linux - Mirror Status"
full_description = "Mirror Status This page reports the status of all known, public, and active Arch Linux mirrors. All data on this page reflects the status of the mirrors within the last 24 hours. All listed times are UTC. The check script runs on a regular basis and polls for the lastsync file in the root of our repository layout. This file is regularly updated on the central repository, so checking the value within allows one to see if the mirror has synced recently. This page contains several pieces of information about each mirror. Mirror URL: Mirrors are checked on a per-URL basis. All available URLs and protocols for each known mirror are listed. Completion %: The number of mirror checks that have successfully connected and disconnected from the given URL. If this is below 100%, the mirror may be unreliable. μ Delay: The calculated average mirroring delay; e.g. the mean value of last check − last sync for each check of this mirror URL. Due to the timing of mirror checks, any value under one hour should be viewed as ideal. μ Duration: The average (mean) time it took to connect and retrieve the lastsync file from the given URL. Note that this connection time is from the location of the Arch server; your geography may product different results. σ Duration: The standard deviation of the connect and retrieval time. A high standard deviation can indicate an unstable or overloaded mirror. Mirror Score: A very rough calculation for ranking mirrors. It is currently calculated as (hours delay + average duration + standard deviation) / completion percentage. Lower is better. The final table on this page is an error log, which shows any errors that occurred while contacting mirrors. This only shows errors that occurred within the last 24 hours. Out of Sync Mirrors Successfully Syncing Mirrors Mirror Syncing Error Log The last mirror check ran at 2025-03-02 05:37 UTC. Checks have ran 141 times in the last 24 hours at an average interval of 0:10 (hh:mm). This data is also