["https://www.are.na/editorial/showdown"]
title = "Molly Lehmann and Jeremy Klemundt of Showdown | Are.na Editorial"
description = "On putting together their annual cooking competition house party in Queens, NY"
full_description = 'Meg Miller: Thanks for bringing over your post-party shallots. Does everyone have to bring something to Showdown? Molly Lehmann: In general I tell everyone to bring what they have lying around, and then the week before I make a grocery list and email everyone to bring certain things. The first year we put this on we dropped a ton of money. Then it occurred to me that we could split it up. Day of, I was running around and cleaning the house, and our friends were texting me, ”What can I bring?” I kept forgetting that I had already told people to bring shallots. Molly: Three people came up with the system: me, my friend Eva, and my friend Bayley who does camera stuff professionally. The initial problem we had when we first started doing Showdown was that people can’t just stare into the kitchen. Bayley’s already super geared out, so he brings his camcorders over. Eva has two monitors that she brings over. The competitors are in the kitchen and the monitors are in a huge open room right off of the kitchen, where the audience is watching. There’s no audio from the live cameras, but we have the MC bring the mic into the kitchen to interview contestants . We get volunteers to run the cameras around, and we have three new judges every year. Usually everyone’s pretty professional about it now. But early on there was a dude who was a little bit tired and hadn’t really used a camera before and he was pointing it at the ceiling for five minutes. Bayley just came in and was like, “What are you doing? You need to focus on something or get out.” [laughs] <iframe src="https://player.vimeo.com/video/275675335" width="640" height="360" frameborder="0" webkitallowfullscreen="" mozallowfullscreen="" allowfullscreen=""></iframe> Becca Abbe: There’s something really uncanny about being 10 feet away or less from something you’re seeing on a screen. Meg: It’s like watching a reality television show that is also unfolding right beside you. How long have you guys been doing Showdown? Why’d you start?'
year_published = 2018
year_updated = 2020
