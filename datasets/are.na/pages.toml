["https://www.are.na/blog/surfactant-program"]
title = "Surfactant Program  | Are.na Editorial"
description = "At once the spider and the spider web."
full_description = "This is an excerpted transcript from the third episode of Are.na Radio, an audio experiment with Montez Press Radio where people share their Are.na channels, describe what’s been collected, and reveal the threads of thought therein. Today I want to read to you from a channel called “surfactant program.” My hope is to trace a collage that weaves its threads into itself — threads about listening, about the way I relate to my loom, and about what spiders can teach us about thinking. To get into that headspace, I’ll start with Pauline Oliveros’s concept of Deep Listening, as expressed in her 1998 score “Ear Piece.” I believe the acoustics that concerned Oliveros are expansive enough to encompass other sensory organs, not just the ears. When I weave, I deep listen through my limbs. Vibrations from the loom travel along the treadles that I press my feet against, into my body. This is one way I receive information about how the weaving is going and how I need to adjust forces like rhythm, tension, and balance as I pass a shuttle back and forth across the warp. It’s also how I learn what the loom itself is feeling. Because of course it feels: this is a wise machine, older than anyone I know, with a wealth of experience. In this life-sized volume, creative energies condense, meet for a dance and then zoom away. And if you know what to listen for, they have plenty to say. In his interviews with northern Indian weavers, sociologist Deepak Mehta often heard the saying “the clapping of the shuttle is the speaking of the word.” This channel started around the time I was thrust into figuring out how to be a woman at the same time as I was learning how to be a weaver. My preoccupation was surfaces: reflective planes that contain and define a body, why it felt like I was missing them, and how to make new ones whole cloth. Surfaces don’t have to be superficial in a dismissive sense; they are boundaries, they connect us to ourselves. And it can be disorienting to be without them."
