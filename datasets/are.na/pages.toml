title = "Base Notes | Are.na Editorial"
description = "On the trace amounts of lewd odors found in our most luxurious perfumes."
full_description = "“What is it like to have something soft and hard at the same time?” This was the riddle-qua-instruction articulated to perfumers by Parfums Dior in the brief for Pure Poison in 2004.1 There is an inherent sense of contradiction to a perfume, an aspirational dialectic that is enforced by its very nature: invisible yet potent, present yet ephemeral, fantastical yet purchasable. This contradiction extends even to the origins of certain ingredients used in its conception: while perfume is understood to lend a pleasurable scent to the body, many of the world’s most popular—Chanel No. 5, Eternity by Calvin Klein, and Dioressence by Christian Dior, to name a few—contain traces of chemical compounds that are found in places less than pleasant and almost always relegated to the margins of polite conversation. Bile, feces, vomit, and animal oils will never make an appearance in any perfume advertisement, yet historically they—or, more commonly today, their synthetic substitutes—covertly underpin countless perfumes on the market. Technically, these compounds function as fixatives, imparting longevity to the more ephemeral ingredients of a perfume while ensuring the scent’s lasting presence on the skin. Aesthetically, they lend a stylistic nuance to a perfume’s profile. Perfumer Anne McClain, co-owner of MCMC Fragrances in Brooklyn, thinks that part of the allure may be because humans are naturally “just a little bit gross,” as she puts it in a conversation with Katy Kelleher for her book The Ugly History of Beautiful Things. “I think there is a depth to anything that is made of life and creates life. There’s something inherently sexual in that. Even though something like civet will smell gross on its own, it adds an element of reality.”2 Ironically, it is reality that we attempt to elude through the fantasy postured by the standard perfume commercial. Yet the image we fetishize conceals a rather secret, sordid reality. “Beauty is part of the history of idealizing, which is itself part of the history of consolation. But beauty may not always console. . . ” writes Susan Sontag.3 In Greek mythology, this perspective was also alluded to: Aphrodite, the goddess of love, lust, passion, pleasure, beauty, and sexuality, was begotten from violence, betrayal, and decay, borne of the castrated genitals of the sky god Ouranos after they were cast into the sea by his son Kronos.4 Her name, interpreted to mean “foam-borne,” is reminiscent of the ambergris that plunges through the ocean and, very rarely, washes up on shore.5"
