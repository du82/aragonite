["https://www.are.na/editorial/desire-paths"]
title = "Desire Paths | Are.na Editorial"
description = "A path is only there because someone keeps going."
full_description = "Raegan Bird: What’s the first desire path you remember, or even just the first walking route that you took regularly? Mariah Barden Jones: My mom’s neighborhood and the house I grew up in is about six blocks back from the beach. My mom, my sister, and I would follow this same route to the beach: first four blocks through the neighborhood and then, we would duck under the Rudee Inlet Bridge before coming out in a parking lot across from the boardwalk. The Rudee Inlet Bridge is a path now with “murals” and stuff, but when we were little we just had to FULL SEND and launch our beach cruisers down this rocky little cliff and immediately up a rocky little hill next to the part of the inlet where fisherman like to clean their catch. How about you? Raegan: Growing up in Virginia Beach sounds like a movie… The first neighborhood desire path that I remember upset us all when it got paved. It was an empty lot between two houses where we would meet and play, but if you followed it back through the woods and this big field, you got to a playground. When the city paved a path from the street to the park, it ruined a lot of our games and the walk back to the park wasn’t as fun anymore. What did it feel like when the Inlet Bridge path became paved? Did you see it? Were you there? Or did you come back to find the change? Mariah: We had kind of the same problem — so many of the things we liked in our neighborhood when we were little were of this sort of faux-clandestine nature? Our parents knew where we were going when we said we were going to “the woods” (what we called basically any lot on our block that was still trees and scrub) or to walk around the houses being built. But it was the idea that our parents didn’t really know where exactly we were and what we were doing back there in that sort of pseudo-secret space… They knew roughly where we were but they didn’t know about our forts. They didn’t know about our games, or what we were talking about. About the secrets we were telling each other. A place where we could be deranged little girls collecting dead bugs or convincing each other to eat flowers and leaves or screaming and running in a game with self-authored rules that we took too seriously. Going to a playground was not the same thing and, honestly, not as fun."
