["https://www.are.na/editorial/claire-l-evans"]
title = "Claire L. Evans, writer and musician | Are.na Editorial"
description = "Journalist and musician Claire L. Evans shares the stories of unsung women who shaped the development of the web"
full_description = "“This is not to say that men make and women use—far from it—only that the technological history we’re usually told is one about men and machines, ignoring women and the signals they compose,” Claire L. Evans writes in the introduction to her new book, Broad Band: The Untold Story of the Women Who Made the Internet. The book offers another version of that history, one that doesn’t ignore the women in the room, and instead finds the rooms were packed with them: alongside known names like Ada Lovelace, Grace Hopper, and Jaime Levy, there were the ENIAC Six, the women who programmed and operated one of the first computers; the women of Resource One, who developed one of the earliest efforts to apply computing to social good; Jake Feinler, who kept the earliest version of the Internet online; and Stacy Horn, who ran one of the first ever social networks out of her apartment in the ’80s. As Claire tells it, Broad Band also tells the human side to our history of machines. It gives equal importance to the lived experience of its characters as it does the technology they helped invent, operate, program, and proliferate—and connects them all through sharp writing and a truly compelling narrative (the story of the development of ARPANET as told through the discovery of the world’s longest cave—the “Mt. Everest of speleology”—cartographic data, and heartbreak, is a personal favorite). Claire has been writing on the Internet since her teenage LiveJournal, and more recently as a contributor to VICE, The Guardian, Motherboard, WIRED, National Geographic, and Aeon. She’s also the lead singer of the pop group YACHT. I spoke with her recently over the phone about how “female mental labor was the original information technology,” why women are often early adopters, and hypertext as narrative form (though not necessarily the best research methodology for this book). I wanted to start off by asking about your writing and research process for the book, as I’m always interested in that. Then I remembered that in the book you write that interviewing hypertext researchers means always having to answer their questions about your process and how you organize your thoughts. In that section you mention something about index cards and serial killer-yarn threads…"
