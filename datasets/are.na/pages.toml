["https://are.na/editorial/ecstatic-documents"]
title = "Ecstatic Documents | Are.na Editorial"
description = "Beyond the plainly appropriate resides a latent, unreasonable, ecstatic energy."
full_description = "There is a practically unconscious sentiment, a vague consensus that things — any and all things — should be described and documented appropriately. Fittingly. Empathically. We like to know what we are talking about, and we signal our knowing by letting it inflect our recollections and communications. When we aspire to show, and not only to tell, we assume a knowing role. One could even claim that this knowing protocol is visual communication’s lowest common denominator, its vernacular. It explains why amateur archaeologists, when they dig some indistinct lump from the ground, feel compelled to wield it like a prehistoric weapon or covet it like a votive, as they present it to a companion’s camera. It explains the “mindsmile” elicited by discovering the arrow — that internationally-recognized symbol of the courier — hidden with intent in FedEx’s typographic logo. Ultimately, it explains why (as per the classic Reddit meme) people do simply prefer aesthetic water and find it more watery than generic water. FedEx might have come to dominate mindsmile mindshare, but it is very much a gateway drug. Its thrill is superficial: pleasing, but one-dimensional. Something more compelling, more addicting, awaits beyond. Beyond the plainly appropriate a latent, unreasonable, ecstatic energy resides. In the southern hemisphere summer of 2016, an innocent tourist photograph of the sun setting over Darwin Harbour became a viral image on Facebook. The photographer, Kelly Matthews from Derby, Western Australia, didn’t realize what an extraordinary image she had produced until friends began commenting on her post. Matthews’s image artfully frames the landscape through a canopy of trees in its foreground, and, especially at thumbnail-scale, that silhouetted frame coincidentally creates the familiar outline of Australia, the entire cartography of the country, as seen from above! A God-like, omniscient view! A most Australian image! Matthews apparently did not have ecstatic designs in that decisive photographic moment, but just as the creator of the FedEx logo had been, she was attuned, attentive, receptive: “I’ve visited every state and territory in Australia now, so it’s like the map is complete, it’s perfect,” she told a journalist from Northern Territory News. Perfect, as if in a vision."
