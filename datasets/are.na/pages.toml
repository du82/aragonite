["https://www.are.na/editorial/gossips-web"]
title = "Elliott Cost of Gossip's Web | Are.na Editorial"
description = '''A conversation with Elliott Cost and Laurel Schwulst on Radner's digital "green pages" for artist websites'''
full_description = "MM: The idea for this interview came about in this kitchen, because I was sitting here wondering about what to do next for the blog and Laurel had the suggestion that I email Elliott. Then when we talked over the phone, Elliott, you were saying that your website, Gossip’s Web, transformed from something that was primarily being used for personal research, and mostly just a Google Doc, into something that was public facing when Laurel was your roommate in San Francisco. You were working on it in your kitchen and she came over and asked you what it was, and you felt compelled to build it out more. Elliott Cost: It began in the kitchen, as you pointed out. It actually started with a different site that was just a list of artist websites. I ran that for a while and all these people who were on the list emailed me wondering, “What is this? Why am I on this?” ER: Artistswithwebsites.com. [laughs] I think maybe that was also a reason that I retired it. It was a little too generic. ER: I thought it was a little strange to list all these artist websites, because it was an extremely broad category. I know that there are some Are.na channels that attempt to encapsulate artists who make websites. It was hard to determine who falls into that category, and a lot of artist websites are kind of vague. Also, the domain expired. At the time, I was starting a project space in my apartment, so Gossip’s Web was a way of doing research for VI Dancer, to see exactly what type of website the space needed. The idea behind Gossip’s was to just list project spaces or apartment galleries that I admired. ER: Yeah. Laurel was living there at that time. Going back to the idea of a kitchen as a work space: the other day, I was thinking about how many websites probably started in the kitchen. They’re often communal spots, and it’s a bit nicer to work in a communal spot than in your room. LS: That house [in San Francisco] also didn’t have a living room really, so the kitchen was the true central spot of the house. And my room specifically opened up into the kitchen, but also it had a window that opened up into VI Dancer. Which was this kind of porch, inside-out space. It was more inside than outside; it was covered."
