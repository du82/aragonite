["https://are.na/editorial/pattern-recognition"]
title = "Pattern Recognition | Are.na Editorial"
description = "On sewing your own clothes."
full_description = "Tracy Ma: Yes. Certainly it would solve a lot of problems. It would create more problems too, of course. If everyone made their own clothes, people would have a renewed appreciation for time. There is a lack of muscle in going into a store and buying something. People assume everything is very mechanized now, but it’s actually very tough and time-consuming human labor. Tracy: I started when I was twenty-six. But most of the garments I made then are unseeable. It took me a long time to get the hang of it. Around that time, I was addicted to fast fashion. I was working at Bloomberg, where I didn’t feel like I fit in. So I used fast fashion as a way to blend into their very office-y, financial work culture. It was all a mirage. I would go to Zara after work. It was a very cheap form of creativity. It was also becoming a nasty financial habit. Tracy: I wore my shitty tubular dresses to work almost immediately. They were hard to walk in. Ellen, my editor at the time, asked me, “You made that dress, didn’t you?” It was a complete tube. She knew right away. Tracy: I love this Tumblr called archivings.net—it’s a compilation of scanned photographs from old runway books, spanning from the late ’70s to the early 2000s. It features runway shows that have somehow been lost through the sands of time. It’s material the internet hasn’t really been able to cache. I love these types of clothes because they’re completely unwearable. It’s why many of those brands ended up failing. The person who runs archivings.net, Shahan Assadourian, was quoted saying they prefer fashion brands that last less than three years; these brands tend to make the most interesting stuff. I’m inspired because it’s a lot of handwork. It’s truly unscalable. I don’t have means of mass production anyway. So why not make it? When you’re learning a trade, it’s almost impossible to be patient. You have no idea how it’s supposed to go, so you’re often doubting yourself. You charge through and see what it’s like first. It makes patience impossible. But now that I know the process, I am able to take my time on details like sewing on a button."
