["https://www.are.na/blog/what-makes-it-through"]
title = "What Makes It Through | Are.na Editorial"
description = "On projecting the outside inward."
full_description = "There is a huge evergreen tree in Seattle’s Volunteer Park, on the edge of one of its grassy fields. From a distance, it is a platonic ideal: a nearly perfect cone, the way a child would draw a tree. But when you approach, the tree’s solidness gives way to gaps between branches that part into entryways. Passing through one of these entryways, this tree becomes a shelter. A bed of dirt and bark marks the end of the field and the beginning of the tree. To stand here is to be not quite inside the tree but not quite outside of it either. Up close, the plump exterior of the tree reveals its skeleton of branches. Each branch has its own trajectory, a path frozen from many years of following the sun. On the earth below, the many layers of the tree are compressed into a flat shadow; glimpses of sky mirror into distorted shards of light. The marbled ground could be said to be a tracery of shadows. In an architectural sense, the term “tracery” describes the decorative divisions of a window, originally intricately carved stone in Gothic churches. The ribs or spacers—which are used to create a pattern and provide structural support to the glass—cut through an otherwise open space. Other elements in our surroundings—trees, buildings, clouds, fences—also dissect light the way tracery windows do. While some light continues to its terminal, the rest is captured and rendered as negative space. More broadly speaking, the word “tracery” can also be used to describe any branching pattern,1 including shadows of tree branches that soften direct light.2 In that way traceries can be both object and shadow: branches as tracery, and a tracery made by the shadow of those branches. Traceries can project the outside inward. Objects break light into perforated shadows that flow through the spaces we occupy, a slice of the outdoors projected onto a wall, the floor, or a curtain as a screen. Fleeting but anchoring a particular time and place. These shadows are an imperfect cast, a version of an exterior but not the exterior itself: a memory."
