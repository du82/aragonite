["https://www.are.na/editorial/khorasan-dreamscapes"]
title = "Khorasan Dreamscapes  | Are.na Editorial"
description = "On Afghan diaspora communities, film representation, and the practice of collectively cataloguing knowledge as it expands"
full_description = "This conversation was conducted in September 2020 and appears in the Are.na Annual 2021, themed “tend.” Rona Akbari: Hi Weeda jaaaaan. I'm doing well. There's a lot going on work-wise and a lot on the horizon, too. Just nervous about how I'm going to balance it all. Weeda: Anything you're excited to share out here in the ethernet? What's on the horizon? *looks out into the horizon* Rona: Well, today Negine Jasmine (a fellow Herati filmmaker) and I released the first episode of our micropod, “Just Warm Spaces.” I've also been in this weekly writing workshop with my friend Hurley Winkler. I’m hoping I’ll be able to share some of the work I've been doing there with the world sometime. I'm also in post-production of a short film I made a while ago...there's a lot happening! But enough about me. How are you? Weeda: Omg that sounds wild. I saw that you released a podcast and I'm super excited to listen to it!! I feel like we're living parallel lives right now, ’cause there's been a lot happening for me too. I'm a programmer at Insomniac Film Festival in Toronto, which presents a selection of films from Toronto’s distinct young film community, and the D-Day for our Insomniac The Movie: A Collaborative Quarantine Cinema Project is fast approaching! Big name, I know. Instead of holding an in-person festival, we took a more inventive approach to give filmmakers the opportunity to keep creating during such an unpredictable time. The goal is to make a feature-length film over the course of 15 weeks with 15 filmmakers, each with their own one-week slot. The catch is that you can only see the film that was shot before yours in order to continue the story. Otherwise, I've been writing some scripts...which has me thinking about all the scripts you and I could've written together if I was able to hop on a bus to America right now :-( Rona: We will definitely write a script together one day. Also, I feel like this is a good segue to explaining how we met. I think it was a year ago that I was exploring the programming for No Evil Eye, a radical anti-colonial underground basement micro-cinema, and I stumbled on your short film Herat in my Head in my Heart. I was just kind of floored to see an Afghan name attached to a film about Afghanistan, especially Herat, which is also where my family is from. It was so exciting, I had to search you up on Instagram and DM you."
