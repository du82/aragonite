["https://www.are.na/editorial/with-and-without-a-firm-grasp-part-ii"]
title = "With and Without a Firm Grasp, Part II | Are.na Editorial"
description = "A conversation on the making of a Ramadan calendar."
full_description = "Last month, Shiraz Abdullahi Gallab and Forough Abadian published a Ramadan calendar (also known as imsaakiyat Ramadan) in collaboration with Inga Books. These calendars were distributed throughout Chicago to masjids, organizations, and community centers at the start of Ramadan, and we ran an essay by Shiraz for the project’s launch. Now that Ramadan has ended, Shiraz and Forough agreed to close this project with a conversation, which is transcribed below. Shiraz: Thank you for making time to talk through the imsaakiyat Ramadan project that we collaborated on. I’m excited to have this conversation with you. I reached out last fall about this project and gave you some background on the visual research that I had been conducting on Islamic prayer timetables. I'm wondering, what was your initial response when you first learned about this project? Forough: I was honestly a bit hesitant because this was my first time seeing these types of calendars and printed ephemera. They aren’t something you see everyday in Iran, or at least I never saw anything like them in the environment I grew up in. So when I responded to your email and agreed to get involved, I was worried that you would politely reject me as a collaborator [laughs]. A big part of this project is understanding the context of these designs. Shiraz: It’s interesting that the existing prayer timetables were unfamiliar territory for you. And to be honest, I think that strengthened the design in a lot of ways, because you had to approach each element as a new thing, which likely made you more sensitive to the designed details. I’m curious to hear more about your process in the early stages. How did you approach the calendar design? Forough: Your Are.na channel dedicated to salah tables was super helpful to just get a sense of how the information is organized. My mind works in a way that tends to test out different structures and different organizing methods. There are several ways of arranging the information on these calendars, since we’re looking at a grid of five prayer times per day, and normally 30 or 31 days per printed calendar. The data can be arranged so that your eyes scan through the daily prayer times row by row or column by column. Which option would be legible and visually interesting? What information do you merge? What information do you divide further? For example, some of your references merged the hour and minutes into one cell and some divided them into two cells."
