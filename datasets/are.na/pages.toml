["https://www.are.na/blog/documenting-the-divine"]
title = "Documenting the Divine | Are.na Editorial"
description = "Miracles are all I know."
full_description = "It was not a miracle when the earth quaked and petals covered the Carmelite Monastery in Lipa, Batangas. Not when the Virgin Mary appeared to Teresita Castillo at five in the afternoon. Nor when Mary returned for fifteen days at the same hour to the young Carmelite, speaking secret words. Not too, when Teresita's body was found after the visions, outstretched — as if crucified. Teresita's head collapsed at the strike of three, just as Christ's, and it was just as naked when Teresita was exiled, stripped from her titles, and growing ill. All the proof was burned. The devotion, banned. Nothing was deemed worthy of belief. Regardless, newspapers reported it all. Over 500,000 devotees arrived in following months to this small Filipino town, in pilgrimage. They swore the petals rained on them. Our Lady of Lipa is one of many reported apparitions of the Virgin Mary deemed inauthentic by the Roman Catholic Church. Declared as having nothing “supernatural in origin,” it caused tension between devotees and the Catholic hierarchy for decades. I never question miracles themselves. Mary manifests and the miraculous is mundane. But I wonder, how would you document the divine? The history of Marian belief is a history of dispute and innovation. Faith is tested as appearances are contested. Already, these occur around the divisive figure of Mary, whose veneration is often challenged. Does her message draw away from Christ or bring us towards Him? What is worthy of belief? It is the burden of believers to prove, lest the reward for their devotion be branded as delusion. It is no surprise that Mary is such a central figure in the Philippines, a nation that understands these very natures. Filipino Catholicism's deep veneration of Mary draws from a history of colonialism, animism, and religious resistance. In pre-colonial times, feminine shamans (babaylans) spiritually nourished communities in maternal and healing roles; indigenous animist beliefs centered the spirituality of everything physical and non-physical and had been reconciled with the Catholicism of colonization. As a result, apparitions fuel collectivity amidst political upheaval. Marianism flourishes in its harmony with folk practices and peasant attitudes, fueling optimism, faith, and resistance. Alongside Filipino religiosity is their positioning in our technological landscape: a workforce outsourced and exploited for their labor, hidden in the peripheries – just like Mary. Our bodies are interfaces to the modern world, at risk of disappearing if we continue to be unseen."
