["https://www.are.na/editorial/courtney-cassidy"]
title = "Cortney Cassidy of 'Homes' | Are.na Editorial"
description = "A collection of screenshots from Instagram Stories documenting the interiors of people's homes."
full_description = "CC: Ours is really big. We live in a really tiny apartment but our kitchen is massive. It has a black and white checkered floor, and all the countertops—there’s like four different countertops—are red and sparkly. We have a skylight, it’s my favorite part. And there are so many cabinets. There’s a stove and a fridge. LS: You started your Homes channel earlier this year, about six months ago. Was there something in particular around that time that prompted you to begin? CC: It was not planned at all. If it was six months ago, it was winter, so I was definitely at home. Maybe I was in bed. I was seeing a lot of people put their homes on their Instagram Stories. CC: At first it was for personal inspiration. But then it evolved and wasn’t that anymore. It’s become this kind of voyeuristic act. When people post on Instagram Stories, it’s temporary, and the poster knows it’s temporary. I’m archiving and making them permanent in some violating way [laughs]. I also find the images quite peaceful. When people take photos of their living space, I think they’re probably feeling very comfortable in that moment and simply want to share their comfort. I like to feel comfortable. I also like to feel the nice weather from indoors, which is probably why I like to see pictures of the outdoors taken from inside a room. Like a nice view of trees and sunlight through a window, maybe framed with curtains. CC: They’re mostly my friends, and a few of them are interior design enthusiasts. For instance, my friend Kim has a really good Instagram account: she often documents interiors from old books, from the ’70s and ’80s. I don’t take screenshots of her books, but I do take screenshots of her apartment. She moved into it a couple of months ago. I’m archiving her progress. CC: No she doesn’t know. She would like it, I think [laughs]. In some ways, once I collect a screenshot from Instagram of someone’s home, I feel like that home belongs to me now, too. I get to look at the screenshot any time I want and put myself into the moment the photo was taken. Almost like house swapping, only the other person doesn’t know."
year_published = 2018
year_updated = 2020
