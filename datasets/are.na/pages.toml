["https://are.na/editorial/untitled6-docx"]
title = "untitled6.docx | Are.na Editorial"
description = "The draft is a document documenting."
full_description = "As children, we learn about what it means to be a living thing. What makes you, or the tree outside your window, different from a cloud or a rock. The state of living is boiled down frugally to a handful of terms — movement, growth, sensitivity, respiration, nutrition, excretion, and reproduction. We learn that it is through these processes that the material, fleshly objects that we are become living things. Living is something we do (verb) and not something we simply are (noun). The word “document” is both a noun and verb. It is and does. In the “and,” at the intersection of document-as-noun and document-as-verb, sits the draft. The draft is the document documenting. It is a collection of processes, much like those we learned in science class — a living document. Drafts move and grow. The particular magic of a draft is that it is incomplete — and thus, not static. By mere function, the draft always extends and expands and changes form, or, at the very least, holds the promise of this. There is always the chance of more — of alteration and adjustment and addition and repositioning and removal. In my own poetry writing practice, this happens through strikethroughs, through arrows pointing between lines, words, or across pages, through subscripts and notes in the margins. They feel like visual compositions of their own, preserving and documenting the puzzling-together process of the draft. You have the pieces there in front of you — a first line, a particular image or metaphor, a structural idea — but you don’t yet know what the poem will be, what it will become. You move the pieces around, figure out how the lines fit together, try out different words until you find the one that holds the nuance you need. I find similar delight in the ways that many drafts begin with ephemera — on post-its, napkins, and the backs of receipts. Ephemera sometimes (wonderfully) documents where inspiration finds us: William Carlos Williams, for example, drafted poems, theories on poetry and ideas for plays on prescription pads — proof of his writing pouring into his daily work as a physician. Ephemera are fitting vessels for the seed of the draft, for the idea. And then the draft grows beyond them. It moves to spaces that are less transient, that have more room for its development — from an idea, to an attempt, to a work in progress, to finally (hopefully) a finished work."
year_published = 2024
year_updated = 2024
