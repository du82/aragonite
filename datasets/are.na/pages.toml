["https://are.na/editorial/entrance"]
title = "ENTRANCE | Are.na Editorial"
description = "From where it was to where it is."
full_description = "In geometry and mechanics, a displacement is a vector whose length is the shortest distance from the initial to the final position of a point P undergoing motion. It quantifies both the distance and direction of the net or total motion along a straight line from the initial position to the final position of the point trajectory. A displacement may be identified with the translation that maps the initial position to the final position. Displacement describes the resulting distance when something is moved from where it was to where it is. It is the shortest path, a straight line, a vector. Displacement doesn’t account for how it got from where it was to where it is, and it doesn’t account for time. In my basement studio at 38 Ludlow Street in Lower Manhattan, I regularly get people stumbling down my steps and entering through my glass door asking, “Is this ENTRANCE?” I say no and point them a few storefronts up. The confusion is easy to understand: ENTRANCE also occupies a basement on the same side of the street of the same block. At 48 Ludlow Street, a small blue acrylic sign marks the art gallery: I’ve been strangely fascinated by this sign for a while now. Since the gallery was initially only in the basement, the sign was needed to mark its unexpected and therefore easy-to-miss, below–street level entrance. The sign has a double function, both marking the entrance and identifying the gallery, ENTRANCE. I like that. The sign has a particular typography, and that was also surely some of the attraction. The type registers for me somewhere between 1898 and 1998, feeling at least equally plausible in either time. This double register also makes it feel perfectly right, now. I like it and I said so to Louis Shannon, cofounder of the gallery, who told me the typography was “borrowed” by his brother Jack from signage at a parking lot on Broome Street. I thought this was pretty brilliant, displacing the particular type from a parking lot a few blocks away to a basement art gallery. On the surface, this is simply vernacular or found typography. But for me, the typographic displacement leaves a marked trace. The movement of these letters from one sign to another links those two sites, as if the Ludlow basement now has a light overlay of the Broome Street parking lot. Things change, and things move. And things leave a trace when they do."
