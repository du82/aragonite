["https://www.are.na/editorial/teaching-the-internet-in-the-time-of-covid-19"]
title = "Teaching the Internet in the time of COVID-19 | Are.na Editorial"
description = "On new approaches to time, attention, tools, and teaching amid a global pandemic."
full_description = "Rosa and Simone are two graphic designers currently based in New York City. They met at Yale School of Art, where they received MFAs in May 2019. In addition to working professionally, they both taught interactive design this semester amid the COVID-19 pandemic—Simone at Hunter College and Parsons School of Design and Rosa at Yale. Here, they talk to each other about their experience of transitioning from an in-class setting to online, and in particular, teaching Interaction Design via the Internet. Rosa McElheny: At Yale we went online during Spring Break, right in the middle of the semester. It was the moment when I transitioned from a more structured, technical part of class to a more self-directed project. And it was right as I was hitting my stride as a first-time teacher. It wasn’t easy for anybody. Most of my students had to move. Those whose families are abroad struggled with whether and how to travel home. We all had to emotionally adjust. SC: Yes, I was teaching Core Interaction at Parsons and Web Production I at Hunter College. Two different environments and systems. Parsons (as a private institution) decided to transition to online class the week before Spring Break, and give the teachers two weeks of preparation. A lot of students came from different regions in the U.S. and from around the world, so everyone left New York immediately. Hunter (as a public institution) couldn’t take this decision. They had to wait for the New York State guidelines, which meant their transition was really difficult and full of delay. Students are New York based, but not a lot of them have access to computers or the Internet. Teaching this type of class became really complicated. Students without an Internet connection joined the class on their phone, but of course without the opportunity to share their project with the class. I had one student drop out because he didn’t have an Internet connection at home. I needed to really change the way I was communicating with them."
year_published = 2020
