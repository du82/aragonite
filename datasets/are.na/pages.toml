["https://www.are.na/editorial/webs-of-care"]
title = "Webs of Care  | Are.na Editorial"
description = "Ingrid Raphael talks with Rae Dand and Onelson Nicholas about how care is activated when our needs are met"
full_description = "In July 2020, Eyebeam’s Digital Day Camp: Rituals of Care, an annual four-week summer camp for teenagers dedicated to artmaking and tech-learning skills, took place online. Shortly following shelter-in-place in the U.S. and the nationwide upheaval surrounding the murders of George Floyd and Breonna Taylor, I crafted a week-long curriculum called “Webs of Care” for the camp. It centered on the idea that care is activated when our needs are met, and explored how taking care of ourselves might allow us to meet the needs of our communities via pod-mapping, collective manifesto making, and imagining a world of care. As part of the workshop, two cohorts of 16 teens used Are.na to find media, text, and visual cues representing their needs and what they imagine care to look like. We then created channels for each participant’s needs and connected them to the blocks of care they uploaded or found, culminating in a process where each need was met by connecting them on Are.na. Afterwards, we transferred our blocks into a Google Slides format and each person made their own slide to depict their community’s needs and acts of care. The result was a collectively made online guidebook documenting each person’s journey with care. Some of the questions we explored in the workshop were: What is care? What does care feel like? How do we begin to take care of ourselves and others? And, In a time where online is the new norm, what are the platforms with which we can connect our needs and imaginations? After a few months had passed following the workshop, I wanted to reconnect with two of the participants to reflect on their newfound conceptions of care. Here, Rae Dand (16 years old), Onelson Nicholas (18 years old), and I discuss what care means through a few blocks in our collective channel. Ingrid Raphael: Okay, so first let’s pick a block in our channel that isn’t yours. What does this block express to you? What do you like or enjoy about this? Rae Dand: I really liked the connection to earth in this block, it made me think about how, when we think of care, we usually think of ourselves or other people, but not about the earth and how it cares for us and we care for it. It’s pointing out how even though we love to think that we as humans are so amazing, the only reason we are here is because of the earth."
