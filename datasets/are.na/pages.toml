["https://www.are.na/editorial/restaurant-websites"]
title = "Toph Tucker and Jasmine Lee on Why Restaurant Websites Are Good and We’re All Going to Miss Them | Are.na Editorial"
description = "And how labor often gets left out of the discussion around nostalgia for the old web."
full_description = "Toph Tucker: At the time, I was about to meet with my friend at the Astro Restaurant, a diner in midtown Manhattan. I wanted to check the menu before I arrived. So I looked at the website. It was a particularly incredible one, with a very distinct aesthetic. It had so much personality with many little personal notes from whomever was making it. It gave me a good sense of what the restaurant would be like before I arrived. And surprisingly, it didn’t need photographs of the restaurant to do that. Toph: Even though it had allusions to events in its past and had built up a sort of history—like it was clearly a Midtown staple—the restaurant was totally unpretentious. That’s the most important part. It had a pretty extensive classic diner menu, which was not concerned with typos or consistent fonts or really any kind of consistency at all. I just looked back at its website today. I noticed they had special Thanksgiving hours and schedule. So they also keep the website quite updated. Toph: The website itself is a lot of text. The menu is not an uploaded PDF or a photo of the menu. It’s a text menu, which is helpful because it’s searchable. But there are also images. There’s an animated Flash-style slideshow with windowshade-like transitions where the new image slides over the old one from several points at once. I’d imagine someone is probably editing .html files over FTP. It doesn’t look like there's any kind of CMS layer like Squarespace because there’s inconsistency within navigational elements, and different pages have sufficiently different layouts. The site doesn’t appear to be on any kind of template or grid. Jasmine Lee: It’s like a generational website. That is, a website of a specific time. Those often have a certain personality and maybe aren’t as pretentious. Laurel: That other part of your tweet was kind of ominous. I believe you said “we’re all going to miss” restaurant websites. So where are they going? Toph: Into the stacks [laughs]. Between templated website builders and Facebook and also these centralized menu platforms…"
year_published = 2019
year_updated = 2020
