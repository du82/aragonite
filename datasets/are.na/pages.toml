["https://www.are.na/editorial/storytelling-as-gift-storytelling-as-currency"]
title = "Storytelling as Gift, Storytelling as Currency | Are.na Editorial"
description = "On storytelling economies."
full_description = "This is an excerpted transcript from the third episode of Are.na Radio, an audio experiment with Montez Press Radio where four people share their Are.na channels, describe what’s been collected, and reveal the threads of thought therein. My life-force has always been stories. Not just what they are made of, but what they are, or simply that they are. Beyond my love for all the shapes a story can take, beyond the language and world-building of literature and cinema — the pure intention; the ritual form. What does it mean to be a messenger, to have a message? More recently I have tried putting a name to this: I am captivated by storytelling as a technology, as a practice, as an economy, as a tradition, as a field of study. This is something that I have been exploring and cultivating on Are.na, under the name “storytelling as gift; storytelling as currency.” This channel is a story about stories. I’ve always had an unwavering belief that everything is made of stories: that we can break down our world into stories we tell ourselves and each other. For meaning, for belonging, for purpose, for faith. In stories, we find something to hold onto. Stories are what bind and make us. How we form relationships, yes, but also the essence of our relationships themselves. Our very gestures, our possessions, our conversations — we tell stories through which to see our world, which in turn creates our world. I created my channel three years ago, when I was around 21. I recognized that storytelling is an exchange — hearing stories trigger feelings and stories of our own within us. Are we not so often compelled to reciprocate? To relate? To trade? I recognized a network of stories all around us, each with tellers and recipients, but what each gains and gives seemed more complicated than their named roles, and I was curious about how one point of exchange might be dissected. At the time, the channel was called “storytelling as currency; transactional storytelling,” and for the first year it remained empty, perhaps limited by the framework of the latter part of its title that I have since dropped. While the nature of the process is a trade, to quote from a block I wrote, I would prefer to think of telling a story as “an open-ended contract, just like a promise or a gift,” rather than an unrippling transaction or commodity."
