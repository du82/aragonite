["https://www.are.na/editorial/algorithmic-botany"]
title = "Algorithmic Botany | Are.na Editorial"
description = "Plants, fungi, and computer programming."
full_description = "Take out a pen and some paper, or open a drawing program on your computer. Draw a line. At the end of that line, draw two shorter lines poking outward. At the ends of those two lines, draw two more lines in that vein. Continue this process until you’ve drawn a tree. Turn that drawing around and you’ll end up with a root system rather than a tree. Or perhaps your sketch grows more sideways. Sure, it could be a vine growing across a wall, but maybe at this point things start to look less like a plant and more like a diagram. By just adding a few labels, you could make your sketch into a decision tree representing the overwhelming number of life paths you didn’t choose, which landed you where you are today. Or perhaps those branches are the combinatorial explosion of possibilities that your future holds. With just a few labels, a pinch of anthropomorphization, our drawing takes on new meaning. But not all human projections onto nature are so fruitful. We also project a sanitized sexuality onto flowers. Edible plants become monocrops who live solely to serve humans, and majestic trees are commodified as carbon dioxide processors. We (now often ironically) slap the golden ratio over pictures of life where it adds little to no deepened understanding, as if its “fit” serves as evidence for some unspecified math-y-ness. In some ways, the Algorithmic Botany course that I teach at the School for Poetic Computation is an attempt to refind the rush I felt when I first learned about the golden ratio. What a wonderful idea that there’s some number that unites all the things we find beautiful. But perhaps this idea becomes dogmatic. Perhaps it implies some supremacy of the mathematic and, by extension, the human. Algorithmic botany, a field pertaining to the modeling, simulation, and visualization of plant life, was pioneered by the Biological Modeling and Visualization research group at the University of Calgary. My approach to both researching and teaching this material was initially fueled by a certain desire to emulate nature in my own generative art. I wanted to harness the power of growth patterns to make natural-seeming art, which would sort of dampen the techy-ness of making art with a computer. Even just the phrase “algorithmic botany” feels rich with tension and contradiction."
