["https://www.are.na/editorial/introducing-the-are-na-annual-2024"]
title = "Introducing the Are.na Annual 2024  | Are.na Editorial"
description = "This year’s anthology, themed “trace,” is now available."
full_description = "Today we’re publishing the Are.na Annual 2024, which you can find in the shop. To give you an idea of what’s inside, we’re running the editor’s letter below. This summer I read poet and painter Etel Adnan’s Shifting the Silence, a recommendation from Morgan Stahorn, who contributed to the Are.na Annual last year. I bought the book in anticipation of a loss and I read it only months later, in the midst of a certain grief. I had been thinking about loss as a kind of removal; a void that requires a rearrangement of the self and returns you to life changed. But Adnan, who was staring down her own death while writing the book, wrote that loss for her was not a void, but an absence that is also a “strange kind of presence.” I recognized the sentiment from a near verbatim line in Annie Ernaux’s The Years: “The strange presence of absent beings…” I mention this not to imply that this year’s Annual is about death or loss (or is as heavy as I just made the intro)—it’s not. But it is in many ways about this compelling contradiction, that absence can have a very material presence. In May, we asked for submissions that spoke in some way to the theme of trace, which we defined as “to find or discover through investigation; to copy, sketch, or superimpose; a mark, a sign, an inkling, a glimpse.” The pieces of writing that resulted explore, on their surface, topics like copying or mark-making or the process of following something back to its source. But taken together, the faint outlines of wider meanings start to form: themes like persistence through time, the layered histories of place, things invisible but felt. Many of the pieces were about traces so faint that they’re often unseen and overlooked, and yet are revealed as transformative the moment you’re prompted to notice them. A trace could be the mark, or it could be the void that makes the mark; per Adnan, it’s silence that creates the sound. Amirio Freeman illustrates this idea beautifully in an essay about a beach in his hometown in Virginia, a site of Black joy and of many of his formative memories, as well as a port where the first enslaved Africans arrived to North America. Amirio writes about how the Chesapeake Bay both makes him who he is and troubles his positionality as a Black, queer person: “On the beach, in the bay, I recognize that haunted people, with haunted origins of land, water, and sky, are the only people we can be.” Noa Mori writes similarly of place in her piece on “geotrama,” and how memories and encounters remain in our bodies and in the earth’s. As Michelle Kuan puts it in her ode to teeth as living archives, “absences [are] as telling as the records that remain intact.”"
