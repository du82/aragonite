["https://www.are.na/blog/the-instability-of-stone"]
title = "The Instability of Stone  | Are.na Editorial"
description = "Dispatches from a tombstone designer"
full_description = "“And she was born in ’39?” I confirm before showing Sue a mockup of her mother’s headstone. “Yes, on January 28th.” I turn my laptop in her direction. She checks her mother’s dates, not saying anything for a moment. Then, turning to her father, she says, “It’s amazing. All that living happens in that little dash.” Five months ago, I found this job like any other: in plain sight on the wild wild web. I can’t explain why I knew it was for me. But Memorial Designer immediately felt like a fit. I want to share about the spoken and unspoken demands of this work. Daily interaction with emotionally tender people hasn’t been easy. But poetics have lessened the debilitating effects of long term exposure to fresh grief, and in turn, have helped me to serve my community. The most central part of my job is meeting with families to design stones. (There are many words for granite memorials — tombstone, headstone, monument — but I’ll use “stone” here, as it’s the most all-encompassing.) When they arrive at the cemetery, we meet in a small conference room. I bring in my laptop. I enter into a mockup website created by a granite company. I ask the family a few formal questions about what type of granite they’d like to use and what size memorial they want. Next, I ask if they have any engraving ideas. Some families know for sure that they want an engraving of a football helmet somewhere, or that they’d like to feature a specific religious verse. If that’s the case, that’s where we start. The mockup website has a vast library of illustrations and a small typeface selection. A family tells me what they’ve considered including, I look for imagery that matches their vision, and I tinker with the composition. If they don’t have an idea to start with, I ask about their person. This is usually when the space becomes poetic. People begin speaking lovingly about who they believe their departed person was or is. Their nicknames, their mantras, their proudest titles. Sometimes they ask impossible questions about forever and afterlife. Sometimes the air in the conference room gets so thick with sadness that we can’t move on any decisions. We may schedule a meeting for another day. Most days we decide on a design without a problem. Once a design is agreed upon, I send it to the granite company and expect to have a completed stone shipped to the cemetery in a number of months."
year_published = 2023
year_updated = 2025
