["https://www.are.na/editorial/natalia-panzer"]
title = "Natalia Panzer of Refresh Gallery | Are.na Editorial"
description = "Refresh is a home gallery run by Natalia Panzer in Sunset Park, Brooklyn"
full_description = "Meg Miller: You run a bedroom gallery, Refresh, out of your apartment in Sunset Park. We’ve been talking about Sunset Park a lot in this household because we’re all thinking about moving there. How do you like it? Natalia Panzer: I love Sunset Park. I have a particularly nice situation because I live on a lovely block of brownstones on 43rd street. One side dead-ends in the actual Sunset Park. The other dead-ends in Bush Terminal Park, which is a hidden park that my roommate and I discovered one day. It’s a park right on the water. There’s a jetty you walk out into and a soccer field. MM: A neighborhood that still has a hidden park sounds so appealing to me. Just the fact that there’s any corner of Brooklyn that hasn’t been found. NP: It’s very peaceful and unusual for a part of New York. Sunset Park is also very stratified. There’s Industry City, this kind of out-of-the-way, weird, creative manufacturing hub. Then there’s a Hispanic area, and then it turns into Chinatown. The park itself is the most joyful place. It’s where everything meets. My landlord was born on the street we live on. He bought the house we’re in now and his sister bought the house across the street. NP: It was built in 1899. I did some research into it a little bit last year because my current roommate, Laura, did an art show in a little room in our apartment, which I learned was called the deadman’s room. The way our apartment is set up, we have the whole floor, so you go through the front door, and then you go through my front room to get to Laura’s annex room. There’s also a door from her room into the hallway, but traditionally it was blocked off by furniture or sealed off. Back when there were a lot of fires happening in New York, people would often get trapped in those rooms and get burned alive. NP: I didn’t even want to start a gallery. I started it as a fake thing because I wanted to rent an art video from Spain, but they only rented to institutions and galleries. But then I kind of liked the idea of running a gallery. I decided to do the first show, The Things I Own, in 3D, to “perform” a durational project I had been working on since 2014 where I kept a log of all of my objects. Maintaining the log was becoming tiring and I was considering stopping, and then right around the time of the show the webpage where I hosted the log got some kind of bug and erased a lot of the data. So, it was as if the show ended up being the reason to stop updating the log. It’s evolved very naturally from there. Laura’s second show was when I was more interested in having that little deadman’s room be the gallery space, but that seemed to be constricting so now it’s the whole apartment. I’m really just interested in the way that the apartment itself informs the artwork, not the other way around."
