["https://www.are.na/editorial/tools-for-cultural-production-the-practice-of-preserving-voice-culture-and"]
title = "Tools for Cultural Production: Archiving Voice, Culture, and Community | Are.na Editorial"
description = "Omar Mohammad, Shiraz Gallab, Florence Fu, and Darin Buzon on self-preservation"
full_description = "When I got my first job working as a designer at SFMOMA, I was proud to be doing work for the culture and communities of the Bay Area and West Coast at large. But I shortly realized that although the term “cultural institution” was heavily thrown around by the white leaders and directors of the museum, it quickly lost much of its weight. I left the museum after a year and a half, in October of 2019, to focus on my own work and to rethink what art and design in a cultural context truly meant outside the museum, cultural institutions, and academia. This triggered me to think critically about what it meant to be a cultural institution, about what culture had to do with art and design, and if the two should share any relationship at all. I began at my own cultural origins and thought about Islamic art and design from the past and the present. I dug through links, articles, images, and videos, and framed the research in this context: Islamic Art & Design Culture within the fields of typography, architecture, and design that may not exist as direct representatives of Islamic Art & Design, but as derivatives of work from Islamic countries, cultures, and languages and of the designers and architects who's origins lay in those regions. Through this research I discovered the great work of Nadine Chahine, a Lebanese type designer who’s typefaces include Frutiger Arabic, Neue Helvetica Arabic, and Univers Next Arabic, the Arabic script counterparts to the classic European heavyweights. Her 2003 typeface Koufiya was the first to be simultaneously designed in both Latin and Arabic script, creating a bridge between both languages and visual cultures. It just so happened that Nadine was teaching an Introduction to Arabic Type Design course online, so I quickly signed up. Our first assignment was to search the Internet for the places where Arabic typography shows up in the world: the Qu'ran, posters, artworks, storefronts. When we all came to class with more or less the same visual research, a discussion around the challenge of discovery arose. As a new field, Arabic type is years behind Latin type when it comes to contemporary design archives for reference and research. Nadine told us that as a new generation of Arabic type designers, we have a responsibility to keep up the important work that she and many other designers began for the culture of all languages and countries that use the Arabic script. To be an Arabic type designer today is to be an innovator of this field."
year_published = 2020
year_updated = 2020
