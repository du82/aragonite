["https://www.are.na/editorial/wikipedia-as-sacred-text"]
title = "Wikipedia as Sacred Text | Are.na Editorial"
description = "“Once you stop thinking of Wikipedia as a passive consumption space, it’s really empowering.”"
full_description = "Sharon Park: I wanna talk a little about how we met. So back in art school, I was taking a class on identity systems and was thinking about what entity I should do this huge project on…and I think I was on Wikipedia, researching brands to rebrand. At a certain point I had this moment of zooming out and thought, “oh shit, Wikipedia!” I Googled “Wikipedia rebrand” because I wanted to know what was already out there — and the first result was the wiki article on “rebranding.” It was then that it hit me: Wikipedia is that invisible. And maybe intentionally so. With the project, there was this balance of keeping the spirit of the site in its scrappiness. It didn’t feel right to make a sleeker version of it. So I approached it like how I personally experience Wikipedia, embracing all the rabbit holes and discovering its culture and rules along the way. A couple years later, I got connected to the design team at the Wikimedia Foundation, and they invited me to present the project, which was so surreal. I remember you were pretty vocal in the chat and had sent me links to some extremely important stuff (like this unofficial mascot). Carolyn Li-Madeo: Working at the Wikimedia Foundation, I see a lot of unsolicited rebrands or redesigns of Wikipedia, and they often focus on modernization for the sake of modernization. They’re not thinking holistically about Wikipedia as a community and as a project — about the editors and their needs. I think once you get into the Wiki world, it’s the people and communication and collaboration that are so fun and exciting — all of these people across the globe are working together to make this repository of knowledge. Sharon: After meeting virtually, we attended an NYC editor meetup together during Wikimania, the annual Wikimedia conference. Carolyn: How was it meeting Wikipedians in real life? Do you feel like it deepened your perspective of Wikipedia? Sharon: Definitely, it was inspiring to see how everyone enters the community through a different way, whether it be through a social lens or the super technical side. I became so aware of how much I don’t know about Wikipedia — and it wasn’t a bad feeling. How was your experience?"
year_published = 2023
year_updated = 2023
