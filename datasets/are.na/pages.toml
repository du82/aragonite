["https://www.are.na/editorial/free-school-of-architecture"]
title = "Unlearning hierarchy at the Free School of Architecture | Are.na Editorial"
description = "How a self-organized summer school is reorienting design education"
full_description = "The Free School of Architecture is an experimental, tuition-free program founded in 2016 that brings architectural thinkers to Los Angeles for several weeks of participatory learning. Four of the original participants – Elisha Cohen, Lili Carr, Karina Andreeva and Tessa Forde – took over the project in 2017 and organized the 2018 edition, which is extensively archived on Are.na. We caught up with them via email to hear their thoughts on alternative education in art and design. Leo Shaw: How do you describe the Free School of Architecture when people ask? Can you tell us briefly how it came to exist in its current form? FSA Organizers: Free School of Architecture is a collective and collaborative effort by four prior participants: Elisha, Lili, Karina and Tessa. Located in four cities in three different countries, the organizers used any free time available to brainstorm, conference call, make decisions, and eventually actuate FSA for the summer of 2018. We put together a pretty insane, six-week schedule of three to four sessions a day, six days a week, collaborating with over 55 different local organizations, individuals and advisors. Around fifty participants joined us in Los Angeles, some full-time and many part-time, throughout the summer. This tuition-free program brought together international participants with a focus on knowledge exchange and urban exploration of the city via collaboration with local groups and organizations. [The 2018 iteration] built on its inaugural session in the summer of 2017, organized by Peter Zellner, an architect and educator. While he brought together a group of people, he had no plans to continue with it. Mid-way through that summer, participants began to question what FSA should become in the future and took on organizational roles. At the end of that summer, the four of us decided to make another FSA happen the following year. We now own and run the organization. Based on our experiences as both participants and organizers, we are learning from these first two years to decide how FSA should manifest in the future."
year_published = 2019
year_updated = 2020
