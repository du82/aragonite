["https://are.na/editorial/house-wi-fi-zation"]
title = "House-Wi-Fi-zation | Are.na Editorial"
description = "The hidden costs of digitalization and its effects on those outside of labor protection laws"
full_description = "After graduating college, I worked in a cafe with a few Hispanic custodians who worked the late night shift. Their shifts started at 3pm and ended at midnight. My shifts would also start at 3pm, but end around 9pm. My Latinx co-workers were considered “back of the house,” and I was considered “front of the house.” But because I am also Latina and can speak Spanish, I could float to “the back” to update the staff on which ingredients we needed to prepare the food out front: guacamole, tomates, salsa, pán, lo que sea. Most of my day, however, was spent interacting with customers, stocking pastries, folding boxes, scrubbing the grills, and stacking the patio tables at night. Meanwhile, the back crew would deal with prepping food, washing dishes, sweeping the crumbs from corners, and mopping the floors, staying late to clean everything for the next day. Carmen was one of these Latinx workers. About my age and from El Salvador, she confided to me that she wanted to fall in love and ditch custodian work forever. She complained about her fingers aging from the bleach that she used to scrub the floors, and how she never had time to go out and buy herself something nice to wear. Once she told me, offhandedly, that when she cleans the bathrooms at night, she entertains herself by making toilet paper origami in the shape of flowers and birds. But there was desperation in her voice when she told me, “I do these stupid nice things for others and NOBODY notices them! A NADIE LE IMPORTA.” I didn’t know how to respond to this confession. I didn’t have the heart to tell her that the bakers and early shift arrived shortly after she left, hours before the cafe doors were open. When I worked as an opener, I was often the first to use the restroom, and I was the one who would often find the untouched toilet paper origami swan or boat or rose, lo que sea. Carmen wanted appreciation from our customers, not from another co-worker, but her labor and the flowers she left behind were something the customers would never see."
