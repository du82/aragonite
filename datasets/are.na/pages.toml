["https://are.na"]
title = "Are.na"
full_description = "Students, hobbyists and what we call connected knowledge collectors have been the core of our community for 13 years and 205 days. Are.na has many co-founders. Currently, a small team is building the platform: four full-time on product, engineering, editorial and operations, and one part-time exploring special projects. The company that builds Are.na is independent and sustained entirely by our members. Our only business is to make Are.na an experience that is worth paying for. The people who use it are our only customers. 16,788 people support Are.na through their Premium subscriptions. A rabbit hole is not a distraction. A rabbit hole is your brain trying to tell you to pay attention to something you’re curious about. Ignore algorithmic rabbit holes. Pay attention to what feels resonant to you. Save breadcrumbs and build a path for yourself to walk down later on. The ability to classify information in a personal way is a muscle worth exercising. Over time, build contexts for yourself and your ideas. Analyze what happens when you connect those contexts to someone else’s."
