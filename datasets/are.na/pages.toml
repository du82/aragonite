["https://www.are.na/community-guidelines"]
title = "Community Guidelines | Are.na"
full_description = "Are.na is an open-ended platform adaptable to different needs and styles of use. There’s no single correct way to use Are.na, nor to be a part of its community. These guidelines are intended to protect Are.na members from harmful behavior without undue restrictions on the types of content and behavior allowed on the platform. A number of members have put together channels sharing Are.na use cases, meetups, collections, and discussions of all things Are.na. We also provide an official channel for Feedback and Feature Requests. See our Terms of Use for more detailed legal clarification of content and use violations. We trust our members’ common sense, and don’t ban graphic or adult content. Channels that contain sexually explicit content or violence should be marked as NSFW. Keep in mind that many people use Are.na at work and mark as NSFW anything you think would be inappropriate in a public and professional setting. Do not post involuntary pornography, depictions of sexual violence, or sexual content involving or depicting minors. These forms of content violate the rules above and will be removed by Are.na staff. Channels marked NSFW will be hidden from Explore, and will not be visible in search or on your profile page by anyone who has chosen to hide NSFW content on Are.na. When we see NSFW content in public channels, we will either ask the owner to mark the channel NSFW or do so ourselves. Depending on the situation, and whether a user has previously violated our terms or guidelines, the Are.na team may: If you believe your channel has been unfairly marked as NSFW, your account has been unfairly suspended, or your content erroneously removed, you may contact [email protected] to appeal. A proper DMCA notice must be filed for any moderating actions to take place. In the case that a complaint is filed, the content in question will be assessed and, if found to violate DMCA protections, removed. Users who are found to have uploaded violating content will be provided with information surrounding the complaint, and will have the opportunity to file a DMCA counter-notice of their own."
year_published = 2025
