["https://www.are.na/blog/in-the-earth-beneath"]
title = "In the Earth Beneath  | Are.na Editorial"
description = "The difference between haunted and hunted is that there isn’t one."
full_description = "BLOOD: lay your non-dominant hand on your heart; using your dominant hand, flutter your fingers over it. This sign can, in some places, also be used for family. It was a tradition in my hometown to first be driven, then drive, around town to all the haunted spots and tell stories that were a blend of local history and the supernatural. It was called “spooking” and it was something of a rite of passage: you were about 12-13 as a passenger, 16-17 as a driver. My son was never spooked before we moved away in 2019, and it seems to be a dying art anyway; the thrill of a car dying in the woods is somewhat lessened in the smartphone era, even if said era took an extra decade to reach my town. I revisited my hometown a few years ago, and while I successfully avoided a great number of people, I found I could not avoid my own ghosts, or my own history, and I spooked my son. I took him everywhere I could think of and talked until I couldn’t: About the moonshine my sisters and I discovered buried in the cellar we weren’t supposed to be exploring. About reading the dictionary with my mom to study for Scripps, signing Prince songs instead of hymns, how she made me the same echinacea tea she makes for him when he’s sick. About bowhunting with my dad and why he calls me Wolf and what it’s like to hold a chick so gently in your hands in spring, then grip it by the neck in fall when it’s time to raise the knife. There are certain things you never learn to put down, and maybe you never should. Lord knows where I come from is hardly a kind place to land. (The difference between grace and grave is that only one was ever available to me.) You have to grow through what you go through, as they say, although there’s little patience for those of us who grew thorns. But I do believe a sentence can be kind, no matter how much blood it takes to write it. FIRE: with both hands over the chest, flutter the fingers like tongues of flame. This sign is highly contextual; it can be moved in any direction, and can increase or decrease in size."
