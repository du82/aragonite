["https://www.are.na/editorial/the-wake-and-other-ghost-stories"]
title = "The Wake and Other Ghost Stories | Are.na Editorial"
description = "On the beach, in the bay, I recognize that haunted people are the only people we can be."
full_description = "I’ve gestated in and am made of waters that have baptized, bathed, flooded, frozen, gurgled, killed, leaked, scalded, and swamped for millennia. All the water shapeshifting throughout the planet, meandering through the water cycle, embodies the past, present, and future. My origins, therefore, can be traced to three tenses, rendering me palimpsestic: an always-already ghost and a prefigurative life form. I can perhaps determine the source of my hereness by following the watery bodies I’ve encountered throughout my life: amniotic fluid, blood, breast milk, ejaculate, mucus, sweat, tears. Then there’s the Chesapeake Bay, the largest estuary in the United States, which I’ve come to know through its proximity to Buckroe Beach—a coastal destination fringing my hometown of Hampton, Virginia. Both milieus, the bay and the beach, are generative of my existence. With humanity’s “fishy beginnings” as evidence, I intuit being a variation of the Chesapeake.1 Buckroe holds the remains of my memories—of barefoot walks, covetous seagulls, runny frozen treats. The Chesapeake and Buckroe have made me, but the haunts of history they shelter also trouble my positionality as a Black, queer person. In her book In the Wake: On Blackness and Being, author and scholar Christina Sharpe writes, “Slavery’s violences emerge within the contemporary conditions of spatial, legal, psychic, material, and other dimensions of Black non/being as well as in Black modes of resistance.”2 Sharpe repositions the residue of chattel slavery—the “wake”—as ever present for Black folks, an afterlife that’s never not with and within us. While Black people invoke methods of making untenable realities more livable—tending to inchoate tomatoes, reveling in the celestiality of solitude, foraging for sweaty contact on viscous dance floors—the not-quite-past interrupts. At Buckroe, I trip on vestiges of anti-Black horrors as easily as I collect crustaceous refuse. When enveloped by the Chesapeake, I’m both enamored by its capacity to make me boundless and infinitesimal and unnerved by the bay sharing DNA with the Atlantic, that crucible of white trouble. On the beach, in the bay, I recognize that haunted people, with haunted origins of land, water, and sky, are the only people we can be. I grasp that “haunted places are the only ones people can live in.”3 I see now that everything on earth—even the planet itself—is a “container for the terror of the past and the beauty that it can’t in the end negate.”4"
