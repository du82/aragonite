["https://www.are.na/editorial/code-societies-a-speculative-oral-history-melanie-hoff-and-elizabeth-perez"]
title = "Code Societies, A Speculative Oral History: The Cybernetics of Reproduction  | Are.na Editorial"
description = "Code Societies’ Melanie Hoff talks with doula and childbirth educator Elizabeth Perez on the subject of the cybernetics of race/ism and sex/ism"
full_description = "The following interview is part of a series published with Code Societies, a three-week intensive session in January at School for Poetic Computation in New York City. Now in its third year, Code Societies explores how different platforms and processes—including algorithms, surveillance, social media, infrastructure, and interface—yield distinct modes of seeing, thinking, and feeling, and reinforce existing systems of power. It’s organized by Melanie Hoff, with Neta Bomani and Emma Rae Norton. Each year brings different possibilities, modalities, and configurations, with an impressive lineup of students and teachers from multidisciplinary backgrounds spanning computation, race-studies, performance, and cybernetics, to name a few. Code Societies culminates in a project showcase where students and friends gather to reflect on an intensive three weeks. It also has the rare effect of drawing the outside in, so that even as the cohort is selected each year through a competitive application process, the syllabi and class materials are openly accessible, and the session is carefully documented. Even those outside of the cohort can, and do, eagerly follow along. This year, Neta also organized an extensive oral history project, which brings the session’s teachers, students, and organizers together to converse and respond to the ideas presented in various classes under the theme of a speculative present and future tense hidden within the prompt of the Code Societies title: code the societies in which you want to live. You can listen to all of the oral histories in full on the Code Societies website, and read excerpts in a printed zine, which was available at the showcase thanks to designer Ritu Ghiya and publishers Irrelevant Press and Lucky Risograph. We’re also running a selection of them on the blog, starting with one between Melanie and Elizabeth Perez, a birth doula and childbirth educator, and a Code Societies student. Facilitated by Neta, Melanie and Elizabeth respond to the class “Cybernetics of Race/ism and Sex/ism” taught by Neta Bomani and Melanie Hoff. This interview was originally transcribed by Shea Fitzpatrick and Neta Bomani, and the excerpt has been shortened, edited, and annotated for clarity."
year_published = 2020
year_updated = 2020
