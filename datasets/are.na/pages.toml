["https://www.are.na/blog/wild-domesticity"]
title = "Wild Domesticity | Are.na Editorial"
description = "The mind may wander but the body still has to live somewhere."
full_description = "Along the horizon, dishes pile up in a carbon sink clogged with moral expectation. I lay my body under the geoengineered shade as a fever dream spins out of the walls, spitting bolts and cables like a tornado in protest. Yes, ever since the sourdough started en masse, my notion of stability had become a mirage and home a distant memory. I had never made a point to eat this kind of bread, pandemic or not. My housemate liked to bake and soon lined up a handful of friends scheduling pick-up orders over DMs. Her loaves sold at the price of loyalty. I enjoyed helping with the daily feedings of flour, sugar, and water, and marveled at the microbial mess of a kitchen pet seemingly spun out of nothing. These goops of small things were temperamental in a strangely therapeutic way. Their ebbs and flows seemed to materialize the desperate chaos of humans staying home to avoid other small things in the air. The pandemic still defies past or present tense three years later. Mostly, we seem to avoid discussing the staled crisis altogether. As flights take off again and technological developments promise solutions for climate and community alike, new options abound for where to settle our anxieties. Solidarity wanes along with the stimulus checks — caring about care is trite in a world where imagination itself requires funding. This is the year of rebalancing equations to get to some sensible bottom line. Are you still living in Los Angeles? I worry about this question. It is the place where I’ve been the longest, but have never chosen. The pandemic only postponed my deliberation. I spent my time trying to understand the ecology, the people, the history of the land and how it got mangled into such a frustrating layout of concrete, but the hostility of this city still manages to escape me. I struggle with the steep rent, austere policies, parking tickets, and the car itself. Like many of us, my attention moved increasingly online under lockdown. I organized experimental gatherings most weeks as part of an artist collective. We did all we could to keep digital fatigue at bay, making a point to recognize land, body, and each glitching breath. Nonetheless, my eyes began to glaze over at some point, enough to witness the screen bearing its material self as an unassuming end-point of sprawling data centers, electricity grids, metals, minerals, and mining rigs. I grew concerned with the carbon footprint of the internet, ironically set to surpass that of the airline industry. More than that, I grew concerned with our appetite for community-as-a-service. Echoing Helen Lewis’s observation of this nontrivial shift in human behavior, what do we lose as media technologies render ever more frictionless the option to bond by common interests online, rather than by geographical proximity?"
