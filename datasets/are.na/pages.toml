["https://www.are.na/about"]
title = "About | Are.na"
full_description = "Are.na is a place to save content, create collections over time and connect ideas. Privately or with other people. Students (highly curious and open to new information), hobbyists (deeply into a topic or topics, narrowly focused) or what we call connected knowledge collectors (those more experienced but highly curious information gatherers who can make disparate connections between disciplines) have been the core of our community for 13 years and 205 days. Are.na is a mindful space where you can work through any project over time. It's a place to structure your ideas and build new forms of knowledge together. *A block is an individual piece of content. Blocks can be images, text, links, attachments, or embeds. Learn more about how students and teachers use Are.na in their classes and workshops. If you're a student, you can get 50% off the price of any Premium plan for two years. If you're a teacher and use Are.na with your class, contact us for assistance and custom discounts for your students. Are.na has many co-founders. Currently, a small core team is building the platform: Charles Broskoski and Daniel Pianetti deal full-time with product and operations, Damon Zucconi leads engineering, and Meg Miller takes care of everything editorial including our Annual book. We are fortunate to have regular support and advice from past co-founders and contributors Chris Sherron, Chris Barley, John Michael Boling, J. Stuart Moore, and Dena Yago. We ask our members to pay a small subscription to help us maintain and grow the platform. In exchange for your support, we offer unlimited blocks and a growing set of extra features and tools. Currently, 16,788 people currently support via Premium our mission to build a self-sustained community for shared knowledge. In 2018 we ran a crowdfunding campaign where 850 people invested on Are.na, ~75% of those who invested were already members of our platform. We rely on no other external funding. Here you can see what we’ve shipped recently, what we’re building next, and how we’re doing as a company."
