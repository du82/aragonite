["https://are.na/blog/an-interview-with-maya-man"]
title = "An Interview with Maya Man | Are.na Editorial"
description = "About her new space HEART and being a fan <3."
full_description = "News of Maya Man’s new space HEART reached me piecemeal, at first mostly through Instagram, then through stories from friends who had been there the night before and continued to go with increased frequency. It felt, from afar, like something was going on there every week: Mindy Seu performing a lecture on the sexual history of the internet, Cory Arcangel playing Majerus, Maya Ben David on Super Saiyan Feminism. The programming was clearly resonating with people interested in software art and internet culture in New York; the place was always packed. I went to HEART for the first time in mid-December, when we held a launch party for the Are.na Annual there. A couple of weeks before that I got on a call with Maya to get the full picture of what she was doing with the project space. I’m a fan of Maya’s work, the way she uses the language, aesthetics, and structures of the internet to examine the ways we form a sense of self online. Maya is a fan of many other artists working in a similar realm, and wanted to provide a place for those artists to coalesce. I think it might be this ethos of networked fandom that has made HEART’s programming feel so fun and thoughtful and inviting. Maya makes running a space look effortless, but running a space is not like that — it’s more like endlessly completing a thousand small tasks in order to tenuously (and generously) maintain an infrastructure for things to happen inside of. So I wanted to ask her about that, too. Maya Man: It’s all been very serendipitous. I had started to think about it while I was in Los Angeles for grad school, but it got more serious once I moved back to New York. I wanted to start a project that was more curatorial because I spend so much time looking at art online and going down rabbit holes of the artists I love. I wanted to put together screenings or shows or events that brought together artists who are, to me, clearly in conversation. I was frustrated that there weren’t many group shows that I felt were almost obvious given the cohort of artists I was seeing, especially artists who work with the internet or with software. There aren’t very many galleries or institutions putting on shows with artists who are working with that medium, and a lot of the institutional shows that I did see were looking backwards to the history of computer art or net art. That’s understandable, but I also feel excited about what artists are making right now. So I wanted to start a more curatorial project that focuses on showing that work."
