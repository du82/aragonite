["https://www.are.na/blog/asdfghjkljljlkgjl"]
title = "ASDFGHJKLKGJL | Are.na Editorial"
description = "The keyboard smash remains an apt summary of fandom."
full_description = "The keyboard smash remains an apt summary of fandom. The deeply affective nature of fandom might be triangulated somewhere between devotion, desire, and duty, but, as the keyboard smash demonstrates, it’s ultimately inarticulable. Being a fan means feeling something pure and intense. It means being deeply affected by someone you’ll never know. Being a fan means feeling a sense of obligation — to promote the media you love, to support its creators financially, to make works in their honor. In her book, Everything I Need I Get from You, about fangirls and internet cultures, Kaitlin Tiffany describes her personal pilgrimage to the Harry Styles vomit shrine, a particularly infamous artifact within One Direction fandom lore. It’s a great example of how even the most banal sites can become extremely resonant within a fan community through social contagion. Basically, Harry Styles was once photographed vomiting by the 101 freeway in Calabasas, and a fan recognized that particular stretch of freeway, went there, and put up a sign that read “HARRY STYLES THREW UP HERE” to memorialize the occasion. This would later be dubbed, semi-officially, the Harry Styles Vomit Shrine. In devotional contexts, even a piece of cardboard can be, literally, monumental. The shrine operates at a nexus of sincerity and absurdity. Fans recognize that a roadside sign to Harry Styles’ puke is funny, but also that the expulsion of such a rare substance (said puke) is an event worthy of remembrance. The Harry Styles fandom is so dedicated, that any type of output from him will fall under scrutiny and consideration. The labor of listening to his new music, of watching all his interviews, of commenting on the little details that only fans would notice — this is the project of reading (and writing) the “text” that is Harry Styles. Even the vomit is a part of his expanded oeuvre. Memorializing it becomes an important point of cultural production for the greater fandom community. It’s a common rhetorical move to conflate fandoms with religious fervor, in ways that have been problematized both for framing fandom as inherently irrational, and for reifying Enlightenment ideas of a rational-emotional binary. The metaphor frames both fandom and religion as the irrational other, without a place in secular life."
