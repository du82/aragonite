["https://are.na/editorial/ephemera-a-rock-collection"]
title = "Ephemera: A Rock Collection | Are.na Editorial"
description = "In the beginning, there was magma."
full_description = "La Piedra Escrita de Jayuya (“the rock with writing”) is a doodled boulder resting on a river stream. It’s carved with Indigenous petroglyphs—swirls, spirals, and rounded shapes that seem to surface from deep within the rock. A local Puerto Rican landmark, the Ceramic Age stone carving is believed to “have been drawn by people hanging over the top of the rocks,” as one researcher speculated. It is not known exactly when or by whom these carvings were made, nor do we know what they represent. Our best guess is that these are traces of the Taino or related Arawak peoples, the archipelago’s first human inhabitants. We know that for the entire history of Puerto Rico (the colony, not the land), it had been decided that those who made those traces and many like it were extinct. Their lineage, say the history books, reached a natural end shortly after the Spanish invasion in the sixteenth century. But in the late twentieth century, an increasing number of Puerto Ricans began to identify as Taino. On the archipelago and across the diaspora, people were remembering, reclaiming, reimagining, and sometimes reinventing a Taino heritage to claim as their own. On the internet, neo-Taino enthusiasts erroneously claim as Taino a range of footage, images, or artifacts belonging to other native peoples (from other parts of the world), birthing what I jokingly call Taino Mythology², mythology about Taino mythology. Art historian Jussi Parikka writes, “humans leave their mark, and the earth carries it forward as an archive.” But a carved stone is like a school chalkboard: Michelle wuz here. It carries the mark until it can’t be carried any further. Until wind brushes it off or water washes it away. Rocks experience time differently. To the earth, millennia-old etchings might count as ephemera left behind by an ephemeral people, who were once thought to be extinct only to be reborn centuries later. If you Google “Puerto Rico gold” today, you’ll find ways to hunt for gold from sources like findinggoldincolorado.com, RareGoldNuggets.com, and treasurenet.com (“GOLD IN PUERTO RICO!!!!)”). The Spanish first arrived in 1493, and by 1503 colonizers enslaved the local people and started prospecting for gold. Five years later, the governor reported that over one million ounces of gold had been extracted from Puerto Rico in just that fifth year. This was the beginning of Taino extinction. But they weren’t just lost to slavery. Their societies were upended, their agricultural practices derailed, and they began to starve, die of illness, and even commit suicide."
