["https://www.are.na/editorial/ida-c-benedetto"]
title = "Ida C. Benedetto: “What Is An Archive For?” | Are.na Editorial"
description = "Expanding on Benedetto's talk at SYPartners on archival practice and knowledge management."
full_description = "This conversation expands upon a talk Ida C. Benedetto gave on archival practice and knowledge management at SYPartners, as part of a night of discussion hosted by Are.na and SYPand. Leo Shaw: I really liked the story you shared in your talk about handling these precious photo negatives in the Magnum Photos archive and being responsible for their survival. I think you described that encounter with primary sources as “listening to the contents of the collection.” I’m curious how we can continue to have that experience nowadays with non-physical media. Ida Benedetto: I think that broadly, there are two modes of listening. There’s focused listening where you’re actually searching for something. Even if you’re not entirely sure what it is you’re searching for, you have a sense of it, and by engaging with a rich source of content you’re helping yourself refine and hone that sense, whatever that is, until you find the thing. Then there’s a broader, expansive listening, when all you have is a starting point from which to explore. This kind of listening is about diving in to all this stuff that’s there and seeing what comes up. When I was in the Magnum Photos archive, I was doing an expansive listening. The reason I was in there was for a purely mechanical reason. Nobody cared what I thought of what was in there. I didn’t even have a particularly strong starting point, so encountering all of the content created this very expansive sense around the many moments in history that were represented by the photographs. The challenge that we have now with so much digital material so easily accessible in huge volumes is that we tend to skip the listening because we have to. There’s just too much there. I wonder if in the past, encountering a really rich trove of content was a little more special and specific such that clicking into that listening was a much easier thing to do. IB: Yes, totally. You would be with stuff of some sort, even if it was mediated stuff or written content. Your physicality was implicated in it, whereas now that physicality piece of it has fundamentally shifted. It’s not a given anymore."
year_published = 2018
year_updated = 2020
