["https://are.na/editorial/these-hollow-renderings"]
title = "These Hollow Renderings | Are.na Editorial"
description = "How Bruce Lee’s posthumous image lives on in deepfakes and bad reproductions."
full_description = "There is, of course, the matter of appearance — the shaggy mane and sharp mandible, the taut musculature and furrowed brows. But these details are almost extraneous, mere accessories to adorn his movements. The true marvel of Bruce Lee is his gestural charisma: the snake-charmer swagger that, when directed against his enemies, distracts from the snakelike speed of each punch and kick. He wields his strength like a switchblade, controlled and deadly. Devoted fans are familiar with this fatal dance between hero and villain. Lee, always the hero, will inevitably triumph against all odds. Lee died in 1973, on the brink of international stardom. At thirty-two, he didn’t live long enough to triumph in Hollywood, but death immortalized him as a Hollywood legend. When Lee died, he had about thirty acting credits to his name, having started early as a child actor. Only four, however, were for movies in which he was the leading man, flexing as the martial arts genius that he is posthumously recognized as: The Big Boss (1971), Fists of Fury (1972), Way of the Dragon (1972), and Enter the Dragon (1973). The films arrived in quick succession, one after another, as studio executives sought to capitalize on Lee’s insurgent popularity. Still, they were low-budget, schlocky flicks with few noteworthy qualities. The fight sequences easily blur together, the dialogue is poorly dubbed, and the villains and the storylines are cut from the same archetypal cloth. I don’t remember the names of any of Lee’s characters, nor the particularities of the plots. All I care to remember is Lee—almost always shirtless and always kicking ass. One watches Bruce Lee to witness the miracle of his mortal body. His deft command over every movement transforms flesh into an instrument of pure expression. For most on-screen actors, the face is the primary vehicle to articulate emotion; the camera lingers on it to capture the feelings it invokes. Lee did not privilege the face, though it was no less important1 than his limbs in the kinesics of his acting. Yet his face is what we covet, for it confirms what his body’s fluid magnetism already implies: He is not just any Asian actor, any martial arts fighter. He is Bruce Lee."
