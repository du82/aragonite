["https://www.are.na/editorial/it-became-a-ritual"]
title = "It Became A Ritual  | Are.na Editorial"
description = "“I wanted us to leave something every day—it didn’t matter what it was.”"
full_description = "Ariel Dong: I think we can start by sharing a little about how we met, how we perceived each other, and how we ended up being as close as we are. Ariel: We were both freshmen at RISD, we had the same classes, but we didn’t talk to each other for like, half the semester. And I remember the first time we talked it was 3 am in the studio. You asked me what music I liked. When I first met you, you were intriguing to me because I wanted to be like you. There was this aura and confidence that surrounded you that I looked up to. I kept saying to myself, “There’s no way I’ll ever be that cool or confident in myself or my work.” I was intimidated by you. Ariel: I love that! I love her! I mean, I told you before but I was equally intimidated by you, your silence, and this intense look you always have. I couldn’t even go up and ask “How are you?” You had this drive I had never seen before. As intimidated as I was, I admired you just as much. What I’m interested in is the first time, or what I remember as the first time, our relationship went beyond that. It was when you were going through a breakup... That was the first time I felt like our relationship became non-transactional. Before that, it was always centered around us competing in the studio, right? We were supportive but competitive, and it was transactional because every time we met, we were both trying to gain something from one another, like how to improve our work by observing the other person. So up until that night—me coming over to talk, having no expectations of what was gonna come out of it, just wanting to be near you, that was it for me. I felt vulnerable, we sat and shared deep, personal stories. And when I left I was ok not having taken anything away from you. Njari: That moment laid the groundwork for our friendship for me. Both of us, in my room, watching Master of None, eating ramen, taking comfort in one another. That moment felt comforting and familiar: eating and watching TV. And as weird as it sounds, that might have been the first time I did that willingly. I remember saying to myself “I am sad,” and then asking if you wanted to watch this stupid show because I wanted to forget about everything."
