["https://www.are.na/editorial/reanimation"]
title = "Andrew Beccone of Reanimation Library | Are.na Editorial"
description = "An interview with Andrew Beccone on the generative potential of libraries and facilitation as art."
full_description = "In the back room of Pioneer Books, the bookshop outpost of the Pioneer Works art space in Red Hook, Brooklyn, floor-to-ceiling metal shelves are currently lined with books from the Reanimation Library. They have titles like Basic Radio, A Sloth in the Family, Tub Farming, and 1966 Report on the Measurement of Roundness, typically with a publication date somewhere in the 1940s-1980s range, and interior pages heavy with images. Andrew Beccone has run the library since 2002, initially out of artist-run space Proteus Gowanus, then institution-hopping from MoMA to the Queens Museum to Pioneer Books, in a series of residencies. Equipped with a scanner, a fully digitized catalog, and a Library of Congress classification system, Reanimation Library’s collection—culled from thrift stores, flea markets, municipal dumps, library sales, and used bookstores across the country—aims to provide a resource for the production of new creative work and to call attention to the “generative potential of libraries.” Meg Miller: At this point, you’ve been running Reanimation Library for 16 years. How did it start, and how did it expand? Andrew Beccone: I can trace its origins back to a book that I found called The Behavior of Man. It’s a psychology book from 1956 that I found in a thrift store in St. Paul, Minnesota, in 2001, and I was captivated by the quality of the images. I was working at the Minnesota State Legislative Reference Library at the time, and I was using their books and photocopiers to do these photocopy manipulations when I should have been doing work. I had gotten pretty familiar with the DNA of their collection, and when I found this book I had this little epiphany: If I’m sourcing all of this material from library books, maybe I should start collecting books myself and start my own library. I started going to library book sales and spending a lot of time looking through books at thrift stores. I was looking for interesting images, images that I’m attracted to, images that I felt that I might either want to reference or harvest or somehow use in the creation of a visual. In the first year I collected probably 50 books or so, and I kept them in my apartment. Opening up the library as a public resource came later, and it was partly inspired by a visit to the Museum of Jurassic Technology in Los Angeles, and partly inspired by the DIY scene in Minneapolis, where I’m from. In Minneapolis, if you want to start a band, you start a band, or you need a space, you open a space. The Museum of Jurassic Technology was like a cultural version of this—an individual just runs the museum; this is not the Smithsonian. So it all clicked together. I just thought, “I can just make a library.”"
