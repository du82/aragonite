["https://www.are.na/editorial/holding-hands"]
title = "Holding Hands | Are.na Editorial"
description = "On meeting online, dating during a pandemic, and growing an internet garden together—an Are.na love story"
full_description = '''Lily: So we're going way back. Our first interactions online were from last November. I posted something shitting on your former employer. Do you want to talk about it? Fiona: My former employer Tweeted out some pretty centrist thing about how they're the future of politics and the intersection of boba. And Lily said "Quickly, welcome to the resistance," and I said “Wow, that blew up." I was embarrassed on their part. Lily: Boba Guys...people associate them as one of the faces of Asian American culture. For them to say, “We're not going to take a side on politics” was pretty disappointing. It’s erasing the fact that so many Asian American people come to this country without papers, and ICE is after them, and all the other struggles minorities deal with on the day-to-day. It’s upsetting to me. Fiona: Their injection of centrist politics within the company was disappointing to me, too. A lot of employees felt the same. Fiona: I just started reply-girling to you. You posted these beautiful photos that you took on film and I thought they were cool. I didn't know you at all—just as an internet mutual. I saw your funny tweets and thought, "She's cool. I should probably interact with her more.” Lily: At some point, we went to the same conference, and I remember seeing you on Hinge. There were so many missed connections, if you think about it. Lily: I did, I went to fucking Boba Guys in Hayes Valley every Friday after therapy to cry my eyes out. Lily: So you slid into my DMs and the week after, I tweeted, "Anyone want to catch feels and uhhhhhhhh collab an Are.na board together?" We dm'd about that and we actually did end up making that Are.na channel. We were talking and I said, "Hey, I know you play Animal Crossing!" I was supposed to have a friend over to my island that day. And she didn't show up and so it was just us two. That was our first date. Fiona: We were talking over the Nintendo voice call thing but it kept bugging out. I said, "Okay, I'm just gonna FaceTime you. Here's my number." We FaceTimed until midnight.'''
year_published = 2021
year_updated = 2021
