here.transform.position; AqHold aQuadHold = new AqHold(); aQuadHold.go = aQuad; initAqHold(aQuadHold); aQuadHold.md.Copy_MeshDraft(asi.HexQuads[hHaddress].mdH); aQuadHold.md.Rotate(argosSphere.transform.rotation); aQuadHold.go.GetComponent<MeshFilter>().mesh = aQuadHold.md.ToMesh(); aQuads.Add(aQuadHold); } public void lightHex(int hHaddress, GameObject hexPrefab, Color col) { GameObject aQuad = Instantiate(hexPrefab); aQuad.transform.SetParent(argosSphere.transform); aQuad.transform.position = argosSphere.transform.position; AqHold aQuadHold = new AqHold(); aQuadHold.go = aQuad; initAqHold(aQuadHold); aQuadHold.md.Copy_MeshDraft(asi.HexQuads[hHaddress].mdH); aQuadHold.md.Rotate(argosSphere.transform.rotation); aQuadHold.md.Paint(col); aQuadHold.go.GetComponent<MeshFilter>().mesh = aQuadHold.md.ToMesh(); aQuads.Add(aQuadHold); } public void lightHexDuration(int hHaddress, GameObject hexPrefab, Color col, float duration) { GameObject aQuad = Instantiate(hexPrefab); aQuad.transform.SetParent(argosSphere.transform); aQuad.transform.position = argosSphere.transform.position; AqHold aQuadHold = new AqHold(); aQuadHold.go = aQuad; initAqHold(aQuadHold); aQuadHold.md.Copy_MeshDraft(asi.HexQuads[hHaddress].mdH); aQuadHold.md.Rotate(argosSphere.transform.rotation); aQuadHold.md.Paint(col); aQuadHold.go.GetComponent<MeshFilter>().mesh = aQuadHold.md.ToMesh(); aQuadHold.lifeTime = duration; aQuadHold.isTimed = true; aQuads.Add(aQuadHold); } public void lightQuadDuration(int LLAdress, GameObject quadPrefab, Color col, float duration) { GameObject aQuad = Instantiate(quadPrefab); aQuad.transform.SetParent(argosSphere.transform); aQuad.transform.position = argosSphere.transform.position; AqHold aQuadHold = new AqHold(); aQuadHold.go = aQuad; initAqHold(aQuadHold); aQuadHold.md.Copy_MeshDraft(asi.LLQuads[LLAdress].mdQuad); aQuadHold.md.Rotate(argosSphere.transform.rotation); aQuadHold.md.Paint(col); aQuadHold.go.GetComponent<MeshFilter>().mesh = aQuadHold.md.ToMesh(); aQuadHold.lifeTime = duration; aQuadHold.isTimed = true; aQuads.Add(aQuadHold); } } Add: Argos Utilities Class Include: void LightHex(int hAddress, Color col); void LightHex(int hAddress, Color col, float duration);'''
