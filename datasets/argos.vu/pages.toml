["http://argos.vu/kristian-birkeland"]
title = "Kristian Birkeland – ArgosVu"
full_description = "Kristian Birkeland December 15, 2017 The professor whose face is emblazoned on the Norwegian 200-kroner banknote was forgotten for nearly 60 years. Today he is considered one of Norway’s greatest researchers ever. Norwegian professor Kristian Birkeland (1867–1917) was the very first scientist in the world to realize that the northern lights had something to do with the electromagnetic storms from the sun. He was also the man behind the fantastic invention that enabled the making of fertilizer by harvesting nitrogen from the air. The discovery was the basis for the foundation of Norsk Hydro and the industrial bonanza at Notodden and Rjukan. Last, but not least: Birkeland was responsible for 60 new patents for everything from margarine and caviar to an elctromagnetic cannon. But most important from our perspective today is perhaps that he laid the foundation for much of the modern research conducted in the field of space and solar physics. Despite Birkeland’s trailblazing inventions, he was nevertheless almost relegated to oblivion. Unfortunately, he was unable to prove his spectacular theories pertaining to the northern lights. International scientists of stature protested vociferously against Birkeland’s theories. Forty years after his death, he was scarcely mentioned in the textbooks used at the University of Oslo (UiO). It was only later, when it became possible to perform measurements from satellites in space, that his northern light- and disturbances in Earth magnetic field – theories, were confirmed. For the past twenty years, his face has adorned the Norwegian 200-kroner banknote, although few people have paid much attention to the figure on the widely used banknote. The UiO is now planning to celebrate the 150th anniversary of the professor and inventor with a number of events in both Norway and Japan. Although Birkeland is beginning to be recognized and has become the subject of much writing, there are still many anecdotes from his life as a researcher that the general public has not yet heard. A scientific goldmine One person who knows very much about Birkeland is Professor Emeritus Alv Egeland (85) of the Depatment of Physics. Egeland was involved 50 years ago in arranging the centennial observance in honour of Birkeland, in 1967. He has also authored several books on Birkeland. The Scottish and German physicists James Maxwell (1831–1879) and Heinrich Hertz (1857–1879).were two sources of inspiration for Birkeland. Both were leading authorities in the field of electromagnetism. Maxwell was the theoretician. He described how electromagnetic waves move and spread. Hertz was the experimenter. He managed to test Maxwell’s theories in practice. “Electromagnetism became a new-found goldmine for young Birkeland. Already as a schoolboy he had bought his own magnet – with his own money. He used the magnet for many surprising experiments and practical jokes during school lessons. Not all of Birkeland’s teachers were impressed with his experiments.” Later in life, Alv Egeland relates, Birkeland’s studies of electromagnetism and the Earth’s magnetic field would become the most important contributions of his research. As soon as Birkeland had graduated from university, he began experimenting with electrical oscillations along a metal wire. In 1895 he began pioneer studies of cathode rays, a stream of electrons in a vacuum tube that occurs through high voltage passing between negative and positive charged electrodes. “Birkeland concluded that the cathode rays consist of electrically charged particles and can be controlled by a magnetic field.” Created artificial northern lights During the next year, Birkeland became interested in the connection between sunspots and the northern lights. He used cathode rays to create artificial northern lights in a laboratory, and he concluded that the aurora borealis is caused by electrically charged particles from the sun that are guided into the polar atmosphere by the geomagnetic field around the Earth. He was also of the opinion that the atmosphere consisted of vast numbers of electric particles. “Birkeland’s northern lights theory was based on electromagnetic forces in space, from the sun. How he came upon the idea is still a mystery. Birkeland’s hypotheses were not confirmed until the space age, some sixty years later. Even today, more than fifty years after the dawn of the space age, his visionary far-sightedness is impressive,” Egeland says. It was not until the 1970s, at a time when it was possible to carry out exact measurements via satellites, that Birkeland’s theories were proved to be correct. Particles from sun storms strike the Earth with violent force. The particles are slowed down by the ionosphere. This friction transfers so much energy to the particles in the atmosphere that they light up. Before Birkeland arrived on the scene, many researchers thought that the Aurora Borealis was caused by a special northern lights gas, particles containing iron, local electrical currents in the atmosphere or meteor dust. “Although Birkeland’s hypothesis was the first realistic theory pertaining to the northern lights, the explanation for the various shapes, colours, movements and altitudes of the northern lights had to be left to space-age researchers.” Birkeland experienced very little support during his lifetime, particularly from the foremost researchers in England. They were not convinced that the sun was the source of the northern lights. We will come back to this tremendous criticism below. This is a tale describing how renowned researchers kick the legs out from under innovative ideas that depart from generally accepted, mainstream notions. But first, let us enjoy some entertaining details based on his experiments. Recreated the universe Birkeland made reproductions of the solar system and the Earth in a vacuum chamber. These were called the Terrella experiments. The term terrella is Latin and means ‘a small model of Earth’. “The experiments were time consuming. It took several days to create a vacuum in the chamber. He placed an electromagnet inside the terrella. With this, he was able to produce artificial northern lights. But there are some misconceptions in the anecdote about Birkeland. The first experiments involving artificial northern lights were conducted inside a discharge tube,” Alv Egeland points out. During the ensuing years, Birkeland made newer and better terellas. “The experiments were brilliant, not least taking into account that science at the time had not defined electrons as separate particles,” Professor Jøran Moen in the Physics Department explains. The mass of the universe in the largest terella model was approximately 1000 litres. Birkeland shot clouds of electrons at “Earth” with electrical current from a generator. The voltage was 25,000V. That is more than one hundred times the voltage in your household outlet. “Birkeland gradually became increasingly interested in the sun, the comets, the rings of Saturn, outer space and the origin of the physical world, which he wrote much about in his 850 page major research contribution,” Alv Egeland says. His experiences were far from an inexpensive pastime. They were costly to conduct. This was a time when Norway was a poor country and the university had little money. “His wages from the university were insufficient. He covered the major part of the costs himself, and he spent his personal earnings from Hydro to finance the laboratory and the wages for the six to eight assistants he employed. Oslo University Rector Sem Sæland, presiding from 1928 to 1936, would say that no other employee had ever spent so much of his own salary on research he conducted himself.” Strenuous winter One of Birkeland’s greatest wishes was to determine the altitude of the northern lights. There was during an era when the northern lights were thought to descend all the way down to treetop level in Lappland. We know today that the northern lights are created several hundred kilometres above ground level. To discover this, Birkeland had a research station built on top of the Samis’ “Sacred Mountain” Haldde, at almost a thousand metres above sea level overlooking Kåfjord in Alta. [google_maps id=”10401″] The ascent was strenuous. At the time, the trek on foot took about four hours. When they were trying to find the most suitable summit for a new observatory, they came close to perishing in a blizzard. Brikeland spent the winter on the summit of Haldde with two assistants. There were storms or hurricane gales every other day. Several of their scientific instruments were destroyed and had to be repaired. Smoke flow reversal from the coal stove would fill the dwelling with fumes. They moved from place to place on skis, snowshoes and crampons when conditions were icy. One of the assistants died in an avalanche in March. Ten years later, Birkeland built a more comfortable and larger observatory at the top of Mount Haldde. During the period 1912–1919, seventeen persons lived on the mountaintop, seven of them children. Three of the these were born up there. During this period, the research stations were also used for meteorological observations. Although the northern lights never even grazed the summit of the mountain, Birkeland continued his research, tirelessly and with renewed perseverance. Deafening noise One of his great sources of pride was an electric cannon he made. It was meant to be fired, but using electricity instead of gunpowder. Ten kilo pieces of iron were propelled out of the cannon’s mouth at such velocity that they exited with the force of bullets. Kaiser Wilhelm of Germany hoped that the invention would revolutionize warfare. The French Ministry of War was very interested in Birkeland’s cannon. The cannon was publicly tested in 1903 in the venerable banqueting hall, now known as the Old Banquet Hall in the Domus Academica building on Karl Johan gate. The test firing was a failure, but it marked the beginning of the largest industrial adventure in the history of Norway. There were great expectations. The banquet hall was filled with guests. Two cabinet ministers and representatives of industry were present – along with agents from the international arms industry. Fridtjof Nansen observed the proceedings attentively from the first row. “The projectile to be fired from the cannon weighed ten kilogrammes” Birkeland reassured the assembly: “You can sit calmly, Ladies and Gentlemen. When I turn the switch on, you will neither see nor hear anything but the sound of the projectile striking the target.” He then flipped the switch, Egeland relates in his book titled Natural Scientist and Industrial Researcher Kristian Birkeland. There was a deafening, crackling and sputtering commotion. The cannon had short-circuited. Flames spewed out of the mouth of the cannon. Some women shrieked and «squealed out of fear», and for a moment there were signs of panic in the hall.. “It was the most dramatic incident in my life. With that single shot, my shares plummeted from 300 to zero, but the projectile struck the target,” Birkeland commented afterwards. When he had tested the cannon earlier the same day, everything had functioned as intended. “The attention attracted by the event was predictably negative, but Birkeland got considerable enjoyment out of the uproar,” says Alv Egeland. The electric inferno that shot out of the cannon had a temperature of more than a thousand degrees and was later called Birkeland’s ‘plasma arc’. The high temperature is due to electrically charged particles shooting back and forth at high speed. “Electrons in motion result in intense electrical currents surrounded by a magnetic field. This resembles a solar wind plasma in the cosmos.” Birkeland soon observed the unanticipated. In the coil’s magnetic field, the electric arc from the short-circuiting spread out in a fantail shape – and herein lies Birkeland’s discovery. “The fiasco was forgotten. From this point on, Birkeland was interested in the electric arc,” Alv Egeland writes. Founder of Norsk Hydro The cannon experiment led to unanticipated consequences. Some years earlier, the British researcher Sir William Crookes had alerted the scientific community to the scarcity of calcium nitrate in the world, one of the main ingredients in the manufacture of fertilizer. Crooke’s idea was that a solution to producing fertilizer could be fond in retrieving nitrogen directly from the air. He thought that this would be one of the greatest inventions in the future and could save the world from impending famine. The failed cannon firing in the venerable Old Banquet Hall became precisely the foundation for modern fertilizer production. The shape of the light arc confirmed some of the theories that Birkeland had already conceived. The light arc was able to break the triple bond in the nitrogen molecules. The torch-like flame produced nitrogen oxide, which is the basic compound in saltpetre and a key element in fertilizer. Scientists and industrialists throughout the world had been on a quest to find a solution. Birkeland pipped them all at the post. The discovery was a cornerstone in the founding of Norsk Hydro. Artificial production of saltpetre demanded enormous amounts of energy. Norway was richly endowed with waterfalls. Consequently, the price of electricity was low. “This is a fantastic story. Norsk Hydro would perhaps never have seen the light of day without the accidental explosion in the Old Banquet Hall. Such is the world of research. Ideas suddenly simply occur,” says solar researcher Pål Brekke, Senior Advisor at the Norwegian Space Centre. Although the unsuccessful experiment in the Old Banquet Hall has gone down into the history books as precisely the day the idea occurred to Birkeland, Alv Egeland points out that Birkeland had possibly already thought of the idea prior to the failed demonstration. Birkeland met industrial entrepreneur Sam Eyde at a dinner hosted by Cabinet Minister Gunnar Knudsen three weeks before the short-circuit accident in Domus Academica. “Sam Eyde was a formidable driving force. He was already negotiating with the Germans to manufacture fertilizer from the atmosphere.” Sam Eyde and Birkeland took to one another immediately. Birkeland began at once conducting experiments at the university. At the time, Eyde was one of Norway’s most famous men. The media pursued him closely. “He was well aware of how to capitalize on an event.” The explosion in the Old Banquet Hall was alluring bait for the media. At any rate, when the discovery began bearing fruit, “Birkeland’s discovery and collaboration with Eyde marked the start of the industrial bonanza atNotodden and Rjukan. Eyde became «royalty» at Rjukan and was many times more famous than Birkeland,” Alv Egeland underscores. Sad fate During the last five years of Birkeland’s life, he was fascinated by zodiacal light, a peculiar glimmering light at the equator that is only one millionth of the lumi"
