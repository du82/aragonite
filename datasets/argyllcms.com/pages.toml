["https://argyllcms.com/doc/ArgyllDoc.html"]
title = "Argyll Documentation Top"
description = "Root of Argyll CMS documentation"
full_description = '''This is Version 3.3.0, a bug fix and feature update to release V3.2.0. The first public release of icclib was in November 1998, and of ArgyllCMS was in October 2000. Code development commenced in 1995. See Changes Summary for an overview of changes since the last release. Changes between revisions is detailed in the log.txt file that accompanies the source code. Please note that instruments are being driven by ArgyllCMS drivers, and that any problems or queries regarding instrument operation should first be directed to the Argyll's author(s) or the Argyll mailing list, and not to any other party. If you've decided to buy a color instrument because Argyll supports it, please let the dealer and manufacturer know that "You bought it because ArgyllCMS supports it" - thanks. Please note that instruments are being driven by ArgyllCMS drivers, and that any problems or queries regarding instrument operation should be directed to the Argyll's author(s) or the Argyll mailing list, and not to any other party. There is a list of contributed ccss (Colorimeter Correction Spectral Sample) files for some displays. There is a list of contributed ccmx (Colorimeter Correction Matrix) files for some display/colorimeter combinations. Please note that if you wish to incorporate or make use of the code in commercial or non-GPL products, that you will need to negotiate a commercial license to do so. Many portions of the ArgyllCMS code are very technically specialized and took a great deal of expertise and time to develop and maintain, and licensing cost will reflect this. Successfully negotiating a commercial license is not certain, so it is strongly advised that commercial or non-GPL products making use of ArgyllCMS not be developed until such a licensing agreement is in place. The ArgyllCMS is Copyright 1995 - 2024 Graeme W. Gill, and is made available under the terms of the Affero GNU General Public License Version 3, as detailed in the License.txt file. Documentation is licensed under the terms of the GNU Free Documentation License, Version 1.3. The author asserts his moral rights over this material in relationship to the attribution and integrity of these works. In particular, if these works are modified in a way that materially changes their functionality, then the modified works should be renamed in a way that clearly distinguishes them from "Argyll" or "ArgyllCMS" so that the effects of such changes do not reflect on the original works integrity or the original authors reputation. A subset of files (those that are related to the color instrument drivers, and are collected together into the instlib.zip archive by the spectro/instlib.ksh script + xicc/ccmx.h and xicc/ccmx.c) are licensed under the General Public License Version 2 or later, as detailed in the License2.txt file.'''
