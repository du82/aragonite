full_description = "The ETN36-030 is a powerful transistor module made by Fuji Electric. It's designed to handle high electrical currents, making it ideal for industrial machines like motor drives, power supplies, inverters, and welding equipment. Even though it's no longer being produced, many businesses still use it to keep their existing systems running smoothly. The ETN36-030 is a high-power bipolar transistor module manufactured by Fuji Electric Corp. of America. It features an NPN silicon transistor with a maximum collector current of 300A and a collector-emitter voltage of 320V, making it ideal for demanding power applications. Housed in a rectangular, flange-mount plastic/epoxy package, it offers three solder lug terminals and a power dissipation capacity of up to 1500W. This module is commonly used in industrial machinery, manufacturing plants, and high-power electrical systems due to its durability, reliability, and compact design. Despite its lightweight build of approximately 0.3 kg, it ensures efficient performance in high-load conditions. Although the ETN36-030 has been discontinued, businesses and repair shops still seek it for legacy system maintenance and upgrades. Secure your bulk order today to ensure availability and uninterrupted operations in your industrial applications! The ETN36-030 is made by Fuji Electric Corp. of America is a leading subsidiary of Fuji Electric Co., Ltd., a globally recognized Japanese company specializing in power electronics, industrial automation, semiconductors, and energy solutions. Founded in 1923, Fuji Electric has built a strong reputation for high-performance power semiconductor devices, including IGBT modules, bipolar transistors, rectifiers, and power supply solutions.The company serves a diverse range of industries, including manufacturing, energy, transportation, and industrial automation. • Darlington Configuration: Incorporates a Darlington pair with built-in diode and resistor for enhanced performance. • P