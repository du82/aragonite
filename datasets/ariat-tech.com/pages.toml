description = "The Vicor VE-260-IU-S is a DC-DC converter from the VI-200 Series, designed to take 200-400 VDC input and provide a stable 5VDC output at up to 200W. It features high efficiency (up to 90%), built-in protection (overvoltage, overcurrent, overtemperature, and short circuit), and a compact full-brick design. Although now obsolete, this converter was widely used in industrial automation, telecommunications, medical devices, and aerospace due to its reliable power delivery. This article covers its features, applications, alternatives, specifications, operation, and common issues, helping you find suitable replacements and understand how to maintain performance."
