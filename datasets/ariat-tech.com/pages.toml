title = "Infineon and Flex Unveil Regional Controller Design Platform for Software-Defined Vehicles"
description = "At CES 2025, Infineon Technologies AG (FSE: IFX / OTCQX: IFNNY), a global leader in power systems and IoT semiconductors, joined forces with Flex (NASDAQ: FLEX), a diversified global manufacturer and Infineon’s newly designated preferred automotive design partner, to showcase a groundbreaking modular regional controller design platform for software-defined vehicles (SDVs). This innovative and scalable regional control unit (ZCU) platform features a modular microcontroller (MCU) architecture and universal hardware building blocks."
full_description = "The Flex Modular Regional Controller Platform provides an automotive-grade design solution for rapidly implementing ZCUs. With this platform, automakers can efficiently deliver SDVs at scale. By integrating Infineon’s advanced chipset with Flex’s design expertise and state-of-the-art manufacturing capabilities, the platform delivers optimized power distribution, gateway, and motor control solutions. The production-ready platform is highly adaptable to automakers’ specific requirements, accelerating scaling and time-to-market. “We are delighted to partner with Flex, whose design expertise perfectly complements our strengths. The progress we’ve made in cost and performance optimization for chipsets, combined with the flexibility and design-house-level speed of development, enables customers to tailor their ZCUs to their unique requirements.” “As SDVs lay the foundation for the next generation of mobility, the automotive industry needs collaboration to help automakers innovate faster while focusing resources on creating brand-defining experiences through software. Our partnership with Infineon on advanced computing platforms demonstrates how ecosystem collaboration can empower automakers to deliver SDVs more flexibly and quickly.” The Flex Modular Regional Controller Platform streamlines ZCU development by optimizing implementation efficiency and speed. Infineon’s optimized chipset facilitates early performance evaluation of critical components, including hardware data accelerators (Data Routing Engine/CAN Routing Engine), sequential diagnostics, I²T protection, and SPI control. The platform supports seamless integration of MCU modules with power distribution and drive functions through endpoint-agnostic control capabilities, enabling comprehensive performance optimization from the outset. Email: Info@ariat-tech.comHK TEL: +00 852-30501966ADD: Rm 2703 27F Ho King Comm Center 2-16, Fa Yuen St MongKok Kowloon, Hong Kong."
