title = "Arika"
description = "Working since 2001, Arika is a political arts organisation concerned with supporting connections between artistic production and social change."
full_description = "13 – 17 November 2024 Tramway Glasgow School of Art Episode 11: To End the World As We Know It 5 days of film, music, discussion and study of our collective incompleteness—arrayed against the colonial ordering of how we come to know the world—practicing how we might exist otherwise, right here and now. Can we start to know and practice the world to come? Video Interview, Nov 2024 To Give Up This World, To Have Many Others – In Conversation with Ailton Krenak Ailton Krenak (by video) Denise Ferreira da Silva Amilcar Packer A recorded a conversation that grounds the Episode, exploring Ailton Krenak’s thinking and distinct poetics of life; as it work against capitalism and fascism, as a denunciation of political alliances, and maybe even of ‘politics’. Episode 11: To End the World As We Know It Publication, Nov 2024 IN OUR LIFETIME – A New Anti-Imperialist Resource Hussein Mitha IN OUR LIFETIME, is an anti-imperialist resource, edited by Hussein Mitha, produced by Arika for Episode 11, featuring poetry, essays, questions, prompts, letters and works of anti-colonial imaginary. Episode 11: To End the World As We Know It Collection 11 Items Episodes A key part of our programming, Episodes explore the interlinked nature of aesthetics and social organising, through public events, investigating interlinked themes and contradictions, which develop from one Episode to the next. Theme Pair 52 items Field | Land This theme presents work that might range from field recordings of plants or protests, meditations on land and politics, site specific performances and so on. A starting point for browsing this theme could be checking out the documentation from Ashley Hunt’s performed film/documentary about Hurricane Katrina that was presented at Episode 3: Copying without Copying. Collection 12 Items Sex Worker Organising This collection brings together projects and events from our archive related to sex worker organising and the decriminalisation of sex work. Theme Pair 72 items Resistance | Power Some suggestions of ways in to exploring this theme could be Hortense Spillers’ conversation with Denise Ferreria da Silva on fleshliness and bodiliness and the From Subjection to Subjection discussion with Reina Gossett, Charlene Sinclair and Saidiya Hartman or Mujeres Creando throwing eggs in their Recipes to Change Society provocation."
