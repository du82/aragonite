title = "Scott Meyers: Modification History and Errata List for Effective Modern C++"
full_description = '''Scott Meyers Modification History and Errata List for Effective Modern C++ Last Updated 20 March 2022by Scott Meyers What follows are my notes on what I've changed in Effective Modern C++ since its official publication in November 2014 (i.e., excluding "Early Release" and "Rough Cuts" versions) and what I believe may need to be changed in the future. Most of the changes (or prospective changes) are cosmetic and don't affect the technical content of the book. Entries that do affect technical material are preceded with an exclamation mark ("!") and are displayed in red. Each entry includes the following information: Date Reported: The date the problem was brought to my attention. Who: The initials of the person who caused me to become aware of the problem. The initials "sdm" refer to me. The mapping from other initials to full names is at the bottom of this page. Platform: The format(s) in which the problem occurs, i.e., PDF, ePub, Kindle (mobi), or Safari Books Online. PDF includes print books. As a general rule, content problems affect all platforms, but formatting issues are platform-specific. Location: Where in the book the erratum exists. This is typically either the PDF page number(s) or the Item number. What: A description of the problem and the solution. Date Fixed: The date on which the problem was fixed. If no date is shown, it means it hasn't yet been addressed. I am always interested in bug reports and suggestions for improvements to Effective Modern C++. To submit comments, send email to emc++@aristeia.com. The following issues have been addressed in published versions of the book: DATE DATE REPORTED WHO PLATFORM LOCATION WHAT FIXED -------- --- -------- -------- ---------------------------------------------------------- -------- 1/13/15 sdm Digital Metadata Digital TOCs should included a link to the book's 4/ 2/15 copyright page. 12/ 7/14 kxh ePub on Metadata Author is shown as "(Unknown author)". 3/31/15 Marvin 12/16/14 rxk All All When words in code font are broken across lines, they're 5/19/15 sdm not hyphenated. 11/18/14 sdm Kindle All Font size in code displays should be increased to match 1/20/15 size in the rest of the book. 11/18/14 lxs Kindle All Inter-paragraph spacing should be increased. 1/20/15 11/28/14 kxa Kindle All Highlighted code text (i.e., red and/or italicized) is 4/14/15 1/ 7/15 bxy on invisible. Wide and narrow ellipses are swapped. Nexus (Problems reported on Nexus 4, 5, 7, and 10.) 11/18/14 sdm PDF vii Item title for Item 8 is incorrectly indented. 1/20/15 4/17/15 sdm PDF xiv Twice in first para, bad line break between day and month 5/ 8/15 in a date. 4/17/15 sdm PDF xiv Near end of first para, sentence-ending period should 5/ 8/15 precede the parenthesis, not follow it. 4/17/15 sdm PDF xiv Add tyk for performing an extraordinarily thorough 1/25/16 post-publication review of the book. 1/ 9/16 sdm PDF xv Ashley Morgan Williams ==> Ashley Morgan Long 1/25/16 310 315 11/15/14 kxv PDF xv "reviwing" ==> "reviewing" 1/20/15 11/21/14 sdm Safari 5 In last line of first code display, final parenthesis in 3/31/15 Online comment wraps to next line. ! 1/30/15 txk PDF 12 The third paragraph (beginning with "These examples all 3/24/15 show lvalue reference parameters, but type deduction works exactly the same way for rvalue reference parameters") should be removed. When the type of param in the template f on page 11 is changed to an rvalue reference (i.e., to have type "T&&"), it becomes a universal reference, and then the rules for Case 2 (on pages 13-14) apply. 11/22/14 sdm PDF 21-22 In November 2014, N3922 was adopted for draft C++17. 3/25/15 With this change to the language, it is no longer the case that the following two statements do the same thing: auto x3 = { 27 }; auto x4{ 27 }; Under N3922, x4 is of type int, not std::initializer_list<int>. Some compilers have already implemented this prospective language change. I added a footnote to this effect. 3/18/16 gxk PDF 21 In the footnote added to resolve an earlier erratum, 1/ 5/17 remove the cross reference to Item 42. 12/19/16 sdm PDF 21 In footnote, "some compilers" => "many compilers". 1/ 5/17 3/26/15 sdm PDF 24 In first line, "Occasionally" should be followed by a 3/26/15 comma. 2/ 9/15 tyk PDF 24 Clarify that in authAndAccess, we're interested only in 1/25/16 28 supporting containers taking numeric index values. (This excludes std::map and std::unordered_map, which take indices of arbitrary types). 12/13/14 rxm PDF 25 I should mention that for functions with deduced return 3/25/15 types, if there is more than one return statement, all return statements must yield the same deduced type. 3/27/15 sdm PDF 26-27 Bad page break between the comment and the code it applies 3/30/15 to. 1/22/16 sdm PDF 28 Improper indentation of "-> decltype(...)". 1/25/16 2/ 2/15 mxw PDF 28 Reworded last para on page to reflect that not all names 3/25/15 are lvalues. Also added weasel wording regarding "lvalue expressions more complicated than names" to try to avoid contradicting 7.1.6.2/4 bullet 1 without getting sucked into the details. 2/17/15 mam PDF 31 When attempting to instantiate an undefined template, 3/24/15 Intel C++ 15.0.2 on Linux issues a diagnostic that fails to mention the type being used for the instantiation. 1/ 6/16 sdm PDF 31 Too much blank space above first code example. 1/25/16 12/ 1/14 daa PDF 33 "the type that all three compilers report for param are" ==> 1/20/15 "the type that all three compilers report for param is" 11/21/14 sdm PDF 34 "neither are IDEs or templates" ==> 1/20/15 "neither are IDEs nor templates" 11/17/14 txk PDF 34 Boost's web site is boost.org, not boost.com. 1/20/15 11/23/14 bbs PDF 37-38 In the dwim functions, it would be more ideomatic to use a 3/25/15 for loop instead of a while loop. 2/ 8/15 mxm PDF 38 In comment next to initialization of x3, 3/24/15 "x's value is well-defined" ==> "x3's value is well-defined" 1/ 6/17 sxa PDF 41 In last para, xref to Items 2 and 6 should include Item 3, 5/18/18 too. 2/ 8/17 sdm PDF 41 At beginning of 4th line of second para, "const" should be 1/ 5/17 italicized, i.e., it should start with "<const std::string, int>". (This error exists only in the PDF and printed versions of the book and only in the 8th-10th printings. Kindle and epub versions of the book don't have this mistake, nor do earlier versions in PDF and print.) 1/ 6/17 sxa PDF 45 At end of 2nd para, "Pantheon" => "pantheon". 5/18/18 1/25/15 txk PDF 47 In comment of penultimate code block, 3/24/15 "impliclitly" ==> "implicitly". 11/23/14 bbs PDF 47-48 In last para, I should make explicit my assumption that 3/30/15 the container isn't empty. ! 11/23/14 bbs PDF 48 Twice on page, "d * c.size()" ==> "d * (c.size() - 1)". 1/20/15 ! 3/26/15 lxz PDF 48 The 1/20/15 fix for the code on this page resolved the 4/ 3/15 problem (present in early printings of the book) that when d==1.0, index would be c.size(), hence out of bounds. Unfortunately, it also resulted in index being c.size()-1 (the last element of the container) only when d==1.0. 2/18/15 vhg PDF 51 In second paragraph, I say that narrowing conversions 3/24/15 using braced initializers won't compile, but the Standard requires only that compilers issue some kind of diagnostic message. A warning fulfills this requirement, and some compilers issue only warnings for at least some narrowing conversions using braced initializers. 12/19/16 sdm PDF 54-55 First line of page 55 should be moved to page 54 to keep 1/ 5/17 the comment together. ! 11/20/16 cxl PDF 55 Comment on last line on page is incorrect: the 1/ 5/17 314 constructor for w5 is called with a one-element std::initializer_list, not an empty one. For details, consult this blog post. 2/12/15 sdm PDF 58 Formatting of Item title is incorrect: too much space 3/24/15 after the colon. 12/21/14 tjb PDF 61 lockAndCall implementations should include this line at 1/20/15 the beginning: using MuxGuard = std::lock_guard<MuxType>; 4/21/16 gxp PDF 71 2nd para suggests that it's possible to specify the 1/ 5/17 underlying type only for unscoped enums. Reword. 2/23/15 mxk PDF 77 In next-to-last para, wchar_t, char16_t, and char32_t 3/24/15 are keywords, hence should not be std::-qualified. 7/16/16 axd PDF 77 Penultimate para fails to mention volatile-only overloads 1/ 5/17 (i.e., volatile void*, volatile char*). 11/17/15 rxh PDF 81 Of the three compilers I use for my testing (gcc, MSVC, 1/25/16 bxc Clang), only one (gcc) issues no warnings when full sdm warnings are enabled (i.e. -Wall -Wsuggest-override). 11/12/16 hxb PDF 81-82 Derived::mf4 should be declared virtual. 1/ 5/17 11/23/14 bbs PDF 83-85 I should mention that if a member function is 3/26/15 reference-qualified, any other overload of the same member function (i.e., matching name and parameter types) must also be reference-qualified. 12/25/14 mxs PDF 85 A better way to have the rvalue reference overload of the 3/26/15 1/27/15 tyk "data" member function return an rvalue is to have it return an rvalue reference. That would avoid the creation of a temporary object for the return value, and it would be consistent with the by-reference return of the original "data" interface near the top of page 84. 11/12/16 hxb PDF 86 Missing space after first comma in page's first call to 1/ 5/17 88 std::find. 1/22/16 sdm PDF 88 Missing spaces around "->" in return type for cbegin 1/25/16 at bottom of page. 1/22/16 sdm PDF 89 In first para, incorrect font for final "r" in 1/25/16 "const_iterator". 1/ 4/15 jxz All PDF At end of sentence before code display, space between 1/20/15 pg 95 "seems" and "appropriate" is too wide. In ePub version, there are two spaces, but in PDF and Mobi versions, there's a single overly-wide space. 1/18/15 bbs PDF 99-100 In pow, exp should be declared unsigned, because the 1/25/16 algorithm works only for non-negative exponents. ! 12/24/14 akb PDF 105 Neither std::mutex nor std::atomics are move-only. They 3/25/15 106 are neither copyable nor movable, so classes containing 108 them are rendered both uncopyable and unmovable. 11/14/16 sdm PDF 105 In antipenultimate line on page (i.e., 3rd-to-last line— 1/ 5/17 I just wanted to use the word "antipenultimate" :-}), "i.e," => "i.e.,". 1/ 4/15 jxz PDF 106 It would be better to use std::hypot to compute the 3/25/15 distance from the origin, because (1) std::hypot does exactly what's needed and is part of the standard library and (2) as this blog post explains, it handles potential overflow values much better than the code shown in the book. 12/12/14 bxr PDF 107 "CacheValid" ==> "cacheValid". 1/20/15 ! 12/12/14 bxr PDF 107 The text above the code display near the middle of the 1/20/15 page says that reversing the order of the assignments solves the problem, but that's incorrect. Multiple threads could still perform the expensive calculations before cacheValid is set. 8/31/16 txb PDF 112 In antipenultimate line (see above) of paragraph above 1/ 5/17 first code display, "i.e," => "i.e.,". 3/25/15 gxs PDF 115 At end of second bullet in "Things to Remember," 3/25/15 "and a destructor" ==> "or a destructor". 1/24/17 djm PDF 115 Reword last sentence of bullet at top of page to improve 5/18/18 clarity. Also undo 3/25/15 change suggested by gxs, i.e., at end of second bullet in "Things to Remember," "or a destructor" ==> "and a destructor". 3/ 6/17 djm PDF 115 In last sentence of third bullet in box, "with an 5/18/18 explicitly declared destructor" ==> "with an explicitly declared copy operation or destructor". 6/ 2/15 lxz PDF 118 In fourth para, "it's not possible" ==> "it wasn't 10/21/15 possible". (In C++11, std::auto_ptrs can be stored in containers.) 8/31/16 ryk PDF 118 "Item 17" in footer should be Item 18. 1/ 5/17 6/19/16 axd PDF 123 The book's claim that stateless function object deleters 1/ 5/17 incur no size penalty is true in practice, but it's not guaranteed by the Standard. Reword. Be caseful to avoid implying that stateless function objects in general have no size. 6/23/15 dgw ePub 119 In iBooks, the beginnings or endings of some sentences 6/30/15 124 are missing. (This is a systemic problem. The list of 127 affected pages is probably not complete.) 135 138 6/ 2/15 lxz PDF 128 Text near end of the first paragraph implies that the 1/25/16 control block may not contain a weak count, but, as I note on page 144 (in Item 21), the weak count is always present. 12/15/14 sdm PDF 129 "on page 115" ==> "on page 117". 1/20/15 1/18/15 bbs PDF 133 In first para, both copy- and move assignment can call for 1/25/16 reference count manipulations, because the target of a move assignment must typically decrement the reference count of the control block it currently points to. 6/10/17 tgm PDF 136 In line 7 of 2nd para, the final "s" in "std::weak_ptrs" is 5/18/18 in wrong font. 6/ 2/15 lxz PDF 139 Text in the second paragraph implies that std::make_unique 1/25/16 supports custom deleters, but that is not the case. 12/19/14 sdm PDF 151 Last line on page is indented too far. 1/20/15 1/29/15 tyk PDF 152-153 std::unique_ptr's move operations are noexcept, so 1/25/16 Widget's should be, too. Compiler-generated versions would be noexcept automatically (see below), but user-declared versions must be explicitly declared noexcept. 1/ 8/16 sdm PDF 153 In first para, clarify that compilers must be able to 1/25/16 generate code to destroy pImpl in the event of an exception, even if the move constructor is noexcept. (The source of this requirement is 12.6.2/10 in C++14, though there's a proposal to relax it.) ! 12/18/14 ahp PDF 154 The copy operations shown on this page unconditionally 3/26/15 dereference pImpl, but an earlier move operation could have left pImpl null. The code should check for nullness and, if present, deal with it in a reasonable fashion. 12/18/14 ahp PDF 155 Using compiler-generated copy and move operations for 3/26/15 Widget containing a pImpl of type std::shared_ptr would replace the value semantics of the class (i.e., deep copy) with reference semantics (i.e., shallow copy). 11/12/16 hxb PDF 158 "Item 22" in footer should be Item 23. 1/ 5/17 1/ 4/15 jxz PDF 160 Near top of page, declaration of Annotation constructor 1/20/15 is missing terminating semicolon. 1/ 6/16 nxj PDF 163 Add "Things to Remember" bullet about how declaring 1/25/16 objects const disables move semantics for them. 12/16/14 rxm PDF 168 In second line on page, "args is zero or more" ==> 1/20/15 "params is zero or more". 1/24/17 djm PDF 168 In last sentence before box, "general relativity" => 5/18/18 "Einstein's theory of relativity". 2/11/15 mjs PDF 171 The last sentence of the second paragraph is misleading, 3/25/15 because for setters that are passed the "wrong" type argument, the performance gap between (a) overloading on lvalues and rvalues and (b) pass-by-universal-reference is determined by several factors: - Cost of constructing a temporary object of the "right" type from the argument; - Cost of moving the temporary into the data member; - Cost of assi'''
