title = "Scott Meyers: Advice to Prospective Book Authors"
full_description = '''Scott Meyers Advice to Prospective Book Authors December 2003 (with minor ongoing revisions since) So you want to write a technical book. Wonderful! We need more good books. But you're not quite sure how to find a publisher, or maybe you've been offered a contract, but you're not quite sure what to look for in it. This document gives my views on these matters. It's based on my experience authoring, co-authoring, or acting as consulting editor on various technical books since 1991 (my books and CDs page has details) as well as on conversations I've had with editors and other book authors. There are really two parts to writing a book: the writing part and the business part. Writing considerations include deciding what to cover and what to ignore, figuring out how to treat the material you've decided to include, setting up and adhering to a schedule, tracking changes in technology relevant to your book, ensuring readability, confirming technical accuracy — a whole host of issues related to getting the right words on the page in a timely fashion. Here, I largely ignore those things. Instead, I focus on the business side of being an author, because, in my experience, that's where most prospective authors have the most questions. In this document, I address the following topics: Preparing a Book Proposal Finding a Publisher Publishers and Editors Being Your Own Publisher The Book Preparation Process Contracts Delivery Dates Royalties, Advances, and Other Money Stuff Agents Co-Authors Odds and Ends An Important Final Note Please remember that what follows is my personal point of view. Other people see at least some things differently, and in some places below, I've quoted relevant comments from other authors and editors. Not all quotes are attributed, because some people have asked to remain anonymous. For a publisher-specific view of many of the issues I address here, check out O'Reilly's Guide for New Authors. Preparing a Book Proposal To pitch a book to a publisher, you need a proposal. Publishers typically have online guides that describe what they want to see from you. Here are a few publishers' "Write for us" pages that I found via a minute or two with Google: Pearson (parent company for Addison-Wesley, Prentice Hall Professional, Que, Sams, and more). O'Reilly. Apress. Pragmatic Programmers. Following a publisher's submission guidelines is a good way to make a positive first impression, as publishers generally like to see that you can read and follow directions :-). Peter Gordon, a long-time editor at Addison-Wesley, points out An editor likes not only to see ... that the prospective author can read and follow instructions, but can also write clearly and logically. A proposal that's sloppy in any respect is an immediate turn-off. In reality, proposals come in many forms. Some amount to little more than a sketchy table of contents. If you're an established author with a track record of writing books that sell, you can probably get away with this, but that's not a proposal, it's an idea. If you're an unknown, a sketchy idea isn't likely to get you very far. At the other extreme are people who submit complete manuscripts — would-be books that are all but ready to roll off the presses. Most people submit something in between, and something in between is what publishers typically request. I've reviewed a lot of book proposals over the years, because publishers often circulate proposals to outside experts for evaluation. Whenever I read a proposal, I look for three things. First, do you, as a prospective author, have the expertise necessary to cover the proposed material in an accurate and useful fashion? Second, can you communicate this information to your would-be readers? Third, is your proposed book likely to be of interest to its target audience? In other words, I look at a proposal trying to figure out (1) do you know what you are talking about?, (2) can you write?, and (3) would anybody be interested in reading your words? Because these are the types of questions that I, as a reviewer, try to answer, I recommend that your proposal consist of at least the following: A proposed table of contents that makes clear the scope of what you plan to cover. This doesn't have to have microscopic detail, but it should make clear what topics you will and will not address. A couple of pages is usually fine. A non-trivial sample chapter. This is what people like me will look at to see if you can write and if you know what you are talking about. As a reviewer, I want it to be technical and meaty, not something semi-fluffy like the Introduction. I also want it to be well beyond "rough draft" form, because it's hard for me to evaluate your writing if you wave away spelling errors, awkward grammatical constructions, and inconsistencies as "things I'll fix later." Similarly, I expect your technical material to be close to flawless. If you have programming examples that won't compile or are otherwise invalid, I'll doubt your technical abilities. Multiple-book author Karl Wiegers makes this suggestion: Two things to consider including in the proposal: recurrent themes that will thread throughout the book, and book design hooks, such as annotated bibliography, anecdotes in sidebars, icons in the margin to flag specific points, exercises or next steps at the ends of chapters, etc. And Peter Gordon notes that A fourth question for a prospective author to address is the SIZE of the intended market. I want to know not only that the author is knowledgeable, can write, and has a clearly identified audience in mind, but that that audience is large enough to justify book publication. Editors do reasonably well with the second and third criteria, and have reviewers to help with the first. But the fourth is where the author can and should be as persuasive as possible, with references to other books in the same market, trends, likely quantity customers, etc. A good proposal helps you as much as it helps potential publishers. Writing a book is a lot of work, and you may find the idea more attractive than the reality. A good table of contents will force you to think about all the things you want to say as well as all the topics you'll choose to ignore. A good sample chapter will allow you to make a reasonable guess about how much time and energy you'll have to devote to get the book finished. It is possible that by the time you're done with the sample chapter, you'll have decided that book writing is not for you. I know one seasoned magazine author who abandoned his attempt to write a book, because he discovered that he didn't like writing 100 pages and not being anywhere near done. If you turn out to feel the same way, it's better for everybody to find that out before a contract has been signed. Finding a Publisher Finding a publisher is probably easier than you think. Go to a good bookstore (physical or online), and find out which publishers publish books that you respect. Then contact the publishers with a book proposal. Don't be shy about this. They want to hear from you. They are in the business of publishing books, so they are always on the lookout for promising manuscripts. To make the actual contact, it will help to have somebody's name. Fortunately, finding one is easy, because people in the business of publishing books generally want you to be able to get in touch with them. There are different kinds of editors in the publishing industry, but the type you want at this stage is known as an acquisitions editor. It's their job to find new authors and to cajole new books out of existing authors. Here are a few ways to get names of acquisitions editors: Contact authors you know and ask them who they work with and who they'd recommend you approach. Not only might this yield several names (authors of multiple books have often worked with multiple editors), it will also give you a chance to ask about what it's like to work with particular editors, a topic of more importance than you probably realize and one that I address below. What I just wrote notwithstanding, please don't contact me asking for editor recommendations. If you do, I'll just refer you to this document. I will say that I have found the vast majority of the people I've dealt with at Addison-Wesley to be professional and a pleasure to work with. Consult publishers' online guides for book proposals. They often include contact information for acquisitions editors. Call a publisher's office and tell the person who answers the phone that you'd like to speak with an acquisitions editor about a book proposal you have. Again, don't be shy. It's part of these people's jobs to talk to prospective authors. Regarding this last suggestion, however, Peter Gordon warns, One problem we've encountered — and I suspect the same is true of every large publisher — is prospective authors calling the wrong office (a professional author calling a college office, for example) and getting misdirected. Clearly, that problem stems as much from the publisher's bureaucracy or inefficiency as anything. But whatever the cause, the proposal doesn't get considered. I'd suggest email as the best way to make first contact. Peter Gordon also offers this: A lot of authors ask: Is simultaneous submission to multiple publishers acceptable? It is. But a prospective author probably should not overdo it. Choose just a few publishers who are different in some significant respects, such as size, or depth in your field. Then you can hear the arguments for the muscle of a big publisher or the warmth of a small one, for a powerhouse in your field or someone trying to get a list started. Unless, of course, you already know exactly where you want your book placed. Being Your Own Publisher Some people publish books themselves. There are a variety of reasons why you might want to do this, including an inability to get your book published by a conventional publisher; your desire to have total control over all aspects of publication, marketing, sales, and distribution; and your unwillingness to give up the lion's share of the sales proceeds. (See below for information on royalty rates.) I have no experience with self-publishing, nor have I looked into it in any detail. I am intrigued by the idea, however, and I now know enough people who have done it that it's clear that it's a viable option. What follows are some links on the topic. I vouch for nothing except that the last time I checked them (January 2007), they were valid and led to pages that appeared to be about self-publishing. Morris Rosenthal's Self Publishing Guide. Brian Bischof's Self-Publishing Tips. Jason Levitt's article in Publish In the remainder of this document, I assume you are working with a conventional publisher, because that's what I've always done. Publishers and Editors Getting a book published involves working with two primary entities: a publisher (a company) and an editor (a human being). Both are important. The publisher is important, because it is the publisher who will largely determine how visible your book is upon publication. Your publisher will determine whether you can get into high-visibility brand names like the "Dummies" series. Your publisher will determine whether an army of charming salespeople will descend on bookstores, companies, and universities to sing the praises of your soon-to-be-published manuscript and collect advance orders. In general, your publisher will determine how widely distributed your book is. Needless to say, the wider the distribution, the greater your chances of selling lots of books. Your publisher will also help form the first impression of your book in the minds of potential buyers. If you publish with a company with a reputation for quality, your book gets the benefit of the doubt when it comes to quality before a single page has been turned. If you publish with a house known for schlock, many prospective readers will assume you, too, write schlock. That's why in my advice about finding a publisher above, I suggested starting by identifying publishers whose books you respect. If you don't respect a publisher's work, why would anybody else? Your publisher is important, but on a day-to-day basis, it is your editor who will make your life joyous or miserable. Your editor is your interface to the company, and if ever there were a time when a user-friendly interface were important, this is it. In my experience, your relationship with your editor will be the determining factor in your overall satisfaction in getting a book published. If you and your editor get along — if you share priorities and see eye-to-eye on the things that are important to you — you will likely look back on your authorhood with pleasant memories, even if your book sells poorly. If you and your editor don't get along, producing a book can be the equivalent of being trapped in a bad marriage. You want to make sure that you are comfortable with your editor before you sign a contract or agree to work with him or her. Many new authors assume that all editors are more or less alike, and they're so excited about getting a publishing contract, they don't think much about who'll they'll be working with. That's what I did when I signed for my first book. My resulting experience was pleasant and satisfying from beginning to end, and I just assumed that that was the natural course of things. Later, when I began talking to other authors and hearing how awful their experiences had been, I realized that I'd won the editor lottery through sheer dumb luck. I now know that that lottery has many losers. You do not want to be one of them. Really, the bad marriage analogy is not that big a stretch. Because your editor is your interface to your publishing company, you'll work with him or her to develop the contract you ultimately sign. You'll work with your editor to determine how much input you'll have into your books external design (e.g., cover art, spine appearance, back cover layout and text, etc.) and internal design (e.g., font choices, margins, artwork for chapter openers, etc.). You'll work with your editor to determine whether you are allowed to fix errors in your book between printings. You'll work with your editor to determine how much influence you have over the pricing and marketing of your book, over whether you are allowed to make part or all of your book available at your web site. You'll work with your editor to determine when your book is ready to be published and whether it will ship with a CD or DVD, etc. I am astonished at how many authors choose to work with editors who restrict the authors' participation in the book-making process to that of producing the words that go between the covers. Such authors have no say in the design of their books, in how they are priced or marketed, in when they are "done," in whether they are of acceptable quality. I suppose there must be authors who thrive on having nothing to worry about except putting words on pap'''
