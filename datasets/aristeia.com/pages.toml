["http://www.aristeia.com/books.html"]
title = "Scott Meyers: Books, etc."
full_description = '''Scott Meyers Books, etc. Scott is the author of four acclaimed books on C++ programming as well as two sets of book-like training materials. He's also founder and Consulting Editor for Addison-Wesley's Effective Software Development Series. The bottom of this page contains links to errata pages for his publications. Publications For C++ programmers: Scott's guideline-based books on C++ summarizes the practices employed by the experts — the things they almost always do or almost always avoid doing — to produce clear, correct, efficient code. Effective Modern C++, 2014. The book on effective use of the features new in “modern” C++ (i.e., C++11 and C++14). A complement to Scott’s existing books, 42 all-new guidelines address smart pointers, move semantics, lambda expressions, the concurrency API, moving from C++98 to modern C++, and much more. Available in print form, as an eBook (PDF, ePub, and Mobi (for Kindle)), and via Safari. Effective C++, Third Edition, 2005. Scott's flagship book, and the industry's must-read second book on C++ (i.e., what you read after you've learned the fundamentals of the language). The third edition includes new material on resource management, templates, programming with exceptions, and much more. Available in print form, via Safari, for Kindle, and as an eBook (PDF + ePub). Effective STL, 2001. 50 specific ways to improve your use of the STL, including techniques for improving performance, eliminating resource leaks, avoiding portability problems, and more — all in Scott's inimitable style. Available in print form, via Safari, for Kindle, and as an eBook (PDF + ePub). More Effective C++, 1996. Still relevant after nearly 20 years! Indispensable in its own right, and an invaluable companion to Effective C++. Includes detailed treatments of topics such as reference counting, smart pointers, proxy classes, double dispatching, and more. Available in print form, via Safari, for Kindle, and as an eBook (PDF + ePub). Scott's training courses cover important topics not addressed in his books, and the following sets of annotated training materials make Scott's predictably effective treatments available in book-like form: Overview of the New C++ (C++11/14). ~400 pages. An incisive overview of the most important new language and library features in the remarkable new versions of C++. Essential information for all professional C++ software developers. For a detailed content summary, consult the course description. Available as DRM-free PDF. Effective C++ in an Embedded Environment. ~340 pages. An in-depth examination of C++, its costs compared to C, and how it can be effectively applied in embedded systems. For a detailed content summary, consult the course description. Available as DRM-free PDF. The Effective Software Development Series: <!-- var whichlink=0 var whichimage=0 var blenddelay=(ie)? document.images.slide.filters[0].duration*1000 : 0 function slideit(){ if (!document.images) return if (ie) document.images.slide.filters[0].apply() document.images.slide.src=imageholder[whichimage].src if (ie) document.images.slide.filters[0].play() whichlink=whichimage whichimage=(whichimage<slideimages.length-1)? whichimage+1 : 0 setTimeout("slideit()",slidespeed+blenddelay) } slideit() --> Scott acts as Consulting Editor for The Effective Software Development Series, a collection of books offering expert advice on all aspects of modern software development. Each book describes the critical things the experts almost always do — or almost always avoid doing — to produce outstanding software. For details on the series, consult the series overview (PDF). To see the current set of books in the series, visit the series web page. Older (Out of Print) Publications: Effective C++ CD, 1999. This CD-ROM contains the full text of both Effective C++, Second Edition and More Effective C++, plus a selection of related magazine articles. Designed for use with web browsers, the CD offers unique features, including the ability to create links to any paragraph on the CD. The Downloader’s Companion for Windows (with Catherine Pinch), 1995. A gentle introduction to downloading for nontechnical users. Includes straightforward explanations of file compression and encoding, image and audio formats, the meaning of file extensions, etc. Comes with the software necessary to handle such arcana without your worrying about it. The Downloader’s Companion for Windows 95 (with Catherine Pinch and Chris Sells), 1996. An update of the previous book for Windows 95. Lauded by Sys Admin magazine as "a superb reference ... Every user will appreciate this outstanding resource." Errata Lists Scott maintains lists of errata for the following publications: Effective Modern C++ Effective C++, Third Edition Effective C++, Second Edition Effective STL More Effective C++ Effective C++ CD'''
