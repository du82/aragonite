title = "Scott Meyers: Software Development Consultant"
full_description = "Scott Meyers Software Development Consultant Scott Meyers is an expert on the C++ programming language. He retired from active involvement with it at the end of 2015, having devoted over 25 years to its advancement. Best known for his Effective C++ book series (Effective C++, Effective Modern C++, More Effective C++, and Effective STL), he also developed the annotated training materials, Overview of the New C++ (C++11/14) and Effective C++ in an Embedded Environment. Scott founded and is Consulting Editor for Addison Wesley's Effective Software Development Series, and he conceived the boutique conferences The C++ Seminar and C++ and Beyond. A programmer since 1972, he holds an M.S. in Computer Science from Stanford University and a Ph.D. from Brown University. He received the 2009 Dr. Dobb's Excellence in Programming Award. He blogs at The View from Aristeia."
