title = "Scott Meyers: Modification History and Errata List for More Effective C++"
full_description = '''Scott Meyers Modification History and Errata List for More Effective C++ Last Updated October 18, 2012by Scott Meyers What follows are my notes on what I've changed in More Effective C++ since its original publication (i.e., since its first printing) and what I believe may need to be changed in future printings. Most of the changes (or prospective changes) are cosmetic and don't affect the technical content of the book. To distinguish those modifications that do affect technical material, I precede those entries with an exclamation mark ("!") and display them in red. Each entry includes the following information: Date Reported: The date the problem was brought to my attention. Who: The initials of the person reporting the problem. The initials "sdm" refer to me. The mapping from other initials to full names is at the bottom of this document. Pages: The pages of the book (or the Item number) affected. What: A description of the problem and the solution. Date Fixed: The date on which I fixed the problem. If no date is shown, it means I haven't gotten around to fixing the bug or I'm still mulling over whether I want to fix it. Sometimes I change my mind on bug reports, so prospective bugs often spend quite a while in the "not yet fixed" state. When Addison-Wesley notifies me that a new printing is about to take place, I go through the bugs and fix all those I've decided must be fixed. It's thus not uncommon for all the bugs fixed for a particular printing to have the same fix date. The easiest way to use this list is to find out which of the book's printings you have (it's listed on the copyright page near the bottom), then go to the appropriate section of the list and read from that point forward. For example, if you have a copy of the second printing, the changes made to the first printing won't apply to you, because the changes will already be in place in your copy of the book. I am always interested in bug reports and suggestions for improvements to More Effective C++. To submit comments, send email to mec++@aristeia.com or write to the address listed on page 8 of the book's Introduction. To be assured of always having the most accurate version of More Effective C++ at your fingertips, I encourage you to buy a copy of each printing :-). The following changes were made for the second printing. You need to worry about these changes only if you have a copy of the first printing of the book: DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- 2/ 7/96 msf 14 The comment in the call to updateViaRef should 2/20/96 say the call is to that function, not to update. 2/21/96 ml 31 " ... attempting to perform the assignment." --> 2/21/96 " ... attempting to perform the comparison." 1/28/96 jep 40 The placement new example is in Item 4, not 2/20/96 Item 3. 2/12/96 wg 44 In 2nd paragraph, "reliability" --> "reliably" 2/20/96 2/23/96 lh 70 Declaration of Validation_error::what fails to 2/25/96 put a space after the "*" in the return type. 1/28/96 jep 76 "You can set it up IT like this." 2/20/96 2/ 5/96 jep 111 Replace postfix ++/-- with prefix ++/-- for 2/20/96 189 stylistic consistency (in accord with Item 6). 191 193-4 225 2/ 5/96 tu 113 The text says a vtbl is an array of pointers to 2/20/96 non-member functions, but the diagrams clearly show that the pointers ARE to member functions. Find a way to rephrase this to make it true. 2/ 5/96 jep 117 End of number 2: This cost of this step --> The 2/20/96 cost of this step . ! 2/ 3/96 sdm 120 The figures should show A having a vptr and D 2/20/96 242 having none. See ARM pp. 234-5. 2/ 5/96 tu 127 The formal parameter in the declaration of the 2/20/96 copy constructor should be "rhs". ! 2/11/96 ds 146 UPNumber::destroy should be a const member 2/20/96 function. Otherwise it is not possible to delete a pointer-to-const. 2/21/96 clt 146 The comment pointing out that declaration of a 2/25/96 UPNumber is legal, but its destruction is illegal should be clarified a bit. 1/14/96 sdm 163 Sentence ends with a comma instead of a period 2/20/96 in the second line of text on the page. ! 2/ 5/96 jep 188 value->++refCount --> ++value->refCount. 2/20/96 2/ 3/96 sdm 191-2 Various problems with figures: arrow heads or 2/20/96 242 tails fail to properly abut ovals; boxes fail 185 to abut properly. 114 117 120-1 187-8 248 266 ! 1/25/96 lsk 207 The call to removeReference in String::operator[] 2/20/96 should not be there: the call to RCPtr::operator= will make the necessary call to adjust the reference count. 2/ 5/96 sdm 273 Modify the typesetting of "__cplusplus" so it's 2/20/96 295 clear there are two leading underscores. 1/28/96 jep 280 "And of THE course the STL consists" 2/20/96 The following changes were made for the third printing. You need to worry about these changes only if you have a copy of the first two printings of the book: DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- ! 3/21/96 sdm 163 In March 1996, the committee changed the auto_ptr 4/30/96 165 interface so that, among other things, the copy 166 ctor and assignment operators now take const 291 parameters. I added footnotes generally noting the changes and referred readers to updated auto_ptr information at the MEC++ WWW and FTP sites. 4/26/96 psrc 177 In sixth line from bottom, "SmartPtr" is in wrong 4/29/96 font. 4/11/96 sdm 181 Improper alignment of comment near the bottom of 4/29/96 the page. 4/30/96 avk 187 In 3rd paragraph, the text implies that the 4/30/96 String ctor sets the reference count to 1, but that is actually done by the StringValue ctor. Reword. ! 3/19/96 sdm 209 RCIPtr<T>::init refers to counter->pointee 4/30/96 before it is initialized. Change the second if statement to: if (counter->isShareable() == false) { T *oldValue = counter->pointee; counter = new CountHolder; counter->pointee = new T(*oldValue); } ! 3/ 4/96 we 209 RCWidget fails to perform a copy-on-write (COW) 4/30/96 210 when non-const member functions are invoked. This is incorrect: each non-const member function might modify the (shared) Widget the RCWidget points to. To rectify the problem, add an overloaded non-const version of operator-> and operator* to the RCIPtr template, and have these functions perform the COW before returning. This bends the notion of constness, because we're using non-const operators -> and * even though there is no conceptual change in what the smart pointer points to, but that's preferable to having incorrect behavior. (Note: This change is later revoked. See the explanation below for why.) ! 3/21/96 jj 222-223 The calls to removeReference in the two 4/30/96 String::operator= functions should not be there: the calls to RCPtr::operator= will make the necessary calls to adjust the reference counts. 3/ 6/96 lh 237 There is no such thing as a "static member" of a 4/29/96 function. Reword the second-to-last paragraph. ! 3/ 5/96 sk 264 The destructor in AbstractAnimal should be 4/30/96 public, not protected. ! 3/31/96 rcn 293 auto_ptr's reset function should make sure that 4/30/96 p and pointee are different before doing anything, otherwise pointee will end up pointing to a deleted object. (In practice, this is a moot point, because the revised auto_ptr defintion (see point above) contains no "reset" member function.) The following changes were made for the fourth printing. You need to worry about these changes only if you have a copy of the first three printings of the book: DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- 8/31/96 mb 13 Change "cannot change the constness of an 9/26/96 expression" to "cannot remove the constness from an expression". 3/18/96 aid 34 Many compilers fail to enforce the restriction 4/29/96 that const objects returned from functions may invoke only const member functions. Add a footnote noting common non-compliance with the standard. 1/30/96 sdm 45,66 All figures with curves look bad: the curves 9/26/96 117,119 are clearly being approximated by line segments. 124,150 151,173 178,181 184,185 187,188 191,192 203,208 229,248 258,264 266 ! 4/ 9/96 ks 57 If initAudioClip gets an exception from the call 4/30/96 to new AudioClip, it will call cleanup in the try block, and cleanup will delete theAudioClip. But theAudioClip will not yet have been initialized. Instead of calling cleanup in the catch block, manually delete theImage. 7/29/96 sm 64 Change "that" to "that that" at the beginning of 9/26/96 the third line up from the parenthetical paragraph. 2/18/96 clt 67 Paragraph beginning with "Furthermore, 9/26/96 conversions from typed to untyped pointers..." needs a new beginning to clarify that this is the second of the two types of conversions signposted by the last paragraph on page 66. The next paragraph (beginning with "Even here, however") marks the beginning of the final difference between parameter passing and exception throwing, and it needs a clearer introduction, too. 9/26/96 sdm 67 Modify the catch clause taking a void* to take a 9/26/96 const void*. Otherwise it wouldn't be possible to catch an exception of type const T*. 3/ 6/96 jm 70 exception::what has an exception spec, but that 4/29/96 notion isn't introduced until Item 14. Add an xref to the comment so readers who don't know about exception specifications will understand. 5/30/96 sb 74 In the third paragraph, I refer to "two cases" 9/26/96 that are easy to forget. There is no second case. Reword. 5/30/96 sb 90 Wrong font for initial "t" in the pseudocode, 9/26/96 "the appropriate data from the database" 1/28/96 jep 107 Some compilers don't create a temporary in this 4/29/96 109 expression: Rational(lhs) Instead, they (incorrectly) cast away the constness of lhs and return a reference to that! Advise readers to test their compilers before using this technique. ! 7/19/96 sdm 109 In July 1996, the standardization committee 9/26/96 decided that named objects may be treated essentially the same as unnamed objects for purposes of performing the return value optimization. I added a footnote to this effect. 7/ 9/96 ahd 111 There is no need to #include <math.h> for this 9/26/96 program. Also, the logarithms are natural, not base 10. ! 7/23/96 um 115 The statement that abstract classes generally 9/26/96 have no vtbl is incorrect. A vtbl is needed for such classes in case virtual functions are called during construction/destruction of instances of such classes. 4/16/96 tjb 129 In second line, the closing parenthesis is in the 4/29/96 wrong font. ! 5/15/96 sdm 134 Add footnote: 9/26/96 In July 1996, the ISO/ANSI standardization committee changed the default linkage of inline functions to external, so the problem I describe here has been eliminated, at least on paper. Your compilers may not yet be in accord with the emerging standard, however, so your best bet is still to shy away from inline functions with static data. 3/ 6/96 lh 155 The comment in isOnHeap refers to "the memory 4/29/96 occupied by ptr." It should refer to "the memory occupied by *this." 4/10/96 tjb 160 In comment: "defererence" --> "dereference" 4/29/96 5/20/96 sdm 166 Should explicitly mention that sometimes a smart 9/26/96 pointer does NOT delete what it points to in its destructor, otherwise people may think that ALL smart pointers do that. 7/16/96 sdm 169 Replace "iff" in the comment with "if and only 9/26/96 if." Some programmers were unfamiliar with what I thought was a common abbreviation. 9/ 7/96 sdm 178 In first paragraph, T1 and T2 should be T1* and 9/26/96 T2*, respectively. 7/ 5/96 os 180 The text in the middle of the page talks about 9/26/96 assigning non-consts to consts, but the examples show initializations. Modify the text to refer to both initializations and assignments. 5/11/96 en 191 In comment, "refcount" --> "refCount" 9/26/96 7/ 5/96 os 209 The test of counter against 0 at the top of 9/26/96 210 RCIPtr::init is unnecessary, because counter can never be null. Eliminate the test. Ditto for the test of counter inside the RCIPtr destructor and assignment operator. 7/19/96 os 254 I refer to RTTI-based "switch-on-type" 9/26/96 statements, but it's not legal to switch on the return value of a call to typeid. Reword. ! 7/31/96 sdm 276 The statement at the beginning of the second 9/26/96 paragraph that C and C++ have different layout rules for structs is incorrect. The rules are the same. ! 7/20/96 sdm 292 The auto_ptr class definition needs to add this: 9/26/96 293 294 template<class U> friend class auto_ptr<U> This makes auto_ptr<T> a friend of auto_ptr<U> for all T and U, i.e., all auto_ptr classes are friends of one another. This is necessary to allow auto_ptr<T> to access the dumb pointer inside auto_ptr<U>, which it does inside the bodies of its member function templates for copying and assignment. The following changes were made for the sixth printing. You need to worry about these changes only if you have a copy of the first five printings of the book: DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- 11/15/97 sdm xiv Moved some text from the bottom of page xiv to 11/15/97 xv the top of page xv to make more room on xiv for the names of people who've reported bugs. 8/21/97 sdm 8 Change email contact address to 11/14/97 mec++@awl.com. ! 5/29/96 js 13 sw is defined as a const object, and the results 11/14/97 of modifying a truly const object -- even after applying a const_cast -- are undefined. I modified the example to eliminate the problem. 11/ 3/97 mm 14 In the declaration of updateViaRef, the 11/14/97 ampersand should be next to the type name(not the parameter name) in order to be consistent with the style I use throughout the book. !11/11/96 ymk 15 The new cast approximations need an extra set 11/14/97 of parens. They should be as follows: #define static_cast(TYPE,EXPR) ((TYPE)(EXPR)) Otherwise casts like this don't work correctly: static_cast(int*, my_vec)[j] 4/18/97 drk 19 It's not true that all legal workers in the USA 11/14/97 must have a Social Security Number. I removed the example. 4/22/97 sdm 20 Define bestPieces example like this: 11/14/97 EquipmentPiece bestPieces[] = { EquipmentPiece(ID1), EquipmentPiece(ID2), ... EquipmentPiece(ID10) }; This makes it easier for readers to figure out how it generalizes to constructors that take multiple arguments. 1/15/97 ras 36 The comma operator occurs more often than I 11/14/97 suggest, but the most common place to see it is still probably within a for loop. I reworded the paragraph. !12/25/96 dmp 43 In the first full paragraph on the page, I say 11/14/97 there is "only one global operator new." This isn't true. There are actually several forms of operator new at global scope, but only one has the "normal" form, i.e., takes exactly one argument of type size_t. I reworded the paragraph to eliminate the inaccuracy. 1/17/97 dh 59 In the first paragraph'''
