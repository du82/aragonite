title = "Scott Meyers: Modification History and Errata List for Effective STL"
full_description = '''Scott Meyers Modification History and Errata List for Effective STL Last Updated 2 October 2018by Scott Meyers What follows are my notes on what I've changed in Effective STL since its original publication (i.e., since its first printing) and what I believe may need to be changed in future printings. Most of the changes (or prospective changes) are cosmetic and don't affect the technical content of the book. To distinguish those modifications that do represent important technical modifications, I precede those entries with an exclamation mark ("!") and display them in red. Each entry includes the following information: Date Reported: The date the problem was brought to my attention. Who: The initials of the person reporting the problem. The initials "sdm" refer to me. The mapping from other initials to full names is at the bottom of this document. Pages: The pages of the book (or the Item number) affected. What: A description of the problem and the solution. Date Fixed: The date on which I fixed the problem. If no date is shown, it means I haven't gotten around to fixing the bug or I'm still mulling over whether I want to fix it. Sometimes I change my mind on bug reports, so prospective bugs often spend quite a while in the "not yet fixed" state. When Addison-Wesley notifies me that a new printing is about to take place, I go through the bugs and fix all those I've decided must be fixed. It's thus not uncommon for all the bugs fixed for a particular printing to have the same fix date. The easiest way to use this list is to find out which of the book's printings you have (it's listed on the copyright page near the bottom), then go to the appropriate section of the list and read from that point forward. For example, if you have a copy of the second printing, the changes made to the first printing won't apply to you, because the changes will already be in place in your copy of the book. I am always interested in bug reports and suggestions for improvements to Effective STL. To submit comments, send email to estl@aristeia.com. To be assured of always having the most accurate version of Effective STL at your fingertips, I encourage you to buy a copy of each printing :-). The following changes were made for the second printing of the book. You need to worry about these changes only if you have a copy of the first printing of Effective STL: DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- 6/27/01 js 95 In second comment on page, "mulitmap" ==> 6/27/01 "multimap" 6/21/01 jw 136 In the last comment in the code example, 6/27/01 "goalPosition now points" ==> "begin + goalOffset now points" 6/26/01 mjh 164 "containing lot of data" ==> "containing lots 6/27/01 of data" 5/ 7/01 sdm 228 Add to [26] that the article and the software it 6/27/01 describes can be downloaded from http://www.bdsoft.com/tools/stlfilt.html. 6/26/01 dp 228 URLs for both columns by Matt Austern ([24] and 6/27/01 the second bullet after [27]) end in .htm, not .html. (I checked all the URLs shortly before publication, so these must have changed right after the book was initially printed.) The following changes were made for the third printing of the book. These changes apply to your copy of Effective STL only if it's the first or second printing. DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- 7/21/01 sdm Inside Diagrams should indicate which Items they are 10/30/01 Cover from. Inside front cover is from Item 45. Inside back cover is from Item 15. 8/31/01 ds iv "Dr. Suess" ==> "Dr. Seuss" (twice). (By AW) 9/ 4/01 bww iv Change "Meyer, Scott" to "Meyers, Scott" in the (By AW) Library of Congress Cataloging-in-Publication Data. 7/16/01 hh 11 In 2nd para on page, "pointers of auto_ptrs" ==> 10/29/01 "pointers or auto_ptrs" 8/ 4/01 dg 18-19 Once the typedef WidgetContainer is introduced, 10/29/01 the variable vw should be renamed cw to reflect the new, more abstract, type name. 8/23/01 sdm 23-24 Clarify that only one of the three list::splice 10/29/01 functions requires linear complexity. The other two can run in constant time and can allow size to run in constant time. 10/29/01 sdm 23 Twice on this page, "list" is in the wrong font. 10/29/01 ! 7/13/01 pc 27 In the second code example, insertLoc needs to 10/29/01 be incremented after the call to insert. This error is especially embarrassing, because I got it right on pp. 184-5 (where I also explain what happens if you don't do the increment). 7/27/01 ras 34 In first bullet para, "It's type" ==> "Its type" 10/29/01 6/29/01 sdm 47 In the last line of paragraph 2, "list" should 10/29/01 be in code font. 8/17/01 sdm 47 Omit from para 2 the advice to treat list like 10/29/01 a sequence container. Based on a discussion with jep, I'm now less certain that that convention is as widespread as I'd thought. 10/ 4/01 ap 47 In 1st para, clarify that erase's return value 10/29/01 is void in associative containers only for the forms taking iterators. (When passed a value, erase returns the number of elements erased.) 7/13/01 gk 57 Near middle of page, "Then you use 10/29/01 SpecialHeapAllocator" ==> "then you use SpecificHeapAllocator" 7/28/01 jep 59 In 1st para, "be convenient state" ==> 10/29/01 "be a convenient state". 10/24/01 wg 66 The first sentence of the third paragraph 10/29/01 begins, "Given all that ..., It should not". The word "it" is errantly capitalized. 10/11/01 gn 67 In second and third bullets, the parameters 10/29/01 taken by resize and reserve are of type Container::size_type, not size_t (though for all the standard containers, Container::size_type must be size_t). 7/21/01 tm 75 In 2nd para, "stored in contiguous memory" ==> 10/29/01 "stored in a single chunk of contiguous memory" 7/23/01 jeh 76 In the last line of the comments above the 10/29/01 declarations for fillArray and fillString, change "maxNumDoubles" or "maxNumChars" to "arraySize". ! 8/23/01 ja 79 The last paragraph of Item 17 is incorrect. 10/29/01 5/23/02 en string is unique among the standard containers in having swap invalidate all pointers, references, and iterators into the strings. (Such swaps do not invalidate anything when done to vectors, deques, lists, or any of the standard associative containers.) Omit paragraph. ! 8/22/01 sdm 92 Eliminate the second-to-last sentence on this 10/29/01 250 page. In fact, equal values are equivalent, because neither of two equal values precedes the other in any reasonable sort order. (The definition of "reasonable" is "strict weak ordering," as I mention on page 94.) Page 250 was changed to eliminate the index entry for "equality, implying inequivalence". !10/11/01 gn 99 In the long middle para, casting away the 10/29/01 constness of a map key doesn't yield undefined behavior, but attempting to modify the key does. 7/ 8/01 dm 100 The order of steps 3 and 4 should be reversed, 10/29/01 both at the top of the page and in the code example. This improves the exception safety of the approach. 8/22/01 jep 100 Step 5 says that giving an accurate hint to 10/29/01 6 insert yields constant-time complexity, but it 246 actually yields amortized constant time 247 complexity. When I fixed this, I added a 248 definition of "amortized constant time" to page 6, plus I added related index entries. ! 8/22/01 jep 104 In the lines after the calls to lower_bound, the 10/29/01 106 second test should be "!(w < *i)" and "!(s < i->first)", respectively. This needs to be fixed in both the code and the comments. 8/22/01 jep 104 In the comments following the calls to 10/29/01 106 lower_bound, the reference to Item 45 should be to Item 19. 7/ 1/01 cm 105 In second-to-last para, "consistency between" 10/29/01 ==> "consistency among" 8/22/01 jep 110 As in jep's bug report for page 100 above, 10/29/01 insertion with a hint yields amortized constant time complexity, not simply constant time. 7/23/01 jeh 114 In 2nd para from bottom, "it's design" ==> 10/29/01 "its design". 10/11/01 gn 118 In first line of second bullet, "const iterator" 10/29/01 ==> "const_iterator". The latter should be in code font. ! 7/25/01 sb 119 One can't just replace "i-ci >= 3" with 10/30/01 "ci+3 <= i", because ci+3 might not be a valid iterator, e.g., it might be beyond the end of the container. I replaced the suggested workaround with a new one based on casting i to a ConstIter. ! 8/22/01 jep 121 I added a footnote telling readers that the 10/29/01 approach described in this Item may fail for reference-counted strings and pointing them to jep's comment on this matter below. 7/ 4/01 ajf 121 In second paragraph from the bottom, "then move 10/29/01 it forward it until" ==> "then move it forward until" 7/10/01 dm 126 Everywhere on page, "operator<<" ==> 10/29/01 "operator>>" 8/ 4/01 dg 136 In last para, "which reorders element" ==> 10/29/01 "which reorders elements". 8/23/01 sdm 144 In the lower diagram, non-code text in 10/29/01 "remove_if's return value" should be in text font. 10/29/01 sdm 144 In the upper diagram, the words "uncertified" 10/29/01 should be in text font. ! 8/22/01 jep 159 In the second call to accumulate on this page, 10/29/01 1.0 should be 1.0f. The comment should also be adjusted, as should the sentence after the example. 7/23/01 jeh 159 In 2nd prose para, "a floating pointer numbers" 10/29/01 ==> "a floating point number". 8/ 3/01 sdm 160 In the para following the code, there should be 10/29/01 no line break between "paragraph" and "2". ! 7/23/01 jeh 185 In last line of last code fragment, 10/29/01 "bind2nd(plus<int>" ==> "bind2nd(plus<double>". The next sentence needs to be correspondingly modified. 8/18/01 sp 187 Once in a code example on each page, 10/29/01 188 "vector<int> iterator" ==> 189 "vector<int>::iterator". 7/23/01 imt 199 At end of 2nd-to-last para, note that for set 10/29/01 and map, count must return 0 or 1, and that's why find has no speed advantage for those containers. 8/23/01 sdm 200 In the entry for equal_range in the next-to- 10/30/01 last row of the table, add "then distance". Make the same change to this table on the book's inside front cover. 7/ 8/01 ajf 209 In first line after the bulleted list, <set> 10/29/01 and <functional> should be in code font. 8/30/01 ab 211 At end of 2nd para, "Another STL platform I 10/29/01 uses..." ==> "Another STL platform I use..." 7/ 7/01 sdm 216 As noted below, it's becoming more common for 10/29/01 vector and string iterators not to be pointers. The first bullet on this page needs to be reworded. 8/ 4/01 dg 221 In 2nd para, "do fire up" ==> "do is fire up". 10/29/01 8/28/01 jtw 228 A more reliable URL for [27] is 10/29/01 http://www.research.att.com/~bs/stack_cat.pdf. 7/ 8/01 ajf 235 In first para under "Case-insensitive string 10/29/01 comparison," "The time, though" ==> "This time, though" 7/ 1/01 hs 239- Many of the apostrophes in this Appendix are 10/29/01 244 "straight" instead of "curly." 7/16/01 jf 251 Column 1, "NiftyEmail" entry. The page number 10/29/01 212 has been split into 21 and 2. 7/16/01 jf 253 Column 2, "types in containers" (sub-sub entry 10/29/01 for "iterators"). The spacing of the "see also iterator . . ." text is gappy. 7/16/01 jf 254 In several places, "Microsoft'" ==> 10/29/01 260 "Microsoft's". 7/16/01 jf 256 Column 2, "range" entry: The sub-sub entry "to 10/29/01 avoid . . ." is gappy. 10/28/01 sdm 256 Add entry "RB Tree, see red-black tree" 10/29/01 10/29/01 sdm Inside Diagram for Implementation D is missing the (By AW) Back shading that's present in the corresponding Cover diagram on page 71. The following changes were made for the fourth printing of the book. These changes apply to your copy of Effective STL only if it's one of the first three printings. DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- 7/19/01 sdm 17 The case for erase isn't quite as bad as the case 7/25/04 for insert, because you can safely erase the last element of a vector, deque, and list without invalidating iterators/pointers/references to elements preceding it in the container. ! 6/29/01 jk 20 The first para of Item 3 is incorrect: front 7/25/04 and back do NOT return copies of elements, they return references to elements. I removed all mention of front and back. 5/22/02 sxb 25 In para after the 1st code fragment, "more than 7/25/04 one function call" ==> "more than one statement" 2/ 4/03 shh 39 In second-to-last code comment, "create a SPW" 7/25/04 ==> "create an SPW". !11/29/02 gm 44 Regarding the paragraph after the first code 7/25/04 example, the call to erase can't take logarithmic time for multi containers, because such containers might consist entirely of elements with the value to be removed. I reworded things. 9/ 4/02 ga 46 In the for loop in the first code example, 7/25/04 "AssocContainer" should be entirely in italics. 8/ 1/03 lfr 51 In 2nd-to-last para, "unsigned integral value" 7/25/04 ==> "unsigned integral type" 11/ 6/02 wb 57 In the second code example, the 7/25/04 SpecificHeapAllocator template is missing the word "class" at the beginning of the template definition. !11/ 5/01 sdm 61 In 2nd-to-last para, the claim that C++ 7/25/04 guarantees that local objects are destroyed if an exception is thrown is not quite true. The guarantee holds only if the exception is caught. I added a footnote explaining this caveat. 7/ 3/02 kes 67 To third bullet, add a remark that calling 7/25/04 reserve never changes the number of objects in the container. (Unfortunately, when I did this, I wrote "resize" instead of "reserve," thus introducing an error not fixed until the 6th printing; see db's entry below for 2/3/05.) 9/27/01 lz 77 In the second section of example code, the call 7/25/04 to vd.resize(...) is missing the final closing parenthesis. 2/ 1/03 lfr 90 Missing colon at end of page. (The missing colon 7/25/04 was actually deliberate, but I reworded the end of the sentence to "try this:", which I think is clearer.) 7/13/02 ckl 91 In first code example, ssp's type should be 7/25/04 declared to be set<string*, stringPtrLess>. ! 2/ 4/02 sdm 106 In the lookup code using lower_bound (near the 7/25/04 middle of the page), the test should be this instead of what is in the book: if (i != vd.end() && !DataCompare()(s, *i)) ... The comment needs to be adjusted, too. The code in the book lets lower_bound use the default "<" as its comparison function, but the call to sort used a DataCompare object. In this particular example, the two tests do the same thing, but in general, it is critical to ensure that lookups in a sorted vector are done using the same comparison function as was used to sort the vector. 11/ 5/01 sdm 111 In 2nd-to-last line of Item 24, "map" should be 7/25/04 in code font. 7/22/01 dm 122- To create an iterator from a const_iterator, 7/25/04 8/22/01 jep 123 it's not actually necessary to have access to the container. Rather, you need to have access to some iterator i'''
