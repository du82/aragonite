["http://www.aristeia.com/presentations.html"]
title = "Scott Meyers: Past Talks"
full_description = '''Scott Meyers Past Talks Over the years, Scott has made scores of public presentations at conferences, SIGs, open-enrollment seminars, etc. Here is a list of many of those presentations. "A Quick Look at Speedy Software", Reed College Math Colloquium, April 17, 2018. "Things that Matter," DConf 2017, May 5, 2017. [Video of the talk.] "Modern C++ Beyond the Headlines," Nexon Developers Conference, April 28, 2016. [Video of the talk.] "Effective Modern C++ live! Scott Meyers on void Futures," live online webinar, March 31, 2015. [Video of the talk.] "The Evolving Search for Effective C++," Meeting C++, December 2014. [Video of the talk.] "The Most Important Design Guideline," ConFu, November 2014. [Video of the talk.] "Effective Modern C++," ConFu, November 2014. [Videos of the talk Part 1 Part 2 Part 3 Part 4 Part 5 Part 6] "Support for Embedded Programming in C++11 and C++14," code::dive, November 2014. [Video of the talk.] "CPU Caches and Why You Care," code::dive, November 2014. [Video of the talk.] (Slides from the talk (in PDF) are available here.) "Effective Modern C++," Learning Connexions, October 2014. "Burying bind," C++ and Beyond: 2014, October 2014. "Type Deduction and Why You Care," C++ and Beyond: 2014, September 2014. "A Crash Course in C++ 14" C++ and Beyond: 2014, September 2014. "CPU Caches and Why You Care," Susquehanna International Group, September 2014. "CPU Caches and Why You Care," Broad Institute, September 2014. "C++ Type Deduction and Why You Care," CppCon, September 2014. [Video of the talk.] (Slides from the talk (in PDF) are available here.) "Why C++ Sails When the Vasa Sank," Yandex, June 2014. [Video of the talk.] (Slides from the talk (in PDF) are available here.) "An Overview of the New C++ (C++11/C++14)," Yandex, June 2014. "Better Software — No Matter What: The Most Important Design Guideline," Norwegian Developers Conference, June 2014. [Video of the talk.] "CPU Caches and Why You Care," Norwegian Developers 