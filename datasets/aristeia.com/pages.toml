title = "Scott Meyers: Modification History and Errata List for Effective C++, Second Edition"
full_description = '''Scott Meyers Modification History and Errata List for Effective C++, Second Edition Last Updated 31 August 2015by Scott Meyers Note: This document applies to only the second edition of Effective C++. Errata for other editions of the book are available as follows: Third Edition Errata First Edition Errata What follows are my notes on what I've changed in the second edition of Effective C++ since its original publication (i.e., since its first printing) and what I believe may need to be changed in future printings. Most of the changes (or prospective changes) are cosmetic and don't affect the technical content of the book. To distinguish those modifications that do affect technical material, I precede those entries with an exclamation mark ("!") and display them in red. Each entry includes the following information: Date Reported: The date the problem was brought to my attention. Who: The initials of the person reporting the problem. The initials "sdm" refer to me. The mapping from other initials to full names is at the bottom of this document. Pages: The pages of the book (or the Item number) affected. What: A description of the problem and the solution. Date Fixed: The date on which I fixed the problem. If no date is shown, it means I haven't gotten around to fixing the bug or I'm still mulling over whether I want to fix it. Sometimes I change my mind on bug reports, so prospective bugs often spend quite a while in the "not yet fixed" state. When Addison-Wesley notifies me that a new printing is about to take place, I go through the bugs and fix all those I've decided must be fixed. It's thus not uncommon for all the bugs fixed for a particular printing to have the same fix date. The easiest way to use this list is to find out which of the book's printings you have (it's listed on the copyright page near the bottom), then go to the appropriate section of the list and read from that point forward. For example, if you have a copy of the third printing, the changes made to the first and second printings won't apply to you, because the changes will already be in place in your copy of the book. I am always interested in bug reports and suggestions for improvements to Effective C++. To submit comments, send email to ec++@aristeia.com or write to the address listed on page xv of the book's preface. To be assured of always having the most accurate version of Effective C++ at your fingertips, I encourage you to buy a copy of each printing :-). The following changes were made for the third printing of the book. These changes apply to your copy of Effective C++, Second Edition only if it's the first or second printing. DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- N/A N/A xix Added apm to the acknowledgements. This changed 9/13/97 xx the break between pages xix and xx, so I had to 248 update the index entries for "Nemeth, Evi", 250 "USENIX Association", and "Internet Engineering 256 Task Force, The". ! 9/ 7/97 apm 20 "<" preceding strdup's return type should be 9/13/97 omitted. (I also moved the comment over to make the example easier to read.) 9/ 2/97 sdm 136 In two comments on this page, "postpones" has an 9/13/97 apostrophe that shouldn't be there. ! 9/13/97 apm 184 In Set<T>::remove, the call to find should 9/14/97 terminate with a semicolon, not a colon. The following changes were made for the fourth printing of the book. These changes apply to your copy of Effective C++, Second Edition only if you have one of the first three printings. DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- 11/13/97 rmw xv In line 1 of 4th paragraph, change "small reward 2/ 3/98 for" to "small reward to". 9/25/97 sdm xviii Bad break in "Item 5" in 5th line from bottom of 2/ 3/98 xix page on page xviii. Caused page break between xviii and xix to shift. 2/ 3/98 sdm xix Updated list of people who reported bugs in 2/ 3/98 xx earlier printings I fixed in this printing. 12/ 4/97 sdm 3 On 11/14/97, the ISO and ANSI standardization 2/ 3/98 6 committees adopted what is all but certain to 224 become the official standard for C++, so all 225 references to "draft standard," "nascent 234 standard," "DIS," etc. should refer to to just 235 "the standard." 236 11/18/97 vb 5 Division by 10.0 unnecessarily forces use of 2/ 2/98 floating point math. Change to division by the int 10 instead. 9/25/97 sdm 5,13, Made minor cosmetic change in punctuation, 9/28/97 24, hyphenation, or wording. 2/ 2/98 40,51, 62,75, 95,98, 99,107, 116,117, 125,144, 161,164, 178,183, 185,195, 219,229, 233 11/ 5/97 en 6,8, The default constructor for my String class sdm 49,72, shouldn't give its parameter a default value of 87,94, 0 (the null pointer), because the standard 95,124 string type exhibits undefined behavior when it receives a null pointer. I modified my examples to be more in accord with the standard string type, which offers the following constructors: string(); // default ctor string(const char *); // ctor from C string 2/ 2/98 sdm 7 Bad line break between "Item" and "22" at the 2/ 2/98 end of the second prose paragraph. Fixed. ! 9/25/97 sdm 7,8, "string class" => "string type". As Item 49 9/28/97 55,65, explains, string is not a class. 2/ 2/98 126,144, 145,146, 227 9/25/97 sdm 9 Missing space between "assignment" and "By" in 9/28/97 first prose paragraph. 12/18/97 mmr 13,14 Contrary to my assertion at the beginning of the 2/ 3/98 Item, the preprocessor IS part of the formal language standard. Furthermore, some implementations DO put the names of macros in the symbol table and DO show their names in error messages. I reworded things to make them true. 12/31/97 sdm 26 The exception should be caught by reference 2/ 2/98 30 instead of by value. This is for efficiency. 32 The full story is in More Effective C++, Item 13. ! 9/25/97 dxs 31 Comments after last two statements in the code 9/27/97 example are incorrect. The call to X::set_new_handler sets the handler to the null pointer, and the subsequent use of "new X" will call *no* error-handling function if allocation fails. 10/13/97 rh 32 Misspelling in last prose sentence: 10/27/97 "newHanderSupport" ==> "newHandlerSupport". 9/25/97 sdm 34 Replaced "0" with "null" in prose where I 9/28/97 35 referred to a pointer's value. This is to avoid implying that the *value* of a null pointer is zero. (If the book makes sense, but this paragraph doesn't, ignore this paragraph.) ! 9/25/97 sdm 38 At beginning of paragraph following second code 9/28/97 block: "By defining a function" => "By declaring a function". 1/ 1/98 sdm 57,59, unsigned int ==> size_t 2/ 2/98 60,62, 95,96 9/25/97 sdm 58 In first Wacko constructor, changed type of s 9/28/97 from char* to const char*. 9/25/97 sdm 66 Bad break in "Item 11" in 3rd prose paragraph. 2/ 3/98 10/16/97 mt 73 In comment inside operator=, "copy old data" ==> 10/27/97 "copy rhs's value" 12/12/97 th 86 On line 20, a space is missing between "call." 2/ 2/98 and "But". 12/10/97 dm 88 "different ... than" ==> "different ... from". 2/ 3/98 sdm 121 162 169 170 9/25/97 sdm 91 Cross reference to Item 1 in 2nd paragraph should 9/28/97 be to both Items 1 and 47. !10/15/97 sdm 91 The type of string literals is now const char[], 2/ 3/98 215 (which almost always decays to const char*), so any place using a string literal to initialize or assign to a char* is technically illegal (it's a violation of const correctness). In practice, I expect all compilers to accept such code on the grounds of C compatibility, but it's still wrong in the book. I added a footnote to page 91 explaining the situation, and I modified the example on page 215 to avoid running into the problem. !10/27/97 sdm 97 strlen returns a size_t, not an int. 2/ 2/98 9/15/97 sdm 108 The avg functions should all return doubles. 9/27/97 9/20/97 sdm 114 Style of Inheritance diagrams isn't consistent 9/27/97 158 with those in More Effective C++ or with that 172 shown on page 231. All diagrams should use the 177 "class names inside ellipses" style of page 231. 198 200 205 209 10/15/97 gb 131 In 1st line of 1st new paragraph, I say that 10/27/97 verifyAddress is protected. It's not, it's private. I adjusted the text. 12/22/97 th 144 "Nobel prize-winning" ==> "Nobel Prize- 2/ 2/98 winning". (Note change in capitalization.) 9/29/97 sdm 149 In last prose paragraph on page, parenthesis 9/29/97 following "virtual constructors" is in wrong font. 9/13/97 apm 163 In 4th para, "only two kinds of plane" => "only 9/27/97 two kinds of planes". 12/31/97 th 174 Wrong font for 's' in first use of "BankAccounts" 2/ 2/98 in 3rd line from bottom. 9/27/97 sdm 177 Space preceding "cred-" at end of page is in 9/27/97 wrong font. 12/17/97 mgh 184 Remove extra closing paren at end of 2/ 2/98 Set<T>::member's implementation. !11/19/97 jh 186 Stack and GenericStack lack a copy constructor 2/ 3/98 191 and an assignment operator, a direct violation of Item 11! I declared them private in both cases and added an xref to Item 27 for each. !11/26/97 tk 187 Stack::empty should return (top == 0), not 2/ 2/98 (top != 0). 9/25/97 sdm 194 In middle of last paragraph of Item 42, cross- 9/28/97 reference should be to Item 43, not Item 44. 9/21/97 apm 203 Three times on this page in the paragraph 9/27/97 following the code, "name" => "theName". !11/24/97 sdm 215 To what string should nameValue refer if the 2/ 3/98 char* constructor is called? I modified the example to eliminate the problem. (See also comment above about pages 91 and 215.) !11/11/97 jg 227 The "basic_ostream<char>" that precedes the 2/ 2/98 "template<class charT" shouldn't be there. The correct declaration for basic_string is: template<class charT, class traits = char_traits<charT>, class Allocator = allocator<charT> > class basic_string; 12/14/97 sdm 230 In the discussion of the algorithms' performance 2/ 3/98 guarantees, I changed the example from sort to stable_sort, as the latter has a slightly stronger guarantee. 2/ 3/98 sdm 234 ISO stands for "International Organization for 2/ 3/98 Standardization", not "International Standards Organization". Who knew? 10/25/97 kb 235-6 The example code should show f as virtual, 2/ 3/98 because it doesn't affect the example in any way, and using nonvirtual functions unnecessarily violates the guidance of Item 37. 10/28/97 sdm 236 A better way to make Base's f visible in 2/ 3/98 Derived is to add the following using declaration to Derived: using Base::f; The following changes were made for the fifth printing of the book. These changes apply to your copy of Effective C++, Second Edition only if you have one of the first four printings. DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- 9/29/97 sdm x-xx Running header should have section title up 6/ 9/98 against the binding margin. As things stand now, it's inconsistent with the rest of the book and with More Effective C++. 8/ 4/97 ds x,59 The title to Item 14 suggests it may be okay to 6/ 9/98 create base classes with no destructors at all. I changed the Item title to "Make sure base classes have virtual destructors." 6/13/98 sdm xix Added Dave Smallberg to list of pre-publication 6/13/98 reviewers. N/A N/A xix,xx Updated list of bug reporters. 6/11/98 ! 4/ 8/98 atc 26 The assert macro checks its argument only if 6/12/98 240 NDEBUG is undefined. Furthermore, it's poor 250 programming to use assertions to detect conditions that might occur in production code. Running out of memory is such a condition. 2/ 7/98 dxg 42 In line 15, "big enough hold" ==> "big enough 6/ 8/98 to hold" 2/ 7/98 dxg 48 Change first word on page from "is" to "are" 6/ 8/98 6/20/98 sdm 60 At beginning of last paragraph: "topic: when" 6/29/98 ==> "topic. When" 6/17/98 sdm 72 In third prose paragraph, "One of them is 6/29/98 efficiency." ==> "The lesser of them is efficiency." 10/10/97 sdm 78 Header shouldn't have an Item number in it. 6/ 8/98 6/28/98 sdm 91 The footnote I added on 2/3/98 isn't quite 6/29/98 correct. It's true that the type of a string literal is now const char[]. However, the standard includes a loophole that allows char* variables to be initialized with string literals anyway, even though it's not const correct. The practice is deprecated, but, contraray to what I said in the footnote, it's not illegal. I modifed the footnote. 2/ 7/98 dxg 95 The String constructor should initialize 6/ 8/98 lengthIsValid to false, not 0. 7/11/97 das Item 27 Note that the advice of this Item applies to all 6/13/98 compiler-generated functions, not just operator=. It's particularly common for both the assignment operator and the copy constructor to be explicitly disallowed. I added a new paragraph to the end of the Item (on p. 117). 2/ 4/98 sdm 132-3 Space between "step" and "3" should be 6/ 8/98 non-breaking. ! 4/ 2/98 sdm 145 It turns out that the standardization committee 6/ 8/98 12/13/99 sdm 146 has, with only a few exceptions (notably explicit 227 specializations for templates instantiated with 228 user-defined types), forbidden programmers from 247 declaring anything that's in namespace std. The 248 implication is that you shouldn't use the mechanism I show on p. 228 to declare the string type. Instead, you should simply #include <string>. (Edits to page 228 eliminated mention of <iosfwd>, hence the modifications to Index pages 247-248.) 4/ 8/98 atc 147 Move "of" from line declaring returnADate to line 6/12/98 declaring takeADate. This make is less likely that the takeADate comment will be read on its own. 4/ 8/98 atc 159 Reworded last sentence on p. 159 (to improve 6/12/98 160 clarity) and moved that sentence to the top of p. 160 (to more closely associate it with the bulleted paragraphs). 2/10/98 dxg 160 In line 17, "relationship it is" ==> 6/ 8/98 "relationship is" 2/10/98 dxg 163 The last word in line 1 should be "behind" 6/ 8/98 instead of "for". ! 2/10/98 dxg 173 Lines 9 and 11 state that the dynamic or static 6/ 8/98 type of pr is Rectangle or Shape, respectively, but the correct types are Rectangle* and Shape*. 2/10/98 dxg 184 In the 10th line from the bottom of the page, 6/ 8/98 "In code" ==> "In the code" !11/26/97 tk 193 Parameter to GenericStack::push should be of type 6/ 8/98 void*, not const void*. 4/ 8/98 atc 198 Reworded first large prose paragraph to avoid 6/12/98 using "invariably" in a way that really means "almost always". 3/24/98 bc 203 In the paragraph preceding the code, PersonInfo's 6/ 8/98 member function names are incorrect: the "the" prefix has been omitted. 6/ 8/98 sdm 203 Bad line break in third line after code example. 6/ 8/98 11/19/97 jh 217 In the enum solution, Jan is 0, Feb is 1, ... Dec 6/ 8/98 is 11. In the class solution, Jan is 1, Feb is 2, ... Dec is 12. I modified the enum solution to make the numbering match the class-based solution. (It's more intuitive for January to be 1, not 0.) 11/19/97 jh 218 There should be a way to '''
