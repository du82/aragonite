["http://www.aristeia.com/BookErrata/M27Comments.html"]
title = "Scott Meyers: Comments on Item 27 of More Effective C++"
full_description = '''Scott Meyers Comments on Item 27 of More Effective C++ Last Updated December 15, 1999by Scott Meyers The messages below make up correspondance related to More Effective C++'s discussion of how to determine whether an object is on the heap. I've edited out unnecessary email headers and omitted parts of the messages not germane to the issue at hand, but other than that, these are verbatim messages sent to/from me on this topic. I'm grateful to each of the authors for their permission to make their messages available for general viewing. After Ron van der Wal and I exchanged email, Ron put up a web page summarizing his extensive and insightful thoughts on this topic. That page contains essentially the same information as is shown in our correspondance below, but he's formatted his page, so it's easier to read. If you read his page, however, please don't forget to come back here to read the other authors' comments, because they describe interesting approaches to this problem that are different from both mine and Ron's. From: Ron van der Wal Date: Mon, 26 Feb 96 10:44:40 PST Subject: On the heap checks To: Scott Meyers Thank you for another well written and useful book on C++ - meaning of course "More effective C++". I would like to comment on the central issue of Item 27, i.e. ways to determine whether or not some object is allocated off the heap rather than, say, stack or static data space. Unless noted otherwise, my comments refer to the UPNumber and HeapTracked samples that you use throughout Item 27. 1. A static bool 'onTheHeap' is not satisfactory (pp. 148-149) -------------------------------------------------------------- This is true. There is, however, a fairly simple way to circumvent some of the problems you outline: replace the bool flag by a counter. For example: class UPNumber { public: ...as before... private: static int heapPending; // Replaces 'onTheHeap' }; int UPNumber::heapPending = 0; void *UPNumber::operator new(size_t sz) { ++heapPending; return ::operator new(sz); } UPNumber::UPNumber() { if (heapPending < 1) throw HeapConstraintViolation(); ... --heapPending; } This solves most of the problems you mention (we'll get to array allocations in a moment), including the new UPNumber(*new UPNumber()) situation. In fact, it could only fail (as far as single objects are concerned) in the following situation: new UPNumber(UPNumber()); This fails if (and only if) the compiler happens to generate code as follows: 1. Call operator new 2. Call the constructor of the temporary 3. Call the constructor of the dynamic object The order of 2 and 3 will never be reversed, of course, so the question is simply whether or not the operator new call will precede the construction of the temporary. (This scenario would also cause the 'onTheHeap' approach to fail.) Any other combination of constructors and/or operator new invocations will be safe with the counter approach. In the example above it remains to be seen if the use of a temporary makes sense, but it's legal anyway so we have to deal with it. As to arrays of UPNumbers, this could be solved by also overloading operator new[] for the UPNumber class and implementing it as follows: void *UPNumber::operator new[](size sz) { heapPending += sz / sizeof(UPNumber); return ::operator new[](sz); } This solves the new UPNumber[100] you mention, assuming that 'sz' is indeed the correct multiple of sizeof(UPNumber). When will this not be the case? I can see two possibilities: 1. When the C++ implementation under consideration needs some extra space in the array for bookkeeping, and to this end increases the passed-in 'sz'. This is a possibility allowed by the ANSI/ISO C++ draft standard (see section 5.3.4), but it did not occur with the C++ compilers I tried (Borland, Microsoft, Symantec). It may with others, though. 2. When UPNumber::operator new[] is inherited and used by a class derived from UPNumber *and* sizeof(Derived) > sizeof(UPNumber). There is no foolproof way to check for this (in particular, the size of the derived class may itself be an integral multiple of the size of UPNumber), so this will cause problems too. To summarize: The counter approach does not completely solve the problems you outlined on pp. 148-149, but it improves on the bool flag approach. In fact, it still is a cheap solution and it may suffice for a large number of situations, especially if portability is not an issue or will be considered as the need arises (as frequently happens :-). 2. Tracking heap based objects (pp. 154-156) -------------------------------------------- Your HeapTracked class does indeed exactly that in a portable and bullet proof way. It is, however, a fairly expensive solution both in space and time. In particular, the list template will often (if not always) be implemented as a doubly-linked list and therefore require an allocation of a list element per address stored. This may be a quite considerable overhead, both in space and time. Furthermore, HeapTracked::isOnHeap() operates in linear time, and this too could be a problem. I have two alternatives to offer. Neither is as generally applicable or as foolproof as your solution, but they are a lot cheaper (requiring only a single integer per tracked object, and checking in constant time) and could be appropriate in many situations. After all, if you really need to track heap based objects, you may also be willing to impose some constraints on the use of the tracked class. (I have done so anyway.) Both methods add a signature to the allocated object, which is initialized by the overloaded operator new for the class (although the location of the signature differs between the two approaches). The signature is not initialized if the object is constructed otherwise, and this is also the possibly fatal flaw: a correct signature may be accidentally present even in objects that do not come off the heap. I'll return to that later. A. Prepend a signature to the allocated block --------------------------------------------- This first solution would work out as follows: overload operator new for the class and have it allocate some extra space before the actual block, then fill this with a special signature. For example: class HeapTracked { public: ...as before (operator delete not needed)... private: static const int32 signature = 0x57647652L; static bool checkSignature(const void *); ...RawAddress stuff deleted... }; void *HeapTracked::operator new(size_t sz) { // Increase requested size by signature size sz += sizeof(int32); // Get somewhat larger block void *block = ::operator new(sz); // Initialize heap signature, then return pointer to subblock // beyond signature. (Second static_cast not strictly necessary.) int32 *signptr = static_cast(block); *signptr = signature; return static_cast(signptr + 1); } bool HeapTracked::isOnHeap() const { return checkSignature(dynamic_cast(this)); } bool HeapTracked::checkSignature(const void *ptr) { // Cast back to int32 pointer const int32 *signptr = static_cast(ptr); // Check signature in front of the block. // ***This is the problem area, see text*** return signptr[-1] == signature; } (By the way, 'int32' is a typedef to ensure I have a 4-byte integer regardless of my compiler's preferences.) As you've probably spotted, the problem with this approach arises when HeapTracked::checkSignature() attempts to retrieve the signature field that precedes the actual object. In general, the address some_array[-1] is not guaranteed to exist. If the block was allocated by HeapTracked::operator new, it will exist, but we're just about to find that out and can't be sure yet. This problem cannot be solved in a portable way, as far as I know. It may just so happen that the address signptr[-1] is not valid; it will depend on the platform at hand whether or not this is likely to occur. In my practice (DOS, Win16, Win32, OS/2 and Mac apps), the most threatening situations are in 16-bit segmented DOS/Win16 programs when signptr[-1] would cause segment 'underwrap' (this can be checked, albeit in a non-portable way) and in others, when the passed-in block pointer actually addresses something on the stack exactly at the bottom of a stack page, and signptr[-1] causes a page fault on the stack's guard page. The latter condition is almost impossible to check for, but it has never occurred to me (yet). Anyway, this method is not without its problems, although it is a generally applicable as your list approach in all other respects (inheritance, mix-in use, etc.). Finally, it does not work with arrays of heap tracked objects, but you wisely ignored that subject too :-). B. Include a signature in the object itself ------------------------------------------- This second solution is one you'll probably balk at, but it still has its merits and I've used it with success on several occasions (as I did with the previous method). The idea is to place the signature field inside the allocated object, yet still initialize it in HeapTracked::operator new. For example: class HeapTracked { public: ...as before (operator delete not needed)... private: static const int32 signature = 0x57647652L; int32 signfield; // Added ...RawAddress stuff deleted... }; void *HeapTracked::operator new(size_t sz) { // Get block of correct size void *block = ::operator new(sz); // Point into the object-to-be and set its signature... HeapTracked *htptr = static_cast(block); htptr->signfield = signature; return block; } bool HeapTracked::isOnHeap() const { return signfield == signature; } The HeapTracked constructors must leave this field alone of course, as must the assignment operator for the class, so it's probably a good idea to define at least the copy constructor and assignment operator for this class and implement them to that effect. If you're really into it, you might even want to implement HeapTracked::operator new[] and step through the array of objects-to-be, setting all their signature fields. In for a penny, in for a pound, don't you think? When is this method not applicable? In essence, when class HeapTracked is used as a base class (e.g. as the mix-in you mention) and it is either not the first base class, or it is a virtual base class. In both cases, the start of the new object will not coincide with the start of the allocated block, and the htptr->signfield reference will be off. The same applies if the C++ implementation under consideration adds some bookkkeeping space in front of the actual object (again allowed by ANSI/ISO C++). It's up to the client to decide whether or not these restrictions are acceptable. Accidental signature match -------------------------- As I hinted at above, there still remains the problem of accidental signature matches. Both method A and B assume that if the signature value matches the predefined constant, we have a valid heap block. This may not always be true, however, especially not so because in the case of not-heap-based objects, the signature fields aren't initialized at all and may contain any value (including the signature value). What can we do about it? Nothing absolutely foolproof, but a few things might raise the confidence level enough to make either method usable. 1. Use an 'improbable' signature value. Clearly, 0 would be a poor choice, as would be 0xFFFFFFFF. I normally use a 4-byte value that does not match anything systematic. In the above examples the value 0x57647652L was used; I find it nicely conspicuous in dumps, yet fairly unlikely to occur by chance (try interpreting it as 4 ASCII characters). If necessary, you can make the signature value less probable by increasing its size (what about a 128-bit GUID?), but some compromise is probably called for. 2. Clear the signature field in HeapTracked::operator delete (method A and B) or in the HeapTracked destructor (only method B). This might help a bit, but not much, since we're mainly interested in distinguishing heap based objects from others, and not one heap based object from another. Still, this could reduce the chance of accidents in method B if we do it in the HeapTracked destructor for every HeapTracked object. 3. Use additional information above and beyond the signature field. For example, add a signature field at the end of the object field as well (this limits the application of the methods). Or, prepend another field with a dynamically magical value, say the address of the object itself. Or prepend an additional counter field and XOR the signature field with that. All these methods would still allow HeapTracked::isOnHeap() to operate in constant time, and don't require auxiliary data structures. C. Dig into your C++ compiler ----------------------------- One final method to get what you want (i.e. knowledge about heap-basedness) is to consult your compiler's runtime implementation details. This is extremely nonportable (it might even change from one compiler release to the next), but what gives if you're desparate? Many compilers will use some hidden information passed to the constructors and destructors they generate, indicating whether or not the constructor should call operator new before proceeding (effectively combining the constructor call with the operator new call), and conversely, whether the destructor should call operator delete when it's done. They will also add some information to memory blocks indicating how many objects are in the block (to take care of vector construction and destruction). If you can get at these and are prepared to face the maintenance problems it causes, this could also solve your problems. Obviously, this approach is off-limits for a book like "More effective C++" and I have never seen it being used by anybody but the compiler manufacturer himself, but... Date: Fri, 01 Mar 1996 21:40:24 EST From: Scott Meyers To: Ron van der Wal Subject: Re: On the heap checks Thanks for your thoughtful comments on checking to see if objects are on the heap. >1. A static bool 'onTheHeap' is not satisfactory (pp. 148-149) >-------------------------------------------------------------- >This is true. There is, however, a fairly simple way to circumvent some of >the problems you outline: replace the bool flag by a counter. For example: I considered adding this to the book, but I decided against it. The book is longer than I wanted it to be anyway, and my experience has been that anybody who can figure out the onTheHeap bool trick can pretty easily extend it to the counter idea. In retrospect, perhaps I should have added it anyway, but if I did that in all the places where there were logical extensions (especially reference counting), I'd have a 400-page book instead of a 300-page book. (I wanted a 200-page book!) >Your HeapTracked class does indeed exactly that in a portable and bullet >proof way. It is, however, a fairly expensive solution both in space and >time. In particular, the list template will often (if not always) >be implemented as a doubly-linked list and therefore require an allocation of >a list e'''
