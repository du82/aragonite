title = "Scott Meyers: Modification History and Errata List for Effective C++, Third Edition"
full_description = '''Scott Meyers Modification History and Errata List for Effective C++, Third Edition Last Updated 22 June 2021by Scott Meyers Note: This document applies to only the third edition of Effective C++. Errata for earlier editions of the book are available as follows: Second Edition Errata First Edition Errata What follows are my notes on what I've changed in the third edition of Effective C++ since its original publication (i.e., since its first printing) and what I believe may need to be changed in future printings. Most of the changes (or prospective changes) are cosmetic and don't affect the technical content of the book. To distinguish those modifications that do affect technical material, I precede those entries with an exclamation mark ("!") and display them in red. Each entry includes the following information: Date Reported: The date the problem was brought to my attention. Who: The initials of the person reporting the problem. The initials "sdm" refer to me. The mapping from other initials to full names is at the bottom of this document. Pages: The pages of the book (or the Item number) affected. What: A description of the problem and the solution. Date Fixed: The date on which I fixed the problem. If no date is shown, it means I haven't gotten around to fixing the bug or I'm still mulling over whether I want to fix it. Sometimes I change my mind on bug reports, so prospective bugs often spend quite a while in the "not yet fixed" state. When Addison-Wesley notifies me that a new printing is about to take place, I go through the bugs and fix all those I've decided must be fixed. It's thus not uncommon for all the bugs fixed for a particular printing to have the same fix date. The easiest way to use this list is to find out which of the book's printings you have (it's listed on the copyright page near the bottom), then go to the appropriate section of the list and read from that point forward. For example, if you have a copy of the third printing, the changes made to the first and second printings won't apply to you, because the changes will already be in place in your copy of the book. I am always interested in bug reports and suggestions for improvements to Effective C++. To submit comments, send email to ec++@aristeia.com. To be assured of always having the most accurate version of Effective C++ at your fingertips, I encourage you to buy a copy of each printing :-). The following changes were made for the second printing of the book. These changes apply to your copy of Effective C++, Third Edition only if it's the first printing. DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- 6/ 1/05 rxy 30 References to the variable "theFileSystem" should 7/ 4/05 be replaced with the variable "tfs" in the last two sentences. 6/ 2/05 rxy 52 In 4th line of 2nd para, "that going" ==> "than 7/ 4/05 going". 6/ 2/05 rxy 79 In the third code example, "Date d(2, 20, 1995)" 7/ 4/05 is incorrect, because that's a valid date. I changed the example to "3, 40". 6/ 2/05 rxy 83 2nd line of 1st bullet. "Your should" ==> "you 7/ 4/05 should". 5/ 4/05 jxr 122 In code at top of page, SpecialWindow::blink 7/ 4/05 has an unnecessary semicolon at the end of its definition. 6/ 6/05 sdm 231 There's unnecessary extra vertical space after 7/ 4/05 the last statement in the 2nd impl of doAdvance. The following changes were made for the third printing of the book. These changes apply to your copy of Effective C++, Third Edition only if it's one of the first two printings. DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- 8/19/05 axf 4 In last para, "objects of user-defined types" 10/10/05 ==> "objects generated from structs and classes". 7/ 5/05 bxm 20 In several code examples, the quote character is 10/10/05 21 "`" instead of "'". 7/ 5/05 bxm 31 I added a comment at the end of the next-to-last 10/01/05 32 para on pg. 31: "Actually, it's only part of a Singleton implementation. An essential part of Singleton I ignore in this Item is preventing the creation of multiple objects of a particular type." 7/ 5/05 bxm 81 In 2nd-to-last sentence, "delete" should be in 10/10/05 code font. 7/11/05 gxk 82 In 2nd-to-last para, "pInv" ==> "retVal." 10/10/05 7/26/05 bxm 86 Explicitly declare Student destructor virtual. 10/10/05 (It's already implicitly virtual.) 9/26/05 mxs 93 In last para, I added this footnote: "The 10/10/05 destructors will be called once at program shutdown." 8/24/05 jds 105 Extra space before the period in the last line 10/10/05 before the "Things to Remember" heading. 7/26/05 bxm 115 Remove "std::" qualification in definition of 10/10/05 the variable encrypted for consistency with page 114. 7/26/05 bxm 124 In 2nd-to-last line, "ulhc and lrhc are declared 10/10/05 125 private" ==> "ulhc and lrhc are supposed to be private to their Rectangle". 7/ 8/05 ixl 125 In 2nd-to-last para, "upperRight" ==> 10/10/05 "lowerRight". 7/11/05 gwj 126 "It" at beginning of 2nd sentence of "Things to 10/10/05 Remember" bullet is ambiguous. Reword. 8/18/05 clt 160 The example at the bottom of the page is odd, 10/10/05 because Derived::mf1 calls Base::mf1, which is pure virtual. I added an xref to Item 34, which explains that pure virtuals may be defined. 7/26/05 bxm 162 In 3rd para, error should be private it if it's 10/10/05 only called by member functions. Hence "is called by member functions if they need to report an error" ==> "is called when an error needs to be reported". !10/ 5/05 jsl 174 In 2nd prose paragraph, the definition of 10/10/05 compatibility is incorrect. A callable entity is compatible if a const GameCharacter& can be passed to it, i.e., if its parameter type is either const GameCharacter& or something that a const GameCharacter& can be implicitly converted into. !10/ 5/05 jsl 175 The first sentence of the last paragraph is 10/10/05 inaccurate. It's not the "_1" that specifies that currentLevel is to be used as the GameLevel object when calling GameLevel::health, it's the location of currentLevel in the parameter list to tr1::bind. The "_1" itself, in conjunction with its position in tr1::bind's parameter list, specifies that the argument passed to the function object generated by tr1::bind should then be passed as the parameter to GameLevel::health. I reworded to avoid mentioning _1 at all. 7/25/05 tdh 207 In 3rd para, "vary" ==> "varies". 10/10/05 10/12/05 jsl 231 In first para, "create two versions" ==> 10/10/05 "create multiple versions". 8/ 1/05 bxm 242 As return type of operator new or as an unnamed 10/10/05 244 parameter, "void *" ==> "void*". This it to 245 follow consistent conventions in the book. 252 254 255 258 10/ 5/05 sdm 263 The target year for C++0x has been set at 2009, 10/10/05 264 with all substantive work finished by the end of 2007. (It takes a year or so after all work is done to make the new standard official.) !10/ 5/05 sdm 266 In 1st para, "anything convertible to an int" ==> 10/10/05 "anything an int can be converted into". 9/11/05 pxh 269 In 1st bullet at top of page, "C99"==> "C89". 10/10/05 The following changes were made for the fourth printing of the book. These changes apply to your copy of Effective C++, Third Edition only if it's one of the first three printings. DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- 1/26/06 ser 32 In tempDir, initialization of td is missing 6/17/06 "( params )". 1/25/06 bxm 47 Code for ~DBConn is missing a close } for the 6/17/06 opening if statement, and the block controlled by the if needs to be indented. 2/17/06 clm 62 In para after 2nd code fragment, "continue or 6/17/06 goto statement" ==> "break or goto statement". 3/16/06 jeh 62 "Regardless of how the delete were skipped," ==> 6/17/06 "...were to be skipped," 3/27/06 axd 105 Reword bullet at bottom of page, because non- 6/17/06 member functions don't have a this pointer. 12/23/05 vxs 158 In 3rd para, "Derived's overloading of mf3" ==> 6/17/06 "Derived's declaration of mf3". 1/ 4/06 vxs 183 In last two paras, "overridden/overriding" ==> 6/17/06 "redefined/redefining". 3/16/06 jeh 201 "con-stnesses" ==> "const-nesses". 6/17/06 12/29/05 sdm 210 In 3rd para, "Object-oriented" ==> 6/17/06 "Object-Oriented". 11/17/05 axh 229 Both nested iterator classes should end with a 6/17/06 semicolon instead of a colon. 3/27/06 axd 230 The 3rd-to-last para says that the typeid 6/17/06 test will cost us at runtime, but a good optimizer might eliminate the test. Reword. 3/12/06 txs 234 In comment in last code fragement, "error!" ==> 6/17/06 "error! won't compile". 4/28/06 sdm 247 In last bullet of Item 49, "subsequent" ==> 6/17/06 "associated". 1/ 1/06 kxk 257 Missing comma after declaration of parameter 6/17/06 pMemory in operator delete near middle of page. 11/13/05 jxc 293 Index entry for RAII should refer to page 63 6/17/06 instead of page 66. The following changes were made for the fifth printing of the book. These changes apply to your copy of Effective C++, Third Edition only if it's one of the first four printings. DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- 8/2/06 bxs 18 One way to remember what const refers to when 11/21/06 pointers are involved is to read the declarations right to left: char *p // ptr to char const char *p // ptr to char that is // const char const *p // ptr to constant char char *const p // constant ptr to char const char * const p // constant ptr to char // that is const char const * const p // constant ptr to // constant char I added a footnote mentioning this idea. 7/28/06 lfr 46 In middle code example, red block is terminated 11/21/06 with a black brace. The brace should be red. ! 7/17/06 nxd 108 Text after top code example says that STL 11/21/06 containers specialize std::swap. This is incorrect; they overload std::swap as described on page 109. I changed "specializations" to "versions" to dance around this issue until it's discussed on the next page. 8/26/06 lfr 177 Missing "of" in last sentence of 2nd para. 11/21/06 !10/31/05 clt 214 The "this->" in SquareMatrix::invert is 11/21/06 10/ 4/06 hgv 215 unnecessary, because the using declaration for 281 SquareMatrixBase::invert allows the name "invert" 291 to be looked up in the base class (as noted on 295 page 211). I updated the comment for the using declaration to indicate that both Items 33 and 43 are being addressed, and I modified the text of the following paragraph. These changes modified the page break with page 215 and also eliminated some index entries. 1/18/06 vxp 214 To prevent the code bloat discussed in this 11/21/06 Item, it's important that SquareMatrixBase::invert not be declared inline. 7/ 7/06 yxf 286 The entries LoggingMsgSender::sendClear 208, 210 LogginMsgSender::sendClear 210, 211 should be merged as LoggingMsgSender::sendClear 208, 210, 211 The following changes were made for the sixth printing of the book. These changes apply to your copy of Effective C++, Third Edition only if it's one of the first five printings. DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- 5/08/07 sdm xvii In first para, "about five years" ==> "about 5/08/07 three years" and "two decades" ==> "nearly two decades". 6/29/06 axd 22 Add a remark that the definition of "const" that 5/08/07 programmers should follow for const member functions is logical constness, not bitwise constness. (The information is already bullet 2 on page 26, but putting it here makes the point sooner.) 12/31/06 ahh 26 In 2nd summary bullet, "conceptual constness" 5/08/07 ==> "logical constness". 10/14/05 ejx 30 Reworded code comments to make clearer that the 5/08/07 code on this page would be in a header file and that tfs' definition would be in a separate .cpp file somewhere. 2/25/07 mxr 36 In first code example, "<class T>" ==> 5/08/07 "<typename T>" (for consistency with pg. 35). 12/31/06 ahh 37 In second para, "If you want to support 5/08/07 assignment" ==> "If you want to support copy assignment". 6/27/06 bp 71 To Font class at top of page, add a "..." to the 5/08/07 code and a comment that, per Item 14, the class must handle copying somehow. 3/27/07 dxs 209 Last line of last code comment should read 5/08/07 "// sendClear is omitted". 12/31/06 ahh 216 In 2nd prose para, "simple inline calls to base 5/08/07 class versions" ==> "simple inline calls to (non-inline) base class versions." 2/ 8/06 awo 230 In first code example, "IterT" ==> "T" (because 5/08/07 the pointer itself is the iterator, T is just what it points to). The following changes were made for the seventh printing of the book. These changes apply to your copy of Effective C++, Third Edition only if it's one of the first six printings. DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- 9/15/07 dmr 7 Wrong type of quotes in "Darla". 1/28/08 3/18/07 mxr 55 Final sentence of top para is not technically 1/28/08 correct, because C++ implementations are allowed to change the value of a deleted pointer, although I don't know any that do. I added a footnote to this effect. 5/10/07 sdm 107 In second code fragment, move "this won't compile" 1/28/08 comment to the line trying to access the pImpl pointers. 9/15/07 dmr 118 Should mention that the two cast forms shown at 1/28/08 the top of the page yield identical behavior, e.g., both create temporary Widget objects. 9/15/07 dmr 125 In 1st para, comma preceding the parenthetical 1/28/08 comment should be a period. 9/15/07 dmr 145 In comment at top of page, "exactly the same 1/28/08 member functions" ==> "exactly the same public member functions". ! 7/28/07 mxh 158 In first line on page, "containing Base" ==> 1/28/08 "containing Derived". !12/22/07 lfr 193 In 1st para, "checkOut" is ambiguous during name 1/28/08 lookup, not overload resolution; and the two "checkOut" functions are not equally good matches, because one is const and one is not. 7/17/07 mxr 197 Class definition of PersonInfo should match that 1/28/08 shown on page 195. 10/ 3/07 bxj 239 3rd para should make clear that the new-handler 1/28/08 is a global resource and thus subject to the thread-safety issues that apply to all such resources. The following changes were made for the ninth printing of the book. These changes apply to your copy of Effective C++, Third Edition only if it's one of the first eight printings. DATE DATE REPORTED WHO PAGES WHAT FIXED -------- --- ----- ------------------------------------------------ -------- 4/ 7/08 axf xix, "Feher" ==> "Fehér". 7/17/09 xx, 287 7/17/09 sdm 18 In middle code fragment, missing space between 7/17/09 "//" and "cIter". 11/ 4/07 nxd 18-19 The text implies that all by-value returns should 7/17/09 be const, but cases where non-const by-value returns are good design are not difficult '''
