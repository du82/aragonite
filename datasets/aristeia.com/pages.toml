full_description = '''Scott Meyers Presentation Materials for Personal Use Much of the information in Scott's training courses is available only in the form of presentation materials. Some courses include topics from his books, but the training course treatments are sometimes different, reflecting additional insights Scott has garnered since book publication. The ideal way to get the information in the training materials is to attend an event where Scott presents it (e.g., at a public seminar or an on-site presentation in your company), but an alternative is to purchase a copy of the materials for your personal use. Features Each set of materials is delivered as a PDF document personalized with your name, and each offers the following features: Same content as the training course: The PDF you'll get is an exact snapshot of Scott's full-color training materials on the day he generates the PDF. You'll get not only the slides Scott shows in class, you'll also get the accompanying notes — the very ones Scott uses. To see exactly what you'll get for a particular course, click "View a sample" next to the course description below. No DRM: You may copy the PDF to as many devices as you like, annotate it in any way you want, print it in part or in full as many times as you choose. Because the PDF is for your personal use only, you are not permitted to provide copies to friends or colleagues, may not install it on servers for public access, can't use it as the basis for presentations, etc., but we trust you to adhere to these restrictions; the PDF itself doesn't try to prevent unauthorized uses. (For more permissive usage options, consider licensing the materials.) Free updates for life: You are entitled to free updates to the materials as long as Scott produces them. Major revisions are included, so you won't have to pay again for a "new edition." Volume discounts: Want a copy for every member of your team or department? Discounts of 30-50% off single-PDF prices apply to purchases of as few as 10 copies. As the saying goes, the more you buy, the more you save! Consult the discount schedule for details. Currently Available Overview of the New C++ (C++11/14). ~405 pages. This intensively technical seminar introduces the most important new features in C++11 and C++14 and explains how to get the most out of them. For a detailed content summary, consult the course description. $29.95 Buy a copy. View a sample (~43 pages, PDF). Effective C++ in an Embedded Environment. ~340 pages. An in-depth examination of C++, its costs compared to C, and how it can be effectively applied in embedded systems. For a detailed content summary, consult the course description. $24.95 Buy a copy. View a sample (~30 pages, PDF). Commercial Use Scott's presentation materials may also be licensed for commercial use. For Details, consult Scott's licensing page.'''
