title = "Scott Meyers: Modification History and Errata List for Effective C++ CD"
full_description = '''Scott Meyers Modification History and Errata List for Effective C++ CD Last Updated June 26, 2008by Scott Meyers [Click here for information on the Effective C++ CD and version 6 browsers from Microsoft and Netscape.] What follows are my notes on what's been changed in the Effective C++ CD since its original publication (i.e., since its first printing) and what I believe may need to be changed in future printings. The easiest way to use this page is to find out which of the CD's printings you have (it's generally listed at the end of the "Legal Stuff" page, but see below for an exception), then go to the appropriate section of the list and read from that point forward. For example, if you have a copy of the second printing, the changes made to the first printing won't apply to you, because the changes will already be in place in your copy of the CD. "Isn't there some way to patch the CD's files if they've been copied to a hard drive?," you're probably wondering. Unfortunately, there's not. I've been trying to convince Addison-Wesley (the publisher) that this would be a good idea, but so far I've been unsuccessful. I'm working on it, though. The list below contains only those changes that do not apply to the material in Effective C++, Second Edition or to More Effective C++, i.e., to places on the CD that are not in the books. The books have their own errata lists. When viewing those lists, note that the CD contains the fifth printing of Effective C++, Second Edition and the seventh printing of More Effective C++. (From here, you may wish to visit the errata list for Effective C++, Second Edition or the errata list for More Effective C++.) Each entry below includes the following information: Date Reported: The date the problem was brought to my attention. Who: The initials of the person reporting the problem. The initials "sdm" refer to me. The mapping from other initials to full names is at the bottom of this document. What: A description of the problem and the solution. Date Fixed: The date on which the problem was fixed. If no date is shown, it means the problem hasn't been fixed yet. I am always interested in bug reports and suggestions for improvements to the Effective C++ CD. To submit comments, send email to ec++cd@awl.com or to ecppcd@awl.com. (The latter address was added for retrograde mailers that reject the symbol "+" in email addresses, but both addresses go to the same place.) The following changes were made between the first and second printings. You need to worry about these changes only if you have a copy of the first printing of the CD: DATE DATE REPORTED WHO WHAT FIXED -------- --- ------------------------------------------------------- -------- 8/14/98 jd Nothing works under Netscape Navigator 4.05. This is 3/16/99 not really a problem with the CD; it's a problem with NN 4.05. However, enough people have run into it that we updated the CD's readme.txt file to mention the problem, and we modified the CD to issue a warning when it detects this specific browser. The solution to the problem is to upgrade to a more recent version of the browser. 12/12/98 sdm Missing slash between "ANSI" and "ISO" in this sentence 3/16/99 in paragraph 3 of Reeve's article, "In April 1995 the ANSIISO C++ committee released the Committee Draft of the C++ Standard." 12/12/98 sdm Single-user license agreement printed on the back of 3/16/99 the CD sleeve prohibits copying the CD. This is incorrect. The correct license agreement is on the "Legal Stuff" page of the CD. 12/16/98 sdm Hits 19-21 after searching for "standard" in item 3/16/99 chunking list the hit location as "Untitled". 12/19/98 sdm Link to the MEC++ Web Site in paragraph 3 of the EC++ 3/16/99 Afterword currently goes to the on-CD TOC for MEC++. This is incorrect. It should go to the book's web site at AW. 1/ 6/99 dh In paragraph 11 of the Magazine Articles Home Page, the 3/16/99 description of Tom Cargill's article has the words "little more to exceptions THAT try, throw and catch". In that sentence, THAT should be THAN. 1/11/99 mr With chapter length chunking, the link above M12 3/16/99 that reads "Continue to Item 13: Catch exceptions by reference" causes the topic to be reloaded instead of just scrolling down. 1/11/99 mr In the Counting Objects article's sidebar, the 3/16/99 "invisible" labels after the currency symbols show up in white on the yellow background. (This happens everywhere we use a yellow background, e.g., in the tables in Reeves' article.) 1/11/99 mr The third line of the dedication, "(but mostly for 3/16/99 Nancy).", appears left justified instead of centred. It centres itself if you resize the browser window. (This is actually a bug in the browser, but we implemented a workaround that eliminates the problem.) 1/11/99 mr Jumping to the MEC++ "Efficiency" chapter (chapter 3/16/99 length chunking) via the contents or "Continue to Efficiency" at the bottom of Item 15, causes the heading to be at the top of the window so that "Back to Item 15..." and "Continue to Item 16..." are not visible. 1/11/99 mr The links at the bottom of the chapter length chunks 3/16/99 say (e.g.) "Continue to Chapter 2: Memory Management" whereas those at the top of the last item in the chapter just say "Continue to Memory Management". Since nowhere are the chapters actually numbered, I think they should both just say "Continue to Memory Management". 1/11/99 mr The first chapter chunk in MEC++ (Basics) finishes with 3/16/99 "Back to Introduction"/"Continue to Chapter 2: Operators". The former should be "Back to Item 4: Avoid gratuitous default constructors". 1/14/99 sdm Under NN 4.5, turn off context display and search for 3/16/99 "function". The text "Match 1 of 709" at the bottom of the window is truncated to "Ma". 1/14/99 sdm Using Item chunking and searching for "operator", 3/16/99 matches 41-44 give a location summary of "Untitled". 1/14/99 sdm Missing possessive apostrophes in rollover text for 3/16/99 several buttons in nav areas. (This was fixed by eliminating all the possessives.) 1/20/99 ch In paragraph 70 of Reeves' article, change "delete" to 3/16/99 "delete[]" in "its definition is almost exactly the same as for auto_ptr except that it callse delete on its...". 1/28/99 rmm Some mail systems can't handle plus signs ("+") in 3/16/99 email addresses, thus making it impossible for people using such mail systems to send mail to ec++cd@awl.com. We added a new alias for this address, ecppcd@awl.com. 2/13/99 rr The image in the MEC++ Introduction fails to show up on 3/16/99 Unix systems because the file name I_005a1.GIF should be entirely in upper case. 2/13/99 rr The image after Item M24, P15 is missing in the 3/16/99 smallest image size. (The file name in the HTML is missing the .gif extension.) 2/16/99 mr The 2nd- and 3rd-to-last lines of code following 3/16/99 paragraph 59 of Reeves' article are incorrectly indented. 2/16/99 mr In Reeves' article, the table of Goals and Guidelines 3/16/99 should contain links to the corresponding discussions. 2/16/99 mr In the last line of paragraph 129 of Reeves' article, 3/16/99 lines tend to break between "terminate" and "()". 2/16/99 mr With chapter chunking set, paragraph 47 of Sutter's 3/16/99 article has ONMOUSEOVER = "self.status = 'Item M20'; return true" ONMOUSEOUT = "self.status = self.defaultStatus" in the middle of the paragraph. Needless to say, this should not be there. 2/17/99 mr In the code following paragraph 27 of Sutter's article, 3/16/99 the closing brace of the Stack destructor is on the wrong line. 2/20/99 mr In the implementation of deleteArray following MEC++ 3/16/99 Item 3, paragraph 11, "delete [] array;" is improperly indented. 2/20/99 mr In the code following paragraph 13 of MEC++ Item 3, the 3/16/99 indentation of the code inside the for loop is incorrect. 2/20/99 mr Incorrect indentation of the following near the top of 3/16/99 Item M4: EquipmentPiece *bestPieces = new EquipmentPiece[10]; // error! same probl