title = "Scott Meyers:  A First Look at C++ Program Analyzers"
full_description = '''A First Look at C++ Program Analyzers By Scott Meyers and Martin Klaus Other than minor updates to Table 3, this is a pre-publication version of an article that appeared in the February, 1997, issue of Dr. Dobb's Journal. C++ has a well-deserved reputation for power and flexibility. It has an equally well-deserved reputation for complexity; its gotchas are legion. For example, omitting a virtual destructor in a base class typically leads to incomplete destruction of derived class objects when they are deleted through base class pointers. Experienced C++ programmers learn to avoid these kinds of problematic constructs, but experience should not really be necessary: troublesome C++ can often be detected by static analysis, i.e., by tools that parse and analyze C++ source code. Such tools are becoming widely available, and during the summer and fall of 1996, we undertook an investigation to identify these tools and to assess their capabilities. In this article, we summarize the initial results of our investigation. We were interested in the following questions: What tools statically analyze C++ programs and issue warnings about likely trouble spots? By focusing on static analysis, we limited our research to tools spiritually akin to lint. We explicitly ignored tools designed to detect dynamic (runtime) errors, such as programs that monitor memory usage and report on leaks, etc. Such tools are important, but they offer functionality that complements -- not replaces -- that of static analysis. We also ignored products that focus on lexical issues (e.g., identifier names, indentation style); our interest is in tools that identify constructs that affect program behavior. How comprehensive are the tools in identifying suspect C++ constructs? C++ has many facets, including data abstraction, inheritance, templates, exception handling, etc., and we wanted to find tools that checked for likely errors in many of these areas. A few tools checked only the C subset of C++, and we ignored those offerings. Our interest is in tools for C++ programmers, and C++ programmers have different needs than C programmers. How well do the tools work on real programs? Can they parse real source code? Do they scale well when run on large projects? Are they robust enough to handle complex template instantiations, including those generated by the Standard Template Library (see References)? This article addresses only the first two questions. Our work on the third question continues as this piece goes to press. Identifying Products When we began this project, we were aware of several static analysis tools for C++, but we suspected there were tools we didn't know about. To fill the gaps in our knowledge, we posted a request for information to several Usenix newsgroups, including groups devoted to C++ programming, object-oriented programming, and programming on various platforms. Based on the responses we received, we identified the offerings in Table 1. Table 1:Static Analysis Tools for C++ VendorProductSupported Under Abraxas SoftwareCodeCheckDOS,Windows,Unix CenterLine SoftwareC++ExpertUnix ConSol Software GmbHxlint++Unix Gimpel SoftwareFlexe-/PC-LintDOS,Windows,Unix Hewlett PackardCodeAdvisorUnix ParaSoftCodeWizardUnix Productivity through SoftwareProLintUnix Programming Research Ltd.QA/C++Unix Rational SoftwareApex C/C++Unix We then attempted to contact the vendors to get information on each product. We were unable to get in touch with ConSol Software GmbH, so we eliminated xlint++ from our study. [Note: after this article went to press, ConSol Software GmbH contacted us, and we have included in Table 3 the information they gave us.] We also eliminated Productivity through Software's ProLint, because it is fundamentally a GUI wrapper around Gimpel Software's (command-line based) FlexeLint, and we had already decided to include FlexeLint in our examination. That left us with the following seven products: CodeCheck from Abraxas Software. CodeCheck is a standalone product that lets programmers use a C-like language to specify what kinds of program analysis should be performed. It comes with several predefined analysis programs, including some for computing program complexity metrics and for identifying unportable code. C++Expert from CenterLine Software. Also a standalone product, C++Expert performs static and dynamic analyses of C and C++ programs. Its static checks are drawn from Scott Meyers' Effective C++ and More Effective C++ (see References), and its diagnostics contain hypertext links to on-line versions of those books. FlexeLint/PC-Lint from Gimpel Software. Another standalone product (the name is FlexeLint for Unix, PC-Lint for DOS, Windows, and OS/2), FlexeLint/PC-Lint is perhaps truest to the classic lint tradition. It can check for over 600 potential error conditions in C and C++ source code, including conditions that affect more than one translation unit or that require detailed dataflow analysis. CodeAdvisor from Hewlett Packard. CodeAdvisor is a part of HP's SoftBench development environment. It comes able to enforce 23 predefined rules, but users may extend its capabilities by coding new analyses in C++ and linking them in. Source code information is stored in a database, so it is possible to perform checks that involve multiple translation units. CodeWizard from ParaSoft. CodeWizard is a standalone product designed to enforce a set of 24 rules selected from Effective C++. QA/C++ from Programming Research Ltd. Another standalone product, QA/C++ works in two phases. First, it examines C or C++ source code and stores the results in a database. Different Programming Research analysis tools may then be run against the database, and it is these tools that generate warning messages. There is no database API that lets programmers develop their own analyses. The Apex C/C++ Development Environment from Rational Software. The Apex environment includes, among other capabilities, the ability to enforce 22 predefined rules for C and C++ programming. To these choices we added our own noncommercial program, CCEL (see References), purely for purposes of comparison. CCEL began as a research project on static analysis of C++ programs under the direction of one of us (Meyers) and was eventually fully implemented through independent work by the other (Klaus). We added CCEL to our investigation because we were familiar with its capabilities and limitations, and we felt it would be interesting to compare commercial approaches to our research-based initiative. Approach Our testing of the tools was broken into three phases: We developed of a set of benchmark rules constraining the structure of C++ programs. For example, one rule is that all base classes must have virtual destructors. We tried to develop a set of rules that was representative of the kinds of rules real programmers would find useful. We contacted the vendor for each tool and asked them which rules their product could enforce. This information proved useful during our later empirical tests, because discrepancies between vendor claims and our empirical findings often identified subtle differences between our rules and those enforced by the vendors. We developed of a set of sample source files seeded with rule violations. We ran each tool on each source file to see whether the seeded rule violation was correctly identified. Our results yielded a table (Table 3 below) showing how well each tool enforced our benchmark rules on our benchmark programs. Choosing Rules One can imagine many ways to compose a set of benchmark rules for C++ programs, but it is difficult to argue that one set is "better" than another. As a result, we made no attempt to develop the "best" set of rules. Instead, we fell back on the fact that one of us (Meyers) has authored two books containing guidelines for C++ programming (Effective C++ and More Effective C++), and we chose nearly all our rules from those books. This approach is not as gratuitous as it might appear. Effective C++ and More Effective C++ have been well-received in the C++ programming community, and one or both form the basis for many sets of corporate coding guidelines. In addition, at least two of the static analysis tools in our investigation are based on these books. Finally, by drawing our rules from well-known and easily accessible sources, we avoided the need to explicitly justify individual rules in our benchmark set. Instead, the justification for nearly every rule is available in the books, and we simply refer to the appropriate book location as the rationale for each rule. We chose 36 rules (34 of which were drawn from Effective C++ or More Effective C++), which we divided into eight categories. These rules are listed in Table 2. General 1 E 1 Use const instead of #define for constants at global and file scope. 2 M 2 Use new-style casts instead of C-style casts. 3 M 3 Don't treat a pointer to Derived[] as a pointer to Base[]. Use of new and delete 4 E 5 Use the same form for calls to new and delete. (In general, this calls for dynamic analysis, but static analysis can catch some special cases, e.g., calls to new in ctors and to delete in dtors.) 5 E 6 When the result of a new expression in a ctor is stored in a dumb pointer class member, make sure delete is called on that member in the dtor. 6 E 9 Avoid hiding the default signature for operator new and operator delete. Constructors/Destructors/Assignment 7a E11 Declare a copy constructor for each class declaring a pointer data member. 7b E11 Declare an assignment operator for each class declaring a pointer data member. 8 E12 Initialize each class data member via the member initialization list. 9 E13 List members in a member initialization list in an order consistent with the order in which they are actually initialized. 10 E14 Make destructors virtual in base classes. 11 E15 Have the definition of operator= return a reference to *this. (Note: this says nothing about declarations.) 12a E16 Assign to every local data member inside operator=. 12b E16 Call a base class operator= from a derived class operator=. 12c Use the member initialization list to ensure that a base class copy ctor is called from a derived class copy ctor. 13 Don't call virtual functions in constructors or destructors. Design 14 E19 Use non-member functions for binary operations like +-/* when a class has a converting ctor. 15 E20 Avoid public data members. 16 E22 Use pass-by-ref-to-const instead of pass-by-value where both are valid and the former is likely to be more efficient. 17a E23 Have operators like +-/* return an object, not a reference. 17b M 6 And make those return values const. 18 E25 Don't overload on a pointer and an int. 19 M33 Make non-leaf classes abstract. 20 M24 Avoid gratuitious use of virtual inheritance, i.e., make sure there are at least two inheritance paths to each virtual base class. Implementation 21 E29 Don't return pointers/references to internal data E30 structures unless they are pointers/references-to-const. 22 M26 Never define a static variable inside a non-member inline function unless the function is declared extern. [Footnote: In July 1996, changes to the nascent standard for ANSI/ISO C++ obviated the need for this rule, at least on paper. However, the need still exists in practice, because many compilers continue to heed the older rules that can lead to duplicated variables in inline non-member functions.] 23 Avoid use of "..." in function parameter lists. Inheritance 24 E37 Don't redefine an inherited nonvirtual function. 25 E38 Don't redefine an inherited default parameter value. Operators 26 M 5 Avoid use of user-defined conversion operators (i.e., non-explicit single-argument ctors and implicit type conversion operators). 27 M 7 Don't overload &&, ||, or ,. 28 M 6 Make sure operators ++ and -- have the correct return type. 29 M 6 Use prefix ++ and -- when the result of the increment or decrement expression is unused. 30 M22 Declare op= if you declare binary op (e.g., declare += if you declare +, declare -= if you declare -, etc.). One way to satisfy this constraint is by providing a template that yields the appropriate function. Exceptions 31 M11 Prevent exceptions from leaving destructors. 32 M13 Catch exceptions by reference. Table 2: Benchmark Rules Each rule begins with its rule number, followed by a reference to the Item number in either Effective C++ (E) or More Effective C++ (M) from which it is derived. The text of the rule is often different from the text of the book Item, because the book Items tend to be worded too generally to be checked. Some of the rules may seem controversial, especially in light of the C++ found in many popular class libraries. Rule 15 (no public data members), for example, is widely violated in the Microsoft Foundation Classes, while almost no library adheres to Rule 19 (make all non-leaf classes abstract). With the exceptions of Rules 13 and 23 (which, in this article, we hope are self-explanatory), Effective C++ and More Effective C++ offer firm technical foundations for each rule. We believe it is therefore important that programmers be able to enforce those constraints, even if the majority of programmers choose not to. Furthermore, our decision to include rules that are commonly violated helps us evaluate the effectiveness of the tools' filtering capabilities. (We do not report on this aspect of the tools in this paper, but it is an important consideration in the practical application of any tool; see below.) Benchmark Programs For each of our 36 rules, we developed a trivial source file seeded with a violation of the rule. We then executed each tool on each source file to see if the tools correctly identified the seeded errors. These source files were truly trivial -- many were under 10 lines long. Our goal with these files was not to provide a realistic test of the tools, it was just to see whether the tools could identify rule violations in the simplest of cases. (Sometimes this backfired and yielded misleading results -- see below.) As an example, here is the complete source code for the file used to test rule 20: // 20 M24 Avoid gratuitious use of virtual inheritance, i.e., make // sure there are at least two inheritance paths to each // virtual base class. class Base { int x; }; class Derived: virtual public Base {}; Derived d; Compilers Versus Special Tools Several people responded to our request for information on static analysis tools by remarking that they found little need for such tools. Instead, they wrote, they relied on their compilers to flag conditions that were likely to lead to trouble. The following comment was typical: I find GNU G++ with -ansi -pedantic -Wall -O flags useful. In fact, the Gnu compiler was singled out by more than one writer as being especially good at warning about troublesome C++. This piqued our curiosity about compiler warnings. How many of our candidate rules would compilers identify? To find out, we subm'''
