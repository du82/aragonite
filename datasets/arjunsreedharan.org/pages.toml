full_description = "jQuery is probably the best thing to have happened to an otherwise lousy language JavaScript. Just a couple of things I felt that doesn’t fare well with jQuery. Suppose you want to create an HTML element on the fly, you could use the $() method and pass to it a string that looks like HTML. If the string matches the regex for an HTML tag, then the string is internally passed to the $.parseHTML() method. The onerror event was fired just when the node was created. I could pass any malicious script here instead of the alert, which would then be run immediately. Busted!! What if you are logged in, and given the src path meets the cookies’ restrictions, you are sending off your cookies as well.Busted again!! Disclaimer: The views expressed here are solely those of the author in his private capacity and do not in any way represent the views of the author's employer or any organization associated with the author."
