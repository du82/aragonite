["https://arjunsreedharan.org/tagged/javascript"]
title = "Arjun Sreedharan"
description = "Arjun Sreedharan is a Computer Science Engineer, who is currently pursuing Master's degree in..."
full_description = 'jQuery is probably the best thing to have happened to an otherwise lousy language JavaScript. Just a couple of things I felt that doesn’t fare well with jQuery. Suppose you want to create an HTML element on the fly, you could use the $() method and pass to it a string that looks like HTML. If the string matches the regex for an HTML tag, then the string is internally passed to the $.parseHTML() method. The onerror event was fired just when the node was created. I could pass any malicious script here instead of the alert, which would then be run immediately. Busted!! What if you are logged in, and given the src path meets the cookies’ restrictions, you are sending off your cookies as well.Busted again!! Some time ago, I dropped by the Times of India website and entered a “vector” string as a query in the search field. Then, the page heading read as below (Arjun024 being my twitter handle): Later someday, I searched Google for “arjun024 Times of India”. To my astonishment, Google indexed the link with the “attacking” vector and displayed it as the first result. Now, it is there for posterity to have a go at winning some gold coins ;) We get to the Times of India search page where we can search using the url parameter “query”. Let"s say we want to search for mega, then the url looks like: Whatever value is supplied for the parameter “query”, it is without sanitization assigned to a JavaScript variable here in the form: This means that if you give a quotation mark (“) in the parameter value, the part after the quotation mark escapes out of the assignment to the searchvel variable. Here, we query for Na”//ma : the quotation-mark tricks JavaScript to believe that it is the end of the string and the double forward slashes makes JavaScript consider everything after that as comments and therefore as inactive code. Now, we could insert whatever script we like to and get it reflected off the site in what is a reflected XSS "attack”. I chose to give myself some (cheap) publicity :P and replace the body content with a piece of “news”.'
year_published = 2025
