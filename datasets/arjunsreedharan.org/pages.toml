title = "Arjun Sreedharan"
description = "Arjun Sreedharan is a Computer Science Engineer, who is currently pursuing Master's degree in..."
full_description = "I will try to give a brief overview of what JPEG is and how it works. This is a beginner level article, so we will not dwell too much on the details. First, JPEG is not a file format. It’s a compression method.The term JPEG is an acronym for the Joint Photographic Experts Group, which created the standard. Most of the time you’re talking about your file in a JPEG format, you are referring to the JFIF (JPEG File Interchange Format) wrapper. You click a picture using your camera.The camera’s sensor is overlaid with a color filter array (CFA), usually a Bayer filter, consisting of a mosaic of a 2x2 matrix of red, green, blue and (again) green filters. The green photo-sensors are luminance-sensitive elements and the red and blue ones are chrominance-sensitive elements. Bayer used twice as many green elements as red or blue so as to mimic the physiology of the human eye. From the CFA, we receive image data that is one color per pixel. This is not suitable for JPEG compression. This image data is reconstructed to produce an RGB color triplet per pixel image. The raw image file thus obtained is a bitmap (2D array). It’s very huge in size.So, we need to compress this file, and that’s where JPEG come into play.JPEG is a lossy compression technique, which means it uses approximations and partial data discarding to compress the content. Therefore it's irreversible. JPEG compression is based on the following 2 observations:Observation #1: Human eyes don’t see color (chrominance) quite as well as we do brightness (luminance). Each pixel in your image is stored as a additive combination of Red, Blue and Green values. Each of these values can be in the range of 0 to 255. This color model is called the RGB model. Consider a pixel that is khaki in color. It will be stored as (240, 230, 140). Remember Observation #1 - Luminance is more important to the eventual perceptual quality of the image than color. So we convert from RGB color space to one where luminance is confined to a single channel. This color space is called YCbCr."
year_published = 2025
