["https://arjunsreedharan.org/post/105266490272/hide-data-inside-pointers"]
title = "Hide data inside pointers - Arjun Sreedharan"
description = """
Code related to this article: hide-data-in-ptr
When we write C code, pointers are everywhere. We can make a little extra use of pointers and sneak in some extra information in them. To pull this trick..."""
full_description = "When we write C code, pointers are everywhere. We can make a little extra use of pointers and sneak in some extra information in them. To pull this trick off, we exploit the natural alignment of data in memory. Data in memory is not stored at any arbitrary address. The processor always reads memory in chunks at the same size as its word size; and thus for efficiency reasons, the compiler assigns addresses to entities in memory as multiples of their size in bytes. Therefore on a 32 bit processor, a 4-byte int will definitely reside at a memory address that is evenly divisible by 4. Now let us consider a pointer to an int. As said above, the int can be located at memory addresses 0x1000 or 0x1004 or 0x1008, but never at 0x1001 or 0x1002 or 0x1003 or any other address that is not divisible by 4.Now, any binary number which is a multiple of 4 will end with 00. This essentially means that for any pointer to an int, its 2 lower order bits are always zero. Now we have 2 bits which communicate nothing. The trick here is put our data into these 2 bits, use them whenever we want and then remove them before we make any memory access by dereferencing the pointer. Since bitwise operations on pointers don’t go well with the C standard, We will be storing the pointer as an unsigned int. The following is a naive snippet of the code for brevity. See github repo - hide-data-in-ptr for the full code. We can store any number that can be represented by 2 bits in the pointer. Using put_data(), the last 2 bits of the pointer are set as the data to be stored. This data is accessed using get_data(). Here, all bits except the last 2 bits are overwritten as zeroes there by revealing our hidden data. cleanse_pointer() zeroes out the last 2 bits, making the pointer safe for dereferencing. Note that while some CPUs like Intel will let us access unaligned memory locations, certain others like ARM CPU will fault. So, always remember to keep the pointer pointed to an aligned location before dereferencing."
year_published = 2025
clearnet = "https://arjunsreedharan.org/post/105266490272/hide-data-inside-pointers"
