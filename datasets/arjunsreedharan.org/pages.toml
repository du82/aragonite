["https://arjunsreedharan.org/tagged/array"]
title = "Arjun Sreedharan"
description = "Arjun Sreedharan is a Computer Science Engineer, who is currently pursuing Master's degree in..."
full_description = 'Here we take the size of the array in bytes; then divide it by the size of an individual array element. As you can see in the output, both arr and &arr point to the exact same memory location 0x7fff57266870. (arr + 1) points to 874 which is 4 bytes away from arr, which points to 870 (I have removed the higher order bits of the address for brevity). An int on my machine takes up 4 bytes, so (arr + 1) points to the second element of the array. (&arr + 1) points to 884 which is 20 bytes away from arr (points to 870). (884 - 870 = 14 in hex = 20 in decimal) Taking the size of int into consideration, (&arr + 1) is 5 int-sizes away from the beginning of the array. 5 also happens to be the size of the array. So, (&arr + 1) points to the memory address after the end of the array. Why is (arr + 1) and (&arr + 1) different though arr and &arr point to the same location? The answer - While (arr + 1) and (&arr + 1) have the values, they are different types. arr is of the type int *, where as &arr is of the type int (*)[size]. * (&arr + 1) gives us the address after the end of the array and arr that of the first element of the array.Subtracting latter from former would thus give the length of the array. Pretty cool right? But, please don’t really use this in real life, unless there’s a compelling reason. sizeof is an operator evaluated at compile time (execpt for C99 variable-length arrays), so it’s also pretty cool, though it doesn’t look it! In this case &str is a pointer that points to the pointer str. Remember, in C arrays are not pointers. Q: Accessing the first address after an array seems to be undefined behavior. For example: if your array located at the end of an address-space, the referencing address causing an overflow and your resulting size could be anything. Then how could you access (&arr)[1]<\code> ? A: C doesn’t allow access to memory beyond the end of the array. It does, however, allow a pointer to point at one element beyond the end of the array. The distinction is important.'
