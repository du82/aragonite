full_description = "This article is about writing a simple memory allocator in C. We will implement malloc(), calloc(), realloc() and free(). This is a beginner level article, so I will not spell out every detail.This memory allocator will not be fast and efficient, we will not adjust allocated memory to align to a page boundary, but we will build a memory allocator that works. That’s it. Before we get into building the memory allocator, you need to be familiar with the memory layout of a program. A process runs within its own virtual address space that’s distinct from the virtual address spaces of other processes. This virtual address space typically comprises of 5 sections: As you can see in the image, the stack and the heap grow in the opposite directions.Sometimes the data, bss and heap sections are collectively referred to as the “data segment”,the end of which is demarcated by a pointer named program break or brk.That is, brk points to the end of the heap. Now if we want to allocate more memory in the heap, we need to request the system to increment brk. Similarly, to release memory we need to request the system to decrement brk. Assuming we run Linux (or a Unix-like system), we can make use of sbrk() system call that lets us manipulate the program break. Calling sbrk(0) gives the current address of program break. Calling sbrk(x) with a positive value increments brk by x bytes, as a result allocating memory. Calling sbrk(-x) with a negative value decrements brk by x bytes, as a result releasing memory.On failure, sbrk() returns (void*) -1. To be honest, sbrk() is not our best buddy in 2015. There are better alternatives like mmap() available today. sbrk() is not really thread safe. It can can only grow or shrink in LIFO order.If you do a man 2 sbrk on your macbook, it will tell you: However, the glibc implementation of malloc still uses sbrk() for allocating memory that’s not too big in size.[1] So, we will go ahead with sbrk() for our simple memory allocator. The malloc(size) function allocates size bytes of memory and returns a pointer to the allocated memory. Our simple malloc will look like:"
