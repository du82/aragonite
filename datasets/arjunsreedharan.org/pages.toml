["http://arjunsreedharan.org/post/99370248137/kernels-201-lets-write-a-kernel-with-keyboard-and"]
title = "Kernels 201 - Let’s write a Kernel with keyboard and screen support - Arjun Sreedharan"
description = "Kernels 201 - Let’s write a Kernel with keyboard and screen support In my previous article Kernels 101 - Let’s write a Kernel, I wrote how we can build a rudimentary x86 kernel that boots up using..."
full_description = "In my previous article Kernels 101 - Let’s write a Kernel, I wrote how we can build a rudimentary x86 kernel that boots up using GRUB, runs in protected mode and prints a string on the screen. Today, we will extend that kernel to include keyboard driver that can read the characters a-z and 0-9 from the keyboard and print them on screen. We communicate with I/O devices using I/O ports. These ports are just specific address on the x86’s I/O bus, nothing more. The read/write operations from these ports are accomplished using specific instructions built into the processor. In read_port, the port number is taken as argument. When compiler calls your function, it pushes all its arguments onto the stack. The argument is copied to the register edx using the stack pointer. The register dx is the lower 16 bits of edx. The in instruction here reads the port whose number is given by dx and puts the result in al. Register al is the lower 8 bits of eax. If you remember your college lessons, function return values are received through the eax register. Thus read_port lets us read I/O ports. write_port is very similar. Here we take 2 arguments: port number and the data to be written. The out instruction writes the data to the port. Now, before we go ahead with writing any device driver; we need to understand how the processor gets to know that the device has performed an event. The easiest solution is polling - to keep checking the status of the device forever. This, for obvious reasons is not efficient and practical. This is where interrupts come into the picture. An interrupt is a signal sent to the processor by the hardware or software indicating an event. With interrupts, we can avoid polling and act only when the specific interrupt we are interested in is triggered. A device or a chip called Programmable Interrupt Controller (PIC) is responsible for x86 being an interrupt driven architecture. It manages hardware interrupts and sends them to the appropriate system interrupt."
year_published = 2025
