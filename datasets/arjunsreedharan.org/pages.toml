full_description = "I was once writing a program similar to the following. But I made a little mistake which led me to something interesting. In this code, I am supposedly reading a string from stdin, checking if it begins with the character literal 'a' and if it does, print something. However, if you watch closely enough I missed a dereference operator (*) on line 6. It should have been if (*ch == 'a') { Not noticing the bug, I went on to compile the code. GCC threw the following warning:warning: comparison between pointer and integer Now I knew where to fix, but the warning caught my attention. It says I’m trying to compare a pointer and an integer. But where does the integer come from? I’m not using an integer anywhere in the code except for the return value of main(). In the line that throws the warning, I’m comparing a pointer (ch) to a character literal ('a'). Before I tell you why, let me try to find the size of the character literal and compare it to that of an int and char. As you can see, the character literal doesn’t occupy the size of a char, it takes the size of an int. Disclaimer: The views expressed here are solely those of the author in his private capacity and do not in any way represent the views of the author's employer or any organization associated with the author."
