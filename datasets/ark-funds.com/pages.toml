nge is open for trading. Market returns are based on the trade price at which shares are bought and sold on the NYSE Arca, Inc. using the last share trade. Market performance does not represent the returns you would receive if you traded shares at other times. Total Return reflects the reinvestment of distributions on ex-date for NAV returns and payment date for Market Price returns. The market price of the ETF’s shares may differ significantly from their NAV during periods of market volatility. $(document).ready(function() { var fundId = "1002"; var excludeMarketPrice = "False"; $.ajax({ type: 'GET', url: `/api/fund/performance/${fundId}?excludeMarketPrice=${excludeMarketPrice}`, success: function (response) { $('#PerformanceTableData').html(response.view); const subHeading = $("#ft-performance-sub-heading") subHeading.text(`${response.ticker} ${subHeading.text()}`); }, error: function (error) { console.log(error.statusText); } }); }); Top 10 Holdings As of Full Holdings PDF Full Holdings CSV $(document).ready(function() { var data = { Heading: "Top 10 Holdings", PdfLinkText: "Full Holdings PDF", CsvLinkText: "Full Holdings CSV", Link: { Style: "", Href: "", Aria: "", Target: "", Text: "" } }; var dataJson = JSON.stringify(data); $.ajax({ type: 'GET', data:data, url: "/api/fund/holdings/1002?fundHoldingData=" + encodeURIComponent(dataJson), success: function (html) { $('#hold').html(html); }, error: function (error) { console.log(error.statusText); } }); }); // A Fund 'Exposure Breakdown' component is made in the CMS and added to a page // the component has the following ajax request so the partial view is called // and populated by the server against the latest external data and rendered on the page. // if any variables need to be passed in via CMS - we can send with the data object $(document).ready(function() { $.ajax({ type: 'GET', data: { heading: "Exposure Breakdowns", }, url: "/api/fund/exposure-breakdown/1002", success: function (html) { $('#ExposureBreakdown').append(html); }, error: function (error) { console.log(error.statusText); } }); }); Know Your Fund Fund Documents Featured Documents View All $(document).ready(function() { let fundCheck = "1002"; if(fundCheck){ $.ajax({ type: 'GET', url: "/api/fund/document-table/1002", success: function (data) { $(".ft-etfDocument-input").append(data); } }) } }); Premium/Discount Recent Premium/Discount As of NAV 4PM Mid-Point Difference Premium/Discount Select time period Historical Data Greatest Premium: Greatest Discount: Number of Days At Premium: NAV: Discount: Days Within Percent of NAV Percent of Days ± 0.5% of NAV: Number of Days ± 0.5% of NAV: The Premium/Discount chart shows the difference between the daily market price of the Fund’s shares and the Fund’s net asset value (“NAV”). The daily market price is calculated using the mid-point between the highest bid and the lowest offer on the listing exchange, as of the time that the Fund’s NAV is calculated (usually 4:00 pm Eastern time). The vertical axis of the chart shows the premium or discount of the Mid-Point price as a percentage of the NAV. The horizontal axis shows the number of trading days covered by the chart, and each bar in the chart demonstrates how many days the Fund traded within the given premium/discount range. The data presented in the chart and table above represent past performance and cannot be used to predict future results.—The principal risks of investing in the ARKW include: Equity Securities Risk. The value of the equity securities the Fund holds may fall due to general market and economic conditions. Foreign Securities Risk. Investments in the securities of foreign issuers involve risks beyond those associated with investments in U.S. securities. Information Technology Sector Risk. Information technology companies face intense competition, both domestically and internationally, which may have an adverse effect on profit margins. Cryptocurrency Risk. Cryptocurrency (notably, bitcoin), often referred to as ‘‘virtual currency’’ or ‘‘digital currency,’’ operates as a decentralized, peer-to-peer financial exchange and value storage that is used like money. The Fund may have exposure to bitcoin, a cryptocurrency, indirectly through an investment in the Bitcoin Investment Trust (‘‘GBTC’’), a privately offered, open-end investment vehicle. Cryptocurrency operates without central authority or banks and is not backed by any government. Even indirectly, cryptocurrencies may experience very high volatility and related investment vehicles like GBTC may be affected by such volatility. As a result of holding cryptocurrency, the Fund may also trade at a significant premium to NAV. Cryptocurrency is also not legal tender. Federal, state or foreign governments may restrict the use and exchange of cryptocurrency, and regulation in the U.S. is still developing. Cryptocurrency exchanges may stop operating or permanently shut down due to fraud, technical glitches, hackers or malware. Detailed information regarding the specific risks of ARKW ETF can be found in the prospectus. Additional risks of investing in ARKW include Communications Services Sector Risk, Consumer Discretionary Sector Risk, equity, market, management and non-diversification risks, as well as fluctuations in market value and NAV. An investment in an ETF is subject to risks and you can lose money on your investment in an ETF. There can be no assurance that the ETF will achieve its investment objective. The ETF’s portfolio is more volatile than broad market averages. Shares of ARKW are bought and sold at market price (not NAV) and are not individually redeemed from the ETF. ETF shares may only be redeemed directly with the ETF at NAV by Authorized Participants, in very large creation units. There can be no guarantee that an active trading market for ETF shares will develop or be maintained, or that their listing will continue or remain unchanged. Buying or selling ETF shares on an exchange may require the payment of brokerage commissions and frequent trading may incur brokerage costs that detract significantly from investment returns.The Fund’s exposure to cryptocurrency may change over time and, accordingly, such exposure may not always be represented in the Fund’s portfolio. Many significant aspects of the U.S. federal income tax treatment of investments in bitcoin are uncertain and investment in bitcoin may produce income that is not treated as qualifying income for purposes of the income test applicable to regulated investment companies, such as the Fund. GBTC is expected to be treated as a grantor trust for U.S. federal income tax purposes, and therefore an investment by the Fund in GBTC will generally be treated as a direct investment in bitcoin for such purposes. See ‘‘Taxes’’ in the Fund’s SAI for more information. $(document).ready(function() { $.ajax({ type: 'GET', url: "/api/fund/premium-discount/1002", data: { heading: "Premium/Discount", subHeading: "Recent Premium/Discount" }, success: function (data) { $('.ft-premium-discount-heading, .ft-premium-discount-data').remove() $('.ft-premium-discount-brief').before(data.view) ArkFunds.FundPremiumDiscount.plotFundPremiumDiscountChart(data.chartData) } }); }); <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/7689402e-7496-48a4-8973-4c0ded44565e/Broker-white.svg" alt="" data-eio="l"> Explore Our ETFs ARK believes innovation is key to growth. Our ETFs aim to offer access to companies in some of the most promising areas of the economy. Explore <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/d896cd95-323a-4ede-8ab9-3d1225bd373b/Help_Center_icon_white.svg" alt="" data-eio="l"> Help Center Investing in innovation starts with understanding it. Explore our Help Center to learn more and invest at the pace of innovation! Explore'''
