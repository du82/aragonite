description = "As an evergreen public-private crossover fund [1], the ARK Venture Fund can hold shares of companies throughout their private and public market lifecycles, from early stage to mega cap."
full_description = '''ARK Venture Fund Portfolio As an evergreen public-private crossover fund [1], the ARK Venture Fund can hold shares of companies throughout their private and public market lifecycles, from early stage to mega cap. Private Public All Portfolio as of 2/26/2025 <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/5ce39bda-34da-4c18-bfa8-c08fe043b768/SpaceX_Logo-400x54.png" alt="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/5ce39bda-34da-4c18-bfa8-c08fe043b768/SpaceX_Logo-400x54.png" data-eio="l"> SpaceX Private startup About SpaceX Space Exploration Technologies Corp. (SpaceX) designs and manufactures rockets and spacecraft. The company offers launch services through its rockets and global connectivity through its Starlink satellite constellation.To view our thesis on SpaceX, click here. Headquarters Hawthorne, CA, USA Founding Year 2002 Initial Investment October 2023 <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/e8c738cd-5fa8-4a3c-b74a-ac8764a2996a/lambda_logo_horizontal_white-2000px.png" alt="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/e8c738cd-5fa8-4a3c-b74a-ac8764a2996a/lambda_logo_horizontal_white-2000px.png" data-eio="l"> Lambda Labs Private startup About Lambda Labs Lambda Inc. (Lambda Labs) is a specialized GPU cloud infrastructure provider, serving accelerated compute for AI training and inferencing workloads. Lambda focuses on maximizing the useful life of their GPUs, with the latest generation being used for training, as older generations are increasingly optimized for inference. Moving forward, the company plans on continuing to expand beyond the infrastructure layers, providing an increased range of PaaS products to assist in AI development. Headquarters San Jose, CA, USA Founding Year 2012 Initial Investment January 2025 <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/22c8f148-7888-43c4-b803-9f3357e9a453/anthropic-social_share-bw-400x69.png" alt="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/22c8f148-7888-43c4-b803-9f3357e9a453/anthropic-social_share-bw-400x69.png" data-eio="l"> Anthropic Private startup About Anthropic Anthropic is an AI startup founded by the former VP of Research at OpenAI. It’s conducting research and building AI products that put safety at the frontier. Its first product, Claude, is a general purpose large language model that leverages Anthropic’s research on Constitutional AI to better align the model and prevent abuse. We believe some companies will opt to train their own AI models, while others will leverage a combination of proprietary and third-party models. In our view, Anthropic’s research on alignment positions it for success as a third-party model provider.To view our thesis on Anthropic, click here. Headquarters San Francisco, CA, USA Founding Year 2021 Initial Investment March 2023 <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/7d0c4d67-9914-46cf-b48d-3a3d7f04b74b/hammerspace-logo_white-400x209.png" alt="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/7d0c4d67-9914-46cf-b48d-3a3d7f04b74b/hammerspace-logo_white-400x209.png" data-eio="l"> Hammerspace Private startup About Hammerspace Hammerspace provides a global data environment (GDE), through which globally distributed teams of developers can access and manipulate data as if it was locally stored, despite that data existing in a distributed cloud of varying storage types and locations. This is done via a shared metadata layer that bridges storage vendor silos, allowing for a "data-centric" approach to data, rather than the existing "storage-centric" approach that relies on creating copies and forks to distribute data.To view our thesis on Hammerspace, click here. Headquarters San Mateo, CA, USA Founding Year 2018 Initial Investment July 2023 <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/e425c92d-0b4c-4a5e-bd0e-234d02b874fe/blockdaemon-logo-white-400x88.png" alt="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/e425c92d-0b4c-4a5e-bd0e-234d02b874fe/blockdaemon-logo-white-400x88.png" data-eio="l"> Blockdaemon Private startup About Blockdaemon Blockdaemon is a cryptocurrency infrastructure provider, focusing on delivering products across three primary categories: node management, staking services, and wallet technology. Blockdaemon’s goal is to deliver enterprises a unified infrastructure for integrated with public blockchain infrastructure. Blockdaemon is estimated to be the world’s largest operator of blockchain nodes, managing over 100,000 nodes in a global, multi-cloud deployment.To view our thesis on Blockdaemon, click here. Headquarters Los Angeles, CA, USA Founding Year 2017 Initial Investment June 2023 <img src="" alt="" data-eio="l"> Epic Games Private startup About Epic Games Epic Games is a video game and software company that develops and publishes its own video games and offers its game engine technology to other developers. The company’s game engine, Unreal Engine, powers proprietary games such as Fortnite and Rocket League. Notable third-party games using Unreal Engine include PlayerUnknown’s Battleground and Gears of War.To view our thesis on Epic Games, click here. Headquarters Cary, NC, USA Founding Year 1991 Initial Investment September 2022 <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/97f196be-8f54-4e57-9c8d-cf4d3d7cc27b/openai-white-395x400.png" alt="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/97f196be-8f54-4e57-9c8d-cf4d3d7cc27b/openai-white-395x400.png" data-eio="l"> OpenAI Private startup About OpenAI OpenAI is at the forefront of a Cambrian explosion in artificial intelligence capability, having produced several of the most influential breakthroughs in foundational AI research, including both the GPT and DALLE series of models, and launching the first major consumer application of generative AI, ChatGPT, which is the fastest application in history to grow to 100 million active users.To view our thesis on OpenAI, click here. Headquarters San Francisco, CA, USA Founding Year 2015 Initial Investment April 2024 <img src="" alt="" data-eio="l"> Undisclosed Nuclear Company Private startup About Undisclosed Nuclear Company More information coming soon! Headquarters Founding Year Initial Investment February 2025 <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/96571d76-d459-49a4-9a89-762ff3b817ff/tenstorrent-logo-white-400x101.png" alt="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/96571d76-d459-49a4-9a89-762ff3b817ff/tenstorrent-logo-white-400x101.png" data-eio="l"> Tenstorrent Private startup About Tenstorrent Tenstorrent, a semiconductor startup, is pioneering the development of high-performance CPU and AI chips. Distinctively, their technology is grounded in the open-source RISC-V instruction set. This approach provides a welcome alternative to the closed-source ecosystems, and subsequent vendor lock-in, that is traditional in the semiconductor industry. Their business model is focused on monetizing through intellectual property (IP) licensing and the sale of AI accelerators. Future plans include expanding into the chiplet market, which suggests a strategy geared towards modular and versatile chip designs. Headquarters Toronto, ON, Canada Founding Year 2016 Initial Investment November 2023 <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/2893e763-41eb-4d7c-9bda-73e7bb79ec0d/FreenomeLogo bw.png" alt="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/2893e763-41eb-4d7c-9bda-73e7bb79ec0d/FreenomeLogo bw.png" data-eio="l"> Freenome Private startup About Freenome Freenome combines deep learning and novel biomolecular techniques to detect early-stage cancers from a routine, non-invasive blood draw. Freenome has raised $1.1B from investors including a16z (Andreessen Horowitz), GV (Google Ventures), Fidelity, and Roche, to deliver its mission of creating tools that empower everyone to prevent, detect, and treat their disease. The company has announced completion of one of the largest ever clinical studies in 35,000 subjects. Freenome's ecosystem partnerships and digital distribution channels promote a more efficient, less capital-intensive commercial model.To view our thesis on Freenome, click here. Headquarters San Francisco, CA, USA Founding Year 2014 Initial Investment September 2022 <img src="" alt="" data-eio="l"> Undisclosed AI Company Private startup About Undisclosed AI Company More information coming soon! Headquarters Founding Year Initial Investment February 2025 <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/7ac9929b-5e19-4748-bba5-e87797d9e1c7/relation-cta_white-400x219.png" alt="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/7ac9929b-5e19-4748-bba5-e87797d9e1c7/relation-cta_white-400x219.png" data-eio="l"> Relation Therapeutics Private startup About Relation Therapeutics Relation Therapeutics is a company using artificial intelligence, machine learning and innovative in-vitro disease models to develop novel therapeutics to treat osteoporosis and other bone-related disorders. Headquarters London, UK Founding Year 2019 Initial Investment January 2024 <img src="" alt="" data-eio="l"> Discord Inc Private startup About Discord Inc Discord is a casual communications platform that enables its individual users and groups/organizations to communicate via text, audio, and video. Through its comprehensive set of features, integrations, and helper bots, Discord enables communities to customize their servers and channels to their liking, allowing the platform to service a wide range of communication needs, from small-group casual socialization all the way to small to medium enterprise (SME) collaboration.To view our thesis on Discord, click here. Headquarters San Francisco, CA, USA Founding Year 2015 Initial Investment November 2022 <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/fe6b7467-36ed-402f-a0d2-1db52d1bf9e8/figure_ai_logo_bw.png" alt="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/fe6b7467-36ed-402f-a0d2-1db52d1bf9e8/figure_ai_logo_bw.png" data-eio="l"> Figure AI Private startup About Figure AI Figure Robotics is an artificial intelligence robotics company that is building a multi-purpose humanoid form robot. Figure’s goal is to deploy autonomous humanoid workers to support humans on a global scale.To view our thesis on Figure, click here. Headquarters Sunnyvale, CA, USA Founding Year 2022 Initial Investment February 2024 <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/67f2a423-54bd-4c57-8c3e-5226ac7de42a/Archer_Aviation_Logo-bw-328x400.png" alt="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/67f2a423-54bd-4c57-8c3e-5226ac7de42a/Archer_Aviation_Logo-bw-328x400.png" data-eio="l"> Archer Aviation Public startup About Archer Aviation Archer Aviation is a company headquartered in San Jose, California, which is developing eVTOL (electric vertical take-off and landing) aircraft. Its eVTOL aircraft are planned to transport people in and around cities in an air taxi service and are claimed to have a range of up to 100 miles at speeds of up to 150 miles per hour. Headquarters San Jose, CA, USA Founding Year 2018 Initial Investment August 2023 <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/9af63b61-1769-4458-ab5f-44c752501f65/Zipline_HorizontalLogo_Screen_Charcoal-400x175.png" alt="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/9af63b61-1769-4458-ab5f-44c752501f65/Zipline_HorizontalLogo_Screen_Charcoal-400x175.png" data-eio="l"> Zipline Private startup About Zipline Drone delivery company Zipline operates in Africa, the US, and Japan, providing instant delivery service to businesses and customers through its Platform 1 (P1) and recently announced P2 drone systems. The company plans to deliver healthcare, food, and e-commerce items via drone.To view our thesis on Zipline, click here. Headquarters San Francisco, CA, USA Founding Year 2014 Initial Investment May 2023 <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/437075d3-5f3b-4066-a97f-fd3340dc7b63/Databricks_Logo_white_square.png" alt="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/437075d3-5f3b-4066-a97f-fd3340dc7b63/Databricks_Logo_white_square.png" data-eio="l"> Databricks Private startup About Databricks Databricks is a software platform that helps its customers unify their analytics across the business, data science, and data engineering. It also provides a Unified Analytics Platform for data science teams to collaborate with data engineering and lines of business to build data products. Headquarters San Francisco, CA, USA Founding Year 2013 Initial Investment September 2023 <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/e0648214-6f22-48d9-a075-f77d5ce22205/Umoja_Biopharma_Logo white.png" alt="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/e0648214-6f22-48d9-a075-f77d5ce22205/Umoja_Biopharma_Logo white.png" data-eio="l"> Umoja Biopharma Private startup About Umoja Biopharma Umoja is developing a new approach to cancer therapy that retools a patient’s immune system in vivo, enhancing the body’s natural capacity to fight cancer. Umoja envisions a world where all patients have access to advanced immunotherapies and are free from the burdens of traditional cancer therapies. Headquarters Seattle, WA, USA Founding Year 2019 Initial Investment December 2024 <img src="" alt="" data-eio="l"> Undisclosed Genomics Company Private startup About Undisclosed Genomics Company More information coming soon! Headquarters Founding Year Initial Investment January 2025 <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/9b8943cb-f4df-4bf5-9455-1a9475036cd7/Revolut-Logo bw (1).png" alt="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/9b8943cb-f4df-4bf5-9455-1a9475036cd7/Revolut-Logo bw (1).png" data-eio="l"> Revolut Private startup About Revolut Revolut is a global neobank and fintech company headquartered in London, UK, offering digital banking and financial services through its mobile app. Founded in 2015, Revolut operates in over 30 countries across Europe, North America, and Asia-Pacific, with plans to expand to Latin America, the Middle East, and other regions. The company provides a wide range of products, including multi-currency accounts, debit cards, currency exchange, peer-to-peer payments, international transfers, investments, cryptocurrency trading, and insurance services for both retail and bu'''
