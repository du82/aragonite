 not guarantee future results. The performance data quoted represents past performance and current returns may be lower or higher. The investment return and principal will fluctuate so that an investor’s shares when redeemed may be worth more or less than the original cost. Extraordinary performance is attributable in part due to unusually favorable market conditions and may not be repeated or consistently achieved in the future. The Fund’s most recent month-end performance can be found in the fund material section. Returns for less than one year are not annualized. Net asset value (“NAV”) returns are based on the dollar value of a single share of the ETF, calculated using the value of the underlying assets of the ETF minus its liabilities, divided by the number of shares outstanding. The NAV is typically calculated at 4:00 pm Eastern time on each business day the Cboe BZX Exchange is open for trading. Market returns are based on the trade price at which shares are bought and sold on the Cboe BZX. using the last share trade. Market performance does not represent the returns you would receive if you traded shares at other times. Total Return reflects the reinvestment of distributions on ex-date for NAV returns and payment date for Market Price returns. The market price of the ETF’s shares may differ significantly from their NAV during periods of market volatility. A bid-ask spread is the amount by which the ask price exceeds the bid price for an asset in the market. $(document).ready(function() { var fundId = "1010"; var excludeMarketPrice = "False"; $.ajax({ type: 'GET', url: `/api/fund/performance/${fundId}?excludeMarketPrice=${excludeMarketPrice}`, success: function (response) { $('#PerformanceTableData').html(response.view); const subHeading = $("#ft-performance-sub-heading") subHeading.text(`${response.ticker} ${subHeading.text()}`); }, error: function (error) { console.log(error.statusText); } }); }); Top 10 Holdings As of Full Holdings PDF Full Holdings CSV $(