title = "How To Invest in ARK Funds"
description = "ARK Funds are available through various channels, including broker-dealers, investment advisers, and other financial services."
full_description = "How To Invest In ARK Funds ARK Funds are available through various channels, including broker-dealers, investment advisers, and other financial services. Availability Buy through your brokerage. Talk to your financial advisor today For Financial Professionals, Institutions, and Capital Markets Contact our sales partner, Resolute Investment Managers for additional information regarding the ARK Funds or schedule a call with an ARK specialist. 1-800-679-7759 [email protected] Email your advisor Schedule a call How To Invest In The ARK Venture Fund (ARKVX) All U.S. self-directed investors can download the SoFi app and, with as little as $500, invest in a portfolio of private and public companies through the ARK Venture Fund. SoFi provides members with the ability to invest in a standard brokerage account, or through a Traditional or Roth Individual Retirement Account (IRA). Registered investment advisors, family offices, high net worth individuals, and institutional investors who clear or custody at Fidelity, TradePMR, Pershing, and Hilltop and approved individuals with a Titan membership have access to the ARK Venture Fund. Additional access to the ARK Venture Fund may also be available through other distribution channels. Please email [email protected] for more information. Invest On SoFi Access ARK ETFs Our ETFs are available Through Various Channels Click below to be redirected to your brokerage or investment platform.* Self Directed Brokerage Financial Advisor Managed Ameriprise Charles Schwab Chase E-Trade Fidelity Firstrade Interactive Brokers Merrill Edge Public Robinhood SoFi TD Ameritrade TradeStation Vanguard Webull WellsTrade Charles Schwab Commonwealth Fidelity First Republic Hightower Janney JPM Wealth LPL Merrill Lynch Morgan Stanley Pershing Raymond James RBC Stifel TD Ameritrade UBS Waddell & Reed Wells Fargo *Neither ARK Investment Management LLC nor the ARK ETF Trust is affiliated with the financial services firms listed above. The listing and order of listing should not be viewed as a recommendation or endorsement. It does not represent a complete list and ARK ETFs may be available on additional advisory, wirehouse, or brokerage platforms. PLEASE NOTE: ARKB, The ARK 21Shares Bitcoin ETF may not be available to for trading on some brokerage platforms. How To Utilize ARK’s Funds ARK believes innovation deserves a strategic allocation in investor portfolios. Source for Growth Suited for investors who seek long-term growth by accessing companies that ARK believes are at the forefront of innovation in some of the most promising areas of the economy. Portfolio Diversification Suited for investors who want to diversify their existing portfolio with strategies that offer low correlation to a number of asset classes held in most portfolios or as a hedge against rapid change. Moderate-to-High Risk Suited for investors that have a moderate-to-high risk profile and intend to stay invested for the medium-to-long term. ARK suggests an investment horizon of a full market cycle or 5-7 years."
