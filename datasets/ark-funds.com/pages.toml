 to a number of asset classes held in most portfolios or as a hedge against rapid change. Moderate-to-High Risk Suited for investors that have a moderate-to-high risk profile and intend to stay invested for the medium-to-long term. ARK suggests an investment horizon of a full market cycle or 5-7 years. What Are ETFs? An Exchange Traded Fund (ETF) allows investors to buy and sell an entire basket of securities with a single transaction and can provide the following benefits: Exchange ETFs are listed on various exchanges. For instance, U.S. exchanges include the New York Stock Exchange (NYSE), Chicago Board Options Exchange (Cboe), and Nasdaq. Traded While there are differences, ETFs act similar to stocks when traded. Investors can buy and sell ETF shares during market hours, like trading shares of a public company. Fund An ETF is a portfolio of securities, much like a mutual fund. ETFs can be based on an existing index or a unique mixture of stocks that can change daily. Learn More Webinar starts in: Days : Hours : Min <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/4fb95389-e5cb-423a-b13a-5561cf14f9d5/ARK_ETF_webinar_countdown.jpg" alt="webinar, ark etfs, etf, ark webinar, etf webinar, cathie wood, arkk" data-eio="l"> ARK's On Demand Webinars Each month, ARK hosts webinars on its ETFs, Venture Fund, research and the macro-economic climate. We analyze ARK fund performance, explain portfolio composition, and take investor questions. Register <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/3a720de9-6609-4741-a188-c2ad2285f43f/About_ARK_icon_white.svg" alt="" data-eio="l"> About ARK ARK believes innovation is key to growth. We seek to offer Exchange Traded Funds (ETFs) that allow you to invest in the future today. Explore <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/d896cd95-323a-4ede-8ab9-3d1225bd373b/Help_Center_icon_white.svg" alt="" data-eio="l"> Help Center Investing in innovation starts with understanding it. Explore our Help Center to learn more and invest at the pace of innovation! Explore'''
