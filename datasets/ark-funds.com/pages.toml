title = "About - Ark Funds"
description = "Invest in ARK's Innovation ETFs – Exchange Traded Funds, designed to aim for attractive performance, uncorrelated to traditional investment strategies."
full_description = '''About ARK's Funds ARK Funds seek to offer access to disruptive innovation and transformational companies. Explore ARK ETFs Why Innovation? Three reasons why we believe ARK Funds should be represented in a portfolio. Invest In The Future We believe innovation is changing lives and businesses, creating opportunities to own tomorrow's disruptors by investing in the future today. Capitalize On Inefficiencies We believe the opportunities resulting from disruptive innovation often are underestimated or misunderstood by traditional investment managers. Make The World Better We believe innovation can help transform and solve some of the world’s most persistent problems and help change the way the world works. Why Invest Now? According to ARK’s research, the global economy is undergoing the largest technological transformation in history. In the late nineteenth century, three innovation platforms evolved at the same time and changed the way the world worked. Thanks to the introduction of the telephone, automobile, and electricity, the world’s productivity exploded as costs dropped, unleashing demand across sectors. Today, we believe that artificial intelligence, DNA sequencing, robotics, energy storage, and blockchain technology are the innovation platforms leading the global economy into what could be the most transformative period in history. What differentiates ARK? What is ARK's investment process? How long should I stay invested? ARK’s Investment Process Through an iterative investment process, combining top-down and bottom-up research, ARK aims to identify innovation early, capitalize on the opportunities, and provide long-term value to investors. Top Down Research To define the investment universe, ARK’s investment process initially examines how the world is changing and where it is headed. Ideation Ideation Identify Disruptive Innovations Sizing The Opportunity Define The Potential Universe Bottom Up Research To refine the investment opportunity, ARK’s bottom-up analysis evaluates potential investments based on our defined key metrics. Stock Selection And Valuation Select Portfolio Companies Portfolio And Risk Management Monitor Conviction & Market Volatility Please note that the investment process is applicable to ARK’s actively managed Funds and does not apply in the same manner to ARK’s index ETFs. Meet The Team Catherine D. Wood Chief Investment OfficerPortfolio Manager Cathie registered ARK Investment Management LLC (“ARK”) as an investment advisor with the U.S. Securities and Exchange Commission in January 2014. With over 40 years of experience identifying and investing in innovation, Cathie founded ARK to focus solely on disruptive innovation while adding new dimensions to research. Prior to ARK, Cathie spent twelve years at AllianceBernstein as CIO of Global Thematic Strategies where she managed over $5 billion. Cathie joined Alliance Capital from Tupelo Capital Management, a hedge fund she co-founded, which in 2000, managed approximately $800 million in global thematic strategies. Prior to her tenure at Tupelo Capital, she worked for 18 years with Jennison Associates LLC as Chief Economist, Equity Research Analyst, Portfolio Manager, and Director. She started her career in Los Angeles, California at The Capital Group as an Assistant Economist. Cathie received her Bachelor of Science, summa cum laude, in Finance and Economics from the University of Southern California. For more information please visit the ARK advisor website. "In a world driven by innovation, we believe investors need to be on the right side of change." Tom Staudt President Kellen Carter Chief Compliance Officer / Chief Legal Officer / Secretary William “Bill” Cox Treasurer and Chief Financial Officer, ARK ETF Trust Rob Kamentsev Treasurer and Chief Financial Officer, ARK Venture Fund ARK Investment Management LLC Is The Investment Advisor To The ARK ETFs and the ARK Venture Fund. Visit The Advisor Website To Learn More About The Entire ARK Research And Investment Team. Advisor Website ARK ETF Trust and ARK Venture Fund Board Of Trustees The ARK ETF Trust and ARK Venture Fund Board of Trustees is composed of individuals who oversee the ARK ETFs and ARK Venture Fund with a wealth of knowledge, insights, and expertise. Darlene T. Deremer | Chairwoman and Trustee (June 2014) Darlene was a Managing Partner at Grail Partners LLC, 2005 to 2019, and remains an Advisory Partner today. Darlene also serves on the Board of Trustees for Syracuse University and Hillcrest Asset Management. She served on the Board of Directors for United Capital Wealth Advisors, 2008 to 2019 and the Board of Directors for Confluence Technologies, Inc. (2018 – 2021). Darlene was Vice President and Director in the Asset Management Division of State Street Bank & Trust Company (now State Street Global Advisors), 1985 to 1987, and Vice President at T. Rowe Price & Associates, 1982 to 1985. Scott R. Chichester | Trustee (June 2014) Chief Financial Officer, Sterling Seal & Supply Inc. since 2012; Director, President, and Treasurer, Bayview Acquisition Corp since 2010. Robert G. Zack | Trustee (June 2014) Counsel, Dechert LLP (2012 – 2014); Executive Vice President, Oppenheimer Funds, Inc., 2004 to 2011. Catherine D. Wood | Trustee (June 2014) Managing Member, Founder, and Chief Executive Officer of ARK Investment Management LLC since 2013; Senior Vice President and Chief Investment Officer of Thematic Portfolios, AllianceBernstein L.P., 2009 to 2013. For more information please visit the ARK advisor website. Darlene T. Deremer | Chairwoman/Trustee Darlene T. Deremer | Chairwoman and Trustee (June 2014) Darlene was a Managing Partner at Grail Partners LLC, 2005 to 2019, and remains an Advisory Partner today. Darlene also serves on the Board of Trustees for Syracuse University and Hillcrest Asset Management. She served on the Board of Directors for United Capital Wealth Advisors, 2008 to 2019 and the Board of Directors for Confluence Technologies, Inc. (2018 – 2021). Darlene was Vice President and Director in the Asset Management Division of State Street Bank & Trust Company (now State Street Global Advisors), 1985 to 1987, and Vice President at T. Rowe Price & Associates, 1982 to 1985. Scott R. Chichester | Trustee Scott R. Chichester | Trustee (June 2014) Chief Financial Officer, Sterling Seal & Supply Inc. since 2012; Director, President, and Treasurer, Bayview Acquisition Corp since 2010. Robert G. Zack | Trustee Robert G. Zack | Trustee (June 2014) Counsel, Dechert LLP (2012 – 2014); Executive Vice President, Oppenheimer Funds, Inc., 2004 to 2011. Catherine D. Wood | Trustee Catherine D. Wood | Trustee (June 2014) Managing Member, Founder, and Chief Executive Officer of ARK Investment Management LLC since 2013; Senior Vice President and Chief Investment Officer of Thematic Portfolios, AllianceBernstein L.P., 2009 to 2013. For more information please visit the ARK advisor website. <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/7689402e-7496-48a4-8973-4c0ded44565e/Broker-white.svg" alt="" data-eio="l"> Explore Our Funds ARK believes innovation is key to growth. Our Funds aim to offer access to companies in some of the most promising areas of the economy. Explore <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/d896cd95-323a-4ede-8ab9-3d1225bd373b/Help_Center_icon_white.svg" alt="" data-eio="l"> Help Center Investing in innovation starts with understanding it. Explore our Help Center to learn more and invest at the pace of innovation! Explore'''
