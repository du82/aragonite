o so. Extreme volatility in the future, including further declines in the trading prices of bitcoin, could have a material adverse effect on the value of the Shares and the Shares could lose all or substantially all of their value. Shares of the Trust are generally bought and sold at market price (not NAV) and are not individually redeemed from the Trust. Only Authorized Participants may trade directly with the Trust and only large blocks of Shares called “creation units.” Your brokerage commissions will reduce returns. Shares in the Trust are not FDIC insured and may lose value and have no bank guarantee. This material must be accompanied or preceded by a prospectus. Carefully consider the Trust’s investment objectives, risk factors, and fees and expenses before investing. For further discussion of the risks associated with an investment in the Trust please read the Trust’s prospectus. Foreside Global Services LLC is the marketing agent of the ARK 21Shares Bitcoin ETF. 21Shares US LLC is the sponsor of the ARK 21Shares Bitcoin ETF. 21Shares is not affiliated. with Foreside Global Services LLC. 21Shares is not affiliated with ARK Investment Management LLC. As sub-adviser to the Funds, ARK Invest provides assistance in the marketing of the Shares. $(document).ready(function() { $.ajax({ type: 'GET', url: "/api/fund/premium-discount/1010", data: { heading: "Premium/Discount", subHeading: "Recent Premium/Discount" }, success: function (data) { $('.ft-premium-discount-heading, .ft-premium-discount-data').remove() $('.ft-premium-discount-brief').before(data.view) ArkFunds.FundPremiumDiscount.plotFundPremiumDiscountChart(data.chartData) } }); }); <img src="https://assets.ark-funds.com/media-12243148-2a3e-4996-9763-260f93905eb9/7689402e-7496-48a4-8973-4c0ded44565e/Broker-white.svg" alt="" data-eio="l"> Explore Our ETFs ARK believes innovation is key to growth. Our ETFs aim to offer access to companies in some of the most promising areas of the economy. Explore <img src="ht