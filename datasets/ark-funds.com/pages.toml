title = "Privacy Policy - ARK Funds"
full_description = "Privacy PolicyThis Privacy Notice was last updated on June 5, 2024.This Privacy Notice applies to personal data collected on our websites https://ark-invest.com/ and https://ark-funds.com/ (“Websites”). This Privacy Notice sets out the categories of personal data we collect from you, how we collect it, what we use it for and with whom we share it in accordance with the General Data Protection Regulation (EU) 2016/679 (“GDPR”). For the purposes of this Privacy Notice, “ARK”, “we”, “us”, and “our” means ARK Investment Management LLC, ARK ETF Trust and ARK Venture Fund.By “personal data” we mean any information relating to you such as your name, contact details, taxpayer identification number, account number, account balance and transaction information or online identifiers such as your IP address. Personal data does not include data where you can no longer be identified from it such as anonymized aggregate data.ARK is a data controller. This means that we are responsible for deciding how we hold and use personal data about you. Our address is 200 Central Avenue, St. Petersburg, FL 33701. If you have any questions about this Privacy Notice or how we handle your personal data, please contact us at [email protected].This Privacy Notice applies to personal data about you that we collect, use and otherwise process in connection with your relationship with us as a user of the Websites.We may provide supplemental privacy notices on specific occasions when we are collecting or processing personal data about you so that you are fully aware of how and why we are using your personal data. Those supplemental notices should be read together with this Privacy Notice.What Personal Data Do We Collect About You And What Do We Use It For?The categories of personal data about you which we may collect, store and use are set out in the table below and in each case we have indicated what we use your personal data for and our ‘lawful basis’ for processing it. The law specifies certain ‘lawful bases’ under which we are allowed to use your personal data. Most commonly, we will rely on one or more of the following lawful bases for processing your personal data:Where we need to comply with a legal obligation;Where it is necessary for our legitimate interests (or those of a third party) and your interests and fundamental rights do not override those interests; and/orWhere we have obtained your consent.We may rely on your consent as a lawful basis for processing your personal data. You have the right to withdraw consent at any time by contacting us at the details given at the beginning of this notice.Categories of personal data collectedWhat we use this personal data forLawful BasisName, contact details, business contact details, location information, behavioural information, device, browser information, advertising information and information about how you use our WebsitesIn connection with our legal obligations and legal proceedings, such as responding to a subpoena.Processing is necessary for the purposes of our legitimate interests in complying with legal obligations to which we are subject.To carry out statistical analysis and market research.Processing is necessary for the purposes of our legitimate interests in analyzing and researching the market.To provide tailored experiences and advertisements about our products and services to you.Processing is necessary for the purposes of our legitimate interests in providing you with tailored advertising and experiences and in promoting our products and services.To provide information and products that you have requested from us, such as our White Papers and research information.Processing is necessary for the purposes of our legitimate interests in providing you with tailored advertising and in promoting our products and services.To update and maintain our records.Processing is necessary for the purpose of our legitimate interest in maintaining accurate records.To deliver relevant website content and advertisements to you and measure or understand the effectiveness of the advertising we deliver to you.Processing is necessary for the purposes of our legitimate interests in studying how our clients use our products/services, to develop them, grow our business and inform our marketing strategy.To use data analytics to improve our Websites, products/services, marketing, client relationships and experiences.Processing is necessary for the purposes of our legitimate interests to define types of users for our products/services, to keep our Websites updated and relevant, to develop our business and to inform our marketing strategy.To identify products, content and services that you might be interested in.Processing is necessary for the purposes of our legitimate interests in identifying the types of users for our products/services and to develop our business and to inform our marketing strategy.To market our products, content and services to you directly or through our third-party sales affiliates.Consent.To send you surveys regarding ARK products or services.Consent.To invite you to events such as our webinars.Consent.To send you automated email workflows on ARK literature, events or services, based on information you have requested.Consent.We also collect, use and share aggregated data such as statistical or demographic data for any purpose. Aggregated data may be derived from your personal data but is not considered personal data itself as it can no longer be used to identify you. For example, we may aggregate your browsing information data to calculate the percentage of our users interested in a specific product type. However, if we combine or connect aggregated data with your personal data so that it can be used to identify you, we treat the combined data as personal data which will be used in accordance with this Privacy Notice.Please note that we may process your personal data without your knowledge or consent, in compliance with the above rules, if we are required by law to do so or if we reasonably believe that it is necessary to protect our rights and/or to comply with judicial or regulatory proceedings, a court order or other legal process.How Do We Collect Your Personal Data?We may collect personal data about you:When you submit your information on our Websites through our collection formsWhen you request literature or research information from usWhen you visit our WebsitesWhen you attend our webinar presentationsWhen you attend other ARK-hosted eventsWhen we send you emailsWe may also automatically collect certain data when you interact with our Websites, such as technical data about your equipment, browsing actions and patterns. We collect this personal data by using cookies, server logs and other similar technologies. Please see our cookie policy for further details.In addition, we may receive personal data about you from third parties and public sources, such as:Companies contracted by us to provide services to you, such as our webinar service providerCompanies contracted by us to offer or market our sales materials to you, such as our sales affiliates and external sales partnersOur marketing service provider, who combines data you provide on our Websites with other publicly available data about you, such as your social media account informationWith Whom Do We Share Your Personal Data?We may share your personal data with third parties where this is required by law, where you have consented, or where we have another legitimate interest in doing so.We may share your personal data with:Our service providers, including our attorneys, our IT service providers, our webinar service provider and our marketing service providerOur sales affiliates and external sales partnersOther entities in our group for advertising and marketing purposes, in the context of a business reorganization or group restructuring exercise, for system maintenance support and for hosting of dataA regulator or government entity if we are required by law to do so or if we reasonably believe that disclosure is necessary to protect our rights and/or to comply with judicial or regulatory proceedings, a court order or other legal processWhat If You Do Not Provide The Personal Data We Request?If you do not provide us with certain personal data when requested, we may not be able to provide you with the services or products you have requested.Change Of PurposeWe will only use your personal data for the purposes for which we collected it (as identified above in the What we use this personal data for column), unless we reasonably consider that we need to use it for another reason which is compatible with the original purpose for which you provided it to us. If we need to use your personal data for a purpose that is unrelated to the original purpose for which you provided it to us, we will notify you and we will explain the legal basis which allows us to do so.“Do Not Track” SignalsSome web browsers may transmit “do not track” signals to the websites and other online services with which the browser communicates. There is no standard that governs what, if anything, websites should do when they receive these signals. We currently do not take action in response to these signals. If and when a standard for responding is established, we may revisit our policy on responding to these signals.Processing Of Your Personal Data Outside The EEAARK Investment Management LLC, ARK ETF Trust and ARK Venture Fund are U.S. organizations that do not have affiliates or offices in the EU. Our marketing partners and sales affiliates are also U.S. organizations that do not have affiliates or offices in the EU.The personal data we collect about you will be transferred directly by you to us, our service providers or our sales affiliates outside of the EEA. It is therefore necessary for us to process your personal data outside of the EEA for the performance of our contract with you. We have put in place physical, electronic and procedural safeguards that are reasonably designed to protect your personal data from unauthorized access and use in order to ensure that your personal data is treated in a manner that is consistent with and which respects the EU laws on data protection. If you require further information about the transfer of your personal data outside of the EEA, you can request it from [email protected].How Long Will We Retain Your Personal Data?We will only retain your personal data for as long as necessary to fulfill the purposes we collected it for, including for the purposes of satisfying any legal, regulatory, accounting or reporting requirements.To determine the appropriate retention period for personal data, we consider the amount, nature, and sensitivity of the personal data, the potential risk of harm from unauthorised use or disclosure of your personal data, the purposes for which we process your personal data and whether we can achieve those purposes through other means, and the applicable legal requirements.In some circumstances, we may anonymize your personal data so that it can no longer be associated with you, in which case it is no longer personal data.Once we no longer require your personal data for the purposes we collected it for, we will securely destroy your personal data in accordance with applicable laws and regulations.Accuracy Of Personal DataIt is important that the personal data we hold about you is accurate and current. Please let us know if your personal data changes during your relationship with us.Your Rights In Relation To Your Personal DataYou have rights as an individual which you can exercise in relation to the information we hold about you under certain circumstances. These rights are to:Request access to your personal data (commonly known as a “data subject access request”) and request certain information in relation to its processing;Request rectification of your personal data;Request the erasure of your personal data;Request the restriction of processing of your personal data;Object to the processing of your personal data;Request the transfer of your personal data to another party.If you want to exercise any of these rights please contact us at [email protected].You also have the right to make a complaint at any time to an EU data protection authority (“DPA”). However, it is possible that we could resolve your concerns directly if you contact us first, so please consider doing so.While we strive to protect all information we receive from you, we cannot guarantee the security of any information you transmit to us.FeesYou will not usually have to pay a fee to access your personal data (or to exercise any of the other rights). However, we may charge a reasonable fee if your request for access is manifestly unfounded or excessive. Alternatively, we may refuse to comply with the request in such circumstances.What We May Need From YouWe may need to request specific information from you to help us confirm your identity and ensure your right to access the information (or to exercise any of your other rights). This is another appropriate security measure to ensure that personal data is not disclosed to any person who has no right to receive it.Your Right To Withdraw Your ConsentIn the limited circumstances where you may have provided your consent to the collection, processing and transfer of your personal data for a specific purpose, you have the right to withdraw your consent for that specific processing at any time. To withdraw your consent, please contact us at [email protected] or update your marketing profile by clicking the preference link in one of ARK’s marketing emails. Once we have received notification that you have withdrawn your consent, we will no longer process your information for the purpose(s) you originally agreed to unless we otherwise have an alternative legal basis for doing so.Changes To This Privacy NoticeWe reserve the right to update this privacy notice at any time, and we will make an updated copy of such privacy notice available on our Websites and notify you when we make any substantial updates. We may also notify you in other ways from time to time about the processing of your personal data.Additional InformationData SecurityWe have implemented measures that are reasonably designed to secure your personal data from accidental loss and from unauthorized access, use, alteration and disclosure.Children Under the Age of 13Our Websites are not intended for children under 13 years of age. No one under age 13 may provide any personal data to or on the Websites. We do not knowingly collect personal data from children under 13. If you are under 13, do not use or provide any information on the Websites or on or through any of its features/register on the Websites, make any purchases through the Websites, use any of the interactive or public comment features of this Websites or provide any information about yourself to us, including your name, address, telephone number, e-mail address or any screen "
