description = "ARK’s thematic investment strategies span market capitalizations, sectors, and geographies to focus on companies that we expect to be the leaders, enablers, and beneficiaries of disruptive innovation. ARK’s strategies aim to deliver long-term growth with low correlation to traditional investment strategies and are offered in a variety of vehicles."
full_description = "We Invest Solely In Disruptive Innovation For investors seeking long-term growth. ARK ETFs ARK Venture Fund ARK Research Explore Investment Strategies ARK’s thematic investment strategies span market capitalizations, sectors, and geographies to focus on companies that we expect to be the leaders, enablers, and beneficiaries of disruptive innovation. ARK’s strategies aim to deliver long-term growth with low correlation to traditional investment strategies and are offered in a variety of vehicles. ARK Venture ARK Venture Aims to provide broad exposure to disruptive innovation in both the private and public markets. ARK believes innovations centered around artificial intelligence, robotics, energy storage, DNA sequencing, and blockchain technology will change the way the world works and deliver outsized growth as industries transform. See More Cryptoasset Cryptoasset ARK believes public blockchains are powering novel forms of coordination across finance and the internet. The Investment Manager believes that cryptocurrency value and market share dynamics will be “power law distributed,” meaning that a few cryptocurrencies will capture the majority of value. See More Cryptocurrency Cryptocurrency ARK believes cryptocurrencies governed by open source networks are enabling a new paradigm for monetary systems and mechanisms to store and transfer value. The Investment Manager believes that cryptocurrency value and market share dynamics will be “power law distributed,” meaning that a few cryptocurrencies will capture the majority of value. See More ARK Disruptive Innovation ARK Disruptive Innovation Aims to provide broad exposure to disruptive innovation. ARK believes innovations centered around artificial intelligence, robotics, energy storage, DNA sequencing, and blockchain technology will change the way the world works and deliver outsized growth as industries transform. See More Autonomous Tech & Robotics Autonomous Tech & Robotics Seeks to provide exposure to autonomous mobility, electric vehicles, robotics and automation, 3D printing, and space exploration. Advancements in these areas are enhancing productivity while reducing costs and transforming manufacturing, production, and infrastructure. See More Genomic Revolution Genomic Revolution Aims to provide exposure to DNA sequencing technology, gene editing, CRISPR, therapeutics, agricultural biology, and molecular diagnostics. These innovations can help in restructuring health care, agriculture, pharmaceuticals, and enhancing the quality of life. See More Next Generation Internet Next Generation Internet Seeks to provide exposure to artificial intelligence, deep learning, big data, cloud computing, cybersecurity, and blockchain technology. These innovations are changing the way the world manages information, analyzes data, purchases and consumes goods, and communicates across the globe. See More ARK Early Stage Disruptors ARK Early Stage Disruptors Aims to provide broad exposure to early-stage disruptors in the public markets. ARK believes at the forefront of the innovation wave are “early-stage disruptors”— either newer public companies or companies that introduced new technologically-enabled products or services that are in the early stages of development. See More Fintech Innovation Fintech Innovation Aims to provide exposure to fintech innovations including mobile payments, digital wallets, peer-to-peer lending, blockchain technology, and financial risk transformation. These innovations should revolutionize the financial industry, impacting every sector of the global economy. See More Space Exploration Space Exploration Seeks to provide exposure to companies involved in space-related businesses like reusable rockets, satellites, drones, and other orbital and sub-orbital aircrafts. These innovations should transform logistics, observation, agriculture, telecom, drones, and may even put humans on Mars. See More Mobility-as-a-Service Mobility-as-a-Service Aims to provide exposure to companies involved in self-driving vehicles, electric vehicles, autonomous ridesharing platforms, and aerial drones. These innovations should spur a transformative boost in economic productivity and subsume the traditional automotive industry. See More 3D Printing 3D Printing Seeks to provide targeted exposure to companies in the 3D printing ecosystem, including 3D printing hardware, software, measurement, and materials. 3D printing should transform manufacturing by providing greater design complexity, accuracy, efficiency, and customization. See More Israel Innovation Israel Innovation Aims to provide targeted exposure to Israeli companies at the forefront of innovation across health care, manufacturing, communications, and information technology. These companies are working to enhance many sectors of the global economy. See More Why Innovation Invest In The Future Today ARK identifies more innovation evolving today than ever before. We believe it is changing lives and businesses across the globe dramatically, creating opportunities to own the next big thing by investing in the future today. See more Take Advantage Of Market Inefficiencies The full magnitude of innovation and the opportunities it creates often are unrecognized or misunderstood by traditional investors. ARK focuses on innovation seeking to capitalize on four market inefficiencies. See more Make The World A Better Place ARK believes innovation creates simplicity and accessibility, while driving down costs. More importantly, innovation should change the way the world works and lead to a more sustainable future. See more About ARK Disruptive Innovation Is Key To Growth ARK is a global asset manager specializing in thematic investing in disruptive innovation. The firm is rooted in over 40 years of experience in investing in technologies that aim to deliver outsized growth as industries transform. Through its open research process, ARK seeks to identify companies that are leading and benefiting from cross-sector innovations such as artificial intelligence, robotics, energy storage, DNA sequencing, and blockchain technology. Learn More Innovation Research Visit ARK’s Research Center Articles Articles Podcasts White Papers Videos Newsletters ARK’s Investment Process Top-Down Research To define the investment universe, ARK’s investment process initially examines how the world is changing and where it is headed. Ideation Identify Disruptive Innovation Sizing The Opportunity Define The Potential Universe Bottom-Up Research To refine the investment opportunity, ARK’s bottom-up analysis evaluates potential investments based on our defined key metrics. Stock Selection And Valuation Select Portfolio Companies Portfolio And Risk Management Monitor Conviction & Market Volatility Learn More Subscribe to ARK’s Innovation Research Receive Regular Updates And Notifications On ARK’s Latest Research Because Investing In Innovation Starts With Understanding It Stay Innovative"
