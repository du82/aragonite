full_description = "ARK Invest > For Institutional Investors > For Institutional Investors: Long-Term Growth With Low Correlation To Traditional Strategies ARK aims to capture long-term growth in the public markets by investing in disruptive innovation. We believe that over a full-market cycle we can provide attractive performance with low correlations of relative returns to traditional strategies. ARK Believes Disruptive Innovation Is Key To Growth ARK defines disruptive innovation as the introduction of a technologically enabled product or service that should transform economic activity by creating simplicity and accessibility while driving down costs. Despite its potential, the full magnitude of disruptive innovation and the investment opportunities it creates often are unrecognized or misunderstood by traditional investors. ARK’s Investment Team Is Rooted In Experience ARK is rooted in over 40 years of experience in identifying and investing in disruptive innovations that should change the way the world works and deliver outsized growth as industries transform. ARK’s CIO and Director of Research have worked together for almost 15 years and recognize that disruptive innovation demands a dynamic and universal approach. ARK Utilizes An Open Research Ecosystem ARK believes that a combination of top-down and bottom-up research allows it to size the investment opportunity of disruptive innovation, and then detect and evaluate companies best positioned to benefit. To gain a deeper understanding of quickly changing themes, ARK employs an open research approach to gather information, both helping to define and refine its internal research process. ARK Actively Manages High Conviction Portfolios ARK believes that its investment process and active management of high-conviction portfolios capitalizes on rapid change and avoids industries and companies likely to be displaced by innovation. ARK uses its own scoring system to continuously value companies and monitor the underlying investment thesis. As scores change, ARK’s Investment Team adjusts stock positions in the portfolio. Explore ARK's Strategies Focusing Solely On Disruptive Innovation ARK Believes Disruptive Innovation Is Key To Growth ARK defines disruptive innovation as the introduction of a technologically enabled product or service that should transform economic activity by creating simplicity and accessibility while driving down costs. Despite its potential, the full magnitude of disruptive innovation and the investment opportunities it creates often are unrecognized or misunderstood by traditional investors. Investing In The Leaders, Enablers, And Beneficiaries Of Innovative Technologies ARK’s Investment Team Is Rooted In Experience ARK is rooted in over 40 years of experience in identifying and investing in disruptive innovations that should change the way the world works and deliver outsized growth as industries transform. ARK’s CIO and Director of Research have worked together for almost 15 years and recognize that disruptive innovation demands a dynamic and universal approach. Combining Top-Down And Bottom-Up Research, Designed To Identify Innovation And Convergence Across Markets. ARK Utilizes An Open Research Ecosystem ARK believes that a combination of top-down and bottom-up research allows it to size the investment opportunity of disruptive innovation, and then detect and evaluate companies best positioned to benefit. To gain a deeper understanding of quickly changing themes, ARK employs an open research approach to gather information, both helping to define and refine its internal research process. Offering Actively Managed Global Strategies That Span Market Capitalization And Sectors With Low Overlap To Broad-Market Indices. ARK Actively Manages High Conviction Portfolios ARK believes that its investment process and active management of high-conviction portfolios capitalizes on rapid change and avoids industries and companies likely to be displaced by innovation. ARK uses its own scoring system to continuously value companies and monitor the underlying investment thesis. As scores change, ARK’s Investment Team adjusts stock positions in the portfolio. Explore ARK's Strategies ARK’s Investment Process Seeks To Identify Innovation Early Top-Down Research To define the investment universe, ARK initially examines from the top-down how the world is changing and where it is headed. Ideation Identify Disruptive Innovation Sizing The Opportunity Define The Potential Universe Bottom-Up Research To refine the investment opportunity, ARK’s bottom-up analysis evaluates potential investments based on our defined key metrics. Stock Selection and Valuation Select Portfolio Companies Portfolio And Risk Management Monitor Conviction & Market Volatility Learn More Innovation For A Better, More Sustainable World ARK believes innovation creates simplicity and accessibility, while driving down costs. More importantly, innovation impacts all of our lives and should change the way the world works, making it a better place. With our sole focus on disruptive innovation, ARK invests in companies that, we believe, address the world’s biggest challenges, saving lives and fostering a better future for all. Learn More Reasons to Consider Sustainable Investing: 01 Align Investments with Purpose 02 Capture Long-Term Growth 03 Drive Positive Change How To Utilize ARK’s Strategies Within A Portfolio Disruptive innovation has the potential to be the main driver of long-term growth over the next decade. We believe your financial wellness should benefit. Source For Growth Suited for investors who seek long-term growth by accessing companies at the forefront of disruptive innovation in some of the most promising areas of the economy. Long-Term Risk-Reward Suited for investors that have a moderate-to-high risk profile and intend to stay invested for the medium-to-long term. ARK believes it will outperform broad benchmarks over the course of a full-market cycle. Portfolio Diversification Suited for investors who want to diversify their existing portfolio with strategies that offer low correlation to a number of core asset classes held in most portfolios. Download ARK Profile"
