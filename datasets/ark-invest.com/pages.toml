title = "Invest In The Future Today | ARK Investment Management"
description = "Innovation should displace industry incumbents, increase efficiencies, and gain majority market share. While we believe the threat to existing businesses is grave, the long-term opportunities for companies and investors participating in this change could be measured in the trillions."
full_description = "ARK Invest > Invest In The Future Today > Why Innovation Make The World A Better Place Take Advantage of Four Market Inefficiencies Invest In The Future Today Innovation should displace industry incumbents, increase efficiencies, and gain majority market share. While we believe the threat to existing businesses is grave, the long-term opportunities for companies and investors participating in this change could be measured in the trillions. ARK Identifies More Innovation Than Ever Before In the late nineteenth century, three innovation platforms evolved at the same time and changed the way the world worked. Thanks to the introduction of the telephone, automobile, and electricity, the world’s productivity exploded as costs dropped, unleashing demand across sectors. Today, we believe the global economy is undergoing the largest technological transformation in history thanks to five innovation platforms evolving at the same time. 1780 1800 1840 1860 1880 1900 1920 1940 1960 1980 2000 2020 Impact of Innovation Impact of Innovation on Economic Activity .st0 { fill: #0A0A23; } .st1 { fill: #EAEBEF; } .st2 { fill: none; stroke: #6A4BFF; stroke-dasharray: 4,4; } .st3 { opacity: 0.1; fill: #7D808E; enable-background: new; } .st4 { fill: none; } .st5 { opacity: 0.1; fill: #B1A0FF; enable-background: new; } .st6 { fill: none; stroke: #FCC049; stroke-dasharray: 4,4; } .st7 { enable-background: new; } .st8 { fill: #FFFFFF; } .st9 { fill: none; stroke: url(#SVGID_1_); stroke-width: 4; } .st10 { fill: none; stroke: url(#SVGID_2_); stroke-width: 4; stroke-dasharray: 4.0084,8.0169; } .st11 { fill: none; stroke: url(#SVGID_3_); stroke-width: 4; } .st12 { fill: #6A4BFF; stroke: #FFFFFF; stroke-width: 7; } .st13 { fill: #FCC049; stroke: #FFFFFF; stroke-width: 7; } .st14 { fill: none; stroke: #42D481; stroke-dasharray: 4,4; } .st15 { fill: #42D481; stroke: #FFFFFF; stroke-width: 7; } *Source: ARK Investment Management LLC, 2019. Relative impact of an innovation scaled by the degree of consensus between economic historians. The underlying data assumes that all innovation platforms follow a characteristic investment and realization cycle of similar duration. Data Sources: Helpman, E. (2010). General Purpose Technologies and Economic Growth.; Brynjolfsson, E., & McAfee, A. (2018). The second machine age.; Kurzweil, R. (2016). The singularity is near. Certain of the statements contained in this item may be statements of future expectations and other forward-looking statements that are based on ARK’s current views and assumptions, and involve known and unknown risks and uncertainties that could cause actual results, performance or events to differ materially from those expressed or implied in such statements. ARK Believes Innovation Must Meet Three Criteria 01 Experience dramatic cost declines and unleash waves of incremental demand When a technology crosses certain cost or performance thresholds, its addressable market can widen and diversify dramatically. ARK uses Wright’s Law to better understand the potential scope of a transformative technology. Wright's Law 02 Cut across sectors and geographies A technology that cuts across industries and geographies can enjoy dramatic increases in addressable markets as applications are “discovered” by different business sectors. Spanning across sectors also provides better product-market fits, insulates against business cycle risk, and garners attention from multiple disciplines. 03 Serve as a platform for additional innovations A technology upon which other innovations can be built may expand its use-cases in ways that are almost impossible to imagine. As a result, innovation platforms may be underestimated over expansive time horizons because successful forecasts require anticipation of the scope of new products and services. What Are The Major Innovation Platforms Evolving Today? Artificial Intelligence We believe that artificial intelligence (AI) learning systems will transform not only retail, media and telecom, as did the Internet, but all sectors in the economy, even those previously thought impervious to disruption, notably health care and financial services. Underlying technologies include: Neural Networks, Mobile Connected Devices, Cloud Computing, Streaming, and Internet of Things. Energy Storage Declining battery costs should cause an explosion in mobile form factors. These innovations should increase the demand for electrical energy, displacing fossil fuels and reducing not only the vulnerability of grids but also operating expenses and the capital intensity of transmission and distribution. Underlying technologies include: Battery Systems, Electric Vehicles, and Autonomous Mobility. Robotics Advances in software and sensors should enable robots to operate alongside humans in all sorts of environments. If their unit costs decline by more than 50% while their capabilities increase, as we anticipate will be the case, robots should transform every business that depends upon physical processes and workflows. Underlying technologies include: Adaptive Robotics, 3D Printing, Drones, and Reusable Rockets. DNA Sequencing As the cost to sequence a whole human genome falls precipitously, DNA Sequencing, a test once limited to the research lab, should see widespread clinical adoption and a hundred-fold increase in volumes, transforming health care completely. Underlying technologies include: Sequencing Technology, Gene Editing (i.e. CRISPR), and Immunotherapy. Blockchain Technology With blockchain technology, we believe that more of everything in the world will become money-like: fungible, liquid, and quantified. Every corporation and consumer will likely have to adapt, calling into question the very structure of a corporation. Underlying technologies include: Blockchain, Fintech, and Frictionless Value Transfers. Explore ARK’s Strategies Artificial Intelligence Energy Storage Robotics DNA Sequencing Blockchain Technology"
