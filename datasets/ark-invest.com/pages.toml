title = "Information for Financial Advisors | ARK Invest"
description = "Investing solely in disruptive innovation, ARK's investment solutions offer growth differentiated from traditional strategies, with low overlap to broad benchmarks. Your clients should benefit from owning what could be the most innovative companies of our lifetime."
full_description = "ARK Invest > For Financial Advisors > For Financial Advisors: For Clients Seeking Long-Term Growth And Portfolio Diversification Investing solely in disruptive innovation, ARK's investment solutions offer growth differentiated from traditional strategies, with low overlap to broad benchmarks. Your clients should benefit from owning what could be the most innovative companies of our lifetime. Brett Winton Director of Research ARK believes that after the tech and telecom bust and the 2008-2009 meltdown, there was an accelerated shift to passive and benchmark investing, causing a void in the public markets when it came to innovation. While broad benchmarks reflect past successes, ARK seeks to capture future growth and avoid value traps in traditional benchmarks. “The innovation evolving today should generate about $60 trillion in business value and wealth creation over the next 15 years. Today, it accounts for less than $6 trillion, giving investors an opportunity to capitalize if they have positioned their portfolios on the right side of innovation.” Explore ARK’s ETFs How To Utilize ARK’s Strategies Within A Client’s Portfolio Disruptive innovation has the potential to be the main driver of long-term growth over the next decade. We believe your client’s financial wellness should benefit. Source For Growth Suited for investors who seek long-term growth by accessing companies at the forefront of disruptive innovation in some of the most promising areas of the economy. Long-Term Risk-Reward Suited for investors that have a moderate-to-high risk profile and intend to stay invested for the medium-to-long term. ARK believes it will outperform broad benchmarks over the course of a full-market cycle. Portfolio Diversification Suited for investors who like to diversify their existing portfolio with strategies that offer low correlation to a number of core asset classes held in most investors’ portfolios. Download ARK’s Profile Investment Products Focused On Innovation ARK manages and sub advises long-only global public equity portfolios across a variety of investment vehicles. ARK’s products include a suite of exchange traded funds (ETFs), mutual funds, and separately managed accounts all focused solely on disruptive innovation. ARK ETFs An ETF is portfolios of securities that seeks to provide an efficient and simple way to invest. ARK’s ETFs are designed to give investors access to areas of disruptive innovation. See More Mutual Funds ARK offers its Disruptive Innovation strategy in a mutual fund format. It can be a good alternative to ETFs, especially for retirement accounts that don’t have access to ARK ETFs. See More Managed Accounts ARK’s managed accounts are available to investors including High Net Worth Individuals, Family Offices, and Institutional Clients who seek to capture growth through disruptive innovation. See More View All Products Insights To Keep Your Clients Informed ARK strives to enlighten clients on the impact transformative technologies should have on all of our lives and future generations because investing in innovation starts with understanding it. Innovation Research: White Papers Provides in-depth analysis of disruptive innovations and the investment opportunities created. See More Articles Provides research on innovative technologies and how they will impact future growth. See More Podcasts Offers intellectual discussions on recent developments across disruptive innovation. See More"
