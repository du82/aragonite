description = "We believe investors should have access to innovation and benefit from owning what could be the most innovative companies of our lifetime."
full_description = "ARK Invest > ARK’s Investment Solutions > ARK's Investment Solutions We believe investors should have access to innovation and benefit from owning what could be the most innovative companies of our lifetime. Strategies AvailableETFsManaged AccountMutual FundsUCITS ETFInterval FundOtherActively Managed EquityARK Disruptive Innovation Next Generation Internet Genomic RevolutionAutonomous Tech & Robotics Fintech Innovation Space ExplorationARK Early Stage Disruptors Learn MoreARK 10 Mobility-as-a-Service MetaversePositive ChangeIndexed Equity3D PrintingIsrael InnovationCircular EconomyCybersecurity and Data PrivacyDigital Payments EconomyEnvironmental ImpactGlobal Sustainable InfrastructureSustainable Future of FoodUSA Environmental ImpactPrivate EquityARK VentureCryptoCryptocurrencyLearn MoreCryptoassetActive Bitcoin FuturesActive On-Chain Bitcoin FuturesBlockchain and Digital Economy InnovationActive Bitcoin Ethereum FuturesActive Ethereum Futures Available in the U.S. Available as Canadian ETFs. ARK Disruptive Innovation, Next Generation Internet and Genomic Revolution are available via BMO Investments Inc. View Details Available in Japan in partnership with Nikko Asset Management. Please note: Next Generation Internet is managed in Japan as Global Digital Innovation. View Details UCITS ETFs: Available in Europe via ARK Invest Europe View Details Available in Europe and Singapore, and via Managed Funds in Australia and New Zealand in partnership with Nikko Asset Management Explore ARK ETFs Investment Strategies ARK’s thematic investment strategies span market capitalizations, sectors, and geographies to focus on public companies that are the leaders, enablers, and beneficiaries of disruptive innovation. ARK’s strategies aim to deliver long-term growth with low correlation to traditional investment strategies. ARK Disruptive Innovation ARK Disruptive Innovation Aims to provide broad exposure to disruptive innovation. ARK believes innovations centered around artificial intelligence, robotics, energy storage, DNA sequencing, and blockchain technology will change the way the world works and deliver outsized growth as industries transform. See More Autonomous Tech & Robotics Autonomous Tech & Robotics Seeks to provide exposure to autonomous mobility, electric vehicles, robotics and automation, 3D printing, and space exploration. Advancements in these areas are enhancing productivity while reducing costs and transforming manufacturing, production, and infrastructure. See More Genomic Revolution Genomic Revolution Aims to provide exposure to DNA sequencing technology, gene editing, CRISPR, therapeutics, agricultural biology, and molecular diagnostics. These innovations can help in restructuring health care, agriculture, pharmaceuticals, and enhancing the quality of life. See More Next Generation Internet Next Generation Internet Seeks to provide exposure to artificial intelligence, deep learning, big data, cloud computing, cybersecurity, and blockchain technology. These innovations are changing the way the world manages information, analyzes data, purchases and consumes goods, and communicates across the globe. See More Fintech Innovation Fintech Innovation Aims to provide exposure to fintech innovations including mobile payments, digital wallets, peer-to-peer lending, blockchain technology, and financial risk transformation. These innovations should revolutionize the financial industry, impacting every sector of the global economy. See More Space Exploration Space Exploration Seeks to provide exposure to companies involved in space-related businesses like reusable rockets, satellites, drones, and other orbital and sub-orbital aircrafts. These innovations should transform logistics, observation, agriculture, telecom, drones, and may even put humans on Mars. See More 3D Printing 3D Printing Seeks to provide targeted exposure to companies in the 3D printing ecosystem, including 3D printing hardware, software, measurement, and materials. 3D printing should transform manufacturing by providing greater design complexity, accuracy, efficiency, and customization. See More Israel Innovation Israel Innovation Aims to provide targeted exposure to Israeli companies at the forefront of innovation across health care, manufacturing, communications, and information technology. These companies are working to enhance many sectors of the global economy. See More Cryptoasset Cryptoasset ARK believes public blockchains are powering novel forms of coordination across finance and the internet. The Investment Manager believes that cryptocurrency value and market share dynamics will be “power law distributed,” meaning that a few cryptocurrencies will capture the majority of value. See More Cryptocurrency Cryptocurrency Aims to provide broad exposure to disruptive innovation in both the private and public markets. ARK believes innovations centered around artificial intelligence, robotics, energy storage, DNA sequencing, and blockchain technology will change the way the world works and deliver outsized growth as industries transform. See More ARK Venture ARK Venture Aims to provide broad exposure to disruptive innovation in both the private and public markets. ARK believes innovations centered around artificial intelligence, robotics, energy storage, DNA sequencing, and blockchain technology will change the way the world works and deliver outsized growth as industries transform. See More ARK Early Stage Disruptors ARK Early Stage Disruptors Aims to provide broad exposure to early-stage disruptors in the public markets. ARK believes at the forefront of the innovation wave are “early-stage disruptors”— either newer public companies or companies that introduced new technologically-enabled products or services that are in the early stages of development. See More ARK 10 ARK 10 Aims for long-term capital growth by actively managing a highly concentrated portfolio of public equity securities of companies that are relevant to the theme of disruptive innovation. See More Mobility-as-a-Service Mobility-as-a-Service Aims to provide exposure to companies involved in self-driving vehicles, electric vehicles, autonomous ridesharing platforms, and aerial drones. These innovations should spur a transformative boost in economic productivity and subsume the traditional automotive industry. See More Metaverse Metaverse This actively managed equity strategy seeks long-term capital growth by investing in domestic and foreign equity securities of companies focused on the Metaverse. Companies within this strategy are focused on building the future of the internet. The Metaverse is a shared virtual universe that could ultimately connect everyone and everything. As it matures its primary function will be to host and connect 3D-rich virtual environments and worlds. See More Positive Change Positive Change Positive Change Innovation aims to incorporate companies most likely to deliver long-term capital growth and to positively impact global progress towards the UN SDGs. See More Why Innovation Invest In The Future Today ARK identifies more innovation evolving today than ever before. We believe it is changing lives and businesses across the globe dramatically, creating opportunities to own the next big thing by investing in the future today. See More Take Advantage Of Market Inefficiencies The full magnitude of innovation and the opportunities it creates often are unrecognized or misunderstood by traditional investors. ARK focuses on innovation seeking to capitalize on four market inefficiencies. See More Make The World A Better Place ARK believes innovation creates simplicity and accessibility, while driving down costs. More importantly, innovation should change the way the world works and lead to a more sustainable future. See More ARK Invest Company Profile See More Form CRS Form CRS Download ARK’s Form ADV Download ARK’s Form ADV Subscribe to ARK’s Innovation Research Receive Regular