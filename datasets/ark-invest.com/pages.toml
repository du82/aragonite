["https://ark-invest.com/board-of-directors"]
title = "Meet the ARK Board Of Directors | ARK Investment Management"
description = "Catherine D. Wood is the Founder, CEO, and CIO of ARK. Cathie registered ARK Investment Management LLC (“ARK”) as an investment adviser with the U.S. Securities and Exchange Commission in January 2014. As Chief Investment Officer (“CIO”) and Portfolio Manager, Cathie led the development of ARK’s philosophy and investment approach and has ultimate responsibility for investment decisions. Prior to ARK, Cathie spent twelve years at AllianceBernstein as CIO of Global Thematic Strategies where she managed over $5 billion. Cathie joined Alliance Capital from Tupelo Capital Management, a hedge fund she co-founded, which in 2000, managed approximately $800 million in global thematic strategies. Prior to her tenure at Tupelo Capital, she worked for 18 years with Jennison Associates LLC as Chief Economist, Equity Research Analyst, Portfolio Manager and Director. She started her career in Los Angeles, California at The Capital Group as an Assistant Economist. Cathie received her Bachelor of Science, summa cum laude, in Finance and Economics from the University of Southern California in 1981."
full_description = "ARK Invest > Meet the ARK Board Of Directors > Meet the ARK Board Of Directors ARK aims to be a driving force and thought-leader when it comes to investing in disruptive innovation. Our leadership embraces this vision and supports ARK on this journey. The ARK Board of Directors oversees ARK’s commitment to achieving our goals, as we seek to deliver long-term value for our clients. Catherine D. Wood Board Delegate Catherine D. Wood is the Founder, CEO, and CIO of ARK. Cathie registered ARK Investment Management LLC (“ARK”) as an investment adviser with the U.S. Securities and Exchange Commission in January 2014. As Chief Investment Officer (“CIO”) and Portfolio Manager, Cathie led the development of ARK’s philosophy and investment approach and has ultimate responsibility for investment decisions. Prior to ARK, Cathie spent twelve years at AllianceBernstein as CIO of Global Thematic Strategies where she managed over $5 billion. Cathie joined Alliance Capital from Tupelo Capital Management, a hedge fund she co-founded, which in 2000, managed approximately $800 million in global thematic strategies. Prior to her tenure at Tupelo Capital, she worked for 18 years with Jennison Associates LLC as Chief Economist, Equity Research Analyst, Portfolio Manager and Director. She started her career in Los Angeles, California at The Capital Group as an Assistant Economist. Cathie received her Bachelor of Science, summa cum laude, in Finance and Economics from the University of Southern California in 1981. Gary H. Neems Board Delegate Gary H. Neems served as the Chief Operating Officer of CIFC Corporation until December 2012. Mr. Neems was a Co-Founder, Co-Chief Executive Officer, Managing Director, and Member of Investment Committee of Callidus Capital Management, LLC. Prior to co-founding Callidus, Mr. Neems was a Co-Managing Partner of Advanta Partners LP (1995-2000). From 1993-1995, after leaving Equitable, he was a Managing Director and Partner of Clipper Capital Partners, an investment affiliate of CS First Boston, focused on making and managing private equity investments. Prior to this, he served as a Managing Director and Investment Group Head within the Corporate Finance Department of Equitable Capital Management Corporation from 1989 to 1993. He managed a group with approximately $2 billion in assets in a diversified group of industries and was a member of the department’s Investment Committee. He started his career in 1977 at Citibank. He has or currently sits on the board of directors of a number of companies. Mr. Neems earned a B.A. in Chemistry from the University of Rochester and an M.B.A. in Finance from the University of Rochester Simon Graduate School of Business. John Duddy Board Delegate John served as Vice President, Corporate Marketing at Thermo Fisher Scientific, Inc. where he was responsible for global marketing, strategy and digital transformation until December, 2019. From 2012 through 2015, he led global marketing and strategy for the company’s innovative chromatography and mass spectrometry business. Prior to Thermo Fisher, Mr. Duddy led global marketing at Sciex, a division of Danaher, Inc. from 2010 to 2012. From 2003 to 2009, he was Vice President, Global Marketing Group and regional marketing at Applied Biosystems, Inc., a leader in DNA sequencing, before the acquisition by Invitrogen (Life Technologies). Through 2010, he worked on the global integration and development of the Americas marketing organization as part of the new company. Earlier in his career, Mr. Duddy progressed through leadership roles at American Hospital Supply, Baxter, Inc. as well as Eli Lilly, Inc. where he led corporate accounts and sales for their diagnostic business until the acquisition by Beckman Coulter (now part of Danaher). As part of Beckman Coulter, Mr. Duddy was national sales manager overseeing sales, marketing and technical support for their clinical diagnostic point-of-care business. Mr. Duddy received a Bachelor of Science in Business Administration from the University of Southern California in 1981. Tony Glover Board Delegate Tony Glover oversees all of Nikko Asset Management’s sales activities outside of Japan for institutional and retail investors, and coordinates the firm’s relations with global, regional and local consultants. Glover joined the firm in March 2020, and was originally appointed as Global Head of Intermediaries. He became Global Head of Consultant Relations in November 2020, and has held the position of Global Head of International Sales since September 2021. He was named Head of International Sales Division when the division was established in April 2022. Glover has a career in asset management in Japan spanning over 20 years. Prior to joining Nikko Asset Management, he worked in the Japan offices of a number of global asset managers headquartered in Europe, including WestLB Asset Management, Fortis Investments, and BNP Paribas Asset Management. He spent a decade working as an analyst and fund manager investing in the Japanese equity markets before moving to management roles, first as head of the investment team, and then later as Chief Administrative Officer, while also acting as an investment specialist for Japanese equity products, covering clients in Europe, Asia and Latin America. He is a fluent Japanese speaker after graduating from SOAS (London University) with a BA in Japanese and Economics, and is a CFA and CAIA charterholder. Subscribe to ARK’s Innovation Research Receive Regular Updates And Notifications On ARK’s Latest Research Because Investing In Innovation Starts With Understanding It Stay Innovative"
