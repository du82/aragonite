title = "FAQs | ARK Invest"
description = "Answers to some of the most frequently asked questions about ARK Invest and investing in disruptive innovation."
full_description = "ARK Invest > ARK’s FAQ > ARK’s FAQ Investing in innovation starts with understanding it. If your question doesn't appear below, please contact us: info@ark-invest.com Questions About ARK Invest: What is ARK’s mission? We believe innovation is key to long-term growth of company revenues and profits. Our mission is to deliver long-term capital appreciation with low correlation to traditional investment strategies by identifying and investing in the leaders, enablers and beneficiaries of disruptive innovation. What is ARK’s founding story? Cathie Wood registered ARK as an investment adviser in January 2014. Cathie founded ARK to focus solely on disruptive innovation. Throughout her career, Cathie’s focus on innovation led her to recognize that technology increasingly is blurring the lines between and among sectors. As a result, she believes the traditional research world is not set up to follow innovative companies. By researching across sectors, industries and markets, ARK seeks to identify companies that are leading and benefiting from cross-sector innovations such as robotics, energy storage, DNA sequencing, artificial intelligence, and blockchain technology. Since launching its first funds in 2014, ARK now provides investment management services across North America, Asia, Australia, and Europe. The firm offers a range of investment vehicles including ETFs, institutional and retail separately managed accounts, US and international mutual funds, and a UCITS fund. ARK’s investment strategies include: Autonomous Technology and Robotics, Next Generation Internet, Genomic Revolution, Fintech Innovation, 3D Printing, Israel Innovative Technology, Mobility-as-a-Service, Space Exploration, and the overall ARK Disruptive Innovation Strategy. What does the name “ARK” stand for, if anything? Cathie Wood founded ARK Invest to focus solely on disruptive innovation and to capitalize on the investment opportunities it creates. Over her career, she came to recognize that investing in disruptive innovation demands:-ACTIVE management to capitalize on the rapid change innovation creates.-An open RESEARCH ecosystem that is freed from sectors, geographies, and market caps to capture the convergence of technology.-The sharing of KNOWLEDGE to gain a deeper understanding of the areas we are researching and investing in.So, ARK is an acronym for: Active Research Knowledge. What sets ARK apart? A research team rooted in over 40 years of experience in identifying and investing solely in disruptive innovations that should change the way the world works and deliver long-term growth as industries transform. Despite its potential, ARK believes the full magnitude of disruptive innovation and the investment opportunities it creates are often unrecognized or misunderstood by traditional investors. ARK researches across sectors, industries, and markets to gain a deeper understanding of the convergence and market potential of disruptive innovations. ARK believes that its consistent investment process and active management of high-conviction portfolios capitalizes on rapid change and avoids industries and companies likely to be displaced by innovation. What is the idea behind ARK’s Open Research Ecosystem? ARK’s Open Research Ecosystem seeks to capitalize on rapid change through an open approach and the convergence of insights. ARK believes that a combination of top-down and bottom-up research allows us to size the investment opportunity of disruptive innovation, and then detect and evaluate companies best positioned to benefit. To gain a deeper understanding of quickly changing themes, ARK employs an open research strategy to gather information, both helping to define and refine its internal research process. Inputs include Theme Developers, who are thought leaders in their fields, social media interactions, and crowd-sourced insights as people respond to ARK’s public research. By applying technological concepts and external inputs to traditional approaches, ARK seeks to create a more transparent, creative, and interdisciplinary investment process. What is a Theme Developer? Theme Developers are thought leaders from a variety of fields who offer meaningful insights, experience, and subject matter knowledge in one of ARK’s research themes. ARK actively engages with Theme Developers as part of our research ecosystem. If you have subject matter expertise and are interested in becoming a Theme Developer for one of our research themes, please contact ARK. ARK Theme Developers are not employees of ARK and do not receive compensation from ARK. What Types of Scams Impersonate ARK Invest and Cathie Wood? ARK Invest and our cyber security vendors are aware of fake websites, YouTube channels, and other social media accounts posing as ARK Invest, Cathie Wood, and/or members of the ARK Invest team. We report these impersonators immediately to the relevant parties who have the authority and responsibility to remove the content.ARK Invest, Cathie Wood, and members of the ARK Invest team will never solicit funds, including cryptocurrency, via social media, YouTube videos, WhatsApp, and/or direct messages. We do not offer any crypto giveaways, private investment mentorships, guaranteed returns, or similar. Any accounts or websites claiming otherwise are not affiliated with ARK Invest in any way and we encourage you to follow the government’s advice on reporting these scammers. The steps for reporting can be viewed at the following website: Report Scams and Frauds | USAGov.The only social media accounts associated with ARK Invest are listed below.–The only advisor or investment-related sites affiliated with ARK Invest are ark-invest.com, ark-funds.com, and ark-ventures.com.–The only official X (formerly Twitter) accounts affiliated with ARK Invest, ARK Funds, Cathie Wood, and our research team can be found on our ARK Twitter list.–The only official YouTube account associated with ARK Invest is this verified account.–The only official Instagram accounts in use that are associated with ARK Invest on Instagram are the verified @arkinvest account, verified @cathiewoodark account, and the @ark_funds account.–The only official Facebook accounts in use by ARK Invest are this verified ARK Invest account, the verified Cathie Wood page, and the ARK Funds account.–The only official LinkedIn account in use by ARK Invest is this account.–The only official Reddit account affiliated with ARK Invest is this account.–The only official TikTok account in use by ARK Invest is this verified account.Below is a list of common impersonation scams targeting ARK Invest.X (formerly) Twitter: There are several different impersonation scams to watch for on X.Scam 1: Scammers often create a handle similar to existing ARK Invest accounts, including those for Cathie Wood and the research team, with a slight variation (e.g. A scammer could use a ‘0’ to replace an ‘o’ in an X handle).An impersonator account will often retweet real tweets from the ARK account they are impersonating to create a real-looking timeline. Then, they often reach out via direct message and claim to be the real ARK employee and offer investment programs, crypto giveaways, guaranteed returns, or similar, and direct you to a fake website that typically incorporates “ARK” or “Cathie Wood” into the domain name. ARK Invest will never offer these programs, especially via social media. The only advisor or investment-related sites affiliated with ARK Invest are ark-invest.com, ark-funds.com, and ark-ventures.com.Scam 2: Scammers create an account claiming to be a financial professional. They then reach out, often via direct message, claiming to have a partnership with ARK Invest, Cathie Wood, and/or an ARK affiliate. The scammers then often offer a private investment program, including crypto mining, which is only available through a third-party website. These websites are scams and are not affiliated with ARK Invest in any way. ARK Invest and those with any affiliation to ARK will never solicit investments, including offering investment programs, through social media private messages.Scam 3: Scammers create an X account named “ARK Invest,” though with any X handle (e.g. the handle could be @JohnDoe123456789, while the name is “ARK Invest”), and add followers to an X List with a name that implies a crypto giveaway. The X user receives a notification that “ARK Invest” has added them to this “giveaway” list. This list typically uses an image of a doctored, fake tweet from the verified ARK Invest account offering a crypto giveaway, or similar, including a link to a scam website where the giveaway is taking place. ARK Invest will never offer any crypto giveaways, private investment mentorships, guaranteed returns, or similar, via social media, including via an X list.The only official X accounts affiliated with ARK Invest, ARK Funds, Cathie Wood, and our research team can be found on our ARK Twitter list.YouTube: There are several different impersonation scams to watch for on YouTube.Scam 1: Scammers often hack an established third-party channel and rebrand it to look like ARK Invest or Cathie Wood, with a name such as “ARK Invest,” “ARK Invest Live,” or similar. These impersonators then typically use existing ARK Invest content, including “The ‘B’ Word” conference with Cathie Wood, Jack Dorsey, and Elon Musk, as well as episodes of “In The Know With Cathie Wood,” to create a fake “live” stream event. During these streams, the scammers often promote a fake cryptocurrency giveaway where they claim they will double the amount of cryptocurrency a user sends to a crypto address and direct viewers to a fake website. These websites typically incorporate “ARK” or “Cathie Wood” into the domain name. ARK Invest will never offer this type of giveaway. The only advisor or investment-related sites affiliated with ARK Invest are ark-invest.com, ark-funds.com, and ark-ventures.com.Scam 2: Scammers create impersonator accounts to respond to comments on videos on ARK Invest’s verified channel. These impersonators often use the ARK Invest name, Cathie Wood name, or a variation that includes a number or email address to contact, as well as the ARK logo. This scam typically involves the impersonator asking commenters to contact them via WhatsApp or at a non ark-invest.com email address. ARK will never ask followers to reach out to them via WhatsApp or any non ark-invest.com email. Please verify that any comment claiming to be from ARK Invest has the official YouTube-verified checkmark.The only official YouTube account associated with ARK Invest is this verified account.Instagram: Scammers often create handles similar to ARK Twitter accounts, including those for Cathie Wood and the research team. ARK’s research team is not on Instagram. The only official Instagram accounts in use that are associated with ARK Invest on Instagram are the verified @arkinvest account, verified @cathiewoodark account, and the @ark_funds account.Facebook: Scammers often create impersonation profiles for ARK Invest and Cathie Wood. The only official Facebook accounts in use by ARK Invest are this verified ARK Invest account, the verified Cathie Wood page, and the ARK Funds account. Any account claiming otherwise is an impersonation. ARK and anyone affiliated with ARK will never solicit funds, investments, or offer crypto giveaways on social media, including Facebook.LinkedIn: Scammers often create impersonation profiles for Cathie Wood and other members of the ARK Team. The only LinkedIn account in use by ARK Invest is this account. Any account claiming otherwise is an impersonation. ARK and anyone affiliated with ARK will never solicit funds, investments, or offer crypto giveaways on social media, including LinkedIn.ARK on Other Social Media Platforms: ARK Invest also has a company social media account on TikTok and Reddit. These are the only accounts affiliated with ARK Invest on TikTok and Reddit. Anyone claiming otherwise, including those offering investment advice, private investment programs, cryptocurrency giveaways, and similar offers, are impersonators. Questions about ARK’s Investment Process: What is thematic investing? ARK utilizes thematic investing to capture disruptive innovation. Thematic investing seeks to capitalize on long-term trends that cut across economic sectors and geographic boundaries. ARK believes thematic strategies can better adjust for rapid change and incorporate a deep understanding of the underlying drivers of long-term value creation and risk. ARK researches across sectors, industries, and markets to gain a deeper understanding of the convergence and market potential of disruptive innovations, and thus size the investment opportunities more appropriately.ARK’s thematic analysts ask the questions:– Where is the next big disruptive innovation?– What is the size of the total market?– Which industries will be disrupted?– Which companies will emerge as the winners? What are the benefits of thematic investing? Thematic investing can offer a low correlation of relative returns to traditional growth strategies and negative correlation of relative returns to traditional value strategies, offering diversification for investors. While benchmarks reflect past successes, thematic investing seeks to capture future growth allowing investors to earn a market premium. A constant focus on secular changes and disruptive innovation can offer a portfolio hedge in a rapidly changing world and complement traditional index-based strategies. Why does ARK invest in all market capitalizations? ARK believes that disruptive innovation cannot be constrained by market capitalization, geographic boundaries, or sectors. We research and invest in a wide range of companies, from mega caps to micro caps that we believe are going to contribute to and benefit from the rapidly changing market landscape. Small cap companies may offer a higher growth opportunity, whereas large cap companies may offer less volatility. What does “cross-sector” mean? ARK’s cross-sector portfolios aim to uncover disruptive innovation that impacts multiple industries. Unlike traditional investment strategies that specialize in certain narrowly focused sectors of the economy, ARK uses a theme-based approach unconstrained by economic sectors. What is ARK’s Investment Process? ARK’s investment process initially examines from the top-down how the world is changing and where it is headed. ARK employs an open research strategy to gather information, both helping to define and refine its internal research process. Inputs include theme developers who are thought leaders in their fields, social media interactions, and crowd-sourced insights as people respond to ARK’s public research. Using this information in an iterative fashion, ARK’s research and investment team work to “size” and “re-size” the opportunities. As a result of extensive and iterative research steps, ARK anticipates and quantifies multi-year value-"
