title = "Corporate Responsibility | ARK Investment Management"
description = "ARK believes that innovation is key to growth and will make the world a better place. We seek to invest in companies aligned with this belief, but also to operate our own company in a way that enhances society. To succeed in this mission, ARK implements responsible corporate governance, fosters a diverse and inclusive workforce, and gives back to organizations that we believe are promoting good health and well-being, quality education, and gender equality."
full_description = "ARK Invest > Corporate Responsibility > Corporate Responsibility ARK believes that innovation is key to growth and will make the world a better place. We seek to invest in companies aligned with this belief, but also to operate our own company in a way that enhances society. To succeed in this mission, ARK implements responsible corporate governance, fosters a diverse and inclusive workforce, and gives back to organizations that we believe are promoting good health and well-being, quality education, and gender equality. ARK’s Commitment We adopted the United Nation’s Sustainable Development Goals and are currently focusing on: Good Health & Well-Being Ensure healthy lives and promote well-being for all at all ages. Quality Education Ensure inclusive and equitable quality education and promote lifelong learning. Gender Equality Achieve gender equality and empower all women and girls. Corporate Responsibility In Action ARK Swag For Good After receiving many requests to make ARK swag available, we thought this would be the perfect opportunity to align public demand with our commitment to a sustainable future. We hope you enjoy ARK Swag For Good. With every item purchased, 100% of profits are donated to select charitable organizations that we believe are in line with our Corporate Responsibility Policy. Shop Now Corporate Responsibility In Action Together We Stand ARK stands in solidarity with the Black community against systemic racism and oppression experienced every day in America. We recognize the need for social and economic justice and join the call for substantial and sustained change and accountability. To be silent is to be complicit. In line with our support of the Black community, we are proud to support the following organizations focused on combating social and economic injustices: The Woodson Center, The Equal Justice Initiative, The New York Urban League, and The NAACP Legal Defense and Education Fund. Corporate Responsibility In Action Cycle For Survival Cycle for Survival has raised more than $260 million to help fund pioneering rare cancer research led by Memorial Sloan Kettering Cancer Center. 100% of the money raised supports innovative clinical trials, research studies, and major research initiatives. ARK began sponsoring a team in 2019 and hopes to raise $200K over the next three years. Learn More Corporate Responsibility In Action Duddy Innovation Center of Excellence Catherine Duddy Wood is dedicated to attracting more women to innovative industries like genomics, robotics, artificial intelligence, and blockchain technology. To that end, Cathie launched the Duddy Innovation Center of Excellence at her alma mater, Notre Dame Academy High School. The Duddy Innovation Center of Excellence offers a unique challenge for young women eager to stretch beyond the boundaries of the traditional classroom. The Center’s flagship course is Disruptive Innovation. Learn More"
