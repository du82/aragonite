["https://arm.com/company/leadership"]
title = "Leadership – Arm®"
description = "Learn about our different licensing models, determine which is the best fit for your company, and connect with an Arm representative."
full_description = "A Pattern of Preemptive Disruption You can tell a lot about a company by the people who lead it — their skills, their stories and their standards. Our business is foundational technology. These leaders are the foundation we build on. Rene Haas Chief Executive Officer Rene was appointed Chief Executive Officer and to the Arm Board in February 2022. Prior to being appointed CEO, Rene was President of Arm’s IP Product Groups (IPG) from January 2017. Under his leadership, Rene transformed IPG to focus on key solutions for vertical markets with a more diversified product portfolio and increased investment in the Arm software ecosystem. In addition to his role as CEO, Rene also sits on the boards of Arm China, AstraZeneca, and SoftBank Group. Rene joined Arm in October 2013 as Vice President of Strategic Alliances and two years later was appointed to the Executive Committee and named Arm’s Chief Commercial Officer in charge of global sales and marketing. Before joining Arm, Rene held several applications management, applications engineering and product engineering roles, including seven years at NVIDIA as vice president and general manager of its computing products business. Prior to NVIDIA, Rene held executive roles at Scintera Networks and Tensilica. Rene is based in Silicon Valley, U.S., he also spends significant time in the major technology centers of the UK, Europe and APAC. Rene earned his Bachelor of Science in Electrical and Electronics Engineering from Clarkson University and is a graduate of the Stanford University Graduate School of Business Executive Education Program. Jason Child Executive Vice President and Chief Financial Officer Jason’s career spans 30 years across all aspects of global finance and strategy, accounting, capital markets/treasury, IPO execution, and investor relations. He has extensive experience in scaling disruptive technologies within enterprise software/SaaS, e-commerce, local commerce, consumer hardware/IOT, and online residential real estate. He most recently served as senior vice-president and CFO at Splunk, a technology company specializing in application management, security, and compliance, as well as business and web analytics. Before his executive leadership roles, Jason spent more than 11 years leading various global finance teams at Amazon, and served as CFO of Amazon International. Jason has served as a member of the board of directors of Coupang, Inc., an e-commerce company, since April 2022. He holds a B.A. from the Foster School of Business at the University of Washington, where he currently serves on its Global Advisory Board. Charlotte Eaton Chief People Officer In her role as Chief People Officer, Charlotte oversees all aspects of Arm’s people, workplace, and sustainability strategies. Over the course of her career, Charlotte has shaped her experience across multiple sectors with rapid adaptation and change, and is passionate about building progressive, inclusive, purpose-led organizations. She thrives in seeking new ways of doing great things and inspiring others to think differently about the world of work while making it happen. Before joining Arm, Charlotte was Chief People Officer at OVO, one of the UK’s largest energy companies, focused on sustainability and renewable energy. In her role, she was responsible for people, property, and customer experience. Prior to OVO, Charlotte spent six years at Arm, latterly as VP of People, supporting teams in the Intellectual Property Group (IPG) globally. Before Arm, Charlotte held HR leadership roles at The Heinz Company and Barclays, and worked in the FMCG and financial services sectors. Spencer Collins Executive Vice President and Chief Legal Officer Spencer is Executive Vice President and Chief Legal Officer at Arm and leads each of the global legal, compliance, company secretary, government affairs and corporate development teams. Spencer has more than 20 years of industry experience and has served as lead counsel on many of the highest-profile M&A and investment transactions in the technology sector. Before joining Arm, Spencer was Managing Partner and General Counsel at SoftBank Investment Advisors (SBIA), the investment manager of the world’s largest technology-focused investment fund, SoftBank Vision Fund. Spencer has also served as a partner in the investment team at SBIA. Prior to SBIA, Spencer practiced as a technology-focused M&A and investment lawyer in the London offices of White & Case and Allen & Overy (A&O). He also spent time on secondment from A&O to Fenwick & West in the San Francisco Bay Area. Spencer is based in the U.K. and spends a significant amount of time in Silicon Valley, U.S. Spencer holds an LL.B. with first class honors and was named General Counsel of the Year at The Lawyer Awards 2023 and the British Legal Awards 2023. In 2024, Spencer was named by the Financial Times in its annual list as one of the world’s top 15 in-house legal leaders. Tamika Curry Smith Senior Vice President and Chief Diversity Officer Tamika leads Arm’s diversity, equity, and inclusion (DEI) strategy, focusing on building high-performing teams, an inclusive environment, and DEI-enabled business results. Tamika previously led DEI at Nike, Inc., Mercedes-Benz USA, Target Corporation, and Deloitte. She has also advised dozens of senior leaders and organizations on how to advance their DEI initiatives. Tamika serves on the advisory boards of the Sanger Leadership Center, SemperVirens Venture Capital, Mathison, and Talenya, Ltd. She holds a BBA from the University of Michigan Ross School of Business and an MBA from the Kellogg School of Management at Northwestern University. Drew Henry Executive Vice President, Strategy and Ecosystem Drew leads a series of strategic growth initiatives for Arm. He first joined Arm in 2017 as General Manager of the company’s infrastructure business. Prior to joining Arm, Drew was CEO of Acetti Software, a cloud virtualization start-up. At SanDisk, Drew was the Senior Vice President and General Manager for various business units developing data storage solutions for telecommunication, consumer electronic, automotive, and cloud companies. At NVIDIA, Drew was the General Manager for GeForce. He has an MSEE from the University of Southern California and a BS in Engineering Physics from the University of the Pacific. Drew is also an avid pilot and open water swimmer. Will Abbey Executive Vice President and Chief Commercial Officer Will leads sales, field engineering, and partner enablement at Arm, helping some of the world's most innovative organizations leverage the newest technologies to ready themselves for the next wave of digital transformation. From IP to AI, Will's unique insight has helped the world's technology leaders transform their products and operations. Will joined Arm in 2004 and has held a number of leadership roles, including General Manager of Arm's Physical Design group. Before joining Arm, he worked in product management positions at Celoxica, Infineon Technologies, and Loughborough Sound Images. He serves on the board of EnPro Industries and holds a BEng from Sheffield Hallam University, UK. Ami Badani Chief Marketing Officer Ami is an accomplished technology leader with over 20 years of experience in marketing, product management, business development, strategy, and investment research. Currently, she serves as the Chief Marketing Officer at Arm, where she leads the global marketing organization, driving company and product positioning, brand awareness, thought leadership, and developer engagement. Before joining Arm, Ami was the Vice President of Marketing and Developer Products at NVIDIA, where she contributed to the company's threefold growth and helped it reach a market cap of three trillion dollars. She was instrumental in driving the data strategy for Generative AI and leading the product, developer ecosystem, and marketing efforts for the data center portfolio, the fastest-growing business segment. Ami also held various roles at Cumulus Networks (acquired by NVIDIA), Instart Logic (acquired by Akamai Technologies), Cisco, Goldman Sachs, JPMorgan, among others. She holds an MBA from the University of Chicago Booth School of Business and a B.S. in business from the University of Southern California. Dipti Vachani Senior Vice President and General Manager, Automotive Line of Business Dipti leads the organization responsible for delivering Arm-based solutions that drive new opportunities in automotive. Previously, Dipti served as Vice President and General Manager of the Product Management and Customer Enablement division in the IoT Group at Intel. At Texas Instruments, Dipti held several leadership positions and led the creation of the company’s Sitara brand of Arm MPUs. Dipti is on the Women’s Leadership Council for the Global Semiconductor Association. She holds a BS in Computer Engineering from Texas A&M, an Executive MBA degree from the University of Texas, and is a graduate of the Executive Education programs at Stanford, Harvard, and Cambridge business schools. Paul Williamson Senior Vice President and General Manager, IoT Line of Business Paul leads the IoT line of business at Arm where he and his team are working alongside the Arm ecosystem to bring compute to a diverse set of applications, unlocking value with intelligence and automation. Previously at Arm, Paul has led the client line of business, shaping the future of consumer products, as well as the security, IoT, and wireless businesses. Prior to joining Arm, Paul led the low-power wireless division of CSR, a fabless semiconductor business (now part of Qualcomm). Paul started his career in engineering consultancy, working with leading global brands to develop innovative products and services. He holds an MEng from Durham University. Chris Bergey Senior Vice President and General Manager, Client Line of Business Chris leads Arm’s client line of business where he is responsible for defining the compute platform that shapes user experiences in the smartphone, the Metaverse, gaming, and laptop/tablet markets. Previously, he led the infrastructure line of business at Arm. Prior to joining Arm, Chris served as SVP of Devices Products at Western Digital and was responsible for product management and product marketing across the company’s $10B+ portfolio of hard drive and flash-based products for datacenter, client, mobile, automotive, and IoT. Chris holds a BS in Electrical and Computer Engineering from Drexel University and an MBA degree from the Smith School of Business at the University of Maryland. Mohamed Awad Senior Vice President and General Manager, Infrastructure Line of Business Mohamed Awad leads the infrastructure line of business at Arm where he is responsible for leveraging Neoverse’s class-leading performance per watt to accelerate Arm’s growth across Cloud, HPC, 5G, and the Edge. Previously, Mohamed led Arm’s IoT line of business. Prior to joining Arm, Mohamed spent 10 years in various leadership roles at Broadcom, including establishing the Mixed Signal Asic Products division and building its security and mobile payments business. Before Broadcom, Mohamed served in various leadership roles at Ember Corporation, Lucent Technologies, Nortel Networks, and Avici Systems. Mohamed has been named inventor or co-inventor on multiple patents throughout his career and holds a BS in Computer Science, from the University of Massachusetts. Richard Grisenthwaite Executive Vice President and Chief Architect Richard is responsible for the long-term evolution of the Arm architecture and has led its development for more than 20 years, beginning with Armv6. He is currently leading development on Armv9 to ensure its specialized processing unlocks new markets and opportunities across the full spectrum of compute. In his early days at Arm, Richard worked on Arm720T, Arm940T, and Arm1136EJF-S. Prior to Arm, Richard worked for Analog Devices on fixed-function DSP, and at Inmos/ST on the Transputer. Richard is an Arm fellow, has a BA in Engineering from the University of Cambridge, and holds 107 patents in the field of microprocessors. Gary Campbell Executive Vice President, Central Engineering Gary leads Arm’s central engineering team, which encompasses most of Arm’s engineering functions. He joined Arm in 1998 as a CPU designer, eventually progressing to engineering leadership as Vice President of Engineering for Media and CPU. His passion for excellence enables Arm to deliver a continued increase in its cadence of products, on schedule with industry-leading quality and performance. Under his leadership, Arm’s engineering teams have doubled the number of products delivered in line with the growth of Arm and its expansion into new markets. He started his career at Inmos working as a Design Engineer on analog and digital electronics. Gary holds a BEng degree in Electrical and Electronic Engineering. Kevork Kechichian Executive Vice President, Solutions Engineering Kevork is leading the team that works closely with Arm’s world-class partner ecosystem to develop and accelerate our technologies as we keep ahead of changing market needs. His career spans 30 years in various semiconductor engineering and leadership roles. Before joining Arm, he was the Executive Vice President of MCU/MPU Engineering at NXP Semiconductors where he led the company’s global architecture and IP & SoC design. Previously, he was the Senior Vice President of Engineering at Qualcomm where he managed the Snapdragon SoC and Technology teams and was responsible for delivering more than 100 SoCs in leading-edge technologies, enabling breakthrough products in mobile and consumer markets. Kevork holds a BEng degree in Electrical Engineering from American University of Beirut and a MS in Electrical Engineering from Concordia University. Eric Hayes Executive Vice President, Operations Eric leads end-to-end execution of operational activities across multiple products and solutions, focused on enabling continued growth, at scale, across key markets. Eric is an industry veteran with decades of experience growing and optimizing technology businesses, driving multiple corporate acquisitions, and overseeing the development of engineering and product organizations. Prior to Arm, Eric was CEO at Fungible, until it was acquired by Microsoft Corp. in 2023, where he led the organization to focus on product market fit and shipping silicon and systems. Eric also served as senior vice president and general manager at Inphi Corporation where he led the company’s multi-hundred-billion-dollar PAM4 DSP business and has held senior leadership roles at Marvell Technology, Cavium, Inc. and Broadcom Inc. Eric holds a B.S. in electrical engineering from the Georgia Institute of Technology and has completed executive education courses at The University of Chicago Booth School of Business. See Arm Board of Directors"
