title = "Tech Unheard Podcast – Arm®"
description = "Learn about our different licensing models, determine which is the best fit for your company, and connect with an Arm representative."
full_description = "Rene Haas in Conversation with Top Leaders Arm CEO, Rene Haas, takes you behind the boardroom door with technology’s most inspiring leaders. Tech Unheard is a lively podcast series that lets you listen in on one-on-one conversations with industry leaders as they discuss everything from the potential of artificial general intelligence (AGI) to keynote nerves. Rene and his guests explore the drivers behind each leader’s path and analyze the most pressing trends in their space — all while sharing a few entertaining anecdotes of success and failure along the way. Subscribe now on: .c-links-container a { border: none; display: block; margin: 16px 0; } .c-links-container img { width: auto !important; height: 50px !important; } @media (min-width: 768px) { .c-links-container a { display: inline-flex; vertical-align: middle; margin: 16px; } } Chris Miller: Explaining Why Some Countries Fail to Capitalize on Technological Progress Join Chris Miller, author of the book, Chip War: The Fight for the World’s Most Critical Technology, and Arm CEO Rene Haas as they discuss the role of the semiconductor industry in the story of economic globalization and the challenges facing governments around the world. Here, Chris shares the genesis for the book with Rene, and gives us fascinating insights into the past, present, and future of the increasingly pervasive computer chip. Tech Unheard Podcast · Chris Miller: On the Chip War and the Future of Semiconductors ads-expansion-panel {--ads-expansion-panel-content-background-color: transparent } ads-expansion-panel {--ads-expansion-panel-content-color: #000000 } ads-expansion-panel {--ads-expansion-panel-border-color: transparent } ads-expansion-panel {--ads-expansion-panel-hr-color: #000000 } ads-expansion-panel {--ads-expansion-panel-toggle-color: ##00C1DE } ads-expansion-panel {--ads-expansion-panel-toggle-background-color-hover: #FFFFFF } ads-expansion-panel {--ads-expansion-panel-toggle-color-hover: #FFFFFF } Transcript [00:00:00] Rene Haas: Welcome to Tech Unheard, the podcast that takes you behind the scenes of the most exciting developments in technology. I’m Rene Haas, your host and CEO of Arm. Today, I’m joined by Chris Miller, Economic Historian at the Fletcher School at Tufts University and Fellow at the American Enterprise Institute in Washington. Chris is the author of several books, including most recently Chip War: The Fight for the World’s Most Critical Technology. He sat down with me to talk about his work as a leading academic in the semiconductor industry. Chris, thanks so much for joining me. [00:00:39] Chris Miller: Good to see you, and thanks for having me. [00:00:41] Rene Haas: Oh, my pleasure. We are in incredibly interesting times here, January of 2025, as we get into the new year and everything associated with new administration. There’s a lot of things that we can cover that’s going to impact our industry, but you and I connected a few years ago when you were writing this book, Chip War, which is a magnificent piece of work, and we’ll talk more about that. But I’d like to maybe start, Chris, and just maybe have you give your background, how you got into the field that you did. However, you want to tell the story. [00:01:13] Chris Miller: Fantastic. Well, as you know, I have no background in semiconductors or anything related to them. I’m a historian by training, studied history in college, decided that I wanted to pursue a career as a historian and so did a PhD in economic history and in particular in Russian economic history, which surprises a lot of people because there aren’t that many connections between Russian economic history and the semiconductor industry. But one of the questions that I got really interested in was what explains why some countries, despite having brilliant technologists and scientists and Nobel Prize winners, seem to have a lot of the key ingredients for technological progress but nevertheless failed to actually capitalize on them. That was the fate of Russia over the last couple of decades. And so I got interested in, well, why was Russia, despite having a lot of the preconditions, not nearly as good at computing as you might think. And that’s how I first got interested in why the US has an extraordinary semiconductor industry and Russia failed to develop one despite its extraordinary scientific and technological talent. [00:02:19] Rene Haas: And why history? Why Russia? Were you, when you were growing up, enamored with going to museums and understanding history? And obviously I don’t have a degree in history, but I find that if you look back in history, it teaches you almost everything about the present and the future. But what was the catalyst for you? And what kind of got your curiosity into all that? [00:02:37] Chris Miller: You know, I think it was, it was similar, desire to understand how the world came to be the way it is. And, you know, I’d studied a bit of economics and a bit of social sciences and found all those interesting, but the best lens for really making sense of the world actually seemed to be to understand how it came to be. And so to me, history was both fascinating in its own right, but also I think really illuminating for making sense of the world as it is today. [00:03:03] Rene Haas: And the angle in Russia, was it USSR or was it Peter the Great? Or how far back into Russian history and economics? [00:03:14] Chris Miller: You know, I started by getting very interested in the history of the Soviet Union. I was born in 1987, so I don’t really have any memories of when the Soviet Union actually existed. And when I started studying it, it seemed like this extraordinary alternative universe, with a totally different economic and social structure, which made no sense, but nevertheless existed for a full 70 years, an entire human lifespan in a country. And so that’s what first got me curious as to how did this country and this system work. But then eventually I ended up writing both one book on the Soviet Union and one book that stretches all the way back to Peter the Great and spent a number of years living in Russia as well and still have great affection for the entire history and culture of the country. [00:03:58] Rene Haas: Oh my gosh. So do you speak Russian? [00:03:59] Chris Miller: I do. Yes. Yeah. I spent a lot of time there before the political dynamics changed for the worse the last couple of years. [00:04:06] Rene Haas: And I remember, you know, you and I were chatting in fact when you wrote the book, and I remember at the time a story internally, that I got an email, a blind email from a gentleman who was a history professor who wanted to talk to me. And I was thinking to myself, why does a history professor want to talk to the CEO of Arm. But I found the story of how you, maybe stumbled is not the right word but I’ll use it anyway, how you stumbled into telling the story that you did, because my understanding was that was not originally the story that you were intending to write, i.e. the history and story of the semiconductor industry. [00:04:37] Chris Miller: That’s right. I really did start with the origins of the Russian semiconductor industry, which I thought was curious insofar as it wasn’t developed at all. Despite that, you know, just a couple of years after the first integrated circuits were invented in the US the Russians, or the Soviets at the time, were trying to build their own. And so the first question was, well, why did the US succeed and Russia fail? But as I was doing that research, I came to realize that although I sort of knew chips were everywhere in my phone and in my PC, I, like I think most people, hadn’t really realized just how pervasive they’d come across our entire lives. And I also hadn’t realized the extent to which the story of economic globalization, which everyone sort of knew, was in large part driven by the chip industry and how semiconductors were probably the best case study and how a product can be designed in one company and manufactured in a second and assembled in the third using chemicals from a fourth. There was really no more complex production process than semiconductors. And so you combine the sort of question of the rise of the modern tech sector with the rise of globalization. You couldn’t understand any of that without really putting semiconductors at the center of your analysis. And like most people, I knew what chips were vaguely, but I’d never really thought about them as being important. And yet, as I looked at the world, I realized I couldn’t really make sense of anything unless I understood better how this industry functions. [00:06:02] Rene Haas: What were some of the things as you got into your research? And as I said, the research you did on this book was just magnificent. I’ve talked to a number of colleagues and I started in the semiconductor industry in the middle eighties, so before you were born. And colleagues of mine reading the book, we just felt like, my gosh, we’re reading the story of our careers in terms of how you just cover the entire landscape. But what were some of the surprises as you started to do your research and talk to the key influencers in the industry, what were some of the things that were most surprising to you? [00:06:32] Chris Miller: Well, I think the first surprise really was the pervasiveness of semiconductors. You know, I, as I mentioned, I knew there were chips in computers and phones, but I think like most people, I hadn’t really come to terms with the fact that there were hundreds of chips in a typical car, for example, or in basically every electronic around my home from my fridge to my microwave, there were chips. Or that as you connected more devices together, that was all driven by improvements in semiconductors. I’d sort of thought of all those as discrete parts of the economy, whereas in reality, it’s chips that unite them all together. So that was one big surprise, just the centrality of semiconductors and enabling every sector of the economy to grow. The second surprise was looking at the way in which no one, not a single country in the world was anywhere close to self-sufficient and producing their own semiconductors. And you had these extraordinary value chains stretching across every major economy. And it was this collective effort that made possible the innovations that semiconductors required and that they in turn enabled. That was a surprise to me. And the third surprise was something that I’d been aware of through kind of discussions of Moore’s law, but had never really thought about, and I think most people haven’t really thought about what it means to have exponential growth over half a century. And that dynamic, when you compare it to any other segment of the economy, is totally extraordinary. And thinking through what that has enabled, I think was the third surprise. I sort of knew about it, but I never really thought about it. And when you do start to think about it, it really is a mind boggling in terms of the rate of progress. [00:08:10] Rene Haas: Now there was a point in time where the US was quite vertically integrated as far as semiconductors go. And I, again, I started my career back at TI and back in the day TI had fabs all over Texas. There were packaging facilities in Texas. The test equipment that we used at TI to test chips were based in the United States. Was it just economics, do you think that pushed them offshore, and them not being TI, but the whole industry? And, or, if you look back in terms of the decision that drove that, could the US have done anything different relative to keeping that capability inside the United States? [00:08:49] Chris Miller: You know, I think one of the most fun parts of my research was interviewing folks from companies like TI who were working there even before you in the fifties and sixties. I had a chance to speak to some people who were in the really early stages of the industry. And as you allude to, they were producing not just their own test equipment, but their own materials, their own wafers, their own chemicals. Everything was done in house and you had to do it like that at the start because that was, there were no suppliers. But one of the things that I think I realized was that as technology got more complex, it just became impossible for one company to specialize in ultra purified chemicals and ultra complex software tools and ultra capable lithography systems. You had to have the value chain split out into different companies so that you could have the specialization that made technological progress possible. So, I think that dynamic was certainly inevitable. The fact you have not just integrated but separate suppliers for different types of components and processes. I think it was also to some degree inevitable and in a lot of ways a good thing that you had a integrated supply chain that stretched across all the world’s advanced economies because it meant that you could defray capital costs of investments, not just in the US, but also globally. And so it was a good thing you were able to access the Japanese market in European markets and Asian markets, etcetera as well. And I think the third thing was that as the technology became more specialized and you know, I think if you look at lithography, which I spent a lot of time studying there’s great examples of this, you really needed the combined expertise of the best optical experts in Germany, plus the best chemical experts in Japan. You needed to tap into that global talent base. And so that was also a key learning that I took away. It’s easy to, I think, have a simple view that we wish it hadn’t become so globalized because it becomes harder to control. And I understand that impulse, but I think you’d also have lost a lot of technological progress had it just been stuck within national boundaries. [00:10:44] Rene Haas: No, I think that’s completely right and you stated very well, the sheer complexity of the shrinking of the transistors and the pace at which we were shrinking them required global innovation in terms of contributing to all that. And whether it was ASML or applied materials or Tokyo Electron, you needed companies across the planet and the globe. In your research, what I remember going back down history lane here, and I was again, the TI in the eighties and at that time, Japan Inc. was really starting to become hugely influential. When I was at TI, TI was the number one semiconductor company in the world by revenue. By the time I left, I think it was Toshiba, NEC, and Hitachi that were the number one, two, and three. This is before Intel started to catch momentum. Why did Japan lose the magic? There was a time where the US was looking at all kinds of tariffs and restrictions and anti-dumping with the Japanese. Why do you think the Japanese lost the recipe? [00:11:42] Chris Miller: You know, I think there were two challenges that Japan faced in the 1980s that didn’t rea"
