["https://arm.com/architecture"]
title = "Arm Architecture – Arm®"
description = "The Arm architecture is the keystone of the world’s largest compute ecosystem. It enables our partners to build their products in an efficient, affordable, and secure way."
full_description = "Arm Architecture for the Digital World The Arm architecture is the keystone of the world’s largest compute ecosystem. It enables our partners to build their products in an efficient, affordable, and secure way. Arm’s proven track record of delivering world-class architecture designs is reflected in the success of this diverse and ever-evolving ecosystem. Arm’s architecture specifications are licensed by partners, who create compliant silicon chips based on them. With more than 300+ billion devices containing Arm-based chips, our architecture empowers innovation in multiple markets enabling partner innovation. While our architecture prevails in the mobile market, powering most smartphones, they also feature in many other areas. From millions of the simplest IoT devices to sophisticated machine learning applications, Arm is everywhere. Arm architecture enables the creation of devices at every level, with a complete tools suite and a strong global ecosystem for support. The Foundation for Possible Arm architecture specifies a set of rules that dictate how the hardware works when a particular instruction is executed. It is a contract between the hardware and the software, defining how they interact with one another. When software is written to conform with Arm specifications, any Arm-based processor or chipset will execute it in the same way. This is the foundation of the portability and compatibility promise, underlying the Arm ecosystem. Our architecture is consistent, compatible and it delivers. Arm System and Security Architectures provide standardisation and best practice guidance, enabling the ecosystem to reduce cost and accelerate time to market when designing systems. Arm provides system architectures free of charge, to help the ecosystem and all system designers. Arm views security as a must-have to be built in from the start of the design and it provides security architectures and the framework to achieve this. Through sustained collaboration with our partners, our next generation of architecture will enable designs that push the boundaries of compute. CPU ArchitectureThe Arm CPU Architecture defines what a CPU must do when software runs on it. All Arm-based CPU designs are built on the same architecture, ensuring software compatibility while enabling market or usage- specific innovation. Architecture Security FeaturesArm works with the ecosystem to provide secure architecture and technologies with a set of capabilities that mitigate a range of security threats. System ArchitecturesArm provides system architectures that are free of charge to use and help the ecosystem design secure and efficient systems as easily as possible. Two Decades of AI Architecture Innovation Arm has a focus on fast-paced architectural innovation that prepares our vast ecosystem for ever-changing compute requirements and the future of AI. Arm has consistently and proactively evolved the AI capabilities of our CPUs over two decades with features such as Neon, Helium, Scalable Vector Extension (SVE), Scalable Matrix Extension (SME), and others. The latest Armv9 architecture features are driving increased compute performance, alongside reduced power consumption for AI workloads. Armv9 Architecture Morello Program Morello is a research program with the potential to radically change the way we design and program processors in the future to improve built-in security. Learn More Related Products and ServicesExplore More Options and Features Silicon IP: CPU Arm CPU processors offer the widest range of processor cores to address all performance, power, and cost requirements. Includes the industry-leading Cortex-A series, the ultra-low power Cortex-M series, real-time Cortex-R series, server ready Neoverse series, SecurCore series and machine learning solutions. Learn Ｍore Silicon IP: Graphics and Multimedia Arm Mali media IP offer high-performing, energy-efficient media processing across a large and growing number of mobile and consumer devices, including smartphones, tablets, TVs, and wearables. Learn More Unlock the Power of Arm Technology Arm’s cutting-edge solutions are easily accessible through our subscription-based licensing options. In just a few clicks, find out if your company has an active subscription to the technology that’s shaping the future of computing. Once you confirm your subscription, explore a treasure trove of IP, powerful tools, and innovative models—all designed to help elevate your projects and get you started on building the future of computing on Arm. Plus, our experts are here to guide you every step of the way. With seamless access and guided excellence, learn how to harness the full potential of Arm technology. From IP integration to advanced modeling, we’ve got you covered. Let's Find Out Architecture Resources Everything you need to know to make the right decision for your project. Includes technical documentation, industry insights, and where to go for expert advice. Arm Launches Armv9 Architecture Arm Architecture Reference Manuals"
author = "Arm Ltd."
year_published = 2025
