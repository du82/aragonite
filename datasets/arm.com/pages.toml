full_description = "Arm's Terms and Policies Arm strives to keep you informed of the terms and policies that apply to our sites. Please explore the content below for further information on our terms and policies. Accessibility Arm strives to ensure accessibility of our sites to all our users. Accessibility Policy Candidate Privacy Policy Arm takes all appropriate steps to protect information about you that is collected, processed, and stored as part of the application and recruitment process. Candidate Privacy Policy Code of Conduct The foundation of our compliance program and a valuable source of information for everyone. Code of Conduct Community Events To ensure ambassadors can run a successful event, Arm has terms in place for community events. Community Event Terms Cookie Policy Arm strives to keep you updated on how we use cookies on our sites. Cookie Policy Open Source Contributing Arm maintains several open source projects for the benefit of its partners. Open Source Contributing Privacy Policy Arm takes your privacy seriously and is committed to safeguarding your personal data. Arm Privacy Policy Quality Policy The Arm quality policy encapsulates the principles by which Arm achieves its business goals. Quality Policy Subscription Center Arm wants you to receive information you care about. Subscription Center Suppliers Policy Our suppliers provide critical goods and services that give us the ability to deliver to our technology partners. Suppliers Policy Terms of Use Arm strives to ensure your understanding of the terms that apply to your use of our sites. Terms of Use Terms of Sale and Supply Terms and conditions which apply to software development tools, models, hardware and associated support services purchased from Arm. Terms of Sale and Supply Trademarks Arm strives to keep you updated in respect of Arm’s trademark guidelines. Arm Trademarks Arm Group Tax StrategyArm Group has a presence in many countries around the world and pays the taxes that it owes