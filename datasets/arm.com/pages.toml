["https://arm.com/architecture/cpu"]
title = "Arm CPU Architecture – Arm®"
description = "The Arm central processor unit (CPU) architecture comes in three varieties: A-Profile for rich applications (latest: Armv9-A), R-Profile for Real-time, and M-Profile for microcontrollers. Armv9 will deliver new security features including confidential compute and a broader workload capability."
full_description = ".cpu-architecture td:nth-child(1) { width:0 } CPU architecture profiles A-profile (Application) Offers highest performance of all architecture profiles Learn More R-profile (Real-Time) Optimized for systems with real-time requirements Learn More M-profile (Microcontroller) Designed for small, low power, highly energy-efficient devices Learn More Implementations Arm Processor IP range: Cortex-A, Neoverse, and Cortex-X Arm Processor IP range: Cortex-R Arm Processor IP range: Cortex-M Features Offers highest performance of all architecture profiles Highly energy efficient Optimized to run rich operating systems Optimized for systems with real-time requirements Designed for small, low power, highly energy-efficient devices Latest Versions Armv9-A and Armv8-A Armv8-R Armv8-M Use Cases Complex compute application areas, such as PCs, laptops, smart TVs, servers, networking equipment, smartphones and automotive head units, cloud storage, and supercomputers. Real-time response requirements in safety critical applications or applications needing a deterministic response, such as medical equipment, vehicle steering, braking and signalling, networking and storage equipment, and embedded control systems. Energy efficiency, power consumption, and size priorities. Security processors, IoT and embedded devices, such as wearables, small sensors, communication modules and smart home products. Each profile means the architecture can be optimized for different environments and use cases. System on chips (SoCs) are often designed to power a specific class of product and include multiple processors that implement different architecture profiles to meet a product’s energy, performance and security needs. Discover learn the architecture – our library of introductory technical guides can help you learn more about the Arm architecture."
