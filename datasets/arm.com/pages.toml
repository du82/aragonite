full_description = 'Group Procurement and Suppliers at ArmArm Group Procurement is a global gateway for third parties to become Suppliers. Group Procurement is a category-driven and centre-led function that supports all business units, enterprise functions, and geographies. Group Procurement is responsible for designing and delivering the full range of supply-base projects and solutions, implementing best practices, systems and controls to support strategic goals. Responsible ProcurementArm Group Procurement covers category planning, source to contract (including outsourcing), contract and supplier management and P2P transactional activities for products, goods and or services. Arm Procurement processes are designed to align with our Responsible Procurement principles. "Responsible Procurement for Arm is leading the purchase of products, goods and/or services that are legal and comply with applicable regulations; being transparent, fair, environmentally and socially responsible and ethical. We strive to work with suppliers who share the same commitments and values, effectively balancing and achieving mutual and optimal value, and maintaining a mindset that is open to continuous improvements." Senior Director, Group Procurement, Arm Category Management Engaging with our business stakeholders for procurement pipeline planning and developing of category strategies and plans to meet priorities. Sourcing to Contract Sourcing project planning, supply market analysis, developing sourcing strategies, supplier selection, supplier negotiation through to contracting with suppliers. Contract and Supplier Management Managing supplier contracts and supplier relationships through their commercial lifecycle to ensure contract compliance and value is achieved in collaboration with our business stakeholders. Procurement Operations Focus on P2P Transactional Ops, Procurement Analytics, Procurement Global Processes and Digital and Procurement Policies, Risk and Compliance. Supporting supplier registration and supplier query resolution. Invoice to Pay (I2P) is supported by Finance, Accounts Payable. Working with Arm Responsible Procurement for Arm relates to all our interactions and dealings with potential and current suppliers. If you are providing products, goods and or services to Arm across multiple geographies, please review our guidance for each geography. Learn More Supplier Governance and PoliciesWe communicate best practices and how they relate to Suppliers through our policies and other important documents. Arm participates in the UN Global Compact (UNGC). We are proud to be part of the UNGC, the world’s largest corporate sustainability initiative. This initiative asks companies to embrace, support, and enact, within their sphere of influence, a set of core values. These values and principles are supported by 21 advanced criteria, covering the areas of strategy, governance, engagement, human rights, labor, environment, anti-corruption, UN goals and issues. We encourage our suppliers to support best practices and our policies or adopt their own codes and or policies which include expectations similar to ours. Policies and Important Documents Code of Conduct Arm code of conduct and ethics. Code of Conduct Supplier Code of Conduct Arm supplier code of business conduct and ethics. Supplier Code of Conduct Standard Terms and Conditions of Purchase Arm standard terms and conditions of purchase for goods and services. Terms and Condition Resources and Supporting Documents Supplier Travel Policy Suppliers undertaking travel on behalf of, and at the written request of Arm, must be aware of our Supplier Travel Policy. Supplier Travel Policy Corporate Responsibility Report Arm reports relating to corporate responsibility and sustainability. Responsibility Report Modern Slavery Act Statement Arm adheres to section 54 of the UK Modern Slavery Act 2015. Modern Slavery Statement Becoming an Arm Supplier Arm selects suppliers that best fit and can meet our business needs and requirements through competitive sourcing. Learn More Contacts Procurement Supplier Support Team for Procurement related queries Email: procurement@arm.com UK Account Payable UK Accounts Payable Team with invoice related queries Email: accountspayable@arm.com US Account Payable US Accounts Payable Team with invoice related queries Email: apautomation@arm.com'
