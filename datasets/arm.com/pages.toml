["https://arm.com/company/purpose-on-arm"]
title = "Purpose on Arm – Arm®"
description = "Discover how advanced technology enables extraordinary individuals worldwide to reach new heights and drive change, inspiring future innovators."
full_description = '''Purpose-Driven People Empowering Innovation on Arm Around the world, people are harnessing the power of AI with a greater purpose to help build a better world. Arm is driving innovation and creating solutions technology to help achieve the kind of breakthroughs that are changing our future. By empowering AI-driven solutions through our vast ecosystem, Arm is helping to transform ambitious visions into reality to achieve the impossible. FEATURED STORYVed: Innovating Advanced Processor Technology to Map the Unexplored SeasTechnology gives us a powerful lens to explore the unknown and expand our understanding of our oceans. As part of a storytelling campaign created for Arm by National Geographic CreativeWorks, National Geographic Explorer and inventor Ved Chirayath uses cutting-edge Arm processors to invent devices that allow him to see through moving water and capture critical data from the sea floor. With AI as a huge force multiplier, Ved processes vast amounts of data, uncovering insights into how these ecosystems sustain the natural world. (function() { window._wq = window._wq || []; _wq.push({ id: '4cyvqg13jp', onReady: function() { var checkClass = $('.wistia_responsive_padding').closest('.column[data-equalizer-watch]'); if (checkClass.length) { $('.wistia_responsive_padding').closest('.column').removeAttr('style').removeAttr('data-equalizer-watch'); } } }); function resizeHandlerWistia() { if (Wistia) { var video = Wistia.api("4cyvqg13jp"); var viewportWidth = window.innerWidth || 0; if (viewportWidth < 1024) { video.width(viewportWidth - 20, { constrain: true }); } } } window.addEventListener('resize', resizeHandlerWistia); })(); Enabling Purpose-Driven InventionsThe NASA FluidCam invention, created by Ved, is designed to capture high-resolution images of the sea floor, generating unprecedented data about our oceans. As principal investigator on other NASA projects, including MiDAR and NeMO-Net, Ved is further advancing ocean exploration and conservation efforts. Powered by Arm’s energy-efficient technology, these AI-driven innovations push the boundaries of what’s possible, advancing our understanding and protection of Earth’s most uncharted ecosystems.Read Ved's Story Arm-Powered FluidCam to Capture the Seafloor Learn More MiDAR Imaging to Reach the Ocean’s Depth Learn More NeMO-Net Enables AI and ML to Turn Raw Data into Ocean Maps Learn More Cinematography in the WildFrederique: How Can Technology Bring Awareness to the World?Frederique Olivier, a wildlife cinematographer, uses technology for both logistics – safety, communication, and navigation – and cinematography, to reach remote locations across the world and capture wildlife footage. Her purpose is to portray parts of the world that most people don’t get to experience and bring new perspectives beyond what can be seen by the human eye. (function() { window._wq = window._wq || []; _wq.push({ id: '725829m297', onReady: function() { var checkClass = $('.wistia_responsive_padding').closest('.column[data-equalizer-watch]'); if (checkClass.length) { $('.wistia_responsive_padding').closest('.column').removeAttr('style').removeAttr('data-equalizer-watch'); } } }); function resizeHandlerWistia() { if (Wistia) { var video = Wistia.api("725829m297"); var viewportWidth = window.innerWidth || 0; if (viewportWidth < 1024) { video.width(viewportWidth - 20, { constrain: true }); } } } window.addEventListener('resize', resizeHandlerWistia); })(); The Impact of Tech in Human AchievementThrough captivating imagery and remarkable filming, Frederique Olivier encourages others to care more about the planet as she demonstrates its beauty and fragility. From navigation devices and drones to photo data storage, Arm’s high-performance, power-efficient AI and machine learning processors power her essential tools—enabling her to push the boundaries of what’s possible.Read Frederique’s Story Advanced Cameras That Function Reliably and Efficiently Lighter, More Power-Efficient Technologies to Withstand Difficult Conditions High-Tech Safety, Navigation, and Communication Tools Discover More Innovations Built on Arm #c-61404181-593b-4b1c-9303-399301cb460f .c-button.c-button--cta { margin-bottom: 60px !important; } Innovators are using technology to change lives for the better, transforming how we work, play, and connect with one another. Our partners are building the future, powering AI to work for everyone, everywhere. Drive Positive Change Through Innovation Innovators are using technology to change lives for the better, transforming how we work, play, and connect with one another. Explore Partner Innovations The Future is Built on Arm If the question is whether Arm technology is in there, now and in the future, the answer is probably ‘yes.’ Discover Arm AM F1 Partnership Driving AI Innovation and Inclusion The Aston Martin Aramco Formula One Team has partnered with Arm, which is now its official AI Compute Platform Partner. Explore Our Partnership Stay Connected Stay up-to-date on the latest news, case studies, and insights by subscribing for updates. Sign Up #c-894ec58e-1fe5-46c1-9d29-a0419843d8b0 { background-image: url('/-/media/global/solutions/mobile/stay-connected-bg-1900x300.jpg?rev=b49a21032ddb45cc9982d84fdf4bbf21&revision=b49a2103-2ddb-45cc-9982-d84fdf4bbf21'); background-color: transparent !important; }'''
