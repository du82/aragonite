description = "Learn about our different licensing models, determine which is the best fit for your company, and connect with an Arm representative."
full_description = '''Build the Future of Computing on Arm Arm technology scales from the sensor to the smartphone and the supercomputer, providing power-efficient intelligence upon which innovative applications and disruptive business models are built. We work with our partners and an extensive ecosystem to deliver leading hardware and software solutions across markets. Markets Automotive Arm enables the embedded intelligence that drives sustainable innovation across today’s automobile industry. Our foundational technology supports an enriched driving experience that offers consumers greater fuel economy, safety, information security, and excellent vehicle performance. Learn More Computing Infrastructure As the world moves toward a trillion connected devices, digital and networking infrastructure has to fundamentally change to support this growth. From cloud to edge, and 5G to high performance computing, our solutions are building a new sustainable infrastructure for a new era. Learn More Consumer Technologies In the same way we drove the smartphone revolution, Arm is now redefining what’s possible across all consumer technologies. We continue to advance mobile computing with longer battery life and always-on connectivity, power next-gen wearables, spearhead new visual experiences, bring the metaverse to life, and much more. Learn More Internet of Things Our unparalleled range of processor IP, development tools, and software has made Arm the leading architecture in embedded and IoT devices. With our vast ecosystem and global community of developers, we are ready to help companies around the world turn the next big IoT idea into a reality and a success. Learn More Technology Topics Artificial Intelligence Through its powerful technologies and a solutions-based approach that includes IP, software, and tools, Arm is bringing artificial intelligence to the network edge, endpoint devices, and applications everywhere. Learn More Security Hardware and software must have a symbiotic relationship, where security is no longer an afterthought. Arm’s security portfolio helps protect against a broad spectrum of attacks, allowing partners to deploy the security level that best matches their application needs. Learn More 5G Network Infrastructure With constant connectivity and incredible performance a must, Arm delivers complete 5G infrastructure solutions for the cloud, the edge, and endpoint. Learn More Cloud Computing As global industry strives to reduce its carbon footprint and reach net-zero emissions, Arm is working with partners to create innovative solutions and systems with unprecedented performance efficiency, increasing performance while reducing power usage, emissions, and costs. Learn More Edge Computing As data is forced to aggregate outside of datacenters, Arm is enabling the use of cloud-native technology and methodologies in edge environments to address new opportunities at scale. Learn More High Performance Computing Arm provides HPC designers with a platform for achieving the near-impossible in an economic and sustainable manner, from drug discovery to climate forecasts, and beyond. Learn More AR/VR/XR Arm is the gateway to the metaverse, providing the compute capabilities that harness the power of AR, VR, and XR to offer new, more immersive experiences than ever before. From entertainment to navigation, our high-performance, low-power specialized processor technology continues to transform every day lives. Learn More Gaming Arm is at the heart of mobile gaming, with partners around the world using industry-leading Arm GPUs and optimization technologies to create exciting new immersive and interactive mobile gaming experiences. Learn More Laptops Arm engineering, technology, and security innovations are delivering always-on, always-connected, 5G, multiday-battery Arm-based laptops. And developers are already realizing the potential of Windows on Arm. Learn More Smartphones Arm’s transformative technology helped fuel the smartphone revolution and now our foundation for smartphone innovation continues that legacy, helping make people more creative, more productive, and more connected. Learn More Wearables Removing the barriers to enable smaller, more responsive wearable technology devices requires low-power IP that can provide performance within a size- and power-constrained setting. Secure, flexible processing is critical. Learn More Industrial Industrial users have led others in the use of connected devices and IoT in the shift to smart manufacturing, automation, and the industrial IoT. Arm solutions allow industrial environments to operate seamlessly across a single architecture from sensor to cloud, while adopting AI, functional safety, interoperability, and security. Learn More Healthcare Healthcare technology can help transform healthcare from reactive to proactive, and Arm delivers the secure, low-power, cost-effective, high-performance technology to help improve patient outcomes and improve efficiency. Learn More Storage Arm technology powers the world’s leading hard disk drives (HDDs) and solid-state drives (SSDs). Our computational storage solutions give organizations the infrastructure and technology they need to store and process data quickly, securely, and efficiently. Learn More Smart Cities As cities constantly strive to be more sustainable, secure, safer, and healthier, Arm helps smart cities evolve with a secure, low-power, and cost-effective technology foundation for all city functions, including transportation, energy, street lighting, and more. Learn More Smart Homes Always-on IoT devices are now a reality for smart homes and buildings. Arm offers a family of scalable, compatible IP products and software development tools so manufacturers can design new enhanced and connected everyday objects, from smart TVs to thermostats and lighting. Learn More Smart Vision Arm is at the forefront of innovation for smart vision devices, providing specialized and intelligent processing capabilities and standardized, secure software to help accelerate development. Learn More Ambient Experiences Arm is helping partners bring together services, data and endpoint intelligence with learned behavior to enable the real-world ambient experiences of tomorrow. Learn More An Ecosystem of Trust Arm is at the epicenter of the world’s largest compute ecosystem. Our vast community of software, tools, and service partners support and enable the use of our technology across markets and applications. setTimeout(function() { var ads_carousel = document.querySelector("ads-carousel").shadowRoot var ads_carousel_img = ads_carousel.querySelectorAll("img"); var ads_carousel_style = document.createElement("style") ads_carousel_style.innerHTML = ".overrideImageSize { width: auto !important; height: auto !important; }" ads_carousel.appendChild(ads_carousel_style) for (var i = 0; i < ads_carousel_img.length; i++) { ads_carousel_img[i].classList.add('overrideImageSize'); } }, 3000); (function () { var id = 'ads-773947dd-ff21-4c97-9087-c3a4cb1e5baf'; var carousel_slot = document.getElementById(id); carousel_slot.addEventListener('adsOnImageClick', function (evt) { var win = window.open(evt.detail.LogoLink, '_blank'); win.focus(); }); carousel_slot.isEditMode= 'False' === 'True'; carousel_slot.showArrowOnHover = true; carousel_slot.responsive = [ { breakpoint: 1024, settings: { slidesToShow: 4, } }, { breakpoint: 768, settings: { slidesToShow: 3, } }, { breakpoint: 500, settings: { slidesToShow: 2, } }, { breakpoint: 330, settings: { slidesToShow: 1, } } ]; })(); View More Partners'''
