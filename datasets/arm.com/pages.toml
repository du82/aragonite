["https://arm.com/company/sustainability/modern-slavery-act-transparency-statement"]
title = "Sustainability | Modern Slavery Statement – Arm®"
description = "As a company whose mission is to create transformational technology as a force for good, Arm welcomes the requirements of Section 54 of the UK Modern Slavery Act 2015. The transparency that the Act seeks to encourage is in line with the way we operate at Arm as reflected by our Code of Business Conduct and Ethics and our company culture."
full_description = "Modern Slavery Statement For financial year ending 31 March, 2024 As a company whose mission is to create transformational technology as a force for good, Arm welcomes the requirements of Section 54 of the UK Modern Slavery Act 2015. The transparency that the Act seeks to encourage is in line with the way we operate at Arm as reflected by our Code of Conduct and our company culture. About Arm Arm technology is building the future of computing. Our energy-efficient processor designs and software platforms have enabled advanced computing in more than 300 billion chips and our technologies securely power products from the sensor to the smartphone and the supercomputer. Together with 1,000+ technology partners, we are enabling artificial intelligence to work everywhere, and in cybersecurity, we are delivering the foundation for trust in the digital world – from chip to cloud. The future is being built on Arm. We are headquartered in Cambridge UK and are part of the SoftBank Group Corp (SBG). This statement covers Arm Holdings PLC and their group companies including Arm Limited. Our Values and Policies Arm does not tolerate any form of modern slavery or human trafficking in its business or in its supply chain, supports both the letter and the spirit of the Modern Slavery Act 2015, and is committed to respecting the human rights of all people. At Arm, Corporate Responsibility is underpinned by: Our Code of Conduct The Arm Code of Conduct supports how we manage our business in a responsible way consistent with our Core Beliefs. It translates legal and regulatory requirements into the behaviors that we expect of all Arm employees, directors and agents and guides us to make ethical decisions that promote trust. All employees are given training on the Company’s Code of Conduct annually and are required to demonstrate on an annual basis that they have read and understand the Code of Conduct. Our Sustainability Strategy Increasing digital connectivity and delivering decarbonization are two global priorities that require constant action across all economies. Driven by our sustainability framework, Arm is working to enable cross-sector technology advancement and to reduce our own environmental footprint, while increasing our societal impact. Arm has signed the Universal Declaration of Human Rights and our Human Rights Policy is incorporated in our Code of Conduct. This is important to Arm as it is a UN-led, as it is an initiative intended to protect and preserve the human rights of all people around the world. In alignment with best reporting practices, Arm reports annually ‘with reference to’ the Global Reporting Initiative (GRI) 2021 Universal Standards. The GRI Standards cover our environmental, social and governance disclosures and progress. For details of our reporting on these areas, please see our Sustainability reports here. Arm is a participant member of the UN Global Compact (UNGC), which asks companies to operate in ways that, at a minimum meet fundamental responsibilities for governance, human rights, labour, environment, and anti-corruption. UNGC companies commit to incorporating Ten Principles into their strategies, policies, and procedures to demonstrate their commitment and integrity. We submit an annual Communication on Progress against the United Nations Global Compact Principles, which can be found online. Arm has been a supporter of the UK Living Wage Campaign since 2015. The Living Wage is a voluntary higher rate of base pay (based on the cost of living) which we, as an accredited Living Wage Employer, have committed to paying all our direct employees as a minimum. Our Supply Base: Assessing and Managing Risk As an IP company, we do not have an extensive tiered supply base for the provision of raw materials coming into the business. Our suppliers provide products and services to Arm’s revenue generating components and its enabling functions. Our suppliers help our people to innovate and operate successfully. We attach great importance to the supply side of our value chain and during this year we have implemented the EcoVadis tool to help monitor and manage any risks in relation to Modern Slavery amongst other sustainability risk. Our Supplier Code of Conduct All of our suppliers who are registered on our Procure-to-Pay platform are asked to confirm their acceptance of our Supplier Code of Conduct which includes requirements that suppliers should not employ child labour, should not participate in human trafficking, the use of forced labour or themselves purchase goods or services from supplier who employ such practices. This code of conduct also includes the requirement for suppliers to comply with local labour and wage laws. Arm requires suppliers who provide products or services to Arm and its subsidiaries and their employees to commit to the principles in this Code as a condition of doing business. Our Responsible Procurement Strategy Arm has developed a Responsible Procurement strategy which supports our UN Sustainable Development Goals (SDGs) and harnesses the potential of diversity, equity and inclusion through working with our supplier base. This includes a focus on Supplier Diversity, Equity and Inclusion and again the EcoVadis tool helps us to monitor and drive improvements with our suppliers in this area within their own business and supply chains. In 2014, we added requirements relating to responsible labour practices into our standard supplier Terms of Business. These referred to the requirement that suppliers respect and promote the rights set out in the International Labour Organisation’s International (ILO) Labour Standards and the provisions of the United Nations’ Universal Declaration of Human Rights in relation to both its personnel and its suppliers. In 2018, we strengthened these requirements by reference to the UK Modern Slavery Act 2015 specifically, i.e. suppliers are required to conduct proper checks on any agency person and Arm reserves the right to require the supplier to remove from performance of the work any of the supplier’s officers, employees, agents or subcontractors whom Arm believes to be engaging in any Modern Slavery Practice, and take such action as Arm considers necessary to ensure Arm and the supplier fully comply with all applicable laws relating to modern slavery. We adopted an updated Supplier Code of Conduct in 2024. As part of our standard new supplier onboarding process, suppliers are required to confirm that they comply with our Supplier Code of Conduct, which sets out our key expectations of our Suppliers. In relation to Employment Standards, these are: Child labour We are opposed to the use of any form of child labour or practices that inhibit the development of children. Suppliers must comply with all child labour laws and should not employ anyone under the age of 15, or where it is higher, the mandatory school leaving age in the local country. Forced or involuntary labour Suppliers must not participate in human trafficking; use forced, involuntary, or slave labour; or purchase materials or services from companies using forced, involuntary, or slave labour. They must be able to certify that materials included in their products comply with the slavery and human trafficking laws of the country or countries in which they do business. Compensation and working hours Suppliers must comply with the applicable wage and hour labour laws and regulations governing employee compensation and working hours. Suppliers should conduct operations in ways that limit overtime to a level that ensures a humane and productive work environment. Diversity and equality Suppliers should aim to provide equality of opportunity and treatment regardless of race, colour, gender, religion, nationality, sexual orientation, age, or disability. Suppliers are expected to support equal pay for work of equal value. Suppliers must oppose discrimination or intimidation towards employees including all forms or threats of physical and psychological abuse. For more information on our Supplier Code of Conduct, please go to suppliers. Further, we expect our suppliers to: Monitor their compliance with the Supplier Code of Conduct and with the law, and identify and mitigate related operational risks in addition to facilitating continuous improvement. Have a process to communicate the Supplier Code of Conduct requirements to next-tier suppliers and to monitor their compliance to the Supplier Code of Conduct and all applicable laws and regulations. Assist us in enforcing the Supplier Code of Conduct by communicating its principles to their supervisors, employees, and suppliers. The Supplier Code of Conduct includes the details of a whistle-blower hotline for confidential reporting of violations of the Supplier Code of Conduct. Non-compliance within our supply base will be reviewed on a case-by-case basis by our Procurement and/or Legal Compliance team, with action to be taken as appropriate. Next Steps We continue our focus on maturing our centre-led procurement organisation, and embedding these processes, controls, performance, risk management and general practices, including Responsible Procurement, across the business. This includes ensuring the business continues to evolve its supplier performance and relationship management capabilities, which enable us to be vigilant and actively consider steps that we can take to mitigate key risks such as modern slavery and human trafficking. The Arm Board of Directors approved this statement on 7 August 2024. Please direct any questions on this statement to Spencer Collins, Chief Legal Officer at legalethics@arm.com Rene Haas, Chief Executive Officer, Arm Holidings plc Arm Modern Slavery Statement FY2017 Arm Modern Slavery Statement FY2018 Arm Modern Slavery Statement FY2019 Arm Modern Slavery Statement FY2020 Arm Modern Slavery Statement FY2021 Arm Modern Slavery Statement FY2022 Arm Modern Slavery Statement FY2023 Arm Modern Slavery Statement FY2024 1Arm's Core Beliefs describe how we act as part of a global community. Together, they articulate Arm's culture: 'We, not I' means embrace both collaboration and individual accountability for the success of Arm 'Do great things' means work with urgency, embrace challenges, find a way 'Be your brilliant self' means insist on excellence. Enable performance, individuality and inclusion across Arm"
author = "Arm Ltd."
year_published = 2025
