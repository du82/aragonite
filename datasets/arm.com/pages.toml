zeHandlerWistia() { if (Wistia) { var video = Wistia.api("p001u3utsj"); var viewportWidth = window.innerWidth || 0; if (viewportWidth < 1024) { video.width(viewportWidth - 20, { constrain: true }); } } } window.addEventListener('resize', resizeHandlerWistia); })(); A More Environmentally Sustainable Business A more environmentally sustainable business starts with our own operations. We are tackling our own environmental impact, transparently demonstrating progress and driven by commitments, including our 2030 net zero goal. We also work closely with our ecosystem of partners to help accelerate their efforts. We also have a role driving energy efficiency in computing to support others in reaching their sustainability goals. The carbon savings from the AWS Graviton3 processor are a recent example of our efforts in this area. Find Out More Arm Starts With People Our success starts with our people. We continue to build an organization of high-performing, exceptional people united by a shared vision and values. We use our working environment, operating practices, rewards, and benefits to engage, motivate, and reward people for doing their best work. We believe our culture and commitment to embracing diversity, equity, and inclusion gives us a competitive edge. Find Out More Operating With IntegrityStrong governance reinforces our sustainability efforts, strengthens our relationships, and ensures confidence in the quality, ethics, and security of our operations and products. Product Safety, Quality and Ethics Securing data and computing systems is a major challenge for the next decade as society's dependence on computing continues to grow. Our Approach to Product Security Corporate Governance The Arm Board has delegated sustainability and climate issues to the Sustainability and Risk Review Committees. Governance Overview Supply Chain Sustainability As a responsible business, we use our size to strengthen supply chain integrity and implement best practices across all Arm business units. Supplier Policy Reports and Policies Transparent reporting is integral to our continued success. We provide meaningful information to help stakeholders and partners assess our environmental, social, and governance performance. Read Reports'''
