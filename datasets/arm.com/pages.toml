title = "Sustainability – Arm®"
description = "Arm's corporate social responsibility initiatives such as developing people, working with communities, and caring for the environment are ways that Arm strives to make a difference. Learn more about how Arm creates positive change though its people, innovation, investment, and leadership."
full_description = '''A Sustainable Future. It Starts on Arm Arm’s success is born from more than 30 years of innovation, partnership, and responsibility that has enabled us to become one of the most trusted technology companies in the world. As we enter a time of rapid acceleration in computing and AI, acting responsibly and sustainably, considering our impacts on people and the planet, and creating change for good remains central to our decision making. Sustainable Business Report FYE24 Our Sustainable Business Report outlines our efforts to create a more connected, equitable future, a more environmentally sustainable business, and to operate with integrity. Download Report FYE24 Sustainability Highlights 6.1 Million people reached through Arm-funded social impact and innovation initiatives since 2015. 77% reduction in emissions in greenhouse gases across all scopes since FYE20. 85% employees believe Arm supports equal opportunities for all. 10,000+ hours volunteering with 700+ charities and nonprofits supported through Team Arm. Our Sustainability Priorities and EnablersClick on the hotspots to see Arm’s sustainability priorities and enablers. (function () { function setWidgetZIndex(zIndex) { var $widget = document.querySelectorAll('.o-widget'); for (var i = 0; i < $widget.length; i++) { $widget[i].style.zIndex = zIndex; } var adsInteractiveImageElement = document.querySelector('#c-' + 'da6ffab8-116e-4ec7-a637-12a27b07587c'); if (zIndex === '') { adsInteractiveImageElement.classList.remove('is-mobile-active'); } else { adsInteractiveImageElement.classList.add('is-mobile-active'); } } function hotSpotDataMapping(rawData) { if (rawData === null || rawData === undefined) return []; return rawData.map(function(item) { return { id: item.id, label: item.title, backgroundColor: item.color, coords: item.coords, crosshairColor: item.crosshairColor, panelPosition: item.dialogBox.panelPosition, tooltip: { color: item.dialogBox.fontColor, position: item.dialogBox.position },