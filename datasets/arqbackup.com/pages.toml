full_description = "Arq supports backup to AWS Seoul region January 7th, 2016 by Stefan Reitshamer Yesterday Amazon Web Services announced their new Seoul region is now available. Today we shipped an update to Arq for both Mac and Windows that supports it! It’s a free update for Arq 4 customers. If you’re already using Arq 4, pick “Check for Updates” from Arq’s menu to install Arq 4.4 (Windows) or 4.15 (Mac). If not, download Arq from our download page to get started: Download As always, if you’ve got any questions or comments, send us mail at support@arqbackup.com or write a tweet to @arqbackup. We strive to respond promptly and help you any way we can!"
