["https://arqbackup.com/documentation/arq7/English.lproj/dropbox.html"]
title = "Preventing Dropbox from Syncing Arq Data"
description = "Preventing Dropbox from Syncing Arq Data"
full_description = "Preventing Dropbox from Syncing Arq Data If you’re using Arq to back up to Dropbox, Arq uses the Dropbox API to upload directly to Dropbox’s servers. But if you’ve got the Dropbox app on your computer linked to the same Dropbox account that Arq is using for backups, the Dropbox app will copy your Arq backup data back to your computer unless you tell it not to. Edit Dropbox Selective Sync Preferences Click the Dropbox menubar icon. Then click your initials (top right) and pick “Preferences” from the menu that appears. Click the Sync tab. Click “Choose folders”. Make sure Apps -> Arq is unchecked. Click Update."
