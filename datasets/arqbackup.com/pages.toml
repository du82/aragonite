description = "Yesterday, as part of responding to a security incident, the Amazon Drive security team temporarily disabled API access for Arq as well as some other apps. In less than 24 hours Amazon determined that Arq was not involved in the incident, and re-enabled Arq’s API access. In a meeting yesterday Amazon folks were not able to provide […]"
