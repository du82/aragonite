title = "Cloud backup for Mac and Windows : Arq"
full_description = '''This Privacy Policy describes how Haystack Software LLC ("Haystack Software") collects, uses, and shares information in connection with your use of our website, services, and applications (collectively, the "Services"). This Privacy Policy (the "Privacy Policy") does not apply to information our customers may process when using our Services. We recommend that you read this Privacy Policy in full to ensure you are fully informed. If you have any questions about this Privacy Policy or Haystack Software's data collection, use, and disclosure practices, please contact us at privacy@arqbackup.com. The usernames, passwords, server names and configuration settings you enter into our application for connecting to your backup destinations are not collected or transmitted to Haystack Software. We will use contact information to email purchase receipts, software update notifications, security update notifications as well as a few helpful emails to get started with the software. We also may occasionally send out a promotional email. Nothing more than once per month and all promotional emails will have a link allowing you to opt-out of all future emails. We do not sell user data to third parties. Our legal basis for collecting and using the personal information described above will depend on the personal information concerned and the specific context in which we collect it. However, we will normally collect personal information from you only (i) where we need the personal information to perform a contract with you; (ii) where the processing is in our legitimate interests and not overridden by your rights; or (iii) where we have your consent to do so. We have a legitimate interest in developing our Services and communicating with you as necessary to provide this, for example when responding to your queries, improving our software or undertaking marketing. You may unsubscribe from receiving certain promotional emails from us. If you wish to do so, simply follow the instructions found at the end of the email, or enter your email address into our unsubscribe page. Even if you unsubscribe, we may still contact you for informational, transactional, account-related, or similar purposes.'''
