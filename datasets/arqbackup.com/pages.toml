title = "Clear Cache"
description = "Clear Cache"
full_description = "Clear Cache If you select your backup plan in the main window and then pick “Clear Cache…” from the menu, Arq deletes its cached information about the backup set, including its database and all the cached backup-record metadata. If you subsequently run the backup plan, Arq retrieves a full object listing plus all the necessary backup-record metadata from the storage location and recreates its database. WARNING: Recreating the database will include a significant amount of data transfer from your storage location."
