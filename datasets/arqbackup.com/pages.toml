["https://www.arqbackup.com/aws-glacier-pricing.html"]
title = "AWS Glacier Pricing - How to Calculate the Real Cost | Arq Backup"
description = "Understand all the S3 Glacier pricing to avoid substantial unexpected charges"
full_description = '''S3 Glacier is a very low-cost cloud storage offering from Amazon Web Services (AWS). It's around $.005 per GB per month, or $5/TB per month to store your data. But there are many fees aside from the storage cost, and they can really add up if you're not aware of them. We'll explain AWS Glacier pricing in detail to help you avoid unexpected charges and achieve the goal of low-cost storage. Like S3 "Standard", S3 Glacier is a cloud storage offering from AWS. Unlike S3 Standard, Glacier and its new cousin Deep Archive work differently than most cloud storage offerings because reading your data requires an extra step: you must "restore" a temporary copy of it first. We'll describe that below. But uploading an object is a PUT request. PUT request fees are billed at $.03 per 1,000 requests. Not a huge charge but 6x the PUT request for uploading an object to S3 Standard. Also, if you upload an object as Standard or Standard-IA or OneZone-IA and then decide to transition it to Glacier, you'll be charged a Lifecycle Transition Fee of $.03 (or more depending on region) per 1,000 requests. Minimum storage duration fee: Glacier objects have a minimum 90 days of storage. If you delete it 30 days after you created it, you'll be billed for the other 60 days. When you need to download your data from Glacier is when the fees add up. Note: The prices below are for the US East (N. Virginia) region. Prices for other regions vary slightly. Glacier data objects are not immediately available. To retrieve the contents of a Glacier data object you put in your S3 bucket, you must first tell AWS (via the S3 console or with an app that uses the S3 API) to "restore" the object for a time period you choose. There are 3 "tiers" of restore -- Expedited, Standard and Bulk: This "restore" action creates a temporary copy in S3. You'll be billed for both the archived object (at Glacier storage pricing) and the temporary copy (at the higher S3 standard pricing) while it exists. Once the temporary copy of your object is available for download, actually downloading will incur a data transfer out fee just like all S3 data. The first 1 GB/month is free, but the next ~10 TB/month are $.09 per GB. There are small discounts for larger download totals in a month.'''
