full_description = "Arq supports backup to AWS eu-north-1 and ap-northeast-3 Regions January 23rd, 2019 by Stefan Reitshamer Amazon Web Services announced 2 new regions, Stockholm (eu-north-1) and Osaka-Local (ap-northeast-3). Today we shipped an update to Arq that supports those regions. It’s a free update for Arq 5 customers. Just pick “Check for Updates” from Arq’s menu to get the update. Or download and run the installer from the download page. As always, if you’ve got any questions or comments, send us mail at support@arqbackup.com or write a tweet to @arqbackup. We strive to respond promptly and help you any way we can!"
