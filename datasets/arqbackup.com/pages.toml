["https://www.arqbackup.com/blog/glacier-pricing-drop"]
title = "AWS Drops Price for Uploading to Glacier - Arq Backup Blog : Arq Backup Blog"
description = "AWS dropped some Glacier pricing by 40%"
full_description = "AWS Drops Price for Uploading to Glacier March 17th, 2021 by Stefan Reitshamer On Monday Jeff Barr revealed a change to Glacier pricing: 40% less for “PUT request” fees for all AWS Regions. If you backing up to Glacier with Arq, the amount you’ll pay in request fees is now 40% less. In practice this won’t be a big price difference for Arq users since Arq de-duplicates — after the initial backup only new or modified files are uploaded. Uploading a TB of data to Glacier with Arq could incur up to $0.90 in “PUT request” fees vs $1.50 with the old pricing. For a full explanation of Glacier pricing check out our AWS Glacier Pricing Explained article."
