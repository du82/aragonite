["https://www.arqbackup.com/blog/how-to-recover-your-things-database-with-arq"]
title = "How to Recover Your Things Database with Arq - Arq Backup Blog : Arq Backup Blog"
description = "If your Things database gets corrupted or you want to go back to an old version, recover the old database from your Arq backups"
full_description = "How to Recover Your Things Database with Arq June 13th, 2015 by Stefan Reitshamer The other day Wendy emailed me because Things crashed and she lost a lot of work, and she couldn’t figure out how to get back her data using Arq. We traded a few emails over the next few hours, but it quickly became clear to me that she wasn’t wasn’t comfortable digging into her Library folder and move files around. So we jumped on Skype and did it together. She shared her screen with me so I could follow along with what she was doing. The support person for the Things app had emailed her a web page with the location of the Things database, and we actually found some backups that the Things app had made by itself, but the newest one was a day old and the work she had lost had been added that morning. So Wendy and I found a more recent Things database in her Arq backups and restored it. Here’s how to do that: Quit the Things app. Click the Finder on the Dock. Click “Go to Folder” from the Finder’s “Go” menu, enter the path ~/Library/Containers/com.culturedcode.things/Data/Library/Application Support/Cultured Code/Things/ and click “Go”. Click the “ThingsLibrary.db” file once to highlight it. Click it a second time to rename it. Change the name to “ThingsLibrary.db_old”. Open Arq. Click the triangle next to your home folder. Select the most recent backup record (or whichever backup you want to use). Click the triangles to drill down to the same folder as mentioned in Step 3: Library/Containers/com.culturedcode.things/Data/Library/Application Support/Cultured Code/Things/ Select the “ThingsLibrary.db” file and click the “Restore” button: Wait until Arq finishes restoring the file. Launch the Things app. You’ll see your Things data as of the backup date that you chose in step 8. To look at your Things database as of a different point in time, repeat the above steps, choosing a different backup record in step 8. If you want to go back to the Things database you had before, quit Things, go back to the Finder, delete the “ThingsLibrary.db” file, and rename the “ThingsLibrary.db_old” file back to “ThingsLibrary.db”. If you run into trouble with an app and you’re not sure how to restore the app’s data from a backup, send me email at support@arqbackup.com and we’ll figure it out!"
