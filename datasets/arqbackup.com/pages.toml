["https://www.arqbackup.com/blog/amazon-cloud-drive-backup"]
title = "Amazon Cloud Drive Backup : Arq Backup Blog"
description = "Use Arq to backup your computer's files securely using your Amazon Cloud Drive account."
full_description = "Amazon Cloud Drive Backup July 2nd, 2015 by Stefan Reitshamer You can now store your encrypted Arq backups in your own Amazon Cloud Drive account! Amazon Cloud Drive includes unlimited storage for $59.99/year, so you can back up everything. Amazon provides a web interface to upload and download files, but Arq uses its API to upload directly to the cloud. Arq is our cloud backup solution that encrypts your files before uploading with a password that only you know, so no one can access your files in the cloud. Your backups are de-duplicated, compressed and encrypted. Use the Arq app on any Mac or Windows PC to restore files from your backups. Arq is available for Mac and Windows and comes with a free 30-day trial so download it and connect it to your Amazon Cloud Drive account and start backing up today. If you’re already using Arq v4, Amazon Cloud Drive support is a free update! Pick “Check for Updates” from Arq’s menu to get the latest version. Then go to the Preferences, Destinations tab, and add a destination. Choose “Amazon Cloud Drive” for the destination type and enter your account info. Then go to the main Arq window and add folders for backup to your Amazon Cloud Drive account."
