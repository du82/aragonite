description = "Trustworthy backup"
full_description = "Arq and Amazon Drive Amazon is sending out emails to Amazon Drive customers stating “Starting November 16, 2023, you will no longer be able to back up your files to Amazon Drive using Arq. Additionally, Amazon Drive will not be accessible after December 31, 2023.” Actually they’ve been emailing Amazon Drive customers for many months now warning of this. […] Read more October 12, 2023 by Stefan Reitshamer Arq, SFTP, and macOS Ventura If you’re using Arq 7 to connect to a macOS Ventura SFTP server and you’re getting the error “Username/PublicKey combination invalid”, it may be due to Ventura’s upgrade to OpenSSH 9.1. The release notes for OpenSSH 9.1 state: To work around this, you could edit /etc/ssh/sshd_config on the Ventura server and add this line to […] Read more November 28, 2022 by Stefan Reitshamer Backup to Storj with Arq Storj is an open-source cloud storage platform that’s been around since 2018. Why Storj? It’s different from providers like AWS, Wasabi and B2 because it’s decentralized. Your data are encrypted, split into pieces, and distributed on a global cloud network. So it’s not dependent on a single data center or region — no central point […] Read more May 31, 2022 by Stefan Reitshamer How to Fix Error -1202 on Mac OS X prior to 10.12.1 As reported on Michael Tsai’s excellent site and elsewhere, if you’re on an older version of Mac OS X, you’ll encounter SSL errors due to a Let’s Encrypt root certificate that expired September 30, 2021. This includes communicating with Arq Cloud Storage servers like cloud.arqbackup.com. Arq may report this error as “The operation couldn’t be […] Read more October 2, 2021 by Stefan Reitshamer Immutable Backups with Arq 7 Arq 7 now includes support for S3’s “object lock” API. If you use Arq to back up to a compatible storage provider, Arq can make your backups immutable for a period of time that you choose. This provides extra protection against accidental deletion and malware/ransomware. Storage options that support object lock include AWS S3, Minio, […] Read more April 20, 2021 by Stefan Reitshamer"
