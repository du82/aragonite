full_description = "Arq backs up to Office 365, SharePoint, OneDrive, and OneDrive for Business! January 28th, 2019 by Stefan Reitshamer Now you can store your Arq backups in your Office 365, OneDrive, OneDrive for Business and SharePoint accounts! Office 365 accounts come with 1 TB of storage, so you can use it with Arq to store backups of all your files. Arq is our cloud backup app that automatically stores backups of your files, encrypted before upload with a password only you know. Arq keeps multiple versions of your files so you can go back in time if your file is corrupted or you changed your mind about changes you saved, or if you get attacked by ransomware. Arq is available for Mac and Windows and comes with a free 30-day trial. Download it today and start backing up all your files. Free Update for Arq 5 Customers If you’ve already got Arq 5 installed, pick “Check for Updates” from Arq’s menu to get the 5.15 update with support for all OneDrive and SharePoint accounts. Then pick “Preferences” from Arq’s menu, Destinations tab, and click the button to add your OneDrive or SharePoint account. As always, if you have any questions email us at support@arqbackup.com and we’ll reply promptly."
