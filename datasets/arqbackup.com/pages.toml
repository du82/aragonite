["https://www.arqbackup.com/documentation/pages/strategy.html"]
title = "Which Destination is Best For Me?"
description = "Which Destination is Best For Me?"
full_description = '''Cloud backup is great because it happens automatically, whenever you have an internet connection. Backing up to your own disk or NAS means you have to remember to plug in the disk or connect to the NAS, so it's a bit less "set and forget"; it only works when your laptop is in the same location as the disk/NAS, for example. If so, it probably comes with a lot of storage that you're not utilizing. You could use Arq to store backups of your files there. If you have a Google Drive, Dropbox, OneDrive, or Amazon Drive account, you get 1 TB (or more in some cases). If you're not using all that space, put your Arq backups there. Many of them also offer free plans; Google Drive offers 15 GB for free, for example. If you have more data than you can fit in your cloud account, you could use a pay-as-you-go service like Amazon S3, Google Cloud Storage, Backblaze B2, or Wasabi. See the comparison chart below for pricing details. If you mount your NAS as a drive on your computer, you can add it as a "network volume" in Arq's preferences (on Windows only) and Arq will mount it. On Mac, you can configure a script to run before backup starts that mounts the NAS if necessary. You could even run Minio on a server, and configure Arq to use it. Choose "S3-compatible server" and enter the URL and key pair for your Minio server. The most durable storage option is Amazon S3. Amazon can withstand the simultaneous loss of 2 of their data centers and still not lose your data. If you want that level of robustness, S3 is amazing. It has proved its reliability for 10 years. But it's more expensive. Wasabi is newer but promises the same level of durability for 83% less ($5.99 per TB per month instead of $13.50).'''
year_published = 2025
clearnet = "https://www.arqbackup.com/documentation/pages/strategy.html"
