["https://www.arqbackup.com/press"]
title = "Cloud backup for Mac and Windows : Arq"
full_description = "One-Sentence Product Description Arq backs up your files securely and lets you keep control of your data. Paragraph Product Description Arq backs up your files securely and lets you keep control of your data. Arq is super simple to set up. It backs up your files to your own cloud account (Amazon Cloud Drive, AWS, Dropbox, Google Drive, Google Cloud Storage, OneDrive, and SFTP). Arq protects your data through strong encryption with a key only you know. Arq uses multiple threads and LZ4 compression for very fast throughput. Arq offers sophisticated file-exclusion filters, storage budgeting, extensive logging, email reports, many scheduling options, and full control over which networks and how much bandwidth Arq uses. Arq is available for macOS and Windows. App Logo Click to download 512x512 PNG: Testimonials On the home page Download macOS 10.10 or later: Download Windows 8 or later: Download Release Notes Mac: Release Notes Windows: Release Notes Price $49.99 per computer Contact Stefan Reitshamer press@arqbackup.com Haystack Software LLC 405 Waltham St Suite 124 Lexington, MA 02421 Company Background After a 20+ year career in software development, mostly creating enterprise software, Stefan Reitshamer felt way too disconnected from the people using the software he helped create. So in 2005 he started Haystack Software. Now he can communicate directly with customers and help them. Making customers happy makes him happy. Arq Story Stefan wanted an easy-to-use backup app but couldn't find that worked well. Time Machine was unreliable and didn't back up to the cloud, and the services available at the time all had limits of various kinds. Amazon S3 was available and was unlimited; backing up to S3 felt like real backup, but there wasn't any great software to do it. So Stefan created Arq, a simple, powerful cloud backup app with encryption so that his files would be protected in the cloud. Since then Arq's popularity has grown beyond all expectations. Arq has expanded to support backup to many cloud providers, and is available for both macOS and Windows. Twelve years on, we're still improving Arq Backup. Arq users were comfortable setting up the app and connecting it to their favorite cloud storage account, and they recommended Arq to their friends. But for friends who weren't as familiar with cloud storage technologies, Arq wasn't a great fit. They were expecting something simpler. So in 2020 we launched Arq Premium. With Arq Premium you don't have to set up your own storage for backups. You just install Arq 7, click New Backup Plan, choose Arq Cloud storage and it backs up everything. After the 30-day trial period, give us payment information and we'll bill you monthly or yearly. It also comes with web access to your backed-up files. More info here."
