["https://arqbackup.com/documentation/arq7/English.lproj/movingToNewComputer.html"]
title = "Moving To a New Computer"
description = "Moving To a New Computer"
full_description = "Moving To a New Computer If you’ve replaced your computer and want to “reuse” the backup data on the new computer instead of creating a new backup set, you can “adopt” the old computer’s backup set. WARNING: You must ensure the old computer is no longer using the backup set. If the old computer is still active and has Arq installed, select the backup plan on the old computer and click the Remove… button to tell Arq to stop using it. Please note: Adopting a backup set on macOS that was created by Windows is not supported. Adopting a backup set on Windows that was created on macOS is also not supported. Adopting a Backup Set Pick “New Storage Location” from Arq’s menu if your storage location isn’t already configured. Expand the storage location(s) listed under “RESTORE” in the main window. Click on the backup set you wish to adopt and click the Adopt button on the right. Arq will read the backup plan information from the backup set and add it as an active backup plan under the “BACK UP” section in the main window."
