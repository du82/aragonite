["https://www.arqbackup.com/blog/arq-and-amazon-drive"]
title = "Arq and Amazon Drive - Arq Backup Blog : Arq Backup Blog"
description = "Amazon is sending out emails to Amazon Drive customers stating “Starting November 16, 2023, you will no longer be able to back up your files to Amazon Drive using Arq. Additionally, Amazon Drive will not be accessible after December 31, 2023.” Actually they’ve been emailing Amazon Drive customers for many months now warning of this. […]"
full_description = "Arq and Amazon Drive October 12th, 2023 by Stefan Reitshamer Amazon is sending out emails to Amazon Drive customers stating “Starting November 16, 2023, you will no longer be able to back up your files to Amazon Drive using Arq. Additionally, Amazon Drive will not be accessible after December 31, 2023.” Actually they’ve been emailing Amazon Drive customers for many months now warning of this. If you’re not using Arq to back up to Amazon Drive, you can ignore it. If you are using Arq to back up to Amazon Drive, you need to back up to somewhere else instead. Arq can back up to many storage services. If you already have an account with Google Drive, OneDrive, or Dropbox with free space you could use that. The cheapest pay-as-you-go offering is probably B2 or Amazon S3’s Glacier storage class. Just pick “New Storage Location” from Arq’s File menu to add your new storage location. Then pick “New Backup Plan” from Arq’s File menu, choose that newly-added storage location, and follow the prompts to choose what to back up, how to encrypt it, etc. By default Arq will back up hourly with that new backup plan. Downloading Historical Backups from Amazon Drive If you want to keep your entire backup history that you’ve stored in Amazon Drive, you can try to download the entire “backup set” using the Amazon Drive app. Then upload that backup set to a new storage location, and add that storage location in Arq (if you haven’t already). If you want to reuse that data for subsequent backups, you can “adopt” it in Arq. The easier option though is to just create a new backup plan to your new storage location (described above) and use that going forward. As always, if you have questions send us email at support@arqbackup.com."
