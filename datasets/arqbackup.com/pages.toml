["https://www.arqbackup.com/s3undelete"]
title = "s3undelete from Arq Backup"
full_description = "s3undelete is a simple utility that removes delete markers from S3 (and S3-compatible) objects in buckets that have versioning enabled. With the 'list' argument, s3undelete prints a list of objects with delete markers as the latest version. With the 'undelete' argument, s3undelete removes the delete marker from each object that has a delete marker as the latest version. To use s3undelete, set 2 environment variables, AWS_ACCESS_KEY and AWS_SECRET_KEY, to your S3 access key ID and secret access key respectively."
