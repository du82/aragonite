title = "Cloud backup software for Mac and Windows : Arq"
description = """
We believe you shouldn't have to give up your privacy or control to get the benefits of the cloud.                                                                        Arq backs up your files to a cloud account you already have, or attached disk, or both, with strong, end-to-end encryption so your data are only readable by you.                                                                        No limits.                                                                        No vendor lock-in."""
full_description = '''Arq backs up your files. You control your data. Arq® is backup software for your Mac or Windows PC. Download Arq 30-day free trial Version 7.35.1 for macOS Released 5 Mar2025 Release Notes Version 7.35.0.0 for Windows Released 25 Feb 2025 Release Notes "@arqbackup I just switched from Arq 6 to Arq 7 and it’s great. Really nice work. Your tool makes backups a joy." — @reactorcontrol "After 3 complete failures of Time Machine (to a Synology, APFS Disk Image, SMB) since I'm on Big Sur, I migrated this task to my beloved @arqbackup app and it works like a charm." — @benoitsan We believe you shouldn't have to give up your privacy or control to get the benefits of the cloud. Arq backs up your files to a cloud account you already have, or attached disk, or both, with strong, end-to-end encryption so your data are only readable by you. No limits. No vendor lock-in. Arq uses filesystem snapshot technology to make perfect, point-in-time backups of your files, even if your files are changing during the backup process. Arq keeps multiple backups of your files — a backup history. So if you discover a file was corrupted, or accidentally deleted, or encrypted by a ransomware attack, you can go back and get the old version. Arq Backup integrates with many different cloud providers. So if you have a cloud account with some extra space available, use it for encrypted, versioned backups of your important files. You can also back up to an SFTP server or an external drive or a NAS. Or back up to all of the above! Arq can back up to multiple destinations. We also offer Arq Premium: the same great app for up to 5 computers plus integrated cloud storage in one package. Efficient — compression, de-duplication, block-level incremental backup Unlimited backup — backs up any file size, file type, external drive, network share Versioned file backup — keeps multiple versions of your files; if you discover a file is corrupted, go back in time to get an earlier version Unlimited retention — keeps backups of your USB drives even if you never reconnect them Ransomware protection — point-in-time recovery of files Restore right from the app — no downloading of zip files Configurable to your needs: back up hourly or daily prevent backup on specific Wi-Fi networks and/or network interfaces prevent backup while on battery power limit bandwidth usage limit retention to reduce storage usage custom file/folder exclusion rules include network shares Awesome customer service Stable, self-funded, owner-operated, profitable company since 2009'''
