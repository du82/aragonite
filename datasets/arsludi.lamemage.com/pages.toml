title = "ars ludi  » A Good Year for Gaming"
description = """
A picture is worth a thousand words, right?



That's how many times I gamed each year for the past decade. I know it's quality not quantity that matters, but 2011 was a fiery ball of gaming win.

So next time you're wondering why I haven't posted on Ars Ludi in a while, there's your answer: I"""
full_description = 'A Good Year for Gaming A picture is worth a thousand words, right? That’s how many times I gamed each year for the past decade. I know it’s quality not quantity that matters, but 2011 was a fiery ball of gaming win. So next time you’re wondering why I haven’t posted on Ars Ludi in a while, there’s your answer: I’m busy gaming. Or designing games like Microscope. Usually both. Ben Robbins | Jan 2nd, 2012 | what we played | show 8 comments hide comments #8 ben robbins said: January 4, 2012 at 7:56 pm Which, coincidentally, is the name of the next project I’m working after that: “Excuses and Fabulous Claims, the Role-playing Game!” It takes a page from Stepping Stones: Telling More Interesting Lies — something I’m failing to do right now. Reply #7 Morgan said: January 4, 2012 at 10:08 am Excuses and fabulous claims. Reply #6 ben robbins said: January 3, 2012 at 10:44 pm @ Morgan: It’s not entirely ready to walk to school by itself, but as soon as it is, you know it will be heading your way. There may be a sharp boom as it breaks the sound barrier. Reply #5 Morgan said: January 3, 2012 at 9:46 am Send me Kingdom to play on our own. Reply #4 ben robbins said: January 2, 2012 at 5:54 pm As an aside, I bought Microscope and loved it, so I look forward greatly to the next project you alluded to in your recent podcast interview (a couple months back IIRC) – assuming, that is, that you have enough time to make it between playing Better still, the new game (codename: Kingdom) is one of the games we’ve been playing. It’s a twofer! Reply #3 TheHydraDM said: January 2, 2012 at 10:58 am Some of the best advice in designing games that I’ve ever heard is definitely remembering to make time to play. Sometimes I find myself spending too much time delving into design theory and not enough time actually playing, so I wholeheartedly applaud you on your “fiery ball of gaming win”! As an aside, I bought Microscope and loved it, so I look forward greatly to the next project you alluded to in your recent podcast interview (a couple months back IIRC) – assuming, that is, that you have enough time to make it between playing ;) Reply #2 ben robbins said: January 2, 2012 at 1:39 am Individual games. So many games… Reply #1 Xander said: January 2, 2012 at 1:13 am Is that individual games played or events in which you gamed? Reply Leave a reply Click here to cancel reply. name email (will be kept private) Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
