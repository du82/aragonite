full_description = 'Behold, You Can Get Email Notifications! Social media is awful for actually communicating, so how’s a clever person like you to avoid missing the stuff I post here in the dark hours of the night, when even the owls are asleep? Well now it’s easy, because I’ve set up email notifications. Sign up and you’ll get a message every time I post a new article. Hopefully this will make life a lot easier for folks who want to keep up with my posts. There shouldn’t be too much traffic since I don’t post that often and you can unsubscribe whenever you want. Welcome aboard! Ben Robbins | Aug 5th, 2021 | misc | show 2 comments hide comments #2 Scott said: August 10, 2021 at 11:15 am Thanks! As a now ex-social-media user, I appreciate that. I actually have you in my RSS reader though! I’ll go hobble away back to my nursing home now. Reply #1 Drew said: August 5, 2021 at 3:55 pm Comments Reply Leave a reply Click here to cancel reply. name email (will be kept private) Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
