["https://arsludi.lamemage.com/index.php/4260/i-dont-envy-conservatives-this-election"]
title = "ars ludi  » I Don’t Envy Conservatives This Election"
description = "First off, I really didn't think I had so many conservatives reading my blog, but I am glad to have you here and glad that we've been able to have civil talks. There's far too little of that nowadays and I appreciate it. The idea that we can disagree but still respect each other is essential to keep"
full_description = 'I Don’t Envy Conservatives This Election First off, I really didn’t think I had so many conservatives reading my blog, but I am glad to have you here and glad that we’ve been able to have civil talks. There’s far too little of that nowadays and I appreciate it. The idea that we can disagree but still respect each other is essential to keeping our country working. And second, I am encouraged that the people who replied supporting Trump said they were doing so because they want ordinary conservative policies like small government, reduced taxes, or immigration reform. Things any Republican candidate would promote. I respect that! We will always have disagreements about the best way to run our society, and those debates help us find better solutions, and that’s good. We want disagreement! We want all sides to have a voice! That’s democracy. So this message is for my conservative readers, because I don’t envy the position you’re in. Your Party’s Choice Normally elections are easy. Once the primaries are over you just vote for the person your party picked, because you can be pretty certain they support the policies you prefer. And yeah, it’s a two-party system so you really don’t have that much choice (which is a whole other kettle of fish). But now the “conservative” candidate is… extremely radical. He broke his oath to uphold the Constitution and tried to steal the last election. Don’t take my word for it, listen to Mitch McConnell, one of the staunchest Republicans in existence: Fellow Americans beat and bloodied our own police. They stormed the center floor. They tried to hunt down the Speaker of the House. They built a gallows and chanted about murdering the vice president. They did this because they’d been fed wild falsehoods by the most powerful man on Earth. Because he was angry he lost an election. Former President Trump’s actions preceded the riot were a disgraceful, disgraceful dereliction of duty. That’s one of the most powerful people in the Republican party talking about the Republican President. Now Trump says we can’t believe our own eyes (or Mitch McConnell apparently) about January 6, that there was no riot, that it was a “day of love”… while in the next breath saying US citizens who disagree with him are the “enemy from within” and that he will use our own military against us. It’s enough to make your head spin. And on top of trying to overthrow democracy, he’s a weird rambling racist criminal sex-offender. And no, that’s not me trying to be insulting, that’s me trying to sum up an astounding mess. Like I said in the last post, there are almost too many horrible things about Trump to hold in your head at the same time. So given that, I can understand why so many conservatives would rather turn a blind eye towards Trump’s actual behavior and just believe all the people trying to cover for him. You want to support the same conservative policies you would have supported in any other election, except now the person wearing the Republican team jersey is also a criminal trying to burn down the rule of law. Your Choice I believe every citizen should vote how they want and every legal vote should be counted. But I also believe everyone should *want* to vote against Trump — regardless of party, and maybe even more so if you’re a conservative — because protecting the Constitution and the country is more important than politics. Democrats have it easy. They get to save the country just by doing what they would normally do and supporting their party. But if you’re a conservative, you’ve got a tough decision. Do you support your party’s candidate, even though he is trying to overthrow the Constitution? Yeah, that sucks. Your party put you in a terrible position. They failed you. Sadly, in this race, there is no legitimate conservative candidate for you (unless there’s a third party candidate you like — you tell me). And that’s messed up, because we need strong conservative voices just like we need strong liberal voices, so we can argue and debate and figure out the best path for the country. But overthrowing elections and saying you’ll send troops against citizens who disagree with you is not conservative, it is entirely radical. It is not small government, it’s the most oppressive form of government possible. So what do you do? Do you hold your nose and support Trump to try and get the policies you want? Or do you vote against Trump and protect the country? Because you can’t just vote for the parts of Trump you can stomach: you get the whole package. There is no such thing as voting for his policies without putting all his terrible urges in the drivers seat. So do you vote to stop Trump? That’s what I think is the right answer, but it’s not my decision, it’s yours. Maybe you’re unwilling to vote for a Democrat because you don’t agree with their policies. If that’s how you feel, I get it. I would never ask you to change your values or vote for policies you don’t believe in. Like I said, disagreeing about policy is healthy, and I respect it. But as a fellow citizen and human being, I feel it’s not out-of-line to ask you to at least *not vote* for someone who wants to break the law and send the military to shoot me just because I dare to disagree with him. You have that third option: you can choose not to vote at all, or pick a third party candidate who supports your values. It doesn’t matter what Trump’s other policies are if his first policy is undermining the Constitution. Don’t give power to someone who thinks Americans are enemies and overseas dictators are allies. Don’t give power to someone who wants to hurt the rest of us. I’d rather you vote to stop him, but if that’s too much, at least don’t vote to give him power. Four Years From Now If Trump is defeated and we keep democracy going, four years from now we’ll do this all again and conservatives will (hopefully) have a real candidate who believes in the Constitution and has an agenda that doesn’t involve violent suppression of the citizenry. And then we can debate policy again. I’m looking forward to it. Ben Robbins | Oct 28th, 2024 | in real life | show comments hide comments #1 Nathan Bass said: October 29, 2024 at 7:51 pm Trump will destroy our democracy? Good, because we are a constitutional republic, not a democracy. Reply Leave a reply Click here to cancel reply. name email (will be kept private) Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
