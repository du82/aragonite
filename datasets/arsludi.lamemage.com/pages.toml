description = '''
"You cut a deal with the yoga people?!? Why would you do that?!?!?" --us screaming at Joe after he totally screws us

Remember Tomorrow is made for cyberpunk action, interwoven stories of lonewolf heroes going up against the powerful corporate factions that control society.

So of course we deci'''
full_description = 'Remember Suburbia “You cut a deal with the yoga people?!? Why would you do that?!?!?” –us screaming at Joe after he totally screws us Remember Tomorrow is made for cyberpunk action, interwoven stories of lonewolf heroes going up against the powerful corporate factions that control society. So of course we decided it would be perfect for a game about suburbia. Instead of mega-corporations peddling cyber-implants, we’re facing off against factions like the New Age yoga people in the park, the neighborhood dog owners, and even the dreaded Home Owners Association. Our everyday heroes have lofty story goals like “get my slacker son to go to college” and “turn that vacant lot into a community p-patch”. And if you think reducing big neon ninja violence to making sure your grass is cut to community standards would take the stakes down a notch, you would be entirely wrong. The battle lines are drawn in the Birchwood Circle housing development. Knives are out. Metaphorical knives, anyway. Will Alice go to any lengths to grow her own tomatoes, perhaps even bothering to learn the first thing about gardening? Will Holly dare deliver the mail in the yard where that retired police dog runs loose? The one with the suspicious eyes and the behavioral problems? Will Jim regain the respect of his ex-wife? Or his kids? Or really, anyone? We’re three games in and it has been entirely too much fun. The perfect mix of hilarious but also heartfelt. Even the faction antagonists are all genuine humans we can relate to, our neighbors and peers. They’re all just people with their own issues. Except for Blake, the sleazy yoga instructor. Everybody hates that dude. Ben Robbins | Sep 5th, 2024 | Remember Tomorrow, what we played | leave a comment hide comments Leave a reply Click here to cancel reply. name email (will be kept private) Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
