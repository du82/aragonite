title = "ars ludi"
description = "if you asked Ben's brain about gaming, this is what it would say"
full_description = "Our crew has been talking about this stuff for ages, in person, in posts, and through the games we design. But I realized we never put all the pieces together in one place so you could see how it all fits together. And just how we want to build on each others’ ideas when we play games, I want people to be able to build on the lessons we’ve learned. But big ideas need the big brains, so I have called in the A-team. This document is the fruit of discussions with Caroline Hobbs, Marc Hobbs, Joe Wandyez, and Ace Hamilton, as well as years of experiences in countless games with countless people, a lot of them at Story Games Seattle.… [read more] It occurred to me that even though our crew has all these ideas about how we think games should be — all these principles and conclusions from years and years of play, including eight years of Story Games Seattle — they are not all together in one nice, neat, easy-to-read place. We’re making a document that says, “these are the kinds of games we make and also the kinds of games we want”. The principles that we think are essential for the specific kind of games we play, story games where people make stuff up together instead of having a game master. GMless, co-creative, etc. Our ground is level and our table is round, aka ground table games.… [read more] We’re rebel artists, painting portraits in a culture where depicting faces is forbidden. Our society think it’s just… wrong. When we want to hit back at some oppressor we graffiti a perfect picture of their face on the side of a building where everyone can see it. But now one of our least subtle rebel artists has been apprehended by the authorities, and we’re playing the scene of their judgment. As players, we hold a quick conference to decide what the legal system is like. Our society seems pretty civilized, so violence feels like too much. Imprisonment? Noooo… exile! Offenders are cast out into the barren wastes beyond the city. Before there was Story Games Seattle, before I really knew what the hell I was doing with story games and GMless games, I played some truly pivotal sessions that really helped shaped my understanding and future thinking. And some of the games that influenced me the most were played in Tony Dowler’s basement. And if that name sounds familiar, it might be because Tony was one of the brains behind Go Play NW since the dawn of time (and which has an online con coming up in a few weeks)."
