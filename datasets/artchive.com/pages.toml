title = "11 Watercolor Techniques and Tricks You Should Try Today – Artchive"
full_description = "11 Watercolor Techniques and Tricks You Should Try TodayBy Artchive / February 24, 2024 February 24, 2024 Watercolor is a beautiful medium where the pigment is bound by a substance that dissolves in water, creating beautiful transparent effects and different tonal values with one single brushstroke. The term watercolors refers to both the medium, the paint, and the paintings made with them, and It is very popular among artists of all ages and levels. The main characteristics of this medium are transparency, opacity, liftability, and granulation, which are key to learning about when learning and trying new techniques. For example, a flat wash consists of uniformly applying paint to get a flat, even result, and you won’t get a uniform flat wash with a highly granulating pigment. In the same way, the blotting technique is used to lift watercolors, creating highlights or adding texture and you won’t be able to lift if you don’t know which pigments make heavily staining colors. Still, there are a lot of watercolor techniques you can learn and use, and in this guide, we’ll teach you how to step-by-step 11 of them, so grab your paints, paper, and tape and get ready to paint! 1. Flat Wash The flat wash technique consists of creating a smooth, flat, consistent layer of color on the paper, and it is one of the first techniques that watercolor artists need to learn. This technique is great for making skies, filling large areas, and making backgrounds and base layers. While the concept of filling an area with a layer of color sounds quite simple, the paper, the brushes, and the nature of watercolor paint’s fluidity make it an actual challenge to paint a layer that is uniform and consistent. Creating a proper flat wash can’t be achieved with any brush, flat brushes or mop brushes are recommended for this technique, but enough about concepts, let’s learn how to do it: For this technique, you’ll need: Watercolor paper (preferably high-quality, 140lb or heavier) Watercolor paints A large, flat brush or a mop brush Water and a palette or mixing tray Paper towels or a cloth Lay your paper on a flat surface, and have your paints, water, and brushes within easy reach. Also, make sure to keep some paper towels or a sponge near you to control the amount of water. Flat Wash Technique Step-by-Step Prepare enough paint in your palette. The mix should be even and fluid enough to spread easily but not so watery that it lacks color strength. For a smoother wash, you can lightly wet the paper first. This step is optional and depends on the desired effect. Load your brush with paint and apply a horizontal stroke across the top of the paper. The brush should be fully loaded but not dripping. Reload your brush and apply the next stroke just below the first, slightly overlapping it. Continue this process, moving down the paper, and maintaining a bead (a small pool of paint) at the edge of each stroke. Tilt the paper if necessary to allow the bead to move down evenly. Work quickly to prevent the edges from drying, which can create unwanted lines or streaks. Once you reach the bottom of the paper, let the wash dry completely without tilting or disturbing the paper. 2. Graded Wash A graded wash is very similar to a flat wash, but with the difference that instead of evenly filling an area, the paint should make a smooth gradient, going from light to dark or from one color to another. The graded wash is another fundamental technique in watercolors, and while it might not seem that crucial, it is the foundation for many other techniques, plus ist is widely used for depicting skies, landscapes, and backgrounds where a gradual change in tone or color is needed. Achieving a smooth graded wash requires control over the dilution of the paint and the angle of the paper, so consider slightly tilting the paper because it can help the paint flow smoothly. Remember that graded washes can be challenging; so practice on scrap paper to perfect your technique. Let’s put this technique to the test! For this technique you’ll need: Watercolor paper (preferably high-quality, 140lb or heavier) Watercolor paints A large, flat brush or a mop brush Water and a palette or mixing tray Paper towels or a cloth Graded Wash Step-by-Step Prepare your paint in the palette. Start with a more concentrated mix for the beginning of the wash. Load your brush with the mixed paint and apply a horizontal stroke across the top of the paper. After each stroke, slightly dilute your paint with water. This gradual dilution will create the graded effect. Apply the next stroke just below the first, slightly overlapping it. Continue this process, moving down the paper and diluting the paint a bit more with each stroke. Keep a bead (a small pool of paint) at the edge of each stroke to ensure a smooth transition between each layer. As you reach the bottom of the paper, your paint should be very diluted, ending in a very light tone or clear water. Let the wash dry completely without tilting or disturbing the paper. 3. Wet-on-Wet Technique The wet-on-wet technique is essential in watercolor painting and involves laying down paint on a wet surface so the colors flow and bleed into each other, forming smooth edges and soft layers. This kind of technique works great for backgrounds, skies, water, and other elements where you want a soft blurry look. When used properly, this technique creates very natural gradients and organic shapes as well as diffused and blurred edges that give the illusion of distance and depth. At the same time, it also serves the function of creating abstract effects and textures which is possible due to the paint’s nature and the pigment’s granulation. The results you get depend a lot on the paper’s degree of dampness, as well as the amount of water in your brush. While there is a small window to use the wet-on-wet technique, it still allows for quite a range of applications depending on the paper and brush’s wetness. More water means less control and can be quite difficult to master, but it creates the most beautiful results once done properly. On the other hand, less water means more control, but learning how to make the surface wet enough or when is the right time to apply the paint can take some practice. Many people will wonder how to do the wet-on-wet technique, and here at Artchive we understand simply reading about it is not enough, so let’s put this technique to the test. For this technique you’ll need: Watercolor paper (preferably high-quality, 140lb or heavier) Watercolor paints Brushes (a variety of sizes) Water and a palette or mixing tray Paper towels or a sponge A spray bottle (optional) Wet-on-Wet Technique Step-by-Step Prepare your watercolor paint on the palette. The paint should be more fluid than for dry paper techniques. Use a large brush or a spray bottle to wet the surface of the paper as evenly as possible. The paper should be uniformly damp but not overly saturated. Apply a wash of color to the wet paper. Observe how the paint spreads and diffuses. While the first wash is still wet, add another color. Watch how the colors blend together on the paper. Experiment with dropping in color, tilting the paper to let the paint run or using a sponge to lift off some paint. Play with the amount of water on your brush and paper to see different effects. Use less water for more control and more water for more blending and bleeding. Allow the painting to dry naturally. Using a hairdryer can sometimes create unwanted textures. Once the first layer is dry, you can add more layers using the same wet-on-wet technique for deeper colors and complexity. 4. Dry on Dry Technique (Dry Brushing) The dry brush technique is another popular painting technique that involves using a subtly loaded brush on top of dry paper to get crisp, textured lines. While the term dry-brush can’t be interpreted literally in watercolors since water is needed to dilute the paint, hence wetting the brush, what does need to be for this technique to work is the paper. Wet or even slightly damp paper will take away the sharpness and expression of the traces made with a “dry brush”, blurring the edges and softening your traces. This technique is great for painting things like snow, adding texture to mountains, painting vegetation, adding texture to the ground, drawing dry tree branches, or even adding glistening effects to water. Using the dry brush technique is quite easy, however, beginners might struggle with getting the right consistency and intensity on the color hence the importance of preparing the colors properly beforehand and testing the darkness or lightness of the paint on a sheet of paper beforehand. Since we know reading about it is not enough, let’s put this technique to the test. For this technique you’ll need: Watercolor paper (preferably high-quality, 140lb or heavier) Watercolor paints Brushes (Round, Flat,f and Fan) Water and a palette or mixing tray Paper towel or a cloth Spare piece of paper for testing Lay your paper on a flat surface, and have your paints, water, and brushes near you. Also, make sure to keep some paper towels or a sponge near you to control the amount of water. Dry Brush Technique Step-by-Step Dip your brush in water and then into the paint. Wipe the brush on a paper towel or cloth to remove excess moisture. The brush should be damp but not wet. Gently drag the brush across the surface of the paper. The brush should skip across the paper’s texture, leaving a broken line of paint. Try different levels of dryness in your brush to see the various textures you can create. Use different pressures and speeds in your brush strokes to vary the effect. Use the dry brush technique to add fine details or highlights to your painting with gouache paint. This technique is great for final touches where precision and texture are needed, plus you can layer dry brush strokes over wet or dry washes for different effects. 5. Layering Watercolors The layering technique, also known as glazing, is one of the most important techniques in watercolor painting. It involves applying several thin, transparent layers one on top of the other to change the appearance of the layers underneath, achieve complex color mixing (optical mixing), add depth to the painting, and increase the intensity of the colors. It is used to achieve smooth tonal transitions, beautiful transparency effects and to work on details. This technique is also especially good for adding shadows, defining highlights, and adjusting the composition values. Although layering is a beginner-friendly technique, the main rule of successful layering is patience. This technique works better when the artist has control over the paint’s transparency and the paper’s dryness, which can only be achieved with practice. Layering has several different uses, but is especially useful when learning color mixing and how pigments interact with each other. It’s great for those transparency effects on flowers, it’s used to paint difficult subjects like water and to play with light effects. It’s also used in botanical and even anatomical painting, but enough about concepts. Let’s put this technique to the test: For this technique, you’ll need: Watercolor paper (preferably high-quality, 140lb or heavier) Watercolor paints Brushes (a variety of sizes) Water and a palette or mixing tray Paper towels or a cloth Layering Technique Step-by-Step Let’s make a blueberry. Start with a light wash of color. This layer sets the foundation for subsequent layers. Allow this layer to dry completely before adding another. Once the first layer is dry, apply a second layer. This can be the same color to deepen the tone or a different color to create a new hue. Continue adding layers, allowing each to dry fully before applying the next, building the color of the blueberry. Use more water for lighter, more transparent layers on the top, and less water for more opaque effects. Use finer brushes and less water to add details in the lower layers. These details can include textures, sharp edges, or small elements like stains and leaves. 6. Wet-on-Dry Watercolor Technique The Wet-on-Dry technique is one of the most versatile techniques in watercolors, as its name indicates, it involves applying wet paint onto a dry paper surface, this allows for more control over the paint, as it doesn’t spread beyond where the brush applies it. It’s ideal for creating shapes that are well-defined, crisp lines, and detailed textures, this technique is often used for subjects that require precision and clarity, such as buildings, flora, and fauna. This is the technique that is most used by beginners since it follows the same pattern as different mediums, however thanks to the fluid nature of watercolors this technique might become challenging to master since colors might bleed into each other creating a muddy appearance. To master this technique, controlling the amount of water and paint on the brush and having the patience to let the paper dry properly between layers is a must. Now let’s put this technique to the test. For this technique you’ll need: Watercolor paper (preferably high-quality, 140lb or heavier) A pencil Watercolor paints Brushes (various sizes, depending on the detail required) Water and a palette or mixing tray Paper towels or a cloth Wet on Dry Technique Step-by-Step Lightly sketch the outline of a flower with a pencil on your watercolor paper. Include the stem, pistil, and basic shapes for the petals. Prepare your green and purple paints in the palette. The green will be for the leaves and the purple and pink for the petals and pistils. Using a small-sized brush, apply green paint to the stem and leaves. Since the paper is dry, the paint will stay within the lines you paint, allowing for a defined stem and leaves. Switch to a larger brush and use the purple paint to add the petals. You can use small, dabbing strokes to create a nice effect but leave the middle dry. With a fine brush, add small dbas of paint in the middle with pink for the pistil. Use a darker pink and purple to define the middle section, creating the effect of light and shadow. Add any final details or adjustments needed. Allow the painting to dry completely. 7. Blotting Watercolor Blotting is a fun and easy watercolor technique that consists of lifting color from the wet surface of the painting with a napkin or paper towel to create fun and interesting textures, correct mistakes, add light effects, etc. Depending on how it’s used, blotting can add texture to a painting or be used to add highlights since the amount of paint lifted depends on the wetness of the paint, the paper type, and the absorbency of the material used for blotting. One of the key factors for the success of this technique is experimentation. Different materials offer different results, as well as the amount of pressure you apply, so make sure to experiment before trying this new technique on a painting. Let’s see how it’s done. For this t"
