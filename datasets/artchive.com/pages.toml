["https://www.artchive.com/art-mediums/digital-art"]
title = "What is Digital Art? History, Artists, and Artwork – Artchive"
full_description = "What is Digital Art? History, Artists, and ArtworkBy Artchive / May 1, 2024 August 1, 2024 Digital art refers to any form of art that involves the use of digital technology in the creative process or presentation of artistic works. Digital art emerged in the early 1960’s when pioneers like John Whitney made the first computer-generated art, and when Ivan Sutherland invented the first computer-graphics interface known as Sketchpad. This art form evolved incorporating and encompassing techniques such as digital drawing and painting, 3D modeling, Pixel art, Digital collages, and Augmented Reality (AR) art. With the help of new digital software and new technology, artists like Mike Winkelmann (Beeple), Loish, Butcher Billy, and Lim Chuan Shin have shaped the field and made groundbreaking contributions to digital art, often combining traditional art practices with digital techniques to push the boundaries of visual expression. What is Digital Art? In simple words, digital art is art that has been created with the help of computers and digital technology. If an artist uses digital tools for the most part of their process, then it’s considered digital art. In order to make digital art you’re going to need digital software (also called computer software) specially made for art, such as Photoshop, Clip Studio Paint, Krita, Illustrator, Blender, Autodesk, among others. Alongside that you’re also going to need a computer and a graphics tablet, or a mobile device with enough processing power to handle said software. Digital artists use several techniques and tools to produce art, like layering, composition techniques, photobashing, and even traditional fine art techniques that can be reproduced on a digital canvas using a stylus and a drawing tablet. Once the artwork is completed, it can be displayed on screens, shared on social media, printed onto materials like canvas or paper or sold online as digital files, like NFTs. Types of Digital Art Digital art blends art with technology, offering artists several ways to express their ideas, including different types of digital art such as digital painting, vector art, pixel art, digital collages, and 3D modeling. Each type of Digital art uses different techniques and tools, so even though they all start from the same digital canvas, the final products can be vastly different. Digital Painting Digital painting is a form of digital art where artists use a paint program, a digital canvas, and traditional drawing and painting techniques to make paintings, some of which might look like traditional artworks but are made using digital tools. Making digital paintings involves using a stylus with pressure sensitivity and a graphics tablet (or a tablet, or a pen display) to draw and paint on, this setup mimics the feeling of painting with a real brush but is made with digital strokes instead. Software like Adobe Photoshop, Corel Painter, CLip Studio Paint and Procreate are very popular choices due to their selection of digital brushes and tools that simulate the different painting mediums like oil paint, watercolors, gouache or charcoal. You can make portraits, landscapes, character designs, and pretty much anything you’d do in your normal sketchbook or canvas, even abstract art. This versatility is what makes digital art the favorite of many artists as they can freely experiment without needing to buy new materials or deal with fumes and afterwards-cleaning that traditional mediums require. Vector Art Vector art is a type of digital art that uses mathematical equations to create graphics composed of points, lines and shapes which are called vectors. Unlike the “traditional” images which are made of pixels and called “raster” images, Vector graphics can be scaled to any size without losing quality or without pixelating. This makes them great for things like logos, illustrations and designs that need to be used in several sizes and formats. To make vector art, a special computer software is needed. Software like Adobe Illustrator, Inkscape, Affinity Designer or Corel Draw translates the shapes you trace into mathematical data. This data dictates how the vectors behave when the image is scaled larger or smaller, so that the artwork remains sharp and clear at any size. While you don’t need a graphics tablet or a stylus to make vector art and a mouse is more than enough, many artists prefer using them for their precision and the more natural drawing experience they offer. Vector art is commonly used to make logos, icons or typography, however it can also be used to make beautiful illustrations, although they take more time and patience than when using painting programs. Pixel Art Pixel art is a digital art form that uses pixels as the basic building blocks of images, these images look like the early video games graphics that were limited because of the technology of the time and were displayed in a visible grid-like structure. Pixel art embraces this aesthetic, and uses it to create images that are now used for games, or as a tribute to older games that were loved by the community. Pixel art is created by setting up a grid like canvas on a special painting software (or a painting software that has that feature) that allows precise control over each pixel. The process consists of basically placing each pixel intentionally to create images, animations, backgrounds or game sprites. Pixel art’s unique charm lies in its simplicity and the creativity required to evoke complex scenes and emotions with a limited palette and resolution Pixel art is widely used in the video game industry, especially in retro and indie games. It’s also used in animated web graphics, mobile apps and as a form of pop art in social media. 3D Modeling 3D Modeling is a form of digital art where artists create three-dimensional objects, characters and environments on a computer. These models can be very simple like the example above or highly detailed and hyper-realistic depending on the artist’s intention. 3D modeling artists need to consider several factors besides the usual 2D artists use, plus sculpting skills are a must. To make 3D art, artists use specialized and highly resource-demanding software to build models by shaping and connecting polygons or by sculpting them with virtual clay. In order to do this, a computer with strong processing power as well as an excellent graphics processing unit is needed, plus a graphic tablet for more control when sculpting or texturing models. Additionally, software like Autodesk Maya, 3DS Max, Blender and ZBrush are used for digital sculpting. These programs also offer tools for texturing, rigging and rendering. You can create pretty much anything in 3D, from characters, props, and environments for video games and films to new digital products and virtual reality experiences. Digital Collage Digital Collage is an art form that consists of combining multiple images or elements into a single composition, while it resembles a lot its traditional counterpart, it expands the horizons of collage, opening the possibility to adding interactive media and video to the compositions. Artists use image editing software to cut, manipulate and layer photographs and other digital elements. The process often involves using layer modes, changing the transparency, size and color of the images, and some drawing and painting to harmonize the composition. Digital Collages can be realistic montages that blend the images seamlessly for backgrounds or more abstract surrealist artworks where artists can unleash their creative expression. This form of digital art is popular in graphic design, advertising, book publishing and other editorial work. For a complete list, see our article on Types of Digital Art Styles. History of Digital Art Digital art was invented in the early 1960’s, when John Whitney and Ivan Sutherland dared to take a step towards innovation and developed the first computer generated art and the first computer graphics user interface. Origins of Digital Art George Nees and Frieder Nake were among the pioneers, producing “computational art”, which were algorithmic artwork based on mathematical models. As the 1960’s ended, computer art started becoming more and more popular, marking the real beginning of digital art history. The term digital art didn’t really come to be until the end of the 1960’s where the first digital art exhibitions were held, including the popular “Cybernetic Serendipity ” at the Institute of Contemporary Art in London. AARON In 1973, Harold Cohen created AARON, which was a complex software that could make art autonomously, and also was the first introduction of machine learning. AARON started with simple, abstract compositions and later advanced to producing more detailed figure works, including portraits and landscapes. Mac Paint In the 1980’s as technology became more accessible to the public, Mac Paint was launched. This innovative software revolutionized the way people interacted with digital art since it allowed users to create and manipulate digital images with an ease that has not been possible with earlier software. It’s user friendly interface and brushes that mimicked traditional brushes and pencils opened new possibilities for personal and professional use on the computer, giving more creative freedom to the public and definitively changing the way digital art was perceived 3D Computer Animation In the 1990’s we all saw a significant advance in 3D animation, which transformed fields like television, animation, digital photography and the video game industry. Software like Autodesk 3D Studio and Photoshop revolutionized the day to day of digital at professionals, hardware became more powerful enabling computers to handle heavy software required to render 3D graphics opening new possibilities for artists and animators. Beyond commercial entertainment, the late 1990s saw artists experimenting with 3D animation to create artworks that explored virtual realities and digital landscapes. Artists like Char Davies developed immersive art installations using VR technologies, blurring the lines between virtual and physical spaces and challenging traditional notions of art and experience. Digital Painting The 2000’s saw what we could all a “boom” in digital painting, tools like Photshop and Corel Painter evolved significantl, offering more sohpisticted brushes and features for artists, this, paired with the development and popularization of graphics tablets and the introduction of the first Wacom Cintiq, the first graphics tablet with a screen, completely changed the game for digital artists, making the digital painting experience more intuitive and similar to paintign on a paper or canvas. THe 2000’s also witnessed the rise of platforms such as DeviantArt, which alowed artists to share their digital works, receive feedback and conenct with other artists all over the world. Digital art techniques became increasingly integrated with motion graphics and web design, and continued advancements in 3D animation and visual effects software saw digital art techniques becoming more integral to the production processes in video games and films. Artificial Intelligence Art, NFTs, AR and VR One of the most siginifcatn trends we’ve seen is the use of AI to create art, tools like Open AI, DALL-E, DeppDream, etc allow artists and non-artists to procduce complex pieces based on a single prompt. While this has brought both joy and controversy to the artistic community, it highlights a moment of evolution in the way art is conceived and created. The rise of blockchain technology has introduced NFTs, a method for certifying ownership and authenticity of digital assets. This has opened a new market for digital art, allowing digital artists to sell their work as unique assets and gain more control over their copyrights and earnings. In the latest years, digital art has taken a turn, moving from the computer screen towards more immersive experiences like aumented reality (AR) and virtual reality (VR). AR allows digital elements to be superimposed over the real world, creating immersive experiences that can be accesed through smartphones and AR glasses. VR takes the concept of immesion to another level, by placing viewers inside the artwor itself, allowing artists to create detailed, large drawings and art pieces, even complete worlds that viewers can explore and interact with. Digital Art Software Digital art software refers to all the computer programs designed to help in the creation of digital art, from the planning to the making, editing and producing process.These software are made to help artists by bringing them tools tailored for specific purposes, for example, some programs might have tools for drawing and painting, others for vector art, others are made entirely for 3D modeling and others have features that help with animation, enabling artists to work in multiple mediums using a single or a couple programs. The major difference between these software is the purpose they’re made for, some are very complete and cover several aspects of two or more digital art forms, some are specialized and made for a single art form, and some try to cover them all. Each software has a different learning curve, and while some have a steeper learning curve than the others, they’re also made for professional use so you shouldn’t feel bad if you don’t master all their features. Another difference is the price, some programs like Gimp and Krista are free, some have a subscription-based model, like Photoshop and some are paid like Clip Studio Paint and Cinema 4D. Photoshop Photoshop is a photo editing software made by Adobe Inc. that is currently the industry standard for photo editing, photo manipulation, and digital drawing and painting. Photoshop is mostly used for photo editing, however it’s also the go-to software of many professional digital illustrators. It is a paid software, and it works under a subscription model, which means you have to pay a monthly fee to be able to use the software. It has features like the use of different, customizable brushes, layer modes, correction modes, filters and effects and the recently added Generative Fill feature which uses artificial intelligence to change, remove or add elements from the photo or composition. Krita Krita is an open source digital painting and illustration software developed by the Krita Foundation and the community of volunteers that make up the Krita development team. Instead of image manipulation like Photoshop, Krita is primarily used for digital painting, comic and manga creation, concept art, and animation. Praised for its user-friendly interface and being highly customizable, it can be easily tailored to suit the workflow of any artist, additionally, since krita is open source and free it’s a popular choice among artists who have a tight budget or for those who are just starting in the digital art world. Clip Studio Paint Clip Studio Paint "
