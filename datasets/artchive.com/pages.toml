title = "38 Art Mediums to Try: Composition, Characteristics, Uses – Artchive"
full_description = "38 Art Mediums to Try: Composition, Characteristics, UsesBy Artchive / April 19, 2024 July 27, 2024 Art mediums refer to the materials or tools used by artists to create their artworks. These can range from traditional substances such as oil paints, watercolors, and clay to more unconventional materials like digital software, found objects, or light and sound. The choice of medium directly influences the artwork’s aesthetic qualities, texture, and form, and it plays a crucial role in expressing the artist’s vision, technique, and conceptual ideas. Art mediums serve as the tangible means through which artistic creativity is manifested, allowing for a diverse range of expressions across different genres and styles. Below find 38 art mediums to choose from for your next project below, enjoy! 1. Oil Paint Oil paint is a type of slow-drying paint that consists of particles of pigment suspended in a drying oil, commonly linseed oil, which serves as the binder. The viscosity of oil paints can be modified by adding a solvent such as turpentine or white spirit, and varnish can be added to increase the glossiness of the dried oil paint film. Oil paints have been used for centuries for their versatility, richness of color, and durability. They offer a range of textures and techniques, from smooth blending to thick impasto, making them favored for their capacity to capture intricate details and the depth of color. Oil paint is the most common medium used in fine art painting, particularly in canvas painting. Oil paints are prized for their brilliant colors, excellent covering power, and flexibility. They allow artists to rework areas of a painting over long periods due to their slow drying time, enabling the creation of detailed and complex artworks. Oil paints are also used in other applications, including furniture finishing, decoration, and conservation of historic artifacts. The medium’s enduring popularity owes much to its adaptability to various artistic expressions, from realism to abstract art. For info on what oil paints to use, see our full guide on Best Oil Paints for Artists. 2. Acrylic Paint Acrylic paint is a fast-drying paint made of pigment suspended in acrylic polymer emulsion, with water as the vehicle for the emulsion. Acrylics are water-soluble when wet but become water-resistant when dry. Depending on the thickness and techniques used, the paint can resemble a watercolor or an oil painting, or it can achieve its own unique characteristics not attainable with other media. Acrylic paints are known for their bright, vibrant colors, and they have good color stability in varying conditions, including exposure to light and air. Additionally, they can be diluted with water or modified with acrylic gels, mediums, or pastes to achieve a variety of textures and effects. Common use cases for acrylic paints include a wide range of artistic applications, from traditional canvas painting to decorative crafts and murals. Due to their versatility, durability, and quick drying time, acrylics are favored by artists at all levels of expertise. They are suitable for use on a variety of surfaces, including canvas, paper, wood, and metal, making them a popular choice for both indoor and outdoor projects. Acrylics are also used in educational settings for teaching art due to their ease of use, non-toxicity, and easy cleanup. What are the Best Acrylic Paint Brands for Artists? The best acrylic paint brand for artists is, in our opinion, Winsor & Newton. For more info on what acrylic paints to buy, including for different price points and use cases, see our full guide on Best Acrylic Paints for Artists. How Can I Learn How to Paint with Acrylic? You can learn how to paint with acrylic using Artchive’s Art Tutorial: Acrylic Painting for Beginners. Written by our in-house experts, it provides the fundamental tips necessary to begin your journey with this medium. 3. Watercolor Paint Watercolor paint consists of pigments suspended in a water-based solution, primarily water, with gum arabic typically serving as the binder to hold the pigment in suspension and adhere it to the paper. The hallmark of watercolor paints is their transparency, allowing the white of the paper to reflect through the paint, which contributes to the brightness and luminosity of the colors. Watercolors are valued for their ability to be layered and washed out, offering a range of possibilities from delicate tints to more vibrant, opaque layers by adjusting the water-to-paint ratio. The fluid nature of watercolor allows for unique blends and gradients that are difficult to achieve with other mediums, making it particularly suited for capturing subtle shifts in light and color. Common use cases for watercolor paints include landscape and portrait paintings, botanical and wildlife illustrations, and abstract art. Due to their portability and ease of setup, watercolors are popular among artists who prefer to work en plein air (outdoors) or travel a lot. The medium is also favored for its ethereal and fluid effects, which lend themselves well to expressive, spontaneous styles of painting. Watercolors are used in various applications beyond fine art, including architectural renderings, fashion design sketches, and calligraphy, showcasing the versatility and wide appeal of this medium. For more information on Watercolors, see our full guide on Watercolor Painting. For ideas one what Watercolor paint to buy, see our full guide on the Best Watercolor Paints. Just starting out with Watercolors? See our full guide on the Best Watercolor Paints for Beginners. 4. Gouache Paint Gouache paint is an opaque water-based paint that combines the same basic materials as watercolor—pigment, water, and a binding agent, usually gum arabic—but with the addition of a white element, such as chalk or white titanium dioxide, to enhance its opacity and reflectivity. This composition gives gouache a heavier, creamier texture and leads to a matte finish when dry, contrasting with the luminous transparency of watercolors. Gouache is known for its vibrant colors, and its ability to cover large areas smoothly without leaving brush marks. The paint’s opacity allows for easy layering from dark to light hues, unlike traditional watercolor techniques which usually work from light to dark. Gouache is commonly used in fine art, illustration, and design work due to its versatility and ease of use on a variety of surfaces, including paper, canvas, and wood. Its solid coverage and fast-drying qualities make it particularly suitable for illustrators and designers who require a medium that can produce bold, flat colors for posters, comics, and other graphic works. Additionally, because gouache can be reactivated with water, it allows for corrections and modifications even after the paint has dried, providing flexibility in the creative process. The medium’s matte finish ensures that artwork can be photographed or scanned without the glare associated with glossy finishes, making it an ideal choice for reproducing artwork. What are the Best Gouache Paint Brands for Arists? The Best Gouache Paint for Artists, in our opinion, is Winsor & Newton. For more information on what Gouache paints to buy, including options for different price points and use cases, see our full guide on Best Gouache Paints for Artists. How to Learn How to Paint with Gouache? You can learn how to paint with Gouache paint with Artchive’s art tutorial: Gouache Painting for Beginners. Made my our in-house master artists, it is a great introduction to this wonderful medium. 5. Pastel Paint Pastel paint, often referred to simply as pastels, is a unique art medium in the form of sticks, consisting of pure powdered pigment and a minimal binder of gum tragacanth or methylcellulose. This combination retains the intense color of the pigment in a slightly stick form. Unlike other painting mediums, pastels do not require drying time and offer immediate vibrant colors with a powdery texture that can be easily blended and layered on the surface. The lack of a liquid binder means pastels do not have a glossy finish, allowing for the creation of soft, matte artworks. The high pigment concentration in pastels results in colors that are exceptionally vivid and enduring. Pastels come in various hardness levels, from soft to hard, and oil pastels, which have a different composition including non-drying oil and wax, providing a creamy texture. Pastels are primarily used for creating art with a soft, velvety texture that can range from subtle, delicate shades to intense hues. They are favored for their ease of use and the direct application of color to the support, typically paper, that has a slight tooth or texture to hold the pigment. This medium is popular among artists for portraiture, landscapes, and still life due to its ability to produce a wide range of effects, from highly detailed and precise lines to broad, expressive strokes. The immediacy and blendability of pastels make them well-suited for capturing light and atmosphere, often used in plein air painting. Despite their fragile nature, pastel artworks can last for centuries if properly preserved under glass to protect them from smudging and environmental factors. Types of Pastel paints include: Oil Pastels, Soft Pastels, Hard Pastels, Pastel Pencils, Water-Soluble Pastels, and Pan Pastels. 6. Oil Pastels Oil pastels are a painting and drawing medium with a composition that includes pigment, a non-drying oil, and a wax binder, creating a soft, creamy texture that is both blendable and resistant to the effects of humidity. This unique composition allows oil pastels to produce intense colors and a smooth application that can be easily blended on the surface or layered for a more textured effect. Unlike soft pastels, oil pastels do not crumble or produce dust, and their workability can be enhanced by oil, thinners and mineral spirits, enabling a range of painterly techniques. The vivid colors and direct application make oil pastels suitable for both beginners and professional artists, offering an immediacy and versatility that is distinct from other coloring media. Common use cases for oil pastels include vibrant artworks on paper, canvas, wood, and even glass, with techniques ranging from thick, impasto-like application to thin, glazing layers. They are particularly favored for their expressive color, ease of use in blending and layering, and the ability to work on various textures and surfaces without the need for extensive preparation. Artists often use oil pastels for portraits, landscapes, abstract compositions, and mixed media works, exploiting their rich texture and bright, durable colors. The medium’s accessibility and forgiving nature also make it a popular choice in educational settings, encouraging experimentation and creativity without the need for hazardous solvents. For more information see our full guide on Oil Pastels. What are the Best Oil Pastel Brands? Our testing and research has concluded that the best oil pastel brand for the money is Harbor Art Supplies, with their Elite Artisan collection (for professional and advanced artists), and Studio Starter (for students and beginners). For more information on our research and what oil pastels to use for your artwork, see our guide on the Best Oil Pastels. How Can I Learn How to Paint with Oil Pastels? If you are interested in learning how to draw/paint with oil pastels, you can use Artchive’s Art Tutorial: Oil Pastels for Beginners. In includes all the fundamentals, per-requesites, and step-by-step instructions to get your started off with this wonderful medium. 7. Soft Pastels (Chalk Pastels) Soft pastels, often referred to as chalk pastels, are composed of pure powdered pigment and a minimal amount of binder, typically gum arabic or methyl cellulose, which gives them their distinctive soft texture and intense color saturation. This composition allows for easy blending and layering on paper, with the high concentration of pigment providing vibrant colors that can be applied with both precision and broad strokes. The soft texture of these pastels enables them to produce a wide range of artistic effects, from delicate, feather-light touches to rich, dense color applications. Unlike oil pastels, soft pastels produce a matte finish and can create dust during application, requiring careful handling and preservation. Common use cases for soft pastels include a wide variety of artistic endeavors, from detailed portrait and landscape work to abstract art. They are favored for their ability to produce immediate, vibrant works with an almost painterly quality, despite being a dry medium. Artists appreciate the directness with which they can apply color to the surface, allowing for quick, spontaneous expression and the ability to work in layers, blending colors directly on the artwork. Due to their versatility and the dynamic range of effects they can achieve, soft pastels are popular in both professional art practices and as a medium for instruction and exploration in art education. The finished works often require protection, as the pigment can be easily smudged, typically needing the use of a fixative or framing under glass. For more information on what soft pastels to use for your artwork, see our guide on Best Soft Pastels. 8. Pastel Pencils Pastel pencils combine the vibrant colors and soft, blendable nature of soft pastels with the precision and ease of use of a pencil. They consist of a pigment core that includes a binder and a minimal amount of filler, encased in wood. This composition allows for the creation of fine, detailed lines as well as the soft blending and layering effects characteristic of traditional pastels. Pastel pencils produce less dust than soft pastels, making them a cleaner alternative, while still offering a wide range of vivid colors. The precision of the pencil form allows artists to create intricate details and textures that would be difficult to achieve with larger pastel sticks, making them ideal for adding fine details to larger pastel works or creating standalone detailed pieces. Common use cases for pastel pencils include portrait and landscape drawing, where the ability to blend colors seamlessly and create detailed features is essential. They are also popular in wildlife and botanical illustrations for their capacity to capture the subtle variations in color and texture characteristic of natural subjects. Artists appreciate the control and cleanliness offered by pastel pencils, making them suitable for both studio work and sketching in the field. This medium is especially valued for its versatility, allowing for a combination of drawing and painting techniques in a single piece. For help choosing which pastel pencils to use for your art, see our guide on the Best Pastel Pencils. 9. Tempera Paint Tempera paint is a permanent, fast-drying painting medium consisting of colored pigments mixed with a water-so"
