full_description = "Pablo Picasso – Artwork & Bio of the Spanish Painter Artists / By Artchive Pablo Picasso was a Spanish painter born on 25 October 1881 in Malaga, Spain. Picasso began to show a talent for art at an early age and received his first lessons from his father. At 13, Picasso had developed an ability that surpassed his father’s. The following year, he moved with his family to Barcelona, … Pablo Picasso – Artwork & Bio of the Spanish Painter Read More » Piet Mondrian – Artwork & Bio of the Dutch Painter Artists / By Artchive Piet Mondrian was a Dutch painter born on 7 March 1872 in Amersfoort, Netherlands. Piet was born into a family with artistic interests – his father was a headmaster who painted as a hobby, and his uncle was a professional artist. Piet received his first art lessons from his father and uncle before enrolling in … Piet Mondrian – Artwork & Bio of the Dutch Painter Read More » Max Beckmann – Artwork & Bio of the German Painter Artists / By Artchive Max Beckmann was born on 12 February 1884 in Leipzig, Germany. Beckmann developed an early interest in art, often making sketches in class. After failing to enter the Academy of Fine Arts in Dresden, Max enrolled at the Weimar-Saxon Grand Ducal Art Academy, studying under Carl Frithjof Smith and graduating with a diploma in 1902. … Max Beckmann – Artwork & Bio of the German Painter Read More » Peter Paul Rubens – Artwork & Bio of the Flemish Painter Artists / By Artchive Peter Paul Rubens was a Flemish painter born on 28 June 1577 in Siegen, Westphalia. At age 14, Rubens began his artistic education, studying under Tobias Verhaecht, Adam van Noort, and Otto van Veen. In 1600, Rubens traveled to Italy, where he became the court painter for the Duke of Mantua. He returned to Antwerp … Peter Paul Rubens – Artwork & Bio of the Flemish Painter Read More » Vincent Van Gogh – Artwork & Bio of the Dutch Painter Artists / By Artchive Vincent Van Gogh was a Dutch painter born on 30 March 1853 in Groot