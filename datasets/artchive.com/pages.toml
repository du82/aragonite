title = "Watercolors: Characteristics, History, Artists – Artchive"
full_description = "Watercolors: Characteristics, History, ArtistsBy Artchive / February 17, 2024 February 28, 2024 Watercolor is an art medium where paint is made from pigments mixed with a binder that dissolves in water, creating beautiful textures and translucent effects when applied to paper. The term Watercolor refers to the paint, the art, as well as to the paintings created using this medium, however, it’s used mostly to refer to the paint. The beauty of watercolor lies in its transparency and the ability it gives the artist to create layers of water and paint that capture light and shadows with unmatched grace. Unlike other mediums like oil and acrylic, the unique composition of watercolor makes it easier to use, being water-based and water-soluble, it does not pose many risks to the health of artists, it is also less messy and much more fluid, making blending and layering with it much easier. Some of the most prominent characteristics of watercolors are the transparency of the paints, the opacity of the pigments, the granulation and texture that they create, and the lightfastness and permanence that makes them last for centuries. All of these affect the way the artwork is created and force the artist out of their comfort zone in matters of composition and techniques. Techniques for working in watercolor range from very easy to quite difficult, from a ‘wet on wet’ approach, which is painting onto wet paper for soft diffused results, down to dry brush methods, which can achieve sharp, detailed effects. Watercolor artistry is one of the most flexible forms of art because an artist has a myriad of techniques to create different effects and textures and numerous combinations of colors. The history of watercolor mimics the fluidity of the medium itself. From the ancient Paleolithic cave paintings to the 18th and early 19th centuries where watercolor became respected as an art of its own, watercolor has always been a constant in the art world. Nevertheless, it was only when it fell into the hands of masters like J.M.W. Turner and William Blake, that watercolor painting was truly born, paving the way for emerging contemporaries and modern painters to discover new horizons with what became a truly versatile medium. What Are Watercolors? Watercolors are a kind of paint used in art, which is water-soluble. They are composed of pigments dissolved in a water-based solution, usually a combination of water and a binder such as Gum Arabic. When used on a surface, typically paper, the water evaporates, leaving the pigment in place. These paints commonly are sold in pans, half pans, and tubes. They can also be found in liquid form, or made as pencils and markers. Watercolors are chosen for their aesthetic appeal and practicality, and are used in landscape, abstract, and fine art, as well as in illustration and design. They have a number of distinctive qualities that allow for a wide variety of expressive uses and remain a popular medium for artists of all levels. Characteristics of Watercolors Watercolor painting has a set of unique characteristics that differentiates it from other mediums like oils or acrylics, these characteristics not only define the physical and aesthetic properties of watercolor paints but also affect the techniques artists use in their work. Watercolors are known for their transparency, opacity, granulation, liftability, lightfastness, and ease of blending which we will explore in detail: Opacity The opacity of watercolors refers to how capable a paint is to cover what’s beneath it, or how much coverage a paint has. As we know, watercolors are naturally translucent, however, pigments are not all made the same way. Some pigments are naturally more opaque than others, like Cadmium-based pigments which are much more opaque than Quinacridone-based pigments. Another thing that influences the opacity of watercolors is the paint concentration. Paint that comes straight out of the tube will be much more opaque than diluted paint from a pan. In contrast with other mediums like acrylic, gouache, and oil paints, watercolor can’t really be considered truly “opaque”, however, some pigments do offer more coverage than others. You can “read” or find the opacity of a pigment by checking the paint’s package information, you’ll usually see something like this: Transparency Transparency, on the other side, refers to the ability of the paint to allow light to pass through it and reflect on the paper, which means any layers beneath a transparent layer of paint can easily be seen through. Transparent watercolors are much more luminous, hence better for combining new colors without losing brightness. They’re the best for layering and can be built upon, which means by applying multiple layers you can create beautiful deeper colors and play with lights and shadows. Another advantage of transparency in watercolors is the ability that these pigments have to blend optically, which means you get different colors by layering them onto each other rather than by directly mixing them. This can only be appreciated properly when experimented directly, however, this example roughly shows, how optical mixing works: Since the degree of transparency, a paint has depends more on the pigment than the medium, we can find transparent colors in acrylics, oils, and gouache too, although none of them will be as transparent as watercolors and will most likely need a diluting medium to create the layering effects inherent to watercolors. Granulation Watercolor Granulation (image via Etchr Lab) Granulation is a distinctive characteristic of watercolors, it’s an effect seen in watercolor paint when certain pigments fall into the crevices of the paper, creating a grainy texture. This happens because the pigments are heavier (denser), or irregular causing them to disperse unevenly on the paper creating a “granulation” effect. Not all watercolor pigments granulate, the effect is more notorious in pigments like Ultramarine Blue, Raw Umber, and Burnt Sienna. Synthetically-made pigments tend to granulate poorly or not granulate at all which is to the liking of some artists, however, granulation can add texture and a sense of depth to a painting, and it’s especially useful when painting natural elements like rocks, foliage, or the granular appearance of aged surfaces. While granulation is a characteristic present in water-based mediums, it’s not as noticeable nor as beautiful as it is in watercolors. Oils and acrylics don’t exhibit this characteristic since their consistency is supposed to be smooth and buttery, gouache and ink on the other side might present some granulation but it’s generally avoided since it’s not as noticeable and means inconsistency for these mediums. Staining or Liftability One of the characteristics of watercolors that directly influence the different techniques used by artists the most is the staining capability of some pigments. Staining pigments are those that penetrate through the paper’s fibers and set permanently on them (at some degree at least) leaving a “stain” on the paper that is difficult to “lift” or remove using water or brushes. Non-staining pigments, on the contrary, tend to set on the surface of the paper and can be easily lifted or lightened using water even after drying. These pigments are much more forgiving than staining pigments allowing for corrections and changes. Finer pigments tend to be more staining than larger particles and are much more durable and permanent than non-staining pigments, however, we must remember that the composition of the paper also plays a very important role in how much a pigment stains. This characteristic is not only present in watercolors but in other mediums too, although it’s not used the same way. In watercolors, the liftability of a pigment decides how workable and/or permanent they are, however in oil painting and acrylics, they define how pigments combine with other colors and how they layer on top of each other. Lightfastness Watercolor Lightfastness – (image via Jane Blundell Artist) Lightfastness in watercolors as well as in most artistic mediums refers to the ability of the paint to stay as it is through long periods of time. Paint loses intensity and vibrancy over time or when exposed to light, be it sunlight, artificial or natural light, and although the quality of the binder and the paper plays a key role in how long a painting lasts, the pigment’s quality and inherent permanence plays the most important role. Organic pigments tend to be less lightfast than pigments derived from minerals, and synthetic pigments also tend to be less lightfast than natural pigments, however, the nature of those pigments and their production process makes them much more expensive. This characteristic is present in every medium since the pigment sources tend to be the same, however, watercolors being water-based and having much less pigment concentration tend to fade faster, making it even more important for artists to choose highly lightfast pigments. What are Watercolors Made Of? Watercolors are made of three components: Pigment, Binder, and Additives, each one influences how watercolors behave how long they last, and how transparent they are. Let’s learn more about them: Pigment Pigments are basically colors in powder, these finely ground particles provide color to the paint. They come from different sources like plants, minerals, animals, and can also be made synthetically. The source of the pigments doesn’t only determine the color and hue of the paint, but also other properties like transparency, lightfastness, and staining. Mineral Pigments: These are among the oldest pigments used by humans, sourced from naturally occurring minerals and clays. Examples include ochres, siennas, and umbers. They generally have good lightfastness and a more muted, natural range of colors. Synthetic Pigments: Developed during the industrial era, these pigments are created through chemical processes. Examples include cadmium reds and yellows, titanium white, and cobalt blue. They offer bright, intense colors and usually have excellent lightfastness. Organic Pigments: Derived from carbon-based molecules, these pigments can be natural (like indigo) or synthetic (like phthalocyanine blues and greens). They offer a wide range of vivid colors. Synthetic organic pigments often have high tinting strength and good lightfastness, but some natural organic pigments may fade over time. Metallic Pigments: These include actual metal powders or pearlescent substances and are used for special effects. Binder Honey is a common watercolor binder. The binder is the substance that holds the pigment together before being activated with water and then helps it hold onto the paper afterward. While the most used binder for watercolors is gum Arabic, there are synthetically made binders that mimic the traditional gum Arabic properties but offer better consistency and longevity to the paint. Gum Arabic is a clear, colorless gum that dissolves easily in water, it helps disperse the pigment evenly and maintains the paint fluidity. In the extra ingredients, however, is where the secret of many of watercolor’s characteristics is. Two of the most used ingredients in watercolor paint-making are glycerin and honey, these are humectants, which means they help the watercolor paint retain moisture which makes the paint easier to re-wet and use after it has dried on the palette or in the pan. Honey can also add to the richness and gloss of the paint, enhancing its texture and consistency. Additives Additives are additional ingredients that are sometimes added to improve the flexibility and prevent the paint from cracking when dry. Among the most common, we find Ox gall (or similar synthetic alternatives), which is a wetting agent that helps reduce surface tension, improving the flow of the paint across the paper and its dispersion. To prevent the growth of mold or bacteria (since gum Arabic is an organic material), preservatives like phenol or urea are also added in small quantities. Common plasticizers that are also added to watercolors include certain glycols, and in student-grade watercolors, extenders or fillers (like chalk or kaolin) may be added. They bulk up the volume of the paint without adding more pigment, making it cheaper but also less intense in color. Solvents The primary solvent needed for watercolors is, well, water, which is used to control the paint flow, transparency, and consistency. When using water, you can create a wide range of values, from very dark and saturated to very light and soft. Water can also be used to reactivate the paint that has dried on your palette and your paper. Artists use this to lift color and correct mistakes, to blend other colors, or to control the intensity of the paint after it dries. While solvents are needed in other mediums to thin the paint, clean the brushes, and sometimes remove paint from a surface, watercolors only need water, taking away the health risks caused by the strong smell of the solvents and considerably reducing the messiness of the medium. Acrylic paint is also water-based, however in contrast with watercolors, acrylic becomes water-resistant once it dries, needing a solvent or a medium to be thinned or removed from the painting. What Do You Need to Make Watercolor Art? To make watercolor art you don’t need a lot of supplies, you only need watercolor paints, watercolor paper, watercolor brushes, a palette for mixing, clean water, and some accessories like masking fluid, a pencil, and erasers. But most importantly, the will and passion to learn, practice, and also, lots of patience or a heat gun to make the paint fry faster. Watercolor Paint Watercolor Paint is the first item fo the list because without it you wouldn’t be able to do any watercolor painting. But which brand? In what presentation? How many colors? Let’s first talk about the different types and grades of paint: There are different grades when it comes to art mediums, we have Student-grade paint, brushes, and even paper, which is meant to be used a lot, be it for testing different brands, thumbnailing, trying new techniques, sketching, color studies, etc. This paint is the most affordable, and easy to find but also the less durable, less lightfast, and less vibrant. Then we have Professional-grade paint. This paint is specially made to be used by professional artists in pieces that are meant to be unique, be it for selling, exhibitions, galleries, etc. This paint is much more durable, lightfast, and has the best pigment quality, however is also much more expensive and sometimes harder to find. You can find more about the different types, grades, and brands in our article: Best Watercolor Paint. Watercolor Brushes The second most important supply we need is brushes. Watercolor brushes are not like the rest, these brushes are specially designed to hold large amounts of water (and paint) for multiple washes. Although normal syn"
