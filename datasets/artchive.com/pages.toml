title = "Divisionism Art Movement: History, Characteristics, Artwork – Artchive"
full_description = "Divisionism Art Movement: History, Characteristics, ArtworkBy Artchive / July 16, 2024 July 16, 2024 Divisionism, also known as chromoluminarism, is a artistic style and technique involves the use of separate dots or patches of color that interact with each other optically. It is a distinct style evident in Neo-Impressionist painting. Divisionists felt that by requiring the observer to visually blend colors instead of physically mixing pigments, they were attaining the utmost scientific potential for luminosity and colour effects in visual arts. Neo-Impressionist artists like Georges Seurat and Paul Signac adhered to the principles of contemporary color theory. They strategically placed contrasting bits of color next to one other, which, when viewed from a distance, would merge together and be interpreted by the retina as a radiant entirety. Georges Seurat is recognized as the pioneer of Divisionism in 1884, although he was not the initial artist to employ the Divisionist style. Previous Impressionist artists such as Camille Pissarro and Claude Monet had already found that they might enhance the luminosity of their paintings by employing short, tight brush strokes and by juxtaposing specific complementary colors. George Seurat established his reputation by methodically studying the techniques employed by the Impressionists. Seeking a distinctive approach to painting that could be regarded his own, he also delved further into the study of color wheel and the works of the Romantic painter Eugène Delacroix, who was celebrated for the brilliant and vivid colors of his artworks. He also studied a range of literature on color theory from previous eras, specifically The Principles of Harmony and Contrast of Colors (1839) by Michel-Eugène Chevreul and The Grammar of Painting and Engraving (1867) by Charles Blanc. Other prominent artists who incorparated divisionism in thei artworks include Robert Delaunay, Jean Metzinger, Théo van Rysselberghe, Maximilien Luce, and Hippolyte Petitjean. Divisionism and pointillism are sometimes used interchangeably, although there is a distinction between them. Divisionism primarily refers to the underlying idea, whereas pointillism specifically specifies the painting style used by Seurat and his followers. Notable artworks employing the Divisionist method include: Les Andelys, the Riverbank (1886), The Milliners (1885-1886), The Port of Belle Isle Sur Mer (1897), Belle Île En Mer (1897), and Portrait of a Young Woman (1909). Divisionism is a painting technique where colors are not pre-mixed, but instead placed next to each other on the canvas such that they blend together visually when viewed. Pointillism is a well-known artistic approach that involves creating pictures with countless small circles or points. The decline of Divisionism occurred in the early 1910s with the emergence of newer artistic movements. The movement had a significant impact on later artistic forms, particularly shaping the development of art movements Futurism, Fauvism and Cubism. Fauvism embraced the vibrant color approaches of Divisionism, while Cubism integrated its systematic approach to deconstructing forms into separate pieces. Optical Theory Behind Divisionism Divisionism is a technique that was founded on the idea that colors can be divided into discrete dots or strokes of pure color, rather than being mixed together on a palette. When observed from a distance, the dots merge together in the viewer’s eye, resulting in a more brilliant and vivid effect than when pigments are mixed in the usual way. Georges Seurat’s chromoluminarism was initially influenced by Charles Blanc’s book, Grammaire des Arts du Dessin. Blanc explained that optical mixing, or mixing colors with the viewer’s eyes, produced more vibrant and pure color effects than the conventional method of pre-mixing pigments before applying them to the canvas. Blanc also drew inspiration from the theories of the great French painter Eugene Delacroix and the French chemist Chevreul. In his treatise “The Law of Simultaneous Colour Contrast” (1839), Chevreul himself asserted that the principle of pure colour over-mixing, where all other colors can be produced by combining primary colors, is applicable to both the combination of light colours (additive mixing) and the combination of colored pigments (subtractive mixing). Our current understanding is that this claim is largely false. Georges Seurat’s dots of pure color did not merge in the viewer’s eye, but they did create a shimmering appearance and a small enhancement of color. This phenomenon was described in Modern Chromatics (1879) by Ogden Rood. Notably, based on the collections in Paris and London, Divisionist paintings demonstrate exceptional durability in terms of color and composition. Divisionism vs. Pointillism Divisionism refers to this division of color and its optical effects, whereas Pointillism is the term used to describe the process of applying dots of color. Divisionism does not necessarily rely on the “dots” that pointillism does, and could instead use tiny brushstrokes of pure color. Divisionism and Pointillism are often used interchangeably, as their differences are subtle. Characteristics of Divisionism Art The major characteristics of Divisionism art are scientific approach, optical color mixing and vibrant luminosity. See below for an explanation of each: Scientific Approach Divisionist artists were greatly influenced by scientific theories regarding color perception. Applying the colors separately carefully onto the canvas led to a more intense color (as per the theory), and the outcome was believed to be less dull compared to if the colors had been mixed in the traditional manner on an artist’s palette. Painting a Divisionist artwork using dots or distinct brushstrokes required a great deal of discipline and attention to detail. Divisionism is founded on scientific theories of color and perception, including those put out by Michel Eugène Chevreul, a scientist who examined the optical properties of adjacent colors. Optical Color Mixing Optical color mixing occurs when a viewer’s perception of color in an image is influenced by the presence optical mixture of two or more colors that are positioned in close proximity to each other.The apparent color is not naturally present on the surface.However, the color that the observer perceives is determined by the combination of the colors present on the surface. Divisionism is based on the theory of optical color blending, where small, separate dots or patches of pure color are applied in close to each other. When observed from afar, the viewer’s eye merges these colors, resulting in the intended colour and brightness. Vibrant Luminosity The significance of light was paramount among the painters who embraced the divisionist approach, as well as its impressionist predecessors. While the impressionists sought to capture the authentic natural essence of light by painting outdoors (Plein air painting), neo-impressionist artists frequently worked in their studios, employing a scientific approach to organizing colors on canvas. Divisionism seeks to attain a heightened level of luminosity and vibrancy in paintings by bypassing the monotony that might arise from physically mixing pigments. The colors seem deeper and more vivid. The artwork is more realistic and dynamic because pure, unmixed colors are better at capturing the effects of natural light. History of Divisionism Divisionism, a technique of placing individual dots of pure color on a canvas in a way that creates the illusion of combining and enhances the brightness of the colors, was initially developed by Impressionist artists such as Claude Monet (1840-1926) and Camille Pissarro (1830-1903). They utilized this technique as one of their instinctive painting methods to capture the transient colors that are present in the reflection of sunlight. However, it was not until 1880 that Georges Seurat initiated a study of technical treatises on color theory in painting, specifically focusing on chromoluminarism and optics. He deliberately undertook the task of scientifically creating the kind of shimmering color effects that artists like Monet had previously achieved through chance and inspiration. This marked a significant advancement in systematic progress. In contrast to the Impressionists, who mostly employed plein air painting to depict the fleeting qualities of light, Seurat mainly executed his artwork within the confines of his studio, carefully planning every aspect in advance. A Sunday Afternoon on the Island of La Grande Jatte – Seurat, Georges – 1884-86 The origins of Divisionism, as well as the broader Neo-Impressionism style, can be traced back to Georges Seurat’s renowned artwork, “A Sunday Afternoon on the Island of La Grande Jatte.” Seurat underwent formal instruction at the École des Beaux-Arts, which influenced his early artworks to exhibit the Barbizon style. In 1883, Seurat and his colleagues initiated an exploration of techniques to effectively convey a maximum amount of colored light anywhere on the painting. In 1884, the artist showcased his first significant artwork, “Bathing at Asnières,” along with smaller paintings of the island of La Grande Jatte. These works demonstrated his growing familiarity with Impressionism which used more precise geometric shapes. However, it was not until 1886, when he completed “La Grande Jatte,” that he fully developed his theory of chromoluminarism. Initially, La Grande Jatte was not painted in the Divisionist style. However, the artist later modified the famous painting during the winter of 1885-86. He improved its optical characteristics based on his understanding of scientific ideas on color and light. The theories of Georges Seurat captivated other painters of his time, as they sought to counter the influence of Impressionism by joining the Neo-Impressionist movement. Paul Signac emerged as a prominent advocate of divisionist philosophy, particularly following Seurat’s demise in 1891. Signac’s book, titled D’Eugène Delacroix au Néo-Impressionnisme, was released in 1899 and is credited with introducing Divisionism. It is widely regarded as the definitive manifesto of the Neo-Impressionist movement. French Divisionism French painters such as Camille Pissarro, Lucien Pissarro, Charles Angrand, Albert Dubois-Pillet, Henri-Edmond Cross, Maximilien Luce,and Hippolyte Petitjean also incorporated Divisionist techniques into their work, often through their involvement in the Société des Artistes Indépendants. Furthermore, Paul Signac’s promotion of Divisionism has had an impact on the artistic creations of Vincent van Gogh, Henri Matisse, Jean Metzinger, Robert Delaunay, and Pablo Picasso. In 1907, the critic Louis Vauxcelles identified Metzinger and Delaunay as Divisionists who employed sizable, mosaic-like ‘cubes’ to create compact yet profoundly significant artworks. Both painters had pioneered a novel sub-style that held immense importance shortly afterwards in the context of their Cubist artworks. Italian Divisionism The impact of Seurat and Signac on certain Italian painters became apparent at the First Triennale in 1891 in Milan. Initiated by Grubicy de Dragon and later formalized by Gaetano Previati in his 1906 work “Principi scientifici del divisionismo,” a group of painters primarily in Northern Italy conducted varying degrees of experimentation with these methods. Pellizza da Volpedo employed the technique to depict social (and political) themes; Morbelli and Longoni also embraced this approach. Pellizza created several Divisionist paintings, including “Speranze deluse” in 1894 and “Il sole nascente” in 1904. Divisionism garnered significant support in the realm of landscapes, with notable proponents such as Giovanni Segantini, Gaetano Previati, Angelo Morbelli, and Matteo Olivero. Additional artists who embraced the painting genre of subjects were Enrico Lionne, Plinio Nomellini, Giuseppe Cominetti, Rubaldo Merello, Camillo Innocenti, and Arturo Noci. Divisionism exhibited a significant impact on the artistic creations of Futurists Giacomo Balla (Arc Lamp, 1909), Carlo Carrà (Leaving the scene, 1910), Gino Severini (Souvenirs de Voyage, 1911), and Umberto Boccioni (The City Rises, 1910). Northern European Divisionism Théo Van Rysselberghe, a Belgian Impressionist, was greatly impressed by Georges Seurat’s masterpiece, A Sunday Afternoon on La Grande Jatte when he encountered it in Paris in 1886. He, along with a cohort of other earlier impressionist painters such as Georges Lemmen, Xavier Mellery, Willy Schloback, Henry Clemens van de Velde, Alfred William Finch, and Anna Boch, brought the style to the Belgian art community, imposing a substantial effect. During his trips to Morocco, the artist produced several pointillist landscapes. However, it was his 1888 Portrait of Alice Sethe that became his most iconic and representative work. His influence led to the incorporation of portraiture as a prominent element in Belgian Neo-Impressionism. Piet Mondrian, Jan Sluijters, and Leo Gestel, all from the Netherlands, pioneered a comparable mosaic-like Divisionist method around 1909. The Futurists subsequently incorporated the style, partially influenced by Gino Severini’s time in Paris from 1907, into their vibrant paintings and sculptures. Divisionism influence on Futurism The Italian Futurists were greatly influenced by Georges Seurat’s ability to convey physical movement in his paintings. In 1909, the Futurist Manifesto was released and lauded speed and industry as the epitome of the aesthetically pleasing and innovative characteristics of the emerging contemporary industrial society. The Futurists adopted Seurat’s concepts to develop their own signature style. In the article “The (R) Evolution of Modern Italian Painting: Divisionism and its Influence on the Futurist Avant-garde” (2017), Hanstein and Chytraeus-Auerbach, state that the Futurists went beyond simply juxtaposing dots of colors or points to achieve optical blending, they extended this idea to include lines, curves, and forms. By painting multiple images of identical forms inside their compositions, they suggested the dynamic motion of machinery, individuals, and animals. For more info see our full guide on the Futurism Art Movement. Divisionism Artists Major Divisionist artists discussed include: Georges Seurat, Paul Signac, Théo van Rysselberghe, Maximilien Luce, and Hippolyte Petitjean. See below for more information on these artists: Georges Seurat Artist Name: Georges Seurat Born: December 2, 1859, Paris, France Died: March 29, 1891, at the age of 31 Paris France Most Known Divisionism artworks: A Sunday Afternoon on the Island of La Grande Jatte, 1884-1886 Bathers at Asnières, 1884 The Lighthouse at Honfleur, 1886 Georges Pierre Seurat was a French artist who belonged to the post-Impressionist movement. He developed the aesthetic position called pointillism and chro"
