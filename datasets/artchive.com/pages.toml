title = "Pottery and Ceramics in Art: History, Artists, Artwork – Artchive"
full_description = "Pottery and Ceramics in Art: History, Artists, ArtworkBy Artchive / February 12, 2024 February 17, 2024 Pottery is the art and craft of shaping clay and firing it at high temperatures in a kiln. The place where such wares are made by a potter is also called a pottery. The end result of the pottery process is called a ceramic. Humans have been making ceramics for thousands of years, and it has been a significant part of human history, culture, and civilization. Pottery has been used as a functional art form and a source of aesthetic pleasure since the beginning of human history. Numerous practical artworks have been created throughout the years, including bowls, jars, cups, and plates. Everybody utilizes these everyday items for eating, drinking, cooking, and storing food regularly. Pots are vital in ceremonial and religious activities in many different civilizations. For example, pottery in Native American was utilized in ceremonies and rituals, and in ancient Greek it was used in burial rites. Important details about historical civilizations and individuals from items made. There is much to be discovered about the beliefs, practices, and aesthetic tastes of people worldwide and throughout history by examining the ceramics they have produced. In archaeology, especially of ancient and prehistoric periods, it often means vessels only, and figures of the same material are called “terracottas.” End applications encompass a wide range of products, from dinnerware and decorative pieces to sanitary ware and electrical insulators used in technology and industry. Clay is a readily available substance resource. Potters only employ clay with a specific range of qualities even though many distinct varieties of clays exist. Among the most crucial characteristics of usable clays are plasticity—the capacity to be shaped without breaking or cracking—its ability to withstand firing at temperatures high enough to convert raw clay into ceramic without distortion, and its repeatability—the capacity to yield consistent results when treated in the same way, allowing potters to create the objects they desire regularly. Clay is composed of relatively weak and porous fragments with fine grains. The process of combining clays with additional minerals yields a workable clay body. Sintering is a part of the firing process. This heats the clay to a temperature where the particles flow together and partially melt, forming a strong, single mass made of crystalline material and a glassy phase scattered with pores. The material shrinks significantly due to the pores getting smaller during the fire process. Clay is made up of degraded igneous rock and is classified into primary and secondary. Secondary clay has displaced from the original parent rock’s location due to land movement or water erosion. Primary clay has remained at the location of the parent rock. Minerals, such as iron oxide, small quantities are absorbed by clay during its movement and serve as a flux. Flux refers to any substance capable of reducing the melting point of another. The amount of minerals that clay absorbs decreases with distance from the location of its parent rock, which lowers the temperature required for burned clay to become nonporous which is a durable form. The three categories of pottery that are often distinguished are earthenware, stoneware, and porcelain. They can all be glazed or unglazed and decorated by various techniques.. All of these categories of historic are frequently divided into two categories: “fine” wares, which are typically more costly, well-crafted, and reflect the aesthetic preferences of the culture in question; or “coarse,” “popular,” “folk,” or “village” goods, which are typically more plainly embellished or just plain produced. Pottery has a long and rich history that dates back to prehistory. Archaeologists have found ceramics in China that date from approximately 20,000 B.C. Clay was rolled, forming vessels, which were then smoothed using a tool or the potter’s hand. After that, the clay pieces were burnt over an open flame to solidify them. The Industrial Revolution of the 19th century brought mass production and machinery, which profoundly impacted the industry. Shio Kusaka, Edmund de Waal, Betty Woodman, Ron Nagle, and Grayson Perry are among the most well-known potters. What is Pottery in Art Pottery is a fundamental art medium valued for its adaptability, robustness, and expressive potential. Pottery can take on many forms in artistic contexts, from simple, functional vessels to complex sculptures. Clay’s tactile quality encourages artists to work with it, transforming it into useful objects with symbolic, artistic, and cultural value. Artists convey stories about heritage, identity, and craftsmanship through this craftsmanship. Chinese artists wanted to express the relationship between people and nature. Types of Pottery The main types of pottery include: earthenware, stoneware and porcelain. They differ in terms of strength, color, temperature of firing, and common use cases. See below for more information: Earthenware Earthenware was first created approximately 9,000 years ago. It is still commonly used in the twenty-first century. Clay was first burned in pit fires or open bonfires at low temperatures. They were undecorated and formed by hand. Earthenware is burned at temperatures lower than 1200°C, though it can be fired as low as 600°C. The color of the earthenware body ranges from gray to black and buff to dark red. It can be manufactured from a wide range of clays, some of which burn to a buff, brown, or black color, giving the reddish-brown coloration due to iron in the constituent minerals. Terracotta refers to reddish-colored variants, particularly when used unglazed or for sculpting. Common names for tin-glazed pottery include majolica, faience, and delft. If the clear-glazed body is a cream colour, it is called creamware . Pottery has become more popular and useful due to the invention of ceramic glaze, which created impermeable pieces. Over time, decoration has changed and progressed. Since most commercial wares made in the second half of the 20th century was heat- and cold-proof, it could be used for serving, freezing, and cooking. Unfired earthenware body is more plastic than most whiteware body, making it simpler to form using a RAM press, roller head, or potter’s wheel than porcelain or bone china. Fired body absorbs between 5 and 8% of water on its porosity. Hence, it needs to be glazed to be waterproof. Stoneware Stoneware pottery is stronger than earthenware pottery, and impermeable to liquids. It is fired in a kiln at a temperature between 1,100 and 1,200 degrees Celsius. Stoneware material is extremely durable and, while occasionally translucent, is typically opaque. The body might be red, brown, gray, white, or black, among other colors. Tableware and decorative items like vases are examples of end applications. Despite being dense, impermeable, and tough enough to withstand a steel point’s scratch, stoneware is not the same as porcelain since it is typically only partially vitrified, and is more opaque than porcelain. Stoneware can be semi-vitreous or vitreous. Because of imperfections in the clay used to manufacture it, it is typically glazed and has a grey or brownish appearance. China began producing fine white stoneware during the Shang dynasty at approximately 1400 BCE. Stoneware was initially produced in Japan in the Kamakura period of the 13th century and in Korea during the Silla dynasty (57 BC–935 CE). In the sixteenth century, Germany was the first country in Europe to produce stoneware. Originally brought to Europe from China in the 17th century, tea came in chests accompanied by red stoneware pieces from Jiangsu province’s Yixing kilns. England, the Netherlands, and Germany all imitated this product. Porcelain Porcelain is vitrified, white, finely grained, and typically translucent. To manufacture porcelain, ingredients—typically kaolin—are heated in a kiln to temperatures between 1,200 and 1,400 °C (2,200 and 2,600 °F). This temperature is higher than that utilized for the other varieties, and it took some time to figure out what materials were required to reach these temperatures. Compared to other pottery forms, porcelain is more robust, translucent, and strong than other ceramics because of vitrification, which occurs when the body reaches exceptionally high temperatures and forms the mineral mullite. There are three primary varieties of porcelain: true or hard-paste, artificial or soft-paste, and bone china. The first known forms of porcelain first appeared in the Tang dynasty (618–907) and later in the Yuan dynasty (1279–1368), when it became popular in the West. True, or hard-paste, porcelain was created by pulverizing petuntse —a feldspathic rock—and combining it with kaolin, or white china clay. The petuntse was vitrified during the firing process at roughly 1,450 °C (2,650 °F), and the kaolin helped to keep the object’s shape. The development of artificial, or soft-paste, porcelain—a mixture of clay and crushed glass—required a “softer” burning (about 1,200 °C, or 2,200 °F) than hard-paste porcelain as a result of attempts by potters from Europe in the Middle Ages to replicate this translucent Chinese porcelain. History of Pottery Before they began farming, people in East Asia, specifically in China and Japan, made clay ceramics circa 14,000 BC. Ceramic pieces like the Gravettian culture Venus of Dolní Věstonice figurine have also been found in the Czech Republic dating back to 29,000–25,000 BC. The first items were hand-modeled with the thumb and finger. Square or oblong bodies were created by lutening flat slabs of clay together with clay slip as an adhesive. The slabs could also be shaped into a cylinder and given a flat base using the same technique. Coiled pottery was an early development where one would poke a hole into a ball of clay or form a long clay snake and coil it into the shape of a pot. Pottery in Africa By the 9000s BC, people in Niger, West Africa, began making pottery. It’s possible that Africans began creating pottery as a secure means of storing grain. However, they also made fermented fish sauce, just like the people of Japan. Pottery in the Americas Several thousand years later, pottery production most likely started for the same reason in the Americas. In Brazil circa 5500 BC, ceramics were made by people who consumed a lot of fish and shellfish. Perhaps they also fermented fish in ceramic jars to preserve it. People started employing pottery further north from Brazil. By approximately 4500 BC, the fish-eating ancestors of the Cherokee and other Mississippians in what is now Florida and Georgia mastered the skill of pottery-making. Ceramics was first made at the same time by people on the Pacific coast of South America. Pottery in West Asia and Europe Around 6000 BC, pottery use also moved west from East Asia, spreading to Mesopotamia, the Eastern Europe, and North Africa. It’s possible that when West Asians first began farming, they began creating pottery to store grain and ferment fish. About 5000 BC, pottery was brought to Greece. Potters were still considered artisans during the period, but the Greeks were recognized for turning pottery into an art form. Their more advanced method pressed and shaped the clay body into molds of fired clay. Primarily designed for pouring and consuming or storing olive oil and wine, their vases and pots were functional in design. These artists adorned their vases with Greek mythological figures and were the first to try coloring the clays with other naturally occurring substances like potash and ocher. The slow wheel The slow potter’s wheel was first used by people in West Asia in 3000 BC, at the start of the Bronze Age. Instead of having to stand and walk around the pot, they could rotate it while working on the slow wheel, which was a movable platform. The small wooden platform served as the foundation for the pot. A ball of clay is placed in the centre of a turntable, which the potter rotates with a stick, with foot power. The fast wheel Like the slow wheel, the fast wheel also had a platform, but it rotated like a toy top on an axle. A skilled potter can create a nearly identical pot every minute or so on the fast wheel. Because it’s faster than coiling or the slow wheel, artworks are now far less expensive than they were previously. The artists were either enslaved or children —as seen by the tiny fingerprints on the pot to manufacture pottery at an even lower cost. During this period, the Yamnaya migrated to Greece, Italy, and China, bringing the concept of the fast wheel. The next significant advancement in pottery was the introduction of porcelain by Chinese potters in the Han Dynasty around 600 A.D. White kaolin clay and powdered granite were added, and the mixture was fired at extraordinarily high temperatures to make these delicate and artistic pieces that are now known as bone china. Because it was so costly to ship, West Asian potters created lead glazes to resemble porcelain. Soon after, potters in Europe used the same technique, producing vibrant glazes for their ceramics. Earliest Dateable Clay Shards The oldest pottery fragments in the world have been determined to be 20,000 years old. They were discovered in the Xianrendong cave in the Jiangxi province of south China. Research has uncovered evidence linking East Asian pottery mounds to a time over 15,000 years ago, debunking popular belief that pottery development coincided with humanity’s transition from hunter-gatherers to farmers some 10,000 years ago. Persian Pottery Persian ceramics have a long history, beginning in the early Neolithic Period, or 7th millennium BCE. Clay, water, small quantities of straw, and other plants made the artworks. These components combined created an extremely solid paste that served as the foundation for constructing all Iranian pieces. Earthenware continuously adopted geometric patterns thus creating a more sophisticated decorative style. Alongside the development of this more advanced style, a greater range of ceramic types were produced. Vessel manufacturing quality improved with the invention of the potter’s wheel around the fourth millennium BCE. Better-quality, symmetrically shaped items were made using this table. Susa and Uruk Susa was an integral part of the cultural milieu of the Sumerian Uruks throughout the Uruk period. Susa is home to proto-writing, Sumerian-inspired cylinder seals, massive buildings, and a replica of Uruk’s whole governmental apparatus. Since Uruk and Susa are related, the periodization of Susa and Susa II (3800–3100 BCE) corresponds to Uruk’s Early, Middle, and Late periods. The Susa style originated in the highlands of western Iran and was heavily influenced by modern and historical ceramic enterprises. Three vessels frequently appear near one another: a serving plate, a small jar, and a dri"
