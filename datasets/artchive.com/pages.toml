title = "50 Famous Ceramic Artists You Should Know About – Artchive"
full_description = "50 Famous Ceramic Artists You Should Know AboutBy editor2 / February 17, 2024 February 18, 2024 Ceramics are materials made by heating and cooling natural and synthetic materials, primarily clay, at high temperatures to achieve desired properties such as hardness, durability, and resistance to heat and corrosion. Pottery is the process of handcrafting of useful or ornamental products from clay and other materials. Pottery has been produced for thousands of years by numerous cultures around the world. Ceramics have been used as an art medium since ancient times. Today, many modern ceramic artists continue to use pottery to create unique and meaningful artwork. We’ve list 50 of the most famous ceramic artists below, enjoy! 1. Grayson Perry Born: 24 March 1960, Bicknacre, Chelmsford, Essex, England Nationality: British Notable artwork: Modern Family, 2014 Jane Austen in E17, 2009 The Rosetta Vase, 2011 Grayson Perry is a contemporary English artist, writer, and broadcaster. In addition to his cross-dressing, tapestries, and ceramic vases, he is well-known for his criticism of British “prejudices, fashions, and foibles” and his assessments of the contemporary art world. Perry creates vases with classical shapes and vibrant color schemes that portray subjects that contrast with their appealing exteriors. Perry has also worked with video, performance, printmaking, sketching, embroidery, and other textile media. Perry frequently uses mediums like weaving and ceramics, which are typically ranked lower in the hierarchy of arts than sculpture and painting. Greek pottery and folk art are among the many ceramic traditions that Perry alludes to in his work. He uses a traditional way of coiling to create his vessels. The majority feature intricate surfaces that use a variety of methods, such as “glazing, incision, embossing, and the use of photographic transfers,” which call for multiple firings. He adds sprigs—small relief sculptures adhered to the surface—to some of them. Grayson Perry’s ceramics are distinct from craft pottery due to their complexity and high skill requirements. It has been argued that these techniques are employed to provide meaning rather than only for cosmetic impact. Perry questions the implicit belief in the craft tradition that pottery is only functional or ornamental and is incapable of expressing ideas. He employs a “guerrilla tactic” of combining several approaches, using the approachable medium of ceramics to provoke thought. 2. Ron Nagle Born: February 21, 1939, San Francisco, California, U.S. Nationality: American Notable artwork: Drawing 9 (2011) Memory (2005) Sandintrance (2005) Gaslighting (2018) Ron Nagle has been a ceramicist for more than fifty years. He has worked a great deal with the vessel typology, particularly the cup, pushing past traditional craft’s utilitarian concerns into formal analysis of the material. His small-scale, intimate sculptures frequently combine several parts and a variety of methods and materials, such as polyurethane, wax, epoxy, scalp-metal, hand-molding, airbrushing, conventional and non-traditional glazing, and slip-casting. He can create forms that are more expansive than what clay can hold, thanks to these artificial materials. Drawing is an essential part of Nagle’s process, and he approaches his work from a flat, two-dimensional perspective. This is consistent with his expressed interest in painting, for which he lists Billy Al Bengston, Cy Twombly, and Giorgio Morandi as influences. The California Clay Movement is linked to Nagle’s art, and he frequently appears in exhibitions featuring Abstract Expressionism. While Nagle has avoided being associated with the conventional ceramics trade, he has acknowledged the influence of modern ceramic sculptors like Kenneth Price and Japanese Momoyama ceramics, as well as 1940s American restaurant utensils. 3. Betty Woodman Born: May 14, 1930 Died: January 2, 2018 (aged 87) Nationality: American Notable artwork: Liquid Platter, base and cup, (1981) On the Way to India (1988) Pillow Pitcher, and Flower Vase (1993) Betty Woodman was a renowned American ceramic artist. Woodman started as a production potter in the 1950s. Her works ranged from large-scale paintings explicitly created for a site to fragmentary columns and floor pieces that resembled carpets. She frequently used a disassembled version of the conventional clay vessel. Her unabashed pursuit of aesthetic pleasure and her embodied readings of various ancient and modern art historical traditions established her as a brazenly contemporary character whose work is illuminating in talks about gender, modernism, craft, architecture, and domesticity. After her daughter passed away in 1981, Woodman’s career changed as her work transitioned from functional pottery to more abstract art. Woodman successfully persuaded Boulder municipal officials to fund the Pottery Lab in the 1950s, establishing it as one of the earliest recreational pottery programs in the United States. Her goal was to encourage students to pursue careers in pottery making in addition to doing it for leisure. The establishment of the Pottery Lab led to the construction of about 100 kilns in the Boulder region. 4. Edmund de Waal Born: 10 September 1964, Nottingham, United Kingdom Nationality: British Notable artwork: Certosa III, 2015 Elegie, 2000 Lidded jar, 1997 Edmund Arthur Lowndes de Waal is an English novelist, potter, and modern artist. He is renowned for his expansive installations of porcelain vessels, frequently made in reaction to archives, collections, or the local history. Edmund de Waal started producing his unique porcelain pieces with a celadon glaze 1993. Focusing primarily on classical vessel shapes, de Waal’s pots gradually caught the eye of the British craft industry, leading to his first exhibition at Egg London in 1995. These pots featured subtle variations in tone and texture, as well as indentations or pinches, in the style he developed while living in Japan. De Waal’s ceramic work was greatly influenced by modernism, specifically the Bauhaus movement, in the late 1990s and early 2000s. As a result, de Waal came to believe that the materiality of porcelain may serve as a bridge between the East and the West, with the modernist ethos of the Bauhaus perhaps colliding with the ethos of China’s Song dynasty. Since 2000, de Waal has shifted his focus from creating and displaying individual domestic vessels to creating groups of vessels and objects meant to be viewed in relation to openings and spaces. Later, he moved into wall-mounted and freestanding vitrines that are primarily filled with various quantities of his porcelain vessels, and most recently, he added various metals, metallic gilding, porcelain shards, and porcelain sheets with handwritten inscriptions. 5. Shio Kusaka Born: 1972 Nationality: Japanese Notable artwork: Three Triangle vase Three pot grouping Dinosaur 31 (2016). Shio Kusaka is a ceramic artist who lives and works in Los Angeles. Kusaka learned to thoroughly examine vessels as a child by growing up in Japan and participating in her grandmother’s tea ceremonies. She came to Los Angeles in 2003, having graduated with a BFA in painting from the University of Washington in Seattle, and concentrated on clay work. Drawing and sculpture are combined by Kusaka, who usually switches between abstraction and representation. Through the use of shape, pattern, colour, and glazing processes, she has created a unique formal language that draws inspiration from the wall drawings of Sol LeWitt, the Eighteenth Dynasty of Egypt, and Japanese ceramics from the Yayoi period. From line patterns, grids, and dots to the more whimsical watermelon, strawberry, and dinosaur vessels, Kusaka is always visible while creating the pieces. 6. Tony Marsh Born: 26 May 1954, New York, United States Nationality: American Notable artwork: Spill and Catch, 2022 New Moon Jar, 2022 Neo-Crucible, 2022 Tony Marsh is a ceramicist who has spent the last thirty years honing his craft on non-functional ceramic vessels. Marsh is committed to his work as an educator and an artist. From the bright and glossy glazes of Marsh’s Spill and Catch pieces to the topographic and highly textured surfaces of his Cauldrons and Crucibles series, his ceramic forms over the past twelve years are the result of his extensive research into the behavior of ceramic materials and thermal challenges. Marsh’s vessels examine the incredibly transformative character of these materials by offering a debate between gravity and the flow of molten elements through cycles of heating and cooling, figuratively referring to geophysical research and artistic forms of production. Since he doesn’t take notes during his technique, each piece is an original creation resulting from numerous firings and the haphazard addition or elimination of surface materials. 7. Kathy Butterly Born: 1963, Amityville, New York, United States Nationality: American. Notable artwork: I Need A Minute, 2020 Small pitcher, 1993 Rabbit Hole, 2011 Kathy Butterly has been creating unique, expressive sculptures for over two decades, contributing to and developing the studio’s ceramics heritage. Butterly addresses a variety of ideas in her work, from materiality and line to the vessel’s history. She begins with classic ceramic forms, which she refers to as “canvas.” Butterly distorts and misforms these forms in ways that lean toward the iconoclastic. She then continues to glaze the pieces, sometimes going so far as to create more volume, and fires them again. Both enticing and startling are the hues and textures Butterly selects and how they interact with one another. Her peculiar shapes and unexpected color choices frequently elicit a visceral response and an unsettling awareness in the spectator. Every sculpture created by Butterly is distinct and intricate. She avoids creating large-scale pieces, instead opting to create concise, snappy pieces that convey a diverse range of emotions. These sculptures radiate fierce and rebellious originality, whether rising, collapsing, robust, or teetering. By highlighting the figurative undertones in the vessel shape, Butterly enables the observer to connect with her works on a personal and relatable level. These sculptures’ unique, multifaceted identities give the pieces a purpose. 8. Akio Takamori Born: October 11, 1950, Nobeoka, Japan Died: January 11, 2017 (aged 66) Nationality: Japanese-American Notable artwork: Owl, 1985 Woman, 1984 Summer of ’92 Vase, 1992 Akio Takamori was a pioneering figure in ceramic art, and his work over the last thirty years has had a lasting impact on Pacific Northwest arts and the medium itself. His art frequently draws autobiographically from his experiences growing up in Japan, his family, and mythological themes. He is renowned for creating figurative sculptures out of coils where the narrative painting defines the form. Takamori engaged with the history of both Eastern and Western aesthetics to investigate themes of cultural identity. His body of work is characterized by bold shape and color and is incredibly expressive of human emotion. 9. Jami Porter Lara Born: 1969, Spokane, Washington, United States Nationality: American Most famous artwork: LDS-MHB-2LBR-0917CE-KS, 2023 Go On Now (Medium Rattle 2), 2022 TLD-MHB-AABR-0822CE-01, 2022 Jami Porter Lara is a conceptual artist intrigued by the ability of commonplace things, routines, and movements to mold and transform our environment. She challenges notions of what is natural, prominent, or common sense for subtexts and erasures using a wide range of formal techniques, including ceramic sculpture, sign-making, lithography, drawing, sewing, and embroidery. She frequently uses friction between form and material to suggest what may be meant but not said or heard. Her area of research is how people normalize human political constructions through their perception of what is natural. Porter Lara employs methods derived from those that the Mata Ortiz potters in the area used more than 2,000 years ago to make vessels. She takes the unprocessed clay out of the ground, slaps it, filters it, and dries it until it becomes usable. She utilizes clay coils to construct the containers, polishes the pieces with a stone, and then fires them using a reduction method in a backyard pit covered in a galvanized aluminum tub. Keep oxygen and fires away from the pottery during the reduction process. The piece is surrounded by sawdust and newspaper, which releases carbon that combines with the clay to turn the containers black. 10. Andile Dyalvane Born: 1978, Qobo-Qobo in the Eastern Cape. Nationality: South African Notable artwork: Ihobo-hobo (Cape Weaver Bird), 2023 iBubu (Flock), 2022 iNgqweji (Nest), 2022 Andile Dyalvane is a well-known ceramic artist from South Africa. Driven by a profound spiritual bond with his Xhosa ancestors, Dyalvane uses intricate, expansive ceramic creations as a symbolic medium to honor his ancestral customs and communicate his recovery process. He is able to interact with and respond to his cultural heritage via his art. In particular, Dyalvane can make objects that are both aesthetically pleasing and useful with clay. Through the creation of custom-made, handcrafted, collectable objects, Andile Dyalvane’s studio enables him to experiment with and blend a variety of materials and processes. Frequently, ceramics are mixed with materials like wood and glass to create a finished piece that is functional. Every endeavor begins with a line—a straightforward line that honors the present, links him to the past, and serves as a reminder to himself that he must leave a legacy for future generations. This “line” translates from isiXhosa to “camagu,” which means thankfulness. Dyalvane thinks there are countless connections between him and his ancestors. Andile Dyalvane develops and creates pieces that are embellished with abstract patterns and human forms, drawing on memories and visuals from his boyhood in the country and his adult life in the city. Every symbol and hue has a specific significance. Each hue and pattern of Dyalvane’s expertly created sculptures has significance. 11. Shawanda Corbett Born: 1989, New York, New York Nationality: American Notable artwork: Hey, it’s all about you, 2020 What took you so long, 2021 You don’t have to pretend, 2021 Shawanda Corbett is a performance and ceramic artist whose body and architectural ceramics explore the concept of a “complete body” and convey many viewpoints from various cultures, times, and places. Her items are coated in brilliant, shiny colors and have curvatures that are created by the clay’s interactions with the artist’s body. Shawanda examines the notion of a “complete body” in her work, employing cyborg theory to explore the various stages of a person’s existence. Corbett grounds theory in reality by drawing on her experience as a disabled woman of color. The theory of cyborgs aims to blur the "
