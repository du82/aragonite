full_description = "Content ideas & inspiration for your library newsletter Posted on September 16, 2022 by ArtefactoIt’s no secret that we ❤️ newsletters and library newsletters can come in quite a few different flavours. In this second post in our series to mark 200 issues of Newslet, our own library newsletter, we wanted to recognise some of our favourite examples and explore how they produce content that keeps their audiences engaged. […]Continue Reading… Five for friday – AI-generated images that you can use Posted on September 2, 2022 by ArtefactoAn experiment in using AI and automated image tools to create usable images for blog posts, social media and other common use cases. When you’re sharing content or promoting services, it’s always useful to have a collection of images to use. We’ve been pondering some alternatives to the sometimes frankly meh stock images available and […]Continue Reading… Our 7 top tips for publishing awesome library newsletters Posted on July 29, 2022 by ArtefactoA high-quality, targeted newsletter can help you connect with your audience and increase engagement with your library. At Artefacto, we publish a few different kinds of newsletters including an international CPD newsletter for libraries as well as specialist newsletter products for clients. In this post, we wanted to bring together some of the best practices […]Continue Reading… Five for friday – Neat ways to promote and share digital collections Posted on June 17, 2022 by joFive or so links from around the web about new and interesting applications of technology Online archives and digital collections have made library collections much more accessible of late, and the Covid-19 pandemic has accelerated the digitisation programs of many institutions. And, even better, more and more digital collections are being published and shared openly. […]Continue Reading… Free Makerspace Starter Guide for Libraries Posted on May 23, 2022 by joAll of us here in the Artefacto team are creative technologists, makers or artists of some kind, so the concept of makespaces as creative spaces for learning and collaboration has always been appealing to us. Makerspaces are many things to many people. They can be permanent, temporary, stationary or mobile. They come in different shapes, […]Continue Reading…"
