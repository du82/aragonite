["https://artefacto.org.uk/case_studies/orchlab-collaboration-platform"]
title = "OrchLab Collaboration Platform - Artefacto – Digital Agency"
description = "OrchLab is a collaboration between the London Philharmonic Orchestra and Drake Music, offering creative music workshops in Leonard Cheshire Disability centres throughout the London area as well as a…"
full_description = "OrchLab Collaboration PlatformPosted on November 18, 2019 by ArtefactoOrchLab is a collaboration between the London Philharmonic Orchestra and Drake Music, offering creative music workshops in Leonard Cheshire Disability centres throughout the London area as well as a wider community engagement programme.Artefacto worked closely with the project partners to develop a private collaboration platform that prioritises the easy sharing of OrchLab content via an ‘activity stream’ that supports multimedia content (including video and audio) and easy content creation. Members can share and comment, like posts, and join groups. Group owners can invite new users and manage access to their group, while site administrators can manage the wider site settings.The website provides a clean, easy to use interface for discovering shared learning resources from the project.An important part of the project is the online platform that provides a way for project participants and staff to learn about the project and share their work, including lesson plans, activities and video content.Some key features of the platform include:Responsive web design that is fully functional on all devicesSupports the uploading and playback of video and audio files in different formats.Easily embed videos from youTube and Vimeo by pasting in the URLModular permissions and access management to organise content into groups for the different Centres involved in the projectInteractive learning resources, including Orchestra map and online music sampler/instrument.During 2020 we worked closely with the London Philharmonic Orchestra to develop a new discovery and membership platform to support the next 3 year programme for the OrchLab project running between Jan 2020-Dec 2022 with a focus on user engagement and collaboration.This WordPress-based platform uses resource sharing, improved SEO and more community content to encourage user engagement with both the participating organisations as well as the broader community of users."
year_published = 2019
year_updated = 2022
