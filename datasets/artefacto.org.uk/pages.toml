["https://www.artefacto.org.uk/celebrating-hlisd-at-hlg-2024"]
title = "Celebrating HLISD at HLG 2024 - Artefacto – Digital Agency"
description = "We’re excited about being part of HLG 2024 talking about the Health Library and Information Services Directory (HLISD)"
full_description = "Celebrating the Health Library and Information Services Directory at HLG 2024Posted on May 29, 2024 by ArtefactoWe’re excited to be part of the upcoming Health Libraries Group Conference 2024.Kate from Artefacto will be presenting at the HLG conference, where she’ll talk about our ongoing partnership with a network of fantastic UK health libraries.Health Library and Information Services Directory (HLISD), affectionately known as health lizard🦎, is a directory for the library and information services in the health sector in the UK. It’s an important channel for library users to discover and engage with these services as well as for staff to connect with other library services. And it’s actually existed in one form or another since 1957!Since its 2018 relaunch, we’ve worked closely with the CILIP Health Libraries Group and Health Education England (now NHS England) on the HLISD. But regional and local platform editors also play a big part in keeping the platform up-to-date and accurate. And one of our favourite parts of this project is that it is collaboratively developed for and with the health libraries. The conference is another chance for us to talk to library staff and get more user feedback about the future directions and development of the platform. Check out the programme, full of amazing things happening in health libraries. Posted in Announcements, User researchTagged events"
year_published = 2024
year_updated = 2024
