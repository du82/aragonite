["https://www.artefacto.org.uk/mapping-the-cultural-stories-of-surrey"]
title = "Mapping the cultural stories of Surrey - Artefacto – Digital Agency"
description = "Surrey Cultural Lives is a platform collecting and showcasing the local stories of Surrey developed by Artefacto in collaboration with researchers from Surrey University."
full_description = "Surrey Cultural Lives: Mapping the cultural stories of SurreyPosted on August 14, 2023 by ArtefactoSurrey Cultural Lives is a location-based platform collecting and showcasing the local stories of Surrey.The site brings together contributions from a range of academics and researchers in Surrey and beyond. More locations are still being added as the map continues to grow and expand. You can read about the amazing contributors here. The platform was developed and designed by Artefacto in collaboration with Beth Palmer and Carl Thompson from the University of Surrey. The goal of the project is to foster a connection between people and their local heritage, offering a platform to uncover and share the intriguing tales that shape Surrey’s history.As you explore the map, you can delve deeper into individual stories by following the links provided below each entry. You’re also welcome to contribute your own reflections or suggest Surrey people and locations that you believe should be included.The site was built with Omeka and drawing on some of the impressive community plugins available as well as the Mapbox API. Omeka is a flexible, standards-based and open platform that provides a great basis for different kinds of digital exhibits and collection tools and is a platform we always enjoy working with. The current beta version is still being tested with different audiences and with contributors to help improve workflows and build a comprehensive cultural storymap for Surrey.Posted in Omeka"
