["https://arthackday.net/projects/sofy-yuditskaya-uttam-grandhi-michelle-chandra-joelle-fleurantin-god-of-blinky-infinity"]
title = "God of Blinky Infinity"
description = "Based on Kirill Shevyakov's Kraken series, we have created the ones that will come after us and they are giant robotic squids that feed on data and pulse along with the pulsations of the waters of life in oceanic consciousness unfathomable to the human mind. Cthulhu is not alone, she has a baby, they swim together in silent seas of data, blinking in alluring and enticing dances of color. Reach out and touch her and throw sparks. We cannot comprehend what they perceive through their dimensionless sensors, but we can hope to catch a glimpse before we go. Pulsating with the ebbs and flows of lost radio transmissions meant to inform the long gone humans of the rumblings of the ocean, Cthulhu herself is the hidden beauty and ecstasy of the deep."
