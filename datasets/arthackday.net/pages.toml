["https://arthackday.net/projects/eve-weinberg-omer-shapira-amelia-winger-bearskin-alan-schaffer-drowning"]
title = "#drowning"
description = '''
A virtual game experience that weaponizes the data deluge.
The internet offers endless information, instantaneous responses, and
constant engagement. This creation and consumption of data takes real
energy — our data has the power to drown.
In this game we simulate the real world effects of every tweet, facebook
post, and google search trend. Two players face off. Choose the higher
trending topic to drown your opponent in data. The more popular your
search term is, the faster your opponent’s water will rise.
Drown or be drowned."'''
