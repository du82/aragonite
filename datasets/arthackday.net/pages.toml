["https://arthackday.net/projects/justin-blinder-benjamin-gaulon-bit-by-bit"]
title = "Bit By Bit"
description = """
BbB is a cloud shrinking service create by Justin Blinder and Benjamin Gaulon. The project started from a common interested for digital waste and data recycling. During Art Hack Day BbB will be presented as a network performance and installation.
BbB displays the latest pastebin* uploads, while at the same time, requesting for the content to be removed by sending automatic cease and desist emails. Each file displayed is visible for the last time at Transmediale 2014 and projected onto light sensitive surface leaving an afterglow for a short amount of time. During the festival BbB will help bit-by-bit reducing the data accumulated on the internet.
* http://pastebin.com/archive"""
