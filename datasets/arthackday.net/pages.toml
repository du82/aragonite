["https://arthackday.net/about"]
title = "Art Hack Day"
description = "ART HACK DAY is an event for hackers whose medium is art and artists whose medium is technology."
full_description = '''Art Hack Day is an internet-based nonprofit dedicated to hackers whose medium is art and artists whose medium is tech. We bridge the gap between art, technology and entrepreneurship with grassroots hackathons & exhibitions that demonstrate the expressive potential of new technology and the power of radical collaboration in art. We believe in non-utilitarian beauty through technology and its ability to affect social change for public good. Sixty artists-hackers and hacker-artists inhabit an art space to create an exhibit from scratch during 48h. We start on a Thursday evening with a meet & greet and provide good food, fast Internet, and equipment for collaborating on and creating new work. On Saturday evening we transition from hackspace to exhibition hall and the projects are shown to the public during a flash exhibit (open to the public just one evening). There are no demos but plenty of performances. Depending on location, 500-1,000 visitors come to the opening with >10,000 uniques online. Art Hack Day is a grassroots event driven by outstanding co-organizers and co-organizing art spaces around the world. Organizers include Benjamin Gaulon, Björn Norborg, Daniel Franke, David Huerta, Igal Nassima, Inga Seidler, Johan Uhle, John McKiernan, Josette Melchor, Kai Kreuzmüller, Kristoffer Gansing, Lindsay Howard, Mat Dryhurst, Nicolas Maigret, Olof Mathé and Paul Christophe. Participating exhibit spaces include: "Amazingly clever, rebellious, interactive and visually stunning art happenings ensue.....Just fantastic. Where is this stuff in the galleries? " "The most crowded event of the week; probably the most interesting one as well...This show had a lot of unexpected humor going on." Q: Can I start on my hack before the event? A: We encourage you to develop your project at the event and not arrive with a half-finished project. Having 60 artists and hackers in the same space brings the chance to work together on things you couldn't do alone; Take advantage of that, there's a reason why this isn't just another art opening!'''
year_published = 2025
