["https://arthackday.net/events/dethrone"]
title = "Art Hack Day - Dethrone"
description = "Art Hack Day is an event for hackers whose medium is art and artists whose medium is technology. Power ebbs and flows as it is sought, coveted, and lost …"
full_description = "Art Hack Day is an event for hackers whose medium is art and artists whose medium is technology. Power ebbs and flows as it is sought, coveted, and lost. When too much power is hoarded, rulers construct thrones to centralize their authority. Seats of power change over time as kings, tycoons, and zealots claim as their prerogative the right to dictate the future. Today, as technology outpaces humanity’s ability to comprehend it, the seats of authority become more difficult to pinpoint and confront. Thrones are no longer hewn from stone or gold, but from code and networks. Server farms, algorithms, and data sets undergird the new infrastructures of control. Art Hack Day: DETHRONE invites you to upend established order. On February 22–24, artists and hackers will converge at Gray Area to create an exhibit from scratch that questions contemporary mechanisms of power, challenges their legitimacy, and envisions new potentials for a world unyoked from colonial and patriarchal systems. Wielding technology in unexpected ways, artists carry with them the potential to not only hack code but also culture. Together, with interspecies dependence and interplanetary cooperation in mind, the people can rewrite the protocols to dethrone malignant rule. Who are the modern digital monarchs, and how can we confront them? Can we topple ivory towers without descending into chaos or creating new tyrants? What does it mean to live in a world where rule has been decentralized and automated? What does it look like to dispossess or reclaim power in the post-digital age? Art Hack Day: DETHRONE tests how creative visionaries might use art and technology to reconfigure the status quo. Want to join in? Apply to attend the full hack + exhibit and collaborate on projects OR volunteer to help make the event happen. @arthackday + @cryptoparty NYC co-organizer. Former @heatsynclabs cat herder and wordsmith now at @nycresistor. Party hat hacker. PGP: 0xAE09F328 Entrepreneur and artist. Co-founder at Mixmax, a sales engagement platform. Started Art Hack Day in 2011."
year_published = 2025
clearnet = "https://arthackday.net/events/dethrone"
