["https://arthackday.net/projects/rosemary-lee-jens-jorgensen-mining-the-arbitrary"]
title = "Mining the Arbitrary"
description = "Contending with the adverse impact of mining materials as well as data, Mining the Arbitrary aims at extracting senseless numerical data from materials. In light of the anthropocene, even substances such as water, snow, stone, and earth bear evidence of the effects of humanity. Collecting, inventorying, and analyzing samples of various substances sourced in Berlin, we begin to unearth the cumulative production of waste information and materials."
