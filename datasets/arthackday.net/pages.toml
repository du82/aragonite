["https://arthackday.net/code_of_conduct"]
title = "Art Hack Day"
description = "ART HACK DAY is an event for hackers whose medium is art and artists whose medium is technology."
full_description = 'During Art Hack Day, we create an exhibit from scratch in 48h. It’s intense and rewarding. Here is our Code of Conduct to make everything run smoothly for both participants and volunteers. We encourage you to work in teams and with other participants of different backgrounds and practices. It tends to be the most rewarding and always results in compelling work. As such, Art Hack Day is committed to providing a friendly, safe, and welcoming environment for all, regardless of gender, sexual orientation, ability, ethnicity, socioeconomic status, and religion (or lack thereof). We expect all event participants to help us realize a safe and positive event experience for everyone. At all event venues and event-affiliated social events we expect everyone will: Unacceptable behaviors include harassing, abusive, discriminatory, or derogatory conduct. Harassment includes: offensive comments related to gender, sexual orientation, race, religion, disability; inappropriate use of sexual images; deliberate intimidation, stalking, or following; harassing photography or recording; sustained disruption of talks or events; inappropriate physical contact, and unwelcome sexual attention. These behaviors will not be tolerated and anyone asked to stop is expected to comply immediately. If a participant behaves unacceptably, the event organizers may take action they deem appropriate, including expulsion from the event without warning. The Art Hack Day team is available to help participants contact venue security or local law enforcement and to otherwise ensure everyone feels safe for the duration of the event. If you or anyone else are subject to unacceptable behavior, or you have any other concerns, notify an organizer as soon as possible. Event organizers are listed under "ORG" on each event page. There will be a limited amount of equipment you can borrow for your works on-site. The organizers will share this list of equipment with you before the event. Please note that we do our best to accommodate all equipment requests, and we ask that you are respectful of your fellow participants’ needs as well.'
year_published = 2025
clearnet = "https://arthackday.net/code_of_conduct"
tags = []
language = "en"
