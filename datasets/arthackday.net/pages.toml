["https://arthackday.net/events/erasure"]
title = "Art Hack Day - Erasure"
description = '''
How do you delete a tree? What does it mean to erase a place or a memory?
We live our lives balancing the ephemeral and the eternal, the forgotten and the cached. We post photos that become everlasting and snap videos designed to disappear. We live in physical and virtual spaces that vanish, corrupt, overwrite, buyout, and elide. We watch as cities, people, and landscapes simultaneously become visible and invisible, pixel by pixel, cell by cell. What stays? What goes? Who decides? Is anything ever truly erased? In an era of infinite possible storage, we are only now beginning to understand what erasure really means.<br /><br />
As the virtual and physical worlds continue to merge, artists and hackers from the Pacific Northwest will inhabit Velocity:V2 (formerly Value Village) and produce new, collaborative projects that investigate the nature of impermanence, forgetting, archiving, and escaping.
Visitors are invited to join the teams on Saturday Sept 17 starting at 7:00pm for a closing exhibition, live performances, and party, which will also be the opening celebration to kick off <a href="http://www.aktionsart.org/black-box">Black Box 3.0</a>.'''
