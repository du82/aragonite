["https://arthackday.net/events/lethal-software"]
title = "Art Hack Day - Lethal Software"
description = '''
Art Hack Day is an event dedicated to cracking open the process of art-making. Between December 13-15, artists and hackers will inhabit GAFFTA to create a flash exhibit on the theme of "Lethal software". 
<br/><br/>
Software now has a license to kill, as advances in computing have made drones and other weapon systems autonomous. This development was long presaged by popular culture (Hal, Robocop, Terminator). Fortunately, most of us don’t have to write this software (or suffer from it) although we interact daily with software that is lethal in other respects. There is software that prevents other software from executing (spam vs. anti-spam, surveillance vs. sousveillance) and there is software that shields us from the influence of fellow humans (e.g., Google’s auto-complete algorithm). We have only tangentially approached the topic as hackers and artists and encourage visitors to engage with our projects online during the event and join us Saturday evening for a closing exhibition, live performances and party.'''
full_description = '''Art Hack Day is an event dedicated to cracking open the process of art-making. Between December 13-15, artists and hackers will inhabit GAFFTA to create a flash exhibit on the theme of "Lethal software". Software now has a license to kill, as advances in computing have made drones and other weapon systems autonomous. This development was long presaged by popular culture (Hal, Robocop, Terminator). Fortunately, most of us don’t have to write this software (or suffer from it) although we interact daily with software that is lethal in other respects. There is software that prevents other software from executing (spam vs. anti-spam, surveillance vs. sousveillance) and there is software that shields us from the influence of fellow humans (e.g., Google’s auto-complete algorithm). We have only tangentially approached the topic as hackers and artists and encourage visitors to engage with our projects online during the event and join us Saturday evening for a closing exhibition, live performances and party. Creating technological imaginaries that mediate impossible desires. International arts mercenary. | @gaffta @RMLCinechamber @obscura_digital I make creative applications that are fun. Well, at least I would think so. Lead Experience Developer at Helios Interactive. Software engineer and senior fortune teller for http://Hunch.com. I enjoy creating electronic music, discussing programming concepts, and rock climbing. @arthackday co-organizer, @cryptoparty NYC organizer and Hayst.ac founder. Former @heatsynclabs cat herder and wordsmith. Synthesis & Processing. RVNG Intl. Stanford. Order debut album 'Movement': http://igetrvng.com/discography/143/ Booking: US @windishagency EU @littlebigmusic I bring people together to make things. Sometimes, I also make things. Designer | Organizer | Educator | Activist | + | Research Director @GAFFTA ¯¯\_(ツ)_/¯¯ American computer programmer Co-founder @VHXTV Member @FFFFFAT Previously @KnowYourMeme @StarWarsUncut @GoogleAlarm @dotGML #BeOS'''
