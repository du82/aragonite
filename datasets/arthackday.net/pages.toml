["https://arthackday.net/projects/annie-goh-banality-of-affect"]
title = "Banality of Affect"
description = '''
Measuring the moods of the Twitter feeds of the top 5 trance DJs and 5 top news feeds, this installation rectifies presumed emotional responses to our surrounding media.
If the mood of the outside world worsens, the music and visuals get more "euphoric". If the outside world is OK, the music and visuals get more melancholic.'''
