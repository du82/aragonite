title = "WSSID"
description = "WSSID is a wireless router that collects and broadcasts live weather data from it’s local environment in the form of a dynamically changing SSID name. The project examines the use of wireless networks on the environment and how we are constantly in range of these signals without explicitly asking to be. Similar to the way that weather is beyond our direct control, “WSSID” shows us how permeating these networks have become by relaying direct environmental data about the locations in which they are housed."
