["https://arthackday.net/events/per-capita"]
title = "Art Hack Day - Per Capita"
description = """
Art Hack Day est un événement au sein du festival Sight & Sound qui décortique les processus de création artistique. Entre le 30 septembre et le 2 octobre, 40 artistes et hackers habiteront Eastern Bloc, Montréal, afin de créer une exposition éclair sur le thème Per Capita, pour explorer l’économie de partage et les modèles horizontaux collaboratifs.
<br /><br />
Dans une perspective critique et une pratique collaborative, il s’agit de réinterpréter ces concepts pour voir s’ils sont vraiment des alternatives équitables et démocratiques. Nous encourageons les participants à poser un regard éclairé sur ces phénomènes actuels issus de l’économie du partage, à questionner ses mécanismes, ses impacts et sa place dans notre société. Est-ce que ces modèles peuvent s’investir dans un développement durable selon des valeurs partagées et pérennes? Peuvent-ils s’inscrire dans une dimension solidaire où les communautés sont réellement engagées?
<br /><br />
--
<br /><br />
Art Hack Day is an event that dissects the process of artistic creation. This event will be part of the 2016 edition of the international festival of digital art, Sight & Sound, whose theme, Per Capita, explores the sharing economy and other collaborative horizontal models. Between September 30th and October 2nd, 40 artists and hackers will inhabit Eastern Bloc, Montreal, to create a flash exhibition around the theme of the sharing economy.
<br /><br />
From a critical perspective and through collaborative practice, this flash exhibition aims to reinterpret the complexity of these challenges by focusing on the practices of 'do-it-yourself’ and ‘do-it- together’, which are located at the intersection of art, technology and science. By cultivating risk taking and experimentation we encourage participants to take an informed look at these current phenomena from the economy of sharing, questioning its mechanisms, its impact and its place in our society. Are sharing economy models truly fair and democratic alternatives? Can these models invest in sustainable development according to shared and enduring values? Can they be part of a solidarity dimension where communities are really engaged?"""
full_description = "Art Hack Day est un événement au sein du festival Sight & Sound qui décortique les processus de création artistique. Entre le 30 septembre et le 2 octobre, 40 artistes et hackers habiteront Eastern Bloc, Montréal, afin de créer une exposition éclair sur le thème Per Capita, pour explorer l’économie de partage et les modèles horizontaux collaboratifs. Dans une perspective critique et une pratique collaborative, il s’agit de réinterpréter ces concepts pour voir s’ils sont vraiment des alternatives équitables et démocratiques. Nous encourageons les participants à poser un regard éclairé sur ces phénomènes actuels issus de l’économie du partage, à questionner ses mécanismes, ses impacts et sa place dans notre société. Est-ce que ces modèles peuvent s’investir dans un développement durable selon des valeurs partagées et pérennes? Peuvent-ils s’inscrire dans une dimension solidaire où les communautés sont réellement engagées? -- Art Hack Day is an event that dissects the process of artistic creation. This event will be part of the 2016 edition of the international festival of digital art, Sight & Sound, whose theme, Per Capita, explores the sharing economy and other collaborative horizontal models. Between September 30th and October 2nd, 40 artists and hackers will inhabit Eastern Bloc, Montreal, to create a flash exhibition around the theme of the sharing economy. From a critical perspective and through collaborative practice, this flash exhibition aims to reinterpret the complexity of these challenges by focusing on the practices of 'do-it-yourself’ and ‘do-it- together’, which are located at the intersection of art, technology and science. By cultivating risk taking and experimentation we encourage participants to take an informed look at these current phenomena from the economy of sharing, questioning its mechanisms, its impact and its place in our society. Are sharing economy models truly fair and democratic alternatives? Can these models invest in sustainable development according to shared and enduring values? Can they be part of a solidarity dimension where communities are really engaged?"
