["https://arthackday.net/events/disnovate"]
title = "Art Hack Day - Disnovate"
description = '''
"Disnovate" is a collaboration between Art Hack Day, Parsons Paris and Accès(s) festival. Between August 28-30, artists and hackers will inhabit Parsons Paris to create a flash exhibit on the theme "Disnovate”, in anticipation of the next Accès(s) festival in Pau.
<br/><br/>
Disruptive innovation is widely heralded as the driving force of progress, influencing all walks of life. Its vocabulary has seeped into domains as disparate as politics, education, or art. Computer culture is not immune: Hackathons have turned into rallies for smarter, cheaper and faster consumption.
What role does the whimsical and useless play in this society? Can we evaluate creation without resorting to conceptions of value? What worldview is implied by the language of disruption; what does it clarify and what does it obscure? As artists we have an urge to break with the past and embrace novelty, ignoring the pioneers of our field. As hackers we reap the benefits of scientific breakthroughs, oblivious to its military-industrial foundation. Are we the apostles of a broader ideology of innovation?'''
full_description = '''"Disnovate" is a collaboration between Art Hack Day, Parsons Paris and Accès(s) festival. Between August 28-30, artists and hackers will inhabit Parsons Paris to create a flash exhibit on the theme "Disnovate”, in anticipation of the next Accès(s) festival in Pau. Disruptive innovation is widely heralded as the driving force of progress, influencing all walks of life. Its vocabulary has seeped into domains as disparate as politics, education, or art. Computer culture is not immune: Hackathons have turned into rallies for smarter, cheaper and faster consumption. What role does the whimsical and useless play in this society? Can we evaluate creation without resorting to conceptions of value? What worldview is implied by the language of disruption; what does it clarify and what does it obscure? As artists we have an urge to break with the past and embrace novelty, ignoring the pioneers of our field. As hackers we reap the benefits of scientific breakthroughs, oblivious to its military-industrial foundation. Are we the apostles of a broader ideology of innovation? Papa de @brigadeneurale / @grlfr crew / Monsieur Ghetto DIY / Des trucs tout genre (ateliers DIY, art numérique, netart ...) / De l'ironie à tout va Hardware hacking and recycling strategies in an age of technological obsolescence. #recyclism #uglitch #ParsonsParis Jean-Baptiste is a media artist, and an electronic musician. bastard-coder, copyfighter, he hijacks databases, programs online plunderphonic machines {whatever} media artist, Graffiti Research Lab France (@grlfr), GML library for Processing (@gml4u) ... Making a book on #fablab | @GRLFR @bidouillecamp Ex @OWNI circa 2010 #cinema #photojournalist #makers #hackers #graffiti #veggie Always looking for adventures Hardware hacking and recycling strategies in an age of technological obsolescence. #recyclism #uglitch #ParsonsParis "Ils développeront pendant 48h de nouveaux projets artistiques autour d’un discours critique sur l’innovation permanente."'''
