["https://artic.edu/about-us/mission-and-history"]
title = "Mission and History | The Art Institute of Chicago"
description = """
Visit                                                Find all the information you need—plus helpful tips—to plan your visit                                                                                                    Start planning"""
full_description = "Mission and History About Us Mission and History Mission and History History Values Equity Land Acknowledgment Leadership Departments Financial Reporting Share MissionThe Art Institute of Chicago shares its singular collections with our city and the world. We collect, care for, and interpret works of art across time, cultures, geographies, and identities, centering the vision of artists and makers. We recognize that all art is made in a particular context, demanding continual, dynamic reconsideration in the present. We are a place of gathering; we foster the exchange of ideas and inspire an expansive, inclusive understanding of human creativity. History Founded in 1879, the Art Institute has grown substantially over the last century plus—in both our physical building and our exceptional collections—while always maintaining our ambition to share our artworks with as broad an audience as possible. Values Committed to contributing to an inspired and just society and to fostering a progressive understanding of our past, the Art Institute of Chicago invites and advances the diverse perspectives of our city, staff, visitors, and supporters. Equity The Art Institute of Chicago commits to advancing racial justice now and in the future. We recognize our mission to care for and interpret our collections and our moral obligation to confront the biases and inequities of our history. Land Acknowledgment For thousands of years, Native Americans have stewarded the lands and waters of the region surrounding Chicago. The Art Institute recognizes and is mindful of these rich cultural traditions that continue to thrive in our city today. Share"
year_published = 2025
