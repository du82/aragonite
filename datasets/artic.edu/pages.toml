full_description = "The Collection Explore thousands of artworks in the museum’s collection—from our renowned icons to lesser-known works from every corner of the globe—as well as our books, writings, reference materials, and other resources. Page secondary navigation Artworks Publications Research Publications Artworks Publications Research Digital Publications Browse all digital publications › Digital Publication Perspectives on Place Perspectives on Place explores the many ways in which materials, methodologies, and technologies make and define place through an expansive geographical, temporal, and theoretical range of artworks, sites, and subjects. Digital Publication Monet Paintings and Drawings at the Art Institute of Chicago This volume features forty-seven works by Monet. Entries on the paintings and drawings include new art historical research and unprecedented high-resolution imaging that allows readers to zoom in to see the artist’s brushstrokes. Digital Publication Roman Art at the Art Institute of Chicago This catalogue is the most extensive investigation to date of the museum’s works from ancient Rome, and focuses on 165 significant objects from the collection. Page secondary navigation Browse all digital publications Print Publications Browse all print publications › Project a Black Planet: The Art and Culture of Panafrica This publication presents Panafrica as an imagined territory where art and culture transgress national boundaries, reckon with long histories of subjugation and resistance, and envision an equitable future. Myth and Marble: Ancient Roman Sculpture from the Torlonia Collection This engaging and visually sumptuous publication will explore 60 major works of ancient Roman art from the Torlonia Collection, one of the most important private collections of Roman marble sculptures in the world. Frida Kahlo’s Month in Paris: A Friendship with Mary Reynolds The richly illustrated story of a brief yet pivotal encounter in Paris between Frida K