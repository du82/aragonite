["https://artic.edu/about-us"]
title = "About Us | The Art Institute of Chicago"
description = "Founded in 1879, the Art Institute of Chicago is one of the world’s major museums, housing an extraordinary collection of objects from across places, cultures, and time. We are also a place of active learning for all—dedicated to investigation, innovation, education, and dialogue—continually aspiring to greater public service and civic engagement."
full_description = "About Us About Us About Us Mission and History Leadership Departments Financial Reporting Share Founded in 1879, the Art Institute of Chicago is one of the world’s major museums, housing an extraordinary collection of objects from across places, cultures, and time. We are also a place of active learning for all—dedicated to investigation, innovation, education, and dialogue—continually aspiring to greater public service and civic engagement. Mission and History From its founding in 1879 to the present, the Art Institute of Chicago has shared its singular collections with our city and the world. Leadership Deeply committed to sharing the wide spectrum of human creativity with our local communities and the world beyond, the leadership of the museum works collaboratively to continually advance the excellence and accessibility of our offerings. Departments From caring for the collection to creating engaging programming to developing the next generation of museum professionals, the museum’s departments work to ensure the Art Institute is a relevant and dynamic space now and for centuries to come. Financial Reporting Our annual reports offer a snapshot of the work we are able to do each year—growing our collection, expanding engagement, strengthening our exhibition program, and innovating our public programs for all ages—thanks to the generosity of our supporters. Share"
