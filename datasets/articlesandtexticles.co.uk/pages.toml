["https://articlesandtexticles.co.uk/literature"]
title = "Famous Literature Masterpieces | ArticlesAndTexticles"
description = "Literature really is in my blood and never fails to impresses me. Here I've reviewed some of my favourite literature masterpieces."
full_description = "Read my reviews on some of the most famouse literature masterpieces William Shakespeare - “King Lear” William Shakespeare is loved and admired for his significant contribution to literature. He started his career as playwright and actor around the year 1592, not long after first public playhouses opened in London. William Shakespeare has written about 37 plays, and many of these were successful in both public playhouses and court. One of his great literary masterpieces is King Lear. King Lear literary piece is a tragedy originally written by William Shakespeare. This depicts gradual descent to the madness of title characters upon disposing of his kingdom using giving bequests into two of his three loving daughters egged on through continual flattery bring such tragic experiences to everyone. Taken from Legend of Leir of Britain, mythological pre-Roman Celtic King, this play has essentially been widely accepted for motion and stage pictures with major title role coveted by many highly accomplished actors in the world. King Lear is one of the best tragedy pieces of William Shakespeare. This piece is believed to be written between the years 1605 to 1606. In this piece, Shakespeare brilliantly represents senility as well as the increasing madness of the main character as he split his Kingdom to portions for his daughter based on their wrong declaration of love for him. This literary piece is filled with intense emotion that will surely captivate the heart and mind of every reader. “King Lear” is an interesting tragedy that readers will surely read from start to finish. This is just one of the astounding masterpieces of William Shakespeare. George Gordon Byron - “Don Giovanni” Don Giovanni is an opera commonly in two acts and with good music by Lorenzo de Ponte, an Italian libretto and Wolfgang Amadeus Mozart. This is mainly based on Legends of Don Juan, the fictional seducer and libertine. This was premiered by Prague Italian Opera in the National Theatre of Bohemia which is now known as Estates Theatre. Lorenzo de Ponte Italian libretto was billed as drama giocoso, a typical designation of time which denotes a combination of comic and serious action. Mozart has eventually entered such work to his catalogue as an opera buffa. Though classified as a comic at times, this blends supernatural elements, melodrama, and comedy. A staple of basic operatic repertoire, for five seasons, Don Giovanni was 9th in the Opera base list of the most-performed operas throughout the world. This is also proven to be a fruitful subject for philosophers and writers alike. George Gordon Byron was also known as the Lord Byron is a British politician, poet and one of the leading figures in Romantic Movements. Among the best works of Byron are the lengthy yet interesting narrative poems Childe Harold’s Pilgrimage and Don Juan. He also has shorter lyrics that became popular such as the Hebrew Melodies. He has extensively travelled across Europe particularly in Italy where he stayed for 7 years in different cities including Pisa, Ravenna, and Venice. George Gordon Byron is popular in his lifetime due to his unique personality cult for his incredible poetry. He is also admired for his enormous collections of poetry and art paintings. David Lawrence - “Women in love” “Women in Love” is one of the most experimental and ambitious works of David Lawrence. This is a novel written by this British author and is actually the sequel to his earlier novel entitled “The Rainbow” in 1915 and then follows the continuing lives and loves of Brangwen sisters Ursula and Gudrun. The latter is an artist who pursues a destructive relationship with an industrialist Gerald Crich. David Lawrence tends to contrast the pair with love which develops between Rupert Birkin, an intellectual who articulates numerous opinions linked with the author. Thus, the emotional relationships established are provided with further tension and depth through intense physical and psychological attractions between Rupert and Gerald. This novel ranges in the entire British society prior to the First World War period and concludes Tyrolean Alps snow. The character of Ursula draws on Frieda, Lawrence’s wife while in the case of Rupert Birkin has essential elements of the author David Lawrence himself. Women in love are considered modernist novel has its roots in 19th-century realism. One imperative aspect of this is most clearly depicted in Industrial Magnate chapters that portray modernization of mines of Gerald Crich. The setting of this novel includes colliery owner’s home, mining town, aristocratic house, Bohemian London and more suggesting breadth of canvass which emulates excellent Victorian novels. “Women in Love” guarantees to deliver contents that can captivate the attention of readers. This is an excellent novel authored by David Lawrence that is worth reading. Bernard Shaw - “Pygmalion” “Pygmalion” is a play of the renowned George Bernard Shaw. This is named after the Greek Mythological figure and was presented in a stage for the very first time to the public in 1913. In this play, Pygmalion fall in love with one of the sculptures he made which eventually came into life. The concept of this myth is generally a well-known subject for the Victorian era’s English playwrights that includes Shaw’s influences, WS Gilbert who successfully wrote the play which was based on a story entitled Pygmalion and Galatea which was initially presented in the year 1871. George Bernard Shaw would also be familiar with burlesque versions of Pygmalion and Galatea Reversed. His play was adapted so many times and most notably as My Fair Lady musical and also the film version. This is undeniably one of the most successful and best-known plays. This was a real rousing success in many different New York and London stages. The “Pygmalion” is also considered a highly entertaining play. In Pygmalion, Bernard Shaw has mentioned characters like Henry Higgins that was inspired by various British phonetics Alexander J. Ellis, Alexander Melville Belle and above all, Henry sweet, the cantankerous. Also, the emerging butterfly, along with the splendid skills and brilliant dialogue of George Bernard Shaw has made the “Pygmalion” one of the famous comedies in the English language and a staple drama courses in college. This play is widely performed even up to now. With Pygmalion’s attention-grabbing features, no wonder that Bernard Shaw’s masterpiece rose to fame. Jane Austen - “Sense and sensitivity” Sense and Sensibility is Jane’s Austen novel that was published in 1811. This was anonymously published by an A Lady appearing on the novel’s title page. This novel tells the story of Dashwood sisters namely Elinor, 19 years old and Marianne age 16 and they also have a stingy older brother John and a younger sister named Margaret. The novel mainly followed the 3 Dashwood sisters as these girls should move together with their widowed mother from where they grew up; the Norland Park. Since Norland will be passed on to John, the product of the first marriage of Mr Dashwood, the Dashwood girls, therefore, needs to find and transfer to a new home. They have the chance of renting an unassertive home, the Barton Cottage. This is the property of one of their distant relatives John Middleton. In this place, they have experience romance, love, and heartbreak. The Sense and Sensibility novel of Jane Austen is believed to set in London, Southwest England and Sussex between the years 1792 and 1797. The novel was published anonymously in 3 volumes which soon became a real classic. The comic and satirical work provides a depiction of the middle-class life of the 19th century as this follows a romantic relationship developed between Marianne and Elinor Dashwood. The Sense and Sensibility focus on Marianne and Elinor Dashwood personifications of real good sense or common sense and sensibility which could imply emotionality. This novel has been a success since then and later on adapted for stage, television, and film. Charles Dickens - “David Copperfield” Charles Dickens had composed a passage between 1845 and 1848 which refer to dark times during his youth when his entire family moved to London in early 1820s. The imprisonment of Charles Dickens’ father left his family with no choice but to send him to a blacking factory to work. This has affected Charles Dickens’ childhood as well as education which have turned out to be the primary source of his grief. He found all these memories in the past so painful to go on with his autobiography. The truth is, Charles Dickens jealously guarded those facts covering his London Youth. Then after, his biographer named John Foster has published Life of Charles Dickens in 1872. Lots of readers have learned about his painful youth and also the autobiographical nature of one of his most amazing creations, the David Copperfield”. This was published originally in serial form starting from May 1849 up to November 1850. The “David Copperfield” is Charles Dickens’ very first novel that is entirely written in the first person. By converting his auto-biographical impulse to fiction has allowed Charles Dickens to discover many uncomfortable truths about life, particularly his life. The time of David Copperfield at Grinby’s and Murdstone warehouse as well as his schooling in the Salem House and relationship with Dora has their specific bases in Charles Dickens’ own life. However, it might be the most autobiographical novel by Charles Dickens, but David Copperfield is a work of fiction. Readers will also get hooked with the novel’s distinct parts. I hope you liked my reviews on these great literature pieces. You can take a look at my personal life and professional experience."
