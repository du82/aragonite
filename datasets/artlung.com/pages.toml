["https://artlung.com/about"]
title = "ArtLung: About Joe Crawford"
full_description = "I’ve written code for a living for a while. ArtLung.com itself runs on WordPress and it looks and works the way it does because I programmed the theme and underlying code. E.g: I wrote the WordPress shortcode that generates the next sentence: This blog has 9,158 posts, 2,805 comments, 6,493 embedded images, 3,641 outbound links, and about 817,728 words. I live in San Diego, California. I like to bodysurf and swim in the ocean year-round. I wrote a comic about my enthusiastic return to swimming. My father told me when I was a teen to not just consume media, but also to make it. Personal publishing became that for me, and I’ve been blogging since 2001. I love to draw, sometimes at Sketch Party San Diego. I also create comics, prints and stickers. I am often at Ocean Beach or Mission Beach. Sometimes Orange County Beaches are the thing. I love beaches. Pools too. I take photos when I go in the water: 2025, 2024, 2023, 2022, 2021, and 2020. I was an Army brat, I was also a Navy brat. So I’ve lived a lot of places. Mostly I’ve lived in California, San Diego, Alhambra, Los Angeles, Koreatown, Cheviot Hills, Moorpark, Simi Valley. I am the rare San Diegan who also loves Los Angeles. I lived in the Philippines as a kid which is how I came to love Voltes V and all robots. Also Virginia: Roanoke and Charlottesville. I have family there. I’m twice divorced. The second was amicable. Since then I’m very lucky and happy to have met Kelly. We live together happily along with Gwen The Goblin. I believe in the power of the web. That might sound strange or grandiose. But I do. The web has allowed me to stay in touch with people, learn, change my profession. It’s incredible the way it can connect people. In the last few years we’ve seen both the power and also the danger of connecting people without care and moderation. But I am hopeful that we can improve the web. That’s why I care about the indieweb movement. (see also #indieweb. I love groups and events that empower people. I founded WebSanDiego at the turn of the century. San Diego Bloggers was another thing I was proud of. I sold it but there are times I wish I’d hadn’t."
year_published = 2025
