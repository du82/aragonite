full_description = '''I have posted 36 times in 2025 using WordPress. 12 were PESOS'ed from Instagram—about a quarter. The total word count for 2025 is 4,028 words with about 37 images and approximately 11 external links. I have posted 15 swimming posts so far this year. I have made 2 comics so far this year. I have made 1 headers so far this year. It was great revisitng and improving older parts of my site in 2024. I got hugely involved with the IndieWeb and did a lot of creative work.I posted 467 times in 2024 using WordPress. 226 were PESOS'ed from Instagram—about a third. The total word count for 2024 was 101,358 words with about 485 images and approximately 334 external links. I posted 157 posts tagged "swim2024". I made 5 comics that year. I made 10 headers. I stopped using joecrawford.com as a redirect and put in place a simple statement. Design by Al Abut.I posted 378 times in 2023 using WordPress. 286 were PESOS'ed from Instagram—more than 75%. The total word count for 2023 was 21,898 words with about 328 images and approximately 306 external links. I posted 167 posts tagged "swim2023". I made 4 comics that year. I made 2 headers. I posted 412 times in 2022 using WordPress. 355 were PESOS'ed from Instagram—more than 80%. The total word count for 2022 was 19,252 words with about 404 images and approximately 403 external links. I posted 177 posts tagged "swim2022". I made 1 comics that year. I didn't make any headers. I posted 515 times in 2021 using WordPress. 462 were PESOS'ed from Instagram—more than 80%. The total word count for 2021 was 22,034 words with about 486 images and approximately 415 external links. I posted 247 posts tagged "swim2021". I made 8 comics that year. I didn't make any headers. I posted 344 times in 2020 using WordPress. 300 were PESOS'ed from Instagram—more than 80%. The total word count for 2020 was 28,032 words with about 333 images and approximately 293 external links. I posted 47 posts tagged "swim2020". I made 13 comics that year. I made 3 headers.'''
