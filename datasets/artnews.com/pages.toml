["https://artnews.com/about-us"]
title = "About Us"
description = "ARTnews is a visual-arts publication covering art from ancient to contemporary times, which includes exhibitions reviews, artists and collectors profiles, and more."
full_description = 'WWD Brands and Retailers Celebrating Women’s History Month and International Women’s Day With Conversations, Donations and More About Us About ARTnews Since 1902, ARTnews has been the most trusted source for news of the global art world and the art market. It is a digital-first publication that delivers up-to-the minute developments across its website and newsletters. Our one print issue is the annual Top 200 Collectors issue which, since 1990, has been the definitive source on the world’s most active and important art collectors. ​The publication’s thousands of contributors have included Alfred Barr, Bernard Berenson, Kenneth Clark, Robert Coles, Arthur Danto, Carlos Fuentes, Pete Hamill, Aldous Huxley, Steve Martin, Louise Nevelson, Bob Nickas, Francine Prose, Harold Rosenberg, David Salle, Jean-Paul Sartre, and William Carlos Williams. About Art in America Since 1913, Art in America has published groundbreaking critical insights about contemporary art and culture. Each quarterly issue features exhibition reviews, a collectible artist print, interviews with leading artists, and in-depth essays by individuals at the forefront of their fields. Between its flagship print edition and growing digital presence, Art in America today reaches both influential art world insiders and a broad audience invested in understanding pivotal cultural trends. About Our Team <img decoding="async" class="size-medium wp-image-1202667680" src="https://www.artnews.com/wp-content/uploads/2019/11/Sarah-Douglas.jpg?w=300" alt="" width="300" height="200" srcset="https://www.artnews.com/wp-content/uploads/2019/11/Sarah-Douglas.jpg 897w, https://www.artnews.com/wp-content/uploads/2019/11/Sarah-Douglas.jpg?resize=400,267 400w" sizes="(min-width: 87.5rem) 1000px, (min-width: 78.75rem) 681px, (min-width: 48rem) 450px, (max-width: 48rem) 250px" /> Sarah Douglas was appointed editor-in-chief of ARTnews in July 2014. She has been an art journalist and editor for numerous publications for 20 years, beginning with four years running the US editorial office of the Art Newspaper, after a stint writing exhibition reviews and previews for the New York Times online. Before ARTnews, she was culture editor at the New York Observer, and she launched a visual art site called Gallerist. Prior to that, she spent six years as a staff writer at Art+Auction magazine and its website, Artinfo.com. Sarah has contributed to the New York Times, New York magazine, the Economist, Flash Art, and the National, among other publications, writing about art, the art market, and the art world. She has also participated in and led numerous panel discussions on topics ranging from art collectors’ estate planning to museum funding. Douglas has been interviewed about the art market on the NPR programs “Marketplace” and “Studio 360 with Kurt Andersen.” Books about the art world and the art market that cite her work include Don Thompson’s $12 Million Stuffed Shark: The Curious Economics of Contemporary Art and Michael Shnayerson’s Boom: Mad Money, Mega Dealers, and the Rise of Contemporary Art. In 2013 Sarah received ArtTable’s New Leadership award. She is not to be confused with the English actress Sarah Douglas who played the Kryptonian supervillian Ursa in Superman and Superman II. She tweets at @SarahLDouglas <img decoding="async" class="size-medium wp-image-1202667670" src="https://www.artnews.com/wp-content/uploads/2019/11/Erica-Lubow-Necarsulmer.jpg?w=300" alt="" width="300" height="200" srcset="https://www.artnews.com/wp-content/uploads/2019/11/Erica-Lubow-Necarsulmer.jpg 897w, https://www.artnews.com/wp-content/uploads/2019/11/Erica-Lubow-Necarsulmer.jpg?resize=400,267 400w" sizes="(min-width: 87.5rem) 1000px, (min-width: 78.75rem) 681px, (min-width: 48rem) 450px, (max-width: 48rem) 250px" /> Erica Lubow Necarsulmer is publisher of ARTnews and Art in America. A native New Yorker, her first appearance on the New York art scene was by means of “Learning Through Art,” a program for second- to sixth-grade students in which her work was shown at the Guggenheim Museum. She pursued this interest at Denison University, from which she graduated with a minor in studio art and a major in psychology. In 2005, after working at the New York Sun newspaper in the Travel and Arts sections, she started at ARTnews, owned at the time by Milton Esterow. Since moving to ARTnews, Erica has witnessed the business go from focusing purely on print to the start of ARTnews.com, and the daily newsletters Breakfast with ARTnews and ARTnews Today, social media sponsorships, engaging sponsored content options, webinars, podcasts, and live media. In 2015, when ARTnews came together with Art in America under the ownership of Peter M. Brant, Erica assumed the position of senior account manager; she was named publisher of ARTnews in 2017. Erica works closely with ARTnews editor-in-chief Sarah Douglas, coordinating the work of editorial and business teams to safeguard the publication’s integrity and promote its award-winning reporting. She lives in Manhattan with her husband and twin daughter and son. <img decoding="async" class="wp-image-1202667688 size-medium" src="https://www.artnews.com/wp-content/uploads/2019/11/Andy-Battaglia.jpg?w=300" alt="" width="300" height="200" srcset="https://www.artnews.com/wp-content/uploads/2019/11/Andy-Battaglia.jpg 897w, https://www.artnews.com/wp-content/uploads/2019/11/Andy-Battaglia.jpg?resize=400,267 400w" sizes="(min-width: 87.5rem) 1000px, (min-width: 78.75rem) 681px, (min-width: 48rem) 450px, (max-width: 48rem) 250px" /> Andy Battaglia is executive editor of ARTnews and Art in America. Prior to joining the magazines in 2016, he was a freelance writer for publications including the Wall Street Journal, Frieze, the Paris Review, New York, the Guardian, the National, Bookforum, Salon, and the Washington Post. From 2001 to 2010, he was an editor and staff writer for the Onion A.V. Club. Among his many interests are music and sound, which he has written about extensively for the Wire, Pitchfork, Rolling Stone, Spin, NPR, Resident Advisor, and other publications. He recently contributed essays to the book Kevin Beasley: A View of a Landscape and the book and digital album Unsound: Intermission. His favorite writings for ARTnews and Art in America include profiles of Fred Moten, Harmony Korine, Matthew Barney, and Michael Stipe, as well as features on James Turrell’s Roden Crater, the interdisciplinary ocean-going art enterprise TBA21–Academy, sales of rare whiskey at auction, and conceptual complexities surrounding the Panza Collection. He studied journalism and art history at the University of Georgia. Follow him @andybattaglia9 <img decoding="async" class="size-medium wp-image-1202667671" src="https://www.artnews.com/wp-content/uploads/2019/11/Francesca-Aton.jpg?w=300" alt="" width="300" height="200" srcset="https://www.artnews.com/wp-content/uploads/2019/11/Francesca-Aton.jpg 897w, https://www.artnews.com/wp-content/uploads/2019/11/Francesca-Aton.jpg?resize=400,267 400w" sizes="(min-width: 87.5rem) 1000px, (min-width: 78.75rem) 681px, (min-width: 48rem) 450px, (max-width: 48rem) 250px" /> Francesca Aton is an associate digital editor at ARTnews and Art in America. She joined Art Media in 2017 as an editorial intern, after earning a dual Bachelor of Arts in art history and visual arts from Fordham University. Aton served previously as exhibitions associate at the Visual Arts Center of New Jersey in Summit. She has spoken at the French Embassy in New York on the cultural impacts of bilingualism, and was a site assistant for the Apolline Project in southern Italy, unearthing, identifying, and analyzing artifacts encased during the 79 CE eruption of Mount Vesuvius. While studying abroad in Rome, she assisted Fordham University professor Jo Anna Isaak with her research and teaching; Aton also served as a guest critic for University of New Orleans professor Anna Mecugni’s art criticism class. Among her most recent writing is a catalog essay for artists Justin Korver and Brittany Ham’s exhibition “The Chase” (2023) at grayDUCK Gallery in Austin, Texas. For tips and queries, you can reach her at faton@artnews.com <img decoding="async" class="size-medium wp-image-1234683124" src="https://www.artnews.com/wp-content/uploads/2023/10/web-Daniel-Cassidy-Art-News2119-1.jpg?w=400" alt="" width="400" height="267" srcset="https://www.artnews.com/wp-content/uploads/2023/10/web-Daniel-Cassidy-Art-News2119-1.jpg 1200w, https://www.artnews.com/wp-content/uploads/2023/10/web-Daniel-Cassidy-Art-News2119-1.jpg?resize=400,267 400w" sizes="(min-width: 87.5rem) 1000px, (min-width: 78.75rem) 681px, (min-width: 48rem) 450px, (max-width: 48rem) 250px" /> Daniel Cassady is a journalist covering business practices, money, and machinations in the art world. He has too many magazine subscriptions and a one-handed backhand. He holds a BA in journalism from the City University of New York, and his writing has appeared in the Washington Post, the New York Post, Forbes, and the Art Newspaper. He welcomes good conversation and heated debates. Contact him at dcassady@artnews.com, @danielcassady on Twitter, and @cassadyphotos on Instagram <img decoding="async" class="size-medium wp-image-1202667689" src="https://www.artnews.com/wp-content/uploads/2019/11/Anne-Doran.jpg?w=300" alt="" width="300" height="200" srcset="https://www.artnews.com/wp-content/uploads/2019/11/Anne-Doran.jpg 897w, https://www.artnews.com/wp-content/uploads/2019/11/Anne-Doran.jpg?resize=400,267 400w" sizes="(min-width: 87.5rem) 1000px, (min-width: 78.75rem) 681px, (min-width: 48rem) 450px, (max-width: 48rem) 250px" /> Anne Doran has written for publications including Artforum, Art in America, ARTnews, Mousse, Collector Daily, and Time Out New York. The Dream Colony: A Life in Art, based on her interviews with legendary curator Walter Hopps and edited by New Yorker fiction editor Deborah Treisman, was published in 2017 by Bloomsbury. From 1996 to 2004, Anne was an editor at the art and literary quarterly Grand Street; between 2005 and 2006 she was a senior editor at ARTnews. After seven years as publications editor for the contemporary art gallery Feature Inc, she returned to Art Media, the parent company of Art in America and ARTnews, first as a senior editor at ARTnews and now as City Guides editor for artguide.pro, the online edition of Art in America’s Guide to Museums, Galleries and Artists. In the 1980s and ’90s, Anne showed her artwork in the US at 303 Gallery, PS1, Hallwalls, Artists Space, and the New Museum of Contemporary Art, and in Europe at the Stedelijk Museum, Amsterdam, and the Centre Georges Pompidou, Paris, among other venues. In 2015 her work was included in the ninth White Columns Annual—a yearly event that New York Times art critic Roberta Smith once called “a view of the past year in the New York art world that is idiosyncratic, ultrahip and useful”; in 2017 Anne selected the show’s 11th iteration. In 2014 and 2017 she had solo exhibitions at Invisible Exports, New York. <img decoding="async" class="size-medium wp-image-1202667676" src="https://www.artnews.com/wp-content/uploads/2019/11/Max-Duron.jpg?w=300" alt="" width="300" height="200" srcset="https://www.artnews.com/wp-content/uploads/2019/11/Max-Duron.jpg 897w, https://www.artnews.com/wp-content/uploads/2019/11/Max-Duron.jpg?resize=400,267 400w" sizes="(min-width: 87.5rem) 1000px, (min-width: 78.75rem) 681px, (min-width: 48rem) 450px, (max-width: 48rem) 250px" /> Maximilíano Durón is a queer Chicanx journalist and critic covering contemporary art. His writing focuses on the work of artists of color, specifically Latinx/Chicanx artists, queer artists, and their intersections, as well as curators, collectors, and scholars whose work has transformed the art world. He has been at ARTnews since 2014 and is currently senior editor, managing the publication’s art fair and Top 200 Collectors coverage. Durón is a winner of the 2023 Rabkin Prize for visual art journalists and a founding member of Critical Minded, an initiative that looks to support the work of a diverse intergenerational group of cultural critics of color. He received his undergraduate degree from NYU in journalism and art history. He can be reached at mduron@artnews.com <img decoding="async" class="size-medium wp-image-1202667686" src="https://www.artnews.com/wp-content/uploads/2019/11/Alex-Greenberger.jpg?w=300" alt="" width="300" height="200" srcset="https://www.artnews.com/wp-content/uploads/2019/11/Alex-Greenberger.jpg 897w, https://www.artnews.com/wp-content/uploads/2019/11/Alex-Greenberger.jpg?resize=400,267 400w" sizes="(min-width: 87.5rem) 1000px, (min-width: 78.75rem) 681px, (min-width: 48rem) 450px, (max-width: 48rem) 250px" /> Alex Greenberger is a senior editor at ARTnews, having started there as an editorial assistant in 2015. He has covered topics ranging from protests against a former Whitney Museum vice chair in 2018 and 2019 to the controversy involving charges of anti-Semitism and harassment in Documenta 15 in 2022. In his criticism, Greenberger has addressed body horror, the history of video art, the legacy of Pablo Picasso, and the work of artists Wangechi Mutu, Wolfgang Tillmans, Marlene Dumas, and innumerable others. His articles have also appeared in Artspace and the Village Voice, and in gallery catalogs. He graduated from New York University with a BA in art history and cinema studies. Reach him at agreenberger@artnews.com <img decoding="async" class="size-medium wp-image-1234683123" src="https://www.artnews.com/wp-content/uploads/2023/10/web-Karen-Ho3176-copy.jpg?w=400" alt="" width="400" height="267" srcset="https://www.artnews.com/wp-content/uploads/2023/10/web-Karen-Ho3176-copy.jpg 1200w, https://www.artnews.com/wp-content/uploads/2023/10/web-Karen-Ho3176-copy.jpg?resize=400,267 400w" sizes="(min-width: 87.5rem) 1000px, (min-width: 78.75rem) 681px, (min-width: 48rem) 450px, (max-width: 48rem) 250px" /> Karen K. Ho is a senior writer at ARTnews, where she covers art crime and business topics that deal with licensing, insurance, operations, and the like. Her reporting and analysis on business, culture, and the media industry have appeared in publications such as Quartz, TIME, GQ, Glamour, Men’s Health, the Cut, Vox, the Columbia Journalism Review, and the San Francisco Chronicle. She is a graduate of the University of Toronto (BA) and the Columbia University Graduate School of Journalism (MA Business). Contact her at kho@artnews.com <img decoding="async" class="size-medium wp-image-1202667668" src="https://www.artnews.com/wp-content/uploads/2019/11/Daniela-Hritcu.jpg?w=300" alt="" width="300" height="200" srcset="https://www.artnews.com/wp-content/uploads/2019/11/Daniela-Hritcu.jpg 897w, https://www.artnews.com/wp-content/uploads/2019/11/Daniela-Hritcu.jpg?resize=400,267 400w" sizes="(min-width: 87.5rem) 1000px, (min-width: 78.75rem) 681px, (min-width: 48rem) 450px, (max-width: '
