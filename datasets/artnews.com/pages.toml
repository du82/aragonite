title = "Hard Choices: Should You Sell Off Your Art Collection?"
description = "An interactive quiz to gauge whether you should sell your art or save it for the future."
full_description = '''Illustration by Pamela Guest With a world in crisis and an art market spinning out of control, ace art-world consultants Chen & Lampert deliver a quiz full of hard choices for Art in America readers from far and wide. Your deep pockets, social connections, and discerning eye for new talent have resulted in a museum-quality freeport filled with some of the finest works made by young artists during the last decade. Now that their careers have matured, it may be time to see if your investments have as well. Answer these questions to find out if it is time to auction off select works or keep everything safely crated for future liquidation. blogherads.adq.push(function () { blogherads .defineSlot( 'medrec', 'gpt-dsk-tab-aia-mid-article1-uid0' ) .setTargeting( 'pos', ["mid-article1","mid","mid-article","mid-articleX"] ) .setTargeting( 'viewable', 'yes' ) .setSubAdUnitPath("art-in-america\/mid-article") .addSize([[2,2],[300,250],[300,251],[620,366]]) .setClsOptimization("minsize") ; }); Related Articles Hard Truths: How Can a Gallery Assistant Overthrow a Decrepit Boss with Dodgy DJ Skills? Hard Truths: Should an Artist Surrender to the System to Avoid Being an "Outsider"? 1. Your taste in art is: a) Encyclopedicb) Eclecticc) Egregious 2. Other collectors speculate, but you: a) Appreciateb) Supportc) Horde 3. The first paintings to go to the auction blocks are: a) Zombie Abstractionsb) French Impressionistsc) Your kid’s art that got miscataloged as a Mark Grotjahn 4. The one painting you’d never part with is a: a) Nude of your current wifeb) Nude of your most cherished mistressc) Nude of yourself 5. Auction commissions make you feel: a) Resignedb) Extortedc) Homicidal 6. When a rival collector buys one of your pieces it makes you feel: a) Validatedb) Regretful c) Richer than them now that you have their money 7. Proceeds from the sale will go toward paying for your: a) First wife’s buccal fat removalb) Second wife’s Brazilian butt liftc) Mistress’s bazookas 8. When a young artist pleads with you not to sell their work you respond: a) “Sorry, it’s mine now and I can do whatever I want with it.”b) “Sorry, I don’t want to damage your career, so the sale is off.”c) “Sorry that I was forced to release the hounds, but you are trespassing on private property!” 9. When a museum director asks you to donate a major work you respond: a) “Is there a particular size or color that you are interested in? I have them all.”b) “Major, you say? There’s a saucy nude in the boudoir that you must see…”c) “Sorry that I was forced to release the hounds, but you are trespassing on private property!” 10. In the end, the reason you are selling is so that: a) You can focus on philanthropyb) Your current wife doesn’t get the art in your upcoming divorcec) You can turn your humble tax shelter into an opulent tax haven SCORES 10–16: Instead of bringing artworks from your collection to auction, you arrange for Vinny from the local pizzeria to pay a visit to your storage. Unfortunately, it might be the case that the whole joint catches on fire from an electrical problem that engulfs the building and all the art goes up in flames. If that were to happen, you would thank your lucky stars and publicly mourn the loss of so many fully insured cultural treasures. 17–23: Screw auction houses! You get the idea to make NFTs, T-shirts, and figurines from the art you own and sell them to hype collectors at Burning Man. Then you invite Alec Monopoly to paint over the original art with his trademark characters and offload all the work to a libertarian tech bro for crypto, a full-body cryo chamber, and a gas-powered Tesla Cybertruck. To the moon! 24–30: The weird thing is that you might actually like art, or even love it. Parting with a cherished painting hurts as much as losing a partner or making a nondeductible donation. Don’t cheat on your heart by dumping spurned works in the cruel marketplace. Hang on for now, you may need them to erect your true passion project: a museum with your name on it. Read More About: Hard Choices hard-truths blogherads.adq.push(function () { blogherads .defineSlot( 'nativecontent', 'AIA-NATIVE-ARTICLE-BOTTOM-uid3' ) .setSubAdUnitPath("art-in-america\/native\/article") .addSize([[1,1],[3,3],[6,6]]) ; });'''
