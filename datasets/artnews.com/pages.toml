["https://www.artnews.com/art-news/news/stonewall-national-museum-in-financial-trouble-trump-dei-desantis-1234734117"]
title = "State and Federal Cuts to Arts and Culture Grants Threaten the Museum's Future"
description = "The museum's CEO says that anti-LGBTQ policies in Florida and Washington D.C. have scared off corporate sponsors and sliced the budget in half."
full_description = '''The Stonewall National Museum, Archives, and Library. Courtesy Stonewall National Museum The Stonewall National Museum, Archives & Library in South Florida claims that that state and federal anti-LGBTQ policies have siphoned off the institution’s operating budget and scared off corporate investors, leaving the museum in financial peril. “This is stretching into places that we really have not seen before. Our future is threatened now,” Robert Kesten, the museum’s CEO, told Axios. The museum calculated that more than half of its $1 million operating budget could disappear. The museum’s troubles began last year when Florida’s Governor Ron DeSantis cut over $32 million in arts and culture grants from the 2025 budget. That financial hit was exacerbated by President’s Donald Trump’s executive orders that called for an end to federal diversity, equity, and inclusion (DEI) programs and the federal grants that fund them. blogherads.adq.push(function () { blogherads .defineSlot( 'medrec', 'gpt-dsk-tab-mid-article1-uid0' ) .setTargeting( 'pos', ["mid-article1","mid","mid-article","mid-articleX"] ) .setTargeting( 'viewable', 'yes' ) .setSubAdUnitPath("ros\/mid-article") .addSize([[2,2],[300,250],[300,251]]) ; }); Related Articles Daniel Sikkema Charged for Hiring His Husband's Killer, Trump's Stronghold on Culture to Have 'Disastrous Effects'? Jeff Koons' Muse Writes a Book: Morning Links for February 12, 2025 USAID Offices Around the Globe Shelve Art to Align with 'America First' Administration Last week, a federal judge blocked large parts of the President’s anti-DEI orders. According to Kesten, the museum earlier this month received a $50,000 grant from the National Endowment for the Arts for educational programs and exhibits. However, given the NEA’s recent emphasis on celebrating “the nation’s rich artistic heritage and creativity by honoring the semiquincentennial of the United States of America (America250)” Kesten has stated that the federal grant tap has, at least for the Stonewall, run dry. The political situation, the museum said, has made corporate donors gun shy. According to the Miami Herald, the Stonewall’s annual gala fundraiser has only one corporate sponsor, compared to at least six recently, and up to 10 in past years. Meanwhile, Kesten told Axios prospective board members who need approval from their employers to join are now hesitant to be associated with the museum. Still, Kesten remains hopeful. “We will be stronger and better than we were before. One way or another, we will be here,” he told Axios. Read More About: Donald Trump Ron DeSantis Stonewall National Museum blogherads.adq.push(function () { blogherads .defineSlot( 'nativecontent', 'AN-NATIVE-ARTICLE-BOTTOM-uid3' ) .setSubAdUnitPath("native\/article") .addSize([[1,1],[3,3],[6,6]]) ; });'''
