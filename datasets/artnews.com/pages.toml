["https://www.artnews.com/art-news/news/crozier-art-shipping-lends-la-wildfires-independent-art-fair-1234733786"]
title = "Art Shipper Gives Independent's LA Exhibitors a Free Ride"
description = "Crozier Fine Arts has pledged to cover shipping costs for six exhibitors traveling to the Independent Art Fair in New York this May."
full_description = '''Courtesy of Crozier In a show of support for Los Angeles galleries impacted by recent wildfires, Crozier Fine Arts has pledged to cover shipping costs for six exhibitors traveling to the Independent Art Fair in New York this May. The initiative, announced in partnership with Independent, will allow Night Gallery, Chris Sharp Gallery, Sea View, Vielmetter Los Angeles, Michael Kohn Gallery, and Diane Rosenstein Gallery to transport works to the fair free of charge. In a press release, Independent founder Elizabeth Dee emphasized the significance of Los Angeles in this year’s edition, calling it a “cornerstone of artistic production and curatorial expertise.” The initiative stemmed from conversations between Dee and Crozier executives, who together recognized the financial strain on LA-based exhibitors and the importance of access to the New York market. blogherads.adq.push(function () { blogherads .defineSlot( 'medrec', 'gpt-dsk-tab-mid-article1-uid0' ) .setTargeting( 'pos', ["mid-article1","mid","mid-article","mid-articleX"] ) .setTargeting( 'viewable', 'yes' ) .setSubAdUnitPath("ros\/mid-article") .addSize([[2,2],[300,250],[300,251]]) ; }); Related Articles Even Before LA's Destructive Blazes, This Museum Show Was Rethinking Our Relationship to Fire Yoshitomo Nara Designs Merch for LA Wildfire Benefit Crozier, which has served as Independent’s lead sponsor since 2020, has previously partnered with the fair on climate-conscious shipping solutions. This latest effort is not only a gesture of solidarity but also part of a broader strategy to reduce costs and environmental impact for galleries exhibiting at major fairs. “Through the extraordinary vision and generosity of leadership at Crozier, we hope this has an impact in not only rebalancing the market for LA galleries, but also in addressing rising costs and minimizing the negative environmental equation,” Dee said. For LA dealers, the support is tangible. “Crozier and Independent have been invaluable partners, demonstrating exceptional support and empowering us to more easily reach our curatorial ambitions,” Susanne Vielmetter of Vielmetter Los Angeles said in the release. Meanwhile, Crozier’s Director of NA West Operations, Ann Samler, called the initiative “an obvious solution” and expressed gratitude for the opportunity to assist. This is the second initiative from Crozier and Independent aimed at easing climate-related challenges for Los Angeles galleries. In 2020, they introduced a consolidated shipping program to reduce emissions and costs for exhibitors—a first for the art fair industry. The partnership has also supported research, including the New York Art Market Report by arts economist Clare McAndrew. Crozier, a global leader in fine art logistics, operates over 1.8 million square feet of storage across 30 locations in 12 markets worldwide. Independent has continued to position itself as a fair that prioritizes sustainability and institutional collaboration, alongside commercial success. The Independent Art Fair, which this year features 82 contributors, runs from May 8–11, 2025, at New York’s Spring Studios. Read More About: Crozier Fine Arts Independent art fair LA Wildfires blogherads.adq.push(function () { blogherads .defineSlot( 'nativecontent', 'AN-NATIVE-ARTICLE-BOTTOM-uid3' ) .setSubAdUnitPath("native\/article") .addSize([[1,1],[3,3],[6,6]]) ; });'''
