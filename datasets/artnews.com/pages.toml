up Oslo Shipping- and finance-related activities Contemporary art View Profile Sign Up B.L Au Hong Kong Publishing Oriental ceramics View Profile Sign Up Maria Nieves Noriega de Autrey and Sergio Autrey Mexico City Telecommunications 19th-century European art; Contemporary Mexican art; Old Masters View Profile Sign Up John P. Axelrod Boston Law practice and business consulting African American art; American paintings; decorative arts View Profile Sign Up Emilio Azcarraga Mexico City Television and publishing View Profile Sign Up Shelli and Irving Azoff Los Angeles Entertainment Contemporary art View Profile Sign Up Dieter Bührle Zurich Industry Impressionist art View Profile Sign Up Bruce Bailey Port Hope, Canada; Toronto Investment banking View Profile Sign Up Richard Brown Baker New York Foreign Service (retired) View Profile Sign Up Angelo Baldessari Bari, Italy Engineering Contemporary art, particularly Conceptualism View Profile Sign Up <div class="profile-blurb // "> <div class=""> <figure class="o-figure lrv-u-max-width-100p" style=""> <div class="c-lazy-image "> <a href="http://data.url" class="c-lazy-image__link lrv-a-unstyle-link" > <div class="lrv-a-crop-16x9" style=""> <img class="lrv-u-background-color-grey-lightest lrv-u-width-100p lrv-u-display-block lrv-u-height-auto" src="{{data.image_src}}" alt="{{data.image_alt}}" /> </div> </a> </div> <figcaption class="c-figcaption "> </figcaption> </figure> </div> <div class="lrv-u-margin-t-050"> <h3 id="title-of-a-story" class="c-title lrv-u-font-family-primary lrv-u-text-transform-uppercase lrv-u-font-size-16 lrv-u-color-black u-font-size-22@desktop-xl"> {{{data.name}}} </h3> <p class="c-tagline lrv-u-margin-tb-00 lrv-u-font-family-primary lrv-u-font-size-14@mobile-max lrv-u-font-size-16 lrv-u-font-size-18@desktop-xl u-color-green-dark lrv-u-padding-tb-050" >{{{data.secondary_taxonomy_terms}}}</p> <p class="c-tagline lrv-u-margin-tb-00 lrv-u-font-size-14@mobile-max lrv-u-font-size-16 lrv-u-font-size-18@deskto