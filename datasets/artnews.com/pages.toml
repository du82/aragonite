["https://www.artnews.com/art-news/news/guggenheim-museum-layoffs-2025-1234734127"]
title = "Guggenheim Museum Announces Layoffs Amid Financial Struggles"
description = "The announcement marks the third round of layoffs in five years with rising overhead costs, lower attendance, and diminished tourism to blame."
full_description = '''Jenny Holzer, Installation for the Solomon R. Guggenheim Museum, 1989/2024. ©2024 Jenny Holzer/Artists Rights Society (ARS), New York/Photo Ariel Ione Williams and David Heald, ©Solomon R. Guggenheim Foundation, New York Another round of layoffs has hit the Solomon R. Guggenheim Museum in New York, as the institution struggles to balance its books in an era of dwindling tourism and rising costs, the New York Times reported Friday. The museum said it was cutting 20 jobs—7 percent of its staff—across multiple departments. Senior leadership, however, will remain untouched, and curators have been spared from the cuts. The move comes despite efforts to steady the ship under Mariët Westermann, who took over as director and chief executive in 2024. Ticket prices have gone up, exhibition schedules have been trimmed down, and the museum’s endowment has grown—but not enough. “Our overall financial picture is not where it needs to be,” Westermann wrote in a staff letter, describing the layoffs as part of a broader “reorganization” meant to improve efficiency. blogherads.adq.push(function () { blogherads .defineSlot( 'medrec', 'gpt-dsk-tab-mid-article1-uid0' ) .setTargeting( 'pos', ["mid-article1","mid","mid-article","mid-articleX"] ) .setTargeting( 'viewable', 'yes' ) .setSubAdUnitPath("ros\/mid-article") .addSize([[2,2],[300,250],[300,251]]) ; }); Related Articles Partnership Between the Hilma af Klint Foundation and David Zwirner Stands to Separate the Artist's Work for Profit Guggenheim Foundation Rebrands With Arabic Typeface as It Prepares to Open Abu Dhabi Branch This marks the third round of job cuts at the Guggenheim in five years, following two previous waves that saw more than 30 staff members let go, including two deputy directors. The museum’s reliance on international tourism—a sector that has yet to recover fully from the pandemic—has been a key vulnerability. Meanwhile, its much-anticipated Guggenheim Abu Dhabi outpost remains in limbo, beset by delays and controversy, with no opening date in sight. The museum’s union, which was not given prior notice of the layoffs, has filed a grievance and is demanding negotiations. “We will take whatever steps are necessary to protect our members’ jobs,” said Olga Brudastova, a union representative. While the Guggenheim remains an architectural icon and a major cultural player, its recent track record suggests a deeper struggle to recapture the blockbuster success of its 2018 Hilma af Klint exhibition, which drew record crowds. Westermann, however, remains optimistic, telling the Times, “I remain steadfastly hopeful and enthusiastic about the opportunities before us.” With budgets tightening across New York’s museum sector, enthusiasm alone may not be enough. Read More About: Guggenheim Abu Dhabi Hilma af Klint Solomon R. Guggenheim Museum blogherads.adq.push(function () { blogherads .defineSlot( 'nativecontent', 'AN-NATIVE-ARTICLE-BOTTOM-uid3' ) .setSubAdUnitPath("native\/article") .addSize([[1,1],[3,3],[6,6]]) ; });'''
