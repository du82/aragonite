["https://www.artofmanliness.com/about-2"]
title = "About the Art of Manliness"
description = "About the Art of Manliness The Art of Manliness is a one-stop resource for actionable advice that covers every aspect of a man’s life: character, career, relationships, fitness, style, skills, and much more. Through weekly podcasts and articles, AoM tackles subjects from the philosophical and serious to the practical and fun. AoM differentiates itself from […]"
full_description = "Podcast #1,048: The Swiss Army Knife of Fitness — How to Get Lean, Strong, and Flexible With Kettlebells Alone Podcast #1,054: Familiarity Breeds Contempt (And Other Underappreciated Consequences of Digital Communication) AboutAbout the Art of ManlinessThe Art of Manliness is a one-stop resource for actionable advice that covers every aspect of a man’s life: character, career, relationships, fitness, style, skills, and much more. Through weekly podcasts and articles, AoM tackles subjects from the philosophical and serious to the practical and fun. AoM differentiates itself from other men’s lifestyle media outlets in providing content that is intelligent, thoughtful, thorough, eminently useful, and clickbait-free.The Art of Manliness is also The Strenuous Life — an online/offline program that helps men directly implement the habits, disciplines, and skills we cover on AoM into their lives. Like a scouting program for grown men, TSL offers a structure that facilitates a man’s growth in body, mind, and spirit.The mission of AoM is to get men not only reading and listening to our content, but ultimately implementing what they learn into their lives; through our articles, podcasts, books, and programs, AoM aims to help men, as Theodore Roosevelt put it, “Get action.” We seek to help men grow up well, reach their potential, become better friends, mentors, husbands, fathers, and citizens, and live a life of eudamonia — skill, flourishing, excellence, and virtue.About Brett & Kate McKayBrett McKay founded the Art of Manliness in 2008 and has grown it into the largest independent men’s interest magazine on the web.Brett grew up in Edmond, OK, a suburb of Oklahoma City, and attended the University of Oklahoma. He took a break in college to live in Tijuana, Mexico for two years doing service. After graduating with a BA in Letters, he then went on to attend the University of Tulsa College of Law. During his second year as a law student, Brett started the Art of Manliness as something fun to do in his spare time. By the time he graduated, AoM had grown into a full-time job, saving him from having to take the bar or ever practice law. Brett enjoys barbell lifting, hiking, and burgers.When AoM quickly and unexpectedly took off after its inception, Brett brought on his wife, Kate McKay, to help. Kate grew up in Tulsa, OK and graduated from BYU with a BA in History. After taking a year to serve with an Americorps organization in San Francisco, she earned her Masters in Religion from Oklahoma City University. Kate has taught American History and Humanities at Tulsa Community College. She enjoys trail running, hiking, and soft pretzels.The McKays have two great kids: Gus, age 11, and Scout, 8.Together they run AoM from its headquarters in Tulsa, OK."
