title = "Being a Man in the Modern World | The Art of Manliness"
description = "The four factors that need to be in place for a man to feel like a man, and why experiencing these qualities has become harder to do in the present age."
full_description = "Podcast #1,048: The Swiss Army Knife of Fitness — How to Get Lean, Strong, and Flexible With Kettlebells Alone Podcast #1,054: Familiarity Breeds Contempt (And Other Underappreciated Consequences of Digital Communication) in: Advice, Character, Podcast Brett • September 6, 2021 • Last updated: March 14, 2022Podcast #592: Being a Man in the Lousy Modern World Emerson famously said “society everywhere is in conspiracy against the manhood of every one of its members.” My guest today says things have gotten a lot worse since Emerson uttered those words over a century and a half ago. His name is Robert Twigger. We last had him on the show to discuss his book Micromastery. Today we discuss a book he wrote 20 years ago called Being a Man in the Lousy Modern World. We begin our conversation discussing how the modern world infantilizes men so they’re easier to control, and whether Robert thinks things have changed since he initially published the book. We then dig into the four factors Robert says need to be in place for a man to feel like a man, and why experiencing these qualities has become harder to do in the present age. We then discuss what Robert did to counter the currents of modern malaise like hiking the Pyrenees mountains and learning a martial art, and whether doing those things actually made him feel manlier. We end our conversation with what men can do to start fighting back against the conspiracy against their manhood.If reading this in an email, click the title of the post to listen to the show.Show HighlightsThe impetus for this book when Robert wrote it 20 years ago What is it about the modern world that makes manliness feel obsolete?How the modern world keeps us perpetually children The 4 factors to be in place for a man to really be a man Watered down modern rituals Is courage truly rare? How do we test ourselves?What is it about handiness that makes you feel manly?Violence and manliness Passivity vs. action Society’s disservice to boys and men How to find courage, rites of passage, and adventure in our world Do these self-made rites of passage make a difference in your psyche? What Robert’s kids thought about the book What can men do today to start feeling more masculine? Resources/People/Articles Mentioned in PodcastMy first interview with Robert about micromasteryPodcast: How to Be Braver9 Ways to Become More CouragousMy 8-Week Microadventure ChallengeShadow Work and the Rise of Middle-Class SerfdomDeveloping the Heroic ImaginationHow to Create Your Own Rites of PassagePodcast: A Man’s Need for RitualCourage vs. Boldness: How to Live With Spartan Bravery100 Skills Every Man Should KnowA Call for a New Strenuous AgeWhen Violence Is the AnswerThe 3 P’s of Manhood: ProtectWhy Every Man Should Be StrongYou’ve Got to Be a Man, Before You Can Be a Gentleman Meditations on the Wisdom of ActionRide the DissonanceThe Magic of WalkingCenter for Practical Wisdom Connect With RobertRobert’s websiteListen to the Podcast! (And don’t forget to leave us a review!)Listen to the episode on a separate page.Download this episode.Subscribe to the podcast in the media player of your choice.Listen ad-free on Stitcher Premium; get a free month when you use code “manliness” at checkout.Podcast SponsorsClick here to see a full list of our podcast sponsors.Read the TranscriptIf you appreciate the full text transcript, please consider donating to AoM. It will help cover the costs of transcription and allow other to enjoy it. Thank you!Brett McKay: Brett McKay here and welcome to another edition of The Art of Manliness podcast. Emerson famously said, “Society everywhere is in conspiracy against the manhood of every one of its members.” My guest today says things have gotten a lot worse since Emerson uttered those words over a century-and-a-half ago. His name is Robert Twigger. We last had him on the show to discuss his book Micromastery. That’s episode number 528, if you wanna check that out. Today we discuss a book he wrote 20 years ago called Being a Man in the Lousy Modern World. We begin our conversation discussing how the modern world infantilizes men so they’re easier to control, and whether Robert thinks things have changed since he initially published the book. We then dig into the four factors Robert says need to be in place for a man to feel like a man, and why experiencing these qualities has become a lot harder to do in the present age. We then discuss what Robert did to counter the currents of modern malaise, like hiking the Pyrenees mountains and learning a martial art, and whether doing those things actually made him feel manlier. We end our conversation with what men can do to start fighting back against the conspiracy against their manhood. After the show’s over check out our show notes at aom.is/twigger.Alright. Robert Twigger, welcome back to the show. Robert Twigger: Thanks for having me. Always, always glad to be talking to The Art of Manliness.Brett McKay: Well, we had you on the show last year to talk about your book Micromastery, and that’s episode number 528 for those who wanna check it out. It’s all about learning new skills, by thinking small. It’s a really great episode, it’s a fan favorite. But we’re gonna talk about a book you wrote almost 20 years ago, it’s called Being a Man in the Lousy Modern World. So tell us, what was the impetus behind this book? Robert Twigger: The real impetus was at that time… So I was writing that in, I don’t know, 1999 or something like that. Exactly 20 years ago. There was a whole spate of adverts in which men were portrayed as dorks and patsies and the women were all smart and sassy. They were often, it was often, they were commercials in people’s homes and it was the dorky husband who couldn’t do anything and the wife was in control. And I just thought, “This is just sending such a stupid, wrong message.” So it was anger and then it all spiraled out from there, so I just started to look at what the role of men was in the lousy modern world.Brett McKay: The way you wrote this, you contrasted… You had a son that was coming. And you contrasted that, trying to figure out what does it mean to be a man in this world? And then contrasted all these adventures you tried to go on to figure that out.Robert Twigger: Yeah, I mean, the other strand in the book was using… ‘Cause my previous couple of books had been these adventures, but I had all these left-over stuff that I’d done, ’cause I was writing for adventure travel pieces for magazines. So I had all this material and thought, “Well, I’ve gotta use it.” And each adventure itself probably wouldn’t have justified a book, so I wove that in and it became… Because the adventure seemed part of being a man, it seemed like a man who shunned any form of adventure always… I guess it was because adventure called forth the need for courage and I knew that courage was a key part of it.Brett McKay: It was funny, the contrast between you getting ready for the arrival of your son. It was like a day in life of just a regular suburban guy living in the western world, barbecues and you’re kind of like, “Ah… ” The way you described is like, “This is not it.”Robert Twigger: Yeah, and I wanted to make it honest and there’s a sort of problem, because the language you use to describe adventures, it doesn’t suit describing relationships, and about what you feel about your kids, and all that sort of thing. So it was a fine line to draw. Also, I didn’t want to just burrow into total sentimentality, because before your kids are born, what can you feel? They’ve just arrived, you don’t know what they’re gonna be like. So it was tricky ground, but as you say, yeah, it’s half that theme through the book, which I keep going back to, which is as the day progresses, that’s the driving force and it’s like a micro-adventure in itself, but it’s Mr. Suburbia, and my life is Mr. Suburbia and I’m just not happy with it. Brett McKay: What is it about the lousy modern world that you felt like that makes manliness feel obsolete? You feel like it’s not suited for men.Robert Twigger: Yeah, there are so many strands here, but just coming from the top, it’s got to be that we have so many prosthetic devices, computers, cars, things that actually take out the physical aspect, and if there’s… There are many differences between men and women, but the most obvious one is there’s a physical strength difference. So if you’re not actually having to use your physical strength at all, you’re different from most men that have come before you in history. So then there’s that side. There’s the skill aspect, even small skills like learning to light a fire, which my dad used to do, lighting a fire in the house. Even things like fixing a car, which he did. I can’t even fix my own car now ’cause I don’t know how to do the codes into the computerized bit. It’s kind of endless, really, the way we’ve become so impotent and we’re just kind of like living like kings in this world of largely electronic back up.Brett McKay: I think that one of the points you make, that I thought was really incisive, is that the modern world does a great job of keeping us like children, even as adults. Like you said, you can’t even fix your own car because there’s a computer that you have to be able to program and you have to be licensed to do that change. And you make this point that children are easier to control than adults and you make the… Some would say a cynical conclusion that, well, that’s what corporations and governments want, they want us to be easily controlled.Robert Twigger: Well, yeah, it may not be… I don’t think there’s some kind of conscious uber mind who’s saying that, “Let’s infantilize our entire population,” but it just seems to work out better that way. So maybe there’s sort of evolutionary imperative at work inside corporations and big organizations that gradually the solution that infantilizes the workforce seems to work better. So, you kind of, by increments, move towards that position, and it’s generally the case. Yeah. I mean, even the police, when for example, somebody stands up and defend themselves against a mugging, there’s always the warning from the police, the police say, “Don’t do this in future… It’s a dangerous thing to try and defend yourself.” At the same time as the newspaper report is saying, “Oh, what a great thing. The 78-year-old guy fought off the mugger.” So, there’s this constant message that you’re better off just being like a kid, really.Brett McKay: But the insidious thing is that because of all these advances, things are cheap. We’ve got all this technology that basically gives us the world at our fingertips. It makes us feel like we’re in control, but sometimes really not in control.Robert Twigger: Yeah, it’s a weird idea of control, isn’t it? It’s a bit like… We already had it today. When the computer works, you’re apparently in control. As soon as it doesn’t work, you discover the exact imitations of your control. If you can’t fix something, how much can you say you’re in control? I think being able to fix stuff is a key part of being a man. And when we live in a world where we can’t fix things very easily, maybe we’re just going along on someone else’s ride.Brett McKay: I guess, yeah, Emerson’s right. He said that the society everywhere is in conspiracy against the manhood of every one of its members. Robert Twigger: Well, yeah, that was, what, 150 years ago, something like that.Brett McKay: And so you wrote this 20 years ago and you were seeing this stuff then. How have things changed? Have things gotten worse? Has it stayed the same? Have we seen things get better in some places? Robert Twigger: Yeah, it’s weird how things have changed. In some ways, it’s got a lot worse. Things that I could humorously joke about then, you can’t really joke about now ’cause you’ll be targeted as somebody, you know, that’s not something you can joke about. Things have become off limits, so that’s kind of worse. The better side is, there’s been a… There’s been a growth in things, the Art of Manliness came along. There’s been a growth in people becoming more aware of mental health issues of young men, which is a tremendous problem. So those kind of knowing jokes, “Oh, it’s the men.” The other day I was at a party and some woman, somebody made some mocking comment about men with respect to mental health. I was able to sort of pull the “it’s a serious subject, kind of thing.” I didn’t have to back off and take it. So there’s been a bit of a push back there, but it’s at a big cost. We’ve seen…Robert Twigger: I talk about it in the book, I talk about how criminality is a kind of refuge. It’s like the last refuge of masculinity for many men. If you haven’t got much imagination and you can’t get yourself off and do a dangerous or interesting adventure, you’re probably drawn to criminal behavior. We’ve seen a massive or increasing rise in criminality, and that kind of area and its spillover into mental health issues. So, in that sense, worse. It’s pretty similar, though. Brett McKay: So, in the book, you lay out, you lay out four factors that you think need to be in place for a man to be considered a man. So, this is, again, this is what you said 20 years ago, this might have changed, but what were those four factors that you saw? Robert Twigger: So, the four factors were killing a beast. Courage is one. Ability to… A set of skills, that were basic skills that seemed to be involved with being a man and passing a rite of passage. That’s something that I circle in the book, which is that men seem to have the need to have undergone some kind of test of difficultness or dangerousness, and it’s a before and after. And you see it characterized in even things like a bar mitzvah or other rites of passage after which you are a man, it’s a ritual.And I think that if anything, that’s… Just to sort of move on a bit from those four characteristics, that’s one of the key issues of the book is that this lack of ritual in our society means the transition from a boy to a man is blurred, or never even exists. And I think rituals are the way we make transitions, and we’ve lost sight of that. Brett McKay: We sort of still have rituals, but as you point out in the book, they’re sort of watered down.Robert Twigger: Yeah, yeah, there’s things like pass your driving test. Brett McKay: Graduate high school, graduate college, get your first job.Robert Twigger: Yeah, yeah. And they’re lame as hell. You can’t really look at yourself and think, “Yeah, I’m on… I can stand shoulder to shoulder with people who were in the First World War or single-handedly paddled their way up the Amazon,” or something. So it’s a sort of… You’re gonna just feel lame if you accept the culture.Brett McKay: They’re male rites of passages for this lousy modern world.Robert Twigger: Yeah, exactly. Brett McKay: But yeah, you said this idea, like a rite of passage. It really can help a boy transition. It has those factors, there’s an"
