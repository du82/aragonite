full_description = "Podcast #1,048: The Swiss Army Knife of Fitness — How to Get Lean, Strong, and Flexible With Kettlebells Alone Podcast #1,054: Familiarity Breeds Contempt (And Other Underappreciated Consequences of Digital Communication) in: Character, Habits, Podcast AoM Team • December 29, 2021 • Last updated: April 5, 2022Podcast #581: The Tiny Habits That Change Everything We’re a month into the new year now. How are you doing on your resolutions? Have you already fallen off the wagon? Maybe the goal you set for yourself was just too big to successfully tackle. You need to think smaller. Tiny, even.That’s the argument my guest makes. His name is Dr. BJ Fogg, and he’s the founder and director of Stanford’s Behavior Design Lab, as well as the author of the new book Tiny Habits: The Small Changes That Change Everything. Today on the show, BJ walks us through the three components that drive our behavior, including the simple yet overlooked relationship between motivation and ability. He then explains how to build habits that feel easier and require lower levels of motivation by picking behaviors that are good matches for you and breaking them down into smaller parts. We also talk about the need to tie your habits to turnkey prompts, the importance of celebrating your successes, no matter how small, and the way tiny habits can lead to bigger changes. We end our conversation with why you should think about the process of getting rid of your bad habits as untangling them rather than breaking them. Resources Related to the PodcastWhat Makes Your Phone So Addictive and How to Take Back Your LifeA Proven System for Building and Breaking HabitsHow to Create Habits That StickHow to Hack the Habit Loop (and my podcast with Charles Duhigg about habits)The Motivation MythHow to Stress Proof Your Body and BrainCounterintuitive Advice on Making Exercise a Sustainable HabitStick With It — The Science of Behavior Change7 Tips on Making and Breaking HabitsHow to Disenchant Your HabitsConnect With BJBJ’s websiteTinyHabits.comBJ on TwitterListen to the Podcast! (And don’t forget to leave us a review!)Listen to the episode on a separate page.Download this episode.Subscribe to the podcast in the media player of your choice.Listen ad-free on Stitcher Premium; get a free month when you use code “manliness” at checkout.Read the TranscriptBrett McKay:If you appreciate the full text transcript, please consider donating to AoM. It will help cover the costs of transcription and allow others to enjoy it as well. Thank you!Welcome to another edition of The Art of Manliness podcast. We’re a month into the new year now. How are you doing on your resolutions? Have you already fallen off the wagon? Maybe the goal you set for yourself was just too big to successfully tackle. You need to think smaller. Tiny, even.That’s the argument my guest makes. His name is Dr. BJ Fogg, and he’s the founder and director of Stanford’s Behavior Design Lab, as well as the author of the new book Tiny Habits: The Small Changes That Change Everything. Today on the show, BJ walks us through the three components that drive our behavior, including the simple yet overlooked relationship between motivation and ability. He then explains how to build habits that feel easier and require lower levels of motivation by picking behaviors that are good matches for you and breaking them down into smaller parts. We also talk about the need to tie your habits to turnkey prompts, the importance of celebrating your successes, no matter how small, and the way tiny habits can lead to bigger changes. We end our conversation with why you should think about the process of getting rid of your bad habits as untangling them rather than breaking them.After the show is over, check out our show notes at aom.is/tinyhabits.All right, BJ Fogg, welcome to the show.BJ Fogg:Hey. I’m happy to be here. Thanks for inviting me.Brett McKay:I’m really excited to have you on because I have been following your work through other people, students you’ve had on your classes that you teach about behavior design, and I was so excited to see you have a book putting this all together in one place. You’ve spent your career researching developing what you call behavior design. How did you get involved with that?BJ Fogg:Well, if you rewind about 25 years, I was really interested in the overlap between technology and persuasion or influence, which hadn’t happened yet, but I in some ways just sensed that computers would be designed to influence our attitudes and our behaviors, and I wanted to study this. That’s what I did in my doctorate work, ran a series of laboratory experiments to show this could indeed happen, and then predicted it will, and then set out some warnings and some guidelines for this. I called that persuasive technology.About 10 years ago, my labs work at Stanford shifted away from persuasive technology. We just really weren’t interested in that anymore, and we thought we’d really done what we needed to do there. Then it became what we now call behavior design, which is different than persuasive technology. It still has to do with human behavior change, but doesn’t have to do anything with technology directly.The interest is a long-held interest, and I think it actually goes back to my Mormon roots. I was raised Mormon in California, and probably most people listening understand that that culture, that religion is a lot about behavior change. There’s a lot of restrictions, a lot of things you can’t do. When people become Mormon, they have to make a lot of behavior change. At least the way I see it in retrospect, I grew up very, very young talking about behavior change and doing behavior change things and helping other people change their behavior.Brett McKay:Well, and your work with persuasion technology, this has been used by… This shaped a lot of the apps we use today, Instagram, Uber. The companies that developed these apps, they used insights that came out of your research.BJ Fogg:Yeah, I think the biggest takeaway from my work is simplicity. Simplicity is the thing that I saw early on that made technologies that engaged people. Unless you were forced to use it like an Office suite that was complicated, yeah, you were forced to use that complicated thing, but everything that people were choosing for themselves and using, the overriding pattern was simplicity. That’s really what I taught and advocated at Stanford and elsewhere. It’s one of my maxims today that you’ll find in Tiny Habits, is simplicity changes behavior.Brett McKay:As you said, you shifted focus more towards behavior design. It’s not just tied to technology; it’s about designing behavior, making new habits, untangling habits you don’t like. We’ll talk about why you call it untangling, not breaking habits. In this model of behavior design… First off, the behavior design, you have a model that explains human behavior and methods that you can use to change behavior. Let’s talk about this model first, because I think it’ll help people understand why we do what we do. Part of that model, you mentioned simplicity. Walk us through the Fogg model of behavior.BJ Fogg:Yeah, so there’s various models in behavior design. The cornerstone is just this one, called the Fogg Behavior Model, and it goes like this. Behavior happens when three things come together at the same moment, motivation to do the behavior, ability to do the behavior, and a prompt. That model describes any type of behavior. It can also be used to understand how to stop the behavior. You remove motivation or you remove ability, in other words, you make it harder, or you remove the prompt. I write it out as B, B is behavior, equals MAP, Motivation, Ability, Prompt. It’s a model, not an equation, but I still write it out with the equals sign.Brett McKay:Walk us through a behavior that can highlight this connection of motivation, ability, and prompt.BJ Fogg:Oh, wow, there are so many. Let’s say that your son is sitting around playing video games, and you fix dinner for him. Your son is motivated to eat and is capable to eat, but until you prompt your son, say, “Hey, time for dinner,” he’s not going to come to the dinner table. In that case, there’s motivation because he’s hungry. There’s ability because he’s just sitting around, he’s not busy, and it doesn’t cost anything for dinner, so he has ability. In that case, the thing that he’s lacking to do the behavior, come to dinner, is the prompt.As you look at any behavior that you do, you will always have some level of motivation, there’ll be some level of ability, and there will always be a prompt. You can look at any behavior you do, whether it’s opening a certain email or answering your phone or texting your mom or eating an apple for lunch, all of those behaviors can be understood in terms of those components, behavior, motivation, ability, prompt. It also helps you design for behaviors. That’s what the Tiny Habits method is all about. You’re hacking those components to make the process and method of habit formation really, really easy to do and really reliable.Brett McKay:Your behavioral model was really eye-opening. One of the things that I got out of it, that really hit me hard, was this connection of motivation and ability. If something is really hard to do, well, that means you’re going to need more motivation to do it. But if something is easy to do, you don’t need as much motivation to do it.BJ Fogg:Yeah. I am so happy that in my book Tiny Habits, I unpack that. For the first time, I really dive into the behavior model and I talk about the components, and I show that relationship between motivation and ability. You summarized it well. There’s a graphic. Yes, there’s a written version of the model, but there’s also a graphic. There’s a curved line on the graphic that shows that relationship.It’s embarrassing to say that it took me eight years to figure out the right word for that relationship, but I’ll share it here. It’s kind of geeky. It’s a compensatory relationship. They can compensate for each other, like teammates. If motivation is low or weak, then ability has to be high. It has to be really, really easy. In other words, if you’re not super motivated to do something, the only way that you’ll do it is if it’s really, really easy to do. On the flip side, if a behavior is hard to do, the only thing that puts you above the action, the only thing that gets action is if your motivation is high,Understanding that motivation and ability… I used to talk about it as trade-offs. It’s not really a trade-off. They compensate for each other. Actually, it was that insight that led to developing the Tiny Habits method. As I looked at my own graphic, the two-dimensional version, I saw in the lower right-hand corner a space where, if the motivation is low, you could still do the behavior if it’s easy enough, if you make it radically easy. Boom, there’s some motivation. It’s not zero. And you make it really easy. That means the only thing you’re lacking is a prompt. There was a moment when I figured out how to hack the prompt, and then they all came together. That then became the Tiny Habits method. It got derived from looking at my own graphic going, “That’s a really interesting space right there.”The opposite is people picking something hard to do. If you pick something hard, like “I’m going to work out for two hours every day” or “I’m going to do CrossFit from now on” or I’m going to save $1,000 a month,” that means your motivation has to be high and stay high. You have to sustain motivation. That’s really unrealistic. We don’t have that much control over our levels of motivation, and that means, by setting yourself up for these hard behaviors, these hard changes, you somehow have to magically find a way to keep your motivation high, and that doesn’t work very well. Tiny Habits acknowledges that and says, “No, scale it back, make it really easy, so you don’t have to mess around with motivation and you don’t have to rely on willpower.”Brett McKay:Well, let’s unpack this idea of motivation, because I think you’re right. When people decide they want to change a behavior, start a habit, they think, “I have to do something really hard, and then I’ve got to motivate myself.” Motivation is an interesting part of psychology and behavioral science because you see different definitions of what motivation is, and there’s a different definition for the layperson. I think a layperson thinks, “Well, motivation is like reading quotes and telling myself mantras.” How do you define motivation in your behavioral model?BJ Fogg:Well, it’s a driving force. It’s something that energizes you to do a specific behavior. I don’t think of motivation as something that is generalized to everything in your life. Your motivation shifts context by context, in some ways, minute by minute. Say I’m in a context where I’m a researcher at Stanford. That means I am more motivated to do things that are in line with that identity. But if I’m at a family reunion with my family in Idaho, I have different motivations at that time.What had not been studied academically, and this is a huge surprise to me, I’d already mapped out and understood that motivation shifts over time. Along with some of the bootcampers I work with, we named that fluctuation. We called it motivation wave. I really like that phrase. Basically, I like it because waves don’t always stay high. They come and go. There are big ones; there are small ones. They shift.The academic work on this had not existed until, oh, there’s some early sense of it in 1999, and then more work in 2007, in other words, from an academic perspective, really recently. That may not sound recent to people listening, but work goes back decades and decades, so it’s just in some ways very surprising that there was no acknowledge or research around shifts in motivation until relatively recently. The fact is we’ve all experienced that in our life. People get really motivated in early January, and the motivation drops off. We get motivated for something else around February 14th. We get motivated for something else around April 15th, which in the U.S. is taxes. We have different motivations that shift over time.One of the key, what shall I say, challenges is that when people sit down, and you said this well, and said, “Hey, I’m going to change, and I’m going to do these big things,” at that moment when they’re making those decisions and making the plan, yes, their motivation is high. In that moment, they can do hard things. Well, we seem to be terrible, as human beings, is projecting our future levels of motivation. Even though we’ve seen that, oh, two weeks from now, I may not be so motivated, we seem to make the same mistake over and over and over, and we just assume that we’ll be able to sustain high levels of motivation, which doesn’t work.That’s what Tiny Habits is… In some ways, in the book, I… Attack is too strong a word. I dismantle that. I’m just "
