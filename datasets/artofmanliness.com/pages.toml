description = "Cal Newport and I discuss his newest book, Deep Work, in this episode of the podcast. You'll learn new tactics for focusing deeply on the task at hand."
full_description = 'Podcast #1,048: The Swiss Army Knife of Fitness — How to Get Lean, Strong, and Flexible With Kettlebells Alone Podcast #1,054: Familiarity Breeds Contempt (And Other Underappreciated Consequences of Digital Communication) in: Behavior, Character, Podcast Brett • January 12, 2016 • Last updated: September 28, 2021Podcast #168: The Value of Deep Work in the Age of Distraction <span data-mce-type="bookmark" style="display: inline-block; width: 0px; overflow: hidden; line-height: 0;" class="mce_SELRES_start">﻿</span> Have you ever spent an entire day at work feeling really busy, clearing out your emails (and sometimes looking at Facebook) — and yet at the end of the day you realize you weren’t very productive at all? And when you resolve to do better the next day and dig into deeper work, you find that you can’t focus. You still have an overpowering itch to check your email or scroll through your Instagram feed.If that sounds familiar, today’s show is for you. My guest, Cal Newport is the author of So Good They Can’t Ignore You, and our last podcast together on how you shouldn’t necessarily follow your passion is one of our best and most popular of all time.Cal now has a new book out called Deep Work: Rules for Focused Success in a Distracted World, and it’s just as insightful and paradigm-shifting as his last. In today’s podcast Cal and I discuss why being able to concentrate deeply on hard tasks is the skill that will set you apart in today’s marketplace and how deep work can lead to a more meaningful life.Show HighlightsThe difference between deep work and shallow workWhy deep work is becoming increasingly rarer and consequently more valuable in today’s worldWhy the productivity metrics that businesses and individuals use actually make them less productiveHow the concept of deep work and craftsmanship are connectedHow deep work can bring more meaning to your lifeHow to develop the deep work habitHow rituals can encourage deep workWhy taking time away from work can make you more productive at workWhy you should consider quitting social mediaHow embracing boredom will strengthen your focus “muscle”And much more!zDeep Work is now one of my all-time favorite books, and I’m not joking when I say it was a life-changing read for me. I think it can be for you too. If you’re looking to become more focused in your work and your life, you’ll find sound principles and tactics in this book on how to do so. I especially recommend Deep Work if you’re a student. It will dramatically change the way you approach studying. And be sure to read Cal’s blog for even more great advice on how to have more deep work in your life. It’s one of the few that I follow regularly.Listen to the Podcast! (And don’t forget to leave us a review!)Listen to the episode on a separate page.Download this episode.Subscribe to the podcast in the media player of your choice.TranscriptBrett McKay: Brett McKay here and welcome to another edition to The Art of Manliness podcast. Have you ever spent an entire day at work and in your life feeling that you’re really busy? You’re doing all this stuff. You’re sending emails. You’re getting to-dos done. You’re checking stuff out on your newsfeeds. At the end of the day you look back and you realize man, I really wasn’t all that productive. I didn’t get much done even though I felt busy. On top of that, my brain feels fuzzy. I feel distracted. I can’t really focus. I have this anxiety that there’s stuff that I need to be doing, but I don’t know what it is. If that’s you, this podcast is for you. My guest today is Cal Newport. I’ve had him on the show before. He talked about his book, So Good They Can’t Ignore You. Anyways, Cal is back with a new book called Deep Work: Rules for Focused Success in a Distracted World.Guys, this is one of the best books I’ve read. It’s a big life changing book for me. I’m not exaggerating with this. In Deep Work, Cal makes the case that we live in an environment and in a culture that promotes shallow work, distracted work that doesn’t really get a lot done and it keeps us away from deep work which requires focused, intense concentration for long periods of time. This deep work, if we’re able to develop this skill of doing deep work will set us apart in our career, in the economy and also give us a more meaningful life. Today on the podcast we discuss Cal’s case for deep work as well as practical nuts and bolt tips to help you have more deep work in your life. Really great actionable tips in this podcast. Get a pen and paper. You’re going to want to take notes. Without further ado, deep work with Cal Newport. (music) Cal Newport, welcome back to the show.Cal Newport: Hi, Brett. Thanks for having me back.Brett McKay: Yeah. We had you about a year ago, I think a little over a year ago for your book, So Good They Can’t Ignore You. That was a really well received podcast. I still get emails about that podcast. You’re out with a new book that I think in a way takes So Good They Can’t Ignore You and extends on it a little bit. Not a little bit, but a lot. It’s called Deep Work: Rules for Focused Success in a Distracted World. Loved it. One of my favorite books that I’ve read. Let’s talk about what is deep work? Your book is called Deep Work. Let’s talk about what is deep work?Cal Newport: Deep work is the term I coined to describe the activity of focusing without distraction on a cognitively demanding task.Brett McKay: Okay. How did you stumble upon it? You flush it out more. We’ll talk more about it, but how did you stumble upon this concept of deep work? What’s the opposite of deep work?Cal Newport: Yeah. The opposite of deep work is shallow work, which I define to be work that it doesn’t require intense undistracted focus. It’s work that tends to be a little bit more logistical in nature and that doesn’t really leverage your skills at a high level, that is someone else could replicate it pretty easily. That would include things like answering emails, meetings, maybe optimizing your social media analytics setup. These type of things that are logistical, but don’t require a lot of intense focus. It’s an important dichotomy, I think. You have deep efforts on one hand and shallow on the other. It’s not that one is good or one is bad, but they’re two different types of work.Not all work is work. They both have their value, but recognizing that you need to do both, just having a different term for each. Making that distinction at least in my own life was a real step forward. It got me out of this trap of hey, anything that possibly has a benefit is work. I should just be doing stuff and be busy all the time. It gave me a more nuanced understanding of work where I see it more that shallow work is a necessary evil. It’s the stuff that allows you to keep your job, while deep work is the stuff that’s going to help you get promoted. It’s the stuff that’s really going to make a difference.Brett McKay: What are some examples of deep work from your own life and maybe from the lives of other people you’ve looked into?Cal Newport: Anytime you’re applying your skills with essentially at the limit of your ability to try to produce the best thing you’re currently capable of producing with your skills that’s deep work. In my own life, my day job is I’m a computer science professor. I work in theoretical computer science which is essentially proving math proofs is what I do for a living. Certainly, it’s a clear example of deep work when I’m grappling, for example, to get a mathematical proof to work. Or, in my life if I’m trying to read someone else’s academic paper and understand their techniques trying to figure out what they’re doing. That’s something that requires deep work.In other fields this shows up in different guises. It could be, for example, in your life, Brett, when you’re trying to actually write a compelling and well researched piece of content. That’s going to be an example of deep work or if you’re into a business context really trying to understand say the business landscape and come up with a new strategy. It could be deep work. Finally, I think it’s worth noting that the act of learning things that are hard necessarily requires deep work. Anytime you’re actually trying to pick up a new skill or master a new piece of information or technique that’s also going to be deep work.Brett McKay: That segues to that deliberate practice. You’ve written a lot about this.Cal Newport: Yeah. Deliberate practice is what’s required to pick up cognitively demanding skills. Deliberate practice we know from both psychology and neuroscience requires intense concentration. If you’re good at deep work, one of the things you become good at is learning things very quickly. This is one of the advantages you get from the skill.Brett McKay: Yeah. Let’s talk about that. You make the case that deep work is becoming more and more rare today, which makes it more and more valuable. Let’s talk about first why it’s so rare. Why is deep work becoming so rare in today’s economy and environment?Cal Newport: Yeah. I think this is the core idea behind this book. I call it the deep work hypothesis. The whole reason for this book to exist is deep work. This thing I’m talking about is becoming more rare at exactly the same time that I think it’s becoming more valuable in our economy and because of that, that means if you’re one of the few who actually cultivates this skill who actually tries to systematically develop a deep life, you’re going to thrive. It’s going to be like a superpower. If you’re someone who actually systematically trains your ability to focus, you can become deeper and deeper and higher and higher intensity when you concentrate and it aggressively protects and supports time in your schedule to do deep work. My whole argument is you are going to thrive in almost any knowledge work job. If we go back to this deep work hypothesis, the two elements are it’s becoming rare while it’s becoming more valuable.You’re asking why is it becoming more rare? I think this is one of the big stories in business in the last one to two decades is that as work is becoming more competitive and more complicated, as work is getting to this place where the ability to focus and to learn things and to produce things at high level values becoming more valued, we’re actually seeing most of the trends in the workplace being antithetical to depth. We’re seeing things always on email culture. We’re seeing the rise of OpenOffice. We’re seeing the rise of Office Instant Messenger tools. All of these things make it almost impossible to work deeply. I think this is a huge trend in business. I have several hypothesis for why this is happening, but I think we all agree that it is happening that most people probably find it harder today by an order of magnitude that might have been 20 years ago to find time to really focus hard on things that matter.Brett McKay: Right. For me, I have the trouble with living within my inbox. The problem with email the way the inbox are set up is that everything is treated as equally important.Cal Newport: Yeah. We could step back and say, “Why would businesses ever promote behaviors that makes businesses run worse?” Right? It seems a little bit paradoxical. My hypothesis, the one I lay out in the book and I think there’s other reasons, but my hypothesis is a defining feature of knowledge work that it’s very difficult as the economist would say to measure the marginal productivity of an individual. What that means is because of the complexity of the work, it’s very hard to isolate one person and say, “Here’s how much value they’re bringing to our company.” In a way, that would be easy to do if you were say a door to door salesman. Right?Brett McKay: Right.Cal Newport: You bring in this many dollars or if you’re on an assembly line you process this many widgets. Knowledge work is complicated. My conjecture is in the absence of this type of direct feedback of, “This behavior is making us more profitable. This behavior is making us less profitable,” what’s going to thrive? I claim what’s going to thrive are behaviors that are easier for you in the moment. This is the reason, for example, why a culture where everything is done in email, everything goes in the one inbox and you’re just expected to respond pretty quickly to any email you receive. Why does that thrive? It makes your life in the moment easier. You don’t have to sit there and plan in advance. “Okay, how is my work going to unfold this week? What am I going to need to get my work done? Let me make sure that I’ve sent this memo to this person a few days in advance so I can get the stuff I need.”You don’t have to manage your workflow in a complicated way. You can just get there in your inbox and just start rock and rolling and figure things out with messages as you go around. Now, it turns out that this is incredibly ineffective. It’s also psychologically incredibly draining, but it’s easier. Right? You don’t have to think that much about your work. You don’t have to have a master of workflow. You just get in your inbox and do things. I think this is why we see deep work being squelched. It’s hard to directly measure its impact on the bottom line. Therefore, in its absence things that are easier in the moment are going to thrive. A lot of the behaviors that are easier tend to be behaviors that fragment your attention and hurt your ability to focus.Brett McKay: Right. You talk more detail about that. That was interesting about there’s a culture where yeah, if you respond to your email fast or quickly and you respond to a lot of emails it shows to the rest of your co-workers I’m working. Right? I’m doing my job. Or, having that green dot on all the time even when office hours are over. It shows I’m really dedicated, but you might not be even doing anything at all like anything productive.Cal Newport: Yeah, that’s right. Deep work is what allows you to produce things of real value. It’s what uses your skills. If your attention is constantly fragmented you can’t do deep work. From a cognitive perspective, you’re operating at a severe disadvantage. I think it’s worth emphasizing that easy is not the same thing as productive. Making your life easier does not necessarily make you better at your job. I think the right analogy to understand how a lot of organizations work today would be to imagine if you had an assembly line back in the industrial age. Let’s say it’s a complicated assembly line. There’s different materials and tools are needed at different stations. They’re used up at different rates. Imagine you said, “Here’s what we’re going to do. It’s too complicated to try to figure out in advance the inventory and the distribution of tools. Let’s just put all the resources and all the tools in a big pile in the parking lot.”That was really easy. No one has to think about workflows and change of inventories. If you need something you know where it is. You just go to th'
