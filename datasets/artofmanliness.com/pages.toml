title = "How to Develop Greater Self-Awareness | Art of Manliness"
description = "95% of people say that they're self-aware. But only 10-15% of people actually are. This blind spot can have big repercussions for our success and happiness."
full_description = "Podcast #1,048: The Swiss Army Knife of Fitness — How to Get Lean, Strong, and Flexible With Kettlebells Alone Podcast #1,054: Familiarity Breeds Contempt (And Other Underappreciated Consequences of Digital Communication) in: Advice, Character, Podcast AoM Team • June 22, 2022 • Last updated: June 21, 2022Podcast #644: How to Develop Greater Self-Awareness 95% of people say that they’re self-aware. But only 10-15% of people actually are. As my guest today says, that means “on a good day, 80% of us are lying to ourselves about how much we’re lying to ourselves” and this blind spot can have big repercussions for our success and happiness. Her name is Tasha Eurich, and she’s an organizational psychologist and the author of Insight: Why We’re Not as Self-Aware as We Think, and How Seeing Ourselves Clearly Helps Us Succeed at Work and in Life. Tasha kicks off our conversation by arguing that our level of self-awareness sets the upper limit of our individual effectiveness and that self-awareness can be developed and is truly the meta skill of the 21st century. She then unpacks what it is you know about yourself when you possess self-awareness, how there are two types of this knowledge, internal and external, and how you can have one without the other. Tasha then outlines the seven pillars of self-awareness, the barriers to getting insights into them — including falling into the cult of self — and how these barriers can be overcome, including asking yourself a daily check-in question. We then discuss how two of the most common methods for gaining self-knowledge — introspection and journaling — can in fact backfire and how to do them more effectively by asking yourself what instead of why, and actually journaling less instead of more. We also get into why you should be an in-former, rather than a me-former on social media, how to become more mindful without meditation, and how to solicit and handle feedback from other people, including holding something called the “Dinner of Truth.”Resources Related to the PodcastAoM Podcast #112: The Science of InsightsAoM Podcast #530: How to Get More “Aha” InsightsAoM Article: Define Your Core ValuesAoM Podcast #607: The 7 Habits of Highly Effective PeopleAoM Article: You Need a Reset DayAoM Podcast #614: Get Out of Your Mind and Into Your LifeAoM Article: Why I Stopped JournalingAoM Article: Questions That Will Crush the Fear of Missing OutAoM Podcast #246: How to Get Better at Taking FeedbackTasha’s Insight QuizConnect With TashaTasha’s WebsiteTasha on TwitterListen to the Podcast! (And don’t forget to leave us a review!)Listen to the episode on a separate page.Download this episode.Subscribe to the podcast in the media player of your choice.Listen ad-free on Stitcher Premium; get a free month when you use code “manliness” at checkout.Podcast SponsorsClick here to see a full list of our podcast sponsors.Read the TranscriptBrett McKay: Brett McKay here, and welcome to another edition of The Art of Manliness podcast. 95% of people say that they’re self-aware but only 10 to 15% of people actually are. As my guest today says, that means on a good day, 80% of us are lying to ourselves, but how much we’re lying to ourselves, and this blind spot can have big repercussions for our success and happiness.Her name is Tasha Eurich, she’s an organizational psychologist and the author of, Insight: Why We’re Not as Self-Aware as We Think, and How Seeing Ourselves Clearly Helps Us Succeed at Work and in Life. Tasha kicks off her conversation by arguing that our level of self-awareness sets the upper limit of our individual effectiveness, and that self-awareness can be developed and is truly the meta-skill of the 21st century. She then impacts what it is you know about yourself when you possess self-awareness.Now there are two types of this knowledge, internal and external, and how you can have one without the other. Tasha then outlines the seven pillars of self-awareness, the barriers to getting insights into them, including falling into the cult of self and how these barriers can be overcome, including asking yourself a daily checking question.We then discuss how two of the most common methods of gaining self-knowledge, introspection, journaling can in fact backfire, how to do them more effectively by asking yourself what instead of why, and actually journaling less instead of more. We also get into why you should be an informer rather than a me-former social medium, how to become more mindful without meditation and how to solicit and handle feedback from other people, including holding something called a “dinner of truth”. After the show’s over, check at our show notes at aom.is/self-awareness.Alright, Tasha Eurich, welcome to the show.Tasha Eurich: Thanks for having me.Brett McKay: So you are the author of a book, you’re a consultant, psychologist and authored this book called, Insight: It’s All About Developing Self-awareness. Let’s talk about your background. How did you end up focusing your career and consulting on helping leaders and just everyone develop more self-awareness?Tasha Eurich: So I’ve been an organizational psychologist for more than 15 years, but before that, I was the daughter of an entrepreneur. I’m actually a third generation entrepreneur, and so I grew up literally watching my mom run a company. And I’ve always been very passionate about business, I actually think it’s the greatest personal growth tool there is in some sense.But I fell in love with psychology at the same time, and I was lucky enough when I was kind of ending college to find this field of organizational psychology, where essentially the goal is to help create prosperity, both financially and then just more generally in businesses, by helping leaders be better, by helping companies create better cultures, and so I went all in. I went and got my PhD in the field, and have really never looked back.So for me, part of what I focus on in my consulting work is I coach, usually the top one or two levels in mid to large sized organizations, so CEOs and their direct reports. And what I kept seeing over and over and over for so many years, was this very distinct pattern.And it was that the leaders and executives I coached who were willing to question the assumptions they had about themselves, who were willing to get sometimes brutal feedback about how they were showing up and what kind of leader they were, and who were willing to do the work and make changes and really figure out how they can show up in the best possible way, were infinitely more successful. But they weren’t just more successful, they were happier, they were more confidence, they had more sustainable success.And as I started to think about this, the buzzword of “self-awareness” had emerged, but what I wanted to know, my background is scientific, is, is self-awareness actually as important as I thought it was? Were the common pieces of wisdom out there, you read a Forbes article that says, “Get more feedback,” were those things actually true?And so I convened a research team, it’s been more than seven years ago now, where we wanted to know, what is self-awareness? Where does it come from? Why do we need it? And then probably most importantly, how do we get more of it? And it’s been such a fascinating ride, we’ve learned that a lot of the most commonly accepted truths about self-awareness, what it means, how to get more of it, are wrong. So there’s a lot there.Brett McKay: Well, you open the book saying, arguing that self-awareness, you call it the meta-skill of the 21st century. Why do you think it’s such an important skill to have these days, what is it about modern work and just life in general in the 21st century that requires being more self-aware?Tasha Eurich: Sure. Let me give you a couple of scientifically supported outcomes of self-awareness, and then I’ll circle back to your question, ’cause I think it’s really the heart of the matter. Self-aware people empirically, scientifically, are more successful at work. They get more promotions, they’re better communicators, better influencers, better sales people, they’re more effective and motivating leaders.There’s even a growing body of evidence that shows that self-awareness isn’t just nice to have, it’s a business imperative. Leaders who are self-aware, lead more profitable companies. Companies who are comprised of self-aware people are more profitable. So all these things together, it’s sort of like it’s important already, but the reason I think self-awareness is the foundational skill of the 21st century, even before COVID, but more so now, is that we can only be as effective at all of these 21st century skills as we are self-aware.So think about this, has anyone ever met an exceptional leader who wasn’t also self-aware? Or a very effective influencer or a relationship builder? And so the way I look at this is essentially our self-awareness is going to set the upper limit of our effectiveness, and that’s why… We’ll talk about this later, but a lot of people have a more room to improve than they think, but the good news is self-awareness, we’ve discovered is one of the most developable skills out there, so it just presents a huge opportunity for so many people.Brett McKay: Let’s talk about what self-awareness is, ’cause you make the case there’s two parts to it. There’s internal and external self-awareness, and we’re gonna dig deep into each of these types. But on high level, what’s the difference between the two, and why can’t you have true or complete self-awareness without both?Tasha Eurich: When we started this research program, I was pretty naive and I thought, “Oh, it should be pretty easy to come up with a definition of what self-awareness is.” And almost a thousand empirical studies later, we surveyed thousands of people all around the world, we did in-depth interviews, which I’m sure we’ll talk about. We finally, after about a year, were able to distill, what do we know when we’re self-aware?And just like you said, it’s made up of two types of self-knowledge. The first is something we call internal self-awareness, which is knowing who you are at your core. What do you value? What are you passionate about? What aspirations do you have for the kind of life you wanna live and the type of career you want to lead?But at the same time, there’s something equally important called external self-awareness, and what that is is, in a nutshell, knowing how other people see us. Fascinatingly, kind of that you alluded to this, is we found that these two types of self-knowledge are completely unrelated, so if there are any stacks nerds listening to this, there is a 0.0 correlation between your level of internal self-awareness and external self-awareness.But what I think is really important about that is it provides the road map, what does it actually take to become self-aware? It’s an equal focus on internal and external self-awareness, even when those answers are different. [chuckle] You sort of think about the way I see myself is going to be different than the way other people see me. But the most self-aware people we’ve discovered are able to balance both of those types of self-knowledge, not putting one over the other in terms of importance, but being able to live sometimes with that contradiction.Brett McKay: Well, ’cause I think people can think of examples of people who are internally self-aware but aren’t externally self-aware, so they know what they want in life, but they’re clueless about how other people perceive them. What’s an example of someone who has external self-awareness, but no internal self-awareness?Tasha Eurich: So the archetype that you talked about, I call “introspectors”. The opposite of that, somebody who has high external self-awareness and low internal self-awareness, I’ve named a “pleaser”. I actually fall into that category. I’m far more comfortable asking someone for feedback about myself, than I am really pondering who I am at my core.And what we’ve found with pleasers is, first of all, there’s a slightly higher proportion of women in that category, men are just a little bit more likely to be introspectors. But for pleasers, their journey is usually figuring out what do they really want. You think about the classic trope of like, I am, instead of going pre-med in this fully, full-ride scholarship, I’m going to quit school and audition for American Idol [chuckle]And it’s like, I really want to do that, and I’m doing it because it’s the thing I want at my core. That’s the thing that pleasers really struggle with, is sometimes they can get wrapped up in what other people want them to do and lose sight of… Or not even think about what they really want.Brett McKay: So internal self-awareness is knowing what you want, external self-awareness is knowing what, how other people perceive you, but then what’s the opposite of that, of being self-aware?Tasha Eurich: Oh, that’s a big question. So everybody sees this all around us in the world, of late particularly, but just in general. I think the opposite of self-awareness is closer to self-absorption. So sometimes people say, “Can you be too self-aware?” And what I think a lot of people get at with that question is, can you be so focused on yourself that you start to lose confidence? You start to over-think everything you’re doing, or place too much emphasis on how other people see you.But that’s actually not self-awareness, that’s almost like self-consciousness. So self-awareness is understanding who we are, our strengths and our weaknesses, everything that we are, but also having sort of a sense of self-acceptance. And that’s why to me, self-absorption is the opposite of that.It’s having the sense that no matter what our objective reality is or where we stand on all the things we want to be and do, we think we’re great anyway. And there’s a lot of research that shows just how dangerous that can be. I get into this in Insight, but there’s a lot of internal barriers to seeing ourselves clearly, there’s a lot of external cultural barriers to that.So the people that are self-aware are successful at fighting those things, they are able to see the barriers, they’re able to sort of jump over them, whereas most people can get wrapped up in, I call it the “cult of self”, this idea that, “I am special and unique and wonderful no matter what, and nobody really understands me.” That’s the opposite of self-awareness.Brett McKay: And we’ll dig into these biases or these roadblocks here in a bit, but through your work and your research, you’ve uncovered, so, okay, we know what self-awareness is kind of knowing what you want in life, but also understanding what how other people perceive you. But you’ve uncovered of what you call “seven pillars of self-awareness”, things about your life that in order to be self-aware, you need to kinda have an understanding about.And we’ll dig into a few of these, but what are, in your research, what are these sev"
