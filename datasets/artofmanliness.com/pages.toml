["https://www.artofmanliness.com/character/behavior/podcast-214-how-to-have-a-good-day-every-day"]
title = "Podcast: How to Be Productive Every Day | The Art of Manliness"
description = "We've all had those days where everything seems to go just right. We set goals for ourselves and we accomplish them. This show's guest, Caroline Webb, has written a book about how to have those ever day."
full_description = 'Podcast #1,048: The Swiss Army Knife of Fitness — How to Get Lean, Strong, and Flexible With Kettlebells Alone Podcast #1,054: Familiarity Breeds Contempt (And Other Underappreciated Consequences of Digital Communication) in: Behavior, Character, Podcast Brett • June 30, 2016 • Last updated: September 28, 2021Podcast #214: How to Have a Good Day, Every Day <span data-mce-type="bookmark" style="display: inline-block; width: 0px; overflow: hidden; line-height: 0;" class="mce_SELRES_start">﻿</span> We’ve all had those days where everything seems to go just right. We set goals for ourselves and we accomplish them. Instead of frittering away our time on YouTube, we’re focused and get work done. Even when we experience setbacks, we’re able to deal with them graciously and effectively. It’s easy to attribute these sorts of days to luck, but my guest today argues that research from behavioral economics and psychology can show us how we can consistently have more of these good days.Her name is Caroline Webb and she’s the author of How to Have a Good Day. In her book, she highlights this research and provides brass tacks advice on how to apply it so you can start having more good days. Today on the show, we discuss how to set goals in the morning and put them into action, how to reduce cognitive overload so you can make better decisions, and how to deal with irksome people and setbacks so they don’t ruin your day.Show HighlightsWhy so few people feel engaged in their work [03:30]What a “good day” looks like and why it doesn’t necessarily mean everything will go perfectly [04:30]What you can do in the morning to set yourself up for a good day [07:00]How your brain filters reality [09:00]How to translate your good intentions at the start of a day into action [12:00]How changing your environment can prime your brain to have a good day [14:00]How superstitions can actually make you more productive [16:30]How to reduce cognitive overload so that you make better decisions [21:00]Caroline’s formula to graciously say “no” [24:30]How to deal with irksome people by setting collaborative intentions [29:00]Why “the compliment sandwich” isn’t the best way to provide constructive feedback [35:00]How to bounce back from setbacks [38:00]How to stay motivated when you’re not feeling motivated [40:00]Resources/Studies/People Mentioned in PodcastHow to plan your weekImplementation intentionsWhat Every Man Should Know About Attention and FocusPsychological primingOur series on willpowerHow to Say “No” Without Coming Off Like a JerkThe fundamental attribution errorOur series on resilience My podcast with Charles Duhigg on the science of motivationHow to Have a Good Day is one the most comprehensive and in-depth books I’ve read on the science of personal management. Every chapter is filled with some sort of actionable nugget that you can implement and see results right away from.Connect With CarolineTell Caroline “Thanks” for being on the podcast via TwitterCaroline’s WebsiteCaroline on TwitterListen to the Podcast! (And don’t forget to leave us a review!)Listen to the episode on a separate page.Download this episode.Subscribe to the podcast in the media player of your choice.Podcast Sponsor2016 GMC Sierra. The 2016 GMC Sierra sets the standard for full-size pickup design by expertly blending precision and style into every detail. From the contrast stitching on the perforated leather-appointed seats to the stunning chrome of the signature Denali grille. For more information about the 2016 GMC Sierra, visit gmc.com or stop into your local GMC dealer for a test-drive.Read the TranscriptBrett McKay: Brett McKay here and welcome to another edition of The Art of Manliness podcast. We’ve probably all had those days where everything seems just to go smoothly. We make our plans, we can follow through on them. Even when setbacks come, we handle them with grace and ease. Well, what if I were to tell you that there are actually research backed tactics that you can use to make sure that you have these good days on regular basis?Well, my guest today has written a book with these research backed tactics. Her name’s Caroline Webb. She’s the author of the book “How to Have a Good Day: Harness the Power of Behavioral Science To Transform Your Working Life”. In it, she puts together … All this research from psychology, behavior economics, and neuroscience to provide tactics for you on how to have a good day from planning your day, establishing goals, staying focused throughout the day, how to handle difficult conversations, difficult people, how to bounce back from setbacks … You name it, she covers it.It starts from the beginning of the day and goes all the way through to the end. We have a great conversation. We talk a lot about these things that you can do, a lot of actionable things that you can apply right away into your life, so make sure you take notes. After you’re done listening to the show, check out our show notes at aom.is/goodday where you can find links to resources that we mention throughout the show, so you can delve deeper into this topic as well as find more information about Caroline’s book. Caroline Webb, welcome to the show.Caroline Webb: Thank you for having me.Brett McKay: You’ve got a book out called “How to Have a Good Day” where you use behavioral science, psychology, research from neuroscience on how we can improve our days from our work life to our personal life. Before we get there, I’m curious about the background. What led up to writing this book? Why did you feel like you needed it? Was it through your consulting business and you saw problems pop up with your clients or maybe in your own life? Were you just like, “Man, how can I get more out of my day”?Caroline Webb: Kind of all of the above, actually. I was working for about fifteen years with people and how to improve their everyday working lives. That was partly through my consulting and organizational change and my leadership development work. What I saw time and again was that while a lot of people were in good jobs and a lot of people were focused on big worthwhile goals, often the everyday experience of going from one day to the next was actually not that much fun.It’s really born out in the surveys that are out there about the fact that half of people don’t feel engaged in their work. It’s sort of terrible numbers when you think about it, even like our work as I say, might not have the most glorious of experiences every single moment of the week. I became very interested in the small changes you can make to everyday life, to think about how you can build a foundation for a more enjoyable and more successful experience every day.I always turn to behavioral science for that because my first career was in economics. I found that the people I worked with were very curious about how the brain works. They were just much more open to any advice I could give if I could actually explain why, why we think and feel and behave the way we do and why the science pointed towards perhaps trying something new. Over time, what happened was that they would say, “Well, is this stuff written down where you translate the science into really practical advice?”There are great popular science books out there that’s actually not so much talking about how this means you might approach a meeting differently or handle your to-do list differently. That’s where I come in. It’s that translation from the science into practice. It seemed as if there was a need and I was delighted to have a chance to fill it.Brett McKay: Before we get into the brass tacks of the things you’ve mined from behavioral science about how to have a good day, let’s talk about what do mean by a good day? I’m imagining it’s not you’re never going to have problems pop up, your toddler isn’t going to wet themselves before they get to the toilet … That happened to me last night. You’re not going to have clients who are frustrating. I mean, what is a good day?Caroline Webb: Yeah. You’re not going to have a dog barking constantly in the apartment next door. I mean, just say by chance. Yeah, I think that the reality is there’s a lot of luck in it, right? I mean, there is a lot of luck that determines whether a day is good or not. What’s interesting and what emerges from the science is we have a lot more control than we think over the quality of our days.When I was working for all those years with companies and individuals to help them create more positive cultures in their organizations and indeed their families, I used to ask them, “What is a good day for you? What is a bad day? What would it take to get more good days?” I’ve got a lot of data on what people think is a good day. It really boils down to three things.It’s, “Do you feel like you’ve spent your time and directed your attention to the things that matter? Do you feel like you did a good job and did you enjoy yourself? Did you feel like you have the energy at the end of the day to wake up the next day and go through it all again?” These are really the three big ideas that fit behind the book.I think that the trouble is that if any of those aren’t true, then it really sort of leads you to feel like it’s not a great day. I’m all about trying to get the small pieces in place that will mean that you definitely are focusing on the right things, feeling good about what you’re doing, and feeling that it’s all worthwhile and fun.Brett McKay: Yeah. Let’s get into those brass tacks on how we can do that. One of the things I love about your book is that not only is it comprehensive, you take us through an entire day and you cover all the different facets you’re going to hit during your day, whether it’s setting your goals, planning, being productive, dealing with frustrating individuals, being resilient in the face of setbacks, everything.You also get very in depth which each section. Like you said, you translate all this research that’s coming out from behavioral economics and psychology and provide brass tacks advice. Let’s start from the very beginning. What could we do at the beginning of our day to set us up for a good day?Caroline Webb:Well, this is one of the most profound bits of science that’s in the book. It relates to the fact that our brains can only process part of reality at any given time. Whatever’s around you right now, wherever you are, you look around you. There’s lots and lots of objects around you, there’s lots of sensations in your body, there’s lots of noises that you could hear if you actually paid attention to it.You could look at every tiny carpet fiber in front of you, you could look at every hair on your head. If we did actually try and consciously pay attention to everything around us, our brains would kind of crash like an overloaded computer with all of its keys pressed at once. Our brains have quite an elegant solution which is that subconsciously, we’re filtering out most of what’s going on around us and we’re not aware of it by definition.The trick here is that it’s actually predictable what … Gets filtered out and what gets filtered in. In effect, there are certain rules that govern the reality that we perceive. We’re all experiencing a really subjective incomplete version of reality and once you know what the rules are, you can shift the way that you perceive whatever happens.Now the way the rules work is that your brain consciously knows this is anything which resonates with what’s already top of mind for you. In other words, if you’re in a bad mood, you spilled coffee on yourself in the morning or you have a terrible commute, you’re in a bad mood and your brain will say, “Okay, you’re in a bad mood, so I’ll make sure you see everything that confirms the world is a terrible place.”The same goes the other way around. If you decide to put yourself in a more positive mood, then you suddenly see the world is a more positive place. The research behind this is really robust … Some people know the term “confirmation bias”, others may have heard the term “selective attention”. The upshot for us is incredibly positive because it means that we just have to be a bit more deliberate about how we go into, I don’t know, everything that matters in a day.You can do this every morning. You can say, “What really matters to me today? What’s my real aim? What attitude do I want to have? What assumptions do I want to have as I go into the day?” knowing that that will shape what you see. If you’ve got a difficult conversation coming up with someone that you think is kind of a jerk, confirmation bias means that your brain will look for evidence that you’re right. You’ll see everything that will be slightly annoying and you might actually miss anything that suggests that the person is trying to be more supportive or conciliatory.If you go in checking your assumptions and saying, “Okay, my aim here is actually to strengthen the relationship and I want to look out for signs that that’s possible”, you will actually experience it differently. It’s a process I’ll call setting intentions. It can take five seconds as you’re going into anything in your day. A lot of the most successful I know do this every morning to look across the day and think, “What filters do I want my brain to apply?”Brett McKay: Yeah, that’s really interesting, the research that’s coming about attention. Basically, yeah, you’re right. What we attend to is reality for us in a weird way … If you’re not intentional about that, you’re going to be caught up by anything that comes your way.Caroline Webb: Yeah, absolutely. I mean, we’re all experiencing this sort of partial view of reality all the time. You only get a glimpse of it sometimes. I mean, I bought some Nike sneakers for the first time a couple of weeks ago. I came out the store and half of New York is apparently now wearing Nike sneakers. I’ve not noticed this before. It’s really highly unlikely that they just bought them. They were there before; I just didn’t see them. Now that I am excited about my new pair of Nike sneakers, I’m seeing them all over the place.If you buy a new car, you certainly see all the cars on the road that are the same color or the same model … The only times that we really get a real sense of the fact that … Or maybe you come out of movie and you’re with your other half and you have a completely different view of what happened. We sometimes get these glimpses of how subjective our experience of reality is, but most of the time, we need to actually look at the research to really believe it.Brett McKay: You talk about how a lot of the successful people out there who have good days consistently are very intentional about setting their intentions at the beginning of the day. They say the road to hell is paved with good intentions. I mean, I think a lot of people are like, “Yeah, I’m going to get my journal out, write down my three big things … Look over my mission statement, blah blah blah blah.” How do you ensure that you put those g'
