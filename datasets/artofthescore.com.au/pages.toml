  Episode notes:3:38 – Roger Moore’s more George (Aston) Martin Bond music9:11 – The 1970s funk boat chase12:45 – Nick has a problem with The Man With the Golden Gun’s parallel motion16:43 – The Spy Who Wrote A Fantastic Opening Song18:10 – James ‘Disco Stu’ Bond24:30 – The singing pyramids28:33 – The Space Who Loved Me32:45 – Bossa, James Bossa35:38 – Bill Conti’s For Your Funk Only43:40 – John Barry’s finale: Octopussy, A View To A Kill, and The Living Daylights49:12 – Dalton’s daylight drum machine54:50 – Michael Kamen’s License to Trill1:01:04 – Bond’s power ballad romance1:04:50 – Serra’s synth sound for Goldeneye and the sonic reinvention of James Bond1:13:34 – Acid James1:17:40 – Escaping the Archives1:19:04 – Goldeneye’s Tank Chase and John Altman’s replacement musicWe love to hear from our listeners – get in touch via Twitter, Instagram, and Facebook, and if you like The Art of the Score, please take a moment to subscribe, rate and comment

























        
                  July 22, 2018/                                    Nicholas Buc/        
        
        
                
                                    
        

  
