              November 20, 2018      
      Episode 23: Harry Potter and the Prisoner of Azkaban - Part 1
              November 20, 2018/                            Nicholas Buc      
    

  


  In Episode 23 we return to the wizarding world with the first of a two part look at Harry Potter and the Prisoner of Azkaban. Far from resting on prior achievements, the final John Williams Potter score knocks it out of the park, giving us everything from medieval music to waltzes, bebop jazz, and some of the most majestic flight music ever written. Join us, as we solemnly swear we are up to no good and journey with Harry and co for their third year at Hogwarts School of Witchcraft and Wizardry.


































































  

  
  
                    
                                                                                                                                
                            
            

  


  






Podcast RSS

















































  

  
  
                    
                                                                                                                                
                            
            

  


  


 


  Episode notes:2:32 – Dan makes a big claim6:35 – Some Azkaban homework14:45 – Hedwig’s theme goes on holiday16:23 – Something wicked this way hums27:50 – Crumhorn, Sackbut, and Azkaban’s medieval sound30:51 – Meeting Buckbeak33:04 – Searching for the Fat Lady35:33 – Some sleeping celeste39:09 – The renaissance fair46:49 – A Window to the Past1:00:00 – Some serious Sirius1:04:13 – Pettigrew’s motif1:07:12 – Buckbeak’s brilliant flight1:13:15 – Buckbeak’s equally brilliant second flight1:17:26 – The Dementor’s dialectic. Thesis: aleatoric horror1:21:39 – Antithesis: the angelic Patronus1:23:06 – Synthesis: the Dementors convergeWe love to hear from our listeners – get in touch via Twitter, Instagram, and Facebook, and if you like The Art of the Score, please take a moment to subscribe, rate and comment.

























        
                  November 20, 2018/                                    Nicholas Buc/        
        
        
                
                                    
        

  
