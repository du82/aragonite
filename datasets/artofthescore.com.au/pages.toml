              October 05, 2018      
      Episode 21: Journey
              October 05, 2018/                            Nicholas Buc      
    

  


  In Episode 21 we finally make good on our long-held promise to explore the world of videogame music, with Austin Wintory’s beautiful score for thatgamecompany’s Journey. Crucial to the experience of Journey, Wintory’s music was recognized with a Grammy nomination and is widely held to be one of the greatest videogame scores of all time. Join us as we take a videogame diversion and analyse this gorgeous soundtrack.


































































  

  
  
                    
                                                                                                                                
                            
            

  


  






Podcast RSS

















































  

  
  
                    
                                                                                                                                
                            
            

  


  


 


  Episode notes:5:20 – How does videogame music differ from film or television?8:50 – Dan’s complicated menu music10:05 – thatgamecompany’s journey to Journey, and Mihaly Csikszentmihalyi’s ‘flow’16:12 – The rise of independent videogame development and aesthetics18:20 – Nascence and Wintory’s main Journey theme21:50 – Tina Guo’s cello, Amy Tatum’s flute, and Charissa Barger’s harp26:30 – Solo cello in Tan Dun’s Crouching Tiger, Hidden Dragon, and Hans Zimmer’s The Last Samurai31:20 – Journey’s central weenie33:45 – The Call, the sonic palate cleanser38:10 – The Mountain41:33 – Sound design and music in Journey44:02 – The First Confluence and the absence of a downbeat48:48 – The Bridge and the Second Confluence51:50 – The first encounter and Journey’s dance55:30 – ‘I was born for this’58:05 – The Desert’s Threshold and the musical interactivity of Journey1:04:10 – The melancholy beauty of the machines1:10:25 – The Descent, and Nick’s musical snowboarding adventures1:20:16 – The Belly of the Whale’s Serpent1:26:08 – The gaze of the sentinals1:28:18 – Journey’s achingly beautiful string writing and Arvo Pärt’s Cantus in Memory of Benjamin Britten1:34:40 – Atonement and the giant structure1:38:56 – Journey’s Buddhist links1:47:03 – The ascent to the peak (‘The Crossing’)1:55:12 – The nadir2:01:10 – Apotheosis and the hero realised2:12:24 – The return to Tina Guo’s solo cello2:18:28 – What does Journey mean? Is it a metaphor?2:21:22 – The Return?Finally, if listeners are unfamiliar with Journey, we highly recommend checking out this video recording of a playthrough of the game from start to finish: https://www.youtube.com/watch?v=bkL94nKSd2MWe love to hear from our listeners – get in touch via Twitter, Instagram, and Facebook, and if you like The Art of the Score, please take a moment to subscribe, rate and comment.

























        
                  October 05, 2018/                                    Nicholas Buc/        
        
        
                
                                    
        

  
  Nicholas Buc
  


        
