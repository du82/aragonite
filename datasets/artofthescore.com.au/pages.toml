              February 17, 2017      
      Episode 2: Raiders of the Lost Ark - Part 2
              February 17, 2017/                            Nicholas Buc      
    

  


  In the second episode of Art of the Score, we’re going even deeper into John Williams’ 1981 score for Raiders of the Lost Ark.In the previous episode, we looked at the main themes for the score – in this episode, we’ll uncover the hidden moments and orchestrational genius that makes Raiders a film score for the ages.


































































  

  
  
                    
                                                                                                                                
                            
            

  


  






Podcast RSS

















































  

  
  
                    
                                                                                                                                
                            
            

  


  


 


  Episode Notes:2:50 – The opening cue of the film – ‘In the Jungle’9:40 – Indiana Jones’ introduction in the film, both musical and visual11:45 – ‘The Idol Temple’ and the spider pizzicato16:40 – Comparison with the restless strings in E.T.: The Extra-Terrestrial and Bernard Herrmann’s Psycho20:45 – The stealing of the Idol23:40 – The rolling boulder, killer trumpet triplets, and Williams’ respect for sound effects28:40 – The development of Marion’s theme across the score, from wistful, to tragic, to overblown romance36:50 – The development of the Indiana Jones theme across the score, starting with its introduction41:20 – Indiana Jones the sad and lonely professor, played on clarinet44:00 – Indiana Jones the action star47:15 – Our favourite performance of the Indiana Jones theme: the swim to the submarine49:00 – Comparison with The Sea Hawk (Korngold)52:00 – The travelling and map sequences of the film, ‘To Nepal’ and ‘Flight to Cairo’1:00:00 – The action cues of Raiders1:01:55 – ‘The Basket Game’ and melodies in action sequences1:06:15 – ‘The Fist Fight / The Flying Wing’1:09:00 – ‘Desert Chase’ and the trials of the orchestra1:12:40 – John Williams does the Macarena1:14:00 – The unscored bar fight1:15:50 – The religious moments in the score1:16:30 – ‘The Map Room: Dawn’ and turning religious awe into musical certainty1:22:50 – Comparison with ‘The Lighting of the Beacons’ from Howard Shore’s Return of the King1:25:50 – ‘The Medallion’ theme (or is it the Ark’s B theme?)1:29:10 – ‘The Miracle of the Ark’ and the power of the Ark1:31:40 – Williams’ use of horror music and slapsticks for the terror of the Ark1:35:14 – The final cue of the film, and ending on the Ark themeWe’d love to hear from our listeners – get in touch via Twitter, and if you like The Art of the Score, please take a moment to subscribe, rate and comment.

























        
                  February 17, 2017/                                    Nicholas Buc/        
        
        
                
                                    
        

  
  Nicholas Buc
  


        
