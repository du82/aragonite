              March 28, 2017      
      Episode 4: Vertigo
              March 28, 2017/                            Nicholas Buc      
    

  


  For our fourth episode, we’re moving to a different great director-composer collaboration from a different era. It’s Alfred Hitchcock and Bernard Herrmann with perhaps their greatest work: 1958’s Vertigo. This film recently dethroned Citizen Kane as the greatest of all time according to the American Film Insitute – but how good is Herrmann’s score, and how does it work? Join us as we take a look at the central musical ideas at work here – and how Bernard Herrmann creates a musical landscape of the subconscious.


































































  

  
  
                    
                                                                                                                                
                            
            

  


  






Podcast RSS

















































  

  
  
                    
                                                                                                                                
                            
            

  


  


 


  Episode Notes:3:25 – Historical context for the film and the Hitchcock-Herrmann relationship5:00 – Why did people dislike Vertigo at the time?8:10 – Herrmann’s compositional style9:30 – The musical landscapes of Hitchcock-Herrmann films11:00 – Nick on conducting Psycho live in concert,13:10 – The Vertigo main titles16:20 – The ‘Hitchcock chord’20:15 – Musical spirals in Vertigo reflecting visual and thematic spirals26:30 – The love theme29:40 – The sad romance of the love theme31:35 – Nick blows our minds by revealing that the love theme is hidden in the Prelude32:50 – Similarities to Wagner’s Tristan and Isolde and the inability for the music to truly resolve37:25 – Close analysis of the Scene D’Amour39:40 – Discussion of Ludovic Bource’s score for The Artist42:25  – Did Herrmann reference and develop this musical idea in other Hitchcock films?46:10 – Is Herrmann developing a musical language or is he self-plagiarising?47:10 – Torn Curtain50:35 – The Ostinato motif in Vertigo52:40 – The Habañera rhythm55:45 – A link to Ravel58:20 – The development of the Herrmann-Hitchcock ostinato across other films1:03:00 – The Hitchcock style versus the Herrmann style?1:05:05 – Alternating polychords in the tower sequence and similarities to The Matrix1:06:45 – Danny Elfman’s inspiration from Herrmann1:08:13 – Source music and Mozart in Vertigo1:12:10 – The musical resolution at the beach1:14:00 – The film’s finale and musical conclusion – is Herrmann’s music less ambiguous than the images?1:17:20 – Hitchcock crediting Herrmann with the quality of VertigoWe’d love to hear from our listeners – get in touch via Twitter, and if you like The Art of the Score, please take a moment to subscribe, rate and comment

























        
                  March 28, 2017/                                    Nicholas Buc/        
        
        
                
                                    
        

  
  Nicholas Buc
  


        
