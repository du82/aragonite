              November 06, 2018      
      Episode 22: Conan the Barbarian
              November 06, 2018/                            Nicholas Buc      
    

  


  In Episode 22 we travel to the distant Hyborian era with Basil Poledouris’ muscular score for 1982’s Conan the Barbarian. As the gold standard for high fantasy prior to Howard Shore’s Lord of the Rings epics, Poledouris’ lush and orchestral score creates entire musical worlds and carries much of the emotion in this sparsely-dialogued film. Join us as we take a journey with the Riders of Doom and listen to this fantastic work of musical fantasy.


































































  

  
  
                    
                                                                                                                                
                            
            

  


  






Podcast RSS

















































  

  
  
                    
                                                                                                                                
                            
            

  


  


 


  Episode notes:5:35 – The secrets to Conan’s success9:22 – John Milius’s machismo13:38 – Basil Poledouris’ score19:54 – Conan’s canon – what era does the music come from?22:45 – Anvil of Crom: the Hyborian rhythm and Nick’s rave remake30:20 – Twenty-four French Horns and Total Recall’s Barbaric Recall38:28 – Conan’s theme48:10 – Double reeds and the passing of time58:21 – The love theme, and saying more than Arnold through music1:10:00 – The Riders of Doom theme1:14:55 – O Fortuna’s influence on Conan (and film music generally)1:19:34 – Conan’s Battle on the Ice1:21:44 – The Wheel of Fifths1:24:51 – Doom’s Dies Irae1:38:16 – The Wheel of Pain’s ostinato1:43:06 – Waltzing through theology1:47:42 – The villain’s music for the hero’s journey – in the kitchen1:49:28 – Waltzing through an orgy1:57:07 – The Pit Fights and the Mountain of Power, via 1950s sword and sandal epics2:03:49 – Conan’s Firebird finaleWe love to hear from our listeners – get in touch via Twitter, Instagram, and Facebook, and if you like The Art of the Score, please take a moment to subscribe, rate and comment.

























        
