  We love to hear from our listeners – get in touch via Twitter, Instagram, and Facebook, and if you like The Art of the Score, please take a moment to subscribe, rate and comment.

























        
                  August 03, 2017/                                    Nicholas Buc/        
        
        
                
                                    
        

  
  Nicholas Buc
  


        
