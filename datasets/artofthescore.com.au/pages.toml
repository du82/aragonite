              November 14, 2017      
      Episode 13: Harry Potter and the Philosopher's Stone
              November 14, 2017/                            Nicholas Buc      
    

  


  From Hedwig’s theme to Quidditch matches, the musical world of Hogwarts may be one of the most iconic musical contributions to the film world this millennia. John Williams worked orchestral magic and brought us a unique contribution of fantasy, off-beat fanfares, and even a bit of jazz harmony. But what makes this great score tick? Join us as we dissect the power, the charm, and the enchantment of Harry Potter and the Philosopher’s Stone.


































































  

  
  
                    
                                                                                                                                
                            
            

  


  






Podcast RSS

















































  

  
  
                    
                                                                                                                                
                            
            

  


  


 


  Episode notes:07:00 – a brief history of the franchise10:45 – Harry Potter, one of the largest franchises of the 21st century11:22 – John Williams on how he came to be involved with Harry Potter15:00 – Hedwig’s Theme16:42 – the celeste and its use in other films and, famously, Tchaikovsky’s Dance of the Sugar Plum Fairy18:15 – Andrew drops a bombshell20:10 – Breaking down Hedwig’s Theme26:20 – a recounting of the day the musicians first encountered the score28:00 – Hedwig’s Theme and its variations31:25 – is Hedwig’s Theme the last John Williams melody to enter pop culture?33:00 – the Flying Theme or the Nimbus 2000 Theme44:15 – Harry’s Theme or the Family Theme50:27 – the appearance of the tri-tone52:30 – Harry’s Wondrous World Theme1:00:08 – the Hogwarts School Song1:02:00 – we apologise for what is about to happen…1:04:50 – Philosopher’s vs Sorcerer’s (Stone) and some of the localisations1:08:10 – the Stone motif1:16:00 – the Voldemort motifs1:23:00 – the music of Diagon Alley1:31:10 – some banquet music from Harry Potter and other films1:36:50 – the Quidditch Fanfare and its similarity to other “arena” cues1:40:30 – John Williams’ use of synthesizer for the Invisibility Cloak1:43:10 – the diegetic (harp) music of Harry Potter1:47:00 – the action music compositional style of early 2000s John WilliamsWe love to hear from our listeners – get in touch via Twitter, Instagram, and Facebook, and if you like The Art of the Score, please take a moment to subscribe, rate and comment

























        
                  November 14, 2017/                                    Nicholas Buc/        
        
        
                
                                    
        

  
