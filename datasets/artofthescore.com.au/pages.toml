full_description = "April 21, 2020 Episode 31: How To Train Your Dragon April 21, 2020/ Nicholas Buc It’s Episode 31, and we’re swooping into the new year with one of the most widely loved family films – as well as the film score buff’s film score – in How To Train Your Dragon. John Powell’s soundtrack has been one of Art of the Score’s most-requested episodes over the years, so join us as we get under the hood of this contemporary classic and pick apart its many main melodies and old-fashioned sound. Podcast RSS Episode notes:5:56 – How To Train Your Dreamworks8:41 – The John Powell Up12:31 – Nick leaves his wife for John Powell14:43 – The Friendship theme16:38 – Toothless’s theme19:56 – Bagging Bagpipes25:27 – Hammering Dulcimer32:43 – Tin whistle and bodhran35:26 – Let’s b (theme) friends39:42 – Powell-chords45:16 – Toothless in three49:10 – Toothless Face/Off51:05 – The Band with a Dragon Tattoo54:17 – The Berk theme59:47 – A point of pronunciation1:02:56 – Father and Son1:09:08 – The cavalry arrives1:12:33 – The Viking theme1:18:31 – How To Write A Dragon Melody1:24:21 – Dragon scales1:26:39 – Astrid’s theme1:35:56 – The Evolution of Powell’s style1:38:38 – Battle theme1:44:10 – Telling the Tail1:49:53 – John Powell’s best score?We love to hear from our listeners – get in touch via Twitter, Instagram, and Facebook, and if you like The Art of the Score, please take a moment to subscribe, rate and comment. April 21, 2020/ Nicholas Buc/ Nicholas Buc .collection-type-blog article footer .tags { display: none; }"
