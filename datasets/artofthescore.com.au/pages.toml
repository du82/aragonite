full_description = "January 22, 2024 Episode 36: Interstellar January 22, 2024/ Nicholas Buc Time dilation is a funny thing. For many, we understand there’s been a bit of a gap between episodes. For us, however, it’s been mere minutes since our last appearance – but thanks for sticking around nonetheless, as we’re finally back to discuss Hans Zimmer, Christopher Nolan, time, and Interstellar. Join us as we chat all things organs, pianos, space travel, and answer the question of whether Interstellar is Zimmer’s greatest score of all. Podcast RSS Episode notes:01:51 – Did you miss us?09:02 - interstellar!13:55 – Hans Zimmer and Christopher Nolan’s time together15:35 – The piece of paper and early demos24:31 – soft soft LOUD27:07 – The discovery theme, and Interstellar’s organ38:08 – Woodwinds of Change39:40 – Chastain’s piano41:25 – Countermelody of doom45:22 – The hope theme, loops and DAWs54:10 – Messages from home59:48 – The tesseract acts1:02:40 – Finding Anne Hathaway1:06:48 – Gravity1:13:35 – 2001: An Interstellar Odyssey1:20:48 – The humanity theme1:32:59 – The sound of silence1:37:55 – Time1:42:15 – Maths with Poggo1:49:45 – Dr Mann kind? No, he’s quite mean1:53:30 – Try spinning, that’s a good trick1:59:25 – Nick’s favourite ka-cue2:00:51 – V for Vinterstellar2:03:26 – Final thoughtsWe love to hear from our listeners – get in touch via Twitter, Instagram, and Facebook, and if you like Art of the Score, please take a moment to subscribe, rate and comment. January 22, 2024/ Nicholas Buc/ Nicholas Buc .collection-type-blog article footer .tags { display: none; } October 03, 2021 Episode 35: Studio Fanfares Part 2 October 03, 2021/ Nicholas Buc It’s Episode 35, and the long-awaited part two to our investigation of a fascinating and often-overlooked area of film music history – studio fanfares. In this episode we travel from the 1980s to today, taking in the sights and sounds of evergreen studio fanfares from the likes of Jerry Goldsmith, John Williams, the THX Deep Note, and the Buc dynasty of screen composers. And of course, there’s a round of ‘Name That Theme’ with host Andrew Pogson, as well as a look at some of the most contemporary of logo themes – including Marvel, Star Wars, and a curious update of MGM’s Leo the Lion. Episode notes:2:50 – The Art of the Score fanfare – Nancy Buc (1980)4:34 – The studio revival in the 1980s5:42 – Amblin Entertainment – John Williams (1981)9:14 – The Ladd Company – John Williams (1981)12:29 – United Artists – Joe Harnell (1982)15:54 – THX Deep Note – James Andy Moorer (1983)22:13 – Tri-Star Pictures – Dave Grusin (1984)25:46 – Carolco Pictures – Jerry Goldsmith (1985)28:42 – And now, the news33:10 – Disney – John Debney (1985)36:26 – THX Cimarron – James Horner (1988)39:43 – Castle Rock Entertainment – Marc Shaiman (1989)42:56 – Warner Bros. and an off day in the synth studio44:30 – The Art of the Score fanfare – Barry Buc (1990)46:21 – Universal – James Horner (1990)50:46 – Hollywood Pictures – Danny Elfman (1990)51:42 – Village Roadshow (1992)53:53 – Columbia – Jonathan Elias (1993)56:50 – Studio fanfares you might have heard before…1:02:28 – New Line Cinema – Michael Kamen (1994)1:05:34 – United Artists – Starr Parodi and Jeff Eden Fair (1994)1:09:05 – Disney and Pixar – Randy Newman (1995)1:10:26 – HBO (1996)1:11:35 – Dreamworks – John Williams (1997)1:14:56 – Universal – Jerry Goldsmith (1997)1:19:31 – Warner Bros. – Gabriel Yared (1999)1:21:39 – The Art of the Score fanfare – Tobias H. Buc (2000)1:23:53 – Sony Home Entertainment and Animation (2005/2006)1:28:16 – Disney – Mark Mancina & Dave Metzger (2006)1:31:44 – Studio Canal – Alexandre Desplat (2011)1:36:25 – Paramount – Michael Giacchino (2011)1:40:02 – Universal, updated – Brian Tyler (2012)1:41:26 – Marvel – Tyler/Giacchino (2013/2016)1:47:26 – Netflix – Lon Bender and Charlie Campagna (2015)1:52:49 – Streaming Star Wars (2019)1:56:31 – MGM (2021)1:58:33 – The Art of the Score fanfare – Nicholas Buc (2004)2:01:25 – “Name That Theme”, with your host, Andrew PogsonWe love to hear from our listeners – get in touch via Twitter, Instagram, and Facebook, and if you like The Art of the Score, please take a moment to subscribe, rate and comment. Podcast RSS October 03, 2021/ Nicholas Buc/ Nicholas Buc .collection-type-blog article footer .tags { display: none; }"
