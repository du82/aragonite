              July 04, 2017      
      Episode 9: Star Wars - Part 3
              July 04, 2017/                            Nicholas Buc      
    

  


  In our third and final Star Wars episode, we take a look at some of the lesser known cues that round out this incredible score. We discuss the giant bantha in the room: the musical influences that inspired Williams and the temp music that helped to shape some of his artistic choices. Finally, we take a whirlwind tour of the action music, explore the groovy Cantina Band tunes and debate whether Star Wars is in fact the greatest film score of all time. Is it?


































































  

  
  
                    
                                                                                                                                
                            
            

  


  






Podcast RSS

















































  

  
  
                    
                                                                                                                                
                            
            

  


  


 


  
Episode notes:3:20 – the music for the Jawas 5:40 – finding the downbeat in “The Little People”7:28 – is this the highest Tuba line ever?11:03 – the music for the Sand People14:39 – Williams’ family relations and a link to Toto15:28 – use of the Timpani18:08 – a comparison with Jerry Goldsmith’s Planet of the Apes20:26 – discussing the Bantha in the room: the musical influences on Star Wars26:05 – The Dune Sea of Tatooine vs Stravinsky’s Rite of Spring30:17 – The Rebel Blockade Runner vs Holst’s The Planets32:02 – Some Bernard Herrmann references in Star Wars36:56 – The Throne Room vs Dvorak and Elgar42:21 – The Throne Room’s reappearance in Return of the Jedi 44:55 – rude trumpets and the performance/recording of the score47:03 – the musicians who made contributions to Star Wars48:53 – the action music of Star Wars and Williams’ hip grooves53:11 – Dan’s dissapointment in Star Wars’ lack of musical numbers56:15 – The Battle of Yavin vs The Battle of Britain 1:02:35 – The Cantina Band, is it jazz or jizz?1:06:20 –Sing Sing Sing as temp music1:08:48 – the 2nd Cantina Band song1:11:18 – the original Star Wars trailer music and Vivaldi’s Four Seasons1:15:46 – the studio’s woeful attempt at marketing Star Wars1:17:42 – is Star Wars the greatest film score of all time?We love to hear from our listeners – get in touch via Twitter, and if you like The Art of the Score, please take a moment to subscribe, rate and comment


























        
