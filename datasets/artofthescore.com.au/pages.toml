              February 27, 2017      
      Episode 3: Jurassic Park
              February 27, 2017/                            Nicholas Buc      
    

  


  For our third episode, we look at another great Williams-Spielberg collaboration with the 1993 score to Jurassic Park. This landmark film redefined special effects and Hollywood itself, but what did it do for film music? Join us as we take a look at the main themes for the score and the hidden gems – and go from gospel, to jazz, to hymns along the way.


































































  

  
  
                    
                                                                                                                                
                            
            

  


  






Podcast RSS

















































  

  
  
                    
                                                                                                                                
                            
            

  


  


 


  Episode Notes:2:30 – Notes on Jurassic Park as a Spielberg film and its place in film history7:10 – Theme From Jurassic Park10:00 – The main theme as a hymn15:00 – The structure of the main theme17:20 – The end credits version of the theme21:00 – The ‘Journey to the Island’ theme23:30 – Comparison with ‘Summon the Heroes’26:00 – The ‘sheen’ to the thematic orchestration29:56 – The ‘panic’ theme31:45 – Comparison with Dies Irae41:10 – Comparison with later John Williams ‘suspense’ music43:45 – Petticoat Lane47:00 – Comparison with other John Williams celeste writing49:00 – Triceratops music53:32 – Dennis’s music and comparison with JFK55:40 – Williams’ jazz influences57:15 – The development of the action music1:00:25 – The raptor motif1:01:00 – The animation jazz and comparison with Gershwin1:03:30 – Williams’ use of synth1:08:50 – ‘Incident at Isla Nublar’1:12:00 – Comparison with 1990s synth action musicWe’d love to hear from our listeners – get in touch via Twitter, and if you like The Art of the Score, please take a moment to subscribe, rate and comment.

























        
                  February 27, 2017/                                    Nicholas Buc/        
        
        
                
                                    
        

  
