title = "Belinda Bennetts — Art of the Title"
description = "<p>Belinda Bennetts is a designer based in Sydney, Australia.<br />She is the title designer of films Black Robe (1991), Little Women (1994), Paradise Road (1997), Oscar and Lucinda (1997), and Charlotte Gray (2001), as well as TV series Wildside, The Alice, East West 101, and The Strip. She was also VFX Art Director on Moulin Rouge and Crowd TD on Happy Feet 2.<br />Belinda grew up in Melbourne, Australia, where she attended the Swinburne University of Technology and graduated with a Bachelor of Arts, majoring in graphic design. She moved to Sydney to find work in the film and television industry and began her career in the graphics department of the Australian Broadcasting Corporation.<br />She has also taught motion graphics at the Australian Film, Television &amp; Radio School (AFTRS), where one of her students was title designer Patrick Clair.<br />Currently, she works in Sydney, Australia as a UX designer.</p>"
full_description = "Designer Belinda Bennetts Belinda Bennetts is a designer based in Sydney, Australia. She is the title designer of films Black Robe (1991), Little Women (1994), Paradise Road (1997), Oscar and Lucinda (1997), and Charlotte Gray (2001), as well as TV series Wildside, The Alice, East West 101, and The Strip. She was also VFX Art Director on Moulin Rouge and Crowd TD on Happy Feet 2. Belinda grew up in Melbourne, Australia, where she attended the Swinburne University of Technology and graduated with a Bachelor of Arts, majoring in graphic design. She moved to Sydney to find work in the film and television industry and began her career in the graphics department of the Australian Broadcasting Corporation. She has also taught motion graphics at the Australian Film, Television & Radio School (AFTRS), where one of her students was title designer Patrick Clair. Currently, she works in Sydney, Australia as a UX designer. Articles Oscar and Lucinda title only Little Women summary Link belindabennetts.com Complete filmography"
