title = "Svenja Frahm — Art of the Title"
description = "<p>Svenja Frahm is a motion designer and director based in London, England.<br />Originally from Germany, Svenja studied graphic design in Germany, China, and the UK. She&nbsp;has a&nbsp;BA in Graphic Design and Advertising from Buckinghamshire New University and an MA in Graphic Moving Image from University of the Arts London. She has worked with studios including Momoco, Channel 5, Radiant Studios, FirewithoutSmoke, Kemistry,&nbsp;Venture Three, Petrol Ltd.&nbsp;<br />Svenja has contributed to title sequences including&nbsp;An Education (2009),&nbsp;Strike Back (2010), Fresh Meat (2011),&nbsp;The Last Panthers (2015), The Tunnel (Season 2) (2016), Beowulf: Return to the Shieldlands (2016), Electric Dreams (2017),&nbsp;Luther (2018), Hard Sun (2018), The Secret of Immortal Code (2018), and others.<br />In 2018, her work on the title sequence to Electric Dreams was nominated for a Royal Television Society Craft &amp; Design Award.</p>"
