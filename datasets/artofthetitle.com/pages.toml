description = "After numerous Emmy-nominated collaborations on the&nbsp;American Horror Storyseries, television producer Ryan Murphy and title designer Kyle Cooper of studio Prologue reteam for Murphy&rsquo;s latest anthology series:&nbsp;FEUD: Bette And Joan&nbsp;&mdash; a dramatization of the events surrounding the production of the 1962 film&nbsp;What Ever Happened to Baby Jane?&nbsp;and the infamous behind-the-scenes rivalry of stars Bette Davis and Joan Crawford. Set in the 1960s,&nbsp;FEUD&rsquo;s highly stylized animated opener takes cues from the era in which it is set, in particular&nbsp;the title design of Saul Bass&nbsp;and the work of director Alfred Hitchcock. The sequence, which also owes a stylistic debt to Kuntzel + Deygas&rsquo;s handmade opening to Steven Spielberg&rsquo;s&nbsp;Catch Me If You Can, features direct references to&nbsp;Baby Jane&nbsp;and several Hitchcock thrillers &mdash; most notably&nbsp;Rear Window&nbsp;and&nbsp;Vertigo. With multiple acts of attempted murder and mayhem, the sequence&rsquo;s sinister undercurrents make it clear to viewers that the enmity between Davis and Crawford is far more than just professional or personal jealousy, it&rsquo;s a true life or death struggle for these two Hollywood legends."
full_description = "After numerous Emmy-nominated collaborations on the American Horror Storyseries, television producer Ryan Murphy and title designer Kyle Cooper of studio Prologue reteam for Murphy’s latest anthology series: FEUD: Bette And Joan — a dramatization of the events surrounding the production of the 1962 film What Ever Happened to Baby Jane? and the infamous behind-the-scenes rivalry of stars Bette Davis and Joan Crawford. Set in the 1960s, FEUD’s highly stylized animated opener takes cues from the era in which it is set, in particular the title design of Saul Bass and the work of director Alfred Hitchcock. The sequence, which also owes a stylistic debt to Kuntzel + Deygas’s handmade opening to Steven Spielberg’s Catch Me If You Can, features direct references to Baby Jane and several Hitchcock thrillers — most notably Rear Window and Vertigo. With multiple acts of attempted murder and mayhem, the sequence’s sinister undercurrents make it clear to viewers that the enmity between Davis and Crawford is far more than just professional or personal jealousy, it’s a true life or death struggle for these two Hollywood legends. Credits Studio: Prologue Creative Director: Ryan Murphy Creative Producer: Alexis Martin Woodall Director: Kyle Cooper Designer: Nadia Tzuo Animator: Margherita Premuroso Editor: Rachel Fowler Producer: Kate BerryMusic: Mac Quayle Support Art of the TItle kofiwidget2.init('DONATE ON KO-FI', '0099DD', 'R6R3101C6Q');kofiwidget2.draw(); Related American Horror Story title only American Horror Story: Asylum summary American Horror Story: Freak Show summary Charade summary Vertigo summary 2017 Emmy Nominations for Main Title Design news 2020 Emmy Nominations for Main Title Design news 2021 Emmy Nominations for Main Title Design news Title sequence Production Studio Prologue Films Director Kyle Cooper Designer Nadia Tzuo Animator Margherita Premuroso Editor Rachel Fowler Category TV Styles 2010s, animation, digital, graphic, hand drawn, illus