title = "Ben Radatz — Art of the Title"
description = "<p>Ben Radatz is a filmmaker, designer, writer, and frequent contributor to Art of the Title.<br />He is a partner and co-founder of MK12 Studios, a motion graphics and design collective based in Kansas City, MO with critical acclaim in both the commercial and artistic arenas.<br />Ben has received several awards and grants for his short films and photography, including the Princess Grace Foundation's Young Filmmaker Award in 1998 and the Linda Lighton International Artist Exchange Grant in 2005, for which he travelled to Chernobyl and documented the nearby abandoned city of Pripyat. He is also a frequent presenter and keynote speaker at design conferences and film festivals worldwide.</p>"
