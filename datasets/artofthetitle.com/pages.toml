["https://artofthetitle.com/editor/lola-landekic"]
title = "Lola Landekic — Art of the Title"
full_description = '''Editor Lola Landekic Editor in Chief Lola Landekic/*<![CDATA[*/if (document.getElementById('x-protectfilter-1') != null) { document.getElementById('x-protectfilter-1').innerHTML=function(e){var r='';for(var i=152;i>=0;i-=2){r+=e.charAt(i);}return r;}('\u003eTau/H\u003cgczi2kjeyd3n\"a1Lb Ua5lvoYLo\u003eT\"FayltooLp xl4irajmw-AEc\"v=He\u003elatfiVt8 S\"Ymjo5cP.0emlDt6iRtAeXh0trfwouttr\u003caT@raalKo8ld:BomtylgiIaWm9\"2=Tfce@rWhs Yav\u003cV'); document.getElementById('x-protectfilter-1').removeAttribute('id'); }/*]]>*/ is the Editor in Chief of Art of the Title, which she runs from her studio in Toronto, Canada. She is also an art director, graphic designer, and writer full-time, working primarily in film and branding. Previously, she has worked for newspapers The Toronto Star and The Globe and Mail, publishers HarperCollins and Random House. Her writing has been published in The Globe and Mail and AIGA’s Eye on Design. She has taught communication design and typography in motion at Sheridan College and has been a judge for the SXSW Title Design Competition, The Motion Awards, The Juno Awards, and The Rosalie Awards. Lola has done speaking engagements for organizations including the Smithsonian American Art Museum, SXSW, London College of Communication, California Institute of the Arts, Series Mania Festival, and AIGA Design Conference. In her spare time, she contributes articles to Wikipedia. Email Lola/*<![CDATA[*/if (document.getElementById('x-protectfilter-2') != null) { document.getElementById('x-protectfilter-2').innerHTML=function(e){var r='';for(var i=144;i>=0;i-=2){r+=e.charAt(i);}return r;}('\u003eza2/j\u003cya3l\"o1Lb Ul5ivaYmoET\u003eF\"yatloopLx 4lrijawmAEc\"v=He\u003elatfiVt8 S\"Ymjo5cP.0emlDt6iRtAeXh0trfwouttr\u003caT@raalKo8ld:BomtylgiIaWm9\"2=Tfce@rWhs Yav\u003cV'); document.getElementById('x-protectfilter-2').removeAttribute('id'); }/*]]>*/Twitter Speaking Engagements If you are interested in having Art of the Title involved with