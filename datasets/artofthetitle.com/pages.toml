["https://artofthetitle.com/designer/aaron-becker"]
title = "Aaron Becker — Art of the Title"
description = "<p>Aaron Becker is a designer and director of title sequences, as well as co-founder of Filmograph (previously known as&nbsp;Becker Design).&nbsp;<br />He has a BFA in Visual Communication from Washington University in St. Louis. He has designed and directed main title sequences for films such as&nbsp;The Conjuring&nbsp;(2013),&nbsp;Mission: Impossible &ndash; Rogue Nation&nbsp;(2015), Split&nbsp;(2017), Power Rangers (2017),&nbsp;Get Out&nbsp;(2017), and Aquaman (2018), as well as television titles for Clear History (2013), Waco (2018), The Dangerous Book for Boys (2018), and The Haunting of Hill House (2018).&nbsp;<br />Becker began his career working with Prologue in Los Angeles and Digital Kitchen in Chicago,&nbsp;before founding Becker Design in 2010. The company evolved into Filmograph in 2012.</p>"
