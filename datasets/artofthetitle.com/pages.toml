["https://artofthetitle.com/designer/daniel-kleinman"]
title = "Daniel Kleinman — Art of the Title"
description = "<p>Daniel Kleinman is a British commercial and music video director and title sequence designer.<br />After graduating from Hornsey Art School, he began his career in the '80s as an illustrator, collaborating with music video directors. Since then, he has directed more than 100 videos for artists such as ZZ Top, Fleetwood Mac, Prince, and Madonna. Through the '90s he concentrated on advertising for clients such as Guinness, X-Box, and Chrysler. Daniel has also directed TV dramas and comedies, notably Smashie and Nicey &ndash; The End Of An Era, which was BAFTA-nominated and won a Golden Rose at Montreux. With the exception of 2008's Quantum of Solace, he has&nbsp;created the title sequences for the James Bond films since 1995.&nbsp;<br />He has won top awards for his advertising work at Cannes, D&amp;AD, and the New York One Show. In 2006, Daniel and fellow director Ringan Ledwidge founded the production company Rattling Stick. In 2011, the company won the top spot in the Televisual Peer Poll and in 2012, it won Production Company of the Year at the British Arrows awards for the fourth time.</p>"
full_description = "Designer Daniel Kleinman Daniel Kleinman is a British commercial and music video director and title sequence designer. After graduating from Hornsey Art School, he began his career in the '80s as an illustrator, collaborating with music video directors. Since then, he has directed more than 100 videos for artists such as ZZ Top, Fleetwood Mac, Prince, and Madonna. Through the '90s he concentrated on advertising for clients such as Guinness, X-Box, and Chrysler. Daniel has also directed TV dramas and comedies, notably Smashie and Nicey – The End Of An Era, which was BAFTA-nominated and won a Golden Rose at Montreux. With the exception of 2008's Quantum of Solace, he has created the title sequences for the James Bond films since 1995. He has won top awards for his advertising work at Cannes, D&AD, and the New York One Show. In 2006, Daniel and fellow director Ringan Ledwidge founded the production company Rattling Stick. In 2011, the company won the top spot in the Televisual Peer Poll and in 2012, it won Production Company of the Year at the British Arrows awards for the fourth time. Articles No Time to Die summary SPECTRE interview James Bond: 50 Years of Main Title Design feature Skyfall interview Casino Royale summary Die Another Day title only The World Is Not Enough title only Tomorrow Never Dies title only GoldenEye interview Production Studio Rattling Stick Link rattlingstick.com/daniel.html Complete filmography"
