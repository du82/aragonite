["https://artofthetitle.com/contributor/ian-dawe"]
title = "Ian Dawe — Art of the Title"
full_description = "Contributor Ian Dawe Ian Dawe is a writer, teacher, and pop culture observer based in Vancouver, Canada. He earned an MSc from Simon Fraser University and an MA in film from the University of Exeter in the UK. He spent a decade teaching at the college level, delivering courses in genetics, biochemistry, cell biology, biological anthropology, and film history. His academic work includes peer-reviewed papers on the work of Alan Moore, Harvey Pekar for Studies in Comics, and a dissertation on Terry Gilliam for the University of Exeter. He has contributed to several books, including a chapter about the TV show Archer in James Bond and Popular Culture and two chapters on Breaking Bad for Breaking Bad and Masculinity. He is also a Supervising Editor for Sequart, where he has authored a chapter for New Life and New Civiliations: Exploring Star Trek Comics, as well as upcoming books about Star Wars, Alan Moore, and 1970s horror comics. Articles Archer interview The Man in the High Castle interview Link sequart.org Twitter @iandawe42 Back to Contributors"
