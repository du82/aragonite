description = "<p>Hazel Baird is a motion designer and design director based in Los Angeles, California.<br />Originally from Ayr in Scotland, Hazel lived in London for 20 years before relocating to California in 2015.&nbsp;She attended Swindon School of Art and Design in Wiltshire, England and graduated with an Honours Bachelor of Arts Degree in Graphic Design. In 2016, she&nbsp;worked with studio Prologue as a freelance art director. In 2017, she joined Elastic where she became Design Director and joined the staff. She has also worked with TBIK, Greenhaus GFX, Nickelodeon, Sony Computer Entertainment, MTV, Cartoon Network, BBC, ITV Creative, and 4 Creative.<br />She has contributed to title sequences for films WWII From Space (2013), The Fear of 13 (2015),&nbsp;Rogue One: A Star Wars Story (2016), The Great Wall (2016), You Can Tutu (2017),&nbsp;Nostalgia (2018), comedy special Dave Chappelle's Equanimity (2017), TV mini-series Planet Oil (2015),&nbsp;as well as graphics packages for The 89th Academy Awards (2017) and video game Call of Duty: Black Ops (2010). In 2013, her work on the documentary WWII From Space (2013) won a News &amp; Documentary Emmy Award for Outstanding Graphic Design&nbsp;&amp; Art Direction and&nbsp;a Royal Television Society Award for Best Graphic Design Program Content.</p>"
full_description = "Designer Hazel Baird Hazel Baird is a motion designer and design director based in Los Angeles, California. Originally from Ayr in Scotland, Hazel lived in London for 20 years before relocating to California in 2015. She attended Swindon School of Art and Design in Wiltshire, England and graduated with an Honours Bachelor of Arts Degree in Graphic Design. In 2016, she worked with studio Prologue as a freelance art director. In 2017, she joined Elastic where she became Design Director and joined the staff. She has also worked with TBIK, Greenhaus GFX, Nickelodeon, Sony Computer Entertainment, MTV, Cartoon Network, BBC, ITV Creative, and 4 Creative. She has contributed to title sequences for films WWII From Space (2013), The Fear of 13 (2015), Rogue One: A Star Wars Story (2016), The Great Wall (2016), You Can Tutu (2017), Nostalgia (2018), comedy special Dave Chappelle's Equanimity (2017), TV mini-series Planet Oil (2015), as well as graphics packages for The 89th Academy Awards (2017) and video game Call of Duty: Black Ops (2010). In 2013, her work on the documentary WWII From Space (2013) won a News & Documentary Emmy Award for Outstanding Graphic Design & Art Direction and a Royal Television Society Award for Best Graphic Design Program Content. Articles The Andy Warhol Diaries summary Between the World and Me summary The Morning Show title only Semi-Permanent Sydney 2019 interview Velvet Buzzsaw title only Dave Chappelle: Equanimity title only The Great Wall title only Link yourmotheratemydog.net Previous Studios Elastic Complete filmography"
