["https://artofthetitle.com/editor/ian-albinson"]
title = "Ian Albinson — Art of the Title"
full_description = "Editor Ian Albinson Founder Years Active: 2007—2015Ian was raised in the UK, studied graphic design at York College and time-based media at Newcastle College, and comes from a family of designers. He founded Art of the Title as a blog in 2007 and since then, the site has blossomed into a study of the creative process and has earned much critical and public acclaim. In 2011, Ian was part of the curatorial team of a major exhibit at the Walker Art Center entitled Graphic Design: Now In Production, and was a contributor to the corresponding exhibition book. He has also served as a juror for the SXSW Design Awards (2010-2014) and the Type Directors Club Annual Design Competition (2012). As of 2015, Ian has stepped back from Art of the Title operations to focus on his work as the principal of Albinson Design, a motion and graphic design studio which he runs out of an eco-friendly home he and his wife designed and built in Vermont. Speaking Engagements March 26-29, 2015: TCM Classic Film FestivalHollywood Roosevelt Hotel — Los Angeles, California June 12, 2014: PromaxBDANew York Hilton Midtown — New York City, New York June 19, 2013: PromaxBDAJW Marriott at L.A. LIVE — Los Angeles, California October 22, 2011: Graphic Design—Now in ProductionWalker Art Center — Minneapolis, Minnesota Articles View all 26 articles Orphan Black summary Les Revenants interview 2014: The Year In Review news Cosmos: A Spacetime Odyssey interview 2014 Emmy Nominations for Main Title Design news 2013: The Year in Review news Link albinsondesign.com Back to Contributors"
