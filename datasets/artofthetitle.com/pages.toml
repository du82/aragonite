title = "Dean Wares — Art of the Title"
description = "<p>Dean Wares is an art director and title designer based in Soho, London and Valencia, Spain. He is a partner and art director at The Morrison Studio.<br />Dean has worked on projects for&nbsp;directors&nbsp;including Tim Burton, Terence Davies, Tom Ford, Stephen Frears, Sam Mendes, and The Wachowskis.&nbsp;His title sequence credits include&nbsp;Enemy at the Gates&nbsp;(2001), Dark Shadows&nbsp;(2012), Jupiter Ascending&nbsp;(2015), Denial&nbsp;(2016) and War on Everyone&nbsp;(2016). He has also&nbsp;contributed to branding projects&nbsp;for Redshift Strategy, Indielab, Terry ONeil, and Daybreak Pictures. In 2015, Dean&nbsp;became&nbsp;a&nbsp;BAFTA&nbsp;Guru.<br />&nbsp;</p>"
