["https://artofthetitle.com/designer/olney-atwell"]
title = "Olney Atwell — Art of the Title"
description = "<p>Olney Atwell is a motion graphics artist and director working in tv and film. Hailing from Rockland, Maine, Atwell has over a decade of experience working in the film, TV and music industries.&nbsp;<br />After attending University of Maine's New Media program, she worked as a motion designer at Visionmill and received two Telly Awards for her work. In 2007, she enrolled in graduate school at NYU in the Digital Imaging and Design Program. In 2009, she interned at NBC and later worked as an animator and designer at MSNBC before moving to Los Angeles in 2012 to start Darkred Studios. She has designed titles for films Hot Tub Time Machine 2 (2015), Vacation (2015), Popstar: Never Stop Never Stopping (2016), Always Be My Maybe (2019), The Unauthorized Bash Brothers Experience (2019) and Young Rock (2021), as well as the TV series VEEP (Season 5) and show graphics for Modern Family, Connection Lost,&nbsp;Carpool Karaoke, Miracle Workers and The Good Place.</p>"
full_description = "Designer Olney Atwell Olney Atwell is a motion graphics artist and director working in tv and film. Hailing from Rockland, Maine, Atwell has over a decade of experience working in the film, TV and music industries. After attending University of Maine's New Media program, she worked as a motion designer at Visionmill and received two Telly Awards for her work. In 2007, she enrolled in graduate school at NYU in the Digital Imaging and Design Program. In 2009, she interned at NBC and later worked as an animator and designer at MSNBC before moving to Los Angeles in 2012 to start Darkred Studios. She has designed titles for films Hot Tub Time Machine 2 (2015), Vacation (2015), Popstar: Never Stop Never Stopping (2016), Always Be My Maybe (2019), The Unauthorized Bash Brothers Experience (2019) and Young Rock (2021), as well as the TV series VEEP (Season 5) and show graphics for Modern Family, Connection Lost, Carpool Karaoke, Miracle Workers and The Good Place. Link olneyatwell.com Complete filmography"
