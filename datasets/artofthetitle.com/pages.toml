["https://artofthetitle.com/designer/arisu-kashiwagi"]
title = "Arisu Kashiwagi — Art of the Title"
description = "<p>Arisu Kashiwagi is a director and motion graphics designer based in New York City.<br />Born in Japan and raised in Los Angeles, Arisu studied fine arts and graphic design, getting a BA from Yale University. From 2005 to 2006, she was a designer at Imaginary Forces. She has been a freelance designer since 2007, collaborating with companies including 2x4, DentsuBos, VH1, Psyop, Prologue, Leroy &amp; Clarkson, and Imaginary Forces. She has worked on the design of main titles for Stranger Things, El Chapo,&nbsp;Marvel's Jessica Jones, Boardwalk Empire, The Pacific, Magic City,&nbsp;and The Mummy: Tomb of the Dragon Emperor. In 2016, she was nominated for&nbsp;the Outstanding Main Title Design Emmy Award as part of the team responsible for the titles to Marvel's Jessica Jones. In 2017, she won&nbsp;an Emmy Award for her work on the opening to Stranger Things.&nbsp;<br />She has also designed cinematics for the Sony Playstation game God of War III, and installations for clients including Prada, Mr. Porter, USA Networks, NYCxDesign, Johnny Walker, and the LA Opera.</p>"
full_description = "Designer Arisu Kashiwagi Arisu Kashiwagi is a director and motion graphics designer based in New York City. Born in Japan and raised in Los Angeles, Arisu studied fine arts and graphic design, getting a BA from Yale University. From 2005 to 2006, she was a designer at Imaginary Forces. She has been a freelance designer since 2007, collaborating with companies including 2x4, DentsuBos, VH1, Psyop, Prologue, Leroy & Clarkson, and Imaginary Forces. She has worked on the design of main titles for Stranger Things, El Chapo, Marvel's Jessica Jones, Boardwalk Empire, The Pacific, Magic City, and The Mummy: Tomb of the Dragon Emperor. In 2016, she was nominated for the Outstanding Main Title Design Emmy Award as part of the team responsible for the titles to Marvel's Jessica Jones. In 2017, she won an Emmy Award for her work on the opening to Stranger Things. She has also designed cinematics for the Sony Playstation game God of War III, and installations for clients including Prada, Mr. Porter, USA Networks, NYCxDesign, Johnny Walker, and the LA Opera. Articles Warrior title only Castle Rock title only Stranger Things interview Marvel's Jessica Jones interview Magic City summary Boardwalk Empire interview God of War III title only The Pacific interview The Mummy: Tomb of the Dragon Emperor summary Link arisu.tv Previous Studios Imaginary Forces Prologue Films Complete filmography"
