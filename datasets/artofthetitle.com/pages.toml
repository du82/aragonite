["https://artofthetitle.com/feature/10-women-of-title-design-part-seven"]
title = "10 Women of Title Design – Part Seven  — Art of the Title"
description = "Happy Women's History Month! Celebrate with our annual list of 10 women in title design that you should know about."
full_description = '''Welcome to part seven of Art of the Title's semi-annual 10 Women of Title Design feature article, bringing the number of women showcased to 70! In March of 2015, we published our first article in celebration of International Women’s Day entitled 10 Women of Title Design. Every year since, we've returned with a new group of 10 women in the title design industry to celebrate. When I first conceptualized this feature, I knew of about 20 women whose work I could showcase. I've been doing research since then, ever on the lookout to uncover the names of women and non-binary creators working in title sequence design. I'm humbled and overjoyed to share these ten additional names. This year the list includes creative directors, animators, motion designers, and CG artists who have been creating work in the last couple of decades, spanning a variety of genres across both TV and film. Join us as we celebrate another Women's History Month and shine a light on some often unsung contributors to this artform. Feature Credits 10 Women of Title Design That You Should Know – Part Seven Claire Typaldos Title Designer Claire Typaldos Claire Typaldos is a creative director and designer based in Los Angeles, California. Originally from New York, Typaldos has created title sequences for films Blow the Man Down (2020), The Jesus Rolls (2019), Yearly Departed (2020), This Film is About My Mother (2022), and Resurrection (2022), as well as Netflix web series I Like to Watch (2019). She attended Wesleyan University, graduating with a bachelor’s degree in Fine Arts and has completed artist residencies including Anderson Ranch Arts Center in Snowmass Village, CO, Pocoapoco in Oaxaca, MX, and Kala Art Institute in Berkeley, CA. She works primarily in film, hospitality, branding and packaging design. Notable clients include Netflix, Apple, and Folklor. Blow the Man Down (2020)CATEGORY: Film Blow the Man Down (2020) – main titles by Claire Typaldos In Bridget Savage Cole and Danielle Krudy’s neo-noir black comedy Blow the Man Down, Priscilla (Sophie Lowe) and Mary Beth (Morgan Saylor) are newly orphaned sisters saddled with grief and a floundering business in the fishing village of Easter Cove, Maine. One drunken, violent night sends the sisters down a path of secrets, scoundrels and savage consequences. Named after a traditional sea shanty sung by sailors since at least the 1860s, the song in the opening works wonderfully to establish the film’s environment and the conflict at its center: the old ways butting up against a new generation. The song is thought to describe an incident at sea wherein a strong wind, most often a sudden gale during a storm, knocks a battle-ready ship (or “man-o’-war”) over. The storm, in this case, begins with two young women. Beautiful blue-tinged cinematography by Todd Banhazl (The Strange Ones, Hustlers) floats among grisled deck hands, one of whom puffs stolidly from a vape pen. The voices calling clear across the water come care of David Coffin (who gives a cheeky wink), Jacek Sulanowski, Daniel Lanier and Thomas J. Goux. The film’s title, designed by Claire Typaldos (who also designed the opening to 2022's Resurrection), appears in cream-coloured blackletter typography. The text is stacked and solid and, in a nod to the effects of older film eras, it's doused in an optical-style glow and paired with a copyright line. Clarissa Donlevy Creative Director Clarissa Donlevy Clarissa Donlevy is a creative director and designer for film, TV, games and commercials. Originally from Sydney, Australia, she began her career in London, UK, working for SuperUnion, BBC, and Carlton Television / ITV, before returning to Sydney to work for Garner Mclennan Design and Foxtel. In 2007, she relocated to Los Angeles, where she has worked with Engine Group, Prologue, yU+co, Imaginary Forces, and Elastic. She has a bachelor of arts from University of Western Sydney, where she studied design. Her title design credits include openings for films The Quiet American (2002), Dragonball Evolution (2009), Whiteout (2009), Gossip (2021), and Australia TV series Love My Way (2004). She was creative director on the title sequences to TV series His Dark Materials (2019), which won the BAFTA for Best Titles and Graphic Identity in 2020, and Netflix's The Last Dance (2020). She has directed teasers for HBO's The Pacific (2010) and Turbine's 2007 video game The Lord of the Rings Online, helmed creative direction for a 360 campaign for Redbull TV's documentary series The Horn (2016), designed visual effects sequences for The Tempest (2010) and brand identities for films Crazy, Stupid, Love (2011), Horrible Bosses (2011), and The Mortal Instruments: The City of Bones (2013). Along with the BAFTA Award, her work has been honoured with Clio, Addy and Telly Awards. His Dark Materials (2019)CATEGORY: TV His Dark Materials (2020) – main titles by Elastic For the opening to the 2019 TV adaptation of Philip Pullman's lauded His Dark Materials trilogy, studio Elastic welds together a soaring sequence of dust and doorways, mechanisms and mystery. After the first 20 seconds, the intro's movement becomes one long zoom out. A young woman stands alone, a knife behind her back and her animal companion by her side, as staircases and hallways swallow her up, Escher-style, eventually giving way to mountains and forests. Flying machines zoom across skies unknown. Cities stack one on top of the other. These worlds in parallel are arranged horizontally, strata of universes appearing like pages in a book or strings on an instrument, waiting to be plucked. When the title appears in the last frame, it is sliced in two, a fissure down its middle, foreshadowing the rift at the heart of this sweeping story. Behind these epic titles are creative director Clarissa Donlevy and a robust team of designers, animators and compositors from LA-based Elastic and Cardiff-based Painting Practice. The score, awash with hope and thumping with adventure, was created by Grammy Award-winning composer Lorne Balfe. The sequence won the 2020 BAFTA Award for Best Titles and Graphic Identity. Catalina Matamoros Puerto Title Designer Catalina Matamoros Puerto Catalina Matamoros Puerto is a Colombian animation director and illustrator. She studied design at Universidad de Los Andes and animation and digital arts at the University of Southern California. Her first short film Out of Line (2015), co-directed with Alicja Jasina, was a semifinalist at the Student Academy Awards, and her second film We Are the Immigrants (2016) has been shown in festivals around the world and was a finalist for Best School Short Film at the Iberoamerican Animation Quirino Awards.While at Los Angeles production studio Picturemill, she contributed to title sequences for Storks (2016) and Prison Break (Season 5). She has also designed titles for several shorts as well as feature film I’m Fine (Thanks for Asking) (2021). I'm Fine (Thanks For Asking) (2021)CATEGORY: Film I'm Fine (Thanks for Asking) (2021) main titles In the opening to Kelley Kali and Angelique Molina’s 2021 film I’m Fine (Thanks For Asking), single mother Danny (Kelley Kali) wheels around the streets of Pacoima, California. Danny, recently widowed, and her eight-year-old daughter Wes have been “camping” in a tent on the edge of town while they find a better situation. In a yellow tee, pink tank top, black bike shorts and fanny pack (an outfit picked out by Wes) and leopard-print roller skates, Danny dances her way into town. These moments are full of hope before the backbreaking reality of the day – scraping together enough money to secure a new apartment – gets into full swing. Set to Tha Alkaholiks’ punchy “DAAAM!” and showing Danny busting loose in front of local murals and hangouts, the opening recalls Rosie Perez’s sharp moves in Do The Right Thing (1989). Flowing cinematography by Becky Baihui Chen moves from close-ups on roller skates and dusty hands to wide shots of Danny set against vibrant wall art and busy intersections, the street corners and vacant lots bright in the sun and alive with the shake of her hips. Set atop the sequence is yellow and pink hand-lettering created by designers Catalina Matamoros Puerto and Brian Vincent Rhodes. The text wiggles and shakes, echoing Danny’s energy. It’s a radiant, personality-driven opener that shines a light into Danny’s world: lonely and gruelling but full of light, too. Tamsin McGee Creative Director Tamsin McGee Tamsin McGee is an Emmy Award-winning art director and motion designer based in London, England.Originally from Hertfordshire, McGee moved to London in the ’90s to study for a BA in Graphic Design at The London College of Printing. After graduating she joined Hugo Moss at Huge Designs. Her title design credits include Downton Abbey (2010), Da Vinci’s Demons (2013), The Newsroom (Season 2) (2013), Jekyll and Hyde (2015), The Son (2017), One of Us (2017), The Walking Dead (Season 9) (2018), and Hold the Sunset (2018). Downton Abbey (2010)CATEGORY: TV Downton Abbey (2010) – main titles by Huge Designs When Tamsin McGee and Hugo Moss of Huge Designs set about designing the title sequence of Downton Abbey, they had a major advantage: the theme music had already been created. Often designers work with temporary tracks as composers write music concurrently or after the fact but in this case composer John Lunn had stumbled into the theme early on. Scenes of expansive lawns, elegant draperies, servants’ bells, copper kettles, gilded plates and silverware, creamy roses and crystal candelabra were clipped and cut together by the team at Huge to invite viewers into the Yorkshire home of the Crawleys, an aristocratic family, and their servants in the post-Edwardian era. Lunn had initially written backing music for scenes in the first episode, which does not feature a title sequence, but by the time that episode was finished that piece of music had taken hold. Lunn reworked it into a 30-second theme that, when paired with the visuals, adds a sense of drama, intrigue and darkness to the lush imagery. “They're quite vague, the titles,” said Lunn, speaking with Town and Country about the sequence’s visuals. “You see candelabras and a dog’s bottom and there's pictures of the house but it's the music that's really kind of giving an idea of the thing you're about to see.” When the title of the show appears at last, the screen is horizontally split in two, light and dark, the words interrupted by the English country house set in the center against a cloudy sky, tiny on the sprawling horizon. Its inverse appears in the bottom half, upside-down in a black expanse. A secret world. Anna Lindqvist Title Designer Anna Lindqvist Anna Lindqvist is a motion designer, art director, and illustrator based in Sweden. Lindqvist grew up in Gothenburg, Sweden, and in 1997 she moved to Stockholm where she attended various art schools, eventually joining post company The Chimney Pot, where she created motion graphics for eight years. In 2010, she started Kavorka, a company that produces motion graphics for music videos, feature films and festivals. She has designed motion graphics and animation for Lady Gaga, Swedish House Mafia, and Maroon 5, as well as brands like Dior, Absolut, Stella McCartney, and H&M. The music video for Lady Gaga's "Paparazzi" featuring Anna's graphic design and animation won a 2009 MTV Video Music Award. She has designed the title sequences for TV series Midnight Sun (2016), Farang (2017), and Roslund & Hellström: Box 21 (2020) and for films including Suddenly (2006), Control (2007), Eastern Plays (2009), The Last Sentence (2012), and The 100-Year-Old Man Who Climbed Out the Window and Disappeared (2013), A Man Called Ove (2015), Stockholm, My Love (2016), Para Knas (2017) and Call Mom! (2019). Para Knas (2017)CATEGORY: Film Para Knas (2017) main titles “Think weird, ugly, dirty but nice.” These were the instructions that Para Knas director Nikeisha Andersson had for title designer Anna Lindqvist. For Andersson’s debut feature film, Lindqvist took that advice to heart to create a set of bombastic, cadmium-yellow title cards. Para Knas (aka Money Problem) follows teenagers Sara (Roshi Hoss) and Amida (Ellen Åkerlund), a pair of friends living in Stockholm who are yearning to break free of their financially limiting lives and willing to do it by any means necessary. The title sequence, sharply edited by Andersson, Julian Antell and Håkan Wärn and set to thumping electro from composers DeadMono, plays in lightning-fast spurts of hyper-saturated club scenes, drugs, and the consequences of a wild time. The heavy typography in black and then yellow, dotted with dollar signs, introduces the key players as the song “Hässelby Gård” by Ken Ring featuring Olle Haggberg ushers in the film. It’s a bifurcated sequence, with a trailer-like peek at the chaos to come and, after the title card, a gentle introduction to the tough but stable world of these two ambitious girls. Soyeon Kim Soyeon "Dottie" Kim is a filmmaker, illustrator, and educator based in Monterey, California. Kim was born in Seoul, Korea. While she studied painting at college, she developed an interest in moving images, which led her to the world of animation and media arts. She has been producing independent films since 1993, as well as working on projects in advertising and film production as a director, art director, designer, and animator. In 2009, she directed (with Todd Hemker) the title sequence for the animated feature film Cloudy with a Chance of Meatballs. Her independent films and commissioned works have been screened in over 400 film festivals worldwide. She runs design and animation studio Yellowshed with Hemker and teaches animation and visual/motion design at the California State University, Monterey Bay. Cloudy with a Chance of Meatballs (2009)CATEGORY: Film Cloudy with a Chance of Meatballs (2009) main-on-end titles by YELLOWSHED (Todd Hemker & Soyeon Kim) For the end of Cloudy with a Chance of Meatballs, Phil Lord and Chris Miller’s exuberant 3D-animated caper, studio Yellowshed created a delightful movable feast. Fields of cupcakes and watermelons, a bicycle with wheels of sliced citrus and boats with swiss cheese sails float by in a buffet of 2D animation laden with colour and texture. In a nod to Terry Gilliam’s stop-motion sequences for Monty Python, a hand drops into frame to place a steel cloche over a dancing Baby Brent wearing a giant roast chicken. Later, a hand makes off with a slice of cherry pie. The energy is bright and fanciful, much of it due to the continuous camera moves, the action rushing along from left to right. The delightful sequence was co-directed by Yellowshed’s Soyeon Kim and Todd Hemker, who took their cues from Lord and Miller. They wanted the film to end on an “absurdly happy note set in a utopian trippy wonderland made out of food,” says Hemker. The two worked to create a narrative for the animation that showed t'''
