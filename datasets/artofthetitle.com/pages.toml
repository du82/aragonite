["https://artofthetitle.com/designer/deborah-ross"]
title = "Deborah Ross — Art of the Title"
description = "<p>Deborah Ross is a film title designer working in the Los Angeles, California area.<br />Deborah attended Cal State University Northridge as well as Ealing College of Art in London (now University of West London), studying props design, set design, costuming, animation, and graphic design. After graduating with a Diploma of Art &amp; Design from Ealing, she returned to the U.S. and worked as an assistant for title designer Dan Perri, which allowed her to develop a taste and talent for motion graphics and logo design.<br />In 1982, she started her own logo design and motion graphics firm, Deborah Ross&nbsp;Graphic and Title&nbsp;Design. In 1986, she joined forces with title designer Nina Saxon to form Saxon/Ross Film Design, a collaboration which lasted until 1992. Thereafter, Deborah&nbsp;designed under the moniker Deborah Ross Film Design. Some of her notable title design projects include The English Patient&nbsp;(1996), The Talented Mr. Ripley (1999),&nbsp;Any Given Sunday&nbsp;(1999), Cold Mountain&nbsp;(2003), Miracle&nbsp;(2004),&nbsp;Jarhead (2005), and&nbsp;Michael Clayton&nbsp;(2007).<br />She has taught at Otis College of Art and Design, and is an active member of both the Academy of Television Arts and Sciences, and the Academy of Motion Picture Arts and Sciences.</p>"
full_description = "Designer Deborah Ross Deborah Ross is a film title designer working in the Los Angeles, California area. Deborah attended Cal State University Northridge as well as Ealing College of Art in London (now University of West London), studying props design, set design, costuming, animation, and graphic design. After graduating with a Diploma of Art & Design from Ealing, she returned to the U.S. and worked as an assistant for title designer Dan Perri, which allowed her to develop a taste and talent for motion graphics and logo design. In 1982, she started her own logo design and motion graphics firm, Deborah Ross Graphic and Title Design. In 1986, she joined forces with title designer Nina Saxon to form Saxon/Ross Film Design, a collaboration which lasted until 1992. Thereafter, Deborah designed under the moniker Deborah Ross Film Design. Some of her notable title design projects include The English Patient (1996), The Talented Mr. Ripley (1999), Any Given Sunday (1999), Cold Mountain (2003), Miracle (2004), Jarhead (2005), and Michael Clayton (2007). She has taught at Otis College of Art and Design, and is an active member of both the Academy of Television Arts and Sciences, and the Academy of Motion Picture Arts and Sciences. Articles Bad Santa summary The Talented Mr. Ripley summary The English Patient title only Stay Tuned summary Stop! Or My Mom Will Shoot title only Beauty and the Beast title only Life Stinks summary Teenage Mutant Ninja Turtles II: The Secret of the Ooze title only Wings title only Worth Winning title only Chances Are title only True Believer summary Tin Men title only Soul Man title only Production Studio Saxon/Ross Film Design Link drfilmdesign.com Previous Studios Saxon/Ross Film Design Complete filmography"
