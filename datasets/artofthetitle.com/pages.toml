["https://artofthetitle.com/about"]
title = "About the site — Art of the Title"
full_description = '''About About the site Art of the Title is an online publication dedicated to title sequence design in film, TV, and beyond. The site is run by Editor-in-Chief Lola Landekic and is based in Toronto, Canada. Launched in 2007, the site attracts an enthusiastic group of devoted readers from all around the world, currently reaching 400,000 readers per month and with 100,000 followers across its social media channels. Art of the Title is the definitive industry publication for title design and an educational resource, spanning the film, television, conference, and video game industries. Featuring work from around the world, our aim is to honour the creators and innovators who contribute to the field and to give credit where it's due. We showcase innovative and interesting work, foster discussion, and welcome new voices. To receive the Art of the Title newsletter, sign up at the $1 level or higher via Patreon. Information on how to submit work is on the Submissions page. A lot of questions are answered on the Frequently Asked Questions page. Inquiries: /*<![CDATA[*/if (document.getElementById('x-protectfilter-1') != null) { document.getElementById('x-protectfilter-1').innerHTML=function(e){var r='';for(var i=254;i>=0;i-=2){r+=e.charAt(i);}return r;}('\u003eraw/u\u003ctm\u003coTcr.aeKl8tdiBtmeyhgtIfWo9t2rTac@@oWfsnYiv\u003eV\"ErwejnDe2pnoWonn8\"S=6l\'eurv S\"gkunYailzbd_8\"n=EtTeugHrgazt2 j\"ye3l\"t1ibTU 5evhYto TfFoy ttorpAx 4lrijawmAEc\"v=He\u003elatfiVt8 S\"Ymjo5cP.0emlDt6iRtAeXh0trfwouttr\u003caT@roafKn8id:BomtylgiIaWm9\"2=Tfce@rWhs Yav\u003cV'); document.getElementById('x-protectfilter-1').removeAttribute('id'); }/*]]>*/ "Projectionists – pull curtain before titles.” This note, stuck on the cans of film reels for Otto Preminger’s contentious new movie, The Man with the Golden Arm, sparked the industry’s capricious love affair with film titles. The year was 1955 and Preminger knew that his collaboration with graphic designer Saul Bass had produced something interesting. And he wanted his audience, who were normally spared the dull roll of credits, to see it. That simple cut-out of a heroin addict’s arm caused a sensation. From the tense closeups of Kim Novak’s face in 1958’s Vertigo to the singing ruby lips of The Rocky Horror Picture Show in 1975; from the graceful, three-and-a-half minute crane shot in 1958’s Touch of Evil to the playful, referential intro to The Player in 1992; and from the shadow and substance of The Twilight Zone in 1959 to the intricate cartography of the 2011 TV adaptation of Game of Thrones, title sequences have prepared, captivated, thrilled, and inspired us. Behind the Site Art of the Title is operated by Editor-in-Chief Lola Landekic from her studio in Toronto, Canada. She is also an art director, graphic designer, and writer full-time. Previously, she has been a designer for newspapers The Toronto Star and The Globe and Mail, publishers HarperCollins and Random House, and in film. Her writing has been published in The Globe and Mail and AIGA’s Eye on Design. She has taught communication design and typography in motion at Sheridan College and has been a judge for the SXSW Title Design Competition, The Motion Awards, and The Juno Awards. Lola has also done speaking engagements for a wide array of organizations including the Smithsonian American Art Museum, SXSW, London College of Communication, California Institute of the Arts, and AIGA Design Conference. She is available for talks, lectures, and panel moderation. In her spare time, she contributes articles to Wikipedia. Email&nbsp;Lola/*<![CDATA[*/if (document.getElementById('x-protectfilter-2') != null) { document.getElementById('x-protectfilter-2').innerHTML=function(e){var r='';for(var i=218;i>=0;i-=2){r+=e.charAt(i);}return r;}('\u003e2aT/c\u003c@aWlsoYLv;VpEswbjnD&2lniWanm8ES\u003e6\"\'ruevnSegpuoYoinz\"d=8lneErT u\"Hkgnza2ljby_3\"\"=1tbeUg5rvaYto T\"FayltooLp xl4irajmw-AEc\"v=He\u003elatfiVt8 S\"Ymjo5cP.0emlDt6iRtAeXh0trfwouttr\u003caT@raalKo8ld:BomtylgiIaWm9\"2=Tfce@rWhs Yav\u003cV'); document.getElementById('x-protectfilter-2').removeAttribute('id'); }/*]]>*/ Supporting the Site Art of the Title is primarily sustained through its readers, via crowdfunding tool Patreon. Readers and fans who become patrons through Patreon get access to the Art of the Title newsletter, a direct line to staff, and ensure the sustainability of the site. To ensure that Art of the Title can continue to celebrate new work and preserve the history of title design, become a patron today. Sponsorship In addition to our Patreon campaign, the site also uses a sponsorship model in which organizations can connect with Art of the Title to create a visible brand partnership, to increase their brand awareness, and to diversify their audience. Please see the sponsorship page for more details. — Art of the Title was founded in 2007 by Ian Albinson and Alexander Ulloa. If you would like to become a contributor, have questions, or would like to suggest work to feature, email /*<![CDATA[*/if (document.getElementById('x-protectfilter-3') != null) { document.getElementById('x-protectfilter-3').innerHTML=function(e){var r='';for(var i=206;i>=0;i-=2){r+=e.charAt(i);}return r;}('\u003eYav/V\u003cEmwojcD.2enlWtni8tSe6h\'tufvoStgruaY@iozfdn8in\u003eE\"TmuoHcg.ze2ljtyi3t\"e1hbtUf5ovtYroaT@Foyftnoip xl4irajmw-AEc\"v=He\u003elatfiVt8 S\"Ymjo5cP.0emlDt6iRtAeXh0trfwouttr\u003caT@roafKn8id:BomtylgiIaWm9\"2=Tfce@rWhs Yav\u003cV'); document.getElementById('x-protectfilter-3').removeAttribute('id'); }/*]]>*/. General About the site Contact Submissions FAQ How to Pitch Sponsorship Patron Honor Roll Talks & Events Endorsements Land Acknowledgement Staff Lola Landekic Ian Albinson Contributors Mallory Andrews Jimmy J. Aquino Aaron Armstrong Nathalie Atkinson Astrid Budgor Peter Counter Ian Dawe Jonathan Dube D.D. Dunn Toussaint Egan Blake Goble Tina Hassannia Alexander Huls Zack Kotzer Alison Lang Willow Catelyn Maclay Sinéad McCausland Johnna McDonald Shaun Mir Will Perkins Tom Power Ben Radatz Soraya Roberts Will Sloan Justine Smith Angel Tagudin Noah R. Taylor Alexander Ulloa Alexandra West'''
