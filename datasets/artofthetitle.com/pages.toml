["https://artofthetitle.com/designer/tnaya-witmer"]
title = "Tnaya Witmer — Art of the Title"
description = "<p>Tnaya Witmer is a motion designer and art director based in Los Angeles.<br />Witmer graduated from the Art Institute of Pittsburgh with a degree in Video Production in 2005 and began her career in the film and television industry as a freelance editor before transitioning into motion graphics.<br />In 2014, Witmer joined&nbsp;Sarofsky&nbsp;Corp. in Chicago where she worked on title sequences for Captain America: The Winter Soldier&nbsp;(2014), Guardians of the Galaxy (2014) and Guardians of the Galaxy Vol. 2 (2017), OFFF Mexico 2015, Ant-Man (2015), Doctor Strange (2016) and Captain America: Civil War (2016). In 2018, she moved to Los Angeles to pursue freelance projects. She has also worked on titles for films Halloween (2018) and Captain Marvel (2019); TV series Weird City, Only Murders in the Building, Mayors of Kingstown, and The Kings of Napa; as well as commercials for Verizon, Budweiser, and Minute Maid. In 2022, she was nominated for an Emmy Award for Outstanding Main Title Design for her work on the opening titles to Only Murders in the Building.</p>"
full_description = "Designer Tnaya Witmer Tnaya Witmer is a motion designer and art director based in Los Angeles. Witmer graduated from the Art Institute of Pittsburgh with a degree in Video Production in 2005 and began her career in the film and television industry as a freelance editor before transitioning into motion graphics.In 2014, Witmer joined Sarofsky Corp. in Chicago where she worked on title sequences for Captain America: The Winter Soldier (2014), Guardians of the Galaxy (2014) and Guardians of the Galaxy Vol. 2 (2017), OFFF Mexico 2015, Ant-Man (2015), Doctor Strange (2016) and Captain America: Civil War (2016). In 2018, she moved to Los Angeles to pursue freelance projects. She has also worked on titles for films Halloween (2018) and Captain Marvel (2019); TV series Weird City, Only Murders in the Building, Mayors of Kingstown, and The Kings of Napa; as well as commercials for Verizon, Budweiser, and Minute Maid. In 2022, she was nominated for an Emmy Award for Outstanding Main Title Design for her work on the opening titles to Only Murders in the Building. Articles Captain Marvel title only Halloween title only Guardians of the Galaxy Vol. 2 interview Doctor Strange title only OFFF Mexico 2015 interview Ant-Man title only Guardians of the Galaxy title only Link tnayawitmer.com Previous Studios Sarofsky Corp. Complete filmography"
