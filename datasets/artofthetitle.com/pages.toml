["https://artofthetitle.com/contributor/blake-goble"]
title = "Blake Goble — Art of the Title"
full_description = "Contributor Blake Goble Blake Goble is a writer, designer, and media maestro, but above all, a lifelong devotee to the art of film. He’s written over 200 entertainment pieces for Consequence of Sound as a Senior Staff Writer, and back in the day, over 150 pieces for The Michigan Daily. Blake’s been featured in TIME, on ESPN radio, and Errol Morris once retweeted him. Blake won't stop talking about that last thing. Blake studied Art & Design at The University of Michigan, and he holds a masters in Cinema & Media Studies from DePaul University. Did you know that he learned how to operate a VCR through watching Ghostbusters early and often, in his little directors chair with a bottle and blankie? Articles Man Seeking Woman interview Link thekellyaffair.com Twitter @BlakeGoble Back to Contributors"
