full_description = "Contributor Tina Hassannia Tina Hassannia is a freelance journalist who specializes in film, TV, culture, and psychology. She is the author of the book Asghar Farhadi: Life and Cinema, and served as Executive Editor at Movie Mezzanine. She is a member of the Toronto Film Critics Association and has written for a variety of publications, including the National Post, The Globe and Mail, Roger Ebert, Variety, The Village Voice, CBC, and VICE. Along with Mallory Andrews, she co-hosted the pop culture podcast Everything But Sports. Articles Cleo from 5 to 7 summary Link tinahassannia.net Twitter @tinahassannia Back to Contributors"
