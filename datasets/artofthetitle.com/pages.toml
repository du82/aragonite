["https://artofthetitle.com/about/endorsements"]
title = "Endorsements — Art of the Title"
full_description = '''About Endorsements David Fincher, director of Se7en, Fight Club, The Girl with the Dragon Tattoo: "I love the site. It’s really beautiful. I would much rather have anything and everything about the title sequence be on Art of the Title than in USA Today or any publication like that. Your site is the proper context for this conversation." Edgar Wright, director of Scott Pilgrim vs. the World, Shaun of the Dead, Hot Fuzz: "Ubercool Art of the Title is one of my fav films sites."[Twitter] Charles de Lauzirika, director of Crave: "Art of the Title, the highly-respected and essential website devoted to title design in film and television, has chosen to spotlight Crave today with an in-depth look at Raleigh Stewart’s imaginative and amusingly disturbing credits for the film. As Criterion is to home video and Cinefex is to visual effects, Art of the Title is to title design. To say I’m honored is a colossal understatement." Joel Hodgson, creator of Mystery Science Theater 3000: "One of my all time favorite articles about the making of MST3K." Drew Goddard, director of The Cabin in the Woods: "That might be my favorite interview I’ve done on Cabin. Beautiful work." Jorma Taccone, director of MacGruber, writer on SNL: "If you like movie making, and friggin' radical websites, check out Art of the Title! They are the jump off!"[Twitter] Aaron Becker, title designer on The Conjuring: “We were fortunate to have received a few accolades for the [title sequence], for which we are grateful. Few of these would have been made possible without the help of the wonderful online resource Art of the Title, which highlights the importance of this art form as an integral part of the filmmaking process. Documenting the history, as well as the recently released, Art of the Title is an incredibly insightful website that pays homage to both the originators and our contemporaries alike.” General About the site Contact Submissions FAQ How to Pitch Sponsorship Patron Honor Roll Talks & Events Endorsements Land Acknowledgement Staff Lola Landekic Ian Albinson Contributors Mallory Andrews Jimmy J. Aquino Aaron Armstrong Nathalie Atkinson Astrid Budgor Peter Counter Ian Dawe Jonathan Dube D.D. Dunn Toussaint Egan Blake Goble Tina Hassannia Alexander Huls Zack Kotzer Alison Lang Willow Catelyn Maclay Sinéad McCausland Johnna McDonald Shaun Mir Will Perkins Tom Power Ben Radatz Soraya Roberts Will Sloan Justine Smith Angel Tagudin Noah R. Taylor Alexander Ulloa Alexandra West'''
