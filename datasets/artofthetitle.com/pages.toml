["https://artofthetitle.com/designer/allison-brownmoore-1"]
title = "Allison Brownmoore — Art of the Title"
description = "<p>Allison Brownmoore is a design director based in London.&nbsp;<br />Brownmoore is founder of design studio Past Curfew, which specializes in design and animation for film and episodic productions. Previously, she was co-founder of design and visual effects studio Blue Spill. She has been nominated for a BAFTA Award and has served on juries for D&amp;AD, BAFTA and other animation and design panels. She has designed titles and in-film motion sequences for over 70 films, including over twenty Sundance films and such titles as Listen to Me Marlon (2015), We Are X (2016), and Why We Hate (2019).<br />&nbsp;<br />Brownmoore has a&nbsp;Masters in Design Studies from Central Saint Martins School of Art and Design in London and a BA in Communications, Theatre &amp; Media from Charles Sturt University in Australia. She has also undertaken artist residencies in Canada, with St. Norbert Art Centre, and in China, with Platform China&rsquo;s International Artist Residency program.</p>"
full_description = "Designer Allison Brownmoore Allison Brownmoore is a design director based in London. Brownmoore is founder of design studio Past Curfew, which specializes in design and animation for film and episodic productions. Previously, she was co-founder of design and visual effects studio Blue Spill. She has been nominated for a BAFTA Award and has served on juries for D&AD, BAFTA and other animation and design panels. She has designed titles and in-film motion sequences for over 70 films, including over twenty Sundance films and such titles as Listen to Me Marlon (2015), We Are X (2016), and Why We Hate (2019). Brownmoore has a Masters in Design Studies from Central Saint Martins School of Art and Design in London and a BA in Communications, Theatre & Media from Charles Sturt University in Australia. She has also undertaken artist residencies in Canada, with St. Norbert Art Centre, and in China, with Platform China’s International Artist Residency program. Articles Why We Hate title only We Are X interview Listen to Me Marlon title only Production Studio Blue Spill Link pastcurfew.co.uk Previous Studios Blue Spill Complete filmography"
