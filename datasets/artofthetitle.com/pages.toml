["https://artofthetitle.com/designer/david-penn"]
title = "David Penn — Art of the Title"
description = "<p>David Penn is a title designer and creative director working in film, TV, computer games, and live events.&nbsp;<br />Originally from Shropshire, England, Penn studied English literature and language before moving into graphics and motion design. He has worked with studios including Prologue, Elastic, MPC, Jellyfish Pictures, Territory Studio, Tomato, Sony Computer Entertainment, Universal Pictures, Warner Brothers, CNN, Netflix, and others.<br />He has designed title sequences for The Widowmaker (2015), Hitman: Agent 47 (2015),&nbsp;Race for the White House (2016), American Dynasties: The Kennedys (2018), The Commuter (2018), and&nbsp;The Bush Years: Family, Duty, Power (2019). He has also contributed user interface design and animation to films Ex Machina (2014), Guardians of the Galaxy (2014), Ready Player One (2018), and Hunter Killer (2018), as well as arena and live show visuals for performers including Take That, One Direction, Pet Shop Boys, and Steve Coogan. He is based in London, England.&nbsp;</p>"
full_description = "Designer David Penn David Penn is a title designer and creative director working in film, TV, computer games, and live events. Originally from Shropshire, England, Penn studied English literature and language before moving into graphics and motion design. He has worked with studios including Prologue, Elastic, MPC, Jellyfish Pictures, Territory Studio, Tomato, Sony Computer Entertainment, Universal Pictures, Warner Brothers, CNN, Netflix, and others. He has designed title sequences for The Widowmaker (2015), Hitman: Agent 47 (2015), Race for the White House (2016), American Dynasties: The Kennedys (2018), The Commuter (2018), and The Bush Years: Family, Duty, Power (2019). He has also contributed user interface design and animation to films Ex Machina (2014), Guardians of the Galaxy (2014), Ready Player One (2018), and Hunter Killer (2018), as well as arena and live show visuals for performers including Take That, One Direction, Pet Shop Boys, and Steve Coogan. He is based in London, England. Articles The Bush Years: Family, Duty, Power title only American Dynasties: The Kennedys title only The Widowmaker summary Link david-penn.com Complete filmography"
