["https://artofthetitle.com/designer/barbara-laszewski-garner"]
title = "Barbara Laszewski Garner — Art of the Title"
description = "<p>Barbara Laszewski Garner is a creative director and title designer based in Nashville, Tennessee.<br />Hailing from New York City, Laszewski Garner studied at Parsons, Pratt, and School of Visual Arts in New York City, eventually earning a Bachelor of Fine Arts from the School of Visual Arts, specializing in graphic design. She began her career as an assistant art director at the Carden &amp; Cherry, an advertising agency in Nashville well known for its commercials featuring Jim Varney&rsquo;s Ernest character. Soon, she moved over to startup Cascom to work in motion graphics for display and broadcast. In 1989, she created the motion graphics for the Ernest P. Worrell TV series Hey Vern, It&rsquo;s Ernest!, which earned her a Daytime Emmy Award. She continued to work on the Ernest franchise, creating title sequences for Ernest Goes to Jail, Ernest Scared Stupid, Ernest Rides Again, and Ernest Goes to School. She has also created graphics packages and opening titles for CBS, TNN, PBS, and CMT, as well as graphics for music videos and TV segments.</p>"
full_description = "Designer Barbara Laszewski Garner Barbara Laszewski Garner is a creative director and title designer based in Nashville, Tennessee. Hailing from New York City, Laszewski Garner studied at Parsons, Pratt, and School of Visual Arts in New York City, eventually earning a Bachelor of Fine Arts from the School of Visual Arts, specializing in graphic design. She began her career as an assistant art director at the Carden & Cherry, an advertising agency in Nashville well known for its commercials featuring Jim Varney’s Ernest character. Soon, she moved over to startup Cascom to work in motion graphics for display and broadcast. In 1989, she created the motion graphics for the Ernest P. Worrell TV series Hey Vern, It’s Ernest!, which earned her a Daytime Emmy Award. She continued to work on the Ernest franchise, creating title sequences for Ernest Goes to Jail, Ernest Scared Stupid, Ernest Rides Again, and Ernest Goes to School. She has also created graphics packages and opening titles for CBS, TNN, PBS, and CMT, as well as graphics for music videos and TV segments. Articles The Importance of Being Ernest: A Title Design Retrospective feature Ernest Goes to School title only Ernest Rides Again title only Ernest Scared Stupid interview Ernest Goes to Jail title only Hey Vern, It's Ernest! title only Complete filmography"
