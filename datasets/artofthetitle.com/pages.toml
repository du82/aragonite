title = "Se7en (1995) — Art of the Title"
description = "A grotesque vision seen through the eyes of a killer in David Fincher and Kyle Cooper's fragmented opening titles for Se7en."
full_description = '''Directed in 1995, David Fincher's Se7en is a film that defies easy categorization. Perhaps too dark to qualify as a golden classic despite having all the right ingredients, neither is it a cult film in the traditional sense, as it is stocked with A-list talent and propped up by a smart script, a memorable score and rich cinematography, and a production value in lockstep with Fincher's vision for the film. But few would question its merits as a cop drama, which as a genre trails right behind Westerns as films that Americans love to love but rarely support at the box office. Se7en beat those odds and enjoyed wide critical and popular success thanks in large part to a strong word of mouth around the film's many hairpin turns, and one other thing: its title sequence. The film doesn't open directly with the sequence. It first introduces us to retiring Detective Somerset (Morgan Freeman) and rookie replacement Detective Mills (Brad Pitt) as they also meet for the first time, establishing their combative on-screen chemistry and investing the audience in the evolution of their partnership. This prelude also introduces many of the key themes found in Se7en: hopelessness, apathy, desperation and – lest we wonder why – plenty of violence. By the end, we welcome Somerset's nighttime zen ritual of drowning out the chaos with a metronome on his nightstand, its hypnotic rhythm also asking for our trust and attention. Instead, it delivers us into an even darker world, which – unlike the random city violence beneath Somerset's window – is obsessive, methodic, and purposeful. Directed by Kyle Cooper while at the newly-formed Los Angeles arm of titling giant R/Greenberg Associates, it's a short story told in fragments and vignettes, following the hands of an unknown man – presumably the antagonist, John Doe – as he makes entries in his diary alongside clippings from books, self-developed photographs, and found images and objects, giving the audience an intimate look into the mind of a serial killer obsessed with religion and, more to the point, attrition. View 20 images Process photographs var gallery19e2785a_a9f6_44a2_bb68_ce120316a758 = new View( [ { src: '/assets/sm/upload/tb/cd/0b/hk/s_process2_01.jpg?k=321f3ed48d' }, { src: '/assets/sm/upload/t3/cq/gh/tg/s_process2_02.jpg?k=bd153b4282' }, { src: '/assets/sm/upload/zz/df/eh/cj/s_process2_03.jpg?k=defad1751d' }, { src: '/assets/sm/upload/44/nm/vx/kr/s_process2_04.jpg?k=feb9b800c6' }, { src: '/assets/sm/upload/bh/h2/rz/pf/s_process2_05.jpg?k=28e0eb32a4' }, { src: '/assets/sm/upload/ju/fp/um/xk/s_process2_06.jpg?k=219b801f2f' }, { src: '/assets/sm/upload/yv/gv/h1/hw/s_process2_07.jpg?k=a6db38cd73' }, { src: '/assets/sm/upload/vi/a6/o3/w7/s_process2_08.jpg?k=9705b3bcfa' }, { src: '/assets/sm/upload/z1/x9/o8/v8/s_process2_09.jpg?k=e53b03f04a' }, { src: '/assets/sm/upload/ts/nf/gu/a0/s_process2_10.jpg?k=968af530d3' }, { src: '/assets/sm/upload/2o/bc/ve/nl/s_process2_11.jpg?k=64546603c7' }, { src: '/assets/sm/upload/l6/4s/3g/rd/s_process2_12.jpg?k=03de7e3866' }, { src: '/assets/sm/upload/wm/61/wk/ik/s_process2_13.jpg?k=bede5b02c3' }, { src: '/assets/sm/upload/mt/f3/ou/4g/s_process2_14.jpg?k=c1bc100a59' }, { src: '/assets/sm/upload/g0/ny/dc/1k/s_process2_15.jpg?k=aba5831cf4' }, { src: '/assets/sm/upload/9n/rx/sm/iw/s_process2_16.jpg?k=39ff67446a' }, { src: '/assets/sm/upload/8z/wh/ng/ml/s_process2_17.jpg?k=e885f4de3d' }, { src: '/assets/sm/upload/s7/gp/mb/t7/s_process2_18.jpg?k=92e4dcf8f6' }, { src: '/assets/sm/upload/81/4c/br/zu/s_process2_19.jpg?k=2acd6d71e4' }, { src: '/assets/sm/upload/cd/84/mo/w7/s_process2_20.jpg?k=0edda46c68' } ], { zoom: true } ); It's a sequence that has drawn comparisons to the grotesque photography of Joel-Peter Whitkin and the experimental self-aware filmmaking of Stan Brakhage, and its format has been likened to Stephen Frankfurt's title design for Robert Mulligan's 1963 adaptation of the courtroom thriller To Kill a Mockingbird, which also features close-up photography of personal items to describe the psyche of one of the film's key players. But it is more likely a convergence of unique circumstances and artistic vision that gave the Se7en titles their own distinct cadence, blending Fincher's treatment of the film itself with Cooper's visual interpretation of its narrative. And what ultimately distinguishes Se7en is its delivery, piecing together bits of leader and other film artifacts with ephemeral imagery and type etched right into the emulsion, all sewn together by Angus Wall's staccato edit and Coil/Danny Hide's nail-on-chalkboard remix of Trent Reznor's industrial hit "Closer." It's an effortless presentation which – much like the killer's diary featured within – wears its construction proudly on its sleeve. View 12 images Type + photograph comps var galleryf386f33c_6afd_4ac4_b756_9fbbdae57e72 = new View( [ { src: '/assets/sm/upload/mq/wz/yp/tz/s_type%2Bphotos_01.jpg?k=780549e153' }, { src: '/assets/sm/upload/90/0m/3j/ev/s_type%2Bphotos_02.jpg?k=06f8b8965d' }, { src: '/assets/sm/upload/xw/pv/p7/oq/s_type%2Bphotos_03.jpg?k=6654228876' }, { src: '/assets/sm/upload/1x/y0/o4/15/s_type%2Bphotos_04.jpg?k=2b227250af' }, { src: '/assets/sm/upload/9d/op/5q/fk/s_type%2Bphotos_05.jpg?k=f84a4e2c77' }, { src: '/assets/sm/upload/q4/v5/38/ny/s_type%2Bphotos_06.jpg?k=f84a4e2c77' }, { src: '/assets/sm/upload/ki/21/8o/iz/s_type%2Bphotos_07.jpg?k=d015237091' }, { src: '/assets/sm/upload/8c/m4/s0/10/s_type%2Bphotos_08.jpg?k=eb5b5da395' }, { src: '/assets/sm/upload/6g/dr/at/jz/s_type%2Bphotos_09.jpg?k=138c08a968' }, { src: '/assets/sm/upload/89/cq/47/gh/s_type%2Bphotos_10.jpg?k=ab075356f5' }, { src: '/assets/sm/upload/m0/ro/s0/86/s_type%2Bphotos_11.jpg?k=a145f99c0f' }, { src: '/assets/sm/upload/b5/lm/u7/l6/s_type%2Bphotos_12.jpg?k=af6ccf1db9' } ], { zoom: true } ); Fincher had originally considered director Mark Romanek for the title sequence, who had previously worked with Reznor on the music video for “Closer,” and with whom he shared similar aesthetic sensibilities. But Cooper felt an immediate connection with the material and pitched Fincher on an evolution of a technique he had used in several past title sequences. "I had done a lot of tabletop shoots – I had just shot money burning for Dead Presidents, and in fact, cutting “God” out of the dollar bill, I thought of that when I was looking at the dollar bill with the word “God” burning in it, and I was thinking about what John Doe might do." "When I was a kid and I would watch horror movies," reflects Cooper, "the monster didn't come out until the third act. I was lucky to watch [Se7en] early on, and I remember thinking that after I saw it, I wanted to see the killer earlier on… to somehow introduce the killer in the titles. I asked if I could look at all the props and anything that Fincher might have to look at, and there were a couple of prop notebooks that had excessive writing in them, and I thought it would be good to do a tabletop shoot with them and have it be about their preparation, as though it was John Doe's job to prepare them." The notebooks themselves were created by designers Clive Piercy and John Sabel, who filled the pages with large blocks of text, broken only by the occasional macabre photograph or ambiguous artifact taped in place. "There was a whole shelf full of books, and probably six of them had content inside," says Cooper, "and maybe two of them had a number of pages with excessive writing in them, with words like 'lust' and 'greed' – you know, John Doe's notes – and so we used some of that production artwork, and some of them we just expounded on and made our own." "The Notebooks" featurette, with commentary by designers Clive Piercy and John Sabel(From the 2010 Blu-ray) Fincher had originally envisioned the sequence as a train ride from Somerset's suburban would-be retirement home back into the city, simultaneously creating a connection and a distance between the two locations. But when the suburban location was cut from the film, the focus instead turned to John Doe and his notebooks. "Once we talked about the idea of shooting his books, then I would meet with Fincher and he would come up with ideas of what to shoot, and I would come up with shots and we'd compare notes and start making storyboards." Cooper and his team at R/GA, including graphic designer Jenny Shainin, assembled a glorified slideshow of sorts, cutting photographs together with temporary title cards to convey the mood of the sequence. "We photographed books and shadows and mapped it all out with stills to get an idea of what it would look like when you see through the pages and you see the shadows behind the page and the backlight." This early sequence was further developed through storyboards by artist Wayne Coe, which were referenced during the live action shoot. View 21 images Storyboard art by Wayne Coe var galleryba78ba19_f6ac_432c_8bec_f86b941b0c17 = new View( [ { src: '/assets/sm/upload/f8/29/rq/5j/s_coe_boards_full.jpg?k=b50c3e1dce' }, { src: '/assets/sm/upload/1y/rq/3h/v8/Se7en%20board%2001.jpg?k=fd0f3d46f4' }, { src: '/assets/sm/upload/f2/9s/rv/h7/Se7en%20board%2002.jpg?k=9879bb9fe0' }, { src: '/assets/sm/upload/9r/yh/fz/ja/Se7en%20board%2003.jpg?k=bd928ce6ef' }, { src: '/assets/sm/upload/sm/6e/1n/4h/Se7en%20board%2004.jpg?k=b0f825d842' }, { src: '/assets/sm/upload/ym/nb/si/bb/Se7en%20board%2005.jpg?k=b0f825d842' }, { src: '/assets/sm/upload/n0/np/e6/rh/Se7en%20board%2006.jpg?k=431f2f69ac' }, { src: '/assets/sm/upload/u4/6y/hu/d5/Se7en%20board%2007.jpg?k=74f0692915' }, { src: '/assets/sm/upload/t6/e9/06/sq/Se7en%20board%2008.jpg?k=a3bbca61cb' }, { src: '/assets/sm/upload/qd/xx/lb/25/Se7en%20board%2009.jpg?k=a3bbca61cb' }, { src: '/assets/sm/upload/wm/sw/y2/ud/Se7en%20board%2010.jpg?k=f7075ffdd1' }, { src: '/assets/sm/upload/p3/8o/jz/wx/Se7en%20board%2011.jpg?k=0f5ab2c7a6' }, { src: '/assets/sm/upload/y4/iz/km/u3/Se7en%20board%2012.jpg?k=2afce3ff1b' }, { src: '/assets/sm/upload/fi/iv/qf/bd/Se7en%20board%2013.jpg?k=4a2930cc4f' }, { src: '/assets/sm/upload/cr/qp/6q/4j/Se7en%20board%2014.jpg?k=4a2930cc4f' }, { src: '/assets/sm/upload/i5/1y/w0/vx/Se7en%20board%2015.jpg?k=707c045a2c' }, { src: '/assets/sm/upload/3u/6a/ch/6c/Se7en%20board%2016.jpg?k=3504d7f66d' }, { src: '/assets/sm/upload/9p/x2/0k/x5/Se7en%20board%2017.jpg?k=a61795a4c0' }, { src: '/assets/sm/upload/kd/j3/di/ar/Se7en%20board%2018.jpg?k=ac8d907ed8' }, { src: '/assets/sm/upload/3e/on/4r/3r/Se7en%20board%2019.jpg?k=ac8d907ed8' }, { src: '/assets/sm/upload/e8/yx/ul/tw/Se7en%20board%2020.jpg?k=6b857d6bb4' } ], { zoom: true } ); The typography itself – which would likely break several guild legibility rules in modern times – was hand-etched into black-surface scratchboard and manipulated during the film transfer process to further smear and jitter it. This transfer was then cut up and reassembled during post production to add a final layer of temporal distress. "Fincher and I decided to use hand-drawn [type] mixed with Helvetica, and he was very excited by it," says Cooper. "He knew that he wanted it to be drawn by hand, because it was from the mind of the killer, and I was taking that further, wanting it to be like the killer did the film opticals himself." View 6 images var galleryd3ff55eb_0eb9_4a52_a4ac_761c0e6c74c2 = new View( [ { src: '/assets/sm/upload/43/d1/5a/lt/s_type_examples_01.jpg?k=83fceb76fa' }, { src: '/assets/sm/upload/q5/9a/v7/pw/s_type_examples_02.jpg?k=7b579cc63a' }, { src: '/assets/sm/upload/2y/2a/bn/iv/s_type_examples_03.jpg?k=80ca306fcc' }, { src: '/assets/sm/upload/rv/4v/dt/pd/s_type_examples_04.jpg?k=331cc4b949' }, { src: '/assets/sm/upload/qo/y3/34/td/s_type_examples_05.jpg?k=ce31e000bd' }, { src: '/assets/sm/upload/yz/7a/re/y6/s_type_examples_06.jpg?k=4c221b3765' } ], { zoom: true } ); This sentiment was not only reflected in the content of the sequence, but also in its assembly. Even though digital editing and compositing were already commonplace in Hollywood and especially in post-production, Cooper and his team opted to assemble the majority of the sequence by hand, giving it an analog warmth and randomness which may have otherwise been cheapened by digital effects. "People think that there's computer graphics in there, but having to deliver the thing as a traditional film optical and trying to encourage the guy working the optical printer to not throw away things that are accidents that we actually wanted in there, with fish hooks and razor blades going through the roll-up machine – it was just an interesting time," reflects Cooper. "You can plan for everything and say we're going to do something that looks effortless, but that's not really realistic – it takes on a life of its own." Early storyboard edit, with commentary by title designer Kyle Cooper(From the 2010 Blu-ray) It is ironic, then, that the Se7en titles are often credited as the beginning of a new renaissance in title design defined in large part by – or at least enabled by – pixels and digits. And even more so given that its impact on the title industry is still felt almost two decades on, both as a legacy and in the countless knock-offs it has inspired over the years, having been co-opted almost wholesale by the horror genre as a house style. In 2011, IFC ranked Se7en as the third greatest title sequence of all time, behind Richard Lester's A Hard Day's Night and Saul Bass' Vertigo; the New York Times credited it as "…one of the most important design innovations of the 1990s." But perhaps John Doe describes it best in his own words: "Wanting people to listen, you can't just tap them on the shoulder anymore. You have to hit them with a sledgehammer, and then you'll notice you've got their strict attention." SUPPLEMENTAL: End credit crawl Credits Digital Visual Efects and Main Title Sequence by: R/Greenberg Associates West, Inc.(A division of R/GA Digital Studios)Main and End Titles Designed and Executed by: Kyle Cooper(Designed in collaboration with David Fincher and Jenny Shainin)Director of Photography: Harris SavidesDirector of Photography, Graphics: Findley BuntingEditor: Angus WallStoryboard Art: Wayne CoeVisual Effects and Main Title Producers: Peter Frankfurt, Steven T PuriVisual Effects Supervisior: Greg KimbleVisual Effects Coordinator: Tim ThompsonMain Title Producer: Rebecca Ramsey, RGA/LAMain Title Opticals by: Pacific TitleMusic:"Closer (Coil/Danny Hide remix)" by Trent Reznor Support Art of the TItle kofiwidget2.init('DONATE ON KO-FI', '0099DD', 'R6R3101C6Q');kofiwidget2.draw(); Related David Fincher: A Film Title Retrospective feature interview Dawn of the Dead summary The Island of Dr. Moreau summary R/Greenberg Associates: A Film Title Retrospective feature interview The Incredible Hulk interview American Horror Story title only Title sequence Production Studio R/Greenberg Associates (R/GA) Title Designer Kyle Cooper Director David Fincher Editor Angus Wall Category Film Styles 1990s, end crawl, experimental, graphic, hand drawn, live action, m'''
