title = "Margherita Premuroso — Art of the Title"
description = "<p>Margherita Premuroso is an award-winning art director, character designer, animator, and illustrator working&nbsp;in title sequences, commercials,&nbsp;film, video games, and print.<br />She has contributed to title sequences for Suburbicon (2017), Feud: Bette and Joan (2017), The Putin Interviews (2017), Lodge 49 (2018), Tell Me&nbsp;A&nbsp;Story (2018), Velvet Buzzsaw (2019), and Semi-Permanent Sydney 2019. She has worked with studios Prologue, Elastic, and Mustache.<br />Her works have been screened and awarded at Siggraph, Siggraph Asia, OneDotZero, Vimeo Film Festival, Tokyo Anime, Future Film Festival and others.&nbsp;<br />In 2017, she was nominated for an Outstanding Main Title Design Emmy Award for the Feud: Bette and Joan (2017) title sequence. She is based in Milan, Italy.</p>"
full_description = "Designer Margherita Premuroso Margherita Premuroso is an award-winning art director, character designer, animator, and illustrator working in title sequences, commercials, film, video games, and print. She has contributed to title sequences for Suburbicon (2017), Feud: Bette and Joan (2017), The Putin Interviews (2017), Lodge 49 (2018), Tell Me A Story (2018), Velvet Buzzsaw (2019), and Semi-Permanent Sydney 2019. She has worked with studios Prologue, Elastic, and Mustache. Her works have been screened and awarded at Siggraph, Siggraph Asia, OneDotZero, Vimeo Film Festival, Tokyo Anime, Future Film Festival and others. In 2017, she was nominated for an Outstanding Main Title Design Emmy Award for the Feud: Bette and Joan (2017) title sequence. She is based in Milan, Italy. Articles Semi-Permanent Sydney 2019 interview Velvet Buzzsaw title only Feud: Bette and Joan summary Link margheritapremuroso.com Complete filmography"
