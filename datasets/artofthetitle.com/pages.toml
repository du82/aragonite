["https://artofthetitle.com/designer/anna-lindqvist"]
title = "Anna Lindqvist — Art of the Title"
description = '''<p>Anna Lindqvist is a motion designer, art director, and illustrator based in Sweden.&nbsp;<br />Anna grew up in Gothenburg, Sweden, and in 1997, she moved to Stockholm where she attended various art schools, learning sculpture, painting, and digital storytelling. She began her career with an internship at The Chimney Pot, the largest post production company in Sweden, where she worked in motion graphics for eight years.<br />In 2010, she started Kavorka, a company that produces motion graphics for music videos, feature films, and festivals. She has designed motion graphics and animation for Lady Gaga, Swedish House Mafia, and Maroon 5, as well as brands like Dior, Absolut, Stella McCartney, and H&amp;M. The music video for Lady Gaga's "Paparazzi" featuring Anna's graphic design and animation won a 2009 MTV Video Music Award.<br />She has designed the title sequences for dozens of films including Suddenly (2006), Control (2007), Eastern Plays (2009), The Last Sentence (2012), and The 100-Year-Old Man Who Climbed Out the Window and Disappeared (2013).</p>'''
full_description = '''Designer Anna Lindqvist Anna Lindqvist is a motion designer, art director, and illustrator based in Sweden. Anna grew up in Gothenburg, Sweden, and in 1997, she moved to Stockholm where she attended various art schools, learning sculpture, painting, and digital storytelling. She began her career with an internship at The Chimney Pot, the largest post production company in Sweden, where she worked in motion graphics for eight years. In 2010, she started Kavorka, a company that produces motion graphics for music videos, feature films, and festivals. She has designed motion graphics and animation for Lady Gaga, Swedish House Mafia, and Maroon 5, as well as brands like Dior, Absolut, Stella McCartney, and H&M. The music video for Lady Gaga's "Paparazzi" featuring Anna's graphic design and animation won a 2009 MTV Video Music Award. She has designed the title sequences for dozens of films including Suddenly (2006), Control (2007), Eastern Plays (2009), The Last Sentence (2012), and The 100-Year-Old Man Who Climbed Out the Window and Disappeared (2013). Articles Stockholm, My Love title only Control summary Link kavorka.se Complete filmography'''
