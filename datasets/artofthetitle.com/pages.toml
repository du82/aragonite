["https://artofthetitle.com/designer/chuck-braverman"]
title = "Chuck Braverman — Art of the Title"
description = "<p>Chuck Braverman is a producer, director, and executive producer for film and television.<br />After studying cinema at the University of Southern California, Chuck&rsquo;s first project was a short film called American Time Capsule. With this, Braverman Productions was born and Chuck produced commercials and corporate films for clients including Xerox, Apple, Chevrolet, and Goodyear as well as music videos for songs by David Bowie, Paul McCartney, Cher, and Bob Seeger. Chuck then produced What&rsquo;s Up America and The Big Laff Off for Showtime, followed by directing episodic television shows like St. Elsewhere, Crazy Like a Fox, and Beverly Hills, 90210. By the mid-&rsquo;90s, Chuck was senior vice president at Sony New Technologies, supervising the development and production of Sony&rsquo;s new story-driven 3D Imax films.<br />He has also produced for Discovery Channel, Animal Planet, A&amp;E, HBO, and TLC. In 2001, Chuck was nominated for an Academy Award for his documentary Curtain Call. He is a member of the Directors Guild of America, the Academy of Motion Picture Arts and Sciences, and the International Documentary Association.</p>"
