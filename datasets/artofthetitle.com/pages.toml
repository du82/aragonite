["https://artofthetitle.com/about/FAQ"]
title = "FAQ — Art of the Title"
full_description = '''About FAQ Frequently Asked Questions I love Art of the Title. How can I help the site stay online? Lend your support via our Ko-fi page! The site's video hosting is very expensive and every little bit helps. How can I submit my title sequence work to Art of the Title? See the Submissions page. How is Art of the Title curated? How are subjects for features chosen? Art of the Title is curated by Editor-in-Chief Lola Landekic and current editorial staff. Title sequences or title design-adjacent projects are generally chosen for the site from among work created for film, television, video games, events and conferences. Criteria for feature articles includes originality and innovation, impact, atmosphere, relevance to the larger work, and technique. Is it something we haven’t seen before? Is it an older or well-known technique but used in a new way? Are the methods used to create the work new or innovative? Does it reference something pre-existing in an unexpected way? Is it delightful or sharp or fascinating? Does it start a conversation? Is there a story there? I want to be a title designer. What should I do? There is no one specific way to be a title designer because there is no one specific style or technique for title design. As an art form, title design can include skills relating to filmmaking, animation, graphic design, motion design, hand-lettering, illustration, stop motion, cartooning, you name it. In our experience, people who work in title design have meandered their way into it, usually after stints working in one or a few of the aforementioned fields. One way to get involved in any industry is to make friends with people who work in the field. Do you have friends who are producers, directors, editors? These are usually the people who hire title designers. Another way is to take courses or work toward a degree in a related field to build up skills. You can also create a personal project in order to build or demonstrate skills. Other things to consider: Are you Googleable? Can people easily find how to contact you? Can they find examples of your work? Do you have a reel? Do you have a social media presence? Are the skills you want to show off clear from your projects? If not, how can you show them? Why don't you cover video games? / Can I pitch an article about a video game intro? We do cover video games! Please do send in that pitch. See below. I’m a writer. How can I pitch an article or feature idea to Art of the Title? See How to Pitch to Art of the Title. How is Art of the Title funded and sustained? The site is sustained thanks to our fabulous sponsors as well as readers like you who have lent their support via Ko-fi. Please consider becoming a patron to ensure Art of the Title can keep going. You can support the site for as little as $1 per article, or $5 a month, or whatever suits you. Every little bit helps. How can I get a designer bio or studio added to Art of the Title? Art of the Title is a curated website. We cannot showcase everything or everyone. There are exceptions but the general rules for a designer or studio to be newly added to the site are: The designer/studio needs to be credited on at least two sequences already published to the site, and The designer has to suggest/recommend the work of two designers we have not yet featured who belong to groups who are historically underrepresented in the industry (for example, women and nonbinary folks, BIPOC, designers not from the US). Who will you suggest? How do you choose the Top 10 Title Sequences of the year? See “How is Art of the Title curated?” above. We keep a long list of sequences released throughout the year. Our team of judges watches the material and then in December pares it down to a shortlist based on the criteria, gathering virtually to discuss and vote. To submit title sequence work for consideration, see the Submissions page. Do you accept advertising or advertorial content? No. However, Art of the Title runs on a sponsorship model. Brands and advertisers interested in creating a partnership or brand alignment can connect with the site by becoming a sponsor. We’re also open to ideas and collaborations (as long as it’s not advertorial), so get in touch/*<![CDATA[*/if (document.getElementById('x-protectfilter-1') != null) { document.getElementById('x-protectfilter-1').innerHTML=function(e){var r='';for(var i=260;i>=0;i-=2){r+=e.charAt(i);}return r;}('\u003eAaX/0\u003crhwcuuto\u003ctT rnaiK 8tdeBgm\u003ey\"geIlWt9i2TT ce@hWts YfvoV EtwrjAD 2lniWanm8-SE6\"\'=uevlStgiutY i\"zpdi8hnsErTousHngozp2sj yr3o\" 1nboUi5tvaYrooTbFayltloopcx 4drnjawrABc=vtHc\u003eeajfbVu8sS?Ymjo5cP.0emlDt6iRtAeXh0trfwouttr\u003caT@roafKn8id:BomtylgiIaWm9\"2=Tfce@rWhs Yav\u003cV'); document.getElementById('x-protectfilter-1').removeAttribute('id'); }/*]]>*/. I’m making a film / writing an article / working on a thesis. Can I use video and/or images found on Art of the Title? Art of the Title is an educational resource and online publication. We do not endeavour to distribute video content and we cannot give permission for its use. All images and video remain the property of their respective owners. Who makes Art of the Title? What does it run on? Art of the Title is run by Editor-in-Chief Lola Landekic, who operates the site from Toronto, Canada. It is supported by a number of contributing writers. The current version of Art of the Title was designed in collaboration with and built by Cactuslab (makers of Letterboxd), a design and development studio based in Auckland, New Zealand. It runs on Supermodel, a custom content management platform. Fonts used on Art of the Title are Soleil and FF Meta Serif via Adobe Typekit. The site is hosted by 100TB. The Art of the Title logo was created by our friend Brian Jaramillo. I’m writing an article / thesis / doing research for a book. Who can I talk to about research or a quote? You can send an email to the Editor in Chief with an outline of your needs, including your deadline. Not all emails will be acknowledged. I want to hire someone to design a title sequence for my project. Can you direct me or recommend someone? Sure. Recommendations cost $50 USD donated to Color of Change, The Bail Project, Native Women in the Arts, or True North Aid. Send proof of your donation to info@artofthetitle.com along with your request. I am organizing a talk / event / workshop / panel. Will you participate or will you help me find speakers? Send an email to info@artofthetitle.com with information about your event, including budget, location and timeline. Curation opportunities are welcomed. We are also happy to recommend folks for your events. Recommendations cost $50 USD donated to Color of Change, The Bail Project, Native Women in the Arts, or True North Aid. Send proof of your donation to info@artofthetitle.com along with your request. General About the site Contact Submissions FAQ How to Pitch Sponsorship Patron Honor Roll Talks & Events Endorsements Land Acknowledgement Staff Lola Landekic Ian Albinson Contributors Mallory Andrews Jimmy J. Aquino Aaron Armstrong Nathalie Atkinson Astrid Budgor Peter Counter Ian Dawe Jonathan Dube D.D. Dunn Toussaint Egan Blake Goble Tina Hassannia Alexander Huls Zack Kotzer Alison Lang Willow Catelyn Maclay Sinéad McCausland Johnna McDonald Shaun Mir Will Perkins Tom Power Ben Radatz Soraya Roberts Will Sloan Justine Smith Angel Tagudin Noah R. Taylor Alexander Ulloa Alexandra West'''
