["https://artofthetitle.com/designer/lisa-bolan"]
title = "Lisa Bolan — Art of the Title"
description = "<p>Lisa Bolan is a creative director, illustrator, and title designer based in Los&nbsp;Angeles.&nbsp;<br />Originally from New York, Lisa attended the Rhode Island School of Design earning degrees in both illustration and graphic design. After graduating in 1997 she relocated to Los Angeles and began her career designing for film, television, game marketing, music packaging, and mutimedia. As an art director for 1K Studios she designed motion projects for&nbsp;The Parent Trap, Zodiac, HBO's Deadwood, Six Feet Under,&nbsp;and&nbsp;The Sopranos.<br />In 2008 Lisa began working at Prologue Films. At Prologue, she designed over 30 film and television titles including&nbsp;Battle Creek, The Fifth Estate, Pain &amp; Gain, The Twilight Saga: Breaking Dawn &ndash; Part One &amp;&nbsp;Part Two, Sleepy Hollow,&nbsp;Arthur,&nbsp;The Apparition, ESPN 30 for 30,&nbsp;and&nbsp;The Oscars. She has also&nbsp;created VFX and time-lapse sequences for films such as The&nbsp;Twilight Saga: Breaking Dawn &ndash; Part One&nbsp;&amp;&nbsp;Part Two, as well as&nbsp;illustrations and designs for title sequences including&nbsp;Tropic Thunder, Sherlock Holmes, Sherlock Holmes: A Game of Shadows, Iron Man 3,&nbsp;and&nbsp;The Secret Life of Walter Mitty.</p><p>Since moving over to&nbsp;Elastic&nbsp;in 2017, she has been&nbsp;title designer on the end credit sequence to Beauty and the Beast.</p>"
full_description = "Designer Lisa Bolan Lisa Bolan is a creative director, illustrator, and title designer based in Los Angeles. Originally from New York, Lisa attended the Rhode Island School of Design earning degrees in both illustration and graphic design. After graduating in 1997 she relocated to Los Angeles and began her career designing for film, television, game marketing, music packaging, and mutimedia. As an art director for 1K Studios she designed motion projects for The Parent Trap, Zodiac, HBO's Deadwood, Six Feet Under, and The Sopranos. In 2008 Lisa began working at Prologue Films. At Prologue, she designed over 30 film and television titles including Battle Creek, The Fifth Estate, Pain & Gain, The Twilight Saga: Breaking Dawn – Part One & Part Two, Sleepy Hollow, Arthur, The Apparition, ESPN 30 for 30, and The Oscars. She has also created VFX and time-lapse sequences for films such as The Twilight Saga: Breaking Dawn – Part One & Part Two, as well as illustrations and designs for title sequences including Tropic Thunder, Sherlock Holmes, Sherlock Holmes: A Game of Shadows, Iron Man 3, and The Secret Life of Walter Mitty. Since moving over to Elastic in 2017, she has been title designer on the end credit sequence to Beauty and the Beast. Articles Catherine the Great title only Carnival Row title only The Black Godfather title only Captain Marvel title only I Am The Night title only Conversations with a Killer: The Ted Bundy Tapes title only The Truth About the Harry Quebert Affair title only Yellowstone title only Altered Carbon title only The Alienist title only Queen Sugar summary Of Kings and Prophets title only American Horror Story: Freak Show summary Iron Man 3 interview Sherlock Holmes interview The Incredible Hulk interview Production Studio Elastic Link elastic.tv Previous Studios Prologue Films Elastic Complete filmography"
