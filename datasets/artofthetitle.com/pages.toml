["https://artofthetitle.com/designer/claire-typaldos"]
title = "Claire Typaldos — Art of the Title"
description = "<p>Claire Typaldos is a creative director and designer based in Los Angeles, California.<br />Originally from New York, Typaldos has created title sequences for films&nbsp;Blow the Man Down (2020),&nbsp;The Jesus Rolls (2019), Yearly Departed (2020), This Film is About My Mother (2022) and Resurrection (2022), as well as Netflix web series I Like to Watch&nbsp;(2019).<br />She attended Wesleyan University, graduating with a bachelor&rsquo;s degree in Fine Arts and has completed artist residencies including Anderson Ranch Arts Center in Snowmass Village, CO, Pocoapoco in Oaxaca, MX, and Kala Art Institute in Berkeley, CA.&nbsp;She works primarily in film, hospitality, branding and packaging design. Notable clients include Netflix, Apple, and Folklor.</p>"
