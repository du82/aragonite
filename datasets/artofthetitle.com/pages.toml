["https://artofthetitle.com/designer/bill-kroyer"]
title = "Bill Kroyer — Art of the Title"
description = '''<p>Bill Kroyer is an American director of animated and CG commercials, films, and title sequences.<br />Bill began his animation career in 1975 at a small commercial studio. By 1977, he was an animator working under the Nine Old Men at Disney Studios. There, he met Director Steven Lisberger, who was working on Animalympics and with whom he would collaborate on Tron. Thereafter, Bill decided to pursue computer animation instead of traditional animation while at Robert Abel and Associates and Digital Productions.<br />{{im:4353}}In 1986, he and his wife Susan started Kroyer Films, Inc. where they developed their pioneering "combo" technique, bringing together computer animation and hand-drawn animation. Their first short film, Technological Threat, was nominated for an Academy Award in 1988. In 1989, Kroyer Films produced the title sequences for Honey, I Shrunk the Kids, Troop Beverly Hills, and National Lampoon's Christmas Vacation. In 1990, Bill directed Computer Warriors and&nbsp;animated the main titles for TV show Bobby's World.&nbsp;In 1993, he directed the animated fantasy film&nbsp;FernGully: The Last Rainforest.<br />Currently, he is Director of Digital Arts at Chapman University's Dodge College of Film and Media Arts. He is also a Governor of the Short Films and Feature Animation Branch of the Academy of Motion Picture Arts and Sciences and also serves as Co-Chair of the Academy&rsquo;s Science &amp; Technology Council.</p>'''
full_description = '''Designer Bill Kroyer Bill Kroyer is an American director of animated and CG commercials, films, and title sequences. Bill began his animation career in 1975 at a small commercial studio. By 1977, he was an animator working under the Nine Old Men at Disney Studios. There, he met Director Steven Lisberger, who was working on Animalympics and with whom he would collaborate on Tron. Thereafter, Bill decided to pursue computer animation instead of traditional animation while at Robert Abel and Associates and Digital Productions. *Disney's Nine Old Men, although they were only in their 30s and 40s, were the The Walt Disney Company's core animators, responsible for some of Disney's most famous animated cartoons from Snow White and the Seven Dwarfs to The Rescuers. All members of the group are now deceased. In 1986, he and his wife Susan started Kroyer Films, Inc. where they developed their pioneering "combo" technique, bringing together computer animation and hand-drawn animation. Their first short film, Technological Threat, was nominated for an Academy Award in 1988. In 1989, Kroyer Films produced the title sequences for Honey, I Shrunk the Kids, Troop Beverly Hills, and National Lampoon's Christmas Vacation. In 1990, Bill directed Computer Warriors and animated the main titles for TV show Bobby's World. In 1993, he directed the animated fantasy film FernGully: The Last Rainforest. Currently, he is Director of Digital Arts at Chapman University's Dodge College of Film and Media Arts. He is also a Governor of the Short Films and Feature Animation Branch of the Academy of Motion Picture Arts and Sciences and also serves as Co-Chair of the Academy’s Science & Technology Council. Articles National Lampoon's Christmas Vacation interview Honey, I Shrunk the Kids summary Troop Beverly Hills interview Complete filmography'''
