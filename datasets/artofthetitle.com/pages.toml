["https://artofthetitle.com/designer/david-daniels"]
title = "David Daniels — Art of the Title"
description = '''<p>David M. Daniels is a director at Bent Image Lab, a hybrid animation&ndash;live-action production house based in Portland, Oregon.<br />He has a master&rsquo;s degree in animation from The California Institute of the Arts. Early in his career, David was an animator on sections of Peter Gabriel&rsquo;s music video "Big Time&rdquo; and an animator and cameraman on Pee-wee's Playhouse. Afterward, he moved from Los Angeles to Portland to work with Claymation Director and Animator Will Vinton. In 1985, David refined the technique of strata-cut animation with his innovative short film, Buzz Box.<br />In 2002, David co-founded Bent Image Lab with Ray Di Carlo and Chel White. In 2005, an upgraded and re-mastered edit of Buzz Box premiered at Cinema Texas and in 2007, it was featured at the International Film Festival Rotterdam. In 2011, he presented several 3-hour master classes on the history and how-to of strata-cut at the Anima Mundi Festival in Brazil and, in 2012, at Chilemonos Animation Festival in Santiago. His larger history of clients includes Levi&rsquo;s, Fox, MTV, NBC, Pepsi, Nabisco, and Nintendo, and his career awards include a first place AICP, as well as several Clios, Daytime Emmys, and Hugos.</p>'''
full_description = '''Designer David Daniels David M. Daniels is a director at Bent Image Lab, a hybrid animation–live-action production house based in Portland, Oregon. He has a master’s degree in animation from The California Institute of the Arts. Early in his career, David was an animator on sections of Peter Gabriel’s music video "Big Time” and an animator and cameraman on Pee-wee's Playhouse. Afterward, he moved from Los Angeles to Portland to work with Claymation Director and Animator Will Vinton. In 1985, David refined the technique of strata-cut animation with his innovative short film, Buzz Box. In 2002, David co-founded Bent Image Lab with Ray Di Carlo and Chel White. In 2005, an upgraded and re-mastered edit of Buzz Box premiered at Cinema Texas and in 2007, it was featured at the International Film Festival Rotterdam. In 2011, he presented several 3-hour master classes on the history and how-to of strata-cut at the Anima Mundi Festival in Brazil and, in 2012, at Chilemonos Animation Festival in Santiago. His larger history of clients includes Levi’s, Fox, MTV, NBC, Pepsi, Nabisco, and Nintendo, and his career awards include a first place AICP, as well as several Clios, Daytime Emmys, and Hugos. Articles Freaked interview Link bentimagelab.com'''
