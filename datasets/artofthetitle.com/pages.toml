["https://artofthetitle.com/studio/momoco"]
title = "Momoco — Art of the Title"
description = "<p>Momoco is an Emmy Award-winning and BAFTA-nominated creative studio based in London, England.<br />The studio, founded by directors and designers Nic Benns and Miki Kato, has been designing main titles and commercials since 1999, gaining international recognition for its sequences. The duo have collaborated on opening sequences with directors such as Richard Curtis, Stephen Daldry, Lasse Halstrom, Kevin Spacey, and Dustin Hoffman. Their film credits include Contraband, The Three Musketeers, Nine, Alien vs. Predator, and 30 Days Of Night. For television they have designed titles for shows such as Misfits, Luther, The Fades, and Strike Back.<br />In 2012, Momoco was nominated for two Emmy Awards, of which Great Expectations won a Primetime Emmy for Outstanding Main Titles.</p>"
full_description = "Studio Momoco Momoco is an Emmy Award-winning and BAFTA-nominated creative studio based in London, England. The studio, founded by directors and designers Nic Benns and Miki Kato, has been designing main titles and commercials since 1999, gaining international recognition for its sequences. The duo have collaborated on opening sequences with directors such as Richard Curtis, Stephen Daldry, Lasse Halstrom, Kevin Spacey, and Dustin Hoffman. Their film credits include Contraband, The Three Musketeers, Nine, Alien vs. Predator, and 30 Days Of Night. For television they have designed titles for shows such as Misfits, Luther, The Fades, and Strike Back. In 2012, Momoco was nominated for two Emmy Awards, of which Great Expectations won a Primetime Emmy for Outstanding Main Titles. Articles Slow Horses title only Nightflyers title only The Last Panthers title only Hannibal interview Great Expectations interview An Education interview Designers Nic Benns Miki Kato Link momoco.co.uk Complete filmography"
