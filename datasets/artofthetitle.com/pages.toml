["https://artofthetitle.com/title/ginger-snaps"]
title = "Ginger Snaps (2000) — Art of the Title"
description = "Bite the big one with the Fitzgerald sisters in the opening of cult classic Ginger Snaps"
full_description = '''“Too much blood. And I can see your gaunch!” says Brigitte, annoyed. Ginger, her body impaled on a white picket fence, sticky red blood sprayed across her middle, gives us the finger. “Just do it,” she says. Brigitte brings a 35mm camera to her eye and snaps the photo. An entire world in microcosm. When Ginger Snaps, the cult horror-comedy directed by John Fawcett and written by Karen Walton, was released in 2000, it was an outlier among outliers. In a genre oozing with regressive and often outright sexist portrayals of women, Ginger Snaps was a monstrously funny film about two teenage girls whiling away the beige of suburban Bailey Downs. Ginger and Brigitte did this in their own special way: through elaborate tableaux of suicide and death, photographed and presented as a slideshow for a school assignment. These tableaux form the opening title sequence to Ginger Snaps, introducing the world to the Fitzgerald sisters through a masterpiece of title design. These staged scenes are the girls’ ode to and rejection of suburbia, the sequence becoming a mini-text within the film that lays bare their whirling inner lives; their feelings of connection, nihilism, creativity, curiosity, and disillusionment are all there, laid out neatly among the peroxide and lace. The attention to detail in the grisly gestalts is astounding, with references to everything from children’s fairy tales (The Wizard of Oz, Alice in Wonderland) and classic literature (Paradise Lost) to obscure dead Russians (Pavel T. Shvetsov) and contemporary cinema (Se7en, Heathers). The music, composed by Mike Shields, features violin and cello and smatterings of giggles, deftly wielding a melancholy that manages to avoid dipping into cornball. When the snaps of Ginger and Brigitte come to an end, a sense of sadness and nostalgia emerges, as if the show, and their innocence, has already come and gone. Interview Credits A discussion with Director JOHN FAWCETT and Screenwriter KAREN WALTON. Before we dive into Ginger Snaps, I wanted to ask a little bit about you both because you’ve worked on a lot of projects between you, especially in TV. Karen, how did you become a screenwriter? Karen: I entered a contest because I needed some money! [laughs] Maybe that’s not the most responsible answer, but it’s true. I didn’t train in film, I trained in drama and theatre. I became a screenwriter after not being sure what I wanted to do and having lots of jobs. My last day job was being an executive director of a non-profit film co-op, where I got to learn all about making indie movies and raising money so that people could do that. That’s where I decided I’d like to be part of it. I tried directing, and it wasn’t as fun as making the stuff up. So I chose writing. You had a lot of peculiar jobs, right, before you found screenwriting? Karen: I did. [laughs] How did you know that? I’ve done some reading! Karen: [laughs] Yes. You know that sample lady that stands in grocery stores and offers you a free piece of cheese? I was that lady. It was a surprisingly well-paid gig. I had my own battery-operated revolving sign! I was very pleased with it. So yeah, I was a sample lady. I did singing telegrams. I actually worked at a retail card giant as a clerk. For a long time I did that. I sold greeting cards. So not suited for that. Ginger and Brigitte Fitzgerald smoke outside their high school in this still from Ginger Snaps Little did they know that you had something like Ginger Snaps up your sleeve. Karen: No, they didn’t see that coming! Although my first job in film was doing stunts on Prom Night II. So I suspect there’s some kind of weird conflagration of influences going on there. It was filmed in Edmonton, Alberta, which was where I was at the time. I saw Dwayne McLean, the stuntman, was on the news one night going, “Yeah, so we’re gonna hire and train some local talent to do stunts in this movie” and I called my agent right away and said, “I wanna try for that!” [laughs] What kind of stunts did you do? Karen: Oh, I got run over by marauding, stampeding extras. I did stunt doubling and falling down, getting thrown through tables, that kind of thing. I immediately liked it. I really did. I might have pursued that had things not started happening in the writing realm. Amazing. John, what was your background? How did you start out on the path to becoming a filmmaker? John: I started shooting stuff on Super 8 when I was in grade eight, grade nine. Then I managed to get ahold of a VHS camcorder and over three years of high school, I shot a feature-length VHS movie. It was like a fantasy-adventure thing. I think it was inspired by The Goonies [laughs], so if you were to watch it now, you'd probably want to get quite high beforehand. From left: Emily Perkins (Brigitte), Kris Lemche (Sam), John Fawcett, Katharine Isabelle (Ginger), and Karen Walton I came right out of high school knowing I wanted to direct film. I went to school in Calgary at the Southern Alberta Institute of Technology, which was a technical school. There, I made a short film, a horror-comedy that got me into the Canadian Film Centre in Toronto, so I moved to Toronto in like '91. The short film that I made at the Film Centre was kind of horror-themed. It was called Half Nelson, about a kid who thinks his father is a vampire and that he is genetically disposed to be the same. Again, strong horror themes but with very dark humour. It got seen by a lot of people at film festivals and it put me in a position where people started to take me seriously. How did you two meet? Karen: John and I met in Alberta. He had just come back from the Canadian Film Centre and we met through other filmmakers and exchanged our work. I was working on the first screenplay I had ever written and it was not tremendously excellent, I have to tell you. I was learning screenwriting out of a book at the time. We agreed that we would try and find an idea that was right and maybe do something together. It wasn’t that much longer that he mentioned wanting to do a teen girl werewolf movie. What made you want to make a teen girl werewolf movie? John: Well, I wanted to make a body horror kind of transformation movie. That's how it started. I liked the idea of making a transformation horror film, but with two central characters that I hadn't seen before, or hadn't seen in a movie like this. I liked the idea of these two inseparable sisters that had a bond that surpassed any kind of normal sister bond. At the time, I had seen Heavenly Creatures and I was quite inspired by the relationship of the two girls in Heavenly Creatures. That very close I-love-you-best-friends-forever kind of unshakeable bond. They were the kind of girls that when I was in high school I always had a crush on but they were too cool for me, you know? So Ginger and Brigitte came from that. Brigitte and Ginger clasp hands in their bedroom Initially I shied away from werewolves, because at the time there was really – the werewolf genre was just a wasteland of terrible cheesy movies other than An American Werewolf in London. That was initially why I didn't want it to be a werewolf movie. But the more I thought about it, the more I realized that that was in fact the reason to do it – because there was nothing good in that subgenre of horror. So it was really about trying to reinvent. I wanted to make something that people hadn't seen before. Karen: For me, I was writing independent festival house cinema influenced by Truffaut at the time. [laughs] So, I wasn’t really sure what I could contribute. I said, I don’t know anything about werewolves or things like that. He was like, “This is why you should write one. You should write a teen girl werewolf movie you would go and see.” So it took some time to convince me but eventually I thought, well I would give it a try. That’s how it got started. John, what was it about Karen that made you think, “This is the person to write that story”? An example of dialogue written by Karen Walton for Ginger Snaps John: Karen is a very prolific character dialogue writer. She grew up in the suburbs of Edmonton. Herself – she's very witty, she's very quick, she's very caustic, she's very dark, she gets that sense of humour, and I realized that it needed a female voice. I wasn't going to provide that, and I wanted the experience of someone who lived through all the hormonal ups and downs of puberty and adolescence. It was important that even among all the hijinks and idiocy of the concept, that those characters feel real. And I'd read some of her writing, and I knew her quite well as a person and how she spoke normally. I was like, “Man, if we could get the way you speak normally on to the page for these girls, this'll be a winner." [laughs] Karen, you mentioned learning screenwriting from a book. Do you remember what book that was? Karen: Yes. It was by J. Michael Straczynski, I think. Oh, really? The creator of Babylon 5. Karen: Seriously! I’m sure it was. I should Google that now and make sure I’m not wrong... It may even be in my basement. I’m just gonna Google it to see if I’m crazy… The Complete Book of Scriptwriting. Yeah, that’s it! [laughs] It has a very different cover now. That’s hilarious. Oh my gosh, I haven’t thought about that in years. I’m totally tripping here... The Complete Book of Scriptwriting by J. Michael Straczynski [Walton reads from the book description] “Writing and selling screenplays, teleplays, theatrical plays and animation scripts.” They’re all in there. That’s what I used to write my first screenplay and John read that screenplay and then we decided to work together. Meanwhile, I got accepted into the Canadian Film Centre so Ginger was the script I was working on while a student there and in the same class were Vincenzo Natali and Graeme Manson. Vincenzo did Cube and Splice, directed Hannibal, and Graeme Manson of course is the co-creator of Orphan Black, so we’re all of a group that came up together. When you initially envisioned the opening of Ginger Snaps, what did you picture? Karen: What you’re seeing on the screen is exactly the screenplay. It’s exactly what I envisioned. John: The sequence was imagined quite early on. Karen and I both knew we wanted to create a really cool opening credit sequence. Karen: John was at the time very fond of using Polaroids and slideshow-style art and montages. When I met him he had a Polaroid camera with him a lot. John: We loved the idea of creating a slideshow, which was essentially going to emerge into the girls’ class project, at school. That's what we were going to reveal at the end of it, that they'd shot all these pictures, and were using it as their social studies class project, which I thought was really funny. Karen: A commentary for class on life in Bailey Downs, the suburbs. It was the way to introduce a relationship that was based in self-destruction with a very serious commitment to nihilism! [laughs] The malcontented suburbanites. View 4 images Image Set: Pages from the original shooting script of Ginger Snaps, detailing the opening title sequence, written by Karen Walton var galleryfdf8eb9a_4cb5_441c_9391_1a97d787621c = new View( [ { src: '/assets/sm/upload/su/45/ei/8n/GINGERTITLES_Shootingscript-pg2.jpg?k=039373b8b7' }, { src: '/assets/sm/upload/gd/0m/0n/d0/GINGERTITLES_Shootingscript-pg3.jpg?k=8c835e381b' }, { src: '/assets/sm/upload/45/8m/j8/yb/GINGERTITLES_Shootingscript-page4.jpg?k=f190277214' }, { src: '/assets/sm/upload/tk/ox/4t/3q/GINGERTITLES_Shootingscript-page5.jpg?k=4c69e0279b' } ], { zoom: true } ); Right, and their project is a very creative sort of approach to destruction, and self-destruction. Karen: Self-destruction particularly. With few exceptions, they’re all suicides, and they’re all done in classic suburban settings, deliberately using all of the paraphernalia of suburban life. The lawnmowers and the deep freezer that mom has in the basement for the extra beef. It was intended to give you a sense of disruption in those environments – where we all grew up. It was about taking that picture postcard suburban environment and messing it up completely. The lawns are cut, the house is set up, everything’s lovely. We wanted to undermine that right away. I think I was at home writing something else — probably writing a movie of the week — when I got the giggling call from the suicide set. How would you describe the differences in Brigitte’s deaths versus Ginger’s deaths? Because there are differences in their suicides, right? Karen: Yeah, oh yeah. They’re all down to character attributes, all down to traits that I knew each character would begin their story with. John: Ginger's pictures are very over-the-top and hilarious, and Brigitte's are more poetic and dark. Karen: Brigitte, of course, is Ginger’s devotee and best friend, right? It’s an unquestioned alliance. So I took the creative stance that this project was definitely Ginger’s idea. And it’s Brigitte’s resourcefulness and role as a willing supporter, a willing codependent, that would’ve made sure she had everything she needed to do it. So it’s definitely a Ginger vision, Brigitte execution kind of situation. Right, Ginger is the art director. Karen: For sure! What was it like shooting those scenes, setting up the vignettes? John: It was hilarious! We did the opening sequence as a pre-shoot. That was the first stuff that we shot on Ginger Snaps. We hadn't even started rolling the cameras yet. So we went out to the suburbs to our house where we were gonna set our exterior scenes and we spent a day shooting all these hilarious pictures of the girls. We had a small group of people, all our make up people, and we were establishing the looks of our two characters before we'd even rolled film yet. There was a lot of prep that went into it, but it was such a gas. A suicide tableau featuring Ginger impaled on a fence Karen: I remember very clearly getting called from that set. I think I was at home writing something else – probably writing a movie of the week – when I got the giggling call from the suicide set. [laughs] John was laughing when they were shooting those images. John: Definitely, because it was so fun. It was the most fun, because we were just doing all these crazy over-the-top suicide photos and trying to shoot as many as we possibly could in the afternoon that we had. You know it's not meant to be real, it's meant to be their fake pictures, so we had a lot of fun with that. Do you have a favourite vignette from the opening? One that you think turned out really well? John: Oh, I like so many of them! That's really hard to say. God. The ones that really – that I really clearly recall, are the lawnmower on top of Ginger, the pennies on Brigitte's eyes, the tea party – the poisoned tea party! The poisoned tea party suicide tableau featuring both Ginger and Brigitte Karen: I just watched them again and I just get this lump in my throat going, oh my God, because it’s the perfect... Everyone did such a gre'''
