["https://artofthetitle.com/designer/clarissa-donlevy"]
title = "Clarissa Donlevy — Art of the Title"
description = "<p>Clarissa Donlevy is a creative director and designer for film, TV, games and commercials.&nbsp;Originally from Sydney, Australia, she began her career in London, UK, working for SuperUnion, BBC, and Carlton Television / ITV, before returning to Sydney to work for Garner Mclennan Design and Foxtel. In 2007, she relocated to Los Angeles, where she has worked with Engine Group, Prologue, yU+co, Imaginary Forces, and Elastic. She has a bachelor of arts from University of Western Sydney, where she studied design.<br />Her title design credits include openings for films The Quiet American (2002), Dragonball Evolution (2009), Whiteout (2009), and Australia TV series Love My Way (2004). In 2019, she was creative director on the title sequence to TV series His Dark Materials (2019), produced by studio Elastic. She has directed teasers for HBO's The Pacific (2010) and Turbine's 2007 video game The Lord of the Rings Online, helmed creative direction for a 360 campaign for Redbull TV's documentary series The Horn (2016), designed visual effects sequences for The Tempest (2010) and brand identities for films Crazy Stupid Love, Horrible Bosses (2011), and The Mortal Instruments: The City of Bones (2013). Her work has been honoured with Clio, Addy and Telly Awards. She is based in Los Angeles, California.</p>"
full_description = "Designer Clarissa Donlevy Clarissa Donlevy is a creative director and designer for film, TV, games and commercials. Originally from Sydney, Australia, she began her career in London, UK, working for SuperUnion, BBC, and Carlton Television / ITV, before returning to Sydney to work for Garner Mclennan Design and Foxtel. In 2007, she relocated to Los Angeles, where she has worked with Engine Group, Prologue, yU+co, Imaginary Forces, and Elastic. She has a bachelor of arts from University of Western Sydney, where she studied design. Her title design credits include openings for films The Quiet American (2002), Dragonball Evolution (2009), Whiteout (2009), and Australia TV series Love My Way (2004). In 2019, she was creative director on the title sequence to TV series His Dark Materials (2019), produced by studio Elastic. She has directed teasers for HBO's The Pacific (2010) and Turbine's 2007 video game The Lord of the Rings Online, helmed creative direction for a 360 campaign for Redbull TV's documentary series The Horn (2016), designed visual effects sequences for The Tempest (2010) and brand identities for films Crazy Stupid Love, Horrible Bosses (2011), and The Mortal Instruments: The City of Bones (2013). Her work has been honoured with Clio, Addy and Telly Awards. She is based in Los Angeles, California. Articles His Dark Materials summary Link clarissadonlevy.com Complete filmography"
