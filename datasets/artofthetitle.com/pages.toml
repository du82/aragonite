["https://artofthetitle.com/designer/brian-mah"]
title = "Brian Mah — Art of the Title"
description = "<p>Brian Mah is a director and creative director working in live action, design, visual effects, and animation.<br />Brian attended the Ringling College of Art and Design where he majored in graphic design. Thereafter, he began his career in 2002 at Imaginary Forces, where he worked until forming Alma Mater in early 2012. In addition to his breadth of commercial work for clients such as Google, PepsiCo, American Express, and Coca-Cola, he has designed, directed, and implemented broadcast packages and promos for networks including USA, National Geographic, Lifetime, Cartoon Network, and Spike TV. In the film world, he has designed main titles and led feature marketing projects for studios such as Sony, Universal, Disney, and Paramount. He also collaborates with clients such as Gehry &amp; Partners, The Los Angeles County Museum of Art, and Airbus, and lectures across the United States.</p>"
