["https://artofthetitle.com/designer/catalina-matamoros-puerto"]
title = "Catalina Matamoros Puerto — Art of the Title"
description = "<p>Catalina Matamoros Puerto is a Colombian animation director and illustrator.<br />She studied design at Universidad de Los Andes and animation and digital arts at the University of Southern California. Her first short film Out of Line (2015), co-directed with Alicja Jasina, was a semifinalist at the Student Academy Awards, and her second film We Are the Immigrants (2016) has been shown in festivals around the world and was a finalist for Best School Short Film at the Iberoamerican Animation Quirino Awards.<br />During her time at Los Angeles production studio Picturemill, she has contributed to title sequences for Storks (2016) and Prison Break (Season 5). She has also designed titles for several short films as well as feature film I&rsquo;m Fine (Thanks for Asking) (2021).</p>"
full_description = "Designer Catalina Matamoros Puerto Catalina Matamoros Puerto is a Colombian animation director and illustrator. She studied design at Universidad de Los Andes and animation and digital arts at the University of Southern California. Her first short film Out of Line (2015), co-directed with Alicja Jasina, was a semifinalist at the Student Academy Awards, and her second film We Are the Immigrants (2016) has been shown in festivals around the world and was a finalist for Best School Short Film at the Iberoamerican Animation Quirino Awards.During her time at Los Angeles production studio Picturemill, she has contributed to title sequences for Storks (2016) and Prison Break (Season 5). She has also designed titles for several short films as well as feature film I’m Fine (Thanks for Asking) (2021). Articles I'm Fine (Thanks for Asking) summary Link catalinamatamoros.com Previous Studios Picturemill Complete filmography"
