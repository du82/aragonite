["https://artofthetitle.com/designer/jay-johnson"]
title = "Jay Johnson — Art of the Title"
description = "<p>Jay Johnson is a motion graphics designer, animator, and illustrator from Colorado.<br />Jay moved to LA in 1981 to become an illustrator and soon began his career with a job at Consolidated Films Industries. From there, Jay went to Modern Film Effects, then on to Cinema Research Corporation, and finally to Pacific Title and Art Studios. Jay has designed and animated many studio logos, one of his favorites being the CastleRock Entertainment logo. Jay has working relationships with many of today&rsquo;s fine directors, such as Quentin Tarantino, whose appreciation for typography has brought Jay the opportunity to create many creative uses for type in Tarantino&rsquo;s films.</p>"
