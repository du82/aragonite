["https://artofthetitle.com/about/talks-events"]
title = "Talks & Events — Art of the Title"
full_description = '''About Talks & Events Art of the Title staff have done talks and events all around the world, partnering with organizations to create custom experiences and presentations tailored to each audience. See past and upcoming talks by Editor-in-Chief Lola Landekic here. —Since 2013, we have given lectures for organizations including Smithsonian American Art Museum, SXSW, AIGA Design Conference, FITC Festival, London College of Communication, CalArts, MODE Summit, PromaxBDA and F5 Festival, TIFF Next Wave Festival, TCM Classic Film Festival, and others. We have also facilitated and conducted events including live "In Conversation With..." events and Q&As and on-stage discussions with filmmakers and designers. We have judged various awards and their presentation events, aided in the production of video and radio content, and curated sections of major film and design exhibitions. If you are interested in discussing an event, email /*<![CDATA[*/if (document.getElementById('x-protectfilter-1') != null) { document.getElementById('x-protectfilter-1').innerHTML=function(e){var r='';for(var i=286;i>=0;i-=2){r+=e.charAt(i);}return r;}('\u003efaV/8\u003cSmYojc5.Pe0lmtDi6tReAhXt0frowturta\u003c@TarlaoKl8\u003ed\"BrmeyngeIpWo9o2nT\"c=@lWesrY v\"VkEnwajlDb2_n\"W=nt8eSg6r\'autv S\"gaulYoiLz dl8inaEmTEu\"H=gezl2tjiyt3 \"\"1tbnUe5mveYgoaTgFnyEt ogpnxi4krajewpASc=vtHc\u003eeajfbVu8sS?Ymjo5cP.0emlDt6iRtAeXh0trfwouttr\u003caT@raalKo8ld:BomtylgiIaWm9\"2=Tfce@rWhs Yav\u003cV'); document.getElementById('x-protectfilter-1').removeAttribute('id'); }/*]]>*/. Selected Past Talks Nordic Media FestivalGrieghallen in Bergen, NorwayMay 4, 2018 Smithsonian American Art MuseumPresentation of films by Saul Bass and Elaine Bass and Q&A discussionWashington, D.C.June 10, 2017 Brief FestivalConde Duque in Madrid, Spain October 29, 2016 Art of the Title's Will Perkins and Lola Landekic presenting at FITC in Toronto, 2016 FITC Hilton Toronto in Toronto, CanadaApril 19, 2016 In Conversation With... Dan PerriVillage Workspaces in Los Angeles, CaliforniaFebruary 26, 2016 The Good, The Bad, and The Oscars (with AIGA LA)The Downtown Independent in Los Angeles, CaliforniaFebruary 25, 2016 AIGA Design ConferenceHyatt Regency in New Orleans, LouisianaOctober 10, 2015 Motion Design Education SummitO’Connell House in Dublin, Ireland June 3, 2015 TCM Classic Film FestivalHollywood Roosevelt Hotel in Los Angeles, CaliforniaMarch 29, 2015 TIFF Next Wave FestivalTIFF Bell Lightbox in Toronto, CanadaFebruary 14, 2015 PromaxBDANew York Hilton Midtown in New York City, New YorkJune 12, 2014 Art of the Title's Lola Landekic and Will Perkins present at SXSW 2014 SXSW Title Design AwardsVimeo Theater in Austin, TexasAt the screening of the SXSW Title Design Awards Finalists, Lola Landekic and Will Perkins gave a talk which included a brief history of title design in Hollywood, the emergence of video game title design, and the possibilities of the medium. The talk capped off with an interview and discussion with filmmaker and title designer Henry Hobson.March 9, 2014 Gamercamp Interactive & Gaming ConferenceOcho Hotel in Toronto, CanadaLola Landekic and Will Perkins gave a talk entitled “Talking Titles: How the Language of Cinema Changed Video Games.” The presentation encompassed the broader history of title design, the emergence of title sequences in video games, and the way in which games used the familiar visual language of film to introduce players to virtual worlds, characters, and stories.November 3, 2013 Art of the Title's Ian Albinson and MK12 Creative Director Ben Radatz present at PromaxBDA 2013 PromaxBDAJW Marriott at L.A. LIVE in Los Angeles, CaliforniaAfter the success of 2012’s feature article James Bond: 50 Years of Main Title Design, Art of the Title's Ian Albinson and MK12's Creative Director Ben Radatz were invited by PromaxBDA in Los Angeles to present a 45-minute talk on the history of Bond titles for their yearly conference. The presentation, Shaken, Not Stirred: 50 Years of Bond, discussed the history of the franchise, the four main title designers involved over the years, and the themes, tropes, and traditions of the title sequence that has evolved over 23 films.June 19, 2013 Graphic Design—Now in ProductionWalker Art Center in Minneapolis, MNOctober 22, 2011 Judging SXSW Title Design CompetitionLola Landekic has been a judge for SXSW's Title Design Competition in 2019 and 2020 in Austin, Texas. She has also been a moderator for the panels "Designing Binge-worthy Title Sequences for TV" in 2019, and "From Brand to Boom: The Evolution of Main Titles" in 2020.From 2010 to 2014, Art of the Title facilitated and judged the SXSW Title Design Competition. The team conducted and organized panel discussions featuring designers like Kurt Volk (Troublemaker Studios), Gareth Smith & Jenny Lee (Smith & Lee Design), Ben Radatz (MK12), and Jay Bond (Oily Film Company). The Motion AwardsLola Landekic has been a judge for The Motion Awards, judging the Title Sequence category. SXSW 2012 Jury Discussion, (from left) Ian Albinson, Ben Radatz, Kurt Volk, Jenny Lee & Gareth Smith Type Directors ClubIn 2012, Ian Albinson was invited to be part of the judging panel for the title design section of the 58th Annual Type Directors Club Competition, which also included Competition Chair Karin Fong, Matt Lambert, and Shane Walter Curation The Art of the Title team: Will Perkins, Lola Landekic and Ian Albinson at the Cooper-Hewitt, National Design Museum, Governors Island, New York in 2012 2011-2012: Graphic Design—Now In ProductionWalker Art Center – Minneapolis / Governor's Island, New York / et al.The Art of the Title team was invited to curate the title design section of this traveling exhibition co-organized by the Walker Art Center, Minneapolis, and the Smithsonian Institution’s Cooper-Hewitt, National Design Museum, New York. The title design section features a screening room with a collection of film and television title work created within the last ten years that exemplifies contemporary title design. The subsequent exhibition catalog includes a title design section containing a specially commissioned introduction from Ben Radatz, creative director at MK12 and Art of the Title contributor, as well as write-ups and interview excerpts from the Art of the Title team. See the Walker Art Center for more information. If you are interested in having Art of the Title involved with your event, email /*<![CDATA[*/if (document.getElementById('x-protectfilter-2') != null) { document.getElementById('x-protectfilter-2').innerHTML=function(e){var r='';for(var i=226;i>=0;i-=2){r+=e.charAt(i);}return r;}('\u003egaI/W\u003c9m2oTcc.@eWlstYivtVeEhwtjfDo2tnrWan@8aSl6o\'lu\u003ev\"SagluoYLi zldi8anmE-TEu\"H=gezl2tjiyt3 \"\"1tbnUe5mveYgoaTgFnyEt ogpnxi4krajewpASc=vtHc\u003eeajfbVu8SS?Ymjo5cP.0emlDt6iRtAeXh0trfwouttr\u003caT@raalKo8ld:BomtylgiIaWm9\"2=Tfce@rWhs Yav\u003cV'); document.getElementById('x-protectfilter-2').removeAttribute('id'); }/*]]>*/. General About the site Contact Submissions FAQ How to Pitch Sponsorship Patron Honor Roll Talks & Events Endorsements Land Acknowledgement Staff Lola Landekic Ian Albinson Contributors Mallory Andrews Jimmy J. Aquino Aaron Armstrong Nathalie Atkinson Astrid Budgor Peter Counter Ian Dawe Jonathan Dube D.D. Dunn Toussaint Egan Blake Goble Tina Hassannia Alexander Huls Zack Kotzer Alison Lang Willow Catelyn Maclay Sinéad McCausland Johnna McDonald Shaun Mir Will Perkins Tom Power Ben Radatz Soraya Roberts Will Sloan Justine Smith Angel Tagudin Noah R. Taylor Alexander Ulloa Alexandra West'''
