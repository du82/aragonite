title = "Tamsin McGee — Art of the Title"
description = "<p>Tamsin McGee is an Emmy Award-winning art director and motion designer based in London, England.<br />Originally from Hertfordshire, McGee moved to London in the &rsquo;90s to study for a BA in Graphic Design at The London College of Printing. After graduating she joined Hugo Moss at&nbsp;Huge Designs. Her title design credits include&nbsp;Downton Abbey&nbsp;(2010),&nbsp;Da Vinci&rsquo;s Demons&nbsp;(2013),&nbsp;The Newsroom&nbsp;(Season 2) (2013),&nbsp;Jekyll and Hyde&nbsp;(2015),&nbsp;The Son&nbsp;(2017),&nbsp;One of Us&nbsp;(2017),&nbsp;The Walking Dead&nbsp;(Season 9)&nbsp;(2018), and&nbsp;Hold the Sunset&nbsp;(2018).</p>"
