description = "<p>Todd Hemker is a designer and animator based in Monterey, California.<br />Todd combines hand-drawn animation techniques with digital compositing tools to create works for film, television, and online. Some of his more notable contributions have been for the end titles of Lemony Snicket&rsquo;s A Series of Unfortunate Events and Madagascar 2, as well as co-directing and animating the end titles for Cloudy With a Chance of Meatballs.<br />He also runs design and animation studio Yellowshed with his partner&nbsp;Soyeon Kim.</p>"
