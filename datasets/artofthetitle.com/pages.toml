["https://artofthetitle.com/designer/anthony-goldschmidt"]
title = "Anthony Goldschmidt — Art of the Title"
description = "<p>Anthony Goldschmidt was an American graphic designer, art director, and title designer who&nbsp;founded the renowned&nbsp;Intralink Film Graphic Design firm in 1979.<br />Born in New York City in 1942, Goldschmidt received his bachelor's degree from Washington University in St. Louis and Master of Fine Arts from Yale University. Goldschmidt began his career in advertising, working at the Madison Avenue firm J. Walter Thompson as an art director, before&nbsp;moving to Hollywood to join the Warner Bros. marketing department in the late 1960s.{{im:13976}}Best known for his work as a poster designer, Goldschmidt most famously designed the iconic marketing campaign for Steven Spielberg's E.T. The Extraterrestrial with his firm Intralink. Other notable film posters designed by Goldschmidt include Blazing Saddles, Blade Runner, A Few Good Men, The Shawshank Redemption, Apollo 13, Twister, Psycho, The Aviator, Batman Begins and&nbsp;The Dark Knight.<br />Goldschmidt was also a prolific title designer, creating titles for films such as McCabe &amp; Mrs. Miller (1971), Straw Dogs (1971), Blazing Saddles (1974), Young Frankenstein (1974), The Witches of Eastwick (1987), Spaceballs (1987), Scrooged (1988), Thelma &amp; Louise (1991), Stargate (1994), A Time to Kill (1996), and Batman &amp; Robin (1997).<br />Over the course of his career Goldschmidt won numerous awards for his film marketing and design work, including&nbsp;nine Clio Awards, 10 Art Directors Club of Los Angeles Awards, 26 Golden Trailer Awards, and 6 Graphic Design Gold Awards<br />He died in Los Angeles in 2014.</p>"
full_description = "Designer Anthony Goldschmidt Anthony Goldschmidt was an American graphic designer, art director, and title designer who founded the renowned Intralink Film Graphic Design firm in 1979.Born in New York City in 1942, Goldschmidt received his bachelor's degree from Washington University in St. Louis and Master of Fine Arts from Yale University. Goldschmidt began his career in advertising, working at the Madison Avenue firm J. Walter Thompson as an art director, before moving to Hollywood to join the Warner Bros. marketing department in the late 1960s. Anthony Goldschmidt circa 1979 (Photo by Daniel Ecoff) Best known for his work as a poster designer, Goldschmidt most famously designed the iconic marketing campaign for Steven Spielberg's E.T. The Extraterrestrial with his firm Intralink. Other notable film posters designed by Goldschmidt include Blazing Saddles, Blade Runner, A Few Good Men, The Shawshank Redemption, Apollo 13, Twister, Psycho, The Aviator, Batman Begins and The Dark Knight.Goldschmidt was also a prolific title designer, creating titles for films such as McCabe & Mrs. Miller (1971), Straw Dogs (1971), Blazing Saddles (1974), Young Frankenstein (1974), The Witches of Eastwick (1987), Spaceballs (1987), Scrooged (1988), Thelma & Louise (1991), Stargate (1994), A Time to Kill (1996), and Batman & Robin (1997).Over the course of his career Goldschmidt won numerous awards for his film marketing and design work, including nine Clio Awards, 10 Art Directors Club of Los Angeles Awards, 26 Golden Trailer Awards, and 6 Graphic Design Gold AwardsHe died in Los Angeles in 2014. Articles Young Frankenstein title only Complete filmography"
