["https://artofthetitle.com/designer/bonnie-siegler"]
title = "Bonnie Siegler — Art of the Title"
description = "<p>Bonnie Siegler is a&nbsp;creative director, educator, and the founder of studio Eight and a Half.&nbsp;<br />She has designed title sequences for Will and Grace (1998), Shut Up and Sing (2006),&nbsp;Saturday Night Live, and&nbsp;Late Night with Seth Meyers&nbsp;(2014). With Eight and a Half, Siegler's clients have included&nbsp;The New Yorker, Participant Media,&nbsp;HBO, Brooklyn Public Library, The Criterion Collection, Random House, and The Frank Lloyd Wright Foundation.&nbsp;<br />Before Eight and a Half, Bonnie&nbsp;was co-founder of design studio Number 17 with partner Emily Oberman (from which the subsequent studio takes its name). Number 17's clients included&nbsp;Saturday Night Live, Late Night with Jimmy Fallon,&nbsp;30 Rock,&nbsp;Sex and the City,&nbsp;The Daily Beast, HBO, National September 11 Memorial and Museum, Colors&nbsp;Magazine,&nbsp;This American Life, the Mercer Hotel, and the Chateau Marmont.&nbsp;While at Number 17, Bonnie also served as Creative Director of&nbsp;Newsweek&nbsp;after overseeing its complete redesign.&nbsp;<br />Siegler is&nbsp;the author of two books:&nbsp;Dear Client, a guide for people who work with creatives, and&nbsp;Signs of Resistance, a visual history of protest in the United States. She&nbsp;has been voted one of the 50 most influential designers working today by Graphic Design USA and, in 2015, was a featured designer in the&nbsp;Art Director Club's Legacy Project. She served as the chairman of the 2013 AIGA national design conference, having previously co-created and chaired AIGA Design for Film and Television conferences in 1999 and 2001. Her work has been recognized by the Art Directors Club, Type Directors Club, the Society of Publication Design, the Webby Awards, and the Broadcast Design Association.&nbsp;<br />Siegler has taught in the graduate programs at Yale University and the School of Visual Arts, has been a visiting artist and guest lecturer at RISD, and was the 2014 Koopman Distinguished Chair in the Visual Arts at the University of Hartford. She has also taught a class about Art Direction on&nbsp;Lynda.com.&nbsp;<br />Originally from&nbsp;Huntington, NY (Long Island), Siegler&nbsp;studied graphic design at Carnegie Mellon University and began her career working at MTV Networks. She is based in&nbsp;Westport, Connecticut.</p>"
full_description = "Designer Bonnie Siegler Bonnie Siegler is a creative director, educator, and the founder of studio Eight and a Half. She has designed title sequences for Will and Grace (1998), Shut Up and Sing (2006), Saturday Night Live, and Late Night with Seth Meyers (2014). With Eight and a Half, Siegler's clients have included The New Yorker, Participant Media, HBO, Brooklyn Public Library, The Criterion Collection, Random House, and The Frank Lloyd Wright Foundation. Before Eight and a Half, Bonnie was co-founder of design studio Number 17 with partner Emily Oberman (from which the subsequent studio takes its name). Number 17's clients included Saturday Night Live, Late Night with Jimmy Fallon, 30 Rock, Sex and the City, The Daily Beast, HBO, National September 11 Memorial and Museum, Colors Magazine, This American Life, the Mercer Hotel, and the Chateau Marmont. While at Number 17, Bonnie also served as Creative Director of Newsweek after overseeing its complete redesign. Siegler is the author of two books: Dear Client, a guide for people who work with creatives, and Signs of Resistance, a visual history of protest in the United States. She has been voted one of the 50 most influential designers working today by Graphic Design USA and, in 2015, was a featured designer in the Art Director Club's Legacy Project. She served as the chairman of the 2013 AIGA national design conference, having previously co-created and chaired AIGA Design for Film and Television conferences in 1999 and 2001. Her work has been recognized by the Art Directors Club, Type Directors Club, the Society of Publication Design, the Webby Awards, and the Broadcast Design Association. Siegler has taught in the graduate programs at Yale University and the School of Visual Arts, has been a visiting artist and guest lecturer at RISD, and was the 2014 Koopman Distinguished Chair in the Visual Arts at the University of Hartford. She has also taught a class about Art Direction on Lynda.com. Originally from Huntington, NY (Long Island), Siegler studied graphic design at Carnegie Mellon University and began her career working at MTV Networks. She is based in Westport, Connecticut. Link 8point5.com Complete filmography"
