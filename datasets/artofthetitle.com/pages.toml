["https://artofthetitle.com/designer/ana-criado-zahonero"]
title = "Ana Criado Zahonero — Art of the Title"
description = "<p>Ana Criado (also&nbsp;credited as&nbsp;Ana Criado Zahonero) is a Spanish designer and creative director currently based in Los Angeles.<br />After studying industrial and graphic design in her native Spain, Criado worked as a freelance designer until 2012 when she joined the team at&nbsp;Prologue&nbsp;as an art director.&nbsp;At Prologue she&nbsp;worked on title sequences such as&nbsp;American Horror Story,&nbsp;The Secret Life of Walter Mitty,&nbsp;Godzilla, and more recently&nbsp;Star Trek: Discovery.&nbsp;In 2015 she became a senior art director at&nbsp;Logan.<br />Over the course of her career Criado has worked and collaborated&nbsp;with many other notable title design studios, including&nbsp;Elastic,&nbsp;Imaginary Forces,&nbsp;Digital Kitchen,&nbsp;Filmograph, and&nbsp;more.</p>"
full_description = "Designer Ana Criado Zahonero Ana Criado (also credited as Ana Criado Zahonero) is a Spanish designer and creative director currently based in Los Angeles.After studying industrial and graphic design in her native Spain, Criado worked as a freelance designer until 2012 when she joined the team at Prologue as an art director. At Prologue she worked on title sequences such as American Horror Story, The Secret Life of Walter Mitty, Godzilla, and more recently Star Trek: Discovery. In 2015 she became a senior art director at Logan.Over the course of her career Criado has worked and collaborated with many other notable title design studios, including Elastic, Imaginary Forces, Digital Kitchen, Filmograph, and more. Articles Star Trek: Discovery interview Godzilla title only American Horror Story: Coven title only Link anacezeta.com Previous Studios Prologue Films Logan Complete filmography"
