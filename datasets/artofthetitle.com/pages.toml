["http://www.artofthetitle.com/title/the-son"]
title = "The Son (2017) — Art of the Title"
description = "Journey through the violent history of Texas in the opening of AMC&rsquo;s new Western series The Son."
full_description = '''Journey through the violent history of Texas in the opening of AMC’s new Western series The Son, a sprawling generational saga soaked in sweat, blood, and oil. Based on author Philipp Meyer’s acclaimed novel of the same name, The Son follows Eli McCullough (Pierce Brosnan), a man whose fortunes seem inexorably tied to that of the Lone Star State. Beginning in the waning days of the Texas Republic, the story is split between two eras: 1849 and 1915. The former arc tracks young Eli’s time as a homesteader turned Comanche captive, the latter the elder Eli’s life as a family patriarch and successful cattle rancher mixed up in the Bandit War. Is McCullough’s story recorded truth or tall tale? It may be a bit of both. They say everything’s bigger in Texas. The Son (2017) trailer For The Son’s opening title sequence, AMC turned to Emmy-winning studio Huge Designs to give the series the mythic quality its huge story demanded. The broad strokes of the McCullough family epic – and in turn the story of Texas as we know it – are all encapsulated in the sequence. Using a mix of drone footage, visual effects elements, and clever transitions, the opening tracks Eli’s turbulent life in one continuous shot, from his abduction by the Comanche through to his rise as a ruthless land baron, before closing on a shot of a Native American figure dwarfed by a modern skyline. The future and all it brings with it await the McCulloughs, but a storm is always brewing. Interview Credits A discussion with Creative Director PAUL MCDONNELL of Huge Designs.So we last spoke back in 2013 about By Any Means. Huge has been producing some fantastic work since then. Would you say that much has changed for you and the company with regard to the sort of work you’ve been pursuing and trying to produce? Paul: To an extent. The Emmy win kind of put us on the radar, so we’ve been getting to pitch on much, much bigger jobs, which is nice. We’ve been doing a lot more work for the US. But apart from that we’re still a tiny studio. It’s only three of us full-time and then we’ve got one other part-time person. So the studio is just the same as it was before we won the Emmy, but the work seems to have improved quite a lot. We’re getting the bigger projects with the bigger budgets, as opposed to trying to crank out three title sequences a week for a tiny budget. We were not all that well known before Da Vinci’s Demons. Downton Abbey (2010) main titles, designed by Huge Designs Paul: We did the Downton Abbey titles and that show was so well received that kind of sparked some interest, and then the accolades on top of that gave us a bit of an edge in terms of getting our name out there. That helps us since we don’t do any promotional work of our own, which I suppose we should start doing. Huge already had a relationship with AMC thanks to the Into the Badlands. Was it that gig that led to The Son? Tell me about how this project came to you. Paul: Yes! So the Post-production Supervisor at AMC, Leslie Jacobowitz, she learned of us through Da Vinci’s and had us pitch on Into the Badlands. We worked quite closely with Miles Millar who developed that and built a good relationship with Leslie. She’s been putting us forward since then for pretty much any job she’s involved with. It seems like as soon as you’ve got a group of people who are happy with a title sequence, they sort of branch off and you get more work from outside there. I guess it can also work to your disadvantage because if you ever do something bad your name can get poisoned. Into the Badlands (2015) main titles, designed by Huge Designs Paul: But Into the Badlands was another fun project for us. It’s such a mix of genres that you didn’t really know where to go with it, so we just jumped in there feet first and they seemed to like it. So what were some of your initial conversations about The Son? Paul: Leslie mentioned that it was on the horizon. I’d heard of the book by Philipp Meyer but I hadn’t read it, so I quickly went out and bought a copy. I learned the premise of the story – it’s about a guy who gets captured by Comanches and sort of the birth of Texas – so I knew the stories without having to read the scripts. Then we jumped on a call with the author and a bunch of the executive producers, and they just kind of talked us through what they were hoping to see. They didn’t want anything too cliche and wanted something that people had never seen before, which basically everyone says. So we had a good three weeks to work on the pitch boards, but it was quite funny because we had somehow got our wires crossed and we thought the briefing was actually the pitch. We had cranked out the idea – the idea that actually won – and developed it before we even got the brief. We didn’t show it to anyone because we learned right before the call that they weren’t expecting to see any material. [laughs] So we were sitting on that idea before we were even briefed. We pitched maybe four or five different, this one being at the top, and then it was another couple of rounds and some tweaks before they gave us the greenlight to start working out how to do it. Could you tell us about the totem pole concept used for the title sequence and how it was developed? Paul: Right, so our idea kind of stemmed from the totem pole. We wanted it to tell a tale in a linear fashion. When we thought of Native Americans we thought totem pole, but apparently that’s a very northwestern thing. This story is about the Comanches who didn’t actually have totem poles, so we had to remove that word from the pitch. But we still felt that it lent itself well to the piece anyways. The Comanches had peace blankets and things that told a story in a very linear way. View 11 images Image set: The Son (2017) "Totem" concept (Actor Sam Neill was originally attached to the project). var gallerybb84092d_afff_4cf0_9fd7_8aea7031f069 = new View( [ { src: '/assets/sm/upload/08/q1/of/sn/theson_totem_01.jpg?k=2f09883d12' }, { src: '/assets/sm/upload/41/yj/pk/wr/theson_totem_02.jpg?k=2f09883d12' }, { src: '/assets/sm/upload/b5/ah/pp/at/theson_totem_03.jpg?k=2f09883d12' }, { src: '/assets/sm/upload/uf/67/na/is/theson_totem_04.jpg?k=2f09883d12' }, { src: '/assets/sm/upload/nn/ny/u6/hk/theson_totem_05.jpg?k=b9ada61c33' }, { src: '/assets/sm/upload/nb/n7/g3/po/theson_totem_07.jpg?k=2f09883d12' }, { src: '/assets/sm/upload/43/7o/7p/ok/theson_totem_08.jpg?k=b9ada61c33' }, { src: '/assets/sm/upload/e9/sv/xl/ka/theson_totem_09.jpg?k=b9ada61c33' }, { src: '/assets/sm/upload/y6/q3/sn/lc/theson_totem_10.jpg?k=b9ada61c33' }, { src: '/assets/sm/upload/la/fs/vn/dt/theson_totem_11.jpg?k=b9ada61c33' }, { src: '/assets/sm/upload/ke/2d/o5/m2/theson_totem_12.jpg?k=b9ada61c33' } ], { zoom: true } ); Paul: From there it was a case of working out which scenes could transition well into the next. We knew the story that we wanted to tell – from the burning cabin at the beginning of episode one and ending on the skyline of modern Texas. In essence you don’t really know what the time period is. We wanted it to have a bit of a mystique to it. Then we just had to fill in the gaps in between, working out how to seamlessly transition from one scene to the other. We use reflections and water a little too liberally but it works! [laughs] Whatever works! Paul: Yeah! Absolutely. Could you talk about some of the other concepts you pitched? Paul: Yeah, we were also playing around with a lot of Native American art. It had a bit more of an illustrative feel to it. We were inspired by Allen and Patty Eckman and David Ratham. We would have commissioned those artists if their ideas were chosen. The problem is that we kept being drawn to these palettes that were browns and blacks. It did feel very dated. View 9 images Image set: The Son (2017) Allen and Patty Eckman Concept var gallerybfc2ccb1_cec3_460a_9375_75ad7d37d1cd = new View( [ { src: '/assets/sm/upload/z9/xx/v1/z5/theson_eckman_01.jpg?k=0f648f16cc' }, { src: '/assets/sm/upload/me/ki/cr/o0/theson_eckman_02.jpg?k=0f648f16cc' }, { src: '/assets/sm/upload/o4/dj/vs/2r/theson_eckman_03.jpg?k=0f648f16cc' }, { src: '/assets/sm/upload/t9/ea/8j/pw/theson_eckman_04.jpg?k=0f648f16cc' }, { src: '/assets/sm/upload/a0/vq/k3/75/theson_eckman_05.jpg?k=0f648f16cc' }, { src: '/assets/sm/upload/dn/bp/jg/4s/theson_eckman_06.jpg?k=0f648f16cc' }, { src: '/assets/sm/upload/im/r5/ec/qc/theson_eckman_07.jpg?k=0f648f16cc' }, { src: '/assets/sm/upload/tk/ps/sc/9o/theson_eckman_08.jpg?k=0f648f16cc' }, { src: '/assets/sm/upload/5h/vs/0m/jm/theson_eckman_09.jpg?k=0f648f16cc' } ], { zoom: true } ); Paul: When you’re designing a title sequence for a Western, it’s very easy to fall into certain traps that have been laid out since the days of Clint Eastwood. Those sequences are amazing, all those incredible, very graphic, wonderful sequences. You feel like you want to pay homage to that, but it was just so opposite to what they wanted as a sequence. View 5 images Image set: The Son (2017) typographic concept var gallery2fc3a246_2cb4_4922_b69a_be103bc947c0 = new View( [ { src: '/assets/sm/upload/zz/ym/k7/up/theson_type_01.jpg?k=6974ed6e84' }, { src: '/assets/sm/upload/tp/89/xp/8b/theson_type_02.jpg?k=6974ed6e84' }, { src: '/assets/sm/upload/zg/c4/wc/fy/theson_type_03.jpg?k=6974ed6e84' }, { src: '/assets/sm/upload/uo/83/2s/3g/theson_type_04.jpg?k=6974ed6e84' }, { src: '/assets/sm/upload/f9/ry/ed/hb/theson_type_05.jpg?k=6974ed6e84' } ], { zoom: true } ); Paul: So we had to force ourselves away from that, but we definitely did squeeze some of those boards in there. But they were thrown out after the very first pitch meeting. You could kind of tell they were slowly losing interest when we showed those ones. So once you get the greenlight from the producers and AMC, what were the next steps? Paul: After we got the go ahead we went straight into a bit of R&D. We thought we could make the entire sequence in 3D – 3D projection mapping everything. We played around with a few tests, but it just wasn’t working. There are so many little nuances, for example, if you’ve got a field that you’re dropping a camera down into, you’ve got these little blades of grass that start to emerge. You lose all that if you’re faking that with a projecting map. So we knew relatively early in the process that we had to get out to Texas with a drone and start getting this footage in camera. We initially wanted to shoot in California just because there were a few ranches out there that were quite accessible. Texas had had so much rain that summer and everything was so green. California was still dealing with a bit of a drought, so everything was really dry. We were setting up the shoot there and that got bounced to Texas. What were the logistics of setting up a location shoot in Texas? Paul: We got in touch with Buttons Pham. She was our producer. Buttons Pham and Alex Fedolak, our Line Producer. They live in Austin and they just scouted everything for us. They found us an amazing drone pilot, an amazing director of photography, so as soon as we touched down in Texas they whisked us away and took us to these places that were perfect. One of the first places we went to was a ranch where they were filming the series. Unfortunately they had already burned the cabin by that stage, so we had to recreate this cabin in 3D. Then we went to a cattle ranch and that was really quite an experience. We were hanging out with the cowboys as they were driving the cattle through the fence. Driving cattle for The Son (2017) title sequence at the ranch in Texas Paul: Part of the problem was that we needed the long shadows so that you would realize what you were looking at, but it was very cloudy that day. Everyone was sitting around waiting for the sun to peek through. You’ve got all these cowboys with these cattle on one side of the orchard starting to get grumpy, and then as soon as the sun came out the stampede could start. I was talking to one of the producers and he said that people have this preconception of Texas, that it’s all about shooting guns and riding horses. “That’s not really what it’s like. But you guys come out here and that’s the first thing you see!” [laughs] [laughs] There must have been a bit of culture shock for you going straight from the West End of London to rural Texas. What did the cowboys think of what you were doing? Did you tell them that you were shooting a title sequence? Paul: Yeah, we showed them the animatic and what we had planned. They were so accommodating. I was a little frightened about hanging out with proper cowboys all day, but we had dinner at their ranch. They were the nicest people you could ever meet. We had a laptop hooked up out there so they could watch immediately after it was filmed. The ranchers gather to look at the drone footage. Paul: They’d all crowd around and look at the footage of them driving these cattle through the field. They were a lot of fun. They took us out for a tour around the ranch, picking up arrowheads and things like that. Let’s talk about the drones and the decision to shoot with them. Why did you decide to do things that way? Flying the drone on location Paul: That became apparent very early on. As we were doing the pitch it was always in the back of my mind. I knew I wanted to do it in camera as much as possible. So our initial idea was that we were going to buy a little DJI Phantom drone, head out there ourselves, and just film what we needed to film. But we were really lucky that we listened to our producer. She didn’t think that was the best idea since none of us had ever flown a drone. So we got Jesse Wolter with this big ol’ beast of a thing. It was about four feet in diameter. It was pretty windy out there and it didn’t rock at all! Did that tech present any problems during the shoot? Never work with kids, animals, or drones? Paul: No, no. It was good, but it does have its limitations. It has about 20 minutes of battery life, so for example during the cattle drive the drone had to be flying quite high up so as not to startle the cows. So the drone was up there waiting and we were all waiting for the sun to clear. We had a 20 minute window or it would have to land and charge the batteries just to take it up again. For one of the river shots we did use a Phantom. We took that thing up and we had a bit of an issue with a buzzard that kept coming at it. [laughs] He had to land the drone every time this buzzard came too near because he’d seen these things attack drones and just trash them. But apart from that it’s a really fun way to work. You get the DOP standing right next to you to watch the footage you’re capturing. I would definitely work with drones again as opposed to children or animals. [laughs] So let’s talk about post. Once you got all the footage in Texas and you’re back in London. What were the next steps for the team? Paul: Then we start compositing it and stitching it together. We had about six hours of footage that we had to troll through and '''
