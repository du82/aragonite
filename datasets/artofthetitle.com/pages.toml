["https://artofthetitle.com/designer/betty-green"]
title = "Betty Green — Art of the Title"
description = "<p>Betty Green is an Emmy Award-winning title designer and artist.&nbsp;<br />She has created title sequences for TV series Murder, She Wrote (1984&ndash;1996), Stingray (1985),&nbsp;Rags to Riches (1987),&nbsp;Mission: Impossible (1988),&nbsp;Quantum Leap (1989&ndash;1993), and&nbsp;Law &amp; Order (1990), and the films Soylent Green&nbsp;(1973),&nbsp;and&nbsp;There Are No Children Here (1993), among others.&nbsp;<br />Based in Santa Monica, California, her work often incorporates techniques in which photographic stills, artwork and special effects are shot under an animation camera. In 1985, she received a Primetime Emmy Award for Outstanding Main Title Design for her work on Stingray. She has also been awarded an&nbsp;International Clio for The Eastman Kodak Story and a&nbsp;Certificate of Tribute, City of Los Angeles for accomplishment in the Arts.<br />Originally from New York, she studied fine arts at Cornell University and UCLA. Currently Green works as a fine artist, creating mixed media paintings in her Santa Monica studio. Her work has been exhibited in Los Angeles as well as galleries and museums across the United States.</p>"
full_description = "Designer Betty Green Betty Green is an Emmy Award-winning title designer and artist. She has created title sequences for TV series Murder, She Wrote (1984–1996), Stingray (1985), Rags to Riches (1987), Mission: Impossible (1988), Quantum Leap (1989–1993), and Law & Order (1990), and the films Soylent Green (1973), and There Are No Children Here (1993), among others. Based in Santa Monica, California, her work often incorporates techniques in which photographic stills, artwork and special effects are shot under an animation camera. In 1985, she received a Primetime Emmy Award for Outstanding Main Title Design for her work on Stingray. She has also been awarded an International Clio for The Eastman Kodak Story and a Certificate of Tribute, City of Los Angeles for accomplishment in the Arts. Originally from New York, she studied fine arts at Cornell University and UCLA. Currently Green works as a fine artist, creating mixed media paintings in her Santa Monica studio. Her work has been exhibited in Los Angeles as well as galleries and museums across the United States. Articles Law & Order title only Quantum Leap title only Mission: Impossible title only Stingray title only Soylent Green interview Link bettygreenart.com Complete filmography"
