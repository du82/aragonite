["https://artofthetitle.com/designer/aaron-sorenson"]
title = "Aaron Sorenson — Art of the Title"
description = "<p>Aaron Sorenson is a motion designer and director.<br />A native of Northern California, Aaron launched his career at San Francisco&rsquo;s W!ld Brain, where he worked on character animation. After co-directing Thailand&rsquo;s first CG feature, Khan Kluay, in 2005, Aaron joined LAIKA/house. While there, he has co-directed a music video for They Might Be Giants&rsquo; &ldquo;The Bastard Wants to Hit Me&rdquo; and directed work for Nike, Starbucks, SOYJOY, and Dole.<br />He was selected by The Hollywood Reporter as one of the entertainment industry&rsquo;s &ldquo;brightest and most talented 35-and-under artisans.&rdquo; He has also garnered honors at many environment and animation festivals for his work on The Surfrider Foundation&rsquo;s PSA &ldquo;Rise Above Plastics,&rdquo; which is competing in 2013 at the Anney International Animation Festival.</p>"
