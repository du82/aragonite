["https://artrenewal.org/Education/ArtScholarships"]
title = "Education - Art Renewal Center"
full_description = '''In addition to the Art Renewal Center's Annual Scholarship competition, there are a series of other scholarship programs available to help students learn traditional painting techniques. Some of the ateliers have their own scholarship programs and there are certain government programs and scholarships put out by private foundations available to students as well. Please see below for a listing. (This page is a work in progress. If you know of any scholarship programs that you feel should be on this list please contact Kara Ross at kara.ross@artrenewal.org) ARC Scholarship Competition https://www.artrenewal.org/pages/scholarshipapplication.php This scholarship is designed to help students around the world learn proper training methods and techniques at an ARC Approved™ School. The ARC has awarded over $350,000 in scholarships to students attending approved programs through our annual scholarship competition, and over $2,000,000 as a whole in scholarships, grants and prizes to date. This scholarship awards $30,000 a year to aspiring young artists who wish to paint and/or sculpt in the realist tradition. Entries are accepted every May. Ani Art Academies Full Merit Scholarship Program http://www.aniartacademies.org The Ani Art Academies have become an international force for Realism by providing knowledge, training, and resources to aspiring artists. The schools, staff and curriculum is committed to empowering hopeful apprentices with the technical skills and confidence to achieve the highest levels of creative freedom. Apprentices commit to full time attendance and must be extremely dedicated to completion of training. Any commitment of fewer than thirty hours per week would require advance permission and reasonable justification, but is possible. Ani Art Academies Apprentices must maintain satisfactory reviews in order to maintain their scholarship status. Each accepted student receives a Full Merit Scholarship, which is a full academic scholarship that enables more focus and participation in the educational process. Ani Art Academies Full Merit Scholarship covers all tuition, materials, and outside the US, meals. All funding comes from the Tim Reynolds Foundation and Ani Villas International. Please contact Alexandra Svab, Ani Art Academies General Administrator at alexandra.svab@gmail.com for further information. For more information about the Ani Art Academies Scholarship program and enrollment process online, please visit www.aniartacademies.org and click on the "About" or "Enrollment" link. The Academy of Realist Art, Boston Scholarship http://academyofrealistartboston.com/scholarship-info/ The Academy of Realist Art, Boston has an annual scholarship competition for promising artists with a love for academic style painting and drawing. The Academy is one of a select few art schools in the world that teaches the academic approach to figure drawing and painting. The curriculum is modeled classical techniques on those used by 19th-century European academies to help students master fine art skills. The scholarship to be awarded is for one year's free tuition (including open studio) for the school year, September 2015-June 2016. Equivalent value is up to $7,545 for our full-time program in Boston. Applicants must be 18 years of age or older (or with parental permission). Deadline for submission is March 15, 2015. Winners will be announced March 30, 2015. The Academy of Realist Art Scholarship http://academyofrealistart.com/contest.html In 2012 The Academy of Realist Art launched its first annual scholarship competition for promising artists with a love for academic style painting and drawing. ARA is one of a select few art schools in the world that teaches the academic approach to figure drawing and painting. They model their curriculum and classical techniques on those used by 19th-century European academies to help students master fine art skills. There are two first prizes awarded for one year's free tuition (valued at $7620 Canadian) for their full-time program: One at ARA Toronto and one at ARA Boston. Second prize is a two-week workshop of the winners choosing and Third prize is a one-week workshop of their choosing (ARA Toronto only). Applicants must be 18 years of age or older. Deadline for submission in 2012 is September 30. Awards and deadline dates may change in future years. Visit the following link for more information. Angel Academy Scholarship http://www.angelartschool.com/enrolment.html Angel Academy of Art, Florence, does award in-house scholarships, but only in exceptional circumstances. The student must have completed at least two years of the program and have exceptional talent. The scholarship award could then be given to such a student, one who cannot afford to finish the program without financial assistance and who is in the last or next-to-last trimester with them (it is a nine-trimester program). The Italian Government recognizes Angel Academy and Italian citizens can apply for scholarships to attend this school through government programs. Please see below under Students From Italy for more information. Studio Incamminati Annual Scholarship Studio Incamminati, School for Contemporary Realist Art, awards two $5,000 and six $3,000 scholarships annually to students enrolled full-time in the Advanced Fine Art Program. Overall criteria for the successful applicant include quality of work, artistic potential, commitment to becoming an artist and demonstrated financial need. Scholarship money is applied only to tuition, not for materials, housing or any other expenses. Application deadline is May 31. For details of scholarships, including The Maggie Price and Urania Christy Tarbet Scholarships and The Dr. Alan Kwon and Mrs. Ruth Miller Scholarship, please see: www.studioincamminati.org/programs/financial-aid/itemlist/category/73-scholarships IlluXCon Scholarships http://www.illuxcon.com/node/47 Open to any student (high school, college, or atelier) the winners will receive all-expense paid trips to IlluXCon (or $1200 towards their trip if they are located outside of the continental US). The annual IlluXCon symposium, founded in 2008, draws artists and attendees from all over the world. This year (2012) it will be held in Altoona, PA. Starting in 2013 it will have a prominent venue at the Allentown Art Museum, PA, an AAM accredited institution with over 100,000 annual visitors. IlluXCon features an average display of over 1000 original works of art, and is filled with workshops, lectures and painting demonstrations by the foremost artists in the field as well as providing a leading opportunity for collectors to view and purchase original works. Submission deadlines are normally June 1st, for the year of 2012 it will be August 1st. The Elizabeth Greenshields Foundation Grant http://www.elizabethgreenshieldsfoundation.org/ The Elizabeth Greenshields Foundation is a Canadian foundation that provides financial grants to art students and artists from around the world in the early or developmental stage of their career. The Foundation focuses solely on those who work in a representational style of painting, drawing, sculpture or printmaking and who are committed to making the practice of their art a lifetime career. Grants are intended to assist applicants in the study or practice of their art, and the costs associated therewith, such as tuition, studio rental, model fees, travel and living expenses. Eligible courses of study or training include undergraduate, graduate or post-graduate studies and diploma programs from accredited institutions, recognized residencies, apprenticeships/internships and studio training. Abstract or non-representational art is precluded by the terms of the Foundation's Charter. The Foundation does not accept applications from commercial artists, graphic designers and illustrators; photographers; cartoonists; animation artists; video artists, filmmakers and digital artists; craft-makers; or any artist whose work falls primarily into these categories. First grants are in the amount of CAD $15,000 each. Subsequent grants are in the amount of CAD $18,000 each. Grantees may not receive more than three grants in their lifetime. Applicants must be at least 18 years of age at the time of submitting their application. The Foundation welcomes applications throughout the year; there is no deadline for filing an application. For more information on the Foundation, its mission, its grants, eligibility requirements, and how to apply for a grant, please visit its website at www.elizabethgreenshieldsfoundation.org The John F. and Anna Lee Stacey Foundation Fine Art Award Although juried through the National Cowboy and Western Heritage Museum, this is not a cowboy art competition and was never meant to be limited to American western or cowboy imagery. The trust was started to support the study of classical painting and drawing techniques taught in the "western European tradition." It is open to United States citizens only, both men and women, single or married, irrespective of race creed or color. The age limit is between 18 and 35 years. Appointments will normally be for one year and the amount available for distribution will approximate $5,000.00. At the discretion of the committee, this may be awarded in quarterly installments to one or more applicants. Address inquiries to Dianef@nationalcowboymuseum.org Students from Sweden: Centrala Studiestodsnamnden http://www.csn.se/en/2.743 CSN approves and sends out Swedish financial aid for studies, which includes both grants and loans to students in Sweden and abroad. We at CSN also handle repayment of the loans. Thanks to the opportunity to obtain financial aid, everyone in Sweden can study. It would accordingly make no difference which social, economic or geographic background a person has or if he or she has any impairment. CSN awards a total of approximately 23 billion Swedish kronor a year to almost 900,000 students. Students from Denmark http://www.su.dk/udland/Sider/default.aspx In Denmark there is a student aid system for everybody 18 years or older who is studying. You can get it for all educations recognized by the Danish government. You can however also get student aid abroad if you can get your education accepted by the department for student aid. One of the key things for this to happen is that the school needs to be recognized by the country in which it is situated. For example the Angel Academy is recognized by the Regione Toscana (the Tuscan regional government). You'll also need to supply other documentation from the school but all the information they need can be easily found via the link below. They can also find all the relevant application forms there. Students from Italy http://www.provincia.fi.it/formazione/per-chi-vuole-frequentare-corsi/ Each province has its own art-scholarship budget, and that of some provinces is very small-university education there is virtually free for Italians; so, scholarships aren't really needed, although there is some for special studies, such as for study at the Atelier School some of which are government recognized. Once this small allotted scholarship money has been spent, that's it for the year. Here's the link for scholarship applications in Tuscany, available only to Italian residents in the Florence-Arezzo-Pisa-Siena area:'''
