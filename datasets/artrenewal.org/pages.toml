["https://artrenewal.org/AboutUs/Staff"]
title = "Staff - Art Renewal Center"
full_description = '''Staff, Board of Judges, and Advisory Board Staff Board of Judges Advisory Board Fred Ross ARC Chairman Founder Contact Founder and Chairman of the Art Renewal Center, Ross is the leading authority on William Bouguereau and co-author of the published Catalogue Raisonné William Bouguereau: His Life and Works. Ross received his MA in art education from Columbia University. His speeches and essays are read by over 300,000 art professionals, educators, students and fans each year; and have become required reading in countless classrooms. He has given lectures and speeches at prominent venues including The Metropolitan Museum of Art, Sotheby’s NY, The Dahesh Museum, NY, the Berkshire Museum, MA, The Wadsworth Athenaeum, CT, the MEAM Museum, Barcelona, as well as university campuses among other venues. Ross is also a well-known collector of 19th Century European painting and of Contemporary Realism, being published in numerous magazine and newspaper articles including Forbes Magazine and Fine Art Connoisseur among others. Ross has also been a frequent Juror in numerous competitions and is an ARC Salon and ARC Scholarship judge. Kara Lysandra Ross ARC Co-Chair and Chief Operating Officer Founder Contact Kara Lysandra Ross is the Co-Chair and Chief Operating Officer for the world renowned Art Renewal Center (ARC). She holds a BA in Art History from Drew University. As an art educator she has been a contributing writer for Collections Magazine, and Fine Art Connoisseur, and has been published frequently in other magazines and newspapers. She was the co-editor of the William Bouguereau Catalogue Raisonné and author of chapter 28 in the published second edition. In her role at the ARC she spearheaded the introduction of the live exhibition associated to the ARC Salon Competition which has traveled to prestigious venues such as Sotheby’s NY, Sotheby’s LA, The European Museum of Modern Art (MEAM) and the Salmagundi Club, serving as chief organizer and curator. She is an ARC Salon Juror, and has served as juror in other competitions for organizations such as the 2nd Velázquez Painting & Sculpture competition, China, the South African Portrait Society, International Guild of Realism, IX Arts, and the Ani Academy. She is also an expert on 19th century Academic French and English painting, co-authoring William Bouguereau: The Essential Works and is currently researching and writing the catalogue raisonné on Edmund Blair Leighton, for which she is accepted as the world authority, authenticating works by this artist for Sotheby's, Christie's, and Bonham's among others. Iian Neill Technical Lead Founder Contact Iian Neill is an ARC founder and builder of both the original ARC website back in 1999 and its newly designed version. He holds a BA in Art History and English Literature from the University of Queensland, as well as a Postgraduate Certificate in IT, and has over ten years' experience as an ASP.NET consultant. He has given presentations on art history to the University of the Third Age and delivered a lecture at the Salisbury Art Studios on the subject of imitation and art. He is also the founder and developer of an innovative digital humanities text-as-a-graph project called The Codex, which visualises the connections between artists, artworks, and historical events. Iian was made a visiting researcher at the Digital Academy of the Academy of Sciences and Literature at the University of Mainz, Germany in 2018. Angela Swanson Jones ARC Salon Director Angela Swanson Jones is a graduate of Brigham Young University and holds an M.A. degree from the Courtauld Institute of Art, University of London. She has published articles with Fine Art Connoisseur and is the co-author of three books: Desperately Young: Artists Who Died in Their Twenties (ACC Art Books, 2020); Dictionary of Utah Fine Artists (Gibbs Smith Publishers, 2022); and the forthcoming biography John Hafen: Utah’s Aesthetic Conscience (Gibbs Smith Publishers, 2024). Her other topics of research include 19th and 20th-century realist religious art, and she is currently preparing a biography and catalogue raisonneì of the German painter Heinrich Hofmann (1824–1911). Prior to her appointment as ARC Salon Director, Angela was a volunteer with the organization and a proponent of its cause. After living for ten years in Europe, she now resides in Dallas, Texas. Hongbin Zhang ARC Chinese Realist Artist Ambassador Zhang Hongbin is a far-sighted cultural manager and curator with an international perspective. He firmly believes that global interaction and cross-cultural exchange are the most important transformative forces shaping our era. To this end, he has been active at the forefront of the world's art field for more than 20 years, promoting cross-regional and cross-cultural dialogue between the East and the West and enhancing exchanges of values, beliefs, practices and mutual trust between people from different cultural backgrounds, making huge contributions through his efforts. As the founder of "Sheng Xinyu Art" established in 2002, Zhang Hongbin has won wide acclaim in the field of international figurative art. He currently serves as a member of the international jury of the "Almenara Art Prize" (Spain) and the "TARTGET PAINTING PRIZE" (Spain), as well as the chief editor of the overseas center of Collection magazine. In addition, he has also served as: International Committee Member of the Florence Biennale (Italy) and Chinese Ambassador of the Laguna Art Prize (Italy). Zhang Hongbin organized and planned global art competitions such as the "Titian International Portrait Painting and Sculpture Competition", "Velazquez Painting and Sculpture Competition", "Venice International Watercolor Festival", and "International Youth Art Competition". In addition, he has written and commented for well-known magazines such as Collection, Art Business, Art News, Gallery, Harper's Bazaar, Chinese Watercolor, Art Focus and so on. He has conducted nearly a hundred interviews with artistic figures from around the world. Moreover, the annual number of readers of the "Sheng Xinyu Art" public account (corporate media) has exceeded 2.1 million. In summary, Zhang Hongbin’s multi-faceted contributions in the field of art make him an outstanding figure in promoting global cultural exchanges and cross-cultural understanding. Frank Gatti Chief Financial Officer Contact BS in accounting from St. John's University, MBA in Finance from Wagner College, worked as a financial analyst on Wall Street for major banking institutions Yvette Lytle Chief Liaison for ARC Approved Schools and Artists/Museum Archivist Contact Associates Degree in Visual Communications from the Katherine Gibbs School, Website and Graphic Designer, Artist. Sabrina Foland Media Coordinator and ARC Store/Web Assistant Contact Bachelor of Arts in Graphic Design from Montclair State University. Graphic Designer. Michele Carnevale Executive Assistant Executive Assistant to ARC Chairman, Fred Ross. BA, AAS, in Professional Sciences from The Laboratory Institute of Merchandising. Sherry Ross Editor-in-Chief Founder Author of The Vinetrope Adventures, The Seeds of the Pomegranate, and The Sorrell Ridge Cook Book, Sherry Ross has also been published in many poetry magazines including POET Magazine and Enchanted Living Magazine. Sean Colon Technical Advisor BA in International Relations Thank you to Paul Ripley for writing many of the historical artist biographies that appear throughout the ARC museum and also to Don Kurtz, for providing many of the historical photographic resources. .double-height { height: 2.5em; } Fred Ross ARC Chairman Founder and Chairman of the Art Renewal Center®, Ross is the leading authority on William Bouguereau and co-author of the published Catalogue Raisonné William Bouguereau: His Life and Works. Ross received his MA in art education from Columbia University. His speeches and essays are read by over 300,000 art professionals, educators, students and fans each year; and have become required reading in countless classrooms. He has given lectures and speeches at prominent venues including The Metropolitan Museum of Art, Sotheby’s NY, The Dahesh Museum, NY, the Berkshire Museum, MA, The Wadsworth Athenaeum, CT, the MEAM Museum, Barcelona, as well as university campuses among other venues. Ross is also a well-known collector of 19th Century European painting and of Contemporary Realism, being published in numerous magazine and newspaper articles including Forbes Magazine and Fine Art Connoisseur among others. Ross has also been a frequent Juror in numerous competitions and is an ARC Salon and ARC Scholarship judge. Dr. Vern Swanson Swanson has his PhD from the Courtauld Institute of Art, London, England and was the Director of the Springville Museum of Art, Utah, where he has served for over 30 years. He is a lecturer/scholar/writer and expert on 19th Century European Art and Russian Art through the 20th Century. Swanson is the leading authority on Sir Lawrence Alma-Tadema and John William Godward and author of the Catalogue Raisonnés for both artists. In total, the number of books Swanson has published is well into the teens. Peter Trippi Former Director of the Dahesh Museum of Art, Trippi is now the Editor of Fine Art Connoisseur magazine, which provides art collectors and enthusiasts with in-depth editorial coverage of historical and contemporary representational art authored by well-known experts. Mr. Trippi is also the leading authority on John William Waterhouse,(1849-1917) and the author of J. W. Waterhouse, which was published by Phaidon Press in 2002. Michael John Angel Michael John Angel is an ARC Living Master™ and regarded as one of the foremost figurative painters alive today; with his paintings hanging in both public and private collections on both sides of the Atlantic. From 1982 to 1988 he was the Director of the National Portrait Academy in Toronto, Canada, and from 1992-1995 the Assistant Director of the Florence Academy of Art in Florence, Italy. In 1997, his school, the Angel Academy was founded with the assistance of Lynne Barton. Angel Academy is now one of the most successful Atelier Schools in the world, requiring of its students the highest standards of traditional techniques. View ARC Gallery Juliette Aristides Juliette Aristides is an ARC Living Master™ and founding member of the Water Street Atelier with Jacob Collins, Aristides is a recipient of the Elisabeth Greenshields Grant; and founded the Classical Atelier at Gage Academy of Fine Art in Seattle, Washington. She has authored three books, Classical Drawing Atelier, Classical Painting Atelier, and Lessons in Classical Drawing, which includes an instructional DVD and quickly became a best seller. Her books have become well received guidelines for drawing and painting. View ARC Gallery Dr. Gregory Hedberg Dr. Gregory Headburg is the Director of the Department of European Art at the world renowned Hirschl & Adler Galleries in Manhattan. He received his BA in Art history from Princeton University and his PHD from New York University. He was the former Chief Curator of the Wadsworth Antheneum, and was the first professional Director of the New York Academy of Art. He has worked tirelessly throughout his life to bring back a re-appreciation for traditional painting and was one of the first experts in the 19th century field. Gabriel Weisberg Weisberg is a world expert in French Naturalism and a writer, lecturer, and scholar. He is the author of Against the Modern: Dagnon-Bouveret and the Transformation of the Academic Tradtion, and a contributing writer to ARC. His research and work on Jules Breton, Jules Adler, Albert Besnard, Jean-Charles Cazin and Theodule Ribot, have helped reestablish an awareness and appreciation of the entire 19th century. Daniel Gerhartz Daniel Gerhartz is an ARC Living Master™ and has been featured in numerous publications including the hardbound book, Creative Oil Painting: Techniques from 15 Master Painters by Stephen Doherty. His teaching credentials include the Scottsdale Institute and his work is included in the permanent collection of the West Bend Art Museum in Wisconsin and the Huntsville Museum of Art in Alabama. Gerhartz also won Best of Show in the 1st international ARC Salon Competition in 2004, and is one of the few living realists to successfully penetrate the secondary market; with works selling at important auction houses including Sotheby's. View ARC Gallery Daniel Graves Daniel Graves is an ARC Living Master™. He was a student of Richard Serrin at the Villa Schifanoia Graduate School of Fine Art, and studied under Nerina Simi, daughter of the Florentine painter, Filadelfo Simi, a student of Gérôme. Daniel Graves went on to found The Florence Academy of Art in 1991, where he still serves as the Academic Director. In April 2008 Daniel Graves and The Florence Academy of Art received the Excellence in Art Education Award from the Portrait Society of America. The academy’s programs in Florence, Sweden and the U.S. are accredited by the National Association of Schools of Art and Design. View ARC Gallery B. Eric Rhoads B. Eric Rhoads is the Founder and Chairman of Streamline Publishing, Inc., publisher of Fine Art Connoisseur Magazine, which provides art collectors and enthusiasts with in-depth editorial coverage of historical and contemporary representational art authored by well-known experts. Rhoads also publishes PleinAir, a magazine focused on representational landscape painting with in-depth coverage of historical and contemporary artworks painted en' plein air and in studio and the Plein Air Convention. The company also produces artist videos with many masters including ARC Living Master™ Max Ginsburg. Rhoads, an entrepreneur, founded the company in 1986 and produces other magazines and conferences. He is a well known author and blogger on art marketing, has released a DVD series for artists on art marketing, and is also a landscape and figurative painter. Patrick Wilshire Patrick Wilshire is the Director of the Association of Fantastic Art, dedicated to the promotion, recognition and elevation of the art of imaginative realism. This genre includes works that were heavily influenced by the storytelling paintings of the 19th century; artists such as Burne-Jones and John William Waterhouse. It is the organization behind the groundbreaking IlluXCon symposium started in 2008, and the Illustration Exchange, the online nexus for collectors of original paintings, drawings and sculpture from this style of realist art. In addition he is the author of Visions of Never: The Collection of Fantastic Art, (2009), The Art of the Dragon: The Definitive Collection of Contemporary Dragon Paintings (2012), and the History of Imaginative Realism. He was also honored to be the guest curator of AT THE EDGE: Art of the Fantastic, mounted at the Allentown Art Museum, PA, in June of 2012. Jeannie Wilshire Jeannie Wilshire i'''
