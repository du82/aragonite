title = "Home - Art Renewal Center"
full_description = "Art Renewal Center® Leading the Revival of Realism Leading the revival of realism in the visual arts, the Art Renewal Center® (ARC), a 501(c)(3), non-profit, educational foundation, hosts the largest online museum dedicated to representational art and includes works by the old masters, 19th century, and 21st Century Artists as well as articles, letters and other online resources. The ARC is the foremost and only vetting service for representational art schools ensuring that the teaching curricula and quality of teacher and student work meet our strict standards to become ARC ApprovedR. The ARC also runs the ARC Salon Competition, which is the largest and most prestigious competition in the world for realist artists painting, sculpting and drawing today with eleven categories and thousands of works competing, culminating in a live exhibition of many of the winning works. The ARC works with other ARC Allied OrganizationsTM, artist groups, museums, and publications to become a central news hub for the 21st Century Representational Art Movement. Read the ARC Philosophy written by ARC Chairman, Frederick C. Ross, to learn why ARC is so passionately dedicated to representational art. Most Recent Blog 18th ARC Salon Call for Entries Published on 1 March, 2025 When talking about competitions dedicated to 21st Century Realism, the Art Renewal Center’s International ARC Salon® is the largest in the world, receiving over 5,000 entries from 87 countries last competition. It is no wonder why artists are entering. With over $130,000 in cash awards and international recognition through the ARC website which receives over 2,000,000 visitors annually, the ARC Salon also offers career changing opportunities through partnerships with prestigious magazines, museums, galleries and more. Don’t miss your chance to compete! Categories include: Figurative, Portraiture, Imaginative Realism, Drawing, Landscape, Still Life, Plein Air Painting, Fully From Life, Sculpture, Animals, and a special category for teens. Entries to the 18th International ARC Salon® will be accepted from March 1 – June 12, 2025. To learn more click here. 18th International ARC Salon Competition Begins Saturday Published on 28 February, 2025 When talking about competitions dedicated to 21st Century Realism, the Art Renewal Center’s International ARC Salon® is the largest in the world, receiving over 5,000 entries from 87 countries last competition. It is no wonder why artists are entering. With over $130,000 in cash awards and international recognition through the ARC website which receives over 2,000,000 visitors annually, the ARC Salon also offers career changing opportunities through partnerships with prestigious magazines, museums, galleries and more. Don’t miss your chance to compete! Categories include: Figurative, Portraiture, Imaginative Realism, Drawing, Landscape, Still Life, Plein Air Painting, Fully From Life, Sculpture, Animals, and a special category for teens. Click here to enter the 18th ARC Salon competition. Etching: Masters of Line Published on 28 February, 2025 June 30 - July 25, 2025 Masters of Line offers a unique opportunity to learn and practice copper plate etching at The Florence Academy of Art’s magnificent campus in Florence, Italy. The course is studio-based, with accompanying Art History lectures, field drawing, material lectures, studio demonstrations, and intensive hands-on monitored studio/lab work. Students are introduced to all aspects of Line Etching, preparing the ground, biting, proof-printing, and plate correction, and finish the program with at least three of their own completed copper plates. While ideal for beginners, this workshop offers substantial value to those with prior etching experience, covering both fundamental techniques and advanced processes involved in creating high quality works. Location: The Florence Academy of Art, Via Aretina 293, Florence, Italy. Click here to view the campus. For more information visit: https://www.florenceacademyofart.edu/workshops/etching-masters-of-line/ or email info@florenceacademyofart.edu. Painting the Italian Landscape – 10 Day Workshop with Thomas Kegler Published on 27 February, 2025 If you have ever dreamed of an affordable way to partake in a painting trip of a lifetime, this is your opportunity. Kegler will be partnering with the La Romita School of art who has been bringing people to the Umbria region of Central Italy to participate in its art workshops for over 50 years! The school is housed in an exquisitely renovated sixteenth century Capuchin monastery surrounded by olive groves. They will host his all inclusive workshop bringing their decades-long expertise to make this a truly unique, intimate, and authentic Italian experience. You just bring your personal art supplies and enthusiasm. This workshop is catered for artists of all skill levels from very beginners to professionals. Kegler will cover all aspects of landscape painting from the initial concept sketches, field studies done “en plein air”, and studio composition approaches. Although he will work in oil, pencil, watercolor and pastel artists are most welcome to participate. You can work at your own pace, whether it be slow and meditative, or more immersive and driven. The workshop runs from August 19th - August 29th, 2025. Please visit the website for more information and to sign up. This will be a small group and spaces are limited, so please reach out soon! https://thomaskegler.com/classes/italy/?mc_cid=e2e7c746ac&mc_eid=961c5434cf New Skill-Based Art Post Published on 26 February, 2025 Skill-Based Art: A Learning Resource for Art Students & Artist-Teachers have recently published a text interview on their brand new website with American painter, D. Jeffrey Mims. The interview covers Mr. Mims’ biography and includes images of his drawings and paintings. Totaling over 13,000 words in length, the interview is the most comprehensive document currently available on the artist’s life and work. Follow the link below to read the interview: https://www.skillbasedart.com/d-jeffrey-mims/ View all news blogs RSS Atom Museum Learn More » The ARC Museum is the largest online museum dedicated completely to realist art work. It contains tens of thousands of images by thousands of artists and includes works by 19th century and old master artists through our general search pages, as well as 21st century realist works by our ARC Affiliated ArtistsSM. News Learn More » Our news section consists of two parts, the first being our News Blog where we post daily to keep our viewers informed on relevant topics about realist art and the second is our Events Calendar which is an interactive calendar listing of all the exciting realist art events taking place around the world including: exhibitions, lectures, open houses, competitions, artist demonstrations, video and podcast releases, publication releases, enrollment dates and more. The calendar can also be viewed in three ways, as a calendar, a general listing, or as a world map. Education Learn More » As a non-profit educational foundation, education is one of our primary goals. Here is where you can find our ARC ApprovedR School listing, ARChives where we have our articles, letters and more, The Da Vinci Initiative which focuses on skill-based learning in K-12 classrooms, artist interviews, artist demonstrations, podcasts, self help books and more. About Us Learn More » Find out more about the ARC and its staff. Learn about our mission and ARC philosophy. Find information on ARC Allied Organizations and how to contact us. Competitions Learn More » View the results of past and current ARC competitions or submit your entries here. The ARC holds two types of competitions. The ARC Scholarship Competition, held every May, gives thousands of dollars in direct financial aid to students attending ARC ApprovedR Schools. The International ARC Salon, the most prestigious realist art competition in the Americas and perhaps the world, offers over $100,000 in cash awards and International recognition through partnerships with prestigious magazines, galleries, museum exhibitions, and a strong online presence. Store Learn More » Help support the ARC by purchasing fine art prints, books, DVDs, or more. Here you will also find information on image usage and advertising rates. 🎂 Born on this day Ludwig Hans Fischer (1848-1915) Walter King Stone (1875-1949) Leon Schulman Gaspard (1882-1964) 💀 Died on this day Carl Gustav Pilo (1711-1793) William Andrews Nesfield (1793-1881) Stanhope Alexander Forbes (1857-1947) Recent additions to the website View all recent additions. RSS Atom February 28, 2025 Added Albatros by Carlos Schwabe. Added Stürmische Meeresbucht by Karl Wilhelm Diefenbach. Added Sterbender Hirsch by Karl Wilhelm Diefenbach. Added Sphinx By the Sea by Karl Wilhelm Diefenbach. Added Kapelle des Priors by Karl Wilhelm Diefenbach. Added Ecce Homo by Karl Wilhelm Diefenbach. Added Bildnis Richard Wagner by Karl Wilhelm Diefenbach. Added The Storm, Capri by Karl Wilhelm Diefenbach. Added Sunset on the coast of Capri by Karl Wilhelm Diefenbach. Added Sphinx by Karl Wilhelm Diefenbach. Added Solitude by Karl Wilhelm Diefenbach. Added Selbstporträt als Christus by Karl Wilhelm Diefenbach. Added Seagulls in a stormy bay by Karl Wilhelm Diefenbach. Added Pizzolungo, Capri by Karl Wilhelm Diefenbach. Added Martyr and Crucified, Son Helios by Karl Wilhelm Diefenbach. Added Helios in Hiking Attire by Karl Wilhelm Diefenbach. Added Coastal Road near Sorrento-Amalfi by Karl Wilhelm Diefenbach. Added Capri by Karl Wilhelm Diefenbach. Added Capri by Karl Wilhelm Diefenbach. Added Capri by Karl Wilhelm Diefenbach. February 27, 2025 Added Painting the Italian Landscape – 10 Day Workshop with Thomas Kegler to the ARC Blog. Added a new image of The Fairy Dance by Karl Wilhelm Diefenbach. Added a new image of Portrait of Man with Labyrinth on Chest by Bartolommeo Veneto. February 26, 2025 A