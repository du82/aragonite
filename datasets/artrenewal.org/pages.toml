["https://artrenewal.org/Blog/Index/10813"]
title = "18th International ARC Salon Competition Begins Saturday - Art Renewal Center"
full_description = "18th International ARC Salon Competition Begins Saturday Published on February 28, 2025 When talking about competitions dedicated to 21st Century Realism, the Art Renewal Center’s International ARC Salon® is the largest in the world, receiving over 5,000 entries from 87 countries last competition. It is no wonder why artists are entering. With over $130,000 in cash awards and international recognition through the ARC website which receives over 2,000,000 visitors annually, the ARC Salon also offers career changing opportunities through partnerships with prestigious magazines, museums, galleries and more. Don’t miss your chance to compete! Categories include: Figurative, Portraiture, Imaginative Realism, Drawing, Landscape, Still Life, Plein Air Painting, Fully From Life, Sculpture, Animals, and a special category for teens. Click here to enter the 18th ARC Salon competition."
