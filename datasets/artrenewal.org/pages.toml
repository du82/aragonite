title = "Bouguereau Book Grant - Art Renewal Center"
full_description = "ARC is pleased to announce that 100 two volume sets of the Bouguereau Biography and Catalogue Raisonné are being donated to ARC approved ateliers, reference libraries, and museums, so that art students and art lovers around the world will have access to this monumental book. The book itself is the conclusion of a 30 year effort by a small determined team of 19th Century Art experts. The Catalog Raisonné which was jointly published by the Art Renewal Center® and the Antique Collectors Club, is a two-volume boxed set which illustrates the complete oeuvre of this great master, including information on all of William Bouguereau's 828 known paintings, as well as the entire 600 page biography written by Damien Bartoli, with Fred Ross, ARC Chairman and President of the Bouguereau Committee. The huge scope of Bouguereau's work was immensely famous and popular in his own time and then was suppressed for nearly a century, resurfacing in 1980 when the Met hung 2 of his works. His popularity has gained momentum steadily ever since, and today he is widely recognized as the most popular and beloved of the Academic artists who preceded Impressionism. His diverse work spans monumental religious and mythical compositions, but most beloved are his deeply touching scenes exploring the depths of human emotion from early childhood through young adulthood. His poetic renderings of the psychology of youth are married to impeccable technical perfection, found in an unparalleled number of original and powerful masterpieces. Below is a list of all book donations to date, we still have 22 left to go out and are currently compiling a list of Libraries and Museums that are still missing this monumental work: Two-volume second edition of the William Bouguereau Biography and Catalogue Raisonné. Buy Now Academy of Realist Art, Boston MA Academy of Realist Art, Toronto Adrian Gottlieb Studio & Atelier Angel Academy of Art Ani Art Academy Waichulis Aristides Classical Atelier Ate