["https://artrenewal.org/AtelierApplication/Introduction"]
title = "Atelier Application - Art Renewal Center"
full_description = "Thank you for your interest in joining the Art Renewal Center® and ARC Approved® Atelier and School listing. The ARC is the foremost and only vetting service for skill-based visual art schools since 2002. In order to bring realist art back into the mainstream of society it is imperative that young artists are properly trained. It is a well-known fact that few, if any, of the college and university art departments of today are able to provide the kind of genuine art instruction sought by ever-growing numbers of students and aspiring young artists. The Art Renewal Center recognizes the importance of providing information on ateliers, academies, schools and private instructors dedicated to the teaching of art in the traditional manner. One of the ARC's main objectives is to ensure that ARC Approved® ateliers and academy schools continue to grow and prosper as the future of the fine arts is in the hands of the artists and teachers of today and of the next generation. The ARC has awarded over $350,000 in scholarships to students attending approved programs through our annual scholarship competition, and over $2,000,000 as a whole in scholarships, grants and prizes to date. We are scheduled to give out another large sum this year. At our ARC Approved® schools, we know these methods are still taught by some of the greatest artists alive today and the students who are the recipients of these scholarships will receive the training necessary to create great works of art and carry the knowledge to the next generation. To our delight most ARC Approved® schools have reported sizable increases in enrollment. Our first schools have reported as much as a 2500% percent increase in their enrollment since their listing appeared on the ARC website in 2002. Standards for ARC Approved® Schools and Ateliers Read more about the criteria that need to be satisfied for your school to become an ARC Approved® School. Benefits of Joining A listing on our page of ARC Approved Schools® and on our interactive ARC Approved School Map The ability to update your section via our website interface (this includes contact information, faculty information, images, school description, course curriculum, etc.) The ability to add events to our ARC Events Calendar (this includes workshops, exhibitions, open houses, lectures, competitions, deadlines for enrollment, etc.) The ability to announce exhibitions, open houses, artist demos and other non-workshop or enrolment events at no additional charge in our blog, social media and weekly newsletter that goes out to over 30,000 registered ARC Members (one announcement per event). There is an option to pay for workshop and enrolment announcements as well as multiple announcements for the same event in our blog/social media/newsletter, which we only allow for ARC Approved® institutions. All events can be added to our calendar at no charge. Students enrolled at ARC Approved Schools® can compete in our annual ARC Scholarship Competition where we award $30,000 to talented students each year for further studies at ARC Approved Schools® Free access to all the high-resolution images in the ARC Museum For an additional $500 a year, works on your school page can be marked as being for sale. (interested individuals will be able to click to send an email directly to you to inquire about the painting. ARC takes no commission on actual sales and works for sale is a search option on the ARC museum artworks search page). ARC Approved Schools will be mailed a frameable certificate each year accrediting the school as meeting the ARC standards of approval once membership dues for the current calendar year have been received. A certificate to hang in your school with the ARC Approved designation. An ARC Approved Seal to Place on your website. Mandatory Fees $250 application fee $250 one time set up $350 annual membership Optional Services $190 – A single workshop announcement or an additional announcement for other events in our blog, social media and weekly newsletter that goes out to over 30,000 registered ARC Members every week $500 – The ability for a 12 month period to mark works on your school page as being available for sale. Interested individuals will be able to click to send an email directly to you to inquire about the painting. ARC takes no commission on actual sales and works for sale is a search option on the ARC museum artworks search page. $650 – A one month ad campaign where an ad for your school will appear in our newsletter for four consecutive weeks. The ad will also appear on the ARC ad bar which pops up on our main pages as well as on the ARC Approved Schools® page. (Ad must be provided.) $1,600 - A three month ad campaign where a provided ad for your school will appear in our newsletter for 12 consecutive weeks. The ad will also appear on the ARC ad bar which pops up on our main pages as well as on the ARC Approved Schools® page. (Ad must be provided and can be changed once every four weeks.) $2,900 – A six month ad campaign where a provided ad for your school will appear in our newsletter for 12 consecutive weeks. The ad will also appear on the ARC ad bar which pops up on our main pages as well as on the ARC Approved Schools® page. (Ad must be provided and can be changed once every four weeks.) $5,500 – A 12 month ad campaign where a provided ad for your school will appear in our newsletter for 52 consecutive weeks. The ad will also appear on the ARC ad bar which pops up on our main pages as well as on the ARC Approved Schools® page. (Ad must be provided and can be changed once every four weeks.) * All items submitted are posted on ARC at ARC’s sole discretion. ARC reserves the right not to place any information or images on the website which it deems inappropriate or not in the artists best interests, and to edit submitted materials. Start"
