["https://artrenewal.org/Education/AudioVisual"]
title = "Videos & Podcasts - Art Renewal Center"
description = "Seattle-based artist, Juliette Aristides, provides and lecture and demonstration of drawing and painting at the LCSC Center for Arts & History on January 18, 2013 to compliment her exhibition Allegories with Sacred Cannon."
full_description = '''Take a look at the many "Artist Demos" and "Artist Interviews" that our ARC Affiliated Artists™ and ARC Approved Schools™ have posted on Youtube. We have collected them here on the ARC website. Also, check out our "Podcasts" section with some of the original ARC podcasts as well as podcasts created by some of our ARC Allied Organizations™. Click on the appropriate tabs to view these different sections. Artist Interviews Artist Demos Podcasts Michael John Angel: The Academic Process Part 1 Part 2 Part 3 Michael John Angel from Angel Academy of Art, Florence, describes the history and course of training involved in becoming a traditional realist painter. Igor Babailov Igor Babailov teams up with Steven Spielberg to launch the Starlight Starbright Foundation's chapter in Tokyo, Japan. Commissioned to paint the portrait of Japanese film director Akira Kurosawa. Igor Babailov Interview with the renowned portrait artist Igor Babailov, famous for his official portraits of business, political leaders, celebrities and his beautiful portraits of children. Dario Campanile Interview with Dario Campanile. Dario Campanile Dario Campanile, fine artist born in Rome, Italy, hosts Lahaina Galleries' Art of Aloha party in January, 2014. He tells a captivating story about his mandatory stint in the Roman Army before he moved to the United States. Donald Clapper Interview with Donald Clapper preview for his painting for the International Guild of Realism. Jacob Collins Jacob Collins, one of America's most extraordinary artists of our time, sits down with Fine Art Connoisseur's Editor Peter Trippi, for a conversation about art and life. Angela Mia De La Vega Interview with Angela Mia De La Vega. Mary Jane Q Cross Well known NH Artist, Mary Jane Q. Cross, talks about her work, a disabling injury that almost ended her career and a documentary about her life. Mary Jane Q. Cross Mary Jane Q. Cross, Her Story, an interview with the artist. Mary Jane Q. Cross Mary Jane Q. Cross documentary. Virgil Elliot Interview with Virgil Elliot Martin Eichinger Romantic, Narrative sculptor Martin Eichinger shares his philosophies and techniques on sculpting award-winning figurative art. Peter Fiore Landscape artist, Peter Fiore is interviewed by Ron Brown at the Banks Gallery. They discuss everything from Peter's landscape painting to life as an artist. Video by Paul Fiore. Peter Fiore Peter Fiore discuses the inspiration for his series of paintings, The White Pine Suite with a quick look at him creating Enlightened one painting from the series. Filmed and edited by Sam Mordenga. Max Ginsburg Max Ginsburg gives his retrospective address at the Butler Institute of American Art. Daniel Graves Daniel Graves from The Florence Academy Of Art. James Gurney The making of Dinotopia by James Gurney. Steven Hanks Artist Steven Hanks promotes his book Moving On on Alberta's CTV. Steven Hanks Steven Hanks talks about his art. Ted Seth Jacobs Interview with Ted Seth Jacobs, a renowned artist and instructor dedicated to passing on his knowledge to future generations. He has taught some of America's finest painters including Anthony Ryder, Michael Grimaldi, Jacob Collins, Patricia Watwood, and Sadie Valeri. The interview takes place in France at the artist's home. Debra Keirce Debra Keirce, fine artist, realistic paintings that invite you to look closer. A video about her and her work. Scott Kennedy Scott Kennedy, discusses some of his artwork and inspirations. Urban Larson Interview with Urban Larson. Jeremy Lipking Interview with painter Jeremy Lipking for Artists on Art. Richard MacDonald Meet the artist Richard Macdonald. Frank Mason Classic scenes of Frank Mason expounding on Velasquez and seventeenth century Spanish painting. Frank Mason Maestro Films is pleased to announce the upcoming release of the feature length documentary, A Light in the Dark:The Art & Life of Frank Mason. Classical and contemporary art collide as this in-depth examination reveals New York painting master, Frank Mason, and takes us on a beautiful journey through the world of traditional art. Vala Ola Discussion of Vala Ola's compositional choices for her sculpture, Falling in Love. Thomas Reis Alumni Spotlight: artist Thomas Reis '88 Discusses His Methods and Inspiration Kirk Richards Kirk Richards explains how he gets from a plein-air study to a finished painting. Cesar Santos Cesar Santos 2013 Alumni Hall of Fame Inductees Miami Dade College Visual Arts interview. Cesar Santos Cesar Santos Restless Career - news interview. Cesar Santos Cesar Santos - del Mar College Lecture (Syncretism). Nelson Shanks Nelson Shanks: An Artist's Journey - Interview. Nelson Shanks Nelson Shanks The Portrait As Fine Art. Nelson Shanks, world-renowned painter, art historian, art teacher, connoisseur and collector, distilled the principles upon which Studio Incamminati stands from his lifelong experience and devotion to fine arts. Studio Incamminati is located in Philadelphia, Pennsylvania. Nelson Shanks Nelson Shanks at Russia Exhibition, 2011. Nelson Shanks Painter Nelson Shanks has been called America's pre-eminent realist painter. A recipient of the Commonwealth of Pennsylvania Distinguished Arts Award, the state's highest recognition for achievement in the arts, Shanks has painted many of the iconic figures of our age, including Pope John Paul II, Princess Diana, Margaret Thatcher, Luciano Pavarotti, Ronald Reagan, and Bill Clinton. Jeremiah Stermer This is an interview from 2006 which was made during Jeremiah Stermer's art show running at that time. He had 50 new original oils in that show. There was also an article in the Baltimore news paper pertaining the show and how his NDE out-of-body experience delightfully affected his work and creativity. Dan Thompson The Great Nude is in Miami at the R.A.M. Miami show, an ambitious collection of accomplished representational artists from all around the country. TGN Director Jeffrey Wiener interviews the artist Dan Thompson and Miami City Ballet ballerina Deanna Seay on the experience of producing a portrait on location at the Miami City Ballet. Morgan Weistling Indian Stories is the second Prix De West Purchase Award for California based artist Morgan Weistling. News interview. Juliette Aristides Seattle-based artist, Juliette Aristides, provides and lecture and demonstration of drawing and painting at the LCSC Center for Arts & History on January 18, 2013 to compliment her exhibition Allegories with Sacred Cannon. Juliette Aristides The introduction to a wonderful book and its companion DVD Lessons in Classical Drawing by Juliette Aristides. An excellent practical resource on the techniques of the old masters. Jacob Collins Extra unseen footage from Jacob Collins painting in Hunter, NY. Ed Copley ASTA founder and modern day old master artist Ed Copley shares some of his technique, working with a live model. Philippe Faraut Sculpting demo by Philippe Faraut. Philippe Faraut Philippe Faraut sculpting demo. The effect of methamphetamines on a face sculpted in water-based clay made as a tool for D.A.R.E. This sculpture was originally created for the artist's young daughters to show some of the effects of drug abuse. The lesions and more graphic aspects were deliberately not depicted. Philippe Faraut Techniques of Sculpture: Geometry in the Clay Portrait, by Philippe Faraut. Peter Fiore Landscape artist, Peter Fiore, paints a study of a winter field from his Landscape a Day series. Edited by Sam Mordenga. Daniel Gerhartz A clip from the 6-Hour painting demonstration of Daniel Gerhartz, Her Mother's Locket available for purchase ON DEMAND. As an extra bonus, there are hi-res closeups of the painting so you can view while watching the demonstration. Gerhartz creates one of his stunning masterpiece's from start to finish in his home studio in Wisconsin. Donato Giancola Donato Giancola using reference images to create an imaginative realist work of something that does not exist in real life. Max Ginsburg Max Ginsburg, Legacy of an American Painter, Streamline Art Video painting demo. Daniel E. Greene Daniel E. Greene demo and lecture. James Gurney James Gurney's How I Paint Dinosaurs DVD promotional video. James Gurney The James Gurney YouTube channel, where you can find lots more videos by and featuring James Gurney. Thomas Kegler Thomas Kegler painting demo. Excerpts from Painting en Plein Air DVD parts one through ten. Erik Koeppel Techniques of the Hudson River School Masters with Erik Koeppel, Streamline Art Video. Judith Pond Kudlow The Realist Sight-Size Method with Judith Kudlow for an introduction to realism and the sight-size method working from a still-life set up. Harlem Studio: NYK Academy. Jeffrey Larson The trailer for a demonstration and interview video of Jeffrey T. Larson, fine artist from Wisconsin. Rob Liberace Rob Liberace demos an alla prima portrait on the first day of his workshop, The Painterly Sketch: Advanced Alla-Prima Portrait. In part 1, Rob starts with a basic underpainting in browns and blacks. Rob Liberace Rob Liberace describes the anatomy of the arm while drawing the "flayed" view which shows the muscles and tendons as they would appear under the skin. He uses a three color chalk technique to create "ecorche" drawings of both the front and back of the arm and hand. Rob Liberace Free yourself from stiff renderings of the human form and find the confidence to create your own representation of the model. Join renowned artist Rob Liberace for a fast-paced yet comprehensive lesson in figure drawing as you learn how to keep your pieces lively and powerful with essential instruction in this exciting new guide. DVD excerpt from American Artist. Rob Liberace This video shows clips from Rob Liberace's drawing DVD, Anatomy: The Torso. Rob Liberace Painting the Figure in Grisaille: DVD excerpts. This clip shows clips from the dvd by artist Rob Liberace. A grisaille is a monochromatic (limited color) painting. Richard MacDonald Jordi Caballero dances for master sculptor Richard MacDonald in Monterey, California as he models in his studio. Richard MacDonald Time-lapse footage of a week of work in the studio of Sculptor Richard MacDonald. Richard MacDonald Richard MacDonald captures the strength, beauty, and grace of the performers from Cirque du Soleil in this video. Richard MacDonald Richard MacDonald sculpting Transcendence. Pietro Annigoni There is a five-minute BBC film from 1961. In it, we see Annigoni preparing his tempera and then painting with it. Lance Richlin Time lapsed demo of Lance Richlin at work. These podcasts feature lectures, interviews, and any other audio and video content that we think will appeal to Art Renewal Center members. This page contains notes about each show, images of artworks discussed in the podcasts, and links that will allow easy subscription to the podcast feed as well as the show notes feed. To subscribe to these you can click on the little orange buttons on the right. In order to subscribe you must have installed a "podcatcher" such as Apple's iTunes first. You don't need an iPod or a Macintosh to subscribe to podcasts and there's no charge to subscribe. If you just want to listen to individual podcasts without subscribing, just click on the "play" button associated with each podcast. Skill-Based Art: A Learning Resource for Art Students and Artist-Teachers Preserving the knowledge of the survival of realism in the twentieth century, Skill-Based Art: A Learning Resource for Art Students and Artist-Teachers conducts interviews and audio podcasts with artists who trained during the twentieth century, as they are the closest link we have to understanding more about nineteenth century studio practices. Visit the website to hear interviews with Katherine Lack, wife of the late twentieth century artist, Richard F. Lack, Kirk Richards, Allan R. Banks, Rob Gutteridge and more. This resource is a growing body of work being conducted by Emilio Longo, visual arts teacher and author. Suggested Donation Suggested Donation is a series of podcasts devoted to the arts in all forms. Hosted by two Contemporary Realist painters, Tony Curanaj and Edward Minoff, the conversations provide an insight into the creative mind. By speaking with both traditional and non-traditional artists and craftsmen, curators and restorers, they create a dialog through which we discover common ground across disciplines and spaces united by a love of and deep devotion to skill. To visit their website and listen to already published podcasts, which include interviews with ARC Living Masters™ Anthony Waichulis, Jacob Collins, and Patricia Watwood, click here. The Sculptor's Funeral The Sculptor's Funeral is the only podcast dedicated to student and professional figurative sculptors living and working today. Hosted by American sculptor Jason Arkles and produced in Florence, Italy, The Sculptor's Funeral discusses significant sculpture and sculptors throughout the Western European figurative tradition, analyses historical and current events relating to the production of sculpture and the culture in which it is made, plus the occasional interview with living sculptors and discussions about technical processes, techniques, and issues of a three dimensional, representational nature. The podcast is a weekly series, each episode airing on Sunday Mornings (European time). The ten latest episodes are available for download on iTunes, Stitcher, and many other podcatchers, and anyone can listen to the complete archive for free (as always) at www.thesculptorsfuneral.com. Why is Modern Art so Bad? For two millennia, great artists set the standard for beauty. Now those standards are gone. Modern art is a competition between the ugly and the twisted; the most shocking wins. What happened? How did the beautiful come to be reviled and bad taste come to be celebrated? Renowned artist Robert Florczak explains the history and the mystery behind this change and how it can be stopped and even reversed. Juliette Aristides Interview Download An html5-capable browser is required to play this audio. Juliette Aristides is an artist and the founder of the Classical Atelier Program at Gage Academy of Art in Seattle, Washington. She has taught there for the past six years and also gives workshops across the country. Her own work can be seen at John Pence Gallery in San Francisco. Juliette recently published a book on the training methods for drawing at traditional ateliers called Classical Drawing Atelier: A Contemporary Guide to Traditional Studio Practice. In addition to the material in this interview, Sherry Ross also wrote a review of the book on the ARC site. The teachers that Juliette mentioned included Myron Barnstone, Richard Lack, and Nelson Shanks. Juliette also mentioned a book titled The Force of Visual Perception by Rudolph Arnheim. I was unable to locate that book though I did find two others by the same author: Art and Visual Perception: A Psychology of the Creati'''
year_published = 2025
