full_description = '''At ARC, we view our scholarship program as one of the most important. In order for future generations to produce great art, we must not lose the accumulated knowledge of the last several centuries. At our ARC Approved™ atelier schools, we know these methods are still taught by some of the greatest artists alive today and the students who are the recipients of these scholarships will receive the training necessary to create great works of art and carry the knowledge to the next generation. The ARC Awards $30,000 a year to students attending ARC Approved Schools™ to aid with their continued education. Please donate to the ARC Scholarship Fund to help us reach our $30,000 yearly goal. Apply for the ARC Scholarship View The Art Renewal Center® (ARC) will award $30,000 to talented students attending ARC Approved® schools through the 24th annual ARC Scholarship Competition. Applications will be accepted from May 1 – May 31, 2024. 24th ARC Scholarship Results (2024) View The ARC Scholarship Fund distributes $30,100 in direct scholarships to aid students at ARC Approved® art academy and atelier schools. 23rd ARC Scholarship Results (2023) View The ARC Scholarship Fund distributes $27,500 in direct scholarships to aid students at ARC Approved® art academy and atelier schools. 22nd ARC Scholarship Results (2022) View The ARC Scholarship Fund distributes $31,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 21st ARC Scholarship Results (2021) View The ARC Scholarship Fund distributes $30,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 20th ARC Scholarship Results (2019) View The ARC Scholarship Fund distributes $30,500 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 19th ARC Scholarship Results (2018) View The ARC Scholarship Fund distributes around $30,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 18th ARC Scholarship Results (2017) View The ARC Scholarship Fund distributes over $30,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 17th ARC Scholarship Results (2016) View The ARC Scholarship Fund distributes over $30,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 16th ARC Scholarship Results (2015) View The ARC Scholarship Fund distributes over $30,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 15th ARC Scholarship Results (2014) View The ARC Scholarship Fund distributes over $30,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 14th ARC Scholarship Results (2013) View The ARC Scholarship Fund distributes over $32,500 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 13th ARC Scholarship Results (2012) View The ARC Scholarship Fund distributes over $31,700 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 12th ARC Scholarship Results (2011) View The ARC Scholarship Fund distributes $31,400 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 11th ARC Scholarship Results (2010) View The ARC Scholarship Fund distributes $30,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 10th ARC Scholarship Results (2009) View The ARC Scholarship Fund distributes $30,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 9th ARC Scholarship Results (2008) View The ARC Scholarship Fund increases to $30,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 8th ARC Scholarship Results (2007) View ARC doubles Scholarships this year with over $20,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools, and continued its tradition of making purchase awards from winners. 7th ARC Scholarship Results (2006) View The ARC Scholarship Fund distributes $10,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools, plus an additional $31,400 in Purchase Awards of works of art created by students attending these schools. 6th ARC Scholarship Results (2005) View The ARC Scholarship Fund distributes $10,250 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 5th ARC Scholarship Results (2004) View The ARC Scholarship Fund distributes $10,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools, plus an additional $8,850 in Purchase Awards of works of art created by students attending these schools. 4th ARC Scholarship Results (2003) View The ARC Scholarship Fund distributes $11,200 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 3rd ARC Scholarship Results (2002) View The ARC Scholarship Fund distributes $10,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. 2nd ARC Scholarship Results (2001) View The 2nd ARC Scholarship Competition for 2001, the ARC Scholarship Fund distributes $6,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier Schools. An additional $3,000 has been given in the form of a Purchase Award to one of the students attending an ARC Approved School™. 1st ARC Scholarship Results (2001) View The ARC Scholarship Fund distributes $8,000 in direct scholarships to aid students at ARC Approved™ art academy and atelier schools. h2 { font-family: "Oswald"; } p { font-family: 'Raleway-Regular'; font-size: 1.5em; }'''
