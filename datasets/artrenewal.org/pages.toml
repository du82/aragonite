["https://artrenewal.org/Salon/Home"]
title = "Salons - Art Renewal Center"
full_description = '''18th ARC Salon Prospectus View We Are Now Accepting Entries to the 18th International ARC Salon Competition. Semi-finalists will be announced September 17th, 2025. Finalists will be announced November 5th, 2025. Winners will post January 5th, 2026. Best of luck to all of our competitors! 17th International ARC Salon (2024) View The Art Renewal Center® is pleased to present the winners and finalists of the 17th International ARC Salon Competition! This year the ARC received over 5,000 entries from 87 countries. 213 awards and honorable mentions have been given out. 16th International ARC Salon (2022) View The Art Renewal Center® is pleased to present the winners and finalists of the 16th International ARC Salon Competition! This year the ARC received over 5,400 entries from 75 countries. 221 awards and honorable mentions have been given out. 15th International ARC Salon (2020-2021) View The Art Renewal Center® is pleased to present the winners and finalists of the 15th International ARC Salon Competition! This year the ARC received 4,941 entries from 83 countries. 208 awards and honorable mentions have been given out. 14th International ARC Salon (2019-2020) View The Art Renewal Center® is pleased to present the winners and finalists of the 14th International ARC Salon Competition! This year the ARC received over 4,300 entries from 73 countries. Our finalists represented here today constitute approximately 35% of works submitted, just over 1500 works. 13th International ARC Salon (2017-2018) View ARC is pleased to present the winners and finalists of the 13th International ARC Salon Competition. This year we had over 3,750 entries from 69 countries. Our finalists represent approximately 28% of entries. 12th International ARC Salon (2016) View ARC is pleased to present the winners and finalists of the 12th International ARC Salon Competition. This year we had over 3,100 entries by an approximate 1,300 artists from 63 countries. We have selected 1,006 finalist works by 640 artists, representing 32% of works submitted. 11th International ARC Salon (2014-2015) View ARC is pleased to present the winners and finalists of the 11th International ARC Salon Competition with an approximate 2,500 entries this year by over 1,050 artists. This year we have included 789 finalist works. These works represent the top 31% of works submitted. 10th International ARC Salon (2013-2014) View ARC is pleased to present the winners of the 10th International Salon Competition. With an approximate 2,200 entries this year by over 1,000 artists, the 2013/2014 ARC Salon competition was more competitive than ever. This year we have accepted 685 finalists, which are the top 31% of works submitted. 9th International ARC Salon (2012-2013) View ARC is pleased to present the winners of the 8th International Salon Competition. With an approximate 2,000 entries this year by over 850 artists, the competition was steeper then ever. Even with an additional category, and expanding our finalist cut up to the top 600 entries, the finalists only include the top 30% of works submitted. 8th International ARC Salon (2011-2012) View ARC is pleased to present the winners of the 8th International Salon Competition. This was our largest turnout yet with over 2,100 entries and over 800 artists participating. There were a large number of high quality works that did not make it into the finals. This was true even after extending the original 300+ expected finalist pieces to over 500. Out of the 802 artists only 359 are represented here, less then half, and only 25% of the total submitted works are shown. 7th International ARC Salon (2010-2011) View ARC is pleased to present the winners of the 7th ARC Salon Competition. Picking finalists this year was harder than ever and we are confident that our viewers will enjoy looking through the winners and finalists as much as we did. In fact, we were so impressed by the wide variety of works, that we have decided to add a few new awards to next year's salon such as: Most Beautiful, Best Social Satire, Best Portrait, Most Ambitious, and perhaps a few others. In total, our number of finalists is up 16% from last year. 6th International ARC Salon (2009-2010) View The Art Renewal Center® is proud to present the award winners and finalists in our 6th International ARC Salon™ Competition. This year we had well over 1,700 entries with outstanding results. Together with 3 Awards in each of the 6 Categories, plus the addition of 4 Chairman's Choice Awards and 5 ARC Staff Awards and Purchase Prize Awards, the allotted prize amount in this year's ARC Salon™ has totaled more than $80,000. 5th International ARC Salon (2008-2009) View The Art Renewal Center® is proud to present the award winners and finalists in our 5th International ARC Salon Competition. This year we had well over 1,600 entries from 30 different countries. Once again the quality of work submitted to this year's competition is living proof that the great traditions of representational painting, drawing and sculpture are alive and those who would seek guidance can find the support and tutelage necessary to master them. 4th International ARC Salon (2007) View The Art Renewal Center® is proud to present the award winners and finalists in our 4th International ARC Salon™ Competition. This year we had 1,643 entries by 596 artists. We are encouraged by the quality of work submitted in this year's competition, in fact the judges had the hardest time ever selecting the winners. 3rd International ARC Salon (2006) View The Art Renewal Center® is proud to present the award winners and the top 100 finalists in our 3rd International ARC Salon™ Competition. This year we continued our pattern of growth with over 1,600 entries, and a significant increase in the number of participants as well. ARC is encouraged by the quality of work submitted in this year's competition. 2nd International ARC Salon (2005) View The Art Renewal Center® takes great pride in presenting the Award Winners and Top 100 Finalists from our 2nd International ARC Salon™ Competition. With nearly 1,500 entries received from 30 countries around the world, this year's competition has proved to be a true International event and we rightly believe that this may be the finest competition since the Paris Salons before World War I. 1st International ARC Salon (2004) View The Art Renewal Center® takes great pride in presenting the winners of the 1st International ARC Salon Competition. There has been an overwhelming response to the competition, as the ARC received well over 1,100 entries from all over the world. From the USA to China, the very best artists from over a dozen countries have enthusiastically participated. h2 { font-family: "Oswald"; } p { font-family: 'Raleway-Regular'; font-size: 1.5em; }'''
