["https://artrenewal.org/Education/Home"]
title = "Education - Art Renewal Center"
full_description = "As a non-profit educational foundation, education is one of our primary goals. Here is where you can find our ARC ApprovedR School listing, ARChives where we have our articles, letters and more. ARC Approved Schools Learn More The Art Renewal CenterR is the foremost entity for researching and vetting art schools that teach skill-based training techniques in the visual arts. For those interested in acquiring strong technical skills in the visual arts, ARC ApprovalR holds more weight than college or university accreditation, where for the vast majority, technical drawing, painting, and sculpting skills are not the priority. ARC is known for keeping the highest standards in art education, only approving those schools who teach solid, skill-based training methods, which increase visual literacy. ARChives Learn More Explore the ARC database of articles including scholarly works, editorials, reviews, ARC Letters, and the original ARChives which are many of the original posts from the Good Art Group which led to the formation of the ARC. Videos & Podcasts Learn More Take a look at the many Artist Demos and Artist Interviews that our ARC Affiliated ArtistsR and ARC Approved SchoolsR have posted on Youtube. We have collected them here on the ARC website. Also, check out our Podcast section with some of the original ARC podcasts as well as podcasts created by some of our ARC Allied OrganizationsR. Artist Self-Help Books & DVDs Learn More On this page you will find books and DVDs designed to help artists in school and at home improve their skills. This selection will be of use to artists from beginner to advanced levels and help build the foundations and perfect the technical skills that are necessary to create and understand art. Bouguereau Book Grant Learn More ARC is pleased to announce that 100 two volume sets of the Bouguereau Biography and Catalogue Raisonné are being donated to ARC approved ateliers, reference libraries, and museums, so that art students and art lovers around the world will have access to this monumental book. Here you can find a listing of these donations to date."
