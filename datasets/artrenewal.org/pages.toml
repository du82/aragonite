full_description = "Welcome to the largest on-line museum dedicated solely to realist works of art. The ARC Museum features tens of thousands of images by thousands of artists. Choose from our options below to search the ARC Museum to discover works by 19th century and old master artists or visit our Museum of ARC Affiliated Artists which features works by ARC Living Masters, ARC Associate Living Masters, and ARC Living Artists. All of whom are dedicated to creating high quality 21st century realist works of art. Search ARC Museum Search The ARC Museum features tens of thousands of images by thousands of 19th century and old master artists. Explore the collection with three different search options, Artists, Artworks, or Museums. Choose to view your search results in a list, grid, or for artists with 15 or more works in known collections, on a world map. ARC Affiliated ArtistsTM Search The Art Renewal Center® has pulled together an energetic, optimistic and brilliantly talented base of ARC Affiliated Artists™, that makeup our ARC Living Artist and Master's Gallery™. As true masters in the visual arts, they are training and inspiring the next generation of artists, scholars and teachers, to protect, preserve and perpetuate traditional techniques and training with 21st century human subject matter."
