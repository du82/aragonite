title = "About Us - Art Renewal Center"
full_description = "Mission Statement View The ARC is devoted to promoting education in realistic art both in training techniques and in the proliferation of historical art works. Read about the eight goals of our organization to learn more. ARC Philosophy View The ARC Philosophy, written by ARC Chairman, Frederick C. Ross, delves into the significance of realistic artworks and what they mean to humanity as a whole. Learn how art is a universal language and how to tell the difference between a work of art that is successful and one that falls short. Staff View Meet the ARC Staff and see who helps make ARC happen. Allied Organizations View To better accomplish our mission and return realism and skill based training back to the visual arts, we have started to ally ourselves with like minded organizations in the hopes that through our joint efforts, we will be more successful at bringing realist art back to the world at large. ARC Art Gallery List View The one thing all these galleries have in common is that they support 21st Century Representational Art and include works by living artists who paint and/or sculpt in the traditional method. Frequently Asked Questions View See the answers to our most frequently asked questions. Terms and Conditions View Please read the terms and conditions of using the ARC website. Privacy Policy View Please read ARC's Privacy Policy. Contact Us View Contact our Administrators and Staff at the ARC."
