title = "Painting the Italian Landscape – 10 Day Workshop with Thomas Kegler - Art Renewal Center"
full_description = "Painting the Italian Landscape – 10 Day Workshop with Thomas Kegler Published on February 27, 2025 If you have ever dreamed of an affordable way to partake in a painting trip of a lifetime, this is your opportunity. Kegler will be partnering with the La Romita School of art who has been bringing people to the Umbria region of Central Italy to participate in its art workshops for over 50 years! The school is housed in an exquisitely renovated sixteenth century Capuchin monastery surrounded by olive groves. They will host his all inclusive workshop bringing their decades-long expertise to make this a truly unique, intimate, and authentic Italian experience. You just bring your personal art supplies and enthusiasm. This workshop is catered for artists of all skill levels from very beginners to professionals. Kegler will cover all aspects of landscape painting from the initial concept sketches, field studies done “en plein air”, and studio composition approaches. Although he will work in oil, pencil, watercolor and pastel artists are most welcome to participate. You can work at your own pace, whether it be slow and meditative, or more immersive and driven. The workshop runs from August 19th - August 29th, 2025. Please visit the website for more information and to sign up. This will be a small group and spaces are limited, so please reach out soon! https://thomaskegler.com/classes/italy/?mc_cid=e2e7c746ac&mc_eid=961c5434cf"
