["https://artrenewal.org/Article/Title/the-philosophy-of-arc"]
title = "The Philosophy of ARC by Fred Ross - Art Renewal Center"
description = "Founder and Chairman of the Art Renewal Center, Ross is the leading authority on William Bouguereau and co author of the recently published Catalogue Raisonné William Bouguereau: His Life and Works."
full_description = '''The Philosophy of ARC Why Realism? by Fred Ross Published on - Introduction Fine art at its best has the power to move one to tears, or grab your sensibilities and rivet you in the moment with an overwhelming sense of beauty and excitement. People often report the sensation of cold chills going up and down their spine. It may be the rare work that accomplishes this, but for those who have had this experience, many have credited it as the stimulus that set them on a personal lifetime quest; whether as an artist, collector or art historian. Other human activities can create a similar experience, whether in poetry, literature, dance, theatre, or music, but it is the experience of beauty in fine art and beauty and its relationship to fine art that is the focus of this essay. If you are reading this, in all probability you are one of the millions of art lovers who in the 21st Century are disillusioned with the Modernist paradigm which for more than a century has been the dominant way the concept of art has been taught and presented in nearly all institutions of higher learning throughout the world. If you are like us, it seems more than a little self-evident to you that works of art have infinitely more to say and communicate if they portray the real world, or use figures and objects from the real world even when portraying fantasies and dreams. You experience such "realist" works as infinitely more successful than any Modernist works. The success of Modernism seems like a form of mass insanity, a nightmarish anomaly from which we pray the art world will finally soon awake. For most of the 20th century, people who felt as we do, found themselves attracted to fine art in most if not all cases from having been to museums and fallen in love with a number of works of art created in the 15th through 19th centuries. You may have wanted to become an artist yourself and were channeled by advisors into fine art courses taught in the art departments of colleges and Universities where you were promptly told that your instincts were all wrong. That such works had a place in their time, but that modernist works were far superior. What followed was an attempt to change your attitudes and beliefs and to convince you that works, which commemorated the destructions of some aspect of what used to be traditional Realism were the only worthwhile artworks and concepts. You were never told that these "educators" had never themselves learned any of those skills needed by all artists during prior centuries, and so were completely bereft of any of the experience, skills and knowledge for which you had assumed your tuition bills would be paying. They made you believe that they all could draw and paint but had chosen to abandon those skills due to some great epiphany. 1 Pietro Annigoni (1910-1988) studied at the Academy of Fine Arts in Florence under Felice Carena drawing and painting) and Giuseppe Graziosi (sculpture). Felice Carena was born in 1880 and studied with G. Grosso (1860–1938) in Turin International [exhibition] 1933, Rockefeller Center: February 5 to 28. College Art Association of America Ives Gammell (1893-1981) studied with the American artist William Paxton (1869–1941) studied under Dennis Miller Bunker at Cowles Art School and then in Paris with Jean Leon Gérôme (1824–1904) who was a student of Paul Delaroche (1797–1859)and was influenced by Jean Auguste Dominique Ingres (1780 – 1867) (Encyclopaedia Britannica) If you were true to yourself and your feelings and beliefs, you probably left that "art" department and considered doing something else with your life. Many of you went into commercial art. Others became art historians, but most found other fields entirely. A rare few of you searched out and found one of a handful of ateliers who actually still taught the methods of the old masters. To the best of our knowledge there were 7 such ateliers in 1980 and all of them were taught by students of Pietro Annigoni or Ives Gammell 1. Both atelier masters could trace their training seamlessly to the 19th century and beyond. 2 View a listing of our ARC Approved Schools™. By 2002 when the Art Renewal Center decided to add to their website a section of ARC Approved® Ateliers schools the number of such schools had grown to 14 with each having between 5 and 15 students. We added a map of the world where it became very easy to identify all the schools and to find the nearest one to any local. Within a few months the numbers of students able to find these schools started to grow geometrically, and today, just 14 years later, there are over 100 schools teaching the atelier style training and thousands of students.2 3 Studies have shown that "Generally people preferred realist paintings," (Echoes 2006/1 Working Paper Series of the Echo Survey Institute Page 4) So, what do all these students and educators see that Modernists do not? And why is it that most educated people who are not part of the art world seem to also prefer traditional realism?3 It is the purpose of this essay to answer that question in the clearest most direct way possible, and to thereby help establish for artists and the consumers of art, a set of criteria by which they can judge works of art, understand their own preferences, and if needed, to arm them with the facts, concepts and information to deal with the modernists, educators and apologists who are constantly attacking and denigrating the skills and subjects which enable fine art. The skills like with literature, poetry and theatre that enable us to communicate our shared humanity. We will accomplish this by delineating a simple way to understand and define what fine art is. We will also look in particular at the aesthetic foundation of fine art as it evolved during the 19th Century and the Modernist juggernaut which almost lead to its complete suppression during most of the 20th Century. The following information also advances criteria by which to view artists and movements, and help to determine why some works of art are experienced as beautiful and successful and why others seems to fall flat or are even boring. It will hopefully also satisfy the needs of practicing artists to determine what type of art and subjects they wish to explore and which skills and techniques they will need to learn and practice in order to accomplish this. As in all education, individuals should ultimately decide for themselves what makes sense and what is nonsense or babble. Beauty and Fine Art Versus Craft To determine a cohesive theory on fine art (or aesthetics) we need to answer this question: What makes something beautiful or aesthetically successful? 4 Fine art can deal with all or any of the seemingly endless arrays of feelings and experiences that benefit, excite, terrorize or plague humanity. This is the broader sense of the definition of "beauty" that we use in the aesthetics of fine art. (this is mentioned again in body of text) The purpose of fine art is to create beauty in the broader sense4, or to create works of art that are experienced as beautiful. Therefore, it would seem that the definition of fine art itself is inextricably tied to successfully defining beauty in art as opposed to beauty in the natural world. There are generally recognized works of art that are experienced as beautiful by most people. In addition, people are motivated to surround themselves with objects of beauty and to create art as a life enriching and life-affirming experience. 5 The English Aesthetic movement believed in beauty for its own sake trying to remove other meanings in their paintings. However they all had subjects regardless and it could be argued that had they succeeded they would have no longer been works of fine art but instead fine craft. In the fine arts there are two over riding kinds of beauty. There is beauty of form and there is beauty in thought, idea or subject matter, in essence its' emotional, intellectual and spiritual thrust. What is the purpose or what are the feelings that the artist is attempting to capture or express? Then all the choices made of size, drawing, modeling, composition, color, design, perspective, etc., are all formal elements that make up the forms used by the artist to support and harmonize with the chosen emotional thrust. If the artist has chosen well and successfully marries idea and form, then it is possible for a great work of art to be created. Beauty in forms, minus any specific subject or idea, can and does exist in many objects created by human beings, but it is combining them with subjects and themes that makes a work fine art.5 Some examples of things that are beautiful that do not have a specific subject would be: Persian rugs, English silver, porcelain, Russian enamel, haute cuisine, high couture, furniture etc. Beauty in such things is a different type of beauty and generally encompasses beauty of form without incorporating beauty of idea, subject or theme. It should be noted that there are many exceptions to this general rule. For example, the Gate of Paradise, the famous golden door of the Baptistery in Florence; spirituality, religious feelings of transcendence engendered by the architectural splendor achieved in great cathedrals temples or mosques. Lorenzo Ghiberti The Gates of Paradise Gilded bronze, 1425–52 Individual reliefs: 31 1/4 x 31 1/4 inches (78.74 x 78.74 cm) Duomo Museum, Florence So how are we to differentiate fine art from these other human activities and achievements? The single clear element of differentiation is that all of these other activities at their best are the product of highly skilled crafts people who are creating objects with varying levels of skill and complexity. These objects may be experienced as attractive, handsome or elegant, and are also usually functional in some way. In some cases, even functionality isn't essential. An example might be a finely knotted silk Persian or Indian rug, which may be hung on the wall as decoration instead of being walked upon; though it still may be useful to warm the room and perhaps improve the acoustics. We will call these other creative, often important, sometimes essential instances of human creativity "craft", fine craft, or finely crafted. So what makes "fine art" different from "fine craft"? Fine craft produces objects that are functional, beautiful and well-constructed to last and to perform a needed or desired function and often to also delight the senses. It can even be demonstrated in things that don't have a physical presence. If a mathematician solves a math problem in a way that is overly burdensome and complex his peers may feel that his proof lacks elegance. But if another mathematician finds a much more direct solution which is clear and bypasses half the steps, using a new creative path to come to the same conclusion, his peers will praise the elegance and even aesthetic beauty of his solution. Depending on the field of endeavor the sense of aesthetics or beauty can and will vary based on specific aspects of the goals that are sought. In each field there will be ways to determine beauty and elegance versus banality and ugliness, and while differences of motivation and taste would surely cause differences of opinion, most people who create or consume the output of each craft usually concur to a significant degree. But what is different about fine art? What does it seek to accomplish which makes it worthy of designating this art as fine art? The term "state of the art" is a wonderful phrase and aids us in understanding this difference. Every other form of craft has evolved and developed over the course of human history and the best and most exceptional examples in each field are held up prototypically and called "state of the art". Of course that phrase is used in science, engineering, mathematical theories and computer programing and in all other technologies, many of which produce things of great value for humanity. It is a matter of opinion whether Fine art is superior to science or even crafts for that matter. Regardless, it has a different purpose and fills a different human need. That need is in its ability to communicate and capture and express ideas about life and living which people care about after their basic biological needs are filled. People need to share their lives and feelings with other people and this is done through communication which helps give meaning to our lives. Most communication is in spoken and written language. Fine art also communicates, which it does best when it successfully captures, depicts, and expresses our shared humanity: how we feel about ourselves, other people and the world around us. It may be seeking to capture an emotional state of mind like reverie, jealousy, joy, sadness, fear, etc., or it may attempt to tell a story like Ghiberti's famous scenes from the Old Testament on the doors of the Baptistery in Piazza Duomo in Florence or Norman Rockwell's Homecoming Marine. If someone with little skill attempts a work of fine art it will likely be unsuccessful or awkward and fail, but an attempt at fine art was still made as opposed to an attempt at fine craft. Failure to achieve doesn't turn fine art into craft or vice versa. All of the other crafts and sciences (other than pure research*) have a utilitarian purpose or a purely decorative purpose, but in fine art, human beings endeavor to look at themselves and others, to contemplate the nature of living as a human being, and to find ways of capturing, expressing and communicating with empathy, passion and compassion the road we all must take between birth and death. So, the purpose of fine art is similar in its goal to the purpose of poetry, fine literature or theatre. Norman Rockwell (American, 1894-1978) Homecoming Marine Oil on canvas, 1945 46 x 42 inches (116.8 x 106.7 cm) Based on the above, I posit: The visual fine arts of drawing, painting and sculpture are best understood as a language ... a visual language. Very much like spoken and written languages, it was developed and preserved as a means of communication. And very much like language it is successful if communication takes place and unsuccessful if it does not. This simultaneously helps define the term "Fine Art." So fine art is one important way that human beings can communicate. This realization conversely poses the question: Can it be fine art if it does not communicate or does not even attempt to do so? Communication can only occur if the language of the speaker is understood by those who are listening. An absolute necessity for communication is that the language employed has vocabulary and grammar shared by speaker and listener or by writer and reader and therefore logically by painter and viewer. The earliest forms of written languages used simple drawings of real objects to represent those objects as observed in Hieroglyphics and the earliest cave drawings. The origins of written language and the origins of fine art overlap in this nearly id'''
