title = "Etching: Masters of Line - Art Renewal Center"
full_description = "Etching: Masters of Line Published on February 28, 2025 June 30 - July 25, 2025 Masters of Line offers a unique opportunity to learn and practice copper plate etching at The Florence Academy of Art’s magnificent campus in Florence, Italy. The course is studio-based, with accompanying Art History lectures, field drawing, material lectures, studio demonstrations, and intensive hands-on monitored studio/lab work. Students are introduced to all aspects of Line Etching, preparing the ground, biting, proof-printing, and plate correction, and finish the program with at least three of their own completed copper plates. While ideal for beginners, this workshop offers substantial value to those with prior etching experience, covering both fundamental techniques and advanced processes involved in creating high quality works. Location: The Florence Academy of Art, Via Aretina 293, Florence, Italy. Click here to view the campus. For more information visit: https://www.florenceacademyofart.edu/workshops/etching-masters-of-line/ or email info@florenceacademyofart.edu."
