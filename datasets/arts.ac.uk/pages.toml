e affordable way to study.Courses are fully online and delivered part-time over 2-4 years for a Master’s, enabling students to gain a degree and advance their careers without needing to relocate to London or put their lives on hold.Students will join an online community that is supportive and engaging. From interacting with tutors and receiving feedback to collaborative learning including discussions, debates and group work.They will be part of an international cohort from across the world, creating a dynamic and diverse learning experience where they can connect with peers and build a global network.'''
