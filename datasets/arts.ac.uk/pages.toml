title = "The Launch of UAL Online | UAL"
description = "November marked the formal launch of UAL Online, a new venture at the university offering a suite of fully online, part-time postgraduate courses.UAL Online will serve as the catalyst for UAL to become the global leader in online creative education, strengthening UAL’s world-leading position and helping it become a more inclusive institution.UAL’s Pro Vice-Chancellor (UAL Online), Anna Wood said:“I'm thrilled that we are on this journey and can bring creative education to more students across the globe than ever before. We are boldly reimagining UAL’s subject strengths in the online environment.”UAL Online courses will build on UAL's rich history in creative arts education with the ambition to offer more flexibility to a wider audience who want to achieve a degree around existing commitments.To mark the website launch, UAL Online sees its first course come to life; MA Graphic Design, developed in partnership with London College of Communication. This online MA targets designers looking to shape their identity, elevate their practice, and explore how design can influence the world. Students will be taught by UAL staff and specialist academics who bring a wealth of experience from their creative professional practices.Professor Kene Igweonu, Pro Vice-Chancellor and Head of London College of Communication said:“As global leaders in creative communication and design education, LCC is perfectly positioned to expand into the online environment and make our offer available to more people than ever before.”Following the launch of Graphic Design, two more industry-focused new courses will be introduced in January 2025: MA Fashion Business and MA Fashion Marketing, both with the London College of Fashion.To ensure all courses are flexible, accessible, and to the highest standard, UAL Online has developed a teaching and learning model to use alongside UAL's existing educational principles, focusing on innovative course design and construction. Academics from across UAL, along with online learning specialists, will come together to design each new course that comes to market.The first three courses will be delivered fully online, part-time, and will open for enrolment in January 2025.How it worksUAL Online courses combine structure with flexibility, a mechanism which is integral to the online learning experience, allowing students to pursue a degree around their personal and professional commitments. Students can take breaks between units and choose elective units aligned with their career goals and interests.Each course offers three award levels and entry points: Postgraduate Certificate, Postgraduate Diploma, and a Master’s degree. Students pay per unit as they progress, making it a flexible and more affordable way to study.Courses are fully online and delivered part-time over 2-4 years for a Master’s, enabling students to gain a degree and advance their careers without needing to relocate to London or put their lives on hold.Students will join an online community that is supportive and engaging. From interacting with tutors and receiving feedback to collaborative learning including discussions, debates and group work.They will be part of an international cohort from across the world, creating a dynamic and diverse learning experience where they can connect with peers and build a global network."
