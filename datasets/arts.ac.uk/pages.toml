y commended actions within the application focused on promoting transparency, accountability and buy-in from across the University. Caption Designed for Life exhibition | © Jack Elliot Edwards | London College of Fashion | UAL Harnessing creativity to build cohesive communities Increasing community involvement in arts and creativity could play a pivotal role in bridging societal divides. Caption Naroa Perez Iguaran, 2017, BA (Hons) Photography, London College of Communication, UAL | Photograph: Alys Tomlinson The Launch of UAL Online: Shaping the future of creative online learning This November celebrates the formal launch of UAL Online, a new venture at the university offering a suite of fully online, part-time postgraduate courses. See more stories Arrow Right 6 Colleges, 1 University CamberwellCollege of Arts CentralSaint Martins ChelseaCollege of Arts London College ofCommunication London Collegeof Fashion WimbledonCollege of Arts 6 Colleges,1 University Discover our colleges @media only screen and (min-width: 600px){ .sbxyz .card-masonry-grid .card-article:nth-child(2n) .promo-container{ padding-right:0; padding-left:8vw; } .sbxyz .card-masonry-grid .card-article:nth-child(odd) .promo-container{ padding-left:0; padding-right:8vw; } } @media only screen and (max-width: 600px){ .sbxyz .card-masonry-grid .card-article:nth-child(2n) .promo-container, .sbxyz .card-masonry-grid .card-article:nth-child(odd) .promo-container{ padding:0; } } What's on UAL Bereavement support group Request to join UAL's Bereavement support group. Meet with other students and share your experience of loss in a facilitated weekly group. Grads: career one-to-ones Book a 20 minute appointment to discuss your next steps in your professional practice Creative Education Online (CEO) Seminar Series A conversational seminar series exploring the future of creative art and design education in digital spaces. Student Career One-to-Ones Come talk to us, let's see how we can support you in figuring out how to make a living doing what you love. Campus Career Support One-to-Ones Join us in person to talk about ways we can support you to make a living doing what you love. LCC/CRiSAP Lecture – Sound Arts Lecture Series Sound Arts Guest Lecture Series - Spring Term 2025. A CRiSAP and LCC Sound Arts Department collaboration at London College of Communication. See more events Arrow Right Open Days See all open days var blackButtons = document.querySelectorAll('p span.button.black-bg'); var blackButtonsParent = blackButtons.parentNode; blackButtons.forEach(function (value, index) { var buttonTag = value.querySelector('a'); blackButtons[index].parentNode.insertBefore(buttonTag,blackButtons[index].childNode); blackButtons[index].parentNode.removeChild(blackButtons[index]); });'''
