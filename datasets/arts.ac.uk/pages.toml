search and innovation. Toggle caption Caption Renault x CSM - Yuchen Chai Work with our students and graduates Bring creativity and fresh ideas to your business. Toggle caption Caption Google, Mini Maker Faire at London College of Communication Professional training Expert training and consultations for your business, team or individual needs. Become our partnerWe’re in strategic, long-term partnerships with some of the most innovative organisations in the world, like LVMH, Kering, Google Arts & Culture, MullenLowe Group, Microsoft, L'Oreal Professionnel, Condé Nast and Swarovski.Read our terms of engagement. Start a creative partnership with us Complete our enquiry form Case studies Caption Festival for Community Organising | photography by Disha Kulkarni, 2023 Camberwell College of Arts x Citizens UK in action: Festival for Community Organising As a creative institution within Southwark, Camberwell College of Arts has a responsibility to its local community. Caption UAL Incubator Launch Demo Day, 2022, UAL | Photograph: Kristina Sarkisyan 3 graduates on how UAL Incubator: Launch helped them start their creative enterprises We caught up with 3 graduates who recently completed the UAL Incubator programme to bring their business ideas to life. Caption Climate Studio activities as part of Service Futures Lab's partnership with Southwark Council, 2022 | Photography: Nana Maiolini Future Observatory 2022: what we achieved through our Design Exchange Partnerships Since November 2021, the Arts and Humanity Research Council and Design Museum have been bringing together researchers, designers and industry stakeholders for Future Observatory: a national programme to harness design research to inform the UK’s response to the climate crisis, including decarbonisation, waste reduction and circular economies. Read more case studies Arrow Right What is Knowledge Exchange? Knowledge Exchange strategyKnowledge Exchange is one the key institutional priorities of the UAL Strategy 202