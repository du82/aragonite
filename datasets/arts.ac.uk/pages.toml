["https://www.arts.ac.uk/about-ual/press-office/stories/harnessing-creativity-to-build-cohesive-communities-new-research"]
title = "Harnessing creativity to build cohesive communities – new research  | UAL"
description = '80% of Britons are interested in arts and creative activities, but only 53% participated in the past year.72% agree that arts events can bring people of different backgrounds together, while just 6% disagree.47% of participants in creative arts activities reported meeting people from different backgrounds through these activities.Creating Connections, a new report from the think tank British Future and funded by the University of the Arts London, highlights a strong interest in the creative arts among Britons. The findings suggest that increasing community involvement in arts and creativity could play a pivotal role in bridging societal divides.The study reveals that while 80% of people are interested in participating in arts and creative activities, only 53% did so in the past year. This highlights a significant opportunity to utilise creative engagement as a tool to address pressing social divisions, particularly in the wake of this summer’s racist riots.Arts and creativity projects promote social mixing, bringing together people from diverse backgrounds. Experts stress the importance of such interactions in breaking down fears and prejudices. According to the research, 72% of the public agree that “arts events can bring people of different backgrounds in Britain together,” while just 6% disagree. Additionally, 47% of those who participated in creative arts activities last year reported that it helped them meet people from different backgrounds.Creative initiatives are increasingly being employed to promote social cohesion. Projects are enabling people to connect across divides, fostering local pride, supporting new arrivals in integrating into British society, and uniting communities through large-scale events such as Cities of Culture.The report highlights several impactful case studies. These include a street festival in Oldham that brought together settled residents and new arrivals from the Roma community, a Glasgow women’s choir connecting refugees and asylum seekers with locals, and the involvement of Ukrainian refugees and other migrant groups in Liverpool’s Eurovision 2023 celebrations.Jake Puddle, Senior Researcher for British Future and lead report author, said:“The racist riots on our streets this summer showed the urgent need for action on social cohesion. We need to look at what works and invest in it – not muddle through and hope it doesn’t happen again.“Community arts projects can play an important role in bridging divides in our society. We should do more to encourage social mixing between people from different backgrounds, and our research finds that arts and creativity is a great way to bring people together.“There is clearly an untapped appetite among the public to be more creative. We should harness that with projects to break down barriers and prejudices in communities. Arts and creativity should be a key strand of a comprehensive national strategy on social cohesion – and we need to see that strategy implemented soon.”Polly Mackenzie, Chief Social Purpose Officer, University of the Arts London, said:“Creativity isn’t just a pastime - it’s a force for change. The Creating Connections report highlights how the arts can achieve what politics often struggles to do: break down barriers, foster empathy, and unite people.“In a time when societal cohesion is increasingly fragile, the need for creative expression has never been more urgent. Now is the moment to embrace the growing public appetite for the arts and invest in their power to rebuild trust, celebrate our shared humanity and nurture thriving, connected communities"RecommendationsThe report calls on the government to include the creative arts in a new, comprehensive strategy on social cohesion, particularly in response to this summer’s violent racist unrest. It also emphasises the role of cultural programmes linked to major national events, such as VE Day 80 in 2024 and the UK’s hosting of the UEFA Euros in 2028, in bringing people together.Organisers of large-scale arts events such as Cities of Culture are encouraged to make social connection a “golden thread” running through all aspects of their initiatives—from audience outreach to planning and legacy efforts. The report highlights the positive impact of Cities of Culture, particularly on volunteering, with thousands of participants reporting that their involvement helped them build stronger connections and a sense of pride in their communities.Download the full report'
full_description = '.story-contents .text-component .text-block { padding-right: 20vw; padding-left: 24vw; } section.cell.ct.image-item{ padding-left:0; } .sbxyz .story-contents .stories-content-full-width-container .text-block{ margin-left:0; } .promo-container{ margin-left:-4vw; } .sbxyz .stories-content-full-width-container .video-component[data-video-expanded="false"]{ padding-left:0; padding-right:0; } .sbxyz .story-contents .video-card.video-full-width{ padding:0 !important; } .off-canvas-content{ margin-bottom:8vw; } @media only screen and (min-width:600px){ /*div#offCanvas{*/ /* display:none;*/ /*}*/ .sbxyz .people-template.stories-template .stories-content .text-block{ margin-left:0; } } .sbxyz .video-card.video-full-width{ padding:0 !important; } .sbxyz.dark--theme .people-header__content--left{ background: #0A0A0A; } .sbxyz .people-template .image-gallery-container{ background-color: #ffffffe3; box-shadow: 0px 0px 200px 130px #ffffffe3; } Story Harnessing creativity to build cohesive communities Written byPress Office Published date 11 December 2024 Share story Facebook Twitter Snapchat Caption Designed for Life exhibition | © Jack Elliot Edwards | London College of Fashion | UAL 80% of Britons are interested in arts and creative activities, but only 53% participated in the past year.72% agree that arts events can bring people of different backgrounds together, while just 6% disagree.47% of participants in creative arts activities reported meeting people from different backgrounds through these activities.Creating Connections, a new report from the think tank British Future and funded by the University of the Arts London, highlights a strong interest in the creative arts among Britons. The findings suggest that increasing community involvement in arts and creativity could play a pivotal role in bridging societal divides.The study reveals that while 80% of people are interested in participating in arts and creative activities, only 53% did so in the past year. This highlights a significant opportunity to utilise creative engagement as a tool to address pressing social divisions, particularly in the wake of this summer’s racist riots.Arts and creativity projects promote social mixing, bringing together people from diverse backgrounds. Experts stress the importance of such interactions in breaking down fears and prejudices. According to the research, 72% of the public agree that “arts events can bring people of different backgrounds in Britain together,” while just 6% disagree. Additionally, 47% of those who participated in creative arts activities last year reported that it helped them meet people from different backgrounds.Creative initiatives are increasingly being employed to promote social cohesion. Projects are enabling people to connect across divides, fostering local pride, supporting new arrivals in integrating into British society, and uniting communities through large-scale events such as Cities of Culture.The report highlights several impactful case studies. These include a street festival in Oldham that brought together settled residents and new arrivals from the Roma community, a Glasgow women’s choir connecting refugees and asylum seekers with locals, and the involvement of Ukrainian refugees and other migrant groups in Liverpool’s Eurovision 2023 celebrations.Jake Puddle, Senior Researcher for British Future and lead report author, said:“The racist riots on our streets this summer showed the urgent need for action on social cohesion. We need to look at what works and invest in it – not muddle through and hope it doesn’t happen again.“Community arts projects can play an important role in bridging divides in our society. We should do more to encourage social mixing between people from different backgrounds, and our research finds that arts and creativity is a great way to bring people together.“There is clearly an untapped appetite among the public to be more creative. We should harness that with projects to break down barriers and prejudices in communities. Arts and creativity should be a key strand of a comprehensive national strategy on social cohesion – and we need to see that strategy implemented soon.”Polly Mackenzie, Chief Social Purpose Officer, University of the Arts London, said:“Creativity isn’t just a pastime - it’s a force for change. The Creating Connections report highlights how the arts can achieve what politics often struggles to do: break down barriers, foster empathy, and unite people.“In a time when societal cohesion is increasingly fragile, the need for creative expression has never been more urgent. Now is the moment to embrace the growing public appetite for the arts and invest in their power to rebuild trust, celebrate our shared humanity and nurture thriving, connected communities"RecommendationsThe report calls on the government to include the creative arts in a new, comprehensive strategy on social cohesion, particularly in response to this summer’s violent racist unrest. It also emphasises the role of cultural programmes linked to major national events, such as VE Day 80 in 2024 and the UK’s hosting of the UEFA Euros in 2028, in bringing people together.Organisers of large-scale arts events such as Cities of Culture are encouraged to make social connection a “golden thread” running through all aspects of their initiatives—from audience outreach to planning and legacy efforts. The report highlights the positive impact of Cities of Culture, particularly on volunteering, with thousands of participants reporting that their involvement helped them build stronger connections and a sense of pride in their communities.Download the full report'
