ć from the Rescuers Project PCRC, Credit - Dr Paul Lowe Research and projects Find current and completed research by our researchers and research students, spanning art, design and communication. Toggle caption Caption Lucy Orta and Jorge Orta, Fabulae Naturae (2015) UAL repository We hold, manage, share and preserve the research material produced by the University's researchers, and ensure that it reaches the widest possible audience. Toggle caption Caption Stanley Kubrick during filming of 2001: A Space Odyssey (US/UK 1968) © Warner Bros. Inc., Stanley Kubrick during filming of 2001: A Space Odyssey (US/UK 1968) © Warner Bros. Inc. Archives and collections Learn about UAL's Archives and Special Collections Centre based at London College of Communication, which holds the Stanley Kubrick Archive. Featured research stories UAL contributes to major new report on improving diversity and inclusion in creative Higher Education Making the Creative Majority, a report authored by the All-Party Parliamentary Group (APPG) for Creative Diversity showing that access to creative Higher Education remains ‘highly unequal’, has now been published. Caption Made in Code: Reimagining the Experience of Fashion, Instillation at V&A, BFTT/ Photography | Adam Razvi, 2023 Made in Code: Reimagining the Experience of Fashion The University of the Arts London (UAL), Business of Fashion, Textiles and Technology (BFTT), Creative Research & Development Partnership recently launched a prototype installation at the V&A to showcase the significant potential of digital fashion experiences across performance, film, games, archives, and other wide ranging cultural contexts. Caption Kate Goldsworthy, 2017, Man-made Re-made UAL partners with The Welding Institute to create Innovation Lab A new agreement between UAL and TWI will see the two parties establish a unique centre for creative textile and materials engineering technologies called the University of the Arts London Innovation Lab (UALIL). Caption Joanna Domagalska, 2022 BA Graphic and Media Design, London College of Communication, UAL UAL Research Strategy 2023-2028: Changing the world through our creative endeavour Launching our research strategy, focused on the vision of "changing the world through our creative endeavour." See more stories Arrow Right Standards and ethicsAt UAL ensure that our research is conducted according to appropriate ethical standards. Find out more about our Research standards and ethics. var blackButtons = document.querySelectorAll('p span.button.black-bg'); var blackButtonsParent = blackButtons.parentNode; blackButtons.forEach(function (value, index) { var buttonTag = value.querySelector('a'); blackButtons[index].parentNode.insertBefore(buttonTag,blackButtons[index].childNode); blackButtons[index].parentNode.removeChild(blackButtons[index]); });'''
