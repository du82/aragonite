title = "Colleges and Institutes | UAL"
description = "University of the Arts London is a world-class university made up of 6 renowned colleges. Learn more, find a course or book an open day."
full_description = "Colleges and Institutes Caption Interview with Teshome Samuel, 2017 MA Game Design, London College of Communication, UAL | Photograph: Alys Tomlinson Find out more about our Colleges and what's on offer. Each College has a long established, global reputation for producing outstanding work. Caption Photo by Alys Tomlinson, Exterior shot of Camberwell College of Arts , Camberwell College of Arts, UAL | Camberwell College of Arts Camberwell College of Arts is a renowned art and design college. We believe that creativity can have a positive social impact. Our college culture gives students the freedom to explore their individuality. Caption John Sturrock, Exterior shot of Central Saint Martins at Granary Square Photograph: John Sturrock Central Saint Martins Central Saint Martins is a world-famous arts and design college. We are the creative and inventive ambitions of our students, staff and partners. Caption Kristy Noble., Exterior shot of Chelsea College of Arts , Chelsea College of Arts, UAL | Photograph: Chelsea College of Arts. Chelsea College of Arts Chelsea College of Arts is one of London’s most prestigious art and design colleges. We have a reputation for producing some of today’s leading artists and designers. We inspire our students to explore global, cultural, political and social issues through their practice. Caption Exterior shot of London College of Communication building in Elephant and Castle London College of Communication London College of Communication is a pioneering world leader in creative communications education. It works at the cutting edge of new thinking in Design, Media and Screen and prepares its students to become the future of the creative industries. Caption East Bank and V&A building exteriors, Tony Lall-Chopra Technical Co-ordinator Stratford D&D at LCF. London College of Fashion Find out about London College of Fashion, UAL, which is a world leader in fashion design, media and business education and has been nurturing creative talent for over a century. Caption Levitt Bernstein, Wimbledon College of Arts Wimbledon College of Arts has a world class reputation for teaching performance. As a community we will help you to become bold, innovative performers and experimental designers. Caption Launch of UAL Creative Computing Institute UAL Creative Computing Institute The UAL Creative Computing Institute offers innovative new courses, research opportunities, partnerships and events - exploring computer science and creative practice. Caption Sheffield Museums, Graves Gallery. Photo © Andy Brown UAL Decolonising Arts Institute The UAL Decolonising Arts Institute seeks to challenge colonial and imperial legacies and drive social, cultural and institutional change. Caption A co-created and crowd sourced fashion garment in blue by AWAYTOMARS, Photo by Gleeson Paulino UAL Fashion Textiles and Technology Institute The UAL Fashion Textiles and Technology Institute (FTTI) delivers sustainable innovation across the entire fashion and textiles value chain. Caption Hai Hui Xiong, 2021 MA Book Arts, Camberwell College of Arts, UAL | Photograph: Kristy Noble AKO Storytelling Institute Developing a world-leading understanding of how narrative and storytelling can bring about change. Caption Exterior front of Lime Grove , UAL © Alys Tomlinson UAL School of Pre-degree Studies Lime Grove is home to all of UAL’s pre-degree courses from September 2024. Courses Arrow Right We offer pre-degree, undergraduate, postgraduate and short courses in 18 subjects. Open days Arrow Right Interested in studying at UAL? Join us at an online Open Day this term to see what life at UAL is like."
