["https://www.arts.ac.uk/about-ual/public-information/slavery-and-human-trafficking-statement"]
title = "Modern slavery statement | UAL"
description = "Read about our actions to understand modern slavery risks and to ensure steps are maintained to prevent slavery and human trafficking."
full_description = '''.tabs-content .tabs-panel a{ line-height: 140%; color: #fff; text-decoration: underline; } .tabs-content .tabs-panel a:hover{ color: #ff5000; text-decoration: none; } section.header-module-landing .header-module-content{ margin-top: 0; } .dark--theme .card-item .card-item__section .card-item__heading a{ color: #fff; } .dark--theme .card-item .card-item__section .card-item__heading a:hover{ color: #ff5000; } .sbxyz .social-feed{ display:block !important; } //code to hide header module if empty var moduleText = document.querySelector('.header-module-landing--container .header-module-landing .header-module-content .intro .text-center'); var moduleTextContainer = document.querySelector('.header-module-landing--container'); if(moduleText !== null && moduleText.innerHTML === ""){ moduleTextContainer.classList.add("hide"); } Modern slavery statement IntroductionUAL is Europe’s largest specialist arts and design university, with over 22,000 students and 6,000 staff from 130 countries. It offers excellence in teaching, learning and research and puts students at the heart of its activities. Established in 1986 as the London Institute and achieving University title in 2004, UAL brings together 6 esteemed Colleges: Camberwell College of Arts; Central Saint Martins; Chelsea College of Arts; London College of Communication; London College of Fashion; Wimbledon College of Arts. Together, we are a community of makers, thinkers, pioneers and storytellers redesigning the future.Purpose of this statementThis Statement is published by UAL in compliance with the Modern Slavery Act for the financial year ended July 2024.For this purpose, the term ‘modern slavery’ describes various forms of exploitation which constitute serious violations of human rights, including human trafficking and forced labour. The statement sets out the steps UAL is taking to minimise modern slavery risk.Staff recruitmentIn the past year UAL has continued to mitigate the risk of modern slavery in directly employed staff through robust HR recruitment and candidate selection policies and checks.Temporary staff are only recruited through established and accredited sources who provide assurance to UAL regarding the rights and welfare of their candidates and employees as well as the appropriate checks.UAL adheres to the Public Interest Disclosure Act 1998 and implements its own Whistleblowing Policy through which staff can raise any concerns about modern slavery, potential corruption, fraud, and other unlawful or mal practices within the University.StudentsAlthough the risk of students being subject to modern slavery or human trafficking through direct contact with the University are extremely low, they may become aware of such instances.To support students, UAL has in place easily accessible and well-publicised safeguarding channels through which students can obtain assistance, support and advice.ProcurementDuring the year UAL has maintained its commitment to responsible procurement when purchasing goods and services. In doing so we support the UK Government’s National Action Plan to implement the UN Guiding Principles on Business and Human Rights.In September 2021 the University was successfully accredited as a London Living Wage employer.UAL procures goods, services and works from a wide range of suppliers across a number of categories, similar to other organisations in the education sector, some of which are considered to present a significant risk of modern slavery.To mitigate this risk, UAL is an active member of the London Universities Purchasing Consortium (LUPC). UAL is thereby able to benefit from research and risk assessments of supply chain structures carried out by LUPC which, in high risk areas, includes due diligence procedures. In addition, through its membership of LUPC, UAL is affiliated to Electronics Watch, the mission of which is to protect the rights of workers in electronics supply chains.Tenders for major supply contracts in 2023/2024 included construction and maintenance programmes using framework of construction suppliers, all of which have been approved based on their Modern Slavery practices. In all cases, suppliers were asked to confirm that they did not practice or condone any activities that could be regarded as violating the human rights of their employees. Within the subsequent contracts, we have inserted clauses relating to compliance with Anti-Slavery and Human Trafficking laws and stipulated London Living Wage for employees and any sub-contractors working at UAL.In the year we have tendered and awarded significant contracts for:The fit-out of the London College of Communication campus at Elephant and Castle.Minor Works Framework to consolidate the spend on standardised terms with 17 accredited suppliers.Contracts for enhancements to teaching facilitates that improve energy efficiency and accessibility.Software contracts including, Adobe, Microsoft, SOC & Cyber Security, Computer Aided Facilities Management, Research Application, ERP Hosting.The tender process for these awards incorporated key scoring criteria for Modern Slavery, Equality, Diversity, and Inclusion.The successful bidders have confirmed the following:The amounts they pay their staff always complies with London Living Wage and regularly exceeds it.They are committed to 16 hours per week minimum for their staff.They are fully compliant with Modern Slavery Act 2015 and specifically section 54 (which requires organisations with a turnover of £36m or above to document steps that they have taken to ensure slavery and human trafficking are not taking place anywhere in their supply chain).In addition, for those construction and maintenance contractors that have had performance reviews during the year, each supplier was asked for assurance that they adhere to the Modern Slavery Act 2015.UAL’s aims for 2024/25Implement a central database for the top 100 suppliers based on spend, risk and criticality where it will record data relating to EDI, including modern slavery act and Sustainability.Utilise systems including Constructionline and Dun & Bradstreet to validate our suppliers prior to engagement, identify areas of risk and work with our partners to address identified risks.Update our supplier database to enable us to monitor our spend with minority owned businesses and SME’s.Continue to rationalise the UAL supplier database, and manage performance of our suppliers against UAL’s regulatory and ethical commitments including London Living Wage requirements.Continue to work with Slave Free Alliance.Continue to perform due diligence process to review:Pre-selection: supplier analysis, tender submissionsPost-selection: introducing standards for monitoring due diligence through ongoing contract managementDocument standards for dissemination across the organisation and provide trainingEnsure all our procurement professionals receive further advanced training on Modern Slavery.Continue to share best practice with the sector and keep up to date on identifying and assessing modern slavery risks within our supply chains.Work with the Chief Social Purpose Officer to raise awareness of UAL’s accreditations and ethical commitments.Approval of statementThis statement is made pursuant to section 54(1) of the Modern Slavery Act 2015 and constitutes the University’s slavery and human trafficking statement for the financial year ended 2020. It is approved and signed on behalf of the Court of Governors.Download current and previous statementsOur current statement in PDF format (includes signature):UAL Modern Slavery Statement 2023/24 (PDF 247KB)Previous statementsUAL Modern Slavery Statement 2022/23 (PDF 180KB)UAL Modern Slavery Statement 2021/22 (PDF 140KB)UAL Modern Slavery Statement 2020/21 (PDF 140KB)UAL Modern Slavery Statement 2019/20 (PDF 141KB)UAL Modern Slavery Statement 2018/19 (PDF 160KB)UAL Modern Slavery Statement 2017/18 (PDF 110KB) var blackButtons = document.querySelectorAll('p span.button.black-bg'); var blackButtonsParent = blackButtons.parentNode; blackButtons.forEach(function (value, index) { var buttonTag = value.querySelector('a'); blackButtons[index].parentNode.insertBefore(buttonTag,blackButtons[index].childNode); blackButtons[index].parentNode.removeChild(blackButtons[index]); });'''
