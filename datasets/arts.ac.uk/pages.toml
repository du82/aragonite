full_description = '''.tabs-content .tabs-panel a{ line-height: 140%; color: #fff; text-decoration: underline; } .tabs-content .tabs-panel a:hover{ color: #ff5000; text-decoration: none; } section.header-module-landing .header-module-content{ margin-top: 0; } .dark--theme .card-item .card-item__section .card-item__heading a{ color: #fff; } .dark--theme .card-item .card-item__section .card-item__heading a:hover{ color: #ff5000; } .sbxyz .social-feed{ display:block !important; } //code to hide header module if empty var moduleText = document.querySelector('.header-module-landing--container .header-module-landing .header-module-content .intro .text-center'); var moduleTextContainer = document.querySelector('.header-module-landing--container'); if(moduleText !== null && moduleText.innerHTML === ""){ moduleTextContainer.classList.add("hide"); } Cookies Last updated 26 July 2023Cookies are used on the University of the Arts London website. Cookies are small text files that are placed on your computer by websites that you visit.They are widely used in order to make websites work, or work more efficiently, as well as to provide information to the owners of the site.We also use tracking pixels on this website. These give us some information about users who navigate our website which can include:IP addressthe type of operating systemthe type of browserthe time the website was visiteduser activity on the website during a session.Changing your cookie settingsMost web browsers allow some control of most cookies through the browser settings. To find out more about cookies, including how to see what cookies have been set, you can visit www.aboutcookies.org or www.allaboutcookies.org.Be aware, if you choose to switch off certain cookies it may impact on the functionality of the site.To opt out of being tracked by Google Analytics across all websites you can visit http://tools.google.com/dlpage/gaoptout.Cookies we useEssential website cookiesThese cookies are strictly necessary to provide you with services available through our websites and to use some of its features, such as access to secure areas.Name: SQ_SYSTEM_SESSIONPurpose: Used by University of the Arts London to determine whether a user is logged into the content management system.Provider: arts.ac.ukService: University of the Arts London View Service Privacy PolicyCountry: United KingdomType: server_cookieExpires in: sessionName: AWSELBPurpose: Used as a load balancer for web applications hosted on Amazon Web Services (AWS).Provider: AmazonService: Amazon Web Services View Service Privacy PolicyCountry: GermanyType: http_cookieExpires in: 1 minuteName: Recite.Persist Purpose: This stores a flag to indicate whether the Recite Me toolbar should persist between pages or not. Provider: Recite MeName: Recite.PreferencesPurpose: This stores the user's current Recite Me settings so that they can be reapplied on subsequent pages. Provider: Recite MeMore information about Recite Me is available in our Accessibility Statement.Performance and functionality cookies:These cookies are used to enhance the performance and functionality of our websites but are non-essential to their use. However, without these cookies, certain functionality (like videos) may become unavailable.Name: GPSPurpose: A session cookie that registers a unique ID on mobile devices to enable tracking based on geographical GPS location.Expires after 30 minutes.Provider: YouTube.comService: Youtube View Service Privacy PolicyCountry: United StatesType: http_cookieExpires in: 30 minutesAnalytics and customisation cookies:These cookies collect information that is used either in aggregate form to help us understand how our websites are being used or how effective our marketing campaigns are, or to help us customise our websites for you.Name: _hjid Purpose: Tells Hotjar which site settings it should load and where it should save the data collected by using the hjid (Hotjar ID). Provider: HotjarService: Hotjar View Service Privacy Policy Country: United Kingdom Type: html_local_storage Expires in: persistentName: _hjIncludedInSample Purpose: This cookie is set to let Hotjar know whether that visitor is included in the sample which is used to generate heatmaps, funnels, recordings, etc. Provider: HotjarService: Hotjar View Service Privacy Policy Country: United States Type: http_cookie Expires in: sessionName: #collect Purpose: Sends data such as visitor’s behaviour and device to Google Analytics. It is able to keep track of the visitor across marketing channels and devices. It is a pixel tracker type cookie whose activity lasts within the browsing session. Provider: GoogleService: Google Analytics View Service Privacy Policy Country: United States Type: http_cookie Expires in: sessionName: sc_anonymous_id Purpose: Used by Soundcloud as a unique user ID for a listener listening from another website with Soundcloud music embedded. Expires after 3650 days Provider: SoundcloudService: Soundcloud View Service Privacy Policy Country: United States Type: http_cookie Expires in: 9 years 12 months 2 daysName: demdex Purpose: Used by Adobe Analytics to help identify a unique visitor across domains. The demdex cookie is set in the third-party, demdex.net domain in the browser. Provider: AdobeService: Adobe Analytics View Service Privacy Policy Country: __________ Type: http_cookie Expires in: 6 monthsName: vuid Purpose: Used by Vimeo player to check if certain features or preferences have been selected by the user on websites with embedded videos from Vimeo. Provider: Vimeo Service: Vimeo View Service Privacy Policy Country: United States Type: http_cookie Expires in: 1 year 12 months 4 daysName: audit Purpose: Set by Magnite (formerly Rubicon Project) to record cookie consent data. Provider: MagniteService: Magnite View Service Privacy PolicyCountry: United States Type: http_cookie Expires in: 12 months 5 daysName: pxrc Purpose: Used to analyse how the user interacts with the site to optimise ads shown to them. Expires after 2 months.Provider: PippioService: Liveramp View Service Privacy Policy Country: United States Type: http_cookie Expires in: 2 monthsName: _gid Purpose: Keeps an entry of unique ID which is then used to come up with statistical data on website usage by visitors. It is an HTTP cookie type and expires after a browsing session. Provider: GoogleService: Google Analytics View Service Privacy Policy Country: United Kingdom Type: http_cookie Expires in: 1 dayName: khaos Purpose: Set by Magnite (formerly Rubicon Project) as an Internal user identifier used for analytics. Persistent cookie that stays for 2920 days Provider: MagniteService: Magnite View Service Privacy Policy Country: United States Type: http_cookie Expires in: 12 months 5 daysName: _gat# Purpose: Enables Google Analytics regulate the rate of requesting. It is an HTTP cookie type that lasts for a session. Provider: GoogleService: Google Analytics View Service Privacy Policy Country: United Kingdom Type: http_cookie Expires in: 1 minuteName: rlas3 Purpose: Used to collect anonymous data related to the user's visits to the website, such as the number of visits, average time spent on the website and what pages have been loaded, with the purpose of displaying targeted ads. Provider: RapleafService: Rapleaf View Service Privacy Policy Country: United States Type: http_cookie Expires in: 12 months 5 daysName: _ga Purpose: It records a particular ID used to come up with data about website usage by the user. It is a HTTP cookie that expires after 2 years. Provider: GoogleService: Google Analytics View Service Privacy Policy Country: United Kingdom Type: http_cookie Expires in: 1 year 12 months 4 daysName: i Purpose: Used by Yandex Metrica for identifying site users. This cookie exists for a period of 1 year maximum. Provider: .openx.net Service: Yandex Metrica View Service Privacy Policy Country: United States Type: http_cookie Expires in: 12 months 5 daysName: PREF Purpose: A session cookie used to check user preferences and browser settings so as to properly tailor content for them .Provider: .youtube.com Service: Google View Service Privacy Policy Country: United States Type: http_cookie Expires in: 8 months 3 daysName: #.gif Purpose: Used by AtData (formerly Towerdata) to gather data about website clients to help site owners target better ads at them.Provider: AtData (formerly Towerdata)Service: AtData (formerly Towerdata)Country: United States Type: http_cookie Expires in: sessionName: pxrc Purpose: Used to analyse how user interacts with the site to optimise ads shown to them. Expires after 2 months.Provider: .rlcdn.com Service: Liveramp View Service Privacy Policy Country: United States Type: http_cookie Expires in: 2 monthsName: _vis_opt_exp_{CAMPAIGNID}_goal_{GOALID}_{ACCID}Purpose: This cookie is created when a campaign goal is triggered. When created, this cookie always has a value of 1.Provider: VWOService: VWO Testing View Service Privacy PolicyCountry: BelgiumType: http_cookie; server_cookieExpires in: 100 daysName: _vis_opt_exp_{CAMPAIGNID}_combi_{ACCID}Purpose: This cookie is used for website A/B and multivariate testing. It is created when a visitor is chosen for a particular variation of a test. It ensures that visitors see the same variation when they revisit the page. Here the Control always has the value of 1, Variation #1 always has the value of 2, Variation #2 has the value of 3, etc. This logic continues for the total number of variations added to the test.Provider: VWOService: VWO Testing View Service Privacy PolicyCountry: BelgiumType: http_cookie; server_cookieExpires in: 100 daysName: _vis_opt_exp_{CAMPAIGNID}_exclude_{ACCID}Purpose: This cookie is created when a visitor has been excluded from a VWO campaign due to the traffic percentage specifications. The value of this cookie is always 1Provider: VWOService: VWO Testing View Service Privacy PolicyCountry: BelgiumType: http_cookie; server_cookieExpires in: 100 daysName: _vis_opt_exp_{CAMPAIGNID}_split_{ACCID}Purpose: This cookie is created when one of the variations is chosen for the visitor, but the visitor is not yet redirected to the variation page. Using this, VWO verifies that the variation page corresponds to the chosen variation after landing on the page. The value will always be >=2 as it won’t be created in case the control is chosen. Provider: VWOService: VWO Testing View Service Privacy PolicyCountry: BelgiumType: http_cookie; server_cookieExpires in: 100 daysName: _vwo_uuid_{CAMPAIGNID}_{ACCID}Purpose: This cookie is created for each cross-domain campaign. It generates a unique id for every visitor and is used for the report segmentation feature in VWO. It also allows to view data in a refined manner.Provider: VWOService: VWO Testing View Service Privacy PolicyCountry: BelgiumType: http_cookie; server_cookieExpires in: 10 yearsName: _vis_opt_exp_{CAMPAIGNID}_combi_choose_{ACCID}Purpose: This cookie stores a chosen combination. It’s a temporary cookie that gets deleted when the campaign changes are applied.Provider: VWOService: VWO Testing View Service Privacy PolicyCountry: BelgiumType: http_cookie; server_cookieExpires in: Persists until campaign changes are appliedName: _vwo_global_opt_outPurpose: This cookie is persisted when a visitor opts out of VWO on all websites in a given browser. Provider: VWOService: VWO Testing & VWO Insights View Service Privacy PolicyCountry: BelgiumType: http_cookieExpires in: 100 daysName: _vis_opt_exp_{CAMPAIGNID}_goal_{GOALID}Purpose: This cookie is created when a campaign goal is triggered. This cookie, when created, will always have a value of 1.Provider: VWOService: VWO Testing View Service Privacy PolicyCountry: BelgiumType: http_cookie; server_cookieExpires in: 100 daysName: _vis_opt_test_cookiePurpose: This cookie is created to detect if the cookies are enabled on the visitor’s browser or not. It also helps in tracking the number of browser sessions a visitor has gone through. The value of this cookie is always 1.Provider: VWOService: VWO Testing & VWO Insights View Service Privacy PolicyCountry: BelgiumType: http_cookieExpires in: On browser closeName: _vis_opt_exp_{CAMPAIGNID}_combiPurpose: This cookie is created when a visitor is chosen for a particular variation for a test. This cookie makes sure that visitors see the same variation when they revisit the page in the future. Here the Control has a value of 1, Variation #1 has a value of 2, Variation #2 has a value of 3, and so on.Provider: VWOService: VWO Testing & VWO Insights View Service Privacy PolicyCountry: BelgiumType: http_cookie; server_cookieExpires in: 100 daysName: _vis_opt_exp_{CAMPAIGNID}_excludePurpose: This cookie is created when a visitor has been excluded from a Test Campaign due to the traffic percentage specifications. The value is always 1.Provider: VWOService: VWO Testing & VWO Insights View Service Privacy PolicyCountry: BelgiumType: http_cookie; server_cookieExpires in: 100 daysName: _vis_opt_exp_{CAMPAIGNID}_splitPurpose: This cookie is created when one of the variations is chosen for the visitor, but the visitor is not yet redirected to the variation page. It exists so that VWO can verify that the variation page corresponds to the chosen variation after landing on the page. The value is >=2 (as 1 corresponds to Control and it’s not created in case the Control is chosen) NOTE: This cookie is created only for Split URL campaigns.Provider: VWOService: VWO Testing View Service Privacy PolicyCountry: BelgiumType: http_cookie; server_cookieExpires in: 100 daysName: _vis_opt_sPurpose: This cookie tracks session created for a visitor, i.e., the number of times the browser was closed and reopened. The value is >=1, followed by a pipe sign. For example, the value of 2 indicates that the visitor restarted the browser once while 3 means twice.Provider: VWOService: VWO Testing & VWO Insights View Service Privacy PolicyCountry: BelgiumType: http_cookieExpires in: 100 daysName: _vis_opt_outPurpose: This cookie indicates that the visitor should not be made part of any campaign. Its value is 1.Provider: VWOService: VWO Testing & VWO Insights View Service Privacy PolicyCountry: BelgiumType: http_cookieExpires in: 10 yearsName: _vwo_uuidPurpose: This cookie generates a unique id for every visitor and is used for the report segmentation feature in VWO, and it also allows to view data in a more refined manner.Provider: VWOService: VWO Testing & VWO Insights View Service Privacy PolicyCountry: BelgiumType: http_cookie; server_cookieExpires in: 10 yearsName: _vwo_uuid_{CAMPAIGNID}Purpose: This cookie is created for each cross-domain campaign. It generates a unique id for every visitor and is used for the report segmentation feature in VWO, and it also allows you to view data in a more refined manner.Provider: VWOService: VWO Testing View Service Privacy PolicyCountry: BelgiumType: http_cookie; server_cookieExpires in: 10 yearsName: _vwo_dsPurpose: This cookie stores persistent visitor-level dat'''
