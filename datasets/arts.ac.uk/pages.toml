["https://www.arts.ac.uk/about-ual"]
title = "About UAL | UAL"
description = "UAL is ranked second in the world for Art and Design and has 6 Colleges in central London."
full_description = '''.tabs-content .tabs-panel a{ line-height: 140%; color: #fff; text-decoration: underline; } .tabs-content .tabs-panel a:hover{ color: #ff5000; text-decoration: none; } section.header-module-landing .header-module-content{ margin-top: 0; } .dark--theme .card-item .card-item__section .card-item__heading a{ color: #fff; } .dark--theme .card-item .card-item__section .card-item__heading a:hover{ color: #ff5000; } .sbxyz .social-feed{ display:block !important; } //code to hide header module if empty var moduleText = document.querySelector('.header-module-landing--container .header-module-landing .header-module-content .intro .text-center'); var moduleTextContainer = document.querySelector('.header-module-landing--container'); if(moduleText !== null && moduleText.innerHTML === ""){ moduleTextContainer.classList.add("hide"); } About UAL Contact us Courses Colleges and Institutes Caption © Alexandra Tomiyama (2017) A world-class university, shaping the creative industries worldwide. University of the Arts London (UAL) generates and inspires the creativity the world needs for a better future. Since 1842 our Colleges have been defining creative education. With curiosity, imagination and intent we make work which creates lasting change for people and our planet.London is core to who we are, a place where we meet and share ideas with people from different backgrounds and cultures. Our creative network influences learning, culture, industry and society on a global scale.Our academics and practitioners deliver creative education and inspire new ways of thinking through research and innovation. We work with students at every level from pre-degree, undergraduate and postgraduate to short courses and online learning, enabling them to build the careers they want.As a University we are ranked second in the world for Art and Design. We are formed of 6 Colleges with unique histories and identities; Camberwell College of Arts, Central Saint Martins, Chelsea College of Arts, London College of Communication, London College of Fashion and Wimbledon College of Arts. Together, we are a community of makers, thinkers, pioneers and storytellers redesigning the future. Contact us Arrow Right Find the contact information you need. Start your creative future Toggle caption Caption Ruijie Shen MA Interior and Spatial Design, Camberwell College of Arts, UAL | Courses Browse all courses at UAL. We offer pre-degree, undergraduate, postgraduate and short courses. Toggle caption Caption Interview with Teshome Samuel image by Alys Tomlinson Colleges and Institutes Learn more about our Colleges and Institutes. Toggle caption Caption Kate Petersons, 2023 BA Design for Branded Spaces, London College of Communication, UAL Strategy and governance Find out how we're bringing creativity to the world with our 10-year strategy. Toggle caption Caption Mei Zhang (Study Abroad Student), Natalie Gibson (Tutor) and Rita Kumari (Specialist Print and Dye Technician and Associate Lecturer), 2013, Study Abroad, UAL | Photograph: Alys Tomlinson Working at UAL Find job opportunities at UAL Everyone's identity mattersUAL is home to a diverse body of 21,092 students from 130 countries. We are proud of our international student and staff community and we are committed to ensuring that the University offers an inclusive and supportive environment for everyone. Toggle caption Caption Petra Raissa Nogueira, '[Black is] light', 2021, BA Fashion Design and Development, London College of Fashion,UAL. Anti-racism strategy We are working together to make UAL an anti-racist University. Learn more about our plans and objectives. Toggle caption Caption Angelica Ellis, 2021 BA Fashion Print, Central Saint Martins, UAL | Photographer: Maria Maleh Equality, diversity and inclusion Learn how UAL creates and supports staff and student diversity. Find groups and forums you can be involved with. Toggle caption Caption Collection of fabric samples at London College of Fashion | Photograph: Ana Blumenkron Ethnic Representation Index See how we're reviewing the progress made by universities in England to become anti-racist institutions. Social Purpose Arrow Right We believe in the value of a creative education to make the world a better place. We're working to embed our social purpose in everything we do and use our position to shape thriving and sustainable creative industries. Climate Action Plan Arrow Right We're taking climate-focused action to change the way we live, teach and work. Creating a just, sustainable future is at the centre of our mission. Press office Arrow Right Contact our media office How we spend our moneyUAL reinvests all of its money to support students with funds put into building development, facilities and course progression. Find out more about how we spend our money and what happens to any surplus. Support and donate Arrow Right Help the next generation of creatives and support our communities. .sbxyz.dark--theme .news-items .news-item h3{ color: #f6f6f6; } .sbxyz.dark--theme .news-items .news-item h3:hover{ color: #e5006e; } .sbxyz.dark--theme .news-items .news-item a{ color: #f6f6f6; } .sbxyz.dark--theme .news-items .news-item a:hover{ color: #e5006e; } .sbxyz.dark--theme .news-items .news-item a .icon-keyboard_arrow_right{ fill: #f6f6f6; } .sbxyz.dark--theme .news-items .news-item a .icon-keyboard_arrow_right:hover{ fill: #e5006e; } UAL stories Caption Karen Stanton, Interim President and Vice-Chancellor, UAL | Photograph: Ella Joyce Professor Karen Stanton assumes role of Interim President and Vice-Chancellor of UAL Prior to joining UAL, Professor Stanton was Interim Vice Chancellor at Bishop Grosseteste University, having previously served as Vice-Chancellor at York St John and Solent Universities. Caption Textile design drawing workshop at Triangle Space, Chelsea College of Arts. 2023. Photograph by Alys Tomlinson. University of the Arts London rises to 13th place in Guardian University Guide University of the Arts London (UAL) has continued its upward trend in the Guardian University Guide ranking – now ranking at 13th place out of 122 institutions for 2025. In five years, UAL has progressed 32 places in the league. Caption Ipsita Kurikala, Illustration for Summer Campus, 2023. Arts Abroad Summer School Grant Caption Rathna Ramanathan, Head of Central Saint Martins and Pro-Vice Chancellor, UAL and Jacky Xu, Founder and CEO of Trendy Group | Photograph: Kenny Xian Central Saint Martins partners with Miss Sixty to pave the future for circular denim University of the Arts London (UAL) is delighted to announce a groundbreaking partnership between Central Saint Martins (CSM) and Trendy Group, a global leader in fashion innovation. Read more stories Arrow Right var blackButtons = document.querySelectorAll('p span.button.black-bg'); var blackButtonsParent = blackButtons.parentNode; blackButtons.forEach(function (value, index) { var buttonTag = value.querySelector('a'); blackButtons[index].parentNode.insertBefore(buttonTag,blackButtons[index].childNode); blackButtons[index].parentNode.removeChild(blackButtons[index]); });'''
