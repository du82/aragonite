full_description = '''.tabs-content .tabs-panel a{ line-height: 140%; color: #fff; text-decoration: underline; } .tabs-content .tabs-panel a:hover{ color: #ff5000; text-decoration: none; } section.header-module-landing .header-module-content{ margin-top: 0; } .dark--theme .card-item .card-item__section .card-item__heading a{ color: #fff; } .dark--theme .card-item .card-item__section .card-item__heading a:hover{ color: #ff5000; } .sbxyz .social-feed{ display:block !important; } //code to hide header module if empty var moduleText = document.querySelector('.header-module-landing--container .header-module-landing .header-module-content .intro .text-center'); var moduleTextContainer = document.querySelector('.header-module-landing--container'); if(moduleText !== null && moduleText.innerHTML === ""){ moduleTextContainer.classList.add("hide"); } We are University of the Arts London University of the Arts London Caption Davinia Clarke, 2023 BA (Hons) Illustration and Visual Media, London College of Communication, UAL | Photograph: Ben Turner Our prospectus Pre-degree courses Postgraduate study Online courses UAL Showcase Student surveys Search form Caption Models by Jaz Martell, photographed by Alys Tomlinson UAL generates and inspires the creativity the world needs. Since 1842 our Colleges have been defining creative education. Our network influences learning, culture, industry and society on a global scale. We inspire new ways of thinking through research and innovation. We're a community of makers, thinkers, pioneers and storytellers redesigning the future. Discover our prospectus Arrow Right Order your copy of our Pre-degree and Undergraduate Prospectus or Postgraduate Guide. Chat to a student Arrow Right Got questions about studying with us? Our student ambassadors are here to help. Stories Caption Luke Chin-Joseph, 2023 BA Fine Art: Sculpture, Camberwell College of Arts, UAL | Photograph: Kristy Noble UAL awarded Bronze for Race Equality Charter The Panel specificall