description = "How UAL gathers and responds to students' views, opinions, ideas and feedback to help us improve courses."
full_description = '''.tabs-content .tabs-panel a{ line-height: 140%; color: #fff; text-decoration: underline; } .tabs-content .tabs-panel a:hover{ color: #ff5000; text-decoration: none; } section.header-module-landing .header-module-content{ margin-top: 0; } .dark--theme .card-item .card-item__section .card-item__heading a{ color: #fff; } .dark--theme .card-item .card-item__section .card-item__heading a:hover{ color: #ff5000; } .sbxyz .social-feed{ display:block !important; } //code to hide header module if empty var moduleText = document.querySelector('.header-module-landing--container .header-module-landing .header-module-content .intro .text-center'); var moduleTextContainer = document.querySelector('.header-module-landing--container'); if(moduleText !== null && moduleText.innerHTML === ""){ moduleTextContainer.classList.add("hide"); } Student surveys Caption Image credit: UAL Brand team Have your say during UAL’s dedicated Survey Season. Your voice matters. Every year we survey students to help inspire change.We’re dedicated to finding out what our students think, so we can improve the experience of studying at UAL. Your feedback helps us improve our courses, your study environment and the support we provide. Read the headlines from the 2024 student surveys.During Survey Season all students are asked to complete a survey relating to their year and type of study, you can find the survey you need to complete below.If you experience any problems accessing or completing the survey, please email StudentSurveys@arts.ac.uk. You can also find out how to give useful feedback.The upcoming Survey Season will be starting on Monday 10 February. Survey for pre-degree and foundation students Toggle caption Caption Image credit: UAL Brand team Further Education Student Survey (FESS). For pre-degree and foundation students, survey opens on 21 April Surveys for undergraduates Toggle caption Caption Image credit: UAL Brand Course Student Survey (CSS) For 1st and 2nd year undergrads and Graduate Diploma students, survey closes 30 April. Toggle caption Caption Image credit: UAL Brand team National Student Survey (NSS) For final year undergrads and FDA students, survey closes 30 April. Surveys for postgraduates Toggle caption Caption Image credit: UAL Brand team Postgraduate Research Experience Survey (PRES) For research postgraduate students, survey closes 30 April. Toggle caption Caption Image credit: UAL Brand team Postgraduate Taught Experience Survey (PTES) For taught postgraduate students, survey closes 30 April. Your voice, our action Caption Zoe Zanon Rives in the studio. MA Fashion: Buying and Merchandising. London College of Fashion. UAL. Cost of living support See how we're supporting students with the rising cost of living. Caption Technological tools at Mini Maker Faire, Elephant & Castle Providing you the technology you need to creatively succeed! We want to empower you to succeed through investing in the technological improvements to infrastructure and systems. Caption Lime Grove garden, 2023. Photo: UAL Enhancing our physical spaces Look around you! Have you noticed the improvements we've been making to our sites? Course Support Service The Course Support Service offers advice and information on a variety of topics to UAL students. Caption Scattered Polaroids, Pride 2023 Campaign Photography, Emma Martin, 2022 BA Photography, London College of Communication, UAL | Campaign design direction: Brand and Creative Services, UAL Championing equality, diversity and inclusion At UAL, we are proud of our diverse student communities and are committed to ensuring an inclusive and supportive environment for everyone. Caption Photography: Alys Tomlinson Building student communities At UAL we are always trying to grow and develop our student communities and encourage you to join in and be a part of something together. How to make your voice heard Toggle caption Caption Photography: Katy Davies Student Reps Find out how students can represent their course and make sure that your voices are heard. Toggle caption Caption Photography: Alys Tomlinson Student Committees Student reps attend committees to ensure that your feedback reaches those who can bring about change – find out more. Toggle caption Caption Photography: Alys Tomlinson Quality assurance Learn more about how UAL ensures that our courses are the best quality, and see how you can take part. var blackButtons = document.querySelectorAll('p span.button.black-bg'); var blackButtonsParent = blackButtons.parentNode; blackButtons.forEach(function (value, index) { var buttonTag = value.querySelector('a'); blackButtons[index].parentNode.insertBefore(buttonTag,blackButtons[index].childNode); blackButtons[index].parentNode.removeChild(blackButtons[index]); });'''
