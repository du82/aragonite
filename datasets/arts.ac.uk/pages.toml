title = "Online courses | UAL"
description = "Join an online course at UAL and develop your creative expertise from anywhere. With a variety of online short courses and online degrees available, you can find the right course to suit your interests, schedule and future career ambitions."
full_description = '''.tabs-content .tabs-panel a{ line-height: 140%; color: #fff; text-decoration: underline; } .tabs-content .tabs-panel a:hover{ color: #ff5000; text-decoration: none; } section.header-module-landing .header-module-content{ margin-top: 0; } .dark--theme .card-item .card-item__section .card-item__heading a{ color: #fff; } .dark--theme .card-item .card-item__section .card-item__heading a:hover{ color: #ff5000; } .sbxyz .social-feed{ display:block !important; } //code to hide header module if empty var moduleText = document.querySelector('.header-module-landing--container .header-module-landing .header-module-content .intro .text-center'); var moduleTextContainer = document.querySelector('.header-module-landing--container'); if(moduleText !== null && moduleText.innerHTML === ""){ moduleTextContainer.classList.add("hide"); } Study with UAL from anywhere in the world Online courses Find an online course Join our short courses newsletter Register your interest in our online degrees Caption Ben Turner, Looking through a zine for an online zine making course by Ben Turner | Photograph: Ben Turner From online short courses to full online degree programmes, you can develop your creative expertise from anywhere in the world with an online course from UAL. Whether you have ambitions to upskill and improve your career opportunities, pursue a new profession, or simply want to expand your personal interests, take the next step in your creative journey with an online course from University of the Arts London (UAL).Choosing to learn online gives you the flexibility to study wherever it suits you without needing to attend classes in person. Each course is developed and taught by our specialist academics, giving you access to the same expert teaching you'd get from studying with us in London.With a variety of short courses and degrees available, you can find the right course to suit your creative interests and career goals. Caption Online student typing on laptop surrounded by notebooks by Ben Turner Our online study options Toggle caption Caption Student pinning material to a mannequin head for a practical online course assignment, by Ben Turner Online short courses Our wide range of online short courses can help inspire a new hobby, give your career a boost or prepare you for further study. We also offer online short courses for creative kids and teens. You can choose between courses that involve 1 or 2 hours of study, are taught over a few days, or opt for a weekly learning programme. With courses available throughout the week, you’ll be able to find something that fits your schedule. Toggle caption Caption Student drawing on paper on their floor during an online workshop, by Ben Turner Online pre-degree course Develop the skills, experience, and portfolio you need for creative undergraduate study without having to move to London. Designed for international students, our Pre-Degree: Online will help you discover your creative interests. Explore a range of subject areas before choosing a specialist pathway. Toggle caption Caption Online student watching a presentation on their laptop at home while cooking, by Ben Turner Online postgraduate courses Our online master’s programmes offer an array of creative disciplines to choose from, including business, fine art, animation, and photography. With the support of experienced tutors and a variety of online resources, you’ll develop industry-ready technical and creative skills and a comprehensive understanding of the creative industries. Toggle caption Caption Student working on their laptop outside | Photograph: Ben Hunter UAL Online UAL Online brings world-leading creative teaching directly to you with courses that are carefully built to suit remote learning. Study flexibly online and work towards a Postgraduate Certificate (PgCert), Postgraduate Diploma (PgDip) or Master of Arts (MA) in Graphic Design, Fashion Business or Fashion Marketing. How you study onlineBy choosing to study online with UAL, you’ll be joining a network of UAL specialists and fellow learners that share your creative interests. You’ll be taught through a range of online learning activities, including online lectures, workshops, self-directed learning, and collaborative group work. Our online courses use a combination of digital learning platforms to enhance your student experience. Find out more about the different digital learning tools in use at UAL.The specific platforms and teaching methods you’ll use will depend on the level of study and subject area you choose to pursue. Whatever and however you choose to study, our experienced team will be there to support you. Caption Online student and tutor talking over a video call, by Ben Turner Sign up to receive the latest news Online short courses Arrow Right Join our short courses newsletter to find out about upcoming online and campus short courses. Online pre-degree and degrees Arrow Right Register your interest in studying a degree online with UAL to learn more about the online courses at our 6 Colleges and the UAL Institutes. var blackButtons = document.querySelectorAll('p span.button.black-bg'); var blackButtonsParent = blackButtons.parentNode; blackButtons.forEach(function (value, index) { var buttonTag = value.querySelector('a'); blackButtons[index].parentNode.insertBefore(buttonTag,blackButtons[index].childNode); blackButtons[index].parentNode.removeChild(blackButtons[index]); });'''
