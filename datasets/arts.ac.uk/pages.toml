full_description = '''.tabs-content .tabs-panel a{ line-height: 140%; color: #fff; text-decoration: underline; } .tabs-content .tabs-panel a:hover{ color: #ff5000; text-decoration: none; } section.header-module-landing .header-module-content{ margin-top: 0; } .dark--theme .card-item .card-item__section .card-item__heading a{ color: #fff; } .dark--theme .card-item .card-item__section .card-item__heading a:hover{ color: #ff5000; } .sbxyz .social-feed{ display:block !important; } //code to hide header module if empty var moduleText = document.querySelector('.header-module-landing--container .header-module-landing .header-module-content .intro .text-center'); var moduleTextContainer = document.querySelector('.header-module-landing--container'); if(moduleText !== null && moduleText.innerHTML === ""){ moduleTextContainer.classList.add("hide"); } Privacy information This privacy page sets out how University of the Arts London (UAL) uses and protects any personal information that you give us when you use this website. UAL is committed to ensuring that your privacy is protected.Who we areUniversity of the Arts London (UAL) of 272 High Holborn, London WC1V 7EY (switchboard 020 7514 6000) is recognised as a data controller under the General Data Protection Regulation and the Data Protection Act 2018.UAL Short Courses Limited (Registered Company number 02361261) and UAL ArtsTemps Limited (Registered Company number 11436364) are wholly owned subsidiaries of UAL which process personal data in relation to short courses and recruitment consultancy on the same premises, and are also recognised as data controllers.Our Data Protection Officer is Kastur Kerai, contactable at dpo@arts.ac.uk orUniversity of the Arts London272 High HolbornLondon, WC1V 7EYYour rightsUnder GDPR, you have:The right to be informed of how your data will be used and protectedThe right to access your information and obtain a copyThe right to make changes to your personal dataThe right to delete your data in certain circumstances, or otherwise to restrict processingThe right to data portabilityThe right to object to direct marketing and other processingRights in relation to automated decision making and profilingFor more information visit the Information Commissioner's Office (ICO) website.You have the right to request access to information, subject to certain restrictions.To make a Subject Access Request for your personal data, report a breach or to request the sharing of personal data outside of normal processes, please email dpo@arts.ac.uk.To request a correction, restriction of processing, the deletion of personal data or the review of an automated decision please contact the relevant department directly (e.g. HR for staff, Academic Registry for students).ComplaintsUniversity of the Arts London is regulated by the Information Commissioner’s Office (ICO), registration number Z5620514, UAL Short Courses Limited under registration number Z5634620, and UAL ArtsTemps Limited under registration number ZB029054.Please address any complaints in the first instance to our Data Protection Officer. If you are not satisfied with the response, complaints about handling of personal data by either organisation can be addressed directly to the ICO by using their complaints page or by calling 0303 123 1113.Data processingInformation on how we process personal data in specific circumstances is found on individual Privacy Notices at or near the point of collection.You can find information about how UAL and Short Courses process personal data in general on our General Data Processing Information page. var blackButtons = document.querySelectorAll('p span.button.black-bg'); var blackButtonsParent = blackButtons.parentNode; blackButtons.forEach(function (value, index) { var buttonTag = value.querySelector('a'); blackButtons[index].parentNode.insertBefore(buttonTag,blackButtons[index].childNode); blackButtons[index].parentNode.removeChild(blackButtons[index]); });'''
