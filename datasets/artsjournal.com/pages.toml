ks in tandem with The Knights’ Artistic Directors and Board of Trustees to provide leadership and drive revenue growth, managing the artistic, human, and financial resources of an ambitious and creative orchestral collective at home in New York City and on tour across the US and abroad. Reporting to the Board of Trustees, the Executive Director oversees an annual budget of approximately $2 million, a concert season of up to 25 performances per year including a new residency at Carnegie Hall, seasonal domestic and international tours, recordings on major labels, and an expanding presence in NYC. Acting as the head of fundraising and strategic planning, the Executive Director is responsible for maximizing both earned and contributed revenue and directing a campaign to ensure organizational sustainability. The Executive Director, with the support of the administrative staff, will execute the goals and objectives of the Artistic Directors. and in close collaboration with the musicians of the orchestra. The Executive Director serves as the chief communicator between The Knights and the community, guiding and overseeing all marketing and communications efforts. The Ideal Candidate The ideal candidate will be comfortable and confident in providing leadership to develop and execute comprehensive fundraising plans, including a campaign for organizational sustainability. An excellent knowledge of fiscal management is critical, including the ability to maximize earned income opportunities and increase contributed income. They will be energetic, innovative and committed to the musicians and mission of the orchestra. The ideal candidate will be knowledgeable about the field of classical music, and is experienced in the management of performing ensembles, budgeting and financial reporting, and marketing in print and on digital platforms. The ideal candidate interacts with collegiality, has an extensive background in building and motivating teams, and exhibits exemplary communication skills. They are flexible and adaptable, willing and able to accommodate and adjust to differing styles of management and communication. The ideal candidate is an adept negotiator; the candidate is accomplished in building patron relations, has a demonstrated track record in fundraising with institutional and individual donors, and brings an established network of contacts throughout the field. Previous experience in the New York City performing arts community, while not essential, is important. The ideal candidate is proficient in Microsoft Office, Google Suite, Quickbooks, and Patron Manager or other fundraising software. Qualified applicants will have an undergraduate degree as well as 10+ years of relevant experience in increasingly senior-level positions. This is a full-time exempt position based in New York City. The Knights’ administrative office is currently located in downtown Brooklyn. Evening and weekend hours may be required based on the schedule of concerts and events, which comprise approx'''
